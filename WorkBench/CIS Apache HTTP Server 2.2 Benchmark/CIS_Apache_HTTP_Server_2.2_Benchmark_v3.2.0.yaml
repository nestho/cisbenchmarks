- id: 1.3.5
  title: Apache Directory and File Permissions
  scoring: scored
  profile:
  - Level 1
  description: The permission on the Apache directories should be rwxr-xr-x (755) and the file permissions should be similar
    except not executable if executable is not appropriate. This applies to all of the Apache software directories and files
    installed with the possible exception in some cases may have a designated group with write access for the Apache web 26
    | P a g e document root ($APACHE_PREFIX/htdocs) are likely to need a designated group to allow web content to be updated.
