- id: 1.6.3
  title: Log Monitoring
  scoring: scored
  profile:
  - Level 1
  description: 'Collecting the Apache logs is an important start, but there must be a monitoring process that will review
    the logs for indications of potential attack or abuse. The monitoring process should be at least on a daily process, and
    more frequently for high risk environment or large installations. Log collection and analysis tools are important to making
    the monitoring process effective. Some of the most popular and recommended log monitoring tools include:  LogWatch provides
    host based log monitoring and is installed by default on many Linux systems,  Syslog and syslog-ng provides central collection
    is very popular and recommended for medium and larger installations and would feed into a centralized log monitoring process,
     OSSEC is an open source HIDS which optionally includes log collection and monitoring and is useful for all size organizations.
    At a minimum, a processed summary of the web request that resulted in errors (Status codes 400''s - 599) should be reviewed
    daily. Detection of other anomalies like spikes in traffic to specific URL''s and/or from individual IP addresses are
    also desirable, as common attack patterns such as password guessing or attempted blind sql-injection may be detected.'
  rationale: Even with sophisticated tools, log monitoring when done correctly is necessarily one of the more expensive security
    controls, as it requires human effort in the review process as well as investigating of anomalies and handling of incidents.
    It is a way too common mistake to underestimate the tremendous value to the organization in proper monitoring, and hence
    resources for monitoring are not sufficient and/or the log filtering and anomaly detection is turned up to the point where
    attacks and abuse are not detected. Increases in web application attacks has been one of the primary security trends on
    this past decade and is expected to continue for the foreseeable future.
  impact: ''
  references:
  - 1. http://www.logwatch.org/
  - 2. http://www.ossec.net/
  page_start: 59
  audit_raw: '59 | P a g e

    Perform the following steps to determine if the recommended state is implemented:

    1. Verify that a log collection and monitoring process is implemented and configured to send

    appropriate reports and alerts to an individual or a team monitoring the logs.

    2. All of the Apache logs are configure to be included in the implemented log collection and

    monitoring process.

    3. If possible review the log monitoring and incident response process, to ensure they are assigned

    to appropriate staff with sufficient training and resources.'
  remediation: 'Perform the following to implement the recommended state:

    1. Decide on host based log monitoring and/or central log collection, and perform either or both of

    the following:

    1. Install suitable host based log monitoring tools such as LogWatch or OSSEC and

    configure to send appropriate reports and alerts to an individual or a team monitoring

    the logs.

    2. Configure Apache to send logs to the syslog daemon and configure syslog to send to a

    central collection and monitoring system(s).

    2. Develop a log monitoring and incident response process and assign appropriate staff with the

    training and system resources to implement.'
  checks:
  - type: manual_review
    info: '59 | P a g e

