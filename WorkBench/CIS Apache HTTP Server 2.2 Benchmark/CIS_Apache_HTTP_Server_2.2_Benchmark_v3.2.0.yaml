- id: 1.9.1
  title: Set the TimeOut directive to 10 or less
  scoring: scored
  profile:
  - Level 1
  description: The TimeOut directive controls the maximum time in seconds that Apache HTTP server will wait for an Input/Output
    call to complete. It is recommended that the TimeOut directive be set to 10 or less.
  rationale: 'One common technique for DoS is to initiate many connections to the server. By decreasing the timeout for old
    connections, the server can free resources more quickly and be more responsive. By making the server more efficient, it
    will be more resilient to DoS conditions. Important Notice: There is a slow form of DoS attack not adequately mitigated
    by these control, such as the Slow Loris DoS attack of June 2009 http://ha.ckers.org/slowloris/. Upgrading to Apache 2.4
    is recommended.'
  impact: ''
