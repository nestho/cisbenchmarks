- id: 1.3.4
  title: Apache Directory and File Ownership
  scoring: scored
  profile:
  - Level 1
  description: 25 | P a g e The Apache directories and files should be owned by root with the root (or root equivalent) group.
    This applies to all of the Apache software directories and files installed. The only expected exception is that the Apache
    web document root ($APACHE_PREFIX/htdocs) are likely to need a designated group to allow web content to be updated (such
    as webupdate) through a change management process.
  rationale: Setting the appropriate ownership and group on the Apache files and directories can help to prevent/mitigate
    exploitation severity and information disclosure. These changes should also be rechecked to identify any insecure settings
    on a continued basis through a cron job.
  impact: ''
  references: []
  page_start: 25
