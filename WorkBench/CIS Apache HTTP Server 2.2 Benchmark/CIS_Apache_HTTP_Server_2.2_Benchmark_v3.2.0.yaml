- id: 1.5.7
  title: Limit HTTP Request Methods
  scoring: scored
  profile:
  - Level 1
  description: Use the Apache <LimitExcept> directive to restrict unnecessary HTTP request methods of the web server to only
    accept and process the GET, HEAD, POST and OPTIONS HTTP request methods. Refer to the Apache documentation for more details
    http://httpd.apache.org/docs/2.2/mod/core.html#limitexcept
  rationale: 45 | P a g e The HTTP 1.1 protocol supports several request methods which are rarely used and potentially high
    risk. For example methods such as PUT and DELETE are rarely used and should be disabled in keeping with the primary security
    principal of minimize features and options. Also since the usage of these methods is typically to modify resources on
    the web server, they should be explicitly disallowed. For normal web server operation, you will typically need to allow
    only the GET, HEAD and POST request methods. This will allow for downloading of web pages and submitting information to
    web forms. The OPTIONS request method will also be allowed as it used to request which HTTP request methods are allowed.
    Unfortunately the Apache <LimitExcept> directive does not deny the TRACE request method. The TRACE request method will
    be disallowed in another benchmark recommendation with the TraceEnable directive.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/core.html#limitexcept
  - 2. http://www.ietf.org/rfc/rfc2616.txt
  page_start: 45
  audit_raw: 'Perform the following to determine if the recommended state is implemented:

    1. Locate the Apache configuration files and included configuration files.

    2. Search for all <Directory> directives other than the on the OS root directory.

    3. Ensure that group contains a single Order directive within the <Directory> directive with a

    value of allow, deny

