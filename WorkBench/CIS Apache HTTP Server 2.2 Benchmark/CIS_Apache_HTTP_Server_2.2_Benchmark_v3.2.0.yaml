    2. Verify there is a rewrite condition within the global server context that disallows IP based

    requests by requiring a HTTP HOST header similar to the example shown below.

    RewriteCond %{HTTP_HOST} !^www\.example\.com [NC]

    RewriteCond %{REQUEST_URI} !^/error [NC]

    RewriteRule ^.(.*) - [L,F]'
  remediation: 'Perform the following to implement the recommended state:

    1. Load the mod_rewritemodule for Apache by doing either one of the following:

    1. Build Apache with mod_rewrite statically loaded during the build, by adding the --

    enable-rewrite option to the ./configurescript.

    ./configure --enable-rewrite

    2. Or dynamically loading the module with the LoadModule directive in the

    httpd.confconfiguration file.

    LoadModule rewrite_module modules/mod_rewrite.so

    2. Add the RewriteEngine directive to the configuration within the global server context with

    the value of on so that the rewrite engine is enabled.

    53 | P a g e

    RewriteEngine On

    3. Locate the Apache configuration file such as httpd.conf and add the following rewrite

