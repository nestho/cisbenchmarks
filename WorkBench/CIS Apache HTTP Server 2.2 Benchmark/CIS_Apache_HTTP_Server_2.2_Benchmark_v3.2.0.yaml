    \ by Apache and not the hierarchy of the\nlocations within web site URLs.\n<Directory \"/usr/local/apache2/cgi-bin\">\n\
    \ . . .\n Order allow,deny\n . . .\n # Limit HTTP methods\n <LimitExcept GET POST OPTIONS>\n deny from all\n </LimitExcept>\n\
