- id: 1.4.3
  title: Restrict OverRide for the OS Root Directory
  scoring: scored
  profile:
  - Level 1
  description: The Apache OverRide directive allows for .htaccess files to be used to override much of the configuration,
    including authentication, handling of document types, auto generated indexes, access control, and options. When the server
    finds an .htaccess file (as specified by AccessFileName) it needs to know which directives declared in that file can override
    earlier access information. When this directive is set to None, then .htaccess files are completely ignored. In this case,
    the server will not even attempt to read .htaccess files in the filesystem. When this directive is set to All, then any
    directive which has the .htaccess Context is allowed in .htaccess files. Refer to the Apache 2.2 documentation for details
    http://httpd.apache.org/docs/2.2/mod/core.html#allowoverride
  rationale: While the functionality of htaccess files is sometimes convenient, usage decentralizes the access controls and
    increases the risk of configurations being changed or viewed inappropriately by an unintended or rogue .htaccess file.
    Consider also that some of the more common vulnerabilities in web servers and web applications allow the web files to
    be viewed or to be modified, then it is wise to keep the configuration out of the web server from being placed in .htaccess
    files.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/core.html#allowoverride
  page_start: 34
