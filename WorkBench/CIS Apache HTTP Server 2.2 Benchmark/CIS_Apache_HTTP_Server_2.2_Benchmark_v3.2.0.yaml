- id: 1.5.11
  title: Restrict File Extensions
  scoring: scored
  profile:
  - Level 2
  description: Restrict access to inappropriate file extensions that are not expected to be a legitimate part of web sites
    using the FilesMatch directive.
  rationale: There are many files that are often left within the web server document root that could provide an attacker with
    sensitive information. Most often these files are mistakenly left behind after installation, trouble-shooting, or backing
    up files before editing. Regardless of the reason for their creation, these files can still be served by Apache even when
    there is no hyperlink pointing to them. The web administrators should use the FilesMatch directive to restrict access
    to only those file extensions that are appropriate for the web server. Rather than create a list of potentially inappropriate
    file extensions such as .bak, .config, .old, etc, it is recommended instead that a white list of the appropriate and expected
    file extensions for the web server be created, reviewed and restricted with a FilesMatch directive.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/core.html#filesmatch
  page_start: 51
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify that the FilesMatch directive that denies access to all files is present as shown in step 3

    of the remediation with the Order of Deny, Allow.

    2. Verify that there is another FilesMatch directive similar to the one in step 4 of the

    remediation, with an expression that matches the approved file extensions.'
  remediation: "Perform the following to implement the recommended state:\n1. Compile a list of existing file extension on\
    \ the web server. The following find/awk command\nmay be useful, but is likely to need some customization according to\
    \ the appropriate webroot\n51 | P a g e\ndirectories for your web server. Please note that the find command skips over\
    \ any files without\na dot (.) in the file name, as these are not expected to be appropriate web content.\nfind */htdocs\
    \ -type f -name '*.*' | awk -F. '{print $NF }' | sort -u\n2. Review the list of existing file extensions, for appropriate\
    \ content for the web server, remove\nthose that are inappropriate and add any additional file extensions expected to\
    \ be added to the\nweb server in the near future.\n3. Add the FilesMatch directive below which denies access to all files\
    \ by default.\n# Block all files by default, unless specifically allowed.\n<FilesMatch \"^.*$\">\n Order Deny,Allow\n\
    \ Deny from all\n</FilesMatch>\n4. Add another a FilesMatch directive that allows access to those file extensions specifically\n\
    allowed from the review process in step 2. An example FilesMatch directive is below. The file\nextensions in the regular\
    \ expression should match your approved list, and not necessarily the\nexpression below.\n# Allow files with specifically\
    \ approved file extensions\n# Such as (css, htm; html; js; pdf; txt; xml; xsl; ...),\n# images (gif; ico; jpeg; jpg; png;\
    \ ...), multimedia\n<FilesMatch \"^.*\\.(css|html?|js|pdf|txt|xml|xsl|gif|ico|jpe?g|png)$\">\n Order Deny,Allow\n Allow\
