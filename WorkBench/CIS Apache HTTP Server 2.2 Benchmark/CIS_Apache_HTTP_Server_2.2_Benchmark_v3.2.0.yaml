      1. OpenSSL can also be used to validate a certificate as a valid trusted certificate, using a trusted

      bundle of CA certificate. It is important that the CA bundle of certificates be an already validated

      and trusted file in order for the test to be valid.

      66 | P a g e

      $ openssl verify -CAfile /etc/pki/tls/certs/ca-bundle.crt -purpose sslserver

      /etc/pki/tls/certs/example.com.crt

      /etc/pki/tls/certs/e'
    severity: medium
- id: 1.7.3
  title: Protect the Servers Private Key
  scoring: scored
  profile:
  - Level 1
  description: 'It is critical to protect the server''s private key. The server private key is be encrypted by default as
    a means of protecting it, however having it encrypted means that the passphrase is required each time the server is started
    up, and now it is necessary to protect the passphrase as well. The passphrase may be typed in when it is manually started
    up, or provided by an automated program. See http://httpd.apache.org/docs/2.2/mod/mod_ssl.html#sslpassphrasedialog for
    details. To summarize the options are: 1. Use SSLPassPhraseDialog builtin, - Requires a passphrase to be manually entered.
    2. Use SSLPassPhraseDialog |/path/to/program to provide the passphrase. 3. Use SSLPassPhraseDialog exec:/path/to/program
    to provide the passphrase, 4. Store the private key in clear text so that a passphrase is not required. 69 | P a g e Any
    of the above options 1-4 are acceptable as long as the key and passphrase are protected as described below. Option 1 has
    the additional security benefit of not storing the passphrase, but is not generally acceptable for most production web
    servers, since it requires the web server to be manually started. Options 2 and 3 can provide additional security if the
    programs providing them are secure. Option 4 is the simplest, is widely used and is acceptable as long as the private
    key is appropriately protected.'
  rationale: If the private key were to be disclosed, it could be used to decrypt all of the SSL communications with the web
    server, and could also be used to impersonate the web server.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/mod_ssl.html
  page_start: 69
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. For each certificate file referenced in the Apache configuration files with the

    SSLCertificateFile directive, examine the file for a private key, clearly identified by the

    string "PRIVATE KEY—--"

    2. For each file referenced in the Apache configuration files with the SSLCertificateKeyFile

    directive, verify the ownership is root:root and the permission 0400.'
  remediation: 'Perform the following to implement the recommended state:

    1. All private keys must be stored separately from the public certificates. Find all

    SSLCertificateFile directives in the Apache configuration files. For any

    SSLCertificateFile directives that do not have a corresponding separate

    SSLCertificateKeyFile directive, move the key to a separate file from the certificate, and

    add the SSLCertificateKeyFile directive for the key file.

    2. For each the SSLCertificateKeyFile directive , change the ownership and permissions on

    the server private key to owned by root:root with permission 0400.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. For each certificate file referenced in the Apache configuration files with the

      SSLCertificateFile directive, examine the file for a private key, clearly identified by the

      string "PRIVATE KEY—--"

      2. For each file referenced in the Apache configuration files with the SSLCertificateKeyFile

      directive, verify the ownership is root:root and the permission 0400.'
    severity: medium
- id: 1.7.4
  title: Restrict Weak SSL Protocols and Ciphers
  scoring: scored
  profile:
  - Level 1
  description: 70 | P a g e Disable weak SSL protocols and weak ciphers using the SSLProtocol, SSLCipherSuite, and SSLHonorCipherOrder
    directives.
  rationale: 'The SSLv2 protocol is flawed and shouldn''t be used, as it is subject to man-in-the-middle attacks and other
    cryptographic attacks. The SSLv3 and TLSv1 protocols should be used instead, and the newer TLS protocols should be preferred.
    IMPORTANT NOTICE: In October 2011, a new TLS attack, known as BEAST, was widely disclosed against the SSL/TLS CBC based
    ciphers. The attack affected all SSLv3 and TLS1.0 block ciphers that used CBC mode. Since RC4 is a stream cipher it does
    not use CBC mode. To mitigate this vulnerability it is recommended to enable the SSLHonorCipherOrder and then prefer a
    few of the TLS1.2 ciphers, followed by the RC4 ciphers, and then to allow the SSLv3 ciphers which had previously been
    considered strong. It is important to note that the cipher preference is only a mitigation, and will not prevent a client
    from connecting with ciphers that are vulnerable.'
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/mod_ssl.html#sslprotocol
  - 2. http://httpd.apache.org/docs/2.2/mod/mod_ssl.html#sslciphersuite
  page_start: 70
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify the SSLProtocol directive disables SSLv2 is present in the Apache server level

    configuration and every virtual host that is SSL enabled. Also verify the SSLCipherSuite

    directive disables weak ciphers in the Apache server level configuration and every virtual host

    that is SSL enabled.

    2. Alternately the SSL protocols and ciphers supported can be easily tested by connecting to a

    running web server with openssl s_client such as shown

    in http://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29'
  remediation: 'Perform the following to implement the recommended state:

    1. Add or modify the following line in the Apache server level configuration and every virtual host

    that is SSL enabled:

    SSLProtocol -ALL +SSLv3 +TLSv1

    2. Add or modify the following line in the Apache server level configuration and every virtual host

    that is SSL enabled (The second line is long and has been wrapped):

    71 | P a g e

    SSLHonorCipherOrder On

    SSLCipherSuite ECDHE-RSA-AES256-SHA384:AES256SHA256:RC4:HIGH:!MD5:!aNULL:!EDH:!AESGCM

    FIPS Compliance: For servers that fall under FIPS 140-2 compliance requirements, SP80052 provides guidelines for the TLS
    ciphers. To eliminate usage of the RC4 cipher and MD5

    hash which are not deemed FIPS compliant, therefore the cipher suite should disallow MD5

    and RC4. Such as:

    # enable only FIPS 140-2 compliant cyphers

    SSLCipherSuite ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!MD5:!RC4'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify the SSLProtocol directive disables SSLv2 is present in the Apache server level

      configuration and every virtual host that is SSL enabled. Also verify the SSLCipherSuite

      directive disables weak ciphers in the Apache server level configuration and every virtual host

      that is SSL enabled.

      2. Alternately the SSL protocols and ciphers supported can be easily tested by connecting to a

      running web server with open'
    severity: medium
- id: 1.7.5
  title: Restrict Insecure SSL Renegotiation
  scoring: scored
  profile:
  - Level 1
  description: 'There was a man-in-the-middle renegotiation attack discovered in SSLv3 and TLSv1 in Nov 2009 (CVE-2009-3555).
    http://cve.mitre.org/cgi-bin/cvename.cgi?name=CAN-20093555 http://www.phonefactor.com/sslgap/ssl-tls-authentication-patches
    First a work around and then a fix was approved as an Internet Standard as RFC 574, Feb 2010. The work around which removes
    the renegotiation is available from OpenSSL as of version 0.9.8l and newer versions. For details: http://www.openssl.org/news/secadv_20091111.txt
    The SSLInsecureRenegotiation directive was added in Apache 2.2.15 for web servers linked with OpenSSL version 0.9.8m or
    later, to allow the insecure renegotiation to provide backward compatibility to clients with the older unpatched SSL implementations.
    While providing backward compatibility, enabling the SSLInsecureRenegotiation directive also leaves the server vulnerable
    to man-in-the-middle renegotiation attack CVE-2009-3555. Therefore the SSLInsecureRenegotiation directive should not be
    enabled. 72 | P a g e'
  rationale: The seriousness and ramification of this attack warrant that servers and clients be upgraded to support the improved
    SSL/TLS protocols. Therefore the recommendation is to not enable the insecure renegotiation.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/mod_ssl.html#sslinsecurerenegotiation
  - 2. http://cve.mitre.org/cgi-bin/cvename.cgi?name=CAN-2009-3555
  - 1.8 Information Leakage
  page_start: 72
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Search the Apache configuration files for the SSLInsecureRenegotiation directive and

    verify that the directive is either not present or has a value of off.'
  remediation: 'Perform the following to implement the recommended state:

    1. Search the Apache configuration files for the SSLInsecureRenegotiation directive. If the directive

    is present modify the value to be off. If the directive is not present then no action is required.

    SSLInsecureRenegotiation off'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Search the Apache configuration files for the SSLInsecureRenegotiation directive and

      verify that the directive is either not present or has a value of off.'
    severity: medium
- id: 1.8.1
  title: Limit Information in the Server Token
  scoring: scored
  profile:
  - Level 1
  description: Configure the Apache ServerTokens directive to provide minimal information. By setting the value to Prod or
    ProductOnly. The only version information given in the server HTTP response header will be "Apache" rather than providing
    detailed on modules and versions installed. 73 | P a g e
  rationale: Information is power, and identifying web server details greatly increases the efficiency of any attack, as security
    vulnerabilities are extremely dependent upon specific software versions and configurations. Excessive probing and requests
    may cause too much "noise" being generated and may tip off an administrator. If an attacker can accurately target their
    exploits, the chances of successful compromise prior to detection increase dramatically. Script Kiddies are constantly
    scanning the Internet and documenting the version information openly provided by web servers. The purpose of this scanning
    is to accumulate a database of software installed on those hosts, which can then be used when new vulnerabilities are
    released.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/core.html#servertokens
  page_start: 73
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

