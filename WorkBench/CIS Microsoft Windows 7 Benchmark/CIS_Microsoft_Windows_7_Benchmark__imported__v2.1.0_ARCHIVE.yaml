- id: 2.1.1.1.1
  title: Set 'Hide mechanisms to remove zone information' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: This policy setting allows you to manage whether users can manually remove the zone information from saved
    file attachments. Typically, users can either click the Unblock button in the file's Property sheet or select a check
    box in the Security Warning dialog. If the zone information is removed, users can open potentially dangerous file attachments
    that Windows has prevented users from opening. When the Hide mechanisms to remove zone information setting is enabled,
    Windows hides the check box and Unblock button. When this policy setting is disabled, Windows displays the check box and
    the Unblock button. Because dangerous attachments are often downloaded from untrusted Internet Explorer zones such as
    the Internet zone, it is recommended that you configure this policy setting to Enabled to help ensure that as much security
    information as possible is retained with each file. Note To configure whether files are saved with zone information, see
    the Do not preserve zone information in file attachments setting.
  rationale: A user might remove information that indicates a file came from an untrustworthy location.
  impact: Users who have a legitimate need to remove zone information from files will not be able to do so.
  references:
  - 1. CCE-9684-2
  page_start: 596
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_USERS\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments:Hid

    eZoneInfoOnProperties'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Windows Components\Attachment

    Manager\Hide mechanisms to remove zone information'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_USERS\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments:Hid

      eZoneInfoOnProperties'
    severity: medium
- id: 2.1.1.1.2
  title: Set 'Do not preserve zone information in file attachments' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: This policy setting allows you to manage whether Windows marks file attachments from Internet Explorer or Microsoft
    Outlook® Express with information about their zone of origin (such as restricted, Internet, intranet, or local). This
    policy setting requires that files be downloaded to NTFS disk partitions to function correctly. If zone information is
    not preserved, Windows cannot make proper risk assessments based on the zone where the attachment came from. If the Do
    not preserve zone information in file attachments setting is enabled, file attachments are not marked with their zone
    information. If this policy setting is disabled, Windows is forced to store file attachments with their zone information.
    Because dangerous attachments are often downloaded from untrusted Internet Explorer zones such as the Internet zone, it
    is recommended that you configure this policy setting to Disabled to help ensure that as much security information as
    possible is preserved with each file.
  rationale: A file that is downloaded from a computer in the Internet or Restricted Sites zone may be moved to a location
    that makes it appear safe, like an intranet file share, and executed by an unsuspecting user.
  impact: None, this is the default configuration.
  references:
  - 1. CCE-10166-7
  page_start: 598
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_USERS\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments:Sav

    eZoneInformation'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Windows Components\Attachment

    Manager\Do not preserve zone information in file attachments'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_USERS\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments:Sav

      eZoneInformation'
    severity: medium
- id: 2.1.1.1.3
  title: Set 'Notify antivirus programs when opening attachments' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: Antivirus programs are mandatory in many environments and provide a strong defense against attack. The Notify
    antivirus programs when opening attachments setting allows you to manage how registered antivirus programs are notified.
    When enabled, this policy setting configures Windows to call the registered antivirus program and have it scan file attachments
    when they are opened by users. If the antivirus scan fails, the attachments are blocked from being opened. If this policy
    setting is disabled, Windows does not call the registered antivirus program when file attachments are opened. To help
    ensure that virus scanners examine every file before it is opened, it is recommended that this policy setting be configured
    to Enabled in all environments. Note An updated antivirus program must be installed for this policy setting to function
    properly.
  rationale: Antivirus programs that do not perform on-access checks may not be able to scan downloaded files.
  impact: When the Notify antivirus programs when opening attachments setting is Enabled, every downloaded file or e-mail
    attachment that the user opens will be scanned.
  references:
  - 1. CCE-10076-8
  - 2.1.2 Control Panel
  page_start: 600
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_USERS\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments:Sca

    nWithAntiVirus'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Windows Components\Attachment

    Manager\Notify antivirus programs when opening attachments'
  checks:
