    to block all outbound connections except those specifically approved by the user or administrator. Microsoft disagrees
    with this opinion, blocking outbound connections by default will force users to deal with a large number of dialog boxes
    prompting them to authorize or block applications such as their web browser or instant messaging software. Additionally,
    blocking outbound traffic has little value because if an attacker has compromised the system they can reconfigure the
    firewall anyway. Some organizations may prefer to avoid alarming users when firewall rules block certain types of network
