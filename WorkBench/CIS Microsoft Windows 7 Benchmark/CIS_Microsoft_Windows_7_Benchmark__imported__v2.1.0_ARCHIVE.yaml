- id: 1.1.1.6.1
  title: Set 'Configure Automatic Updates' to 'Enabled:3 - Auto download and notify for install'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting specifies whether computers in your environment will receive security updates from Windows
    Update or WSUS. If you configure this policy setting to Enabled, the operating system will recognize when a network connection
    is available and then use the network connection to search Windows Update or your designated intranet site for updates
    that apply to them. After you configure this policy setting to Enabled, select one of the following three options in the
    Configure Automatic Updates Properties dialog box to specify how the service will work: . Notify before downloading any
    updates and notify again before installing them. . Download the updates automatically and notify when they are ready to
    be installed. (Default setting) . Automatically download updates and install them on the schedule specified below. If
    you disable this policy setting, you will need to download and manually install any available updates from Windows Update.'
  rationale: Although each version of Windows is thoroughly tested before release, it is possible that problems will be discovered
    after the products are shipped. The Configure Automatic Updates setting can help you ensure that the computers in your
    environment will always have the most recent critical operating system updates and service packs installed.
  impact: Critical operating system updates and service packs will automatically download and install at 3:00 A.M. daily.
  references:
  - 1. CCE-9403-7
  page_start: 103
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\WindowsUpdate\AU:NoAut

    oUpdate'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled. Then set the available option to 3 - Auto download and notify for

    install.

    Computer Configuration\Administrative Templates\Windows Components\Windows

    Update\Configure Automatic Updates'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\WindowsUpdate\AU:NoAut

      oUpdate'
    severity: medium
- id: 1.1.1.6.2
  title: Set 'Reschedule Automatic Updates scheduled installations' to 'Enabled:1'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting determines the amount of time before previously scheduled Automatic Update installations
    will proceed after system startup. If you configure this policy setting to Enabled, a previously scheduled installation
    will begin after a specified number of minutes when you next start the computer. If you configure this policy setting
    to Disabled or Not configured, previously scheduled installations will occur during the next regularly scheduled installation
    time. Note: This policy setting only works when Automatic Updates is configured to perform scheduled update installations.
    If the Configure Automatic Updates setting is Disabled, the Reschedule Automatic Updates scheduled installations setting
    has no effect. You can enable the latter two settings to ensure that previously missed installations will be scheduled
    to install each time the computer restarts.'
  rationale: If Automatic Updates is not forced to wait a few minutes after a restart, computers in your environment might
    not have enough time to completely start all of their applications and services. If you specify enough time after a restart,
    new update installations should not conflict with the computer's startup procedures.
  impact: Automatic Updates will not start until 10 minutes after the computer restarts.
  references:
  - 1. CCE-10205-3
  page_start: 105
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\WindowsUpdate\AU:Resch

    eduleWaitTimeEnabled'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled. Then set the available option to 1.

