- id: 1.1.2.6.2
  title: Configure 'Do not process the legacy run list'
  scoring: manual
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting causes the run list, which is a list of programs that Windows runs automatically when
    it starts, to be ignored. The customized run lists for Windows Vista are stored in the registry at the following locations:
    . HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run . HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run
    You can enable the Do not process the legacy run list setting to help prevent a malicious user from running a program
    each time Windows Vista starts, which could compromise data on the computer or cause other harm. When this policy setting
    is enabled, certain system programs are prevented from running, such as antivirus software, and software distribution
    and monitoring software. It is recommended to evaluate the threat level to your environment before you determine whether
    to use this policy setting for your organization. This policy setting allows you to audit NTLM authentication in a domain
    from this domain controller. This policy is supported on at least Windows Server 2008 R2. Note: Audit events are recorded
    on this computer in the Operational Log located under the Applications and Services Log/Microsoft/Windows/NTLM. This policy
    setting controls the behavior of application installation detection for the computer. The options are: . Enabled: (Default
    for home) When an application installation package is detected that requires elevation of privilege, the user is prompted
    to enter an administrative user name and password. If the user enters valid credentials, the operation continues with
    the applicable privilege. . Disabled: (Default for enterprise) Application installation packages are not detected and
    prompted for elevation. Enterprises that are running standard user desktops and use delegated installation technologies
    such as Group Policy Software Installation or Systems Management Server (SMS) should disable this policy setting. In this
    case, installer detection is unnecessary. This policy setting determines what happens when the smart card for a logged-on
    user is removed from the smart card reader. This policy setting determines who is allowed to format and eject removable
    media. You can use this policy setting to prevent unauthorized users from removing data on one computer to access it on
    another computer on which they have local administrator privileges. This policy setting determines which subsystems are
    used to support applications in your environment. Note: When you configure this setting you specify a list of one or more
    objects. The delimiter used when entering the list is a line feed or carriage return, that is, type the first object on
    the list, press the Enter button, type the next object, press Enter again, etc. The setting value is stored as a comma-delimited
    list in group policy security templates. It is also rendered as a comma-delimited list in Group Policy Editor''s display
    pane and the Resultant Set of Policy console. It is recorded in the registry as a line-feed delimited list in a REG_MULTI_SZ
    value. The registry value entry NoNameReleaseOnDemand was added to the template file in the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Netbt\
    Parameters\ registry key. The entry appears as MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name
    release requests except from WINS servers in the SCE. NetBIOS over TCP/IP is a network protocol that among other things
    provides a way to easily resolve NetBIOS names that are registered on Windowsbased systems to the IP addresses that are
    configured on those systems. This setting determines whether the computer releases its NetBIOS name when it receives a
    name-release request. This policy setting determines whether the SMB client will attempt to negotiate SMB packet signing.
    The implementation of digital signing in Windowsbased networks helps to prevent sessions from being hijacked. If you enable
    this policy setting, the Microsoft network client will use signing only if the server with which it communicates accepts
    digitally signed communication. Microsoft recommends to enable The Microsoft network client: Digitally sign communications
    (if server agrees) setting. Note Enabling this policy setting on SMB clients on your network makes them fully effective
    for packet signing with all clients and servers in your environment. The registry value entry ScreenSaverGracePeriod was
    added to the template file in the HKEY_LOCAL_MACHINE\SYSTEM\Software\Microsoft\ Windows NT\CurrentVersion\Winlogon\ registry
    key. The entry appears as MSS: (ScreenSaverGracePeriod) The time in seconds before the screen saver grace period expires
    (0 recommended) in the SCE. Windows includes a grace period between when the screen saver is launched and when the console
    is actually locked automatically when screen saver locking is enabled. This setting is configured to 0 seconds for both
    of the environments that are discussed in this guide. Microsoft recommends that you use this setting, if appropriate to
    your environment and your organization''s business requirements, to help protect end user computers. This policy setting
    allows text to be specified in the title bar of the window that users see when they log on to the system. This policy
    setting determines how network logons that use local accounts are authenticated. The Classic option allows precise control
    over access to resources, including the ability to assign different types of access to different users for the same resource.
    The Guest only option allows you to treat all users equally. In this context, all users authenticate as Guest only to
    receive the same access level to a given resource. This policy setting determines which behaviors are allowed for applications
    using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI) is used by applications that need authentication
    services. The setting does not modify how the authentication sequence works but instead require certain behaviors in applications
    that use the SSPI. The possible values for the Network security: Minimum session security for NTLM SSP based (including
    secure RPC) clients setting are: . Require message confidentiality. This option is only available in Windows XP and Windows
    Server 2003, the connection will fail if encryption is not negotiated. Encryption converts data into a form that is not
    readable until decrypted. . Require message integrity. This option is only available in Windows XP and Windows Server
    2003, the connection will fail if message integrity is not negotiated. The integrity of a message can be assessed through
    message signing. Message signing proves that the message has not been tampered with; it attaches a cryptographic signature
    that identifies the sender and is a numeric representation of the contents of the message. . Require 128-bit encryption.
    The connection will fail if strong encryption (128-bit) is not negotiated. . Require NTLMv2 session security. The connection
    will fail if the NTLMv2 protocol is not negotiated. . Not Defined. This policy setting determines whether local accounts
    that are not password protected can be used to log on from locations other than the physical computer console. If you
    enable this policy setting, local accounts that have blank passwords will not be able to log on to the network from remote
    client computers. Such accounts will only be able to log on at the keyboard of the computer. When this policy setting
    is enabled, a secure channel can only be established with domain controllers that are capable of encrypting secure channel
    data with a strong (128-bit) session key. To enable this policy setting, all domain controllers in the domain must be
    able to encrypt secure channel data with a strong key, which means all domain controllers must be running Microsoft Windows
    2000 or later. If communication to nonWindows 2000based domains is required, it is recommended that you disable this policy
    setting. This entry appears as MSS: (AutoReboot) Allow Windows to automatically restart after a system crash (recommended
    except for highly secure environments) in the SCE. This entry, when enabled, permits a server to automatically reboot
    after a fatal crash. It is enabled by default, which is undesirable on highly secure servers. You can add this registry
    value to the template file in the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\CrashControl\ subkey. This policy
    setting controls the level of validation a computer with shared folders or printers (the server) performs on the service
    principal name (SPN) that is provided by the client computer when it establishes a session using the server message block
    (SMB) protocol. The server message block (SMB) protocol provides the basis for file and print sharing and other networking
    operations, such as remote Windows administration. The SMB protocol supports validating the SMB server service principal
    name (SPN) within the authentication blob provided by a SMB client to prevent a class of attacks against SMB servers referred
    to as SMB relay attacks. This setting will affect both SMB1 and SMB2. This security setting determines the level of validation
    a SMB server performs on the service principal name (SPN) provided by the SMB client when trying to establish a session
    to an SMB server. This policy setting enables or disables the Administrator account during normal operation. When a computer
    is booted into safe mode, the Administrator account is always enabled, regardless of how this setting is configured. Note
    that this setting will have no impact when applied to the domain controller organizational unit via group policy because
    domain controllers have no local account database. It can be configured at the domain level via group policy, similar
    to account lockout and password policy settings. The registry value entry DisableIPSourceRouting was added to the template
    file in the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Tcpip\Parameters\ registry key. The entry appears as
    MSS: (DisableIPSourceRouting) IP source routing protection level (protects against packet spoofing) in the SCE. IP source
    routing is a mechanism that allows the sender to determine the IP route that a datagram should take through the network.
    It is recommended to configure this setting to Not Defined for enterprise environments and to Highest Protection for high
    security environments to completely disable source routing. This policy setting determines whether a computer can be shut
    down when a user is not logged on. If this policy setting is enabled, the shutdown command is available on the Windows
    logon screen. It is recommended to disable this policy setting to restrict the ability to shut down the computer to users
    with credentials on the system. Microsoft recommends that you use this setting, if appropriate to your environment and
    your organization''s business requirements, to help protect end user computers. This policy setting specifies a text message
    that displays to users when they log on. This policy setting determines what additional permissions are assigned for anonymous
    connections to the computer. If you enable this policy setting, anonymous Windows users are allowed to perform certain
    activities, such as enumerate the names of domain accounts and network shares. An unauthorized user could anonymously
    list account names and shared resources and use the information to guess passwords or perform social engineering attacks.
    This policy setting determines whether to disconnect users who are connected to the local computer outside their user
    account''s valid logon hours. It affects the SMB component. If you enable this policy setting, client sessions with the
    SMB service will be forcibly disconnected when the client''s logon hours expire. If you disable this policy setting, established
    client sessions will be maintained after the client''s logon hours expire. If you enable this policy setting you should
    also enable Network security: Force logoff when logon hours expire. If your organization configures logon hours for users,
    it makes sense to enable this policy setting. This policy setting determines whether an anonymous user can request security
    identifier (SID) attributes for another user, or use a SID to obtain its corresponding user name. Disable this policy
    setting to prevent unauthenticated users from obtaining user names that are associated with their respective SIDs. This
    policy setting controls the behavior of Admin Approval Mode for the built-in Administrator account. The options are: .
    Enabled: The built-in Administrator account uses Admin Approval Mode. By default, any operation that requires elevation
    of privilege will prompt the user to approve the operation. . Disabled: (Default) The built-in Administrator account runs
    all applications with full administrative privilege. This policy setting determines if the server side SMB service is
    able to sign SMB packets if it is requested to do so by a client thattempts to establish a connection. If no signing request
    comes from the client, a connection will be allowed without a signature if the Microsoft network server: Digitally sign
    communications (always) setting is not enabled. Note Enable this policy setting on SMB clients on your network to make
    them fully effective for packet signing with all clients and servers in your environment. This entry appears as MSS: (DisableIPSourceRouting)
