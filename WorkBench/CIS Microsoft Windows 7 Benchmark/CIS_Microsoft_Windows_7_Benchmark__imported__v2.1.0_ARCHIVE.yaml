    like a good idea to configure this policy setting to never automatically unlock an account, such a configuration can increase
    the number of requests that your organization''s help desk receives to unlock accounts that were locked by mistake. If
    this policy setting is enabled, a locked-out account will not be usable until it is reset by an administrator or until
    the account lockout duration expires. This setting will likely generate a number of additional help desk calls. In fact,
    locked accounts cause the greatest number of calls to the help desk in many organizations. If you enforce this setting
    an attacker could cause a denial of service condition by deliberately generating failed logons for multiple user, therefore
    you should also configure the Account Lockout Duration to a relatively low value such as 15 minutes. If you configure
    the Account Lockout Threshold to 0, there is a possibility that an attacker''s attempt to discover passwords with a brute
    force password attack might go undetected if a robust audit mechanism is not in place. If you do not configure this policy
    setting or if the value is configured to an interval that is too long, a DoS attack could occur. An attacker could maliciously
    attempt to log on to each user''s account numerous times and lock out their accounts as described in the preceding paragraphs.
    If you do not configure the Reset account lockout counter after setting, administrators would have to manually unlock
    all accounts. If you configure this policy setting to a reasonable value the users would be locked out for some period,
    after which their accounts would unlock automatically. Be sure that you notify users of the values used for this policy
    setting so that they will wait for the lockout timer to expire before they call the help desk about their inability to
    log on. If your organization uses either the CHAP authentication protocol through remote access or IAS services or Digest
    Authentication in IIS, you must configure this policy setting to Enabled. This setting is extremely dangerous to apply
    through Group Policy on a user-by-user basis, because it requires the appropriate user account object to be opened in
    Active Directory Users and Computers. Requirements for extremely long passwords can actually decrease the security of
    an organization, because users might leave the information in an insecure location or lose it. If very long passwords
    are required, mistyped passwords could cause account lockouts and increase the volume of help desk calls. If your organization
    has issues with forgotten passwords due to password length requirements, consider teaching your users about pass phrases,
    which are often easier to remember and, due to the larger number of character combinations, much harder to discover. Note
    Older versions of Windows such as Windows 98 and Windows NT® 4.0 do not support passwords that are longer than 14 characters.
    Computers that run these older operating systems are unable to authenticate with computers or domains that use accounts
    that require long passwords. If the Maximum password age setting is too low, users are required to change their passwords
    very often. Such a configuration can reduce security in the organization, because users might write their passwords in
    an insecure location or lose them. If the value for this policy setting is too high, the level of security within an organization
    is reduced because it allows potential attackers more time in which to discover user passwords or to use compromised accounts.
    The major impact of this configuration is that users must create a new password every time they are required to change
    their old one. If users are required to change their passwords to new unique values, there is an increased risk of users
    who write their passwords somewhere so that they do not forget them. Another risk is that users may create passwords that
    change incrementally (for example, password01, password02, and so on) to facilitate memorization but make them easier
    to guess. Also, an excessively low value for the Minimum password age setting will likely increase administrative overhead,
    because users who forget their passwords might ask the help desk to reset them frequently. If an administrator sets a
    password for a user but wants that user to change the password when the user first logs on, the administrator must select
    the User must change password at next logon check box, or the user will not be able to change the password until the next
    day. If the default password complexity configuration is retained, additional help desk calls for locked-out accounts
    could occur because users might not be accustomed to passwords that contain non-alphabetic characters. However, all users
    should be able to comply with the complexity requirement with minimal difficulty. If your organization has more stringent
    security requirements, you can create a custom version of the Passfilt.dll file that allows the use of arbitrarily complex
    password strength rules. For example, a custom password filter might require the use of non-upper row characters. (Upper
    row characters are those that require you to hold down the SHIFT key and press any of the digits between 1 and 0.) A custom
    password filter might also perform a dictionary check to verify that the proposed password does not contain common dictionary
    words or fragments. Also, the use of ALT key character combinations can greatly enhance the complexity of a password.
    However, such stringent password requirements can result in unhappy users and an extremely busy help desk. Alternatively,
    your organization could consider a requirement for all administrator passwords to use ALT characters in the 01280159 range.
    (ALT characters outside of this range can represent standard alphanumeric characters that would not add additional complexity
    to the password.)'
