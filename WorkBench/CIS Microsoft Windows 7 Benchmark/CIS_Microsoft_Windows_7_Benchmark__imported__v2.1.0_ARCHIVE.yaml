- id: 1.1.1.5.1
  title: Set 'Turn off Data Execution Prevention for Explorer' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: Disabling data execution prevention can allow certain legacy plug-in applications to function without terminating
    Explorer.
  rationale: Data execution prevention helps reduce the risk of certain classes of attacks by blocking the execution of code
    stored where the system only expects data to be stored.
  impact: Date execution prevent can cause certain plug-in applications for Windows Explorer to fail.
  references:
  - 1. CCE-9918-4
  - 1.1.1.6 Windows Update
