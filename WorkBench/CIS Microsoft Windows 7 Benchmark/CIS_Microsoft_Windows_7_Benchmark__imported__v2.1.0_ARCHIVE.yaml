controls:
- id: 1.1.1.1.4
  title: Set 'Choose drive encryption method and cipher strength' to 'Enabled:AES 256-bit with Diffuser'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  description: This policy setting allows you to configure the algorithm and cipher strength used by BitLocker Drive Encryption.
    This policy setting is applied when you turn on BitLocker. Changing the encryption method has no effect if the drive is
    already encrypted or if encryption is in progress. Consult the BitLocker Drive Encryption Deployment Guide on Microsoft
    TechNet for more information about the encryption methods available. If you enable this policy setting you will be able
    to choose an encryption algorithm and key cipher strength for BitLocker to use to encrypt drives. If you disable or do
    not configure this policy setting, BitLocker will use the default encryption method of AES 128-bit with Diffuser or the
    encryption method specified by the setup script.
  rationale: The use of AES 128 bit key with Diffuser is likely to be strong enough for the majority of applications, but
    those requiring the highest level of security may find this setting suboptimal.
  impact: Using AES 256 with diffuser will in most cases not significantly impact initial encryption speed and overall computer
    performance when used.
  references:
  - 1. CCE-8230-5
  - 1.1.1.2 AutoPlay Policies
  page_start: 81
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE:EncryptionMethod'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled. Then set the available option to AES 256-bit with Diffuser.

    Computer Configuration\Administrative Templates\Windows Components\BitLocker

    Drive Encryption\Choose drive encryption method and cipher strength'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE:EncryptionMethod'
    severity: medium
- id: 1.1.1.2.1
  title: Set 'Turn off Autoplay' to 'Enabled:All drives'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: Autoplay starts to read from a drive as soon as you insert media in the drive, which causes the setup file
    for programs or audio media to start immediately. An attacker could use this feature to launch a program to damage the
    computer or data on the computer. You can enable the Turn off Autoplay setting to disable the Autoplay feature. Autoplay
    is disabled by default on some removable drive types, such as floppy disk and network drives, but not on CD-ROM drives.
    Note You cannot use this policy setting to enable Autoplay on computer drives in which it is disabled by default, such
    as floppy disk and network drives. This policy requires Windows Vista or later versions of Windows. This policy setting
    specifies the maximum size of the log file in kilobytes. If you enable this policy setting, you can configure the maximum
    log file size to be between 1 megabyte (1024 kilobytes) and 2 terabytes (2147483647 kilobytes) in kilobyte increments.
    If you disable or do not configure this policy setting, the maximum size of the log file maximum size will be set to the
    local configuration value. This value can be changed by the local administrator using the log properties dialog and it
    defaults to 20 megabytes. For backwards compatibility the same setting can also be configured at Computer Configuration\Windows
    Settings\Security Settings\Event Log, if set at both locations this one will take precedence. This policy setting controls
    Event Log behavior when the log file reaches its maximum size. Old events may or may not be retained according to the
    Backup log automatically when full policy setting.
  rationale: An attacker could use this feature to launch a program to damage a client computer or data on the computer. If
    events are not recorded it may be difficult or impossible to determine the root cause of system problems or the unauthorized
    activities of malicious users If new events are not recorded it may be difficult or impossible to determine the root cause
    of system problems or the unauthorized activities of malicious users
  impact: Users will have to manually launch setup or installation programs that are provided on removable media. When event
    logs fill to capacity, they will stop recording information unless the retention method for each is set so that the computer
    will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent data, you can configure
    the retention method so that older events are overwritten as needed. The consequence of this configuration is that older
    events will be removed from the logs. Attackers can take advantage of such a configuration, because they can generate
    a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat reduced if
    you automate the archival and backup of event log data. Ideally, all specifically monitored events should be sent to a
    server that uses Microsoft Operations Manager (MOM) or some other automated monitoring tool. Such a configuration is particularly
    important because an attacker who successfully compromises a server could clear the Security log. If all events are sent
    to a monitoring server, then you will be able to gather forensic information about the attacker's activities. When this
    policy setting is enabled and a log file reaches its maximum size, new events are not written to the log and are lost.
    When this policy setting is disabled and a log file reaches its maximum size, new events overwrite old events.
  references:
  - 1. CCE-9528-1
  - 1.1.1.3 Event Log Service
