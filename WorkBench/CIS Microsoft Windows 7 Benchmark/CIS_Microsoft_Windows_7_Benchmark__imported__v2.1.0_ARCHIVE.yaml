- id: 1.1.1.6.3
  title: Set 'No auto-restart with logged on users for scheduled automatic updates installations' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting specifies that Automatic Updates will wait for computers to be restarted by the users
    who are logged on to them to complete a scheduled installation. If you enable the No auto-restart for scheduled Automatic
    Updates installations setting, Automatic Updates does not restart computers automatically during scheduled installations.
    Instead, Automatic Updates notifies users to restart their computers to complete the installations. You should note that
    Automatic Updates will not be able to detect future updates until restarts occur on the affected computers. If you disable
    or do not configure this setting, Automatic Updates will notify users that their computers will automatically restart
    in 5 minutes to complete the installations. The possible values for the No auto-restart for scheduled Automatic Updates
    installations setting are: . Enabled . Disabled . Not Configured Note: This setting applies only when you configure Automatic
    Updates to perform scheduled update installations. If you configure the Configure Automatic Updates setting to Disabled,
    this setting has no effect. This policy setting allows you to manage whether the Install Updates and Shut Down option
    is displayed in the Shut Down Windows dialog box. This policy setting works in conjunction with the following Do not adjust
    default option to ‘Install Updates and Shut Down'' in Shut Down Windows Dialog box setting. This policy setting allows
    you to manage whether the ''Install Updates and Shut Down'' option is allowed to be the default choice in the Shut Down
    Windows dialog. Note that this policy setting has no impact if the Computer Configuration\Administrative Templates\Windows
    Components\Windows Update\Do not display ''Install Updates and Shut Down'' option in Shut Down Windows dialog box policy
    setting is enabled.'
  rationale: Sometimes updates require updated computers to be restarted to complete an installation. If the computer cannot
    restart automatically, then the most recent update will not completely install and no new updates will download to the
    computer until it is restarted. Updates are important for maintaining the ongoing security of a computer, therefore this
    setting should not be enabled. Updates are important for maintaining the ongoing security of a computer, therefore this
    setting should not be enabled.
  impact: If you enable this policy setting, the operating systems on the servers in your environment will restart themselves
    automatically. For critical servers this could lead to a temporary denial of service (DoS) condition. If you disable this
    policy setting, the Install Updates and Shut Down option will display in the Shut Down Windows dialog box if updates are
    available when the user selects the Shut Down option in the Start menu. If you enable this policy setting, the user's
    last shut down choice (Hibernate, Restart, etc.) is the default option in the Shut Down Windows dialog box, regardless
    of whether the 'Install Updates and Shut Down' option is available in the 'What do you want the computer to do?' list.
    If you disable or do not configure this policy setting, the 'Install Updates and Shut Down' option will be the default
    option in the Shut Down Windows dialog box if updates are available for installation at the time the user selects the
    Shut Down option in the Start menu.
