- id: 1.1.1.4.1
  title: Set 'Allow Remote Shell Access' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: This policy setting allows you to manage configuration of remote access to all supported shells to execute
    scripts and commands.
  rationale: Any feature is a potential avenue of attack, those that enable inbound network connections are particularly risky.
    Only enable the use of the Windows Remote Shell on trusted networks and when feasible employ additional controls such
    as IPsec.
  impact: If you enable this policy setting, remote access is allowed to all supported shells to execute scripts and commands.
    If you disable or do not configure this policy setting, remote access is not allowed to all supported shells to execute
    scripts and commands.
  references:
  - 1. CCE-10077-6
  - 1.1.1.5 Windows Explorer
  page_start: 99
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

