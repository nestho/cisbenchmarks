    the firewall. If the firewall allows all traffic to access the system then an attacker may be more easily able to remotely
    exploit a weakness in a network service. Users with administrative privileges might create firewall rules that expose
    the system to remote attack. An attacker could respond to broadcast or multicast message with malicious payloads. A denial
    of service (DoS) condition can be created if an attacker abuses the Account lockout threshold and repeatedly attempts
    to log on with a specific account. Once you configure the Account lockout threshold setting, the account will be locked
    out after the specified number of failed attempts. If you configure the Account lockout duration setting to 0, then the
    account will remain locked out until an administrator unlocks it manually. Password attacks can use automated methods
    to try millions of password combinations for any user account. The effectiveness of such attacks can be almost eliminated
    if you limit the number of failed logons that can be performed. However, a DoS attack could be performed on a domain that
    has an account lockout threshold configured. An attacker could programmatically attempt a series of password attacks against
    all users in the organization. If the number of attempts is greater than the account lockout threshold, the attacker might
    be able to lock out every account. Users can accidentally lock themselves out of their accounts if they mistype their
    password multiple times. To reduce the chance of such accidental lockouts, the Reset account lockout counter after setting
    determines the number of minutes that must elapse before the counter that tracks failed logon attempts and triggers lockouts
    is reset to 0. Enabling this policy setting allows the operating system to store passwords in a weaker format that is
    much more susceptible to compromise and weakens your system security. Types of password attacks include dictionary attacks
    (which attempt to use common words and phrases) and brute force attacks (which try every possible combination of characters).
    Also, attackers sometimes try to obtain the account database so they can use tools to discover the accounts and passwords.
    The longer a password exists the higher the likelihood that it will be compromised by a brute force attack, by an attacker
    gaining general knowledge about the user, or by the user sharing the password. Configuring the Maximum password age setting
    to 0 so that users are never required to change their passwords is a major security risk because that allows a compromised
    password to be used by the malicious user for as long as the valid user is authorized access. The longer a user uses the
    same password, the greater the chance that an attacker can determine the password through brute force attacks. Also, any
    accounts that may have been compromised will remain exploitable for as long as the password is left unchanged. If password
    changes are required but password reuse is not prevented, or if users continually reuse a small number of passwords, the
    effectiveness of a good password policy is greatly reduced. If you specify a low number for this policy setting, users
    will be able to use the same small number of passwords repeatedly. If you do not also configure the Minimum password age
    setting, users might repeatedly change their passwords until they can reuse their original password. Users may have favorite
    passwords that they like to use because they are easy to remember and they believe that their password choice is secure
    from compromise. Unfortunately, passwords are compromised and if an attacker is targeting a specific individual user account,
    with foreknowledge of data about that user, reuse of old passwords can cause a security breach. To address password reuse
    a combination of security settings is required. Using this policy setting with the Enforce password history setting prevents
    the easy reuse of old passwords. For example, if you configure the Enforce password history setting to ensure that users
    cannot reuse any of their last 12 passwords, they could change their password 13 times in a few minutes and reuse the
    password they started with, unless you also configure the Minimum password age setting to a number that is greater than
    0. You must configure this policy setting to a number that is greater than 0 for the Enforce password history setting
    to be effective. Passwords that contain only alphanumeric characters are extremely easy to discover with several publicly
    available tools.'
  impact: 'If you enable this setting, certain computer programs such as antivirus software and software distribution and
    monitoring software are also prevented from execution. You should evaluate the threat level to your environment that this
    setting is designed to safeguard against before you decide on a strategy to use this setting for your organization. If
    you select "Disable" or do not configure this policy setting, the domain controller will not log events for NTLM authentication
    in this domain. If you select "Enable for domain accounts to domain servers," the domain controller will log events for
    NTLM authentication logon attempts for domain accounts to domain servers when NTLM authentication would be denied because
    "Deny for domain accounts to domain servers" is selected in the "Network security: Restrict NTLM: NTLM authentication
    in this domain" policy setting. If you select "Enable for domain accounts," the domain controller will log events for
    NTLM authentication logon attempts that use domain accounts when NTLM authentication would be denied because "Deny for
    domain accounts" is selected in the "Network security: Restrict NTLM: NTLM authentication in this domain" policy setting.
    If you select "Enable for domain servers" the domain controller will log events for NTLM authentication requests to all
    servers in the domain when NTLM authentication would be denied because "Deny for domain servers" is selected in the "Network
    security: Restrict NTLM: NTLM authentication in this domain" policy setting. If you select "Enable all" the domain controller
    will log events for NTLM pass-through authentication requests from its servers and for its accounts which would be denied
    because "Deny all" is selected in the "Network security: Restrict NTLM: NTLM authentication in this domain" policy setting.
    Users will need to provide administrative passwords to be able to install programs. If you select Force Logoff, users
    will have to re-insert their smart cards and re-enter their PINs when they return to their workstations. Enforcing this
    setting on computers used by people who must log onto multiple computers in order to perform their duties could be frustating
    and lower productivity. For example, if network administrators are limited to a single account but need to log into several
    computers simultaneously in order to effectively manage the network enforcing this setting will limit them to logging
    onto one computer at a time. For these reasons it is recommended that this setting only be enforced on workstations used
    for purposes commonly associated with typical users such as document creation and email. Only Administrators will be able
    to format and eject removable media. If users are in the habit of using removable media for file transfers and storage,
    they will need to be informed of the change in policy. Applications that rely on the POSIX subsystem will no longer operate.
    For example, Microsoft Services for Unix (SFU) installs an updated version of the POSIX subsystem that is required, so
    you would need to reconfigure this setting in a Group Policy for any servers that use SFU. An attacker could send a request
