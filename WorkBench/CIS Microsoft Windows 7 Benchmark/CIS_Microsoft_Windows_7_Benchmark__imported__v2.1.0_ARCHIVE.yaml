- id: 1.1.1.9.1
  title: Configure 'Prevent the computer from joining a homegroup'
  scoring: manual
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: By default, users can add their computer to a homegroup on a home network. If you enable this policy setting,
    a user on this computer will not be able to add this computer to a homegroup. This setting does not affect other network
    sharing features. If you disable or do not configure this policy setting, a user can add this computer to a homegroup.
    However, data on a domain-joined computer is not shared with the homegroup. Dictates whether or not Windows is allowed
    to use standby states when sleeping the computer. When this policy is enabled, Windows may use standby states to sleep
    the computer. If this policy is disabled, the only sleep state a computer may enter is hibernate. Specifies whether or
    not the user is prompted for a password when the system resumes from sleep. Dictates whether or not Windows is allowed
    to use standby states when sleeping the computer. When this policy is enabled, Windows may use standby states to sleep
    the computer. If this policy is disabled, the only sleep state a computer may enter is hibernate. Specifies whether or
    not the user is prompted for a password when the system resumes from sleep. This policy setting controls whether Windows
    will download a list of providers for the Web publishing and online ordering wizards. This policy setting specifies whether
    Windows will search Windows Update for device drivers when no local drivers for a device are present. Note See also Turn
    off Windows Update device driver search prompt in Administrative Templates/System, which governs whether an administrator
    is prompted before Windows Update is searched for device drivers if a driver is not found locally. This policy setting
    specifies whether the tasks Publish this file to the Web, Publish this folder to the Web, and Publish the selected items
    to the Web are available from File and Folder Tasks in Windows folders. This policy setting specifies whether Windows
    Messenger can collect anonymous information about how the Windows Messenger software and service is used. This policy
    setting specifies whether Search Companion should automatically download content updates during local and Internet searches.
    This policy setting controls whether the computer can download print driver packages over HTTP. To set up HTTP printing,
    printer drivers that are not available in the standard operating system installation might need to be downloaded over
    HTTP. This policy setting allows you to disable the client computer's ability to print over HTTP, which allows the computer
    to print to printers on the intranet as well as the Internet.
  rationale: By default, domain joined computers can be joined to a HomeGroup. While resources on a domain-joined computer
    cannot be shared to the HomeGroup, information from the domain-joined computer can be leaked to other computers in the
    HomeGroup. System sleep states (S1-S3) keep power to the RAM which may contain secrets, such as the BitLocker volume encryption
    key. An attacker finding a computer in sleep states (S1-S3) could directly attack the memory of the computer and gain
    access to the secrets through techniques such as RAM reminisce and direct memory access (DMA). Enabling this setting ensures
    that anyone who wakes an unattended computer from sleep state will have to provide logon credentials before they can access
    the system. System sleep states (S1-S3) keep power to the RAM which may contain secrets, such as the BitLocker volume
    encryption key. An attacker finding a computer in sleep states (S1-S3) could directly attack the memory of the computer
    and gain access to the secrets through techniques such as RAM reminisce and direct memory access (DMA). Enabling this
    setting ensures that anyone who wakes an unattended computer from sleep state will have to provide logon credentials before
    they can access the system. Although the risk is minimal, enabling this setting will reduce the possibility of a user
    unknowingly downloading malicious content through this feature. If users are able to download and install device drivers
    there is a small chance that they will install a driver that reduces system stability. There is an even smaller possibility
    that they will install a driver that includes malicious code. These risks are very low because Microsoft requires vendors
    to test drivers extensively before they can be published on Windows Update. Users may publish confidential or sensitive
    information to a public service outside of the control of the organization. Large enterprise environments may not want
    to have information collected from managed client computers. There is a small risk that users will unknowingly reveal
    sensitive information because of the topics they are searching for. This risk is very low because even if this setting
    is enabled users still must submit search queries to the desired search engine in order to perform searches. Users might
    download drivers that include malicious code. Information that is transmitted over HTTP through this capability is not
    protected and can be intercepted by malicious users. For this reason, it is not often used in enterprise environments.
  impact: Mobile users who access printers and other shared devices on their home networks will not be able to leverage the
    ease of use provided by HomeGroup functionality. Users will not be able to use Sleep (S3) which resumes faster than Hibernation
    (S4). If you enable this policy, or if it is not configured, the user is prompted for a password when the system resumes
    from sleep. If you disable this policy, the user is not prompted for a password when the system resumes from sleep. Users
    will not be able to use Sleep (S3) which resumes faster than Hibernation (S4). If you enable this policy, or if it is
    not configured, the user is prompted for a password when the system resumes from sleep. If you disable this policy, the
    user is not prompted for a password when the system resumes from sleep. If this policy setting is enabled, Windows is
    prevented from downloading providers; only the service providers cached in the local registry will display. Users will
    not be able to download new or updated device drivers from Windows Update. The Web Publishing wizard is used to download
    a list of providers and allow users to publish content to the Web. Microsoft uses information collected through the Customer
    Experience Improvement Program to detect software flaws so that they can be corrected more quickly, enabling this setting
    will reduce the amount of data Microsoft is able to gather for this purpose. Internet searches will still send the search
    text and information about the search to Microsoft and the chosen search provider. If you select Classic Search, the Search
    Companion feature will be unavailable. You can select Classic Search by clicking Start, Search, Change Preferences, and
    then Change Internet Search Behavior. This policy setting does not prevent the client computer from printing to printers
    on the intranet or the Internet over HTTP. It only prohibits drivers that are not already installed locally from downloading.
    If you enable this policy setting, the client computer will not be able to print to Internet printers over HTTP. This
    policy setting affects the client side of Internet printing only. Regardless of how it is configured, a computer could
    act as an Internet Printing server and make its shared printers available through HTTP.
