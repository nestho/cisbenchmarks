    The default behavior is to block connections unless there are firewall rules to allow the connection. This setting controls
    whether local administrators are allowed to create connection security rules that apply together with connection security
    rules configured by Group Policy. This option is useful if you need to control whether this computer receives unicast
    responses to its outgoing multicast or broadcast messages. This policy setting determines the length of time that must
    pass before a locked account is unlocked and a user can try to log on again. The setting does this by specifying the number
    of minutes a locked out account will remain unavailable. If the value for this policy setting is configured to 0, locked
    out accounts will remain locked out until an administrator manually unlocks them. Although it might seem like a good idea
    to configure the value for this policy setting to a high value, such a configuration will likely increase the number of
    calls that the help desk receives to unlock accounts locked by mistake. Users should be aware of the length of time a
    lock remains in place, so that they realize they only need to call the help desk if they have an extremely urgent need
    to regain access to their computer. This policy setting determines the number of failed logon attempts before a lock occurs.
    Authorized users can lock themselves out of an account by mistyping their password or by remembering it incorrectly, or
    by changing their password on one computer while logged on to another computer. The computer with the incorrect password
    will continuously try to authenticate the user, and because the password it uses to authenticate is incorrect, a lock
    occurs. To avoid accidental lockout of authorized users, set the account lockout threshold to a high number. The default
    value for this policy setting is 0 invalid logon attempts, which disables the account lockout feature. Because it is possible
    for an attacker to use this lockout state as a denial of service (DoS) by triggering a lockout on a large number of accounts,
    your organization should determine whether to use this policy setting based on identified threats and the risks you want
    to mitigate. There are two options to consider for this policy setting. . Configure the value for Account lockout threshold
    to 0 to ensure that accounts will not be locked out. This setting value will prevent a DoS attack thattempts to lock out
    accounts in your organization. It will also reduce help desk calls, because users will not be able to lock themselves
    out of their accounts accidentally. However, this setting value will not prevent a brute force attack. The following defenses
    should also be considered: . A password policy that forces all users to have complex passwords made up of 8 or more characters.
    . A robust auditing mechanism, which will alert administrators when a series of account lockouts occurs in the environment.
    For example, the auditing solution should monitor for security event 539, which is a logon failure. This event identifies
    that there was a lock on the account at the time of the logon attempt. The second option is: . Configure the value for
    Account lockout threshold to a value that provides users with the ability to mistype their password several times, but
    locks out the account if a brute force password attack occurs. This configuration will prevent accidental account lockouts
    and reduce help desk calls, but will not prevent a DoS attack. This policy setting determines the length of time before
    the Account lockout threshold resets to zero. The default value for this policy setting is Not Defined. If the Account
    lockout threshold is defined, this reset time must be less than or equal to the value for the Account lockout duration
    setting. If you leave this policy setting at its default value or configure the value to an interval that is too long,
    your environment could be vulnerable to a DoS attack. An attacker could maliciously perform a number of failed logon attempts
    on all users in the organization, which will lock out their accounts. If no policy were determined to reset the account
    lockout, it would be a manual task for administrators. Conversely, if a reasonable time value is configured for this policy
    setting, users would be locked out for a set period until all of the accounts are unlocked automatically. This policy
    setting determines whether the operating system stores passwords in a way that uses reversible encryption, which provides
    support for application protocols that require knowledge of the user''s password for authentication purposes. Passwords
    that are stored with reversible encryption are essentially the same as plaintext versions of the passwords. This policy
    setting determines the least number of characters that make up a password for a user account. There are many different
    theories about how to determine the best password length for an organization, but perhaps pass phrase is a better term
    than password. In Microsoft Windows 2000 or later, pass phrases can be quite long and can include spaces. Therefore, a
    phrase such as I want to drink a $5 milkshake is a valid pass phrase; it is a considerably stronger password than an 8
    or 10 character string of random numbers and letters, and yet is easier to remember. Users must be educated about the
    proper selection and maintenance of passwords, especially with regard to password length. In enterprise environments,
    ensure that the value for the Minimum password length setting is configured to 8 characters. This policy setting is long
    enough to provide adequate security. In high security environments, configure the value to 12 characters. This policy
    setting defines how long a user can use their password before it expires. Values for this policy setting range from 0
    to 999 days. If you set the value to 0, the password will never expire. The default value for this policy setting is 42
    days. Because attackers can crack passwords, the more frequently you change the password the less opportunity an attacker
    has to use a cracked password. However, the lower this value is set, the higher the potential for an increase in calls
    to help desk support due to users having to change their password or forgetting which password is current. This policy
    setting determines the number of renewed, unique passwords that have to be associated with a user account before you can
    reuse an old password. The value for this policy setting must be between 0 and 24 passwords. The default value for Windows
    Vista is 0 passwords, but the default setting in a domain is 24 passwords. To maintain the effectiveness of this policy
    setting, use the Minimum password age setting to prevent users from repeatedly changing their password. This policy setting
    determines the number of days that you must use a password before you can change it. The range of values for this policy
    setting is between 1 and 999 days. (You may also set the value to 0 to allow immediate password changes.) The default
    value for this setting is 0 days. This policy setting checks all new passwords to ensure that they meet basic requirements
    for strong passwords. When this policy is enabled, passwords must meet the following minimum requirements: . Not contain
    the user''s account name or parts of the user''s full name that exceed two consecutive characters . Be at least six characters
    in length . Contain characters from three of the following four categories: . English uppercase characters (A through
    Z) . English lowercase characters (a through z) . Base 10 digits (0 through 9) . Non-alphabetic characters (for example,
    !, $, #, %) . A catch-all category of any Unicode character that does not fall under the previous four categories. This
    fifth category can be regionally specific. Each additional character in a password increases its complexity exponentially.
    For instance, a seven-character, all lower-case alphabetic password would have 267 (approximately 8 x 109 or 8 billion)
    possible combinations. At 1,000,000 attempts per second (a capability of many passwordcracking utilities), it would only
    take 133 minutes to crack. A seven-character alphabetic password with case sensitivity has 527 combinations. A seven-character
    case-sensitive alphanumeric password without punctuation has 627 combinations. An eight-character password has 268 (or
    2 x 1011) possible combinations. Although this might seem to be a large number, at 1,000,000 attempts per second it would
    take only 59 hours to try all possible passwords. Remember, these times will significantly increase for passwords that
    use ALT characters and other special keyboard characters such as ! or @. Proper use of the password settings can help
    make it difficult to mount a brute force attack.'
  rationale: 'A malicious user could configure a program to be run each time Windows starts that could compromise data on
    the computer or cause other harm. NTLM is a Microsoft-developed authentication protocol that uses a challenge-response
    mechanism for authentication, in which client computers can prove their identities without sending a password to the server.
    The protocol employs three types of messages to negotiate the request, challenge the authenticity of the sender, and perform
    the authentication. Kerberos is a more robust protocol and is the preferred method of authentication when available. Some
    malicious software will attempt to install itself after being given permission to run. For example, malicious software
    with a trusted application shell. The user may have given permission for the program to run because the program is trusted,
    but if they are then prompted for installation of an unknown component this provides another way of trapping the software
    before it can do damage Users sometimes forget to lock their workstations when they are away from them, allowing the possibility
    for malicious users to access their computers. If smart cards are used for authentication, the computer should automatically
    lock itself when the card is removed to ensure that only the user with the smart card is accessing resources using those
    credentials. Users may be able to move data on removable disks to a different computer where they have administrative
    privileges. The user could then take ownership of any file, grant themselves full control, and view or modify any file.
    The fact that most removable storage devices will eject media by pressing a mechanical button diminishes the advantage
    of this policy setting. The POSIX subsystem is an Institute of Electrical and Electronic Engineers (IEEE) standard that
    defines a set of operating system services. The POSIX subsystem is required if the server supports applications that use
    that subsystem. The POSIX subsystem introduces a security risk that relates to processes that can potentially persist
    across logons. If a user starts a process and then logs out, there is a potential that the next user who logs on to the
    computer could access the previous user''s process. This potential is dangerous, because anything the second user does
    with that process will be performed with the privileges of the first user. The NetBT protocol is designed not to use authentication,
    and is therefore vulnerable to spoofing. Spoofing makes a transmission appear to come from a user other than the user
    who performed the action. A malicious user could exploit the unauthenticated nature of the protocol to send a name-conflict
    datagram to a target computer, which would cause the computer to relinquish its name and not respond to queries. The result
    of such an attack could be to cause intermittent connectivity issues on the target computer, or even to prevent the use
    of Network Neighborhood, domain logons, the NET SEND command, or additional NetBIOS name resolution. For more information,
    see the Microsoft Knowledge Base article "MS00-047: NetBIOS Vulnerability May Cause Duplicate Name on the Network Conflicts"
    at http://support.microsoft.com/default.aspx?kbid=269239. Session hijacking uses tools that allow attackers who have access
    to the same network as the client or server to interrupt, end, or steal a session in progress. Attackers can potentially
    intercept and modify unsigned SMB packets and then modify the traffic and forward it so that the server might perform
    undesirable actions. Alternatively, the attacker could pose as the server or client after legitimate authentication and
    gain unauthorized access to data. SMB is the resource sharing protocol that is supported by many Windows operating systems.
    It is the basis of NetBIOS and many other protocols. SMB signatures authenticate both users and the servers that host
    the data. If either side fails the authentication process, data transmission will not take place. The default grace period
    that is allowed for user movement before the screen saver lock takes effect is five seconds. If you leave the default
    grace period configuration, your computer is vulnerable to a potential attack from someone who could approach the console
    and attempt to log on to the computer before the lock takes effect. An entry to the registry can be made to adjust the
    length of the grace period. Displaying a warning message before logon may help prevent an attack by warning the attacker
    about the consequences of their misconduct before it happens. It may also help to reinforce corporate policy by notifying
    employees of the appropriate policy during the logon process. With the Guest only model, any user who can authenticate
    to your computer over the network does so with guest privileges, which probably means that they will not have write access
    to shared resources on that computer. Although this restriction does increase security, it makes it more difficult for
    authorized users to access shared resources on those computers because ACLs on those resources must include access control
    entries (ACEs) for the Guest account. With the Classic model, local accounts should be password protected. Otherwise,
