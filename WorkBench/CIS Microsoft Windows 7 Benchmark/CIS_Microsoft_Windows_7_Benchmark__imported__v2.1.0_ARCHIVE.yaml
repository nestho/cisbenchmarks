- id: 1.1.1.6.6
  title: Configure 'Specify intranet Microsoft update service location'
  scoring: manual
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting allows you to specify an intranet server to host updates from the Microsoft Update Web
    site. You can then use this update service location to automatically update computers on your network. The Automatic Updates
    client will search this service for updates that apply to the computers on your network. To use the Specify intranet Microsoft
    update service location setting, you must set two server name values: the server from which the Automatic Updates client
    detects and downloads updates, and the server to which updated workstations upload statistics. You can set both values
    to be the same server. If you enable the Specify intranet Microsoft update service location setting, the Automatic Updates
    client will connect to the specified intranet Microsoft update service server (instead of Windows Update) to search for
    and download updates. This configuration allows end users in your organization to avoid firewall issues, and provides
    you with an opportunity to test updates before you deploy them. If you disable or do not configure this policy setting,
    the Automatic Updates client will connect directly to the Windows Update site on the Internet (if Automatic Updates is
    not disabled by Group Policy or user preference).'
  rationale: By default, Automatic Updates will attempt to download updates from the Microsoft Windows Update Web site. Some
    organizations want to verify that all new updates are compatible with their particular environment before they are deployed.
    Also, if you configure an internal Software Update Services (SUS) server you will help reduce the load on perimeter firewalls,
    routers, and proxy servers, as well as the load on external network links.
  impact: Critical updates and service packs will have to be proactively managed by the organization's IT staff.
  references:
  - 1. CCE-15883-2
