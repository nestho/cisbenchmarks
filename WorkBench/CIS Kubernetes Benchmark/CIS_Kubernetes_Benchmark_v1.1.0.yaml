controls:
- id: 1.1.1
  title: Ensure that the --allow-privileged argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Do not allow privileged containers.
  rationale: The privileged container has all the system capabilities, and it also lifts all the limitations enforced by the
    device cgroup controller. In other words, the container can then do almost everything that the host can do. This flag
    exists to allow special use-cases, like running Docker within Docker and hence should be avoided for production workloads.
  impact: 'You will not be able to run any privileged containers. Note: A number of components used by Kubernetes clusters
    currently make use of privileged containers (e.g. Container Network Interface plugins). Care should be taken in ensuring
    that the use of such plugins is minimized and in particular any use of privileged 15 | P a g e containers outside of the
    kube-system namespace should be scrutinized. Where possible, review the rights required by such plugins to determine if
    a more fine grained permission set can be applied.'
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/user-guide/security-context/
  page_start: 15
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --allow-privileged argument is set to false.'
  remediation: 'Edit the /etc/kubernetes/config file on the master node and set the KUBE_ALLOW_PRIV

    parameter to "--allow-privileged=false":

    KUBE_ALLOW_PRIV="--allow-privileged=false"

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --allow-privileged argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --allow-privileged argument is set to false.'
- id: 1.1.2
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable anonymous requests to the API server.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the API server. You should rely on authentication to authorize access and
    disallow anonymous requests.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/authentication/#anonymous-requests
  page_start: 17
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --anonymous-auth argument is set to false.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the KUBE_API_ARGS

    parameter to "--anonymous-auth=false":

    KUBE_API_ARGS="--anonymous-auth=false"

    Based on your system, restart the kube-apiserver service. For example,

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --anonymous-auth argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --anonymous-auth argument is set to false.'
- id: 1.1.3
  title: Ensure that the --basic-auth-file argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not use basic authentication.
  rationale: Basic authentication uses plaintext credentials for authentication. Currently, the basic authentication credentials
    last indefinitely, and the password cannot be changed without restarting API server. The basic authentication is currently
    supported for convenience. Hence, basic authentication should not be used.
  impact: You will have to configure and use alternate authentication mechanisms such as tokens and certificates. Username
    and password for basic authentication could no more be used.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/authentication/#static-password-file
  page_start: 19
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --basic-auth-file argument does not exist.'
  remediation: 'Follow the documentation and configure alternate mechanisms for authentication. Then,

    edit the /etc/kubernetes/apiserver file on the master node and remove the "--basicauth-file=<filename>" argument from
    the KUBE_API_ARGS parameter.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --basic-auth-file argument does not exist.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --basic-auth-file argument does not exist.'
- id: 1.1.4
  title: Ensure that the --insecure-allow-any-token argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not allow any insecure tokens
  rationale: Accepting insecure tokens would allow any token without actually authenticating anything. User information is
    parsed from the token and connections are allowed.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 21
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-allow-any-token argument does not exist.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and remove the --insecureallow-any-token argument
    from the KUBE_API_ARGS parameter.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-allow-any-token argument does not exist.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-allow-any-token argument does not exist.'
- id: 1.1.5
  title: Ensure that the --kubelet-https argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Use https for kubelet connections.
  rationale: Connections from apiserver to kubelets could potentially carry sensitive data such as secrets and keys. It is
    thus important to use in-transit encryption for any communication between the apiserver and kubelets.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/
  page_start: 23
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --kubelet-https argument either does not exist or is set to true.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and remove the --kubelethttps argument from the
    KUBE_API_ARGS parameter.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --kubelet-https argument either does not exist or is set to true.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --kubelet-https argument either does not exist or is set to true.'
- id: 1.1.6
  title: Ensure that the --insecure-bind-address argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not bind to non-loopback insecure addresses.
  rationale: If you bind the apiserver to an insecure address, basically anyone who could connect to it over the insecure
    port, would have unauthenticated and unencrypted access to your master node. The apiserver doesn't do any authentication
    checking for insecure binds and neither the insecure traffic is encrypted. Hence, you should not bind the apiserver to
    an insecure address.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 25
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-bind-address argument does not exist or is set to 127.0.0.1.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and remove the --insecurebind-address argument
    from the KUBE_API_ADDRESS parameter.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-bind-address argument does not exist or is set to 127.0.0.1.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-bind-address argument does not exist or is set to 127.0.0.1.'
- id: 1.1.7
  title: Ensure that the --insecure-port argument is set to 0
  scoring: scored
  profile:
  - Level 1
  description: Do not bind to insecure port.
  rationale: Setting up the apiserver to serve on an insecure port would allow unauthenticated and unencrypted access to your
    master node. It is assumed that firewall rules are set up such that this port is not reachable from outside of the cluster.
    But, as a defense in depth measure, you should not use an insecure port.
  impact: 'All components that use the API must connect via the secured port, authenticate themselves, and be authorized to
    use the API. This includes:  kube-controller-manager  kube-proxy  kube-scheduler  kubelets 27 | P a g e'
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 27
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-port argument is set to 0.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set --insecure-port=0

    in the KUBE_API_PORT parameter.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-port argument is set to 0.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-port argument is set to 0.'
- id: 1.1.8
  title: Ensure that the --secure-port argument is not set to 0
  scoring: scored
  profile:
  - Level 1
  description: Do not disable the secure port.
  rationale: The secure port is used to serve https with authentication and authorization. If you disable it, no https traffic
    is served and all traffic is served unencrypted.
  impact: You need to set the apiserver up with the right TLS certificates.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 29
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --secure-port argument is either not set or is set to an integer value

    between 1 and 65535.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and either remove the --

    secure-port argument from the KUBE_API_ARGS parameter or set it to a different desired

    port.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --secure-port argument is either not set or is set to an integer value
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --secure-port argument is either not set or is set to an integer value

      between 1 and 65535.'
- id: 1.1.9
  title: Ensure that the --profiling argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable profiling, if not needed.
  rationale: Profiling allows for the identification of specific performance bottlenecks. It generates a significant amount
    of program data that could potentially be exploited to uncover system and program details. If you are not experiencing
    any bottlenecks and do not need the profiler for troubleshooting purposes, it is recommended to turn it off to reduce
    the potential attack surface.
  impact: Profiling information would not be available.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://github.com/kubernetes/community/blob/master/contributors/devel/profi
  page_start: 31
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --profiling argument is set to false.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the KUBE_API_ARGS

    parameter to "--profiling=false":

    KUBE_API_ARGS="--profiling=false"

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --profiling argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --profiling argument is set to false.'
- id: 1.1.10
  title: Ensure that the --repair-malformed-updates argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable fixing of malformed updates.
  rationale: The apiserver will potentially attempt to fix the update requests to pass the validation even if the requests
    are malformed. Malformed requests are one of the potential ways to interact with a service without legitimate information.
    Such requests could potentially be used to sabotage apiserver responses.
  impact: Malformed requests from clients would be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://github.com/kubernetes/kubernetes/issues/15580
  page_start: 33
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --repair-malformed-updates argument is set to false.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the KUBE_API_ARGS

    parameter to "--repair-malformed-updates=false":

    KUBE_API_ARGS="--repair-malformed-updates=false"

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --repair-malformed-updates argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --repair-malformed-updates argument is set to false.'
- id: 1.1.11
  title: Ensure that the admission control policy is not set to AlwaysAdmit
  scoring: scored
  profile:
  - Level 1
  description: Do not allow all requests.
  rationale: Setting admission control policy to AlwaysAdmit allows all requests and do not filter any requests.
  impact: Only requests explicitly allowed by the admissions control policy would be served.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#alwaysadmit
  page_start: 35
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --admission-control argument is set to a value that does not include

    AlwaysAdmit.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the

    KUBE_ADMISSION_CONTROL parameter to a value that does not include AlwaysAdmit.

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --admission-control argument is set to a value that does not include
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --admission-control argument is set to a value that does not include

      AlwaysAdmit.'
- id: 1.1.12
  title: Ensure that the admission control policy is set to AlwaysPullImages
  scoring: scored
  profile:
  - Level 1
  description: Always pull images.
  rationale: Setting admission control policy to AlwaysPullImages forces every new pod to pull the required images every time.
    In a multitenant cluster users can be assured that their private images can only be used by those who have the credentials
    to pull them. Without this admisssion control policy, once an image has been pulled to a node, any pod from any user can
    use it simply by knowing the image’s name, without any authorization check against the image ownership. When this plug-in
    is enabled, images are always pulled prior to starting containers, which means valid credentials are required.
  impact: Credentials would be required to pull the private images every time. Also, in trusted environments, this might increases
    load on network, registry, and decreases speed. 37 | P a g e
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#alwayspullimages
  page_start: 37
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --admission-control argument is set to a value that includes

    AlwaysPullImages.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the

    KUBE_ADMISSION_CONTROL parameter to "--admissioncontrol=...,AlwaysPullImages,...":

    KUBE_ADMISSION_CONTROL="--admission-control=...,AlwaysPullImages,..."

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --admission-control argument is set to a value that includes
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --admission-control argument is set to a value that includes

      AlwaysPullImages.'
- id: 1.1.13
  title: Ensure that the admission control policy is set to DenyEscalatingExec
  scoring: scored
  profile:
  - Level 1
  description: Deny execution of exec and attach commands in privileged pods.
  rationale: Setting admission control policy to DenyEscalatingExec denies exec and attach commands to pods that run with
    escalated privileges that allow host access. This includes pods that run as privileged, have access to the host IPC namespace,
    and have access to the host PID namespace.
  impact: exec and attach commands will not work in privileged pods.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#denyescalatingexec
  page_start: 39
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --admission-control argument is set to a value that includes

    DenyEscalatingExec.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the

    KUBE_ADMISSION_CONTROL parameter to "--admissioncontrol=...,DenyEscalatingExec,...":

    KUBE_ADMISSION_CONTROL="--admission-control=...,DenyEscalatingExec,..."

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --admission-control argument is set to a value that includes
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --admission-control argument is set to a value that includes

      DenyEscalatingExec.'
- id: 1.1.14
  title: Ensure that the admission control policy is set to SecurityContextDeny
  scoring: scored
  profile:
  - Level 1
  description: Restrict pod level SecurityContext customization. Instead of using a customized SecurityContext for your pods,
    use a Pod Security Policy (PSP), which is a cluster-level resource that controls the actions that a pod can perform and
    what it has the ability to access.
  rationale: Setting admission control policy to SecurityContextDeny denies the pod level SecurityContext customization. Any
    attempts to customize the SecurityContexts that are not explicitly defined in the Pod Security Policy (PSP) are blocked.
    This ensures that all the pods adhere to the PSP defined by your organization and you have a uniform pod level security
    posture.
  impact: None 41 | P a g e
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#securitycontextdeny
  page_start: 41
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --admission-control argument is set to a value that includes

    SecurityContextDeny.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the

    KUBE_ADMISSION_CONTROL parameter to "--admissioncontrol=...,SecurityContextDeny,...":

    KUBE_ADMISSION_CONTROL="--admission-control=...,SecurityContextDeny,..."

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --admission-control argument is set to a value that includes
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --admission-control argument is set to a value that includes

      SecurityContextDeny.'
- id: 1.1.15
  title: Ensure that the admission control policy is set to NamespaceLifecycle
  scoring: scored
  profile:
  - Level 1
  description: Reject creating objects in a namespace that is undergoing termination.
  rationale: Setting admission control policy to NamespaceLifecycle ensures that objects cannot be created in non-existent
    namespaces, and that namespaces undergoing termination are not used for creating the new objects. This is recommended
    to enforce the integrity of the namespace termination process and also for the availability of the newer objects.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#namespacelifecycle
  page_start: 43
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --admission-control argument is set to a value that includes

    NamespaceLifecycle.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the

    KUBE_ADMISSION_CONTROL parameter to "--admissioncontrol=NamespaceLifecycle,...":

    KUBE_ADMISSION_CONTROL="--admission-control=NamespaceLifecycle,..."

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --admission-control argument is set to a value that includes
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --admission-control argument is set to a value that includes

      NamespaceLifecycle.'
- id: 1.1.16
  title: Ensure that the --audit-log-path argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Enable auditing on kubernetes apiserver and set the desired audit log path as appropriate.
  rationale: Auditing Kubernetes apiserver provides a security-relevant chronological set of records documenting the sequence
    of activities that have affected system by individual users, administrators or other components of the system. Even though
    currently, Kubernetes provides only basic audit capabilities, it should be enabled. You can enable it by setting an appropriate
    audit log path.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/concepts/cluster-administration/audit/
  page_start: 45
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --audit-log-path argument is set as appropriate.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the KUBE_API_ARGS

    parameter to "--audit-log-path=<filename>":

    KUBE_API_ARGS="--audit-log-path=/var/log/apiserver/audit.log"

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --audit-log-path argument is set as appropriate.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --audit-log-path argument is set as appropriate.'
- id: 1.1.17
  title: Ensure that the --audit-log-maxage argument is set to 30 or as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Retain the logs for at least 30 days or as appropriate.
  rationale: Retaining logs for at least 30 days ensures that you can go back in time and investigate or correlate any events.
    Set your audit log retention period to 30 days or as per your business requirements.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/concepts/cluster-administration/audit/
  page_start: 47
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --audit-log-maxage argument is set to 30 or as appropriate.'
  remediation: 'Edit the /etc/kubernetes/apiserver file on the master node and set the KUBE_API_ARGS

    parameter to "--audit-log-maxage=30":

    KUBE_API_ARGS="--audit-log-maxage=30"

    Based on your system, restart the kube-apiserver service. For example:

    systemctl restart kube-apiserver.service'
