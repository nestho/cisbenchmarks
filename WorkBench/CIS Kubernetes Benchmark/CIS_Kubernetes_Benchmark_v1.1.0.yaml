- id: 2.1.14
  title: Ensure that the RotateKubeletClientCertificate argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Enable kubelet client certificate rotation.
  rationale: 'RotateKubeletClientCertificate causes the kubelet to rotate its client certificates by creating new CSRs as
    its existing credentials expire. This automated periodic rotation ensures that the there are no downtimes due to expired
    certificates and thus addressing availability in the CIA security triad. Note: This recommendation only applies if you
    let kubelets get their certificates from the API server. In case your kubelet certificates come from an outside authority/tool
    (e.g. Vault) then you need to take care of rotation yourself.'
  impact: None 186 | P a g e
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/41912
  - 2. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#kubeletconfiguration
  page_start: 186
  audit_raw: 'Run the following command on each node:

    ps -ef | grep kubelet

    Verify that RotateKubeletClientCertificate argument exists and is set to true.'
  remediation: 'Edit the /etc/kubernetes/kubelet file on each node and set the KUBELET_ARGS parameter

    to a value to include "--feature-gates=RotateKubeletClientCertificate=true".

    KUBELET_ARGS="--feature-gates=RotateKubeletClientCertificate=true"

    Based on your system, restart the kubelet service. For example:

    systemctl restart kubelet.service'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: Verify that RotateKubeletClientCertificate argument exists and is set to true.
    severity: medium
    info: 'Run the following command on each node:

      ps -ef | grep kubelet

      Verify that RotateKubeletClientCertificate argument exists and is set to true.'
