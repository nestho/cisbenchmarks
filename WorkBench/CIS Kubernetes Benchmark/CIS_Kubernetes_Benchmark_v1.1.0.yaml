- id: 3.1.15
  title: Ensure that the --token-auth-file parameter is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not use token based authentication.
  rationale: The token-based authentication utilizes static tokens to authenticate requests to the federation apiserver. The
    tokens are stored in clear-text in a file on the federation apiserver, and cannot be revoked or rotated without restarting
    the federation apiserver. Hence, do not use static token-based authentication.
  impact: You will have to configure and use alternate authentication mechanisms such as certificates. Static token based
    authentication could not be used.
  references:
  - 1. https://kubernetes.io/docs/admin/authentication/#static-token-file
  - 2. https://kubernetes.io/docs/admin/federation-apiserver/
  page_start: 235
  audit_raw: 'Run the following command:

    ps -ef | grep federation-apiserver

    Verify that the --token-auth-file argument does not exist.'
  remediation: 'Follow the documentation and configure alternate mechanisms for authentication. Then,

    edit the deployment specs and remove the --token-auth-file=<filename> argument.

    kubectl edit deployments federation-apiserver-deployment --

    namespace=federation-system'
  checks:
  - type: command
    command: ps -ef | grep federation-apiserver
    expected: Verify that the --token-auth-file argument does not exist.
    severity: medium
    info: 'Run the following command:

