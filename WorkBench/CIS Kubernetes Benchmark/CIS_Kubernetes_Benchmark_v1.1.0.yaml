- id: 3.1.16
  title: Ensure that the --service-account-lookup argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Validate service account before validating token.
  rationale: By default, the apiserver only verifies that the authentication token is valid. However, it does not validate
    that the service account token mentioned in the request is actually present in etcd. This allows using a service account
    token even after the corresponding service account is deleted. This is an example of time of check to time of use security
    issue.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/federation-apiserver/
  - 2. https://github.com/kubernetes/kubernetes/issues/24167
  page_start: 237
  audit_raw: 'Run the following command:

