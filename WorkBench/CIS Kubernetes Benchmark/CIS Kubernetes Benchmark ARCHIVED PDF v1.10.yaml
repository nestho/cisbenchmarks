- id: 1.3.5
  title: Ensure that the --root-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Allow pods to verify the API server's serving certificate before establishing connections.
  rationale: Processes running within pods that need to contact the API server must verify the API server's serving certificate.
    Failing to do so could be a subject to man-in-the-middle attacks. Providing the root certificate for the API server's
    serving certificate to the controller manager with the --root-ca-file argument allows the controller manager to inject
    the trusted bundle into pods so that they can verify TLS connections to the API server.
  impact: You need to setup and maintain root certificate authority file.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-controller-manager/
  - 2. https://github.com/kubernetes/kubernetes/issues/11000
  page_start: 129
  audit_raw: 'Run the following command on the Control Plane node:

    ps -ef | grep kube-controller-manager

    Verify that the --root-ca-file argument exists and is set to a certificate bundle file

    containing the root certificate for the API server''s serving certificate.'
  remediation: 'Edit the Controller Manager pod specification file /etc/kubernetes/manifests/kubecontroller-manager.yaml on
    the Control Plane node and set the --root-ca-file

    parameter to the certificate bundle file`.

    --root-ca-file=<path/to/file>'
  checks:
  - type: command
    command: ps -ef | grep kube-controller-manager
    expected: Verify that the --root-ca-file argument exists and is set to a certificate bundle file
    severity: medium
    info: 'Run the following command on the Control Plane node:

      ps -ef | grep kube-controller-manager

      Verify that the --root-ca-file argument exists and is set to a certificate bundle file

      containing the root certificate for the API server''s serving certificate.'
- id: 1.3.6
  title: Ensure that the RotateKubeletServerCertificate argument is set to true
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Enable kubelet server certificate rotation on controller-manager.
  rationale: 'RotateKubeletServerCertificate causes the kubelet to both request a serving certificate after bootstrapping
    its client credentials and rotate the certificate as its existing credentials expire. This automated periodic rotation
    ensures that the there are no downtimes due to expired certificates and thus addressing availability in the CIA security
    triad. Note: This recommendation only applies if you let kubelets get their certificates from the API server. In case
    your kubelet certificates come from an outside authority/tool (e.g. Vault) then you need to take care of rotation yourself.'
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#approval-controller
  - 2. https://github.com/kubernetes/features/issues/267
  page_start: 131
  audit_raw: 'Run the following command on the Control Plane node:

    ps -ef | grep kube-controller-manager

    Verify that RotateKubeletServerCertificate argument exists and is set to true.'
  remediation: 'Edit the Controller Manager pod specification file /etc/kubernetes/manifests/kubecontroller-manager.yaml on
