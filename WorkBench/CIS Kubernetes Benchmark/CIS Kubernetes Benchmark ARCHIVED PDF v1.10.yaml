      {@..securityContext}\n{end}'''
    severity: medium
- id: 5.2.7
  title: Minimize the admission of root containers
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Do not generally permit containers to be run as the root user.
  rationale: Containers may run as any Linux user. Containers which run as the root user, whilst constrained by Container
    Runtime security features still have a escalated likelihood of container breakout. Ideally, all containers should run
    as a defined non-UID 0 user. There should be at least one admission control policy defined which does not permit root
    containers. If you need to run root containers, this should be defined in a separate policy and you should carefully check
    to ensure that only limited service accounts and users are given permission to use that policy.
  impact: Pods with containers which run as the root user will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-standards/
  page_start: 254
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    restricts the use of root containers by setting MustRunAsNonRoot or MustRunAs with the

    range of UIDs not including 0.'
  remediation: 'Create a policy for each namespace in the cluster, ensuring that either

    MustRunAsNonRoot or MustRunAs with the range of UIDs not including 0, is set.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      restricts the use of root containers by setting MustRunAsNonRoot or MustRunAs with the

      range of UIDs not including 0.'
    severity: medium
- id: 5.2.8
  title: Minimize the admission of containers with the NET_RAW capability
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Do not generally permit containers with the potentially dangerous NET_RAW capability.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. By default this can include
    potentially dangerous capabilities. With Docker as the container runtime the NET_RAW capability is enabled which may be
    misused by malicious containers. Ideally, all containers should drop this capability. There should be at least one admission
    control policy defined which does not permit containers with the NET_RAW capability. If you need to run containers with
    this capability, this should be defined in a separate policy and you should carefully check to ensure that only limited
    service accounts and users are given permission to use that policy.
  impact: Pods with containers which run with the NET_RAW capability will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-and-unprivilegedlinux-containers/
  page_start: 256
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that at least one policy

    disallows the admission of containers with the NET_RAW capability.'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of containers with the NET_RAW capability.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that at least one policy

      disallows the admission of containers with the NET_RAW capability.'
    severity: medium
- id: 5.2.9
  title: Minimize the admission of containers with added capabilities
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Do not generally permit containers with capabilities assigned beyond the default set.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities outside
    this set can be added to containers which could expose them to risks of container breakout attacks. There should be at
    least one policy defined which prevents containers with capabilities beyond the default set from launching. If you need
    to run containers with additional capabilities, this should be defined in a separate policy and you should carefully check
    to ensure that only limited service accounts and users are given permission to use that policy.
  impact: Pods with containers which require capabilities outwith the default set will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-and-unprivilegedlinux-containers/
  page_start: 258
