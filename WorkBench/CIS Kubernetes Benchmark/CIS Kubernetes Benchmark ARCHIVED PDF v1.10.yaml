      check that it does not set streamingConnectionIdleTimeout to 0.'
- id: 4.2.6
  title: Ensure that the --make-iptables-util-chains argument is set to true
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Allow Kubelet to manage iptables.
  rationale: Kubelets can automatically manage the required changes to iptables based on how you choose your networking options
    for the pods. It is recommended to let kubelets manage the changes to iptables. This ensures that the iptables configuration
    remains in sync with pods networking configuration. Manually configuring iptables with dynamic pod network configuration
    changes might hamper the communication between pods/containers and to the outside world. You might have iptables rules
    too restrictive or too open.
  impact: Kubelet would manage the iptables on the system and keep it in sync. If you are using any other iptables management
    solution, then there might be some conflicts.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  page_start: 199
  audit_raw: 'Run the following command on each node:

    ps -ef | grep kubelet

    Verify that if the --make-iptables-util-chains argument exists then it is set to true.

    If the --make-iptables-util-chains argument does not exist, and there is a Kubelet

    config file specified by --config, verify that the file does not set

    makeIPTablesUtilChains to false.'
  remediation: 'If using a Kubelet config file, edit the file to set makeIPTablesUtilChains: true.

    If using command line arguments, edit the kubelet service file

    /etc/kubernetes/kubelet.conf on each worker node and remove the --makeiptables-util-chains argument from the KUBELET_SYSTEM_PODS_ARGS
    variable.

    Based on your system, restart the kubelet service. For example:

    systemctl daemon-reload

    systemctl restart kubelet.service'
