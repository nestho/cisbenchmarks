  title: Ensure that a unique Certificate Authority is used for etcd
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Use a different certificate authority for etcd from the one used for Kubernetes.
  rationale: etcd is a highly available key-value store used by Kubernetes deployments for persistent storage of all of its
    REST API objects. Its access should be restricted to specifically designated clients and peers only. Authentication to
    etcd is based on whether the certificate presented was issued by a trusted certificate authority. There is no checking
    of certificate attributes such as common name or subject alternative name. As such, if any attackers were able to gain
    access to any certificate issued by the trusted certificate authority, they would be able to gain full access to the etcd
    database.
  impact: Additional management of the certificates and keys for the dedicated certificate authority will be required.
  references:
  - 1. https://coreos.com/etcd/docs/latest/op-guide/security.html
  page_start: 153
  audit_raw: 'Review the CA used by the etcd environment and ensure that it does not match the CA

    certificate file used for the management of the overall Kubernetes cluster.

    Run the following command on the master node:

    ps -ef | grep etcd

    Note the file referenced by the --trusted-ca-file argument.

    Run the following command on the master node:

    ps -ef | grep apiserver

    Verify that the file referenced by the --client-ca-file for apiserver is different from

    the --trusted-ca-file used by etcd.'
  remediation: 'Follow the etcd documentation and create a dedicated certificate authority setup for the

    etcd service.

    Then, edit the etcd pod specification file /etc/kubernetes/manifests/etcd.yaml on

    the master node and set the below parameter.

    --trusted-ca-file=</path/to/ca-file>'
  checks:
  - type: command
    command: ps -ef | grep etcd && ps -ef | grep apiserver
    expected: Verify that the file referenced by the --client-ca-file for apiserver is different from
    severity: medium
    info: 'Review the CA used by the etcd environment and ensure that it does not match the CA

      certificate file used for the management of the overall Kubernetes cluster.

      Run the following command on the master node:

      ps -ef | grep etcd

      Note the file referenced by the --trusted-ca-file argument.

      Run the following command on the master node:

      ps -ef | grep apiserver

      Verify that the file referenced by the --clie'
- id: 3.1.1
  title: Client certificate authentication should not be used for users
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes provides the option to use client certificates for user authentication. However as there is no way
    to revoke these certificates when a user leaves an organization or loses their credential, they are not suitable for this
    purpose. It is not possible to fully disable client certificate use within a cluster as it is used for component to component
    authentication.
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. Kubernetes client certificate authentication does not allow for this due to a lack of support for certificate
    revocation.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references: []
  page_start: 156
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of

    Kubernetes client certificate authentication.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of client certificates.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of

      Kubernetes client certificate authentication.'
    severity: medium
- id: 3.1.2
  title: Service account token authentication should not be used for users
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes provides service account tokens which are intended for use by workloads running in the Kubernetes
    cluster, for authentication to the API server. These tokens are not designed for use by end-users and do not provide for
    features such as revocation or expiry, making them insecure. A newer version of the feature (Bound service account token
    volumes) does introduce expiry but still does not allow for specific revocation.
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. Service account token authentication does not allow for this due to the use of JWT tokens as an underlying
    technology.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references: []
  page_start: 158
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of service

    account token authentication.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of service account tokens.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of service

      account token authentication.'
    severity: medium
- id: 3.1.3
  title: Bootstrap token authentication should not be used for users
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes provides bootstrap tokens which are intended for use by new nodes joining the cluster These tokens
    are not designed for use by end-users they are specifically designed for the purpose of bootstrapping new nodes and not
    for general authentication
  rationale: Bootstrap tokens are not intended for use as a general authentication mechanism and impose constraints on user
    and group naming that do not facilitate good RBAC design. They also cannot be used with MFA resulting in a weak authentication
    mechanism being available.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references: []
  page_start: 160
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of

    bootstrap token authentication.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of bootstrap tokens.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of

      bootstrap token authentication.'
    severity: medium
- id: '3.2'
  title: Logging 3.2.1 Ensure that a minimal audit policy is created
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes can audit the details of requests made to the API server. The --auditpolicy-file flag must be set
    for this logging to be enabled.
  rationale: Logging is an important detective control for all systems, to detect potential unauthorised access.
  impact: Audit logs will be created on the master nodes, which will consume disk space. Care should be taken to avoid generating
    too large volumes of log information as this could impact the available of the cluster nodes.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  page_start: 162
  audit_raw: 'Run the following command on one of the cluster master nodes:

    ps -ef | grep kube-apiserver

    Verify that the --audit-policy-file is set. Review the contents of the file specified

    and ensure that it contains a valid audit policy.'
  remediation: Create an audit policy file for your cluster.
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --audit-policy-file is set. Review the contents of the file specified
    severity: medium
    info: 'Run the following command on one of the cluster master nodes:

      ps -ef | grep kube-apiserver

      Verify that the --audit-policy-file is set. Review the contents of the file specified

      and ensure that it contains a valid audit policy.'
- id: 3.2.2
  title: Ensure that the audit policy covers key security concerns
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Ensure that the audit policy created for the cluster covers key security concerns.
  rationale: Security audit logs should cover access and modification of key resources in the cluster, to enable them to form
    an effective part of a security environment.
  impact: Increasing audit logging will consume resources on the nodes or other log destination.
  references:
  - 1. https://github.com/k8scop/k8s-securitydashboard/blob/master/configs/kubernetes/adv-audit.yaml
  - 2. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/#audit-policy
  page_start: 165
  audit_raw: 'Review the audit policy provided for the cluster and ensure that it covers at least the

    following areas :-

    • Access to Secrets managed by the cluster. Care should be taken to only log

    Metadata for requests to Secrets, ConfigMaps, and TokenReviews, in order to

    avoid the risk of logging sensitive data.

    • Modification of pod and deployment objects.

    • Use of pods/exec, pods/portforward, pods/proxy and services/proxy.

    For most requests, minimally logging at the Metadata level is recommended (the most

    basic level of logging).'
  remediation: 'Consider modification of the audit policy in use on the cluster to include these items, at

    a minimum.'
  checks:
  - type: manual_review
    info: 'Review the audit policy provided for the cluster and ensure that it covers at least the

      following areas :-

      • Access to Secrets managed by the cluster. Care should be taken to only log

      Metadata for requests to Secrets, ConfigMaps, and TokenReviews, in order to

      avoid the risk of logging sensitive data.

      • Modification of pod and deployment objects.

      • Use of pods/exec, pods/portforward, pods/proxy and services/proxy.

      For most requests, minimally logging at the Metadata level is recommended (the most'
    severity: medium
