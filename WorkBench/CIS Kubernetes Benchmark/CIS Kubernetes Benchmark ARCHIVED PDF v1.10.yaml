- id: 5.7.2
  title: Ensure that the seccomp profile is set to docker/default in your pod definitions
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Enable docker/default seccomp profile in your pod definitions.
  rationale: Seccomp (secure computing mode) is used to restrict the set of system calls applications can make, allowing cluster
    administrators greater control over the security of workloads running in the cluster. Kubernetes disables seccomp profiles
    by default for historical reasons. You should enable it to ensure that the workloads have restricted actions available
    within the container.
