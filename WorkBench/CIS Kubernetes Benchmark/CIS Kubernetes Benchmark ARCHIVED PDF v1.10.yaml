    get pods -A -o=jsonpath=$''{range .items[*]}{@.metadata.name}:

    {@..securityContext}\n{end}'''
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of conatiners with securityContext: allowPrivilegeEscalation: true'
