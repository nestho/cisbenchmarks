- id: 5.3.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Use network policies to isolate traffic in your cluster network.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. Network Policies are namespace scoped. When a network policy is introduced to a given
    namespace, all traffic not allowed by the policy is denied. However, if there are no network policies in a namespace all
    traffic will be allowed into and out of the pods in that namespace.
  impact: Once network policies are in use within a given namespace, traffic not explicitly allowed by a network policy will
    be denied. As such it is important to ensure that, when introducing network policies, legitimate traffic is not blocked.
  references:
  - 1. https://kubernetes.io/docs/concepts/services-networking/networkpolicies/
  - 2. https://octetz.com/posts/k8s-network-policy-apis
  page_start: 268
  audit_raw: 'Run the below command and review the NetworkPolicy objects created in the cluster.

    kubectl get networkpolicy --all-namespaces

