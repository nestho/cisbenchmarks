- id: 5.2.11
  title: Minimize the admission of Windows HostProcess Containers
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Do not generally permit Windows containers to be run with the hostProcess flag set to true.
  rationale: A Windows container making use of the hostProcess flag can interact with the underlying Windows cluster node.
    As per the Kubernetes documentation, this provides "privileged access" to the Windows node. Where Windows containers are
    used inside a Kubernetes cluster, there should be at least one admission control policy which does not permit hostProcess
    Windows containers. If you need to run Windows containers which require hostProcess, this should be defined in a separate
    policy and you should carefully check to ensure that only limited service accounts and users are given permission to use
    that policy.
  impact: 'Pods defined with securityContext.windowsOptions.hostProcess: true will not be permitted unless they are run under
    a specific policy.'
  references:
