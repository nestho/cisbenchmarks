- id: 4.2.12
  title: Ensure that the Kubelet only makes use of Strong Cryptographic Ciphers
  scoring: manual
  profile:
  - Level 1 - Worker Node
  description: Ensure that the Kubelet is configured to only use strong cryptographic ciphers.
  rationale: TLS ciphers have had a number of known vulnerabilities and weaknesses, which can reduce the protection provided
    by them. By default Kubernetes supports a number of TLS ciphersuites including some that have security concerns, weakening
    the protection provided.
  impact: Kubelet clients that cannot support modern cryptographic ciphers will not be able to make connections to the Kubelet
    API.
  references: []
  page_start: 211
  audit_raw: 'The set of cryptographic ciphers currently considered secure is the following:

    •

    TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

    •

    TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

    •

    TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305

    •

    TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

    •

    TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

    •

    TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

    •

    TLS_RSA_WITH_AES_256_GCM_SHA384

    •

    TLS_RSA_WITH_AES_128_GCM_SHA256

    Run the following command on each node:

    ps -ef | grep kubelet

    If the --tls-cipher-suites argument is present, ensure it only contains values

    included in this set.

    If it is not present check that there is a Kubelet config file specified by --config, and

    that file sets TLSCipherSuites: to only include values from this set.'
  remediation: "If using a Kubelet config file, edit the file to set TLSCipherSuites: to\nTLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM\n\
    _SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_\n256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WI\n\
    TH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES\n_128_GCM_SHA256 or to a subset of these values.\n\
    If using executable arguments, edit the kubelet service file\n/etc/kubernetes/kubelet.conf on each worker node and set\
    \ the --tls-ciphersuites parameter as follows, or to a subset of these values.\n --tls-ciphersuites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM\n\
    _SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM\n_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM\n\
    _SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_GCM_SHA256\nBased on your system, restart the kubelet service.\
    \ For example:\nsystemctl daemon-reload\nsystemctl restart kubelet.service"
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: ''
