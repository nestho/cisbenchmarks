      Run the f'
- id: 4.2.13
  title: Ensure that a limit is set on pod PIDs
  scoring: manual
  profile:
  - Level 1 - Worker Node
  description: Ensure that the Kubelet sets limits on the number of PIDs that can be created by pods running on the node.
  rationale: By default pods running in a cluster can consume any number of PIDs, potentially exhausting the resources available
    on the node. Setting an appropriate limit reduces the risk of a denial of service attack on cluster nodes.
  impact: Setting this value will restrict the number of processes per pod. If this limit is lower than the number of PIDs
    required by a pod it will not operate.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/pid-limiting/#pod-pid-limits
  page_start: 214
  audit_raw: 'Review the Kubelet''s start-up parameters for the value of --pod-max-pids, and check

    the Kubelet configuration file for the PodPidsLimit . If neither of these values is set,

    then there is no limit in place.'
  remediation: Decide on an appropriate level for this parameter and set it, either via the --pod-maxpids command line parameter
    or the PodPidsLimit configuration file setting.
  checks:
  - type: manual_review
    info: 'Review the Kubelet''s start-up parameters for the value of --pod-max-pids, and check

      the Kubelet configuration file for the PodPidsLimit . If neither of these values is set,

      then there is no limit in place.'
    severity: medium
- id: 4.3.1
  title: Ensure that the kube-proxy metrics service is bound to localhost
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Do not bind the kube-proxy metrics port to non-loopback addresses.
  rationale: kube-proxy has two APIs which provided access to information about the service and can be bound to network ports.
    The metrics API service includes endpoints (/metrics and /configz) which disclose information about the configuration
    and operation of kube-proxy. These endpoints should not be exposed to untrusted networks as they do not support encryption
    or authentication to restrict access to the data they provide.
  impact: 3rd party services which try to access metrics or configuration information related to kube-proxy will require access
    to the localhost interface of the node.
  references:
  - 1. https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/
  page_start: 216
  audit_raw: 'review the start-up flags provided to kube proxy

    ps -ef | grep -i kube-proxy

    Ensure that the --metrics-bind-address parameter is not set to a value other than

    127.0.0.1. From the output of this command gather the location specified in the --

    config parameter. Review any file stored at that location and ensure that it does not

    specify a value other than 127.0.0.1 for metricsBindAddress.'
  remediation: Modify or remove any values which bind the metrics service to a non-localhost address
  checks:
  - type: command
    command: ps -ef | grep -i kube-proxy
    expected: ''
    severity: medium
    info: 'review the start-up flags provided to kube proxy

      ps -ef | grep -i kube-proxy

      Ensure that the --metrics-bind-address parameter is not set to a value other than

      127.0.0.1. From the output of this command gather the location specified in the --

      config parameter. Review any file stored at that location and ensure that it does not

      specify a value other than 127.0.0.1 for metricsBindAddress.'
- id: 5.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: The RBAC role cluster-admin provides wide-ranging powers over the environment and should be used only where
    and when needed.
  rationale: Kubernetes provides a set of default roles where RBAC is used. Some of these roles such as cluster-admin provide
    wide-ranging privileges which should only be applied where absolutely necessary. Roles such as cluster-admin allow super-user
    access to perform any action on any resource. When used in a ClusterRoleBinding, it gives full control over every resource
    in the cluster and in all namespaces. When used in a RoleBinding, it gives full control over every resource in the rolebinding's
    namespace, including the namespace itself.
  impact: 'Care should be taken before removing any clusterrolebindings from the environment to ensure they were not required
    for operation of the cluster. Specifically, modifications should not be made to clusterrolebindings with the system: prefix
    as they are required for the operation of system components.'
  references:
  - 1. https://kubernetes.io/docs/admin/authorization/rbac/#user-facing-roles
  page_start: 219
  audit_raw: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

    the clusterrolebinding output for each role binding that has access to the clusteradmin role.

    kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

    Review each principal listed and ensure that cluster-admin privilege is required for it.'
  remediation: 'Identify all clusterrolebindings to the cluster-admin role. Check if they are used and if

    they need this role or if they could use a role with fewer privileges.

    Where possible, first bind users to a lower privileged role and then remove the

    clusterrolebinding to the cluster-admin role :

    kubectl delete clusterrolebinding [name]'
  checks:
  - type: manual_review
    info: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

      the clusterrolebinding output for each role binding that has access to the clusteradmin role.

      kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

      Review each principal listed and ensure that cluster-admin privilege is required for it.'
    severity: medium
- id: 5.1.2
  title: Minimize access to secrets
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials
    used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users
    to reduce the risk of privilege escalation.
  rationale: Inappropriate access to secrets stored within the Kubernetes cluster can allow for an attacker to gain additional
    access to the Kubernetes cluster or external resources whose credentials are stored as secrets.
  impact: Care should be taken not to remove access to secrets to system components which require this for their operation
  references: []
  page_start: 221
  audit_raw: 'Review the users who have get, list or watch access to secrets objects in the

    Kubernetes API.'
  remediation: Where possible, remove get, list and watch access to secret objects in the cluster.
  checks:
  - type: manual_review
    info: 'Review the users who have get, list or watch access to secrets objects in the

      Kubernetes API.'
    severity: medium
- id: 5.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Kubernetes Roles and ClusterRoles provide access to resources based on sets of objects and actions that can
    be taken on those objects. It is possible to set either of these to be the wildcard "*" which matches all items. Use of
    wildcards is not optimal from a security perspective as it may allow for inadvertent access to be granted when new resources
    are added to the Kubernetes API either as CRDs or in later versions of the product.
  rationale: The principle of least privilege recommends that users are provided only the access required for their role and
    nothing more. The use of wildcard rights grants is likely to provide excessive rights to the Kubernetes API.
  impact: ''
  references: []
  page_start: 223
  audit_raw: 'Retrieve the roles defined across each namespaces in the cluster and review for

    wildcards

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Where possible replace any use of wildcards in clusterroles and roles with specific

    objects or actions.'
  checks:
  - type: manual_review
    info: 'Retrieve the roles defined across each namespaces in the cluster and review for

      wildcards

      kubectl get roles --all-namespaces -o yaml

      Retrieve the cluster roles defined in the cluster and review for wildcards

      kubectl get clusterroles -o yaml'
    severity: medium
- id: 5.1.4
  title: Minimize access to create pods
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: The ability to create pods in a namespace can provide a number of opportunities for privilege escalation, such
    as assigning privileged service accounts to these pods or mounting hostPaths with access to sensitive data (unless Pod
    Security Policies are implemented to restrict this access) As such, access to create new pods should be restricted to
    the smallest possible group of users.
  rationale: The ability to create pods in a cluster opens up possibilities for privilege escalation and should be restricted,
    where possible.
  impact: Care should be taken not to remove access to pods to system components which require this for their operation
  references: []
  page_start: 225
  audit_raw: Review the users who have create access to pod objects in the Kubernetes API.
  remediation: Where possible, remove create access to pod objects in the cluster.
  checks:
  - type: manual_review
    info: Review the users who have create access to pod objects in the Kubernetes API.
    severity: medium
- id: 5.1.5
  title: Ensure that default service accounts are not actively used.
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: The default service account should not be used to ensure that rights granted to applications can be more easily
    audited and reviewed.
  rationale: Kubernetes provides a default service account which is used by cluster workloads where no specific service account
    is assigned to the pod. Where access to the Kubernetes API from a pod is required, a specific service account should be
    created for that pod, and rights granted to that service account. The default service account should be configured such
    that it does not provide a service account token and does not have any explicit rights assignments.
  impact: All workloads which require access to the Kubernetes API will require an explicit service account to be created.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 227
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service

    account and ensure that it has no roles or cluster roles bound to it apart from the

    defaults.

    Additionally ensure that the automountServiceAccountToken: false setting is in

    place for each default service account.'
  remediation: 'Create explicit service accounts wherever a Kubernetes workload requires specific

    access to the Kubernetes API server.

    Modify the configuration of each default service account to include this value

    automountServiceAccountToken: false'
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service

      account and ensure that it has no roles or cluster roles bound to it apart from the

      defaults.

      Additionally ensure that the automountServiceAccountToken: false setting is in

      place for each default service account.'
    severity: medium
- id: 5.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly
    needs to communicate with the API server
  rationale: Mounting service account tokens inside pods can provide an avenue for privilege escalation attacks where an attacker
    is able to compromise a single pod in the cluster. Avoiding mounting these tokens removes this attack avenue.
  impact: Pods mounted without service account tokens will not be able to communicate with the API server, except where the
    resource is available to unauthenticated principals.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 229
  audit_raw: 'Review pod and service account objects in the cluster and ensure that the option below

    is set, unless the resource explicitly requires this access.

    automountServiceAccountToken: false'
  remediation: 'Modify the definition of pods and service accounts which do not need to mount service

    account tokens to disable it.'
  checks:
  - type: manual_review
    info: 'Review pod and service account objects in the cluster and ensure that the option below

      is set, unless the resource explicitly requires this access.

      automountServiceAccountToken: false'
    severity: medium
- id: 5.1.7
  title: Avoid use of system:masters group
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The special group system:masters should not be used to grant permissions to any user or service account, except
    where strictly necessary (e.g. bootstrapping access prior to RBAC being fully available)
  rationale: The system:masters group has unrestricted access to the Kubernetes API hard-coded into the API server source
    code. An authenticated user who is a member of this group cannot have their access reduced, even if all bindings and cluster
    role bindings which mention it, are removed. When combined with client certificate authentication, use of this group can
    allow for irrevocable cluster-admin level credentials to exist for a cluster.
  impact: Once the RBAC system is operational in a cluster system:masters should not be specifically required, as ordinary
    bindings from principals to the cluster-admin cluster role can be made where unrestricted access is required.
  references:
  - 1. https://github.com/kubernetes/kubernetes/blob/master/pkg/registry/rbac/escalatio
  page_start: 231
  audit_raw: 'Review a list of all credentials which have access to the cluster and ensure that the

    group system:masters is not used.'
  remediation: Remove the system:masters group from all users in the cluster.
  checks:
  - type: manual_review
    info: 'Review a list of all credentials which have access to the cluster and ensure that the

      group system:masters is not used.'
    severity: medium
- id: 5.1.8
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Cluster roles and roles with the impersonate, bind or escalate permissions should not be granted unless strictly
    required. Each of these permissions allow a particular subject to escalate their privileges beyond those explicitly granted
    by cluster administrators
  rationale: The impersonate privilege allows a subject to impersonate other users gaining their rights to the cluster. The
    bind privilege allows the subject to add a binding to a cluster role or role which escalates their effective permissions
    in the cluster. The escalate privilege allows a subject to modify cluster roles to which they are bound, increasing their
    rights to that level. Each of these permissions has the potential to allow for privilege escalation to clusteradmin level.
  impact: There are some cases where these permissions are required for cluster service operation, and care should be taken
    before removing these permissions from system service accounts.
  references:
  - 1. https://www.impidio.com/blog/kubernetes-rbac-security-pitfalls
  - 2. https://raesene.github.io/blog/2020/12/12/Escalating_Away/
  page_start: 233
  audit_raw: 'Review the users who have access to cluster roles or roles which provide the

    impersonate, bind or escalate privileges.'
  remediation: Where possible, remove the impersonate, bind and escalate rights from subjects.
  checks:
  - type: manual_review
    info: 'Review the users who have access to cluster roles or roles which provide the

      impersonate, bind or escalate privileges.'
    severity: medium
- id: 5.1.9
  title: Minimize access to create persistent volumes
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The ability to create persistent volumes in a cluster can provide an opportunity for privilege escalation,
    via the creation of hostPath volumes. As persistent volumes are not covered by Pod Security Admission, a user with access
    to create persistent volumes may be able to get access to sensitive files from the underlying host even where restrictive
    Pod Security Admission policies are in place.
  rationale: The ability to create persistent volumes in a cluster opens up possibilities for privilege escalation and should
    be restricted, where possible.
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#persistentvolume-creation
  page_start: 235
  audit_raw: 'Review the users who have create access to PersistentVolume objects in the

    Kubernetes API.'
  remediation: Where possible, remove create access to PersistentVolume objects in the cluster.
  checks:
  - type: manual_review
    info: 'Review the users who have create access to PersistentVolume objects in the

      Kubernetes API.'
    severity: medium
- id: 5.1.10
  title: Minimize access to the proxy sub-resource of nodes
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Users with access to the Proxy sub-resource of Node objects automatically have permissions to use the Kubelet
    API, which may allow for privilege escalation or bypass cluster security controls such as audit logs. The Kubelet provides
    an API which includes rights to execute commands in any container running on the node. Access to this API is covered by
    permissions to the main Kubernetes API via the node object. The proxy sub-resource specifically allows wide ranging access
    to the Kubelet API. Direct access to the Kubelet API bypasses controls like audit logging (there is no audit log of Kubelet
    API access) and admission control.
  rationale: The ability to use the proxy sub-resource of node objects opens up possibilities for privilege escalation and
    should be restricted, where possible.
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#access-toproxy-subresource-of-nodes
  - 2. https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authnauthz/#kubelet-authorization
  page_start: 236
  audit_raw: 'Review the users who have access to the proxy sub-resource of node objects in the

    Kubernetes API.'
  remediation: Where possible, remove access to the proxy sub-resource of node objects.
  checks:
  - type: manual_review
    info: 'Review the users who have access to the proxy sub-resource of node objects in the

      Kubernetes API.'
    severity: medium
- id: 5.1.11
  title: Minimize access to the approval sub-resource of certificatesigningrequests objects
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Users with access to the update the approval sub-resource of certificateaigningrequests objects can approve
    new client certificates for the Kubernetes API effectively allowing them to create new high-privileged user accounts.
    This can allow for privilege escalation to full cluster administrator, depending on users configured in the cluster
  rationale: The ability to update certificate signing requests should be limited.
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#csrs-andcertificate-issuing
  page_start: 238
  audit_raw: 'Review the users who have access to update the approval sub-resource of

    certificatesigningrequests objects in the Kubernetes API.'
  remediation: 'Where possible, remove access to the approval sub-resource of

    certificatesigningrequests objects.'
  checks:
  - type: manual_review
    info: 'Review the users who have access to update the approval sub-resource of

      certificatesigningrequests objects in the Kubernetes API.'
    severity: medium
- id: 5.1.12
  title: Minimize access to webhook configuration objects
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Users with rights to create/modify/delete validatingwebhookconfigurations or mutatingwebhookconfigurations
    can control webhooks that can read any object admitted to the cluster, and in the case of mutating webhooks, also mutate
    admitted objects. This could allow for privilege escalation or disruption of the operation of the cluster.
  rationale: The ability to manage webhook configuration should be limited
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#controladmission-webhooks
  page_start: 240
  audit_raw: 'Review the users who have access to validatingwebhookconfigurations or

    mutatingwebhookconfigurations objects in the Kubernetes API.'
  remediation: 'Where possible, remove access to the validatingwebhookconfigurations or

    mutatingwebhookconfigurations objects'
  checks:
  - type: manual_review
    info: 'Review the users who have access to validatingwebhookconfigurations or

      mutatingwebhookconfigurations objects in the Kubernetes API.'
    severity: medium
- id: 5.1.13
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Users with rights to create new service account tokens at a cluster level, can create long-lived privileged
    credentials in the cluster. This could allow for privilege escalation and persistent access to the cluster, even if the
    users account has been revoked.
  rationale: The ability to create service account tokens should be limited.
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#token-request
  page_start: 241
  audit_raw: 'Review the users who have access to create the token sub-resource of

    serviceaccount objects in the Kubernetes API.'
  remediation: Where possible, remove access to the token sub-resource of serviceaccount objects.
  checks:
  - type: manual_review
    info: 'Review the users who have access to create the token sub-resource of

      serviceaccount objects in the Kubernetes API.'
    severity: medium
- id: 5.2.1
  title: Ensure that the cluster has at least one active policy control mechanism in place
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Every Kubernetes cluster should have at least one policy control mechanism in place to enforce the other requirements
    in this section. This could be the in-built Pod Security Admission controller, or a third party policy control system.
  rationale: Without an active policy control mechanism, it is not possible to limit the use of containers with access to
    underlying cluster nodes, via mechanisms like privileged containers, or the use of hostPath volume mounts.
  impact: Where policy control systems are in place, there is a risk that workloads required for the operation of the cluster
    may be stopped from running. Care is required when implementing admission control policies to ensure that this does not
    occur.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission
  page_start: 243
  audit_raw: 'Review the workloads deployed to the cluster to understand if Pod Security Admission

    or external admission control systems are in place.'
  remediation: 'Ensure that either Pod Security Admission or an external policy control system is in

    place for every namespace which contains user workloads.'
  checks:
  - type: manual_review
    info: 'Review the workloads deployed to the cluster to understand if Pod Security Admission

      or external admission control systems are in place.'
    severity: medium
- id: 5.2.2
  title: Minimize the admission of privileged containers
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Do not generally permit containers to be run with the securityContext.privileged flag set to true.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A container running with full
    privileges can do almost everything that the host can do. This flag exists to allow special use-cases, like manipulating
    the network stack and accessing devices. There should be at least one admission control policy defined which does not
    permit privileged containers. If you need to run privileged containers, this should be defined in a separate policy and
    you should carefully check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true and spec.ephemeralContainers[].securityContext.privileged: true will not be permitted.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-standards/
  page_start: 244
  audit_raw: 'Run the following command:

    get pods -A -o=jsonpath=$''{range .items[*]}{@.metadata.name}:

    {@..securityContext}\n{end}''

    It will produce an inventory of all the privileged use on the cluster, if any (please, refer to

    a sample below). Further grepping can be done to automate each specific violation

    detection.

    calico-kube-controllers-57b57c56f-jtmk4: {} << No Elevated Privileges calico-nodec4xv4: {} {"privileged":true} {"privileged":true}
    {"privileged":true} {"privileged":true} <<

    Violates 5.2.2 dashboard-metrics-scraper-7bc864c59-2m2xw:

    {"seccompProfile":{"type":"RuntimeDefault"}}

    {"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"runAsGroup":2001,"ru

    nAsUser":1001}'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of privileged containers.'
  checks:
  - type: manual_review
    info: 'Run the following command:

      get pods -A -o=jsonpath=$''{range .items[*]}{@.metadata.name}:

      {@..securityContext}\n{end}''

      It will produce an inventory of all the privileged use on the cluster, if any (please, refer to

      a sample below). Further grepping can be done to automate each specific violation

      detection.

      calico-kube-controllers-57b57c56f-jtmk4: {} << No Elevated Privileges calico-nodec4xv4: {} {"privileged":true} {"privileged":true}
      {"privileged":true} {"privileged":true} <<

      Violates 5.2.2 dash'
    severity: medium
- id: 5.2.3
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Do not generally permit containers to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
    also has access to ptrace capabilities this can be used to escalate privileges outside of the container. There should
    be at least one admission control policy defined which does not permit containers to share the host PID namespace. If
    you need to run containers which require hostPID, this should be defined in a separate policy and you should carefully
    check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.hostPID: true will not be permitted unless they are run under a specific policy.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-standards/
  page_start: 246
  audit_raw: 'Fetch hostPID from each pod with

