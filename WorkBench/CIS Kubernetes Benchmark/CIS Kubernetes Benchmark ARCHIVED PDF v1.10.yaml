- id: 1.2.29
  title: Ensure that the API Server only makes use of Strong Cryptographic Ciphers
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Ensure that the API server is configured to only use strong cryptographic ciphers.
  rationale: TLS ciphers have had a number of known vulnerabilities and weaknesses, which can reduce the protection provided
    by them. By default Kubernetes supports a number of TLS ciphersuites including some that have security concerns, weakening
    the protection provided.
  impact: API server clients that cannot support modern cryptographic ciphers will not be able to make connections to the
    API server.
  references:
  - 1. https://kubernetes.io/docs/reference/command-line-tools-reference/kubeapiserver/
  - 2. https://github.com/ssllabs/research/wiki/SSL-and-TLS-Deployment-BestPractices#23-use-secure-cipher-suites
  page_start: 118
  audit_raw: 'Run the following command on the Control Plane node:

    ps -ef | grep kube-apiserver

    Verify that the --tls-cipher-suites argument is set as outlined in the remediation

    procedure below.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kube-apiserver.yaml

    on the Control Plane node and set the below parameter.

    --tls-cipher-suites=TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384,

    TLS_CHACHA20_POLY1305_SHA256, TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA,

    TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,

    TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA,

    TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,

    TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,

    TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,

    TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,

    TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,

    TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,

    TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --tls-cipher-suites argument is set as outlined in the remediation
    severity: medium
    info: 'Run the following command on the Control Plane node:

      ps -ef | grep kube-apiserver

      Verify that the --tls-cipher-suites argument is set as outlined in the remediation

      procedure below.'
