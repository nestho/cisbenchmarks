controls:
- id: 1.1.1
  title: Ensure that the API server pod specification file permissions are set to 600 or more restrictive
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Ensure that the API server pod specification file has permissions of 600 or more restrictive.
  rationale: The API server pod specification file controls various parameters that set the behavior of the API server. You
    should restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 19
  audit_raw: 'Run the below command (based on the file location on your system) on the Control

    Plane node. For example,

    stat -c %a /etc/kubernetes/manifests/kube-apiserver.yaml

    Verify that the permissions are 600 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the Control

    Plane node. For example,

    chmod 600 /etc/kubernetes/manifests/kube-apiserver.yaml'
  checks:
  - type: command
    command: stat -c %a /etc/kubernetes/manifests/kube-apiserver.yaml
    expected: Verify that the permissions are 600 or more restrictive.
    severity: medium
    info: 'Run the below command (based on the file location on your system) on the Control

      Plane node. For example,

      stat -c %a /etc/kubernetes/manifests/kube-apiserver.yaml

      Verify that the permissions are 600 or more restrictive.'
