- id: 1.1.13
  title: Ensure that the default administrative credential file permissions are set to 600
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Ensure that the admin.conf file (and super-admin.conf file, where it exists) have permissions of 600.
  rationale: As part of initial cluster setup, default kubeconfig files are created to be used by the administrator of the
    cluster. These files contain private keys and certificates which allow for privileged access to the cluster. You should
    restrict their file permissions to maintain the integrity and confidentiality of the file(s). The file(s) should be readable
    and writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/setup/independent/create-cluster-kubeadm/
  - 2. https://raesene.github.io/blog/2024/01/06/when-is-admin-not-admin/
  page_start: 43
  audit_raw: 'Run the following command (based on the file location on your system) on the Control

    Plane node. For example,

    stat -c %a /etc/kubernetes/admin.conf

    On Kubernetes version 1.29 and higher run the following command as well :-

    stat -c %a /etc/kubernetes/super-admin.conf

    Verify that the permissions are 600 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the Control

    Plane node. For example,

    chmod 600 /etc/kubernetes/admin.conf

    On Kubernetes 1.29+ the super-admin.conf file should also be modified, if present.

    For example,

    chmod 600 /etc/kubernetes/super-admin.conf'
  checks:
  - type: command
    command: stat -c %a /etc/kubernetes/admin.conf && stat -c %a /etc/kubernetes/super-admin.conf
    expected: Verify that the permissions are 600 or more restrictive.
    severity: medium
    info: 'Run the following command (based on the file location on your system) on the Control

      Plane node. For example,

      stat -c %a /etc/kubernetes/admin.conf

      On Kubernetes version 1.29 and higher run the following command as well :-

      stat -c %a /etc/kubernetes/super-admin.conf

      Verify that the permissions are 600 or more restrictive.'
