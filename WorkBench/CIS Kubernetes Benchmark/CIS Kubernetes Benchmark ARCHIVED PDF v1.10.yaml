- id: 5.2.10
  title: Minimize the admission of containers with capabilities assigned
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Do not generally permit containers with capabilities
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities are parts
    of the rights generally granted on a Linux system to the root user. In many cases applications running in containers do
    not require any capabilities to operate, so from the perspective of the principal of least privilege use of capabilities
    should be minimized.
  impact: Pods with containers require capabilities to operate will not be permitted.
  references:
