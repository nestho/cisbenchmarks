- id: 2.1.12
  title: Ensure that the --rotate-certificates argument is not set to false
  scoring: scored
  profile:
  - Level 1
  description: Enable kubelet client certificate rotation.
  rationale: 'The --rotate-certificates setting causes the kubelet to rotate its client certificates by creating new CSRs
    as its existing credentials expire. This automated periodic rotation ensures that the there are no downtimes due to expired
    certificates and thus addressing availability in the CIA security triad. Note: This recommendation only applies if you
    let kubelets get their certificates from the API server. In case your kubelet certificates come from an outside authority/tool
    (e.g. Vault) then you need to take care of rotation yourself. Note: This feature also require the RotateKubeletClientCertificate
    feature gate to be enabled (which is the default since Kubernetes v1.7)'
  impact: None
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/41912
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet-tlsbootstrapping/#kubelet-configuration
  page_start: 218
  audit_raw: 'Run the following command on each node:

    ps -ef | grep kubelet

    Verify that the --rotate-certificates argument is set to true.

    If the --rotate-certificates argument is not present, verify that there is a Kubelet config

    file specified by --config and that file contains rotateCertificates: true.'
  remediation: 'If using a Kubelet config file, edit the file to add the line rotateCertificates: true.

    If using command line arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubeadm.conf on each worker node and

    add --rotate-certificates=true argument to the KUBELET_CERTIFICATE_ARGS variable.

    Based on your system, restart the kubelet service. For example:

    218 | P a g e

    systemctl daemon-reload

    systemctl restart kubelet.service'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: Verify that the --rotate-certificates argument is set to true.
    severity: medium
    info: 'Run the following command on each node:

      ps -ef | grep kubelet

      Verify that the --rotate-certificates argument is set to true.

      If the --rotate-certificates argument is not present, verify that there is a Kubelet config

      file specified by --config and that file contains rotateCertificates: true.'
