- id: 1.1.13
  title: Ensure that the admission control plugin SecurityContextDeny is set
  scoring: scored
  profile:
  - Level 1
  description: Restrict pod level SecurityContext customization. Instead of using a customized SecurityContext for your pods,
    use a Pod Security Policy (PSP), which is a cluster-level resource that controls the actions that a pod can perform and
    what it has the ability to access.
  rationale: Setting admission control policy to SecurityContextDeny denies the pod level SecurityContext customization. Any
    attempts to customize the SecurityContexts that are not explicitly defined in the Pod Security Policy (PSP) are blocked.
    This ensures that all the pods adhere to the PSP defined by your organization and you have a uniform pod level security
    posture.
  impact: This admission controller should only be used where Pod Security Policies cannot be used on the cluster, as it can
    interact poorly with certain Pod Security Policies 38 | P a g e
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#securitycontextdeny
  page_start: 38
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --enable-admission-plugins argument is set to a value that includes

    SecurityContextDeny.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the --enable-admission-plugins parameter

    to include SecurityContextDeny.

    --enable-admission-plugins=...,SecurityContextDeny,...'
