- id: 1.1.11
  title: Ensure that the admission control plugin AlwaysPullImages is set
  scoring: scored
  profile:
  - Level 1
  description: Always pull images.
  rationale: Setting admission control policy to AlwaysPullImages forces every new pod to pull the required images every time.
    In a multi-tenant cluster users can be assured that their private images can only be used by those who have the credentials
    to pull them. Without this admission control policy, once an image has been pulled to a node, any pod from any user can
    use it simply by knowing the image’s name, without any authorization check against the image ownership. When this plug-in
    is enabled, images are always pulled prior to starting containers, which means valid credentials are required.
  impact: Credentials would be required to pull the private images every time. Also, in trusted environments, this might increases
    load on network, registry, and decreases speed. 35 | P a g e
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/admission-controllers/#alwayspullimages
  page_start: 35
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --enable-admission-plugins argument is set to a value that includes

    AlwaysPullImages.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the --enable-admission-plugins parameter

    to include AlwaysPullImages.

    --enable-admission-plugins=...,AlwaysPullImages,...'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --enable-admission-plugins argument is set to a value that includes
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --enable-admission-plugins argument is set to a value that includes

      AlwaysPullImages.'
