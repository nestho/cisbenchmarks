  scoring: scored
  profile:
  - Level 1
  description: Set global request timeout for API server requests as appropriate.
  rationale: Setting global request timeout allows extending the API server request timeout limit to a duration appropriate
    to the user's connection speed. By default, it is set to 60 seconds which might be problematic on slower connections making
    cluster resources inaccessible once the data volume for requests exceeds what can be transmitted in 60 seconds. But, setting
    this timeout limit to be too large can exhaust the API server resources making it prone to Denial-of-Service attack. Hence,
