- id: 1.7.7
  title: Do not admit containers with dangerous capabilities
  scoring: scored
  profile:
  - Level 2
  description: Do not generally permit containers with potentially dangerous capabilities.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. By default this can include
    potentially dangerous capabilities. By default with Docker as the container runtime the NET_RAW capability is enabled
    which may be misused by malicious containers. Ideally, all containers should drop this capability. There should be at
    least one PodSecurityPolicy (PSP) defined which prevents containers with the NET_RAW capability from launching. If you
    need to run containers with this capability, this should be defined in a separate PSP and you should carefully check RBAC
    controls to ensure that only limited service accounts and users are given permission to access that PSP.
  impact: Pods with containers which run with the NET_RAW capability will not be permitted. 194 | P a g e
