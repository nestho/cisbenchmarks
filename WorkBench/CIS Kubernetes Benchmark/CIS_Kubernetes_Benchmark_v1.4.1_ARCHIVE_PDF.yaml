controls:
- id: 2.2.6
  title: Ensure that the proxy kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - 'Special Note: **The set of configuration files mentioned anywhere throughout this'
  - Level 1
  - Level 2
  - Level 1
  description: Disable anonymous requests to the API server.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the API server. You should rely on authentication to authorize access and
    disallow anonymous requests. If you are using RBAC authorization, it is generally considered reasonable to allow anonymous
    access to the API Server for health checks and discovery purposes, and hence this recommendation is not scored. However,
    you should consider whether anonymous discovery is an acceptable risk for your purposes.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/authentication/#anonymous-requests
  page_start: 8
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --anonymous-auth argument is set to false.

    15 | P a g e'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the below parameter.

    --anonymous-auth=false'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --anonymous-auth argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --anonymous-auth argument is set to false.

      15 | P a g e'
- id: 1.1.2
  title: Ensure that the --basic-auth-file argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not use basic authentication.
  rationale: Basic authentication uses plaintext credentials for authentication. Currently, the basic authentication credentials
    last indefinitely, and the password cannot be changed without restarting API server. The basic authentication is currently
    supported for convenience. Hence, basic authentication should not be used.
  impact: You will have to configure and use alternate authentication mechanisms such as tokens and certificates. Username
    and password for basic authentication could no longer be used.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/authentication/#static-password-file
  page_start: 17
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --basic-auth-file argument does not exist.'
  remediation: 'Follow the documentation and configure alternate mechanisms for authentication. Then,

    edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node and remove
    the --basic-auth-file=<filename>

    parameter.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --basic-auth-file argument does not exist.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --basic-auth-file argument does not exist.'
- id: 1.1.3
  title: Ensure that the --insecure-allow-any-token argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not allow any insecure tokens
  rationale: Accepting insecure tokens would allow any token without actually authenticating anything. User information is
    parsed from the token and connections are allowed.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 19
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-allow-any-token argument does not exist.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and remove the --insecure-allow-any-token

    parameter.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-allow-any-token argument does not exist.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-allow-any-token argument does not exist.'
- id: 1.1.4
  title: Ensure that the --kubelet-https argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Use https for kubelet connections.
  rationale: Connections from apiserver to kubelets could potentially carry sensitive data such as secrets and keys. It is
    thus important to use in-transit encryption for any communication between the apiserver and kubelets.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/
  page_start: 21
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --kubelet-https argument either does not exist or is set to true.'
  remediation: Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and remove the --kubelet-https parameter.
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --kubelet-https argument either does not exist or is set to true.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --kubelet-https argument either does not exist or is set to true.'
- id: 1.1.5
  title: Ensure that the --insecure-bind-address argument is not set
  scoring: scored
  profile:
  - Level 1
  description: Do not bind the insecure API service.
  rationale: If you bind the apiserver to an insecure address, basically anyone who could connect to it over the insecure
    port, would have unauthenticated and unencrypted access to your master node. The apiserver doesn't do any authentication
    checking for insecure binds and traffic to the Insecure API port is not encrpyted, allowing attackers to potentially read
    sensitive data in transit.
  impact: Connections to the API server will require valid authentication credentials.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 23
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-bind-address argument does not exist.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and remove the --insecure-bind-address

    parameter.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-bind-address argument does not exist.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-bind-address argument does not exist.'
- id: 1.1.6
  title: Ensure that the --insecure-port argument is set to 0
  scoring: scored
  profile:
  - Level 1
  description: Do not bind to insecure port.
  rationale: Setting up the apiserver to serve on an insecure port would allow unauthenticated and unencrypted access to your
    master node. This would allow attackers who could access this port, to easily take control of the cluster.
  impact: 'All components that use the API must connect via the secured port, authenticate themselves, and be authorized to
    use the API. This includes: • kube-controller-manager • kube-proxy • kube-scheduler • kubelets'
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 25
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --insecure-port argument is set to 0.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the below parameter.

    --insecure-port=0'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --insecure-port argument is set to 0.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --insecure-port argument is set to 0.'
- id: 1.1.7
  title: Ensure that the --secure-port argument is not set to 0
  scoring: scored
  profile:
  - Level 1
  description: Do not disable the secure port.
  rationale: The secure port is used to serve https with authentication and authorization. If you disable it, no https traffic
    is served and all traffic is served unencrypted.
  impact: You need to set the API Server up with the right TLS certificates.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  page_start: 27
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --secure-port argument is either not set or is set to an integer value

    between 1 and 65535.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and either remove the --secure-port parameter or

    set it to a different (non-zero) desired port.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --secure-port argument is either not set or is set to an integer value
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --secure-port argument is either not set or is set to an integer value

      between 1 and 65535.'
- id: 1.1.8
  title: Ensure that the --profiling argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable profiling, if not needed.
  rationale: Profiling allows for the identification of specific performance bottlenecks. It generates a significant amount
    of program data that could potentially be exploited to uncover system and program details. If you are not experiencing
    any bottlenecks and do not need the profiler for troubleshooting purposes, it is recommended to turn it off to reduce
    the potential attack surface.
  impact: Profiling information would not be available.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://github.com/kubernetes/community/blob/master/contributors/devel/profi
  page_start: 29
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --profiling argument is set to false.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the below parameter.

    --profiling=false'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --profiling argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --profiling argument is set to false.'
- id: 1.1.9
  title: Ensure that the --repair-malformed-updates argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable fixing of malformed updates.
  rationale: The API Server will potentially attempt to fix the update requests to pass the validation even if the requests
    are malformed. Malformed requests are one of the potential ways to interact with a service without legitimate information.
    Such requests could potentially be used to sabotage API Server responses.
  impact: Malformed requests from clients would be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-apiserver/
  - 2. https://github.com/kubernetes/kubernetes/issues/15580
  page_start: 31
  audit_raw: 'Run the following command on the master node:

    ps -ef | grep kube-apiserver

    Verify that the --repair-malformed-updates argument is set to false.'
  remediation: 'Edit the API server pod specification file /etc/kubernetes/manifests/kubeapiserver.yaml on the master node
    and set the below parameter.

    --repair-malformed-updates=false'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: Verify that the --repair-malformed-updates argument is set to false.
    severity: medium
    info: 'Run the following command on the master node:

      ps -ef | grep kube-apiserver

      Verify that the --repair-malformed-updates argument is set to false.'
