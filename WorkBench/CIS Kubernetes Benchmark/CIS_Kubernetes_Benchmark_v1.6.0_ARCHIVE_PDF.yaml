- id: '2.6'
  title: Ensure that the --peer-auto-tls argument is not set to true
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Do not use automatically generated self-signed certificates for TLS connections between peers.
  rationale: etcd is a highly-available key value store used by Kubernetes deployments for persistent storage of all of its
    REST API objects. These objects are sensitive in nature and should be accessible only by authenticated etcd peers in the
    etcd cluster. Hence, do not use selfsigned certificates for authentication.
  impact: All peers attempting to communicate with the etcd server will require a valid client certificate for authentication.
