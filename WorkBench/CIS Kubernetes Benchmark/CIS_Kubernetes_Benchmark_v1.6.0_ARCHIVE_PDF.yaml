  title: Ensure that the --token-auth-file parameter is not set
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Do not use token based authentication.
  rationale: The token-based authentication utilizes static tokens to authenticate requests to the apiserver. The tokens are
    stored in clear-text in a file on the apiserver, and cannot be revoked or rotated without restarting the apiserver. Hence,
    do not use static token-based authentication.
  impact: You will have to configure and use alternate authentication mechanisms such as certificates. Static token based
    authentication could not be used.
  references:
  - 1. https://kubernetes.io/docs/admin/authentication/#static-token-file
  - 2. https://kubernetes.io/docs/admin/kube-apiserver/
