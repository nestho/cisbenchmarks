- id: 1.1.11
  title: Ensure that the etcd data directory permissions are set to 700 or more restrictive
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Ensure that the etcd data directory has permissions of 700 or more restrictive.
  rationale: etcd is a highly-available key-value store used by Kubernetes deployments for persistent storage of all of its
    REST API objects. This data directory should be protected from any unauthorized reads or writes. It should not be readable
    or writable by any group members or the world.
  impact: None 37 | P a g e
  references:
  - 1. https://coreos.com/etcd/docs/latest/op-guide/configuration.html#data-dir
  - 2. https://kubernetes.io/docs/admin/etcd/
  page_start: 37
  audit_raw: 'On the etcd server node, get the etcd data directory, passed as an argument --data-dir,

    from the below command:

    ps -ef | grep etcd

    Run the below command (based on the etcd data directory found above). For example,

    stat -c %a /var/lib/etcd

    Verify that the permissions are 700 or more restrictive.'
  remediation: 'On the etcd server node, get the etcd data directory, passed as an argument --data-dir,

    from the below command:

    ps -ef | grep etcd

    Run the below command (based on the etcd data directory found above). For example,

    chmod 700 /var/lib/etcd'
  checks:
  - type: command
    command: ps -ef | grep etcd && stat -c %a /var/lib/etcd
    expected: Verify that the permissions are 700 or more restrictive.
    severity: medium
    info: 'On the etcd server node, get the etcd data directory, passed as an argument --data-dir,

      from the below command:

      ps -ef | grep etcd

      Run the below command (based on the etcd data directory found above). For example,

      stat -c %a /var/lib/etcd

      Verify that the permissions are 700 or more restrictive.'
