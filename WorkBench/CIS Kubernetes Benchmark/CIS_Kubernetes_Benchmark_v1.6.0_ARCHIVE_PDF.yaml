  description: Do not generally permit containers with capabilities
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities are parts
    of the rights generally granted on a Linux system to the root user. In many cases applications running in containers do
    not require any capabilities to operate, so from the perspective of the principal of least privilege use of capabilities
    should be minimized.
  impact: Pods with containers require capabilities to operate will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/pod-security-policy/#enabling-podsecurity-policies
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-andunprivileged-linux-containers/
  page_start: 245
  audit_raw: 'Get the set of PSPs with the following command:

    kubectl get psp

    For each PSP, check whether capabilities have been forbidden:

    kubectl get psp <name> -o=jsonpath=''{.spec.requiredDropCapabilities}'''
  remediation: 'Review the use of capabilites in applications runnning on your cluster. Where a namespace

    contains applicaions which do not require any Linux capabities to operate consider adding

    a PSP which forbids the admission of containers which do not drop all capabilities.'
  checks:
  - type: manual_review
    info: 'Get the set of PSPs with the following command:

      kubectl get psp

      For each PSP, check whether capabilities have been forbidden:

      kubectl get psp <name> -o=jsonpath=''{.spec.requiredDropCapabilities}'''
    severity: medium
- id: '5.3'
  title: Network Policies and CNI 5.3.1 Ensure that the CNI in use supports Network Policies
  scoring: manual
  profile:
