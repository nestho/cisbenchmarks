- id: 5.7.2
  title: Ensure that the seccomp profile is set to docker/default in your pod definitions
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Enable docker/default seccomp profile in your pod definitions.
  rationale: Seccomp (secure computing mode) is used to restrict the set of system calls applications can make, allowing cluster
    administrators greater control over the security of workloads running in the cluster. Kubernetes disables seccomp profiles
    by default for historical reasons. You should enable it to ensure that the workloads have restricted actions available
    within the container.
  impact: If the docker/default seccomp profile is too restrictive for you, you would have to create/manage your own seccomp
    profiles. Also, you need to enable all alpha features for this to work. There is no individual switch to turn on this
    feature.
  references:
  - 1. https://github.com/kubernetes/kubernetes/issues/39845
  - 2. https://github.com/kubernetes/kubernetes/pull/21790
  page_start: 258
  audit_raw: "Review the pod definitions in your cluster. It should create a line as below:\n annotations:\n seccomp.security.alpha.kubernetes.io/pod:\
    \ docker/default"
  remediation: "Seccomp is an alpha feature currently. By default, all alpha features are disabled. So, you\nwould need to\
    \ enable alpha features in the apiserver by passing \"--featuregates=AllAlpha=true\" argument.\nEdit the /etc/kubernetes/apiserver\
    \ file on the master node and set the KUBE_API_ARGS\nparameter to \"--feature-gates=AllAlpha=true\"\nKUBE_API_ARGS=\"\
    --feature-gates=AllAlpha=true\"\nBased on your system, restart the kube-apiserver service. For example:\nsystemctl restart\
    \ kube-apiserver.service\nUse annotations to enable the docker/default seccomp profile in your pod definitions. An\nexample\
    \ is as below:\napiVersion: v1\nkind: Pod\n258 | P a g e\nmetadata:\n name: trustworthy-pod\n annotations:\n seccomp.security.alpha.kubernetes.io/pod:\
    \ docker/default\nspec:\n containers:\n - name: trustworthy-container\n image: sotrustworthy:latest"
  checks:
  - type: manual_review
    info: "Review the pod definitions in your cluster. It should create a line as below:\n annotations:\n seccomp.security.alpha.kubernetes.io/pod:\
      \ docker/default"
    severity: medium
- id: 5.7.3
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Apply Security Context to Your Pods and Containers
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing your containers and pods, make sure that you configure the security context for
    your pods, containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security
    parameters that will be assigned to the pod/container/volume. There are two levels of security context: pod level security
    context, and container level security context.'
  impact: If you incorrectly apply security contexts, you may have trouble running the pods.
