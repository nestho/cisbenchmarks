- id: '1.43'
  title: AS24-U1-000930
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must install security-relevant software updates within the configured time period directed
    by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs). GROUP ID: V-214270 RULE ID: SV-214270r961683'
  rationale: Security flaws with software applications are discovered daily. Vendors are constantly updating and patching
    their products to address newly discovered security vulnerabilities. Organizations (including any contractor to the organization)
    are required to promptly install security-relevant software updates (e.g., patches, service packs, and hot fixes). Flaws
    discovered during security assessments, continuous monitoring, incident response activities, or information system error
    handling must also be addressed expeditiously. The Apache web server will be configured to check for and install security-relevant
    software updates from an authoritative source within an identified time period from the availability of the update. By
    default, this time period will be every 24 hours.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'Determine the most recent patch level of the Apache Web Server 2.4 software, as

    posted on the Apache HTTP Server Project website. If the Apache installation is a

    proprietary installation supporting an application and is supported by a vendor,

    determine the most recent patch level of the vendor’s installation.

    In a command line, type "httpd -v".

    If the version is more than one version behind the most recent patch level, this is a

    finding.'
  remediation: 'Install the current version of the web server software and maintain appropriate service

    packs and patches.'
