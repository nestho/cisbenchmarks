- id: '1.34'
  title: AS24-U1-000690
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Non-privileged accounts on the hosting system must only access Apache web server security-relevant information
    and functions through a distinct administrative account. GROUP ID: V-214261 RULE ID: SV-214261r961353'
  rationale: By separating Apache web server security functions from non-privileged users, roles can be developed that can
    then be used to administer the Apache web server. Forcing users to change from a non-privileged account to a privileged
    account when operating on the Apache web server or on security-relevant information forces users to only operate as a
    Web Server Administrator when necessary. Operating in this manner allows for better logging of changes and better forensic
    information and limits accidental changes to the Apache web server.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Determine which tool or control file is used to control the configuration of the web

    server.

    If the control of the web server is done via control files, verify who has update access to

    them. If tools are being used to configure the web server, determine who has access to

    execute the tools.

    If accounts other than the System Administrator (SA), the Web Manager, or the Web

    Manager designees have access to the web administration tool or control files, this is a

    finding.'
  remediation: 'Restrict access to the web administration tool to only the System Administrator, Web

    Manager, or the Web Manager designees.'
  checks:
  - type: manual_review
    info: 'Determine which tool or control file is used to control the configuration of the web

      server.

      If the control of the web server is done via control files, verify who has update access to

      them. If tools are being used to configure the web server, determine who has access to

      execute the tools.

      If accounts other than the System Administrator (SA), the Web Manager, or the Web

      Manager designees have access to the web administration tool or control files, this is a

      finding.'
    severity: medium
- id: '1.35'
  title: AS24-U1-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must use a logging mechanism that is configured to allocate log record storage capacity
    large enough to accommodate the logging requirements of the Apache web server. GROUP ID: V-214262 RULE ID: SV-214262r961392'
  rationale: To make certain that the logging mechanism used by the web server has sufficient storage capacity in which to
    write the logs, the logging mechanism needs to be able to allocate log record storage capacity. The task of allocating
    log record storage capacity is usually performed during initial installation of the logging mechanism. The System Administrator
    will usually coordinate the allocation of physical drive space with the Web Server Administrator along with the physical
    location of the partition and disk. Refer to NIST SP 800-92 for specific requirements on log rotation and storage dependent
    on the impact of the web server.
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'Work with SIEM administrator to determine log storage capacity.

    If there is no setting within a SIEM to accommodate enough a large logging capacity,

    this is a finding.'
  remediation: 'Work with the SIEM administrator to determine if the SIEM is configured to allocate log

    record storage capacity large enough to accommodate the logging requirements of the

    Apache web server.'
  checks:
  - type: manual_review
    info: 'Work with SIEM administrator to determine log storage capacity.

      If there is no setting within a SIEM to accommodate enough a large logging capacity,

      this is a finding.'
    severity: medium
- id: '1.36'
  title: AS24-U1-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must not impede the ability to write specified log record content to an audit log server.
    GROUP ID: V-214263 RULE ID: SV-214263r961395'
  rationale: Writing events to a centralized management audit system offers many benefits to the enterprise over having dispersed
    logs. Centralized management of audit records and logs provides for efficiency in maintenance and management of records,
    enterprise analysis of events, and backup and archiving of event records enterprise-wide. The web server and related components
    are required to be capable of writing logs to centralized audit log servers.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Work with SIEM administrator to determine audit configurations.

    If there is a setting within the SIEM that could impede the ability to write specific log

    record content, this is a finding.'
  remediation: 'Work with the SIEM administrator to allow the ability to write specified log record

    content to an audit log server.'
  checks:
  - type: manual_review
    info: 'Work with SIEM administrator to determine audit configurations.

      If there is a setting within the SIEM that could impede the ability to write specific log

