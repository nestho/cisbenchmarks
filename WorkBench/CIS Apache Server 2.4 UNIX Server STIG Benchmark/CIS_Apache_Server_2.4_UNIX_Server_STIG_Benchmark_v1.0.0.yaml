- id: '1.29'
  title: AS24-U1-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Warning and error messages displayed to clients must be modified to minimize the identity of the Apache web
    server, patches, loaded modules, and directory paths. GROUP ID: V-214256 RULE ID: SV-214256r961167'
  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web server includes any
    information about the web server, backend systems being accessed, and plug-ins or modules being used. Web servers will
    often display error messages to client users, displaying enough information to aid in the debugging of the error. The
    information given back in error messages may display the web server type, version, patches installed, plug-ins and modules
    installed, type of code being used by the hosted application, and any backends being used for data storage. This information
    could be used by an attacker to blueprint what type of attacks might be successful. The information given to users must
    be minimized to not aid in the blueprinting of the Apache web server.
  impact: ''
  references: []
