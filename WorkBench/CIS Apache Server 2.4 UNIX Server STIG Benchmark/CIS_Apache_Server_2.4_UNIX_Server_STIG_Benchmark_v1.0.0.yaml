  title: AS24-U1-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must separate the hosted applications from hosted Apache web server management functionality.
    GROUP ID: V-214249 RULE ID: SV-214249r961095'
  rationale: The separation of user functionality from web server management can be accomplished by moving management functions
    to a separate IP address or port. To further separate the management functions, separate authentication methods and certificates
    should be used. By moving the management functionality, the possibility of accidental discovery of the management functions
    by non-privileged users during hosted application use is minimized.
