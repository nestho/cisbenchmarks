controls:
- id: '1.1'
  title: AS24-U1-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must limit the number of allowed simultaneous session requests. GROUP ID: V-214228 RULE
    ID: SV-214228r960735'
  rationale: Apache web server management includes the ability to control the number of users and user sessions that utilize
    an Apache web server. Limiting the number of allowed users and sessions per user is helpful in limiting risks related
    to several types of denial-ofservice (DOS) attacks. Although there is some latitude concerning the settings, they should
    follow DoDrecommended values and be configurable to allow for future DoD direction. While the DoD will specify recommended
    values, the values can be adjusted to accommodate the operational requirements of a given system.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the directives "KeepAlive" and "MaxKeepAliveRequests" in the "httpd.conf"

    file:

    cat /<path_to_file>/httpd.conf | grep -i "keepalive"

    KeepAlive On

    MaxKeepAliveRequests 100

    If the value of "KeepAlive" is set to "off" or does not exist, this is a finding.

    If the value of "MaxKeepAliveRequests" is set to a value less than "100" or does not

    exist, this is a finding.'
  remediation: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Set the "KeepAlive" directive to a value of "on"; add the directive if it does not exist.

    Set the "MaxKeepAliveRequests" directive to a value of "100" or greater; add the

    directive if it does not exist.

    Restart Apache: apachectl restart'
  checks:
  - type: command
    command: cat /<path_to_file>/httpd.conf | grep -i "keepalive"
    expected: ''
    severity: medium
    info: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      -D HTTPD_ROOT="/etc/httpd"

      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Note: The apachectl front end is the preferred method for locating the Apache httpd file.

      For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

      Search for the directives "Ke'
- id: '1.2'
  title: AS24-U1-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must perform server-side session management. GROUP ID: V-214229 RULE ID: SV-214229r960735'
  rationale: Session management is the practice of protecting the bulk of the user authorization and identity information.
    This data can be stored on the client system or on the server. When the session information is stored on the client, the
    session ID, along with the user authorization and identity information, is sent along with each client request and is
    stored in a cookie, embedded in the uniform resource locator (URL), or placed in a hidden field on the displayed form.
    Each of these offers advantages and disadvantages. The biggest disadvantage to all three is the possibility of the hijacking
    of a session along with all of the user's credentials. When the user authorization and identity information is stored
    on the server in a protected and encrypted database, the communication between the client and Apache web server will only
    send the session identifier, and the server can then retrieve user credentials for the session when needed. If, during
    transmission, the session were to be hijacked, the user's credentials would not be compromised.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Issue the following command:

    httpd -M |grep -E ''session_module|usertrack''

    Expected output:

    usertrack_module (shared)

    session_module (shared)

    If results do not return both "usertrack_module (shared)" and "session_module

    (shared)", this is a finding.

    Alternatively, determine the location of the "HTTPD_ROOT" directory and the

    "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the "session_module" and "usertrack_module" directives:

    cat /<path_to_file>/httpd.conf | grep -i "session_module"

    cat /<path_to_file>/httpd.conf | grep -i "usertrack_module"

    If "session_module" and "usertrack_module" are not enabled or do not exist, this is a

    finding.'
  remediation: 'If the modules are not installed, install any missing packages.

    Add the following lines to the "httpd.conf" file:

    LoadModule usertrack_module modules/mod_usertrack.so

    LoadModule session_module modules/mod_session.so

    Additional documentation can be found at:

    https://httpd.apache.org/docs/2.4/mod/mod_usertrack.html

    https://httpd.apache.org/docs/2.4/mod/mod_session.html

    Restart Apache: apachectl restart'
  checks:
  - type: command
    command: cat /<path_to_file>/httpd.conf | grep -i "session_module" && cat /<path_to_file>/httpd.conf | grep -i "usertrack_module"
    expected: ''
    severity: medium
    info: 'Issue the following command:

      httpd -M |grep -E ''session_module|usertrack''

      Expected output:

      usertrack_module (shared)

      session_module (shared)

      If results do not return both "usertrack_module (shared)" and "session_module

      (shared)", this is a finding.

      Alternatively, determine the location of the "HTTPD_ROOT" directory and the

      "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      '
- id: '1.3'
  title: AS24-U1-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must use cryptography to protect the integrity of remote sessions. GROUP ID: V-214230
    RULE ID: SV-214230r960759'
  rationale: 'Data exchanged between the user and the Apache web server can range from static display data to credentials
    used to log on to the hosted application. Even when data appears to be static, the non-displayed logic in a web page may
    expose business logic or trusted system relationships. The integrity of all the data being exchanged between the user
    and the Apache web server must always be trusted. To protect the integrity and trust, encryption methods should be used
    to protect the complete communication session. Satisfies: SRG-APP-000014-WSR-000006, SRG-APP-000015-WSR-000014, SRGAPP-000033-WSR-000169,
    SRG-APP-000172-WSR-000104, SRG-APP-000179-WSR000110, SRG-APP-000179-WSR-000111, SRG-APP-000224-WSR-000139, SRG-APP000427-WSR-000186,
    SRG-APP-000439-WSR-000151, SRG-APP-000439-WSR000152, SRG-APP-000439-WSR-000153, SRG-APP-000442-WSR-000182'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Verify the "ssl module" module is loaded

    httpd -M | grep -i ssl_module

    Output: ssl_module (shared)

    If the "ssl_module" is not found, this is a finding.

    Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the directive "SSLProtocol" in the "httpd.conf" file:

    cat /<path_to_file>/httpd.conf | grep -i "SSLProtocol"

    If the "SSLProtocol" directive is missing or does not look like the following, this is a

    finding:

    SSLProtocol -ALL +TLSv1.2

    If the TLS version is not TLS 1.2 or higher, according to NIST SP 800-52 Rev 2, or if

    non-FIPS-approved algorithms are enabled, this is a finding.'
  remediation: 'cat /etc/httpd/conf.d/ssl.conf | grep "SSLProtocol - ALL

    +TLSv1.2"

    Ensure the "SSLProtocol" is added to the ssl.conf file and looks like the following:

    SSLProtocol -ALL +TLSv1.2

    Restart Apache: apachectl restart'
  checks:
  - type: command
    command: httpd -M | grep -i ssl_module && cat /<path_to_file>/httpd.conf | grep -i "SSLProtocol"
    expected: ''
    severity: medium
    info: 'Verify the "ssl module" module is loaded

      httpd -M | grep -i ssl_module

      Output: ssl_module (shared)

      If the "ssl_module" is not found, this is a finding.

      Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      -D HTTPD_ROOT="/etc/httpd"

      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Note: The apachectl front end is the preferre'
- id: '1.4'
  title: AS24-U1-000065
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must have system logging enabled. GROUP ID: V-214231 RULE ID: SV-214231r961863'
  rationale: The server error logs are invaluable because they can also be used to identify potential problems and enable
    proactive remediation. Log data can reveal anomalous behavior such as “not found” or “unauthorized” errors that may be
    an evidence of attack attempts. Failure to enable error logging can significantly reduce the ability of Web Administrators
    to detect or remediate problems. The CustomLog directive specifies the log file, syslog facility, or piped logging utility.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the directive "CustomLog" in the "httpd.conf" file:

    cat /<path_to_file>/httpd.conf | grep -i "CustomLog"

    If the "CustomLog" directive is missing, this is a finding:

    An example CustomLog directive would be as follows:

    CustomLog "logs/access_log" common or CustomLog “log/access_log” combined

    (May also be "Logs/access_log")'
  remediation: Edit the "httpd.conf" file and enter the name, path and level for the CustomLog.
  checks:
  - type: command
    command: cat /<path_to_file>/httpd.conf | grep -i "CustomLog"
    expected: ''
    severity: medium
    info: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      -D HTTPD_ROOT="/etc/httpd"

      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Note: The apachectl front end is the preferred method for locating the Apache httpd file.

      For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

      Search for the directive "Cus'
- id: '1.5'
  title: AS24-U1-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must generate, at a minimum, log records for system startup and shutdown, system access,
    and system authentication events. GROUP ID: V-214232 RULE ID: SV-214232r960879'
  rationale: 'Log records can be generated from various components within the Apache web server (e.g., httpd, plug-ins to
    external backends, etc.). From a web server perspective, certain specific Apache web server functionalities may be logged
    as well. The Apache web server must allow the definition of what events are to be logged. As conditions change, the number
    and types of events to be logged may change, and the Apache web server must be able to facilitate these changes. The minimum
    list of logged events should be those pertaining to system startup and shutdown, system access, and system authentication
    events. If these events are not logged at a minimum, any type of forensic investigation would be missing pertinent information
    needed to replay what occurred. Satisfies: SRG-APP-000089-WSR-000047, SRG-APP-000092-WSR-000055, SRGAPP-000095-WSR-000056,
    SRG-APP-000096-WSR-000057, SRG-APP-000097-WSR000058, SRG-APP-000098-WSR-000059, SRG-APP-000099-WSR-000061, SRG-APP000100-WSR-000064'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify the Log Configuration Module is loaded:

    httpd -M | grep -i log_config_module

    Output: log_config_module (shared)

    If the "log_config_module" is not enabled, this is a finding.

    Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the directive "LogFormat" in the "httpd.conf" file:

    cat /<path_to_file>/httpd.conf | grep -i "LogFormat"

    If the "LogFormat" directive is missing, this is a finding:

    An example is:

    LogFormat "%a %A %h %H %l %m %s %t %u %U "%{Referer}i" " common'
  remediation: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Uncomment the "log_config_module" module line.

    Configure the "LogFormat" in the "httpd.conf" file to look like the following:

    LogFormat "%a %A %h %H %l %m %s %t %u %U "%{Referer}i" " common

    Restart Apache: apachectl restart

    Note: The log format could be using different variables based on the environment;

    however it should be verified to ensure it is producing the same end result of logged

    elements.

    The logging elements required breakdown as follows:

    %a remote IP address

    %A local IP address

    %h IP address of requesting client

    %H the request protocol

    %l user ID of the requesting client

    %m request method

    %s status

    %t time the request was received

    %u user ID of the remote user

    %U URL path requested'
  checks:
  - type: command
    command: httpd -M | grep -i log_config_module && cat /<path_to_file>/httpd.conf | grep -i "LogFormat"
    expected: ''
    severity: medium
    info: 'Verify the Log Configuration Module is loaded:

      httpd -M | grep -i log_config_module

      Output: log_config_module (shared)

      If the "log_config_module" is not enabled, this is a finding.

      Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      -D HTTPD_ROOT="/etc/httpd"

      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Note: The apache'
- id: '1.6'
  title: AS24-U1-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'An Apache web server, behind a load balancer or proxy server, must produce log records containing the client
    IP information as the source and destination and not the load balancer or proxy IP information with each event. GROUP
    ID: V-214233 RULE ID: SV-214233r960900'
  rationale: Apache web server logging capability is critical for accurate forensic analysis. Without sufficient and accurate
    information, a correct replay of the events cannot be determined. Ascertaining the correct source of the events (e.g.,
    source IP) is important during forensic analysis. Correctly determining the source of events will add information to the
    overall reconstruction of the loggable event. By determining the source of the event correctly, analysis of the enterprise
    can be undertaken to determine if events tied to the source occurred in other areas within the enterprise. A web server
    behind a load balancer or proxy server, when not configured correctly, will record the load balancer or proxy server as
    the source of every loggable event. When looking at the information forensically, this information is not helpful in the
    investigation of events. The web server must record with each event the client source of the event.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'If Apache server is not behind a load balancer or proxy server, this check is Not

    Applicable.

    Interview the System Administrator to review the configuration of the Apache web

    server architecture and determine if inbound web traffic is passed through a proxy.

    If the Apache web server is receiving inbound web traffic through a proxy, the audit logs

    must be reviewed to determine if correct source information is being passed through by

    the proxy server.

    Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Review the location of the log files.

    When the log file is displayed, review the source IP information in the log entries and

    verify the entries do not reflect the IP address of the proxy server.

    If the log entries in the log file(s) reflect the IP address of the client in addition to the

    proxy address, this is not a finding.

    If the log entries in the log file(s) reflect the IP address of the proxy server as the

    source, this is a finding.

    If logs containing source/destination IPs can be obtained at the load balancer/proxy

    server, this is not a finding.'
  remediation: 'Access the proxy server through which inbound web traffic is passed and configure

    settings to pass web traffic to the Apache web server transparently.

    Refer to https://httpd.apache.org/docs/2.4/mod/mod_remoteip.html for additional

    information on logging options based on your proxy/load balancing setup.'
  checks:
  - type: manual_review
    info: 'If Apache server is not behind a load balancer or proxy server, this check is Not

      Applicable.

      Interview the System Administrator to review the configuration of the Apache web

      server architecture and determine if inbound web traffic is passed through a proxy.

      If the Apache web server is receiving inbound web traffic through a proxy, the audit logs

      must be reviewed to determine if correct source information is being passed through by

      the proxy server.

      Determine the location of the "HTTPD_ROOT" dir'
    severity: medium
- id: '1.7'
  title: AS24-U1-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must use a logging mechanism that is configured to alert the Information System Security
    Officer (ISSO) and System Administrator (SA) in the event of a processing failure. GROUP ID: V-214234 RULE ID: SV-214234r960912'
  rationale: 'Reviewing log data allows an investigator to recreate the path of an attacker and to capture forensic data for
    later use. Log data is also essential to SAs in their daily administrative duties on the hosted system or within the hosted
    applications. If the logging system begins to fail, events will not be recorded. Organizations must define logging failure
    events, at which time the application or the logging mechanism the application uses will provide a warning to the ISSO
    and SA at a minimum. Satisfies: SRG-APP-000108-WSR-000166, SRG-APP-000359-WSR-000065'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Work with the SIEM administrator to determine if an alert is configured when audit data

    is no longer received as expected.

    If there is no alert configured, this is a finding.'
  remediation: 'Work with the SIEM administrator to configure an alert when no audit data is received

    from Apache based on the defined schedule of connections.'
  checks:
  - type: manual_review
    info: 'Work with the SIEM administrator to determine if an alert is configured when audit data

      is no longer received as expected.

      If there is no alert configured, this is a finding.'
    severity: medium
- id: '1.8'
  title: AS24-U1-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server log files must only be accessible by privileged users. GROUP ID: V-214235 RULE ID: SV-214235r960930'
  rationale: Log data is essential in the investigation of events. If log data were to become compromised, competent forensic
    analysis and discovery of the true source of potentially malicious system activity would be difficult, if not impossible,
    to achieve. In addition, access to log records provides information an attacker could potentially use to their advantage
    since each event record might contain communication ports, protocols, services, trust relationships, user names, etc.
    The web server must protect the log data from unauthorized read, write, copy, etc. This can be done by the web server
    if the web server is also doing the logging function. The web server may also use an external log system. In either case,
    the logs must be protected from access by non-privileged users.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Work with the Administrator to locate the log files:

    Example: /etc/httpd/logs

    List the POSIX permission set and owner/group of the log files:

    ls -laH /etc/httpd/logs/log

    Output Example:

    -rw-r------. 1 apache root 0 Sep 27 2020 /etc/httpd/logs/access_log

    -rw-r------. 1 apache root 1235 Sep 23 2020 /etc/httpd/logs/access_log-20200927

    -rw-r------. 1 apache root 332 Sep 26 03:40 /etc/httpd/logs/error_log

    Only system administrators and service accounts running the server should have

    permissions to the files and the POSIX permissions should be set to 640 or more

    restrictive

    If any users other than those authorized have read access to the log files, this is a

    finding.'
  remediation: 'To protect the integrity of the data that is being captured in the log files, ensure that only

    the members of the Auditors group, Administrators, and the user assigned to run the

    web server software is granted permissions to read the log files.'
  checks:
  - type: command
    command: ls -laH /etc/httpd/logs/log
    expected: ''
    severity: medium
    info: 'Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      apachectl -V | egrep -i ''httpd_root|server_config_file''

      -D HTTPD_ROOT="/etc/httpd"

      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Note: The apachectl front end is the preferred method for locating the Apache httpd file.

      For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

      Work with the Administrator t'
- id: '1.9'
  title: AS24-U1-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The log information from the Apache web server must be protected from unauthorized modification or deletion.
    GROUP ID: V-214236 RULE ID: SV-214236r960933'
  rationale: 'Log data is essential in the investigation of events. If log data were to become compromised, competent forensic
    analysis and discovery of the true source of potentially malicious system activity would be difficult, if not impossible,
    to achieve. In addition, access to log records provides information an attacker could potentially use to their advantage
    since each event record might contain communication ports, protocols, services, trust relationships, user names, etc.
    The web server must protect the log data from unauthorized read, write, copy, etc. This can be done by the web server
    if the web server is also doing the logging function. The web server may also use an external log system. In either case,
    the logs must be protected from access by non-privileged users. Satisfies: SRG-APP-000119-WSR-000069, SRG-APP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify the log information from the web server must be protected from unauthorized

    modification.

    Review the web server documentation and deployed configuration settings to determine

    if the web server logging features protect log information from unauthorized

    modification.

    Review file system settings to verify the log files have secure file permissions. Run the

    following command:

    ls -l <''INSTALL PATH''>/logs

    If the web server log files present are owned by anyone other than an administrative

    service account this is a finding.'
  remediation: 'Determine the location of the "ErrorLog" directory in the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Open the "httpd.conf" file.

    Look for the "ErrorLog" directive.

    Ensure the permissions and ownership of all files in the Apache log directory are correct

    by executing the following commands as an administrative service account:

    chown <''service account''> <''ErrorLog directive PATH''>/*'
  checks:
  - type: command
    command: ls -l <'INSTALL PATH'>/logs
    expected: ''
    severity: medium
    info: 'Verify the log information from the web server must be protected from unauthorized

      modification.

      Review the web server documentation and deployed configuration settings to determine

      if the web server logging features protect log information from unauthorized

      modification.

      Review file system settings to verify the log files have secure file permissions. Run the

      following command:

