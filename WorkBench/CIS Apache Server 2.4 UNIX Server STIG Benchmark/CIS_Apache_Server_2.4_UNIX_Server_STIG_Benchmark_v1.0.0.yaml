    users. GROUP ID: V-214248 RULE ID: SV-214248r961095'
  rationale: By separating Apache web server security functions from non-privileged users, roles can be developed that can
    then be used to administer the Apache web server. Forcing users to change from a non-privileged account to a privileged
    account when operating on the Apache web server or on security-relevant information forces users to only operate as a
    Web Server Administrator when necessary. Operating in this manner allows for better logging of changes and better forensic
    information and limits accidental changes to the Apache web server. To limit changes to the Apache web server and limit
    exposure to any adverse effects from the changes, files such as the Apache web server application files, libraries, and
