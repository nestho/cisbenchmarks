- id: '1.20'
  title: AS24-U1-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Apache web server accounts accessing the directory tree, the shell, or other operating system functions and
    utilities must only be administrative accounts. GROUP ID: V-214247 RULE ID: SV-214247r961095'
  rationale: As a rule, accounts on a web server are to be kept to a minimum. Only administrators, web managers, developers,
    auditors, and web authors require accounts on the machine hosting the web server. The resources to which these accounts
    have access must also be closely monitored and controlled. Only the system administrator needs access to all the system's
    capabilities, while the web administrator and associated staff require access and control of the web content and web server
    configuration files.
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'Review the web server documentation and configuration to determine what web server

    accounts are available on the server.

    Any directories or files owned by anyone other than an administrative service account is

    a finding.

    If non-privileged web server accounts are available with access to functions, directories,

    or files not needed for the role of the account, this is a finding.'
  remediation: 'Limit the functions, directories, and files that are accessible by each account and role to

