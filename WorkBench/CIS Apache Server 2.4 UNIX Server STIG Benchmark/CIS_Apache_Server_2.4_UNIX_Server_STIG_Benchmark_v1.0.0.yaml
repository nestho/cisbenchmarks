- id: '1.41'
  title: AS24-U1-000870
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie
    properties set to prohibit client-side scripts from reading the cookie data. GROUP ID: V-214268 RULE ID: SV-214268r961632'
  rationale: 'A cookie can be read by client-side scripts easily if cookie properties are not set properly. By allowing cookies
    to be read by the client-side scripts, information such as session identifiers could be compromised and used by an attacker
    who intercepts the cookie. Setting cookie properties (i.e., HttpOnly property) to disallow client-side scripts from reading
    cookies better protects the information inside the cookie. Satisfies: SRG-APP-000439-WSR-000154, SRG-APP-000439-WSR-000155'
  impact: ''
  references: []
