- id: '1.12'
  title: AS24-U1-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must not perform user management for hosted applications. GROUP ID: V-214239 RULE ID:
    SV-214239r960963'
  rationale: User management and authentication can be an essential part of any application hosted by the web server. Along
    with authenticating users, the user management function must perform several other tasks such as password complexity,
    locking users after a configurable number of failed logons, and management of temporary and emergency accounts. All of
    this must be done enterprise-wide. The web server contains a minimal user management function, but the web server user
    management function does not offer enterprise-wide user management, and user management is not the primary function of
    the web server. User management for the hosted applications should be done through a facility that is built for enterprise-wide
    user management, such as LDAP and Active Directory.
  impact: ''
