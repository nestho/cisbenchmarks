    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    NOTE: SSL directives may also be located in /etc/httpd/conf.d/ssl.conf.

    Set "Session" to "on".

    Ensure the "SessionCookieName" directive includes "httpOnly" and "secure".'
  checks:
