  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must invalidate session identifiers upon hosted application user logout or other session
    termination. GROUP ID: V-214250 RULE ID: SV-214250r1043179'
  rationale: 'Captured sessions can be reused in "replay" attacks. This requirement limits the ability of adversaries from
    capturing and continuing to employ previously valid session IDs. Session IDs are tokens generated by web applications
    to uniquely identify an application user''s session. Unique session IDs help to reduce predictability of said identifiers.
    When a user logs out, or when any other session termination event occurs, the web server must terminate the user session
    to minimize the potential for an attacker to hijack that particular user session. Satisfies: SRG-APP-000220-WSR-000201,
    SRG-APP-000295-WSR-000012'
