  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings
    that disallow cookie access outside the originating Apache web server and hosted application. GROUP ID: V-214251 RULE
