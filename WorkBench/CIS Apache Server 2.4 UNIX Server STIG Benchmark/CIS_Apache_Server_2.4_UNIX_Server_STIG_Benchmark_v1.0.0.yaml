- id: '1.16'
  title: AS24-U1-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must have resource mappings set to disable the serving of certain file types. GROUP
    ID: V-214243 RULE ID: SV-214243r960963'
  rationale: 'Resource mapping is the process of tying a particular file type to a process in the web server that can serve
    that type of file to a requesting client and to identify which file types are not to be delivered to a client. By not
    specifying which files can and cannot be served to a user, the web server could deliver to a user web server configuration
    files, log files, password files, etc. The web server must only allow hosted application file types to be served to a
    user, and all other types must be disabled. Satisfies: SRG-APP-000141-WSR-000081, SRG-APP-000141-WSR-000083'
