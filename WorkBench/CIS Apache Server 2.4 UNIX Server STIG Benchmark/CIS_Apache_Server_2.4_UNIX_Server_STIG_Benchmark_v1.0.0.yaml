- id: '1.18'
  title: AS24-U1-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must have Web Distributed Authoring (WebDAV) disabled. GROUP ID: V-214245 RULE ID: SV-214245r960963'
  rationale: A web server can be installed with functionality that, by its nature, is not secure. WebDAV is an extension to
    the HTTP protocol that, when developed, was meant to allow users to create, change, and move documents on a server, typically
    a web server or web share. Allowing this functionality, development, and deployment is much easier for web authors. WebDAV
    is not widely used and has serious security concerns because it may allow clients to modify unauthorized files on the
    web server.
  impact: ''
  references: []
