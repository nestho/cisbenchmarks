  rationale: 'Apache web server documentation, sample code, example applications, and tutorials may be an exploitable threat
    to an Apache web server because this type of code has not been evaluated and approved. A production Apache web server
    must only contain components that are operationally necessary (e.g., compiled code, scripts, web content, etc.). Any documentation,
    sample code, example applications, and tutorials must be removed from a production Apache web server. To ensure that the
    documentation and code are not installed or are uninstalled completely, the Apache web server must offer an option as
    part of the installation process to exclude these packages or to uninstall the packages if necessary. Satisfies: SRG-APP-000141-WSR-000077,
    SRG-APP-000141-WSR-000080'
