- id: '1.45'
  title: AS24-U1-000950
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Apache web server must be configured in accordance with the security configuration settings based on DoD
    security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs. GROUP ID:
    V-214272 RULE ID: SV-214272r961863'
  rationale: Configuring the Apache web server to implement organization-wide security implementation guides and security
    checklists guarantees compliance with federal standards and establishes a common security baseline across the DoD that
    reflects the most restrictive security posture consistent with operational requirements. Configuration settings are the
    set of parameters that can be changed that affect the security posture and/or functionality of the system. Security-related
    parameters are parameters impacting the security state of the Apache web server, including those required to satisfy other
    security control requirements.
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'Review the website to determine if "HTTP" and "HTTPS" are used in accordance with

    well-known ports (e.g., 80 and 443) or those ports and services as registered and

    approved for use by the DoD Ports, Protocols, and Services Management (PPSM).

    Verify that any variation in PPS is documented, registered, and approved by the PPSM.

    If well-known ports and services are not approved for used by PPSM, this is a finding.'
  remediation: 'Ensure the website enforces the use of IANA well-known ports for "HTTP" and

    "HTTPS".'
  checks:
  - type: manual_review
    info: 'Review the website to determine if "HTTP" and "HTTPS" are used in accordance with

      well-known ports (e.g., 80 and 443) or those ports and services as registered and

      approved for use by the DoD Ports, Protocols, and Services Management (PPSM).

      Verify that any variation in PPS is documented, registered, and approved by the PPSM.

      If well-known ports and services are not approved for used by PPSM, this is a finding.'
    severity: medium
- id: '1.46'
  title: AS24-U1-000960
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Apache web server software must be a vendor-supported version. GROUP ID: V-214273 RULE ID: SV-214273r961863'
  rationale: Many vulnerabilities are associated with older versions of web server software. As hot fixes and patches are
    issued, these solutions are included in the next version of the server software. Maintaining the web server at a current
    version makes the efforts of a malicious user to exploit the web service more difficult.
  impact: ''
  references: []
  page_start: 106
  audit_raw: 'Determine the version of the Apache software that is running on the system by entering

    the following command:

    httpd -v

    If the version of Apache is not at the following version or higher, this is a finding:

    Apache 2.4 (February 2012)

    NOTE: In some situations, the Apache software that is being used is supported by

    another vendor, such as Oracle in the case of the Oracle Application Server or IBM''s

    HTTP Server. The versions of the software in these cases may not match the version

    number noted above. If the site can provide vendor documentation showing the version

    of the web server is supported, this would not be a finding.'
  remediation: 'Install the current version of the web server software and maintain appropriate service

    packs and patches.'
  checks:
  - type: manual_review
    info: 'Determine the version of the Apache software that is running on the system by entering

      the following command:

      httpd -v

      If the version of Apache is not at the following version or higher, this is a finding:

      Apache 2.4 (February 2012)

      NOTE: In some situations, the Apache software that is being used is supported by

      another vendor, such as Oracle in the case of the Oracle Application Server or IBM''s

      HTTP Server. The versions of the software in these cases may not match the version

      number noted above'
    severity: medium
- id: '1.47'
  title: AS24-U1-000970
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server htpasswd files (if present) must reflect proper ownership and permissions. GROUP ID:
    V-214274 RULE ID: SV-214274r961863'
  rationale: In addition to OS restrictions, access rights to files and directories can be set on a website using the web
    server software. That is, in addition to allowing or denying all access rights, a rule can be specified that allows or
    denies partial access rights. For example, users can be given read-only access rights to files to view the information
    but not change the files. This check verifies that the htpasswd file is only accessible by System Administrators (SAs)
    or Web Managers, with the account running the web service having group permissions of read and execute. "htpasswd" is
    a utility used by Netscape and Apache to provide for password access to designated websites.
  impact: ''
  references: []
  page_start: 107
  audit_raw: 'Locate the htpasswd file by entering the following command:

    find / -name htpasswd

    Navigate to that directory.

    Run: ls -l htpasswd

    Permissions should be: r-x r - x - - - (550)

    If permissions on "htpasswd" are greater than "550", this is a finding.

    Verify the owner is the SA or Web Manager account.

    If another account has access to this file, this is a finding.'
  remediation: 'Ensure the SA or Web Manager account owns the "htpasswd" file.

    Ensure permissions are set to "550".'
  checks:
  - type: command
    command: find / -name htpasswd
    expected: ''
    severity: medium
    info: 'Locate the htpasswd file by entering the following command:

      find / -name htpasswd

      Navigate to that directory.

