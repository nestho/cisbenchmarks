    severity: medium
- id: '1.37'
  title: AS24-U1-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must be configured to integrate with an organizations security infrastructure. GROUP
    ID: V-214264 RULE ID: SV-214264r961395'
  rationale: A web server will typically use logging mechanisms for maintaining a historical log of activity that occurs within
    a hosted application. This information can then be used for diagnostic purposes, forensics purposes, or other purposes
    relevant to ensuring the availability and integrity of the hosted application. While it is important to log events identified
    as being critical and relevant to security, it is equally important to notify the appropriate personnel in a timely manner
    so they are able to respond to events as they occur. Manual review of the web server logs may not occur in a timely manner,
    and each event logged is open to interpretation by a reviewer. By integrating the web server into an overall or organization-wide
    log review, a larger picture of events can be viewed, and analysis can be done in a timely and reliable manner.
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'Work with the SIEM administrator to determine current security integrations.

    If the SIEM is not integrated with security, this is a finding.'
  remediation: 'Work with the SIEM administrator to integrate with an organizations security

    infrastructure.'
  checks:
  - type: manual_review
    info: 'Work with the SIEM administrator to determine current security integrations.

      If the SIEM is not integrated with security, this is a finding.'
    severity: medium
- id: '1.38'
  title: AS24-U1-000750
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Apache web server must generate log records that can be mapped to Coordinated Universal Time (UTC) or
    Greenwich Mean Time (GMT) which are stamped at a minimum granularity of one second. GROUP ID: V-214265 RULE ID: SV-214265r961443'
  rationale: 'If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis across multiple devices and log records. Time stamps generated by the Apache web server include date
    and time. Time is commonly expressed in UTC, a modern continuation of GMT, or local time with an offset from UTC. Without
    sufficient granularity of time stamps, it is not possible to adequately determine the chronological order of records.
    Time stamps generated by the Apache web server include date and time and must be to a granularity of one second. Satisfies:
    SRG-APP-000374-WSR-000172, SRG-APP-000375-WSR-000171'
  impact: ''
  references: []
  page_start: 91
  audit_raw: 'Review the web server documentation and configuration to determine the time stamp

    format for log data.

    Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

    apachectl -V | egrep -i ''httpd_root|server_config_file''

    -D HTTPD_ROOT="/etc/httpd"

    -D SERVER_CONFIG_FILE="conf/httpd.conf"

    Note: The apachectl front end is the preferred method for locating the Apache httpd file.

    For some Linux distributions, "apache2ctl -V" or "httpd -V" can also be used.

    Search for the "log_config_module" directive:

    cat /<path_to_file>/httpd.conf | grep -i "LogFormat"

    Verify the "LogFormat" directive exists.

    If the "LogFormat" directive does not exist, this is a finding.

    Verify the "LogFormat" line contains the "%t" flag.

    If "%t" flag is not present, time is not mapped to UTC or GMT time, this is a finding.'
  remediation: 'In a command line, run "httpd -M" to view a list of installed modules.

    If "log_config_module" is not listed, enable this module.

    Review the "httpd.conf" file.

    Determine if the "LogFormat" directive exists. If it does not exist, ensure the

    "LogFormat" line contains the %t flag.'
  checks:
  - type: command
    command: cat /<path_to_file>/httpd.conf | grep -i "LogFormat"
    expected: ''
    severity: medium
    info: 'Review the web server documentation and configuration to determine the time stamp

