  rationale: Cookies are used to exchange data between the web server and the client. Cookies, such as a session cookie, may
    contain session information and user credentials used to maintain a persistent connection between the user and the hosted
    application since HTTP/HTTPS is a stateless protocol. When the cookie parameters are not set properly (i.e., domain and
    path parameters), cookies can be shared within hosted applications residing on the same web server or to applications
    hosted on different web servers residing on the same domain.
