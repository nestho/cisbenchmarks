      uniq -c

      Review the images used for pods running within Kubernetes.

      If there are multiple versions of the same image, this is a finding.'
    severity: medium
- id: '1.23'
  title: CNTR-R2-001500
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Rancher RKE2 keystore must implement encryption to prevent unauthorized disclosure of information at rest
    within Rancher RKE2. GROUP ID: V-254573 RULE ID: SV-254573r1050650'
  rationale: Encrypting secrets at rest in etcd. By default, RKE2 will create an encryption key and configuration file and
    pass these to the Kubernetes API server. The result is that RKE2 automatically encrypts Kubernetes Secret objects when
    writing them to etcd.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'This is Not Applicable for RKE2 versions 1.20 and greater.

    Review the encryption configuration file.

    As root or with root permissions, run the following command:

    view /var/lib/rancher/rke2/server/cred/encryption-config.json

    Ensure the RKE2 configuration file on all RKE2 servers, located at

    /etc/rancher/rke2/config.yaml, does NOT contain:

    secrets-encryption: false

    If secrets encryption is turned off, this is a finding.'
  remediation: 'This is Not Applicable for RKE2 versions 1.20 and greater.

    Enable secrets encryption.

    Edit the RKE2 configuration file on all RKE2 servers, located at

    /etc/rancher/rke2/config.yaml, so that it contains:

    secrets-encryption: true'
  checks:
