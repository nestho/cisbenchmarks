- id: '1.20'
  title: CNTR-R2-001130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rancher RKE2 must prevent nonprivileged users from executing privileged functions to include disabling, circumventing,
    or altering implemented security safeguards/countermeasures. GROUP ID: V-254571 RULE ID: SV-254571r961353'
  rationale: 'Admission controllers intercept requests to the Kubernetes API before an object is instantiated. Enabling the
    admissions webhook allows for Kubernetes to apply policies against objects that are to be created, read, updated or deleted.
    Admissions controllers can be used for: • Prevent pod’s ability to run privileged containers • Prevent pod’s ability to
    use privileged escalation • Controlling pod’s access to volume types • Controlling pod’s access to host file system •
    Controlling pod’s usage of host networking objects and configuration Satisfies: SRG-APP-000340-CTR-000770, SRG-APP-000342-CTR-000775'
  impact: ''
  references: []
  page_start: 59
  audit_raw: "If using RKE2 v1.24 or older:\nOn the Server Node, run the command:\nkubectl get podsecuritypolicy\nFor any\
    \ pod security policies listed, with the exception of system-unrestricted-psp\n(which is required for core Kubernetes\
    \ functionality), edit the policy with the command:\nkubectl edit podsecuritypolicy policyname\nWhere policyname is the\
    \ name of the policy\nReview the runAsUser, supplementalGroups, and fsGroup sections of the policy.\nIf any of these sections\
    \ are missing, this is a finding.\nIf the rule within the runAsUser section is not set to \"MustRunAsNonRoot\", this is\
    \ a\nfinding.\nIf the ranges within the supplementalGroups section has min set to \"0\" or min is\nmissing, this is a\
    \ finding.\nIf the ranges within the fsGroup section have a min set to \"0\" or the min is missing, this\nis a finding.\n\
    If using RKE2 v1.25 or newer:\nOn each controlplane node, validate that the file \"/etc/rancher/rke2/rke2-pss.yaml\"\n\
    exists and the default configuration settings match the following:\n defaults:\n audit-version: latest\n enforce: restricted\n\
    \ enforce-version: latest\n warn: restricted\n warn-version: latest\nIf the configuration file differs from the above,\
    \ this is a finding.\n audit-version: \"latest\"\n warn: \"restricted\"\n warn-version: \"latest\"\n exemptions:\n usernames:\
    \ []\n runtimeClasses: []\n namespaces: [kube-system, cis-operator-system, tigera-operator]\nEnsure the namespace exemptions\
    \ contain only namespaces requiring access to\ncapabilities outside of the restricted settings above.\nOnce the file is\
    \ created, restart the Control Plane nodes with:\nsystemctl restart rke2-server"
  remediation: "If using RKE2 v1.24 or older:\nOn each Control Plane node, create the following policy to a file called restricted.yml.\n\
    apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata:\nname: restricted\nannotations:\nseccomp.security.alpha.kubernetes.io/allowedProfileNames:\n\
    'docker/default,runtime/default'\napparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'\nseccomp.security.alpha.kubernetes.io/defaultProfileName:\
    \ 'runtime/default'\napparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'\nspec:\nprivileged: false\n\
    #Required to prevent escalations to root.\nallowPrivilegeEscalation: false\n#This is redundant with non-root + disallow\
    \ privilege escalation,\n# but we can provide it for defense in depth.\nrequiredDropCapabilities:\n- ALL\n# Allow core\
    \ volume types.\nvolumes:\n- 'configMap'\n- 'emptyDir'\n- 'projected'\n- 'secret'\n- 'downwardAPI'\n# Assume that persistentVolumes\
    \ set up by the cluster admin are safe to use.\n- 'persistentVolumeClaim'\nhostNetwork: false\nhostIPC: false\nhostPID:\
    \ false\nrunAsUser:\n# Require the container to run without root privileges.\nrule: 'MustRunAsNonRoot'\nseLinux:\n# This\
    \ policy assumes the nodes are using AppArmor rather than SELinux.\nrule: 'RunAsAny'\nsupplementalGroups:\nrule: 'MustRunAs'\n\
    ranges:\n# Forbid adding the root group.\n- min: 1\nmax: 65535\nfsGroup:\nrule: 'MustRunAs'\nranges:\n# Forbid adding\
    \ the root group.\n- min: 1\nmax: 65535\nreadOnlyRootFilesystem: false\nTo implement the policy, run the command:\nkubectl\
    \ create -f restricted.yml\"\nIf using RKE v1.25 or newer:\nOn each Control Plane node, create the file \"/etc/rancher/rke2/rke2-pss.yaml\"\
    \ and add\nthe following content:\napiVersion: apiserver.config.k8s.io/v1\nkind: AdmissionConfiguration\nplugins:\n- name:\
    \ PodSecurity\n configuration:\n apiVersion: pod-security.admission.config.k8s.io/v1beta1\n kind: PodSecurityConfiguration\n\
    \ defaults:\n enforce: \"restricted\"\n enforce-version: \"latest\""
  checks:
