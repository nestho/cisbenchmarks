      kubectl get podsecuritypolicy

      For any pod security policies listed, with the exception of system-unrestricted-psp

      (which is required for core Kubernetes functionality), edit the policy with the command:

      kubectl edit podsecuritypolicy policyname

      Where policyname is the name of the policy

      Review the runAsUser, supplementalGroups, and'
- id: '1.21'
  title: CNTR-R2-001270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rancher RKE2 must prohibit the installation of patches, updates, and instantiation of container images without
    explicit privileged status. GROUP ID: V-254572 RULE ID: SV-254572r1016560'
  rationale: 'Controlling access to those users and roles responsible for patching and updating RKE2 reduces the risk of untested
    or potentially malicious software from being installed within the platform. This access may be separate from the access
    required to install container images into the registry and those access requirements required to instantiate an image
    into a service. Explicit privileges (escalated or administrative privileges) provide the regular user with explicit capabilities
    and control that exceeds the rights of a regular user. Kubernetes uses the API Server to control communication to the
    other services that makeup Kubernetes. The use of authorizations and not the default of "AlwaysAllow" enables the Kubernetes
    functions control to only the groups that need them. To control access, the API server must have one of the following
    options set for the authorization mode: --authorization-mode=ABAC Attribute-Based Access Control (ABAC) mode allows a
    user to configure policies using local files. --authorizationmode=RBAC Role-based access control (RBAC) mode allows a
    user to create and store policies using the Kubernetes API. --authorization-mode=Webhook WebHook is an HTTP callback mode
    that allows a user to manage authorization using a remote REST endpoint. --authorization-mode=Node Node authorization
    is a special-purpose authorization mode that specifically authorizes API requests made by kubelets. -- authorization-mode=AlwaysDeny
    This flag blocks all requests. Use this flag only for testing. Satisfies: SRG-APP-000378-CTR-000880, SRG-APP-000378-CTR-000885'
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Ensure authorization-mode is set correctly in the apiserver.

    Run this command on all RKE2 Control Plane hosts:

    /bin/ps -ef | grep kube-apiserver | grep -v grep

    If --authorization-mode is not set to "RBAC,Node" or is not configured, this is a finding.

    (By default, RKE2 sets Node,RBAC as the parameter to the --authorization-mode

    argument.)'
  remediation: "Edit the RKE2 Server configuration file on all RKE2 Control Plane hosts, located at\n/etc/rancher/rke2/config.yaml,\
    \ to contain the following:\n kube-apiserver-arg:\n--authorization-mode=RBAC,Node\nOnce configuration file is updated,\
    \ restart the RKE2 Server. Run the command:\nsystemctl restart rke2-server"
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-apiserver | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure authorization-mode is set correctly in the apiserver.

      Run this command on all RKE2 Control Plane hosts:

      /bin/ps -ef | grep kube-apiserver | grep -v grep

      If --authorization-mode is not set to "RBAC,Node" or is not configured, this is a finding.

      (By default, RKE2 sets Node,RBAC as the parameter to the --authorization-mode

      argument.)'
- id: '1.22'
  title: CNTR-R2-001580
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rancher RKE2 must remove old components after updated versions have been installed. GROUP ID: V-254574 RULE
    ID: SV-254574r961677'
  rationale: Previous versions of Rancher RKE2 components that are not removed after updates have been installed may be exploited
    by adversaries by causing older components to execute which contain vulnerabilities. When these components are deleted,
    the likelihood of this happening is removed.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'To view all pods and the images used to create the pods, from the RKE2 Control Plane,

    run the following command:

    kubectl get pods --all-namespaces -o jsonpath="{..image}" | \

    tr -s ''[[:space:]]'' ''\n'' | \

    sort | \

    uniq -c

    Review the images used for pods running within Kubernetes.

    If there are multiple versions of the same image, this is a finding.'
  remediation: 'Remove any old pods that are using older images. On the RKE2 Control Plane, run the

    command:

    kubectl delete pod podname

    (Note: "podname" is the name of the pod to delete.)

    Run the command:

    systemctl restart rke2-server'
  checks:
  - type: manual_review
    info: 'To view all pods and the images used to create the pods, from the RKE2 Control Plane,

