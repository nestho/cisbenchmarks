- id: '1.1'
  title: CNTR-R2-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Rancher RKE2 must protect authenticity of communications sessions with the use of FIPS-validated 140-2 or
    140-3 security requirements for cryptographic modules. GROUP ID: V-254553 RULE ID: SV-254553r1016525'
  rationale: 'Use strong TLS settings. RKE2 uses FIPS validated BoringCrypto modules. RKE2 Server can prohibit the use of
    SSL and unauthorized versions of TLS protocols to properly secure communication. There is a lot of traffic between RKE2
    nodes to deploy, update, and delete resources so it is important to set strong TLS settings on top of this default feature.
    It is also important to use approved cypher suites. This ensures the protection of the transmitted information, confidentiality,
    and integrity so that the attacker cannot read or alter this communication. The use of unsupported protocol exposes vulnerabilities
    to the Kubernetes by rogue traffic interceptions, man-in-the-middle attacks, and impersonation of users or services from
    the container platform runtime, registry, and key store. To enable the enforcement of minimum version of TLS and cipher
    suites to be used by the various components of RKE2, the settings "tls-min-version" and "tls-cipher-suites" must be set.
    Further documentation of the FIPS modules can be found here: https://docs.rke2.io/security/fips_support. Satisfies: SRG-APP-000014-CTR-000035,
    SRG-APP-000014-CTR-000040, SRG-APP000219-CTR-000550, SRG-APP-000441-CTR-001090, SRG-APP-000442-CTR001095, SRG-APP-000514-CTR-001315,
    SRG-APP-000560-CTR-001340, SRG-APP000605-CTR-001380, SRG-APP-000610-CTR-001385, SRG-APP-000635-CTR001405, SRG-APP-000645-CTR-001410'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Use strong TLS settings.

    On an RKE2 server, run each command:

    /bin/ps -ef | grep kube-apiserver | grep -v grep

    /bin/ps -ef | grep kube-controller-manager | grep -v grep

    /bin/ps -ef | grep kube-scheduler | grep -v grep

    For each, look for the existence of tls-min-version (use this command for an aid "| grep

    tls-min-version"):

    If the setting "tls-min-version" is not configured or it is set to "VersionTLS10" or

    "VersionTLS11", this is a finding.

    For each, look for the existence of the tls-cipher-suites.

    If "tls-cipher-suites" is not set for all servers, or does not contain the following, this is a

    finding:

    --tls-ciphersuites=suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_

    128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_

    256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_

    256_GCM_SHA384'
  remediation: 'Configure the use of strong TLS settings.

    Edit the RKE2 Server configuration file on all RKE2 Server hosts, located at

    /etc/rancher/rke2/config.yaml, to contain the following:

    kube-controller-manager-arg:

    - "tls-min-version=VersionTLS12" [or higher]

    - "tls-ciphersuites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM

    _SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM

    _SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM

    _SHA384"

    kube-scheduler-arg:

    - "tls-min-version=VersionTLS12"

    - "tls-ciphersuites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM

    _SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM

    _SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM

    _SHA384"

    kube-apiserver-arg:

    - "tls-min-version=VersionTLS12"

    - "tls-ciphersuites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM

    _SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM

    _SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM

    _SHA384"

    Once configuration file is updated, restart the RKE2 Server. Run the command:

    systemctl restart rke2-server'
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-apiserver | grep -v grep && /bin/ps -ef | grep kube-controller-manager | grep -v grep
      && /bin/ps -ef | grep kube-scheduler | grep -v grep
    expected: ''
    severity: medium
    info: 'Use strong TLS settings.

      On an RKE2 server, run each command:

      /bin/ps -ef | grep kube-apiserver | grep -v grep

      /bin/ps -ef | grep kube-controller-manager | grep -v grep

      /bin/ps -ef | grep kube-scheduler | grep -v grep

      For each, look for the existence of tls-min-version (use this command for an aid "| grep

      tls-min-version"):

      If the setting "tls-min-version" is not configured or it is set to "Versio'
- id: '1.2'
  title: CNTR-R2-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'RKE2 must use a centralized user management solution to support account management functions. GROUP ID: V-254554
    RULE ID: SV-254554r1043176'
  rationale: The Kubernetes Controller Manager is a background process that embeds core control loops regulating cluster system
    state through the API Server. Every process executed in a pod has an associated service account. By default, service accounts
    use the same credentials for authentication. Implementing the default settings poses a high risk to the Kubernetes Controller
    Manager. Setting the use-service-account-credential value lowers the attack surface by generating unique service accounts
    settings for each controller instance.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Ensure use-service-account-credentials argument is set correctly.

    Run this command on the RKE2 Control Plane:

    /bin/ps -ef | grep kube-controller-manager | grep -v grep

    If --use-service-account-credentials argument is not set to "true" or is not configured,

    this is a finding.'
  remediation: 'Edit the RKE2 Configuration File /etc/rancher/rke2/config.yaml on the RKE2 Control

    Plane and set the following "kube-controller-manager-arg" argument:

    - use-service-account-credentials=true

    Once the configuration file is updated, restart the RKE2 Server. Run the command:

    systemctl restart rke2-server'
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-controller-manager | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure use-service-account-credentials argument is set correctly.

      Run this command on the RKE2 Control Plane:

      /bin/ps -ef | grep kube-controller-manager | grep -v grep

      If --use-service-account-credentials argument is not set to "true" or is not configured,

      this is a finding.'
- id: '1.3'
  title: CNTR-R2-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rancher RKE2 components must be configured in accordance with the security configuration settings based on
    DOD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.
    GROUP ID: V-254555 RULE ID: SV-254555r1056186'
  rationale: 'Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    re-establishing access. One way to accomplish this is for the attacker to modify an existing account. Auditing of account
    creation is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail
    documents the creation of application user accounts and, as required, notifies administrators and/or application when
    accounts are created. Such a process greatly reduces the risk that accounts will be surreptitiously created and provides
    logging that can be used for forensic purposes. Within Rancher RKE2, audit data can be generated from any of the deployed
    container platform components. This audit data is important when there are issues, such as security incidents, that must
    be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to know where within
    the container platform the event occurred. To address access requirements, many application developers choose to integrate
    their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control
    policy requirements. Such integration allows the application developer to offload those access control functions and focus
    on core application features and functionality. Satisfies: SRG-APP-000026-CTR-000070, SRG-APP-000027-CTR-000075, SRG-APP000028-CTR-000080,
    SRG-APP-000092-CTR-000165, SRG-APP-000095-CTR000170, SRG-APP-000096-CTR-000175, SRG-APP-000097-CTR-000180, SRG-APP000098-CTR-000185,
    SRG-APP-000099-CTR-000190, SRG-APP-000100-CTR000195, SRG-APP-000101-CTR-000205, SRG-APP-000319-CTR-000745, SRG-APP000320-CTR-000750,
    SRG-APP-000343-CTR-000780, SRG-APP-000358-CTR000805, SRG-APP-000374-CTR-000865, SRG-APP-000375-CTR-000870, SRG-APP000381-CTR-000905,
    SRG-APP-000409-CTR-000990, SRG-APP-000492-CTR001220, SRG-APP-000493-CTR-001225, SRG-APP-000494-CTR-001230, SRG-APP000495-CTR-001235,
    SRG-APP-000496-CTR-001240, SRG-APP-000497-CTR001245, SRG-APP-000498-CTR-001250, SRG-APP-000499-CTR-001255, SRG-APP000500-CTR-001260,
    SRG-APP-000501-CTR-001265, SRG-APP-000502-CTR001270, SRG-APP-000503-CTR-001275, SRG-APP-000504-CTR-001280, SRG-APP000505-CTR-001285,
    SRG-APP-000506-CTR-001290, SRG-APP-000507-CTR001295, SRG-APP-000508-CTR-001300, SRG-APP-000509-CTR-001305, SRG-APP000510-CTR-001310,
    SRG-APP-000516-CTR-000790, SRG-APP-00516-CTR-001325'
  impact: ''
  references: []
  page_start: 17
  audit_raw: "Audit logging and policies:\n1. On all hosts running RKE2 Server, run the command:\n/bin/ps -ef | grep kube-apiserver\
    \ | grep -v grep\nIf --audit-policy-file is not set, this is a finding.\nIf --audit-log-mode is not = \"blocking-strict\"\
    , this is a finding.\n2. Ensure the RKE2 Server configuration file on all RKE2 Server hosts, located at\n/etc/rancher/rke2/config.yaml,\
    \ contains CIS profile setting. Run the following\ncommand:\ncat /etc/rancher/rke2/config.yaml\nRKE2 can be started with\
    \ the profile flag set to cis, cis-1.23, or cis-1.6 depending on the\nRKE2 version. Available with October 2023 releases\
    \ (v1.25.15+rke2r1,\nv1.26.10+rke2r1, v1.27.7+rke2r1, v1.28.3+rke2r1), use the generic profile: \"cis\".\nIf a value for\
    \ profile is not found or is not set correctly, this is a finding. (Example:\n\"profile: cis\")\n3. Check the contents\
    \ of the audit-policy file.\n4. By default, RKE2 expects the audit-policy file to be located at\n/etc/rancher/rke2/audit-policy.yaml;\
    \ however, this location can be overridden in\nthe /etc/rancher/rke2/config.yaml file with argument 'kube-apiserver-arg:\
    \ \"auditpolicy-file=/etc/rancher/rke2/audit-policy.yaml\"'.\nIf the audit policy file does not exist or does not look\
    \ like the following, this is a finding.\napiVersion: audit.k8s.io/v1\nkind: Policy\nmetadata:\n name: rke2-audit-policy\n\
    rules:\n - level: Metadata\n resources:\n - group: \"\"\n resources: [\"secrets\"]\n - level: RequestResponse\n resources:\n\
    \ - group: \"\"\n resources: [\"*\"]"
  remediation: "Audit logging and policies:\nEdit the /etc/rancher/rke2/config.yaml file, and enable the audit policy:\naudit-policy-file:\
    \ /etc/rancher/rke2/audit-policy.yaml\n1. Edit the RKE2 Server configuration file on all RKE2 Server hosts, located at\n\
    /etc/rancher/rke2/config.yaml, so that it contains required configuration.\n--audit-policy-file= Path to the file that\
    \ defines the audit policy\nconfiguration. (Example: /etc/rancher/rke2/audit-policy.yaml)\n--audit-log-mode=blocking-strict\n\
    If configuration file is updated, restart the RKE2 Server. Run the command:\nsystemctl restart rke2-server\n2. Edit the\
    \ RKE2 Server configuration file on all RKE2 Server hosts, located at\n/etc/rancher/rke2/config.yaml, so that it contains\
    \ required configuration.\nIf using RKE2 v1.24 or older, set:\nprofile: cis-1.6\nIf using RKE2 v1.25 or newer, set:\n\
    profile: cis-1.23\nAvailable with October 2023 releases (v1.25.15+rke2r1, v1.26.10+rke2r1,\nv1.27.7+rke2r1, v1.28.3+rke2r1),\
    \ use the generic profile \"cis\".\nIf configuration file is updated, restart the RKE2 Server. Run the command:\nsystemctl\
    \ restart rke2-server\n3. Edit the audit policy file, by default located at /etc/rancher/rke2/audit-policy.yaml\nto look\
    \ like below:\napiVersion: audit.k8s.io/v1\nkind: Policy\nmetadata:\n name: rke2-audit-policy\nrules:\n - level: Metadata\n\
    \ resources:\n - group: \"\"\n resources: [\"secrets\"]\n - level: RequestResponse\n resources:\n - group: \"\"\n resources:\
    \ [\"*\"]\nIf configuration files are updated on a host, restart the RKE2 Service. Run the command\n\"systemctl restart\
    \ rke2-server\" for server hosts and \"systemctl restart rke2-agent\" for\nagent hosts."
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-apiserver | grep -v grep && cat /etc/rancher/rke2/config.yaml
    expected: ''
    severity: medium
    info: 'Audit logging and policies:

      1. On all hosts running RKE2 Server, run the command:

      /bin/ps -ef | grep kube-apiserver | grep -v grep

      If --audit-policy-file is not set, this is a finding.

      If --audit-log-mode is not = "blocking-strict", this is a finding.

      2. Ensure the RKE2 Server configuration file on all RKE2 Server hosts, located at

      /etc/rancher/rke2/config.yaml, contains CIS profile setting. Run t'
- id: '1.4'
  title: CNTR-R2-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes Controller Manager must have secure binding. GROUP ID: V-254556 RULE ID: SV-254556r960792'
  rationale: Limiting the number of attack vectors and implementing authentication and encryption on the endpoints available
    to external sources is paramount when securing the overall Kubernetes cluster. The Controller Manager API service exposes
    port 10252/TCP by default for health and metrics information use. This port does not encrypt or authenticate connections.
    If this port is exposed externally, an attacker can use this port to attack the entire Kubernetes cluster. By setting
    the bind address to only localhost (i.e., 127.0.0.1), only those internal services that require health and metrics information
    can access the Control Manager API.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Ensure bind-address is set correctly.

    Run this command on the RKE2 Control Plane:

    /bin/ps -ef | grep kube-controller-manager | grep -v grep

    If --bind-address is not set to "127.0.0.1" or is not configured, this is a finding.'
  remediation: 'Edit the RKE2 Configuration File /etc/rancher/rke2/config.yaml on the RKE2 Control

    Plane and set the following "kube-controller-manager-arg" argument:

    - bind-address=127.0.0.1

    Once the configuration file is updated, restart the RKE2 Server. Run the command:

    systemctl restart rke2-server'
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-controller-manager | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure bind-address is set correctly.

      Run this command on the RKE2 Control Plane:

      /bin/ps -ef | grep kube-controller-manager | grep -v grep

      If --bind-address is not set to "127.0.0.1" or is not configured, this is a finding.'
- id: '1.5'
  title: CNTR-R2-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes Kubelet must have anonymous authentication disabled. GROUP ID: V-254557 RULE ID: SV-254557r960792'
  rationale: RKE2 registry is used to store images and is the keeper of truth for trusted images within the platform. To guarantee
    the images' integrity, access to the registry must be limited to those individuals who need to perform tasks to the images
    such as the update, creation, or deletion. Without this control access, images can be deleted that are in use by RKE2
    causing a denial of service (DoS), and images can be modified or introduced without going through the testing and validation
    process allowing for the intentional or unintentional introduction of containers with flaws and vulnerabilities. By allowing
    anonymous connections, the controls put in place to secure the Kubelet can be bypassed. Setting anonymous authentication
    to "false" also disables unauthenticated requests from kubelets. While there are instances where anonymous connections
    may be needed (e.g., health checks) and Role-Based Access Controls (RBAC) are in place to limit the anonymous access,
    this access must be disabled and only enabled when necessary.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Ensure anonymous-auth is set correctly so anonymous requests will be rejected.

    Run this command on each node:

    /bin/ps -ef | grep kubelet | grep -v grep

    If --anonymous-auth is set to "true" or is not configured, this is a finding.'
  remediation: 'Edit the Kubernetes Kubelet file etc/rancher/rke2/config.yaml on the RKE2 Control

    Plane and set the following:

    --anonymous-auth=false

    Once configuration file is updated, restart the RKE2 Agent. Run the command:

    systemctl restart rke2-server'
  checks:
  - type: command
    command: /bin/ps -ef | grep kubelet | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure anonymous-auth is set correctly so anonymous requests will be rejected.

      Run this command on each node:

      /bin/ps -ef | grep kubelet | grep -v grep

      If --anonymous-auth is set to "true" or is not configured, this is a finding.'
- id: '1.6'
  title: CNTR-R2-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have the insecure port flag disabled. GROUP ID: V-254558 RULE ID: SV-254558r960792'
  rationale: By default, the API server will listen on two ports. One port is the secure port and the other port is called
    the "localhost port". This port is also called the "insecure port", port 8080. Any requests to this port bypass authentication
    and authorization checks. If this port is left open, anyone who gains access to the host on which the master is running
    can bypass all authorization and authentication mechanisms put in place, and have full control over the entire cluster.
    Close the insecure port by setting the API server's --insecure-port flag to "0", ensuring that the --insecure-bind-address
    is not set.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Ensure insecure-port is set correctly.

    If running v1.20 through v1.23, this is default configuration so no change is necessary if

    not configured.

    If running v1.24, this check is Not Applicable.

    Run this command on the RKE2 Control Plane:

    /bin/ps -ef | grep kube-apiserver | grep -v grep

    If --insecure-port is not set to "0" or is not configured, this is a finding.'
  remediation: 'Edit the RKE2 Server configuration file on all RKE2 Server hosts, located at

    /etc/rancher/rke2/config.yaml, to contain the following:

    kube-apiserver-arg:

    - insecure-port=0

    Once configuration file is updated, restart the RKE2 Server. Run the command:

    systemctl restart rke2-server'
  checks:
  - type: command
    command: /bin/ps -ef | grep kube-apiserver | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure insecure-port is set correctly.

      If running v1.20 through v1.23, this is default configuration so no change is necessary if

      not configured.

      If running v1.24, this check is Not Applicable.

      Run this command on the RKE2 Control Plane:

      /bin/ps -ef | grep kube-apiserver | grep -v grep

      If --insecure-port is not set to "0" or is not configured, this is a finding.'
- id: '1.7'
  title: CNTR-R2-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes Kubelet must have the read-only port flag disabled. GROUP ID: V-254559 RULE ID: SV-254559r960792'
  rationale: Kubelet serves a small REST API with read access to port 10255. The read-only port for Kubernetes provides no
    authentication or authorization security control. Providing unrestricted access on port 10255 exposes Kubernetes pods
    and containers to malicious attacks or compromise. Port 10255 is deprecated and should be disabled. Close the read-only-port
    by setting the API server's read-only port flag to "0".
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Ensure read-only-port is set correctly so anonymous requests will be rejected.

    Run this command on each node:

    /bin/ps -ef | grep kubelet | grep -v grep

    If --read-only-port is not set to "0" or is not configured, this is a finding.'
  remediation: 'Edit the RKE2 Server configuration file on all RKE2 Server hosts, located at

    /etc/rancher/rke2/config.yaml, to contain the following:

    kubelet-arg:

    --read-only-port=0

    If configuration files are updated on a host, restart the RKE2 Service. Run the command

    "systemctl restart rke2-server" for server hosts and "systemctl restart rke2-agent" for

    agent hosts.'
  checks:
  - type: command
    command: /bin/ps -ef | grep kubelet | grep -v grep
    expected: ''
    severity: medium
    info: 'Ensure read-only-port is set correctly so anonymous requests will be rejected.

      Run this command on each node:

      /bin/ps -ef | grep kubelet | grep -v grep

      If --read-only-port is not set to "0" or is not configured, this is a finding.'
- id: '1.8'
  title: CNTR-R2-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have the insecure bind address not set. GROUP ID: V-254560 RULE ID: SV-254560r960792'
  rationale: By default, the API server will listen on two ports and addresses. One address is the secure address and the
    other address is called the "insecure bind" address and is set by default to localhost. Any requests to this address bypass
    authentication and authorization checks. If this insecure bind address is set to localhost, anyone who gains access to
    the host on which the master is running can bypass all authorization and authentication mechanisms put in place and have
    full control over the entire cluster. Close or set the insecure bind address by setting the API server's --insecure-bindaddress
    flag to an IP or leave it unset and ensure that the --insecure-bind-port is not set.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'If running rke2 Kubernetes version > 1.20, this requirement is not applicable (NA).

    Ensure insecure-bind-address is set correctly.

    Run the command:

    ps -ef | grep kube-apiserver

    If the setting insecure-bind-address is found and set to "localhost", this is a finding.'
  remediation: 'If running rke2 Kubernetes version > 1.20, this requirement is NA.

    Upgrade to a supported version of RKE2 Kubernetes.'
  checks:
  - type: command
    command: ps -ef | grep kube-apiserver
    expected: ''
    severity: medium
    info: 'If running rke2 Kubernetes version > 1.20, this requirement is not applicable (NA).

      Ensure insecure-bind-address is set correctly.

      Run the command:

      ps -ef | grep kube-apiserver

      If the setting insecure-bind-address is found and set to "localhost", this is a finding.'
- id: '1.9'
  title: CNTR-R2-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes kubelet must enable explicit authorization. GROUP ID: V-254561 RULE ID: SV-254561r960792'
  rationale: Kubelet is the primary agent on each node. The API server communicates with each kubelet to perform tasks such
    as starting/stopping pods. By default, kubelets allow all authenticated requests, even anonymous ones, without requiring
    any authorization checks from the API server. This default behavior bypasses any authorization controls put in place to
    limit what users may perform within the Kubernetes cluster. To change this behavior, the default setting of AlwaysAllow
    for the authorization mode must be set to "Webhook".
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Ensure authorization-mode is set correctly in the kubelet on each rke2 node.

    Run this command on each node:

    /bin/ps -ef | grep kubelet | grep -v grep

    If --authorization-mode is not set to "Webhook" or is not configured, this is a finding.'
  remediation: 'Edit the RKE2 Configuration File /etc/rancher/rke2/config.yaml on every RKE2 node and

    set the following "kubelet-arg" argument:

    - authorization-mode=Webhook

