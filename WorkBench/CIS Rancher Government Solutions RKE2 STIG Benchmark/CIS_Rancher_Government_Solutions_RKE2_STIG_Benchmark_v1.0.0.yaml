- id: '1.10'
  title: CNTR-R2-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have anonymous authentication disabled. GROUP ID: V-254562 RULE ID: SV-254562r960792'
  rationale: The Kubernetes API Server controls Kubernetes via an API interface. A user who has access to the API essentially
    has root access to the entire Kubernetes cluster. To control access, users must be authenticated and authorized. By allowing
    anonymous connections, the controls put in place to secure the API can be bypassed. Setting anonymous authentication to
    "false" also disables unauthenticated requests from kubelets. While there are instances where anonymous connections may
    be needed (e.g., health checks) and Role-Based Access Controls (RBAC) are in place to limit the anonymous access, this
    access should be disabled, and only enabled when necessary.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Ensure anonymous-auth argument is set correctly.

    Run this command on the RKE2 Control Plane:

