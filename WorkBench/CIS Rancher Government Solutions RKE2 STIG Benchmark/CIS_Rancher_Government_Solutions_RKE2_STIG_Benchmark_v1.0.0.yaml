    severity: medium
- id: '1.24'
  title: CNTR-R2-001620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rancher RKE2 registry must contain the latest images with most recent updates and execute within Rancher RKE2
    runtime as authorized by IAVM, CTOs, DTMs, and STIGs. GROUP ID: V-254575 RULE ID: SV-254575r961683'
  rationale: Software supporting RKE2, images in the registry must stay up to date with the latest patches, service packs,
    and hot fixes. Not updating RKE2 and container images will expose the organization to vulnerabilities. Flaws discovered
    during security assessments, continuous monitoring, incident response activities, or information system error handling
    must also be addressed expeditiously. Organization-defined time periods for updating security-relevant container platform
    components may vary based on a variety of factors including, for example, the security category of the information system
    or the criticality of the update (i.e., severity of the vulnerability related to the discovered flaw). This requirement
    will apply to software patch management solutions used to install patches across the enclave and to applications themselves
    that are not part of that patch management solution. For example, many browsers today provide the capability to install
    their own patch software. Patch criticality, as well as system criticality will vary. Therefore, the tactical situations
    regarding the patch management process will also vary. This means that the time period utilized must be a configurable
    parameter. Time frames for application of security-relevant software updates may be dependent upon the Information Assurance
    Vulnerability Management (IAVM) process. RKE2 components will be configured to check for and install security-relevant
    software updates within an identified time period from the availability of the update. RKE2 registry will ensure the images
    are current. The specific time period will be defined by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs).
  impact: ''
  references: []
  page_start: 69
  audit_raw: 'Authenticate on the RKE2 Control Plane.

    Verify all nodes in the cluster are running a supported version of RKE2 Kubernetes.

    Run command:

    kubectl get nodes

    If any nodes are running an unsupported version of RKE2 Kubernetes, this is a finding.

    Verify all images running in the cluster are patched to the latest version.

    Run command:

    kubectl get pods --all-namespaces -o

    jsonpath="{.items[*].spec.containers[*].image}" | tr -s ''[[:space:]]'' ''\n'' |

    sort | uniq -c

    If any images running in the cluster are not the latest version, this is a finding.

    Note: Kubernetes release support levels can be found at: https://kubernetes.io/releases/'
  remediation: 'Upgrade RKE2 to the supported version. Institute and adhere to the policies and

    procedures to ensure that patches are consistently applied within the time allowed.'
  checks:
  - type: manual_review
    info: 'Authenticate on the RKE2 Control Plane.

      Verify all nodes in the cluster are running a supported version of RKE2 Kubernetes.

      Run command:

      kubectl get nodes

