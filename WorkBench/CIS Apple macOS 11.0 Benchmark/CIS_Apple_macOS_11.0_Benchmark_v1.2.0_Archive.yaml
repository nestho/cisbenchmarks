- id: '3.2'
  title: Configure Security Auditing Flags per local organizational requirements
  scoring: manual
  profile:
  - Level 2
  description: Auditing is the capture and maintenance of information about security-related events. Auditable events often
    depend on differing organizational requirements.
  rationale: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises or attacks that have occurred, have begun, or are about to begin. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Depending on the governing authority,
    organizations can have vastly different auditing requirements. In this control we have selected a minimal set of audit
    flags that should be a part of any organizational requirements. The flags selected below may not adequately meet organizational
    requirements for users of this benchmark. The auditing checks for the flags proposed here will not impact additional flags
    that are selected. 173 | P a g e
  impact: ''
  references: []
  page_start: 173
  audit_raw: 'Historical audit flags are listed below as preliminary guidance.

    Perform the following to ensure the enabled Security Auditing Flags:

    Run the following command to verify the Security Auditing Flags that are enabled:

    $ sudo grep -e "^flags:" /etc/security/audit_control

    The output should include the following flags:

    • fm - audit successful/failed file attribute modification events

    • ad - audit successful/failed administrative events

    • ex - audit failed program execution

    • aa - audit all authorization and authentication events

    • fr - audit all failed read actions where enforcement stops a read of a file

    • lo - audit successful/failed login/logout events

    • fw - audit all failed write actions where enforcement stopped a file write

    The -all flag will capture all failed events across all audit classes and can be used to

    supersede the individual flags for failed events.

    Note: excluding potentially noisy audit events may be ideal, depending on your use-case.'
  remediation: 'Perform the following to set the require Security Auditing Flags:

    Edit the /etc/security/audit_control file and add fm, ad, ex, aa, fr, lo, and fw flags or

    add -all to flags.'
