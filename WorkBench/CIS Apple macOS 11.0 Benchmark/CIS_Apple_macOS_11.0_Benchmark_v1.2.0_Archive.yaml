- id: '3.5'
  title: Control access to audit records
  scoring: scored
  profile:
  - Level 1
  description: The audit system on macOS writes important operational and security information that can be both useful for
    an attacker and a place for an attacker to attempt to obfuscate unwanted changes that were recorded. As part of defense-in-depth
    the /etc/security/audit_control configuration and the files in /var/audit should be owned only by root with group wheel
    with read-only rights and no other access allowed. macOS ACLs should not be used for these files.
  rationale: Audit records should never be changed except by the system daemon posting events. Records may be viewed or extracts
    manipulated, but the authoritative files should be protected from unauthorized changes.
  impact: This control is only checking the default configuration to ensure that unwanted access to audit records is not available.
    180 | P a g e
  references: []
  page_start: 180
  audit_raw: 'Run the following commands to check file access rights:

    $ sudo ls -le /etc/security/audit_control

    The output should include the owner is root and the group is wheel or root and should not

    be readable or writable by Other. Ex: -r--r----- not -r--r--r-- or -r--r---w-

    $ sudo ls -le /var/audit/

    The output should include the owner is root and the group is wheel or root and all entries

    should not be readable or writable by Other (excluding the final current line). Ex: -r--r---

    -- not -r--r--r-- or -r--r---wexample:

    $ sudo ls -le /etc/security/audit_control

    -r-------- 1 root wheel 369 27 Jul 15:56 /etc/security/audit_control

    $ sudo ls -le /var/audit/

    -r--r----- 1 root wheel 1328341 10 Aug 09:08 20200810120444.crash_recovery

    -r--r----- 1 root wheel 2718979 10 Aug 09:16 20200810131220.20200810131641

    -r--r----- 1 root wheel 2102184 10 Aug 09:16 20200810131641.20200810131658

    -r--r----- 1 root wheel 2103140 10 Aug 09:18 20200810131658.20200810131810

    -r--r----- 1 root wheel 2097751 10 Aug 10:40 20200810131810.20200810144036

    -r--r----- 1 root wheel 1481487 10 Aug 11:39 20200810144036.not_terminated

    lrwxr-xr-x 1 root wheel 40 10 Aug 10:40 current ->

    /var/audit/20200810144036.not_terminated'
  remediation: 'Run the following to commands to set the audit records to the root user and wheel group:

    $ sudo chown -R root:wheel /etc/security/audit_control

    $ sudo chmod -R -o-rw /etc/security/audit_control

    $ sudo chown -R root:wheel /var/audit/

    $ sudo chmod -R -o-rw /var/audit/

    Note: It is recommended to do a thorough verification process on why the audit logs have

    been changed before following the remediation steps. If the system has different access

    controls on the audit logs, and the changes cannot be traced, a new install may be prudent.

    Check for signs of file tampering as well as unapproved OS changes.

    181 | P a g e'
