- id: '2.8'
  title: Disable Wake for network access
  scoring: scored
  profile:
  - Level 1
  description: This feature allows the computer to take action when the user is not present and the computer is in energy
    saving mode. These tools require FileVault to remain unlocked and fully rejoin known networks. This macOS feature is meant
    to allow the computer to resume activity as needed regardless of physical security controls. This feature allows other
    users to be able to access your computer’s shared resources, such as shared printers or iTunes playlists, even when your
    computer is in sleep mode. In a closed network when only authorized devices could wake a computer it could be valuable
    to wake computers in order to do management push activity. Where mobile workstations and agents exist the device will
    more likely check in to receive updates when already awake. Mobile devices should not be listening for signals on any
    unmanaged network or where untrusted devices exist that could send wake signals.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access.
  impact: Management programs like Apple Remote Desktop Administrator use wake-on-LAN to connect with computers. If turned
    off, such management programs will not be able to wake a computer over the LAN. If the wake-on-LAN feature is needed,
    do not turn off this feature. The control to prevent computer sleep has been retired for this version of the Benchmark.
    Forcing the computer to stay on and use energy in case a management push is needed is contrary to most current management
    processes. Only keep computers unslept if after hours pushes are required on closed LANs. 150 | P a g e
  references: []
  page_start: 150
  audit_raw: 'Perform the following to verify that Wake for network access or Power Nap are disabled:

    Graphical Method:

    1. Open System Preferences

    2. Select Energy Saver

    3. Verify that Wake for network access is not set

    Terminal Method:

    Run the following command verify if Wake for network access is not enabled:

    $ sudo pmset -g | grep -e womp

    womp 0'
  remediation: 'Perform the following disable Wake for network access or Power Nap:

    Graphical Method:

    1. Open System Preferences

    2. Select Energy Saver

    3. Uncheck Wake for network access

    Terminal Method:

    Run the following command to disable Wake for network access:

    $ sudo pmset -a womp 0'
  checks:
  - type: command
    command: $ sudo pmset -g | grep -e womp
    expected: 'Perform the following to verify that Wake for network access or Power Nap are disabled:'
    severity: medium
    info: 'Perform the following to verify that Wake for network access or Power Nap are disabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Energy Saver

      3. Verify that Wake for network access is not set

      Terminal Method:

      Run the following command verify if Wake for network access is not enabled:

      $ sudo pmset -g | grep -e womp

      womp 0'
- id: '2.9'
  title: Disable Power Nap
  scoring: scored
  profile:
  - Level 1
  description: This feature allows the computer to take action when the user is not present and the computer is in energy
    saving mode. These tools require FileVault to remain unlocked and fully rejoin known networks. This macOS feature is meant
    to allow the computer to resume activity as needed regardless of physical security controls. Power Nap allows the system
    to stay in low power mode, especially while on battery power and periodically connect to previously named networks with
    stored credentials for user applications to phone home and get updates. This capability requires FileVault to remain unlocked
    and the use of previously joined networks to be risk accepted based on the SSID without user input. This control has been
    updated to check the status on both battery and AC Power. The presence of an electrical outlet does not completely correlate
    with logical and physical security of the device or available networks.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access. The use
    of Power Nap adds to the risk of compromised physical and logical security. The user should be able to decrypt FileVault
    and have the applications download what is required when the computer is actively used. The control to prevent computer
    sleep has been retired for this version of the Benchmark. Forcing the computer to stay on and use energy in case a management
    push is needed is contrary to most current management processes. Only keep computers unslept if after hours pushes are
    required on closed LANs.
  impact: Power Nap exists for unattended user application updates like email and social media clients. With Power Nap disabled
    the computer will not wake and reconnect to known wireless SSIDs intermittently when slept. 153 | P a g e
  references: []
  page_start: 153
  audit_raw: 'Perform the following to verify that Wake for network access or Power Nap are disabled:

