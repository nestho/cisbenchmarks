- id: '4.6'
  title: Review Wi-Fi Settings
  scoring: manual
  profile:
  - Level 2
  description: Some organizations have comprehensive rules that cover the use of wireless technologies in order to implement
    operational security. There are specific policies governing the use of both Bluetooth and Wi-Fi (802.11) that often include
    disabling the wireless capability in either software or hardware or both. Wireless access is part of the feature set required
    for mobile computers and is considered essential for most users.
  rationale: The general use case for macOS is to use wireless connectivity. In the current hardware offering very few computers
    made by Apple provide a built-in wired network capability. While it is possible to get an ethernet adapter for wired connectivity
    it is not the default. The almost exclusive Apple use case is to support mobile connectivity for users of their devices
    through wireless connections. For use cases that wireless connectivity is not allowed an Apple model with built-in ethernet
    is the best option. Wireless can be turned off in those situations in the network system preference pane. 200 | P a g
    e
  impact: ''
  references: []
  page_start: 200
  audit_raw: 'Perform the following to verify the Airport Settings:

    Graphical Method:

    1. Open System Preferences

    2. Select Network

    3. Select Wi-Fi

    4. Verify that Status is set within your organization''s parameters

    Terminal Method:

    Run the following commands to verify the Airport settings:

    $ sudo networksetup -listallhardwareports | grep -A 1 ''Hardware Port: Wi-Fi''

    The output will include Device: and the network device number. ex: Device: en0

    $ sudo networksetup -getairportpower <network device number>

    The output will state whether wireless is enabled or disabled.

    Example:

    Wireless enabled:

    $ sudo networksetup -listallhardwareports | grep -A 1 ''Hardware Port: Wi-Fi''

    Hardware Port: Wi-Fi

    Device: en1

    $ sudo networksetup -getairportpower en1

    Wi-Fi Power (en1): On

    Wireless disabled:

    $ sudo networksetup -listallhardwareports | grep -A 1 ''Hardware Port: Wi-Fi''

    Hardware Port: Wi-Fi

    Device: en1

    $ sudo networksetup -getairportpower en1

    Wi-Fi Power (en1): Off

    201 | P a g e'
  remediation: 'Perform the following to set Airport to the correct status:

    Graphical Method:

    1. Open System Preferences

    2. Select Network

    3. Select Wi-Fi

    4. Set Status to your organization''s parameters

    Terminal Method:

    Run the following command to set Airport to the correct status:

    $ sudo networksetup -setairportpower <network device number> <on/off>

    Example:

    $ sudo networksetup -setairportpower en1 on'
  checks:
