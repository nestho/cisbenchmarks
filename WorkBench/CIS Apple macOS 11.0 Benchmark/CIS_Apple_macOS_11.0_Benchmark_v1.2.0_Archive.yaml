    in use.
  rationale: Prompting for a password when waking from sleep or screensaver mode mitigates the threat of an unauthorized person
    gaining access to a system in the user's absence.
  impact: Without a screenlock in place anyone with physical access to the computer would be logged in and able to use the
    active user's session.
  references: []
