    example:\n$ sudo systemsetup -listtimezones\nTime Zones:\n Africa/Abidjan\n Africa/Accra\n Africa/Addis_Ababa\n ...\n\
    \ Pacific/Wake\n Pacific/Wallis\n$ sudo systemsetup -settimezone America/New_York\nSet TimeZone: America/New_York\n44\
