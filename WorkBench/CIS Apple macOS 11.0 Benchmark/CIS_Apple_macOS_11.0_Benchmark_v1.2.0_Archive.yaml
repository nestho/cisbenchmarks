- id: '5.16'
  title: Disable Fast User Switching
  scoring: manual
  profile:
  - Level 2
  description: Fast user switching allows a person to quickly log in to the computer with a different account. While only
    a minimal security risk, when a second user is logged in, that user might be able to see what processes the first user
    is using, or possibly gain other information about the first user. In a large directory environment where it is difficult
    to limit log in access many valid users can login to other user's assigned computers.
  rationale: Fast user switching allows multiple users to run applications simultaneously at console. There can be information
    disclosed about processes running under a different user. Without a specific configuration to save data and log out users
    can have unsaved data running in a background session that is not obvious.
  impact: When support staff visits a user's computer console, they will not be able to log in to their own session if there
    is an active and locked session. 265 | P a g e
  references: []
  page_start: 265
  audit_raw: 'Perform the following to ensure that fast user switching is not enabled:

    Graphical Method:

    1. Open System Preferences

    2. Select Users & Groups

    3. Select Login Options

    4. Verify make sure the "Show fast user switching menu as..." is not set

    Terminal Method:

    Run the following command to verify that fast user switching is disabled:

    $ sudo defaults read /Library/Preferences/.GlobalPreferences.plist

    MultipleSessionEnabled

    If the output is neither 0 or The domain/default pair of

    (/Library/Preferences/.GlobalPreferences.plist, MultipleSessionEnabled) does

    not exist, the computer is not compliant.'
  remediation: 'Perform the following to disable fast user switching:

    Graphical Method:

    1. Open System Preferences

    2. Select Users & Groups

    3. Select Login Options

    4. Uncheck "Show fast user switching menu as..."

    Terminal Method:

    Run the following command to turn fast user switching off:

    $ sudo defaults write /Library/Preferences/.GlobalPreferences

    MultipleSessionEnabled -bool false'
  checks:
