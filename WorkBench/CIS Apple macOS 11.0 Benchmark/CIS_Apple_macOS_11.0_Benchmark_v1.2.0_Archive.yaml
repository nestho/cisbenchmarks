- id: '2.12'
  title: Automatic Actions for Optical Media
  scoring: manual
  profile:
  - Level 1
  description: Managing automatic actions, while useful in very few situations, is unlikely to increase security on the computer
    and does complicate the user experience and add additional complexity to the configuration. These settings are user controlled
    and can be changed without Administrator privileges unless controlled through MCX settings or Parental Controls. Unlike
    Windows, the Auto-run the optical media is accessed through Operating System applications. Those same applications can
    open and access the media directly. If optical media is not allowed in the environment the optical media drive should
    be disabled in hardware and software.
  rationale: Setting automatic actions for optical media can mitigate malicious code from running automatically when optical
    media is inserted. 160 | P a g e
