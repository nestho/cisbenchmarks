    meet your organization''s requirements

    194 | P a g e'
  remediation: 'Perform the following actions to create and edit multiple network locations as needed:

    1. Open System Preferences

    2. Select Network

    3. Select Location

    4. Select Edit Locations from the Locations popup menu

    5. Select any unneeded network locations

    6. Click the minus button for any unneeded locations

    7. Select Done

    8. Select any remaining network locations

    9. Select any unneeded network interfaces

    10. Select the minus button to remove them

    Note: Delete the Automatic location for any device that does not use multiple network

    services set for DHCP or dynamic addressing. If network services like FireWire, VPN,

    AirPort or Ethernet are not used by a specific device class those services should be deleted.'
