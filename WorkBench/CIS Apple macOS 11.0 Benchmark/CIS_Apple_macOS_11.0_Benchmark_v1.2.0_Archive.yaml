- id: 2.6.3
  title: iCloud Drive
  scoring: manual
  profile:
  - Level 2
  description: iCloud Drive is Apple's storage solution for applications on both macOS and iOS to use the same files that
    are resident in Apple's cloud storage. The iCloud Drive folder is available much like Dropbox, Microsoft OneDrive or Google
    Drive. One of the concerns in public cloud storage is that proprietary data may be inappropriately stored in an end user's
    personal repository. Organizations that need specific controls on information should ensure that this service is turned
