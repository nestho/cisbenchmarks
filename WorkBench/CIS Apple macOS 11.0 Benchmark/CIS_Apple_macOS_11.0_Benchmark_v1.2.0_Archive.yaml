  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.4'
  title: Apple Watch features with macOS
  scoring: manual
  profile:
  - Level 1
  description: With the release of macOS 10.12 Apple introduced a feature where the owner of an Apple Watch can lock and unlock
    their screen simply by being within range of a 10.12 computer when both devices are using the same AppleID with iCloud
    active. The benefit of not leaving the computer unlocked while the user is out of sight and readying the computer to resume
    work when the user returns without having to type in a password or insert a smartcard does seem attractive to people who
    have the Apple Watch. It is a continuation of other features like hand-off and continuity for the multiple Apple products
    users who have grown to expect their devices to work together. For the screen unlock capability in particular, it may
    not be attractive to organizations that are managing Apple devices and credentials. The capability allows a user to unlock
    their computer tied to an Enterprise account with a personal token that is not managed or controlled by the Enterprise.
    If the user loses their watch revoking the credential that can unlock the screen might be problematic. Apple Watches should
    not be used for screen unlocks, unless Enterprise control of the watch as a token tied to a user identity can be achieved.
    The risk of an auto-lock based on the user being out of proximity may still be acceptable if possible to do lock only.
    This functionality does require the computer to be logged in to iCloud. If iCloud is disabled the Apple watch lock and
    unlock will not be possible. A profile may be used to control unlock functionality. 302 | P a g e
  rationale: ''
  impact: ''
  references: []
  page_start: 302
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.5'
  title: System information backup to remote computers
  scoring: manual
  profile:
  - Level 2
  description: It is best practice to ensure that local computers are not a single point of failure for logging and auditing
    records about activity on the computer itself. Whether end user activity or system process information a mechanism should
    be in place to transfer the logs to another system that is hardened to receive them. A hardened log host reduces the risk
    of failure or compromise, particularly with user end points. From an enterprise management standpoint those records should
    be reviewed to ensure that there is not a common exploitable vulnerability, system bug or even hardware issue that can
    affect other devices in the environment. With changes in Apple's logging methods in the last few years third party tools
    appear to be preferred to ensure logs and records are obtained appropriately. Aggressive retention likely requires more
    space than available on built-in SSDs even if offline Time Machine backups are large and pristine. Please ensure that
    solutions to capture and retain log and audit records are in place.
  rationale: ''
  impact: ''
  references: []
