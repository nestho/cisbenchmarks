- id: 2.5.7
  title: Camera Privacy and Confidentiality Concerns
  scoring: manual
  profile:
  - Level 2
  description: If the computer is present in an area where there are privacy concerns or sensitive images or actions are taking
    place the camera should be covered at those times. A permanent cover or alteration may be required when the computer is
    always located in a confidential area. Malware is continuously discovered that circumvents the privacy controls of the
    built-in camera. No computer has perfect security and it seems likely that even if all the drivers are disabled or removed
    that working drivers can be re-introduced by a determined attacker.
  rationale: At this point video chatting and other uses of the built-in camera are standard uses for a computer. In cases
    where the camera is not allowed to be used at all or when the computer is located in private areas additional precautions
    are warranted. OS components used for the built-in video camera can also be used for other connected cameras, whether
    USB or Bluetooth. Removed OS components that enable a camera may be re-installed or reenabled. The General rule should
    be that if the camera can capture images that could cause embarrassment or an adverse impact the camera should be covered
    until it is appropriate to use.
