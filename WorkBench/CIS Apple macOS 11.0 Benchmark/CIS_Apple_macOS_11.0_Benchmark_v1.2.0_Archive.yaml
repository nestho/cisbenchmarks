- id: 5.2.7
  title: Password Age
  scoring: scored
  profile:
  - Level 1
  description: Over time passwords can be captured by third-parties through mistakes, phishing attacks, third party breaches
    or merely brute force attacks. To reduce the risk of exposure and to decrease the incentives of password reuse (passwords
    that are not forced to be changed periodically generally are not ever changed) users should reset passwords periodically.
    This control uses 365 days as the acceptable value. Some organizations may be more or less restrictive. This control mainly
    exists to mitigate against password reuse of the macOS account password in other realms that may be more prone to compromise.
    Attackers take advantage of exposed information to attack other accounts.
  rationale: Passwords should be changed periodically to reduce exposure.
  impact: Required password changes will lead to some locked computers requiring admin assistance.
  references: []
  page_start: 227
  audit_raw: 'Run the following command to verify that the password expires after at most 365 days:

    $ sudo pwpolicy -getaccountpolicies | grep -A1

    policyAttributeDaysUntilExpiration | tail -1 | cut -d''>'' -f2 | cut -d ''<'' -f1

    The output should be ≤ 365'
  remediation: 'Run the following command to require that passwords expire after at most 365 days:

    $ sudo pwpolicy -n /Local/Default -setglobalpolicy

    "maxMinutesUntilChangePassword=<value≤525600>"

    example:

    $ sudo pwpolicy -n /Local/Default -setglobalpolicy

    "maxMinutesUntilChangePassword=43200"

    227 | P a g e'
  checks:
  - type: command
    command: $ sudo pwpolicy -getaccountpolicies | grep -A1
    expected: 'Run the following command to verify that the password expires after at most 365 days:'
    severity: medium
    info: 'Run the following command to verify that the password expires after at most 365 days:

      $ sudo pwpolicy -getaccountpolicies | grep -A1

      policyAttributeDaysUntilExpiration | tail -1 | cut -d''>'' -f2 | cut -d ''<'' -f1

      The output should be ≤ 365'
- id: 5.2.8
  title: Password History
  scoring: scored
  profile:
  - Level 1
  description: Over time passwords can be captured by third-parties through mistakes, phishing attacks, third party breaches
    or merely brute force attacks. To reduce the risk of exposure and to decrease the incentives of password reuse (passwords
    that are not forced to be changed periodically generally are not ever changed) users must reset passwords periodically.
    This control ensures that previous passwords are not reused immediately by keeping a history of previous password hashes.
    Ensure that password history checks are part of the password policy on the computer. This control checks whether a new
    password is different than the previous 15. The latest NIST guidance based on exploit research referenced in this section
    details how one of the greatest risks is password exposure rather than password cracking. Passwords should be changed
    to a new unique value whenever a password might have been exposed to anyone other than the account holder. Attackers have
    maintained persistent control based on predictable password change patterns and substantially different patterns should
