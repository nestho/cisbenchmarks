- id: 2.3.1
  title: Set an inactivity interval of 20 minutes or less for the screen saver
  scoring: scored
  profile:
  - Level 1
  description: A locking screensaver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In macOS, the screensaver starts after a value is
    selected in the drop down menu. 20 minutes or less is an acceptable value. Any value can be selected through the command
    line or script but a number that is not reflected in the GUI can be problematic. 20 minutes is the default for new accounts.
  rationale: Setting an inactivity interval for the screensaver prevents unauthorized persons from viewing a system left unattended
    for an extensive period of time.
  impact: If the screensaver is not set users may leave the computer available for an unauthorized person to access information.
    50 | P a g e
  references: []
  page_start: 50
  audit_raw: "The preferred audit procedure for this control will evaluate every user account on the\ncomputer and will report\
    \ on all users where the value has been set. If the default value of\n20 minutes is used and the user has never changed\
    \ the setting there will not be an audit\nresult on their compliant setting. The time is set in seconds so all outputs\
    \ will be in that\nformat.\nPerform the following to ensure the system is set for the screen saver to activate in 20\n\
    minutes of less:\nRun this script to verify the idle times for all users:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice\
    \ | grep \"IOPlatformUUID\" | sed -e\n's/^.* \"\\(.*\\)\"$/\\1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
    \ if [ -e $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n defaults read $PREF.plist idleTime 2>&1\n fi\ndone\n\
    Note: If the output of the script includes The domain/default pair of\n(com.apple.screensaver, idleTime) does not exist\
    \ for any user, then the setting has\nnot been changed from the default. Follow the remediation instructions to set the\
    \ idle time\nto match your organization's policy.\n51 | P a g e\nFor Macs with a single user:\nGraphical Method:\n1. Open\
    \ System Preferences\n2. Select Desktop & Screen Saver\n3. Select Screen Saver\n4. Verify that Start after is set for\
    \ 20 minutes of less (≤1200)\nTerminal Method:\nRun the following command to verify that the screen saver idle time is\
    \ set to less than or\nequal to 20 minutes:\n$ sudo defaults -currentHost read com.apple.screensaver idleTime\nThe output\
    \ should be less than or equal to 20 minutes (≤1200). example: 60, 120, 300, 600,\nor 1200\nNote: If the output is The\
    \ domain/default pair of (com.apple.screensaver,\nidleTime) does not exist, then the setting has not been changed from\
    \ the default. Follow\nthe remediation instructions to set the idle time to match your organization's policy.\n52 | P\
    \ a g e"
