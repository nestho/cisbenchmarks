- id: '5.19'
  title: Enable Sealed System Volume (SSV)
  scoring: scored
  profile:
  - Level 1
  description: Sealed System Volume is a security feature introduced in macOS 11.0 Big Sur. During system installation, a
    SHA-256 cryptographic hash is calculated for all immutable system files and stored in a Merkle tree which itself is hashed
    as the Seal. Both are stored in the metadata of the snapshot created of the System volume. The seal is verified by the
    boot loader at startup. macOS will not boot if system files have been tampered with. If validation fails, the user will
    be instructed to reinstall the operating system. During read operations for files located in the Sealed System Volume,
    a hash is calculated and compared to the value stored in the Merkle tree.
  rationale: Running without Sealed System Volume on a production system could run the risk of Apple software, that integrates
    directly with macOS, being modified.
  impact: Apple Software that integrates with the operating system could become compromised.
  references:
  - 1. https://developer.apple.com/news/?id=3xpv8r2m
  - 2. https://eclecticlight.co/2020/11/30/is-big-surs-system-volume-sealed/
  page_start: 272
  audit_raw: 'Run the following command to verify that Sealed System Volume is enabled:

    $ sudo /usr/bin/csrutil authenticated-root status

    Authenticated Root status: enabled

    272 | P a g e'
  remediation: 'Perform the following to enable System Integrity Protection:

    1. Reboot into the Recovery Partition (reboot and hold down Command (⌘) + R)

    2. Select an administrator''s account and enter that account''s password

    3. Select Utilities

    4. Select Terminal

    5. Run the following command:

    $ sudo /usr/bin/csrutil enable authenticated-root

    Successfully enabled System authenticated root.

    Restart the machine for the changes to take effect.

    6. Reboot the computer

    Note: You cannot enable Sealed System Volume from the booted operating system. If the

    remediation is attempted in the booted OS and not the Recovery Partition the output will

    give the error csrutil: This tool needs to be executed from Recovery OS.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that Sealed System Volume is enabled:

      $ sudo /usr/bin/csrutil authenticated-root status

      Authenticated Root status: enabled

      272 | P a g e'
    severity: medium
- id: '5.20'
  title: Enable Library Validation
  scoring: scored
  profile:
  - Level 1
  description: Library Validation is a security feature introduced in macOS 10.10 Yosemite. Library Validation protects processes
    from loading arbitrary libraries. This stops root from loading arbitrary libraries into any process (depending on SIP
    status),and keeps root from becoming more powerful. Security is strengthened, because some user processes can no longer
    be fooled to run additional code without root's explicit request, which may grant access to daemons that depend on Library
    Validation for secure validation of code identity.
  rationale: Running without Library Validation on a production system runs the risk of the modification of system binaries
    or code injection of system processes that would otherwise be protected by Library Validation.
  impact: System binaries and processes could load arbitrary libraries.
  references:
  - 1. https://github.com/Automattic/wp-desktop/issues/790
  - 2. https://www.naut.ca/blog/2020/11/13/forbidden-commands-to-liberate-macos/
  page_start: 275
  audit_raw: 'Run the following command to verify that Library Validation is set:

    $ sudo defaults read

    /Library/Preferences/com.apple.security.libraryvalidation.plist

    DisableLibraryValidation

    0

    Note: If the settings has not been changed from the default, then this audit will fail on the

    command line. Follow the remediation instructions to verify that it is set to a disabled

    status.'
  remediation: 'Run the following command to set Library Validation:

