- id: '5.3'
  title: Reduce the sudo timeout period
  scoring: scored
  profile:
  - Level 1
  description: The sudo command allows the user to run programs as the root user. Working as the root user allows the user
    an extremely high level of configurability within the system. This control along with the control to use a separate timestamp
    for each tty limits the window where an unauthorized user, process or attacker could utilize legitimate credentials that
    are valid for longer than required.
  rationale: The sudo command stays logged in as the root user for five minutes before timing out and re-requesting a password.
    This five-minute window should be eliminated since it leaves the system extremely vulnerable. This is especially true
    if an exploit were to gain access to the system, since they would be able to make changes as a root user.
  impact: This control has a serious impact where users often have to use sudo. It is even more of an impact where users have
    to use sudo multiple times in quick succession as part of normal work processes. Organizations with that common use case
    will likely find this control too onerous and are better to accept the risk of not requiring a 0 grace period. In some
    ways the use of sudo -s, which is undesirable, is better than a long grace period since that use does change the hash
    to show that it is a root shell rather than a normal shell where sudo commands will be implemented without a password.
  references: []
  page_start: 231
  audit_raw: 'Perform the following to verify the sudo timeout period:

    $ sudo grep -e "timestamp" /etc/sudoers

    Defaults timestamp_timeout=0

    231 | P a g e'
  remediation: 'Run the following command to edit the sudo settings:

    $ sudo visudo

    Add the line Defaults timestamp_timeout=0 in the Override built-in defaults section.'
  checks:
  - type: manual_review
    info: 'Perform the following to verify the sudo timeout period:

      $ sudo grep -e "timestamp" /etc/sudoers

      Defaults timestamp_timeout=0

      231 | P a g e'
    severity: medium
- id: '5.4'
  title: Automatically lock the login keychain for inactivity
  scoring: manual
  profile:
  - Level 2
  description: The login keychain is a secure database store for passwords and certificates and is created for each user account
    on macOS. The system software itself uses keychains for secure storage. Anyone with physical access to an unlocked keychain
    where the screen is also unlocked can copy all passwords in that keychain. Application access to the login keychain does
    not keep it unlocked. If you set Apple Mail to check for email every 10 minutes using the keychain for credentials and
    the keychain to lock every 15 minutes if inactive it will still cause the keychain to lock. The approach recommended here
    is that the login keychain be set to periodically lock when inactive to reduce the risk of password exposure or unauthorized
    use of credentials by a third party. The time period that an organization uses will depend on how great the use is of
    keychain-aware applications. Organizations that use Firefox and Thunderbird will have a much different tolerance than
    those organizations using keychain aware applications extensively.
  rationale: While logged in, the keychain does not prompt the user for passwords for various systems and/or programs. This
    can be exploited by unauthorized users to gain access to passwordprotected programs and/or systems in the absence of the
    user. Timing out the keychain can reduce the exploitation window.
  impact: If the timeout is set too low on heavily-used items the user will be annoyed and may use workarounds. 234 | P a
    g e
  references: []
  page_start: 234
  audit_raw: 'Perform the following to verify the login keychain inactivity lock time:

    Graphical Method:

    1. Open Keychain Access

    2. Select each login

    3. Select Edit

    4. Select Change Settings for keychain login

    5. Authenticate, if requested

    6. Verify that the Lock after minutes of inactivity is ≤ 6 hours (360 minutes)

    Terminal Method:

    For each each user, run the following command to verify the login keychain inactivity lock

    time:

    $ sudo -u <username> security unlock-keychain

    /Users/<username>/Library/Keychains/login.keychain

    $ sudo -u <username> security show-keychain-info

    /Users/<username>/Library/Keychains/login.keychain

    The output will include Keychain "<NULL>" timeout=. Verify that the output value

    returned is ≤ 21600 (6 hours).

    example:

    $ sudo -u seconduser security unlock-keychain

    /Users/seconduser/Library/Keychains/login.keychain

    password to unlock /Users/seconduser/Library/Keychains/login.keychain:

    $ sudo -u seconduser security show-keychain-info

    /Users/seconduser/Library/Keychains/login.keychain

    Keychain "/Users/seconduser/Library/Keychains/login.keychain" timeout=540000s

    235 | P a g e'
  remediation: 'Perform the following to set the login keychain inactivity time lock:

    Graphical Method:

    1. Open Keychain Access

    2. Select login

    3. Select Edit

    4. Select Change Settings for keychain login

    5. Authenticate, if requested.

    6. Change the Lock after # minutes of inactivity setting for the Login Keychain to a

    value that is ≤ 6 hour (360 minutes)

    Terminal Method:

    For each user, run the following command to set the lock value for the login keychain:

    $ sudo -u <username> security set-keychain-settings -t 21600

    /Users/<username>/Library/Keychains/login.keychain

    example:

    $ sudo -u seconduser security set-keychain-settings -t 21600

    /Users/seconduser/Library/Keychains/login.keychain'
  checks:
  - type: manual_review
    info: 'Perform the following to verify the login keychain inactivity lock time:

      Graphical Method:

      1. Open Keychain Access

      2. Select each login

      3. Select Edit

      4. Select Change Settings for keychain login

      5. Authenticate, if requested

      6. Verify that the Lock after minutes of inactivity is ≤ 6 hours (360 minutes)

      Terminal Method:

      For each each user, run the following command to verify the login keychain inactivity lock

      time:

      $ sudo -u <username> security unlock-keychain

      /Users/<username>/Library/Keychains'
    severity: medium
- id: '5.5'
  title: Use a separate timestamp for each user/tty combo
  scoring: scored
  profile:
  - Level 1
  description: Using tty tickets ensures that a user must enter the sudo password in each Terminal session. With sudo versions
    1.8 and higher, introduced in 10.12, the default value is to have tty tickets for each interface so that root access is
    limited to a specific terminal. The default configuration can be overwritten or not configured correctly on earlier versions
    of macOS.
  rationale: In combination with removing the sudo timeout grace period, a further mitigation should be in place to reduce
    the possibility of a background process using elevated rights when a user elevates to root in an explicit context or tty.
    Additional mitigation should be in place to reduce the risk of privilege escalation of background processes.
  impact: This control should have no user impact. Developers or installers may have issues if background processes are spawned
    with different interfaces than where sudo was executed.
  references: []
  page_start: 237
  audit_raw: 'Run the following commands to verify that the default sudoers controls are in place with

    explicit tickets per tty:

    $ sudo grep -E -s ''!tty_tickets'' /etc/sudoers /etc/sudoers.d/*

    Nothing should be returned.

    $ sudo grep -E -s ''timestamp_type'' /etc/sudoers /etc/sudoers.d/*

    Ensure that nothing is returned or that the output does not include timestamp_type=ppid

    or timestamp_type=global

    237 | P a g e'
  remediation: 'Edit the /etc/sudoers file with visudo and remove !tty_tickets from any Defaults line. If

    there is a Default line of timestamp_type= with a value other than tty, change the value to

    tty

    If there is a file in the /etc/sudoers.d/ folder that contains Defaults !tty_tickets, edit

    the file and remove !tty_tickets from any Defaults line. If there is a file /etc/sudoers.d/

    folder that contains a Default line of timestamp_type= with a value other than tty, change

    the value to tty'
  checks:
  - type: manual_review
    info: 'Run the following commands to verify that the default sudoers controls are in place with

      explicit tickets per tty:

      $ sudo grep -E -s ''!tty_tickets'' /etc/sudoers /etc/sudoers.d/*

      Nothing should be returned.

      $ sudo grep -E -s ''timestamp_type'' /etc/sudoers /etc/sudoers.d/*

      Ensure that nothing is returned or that the output does not include timestamp_type=ppid

      or timestamp_type=global

      237 | P a g e'
    severity: medium
