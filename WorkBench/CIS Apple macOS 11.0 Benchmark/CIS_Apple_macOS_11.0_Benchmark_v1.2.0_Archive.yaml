- id: 2.4.8
  title: Disable File Sharing
  scoring: scored
  profile:
  - Level 1
  description: Server Message Block (SMB), Common Internet File System (CIFS) When Windows (or possibly Linux) computers need
    to access file shared on a Mac, SMB/CIFS file sharing is commonly used. Apple warns that SMB sharing stores passwords
    is a less secure fashion than AFP sharing and anyone with system access can gain access to the password for that account.
    When sharing with SMB, each user that will access the Mac must have SMB enabled.
  rationale: By disabling file sharing, the remote attack surface and risk of unauthorized access to files stored on the system
    is reduced.
  impact: File Sharing can be used to share documents with other users but hardened servers should be used rather than user
    endpoints. Turning on file sharing increases the visibility and attack surface of a system unnecessarily.
