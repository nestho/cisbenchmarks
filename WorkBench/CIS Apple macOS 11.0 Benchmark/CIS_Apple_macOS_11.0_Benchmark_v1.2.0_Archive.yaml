- id: '5.17'
  title: Secure individual keychains and items
  scoring: manual
  profile:
  - Level 2
  description: By default, the keychain for an account, especially a local account, has the same password as the account's
    login password. It is possible to change the passwords on keychains to something different than the login password, and
    doing so would keep that keychain locked until needed after login. This is especially important when a smartcard is being
    used for console login. Keychains need to be protected by more than a pin in order to be secured and the default behavior
    with a smartcard will result in a pin for the login password. Individual keychain entries can have special ACLs to increase
    security as well.
  rationale: Each keychain entry can have different access controls. It's possible to set the keychain item to require a keychain
    password every time an item is accessed, even if the keychain is unlocked. This level of security could be useful for
    bank passwords or other passwords that need extra security.
  impact: Having to enter the keychain password for each access could become inconvenient and/or tedious for users.
  references: []
  page_start: 268
  audit_raw: '1. Open Utilities

    2. Select Keychain Access

    3. Double-click keychain

    4. Select Access Control

    5. Verify if the box next to "Ask for Keychain Password" is checked'
