- id: '1.7'
  title: Computer Name Considerations.
  scoring: manual
  profile:
  - Level 2
  description: If the computer is used in an organization that assigns host names, it is a good idea to change the computer
    name to the host name. This is more of a best practice than a security measure. If the host name and the computer name
    are the same, computer support may be able to track problems down more easily. Standard naming patterns avoid collisions
    and mitigate risk for computer users. With mobile devices using DHCP IP tracking has serious drawbacks; hostname or computer
    name tracking makes much more sense for those organizations that can implement it. If the computer is using different
    names for the "Computer Name" DNS and Directory environments it can be difficult to manage Macs in an Enterprise asset
    inventory.
  rationale: Part of IT security is having visibility into all of the devices that the organization is responsible for. Without
    a complete inventory it is impossible to ensure all security controls are met on all organizational devices. Default macOS
    naming deconfliction controls can create issues for appropriate management and tracking as well as privacy exposure. By
    default the name of a macOS computer is derived from the first user created. If the user has multiple computers or an
    image is used without an appropriate name change there will be multiple computers with names derived from the same user
    for discovery deconfliction. How many "Ron Colvin's MacBook Pro" should there be, are any missing? Local network auto
    renaming to avoid collisions also allows for the enumeration of local computer names. Computers should not be named after
    their users, especially on untrusted networks. For social engineering purposes the computer name should not provide a
    full name of the user or an identifiable name that might be used to assist in targeted user attacks. A documented plan
    to better enable a complete device inventory without exposing user or organizational information is part of mature security.
    31 | P a g e
  impact: ''
  references:
  - 1. https://support.apple.com/en-ca/guide/mac-help/mchlp1177/11.0/mac/11.0
  - 2. https://uberagent.com/blog/choosing-macos-computer-names-wisely/
  page_start: 31
  audit_raw: 'Perform the following to verify the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Verify that Computer Name is set to your organization''s parameters'
  remediation: 'Perform the following to set the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Set Computer Name to your organization''s parameters'
  checks:
  - type: manual_review
    info: 'Perform the following to verify the computer name:

      1. Open System Preferences

      2. Select Sharing

      3. Verify that Computer Name is set to your organization''s parameters'
    severity: medium
- id: 2.1.1
  title: Turn off Bluetooth, if no paired devices exist
  scoring: scored
  profile:
  - Level 1
  description: Bluetooth devices use a wireless communications system that replaces the cables used by other peripherals to
    connect to a system. It is by design a peer-to-peer network technology and typically lacks centralized administration
    and security enforcement infrastructure.
  rationale: Bluetooth is particularly susceptible to a diverse set of security vulnerabilities involving identity detection,
    location tracking, denial of service, unintended control and access of data and voice channels, and unauthorized device
    control and data access.
  impact: There have been many Bluetooth exploits. While Bluetooth can be hardened, it does create a local wireless network
    that can be attacked to compromise both devices and information. Apple has emphasized the ease of use in Bluetooth devices
    so it is generally expected that Bluetooth will be used. Turning off Bluetooth with this control will also disable the
    Bluetooth sharing capability that is more strongly recommended against in control 2.4.7.
  references: []
  page_start: 36
  audit_raw: 'Perform the following to ensure that Bluetooth is only enabled if there are paired devices:

    Run the following command to verify that Bluetooth is disabled:

    $ sudo defaults read /Library/Preferences/com.apple.Bluetooth

    ControllerPowerState

    0

    If the value 1 is returned it indicates that Bluetooth is enabled. The computer is compliant

    only if paired devices exist.

    Run the following command to verify if there are paired devices:

    $ sudo system_profiler SPBluetoothDataType | grep "Bluetooth:" -A 20 | grep

    Connectable

    The output should include Connectable: Yes.

    36 | P a g e'
  remediation: 'Perform the following to disable Bluetooth:

    Graphical Method:

    1. Open System Preferences

    2. Select Bluetooth

    3. Select Turn Bluetooth Off

    Terminal Method:

    Run the following command to disable Bluetooth

    $ sudo defaults write /Library/Preferences/com.apple.Bluetooth

    ControllerPowerState -int 0

    $ sudo killall -HUP blued

    Note: When using the terminal method to disable Bluetooth, the prescribed state will not

    be properly shown in the GUI. Use the terminal method of the audit to verify if Bluetooth is

    enabled/disabled.'
  checks:
  - type: command
    command: $ sudo system_profiler SPBluetoothDataType | grep "Bluetooth:" -A 20 | grep
    expected: 'Run the following command to verify that Bluetooth is disabled:'
    severity: medium
    info: 'Perform the following to ensure that Bluetooth is only enabled if there are paired devices:

      Run the following command to verify that Bluetooth is disabled:

      $ sudo defaults read /Library/Preferences/com.apple.Bluetooth

      ControllerPowerState

      0

      If the value 1 is returned it indicates that Bluetooth is enabled. The computer is compliant

      only if paired devices exist.

      Run the following command to verify '
- id: 2.1.2
  title: Show Bluetooth status in menu bar
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, discoverable, what paired devices exist, and what paired devices
    are currently active.
  impact: Bluetooth is a useful wireless tool that has been widely exploited when configured improperly. The user should have
    insight into the Bluetooth status. 38 | P a g e
  references: []
  page_start: 38
  audit_raw: 'Perform the following to ensure that Bluetooth status shows in the menu bar:

    Graphical Method:

    1. Open System Preferences

    2. Select Bluetooth

    3. Verify the Show Bluetooth in menu bar is selected

    Terminal Method:

    For each user, run the following command to verify that the Bluetooth status is enabled to

    show in the menu bar:

    $ sudo -u <username> defaults -currentHost read com.apple.controlcenter.plist

    Bluetooth

    18

    Note: If the settings has not been changed from the default, then this audit will fail on the

    command line. Follow the remediation instructions to verify that it is set to a disabled

    status.

    example:

    $ sudo -u firstuser defaults -currentHost read com.apple.controlcenter.plist

    Bluetooth

    18

    39 | P a g e'
  remediation: 'Perform the following to enable Bluetooth status in the menu bar:

    Graphical Method:

    1. Open System Preferences

    2. Select Bluetooth

    3. Select Show Bluetooth in menu bar

    Terminal Method:

    For each user, run the following command to enable Bluetooth status in the menu bar:

    $ sudo -u <username> defaults -currentHost write

    com.apple.controlcenter.plist Bluetooth -int 18

    example:

    $ sudo -u firstuser defaults -currentHost write com.apple.controlcenter.plist

    Bluetooth -int 18'
  checks:
