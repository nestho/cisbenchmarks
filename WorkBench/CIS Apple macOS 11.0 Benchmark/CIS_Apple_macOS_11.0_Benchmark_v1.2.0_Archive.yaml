- id: 2.5.6
  title: Limit Ad tracking and personalized Ads
  scoring: scored
  profile:
  - Level 1
  description: Apple provides a framework that allows advertisers to target Apple users and end-users with advertisements.
    While many people prefer that when they see advertising it is relevant to them and their interests, the detailed information
    that is data mining collected, correlated, and available to advertisers in repositories is often disconcerting. This information
    is valuable to both advertisers and attackers and has been used with other metadata to reveal users' identities. Organizations
    should manage advertising settings on computers rather than allow users to configure the settings. Apple Information Ad
    tracking should be limited on 10.15 and prior.
  rationale: Organizations should manage user privacy settings on managed devices to align with organizational policies and
    user data protection requirements.
  impact: Uses will see generic advertising rather than targeted advertising. Apple warns that this will reduce the number
    of relevant ads. 122 | P a g e
