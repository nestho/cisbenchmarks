- id: 2.4.11
  title: Disable Media Sharing
  scoring: scored
  profile:
  - Level 2
  description: Starting with macOS 10.15 Apple has provided a control to allow a user to share Apple downloaded content on
    all Apple devices that are signed in with the same Apple ID. This allows a user to share downloaded Movies, Music or TV
    shows with other controlled macOS, iOS and iPadOS devices as well as photos with Apple TVs. With this capability guest
    users can also use media downloaded on the computer. The recommended best practice is not to use the computer as a server
    but to utilize Apple's cloud storage to download and use content stored there if content stored with Apple is used on
    multiple devices. https://support.apple.com/guide/mac-help/set-up-media-sharing-on-macmchlp13371337/mac This capability
    requires the use of macOS clients as P2P nodes for updated Apple content. Unless there is a business requirement to manage
    operational Internet connectivity bandwidth user endpoints should not store content and act as a cluster to provision
    data. Content types supported by content caching in macOS
  rationale: Disabling Media Sharing reduces the remote attack surface of the system.
  impact: Media Sharing allows for pre-downloaded content on a Mac to be available to other Apple devices on the same network.
    Leaving this disabled forces device users to stream or download content from each Apple authorized device. This sharing
