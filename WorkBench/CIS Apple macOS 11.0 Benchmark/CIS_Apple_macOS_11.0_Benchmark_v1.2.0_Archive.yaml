- id: '7.1'
  title: Extensible Firmware Interface (EFI) password
  scoring: manual
  profile:
  - Level 2
  description: EFI is the software link between the motherboard hardware and the software operating system. EFI determines
    which partition or disk to load macOS from, it also determines whether the user can enter single-user mode. The main reasons
    to set a firmware password have been protections against an alternative boot disk, protection against a passwordless root
    shell through single user mode and protection against firewire DMA attacks. In the past it was not difficult to reset
    the firmware password by removing RAM but it did make tampering slightly harder and having to remove RAM remediated memory
    scraping attacks through DMA. It has always been difficult to Manage the firmware password on macOS computers, though
    some tools did make it much easier. Apple patched OS X in 10.7 to mitigate the DMA attacks and the use of FileVault 2
    Full-Disk Encryption mitigates the risk of damage to the boot volume if an unauthorized user uses a different boot volume
    or uses Single User Mode. Apple's reliance on the recovery partition and the additional features it provides make controls
    that do not allow the user to boot into the recovery partition less attractive. Starting in Late 2010 with the MacBook
    Air Apple has slowly updated the requirements to recover from a lost firmware password. Apple only supports taking the
    computer to an Apple authorized service provider. This change makes managing the firmware password effectively more critical
    if it is used. Setting the firmware password may be good practice in some environments. We cannot recommend it as a standard
    security practice at this time. http://support.apple.com/kb/ts3554 https://jamfnation.jamfsoftware.com/article.html?id=58
    http://derflounder.wordpress.com/2012/02/05/protecting-yourself-against-firewiredma-attacks-on-10-7-x/ http://derflounder.wordpress.com/2013/04/26/booting-into-single-user-mode-on-afilevault-2-encrypted-mac/
    297 | P a g e
  rationale: ''
  impact: ''
  references: []
  page_start: 297
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.2'
  title: FileVault and Local Account Password Reset using AppleID
  scoring: manual
  profile:
  - Level 2
  description: 'Apple has provided services for several years that allowed a user to reset a local account password on a computer
    using their Apple ID and a service to store the FileVault Master Password with Apple that would be controlled by access
    to an Apple ID. These distinct services have been more cleanly integrated starting in 10.12. This integrated service for
    password and decryption is a concern in Enterprise environments. Normal Enterprise management controls mitigate the risk
    of external control of organizational systems. The user of the system already has the ability to unlock the disk in order
    to log in and use it and some form of password recovery function is likely already in place for any approved accounts.
    In addition: • You cannot reset anything but a local account • You need physical access to the computer on a network that
    can phone home to Apple • Enterprise FileVault management precludes the use of Apple''s personal encryption recovery tied
    to a User''s Apple ID • The current login keychain will have to be discarded unless the user remembers the old password
    This service allows for organizational computer users to utilize AppleIDs for encryption key escrow and user account management.
    The use of Apple''s services rather than Enterprise services may be considered inappropriate. https://support.apple.com/en-us/HT204837
    299 | P a g e'
  rationale: ''
  impact: ''
  references: []
  page_start: 299
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.3'
  title: App Store Password Settings
  scoring: manual
  profile:
  - Level 2
  description: With OS X 10.11 Apple added settings for password storage for the App Store in macOS. These settings parallel
    the settings in iOS. As with iOS the choices are a requirement to provide a password after every purchase or to have a
    15 minute grace period, and whether to require a password for free purchases. The response to this setting is stored in
    a cookie and processed by iCloud. There is plenty of risk information on the wisdom of this setting for parents with children
    buying games on iPhones and iPads. the most relevant information here is the likelihood that users that are not authorized
    to download software may have physical access to an unlocked computer where someone who is authorized recently made a
    purchase. If that is a concern a password should be required at all times for App Store access in the Password Settings
    controls
  rationale: ''
  impact: ''
  references: []
  page_start: 301
  audit_raw: ''
  remediation: ''
