controls:
- id: '1.1'
  title: Verify all Apple-provided software is current
  scoring: scored
  profile:
  - Level 1
  description: 'Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered. There is no simple way to complete this action without a network connection to an Apple software repository.
    Please ensure appropriate access for this control. This check is only for what Apple provides through software update.
    Software updates should be run at minimum every 30 days. Run the following command to verify when software update was
    previously run: $ sudo defaults read /Library/Preferences/com.apple.SoftwareUpdate | grep -e LastFullSuccessfulDate. The
    response should be in the last 30 days (Example): LastFullSuccessfulDate = "2020-07-30 12:45:25 +0000";'
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Missing patches can lead to more exploit opportunities. 14 | P a g e
  references: []
  page_start: 14
  audit_raw: 'Perform the following to ensure there are no available software updates:

    Graphical Method:

    1. Open System Preferences

    2. Select Software Update

    3. Select Automatically check for updates to allow Software Update to check with

    Apple''s servers for any outstanding updates

    4. Select Show Updates to verify that there are no software updates available

    Terminal Method:

    Run the following command to verify there are no software updates:

    $ sudo softwareupdate -l

    Software Update Tool

    Finding available software

    No new software available.

    Computers that have installed pre-release software in the past will fail this check if there

    are pre-release software updates available when audited. In the App Store setting System

    Preferences the computer may be set to no longer receive pre-release software.

    15 | P a g e'
  remediation: "Perform the following to install all available software updates:\nGraphical Method:\n1. Open System Preferences\n\
    2. Select Software Update\n3. Select Show Updates\n4. Select Update All\nTerminal Method:\nRun the following command to\
    \ verify what packages need to be installed:\n$ sudo softwareupdate -l\nThe output will include the following:\nSoftware\
    \ Update found the following new or updated software:\nRun the following command to install all the packages that need\
    \ to be updated:\n$ sudo softwareupdate -i -a\nOr run the following command to install individual packages:\n$ sudo softwareupdate\
    \ -i '<package name>'\nexample:\n$ sudo softwareupdate -l\nSoftware Update Tool\nFinding available software\nSoftware\
    \ Update found the following new or updated software:\n * iTunesX-12.8.2\n iTunes (12.8.2), 273614K [recommended]\n$ sudo\
    \ softwareupdate -i 'iTunesX-12.8.2'\nSoftware Update Tool\nDownloaded iTunes\nInstalling iTunes\nDone with iTunes\nDone.\n\
    16 | P a g e"
  checks:
  - type: sql
