- id: 2.7.2
  title: Time Machine Volumes Are Encrypted
  scoring: scored
  profile:
  - Level 1
  description: One of the most important security tools for data protection on macOS is FileVault. With encryption in place
    it makes it difficult for an outside party to access your data if they get physical possession of the computer. One very
    large weakness in data protection with FileVault is the level of protection on backup volumes. If the internal drive is
    encrypted but the external backup volume that goes home in the same laptop bag is not it is self-defeating. Apple tries
    to make this mistake easily avoided by providing a checkbox to enable encryption when setting-up a Time Machine backup.
    Using this option does require some password management, particularly if a large drive is used with multiple computers.
    A unique complex password to unlock the drive can be stored in keychains on multiple systems for ease of use. While some
    portable drives may contain non-sensitive data and encryption may make interoperability with other systems difficult backup
    volumes should be protected just like boot volumes.
  rationale: Backup volumes need to be encrypted. 147 | P a g e
  impact: ''
  references: []
  page_start: 147
  audit_raw: "Perform the following to ensure the drive used for Time Machine is encrypted:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Time Machine\n3. Select Backup Disk...\n4. Select the Time Machine backup drive\n5. Verify that\
    \ Encrypt backups is set\nTerminal Method:\nRun the following command to verify if the Time Machine disk encryption is\
    \ enabled:\n$ sudo tmutil destinationinfo | grep -i NAME\nThe output will be formatted as: 'Name : '. If there are more\
    \ than one TimeMachine backup\ndisk the command will list all the disks.\n$ sudo diskutil info <volumename> | grep -i\
    \ Encrypted\nEncrypted: Yes\nexample:\n$ sudo tmutil destinationinfo | grep -i NAME\nName : TMbackup1\nName : TMbackup2\n\
    $ sudo diskutil info TMbackup1 | grep -i Encrypted\n Encrypted: Yes\n$ sudo diskutil info TMbackup2 | grep -i Encrypted\n\
    \ Encrypted: Yes\n148 | P a g e"
  remediation: 'Perform the following to enable encryption on the Time Machine drive:

