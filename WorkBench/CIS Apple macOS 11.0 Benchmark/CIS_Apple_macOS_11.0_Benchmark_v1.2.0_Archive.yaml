- id: 2.4.12
  title: Ensure AirDrop Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: AirDrop is Apple's built-in on demand ad hoc file exchange system that is compatible with both macOS and iOS.
    It uses Bluetooth LE for discovery that limits connectivity to Mac or iOS users that are in close proximity. Depending
    on the setting it allows everyone or only Contacts to share files when they are nearby to each other. In many ways this
    technology is far superior to the alternatives. The file transfer is done over a TLS encrypted session, does not require
    any open ports that are required for file sharing, does not leave file copies on email servers or within cloud storage,
    and allows for the service to be mitigated so that only people already trusted and added to contacts can interact with
    you. While there are positives to AirDrop, there are privacy concerns that could expose personal information. For that
    reason, AirDrop should be disabled, and should only be enabled when needed and disabled afterwards.
  rationale: AirDrop can allow malicious files to be downloaded from unknown sources. Contacts Only limits may expose personal
    information to devices in the same area.
  impact: Disabling AirDrop can limit the ability to move files quickly over the network without using file shares. 88 | P
    a g e
  references:
