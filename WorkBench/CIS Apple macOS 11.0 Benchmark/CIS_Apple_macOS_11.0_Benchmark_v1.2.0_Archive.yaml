  description: Applications in the System Applications Directory (/Applications) should be world executable since that is
    their reason to be on the system. They should not be worldwritable and allow any process or user to alter them for other
    processes or users to then execute modified versions.
  rationale: Unauthorized modifications of applications could lead to the execution of malicious code.
  impact: Applications changed will no longer be world-writable.
