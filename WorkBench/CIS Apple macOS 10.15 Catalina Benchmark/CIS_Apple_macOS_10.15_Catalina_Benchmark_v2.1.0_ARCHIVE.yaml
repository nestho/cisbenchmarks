    2. Select Profiles\n3. Verify that an installed profile has Disallow iCloud Desktop & Documents Sync\nis set to True\n\
    Terminal Method:\nFor each user, run the following command to verify that the Documents and Desktop\nfolders are not syncing\
    \ to iCloud:\n$ sudo -u <username> /bin/ls -l /Users/<username>/Library/Mobile\\\nDocuments/com~apple~CloudDocs/Documents/\
    \ | /usr/bin/grep total\n$ sudo -u <username> /bin/ls -l /Users/<username>/Library/Mobile\\\nDocuments/com~apple~CloudDocs/Desktop/\
    \ | /usr/bin/grep total\nexample:\n$ sudo -u seconduser /bin/ls -l /Users/seconduser/Library/Mobile\\\nDocuments/com~apple~CloudDocs/Documents/\
    \ | /usr/bin/grep total\n$ sudo -u seconduser /bin/ls -l /Users/seconduser/Library/Mobile\\\nDocuments/com~apple~CloudDocs/Desktop/\
