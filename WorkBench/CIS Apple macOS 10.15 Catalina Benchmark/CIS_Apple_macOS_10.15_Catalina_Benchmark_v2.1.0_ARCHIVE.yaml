- id: '6.3'
  title: Ensure Automatic Opening of Safe Files in Safari Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Safari will automatically run or execute what it considers safe files. This can include installers and other
    files that execute on the operating system. Safari evaluates file safety by using a list of filetypes maintained by Apple.
    The list of files include text, image, video and archive formats that would be run in the context of the OS rather than
    the browser.
  rationale: Hackers have taken advantage of this setting via drive-by attacks. These attacks occur when a user visits a legitimate
    website that has been corrupted. The user unknowingly downloads a malicious file either by closing an infected pop-up
    or hovering over a malicious banner. An attacker can create a malicious file that will fall within Safari's safe file
    list that will download and execute without user input.
  impact: Apple considers many files that the operating system itself auto-executes as "safe files." Many of these files could
    be malicious and could execute locally without the user even knowing that a file of a specific type had been downloaded.
  references: []
  page_start: 308
  audit_raw: "Perform the following to verify that safe files are not opened on download in Safari:\nGraphical Method:\n1.\
    \ Open Safari\n2. Select Safari from the menu bar\n3. Select Preferences\n4. Select General\n5. Verify that Open \"safe\"\
    \ files after downloading is not set\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed\
    \ profile has AutoOpenSafeDownloads = 0 is set\nTerminal Method:\nRun the following command to verify that opening safe\
    \ files in Safari is disabled:\n$ sudo -u <username> /usr/bin/defaults read\n/Users/<username>/Library/Containers/com.apple.Safari/Data/Library/Preference\n\
    s/com.apple.Safari AutoOpenSafeDownloads\n0\nexample:\n$ sudo -u firstuser /usr/bin/defaults read\n/Users/firstuser/Library/Containers/com.apple.Safari/Data/Library/Preferences\n\
    /com.apple.Safari AutoOpenSafeDownloads\n0\nNote: To run the Terminal commands, Terminal must be granted Full Disk Access\
    \ in\nthe Security & Privacy pane in System Preferences.\nor\nRun the following command to verify that a profile is installed\
    \ that disables safe files\nfrom opening in Safari:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep AutoOpenSafeDownloads\n\
    \ AutoOpenSafeDownloads = 0;"
  remediation: "Perform the following to set safe files to not open after downloading in Safari:\nGraphical Method:\n1. Open\
    \ Safari\n2. Select Safari from the menu bar\n3. Select Preferences\n4. Select General\n5. Uncheck Open \"safe\" files\
    \ after downloading\nTerminal Method:\nRun the following command to disable safe files from not opening in Safari:\n$\
    \ sudo -u <username> /usr/bin/defaults write\n/Users/<username>/Library/Containers/com.apple.Safari/Data/Library/Preference\n\
    s/com.apple.Safari AutoOpenSafeDownloads -bool false\nexample:\n$ sudo -u firstuser /usr/bin/defaults write\n/Users/firstuser/Library/Containers/com.apple.Safari/Data/Library/Preferences\n\
    /com.apple.Safari AutoOpenSafeDownloads -bool false\nNote: To run the Terminal commands, Terminal must be granted Full\
    \ Disk Access in\nthe Security & Privacy pane in System Preferences.\nProfile Method:\n1. Create or edit a configuration\
    \ profile with the PayloadType of com.apple.Safari\n2. Add the key Forced\n3. Set the key to the following:\n<array>\n\
    \ <dict>\n <key>mcx_preference_settings</key>\n <dict>\n <key>AutoOpenSafeDownloads</key>\n <false/>\n </dict>\n </dict>\n\
    </array>"
  checks:
