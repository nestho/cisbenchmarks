- id: 2.4.6
  title: Ensure DVD or CD Sharing Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: DVD or CD Sharing allows users to remotely access the system's optical drive. While Apple does not ship Macs
    with built-in optical drives any longer, external optical drives are still recognized when they are connected. In testing,
    the sharing of an external optical drive persists when a drive is reconnected.
  rationale: Disabling DVD or CD Sharing minimizes the risk of an attacker using the optical drive as a vector for attack
    and exposure of sensitive data.
  impact: Many Apple devices are now sold without optical drives, however drive sharing may be needed for legacy optical media.
    The media should be explicitly re-shared as needed rather than using a persistent share. Optical drives should not be
    used for long-term storage. To store necessary data from an optical drive it should be copied to another form of external
    storage. Optionally, an image can be made of the optical drive so that it is stored in its original form on another form
    of external storage.
