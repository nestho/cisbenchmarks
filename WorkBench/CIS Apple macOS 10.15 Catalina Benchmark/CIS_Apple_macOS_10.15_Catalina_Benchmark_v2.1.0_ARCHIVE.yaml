    severity: medium
- id: '4.1'
  title: Ensure Bonjour Advertising Services Is Disabled
  scoring: scored
  profile:
  - Level 2
  description: Bonjour is an auto-discovery mechanism for TCP/IP devices which enumerate devices and services within a local
    subnet. DNS on macOS is integrated with Bonjour and should not be turned off, but the Bonjour advertising service can
    be disabled.
  rationale: Bonjour can simplify device discovery from an internal rogue or compromised host. An attacker could use Bonjour's
    multicast DNS feature to discover a vulnerable or poorlyconfigured service or additional information to aid a targeted
    attack. Implementing this control disables the continuous broadcasting of "I'm here!" messages. Typical end-user endpoints
    should not have to advertise services to other computers. This setting does not stop the computer from sending out service
    discovery messages when looking for services on an internal subnet, if the computer is looking for a printer or server
    and using service discovery. To block all Bonjour traffic except to approved devices, the pf or other firewall would be
    needed.
  impact: Some applications, like Final Cut Studio and AirPort Base Station management, may not operate properly if the mDNSResponder
    is turned off.
  references: []
  page_start: 219
  audit_raw: "Perform the following to ensure that Bonjour Advertising is disabled:\nGraphical Method:\n1. Open System Preferences\n\
    2. Select Profiles\n3. Verify that an installed profile has NoMulticastAdvertisements set to 1\nTerminal Method:\nRun\
    \ the following command to verify that Bonjour Advertising is not enabled:\n$ sudo /usr/bin/defaults read\n/Library/Preferences/com.apple.mDNSResponder.plist\
    \ NoMulticastAdvertisements\n1\nNote: If the settings has not been changed from the default, then this audit will fail\
    \ on\nthe command line. Follow the remediation instructions to verify that it is set to a disabled\nstatus.\nor\nRun the\
    \ following command to verify that a profile is installed that disables Bonjour\nAdvertising:\n$ sudo /usr/bin/profiles\
    \ -P -o stdout | /usr/bin/grep\n\"NoMulticastAdvertisements\"\n NoMulticastAdvertisements = 1;"
  remediation: 'Perform the following to disable Bonjour Advertising:

    Terminal Method:

    Run the following command to disable Bonjour Advertising services:

    $ sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements

    -bool true

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    com.apple.mDNSResponder

    2. Add the key NoMulticastAdvertisements

    3. Set the key to <true/>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that Bonjour Advertising is disabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Profiles

      3. Verify that an installed profile has NoMulticastAdvertisements set to 1

      Terminal Method:

      Run the following command to verify that Bonjour Advertising is not enabled:

      $ sudo /usr/bin/defaults read

      /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements

      1

      Note: If the settings has not been changed from the default, then this audit will fail o'
    severity: medium
- id: '4.2'
  title: Ensure Show Wi-Fi status in Menu Bar Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: The Wi-Fi status in the menu bar indicates if the system's wireless internet capabilities are enabled. If so,
    the system will scan for available wireless networks to which to connect. At the time of this revision, all computers
    Apple builds have wireless network capability, which has not always been the case. This control only pertains to systems
    that have a wireless NIC available. Operating systems running in a virtual environment may not score as expected, either.
  rationale: Enabling "Show Wi-Fi status in menu bar" is a security awareness method that helps mitigate public area wireless
    exploits by making the user aware of their wireless connectivity status.
  impact: The user of the system should have a quick check on their wireless network status available.
  references: []
  page_start: 222
  audit_raw: 'Perform the following to verify that the Wi-Fi status shows in the menu bar:

    Graphical Method:

    1. Open System Preferences

    2. Select Network

