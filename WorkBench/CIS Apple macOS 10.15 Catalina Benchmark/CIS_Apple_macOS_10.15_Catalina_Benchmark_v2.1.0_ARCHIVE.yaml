- id: '1.4'
  title: Ensure Installation of App Update Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensure that application updates are installed after they are available from Apple. These updates do not require
    reboots or administrator privileges for end users.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
  impact: Unpatched software may be exploited.
  references: []
  page_start: 25
  audit_raw: "Perform the following to ensure that App Store updates install automatically:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Software Updates\n3. Select Advanced\n4. Verify that Install app updates from the App Store is\
    \ checked\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has Automatically Install\
    \ App Updates set to\nTrue\nTerminal Method:\nRun the following command to verify that App Store updates are auto updating:\n\
    $ sudo /usr/bin/defaults read /Library/Preferences/com.apple.commerce\nAutoUpdate\n1\nor\nRun the following command to\
    \ verify that a profile is installed that enables App Store\nupdates to be automatically installed:\n$ sudo /usr/bin/profiles\
    \ -P -o stdout | /usr/bin/grep\nAutomaticallyInstallAppUpdates\n AutomaticallyInstallAppUpdates = 1;"
  remediation: 'Perform the following to enable App Store updates to install automatically:

    Graphical Method:

    1. Open System Preferences

    2. Select Software Updates

    3. Select Advanced

    4. Select Install app updates from the App Store

    Terminal Method:

    Run the following command to turn on App Store auto updating:

    $ sudo /usr/bin/defaults write /Library/Preferences/com.apple.commerce

    AutoUpdate -bool TRUE

    Note: This remediation requires a log out and log in to show in the GUI.

    Profile Method:

    1. Create or edit a configuration profile with the PayLoadType of

    com.apple.SoftwareUpdate

    2. Add the key AutomaticallyInstallAppUpdates

    3. Set the key to <true/>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that App Store updates install automatically:

