- id: 6.1.3
  title: Ensure Guest Account Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: The guest account allows users access to the system without having to create an account or password. Guest
    users are unable to make setting changes and cannot remotely login to the system. All files, caches, and passwords created
    by the guest user are deleted upon logging out.
  rationale: Disabling the guest account mitigates the risk of an untrusted user doing basic reconnaissance and possibly using
    privilege escalation attacks to take control of the system.
  impact: A guest user can use that access to find out additional information about the system and might be able to use privilege
    escalation vulnerabilities to establish greater access.
  references: []
  page_start: 298
  audit_raw: "Perform the following to ensure that the guest account is not available:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Users & Groups\n3. Select Guest User\n4. Verify that Allow guests to log in to this computer\
    \ is not set\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has Disable Guest\
    \ Account set to True\nTerminal Method:\nRun the following command to verify if the guest account is enabled:\n$ sudo\
    \ /usr/bin/defaults read\n/Library/Preferences/com.apple.loginwindow.plist GuestEnabled\n0\nor\nRun the following command\
    \ to verify that the Guest account is disabled:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep 'DisableGuestAccount'\n\
    \ DisableGuestAccount = 1;"
  remediation: 'Perform the following to disable guest account availability:

    Graphical Method:

