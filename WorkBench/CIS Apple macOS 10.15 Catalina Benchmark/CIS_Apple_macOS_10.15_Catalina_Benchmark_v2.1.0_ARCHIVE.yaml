    minimum password length set to greater than or equal to 15:

    $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep "minLength"

    The output should include minLength ≥ 15;'
  remediation: 'Perform the following to enable passwords of a minimum length of 15:

    Terminal Method:

    Run the following command to set the password length to greater than or equal to 15:

    $ sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "minChars=<value≥15>"

    example:

