      Terminal Method:

      Run the following command to ve'
- id: '1.2'
  title: Ensure Auto Update Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates. If "Automatically
    check for updates" is not selected, background updates for new malware definition files from Apple for XProtect and Gatekeeper
    will not occur. http://macops.ca/os-x-admins-your-clients-are-not-getting-background-security-updates/ https://derflounder.wordpress.com/2014/12/17/forcing-xprotect-blacklist-updates-onmavericks-and-yosemite/
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities.
  impact: Without automatic update, updates may not be made in a timely manner and the system will be exposed to additional
    risk.
  references: []
  page_start: 19
  audit_raw: "Perform the following to ensure the system is automatically checking for updates:\nGraphical Method:\n1. Open\
    \ System Preferences\n2. Select Software Update\n3. Select Advanced\n4. Verify that Check for updates is selected\nTerminal\
    \ Method:\nRun the following command to verify that software updates are automatically checked:\n$ sudo /usr/bin/defaults\
    \ read /Library/Preferences/com.apple.SoftwareUpdate\nAutomaticCheckEnabled\n1\nNote: If automatic updates were selected\
    \ during system setup, this setting may not\nhave left an auditable artifact. Please turn off the check and re-enable\
    \ when the GUI\ndoes not reflect the audited results.\nor\nRun the following command to verify that a profile is installed\
    \ that enables software\nupdates to be automatically checked:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep AutomaticCheckEnabled\n\
    \ AutomaticCheckEnabled = 1;"
  remediation: 'Perform the following to enable the system to automatically check for updates:

    Graphical Method:

    1. Open System Preferences

    2. Select Software Update

    3. Select Advanced

    4. Select Check for updates

    Terminal Method:

    Run the following command to enable auto update:

    $ sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticCheckEnabled -bool true

    Profile Method:

    1. Create or edit a configuration profile with the PayLoadType of

    com.apple.SoftwareUpdate

    2. Add the key AutomaticCheckEnabled

    3. Set the key to <true/>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is automatically checking for updates:

      Graphical Method:

      1. Open System Preferences

      2. Select Software Update

      3. Select Advanced

      4. Verify that Check for updates is selected

      Terminal Method:

