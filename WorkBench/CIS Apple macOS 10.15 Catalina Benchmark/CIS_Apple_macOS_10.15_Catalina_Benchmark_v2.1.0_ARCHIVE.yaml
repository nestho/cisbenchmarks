- id: 5.2.1
  title: Ensure Password Account Lockout Threshold Is Configured
  scoring: scored
  profile:
  - Level 1
  description: The account lockout threshold specifies the amount of times a user can enter an incorrect password before a
    lockout will occur. Ensure that a lockout threshold is part of the password policy on the computer.
  rationale: The account lockout feature mitigates brute-force password attacks on the system.
  impact: The number of incorrect log on attempts should be reasonably small to minimize the possibility of a successful password
    attack, while allowing for honest errors made during a normal user log on. The locked account will auto-unlock after a
    few minutes when bad password attempts stop. The computer will accept the still-valid password if remembered or recovered.
  references:
  - 1. CIS Password Policy - https://workbench.cisecurity.org/communities/113
  page_start: 246
  audit_raw: 'Perform the following to ensure that the Password Account Threshold is set to less than

    or equal to 5:

    Graphical Method:

    1. Open System Preferences

    2. Select Profiles

    3. Verify that an installed profile has Max Failed Attempts set to ≤ 5

    Terminal Method:

    Run the following command to verify that the number of failed attempts is less than or

    equal to 5:

    $ sudo /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep -A 1

    ''policyAttributeMaximumFailedAuthentications'' | /usr/bin/tail -1 |

    /usr/bin/cut -d''>'' -f2 | /usr/bin/cut -d ''<'' -f1

    The output should be ≤ 5

    Note: When the account lockout threshold is set with pwpolicy, it will also set a reset

    value to policyAttributeMinutesUntilFailedAuthenticationReset that defaults to 1

    minute. You can change this value with sudo /usr/bin/pwpolicy -n /Local/Default -

    setglobalpolicy "policyAttributeMinutesUntilFailedAuthenticationReset=<value

    in minutes>".

    or

    Run the following command to verify that a profile is installed that configures account

    lockout threshold set to less than or equal to 5:

    $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep "maxFailedAttempts"

    The output should include maxFailedAttempts ≤ 5;'
  remediation: 'Perform the following to enable Password Account Thresholds to less than or equal to

    5:

    Terminal Method:

    Run the following command to set the maximum number of failed login attempts to less

    than or equal to 5:

    $ sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxFailedLoginAttempts=<value≤5>"

    example:

    $ sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxFailedLoginAttempts=5"

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    com.apple.mobiledevice.passwordpolicy

    2. Add the key maxFailedAttempts

    3. Set the key to <integer><value≤5></integer>

    Note: When setting the lockout threshold with a mobile configuration profile there is no

    default reset to the lockout. To set the reset value use the key autoEnableInSeconds

    and set it to <integer><value in seconds></integer>.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that the Password Account Threshold is set to less than

      or equal to 5:

      Graphical Method:

      1. Open System Preferences

      2. Select Profiles

      3. Verify that an installed profile has Max Failed Attempts set to ≤ 5

      Terminal Method:

      Run the following command to verify that the number of failed attempts is less than or

      equal to 5:

      $ sudo /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep -A 1

      ''policyAttributeMaximumFailedAuthentications'' | /usr/bin/tail -1 |

      /usr/bin/cut '
    severity: medium
- id: 5.2.2
  title: Ensure Password Minimum Length Is Configured
  scoring: scored
  profile:
  - Level 1
  description: A minimum password length is the fewest number of characters a password can contain to meet a system's requirements.
    Ensure that a minimum of a 15-character password is part of the password policy on the computer. Where the confidentiality
    of encrypted information in FileVault is more of a concern, requiring a longer password or passphrase may be sufficient
    rather than imposing additional complexity requirements that may be self-defeating.
  rationale: Information systems that are not protected with strong password schemes including passwords of minimum length
    provide a greater opportunity for attackers to crack the password and gain access to the system.
  impact: Short passwords can be easily attacked.
  references: []
  page_start: 249
