- id: 5.1.2
  title: Ensure System Integrity Protection Status (SIP) Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: System Integrity Protection is a security feature introduced in OS X 10.11 El Capitan. System Integrity Protection
    restricts access to System domain locations and restricts runtime attachment to system processes. Any attempt to inspect
    or attach to a system process will fail. Kernel Extensions are now restricted to /Library/Extensions and are required
    to be signed with a Developer ID.
  rationale: Running without System Integrity Protection on a production system runs the risk of the modification of system
    binaries or code injection of system processes that would otherwise be protected by SIP.
  impact: System binaries and processes could become compromised.
  references:
  - 1. https://developer.apple.com/documentation/security/disabling_and_enabling_syst
  - 2. https://support.apple.com/en-us/HT204899
  page_start: 234
  audit_raw: 'Run the following command to verify that System Integrity Protection is enabled:

    $ sudo /usr/bin/csrutil status

    `System Integrity Protection status: enabled.`'
  remediation: 'Perform the following to enable System Integrity Protection:

    1. Reboot into the Recovery Partition (reboot and hold down Command (⌘) + R)

    2. Select Utilities

    3. Select Terminal

    4. Run the following command:

    $ sudo /usr/bin/csrutil enable

    Successfully enabled System Integrity Protection. Please restart the machine

    for the changes to take effect.

    5. Reboot the computer

    Note: You cannot enable System Integrity Protection from the booted operating system.

    If the remediation is attempted in the booted OS and not the Recovery Partition the

    output will give the error csrutil: failed to modify system integrity

    configuration. This tool needs to be executed from the Recovery OS.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that System Integrity Protection is enabled:

      $ sudo /usr/bin/csrutil status

      `System Integrity Protection status: enabled.`'
    severity: medium
- id: 5.1.3
  title: Ensure Apple Mobile File Integrity (AMFI) Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Apple Mobile File Integrity (AMFI) was first released in macOS 10.12. The daemon and service block attempts
    to run unsigned code. AMFI uses lanchd, code signatures, certificates, entitlements, and provisioning profiles to create
    a filtered entitlement dictionary for an app. AMFI is the macOS kernel module that enforces code-signing and library validation.
  rationale: Apple Mobile File Integrity validates that application code is validated.
  impact: Applications could be compromised with malicious code.
  references:
  - 1. https://eclecticlight.co/2018/12/29/amfi-checking-file-integrity-on-your-mac/
  - 2. https://github.com/usnistgov/macos_security/issues/39
  page_start: 237
