- id: 2.7.2
  title: Ensure Time Machine Volumes Are Encrypted
  scoring: scored
  profile:
  - Level 1
  description: One of the most important security tools for data protection on macOS is FileVault. With encryption in place
    it makes it difficult for an outside party to access your data if they get physical possession of the computer. One very
    large weakness in data protection with FileVault is the level of protection on backup volumes. If the internal drive is
    encrypted but the external backup volume that goes home in the same laptop bag is not it is selfdefeating. Apple tries
    to make this mistake easily avoided by providing a checkbox to enable encryption when setting-up a Time Machine backup.
    Using this option does require some password management, particularly if a large drive is used with multiple computers.
    A unique complex password to unlock the drive can be stored in keychains on multiple systems for ease of use. While some
    portable drives may contain non-sensitive data and encryption may make interoperability with other systems difficult backup
    volumes should be protected just like boot volumes.
  rationale: Backup volumes need to be encrypted.
  impact: ''
  references: []
  page_start: 170
  audit_raw: "Perform the following to ensure the drive used for Time Machine is encrypted:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Time Machine\n3. Select Backup Disk...\n4. Select the Time Machine backup drive\n5. Verify that\
    \ Encrypt backups is set\nTerminal Method:\nRun the following command to verify if the Time Machine disk encryption is\
    \ enabled:\n$ sudo /usr/bin/tmutil destinationinfo | grep -i NAME\nThe output will be formatted as: 'Name : '. If there\
    \ are more than one TimeMachine\nbackup disk the command will list all the disks.\n$ sudo /usr/sbin/diskutil info <volumename>\
    \ | grep -i Encrypted\nEncrypted: Yes\nor\n$ sudo /usr/sbin/diskutil info <volumename> | grep -i FileVault\nFileVault:\
    \ Yes\nEncrypted is for drives formatted as Mac OS Extended, and FileVault is for drives\nformatted as APFS. Either output\
    \ is compliant.\nexample:\n$ sudo /usr/bin/tmutil destinationinfo | grep -i NAME\nName : TMbackup1\nName : TMbackup2\n\
    $ sudo /usr/sbin/diskutil info TMbackup1 | grep -i Encrypted\n Encrypted: Yes\n$ sudo /usr/sbin/diskutil info TMbackup2\
    \ | grep -i FileVault\n FileVault: Yes"
  remediation: 'Perform the following to enable encryption on the Time Machine drive:

    Graphical Method:

    1. Open System Preferences

    2. Select Time Machine

    3. Select Backup Disk...

    4. Select the existing Time Machine backup drive from the Available Drive list

    5. Set Encrypt backups

    6. Select Use Disk

    Note: You can set encryption through Disk Utility or diskutil in terminal.'
  checks:
  - type: command
    command: $ sudo /usr/bin/tmutil destinationinfo | grep -i NAME && $ sudo /usr/sbin/diskutil info <volumename> | grep -i
      Encrypted && $ sudo /usr/sbin/diskutil info <volumename> | grep -i FileVault && $ sudo /usr/bin/tmutil destinationinfo
      | grep -i NAME && $ sudo /usr/sbin/diskutil info TMbackup1 | grep -i Encrypted && $ sudo /usr/sbin/diskutil info TMbackup2
      | grep -i FileVault
    expected: 5. Verify that Encrypt backups is set
    severity: medium
    info: 'Perform the following to ensure the drive used for Time Machine is encrypted:

      Graphical Method:

      1. Open System Preferences

      2. Select Time Machine

      3. Select Backup Disk...

      4. Select the Time Machine backup drive

      5. Verify that Encrypt backups is set

      Terminal Method:

      Run the following command to verify if the Time Machine disk encryption is enabled:

      $ sudo /usr/bin/tmutil destinationinfo | grep -i N'
- id: '2.8'
  title: Energy Saver 2.8.1 Ensure Wake for Network Access Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: This feature allows the computer to take action when the user is not present and the computer is in energy
    saving mode. These tools require FileVault to remain unlocked and fully rejoin known networks. This macOS feature is meant
    to allow the computer to resume activity as needed regardless of physical security controls. This feature allows other
    users to be able to access your computer’s shared resources, such as shared printers or Apple Music playlists, even when
    your computer is in sleep mode. In a closed network when only authorized devices could wake a computer, it could be valuable
    to wake computers in order to do management push activity. Where mobile workstations and agents exist, the device will
    more likely check in to receive updates when already awake. Mobile devices should not be listening for signals on any
    unmanaged network or where untrusted devices exist that could send wake signals.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access.
  impact: Management programs like Apple Remote Desktop Administrator use wake-on-LAN to connect with computers. If turned
    off, such management programs will not be able to wake a computer over the LAN. If the wake-on-LAN feature is needed,
    do not turn off this feature. The control to prevent computer sleep has been retired for this version of the Benchmark.
    Forcing the computer to stay on and use energy in case a management push is needed is contrary to most current management
    processes. Only keep computers unslept if after hours pushes are required on closed LANs.
  references: []
  page_start: 173
  audit_raw: "Perform the following to verify that Wake for network access is disabled:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Energy Saver\n3. Verify that Wake for network access is not set\nTerminal Method:\nRun the following\
    \ command verify if Wake for network access is not enabled:\n$ sudo pmset -g custom | grep -e womp\nwomp 0\nor\nRun the\
    \ following command to verify that a profile is installed that enables App Store\nupdates to be automatically installed:\n\
    $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep \"Wake On LAN\"\n \"Wake On LAN\" = 0;\n \"Wake On LAN\" = 0;\n\
    \ \"Wake On LAN\" = 0;\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep \"Wake On Modem Ring\"\n \"Wake On Modem\
    \ Ring\" = 0;\n \"Wake On Modem Ring\" = 0;\n \"Wake On Modem Ring\" = 0;"
  remediation: "Perform the following to disable Wake for network access:\nGraphical Method:\n1. Open System Preferences\n\
    2. Select Energy Saver\n3. Uncheck Wake for network access\nTerminal Method:\nRun the following command to disable Wake\
    \ for network access:\n$ sudo pmset -a womp 0\nProfile Method:\n1. Create or edit a configuration profile with the PayLoadType\
    \ of com.apple.MCX\n2. Add the key com.apple.EnergySaver.desktop.ACPower\n3. Set the key to:\n<dict>\n <key>Wake On LAN</key>\n\
    \ <integer>0</integer>\n <key>Wake On Modem Ring</key>\n <integer>0</integer>\n</dict>\n4. Add the key com.apple.EnergySaver.portable.ACPower\n\
    5. Set the key to:\n<dict>\n <key>Wake On LAN</key>\n <integer>0</integer>\n <key>Wake On Modem Ring</key>\n <integer>0</integer>\n\
    </dict>\n6. Add the key com.apple.EnergySaver.portable.BatteryPower\n7. Set the key to:\n<dict>\n <key>Wake On LAN</key>\n\
    \ <integer>0</integer>\n <key>Wake On Modem Ring</key>\n <integer>0</integer>\n</dict>\nNote: Both Wake on LAN and Wake\
    \ on Modem Ring need to be set. Only setting Wake On\nLAN will allow the profile to install but not set any settings.\
    \ This profile will only apply the\nsetting at installation and is not sticky."
  checks:
  - type: command
    command: $ sudo pmset -g custom | grep -e womp
    expected: 'Perform the following to verify that Wake for network access is disabled:'
    severity: medium
    info: 'Perform the following to verify that Wake for network access is disabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Energy Saver

      3. Verify that Wake for network access is not set

      Terminal Method:

      Run the following command verify if Wake for network access is not enabled:

      $ sudo pmset -g custom | grep -e womp

      womp 0

      or

      Run the following command to verify that a profile is installed tha'
- id: 2.8.2
  title: Ensure Power Nap Is Disabled for Intel Macs
  scoring: scored
  profile:
  - Level 1
  description: Power Nap allows the system to stay in low power mode, especially while on battery power, and periodically
    connect to previously known networks with stored credentials for user applications to phone home and get updates. This
    capability requires FileVault to remain unlocked and the use of previously joined networks to be risk accepted based on
    the SSID without user input. This control has been updated to check the status on both battery and AC Power. The presence
    of an electrical outlet does not completely correlate with logical and physical security of the device or available networks.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access. The use
    of Power Nap adds to the risk of compromised physical and logical security. The user should be able to decrypt FileVault
    and have the applications download what is required when the computer is actively used. The control to prevent computer
    sleep has been retired for this version of the Benchmark. Forcing the computer to stay on and use energy in case a management
    push is needed is contrary to most current management processes. Only keep computers unslept if after hours pushes are
    required on closed LANs.
  impact: Power Nap exists for unattended user application updates like email and social media clients. With Power Nap disabled,
    the computer will not wake and reconnect to known wireless SSIDs intermittently when slept.
  references: []
  page_start: 179
  audit_raw: 'Perform the following to verify that Power Nap is disabled:

    Graphical Method:

    1. Open System Preferences

    2. Select Energy Saver

    3. Verify that Power Nap is not set

    Terminal Method:

    Run the following command to verify if Power Nap is not enabled:

    $ sudo pmset -g custom | grep -c ''powernap 1''

    0'
  remediation: 'Perform the following disable Power Nap:

    Graphical Method:

    1. Open System Preferences

    2. Select Energy Saver

    3. Uncheck Enable Power Nap

    Terminal Method:

    Run the following command to disable Power Nap:

    $ sudo pmset -a powernap 0'
  checks:
  - type: command
    command: $ sudo pmset -g custom | grep -c 'powernap 1'
    expected: 'Perform the following to verify that Power Nap is disabled:'
    severity: medium
    info: 'Perform the following to verify that Power Nap is disabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Energy Saver

      3. Verify that Power Nap is not set

      Terminal Method:

      Run the following command to verify if Power Nap is not enabled:

      $ sudo pmset -g custom | grep -c ''powernap 1''

      0'
- id: 2.8.3
  title: Ensure the OS is not Activate When Resuming from Sleep
  scoring: scored
  profile:
  - Level 2
  description: In order to use a computer with Full Disk Encryption (FDE), macOS must keep encryption keys in memory to allow
    the use of the disk that has been FileVault protected. The storage volume has been unlocked and acts as if it were not
    encrypted. When the system is not in use, the volume is protected through encryption. When the system is sleeping and
    available to quickly resume, the encryption keys remain in memory. If an unauthorized party has possession of the computer
    and the computer is only slept, there are known attack vectors that can be attempted against the RAM that has the encryption
    keys or the running operating system protected by a login screen. Network attacks if network interfaces are on, as well
    as USB or other open device ports, are possible. Most of these attacks require knowledge of unpatched vulnerabilities
    or a high level of sophistication if all the other controls function as intended. There is little impact on hibernating
    the system rather than sleeping after an appropriate time period to remediate the risk of OS level attacks. Hibernation
    writes the keys to disk and requires FileVault to be unlocked prior to the OS being available. In the case of unauthorized
    personnel with access to the computer, encryption would have to be broken prior to attacking the operating system in order
    to recover data from the system. https://www.helpnetsecurity.com/2018/08/20/laptop-sleep-security/ Mac systems should
    be set to hibernate after sleeping for a risk-acceptable time period. The default value for "standbydelay" is three hours
    (10800 seconds). This value is likely appropriate for most desktops. If Mac desktops are deployed in unmonitored, less
    physically secure areas with confidential data, this value might be adjusted. The desktop would have to retain power,
    however, so that the running OS or physical RAM could be attacked. MacBooks should be set so that the standbydelay is
    15 minutes (900 seconds) or less. This setting should allow laptop users in most cases to stay within physically secured
    areas while going to a conference room, auditorium, or other internal location without having to unlock the encryption.
    When the user goes home at night, the laptop will autohibernate after 15 minutes and require the FileVault password to
    unlock prior to logging back into system when it resumes. MacBooks should also be set to a hibernate mode that removes
    power from the RAM. This will stop the possibility of cold boot attacks on the system. Macs running Apple silicon chips,
    rather than Intel chips, do not require the same configuration as Intel-based Macs.
  rationale: To mitigate the risk of data loss, the system should power down and lock the encrypted drive after a specified
    time. Laptops should hibernate 15 minutes or less after sleeping.
  impact: The laptop will take additional time to resume normal operation then if only sleeping rather than hibernating. Setting
    hibernatemode to 25 will disable the "always-on" feature of the Apple Silicon Macs.
  references:
  - 1. https://www.lifewire.com/change-mac-sleep-settings-2260804
  - 2. https://www.zdziarski.com/blog/?p=6705
  page_start: 182
  audit_raw: "Run the following command to verify the hibernation settings and that FileVault keys are\ndestroyed on standby:\n\
    $ sudo system_profiler SPHardwareDataType | grep -e MacBook\nIf the output includes Model Name: MacBook, Model Name: MacBook\
    \ Air, Model Name:\nMacBook Pro run the following:\n$ sudo pmset -b -g | grep -e standby\nThe output should include a\
    \ standbydelaylow value ≤ 900, a standbydelayhigh value ≤\n900, and a highstandbythreshold value ≥ 90.\n$ sudo pmset -b\
    \ -g | grep DestroyFVKeyOnStandby\n DestroyFVKeyOnStandby 1\n$ sudo pmset -b -g | grep hibernatemode\n hibernatemode 25\n\
    example:\n$ sudo system_profiler SPHardwareDataType | grep -e MacBook\n Model Name: MacBook Pro\n Model Identifier:MacBookPro13,1\n\
    $ sudo pmset -b -g | grep -e standby\n standbydelaylow 600\n standby 1\n standbydelayhigh 600\n highstandbythreshold 50\n\
    $ sudo pmset -b -g | grep DestroyFVKeyOnStandby\n DestroyFVKeyOnStandby 1\n$ sudo pmset -b -g | grep hibernatemode\n hibernatemode\
    \ 25"
  remediation: 'Run the following command to set the hibernate delays and to ensure the FileVault keys

    are set to be destroyed on standby:

    $ sudo pmset -a standbydelaylow <value≤900>

    $ sudo pmset -a standbydelayhigh <value≤900>

    $ sudo pmset -a highstandbythreshold <value≥90>

    $ sudo pmset -a destroyfvkeyonstandby 1

    $ sudo pmset -a hibernatemode 25

    example:

    $ sudo pmset -a standbydelaylow 500

    $ sudo pmset -a standbydelayhigh 500

    $ sudo pmset -a highstandbythreshold 100

    $ sudo pmset -a destroyfvkeyonstandby 1

    $ sudo pmset -a hibernatemode 25'
  checks:
  - type: command
    command: $ sudo system_profiler SPHardwareDataType | grep -e MacBook && $ sudo pmset -b -g | grep -e standby && $ sudo
      pmset -b -g | grep DestroyFVKeyOnStandby && $ sudo pmset -b -g | grep hibernatemode && $ sudo system_profiler SPHardwareDataType
      | grep -e MacBook && $ sudo pmset -b -g | grep -e standby && $ sudo pmset -b -g | grep DestroyFVKeyOnStandby && $ sudo
      pmset -b -g | grep hibernatemode
    expected: ''
    severity: medium
    info: 'Run the following command to verify the hibernation settings and that FileVault keys are

      destroyed on standby:

      $ sudo system_profiler SPHardwareDataType | grep -e MacBook

      If the output includes Model Name: MacBook, Model Name: MacBook Air, Model Name:

      MacBook Pro run the following:

      $ sudo pmset -b -g | grep -e standby

      The output should include a standbydelaylow value ≤ 900, a standbydelayhigh valu'
- id: '2.9'
  title: Ensure Legacy EFI Is Valid and Updating
  scoring: scored
  profile:
  - Level 1
  description: In order to mitigate firmware attacks, Apple has created an automated Firmware check to ensure that the EFI
    version running is a known good version from Apple. There is also an automated process to check it every seven days. This
    check is only valid on T1 chips and prior. Neither T2 chips nor Apple silicon require this control check
  rationale: If the Firmware of a computer has been compromised, the Operating System that the Firmware loads cannot be trusted,
    either.
  impact: ''
  references: []
  page_start: 186
  audit_raw: 'Perform the following to verify that the computer has up-to-date firmware if running a

    pre-T2 or Apple Silicon Mac:

    Run the following command to verify which processor the Mac is running:

    $ sudo /usr/sbin/sysctl -n machdep.cpu.brand_string

    If the output includes Apple then the computer is compliant.

    If the output includes Intel, run the following to verify if the model has a T2 Security

    Chip:

    $ sudo system_profiler SPiBridgeDataType | grep "T2"

    If the output is Model Name: Apple T2 Security Chip, the computer us compliant.

    If there is no output, run the following to determine if the EFI firmware is up-to-date:

    $ sudo /usr/libexec/firmwarecheckers/eficheck/eficheck --integrity-check

    The output should include Primary allowlist version match found. No changes

    detected in primary hashes. as well as the model and version in this format <Model

    Number>.xxx.xxxx.xxx.xxxxxxxxx.

    Then run the following command to verify that the EFI check system daemon is running:

    $ sudo launchctl list | grep com.apple.driver.eficheck

    Result: - 0 com.apple.driver.eficheck

    Note: The command to verify if the EFI check daemon is running can also be ran on

    Macs with a T2 Security Chip.

    example:

    $ sudo /usr/libexec/firmwarecheckers/eficheck/eficheck --integrity-check

    EFI Version: MB101.88Z.F000.B00.2203161719 (Boot ROM Version: 451.120.7.0.0)

    Primary allowlist version match found. No changes detected in primary hashes.

    $ sudo launchctl list | grep com.apple.driver.eficheck

    Result: - 0 com.apple.driver.eficheck'
  remediation: 'If EFI does not pass the integrity check, you may send a report to Apple. Backing up

    files and clean installing a known good Operating System and Firmware is

    recommended.'
  checks:
  - type: command
    command: $ sudo system_profiler SPiBridgeDataType | grep "T2" && $ sudo launchctl list | grep com.apple.driver.eficheck
      && $ sudo launchctl list | grep com.apple.driver.eficheck
    expected: Perform the following to verify that the computer has up-to-date firmware if running a
    severity: medium
    info: 'Perform the following to verify that the computer has up-to-date firmware if running a

      pre-T2 or Apple Silicon Mac:

      Run the following command to verify which processor the Mac is running:

      $ sudo /usr/sbin/sysctl -n machdep.cpu.brand_string

      If the output includes Apple then the computer is compliant.

      If the output includes Intel, run the following to verify if the model has a T2 Security

      Chip:

      $ su'
- id: '2.10'
  title: Audit Siri Settings
  scoring: manual
  profile:
  - Level 1
  description: With macOS 10.12 Sierra, Apple has introduced Siri from iOS to macOS. While there are data spillage concerns
    with the use of data-gathering personal assistant software, the risk here does not seem greater in sending queries to
    Apple through Siri than in sending search terms in a browser to Google or Microsoft. While it is possible that Siri will
    be used for local actions rather than Internet searches, Siri could, in theory, tell Apple about confidential Programs
    and Projects that should not be revealed. This appears be a usage edge case. In cases where sensitive or protected data
    is processed and Siri could expose that information through assisting a user in navigating their machine, it should be
    disabled. Siri does need to phone home to Apple, so it should not be available from air-gapped networks as part of its
    requirements. Most of the use case data published has shown that Siri is a tremendous time saver on iOS where multiple
    screens and menus need to be navigated through. Information like sports scores, weather, movie times, and simple to-do
    items on existing calendars can be easily found with Siri. None of the standard use cases should be more risky than already
    approved activity. For information on Apple's privacy policy for Siri, click here.
  rationale: Where "normal" user activity is already limited, Siri use should be controlled as well.
  impact: ''
  references:
  - 1. https://support.apple.com/en-us/HT210657
  page_start: 190
  audit_raw: "Perform the following to verify Siri settings:\nGraphical Method:\n1. Open System Preferences\n2. Select Siri\n\
    3. Verify the settings are within your organization's parameters\n4. Select Show All\n5. Select Accessibility\n6. Select\
    \ Siri\n7. Verify Enable Type to Siri is set to your organization's parameters\nor\n1. Open System Preferences\n2. Select\
    \ Profiles\n3. Verify that an installed profile has Allow Assistant is within your organization's\nparameters\nTerminal\
    \ Method:\nRun the following commands to verify the Siri settings:\n$ sudo -u <username> /usr/bin/defaults read com.apple.assistant.support.plist\n\
    'Assistant Enabled'\nThe output will be either 0, Siri is disabled, or 1, Siri is enabled.\n$ sudo -u <username> /usr/bin/defaults\
    \ read com.apple.Siri.plist\nThe output will be either 0, disabled, or 1 for the following Siri options:\n1. LockscreenEnabled\
    \ - Is Siri enabled when the system is locked?\n2. StatusMenuVisible - Is Siri visible in the menu bar?\n3. TypeToSiriEnabled\
    \ - Is Siri enabled to accept typed requests versus spoken\nones\n4. VoiceTriggerUserEnabled - Is \"Hey Siri\" enabled?\n\
    example:\n$ sudo -u firstuser /usr/bin/defaults read com.apple.assistant.support.plist\n'Assistant Enabled'\n0\n$ sudo\
    \ -u firstuser /usr/bin/defaults read com.apple.Siri.plist\n{\n LockscreenEnabled = 0;\n StatusMenuVisible = 0;\n TypeToSiriEnabled\
    \ = 0;\n VoiceTriggerUserEnabled = 0;\n}\n$ sudo -u seconduser /usr/bin/defaults read com.apple.assistant.support.plist\n\
    'Assistant Enabled'\n1\n$ sudo -u seconduser /usr/bin/defaults read com.apple.Siri.plist\n{\n LockscreenEnabled = 0;\n\
    \ StatusMenuVisible = 1;\n TypeToSiriEnabled = 0;\n VoiceTriggerUserEnabled = 1;\n}\n$ sudo -u thirduser /usr/bin/defaults\
    \ read com.apple.assistant.support.plist\n'Assistant Enabled'\n1\n$ sudo -u thirduser /usr/bin/defaults read com.apple.Siri.plist\n\
    {\n LockscreenEnabled = 1;\n StatusMenuVisible = 0;\n TypeToSiriEnabled = 1;\n VoiceTriggerUserEnabled = 1;\n}\nor\nRun\
    \ the following command to verify that a profile is installed that sets Siri to your\norganization's setting:\n$ sudo\
    \ /usr/bin/profiles -P -o stdout | /usr/bin/grep \"allowAssistant\"\n allowAssistant = 0;\nNote: Siri can only be enabled\
    \ or disabled through configuration profiles. Any additional\nsettings need to be set through the GUI or CL."
  remediation: 'Perform the following to set Siri to your organization''s parameters:

    Graphical Method:

    1. Open System Preferences

    2. Select Siri

    3. Select the settings that are within your organization''s requirements

    4. Select Show All

    5. Select Accessibility

    6. Select Siri

    7 Select Enable Type to Siri to your organization''s requirements

    Terminal Method:

    Run the following commands to enable or disable Siri settings:

    $ sudo -u <username> /usr/bin/defaults write

    com.apple.assistant.support.plist ''Assistant Enabled'' -bool <true/false>

    $ sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    LockscreenEnabled -bool <true/false>

    $ sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    StatusMenuVisible -bool <true/false>

    $ sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    TypeToSiriEnabled -bool <true/false>

    $ sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    VoiceTriggerUserEnabled -bool <true/false>

    After running the default writes, the WindowServer needs to be restarted and the

    caches cleared. Run the following commands to perform that action:

    $ sudo /usr/bin/killall -HUP cfprefsd

    $ sudo /usr/bin/killall SystemUIServer

    example:

    $ sudo -u firstuser /usr/bin/defaults write com.apple.assistant.support.plist

    ''Assistant Enabled'' -bool true

    $ sudo -u firstuser /usr/bin/defaults write com.apple.Siri.plist

    StatusMenuVisible -bool true

    $ sudo -u firstuser /usr/bin/defaults write com.apple.Siri.plist

    LockscreenEnabled -bool false

    $ sudo /usr/bin/killall -HUP cfprefsd

    $ sudo /usr/bin/killall SystemUIServer

    $ sudo -u seconduser /usr/bin/defaults write

    com.apple.assistant.support.plist ''Assistant Enabled'' -bool false

    $ sudo /usr/bin/killall -HUP cfprefsd

    $ sudo /usr/bin/killall SystemUIServer

    $ sudo -u thirduser /usr/bin/defaults write com.apple.Siri.plist

    VoiceTriggerUserEnabled -bool false

    $ sudo -u thirduser /usr/bin/defaults write com.apple.Siri.plist

    TypeToSiriEnabled -bool false

    $ sudo /usr/bin/killall -HUP cfprefsd

    $ sudo /usr/bin/killall SystemUIServer

    Profile Method:

    1. Create or edit a configuration profile with the PayLoadType of

    com.apple.applicationaccess

    2. Add the key allowAssistant

    3. Set the key to <true/> or <false/> based on your organization''s requirements

    Note: Siri can only be enabled or disabled through configuration profiles. Any additional

    settings need to be set through the GUI or CLI.'
