    \ | grep -B 1\nKEYCHAIN_SYNC\n Enabled = 0;\n Name = \"KEYCHAIN_SYNC\";\nor\nRun the following command to verify that\
    \ a profile is installed that sets iCloud Keychain\nsync to your organizations settings:\n$ sudo /usr/bin/profiles -P\
