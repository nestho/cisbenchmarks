  title: Ensure Firewall Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'A firewall is a piece of software that blocks unwanted incoming connections to a system. Apple has posted
    general documentation about the application firewall: http://support.apple.com/en-us/HT201642'
  rationale: A firewall minimizes the threat of unauthorized users gaining access to your system while connected to a network
    or the Internet.
  impact: The firewall may block legitimate traffic. Applications that are unsigned will require special handling.
