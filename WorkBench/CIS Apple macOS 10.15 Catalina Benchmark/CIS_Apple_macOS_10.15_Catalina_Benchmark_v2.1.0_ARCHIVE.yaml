    example:

    $ sudo /usr/bin/defaults -currentHost write com.apple.screensaver idleTime -

    int 600

    If there are multiple users out of compliance with the prescribed setting, run this

    command for each user to set their idle time:

    $ sudo -u <username> /usr/bin/defaults -currentHost write

    com.apple.screensaver idleTime -int <value ≤1200>

    example:

    $ sudo -u seconduser /usr/bin/defaults -currentHost write

    com.apple.screensaver idleTime -int 600

    $ sudo -u seconduser /usr/bin/defaults -currentHost read

    com.apple.screensaver idleTime

    600

    Note: Issues arise if the command line is used to make the setting something other than

    what is available in the GUI Menu. Choose either 1 (60), 2 (120), 5 (300), 10 (600), or

    20 (1200) minutes to avoid any issues.

    Profile Method:

    1. Create or edit a configuration profile with the PayLoadType of

    com.apple.screensaver.user

    2. Add the key idleTime

    3. Set the key to <integer><≤1200></integer>'
