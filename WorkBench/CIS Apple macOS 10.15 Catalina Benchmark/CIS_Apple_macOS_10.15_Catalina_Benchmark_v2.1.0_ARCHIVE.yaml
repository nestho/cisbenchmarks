  title: Ensure Secure Keyboard Entry Terminal.app Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Secure Keyboard Entry prevents other applications on the system and/or network from detecting and recording
    what is typed into Terminal. Unauthorized applications and malicious code could intercept keystrokes entered in the Terminal.
  rationale: Enabling Secure Keyboard Entry minimizes the risk of a key logger from detecting what is entered in Terminal.
  impact: Enabling this in Terminal would prevent an application that is otherwise validly intercepting keyboard input from
    intercepting that input in Terminal.app. This could impact productivity tools.
  references:
  - 1. https://support.apple.com/en-ca/guide/terminal/trml109/mac
  - 2. https://developer.apple.com/library/archive/technotes/tn2150/_index.html
