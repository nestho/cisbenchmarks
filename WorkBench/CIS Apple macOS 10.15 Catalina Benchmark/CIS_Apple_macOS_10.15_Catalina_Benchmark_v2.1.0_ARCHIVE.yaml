- id: 5.1.4
  title: Ensure Appropriate Permissions Are Enabled for System Wide Applications
  scoring: scored
  profile:
  - Level 1
  description: Applications in the System Applications Directory (/Applications) should be worldexecutable since that is their
    reason to be on the system. They should not be worldwritable and allow any process or user to alter them for other processes
    or users to then execute modified versions.
  rationale: Unauthorized modifications of applications could lead to the execution of malicious code.
  impact: Applications changed will no longer be world-writable. Depending on the environment, there will be different risk
    tolerances on each non-conforming application. Global changes should not be performed where mission-critical applications
    are misconfigured.
  references: []
  page_start: 239
  audit_raw: 'Run the following command to verify that all applications have the correct permissions:

    $ sudo /usr/bin/find /Applications -iname "*.app" -type d -perm -2 -ls

    If there is any output, the that application is not in compliance.

    example:

    $ sudo /usr/bin/find /Applications -iname "*.app" -type d -perm -2 -ls

    921804 0 drwxr-xrwx 3 seconduser admin 96 8

    Aug 04:32 /Applications/Google Chrome.app

    922602 0 drwxr-xrwx 3 seconduser admin 96 8

    Aug 04:32 /Applications/Google Chrome copy.app'
  remediation: 'Global changes should not be performed where mission-critical applications are part of

    the misconfigured applications.

    Run the following command to change the permissions for each application that does

    not meet the requirements:

    $ sudo /bin/chmod -R o-w /Applications/<applicationname>

    example:

    $ sudo /bin/chmod -R o-w /Applications/Google\ Chrome.app/

    $ sudo /usr/bin/find /Applications -iname "*.app" -type d -perm -2 -ls

    922602 0 drwxr-xrwx 3 seconduser admin 96 8

    Aug 04:32 /Applications/Google Chrome copy.app'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that all applications have the correct permissions:

      $ sudo /usr/bin/find /Applications -iname "*.app" -type d -perm -2 -ls

      If there is any output, the that application is not in compliance.

