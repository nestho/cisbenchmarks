- id: 2.5.2.2
  title: Ensure Firewall Stealth Mode Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: While in Stealth mode, the computer will not respond to unsolicited probes, dropping that traffic. http://support.apple.com/en-us/HT201642
  rationale: Stealth mode on the firewall minimizes the threat of system discovery tools while connected to a network or the
    Internet.
  impact: Traditional network discovery tools like ping will not succeed. Other network tools that measure activity and approved
    applications will work as expected. This control aligns with the primary macOS use case of a laptop that is often connected
    to untrusted networks where host segregation may be non-existent. In that use case, hiding from the other inmates is likely
    more than desirable. In use cases where use is only on trusted LANs with static IP addresses, stealth mode may not be
    desirable.
  references: []
  page_start: 119
  audit_raw: "Perform the following to verify the firewall has stealth mode enabled:\nGraphical Method:\n1. Open System Preferences\n\
    2. Select Security & Privacy\n3. Select Firewall Options\n4. Verify that Enable stealth mode is set\nor\n1. Open System\
    \ Preferences\n2. Select Profiles\n3. Verify that an installed profile has Stealth mode set to Enabled\nTerminal Method:\n\
    Run the following command to verify that stealth mode is enabled:\n$ sudo /usr/libexec/ApplicationFirewall/socketfilterfw\
    \ --getstealthmode\nStealth mode enabled\nor\nRun the following command to verify that a profile is installed that enables\
    \ firewall\nstealth mode:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep EnableStealthMode\n EnableStealthMode\
    \ = 1;"
  remediation: 'Perform the following to enable stealth mode:

    Graphical Method:

    1. Open System Preferences

    2. Select Security & Privacy

    3. Select Firewall Options

    4. Turn on Enable stealth mode

    Terminal Method:

    Run the following command to enable stealth mode:

    $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on

    Stealth mode enabled

    Profile Method:

    1. Edit a configuration profile with the PayLoadType of

    com.apple.security.firewall

    2. Add the key EnableStealthMode

    3. Set the key to <true/>

    Note: This key must be set in the same configuration profile with EnableFirewall set to

    <true/>. If it is set in its own configuration profile, it will fail.'
  checks:
  - type: manual_review
    info: 'Perform the following to verify the firewall has stealth mode enabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Security & Privacy

      3. Select Firewall Options

      4. Verify that Enable stealth mode is set

      or

      1. Open System Preferences

      2. Select Profiles

      3. Verify that an installed profile has Stealth mode set to Enabled

      Terminal Method:

      Run the following command to verify that stealth mode is enabled:

      $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode

      Stealth mode e'
    severity: medium
- id: 2.5.3
  title: Ensure Location Services Is Enabled
  scoring: scored
  profile:
  - Level 2
  description: macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant
    information to users. With the operating system verifying the location, users do not need to change the time or the time
    zone. The computer will change them based on the user's location. They do not need to specify their location for weather
    or travel times, and they will receive alerts on travel times to meetings and appointment where location information is
    supplied. Location Services simplify some processes with mobile computers, such as asset management and time or log management.
    There are some use cases where it is important that the computer not be able to report its exact location. While the general
    use case is to enable Location Services, it should not be allowed if the physical location of the computer and the user
    should not be public knowledge.
  rationale: Location Services are helpful in most use cases and can simplify log and time management where computers change
    time zones.
  impact: ''
  references:
  - 1. https://support.apple.com/en-us/HT204690
  page_start: 123
  audit_raw: 'Perform the following to ensure that Location Services is enabled:

    Graphical Method:

    1. Open System Preferences

    2. Select Security & Privacy

    3. Select Privacy

    4. Verify Location Services is enabled

    Terminal Method:

    Run the following command to verify that Location Services are enabled:

    $ sudo launchctl list | grep -c com.apple.locationd

    1

    $ sudo /usr/bin/defaults read

    /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd

    LocationServicesEnabled

    1'
  remediation: 'Perform the following to enable Location Services:

    Graphical Method:

    1. Open System Preferences

    2. Select Security & Privacy

    3. Select Privacy

    4. Select Enable Location Services

    Terminal Method:

    Run the following command to enable Location Services:

    $ sudo launchctl load -w

    /System/Library/LaunchDaemons/com.apple.locationd.plist

    If the com.apple.locationd.plist outputs 0, run the following command to also ensure

    Location Services is running:

    $ sudo /usr/bin/defaults write

    /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd

    LocationServicesEnabled -bool false

    $ sudo /bin/launchctl kickstart -k system/com.apple.locationd

    Note: In some use cases, organizations may not want Location Services running. To

    disable Location Services, System Integrity Protection must be disabled.'
  checks:
  - type: command
