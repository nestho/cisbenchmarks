- id: 2.4.11
  title: Ensure AirDrop Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: AirDrop is Apple's built-in on demand ad hoc file exchange system that is compatible with both macOS and iOS.
    It uses Bluetooth LE for discovery that limits connectivity to Mac or iOS users that are in close proximity. Depending
    on the setting it allows everyone or only Contacts to share files when they are nearby to each other. In many ways this
    technology is far superior to the alternatives. The file transfer is done over a TLS encrypted session, does not require
    any open ports that are required for file sharing, does not leave file copies on email servers or within cloud storage,
    and allows for the service to be mitigated so that only people already trusted and added to contacts can interact with
    you. While there are positives to AirDrop, there are privacy concerns that could expose personal information. For that
    reason, AirDrop should be disabled, and should only be enabled when needed and disabled afterwards. The recommendation
    against enabling the sharing is not based on any known lack of security in the protocol but for specific user operational
    concerns. • If AirDrop is enabled the Mac is advertising that a Mac is addressable on the local network and open to either
    unwanted AirDrop upload requests or for a negotiation on whether the remote user is in the user's contacts list Neither
    process is desirable. • In most known use cases AirDrop use is ad hoc networking where AirDrop use is where Apple device
    users decide that a file should be exchanged and opt to use AirDrop which can be abled on the fly for that exchange.
  rationale: AirDrop can allow malicious files to be downloaded from unknown sources. Contacts Only limits may expose personal
    information to devices in the same area.
  impact: Disabling AirDrop can limit the ability to move files quickly over the network without using file shares.
  references:
  - 1. https://www.techrepublic.com/article/apple-airdrop-users-reportedly-vulnerableto-security-flaw/
  - 2. https://www.imore.com/how-apple-keeps-your-airdrop-files-private-and-secure
