  audit_raw: "Perform the following to ensure that keyboard entries are secure in Terminal:\nGraphical Method:\n1. Open Terminal\n\
    2. Select Terminal in the Menu Bar\n3. Verify that Secure Keyboard Entry is set\nor\n1. Open System Preferences\n2. Select\
    \ Profiles\n3. Verify that an installed profile has SecureKeyboardEntry is set to 1\nTerminal Method:\nFor each user,\
    \ run the following command to verify that keyboard entries in Terminal\nare secured:\n$ sudo -u <username> /usr/bin/defaults\
    \ read -app Terminal SecureKeyboardEntry\n1\nexample:\n$ sudo -u firstuser /usr/bin/defaults read -app Terminal SecureKeyboardEntry\n\
    0\n$ sudo -u seconduser /usr/bin/defaults read -app Terminal SecureKeyboardEntry\n1\nIn the above example the user seconduser\
    \ is compliant, and the user firstuser is not\ncompliant.\nor\nRun the following command to verify that a profile is installed\
    \ that enables secure\nkeyboard entry in Terminal:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep SecureKeyboardEntry\n\
    \ SecureKeyboardEntry = 1;"
  remediation: 'Perform the following to enable secure keyboard entries in Terminal:

    Graphical Method:

    1. Open Terminal

    2. Select Terminal in the Menu Bar

    3. Select Secure Keyboard Entry

    Terminal Method:

    $ sudo -u <username> /usr/bin/defaults write -app Terminal

    SecureKeyboardEntry -bool true

    example:

    $ sudo -u firstuser /usr/bin/defaults write -app Terminal SecureKeyboardEntry

    -bool true

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    com.apple.Terminal

    2. Add the key SecureKeyboardEntry

    3. Set the key to <true/>'
