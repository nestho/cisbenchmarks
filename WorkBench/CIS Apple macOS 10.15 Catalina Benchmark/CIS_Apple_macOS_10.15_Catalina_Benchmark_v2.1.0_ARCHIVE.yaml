- id: '1.6'
  title: Ensure Install of macOS Updates Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensure that macOS updates are installed after they are available from Apple. This setting enables macOS updates
    to be automatically installed. Some environments will want to approve and test updates before they are delivered. It is
    best practice to test first where updates can and have caused disruptions to operations. Automatic updates should be turned
    off where changes are tightly controlled and there are mature testing and approval processes. Automatic updates should
    not be turned off simply to allow the administrator to contact users in order to verify installation. A dependable, repeatable
    process involving a patch agent or remote management tool should be in place before auto-updates are turned off.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
  impact: Unpatched software may be exploited.
  references: []
  page_start: 32
  audit_raw: "Perform the following to ensure that macOS updates are set to auto update:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Software Updates\n3. Select Advanced\n4. Verify that \"Install macOS updates\" is selected\n\
    or\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has Automatically Install macOS\
    \ Updates set to\nTrue\nTerminal Method:\nRun the following command to verify that macOS updates are automatically checked\n\
    and installed:\n$ sudo /usr/bin/defaults read /Library/Preferences/com.apple.SoftwareUpdate\nAutomaticallyInstallMacOSUpdates\n\
    1\nNote: If automatic updates were selected during system setup, this setting may not\nhave left an auditable artifact.\
    \ Please turn off the check and re-enable when the GUI\ndoes not reflect the audited results.\nor\nRun the following command\
    \ to verify that a profile is installed that enables the\ninstallation of macOS updates:\n$ sudo /usr/bin/profiles -P\
    \ -o stdout | /usr/bin/grep\nAutomaticallyInstallMacOSUpdates\n AutomaticallyInstallMacOSUpdates = 1;"
  remediation: 'Perform the following to enable macOS updates to run automatically:

    Graphical Method:

    1. Open System Preferences

    2. Select Software Updates

    3. Select Advanced

    4. Select Install macOS updates

    Terminal Method:

    Run the following command to to enable automatic checking and installing of macOS

    updates:

    $ sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticallyInstallMacOSUpdates -bool TRUE

    Profile Method:

    1. Create or edit a configuration profile with the PayLoadType of

    com.apple.SoftwareUpdate

    2. Add the key AutomaticallyInstallMacOSUpdates

    3. Set the key to <true/>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that macOS updates are set to auto update:

      Graphical Method:

      1. Open System Preferences

      2. Select Software Updates

      3. Select Advanced

      4. Verify that "Install macOS updates" is selected

      or

      1. Open System Preferences

      2. Select Profiles

      3. Verify that an installed profile has Automatically Install macOS Updates set to

      True

      Terminal Method:

      Run the following command to verify that macOS updates are automatically checked

      and installed:

      $ sudo /usr/bin/defaults read /Li'
    severity: medium
- id: '1.7'
  title: Ensure Software Update Deferment Is Less Than or Equal to 30 Days
  scoring: scored
  profile:
  - Level 1
  description: Apple provides the capability to manage software updates on Apple devices through mobile device management.
    Part of those capabilities permit organizations to defer software updates and allow for testing. Many organizations have
    specialized software and configurations that may be negatively impacted by Apple updates. If software updates are deferred,
    they should not be deferred for more than 30 days. This control only verifies that deferred software updates are not deferred
    for more than 30 days. Manage software updates for Apple devices
  rationale: Apple software updates almost always include security updates. Attackers evaluate updates to create exploit code
    in order to attack unpatched systems. The longer a system remains unpatched, the greater an exploit possibility exists
    in which there are publicly reported vulnerabilities.
  impact: Some organizations may need more than 30 days to evaluate the impact of software updates.
  references: []
  page_start: 35
  audit_raw: 'Perform the following to ensure that software updates are deferred at most 30 days:

    Graphical Method:

    1. Open System Preferences

    2. Select Profiles

    3. Verify that Deferred Software Update Delays (Days) is set to ≤ 30

    Terminal Method:

    Run the following command to verify that a profile is installed that defers software

    updates to at most 30 days:

    $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep

    ''enforcedSoftwareUpdateDelay =''

    If there is an output, it should be enforcedSoftwareUpdateDelay = to ≤ 30.

    Note: If your organization does not use a software deferment mobile configuration,

    there will be no output and will pass the audit.'
  remediation: 'Perform the following to enable the system to defer updates to 30 days or less:

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    com.apple.applicationaccess

    2. Add the key enforcedSoftwareUpdateDelay

    3. Set the key to <integer><1-30></integer>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that software updates are deferred at most 30 days:

      Graphical Method:

      1. Open System Preferences

      2. Select Profiles

      3. Verify that Deferred Software Update Delays (Days) is set to ≤ 30

      Terminal Method:

      Run the following command to verify that a profile is installed that defers software

      updates to at most 30 days:

      $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep

      ''enforcedSoftwareUpdateDelay =''

      If there is an output, it should be enforcedSoftwareUpdateDelay = t'
    severity: medium
- id: '1.8'
  title: Ensure Computer Name Does Not Contain PII or Protected Organizational Information
  scoring: manual
  profile:
  - Level 2
  description: 'If the computer is used in an organization that assigns host names, it is a good idea to change the computer
    name to the host name. This is more of a best practice than a security measure. If the host name and the computer name
    are the same, computer support may be able to track problems down more easily. For organizations or for users that self-administer
    their own computers, it is important to not use sensitive or personal information in computer names. The name of a computer
    that uses untrusted networks will be exposed at a minimum to the responsible network team of that network. While I may
    not care if the computer name of Ron Colvin''s MacBook Pro is visible on a Hooters WiFi network, other uses may not feel
    the same way. Examples of possibly inappropriate content in computer names include: • User directory account names • Computer
    directory account names where machine accounts exist • Contact phone numbers • Physical locations of offices or residences
    • Personal information that can be augmented with Facebook data to assist social engineering attacks Standard naming patterns
    avoid collisions and mitigate risk for computer users. With mobile devices, using DHCP IP tracking has serious drawbacks;
    hostname or computer name tracking makes much more sense for those organizations that can implement it. If the computer
    is using different names for the "Computer Name" DNS and Directory environments, it can be difficult to manage Macs in
    an Enterprise asset inventory.'
  rationale: Part of IT security is having visibility into all of the devices for which an organization is responsible. Without
    a complete inventory, it is impossible to ensure all security controls are met on all organizational devices. Default
    macOS naming deconfliction controls can create issues for appropriate management and tracking as well as privacy exposure.
    By default, the name of a macOS computer is derived from the first user created. If the user has multiple computers or
    an image is used without an appropriate name change, there will be multiple computers with names derived from the same
    user for discovery deconfliction. How many "Ron Colvin's MacBook Pro" should there be, and are any missing? Local network
    auto renaming to avoid collisions also allows for the enumeration of local computer names. Computers should not be named
    after their users, especially on untrusted networks. For social engineering purposes, the computer name should not provide
    a full name of the user or an identifiable name that might be used to assist in targeted user attacks. A documented plan
    to better enable a complete device inventory without exposing user or organizational information is part of mature security.
  impact: ''
  references:
  - 1. https://support.apple.com/en-ca/guide/mac-help/mchlp1177/11.0/mac/11.0
  - 2. https://uberagent.com/blog/choosing-macos-computer-names-wisely/
  page_start: 37
  audit_raw: 'Perform the following to verify the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Verify that Computer Name is set to your organization''s parameters'
  remediation: 'Perform the following to set the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Set Computer Name to your organization''s parameters'
  checks:
  - type: manual_review
    info: 'Perform the following to verify the computer name:

      1. Open System Preferences

      2. Select Sharing

      3. Verify that Computer Name is set to your organization''s parameters'
    severity: medium
- id: 2.1.1
  title: Ensure Show Bluetooth Status in Menu Bar Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, discoverable, what paired devices exist, and what paired devices
    are currently active.
  impact: Bluetooth is a useful wireless tool that has been widely exploited when configured improperly. The user should have
    insight into the Bluetooth status.
  references: []
  page_start: 42
  audit_raw: 'Perform the following to ensure that Bluetooth status shows in the menu bar:

    Graphical Method:

    1. Open System Preferences

    2. Select Bluetooth

    3. Verify the Show Bluetooth in menu bar is selected

    Terminal Method:

    For each user, run the following command to verify that the Bluetooth status is enabled

    to show in the menu bar:

    $ sudo -u <username> defaults read

    /Users/<username>/Library/Preferences/com.apple.systemuiserver menuExtras |

    grep Bluetooth.menu

    "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"

    example:

    $ sudo -u firstuser defaults read

    /Users/firstuser/Library/Preferences/com.apple.systemuiserver.plist

    menuExtras | grep Bluetooth.menu

    "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"'
  remediation: 'Perform the following to enable Bluetooth status in the menu bar:

    Graphical Method:

    1. Open System Preferences

    2. Select Bluetooth

    3. Select Show Bluetooth in menu bar

    Terminal Method:

    For each user, run the following command to enable Bluetooth status in the menu bar:

    $ sudo -u <username> defaults write

    /Users/<username>/Library/Preferences/com.apple.systemuiserver menuExtras -

    array-add "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"

    example:

    $ sudo -u firstuser defaults write

    /Users/firstuser/Library/Preferences/com.apple.systemuiserver menuExtras -

    array-add "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"

    Note: If the remediation is run multiple times, multiple instances of the Bluetooth status

    will appear after rebooting the system. Command-click and drag the unwanted icons off

    the menu bar.

    http://osxdaily.com/2012/01/05/remove-icons-menu-bar-mac-os-x/'
  checks:
  - type: command
    command: grep Bluetooth.menu && menuExtras | grep Bluetooth.menu
    expected: For each user, run the following command to verify that the Bluetooth status is enabled
    severity: medium
    info: 'Perform the following to ensure that Bluetooth status shows in the menu bar:

      Graphical Method:

      1. Open System Preferences

      2. Select Bluetooth

      3. Verify the Show Bluetooth in menu bar is selected

      Terminal Method:

