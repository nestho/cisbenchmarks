- id: '5.9'
  title: Ensure Users' Accounts Do Not Have a Password Hint
  scoring: scored
  profile:
  - Level 1
  description: Password hints help the user recall their passwords for various systems and/or accounts. In most cases, password
    hints are simple and closely related to the user's password.
  rationale: Password hints that are closely related to the user's password are a security vulnerability, especially in the
    social media age. Unauthorized users are more likely to guess a user's password if there is a password hint. The password
    hint is very susceptible to social engineering attacks and information exposure on social media networks.
  impact: ''
  references: []
  page_start: 281
  audit_raw: 'Run the following command to verify that no users hava a password hint:

    $ sudo /usr/bin/dscl . -list /Users hint

    The output will list all users. If there are any text listed with the user, then the machine is

    not compliant.

    example:

    $ sudo /usr/bin/dscl . -list /Users hint

    firstuser passwordhint

    seconduser passwordhint2

    thirduser

    fourthuser

    Guest'
  remediation: 'Perform the following to remove a user''s password hint:

    Graphical Method:

    1. Open System Preferences

    2. Select Users & Groups

    3. Select the Current User

    4. Select Change Password

    5. Change the password and ensure that no text is entered in the Password hint

    box

    Terminal Method:

    Run the following command to remove a user''s password hint:

    $ sudo /usr/bin/dscl . -delete /Users/<username> hint

    example:

    $ sudo /usr/bin/dscl . -delete /Users/firstuser hint

    $ sudo /usr/bin/dscl . -delete /Users/seconduser hint'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that no users hava a password hint:

      $ sudo /usr/bin/dscl . -list /Users hint

      The output will list all users. If there are any text listed with the user, then the machine is

      not compliant.

      example:

      $ sudo /usr/bin/dscl . -list /Users hint

      firstuser passwordhint

      seconduser passwordhint2

      thirduser

      fourthuser

      Guest'
    severity: medium
- id: '5.10'
  title: Ensure Fast User Switching Is Disabled
  scoring: manual
  profile:
  - Level 2
  description: Fast user switching allows a person to quickly log into the computer with a different account. While only a
    minimal security risk, when a second user is logged in, that user might be able to see what processes the first user is
    using, or possibly gain other information about the first user. In a large directory environment where it is difficult
    to limit login access, many valid users can login to other user's assigned computers.
  rationale: Fast user switching allows multiple users to run applications simultaneously at console. There can be information
    disclosed about processes running under a different user. Without a specific configuration to save data and log out, users
    can have unsaved data running in a background session that is not obvious.
  impact: When support staff visits a user's computer console, they will not be able to log into their own session if there
    is an active and locked session.
  references:
  - 1. https://support.apple.com/guide/mac-help/switch-quickly-between-usersmchlp2439/mac
  page_start: 283
  audit_raw: "Perform the following to ensure that fast user switching is not enabled:\nGraphical Method:\n1. Open System\
    \ Preferences\n2. Select Users & Groups\n3. Select Login Options\n4. Verify make sure the \"Show fast user switching menu\
    \ as...\" is not set\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has Multiple\
    \ Session Enabled set to False\nTerminal Method:\nRun the following command to verify that fast user switching is disabled:\n\
    $ sudo /usr/bin/defaults read /Library/Preferences/.GlobalPreferences.plist\nMultipleSessionEnabled\nIf the output is\
    \ neither 0 or The domain/default pair of\n(/Library/Preferences/.GlobalPreferences.plist, MultipleSessionEnabled) does\n\
    not exist, the computer is not compliant.\nor\nRun the following command to verify that a profile is installed that disables\
    \ Fast User\nSwitching:\n$ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep MultipleSessionEnabled\n MultipleSessionEnabled\
    \ = 0;"
  remediation: 'Perform the following to disable fast user switching:

    Graphical Method:

    1. Open System Preferences

    2. Select Users & Groups

    3. Select Login Options

    4. Uncheck "Show fast user switching menu as..."

    Terminal Method:

    Run the following command to turn fast user switching off:

    $ sudo /usr/bin/defaults write /Library/Preferences/.GlobalPreferences

    MultipleSessionEnabled -bool false

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    .GlobalPreferences

    2. Add the key MultipleSessionEnabled

    3. Set the key to </false>'
  checks:
  - type: sql
    command: Select Users & Groups
    severity: medium
    info: 'Perform the following to ensure that fast user switching is not enabled:

      Graphical Method:

      1. Open System Preferences

      2. Select Users & Groups

