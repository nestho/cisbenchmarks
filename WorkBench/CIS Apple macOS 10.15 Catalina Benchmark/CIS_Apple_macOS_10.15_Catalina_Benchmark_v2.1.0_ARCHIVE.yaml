- id: '2.12'
  title: Audit Touch ID and Wallet & Apple Pay Settings
  scoring: manual
  profile:
  - Level 1
  description: Apple has integrated Touch ID with macOS and allows fingerprint use for many common operations. All use of
    Touch ID requires the presence of a password and the use of that password after every reboot, or when more than 48 hours
    has elapsed since the device was last unlocked. Touch ID is a prerequisite for using Apple Pay and Wallet on macOS. Apple
    Pay allows an Apple account holder to enroll their credit cards in Apple Pay and pay enrolled vendors without using the
    physical card or number. Apple's service eliminates the requirement to send the credit card number itself to the vendor.
    Apple Pay on a Mac allows the use of credit cards the user has already enrolled and reduces user risk for credit card
    purchases.
  rationale: Touch ID allows for an account-enrolled fingerprint to access a key that uses a previously provided password.
    Some environments may have rules around purchases from organizationally managed computers and may want to discourage shopping
    from them. It is difficult to block access to websites that allow purchases, and Apple Pay has more controls for user
    protection than the manual entry of credit card information.
  impact: Touch ID is more convenient for use with aggressive screen lock controls.
  references:
  - 1. https://support.apple.com/guide/mac-help/use-wallet-apple-pay-on-macmchl4773988b/mac
  - 2. https://www.apple.com/apple-pay/
  page_start: 200
  audit_raw: 'Perform the following to verify Touch ID settings:

    Graphical Method:

    1. Open System Preferences

    2. Select Touch ID

    3. Verify the Touch ID settings match your organization''s settings

    4. Open System Preferences

    5. Select Wallet & Apple Pay

    6. Verify the Wallet & Apple Pay settings match your organization''s settings'
  remediation: 'Perform the following to set Touch ID to your organization''s settings:

    Graphical Method:

    1. Open System Preferences

    2. Select Touch ID

    3. Select the Touch ID settings match your organization''s settings

    4. Open System Preferences

    5. Select Wallet & Apple Pay

    6. Select the Wallet & Apple Pay settings match your organization''s settings'
  checks:
  - type: manual_review
    info: 'Perform the following to verify Touch ID settings:

      Graphical Method:

      1. Open System Preferences

      2. Select Touch ID

      3. Verify the Touch ID settings match your organization''s settings

      4. Open System Preferences

      5. Select Wallet & Apple Pay

      6. Verify the Wallet & Apple Pay settings match your organization''s settings'
    severity: medium
- id: '3.1'
  title: Ensure Security Auditing Is Enabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: macOS's audit facility, auditd, receives notifications from the kernel when certain system calls, such as open,
    fork, and exit, are made. These notifications are captured and written to an audit log. Auditing is the capture and maintenance
    of information about security-related events. Auditable events often depend on differing organizational requirements.
  rationale: Logs generated by auditd may be useful when investigating a security incident as they may help reveal the vulnerable
    application and the actions taken by a malicious actor. Maintaining an audit trail of system activity logs can help identify
    configuration errors, troubleshoot service disruptions, and analyze compromises or attacks that have occurred, have begun,
    or are about to begin. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised.
    Depending on the governing authority, organizations can have vastly different auditing requirements. In this control,
    we have selected a minimal set of audit flags that should be a part of any organizational requirements. The flags selected
    below may not adequately meet organizational requirements for users of this benchmark. The auditing checks for the flags
    proposed here will not impact additional flags that are selected.
  impact: ''
  references:
  - 1. https://derflounder.wordpress.com/2012/01/30/openbsm-auditing-on-mac-os-x/
  - 2. https://csrc.nist.gov/CSRC/media/Publications/sp/800-179/rev1/draft/documents/sp800-179r1-draft.pdf
  page_start: 203
  audit_raw: 'Perform the following to verify that security auditing is enabled:

    Run the following command to verify auditd:

    $ sudo launchctl list | grep -i auditd

    - 0 com.apple.auditd

    Historical audit flags are listed below as preliminary guidance.

    Perform the following to ensure the enabled Security Auditing Flags:

    Run the following command to verify the Security Auditing Flags that are enabled:

    $ sudo grep -e "^flags:" /etc/security/audit_control

    The output should include the following flags:

    • -fm - audit successful/failed file attribute modification events

    • ad - audit successful/failed administrative events

    • -ex - audit failed program execution

    • aa - audit all authorization and authentication events

    • -fr - audit all failed read actions where enforcement stops a read of a file

    • lo - audit successful/failed login/logout events

    • -fw - audit all failed write actions where enforcement stopped a file write

    The -all flag will capture all failed events across all audit classes and can be used to

    supersede the individual flags for failed events.

    Note: excluding potentially noisy audit events may be ideal, depending on your usecase.'
  remediation: 'Perform the following to enable security auditing:

    Run the following command to load auditd:

    $ sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.auditd.plist

    Perform the following to set the required Security Auditing Flags:

    Edit the /etc/security/audit_control file and add -fm, ad, -ex, aa, -fr, lo, and -fw to

    flags. You can also substitute -all for -fm, -ex, -fr, and -fw.'
  checks:
  - type: command
    command: $ sudo launchctl list | grep -i auditd
    expected: 'Perform the following to verify that security auditing is enabled:'
    severity: medium
    info: 'Perform the following to verify that security auditing is enabled:

      Run the following command to verify auditd:

      $ sudo launchctl list | grep -i auditd

      - 0 com.apple.auditd

      Historical audit flags are listed below as preliminary guidance.

      Perform the following to ensure the enabled Security Auditing Flags:

      Run the following command to verify the Security Auditing Flags that are enabled:

      $ sudo grep -'
- id: '3.3'
  title: Ensure install.log Is Retained for 365 or More Days and No Maximum Size
  scoring: scored
  profile:
  - Level 1
  description: macOS writes information pertaining to system-related events to the file /var/log/install.log and has a configurable
    retention policy for this file. The default logging setting limits the file size of the logs and the maximum size for
    all logs. The default allows for an errant application to fill the log files and does not enforce sufficient log retention.
    The Benchmark recommends a value based on standard use cases. The value should align with local requirements within the
    organization. The default value has an "all_max" file limitation, no reference to a minimum retention, and a less precise
    rotation argument. The all_max flag control will remove old log entries based only on the size of the log files. Log size
    can vary widely depending on how verbose installing applications are in their log entries. The decision here is to ensure
    that logs go back a year, and depending on the applications a size restriction could compromise the ability to store a
    full year. While this Benchmark is not scoring for a rotation flag, the default rotation is sequential rather than using
    a timestamp. Auditors may prefer timestamps in order to simply review specific dates where event information is desired.
    Please review the File Rotation section in the man page for more information. man asl.conf • The maximum file size limitation
    string should be removed "all_max=" • An organization appropriate retention should be added "ttl=" • The rotation should
    be set with timestamps "rotate=utc" or "rotate=local"
  rationale: Archiving and retaining install.log for at least a year is beneficial in the event of an incident as it will
    allow the user to view the various changes to the system along with the date and time they occurred.
  impact: Without log files system maintenance and security forensics cannot be properly performed.
  references: []
  page_start: 207
  audit_raw: 'Perform the following to ensure that the install logs are retained for at least 365 days

    with no maximum size:

    Run the following command to verify how long install log files are retained and if there is

    a maximum size:

    $ sudo grep -i ttl /etc/asl/com.apple.install

    The output must include ttl≥365

    $ sudo grep -i all_max= /etc/asl/com.apple.install

    No results should be returned.'
  remediation: 'Perform the following to ensure that install logs are retained for at least 365 days:

    Edit the /etc/asl/com.apple.install file and add or modify the ttl value to 365 or

    greater on the file line. Also, remove the all_max= setting and value from the file line.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that the install logs are retained for at least 365 days

      with no maximum size:

      Run the following command to verify how long install log files are retained and if there is

      a maximum size:

      $ sudo grep -i ttl /etc/asl/com.apple.install

      The output must include ttl≥365

      $ sudo grep -i all_max= /etc/asl/com.apple.install

      No results should be returned.'
    severity: medium
- id: '3.4'
  title: Ensure Security Auditing Retention Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'The macOS audit capability contains important information to investigate security or operational issues. This
    resource is only completely useful if it is retained long enough to allow technical staff to find the root cause of anomalies
    in the records. Retention can be set to respect both size and longevity. To retain as much as possible under a certain
    size, the recommendation is to use the following: expire-after:60d OR 5G This recomendation is based on minimum storage
    for review and investigation. When a third party tool is in use to allow remote logging or the store and forwarding of
    logs, this local storage requirement is not required.'
  rationale: The audit records need to be retained long enough to be reviewed as necessary.
  impact: The recommendation is that at least 60 days or 5 gigabytes of audit records are retained. Systems that have very
    little remaining disk space may have issues retaining sufficient data.
  references: []
  page_start: 209
  audit_raw: 'Run the following command to verify audit retention:

    $ sudo grep -e "^expire-after" /etc/security/audit_control

    The output value for expire-after: should be ≥ 60d OR 5G

    Note: If your organization is offloading your security logs, we recommend following the

    same guidance (at minimum) for your off-site log storage. Your local storage limit (or

    time frame) may fail if they are set to lower in this case, but are following the guidance.'
  remediation: 'Perform the following to set the audit retention length:

    Edit the /etc/security/audit_control file so that expire-after: is at least 60d OR 5G'
  checks:
  - type: manual_review
    info: 'Run the following command to verify audit retention:

      $ sudo grep -e "^expire-after" /etc/security/audit_control

      The output value for expire-after: should be ≥ 60d OR 5G

      Note: If your organization is offloading your security logs, we recommend following the

      same guidance (at minimum) for your off-site log storage. Your local storage limit (or

      time frame) may fail if they are set to lower in this case, but are following the guidance.'
    severity: medium
- id: '3.5'
  title: Ensure Access to Audit Records Is Controlled
  scoring: scored
  profile:
  - Level 1
  description: The audit system on macOS writes important operational and security information that can be both useful for
    an attacker and a place for an attacker to attempt to obfuscate unwanted changes that were recorded. As part of defense-in-depth,
    the /etc/security/audit_control configuration and the files in /var/audit should be owned only by root with group wheel
    with read-only rights and no other access allowed. macOS ACLs should not be used for these files.
  rationale: Audit records should never be changed except by the system daemon posting events. Records may be viewed or extracts
    manipulated, but the authoritative files should be protected from unauthorized changes.
  impact: This control is only checking the default configuration to ensure that unwanted access to audit records is not available.
  references: []
  page_start: 211
  audit_raw: 'Run the following commands to check file access rights:

    $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

    /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$3} END {print s}''

    0

    $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

    /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$4} END {print s}''

    0

    $ sudo /bin/ls -l $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

    /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''!/-r--r-----

    |current|total/{print $1}'' | /usr/bin/wc -l | /usr/bin/tr -d '' ''

    0

    $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /var/audit/ | /usr/bin/awk -F:

    ''{print $2}'') | /usr/bin/awk ''{s+=$3} END {print s}''

    0

    $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /var/audit/ | /usr/bin/awk -F:

    ''{print $2}'') | /usr/bin/awk ''{s+=$4} END {print s}''

    0

    $ sudo /bin/ls -l $(/usr/bin/grep ''^dir'' /var/audit/ | /usr/bin/awk -F:

    ''{print $2}'') | /usr/bin/awk ''!/-r--r-----|current|total/{print $1}'' |

    /usr/bin/wc -l | /usr/bin/tr -d '' ''

    0'
  remediation: 'Run the following to commands to set the audit records to the root user and wheel

    group:

    $ sudo chown -R root:wheel /etc/security/audit_control

    $ sudo chmod -R o-rw /etc/security/audit_control

    $ sudo chown -R root:wheel /var/audit/

    $ sudo chmod -R o-rw /var/audit/

    Note: It is recommended to do a thorough verification process on why the audit logs

    have been changed before following the remediation steps. If the system has different

    access controls on the audit logs, and the changes cannot be traced, a new install may

    be prudent. Check for signs of file tampering as well as unapproved OS changes.'
  checks:
  - type: manual_review
    info: 'Run the following commands to check file access rights:

      $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

      /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$3} END {print s}''

      0

      $ sudo /bin/ls -n $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

      /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''{s+=$4} END {print s}''

      0

      $ sudo /bin/ls -l $(/usr/bin/grep ''^dir'' /etc/security/audit_control |

      /usr/bin/awk -F: ''{print $2}'') | /usr/bin/awk ''!/-r--r-----

      |current|total/{print $1}'' '
    severity: medium
- id: '3.6'
  title: Ensure Firewall Logging Is Enabled and Configured
  scoring: scored
  profile:
  - Level 1
  description: The socketfilter firewall is what is used when the firewall is turned on in the Security Preference Pane. In
    order to appropriately monitor what access is allowed and denied, logging must be enabled. The logging level must be set
    to "detailed" to be useful in monitoring connection attempts that the firewall detects. Throttled login is not sufficient
    for examine firewall connection attempts.
  rationale: In order to troubleshoot the successes and failures of a firewall, logging should be enabled.
  impact: Detailed logging may result in excessive storage.
  references: []
  page_start: 214
  audit_raw: 'Run the following command to verify that the firewall log is enabled:

    $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getloggingmode

    Log mode is on

    $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getloggingopt

    Log Option is detail'
  remediation: 'Run the following command to enable logging of the firewall:

    $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingmode on

    Turning on log mode

    $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingopt detail

    Setting detail log option'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that the firewall log is enabled:

      $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getloggingmode

      Log mode is on

      $ sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getloggingopt

      Log Option is detail'
    severity: medium
- id: '3.7'
  title: Audit Software Inventory
  scoring: manual
  profile:
  - Level 2
  description: With the introduction of Mac OS X 10.6.6, Apple added a new application, App Store, which resides in the Applications
    directory. This application allows a user with admin privileges and an Apple ID to browse Apple's online App Store, purchase
    (including nocost purchases), and install new applications, bypassing Enterprise software inventory controls. Any admin
    user can install software in the /Applications directory whether from internet downloads, thumb drives, optical media,
    cloud storage, or even binaries through email. Even standard users can run executables downloaded to their home folder
    by default. The source of the software is not nearly as important as a consistent audit of all installed software for
    patch compliance and appropriateness. A single user desktop where the user, administrator, and the person approving software
    are all the same person probably does not need to audit software inventory to this extent. It is helpful in the case of
    stability problems or malware, however. Scan systems on a monthly basis and determine the number of unauthorized pieces
    of software that are installed. Verify that if an unauthorized piece of software is found one month, it is removed from
    the system the next. Export System Information through the built-in System Information Application or other third-party
    tools on an organizationally defined timetable.
  rationale: Part of comprehensive IT security involves device management and ensuring that all software is authorized and
    patched. Checking for macOS updates and app updates are relatively simple for the end user, and can even be updated with
    minimal privileges from trusted sources, if enabled. Remote monitoring of the patch status for software maintained through
    Apple is very well supported by management applications. Neither Apple capabilities nor third-party patch management solutions
    will cover all missionnecessary software for most organizations. Full visibility into software present on the system enables
    vulnerability and risk management. P.S. Don't forget about browser plugins/extensions for all installed software.
  impact: ''
  references:
  - 1. https://support.apple.com/en-us/HT203001
  - 2. https://www.cisecurity.org/controls/inventory-and-control-of-software-assets/
  page_start: 216
  audit_raw: 'Perform the following to access System Information through the GUI or the command

    line:

    Graphical Mode:

    1. Select the Apple icon

    2. Select About this Mac

    3. Select System Report

    4. Select File

    5. Select Save

    6. Choose the name of the file and location to save the file to

    Terminal Method:

    Run the following command to view all System Profiler details

    $ sudo system_profiler SPApplicationsDataType

    To find more detailed instructions on the use of the system_profiler command, run the

    following:

    $ sudo man system_profiler'
  remediation: Delete any unnecessary applications from the system.
  checks:
  - type: manual_review
    info: 'Perform the following to access System Information through the GUI or the command

