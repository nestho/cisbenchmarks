- id: 2.3.1
  title: Ensure an Inactivity Interval of 20 Minutes Or Less for the Screen Saver Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: A locking screen saver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In macOS, the screen saver starts after a value
    is selected in the dropdown menu. 20 minutes or less is an acceptable value. Any value can be selected through the command
    line or script, but a number that is not reflected in the GUI can be problematic. 20 minutes is the default for new accounts.
  rationale: Setting an inactivity interval for the screen saver prevents unauthorized persons from viewing a system left
    unattended for an extensive period of time.
  impact: If the screen saver is not set, users may leave the computer available for an unauthorized person to access information.
  references: []
  page_start: 54
  audit_raw: "The preferred audit procedure for this control will evaluate every user account on the\ncomputer and will report\
    \ on all users where the value has been set. If the default value\nof 20 minutes is used and the user has never changed\
    \ the setting, there will not be an\naudit result on their compliant setting. The time is set in seconds so all outputs\
    \ will be in\nthat format.\nPerform the following to ensure the system is set for the screen saver to activate in 20\n\
    minutes or less:\nRun this script to verify the idle times for all users:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice\
    \ | grep \"IOPlatformUUID\" | sed -e\n's/^.* \"\\(.*\\)\"$/\\1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
    \ if [ -e $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n defaults read $PREF.plist idleTime 2>&1\n fi\ndone\n\
    Note: If the output of the script includes The domain/default pair of\n(com.apple.screensaver, idleTime) does not exist\
    \ for any user, then the setting has\nnot been changed from the default. Follow the remediation instructions to set the\
    \ idle\ntime to match your organization's policy.\nFor Macs with a single user:\nGraphical Method:\n1. Open System Preferences\n\
    2. Select Desktop & Screen Saver\n3. Select Screen Saver\n4. Verify that Start after is set for 20 minutes or less (≤1200)\n\
    or\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has Idle Time set to ≤1200\nTerminal\
    \ Method:\nRun the following command to verify that the screen saver idle time is set to less than or\nequal to 20 minutes:\n\
    $ sudo /usr/bin/defaults -currentHost read com.apple.screensaver idleTime\nThe output should be less than or equal to\
    \ 20 minutes (≤1200). example: 60, 120, 300,\n600, or 1200\nNote: If the output is The domain/default pair of (com.apple.screensaver,\n\
    idleTime) does not exist, then the setting has not been changed from the default.\nFollow the remediation instructions\
    \ to set the idle time to match your organization's\npolicy.\nor\nRun the following command to verify that a profile is\
    \ installed that enables a\nscreensaver idle time of less than or equal to 20 minutes:\n$ sudo /usr/bin/profiles -P -o\
    \ stdout | /usr/bin/grep idleTime\nThe output should be less than or equal to 20 minutes (≤1200). example: 60, 120, 300,\n\
    600, or 1200"
  remediation: 'Perform the following to set the screen saver to activate in 20 minutes or less:

