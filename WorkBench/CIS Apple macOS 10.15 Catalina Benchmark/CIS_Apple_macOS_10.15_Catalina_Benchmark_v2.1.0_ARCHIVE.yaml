- id: 2.5.1.2
  title: Ensure all user storage APFS volumes are encrypted
  scoring: manual
  profile:
  - Level 1
  description: Apple developed a new file system which was first made available in 10.12 and then became the default in 10.13.
    The file system is optimized for Flash and Solid-State storage and encryption. https://en.wikipedia.org/wiki/Apple_File_System
    macOS computers generally have several volumes created as part of APFS formatting, including Preboot, Recovery and Virtual
    Memory (VM), as well as traditional user disks. All APFS volumes that do not have specific roles and do not require encryption
    should be encrypted. "Role" disks include Preboot, Recovery and VM. User disks are labelled with "(No specific role)"
    by default.
  rationale: In order to protect user data from loss or tampering volumes, carrying data should be encrypted.
  impact: While FileVault protects the boot volume, data may be copied to other attached storage and reduce the protection
    afforded by FileVault. Ensure all user volumes are encrypted to protect data.
