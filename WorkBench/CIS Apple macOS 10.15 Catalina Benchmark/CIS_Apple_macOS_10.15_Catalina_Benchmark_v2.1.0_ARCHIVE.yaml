- id: 2.7.1
  title: Ensure Backup Automatically is Enabled
  scoring: scored
  profile:
  - Level 2
  description: Backup solutions are only effective if the backups run on a regular basis. The time to check for backups is
    before the hard drive fails or the computer goes missing. In order to simplify the user experience so that backups are
    more likely to occur, Time Machine should be on and set to Back Up Automatically whenever the target volume is available.
    Operational staff should ensure that backups complete on a regular basis and the backups are tested to ensure that file
    restoration from backup is possible when needed. Backup dates are available even when the target volume is not available
    in the Time Machine plist. SnapshotDates = ( "2012-08-20 12:10:22 +0000", "2013-02-03 23:43:22 +0000", "2014-02-19 21:37:21
    +0000", "2015-02-22 13:07:25 +0000", "2016-08-20 14:07:14 +0000" When the backup volume is connected to the computer more
    extensive information is available through tmutil. See man tmutil
  rationale: Backups should automatically run whenever the backup drive is available.
  impact: The backup will run periodically in the background and could have user impact while running.
  references: []
  page_start: 165
  audit_raw: "Perform the following to ensure that automatic backups are set if Time Machine is\nenabled:\nGraphical Method:\n\
    1. Open System Preferences\n2. Select Time Machine\n3. Verify that Back Up Automatically is set\nor\n1. Open System Preferences\n\
    2. Select Profiles\n3. Verify that an installed profile has AutoBackup=1\nTerminal Method:\nRun the following command\
    \ to verify that Time Machine is set to automatically backup if\nTime Machine is enabled:\n$ sudo /usr/bin/defaults read\n\
    /Library/Preferences/com.apple.TimeMachine.plist AutoBackup\n1\nIf Time Machine has never been used and is not configured,\
    \ there will not be an\nAutoBackup flag to check. If so, the machine will be in compliance.\nRun the following command\
    \ to check the snapshot dates to verify that the dates meet\nyour organization's approved backup frequency:\n$ sudo /usr/bin/defaults\
    \ read\n/Library/Preferences/com.apple.TimeMachine.plist\nThe output will contain all the Time Machine backups in the\
    \ format \"YYYY-MM-DD\nHH:MM:SS +0000\"\nexample:\n$ sudo /usr/bin/defaults read\n/Library/Preferences/com.apple.TimeMachine.plist\
    \ AutoBackup\n1\n$ sudo /usr/bin/defaults read\n/Library/Preferences/com.apple.TimeMachine.plist\n{\n AutoBackup = 1;\n\
    \ BackupAlias = {length = 270, bytes = 0x00000000 010e0002 00010654\n65737454 ... 74544d00 ffff0000 };\n Destinations\
    \ = (\n {\n BackupAlias = {length = 270, bytes = 0x00000000 010e0002 00010654\n65737454 ... 74544d00 ffff0000 };\n BytesAvailable\
    \ = 450998374400;\n BytesUsed = 48765513728;\n ConsistencyScanDate = \"2020-08-07 12:23:26 +0000\";\n DestinationID =\
    \ \"C751EDAD-4E5F-4FA9-AF1B-AF34A00FF97F\";\n DestinationUUIDs = (\n \"24C6B473-A3C5-391F-8191-244A78D40E3C\"\n );\n LastKnownEncryptionState\
