    \ -\nbool <true/false>\n$ sudo /usr/bin/defaults write com.apple.sidecar.display hasShownPref -bool\n<true/false>\nProfile\
    \ Method:\n1. Create or edit a configuration profile with the key of com.apple.sidecar.display\nunder PayloadContent\n\
    2. Add the following set of keys with the Forced key:\n<dict>\n <key>Forced</key>\n <array>\n <dict>\n <key>mcx_preference_settings</key>\n\
    \ <dict>\n <key>AllowAllDevices</key>\n <<true/false>/>\n <key>hasShownPref</key>\n <<true/false>/>\n </dict>\n </dict>\n\
    \ </array>\n</dict>\nNote: Using the Terminal and Profile Methods will not display in System Preferences,\nbut will disable\
    \ the underlying service."
