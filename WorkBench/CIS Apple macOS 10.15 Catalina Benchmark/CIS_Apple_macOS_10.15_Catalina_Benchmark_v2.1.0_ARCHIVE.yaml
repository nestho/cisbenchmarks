- id: 2.4.8
  title: Ensure File Sharing Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'File sharing from a user workstation creates additional risks, such as: • Open ports are created that can
    be probed and attacked • Passwords are attached to user accounts for access that may be exposed and endanger other parts
    of the organizational environment, including directory accounts • Increased complexity makes security more difficult and
    may expose additional attack vectors Apple''s File Sharing uses the Server Message Block (SMB) protocol to share to other
    computers that can mount SMB shares. This includes other macOS computers. Apple warns that SMB sharing stored passwords
    is less secure, and anyone with system access can gain access to the password for that account. When sharing with SMB,
    each user accessing the Mac must have SMB enabled. Storing passwords, especially copies of valid directory passwords,
    decrease security for the directory account and should not be used. Apple File Protocol (AFP) AFP automatically uses encrypted
    logins, so this method of sharing files is fairly secure. The entire hard disk is shared to administrator user accounts.
    Individual home folders are shared to their respective user accounts. Users'' "Public" folders (and the "Drop Box" folder
    inside) are shared to any user account that has sharing access to the computer (i.e. anyone in the "staff" group, including
    the guest account if it is enabled).'
  rationale: By disabling File Sharing, the remote attack surface and risk of unauthorized access to files stored on the system
    is reduced.
  impact: File Sharing can be used to share documents with other users, but hardened servers should be used rather than user
    endpoints. Turning on File Sharing increases the visibility and attack surface of a system unnecessarily.
  references: []
