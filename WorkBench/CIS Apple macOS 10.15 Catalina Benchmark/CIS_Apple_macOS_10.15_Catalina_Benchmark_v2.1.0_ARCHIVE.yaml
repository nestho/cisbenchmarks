- id: 5.1.5
  title: Ensure No World Writable Files Exist in the System Folder
  scoring: scored
  profile:
  - Level 1
  description: Software sometimes insists on being installed in the /System/Volumes/Data/System Directory and has inappropriate
    world-writable permissions. Macs with writable files in System should be investigated forensically. A file with open writable
    permissions is a sign of at best a rogue application. It could also be a sign of a computer compromise and a persistent
    presence on the system.
  rationale: Folders in /System/Volumes/Data/System should not be world-writable. The audit check excludes the "Drop Box"
    folder that is part of Apple's default user template.
  impact: Changing file permissions could disrupt the use of applications that rely on files in the System Folder with vulnerable
    permissions.
  references: []
  page_start: 241
  audit_raw: 'Run the following command to check for directories in the /System folder that are worldwritable:

    $ sudo /usr/bin/find /System/Volumes/Data/System -type d -perm -2 -ls

    If there is no output then it is complaint.

    example:

    $ sudo /usr/bin/find /System/Volumes/Data/System -type d -perm -2 -ls

    640774 0 drwx-wx-wx 3 root wheel 96

    Aug 9 2020 /System/Volumes/Data/System/Library/baddir'
  remediation: 'Run the following command to set permissions so that folders are not world-writable in

