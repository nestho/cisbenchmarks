- id: 5.2.7
  title: Ensure Password Age Is Configured
  scoring: scored
  profile:
  - Level 1
  description: Over time, passwords can be captured by third parties through mistakes, phishing attacks, third-party breaches,
    or merely brute-force attacks. To reduce the risk of exposure and to decrease the incentives of password reuse (passwords
    that are not forced to be changed periodically generally are not ever changed), users should reset passwords periodically.
    This control uses 365 days as the acceptable value. Some organizations may be more or less restrictive. This control mainly
    exists to mitigate against password reuse of the macOS account password in other realms that may be more prone to compromise.
    Attackers take advantage of exposed information to attack other accounts.
  rationale: Passwords should be changed periodically to reduce exposure.
  impact: Required password changes will lead to some locked computers requiring admin assistance.
  references: []
  page_start: 260
  audit_raw: 'Perform the following to ensure that the passwords expire after at most 365 days:

    Graphical Method:

    1. Open System Preferences

    2. Select Profiles

    3. Verify that an installed profile has Max Age (days) set to ≤ 365

    Terminal Method:

    Run the following command to verify that the password expires after at most 365 days:

    $ sudo /usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep -A1

    policyAttributeDaysUntilExpiration | /usr/bin/tail -1 | /usr/bin/cut -d''>'' -

    f2 | /usr/bin/cut -d ''<'' -f1

    The output should be ≤ 365

    or

    Run the following command to verify that a profile is installed that requires passwords to

    expire less than or equal to 365 days:

    $ sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep "maxPINAgeInDays"

    The output should include maxPINAgeInDays ≤ 365;'
  remediation: 'Perform the following to enable passwords expiring at no greater than 365 days:

    Terminal Method:

    Run the following command to require that passwords expire after at most 365 days:

    $ sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxMinutesUntilChangePassword=<value≤525600>"

    example:

    $ sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxMinutesUntilChangePassword=43200"

    Profile Method:

    1. Create or edit a configuration profile with the PayloadType of

    com.apple.mobiledevice.passwordpolicy

    2. Add the key maxPINAgeInDays

    3. Set the key to <integer><value≤365></integer>'
  checks:
