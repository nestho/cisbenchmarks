    severity: medium
- id: '10.16'
  title: Enable memory leak listener
  scoring: scored
  profile:
  - Level 1
  description: The JRE Memory Leak Prevention Listener provides work-arounds for known places where the Java Runtime environment
    uses the context class loader to load a singleton as this will cause a memory leak if a web application class loader happens
    to be the context class loader at the time. The work-around is to initialize these singletons when this listener starts
    as Tomcat's common class loader is the context class loader at that time. It also provides work-arounds for known issues
    that can result in locked JAR files.
  rationale: Enabling the JRE Memory Leak Prevention Listener provides work-arounds for preventing memory leaks.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0doc/config/listeners.html#JRE_Memory_Leak_Prevention_Listener__org.apache.catalina.core.JreMemoryLeakPreventionListener
  page_start: 140
  audit_raw: 'Ensure this line is present and not commented out in the

    $CATALINA_HOME/conf/server.xml:

    <Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionListener" />'
  remediation: 'Uncomment the JRE Memory Leak Prevention Listener in

    $CATALINA_HOME/conf/server.xml

    <Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionListener" />'
  checks:
  - type: manual_review
    info: 'Ensure this line is present and not commented out in the

      $CATALINA_HOME/conf/server.xml:

      <Listener

      className="org.apache.catalina.core.JreMemoryLeakPreventionListener" />'
    severity: medium
- id: '10.17'
  title: Setting Security Lifecycle Listener
  scoring: scored
  profile:
  - Level 1
  description: The Security Lifecycle Listener performs a number of security checks when Tomcat starts and prevents Tomcat
    from starting if they fail.
  rationale: When enabled, the Security Lifecycle Listener can • Enforce a blacklist of OS users that must not be used to
    start Tomcat. • Set the least restrictive umask before Tomcat start
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0doc/config/listeners.html#Security_Lifecycle_Listener__org.apache.catalina.security.SecurityListener
  page_start: 142
  audit_raw: 'Review server.xml to ensure the Security Lifecycle Listener element is uncommented

    with the checkedOsUsers and minimumUmask attributes set with expected values.'
  remediation: 'Uncomment the listener in $CATALINA_BASE/conf/server.xml. If the operating

    system supports umask then the line in $CATALINA_HOME/bin/catalina.sh that

    obtains the umask also needs to be uncommented.

    Within Server elements add:

    • checkedOsUsers: A comma separated list of OS users that must not be used to

    start Tomcat. If not specified, the default value of root is used.

    • minimumUmask: The least restrictive umask that must be configured before

    Tomcat will start. If not specified, the default value of 0007 is used.

    <Listener className="org.apache.catalina.security.SecurityListener"

    checkedOsUsers="alex,bob" minimumUmask="0007" />'
  checks:
  - type: manual_review
    info: 'Review server.xml to ensure the Security Lifecycle Listener element is uncommented

      with the checkedOsUsers and minimumUmask attributes set with expected values.'
    severity: medium
- id: '10.18'
  title: Use the logEffectiveWebXml and metadata-complete settings for deploying applications in production
  scoring: scored
  profile:
  - Level 1
  description: Both fragments and annotations give rise to security concerns. web.xml contains a metadata-complete attribute
    on the web-app element whose binary value defines whether other sources of metadata should be considered when deploying
    this web application, this includes annotations on class files (@WebServlet, but also @WebListener, @WebFilter, …), web-fragment.xml
    as well as classes located in WEB-INF/classes. In addition, Tomcat could allow you to log the effective web.xml, when
    an application starts, and the effective web.xml is the result of taking the main web.xml for your application merging
    in all the fragments applying all the annotations. By logging that, you are able to review it, and see if that is in fact
    what you actually want.
  rationale: Enable logEffectiveWebXml will allow you to log the effective web.xml and you are able to see if that is in fact
    what you actually want. Enable metadata-complete so that the web.xml is the only metadata considered.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/context.html
  - 2. https://alexismp.wordpress.com/2010/07/28/servlet-3-0-fragments-and-web-xmlto-rule-them-all/
  page_start: 144
  audit_raw: '1. Review each application’s web.xml file located in the applications

    $CATALINA_HOME/webapps/<app_name>/WEB-INF/web.xml and determine if

    the logEffectiveWebXml is property is set.

    <web-app

    ...

    metadata-complete="true"

    ...

    >

    2. Review each application’s context.xml file located in the applications

    $CATALINA_HOME/webapps/<app_name>/META-INF/context.xml and

    determine if the metadata-complete property is set.

    <Context

    ...

    logEffectiveWebXml="true"

    ...

    >'
  remediation: '• Set the metadata-complete value in the web.xml in each of the applications to

    true.

    Note: The metadata-complete option is not enough to disable all of annotation

    scanning. If there is a ServletContainerInitializer with a @HandlesTypes

    annotation, Tomcat has to scan your application for classes that use annotations

    or interfaces specified in that annotation.

    • Set the logEffectiveWebXml value in the context.xml in each of the

    application to true.'
  checks:
  - type: manual_review
    info: '1. Review each application’s web.xml file located in the applications

      $CATALINA_HOME/webapps/<app_name>/WEB-INF/web.xml and determine if

      the logEffectiveWebXml is property is set.

      <web-app

      ...

      metadata-complete="true"

      ...

      >

      2. Review each application’s context.xml file located in the applications

      $CATALINA_HOME/webapps/<app_name>/META-INF/context.xml and

      determine if the metadata-complete property is set.

      <Context

      ...

      logEffectiveWebXml="true"

      ...

      >'
    severity: medium
- id: '10.19'
  title: Ensure Manager Application Passwords are Encrypted
  scoring: manual
  profile:
  - Level 1
  description: Apache Tomcat ships with a Manager Application which requires users with a role of manager-gui, manager-status,
    manager-script, and/or manager-jmx to authenticate. The usernames and passwords to log onto the Manager Application are
    stored in the tomcat-users.xml in plain text by default.
  rationale: Storing passwords in plain text may allow users with access to read the tomcatusers.xml file to obtain the credentials
    of user who have been assigned roles for the Manager Application. This may allow for accounts to be compromised on Tomcat
    and elsewhere.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/managerhowto.html#Configuring_Manager_Application_Access
  - 2. https://tomcat.apache.org/tomcat-9.0doc/config/realm.html#Memory_Based_Realm__org.apache.catalina.realm.MemoryRealm
  page_start: 146
  audit_raw: 'Perform the following to determine if password digests are in use:

    $ grep -i <login-config>[.\n]*<auth-method>DIGEST</auth-method>[.\n]*<realmname>UserDatabase</realm-name>[.\n]*</login-config>

    $CATALINA_HOME/webapps/manager/WEB-INF/web.xml

    If a Realm exists without a digest attribute or without a value for the digest attribute,

    this is a fail.'
  remediation: "1. Generate the encrypted password:\ncd $CATALINA_HOME/bin\ndigest.bat -a sha-256 YOURPASSWORD\nThis will\
    \ return the original password followed by encrypted password:\nYOURPASSWORD:240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74\n\
    c720a9\n2. Replace the plain text password with the above encrypted password generated\nabove in CATALINA_HOME/conf/tomcat-user.xml\
    \ file as follows.\n<user username=\"admin\"\npassword=\"240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c72\n\
    0a9\"\nroles=\"manager-gui\"/>\n3. Add the digest element as a child to the login-config element where the\nrealm-name\
    \ element has a value of UserDatabase. For example:\n<login-config>\n <auth-method>DIGEST</auth-method>\n <realm-name>UserDatabase</realm-name>\n\
    </login-config>"
  checks:
  - type: manual_review
    info: 'Perform the following to determine if password digests are in use:

      $ grep -i <login-config>[.\n]*<auth-method>DIGEST</auth-method>[.\n]*<realmname>UserDatabase</realm-name>[.\n]*</login-config>

      $CATALINA_HOME/webapps/manager/WEB-INF/web.xml

      If a Realm exists without a digest attribute or without a value for the digest attribute,

      this is a fail.'
    severity: medium
