  rationale: Allowing crossContext creates the possibility for a malicious application to make requests to a restricted application.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/context.html
  page_start: 136
  audit_raw: 'Ensure the crossContext attribute in all context.xml does not exist or is set to false.

