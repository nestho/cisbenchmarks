    <Context ... crossContext=”false” />'
  checks:
  - type: manual_review
    info: 'Ensure the crossContext attribute in all context.xml does not exist or is set to false.

      # find . -name context.xml | xargs grep "crossContext"'
    severity: medium
- id: '10.15'
  title: Do not resolve hosts on logging valves
  scoring: scored
  profile:
  - Level 2
  description: Setting enableLookups to true on Connector will result in a DNS look-ups to obtain the host name of the remote
    client before logging any information. This uses additional resources when logging.
  rationale: Allowing enableLookups adds additional overhead to resolve the host name of a remote client which is rarely needed.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/valve.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 138
  audit_raw: 'Ensure Connector elements have the enableLookups attribute does not exist or is set

    to false.

    # grep enableLookups $CATALINA_HOME/conf/server.xml'
  remediation: 'In Connector elements, set the enableLookups attribute to false or remove it.

    <Connector ... enableLookups="false" />'
  checks:
  - type: manual_review
    info: 'Ensure Connector elements have the enableLookups attribute does not exist or is set

