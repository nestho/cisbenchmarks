  rationale: Altering the server.built string may make it harder for attackers to fingerprint which vulnerabilities affect
    the server platform.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Perform the following to determine if the server.built value has been changed:

    Extract the ServerInfo.properties file and examine the server.built attribute.

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    $ grep server.built org/apache/catalina/util/ServerInfo.properties'
  remediation: 'Perform the following to alter the server version string that gets displayed when clients

    connect to the server.

    1. Extract the ServerInfo.properties file from the catalina.jar file:

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    2. Navigate to the util directory that was created

    $ cd org/apache/Catalina/util

    3. Open ServerInfo.properties in an editor

    4. Update the server.built attribute in the ServerInfo.properties file.

    server.built=

    5. Update the catalina.jar with the modified ServerInfo.properties file.

    $ jar uf catalina.jar org/apache/catalina/util/ServerInfo.properties'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the server.built value has been changed:

      Extract the ServerInfo.properties file and examine the server.built attribute.

      $ cd $CATALINA_HOME/lib

      $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

      $ grep server.built org/apache/catalina/util/ServerInfo.properties'
    severity: medium
- id: '2.4'
  title: Disable X-Powered-By HTTP Header and Rename the Server Value for all Connectors
  scoring: scored
  profile:
  - Level 2
  description: The xpoweredBy setting determines if Apache Tomcat will advertise its presence via the X-Powered-By HTTP header.
    It is recommended that this value be set to false. The server attribute overrides the default value that is sent down
    in the HTTP header further masking Apache Tomcat.
  rationale: Preventing Tomcat from advertising its presence in this manner may increase the complexity for attackers to determine
    which vulnerabilities affect the server platform.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 28
  audit_raw: 'Perform the following to determine if the server platform, as advertised in the HTTP

    Server header, has been changed:

    1. Locate all Connector elements in $CATALINA_HOME/conf/server.xml.

    2. Ensure each Connector that has the xpoweredBy attribute does NOT have it set

    to true.'
  remediation: 'Perform the following to prevent Tomcat from advertising its presence via the XPoweredBy HTTP header.

    1. Add the xpoweredBy attribute to each Connector specified in

    $CATALINA_HOME/conf/server.xml. Set the xpoweredBy attributes value to

    false.

    <Connector

    ...

    xpoweredBy="false" />

    Alternatively, ensure the xpoweredBy attribute for each Connector specified in

    $CATALINA_HOME/conf/server.xml is absent.

    2. Add the server attribute to each Connector specified in

    $CATALINA_HOME/conf/server.xml. Set the server attribute value to anything

    except a blank string.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the server platform, as advertised in the HTTP

      Server header, has been changed:

      1. Locate all Connector elements in $CATALINA_HOME/conf/server.xml.

      2. Ensure each Connector that has the xpoweredBy attribute does NOT have it set

      to true.'
    severity: medium
- id: '2.5'
  title: Disable client facing Stack Traces
  scoring: scored
  profile:
  - Level 1
  description: When a runtime error occurs during request processing, Apache Tomcat will display debugging information to
    the requestor. It is recommended that such debug information be withheld from the requestor.
  rationale: Debugging information, such as that found in call stacks, often contains sensitive information which may be useful
    to an attacker. By preventing Tomcat from providing this information, the risk of leaking sensitive information to a potential
    attacker is reduced.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0doc/api/org/apache/tomcat/util/descriptor/web/ErrorPage.html
  page_start: 30
  audit_raw: 'Perform the following to determine if Tomcat is configured to prevent sending debug

    information to the requestor

    1. Ensure an <error-page> element is defined in

    $CATALINA_HOME/conf/web.xml.

    2. Ensure the <error-page> element has an <exception-type> child element

    with a value of java.lang.Throwable.

    3. Ensure the <error-page> element has a <location> child element.

    Note: Perform the above for each application hosted within Tomcat. Per application

    instances of web.xml can be found at $CATALINA_HOME/webapps/<app_name>/WEBINF/web.xml.'
  remediation: "Perform the following to prevent Tomcat from providing debug information to the\nrequestor during runtime\
    \ errors:\n1. Create a web page that contains the logic or message you wish to invoke when\nencountering a runtime error.\
    \ For example purposes, assume this page is\nlocated at /error.jsp.\n2. Add a child element, <error-page>, to the <web-app>\
    \ element, in the\n$CATALINA_HOME/conf/web.xml file.\n3. Add a child element, <exception-type>, to the <error-page> element.\
    \ Set the\nvalue of the <exception-type> element to java.lang.Throwable.\n4. Add a child element <location> to the <error-page>\
    \ element. Set the value of\nthe <location> element to the location of page created in step 1.\nThe resulting entry will\
    \ look as follows:\n<error-page>\n <exception-type>java.lang.Throwable</exception-type>\n <location>/error.jsp</location>\n\
    </error-page>"
  checks:
  - type: manual_review
    info: 'Perform the following to determine if Tomcat is configured to prevent sending debug

      information to the requestor

      1. Ensure an <error-page> element is defined in

      $CATALINA_HOME/conf/web.xml.

      2. Ensure the <error-page> element has an <exception-type> child element

      with a value of java.lang.Throwable.

      3. Ensure the <error-page> element has a <location> child element.

      Note: Perform the above for each application hosted within Tomcat. Per application

      instances of web.xml can be found at $CATALINA_HOM'
    severity: medium
- id: '2.6'
  title: Turn off TRACE
  scoring: scored
  profile:
  - Level 1
  description: The HTTP TRACE verb provides debugging and diagnostics information for a given request.
  rationale: Diagnostic information, such as that found in the response to a TRACE request, often contains sensitive information
    which may useful to an attacker. By preventing Tomcat from providing this information, the risk of leaking sensitive information
    to a potential attacker is reduced.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 32
  audit_raw: 'Perform the following to determine if the server platform, as advertised in the HTTP

    Server header, has been changed:

    1. Locate all Connector elements in $CATALINA_HOME/conf/server.xml.

    2. Ensure each Connector does not have an allowTrace attribute or, if present,

    the allowTrace attribute is NOT set true.

    Perform the following for each application hosted within Tomcat with a web-app root

    element in the web.xml:

    1. Locate each application instance of web.xml in

    $CATALINA_HOME/webapps/<app_name>/WEB-INF/web.xml.

    2. Ensure a security-constraint/web-resource-collection exists the child

    value pairings:

    1. web-resource-name with a value of restricted methods.

    2. url-pattern with a value of /*.

    3. http-method with a value of TRACE.'
  remediation: "Perform the following to prevent Tomcat from accepting a TRACE request:\n1. Set the allowTrace attribute for\
    \ each Connector specified in\n$CATALINA_HOME/conf/server.xml to false.\n<Connector ... allowTrace=\"false\" />\nAlternatively,\
    \ ensure the allowTrace attribute is absent from each Connector\nspecified in $CATALINA_HOME/conf/server.xml.\n2. Add\
    \ the following as a child of the web-app root element, if present, in each web\napplications web.xml:\n<security-constraint>\n\
    \ <web-resource-collection>\n <web-resource-name>restricted methods</web-resource-name>\n ...\n <http-method>TRACE</http-method>\n\
    \ ...\n </web-resource-collection>\n ...\n</security-constraint>"
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the server platform, as advertised in the HTTP

      Server header, has been changed:

      1. Locate all Connector elements in $CATALINA_HOME/conf/server.xml.

      2. Ensure each Connector does not have an allowTrace attribute or, if present,

      the allowTrace attribute is NOT set true.

      Perform the following for each application hosted within Tomcat with a web-app root

      element in the web.xml:

      1. Locate each application instance of web.xml in

      $CATALINA_HOME/webapps/<app_name>/W'
    severity: medium
- id: '2.7'
  title: Ensure Sever Header is Modified To Prevent Information Disclosure
  scoring: scored
  profile:
  - Level 2
  description: The server header is a vanity header developed to help identify the underlying technology in a server for troubleshooting
    and identification. This header is unnecessary and could be used to target your website for exploitation. Tomcat does
    not provide the ability to remove the server header, however, it does provide the ability to modify the header.
  rationale: The server header may specify the underlying technology used by an application. Attackers are able to conduct
    reconnaissance on a website using these response headers. This header could be used to target attacks for specific known
    vulnerabilities associated with the underlying technology. Removing this header will prevent targeting of your application
    for specific exploits by non-determined attackers. While this is not the only way to fingerprint a site through the response
    headers, it makes it harder and prevents some potential attackers from targeting your website.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/security-howto.html#server.xml
  - 2. https://stackoverflow.com/questions/52637285/replacing-server-header-intomcat-with-sed
  page_start: 34
  audit_raw: 'In $CATALINA_HOME/conf/server.xml, check for the server directive as shown below.

    If the directive is not present or the directive specifies something revealing on the

    underlying infrastructure then the server header should be changed.

    <Connector port="8443" server=”Apache" redirectPort="8080" />'
  remediation: 'In $CATALINA_HOME/conf/server.xml, add the server directive to the connector as

    shown below replacing apache with the text of your choosing. This text should not help

    in identifying the server.

    <Connector port="8443" server=”I am a teapot" redirectPort="8080" />

    Scripted:

    • If you do not have the header defined:

    sed -ir ''s/Connector/Connector server=”I am a teapot"/g''

    $CATALINA_HOME/conf/server.xml

    • If you already have a header but it is still revealing

    sed -ir ''s/server="[^"]*"/server="I Am A Teapot"/g''

    $CATALINA_HOME/conf/server.xml'
  checks:
  - type: manual_review
    info: 'In $CATALINA_HOME/conf/server.xml, check for the server directive as shown below.

      If the directive is not present or the directive specifies something revealing on the

      underlying infrastructure then the server header should be changed.

      <Connector port="8443" server=”Apache" redirectPort="8080" />'
    severity: medium
- id: '3.1'
  title: Set a nondeterministic Shutdown command value
  scoring: scored
  profile:
  - Level 1
  description: Tomcat listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending the SHUTDOWN
    command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it is bound to
    the loopback interface. It is recommended that a nondeterministic value be set for the shutdown attribute in $CATALINA_HOME/conf/server.xml.
  rationale: Setting the shutdown attribute to a nondeterministic value will prevent malicious local users from shutting down
    Tomcat.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/server.html
  page_start: 37
  audit_raw: 'Perform the following to determine if the shutdown port is configured to use the default

    shutdown command:

    Ensure the shutdown attribute in $CATALINA_HOME/conf/server.xml is not set to

    SHUTDOWN.

    $ cd $CATALINA_HOME/conf

    $ grep ''shutdown[[:space:]]*=[[:space:]]*"SHUTDOWN"'' server.xml'
  remediation: 'Perform the following to set a nondeterministic value for the shutdown attribute.

    Update the shutdown attribute in $CATALINA_HOME/conf/server.xml as follows:

    <Server port="8005" shutdown="NONDETERMINISTICVALUE">

    Note: NONDETERMINISTICVALUE should be replaced with a sequence of random

    characters.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the shutdown port is configured to use the default

      shutdown command:

      Ensure the shutdown attribute in $CATALINA_HOME/conf/server.xml is not set to

      SHUTDOWN.

      $ cd $CATALINA_HOME/conf

      $ grep ''shutdown[[:space:]]*=[[:space:]]*"SHUTDOWN"'' server.xml'
    severity: medium
- id: '3.2'
  title: Disable the Shutdown port
  scoring: scored
  profile:
  - Level 2
  description: Tomcat listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending the SHUTDOWN
    command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it is bound to
    the loopback interface. If this functionality is not used, it is recommended that the shutdown port be disabled.
  rationale: Disabling the Shutdown port will eliminate the risk of malicious local entities using the shutdown command to
    disable the Tomcat server.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/server.html
  page_start: 39
  audit_raw: 'Perform the following to determine if the shutdown port has been disabled:

    Ensure the port attribute in $CATALINA_HOME/conf/server.xml is set to -1.

    $ cd $CATALINA_HOME/conf/

    $ grep ''<Server[[:space:]]\+[^>]*port[[:space:]]*=[[:space:]]*"-1"''

    server.xml'
  remediation: 'Set the port to -1 in the $CATALINA_HOME/conf/server.xml to disable the shutdown

    port:

    <Server port="-1" shutdown="SHUTDOWN">'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the shutdown port has been disabled:

      Ensure the port attribute in $CATALINA_HOME/conf/server.xml is set to -1.

      $ cd $CATALINA_HOME/conf/

      $ grep ''<Server[[:space:]]\+[^>]*port[[:space:]]*=[[:space:]]*"-1"''

      server.xml'
    severity: medium
- id: '4.1'
  title: Restrict access to $CATALINA_HOME
  scoring: scored
  profile:
  - Level 1
  description: $CATALINA_HOME is the environment variable which holds the path to the root Tomcat directory. It is important
    to protect access to this in order to protect the Tomcat binaries and libraries from unauthorized modification. It is
    recommended that the ownership of $CATALINA_HOME be tomcat_admin:tomcat. It is also recommended that the permission on
    $CATALINA_HOME block read, write, and execute for the world (o-rwx) and block write access to the group (g-w).
  rationale: The security of processes and data which traverse or depend on Tomcat may become compromised if the $CATALINA_HOME
    is not secured.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Perform the following to ensure the permission on the $CATALINA_HOME directory

    prevent unauthorized modification.

    $ cd $CATALINA_HOME

    $ find . -follow -maxdepth 0 \( -perm /o+rwx,g=w -o ! -user tomcat_admin -o !

    -group tomcat \) -ls

    The above command should not produce any output.'
  remediation: 'Perform the following to establish the recommended state:

    1. Set the ownership of the $CATALINA_HOME to tomcat_admin:tomcat.

    # chown tomcat_admin.tomcat $CATALINA_HOME

    2. Remove write permissions for the group and read, write, and execute

    permissions for the world

    # chmod g-w,o-rwx $CATALINA_HOME'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the permission on the $CATALINA_HOME directory

      prevent unauthorized modification.

      $ cd $CATALINA_HOME

      $ find . -follow -maxdepth 0 \( -perm /o+rwx,g=w -o ! -user tomcat_admin -o !

      -group tomcat \) -ls

      The above command should not produce any output.'
    severity: medium
- id: '4.2'
  title: Restrict access to $CATALINA_BASE
  scoring: scored
  profile:
  - Level 1
  description: $CATALINA_BASE is the environment variable that specifies the base directory which most relative paths are
    resolved. $CATALINA_BASE is usually used when there are multiple instances of Tomcat running. It is important to protect
    access to this in order to protect the Tomcat-related binaries and libraries from unauthorized modification. It is recommended
    that the ownership of $CATALINA_BASE be tomcat_admin:tomcat. It is also recommended that the permission on $CATALINA_BASE
    block read, write, and execute for the world (o-rwx) and block write access to the group (g-w).
  rationale: The security of processes and data which traverse or depend on Tomcat may become compromised if the $CATALINA_BASE
    is not secured.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Perform the following to ensure the permission on the $CATALINA_BASE directory

    prevent unauthorized modification.

    $ cd $CATALINA_BASE

    $ find . -follow -maxdepth 0 \( -perm /o+rwx,g=w -o ! -user tomcat_admin -o !

    -group tomcat \) -ls

    The above command should not produce any output.'
  remediation: 'Perform the following to establish the recommended state:

    1. Set the ownership of the $CATALINA_BASE to tomcat_admin:tomcat.

    # chown tomcat_admin.tomcat $CATALINA_BASE

    2. Remove write permissions for the group and read, write, and execute

    permissions for the world

    # chmod g-w,o-rwx $CATALINA_BASE'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the permission on the $CATALINA_BASE directory

      prevent unauthorized modification.

      $ cd $CATALINA_BASE

      $ find . -follow -maxdepth 0 \( -perm /o+rwx,g=w -o ! -user tomcat_admin -o !

      -group tomcat \) -ls

      The above command should not produce any output.'
    severity: medium
- id: '4.3'
  title: Restrict access to Tomcat configuration directory
  scoring: scored
  profile:
  - Level 1
  description: The Tomcat $CATALINA_HOME/conf directory contains Tomcat configuration files. It is recommended that the ownership
    of this directory be tomcat_admin:tomcat. It is also recommended that the permissions on this directory deny read, write,
    and execute for the world (o-rwx) and deny write access to the group (g-w).
  rationale: Restricting access to these directories will prevent local users from maliciously or inadvertently altering Tomcat’s
    configuration.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'Perform the following to determine if the ownership and permissions on

    $CATALINA_HOME/conf are securely configured.

    # cd $CATALINA_HOME/conf

    # find . -maxdepth 0 \( -perm /o+rwx,g=w -o ! -user tomcat_admin -o ! -group

    tomcat \) -ls

