- id: '6.3'
  title: Ensure scheme is set accurately
  scoring: scored
  profile:
  - Level 1
  description: The scheme attribute is used to indicate to callers of request.getScheme() which scheme is in use by the Connector.
    Ensure the scheme attribute is set to http for Connectors operating over HTTP. Ensure the scheme attribute is set to https
    for Connectors operating over HTTPS.
  rationale: Maintaining parity between the scheme in use by the Connector and advertised by request.getScheme() will ensure
    applications built on Tomcat have an accurate depiction of the context and security guarantees provided to them.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/ssl-howto.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
