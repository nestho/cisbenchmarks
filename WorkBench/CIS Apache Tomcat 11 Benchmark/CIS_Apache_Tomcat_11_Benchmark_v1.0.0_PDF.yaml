- id: '7.5'
  title: Ensure pattern in context.xml is correct
  scoring: scored
  profile:
  - Level 1
  description: The pattern setting informs Tomcat what information should be logged per application. At a minimum, enough
    information to uniquely identify a request, what was requested, where the requested originated from, and when the request
    occurred should be logged. The following will log the request date and time (%t), the requested URL (%U), the remote IP
    address (%a), the local IP address (%A), the request method (%m), the local port (%p), query string, if present, (%q),
    and the HTTP status code of the response (%s). pattern="%t %U %a %A %m %p %q %s”
  rationale: The level of logging detail prescribed will assist in identifying correlating security events or incidents.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/valve.html
  page_start: 97
