controls:
- id: '1.1'
  title: Remove extraneous files and directories
  scoring: manual
  profile:
  - Level 2
  description: The installation may provide example applications, documentation, and other directories which may not serve
    a production use.
  rationale: Removing sample resources is a defense in depth measure that reduces potential exposures introduced by these
    resources.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/securityhowto.html#Default_web_applications/General
  page_start: 17
  audit_raw: "Perform the following to determine the existence of extraneous resources:\n$ ls -l $CATALINA_HOME/webapps/examples\
    \ \\\n $CATALINA_HOME/webapps/docs \\\n $CATALINA_HOME/webapps/ROOT \\\n $CATALINA_HOME/webapps/host-manager \\\n $CATALINA_HOME/webapps/manager\n\
    No output implies no sample resources are present."
  remediation: "Perform the following to remove extraneous resources:\n$ rm -rf $CATALINA_HOME/webapps/docs \\\n $CATALINA_HOME/webapps/examples\
    \ \\\n $CATALINA_HOME/webapps/ROOT\nIf the Manager and HOST-Manager application are not utilized, also remove the\nfollowing\
    \ resources:\n$ rm –rf $CATALINA_HOME/webapps/host-manager \\\n $CATALINA_HOME/webapps/manager"
  checks:
  - type: manual_review
    info: "Perform the following to determine the existence of extraneous resources:\n$ ls -l $CATALINA_HOME/webapps/examples\
      \ \\\n $CATALINA_HOME/webapps/docs \\\n $CATALINA_HOME/webapps/ROOT \\\n $CATALINA_HOME/webapps/host-manager \\\n $CATALINA_HOME/webapps/manager\n\
      No output implies no sample resources are present."
    severity: medium
- id: '1.2'
  title: Disable Unused Connectors
  scoring: manual
  profile:
  - Level 2
  description: The default installation of Tomcat includes connectors with default settings. These are traditionally set up
    for convenience. It is best to remove these connectors and enable only what is needed.
  rationale: Improperly configured or unnecessarily installed Connectors may lead to a security exposure.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/security-howto.html#Connectors
  page_start: 19
  audit_raw: 'Execute the following command to find configured Connectors. Ensure only those

    required are present and not commented out:

    $ grep “Connector” $CATALINA_HOME/conf/server.xml'
  remediation: 'Within the $CATALINA_HOME/conf/server.xml, remove, or comment out, each unused

    Connector. For example, to disable an instance of the HTTPConnector, remove the

    following:

    <Connector className="org.apache.catalina.connector.http.HttpConnector"

    ...

    connectionTimeout="60000"/>'
  checks:
  - type: manual_review
    info: 'Execute the following command to find configured Connectors. Ensure only those

      required are present and not commented out:

      $ grep “Connector” $CATALINA_HOME/conf/server.xml'
    severity: medium
- id: '2.1'
  title: Alter the Advertised server.info String
  scoring: manual
  profile:
  - Level 2
  description: The server.info attribute contains the name of the application service. This value is presented to Tomcat clients
    when clients connect to the tomcat server.
  rationale: Altering the server.info attribute may increase the complexity for attackers to determine which vulnerabilities
    affect the server platform.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/Securing_tomcat
  page_start: 22
  audit_raw: 'Perform the following to determine if the server.info value has been changed:

    Extract the ServerInfo.properties file and examine the server.info attribute.

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    $ grep server.info org/apache/catalina/util/ServerInfo.properties'
  remediation: 'Perform the following to alter the server platform string that gets displayed when clients

    connect to the tomcat server.

    1. Extract the ServerInfo.properties file from the catalina.jar file:

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    2. Navigate to the util directory that was created

    cd org/apache/catalina/util

    3. Open ServerInfo.properties in an editor

    4. Update the server.info attribute in the ServerInfo.properties file.

    server.info=<SomeWebServer>

    5. Update the catalina.jar with the modified ServerInfo.properties file.

    $ jar uf catalina.jar org/apache/catalina/util/ServerInfo.properties'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the server.info value has been changed:

      Extract the ServerInfo.properties file and examine the server.info attribute.

      $ cd $CATALINA_HOME/lib

      $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

      $ grep server.info org/apache/catalina/util/ServerInfo.properties'
    severity: medium
- id: '2.2'
  title: Alter the Advertised server.number String
  scoring: manual
  profile:
  - Level 2
  description: The server.number attribute represents the specific version of Tomcat that is executing. This value is presented
    to Tomcat clients when connect.
  rationale: Advertising a valid server version may provide attackers with information useful for locating vulnerabilities
    that affect the server platform. Altering the server version string may increase the complexity for attackers to determine
    which vulnerabilities affect the server platform.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Perform the following to determine if the server.number value has been changed:

    Extract the ServerInfo.properties file and examine the server.number attribute.

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    $ grep server.number org/apache/catalina/util/ServerInfo.properties'
  remediation: 'Perform the following to alter the server version string that gets displayed when clients

    connect to the server.

    1. Extract the ServerInfo.properties file from the catalina.jar file:

    $ cd $CATALINA_HOME/lib

    $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

    2. Navigate to the util directory that was created

    $ cd org/apache/Catalina/util

    3. Open ServerInfo.properties in an editor

    4. Update the server.number attribute

    server.number=<someversion>

    5. Update the catalina.jar with the modified ServerInfo.properties file.

    $ jar uf catalina.jar org/apache/catalina/util/ServerInfo.properties'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the server.number value has been changed:

      Extract the ServerInfo.properties file and examine the server.number attribute.

      $ cd $CATALINA_HOME/lib

      $ jar xf catalina.jar org/apache/catalina/util/ServerInfo.properties

      $ grep server.number org/apache/catalina/util/ServerInfo.properties'
    severity: medium
- id: '2.3'
  title: Alter the Advertised server.built Date
  scoring: manual
  profile:
  - Level 2
  description: The server.built date represents the date which Tomcat was compiled and packaged. This value is presented to
