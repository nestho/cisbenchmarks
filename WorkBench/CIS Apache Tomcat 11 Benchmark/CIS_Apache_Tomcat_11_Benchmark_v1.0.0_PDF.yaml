- id: '10.1'
  title: Ensure Web content directory is on a separate partition from the Tomcat system files
  scoring: manual
  profile:
  - Level 1
  description: Store web content on a separate partition from Tomcat system files.
  rationale: The web document directory is where the files which are served to the end user reside. In the past, directory
    traversal exploits have allowed malicious users to wreak havoc on a web server including executing code, uploading files,
    and reading sensitive data. Even if you do not have any directory traversal exploits in your server or code at this time,
    that doesn’t mean they won’t be introduced in the future. Moving your web document directory onto a different partition
    will prevent these kinds of attacks from doing more damage to other parts of the file system.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'Locate the Tomcat system files and web content directory. Review the system partitions

    and ensure the system files and web content directory are on separate partitions.

    # df $CATALINA_HOME/webapps

    # df $CATALINA_HOME

    Note: Use the default value webapps which is defined by appBase attribute here.'
  remediation: 'Move the web content files to a separate partition from the tomcat system files and

    update your configuration.'
  checks:
  - type: manual_review
    info: 'Locate the Tomcat system files and web content directory. Review the system partitions

      and ensure the system files and web content directory are on separate partitions.

      # df $CATALINA_HOME/webapps

      # df $CATALINA_HOME

      Note: Use the default value webapps which is defined by appBase attribute here.'
    severity: medium
