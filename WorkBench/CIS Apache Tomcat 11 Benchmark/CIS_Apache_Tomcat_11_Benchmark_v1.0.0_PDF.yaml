    directory="$CATALINA_HOME/logs/" prefix="access_log" fileDateFormat="yyyy-MMdd.HH" suffix=".log"

    pattern="%h %t %H cookie:%{SESSIONID}c request:%{SESSIONID}r %m %U %s %q %r"

