- id: '10.6'
  title: Enable strict servlet Compliance
  scoring: manual
  profile:
  - Level 2
  description: The STRICT_SERVLET_COMPLIANCE influences Tomcat’s behavior in several subtle ways. See the References below
    for the complete list. It is recommended that STRICT_SERVLET_COMPLIANCE be set to true.
  rationale: When STRICT_SERVLET_COMPLIANCE is set to true, Tomcat will always send an HTTP Content-type header when responding
    to requests. This is significant as the behavior of web browsers is inconsistent in the absence of the Content-type header.
    Some browsers will attempt to determine the appropriate content-type by sniffing
  impact: Changing this to true will change a number of other default values which is likely to break the majority of systems
    as some browsers are unable to correctly handle the cookie headers that result from a strict adherence to the specifications.
    Please refer to the referenced documentation for a complete list of changed values. Defaults, regardless of whether or
    not they have been changed by setting org.apache.catalina.STRICT_SERVLET_COMPLIANCE can always be overridden by explicitly
    setting the appropriate system property or element attribute.
  references:
  - 1. http://tomcat.apache.org/tomcat-9.0-doc/config/systemprops.html
  page_start: 120
  audit_raw: 'Ensure the -Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE=true parameter

    is added to the startup script which by default is located at

    $CATALINA_HOME/bin/catalina.sh.'
  remediation: 'Start Tomcat with strict compliance enabled, add -

    Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE=true to your startup script.'
  checks:
  - type: manual_review
    info: 'Ensure the -Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE=true parameter

      is added to the startup script which by default is located at

      $CATALINA_HOME/bin/catalina.sh.'
    severity: medium
- id: '10.7'
  title: Turn off session facade recycling
  scoring: manual
  profile:
  - Level 1
  description: The RECYCLE_FACADES can specify if a new facade will be created for each request. If a new facade is not created
    there is a potential for information leakage from other sessions.
  rationale: When RECYCLE_FACADES is set to false, Tomcat will recycle the session facade between requests which may result
    in information leakage.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/systemprops.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/security-howto.html
  page_start: 122
  audit_raw: 'Ensure -Dorg.apache.catalina.connector.RECYCLE_FACADES=true is added to the

    startup script which, by default, is located at $CATALINA_HOME/bin/catalina.sh.'
  remediation: 'Start Tomcat with RECYCLE_FACADES set to true. Add -

    Dorg.apache.catalina.connector.RECYCLE_FACADES=true to your startup script.'
  checks:
  - type: manual_review
    info: 'Ensure -Dorg.apache.catalina.connector.RECYCLE_FACADES=true is added to the

      startup script which, by default, is located at $CATALINA_HOME/bin/catalina.sh.'
    severity: medium
- id: '10.8'
  title: Do not allow additional path delimiters
  scoring: manual
  profile:
  - Level 2
  description: Being able to specify different path-delimiters on Tomcat creates the possibility that an attacker can access
    applications that were previously blocked by a proxy like mod_proxy.
  rationale: Allowing additional path-delimiters allows for an attacker to get to an application or area which was not previously
    visible.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/systemprops.html
  page_start: 124
  audit_raw: 'Ensure the -

    Dorg.apache.catalina.connector.CoyoteAdapter.ALLOW_BACKSLASH=false and

    -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=false

    parameters are added to the startup script which, by default, is located at

    $CATALINA_HOME/bin/catalina.sh.'
  remediation: 'To start Tomcat with ALLOW_BACKSLASH and ALLOW_ENCODED_SLASH set to false, add

    -Dorg.apache.catalina.connector.CoyoteAdapter.ALLOW_BACKSLASH=false and

    -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=false to your

    startup script in setenv.sh in CATALINA_BASE/bin.'
  checks:
  - type: manual_review
    info: 'Ensure the -

      Dorg.apache.catalina.connector.CoyoteAdapter.ALLOW_BACKSLASH=false and

      -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=false

      parameters are added to the startup script which, by default, is located at

      $CATALINA_HOME/bin/catalina.sh.'
    severity: medium
- id: '10.9'
  title: Configure connectionTimeout
  scoring: scored
  profile:
  - Level 2
  description: The connectionTimeout setting allows Tomcat to close idle sockets after a specific amount of time to save system
    resources.
  rationale: Closing idle sockets reduces system resource usage which can provide better performance and help protect against
    Denial of Service attacks.
  impact: This timeout will also apply when reading any request body when disableUploadTimeout is not set to false.
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 126
  audit_raw: 'Locate each connectionTimeout setting in $CATALINA_HOME/conf/server.xml and

    verify the setting is correct.

    # grep connectionTimeout $CATALINA_HOME/conf/server.xml'
  remediation: 'Set the connectionTimeout for each connector in

    $CATALINA_HOME/conf/server.xml ensure to the optimal number of milliseconds

    based on hardware resources, load, and number of concurrent connections.

    connectionTimeout="60000"'
  checks:
  - type: manual_review
    info: 'Locate each connectionTimeout setting in $CATALINA_HOME/conf/server.xml and

      verify the setting is correct.

      # grep connectionTimeout $CATALINA_HOME/conf/server.xml'
    severity: medium
- id: '10.10'
  title: Configure maxHttpHeaderSize
  scoring: scored
  profile:
  - Level 2
  description: The maxHttpHeaderSize limits the size of the request and response headers defined in bytes.
  rationale: Limiting the size of the header request can help protect against Denial of Service (DoS) requests.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 128
  audit_raw: 'Locate each maxHttpHeaderSize setting in $CATALINA_HOME/conf/server.xml and

    verify that they are set to 8192.

    # grep maxHttpHeaderSize $CATALINA_HOME/conf/server.xml'
  remediation: 'Set maxHttpHeaderSize for each connector in $CATALINA_HOME/conf/server.xml to

    the appropriate setting.

    maxHttpHeaderSize=”8192”'
  checks:
  - type: manual_review
    info: 'Locate each maxHttpHeaderSize setting in $CATALINA_HOME/conf/server.xml and

      verify that they are set to 8192.

      # grep maxHttpHeaderSize $CATALINA_HOME/conf/server.xml'
    severity: medium
- id: '10.11'
  title: Force SSL for all applications
  scoring: scored
  profile:
  - Level 2
  description: Use the transport-guarantee attribute to ensure SSL protection when accessing all applications. This can be
    overridden on a per application basis in the application configuration.
  rationale: 'By default, when accessing applications SSL will be enforced to protect information sent over the network. By
    using the transport-guarantee attribute within web.xml, SSL is enforced. Note: This requires SSL to be configured.'
  impact: If the data protection level is set to INTEGRAL or CONFIDENTIAL, and the client is not already using SSL, then the
    client is redirected to the same URI, but using port 443 or the port defined for the redirectPort attribute in the <Connector>
    element in server.xml.
  references:
  - 1. https://www.owasp.org/index.php/Securing_tomcat
  page_start: 130
  audit_raw: 'Ensure $CATALINA_HOME/conf/web.xml has the transport-guarantee attribute set

    to CONFIDENTIAL.

    # grep transport-guarantee $CATALINA_HOME/conf/web.xml'
  remediation: "Set transport-guarantee to CONFIDENTIAL in $CATALINA_HOME/conf/web.xml:\n<user-data-constraint>\n <transport-guarantee>CONFIDENTIAL</transport-guarantee>\n\
    </user-data-constraint>"
  checks:
  - type: manual_review
    info: 'Ensure $CATALINA_HOME/conf/web.xml has the transport-guarantee attribute set

      to CONFIDENTIAL.

      # grep transport-guarantee $CATALINA_HOME/conf/web.xml'
    severity: medium
- id: '10.12'
  title: Do not allow symbolic linking
  scoring: scored
  profile:
  - Level 1
  description: Symbolic links permit one application to include the libraries from another. This allows for re-use of code
    but also allows for potential security issues when applications include libraries from other applications to which they
    should not have access.
  rationale: Allowing symbolic links makes Tomcat susceptible to directory traversal vulnerability. Also, there is a potential
    that an application could link to another application to which it should not be linking. On case-insensitive operating
    systems there is also the threat of source code disclosure.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/resources.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/config/context.html
  page_start: 132
  audit_raw: 'Ensure the allowLinking attribute in all context.xml does not exist or is set to false.

    # find . -name context.xml | xargs grep "allowLinking"'
  remediation: "In all context.xml, set the allowLinking attribute to false:\n<Context\n...\n <Resources ... allowLinking=”false”\
    \ />\n...\n</Context>"
  checks:
  - type: manual_review
    info: 'Ensure the allowLinking attribute in all context.xml does not exist or is set to false.

      # find . -name context.xml | xargs grep "allowLinking"'
    severity: medium
- id: '10.13'
  title: Do not run applications as privileged
  scoring: scored
  profile:
  - Level 1
  description: Setting the privileged attribute for an application changes the class loader to the Server class loader instead
    of the Shared class loader.
  rationale: Running an application in privileged mode allows an application to load the manager libraries.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/context.html
  page_start: 134
  audit_raw: 'Ensure the privileged attribute in each context.xml file does not exist or is set to

    false.

    # find . -name context.xml | xargs grep "privileged"'
  remediation: 'Set the privileged attribute in all context.xml files to false unless it is required as

    for the manager application:

    <Context ... privileged=”false” />'
  checks:
  - type: manual_review
    info: 'Ensure the privileged attribute in each context.xml file does not exist or is set to

      false.

      # find . -name context.xml | xargs grep "privileged"'
    severity: medium
- id: '10.14'
  title: Do not allow cross context requests
  scoring: scored
