- id: '6.5'
  title: Ensure 'sslProtocol' is Configured Correctly for Secure Connectors
  scoring: scored
  profile:
  - Level 1
  description: The TLSv1.0 and TLSv1.1 protocols should be disabled via the sslProtocol directive. The TLSv1.0 protocol is
    vulnerable to information disclosure and both protocols lack support for modern cryptographic algorithms including authenticated
    encryption. The only SSL/TLS protocols which should be allowed are TLSv1.2 and the newer TLSv1.3 protocol.
  rationale: The TLSv1.0 protocol is vulnerable to the BEAST attack when used in CBC mode (October 2011). Unfortunately, the
    TLSv1.0 uses CBC modes for all of the block mode ciphers, which only leaves the RC4 streaming cipher which is also weak
    and is not recommended. Therefore, it is recommended that the TLSv1.0 protocol be disabled. The TLSv1.1 protocol does
    not support Authenticated Encryption with Associated Data (AEAD) which is designed to simultaneously provide confidentiality,
    integrity, and authenticity. All major up-to-date browsers support TLSv1.2, and most recent versions of FireFox and Chrome
    support the newer TLSv1.3 protocol, since 2017. The NIST SP 800-52r2 guidelines for TLS configuration require that TLS
    1.2 is configured with FIPS-based cipher suites be supported by all government TLS servers and clients and requires support
    of TLS 1.3 by January 1, 2024. A September 2018 IETF draft also depreciates the usage of TLSv1.0 and TLSv1.1 as shown
    in the references. As of March 2020 all major browsers will no longer support TLS 1.0 or TLS 1.1.
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/ssl-howto.html
  - 2. https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  page_start: 86
  audit_raw: 'Review server.xml to ensure the sslProtocol attribute is set to TLSv1.2, TLSv1.3,

    or TLSv1.2+TLSv1.3 for all Connectors having SSLEnabled set to true.'
  remediation: 'In server.xml, set the sslProtocol attribute to TLSv1.2+TLSv1.3 for Connectors

    having SSLEnabled set to true.

    <Connector

    …

    sslProtocol="TLSv1.2+TLSv1.3"

    …

    />'
  checks:
  - type: manual_review
    info: 'Review server.xml to ensure the sslProtocol attribute is set to TLSv1.2, TLSv1.3,

      or TLSv1.2+TLSv1.3 for all Connectors having SSLEnabled set to true.'
    severity: medium
- id: '7.1'
  title: Application specific logging
  scoring: scored
  profile:
  - Level 2
  description: By default, java.util.logging does not provide the capabilities to configure per-web application settings,
    only per VM. In order to overcome this limitation Tomcat implements JULI as a wrapper for java.util.logging. JULI provides
    additional configuration functionality so you can set each web application with different logging specifications.
  rationale: Establishing per application logging profiles will help ensure that each application’s logging verbosity is set
    to an appropriate level in order to provide appropriate information when needed for security review.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Ensure a logging.properties file is located at

    $CATALINA_BASE/webapps/<app_name>/WEB-INF/classes.'
  remediation: 'Create a logging.properties file and place that into your application WEBINF/classes directory.

    Note: By default, installing Tomcat places a logging.properties file in

    $CATALINA_HOME/conf. This file can be used as base for an application specific logging

    properties file'
  checks:
  - type: manual_review
    info: 'Ensure a logging.properties file is located at

      $CATALINA_BASE/webapps/<app_name>/WEB-INF/classes.'
    severity: medium
- id: '7.2'
  title: Specify file handler in logging.properties files
  scoring: scored
  profile:
  - Level 1
  description: Handlers specify where log messages are sent. Console handlers send log messages to the Java console and File
    handlers specify logging to a file.
  rationale: Utilizing file handlers will ensure that security event information is persisted to disk.
  impact: Configuring logging to debug logging, i.e. FINEST or ALL, can generate large amounts of information which may impact
    server performance.
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/logging.html
  page_start: 91
  audit_raw: 'Review each application’s logging.properties file located in the applications

    $CATALINA_BASE/webapps/<app_name>/WEB-INF/classes directory and determine if

    the file handler properties are set.

    $ grep handlers \

    $ CATALINA_BASE/webapps/<app_name>/WEB-INF/classes/logging.properties

    In the instance where an application specific logging has not been created, the

    logging.properties file will be located in $CATALINA_BASE/conf

    $ grep handlers $CATALINA_BASE/conf/logging.properties'
  remediation: 'Add the following entries, replacing <file_handler> with either FileHandler or

    AsyncFileHandler, to your logging.properties file if they do not exist.

    handlers=1catalina.org.apache.juli.<file_handler>,

    2localhost.org.apache.juli.<file_handler>,

    3manager.org.apache.juli.<file_handler>, 4hostmanager.org.apache.juli.<file_handler>, java.util.logging.ConsoleHandler

    Ensure logging is not off and set the <logging_level> to the desired level (SEVERE,

    WARNING, INFO, CONFIG, FINE, FINER, FINEST or ALL), for example:

    org.apache.juli.FileHandler.level=<logging_level>'
  checks:
  - type: manual_review
    info: 'Review each application’s logging.properties file located in the applications

      $CATALINA_BASE/webapps/<app_name>/WEB-INF/classes directory and determine if

      the file handler properties are set.

      $ grep handlers \

      $ CATALINA_BASE/webapps/<app_name>/WEB-INF/classes/logging.properties

      In the instance where an application specific logging has not been created, the

      logging.properties file will be located in $CATALINA_BASE/conf

      $ grep handlers $CATALINA_BASE/conf/logging.properties'
    severity: medium
- id: '7.3'
  title: Ensure className is set correctly in context.xml
  scoring: scored
  profile:
  - Level 2
  description: Ensure the className attribute is set to AccessLogValve. The className attribute determines the access log
    valve to be used for logging.
  rationale: Some log valves are not suited for production and should not be used. Apache recommends org.apache.catalina.valves.AccessLogValve
  impact: ''
  references:
  - 1. https://tomcat.apache.org/tomcat-9.0-doc/config/valve.html
  page_start: 93
  audit_raw: 'Execute the following to ensure className is set properly:

    # grep org.apache.catalina.valves.AccessLogValve

    $CATALINA_BASE/webapps/<app_name>/META-INF/context.xml'
  remediation: 'Add the following statement into the $CATALINA_BASE/webapps/<app_name>/METAINF/context.xml file if it does
    not already exist.

    <Valve

    className="org.apache.catalina.valves.AccessLogValve"

    directory="$CATALINA_HOME/logs/"

    prefix="access_log"

    fileDateFormat="yyyy-MM-dd.HH"

    suffix=".log"

    pattern="%h %t %H cookie:%{SESSIONID}c request:%{SESSIONID}r %m %U %s %q %r"

    />'
  checks:
  - type: manual_review
    info: 'Execute the following to ensure className is set properly:

