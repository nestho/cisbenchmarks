controls:
- id: '1.1'
  title: Ensure service level admins are created to manage resources of particular service
  scoring: manual
  profile:
  - Level 1
  description: To apply least-privilege security principle, one can create service-level administrators in corresponding groups
    and assigning specific users to each service-level administrative group in a tenancy. This limits administrative access
    in a tenancy. It means service-level administrators can only manage resources of a specific service. Example policies
    for global/tenant level service-administrators Allow group VolumeAdmins to manage volume-family in tenancy Allow group
    ComputeAdmins to manage instance-family in tenancy Allow group NetworkAdmins to manage virtual-network-family in tenancy
    Organizations have various ways of defining service-administrators. Some may prefer creating service administrators at
    a tenant level and some per department or per project or even per application environment ( dev/test/production etc.).
    Either approach works so long as the policies are written to limit access given to the service-administrators. Example
    policies for compartment level service-administrators Allow group NonProdComputeAdmins to manage instance-family in compartment
    dev Allow group ProdComputeAdmins to manage instance-family in compartment production Allow group A-Admins to manage instance-family
    in compartment Project-A Allow group A-Admins to manage volume-family in compartment Project-A
  rationale: Creating service-level administrators helps in tightly controlling access to Oracle Cloud Infrastructure (OCI)
    services to implement the least-privileged security principle. 12 | P a g e
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'From CLI:

    1. Set up OCI CLI with an IAM administrator user who has read access to IAM

    resources such as groups and policies.

    2. Run OCI CLI command providing the root_compartment_OCID

    Get the list of groups in a tenancy

    oci iam group list --compartment-id <root_compartment_OCID> | grep name

    3. Ensure distinct administrative groups are created as per your organization''s

    definition of service-administrators.

    4. Verify the appropriate policies are created for the service-administrators groups to

    have the right access to the corresponding services. Retrieve the policy statements

    scoped at the tenancy level and/or per compartment.

    oci iam policy list --compartment-id <root_compartment_OCID> | grep "in

    tenancy"

    oci iam policy list --compartment-id <root_compartment_OCID> | grep "in

    compartment"

    The --compartment-id parameter can be changed to a child compartment to get policies

    associated with child compartments.

    oci iam policy list --compartment-id <child_compartment_OCID> | grep "in

    compartment"

    Verify the results to ensure the right policies are created for service-administrators to have

    the necessary access.'
  remediation: 'Refer to the policy syntax document and create new policies if the audit results indicate

    that the required policies are missing.

    This can be done via OCI console or OCI CLI/SDK or API.

    Creating a new policy:

    From CLI:

    oci iam policy create [OPTIONS]

    Creates a new policy in the specified compartment (either the tenancy or another of your

    compartments). If you''re new to policies, see

    Getting Started with Policies

    You must specify a name for the policy, which must be unique across all policies in your

    13 | P a g e

    tenancy and cannot be changed.

    You must also specify a description for the policy (although it can be an empty string). It

    does not have to be unique, and you can change it anytime with UpdatePolicy.

    You must specify one or more policy statements in the statements array.

    For information about writing policies, see How Policies Work and Common Policies.'
  checks:
  - type: command
    command: oci iam group list --compartment-id <root_compartment_OCID> | grep name && oci iam policy list --compartment-id
      <root_compartment_OCID> | grep "in && oci iam policy list --compartment-id <root_compartment_OCID> | grep "in && oci
      iam policy list --compartment-id <child_compartment_OCID> | grep "in
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Set up OCI CLI with an IAM administrator user who has read access to IAM

      resources such as groups and policies.

      2. Run OCI CLI command providing the root_compartment_OCID

      Get the list of groups in a tenancy

      oci iam group list --compartment-id <root_compartment_OCID> | grep name

      3. Ensure distinct administrative groups are created as per your organization''s

      definition of service-admini'
- id: '1.2'
  title: Ensure permissions on all resources are given only to the tenancy administrator group
  scoring: manual
  profile:
  - Level 1
  description: 'There is a built-in OCI IAM policy enabling the Administrators group to perform any action within a tenancy.
    In the OCI IAM console, this policy reads: Allow group Administrators to manage all-resources in tenancy Administrators
    create more users, groups, and policies to provide appropriate access to other groups. Administrators should not allow
    any-other-group full access to the tenancy by writing a policy like this - Allow group any-other-group to manage all-resources
    in tenancy The access should be narrowed down to ensure the least-privileged principle is applied.'
  rationale: Permission to manage all resources in a tenancy should be limited to a small number of users in the Administrators
    group for break-glass situations and to set up users/groups/policies when a tenancy is created. No group other than Administrators
    in a tenancy should need access to all resources in a tenancy, as this violates the enforcement of the least privilege
    principle.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'From CLI:

    1. Run OCI CLI command providing the root compartment OCID to get the list of

    groups having access to manage all resources in your tenancy.

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to

    manage all-resources in tenancy"

    15 | P a g e

    2. Verify the results to ensure only the Administrators group has access to manage all

    resources in tenancy.

    "Allow group Administrators to manage all-resources in tenancy"'
  remediation: 'From Console:

    1. Login to OCI console.

    2. Go to Identity -> Policies, In the compartment dropdown, choose the root

    compartment. Open each policy to view the policy statements.

    3. Remove any policy statement that allows any group other than Administrators or

    any service access to manage all resources in the tenancy.

    The policies can also be updated via OCI CLI/SDK/API.

    Note: You should generally not delete the policy that allows the Administrators group the

    ability to manage all resources in the tenancy.'
  checks:
  - type: command
    command: oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Run OCI CLI command providing the root compartment OCID to get the list of

      groups having access to manage all resources in your tenancy.

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to

      manage all-resources in tenancy"

      15 | P a g e

      2. Verify the results to ensure only the Administrators group has access to manage all

      resources in tenancy.

      "Allow group Adminis'
- id: '1.3'
  title: Ensure IAM administrators cannot update tenancy Administrators group
  scoring: manual
  profile:
  - Level 1
  description: 'Tenancy administrators can create more users, groups, and policies to provide other service administrators
    access to OCI resources. For example, an IAM administrator will need to have access to manage resources like compartments,
    users, groups, dynamic-groups, policies, identity-providers, tenancy tagnamespaces, tag-definitions in the tenancy. The
    policy that gives IAM-Administrators or any other group full access to ''groups'' resources should not allow access to
    the tenancy ''Administrators'' group. The policy statements would look like - Allow group IAMAdmins to inspect users in
    tenancy Allow group IAMAdmins to use users in tenancy where target.group.name != ''Administrators'' Allow group IAMAdmins
    to inspect groups in tenancy Allow group IAMAdmins to use groups in tenancy where target.group.name != ''Administrators''
    Note: You must include separate statements for ''inspect'' access, because the target.group.name variable is not used
    by the ListUsers and ListGroups operations'
  rationale: These policy statements ensure that no other group can manage tenancy administrator users or the membership to
    the 'Administrators' group thereby gain or remove tenancy administrator access.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From CLI:

    1. Run the following OCI CLI commands providing the root_compartment_OCID

    17 | P a g e

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

    use users in tenancy"

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

    use groups in tenancy"

    2. Verify the results to ensure that the policy statements that grant access to use or

    manage users or groups in the tenancy have a condition that excludes access to

    Administrators group or to users in the Administrators group.'
  remediation: 'From Console:

    1. Login to OCI Console.

    2. Select Identity from Services Menu.

    3. Select Policies from Identity Menu.

    4. Click on an individual policy under the Name heading.

    5. Ensure Policy statements look like this -

    Allow group IAMAdmins to use users in tenancy **where target.group.name !=

    ''Administrators''

    Allow group IAMAdmins to use groups in tenancy **where target.group.name !=

    ''Administrators'''
  checks:
  - type: command
    command: oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to && oci iam policy list --compartment-id
      <root_compartment_OCID> | grep -i " to
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Run the following OCI CLI commands providing the root_compartment_OCID

      17 | P a g e

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

      use users in tenancy"

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

      use groups in tenancy"

      2. Verify the results to ensure that the policy statements that grant access to use or

      manage users or gro'
- id: '1.4'
  title: Ensure IAM password policy requires minimum length of 14 or greater
  scoring: manual
  profile:
  - Level 1
  description: Password policies are used to enforce password complexity requirements. IAM password policies can be used to
    ensure password are at least a certain length and are composed of certain characters. It is recommended the password policy
    require a minimum password length 14 characters and contain 1 non-alphabetic character (Number or “Special Character”).
  rationale: In keeping with the overall goal of having users create a password that is not overly weak, an eight-character
    minimum password length is recommended for an MFA account, and 14 characters for a password only account. In addition,
    maximum password length should be made as long as possible based on system/software capabilities and not restricted by
    policy. In general, it is true that longer passwords are better (harder to crack), but it is also true that forced password
    length requirements can cause user behavior that is predictable and undesirable. For example, requiring users to have
    a minimum 16-character password may cause them to choose repeating patterns like fourfourfourfour or passwordpassword
    that meet the requirement but aren’t hard to guess. Additionally, length requirements increase the chances that users
    will adopt other insecure practices, like writing them down, re-using them or storing them unencrypted in their documents.
    Password composition requirements are a poor defense against guessing attacks. Forcing users to choose some combination
    of upper-case, lower-case, numbers, and special characters has a negative impact. It places an extra burden on users and
    many will use predictable patterns (for example, a capital letter in the first position, followed by lowercase letters,
    then one or two numbers, and a “special character” at the end). Attackers know this, so dictionary attacks will often
    contain these common patterns and use the most common substitutions like, $ for s, @ for a, 1 for l, 0 for o. 19 | P a
    g e Passwords that are too complex in nature make it harder for users to remember, leading to bad practices. In addition,
    composition requirements provide no defense against common attack types such as social engineering or insecure storage
    of passwords.
  impact: ''
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 19
  audit_raw: 'OCI Native IAM

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Ensure the number 14 is entered into the box below the text: MINIMUM PASSWORD

    LENGTH (IN CHARACTERS).

    6. Ensure that one (1) of the checkboxes is selected for MUST CONTAIN AT LEAST 1

    SPECIAL CHARACTER OR MUST CONTAIN AT LEAST 1 NUMERIC CHARACTER

    OCI Identity Cloud Service (IDCS)

    If you use IDCS to login to OCI, verify the password policy settings in IDCS

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Verify the Password length min size setting.

    4. Under The password must contain these characters section, ensure that the

    number given in Numeric min setting is 1, or the Special min setting is 1.

    Cloud Guard

    To Enable Cloud Guard Auditing:

    Ensure Cloud Guard is enabled in the root compartment of the tenancy. For more

    information about enabling Cloud Guard, please look at the instructions included in

    Recommendation 3.15.

    From Console:

    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the “Services” submenu.

    3. Click Detector Recipes in the Cloud Guard menu.

    4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe

    Name column.

    5. Find Password policy does not meet complexity requirements in the Detector Rules

    column.

    6. Select the vertical ellipsis icon and chose Edit on the Password policy does not meet

    complexity requirements row.

    20 | P a g e

    7. In the Edit Detector Rule window, find the Input Setting box and verify/change the

    Required password length setting to 14.

    8. Click the Save button.

    From CLI:

    1. Update the Password policy does not meet complexity requirements Detector Rule

    in Cloud Guard to generate Problems if IAM password policy isn’t configured to

    enforce a password length of at least 14 characters with the following command:

    oci cloud-guard detector-recipe-detector-rule update --detector-recipe-id

    <insert detector recipe ocid> --detector-rule-id PASSWORD_POLICY_NOT_COMPLEX

    --details ''{"configurations":[{ "configKey" : "passwordPolicyMinLength",

    "name" : "Required password length", "value" : "14", "dataType" : null,

    "values" : null }]}'''
  remediation: 'OCI Native IAM

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Type the number 14 into the box below the text: MINIMUM PASSWORD LENGTH (IN

    CHARACTERS).

    6. Select checkbox next to MUST CONTAIN AT LEAST 1 SPECIAL CHARACTER OR MUST

    CONTAIN AT LEAST 1 NUMERIC CHARACTER

    OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on Change Your Password Policy button.

    4. Update the Password length min size setting to 14

    5. Click Save.

    6. Under The password must contain these characters section, update the number

    given in Special min setting to 1

    or

    Under The password must contain these characters section, update the number

    given in Numeric min setting to 1

    7. Click Save

    21 | P a g e'
  checks:
  - type: sql
    command: Select Authentication Settings from the Identity menu.
    severity: medium
    info: 'OCI Native IAM

      From Console:

      1. Login to the OCI Console

      2. Go to Identity in the Services menu.

      3. Select Authentication Settings from the Identity menu.

      4. Click Edit in the middle of the page.

      5. Ensure the number 14 is entered into the box below the text: MINIMUM PASSWORD

      LENGTH (IN CHARACTERS).

      6. Ensure that one (1) of the checkboxes is selected for MUST CONTAIN AT LEAST 1

      SPECIAL CHARACTER '
- id: '1.5'
  title: Ensure IAM password policy expires passwords within 365 days
  scoring: manual
  profile:
  - Level 1
  description: IAM password policies can require passwords to be rotated or expired after a given number of days. It is recommended
    that the password policy expire passwords after 365 and are changed immediately based on events.
  rationale: 'Excessive password expiration requirements do more harm than good, because these requirements make users select
    predictable passwords, composed of sequential words and numbers that are closely related to each other.10 In these cases,
    the next password can be predicted based on the previous one (incrementing a number used in the password for example).
    Also, password expiration requirements offer no containment benefits because attackers will often use credentials as soon
    as they compromise them. Instead, immediate password changes should be based on key events including, but not limited
    to: 1. Indication of compromise 2. Change of user roles 3. When a user leaves the organization. Not only does changing
    passwords every few weeks or months frustrate the user, it’s been suggested that it does more harm than good, because
    it could lead to bad practices by the user such as adding a character to the end of their existing password. In addition,
    we also recommend a yearly password change. This is primarily because for all their good intentions users will share credentials
    across accounts. Therefore, even if a breach is publicly identified, the user may not see this notification, or forget
    they have an account on that site. This could leave a shared credential vulnerable indefinitely. Having an organizational
    policy of a 1-year (annual) password expiration is a reasonable compromise to mitigate this with minimal user burden.'
  impact: ''
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 23
  audit_raw: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    23 | P a g e

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Ensure that the number of days configured in Expires after setting is 365.'
  remediation: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on Change Your Password Policy button.

    4. Update the number of days configured in Expires after setting to 365.'
  checks:
  - type: manual_review
    info: 'OCI Identity Cloud Service (IDCS)

      1. Login to IDCS Admin Console

      23 | P a g e

      2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

      3. Ensure that the number of days configured in Expires after setting is 365.'
    severity: medium
- id: '1.6'
  title: Ensure IAM password policy prevents password reuse
  scoring: manual
  profile:
  - Level 1
  description: IAM password policies can prevent the reuse of a given password by the same user. It is recommended the password
    policy prevent the reuse of passwords.
  rationale: Enforcing password history ensures that passwords are not reused in for a certain period of time by the same
    user. If a user is not allowed to use last 24 passwords, that window of time is greater. This helps maintain the effectiveness
    of password security.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Ensure that the number of remembered passwords in Previous passwords

    remembered setting is set to 24.'
  remediation: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on "Change Your Password Policy" button.

    4. Update the number of remembered passwords in Previous passwords remembered

    setting to 24.'
