- id: '5.1'
  title: Create at least one compartment in your tenancy to store cloud resources
  scoring: manual
  profile:
  - Level 1
  description: When you sign up for Oracle Cloud Infrastructure, Oracle creates your tenancy, which is the root compartment
    that holds all your cloud resources. You then create additional compartments within the tenancy (root compartment) and
    corresponding policies to control access to the resources in each compartment. Compartments allow you to organize and
    control access to your cloud resources. A compartment is a collection of related resources (such as instances, databases,
    virtual cloud networks, block volumes) that can be accessed only by certain groups that have been given permission by
    an administrator.
  rationale: Compartments are a logical group that adds an extra layer of isolation, organization and authorization making
    it harder for unauthorized users to gain access to OCI resources.
  impact: Once the compartment is created a OCI IAM policy must be created to allow a group to resources in the compartment
    otherwise only group with tenancy access will have access.
  references: []
  page_start: 119
  audit_raw: "From Console:\n1. Login into the OCI Console.\n2. Click in the search bar, top of the screen.\n3. Type Advanced\
    \ Resource Query and hit enter.\n4. Click the Advanced Resource Query button in the upper right of the screen.\n5. Enter\
    \ the following query in the query box:\nquery\n compartment resources\nwhere\n(compartmentId='<tenancy-id>' && lifecycleState='ACTIVE')\n\
    119 | P a g e\n6. Ensure query returns at least one compartment in addition to the\nManagedCompartmentForPaaS compartment\n\
    From CLI:\n1. Execute the following command\noci search resource structured-search --query-text \"query\n compartment\
    \ resources\nwhere\n(compartmentId='<tenancy-id>' && lifecycleState='ACTIVE')\""
