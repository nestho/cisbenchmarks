- id: '3.14'
  title: Ensure VCN flow logging is enabled for all subnets
  scoring: manual
  profile:
  - Level 2
  description: VCN flow logs record details about traffic that has been accepted or rejected based on the security list rule.
  rationale: Enabling VCN flow logs enables you to monitor traffic flowing within your virtual network and can be used to
    detect anomalous traffic.
  impact: Enabling VCN flow logs will not affect the performance of your virtual network but it will generate additional use
    of object storage that should be controlled via object lifecycle management. By default, VCN flow logs are stored for
    30 days in object storage. Users can specify a longer retention period.
  references: []
  page_start: 98
  audit_raw: 'From Console:

    1. Go to the Virtual Cloud Network (VCN) page https://console.us-ashburn1.oraclecloud.com/networking/vcns

    2. Click on the name of each VCN

    3. Click on each subnet within the VCN

    4. Under Resources click on Logs

    5. Verify that there is a log enabled for the subnet

    From CLI:

    1. Find the OCID of the specific Subnet based on Display Name and Compartment OCID

    oci network subnet list --compartment-id=<compartment OCID> --query "data

    [?\"display-name\"==''<subnet display name>'']".{"id:id"} --output table

    98 | P a g e

    2. Find the OCID of the LogGroup used for FlowLogs

    oci logging log-group list --compartment-id <tenancy OCID> --query "data

    [?\"display-name\"==''<Log Group Name>'']"

    3. List the logs associated with the OCID of the subnet.

    oci logging log list --log-group-id

    "ocid1.loggroup.oc1.iad.aaaaaaaa2rbhzqg7edpr5pcbpnekyocupfpkoqsi65rnegncwvfaf

    mgwap7a" --query "data

    [?configuration.source.resource==''ocid1.subnet.oc1.iad.aaaaaaaal4g25fmu4owaa3

    djy3tcjyd7oskpkl67j2xu7g77tifokkw5ji6q'']"

    4. Ensure a log is listed for this subnet'
  remediation: "From Console:\nFirst, if a log group for holding these logs has not already been created, create a log group\n\
    by the following steps:\n1. Go to the Log Groups page https://console.us-ashburn1.oraclecloud.com/logging/log-groups\n\
    2. Click the Create Log Groups button in the middle of the screen.\n3. Select the relevant compartment to place these\
    \ logs.\n4. Type a name for the log group in the Name box.\n5. Add an optional description in the Description box.\n6.\
    \ Click the Create button in the lower left hand corner.\nSecond, enable VCN flow logging for your subnet(s) by the following\
    \ steps:\n1. Go to the Logs page https://console.us-ashburn-1.oraclecloud.com/logging/logs\n2. Click the Enable Service\
    \ Log button in the middle of the screen.\n3. Select the relevant resource compartment.\n4. Select Virtual Cloud Networks\
    \ (subnets) from the Service drop down menu.\n5. Select the relevant resource from the resource drop down menu.\n6. Select\
    \ Flow Logs (all records) from the Log Category drop down menu.\n7. Type a name for your flow logs in the Log Name drop\
    \ down menu.\n8. Click the Enable Log button in the lower left hand corner.\nFrom CLI:\n1. Set the variable C to the OCID\
    \ of the compartment\nexport C=<Compartment OCID>\n99 | P a g e\n2. Create a log group:\noci logging log-group create\
    \ --compartment-id $C \\\n--display-name \"<DisplayName>\" \\\n--description \"<Description>\"\nThe output of the command\
    \ gives you a work request id. You can query the work request to\nsee the status of the job by issuing the following command:\n\
    \ oci logging work-request get --work-request-id <output from command above>\nLook for the status filed to be SUCCEEDED.\n\
    3. Get the Log group ID, needed for creating the Log:\noci logging log-group list --compartment-id $C \\\n--query 'data[?contains(\"\
    display-name\", `'\"<DisplayName>\"'`)].id|join(`\\n`,\n@)' \\\n--raw-output\n4. Create a JSON file called config.json\
    \ with the following content:\n{\n \"source\": {\n \"service\": \"flowlogs\",\n \"source-type\": \"OCISERVICE\",\n \"\
    category\": \"all\"\n }\n}\nThe compartment-id is the Compartment OCID of where the subnet resource is present.\nThe resource\
    \ value is the OCID of subnet for which flowlogs is enabled.\n5. Create the Service Log:\noci logging log create --log-group-id\
    \ <value from step 3.> \\\n--display-name \"<DisplayName>\" \\\n--log-type SERVICE --is-enabled TRUE \\\n--configuration\
    \ file://config.json\nThe output of the command gives you a work request id. You can query the work request to\nsee that\
    \ status of the job by issuing the following command:\n oci logging work-request get --work-request-id <output from command\
    \ above>\nLook for the status filed to be SUCCEEDED.\n100 | P a g e"
