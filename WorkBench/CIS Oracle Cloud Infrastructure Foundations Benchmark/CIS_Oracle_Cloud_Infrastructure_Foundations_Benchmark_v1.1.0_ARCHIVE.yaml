    updated or deleted. Event Rules are compartment scoped and will detect events in child compartments. It is recommended
    to create the Event rule at the root compartment level.
  rationale: OCI Identity Providers allow management of User ID / passwords in external systems and use of those credentials
    to access OCI resources. Identity Providers allow users to single sign-on to OCI console and have other OCI credentials
    like API Keys. Monitoring and alerting on changes to Identity Providers will help in identifying changes to the security
    posture.
  impact: There is no performance impact when enabling the above described features but depending on the amount of notifications
    sent per month there may be a cost associated.
