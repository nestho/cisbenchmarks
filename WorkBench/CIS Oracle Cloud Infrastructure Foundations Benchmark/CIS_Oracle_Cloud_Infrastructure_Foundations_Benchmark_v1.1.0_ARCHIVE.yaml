- id: '1.7'
  title: Ensure MFA is enabled for all users with a console password
  scoring: scored
  profile:
  - Level 1
  description: Multi-factor authentication is a method of authentication that requires the use of more than one factor to
    verify a user’s identity. With MFA enabled in the IAM service, when a user signs in to Oracle Cloud Infrastructure, they
    are prompted for their user name and password, which is the first factor (something that they know). The user is then
    prompted to provide a second verification code from a registered MFA device, which is the second factor (something that
    they have). The two factors work together, requiring an extra layer of security to verify the user’s identity and complete
    the sign-in process. OCI IAM supports two-factor authentication using a password (first factor) and a device that can
    generate a time-based one-time password (TOTP) (second factor). See OCI documentation for more details.
  rationale: Multi factor authentication adds an extra layer of security during the login process and makes it harder for
    unauthorized users to gain access to OCI resources.
  impact: ''
  references:
  - 1. https://docs.cloud.oracle.com/en-us/iaas/Content/Identity/Tasks/usingmfa.htm
  page_start: 26
  audit_raw: 'From Console:

    1. Login into OCI Console.

    2. Select Identity from Services menu

    3. Select Users from Identity menu.

    4. Click on an individual user.

    5. Ensure the word Enabled is next to Multi-factor authentication.

    From CLI:

    Set up the OCI CLI with an IAM administrator user who has access to read IAM policies.

    Run OCI CLI command providing the root compartment OCID

    26 | P a g e

    oci iam user list --query ''data[].["id","name","is-mfa-activated"]'' --output

    table

    Verify that the table column named Column2 has not values of false

    From Cloud Guard:

    To Enable Cloud Guard Auditing:

    Ensure Cloud Guard is enabled in the root compartment of the tenancy. For more

    information about enabling Cloud Guard, please look at the instructions included in

    Recommendation 3.15.

    From Console:

    1. Type Cloud Guard into the Search box at the top of the Console

    2. Click Cloud Guard from the “Services” submenu

    3. Click Detector Recipes in the Cloud Guard menu

    4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe

    Name column

    5. Find User does not have MFA enabled in the Detector Rules column

    6. Verify that the User does not have MFA enabled Detector Rule is Enabled

    From CLI:

    1. Verify that the User does not have MFA enabled Detector Rule in Cloud Guard is

    enabled to generate Problems if multifactor authentication is not required each time

    a user logs into Oracle Cloud Infrastructure with the following command:

    oci cloud-guard detector-recipe-detector-rule get --detector-recipe-id

    <insert detector recipe ocid> --detector-rule-id NO_MFA_ENABLED_FOR_USER'
  remediation: 'Each user must enable MFA for themselves using a device they will have access to every

    time they sign in. An administrator cannot enable MFA for another user but can enforce

    MFA by identifying the list of non-complaint users, notifying them or disabling access by

    resetting password for non-complaint accounts.

    Disabling access from Console:

    1. Login into OCI Console.

    2. Select Identity from Services menu

    3. Select Users from Identity menu.

    4. Click on each non-complaint user.

    5. Click on Create/Reset Password.

    From CLI:

    27 | P a g e

    oci iam user ui-password create-or-reset --user-id <OCID of the non-compliant

    user>'
  checks:
  - type: sql
    command: Select Identity from Services menu
    severity: medium
    info: 'From Console:

      1. Login into OCI Console.

      2. Select Identity from Services menu

      3. Select Users from Identity menu.

      4. Click on an individual user.

      5. Ensure the word Enabled is next to Multi-factor authentication.

      From CLI:

      Set up the OCI CLI with an IAM administrator user who has access to read IAM policies.

      Run OCI CLI command providing the root compartment OCID

      26 | P a g e

      oci iam user list --'
- id: '1.8'
  title: Ensure user API keys rotate within 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: API keys are used by administrators, developers, services and scripts for accessing OCI APIs directly or via
    SDKs/OCI CLI to search, create, update or delete OCI resources. The API key is an RSA key pair. The private key is used
    for signing the API requests and the public key is associated with a local or synchronized user's profile.
  rationale: It is important to secure and rotate an API key every 90 days or less as it provides the same level of access
    that a user it is associated with has. In addition to a security engineering best practice, this is also a compliance
    requirement. For example, PCI-DSS Section 3.6.4 states, "Verify that key-management procedures include a defined cryptoperiod
    for each key type in use and define a process for key changes at the end of the defined crypto period(s)."
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'OCI Native IAM

    From Console:

    1. Login to OCI Console.

    2. Select Identity from the Services menu.

    3. Select Users from the Identity menu.

    4. Click on an individual user under the Name heading.

    5. Click on API Keys in the lower left-hand corner of the page.

    6. Ensure the date of the API key under the Created column of the API Key is no more

    than 90 days old.

    From CLI:

    oci iam user api-key list --user-id <user_ocid> --query data[*].[\"timecreated\",\"fingerprint\"]

