- id: '3.16'
  title: Ensure customer created Customer Managed Key (CMK) is rotated at least annually
  scoring: manual
  profile:
  - Level 1
  description: Oracle Cloud Infrastructure Vault securely stores master encryption keys that protect your your encrypted data.
    You can use the Vault service to rotate keys to generate new cryptographic material. Periodically rotating keys limits
    the amount of data encrypted by one key version.
  rationale: Rotating keys annually limits the data encrypted under one key version. Key rotation thereby reduces the risk
    in case a key is ever compromised.
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'From Console:

    1. Login into OCI Console.

    2. Select Security from the Services menu.

    3. Select Vault from the Security menu.

    4. Click on the individual Vault under the Name heading.

    5. Ensure the date of each Master Encryption key under the Created column of the

    Master Encryption key is no more than 365 days old.

    6. Repeat for all Vaults in all compartments

    From CLI:

    1. Execute the following for each Vault in each compartment

    oci kms management key list --compartment-id ''<compartment-id>'' --endpoint

    ''<control_plane_url>'' --all --query "data[*].[\"time-created\",\"displayname\"]"

    2. Ensure the date of the Master Encryption key is no more than 365 days old.'
  remediation: 'From Console:

