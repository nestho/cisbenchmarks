- id: '5.2'
  title: Ensure no resources are created in the root compartment
  scoring: manual
  profile:
  - Level 1
  description: When you create a cloud resource such as an instance, block volume, or cloud network, you must specify to which
    compartment you want the resource to belong. Placing resources in the root compartment makes it difficult to organize
    and isolate those resources.
  rationale: Placing resources into a compartment will allow you to organize and have more granular access controls to your
    cloud resources.
  impact: Placing a resource in a compartment will impact how you write policies to manage access and organize that resource.
  references: []
  page_start: 121
  audit_raw: "From Console:\n1. Login into the OCI Console.\n2. Click in the search bar, top of the screen.\n3. Type Advance\
    \ Resource Query and hit enter.\n4. Click the Advanced Resource Query button in the upper right of the screen.\n5. Enter\
    \ the following query into the query box:\nquery\n VCN, instance, volume, filesystem, bucket,\nautonomousdatabase, database,\
    \ dbsystem resources\n where compartmentId = '<tenancy-id>'\n6. Ensure query returns no results.\nFrom CLI:\n1. Execute\
    \ the following command:\noci search resource structured-search --query-text \"query\n VCN, instance, volume, filesystem,\
    \ bucket,\n121 | P a g e\nautonomousdatabase, database, dbsystem resources\n where compartmentId = '<tenancy-id>'\"\n\
    2. Ensure query return no results."
