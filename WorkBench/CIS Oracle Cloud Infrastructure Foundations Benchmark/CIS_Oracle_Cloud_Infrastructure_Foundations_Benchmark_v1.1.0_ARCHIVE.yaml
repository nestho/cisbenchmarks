- id: '4.2'
  title: Ensure Object Storage Buckets are encrypted with a Customer Managed Key (CMK)
  scoring: manual
  profile:
  - Level 2
  description: Oracle Object Storage buckets support encryption with a Customer Managed Key (CMK). By default, Object Storage
    buckets are encrypted with an Oracle managed key. Encryption of storage buckets provides an additional level of security
    on your data. Management of encryption keys is critical to protecting and accessing protected data. Some customers want
    to identify storage buckets encrypted Oracle-managed keys in order to apply their own key lifecycle management to the
    bucket.
  rationale: Encryption of Object Storage buckets with a Customer Managed Key (CMK) provides an additional level of security
    on your data by allowing you to manage your own encryption key lifecycle management for the bucket.
  impact: 'Encrypting with a Customer Managed Keys requires a Vault and a Customer Master Key. In addition you must authorize
    Object Storage service to use keys on your behalf. Required Policy: Allow service objectstorage-<region_name>, to use
    keys in compartment <compartment-id> where target.key.id = ''<key_OCID>'''
  references: []
  page_start: 115
  audit_raw: 'From Console:

    1. Login to OCI Console.

    2. Select Object Storage from the Services menu.

    3. Select Object Storage from the Object Storage menu.

    4. Click on an individual bucket under the Name heading.

    5. Ensure that the Encryption Key is not set to Oracle managed key.

    6. Repeat for each compartment

    115 | P a g e

    From CLI:

    1. Execute the following command

    oci os bucket get --bucket-name <bucket-name>

    2. Ensure kms-key-id is not `null''

    Cloud Guard

    To Enable Cloud Guard Auditing:

    Ensure Cloud Guard is enabled in the root compartment of the tenancy. For more

    information about enabling Cloud Guard, please look at the instructions included in

    Recommendation 3.15.

