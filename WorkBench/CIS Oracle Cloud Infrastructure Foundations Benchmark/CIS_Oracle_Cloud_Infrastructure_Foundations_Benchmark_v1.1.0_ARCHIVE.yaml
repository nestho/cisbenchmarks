- id: '2.5'
  title: Ensure the default security list of every VCN restricts all traffic except ICMP
  scoring: scored
  profile:
  - Level 1
  description: A default security list is created when a Virtual Cloud Network (VCN) is created. Security lists provide stateful
    filtering of ingress and egress network traffic to OCI resources. It is recommended no security list allows unrestricted
    ingress access to Secure Shell (SSH) via port 22.
  rationale: Removing unfettered connectivity to remote console services, such as SSH on port 22, reduces a server's exposure
    to unauthorized access.
  impact: For updating an existing environment, care should be taken to ensure that administrators currently relying on an
    existing ingress from 0.0.0.0/0 have access to ports 22 and/or 3389 through another security group.
  references: []
  page_start: 53
  audit_raw: 'From Console:

    1. Login into the OCI Console

    2. Click on Networking -> Virtual Cloud Networks

    3. For each VCN listed Click on Security Lists

    4. Click on Default Security List for <VCN Name>

    5. Verify that there is no Ingress rule with ''Source 0.0.0.0/0, IP Protocol 22 and

    Destination Port Range 22'''
  remediation: 'From Console:

    1. Login into the OCI Console

    2. Click on Networking -> Virtual Cloud Networks

    3. For each VCN listed Click on Security Lists

    4. Click on Default Security List for <VCN Name>

    53 | P a g e

    5. Select the Ingress Rule with ''Source 0.0.0.0/0, IP Protocol 22 and Destination Port

    Range 22''

    6. Click Remove

    7. Verify that you want to remove by clicking Remove'
  checks:
