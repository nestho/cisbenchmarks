    ,\n \"allow service cloudguard to read tenancies in tenancy\",\n \"allow service cloudguard to read audit-events in tenancy\"\
    ,\n \"allow service cloudguard to read compute-management-family in tenancy\",\n \"allow service cloudguard to read instance-family\
    \ in tenancy\",\n \"allow service cloudguard to read virtual-network-family in tenancy\",\n \"allow service cloudguard\
    \ to read volume-family in tenancy\",\n \"allow service cloudguard to read database-family in tenancy\",\n \"allow service\
    \ cloudguard to read object-family in tenancy\",\n \"allow service cloudguard to read load-balancers in tenancy\",\n \"\
    allow service cloudguard to read users in tenancy\",\n \"allow service cloudguard to read groups in tenancy\",\n \"allow\
    \ service cloudguard to read policies in tenancy\",\n \"allow service cloudguard to read dynamic-groups in tenancy\",\n\
    \ \"allow service cloudguard to read authentication-policies in tenancy\"\n ]'\n2. Enable Cloud Guard in root compartment\n\
    oci cloud-guard configuration update --reporting-region 'us-ashburn-1' --\ncompartment-id '<tenancy-id>' --status 'ENABLED'\n\
