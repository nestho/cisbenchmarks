    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the “Services” submenu.

    3. Click Detector Recipes in the Cloud Guard menu.

    4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe

    Name column.

    5. Find Object Storage bucket is encrypted with Oracle-managed key in the Detector

    Rules column.

    6. Verify that the Object Storage bucket is encrypted with Oracle-managed key

    Detector Rule is Enabled.

    From CLI:

    1. Verify the Object Storage bucket is encrypted with Oracle-managed key Detector

    Rule in Cloud Guard is enabled to generate Problems if Object Storage Buckets are

    configured without a customer managed key with the following command:

    oci cloud-guard detector-recipe-detector-rule get --detector-recipe-id

    <insert detector recipe ocid> --detector-rule-id

    BUCKET_ENCRYPTED_WITH_ORACLE_MANAGED_KEY'
  remediation: 'From Console:

    1. Login to OCI Console..

