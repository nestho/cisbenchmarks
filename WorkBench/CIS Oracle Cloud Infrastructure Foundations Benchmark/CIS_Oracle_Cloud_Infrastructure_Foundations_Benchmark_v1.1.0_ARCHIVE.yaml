- id: '3.15'
  title: Ensure Cloud Guard is enabled in the root compartment of the tenancy
  scoring: manual
  profile:
  - Level 1
  description: Cloud Guard detects misconfigured resources and insecure activity within a tenancy and provides security administrators
    with the visibility to resolve these issues. Upon detection, Cloud Guard can suggest, assist, or take corrective actions
    to mitigate these issues. Cloud Guard should be enabled in the root compartment of your tenancy with the default configuration,
    activity detectors and responders.
  rationale: Cloud Guard provides an automated means to monitor a tenancy for resources that are configured in an insecure
    manner as well as risky network activity from these resources.
  impact: There is no performance impact when enabling the above described features, but additional IAM policies will be required.
  references: []
  page_start: 102
  audit_raw: 'From Console:

    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the "Services" submenu.

    3. View if Cloud Guard is enabled

    From CLI:

    1. Retrieve the Cloud Guard status from the console

    oci cloud-guard configuration get --compartment-id <tenancy-ocid> --query

    ''data.status''

    2. Ensure the returned value is "ENABLED"`

    102 | P a g e'
  remediation: "From Console:\n1. Type Cloud Guard into the Search box at the top of the Console.\n2. Click Cloud Guard from\
    \ the \"Services\" submenu.\n3. Click Enable Cloud Guard.\n4. Click Create Policy.\n5. Click Next.\n6. Under Reporting\
    \ Region, select a region.\n7. Under Compartments To Monitor, choose Select Compartment.\n8. Under Select Compartments,\
    \ select the root compartment.\n9. Under Configuration Detector Recipe, select OCI Configuration Detector\nRecipe (Oracle\
    \ Managed).\n10. Under Activity Detector Recipe, select OCI Activity Detector Recipe (Oracle\nManaged).\n11. Click Enable.\n\
    From CLI:\n1. Create OCI IAM Policy for Cloud Guard\noci iam policy create --compartment-id '<tenancy-id>' --name\n'CloudGuardPolicies'\
