- id: '4.1'
  title: Ensure no Object Storage buckets are publicly visible
  scoring: manual
  profile:
  - Level 1
  description: A bucket is a logical container for storing objects. It is associated with a single compartment that has policies
    that determine what action a user can perform on a bucket and on all the objects in the bucket. It is recommended that
    no bucket be publicly accessible.
  rationale: Removing unfettered reading of objects in a bucket reduces an organization's exposure to data loss.
  impact: For updating an existing bucket, care should be taken to ensure objects in the bucket can be accessed through either
    IAM policies or pre-authenticated requests.
  references: []
  page_start: 112
  audit_raw: "From Console:\n1. Login into the OCI Console\n2. Click in the search bar, top of the screen.\n3. Type Advanced\
    \ Resource Query and click enter.\n4. Click the Advanced Resource Query button in the upper right of the screen.\n5. Enter\
    \ the following query in the query box:\nquery\nbucket resources\nwhere\n (publicAccessType == 'ObjectRead') || (publicAccessType\
    \ ==\n'ObjectReadWithoutList')\n6. Ensure query returns no results\nFrom CLI:\n1. Execute the following command:\n112\
    \ | P a g e\noci search resource structured-search --query-text \"query\nbucket resources\nwhere\n(publicAccessType ==\
    \ 'ObjectRead') || (publicAccessType ==\n'ObjectReadWithoutList')\"\n2. Ensure query returns no results\nCloud Guard\n\
    To Enable Cloud Guard Auditing:\nEnsure Cloud Guard is enabled in the root compartment of the tenancy. For more\ninformation\
    \ about enabling Cloud Guard, please look at the instructions included in\nRecommendation 3.15.\nFrom Console:\n1. Type\
    \ Cloud Guard into the Search box at the top of the Console.\n2. Click Cloud Guard from the “Services” submenu.\n3. Click\
    \ Detector Recipes in the Cloud Guard menu.\n4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe\n\
    Name column.\n5. Find Bucket is public in the Detector Rules column.\n6. Verify that the Bucket is public Detector Rule\
    \ is Enabled.\nFrom CLI:\n1. Verify the Bucket is public Detector Rule in Cloud Guard is enabled to generate\nProblems\
