    Root compartment

    oci iam tag-default create --compartment-id=<tenancy OCID> --tag-definitionid=<tag key definition id> --value="\${iam.principal.name}"'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the Compartments page: https://console.us-ashburn-1.oraclecloud.com

