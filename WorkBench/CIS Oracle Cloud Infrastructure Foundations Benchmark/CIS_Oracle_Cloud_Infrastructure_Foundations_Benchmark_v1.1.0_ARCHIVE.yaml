- id: '3.1'
  title: Ensure audit log retention period is set to 365 days
  scoring: scored
  profile:
  - Level 1
  description: Ensuring audit logs are kept for 365 days.
  rationale: Log retention controls how long activity logs should be retained. Studies have shown that The Mean Time to Detect(MTTD)
    a cyber breach is anywhere from 30 days in some sectors to up to 206 days in others. Retaining logs for at least 365 days
    or more will provide the ability to respond to incidents
  impact: There is no performance impact when enabling the above described features but additional audit data will be retained.
  references: []
  page_start: 56
  audit_raw: 'From Console:

    1. Go to the Tenancy Details page: https://console.us-ashburn1.oraclecloud.com/a/tenancy

    2. View the Audit Retention Period and ensure it is set to 365 Days.

    From CLI:

    1. Retrieve the audit retention period from the command line

    oci audit config get --compartment-id <compartment OCID>

    2. Ensure the returned JSON contains retention-period-days of 365.'
  remediation: 'From Console:

    1. Go to the Tenancy Details page: https://console.us-ashburn1.oraclecloud.com/a/tenancy

    2. Click Edit Audit Retention Policy

    56 | P a g e

    3. Set the AUDIT RETENTION PERIOD to 365

    4. Click Submit

    From CLI:

    1. Update the retention-period-days to 365

    oci audit config update --retention-period-days 365 --compartment-id

    <compartment OCID>'
  checks:
