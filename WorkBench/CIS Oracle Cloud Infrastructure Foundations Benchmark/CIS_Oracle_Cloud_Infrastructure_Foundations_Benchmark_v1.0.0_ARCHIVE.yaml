- id: '3.2'
  title: Ensure default tags are used on resources
  scoring: manual
  profile:
  - Level 1
  description: Using default tags is a way to ensure all resources that support tags are tagged during creation. Tags can
    be based on static values or based on computed values. It is recommended to setup default tags early on to ensure all
    created resources will get tagged. Tags are scoped to Compartments and are inherited by Child Compartments. The recommendation
    is to create default tags like “CreatedBy” at the Root Compartment level to ensure all resources get tagged. When using
    Tags it is important to ensure that Tag Namespaces are protected by IAM Policies otherwise this will allow users to change
    tags or tag values. Depending on the age of the OCI Tenancy there may already be Tag defaults setup at the Root Level
    and no need for further action to implement this action.
  rationale: In the case of an incident having default tags like “CreatedBy” applied will provide info on who created the
    resource without having to search the Audit logs.
  impact: There is no performance impact when enabling the above described features
  references: []
  page_start: 53
  audit_raw: 'From Console:

    1. Go to the Compartments page: https://console.us-ashburn-1.oraclecloud.com

    2. Select the Root compartment

    3. Select the Tag Defaults Link

    4. In the Tag Defaults table verify that there is a Tag with a value of

    ${iam.principal.name} and a Tag Key Status of Active

    Note:

    The name of the tag may be different then “CreatedBy” if the Tenancy Administrator has

    decided to use another tag.

    From CLI:

    1. List the active tag defaults defined at the Root compartment level by using the

    Tenancy OCID as compartment id.

    53 | P a g e

    Note: The Tenancy OCID can be found in the ~/.oci/config file used by the OCI

    Command Line Tool

    oci iam tag-default list --compartment-id=<tenancy OCID> --query="data

    [?\"lifecycle-state\"==''ACTIVE'']".{"name:\"tag-definitionname\","value:value""} --output table

    2. Verify in the table returned that there is at least one row that contains the value of

    ${iam.principal.name}'
  remediation: 'From Console:

    1. Go to the Tag Namespaces page: https://console.us-ashburn1.oraclecloud.com/identity/tag-namespaces

    2. Select the Root compartment

    3. Click Create Namespace Definition

    4. Create the Namespace in the Root Compartment

    5. Click on the newly created Namespace definition

    6. Click Create Tag Key Definition

    Create a Tag key definition by providing a Tag Key, Description and selecting

    “Static Value” for Tag Value Type

    7. Go to the Compartments page:

    https://console.us-ashburn-1.oraclecloud.com/identity/compartments

    8. Select the Root compartment

    9. Select the Tag Defaults Link

    10. Click Create Tag Default

    11. Create the Tag Default by providing the Tag namespace and Tag Key created

