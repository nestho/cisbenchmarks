- id: '2.1'
  title: Ensure no security lists allow ingress from 0.0.0.0/0 to port 22
  scoring: scored
  profile:
  - Level 1
  description: Security lists provide stateful or stateless filtering of ingress/egress network traffic to OCI resources on
    a subnet level. It is recommended that no security group allows unrestricted ingress access to port 22.
  rationale: Removing unfettered connectivity to remote console services, such as Secure Shell (SSH), reduces a server's exposure
    to risk.
  impact: For updating an existing environment, care should be taken to ensure that administrators currently relying on an
    existing ingress from 0.0.0.0/0 have access to ports 22 and/or 3389 through another network security group or security
    list.
  references: []
  page_start: 38
  audit_raw: 'From Console:

    1. Login into the OCI Console

    2. Click in the search bar, top of the screen.

    3. Type Advanced Resource Query and hit enter.

    4. Click the Advanced Resource Query button in the upper right of the screen.

    5. Enter the following query in the query box:

    query SecurityList resources where

    (IngressSecurityRules.source = ''0.0.0.0/0'' &&

    IngressSecurityRules.protocol = 6 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.max = 22 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.min = 22)

    6. Ensure query returns no results.

    From CLI:

    1. Execute the following command

    38 | P a g e

    oci search resource structured-search --query-text "query SecurityList

    resources where

    (IngressSecurityRules.source = ''0.0.0.0/0'' &&

    IngressSecurityRules.protocol = 6 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.max = 22 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.min = 22)

    "

    2. Ensure query returns no results.'
  remediation: 'From Console:

    1. Follow the audit procedure above.

    2. For each security list in the returned results, click the security list name

    3. Either edit the ingress rule to be more restrictive, delete the ingress rule or

    click on the VCN and terminate the security list as appropriate.

    From CLI:

    1. Follow the audit procedure.

    2. For each of the security lists identified get the its details

    oci network security-list get --security-list-id <security list id>

    3. Then either:

    • Update the security list, copy the ingress-security-rules element from the

    JSON returned by the above get call, edit it appropriately and use it in the following

    command

    oci network security-list update --security-list-id <security-list-id> --

    ingress-security-rules ''<ingress security rules JSON>''

    or

    • Delete the security list

    oci network security-list delete --security-list-id <security list id>

    39 | P a g e'
  checks:
