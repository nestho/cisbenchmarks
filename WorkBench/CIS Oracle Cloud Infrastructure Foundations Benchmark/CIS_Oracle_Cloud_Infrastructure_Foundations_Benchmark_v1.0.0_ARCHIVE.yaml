- id: '1.10'
  title: Ensure IAM password policy prevents password reuse
  scoring: manual
  profile:
  - Level 1
  description: IAM password policies can prevent the reuse of a given password by the same user. It is recommended the password
    policy prevent the reuse of passwords.
  rationale: Enforcing password history ensures that passwords are not reused in a certain period of time. If a user is not
    allowed to use last 24 passwords, that window of time is greater. This helps maintain the effectiveness of password security.
  impact: ''
  references: []
