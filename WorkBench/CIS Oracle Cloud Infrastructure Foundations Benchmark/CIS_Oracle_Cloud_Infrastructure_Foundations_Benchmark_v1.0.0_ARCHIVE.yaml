- id: '1.9'
  title: Ensure IAM password policy expires passwords within 90 days or less
  scoring: manual
  profile:
  - Level 1
  description: IAM password policies can require passwords to be rotated or expired after a given number of days. It is recommended
    that the password policy expire passwords after 90 days or less.
  rationale: Reducing the life time of a password adds account resiliency. Passwords can be stolen by attackers in various
    ways and enforcing users to change their password periodically reduces that risk window.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Ensure that the number of days configured in Expires after setting is <=90.'
  remediation: 'OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on Change Your Password Policy button.

    4. Update the number of days configured in Expires after setting to 90.'
  checks:
