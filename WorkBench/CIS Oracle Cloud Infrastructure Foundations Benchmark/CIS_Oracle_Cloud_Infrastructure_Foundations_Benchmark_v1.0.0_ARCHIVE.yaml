controls:
- id: '1.1'
  title: Ensure service level admins are created to manage resources of particular service
  scoring: manual
  profile:
  - Level 1
  description: To apply least-privilege security principle, one can create service-level administrators in corresponding groups
    and assigning specific users to each service-level administrative group in a tenancy. This limits administrative access
    in a tenancy. It means service-level administrators can only manage resources of a specific service. Example policies
    for global/tenant level service-administrators Allow group VolumeAdmins to manage volume-family in tenancy Allow group
    ComputeAdmins to manage instance-family in tenancy Allow group NetworkAdmins to manage virtual-network-family in tenancy
    Organizations have various ways of defining service-administrators. Some may prefer creating service administrators at
    a tenant level and some per department or per project or even per application environment ( dev/test/production etc.).
    Either approach works so long as the policies are written to limit access given to the service-administrators. Example
    policies for compartment level service-administrators Allow group NonProdComputeAdmins to manage instance-family in compartment
    dev Allow group ProdComputeAdmins to manage instance-family in compartment production Allow group A-Admins to manage instance-family
    in compartment Project-A Allow group A-Admins to manage volume-family in compartment Project-A
  rationale: Creating service-level administrators helps in tightly controlling access to Oracle Cloud Infrastructure (OCI)
    services to implement the least-privileged security principle. 12 | P a g e
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'From CLI:

    1. Set up OCI CLI with an IAM administrator user who has read access to IAM

    resources such as groups and policies.

    2. Run OCI CLI command providing the root_compartment_OCID

    Get the list of groups in a tenancy

    oci iam group list --compartment-id <root_compartment_OCID> | grep name

    3. Ensure distinct administrative groups are created as per your organization''s

    definition of service-administrators.

    4. Verify the appropriate policies are created for the service-administrators groups to

    have the right access to the corresponding services. Retrieve the policy statements

    scoped at the tenancy level and/or per compartment.

    oci iam policy list --compartment-id <root_compartment_OCID> | grep "in

    tenancy"

    oci iam policy list --compartment-id <root_compartment_OCID> | grep "in

    compartment"

    The --compartment-id parameter can be changed to a child compartment to get policies

    associated with child compartments.

    oci iam policy list --compartment-id <child_compartment_OCID> | grep "in

    compartment"

    Verify the results to ensure the right policies are created for service-administrators to have

    the necessary access.'
  remediation: "Refer to the policy syntax document and create new policies if the audit results indicate\nthat the required\
    \ policies are missing.\nThis can be done via OCI console or OCI CLI/SDK or API.\nCreating a new policy:\nFrom CLI:\n\
    oci iam policy create [OPTIONS]\nCreates a new policy in the specified compartment (either the tenancy or another of your\n\
    compartments). If you're new to policies, see\n13 | P a g e\n [Getting Started with\nPolicies](https://docs.cloud.oracle.com/Content/Identity/Concepts/policygetstarted.htm)\n\
    \ You must specify a name for the policy, which must be unique across all\n policies in your tenancy and cannot be changed.\n\
    \ You must also specify a description for the policy (although it can be an empty string). It\ndoes not have to be unique,\
    \ and you can change it anytime with UpdatePolicy.\n You must specify one or more policy statements in the statements\
    \ array.\n For information about writing policies, see How [Policies\nWork](https://docs.cloud.oracle.com/Content/Identity/Concepts/policies.htm)\
    \ and\n[Common\nPolicies](https://docs.cloud.oracle.com/Content/Identity/Concepts/commonpolicies.htm)."
  checks:
  - type: command
    command: oci iam group list --compartment-id <root_compartment_OCID> | grep name && oci iam policy list --compartment-id
      <root_compartment_OCID> | grep "in && oci iam policy list --compartment-id <root_compartment_OCID> | grep "in && oci
      iam policy list --compartment-id <child_compartment_OCID> | grep "in
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Set up OCI CLI with an IAM administrator user who has read access to IAM

      resources such as groups and policies.

      2. Run OCI CLI command providing the root_compartment_OCID

      Get the list of groups in a tenancy

      oci iam group list --compartment-id <root_compartment_OCID> | grep name

      3. Ensure distinct administrative groups are created as per your organization''s

      definition of service-admini'
- id: '1.2'
  title: Ensure permissions on all resources are given only to the tenancy administrator group
  scoring: manual
  profile:
  - Level 1
  description: 'There is a built-in OCI IAM policy enabling the Administrators group to perform any action within a tenancy.
    In the OCI IAM console, this policy reads: Allow group Administrators to manage all-resources in tenancy Administrators
    create more users, groups, and policies to provide appropriate access to other groups. Administrators should not allow
    any-other-group full access to the tenancy by writing a policy like this - Allow group any-other-group to manage all-resources
    in tenancy The access should be narrowed down to ensure the least-privileged principle is applied.'
  rationale: Permission to manage all resources in a tenancy should be limited to a small number of users in the Administrators
    group for break-glass situations and to set up users/groups/policies when a tenancy is created. No group other than Administrators
    in a tenancy should need access to all resources in a tenancy, as this violates the enforcement of the least privilege
    principle.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'From CLI:

    1. Run OCI CLI command providing the root compartment OCID to get the list of

    groups having access to manage all resources in your tenancy.

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to

    manage all-resources in tenancy"

    15 | P a g e

    2. Verify the results to ensure only the Administrators group has access to manage all

    resources in tenancy.

    "Allow group Administrators to manage all-resources in tenancy"'
  remediation: 'From Console:

    1. Login to OCI console.

    2. Go to Identity -> Policies, In the compartment dropdown, choose the root

    compartment. Open each policy to view the policy statements.

    3. Remove any policy statement that allows any group other than Administrators or

    any service access to manage all resources in the tenancy.

    The policies can also be updated via OCI CLI/SDK/API.

    Note: You should generally not delete the policy that allows the Administrators group the

    ability to manage all resources in the tenancy.'
  checks:
  - type: command
    command: oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Run OCI CLI command providing the root compartment OCID to get the list of

      groups having access to manage all resources in your tenancy.

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i "to

      manage all-resources in tenancy"

      15 | P a g e

      2. Verify the results to ensure only the Administrators group has access to manage all

      resources in tenancy.

      "Allow group Adminis'
- id: '1.3'
  title: Ensure IAM administrators cannot update tenancy Administrators group
  scoring: manual
  profile:
  - Level 1
  description: 'Tenancy administrators can create more users, groups, and policies to provide other service administrators
    access to OCI resources. For example, an IAM administrator will need to have access to manage resources like compartments,
    users, groups, dynamic-groups, policies, identity-providers, tenancy tagnamespaces, tag-definitions in the tenancy. The
    policy that gives IAM-Administrators or any other group full access to ''groups'' resources should not allow access to
    the tenancy ''Administrators'' group. The policy statements would look like - Allow group IAMAdmins to inspect users in
    tenancy Allow group IAMAdmins to use users in tenancy where target.group.name != ''Administrators'' Allow group IAMAdmins
    to inspect groups in tenancy Allow group IAMAdmins to use groups in tenancy where target.group.name != ''Administrators''
    Note: You must include separate statements for ''inspect'' access, because the target.group.name variable is not used
    by the ListUsers and ListGroups operations'
  rationale: These policy statements ensure that no other group can manage tenancy administrator users or the membership to
    the 'Administrators' group thereby gain or remove tenancy administrator access.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From CLI:

    1. Run the following OCI CLI commands providing the root_compartment_OCID

    17 | P a g e

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

    use users in tenancy"

    oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

    use groups in tenancy"

    2. Verify the results to ensure that the policy statements that grant access to use or

    manage users or groups in the tenancy have a condition that excludes access to

    Administrators group or to users in the Administrators group.'
  remediation: 'From Console:

    1. Login to OCI Console.

    2. Select Identity from Services Menu.

    3. Select Policies from Identity Menu.

    4. Click on an individual policy under the Name heading.

    5. Ensure Policy statements look like this -

    Allow group IAMAdmins to use users in tenancy **where target.group.name !=

    ''Administrators''

    Allow group IAMAdmins to use groups in tenancy **where target.group.name !=

    ''Administrators'''
  checks:
  - type: command
    command: oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to && oci iam policy list --compartment-id
      <root_compartment_OCID> | grep -i " to
    expected: ''
    severity: medium
    info: 'From CLI:

      1. Run the following OCI CLI commands providing the root_compartment_OCID

      17 | P a g e

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

      use users in tenancy"

      oci iam policy list --compartment-id <root_compartment_OCID> | grep -i " to

      use groups in tenancy"

      2. Verify the results to ensure that the policy statements that grant access to use or

      manage users or gro'
- id: '1.4'
  title: Ensure IAM password policy requires minimum length of 14 or greater
  scoring: manual
  profile:
  - Level 1
  description: Password policies are used to enforce password complexity requirements. IAM password policies can be used to
    ensure password are at least a certain length. It is recommended the password policy require a minimum password length
    14 characters.
  rationale: Setting a password complexity policy increases account resiliency against brute force login attempts.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'OCI Native IAM

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Ensure the number 14 is entered into the box below the text: MINIMUM PASSWORD

    LENGTH (IN CHARACTERS).

    OCI Identity Cloud Service (IDCS)

    If you use IDCS to login to OCI, verify the password policy settings in IDCS

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Verify the Password length min size setting.'
  remediation: 'OCI Native IAM

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    19 | P a g e

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Type the number 14 into the box below the text: MINIMUM PASSWORD LENGTH (IN

    CHARACTERS).

    OCI Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on Change Your Password Policy button.

    4. Update the Password length min size setting to 14 and Save.'
  checks:
  - type: sql
    command: Select Authentication Settings from the Identity menu.
    severity: medium
    info: 'OCI Native IAM

      From Console:

      1. Login to the OCI Console

      2. Go to Identity in the Services menu.

      3. Select Authentication Settings from the Identity menu.

      4. Click Edit in the middle of the page.

      5. Ensure the number 14 is entered into the box below the text: MINIMUM PASSWORD

      LENGTH (IN CHARACTERS).

      OCI Identity Cloud Service (IDCS)

      If you use IDCS to login to OCI, verify the password policy setti'
