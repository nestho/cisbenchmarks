- id: 2.4.10
  title: Disable Content Caching
  scoring: scored
  profile:
  - Level 2
  description: Starting with 10.13 (macOS High Sierra) Apple introduced a service to make it easier to deploy changes from
    Apple, including software updates, where there are bandwidth constraints to the Internet and fewer constraints and greater
    bandwidth on the local subnet. This capability can be very valuable for organizations that have throttled and possibly
    metered Internet connections. In heterogeneous enterprise networks with multiple subnets the effectiveness of this capability
    would be determined on how many Macs were on each subnet at the time new large updates were made available upstream. This
    capability requires the use of mac OS clients as P2P nodes for updated Apple content. Unless there is a business requirement
    to manage operational Internet connectivity bandwidth user endpoints should not store content and act as a cluster to
    provision data. https://support.apple.com/en-us/HT204675
  rationale: The main use case for Mac computers is as mobile user endpoints. P2P sharing services should not be enabled on
    laptops that are using untrusted networks. Content Caching can allow a computer to be a server for local nodes on an untrusted
    network. While there are certainly logical controls that could be used to mitigate risk, they add to the management complexity,
    since the value of the service is in specific use cases organizations with the use case described above can accept risk
    as necessary.
  impact: 'This setting will adversely affect bandwidth usage between local subnets and the Internet. Notes: https://support.apple.com/guide/mac-help/about-content-cachingmchl9388ba1b/10.15/mac/10.15
    https://support.apple.com/en-us/HT204675 https://support.apple.com/guide/mac-help/set-up-content-caching-on-macmchl3b6c3720/10.15/mac/10.15'
