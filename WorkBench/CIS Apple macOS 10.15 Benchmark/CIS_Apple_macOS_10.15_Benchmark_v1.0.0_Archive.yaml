- id: '5.19'
  title: System Integrity Protection status
  scoring: scored
  profile:
  - Level 1
  description: 'System Integrity Protection is a security feature introduced in OS X 10.11 El Capitan. System Integrity Protection
    restricts access to System domain locations and restricts runtime attachment to system processes. Any attempt to inspect
    or attach to a system process will fail. Kernel Extensions are now restricted to /Library/Extensions and are required
    to be signed with a Developer ID. The full list of applications and top level directories protected by SIP are listed
    in the rootless.conf file. cat /System/Library/Sandbox/rootless.conf More information available here: https://derflounder.wordpress.com/2015/10/01/system-integrity-protection-addinganother-layer-to-apples-security-model/'
  rationale: Running without System Integrity Protection on a production system runs the risk of the modification of system
    binaries or code injection of system processes that would otherwise be protected by SIP.
  impact: System binaries and processes could become compromised
  references: []
  page_start: 202
  audit_raw: 'Perform the following to determine the System Integrity Protection status.

    1. Run the following command in Terminal:

    /usr/bin/csrutil status

    2. The output should be:

    System Integrity Protection status: enabled.

    202 | P a g e'
  remediation: 'Perform the following while booted in macOS Recovery Partition.

    1. Select Terminal from the Utilities menu

    2. Run the following command in Terminal:

    /usr/bin/csrutil enable

    3. The output should be:

    Successfully enabled System Integrity Protection. Please restart the machine

    for the changes to take effect.

    4. Reboot.

    If a change to the status is attempted from the booted Operating System rather than the

    recovery partition an error will be generated.

    csrutil: failed to modify system integrity configuration. This tool needs to

    be executed from the Recovery OS.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine the System Integrity Protection status.

      1. Run the following command in Terminal:

      /usr/bin/csrutil status

      2. The output should be:

      System Integrity Protection status: enabled.

      202 | P a g e'
    severity: medium
