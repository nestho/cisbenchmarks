- id: '3.2'
  title: Configure Security Auditing Flags per local organizational requirements
  scoring: scored
  profile:
  - Level 2
  description: Auditing is the capture and maintenance of information about security-related events. Auditable events often
    depend on differing organizational requirements.
  rationale: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises or attacks that have occurred, have begun, or are about to begin. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised. Depending on the governing authority
    organizations can have vastly different auditing requirements. In order to make a specific decision on which flags to
    check for a single standard on flags would have to exist for the uses of this Benchmark. At this point I don't see one.
    Some have suggested the use of an "any" flag, which would have to be an alternate check. It appears that many or statements
    would have to be used to make this a successfully scored control, and even this some will be dissatisfied. URL references
    to audit flag discussions are under references. Please follow best practices and organizational compliance requirements.
    Additional Information /usr/bin/grep :lo$ /private/etc/security/audit_event | /usr/bin/awk -F ":" '{ print $2 }' sudo
    cat /etc/security/audit_class 122 | P a g e
