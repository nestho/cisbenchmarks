- id: 6.1.2
  title: Disable "Show password hints"
  scoring: scored
  profile:
  - Level 1
  description: Password hints are user created text displayed when an incorrect password is used for an account.
  rationale: Password hints make it easier for unauthorized persons to gain access to systems by providing information to
    anyone that the user provided to assist remembering the password. This info could include the password itself or other
    information that might be readily discerned with basic knowledge of the end user.
  impact: The user can set the hint to any value including the password itself or clues that allow trivial social engineering
    attacks.
  references: []
