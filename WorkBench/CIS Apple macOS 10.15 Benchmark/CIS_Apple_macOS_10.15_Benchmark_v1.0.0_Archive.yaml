- id: '7.14'
  title: Touch ID
  scoring: scored
  profile:
  - Level 2
  description: Apple has integrated Touch ID with macOS and allows fingerprint use for many common operations. All use of
    Touch ID requires the presence of a password and the use of that password after every reboot or where it has been more
    than 48 hours since the device was last unlocked. Touch ID is integrated with Apple Pay, Safari AutoFill and all Apple
    store payment options. Touch ID may be managed by profiles to exclude unacceptable activities depending on the environment.
    There should be few organizations that cannot utilize some of the TOuch ID functionality. https://support.apple.com/en-us/HT204587
