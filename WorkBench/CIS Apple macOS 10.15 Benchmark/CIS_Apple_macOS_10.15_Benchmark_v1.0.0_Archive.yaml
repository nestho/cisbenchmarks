      defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

      ''(ConfigDataInstall|CriticalUpdateInstall)''

      2. Make sure the result is: ConfigDataInstall = 1; CriticalUpdateInstall = 1;

      If automatic updates were selected '
    severity: medium
- id: '1.6'
  title: Enable macOS update installs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that macOS updates are installed after they are available from Apple. This setting enables macOS updates
    to be automatically installed. Some environments will want to approve and test updates before they are delivered. It is
    best practice to test first where updates can and have caused disruptions to operations. Automatic updates should be turned
    off where changes are tightly controlled and there are mature testing and approval processes. Automatic updates should
    not be turned off so the admin can call the users first to let them know it's ok to install. A dependable repeatable process
    involving a patch agent or remote management tool should be in place before auto-updates are turned off. Additional Information
    https://derflounder.wordpress.com/2018/12/28/enabling-automatic-macos-softwareupdates-for-os-x-yosemite-through-macos-mojave/
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited 25 | P a
    g e
  impact: Unpatched software may be exploited
  references: []
  page_start: 25
  audit_raw: '1. Open System Preferences

    2. Select Software Update (While open Software Update will check whether

    outstanding patches are available from Apple)

    3. Select Advanced

    4. Select Install macOS updates

    5. Verify that all available updates and software patches are installed.

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticallyInstallMacOSUpdates

    2. Make sure the result is: 1

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.

    26 | P a g e'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable install system

    data files and security updates:

    sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticallyInstallMacOSUpdates -bool true'
  checks:
