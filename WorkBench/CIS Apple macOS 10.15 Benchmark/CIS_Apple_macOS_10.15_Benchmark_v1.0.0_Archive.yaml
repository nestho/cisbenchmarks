- id: '5.5'
  title: Automatically lock the login keychain for inactivity
  scoring: scored
  profile:
  - Level 2
  description: The login keychain is a secure database store for passwords and certificates and is created for each user account
    on macOS. The system software itself uses keychains for secure storage. Anyone with physical access to an unlocked keychain
    where the screen is also unlocked can copy all passwords in that keychain. Application access to the login keychain does
    not keep it unlocked. If you set Apple Mail to check for email every 10 minutes using the keychain for credentials and
    the keychain to lock every 15 minutes if inactive it will still cause the keychain to lock. The approach recommended here
    is that the login keychain be set to periodically lock when inactive to reduce the risk of password exposure or unauthorized
    use of credentials by a third party. The time period that an organization uses will depend on how great the use is of
    keychain aware applications. Organizations that use Firefox and Thunderbird will have a much different tolerance than
    those organization using keychain aware applications extensively.
  rationale: While logged in, the keychain does not prompt the user for passwords for various systems and/or programs. This
    can be exploited by unauthorized users to gain access to password protected programs and/or systems in the absence of
    the user. Timing out the keychain can reduce the exploitation window.
  impact: If the timeout is set too low on heavily used items the user will be annoyed and may use workarounds.
  references: []
  page_start: 174
  audit_raw: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal:

    security show-keychain-info

    2. Verify that a value is returned below 6 hours: Keychain "<NULL>" timeout=21600s

    174 | P a g e'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open Utilities

    2. Select Keychain Access

    3. Select a keychain

    4. Select Edit

    5. Select Change Settings for keychain <keychain_name>

    6. Authenticate, if requested.

    7. Change the Lock after # minutes of inactivity setting for the Login Keychain to an

    approved value that should NOT be longer than 6 hours or 360 minutes or based on

    the access frequency of the security credentials included in the keychain for other

    keychains.'
  checks:
  - type: manual_review
    info: 'Perform the following to implement the prescribed state:

      1. Run the following command in Terminal:

      security show-keychain-info

      2. Verify that a value is returned below 6 hours: Keychain "<NULL>" timeout=21600s

      174 | P a g e'
    severity: medium
