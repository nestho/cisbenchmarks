- id: '2.8'
  title: Pair the remote control infrared receiver if enabled
  scoring: scored
  profile:
  - Level 1
  description: An infrared receiver is a piece of hardware that sends information from an infrared remote control to another
    device by receiving and decoding signals. If a remote is used with a computer, a specific remote, or "pair", can be set-up
    to work with the computer. This will allow only the paired remote to work on that computer. If a remote is needed the
    receiver should only be accessible by a paired device. Many models do not have infrared hardware. The audit check looks
    for the hardware first.
  rationale: An infrared remote can be used from a distance to circumvent physical security controls. A remote could also
    be used to page through a document or presentation, thus revealing sensitive information. While Apple hardware that still
    supports infrared is uncommon and has not been manufactured in years it still does exist. This control checks first for
    the presence of an IR receiver so systems that do not have IR will quickly pass this control check.
