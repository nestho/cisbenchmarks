      198 | P a g e'
    severity: medium
- id: '5.18'
  title: Create specialized keychains for different purposes
  scoring: scored
  profile:
  - Level 2
  description: The keychain is a secure database store for passwords and certificates and is created for each user account
    on macOS. The system software itself uses keychains for secure storage. Users can create more than one keychain to protect
    various passwords separately.
  rationale: If the user can logically split password and other entries into different keychains with different passwords,
    a compromise of one password will have limited effect.
  impact: 'Using multiple keychains can be inconvenient. It is also not necessarily possible for all kinds of data, such as
    Safari auto-fill information, to be stored in secondary keychains. Not all keychain-aware applications may provide an
    interface to choose secondary keychains. Notes: One useful separation of keychains might be in a business environment.
    Personal information might be stored in one keychain and business information in a different keychain.'
