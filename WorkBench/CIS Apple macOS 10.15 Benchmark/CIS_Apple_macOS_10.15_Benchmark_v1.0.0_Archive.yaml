  title: Firewall Consideration
  scoring: scored
  profile:
  - Level 2
  description: 'In addition to the Application Layer Firewall (alf) mentioned in the benchmark, macOS also ships with packet
    filter, or pf. Leveraging pf is beyond the scope of this Benchmark. For more information, please see: https://blog.neilsabol.site/post/quickly-easily-adding-pf-packet-filter-firewall-rulesmacos-osx/
