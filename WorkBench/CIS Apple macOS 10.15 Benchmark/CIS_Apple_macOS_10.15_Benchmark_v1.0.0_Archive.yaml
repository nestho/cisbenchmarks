- id: '7.19'
  title: Screen Time
  scoring: scored
  profile:
  - Level 2
  description: 'Screen Time is Apple''s technology monitoring application for the entire family and for educational markets.
    It replaces Parental Controls and allows for an administrator to manage usage patterns and access across macOS and iOS
    based on Apple IDs. While this is far more useful for parents to manage mult-device use across Apple platforms it is less
    designed as a macOS management platform for avoiding the use of profile management on Enterprise controlled Macs. While
    there are many interesting statistics that even users might want to monitor for usage patterns they are mainly interesting
    for data mining HR departments, especially residential home HR departments where the employees are under age, rather than
    enterprise device security. https://www.imore.com/parental-controls-mac-ultimate-guide https://thecybersafetylady.com.au/2019/10/new-parental-controls-for-apple-mac-p-cscatalina/
