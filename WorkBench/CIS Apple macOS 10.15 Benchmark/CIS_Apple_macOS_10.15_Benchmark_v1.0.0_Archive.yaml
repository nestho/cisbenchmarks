- id: '7.2'
  title: iSight Camera Privacy and Confidentiality Concerns
  scoring: scored
  profile:
  - Level 2
  description: If the computer is present in an area where there are privacy concerns or sensitive images or actions are taking
    place the camera should be covered at those times. A permanent cover or alteration may be required when the computer is
    always located in a confidential area. Malware is continuously discovered that circumvents the privacy controls of the
    built-in camera. No computer has perfect security and it seems likely that even if all the drivers are disabled or removed
    that working drivers can be re-introduced by a determined attacker. At this point video chatting and other uses of the
    built-in camera are standard uses for a computer. It is contrary to a standard use case to permanently remove the camera.
    In cases where the camera is not allowed to be used at all or when the computer is located in private areas additional
    precautions are warranted. The General rule should be that if the camera can capture images that could cause embarrassment
    or an adverse impact the camera should be covered until it is appropriate to use.
  rationale: ''
  impact: ''
  references: []
  page_start: 222
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.3'
  title: Computer Name Considerations
  scoring: scored
  profile:
  - Level 2
  description: If the computer is used in an organization that assigns host names, it is a good idea to change the computer
    name to the host name. This is more of a best practice than a security measure. If the host name and the computer name
    are the same, computer support may be able to track problems down more easily. With mobile devices using DHCP IP tracking
    has serious drawbacks, hostname or computer name tracking makes much more sense for those organizations that can implement
    it. If the computer is using different names for the "Computer Name" DNS and Directory environments it can be difficult
    to manage Macs in an Enterprise asset inventory.
  rationale: ''
  impact: ''
  references: []
  page_start: 223
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '7.4'
  title: Software Inventory Considerations
  scoring: scored
  profile:
  - Level 2
  description: 'With the introduction of Mac OS X 10.6.6, Apple added a new application, App Store, which resides in the Applications
    directory. This application allows a user with admin privileges and an Apple ID to browse Apple''s online App Store, purchase
    (including no cost purchases), and install new applications, bypassing Enterprise software inventory controls. Any admin
    user can install software in the /Applications directory whether from internet downloads, thumb drives, optical media,
    cloud storage or even binaries through email. Even standard users can run executables if permitted. The source of the
    software is not nearly as important as a consistent audit of all installed software for patch compliance and appropriateness.
    A single user desktop where the user, administrator and the person approving software are all the same person probably
    does not need to audit software inventory to this extent. It is helpful in the case of stability problems or malware however.
    Scan systems on a monthly basis and determine the number of unauthorized pieces of software that are installed. Verify
    that if an unauthorized piece of software is found one month, it is removed from the system the next. Export System Information
    through the built-in System Information Application or other third party tools on an organizationally defined timetable.
    System Information is available through the GUI and the command line: Apple icon menu > About this Mac > System Report
    > File > Save or Applications > Utilities > System Information In the CLI system_profiler man system_profiler https://support.apple.com/en-us/HT203001
    224 | P a g e Notes: Inventory and Control of Software Assets'
  rationale: ''
  impact: ''
  references: []
  page_start: 224
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
