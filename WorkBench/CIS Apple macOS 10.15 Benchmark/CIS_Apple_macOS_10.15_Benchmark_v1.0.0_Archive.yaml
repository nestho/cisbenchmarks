- id: '5.10'
  title: Ensure system is set to hibernate and Destroy FileVault key
  scoring: scored
  profile:
  - Level 2
  description: In order to use a computer with Full Disk Encryption (FDE) macOS must keep encryption keys in memory to allow
    the use of the disk that has been FileVault protected. The storage volume has been unlocked and acts as if it was not
    encrypted. When the system is not in use the volume is protected through encryption. When the system is sleeping and available
    to quickly resume the encryption keys remain in memory. If an unauthorized party has possession of the computer and the
    computer is only slept there are known attack vectors that can be attempted against the RAM that has the encryption keys
    or the running operating system that is protected by a login screen. Network attacks if network interfaces are on as well
    as USB or other open device ports are possible. Most of these attacks require knowledge of unpatched vulnerabilities or
    a high level of sophistication if all the other controls function as intended. There is little impact on hibernating the
    system rather than sleeping after an appropriate time period to remediate the risk of OS level attacks. Hibernation writes
    the keys to disk and requires FileVault to be unlocked prior to the OS being available. In the case of unauthorized personnel
    with access to the computer encryption would have to be broken prior to attacking the operating system in order to recover
    data from the system. https://www.helpnetsecurity.com/2018/08/20/laptop-sleep-security/ Apple has provided settings for
    standby delay as well as a "highstandbythreshold" setting. From man pmset standbydelayhigh and standbydelaylow specify
    the delay, in seconds, before writing the hibernation image to disk and powering off memory for Standby. standbydelayhigh
    is used when the remaining battery capacity is above highstandbythreshold, and standbydelaylow is used when the remaining
    battery capacity is below highstandbythreshold Apple also has provide a setting so that FileVault key is destroyed on
    hibernate. 184 | P a g e destroyfvkeyonstandby - Destroy File Vault Key when going to standby mode. By default File vault
    keys are retained even when system goes to standby. If the keys are destroyed, user will be prompted to enter the password
    while coming out of standby mode
  rationale: To mitigate the risk of data loss the system should power down and lock the encrypted drive after a specified
    time. Laptops should hibernate after 10 minutes or less after sleeping and the FileVault key should be destroyed. Users
    will be prompted to decrypt before use.
  impact: 'The laptop will take additional time to resume normal operation then if only sleeping rather than hibernating.
    Notes: There are several good references to the concerns about ensuring hibernation rather than sleep is in place. A selection
    below: https://www.zdziarski.com/blog/?p=6705 https://www.howtogeek.com/260478/how-to-choose-when-your-mac-hibernates-orenters-standby/
    https://www.lifewire.com/change-mac-sleep-settings-2260804 Maximize FileVault Security by Destroying Key Storage in Standby
    Mode Power Management in detail: using pmset'
  references: []
  page_start: 184
  audit_raw: 'Perform the following to ensure computers are configured as prescribed:

    1. If there are any results the system is in scope for a non-default hibernation value

    pmset -g | egrep standby

    The results should be

    standbydelayhigh 600

    standbydelaylow 600

    highstandbythreshold 90

    Both standbydelayhigh and standbydelaylow should be 600 or less.

    highstandbythreshold should be 90 or higher

    2. Ensure FileVault key is destroyed on standby

    pmset -g |egrep DestroyFVKeyOnStandby

    DestroyFVKeyOnStandby 1

    185 | P a g e'
  remediation: 'Perform the following to configure laptops as prescribed:

    1. Run the following commands in Terminal:

    sudo pmset -a standbydelayhigh 600

    sudo pmset -a highstandbythreshold 90

    sudo pmset -a highstandbythreshold 90

    sudo pmset -a destroyfvkeyonstandby 1'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure computers are configured as prescribed:

      1. If there are any results the system is in scope for a non-default hibernation value

      pmset -g | egrep standby

