  description: Over time passwords can be captured by third parties through mistakes, phishing attacks, third party breaches
    or merely brute force attacks. To reduce the risk of exposure and to decrease the incentives of password reuse (passwords
    that are not forced to be changed periodically generally are not ever changed) users should reset passwords periodically.
    This control uses 365 days as the acceptable value, some organizations may be more or less restrictive. This control mainly
    exists to mitigate against password reuse of the macOS account password in other realms that may be more prone to compromise.
