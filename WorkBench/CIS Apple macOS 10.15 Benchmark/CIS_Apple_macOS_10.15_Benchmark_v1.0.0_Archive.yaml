- id: '2.10'
  title: Securely delete files as needed
  scoring: scored
  profile:
  - Level 2
  description: 'In previous versions of macOS Apple included a capability to securely empty the trash that included overwrites
    of the existing data. With the wider use of FileVault and other encryption methods and the growing use of Solid State
    Drives the requirements have changed and the "Secure Empty Trash" capability has been removed from the GUI. For systems
    that are not using encryption and continue to use platter-based hard drives there is residual risk that deleted files
    can still be recovered from the file system. In previous versions of the Benchmark srm was mentioned as an alternative
    to the removal of "Secure Empty Trash." With the release of macOS 10.12 srm has been removed. There is still an option
    to erase free space from the command line but Apple has warned that encryption is a better solution From manual entry
    for diskutil NOTE: This kind of secure erase is no longer considered safe. Modern devices have wearleveling, block-sparing,
    and possibly-persistent cache hardware, which cannot be completely erased by these commands. The modern solution for quickly
    and securely erasing your data is encryption. Strongly-encrypted data can be instantly "erased" by destroying (or losing)
    the key (password), because this renders your data irretrievable in practical terms. Consider using APFS encryption (File-Vault).
    diskutil secureErase freespace 0 /'
  rationale: Securely removing files mitigates the risk of an admin user on the system recovering sensitive files that the
    user has deleted. It is possible for anyone with physical access to the device to get access if FileVault is not used,
    or to recover deleted data if the FileVault volume is already mounted. Users and admins of computers containing sensitive
    information should be screened appropriately or additional security controls should be in place to prevent unauthorized
    access to sensitive information. 113 | P a g e
  impact: Securely deleting files can take a long time, with FileVault in place the protection is erasing data within an already
    encrypted volume.
  references: []
  page_start: 113
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
