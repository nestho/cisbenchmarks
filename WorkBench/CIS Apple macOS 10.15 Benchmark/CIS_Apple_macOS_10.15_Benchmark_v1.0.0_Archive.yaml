  scoring: scored
  profile:
  - Level 2
  description: macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant
    information to users. While location services may be very useful it may not be desirable to allow all applications that
    can use location services to use your location for Internet queries to provide tailored content based on your current
    location. Ensure that the applications that can use Location Services are authorized to use that information and possibly
    provide data back to the software vendor and chosen affiliates that are trusted or used by the software vendor. Where
    user data is the product user trusted software vendors may allow access to user and machine data to data-mining companies
    that are not user trusted. Apple provides feedback within System Preferences and may be enabled to provide information
    on the menu bar when Location Services are used. Safari can deny access from websites or prompt for access. Applications
    that support Location Services can be individually controlled in the Privacy tab in Security & Privacy under System Preferences.
    Access should be evaluated to ensure that privacy controls are as expected.
  rationale: Privacy controls should be monitored for appropriate settings
  impact: Many macOS services rely on location services for tailored services. Users expect their time zone and weather to
    be relevant to where they are without manual intervention. Find my Mac does need to know where your Mac actually is. Where
    possible the tolerance between location privacy and convenience may be best left to the user when the location itself
    is not sensitive. If facility locations are not public location information should be tightly controlled
