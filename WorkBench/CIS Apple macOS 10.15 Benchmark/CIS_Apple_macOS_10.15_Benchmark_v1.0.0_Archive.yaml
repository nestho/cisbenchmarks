- id: '2.12'
  title: Disable "Wake for network access" and "Power Nap"
  scoring: scored
  profile:
  - Level 1
  description: These two features allow the computer to take action when the user is not present and the computer is in energy
    saving mode. These tools require FileVault to remain unlocked and able to attempt to reconnect to known networks, including
    any wireless SSIDs with cached credentials. These macOS features are meant to allow the computer to resume activity as
    needed regardless of physical security controls. Wake for network access This feature allows other users to be able to
    access your computer’s shared resources, such as shared printers or iTunes playlists, even when your computer is in sleep
    mode. In a closed network when only authorized devices could wake a computer it could be valuable to wake computers in
    order to do management push activity. Where mobile workstations and agents exist the device will more likely check in
    to receive updates when already awake. Mobile devices should not be listening for signals on networks where the managed
    state is unknown, and where untrusted devices could send wake signals. Power Nap Power Nap allows the system to stay in
    low power mode, especially while on battery power and periodically connect to previously named networks with stored credentials
    for user applications to phone home and get updates. This capability requires FileVault to remain unlocked and the use
    of previously joined networks to be risk accepted based on the SSID without user input
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access. 117 |
    P a g e
  impact: Management programs like Apple Remote Desktop Administrator use wake-on-LAN to connect with computers. If turned
    off, such management programs will not be able to wake a computer over the LAN. If the wake-on-LAN feature is needed,
    do not turn off this feature. Power Nap exists for unattended user application updates like email and social media clients.
    if the computer must always be updated with the latest client information it can be left on, plugged in and the display
    dimmed. If AC power is not available the use case correlates with possibly compromised physical and logical security.
    The user should be able to decrypt FileVault and have the applications download what is required when the computer is
    actively used. The control to prevent computer sleep has been retired for this version of the Benchmark. Forcing the computer
    to stay on and use energy in case a management push is needed is contrary to most current management processes. Only keep
    computers unslept if after hours pushes are required on closed LANs.
  references: []
  page_start: 117
  audit_raw: 'Perform the following to ensure the system is configured as prescribed for Wake for

    network access:

    Run the following command in Terminal:

    pmset -g | egrep womp

    verify the value returned is " womp 0"

    Perform the following to ensure the system is configured as prescribed for Power Nap:

    Run the following command in Terminal:

    pmset -g | egrep powernap

    verify the value returned is " powernap 0"

    118 | P a g e'
  remediation: 'Perform the following to implement the prescribed state Wake for network access:

    Run the following command in Terminal:

    sudo pmset -a womp 0

    Perform the following to implement the prescribed state for Power Nap:

    Run the following command in Terminal:

    sudo pmset -a powernap 0'
  checks:
