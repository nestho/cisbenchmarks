  title: Automatic Actions for Optical Media
  scoring: scored
  profile:
  - Level 1
  description: Managing automatic actions, while useful in very few situations, is unlikely to increase security on the computer
    and does complicate the users experience and add additional complexity to the configuration. These settings are user controlled
    and can be changed without Administrator privileges unless controlled through MCX settings or Parental Controls. Unlike
    Windows Auto-run the optical media is accessed through Operating System applications, those same applications can open
    and access the media directly. If optical media is not allowed in the environment the optical media drive should be disabled
    in hardware and software https://support.apple.com/guide/mac-help/choose-actions-for-blank-discs-on-macmchlp2712/mac
