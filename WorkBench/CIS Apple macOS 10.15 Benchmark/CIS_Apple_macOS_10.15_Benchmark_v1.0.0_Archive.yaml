  description: Apple developed a new file system that was first made available in 10.12 and then became the default in 10.13.
    The file system is optimized for Flash and Solid State storage and encryption. https://en.wikipedia.org/wiki/Apple_File_System
    macOS computers generally have several volumes created as part of APFS formatting including Preboot, Recovery and Virtual
    Memory (VM) as well as traditional user disks. All APFS volumes that do not have specific roles that do not require encryption
    should be encrypted. "Role" disks include Preboot, Recovery and VM. User disks are labelled with "(No specific role)"
    by default. Apple introduced Core Storage with 10.7. It is used as the default for formatting on macOS volumes prior to
    10.13. All HFS and Core Storage Volumes should be encrypted
  rationale: In order to protect user data from loss or tampering volumes carrying data should be encrypted In order to protect
    user data from loss or tampering volumes carrying data should be encrypted
  impact: While FileVault protects the boot volume data may be copied to other attached storage and reduce the protection
    afforded by FileVault. Ensure all user volumes are encrypted to protect data. While FileVault protects the boot volume
