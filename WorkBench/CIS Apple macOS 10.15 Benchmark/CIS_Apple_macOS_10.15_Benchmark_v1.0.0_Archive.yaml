    information to users. Users do not need to change the time or the time zone, the computer will do it for them. They do
    not need to specify their location for weather or travel times and even get alerts on travel times to meetings and appointment
    where location information is supplied. For the purpose of asset management and time and log management with mobile computers
    location services simplify some processes. There are some use cases where it is important that the computer not be able
    to report its exact location. While the general use case is to enable Location Services, it should not be allowed if the
    physical location of the computer and the user should not be public knowledge. https://support.apple.com/en-us/HT204690
