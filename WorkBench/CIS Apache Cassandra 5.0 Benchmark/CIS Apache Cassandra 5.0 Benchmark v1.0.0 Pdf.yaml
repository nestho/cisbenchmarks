controls:
- id: '1.1'
  title: Ensure a separate user and group exist for Cassandra
  scoring: manual
  profile:
  - Level 1 - Cassandra on Linux
  description: Create separate userid and group for Cassandra.
  rationale: All processes need to run as a user with least privilege. This mitigates the potential impact of malware to the
    system.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Logon to the server where Cassandra is installed.

    To confirm existence of the group, execute the following command:

    $ getent group | grep cassandra

    To confirm existence of the user, execute the following command:

    $ getent passwd | grep cassandra

    If either the group or user do not exist, or if the user is not a member of the group, this is

    a finding.'
  remediation: 'Create a group for cassandra(if it does not already exist)

    sudo groupadd cassandra

    Create a user which is only used for running Cassandra and its related processes.

    sudo useradd -m -d /home/cassandra -s /bin/bash -g cassandra -u

    <USERID_NUMBER> cassandra

    Replacing <USERID_NUMBER> with a number not already used on the server'
  checks:
  - type: command
    command: $ getent group | grep cassandra && $ getent passwd | grep cassandra
    expected: ''
    severity: medium
    info: 'Logon to the server where Cassandra is installed.

      To confirm existence of the group, execute the following command:

      $ getent group | grep cassandra

      To confirm existence of the user, execute the following command:

      $ getent passwd | grep cassandra

      If either the group or user do not exist, or if the user is not a member of the group, this is

      a finding.'
- id: '1.2'
  title: Ensure the latest version of Java is installed
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: A prerequisite to installing Cassandra is the installation of Java. The version of Java installed should be
    the most recent that is compatible with the organization's operational needs.
  rationale: Using the most recent Java SDK version can help limit the possibilities for vulnerabilities in the software,
    the installation version applied during setup should be established according to the needs of the organization. Ensure
    you are using a release that is covered by a level of support which includes regular updates to address vulnerabilities.
  impact: ''
  references:
  - 1. http://www.oracle.com/technetwork/java/javase/downloads/index-jsp138363.html#javasejdk
  - 2. http://openjdk.java.net/
  page_start: 19
  audit_raw: 'To verify that you have the correct version of java installed:

    # java -version

    java version "1.8.0_172"

    Java(TM) SE Runtime Environment (build 1.8.0_172-b11)

    If an old/unsupported version of Java is installed this is a finding.

    Apache Cassandra expects a version of 1.8.

    NOTE: Experimental support for Java 11 was added in Cassandra 4.0 (CASSANDRA9608). Running Cassandra on Java 11 is experimental.
    Do so at your own risk.'
  remediation: '1. Uninstall the old/unsupported version of Java, if present.

    2. Download the latest compatible release of the Java JDK, or OpenJDK.

    3. Follow the provided installation instructions to complete the install.'
  checks:
  - type: manual_review
    info: 'To verify that you have the correct version of java installed:

      # java -version

      java version "1.8.0_172"

      Java(TM) SE Runtime Environment (build 1.8.0_172-b11)

      If an old/unsupported version of Java is installed this is a finding.

      Apache Cassandra expects a version of 1.8.

      NOTE: Experimental support for Java 11 was added in Cassandra 4.0 (CASSANDRA9608). Running Cassandra on Java 11 is experimental.
      Do so at your own risk.'
    severity: medium
