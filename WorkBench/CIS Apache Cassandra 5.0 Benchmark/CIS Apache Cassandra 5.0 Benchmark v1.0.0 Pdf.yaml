- id: '5.1'
  title: Inter-node Encryption
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: Cassandra offers the option to encrypt data in transit between nodes on the cluster. By default, inter-node
    encryption is turned off.
  rationale: Data being transferred on the wire should be encrypted to avoid network snooping, whether legitimate or not.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/operating/security.html
  page_start: 57
  audit_raw: 'Run the following command to verify whether inter-node encryption is enabled.

    cat cassandra.yaml | grep -in "internode_encryption:"

    Acceptable values are all, dc or rack. If the internode_encryption is set to none,

    this is a finding.

    Note: The Cassandra configuration files can be found in the conf directory of tarballs.

    For packages, the configuration files will be located in /etc/cassandra.'
  remediation: 'The inter-node encryption should be implemented before anyone accesses the

    Cassandra server.

    To enable the inter-node encryption mechanism:

    1. Stop the Cassandra database.

    2. If not done so already, build out your keystore and truststore.

    3. Modify cassandra.yaml file to modify/add entry for internode_encryption:

    set it to all

    4. Start the Cassandra database.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -in "internode_encryption:"
    expected: ''
    severity: medium
    info: 'Run the following command to verify whether inter-node encryption is enabled.

      cat cassandra.yaml | grep -in "internode_encryption:"

      Acceptable values are all, dc or rack. If the internode_encryption is set to none,

      this is a finding.

      Note: The Cassandra configuration files can be found in the conf directory of tarballs.

      For packages, the configuration files will be located in /etc/cassandra.'
- id: '5.2'
  title: Client Encryption
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: Cassandra offers the option to encrypt data in transit between the client and nodes on the cluster. By default
    client encryption is turned off.
  rationale: Data in transit between the client and node on the cluster should be encrypted to avoid network snooping, whether
    legitimate or not.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/operating/security.html
  page_start: 59
  audit_raw: 'The Cassandra configuration files can be found in the conf directory of tarballs. For

    packages, the configuration files will be located in /etc/cassandra.

    Open up the cassandra.yaml file, look for client_encryption_options section.

    Look for enabled: and optional:

    enabled: true

    optional: false

    If neither is true, then all client connections are unencrypted which makes this a finding.

    If enabled is true and optional is false, then all client connections must be encrypted

    which makes this not a finding.

    If enabled is false and optional is true, then enabled wins and all client connections are

    unencrypted which makes this a finding.

    If both are set to true, then both unencrypted and encrypted connections are allowed on

    the same port which makes this not a finding.

    You can also excuse this command

    cat cassandra.yaml | grep -A7 -in "client_encryption_options:"

    or

    cat cassandra.yaml | grep -A2 -in "client_encryption_options:"

    If enabled is set to true, then success. Anything else is a finding.'
  remediation: 'The client encryption should be implemented before anyone accesses the Cassandra

    server.

    To enable the client encryption mechanism:

    1. Stop the Cassandra database.

    2. If not done so already, build out your keystore and truststore.

    3. Modify cassandra.yaml file to modify/add entries under

    client_encryption_options:

    set enabled: true

    set optional: false

    This will force all connections to be encrypted between client and node on the

    cluster.

    4. Start the Cassandra database.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -A7 -in "client_encryption_options:" && cat cassandra.yaml | grep -A2 -in "client_encryption_options:"
