- id: '4.1'
  title: Ensure that logging is enabled.
  scoring: scored
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: 'Apache Cassandra uses Logback for logging functionality. While this can be set using nodetool setlogginglevel
    changes made using this method will be reverted to the level specified in the logback.xml file the next time the process
    restarts. The configurable logging levels are: • OFF • TRACE • DEBUG • INFO (Default) • WARN • ERROR'
  rationale: If logging is not enabled, issues may go undiscovered, and compromises and other incidents may occur without
    being quickly detected. It may also not be possible to provide evidence of compliance with security laws, regulations,
    and other requirements.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/troubleshooting/reading_logs.html?highlig
  - 2. https://logback.qos.ch/manual/configuration.html
  page_start: 52
  audit_raw: 'Execute the following command to confirm the setting is correct:

    $ nodetool getlogginglevels

    Logger Name Log Level

    ROOT INFO

    org.cisecurity.workbench WARN

    If set to OFF then this is a finding.'
  remediation: "To remediate this setting:\n1. Edit the logback-test.xml if present; otherwise, edit the logback.xml\n<configuration\
    \ scan=\"true\">\n <appender name=\"STDOUT\"\nclass=\"ch.qos.logback.core.ConsoleAppender\">\n <filter class=\"ch.qos.logback.classic.filter.ThresholdFilter\"\
    >\n <level>INFO</level>\n </filter>\n <encoder>\n <pattern>%-5level [%thread] %date{ISO8601} %F:%L -\n%msg%n</pattern>\n\
    \ </encoder>\n </appender>\n <root level=\"INFO\">\n <appender-ref ref=\"STDOUT\" />\n </root>\n <logger name=\"org.cisecurity.workbench\"\
    \ level=\"WARN\"/>\n</configuration>\n2. Restart the Apache Cassandra"
  checks:
  - type: manual_review
    info: 'Execute the following command to confirm the setting is correct:

      $ nodetool getlogginglevels

      Logger Name Log Level

      ROOT INFO

      org.cisecurity.workbench WARN

      If set to OFF then this is a finding.'
    severity: medium
