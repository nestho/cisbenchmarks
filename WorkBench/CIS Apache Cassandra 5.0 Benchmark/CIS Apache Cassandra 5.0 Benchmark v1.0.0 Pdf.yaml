- id: '1.4'
  title: Ensure latest version of Cassandra is installed
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: 'The Cassandra installation version, along with the patches, should be the most recent that is compatible with
    organization''s operational needs. When obtaining and installing software packages (typically via apt-get or you can compile
    the source code), it''s imperative that packages (or the source code, tarball) are sourced only from valid and authorized
    repositories. For Cassandra, a short list of valid repositories may include: • The official apache cassandra website:
    http://cassandra.apache.org/ • DataStax Enterprise: https://www.datastax.com/'
  rationale: Using the most recent version of Cassandra can help limit the possibilities for vulnerabilities in the software,
    the installation version applied during setup should be established according to the needs of the organization. Ensure
    you are using a release that is covered by a level of support which includes regular updates to address vulnerabilities.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/getting_started/installing.html#prerequisite
  page_start: 23
  audit_raw: 'To verify the version of Cassandra you have installed:

    cassandra -v

    4.0.3 (a/o 2022-03-29)

    Released on 2022-02-17

    Maintained until 4.3.0 release (May-July 2024)

    If an old/unsupported version of Cassandra is installed this is a finding.'
  remediation: 'Upgrade to the latest version of the Cassandra software:

    For each node in the cluster:

    1. Using the nodetool drain command to push all memtables data to SSTables.

    2. Stop Cassandra services.

    3. Backup the data set and all of your Cassandra configuration files.

    4. Download/Update Java if needed.

    5. Download/Update Python if needed.

    6. Download the binaries for the latest Cassandra revision from the Cassandra

    Download Page.

    7. Install new version of Cassandra.

    8. Configure new version of Cassandra, taking into account all of your previous

    settings in your config files(cassandra.yml, cassandrea-env.sh, etc).

    9. Start Cassandra services.

    10. Check logs for warnings, errors.

    11. Using the nodetool to upgrade your SSTables.

    12. Using the nodetool command to check status of cluster.'
  checks:
  - type: manual_review
    info: 'To verify the version of Cassandra you have installed:

      cassandra -v

      4.0.3 (a/o 2022-03-29)

      Released on 2022-02-17

      Maintained until 4.3.0 release (May-July 2024)

      If an old/unsupported version of Cassandra is installed this is a finding.'
    severity: medium
- id: '1.5'
  title: Ensure the Cassandra service is run as a non-root user
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: Though Cassandra database may be run as root, it should run as another non-root user.
  rationale: One of the best ways to reduce your exposure to attack is to create a unique, unprivileged user and group for
    the server application. A best practice is to follow is ensuring processes run with a user with least privilege.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Logon to the server where Cassandra is running and run the following command

    ps -aef | grep cassandra | grep java | cut -d'' '' -f1

    This will show who is running the Cassandra binary.

    If the user is root or has excessive privileges then this is a finding.'
  remediation: 'Create a group for cassandra (if it does not already exist)

    sudo groupadd cassandra

    Create a user which is only used for running Cassandra and its related processes.

    Replacing <DIRECTORY_WHERE_CASSANDRA_INSTALLED> with the full path of where

    Cassandra binaries are installed.

    Replacing <USERID_NUMBER> with a number not already used on the server'
  checks:
  - type: command
    command: ps -aef | grep cassandra | grep java | cut -d' ' -f1
    expected: ''
    severity: medium
    info: 'Logon to the server where Cassandra is running and run the following command

      ps -aef | grep cassandra | grep java | cut -d'' '' -f1

      This will show who is running the Cassandra binary.

      If the user is root or has excessive privileges then this is a finding.'
- id: '1.6'
  title: Ensure clocks are synchronized on all nodes
  scoring: manual
  profile:
  - Level 1 - Cassandra on Linux
  description: Enabling Network Time Protocol (NTP), or some equivalent way, to keep clocks on all nodes in sync is critical.
  rationale: Cassandra decides which data is most current between all of the nodes in the cluster based on timestamps. It
    is paramount to ensure all clocks are in-sync, otherwise the most current data may not be returned or worse, marked for
    deletion.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Depending on the Linux installation this may be checked by executing the following

    command on each node:

    ps -aef | grep ntp

    OR

    ps -aef | grep chronyd

    OR

    timedatectl status | grep NTP

    If NTP is not configured or clocks are out-of-sync then this is a finding.'
  remediation: Install and start the time protocol on every node in the Cassandra cluster.
  checks:
  - type: command
    command: ps -aef | grep ntp && ps -aef | grep chronyd && timedatectl status | grep NTP
    expected: ''
    severity: medium
    info: 'Depending on the Linux installation this may be checked by executing the following

      command on each node:

      ps -aef | grep ntp

      OR

      ps -aef | grep chronyd

      OR

      timedatectl status | grep NTP

      If NTP is not configured or clocks are out-of-sync then this is a finding.'
- id: '2.1'
  title: Ensure that authentication is enabled for Cassandra databases
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: Authentication is pluggable in Cassandra and is configured using the authenticator setting in cassandra.yaml.
    Cassandra ships with two options included in the default distribution, AllowAllAuthenticator and PasswordAuthenticator.
    The default, AllowAllAuthenticator, performs no authentication checks and therefore requires no credentials. It is used
    to disable authentication completely. The second option, PasswordAuthenticator, stores encrypted credentials in a system
    table. This can be used to enable simple username/password authentication.
  rationale: Authentication is a necessary condition of Cassandra’s permissions subsystem, so if authentication is disabled
    then so are permissions. Failure to authenticate clients, users, and/or servers can allow unauthorized access to the Cassandra
    database and can prevent tracing actions back to their sources. The authentication mechanism should be implemented before
    anyone accesses the Cassandra server.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/getting_started/configuring.html
  - 2. http://cassandra.apache.org/doc/latest/operating/security.html
  page_start: 30
  audit_raw: 'Run the following command to verify whether authentication is enabled (authenticator

    values set to PasswordAuthenticator) on the Cassandra server.

    The Cassandra configuration files can be found in the conf directory of tarballs. For

    packages, the configuration files will be located in /etc/cassandra.

    cat cassandra.yaml | grep -in "authenticator:"

    If authenticator is set to AllowAllAuthenticator, then this is a finding.'
  remediation: 'To enable the authentication mechanism:

    1. Stop the Cassandra database.

    2. Modify cassandra.yaml file to modify/add entry for authenticator: set it to

    PasswordAuthenticator

    3. Start the Cassandra database.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -in "authenticator:"
    expected: ''
    severity: medium
    info: 'Run the following command to verify whether authentication is enabled (authenticator

      values set to PasswordAuthenticator) on the Cassandra server.

      The Cassandra configuration files can be found in the conf directory of tarballs. For

      packages, the configuration files will be located in /etc/cassandra.

      cat cassandra.yaml | grep -in "authenticator:"

      If authenticator is set to AllowAllAuthenticator, t'
- id: '2.2'
  title: Ensure that authorization is enabled for Cassandra databases
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: Authorization is pluggable in Cassandra and is configured using the authorizer setting in cassandra.yaml. Cassandra
    ships with two options included in the default distribution, AllowAllAuthenticator and CassandraAuthorizer. The default,
    AllowAllAuthenticator performs no checking which grants all permissions to all roles. The second option, CassandraAuthorizer,
    implements full permissions management functionality and stores its data in Cassandra system tables.
  rationale: Authorizing roles is an important step towards ensuring only authorized access to the Cassandra database tables
    is permitted. It also provides the requisite means of implementing least privilege best practices. The authorization mechanism
    should be implemented before anyone accesses the Cassandra database.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/getting_started/configuring.html
  - 2. http://cassandra.apache.org/doc/latest/operating/security.html
  page_start: 32
  audit_raw: 'Run the following command to verify whether authorization is enabled (authorization

    values set to CassandraAuthorizer) on the Cassandra server.

    The Cassandra configuration files can be found in the conf directory of tarballs. For

    packages, the configuration files will be located in /etc/cassandra.

    cat cassandra.yaml | grep -in "authorizer:"

    If authorizer is set to AllowAllAuthorizer, then this is a finding.'
  remediation: 'To enable the authorization mechanism:

    1. Stop the Cassandra database.

    2. Modify cassandra.yaml file to modify/add entry for authorization: set it to

    CassandraAuthorizer

    3. Start the Cassandra database.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -in "authorizer:"
    expected: ''
    severity: medium
    info: 'Run the following command to verify whether authorization is enabled (authorization

      values set to CassandraAuthorizer) on the Cassandra server.

      The Cassandra configuration files can be found in the conf directory of tarballs. For

      packages, the configuration files will be located in /etc/cassandra.

      cat cassandra.yaml | grep -in "authorizer:"

      If authorizer is set to AllowAllAuthorizer, then this is '
- id: '3.1'
  title: Ensure the cassandra and superuser roles are separate
  scoring: scored
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: The default installation of Cassandra includes a superuser role named cassandra. This necessitates the creation
    of a separate role to be the superuser role.
  rationale: Superuser permissions allow for the creation, deletion, and permission management of other users. Considering
    the cassandra role is well known it should not be a superuser or one which is used for any administrative tasks.
  impact: 'If a separate superuser account is not created and tested for correct functionality prior to removing the superuser
    role from the cassandra account you will no longer be able to perform certain actions, including: • Create a role with
    super user status. • Perform DROP or CREATE USER queries.'
  references: []
  page_start: 35
  audit_raw: 'To verify the configuration, run the following query:

    select role from system_auth.roles where is_superuser= True;

    If you get an error 2200 [ INVALID QUERY] due to where clause, add "ALLOW

    FILTERING to end of query so it looks like this:

    select role from system_auth.roles where is_superuser= True ALLOW FILTERING;

    Looking at the role, verify any show up with is_superuser = True and make sure it is not

    cassandra or any unapproved role. If any are found then, this is a finding.'
  remediation: 'To remediate a misconfiguration, perform the following steps:

    1. Execute the following command:

    create role ''<NEW_ROLE_HERE>'' with password=''<NEW_PASSWORD_HERE>'' and

    login=TRUE and superuser=TRUE ;

    grant all permissions on all keyspaces to <NEW_ROLE_HERE>;

    Note: Replace <NEW_ROLE_HERE> with the desired role and

    <NEW_PASSWORD_HERE> with a password.

    2. Verify the new role is working.

    3. Remove the superuser role from the cassandra account by executing the

    following command:

    UPDATE system_auth.roles SET is_superuser=null WHERE role=''cassandra'';'
  checks:
  - type: sql
    command: select role from system_auth.roles where is_superuser= True;
    severity: medium
    info: 'To verify the configuration, run the following query:

      select role from system_auth.roles where is_superuser= True;

      If you get an error 2200 [ INVALID QUERY] due to where clause, add "ALLOW

      FILTERING to end of query so it looks like this:

      select role from system_auth.roles where is_superuser= True ALLOW FILTERING;

      Looking at the role, verify any show up with is_superuser = True and make sure it is '
- id: '3.2'
  title: Ensure that the default password is changed for the cassandra role
  scoring: scored
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: The cassandra role has a default password which must be changed.
  rationale: Failure to change the default password for the cassandra role may pose a risk to the database in the form of
    unauthorized access.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/operating/security.html
  page_start: 37
  audit_raw: 'Connect to Cassandra database to verify whether the cassandra role has default

    password.

    cqlsh -u cassandra -p cassandra

    If the connection is successful this is a finding.'
  remediation: 'Change the password for the casssandra role by issuing the following command:

    cqlsh -u cassandra -p cassandra

    alter role ''cassandra'' with password ''<NEWPASSWORD_HERE>'';

    Where <NEWPASSWORD_HERE> is replaced with the password of your choosing.'
  checks:
  - type: manual_review
    info: 'Connect to Cassandra database to verify whether the cassandra role has default

      password.

      cqlsh -u cassandra -p cassandra

      If the connection is successful this is a finding.'
    severity: medium
- id: '3.3'
  title: Ensure there are no unnecessary roles or excessive privileges
  scoring: manual
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: Verify each role is require and has only the privileges needed to do its job.
  rationale: Roles which are unneeded, have super user or other potentially excessive privileges may be an avenue for a hacker
    to gain access to or modify data in the database.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/latest/cql/security.html
  page_start: 39
  audit_raw: 'As a superuser, retrieve all roles:

    list roles;

    Retrieve all permissions for all roles

    select * from system_auth.role_permissions;

    If there are any unnecessary roles or roles with excessive privileges this is a finding.'
  remediation: 'Remove any unnecessary roles and/or permissions in accordance with organizational

    needs.'
  checks:
  - type: sql
    command: select * from system_auth.role_permissions;
    severity: medium
    info: 'As a superuser, retrieve all roles:

      list roles;

      Retrieve all permissions for all roles

      select * from system_auth.role_permissions;

      If there are any unnecessary roles or roles with excessive privileges this is a finding.'
- id: '3.4'
  title: Ensure that Cassandra is run using a non-privileged, dedicated service account
  scoring: scored
  profile:
  - Level 1 - Cassandra on Linux
  description: As with any service installed on a host, it can be provided with its own user context. Providing a dedicated
    user to the service provides the ability to precisely constrain the service within the larger host context.
  rationale: Utilizing a non-privileged account for Cassandra to execute as may reduce the impact of a Cassandra-born vulnerability.
    A restricted account will be unable to access resources unrelated to Cassandra, such as operating system configurations.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Execute the following command at a terminal prompt to assess this recommendation:

    ps -ef | egrep "^cassandra.*$"

    If no lines are returned, then this is a finding.

    NOTE: It is assumed that the Cassandra user is cassandra. Additionally, you may

    consider running sudo -l as the Cassandra user or to check the sudoers file.'
  remediation: 'Create a user which is only used for running Cassandra and directly related processes.

    This user must not have administrative rights to the system.'
  checks:
  - type: manual_review
    info: 'Execute the following command at a terminal prompt to assess this recommendation:

      ps -ef | egrep "^cassandra.*$"

      If no lines are returned, then this is a finding.

      NOTE: It is assumed that the Cassandra user is cassandra. Additionally, you may

      consider running sudo -l as the Cassandra user or to check the sudoers file.'
    severity: medium
- id: '3.5'
  title: Ensure that Cassandra only listens for network connections on authorized interfaces
  scoring: manual
  profile:
  - Level 1 - Cassandra on Linux
  description: When listen_address is blank and listen_interface is commented out, this will be set automatically by InetAddress.getLocalHost().
    Presuming the node is configured correctly, e.g. hostname, name resolution, etc., this will configure the node to use
    the address associated with the hostname. The listen_address must not be set to 0.0.0.0.
  rationale: Setting the address or interface to bind to will tell other Cassandra nodes to which address or interface to
    connect. This must be changed from the default in order for multiple nodes to be able to communicate.
  impact: ''
  references:
  - 1. http://cassandra.apache.org/doc/3.11/configuration/cassandra_config_file.html#li
  - 2. http://cassandra.apache.org/doc/3.11/configuration/cassandra_config_file.html#li
  page_start: 43
  audit_raw: 'Check the value of listen_address or listen_interface in the cassandra.yaml. If

    listen_address is set 0.0.0.0 or a non-authorized address or interface is specified,

    this is a finding.

    Run these command to assist:

    cat cassandra.yaml | grep -in "listen_address:" | grep "0.0.0.0"

    cat cassandra.yaml | grep -in "listen_address:"

    cat cassandra.yaml | grep -in "listen_interface:"'
  remediation: 'Set the listen_address or listen_interface, not both, in the cassandra.yaml to

    an authorized address or interface.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -in "listen_address:" | grep "0.0.0.0" && cat cassandra.yaml | grep -in "listen_address:"
      && cat cassandra.yaml | grep -in "listen_interface:"
    expected: ''
    severity: medium
    info: 'Check the value of listen_address or listen_interface in the cassandra.yaml. If

      listen_address is set 0.0.0.0 or a non-authorized address or interface is specified,

      this is a finding.

      Run these command to assist:

      cat cassandra.yaml | grep -in "listen_address:" | grep "0.0.0.0"

      cat cassandra.yaml | grep -in "listen_address:"

      cat cassandra.yaml | grep -in "listen_interface:"'
- id: '3.6'
  title: Ensure that Data Center Authorizations is activated
  scoring: manual
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: Authorization at Data Center level is pluggable in Cassandra and is configured using the network_authorizer
    setting in cassandra.yaml. Cassandra ships with AllowAllNetworkAuthorizer which allows any role to access any datacenter
    effectively disabling datacenter authorization; which is the current behavior. It should be set to CassandraNetworkAuthorizer
    which allows the ability to store permissions which restrict role access to specific datacenters.
  rationale: The network_authorizer parameter in the cassandra.yaml file allows an operator to restrict the access of a Cassandra
    role to specific datacenters. Keep in mind that for this to work correctly, the authenticator setting in cassandra.yaml
    file must be set to PasswordAuthenticator.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Run the following command to verify whether network authorization is enabled

    (network_authorizer value set to CassandraNetworkAuthorizer) on the Cassandra

    server.

    The Cassandra configuration files can be found in the conf directory of tarballs. For

    packages, the configuration files will be located in /etc/cassandra.

    cat cassandra.yaml | grep -in "network_authorizer:"

    If network_authorizer is set to AllowAllNetworkAuthorizer, then this is a finding.'
  remediation: '1. Stop the Cassandra database on each node.

    2. Modify the cassandra.yaml file to modify entry for network_authorizer: set it to

    CassandraNetworkAuthorizer

    3. Start the Cassandra database.'
  checks:
  - type: command
    command: cat cassandra.yaml | grep -in "network_authorizer:"
    expected: ''
    severity: medium
    info: 'Run the following command to verify whether network authorization is enabled

      (network_authorizer value set to CassandraNetworkAuthorizer) on the Cassandra

      server.

      The Cassandra configuration files can be found in the conf directory of tarballs. For

      packages, the configuration files will be located in /etc/cassandra.

      cat cassandra.yaml | grep -in "network_authorizer:"

      If network_authorizer is set t'
- id: '3.7'
  title: Review User-Defined Roles
  scoring: manual
  profile:
  - Level 1 - Cassandra
  - Level 1 - Cassandra on Linux
  description: The MEMBER_OF column found in the system_auth.roles table shows roles granted to roles.
  rationale: The MEMBER_OF column shows whoever has roles granted to roles and depending on the role and the privileges grant
    to the role should be limited . Limiting the accounts that have the certain roles reduces the chances that an attacker
    can exploit these capabilities.
  impact: ''
  references: []
  page_start: 47
  audit_raw: 'Execute the following SQL statement to audit this setting:

    select role, can_login, member_of from system_auth.roles;

    Looking for can_login which tells you that role can log into cassandra and member_of

    is when roles are granted to roles.'
  remediation: 'Looking at those users from the query that have member_of that is NOT null, decide if

    that user truly needs that role, if not, for each user, issue the following SQL statement

    (replace <is_member> with the value of member_of returned by the query in the audit

    procedure)

    revoke <is_member> from role;'
  checks:
  - type: sql
    command: select role, can_login, member_of from system_auth.roles;
    severity: medium
