      Support\nNOTE: The version numbers may differ based on th"
- id: 3.5.2
  title: Ensure default user umask is 027 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: The user file-creation mode mask (umask) is used to determine the file permission for newly created directories
    and files. In AIX, the default permissions for any newly created directory is 0755 (rwxr-xr-x), and for any newly created
    file it is 0644 (rw-r--r--). The umask modifies the default AIX permissions by restricting (masking) these permissions.
    The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file
    mode.
  rationale: Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system.
  impact: ''
  references: []
  page_start: 285
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a umask

    The above command should yield the following output:

    default umask=27'
  remediation: 'Add the umask attribute to the default user stanza in /etc/security/user:

    chsec -f /etc/security/user -s default -a umask=027'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a umask

      The above command should yield the following output:

      default umask=27'
    severity: medium
- id: 3.5.3
  title: General Permissions Management - world writable directories
  scoring: manual
  profile:
  - Level 1
  description: The system is audited for world writable directories.
  rationale: An audit should be performed on the system to search for the presence of world writable directories. Directories
    should only be world writable when absolutely necessary, and only with the so-called SVTX bit set. This protects users
    files from being deleted or renamed.
  impact: World writable directories exist on UNIX systems (e.g., /tmp, /var/tmp). These directories are needed for normal
    operations. To protect the files created in the directories the 'links to the inode' (ie, filename) need to be protected
    so that others may not accidentally, or maliciously - remove or modify the filename.
  references: []
  page_start: 287
  audit_raw: 'Execute the findcommand.

    Use the following to find all world writable directories on local JFS/JFS2 filesystems that do

    not have the SVTX bit:

    find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! -perm -1000 -ls

    The output should be empty.

    287 | P a g e'
  remediation: ' Review the local mounted JFS/JFS2 filesystems using the following command to find

    all world writable directories missing the SVTX bit:

    find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! ! -perm -1000 -

    ls

     If a directory must retain world writable access, ensure that SVTX bit is set so that

    users can only remove the filenames they own:

    chmod o+t ${dir}

    NOTE: This will leave existing modes while adding the SVTX (also known as sticky bit) to

    the directory. The documented meaning of the flag for directories is:

    Sets the link permission to directories.

     Otherwise, remove world-write permission - without modifying the other mode

    bits:

    chmod o-w ${dir}'
  checks:
