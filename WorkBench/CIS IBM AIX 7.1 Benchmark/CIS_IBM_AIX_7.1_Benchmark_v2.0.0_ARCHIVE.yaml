- id: 3.5.5
  title: Ensure no unowned files or directories exist
  scoring: scored
  profile:
  - Level 1
  description: Sometimes when administrators delete users or groups from the system they neglect to remove all files owned
    by those users or groups.
  rationale: A new user who is assigned the deleted user's user ID or group ID may then end up "owning" these files, and thus
    have more access on the system than was intended.
  impact: ''
  references: []
  page_start: 291
  audit_raw: 'Re-execute the appropriate find command.

    If there are non-local filesystems which cannot be un-mounted, use the following to find all

    un-owned files and directories on local JFS/JFS2 filesystems only:

