- id: 3.6.2.1
  title: OpenSSH - Installation
  scoring: scored
  profile:
  - Level 1
  description: OpenSSH is the expected program for remote command line access. It provides encrypted protocols such as SSH
    and SCP/SFTP.
  rationale: The recommended mechanism for remote access is to use encrypted protocols such as OpenSSH that are designed to
    prevent the interception of communications. OpenSSH is the standard replacement for clear-text protocols, such as Telnet
    and FTP. Clear-text protocols can be snooped and expose credentials and/or sensitive data to unauthorized parties. Additionally,
    servers that are configured with unique PKI keys can circumvent host impersonation and assure remote hosts/users that
    they are communicating with the intended device.
  impact: 'OpenBSD maintains the OpenSSH project regularly updates OpenSSH. The Major/Minor numbers OpenBSD publishes may
    be higher than the Major/Minor numbers an OS platform uses - due to differences in how they manage packages. The current
    OpenBSD release is: OpenSSH 8.6 released April 19, 2021. IBM''s policy is to stay at a constant level (currently 8.1)
    and maintain a more stable set of configuration keywords or feature set. OpenBSD, never patches a release. Instead, OpenBSD
    releases a new version with the latest security fixes and/or feature changes. This means IBM does not automatically push
    OpenSSH feature changes - but does look at new OpenBSD releases and incorporates security fixes, if any. The current OpenSSH
    version maintained by IBM is OpenSSH 8.1. The openssh fileset VRMF number should start with 8.1.'
  references: []
  page_start: 320
  audit_raw: 'The following command should return Version 8+

    test $(sshd -i </dev/null | cut -d _ -f 2) -gt 8 && print "Version 8+" ||

    print "Insufficient"

    320 | P a g e'
  remediation: 'Install OpenSSH version 8.1 (or later), depending on package source.

    The current version available from IBM via

    AIX Web Download Pack Programs

    is 8.1.102.2103.'
  checks:
  - type: manual_review
    info: 'The following command should return Version 8+

      test $(sshd -i </dev/null | cut -d _ -f 2) -gt 8 && print "Version 8+" ||

      print "Insufficient"

      320 | P a g e'
    severity: medium
- id: 3.6.2.2
  title: OpenSSH - PermitRootLogin
  scoring: scored
  profile:
  - Level 2
  description: The recommendation is to edit the /etc/ssh/sshd_config file to disable direct root login. Direct root login
    via SSH (using password) was enabled by default with prior versions of OpenSSH. To be absolutely certain direct login
    using a password is disabled the recommendation is to set this variable specifically rather than rely on a new, changeable,
    default. In other words, never rely on default values!!!
  rationale: All root access should be facilitated through a local logon with a unique and identifiable user ID and then via
    the su command once locally authenticated. Direct root login using passwords is insecure and does not provide sufficient
    logging or audit trailing for accountability. Accountability can be achieved using PKI keys and sufficient log information
    to syslog.
  impact: 'One setting would be to block all root access (by assinging the value no to PermitRootLogin.). While this sounds
    simple - setting the attribute to no requires either sharing a root password (to use su), the installation of sudo, or
    a configuration using extended RBAC for actions that require enhanced privileges. Considering the recommendation 3.2.6.9
    - Configuring SSH - set LogLevel to INFO specifies a LOG_LEVEL of INFO or DEBUG a setting of prohibit-password is acceptable.
    In short, unless no is required by local corporate policy the preferred setting is to disable root login using a password
    and verify that OpenSSH logging is at least at level INFO. See Additional Info for an example of how root login can be
    accounted. Note: only public keys in the file ~root/.ssh/authorized_keys will be able to connect. 322 | P a g e'
  references: []
  page_start: 322
  audit_raw: ' This audit procedure verifies that the setting for PermitRootLogin is not dependent

    upon a default that might be acceptable today, but not later. That is, our

    recommendation requires an explicit setting.

     Ensure that the PermitRootLogin parameter has been changed:

    /usr/bin/egrep "^PermitRootLogin" /etc/ssh/sshd_config

    The above command should yield one of the following:

    PermitRootLogin prohibit-password

    PermitRootLogin no

    PermitRootLogin forced-commands-only

     Consider no output as a configuration failure

    323 | P a g e'
  remediation: "#!/usr/bin/ksh\nPREFERRED_SETTING=\"prohibit-password\"\numask 077\nset $(/usr/bin/egrep \"^PermitRootLogin\"\
    \ /etc/ssh/sshd_config)\necho $?\nif [[ ! -z $1 ]]; then\n # Look for a setting and change to no if anything else\n if\
    \ [[ $2 != ${PREFERRED_SETTING} ]]; then\n sed \"s/^PermitRootLogin \\{1\\}[^ ]\\{1,\\}/PermitRootLogin\n${PREFERRED_SETTING}/\"\
    \ /etc/ssh/sshd_config >/tmp/sshd_config.$$\n fi\nelse\n # Look for a comment and append\n sed \"/^# \\{0,\\}PermitRootLogin/\
    \ a\\^JPermitRootLogin ${PREFERRED_SETTING}/\"\n/etc/ssh/sshd_config >/tmp/sshd_config.$$\nfi\nif [[ -e /tmp/sshd_config.$$\
    \ ]]; then\n diff -u /tmp/sshd_config.$$ /etc/ssh/sshd_config\n rm /tmp/sshd_config.$$\nelif\n # Verify setting is specified\n\
    \ /usr/bin/egrep \"^PermitRootLogin\" /etc/ssh/sshd_config >>/dev/null\n if [[ $? -ne 0 ]]; then\n print \"PermitRootLogin\
    \ ${PREFERRED_SETTING}\" >> /etc/ssh/sshd_config\n fi\nfi\nRe-cycle the sshd daemon to pick up the configuration changes:\n\
    stopsrc -s sshd\nsleep 5\nstartsrc -s sshd"
  checks:
  - type: manual_review
    info: ' This audit procedure verifies that the setting for PermitRootLogin is not dependent

      upon a default that might be acceptable today, but not later. That is, our

      recommendation requires an explicit setting.

