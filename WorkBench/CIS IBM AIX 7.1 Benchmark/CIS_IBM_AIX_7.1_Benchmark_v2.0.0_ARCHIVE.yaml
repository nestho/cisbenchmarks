- id: 3.6.14
  title: 'Configuration: /etc/motd'
  scoring: scored
  profile:
  - Level 1
  - Level 2
  - Level 1
  description: Create a /etc/motd file which displays, post initial logon, a statutory warning message. TMOUT and TIMEOUT
    are environmental setting that activate the timeout of a shell. The value is in seconds.  TMOUT=n - Sets the shell timeout
    to n seconds. A setting of TMOUT=0, or unset TMOUT disables the automatic session timeout.  readonly TMOUT- Both export
    and lock TMOUT environmental variable to it's present value, preventing unwanted modification during run-time.
  rationale: The creation of a /etc/motd file which contains a statutory warning message could aid in the prosecution of offenders
    guilty of unauthorized system access. The /etc/motd is displayed after successful logins from the console, SSH and other
    system access protocols. All systems are vulnerable if terminals are left logged in and unattended. The most serious problem
    occurs when a system manager leaves a terminal unattended that has been enabled with root authority. In general, users
    should log out anytime they leave their terminals. You can force a terminal to log out after a period of inactivity by
    setting the TMOUT and TIMEOUT parameters in the /etc/profile file. The TMOUT parameter works in the ksh (Korn) shell,
    and the TIMEOUT parameter works in the bsh (Bourne) shell.
  impact: This recommendation is set at Level 2 (using readonly). The recommendation - at Level 1, would use export instead.
    469 | P a g e
  references:
  - 1. https://www.ibm.com/docs/en/aix/7.1?topic=security-unattended-terminals
  page_start: 467
  audit_raw: 'Log back into the system via SSH:

    ssh localhost

    NOTE: The /etc/motd file will now be displayed

    Validate that /etc/motd is not writable by group or other

    ls -l /etc/motd

    467 | P a g e

    Execute the following command:

    readonly | /usr/bin/egrep -e "TMOUT|TIMEOUT"

    This should return:

    TIMEOUT=900

    TMOUT=900

    Note: Depending on company policy the value may also be less than 900.'
  remediation: 'Create a /etc/motd file:

    touch /etc/motd

    chmod u=rw,go=r /etc/motd

    chown bin:bin /etc/motd

    Below is a sample banner:

    *************************************************************************** `

    NOTICE TO USERS

    This computer system is the private property of its owner, whether

    individual, corporate or government. It is for authorized use only. Users

    (authorized or unauthorized) have no explicit or implicit expectation of

    privacy. Any or all uses of this system and all files on this system may be

    intercepted, monitored, recorded, copied, audited, inspected, and disclosed

    to your employer, to authorized site, government, and law enforcement

    personnel, as well as authorized officials of government agencies, both

    domestic and foreign. By using this system, the user consents to such

    interception, monitoring,recording, copying, auditing, inspection, and

    disclosure at the discretion of such personnel or officials. Unauthorized or

    improper use of this system may result in civil and criminal penalties and

    administrative or disciplinary action, as appropriate. By continuing to use

    this system you indicate your awareness of and consent to these terms and

    conditions of use. LOG OFF IMMEDIATELY if you do not agree to the conditions

    stated in this warning.

    ****************************************************************************

    NOTE: Replace "its owner" with the relevant company name

    Review /etc/profile to verify that TMOUT is configured to:

     include a timeout of no more than 900 seconds

     to be readonly

     verify readonly statement is the last statement

    /usr/bin/egrep -n -e "TMOUT|TIMEOUT" /etc/profile

    This should return something similar to:

    40:# TMOUT=120

    41:TMOUT=900

    42:TIMEOUT=900

    43:readonly TMOUT TIMEOUT

    If either setting is missing, and/or the readonly statement, add these to /etc/profile.'
  checks:
