- id: 3.7.1.1
  title: Configuring syslog - local logging
  scoring: manual
  profile:
  - Level 1
  description: This recommendation implements a local syslog configuration.
  rationale: 'Establishing a logging process via syslog provides system and security administrators with pertinent information
    relating to: login, mail, daemon, user and kernel activity. The recommendation is to enable local syslog logging, with
    a weekly rotation policy in a four weekly cycle. The log rotation isolates historical data which can be reviewed retrospectively
    if an issue is uncovered at a later date.'
  impact: This recommendation is manual because there are likely local requirements that surpass the basic recommendation
    here.
  references: []
  page_start: 474
  audit_raw: ' Ensure that the log entries have been added successfully:

    /usr/bin/egrep -v "(^$)|(^#)" /etc/syslog.conf

     The above command should yield the output similar to:

    aso.notice /var/log/aso/aso.log rotate size 1m files 8 compress

    aso.info /var/log/aso/aso_process.log rotate size 1m files 8 compress

    aso.debug /var/log/aso/aso_debug.log rotate size 32m files 8 compress

    *.info;local4.none /var/log/syslog/info.log files 52 rotate time 1w

    compress archive /var/log/syslog/archive

    auth.info /var/log/syslog/auth.log files 52 rotate time 1w

    compress archive /var/log/syslog/archive

     Check that the auth.logand info.log files and syslog archive directory exist:

    ls -ld /var/log/syslog/auth.log /var/log/syslog/info.log

    /var/log/syslog/archive

    The output of the command above should list both files and the directory

    474 | P a g e'
  remediation: 'Explicitly define a log file for the auth.info output in /etc/syslog.conf:

    printf "auth.info\t\t/var/adm/authlog rotate time 1w files 4\n" >>

    /etc/syslog.conf

    NOTE: This ensures that remote login, sudo or su attempts are logged separately

    Create the authlog file and make it readable by root only:

    touch /var/adm/authlog

    chown root:system /var/adm/authlog

    chmod u=rw,go= /var/adm/authlog

    Create an entry in /etc/syslog.conf to capture all other output of level info or higher,

    excluding authentication information, as this is to be captured within /var/adm/authlog:

    printf "*.info;auth.none\t/var/adm/syslog rotate time 1w files 4\n" >>

    /etc/syslog.conf

    Create the syslog file:

    touch /var/adm/syslog

    chmod u=rw,g=r,o= /var/adm/syslog

    Refresh syslogd to force the daemon to read the edited /etc/syslog.conf:

    refresh -s syslogd'
  checks:
  - type: command
    command: ls -ld /var/log/syslog/auth.log /var/log/syslog/info.log
    expected: ''
    severity: medium
    info: ' Ensure that the log entries have been added successfully:

      /usr/bin/egrep -v "(^$)|(^#)" /etc/syslog.conf

       The above command should yield the output similar to:

      aso.notice /var/log/aso/aso.log rotate size 1m files 8 compress

      aso.info /var/log/aso/aso_process.log rotate size 1m files 8 compress

      aso.debug /var/log/aso/aso_debug.log rotate size 32m files 8 compress

      *.info;local4.none /var/log/syslo'
- id: 3.7.1.2
  title: Configuring syslog - remote logging
  scoring: scored
  profile:
  - Level 2
  description: This recommendation implements a remote syslog configuration.
  rationale: To further enhance the local syslog logging process CIS recommends that syslog information, in particular that
    generated by the auth facility, is logged remotely. This recommendation assumes that a remote and secure syslog server
    is available on the network. If this is not the case, please skip to the next recommendation. The primary reason for logging
    remotely is to provide an un-editable audit trail of system access. If a hacker were to access a system and gain super
    user authority it would be easy to edit local files and remove all traces of access, providing the system administrator
    with no way of identifying the individual or group responsible. If the log data is sent remotely at the point of access,
    these remote logs can then be reconciled with local data to identify tampered and altered files. The logs can also be
    used as evidence in any subsequent prosecution.
  impact: ''
  references: []
  page_start: 477
  audit_raw: 'Ensure that the log entries have been added successfully:

    tail -2 /etc/syslog.conf

    The above command should yield the following output:

    auth.info @<IP address of remote syslog server>

    *.info;auth.none @<IP address of remote syslog server>

    477 | P a g e'
  remediation: 'Explicitly define a remote host for auth.info data in /etc/syslog.conf (enter the remote

    host IP address in the example below):

    printf "auth.info\t\t@<IP address of remote syslog server>" >>

    /etc/syslog.conf

    NOTE: This ensures that remote login, sudo or su attempts are logged separately

    Create a remote host entry in /etc/syslog.conf to capture all other output of level info or

    higher (enter the remote host IP address in the example below):

    printf "*.info;auth.none\t@<IP address of remote syslog server>\n" >>

    /etc/syslog.conf

    Refresh syslogd to force the daemon to read the edited /etc/syslog.conf:

    refresh -s syslogd'
  checks:
  - type: manual_review
    info: 'Ensure that the log entries have been added successfully:

      tail -2 /etc/syslog.conf

      The above command should yield the following output:

      auth.info @<IP address of remote syslog server>

      *.info;auth.none @<IP address of remote syslog server>

      477 | P a g e'
    severity: medium
- id: 3.7.1.3
  title: Configuring syslog - remote messages
  scoring: scored
  profile:
  - Level 2
  description: This recommendation prevents the local syslogd daemon from accepting messages from other hosts on the network.
  rationale: Apart from a central syslog server, all other hosts should not accept remote syslog messages. By default the
    syslogd daemon accepts all remote syslog messages as no authentication is required. This means that a hacker could flood
    a server with syslog messages and potentially fill up the /var filesystem.
  impact: ''
  references: []
  page_start: 479
  audit_raw: 'Ensure that daemon is running with the newly updated configuration:

    ps -ef |grep "syslogd"

    The above command should yield output similar to the following:

    root 57758 70094 0 10:22:08 - 0:00 /usr/sbin/syslogd -r

    NOTE: The -r flag should be present at the end out of the output.'
  remediation: 'If the server does not act as a central syslog server, suppress the logging of messages

    originating from remote servers:

    chssys -s syslogd -a "-r"

    Re-cycle syslogd to activate the configuration change:

    stopsrc -s syslogd

    startsrc -s syslogd'
  checks:
  - type: manual_review
    info: 'Ensure that daemon is running with the newly updated configuration:

      ps -ef |grep "syslogd"

      The above command should yield output similar to the following:

      root 57758 70094 0 10:22:08 - 0:00 /usr/sbin/syslogd -r

      NOTE: The -r flag should be present at the end out of the output.'
    severity: medium
