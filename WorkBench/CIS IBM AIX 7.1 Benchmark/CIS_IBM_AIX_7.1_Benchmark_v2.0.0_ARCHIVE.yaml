    The find command should not yield output

    291 | P a g e'
  remediation: 'Review the currently mounted filesystems:

    mount

    Un-mount all non-local filesystems and cdrom media:

    unmount <mount point>

    If there are non-local filesystems which cannot be un-mounted, use the following command

    to find all un-owned files and directories on local JFS/JFS2 filesystems only:

    find / \( -fstype jfs -o -fstype jfs2 \) \( -type d -o -type f \) \( -nouser

