- id: 3.5.1.1
  title: EFS - implementation
  scoring: scored
  profile:
  - Level 2
  description: The recommendation, if there is a requirement for file based encryption, is to utilize EFS.
  rationale: The use of EFS further enhances the file and directory security within AIX. If there are sensitive or confidential
    files, encryption provides that extra level of security in the event of an accidental chmod which may allow read or write
    access to other users. The encryption operates at the filesystem level and each file is encrypted with a separate key.
    From a user perspective the encryption is transparent as the key can be automatically loaded during login.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/aix/7.1?topic=system-efs-encrypted-file
  page_start: 282
  audit_raw: "Validate the installation of the CLiC software:\nlslpp -L | grep \"clic\"\nThe above command should yield the\
    \ following output:\nclic.rte.includes 4.3.0.0 C F CrytoLite for C Library\n Include File\nclic.rte.kernext 4.3.0.0 C\
    \ F CrytpLite for C Kernel\nclic.rte.lib 4.3.0.0 C F CyrptoLite for C\nLibrary\nclic.rte.pkcs11 4.3.0.0 C F PKCS11 Software\
    \ Token\nSupport\nNOTE: The version numbers may differ based on the source of the software\nValidate that the CLiC kernel\
    \ extension has loaded:\ngenkex |grep crypt\nThe above command should yield the following output:\n438b000 39000 /usr/lib/drivers/crypto/clickext\n\
    282 | P a g e"
  remediation: 'There are two pre-requisite requirements for EFS, it requires RBAC and the installation of

    the CLiC cryptographic fileset. The fileset is located on the expansion pack, shipped with

    the AIX media.

    Place the CLiC software into a convenient location, such as /tmp and install via:

    /usr/lib/instl/sm_inst installp_cmd -a -Q -d /tmp -f clic.rte -c -N -g -X -G

    -Y

    NOTE: If the software is not located in /tmp, reflect the actual location in the command

    above.

    Load the CLiC kernel extension:

    /usr/lib/methods/loadkclic

    As the EFS administrator, create the initial keystore. This is typically the root user:

    efsenable -a

    An EFS enabled filesystem can be created with the following command:

    chfs -v jfs2 -g <vg_name> -m <filesystem> -a size=<size> -a efs=yes

    To enable EFS for an existing filesystem:

    chfs -a efs=yes <filesystem>

    To encrypt a file, load your keystore via:

    efskeymgr -o ksh

    Then encrypt via:

    efsmgr -c AES_192_ECB -e <filename>

    To decrypt:

    efsmgr -d <filename>

    Further details regarding planning and implementation of EFS can be found within the IBM

    AIX 7.1 Infocentre:

    https://www.ibm.com/docs/en/aix/7.1?topic=system-efs-encrypted-file

    NOTE: The configuration of EFS is completely dependent on the unique requirements of a

    given environment.

    283 | P a g e'
