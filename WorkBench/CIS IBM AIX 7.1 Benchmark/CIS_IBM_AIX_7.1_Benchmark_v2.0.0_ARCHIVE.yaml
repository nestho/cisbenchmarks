- id: 3.6.2.14
  title: 'OpenSSH: Regulate access to server'
  scoring: manual
  profile:
  - Level 1
  description: 'There are several options available to regulate access to a server via OpenSSH. At least of the following
    options needs to be leveraged:  AllowUsers: The AllowUsers variable specifies which users may ssh into the system. The
    list is user names separated by spaces. Numeric userIDs are not recognized with this variable. Access can be narrowed
    to restrict user access from a specific host using the form user@host.  AllowGroups: The AllowGroups variable specifies
    groups of users who are permitted to ssh into the system. The list is group names separated by spaces. Numeric groupIDs
    are not recognized with this variable.  DenyUsers: The DenyUsers variable specifies specific users who may not ssh into
    the system. The list is user names separated by spaces. Numeric userIDs are not recognized with this variable. Access
    can be narrowed to restrict user access from a specific host using the form user@host.  DenyGroups: The DenyGroups variable
    specifies groups of users who are not permitted to ssh into the system. The list is group names separated by spaces. Numeric
    groupIDs are not recognized with this variable.'
  rationale: Restricting which users can remotely access the system via SSH will help ensure that only authorized users access
    the system.
  impact: ''
  references: []
  page_start: 348
