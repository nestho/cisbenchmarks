- id: 3.3.5.5
  title: NFS - no root access via NFS exports
  scoring: scored
  profile:
  - Level 1
  description: The superuser (euid==0) should not be able to modify file system objects as a client of an NFS server. Thus,
    for each NFS export, ensure that the anon aka root_squash option is set to -2 or -1.
  rationale: 'Each NFS export on the server should have the anon=-2 option set. With this (default) value root (euid==0) is
    seen as the account nobody. When anon=0 the remote root user has root access on the NFS mount. By ensuring the export
    option anon=-2 when a client process with euid==0 attempts to access (read, write, or delete) the NFS mount the server
    substitutes the UID to the server''s nobody account. This means that the root user on the client cannot access or change
    files that only root on the server can access or change. Many NFS servers call this root_squash. On AIX is is called anon.
    To be consistent with other benchmark terminalogy CIS recommends that root_squash is set on all exported filesystems.
    On AIX the default value of any exported filesystem or directory for anon is -2. Thus, when anon is not set it´s effective
    value is -2. Any other value has to be explicitly set. As a more secure option you can set the option to anon=-1. This
    setting is accepted because it disables anonymous access. By default, secure NFS accepts non-secure requests as anonymous.
    NOTE: The root user on the client can still use su to become any other user (change the euid) and access and change that
    users files, assuming that the same user exists on the NFS server and owns files and/or directories in the NFS export.
    258 | P a g e'
  impact: ''
  references: []
  page_start: 258
  audit_raw: 'As -2 is the default NFS export value, ensure that there are no explicit anon= options set in

    /etc/exports:

    lsnfsexp | grep -v ''anon=-1'' | grep anon=

    The above should command should yield no output.'
  remediation: "To change this value for all failing NFS exported filesystems:\nlsnfsexp | grep -v 'anon=-1' | grep anon=\
    \ | while read fs rest; do\n chnfsexp -d ${fs} -a -2\ndone\n The command chnfsexp re-exports the file or directory with\
    \ the new settings active."
  checks:
  - type: command
    command: lsnfsexp | grep -v 'anon=-1' | grep anon=
    expected: ''
    severity: medium
    info: 'As -2 is the default NFS export value, ensure that there are no explicit anon= options set in

      /etc/exports:

      lsnfsexp | grep -v ''anon=-1'' | grep anon=

      The above should command should yield no output.'
- id: 3.3.5.6
  title: NFS - secure NFS
  scoring: scored
  profile:
  - Level 2
  description: For each NFS export, ensure that the secure option is selected.
  rationale: Secure NFS uses DES encryption or Kerberos to authenticate hosts involved in RPC transactions. RPC is a protocol
    used by NFS to communicate requests between hosts. Secure NFS mitigates attempts by an attacker to spoof RPC requests
    by encrypting the time stamp in the RPC requests. A receiver successfully decrypts the time stamp and confirms that it
    is correct. This serves as a confirmation that the RPC request came from a trusted host.
  impact: ''
  references: []
  page_start: 260
  audit_raw: 'Ensure that the relevant sec= options set in /etc/exports:

    lsnfsexp | grep sec=

    The above should command should return each export and the security mode of the export.

    260 | P a g e'
  remediation: 'Use chnfsexp to change/validate this value for all NFS exported filesystems:

    chnfsexp -d <fs> -S <sec>

    The available security method options are:

     sys - UNIX authentication

     dh - DES authentication

     none - Use the anonymous ID if it has a value other than -1

     krb5 - Kerberos. Authentication only

     krb5i - Kerberos. Authentication and integrity

     krb5p - Authentication, integrity, and privacy `

    Once all exported filesystems have been successfully validated or changed, re-export the

    filesystems and directories to activate the new options:

    exportfs -a'
  checks:
  - type: command
    command: lsnfsexp | grep sec=
    expected: The above should command should return each export and the security mode of the export.
    severity: medium
    info: 'Ensure that the relevant sec= options set in /etc/exports:

      lsnfsexp | grep sec=

      The above should command should return each export and the security mode of the export.

      260 | P a g e'
- id: 3.4.1
  title: bcastping
  scoring: scored
  profile:
  - Level 1
  description: The bcastping parameter determines whether the system responds to ICMP echo packets sent to the broadcast address.
  rationale: The bcastping parameter will be set to 0. This means that the system will not respond to ICMP packets sent to
    the broadcast address. By default, when this is enabled the system is susceptible to smurf attacks, where a hacker utilizes
    this tool to send a small number of ICMP echo packets. These packets can generate huge numbers of ICMP echo replies and
    seriously affect the performance of the targeted host and network. This parameter will be disabled to ensure protection
    from this type of attack.
  impact: ''
