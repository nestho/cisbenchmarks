- id: 3.6.6.1
  title: 'FTP: Prevent world access and group write to files'
  scoring: scored
  profile:
  - Level 1
  description: The umask of the ftp service should be set to at least 027 in order to prevent the FTP daemon process from
    creating world-accessable, group-writeable files by default.
  rationale: The umask of the ftp service should be set to at least 027 in order to prevent the FTP daemon process from creating
    world-accessable and group-writeable files by default. These files could then be transferred over the network which could
    result in compromise of the critical information.
  impact: ''
  references: []
  page_start: 393
  audit_raw: 'Validate the umask setting:

    [[ $(grep -c "^ftp[[:blank:]]" /etc/inetd.conf) -gt 0 ]] && grep

    "^ftp[[:blank:]]" /etc/inetd.conf |awk ''{print $6, $7, $8, $9, 10}'' || RC=0

    The above command should yield the following output (only if the ftp daemon is not

    disabled):

    /usr/sbin/ftpd ftpd -l -u 027'
  remediation: 'Set the default umask of the ftp daemon:

    [[ $(grep -c "^ftp[[:blank:]]" /etc/inetd.conf) -gt 0 ]] && chsubserver -c -v

    ftp -p tcp "ftpd -l -u 027" && refresh -s inetd || RC=0`

    NOTE: The umask above restricts write permissions for both group and other. All access for

    other is removed.'
  checks:
  - type: manual_review
    info: 'Validate the umask setting:

      [[ $(grep -c "^ftp[[:blank:]]" /etc/inetd.conf) -gt 0 ]] && grep

      "^ftp[[:blank:]]" /etc/inetd.conf |awk ''{print $6, $7, $8, $9, 10}'' || RC=0

      The above command should yield the following output (only if the ftp daemon is not

      disabled):

      /usr/sbin/ftpd ftpd -l -u 027'
    severity: medium
