- id: 3.6.9
  title: Ensure root access is controlled
  scoring: scored
  profile:
  - Level 1
  description: Restricts access to root via su to members of a specific group.
  rationale: Setting the sugroups attribute to system ensures that only members of the system group are able to su root. This
    makes it more difficult for an attacker to use a stolen root password as the attacker first has to get access to a system
    user ID.
  impact:  In this recommendation we specify the group system in order to leave this recommendation as a Level 1, IG1 recommendation.
     Further, as IG1 recommendation - we permit the attribute login to be true, to permit direct root login using an HMC.
     A higher level of security would create a new group - specific for su to root and that group name would be used in the
    specification.  Thus, the Remediation procedure below specifies system as the correct group name. This is merely an initial
    solution.  In any case, sugroups should not equal ALL.
  references: []
  page_start: 459
  audit_raw: ' From the command prompt, execute the following commands:

    lsuser -a login rlogin su root

     The command should yield the following output:

    root login=true rlogin=false su=true

    lsuser -a sugroups root

     The command should NOT yield the following output:

    root sugroups=ALL

    459 | P a g e'
  remediation: 'In /etc/security/user, set the root stanza sugroups attribute to system:

    chuser login=true rlogin=false su=true sugroups=system root'
  checks:
  - type: manual_review
    info: ' From the command prompt, execute the following commands:

      lsuser -a login rlogin su root

       The command should yield the following output:

      root login=true rlogin=false su=true

      lsuser -a sugroups root

       The command should NOT yield the following output:

      root sugroups=ALL

      459 | P a g e'
    severity: medium
- id: 3.6.10
  title: Disable core dumps
  scoring: scored
  profile:
  - Level 1
  description: This change disables core dumps in the default user stanza of /etc/security/limits and also ensures the fullcore
    kernel parameter is set to false.
  rationale: The creation of core dumps can reveal pertinent system information, potentially even passwords, within the core
    file. The ability to create a core dump is also a vulnerability to be exploited by a hacker. The commands below disable
    core dumps by default, but they may be specifically enabled for a particular user in /etc/security/limits.
  impact: ''
  references: []
  page_start: 461
  audit_raw: 'From the command prompt, execute the following command to validate the

    /etc/security/limits changes:

    lssec -f /etc/security/limits -s default -a core -a core_hard

    The above command should yield the following output:

    default core=0 core_hard=0

    Ensure that the fullcore kernel parameter has been set to false:

    lsattr -El sys0 -a fullcore

    The above command should yield the following output:

    fullcore false Enable full CORE dump True'
  remediation: 'Change the default user stanza attributes core and core_hard in /etc/security/limits

    and then set the fullcore kernel parameter to false:

    chsec -f /etc/security/limits -s default -a core=0 -a core_hard=0

    chdev -l sys0 -a fullcore=false

    461 | P a g e'
  checks:
  - type: manual_review
