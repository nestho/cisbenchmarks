- id: 3.3.5.2
  title: NFS - enable both nosuid and nodev options on NFS client mounts
  scoring: scored
  profile:
  - Level 1
  description: Disable suid/sgid program execution and/or access to system devices via permissions set on any mounted NFS
    filesystem.
  rationale: Setting the nosuid and nodev options means that files on the NFS server cannot be used to gain privileged access
    on the client. This hampers a malicious user from creating an attack vector on the server and then log onto an NFS client
    as a standard user and use the suid/sgid program to effectively become another user (especially root) on that client.
    The nodev options blocks malicious/accidental (raw) access to system devices (e.g., /dev/kmem, /dev/rhdisk0). Access to
    devices is not exclusive to the /dev directory. Device access is so-called special-files that are defined as a Major,
    Minor device id's.
  impact: ''
  references: []
  page_start: 252
  audit_raw: 'For each NFS filesystem, ensure that the options have been changed to reflect the nosuid

    option:

    lsnfsmnt -l | /usr/bin/egrep -v "^Name" | /usr/bin/grep -v "nosuid"

    lsnfsmnt -l | /usr/bin/egrep -v "^Name" | /usr/bin/grep -v "nodev"

    Both commands should not yield the any output.

    252 | P a g e'
  remediation: "For each NFS mount, disable suid programs and device access. List the current NFS mounts:\nlsnfsmnt -l | /usr/bin/egrep\
    \ -v \"^Name\" | /usr/bin/grep -v \"nosuid\" | while\nread remote local host rest; do\n chnfsmnt -d ${remote} -f ${local}\
    \ -h ${host} -y -z\ndone\nlsnfsmnt -l | /usr/bin/egrep -v \"^Name\" | /usr/bin/grep -v \"nodev\" | while\nread remote\
    \ local host rest; do\n chnfsmnt -d ${remote} -f ${local} -h ${host} -y -z\ndone\nNOTES:\n The NFS mount needs is re-mounted\
    \ automatically by chnfsmnt.\n The second loop might not do anything as both loops set both nosuid (-y) and nodev\n(-z)"
  checks:
  - type: manual_review
    info: 'For each NFS filesystem, ensure that the options have been changed to reflect the nosuid

      option:

      lsnfsmnt -l | /usr/bin/egrep -v "^Name" | /usr/bin/grep -v "nosuid"

      lsnfsmnt -l | /usr/bin/egrep -v "^Name" | /usr/bin/grep -v "nodev"

      Both commands should not yield the any output.

      252 | P a g e'
    severity: medium
- id: 3.3.5.3
  title: NFS - localhost removal
  scoring: scored
  profile:
  - Level 1
  description: Remove any reference to localhost or localhost aliases from /etc/exports.
  rationale: If the RPC portmapper has proxy forwarding enabled, which is a default setting in many vendor versions. You must
    not export your local filesytems back to the localhost, either by name or to the alias localhost, and you must not export
    to any netgroups of which your host is a member. If proxy forwarding is enabled, an attacker may carefully craft NFS packets
    and send them to the portmapper, which in turn, forwards them to the NFS server. As the packets come from the portmapper
    process, which runs as root, they appear to be coming from a trusted system. This configuration may allow anyone to alter
    and delete files at will.
  impact: ''
  references: []
  page_start: 254
  audit_raw: 'Re-review /etc/exports if the file was updated, to validate the changes:

    cat /etc/exports

    254 | P a g e'
  remediation: 'Remove any reference to localhost or localhost aliases in /etc/exports: Review the

    content of /etc/exports and check for localhost or localhost aliases:

    cat /etc/exports

    NOTE: If instances of localhost or localhost aliases are found, edit the file and remove them.

    Create a copy of /etc/exports:

    cp -p /etc/exports /etc/exports.pre_cis

    Edit the file:

    vi /etc/exports

    Edit the relevant NFS exports to remove the localhost access, for example:

    /nfsexport sec=sys,rw,access=localhost:testserver

    If /etc/exports is updated, as localhost references have been removed, update the current

    NFS export options:

    exportfs -a'
  checks:
