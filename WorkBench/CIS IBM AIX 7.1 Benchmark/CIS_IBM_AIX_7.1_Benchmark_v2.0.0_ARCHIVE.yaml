- id: 3.1.1.1
  title: All accounts must have a hashed password
  scoring: scored
  profile:
  - Level 1
  description: All (unlocked) accounts on the server must have a password. For this recommendation we look at the so-called
    files registery - as we cannot reliably review the entries kept in a centralized authentication system such as LDAP or
    Kerberos.
  rationale: An account password is a secret code word that must be entered to gain access to the account. If an account exists
    that has a blank password, multiple users may access the account without authentication and leave a weak audit trail.
    An attacker may gain unauthorized system access or perform malicious actions, which then cannot be attributed to any specific
    individual.
  impact: If no password hash is available and a locked account gets unlocked then the account is available without any verification
    aka authentication. 42 | P a g e
  references: []
  page_start: 42
  audit_raw: "Run the command:\nPID=$$\nnow=$(date -u +\"%s\")\numask 077\n/usr/bin/egrep -p \"password = +$\" /etc/security/passwd\
    \ | grep \":\" | awk -F:\n'{ print $1 } ' >/var/tmp/nopd.${PID}\n/usr/bin/egrep \"(::|:[^!]:)[[:digit:]]+:[[:digit:]]+:\"\
    \ /etc/passwd | awk -F:\n'{ print $1 } ' >>/var/tmp/nopd.${PID}\ntest -z /var/tmp/nopd.${PID}\nif [[ -s /var/tmp/nopd.${PID}\
    \ ]]; then\n sort -u /var/tmp/nopd.${PID} | while read user rest; do\n print \"Account '${user}' is missing an adequate\
    \ password.\"\n # While command below is remediation, you may want to activate it,\nespecially for blank passwords.\n\
    \ # /usr/bin/chuser account_locked='true' ${user}\n done\n print \"## cut/paste commands for 'after the audit' remediation,\
    \ note\naddition of expires as of ${now}\"\n sort -u /var/tmp/nopd.${PID} | while read user rest; do\n print \"/usr/bin/chuser\
    \ account_locked='true' expires=${now} ${user}\"\n done\n print \"## End of cut/paste commands for 'after the audit' remediation\"\
    k\nfi\nrm -f /var/tmp/nopd.${PID}\n The command should not yield output.\n Note: If there is output, it also contains\
    \ a list of chuser commands that can be\nexecuted asap, to lock and expire associated accounts.\n43 | P a g e"
  remediation: " Check for accounts with an empty password field. If any, lock the account and assign\nan impossible password\
    \ hash, as well as flag admin change (ADMCHG) to the\npassword record.\n Check for accounts with an incorrect password\
    \ field in /etc/password. If any, lock\nand expire those accounts.\numask 077\nPID=$$\n# get seconds since epoch\nnow=$(date\
    \ +\"%s\")\nset $(/usr/bin/egrep -c -p \"password = +$\" /etc/security/passwd)\nif [[ $1 != \"0\" ]]; then\n # copy everything\
    \ except entries without password\n /usr/bin/egrep -v -p \"password = +$\" /etc/security/passwd >\n/etc/security/passwd.cis.${PID}\n\
    \ # create new entries with an impossible password hash and append to\npassword.cis\n /usr/bin/egrep -p \"password = +$\"\
    \ /etc/security/passwd | grep \":\" | awk -F:\n'{ print $1 } ' | \\\n while read user; do\n print \"Locking and giving\
    \ account ${user} impossible password hash\"\n /usr/bin/chuser account_locked='true' ${user}\n printf \"%s:\\n\\tpassword\
    \ = *\\n\" ${user} >>\n/etc/security/passwd.cis\n printf \"\\tflags = ADMCHG\\n\\tlastupdate=%s\\n\\n\" ${now} >>\n/etc/security/passwd.cis\n\
    \ done\n cat /etc/security/passwd.cis.${PID} > /etc/security/passwd\n rm /etc/security/passwd.cis.${PID}\nfi\n/usr/bin/egrep\
    \ \"(::|:[^!]:)[[:digit:]]+:[[:digit:]]+:\" /etc/passwd | awk -F:\n'{ print $1 } | \\\nwhile read user; do\n print \"\
    Locking account '${user}' due to incorrect password field in\n/etc/passwd.\"\n /usr/bin/chuser account_locked='true' expires=${now}\
    \ ${user}\ndone"
  checks:
  - type: command
    command: '/usr/bin/egrep -p "password = +$" /etc/security/passwd | grep ":" | awk -F:'
    expected: ''
    severity: medium
    info: "Run the command:\nPID=$$\nnow=$(date -u +\"%s\")\numask 077\n/usr/bin/egrep -p \"password = +$\" /etc/security/passwd\
      \ | grep \":\" | awk -F:\n'{ print $1 } ' >/var/tmp/nopd.${PID}\n/usr/bin/egrep \"(::|:[^!]:)[[:digit:]]+:[[:digit:]]+:\"\
      \ /etc/passwd | awk -F:\n'{ print $1 } ' >>/var/tmp/nopd.${PID}\ntest -z /var/tmp/nopd.${PID}\nif [[ -s /var/tmp/nopd.${PID}\
      \ ]]; then\n sort -u /var/tmp/nopd.${PID} | while read user"
- id: 3.1.1.2
  title: All user id's must be unique
  scoring: scored
  profile:
  - Level 1
  description: All users should have a unique UID. In particular the only user on the system to have a UID of 0 should be
    the root user.
  rationale: The only user with a UID of 0 on the system must be the root user. Any account with a UID of 0 has super user
    privileges on the system and is effectively root. All access to the root account should be via su or sudo to provide an
    audit trail. All other users must also have a unique UID to ensure that file and directory security is not compromised.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'Re-run the command:

    cut -d: -f 3 /etc/passwd |sort -n |uniq -d

    The command above should not yield output'
  remediation: 'Examine the user IDs of all configured users:

    cut -d: -f 3 /etc/passwd |sort -n |uniq -d

    If a number, or numbers are returned from the command above, these are UID values

    which are not unique within the /etc/passwd file. Determine the effected username/s:

    cut -f "1 3" -d : /etc/passwd |grep ":<UID>$"

    NOTE: Any user names returned should either be deleted or have the UID changed

    To remove:

    rmuser <username>

    To change the UID:

    chuser id=<id> <username>

    46 | P a g e'
  checks:
  - type: manual_review
    info: 'Re-run the command:

      cut -d: -f 3 /etc/passwd |sort -n |uniq -d

      The command above should not yield output'
    severity: medium
- id: 3.1.1.3
  title: All group id's must be unique
  scoring: scored
  profile:
  - Level 1
  description: All groups should have a unique GID on the system.
  rationale: All groups should have an individual and unique GID. If GID numbers are shared this could lead to undesirable
    file and directory access.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'Re-run the command:

    cut -d: -f 3 /etc/group |sort -n |uniq -d

    The command above should not yield output'
  remediation: 'Ensure that all group IDs are unique:

    cut -d: -f 3 /etc/group |sort -n | uniq -d

    If a number, or numbers are returned from the command above, these are GID which are

    not unique within the /etc/group file. Determine the effected group names:

    cut -f "1 3" -d : /etc/group |grep ":<GID>$"

    NOTE: Any group names returned should either be deleted or have the UID changed

    To remove:

    rmgroup <groupname>

    To change the UID:

    chgroup id=<id> <groupname>'
  checks:
  - type: manual_review
    info: 'Re-run the command:

      cut -d: -f 3 /etc/group |sort -n |uniq -d

      The command above should not yield output'
    severity: medium
- id: 3.1.2.1
  title: histexpire
  scoring: scored
  profile:
  - Level 1
  description: Defines the period of time in weeks that a user will not be able to reuse a password.
  rationale: In setting the histexpire attribute, it ensures that a user cannot reuse a password within a set period of time.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a histexpire

    The above command should yield the following output:

    default histexpire=26'
  remediation: 'In /etc/security/user, set the default user stanza histexpire attribute to be greater than

    or equal to 26:

    chsec -f /etc/security/user -s default -a histexpire=26

    This means that a user will not be able to reuse any password set in the last 26 weeks.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a histexpire

      The above command should yield the following output:

      default histexpire=26'
    severity: medium
- id: 3.1.2.2
  title: histsize
  scoring: scored
  profile:
  - Level 1
  description: Defines the number of previous passwords that a user may not reuse.
  rationale: In setting the histsize attribute, it enforces a minimum number of previous passwords a user cannot reuse.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a histsize

    The above command should yield the following output:

    default histsize=20'
  remediation: 'In /etc/security/user, set the default user stanza histsize attribute to be (greater than

    or) equal to 20:

    chsec -f /etc/security/user -s default -a histsize=20

    This means that a user may not reuse any of the previous 20 passwords.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a histsize

      The above command should yield the following output:

      default histsize=20'
    severity: medium
- id: 3.1.2.3
  title: loginretries
  scoring: scored
  profile:
  - Level 1
  description: Defines the number of attempts a user has to login to the system before their account is disabled.
  rationale: In setting the loginretries attribute, this ensures that a user can have a pre-defined number of attempts to
    get their password right, prior to locking the account.
  impact: 'The setting chosen here (5) is a group consensus as secure enough. However, a local sitepolicy may have a more
    strict requirement for all, or some systems. While the audit and artifact currently test for exactly 5 - the actual recommendation
    is: greater than 0 (zero) AND (less than or equal to 5 (five) or greater than 0 (zero) AND not greater than 5 (five)'
  references: []
  page_start: 55
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a loginretries

    The above command should yield the following output:

    default loginretries=5'
  remediation: 'In /etc/security/user, set the default stanza loginretries attribute to 5:

    chsec -f /etc/security/user -s default -a loginretries=5

    This means that a user will have 5 attempts to enter the correct password. This does not

    apply to the root user, which has its own stanza entry disabling this feature.

    55 | P a g e'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a loginretries

      The above command should yield the following output:

      default loginretries=5'
    severity: medium
- id: 3.1.2.4
  title: maxage
  scoring: scored
  profile:
  - Level 1
  description: Defines the maximum number of weeks that a password is valid.
  rationale: The maxage attribute enforces regular password changes. We recommend this to be 13 or less, but not 0 which disables
    this setting.
  impact: Historically, this recommendation has been to set maxage=13. In recent years several communities (e.g., Windows,
    DoD) have concluded that too frequent forced password changes leads to both weaker passwords and weaker/bad password discipline.
    An initial proposal to increase the maxage to 52 is not unnamimous within the AIX community - so the recommendation, for
    now, remains at 13. Local Policy may decide to follow the other communities and set this value as 52. Due to this lack
    of consensus this control is being set at Level 2. The value chosen by an organization is to maintain overall password
    quality and secrecy.
  references: []
  page_start: 57
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a maxage

    The above command should yield the following output:

    default maxage=13

    57 | P a g e'
  remediation: 'In /etc/security/user, set the default user stanza maxage attribute to a number greater

    than 0 but less than or equal to 13:

    chsec -f /etc/security/user -s default -a maxage=13

    This means that a user password must be changed 13 weeks after being set. If 0 is set then

    this effectively disables password ageing.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a maxage

      The above command should yield the following output:

      default maxage=13

      57 | P a g e'
    severity: medium
- id: 3.1.2.5
  title: maxexpired
  scoring: scored
  profile:
  - Level 1
  description: Defines the number of weeks after maxage, that a password can be reset by the user.
  rationale: The maxexpired attribute limits the number of weeks after password expiry that a password may be changed by the
    user.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a maxexpired

    The above command should yield the following output:

    default maxexpired=4'
  remediation: 'In /etc/security/user, set the default user stanza maxexpired attribute to 4:

    chsec -f /etc/security/user -s default -a maxexpired=4

    This means that a user can reset their password up to 4 weeks after it has expired. After

    this an administrative user would need to reset the password.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a maxexpired

      The above command should yield the following output:

      default maxexpired=4'
    severity: medium
- id: 3.1.2.6
  title: maxrepeats
  scoring: scored
  profile:
  - Level 1
  description: Defines the maximum number of times a character may appear in a password.
  rationale: In setting the maxrepeats attribute, it enforces a maximum number of character repeats within a password.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a maxrepeats

    The above command should yield the following output:

    default maxrepeats=4'
  remediation: 'In/etc/security/user, set the default user stanza maxrepeats attribute to 2:

    chsec -f /etc/security/user -s default -a maxrepeats=4

    This means that a user may not use the same character more than four (4) times in a

    password.

    This value has been increased from two (2) - in parallel with the increase in minlen from

    eight (8) to fourteen (14).'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a maxrepeats

      The above command should yield the following output:

      default maxrepeats=4'
    severity: medium
- id: 3.1.2.7
  title: minage
  scoring: scored
  profile:
  - Level 1
  description: Defines the minimum number of weeks before a password can be changed.
  rationale: The minage attribute prohibits users changing their password until a set number of weeks have passed.
  impact: The AIX community prefers to rely on the AIX attribute histexpire rather than a historical minage value. Historically,
    the minage attribute has been used to prevent a user from write a script to spool through histsize passwords, and then
    return to the same password as before. The attribute histexpire overrides histsize. Therefore, there is no need to force
    a user to request assistance from system administrators in order to reset a poorly chosen password, or in the case of
    special accounts that policy states passwords are meant for "one time use". Again, since AIX has a different way to prevent
    scripted password re-cycling, the need for minage is not longer warranted.
  references: []
  page_start: 63
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a minage

    The above command should yield the following output:

    default minage=0

    63 | P a g e'
  remediation: 'In/etc/security/user, set the default user stanza minage attribute to 1:

    chsec -f /etc/security/user -s default -a minage=0

    This means that a user can change their password at any time.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a minage

      The above command should yield the following output:

      default minage=0

      63 | P a g e'
    severity: medium
