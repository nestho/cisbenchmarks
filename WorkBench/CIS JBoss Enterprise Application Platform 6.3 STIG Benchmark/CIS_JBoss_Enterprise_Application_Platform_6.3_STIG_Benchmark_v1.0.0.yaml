- id: '1.37'
  title: JBOS-AS-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss management Interfaces must be integrated with a centralized authentication mechanism that is configured
    to manage accounts according to DoD policy. GROUP ID: V-213529 RULE ID: SV-213529r981681'
  rationale: JBoss EAP provides a security realm called ManagementRealm. By default, this realm uses the mgmt-users.properties
    file for authentication. Using file-based authentication does not allow the JBoss server to be in compliance with a wide
    range of user management requirements such as automatic disabling of inactive accounts as per DoD policy. To address this
    issue, the management interfaces used to manage the JBoss server must be associated with a security realm that provides
    centralized authentication management. Examples are AD or LDAP. Management of user identifiers is not applicable to shared
    information system accounts (e.g., guest and anonymous accounts). It is commonly the case that a user account is the name
    of an information system account associated with an individual.
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

