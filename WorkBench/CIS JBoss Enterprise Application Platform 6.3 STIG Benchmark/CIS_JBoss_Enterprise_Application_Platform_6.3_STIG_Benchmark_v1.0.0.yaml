- id: '1.48'
  title: JBOS-AS-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must be configured to log all admin activity. GROUP ID: V-213540 RULE ID: SV-213540r961362'
  rationale: In order to be able to provide a forensic history of activity, the application server must ensure users who are
    granted a privileged role or those who utilize a separate distinct account when accessing privileged functions or data
    have their actions logged. If privileged activity is not logged, no forensic logs can be used to establish accountability
    for privileged actions that occur on the system.
