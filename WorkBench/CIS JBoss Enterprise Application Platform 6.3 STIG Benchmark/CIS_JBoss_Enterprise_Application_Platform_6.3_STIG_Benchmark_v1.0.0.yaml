- id: '1.15'
  title: JBOS-AS-000115
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss Log Formatter must be configured to produce log records that establish the date and time the events
    occurred. GROUP ID: V-213508 RULE ID: SV-213508r960894'
  rationale: Application server logging capability is critical for accurate forensic analysis. Without sufficient and accurate
    information, a correct replay of the events cannot be determined. Ascertaining the correct order of the events that occurred
    is important during forensic analysis. Events that appear harmless by themselves might be flagged as a potential threat
    when properly viewed in sequence. By also establishing the event date and time, an event can be properly viewed with an
    enterprise tool to fully see a possible threat in its entirety. Without sufficient information establishing when the log
    event occurred, investigation into the cause of event is severely hindered. Log record content that may be necessary to
    satisfy the requirement of this control includes, but is not limited to, time stamps, source and destination IP addresses,
    user/process identifiers, event descriptions, application-specific events, success/fail indications, filenames involved,
    access control, or flow control rules invoked. In addition to logging event information, application servers must also
    log the corresponding dates and times of these events. Examples of event data include, but are not limited to, Java Virtual
    Machine (JVM) activity, HTTPD activity, and application server-related system process activity.
  impact: ''
  references: []
  page_start: 41
