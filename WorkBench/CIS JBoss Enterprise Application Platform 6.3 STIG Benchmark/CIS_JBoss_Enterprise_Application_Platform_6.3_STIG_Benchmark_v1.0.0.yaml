    severity: medium
- id: '1.54'
  title: JBOS-AS-000640
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server, when hosting mission critical applications, must be in a highavailability (HA) cluster.
    GROUP ID: V-213546 RULE ID: SV-213546r961620'
  rationale: A MAC I system is a system that handles data vital to the organization's operational readiness or effectiveness
    of deployed or contingency forces. A MAC I system must maintain the highest level of integrity and availability. By HA
    clustering the application server, the hosted application and data are given a platform that is load-balanced and provides
    high availability.
  impact: ''
  references: []
  page_start: 117
  audit_raw: 'Interview the system admin and determine if the applications hosted on the application

    server are mission critical and require load balancing (LB) or high availability (HA).

    If the applications do not require LB or HA, this requirement is NA.

    If the documentation shows the LB or HA services are being provided by another

    system other than the application server, this requirement is NA.

    If applications require LB or HA, request documentation from the system admin that

    identifies what type of LB or HA configuration has been implemented on the application

    server.

    Ask the system admin to identify the components that require protection. Some options

    are included here as an example. Bear in mind the examples provided are not complete

    and absolute and are only provided as examples. The components being made

    redundant or HA by the application server will vary based upon application availability

    requirements.

    Examples are:

    Instances of the Application Server

    Web Applications

    Stateful, stateless and entity Enterprise Java Beans (EJBs)

    Single Sign On (SSO) mechanisms

    Distributed Cache

    HTTP sessions

    JMS and Message Services.

    If the hosted application requirements specify LB or HA and the JBoss server has not

    been configured to offer HA or LB, this is a finding.'
  remediation: Configure the application server to provide LB or HA services for the hosted application.
  checks:
  - type: manual_review
    info: 'Interview the system admin and determine if the applications hosted on the application

      server are mission critical and require load balancing (LB) or high availability (HA).

      If the applications do not require LB or HA, this requirement is NA.

      If the documentation shows the LB or HA services are being provided by another

      system other than the application server, this requirement is NA.

      If applications require LB or HA, request documentation from the system admin that

      identifies what type of LB or'
    severity: medium
- id: '1.55'
  title: JBOS-AS-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to use an approved TLS version. GROUP ID: V-213547 RULE ID: SV-213547r961632'
  rationale: Preventing the disclosure of transmitted information requires that the application server take measures to employ
    some form of cryptographic mechanism in order to protect the information during transmission. This is usually achieved
    through the use of Transport Layer Security (TLS). JBoss relies on the underlying SSL implementation running on the OS.
    This can be either Java based or OpenSSL. The SSL protocol setting determines which SSL protocol is used. SSL has known
    security vulnerabilities, so TLS should be used instead. If data is transmitted unencrypted, the data then becomes vulnerable
    to disclosure. The disclosure may reveal user identifier/password combinations, website code revealing business logic,
    or other user personal information. FIPS 140-2 approved TLS versions include TLS V1.2 or greater. TLS must be enabled,
    and non-FIPS-approved SSL versions must be disabled. NIST SP 800-52 specifies the preferred configurations for government
    systems.
  impact: ''
  references: []
  page_start: 119
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Validate that the TLS protocol is used for HTTPS connections.

    Run the command:

    "ls /subsystem=web/connector=https/ssl=configuration"

    If a TLS V1.2 or higher protocol is not returned, this is a finding.'
  remediation: 'Reference section 4.6 of the JBoss EAP 6.3 Security Guide located on the Red Hat

    vendor''s web site for step-by-step instructions on establishing SSL encryption on JBoss.

    The overall steps include:

    1. Add an HTTPS connector.

    2. Configure the SSL encryption certificate and keys.

    3. Set the protocol to TLS V1.2 or greater.'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

