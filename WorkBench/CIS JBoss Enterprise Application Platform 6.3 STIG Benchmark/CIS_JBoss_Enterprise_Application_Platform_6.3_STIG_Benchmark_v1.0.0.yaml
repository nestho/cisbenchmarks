- id: '1.65'
  title: JBOS-AS-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to generate log records for all account creations, modifications, disabling, and
    termination events. GROUP ID: V-213557 RULE ID: SV-213557r961842'
  rationale: The maintenance of user accounts is a key activity within the system to determine access and privileges. Through
    changes to accounts, an attacker can create an account for persistent access, modify an account to elevate privileges,
    or terminate/disable an account(s) to cause a DoS for user(s). To be able to track and investigate these actions, log
    records must be generated for any account modification functions. Application servers either provide a local user store,
    or they can integrate with enterprise user stores like LDAP. As such, the application server must be able to generate
    log records on account creation, modification, disabling, and termination.
  impact: ''
  references: []
  page_start: 137
