- id: '1.25'
  title: JBOS-AS-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'JBoss process owner interactive access must be restricted. GROUP ID: V-213518 RULE ID: SV-213518r960963'
  rationale: JBoss does not require admin rights to operate and should be run as a regular user. In addition, if the user
