- id: '1.42'
  title: JBOS-AS-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must be configured to restrict access to the web servers private key to authenticated system
    administrators. GROUP ID: V-213534 RULE ID: SV-213534r961041'
  rationale: The cornerstone of the PKI is the private key used to encrypt or digitally sign information. If the private key
    is stolen, this will lead to the compromise of the authentication and non-repudiation gained through PKI because the attacker
    can use the private key to digitally sign documents and can pretend to be the authorized user. Both the holders of a digital
    certificate and the issuing authority must protect the computers, storage devices, or whatever they use to keep the private
    keys. Java-based application servers utilize the Java keystore, which provides storage for cryptographic keys and certificates.
    The keystore is usually maintained in a file stored on the file system.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'The default location for the keystore used by the JBoss vault is the

    <JBOSS_HOME>/vault/ folder.

    If a vault keystore has been created, by default it will be in the file:

    <JBOSS_HOME>/vault/vault.keystore. The file stores a single key, with the default alias

    vault, which will be used to store encrypted strings, such as passwords, for JBoss EAP.

    Browse to the JBoss vault folder using the relevant OS commands.

    Review the file permissions and ensure only system administrators and JBoss users are

    allowed access.

    Owner can be full access

    Group can be full access

    All others must be restricted to execute access or no permission.

    If non-system administrators are allowed to access the <JBOSS_HOME>/vault/

    folder, this is a finding.'
  remediation: 'Configure the application server OS file permissions on the corresponding private key to

    restrict access to authorized accounts or roles.'
