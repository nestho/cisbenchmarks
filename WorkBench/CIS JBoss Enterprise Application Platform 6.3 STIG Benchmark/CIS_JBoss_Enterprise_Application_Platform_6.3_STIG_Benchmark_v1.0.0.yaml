- id: '1.46'
  title: JBOS-AS-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Network access to HTTP management must be disabled on domain-enabled application servers not designated as
    the domain controller. GROUP ID: V-213538 RULE ID: SV-213538r961281'
  rationale: When configuring JBoss application servers into a domain configuration, HTTP management capabilities are not
    required on domain member servers as management is done via the server that has been designated as the domain controller.
    Leaving HTTP management capabilities enabled on domain member servers increases the attack surfaces; therefore, management
    services on domain member servers must be disabled and management services performed via the domain controller.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'Log on to each of the JBoss domain member servers.

    Note: Sites that manage systems using the JBoss Operations Network client require

    HTTP interface access. It is acceptable that the management console alone be disabled

    rather than disabling the entire interface itself.

    Run the <JBOSS_HOME>/bin/jboss-cli command line interface utility and connect to the

    JBoss server.

    Run the following command:

    ls /core-service=management/management-interface=httpinterface/

    If "console-enabled=true", this is a finding.'
  remediation: 'Run the <JBOSS_HOME>/bin/jboss-cli command line interface utility.

    Connect to the JBoss server and run the following command.

