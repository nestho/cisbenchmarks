- id: '1.45'
  title: JBOS-AS-000425
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to JBoss log files must be restricted to authorized users. GROUP ID: V-213537 RULE ID: SV-213537r961170'
  rationale: If the application provides too much information in error logs and administrative messages to the screen, this
    could lead to compromise. The structure and content of error messages need to be carefully considered by the organization
    and development team. The extent to which the information system is able to identify and handle error conditions is guided
    by organizational policy and operational requirements. Application servers must protect the error messages that are created
    by the application server. All application server users' accounts are used for the management of the server and the applications
    residing on the application server. All accounts are assigned to a certain role with corresponding access rights. The
    application server must restrict access to error messages so only authorized users may view them. Error messages are usually
    written to logs contained on the file system. The application server will usually create new log files as needed and must
    take steps to ensure that the proper file permissions are utilized when the log files are created.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'If the JBoss log folder is installed in the default location and 213514 (JBOS-AS-000170)

    is not a finding, the log folders are protected and this requirement is not a finding.

    By default, JBoss installs its log files into a sub-folder of the "jboss-eap-6.3" home

    folder.

    Using a UNIX like OS example, the default location for log files is:

    JBOSS_HOME/standalone/log

    JBOSS_HOME/domain/log

    For a standalone configuration:

    JBOSS_HOME/standalone/log/server.log" Contains all server log messages, including

    server startup messages.

    For a domain configuration:

    JBOSS_HOME/domain/log/hostcontroller.log

    Host Controller boot log. Contains log messages related to the startup of the host

    controller.

    JBOSS_HOME/domain/log/processcontroller.log

    Process controller boot log. Contains log messages related to the startup of the process

    controller.

    JBOSS_HOME/domain/servers/SERVERNAME/log/server.log

    The server log for the named server. Contains all log messages for that server,

    including server startup messages.

    Log on with an OS user account with JBoss access and permissions.

    Navigate to the "Jboss-eap-6.3" folder using the relevant OS commands for either a

    UNIX like OS or a Windows OS.

    Examine the permissions of the JBoss logs folders.

    Owner can be full access.

    Group can be full access.

    All others must be restricted.

    If the JBoss log folder is world readable or world writeable, this is a finding.'
  remediation: Configure file permissions on the JBoss log folder to protect from unauthorized access.
  checks:
  - type: manual_review
    info: 'If the JBoss log folder is installed in the default location and 213514 (JBOS-AS-000170)

