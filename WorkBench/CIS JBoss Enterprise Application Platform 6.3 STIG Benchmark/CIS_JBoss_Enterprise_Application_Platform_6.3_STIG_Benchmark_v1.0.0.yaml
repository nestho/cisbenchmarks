  profile:
  - 'SEVERITY: CAT II'
  description: 'The application server must produce log records that contain sufficient information to establish the outcome
    of events. GROUP ID: V-213511 RULE ID: SV-213511r960903'
  rationale: Information system logging capability is critical for accurate forensic analysis. Log record content that may
    be necessary to satisfy the requirement of this control includes, but is not limited to, time stamps, source and destination
    IP addresses, user/process identifiers, event descriptions, application-specific events, success/fail indications, filenames
    involved, access control or flow control rules invoked. Success and failure indicators ascertain the outcome of a particular
    application server event or function. As such, they also provide a means to measure the impact of an event and help authorized
    personnel to determine the appropriate response. Event outcome may also include event-specific results (e.g., the security
    state of the information system after the event occurred).
