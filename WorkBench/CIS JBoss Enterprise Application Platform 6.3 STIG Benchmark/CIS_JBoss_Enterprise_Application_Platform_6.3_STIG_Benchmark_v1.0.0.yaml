    severity: medium
- id: '1.56'
  title: JBOS-AS-000655
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to use an approved cryptographic algorithm in conjunction with TLS. GROUP ID: V-213548
    RULE ID: SV-213548r961635'
  rationale: Preventing the disclosure or modification of transmitted information requires that application servers take measures
    to employ approved cryptography in order to protect the information during transmission over the network. This is usually
    achieved through the use of Transport Layer Security (TLS), SSL VPN, or IPSec tunnel. If data in transit is unencrypted,
    it is vulnerable to disclosure and modification. If approved cryptographic algorithms are not used, encryption strength
    cannot be assured. FIPS 140-2 approved TLS versions include TLS V1.2 or greater. TLS must be enabled, and non-FIPS-approved
    SSL versions must be disabled. NIST SP 800-52 specifies the preferred configurations for government systems.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

