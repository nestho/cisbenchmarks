- id: '1.40'
  title: JBOS-AS-000305
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'LDAP enabled security realm value allow-empty-passwords must be set to false. GROUP ID: V-213532 RULE ID:
    SV-213532r961029'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords during
    transmission. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Application
    servers have the capability to utilize either certificates (tokens) or user IDs and passwords in order to authenticate.
    When the application server transmits or receives passwords, the passwords must be encrypted.
