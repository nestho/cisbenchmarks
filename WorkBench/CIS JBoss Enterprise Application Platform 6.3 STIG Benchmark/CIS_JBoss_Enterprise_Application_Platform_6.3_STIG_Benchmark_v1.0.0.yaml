controls:
- id: '1.1'
  title: JBOS-AS-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'HTTP management session traffic must be encrypted. GROUP ID: V-213494 RULE ID: SV-213494r960759'
  rationale: Types of management interfaces utilized by the JBoss EAP application server include web-based HTTP interfaces
    as well as command line-based management interfaces. In the event remote HTTP management is required, the access must
    be via HTTPS. This requirement is in conjunction with the requirement to isolate all management access to a restricted
    network.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script. Connect to the server and authenticate.

    For a standalone configuration run the following command:

    "ls /core-service=management/management-interface=http-interface"

    If "secure-socket-binding"=undefined, this is a finding.

    For a domain configuration run the following command:

    "ls /host=master/core-service=management/management-interface=http-interface"

    If "secure-port" is undefined, this is a finding.'
  remediation: 'Follow the specific instructions in the Red Hat Security Guide for EAP version 6.3 to

    configure the management console for HTTPS.

    This involves the following steps.

    1. Create a keystore in JKS format.

    2. Ensure the management console binds to HTTPS.

    3. Create a new Security Realm.

    4. Configure Management Interface to use new security realm.

    5. Configure the management console to use the keystore.

    6. Restart the EAP server.'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script. Connect to the server and authenticate.

      For a standalone configuration run the following command:

      "ls /core-service=management/management-interface=http-interface"

      If "secure-socket-binding"=undefined, this is a finding.

      For a domain configuration run the following command:

      "ls /host=master/core-service=manag'
    severity: medium
- id: '1.2'
  title: JBOS-AS-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'HTTPS must be enabled for JBoss web interfaces. GROUP ID: V-213495 RULE ID: SV-213495r960762'
  rationale: Encryption is critical for protection of web-based traffic. If encryption is not being used to protect the application
    server's web connectors, malicious users may gain the ability to read or modify the application traffic while it is in
    transit over the network. The use of cryptography on web connectors secures web-based traffic and mitigates that risk.
    HTTPS and Transport Layer Security (TLS) are the means in which cryptographic protections are applied to web connectors.
    FIPS 140-2 approved TLS versions include TLS V1.2 or greater.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Review the web subsystem and ensure that HTTPS is enabled.

    Run the command:

    For a managed domain:

    "ls /profile=<PROFILE_NAME>/subsystem=web/connector="

    For a standalone system:

    "ls /subsystem=web/connector="

    If "https" is not returned, this is a finding.'
  remediation: 'Follow procedure "4.4. Configure the JBoss Web Server to use HTTPS." The detailed

    procedure is found in the JBoss EAP 6.3 Security Guide available at the vendor''s site,

    RedHat.com. An overview of steps is provided here.

    1. Obtain or generate DoD-approved SSL certificates.

    2. Configure the SSL certificate using your certificate values.

    3. Set the SSL protocol to TLS V1.2 or greater.'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script.

      Connect to the server and authenticate.

      Review the web subsystem and ensure that HTTPS is enabled.

      Run the command:

      For a managed domain:

      "ls /profile=<PROFILE_NAME>/subsystem=web/connector="

      For a standalone system:

      "ls /subsystem=web/connector="

      If "https" is not returned, this is a finding.'
    severity: medium
- id: '1.3'
  title: JBOS-AS-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Java permissions must be set for hosted applications. GROUP ID: V-213496 RULE ID: SV-213496r1069472'
  rationale: The Java Security Manager is a java class that manages the external boundary of the Java Virtual Machine (JVM)
    sandbox, controlling how code executing within the JVM can interact with resources outside the JVM. The JVM requires a
    security policy in order to restrict application access. A properly configured security policy will define what rights
    the application has to the underlying system. For example, rights to make changes to files on the host system or to initiate
    network sockets in order to connect to another system.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

    finding.

    Note: Security Manager was deprecated in Java 17 and will be permanently removed in

    JDK 24.

    For additional information: https://openjdk.org/jeps/486

    Obtain documentation from the admin that identifies the applications hosted on the

    JBoss server as well as the corresponding rights the application requires. For example,

    if the application requires network socket permissions and file write permissions,

    document those requirements.

    1. Identify the JBoss installation as either domain or standalone and review the

    relevant configuration file.

    2. For domain installs: JBOSS_HOME/bin/domain.conf

    3. For standalone installs: JBOSS_HOME/bin/standalone.conf

    4. Identify the location and name of the security policy by reading the JAVA_OPTS

    flag -Djava.security.policy= where will indicate name and location of security

    policy. If the application uses a policy URL, obtain the URL and policy file from

    system admin.

    5. Review security policy and ensure hosted applications have the appropriate

    restrictions placed on them per documented application functionality

    requirements.

    If the security policy does not restrict application access to host resources per

    documented requirements, this is a finding.'
  remediation: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

    finding.

    Configure the Java security manager to enforce access restrictions to the host system

    resources in accordance with application design and resource requirements.'
  checks:
  - type: manual_review
    info: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

      finding.

      Note: Security Manager was deprecated in Java 17 and will be permanently removed in

      JDK 24.

      For additional information: https://openjdk.org/jeps/486

      Obtain documentation from the admin that identifies the applications hosted on the

      JBoss server as well as the corresponding rights the application requires. For example,

      if the application requires network socket permissions and file write permissions,

      d'
    severity: medium
- id: '1.4'
  title: JBOS-AS-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Java Security Manager must be enabled for the JBoss application server. GROUP ID: V-213497 RULE ID: SV-213497r1069475'
  rationale: The Java Security Manager is a java class that manages the external boundary of the Java Virtual Machine (JVM)
    sandbox, controlling how code executing within the JVM can interact with resources outside the JVM. The Java Security
    Manager uses a security policy to determine whether a given action will be permitted or denied. To protect the host system,
    the JBoss application server must be run within the Java Security Manager.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

    finding.

    Note, Security Manager was deprecated in Java 17 and will be permanently removed in

    JDK 24.

    For additional information: https://openjdk.org/jeps/486

    To determine if the Java Security Manager is enabled for JBoss, the startup commands

    must be examined. JBoss can be configured to run in either "domain" or a "standalone"

    mode. JBOSS_HOME is the variable home directory for the JBoss installation. Use

    relevant OS commands to navigate the file system.

    1. For a managed domain installation, review the domain.conf and domain.conf.bat

    files:

    JBOSS_HOME/bin/domain.conf

    JBOSS_HOME/bin/domain.conf.bat

    In domain.conf file, ensure there is a JAVA_OPTS flag that loads the Java Security

    Manager as well as a relevant Java Security policy. Example:

    JAVA_OPTS="$JAVA_OPTS -Djava.security.manager -

    Djava.security.policy==$PWD/server.policy -

    Djboss.home.dir=/path/to/JBOSS_HOME -Djboss.modules.policypermissions=true"

    In domain.conf.bat file, ensure JAVA_OPTS flag is set. Example:

    set "JAVA_OPTS=%JAVA_OPTS% -Djava.security.manager -

    Djava.security.policy==/path/to/server.policy -

    Djboss.home.dir=/path/to/JBOSS_HOME -Djboss.modules.policypermissions=true"

    2. For a standalone installation, review the standalone.conf and standalone.conf.bat

    files:

    JBOSS_HOME/bin/standalone.conf

    JBOSS_HOME/bin/standalone.conf.bat

    In the standalone.conf file, ensure the JAVA_OPTS flag is set. Example:

    JAVA_OPTS="$JAVA_OPTS -Djava.security.manager -

    Djava.security.policy==$PWD/server.policy -Djboss.home.dir=$JBOSS_HOME

    -Djboss.modules.policy-permissions=true"

    In the standalone.conf.bat file, ensure the JAVA_OPTS flag is set. Example:

    set "JAVA_OPTS=%JAVA_OPTS% -Djava.security.manager -

    Djava.security.policy==/path/to/server.policy -

    Djboss.home.dir=%JBOSS_HOME% -Djboss.modules.policy-permissions=true"

    If the security manager is not enabled and a security policy not defined, this is a finding.'
  remediation: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

    finding.

    For a domain installation:

    Enable the respective JAVA_OPTS flag in both the domain.conf and the

    domain.conf.bat files.

    For a standalone installation:

    Enable the respective JAVA_OPTS flag in both the standalone.conf and the

    standalone.conf.bat files.'
  checks:
  - type: manual_review
    info: 'Enabling the Security Manager in JDK 24 is an error and if using JDK 24, this is not a

      finding.

      Note, Security Manager was deprecated in Java 17 and will be permanently removed in

      JDK 24.

      For additional information: https://openjdk.org/jeps/486

      To determine if the Java Security Manager is enabled for JBoss, the startup commands

      must be examined. JBoss can be configured to run in either "domain" or a "standalone"

      mode. JBOSS_HOME is the variable home directory for the JBoss installation. Use

      rele'
    severity: medium
- id: '1.5'
  title: JBOS-AS-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The JBoss server must be configured with Role Based Access Controls. GROUP ID: V-213498 RULE ID: SV-213498r1028281'
  rationale: By default, the JBoss server is not configured to utilize role based access controls (RBAC). RBAC provides the
    capability to restrict user access to their designated management role, thereby limiting access to only the JBoss functionality
    that they are supposed to have. Without RBAC, the JBoss server is not able to enforce authorized access according to role.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Run the following command:

    For standalone servers:

    "ls /core-service=management/access=authorization/"

    For managed domain installations, target the domain-management resource (the core

    management service for the entire domain):

    "ls /core-service=management/access=authorization/"

    If the "provider" attribute is not set to "rbac", this is a finding.

    (Default, the access control is "provider=simple")'
  remediation: 'Run the following command.

    <JBOSS_HOME>/bin/jboss-cli.sh -c -> connect -> cd /coreservice=management/access-authorization :write-attribute(name=provider,

    value=rbac)

    Restart JBoss.

    Map users to roles by running the following command. Uppercase words are variables.

    role-mapping=ROLENAME/include=ALIAS:add(name-USERNAME, type=USER ROLE)'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script.

      Connect to the server and authenticate.

      Run the following command:

      For standalone servers:

      "ls /core-service=management/access=authorization/"

      For managed domain installations, target the domain-management resource (the core

      management service for the entire domain):

      "ls /core-service=management/access=author'
    severity: medium
- id: '1.6'
  title: JBOS-AS-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Users in JBoss Management Security Realms must be in the appropriate role. GROUP ID: V-213499 RULE ID: SV-213499r960792'
  rationale: Security realms are a series of mappings between users and passwords and users and roles. There are 2 JBoss security
    realms provided by default; they are "management realm" and "application realm". Management realm stores authentication
    information for the management API, which provides functionality for the web-based management console and the management
    command line interface (CLI). mgmt-groups.properties stores user to group mapping for the ManagementRealm but only when
    role-based access controls (RBAC) is enabled. If management users are not in the appropriate role, unauthorized access
    to JBoss resources can occur.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review the mgmt-users.properties file. Also review the section in the standalone.xml or

    domain.xml configuration files. The relevant xml file will depend on if the JBoss server is

    configured in standalone or domain mode.

    Ensure all users listed in these files are approved for management access to the JBoss

    server and are in the appropriate role.

    For domain configurations:

    <JBOSS_HOME>/domain/configuration/mgmt-users.properties.

    <JBOSS_HOME>/domain/configuration/domain.xml

    For standalone configurations:

    <JBOSS_HOME>/standalone/configuration/mgmt-users.properties.

    <JBOSS_HOME>/standalone/configuration/standalone.xml

    If the users listed are not in the appropriate role, this is a finding.'
  remediation: 'Document approved management users and their roles. Configure the application

    server to use RBAC and ensure users are placed into the appropriate roles.'
  checks:
  - type: manual_review
    info: 'Review the mgmt-users.properties file. Also review the section in the standalone.xml or

      domain.xml configuration files. The relevant xml file will depend on if the JBoss server is

      configured in standalone or domain mode.

      Ensure all users listed in these files are approved for management access to the JBoss

      server and are in the appropriate role.

      For domain configurations:

      <JBOSS_HOME>/domain/configuration/mgmt-users.properties.

      <JBOSS_HOME>/domain/configuration/domain.xml

      For standalone configur'
    severity: medium
- id: '1.7'
  title: JBOS-AS-000045
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Silent Authentication must be removed from the Default Application Security Realm. GROUP ID: V-213500 RULE
    ID: SV-213500r960792'
  rationale: Silent Authentication is a configuration setting that allows local OS users access to the JBoss server and a
    wide range of operations without specifically authenticating on an individual user basis. By default $localuser is a Superuser.
    This introduces an integrity and availability vulnerability and violates best practice requirements regarding accountability.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Verify that Silent Authentication has been removed from the default Application security

    realm.

    Run the following command.

    For standalone servers, run the following command:

    "ls /core-service=management/security-realm=ApplicationRealm/authentication"

    For managed domain installations, run the following command:

    "ls /host=HOST_NAME/core-service=management/securityrealm=ApplicationRealm/authentication"

    If "local" is returned, this is a finding.'
  remediation: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Remove the local element from the Application Realm.

    For standalone servers, run the following command:

    /core-service=management/security-realm=

    ApplicationRealm/authentication=local:remove

    For managed domain installations, run the following command:

    /host=HOST_NAME/core-service=management/security-realm=

    ApplicationRealm/authentication=local:remove'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script.

      Connect to the server and authenticate.

      Verify that Silent Authentication has been removed from the default Application security

      realm.

      Run the following command.

      For standalone servers, run the following command:

      "ls /core-service=management/security-realm=ApplicationRealm/authentication"

      For managed domain '
    severity: medium
