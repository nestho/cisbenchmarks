    severity: medium
- id: '1.11'
  title: JBOS-AS-000085
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to allow only the ISSM (or individuals or roles appointed by the ISSM) to select
    which loggable events are to be logged. GROUP ID: V-213504 RULE ID: SV-213504r960882'
  rationale: The JBoss server must be configured to select which personnel are assigned the role of selecting which loggable
    events are to be logged. In JBoss, the role designated for selecting auditable events is the "Auditor" role. The personnel
    or roles that can select loggable events are only the ISSM (or individuals or roles appointed by the ISSM).
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script to start the Command Line Interface (CLI).

    Connect to the server and authenticate.

