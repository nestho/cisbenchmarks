- id: '1.9'
  title: JBOS-AS-000075
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'JBoss management interfaces must be secured. GROUP ID: V-213502 RULE ID: SV-213502r960792'
  rationale: JBoss utilizes the concept of security realms to secure the management interfaces used for JBoss server administration.
    If the security realm attribute is omitted or removed from the management interface definition, access to that interface
    is no longer secure. The JBoss management interfaces must be secured.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Identify the management interfaces. To identity the management interfaces, run the

    following command:

    For standalone servers:

    "ls /core-service=management/management-interface="

    For managed domain installations:

    "ls /host=HOST_NAME/core-service=management/management-interface="

    By default, JBoss provides two management interfaces; they are named "NATIVEINTERFACE" and "HTTP-INTERFACE". The system
    may or may not have both

    interfaces enabled. For each management interface listed as a result of the previous

    command, append the name of the management interface to the end of the following

    command.

    For a standalone system:

    "ls /core-service=management/management-interface=<MANAGEMENT INTERFACE

    NAME>"

    For a managed domain:

    "ls /host=HOST_NAME/core-service=management/management-interface=<MANAGEMENT

    INTERFACE NAME>"

    If the "security-realm=" attribute is not associated with a management realm, this is a

    finding.'
  remediation: 'Identify the security realm used for management of the system. By default, this is called

    "Management Realm".

    If a management security realm is not already available, reference the Jboss EAP 6.3

    system administration guide for instructions on how to create a security realm for

    management purposes. Create the management realm, and assign authentication and

    authorization access restrictions to the management realm.

    Assign the management interfaces to the management realm.'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script.

      Connect to the server and authenticate.

      Identify the management interfaces. To identity the management interfaces, run the

