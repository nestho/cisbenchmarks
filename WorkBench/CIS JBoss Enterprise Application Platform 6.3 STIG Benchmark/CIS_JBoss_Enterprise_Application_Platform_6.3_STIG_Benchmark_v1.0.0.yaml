- id: '1.64'
  title: JBOS-AS-000715
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to generate log records when concurrent logons from different workstations occur
    to the application server management interface. GROUP ID: V-213556 RULE ID: SV-213556r961833'
  rationale: Concurrent logons from different systems could possibly indicate a compromised account. When concurrent logons
    are made from different workstations to the management interface, a log record needs to be generated. This configuration
    setting provides forensic evidence that allows the system administrator to investigate access to the system and determine
    if the duplicate access was authorized or not. JBoss provides a multitude of different log formats, and API calls that
    log access to the system. If the default format and location is not used, the system admin must provide the configuration
    documentation and settings that show that this requirement is being met.
  impact: ''
  references: []
  page_start: 135
