  title: JBOS-AS-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to generate log records when successful/unsuccessful logon attempts occur. GROUP
    ID: V-213553 RULE ID: SV-213553r961824'
  rationale: Logging the access to the application server allows the system administrators to monitor user accounts. By logging
    successful/unsuccessful logons, the system administrator can determine if an account is compromised (e.g., frequent logons)
    or is in the process of being compromised (e.g., frequent failed logons) and can take actions to thwart the attack. Logging
    successful logons can also be used to determine accounts that are no longer in use.
