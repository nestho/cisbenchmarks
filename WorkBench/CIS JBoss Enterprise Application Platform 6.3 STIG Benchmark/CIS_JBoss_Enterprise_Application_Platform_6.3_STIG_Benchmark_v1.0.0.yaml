- id: '1.63'
  title: JBOS-AS-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to generate log records that show starting and ending times for access to the application
    server management interface. GROUP ID: V-213555 RULE ID: SV-213555r961830'
  rationale: Determining when a user has accessed the management interface is important to determine the timeline of events
    when a security incident occurs. Generating these events, especially if the management interface is accessed via a stateless
    protocol like HTTP, the log events will be generated when the user performs a logon (start) and when the user performs
    a logoff (end). Without these events, the user and later investigators cannot determine the sequence of events and therefore
    cannot determine what may have happened and by whom it may have been done. The generation of start and end times within
    log events allows the user to perform their due diligence in the event of a security breach.
  impact: ''
  references: []
  page_start: 133
