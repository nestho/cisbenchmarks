    Connect to the server and authenticate.

    Obtain the list of management interfaces by running the command:

    "ls /core-service=management/management-interface"

    Identify the security realm used by each management interface configuration by running

    the command:

    "ls /core-service=management/management-interface=<MANAGEMENT-INTERFACENAME>"

    Determine if the security realm assigned to the management interface uses LDAP for

    authentication by running the command:

    "ls /core-service=management/securityrealm=<SECURITY_REALM_NAME>/authentication"

    If the security realm assigned to the management interface does not utilize LDAP for

    authentication, this is a finding.'
  remediation: 'Follow steps in section 11.8 - Management Interface Security in the

    JBoss_Enterprise_Application_Platform-6.3-Administration_and_Configuration_Guideen-US document.

    1. Create an outbound connection to the LDAP server.

    2. Create an LDAP-enabled security realm.

    3. Reference the new security domain in the Management Interface.'
