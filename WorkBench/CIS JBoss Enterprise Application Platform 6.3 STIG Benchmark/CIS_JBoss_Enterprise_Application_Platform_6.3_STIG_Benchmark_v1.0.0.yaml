  title: JBOS-AS-000125
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to record the IP address and port information used by management interface network
    traffic. GROUP ID: V-213510 RULE ID: SV-213510r960900'
  rationale: Application server logging capability is critical for accurate forensic analysis. Without sufficient and accurate
    information, a correct replay of the events cannot be determined. Ascertaining the correct source, e.g., source IP, of
    the events is important during forensic analysis. Correctly determining the source will add information to the overall
    reconstruction of the loggable event. By determining the source of the event correctly, analysis of the enterprise can
    be undertaken to determine if the event compromised other assets within the enterprise. Without sufficient information
    establishing the source of the logged event, investigation into the cause of event is severely hindered. Log record content
    that may be necessary to satisfy the requirement of this control includes, but is not limited to, time stamps, source
