- id: '1.38'
  title: JBOS-AS-000295
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss Password Vault must be used for storing passwords or other sensitive configuration information.
    GROUP ID: V-213530 RULE ID: SV-213530r981682'
  rationale: JBoss EAP 6 has a Password Vault to encrypt sensitive strings, store them in an encrypted keystore, and decrypt
    them for applications and verification systems. Plaintext configuration files, such as XML deployment descriptors, need
    to specify passwords and other sensitive information. Use the JBoss EAP Password Vault to securely store sensitive strings
    in plain-text files.
