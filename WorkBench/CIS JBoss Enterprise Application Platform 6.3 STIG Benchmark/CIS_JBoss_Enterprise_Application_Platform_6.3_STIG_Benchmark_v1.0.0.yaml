    Review the cipher suites. The following suites are acceptable as per NIST 800-52r1

    section 3.3.1 - Cipher Suites. Refer to the NIST document for a complete list of

    acceptable cipher suites. The source NIST document and approved encryption

    algorithms/cipher suites are subject to change and should be referenced.

    AES_128_CBC

    AES_256_CBC

    AES_128_GCM

    AES_128_CCM

    AES_256_CCM

    If the cipher suites utilized by the TLS server are not approved by NIST as per 80052r1, this is a finding.'
  remediation: 'Reference section 4.6 of the JBoss EAP 6.3 Security Guide located on the Red Hat

    vendor''s website for step-by-step instructions on establishing SSL encryption on JBoss.

    The overall steps include:

    1. Add an HTTPS connector.

    2. Configure the SSL encryption certificate and keys.

    3. Set the Cipher to an approved algorithm.'
