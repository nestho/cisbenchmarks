- id: '1.19'
  title: JBOS-AS-000135
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss ROOT logger must be configured to utilize the appropriate logging level. GROUP ID: V-213512 RULE ID:
    SV-213512r960906'
  rationale: 'Information system logging capability is critical for accurate forensic analysis. Log record content that may
    be necessary to satisfy the requirement of this control includes: time stamps, source and destination addresses, user/process
    identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules
    invoked. See Chapter 14, Section 14.1.9, Table 14.4 of the Red Hat JBoss EAP Administration and Configuration Guide version
    6.3 for specific details on log levels and log level values. The JBOSS application server ROOT logger captures all messages
    not captured by a log category and sends them to a log handler (FILE, CONSOLE, SYSLOG, ETC.). By default, the ROOT logger
    level is set to INFO, which is a value of 800. This will capture most events adequately. Any level numerically higher
    than INFO (> 800) records less data and may result in an insufficient amount of information being logged by the ROOT logger.
    This can result in failed forensic investigations. The ROOT logger level must be INFO level or lower to provide adequate
    log information.'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

