- id: '1.66'
  title: JBOS-AS-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must be configured to use DoD- or CNSS-approved PKI Class 3 or Class 4 certificates. GROUP
    ID: V-213558 RULE ID: SV-213558r961857'
  rationale: Class 3 PKI certificates are used for servers and software signing rather than for identifying individuals. Class
    4 certificates are used for business-to-business transactions. Utilizing unapproved certificates not issued or approved
    by DoD or CNS creates an integrity risk. The application server must utilize approved DoD or CNS Class 3 or Class 4 certificates
    for software signing and business-to-business transactions.
  impact: ''
  references: []
  page_start: 139
  audit_raw: 'Interview the administrator to determine if JBoss is using certificates for PKI. If JBoss is

    not performing any PKI functions, this finding is NA.

    The CA certs are usually stored in a file called cacerts located in the directory

    $JAVA_HOME/lib/security. If the file is not in this location, use a search command to

    locate the file, or ask the administrator where the certificate store is located.

    Open a dos shell or terminal window and change to the location of the certificate store.

    To view the certificates within the certificate store, run the command (in this example,

    the keystore file is cacerts.): keytool -list -v -keystore ./cacerts

    Locate the "OU" field for each certificate within the keystore. The field should contain

    either "DoD" or "CNSS" as the Organizational Unit (OU).

    If the OU does not show that the certificates are DoD or CNSS supplied, this is a

    finding.'
  remediation: 'Configure the application server to use DoD- or CNSS-approved Class 3 or Class 4 PKI

    certificates.'
  checks:
  - type: sql
    command: show that the certificates are DoD or CNSS supplied, this is a
    severity: medium
    info: 'Interview the administrator to determine if JBoss is using certificates for PKI. If JBoss is

      not performing any PKI functions, this finding is NA.

