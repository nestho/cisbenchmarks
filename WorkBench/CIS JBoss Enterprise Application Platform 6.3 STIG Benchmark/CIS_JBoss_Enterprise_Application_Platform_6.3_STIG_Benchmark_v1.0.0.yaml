    severity: medium
- id: '1.10'
  title: JBOS-AS-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must generate log records for access and authentication events to the management interface.
    GROUP ID: V-213503 RULE ID: SV-213503r1028283'
  rationale: Log records can be generated from various components within the JBoss application server. The minimum list of
    logged events should be those pertaining to access and authentication events to the management interface as well as system
    startup and shutdown events. By default, JBoss does not log management interface access but does provide a default file
    handler. This handler needs to be enabled. Configuring this setting meets several STIG auditing requirements.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script to start the Command Line Interface (CLI).

    Connect to the server and authenticate.

    Run the command:

    For a Managed Domain configuration:

    "ls host=master/server=<SERVERNAME>/coreservice=management/access=audit/logger=audit-log:writeattribute(name=enabled,value=true)"

    For a Standalone configuration:

    "ls /core-service=management/access=audit/logger=audit-log:writeattribute(name=enabled,value=true)"

    If "enabled" = false, this is a finding.'
  remediation: 'Launch the jboss-cli management interface.

    Connect to the server by typing "connect", authenticate as a user in the Superuser role,

    and run the following command:

    For a managed domain configuration:

    "host=master/server=<SERVERNAME>/coreservice=management/access=audit/logger=audit-log:writeattribute(name=enabled,value=true)"

    For a standalone configuration:

    "/core-service=management/access=audit/logger=audit-log:writeattribute(name=enabled,value=true)"'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script to start the Command Line Interface (CLI).

      Connect to the server and authenticate.

      Run the command:

      For a Managed Domain configuration:

      "ls host=master/server=<SERVERNAME>/coreservice=management/access=audit/logger=audit-log:writeattribute(name=enabled,value=true)"

      For a Standalone configuration:

