- id: '1.53'
  title: JBOS-AS-000625
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to use DoD PKI-established certificate authorities for verification of the establishment
    of protected sessions. GROUP ID: V-213545 RULE ID: SV-213545r961596'
  rationale: Untrusted Certificate Authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DoD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DoDapproved CA, trust of this CA has not been established. The DoD will only accept PKI certificates
    obtained from a DoD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure
    sessions includes, for example, the use of SSL/TLS certificates. The application server must only allow the use of DoD
    PKI-established certificate authorities for verification.
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'Locate the cacerts file for the JVM. This can be done using the appropriate find

    command for the OS and change to the directory where the cacerts file is located.

    To view the certificates stored within this file, execute the java command "keytool -list -v

    -keystore ./cacerts".

    Verify that the Certificate Authority (CA) for each certificate is DoD-approved.

    If any certificates have a CA that are not DoD-approved, this is a finding.'
  remediation: 'Locate the cacerts file for the JVM. This can be done using the appropriate find

    command for the OS and change to the directory where the cacerts file is located.

    Remove the certificates that have a CA that is non-DoD approved, and import DoD CAapproved certificates.'
  checks:
  - type: manual_review
    info: 'Locate the cacerts file for the JVM. This can be done using the appropriate find

      command for the OS and change to the directory where the cacerts file is located.

      To view the certificates stored within this file, execute the java command "keytool -list -v

      -keystore ./cacerts".

      Verify that the Certificate Authority (CA) for each certificate is DoD-approved.

