      To obtain the list of security realms run the command:

      "ls /core-service=management/security-realm="

      Review each security realm using the command:

      "ls /core-service=management/securityrealm=<SECURITY_REALM_NAME>/authentication"

      If this command does not return a security'
    severity: medium
- id: '1.34'
  title: JBOS-AS-000265
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss Server must be configured to use certificates to authenticate admins. GROUP ID: V-213527 RULE ID:
    SV-213527r960972'
  rationale: 'Multifactor authentication creates a layered defense and makes it more difficult for an unauthorized person
    to access the application server. If one factor is compromised or broken, the attacker still has at least one more barrier
    to breach before successfully breaking into the target. Unlike a simple username/password scenario where the attacker
    could gain access by knowing both the username and password without the user knowing his account was compromised, multifactor
    authentication adds the requirement that the attacker must have something from the user, such as a token, or to biometrically
    be the user. Multifactor authentication is defined as: using two or more factors to achieve authentication. Factors include:
    (i) something a user knows (e.g., password/PIN); (ii) something a user has (e.g., cryptographic identification device,
    token); or (iii) something a user is (e.g., biometric). A CAC or PKI Hardware Token meets this definition. A privileged
    account is defined as an information system account with authorizations of a privileged user. These accounts would be
    capable of accessing the web management interface. When accessing the application server via a network connection, administrative
    access to the application server must be PKI Hardware Token enabled or a DoD-approved soft certificate.'
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Follow these steps:

    1. Identify the security realm assigned to the management interfaces by using the

    following command:

    For standalone systems:

    "ls /core-service=management/management-interface=<INTERFACE-NAME>"

    For managed domain systems:

    "ls /host=master/core-service=management/management-interface=<INTERFACENAME>"

    Document the name of the security-realm associated with each management interface.

    2. Review the security realm using the command:

    For standalone systems:

    "ls /core-service=management/securityrealm=<SECURITY_REALM_NAME>/authentication"

    For managed domains:

    "ls /host=master/core-service=management/securityrealm=<SECURITY_REALM_NAME>/authentication"

    If the command in step 2 does not return a security realm that uses certificates for

    authentication, this is a finding.'
  remediation: 'Configure the application server to authenticate privileged users via

    multifactor/certificate-based authentication mechanisms when using network access to

    the management interface.'
  checks:
  - type: manual_review
    info: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

      Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

      Run the jboss-cli script.

      Connect to the server and authenticate.

      Follow these steps:

      1. Identify the security realm assigned to the management interfaces by using the

      following command:

      For standalone systems:

      "ls /core-service=management/management-interface=<INTERFACE-NAME>"

      For managed domain systems:

      "ls /host=master/core-service'
    severity: medium
- id: '1.35'
  title: JBOS-AS-000275
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must be configured to use individual accounts and not generic or shared accounts. GROUP ID:
    V-213528 RULE ID: SV-213528r981680'
  rationale: To assure individual accountability and prevent unauthorized access, application server users (and any processes
    acting on behalf of application server users) must be individually identified and authenticated. A group authenticator
    is a generic account used by multiple individuals. Use of a group authenticator alone does not uniquely identify individual
    users. Application servers must ensure that individual users are authenticated prior to authenticating via role or group
    authentication. This is to ensure that there is nonrepudiation for actions taken.
  impact: ''
  references: []
  page_start: 78
  audit_raw: 'If the application server management interface is configured to use LDAP authentication

    this requirement is NA.

    Determine the mode in which the JBoss server is operating by authenticating to the OS,

    changing to the <JBOSS_HOME>/bin/ folder and executing the jboss-cli script.

    Connect to the server and authenticate.

    Run the command: "ls" and examine the "launch-type" setting.

    User account information is stored in the following files for a JBoss server configured in

    standalone mode. The command line flags passed to the "standalone" startup script

    determine the standalone operating mode:

    <JBOSS_HOME>/standalone/configuration/standalone.xml

    <JBOSS_HOME>/standalone/configuration/standalone-full.xml

    <JBOSS_HOME>/standalone/configuration/standalone.-full-ha.xml

