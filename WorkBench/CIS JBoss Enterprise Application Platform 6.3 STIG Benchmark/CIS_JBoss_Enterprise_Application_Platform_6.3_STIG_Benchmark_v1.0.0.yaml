  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'JBoss must be configured to generate log records for privileged activities. GROUP ID: V-213554 RULE ID: SV-213554r961827'
  rationale: Without generating log records that are specific to the security and mission needs of the organization, it would
    be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Privileged activities would occur through the management interface. This interface can be web-based or can be
    command line utilities. Whichever method is utilized by the application server, these activities must be logged.
  impact: ''
