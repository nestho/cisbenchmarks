- id: '1.47'
  title: JBOS-AS-000475
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The application server must prevent non-privileged users from executing privileged functions to include disabling,
    circumventing, or altering implemented security safeguards/countermeasures. GROUP ID: V-213539 RULE ID: SV-213539r961353'
  rationale: Preventing non-privileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. Restricting non-privileged users also prevents
    an attacker who has gained access to a non-privileged account, from elevating privileges, creating accounts, and performing
    system checks and maintenance.
  impact: ''
  references: []
