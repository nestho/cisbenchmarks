- id: '1.49'
  title: JBOS-AS-000505
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The JBoss server must be configured to utilize syslog logging. GROUP ID: V-213541 RULE ID: SV-213541r961395'
  rationale: Information system logging capability is critical for accurate forensic analysis. Log record content that may
    be necessary to satisfy the requirement of this control includes, but is not limited to, time stamps, source and destination
    IP addresses, user/process identifiers, event descriptions, application-specific events, success/fail indications, filenames
    involved, access control or flow control rules invoked. Off-loading is a common process in information systems with limited
    log storage capacity. Centralized management of log records provides for efficiency in maintenance and management of records,
    as well as the backup and archiving of those records. Application servers and their related components are required to
    off-load log records onto a different system or media than the system being logged.
  impact: ''
  references: []
  page_start: 107
  audit_raw: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the <JBOSS_HOME>/bin/ folder.

    Run the jboss-cli script.

    Connect to the server and authenticate.

    Run the command:

    Standalone configuration:

    "ls /subsystem=logging/syslog-handler="

    Domain configuration:

    "ls /profile=<specify>/subsystem=logging/syslog-handler="

    Where = the selected application server profile of; default,full, full-ha or ha.

    If no values are returned, this is a finding.'
  remediation: 'Log on to the OS of the JBoss server with OS permissions that allow access to JBoss.

    Using the relevant OS commands and syntax, cd to the “<JBOSS_HOME>/bin/” folder.

    Run the “jboss-cli” script.

    Connect to the server and authenticate.

    To add a syslog handler:

    Standalone configuration: "/subsystem=logging/sysloghandler=<HANDLER_NAME:add>"

    Domain configuration: "/profile=default/subsystem=logging/sysloghandler=<HANDLER_NAME:add>"

    To configure a syslog handler:

    Standalone configuration. "/subsystem=logging/sysloghandler=<HANDLER_NAME:write-attribute(name=ATTRIBUTE_NAME,

    value=ATTRIBUTE_VALUE)" Domain configuration.

    "/profile=default/subsystem=logging/syslog-handler=<HANDLER_NAME:writeattribute(name=ATTRIBUTE_NAME, value=ATTRIBUTE_VALUE)"

    *reference the RedHat web-site for the list of syslog handler attributes and

    corresponding values. Sample attributes include but are not limited to: port, enabled,

    app-name, level, server-address, hostname, etcetera.'
  checks:
