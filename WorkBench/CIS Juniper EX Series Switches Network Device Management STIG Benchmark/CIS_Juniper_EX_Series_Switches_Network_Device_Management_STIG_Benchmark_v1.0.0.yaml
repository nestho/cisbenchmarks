    set firewall family inet6 filter <filter name-1> term 1 from destinationaddress <device OOBM or loopback address>

    set firewall family inet6 filter <filter name-1> term 1 from source-prefixlist <management address list name-1>

    set firewall family inet6 filter <filter name-1> term 1 from next-header tcp

    set firewall family inet6 filter <filter name-1> term 1 from destination-port

    22

    set firewall family inet6 filter <filter name-1> term 1 from tcp-initial

    set firewall family inet6 filter <filter name-1> term 1 then policer policer32k

    set firewall family inet6 filter <filter name-1> term 1 then syslog

    set firewall family inet6 filter <filter name-1> term 1 then accept

    set firewall family inet6 filter <filter name-1> term 2 from destinationaddress <device OOBM or loopback address>

    set firewall family inet6 filter <filter name-1> term 2 from source-prefixlist <management address list name-1>

    set firewall family inet6 filter <filter name-1> term 2 from next-header tcp

    set firewall family inet6 filter <filter name-1> term 2 from destination-port

    22

    set firewall family inet6 filter <filter name-1> term 2 then syslog

    set firewall family inet6 filter <filter name-1> term 2 then accept

    set firewall family inet6 filter <filter name-1> term default then syslog

    set firewall family inet6 filter <filter name-1> term default then discard

    Example interface configuration:

    set interfaces <OOBM interface> unit 0 family inet filter input <filter name>

    set interfaces <OOBM interface> unit 0 family inet address <IPv4

    address>/<mask>

    set interfaces <OOBM interface> unit 0 family inet6 filter input <filter

    name-1>

    set interfaces <OOBM interface> unit 0 family inet6 address <IPv6

    address>/<prefix>'
