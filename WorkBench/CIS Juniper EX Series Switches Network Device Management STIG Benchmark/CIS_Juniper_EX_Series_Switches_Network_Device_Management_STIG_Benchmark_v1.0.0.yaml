- id: '1.26'
  title: JUEX-NM-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to only store cryptographic representations of passwords. GROUP ID:
    V-253910 RULE ID: SV-253910r1018768'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Network devices must
    enforce cryptographic representations of passwords when storing passwords in databases, configuration files, and log files.
    Passwords must be protected at all times; using a strong one-way hashing encryption algorithm with a salt is the standard
    method for providing a means to validate a password without having to store the actual password. Performance and time
    required to access are factors that must be considered, and the one-way hash is the most feasible means of securing the
    password and providing an acceptable measure of password security. If passwords are stored in clear text, they can be
    plainly read and easily compromised. In many instances, verifying the user knows a password is performed using a password
    verifier. In its simplest form, a password verifier is a computational function that is capable of creating a hash of
    a password and determining if the value provided by the user matches the stored hash.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Review the network device’s files using a text editor or a database tool that allows

    viewing data stored in database tables. Determine if password strings are

    readable/discernable.

    Determine if the network device, and any associated authentication servers, enforce

    only storing cryptographic representations of passwords. Verify that databases,

    configuration files, and log files have encrypted representations of all passwords, and

    that no password strings are readable/discernable. Potential locations include the local

    file system where configurations and events are stored, or in a network device related

    database table. Also identify if the network device uses the MD5 hashing algorithm to

    create password hashes.

    By default, Junos uses SHA-512 as the password hashing algorithm to save only

    hashed representations of passwords. Verify the hashing algorithm at [edit system login

    password] format.

    [edit system login password]

    :

    format sha512;

    If the network device, or any associated authentication servers, stores unencrypted

    (clear text) representations of passwords, this is a finding.

    If the network device uses MD5 hashing algorithm to create password hashes, this is a

    finding.'
  remediation: 'Configure the network device, and any associated authentication servers, to store all

    passwords using cryptographic representations.

    set system login password format <sha-256|sha-512>

    Note: Although Junos supports the SHA-1 hashing algorithm, it is included only for

    backwards compatibility when restoring a previous configuration from an older version.

    Configure all associated databases, configuration files, and log files to use only

    encrypted representations of passwords, and that no password strings are

    readable/discernable.

    Potential locations include the local file system where configurations and events are

    stored, or in a network device-related database table.'
  checks:
  - type: manual_review
    info: 'Review the network device’s files using a text editor or a database tool that allows

      viewing data stored in database tables. Determine if password strings are

      readable/discernable.

      Determine if the network device, and any associated authentication servers, enforce

      only storing cryptographic representations of passwords. Verify that databases,

      configuration files, and log files have encrypted representations of all passwords, and

      that no password strings are readable/discernable. Potential locati'
    severity: medium
- id: '1.27'
  title: JUEX-NM-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to use FIPS 140-2/140-3 validated algorithms for authentication to
    a cryptographic module. GROUP ID: V-253911 RULE ID: SV-253911r1082959'
  rationale: Unapproved mechanisms used for authentication to the cryptographic module are not validated and therefore, cannot
    be relied upon to provide confidentiality or integrity, and DOD data may be compromised. Network devices utilizing encryption
    are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2/140-3 is the current
    standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets DOD requirements.
    However, authentication algorithms must configure security processes to use only FIPS-validated and NIST-recommended authentication
    algorithms.
  impact: ''
  references: []
  page_start: 77
  audit_raw: "Verify the password format, and that SSH uses FIPS validated algorithms and random\nnumber generator (RNG) as\
    \ shown in the following example configuration.\nuser@host> show configuration system\nlogin {\n password {\n :\n format\
    \ <sha-256|sha-512>;\n }\n}\nservices {\n ssh {\n :\n ciphers [ aes256-ctr aes256-cbc];\n macs [ hmac-sha2-512 hmac-sha2-256\
    \ ];\n key-exchange [ ecdh-sha2-nistp521 ecdh-sha2-nistp384 ecdh-sha2nistp256 ];\n :\n }\n}\nrng {\n hmac-drbg;\n}\nIf\
    \ the network device is not configured to use FIPS 140-2/140-3 validated authentication\nalgorithms, this is a finding."
  remediation: 'Configure the password format, SSH algorithms, and the RNG to use only FIPS

    validated algorithms.

    1. Enter configuration mode.

    2. Configure the password format.

    3. Configure the SSH algorithms.

    4. Configure the RNG.

    5. Commit the configuration.

    user@host> configure

    user@host# set system login password format <sha-256|sha-512>

    user@host# set system services ssh ciphers aes256-ctr

    user@host# set system services ssh ciphers aes256-cbc

    user@host# set system services ssh macs hmac-sha2-512

    user@host# set system services ssh macs hmac-sha2-256

    user@host# set system services ssh key-exchange ecdh-sha2-nistp521

    user@host# set system services ssh key-exchange ecdh-sha2-nistp384

    user@host# set system services ssh key-exchange ecdh-sha2-nistp256

    user@host# set system rng hmac-drbg

    user@host# commit'
  checks:
  - type: sql
    command: show configuration system
    severity: medium
    info: "Verify the password format, and that SSH uses FIPS validated algorithms and random\nnumber generator (RNG) as shown\
      \ in the following example configuration.\nuser@host> show configuration system\nlogin {\n password {\n :\n format <sha-256|sha-512>;\n\
      \ }\n}\nservices {\n ssh {\n :\n ciphers [ aes256-ctr aes256-cbc];\n macs [ hmac-sha2-512 hmac-sha2-256 ];\n key-exchange\
      \ [ ecdh-sha2-nistp521 ecdh-sha2-nistp384 ecdh"
- id: '1.28'
  title: JUEX-NM-000360
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to end all network connections associated with a device management
    session at the end of the session, or the session must be terminated after five minutes of inactivity except to fulfill
    mission requirements. GROUP ID: V-253913 RULE ID: SV-253913r1082962'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 80
  audit_raw: "Determine if the network device terminates the connection associated with a device\nmanagement session at the\
    \ end of the session or after five minutes of inactivity. This\nrequirement may be verified by demonstration or configuration\
    \ review.\nJunos permits the administrator to log out at the end of the session, which terminates\nthe session and the\
    \ network connection. Junos forcibly terminates the session and\nnetwork connection upon exceeding the inactivity timeout\
    \ threshold. Inactivity timeouts\nare assigned to login classes and apply to every administrative access method; there\
    \ is\nno provision to set inactivity timeout differently for local (console) and network (remote)\ndevice management sessions.\
    \ Verify the idle-timeout for the root user, and each login\nclass, has an appropriate idle-timeout value.\nuser@host>\
    \ show configuration system login\n...\nidle-timeout 5;\nclass <name> {\n idle-timeout 5;\n...\n}\nNote: Inactivity timeout\
    \ (idle-timeout) must be assigned to every login class.\nIf the network device does not terminate the connection associated\
    \ with a device\nmanagement session at the end of the session or after five minutes of inactivity, this is a\nfinding."
  remediation: 'Configure the network device to terminate the connection associated with a device

    management session at the end of the session or after five minutes of inactivity.

    There is no configuration required to support explicit logout ("quit" at the end of the

    session).

    1. Enter configuration mode.

    2. Configure inactivity timeout for root.

    3. Configure inactivity timeout for all login classes.

    4. Commit the configuration.

    user@host> configure

    user@host# set system login idle-timeout 5

    user@host# set system login class <class name> idle-timeout 5

    user@host# commit'
  checks:
  - type: sql
    command: show configuration system login
    severity: medium
    info: 'Determine if the network device terminates the connection associated with a device

      management session at the end of the session or after five minutes of inactivity. This

      requirement may be verified by demonstration or configuration review.

      Junos permits the administrator to log out at the end of the session, which terminates

      the session and the network connection. Junos forcibly terminates the ses'
- id: '1.29'
  title: JUEX-NM-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper device must be configured to only allow authorized administrators to view or change the device
    configuration, system files, and other files stored either in the device or on removable media (such as a flash drive).
    GROUP ID: V-253914 RULE ID: SV-253914r961128'
  rationale: This requirement is intended to address the confidentiality and integrity of system information at rest (e.g.,
    network device rule sets) when it is located on a storage device within the network device or as a component of the network
    device. This protection is required to prevent unauthorized alteration, corruption, or disclosure of information when
    not stored directly on the network device. Files on the network device or on removable media used by the device must have
    their permissions set to allow read or write access to those accounts that are specifically authorized to access or change
    them. Note that different administrative accounts or roles will have varying levels of access. File permissions must be
    set so that only authorized administrators can read or change their contents. Whenever files are written to removable
    media and the media removed from the device, the media must be handled appropriately for the classification and sensitivity
    of the data stored on the device.
  impact: ''
  references: []
  page_start: 82
  audit_raw: "The Junos operating system maintains file permissions for all files on the device and\ncannot be configured\
    \ otherwise. Because Juniper digitally signs and used cryptographic\nhashes, modified system files (specifically binary\
    \ files) will invalidate the signature/hash\nand will not be executed.\nThe Junos OS enforces the permissions assigned\
    \ to each user to restrict access to\nsystem, configuration, and audit files via login classes. Every account must be\
    \ assigned\na login class by an authorized administrator.\nVerify each account is assigned a login class with appropriate\
    \ permissions based on\norganizational requirements. Login classes support optional allow- and deny- directives\nas shown\
    \ in the examples. Organizational requirements may require different allow- and\ndeny- directives or no directives at\
    \ all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security\
    \ log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade\
    \ re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security\
    \ (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security\
    \ log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nVerify \"no-world-readable\" for archived\
    \ log files.\n[edit system syslog]\narchive size <file size> files <number of files> no-world-readable;\nIf any files\
    \ allow read or write access by accounts not specifically authorized access or\nby nonprivileged accounts, this is a finding."
  remediation: 'Configure the device to enforce RBAC permissions so only authorized administrators

    can read or change file contents.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system syslog archive size <file size> files <number of files> no-worldreadable'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'The Junos operating system maintains file permissions for all files on the device and

      cannot be configured otherwise. Because Juniper digitally signs and used cryptographic

      hashes, modified system files (specifically binary files) will invalidate the signature/hash

      and will not be executed.

      The Junos OS enforces the permissions assigned to each user to restrict access to

      system, configuration, and'
- id: '1.30'
  title: JUEX-NM-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce organization-defined role-based access control policies
    over defined subjects and objects. GROUP ID: V-253916 RULE ID: SV-253916r987662'
  rationale: Organizations can create specific roles based on job functions and the authorizations (i.e., privileges) to perform
    needed operations on organizational information systems associated with the organization-defined roles. When administrators
    are assigned to the organizational roles, they inherit the authorizations or privileges defined for those roles. RBAC
    simplifies privilege administration for organizations because privileges are not assigned directly to every administrator
    (which can be a significant number of individuals for mid- to large-size organizations) but are instead acquired through
    role assignments. RBAC can be implemented either as a mandatory or discretionary form of access control. The RBAC policies
    and the subjects and objects are defined uniquely for each network device, so they cannot be specified in the requirement.
  impact: ''
  references: []
  page_start: 85
  audit_raw: "Determine if the network device enforces role-based access control policy over defined\nsubjects and objects.\
    \ This requirement may be verified by demonstration, configuration\nreview, or validated test results. This requirement\
    \ may be met through use of a properly\nconfigured authentication server if the device is configured to use the authentication\n\
    server.\nJuniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in Junos\
    \ are either \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts have\
    \ an authentication stanza\nand support both external and local authentication. Template accounts do not have an\nauthentication\
    \ stanza and only support external authentication. Every account (local and\ntemplate) must be assigned a login class\
    \ by an authorized administrator.\nVerify each account is assigned a login class with appropriate permissions based upon\n\
    organizational requirements. Login classes support optional allow- and deny- directives\nas shown in the examples. Organizational\
    \ requirements may require different allow- and\ndeny- directives or no directives at all.\n[edit system login]\nclass\
    \ <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security log)|^(clear|show) security alarms\n\
    alarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade re|system decrypt)|^rollback\";\n\
    \ deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security (ike|ipsec) (policy|proposal)\"\
    \ \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security log\" \"system fips selftest\
    \ after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\" \"system\
    \ services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf role-based access control\
    \ policy is not enforced over defined subjects and objects,\nthis is a finding."
  remediation: 'Configure the network device or its associated authentication server to enforce rolebased access control policy
    over defined subjects and objects.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'Determine if the network device enforces role-based access control policy over defined

      subjects and objects. This requirement may be verified by demonstration, configuration

      review, or validated test results. This requirement may be met through use of a properly

      configured authentication server if the device is configured to use the authentication

      server.

      Juniper switches use role-based access con'
- id: '1.31'
  title: JUEX-NM-000410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements. GROUP ID: V-253918 RULE ID: SV-253918r961392'
  rationale: To ensure network devices have a sufficient storage capacity in which to write the audit logs, they need to be
    able to allocate audit record storage capacity. The task of allocating audit record storage capacity is usually performed
    during initial device setup if it is modifiable. The value for the organization-defined audit record storage requirement
    will depend on the amount of storage available on the network device, the anticipated volume of logs, the frequency of
    transfer from the network device to centralized log servers, and other factors.
  impact: ''
  references: []
  page_start: 88
  audit_raw: "Determine if the network device allocates audit record storage capacity in accordance\nwith organization-defined\
    \ audit record storage requirements.\nThis requirement may be verified by configuration review or vendor-provided\ninformation.\
    \ This requirement may be met through use of a properly configured syslog\nserver if the device is configured to use the\
    \ syslog server.\nJunos does not permit configuring audit logging storage space. However, the majority of\ndisk space\
    \ is reserved for local audit log storage and file are rotated using a first-in-firstout (FIFO) function.\nVerify external\
    \ syslog servers are configured.\n[edit system syslog]\nhost <address 1> {\n any info;\n}\nhost <address 2> {\n any info;\n\
    }\nIf audit record store capacity is not allocated in accordance with organization-defined\naudit record storage requirements,\
    \ or the device is not configured to use external syslog\nserver(s), this is a finding."
  remediation: 'Configure the network device to allocate audit record storage capacity in accordance

