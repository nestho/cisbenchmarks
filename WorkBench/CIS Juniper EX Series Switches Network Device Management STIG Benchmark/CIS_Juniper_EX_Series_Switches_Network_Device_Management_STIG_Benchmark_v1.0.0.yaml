- id: '1.46'
  title: JUEX-NM-000600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to offload audit records onto a different system or media than the
    system being audited. GROUP ID: V-253937 RULE ID: SV-253937r961860'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Offloading
    is a common process in information systems with limited audit storage capacity. Archiving is not required unless space
    is limited in the audit server.
  impact: ''
  references: []
  page_start: 128
  audit_raw: "Mark as not a finding if the site has a solution in place to prevent the device from\nrunning out of audit storage.\n\
    Verify the device is configured to send system events to external syslog. If the\norganization has a centralized repository\
    \ (or repositories) for secure transfer of audit log\nfiles, verify each log file is configured to transfer files to the\
    \ appropriate repository. Each\nlog file must be configured separately.\n[edit system syslog]\nfile <file name> {\n any\
    \ info;\n archive size <65536..1073741824 bytes> files <1..1000> transfer-interval\n<5..2880 minutes> start-time \"<yyyy-mm-dd.hh:mm>\"\
    \ archive-sites {\n\"URL\" password \"hashed PSK\" } ## SECRET-DATA\n}\nNote: The URL format is: <scp|sftp>://@/. The\
    \ trailing slash is omitted because Junos\nautomatically adds that when it appends the filename.\nhost <external syslog\
    \ address> {\n any info;\n}\nNote: If using secure file transfer to offload log files, the Juniper device will immediately\n\
    attempt to connect with the configured protocol, address, and credentials. If successful,\nJunos will prompt to accept\
    \ an untrusted public key. If the administrator accepts that\nkey, Junos adds it to [edit security ssh-known-hosts]. Alternately,\
    \ configure the trusted\npublic key at [edit security ssh-known-hosts] before configuring automatic file offload.\nIf\
    \ the device does not offload audit records onto a different system or media, this is a\nfinding."
  remediation: 'Archiving is not required unless space is limited in the audit server. Configure the

    network device to offload audit records onto a different system or media than the

    system being audited.

    set file <file name> any info

    set system syslog file <file name> any info

    set system syslog file <file name> archive size <65536..1073741824 bytes>

    set system syslog file <file name> archive files <1..1000>

    set system syslog file <file name> archive transfer-interval <5..2880

    minutes>

    set system syslog file <file name> archive start-time "<yyyy-mm-dd.hh:mm>"

    set system syslog file <file name> archive archive-sites

    "<scp|sftp>://<username>@<repository address>/<path without trailing slash

    (/)>" password "<PSK>"

    set system syslog host <external syslog address> any info'
