- id: '1.55'
  title: JUEX-NM-000910
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must change credentials for account of last resort when administrators who know the
    credential leave the organization. GROUP ID: V-253946 RULE ID: SV-253946r1018771'
  rationale: A shared/group account credential is a shared form of authentication that allows multiple individuals to access
    the network device using a single account. If shared/group account credentials are not terminated when individuals leave
    the group, the user that left the group can still gain access even though they are no longer authorized. There may also
    be instances when specific user actions need to be performed on the network device without unique administrator identification
    or authentication. Examples of credentials include passwords and group membership certificates.
  impact: ''
  references: []
  page_start: 150
  audit_raw: 'Review the site''s SSP to verify the password for the account of last resort and the root

    account are changed when a system administrator with knowledge of the password

    leaves or no longer has a need to know/access.

    If the credentials for account of last resort are not changed when administrators who

    know the credential leave the organization, this is a finding.'
  remediation: 'Document this process in the SSP. Change the account of last resort to a new

    password when administrators who know the credential leave the organization

    Set the password for the account of last resort:

    set system login user authentication plain-text-password

    New password: <password - not echoed to the screen>

    Retype new password: <password verification - not echoed to the screen>'
  checks:
  - type: manual_review
    info: 'Review the site''s SSP to verify the password for the account of last resort and the root

      account are changed when a system administrator with knowledge of the password

      leaves or no longer has a need to know/access.

      If the credentials for account of last resort are not changed when administrators who

      know the credential leave the organization, this is a finding.'
    severity: medium
