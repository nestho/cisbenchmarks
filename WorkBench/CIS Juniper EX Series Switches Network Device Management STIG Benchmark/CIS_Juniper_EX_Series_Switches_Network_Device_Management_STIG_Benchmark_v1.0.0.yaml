- id: '1.7'
  title: JUEX-NM-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper device must be configured to produce audit log records containing sufficient information to establish
    what type of event occurred. GROUP ID: V-253889 RULE ID: SV-253889r960891'
  rationale: It is essential for security personnel to know what is being done, what was attempted, where it was done, when
    it was done, and by whom it was done to compile an accurate risk assessment. Associating event types with detected events
    in the application and audit logs provides a means of investigating an attack; recognizing resource utilization or capacity
    thresholds; or identifying an improperly configured network device. Without this capability, it would be difficult to
    establish, correlate, and investigate the events leading up to an outage or attack.
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Determine if the network device produces audit log records containing sufficient\ninformation to establish what\
    \ type of event occurred.\nJunos standard event log messages are configurable for time format, inclusion of\nlogging facility\
    \ and severity levels, and format. Setting \"structured-data\" automatically\nincludes \"explicit-priority\" and \"time-format\
