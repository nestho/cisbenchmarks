controls:
- id: '1.1'
  title: JUEX-NM-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to limit the number of concurrent management sessions to 10 or an
    organization-defined value. GROUP ID: V-253878 RULE ID: SV-253878r1028864'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent
    sessions for administrative accounts and does not address concurrent sessions by a single administrator via multiple administrative
    accounts. The maximum number of concurrent sessions must be defined based upon mission needs and the operational environment
    for each system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions. Juniper
    switches apply session limits per access method (e.g., web management, SSH), which means the limit is applicable to local,
    remote, and root account sessions. Unconfigured management access methods are disabled. For instance, if there is no [edit
    system services ssh] stanza, that service is unavailable and a connection-limit should not be configured because that
    will enable the service.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'If, based on operational needs, an organization defined number other than 1 is used,

    document the value in the SSP. View the SSH service configuration using the "show

    configuration system services ssh" command.

    SSH example.

    user@host> show configuration system services ssh

    connection-limit 1;

    rate-limit 1

    If the device does not limit the number of concurrent management sessions to 1 or an

    organization-defined number, this is a finding.'
  remediation: 'Enter the CLI configuration mode and enter the following commands to set the

    connection-limit to 1 or an organization defined number. If, based on operational needs,

    an organization defined number other than 1 is used, document the value in the SSP.

    SSH example limiting connections to 1:

    user@host> configure

    user@host# set system services ssh connection-limit 1

    user@host# commit'
  checks:
  - type: sql
    command: 'show

      configuration system services ssh" command.'
    severity: medium
    info: 'If, based on operational needs, an organization defined number other than 1 is used,

      document the value in the SSP. View the SSH service configuration using the "show

      configuration system services ssh" command.

      SSH example.

      user@host> show configuration system services ssh

      connection-limit 1;

      rate-limit 1

      If the device does not limit the number of concurrent management sessions to 1 or an

      organiza'
- id: '1.2'
  title: JUEX-NM-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to automatically audit account creation. GROUP ID: V-253879 RULE
    ID: SV-253879r960777'
  rationale: Upon gaining access to a network device, an attacker will often first attempt to create a persistent method of
    reestablishing access. One way to accomplish this is to create a new account. Notification of account creation helps to
    mitigate this risk. Auditing account creation provides the necessary reconciliation that account management procedures
    are being followed. Without this audit trail, personnel without the proper authorization may gain access to critical network
    nodes.
  impact: ''
  references: []
  page_start: 13
  audit_raw: "Review the network device configuration to determine if it automatically audits account\ncreation or is configured\
    \ to use an authentication server that would perform this\nfunction.\nVerify the system logs the facility \"any\", or\
    \ minimally \"change-log\" and \"interactivecommands\", and the logging level is appropriate. Generally, the \"all\" (debug)\
    \ logging\nlevel should be avoided because the number of logged messages is significant.\n[edit system syslog]\nhost <IPv4\
    \ or IPv6 syslog address> {\n any info;\n}\nfile <file name> {\n change-log info;\n interactive-commands info;\n}\nNote:\
    \ If minimally logging only configuration changes, there will be other files receiving\nthe events from the other logging\
    \ facilities (e.g., \"authorizations\" or \"firewall\").\nSyslog outputs in standard format unless the \"structured-data\"\
    \ directive is configured.\nVerify the \"structured-data\" command for all files and external syslog servers requiring\n\
    that format. For example:\n[edit system syslog]\nhost <IPv4 or IPv6 syslog address> {\n change-log info;\n interactive-commands\
    \ info;\n structured-data;\n}\nfile <file name> {\n any info;\n structured-data;\n}\nIf account creation is not automatically\
    \ audited, this is a finding."
  remediation: 'Configure the network device or its associated authentication server to automatically

    audit the creation of accounts.

    set system syslog host <IPv4 or IPv6 syslog address> change-log info

    set system syslog host <IPv4 or IPv6 syslog address> interactive-commands

    info

    -orset system syslog host <IPv4 or IPv6 syslog address> any info

    Also set the syslog file configuration as follows:

    set system syslog file <file name> change-log info

    set system syslog file <file name> interactive-commands info

    -orset system syslog file <file name> any info'
  checks:
  - type: manual_review
    info: "Review the network device configuration to determine if it automatically audits account\ncreation or is configured\
      \ to use an authentication server that would perform this\nfunction.\nVerify the system logs the facility \"any\", or\
      \ minimally \"change-log\" and \"interactivecommands\", and the logging level is appropriate. Generally, the \"all\"\
      \ (debug) logging\nlevel should be avoided because the number of logged messages is significant.\n[edit system syslog]\n\
      host <IPv4 or IPv6 syslog address> {\n any info;\n}\n"
    severity: medium
- id: '1.3'
  title: JUEX-NM-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to assign appropriate user roles or access levels to authenticated
    users. GROUP ID: V-253883 RULE ID: SV-253883r960792'
  rationale: Successful identification and authentication must not automatically give an entity full access to a network device
    or security domain. The lack of authorization-based access control could result in the immediate compromise and unauthorized
    access to sensitive information. All DoD systems must be properly configured to incorporate access control methods that
    do not rely solely on authentication for authorized access. Authorization is the process of determining whether an entity,
    once authenticated, is permitted to access a specific asset or set of resources. Information systems use access control
    policies and enforcement mechanisms to implement this requirement. Authorization procedures and controls must be implemented
    to ensure each authenticated entity also has a validated and current authorization. Some network devices are pre-configured
    with security groups. Other network devices enable operators to create custom security groups with custom permissions.
    For example, an ISSM may require read-only access to audit the network device. Operators may create an audit security
    group, define permissions and access levels for members of the group, and then assign the ISSM’s user persona to the audit
    security group. This is still considered privileged access, but the ISSM’s security group is more restrictive than the
    network administrator’s security group. Network devices that rely on AAA brokers for authentication and authorization
    services may need to identify the available security groups or access levels available on the network devices and convey
    that information to the AAA operator. Once the AAA broker identifies the user persona on the centralized directory service,
    the user’s security group memberships can be retrieved. The AAA operator may need to create a mapping that links target
    security groups from the directory service to the appropriate security groups or access levels on the network device.
    Once these mappings are configured, authorizations can happen dynamically, based on each user’s directory service group
    membership.
  impact: ''
  references: []
  page_start: 15
  audit_raw: "If the network device is configured to use a AAA service account, and the AAA broker is\nconfigured to assign\
    \ authorization levels based on centralized user account group\nmemberships on behalf of the network device, that will\
    \ satisfy this objective. Because\nthe responsibility for meeting this objective is transferred to the AAA broker, this\n\
    requirement is not applicable for the local network device. This requirement may be\nverified by demonstration or configuration\
    \ review.\nJuniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in\
    \ Junos are either \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts\
    \ have an authentication stanza\nand support both external and/or local authentication depending upon the authentication\n\
    order. Template accounts do not have an authentication stanza and only support\nexternal authentication. Every account\
    \ (local and template) must be assigned a login\nclass by an authorized administrator.\nVerify each account is assigned\
    \ a login class with appropriate permissions based upon\norganizational requirements. Login classes support optional allow-\
    \ and deny- directives\nas shown in the examples. Organizational requirements may require different allow- and\ndeny-\
    \ directives, or no directives at all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands\
    \ \"^clear (log|security log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system set-encryption-key|system\
    \ firmware\nupgrade re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security alarms potential-violation\
    \ idp\"\n\"security (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\"\
    \ \"security log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nVerify the network device\
    \ is configured to assign appropriate user roles or access levels\nto authenticated users. This requirement may be verified\
    \ by demonstration or\nconfiguration review. If the network device does not enforce the assigned privilege level\nfor\
    \ each administrator and authorizations for access to all commands relative to the\nprivilege level, this is a finding."
  remediation: 'Configure the network device to assign appropriate user roles or access levels to

    authenticated users, or configure the network device to leverage an AAA solution that

    will satisfy this objective.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'If the network device is configured to use a AAA service account, and the AAA broker is

      configured to assign authorization levels based on centralized user account group

      memberships on behalf of the network device, that will satisfy this objective. Because

      the responsibility for meeting this objective is transferred to the AAA broker, this

      requirement is not applicable for the local network device'
- id: '1.4'
  title: JUEX-NM-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce approved authorizations for controlling the flow of management
    information within the network device based on information flow control policies. GROUP ID: V-253884 RULE ID: SV-253884r997739'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 19
  audit_raw: "Review the network device configuration to determine if it enforces approved\nauthorizations for controlling\
    \ the flow of management information within the network\ndevice based on information flow control policies.\nVerify the\
    \ switch permits administrative access only from the authorized management\nnetwork(s). Verify filters and terms account\
    \ for all authorized management traffic.\nExample prefix-list defining the management networks. Prefix lists are not required\n\
    because IP addresses can be directly embedded into terms, but they define a set of IP\naddresses once that permits use\
    \ across multiple terms.\n[edit policy-options]\nprefix-list ipv4-management {\n <IPv4 MGT subnet/mask>;\n}\nprefix-list\
    \ ipv6-management {\n <IPv6 MGT subnet/prefix>;\n}\nExample firewall filter for SSH traffic:\n[edit firewall]\nfamily\
    \ inet {\n filter permit-management-ipv4 {\n term 1 {\n from {\n destination-address {\n <OOBM IPv4 address>;\n }\n source-address\
    \ { << Example embedded addresses using the\n'source-address' match criterion\n <IPv4 MGT subnet/mask>;\n }\n --or--\n\
    \ source-prefix-list { << Example inherited addresses using the\n'source-prefix-list' match criterion\n ipv4-management;\n\
    \ }\n protocol tcp;\n destination-port 22;\n }\n then {\n syslog;\n accept;\n }\n }\n term 2 {\n then {\n syslog;\n discard;\n\
    \ }\n }\n }\n}\nfamily inet6 {\n filter permit-management-ipv6 {\n term 1 {\n from {\n destination-address {\n <OOBM IPv6\
    \ address>;\n }\n source-address { << Example embedded addresses using the\n'source-address' match criterion\n <IPv6 MGT\
    \ subnet/prefix>;\n }\n --or--\n source-prefix-list { << Example inherited addresses using the\n'source-prefix-list' match\
    \ criterion\n ipv6-management;\n }\n next-header tcp;\n destination-port 22;\n }\n then {\n syslog;\n accept;\n }\n }\n\
    \ term 2 {\n then {\n syslog;\n discard;\n }\n }\n }\n}\nNote: Additional terms will be required for other services like\
    \ SNMP, RADIUS, or syslog.\nExample firewall filter applied to the OOBM interface. Juniper devices use different\nOOBM\
    \ interface names depending upon platform (fxp0 used in the example):\n[edit interfaces]\nfxp0 {\n unit 0 {\n family inet\
    \ {\n filter {\n input permit-management-ipv4;\n }\n address <OOBM IPv4 address>/<mask>;\n }\n family inet6 {\n filter\
    \ {\n input permit-management-ipv6;\n }\n address <OOBM IPv6 address>/<prefix>;\n }\n }\n}\nNote: Although the example\
    \ filter is shown applied to the management interface, the\nfilter can also be applied to the loopback interface (lo0).\
    \ If applying to loopback, ensure\nthe filter terms account for all traffic, services, and protocols that must reach the\
    \ routing\nengine (e.g., OSPF, BGP, SNMP, etc.).\nIf the switch does not enforce approved authorizations for controlling\
    \ the flow of\nmanagement information within the device based on information control policies, this is\na finding."
  remediation: 'Configure the network device to enforce approved authorizations for controlling the flow

    of management information within the network device based on information flow control

    policies.

    Example MGT networks:

    set policy-options prefix-list ipv4-management <IPv4 MGT subnet/mask>

    set policy-options prefix-list ipv6-management <IPv6 MGT subnet/prefix>

    Example firewall filters:

    set firewall family inet filter permit-management-ipv4 term 1 from

    destination-address <OOBM IPv4 address>

    set firewall family inet filter permit-management-ipv4 term 1 from sourceprefix-list ipv4-management

    set firewall family inet filter permit-management-ipv4 term 1 from protocol

    tcp

    set firewall family inet filter permit-management-ipv4 term 1 from

    destination-port 22

    set firewall family inet filter permit-management-ipv4 term 1 then syslog

    set firewall family inet filter permit-management-ipv4 term 1 then accept

    set firewall family inet filter permit-management-ipv4 term 2 then syslog

    set firewall family inet filter permit-management-ipv4 term 2 then discard

    set firewall family inet6 filter permit-management-ipv6 term 1 from

    destination-address <OOBM IPv6 address>

    set firewall family inet6 filter permit-management-ipv6 term 1 from sourceprefix-list ipv6-management

    set firewall family inet6 filter permit-management-ipv6 term 1 from nextheader tcp

    set firewall family inet6 filter permit-management-ipv6 term 1 from

    destination-port 22

    set firewall family inet6 filter permit-management-ipv6 term 1 then syslog

    set firewall family inet6 filter permit-management-ipv6 term 1 then accept

    set firewall family inet6 filter permit-management-ipv6 term 2 then syslog

    set firewall family inet6 filter permit-management-ipv6 term 2 then discard

    Example interface configuration:

    set interfaces fxp0 unit 0 family inet filter input permit-management-ipv4

    set interfaces fxp0 unit 0 family inet address <OOBM IPv4 address>/<mask>

    set interfaces fxp0 unit 0 family inet6 filter input permit-management-ipv6

    set interfaces fxp0 unit 0 family inet6 address <OOBM IPv6 address>/<prefix>'
  checks:
  - type: manual_review
    info: 'Review the network device configuration to determine if it enforces approved

      authorizations for controlling the flow of management information within the network

      device based on information flow control policies.

      Verify the switch permits administrative access only from the authorized management

      network(s). Verify filters and terms account for all authorized management traffic.

      Example prefix-list defining the management networks. Prefix lists are not required

      because IP addresses can be directl'
    severity: medium
- id: '1.5'
  title: JUEX-NM-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce the limit of three consecutive invalid logon attempts
    for any given user, after which time it must block any login attempt for that user for 15 minutes. GROUP ID: V-253885
    RULE ID: SV-253885r960840'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced. Introducing a lockout period significantly increases the time required for
    each brute-force attack and increases the likelihood that security personnel will identify (and can respond to) an ongoing
    attack and/or that the authorized owner will recognize and report the unauthorized activity.
  impact: ''
  references: []
  page_start: 24
  audit_raw: "Juniper switches maintain the number of failed login attempts per user until the session\nis restarted or, if\
    \ lockout-period is configured, until the next successful login. If the\npermissible number of failed login attempts is\
    \ reached, the switch prevents logging in\nfor the duration of the lockout-period (1..43200 minutes) regardless whether\
    \ the account\nis locally or externally authenticated and across all management access methods (e.g.,\nlocal console and\
    \ SSH).\nReview the device configuration to verify that it enforces the limit of three consecutive\ninvalid logon attempts\
    \ before introducing a 15 minute lockout period.\n[edit system login]\nretry-options {\n tries-before-disconnect 3;\n\
    \ lockout-period 15;\n}\nIf the device is not configured to enforce the limit of three consecutive invalid logon\nattempts\
    \ before introducing a 15-minute block on subsequent login attempts, this is a\nfinding."
  remediation: 'Configure the network device to enforce the limit of three consecutive invalid logon

    attempts and to block subsequent login attempts for 15 minutes.

    set system login retry-options tries-before-disconnect 3

    set system login retry-options lockout-period 15'
  checks:
  - type: manual_review
    info: 'Juniper switches maintain the number of failed login attempts per user until the session

      is restarted or, if lockout-period is configured, until the next successful login. If the

      permissible number of failed login attempts is reached, the switch prevents logging in

      for the duration of the lockout-period (1..43200 minutes) regardless whether the account

      is locally or externally authenticated and across all management access methods (e.g.,

      local console and SSH).

      Review the device configuration to'
    severity: medium
- id: '1.6'
  title: JUEX-NM-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to display the Standard Mandatory DOD Notice and Consent Banner before
    granting access to the device. GROUP ID: V-253886 RULE ID: SV-253886r960843'
  rationale: Display of the DOD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
  impact: ''
  references: []
