- id: '1.40'
  title: JUEX-NM-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switches must be configured to use FIPS-validated Keyed-Hash Message Authentication Code (HMAC)
    to protect the integrity of nonlocal maintenance and diagnostic communications. GROUP ID: V-253928 RULE ID: SV-253928r961554'
  rationale: Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore
    cannot be relied upon to provide confidentiality or integrity, and DOD data may be compromised. Nonlocal maintenance and
    diagnostic activities are those activities conducted by individuals communicating through a network, either an external
    network (e.g., the internet) or an internal network. Currently, HMAC is the only FIPS-approved algorithm for generating
    and verifying message/data authentication codes in accordance with FIPS 198-1. Products that are FIPS 140-2 validated
    will have an HMAC that meets specification; however, the option must be configured for use as the only message authentication
    code used for authentication to cryptographic modules. Separate requirements for configuring applications and protocols
    used by each application (e.g., SNMPv3, SSHv2, HTTPS, and other protocols and applications that require server/client
    authentication) are required to implement this requirement. Where SSH is used, the SSHv2 protocol suite is required because
    it includes Layer 7 protocols such as SCP and SFTP, which can be used for secure file transfers. Use only AES Counter
    (CTR) cipher block chaining modes in compliance with CVE2008-5161, plugin 70658 based on vendor guidance in KB20853. This
    prevents certain plaintext attacks in OpenSSH.
  impact: ''
  references: []
  page_start: 109
  audit_raw: "Verify the network device uses FIPS-validated HMAC to protect the integrity of nonlocal\nmaintenance and diagnostic\
    \ communications.\nIf using SNMPv3, verify (minimally) that authentication-sha is configured. Juniper\ndevices also support\
    \ authentication-sha224/256/384/512. Verify the strongest mutually\nsupported HMAC between the network device and the\
    \ Network Management Server\n(NMS) is configured.\n[edit system snmp]\nv3 {\n usm {\n local-engine {\n user <SNMPv3 user>\
    \ {\n authentication-sha {\n authentication-key \"PSK\"; ## SECRET-DATA\n }\n }\n }\n }\n}\nVerify SSHv2 is configured\
    \ for protocol V2 only, ciphers [ aes256-ctr aes192-ctr\naes128-ctr ], key-exchange [ ecdh-sha2-nistp521 ecdh-sha2-nistp384\
    \ ecdh-sha2nistp256 ], and macs [ hmac-sha2-512 hmac-sha2-256].\n[edit system services ssh]\n:\nprotocol-version v2;\n\
    ciphers [ aes256-ctr aes192-ctr aes128-ctr ];\nmacs [ hmac-sha2-512 hmac-sha2-256 ];\nkey-exchange [ ecdh-sha2-nistp521\
    \ ecdh-sha2-nistp384 ecdh-sha2-nistp256 ];\nIf the network device does not use FIPS-validated HMAC to protect the integrity\
    \ of\nnonlocal maintenance and diagnostic communications, this is a finding."
  remediation: 'Configure the network device to use FIPS-validated HMAC to protect the integrity of

    nonlocal maintenance and diagnostic communications.

    set snmp v3 usm local-engine user <SNMPv3 user> authentication-sha

    authentication-password "PSK"

    set snmp v3 usm local-engine user <SNMPv3 user> privacy-aes128 privacypassword "PSK"

    Note: Use the strongest HMAC mutually supported with the NMS (e.g., authenticationsha256, authentication-sha512)

    set system services ssh protocol-version v2

    set system services ssh ciphers aes256-ctr

    set system services ssh ciphers aes192-ctr

    set system services ssh ciphers aes128-ctr

    set system services ssh macs hmac-sha2-512

    set system services ssh macs hmac-sha2-256

    set system services ssh key-exchange ecdh-sha2-nistp521

    set system services ssh key-exchange ecdh-sha2-nistp384

    set system services ssh key-exchange ecdh-sha2-nistp256'
  checks:
  - type: manual_review
    info: "Verify the network device uses FIPS-validated HMAC to protect the integrity of nonlocal\nmaintenance and diagnostic\
      \ communications.\nIf using SNMPv3, verify (minimally) that authentication-sha is configured. Juniper\ndevices also\
      \ support authentication-sha224/256/384/512. Verify the strongest mutually\nsupported HMAC between the network device\
