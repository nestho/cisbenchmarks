- id: '1.32'
  title: JUEX-NM-000420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to generate an immediate real-time alert of all audit failure events
    requiring real-time alerts. GROUP ID: V-253919 RULE ID: SV-253919r961401'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability
    and system operation may be adversely affected. Alerts provide organizations with urgent messages. Real-time alerts provide
    these messages immediately (i.e., the time from event detection to alert occurs in seconds or less).
  impact: ''
  references: []
  page_start: 90
  audit_raw: "Determine if the network device generates an immediate alert of all audit failure events\nrequiring real-time\
    \ alerts.\nJuniper network devices support monitoring the audit log storage partition (/var),\nmonitoring the SNMP health\
    \ status, or both. On devices supporting disk partition\nmonitoring, verify the audit log partition (/var) free space\
    \ is configured appropriately for\nthe environment. For example, to generate \"high disk usage\" alerts at 80 percent\n\
    capacity (20 percent free), and \"full disk usage\" at 90 percent capacity (10 percent free):\n[edit chassis]\ndisk-partition\
    \ /var {\n level full {\n free-space 10 percent;\n }\n level high {\n free-space 20 percent;\n }\n}\nNote: The configurable\
    \ parameter is a percentage of free space remaining, not\npercentage used. \"High\" usage percent of remaining free space\
    \ must be equal\nto, or greater than, the \"full\" usage percent of remaining free space.\nFor network devices supporting\
    \ SNMP health monitoring, verify the rising and\nfalling threshold values for monitored objects (e.g., CPU, memory, and\
    \ disk\nstorage usage). In the example below, any monitored object exceeding 75\npercent usage will generate an alert.\
    \ Another alert is generated when the\nusage falls below 74 percent. As configured in the example, Junos samples\nevery\
    \ 300 seconds. The falling threshold value must be less than the rising\nthreshold value. Verify the thresholds are appropriate\
    \ for the target\nenvironment.\n[edit snmp]\nhealth-monitor {\n interval 300;\n rising-threshold 75;\n falling-threshold\
    \ 74;\n}\nNote: Monitored objects generate an event the first time they cross a threshold, not at\nevery sample interval.\n\
    This requirement may be verified by configuration review or validated test results.\nIf an immediate alert of all audit\
    \ failure events requiring real-time alerts is not generated,\nthis is a finding."
  remediation: 'Configure the network device to generate an immediate real-time alert of all audit failure

    events requiring real-time alerts.

    set chassis disk-partition /var level full free-space <0..100>

    set chassis disk-partition /var level full free-space percent

    set chassis disk-partition /var level high free-space <0..100>

    set chassis disk-partition /var level high free-space percent

    Note: "High" disk free-space value must be equal to or greater than "full" free-space

    value.

    set snmp health-monitor interval <1..2147483647 seconds>

    set snmp health-monitor rising-threshold <1..100 percent>

    set snmp health-monitor falling-threshold <0..100 percent>

    Note: Falling threshold value must be less than the rising-threshold value or commit

    fails.'
  checks:
  - type: manual_review
    info: 'Determine if the network device generates an immediate alert of all audit failure events

      requiring real-time alerts.

      Juniper network devices support monitoring the audit log storage partition (/var),

      monitoring the SNMP health status, or both. On devices supporting disk partition

      monitoring, verify the audit log partition (/var) free space is configured appropriately for

      the environment. For example, to generate "high disk usage" alerts at 80 percent

      capacity (20 percent free), and "full disk us'
    severity: medium
- id: '1.33'
  title: JUEX-NM-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to synchronize internal information system clocks using redundant
    authoritative time sources. GROUP ID: V-253920 RULE ID: SV-253920r1018769'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while that source synchronizes its time to a more accurate source. The network device must utilize an authoritative
    time server and/or be configured to use redundant authoritative time sources. This requirement is related to the comparison
    done in CCI-001891. DOD-approved solutions consist of a combination of a primary and secondary time source using a combination
    or multiple instances of the following: A time server designated for the appropriate DOD network (NIPRNet/SIPRNet); United
    States Naval Observatory (USNO) time servers; and/or the Global Positioning System (GPS). The secondary time source must
    be located in a different geographic region than the primary time source.'
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'Determine if the network device is configured to synchronize internal information system

    clocks with the primary and secondary time sources.

    Verify the Network Time Protocol (NTP) configuration.

    [edit system ntp]

    authentication-key 1 type sha256 value "PSK"; ## SECRET-DATA

    authentication-key 2 type sha1 value "PSK"; ## SECRET-DATA

    server <address 1> key 1 prefer; ## SECRET-DATA

    server <address 2> key 2; ## SECRET-DATA

    trusted-key [ 1 2 ];

    source-address <lo0 or OOBM address>;

    If the network device is not configured to synchronize internal information system clocks

    with the primary and secondary time sources, this is a finding.'
  remediation: 'Configure the network device to synchronize internal information system clocks with the

    primary and secondary time sources.

    set system ntp authentication-key 1 type sha256

    set system ntp authentication-key 1 value "PSK"

    set system ntp authentication-key 2 type sha1

    set system ntp authentication-key 2 value "PSK"

    set system ntp server <address 1> key 1

    set system ntp server <address 1> prefer

    set system ntp server <address 2> key 2

    set system ntp trusted-key 1

    set system ntp trusted-key 2

    set system ntp source-address <lo0 or OOBM address>'
  checks:
  - type: manual_review
    info: 'Determine if the network device is configured to synchronize internal information system

      clocks with the primary and secondary time sources.

      Verify the Network Time Protocol (NTP) configuration.

      [edit system ntp]

      authentication-key 1 type sha256 value "PSK"; ## SECRET-DATA

