- id: '1.47'
  title: JUEX-NM-000590
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to generate audit records when concurrent logons from different workstations
    occur. GROUP ID: V-253936 RULE ID: SV-253936r961833'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the network device (e.g., module or policy filter).
  impact: ''
  references: []
  page_start: 130
  audit_raw: "Determine if the network device generates audit records when concurrent logons from\ndifferent workstations\
    \ occur.\nJunos logs all logon attempts via the \"authorization\" syslog facility. Verify logging level\n\"any info\"\
    \ or \"authorization info\" is configured. Time stamps are created for every log\nentry, both successful and failed logon\
    \ attempts, and logout.\n[edit system syslog]\nfile <file name> {\n any info;\n}\nhost <external syslog address> {\n any\
    \ info;\n}\ntime-format year millisecond;\nSyslog outputs in standard format unless the \"structured-data\" directive\
    \ is configured.\nVerify the \"structured-data\" command for all files and external syslog servers requiring\nthat format.\
    \ For example:\n[edit system syslog]\nhost <syslog address> {\n change-log info;\n interactive-commands info;\n structured-data;\n\
    }\nfile <file name> {\n any info;\n structured-data;\n}\nIf the network device does not generate audit records when concurrent\
    \ logons from\ndifferent workstations occur, this is a finding."
  remediation: 'Configure the network device to generate audit records when concurrent logons from

    different workstations occur.

    set system syslog file <file name> any info

    set system syslog host <external syslog address> any info

    set system syslog time-format year'
  checks:
  - type: manual_review
    info: "Determine if the network device generates audit records when concurrent logons from\ndifferent workstations occur.\n\
      Junos logs all logon attempts via the \"authorization\" syslog facility. Verify logging level\n\"any info\" or \"authorization\
      \ info\" is configured. Time stamps are created for every log\nentry, both successful and failed logon attempts, and\
      \ logout.\n[edit system syslog]\nfile <file name> {\n any info;\n}\nhost <external syslog address> {\n any info;\n}\n\
      time-format year millisecond;\nSyslog outputs "
    severity: medium
- id: '1.48'
  title: JUEX-NM-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to generate log records for a locally developed list of auditable
    events. GROUP ID: V-253939 RULE ID: SV-253939r961863'
  rationale: Auditing and logging are key components of any security architecture. Logging the actions of specific events
    provides a means to investigate an attack; to recognize resource utilization or capacity thresholds; or to identify an
    improperly configured network device. If auditing is not comprehensive, it will not be useful for intrusion monitoring,
    security investigations, and forensic analysis.
  impact: ''
  references: []
  page_start: 132
  audit_raw: "Determine if the network device generates audit log events for a locally developed list of\nauditable events.\n\
    Verify audit logging is enabled.\n[edit system syslog]\nfile <file name> {\n any info;\n}\nhost <external syslog address>\
    \ {\n any info;\n}\ntime-format year;\nNote: Without the \"structured-data\" directive (as shown), syslog outputs in standard\n\
    format. Add the \"structured-data\" command to all files and external syslog servers\nrequiring that format. For example:\n\
    [edit system syslog]\nfile <file name> {\n any info;\n structured-data;\n}\nIf the logging facility and level is too broad,\
    \ Junos supports REGEX or\nstring match conditions to filter events. If used, verify the match\nconditions capture the\
    \ required events.\n[edit system syslog]\nfile <file name> {\n any info;\n match <REGEX>;\n -ormatch-strings [ \"string\
    \ 1\" \"string 2\" ];\n}\nNote: When using match conditions, it may be necessary to use the \"any\" (debug)\nseverity\
    \ level, but this should not generate overwhelming numbers of messages\nbecause the filter will ignore all unmatched events.\n\
    If the network device is not configured to generate audit log events for a locally\ndeveloped list of auditable events,\
    \ this is a finding."
  remediation: 'Configure the network device to generate audit log events for a locally developed list of

    auditable events.

    set system syslog file <file name> messages any info

    set system syslog file <file name> structured-data << (Optional) Only if

    structured data format is required

    set system syslog host <external syslog address> any info

    set system syslog host <external syslog address> structured-data <<

    (Optional) Only if structured data format is required

    set system syslog time-format year

    If using REGEX or string match conditions:

    set system syslog file <name> any <info|any>

    set system syslog file <name> match <REGEX>

    -orset system syslog file <name> match-strings [ "string 1" "string 2" ]'
  checks:
  - type: manual_review
    info: "Determine if the network device generates audit log events for a locally developed list of\nauditable events.\n\
      Verify audit logging is enabled.\n[edit system syslog]\nfile <file name> {\n any info;\n}\nhost <external syslog address>\
      \ {\n any info;\n}\ntime-format year;\nNote: Without the \"structured-data\" directive (as shown), syslog outputs in\
      \ standard\nformat. Add the \"structured-data\" command to all files and external syslog servers\nrequiring that format.\
      \ For example:\n[edit system syslog]\nfile <file name>"
    severity: medium
- id: '1.49'
  title: JUEX-NM-000630
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce access restrictions associated with changes to the system
    components. GROUP ID: V-253940 RULE ID: SV-253940r961863'
  rationale: Changes to the hardware or software components of the network device can have significant effects on the overall
    security of the network. Therefore, only qualified and authorized individuals should be allowed administrative access
    to the network device for implementing any changes or upgrades. This requirement applies to updates of the application
    files, configuration, firewall filters, and policy filters.
  impact: ''
  references: []
  page_start: 135
  audit_raw: "Check the network device to determine if only authorized administrators have\npermissions for changes, deletions\
    \ and updates on the network device. Inspect the\nmaintenance log to verify changes are being made only by the system\
    \ administrators.\nJuniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions\
    \ in Junos are either \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts\
    \ have an authentication stanza\nand support both external and local authentication. Template accounts do not have an\n\
    authentication stanza and only support external authentication. Every account (local and\ntemplate) must be assigned a\
    \ login class by an authorized administrator.\nVerify each account is assigned a login class with appropriate permissions\
    \ based upon\norganizational requirements. Login classes support optional allow- and deny- directives\nas shown in the\
    \ examples. Organizational requirements may require different allow- and\ndeny- directives or no directives at all.\n\
    [edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security log)|^(clear|show)\
    \ security alarms\nalarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade re|system decrypt)|^rollback\"\
    ;\n deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security (ike|ipsec) (policy|proposal)\"\
    \ \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security log\" \"system fips selftest\
    \ after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\" \"system\
    \ services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must\nbe externally authenticated, and cannot log in locally.\nIf unauthorized users are\
    \ allowed to change the hardware or software, this is a finding."
  remediation: 'Configure the network device to enforce access restrictions associated with changes to

    the system components.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'Check the network device to determine if only authorized administrators have

      permissions for changes, deletions and updates on the network device. Inspect the

      maintenance log to verify changes are being made only by the system administrators.

      Juniper switches use role-based access controls (RBAC) to assign privilege levels.

      Account definitions in Junos are either "local" or "template", discriminat'
- id: '1.50'
  title: JUEX-NM-000640
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to use an authentication server for the purpose of authenticating
    users prior to granting administrative access. GROUP ID: V-253941 RULE ID: SV-253941r1001014'
  rationale: Centralized management of authentication settings increases the security of remote and nonlocal access methods.
    This control is particularly important protection against the insider threat. With robust centralized management, audit
    records for administrator account access to the organization's network devices can be more readily analyzed for trends
    and anomalies. The alternative method of defining administrator accounts on each device exposes the device configuration
    to remote access authentication attacks and system administrators with multiple authenticators for each network device.
  impact: ''
  references: []
  page_start: 138
  audit_raw: "Review the network device configuration to verify the device is configured to use an\nauthentication server\
    \ as the primary source for authentication. Verify the RADIUS\nand/or TACACS+ server addresses.\n[edit system]\nradius-server\
    \ {\n <RADIUS-1 address> secret \"hashed PSK\"; ## SECRET-DATA\n <RADIUS-2 address> secret \"hashed PSK\"; ## SECRET-DATA\n\
    }\ntacplus-server {\n <TACPLUS-1 address> secret \"hashed PSK\"; ## SECRET-DATA\n <TACPLUS-2 address> secret \"hashed\
    \ PSK\"; ## SECRET-DATA\n}\nVerify the authentication order places the external authentication server first.\n[edit system]\n\
    authentication-order [ radius tacplus password ];\nNote: Only the global authentication order is required; all administrative\
    \ access methods\nwill honor the global setting unless configured separately.\nIf the network device is not configured\
    \ to use an authentication server to authenticate\nusers prior to granting administrative access, this is a finding."
  remediation: 'Configure the network device to use an authentication server.

    set system radius-server <RADIUS-1 address> secret "<PSK>"

    set system tacplus-server <TACPLUS-1 address> secret "<PSK>"

    Configure the authentication order to use the authentication server as primary source

    for authentication.

    set system authentication-order radius

    set system authentication-order tacplus

    set system authentication-order password'
  checks:
  - type: manual_review
    info: "Review the network device configuration to verify the device is configured to use an\nauthentication server as\
      \ the primary source for authentication. Verify the RADIUS\nand/or TACACS+ server addresses.\n[edit system]\nradius-server\
      \ {\n <RADIUS-1 address> secret \"hashed PSK\"; ## SECRET-DATA\n <RADIUS-2 address> secret \"hashed PSK\"; ## SECRET-DATA\n\
      }\ntacplus-server {\n <TACPLUS-1 address> secret \"hashed PSK\"; ## SECRET-DATA\n <TACPLUS-2 address> secret \"hashed\
      \ PSK\"; ## SECRET-DATA\n}\nVerify the authenticati"
    severity: medium
- id: '1.51'
  title: JUEX-NM-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to conduct backups of system level information contained in the information
    system when changes occur. GROUP ID: V-253942 RULE ID: SV-253942r961863'
  rationale: System-level information includes default and customized settings and security attributes, including firewall
    filters that relate to the network device configuration, as well as software required for the execution and operation
    of the device. Information system backup is a critical step in ensuring system integrity and availability. If the system
    fails and there is no backup of the system-level information, a denial-of-service condition is possible for all who utilize
    this critical network component. This control requires the network device to support the organizational central backup
    process for system-level information associated with the network device. This function may be provided by the network
    device itself; however, the preferred best practice is a centralized backup rather than each network device performing
    discrete backups.
  impact: ''
  references: []
  page_start: 142
  audit_raw: "Review the network device configuration to determine if the device is configured to\nconduct backups of system-level\
    \ information contained in the information system when\nchanges occur.\nVerify the preferred centralized backup system\
    \ is configured to retrieve the configuration\nfile. There is no provision for backing up system binaries because Juniper\
    \ provides the\nsigned installation packages rather than individual files. Therefore, verify the centralized\nbackup solution\
    \ has the appropriate installation packages for the deployed platforms.\nWhen the configuration file is pulled from the\
    \ centralized server, an example retrieval\nmethod is authenticated connections over NETCONF or manual retrieval using\
    \ SSH.\nJunos supports authenticating external services via RADIUS or TACACS+, or via a local\naccount.\n[edit system\
    \ services netconf]\nssh;\nrfc-compliant;\nNote: The rfc command is recommended for compatibility in large enterprises,\
    \ but can\nbe omitted if there are overriding operational considerations.\nIf the network device will be saving system\
    \ files to a centralized repository, verify the\nconfiguration file is automatically saved at each commit.\n[edit system\
    \ archival]\nconfiguration {\n transfer-on-commit;\n archive-sites {\n \"sftp://user@host/configuration_files\" password\n\
    \"$9$w52...<snip>...mfzn/\"; ## SECRET-DATA\n }\n}\nNote: The URL uses <scp|sftp>://@/<path without trailing slash (/)>\
    \ format because\nJunos appends the slash with the system-generated filename. Junos supports file\ntransfer either on\
    \ commit, or at configured intervals.\nIf the network device is not configured to conduct backups of system-level data\
    \ when\nchanges occur, this is a finding."
  remediation: 'Configure the network device to conduct backups of system-level information contained

    in the information system when changes occur.

    For NETCONF connections:

    set system services netconf ssh

    set system services netconf rfc-compliant

    Note: The rfc command is recommended for compatibility in large enterprise but can be

    omitted if there are overriding operational considerations.

    For device automated configuration offload:

    set system archival configuration transfer-on-commit

    set system archival configuration archive-sites

    "<scp|sftp>://<username>@<address>/<path without trailing slash (/)>"

    password "<PSK>"'
  checks:
  - type: manual_review
    info: 'Review the network device configuration to determine if the device is configured to

      conduct backups of system-level information contained in the information system when

      changes occur.

      Verify the preferred centralized backup system is configured to retrieve the configuration

      file. There is no provision for backing up system binaries because Juniper provides the

      signed installation packages rather than individual files. Therefore, verify the centralized

      backup solution has the appropriate installa'
    severity: medium
- id: '1.52'
  title: JUEX-NM-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to obtain its public key certificates from an appropriate certificate
    policy through an approved service provider. GROUP ID: V-253943 RULE ID: SV-253943r961863'
  rationale: For user certificates, each organization obtains certificates from an approved, shared service provider, as required
    by OMB policy. For federal agencies operating a legacy public key infrastructure cross-certified with the Federal Bridge
    Certification Authority at medium assurance or higher, this Certification Authority will suffice.
  impact: ''
  references: []
  page_start: 145
  audit_raw: 'Determine if the network device obtains public key certificates from an appropriate

    certificate policy through an approved service provider.

    Verify the certificate is signed by an approved CA via the "show security pki localcertificate" or "show security pki
    local-certificate detail" commands.

    If the network device does not obtain its public key certificates from an appropriate

    certificate policy through an approved service provider, this is a finding.'
  remediation: 'Configure the network device to obtain its public key certificates from an appropriate

    certificate policy through an approved service provider. To view installed certificates:

    show security pki (ca-certificate | local-certificate)

    Generate a public/private keypair:

    request security pki generate-key-pair type <ecdsa|rsa> size certificate-id

    Note: ECDSA certificates support 256, 384, or 512 key sizes and RSA supports 1024,

    2048, or 4096.

    Generate a certificate signing request:

    request security pki generate-certificate-request certificate-id digest <sha-1|sha256|sha-384> domain-name <FQDN> ip-address
    <IPv4 address> ipv6-address <IPv6

    address> subject <LDAP format>

    Note: The subject is LDAP formatted. For example, "CN=switch01,DC=example,DC=com,O=Company,OU=HR,L=Some City,ST=Some State,C=US".

    Not all key => value pairs are required but those used must match organizational policy.

    After securely transferring the CSR to the certificate authority for signing, and securely

    transferring the certificate to the device, add the certificate:

    request security pki local-certificate load filename <path/filename of certificate>

    certificate-id

    The certificate can also be generated externally, with separate public and private key

    files, or a PKCS#12 package containing both certificate and private key. When

    importing externally generated certificate and private key, use the "key" directive to

    identify the path and filename of the private key. If the private key, or the PKCS#12

    package, uses a passphrase, use the "passphrase" directive and provide the correct

    value.'
  checks:
  - type: sql
    command: show security pki localcertificate" or "show security pki local-certificate detail" commands.
    severity: medium
    info: 'Determine if the network device obtains public key certificates from an appropriate

      certificate policy through an approved service provider.

      Verify the certificate is signed by an approved CA via the "show security pki localcertificate" or "show security pki
      local-certificate detail" commands.

      If the network device does not obtain its public key certificates from an appropriate

      certificate policy '
- id: '1.53'
  title: JUEX-NM-000670
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to send log data to at least two central log servers for the purpose
    of forwarding alerts to the administrators and the information system security officer (ISSO). GROUP ID: V-253944 RULE
    ID: SV-253944r1028872'
  rationale: The aggregation of log data kept on a syslog server can be used to detect attacks and trigger an alert to the
    appropriate security personnel. Information stored in one location is vulnerable to accidental or incidental deletion
    or alteration.
  impact: ''
  references: []
  page_start: 147
  audit_raw: "1. Verify that the network device is configured to send log data to a redundant\ncentral log servers.\n2. Verify\
    \ the external syslog server is configured. The lowest severity level, \"any\", is\ndebug and will generate a significant\
    \ number of messages.\n[edit system syslog]\nhost <external syslog address> {\n any info;\n structured-format; << Only\
    \ if structured formatting is required,\notherwise events are recorded in standard format.\n}\ntime-format year;\nIf the\
    \ network device is not configured to send log data to redundant log servers, this is\na finding."
  remediation: 'Add the following stanzas to the configuration.

    set system syslog host <external syslog host1 IPv4 or IPv6 address> any info

    set system syslog host <external syslog host2 IPv4 or IPv6 address> any info

    Note: The time-format command supports including the year and/or the time in

    milliseconds. The default format does not include the year and time is recorded in

    seconds.'
  checks:
  - type: manual_review
    info: "1. Verify that the network device is configured to send log data to a redundant\ncentral log servers.\n2. Verify\
      \ the external syslog server is configured. The lowest severity level, \"any\", is\ndebug and will generate a significant\
      \ number of messages.\n[edit system syslog]\nhost <external syslog address> {\n any info;\n structured-format; << Only\
      \ if structured formatting is required,\notherwise events are recorded in standard format.\n}\ntime-format year;\nIf\
      \ the network device is not configured to send log"
    severity: medium
