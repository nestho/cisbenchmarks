- id: '1.15'
  title: JUEX-NM-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to protect audit tools from unauthorized access. GROUP ID: V-253898
    RULE ID: SV-253898r960939'
  rationale: Protecting audit data also includes identifying and protecting the tools used to view and manipulate log data.
    Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit data. Network devices providing
    tools to interface with audit data will leverage user permissions and roles identifying the user accessing the tools and
    the corresponding rights the user enjoys in order to make access decisions regarding the access to audit tools. Audit
    tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate
    audit information system activity and records. Audit tools include custom queries and report generators.
  impact: ''
  references: []
  page_start: 50
  audit_raw: "Junos provides the operational mode commands \"show\" (to display the contents of a\nlog file) or \"clear\"\
    \ (to delete all of the contents of a log file); there is no text editor or\nother \"audit tool\" provided in the CLI.\
    \ Operational and configuration mode commands\nrequire assignment of the required permission bit to execute. For example,\
    \ audit logs\nare configured in the [edit system] hierarchy and require the \"system\" permission to\nview and the \"\
    system-control\" permission to configure (or permissions set \"all\").\nHowever, using the allow or deny statements permits\
    \ adding, or removing, specific\ncommands or configuration hierarchy levels. Adding the \"deny-commands \"^clear log\"\
    \"\ndirective to a login class prevents any user assigned to that class from clearing any log\nfile.\nVerify the permissions\
    \ assigned to each login class is appropriate.\nIn addition to limiting permissions, Junos supports limiting commands\
    \ and hierarchy\nlevels that would otherwise be permitted. For example, to remove the ability to modify\nauditing from\
    \ a login class with the \"system-control\" or \"all\" permissions assigned, use\nthe \"deny-configuration-regexps [ \"\
    system syslog\" ]\" directive. To prevent administrative\nusers assigned to that same login class from viewing and/or\
    \ deleting the audit file\ncontents, add the \"deny-commands \"^(show|clear) log\"\" directive.\nExample login-class definitions:\n\
    [edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security log)|^(clear|show)\
    \ security alarms\nalarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade re|system decrypt)|^rollback\"\
    ;\n deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security (ike|ipsec) (policy|proposal)\"\
    \ \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security log\" \"system fips selftest\
    \ after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\" \"system\
    \ services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf the network device does\
    \ not protect its audit tools from unauthorized access, this is a\nfinding."
  remediation: 'Configure the network device to protect audit tools from unauthorized access.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
