- id: '1.13'
  title: JUEX-NM-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to protect audit information from unauthorized modification. GROUP
    ID: V-253896 RULE ID: SV-253896r960933'
  rationale: Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to
    successfully audit network device activity. If audit data were to become compromised, then forensic analysis and discovery
    of the true source of potentially malicious system activity is impossible to achieve. To ensure the veracity of audit
    data, the network device must protect audit information from unauthorized modification. This requirement can be achieved
    through multiple methods, which will depend upon system architecture and design. Some commonly employed methods include
    ensuring log files receive the proper file system permissions and limiting log data locations. Network devices providing
    a user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the
    corresponding rights that the user enjoys to make access decisions regarding the modification of audit data.
  impact: ''
  references: []
  page_start: 44
  audit_raw: "Determine if the network device protects audit information from any type of\nunauthorized modification with\
    \ such methods as ensuring log files receive the proper file\nsystem permissions, limiting log data locations, and leveraging\
    \ user permissions and\nroles to identify the user accessing the data and the corresponding rights that the user\nenjoys.\
    \ This requirement may be verified by demonstration, configuration, or validated\ntest results.\nJuniper switches use\
    \ role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in Junos are either \"local\" or\
    \ \"template\", discriminated by the\npresence of an authentication stanza. Local accounts have an authentication stanza\n\
    and support both external and local authentication. Template accounts do not have an\nauthentication stanza and only support\
    \ external authentication. Every account (local and\ntemplate) must be assigned a login class by an authorized administrator.\n\
    Audit logs are configured in the [edit system] hierarchy and require the \"system\"\npermission to view and the \"system-control\"\
    \ permission to configure (or permissions set\n\"all\"). However, using the allow or deny statements permits adding, or\
    \ removing,\nspecific commands or configuration hierarchy levels.\nVerify each account is assigned a login class with\
    \ appropriate permissions based upon\norganizational requirements. Login classes support optional allow- and deny- directives\n\
    as shown in the examples. Organizational requirements may require different allow- and\ndeny- directives or no directives\
    \ at all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security\
    \ log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade\
    \ re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security\
    \ (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security\
    \ log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf the network device does\
    \ not protect audit information from unauthorized modification,\nthis is a finding."
  remediation: 'Configure the network device to protect audit information from unauthorized

    modification.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
