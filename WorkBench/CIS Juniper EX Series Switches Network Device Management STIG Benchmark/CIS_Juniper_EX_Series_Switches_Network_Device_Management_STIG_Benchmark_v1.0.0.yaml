      server <address 1> key 1 prefer; ## SECRET-DATA

      server <address 2> key 2; ## SECRET-DATA

      trusted-key [ 1 2 ];

      source-address <lo0 or OOBM address>;

      If the network devi'
    severity: medium
- id: '1.34'
  title: JUEX-NM-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to record time stamps for audit records that can be mapped to Coordinated
    Universal Time (UTC) or Greenwich Mean Time (GMT). GROUP ID: V-253921 RULE ID: SV-253921r961443'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by the application include date and time. Time is commonly expressed in UTC,
    a modern continuation of GMT, or local time with an offset from UTC.
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'Determine if the network device records time stamps for audit records that can be

    mapped to UTC or GMT. This requirement may be verified by demonstration or

    configuration review.

    Verify the time zone is UTC.

    [edit system]

