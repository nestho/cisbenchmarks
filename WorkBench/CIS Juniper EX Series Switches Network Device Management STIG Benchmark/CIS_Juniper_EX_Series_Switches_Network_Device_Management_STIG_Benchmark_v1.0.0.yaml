- id: '1.44'
  title: JUEX-NM-000570
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to generate audit records for privileged activities or other system-level
    access. GROUP ID: V-253934 RULE ID: SV-253934r961827'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the network device (e.g., module or policy filter).
  impact: ''
  references: []
  page_start: 124
  audit_raw: "Determine if the network device generates audit records for privileged activities or other\nsystem-level access.\n\
    Junos logs all completed commands via the \"interactive-commands\" syslog facility and\nall configuration changes via\
    \ \"change-log\". Successful and unsuccessful login attempts\nare logged using the \"authorization\" facility. Verify\
    \ syslog is configured to capture these\nfacilities using the logging level \"info\" or above. The lowest logging level,\
    \ \"any\", is debug\nand will generate significant numbers of messages. The \"any\" logging facility (not to be\nconfused\
    \ with the severity level \"any\") includes authorization, change-log, and\ninteractive-commands.\nExample configuration\
    \ to generate audit records for privileged activities or other systemlevel access.\n[edit system syslog]\nfile <file name>\
    \ {\n authorization info;\n change-log info;\n interactive-commands info;\n}\nhost <syslog address> {\n any info;\n explicit-priority;\n\
    }\ntime-format year millisecond;\nNote: The time-format command supports including the year and/or the time in\nmilliseconds\
    \ (both shown for clarity). The default format does not include the year and\ntime is recorded in seconds.\nSyslog outputs\
    \ in standard format unless the \"structured-data\" directive is configured.\nVerify the \"structured-data\" command for\
    \ all files and external syslog servers requiring\nthat format. For example:\n[edit system syslog]\nhost <syslog address>\
    \ {\n authorization info;\n change-log info;\n interactive-commands info;\n structured-data;\n}\nfile <file name> {\n\
    \ any info;\n structured-data;\n}\nIf the network device does not generate audit records for privileged activities or\
    \ other\nsystem-level access, this is a finding."
  remediation: 'Configure the network device to generate audit records for privileged activities or other

    system-level access.

    set system syslog host <syslog address> any info

    set system syslog host <syslog address> explicit-priority

    set system syslog file <file name> any info

    set system syslog time-format year'
  checks:
  - type: manual_review
    info: 'Determine if the network device generates audit records for privileged activities or other

      system-level access.

      Junos logs all completed commands via the "interactive-commands" syslog facility and

      all configuration changes via "change-log". Successful and unsuccessful login attempts

      are logged using the "authorization" facility. Verify syslog is configured to capture these

      facilities using the logging level "info" or above. The lowest logging level, "any", is debug

      and will generate significant '
