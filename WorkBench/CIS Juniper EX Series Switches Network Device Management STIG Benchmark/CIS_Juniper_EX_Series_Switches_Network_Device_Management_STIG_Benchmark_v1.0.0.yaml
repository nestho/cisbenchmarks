  title: JUEX-NM-000930
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must prevent nonprivileged users from executing privileged functions to include disabling,
    circumventing, or altering implemented security safeguards/countermeasures. GROUP ID: V-253947 RULE ID: SV-253947r961353'
  rationale: Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. Privileged functions include, for example, establishing
    accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged
    users are individuals that do not possess appropriate authorizations.
  impact: ''
  references: []
  page_start: 152
  audit_raw: "If the network device is configured to use a AAA service account, and the AAA broker is\nconfigured to assign\
    \ authorization levels based on centralized user account group\nmemberships on behalf of the network device, that will\
    \ satisfy this objective. Because\nthe responsibility for meeting this objective is transferred to the AAA broker, this\n\
    requirement is not applicable for the local network device. This requirement may be\nverified by demonstration or configuration\
    \ review.\nJuniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in\
    \ Junos are either \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts\
    \ have an authentication stanza\nand support both external and/or local authentication depending upon the authentication\n\
    order. Template accounts do not have an authentication stanza and only support\nexternal authentication. Every account\
    \ (local and template) must be assigned a login\nclass by an authorized administrator.\nVerify each account is assigned\
    \ a login class with appropriate permissions based upon\norganizational requirements. Login classes support optional allow-\
    \ and deny- directives\nas shown in the examples. Organizational requirements may require different allow- and\ndeny-\
    \ directives, or no directives at all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands\
    \ \"^clear (log|security log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system set-encryption-key|system\
    \ firmware\nupgrade re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security alarms potential-violation\
    \ idp\"\n\"security (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\"\
    \ \"security log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nVerify the network device\
    \ is configured to assign appropriate user roles or access levels\nto authenticated users. This requirement may be verified\
    \ by demonstration or\nconfiguration review.\nIf the Juniper EX switch does not prevent nonprivileged users from executing\
    \ privileged\nfunctions to include disabling, circumventing, or altering implemented security\nsafeguards/countermeasures,\
    \ this is a finding."
  remediation: 'Configure the network device to assign appropriate user roles or access levels to

    authenticated users, or configure the network device to leverage an AAA solution that

    will satisfy this objective.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
