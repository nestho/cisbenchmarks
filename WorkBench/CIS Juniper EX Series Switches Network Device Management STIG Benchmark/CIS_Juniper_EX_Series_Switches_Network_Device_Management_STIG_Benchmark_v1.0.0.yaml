- id: '1.35'
  title: JUEX-NM-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to prohibit installation of software without explicit privileged
    status. GROUP ID: V-253922 RULE ID: SV-253922r1018770'
  rationale: Allowing anyone to install software, without explicit privileges, creates the risk that untested or potentially
    malicious software will be installed on the system. This requirement applies to code changes and upgrades for all network
    devices.
  impact: ''
  references: []
  page_start: 97
  audit_raw: "Determine if the network device prohibits installation of software without explicit\nprivileged status. This\
    \ requirement may be verified by demonstration or configuration\nreview.\nJuniper switches use role-based access controls\
    \ (RBAC) to assign privilege levels.\nAccount definitions in Junos are either \"local\" or \"template\", discriminated\
    \ by the\npresence of an authentication stanza. Local accounts have an authentication stanza\nand support both external\
    \ and local authentication. Template accounts do not have an\nauthentication stanza and only support external authentication.\
    \ Every account (local and\ntemplate) must be assigned a login class by an authorized administrator.\nInstallation of\
    \ firmware requires the maintenance permission bit. However, even with\nthat bit set, software installation can be limited\
    \ by the \"deny-commands\" statement\n(e.g., deny-commands \"^request system software\"). The command takes a regular\n\
    expression (REGEX) enclosed in double quotes (\").\nVerify each account is assigned a login class with appropriate permissions\
    \ based upon\norganizational requirements. Login classes support optional allow- and deny- directives\nas shown in the\
    \ examples. Organizational requirements may require different allow- and\ndeny- directives or no directives at all.\n\
    [edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands \"^clear (log|security log)|^(clear|show)\
    \ security alarms\nalarm-type idp|^request (security|system set-encryption-key|system firmware\nupgrade re|system decrypt)|^rollback\"\
    ;\n deny-configuration-regexps [ \"security alarms potential-violation idp\"\n\"security (ike|ipsec) (policy|proposal)\"\
    \ \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\" \"security log\" \"system fips selftest\
    \ after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\" \"system\
    \ services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf installation of software\
    \ is not prohibited without explicit privileged status, this is a\nfinding."
  remediation: 'Configure the network device to prohibit installation of software without explicit

    privileged status.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'Determine if the network device prohibits installation of software without explicit

      privileged status. This requirement may be verified by demonstration or configuration

      review.

      Juniper switches use role-based access controls (RBAC) to assign privilege levels.

      Account definitions in Junos are either "local" or "template", discriminated by the

      presence of an authentication stanza. Local accounts ha'
- id: '1.36'
  title: JUEX-NM-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce access restrictions associated with changes to device
    configuration. GROUP ID: V-253923 RULE ID: SV-253923r961461'
  rationale: Failure to provide logical access restrictions associated with changes to device configuration may have significant
    effects on the overall security of the system. When dealing with access restrictions pertaining to change control, it
    should be noted that any changes to the hardware, software, and/or firmware components of the device can potentially have
    significant effects on the overall security of the device. Accordingly, only qualified and authorized individuals should
    be allowed to obtain access to device components for the purposes of initiating changes, including upgrades and modifications.
    Logical access restrictions include, for example, controls that restrict access to workflow automation, media libraries,
    abstract layers (e.g., changes implemented into third-party interfaces rather than directly into information systems),
    and change windows (e.g., changes occur only during specified times, making unauthorized changes easy to discover).
  impact: ''
  references: []
  page_start: 100
  audit_raw: "Determine if the network device enforces access restrictions associated with changes to\ndevice configuration.\n\
    Juniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in Junos are either\
    \ \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts have an authentication\
    \ stanza\nand support both external and local authentication. Template accounts do not have an\nauthentication stanza\
    \ and only support external authentication. Every account (local and\ntemplate) must be assigned a login class by an authorized\
    \ administrator.\nConfiguration changes require permissions sets appropriate for each stanza. For\nexample, the \"system\"\
    \ bit permits one to view [edit system] and the \"system-control\" bit\npermits editing (add, delete, modify).\nVerify\
    \ each account is assigned a login class with appropriate permissions based upon\norganizational requirements. Login classes\
    \ support optional allow- and deny- directives\nas shown in the examples. Organizational requirements may require different\
    \ allow- and\ndeny- directives or no directives at all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions\
    \ all;\n deny-commands \"^clear (log|security log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system\
    \ set-encryption-key|system firmware\nupgrade re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security\
    \ alarms potential-violation idp\"\n\"security (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\"\
    \ \"security log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf the network device does\
    \ not enforce such access restrictions, this is a finding."
  remediation: 'Configure the network device to enforce access restrictions associated with changes to

    device configuration.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'Determine if the network device enforces access restrictions associated with changes to

      device configuration.

      Juniper switches use role-based access controls (RBAC) to assign privilege levels.

      Account definitions in Junos are either "local" or "template", discriminated by the

      presence of an authentication stanza. Local accounts have an authentication stanza

      and support both external and local auth'
- id: '1.37'
  title: JUEX-NM-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to authenticate SNMP messages using a FIPS-validated Keyed-Hash Message
    Authentication Code (HMAC). GROUP ID: V-253925 RULE ID: SV-253925r961506'
  rationale: Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. Bidirectional authentication provides stronger safeguards to validate the identity of other devices for connections
    that are of greater risk. A local connection is any connection with a device communicating without the use of a network.
    A network connection is any connection with a device that communicates through a network (e.g., local area or wide area
    network, internet). A remote connection is any connection with a device communicating through an external network (e.g.,
    the internet). Because of the challenges of applying this requirement on a large scale, organizations are encouraged to
    only apply the requirement to those limited number (and type) of devices that truly need to support this capability.
  impact: ''
  references: []
  page_start: 103
  audit_raw: "Review the network device configuration to verify SNMP messages are authenticated\nusing a FIPS-validated Keyed-Hash\
    \ Message Authentication Code (HMAC).\nBy default, SNMP is disabled. If used, verify SNMPv3 is configured (minimally)\
    \ for\nauthentication-sha. Although HMAC-MD5-96 is supported as required by RFC, Junos\nalso supports HMAC-SHA, HMAC-SHA224/256/384/512.\
    \ Configure the strongest\nHMAC supported by both the Juniper device and the Network Management System\n(NMS).\n[edit\
    \ snmp v3]\nusm {\n local-engine {\n user <SNMPv3 user> {\n authentication-sha {\n authentication-key \"$8$aes256-gcm$hmac-sha2256$100$2CM/LosUGF4$A...<snip>...rflBKxq/w+jaAVF55Bsc6PA\"\
    ; ## SECRET-DATA\n }\n }\n }\n}\nIf the network device is not configured to authenticate SNMP messages using a FIPSvalidated\
    \ HMAC, this is a finding."
  remediation: 'Configure the network device to authenticate SNMP messages using a FIPS-validated

    Keyed-Hash Message Authentication Code (HMAC).

    set snmp v3 usm local-engine user <SNMPv3 username> authentication-sha

    authentication-password "PSK"'
  checks:
  - type: manual_review
    info: "Review the network device configuration to verify SNMP messages are authenticated\nusing a FIPS-validated Keyed-Hash\
      \ Message Authentication Code (HMAC).\nBy default, SNMP is disabled. If used, verify SNMPv3 is configured (minimally)\
      \ for\nauthentication-sha. Although HMAC-MD5-96 is supported as required by RFC, Junos\nalso supports HMAC-SHA, HMAC-SHA224/256/384/512.\
      \ Configure the strongest\nHMAC supported by both the Juniper device and the Network Management System\n(NMS).\n[edit\
      \ snmp v3]\nusm {\n local-e"
    severity: medium
- id: '1.38'
  title: JUEX-NM-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper EX switch must use an an NTP service that is hosted by a trusted source or a DOD-compliant enterprise
    or local NTP server. GROUP ID: V-253926 RULE ID: SV-253926r961506'
  rationale: 'If a trusted time source is not used, an attacker can introduce a rogue NTP server. This rogue server can then
    be used to send incorrect time information to network devices, which will make log timestamps inaccurate which may hide
    attacks or result in inaccurate forensic analysis. The recommended solution is that the application or endpoint is configured
    to point to an enterprise or site-owned time server that is DOD-compliant (instead of directly to an NTP source as implied
    by the current wording of the requirement). Most products are unable to meet the requirement, but DISA can mitigate the
    risk by using a trusted time source. So the requirement should state that NTPS is used with USNO NTP as an alternative
    mitigation for this to be marked as Not a Finding. More information can be found at: https://www.cnmoc.usff.navy.mil/OurCommands/United-States-Naval-Observatory/Precise-Time-Department/Network-TimeProtocol-NTP/DoD-Customer-Servers/
    DOD users should not use tick, tock, or ntp2. There are also instructions for obtaining authenticated NTP at the site
    listed above.'
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'Review the Juniper EX configuration to determine if it obtains time information from a

    trusted source.

    [edit system ntp]

    authentication-key 1 type sha256 value "PSK"; ## SECRET-DATA

    authentication-key 2 type sha1 value "PSK"; ## SECRET-DATA

    server <address 1> key 1 prefer; ## SECRET-DATA

    server <address 2> key 2; ## SECRET-DATA

    trusted-key [ 1 2 ];

    If the network device does not support FIPS-validated algorithms, verify the network

    device configuration to determine NTP endpoints are authenticated before establishing

    the local, remote, or network connection using cryptographically based algorithms.

    [edit system ntp]

    authentication-key 3 type md5 value "PSK"; ## SECRET-DATA

    server <address 3> key 3; ## SECRET-DATA

    trusted-key [ 1 2 3 ];

    If the Juniper EX switch is not configured to use an NTP service that is hosted by a

    trusted source or a DOD-compliant enterprise or local NTP server, this is a finding.'
  remediation: 'Configure the network device to authenticate Network Time Protocol sources using

    FIPS-validated algorithms.

    set system ntp authentication-key 1 type sha256

    set system ntp authentication-key 1 value "PSK"

    set system ntp authentication-key 2 type sha1

    set system ntp authentication-key 2 value "PSK"

    set system ntp server <address 1> key 1

    set system ntp server <address 1> prefer

    set system ntp server <address 2> key 2

    set system ntp trusted-key 1

    set system ntp trusted-key 2

    If the network device does not support FIPS-validated algorithms, configure NTP

    authentication using cryptographically based algorithms.

    set system ntp authentication-key 3 type md5

    set system ntp authentication-key 3 value "PSK"

    set system ntp server <address 3> key 3

    set system ntp trusted-key 3'
  checks:
  - type: manual_review
    info: 'Review the Juniper EX configuration to determine if it obtains time information from a

      trusted source.

      [edit system ntp]

      authentication-key 1 type sha256 value "PSK"; ## SECRET-DATA

      authentication-key 2 type sha1 value "PSK"; ## SECRET-DATA

      server <address 1> key 1 prefer; ## SECRET-DATA

      server <address 2> key 2; ## SECRET-DATA

      trusted-key [ 1 2 ];

      If the network device does not support FIPS-validated algorithms, verify the network

      device configuration to determine NTP endpoints are authenticate'
    severity: medium
- id: '1.39'
  title: JUEX-NM-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to prohibit the use of cached authenticators after an organization-defined
    time period. GROUP ID: V-253927 RULE ID: SV-253927r961521'
  rationale: Some authentication implementations can be configured to use cached authenticators. If cached authentication
    information is out-of-date, the validity of the authentication information may be questionable. The organization-defined
    time period should be established for each device depending on the nature of the device; for example, a device with just
    a few administrators in a facility with spotty network connectivity may merit a longer caching time period than a device
    with many administrators.
  impact: ''
  references: []
  page_start: 107
  audit_raw: "Review the network device configuration to determine if the network device or its\nassociated authentication\
    \ server prohibits the use of cached authenticators after an\norganization-defined time period.\nVerify idle-timeouts,\
    \ SSH keepalive messages, and SSH rekey are configured to meet\nthe requirements of the target network.\n[edit system]\n\
    login {\n idle-timeout 10;\n}\nsystem {\n services {\n ssh {\n protocol-version v2;\n client-alive-count-max (0..255);\n\
    \ client-alive-interval (0..65535 seconds);\n rekey {\n data-limit (51200..4294967295 bytes);\n time-limit (1..1440 minutes);\n\
    \ }\n }\n }\n}\nFor externally authenticated accounts, verify the external authentication server enforces\nappropriate\
    \ authenticator timeouts.\nIf cached authenticators are used after an organization-defined time period, this is a\nfinding."
  remediation: 'Configure the network device or its associated authentication server to prohibit the use

