      require assignment of the required permission bit to execute. For example, audit logs

      are configured in the [edit system] hierarchy and req'
- id: '1.16'
  title: JUEX-NM-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to limit privileges to change the software resident within software
    libraries. GROUP ID: V-253899 RULE ID: SV-253899r960960'
  rationale: Changes to any software components of the network device can have significant effects on the overall security
    of the network. Therefore, only qualified and authorized individuals should be allowed administrative access to the network
    device for implementing any changes or upgrades. If the network device were to enable nonauthorized users to make changes
    to software libraries, those changes could be implemented without undergoing testing, validation, and approval.
  impact: ''
  references: []
  page_start: 53
  audit_raw: "Determine if the network device limits privileges to change the software resident within\nsoftware libraries.\n\
    Juniper switches use role-based access controls (RBAC) to assign privilege levels.\nAccount definitions in Junos are either\
    \ \"local\" or \"template\", discriminated by the\npresence of an authentication stanza. Local accounts have an authentication\
    \ stanza\nand support both external and local authentication. Template accounts do not have an\nauthentication stanza\
    \ and only support external authentication. Every account (local and\ntemplate) must be assigned a login class by an authorized\
    \ administrator.\nInstallation of firmware requires the maintenance permission bit. However, even with\nthat bit set,\
    \ software installation can be limited by the \"deny-commands\" statement\n(e.g., deny-commands \"^request system software\"\
    ). The command takes a regular\nexpression (REGEX) enclosed in double quotes (\").\nVerify each account is assigned a\
    \ login class with appropriate permissions based upon\norganizational requirements. Login classes support optional allow-\
    \ and deny- directives\nas shown in the examples. Organizational requirements may require different allow- and\ndeny-\
    \ directives or no directives at all.\n[edit system login]\nclass <name> {\n idle-timeout 10;\n permissions all;\n deny-commands\
    \ \"^clear (log|security log)|^(clear|show) security alarms\nalarm-type idp|^request (security|system set-encryption-key|system\
    \ firmware\nupgrade re|system decrypt)|^rollback\";\n deny-configuration-regexps [ \"security alarms potential-violation\
    \ idp\"\n\"security (ike|ipsec) (policy|proposal)\" \"security ipsec ^vpn$ .* manual\n(authentication|encryption|protocol|spi)\"\
    \ \"security log\" \"system fips selftest after-key-generation\" \"system (archival|syslog|rootauthentication|authentication-order|master-password)\"\
    \ \"system services ssh\n(protocol-version|root-login)\" \"system login password\" \"system login user [azA-Z0-9_-]+ (authentication|class)\"\
    \ \"system login class [a-zA-Z0-9_-]+\n(permissions|deny-|allow-)\" ];\n}\nclass <name-1> {\n idle-timeout 10;\n permissions\
    \ [ configure maintenance security system-control trace\nview-configuration ];\n allow-commands \"^clear (log|security\
    \ log)|^show cli authorization\";\n deny-commands \"^clear (security alarms|system login lockout)|^file\n(copy|delete|list|rename|show)|^request\
    \ (security|system set-encryptionkey|system firmware upgrade re)|^rollback|^set date|^show security\n(alarms|dynamic-policies|match-policies|policies)|^start\
    \ shell|^request\nsystem (decrypt|halt|reboot|software|zeroize)\";\n deny-configuration-regexps [ \"system (login|internetoptions|scripts|services|time-zone|^[a-r]+)\"\
    \ \"security services eventoptions\" ];\n security-role audit-administrator;\n}\nExample local and template accounts:\n\
    user <account of last resort> {\n uid 2000;\n class <name>;\n authentication {\n encrypted-password \"$6$HEQnJP/W$/QD...<snip>...5r./\"\
    ; ##\nSECRET-DATA\n }\n}\nuser <account name> {\n uid 2015;\n class <name-1>;\n}\nNote: Accounts without an authentication\
    \ stanza are template accounts, must be\nexternally authenticated, and cannot log in locally.\nIf it does not limit privileges\
    \ to change the software resident within software libraries,\nthis is a finding."
  remediation: 'Configure the network device to limit privileges to change the software resident within

    software libraries.

    set system login class <name> permissions <permission sets or ''all''>

    set system login class <name> deny-commands <appropriate commands to deny>

    set system login class <name> deny-configuration-regexps <appropriate

    configuration hierarchy to deny>

    set system login user <account name> class <name>'
  checks:
  - type: sql
    command: show cli authorization";
    severity: medium
    info: 'Determine if the network device limits privileges to change the software resident within

      software libraries.

      Juniper switches use role-based access controls (RBAC) to assign privilege levels.

      Account definitions in Junos are either "local" or "template", discriminated by the

      presence of an authentication stanza. Local accounts have an authentication stanza

      and support both external and local authe'
- id: '1.17'
  title: JUEX-NM-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to prohibit the use of all unnecessary and/or nonsecure functions,
    ports, protocols, and/or services. GROUP ID: V-253900 RULE ID: SV-253900r1043177'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable unused or unnecessary physical and logical
    ports/protocols on information systems. Network devices are capable of providing a wide variety of functions and services.
    Some of the functions and services provided by default may not be necessary to support essential organizational operations.
    Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email and web services);
    however, doing so increases risk over limiting the services provided by any one component. To support the requirements
    and principles of least functionality, the network device must support the organizational requirements providing only
    essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and
    approved. Some network devices have capabilities enabled by default; if these capabilities are not necessary, they must
    be disabled. If a particular capability is used, then it must be documented and approved.
  impact: ''
  references: []
  page_start: 56
  audit_raw: 'Determine if the network device prohibits the use of all unnecessary and/or nonsecure

    functions, ports, protocols, and/or services.

    Verify unnecessary or nonsecure functions are not configured or are explicitly disabled.

    For example, FTP and Telnet are nonsecure. Verify these services are not enabled as

    in the example below:

    [edit system services]

    ftp;

    telnet;

    If any unnecessary or nonsecure functions are permitted, this is a finding.'
  remediation: 'Configure the network device to prohibit the use of all unnecessary and/or nonsecure

    functions, ports, protocols, and/or services.

    delete system services ftp

    delete system services telnet

    delete system services web-management

    Note: Delete other configured but unnecessary system services.'
  checks:
  - type: manual_review
    info: 'Determine if the network device prohibits the use of all unnecessary and/or nonsecure

      functions, ports, protocols, and/or services.

      Verify unnecessary or nonsecure functions are not configured or are explicitly disabled.

      For example, FTP and Telnet are nonsecure. Verify these services are not enabled as

      in the example below:

      [edit system services]

      ftp;

      telnet;

      If any unnecessary or nonsecure functions are permitted, this is a finding.'
    severity: medium
- id: '1.18'
  title: JUEX-NM-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured with only one local account to be used as the account of last resort
    in the event the authentication server is unavailable. GROUP ID: V-253901 RULE ID: SV-253901r1082953'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    is created on the device's local database for use when the authentication server is down or connectivity between the device
    and the authentication server is not operable. This account is referred to as the account of last resort since it is intended
    to be used as a last resort and when immediate administrative access is absolutely necessary. The account of last resort
    logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically audited to verify
    the envelope remains sealed. The signature of the auditor and the date of the audit must be added to the envelope as a
    record. Administrators must secure the credentials and disable access to the root account (if possible) when not needed
    for system administration functions. Junos does not have default passwords, and the root account cannot be renamed or
    disabled. The root account password must be saved in the same manner as the account of last resort.
  impact: ''
  references: []
  page_start: 58
  audit_raw: "1. Review the Juniper EX configuration to determine if an account of last resort is\nconfigured.\n2. Verify\
    \ the username and password for the root account, and the account of last\nresort is contained within sealed envelopes\
    \ and kept in a safe.\n3. Junos categorizes user accounts as \"local\" or \"template\", with the difference\nbeing the\
    \ presence of an authentication stanza. Accounts with an authentication\nstanza are local because the administrator can\
    \ log in without the need for an\nexternal AAA service. Accounts without an authentication stanza are templates\nthat\
    \ require external authentication. Verify only authorized account(s) have an\nauthentication stanza.\nuser@host> show\
    \ configuration system login\n...\nuser <name> {\n... <<< No authentication stanza for externally authenticated accounts\n\
    }\nuser <account of last resort username> {\n...\n authentication {\n encrypted-password <password hash>;\n }\n}\nThe\
    \ authentication order must be configured to prefer external AAA, and \"password\"\nauthentication can be omitted if required.\
    \ If \"password\" is present, Junos will attempt\npassword authentication upon external AAA authentication failure. This\
    \ feature is useful\nif the account of last resort is required while external AAA remains reachable but is\nmisconfigured\
    \ and prevents successful logon. If \"password\" is not present, Junos will\nnot fail over to local authentication unless\
    \ there is a loss of connectivity with the external\nAAA service (e.g., timeout).\nVerify the authentication order prefers\
    \ external AAA (first in the order).\nuser@host> show configuration system authentication-order\nauthentication-order\
    \ [ <external AAA> password ]\n--or--\nauthentication-order <external AAA>;\nVerify that direct root logon is disabled.\n\
    user@host> show configuration system services ssh\n<<< missing root-login directive inherits the default 'deny'\nprotocol-version\
    \ v2;\n...<snip>...\n--or--\nroot-login deny;\n...<snip>...\nIf one local account does not exist for use as the account\
    \ of last resort, this is a finding."
  remediation: 'Configure the Juniper EX to only allow one local account for use as the account of last

    resort.

    1. Enter configuration mode.

    2. Configure the authorized account with an authentication stanza.

    3. Configure the authentication order to prefer external AAA.

    4. Configure SSH to deny root login.

    5. Commit the configuration.

    user@host> configure

    user@host# set system login user <account of last resort username>

    authentication plain-text-password

    New password: <PW not echoed to screen>

    Retype new password: <PW confirmation not echoed to screen>

    user@host# delete system login user <not account of last resort username>

    authentication

    user@host# delete system services ssh root-login

    --or--

    user@host# set system services ssh root-login deny

    user@host# set system authentication-order [ <external AAA> password ]

    --or--

    user@host# set system authentication-order <external AAA>

    user@host# commit'
  checks:
  - type: sql
    command: show configuration system login
    severity: medium
    info: '1. Review the Juniper EX configuration to determine if an account of last resort is

      configured.

      2. Verify the username and password for the root account, and the account of last

      resort is contained within sealed envelopes and kept in a safe.

      3. Junos categorizes user accounts as "local" or "template", with the difference

      being the presence of an authentication stanza. Accounts with an authenticati'
- id: '1.19'
  title: JUEX-NM-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to implement replay-resistant authentication mechanisms for network
    access to privileged accounts. GROUP ID: V-253903 RULE ID: SV-253903r960993'
  rationale: A replay attack may enable an unauthorized user to gain access to the application. Authentication sessions between
    the authenticator and the application validating the user credentials must not be vulnerable to a replay attack. An authentication
    process resists replay attacks if it is impractical to achieve a successful authentication by recording and replaying
    a previous authentication message. Techniques used to address this include protocols using nonces (e.g., numbers generated
    for a specific one-time use) or challenges (e.g., TLS, WS_Security). Additional techniques include time-synchronous or
    challenge-response one-time authenticators.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Determine if the network device implements replay-resistant authentication mechanisms

    for network access to privileged accounts. This requirement may be verified by

    demonstration, configuration review, or validated test results. This requirement may be

    met through use of a properly configured authentication server if the device is

    configured to use the authentication server.

    Verify SSH version 2 is configured for network (remote) access to privileged accounts.

    [edit system services ssh]

    protocol-version v2;

    If the network device does not implement replay-resistant authentication mechanisms

    for network access to privileged accounts, this is a finding.'
  remediation: 'Configure the network device to implement replay-resistant authentication mechanisms

    for network access to privileged accounts.

    set system services ssh protocol-version v2'
  checks:
  - type: manual_review
    info: 'Determine if the network device implements replay-resistant authentication mechanisms

      for network access to privileged accounts. This requirement may be verified by

      demonstration, configuration review, or validated test results. This requirement may be

      met through use of a properly configured authentication server if the device is

      configured to use the authentication server.

      Verify SSH version 2 is configured for network (remote) access to privileged accounts.

      [edit system services ssh]

      protocol'
    severity: medium
- id: '1.20'
  title: JUEX-NM-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enforce a minimum 15-character password length. GROUP ID: V-253904
    RULE ID: SV-253904r1018762'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Determine if the network device or its associated authentication server enforces a

    minimum 15-character password length. This requirement may be verified by

    demonstration or configuration review.

    [edit system login password]

    :

    minimum-length 15;

    :

    If the network device or its associated authentication server does not enforce a

    minimum 15-character password length, this is a finding.'
  remediation: 'Configure the network device or its associated authentication server to enforce a

    minimum 15-character password length.

    set system login password minimum-length 15'
  checks:
