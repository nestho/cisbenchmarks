- id: '1.42'
  title: JUEX-NM-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to protect against known types of denial-ofservice (DoS) attacks
    by employing organization-defined security safeguards. GROUP ID: V-253930 RULE ID: SV-253930r961620'
  rationale: DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization
    either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses the configuration
    of network devices to mitigate the impact of DoS attacks that have occurred or are ongoing on device availability. For
    each network device, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or restricting
    the number of sessions the device opens at one time). Employing increased capacity and bandwidth, combined with service
    redundancy, may reduce the susceptibility to some DoS attacks. The security safeguards cannot be defined at the DoD-level
    because they vary according to the capabilities of the individual network devices and the security controls applied on
    the adjacent networks (for example, firewalls performing packet filtering to block DoS attacks).
  impact: ''
  references: []
  page_start: 115
  audit_raw: "Determine if the network device protects against or limits the effects of all known types\nof DoS attacks by\
    \ employing organization-defined security safeguards.\nVerify session and (if supported) rate limits for management connections.\n\
    SSH example:\n[edit system services ssh]\nconnection-limit <1..250>;\nrate-limit <1..250>;\nNote: The SSH connection-\
    \ and rate-limit directives affect secure file transfer protocols\nlike SCP and SFTP.\nNETCONF over SSH example:\n[edit\
    \ system services netconf]\nssh {\n connection-limit <1..250>;\n rate-limit <1..250>;\n}\nNote: Rate limiting is the permissible\
    \ number of connections per one minute interval.\nVerify policers (rate limiters) are appropriately applied to limit traffic;\
    \ for example, to limit\nSSH connection attempts:\n[edit firewall]\nfamily inet {\n filter <filter name> {\n term 1 {\n\
    \ from {\n destination-address {\n <device OOBM or loopback address>;\n }\n source-prefix-list {\n <management address\
    \ list name>;\n }\n protocol tcp;\n destination-port 22;\n tcp-initial;\n }\n then {\n policer policer-32k;\n syslog;\n\
    \ accept;\n }\n }\n term 2 {\n from {\n destination-address {\n <device OOBM or loopback address>;\n }\n source-prefix-list\
    \ {\n <management address list name>;\n }\n protocol tcp;\n destination-port 22;\n }\n then {\n syslog;\n accept;\n }\n\
    \ }\n term default {\n then {\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter <filter name-1> {\n term 1\
    \ {\n from {\n destination-address {\n <device OOBM or loopback address>;\n }\n source-prefix-list {\n <management address\
    \ list name-1>;\n }\n next-header tcp;\n destination-port 22;\n tcp-initial;\n }\n then {\n policer policer-32k;\n syslog;\n\
    \ accept;\n }\n }\n term 2 {\n from {\n destination-address {\n <device OOBM or loopback address>;\n }\n source-prefix-list\
    \ {\n <management address list name-1>;\n }\n next-header tcp;\n destination-port 22;\n }\n then {\n syslog;\n accept;\n\
    \ }\n }\n term default {\n then {\n syslog;\n discard;\n }\n }\n }\n}\nNote: Additional terms will be required for other\
    \ services like SNMP.\npolicer policer-32k {\n if-exceeding {\n bandwidth-limit 32k;\n burst-size-limit 1500;\n }\n then\
    \ discard;\n}\n[edit interfaces]\n<OOBM interface> {\n unit 0 {\n family inet {\n filter {\n input <filter name>;\n }\n\
    \ address <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n input <filter name-1>;\n }\n address <IPv6 address>/<prefix>;\n\
    \ }\n }\n}\nNote: Although the example filter is shown applied to the management interface, the\nfilter can be also be\
    \ applied to the loopback interface. If applying to loopback, ensure\nthe filter terms account for all traffic, services,\
    \ and protocols that must reach the routing\nengine (e.g., OSPF, BGP, SNMP, etc.).\nIf the network device does not protect\
    \ against or limit the effects of all known types of\nDoS attacks by employing organization-defined security safeguards,\
    \ this is a finding."
  remediation: 'Configure the network device to protect against or limit the effects of all known types of

    DoS attacks by employing organization-defined security safeguards.

    SSH example:

    set system services ssh connection-limit <1..250>

    set system services ssh rate-limit <1..250>

    NETCONF over SSH example:

    set system services netconf ssh connection-limit <1..250>

    set system services netconf ssh rate-limit <1..250>

    Example firewall filters:

    set firewall family inet filter <filter name> term 1 from destination-address

    <device OOBM or loopback address>

    set firewall family inet filter <filter name> term 1 from source-prefix-list

    <management address list name>

    set firewall family inet filter <filter name> term 1 from protocol tcp

    set firewall family inet filter <filter name> term 1 from destination-port 22

    set firewall family inet filter <filter name> term 1 from tcp-initial

    set firewall family inet filter <filter name> term 1 then policer policer-32k

    set firewall family inet filter <filter name> term 1 then syslog

    set firewall family inet filter <filter name> term 1 then accept

    set firewall family inet filter <filter name> term 2 from destination-address

    <device OOBM or loopback address>

    set firewall family inet filter <filter name> term 2 from source-prefix-list

    <management address list name>

    set firewall family inet filter <filter name> term 2 from protocol tcp

    set firewall family inet filter <filter name> term 2 from destination-port 22

    set firewall family inet filter <filter name> term 2 then syslog

    set firewall family inet filter <filter name> term 2 then accept

    set firewall family inet filter <filter name> term default then syslog

