- id: '1.43'
  title: JUEX-NM-000560
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to generate audit records when successful/unsuccessful logon attempts
    occur. GROUP ID: V-253933 RULE ID: SV-253933r961824'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the network device (e.g., module or policy filter).
  impact: ''
  references: []
  page_start: 122
  audit_raw: "Determine if the network device generates audit records when successful/unsuccessful\nlogon attempts occur.\n\
    Junos logs all logon attempts via the \"authorization\" syslog facility (or facility \"any\").\nVerify logging level \"\
    any info\" or \"authorization info\" is configured.\n[edit system syslog]\nfile <file name> {\n authorization info;\n\
    }\nhost <external syslog address> {\n any info;\n}\ntime-format year millisecond;\nSyslog outputs in standard format unless\
    \ the \"structured-data\" directive is configured.\nVerify the \"structured-data\" command for all files and external\
    \ syslog servers requiring\nthat format. For example:\n[edit system syslog]\nhost <syslog address> {\n authorization info;\n\
    \ structured-data;\n}\nfile <file name> {\n any info;\n structured-data;\n}\nIf it does not generate audit records when\
    \ successful/unsuccessful logon attempts\noccur, this is a finding."
  remediation: 'Configure the network device to generate audit records when successful/unsuccessful

    logon attempts occur.

    set system syslog file <file name> any info

    set system syslog file <file name> structured-data << (Optional) Only if

    structured data format is required

    set system syslog host <external syslog address> authorization info

    set system syslog host <external syslog address> structured-data <<

    (Optional) Only if structured data format is required

    set system syslog time-format <(year|millisecond)>'
  checks:
  - type: manual_review
    info: "Determine if the network device generates audit records when successful/unsuccessful\nlogon attempts occur.\nJunos\
      \ logs all logon attempts via the \"authorization\" syslog facility (or facility \"any\").\nVerify logging level \"\
      any info\" or \"authorization info\" is configured.\n[edit system syslog]\nfile <file name> {\n authorization info;\n\
      }\nhost <external syslog address> {\n any info;\n}\ntime-format year millisecond;\nSyslog outputs in standard format\
      \ unless the \"structured-data\" directive is configured.\nVeri"
