    :

    minimum-upper-cases 1;

    :

    If the network device and associated authentication server does not require that at least

    one uppercase character be used in each password, this is a finding.'
  remediation: 'Configure the network device and associated authentication server to enforce password

    complexity by requiring that at least one uppercase character be used.

