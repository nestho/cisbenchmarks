- id: '5.5'
  title: (L1) Ensure Normal Lockdown mode is enabled
  scoring: scored
  profile:
  - Level 1
  description: 'Enabling lockdown mode disables direct local access to an ESXi host, requiring the host be managed remotely
    from vCenter Server. There are some operations, such as backup and troubleshooting, that require direct access to the
    host. In these cases, lockdown mode can be disabled on a temporary basis for specific hosts as needed, and then re-enabled
    when the task is completed. Note: Lockdown mode does not apply to users who log in using authorized keys. Also, users
    in the DCUI.Access list for each host are allowed to override lockdown mode and log in to the DCUI. By default, the "root"
    user is the only user listed in the DCUI.Access list.'
  rationale: Lockdown mode limits ESXi host access to the vCenter server to ensure the roles and access controls implemented
    in vCenter are always enforced and users cannot bypass them by logging into a host directly. By forcing all interaction
    to occur through vCenter Server, the risk of someone inadvertently attaining elevated privileges or performing tasks that
    are not properly audited is greatly reduced.
  impact: With lockdown mode enabled the host will only be accessible through vCenter preventing 'local' access. 79 | P a
    g e
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-88B24613-E8F9-40D2B838-225F5FF480FF.html
  page_start: 79
  audit_raw: 'To verify lockdown mode is enabled, perform the following from the vSphere web client:

    1. From the vSphere Web Client, select the host.

    2. Select Configure then expand System and select Security Profile.

    3. Verify that Lockdown Mode is set to Normal.

    Alternately, the following PowerCLI command may be used:

    # To check if Lockdown mode is enabled

    Get-VMHost | Select

    Name,@{N="Lockdown";E={$_.Extensiondata.Config.adminDisabled}}'
  remediation: 'To enable lockdown mode, perform the following from the vSphere web client:

    1. From the vSphere Web Client, select the host.

    2. Select Configure then expand System and select Security Profile.

    3. Across from Lockdown Mode click on Edit.

    4. Click the radio button for Normal.

    5. Click OK.

    Alternately, run the following PowerCLI command:

    # Enable lockdown mode for each host

    Get-VMHost | Foreach { $_.EnterLockdownMode() }

    80 | P a g e'
  checks:
  - type: manual_review
    info: 'To verify lockdown mode is enabled, perform the following from the vSphere web client:

