- id: '3.3'
  title: (L1) Ensure remote logging is configured for ESXi hosts
  scoring: scored
  profile:
  - Level 1
  description: By default, ESXI logs are stored on a local scratch volume or ramdisk. To preserve logs, also configure remote
    logging to a central log host for the ESXI hosts.
  rationale: Remote logging to a central log host provides a secure, centralized store for ESXi logs. You can more easily
    monitor all hosts with a single tool. You can also do aggregate analysis and searching to look for such things as coordinated
    attacks on multiple hosts. Logging to a secure, centralized log server helps prevent log tampering and provides a long-term
    audit record.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-9F67DB52-F469-451F-B6C8DAE8D95976E7.html
