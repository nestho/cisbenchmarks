- id: '4.2'
  title: (L1) Ensure passwords are required to be complex
  scoring: manual
  profile:
  - Level 1
  description: ESXi uses the pam_passwdqc.so plug-in to set password strength and complexity. Options include setting minimum
    password length, requiring password characters to come from particular character sets, and restricting the number of consecutive
    failed logon attempts permitted. The settings should enforce the organization's password policies. Note that an uppercase
    character that begins a password does not count toward the number of character classes used, and neither does a number
    that ends a password.
  rationale: 'All passwords for ESXi hosts should be hard to guess to reduce the risk of unauthorized access. Note: ESXi imposes
    no restrictions on the root password. Password strength and complexity rules only apply to non-root users.'
  impact: ''
  references:
  - 1. http://www.openwall.com/passwdqc/README.shtml
  - 2. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-DC96FFDB-F5F2-43EC8C73-05ACDAE6BE43.html
  page_start: 57
  audit_raw: "To confirm password complexity requirements are set, perform the following:\n1. Login to the ESXi shell as a\
    \ user with administrator privileges.\n2. Open /etc/pam.d/passwd.\n3. Locate the following line:\n password requisite\
    \ /lib/security/$ISA/pam_passwdqc.so retry=N\nmin=N0,N1,N2,N3,N4\n4. Confirm N is less than or equal to 5.\n5. Confirm\
    \ N0 is set to disabled.\n6. Confirm N1 is set to disabled.\n7. Confirm N2 is set to disabled.\n8. Confirm N3 is set to\
    \ disabled.\n9. Confirm N4 is set to 14 or greater.\nThe above requires all passwords to be 14 or more characters long\
    \ and comprised of at\nleast one character from four distinct character sets. Additionally, a maximum of 5\nconsecutive\
    \ failed login attempts are permitted.\n57 | P a g e"
  remediation: "To set the password complexity requirements, perform the following:\n1. Login to the ESXi shell as a user\
    \ with administrator privileges.\n2. Open /etc./pam.d/passwd.\n3. Locate the following line:\n password requisite /lib/security/$ISA/pam_passwdqc.so\
    \ retry=N\nmin=N0,N1,N2,N3,N4\n4. Set N to less than or equal to 5.\n5. Set N0 to disabled.\n6. Set N1 to disabled.\n\
    7. Set N2 to disabled.\n8. Set N3 to disabled.\n9. Set N4 to 14 or greater.\nThe above requires all passwords to be 14\
