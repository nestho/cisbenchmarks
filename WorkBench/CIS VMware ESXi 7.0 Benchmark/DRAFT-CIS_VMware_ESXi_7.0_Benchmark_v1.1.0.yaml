- id: '5.11'
  title: (L2) Ensure contents of exposed configuration files have not been modified
  scoring: manual
  profile:
  - Level 2
  description: 'Although most configurations on ESXi are controlled via an API, there are a limited set of configuration files
    that are used directly to govern host behavior. These files are exposed via the vSphere HTTPS-based file transfer API.
    These files should be monitored for modifications. WARNING: Do not attempt to monitor files that are NOT exposed via this
    file transfer API, since this can result in a destabilized system.'
  rationale: Any changes to these files should be correlated with an approved administrative action, such as an authorized
    configuration change. Tampering with these files could enable unauthorized access to the host configuration and virtual
    machines.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'To verify the exposed configuration files have not been modified, perform the following:

    1. Open a web browser.

    2. Find the ESXi configuration files by browsing to https://(hostname)/host (not

    available if MOB is disabled).

    3. Review the contents of those files to confirm no unauthorized modifications have

    been made.

    NOTE: Not all the files listed are modifiable.

    Alternately, the configuration files can also be retrieved using the vCLI or PowerCLI.

    94 | P a g e'
  remediation: 'Restore all modified configuration files to a known good state by restoring backups or

    using other means.

    To help prevent future occurrences, you can back up the host configuration data after

    configuring or reconfiguring an ESXi host. The vicfg-cfgbackup command is available only

    for ESXi hosts; it is not available through a vCenter Server system connection. No

    equivalent ESXCLI command is supported.

    To help identify future occurrences more quickly, implement a procedure to monitor the

    files and their contents over time to ensure they are not improperly modified. Be sure not

    to monitor log files and other files whose content is expected to change regularly due to

    system activity. Also, account for configuration file changes that are due to authorized

    administrative activity.

    Note: Host Profiles may also be used to track configuration changes on the host; however,

    Host Profiles do not track all configuration changes.'
  checks:
  - type: manual_review
    info: 'To verify the exposed configuration files have not been modified, perform the following:

