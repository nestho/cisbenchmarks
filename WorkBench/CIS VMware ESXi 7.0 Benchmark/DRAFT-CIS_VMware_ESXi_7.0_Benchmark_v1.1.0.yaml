- id: '5.7'
  title: (L2) Ensure the SSH authorized_keys file is empty
  scoring: manual
  profile:
  - Level 2
  description: ESXi hosts come with Secure Shell (SSH), which can be configured to authenticate remote users using public
    key authentication. For day-to-day operations, the ESXi host should be in lockdown mode with the SSH service disabled.
    Lockdown mode does not prevent root users from logging in using keys. The presence of a remote user's public key in the
    /etc/ssh/keys-root/authorized_keys file on an ESXi host identifies the user as trusted, meaning the user is granted access
    to the host without providing a password. Disabling authorized_keys access may limit your ability to run unattended remote
    scripts.
  rationale: Keeping the authorized_keys file empty prevents users from circumventing the intended restrictions of lockdown
    mode.
