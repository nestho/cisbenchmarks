- id: '5.6'
  title: (L2) Ensure Strict Lockdown mode is enabled
  scoring: scored
  profile:
  - Level 2
  description: 'Enabling lockdown mode disables direct local access to an ESXi host, requiring the host be managed remotely
    from vCenter Server. There are some operations, such as backup and troubleshooting, that require direct access to the
    host. In these cases, lockdown mode can be disabled on a temporary basis for specific hosts as needed, and then re-enabled
    when the task is completed. Note: Lockdown mode does not apply to users who log in using authorized keys. Also, users
    in the DCUI.Access list for each host are allowed to override lockdown mode and log in to the DCUI. By default, the "root"
    user is the only user listed in the DCUI.Access list.'
  rationale: Lockdown mode limits ESXi host access to the vCenter server to ensure the roles and access controls implemented
    in vCenter are always enforced and users cannot bypass them by logging into a host directly. By forcing all interaction
    to occur through vCenter Server, the risk of someone inadvertently attaining elevated privileges or performing tasks that
    are not properly audited is greatly reduced. Additionally strict lockdown move will disabled DCUI - Disabling DCUI prevents
    all local activity, and thus forces actions to be performed in vCenter Server, where they can be centrally audited and
    monitored.
  impact: With lockdown mode enabled the host will only be accessible through vCenter preventing 'local' access. Disabling
    the DCUI can create a potential "lockout" situation, should the host become isolated from vCenter Server. Recovering from
    a "lockout" scenario requires reinstalling ESXi. Consider leaving DCUI enabled, and instead enable lockdown mode and limit
