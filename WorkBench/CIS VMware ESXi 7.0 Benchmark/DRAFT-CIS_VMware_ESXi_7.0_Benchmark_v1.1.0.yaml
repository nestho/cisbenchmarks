- id: '3.1'
  title: (L1) Ensure a centralized location is configured to collect ESXi host core dumps
  scoring: scored
  profile:
  - Level 1
  description: The VMware vSphere Network Dump Collector service allows for collecting diagnostic information from a host
    that experiences a critical fault. This service provides a centralized location for collecting ESXi host core dumps.
  rationale: When a host crashes, an analysis of the resultant core dump is essential to being able to identify the cause
    of the crash and determine a resolution. Installing a centralized dump collector helps ensure that core files are successfully
    saved and made available in the event an ESXi host should ever panic.
  impact: ''
  references:
  - 1. http://kb.vmware.com/kb/1032051
  page_start: 47
  audit_raw: 'Run the following ESXi shell command to determine if the host is configured as prescribed:

    esxcli system coredump network get'
  remediation: 'To implement the recommended configuration state, run the following ESXi shell

    commands:

    # Configure remote Dump Collector Server

    esxcli system coredump network set -v [VMK#] -i [DUMP_SERVER] -o [PORT]

    # Enable remote Dump Collector

    esxcli system coredump network set -e true

    47 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following ESXi shell command to determine if the host is configured as prescribed:

      esxcli system coredump network get'
    severity: medium
- id: '3.2'
  title: (L1) Ensure persistent logging is configured for all ESXi hosts
  scoring: scored
  profile:
  - Level 1
  description: ESXi can be configured to store log files on an in-memory file system. This occurs when the host's Syslog.global.LogDir
    property is set to a non-persistent location, such as /scratch. When this is done, only a single day's worth of logs are
    stored at any time. Additionally, log files will be reinitialized upon each reboot.
  rationale: Non-persistent logging presents a security risk because user activity logged on the host is only stored temporarily
    and will not be preserved across reboots. This can also complicate auditing and make it harder to monitor events and diagnose
    issues. ESXi host logging should always be configured to a persistent datastore.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-9F67DB52-F469-451F-B6C8DAE8D95976E7.html
  - 2. http://kb.vmware.com/kb/1033696
  page_start: 49
  audit_raw: 'To verify persistent logging is configured properly, perform the following from the vSphere

    web client:

    1. Select the host

    2. Click Configure then expand System then select Advanced System Settings.

    3. Select Edit then enter Syslog.global.LogDir in the filter.

    4. Ensure Syslog.global.logDir field is not empty (null value) or is not set explicitly

    to a non-persistent datastore or a scratch partition.

    If the Syslog.global.logDir parameter is pointing to ''Scratch'' location (i.e. empty (null value)

    or is not set explicitly to a non-persistent datastore or a scratch partition), then ensure that

    the ''ScratchConfig.CurrentScratchLocation'' parameter is also pointing to persistent

    storage.

    Alternatively, the following PowerCLI command may be used:

    # List Syslog.global.logDir for each host

    Get-VMHost | Select Name, @{N="Syslog.global.logDir";E={$_ | GetAdvancedConfiguration Syslog.global.logDir | Select -ExpandProperty
    Values}}

    49 | P a g e'
  remediation: 'To configure persistent logging properly, perform the following from the vSphere web

    client:

    1. Select the host

    2. Click Configure then expand System then select Advanced System Settings.

    3. Select Edit then enter Syslog.global.LogDir in the filter.

    4. Set Syslog.global.logDir to a persistent location specified as [datastorename]

    path_to_file where the path is relative to the datastore. For example, [datastore1]

    /systemlogs.

    5. Click OK.

    Alternatively, run the following PowerCLI command:

    # Set Syslog.global.logDir for each host

    Get-VMHost | Foreach { Set-AdvancedConfiguration -VMHost $_ -Name

    Syslog.global.logDir -Value "<NewLocation>" }'
  checks:
