controls:
- id: '1.1'
  title: (L1) Ensure ESXi is properly patched
  scoring: manual
  profile:
  - Level 1
  description: VMware Lifecycle Manager is a tool which may be utilized to automate patch management for vSphere hosts and
    virtual machines. Creating a baseline for patches is a good way to ensure all hosts are at the same patch level. VMware
    also publishes advisories on security patches and offers a way to subscribe to email alerts for them.
  rationale: By staying up to date on ESXi patches, vulnerabilities in the hypervisor can be mitigated. An educated attacker
    can exploit known vulnerabilities when attempting to attain access or elevate privileges on an ESXi host.
  impact: ESXi servers must be in Maintenance Mode to apply patches. This implies all VMs must be moved or powered off on
    the ESXi server, so the patching process may necessitate having brief outages. 12 | P a g e
  references:
  - 1. https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vspherelifecycle-manager.doc/GUID-74295A37-E8BB-4EB9-BFBA-47B78F0C570D.html
  page_start: 12
  audit_raw: "Verify that the patches are up to date. The following PowerCLI snippet will provide a list of\nall installed\
    \ patches:\nForeach ($VMHost in Get-VMHost ) {\n $EsxCli = Get-EsxCli -VMHost $VMHost -V2\n $EsxCli.software.vib.list.invoke()\
    \ | Select-Object\n@{N=\"VMHost\";E={$VMHost}},*\n}\nYou may also manage updates via VMware Lifecycle Manager located\
    \ under Menu,\nLifecycle Manager."
  remediation: 'Employ a process to keep ESXi hosts up to date with patches in accordance with industry

    standards and internal guidelines. Leverage the VMware Lifecycle Manager to test and

    apply patches as they become available.'
  checks:
  - type: manual_review
    info: "Verify that the patches are up to date. The following PowerCLI snippet will provide a list of\nall installed patches:\n\
      Foreach ($VMHost in Get-VMHost ) {\n $EsxCli = Get-EsxCli -VMHost $VMHost -V2\n $EsxCli.software.vib.list.invoke() |\
      \ Select-Object\n@{N=\"VMHost\";E={$VMHost}},*\n}\nYou may also manage updates via VMware Lifecycle Manager located\
      \ under Menu,\nLifecycle Manager."
    severity: medium
- id: '1.2'
  title: (L1) Ensure the Image Profile VIB acceptance level is configured properly
  scoring: scored
  profile:
  - Level 1
  description: 'A VIB (vSphere Installation Bundle) is a collection of files that are packaged into an archive. The VIB contains
    a signature file that is used to verify the level of trust. The ESXi Image Profile supports four VIB acceptance levels:
    1. VMware Certified - VIBs created, tested, and signed by VMware 2. VMware Accepted - VIBs created by a VMware partner
    but tested and signed by VMware 3. Partner Supported - VIBs created, tested, and signed by a certified VMware partner
    4. Community Supported - VIBs that have not been tested by VMware or a VMware partner'
  rationale: The ESXi Image Profile should only allow signed VIBs because an unsigned VIB represents untested code installed
    on an ESXi host. Also, use of unsigned VIBs will cause hypervisor Secure Boot to fail to configure. Community Supported
    VIBs do not have digital signatures. To protect the security and integrity of your ESXi hosts, do not allow unsigned (CommunitySupported)
    VIBs to be installed on your hosts.
  impact: Unsigned (Community Supported) VIBs will not be able to be utilized on a host. 14 | P a g e
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-52188148-C579-4F6A-8335CFBCE0DD2167.html
  page_start: 14
  audit_raw: "To verify the host image profile acceptance level perform the following:\n1. From the vSphere Web Client, select\
    \ the host.\n2. Click Configure, then under System select Security Profile.\n3. Under Host Image Profile Acceptance Level\
    \ ensure it is set to one of the\nfollowing - \"VMware Certified\", \"VMware Accepted\", or \"Partner Supported\".\nThis\
    \ may also be performed as follows:\n1. Connect to each ESX/ESXi host using the ESXi Shell or vCLI, and execute the\n\
    command esxcli software acceptance get to verify the acceptance level is at\neither \"VMware Certified\", \"VMware Accepted\"\
    , or \"Partner Supported\".\n2. Connect to each ESX/ESXi host using the vCLI, and execute the command esxcli\nsoftware\
    \ vib list to verify the acceptance level for each VIB is either \"VMware\nCertified\", \"VMware Accepted\", or \"Partner\
    \ Supported\".\nAdditionally, the following PowerCLI command may be used:\n# List the Software AcceptanceLevel for each\
    \ host\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $VMHost | Select Name,\n@{N=\"AcceptanceLevel\"\
    ;E={$ESXCli.software.acceptance.get()}}\n}\n# List only the vibs which are not at \"VMwareCertified\" or \"VMwareAccepted\"\
    \nor \"PartnerSupported\" acceptance level\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n\
    \ $ESXCli.software.vib.list() | Where { ($_.AcceptanceLevel -ne\n\"VMwareCertified\") -and ($_.AcceptanceLevel -ne \"\
    VMwareAccepted\") -and\n($_.AcceptanceLevel -ne \"PartnerSupported\") }\n}\n15 | P a g e"
  remediation: "To verify the host image profile acceptance level perform the following:\n1. From the vSphere Web Client,\
    \ select the host.\n2. Click Configure, then under System select Security Profile.\n3. Under Host Image Profile Acceptance\
    \ Level select Edit\n4. In the dropdown select one of the following - VMware Certified, VMware Accepted,\nor Partner Supported.\n\
    To implement the recommended configuration state, run the following PowerCLI command\n(in the example code, the level\
    \ is Partner Supported):\n# Set the Software AcceptanceLevel for each host<span>\nForeach ($VMHost in Get-VMHost ) {\n\
    \ $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.software.acceptance.Set(\"PartnerSupported\")\n}"
  checks:
  - type: manual_review
    info: 'To verify the host image profile acceptance level perform the following:

      1. From the vSphere Web Client, select the host.

      2. Click Configure, then under System select Security Profile.

      3. Under Host Image Profile Acceptance Level ensure it is set to one of the

      following - "VMware Certified", "VMware Accepted", or "Partner Supported".

      This may also be performed as follows:

      1. Connect to each ESX/ESXi host using the ESXi Shell or vCLI, and execute the

      command esxcli software acceptance get to veri'
    severity: medium
- id: '1.3'
  title: (L1) Ensure no unauthorized kernel modules are loaded on the host
  scoring: manual
  profile:
  - Level 1
  description: ESXi hosts by default do not permit the loading of kernel modules that lack valid digital signatures. This
    feature can be overridden, which would allow unauthorized kernel modules to be loaded.
  rationale: VMware provides digital signatures for kernel modules. Untested or malicious kernel modules loaded on the ESXi
    host can put the host at risk for instability and/or exploitation.
  impact: This is the default behavior therefor impact is low to none.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-E9B71B85-FBA3-447C8A60-DEE2AE1A405A.html
  - 2. http://kb.vmware.com/kb/2042473
  page_start: 17
  audit_raw: "To list all the loaded kernel modules from the ESXi Shell or vCLI, run: \"esxcli system\nmodule list\". For\
    \ each module, verify the signature by running: esxcli system module get\n-m <module>.\nAdditionally, the following PowerCLI\
    \ command may be used:\n# List the system modules and Signature Info for each host\nForeach ($VMHost in Get-VMHost ) {\n\
    \ $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.system.module.list() | Foreach {\n $ESXCli.system.module.get($_.Name)\
    \ | Select @{N=\"VMHost\";E={$VMHost}},\nModule, License, Modulefile, Version, SignedStatus, SignatureDigest,\nSignatureFingerPrint\n\
    \ }\n}\n17 | P a g e"
  remediation: 'Secure the host by disabling unsigned modules and removing the offending VIBs from the

    host.

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # To disable a module:

    $ESXCli = Get-EsxCli -VMHost "MyHostName_or_IPaddress"

    $ESXCli.system.module.set($false, $false, "MyModuleName")

    Note: evacuate VMs and place the host into maintenance mode before disabling kernel

    modules.'
  checks:
  - type: manual_review
    info: "To list all the loaded kernel modules from the ESXi Shell or vCLI, run: \"esxcli system\nmodule list\". For each\
      \ module, verify the signature by running: esxcli system module get\n-m <module>.\nAdditionally, the following PowerCLI\
      \ command may be used:\n# List the system modules and Signature Info for each host\nForeach ($VMHost in Get-VMHost )\
      \ {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.system.module.list() | Foreach {\n $ESXCli.system.module.get($_.Name)\
      \ | Select @{N=\"VMHost\";E={$VMHost}},\nModule,"
    severity: medium
- id: '1.4'
  title: (L2) Ensure the default value of individual salt per vm is configured
  scoring: scored
  profile:
  - Level 2
  description: The concept of salting has been introduced to help address concerns system administrators may have over the
    security implications of Transparent Page Sharing otherwise known as TPS. As per the original TPS implementation, multiple
    virtual machines could share pages when the contents of the pages were same. With the new salting settings, the virtual
    machines can share pages only if the salt value and contents of the pages are identical. A new host config option Mem.ShareForceSalting
    is introduced to enable or disable salting. By default, salting is enabled (Mem.ShareForceSalting=2) and each virtual
    machine has a different salt. This means page sharing does not occur across the virtual machines (interVM TPS) and only
    happens inside a virtual machine (intra VM).
  rationale: Intra-VM means that TPS will de-duplicate identical pages of memory within a virtual machine, but will not share
    the pages with any other virtual machines. Ensuring the default setting is in place so that page sharing only occurs inside
    a virtual machine is the best option here.
  impact: There is potential in a performance impact regarding this setting, each environment and the impact on it will vary.
    19 | P a g e
  references:
  - 1. https://kb.vmware.com/s/article/2097593
  - 2. https://blogs.vmware.com/vsphere/2015/01/assess-the-performance-impact-ofthe-security-change-in-transparent-page-sharing-behaviour.html
  page_start: 19
  audit_raw: 'From the vSphere Web Client:

    1. Select a host

    2. Click Configure then expand System then select Advanced System settings.

    3. Click Edit then Filter for Mem.ShareForceSalting.

    4. Verify that it is set to 2.

    Additionally the following PowerCLI command can be used:

    Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting'
  remediation: 'From the vSphere Web Client:

    1. Select a host

    2. Click Configure then expand System then select Advanced System settings.

    3. Click Edit then Filter for Mem.ShareForceSalting.

    4. Set the value to 2.

    5. Click OK.

    Additionally, the following PowerCLI command can be used:

    Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting | SetAdvancedSetting -Value 2

    20 | P a g e'
  checks:
  - type: manual_review
    info: 'From the vSphere Web Client:

      1. Select a host

      2. Click Configure then expand System then select Advanced System settings.

      3. Click Edit then Filter for Mem.ShareForceSalting.

      4. Verify that it is set to 2.

      Additionally the following PowerCLI command can be used:

      Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting'
    severity: medium
- id: '2.1'
  title: (L1) Ensure NTP time synchronization is configured properly
  scoring: scored
  profile:
  - Level 1
  description: Network Time Protocol (NTP) synchronization should be configured correctly and enabled on each VMware ESXi
    host to ensure accurate time for system event logs. The time sources used by the ESXi hosts should be in sync with an
    agreed-upon time standard such as Coordinated Universal Time (UTC). There should be at minimum two NTP sources in place,
    and they should sync whenever possible.
  rationale: By ensuring that all systems use the same relative time source (including the relevant localization offset),
    and that the relative time source can be correlated to an agreed-upon time standard, it is simpler to track and correlate
    an intruder's actions when reviewing the relevant log files. Incorrect time settings can also make auditing inaccurate.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-2553C86E-7981-4F79-B9FCA6CECA52F6CC.html
  page_start: 22
  audit_raw: 'To confirm NTP synchronization is enabled and properly configured, perform the following

    from the vSphere Web Client:

    1. Select a host

    2. Click Configure then expand System then select Time Configuration.

    3. Verify that Time Synchronization is set to Automatic

    4. Verify that the NTP Client is set to Enabled

    5. Verify that the NTP Service Status is Running

    6. Verify that appropriate NTP servers are set.

    Additionally, the following PowerCLI command may be used:

    # List the NTP Settings for all hosts

    Get-VMHost | Select Name, @{N="NTPSetting";E={$_ | Get-VMHostNtpServer}}

    22 | P a g e'
  remediation: 'To enable and properly configure NTP synchronization, perform the following from the

    vSphere web client:

    1. Select a host

    2. Click Configure then expand System then select Time Configuration.

    3. Select Edit next to Network Time Protocol

    4. Select the Enable box, then fill in the appropriate NTP Servers.

    5. in the NTP Service Startup Policy drop down select Start and stop with host.

    6. Click OK.

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # Set the NTP Settings for all hosts

    # If an internal NTP server is used, replace pool.ntp.org with

    # the IP address or the Fully Qualified Domain Name (FQDN) of the internal

    NTP server

    $NTPServers = "pool.ntp.org", "pool2.ntp.org"

    Get-VMHost | Add-VmHostNtpServer $NTPServers'
  checks:
  - type: manual_review
    info: 'To confirm NTP synchronization is enabled and properly configured, perform the following

      from the vSphere Web Client:

      1. Select a host

      2. Click Configure then expand System then select Time Configuration.

      3. Verify that Time Synchronization is set to Automatic

      4. Verify that the NTP Client is set to Enabled

      5. Verify that the NTP Service Status is Running

      6. Verify that appropriate NTP servers are set.

      Additionally, the following PowerCLI command may be used:

      # List the NTP Settings for all host'
    severity: medium
- id: '2.2'
  title: (L1) Ensure the ESXi host firewall is configured to restrict access to services running on the host
  scoring: scored
  profile:
  - Level 1
  description: The ESXi firewall is enabled by default and allows ping (ICMP) and communication with DHCP/DNS clients. Access
    to services should only be allowed by authorized IP addresses/networks.
  rationale: Unrestricted access to services running on an ESXi host can expose a host to outside attacks and unauthorized
    access. Reduce the risk by configuring the ESXi firewall to only allow access from authorized IP addresses and networks.
  impact: Connections from IP addresses and ranges that are not explicitly set will be denied. Take care to ensure appropriate
    IPs/IP address ranges are allowed. 25 | P a g e
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-8912DD42-C6EA-42999B10-5F3AEA52C605.html
  page_start: 25
  audit_raw: 'To confirm access to services running on an ESXi host is properly restricted, perform the

    following from the vSphere web client:

    1. Select a host

    2. Click Configure then expand System then select Firewall.

    3. Click Edit to view services which are enabled (indicated by a check).

    4. For each enabled service, (e.g., ssh, vSphere Web Access, http client) check to ensure

    that the list of allowed IP addresses specified is correct.

    Additionally, the following PowerCLI command may be used:

    # List all services for a host

    Get-VMHost HOST1 | Get-VMHostService

    # List the services which are enabled and have rules defined for specific IP

    ranges to access the service

    Get-VMHost HOST1 | Get-VMHostFirewallException | Where {$_.Enabled -and (-not

    $_.ExtensionData.AllowedHosts.AllIP)}

    # List the services which are enabled and do not have rules defined for

    specific IP ranges to access the service

    Get-VMHost HOST1 | Get-VMHostFirewallException | Where {$_.Enabled -and

    ($_.ExtensionData.AllowedHosts.AllIP)}'
  remediation: 'To properly restrict access to services running on an ESXi host, perform the following from

    the vSphere web client:

    1. Select a host

    2. Click Configure then expand System then select Firewall.

    3. Click Edit to view services which are enabled (indicated by a check).

    4. For each enabled service, (e.g., ssh, vSphere Web Access, http client) provide a list of

    allowed IP addresses.

    5. Click OK.'
  checks:
  - type: manual_review
    info: 'To confirm access to services running on an ESXi host is properly restricted, perform the

      following from the vSphere web client:

      1. Select a host

      2. Click Configure then expand System then select Firewall.

      3. Click Edit to view services which are enabled (indicated by a check).

      4. For each enabled service, (e.g., ssh, vSphere Web Access, http client) check to ensure

      that the list of allowed IP addresses specified is correct.

      Additionally, the following PowerCLI command may be used:

      # List all se'
    severity: medium
- id: '2.3'
  title: (L1) Ensure Managed Object Browser (MOB) is disabled
  scoring: scored
  profile:
  - Level 1
  description: The Managed Object Browser (MOB) is a web-based server application that lets you examine objects that exist
    on the server side, explore the object model used by the VM kernel to manage the host, and change configurations. It is
    installed and started automatically when vCenter is installed.
  rationale: The MOB is meant to be used primarily for debugging the vSphere SDK. Because there are no access controls, the
    MOB could also be used as a method to obtain information about a host being targeted for unauthorized access.
  impact: Some third-party tools may utilize the Managed Object Browser (MOB) meaning that disabling it will cause those tools
    to malfunction.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-0EF83EA7-277C-400BB697-04BDC9173EA3.html
  page_start: 28
  audit_raw: 'To confirm whether MOB is enabled, perform the following from the vSphere Web Client:

    1. Select a host

    2. Click Configure then expand System then select Advanced System Settings.

    3. Click Edit then search for Config.HostAgent.plugins.solo.enableMob

    4. Verify the value is set to false.

    To determine if the MOB is enabled, run the following command from the ESXi shell:

    vim-cmd proxysvc/service_list

    Additionally, the following PowerCLI command may be used:

    Get-VMHost | Get-AdvancedSetting -Name

    Config.HostAgent.plugins.solo.enableMob

    28 | P a g e'
  remediation: 'To disabled MOB, perform the following from the vSphere Web Client:

    1. Select a host

    2. Click Configure then expand System then select Advanced System Settings.

    3. Click Edit then search for Config.HostAgent.plugins.solo.enableMob

    4. Set the value to false.

    5. Click OK.

    Note: You cannot disable the MOB while a host is in lockdown mode.

    Note 2: You must disable MOB from the vSphere interface not via the vim-cmd command.'
  checks:
  - type: manual_review
    info: 'To confirm whether MOB is enabled, perform the following from the vSphere Web Client:

      1. Select a host

      2. Click Configure then expand System then select Advanced System Settings.

      3. Click Edit then search for Config.HostAgent.plugins.solo.enableMob

      4. Verify the value is set to false.

      To determine if the MOB is enabled, run the following command from the ESXi shell:

      vim-cmd proxysvc/service_list

      Additionally, the following PowerCLI command may be used:

      Get-VMHost | Get-AdvancedSetting -Name

      Conf'
    severity: medium
- id: '2.4'
  title: (L2) Ensure default self-signed certificate for ESXi communication is not used
  scoring: manual
  profile:
  - Level 2
  description: The default certificate is self-signed, not signed by a trusted certificate authority (CA). It should be replaced
    with a valid certificate issued by a trusted CA. It should be noted that certificates are generated at time of install
    differing slightly from some self-signed certificate solutions.
  rationale: Using the default self-signed certificate may increase risk related to man-in-the-middle (MITM) attacks.
  impact: Replacing the default certificate might cause vCenter Server to stop managing the host. Disconnect and reconnect
    the host if vCenter Server cannot verify the new certificate.
  references:
  - 1. https://kb.vmware.com/s/article/2111219
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-AC7E6DD7-F984-4E0F983A-463031BA5FE7.html
  page_start: 31
  audit_raw: 'View the details of the SSL certificate presented by the ESXi host and determine if it is

    issued by a trusted CA:

    1. Log in to the ESXi Shell, either directly from the DCUI or from an SSH client, as a user

    with administrator privileges.

    2. Review the contents to see if the certs have been backed up.

    3. In the directory /etc/vmware/ssl, confirm that it contains orig.rui.crt and

    orig.rui.key

    4. In the directory /etc/vmware/ssl, confirm that it contains the newer certs renamed

    to rui.crt and rui.key

    Alternatively, you can put the host into maintenance mode, to review the new certificates.

    31 | P a g e'
  remediation: 'Backup and replace the details of the SSL certificate presented by the ESXi host and

    determine if it is issued by a trusted CA:

    1. Log in to the ESXi Shell, either directly from the DCUI or from an SSH client, as a user

    with administrator privileges.

    2. In the directory /etc/vmware/ssl, rename the existing certificates using the

    following commands:

    mv rui.crt orig.rui.crt

    mv rui.key orig.rui.key

    3. Copy the certificates you want to use to /etc/vmware/ssl.

    4. Rename the new certificate and key to rui.crt and rui.key.

    5. Restart the host after you install the new certificate.

    Alternatively, you can put the host into maintenance mode, install the new certificate, use

    the Direct Console User Interface (DCUI) to restart the management agents, and set the

    host to exit maintenance mode.

    Leverage VMware''s SSL Certificate Automation Tool to install CA-signed SSL

    certificates. For more information on this tool, please see

    [http://kb.vmware.com/kb/2057340](http://kb.vmware.com/kb/2057340).'
  checks:
  - type: manual_review
    info: 'View the details of the SSL certificate presented by the ESXi host and determine if it is

      issued by a trusted CA:

      1. Log in to the ESXi Shell, either directly from the DCUI or from an SSH client, as a user

      with administrator privileges.

      2. Review the contents to see if the certs have been backed up.

      3. In the directory /etc/vmware/ssl, confirm that it contains orig.rui.crt and

      orig.rui.key

      4. In the directory /etc/vmware/ssl, confirm that it contains the newer certs renamed

      to rui.crt and rui.ke'
    severity: medium
- id: '2.5'
  title: (L1) Ensure SNMP is configured properly
  scoring: manual
  profile:
  - Level 1
  description: Simple Network Management Protocol (SNMP) can be used to help manage hosts. Many organizations have other means
    in place of managing hosts and do not need SNMP enabled. If SNMP is needed, it should be configured properly to reduce
    the risk of misuse or compromise. For example, ESXi supports SNMPv3, which provides stronger security than SNMPv1 or SNMPv2,
    including key authentication and encryption. It is also important to configure the destination for SNMP traps.
  rationale: If SNMP is not properly configured, monitoring data containing sensitive information may be sent to a malicious
    host and used to help exploit said host.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.monitoring.doc/GUID-8EF36D7D-59B6-4C74B1AA-4A9D18AB6250.html
  page_start: 34
  audit_raw: 'To confirm the proper configuration of SNMP, perform the following from the ESXi Shell or

    vCLI:

    1. Run the following to determine if SNMP is being used:

    esxcli system snmp get

    2. If SNMP is being used, refer to the vSphere Monitoring and Performance guide,

    chapter 8 for steps to verify the parameters.

    Additionally, the following PowerCLI command may be used to view the SNMP

    configuration:

    # List the SNMP Configuration of a host (single host connection required)

    Get-VMHostSnmp

    34 | P a g e'
  remediation: 'To correct the SNMP configuration, perform the following from the ESXi Shell or vCLI:

    1. If SNMP is not needed, disable it by running:

    esxcli system snmp set --enable false

    2. If SNMP is needed, refer to the vSphere Monitoring and Performance guide, chapter

    8 for steps to configure it.

    Additionally, the following PowerCLI command may be used to implement the

    configuration:

    # Update the host SNMP Configuration (single host connection required)

    Get-VmHostSNMP | Set-VMHostSNMP -Enabled:$true -ReadOnlyCommunity ''<secret>''

    Notes:

     SNMP must be configured on each ESXi host

     SNMP settings can be configured using Host Profiles'
  checks:
  - type: manual_review
    info: 'To confirm the proper configuration of SNMP, perform the following from the ESXi Shell or

      vCLI:

      1. Run the following to determine if SNMP is being used:

      esxcli system snmp get

      2. If SNMP is being used, refer to the vSphere Monitoring and Performance guide,

      chapter 8 for steps to verify the parameters.

      Additionally, the following PowerCLI command may be used to view the SNMP

      configuration:

      # List the SNMP Configuration of a host (single host connection required)

      Get-VMHostSnmp

      34 | P a g e'
    severity: medium
- id: '2.6'
  title: (L1) Ensure dvfilter API is not configured if not used
  scoring: scored
  profile:
  - Level 1
  description: The dvfilter network API is used by some products (e.g., VMSafe). If it is not in use, it should not be configured
    to send network information to a VM.
  rationale: If the dvfilter network API is enabled in the future and it is already configured, an attacker might attempt
    to connect a VM to it, thereby potentially providing access to the network of other VMs on the host.
  impact: This will prevent a dvfilter-based network security appliance such as a firewall from functioning if not configured
    correctly.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-CD0783C9-1734-4B9AB821-ED17A77B0206.html
  page_start: 36
  audit_raw: 'If the dvfilter network API is not being used on the host, ensure that the following kernel

    parameter has a blank value: Net.DVFilterBindIpAddress.

    1. From the vSphere web client, select the host and click Configure then expand

    System

    2. Click on Advanced System Settings then Edit.

    3. Search for Net.DVFilterBindIpAddress in the filter.

    4. Verify Net.DVFilterBindIpAddress has an empty value.

    5. If an appliance is being used, then ensure the value of this parameter is set to the

    proper IP address.

    Additionally, the following PowerCLI command may be used to verify the setting:

    # List Net.DVFilterBindIpAddress for each host

    Get-VMHost | Select Name, @{N="Net.DVFilterBindIpAddress";E={$_ | GetAdvancedSetting Net.DVFilterBindIpAddress | Select
    -ExpandProperty Values}}

    36 | P a g e'
  remediation: 'To remove the configuration for the dvfilter network API, perform the following from the

    vSphere web client:

    1. From the vSphere web client, select the host and click Configure then expand

    System

    2. Click on Advanced System Settings then Edit.

    3. Search for Net.DVFilterBindIpAddress in the filter.

    4. Set Net.DVFilterBindIpAddress has an empty value.

    5. If an appliance is being used, make sure the value of this parameter is set to the

    proper IP address.

    6. Enter the proper IP address.

    7. Click OK.

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # Set Net.DVFilterBindIpAddress to null on all hosts

    Get-VMHost HOST1 | Foreach { Set-AdvancedSetting -VMHost $_ -Name

    Net.DVFilterBindIpAddress -IPValue "" }'
  checks:
  - type: manual_review
    info: 'If the dvfilter network API is not being used on the host, ensure that the following kernel

      parameter has a blank value: Net.DVFilterBindIpAddress.

      1. From the vSphere web client, select the host and click Configure then expand

      System

      2. Click on Advanced System Settings then Edit.

      3. Search for Net.DVFilterBindIpAddress in the filter.

      4. Verify Net.DVFilterBindIpAddress has an empty value.

