- id: '6.3'
  title: (L1) Ensure storage area network (SAN) resources are segregated properly
  scoring: manual
  profile:
  - Level 1
  description: Use zoning and logical unit number (LUN) masking to segregate storage area network (SAN) activity. Zoning provides
    access control in the SAN topology. Zoning defines which host bus adapters (HBAs) can connect to which targets. The devices
    outside a zone are not visible to the devices inside the zone when SAN zoning is configured. For example, zones defined
    for testing should be managed independently within the SAN so they do not interfere with activity in the production zones.
    Similarly, you can set up different zones for different departments. Zoning must take into account any host groups that
    have been set up on the SAN device. LUN masking is a process that makes a LUN available to some hosts and unavailable
    to other hosts.
  rationale: Segregating SAN activity can reduce the attack surface for the SAN, prevent non-ESXi systems from accessing SANs,
    and separate environments, for example, test and production environments.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.storage.doc/GUID-6029358F-8EE8-4143-9BB016ABB3CA0FE3.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-BFE9046A-2278-4026-809AED8F9D8FDACE.html
  page_start: 103
  audit_raw: 'The audit procedures to verify SAN activity is properly segregated are SAN vendor or

    product-specific.'
  remediation: 'The remediation procedures to properly segregate SAN activity are SAN vendor or productspecific.

    In general, with ESXi hosts, use a single-initiator zoning or a single-initiator-single-target

    zoning. The latter is a preferred zoning practice. Using the more restrictive zoning prevents

    problems and misconfigurations that can occur on the SAN.

    103 | P a g e'
  checks:
  - type: manual_review
    info: 'The audit procedures to verify SAN activity is properly segregated are SAN vendor or

      product-specific.'
    severity: medium
- id: '7.1'
  title: (L1) Ensure the vSwitch Forged Transmits policy is set to reject
  scoring: scored
  profile:
  - Level 1
  description: Set the vSwitch Forged Transmits policy to reject for each vSwitch. Reject Forged Transmit can be set at the
    vSwitch and/or the Portgroup level. You can override switch-level settings at the Portgroup level.
  rationale: If the virtual machine operating system changes the MAC address, the operating system can send frames with an
    impersonated source MAC address at any time. This allows an operating system to stage malicious attacks on the devices
    in a network by impersonating a network adaptor authorized by the receiving network. Setting forged transmissions to accept
    means the virtual switch does not compare the source and effective MAC addresses. To protect against MAC address impersonation,
    all virtual switches should have forged transmissions set to reject.
  impact: This will prevent VMs from changing their effective MAC address. This will affect applications that require this
    functionality, such as Microsoft Clustering, which requires systems to effectively share a MAC address. This will affect
    how a layer 2 bridge will operate. This will also affect applications that require a specific MAC address for licensing.
    An exception should be made for the port groups that these applications are connected to. 105 | P a g e
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.networking.doc/GUID-891147DD-3E2E-45A19B50-7717C3443DD7.html
  page_start: 105
