    \ Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches then click Edit.\n\
    4. Click on Security.\n5. Verify that Forged transmits is set to Reject in the dropdown.\nAlternately, the following PowerCLI\
    \ command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select VMHost,\
    \ Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\" } Else { \"Reject\"\
    } }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) { \"Accept\" } Else {\n\
    \"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits) { \"Accept\"\
    \ } Else {\n\"Reject\"} }}"
  remediation: 'To set the policy to reject forged transmissions, perform the following:

    1. From the vSphere Web Client, select the host.

    2. Click Configure then expand Networking.

    3. Select Virtual switches then click Edit.

    4. Click on Security.

    5. Set Forged transmits to Reject in the dropdown.

    6. Click on OK.

    Alternately, the following ESXi shell command may be used:

    # esxcli network vswitch standard policy security set -v vSwitch2 -f false'
