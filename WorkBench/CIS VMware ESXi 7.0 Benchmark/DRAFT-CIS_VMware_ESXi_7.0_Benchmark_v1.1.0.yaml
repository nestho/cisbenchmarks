- id: '4.3'
  title: (L1) Ensure the maximum failed login attempts is set to 5
  scoring: scored
  profile:
  - Level 1
  description: Authentication should be configured so there is a maximum number of consecutive failed login attempts for each
    account, at which point the account at risk will be locked out.
  rationale: Multiple account login failures for the same account could possibly be an attacker trying to brute force guess
    the password.
