- id: '6.1'
  title: (L1) Ensure bidirectional CHAP authentication for iSCSI traffic is enabled
  scoring: scored
  profile:
  - Level 1
  description: vSphere allows for the use of bidirectional authentication of both the iSCSI target and host. Bidirectional
    Challenge-Handshake Authentication Protocol (CHAP), also known as Mutual CHAP, should be enabled to provide bidirectional
    authentication.
  rationale: 'By not authenticating both the iSCSI target and host, there is a potential for a man-in-themiddle attack in
    which an attacker might impersonate either side of the connection to steal data. Bidirectional authentication can mitigate
    this risk. Note: Choosing not to enforce bidirectional authentication can make sense if you create a dedicated network
    or VLAN to service all your iSCSI devices. If the iSCSI facility is isolated from general network traffic, it is less
    vulnerable to exploitation.'
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-AC65D747-728F-4109-96DD49B433E2F266.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-2F1E64DB-20BB-4D18-A0838E65FE380899.html
  page_start: 97
  audit_raw: 'To verify that bidirectional CHAP authentication is enabled for iSCSI traffic, perform the

    following:

    1. From the vSphere Web Client, select the host.

    2. Click Configure then expand Storage.

    3. Select Storage Adapters then select the iSCSI Adapter.

    4. Under Properties verify that the Authentication method is set to Use

    bidirectional CHAP.

    Alternately, the following PowerCLI command may be used:

    # List Iscsi Initiator and CHAP Name if defined

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi"} | Select VMHost,

    Device, ChapType, @{N="CHAPName";E={$_.AuthenticationProperties.ChapName}}

