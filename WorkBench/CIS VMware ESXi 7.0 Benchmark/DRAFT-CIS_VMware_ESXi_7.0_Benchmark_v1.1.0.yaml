- id: '4.1'
  title: (L1) Ensure a non-root user account exists for local admin access
  scoring: scored
  profile:
  - Level 1
  description: By default, each ESXi host has a single "root" admin account that is used for local administration and to connect
    the host to vCenter Server. Use of this shared account should be limited, and named (non-root) user accounts with admin
    privileges should be used instead.
  rationale: To avoid sharing a common root account, it is recommended on each host to create at least one named user account
    and assign it full admin privileges, and to use this account in lieu of a shared "root" account. Limit the use of "root",
    including setting a highly complex password for the account, but do not remove the "root" account.
  impact: ''
  references:
