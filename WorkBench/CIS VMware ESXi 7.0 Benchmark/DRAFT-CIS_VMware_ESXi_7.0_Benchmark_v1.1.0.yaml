- id: '2.7'
  title: (L1) Ensure expired and revoked SSL certificates are removed from the ESXi server
  scoring: manual
  profile:
  - Level 1
  description: By default, ESXi hosts do not have Certificate Revocation List (CRL) checking available, so expired and revoked
    SSL certificates must be checked and removed manually.
  rationale: Leaving expired and revoked certificates on your vCenter Server system can compromise your environment. Replacing
    certificates will avoid having users get used to clicking through browser warnings. The warning might be an indication
    of a man-in-the-middle attack, and only inspection of the certificate and thumbprint can guard against such attacks.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-AC7E6DD7-F984-4E0F983A-463031BA5FE7.html
  - 2. http://en-us.sysadmins.lv/Lists/Posts/Post.aspx?List=332991f0-bfed-4143-9eeaf521167d287c&ID=60
  page_start: 39
  audit_raw: 'To assess if there are expired or revoked SSL certificates on your ESXi server, use the

    PowerCLI script called out in "verify-ssl-certificates".

    39 | P a g e'
  remediation: 'Replace expired and revoked certificates with certificates from a trusted CA. Certificates

    can be replaced in a number of ways:

    Replace a Default ESXi Certificate and Key from the ESXi Shell

    1. Log in to the ESXi Shell, either directly from the DCUI or from an SSH client, as a user

    with administrator privileges.

    2. In the directory /etc/vmware/ssl, rename the existing certificates using the

    following commands:

    mv rui.crt orig.rui.crt

    mv rui.key orig.rui.key

    3. Copy the certificates that you want to use to /etc/vmware/ssl.

    4. Rename the new certificate and key to rui.crt and rui.key.

    5. Restart the host after you install the new certificate.

    Alternatively, you can put the host into maintenance mode, install the new certificate, use

    the Direct Console User Interface (DCUI) to restart the management agents, and set the

    host to exit maintenance mode.

    Replace a Default ESI Certificate and Key by Using the vifs Command

    1. Back up the existing certificates.

    2. Generate a certificate request following the instructions from the certificate

    authority.

    3. At the command line, use the vifs command to upload the certificate to the

    appropriate location on the host.

    vifs --server hostname --username username --put rui.crt /host/ssl_cert

    vifs --server hostname --username username --put rui.key /host/ssl_key

    4. Restart the host.

    40 | P a g e

    Alternatively, you can put the host into maintenance mode, install the new certificate, and

    then use the Direct Console User Interface (DCUI) to restart the management agents.

    Replace A Default ESI Certificate and Key Using HTTP PUT

    1. Back up the existing certificates.

    2. In your upload application, process each file as follows:

    3. Open the file.

    4. Publish the file to one of these locations:

    Certificates https://hostname/host/ssl_cert

    Keys https://hostname/host/ssl_key

    3. The locations /host/ssl_cert and host/ssl_key link to the certificate files in

    /etc/vmware/ssl.

    4. Restart the host.'
  checks:
  - type: manual_review
    info: 'To assess if there are expired or revoked SSL certificates on your ESXi server, use the

      PowerCLI script called out in "verify-ssl-certificates".

      39 | P a g e'
    severity: medium
- id: '2.8'
  title: (L1) Ensure vSphere Authentication Proxy is used when adding hosts to Active Directory
  scoring: scored
  profile:
  - Level 1
  description: vSphere Authentication Proxy enables ESXi hosts to join a domain without using Active Directory credentials.
    vSphere Authentication Proxy enhances security for PXE-booted hosts and hosts that are provisioned using Auto Deploy and
    Host profiles, by removing the need to store Active Directory credentials in the host configuration. The vSphere Authentication
    Proxy service binds to an IPv4 address for communication with vCenter Server, and does not support IPv6. The vCenter Server
    can be on a host machine in an IPv4-only, IPv4/IPv6 mixed-mode, or IPv6-only network environment, but the machine that
    connects to the vCenter Server through the vSphere Client must have an IPv4 address for the vSphere Authentication Proxy
    service to work.
  rationale: If you configure your host to join an Active Directory domain using Host Profiles the Active Directory credentials
    are saved in the host profile and are transmitted over the network. To avoid having to save Active Directory credentials
    in the Host Profile and to avoid transmitting Active Directory credentials over the network use the vSphere Authentication
    Proxy. 42 | P a g e
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-084B74BD-40A5-4A4BA82C-0C9912D580DC.html
  page_start: 42
  audit_raw: 'If you utilize a host profile to join the domain, before attaching it verify that the profile has

    been configured to use the proxy server for joining the host to domains by following these

    steps:

    1. In the vSphere Web Client go to Home in the menu.

    2. Click on Policies and Profiles followed by Host Profiles.

    3. Choose the appropriate host profile

    4. Select Configure then expand Security and Services followed by

    Authentication.

    5. Select Active Directory configuration.

    6. Verify that JoinDomain Method is configured to Use vSphere Authentication

    Proxy to add the host to the domain.

    There is no way to audit this using web client if you manually chose to join the host to a

    domain.

    Additionally, the following PowerCLI command may be used:

    # Confirm the host profile is using vSphere Authentication proxy to add the

    host to the domain

    Get-VMHost | Select Name, ` @{N="HostProfile";E={$_ | Get-VMHostProfile}}, `

    @{N="JoinADEnabled";E={($_ | GetVmHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirecto

    ry.Enabled}}, ` @{N="JoinDomainMethod";E={(($_ | GetVMHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirecto

    ry | Select -ExpandProperty Policy | Where {$_.Id -eq

    "JoinDomainMethodPolicy"}).Policyoption.Id}}# Check each host and their

    domain membership statusGet-VMHost | Get-VMHostAuthentication | Select

    VmHost, Domain, DomainMembershipStatus'
  remediation: 'To properly set the vSphere Authentication Proxy from Web Client directly:

    1. Select the host

    2. Click on Configure then expand System, select Authentication Services.

    3. Click on Join Domain

    4. Select Using Proxy Server radio button.

    5. Provide proxy server IP address.

    43 | P a g e

    To properly set the vSphere Authentication Proxy via Host Profiles:

    1. In the vSphere Web Client go to Home in the menu.

    2. Click on Policies and Profiles followed by Host Profiles.

    3. Choose the appropriate host profile

    4. Select Configure followed by Edit Host Profile... then expand Security and

    Services followed by Security Settings, then Authentication configuration.

    5. Select Active Directory configuration.

    6. Set the JoinDomain Method is configured to Use vSphere Authentication Proxy

    to add the host to the domain.

    7. Click on Save.'
  checks:
  - type: manual_review
    info: 'If you utilize a host profile to join the domain, before attaching it verify that the profile has

      been configured to use the proxy server for joining the host to domains by following these

      steps:

      1. In the vSphere Web Client go to Home in the menu.

      2. Click on Policies and Profiles followed by Host Profiles.

      3. Choose the appropriate host profile

      4. Select Configure then expand Security and Services followed by

      Authentication.

      5. Select Active Directory configuration.

      6. Verify that JoinDomain M'
    severity: medium
- id: '2.9'
  title: (L2) Ensure VDS health check is disabled
  scoring: scored
  profile:
  - Level 2
  description: The health check support in VDS helps you identify and troubleshoot configuration errors in a vSphere Distributed
    Switch. It is recommended that health check be turned off by default and confirmed that it is turned off when troubleshooting
    is finished.
  rationale: vSphere Distributed switch health check once enabled, collects packets that contain information on host#, vds#
    port#, which an attacker would find useful.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.networking.doc/GUID-4A6C1E1C-8577-4AE68459-EEB942779A82.html
  page_start: 45
  audit_raw: 'Using the vSphere Web Client for each VDS:

    1. Select a VDS

    2. Go to Configure, expand Settings then select Health Check.

    3. Ensure that VLAN and MTU as well as Teaming and failover are set to Disabled.

    Additionally, the following PowerCLI command can be used:

    $vds = Get-VDSwitch

    $vds.ExtensionData.Config.HealthCheckConfig

    45 | P a g e'
  remediation: 'Using the vSphere Web Client for each VDS:

    1. Select a VDS

    2. Go to Configure, expand Settings then select Health Check.

    3. Click on Edit.

    4. Set VLAN and MTU state to Disabled.

    5. Set Teaming and failover state to Disabled.

    6. Click OK.

    Additionally, the following PowerCLI command can be used:

    Get-View -ViewType DistributedVirtualSwitch | ?{($_.config.HealthCheckConfig

    | ?{$_.enable -notmatch "False"})}| %{$_.UpdateDVSHealthCheckConfig(@((NewObject Vmware.Vim.VMwareDVSVlanMtuHealthCheckConfig
    -property

    @{enable=0}),(New-Object Vmware.Vim.VMwareDVSTeamingHealthCheckConfig -

    property @{enable=0})))}'
  checks:
  - type: manual_review
    info: 'Using the vSphere Web Client for each VDS:

      1. Select a VDS

      2. Go to Configure, expand Settings then select Health Check.

      3. Ensure that VLAN and MTU as well as Teaming and failover are set to Disabled.

      Additionally, the following PowerCLI command can be used:

      $vds = Get-VDSwitch

      $vds.ExtensionData.Config.HealthCheckConfig

      45 | P a g e'
