controls:
- id: '1.1'
  title: Ensure packages are obtained from authorized repositories
  scoring: manual
  profile:
  - Level 1
  description: Standard Linux distributions, although possessing the requisite packages, often do not have YugabyteDB pre-installed.
    The installation process includes installing the binaries and the means to generate a data cluster. Package installation
    should include both the server and client packages. Contribution modules are optional depending upon one's architectural
    requirements (they are recommended though). When obtaining and installing software packages (typically via tar.gz), it's
    imperative that packages are sourced only from valid and authorized repositories. For YugabyteDB, the canonical repositories
    for the official YugabyteDB packages is download.yugabyte.com.
  rationale: Being open-source, YugabyteDB is available across the internet through package aggregators and providers. However,
    using invalid or unauthorized sources for packages can lead to implementing untested, defective, or malicious software.
    Many organizations choose to implement a local software repository within their organization. Care must be taken to ensure
    that only valid and authorized packages are downloaded and installed into such local repositories. From a security perspective,
    it's imperative to verify the YugabyteDB binary packages are sourced from a valid software repository.
  impact: ''
  references:
  - 1. https://download.yugabyte.com/#linux
  - 2. https://en.wikipedia.org/wiki/Checksum
  page_start: 17
  audit_raw: "Identify and inspect configured repositories to ensure they are all valid and authorized\nsources of packages.\
    \ The following is an example of a simple Linux command verifying\nintegrity of YugabyteDB package by validating the checksum:\n\
    #!/bin/bash\n# File name and URLs\nFILE_NAME=\"yugabyte-2025.2.4.0-b122-linux-x86_64.tar.gz\"\nFILE_URL=\"https://software.yugabyte.com/releases/2025.2.4.0/$FILE_NAME\"\
    \nSIGNATURE_URL=\"$FILE_URL.sha\"\n# Check if file exists locally\nif [ ! -f \"$FILE_NAME\" ]; then\n echo \"File $FILE_NAME\
    \ does not exist locally. Please download installation\npackage to proceed. Exiting.\"\n exit 1\nfi\n# Compare checksums\n\
    if [ \"$(wget -qO- $SIGNATURE_URL)\" == \"$(sha1sum $FILE_NAME | awk '{print $1}')\"\n]; then\n echo \"Checksums match.\
    \ File is verified.\"\nelse\n echo \"Checksums do not match. File might be corrupted or tampered with.\"\nIf the checksum\
    \ of the binary packages does not match the checksum from\ndownload.yugabyte.com, this is a fail."
  remediation: 'Alter the configured repositories so they only include valid and authorized sources of

    packages.

    #!/bin/bash

    # URL of the file to download

    FILE_URL="https://software.yugabyte.com/releases/2025.2.4.0/yugabyte-2025.2.4.0b122-linux-x86_64.tar.gz"

    # Download the file

    wget $FILE_URL'
  checks:
  - type: manual_review
    info: "Identify and inspect configured repositories to ensure they are all valid and authorized\nsources of packages.\
      \ The following is an example of a simple Linux command verifying\nintegrity of YugabyteDB package by validating the\
      \ checksum:\n#!/bin/bash\n# File name and URLs\nFILE_NAME=\"yugabyte-2025.2.4.0-b122-linux-x86_64.tar.gz\"\nFILE_URL=\"\
      https://software.yugabyte.com/releases/2025.2.4.0/$FILE_NAME\"\nSIGNATURE_URL=\"$FILE_URL.sha\"\n# Check if file exists\
      \ locally\nif [ ! -f \"$FILE_NAME\" ]; then\n echo \"File "
    severity: medium
- id: '1.2'
  title: Ensure systemd Service Files Are Enabled
  scoring: manual
  profile:
  - Level 1
  description: Confirm, and correct if necessary, the YugabyteDB systemd service is enabled.
  rationale: Enabling the systemd service on the OS ensures the database service is active when a change of state occurs as
    in the case of a system startup or reboot.
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man1/systemctl.1.html
  - 2. https://www.freedesktop.org/software/systemd/man/systemd.special.html
  page_start: 20
  audit_raw: 'The default operating target on systemd-powered operating systems is typically "multiuser". One confirms the
    default target by executing the following:

    $ whoami root

    $ systemctl get-default multi-user.target

    $ systemctl list-dependencies multi-user.target | grep -i postgres

    If the intended YugabyteDB service is not registered as a dependency (or "want") of the

    default target (no output for the 3rd command above), this is a fail.

    /etc/systemd/system/yugabyted.service

    [Unit]

    Description=YugabyteDB Server

    After=network.target

    [Service]

    User=<USERNAME>

    Group=<GROUPNAME>

    ExecStart=/path/to/yugabyted start --daemon=false

    ExecStop=/path/to/yugabyted stop

    Restart=on-failure

    RestartSec=10

    LimitNOFILE=4096

    [Install]

    WantedBy=multi-user.target'
  remediation: 'Irrespective of package source, YugabyteDB services can be identified because it

    typically includes the text string "yugabyted". PGDG installs do not automatically

    register the service as a "want" of the default systemd target. Multiple instances of

    YugabyteDB services often distinguish themselves using a version number.

    # whoami root

    # systemctl enable yugabyted

    Created symlink /etc/systemd/system/multi-user.target.wants/yugabyted.service →

    /usr/lib/systemd/system/yugabyted.service.

    # systemctl list-dependencies multi-user.target | grep -i yugabyted

    ├─yugabyted.service'
  checks:
  - type: command
    command: $ systemctl list-dependencies multi-user.target | grep -i postgres
    expected: ''
    severity: medium
    info: 'The default operating target on systemd-powered operating systems is typically "multiuser". One confirms the default
      target by executing the following:

      $ whoami root

      $ systemctl get-default multi-user.target

      $ systemctl list-dependencies multi-user.target | grep -i postgres

      If the intended YugabyteDB service is not registered as a dependency (or "want") of the

      default target (no output for the 3rd'
- id: '1.3'
  title: Ensure Data Cluster Initialized Successfully
  scoring: scored
  profile:
  - Level 1
  description: First-time installs of YugabyteDB require the instantiation of the database cluster. A database cluster is
    a collection of databases that are managed by a single server instance.
  rationale: 'For the purposes of security, YugabyteDB enforces ownership and permissions of the data cluster such that: An
    initialized data cluster is owned by the UNIX account that created it. The data cluster cannot be accessed by other UNIX
    user accounts. The data-cluster cannot be created or owned by root The YugabyteDB process cannot be invoked by root nor
    any UNIX user account other than the owner of the data cluster. Incorrectly instantiating the data cluster will result
    in a failed installation.'
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/deploy/
  - 2. https://docs.yugabyte.com/preview/deploy/manual-deployment/
  page_start: 22
  audit_raw: 'Use the yb-admin binary to check the cluster status for all YB-Master servers.

    .bin/yb-admin -init_master_addrs <master-ip-address:port> list_all_masters

    Next, check the cluster status for all YB-TServer.

    .bin/yb-admin -init_master_addrs <master ip address> list_all_tablet_servers'
  remediation: 'In the case of a cluster initialization failure, please visit YugabyteDB Troubleshooting

    guide: https://docs.yugabyte.com/preview/troubleshoot/'
  checks:
  - type: manual_review
    info: 'Use the yb-admin binary to check the cluster status for all YB-Master servers.

      .bin/yb-admin -init_master_addrs <master-ip-address:port> list_all_masters

      Next, check the cluster status for all YB-TServer.

      .bin/yb-admin -init_master_addrs <master ip address> list_all_tablet_servers'
    severity: medium
- id: '1.4'
  title: Ensure a separate user and group exist for YugabyteDB
  scoring: manual
  profile:
  - Level 2
  description: Create separate userid and group for YugabyteDB.
  rationale: All processes need to run as a user with least privilege. This mitigates the potential impact of malware to the
    system.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/secure/authorization/create-roles/
  - 2. NIST SP 800-53:rev5:AC-6
  page_start: 24
  audit_raw: 'Logon to the server where YugabyteDB is installed. To confirm existence of the group,

    execute the following command:

    getent growd | grep yugabyte

    If either the group or user do not exist, or if the user is not a member of the group, this is

    a finding.'
  remediation: 'Create a group for YugabyteDB (if it does not already exist)

    sudo groupadd yugabyte

    Create a user which is only used for running YugabyteDB and its related processes

    sudo useradd -m -d /home/yugabyte -s /bin/bash -g yugabyte -u <USERID_NUMBER>

    yugabyte

    Replacing <USERID_NUMBER> with a number not already used on the server'
  checks:
  - type: command
    command: getent growd | grep yugabyte
    expected: ''
    severity: medium
    info: 'Logon to the server where YugabyteDB is installed. To confirm existence of the group,

      execute the following command:

      getent growd | grep yugabyte

      If either the group or user do not exist, or if the user is not a member of the group, this is

      a finding.'
- id: '1.5'
  title: Ensure latest version of YugabyteDB is installed
  scoring: scored
  profile:
  - Level 2
  description: The YugabyteDB installation version, along with the patches, should be the most recent that is compatible with
    the organization's operational needs. When obtaining and installing software packages (typically via apt-get or you can
    compile the source code), it's imperative that packages (or the source code, tarball) are sourced only from valid and
    authorized repository download.yugabyte.com.
  rationale: Using the most recent version of YugabyteDB can help limit the possibilities for vulnerabilities in the software,
    the installation version applied during setup should be established according to the needs of the organization. Ensure
    you are using a release that is covered by a level of support which includes regular updates to address vulnerabilities.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/manage/upgrade-deployment/
  - 2. NIST SP 800-53:rev5:SI-2 c
  page_start: 26
  audit_raw: 'To verify the version of YugabyteDB you have installed:

    ./bin/yugabyted version

    /home/yugabyte/yugabyte-2025.2.0.0/version_metadata.json

    ----------------------------------------------------------------------

    | Version |

    ----------------------------------------------------------------------

    | Version : 2025.2.0.0-b100 |

    | Build Time : 15 Jun 2026 00:00:00 UTC |

    | Build Hash : (build-specific) |

    ----------------------------------------------------------------------

    If an old/unsupported version of YugabyteDB is installed this is a finding.'
  remediation: "Upgrade to the latest stable version of the YugabyteDB software:\nUpgrade YB-Master\nUse the following procedure\
    \ to upgrade a YB-Master:\n1. Stop the older version of the YB-Master process, as follows:\npkill yb-master\n2. Verify\
    \ that you are on the directory of the new version, as follows:\ncd /home/yugabyte/softwareyb-$VER/\n3. Start the newer\
    \ version of the YB-Master process. For more information, see\nStart YB-Masters.\n4. Verify in http://<any-yb-master>:7000/\
    \ that all YB-Masters are alive.\n5. Pause for approximately 60 seconds before upgrading the next YB-Master.\nUpgrade\
    \ YB-TServer\nUse the following procedure to upgrade a YB-TServer:\n1. Stop the older version of the yb-tserver process,\
    \ as follows: pkill ybtserver\n2. Verify that you're on the directory of the new version, as follows: cd\n/home/yugabyte/softwareyb-$VER/\n\
    3. Start the newer version of the YB-TServer process.\n4. Verify in http://<any-yb-master>:7000/tablet-servers to see\
    \ if the\nnew YB-TServer is alive and heart beating.\n5. Pause for approximately 60 seconds before upgrading the next\
    \ YB-TServer.\nPromote AutoFlags\nUse the yb-admin utility to promote the new AutoFlags, as follows:\n./bin/yb-admin \\\
    \n -master_addresses <master-addresses> \\\n promote_auto_flags\nUpgrade the YSQL system catalog\nAfter completing the\
    \ YugabyteDB upgrade process, use the yb-admin utility to upgrade\nthe YSQL system catalog, as follows:\n./bin/yb-admin\
    \ \\\n -master_addresses <master-addresses> \\\n upgrade_ysql\nExpect to see the following output:\nYSQL successfully\
    \ upgraded to the latest version\nIn certain scenarios, a YSQL upgrade can take longer than 60 seconds, which is the\n\
    default timeout value for yb-admin. If this happens, run the following command with a\ngreater timeout value:\n./bin/yb-admin\
    \ \\\n -master_addresses ip1:7100,ip2:7100,ip3:7100 \\\n -timeout_ms 180000 \\\n upgrade_ysql"
  checks:
  - type: manual_review
    info: 'To verify the version of YugabyteDB you have installed:

      ./bin/yugabyted version

      /home/yugabyte/yugabyte-2025.2.0.0/version_metadata.json

      ----------------------------------------------------------------------

      | Version |

      ----------------------------------------------------------------------

      | Version : 2025.2.0.0-b100 |

      | Build Time : 15 Jun 2026 00:00:00 UTC |

      | Build Hash : (build-specific) |

      ----------------------------------------------------------------------

      If an old/unsupported version of'
    severity: medium
- id: '1.6'
  title: Ensure the YugabyteDB service is run as a non-root user
  scoring: scored
  profile:
  - Level 2
  description: Though YugabyteDB database may be run as root, it should run as another non-root user.
  rationale: One of the best ways to reduce your exposure to attack is to create a unique, unprivileged user and group for
    the server application. A best practice is to follow is ensuring processes run with a user with least privilege.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-6
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 29
  audit_raw: 'Logon to the server where YugabyteDB master service is running and run the following

    command

    ps -aef | grep master| cut -d'' '' -f1

    This will show who is running the YugabyteDB master binary. If the user is root or has

    excessive privileges then this is a finding.'
  remediation: 'Create a group for yugabyte (if it does not already exist)

    sudo groupadd yugabyte

    Create a user which is only used for running YugabyteDB and its related processes.

    sudo groupadd -m -d <DIRECTORY_WHERE_YUGABYTEDB_INSTALLED> -s /bin/bash -g

    yugabyte -u <USERID_NUMBER> yugabyte

    Replacing <DIRECTORY_WHERE_YUGABYTEDB_INSTALLED with the full path of where

    YugabyteDB binaries are installed. Replacing <USERID_NUMBER> with a number not

    already used on the server'
  checks:
  - type: command
    command: ps -aef | grep master| cut -d' ' -f1
    expected: ''
    severity: medium
    info: 'Logon to the server where YugabyteDB master service is running and run the following

      command

      ps -aef | grep master| cut -d'' '' -f1

      This will show who is running the YugabyteDB master binary. If the user is root or has

      excessive privileges then this is a finding.'
- id: '1.7'
  title: Ensure clocks are synchronized on all nodes
  scoring: manual
  profile:
  - Level 2
  description: Enabling Network Time Protocol (NTP), or some equivalent way, to keep clocks on all nodes in sync is critical.
  rationale: YugabyteDB decides which data is most current between all of the nodes in the cluster based on timestamps. It
    is paramount to ensure all clocks are in-sync, otherwise the most current data may not be returned or worse, marked for
    deletion.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:SC-45
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 31
  audit_raw: 'Depending on the Linux installation this may be checked by executing the following

    command on each node:

    ps -aef | grep ntp OR

    ps -aef | grep chronyd

    If NTP is not configured or clocks are out-of-sync then this is a finding.'
  remediation: Install and start the time protocol on every node in the YugabyteDB cluster.
  checks:
  - type: command
    command: ps -aef | grep ntp OR && ps -aef | grep chronyd
    expected: ''
    severity: medium
    info: 'Depending on the Linux installation this may be checked by executing the following

      command on each node:

      ps -aef | grep ntp OR

      ps -aef | grep chronyd

      If NTP is not configured or clocks are out-of-sync then this is a finding.'
- id: '2.1'
  title: Ensure the file permissions mask is correct
  scoring: manual
  profile:
  - Level 1
  description: Files are always created using a default set of permissions. File permissions can be restricted by applying
    a permissions mask called the umask. The yugabyte user account should use a umask of 077 to deny file access to all user
    accounts except the owner.
  rationale: The Linux OS defaults the umask to 002, which means the owner and primary group can read and write the file,
    and other accounts are permitted to read the file. Not explicitly setting the umask to a value as restrictive as 077 allows
    other users to read, write, or even execute files and scripts created by the yugabyte user account. The alternative to
    using a umask is explicitly updating file permissions after file creation using the command line utility chmod (a manual
    and error-prone process that is not advised).
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man2/umask.2.html
  - 2. https://man7.org/linux/man-pages/man1/umask.1p.html
  page_start: 34
  audit_raw: 'To view the mask''s current setting, execute the following commands:

    # whoami

    root

    # su - yugabyte

    # whoami

    yugabyte

    # umask

    0022

    The umask must be 077 or more restrictive for the yugabyte user, otherwise, this is a

    fail.'
  remediation: 'Depending upon the yugabyte user''s environment, the umask is typically set in the

    initialization file .bash_profile, but may also be set in .profile or .bashrc. To set the

    umask, add the following to the appropriate profile file:

    # whoami yugabyte

    # cd ~

    # ls -ld .{bash_profile,profile,bashrc}

    ls: cannot access ''.bash_profile'': No such file or directory

    ls: cannot access ''.profile'': No such file or directory

    ls: cannot access ''.bashrc'': No such file or directory

    # echo "umask 077" >> .bash_profile

    # source .bash_profile

    # umask 0077'
  checks:
  - type: manual_review
    info: 'To view the mask''s current setting, execute the following commands:

      # whoami

      root

      # su - yugabyte

      # whoami

      yugabyte

      # umask

      0022

      The umask must be 077 or more restrictive for the yugabyte user, otherwise, this is a

      fail.'
    severity: medium
- id: 3.1.1
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - Level 1
  description: YugabyteDB by default supports logging server messages to stderr.
  rationale: If log_destination is not set, then any log messages generated by the core YugabyteSQL processes will be lost.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/reference/configuration/yb-tserver/#ysql
  page_start: 37
  audit_raw: "Execute the following YSQL statement to confirm that the expected logging directory is\nspecified:\nyugabyte=#\
    \ show log_destination;\n log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with\
    \ your organization's policies on logging. If all the\nexpected log destinations are not set, this is a fail."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_destination=''stderr''”'
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute the following YSQL statement to confirm that the expected logging directory is\nspecified:\nyugabyte=#\
      \ show log_destination;\n log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with\
      \ your organization's policies on logging. If all the\nexpected log destinations are not set, this is a fail."
- id: 3.1.2
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - Level 1
  description: The log_filename setting specifies the filename pattern for log files. The value for log_filename should match
    your organization's logging policy. The value is treated as a strftime pattern, so %-escapes can be used to specify timevarying
    file names. The supported %-escapes are similar to those listed in the Open Group's strftime specification. If you specify
    a file name without escapes, you should plan to use a log rotation utility to avoid eventually filling the partition that
    contains log_directory. If there are any time-zone-dependent %-escapes, the computation is done in the zone specified
    by log_timezone. Also, the system's strftime is not used directly, so platform- specific (nonstandard) extensions do not
    work.
  rationale: If log_filename is not set, then the value of log_directory is set to the default.
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man3/strftime.3.html
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 39
  audit_raw: "Execute the following YSQL statement to confirm that the desired pattern is set:\nyugabyte=# show log_filename;\n\
    \ log_filename\n--------------------------------\n postgresql-%Y-%m-%d_%H%M%S.log\n(1 row)\nNote: This example shows the\
    \ use of the strftime %a escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log,\
    \ postgresql-Tue.log, et al)."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_filename=''postgresql-%a.log''”'
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute the following YSQL statement to confirm that the desired pattern is set:\nyugabyte=# show log_filename;\n\
      \ log_filename\n--------------------------------\n postgresql-%Y-%m-%d_%H%M%S.log\n(1 row)\nNote: This example shows\
      \ the use of the strftime %a escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log,\
      \ postgresql-Tue.log, et al)."
- id: 3.1.3
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - Level 1
  description: The log_file_mode setting determines the file permissions for log files when logging_collector is enabled.
    The parameter value is expected to be a numeric mode specification in the form accepted by the chmod and umask system
    calls. (To use the customary octal format, the number must start with a 0) The permissions should be set to allow only
    the necessary access to authorized personnel. In most cases, the best setting is 0600, so that only the server owner can
    read or write the log files. The other commonly useful setting is 0640, allowing members of the owner's group to read
    the files, although to make use of that, you will need to alter the log_directory setting to store the log files outside
    the cluster data directory.
  rationale: Log files often contain sensitive data. Allowing unnecessary access to log files may inadvertently expose sensitive
    data to unauthorized personnel.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 41
  audit_raw: "Execute the following YSQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
    yugabyte=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, setting it to 0660). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_file_mode=''0660''”'
  checks:
  - type: sql
    command: show log_file_mode;
    severity: medium
    info: "Execute the following YSQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
      yugabyte=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
- id: 3.1.4
  title: Ensure 'log_truncate_on_rotation' is enabled
  scoring: scored
  profile:
  - Level 1
  description: 'Enabling the log_truncate_on_rotation setting when logging_collector is enabled causes YugabyteDB to truncate
    (overwrite) existing log files with the same name during log rotation instead of appending to them. Note: Truncation will
    occur only when a new file is being opened due to time-based rotation, not during server startup or size-based rotation
    (see later in this benchmark for size-based rotation details).'
  rationale: If this setting is disabled, pre-existing log files will be appended to if log_filename is configured in such
    a way that static names are generated. Enabling or disabling the truncation should only be decided when also considering
    the value of log_filename and log_rotation_age/log_rotation_size.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 43
  audit_raw: "Execute the following YSQL statement to verify how log_truncate_on_rotation is set:\nyugabyte=# show log_truncate_on_rotation;\n\
    \ log_truncate_on_rotation\n--------------------------\n off\n(1 row)\nIf it is not set to on, this is a fail (depending\
    \ on your organization's logging policy)."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

