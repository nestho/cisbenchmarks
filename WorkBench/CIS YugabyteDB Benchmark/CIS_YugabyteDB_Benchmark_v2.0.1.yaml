- id: 3.1.9
  title: Ensure syslog messages are not lost due to size
  scoring: manual
  profile:
  - Level 1
  description: YugabyteDB log messages can exceed 1024 bytes, which is a typical size limit for traditional Syslog implementations.
    When syslog_split_messages is off, YugabyteDB server log messages are delivered to the Syslog service as is, and it is
    up to the Syslog service to cope with the potentially bulky messages. When syslog_split_messages is on, messages are split
    by lines, and long lines are split so that they will fit into 1024 bytes. If syslog is ultimately logging to a text file,
    then the effect will be the same either way, and it is best to leave the setting on, since most syslog implementations
    either cannot handle large messages or would need to be specially configured to handle them. But if syslog is ultimately
    writing into some other medium, it might be necessary or more useful to keep messages logically together.
  rationale: YSQL log entries routed to syslog — particularly pgAudit records and statements captured by log_statement — routinely
    exceed default syslog message-size limits and are truncated or dropped when the limit is reached. Truncated or missing
    audit records undermine forensic investigation and can silently conceal security-relevant activity, so the syslog daemon
    must be configured to accept the largest expected log entry.
  impact: Depending on the Syslog server in use, log messages exceeding 1024 bytes may be lost or, potentially, cause the
    Syslog server processes to abort.
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 53
  audit_raw: "Execute the following YSQL statement to confirm that long log messages are split when\nlogging to Syslog:\n\
    yugabyte=# show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“syslog_split_messages=''on''”'
  checks:
  - type: sql
    command: show syslog_split_messages;
    severity: medium
    info: "Execute the following YSQL statement to confirm that long log messages are split when\nlogging to Syslog:\nyugabyte=#\
      \ show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
