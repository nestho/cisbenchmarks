- id: '1.14'
  title: JUEX-L2-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enable Dynamic Address Resolution Protocol (ARP) Inspection (DAI)
    on all user VLANs. GROUP ID: V-253961 RULE ID: SV-253961r843916'
  rationale: DAI intercepts Address Resolution Protocol (ARP) requests and verifies that each of these packets has a valid
    IP-to-MAC address binding before updating the local ARP cache and before forwarding the packet to the appropriate destination.
    Invalid ARP packets are dropped and logged. DAI determines the validity of an ARP packet based on valid IP-to-MAC address
    bindings stored in the DHCP snooping binding database. If the ARP packet is received on a trusted interface, the switch
    forwards the packet without any checks. On untrusted interfaces, the switch forwards the packet only if it is valid.
  impact: ''
  references: []
  page_start: 46
  audit_raw: "Review the switch configuration to verify that Dynamic Address Resolution Protocol\n(ARP) Inspection (DAI) feature\
    \ is enabled on all user VLANs. Configuring DAI\nautomatically enables DHCP snooping.\nDevices like printers, servers,\
    \ and VoIP phones are under enterprise control and\nconnected to controlled access interfaces (802.1x, Static MAC Bypass,\
    \ or MAC\nRADIUS), making them trusted sources in non-user-facing VLANs.\nVerify DAI on user-facing or untrusted VLANs.\n\
    [edit vlans]\n<untrusted VLAN name> {\n vlan-id <VLAN ID>;\n forwarding-options {\n dhcp-security {\n arp-inspection;\n\
    \ }\n }\n}\nNote: DAI depends upon DHCP snooping or static MAC address bindings.\nIf DAI is not enabled on all user VLANs,\
    \ this is a finding."
  remediation: 'Configure the switch to have Dynamic Address Resolution Protocol (ARP) Inspection

    (DAI) enabled on all user VLANs.

