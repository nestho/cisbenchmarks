- id: '1.15'
  title: JUEX-L2-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper EX switch must be configured to enable Storm Control on all host-facing access interfaces. GROUP
    ID: V-253962 RULE ID: SV-253962r843919'
  rationale: A traffic storm occurs when packets flood a LAN, creating excessive traffic and degrading network performance.
    Traffic storm control prevents network disruption by suppressing ingress traffic when the number of packets reaches configured
    threshold levels. Traffic storm control monitors ingress traffic levels on a port and drops traffic when the number of
    packets reaches the configured threshold level during any onesecond interval.
  impact: ''
  references: []
  page_start: 48
  audit_raw: "Review the switch configuration to verify that storm control is enabled on host-facing\naccess interfaces.\n\
    Verify storm control profiles at [edit forwarding-options storm-control-profiles] with an\nappropriate bandwidth value\
    \ (actual bandwidth value or a percentage). By default, ELS\nversions of Junos enable storm control with an 80 percent\
    \ of bandwidth value, but\npermit setting different values as either an absolute level or a percentage of available\n\
    bandwidth.\nNote: Although percentage of bandwidth remains supported, it is deprecated and\nsubject to removal. Therefore,\
    \ an absolute level should be used. Threshold values must\nbe configured appropriately for the target network.\nVerify\
    \ the default storm control profile or a custom profile with appropriate bandwidth\npercentage or level.\n[edit forwarding-options]\n\
    storm-control-profiles profile-percent {\n all {\n bandwidth-percentage (1..100);\n }\n action-shutdown;\n}\nstorm-control-profiles\
    \ profile-level {\n all {\n bandwidth-level (100..100000000 kbps);\n }\n action-shutdown;\n}\nNote: Storm control profiles\
    \ are created with the hierarchy \"all\" but support removing\nspecific traffic types using the \"no-\" keyword. The currently\
    \ supported exclusions:\n no-broadcast Disable broadcast storm\ncontrol\n no-multicast Disable multicast storm\ncontrol\n\
    \ no-registered-multicast Disable registered multicast storm\ncontrol\n no-unknown-unicast Disable unknown unicast storm\
    \ control\n no-unregistered-multicast Disable unregistered multicast storm control\nIf excluding traffic, verify at least\
    \ broadcast storm control is enabled.\nVerify that storm control profiles are applied to layer 2 host-facing access interfaces.\n\
    [edit interfaces]\n<interface name> {\n unit 0 {\n family ethernet-switching {\n storm-control <profile name>;\n recovery-timeout\
    \ (10..3600 seconds);\n }\n }\n}\nNote: If a recovery-timeout is not specified, and the storm control profile enforces\n\
    action-shutdown, affected interfaces are disabled until manually enabled by an\nauthorized administrator.\nIf storm control\
    \ is not enabled on all host-facing access interfaces, this is a finding."
  remediation: 'Configure storm control on each host-facing access interface.

    set forwarding-options storm-control-profiles profile-percent all bandwidthpercentage (1..100)

    set forwarding-options storm-control-profiles profile-level all bandwidthlevel (100..100000000 kbps)

    set interfaces <interface name> unit 0 family ethernet-switching stormcontrol <profile name>

    set interfaces <interface name> unit 0 family ethernet-switching recoverytimeout (10..3600 seconds)'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that storm control is enabled on host-facing

      access interfaces.

      Verify storm control profiles at [edit forwarding-options storm-control-profiles] with an

      appropriate bandwidth value (actual bandwidth value or a percentage). By default, ELS

      versions of Junos enable storm control with an 80 percent of bandwidth value, but

      permit setting different values as either an absolute level or a percentage of available

      bandwidth.

      Note: Although percentage of bandwid'
    severity: medium
- id: '1.16'
  title: JUEX-L2-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If STP is used, the Juniper EX switch must be configured to implement Rapid STP, or Multiple STP, where VLANs
    span multiple switches with redundant links. GROUP ID: V-253964 RULE ID: SV-253964r843925'
  rationale: Spanning Tree Protocol (STP) is implemented on bridges and switches to prevent layer 2 loops when a broadcast
    domain spans multiple bridges and switches and when redundant links are provisioned to provide high availability in case
    of link failures. Convergence time can be significantly reduced using Rapid STP (802.1w) instead of STP (802.1d), resulting
    in improved availability. Rapid STP should be deployed by implementing either Rapid Spanning-Tree Protocol (RSTP) or Multiple
    Spanning-Tree Protocol (MSTP), the latter scales much better when there are many VLANs. In cases where VLANs do not span
    multiple switches, it is a best practice to not implement STP. Avoiding the use of STP will provide the most deterministic
    and highly available network topology. If STP is required, then review the switch configuration to verify that Rapid STP
    or Multiple STP has been implemented. RSTP and MSTP are similar, except MSTP is more granular, flexible, and scalable.
    RTSP and MSTP can be enabled simultaneously, but in general only one STP is configured.
  impact: ''
  references: []
  page_start: 51
  audit_raw: "If STP is required, then review the switch configuration to verify that Rapid STP or\nMultiple STP has been\
    \ implemented. RSTP and MSTP are similar, except MSTP is\nmore granular, flexible, and scalable. RTSP and MSTP can be\
    \ enabled simultaneously,\nbut in general only one STP is configured.\nRSTP:\n[edit protocols rstp]\nrstp {\n bridge-priority\
    \ (0..61440 in 4k increments); << e.g. 0, 4k, 8k...60k\n interface <interface name> {\n edge;\n }\n interface <interface\
    \ name-1> {\n mode point-to-point;\n }\n bpdu-block-on-edge;\n}\n-ORMSTP:\n[edit protocols mstp]\nconfiguration-name <name>;\n\
    revision-level (0..65535);\nmax-age (6..40 seconds);\nhello-time (1..10 seconds);\nforward-delay (4..30 seconds);\nbridge-priority\
    \ (0..61440 in 4k increments); << e.g. 0, 4k, 8k...60k\nbpdu-block-on-edge;\ninterface <interface name> {\n edge;\n}\n\
    interface <interface name-1> {\n mode point-to-point;\n}\nmsti 3 {\n bridge-priority (0..61440 in 4k increments); << e.g.\
    \ 0, 4k, 8k...60k\n vlan [ vlan-id-1 vlan-id-2 ];\n}\nIf Rapid STP or Multiple STP has not been implemented where an STP\
    \ is required, this\nis a finding."
  remediation: 'Configure Rapid STP to be implemented at the access and distribution layers where

    VLANs span multiple switches.

    RSTP:

    set protocols rstp bridge-priority (0..61440 in 4k increments) << e.g. 0, 4k,

    8k...60k

    set protocols rstp interface <interface name> edge

    set protocols rstp interface <interface name-1> mode point-to-point

    set protocols rstp bpdu-block-on-edge

    MSTP:

    set protocols mstp configuration-name <name>

    set protocols mstp revision-level (0..65535)

    set protocols mstp max-age (6..40 seconds)

    set protocols mstp hello-time (1..10 seconds)

    set protocols mstp forward-delay (4..30 seconds)

    set protocols mstp bridge-priority (0..61440 in 4k increments) << e.g. 0, 4k,

    8k...60k

    set protocols mstp bpdu-block-on-edge

    set protocols mstp interface <interface name> edge

    set protocols mstp interface <interface name-1> mode point-to-point

    set protocols mstp msti 3 bridge-priority (0..61440 in 4k increments) << e.g.

    0, 4k, 8k...60k

    set protocols mstp msti 3 vlan <VLAN ID 1>

    set protocols mstp msti 3 vlan <VLAN ID 2>'
  checks:
  - type: manual_review
    info: "If STP is required, then review the switch configuration to verify that Rapid STP or\nMultiple STP has been implemented.\
      \ RSTP and MSTP are similar, except MSTP is\nmore granular, flexible, and scalable. RTSP and MSTP can be enabled simultaneously,\n\
      but in general only one STP is configured.\nRSTP:\n[edit protocols rstp]\nrstp {\n bridge-priority (0..61440 in 4k increments);\
      \ << e.g. 0, 4k, 8k...60k\n interface <interface name> {\n edge;\n }\n interface <interface name-1> {\n mode point-to-point;\n\
      \ }\n bpdu-blo"
    severity: medium
- id: '1.17'
  title: JUEX-L2-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to verify two-way connectivity on all interswitch trunked interfaces.
    GROUP ID: V-253965 RULE ID: SV-253965r843928'
  rationale: In topologies where fiber optic interconnections are used, physical misconnections can occur that allow a link
    to appear to be up when there is a mismatched set of transmit/receive pairs. When such a physical misconfiguration occurs,
    protocols such as STP can cause network instability. OAM LFM and LAG are industry standard layer 2 protocols that can
    detect these physical misconfigurations by verifying that traffic is flowing bidirectionally between neighbors. Interfaces
    with OAM configured, and LAG interfaces, periodically transmit packets to neighbor devices. If the packets are not exchanged
    within a specific time frame, the link is flagged as unidirectional and the interface is shut down. OAM LFM and LAG require
    both connected devices to be configured.
  impact: ''
  references: []
  page_start: 54
  audit_raw: "If any of the interfaces have fiber optic interconnections with neighbors, review the\nswitch configuration\
    \ to verify that OAM or LAG is enabled on those interfaces. Because\nOAM and LAG interfaces exchange packets, the neighbor\
    \ device must also be\nconfigured with OAM or LAG.\nVerify OAM connectivity fault management:\n[edit protocols oam ethernet\
    \ link-fault-management]\ninterface <interface name>;\nNote: To enable LFM using default values, specifying the interface\
    \ is sufficient.\nVerify OAM connectivity with custom actions (must match the target environment).\naction-profile <profile\
    \ name> {\n event {\n link-adjacency-loss;\n protocol-down;\n link-event-rate {\n frame-error (1..1000 error(s) per 100\
    \ milli-second);\n frame-period (1..100 error(s) per 100 frames);\n frame-period-summary (1..1000 error(s) per second);\n\
    \ symbol-period (1..100 error(s) per 100 symbol);\n }\n }\n action {\n syslog;\n link-down;\n }\n}\ninterface <interface\
    \ name-1> {\n apply-action-profile <profile name>;\n pdu-interval (100..1000 milliseconds);\n pdu-threshold (5..10);\n\
    \ detect-loc;\n link-discovery active;\n}\ninterface <interface name>;\nVerify LAG on appropriate interfaces:\n[edit interfaces]\n\
    <interface name> {\n ether-options {\n 802.3ad ae<bundle number>;\n }\n}\nae<bundle number> {\n aggregated-ether-options\
    \ {\n lacp {\n active;\n periodic slow;\n }\n }\n unit 0 {\n family ethernet-switching {\n interface-mode trunk;\n vlan\
    \ {\n members [ vlan_name ... vlan_name ];\n }\n }\n }\n}\nNote: The bundle number is an integer value that matches the\
    \ logical LAG interface. For\nexample, physical interface \"ge-0/0/0 ether-options 802.3ad ae0\" is only associated with\n\
    the logical LAG bundle \"ae0\".\nIf the switch has fiber optic interconnections with neighbors and OAM or LAG is not\n\
    enabled, this is a finding."
  remediation: 'Configure the switch to enable OAM or LAG to protect against one-way connections.

    LFM with default values:

    set protocols oam ethernet link-fault-management interface <interface name>

    LAG:

    set interfaces <interface name> ether-options 802.3ad ae<bundle number>

    set interfaces ae<bundle number> aggregated-ether-options lacp

    set interfaces ae<bundle number> unit 0 family ethernet-switching interfacemode trunk

    set interfaces ae<bundle number> unit 0 family ethernet-switching vlan

    members <vlan_name>

    :

    set interfaces ae<bundle number> unit 0 family ethernet-switching vlan

    members <vlan_name>'
  checks:
  - type: manual_review
    info: 'If any of the interfaces have fiber optic interconnections with neighbors, review the

      switch configuration to verify that OAM or LAG is enabled on those interfaces. Because

      OAM and LAG interfaces exchange packets, the neighbor device must also be

      configured with OAM or LAG.

      Verify OAM connectivity fault management:

      [edit protocols oam ethernet link-fault-management]

      interface <interface name>;

      Note: To enable LFM using default values, specifying the interface is sufficient.

      Verify OAM connectivi'
    severity: medium
- id: '1.18'
  title: JUEX-L2-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to assign all explicitly disabled access interfaces to an unused
    VLAN. GROUP ID: V-253966 RULE ID: SV-253966r1082973'
  rationale: It is possible that a configured, but disabled access interface assigned to a user or management VLAN becomes
    enabled by accident or by an attacker and as a result, gains access to that VLAN as a member. Unconfigured Junos interfaces
    are not capable of passing network traffic and do not participate in any user configured VLANs.
  impact: ''
  references: []
  page_start: 57
  audit_raw: "If this is an access interface configured for 802.1x, this is not applicable.\n1. Review the switch configurations\
    \ and examine all configured access interfaces.\n2. Verify each configured access interface not in use has membership\
    \ in an inactive\nVLAN that is not used for any purpose and is not allowed on any trunk links.\nUnconfigured interfaces\
    \ should not be configured \"disabled\" merely to meet this\nrequirement because unconfigured interfaces are incapable\
    \ of passing network\ntraffic. Verify a VLAN is configured for unused interfaces.\nIn the following example, VLAN name\
    \ is \"vlan-disabled\", but that name should match\nlocal naming conventions.\nuser@host> show configuration vlans\nvlan_disabled\
    \ {\n vlan-id <VLAN ID>;\n}\n3. Verify configured, but unused, interfaces are assigned to an unused VLAN either\nindividually\
    \ or via the \"interface-range\" command. Verify interfaces configured via\n\"interface-range\" are not also configured\
    \ individually. Multiple interfaces\nsimultaneously configured via interface-range.\nuser@host> show configuration interfaces\n\
    interface-range <name> {\n member <interface name>;\n member-range <starting interface name> to <ending interface name>;\
    \ <<<\nMember ranges are contiguous from <start interface> to <end interface>\ninclusive\n disable;\n unit 0 {\n family\
    \ ethernet-switching {\n vlan {\n members vlan_disabled;\n }\n }\n }\n}\n4. Individually configured:\nuser@host> show\
    \ configuration interfaces\n<interface name> {\n disable;\n unit 0 {\n family ethernet-switching {\n vlan {\n members\
    \ vlan_disabled;\n }\n }\n }\n}\n5. In the following example, \"vlan_disabled\" is designated for all configured, but\n\
    disabled interfaces, and must not be configured on any trunked interface. Verify\nthe unused VLAN is NOT a member of any\
    \ trunked interface as in the example\nbelow.\nuser@host> show configuration interfaces\n<interface name> {\n unit <logical\
    \ unit> {\n family {\n ethernet-switching {\n interface-mode trunk;\n vlan {\n members [ vlan_name vlan_disabled ];\n\
    \ }\n }\n }\n }\n}\n6. Verify if there are unconfigured physical interfaces. These interfaces should not\nbe configured\
    \ merely to set them disabled because they are already incapable of\npassing network traffic, participating in protocols,\
    \ and are not members of any\nuser configured VLANS.\nuser@host> show interfaces terse\nge-0/0/0 up up\nge-0/0/0.0 up\
    \ up eth-switch\nge-0/0/1 up up\nge-0/0/1.0 up up eth-switch\n…<snip>…\nge-0/0/5 up down\nge-0/0/5.16386 up down\nge-0/0/6\
    \ up down\nge-0/0/6.16386 up down\nge-0/0/7 up down\nge-0/0/7.16386 up down\n7. As shown in the example above, ge-0/0/5\
    \ through ge-0/0/7 are unconfigured\ninterfaces. Verify there is no configuration stanza for these interfaces.\nuser@host>\
    \ show configuration interfaces\nge-0/0/0 {\n unit 0 {\n family ethernet-switching {\n vlan {\n members <VLAN name>;\n\
    \ }\n }\n }\n}\nge-0/0/1 {\n unit 0 {\n family ethernet-switching {\n vlan {\n members <VLAN name>;\n }\n }\n }\n}\n…<snip>…\n\
    xe-0/1/0 {\n ether-options {\n 802.3ad ae0;\n }\n}\n8. The example above shows that ge-0/0/1 is the last configured access\
    \ interface\nand the next configured interface is a 10GbE Link Aggregation Group (LAG)\nmember. Because Junos lists interface\
    \ names in ascending order, the example\nunconfigured interfaces (ge-0/0/5 through ge-0/0/7) would appear between the\n\
    configured interfaces ge-0/0/1 and xe-0/1/0. Therefore, the subject interfaces,\nwhile present on the device, are not\
    \ configured and are incapable of passing\nnetwork traffic.\nIf there are any configured, but disabled access interfaces\
    \ not in an inactive VLAN, this\nis a finding."
  remediation: 'Disable all configured access interfaces not in use and assign to an inactive VLAN, or

    remove the interface configuration from the device. Switch ports configured for 802.1x

    are exempt from this requirement.

    1. In this example, "vlan_disabled" is the name given to the VLAN for unused

    interfaces. This VLAN name can be any legal name.

    2. Configure a range of interfaces.

    user@host> configure

    user@host# set vlans vlan_disabled vlan-id <VLAN ID>

    user@host# set interfaces interface-range <name> member <interface name>

    user@host# set interfaces interface-range <name> member-range <starting

    interface name> to <ending interface name>

    user@host# set interfaces interface-range <name> disable

    user@host# set interfaces interface-range <name> unit 0 family ethernetswitching vlan members vlan_disabled

    3. Configure individual interfaces.

    set interfaces <interface name> disable

    set interfaces <interface name> unit 0 family ethernet-switching vlan members

    vlan_disabled

    4. Delete the unused VLAN from all trunked interfaces.

    user@host# delete interfaces <trunked interface> unit 0 family ethernetswitching vlan members vlan_disabled

    5. Remove the access interface configuration from unused interfaces.

    user@host# delete interfaces <interface name>'
  checks:
  - type: sql
    command: show configuration vlans
    severity: medium
    info: 'If this is an access interface configured for 802.1x, this is not applicable.

      1. Review the switch configurations and examine all configured access interfaces.

      2. Verify each configured access interface not in use has membership in an inactive

      VLAN that is not used for any purpose and is not allowed on any trunk links.

      Unconfigured interfaces should not be configured "disabled" merely to meet this'
- id: '1.19'
  title: JUEX-L2-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must not be configured with VLANs used for L2 control traffic assigned to any host-facing
    access interface. GROUP ID: V-253967 RULE ID: SV-253967r997518'
  rationale: In a switched Ethernet network, some protocols use L2 Protocol Data Units (PDU) to communicate in-band management
    or other control information. This control traffic is inappropriate for host-facing access interfaces because those devices
    are not part of the switching infrastructure. Juniper switches do not automatically carry this L2 control traffic in the
    default VLAN or automatically assign the default VLAN to all trunks, reducing the scope of potential misuse. Preventing
    host-facing access interfaces from participating in the L2 control traffic communications further reduces the risk of
    inadvertent (or malicious) interference.
  impact: ''
  references: []
  page_start: 61
  audit_raw: "Review the switch configurations and verify all access interfaces are assigned to a\nconfigured VLAN not used\
    \ for L2 control traffic.\nIf assigning via interface-range, the configuration will be similar to the example.\n[edit\
    \ interfaces]\ninterface-range <name> {\n member <interface name>;\n member-range <starting interface name> to <ending\
    \ interface name>; <<<\nMember ranges are contiguous from <start interface> to <end interface>\ninclusive\n unit 0 {\n\
    \ family ethernet-switching {\n vlan {\n members <vlan name>;\n }\n }\n }\n}\nIf assigning individually, the configuration\
    \ will be similar to the example.\n[edit interfaces]\n<interface name> {\n unit 0 {\n family ethernet-switching {\n vlan\
    \ {\n members <vlan name>;\n }\n }\n }\n}\nVerify the assigned VLANs are configured.\n[edit vlans]\n<vlan name> {\n vlan-id\
    \ <VLAN ID>;\n}\nNote: Assigning interfaces to a VLAN automatically removes them from the default\nVLAN.\nIf there are\
    \ access interfaces assigned to the VLANs used for L2 control traffic, this is a\nfinding."
  remediation: 'Assign all access interfaces to a VLAN not used for L2 control traffic.

    Interface range configuration:

    set interfaces interface-range name member <interface name>

    set interfaces interface-range name member-range <starting interface name> to

    <ending interface name>

    set interfaces interface-range name unit 0 family ethernet-switching vlan

    members <vlan name>

    Individual interface configuration:

    set interfaces <interface name> unit 0 family ethernet-switching vlan members

    <vlan name>

    Configure the VLAN:

    set vlans <vlan name> vlan-id <VLAN ID>'
  checks:
  - type: manual_review
    info: "Review the switch configurations and verify all access interfaces are assigned to a\nconfigured VLAN not used for\
      \ L2 control traffic.\nIf assigning via interface-range, the configuration will be similar to the example.\n[edit interfaces]\n\
      interface-range <name> {\n member <interface name>;\n member-range <starting interface name> to <ending interface name>;\
      \ <<<\nMember ranges are contiguous from <start interface> to <end interface>\ninclusive\n unit 0 {\n family ethernet-switching\
      \ {\n vlan {\n members <vlan"
    severity: medium
- id: '1.20'
  title: JUEX-L2-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to prune the default VLAN from all trunked interfaces that do not
    require it. GROUP ID: V-253968 RULE ID: SV-253968r843937'
  rationale: All unassigned interfaces are placed into the default VLAN and devices connected to enabled, but unassigned interfaces
    can communicate within that VLAN. Although the default VLAN is not automatically assigned to any trunked interface, if
    the default VLAN must be trunked or a misconfigured trunk unintentionally includes the default VLAN, unauthorized devices
    connected to enabled but unassigned access interfaces could gain network connectivity beyond the local switch.
  impact: ''
  references: []
  page_start: 63
  audit_raw: "Review the switch configuration and verify that the default VLAN is pruned from trunk\nlinks that do not require\
    \ it.\n[edit interfaces]\n<interface name> {\n unit 0 {\n family ethernet-switching {\n interface-mode trunk;\n vlan {\n\
    \ members [ vlan_name ... vlan_name ];\n }\n }\n }\n}\nIf the default VLAN is not pruned from trunk links that should\
    \ not be transporting frames\nfor that VLAN, this is a finding."
  remediation: 'Remove unnecessary VLANs from trunked interfaces.

    delete interfaces <trunked interface name> unit 0 family ethernet-switching

    vlan members <default | other unnecessary VLAN name>'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that the default VLAN is pruned from trunk\nlinks that do not require\
      \ it.\n[edit interfaces]\n<interface name> {\n unit 0 {\n family ethernet-switching {\n interface-mode trunk;\n vlan\
      \ {\n members [ vlan_name ... vlan_name ];\n }\n }\n }\n}\nIf the default VLAN is not pruned from trunk links that should\
      \ not be transporting frames\nfor that VLAN, this is a finding."
    severity: medium
- id: '1.21'
  title: JUEX-L2-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must not use the default VLAN for management traffic. GROUP ID: V-253969 RULE ID: SV-253969r997519'
  rationale: By default, all unassigned interfaces are placed into the default VLAN and if used for management, could unintentionally
    expose sensitive traffic or protected resources to unauthorized devices.
  impact: ''
  references: []
  page_start: 65
  audit_raw: "Review the switch configuration and verify that the default VLAN is not used to access\nthe switch for management.\n\
    Verify access interfaces used for management are assigned to an appropriate VLAN as\nin the example below.\n[edit interfaces]\n\
    <interface name> {\n unit 0 {\n family ethernet-switching {\n interface-mode access;\n vlan {\n members <vlan name>;\n\
    \ }\n }\n }\n}\nIf the default VLAN is being used to access the switch, this is a finding."
  remediation: 'Configure the switch for management access to use a VLAN other than the default

    VLAN.

    set interfaces <interface name> unit 0 family ethernet-switching interfacemode access

    set interfaces <interface name> unit 0 family ethernet-switching vlan members

    <vlan name>'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that the default VLAN is not used to access\nthe switch for management.\n\
      Verify access interfaces used for management are assigned to an appropriate VLAN as\nin the example below.\n[edit interfaces]\n\
      <interface name> {\n unit 0 {\n family ethernet-switching {\n interface-mode access;\n vlan {\n members <vlan name>;\n\
      \ }\n }\n }\n}\nIf the default VLAN is being used to access the switch, this is a finding."
    severity: medium
- id: '1.22'
  title: JUEX-L2-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to set all enabled user-facing or untrusted ports as access interfaces.
    GROUP ID: V-253970 RULE ID: SV-253970r1082976'
  rationale: By default, unconfigured (or expressly disabled) Junos interfaces are unusable. Any enabled interface configured
    with the family ethernet-switching uses interface-mode access by default, which meets this requirement. Trunked interfaces
    must be explicitly configured for operational requirements (e.g., interswitch links), which makes them trusted and not
    user-facing. Configuring enabled user-facing or untrusted interfaces as trunked may expose network traffic to an unauthorized,
    or unintended, connected endpoint. Access interfaces can belong to a single VLAN rather than the multiple VLANs supported
    by trunks, which limits potential exposure to a smaller subset of the total network traffic. Access interfaces also behave
    differently than trunked interfaces, especially with respect to control plane traffic. For example, access interfaces
    can be marked as "edge" for protocols like Rapid Spanning Tree (RSTP) or Multiple Spanning Tree (MSTP) where specific
    protections can be applied to prevent the switch from accepting Bridge Protocol Data Units (BPDU) from unauthorized sources
    and causing a network topology change or disruption. Additionally, network level protection mechanisms, like 802.1x or
    sticky-mac, are applied to access interfaces and these protection mechanisms help prevent unauthorized network access.
  impact: ''
  references: []
  page_start: 67
  audit_raw: "Review the switch configuration and examine all enabled user-facing or untrusted\ninterfaces configured with\
    \ family ethernet-switching.\n1. Interfaces implicitly configured with \"interface-mode\" access and family ethernetswitching.\
    \ Note: The default interface-mode is \"access\".\nuser@host> show configuration interfaces\n<interface name> {\n unit\
    \ 0 {\n family ethernet-switching {\n }\n }\n}\n2. Interfaces explicitly configured with \"interface-mode\" access and\
    \ family ethernetswitching.\nuser@host> show configuration interfaces\n<interface name> {\n unit 0 {\n family ethernet-switching\
    \ {\n interface-mode access;\n }\n }\n}\nIf any of the enabled user-facing access interfaces are configured as a trunk,\
    \ this is a\nfinding."
  remediation: 'Disable trunking on all enabled user-facing or untrusted access interfaces.

    Delete "interface-mode" from an enabled user-facing or untrusted interface to inherit the

    default access mode.

    user@host> configure

    user@host# delete interfaces <interface name> unit 0 family ethernetswitching interface-mode

    Alternatively, explicitly set the enabled user-facing or untrusted interface mode to

    access.

    user@host> configure

    user@host# set interfaces <interface name> unit 0 family ethernet-switching

    interface-mode access'
  checks:
  - type: sql
    command: show configuration interfaces
    severity: medium
    info: "Review the switch configuration and examine all enabled user-facing or untrusted\ninterfaces configured with family\
      \ ethernet-switching.\n1. Interfaces implicitly configured with \"interface-mode\" access and family ethernetswitching.\
      \ Note: The default interface-mode is \"access\".\nuser@host> show configuration interfaces\n<interface name> {\n unit\
      \ 0 {\n family ethernet-switching {\n }\n }\n}\n2. Interfaces exp"
- id: '1.23'
  title: JUEX-L2-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must not have a native VLAN ID assigned, or have a unique native VLAN ID, for all 802.1q
    trunk links. GROUP ID: V-253971 RULE ID: SV-253971r843946'
  rationale: By default, Juniper switches do not assign a native VLAN to any trunked interface. Allowing trunked interfaces
    to accept untagged data packets may unintentionally expose VLANs to unauthorized devices that could result in network
    exploration, unauthorized resource access, or a DoS condition. If a network function requires a native VLAN it must be
    unique.
  impact: ''
  references: []
  page_start: 69
  audit_raw: "Review the switch configuration and examine all trunked interfaces to verify no native\nVLAN ID is assigned.\
    \ If a native VLAN has been assigned, verify the VLAN is unique.\nBy default, there are no native VLANs assigned to any\
    \ trunked interface.\nVerify trunked interface do not have a native VLAN ID configured.\n[edit interfaces]\n<interface\
    \ name> {\n unit 0 {\n family ethernet-switching {\n interface-mode trunk;\n vlan {\n members [ vlan_name ... vlan_name\
    \ ];\n }\n }\n }\n}\nIf trunked interfaces require a native VLAN, verify it is unique.\n[edit interfaces]\n<interface\
    \ name> {\n native-vlan-id <unique VLAN ID>;\n unit 0 {\n family ethernet-switching {\n interface-mode trunk;\n vlan {\n\
    \ members [ vlan_name ... vlan_name ];\n }\n }\n }\n}\nNote: By default, Juniper switches do not automatically assign\
    \ a native VLAN.\nConfiguring an interface with \"interface-mode trunk\" does not automatically assign the\ndefault VLAN.\n\
    Verify any VLAN assigned as native for any trunked interface has been configured.\n[edit vlans]\nnative_vlan_name {\n\
    \ vlan-id <VLAN ID>;\n}\nIf trunked interfaces do not have a native VLAN ID configured, this is not a finding.\nIf a native\
    \ VLAN is configured and does not have a unique VLAN ID, this is a finding."
  remediation: 'To ensure the integrity of the trunk link, either remove the native VLAN ID or configure

    the native VLAN ID with a unique value. If used, the native VLAN ID must be the same

    on both ends of the trunk link.

    Example deleting a native VLAN ID:

    delete interfaces <interface name> native-vlan-id

    Example configuring a native VLAN ID:

    set interfaces <interface name> native-vlan-id <VLAN ID not 1>

    Example configuring a VLAN used as native for any trunked interface:

    set vlans vlan_name vlan-id 30'
