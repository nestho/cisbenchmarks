- id: '1.7'
  title: JUEX-L2-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to authenticate all network-connected endpoint devices before establishing
    any connection. GROUP ID: V-253954 RULE ID: SV-253954r1082969'
  rationale: 'Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. Device authentication is a solution enabling an organization to manage devices. It is an additional layer of
    authentication ensuring only specific pre-authorized devices can access the system. This requirement applies to applications
    that connect either locally, remotely, or through a network to an endpoint device (including, but not limited to, workstations,
    printers, servers (outside a datacenter), VoIP Phones, and VTC CODECs. Gateways and SOA applications are examples of where
    this requirement would apply. For Juniper EX, configure 802.1 x authentication on all host-facing access interfaces. To
    authenticate those devices that do not support an 802.1x supplicant, Static MAC Bypass or MAC RADIUS must be configured.
    Junos supports three supplicant types: single-secure (authenticate and permit only a single device), multiple (separately
    authenticate and permit multiple devices), and single (authenticate the first supplicant and permit all others). The authentication
    order must be appropriate for the target environment. Authentication must be configured on all access interfaces connecting
    to LAN outlets or devices not located in the telecom room, wiring closets, or equipment rooms.'
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Verify the switch configuration has 802.1x authentication implemented for all access\ninterfaces connecting\
    \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment rooms.\
    \ Static MAC Bypass or MAC\nRADIUS must be configured on access interfaces connected to devices that do not\nsupport an\
    \ 802.1x supplicant. Junos supports three supplicant types: single-secure\n(authenticate and permit only a single device),\
    \ multiple (separately authenticate and\npermit multiple devices), and single (authenticate the first supplicant and permit\
    \ all\nothers).\nVerify the available RADIUS server(s) are configured. RADIUS servers can be\nconfigured globally at [edit\
    \ access radius-server] or defined for each group.\nuser@host> show configuration access\nradius-server {\n <RADIUS IPv4\
    \ or IPv6 address> secret \"PSK\"; ## SECRET-DATA\n}\nprofile dot1x_radius {\n authentication-order radius;\n radius {\n\
    \ authentication-server <RADIUS IPv4 or IPv6 address>; <<< Must be\ndefined if using global RADIUS server. Optional if\
    \ RADIUS is defined\nspecifically for the profile.\n }\n radius-server {\n <RADIUS IPv4 or IPv6 address> secret \"PSK\"\
    ; ## SECRET-DATA <<< Must\nbe defined if not using global RADIUS server. Takes precedence if both\nprofile and global\
    \ RADIUS is configured.\n }\n}\nVerify 802.1x or MAC RADIUS is configured on all host-facing access interfaces when\n\
    RADIUS is available as shown in the following example. The default authentication\norder is dot1x, mac-radius, and captive-portal.\
    \ This order is applied to all interfaces\nwithout the authentication order directive configured (int-01 shown below).\
    \ For\ninterfaces with connected devices that do not support 802.1x (int-02 below), it may be\nnecessary to change the\
    \ authentication order because the device authentication\nattempt may timeout before the switch fails over from dot1x\
    \ to mac-radius. When\nrestricting to mac-radius authentication only (int-03 below), the authentication order\ncannot\
    \ be set.\nuser@host> show configuration protocols dot1x\nauthenticator {\n authentication-profile-name dot1x_radius;\n\
    \ interface {\n <int-01 name> { <<< Connected device with 802.1x supplicant\n supplicant single-secure;\n }\n <int-02\
    \ name> { <<< Connected device with 802.1x supplicant and\ninterface support for MAC RADIUS, MAC RADIUS authentication\
    \ preferred\n authentication-order [ mac-radius dot1x captive-portal ];\n supplicant multiple;\n mac-radius;\n }\n <int-03\
    \ name> { <<< Connected device without 802.1x supplicant\n mac-radius {\n restrict;\n }\n }\n }\n}\nNote: The interface\
    \ names, supplicant type, MAC RADIUS support, and authentication\norder must be appropriate for the target environment.\n\
    If RADIUS is unavailable or not configured:\nuser@host> show configuration protocols dot1x\nauthenticator {\n static {\n\
    \ <MAC address>/48 {\n vlan-assignment <vlan name>;\n interface <interface name>.<logical unit>;\n }\n }\n}\nIf 802.1x\
    \ authentication, Static MAC Bypass, or MAC RADIUS is not configured on all\naccess interfaces connecting to LAN outlets\
    \ or devices not located in the telecom room,\nwiring closets, or equipment rooms, this is a finding."
  remediation: 'Configure 802.1 x authentication on all host-facing access interfaces. To authenticate

    those devices that do not support an 802.1x supplicant, Static MAC Bypass or MAC

    RADIUS must be configured. The authentication order must be appropriate for the

    target environment.

    Configure RADIUS if available:

    user@host> configure

    user@host# set access radius-server <RADIUS IPv4 or IPv6 address (global)>

    secret "<PSK>"

    user@host# set access profile dot1x_radius authentication-order radius

    user@host# set access profile dot1x_radius radius authentication-server

    <RADIUS IPv4 or IPv6 address (global)>

    -oruser@host# set access profile dot1x_radius radius-server <RADIUS IPv4 or IPv6

    address> secret "<PSK>"

    To configure 802.1x on an access interface using the default authentication order:

    user@host# set protocols dot1x authenticator authentication-profile-name

    dot1x_radius

    user@host# set protocols dot1x authenticator interface <int-01> supplicant

    single-secure

    To configure 802.1x and MAC RADIUS on an access interface and prefer MAC

    RADIUS in the authentication order:

    user@host# set protocols dot1x authenticator interface <int-02>

