- id: '1.8'
  title: JUEX-L2-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper EX switch must be configured to enable Root Protection on STP switch ports connecting to access
    layer switches. GROUP ID: V-253955 RULE ID: SV-253955r1082970'
  rationale: 'Spanning Tree Protocol (STP) does not provide any means for the network administrator to securely enforce the
    topology of the switched network. Any switch can be the root bridge in a network. However, a more optimal forwarding topology
    places the root bridge at a specific predetermined location. With the standard STP, any bridge in the network with a lower
    bridge ID takes the role of the root bridge. The administrator cannot enforce the position of the root bridge but can
    set the root bridge priority to zero in an effort to secure the root bridge position. The Root Protection feature provides
    a way to enforce the root bridge placement in the network. If the bridge receives superior STP Bridge Protocol Data Units
    (BPDUs) on a Root Protection-enabled interface, Root Protection ignores the superior BPDU and places the interface into
    block and a root-inconsistent state. To enforce the position of the root bridge it is imperative that Root Protection
    is enabled on all interfaces where the root bridge should never appear. Note: Although Loop Protection can be applied
    to all nondesignated ports, JUEX-L2000100 requires that Loop Protection be applied to all user-facing access switch ports.
    Thus, Loop Protection must only be applied to all nondesignated ports that are not also user-facing access switch ports.
    Loop Protection and Root Protection cannot be applied to the same port. Additionally, note that configuring BPDU Protection
    and Root Protection on the same interface is supported because BPDU protection includes Root Protection.'
  impact: ''
  references: []
  page_start: 33
  audit_raw: "Review the switch topology as well as the switch configuration to verify that Root\nProtection is enabled on\
    \ all interfaces connecting to access layer switches.\n[edit protocols]\nmstp {\n interface <interface name> {\n no-root-port;\n\
    \ }\n}\nIf Root Protection is not enabled on all interfaces connecting to access layer switches,\nthis is a finding."
  remediation: 'Configure the switch to have Root Protection enabled on all switch ports connecting to

    access layer switches and hosts using trunked interfaces.

    set protocols mstp interface <interface name> no-root-port'
  checks:
  - type: manual_review
    info: "Review the switch topology as well as the switch configuration to verify that Root\nProtection is enabled on all\
      \ interfaces connecting to access layer switches.\n[edit protocols]\nmstp {\n interface <interface name> {\n no-root-port;\n\
      \ }\n}\nIf Root Protection is not enabled on all interfaces connecting to access layer switches,\nthis is a finding."
    severity: medium
- id: '1.9'
  title: JUEX-L2-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enable BPDU Protection on all user-facing or untrusted access
    switch ports. GROUP ID: V-253956 RULE ID: SV-253956r843901'
  rationale: If a rogue switch is introduced into the topology and transmits a Bridge Protocol Data Unit (BPDU) with a lower
    bridge priority than the existing root bridge, it will become the new root bridge and cause a topology change, rendering
    the network in a suboptimal state. BPDU Protection allows network designers to enforce the STP domain borders and keep
    the active topology predictable. The devices behind interfaces that have BPDU Protection enabled are not able to influence
    the STP topology. At the reception of BPDUs, BPDU Protection disables the port and logs the condition.
  impact: ''
  references: []
  page_start: 35
  audit_raw: "Review the switch configuration to verify that BPDU Protection is enabled on all userfacing or untrusted access\
    \ switch interfaces.\nBPDU Protection discards all BPDUs received on a configured interface and stops\nforwarding on that\
    \ interface. In contrast, Root Protection discards only superior root\nBPDUs but accepts remaining BPDU types. Verify\
    \ BDPU Protection (bpdu-block-onedge) and the edge interfaces where no BPDUs are expected.\n[protocols]\nmstp {\n bpdu-block-on-edge;\n\
    \ interface <interface name> {\n edge;\n }\n}\nNote: Configuring BPDU Protection and Root Protection on the same interface\
    \ is\nsupported, but redundant because BPDU protection includes Root Protection.\nIf the switch has not enabled BPDU Protection,\
    \ this is a finding."
  remediation: 'Configure the switch to have BPDU Protection enabled on all user-facing or untrusted

    access switch interfaces.

    set protocols mstp bpdu-block-on-edge

    set protocols mstp interface <interface name> edge

    Note: Configuring BPDU Protection and Root Protection on the same interface is

    supported, but redundant because BPDU protection includes Root Protection.'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that BPDU Protection is enabled on all userfacing or untrusted access\
      \ switch interfaces.\nBPDU Protection discards all BPDUs received on a configured interface and stops\nforwarding on\
      \ that interface. In contrast, Root Protection discards only superior root\nBPDUs but accepts remaining BPDU types.\
      \ Verify BDPU Protection (bpdu-block-onedge) and the edge interfaces where no BPDUs are expected.\n[protocols]\nmstp\
      \ {\n bpdu-block-on-edge;\n interface <interface name"
