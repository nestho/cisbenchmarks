controls:
- id: '1.1'
  title: JUEX-L2-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to disable non-essential capabilities. GROUP ID: V-253948 RULE ID:
    SV-253948r843877'
  rationale: A compromised switch introduces risk to the entire network infrastructure as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each switch is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Review the switch configuration and verify the switch does not have an unnecessary or\nnon-secure services enabled.\
    \ For example, the following directives should not be in the\nconfiguration (deleted) or, if present, must be disabled\
    \ (inactive):\nVerify the following commands are not present:\n[edit system services]\nfinger;\nftp;\nrlogin;\ntelnet;\n\
    xnm-clear-text;\ntftp;\nrest {\n http;\n}\nweb-management {\n http;\n https;\n}\nNote: If the services listed above are\
    \ marked \"inactive\", they are not enabled. For\nexample, although the FTP stanza is present in the following snippet,\
    \ it is disabled\n(inactive):\n[edit system services]\ninactive: ftp;\nBecause J-Web was not included in the FIPS certification,\
    \ verify the web-management\nprocess is disabled.\n[edit system services]\nweb-management disable;\n```\nIf any unnecessary\
    \ services are enabled, this is a finding."
  remediation: 'Disable the following services:

    If present, delete the following directives:

    • delete system services finger

    • delete system services ftp

    • delete system services rlogin

    • delete system services telnet

    • delete system services xnm-clear-text

    • delete system services tftp

    • delete system services rest http

    • delete system services web-management

    Disable the web-management process:

    • set system processes web-management disable'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify the switch does not have an unnecessary or\nnon-secure services enabled.\
      \ For example, the following directives should not be in the\nconfiguration (deleted) or, if present, must be disabled\
      \ (inactive):\nVerify the following commands are not present:\n[edit system services]\nfinger;\nftp;\nrlogin;\ntelnet;\n\
      xnm-clear-text;\ntftp;\nrest {\n http;\n}\nweb-management {\n http;\n https;\n}\nNote: If the services listed above\
      \ are marked \"inactive\", they are not enabled. For\nex"
    severity: medium
- id: '1.2'
  title: JUEX-L2-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper EX switch must be configured to uniquely identify all network-connected endpoint devices before
    establishing any connection. GROUP ID: V-253949 RULE ID: SV-253949r843880'
  rationale: Controlling LAN access via 802.1x authentication can assist in preventing a malicious user from connecting an
    unauthorized PC to an access interface to inject or receive data from the network without detection. 802.1x includes Static
    MAC Bypass and MAC RADIUS for those devices that do not offer a supplicant.
  impact: ''
  references: []
  page_start: 13
  audit_raw: "Verify the switch configuration has 802.1x authentication implemented for all access\ninterfaces connecting\
    \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment rooms.\
    \ Static MAC Bypass or MAC\nRADIUS must be configured on access interfaces connected to devices that do not\nsupport an\
    \ 802.1x supplicant. Junos supports three supplicant types: 'single-secure'\n(authenticate and permit only a single device),\
    \ 'multiple' (separately authenticate and\npermit multiple devices), and 'single' (authenticate the first supplicant and\
    \ permit all\nothers).\nVerify that the RADIUS server(s) are configured. RADIUS servers can be configured\nglobally at\
    \ [edit access radius-server] or defined for each group.\n[edit access]\nradius-server {\n <RADIUS IPv4 or IPv6 address>\
    \ secret \"PSK\"; ## SECRET-DATA\n}\nprofile dot1x_radius {\n authentication-order radius;\n radius {\n authentication-server\
    \ <RADIUS IPv4 or IPv6 address>;\n }\n--or--\nradius-server {\n <RADIUS IPv4 or IPv6 address> secret \"PSK\"; ## SECRET-DATA\n\
    \ }\n}\nVerify 802.1x or MAC RADIUS is configured on all host-facing access interfaces when\nRADIUS is available as shown\
    \ in the following example:\n[edit protocols dot1x]\nauthenticator {\n authentication-profile-name dot1x_radius;\n interface\
    \ {\n ge-0/0/0.0 { <<< Connected device with 802.1x supplicant\n supplicant single-secure;\n }\n ge-0/0/1.0 { <<< Connected\
    \ device with 802.1x supplicant and\ninterface support for MAC RADIUS\n supplicant multiple;\n mac-radius;\n }\n ge-0/0/2.0\
    \ { <<< Connected device without 802.1x supplicant\n mac-radius {\n restrict;\n }\n }\n }\n}\nNote: Junos simultaneously\
    \ supports both 802.1x and MAC RADIUS on the same\naccess interface. To prevent 802.1x and have the interface use only\
    \ MAC RADIUS,\nconfigure the \"restrict\" qualifier.\nIf RADIUS is unavailable or not configured:\n[edit protocols]\n\
    dot1x {\n authenticator {\n static {\n <MAC address>/48 {\n vlan-assignment <vlan name>;\n interface <interface name>.<logical\
    \ unit>;\n }\n }\n }\n}\nIf the switch does not uniquely identify all network-connected endpoint devices before\nestablishing\
    \ any connection for access interfaces connecting to LAN outlets or devices\nnot located in the telecom room, wiring closets,\
    \ or equipment rooms, this is a finding."
  remediation: 'Configure 802.1 x authentication on all host-facing access interfaces. To authenticate

    those devices that do not support an 802.1x supplicant, Static MAC Bypass or MAC

    RADIUS must be configured.

    Configure RADIUS if available:

    set access radius-server <RADIUS IPv4 or IPv6 address> secret "<PSK>"

    set access profile dot1x_radius radius authentication-server <RADIUS IPv4 or

    IPv6 address>

    -orset access profile dot1x_radius radius-server <RADIUS IPv4 or IPv6 address>

    secret "<PSK>"

    set access profile dot1x_radius authentication-order radius

    To configure 802.1x on an access interface:

    set protocols dot1x authenticator authentication-profile-name dot1x_radius

    set protocols dot1x authenticator interface <name>.<logical unit> supplicant

    single-secure

    --or--

    set protocols dot1x authenticator interface <name>.<logical unit> supplicant

    multiple

    --or--

    set protocols dot1x authenticator interface <name>.<logical unit> supplicant

    multiple

    set protocols dot1x authenticator interface <name>.<logical unit> mac-radius

    set protocols dot1x authenticator interface <name>.<logical unit> mac-radius

    restrict

    Note: Configure the "restrict" keyword if the connected device does not support a

    supplicant. Although a non 802.1x aware client will use MAC RADIUS if configured,

    without the "restrict" keyword 802.1x authentication is attempted before attempting MAC

    RADIUS, which increases the time the device must wait before gaining network access.

    To configure Static MAC Bypass:

    set protocols dot1x authenticator static <MAC address>/48 vlan-assignment

    <vlan name>

    set protocols dot1x authenticator static <MAC address>/48 interface

    <interface name>.<logical unit>'
  checks:
  - type: manual_review
    info: 'Verify the switch configuration has 802.1x authentication implemented for all access

      interfaces connecting to LAN outlets (i.e., RJ-45 wall plates) or devices not located in

      the telecom room, wiring closets, or equipment rooms. Static MAC Bypass or MAC

      RADIUS must be configured on access interfaces connected to devices that do not

      support an 802.1x supplicant. Junos supports three supplicant types: ''single-secure''

      (authenticate and permit only a single device), ''multiple'' (separately authenticat'
    severity: medium
- id: '1.3'
  title: JUEX-L2-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper layer 2 switch must be configured to disable all dynamic VLAN registration protocols. GROUP ID:
    V-253950 RULE ID: SV-253950r843883'
  rationale: Dynamic VLAN registration protocols provide centralized management of VLAN domains, which can reduce administration
    in a switched network. Interfaces are assigned to VLANs and the VLAN is dynamically registered on the trunked interface.
    Removing the last active interface from the VLAN automatically prunes the VLAN from the trunked interface, preserving
    bandwidth. Member switches remain synchronized via the exchange of Protocol Data Units (PDU). Protocols like Cisco VLAN
    Trunk Protocol (VTP) and IEEE 802.1ak Multiple VLAN Registration Protocol (MVRP) permit dynamically registering/de-registering
    VLANs on trunked interfaces. Without authentication, forged PDUs can allow access to previously inaccessible VLANs, or
    inclusion of unauthorized VLANs or switches. Only VTP currently supports authentication.
  impact: ''
  references: []
  page_start: 16
  audit_raw: "Review the switch configuration to verify if dynamic VLAN registration protocols are\nenabled. If dynamic VLAN\
    \ registration protocols are enabled, verify that authentication\nhas been configured.\nJuniper switches do not support\
    \ VTP. Although Juniper switches support MVRP, it is\ndisabled by default (there is no [edit protocols mvrp] stanza).\
    \ Verify MVRP is not\nenabled as shown below.\n[edit protocols]\nmvrp {\n interface <name>;\n}\nIf dynamic VLAN registration\
    \ protocols have been configured on the switch and are not\nauthenticating messages with a hash function using the most\
    \ secured cryptographic\nalgorithm available, this is a finding."
  remediation: 'Configure the switch to disable all dynamic VLAN registration protocols.

    delete protocols mvrp'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify if dynamic VLAN registration protocols are\nenabled. If dynamic VLAN\
      \ registration protocols are enabled, verify that authentication\nhas been configured.\nJuniper switches do not support\
      \ VTP. Although Juniper switches support MVRP, it is\ndisabled by default (there is no [edit protocols mvrp] stanza).\
      \ Verify MVRP is not\nenabled as shown below.\n[edit protocols]\nmvrp {\n interface <name>;\n}\nIf dynamic VLAN registration\
      \ protocols have been configured on the swit"
    severity: medium
- id: '1.4'
  title: JUEX-L2-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to manage excess bandwidth to limit the effects of packet flooding
    types of denial-of-service (DoS) attacks. GROUP ID: V-253951 RULE ID: SV-253951r1082966'
  rationale: 'DoS attacks can be mitigated by ensuring sufficient capacity is available for missioncritical traffic. Managing
    capacity may include, for example, establishing selected network usage priorities or quotas and enforcing them using rate
    limiting, quality of service (QoS), or other resource reservation control methods. These measures may also mitigate the
    effects of sudden decreases in network capacity that are the result of accidental or intentional physical damage to telecommunications
    facilities (such as cable cuts or weather-related outages). A Junos OS classifier identifies and separates traffic flows
    and provides the means to prioritize traffic later in the class-of-service (CoS) process. By default, Junos implements
    a standard CoS (QoS) strategy. Although some devices implement different queues or queue numbers, generally there is at
    least a four-queue model with two active queues: 95 percent Best Effort (BE) and 5 percent Network Control (NE). A behavior
    aggregate (BA) classifier performs this function by associating discriminating values with forwarding classes and loss
    priorities. Unless overridden, Junos OS applies the default CoS to all interfaces. Junos OS provides multiple predefined
    BA classifier types, which the site can combine and supplement with custom CoS configuration as needed to achieve overall
    traffic classification goals.'
  impact: ''
  references: []
  page_start: 18
  audit_raw: "Review the switch configuration to verify that Class-of-Service (CoS) has been enabled.\nEnsure sufficient capacity\
    \ is available for mission-critical traffic to enforce the traffic\npriorities specified by the Combatant Commanders/Services/Agencies.\n\
    By default, Junos implements a standard CoS (QoS) strategy. Although some devices\nimplement different queues or queue\
    \ numbers, generally there is at least a four-queue\nmodel with two active queues: 95 percent Best Effort (BE) and 5 percent\
    \ Network\nControl (NC). Verify additional queues are configured to support the traffic priorities of\nthe Combatant Commanders/Services/Agencies.\n\
    The example CoS below adds a queue for one type of prioritized traffic. The example\nshows the interdependency of the\
    \ classifiers, the schedulers, and the interfaces but the\nnames, classifier code points, and scheduler rates are only\
    \ examples. The names, code\npoints, and rates must be appropriate for the target environment. Additional\nconfiguration\
    \ is required for each type of prioritized traffic.\nNote: The example CoS names, scheduler rates, and DSCP values must\
    \ not be\nconsidered requirements. The names, rates, and values must be appropriately\nconfigured for the target environment.\n\
    user@host> show configuration class-of-service\nclassifiers {\n dscp prioritized-traffic-classifier {\n import default;\n\
    \ forwarding-class expedited-forwarding {\n loss-priority low code-points [ 101110 100100 ];\n }\n }\n}\ninterfaces {\n\
    \ <interface> {\n scheduler-map prioritized-traffic-map;\n unit <logical unit> {\n classifiers {\n dscp prioritized-traffic-classifier;\n\
    \ }\n }\n }\n <uplink interface> {\n scheduler-map prioritized-traffic-map;\n unit <logical unit> {\n classifiers {\n\
    \ dscp prioritized-traffic-classifier;\n }\n }\n}\nscheduler-maps {\n prioritized-traffic-map {\n forwarding-class best-effort\
    \ scheduler be-scheduler;\n forwarding-class expedited-forwarding scheduler ef-scheduler;\n forwarding-class network-control\
    \ scheduler nc-scheduler;\n }\n}\nschedulers {\n be-scheduler {\n transmit-rate {\n remainder;\n }\n priority low;\n }\n\
    \ ef-scheduler {\n shaping-rate percent 20;\n priority strict-high;\n }\n nc-scheduler {\n shaping-rate percent 5;\n priority\
    \ strict-high;\n }\n}\n``\nIf the switch is not configured to implement a QoS policy, this is a finding."
  remediation: 'Configure class-of-service (CoS):

    user@host> configure

    user@host# set class-of-service classifiers dscp <classifier name> import

    default

    user@host# set class-of-service classifiers dscp <classifier name>

    forwarding-class <req’d forwarding class name> loss-priority <low|high> codepoints <DSCP code point>

    user@host# set class-of-service classifiers dscp <classifier name>

    forwarding-class <req’d forwarding class name> loss-priority <low|high> codepoints <DSCP code point> (optional - only
    if multiple DSCP values are used)

    user@host# set class-of-service interfaces <interface name> scheduler-map

    <scheduler map name>

    user@host# set class-of-service interfaces <interface name> unit <unit

    number> classifiers dscp <classifier name>

    user@host# set class-of-service interfaces <uplink interface> scheduler-map

    <scheduler map name>

    user@host# set class-of-service interfaces <uplink interface> unit <unit

    number> classifiers dscp <classifier name>

    user@host# set class-of-service scheduler-maps <scheduler map name>

    forwarding-class best-effort scheduler <scheduler name> (e.g., be-scheduler)

    user@host# set class-of-service scheduler-maps <scheduler map name>

    forwarding-class <req’d forwarding class> scheduler <scheduler name> (e.g.,

    ef-scheduler)

    user@host# set class-of-service scheduler-maps <scheduler map name>

    forwarding-class network-control scheduler <scheduler name> (e.g. ncscheduler)

    user@host# set class-of-service schedulers <be-scheduler name> transmit-rate

    (exact <value> | percent (0..100) | remainder)

    user@host# set class-of-service schedulers <be-scheduler name> priority (high

    | low | medium-high | medium-low | strict-high)

    set class-of-service schedulers <ef-scheduler name> shaping-rate percent

    (0..100)

    user@host# set class-of-service schedulers <ef-scheduler name> priority (high

    | low | medium-high | medium-low | strict-high)

    user@host# set class-of-service schedulers <nc-scheduler name> shaping-rate

    percent (0..100)

    user@host# set class-of-service schedulers <nc-scheduler name> priority (high

    | low | medium-high | medium-low | strict-high)

    Note: The classifier method (ToS bit, DSCP marking, etc.) and values, interfaces,

    priorities, and rates must be appropriate for the target environment.'
  checks:
  - type: sql
    command: show configuration class-of-service
    severity: medium
    info: 'Review the switch configuration to verify that Class-of-Service (CoS) has been enabled.

      Ensure sufficient capacity is available for mission-critical traffic to enforce the traffic

      priorities specified by the Combatant Commanders/Services/Agencies.

      By default, Junos implements a standard CoS (QoS) strategy. Although some devices

      implement different queues or queue numbers, generally there is at lea'
- id: '1.5'
  title: JUEX-L2-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to permit authorized users to select a user session to capture. GROUP
    ID: V-253952 RULE ID: SV-253952r1082341'
  rationale: Without the capability to select a user session to capture/record or view/hear, investigations into suspicious
    or harmful events would be hampered by the volume of information captured. The volume of information captured may also
    adversely impact the operation for the network. Session audits may include port mirroring, tracking websites visited,
    and recording information and/or file transfers.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Verify if the switch configuration has an analyzer to capture ingress and egress packets\nfrom any designated\
    \ access interface for the purpose of monitoring a specific user\nsession.\nPacket capture using the [edit forwarding-options\
    \ analyzer ] configuration will only be\npresent and enabled when actively monitoring sessions.\nIf actively capturing\
    \ packets, verify an analyzer is present.\n[edit forwarding-options]\nanalyzer {\n <analyzer name> {\n input {\n ingress\
    \ {\n interface <input interface>.<logical unit>;\n -orinterface irb.<logical unit>;\n }\n egress {\n interface <input\
    \ interface>.<logical unit>;\n -orinterface irb.<logical unit>;\n }\n }\n output {\n interface <output interface>.<logical\
    \ unit>;\n }\n }\n}\nNote: Simultaneously mirroring both ingress and egress traffic may exceed the output\ninterface capacity.\
    \ Packet mirroring consumes resources and should only be enabled\nwhen actively monitoring sessions.\nIf active monitoring\
    \ is not currently required, the lack of an analyzer, or the presence of\nan inactive (disabled) analyzer, is not a finding.\n\
    If the switch is not configured to capture ingress and egress packets from a designated\naccess interface, this is a finding."
  remediation: 'Enable the feature or configure the switch so that it is capable of capturing ingress and

    egress packets from any designated switch port for the purpose of monitoring a specific

    user session.

    To capture packets from the L2 interface ge-0/0/0 and forward out the L2 interface ge0/0/1, configure the switch similarly
    to the example:

    set forwarding-options analyzer <analyzer name> input ingress interface

    <input interface>.<logical unit>

    -orset forwarding-options analyzer <analyzer name> input ingress interface

    irb.<logical unit>

    set forwarding-options analyzer <analyzer name> input egress interface <input

    interface>.<logical unit>

    -or-

    set forwarding-options analyzer <analyzer name> input egress interface

    irb.<logical unit>

    set forwarding-options analyzer <analyzer name> output interface <output

    interface>.<logical unit>'
  checks:
  - type: manual_review
    info: "Verify if the switch configuration has an analyzer to capture ingress and egress packets\nfrom any designated access\
      \ interface for the purpose of monitoring a specific user\nsession.\nPacket capture using the [edit forwarding-options\
      \ analyzer ] configuration will only be\npresent and enabled when actively monitoring sessions.\nIf actively capturing\
      \ packets, verify an analyzer is present.\n[edit forwarding-options]\nanalyzer {\n <analyzer name> {\n input {\n ingress\
      \ {\n interface <input interface>.<logical "
    severity: medium
- id: '1.6'
  title: JUEX-L2-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to permit authorized users to remotely view, in real time, all content
    related to an established user session from a component separate from the layer 2 switch. GROUP ID: V-253953 RULE ID:
    SV-253953r1082342'
  rationale: Without the capability to remotely view/hear all content related to a user session, investigations into suspicious
    user activity would be hampered. Real-time monitoring allows authorized personnel to take action before additional damage
    is done. The ability to observe user sessions as they are happening allows for interceding in ongoing events that after-the-fact
    review of captured content would not allow.
  impact: ''
  references: []
  page_start: 26
  audit_raw: "Verify if the switch configuration has an analyzer to capture ingress and egress packets\nfrom any designated\
    \ switch port for the purpose of remotely monitoring a specific user\nsession.\nPacket capture using the [edit forwarding-options\
    \ analyzer ] configuration will only be\npresent and enabled when actively monitoring sessions.\nThe Juniper switch supports\
    \ either output interface or output vlan. To output to a VLAN\nthat is trunked to a remote location, configure the switch\
    \ with the destination VLAN,\nconfigure the uplink interface as trunked, and include the remote analyzer VLAN in the\n\
    uplink trunk.\nIf actively capturing packets, verify an analyzer is present.\n[edit vlans]\n<destination VLAN name> {\n\
    \ vlan-id <VLAN ID>;\n}\n[edit interfaces]\n<interface name> {\n unit 0 {\n family ethernet-switching {\n interface-mode\
    \ trunk;\n vlan {\n members <destination VLAN name>;\n }\n }\n }\n}\n[edit forwarding-options]\nanalyzer {\n <analyzer\
    \ name> {\n input {\n ingress {\n interface <input interface>.<logical unit>;\n -orinterface irb.<logical unit>;\n }\n\
    \ egress {\n interface <input interface>.<logical unit>;\n -orinterface irb.<logical unit>;\n }\n output {\n vlan {\n\
    \ <destination VLAN name>;\n }\n }\n }\n}\nNote: Simultaneously mirroring both ingress and egress traffic may exceed the\
    \ output\ninterface capacity. Packet mirroring consumes resources and should only be enabled\nwhen actively monitoring\
    \ sessions.\nIf active monitoring is not currently required, the lack of an analyzer, or the presence of\nan inactive\
    \ (disabled) analyzer, is not a finding.\nIf the switch is not configured to capture ingress and egress packets from a\
    \ designated\naccess interface for the purpose of remotely monitoring a specific user session, this is a\nfinding."
  remediation: 'Enable the feature or configure the switch so that it is capable of capturing ingress and

    egress packets from any designated switch port for the purpose of monitoring a specific

    user session.

    set vlans <destination VLAN name> vlan-id <VLAN ID>

