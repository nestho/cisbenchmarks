    user@host# set protocols dot1x authenticator interface <int-02>

    authentication-order dot1x

    user@host# set protocols dot1x authenticator interface <int-02>

    authentication-order captive-portal

    user@host# set protocols dot1x authenticator interface <int-02> supplicant

    multiple

    user@host# set protocols dot1x authenticator interface <int-02> mac-radius

    ```

    To configure only MAC RADIUS on an access interface for devices that do not

    support 802.1x (authentication order cannot be set):

    ```

