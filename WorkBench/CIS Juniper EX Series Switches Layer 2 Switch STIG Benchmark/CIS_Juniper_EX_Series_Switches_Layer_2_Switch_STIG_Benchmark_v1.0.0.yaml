    set interfaces <interface name> unit 0 family ethernet-switching vlan members

    <destination VLAN name>

    set forwarding-options analyzer <analyzer name> input ingress interface

    <input interface>.<logical unit>

    -orset forwarding-options analyzer <analyzer name> input ingress interface

    irb.<logical unit>

    set forwarding-options analyzer <analyzer name> input egress interface <input

    interface>.<logical unit>

    -orset forwarding-options analyzer <analyzer name> input egress interface

    irb.<logical unit>

    set forwarding-options analyzer <analyzer name> output vlan <destination VLAN

    name>'
  checks:
  - type: manual_review
    info: 'Verify if the switch configuration has an analyzer to capture ingress and egress packets

      from any designated switch port for the purpose of remotely monitoring a specific user

      session.

      Packet capture using the [edit forwarding-options analyzer ] configuration will only be

      present and enabled when actively monitoring sessions.

      The Juniper switch supports either output interface or output vlan. To output to a VLAN

      that is trunked to a remote location, configure the switch with the destination VLAN'
