- id: '1.10'
  title: JUEX-L2-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enable IP Source Guard on all user-facing or untrusted access
    VLANs. GROUP ID: V-253960 RULE ID: SV-253960r843913'
  rationale: IP Source Guard provides source IP address filtering on an untrusted layer 2 interface to prevent a malicious
    host from impersonating a legitimate host by assuming the legitimate host's IP address. The feature uses dynamic DHCP
    snooping and static IP source binding to match IP addresses to hosts on untrusted layer 2 access interfaces. Initially,
    all IP traffic on the protected interface is blocked except for DHCP packets. After a client receives an IP address from
    the DHCP server, or after static IP source binding is configured by the administrator, all traffic with that IP source
    address is permitted from that client. Traffic from other hosts is denied. This filtering limits a host's ability to attack
    the network by claiming a neighbor host's IP address.
  impact: ''
  references: []
  page_start: 37
  audit_raw: "Review the switch configuration to verify that IP Source Guard is enabled on all userfacing or untrusted VLANs.\
    \ Configuring IP Source Guard automatically enables DHCP\nsnooping.\nDevices like printers, servers, and VoIP phones are\
    \ under enterprise control and\nconnected to controlled access interfaces (802.1x, Static MAC Bypass, or MAC\nRADIUS),\
    \ making them trusted sources in non-user-facing VLANs.\nVerify IP Source Guard on user-facing or untrusted VLANs.\n[edit\
    \ vlans]\n<untrusted VLAN name> {\n vlan-id <VLAN ID>;\n forwarding-options {\n dhcp-security {\n ip-source-guard;\n }\n\
    \ }\n}\nNote: IP Source Guard depends upon DHCP snooping or static MAC address bindings.\nIf the switch does not have\
    \ IP Source Guard enabled on all user-facing or untrusted\nVLANs, this is a finding."
  remediation: 'Configure the switch to have IP Source Guard enabled on all user-facing or untrusted

    VLANs.

    set vlans <untrusted VLAN name> vlan-id <VLAN ID>

    set vlans <untrusted VLAN name> forwarding-options dhcp-security ip-sourceguard'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that IP Source Guard is enabled on all userfacing or untrusted VLANs.\
      \ Configuring IP Source Guard automatically enables DHCP\nsnooping.\nDevices like printers, servers, and VoIP phones\
