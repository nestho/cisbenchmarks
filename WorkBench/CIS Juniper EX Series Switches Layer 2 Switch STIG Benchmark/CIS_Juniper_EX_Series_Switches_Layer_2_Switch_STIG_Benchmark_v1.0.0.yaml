      RADIUS), making t'
    severity: medium
- id: '1.12'
  title: JUEX-L2-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enable STP Loop Protection on all nondesignated STP switch ports.
    GROUP ID: V-253957 RULE ID: SV-253957r843904'
  rationale: The Spanning Tree Protocol (STP) Loop Protection feature provides additional protection against STP loops. An
    STP loop is created when an STP blocking port in a redundant topology erroneously transitions to the forwarding state.
    In its operation, STP relies on continuous reception and transmission of BPDUs based on the port role. The designated
    port transmits BPDUs, and the non-designated port receives BPDUs. When one of the ports in a physically redundant topology
    no longer receives BPDUs, the STP conceives that the topology is loop free. Eventually, the blocking port from the alternate
    or backup port becomes a designated port and moves to a forwarding state. This situation creates a loop. The loop protection
    feature makes additional checks. If BPDUs are not received on a non-designated port and loop protection is enabled, that
    port is moved into the STP loop-inconsistent blocking state.
  impact: ''
  references: []
  page_start: 41
  audit_raw: "Review the switch configuration to verify that STP Loop Protection is enabled on all\nnon-designated STP switch\
    \ ports.\nVerify STP Loop Protection for RSTP and VSTP.\n[edit protocols]\nrstp {\n interface <interface name> {\n bpdu-timeout-action\
    \ {\n block;\n }\n }\n}\nvstp {\n interface <interface name> {\n bpdu-timeout-action {\n block;\n }\n }\n}\nVerify Loop\
    \ Protection for all instances on an MSTP interface:\n[protocols]\nmstp {\n interface <interface name> {\n bpdu-timeout-action\
    \ {\n block;\n }\n }\n}\nNote: Loop Protection and Root Protection are mutually exclusive and cannot be\nsimultaneously\
    \ configured on the same interface.\nIf STP Loop Protection is not configured on non-designated STP ports, this is a finding."
  remediation: 'Configure the switch to have STP Loop Protection enabled on all non-designated STP

    interfaces.

    RSTP or VSTP non-designated interface loop protection:

    set protocols rstp interface <interface name> bpdu-timeout-action block

    set protocols vstp interface <interface name> bpdu-timeout-action block

    All instances on an MSTP interface:

    set protocols mstp interface <interface name> bpdu-timeout-action block

    Note: Loop Protection and Root Protection are mutually exclusive and cannot be

    simultaneously configured on the same interface.'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that STP Loop Protection is enabled on all\nnon-designated STP switch\
      \ ports.\nVerify STP Loop Protection for RSTP and VSTP.\n[edit protocols]\nrstp {\n interface <interface name> {\n bpdu-timeout-action\
      \ {\n block;\n }\n }\n}\nvstp {\n interface <interface name> {\n bpdu-timeout-action {\n block;\n }\n }\n}\nVerify Loop\
      \ Protection for all instances on an MSTP interface:\n[protocols]\nmstp {\n interface <interface name> {\n bpdu-timeout-action\
      \ {\n block;\n }\n }\n}\nNote: Loop Prote"
    severity: medium
