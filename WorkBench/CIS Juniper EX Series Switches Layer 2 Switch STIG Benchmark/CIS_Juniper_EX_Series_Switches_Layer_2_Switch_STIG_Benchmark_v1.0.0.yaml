- id: '1.11'
  title: JUEX-L2-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper EX switch must be configured to enable DHCP snooping for all user VLANs to validate DHCP messages
    from untrusted sources. GROUP ID: V-253959 RULE ID: SV-253959r843910'
  rationale: In an enterprise network, devices under administrative control are trusted sources. These devices include the
    switches, routers, and servers in the network. Host interfaces and unknown DHCP servers are considered untrusted sources.
    An unknown DHCP server on the network on an untrusted interface is called a spurious DHCP server, any device (PC, Wireless
    Access Point) that is loaded with DHCP server enabled. The DHCP snooping feature determines whether traffic sources are
    trusted or untrusted. The potential exists for a spurious DHCP server to respond to DHCPDISCOVER messages before the real
    server has time to respond. DHCP snooping allows switches on the network to trust the interface a DHCP server is connected
    to and not trust the other interfaces. The DHCP snooping feature validates DHCP messages received from untrusted sources
    and filters out invalid messages as well as rate-limits DHCP traffic from trusted and untrusted sources. The DHCP snooping
    feature builds and maintains a binding database, which contains information about untrusted hosts with leased IP addresses,
    and it utilizes the database to validate subsequent requests from untrusted hosts. Other security features, such as IP
    Source Guard and Dynamic Address Resolution Protocol (ARP) Inspection (DAI), also use information stored in the DHCP snooping
    binding database. Hence, it is imperative that the DHCP snooping feature is enabled on all user-facing or untrusted VLANs.
  impact: ''
  references: []
  page_start: 39
  audit_raw: "Review the switch configuration and verify that DHCP snooping is enabled on all userfacing or untrusted VLANs.\n\
    DHCP snooping is enabled if dhcp-security is configured for any VLAN, and is\nautomatically enabled whenever any other\
    \ VLAN port security feature is configured\n(e.g., IP Source Guard or Dynamic ARP Inspection).\nDevices like printers,\
    \ servers, and VoIP phones are under administrative control and\nconnected to controlled access interfaces (802.1x, Static\
    \ MAC Bypass, or MAC\nRADIUS), making them trusted sources in non-user-facing VLANs.\nVerify DHCP snooping on user-facing\
    \ or untrusted VLANs.\n[edit vlans]\n<untrusted VLAN name> {\n vlan-id <VLAN ID>;\n forwarding-options {\n dhcp-security;\n\
    \ }\n}\nIf the switch does not have DHCP snooping enabled for all user-facing or untrusted\nVLANs to validate DHCP messages\
    \ from untrusted sources, this is a finding."
  remediation: 'Configure the switch to have DHCP snooping for all user-facing or untrusted VLANs to

    validate DHCP messages from untrusted sources.

    set vlans <untrusted VLAN name> vlan-id <untrusted VLAN ID>

    set vlans <untrusted VLAN name> forwarding-options dhcp-security'
  checks:
  - type: manual_review
    info: 'Review the switch configuration and verify that DHCP snooping is enabled on all userfacing or untrusted VLANs.

      DHCP snooping is enabled if dhcp-security is configured for any VLAN, and is

