  description: 'The Juniper EX switch must be configured to enable IGMP or MLD Snooping on all VLANs. GROUP ID: V-253963 RULE
    ID: SV-253963r843922'
  rationale: IGMP and MLD snooping provides a way to constrain multicast traffic at layer 2. By monitoring the IGMP or MLD
    membership reports sent by hosts within a VLAN, the snooping application can set up layer 2 multicast forwarding tables
    to deliver specific multicast traffic only to interfaces connected to hosts interested in receiving the traffic, thereby
    significantly reducing the volume of multicast traffic that would otherwise flood the VLAN.
  impact: ''
  references: []
  page_start: 43
  audit_raw: "Review the switch configuration to verify that IGMP or MLD snooping has been\nconfigured for IPv4 and IPv6 multicast\
    \ traffic respectively.\nVerify IGMP and MLD is globally configured for all VLANs:\n[edit protocols]\nigmp-snooping {\n\
    \ vlan all {\n immediate-leave;\n interface <multicast router interface name>.<logical unit> {\n multicast-router-interface;\n\
    \ }\n }\n}\nmld-snooping {\n vlan all {\n immediate-leave;\n interface <multicast router interface name>.<logical unit>\
    \ {\n multicast-router-interface;\n }\n }\n}\nFor VLAN-specific values, verify IGMP and MLD snooping is configured for\
    \ each VLAN:\n[edit protocols]\nigmp-snooping {\n vlan vlan-name {\n immediate-leave;\n interface <multicast router interface\
    \ name>.<logical unit> {\n multicast-router-interface;\n }\n interface <host interface name>.<logical unit> {\n host-only-interface;\n\
    \ }\n }\n}\nmld-snooping {\n vlan vlan-name {\n immediate-leave;\n interface <multicast router interface name>.<logical\
    \ unit> {\n multicast-router-interface;\n }\n interface <host interface name>.<logical unit> {\n host-only-interface;\n\
    \ }\n }\n}\nIf the switch is not configured to implement IGMP or MLD snooping for each VLAN, this\nis a finding."
  remediation: 'Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively for

