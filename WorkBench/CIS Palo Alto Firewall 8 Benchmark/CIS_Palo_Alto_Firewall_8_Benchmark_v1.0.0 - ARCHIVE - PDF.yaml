    seven file types are supported, while only PE (Portable Executable) files are supported without a license. For web traffic,
    the action "continue-and-forward" can be selected. This still forwards the file to the Wildfire service, but also presents
    the end user with a confirmation message before they receive the file. If there is a "continue-and-forward" rule, there
    should still be an "any traffic / any application / forward" rule after that in the list.
  rationale: Selecting 'Any' application and file type ensures WildFire is analyzing as many files as possible.
