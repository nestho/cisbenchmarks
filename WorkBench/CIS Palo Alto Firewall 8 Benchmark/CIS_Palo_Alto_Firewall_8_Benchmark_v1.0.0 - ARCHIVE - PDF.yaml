    severity: medium
- id: '5.6'
  title: Ensure alerts are enabled for malicious files detected by WildFire
  scoring: scored
  profile:
  - Level 1
  description: Configure WildFire to send an alert when a malicious or greyware file is detected. This alert could be sent
    by whichever means is preferable, including email, SNMP trap, or syslog message. Alternatively, configure the WildFire
    cloud to generate alerts for malicious files. The cloud can generate alerts in addition to or instead of the local WildFire
    implementation. Note that the destination email address of alerts configured in the WildFire cloud portal is tied to the
    logged in account, and cannot be modified. Also, new systems added to the WildFire cloud portal will not be automatically
    set to email alerts.
  rationale: WildFire analyzes files that have already been downloaded and possibly executed. A WildFire verdict of malicious
    indicates that a computer could already be infected. In addition, because WildFire only analyzes files it has not already
    seen that were not flagged by the firewall’s antivirus filter, files deemed malicious by WildFire are more likely to evade
    detection by desktop antivirus products.
  impact: ''
  references:
