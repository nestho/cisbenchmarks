- id: '6.4'
  title: Ensure DNS sinkholing is configured on all anti-spyware profiles in use
  scoring: scored
  profile:
  - Level 1
  description: Configure DNS sinkholing for all anti-spyware profiles in use. All internal requests to the selected sinkhole
    IP address must traverse the firewall. Any device attempting to communicate with the DNS sinkhole IP address should be
    considered infected.
  rationale: DNS sinkholing helps to identify infected clients by spoofing DNS responses for malware domain queries. Without
    sinkholing, the DNS server itself may be seen as infected, while the truly infected device remains unidentified. In addition,
    sinkholing also ensures that DNS queries that might be indicators of compromise do not transit the internet, where they
    could be potentially used to negatively impact the "ip reputation" of the organization's internet network subnets.
  impact: ''
  references:
  - 1. “How to Deal with Conficker using DNS Sinkhole” -
  - https://live.paloaltonetworks.com/docs/DOC-6628
  - 2. “Threat Prevention Deployment Tech Note” -
  - https://live.paloaltonetworks.com/docs/DOC-3094
