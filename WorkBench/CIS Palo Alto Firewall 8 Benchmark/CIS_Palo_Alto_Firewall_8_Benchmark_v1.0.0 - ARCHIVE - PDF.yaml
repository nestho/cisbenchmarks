- id: '6.10'
  title: Ensure that URL Filtering uses the action of “block” or “override” on the URL categories
  scoring: scored
  profile:
  - Level 1
  description: 'Ideally, deciding which URL categories to block, and which to allow, is a joint effort between IT and another
    entity of authority within an organization—such as the legal department or administration. For most organizations, blocking
    or requiring an override on the following categories represents a minimum baseline: adult, hacking, command-andcontrol,
    copyright-infringement, extremism, malware, phishing, proxy-avoidance-andanonymizers, and parked. Some organizations may
    add "unknown" and "dynamic-dns" to this list, at the expense of some support calls on those topics.'
  rationale: Certain URL categories pose a technology-centric threat, such as mcommand-and-control, copyright-infringement,
    extremism, malware, phishing, proxy-avoidance-and-anonymizers, and parked. Users visiting websites in these categories,
    many times unintentionally, are at greater risk of compromising the security of their system. Other categories, such as
    adult, may pose a legal liability and will be blocked for those reasons.
  impact: Not having an effective URL Filtering configuration can leave an organization open to legal action, internal HR
    issues, non-compliance with regulatory policies or productivity loss. ARCHIVE 125 | P a g e
  references:
  - '1. PANOS 8.0 Admin Guide - Security Profiles:'
  - https://www.paloaltonetworks.com/documentation/80/pan-os/web-interfacehelp/objects/objects-security-profiles
  page_start: 125
  audit_raw: 'Navigate to Objects > Security Profiles > URL Filtering.

    Verify that all URL categories designated by the organization are listed, and the action is set

    to Block.'
  remediation: 'Navigate to Objects > Security Profiles > URL Filtering.

    Set a URL filter so that all URL categories designated by the organization are listed.

    Navigate to the Actions tab.

    Set the action to Block.'
  checks:
  - type: manual_review
    info: 'Navigate to Objects > Security Profiles > URL Filtering.

      Verify that all URL categories designated by the organization are listed, and the action is set

      to Block.'
    severity: medium
- id: '6.11'
  title: Ensure that access to every URL is logged
  scoring: scored
  profile:
  - Level 1
  description: URL filters should not specify any categories as Allow Categories.
  rationale: Setting a URL filter to have one or more entries under Allow Categories will cause no log entries to be produced
    in the URL Filtering logs for access to URLs in those categories. For forensic, legal, and HR purposes, it is advisable
    to log access to every URL. In many cases failure to log all URL access is a violation of corporate policy, legal requirements
    or regulatory requirements.
  impact: Not having an effective URL Filtering configuration can leave an organization open to legal action, internal HR
    issues, non-compliance with regulatory policies or productivity loss.
