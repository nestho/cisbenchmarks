- id: '6.16'
  title: Ensure that a Zone Protection Profile with an enabled SYN Flood Action of SYN Cookies is attached to all untrusted
    zones
  scoring: scored
  profile:
  - Level 1
  - Level 2
  - Level 1
  description: 'Enable the SYN Flood Action of SYN Cookies for all untrusted zones. The Alert, Activate, and Maximum settings
    for SYN Flood Protection depend highly on the environment and device used. Perform traffic analysis on the specific environment
    and firewall to determine accurate thresholds. Do not rely on default values to be appropriate for an environment. Setting
    these values for all interfaces is an approach that should be considered by many organizations, as traffic floods can
    result from internal testing or malware as well. As a rough ballpark for most environments, an Activate value of 50% of
    the firewall’s maximum “New sessions per second”/CPS is a conservative setting. The following is a list of new sessions
    per second maximum for each platform: PA-200 = 1,000 CPS PA-500 = 7,500 CPS PA-2000 series = 15,000 CPS PA-3000 series
    = 50,000 CPS PA-5000 series = 120,000 CPS PA-7050 = 720,000 CPS Enable all Flood Protection options in the Zone Protection
    Profile attached to all untrusted zones. The Alert, Activate, and Maximum settings for Flood Protection depend highly
    on the environment and device used. Perform traffic analysis on the specific environment and firewall to determine accurate
    thresholds. Do not rely on default values to be appropriate for an environment. Setting these values for all interfaces
    is an approach that should be considered by many organizations, as traffic floods can result from internal testing or
    malware as well. Enable all three scan options in a Zone Protection profile. Do not configure an action of Allow for any
    scan type. The exact interval and threshold values must be tuned to the specific environment. Less aggressive settings
    are typically appropriate for trusted zones, such as setting an action of alert for all scan types. Attach appropriate
    Zone Protection profiles meeting these criteria to all zones. Separate Zone Protection profiles for trusted and untrusted
    zones is a best practice.'
  rationale: Protecting resources and the firewall itself against DoS/DDoS attacks requires a layered approach. Firewalls
    alone cannot mitigate all DoS attacks, however, many attacks can be successfully mitigated. Utilizing SYN Cookies helps
    to mitigate SYN flood attacks, where the CPU and/or memory buffers of the victim device become overwhelmed by incomplete
    TCP sessions. SYN Cookies are preferred over Random Early Drop. ARCHIVE 137 | P a g e Without flood protection, it may
    be possible for an attacker, through the use of a botnet or other means, to overwhelm network resources. Flood protection
    does not completely eliminate this risk; rather, it provides a layer of protection. Without a properly configured zone
    protection profile applied to untrusted interfaces, the protected / trusted networks are susceptible to large number of
    attacks. While many of these involve denial of service, some of these attacks are designed to evade IPS systems (fragmentation
    attacks for instance) or to evade basic firewall protections (source routing and record route attacks). Port scans and
    host sweeps are common in the reconnaissance phase of an attack. Bots scouring the Internet in search of a vulnerable
    target may also scan for open ports and available hosts. Reconnaissance Protection will allow for these attacks to be
    either alerted on or blocked altogether.
  impact: Not configuring a Network Zone Protection Profile on untrusted interfaces leaves an organization exposed to common
    attacks and reconnaissance from those untrusted networks. Not configuring a Zone Protection Profile for internal networks
    leaves an organization vulnerable to malware, software or hardware causes of traffic flooding from internal sources. Not
    configuring and applying a Network Zone Protection Profile leaves an organization exposed to common attacks and reconnaissance
    from untrusted networks. Not configuring a Zone Protection Profile for internal networks leaves an organization vulnerable
    to malware, software or hardware causes of traffic flooding from internal sources. Not configuring a Network Zone Protection
    Profile leaves an organization exposed to common attacks and reconnaissance from untrusted networks.
  references:
