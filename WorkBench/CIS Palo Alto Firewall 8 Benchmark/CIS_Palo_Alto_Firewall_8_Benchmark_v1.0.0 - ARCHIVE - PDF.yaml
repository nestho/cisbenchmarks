  title: Ensure 'Idle timeout' is less than or equal to 10 minutes for device management
  scoring: scored
  profile:
  - Level 1
  description: Set the Idle Timeout value for device management to 10 minutes or less to automatically close inactive sessions.
  rationale: An unattended computer with an open administrative session to the device could allow an unauthorized user access
    to the firewall’s management interface.
  impact: ''
  references:
  - 1. “How to Change the Admin Session Timeout Value” -
  - https://live.paloaltonetworks.com/docs/DOC-5557
  page_start: 49
  audit_raw: 'Navigate to Device > Setup > Management > Authentication Settings.

    Verify Idle Timeout is less than or equal to 10.'
  remediation: 'Navigate to Device > Setup > Management > Authentication Settings .

    Set Idle Timeout to less than or equal to 10.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Authentication Settings.

      Verify Idle Timeout is less than or equal to 10.'
    severity: medium
- id: 1.4.2
  title: Ensure 'Failed Attempts' and 'Lockout Time' for Authentication Profile are properly configured
  scoring: scored
  profile:
  - Level 1
  description: Configure values for Failed Login Attempts and Account Lockout Time set to organizationdefined values (for
    example, 3 failed attempts and a 15 minute lockout time). Do not set Failed Attempts and Lockout Time in the Authentication
    Settings section; any Failed Attempts or Lockout Time settings within the selected Authentication Profile do not apply
    in the Authentication Settings section.
  rationale: Without a lockout limit, an attacker can continuously guess administrators’ passwords. If lockout settings are
    configured in the Authentication Settings section, it may be possible for an attacker to continuously lock out all administrative
    accounts from accessing the device.
  impact: ''
  references:
  - 1. https://www.paloaltonetworks.com/documentation/80/pan-os/web-interfacehelp/device/device-authentication-profile/configure-an-authentication-profile
  page_start: 51
  audit_raw: 'Navigate to Device > Authentication Profile.

    Verify Failed Attempts is set a non-zero organization-defined value.

    Verify Lockout Time is set to a non-zero organization-defined value.'
  remediation: 'Navigate to Device > Authentication Profile.

    Set Failed Attempts to the non-zero organization-defined value.

    Set Lockout Time to the non-zero organization-defined value.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Authentication Profile.

      Verify Failed Attempts is set a non-zero organization-defined value.

      Verify Lockout Time is set to a non-zero organization-defined value.'
    severity: medium
- id: 1.5.1
  title: Ensure 'V3' is selected for SNMP polling
  scoring: scored
  profile:
  - Level 1
  description: For SNMP polling, only SNMPv3 should be used.
  rationale: SNMPv3 utilizes AES-128 encryption, message integrity, user authorization, and device authentication security
    features. SNMPv2c does not provide these security features. If an SNMPv2c community string is intercepted or otherwise
    obtained, an attacker could gain read access to the firewall. Note that SNMP write access is not possible.
  impact: ''
  references:
  - 1. “How to Setup SNMPv3 Polling” -
  - https://live.paloaltonetworks.com/t5/Configuration-Articles/How-to-ConfigureSNMPv3-Polling/ta-p/58225
  page_start: 53
  audit_raw: 'Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup

    Verify V3 is selected.'
  remediation: 'Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup

    Select V3.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup

      Verify V3 is selected.'
    severity: medium
- id: 1.6.1
  title: Ensure 'Verify Update Server Identity' is enabled
  scoring: scored
  profile:
  - Level 1
  description: This setting determines whether or not the identity of the update server must be verified before performing
    an update session. Note that if an SSL Forward Proxy is configured to intercept the update session, this option may need
    to be disabled (because the SSL Certificate will not match).
  rationale: Verifying the update server identity before package download ensures the packages originate from a trusted source.
    Without this, it is possible to receive and install an update from a malicious source.
  impact: This setting protects the device from an "evilgrade" attack, where a successful DNS attack can redirect the firewall
    to an attacker-controlled update server, which can then serve a modified update.
  references:
  - 1. https://www.paloaltonetworks.com/documentation/80/pan-os/pan-os/gettingstarted/install-content-and-software-updates
  page_start: 55
  audit_raw: 'Navigate to Device > Setup > Services > Services.

    Verify that the Verify Update Server Identity box is checked.'
  remediation: 'Navigate to Device > Setup > Services > Services.

    Set the Verify Update Server Identity box to checked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Services > Services.

      Verify that the Verify Update Server Identity box is checked.'
    severity: medium
- id: 1.6.2
  title: Ensure redundant NTP servers are configured appropriately
  scoring: scored
  profile:
  - Level 1
  description: These settings enable use of primary and secondary NTP servers to provide redundancy in case of a failure involving
    the primary NTP server.
  rationale: NTP enables the device to maintain an accurate time and date when receiving updates from a reliable NTP server.
    Accurate timestamps are critical when correlating events with other systems, troubleshooting, or performing investigative
    work. Logs and certain cryptographic functions, such as those utilizing certificates, rely on accurate time and date parameters.
    In addition, rules referencing a Schedule object will not function as intended if the device’s time and date are incorrect.
    For additional security, authenticated NTP can be utilized. If Symmetric Key authentication is selected, only SHA1 should
    be used, as MD5 is considered severely compromised.
  impact: ''
  references:
  - 1. “The NIST Authenticated NTP Service” -
  - http://www.nist.gov/pml/div688/grp40/authntp.cfm
  - 2. https://www.paloaltonetworks.com/documentation/80/pan-os/pan-os/gettingstarted/integrate-the-firewall-into-your-management-network/perform-initialconfiguration.html
  page_start: 57
