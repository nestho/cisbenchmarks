    severity: medium
- id: '2.5'
  title: Ensure that the User-ID Agent has minimal permissions if User-ID is enabled
  scoring: scored
  profile:
  - Level 1
  description: If the integrated (on-device) User-ID Agent is utilized, the Active Directory account for the agent should
    only be a member of the Event Log Readers group, Distributed COM Users group, and Domain Users group. If the Windows User-ID
    agent is utilized, the Active Directory account for the agent should only be a member of the Event Log Readers group,
    Server Operators group, and Domain Users group.
  rationale: As a principle of least privilege, user accounts should have only minimum necessary permissions. If an attacker
    compromises a User-ID service account with domain admin rights, the organization is at far greater risk than if the service
    account were only granted minimum rights.
  impact: Using accounts with full administrative privileges when those rights are not required is always a bad idea. This
    is particularly true for service accounts of this type, which in many ARCHIVE 71 | P a g e organizations do not see strong
    passwords or frequent password changes. The principal of least privilege means that any compromised accounts of this type
    have less value to an attacker, and expose fewer assets based on their rights.
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. “User-ID Best Practices” - https://live.paloaltonetworks.com/docs/DOC-6591
  - https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os/userid/configure-user-mapping-using-the-windows-user-id-agent
  - https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os/userid/configure-user-mapping-using-the-pan-os-integrated-user-id-agent.html
  page_start: 71
  audit_raw: 'Navigate to Active Directory Users and Computers for the Active Directory under

    consideration.

