    severity: medium
- id: 1.6.3
  title: Ensure that the certificate securing Remote Access VPNs is valid
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'The Certificate used to secure Remote Access VPNs should satisfy the following criteria:  It should be a
    valid certificate from a trusted source. In almost cases this means a trusted Public Certificate Authority, as in most
    cases remote access VPN users will not have access to any Private Certificate Authorities for Certificate validation.
     The certificate should have a valid date. It should not have a "to" date in the past (it should not be expired), and
    should not have a "from" date in the future.  The key length used to encrypt the certificate should be 2048 bits or more.
     The hash used to sign the certificate should be SHA-2 or better.'
  rationale: If presented with a certificate error, the end user in most cases will not be able to tell if their session is
    using a self-signed or expired certificate, or if their session is being eavesdropped on or injected into by a "Man in
    the Middle" attack.
  impact: Not using a trusted Certificate, issued by a trusted Public Certificate Authority means that clients establishing
    VPN sessions will always see an error indicating an untrusted Certificate. This means that they will have no method of
    validating if their VPN session is being hijacked by a "Monkey in the Middle" (MitM) attack. It also "trains" them to
    bypass certificate warnings for other services, making MitM attacks easier for those other services as well.
  references:
  - 1. https://www.paloaltonetworks.com/documentation/80/globalprotect/globalprote
  - 2. https://www.paloaltonetworks.com/documentation/80/globalprotect/globalprote
  page_start: 59
  audit_raw: 'Verify that the certificate being used to secure the VPN meets the criteria listed above:

    Navigate to Device > Certificate Management > Certificates

