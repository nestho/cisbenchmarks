- id: '3.3'
  title: Ensure 'Passive Link State' and 'Preemptive' are configured appropriately
  scoring: scored
  profile:
  - Level 1
  description: Set the Passive Link State to auto, and uncheck the Preemptive option to disable it.
  rationale: Simultaneously enabling the 'Preemptive' option and setting the 'Passive Link State' option to 'Shutdown' could
    cause a 'preemptive loop' if Link and Path Monitoring are both configured. This will negatively impact the availability
    of the firewall and network services, should a monitored failure occur.
  impact: Incorrectly configuring this setting will adversely affect availability, rather than positively affect it. ARCHIVE
