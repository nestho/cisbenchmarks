- id: '2.1'
  title: Ensure that IP addresses are mapped to usernames
  scoring: scored
  profile:
  - Level 2
  description: Configure appropriate settings to map IP addresses to usernames. Mapping userids to IP addresses is what permits
    the firewall to create rules based on userids and groups rather than IP addresses and subnets, as well as log events by
    userids rather than IP addresses or DNS names. The specifics of how to achieve IP-to-username mapping is highly dependent
    on the environment. It can be enabled by integrating the firewall with a domain controller, Exchange server, captive portal,
    Terminal Server, User-ID Agent, XML API, or syslog data from a variety of devices.
  rationale: Understanding which user is involved in a security incident allows appropriate personnel to move quickly between
    the detection and reaction phases of incident response. In environments with either short DHCP lease times, or where users
    may move frequently between systems, the ability to analyze or report, or alert on events based on user accounts or user
    groups is a tremendous advantage. For forensics tasks when DHCP lease information may not be available, the Source User
    information may be the only way to tie together related data.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. “How to Configure Group Mapping settings?” -
  - https://live.paloaltonetworks.com/docs/DOC-4994
  - https://www.paloaltonetworks.com/documentation/80/pan-os/pan-os
  page_start: 62
  audit_raw: 'To validate if this recommendation has been met, look at the Source User column in the

    URL Filtering or Traffic logs (Monitor > Logs > URL Filtering and Logs > Traffic

    Logs, respectively.) User traffic originating from a trusted zone should identify a username.'
  remediation: 'To Set User-ID Agents:

    Navigate to Device > User Identification > User-ID Agents

    Set the Name, IP Address and Port of the User-ID Agent`

    Enable User Identification for each monitored zone that will have user accounts:

    Navigate to Network > Zone, for each relevant zone enable User Identification

    To Set Terminal Services Agents:

    Navigate to Device > Terminal Services Agents Set the Name, IP Address and Port

    of the Terminal Services Agent Enable User Identification for each monitored

    ARCHIVE

    62 | P a g e

    zone that will have Terminal Servers: Navigate to Network > Zone, enable User

    Identification'
  checks:
  - type: manual_review
    info: 'To validate if this recommendation has been met, look at the Source User column in the

      URL Filtering or Traffic logs (Monitor > Logs > URL Filtering and Logs > Traffic

      Logs, respectively.) User traffic originating from a trusted zone should identify a username.'
    severity: medium
- id: '2.2'
  title: Ensure that WMI probing is disabled
  scoring: scored
  profile:
  - Level 2
  description: Disable WMI probing if it is not required for User-ID functionality in the environment.
  rationale: WMI probing normally requires a domain administrator account. A malicious user could capture the encrypted password
    hash for offline cracking or relayed authentication attacks. Relying on other forms of user identification, such as security
    log monitoring, mitigates this risk.
  impact: While this removes the exposure of having the WMI user account password being compromised, it also reduces the effectiveness
    of user identification during operation of the firewall (applying rules and policies). This trade-off should be weighed
    carefully for all installations.
  references:
  - '1. “R7-2014-16: Palo Alto Networks User-ID Credential Exposure” -'
  - http://bit.ly/1GcbmD4
  - 2. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - https://live.paloaltonetworks.com/docs/DOC-6591
  page_start: 64
  audit_raw: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

    User ID Agent Setup.

    Verify that Enable Probing is not checked.'
  remediation: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

    User ID Agent Setup.

    Set Enable Probing so it is unchecked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

      User ID Agent Setup.

      Verify that Enable Probing is not checked.'
    severity: medium
- id: '2.3'
  title: Ensure that User-ID is only enabled for internal trusted interfaces
  scoring: scored
  profile:
  - Level 1
  description: Only enable the User-ID option for interfaces that are both internal and trusted. There is rarely a legitimate
    need to allow WMI probing on an untrusted interface.
  rationale: PAN released a customer advisory in October of 2014 warning of WMI probing on untrusted interfaces with User-ID
    enabled. This can result in theft of the password hash for the account used in WMI probing.
  impact: If WMI probing is enabled without limiting the scope, internet hosts that are sources or destinations of traffic
    will be probed, and the password hash of the configured Domain Admin account can be captured by an outside attacker on
    such a host.
  references:
  - '1. “Customer advisory: Security Impact of User-ID Misconfiguration” -'
  - https://live.paloaltonetworks.com/docs/DOC-8125
  - '2. “R7-2014-16: Palo Alto Networks User-ID Credential Exposure” -'
  - http://bit.ly/1GcbmD4
  - https://live.paloaltonetworks.com/docs/DOC-7912
  page_start: 66
  audit_raw: 'Navigate to Network > Network Profiles > Interface Management.

    Verify that User-ID is only enabled for interfaces that are both internal and trusted.'
  remediation: 'Navigate to Network > Network Profiles > Interface Management.

    Set User-ID to be checked only for interfaces that are both internal and trusted; uncheck it

    for all other interfaces.'
  checks:
  - type: manual_review
    info: 'Navigate to Network > Network Profiles > Interface Management.

      Verify that User-ID is only enabled for interfaces that are both internal and trusted.'
    severity: medium
- id: '2.4'
  title: Ensure that 'Include/Exclude Networks' is used if User-ID is enabled
  scoring: scored
  profile:
  - Level 1
  description: If User-ID is configured, use the Include/Exclude Networks section to limit the User-ID scope to operate only
    on trusted networks. There is rarely a legitimate need to allow WMI probing on an untrusted network.
  rationale: The Include/Exclude Networks feature allow users to configure boundaries for the User-ID service. By using the
    feature to limit User-ID probing to only trusted internal networks, the risks of privileged information disclosure through
    sent probes can be reduced. Note that if an entry appears in the Include/Exclude Networks section, an implicit exclude-allnetworks
    policy will take effect for all other networks.
  impact: Not restricting the networks subject to User Identification means that the administrative credentials (userid and
    password hash) used for this task will transit untrusted networks, or be sent to untrusted hosts. Capturing these credentials
    exposes them to offline cracking attacks. ARCHIVE 68 | P a g e
  references:
  - 1. Best Practices for Securing User-ID Deployments -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  page_start: 68
  audit_raw: 'Navigate to Device > User Identification > User Mapping > Include/Exclude

