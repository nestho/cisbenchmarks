  - 1. “Host Sweep Triggering Method in Zone Protection Profile” -
  - https://live.paloaltonetworks.com/docs/DOC-8703
  - 2. “Understanding DoS Protection” - https://live.paloaltonetworks.com/docs/DOC5078
