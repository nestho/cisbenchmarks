- id: '3.2'
  title: Ensure 'High Availability' requires Link Monitoring and/or Path Monitoring
  scoring: scored
  profile:
  - Level 1
  description: Configure Link Monitoring and/or Path Monitoring under High Availability options. If Link Monitoring is utilized,
    all links critical to traffic flow should be monitored.
  rationale: If Link or Path Monitoring is not enabled, the standby router will not automatically take over as active if a
    critical link fails on the active firewall. Services through the firewall could become unavailable as a result.
  impact: Not configuring High Availability (HA) correctly directly impacts the Availability of the system. With HA in place,
    standard maintenance such as OS updates, network and power cabling can be accomplished with no outage or a minimum impact.
    Without Link and Path monitoring in particular, failover will only occur when the primary device fails completely. Link
    and path monitoring permits failover if a critical interface loses link (either due to cabling or an upstream switch failover),
    or if a route or path fails (indicating an upstream issue that affects local Layer 3).
  references:
  - 1. https://www.paloaltonetworks.com/documentation/80/pan-os/pan-os/highavailability
  - 2. https://www.paloaltonetworks.com/documentation/81/pan-os/pan-os/highavailability
