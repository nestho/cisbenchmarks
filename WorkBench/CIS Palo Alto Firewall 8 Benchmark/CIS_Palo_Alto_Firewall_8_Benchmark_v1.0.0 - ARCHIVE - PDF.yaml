- id: '5.1'
  title: Ensure that WildFire file size upload limits are maximized
  scoring: scored
  profile:
  - Level 1
  description: Increase WildFire file size limits to the maximum file size supported by the environment. An organization with
    bandwidth constraints or heavy usage of unique files under a supported file type may require lower settings. The recommendations
    account for the CPU load on smaller platforms. If an organization consistently has CPU to spare, it's recommended to set
    some or all of these values to the maximum.
  rationale: Increasing file size limits allows the devices to forward more files for WildFire analysis. This increases the
    chances of identifying, and later preventing, threats in larger files. The default values are configured for files small
    enough that the majority of files are not assessed by Wildfire.
  impact: With the default values known, an attacker has only to send an infected file slightly over the "maximum" size for
    that filetype to evade detection at the perimeter. Many of the values are significantly lower than is typical for each
    file size.
  references:
  - 1. “WildFire Administrator's Guide 8.0 (English)” -
  - https://www.paloaltonetworks.com/documentation/80/wildfire/wf_admin
  - 2. “How to Configure WildFire” - https://live.paloaltonetworks.com/docs/DOC-3252
  page_start: 91
  audit_raw: 'Navigate to Device > Setup > WildFire.

    Navigate to the General Settings sections.

    Verify the maximum size for each file type are larger than the defaults, to a size that is as

    large enough to account for "large" files, but not large enough to affect performance of the

    hardware.'
  remediation: 'Navigate to Device > Setup > WildFire.

    Click the General Settings edit icon.

    Set the maximum size for each file type are larger than the defaults, to a size that is as large

    enough to account for "large" files, but not large enough to affect performance of the

    hardware. The maximum values (best case) and the Palo Alto recommendations that take

    performance into account are listed below:

    pe (Portable Executable) - Range is 1 to 10MB; default is 2MB, Palo Alto recommends

    10MB.

    apk (Android Application)- Range is 1 to 50MB; default 10MB, Palo Alto recommends

    30MB.

    pdf (Portable Document Format) - Range is 100KB to 1,000KB; default is 200KB, Palo Alto

    ARCHIVE

    91 | P a g e

    recommends 1,000KB.

    ms-office (Microsoft Office) — Range is 200KB to 10,000KB; default is 500KB, Palo Alto

    recommends 2,000KB.

    jar (Packaged Java class file) — Range is 1 to 10MB; default is 1MB, Palo Alto recommends

    5MB.

    flash (Adobe Flash) — Range is 1 to 10MB; default is 5MB, Palo Alto recommends 5MB.

    MacOSX (DMG/MAC-APP/MACH-O PKG files) — Range is 1 to 50MB; default is 1MB, Palo

    Alto recommends 1MB.

    archive (RAR and 7z files) — Range is 1 to 50MB; default is 1MB, Palo Alto recommends

    10MB.

    linux (ELF files) — Range is 1 to 10MB; default is 2MB, Palo Alto recommends 2MB.'
