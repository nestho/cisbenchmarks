- id: '6.20'
  title: Ensure that User Credential Submission uses the action of “block” or “continue” on the URL categories
  scoring: scored
  profile:
  - Level 1
  description: Ideally user names and passwords user within an organization are not used with third party site. Some sanctioned
    SAS applications may have connections to the corporate domain, in which case they will need to be exempt from the user
    credential submission policy through a custom URL category.
  rationale: Preventing users from having the ability to submit their corporate credentials to the Internet could stop credential
    phishing attacks and the potential that a breach at a site where a user reused credentials could lead to a credential
    stuffing attack.
  impact: Not preventing users from submitting their corporate credentials to the Internet can leave them open to phishing
    attacks or allow for credential reuse on unauthorized sites.
  references:
  - 1. https://www.paloaltonetworks.com/documentation/80/pan-os/pan-os/threatprevention/prevent-credential-phishing
  page_start: 146
  audit_raw: 'Navigate to Objects > Security Profiles > URL Filtering.

    Verify that the user credential submitting action on all URL categories listed is set to block

    or continue.

    Under the "User Credential Detection" tab ensure the user credential detection is not set to

    disabled.'
  remediation: 'Navigate to Objects > Security Profiles > URL Filtering.

    Set the user credential submitting action on all URL categories listed to Block.

    Under the "User Credential Detection" tab set user credential detection to Use IP User

    Mapping. This requires User-ID to be configured and decryption to be effective.'
  checks:
  - type: manual_review
    info: 'Navigate to Objects > Security Profiles > URL Filtering.

      Verify that the user credential submitting action on all URL categories listed is set to block

      or continue.

      Under the "User Credential Detection" tab ensure the user credential detection is not set to

      disabled.'
    severity: medium
- id: '7.1'
  title: Ensure application security policies exist when allowing traffic from an untrusted zone to a more trusted zone
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: When permitting traffic from an untrusted zone, such as the Internet or guest network, to a more trusted zone,
    such as a DMZ segment, create security policies specifying which specific applications are allowed.
  rationale: To avoid unintentionally exposing systems and services, rules allowing traffic from untrusted zones to trusted
    zones should be as specific as possible. Application-based rules, as opposed to service/port rules, further tighten what
    traffic is allowed to pass. Similarly, traffic from trusted to untrusted networks should have a security policy set, with
    application-based rules. A "catch-all" rule that allows all applications will also allow malware traffic. The goal should
    be to understand both inbound and outbound traffic, permit what is known, and block all other traffic.
  impact: Setting application based rules on both inbound and outbound traffic ensures that the traffic on the protocol and
    port being specified is actually the application that you expect. For outbound traffic, the days of "we trust our users"
    is well past us, that statement also implies that we trust the malware on the user workstations, which is obviously not
    the case. For traffic from trusted to less trusted interfaces, the applications should be characterized over time, with
    the end goal being that all applications in in the rules, and a final "block all" rule is in place. Not having this goal
    gives both attackers and malware the leeway they need to accomplish their goals.
  references:
  - 1. “PAN-OS Administrator's Guide 8.0 (English) - Security Policies ” -
  - https://www.paloaltonetworks.com/documentation/80/pan-os/web-interfacehelp/policies/policies-security
  page_start: 149
  audit_raw: 'Navigate to Policies > Security.

    Verify a Security Policy exists with:

    Source: Zone set to OUTSIDE / Address set to any Destination

    Destination: Zone set to DMZ / Address set to [DMZ IP Address] / Application set to webbrowsing / Service set to application-default'
  remediation: 'Navigate to Policies > Security.

    Set a Security Policy with:

    Source: Zone set to OUTSIDE / Address set to any Destination / Destination: Zone set to

    DMZ / Address set to [DMZ IP Address] / Application set to web-browsing / Service set to

    application-default

    ARCHIVE

    149 | P a g e'
  checks:
