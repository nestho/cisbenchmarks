- id: 5.1.1
  title: Secure Home Folders
  scoring: scored
  profile:
  - Level 1
  description: By default OS X allows all valid users into the top level of every other users home folder, and restricts access
    to the Apple default folders within. Another user on the same system can see you have a "Documents" folder but cannot
    see inside it. This configuration does work for personal file sharing but can expose user files to standard accounts on
    the system. The best parallel for Enterprise environments is that everyone who has a Dropbox account can see everything
    that is at the top level but can't see your pictures, in the parallel with OS X they can see into every new Directory
    that is created because of the default permissions. Home folders should be restricted to access only by the user. Sharing
    should be used on dedicated servers or cloud instances that are managing access controls. Some environments may encounter
    problems if execute rights are removed as well as read and write. Either no access or execute only for group or others
    is acceptable
  rationale: 58 | P a g e Allowing all users to view the top level of all networked user's home folder may not be desirable
    since it may lead to the revelation of sensitive information.
  impact: If implemented, users will not be able to use the "Public" folders in other users' home folders. "Public" folders
    with appropriate permissions would need to be set up in the /Shared folder.
  references: []
  page_start: 58
  audit_raw: "Perform the following to ensure the system is configured as prescribed:\n1. Run the following command in Terminal:\n\
    ls -l /Users/\n2. Verify the value returned is either:\n drwx------\n1. drwx--x--x"
  remediation: 'Perform the following to implement the prescribed state:

    1. Run one of the following commands in Terminal:

    sudo chmod -R og-rwx /Users/<username>

    2. sudo chmod -R og-rw /Users/<username>

    3. Substitute user name in <username>.

    4. This command has to be run for each user account with a local home folder.'
  checks:
  - type: command
    command: ls -l /Users/
