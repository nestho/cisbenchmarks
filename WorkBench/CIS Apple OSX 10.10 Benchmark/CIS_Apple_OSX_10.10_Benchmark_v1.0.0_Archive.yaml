- id: '5.21'
  title: Create specialized keychains for different purposes
  scoring: scored
  profile:
  - Level 2
  description: The keychain is a secure database store for passwords and certificates and is created for each user account
    on Mac OS X. The system software itself uses keychains for secure storage. Users can create more than one keychain to
    protect various passwords separately.
  rationale: If the user can logically split password and other entries into different keychains with different passwords,
    a compromise of one password will have limited effect.
  impact: Using multiple keychains can be inconvenient. It is also not necessarily possible for all kinds of data, such as
    Safari auto-fill information, to be stored in secondary keychains. Not all keychain-aware applications may provide an
    interface to choose secondary keychains. 80 | P a g e 6 User Accounts and Environment Account management is a central
    part of security for any computer system including OS X. General practices should be followed to ensure that all accounts
    on a system are still needed and that default accounts should be removed. Users with admin roles should have distinct
    accounts for Admin functions as well as day to day work where the passwords are different and known only by the user assigned
    to the account. Accounts with Elevated privileges should not be easily discerned from the account name from standard accounts.
    When any computer system is added to a Directory System there are additional controls available including user account
    management that are not available in a standalone computer. One of the drawbacks is the local computer is no longer in
    control of the accounts that can access or manage it if given permission. For OS X if the computer is in a Directory any
    standard user can now login to the computer at console which by default may be desirable or not depending on the use case.
    If an admin group is allowed to administer the local computer the membership of that group is controlled completely in
    the Directory. OS X computers connected to a Directory should be configured so that the risk is appropriate for the mission
    use of the computer. Only those accounts that require local authentication should be allowed, only required administrator
    accounts should be in the local administrator group. Authenticated Users for console access and Domain Admins for Administration
    may be too broad or too limited 6.1 Accounts Preferences Action Items Proper account management is critical to computer
    security. Many options and settings in the Account System Preference Pane can be used to increase the security of the
    Mac.
  references: []
