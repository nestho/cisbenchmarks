  - Level 1
  description: '27 | P a g e Bluetooth Sharing allows files to be exchanged with Bluetooth enabled devices. Apple''s File
    Sharing uses a combination of SMB (Windows sharing) and AFP (Mac sharing) Three common ways to share files using File
    Sharing are: 1. Apple File Protocol (AFP) AFP automatically uses encrypted logins, so this method of sharing files is
    fairly secure. The entire hard disk is shared to administrator user accounts. Individual home folders are shared to their
    respective user accounts. Users'' "Public" folders 28 | P a g e (and the "Drop Box" folder inside) are shared to any user
    account that has sharing access to the computer (i.e. anyone in the "staff" group, including the guest account if it is
    enabled). 2. Server Message Block (SMB), Common Internet File System (CIFS) When Windows (or possibly Linux) computers
    need to access file shared on a Mac, SMB/CIFS file sharing is commonly used. Apple warns that SMB sharing stores passwords
    is a less secure fashion than AFP sharing and anyone with system access can gain access to the password for that account.
    When sharing with SMB, each user that will access the Mac must have SMB enabled.'
