  title: App Store Automatically download apps purchased on other Macs Considerations
  scoring: scored
  profile:
  - Level 2
  description: With 10.9 Apple has expanded the capability of the App Store to automatically download OS X applications that
    were purchased in the App Store on another Mac. While this feature could be very desirable for personal Macs or a small
    business setting so that all purchased software through Apple's App Store is provisioned on all OS X Computers, just like
    iOS. This feature may not be desirable in Corporate environments where the expectations of handling software licenses,
    tracking software inventory and personal software are different. Please evaluate your organizations expectations about
    the use of personal software and software license tracking to align with this setting. 92 | P a g e For those organizations
    that are using Enterprise Apple IDs for their employees the reverse is true. If the user has the username and password
    for their Apple ID and software is being purchased on that account the user could download the software on other computers
