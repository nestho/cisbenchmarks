- id: '6.3'
  title: Disable the automatic run of safe files in Safari
  scoring: scored
  profile:
  - Level 1
  description: Safari will automatically run or execute what it considers safe files. This can include installers and other
    files that execute on the operating system. Safari bases files safety on the files type. The files considered safe include
    word files, PDF documents, and picture files.
  rationale: Hackers have taken advantage of this setting via drive-by attacks. These attacks occur when a user visits a legitimate
    website that has been corrupted. The user unknowingly downloads a malicious file either by closing an infected pop-up
    or hovering over a malicious banner. The attackers make sure that the malicious file type will fall within Safari's safe
    files policy and will download and run without user input.
  impact: 87 | P a g e Apple considers many files that the operating system itself auto-executes as "safe files." Many of
    these files could be malicious and could execute locally without the user even knowing that a file of a specific type
    had been download.
  references: []
