controls:
- id: '1.2'
  title: Enable Auto Update
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates. Ensure that application
    updates are installed after they are available from Apple
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities. Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being
    exploited
  impact: WIthout automatic update, updates may not be made in a timely manner and the system will be exposed to additional
    risk. Unpatched software may be exploited
  references:
  - '1. Rule Version (STIG-ID): OSX00290 M6 1.3'
  page_start: 8
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Open a terminal session and enter the following command:

    defaults read /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticCheckEnabled

    8 | P a g e

    2. Make sure the result is: 1

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.

    1. Open System Preferences

    2. Select App Store

    3. Select Install app updates

    4. Verify that all available updates and software patches are installed.

    9 | P a g e

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.storeagent AutoUpdate

    2. Verify the value returned is 1.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable the auto update

    feature:

    sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticCheckEnabled -int 1

    Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable the auto update

    feature:

    sudo defaults write /Library/Preferences/com.apple.storeagent AutoUpdate -int 1

    The remediation requires a log out and log in to show in the GUI. Please note that.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Open a terminal session and enter the following command:

      defaults read /Library/Preferences/com.apple.SoftwareUpdate

      AutomaticCheckEnabled

      8 | P a g e

      2. Make sure the result is: 1

      If automatic updates were selected during system set-up this setting may not have left an

      auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

      audited results.

      1. Open System Preferences

      2. Select App St'
    severity: medium
- id: '1.4'
  title: Enable system data files and security update installs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that system and security updates are installed after they are available from Apple
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited
  impact: Unpatched software may be exploited 2 System Preferences This section contains recommendations related to configurable
    options in the System Preferences panel. 2.1 Bluetooth Bluetooth is a short-range, low-power wireless technology commonly
    integrated into portable computing and communication devices and peripherals. Bluetooth is best used in a secure environment
    where unauthorized users have no physical access near the Mac. If Bluetooth is used, it should be secured properly (see
    below). 11 | P a g e
  references: []
  page_start: 10
  audit_raw: '1. Open System Preferences

    2. Select App Store

    3. Select install system data files and security updates

    4. Verify that all available updates and software patches are installed.

    10 | P a g e

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

    ''(ConfigDataInstall|CriticalUpdateInstall)''

    2. Make sure the result is: ConfigDataInstall = 1; CriticalUpdateInstall = 1;

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable install system

    data files and security updates:

    sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate

    ConfigDataInstall -bool true && sudo defaults write

    /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool true'
  checks:
  - type: manual_review
    info: '1. Open System Preferences

      2. Select App Store

      3. Select install system data files and security updates

      4. Verify that all available updates and software patches are installed.

      10 | P a g e

      Alternatively:

      Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

      ''(ConfigDataInstall|CriticalUpdateInstall)''

      2. Make sure the result is: ConfigDataInstall = 1; CriticalUpdateInst'
    severity: medium
- id: 2.1.1
  title: Disable Bluetooth, if no paired devices exist
  scoring: scored
  profile:
  - Level 1
  description: Bluetooth devices use a wireless communications system that replaces the cables used by other peripherals to
    connect to a system. It is by design a peer-to-peer network technology and typically lacks centralized administration
    and security enforcement infrastructure.
  rationale: Bluetooth is particularly susceptible to a diverse set of security vulnerabilities involving identity detection,
    location tracking, denial of service, unintended control and access of data and voice channels, and unauthorized device
    control and data access.
  impact: 12 | P a g e There have been many Bluetooth exploits , while Bluetooth can be hardened it does create a local wireless
    network that can be attacked to compromise both devices and information.
  references: []
  page_start: 12
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command:

    defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

    2. If the value returned is 0 the computer is compliant.

    3. If the value returned is 1 that indicates that Bluetooth is enabled; the computer is

    compliant only if paired devices exist. Use the following step.

    4. If the value returned in step 1 is 1 in the Terminal, run the following command:

    system_profiler | grep "Bluetooth:" -A 20 | grep Connectable

    5. Output should include: Connectable: Yes'
  remediation: "Perform the following to implement the prescribed state:\n1. In Terminal, run the following commands:\nsudo\
    \ defaults write /Library/Preferences/com.apple.Bluetooth \\\nControllerPowerState -int 0\n sudo killall -HUP blued"
  checks:
  - type: command
    command: system_profiler | grep "Bluetooth:" -A 20 | grep Connectable
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command:

      defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

      2. If the value returned is 0 the computer is compliant.

      3. If the value returned is 1 that indicates that Bluetooth is enabled; the computer is

      compliant only if paired devices exist. Use the following step.

      '
- id: 2.1.2
  title: Disable Bluetooth "Discoverable" mode when not pairing devices
  scoring: scored
  profile:
  - Level 1
  description: When Bluetooth is set to discoverable mode, the Mac sends a signal indicating that it's available to pair with
    another Bluetooth device. When a device is "discoverable" it broadcasts information about itself and it's location. Starting
    with OS X 10.9 Discoverable mode is enabled while the Bluetooth System Preference is open and turned off once closed.
    Systems that have the Bluetooth System Preference open at the time of audit will show as Discoverable.
  rationale: When in the discoverable state an unauthorized user could gain access to the system by pairing it with a remote
    device.
  impact: 13 | P a g e The system will need to be made Discoverable in order to easily pair Bluetooth peripherals
  references: []
  page_start: 13
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

    2. Verify the value returned is Discoverable: Off'
  remediation: 'Perform the following to implement the prescribed state:

    Starting with OS X (10.9) Bluetooth is only set to Discoverable when the Bluetooth System

    Preference is selected. To ensure that the computer is not Discoverable do not leave that

    preference open.'
  checks:
  - type: command
    command: /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

      2. Verify the value returned is Discoverable: Off'
- id: 2.1.3
  title: Show Bluetooth status in menu bar
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, Discoverable, what paired devices exist and are currently active.
  impact: Bluetooth is a useful wireless tool that has been widely exploited when configured improperly. The user should have
    insight into the Bluetooth status. 2.2 Date & Time This section contains recommendations related to the configurable items
    under the Date & Time panel.
  references: []
  page_start: 14
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

    2. Verify the value returned is: /System/Library/CoreServices/Menu

    Extras/Bluetooth.menu'
  remediation: 'In System Preferences: Bluetooth, turn Show Bluetooth Status In Menu Bar on.

    Alternatively run the following in the command line:

    defaults write com.apple.systemuiserver menuExtras -array-add

    "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"

    If the remediation is run multiple times multiple instances of the Bluetooth status will

    appear after rebooting the system. Command-click and drag the unwanted icons off the

    menu bar

    14 | P a g e

    How to Remove Icons from the Menu Bar in Mac OS X'
  checks:
  - type: command
    command: defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

      2. Verify the value returned is: /System/Library/CoreServices/Menu

      Extras/Bluetooth.menu'
- id: 2.2.1
  title: Enable "Set time and date automatically"
  scoring: scored
  profile:
  - Level 2
  description: Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries. Apple's automatic time update solution will enable an NTP server that is not controlled by the Application
    Firewall. Turning on "Set time and date automatically" allows other computers to connect to set their time and allows
    for exploit attempts against ntpd. It also allows for more accurate network detection and OS fingerprinting.
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features.
  impact: 'Note: If your organization has internal time servers, enter them here. Enterprise mobile devices may need to use
    a mix of internal and external time servers. If multiple servers are required use the Date & Time System Preference with
    each server separated by a space.'
  references: []
  page_start: 15
  audit_raw: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Date & Time

    3. Select Set date and time automatically

    Alternatively run the following commands:

    sudo systemsetup -setnetworktimeserver <timeserver> sudo

    systemsetup -setnetworktimeserver on'
  remediation: '15 | P a g e

    Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Date & Time

    3. Select Set date and time automatically

    Alternatively run the following command:

    sudo systemsetup -setnetworktimeserver <timeserver>'
  checks:
  - type: manual_review
    info: 'Perform the following to implement the prescribed state:

      1. Open System Preferences

      2. Select Date & Time

      3. Select Set date and time automatically

      Alternatively run the following commands:

      sudo systemsetup -setnetworktimeserver <timeserver> sudo

      systemsetup -setnetworktimeserver on'
    severity: medium
- id: 2.2.2
  title: Ensure time set is within appropriate limits
  scoring: scored
  profile:
  - Level 1
  description: Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries. Ensure that time on the computer is within acceptable limits. Truly accurate time is measured within
    milliseconds, for this audit a drift under a minute is considered acceptable. That may be too great for your organizations,
    adjust as needed
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features.
  impact: Accurate time is required for many computer functions. 2.3 Desktop & Screen Saver This section contains recommendations
    related to the configurable items under the Desktop & Screen Saver panel.
  references: []
  page_start: 16
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command:

    sudo systemsetup -getnetworktimeserver

    2. Use "Network Time Server:" your.time.server to capture drift

    3. sudo ntpdate -svd your.time.server

    16 | P a g e'
  remediation: 'Perform the following to implement the prescribed state:

    1. In Terminal, run the following command:

    sudo systemsetup -getnetworktimeserver

    2. Use "Network Time Server:" your.time.server to capture drift

    3. sudo ntpdate -sv your.time.server'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command:

      sudo systemsetup -getnetworktimeserver

      2. Use "Network Time Server:" your.time.server to capture drift

      3. sudo ntpdate -svd your.time.server

      16 | P a g e'
    severity: medium
- id: 2.3.1
  title: Set an inactivity interval of 20 minutes or less for the screen saver
  scoring: scored
  profile:
  - Level 1
  description: A locking screensaver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In OS X the screensaver starts after a value selected
    in a drop down menu, 10 minutes and 20 minutes are both options and either is acceptable. Any value can be selected through
    the command line or script but a number that is not reflected in the GUI can be problematic. 20 minutes is the default
    for new accounts.
  rationale: Setting an inactivity interval for the screensaver prevents unauthorized persons from viewing a system left unattended
    for an extensive period of time.
  impact: 18 | P a g e If the screensaver is not set users may leave the computer available for an unauthorized person to
    access information.
  references: []
  page_start: 17
  audit_raw: '17 | P a g e

    The preferred audit procedure for this control will evaluate every user account on the box

    and will report on all users where the value has been set. If the default value of 20 minutes

    is used and the user has never changed the setting there will not be an audit result on their

    compliant setting.

    Perform the following to ensure the system is configured as prescribed:

    UUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep "IOPlatformUUID" | sed -e ''s/^.*

    "\(.*\)"$/\1/''`

    for i in $(find /Users -type d -maxdepth 1) do

    PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID

    if [ -e $PREF.plist ] then

    echo -n "Checking User: ''$i'': "

    defaults read $PREF.plist idleTime 2>&1

    fi done

    Verify the setting is not 0 but is adequately low (< 1200)

    Perform the following to ensure the system is configured as prescribed for the current

    logged in user:

    1. In Terminal, run the following command:

    defaults -currentHost read com.apple.screensaver idleTime

    2. Verify the setting is not 0 but is adequately low (< 1200)'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Desktop & Screen Saver

    3. Select ScreenSaver

    4. Set Start after to 20 minutes or less

    Alternatively:

    1. In Terminal, run one of the the following commands:

    defaults -currentHost write com.apple.screensaver idleTime -int 600 defaults

    -currentHost write com.apple.screensaver idleTime -int 1200

    There are anomalies if the command line is used make the setting something other than

    what is available in the GUI Menu. Choose either 10 minutes or 20 minutes,'
  checks:
  - type: command
    command: UUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep "IOPlatformUUID" | sed -e 's/^.*
    expected: ''
    severity: medium
    info: '17 | P a g e

      The preferred audit procedure for this control will evaluate every user account on the box

      and will report on all users where the value has been set. If the default value of 20 minutes

      is used and the user has never changed the setting there will not be an audit result on their

      compliant setting.

      Perform the following to ensure the system is configured as prescribed:

      UUID=`ioreg -rd1 '
- id: 2.3.2
  title: Secure screen saver corners
  scoring: scored
  profile:
  - Level 2
  description: Hot Corners can be configured to disable the screen saver by moving the mouse cursor to a corner of the screen.
  rationale: Setting a hot corner to disable the screen saver poses a potential security risk since an unauthorized person
    could use this to bypass the login screen and gain access to the system.
  impact: ''
  references:
  - 1. SV-37242r1_rule
  page_start: 19
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. For all users, run the following command in Terminal:

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    2. Verify that 6 is not returned for any key value for any user.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Mission Control

    3. Select Hot Corners

    4. Remove any corners which are set to Disable Screen Saver'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: 2. Verify that 6 is not returned for any key value for any user.
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. For all users, run the following command in Terminal:

      defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

      2. Verify that 6 is not returned for any key value for any user.'
- id: 2.3.3
  title: Verify Display Sleep is set to a value larger than the Screen Saver
  scoring: scored
  profile:
  - Level 1
  description: If the Screen Saver is used to lock the screen, verify the Display Sleep settings are longer than the Screen
    Saver setting. If the display goes to sleep before the screen saver activates, the computer will appear to be off, but
    will be unprotected.
  rationale: Users of the system can easily assume that the computer is protected when the display goes to sleep. The computer
    should be configured so that the screen is locked whenever the display turns off automatically.
  impact: If the display sleeps before the screensaver is active the computer may be unlocked and available for an unauthorized
    user. 20 | P a g e
  references: []
  page_start: 20
  audit_raw: 'In System Preferences: Energy Saver, verify the slider for "Put the display(s) to sleep..." to a

    reasonable number, but longer than the screen saver setting. The Mac will display a

    warning if the number is too short. Alternatively, use the following command:

    pmset -g | grep displaysleep

    and verify the value returned is longer than the Screen Saver, if the Screen Saver is used to

    lock the screen.'
  remediation: 'In System Preferences: Energy Saver, drag the slider for "Put the display(s) to sleep..." to a

    reasonable number, but longer than the screen saver setting. The Mac will display a

    warning if the number is too short. Alternatively, use the following command:

    sudo pmset -c displaysleep 0

    Note: The -c flag means "wall power." Different settings must be used for other power

    sources.'
  checks:
  - type: command
    command: pmset -g | grep displaysleep
    expected: ''
    severity: medium
    info: 'In System Preferences: Energy Saver, verify the slider for "Put the display(s) to sleep..." to a

      reasonable number, but longer than the screen saver setting. The Mac will display a

      warning if the number is too short. Alternatively, use the following command:

      pmset -g | grep displaysleep

      and verify the value returned is longer than the Screen Saver, if the Screen Saver is used to

      lock the screen.'
- id: 2.3.4
  title: Set a screen corner to Start Screen Saver
  scoring: scored
  profile:
  - Level 1
  description: The intent of this control is to resemble control-alt-delete on Windows Systems as a means of quickly locking
    the screen. If the user of the system is stepping away from the computer the best practice is to lock the screen and setting
    a hot corner is an appropriate method.
  rationale: Ensuring the user has a quick method to lock their screen may reduce opportunity for individuals in close physical
    proximity of the device to see screen contents.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

    least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

    this feature.

    Alternatively, run the following command for each user:

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    For each user, verify at least one of the *-corner keys has a value of 5.For example,

    "wvoustl-corner" = 5.'
  remediation: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

    least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

    this feature.

    The screen corners can be set using the defaults command, but the permutations of

    combinations are many. The plist file to check is ~/Library/Preferences/com.apple.dock

    and the keys are

    wvous-bl-corner wvous-br-corner

    wvous-tl-corner wvous-trcorner

    There are also modifier keys to check and various values for each of these keys. A value of 5

    means the corner will start the screen saver. The corresponding wvous-xx-modifier key

    should be set to 0.

    21 | P a g e

    2.4 Sharing

    This section contains recommendations related to the configurable items under the Sharing

    panel.'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: ''
    severity: medium
    info: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

      least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

      this feature.

      Alternatively, run the following command for each user:

      defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

      For each user, verify at least one of the *-corner keys has a value of 5.For exampl'
- id: 2.4.1
  title: Disable Remote Apple Events
  scoring: scored
  profile:
  - Level 1
  description: Apple Events is a technology that allows one program to communicate with other programs. Remote Apple Events
    allows a program on one computer to communicate with a program on a different computer.
  rationale: Disabling Remote Apple Events mitigates the risk of an unauthorized program gaining access to the system.
  impact: With remote Apple events turned on, an AppleScript program running on another Mac can interact with the local computer.
    22 | P a g e
  references: []
  page_start: 22
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo systemsetup -getremoteappleevents

    2. Verify the value returned is Remote Apple Events: Off'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal:

    sudo systemsetup -setremoteappleevents off'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      sudo systemsetup -getremoteappleevents

      2. Verify the value returned is Remote Apple Events: Off'
    severity: medium
- id: 2.4.2
  title: Disable Internet Sharing
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Internet Sharing uses the open source natd process to share an internet connection with other computers and
    devices on a local network. This allows the Mac to function as a router and share the connection to other, possibly unauthorized,
    devices. Screen sharing allows a computer to connect to another computer on a network and display the computer’s screen.
    While sharing the computer’s screen, the user can control what happens on that computer, such as opening documents or
    applications, opening, moving, or closing windows, and even shutting down the computer. By enabling Printer sharing the
    computer is set up as a print server to accept print jobs from other computers. Dedicated print servers or direct IP printing
    should be used instead.
  rationale: Disabling Internet Sharing reduces the remote attack surface of the system. Disabling screen sharing mitigates
    the risk of remote connections being made without the user of the console knowing that they are sharing the computer.
    24 | P a g e Disabling Printer Sharing mitigates the risk of attackers attempting to exploit the print server to gain
    access to the system.
  impact: Internet sharing allows the computer to function as a router and other computers to use it for access. This can
    expose both the computer itself and the networks it is accessing to unacceptable access from unapproved devices. 2.4.3
    Disable Screen Sharing (Scored)
  references:
  - 1. http://support.apple.com/kb/ph11151 2.4.4
  - 1. http://support.apple.com/kb/PH11450
  page_start: 23
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo defaults read /Library/Preferences/SystemConfiguration/com.apple.nat | grep

    -i Enabled

    The file should not exist or Enabled = 0 for all network interfaces.

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo launchctl load /System/Library/LaunchDaemons/com.apple.screensharing.plist

    2. Verify the value returned is nothing found to load Remediation:

    Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Sharing

    3. Uncheck Screen Sharing

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    system_profiler SPPrintersDataType

    The output should show "Shared: No" for all printers. If no printers are present, the above

    command will yield "Status: The printers list is empty."'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences 2.

    Select Sharing

    3. Uncheck Internet Sharing

    Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Sharing

    3. Uncheck Printer Sharing'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      sudo defaults read /Library/Preferences/SystemConfiguration/com.apple.nat | grep

      -i Enabled

