- id: '3.3'
  title: Configure Security Auditing Flags
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: 'Auditing is the capture and maintenance of information about security-related events. 50 | P a g e A log is
    a file that records the events that occur while an operating system and/or software is running. The built-in syslog capability
    in OS X runs over UDP without encryption. Broadcasting log unencrypted over the internet is not a good idea. While syslog
    may be acceptable on some internal trusted networks it is not a solution for mobile devices that hop between networks.
    Solutions for logging might include: • An encrypted tunnel that auto reconnects for each new network the laptop joins
    • A third party logging daemon that encrypts the log transmission • A local store and forward script that bundles the
    logs and sends periodically through an encrypted transmission (ssh) or when the device is connected to a trusted network'
  rationale: 49 | P a g e Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises or attacks that have occurred, have begun, or are about to begin. Audit logs
    are necessary to provide a trail of evidence in case the system or network is compromised. In addition to local logging,
    remote logging can be enabled for internal computers on trusted networks. Local logs can be altered if the computer is
    compromised. Remote logging mitigates the risk of having the logs altered.
  impact: ''
  references:
  - '1. Rule Version (STIG-ID): OSX00145 M6'
  - '1. Rule Version (STIG-ID): OSX00155 M6'
  page_start: 49
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo egrep "^flags:" /etc/security/audit_control

    2. Ensure at least the following flags are present:

    o lo - audit successful/failed login/logout events o ad -

    audit successful/failed administrative events o fd - audit

    successful/failed file deletion events

    o fm - audit successful/failed file attribute modification

    events o -all - audit all failed events across all audit

    classes

    Note: excluding potentially noisy audit events may be ideal, depending on your use-case.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and edit the /etc/security/audit_control file

    2. Find the line beginning with "flags"

    3. Add the following flags: lo, ad, fd, fm, -all.

    4. Save the file.

    Perform the following to implement the prescribed state:

    1. Run the following command in Terminal:

    sudo pico /etc/syslog.conf

    2. Add the following line to the top of the file, replacing "your.log.server" with the

    name or IP address of the log server, and keeping all other lines intact. *.*

    @your.log.server

    3. Exit, saving changes.

    4. Reboot the system.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      sudo egrep "^flags:" /etc/security/audit_control

      2. Ensure at least the following flags are present:

      o lo - audit successful/failed login/logout events o ad -

      audit successful/failed administrative events o fd - audit

      successful/failed file deletion events

      o fm - audit successful/failed file attribute modification

      events o -all - audit all failed events across all audit

      classes

      Note:'
    severity: medium
