- id: '5.6'
  title: Do not enable the "root" account
  scoring: scored
  profile:
  - Level 1
  description: 66 | P a g e The root account is a superuser account that has access privileges to perform any actions and
    read/write to any file on the computer. In the UNIX/Linux world, the system administrator commonly uses the root account
    to perform administrative functions.
  rationale: Enabling and using the root account puts the system at risk since any successful exploit or mistake while the
    root account is in use could have unlimited access privileges within the system. Using the sudo command allows users to
    perform functions as a root user while limiting and password protecting the access privileges. By default the root account
    is not enabled on a Mac OS X client computer. It is enabled on Mac OS X Server. An administrator can escalate privileges
    using the sudo command (use -s or -i to get a root shell).
  impact: Some legacy posix software might expect an available root account.
  references: []
  page_start: 66
  audit_raw: "Perform the following to ensure the system is configured as prescribed:\n1. Run the following command in Terminal:\n\
    \ dscl . -read /Users/root AuthenticationAuthority\n2. Verify the value returned is:\nNo such key: AuthenticationAuthority"
  remediation: 'Open System Preferences, Uses & Groups. Click the lock icon to unlock it. In the Network

    Account Server section, click Join or Edit. Click Open Directory Utility. Click the lock icon to

    unlock it. Select the Edit menu > Disable Root User.'
  checks:
  - type: manual_review
    info: "Perform the following to ensure the system is configured as prescribed:\n1. Run the following command in Terminal:\n\
      \ dscl . -read /Users/root AuthenticationAuthority\n2. Verify the value returned is:\nNo such key: AuthenticationAuthority"
    severity: medium
