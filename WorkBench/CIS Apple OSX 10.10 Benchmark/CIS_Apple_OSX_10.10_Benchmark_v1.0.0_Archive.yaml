- id: 3.1.1
  title: Retain system.log for 90 or more days
  scoring: scored
  profile:
  - Level 1
  description: OSX writes information pertaining to system-related events to the file /var/log/system.log and has a configurable
    retention policy for this file. The default logging setting limits the file size of the logs and the maximum size for
    all logs with it's own rule in asl.conf. The default allows for an errant application to fill the log files and does not
    enforce sufficient log retention. The Benchmark recommends a value based on standard use cases. The value should align
    with local requirements within the organization. The default value has an "all_max" file limitation, no reference to a
    minimum retention and a less precise rotation argument. • The maximum file size limitation string should be removed "all_max="
    • An organization appropriate retention should be added "ttl=" • The rotation should be set with time stamps "rotate=utc"
    or "rotate=local"
  rationale: Archiving and retaining system.log for 90 or more days is beneficial in the event of an incident as it will allow
    the user to view the various changes to the system along with the date and time they occurred.
  impact: Without log files system maintenance and security forensics cannot be properly performed.
  references: []
  page_start: 45
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    grep -i ttl /etc/asl.conf

    45 | P a g e

    2. Verify that the ttl for system.log is greater than 90 days'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal:

    sudo vim /etc/asl.conf

    2. Replace or edit the current setting with a compliant setting

    > system.log mode=0640 format=bsd rotate=utc compress file_max=5M ttl=90'
  checks:
  - type: command
    command: grep -i ttl /etc/asl.conf
    expected: 2. Verify that the ttl for system.log is greater than 90 days
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      grep -i ttl /etc/asl.conf

      45 | P a g e

      2. Verify that the ttl for system.log is greater than 90 days'
