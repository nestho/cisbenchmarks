    REST API objects. This data directory should be protected from any unauthorized reads or writes. It should be owned by
    etcd:etcd. NOTE: The only users that exist on an RHCOS OpenShift node are root and core. This is intentional, as regular
    management of the underlying RHCOS cluster nodes is designed to be performed via the OpenShift API itself. The core user
    is a member of the wheel group, which gives it permission to use sudo for running privileged commands. Adding additional
    users at the node level is highly discouraged.'
