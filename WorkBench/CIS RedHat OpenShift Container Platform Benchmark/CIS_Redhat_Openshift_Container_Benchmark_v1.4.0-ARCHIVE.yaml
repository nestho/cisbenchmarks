    severity: medium
- id: 5.2.10
  title: Minimize access to privileged Security Context Constraints
  scoring: manual
  profile:
  - Level 2
  - Level 1
  description: OpenShift has the concept of Security Context Constraints (SCCs) that supplement the Pod Security Admission
    controller. SCCs allow you to group elevated container capabilities and assign those capabilities to users and groups.
    For example, you can have an SCC that restricts the ability to launch privileged containers and assign that SCC to all
    authenticated users. As a result, users requesting a pod that contains a privileged container will be rejected. You can
    find more information on SCCs in the OpenShift documentation.
  rationale: SCCs that contain the ability to permit privileged or elevated container action should be carefully managed.
    Users with access to such an SCC can leverage the privileged functionality granted by that SCC, increasing the risk of
    compromising the container or host.
  impact: Users should only have access to SCCs that allow them to perform functions required by their roles, and no more,
    following the principle of least privilege.
  references: []
  page_start: 274
  audit_raw: "Find all users and groups with access to SCCs that include privileged or elevated\ncapabilities:\n oc get scc\
    \ -ojson | jq '.items[]|select(.allowHostIPC or .allowHostPID or\n.allowHostPorts or .allowHostNetwork or .allowHostDirVolumePlugin\
    \ or\n.allowPrivilegedContainer or .runAsUser.type != \"MustRunAsRange\"\n)|.metadata.name,{\"Group:\":.groups},{\"User\"\
    :.users}'\nReview the returned users and groups and verify they actually need access to those\nSCCs."
  remediation: 'Remove any users and groups who do not need access to an SCC, following the

    principle of least privilege.

    You can remove users and groups from an SCC using the oc edit scc $NAME

    command.

    Additionally, you can create your own SCCs that contain the container functionality you

    need for a particular use case and assign that SCC to users and groups if the default

    SCCs are not appropriate for your use case.'
  checks:
  - type: manual_review
    info: "Find all users and groups with access to SCCs that include privileged or elevated\ncapabilities:\n oc get scc -ojson\
      \ | jq '.items[]|select(.allowHostIPC or .allowHostPID or\n.allowHostPorts or .allowHostNetwork or .allowHostDirVolumePlugin\
      \ or\n.allowPrivilegedContainer or .runAsUser.type != \"MustRunAsRange\"\n)|.metadata.name,{\"Group:\":.groups},{\"\
      User\":.users}'\nReview the returned users and groups and verify they actually need access to those\nSCCs."
    severity: medium
