- id: 1.2.25
  title: Ensure that the --service-account-lookup argument is set to true
  scoring: manual
  profile:
  - Level 1
  description: Validate service account before validating token.
  rationale: If --service-account-lookup is not enabled, the apiserver only verifies that the authentication token is valid,
    and does not validate that the service account token mentioned in the request is actually present in etcd. This allows
    using a service account token even after the corresponding service account is deleted. This is an example of time of check
    to time of use security issue.
  impact: None.
  references:
