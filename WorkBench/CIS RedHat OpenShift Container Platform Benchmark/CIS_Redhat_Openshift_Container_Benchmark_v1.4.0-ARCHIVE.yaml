- id: 1.1.11
  title: Ensure that the etcd data directory permissions are set to 700 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the etcd data directory has permissions of 700 or more restrictive.
  rationale: etcd is a highly-available key-value store used by Kubernetes deployments for persistent storage of all of its
    REST API objects. This data directory should be protected from any unauthorized reads or writes. It should not be readable
    or writable by any group members or the world.
  impact: None
  references:
  - 1. https://docs.openshift.com/container-platform/4.3/architecture/controlplane.html#defining-masters_control-plane
  - 2. https://etcd.io/#data-dir
  page_start: 39
  audit_raw: 'In OpenShift 4, etcd members are deployed on the master nodes as static pods. The

    pod specification file is created on control plane nodes at

    /etc/kubernetes/manifests/etcd-member.yaml. The etcd database is stored on the

    container host in /var/lib/etcd and mounted to the etcd-member container via the host

    path mount data-dir with the same filesystem path (/var/lib/etcd). The permissions for

    this directory on the container host is 700.

    Starting with OCP 4.4, etcd is managed by the cluster-etcd-operator. The etcd

    operator will help to automate restoration of master nodes. There is also a new etcdctl

    container in the etcd static pod for quick debugging. cluster-admin rights are required to

    exec into etcd containers.

    Run the following commands.

    for i in $(oc get pods -n openshift-etcd -l app=etcd -oname); do oc exec -n

    openshift-etcd -c etcd $i -- stat -c %a%n /var/lib/etcd/member; done

    Verify that the permissions are 700.'
