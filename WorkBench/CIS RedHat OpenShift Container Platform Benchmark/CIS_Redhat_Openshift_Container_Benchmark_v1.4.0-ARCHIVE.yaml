- id: 5.2.2
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
    also has access to ptrace capabilities this can be used to escalate privileges outside of the container. There should
    be at least one Security Context Constraint (SCC) defined which does not permit containers to share the host PID namespace.
    If you need to run containers which require hostPID, this should be defined in a separate SCC and you should carefully
    check RBAC controls to ensure that only limited service accounts and users are given permission to access that SCC.
  impact: 'Pods defined with Allow Host PID: true will not be permitted unless they are run under a specific SCC.'
  references:
  - 1. https://docs.openshift.com/container-platform/latest/authentication/managingsecurity-context-constraints.html
  - 2. https://kubernetes.io/docs/concepts/policy/pod-security-policy/
  page_start: 258
  audit_raw: 'Use the following command to list all SCCs with allowHostPID set to true:

    oc get scc -o json | jq ''.items[] | select(.allowHostPID) | .metadata.name''

    Verify that at least one SCC is returned.'
  remediation: 'Create an SCC that sets allowHostPID to false and take it into use by assigning it to

    applicable users and groups.'
  checks:
  - type: manual_review
    info: 'Use the following command to list all SCCs with allowHostPID set to true:

      oc get scc -o json | jq ''.items[] | select(.allowHostPID) | .metadata.name''

