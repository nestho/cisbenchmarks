- id: 1.2.26
  title: Ensure that the --service-account-key-file argument is set as appropriate
  scoring: manual
  profile:
  - Level 1
  description: Explicitly set a service account public key file for service accounts on the apiserver.
  rationale: By default, if no --service-account-key-file is specified to the apiserver, it uses the private key from the
    TLS serving certificate to verify service account tokens. To ensure that the keys for service account tokens could be
    rotated as needed, a separate public/private key pair should be used for signing service account tokens. Hence, the public
    key should be specified to the apiserver with --service-account-key-file.
  impact: The corresponding private key must be provided to the controller manager. You would need to securely maintain the
    key file and rotate the keys based on your organization's key rotation policy.
