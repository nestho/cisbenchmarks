- id: 1.1.7
  title: Ensure that the etcd pod specification file permissions are set to 600 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the /etc/kubernetes/manifests/etcd.yaml file has permissions of 600 or more restrictive.
  rationale: The etcd pod specification file /etc/kubernetes/manifests/etcd.yaml controls various parameters that set the
    behavior of the etcd service in the master node. etcd is a highly-available key-value store which Kubernetes uses for
    persistent storage of all of its REST API object. You should restrict its file permissions to maintain the integrity of
    the file. The file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://docs.openshift.com/container-platform/latest/architecture/controlplane.html#defining-masters_control-plane
  - 2. https://github.com/openshift/cluster-etcdoperator/blob/master/bindata/etcd/pod.yaml
  page_start: 29
  audit_raw: "In OpenShift 4, starting with OpenShift 4.4, the etcd pod specification file is generated\nby the cluster etcd\
    \ operator.\nThe default etcd pod specification file is available here: openshift/cluster-etcd-operator\nRun the following\
    \ command.\nfor i in $(oc get pods -n openshift-etcd -l app=etcd -o name | grep etcd )\ndo\n echo \"check pod $i\"\n oc\
    \ rsh -n openshift-etcd $i \\\n stat -c %a /etc/kubernetes/manifests/etcd-pod.yaml\ndone\nVerify that the permissions\
    \ are 600 or more restrictive."
  remediation: 'There is no remediation for updating the permissions of etcd-pod.yaml. The file is

    owned by an OpenShift operator and any changes to the file will result in a degraded

    cluster state.

    Please do not attempt to remediate the permissions of this file.'
  checks:
  - type: command
    command: for i in $(oc get pods -n openshift-etcd -l app=etcd -o name | grep etcd ) && stat -c %a /etc/kubernetes/manifests/etcd-pod.yaml
    expected: Verify that the permissions are 600 or more restrictive.
    severity: medium
    info: "In OpenShift 4, starting with OpenShift 4.4, the etcd pod specification file is generated\nby the cluster etcd\
      \ operator.\nThe default etcd pod specification file is available here: openshift/cluster-etcd-operator\nRun the following\
      \ command.\nfor i in $(oc get pods -n openshift-etcd -l app=etcd -o name | grep etcd )\ndo\n echo \"check pod $i\"\n\
      \ oc rsh -n openshift-etcd $i \\\n stat -c %a /etc/kubernetes/mani"
