- id: 5.2.7
  title: Minimize the admission of containers with the NET_RAW capability
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers with the potentially dangerous NET_RAW capability.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. By default this can include
    potentially dangerous capabilities. With Docker as the container runtime the NET_RAW capability is enabled which may be
    misused by malicious containers. Ideally, all containers should drop this capability. There should be at least one Security
    Context Constraint (SCC) defined which prevents containers with the NET_RAW capability from launching. If you need to
    run containers with this capability, this should be defined in a separate SCC and you should carefully check RBAC controls
    to ensure that only limited service accounts and users are given permission to access that SCC.
  impact: Pods with containers which run with the NET_RAW capability will not be permitted.
  references:
  - 1. https://docs.openshift.com/container-platform/latest/authentication/managingsecurity-context-constraints.html
  - 2. https://kubernetes.io/docs/concepts/policy/pod-security-policy/#enabling-podsecurity-policies
  page_start: 268
  audit_raw: 'Use the following command to list all SCCs that drop all capabilities:

    oc get scc -A -o json | jq ''.items[] |

    select(.requiredDropCapabilities[]?|any(. == "ALL"; .)) | .metadata.name''

    Verify at least one SCC is returned.'
  remediation: 'Create an SCC that sets requiredDropCapabilities to include ALL or at least NET_RAW

    and take it into use by assigning it to applicable users and groups.'
  checks:
  - type: manual_review
    info: 'Use the following command to list all SCCs that drop all capabilities:

      oc get scc -A -o json | jq ''.items[] |

      select(.requiredDropCapabilities[]?|any(. == "ALL"; .)) | .metadata.name''

      Verify at least one SCC is returned.'
    severity: medium
- id: 5.2.8
  title: Minimize the admission of containers with added capabilities
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers with capabilities assigned beyond the default set.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities outside
    this set can be added to containers which could expose them to risks of container breakout attacks. There should be at
    least one Security Context Constraint (SCC) defined which prevents containers with capabilities beyond the default set
    from launching. If you need to run containers with additional capabilities, this should be defined in a separate SCC and
    you should carefully check RBAC controls to ensure that only limited service accounts and users are given permission to
    access that SCC.
  impact: Pods with containers which require capabilities outside the default set will not be permitted.
  references:
  - 1. https://docs.openshift.com/container-platform/latest/authentication/managingsecurity-context-constraints.html
  - 2. https://kubernetes.io/docs/concepts/policy/pod-security-policy/#enabling-podsecurity-policies
  page_start: 270
