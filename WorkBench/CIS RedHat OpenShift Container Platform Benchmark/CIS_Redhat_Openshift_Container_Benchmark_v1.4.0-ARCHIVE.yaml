- id: 1.2.24
  title: Ensure that the --request-timeout argument is set
  scoring: manual
  profile:
  - Level 1
  description: The API server minimum request timeout defines the minimum number of seconds a handler must keep a request
    open before timing it out.
  rationale: Setting global request timeout allows extending the API server request timeout limit to a duration appropriate
    to the user's connection speed. By default, it is set to 3600 seconds in OpenShift 4. Allowing users to set this timeout
    limit to be too small can be insufficient for some connections and too large can exhaust the API server resources making
    it prone to Denial-of-Service attack. Hence, it is not supported to adjust this value in OpenShift 4.
