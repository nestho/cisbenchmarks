    Run the following commands to verify the cipher suite and minTLSversion for the\ningress operator, authentication operator,\
    \ cliconfig, OpenShift APIserver and Kube\nAPIserver.\nUse the following command to verify the available ciphers:\noc\
    \ get --namespace=openshift-ingress-operator ingresscontroller/default -\nojson | jq .status.tlsProfile.ciphers\nVerify\
    \ the ciphers used by the Kubernetes API server:\noc get kubeapiservers.operator.openshift.io cluster -ojson | jq\n.spec.observedConfig.servingInfo.cipherSuites\n\
    Verify the ciphers used by the OpenShift API server:\noc get openshiftapiservers.operator.openshift.io cluster -ojson\
    \ | jq\n.spec.observedConfig.servingInfo.cipherSuites\nVerify the ciphers used by OpenShift authentication:\noc get cm\
    \ -n openshift-authentication v4-0-config-system-cliconfig -o\njsonpath='{.data.v4\\-0\\-config\\-system\\-cliconfig}'\
