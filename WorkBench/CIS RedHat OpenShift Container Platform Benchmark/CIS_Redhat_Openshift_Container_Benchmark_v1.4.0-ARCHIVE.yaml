  title: Ensure that the audit logs are forwarded off the cluster for retention
  scoring: manual
  profile:
  - Level 1
  description: Retain the logs for at least 30 days or as appropriate.
  rationale: Retaining logs for at least 30 days ensures that you can go back in time and investigate or correlate any events.
