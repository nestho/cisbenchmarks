- id: 4.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Enable Kubelet authentication using certificates.
  rationale: The connections from the apiserver to the kubelet are used for fetching logs for pods, attaching (through kubectl)
    to running pods, and using the kubelet’s port-forwarding functionality. These connections terminate at the kubelet’s HTTPS
    endpoint. By default, the apiserver does not verify the kubelet’s serving certificate, which makes the connection subject
    to man-in-the-middle attacks, and unsafe to run over untrusted and/or public networks. Enabling Kubelet certificate authentication
    ensures that the apiserver could authenticate the Kubelet before submitting any requests.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
  - 2. https://docs.openshift.com/containerplatform/4.5/scalability_and_performance/recommended-hostpractices.html#create-a-kubeletconfig-crd-to-edit-kubelet-parameters_
  page_start: 230
  audit_raw: "OpenShift provides integrated management of certificates for internal cluster\ncomponents. OpenShift 4 includes\
    \ multiple CAs providing independent chains of trust,\nwhich ensure that a platform CA will never accidentally sign a\
    \ certificate that can be\nused for the wrong purpose, increasing the security posture of the cluster. The Client\nCA\
    \ location for the kubelet is defined in /etc/kubernetes/kubelet.conf.\nRun the following command:\nfor node in $(oc get\
    \ nodes -o jsonpath='{.items[*].metadata.name}')\ndo\n oc debug node/${node} -- chroot /host grep -B3 client-ca-file:\n\
    /etc/systemd/system/kubelet.service\ndone\nVerify that the clientCAFile exists and is set to /etc/kubernetes/kubelet-ca.crt.\
    \ The\noutput should look like the following:\napiVersion: kubelet.config.k8s.io/v1beta1\nauthentication:\n x509:\n clientCAFile:\
    \ /etc/kubernetes/kubelet-ca.crt"
  remediation: None required. Changing the clientCAFile value is unsupported.
