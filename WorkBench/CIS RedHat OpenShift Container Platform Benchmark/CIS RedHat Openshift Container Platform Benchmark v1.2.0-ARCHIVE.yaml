    command: oc get machineconfig 01-worker-kubelet -o yaml | grep hostname-override && oc get machineconfig 01-master-kubelet
      -o yaml | grep hostname-override && oc get machineconfig 01-worker-kubelet -o yaml | grep --color && oc get machineconfig
      01-master-kubelet -o yaml | grep --color
    expected: Verify that --hostname-override argument does not exist.
