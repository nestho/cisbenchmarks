- id: 4.2.10
  title: Ensure that the --tls-cert-file and --tls-private-key-file arguments are set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Setup TLS connection on the Kubelets.
  rationale: The connections from the apiserver to the kubelet are used for fetching logs for pods, attaching (through kubectl)
    to running pods, and using the kubelet’s port-forwarding functionality. These connections terminate at the kubelet’s HTTPS
    endpoint. By default, the apiserver does not verify the kubelet’s serving certificate, which makes the connection subject
    to man-in-the-middle attacks, and unsafe to run over untrusted and/or public networks.
  impact: TLS and client certificate authentication must be configured for your Kubernetes cluster deployment.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  page_start: 246
  audit_raw: 'By default, OpenShift uses X.509 certificates to provide secure connections between

    the API server and node/kubelet. OpenShift Container Platform monitors certificates for

    proper validity, for the cluster certificates it issues and manages. The OpenShift

    Container Platform manages certificate rotation and the alerting framework has rules to

    help identify when a certificate issue is about to occur.

    Run the following command on each node:

    oc get configmap config -n openshift-kube-apiserver -ojson | jq -r

    ''.data["config.yaml"]'' | jq ''.kubeletClientInfo''

    Verify that the kubelet-client-certificate argument is set to

    /etc/kubernetes/static-pod-certs/secrets/kubelet-client/tls.crt

    Verify that the kubelet-client-key argument is set to /etc/kubernetes/static-podcerts/secrets/kublet-client/tls.key'
  remediation: 'OpenShift automatically manages TLS authentication for the API server communication

    with the node/kublet. This is not configurable.'
  checks:
  - type: manual_review
    info: 'By default, OpenShift uses X.509 certificates to provide secure connections between

      the API server and node/kubelet. OpenShift Container Platform monitors certificates for

      proper validity, for the cluster certificates it issues and manages. The OpenShift

      Container Platform manages certificate rotation and the alerting framework has rules to

      help identify when a certificate issue is about to occur.

      Run the following command on each node:

      oc get configmap config -n openshift-kube-apiserver -ojson '
    severity: medium
- id: 4.2.11
  title: Ensure that the --rotate-certificates argument is not set to false
  scoring: manual
  profile:
  - Level 1
  description: Enable kubelet client certificate rotation.
  rationale: 'The --rotate-certificates setting causes the kubelet to rotate its client certificates by creating new CSRs
    as its existing credentials expire. This automated periodic rotation ensures that the there is no downtime due to expired
    certificates and thus addressing availability in the CIA security triad. Note: This recommendation only applies if you
    let kubelets get their certificates from the API server. In case your kubelet certificates come from an outside authority/tool
    (e.g. Vault) then you need to take care of rotation yourself.'
  impact: None
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
