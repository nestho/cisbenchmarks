- id: 1.3.1
  title: Ensure that garbage collection is configured as appropriate
  scoring: manual
  profile:
  - Level 1
  description: Activate garbage collector on pod termination, as appropriate.
  rationale: Garbage collection is important to ensure sufficient resource availability and avoiding degraded performance
    and availability. In the worst case, the system might crash or just be unusable for a long period of time. The current
    setting for garbage collection is 12,500 terminated pods which might be too high for your system to sustain. Based on
    your system resources and tests, choose an appropriate threshold value to activate garbage collection.
  impact: None
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#cluster-openshift-controller-manager-operator_red-hat-operators
  - 2. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#kube-controller-manager-operator_red-hat-operators
  page_start: 149
  audit_raw: 'Two types of garbage collection are performed on an OpenShift Container Platform

    node:

    • Container garbage collection: Removes terminated containers.

    • Image garbage collection: Removes images not referenced by any running pods.

    Container garbage collection can be performed using eviction thresholds. Image

    garbage collection relies on disk usage as reported by cAdvisor on the node to decide

    which images to remove from the node. Default values are found here

    https://github.com/openshift/kubernetes-kubelet/blob/origin-4.5-kubernetes1.18.3/config/v1beta1/types.go#L554-L604

    The OpenShift administrator can configure how OpenShift Container Platform performs

    garbage collection by creating a kubeletConfig object for each Machine Config Pool

    using any combination of the following:

    • soft eviction for containers

    • hard eviction for containers

    • eviction for images

    To configure, follow the directions in

    https://docs.openshift.com/container-platform/4.5/nodes/nodes/nodes-nodes-garbagecollection.html#nodes-nodes-garbage-collection-configuring_nodes-nodes-configuring

    To verify settings, run the following command for each updated configpool

    oc get machineconfigpool

    # For each machineconfigpool

    oc describe machineconfigpool <name>

    #For example

    oc describe machineconfigpool master

    oc describe machineconfigpool worker

    Verify the values for the following are set as appropriate.

    eviction-soft

    evictionSoftGracePeriod

    evictionHard

    evictionPressureTransitionPeriod'
  remediation: 'To configure, follow the directions in Configuring garbage collection for containers and

    images'
  checks:
  - type: manual_review
    info: 'Two types of garbage collection are performed on an OpenShift Container Platform

      node:

      • Container garbage collection: Removes terminated containers.

      • Image garbage collection: Removes images not referenced by any running pods.

      Container garbage collection can be performed using eviction thresholds. Image

      garbage collection relies on disk usage as reported by cAdvisor on the node to decide

      which images to remove from the node. Default values are found here

      https://github.com/openshift/kubernete'
    severity: medium
- id: 1.3.2
  title: Ensure that controller manager healthz endpoints are protected by RBAC
  scoring: manual
  profile:
  - Level 1
  description: Disable profiling, if not needed.
  rationale: Profiling allows for the identification of specific performance bottlenecks. It generates a significant amount
    of program data that could potentially be exploited to uncover system and program details. If you are not experiencing
    any bottlenecks and do not need the profiler for troubleshooting purposes, it is recommended to turn it off to reduce
    the potential attack surface.
  impact: Profiling information would not be available.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#cluster-openshift-controller-manager-operator_red-hat-operators
  - 2. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#kube-controller-manager-operator_red-hat-operators
  page_start: 152
  audit_raw: 'By default, the Controller Manager operator exposes metrics via the metrics service.

    Profiling data is sent to healthzPort, the port of the localhost healthz endpoint.

    Changing this value may disrupt components that monitor the kubelet health. To ensure

    the collected data is not exploited, profiling endpoints are secured via RBAC (see

    cluster-debugger role). By default, the profiling endpoints are accessible only by users

    bound to cluster-admin or cluster-debugger role.

    Profiling cannot be disabled.

    To verify the configuration, run the following command:

    Run the following command:

    # Verify configuration for ports, livenessProbe, readinessProbe, healthz

    oc -n openshift-kube-controller-manager get cm kube-controller-manager-pod -o

    json | jq -r ''.data."pod.yaml"'' | jq ''.spec.containers''

    # Verify endpoints

    oc -n openshift-kube-controller-manager describe endpoints

    # Test to validate RBAC enabled on the controller endpoint; check with nonadmin role

    oc project openshift-kube-controller-manager

    POD=$(oc get pods -n openshift-kube-controller-manager -l app=kubecontroller-manager -o jsonpath=''{.items[0].metadata.name}'')

    PORT=$(oc get pods -n openshift-kube-controller-manager -l app=kubecontroller-manager -o

    jsonpath=''{.items[0].spec.containers[0].ports[0].hostPort}'')

    # Following should return 403 Forbidden

    oc rsh -n openshift-kube-controller-manager ${POD} curl

    https://localhost:${PORT}/metrics -k

    # Create a service account to test RBAC

    oc create -n openshift-kube-controller-manager sa permission-test-sa

    # Should return 403 Forbidden

    SA_TOKEN=$(oc sa -n openshift-kube-controller-manager get-token permissiontest-sa)

    oc rsh -n openshift-kube-controller-manager ${POD} curl

    https://localhost:${PORT}/metrics -H "Authorization: Bearer $SA_TOKEN" -k

    # Cleanup

    oc delete -n openshift-kube-controller-manager sa permission-test-sa

    # As cluster admin, should succeed

    CLUSTER_ADMIN_TOKEN=$(oc whoami -t)

    oc rsh -n openshift-kube-controller-manager ${POD} curl

    https://localhost:${PORT}/metrics -H "Authorization: Bearer

    $CLUSTER_ADMIN_TOKEN" -k

    Verify that the livenessProbe and readinessProbe are set to path: healthz.

    Verify that regular users cannot learn anything about the controller manager.

    Verify that users with the cluster_admin role can retrieve metrics from the endpoint.'
  remediation: None required; profiling is protected by RBAC.
  checks:
  - type: manual_review
    info: 'By default, the Controller Manager operator exposes metrics via the metrics service.

