- id: 1.1.1
  title: Ensure that the API server pod specification file permissions are set to 600 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the API server pod specification file has permissions of 600 or more restrictive.
  rationale: The API server pod specification file controls various parameters that set the behavior of the API server. You
    should restrict its file permissions to maintain the integrity of the file. The file should be writable only by the administrators
    on the system.
  impact: None
  references:
  - 1. https://docs.openshift.com/container-platform/4.3/architecture/controlplane.html#defining-masters_control-plane
  - 2. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#kube-apiserver-operator_red-hat-operators
  page_start: 15
  audit_raw: "OpenShift 4 deploys two API servers: the OpenShift API server and the Kube API\nserver. The OpenShift API server\
    \ delegates requests for Kubernetes objects to the\nKube API server.\nThe OpenShift API server is managed as a deployment.\
    \ The pod specification yaml for\nopenshift-apiserver is stored in etcd.\nThe Kube API Server is managed as a static pod.\
    \ The pod specification file for the\nkube-apiserver is created on the control plane nodes at /etc/kubernetes/manifests/kubeapiserver-pod.yaml.\
    \ The kube-apiserver is mounted via hostpath to the kube-apiserver\npods via /etc/kubernetes/static-pod-resources/kube-apiserver-pod.yaml\
    \ with\npermissions 0644.\nTo verify pod specification file permissions for the kube-apiserver, run the following\ncommand.\n\
    #echo “check kube-apiserver pod specification file permissions”\nfor i in $( oc get pods -n openshift-kube-apiserver -l\
    \ app=openshift-kubeapiserver -o name )\ndo\n oc exec -n openshift-kube-apiserver $i -- \\\n stat -c %a /etc/kubernetes/static-pod-resources/kube-apiserver-pod.yaml\n\
    done\nVerify that the permissions are 600 or more restrictive."
  remediation: 'execute command:

    chmod 600 /etc/kubernetes/static-pod-resources/kube-apiserver-pod.yaml'
  checks:
  - type: command
    command: stat -c %a /etc/kubernetes/static-pod-resources/kube-apiserver-pod.yaml
    expected: Verify that the permissions are 600 or more restrictive.
    severity: medium
    info: 'OpenShift 4 deploys two API servers: the OpenShift API server and the Kube API

      server. The OpenShift API server delegates requests for Kubernetes objects to the

      Kube API server.

      The OpenShift API server is managed as a deployment. The pod specification yaml for

      openshift-apiserver is stored in etcd.

      The Kube API Server is managed as a static pod. The pod specification file for the

      kube-apiserver i'
