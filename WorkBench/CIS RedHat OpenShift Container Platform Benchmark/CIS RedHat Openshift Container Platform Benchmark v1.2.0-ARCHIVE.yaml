    \ TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305\n TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384\n TLS_RSA_WITH_AES_256_GCM_SHA384\n TLS_RSA_WITH_AES_128_GCM_SHA256\n\
    Ciphers for the API servers, authentication and the ingress controller can be configured\nusing the tlsSecurityProfile\
    \ parameter as of OpenShfit 4.3. The ingress controller\nprovides external access to the API server. There are four TLS\
    \ security profile types:\n• Old\n• Intermediate\n• Modern\n• Custom\nOnly the Old, Intermediate and Custom profiles are\
    \ supported at this time for the\nIngress controller. Custom provides the ability to specify individual TLS security profile\n\
    parameters. Follow the steps in the documentation to configure the cipher suite for\nIngress, API server and Authentication.\
    \ https://docs.openshift.com/containerplatform/4.5/networking/ingress-operator.html#nw-ingress-controller-configurationparameters_configuring-ingress\n\
    Run the following commands to verify the cipher suite and minTLSversion for the\ningress operator, authentication operator,\
    \ cliconfig, OpenShift APIserver and Kube\nAPIserver.\n# needs verification\n# verify cipher suites\noc describe --namespace=openshift-ingress-operator\
    \ ingresscontroller/default\noc get kubeapiservers.operator.openshift.io cluster -o json |jq\n.spec.observedConfig.servingInfo\n\
    oc get openshiftapiservers.operator.openshift.io cluster -o json |jq\n.spec.observedConfig.servingInfo\noc get cm -n openshift-authentication\
    \ v4-0-config-system-cliconfig -o\njsonpath='{.data.v4\\-0\\-config\\-system\\-cliconfig}' | jq .servingInfo\n#check value\
    \ for tlsSecurityProfile; null is returned if default is used\noc get kubeapiservers.operator.openshift.io cluster -o\
    \ json |jq\n.spec.tlsSecurityProfile\nVerify that the cipher suites are appropriate.\nVerify that the tlsSecurityProfile\
