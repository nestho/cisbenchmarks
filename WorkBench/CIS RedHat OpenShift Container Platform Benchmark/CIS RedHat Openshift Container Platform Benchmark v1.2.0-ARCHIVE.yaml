    \ -ojson | \\\n jq -r '.data[\"config.yaml\"]' | \\\n jq '.auditConfig[]'\n#To verify openshift apiserver audit config\n\
    oc get configmap config -n openshift-apiserver -ojson | \\\n jq -r '.data[\"config.yaml\"]' | \\\n jq '.auditConfig[]'\n\
    Verify that log files are returned.\nVerify the audit log configuration."
