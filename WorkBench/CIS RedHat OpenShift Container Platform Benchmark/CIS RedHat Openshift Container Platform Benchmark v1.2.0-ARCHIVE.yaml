- id: 4.2.6
  title: Ensure that the --protect-kernel-defaults argument is not set
  scoring: manual
  profile:
  - Level 1
  description: Protect tuned kernel parameters from overriding kubelet default kernel parameter values.
  rationale: Kernel parameters are usually tuned and hardened by the system administrators before putting the systems into
    production. These parameters protect the kernel and the system. Your kubelet kernel defaults that rely on such parameters
    should be appropriately set to match the desired secured system state. Ignoring this could potentially lead to running
    pods with undesired kernel behavior.
  impact: You would have to re-tune kernel parameters to match kubelet parameters.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
  - 2. https://github.com/openshift/kubernetes-kubelet/blob/origin-4.5-kubernetes1.18.3/config/v1beta1/types.go#L618-L626
  page_start: 237
  audit_raw: 'The OpenShift 4 kubelet modifies the system tunable; using the protect-kerneldefaults flag will cause the kubelet
    to fail on start if the tunables don''t match the

    kubelet configuration and the OpenShift node will fail to start.

    Run the following command:

    for node in $(oc get nodes -o jsonpath=''{.items[*].metadata.name}''); do oc

    debug node/${node} -- chroot /host more /etc/kubernetes/kubelet.conf; done

    Verify that protectKernelDefaults is not present.'
