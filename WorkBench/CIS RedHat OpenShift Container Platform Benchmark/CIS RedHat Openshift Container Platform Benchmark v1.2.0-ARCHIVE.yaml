  profile:
  - Level 1
  description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment
    variable secrets.
  rationale: It is reasonably common for application code to log out its environment (particularly in the event of an error).
    This will include any secret values passed in as environment variables, so secrets can easily be exposed to any user or
    entity who has access to the logs.
  impact: Application code which expects to read secrets in the form of environment variables would need modification
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets
  page_start: 297
  audit_raw: 'Information about ways to provide sensitive data to pods is included in the

    documentation.

    Providing sensitive data to pods

    Run the following command to find references to objects which use environment

    variables defined from secrets.

    oc get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

    {.metadata.name} {"\n"}{end}'' -A'
  remediation: 'If possible, rewrite application code to read secrets from mounted secret files, rather

    than from environment variables.'
  checks:
  - type: manual_review
    info: 'Information about ways to provide sensitive data to pods is included in the

      documentation.

      Providing sensitive data to pods

      Run the following command to find references to objects which use environment

      variables defined from secrets.

      oc get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

      {.metadata.name} {"\n"}{end}'' -A'
    severity: medium
- id: 5.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider the use of an external secrets storage and management system, instead of using Kubernetes Secrets
    directly, if you have more complex secret management needs. Ensure the solution requires authentication to access secrets,
    has auditing of access to and use of secrets, and encrypts secrets. Some solutions also make it easier to rotate secrets.
  rationale: Kubernetes supports secrets as first-class objects, but care needs to be taken to ensure that access to secrets
    is carefully limited. Using an external secrets provider can ease the management of access to secrets, especially where
    secrets are used across both Kubernetes and non-Kubernetes environments.
  impact: None
  references: []
  page_start: 299
  audit_raw: 'OpenShift supports a broad ecosystem of security partners many of whom provide

    integration with enterprise secret vaults.

    Review your secrets management implementation.'
  remediation: 'Refer to the secrets management options offered by your cloud provider or a third-party

    secrets management solution.'
  checks:
  - type: manual_review
    info: 'OpenShift supports a broad ecosystem of security partners many of whom provide

      integration with enterprise secret vaults.

      Review your secrets management implementation.'
    severity: medium
- id: 5.5.1
  title: Configure Image Provenance using image controller configuration parameters
  scoring: manual
  profile:
  - Level 2
  description: Configure Image Provenance for your deployment.
  rationale: Kubernetes supports plugging in provenance rules to accept or reject the images in your deployments. You could
    configure such rules to ensure that only approved images are deployed in the cluster. You can control which images can
    be imported, tagged, and run in a cluster using the image controller. For additional information on the image controller,
    see Image configuration resources
  impact: You need to regularly maintain your provenance configuration based on container image updates.
  references:
  - 1. https://kubernetes.io/docs/reference/access-authn-authz/admissioncontrollers/#imagepolicywebhook
  - 2. https://github.com/kubernetes/community/blob/master/contributors/designproposals/image-provenance.md
  page_start: 302
  audit_raw: 'Review the image controller parameters in your cluster and verify that image

    provenance is configured as appropriate.'
  remediation: 'Follow the OpenShift documentation: [Image configuration

    resources](https://docs.openshift.com/container-platform/4.5/openshift_images/imageconfiguration.html'
  checks:
  - type: manual_review
    info: 'Review the image controller parameters in your cluster and verify that image

      provenance is configured as appropriate.'
    severity: medium
- id: 5.7.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Use namespaces to isolate your Kubernetes objects.
  rationale: Limiting the scope of user permissions can reduce the impact of mistakes or malicious activities. A Kubernetes
    namespace allows you to partition created resources into logically named groups. Resources created in one namespace can
    be hidden from other namespaces. By default, each resource created by a user in Kubernetes cluster runs in a default namespace,
    called default. You can create additional namespaces and attach resources and users to them. You can use Kubernetes Authorization
    plugins to create policies that segregate access to namespace resources between different users.
  impact: You need to switch between namespaces for administration.
  references:
  - 1. https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  - 2. https://kubernetes.io/blog/2016/08/security-best-practices-kubernetesdeployment/
  page_start: 305
  audit_raw: 'OpenShift Projects wrap Kubernetes namespaces and are used by default in OpenShift

    4.

    Run the following command and review the namespaces created in the cluster.

    oc get namespaces

    Ensure that these namespaces are the ones you need and are adequately administered

    as per your requirements.'
  remediation: 'Follow the documentation and create namespaces for objects in your deployment as

    you need them.'
  checks:
  - type: manual_review
    info: 'OpenShift Projects wrap Kubernetes namespaces and are used by default in OpenShift

      4.

      Run the following command and review the namespaces created in the cluster.

      oc get namespaces

      Ensure that these namespaces are the ones you need and are adequately administered

      as per your requirements.'
    severity: medium
- id: 5.7.2
  title: Ensure that the seccomp profile is set to docker/default in your pod definitions
  scoring: manual
  profile:
  - Level 2
  description: Enable default seccomp profile in your pod definitions.
  rationale: Seccomp (secure computing mode) is used to restrict the set of system calls applications can make, allowing cluster
    administrators greater control over the security of workloads running in the cluster. Kubernetes disables seccomp profiles
    by default for historical reasons. You should enable it to ensure that the workloads have restricted actions available
    within the container.
  impact: If the default seccomp profile is too restrictive for you, you will need to create and manage your own seccomp profiles.
  references:
  - 1. https://docs.openshift.com/container-platform/4.2/authentication/managingsecurity-context-constraints.html#security-context-constraints-about_configuringinternal-oauth
  - 2. https://github.com/kubernetes/kubernetes/issues/39845
  page_start: 307
  audit_raw: 'In OpenShift 4, CRI-O is the supported runtime. CRI-O runs unconfined by default in

    order to meet CRI conformance criteria.

    On RHEL CoreOS, the default seccomp policy is associated with CRI-O and stored in

    /etc/crio/seccomp.json. The default profile is applied when the user asks for the

    runtime/default profile via annotation to the pod and when the associated SCC allows

    use of the specified seccomp profile.

    Configuration of allowable seccomp profiles is managed through OpenShift Security

    Context Constraints.'
  remediation: 'To enable the default seccomp profile, use the reserved value /runtime/default that

    will make sure that the pod uses the default policy available on the host.'
  checks:
  - type: manual_review
    info: 'In OpenShift 4, CRI-O is the supported runtime. CRI-O runs unconfined by default in

      order to meet CRI conformance criteria.

      On RHEL CoreOS, the default seccomp policy is associated with CRI-O and stored in

      /etc/crio/seccomp.json. The default profile is applied when the user asks for the

      runtime/default profile via annotation to the pod and when the associated SCC allows

      use of the specified seccomp profile.

      Configuration of allowable seccomp profiles is managed through OpenShift Security

      Context'
    severity: medium
- id: 5.7.3
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 2
  description: Apply Security Context to Your Pods and Containers
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing your containers and pods, make sure that you configure the security context for
    your pods, containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security
    parameters that will be assigned to the pod/container/volume. There are two levels of security context: pod level security
    context, and container level security context.'
  impact: If you incorrectly apply security contexts, you may have trouble running the pods.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/security-context/
  - 2. https://learn.cisecurity.org/benchmarks
  page_start: 309
  audit_raw: 'Review the pod definitions in your cluster and verify that you have security contexts

    defined as appropriate.

    OpenShift''s Security Context Constraint feature is on by default in OpenShift 4 and

    applied to all pods deployed. SCC selection is determined by a combination of the

    values in the securityContext and the rolebindings for the account deploying the pod.'
  remediation: 'Follow the Kubernetes documentation and apply security contexts to your pods. For a

    suggested list of security contexts, you may refer to the CIS Security Benchmark for

    Docker Containers.'
  checks:
  - type: manual_review
    info: 'Review the pod definitions in your cluster and verify that you have security contexts

      defined as appropriate.

      OpenShift''s Security Context Constraint feature is on by default in OpenShift 4 and

      applied to all pods deployed. SCC selection is determined by a combination of the

      values in the securityContext and the rolebindings for the account deploying the pod.'
    severity: medium
- id: 5.7.4
  title: The default namespace should not be used
  scoring: manual
  profile:
  - Level 2
  description: Kubernetes provides a default namespace, where objects are placed if no namespace is specified for them. Placing
    objects in this namespace makes application of RBAC and other controls more difficult.
  rationale: Resources in a Kubernetes cluster should be segregated by namespace, to allow for security controls to be applied
    at that level and to make it easier to manage resources.
  impact: None
  references: []
  page_start: 311
  audit_raw: 'In OpenShift, projects (namespaces) are used to group and isolate related objects.

    When a request is made to create a new project using the web console or oc newproject command, an endpoint in OpenShift
    Container Platform is used to provision the

    project according to a template, which can be customized.

    The cluster administrator can allow and configure how developers and service accounts

    can create, or self-provision, their own projects. Regular users do not have access to

    the default project.

    Projects starting with openshift- and kube- host cluster components that run as Pods

    and other infrastructure components. As such, OpenShift does not allow you to create

    Projects starting with openshift- or kube- using the oc new-project command.

    For more information, see

    Working with projects and

    Configuring project creation

    Run this command to list objects in default namespace

    oc project default

    oc get all

    The only entries there should be system managed resources such as the kubernetes

    and openshift service'
  remediation: 'Ensure that namespaces are created to allow for appropriate segregation of Kubernetes

    resources and that all new resources are created in a specific namespace.'
  checks:
  - type: manual_review
    info: 'In OpenShift, projects (namespaces) are used to group and isolate related objects.

      When a request is made to create a new project using the web console or oc newproject command, an endpoint in OpenShift
      Container Platform is used to provision the

      project according to a template, which can be customized.

      The cluster administrator can allow and configure how developers and service accounts

