- id: 1.2.12
  title: Ensure that the admission control plugin AlwaysPullImages is not set
  scoring: manual
  profile:
  - Level 1
  description: Always pull images.
  rationale: 'Setting admission control policy to AlwaysPullImages forces every new pod to pull the required images every
    time. In a multi-tenant cluster users can be assured that their private images can only be used by those who have the
    credentials to pull them. Without this admission control policy, once an image has been pulled to a node, any pod from
    any user can use it simply by knowing the image’s name, without any authorization check against the image ownership. When
    this plug-in is enabled, images are always pulled prior to starting containers, which means valid credentials are required.
    However, turning on this admission plugin can introduce new kinds of cluster failure modes. OpenShift 4 master and infrastructure
    components are deployed as pods. Enabling this feature can result in cases where loss of contact to an image registry
    can cause a redeployed infrastructure pod (oauth-server for example) to fail on an image pull for an image that is currently
    present on the node. We use PullIfNotPresent so that a loss of image registry access does not prevent the pod from starting.
    If it becomes PullAlways, then an image registry access outage can cause key infrastructure components to fail. This can
    be managed per container. When OpenShift Container Platform creates containers, it uses the container’s imagePullPolicy
    to determine if the image should be pulled prior to starting the container. There are three possible values for imagePullPolicy:
    Always, IfNotPresent, Never. If a container’s imagePullPolicy parameter is not specified, OpenShift Container Platform
    sets it based on the image’s tag. If the tag is latest, OpenShift Container Platform defaults imagePullPolicy to Always.
    Otherwise, OpenShift Container Platform defaults imagePullPolicy to IfNotPresent.'
  impact: Credentials would be required to pull the private images every time. Also, in trusted environments, this might increase
    load on network, registry, and decreases speed. This setting could impact offline or isolated clusters, which have images
    pre-loaded and do not have access to a registry to pull in-use images. This setting is not appropriate for clusters which
    use this configuration.
  references:
  - 1. https://docs.openshift.com/containerplatform/4.5/openshift_images/managing_images/image-pull-policy.html
  - 2. https://docs.openshift.com/container-platform/4.5/architecture/admission-plugins.html
