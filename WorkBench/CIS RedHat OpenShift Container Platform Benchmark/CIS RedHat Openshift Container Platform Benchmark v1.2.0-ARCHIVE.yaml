    oc get machineconfig 01-worker-kubelet -o yaml | grep hostname-override

    oc get machineconfig 01-master-kubelet -o yaml | grep hostname-override

    Verify that --hostname-override argument does not exist.

    OpenShift uses the kubeAPIQPS argument and sets it to a default value of 50. When this

    value is set to > 0, event creations per second are limited to the value set. If this value is

    set to 0, event creations per second are unlimited.

    Run the following command on each machine pool. For example:

    for node in $(oc get nodes -o jsonpath=''{.items[*].metadata.name}''); do oc

    debug node/${node} -- chroot /host more /etc/kubernetes/kubelet.conf; done

    oc get machineconfig 01-worker-kubelet -o yaml | grep --color

    kubeAPIQPS%3A%2050

    oc get machineconfig 01-master-kubelet -o yaml | grep --color

    kubeAPIQPS%3A%2050

    Review the value set for the kubeAPIQPS argument and determine whether this has been

    set to an appropriate level for the cluster. If this value is set to 0, event creations per

    second are unlimited.'
  remediation: 'None required.

    Follow the documentation to edit kubelet parameters

    https://docs.openshift.com/containerplatform/4.5/scalability_and_performance/recommended-host-practices.html#create-akubeletconfig-crd-to-edit-kubelet-parameters

    KubeAPIQPS: <QPS>'
  checks:
