- id: 5.3.1
  title: Ensure that the CNI in use supports Network Policies
  scoring: manual
  profile:
  - Level 1
  description: There are a variety of CNI plugins available for Kubernetes. If the CNI in use does not support Network Policies
    it may not be possible to effectively restrict traffic in the cluster.
  rationale: Kubernetes network policies are enforced by the CNI plugin in use. As such it is important to ensure that the
    CNI plugin supports both Ingress and Egress network policies.
  impact: None
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/networking/openshiftsdn/about-openshift-sdn.html
  - 2. https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storagenet/network-plugins/
  page_start: 292
  audit_raw: 'Review the documentation of CNI plugin in use by the cluster, and confirm that it

    supports Ingress and Egress network policies.

    OpenShift Container Platform uses a software-defined networking (SDN) approach to

    provide a unified cluster network that enables communication between Pods across the

    OpenShift Container Platform cluster. This Pod network is established and maintained

    by the OpenShift SDN, which configures an overlay network using Open vSwitch (OVS).

    The OpenShift SDN uses Network Policies. The OpenShift SDN CNI plug-in provides all

    Kubernetes v1 NetworkPolicy features except for egress policy types and IPBlock.

    However, OpenShift provides means to implement fine grained filtering of egress traffic.

    OpenShift provides several options for controlling the traffic leaving the cluster. These

    options are :

    • Egress firewall

    • Egress routers

    • Egress static IP'
  remediation: None required.
  checks:
  - type: manual_review
    info: 'Review the documentation of CNI plugin in use by the cluster, and confirm that it

      supports Ingress and Egress network policies.

      OpenShift Container Platform uses a software-defined networking (SDN) approach to

      provide a unified cluster network that enables communication between Pods across the

      OpenShift Container Platform cluster. This Pod network is established and maintained

      by the OpenShift SDN, which configures an overlay network using Open vSwitch (OVS).

      The OpenShift SDN uses Network Polic'
    severity: medium
- id: 5.3.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: manual
  profile:
  - Level 2
  description: Use network policies to isolate traffic in your cluster network.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. Once there is any Network Policy in a namespace selecting a particular pod, that pod
    will reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected
    by any Network Policy will continue to accept all traffic
  impact: Once there is any Network Policy in a namespace selecting a particular pod, that pod will reject any connections
    that are not allowed by any Network Policy. Other pods in the namespace that are not selected by any Network Policy will
    continue to accept all traffic"
  references:
  - 1. https://docs.openshift.com/containerplatform/4.5/networking/network_policy/about-network-policy.html
  - 2. https://docs.openshift.com/containerplatform/4.5/networking/network_policy/creating-network-policy.html
  page_start: 294
  audit_raw: 'The OpenShift 4 CNI plugin uses network policies and by default all Pods in a project

    are accessible from other Pods and network endpoints. To isolate one or more Pods in

    a project, you create NetworkPolicy objects in that project to indicate the allowed

    incoming connections. Project administrators can create and delete NetworkPolicy

    objects within their own project. For more information see:

    Run the following command and review the NetworkPolicy objects created in the

    cluster.

    oc -n all get networkpolicy

    Ensure that each namespace defined in the cluster has at least one Network Policy.'
  remediation: Follow the documentation and create NetworkPolicy objects as you need them.
  checks:
  - type: manual_review
    info: 'The OpenShift 4 CNI plugin uses network policies and by default all Pods in a project

