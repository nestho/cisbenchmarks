- id: 4.2.8
  title: Ensure that the --hostname-override argument is not set
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Do not override node hostnames. Security relevant information should be captured. The --event-qps flag on the
    Kubelet can be used to limit the rate at which events are gathered. Setting this too low could result in relevant events
    not being logged, however the unlimited setting of 0 could result in a denial of service on the kubelet.
  rationale: Overriding hostnames could potentially break TLS setup between the kubelet and the apiserver. Additionally, with
    overridden hostnames, it becomes increasingly difficult to associate logs with a particular node and process them for
    security analytics. Hence, you should setup your kubelet nodes with resolvable FQDNs and avoid overriding the hostnames
    with IPs. It is important to capture all events and not restrict event creation. Events are an important source of security
    information and analytics that ensure that your environment is consistently monitored using the event data.
  impact: Some cloud providers may require this flag to ensure that hostname matches names issued by the cloud provider. In
    these environments, this recommendation should not apply. Setting this parameter to 0 could result in a denial of service
    condition due to excessive events being created. The cluster's event processing and storage systems should be scaled to
    handle expected event loads.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
  - 2. https://github.com/openshift/machine-config-operator/blob/release4.5/templates/master/01-master-kubelet/_base/files/kubelet.yaml
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/controlplane.html#understanding-machine-config-operator_control-plane
  - 2. https://docs.openshift.com/containerplatform/4.5/scalability_and_performance/recommended-hostpractices.html#create-a-kubeletconfig-crd-to-edit-kubelet-parameters_
  page_start: 242
  audit_raw: 'In OpenShift 4, the --hostname-override argument is not used.

