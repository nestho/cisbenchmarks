- id: 1.2.1
  title: Ensure that anonymous requests are authorized
  scoring: manual
  profile:
  - Level 1
  description: When anonymous requests to the API server are allowed, they must be authorized.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the API server. You should rely on authentication to authorize anonymous requests.
    If you are using RBAC authorization, it is generally considered reasonable to allow anonymous access to the API Server
    for health checks and discovery purposes, and hence this recommendation is not scored. However, you should consider whether
    anonymous discovery is an acceptable risk for your purposes.
  impact: Anonymous requests are assigned to the system:unauthenticated group which allows the system to determine which actions
    are allowed.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/authentication/understandingauthentication.html
  - 2. https://docs.openshift.com/container-platform/4.5/authentication/using-rbac.html
  page_start: 60
  audit_raw: "OpenShift allows anonymous requests (then authorizes them). OpenShift allows\nanonymous requests to the API\
    \ server to support information discovery and webhook\nintegrations. OpenShift provides its own fully integrated authentication\
    \ and authorization\nmechanism. If no access token or certificate is presented, the authentication layer\nassigns the\
    \ system:anonymous virtual user and the system:unauthenticated virtual\ngroup to the request. This allows the authorization\
    \ layer to determine which requests, if\nany, an anonymous user is allowed to make.\n# To verify that userGroups include\
    \ system:unauthenticated\noc get configmap config -n openshift-kube-apiserver -ojson | \\\n jq -r '.data[\"config.yaml\"\
    ]' | \\\n jq '.auditConfig.policyConfiguration.rules[]'\n# To verify that userGroups include system:unauthenticated\n\
    oc get configmap config -n openshift-apiserver -ojson | \\\n jq -r '.data[\"config.yaml\"]' | \\\n jq '.auditConfig.policyConfiguration.rules[]'\n\
    # To verify RBAC is enabled\noc get clusterrolebinding\noc get clusterrole\noc get rolebinding\noc get role\nVerify that\
    \ the userGroups include system:unauthenticated.\nVerify that role bindings and roles are returned."
  remediation: None required. The default configuration should not be modified.
  checks:
  - type: manual_review
