- id: 1.2.10
  title: Ensure that the APIPriorityAndFairness feature gate is enabled
  scoring: manual
  profile:
  - Level 1
  description: Limit the rate at which the API server accepts requests.
  rationale: 'Using EventRateLimit admission control enforces a limit on the number of events that the API Server will accept
    in a given time slice. A misbehaving workload could overwhelm and DoS the API Server, making it unavailable. This particularly
    applies to a multi-tenant cluster, where there might be a small percentage of misbehaving tenants which could have a significant
    impact on the performance of the cluster overall. Hence, it is recommended to limit the rate of events that the API server
    will accept. Note: This is an Alpha feature in the Kubernetes 1.15 release.'
  impact: None, as the OpenShift kubelet has been fixed to send fewer requests.
  references:
  - 1. https://docs.openshift.com/container-platform/4.5/architecture/admission-plugins.html
  - 2. https://docs.openshift.com/container-platform/4.5/operators/operatorreference.html#kube-apiserver-operator_red-hat-operators
  page_start: 81
  audit_raw: 'EventRateLimit admission plugin cannot be enabled in Openshift. It was developed to

    alleviate the potential issue of flooding the API server with requests. However, the

    kubelet has since been fixed to send fewer events. OpenShift 4.5 and forward uses the

    api priority and fairness feature to limit the rate at which the API server accepts

    requests.

    Run the following command:

    #Verify the APIPriorityAndFairness feature-gate

    oc get kubeapiservers.operator.openshift.io cluster -o json | jq

    ''.spec.observedConfig.apiServerArguments''

    #Verify the set of admission-plugins for OCP 4.6 and higher

    oc -n openshift-kube-apiserver get configmap config -o json | jq -r

    ''.data."config.yaml"'' | jq ''.apiServerArguments."enable-admission-plugins"''

    #Check that no overrides are configured

    oc get kubeapiservers.operator.openshift.io cluster -o json | jq -r

    ''.spec.unsupportedConfigOverrides''

    For 4.5, verify that the feature-gate is turned on for the APIServer priority and fairness:

    APIPriorityAndFairness=true. In OCP 4.5 and earlier, the default set of admission

    plugins are compiled into the apiserver and are not visible in the configuration yaml.

