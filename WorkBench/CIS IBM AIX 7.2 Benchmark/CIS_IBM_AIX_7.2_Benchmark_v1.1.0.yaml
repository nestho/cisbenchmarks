  description: 'This variable limits the types of MAC algorithms that SSH can use during communication. Notes: • Some organizations
    may have stricter requirements for approved MACs • Ensure that MACs used are in compliance with site policy • The only
    "strong" MACs currently FIPS 140-2 approved are: o hmac-sha2-256 o hmac-sha2-512 • The Supported MACs are: hmac-md5 hmac-md5-96
    hmac-sha1 hmac-sha1-96 hmac-sha2-256 hmac-sha2-512 umac-64@openssh.com umac-128@openssh.com hmac-md5-etm@openssh.com hmac-md5-96-etm@openssh.com
