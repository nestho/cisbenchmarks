    \ -d\nIf the command has output there is at least one duplicate GID number. Determine any\nduplicates within the /etc/group\
    \ file:\ncut -d: -f 1 /etc/group | sort -n | uniq -d | while read GID; do\n cut -f \"1 3 4\" -d : /etc/group | /usr/bin/sort\
    \ -t: -k2n | grep \":${GID}:\"\ndone\n• Examine the names of all locally configured groups:\ncut -d: -f 1 /etc/group |sort\
