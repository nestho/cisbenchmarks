    severity: medium
- id: '8.2'
  title: AIX Auditing
  scoring: manual
  profile:
  - Level 2
  description: This recommendation configures AIX auditing in bin mode.
  rationale: AIX auditing provides a framework within which to capture pertinent system and security related information,
    such as failed login attempts, cron usage etc. It is recommended that auditing is enabled as part of a group of measures
    designed to provide enhanced logging of system and security changes. Further information regarding the setup and management
    of AIX accounting and auditing can be found in the redbook Accounting and Auditing for AIX 5L
  impact: ''
