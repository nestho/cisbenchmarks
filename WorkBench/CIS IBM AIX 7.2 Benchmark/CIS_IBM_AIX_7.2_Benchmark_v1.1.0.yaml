- id: 4.5.3.7
  title: 'sshd_config: HostbasedAuthentication is ''no'''
  scoring: scored
  profile:
  - Level 1
  description: The recommendation is to ensure the sshd daemon is configured to prevent host-based authentication.
  rationale: Host-based authentication is a method to authenticate users (rather than requiring password or key-based authentication
    method). Used at a system level by OpenSSH requires the file /etc/shosts.equiv to contain a list of so-called trusted
    hosts. When this method is active any user on a trusted host can login to the server as authenticated because the server
    identity the user imitates the connection from (aka the OpenSSH client) authentificatees the user as trusted. Since this
    feature disables user-based authentication from some hosts - our recommendation is to disable host-based authentication.
  impact: ''
  references: []
  page_start: 263
  audit_raw: 'Ensure that the HostbasedAuthentication parameter has been changed:

    grep "^HostbasedAuthentication[[:blank:]]" /etc/ssh/sshd_config

