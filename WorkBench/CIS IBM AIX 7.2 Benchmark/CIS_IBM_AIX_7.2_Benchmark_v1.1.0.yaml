- id: 4.5.3.16
  title: 'sshd_config, ssh_config: Ciphers'
  scoring: scored
  profile:
  - Level 1
  description: 'This variable limits the ciphers that SSH can use during communication. Notes: • Some organizations may have
    stricter requirements for approved ciphers • Ensure that ciphers used are in compliance with site policy • The only "strong"
    ciphers currently FIPS 140-2 compliant are: - aes256-ctr - aes192-ctr - aes128-ctr • Supported ciphers in OpenSSH 8.2:
    3des-cbc aes128-cbc aes192-cbc aes256-cbc aes128-ctr aes192-ctr aes256-ctr aes128-gcm@openssh.com aes256-gcm@openssh.com
    chacha20-poly1305@openssh.com'
  rationale: Weak ciphers that are used for authentication to the cryptographic module cannot be relied upon to provide confidentiality
    or integrity, and system data may be compromised Research conducted at various institutions determined that the symmetric
    portion of the SSH Transport Protocol (as described in RFC 4253) has security weaknesses that allowed recovery of up to
    32 bits of plaintext from a block of ciphertext that was encrypted with the Cipher Block Chaining (CBD) method. From that
    research, new Counter mode algorithms (as described in RFC4344) were designed that are not vulnerable to these types of
    attacks and these algorithms are now recommended for standard use. • The Triple DES ciphers, as used in SSH, have a birthday
    bound of approximately four billion blocks, which makes it easier for remote attackers to obtain cleartext data via a
    birthday attack against a long-duration encrypted session, aka a "Sweet32" attack • Error handling in the SSH protocol;
    Client and Server, when using a block cipher algorithm in Cipher Block Chaining (CBC) mode, makes it easier for remote
    attackers to recover certain plaintext data from an arbitrary block of ciphertext in an SSH session via unknown vectors
  impact: ''
  references: []
  page_start: 284
