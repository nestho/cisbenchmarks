- id: 4.1.3.2
  title: ndpd-host
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: This entry starts ndpd-host on system startup. This is the Neighbor Discovery Protocol (NDP) daemon. The ndpd-host
    command handles the default route, which includes the default router, the default interface, and the default interface
    address. However, the ndpd-host command does not overwrite the static default routes that are set on the host. When the
    daemon is stopped, the daemon cleans up the prefix addresses and the routes that are created during its lifetime.
  rationale: The ndpd-host performs the client function of the NDP protocol. • Unless the server utilizes (dynamic) IPv6 this
    utility is not required and should be disabled. • Ipv6 static configuration is not affected by ndpd-host.
  impact: 'When IPv6 is active and NDP is used to get a non-link-local IPv6 address (link-local addresses begin with fe80::)
