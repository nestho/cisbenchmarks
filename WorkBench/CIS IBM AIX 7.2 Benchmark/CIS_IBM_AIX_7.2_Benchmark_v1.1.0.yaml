- id: 5.3.1
  title: adm
  scoring: scored
  profile:
  - Level 1
  description: This change locks and disables login access for the adm user account.
  rationale: This change disables direct local and remote login to the adm user account. Do not set a password on this account
    to ensure that the only access is via su from the root account. There should not be a requirement to log in as the adm
    user directly. All users should be given unique logon ids to ensure traceability and accountability.
  impact: ''
  references: []
  page_start: 436
  audit_raw: 'Ensure remote access has been disabled for the adm user:

    lsuser -a account_locked login rlogin adm

    The above command should yield the following output:

    adm account_locked=true login=false rlogin=false'
  remediation: 'Change the following user attributes to adm user:

    chuser account_locked=true login=false rlogin=false adm'
  checks:
  - type: manual_review
    info: 'Ensure remote access has been disabled for the adm user:

      lsuser -a account_locked login rlogin adm

      The above command should yield the following output:

      adm account_locked=true login=false rlogin=false'
    severity: medium
