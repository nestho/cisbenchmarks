- id: 4.7.1.3
  title: 'Home directory: write access restricted to ''owner'''
  scoring: scored
  profile:
  - Level 1
  description: Home directories must be writeable only by the owner. This recommendation audits (or removes) any write permission
    given via traditional file mode permissions (using chmod). Neither should a home directory have any permissions managed
    (whether permit or deny) via ACL's.
  rationale: HOME directories with group or world write access enable malicious users to add files or directories, or even
    remove them if the directory 'T' (SVTX) bit is not also set. While this does not necessarily allow access to data - existing
    data might be destroyed (unlink()) or replaced (new file added with same name). These modifications could be used, e.g.,
    to use the users authorizations to gain other system privileges. Disabling read and execute access for world and/or group
    might be part of a company security policy - and the audit and remediation scripts will need to be modified to reflect
    this addition. The use of ACL's is discouraged because their effect is not immediately visible using standard tools. They
    must be identified (locating inodes with permission bit 0200000000 set) as active and read using aclget before the actual
    permissions granted or denied are known. Better is to deny outside access to home (ie, user) related data. When data must
    be shared create an area outside of ${HOME}.
  impact: There should be no impact - at least as far a world permissions are concerned. There is a potential that all members
    in the group staff or system might see minimal impact - if their systems have, or had, a default umask of 002 when their
    accounts were created. Accounts created with a default umask of 022 or stricter will not be impacted, unless a user account
    modified their HOME directory mode bits to permit group and/or other write access.
  references: []
  page_start: 330
  audit_raw: "Validate the permissions of all of the directories changed:\n#!/usr/bin/ksh -e\nlsuser -R files -a id home ALL\
    \ | while read name ids homes rest;\ndo\n uid_check=$(echo ${ids} | cut -f2 -d =)\n if [[ ${uid_check} -ge 200 ]]; then\n\
    \ home=$(echo ${homes} | cut -f2 -d =)\n if [[ ${home} == \"/dev/null\" ]]; then\n continue\n elif [[ ! -d ${home} ]];\
    \ then\n /usr/bin/printf \"%-32s does not exist; recommend to lock account\nnamed [%s]\\n\" ${home} ${name}\n else [[\
    \ ${home} != \"/\" && ${home} != \"/dev/null\" ]]\n /usr/bin/perl -e '$f=$ARGV[0]; $m=(stat $f)[2]; \\\n printf(\"Recommend\
    \ chmod on: %s: to remove group or world write\nmode\\n\", $f) if $m & 022; \\\n printf(\"Recommend remove ACL on: %s\\\
    n \", $f) if $m & 0200000000; \\\n exit($m & 0200000022)' ${home} \\\n || (ls -led ${home} && (aclget ${home} | grep -ip\
    \ Enabled))\n fi\n fi\ndone\n• There should not be any output\n• NOTE: The audit is performed only on accounts with a\
    \ user ID (uid) greater or\nequal to 200. Also, if the HOME directory has already been defined to something\nspecial (here,\
    \ /dev/null) no audit is performed."
  remediation: "For all local accounts with UID >= 200:\n• Remove write permission from home directories that have group or\
    \ world write\naccess:\n#!/usr/bin/ksh -e\n# home_mode_acl: 4.8.1.3\n# Provided to CIS by AIXTools\n# Copyright AIXTools,\
    \ 2022\ntypeset -i UIDCK=$1\ntypeset -i ret=0\nif test $UIDCK == 0; then\n UIDCK=200\nfi\nlsuser -R files -a id home account_locked\
    \ ALL | while read name ids homes\nlocks rest;\ndo\n uid_check=$(echo ${ids} | cut -f2 -d =)\n if [[ ${uid_check} -ge\
    \ ${UIDCK} ]]; then\n home=$(echo ${homes} | cut -f2 -d =)\n locked=$(echo ${locks} | cut -f2 -d =)\n if [[ ${home} ==\
    \ \"/dev/null\" || ${locked} == \"true\" ]]; then\n continue\n elif [[ ! -d ${home} ]]; then\n /usr/bin/printf \"%-32s\
    \ does not exist; locking account named [%s]\\n\"\n${home} ${name}\n chuser -R files account_locked=true $name\n else\
    \ [[ ${home} != \"/\" && ${home} != \"/dev/null\" ]]\n perl -e '$f=$ARGV[0]; $m=(stat $f)[2];\\\n exit (($m & 022) + 1)\
    \ if ($m & 0200000000);\\\n exit($m & 022);' $home\n # exit($m&022 +1) if ($m & 0200000000) else exit ($m &022); ' $home\n\
    \ ret=$?\n [[ $ret == 0 ]] && continue\n if (( $ret & 022 )); then\n printf \"%s: had group or world write mode\\n\" $home\n\
    \ chmod og-w ${home}\n fi\n if (($ret & 1)); then\n printf \"%s: had ACL defined and enabled\\n\" $home\n rm -rf /tmp/$$/${home}\n\
    \ mkdir -p /tmp/$$/${home}\n aclget /tmp/$$/${home} | aclput ${home}\n rm -rf /tmp/$$/${home}\n fi\n fi\n fi\ndone\n•\
    \ NOTE: The permission change is automatically applied to all accounts with a\nuser ID (uid) greater or equal to 200.\
    \ Also, if the HOME directory has already\nbeen defined to something special (here, /dev/null) no change is made to the\n\
    account attributes.\n• To automate the process for new users see Additional Information below."
  checks:
  - type: command
    command: '|| (ls -led ${home} && (aclget ${home} | grep -ip Enabled))'
    expected: ''
