- id: 4.8.1
  title: TE - implementation
  scoring: scored
  profile:
  - Level 2
  description: The recommendation is to implement TE to protect the system from Trojan horse style attacks. TE provides a
    robust system integrity checking process.
  rationale: One of the common ways a hacker infiltrates a system is through file tampering or the use of a Trojan horse.
    The implementation of TE can provide a number of integrity checks prior to loading a program into memory, any deviations
    can also be highlighted when programs and files are validated offline. This ensures that the programs executed are those
    which are intended to be and not malicious code masquerading as a true program. When a discrepancy is identified it is
    classified as either minor or major. A minor discrepancy is automatically reset to the value defined in the TSD. In the
    event of a major discrepancy the file access permissions are changed to make the file inaccessible. There is a pre-requisite
    requirement to install CLiC and SSL software.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/aix/7.1?topic=configuration-trusted-execution
  page_start: 378
  audit_raw: 'Ensure that TE is enabled:

    trustchk -p TE

    The above command should yield the following output:

    TE=ON

    Ensure that TEP is enabled:

    trustchk -p TEP

    The above command should yield the following output:

    TEP=ON'
  remediation: 'It is recommended that TE is configured in online mode. This provides real time

    protection against Trojan horse attacks.

    The tsd.dat file contains the important security attributes relating to all of the managed

    files:

    cat /etc/security/tsd/tsd.dat

    NOTE: The trustchk command is used to manage the entries in this file.

    To enable TE, firstly enable online checking of executables and shell scripts:

    trustchk -p CHKEXEC=ON

    trustchk -p CHKSCRIPT=ON

    Stop the execution or loading of binaries and files into memory when the integrity

    checks fail:

    trustchk -p STOP_ON_CHKFAIL=ON

    Enable online TE based on the policy selections above:

    trustchk -p TE=ON

    To set a Trusted Execution Path or TEP:

    trustchk -p TEP=<PATH variable>

    Enable the TEP:

    trustchk -p TEP=ON

    NOTE: Commands will not be executed if they reside outside of the TEP.

    Further details regarding planning and implementation of TE can be found within the

    IBM AIX 7.1 Infocentre:

    https://www.ibm.com/docs/en/aix/7.1?topic=configuration-trusted-execution

    NOTE: The configuration of TE is dependant on the unique requirements of a given

    environment.'
  checks:
  - type: manual_review
    info: 'Ensure that TE is enabled:

      trustchk -p TE

      The above command should yield the following output:

      TE=ON

      Ensure that TEP is enabled:

      trustchk -p TEP

      The above command should yield the following output:

      TEP=ON'
    severity: medium
- id: '4.9'
  title: Ensure root access is controlled
  scoring: scored
  profile:
  - Level 1
  description: Restricts access to root via su to members of a specific group. Direct login via console and/or remote login
    via telnet is blocked.
  rationale: • For accountability, no direct access to root is allowed. • The attributes here control access to root for programs
    other than OpenSSH. • Setting the sugroups attribute to SUADMIN ensures that only members of the this group are able to
    su root. This makes it more difficult for an attacker to use a stolen root password as the attacker first has to get access
    to a system user ID. • Access via a console (e.g., /dev/vty0 or /dev/tty0) is only permitted when there are external controls
    managing accountability of access to the console. For example, HMC access must not be via the account hscroot; a physical
    console is accessible only after a hard-copy log has been entered and verified before physical access is granted to the
    (data center) console terminal. • The group system is not recommended as it is not uncommon for other accounts to be included
    in this OS-provided group (gid==0).
  impact: • In this recommendation we specify the group SAADMIN. This is same group name applied during installation of the
    security profile known as BAS - Base AIX Security. • When scoring - the attribute login may be true as long as access
    to the HMC is not via the account name hscroot. • In any case, sugroups should not equal ALL.
  references: []
  page_start: 381
  audit_raw: '• From the command prompt, execute the following commands:

    #!/usr/bin/ksh -e

    lsuser -a login rlogin su sugroups root | tr ''='' '' '' | read user a1 login a2

    rlogin a3 su a4 sugroups

    [[ ${su} != "false" && ${sugroups} == "ALL" ]] && print $0 failed :

    ${a3}==${su}, ${a4}==${sugroups}

    [[ ${login} == "true" || ${rlogin} == "true" ]] && print $0 failed :

    ${a1}==${login}, ${a2}==${rlogin}

    - The command should **NOT** output:'
  remediation: 'In /etc/security/user, set the root stanza sugroups attribute to SUADMIN and ensure the

    login and rlogin attributes are set to false:

    lsgroup SUADMIN >/dev/null || mkgroup -a SUADMIN

    chuser login=false rlogin=false sugroups=SUADMIN

    •

    NOTE: For the remediation the setting of su is irrelevant.'
  checks:
  - type: manual_review
    info: '• From the command prompt, execute the following commands:

      #!/usr/bin/ksh -e

      lsuser -a login rlogin su sugroups root | tr ''='' '' '' | read user a1 login a2

      rlogin a3 su a4 sugroups

      [[ ${su} != "false" && ${sugroups} == "ALL" ]] && print $0 failed :

      ${a3}==${su}, ${a4}==${sugroups}

      [[ ${login} == "true" || ${rlogin} == "true" ]] && print $0 failed :

      ${a1}==${login}, ${a2}==${rlogin}

      - The command should **NOT** output:'
    severity: medium
