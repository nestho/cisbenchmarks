    command: '/usr/bin/egrep -p "password = +$" /etc/security/passwd | grep ":" | awk -F:'
    expected: ''
    severity: medium
    info: "Run the command:\n/usr/bin/egrep -p \"password = +$\" /etc/security/passwd | grep \":\" | awk -F:\n'{ print $1\
