    umac-128-etm@openssh.com'
  rationale: Clients that expect the weak MACs will often use/expect weak encryption keys as well. Like CipherKeys the sshd
    MACs need to be configured to exclude weak message authentication codes. MD5 and 96-bit MAC algorithms are considered
    weak and have been shown to increase exploit-ability in SSH downgrade attacks. Weak algorithms continue to have a great
    deal of attention as a weak spot that can be exploited with expanded computing power. An attacker that breaks the algorithm
    could take advantage of a MiTM (man in the middle) position to decrypt the SSH tunnel and capture credentials and information
  impact: Weak clients will not connect and/or lose the ability to connect.
