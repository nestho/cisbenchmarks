- id: 4.1.2.11
  title: portmap
  scoring: manual
  profile:
  - Level 1
  description: 'If all RPC services are disabled, disable the portmap daemon itself. The portmap daemon is required for the
    RPC service. It converts the RPC program numbers into Internet port numbers. The daemon may be disabled if the server
    is not: 1. An NFS server 2. A NIS (YP) or NIS+ server 3. Running the CDE GUI 4. Running a third-party software application
    that relies on RPC support'
  rationale: If no RPC services are required then there is no need to start the portmap daemon at boot time. A start of portmap
    can be done either manually, or scripted, should RPC port-mapping support be needed post-IPL.
  impact: ''
  references: []
  page_start: 112
  audit_raw: "• Ensure that portmap services are not required.\n• The command below provides information the status of portmap\
    \ service.\n• Ideally, there is no output - scored as +1.\n• When there is output and it indicates an error, the score\
    \ is -1, otherwise 0.\n#!/usr/bin/ksh -e\n# Author: Michael Felt, AIXTools\n# Version: 1.01\naction=$1\nret=0\nset $(rpcinfo\
    \ -p localhost 2>/dev/null | /usr/bin/egrep -v\n\"(portmap)|(status)|(nsm)|(pyramid)\" | wc -l)\nif [ $1 -gt 1 ] ; then\n\
    \ # There are RPC services other than portmap related services\n # Unless specifically required for a business process\
    \ this is considered a\nrisk.\n # If there are RPC services active - will not disable portmap service\n if [[ $# -eq 0\
    \ || ${action} != \"fix\" ]]; then\n print \"$0: Audit mode: Verify the services listed are actually needed.\"\n print\
    \ \"This should be scored as an error unless there is a documented\nneed\"\n print \"for the following RPC based services.\"\
    \n else\n print \"$0: FIX mode: cannot fix portmap service activation\"\n print \"\\tbefore the RPC services are deactivated.\"\
    \n ret=-1\n fi\n print \"++++ The following services (excluding portmap itself) are active\n++++\"\n rpcinfo -p localhost\
    \ 2>/dev/null | /usr/bin/egrep -v\n\"(portmap)|(status)|(nsm)|(pyramid)\"\nelif [ $1 -le 1 ] ; then\n if [[ ${action}\
    \ != \"fix\" ]] ; then\n if [ $1 -eq 1 ] ; then\n print \"portmap is active. This should be considered an error.\"\n fi\n\
    \ # No RPC services were reported. Check is autostart is disabled.\n result=$(grep \"start[[:blank:]]/usr/sbin/portmap\"\
    \ /etc/rc.tcpip)\n if [[ $result == '[ -z \"$portmap_pid\" ] && start /usr/sbin/portmap\n\"${src_running}\"' ]] ; then\n\
    \ print \"portmap is set to autostart. This should be considered an\nerror.\"\n fi\n elif [[ $action == \"fix\" ]]; then\n\
    \ print \"Removing autostart of portmap.\"\n PID=$$\n umask 077\n cat /etc/rc.tcpip >/var/tmp/rctcpip.${PID}\n sed -e\
    \ \"s/^\\[ -z \\\"\\$portmap_pid\\\"/#&/\" </var/tmp/rctcpip.${PID}\n>/etc/rc.tcpip\n rm -f /var/tmp/rctcpip.${PID}\n\
    \ # Stop the portmapper, if active\n stopsrc -s portmap\n # Switch of automatic NFS services, if still in /etc/inittab\n\
    \ chitab \"rcnfs:23456789:off:/etc/rc.nfs > /dev/console 2>&1 # Start NFS\nDaemons\"\n fi\nfi"
  remediation: '• Review any active RPC services:

    rpcinfo -p localhost

    • Run the program above (in Audit) with the argument fix

    • check exit status (should be 0)'
