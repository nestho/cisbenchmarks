  scoring: scored
  profile:
  - Level 1
  description: The root user must have a dedicated home directory and not use / as their home directory.
  rationale: By default, the home directory for the root user on AIX is /. This means that all configuration files and directories
    it creates are visible to all users and may be accessible if the root user has a weak umask setting. Moving these files
    to a dedicated home directory and setting appropriate file permissions allows for appropriate use of discretionary access
    control to these files.
