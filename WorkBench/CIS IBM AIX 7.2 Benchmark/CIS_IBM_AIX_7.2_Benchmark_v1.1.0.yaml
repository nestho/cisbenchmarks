      \ expires=0101000070 ${user}\n done\n• The command should not yield output.\n• Note: this is a partial remediation -\
      \ setting the attribute account_locked - as it is\ntoo ser"
- id: 5.1.3
  title: All usernames and UIDs must be unique
  scoring: scored
  profile:
  - Level 1
  description: All users should have a unique UID. In particular the only user on the system to have a UID of 0 should be
    the root user. Likewise, usernames need to be verified as unique.
  rationale: The only user with a UID of 0 on the system must be the root account. Any account (username) with a UID of 0
    has super user privileges on the system and becomes root at login. Access to the root account should be via su, sudo or
    PKI fingerprint. Logging must include sufficient information such that each action taken with root authority can be accounted
    to a specific account. All accounts (or users) must have a unique UID to ensure that file and directory security is not
    compromised.
  impact: Identification is the basis of Access Control. What you can access is determined by who you are (uid), OR by a group
    you belong to (resource GID and your group list) OR access is permitted to all (i.e., your UID and group list) do not
    match the resoource UID and GID values.
  references: []
  page_start: 406
  audit_raw: 'Run the commands:

    cut -d: -f 3 /etc/passwd | sort -n | uniq -d

    cut -d: -f 1 /etc/passwd | sort | uniq -d

    The commands should not yield output'
  remediation: "• Examine the user IDs of all configured accounts:\ncut -d: -f 3 /etc/passwd | sort -n | uniq -d\nIf a number,\
    \ or numbers are returned from the command above, these are UID values\nwhich are not unique within the /etc/passwd file.\
    \ Determine the effected accounts/s:\ncut -d: -f 1 /etc/passwd | sort -n | uniq -d | while read UID; do\n cut -f \"1 3\"\
    \ -d : /etc/passwd |grep \":${UID}\"\ndone\n• Examine the usernames IDs of all configured accounts:\ncut -d: -f 1 /etc/passwd\
    \ | sort -n | uniq -d\nIf a username, or usernames are returned from the command above, these are\nusername values which\
    \ are not unique within the /etc/passwd file. Determine the\neffected accounts/s:\ncut -d: -f 1 /etc/passwd | sort -n\
    \ | uniq -d | while read username; do\n cut -f \"1 3\" -d : /etc/passwd |grep \"${username}:\"\ndone\nNOTE: Any account\
    \ names returned should either be deleted or have the UID changed\nTo remove:\nrmuser <username>\nTo change the UID:\n\
    chuser id=<id> <username>"
  checks:
  - type: manual_review
    info: 'Run the commands:

      cut -d: -f 3 /etc/passwd | sort -n | uniq -d

      cut -d: -f 1 /etc/passwd | sort | uniq -d

      The commands should not yield output'
    severity: medium
