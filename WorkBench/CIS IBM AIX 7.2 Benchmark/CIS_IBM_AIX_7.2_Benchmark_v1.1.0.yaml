- id: 5.1.5
  title: Establish and Maintain an Inventory of Administrator accounts
  scoring: manual
  profile:
  - Level 1
  description: AIX defines Administrator accounts with the with the attribute admin. When true the account is Administrator
    and when false the account is considered User.
  rationale: An inventory of accounts with the attribute "admin=true" allows verification that all accounts considered administrative
    are so labeled by the system.
  impact: The impact of 'admin=true' is two-fold. a) a label for identifying accounts considered related to system administration
    b) providing additional controls for account management. On AIX, an account with the attribute 'admin=true' requires a
    security role of Senior Security Admin to make modifications to the account attributes.
  references: []
  page_start: 411
  audit_raw: 'Verify that there is, off system, an inventory of Administrative accounts and that the date

    is not more 13 weeks old.'
  remediation: "A printable report can be prepared using the following example:\ncnt=0\nprintf \"%4s%68s\\n\" \"AIX\" \"Administator\
    \ Accounts\"\nlsuser -R files -a admin ALL | while read usr adm; do\nif [[ ${adm} = \"admin=true\" ]] ; then\n printf\
    \ \"%12s\" ${usr}\n let cnt=cnt+1\n [[ $(expr ${cnt} % 6) == 0 ]] && print\nfi\ndone\n[[ $(expr ${cnt} % 6) != 0 ]] &&\
    \ print"
  checks:
  - type: manual_review
    info: 'Verify that there is, off system, an inventory of Administrative accounts and that the date

      is not more 13 weeks old.'
    severity: medium
- id: 5.1.6
  title: Establish and Maintain an Inventory of User Accounts
  scoring: manual
  profile:
  - Level 1
  description: AIX defines Administrator accounts with the with the attribute admin. When true the account is Administrator
    and when false the account is considered User.
  rationale: An inventory of accounts with the attribute "admin=true" allows verification that all accounts considered administrative
    are so labeled by the system.
  impact: The impact of 'admin=true' is two-fold. a) a label for identifying accounts considered related to system administration
    b) providing additional controls for account management. On AIX, an account with the attribute 'admin=true' requires a
    security role of Senior Security Admin to make modifications to the account attributes.
  references: []
  page_start: 413
  audit_raw: 'Verify that there is, off system, an inventory of User (not Administrative) accounts and

    that the date is not more 13 weeks old.'
  remediation: "A printable report can be prepared using the following example:\ncnt=0\nprintf \"%4s%68s\\n\" \"AIX\" \"User\
    \ Accounts\"\nlsuser -R files -a admin ALL | while read usr adm; do\nif [[ ${adm} = \"admin=false\" ]] ; then\n printf\
    \ \"%12s\" ${usr}\n let cnt=cnt+1\n [[ $(expr ${cnt} % 6) == 0 ]] && print\nfi\ndone\n[[ $(expr ${cnt} % 6) != 0 ]] &&\
    \ print"
  checks:
  - type: manual_review
    info: 'Verify that there is, off system, an inventory of User (not Administrative) accounts and

      that the date is not more 13 weeks old.'
    severity: medium
- id: 5.2.1
  title: Ensure new passwords are controlled by password attributes (disable NOCHECK)
  scoring: scored
  profile:
  - Level 1
  description: Ensure new passwords are required to pass password attribute controls.
  rationale: If password restrictions are not enforced for some accounts, those accounts represent a much greater risk of
    being compromised by an attacker as they may have weaker passwords vulnerable to brute force attack or provide an indefinite
    window of opportunity for the use of already compromised credentials if the same password has been used on multiple systems.
  impact: When exceptions to the defaults are required - rather than disable all password checking - an account needs to have
    the attribute redefined per account. SHA512 password encryption is recommended as the most secure.
  references: []
  page_start: 417
  audit_raw: 'Execute the following command:

    grep NOCHECK /etc/security/passwd

    The exit status should be 1 and there should not be any output.'
  remediation: "In the file /etc/security/passwd clear the NOCHECK attribute from all users:\n#!/usr/bin/ksh -e\n# Copyright\
    \ AIXTools, 2022\n/usr/bin/grep -p NOCHECK /etc/security/passwd | /usr/bin/egrep \":$\" | sed -e\n's/://' | while read\
    \ USER; do\n /usr/bin/pwdadm -c $USER\n /usr/bin/pwdadm -f ADMCHG $USER\ndone"
  checks:
  - type: command
    command: grep NOCHECK /etc/security/passwd
    expected: ''
    severity: medium
    info: 'Execute the following command:

      grep NOCHECK /etc/security/passwd

      The exit status should be 1 and there should not be any output.'
- id: 5.2.2
  title: pwd_algorithm
  scoring: scored
  profile:
  - Level 1
  description: Defines the loadable password algorithm used when storing user passwords.
  rationale: A development since AIX 5.1 was the ability to use different password algorithms as defined in /etc/security/pwdalg.cfg.
    The traditional UNIX password algorithm is crypt, which is a one-way hash function supporting only 8 character passwords.
    The use of brute force password guessing attacks means that crypt no longer provides an appropriate level of security
    and so other encryption mechanisms are recommended. The recommendation of this benchmark is to set the password algorithm
    to ssha512. This algorithm supports long passwords, up to 255 characters in length and allows passphrases including the
    use of the extended ASCII table and the space character. Any passwords already set using crypt will be recognized. When
    the password is reset the new password hash algorithm will be used to encrypt the password.
  impact: A password algorithm other than crypt is required to support a password minlen greater than 8 (eight) characters.
    SHA512 password encryption is recommended as the most secure.
  references: []
  page_start: 419
  audit_raw: 'Execute the following command:

    #!/usr/bin/ksh -e

    # chk_algorithm:5.2.1

    # Provided to CIS by AIXTools

    # Copyright AIXTools, 2022

    EXPECT="usw pwd_algorithm=ssha512"

    CMD="lssec -f /etc/security/login.cfg -s usw -a pwd_algorithm"

    TST=$(${CMD})

    [[ ${TST} == ${EXPECT} ]] && exit 0

    print "%0: password hash algorithm is not ssha512"

    exit 1'
  remediation: 'In the file /etc/security/login.cfg set the usw stanza attribute pwd_algorithm to

    ssha512:

    #!/usr/bin/ksh -e

    # chk_algorithm:5.2.1

    # Provided to CIS by AIXTools

    # Copyright AIXTools, 2022

    EXPECT="usw pwd_algorithm=ssha512"

    CMD="lssec -f /etc/security/login.cfg -s usw -a pwd_algorithm"

    TST=$(${CMD})

    [[ ${TST} == ${EXPECT} ]] && exit 0

    chsec -f /etc/security/login.cfg -s usw -a pwd_algorithm=ssha512

    exit $?'
  checks:
  - type: manual_review
    info: 'Execute the following command:

      #!/usr/bin/ksh -e

      # chk_algorithm:5.2.1

      # Provided to CIS by AIXTools

      # Copyright AIXTools, 2022

      EXPECT="usw pwd_algorithm=ssha512"

      CMD="lssec -f /etc/security/login.cfg -s usw -a pwd_algorithm"

      TST=$(${CMD})

      [[ ${TST} == ${EXPECT} ]] && exit 0

      print "%0: password hash algorithm is not ssha512"

      exit 1'
    severity: medium
- id: 5.2.3
  title: Ensure passwords are not hashed using 'crypt'
  scoring: scored
  profile:
  - Level 1
  description: The recommendation is to change the default password hash algorithm to ssha512 (see paragraph 5.2.1). However,
    changing the default algorithm away from crypt is not enough. The user must supply a new passowrd before a new hashed
    version of the password is stored in the shadow password file /etc/security/password.
  rationale: The hash algorithm crypt is known by all *nix versions - so it has provided portability. And in the '70's processor
    power was weak enough that the mere 56 bits protection against brute-force attacks was reasonable to sufficient. Fifty
    (50) years later - this is not the case.
  impact: The audit looks for hashed passwords that are 14 (fourteen) characters long. That is the length of the crypt hash.
    The remediation neither changes the password nor locks the account. However, it does clear (if present) and password flags
    (noteably NOCHECK needs to be removed) and sets the flag ADMCHG so that the account will be required to reset their password
    during the next login.
  references: []
  page_start: 421
  audit_raw: "Use the following to find passwords using crypt hash method:\n#!/usr/bin/ksh -e\n# hash:5.2.2\n# Provided to\
    \ CIS by AIXTools\n# Copyright AIXTools, 2022\n while read pass equals cryptedhash; do\n user=$(grep -p $cryptedhash /etc/security/passwd\
    \ | egrep '[a-zA-z0-9]+:$' |\nsed -e s/:$//)\n print ${user}: needs to update passwd\ndone"
  remediation: "Execute the following command to enable an administrative requirement to update\npassword on next login -\
    \ when current password is still hashed using the crypt\nalgorithm.\n#!/usr/bin/ksh -e\n# hash_chk:5.2.12\n# Provided\
    \ to CIS by AIXTools\n# Copyright AIXTools, 2022\n#SystemAccounts are skipped, root is treated a regular account\n#pconsole\
    \ is no longer a system account - being deprecated/removed\nSACTS1=\"(adm|bin|daemon|invscout|ipsec|lp|lpd|nobody|nuucp|sshd|sys|uucp)\"\
    \nSACTS2=\"(esa|srvproxy|imnadm|anonymou|ftp)\"\n while read pass equals cryptedhash; do\n user=$(/usr/bin/grep -p $cryptedhash\
    \ /etc/security/passwd |\\\n /usr/bin/egrep -vp \"${SACTS1}:$\" |\\\n /usr/bin/egrep -vp \"${SACTS2}:$\" |\\\n /usr/bin/egrep\
    \ '[a-zA-z0-9]+:$' | sed -e s/:$//)\n print ${user}: needs to update passwd\n set -x\n /usr/bin/pwdadm -c ${user}\n /usr/bin/pwdadm\
    \ -f ADMCHG ${user}\n set +x\n done"
  checks:
  - type: manual_review
    info: "Use the following to find passwords using crypt hash method:\n#!/usr/bin/ksh -e\n# hash:5.2.2\n# Provided to CIS\
      \ by AIXTools\n# Copyright AIXTools, 2022\n while read pass equals cryptedhash; do\n user=$(grep -p $cryptedhash /etc/security/passwd\
      \ | egrep '[a-zA-z0-9]+:$' |\nsed -e s/:$//)\n print ${user}: needs to update passwd\ndone"
    severity: medium
- id: 5.2.4
  title: minlen
  scoring: scored
  profile:
  - Level 1
  description: Defines the minimum length of a password.
  rationale: In setting the minlen attribute, it ensures that passwords meet the required length criteria.
  impact: ''
  references: []
  page_start: 423
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a minlen

    The above command should yield the following output:

    default minlen=14'
  remediation: 'In /etc/security/user, set the default user stanza minlen attribute to be greater than or

    equal to 14:

    chsec -f /etc/security/user -s default -a minlen=14

    This means that all user passwords must be at least 14 characters in length.

    NOTE: To support a password length greater than 8 characters the default algorithm

    must be changed. If the command above returns an error (3004-692 Error changing

    "minlen" to "14" : Value is invalid.) the recommendation 3.1.15

    /etc/security/login.cfg - pwd_algorithm needs to be completed first.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a minlen

      The above command should yield the following output:

      default minlen=14'
    severity: medium
