- id: 4.7.1.1
  title: Home directory must exist
  scoring: scored
  profile:
  - Level 1
  description: All accounts must have a trusted started point - a HOME directory.
  rationale: 'A missing home directory on many systems places the account in a default directory. Examples include: / and
    /home/guest. This recommendation is specifically about locally administered accounts (in AIX terms, - R files). If an
    account exists in the local registry it must have a home directory that is accessible. This is to ensure it is not an
    invalid account (e.g., restored via a backup accidentally). If a valid account - it still needs a home directory. As the
    difference between: valid account but missing a HOME directory and invalid account but missing a HOME directory cannot
    be made by a script - the recommendation is to lock the account.'
  impact: A valid user can open a ticket and get a HOME directory created or restored. The risk of an invalid user gaining
    access via an old username is reduced.
  references: []
  page_start: 324
  audit_raw: "Ensure HOME directories exists for local administered accounts.\n#!/usr/bin/ksh -e\n# Provided to CIS by AIXTools\n\
    # Copyright AIXTools, 2022\nlsuser -R files -a id home account_locked ALL | while read name ids homes\nlocks rest;\ndo\n\
    \ uid=$(echo ${ids} | cut -f2 -d =)\n if [[ ${uid} -ge 200 ]]; then\n home=$(echo ${homes} | cut -f2 -d =)\n locked=$(echo\
    \ ${locks} | cut -f2 -d =)\n if [[ ${locked} == \"true\" ]]; then\n continue\n elif [[ ! -d ${home} ]]; then\n /usr/bin/printf\
    \ \"Recommend Lock Account [%s]: Missing \\${HOME} at: %-\n32s\\n\" ${name} ${home}\n fi\n fi\ndone\n• There should not\
    \ be any output\n• NOTE: The audit is performed only on accounts with a user ID (uid) greater or\nequal to 200."
  remediation: "Lock local accounts with UID >= 200 when HOME directory does not exist:\n#!/usr/bin/ksh -e\n# Provided to\
    \ CIS by AIXTools\n# Copyright AIXTools, 2022\nlsuser -R files -a id home account_locked ALL | while read name ids homes\n\
    locks rest;\ndo\n uid=$(echo ${ids} | cut -f2 -d =)\n if [[ ${uid} -ge 200 ]]; then\n home=$(echo ${homes} | cut -f2 -d\
    \ =)\n locked=$(echo ${locks} | cut -f2 -d =)\n if [[ ${locked} == \"true\" ]]; then\n continue\n elif [[ ! -d ${home}\
    \ ]]; then\n /usr/bin/printf \"Locked Account [%s]: Missing \\${HOME} at: %-32s\\n\"\n${name} ${home}\n /usr/bin/chuser\
    \ -R files account_locked=true ${name}\n fi\n fi\ndone"
  checks:
  - type: manual_review
    info: "Ensure HOME directories exists for local administered accounts.\n#!/usr/bin/ksh -e\n# Provided to CIS by AIXTools\n\
