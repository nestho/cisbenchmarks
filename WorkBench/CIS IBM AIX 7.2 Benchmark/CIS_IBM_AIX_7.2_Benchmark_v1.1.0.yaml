    HostbasedAuthentication no'
  remediation: 'Edit the /etc/ssh/sshd_config file to ensure that host based authentication is

    disallowed:

    vi /etc/ssh/sshd_config

    Replace:

    #HostbasedAuthentication no

    With:

    HostbasedAuthentication no

    Re-cycle the sshd daemon to pick up the configuration changes:

    stopsrc -s sshd

    startsrc -s sshd'
  checks:
  - type: command
    command: grep "^HostbasedAuthentication[[:blank:]]" /etc/ssh/sshd_config
    expected: ''
    severity: medium
    info: 'Ensure that the HostbasedAuthentication parameter has been changed:

