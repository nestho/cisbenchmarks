- id: 4.5.3.1
  title: 'OpenSSH: Minimum version is 8.1'
  scoring: scored
  profile:
  - Level 1
  description: OpenSSH is the expected program for remote command line access. It provides encrypted protocols such as SSH
    and SCP/SFTP.
  rationale: The recommended mechanism for remote access is to use encrypted protocols such as OpenSSH that are designed to
    prevent the interception of communications. OpenSSH is the standard replacement for clear-text protocols, such as Telnet
    and FTP. Clear-text protocols can be snooped and expose credentials and/or sensitive data to unauthorized parties. Additionally,
    servers that are configured with unique PKI keys can circumvent host impersonation and assure remote hosts/users that
    they are communicating with the intended device.
  impact: 'OpenBSD maintains the OpenSSH project regularly updates OpenSSH. The Major/Minor numbers OpenBSD publishes may
    be higher than the Major/Minor numbers an OS platform uses - due to differences in how they manage packages. The current
    OpenBSD release is: OpenSSH 8.6 released April 19, 2021. IBM''s policy is to stay at a constant level (currently 8.1)
    and maintain a more stable set of configuration keywords or feature set. OpenBSD, never patches a release. Instead, OpenBSD
    releases a new version with the latest security fixes and/or feature changes. This means IBM does not automatically push
    OpenSSH feature changes - but does look at new OpenBSD releases and incorporates security fixes, if any. The current OpenSSH
    version maintained by IBM is OpenSSH 8.1. The openssh fileset VRMF number should start with 8.1.'
  references: []
  page_start: 250
  audit_raw: 'The following command should return Version 8+

    test $(sshd -i </dev/null | cut -d _ -f 2) -ge 8.1 && print "Version 8+" ||

    print "Insufficient"'
  remediation: 'Install OpenSSH version 8.1 (or later), depending on package source.

    The current version available from IBM via

    AIX Web Download Pack Programs

    is 8.1.102.2103.'
  checks:
  - type: manual_review
    info: 'The following command should return Version 8+

      test $(sshd -i </dev/null | cut -d _ -f 2) -ge 8.1 && print "Version 8+" ||

      print "Insufficient"'
    severity: medium
