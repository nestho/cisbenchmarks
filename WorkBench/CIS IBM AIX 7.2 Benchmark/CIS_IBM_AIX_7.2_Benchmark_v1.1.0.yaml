- id: 4.5.3.4
  title: 'sshd_config: Restrict users and groups allowed access via OpenSSH'
  scoring: scored
  profile:
  - Level 1
  description: 'There are multiple options available to regulate access to a server via OpenSSH. At least of the following
    options should be implemented. Note: The allow/deny users directives are processed in the following order: DenyUsers,
    AllowUsers. The allow/deny groups directives are processed in the following order: DenyGroups, AllowGroups. Note: If a
    DenyUser or DenyGroup matches the associated Allow directive is not processed. To implement DenyAll except use only Allow*
    directives. To implement PermitALL except use only Deny* directives. It is advised not to combine Allow and Deny directives
    as this can make the configuration harder to debug. • DenyUsers: The DenyUsers variable specifies user names not permitted
    to access the system via sshd. The definition is a list username pattern(s) separated by spaces. Numeric userIDs are not
    are not allowed (recognized). Patterns can be narrowed to restrict access from specific hosts using the form username@host.
    • AllowUsers: The AllowUsers variable specifies user names permitted to access the system via sshd. The definition is
    a list username pattern(s) separated by spaces. Numeric userIDs are not are not allowed (recognized). Patterns can be
    narrowed to permit access only from specific host(s) using the form username@host. • DenyGroups: The DenyGroups variable
    specifies group names not permitted to access the system via sshd. The definition is a list groupname pattern(s) separated
    by spaces. Numeric groupIDs are not allowed (recognized). Login is disallowed for users whose primary group or supplementary
    group list matches one of the patterns. • AllowGroups: The AllowGroups variable specifies group names permitted to access
    the system via sshd. The definition is a list groupname pattern(s) separated by spaces. Numeric groupIDs are not allowed
    (recognized). Login is allowed for users whose primary group or supplementary group list matches one of the patterns.'
  rationale: By default, login is allowed for all users and all groups. Restricting which users can access the system via
    OpenSSH will help ensure that only authorized users access the system.
  impact: 'When implemented - no longer can any user connect from any host. They must satisfy the connection requirements.
    Note: your organization may already have a OpenSSH restricted access model as this recommendation is already Level 1 for
    Linux* benchmarks.'
  references: []
  page_start: 255
  audit_raw: 'Ensure that the AllowUsers, AllowGroups, DenyUsers, or DenyGroups is set:

    /usr/bin/egrep "^(AllowUsers|AllowGroups|DenyUsers|DenyGroups)[[:blank:]]"

    /etc/ssh/sshd_config

    The above command should yield at least one of the following output:

    AllowUsers <userlist>

    AllowGroups <grouplist>

    DenyUsers <userlist>

    DenyGroups <grouplist>'
  remediation: 'Edit the /etc/ssh/sshd_config file to set one (or more) of the following parameters:

    AllowUsers <userlist>

    AllowGroups <grouplist>

    DenyUsers <userlist>

    DenyGroups <grouplist>

    Re-cycle the sshd daemon to pick up the configuration changes:

    stopsrc -s sshd

    startsrc -s sshd'
  checks:
  - type: manual_review
    info: 'Ensure that the AllowUsers, AllowGroups, DenyUsers, or DenyGroups is set:

      /usr/bin/egrep "^(AllowUsers|AllowGroups|DenyUsers|DenyGroups)[[:blank:]]"

      /etc/ssh/sshd_config

      The above command should yield at least one of the following output:

      AllowUsers <userlist>

      AllowGroups <grouplist>

      DenyUsers <userlist>

      DenyGroups <grouplist>'
    severity: medium
- id: 4.5.3.5
  title: 'sshd_config: PermitRootLogin is ''prohibit-password'' or ''no'''
  scoring: scored
  profile:
  - Level 2
  description: The recommendation is to edit the /etc/ssh/sshd_config file to disable direct root login. Direct root login
    via SSH was enabled by default with prior versions of OpenSSH. To be absolutely certain direct login is disabled the recommendation
    is to set this variable specifically rather than rely on a new, changeable, default.
  rationale: All root access should be facilitated through a local logon with a unique and identifiable user ID and then via
    the su command once locally authenticated. Direct root login using passwords is insecure and does not provide sufficient
    logging or audit trailing for accountability.
  impact: 'While this sounds simple - setting the attribute to no requires either sharing a root password (to use su), the
    installation of sudo, or a configuration using extended RBAC for actions that require enhanced privileges. To resolve,
    partially, the accountability concerns, permitting publickey authentication as root together with LogLevel INFO (minimum)
    provides the following syslog information: Jun 25 09:26:41 x071 auth|security:info sshd[8323282]: Accepted publickey for
    michael from 192.168.129.11 port 54278 ssh2: RSA SHA256:dRHxa5CGr5HCdC89suwYIBtAT8lyogz4SErSxTq0JXk Jun 25 09:26:52 x071
    auth|security:info sshd[8847396]: Accepted publickey for root from 192.168.129.11 port 54279 ssh2: RSA SHA256:dRHxa5CGr5HCdC89suwYIBtAT8lyogz4SErSxTq0JXk
    Jun 25 09:26:53 x071 auth|security:info sshd[9044142]: Accepted publickey for root from 192.168.129.11 port 54280 ssh2:
    RSA SHA256:dRHxa5CGr5HCdC89suwYIBtAT8lyogz4SErSxTq0JXk Local site policy might decide that publickey accountability is
    sufficient and a setting of PermitRootLogin prohibit-password (the new default) provides sufficient accountability and
    security. Note: only public keys in a file such as ~root/.ssh/authorized_keys will be able to connect.'
  references: []
  page_start: 258
  audit_raw: 'Ensure that the PermitRootLogin parameter has been changed:

    /usr/bin/egrep "^PermitRootLogin" /etc/ssh/sshd_config

    The above command should yield one of the following:

    PermitRootLogin prohibit-password

    PermitRootLogin no

    PermitRootLogin forced-commands-only'
  remediation: "#!/usr/bin/ksh\nPREFERRED_SETTING=\"prohibit-password\"\numask 077\nset $(/usr/bin/egrep \"^PermitRootLogin\"\
    \ /etc/ssh/sshd_config)\necho $?\nif [[ ! -z $1 ]]; then\n # Look for a setting and change to no if anything else\n if\
    \ [[ $2 != ${PREFERRED_SETTING} ]]; then\n sed \"s/^PermitRootLogin \\{1\\}[^ ]\\{1,\\}/PermitRootLogin\n${PREFERRED_SETTING}/\"\
    \ /etc/ssh/sshd_config >/tmp/sshd_config.$$\n fi\nelse\n # Look for a comment and append\n sed \"/^# \\{0,\\}PermitRootLogin/\
    \ a\\^JPermitRootLogin ${PREFERRED_SETTING}/\"\n/etc/ssh/sshd_config >/tmp/sshd_config.$$\nfi\nif [[ -e /tmp/sshd_config.$$\
    \ ]]; then\n diff -u /tmp/sshd_config.$$ /etc/ssh/sshd_config\n rm /tmp/sshd_config.$$\nelif\n # Verify setting is specified\n\
    \ /usr/bin/egrep \"^PermitRootLogin\" /etc/ssh/sshd_config >>/dev/null\n if [[ $? -ne 0 ]]; then\n print \"PermitRootLogin\
    \ ${PREFERRED_SETTING}\" >> /etc/ssh/sshd_config\n fi\nfi\nRe-cycle the sshd daemon to pick up the configuration changes:\n\
    stopsrc -s sshd\nsleep 5\nstartsrc -s sshd"
