- id: 6.3.2
  title: Ensure sudo logging is active
  scoring: scored
  profile:
  - Level 2
  description: 'All commands executed via sudo should be logged to either syslog (default) or a dedicated log file Note: visudo
    edits the sudoers file in a safe fashion, analogous to vipw(8). visudo locks the sudoers file against multiple simultaneous
    edits, provides basic sanity checks, and checks or parse errors. If the sudoers file is currently being edited you will
    receive a message to try again later.'
  rationale: Logging of commands executed via sudo enables auditing of those commands
  impact: ''
  references: []
  page_start: 471
  audit_raw: 'Verify that syslog_badpri and syslog_goodpri are not set to none

    Run the following commands:

    # grep -Ei ''^\s*Defaults\s+syslog_badpri=\S+'' /etc/sudoers /etc/sudoers.d/*

    # grep -Ei ''^\s*Defaults\s+syslog_badpri=\S+'' /etc/sudoers /etc/sudoers.d/*

    No output should be returned

    -ORVerify that sudo has a custom log file configured

    Run the following command:

    # grep -Ei ''^\s*Defaults\s+logfile=\S+'' /etc/sudoers /etc/sudoers.d/*'
  remediation: 'Edit the file /etc/sudoers or a file in /etc/sudoers.d/ with visudo -f <PATH TO FILE>

    Remove the any lines which are found containing

    syslog_badpri=none

    or

    syslog_goodpri=none

    -ORIf you do not want to log sudo commands to syslog, to use as sudo specific log file add

    the following line:

    Defaults logfile="<PATH TO CUSTOM LOG FILE>"

    Example:

    Defaults logfile="/var/log/sudo.log"'
  checks:
  - type: manual_review
    info: 'Verify that syslog_badpri and syslog_goodpri are not set to none

      Run the following commands:

      # grep -Ei ''^\s*Defaults\s+syslog_badpri=\S+'' /etc/sudoers /etc/sudoers.d/*

      # grep -Ei ''^\s*Defaults\s+syslog_badpri=\S+'' /etc/sudoers /etc/sudoers.d/*

      No output should be returned

      -ORVerify that sudo has a custom log file configured

      Run the following command:

      # grep -Ei ''^\s*Defaults\s+logfile=\S+'' /etc/sudoers /etc/sudoers.d/*'
    severity: medium
- id: 6.3.3
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 2
  description: 'sudo can be configured to run only from a pseudo-pty Note: visudo edits the sudoers file in a safe fashion,
    analogous to vipw(8). visudo locks the sudoers file against multiple simultaneous edits, provides basic sanity checks,
    and checks or parse errors. If the sudoers file is currently being edited you will receive a message to try again later.'
  rationale: Attackers can run a malicious program using sudo, which would again fork a background process that remains even
    when the main program has finished executing.
  impact: ''
  references: []
  page_start: 473
  audit_raw: 'Verify that sudo can only run other commands from a pseudo-pty

    Run the following command:

    # grep -Ei ''^\s*Defaults\s+([^#]+,\s*)?use_pty(,\s+\S+\s*)*(\s+#.*)?$''

    /etc/sudoers /etc/sudoers.d/*'
  remediation: 'Edit the file /etc/sudoers or a file in /etc/sudoers.d/ with visudo -f <PATH TO FILE>

    and add the following line:

    Defaults use_pty'
