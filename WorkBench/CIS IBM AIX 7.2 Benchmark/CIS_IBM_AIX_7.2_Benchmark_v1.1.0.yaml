    not display support for SASLv2 - remove sendmail on AIX 7.2 and chmod to 0 (zero) otherwise.'
  rationale: 'Maintaining a secure sendmail MTA (mail transfer agent) is a complex process. While, historically, *NIX systems
    have run a (localhost) MTA (mail transmission agent) or MSP (mail submission program) - there is no real need these days
    for every system to have this software installed. Note: Historically, the AIX sendmail build has not supported the AUTH
    feature. Since AIX 7.2 TL4 a new packaging of sendmail (still as version 8.15.2, so version number is not the way to verify
    suitability) allows AUTH support indirectly via the SASLv2 (Simple Authentication and Security Layer) API interface. Our
    recommendation is to disable/remove sendmail programs that do not provide SASLv2 support.'
  impact: • If not installed, the rest of the recommendations in this section titled Sendmail Configuration may be ignored.
    • Applications configured to speak to a localhost MTA or MSP may fail to send mail. These applications should be (re-)configured
    to use STARTTLS or SSL and send their mail messages via a hardened MTA host.
