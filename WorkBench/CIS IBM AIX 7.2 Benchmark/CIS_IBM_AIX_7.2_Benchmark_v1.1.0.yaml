- id: '3.5'
  title: Application Data with requirement for world writable directories
  scoring: manual
  profile:
  - Level 1
  description: The system is audited for world writable directories.
  rationale: World writable directories are considered as a common application component - usually a location for temporary
    files. An audit should be performed on the system to search for the presence of world writable directories. Directories
    should only be world writable when absolutely necessary, and only with the so-called SVTX bit set. This protects users
    files from being deleted or renamed.
  impact: World writable directories exist on UNIX systems (e.g., /tmp, /var/tmp). These directories are needed for normal
    operations. To protect the files created in the directories the 'links to the inode' (ie, filename) need to be protected
    so that others may not accidentally, or maliciously - remove or modify the filename.
  references: []
  page_start: 71
  audit_raw: 'Execute the findcommand.

    Use the following to find all world writable directories on local JFS/JFS2 filesystems that

    do not have the SVTX bit:

    find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! -perm -1000 -ls

    The output should be empty.'
  remediation: '• Review the local mounted JFS/JFS2 filesystems using the following command to

    find all world writable directories missing the SVTX bit:

    find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! -perm -1000 -ls

    • If a directory must retain world writable access, ensure that SVTX bit is set so

    that users can only remove the filenames they own:

    chmod o+t ${dir}

    NOTE: This will leave existing modes while adding the SVTX (also known as sticky

    bit) to the directory. The documented meaning of the flag for directories is:

    Sets the link permission to directories.

    • Otherwise, remove world-write permission - without modifying the other mode

    bits:

    chmod o-w ${dir}'
  checks:
  - type: command
    command: find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! -perm -1000 -ls
    expected: ''
    severity: medium
    info: 'Execute the findcommand.

      Use the following to find all world writable directories on local JFS/JFS2 filesystems that

      do not have the SVTX bit:

      find / \( -fstype jfs -o -fstype jfs2 \) -type d -perm -o+w ! -perm -1000 -ls

      The output should be empty.'
