- id: 4.5.3.10
  title: 'sshd_config: LogLevel is ''INFO'' or ''VERBOSE'''
  scoring: scored
  profile:
  - Level 1
  description: The INFO parameter specifies that record login and logout activity will be logged. While this is the default
    setting for OpenSSH we believe it is better to explicity set the value in the configuration file.
  rationale: 'SSH provides several logging levels with varying amounts of verbosity. LogLevel Gives the verbosity level that
    is used when logging messages from sshd(8). The possible values are: QUIET, FATAL, ERROR, INFO, VERBOSE, DEBUG, DEBUG1,
    DEBUG2, and DEBUG3. The default is INFO. DEBUG and DEBUG1 are equivalent. DEBUG2 and DEBUG3 each specify higher levels
    of debugging output. Logging with a DEBUG level violates the privacy of users and is not recommended. • DEBUG (and VERBOSE)
    is specifically not recommended other than strictly for debugging SSH communications. INFO level is the default level
    and records login/logout activity of SSH users. Login information includes the fingerprint of their SSH keys, when used.
    In situations, such as Incident Response, an SSH fingerprint may be important to determine when a particular user was
    active on a system. The logout record can eliminate those users who disconnected, which helps narrow the field. Note:
    the default action of OpenSSH is to propagate this key for every ssh login.'
  impact: ''
  references: []
  page_start: 271
  audit_raw: 'Ensure that the LogLevel parameter is set to INFO:

    grep "^LogLevel[[:blank:]]" /etc/ssh/sshd_config

    The above command should yield the following output:

    LogLevel INFO'
  remediation: '• Edit the /etc/ssh/sshd_config:

    vi /etc/ssh/sshd_config

    • Set:

    LogLevel INFO

    • Re-cycle the sshd daemon to pick up the configuration changes:

    stopsrc -s sshd

    sleep 2

    startsrc -s sshd'
  checks:
  - type: command
    command: grep "^LogLevel[[:blank:]]" /etc/ssh/sshd_config
    expected: ''
    severity: medium
    info: 'Ensure that the LogLevel parameter is set to INFO:

      grep "^LogLevel[[:blank:]]" /etc/ssh/sshd_config

      The above command should yield the following output:

      LogLevel INFO'
