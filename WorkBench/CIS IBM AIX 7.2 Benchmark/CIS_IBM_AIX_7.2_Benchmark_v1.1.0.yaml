    allowing use of a cryptographic algorithm. If the sender and receiver wish to exchange encrypted messages, each must be
    equipped to encrypt messages to be sent and decrypt messages received Notes: • Kex algorithms have a higher preference
    the earlier they appear in the list • Some organizations may have stricter requirements for approved Key exchange algorithms
    • Ensure that Key exchange algorithms used are in compliance with site policy • The only Key Exchange Algorithms currently
    FIPS 140-2 approved are: - ecdhsha2-nistp256 - ecdh-sha2-nistp384 - ecdh-sha2-nistp521 - diffie-hellman-groupexchange-sha256
    - diffie-hellman-group16-sha512 - diffie-hellman-group18sha512 - diffie-hellman-group14-sha256 • The Key Exchange algorithms
    supported by OpenSSH 8.2 are: curve25519-sha256 curve25519-sha256@libssh.org diffie-hellman-group1-sha1 diffie-hellman-group14-sha1
    diffie-hellman-group14-sha256 diffie-hellman-group16-sha512 diffie-hellman-group18-sha512 diffie-hellman-group-exchange-sha1
    diffie-hellman-group-exchange-sha256 ecdh-sha2-nistp256 ecdh-sha2-nistp384 ecdh-sha2-nistp521 sntrup4591761x25519-sha512@tinyssh.org'
  rationale: Key exchange methods that are considered weak should be removed. A key exchange method may be weak because too
