- id: 4.1.4.1
  title: NFS - disable NFS client
  scoring: scored
  profile:
  - Level 1
  description: Disable NFS client unless system needs to access known NFS shares.
  rationale: NFS can be exploited to gain unauthorized access to file and directories. If a system does not need access to
    an NFS server the NFS client should be disabled to minimize this risk. As AIX software hierarchy does not permit the de
    installation of the NFS client functionality - the base recommendation is to disable NFS mount permissions. The secondary
    control is to frequently verify that unauthorized/unexpected NFS mounts are detected.
  impact: NFS exploits are frequently based on file permission settings - and mistakes in the NFS server and/or NFS client
    configuration settings. A typical classroom example is getting root access via SUID with a executable originating from
    an NFS share.
  references: []
  page_start: 136
  audit_raw: 'Ensure that no NFS mounts are part of the standard mounts:

    /usr/bin/grep -p nfs /etc/filesystems

    The above command should yield no output.'
  remediation: 'Ensure that there are no current NFS client mounts:

    mount |grep "nfs"

    cat /etc/filesystems |grep "nfs"

    The above commands should yield no output.

    De-install the NFS client software:

    installp -u bos.net.nfs.client'
  checks:
  - type: manual_review
    info: 'Ensure that no NFS mounts are part of the standard mounts:

      /usr/bin/grep -p nfs /etc/filesystems

      The above command should yield no output.'
    severity: medium
