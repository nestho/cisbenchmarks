- id: 4.6.5
  title: Unattended terminal session timeout is 900 seconds (or less)
  scoring: scored
  profile:
  - Level 1
  description: TMOUT and TIMEOUT are environmental setting that activate the timeout of a shell. The value is in seconds.
    • TMOUT=n - Sets the shell timeout to n seconds. A setting of TMOUT=0, or unset TMOUT disables the automatic session timeout.
    • readonly TMOUT- Both export and lock TMOUT environmental variable to it's present value, preventing unwanted modification
    during run-time.
  rationale: All systems are vulnerable if terminals are left logged in and unattended. The most serious problem occurs when
    a system manager leaves a terminal unattended that has been enabled with root authority. In general, users should log
    out anytime they leave their terminals. You can force a terminal to log out after a period of inactivity by setting the
    TMOUT and TIMEOUT parameters in the /etc/profile file. The TMOUT parameter works in the ksh (Korn) shell, and the TIMEOUT
    parameter works in the bsh (Bourne) shell.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/aix/7.1?topic=security-unattended-terminals
  page_start: 318
  audit_raw: 'Execute the following command:

    export | /usr/bin/egrep -e "TMOUT|TIMEOUT"

    This should return:

    TIMEOUT=900

    TMOUT=900

    Note: Depending on company policy the value may also be less than 900.'
  remediation: 'Review /etc/profile to verify that TMOUT is configured to:

    • include a timeout of no more than 900 seconds

    • verify export statement is the last statement

    /usr/bin/egrep -e "TMOUT|TIMEOUT" /etc/profile

    This should return something similar to:

    TMOUT=900

    TIMEOUT=900

    export TMOUT TIMEOUT

    If either setting is missing, and/or the export statement, add these to /etc/profile.'
  checks:
  - type: manual_review
    info: 'Execute the following command:

      export | /usr/bin/egrep -e "TMOUT|TIMEOUT"

      This should return:

      TIMEOUT=900

      TMOUT=900

      Note: Depending on company policy the value may also be less than 900.'
    severity: medium
