  rationale: 'The sendmail deamon has a history of security vulnerabilities. The recommendation is to modify default sendmail
    settings that otherwise may provide information that can be used by an attacker. • novrfy: No Verify: do not verify valid
    email addresses. This can be used by attackers, e.g., phishing attacks. • noexpn: no expansion: do not verify/expand email
