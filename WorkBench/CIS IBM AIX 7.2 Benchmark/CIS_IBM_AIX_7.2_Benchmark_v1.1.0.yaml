- id: '2.6'
  title: Enforce Allowlist aka Trusted Execution Checks
  scoring: scored
  profile:
  - Level 2
  description: This takes allowlist aka whitelisting to the next level - where all software, libraries and scripts that are
    not in the trusted signature database (TSD) in /etc/security/tsd/tsd.dat are blocked.
  rationale: At Level 1 (recommendations 2.3, 2.4 and 2.5) - nothing is stopped from being utilized, but the controls are
    active and logging so that missing entries can be added to the TSD so that Level 2 will not cause a breach of availability.
  impact: 'The step is reversible. By returning the TE policies STOP_UNTRUSTD and STOP_ON_CHKFAIL back to OFF the system will
    be returned to the Level 1 Profile. An intermediate Level would be to set STOP_UNTRUSTD to TROJAN rather than ON (Level
    2) or OFF (Level 1). TROJAN Stops the loading of files that do not belong to the TSD and have one of the following security
    settings: * Have suid/sgid bit set * Linked to a file in the TSD * Have entry in the privcmds Database * Be linked to
    a file in the privcmds database'
  references: []
  page_start: 54
  audit_raw: '• Execute the command:

    # trustchk -p stop_untrustd stop_on_chkfail te

    • This should return either:

    STOP_UNTRUSTD=ON

    STOP_ON_CHKFAIL=ON

    TE=ON

    or

    STOP_UNTRUSTD=TROJAN

    STOP_ON_CHKFAIL=ON

    TE=ON'
  remediation: '• Execute one of the following commands:

    trustchk -p stop_untrustd=on stop_on_chkfail=on te=on

    or

    trustchk -p stop_untrustd=trojan stop_on_chkfail=on te=on'
  checks:
  - type: manual_review
    info: '• Execute the command:

      # trustchk -p stop_untrustd stop_on_chkfail te

      • This should return either:

      STOP_UNTRUSTD=ON

      STOP_ON_CHKFAIL=ON

      TE=ON

      or

      STOP_UNTRUSTD=TROJAN

      STOP_ON_CHKFAIL=ON

      TE=ON'
    severity: medium
- id: '2.7'
  title: Remove Unused Symbolic Links
  scoring: scored
  profile:
  - Level 1
  description: This recommendation finds and removes symbolic links whose targets are missing. Symbolic Links that do not
    have a valid target are a risk to system integrity. The recommendation is to scan frequently (weekly or daily) for symbolic
    links without a valid target object and remove them.
  rationale: Do not assume that anyone responsible for maintaining system integrity is (actively) monitoring unknown software.
    Symbolic links - pointing at nothing - are, by definition, unauthorized and/or belong on a blocklist.
  impact: 'Symbolic Links, used properly, are a tremendous asset - enhancing system usability (ease of use). However, when
    pointing to nothing (i.e., whatever they pointed at has been removed but not replaced) system integrity is at the mercy
    of whatever process replaces that filesystem location later. To reduce risk to system integrity any symbolic link that
    points at a non-existent filesystem object is to be removed. Note: most symbolic links that point at no longer existent
    objects exist due to incomplete software removal procedures. When an authorized application is (re-)installed it''s installation
    process will (or should) re-create the symbolic link.'
  references: []
  page_start: 57
  audit_raw: 'The following command (long) lists all symbolic links without an existing file-system

    object.

    find -L / \( -fstype jfs -o -fstype jfs2 \) -type l -ls

    The desired result is no stdout (as there may be output to stderr). For example,

    stderr may report:

    find: /some/link/to/something: Link to an already visited ancestor'
  remediation: 'The following command will remove all symbolic links that lack a valid target object:

    find -L / \( -fstype jfs -o -fstype jfs2 \) -type l | xargs rm'
  checks:
  - type: command
    command: find -L / \( -fstype jfs -o -fstype jfs2 \) -type l -ls
    expected: ''
    severity: medium
    info: 'The following command (long) lists all symbolic links without an existing file-system

      object.

      find -L / \( -fstype jfs -o -fstype jfs2 \) -type l -ls

      The desired result is no stdout (as there may be output to stderr). For example,

      stderr may report:

      find: /some/link/to/something: Link to an already visited ancestor'
- id: '2.8'
  title: Ensure the Trusted Execution Policies cannot be modified
  scoring: scored
  profile:
  - Level 2
  description: Set trusted execution policy LOCK_KERN_POLICIES to enabled. All of the other policies will then be locked and
    cannot be changed without disabling the LOCK_KERN_POLICIES policy and then restarting the system.
  rationale: When policies are locked, unauthorized users cannot make changes to the policies to allow them to execute unapproved
    tools and then revert the settings afterwards. An unplanned system reboot is likely to be noticed and investigated
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Run the command

    trustchk -p | grep LOCK_KERN_POLICIES

    The output should be

    LOCK_KERN_POLICIES=ON'
  remediation: 'Execute the following command

    trustchk –p LOCK_KERN_POLICIES=ON

    3 Data Protection

    Develop processes and technical controls to identify, classify, securely handle, retain,

    and dispose of data.

    See: https://workbench.cisecurity.org/benchmarks/6480/sections/698298

    Why is this Section Critical

    Data is no longer only contained within an enterprise’s border; it is in the cloud, on

    portable end-user devices where users work from home, and is often shared with

    partners or online services that might have it anywhere in the world. In addition to

    sensitive data an enterprise holds related to finances, intellectual property, and

    customer data, there also might be numerous international regulations for protection of

    personal data. Data privacy has become increasingly important, and enterprises are

    learning that privacy is about the appropriate use and management of data, not just

    encryption. Data must be appropriately managed through its entire life cycle. These

    privacy rules can be complicated for multi-national enterprises of any size; however,

    there are fundamentals that can apply to all.

    Once attackers have penetrated an enterprise’s infrastructure, one of their first tasks is

    to find and exfiltrate data. Enterprises might not be aware that sensitive data is leaving

    their environment because they are not monitoring data outflows.

    While many attacks occur on the network, others involve physical theft of portable enduser devices, attacks on service
    providers or other partners holding sensitive data.

    Other sensitive enterprise assets may also include non-computing devices that provide

    management and control of physical systems, such as Supervisory Control and Data

    Acquisition (SCADA) systems.

    The enterprise’s loss of control over protected or sensitive data is a serious and often

    reportable business impact. While some data is compromised or lost as a result of theft

    or espionage, the vast majority are a result of poorly understood data management

    rules, and user error. The adoption of data encryption, both in transit and at rest, can

    provide mitigation against data compromise, and, even more important, it is a regulatory

    requirement for most controlled data.'
  checks:
  - type: command
    command: trustchk -p | grep LOCK_KERN_POLICIES
    expected: ''
    severity: medium
    info: 'Run the command

      trustchk -p | grep LOCK_KERN_POLICIES

      The output should be

      LOCK_KERN_POLICIES=ON'
- id: '3.1'
  title: 'Encryption: File System Level (EFS)'
  scoring: scored
  profile:
  - Level 2
  description: The recommendation, if there is a requirement for file based encryption aka encryption at rest, is to utilize
    EFS.
  rationale: A security enhancement introduced with AIX 6.1 is Encrypted Filesystems (EFS). This technology enables an individual
    user to encrypt their own data within a jfs2 filesystem. After enabling a filesystem to use EFS individual files can be
    encrypted or encryption can be set at the directory (all files within the directory, recursively) or by system administration
    at filesystem level. Encryption is performed by the kernel. Access to the kernel secret key is managed via keystore files.
    The standard AIX data and user management commands have been modified to work with encryption. Data is only accessible
    in 'cleartext' when the active process has access to the secret key. Without this access the file system acts as if the
    file does not exist.
  impact: The use of EFS enhances the file and directory security within AIX. If there are sensitive or confidential files,
    encryption provides that extra level of security in the event of an accidental chmod which may allow read or write access
    to other users. The encryption operates at the filesystem level and each file is encrypted with a separate key. From a
    user perspective the encryption is transparent as the key can be automatically loaded during login.
  references:
  - 1. https://www.ibm.com/docs/en/aix/7.1?topic=system-efs-encrypted-file
  page_start: 61
  audit_raw: "Validate the installation of the CLiC software:\nlslpp -L |grep \"clic\"\nThe above command should yield the\
    \ following output:\nclic.rte.includes 4.3.0.0 C F CrytoLite for C Library\n Include File\nclic.rte.kernext 4.3.0.0 C\
    \ F CrytpLite for C Kernel\nclic.rte.lib 4.3.0.0 C F CyrptoLite for C\nLibrary\nclic.rte.pkcs11 4.3.0.0 C F PKCS11 Software\
    \ Token\nSupport\nNOTE: The version numbers may differ based on the source of the software\nValidate that the CLiC kernel\
    \ extension has loaded:\ngenkex |grep crypt\nThe above command should yield the following output:\n438b000 39000 /usr/lib/drivers/crypto/clickext"
  remediation: 'There are two pre-requisite requirements for EFS, it requires RBAC and the installation

    of the CLiC cryptographic fileset. The fileset is located on the expansion pack, shipped

    with the AIX media.

    Place the CLiC software into a convenient location, such as /tmp and install via:

    /usr/lib/instl/sm_inst installp_cmd -a -Q -d /tmp -f clic.rte -c -N -g -X -G

    -Y

    NOTE: If the software is not located in /tmp, reflect the actual location in the command

    above.

    Load the CLiC kernel extension:

    /usr/lib/methods/loadkclic

    As the EFS administrator, create the initial keystore. This is typically the root user:

    efsenable -a

    An EFS enabled filesystem can be created with the following command:

    chfs -v jfs2 -g <vg_name> -m <filesystem> -a size=<size> -a efs=yes

    To enable EFS for an existing filesystem:

    chfs -a efs=yes <filesystem>

    To encrypt a file, load your keystore via:

    efskeymgr -o ksh

    Then encrypt via:

    efsmgr -c AES_192_ECB -e <filename>

    To decrypt:

    efsmgr -d <filename>

    Further details regarding planning and implementation of EFS can be found within the

    IBM AIX 7.1 Infocentre:

    https://www.ibm.com/docs/en/aix/7.1?topic=system-efs-encrypted-file

    NOTE: The configuration of EFS is completely dependent on the unique requirements

    of a given environment.'
  checks:
  - type: manual_review
    info: "Validate the installation of the CLiC software:\nlslpp -L |grep \"clic\"\nThe above command should yield the following\
      \ output:\nclic.rte.includes 4.3.0.0 C F CrytoLite for C Library\n Include File\nclic.rte.kernext 4.3.0.0 C F CrytpLite\
      \ for C Kernel\nclic.rte.lib 4.3.0.0 C F CyrptoLite for C\nLibrary\nclic.rte.pkcs11 4.3.0.0 C F PKCS11 Software Token\n\
      Support\nNOTE: The version numbers may differ based on the source of the software\nValidate that the CLiC kernel extension\
      \ has loaded:\ngenkex |grep crypt\nThe a"
    severity: medium
- id: '3.2'
  title: 'Encryption: Logical Volume (ELV)'
  scoring: manual
  profile:
  - Level 2
  description: Starting with AIX 7.2 TL5, AIX adds LV encryption (encryption at logical volume level). This is an alternate
    data at rest encryption solution. Below is a blog about the feature. In the references there is a link to one of the early
    blogs (written by an IBMer). The end of blog points to documentation in AIX 7.2 knowledge center.
  rationale: Some organizations are required to show that data at rest is encrypted. A common example is the PCI (payment
    card industry) requirement to encrypt so-called sensitive data such as a direct link between card holder name and card
    number. Using LV encryption is much like disk encryption of a PC. Once operational, the application environment does not
    even know the data is encrypted. The encryption is only noticeable when the (disk) storage is mounted somewhere else.
    Outside of the configured environment all information on the disk (read logical volume) is encrypted.
  impact: For many uses LVE (logical volume encryption) is much easier to use - by applications - compared to an encryption
    solution such as EFS (encrypted file system). Once the system boots - and a valid (i.e., authorised) process or user is
    active on the system - they will have access to data, or not - depending on the classic access controls (e.g., inode DAC
    controls, ACLs, etc.). LVE does have specific requirements on the management environment and the systems that can support
    it. See the blog for specifics. (EFS has no requirements other than it is enabled on AIX 6.1 or later). No audit or remediation
    statements are provided. They will need to be provided by whoever implements LVE in your environment.
  references:
  - '1. **BLOG**: [AIX 72 TL5: Logical Volume'
  page_start: 65
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '3.3'
  title: Ensure default user umask is 027 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: The user file-creation mode mask (umask) is used to determine the file permission for newly created directories
    and files. In AIX, the default permissions for any newly created directory is 0755 (rwxr-xr-x), and for any newly created
    file it is 0644 (rw-r--r--). The umask modifies the default AIX permissions by restricting (masking) these permissions.
    The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file
    mode.
  rationale: Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'From the command prompt, execute the following command:

    lssec -f /etc/security/user -s default -a umask

    The above command should yield the following output:

    default umask=27'
  remediation: 'Add the umask attribute to the default user stanza in /etc/security/user:

    chsec -f /etc/security/user -s default -a umask=027'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command:

      lssec -f /etc/security/user -s default -a umask

      The above command should yield the following output:

      default umask=27'
