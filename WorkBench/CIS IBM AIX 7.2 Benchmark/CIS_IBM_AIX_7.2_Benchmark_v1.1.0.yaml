- id: 4.7.1.2
  title: Home directory must be owned by account, or special account
  scoring: scored
  profile:
  - Level 1
  description: All user home directories must have a suitable owner UID.
  rationale: Manipulating home directories may enable malicious users to steal or modify data, or to gain other user's system
    privileges. The UID (or owner) of the HOME directory needs to be either the account or a special account defined for this
    purpose. When the account is the owner - the security policy must specify that (some) accounts may have DAC authorization
    to modify HOME directory contents. Security policy may also specify a special UID used to own HOME directories to prevent
    accounts from modifying the layout and/or content of the HOME directory. The assumption of this recommendation is that
    security policy has not specified either. The recommendation is to lock accounts when the HOME directory is not owned
    by the user or by root.
  impact: '*Locally administered accounts with HOME directories owned by a random userid will be locked. Valid users can open
    a ticket to get the UID of their HOME directory corrected. The risk of a malicious user modifying an accounts HOME directory
    is reduced.'
  references: []
  page_start: 327
  audit_raw: "Ensure HOME directory exists and is owned by account (or root)\n#!/usr/bin/ksh -e\n# Provided to CIS by AIXTools\n\
    # Copyright AIXTools, 2022\nlsuser -R files -a id home account_locked ALL | while read name ids homes\nlocks rest;\ndo\n\
    \ uid=$(echo ${ids} | cut -f2 -d =)\n if [[ ${uid} -ge 200 ]]; then\n home=$(echo ${homes} | cut -f2 -d =)\n locked=$(echo\
    \ ${locks} | cut -f2 -d =)\n if [[ ${home} == \"/dev/null\" || ${locked} == \"true\" ]]; then\n continue\n elif [[ ! -d\
    \ ${home} ]]; then\n /usr/bin/printf \"%-32s does not exist; Recommend Lock Account\n[%s]\\n\" ${home} ${name}\n continue\n\
    \ else\n /usr/bin/perl -e '\n $user=$ARGV[0]; $hd=$ARGV[1]; $uid=$ARGV[2]; $huid=((stat\n$hd)[4]);\n if ($huid != $uid\
    \ && $huid != 0) {\n exit(1); # triggers command after OR (||)\n }' ${name} ${home} ${uid} || \\\n /usr/bin/printf \"\
    Recommend Lock Account: %s does not own\n%s\\n\" ${name} ${home}\n fi\n fi\ndone\n• There should not be any output\n•\
    \ NOTE: The audit is performed only on accounts with a user ID (uid) greater or\nequal to 200.\nAlso, if the HOME directory\
    \ has already been defined to something special (here,\n/dev/null) no audit is performed."
  remediation: "For all local accounts with UID >= 200:\n#!/usr/bin/ksh -e\n# Provided to CIS by AIXTools\n# Copyright AIXTools,\
