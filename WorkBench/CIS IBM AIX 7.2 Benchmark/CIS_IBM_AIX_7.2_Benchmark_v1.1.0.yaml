controls:
- id: '2.1'
  title: Collect system configuration regularly
  scoring: manual
  profile:
  - Level 1
  description: Maintain a listing of the system configuration showing assets configured into the system.
  rationale: The syslog facility local1 is chosen as this is also the facility that the Dynamic Resource Manager (DRM) reports
    to. The command logger simplifies appending command stdout to the syslogd.
  impact: All changes to the system configuration should be logged so that the expected configuration is documented. Regular
    verification of the current configuration makes it possible to identify and correct undocumented system configuration
    changes.
  references: []
  page_start: 42
  audit_raw: '• Verify there is a regular, automated, process to extract the system configuration

    and append it to a syslog.

    • Verify there is a setting in /etc/syslog.conf to collect local1.info messages to

    a local log file.'
  remediation: '• This example shows how to setup a daily cronjob. The actual frequency you use

    might differ. The keyword in the recommendation is: regular.

    • This example also shows two syslog reporting lines: one to a system file, the

    second to a centralized syslog service.

    • The syslog facility local1 is used to keep these reports out of the standard

    syslog facilities. There is not meant to establish a requirement to use facility

    local1.

    # mkdir -p /var/log/syslog

    # touch /var/log/syslog/inventory.log

    # print "local1.info /var/log/syslog/inventory.log rotate 1m files 24

    compress" >> /etc/syslog.conf

    # print "local1.info @rsyslog.domain" >> /etc/syslog.conf

    # refresh -s syslogd || startsrc -s syslogd

    # print "0 0 * * * /usr/sbin/lsconf -v | /usr/bin/logger -p local1.info -t

    Inventory" >> /var/spool/crontabs/root

    # /usr/sbin/lsconf -v | /usr/bin/logger -p local1.info -t Inventory'
  checks:
  - type: manual_review
    info: '• Verify there is a regular, automated, process to extract the system configuration

      and append it to a syslog.

      • Verify there is a setting in /etc/syslog.conf to collect local1.info messages to

      a local log file.'
    severity: medium
- id: '2.2'
  title: Scan for TROJAN aka Untrusted/Unauthorized Applications (Implement Allowlist)
  scoring: manual
  profile:
  - Level 1
  description: This recommendation is find and report (audit) software on the system that has not been included in the TE
    (trusted execution) TSD (trusted signature database).
  rationale: 'These entries establish a so-called AllowList. Software not included on this AllowList should be generating
    a syslog and/or audit record whenever it is executed. Trusted Execution (TE) is an AIX security component that can be
    used to monitor unauthorized software in real time. Unauthorized seems a clear definition, but how TE determines unauthorized
    may not be as clear. Simply put, the goal is that all software is on the AllowList. If not, the software is unauthorized.
    AIX uses the term TROJAN (see below) to determine that an application is unauthorized. Software that does not require
    any special kernel privileges to run is also authorized. What is a Trojan? For this benchmark we add the AIX concept of
    TROJAN as a definition of unauthorised. AIX defines Trojan any executable not in the TSD with one or more of the following
    characteristics: • uses either SUID or SGID • is linked to a command in the TSD (AllowList) • is in the privcmds (aka
    RBAC definition, ie, may have kernel privileges). • is linked to a command in the privcmds database. Summary: On AIX the
    construct AllowList is implemented by the TSD. The clear advantage of an AllowList monitored by a system security component
    is that the system can enforce and/or report violations of AllowList in real-time. This recommendation focuses on reporting
    violations of the AllowList. A later recommendation (update or new version of benchmark) will have a Level 2 recommendation
    including enforcing violations.'
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'The following command will locate the software AIX considers untrusted aka TROJAN.

    Note: the output goes to stderr so stderr is first joined to stdout and thereafter stdout

    get redirected to /dev/null. The argument -i instructs the scan to ignore NFS mounts.

    trustchk -i -n tree / 2>&1 >/dev/null | grep untrusted'
  remediation: 'This will be a manual process. The remediation is to find and remove the offending file

    (currently the reported file might be the artifact of another error - most common is a

    symbolic link that points at a non-existent object).

    The starting point is running the same command from the AUDIT section:

    trustchk -i -n tree / 2>&1 >/dev/null | grep untrusted

    Line by line, verify the root cause and act (one of):

    • remove the offending object

    • remove SUID/SGID settings

    • remove privcmds setting

    • add to TSD aka AllowList'
  checks:
  - type: command
    command: trustchk -i -n tree / 2>&1 >/dev/null | grep untrusted
    expected: ''
    severity: medium
    info: 'The following command will locate the software AIX considers untrusted aka TROJAN.

      Note: the output goes to stderr so stderr is first joined to stdout and thereafter stdout

      get redirected to /dev/null. The argument -i instructs the scan to ignore NFS mounts.

      trustchk -i -n tree / 2>&1 >/dev/null | grep untrusted'
- id: '2.3'
  title: Allowlist Authorized Software and Report Violations
  scoring: scored
  profile:
  - Level 1
  description: At Level 1, utilize Trusted Execution (TE) to log execution of applications not yet allowlisted. This can be
    used to update the allowlist (TSD - /etc/security/tsd/tsd.dat) so that, at Profile Level 2, non-listed applications are
    actually prevented from executing.
  rationale: ''
  impact: As long as the TE policies STOP_UNTRUSTED=OFF and STOP_ON_CHKFAIL=OFF the system will only log missing entries.
  references: []
  page_start: 47
  audit_raw: '• Run the command trustchk -p

    The output needs to include the lines

    TE=ON

    CHKEXEC=ON

    • Verify syslog is configured to collect kern.info data, e.g.

    kern.info /var/log/syslog/kern.log 1 month files 24 compress

    • This will provide entries similar to:

    Jan 26 15:54:32 x077 kern:info unix: Trusted Execution: pid=14221506, euid=0,

    ruid=0: File not in TSD: /usr/bin/bzip2

    Jan 26 15:54:32 x077 kern:info unix: Trusted Execution: pid=14221506, euid=0,

    ruid=0: Allowing to execute non trusted file: /usr/bin/bzip2

    • audit should be configured to report on TE events.

    The following events need to be included in the default: class

    TE_Untrusted

    TE_FileWrite

    TE_Policies

    TEAdd_Stnz

    TEDel_Stnz

    TESwitch_algo

    TEQuery_Stnz

    TE_VerifyAttr'
  remediation: '# trustchk -p TE=ON CHKEXEC=ON STOP_ON_CHKFAIL=OFF

    # mkdir -p /var/log/syslog

    # touch /var/log/syslog/kernel.log

    # print "kern.info /var/log/syslog/kernel.log rotate 1m files 24 compress" >>

    /etc/syslog.conf

    # print "kern.info @rsyslog.domain" >> /etc/syslog.conf

    # refresh -s syslogd || startsrc -s syslogd'
  checks:
  - type: manual_review
    info: '• Run the command trustchk -p

      The output needs to include the lines

      TE=ON

      CHKEXEC=ON

      • Verify syslog is configured to collect kern.info data, e.g.

      kern.info /var/log/syslog/kern.log 1 month files 24 compress

      • This will provide entries similar to:

      Jan 26 15:54:32 x077 kern:info unix: Trusted Execution: pid=14221506, euid=0,

      ruid=0: File not in TSD: /usr/bin/bzip2

      Jan 26 15:54:32 x077 kern:info unix: Trusted Execution: pid=14221506, euid=0,

      ruid=0: Allowing to execute non trusted file: /usr/bin/b'
    severity: medium
