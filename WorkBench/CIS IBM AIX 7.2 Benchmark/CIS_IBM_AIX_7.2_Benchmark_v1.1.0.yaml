  audit_raw: '• Ensure that the /audit filesystem has been created and mounted:

    lsfs /audit || print "Audit Filesystem is missing"

    The command should not yield any output:

    NOTE: Failed output will look something like this:

    lsfs: 0506-915 No record matching /audit was found in /etc/filesystems.

    Audit Filesystem is missing

    • Validate the configuration in the /etc/security/audit/config file. This should

    match the changes made in the remediation section:

    cat /etc/security/audit/config

    • Ensure that the /usr/lib/security/mkuser.default auditclasses entry has been

    updated:

    lssec -f /usr/lib/security/mkuser.default -s user -a auditclasses

    The above command should yield the following output:

    user auditclasses=general,SRC,cron,tcpip

    • Ensure that the cron audit rotation script has been implemented:

    crontab -l |grep "cronaudit"

    The above command should yield the following output:

    0 * * * * /etc/security/aixpert/bin/cronaudit

    • Ensure that the audit startup line has been added into /etc/inittab:

    lsitab audit

    This should return:'
  remediation: "Configure AIX auditing in-line with the High Level AIX Security Expert policy.\nCreate a /audit filesystem,\
    \ at least 100 MB in size:\nmklv -y <LV name> -t jfs2 -u 1 -c 1 rootvg 1 hdisk0\ncrfs -v jfs2 -d auditlv -m /audit -A\
    \ yes -t no\nmount /audit\nReflect the following configuration in the /etc/security/audit/config file:\nvi /etc/security/audit/config\n\
    Add in:\nstart:\n binmode = on\n streammode = off\nbin:\n trail = /audit/trail\n bin1 = /audit/bin1\n bin2 = /audit/bin2\n\
    \ binsize = 10240\n cmds = /etc/security/audit/bincmds\nAdd the auditing entries for root and all other users below the\
    \ pre-defined audit classes:\nusers:\n root = general,SRC,mail,cron,tcpip,ipsec,lvm\n <user 1> = general,SRC,cron,tcpip\n\
    \ <user 2> = general,SRC,cron,tcpip\n etc.\nUpdate the /usr/lib/security/mkuser.default auditclasses entry to ensure that\n\
    auditing is set up for any newly created users:\nchsec -f /usr/lib/security/mkuser.default -s user -a\nauditclasses=general,SRC,cron,tcpip\n\
    A cron job is implemented to monitor the free space in /audit, running hourly, to ensure\nthat /audit does not fill up.\
    \ If /audit is greater than 90% used, /audit/trail is moved\nto /audit/trailOneLevelBack:\ncrontab -e\nAdd in:\n0 * *\
    \ * * /etc/security/aixpert/bin/cronaudit\nNOTE: The implementation of a script to suit internal security policy is recommended\
    \ to\nfurther enhance the log rotation process.\nAdd the audit startup command into /etc/inittab:\nmkitab \"audit:2:boot:audit\
    \ start > /dev/console 2>&1 # Start audit\""
