controls:
- id: '1.1'
  title: Ensure the appropriate MongoDB software version/patches are installed
  scoring: manual
  profile:
  - Level 1- MongoDB
  description: 'The MongoDB installation version, along with the patch level, should be the most recent that is compatible
    with the organization''s operational needs. In addition, regularly view latest minor security patch updates for security
    vulnerability fixes (CVE Related) from MongoDB website: https://www.mongodb.com/alerts'
  rationale: Using the most recent MongoDB software version along with all applicable patches, helps limit the possibilities
    for vulnerabilities in the software. The installation version and/or patches applied should be selected according to the
    needs of the organization. At a minimum, the software version should be supported.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/installation/
  - 2. https://www.mongodb.com/docs/v7.0/release-notes/7.0/#std-label-release-notes7.0
  page_start: 15
  audit_raw: 'On Ubuntu:

    Run the following command from within the MongoDB shell to determine if the

    MongoDB software version complies with your organization’s operational needs:

    mongo --version

    db.version() #Inside mongo console

    On Windows:

    Navigate to the Installation directory of Mongo DB on the server and run below

    command

    mongod.exe --version'
  remediation: 'Upgrade to the latest version of the MongoDB software:

    1. Backup the data set.

    2. Download the binaries for the latest MongoDB revision from the MongoDB

    Download Page and store the binaries in a temporary location. The binaries

    download as compressed files that extract to the directory structure used by the

    MongoDB installation.

    3. Shutdown the MongoDB instance.

    4. Replace the existing MongoDB binaries with the downloaded binaries.

    5. Restart the MongoDB instance.'
  checks:
  - type: manual_review
    info: 'On Ubuntu:

      Run the following command from within the MongoDB shell to determine if the

      MongoDB software version complies with your organization’s operational needs:

      mongo --version

      db.version() #Inside mongo console

      On Windows:

      Navigate to the Installation directory of Mongo DB on the server and run below

      command

      mongod.exe --version'
    severity: medium
- id: '2.1'
  title: Ensure Authentication is configured
  scoring: scored
  profile:
  - Level 1- MongoDB
  description: 'This setting ensures that all clients, users, servers are required to authenticate before being granted access
    to the MongoDB database. Authentication is the process of verifying the identity of a client. When access control, i.e.
    authorization, is enabled, MongoDB requires all clients to authenticate themselves in order to determine their access.
    from MongoDB documentation Authentication Mechanisms MongoDB supports a number of authentication mechanisms that clients
    can use to verify their identity. These mechanisms allow MongoDB to integrate into your existing authentication system.
    MongoDB supports multiple authentication mechanisms: • SCRAM (Default) • x.509 Certificate Authentication. Certificate
    Authority For production use, your MongoDB deployment should use valid certificates generated and signed by a certificate
    authority. You or your organization can generate and maintain an independent certificate authority, or use certificates
    generated by third-party TLS/SSL vendors. In addition to supporting the aforementioned mechanisms, MongoDB Enterprise
    also supports the following mechanisms: • LDAP proxy authentication • Kerberos authentication.'
  rationale: Failure to authenticate clients, users, servers can enable unauthorized access to the MongoDB database and can
    prevent tracing actions back to their sources. It's highly recommended that password length and complexity also be in-place.
    When performing the traditional user/password authentication against MongoDB there is not in-place intrinsic password
    complexity check and there is no LOCKING mechanism with multiple failure logins. So, MongoDB is prone to brute force attacks
    compared to other database systems.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/core/authentication/
  page_start: 18
  audit_raw: 'Run the following command to verify whether an authorization is enabled on the

    MongoDB server.

    On Ubuntu:

    cat /etc/mongod.conf | grep “authorization”

    On Windows:

    type mongod.conf | findstr “authorization”

    The value for authorization must be set to enabled.

    To authenticate using the mongo shell use the following approach

    • Use the mongo command-line authentication options (--username, --password,

    and --authenticationDatabase) when connecting to the mongod or mongos

    instance

    Or

    • Connect first to the mongod or mongos instance, and then run the authenticate

    command or the db.auth() method against the authentication database.'
  remediation: "The authentication mechanism should be implemented before anyone accesses the\nMongoDB Server.\nTo enable\
    \ the authentication mechanism:\n• Start the MongoDB instance without authentication.\nmongod --port 27017 --dbpath /data/db1\n\
    Or\nmongod.exe --port 27017 --dbpath db1\n• Create the system user administrator, ensuring that its password meets\norganizationally-defined\
    \ password in terms of length and complexity\nrequirements as there is no in-place locking mechanism for multiple failed\
    \ login\nattempts against MongoDB.\nuse admin\ndb.createUser(\n {\n user: \"MongoAdmin\",\n pwd: \"password\",\n roles:\
    \ [ { role: \"root\", db: \"admin\" } ]\n }\n)\n• Open mongod.conf and change for authorization value to enabled:\nsecurity:\n\
    \ authorization: \"enabled\"\n• Restart the MongoDB instance\nservice mongod restart"
  checks:
  - type: command
    command: cat /etc/mongod.conf | grep “authorization”
    expected: ''
    severity: medium
    info: 'Run the following command to verify whether an authorization is enabled on the

      MongoDB server.

      On Ubuntu:

      cat /etc/mongod.conf | grep “authorization”

      On Windows:

      type mongod.conf | findstr “authorization”

      The value for authorization must be set to enabled.

      To authenticate using the mongo shell use the following approach

      • Use the mongo command-line authentication options (--username, --password,

      a'
- id: '2.2'
  title: Ensure that MongoDB does not bypass authentication via the localhost exception
  scoring: scored
  profile:
  - Level 1- MongoDB
  description: 'MongoDB should not be set to bypass authentication via the localhost exception. The localhost exception allows
    the user to enable authorization before creating the first user in the system. When active, the localhost exception allows
    all connections from the localhost interface to have full access to that instance. The exception applies only when there
    are no users created in the MongoDB instance. Note: This recommendation only applies when there are no users created in
    the MongoDB instance.'
  rationale: Disabling this exception will prevent unauthorized local access to the MongoDB database. It will also ensure
    the traceability of each database activity to a specific user. Localhost Exception allows direct connect to Mongod’s without
    any UN/PW.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/core/localhost-exception/
  page_start: 21
  audit_raw: 'Run the following command to extract the information about

    enableLocalhostAuthBypass setting on Configuration File.

    On Ubuntu:

    cat /etc/mongod.conf |grep "enableLocalhostAuthBypass"

    On Windows:

    type mongod.conf | findstr "enableLocalhostAuthBypass"

    The value for enableLocalhostAuthBypass must be false.'
  remediation: "To disable local authentication on the MongoDB database.\nType OS Console Command\nmongod --setParameter enableLocalhostAuthBypass=0\n\
    or\nTo manually configure use the setParameter option in the mongo configuration file to\nset it to false.\nsetParameter:\n\
    \ enableLocalhostAuthBypass: false"
  checks:
  - type: command
    command: cat /etc/mongod.conf |grep "enableLocalhostAuthBypass"
    expected: ''
    severity: medium
    info: 'Run the following command to extract the information about

      enableLocalhostAuthBypass setting on Configuration File.

      On Ubuntu:

      cat /etc/mongod.conf |grep "enableLocalhostAuthBypass"

      On Windows:

      type mongod.conf | findstr "enableLocalhostAuthBypass"

      The value for enableLocalhostAuthBypass must be false.'
- id: '2.3'
  title: Ensure authentication is enabled in the sharded cluster
  scoring: scored
  profile:
  - Level 2 - MongoDB
  description: 'Authentication is enabled in a sharded cluster when the certificate or key files are created and configured
    for all components. This ensures that every client that accesses the cluster must provide credentials, to include MongoDB
    instances that access each other within the cluster. With keyfile authentication, each mongod or mongos instance in the
    sharded cluster uses the contents of the keyfile as the shared password for authenticating other members in the deployment.
    Only mongod or mongos instances with the correct keyfile can join the sharded cluster. For Production Environment: x.509
    certificate authentication with secure TSL/SSL connection must be used for authentication. For Development Purpose: Key
    file can be used as an authentication mechanism between the shared cluster. Keyfiles are bare-minimum forms of security
    and are best suited for testing or development environments.'
  rationale: Enforcing a key or certificate on a sharded cluster prevents unauthorized access to the MongoDB database and
    provides traceability of database activities to a specific user or component. A MongoDB sharded cluster can enforce user
    authentication as well as internal authentication of its components to secure against unauthorized access.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/core/security-transport-encryption/#stdlabel-transport-encryption
  - 2. https://www.mongodb.com/docs/v7.0/reference/security/
  page_start: 23
  audit_raw: 'Based on recommendations

    •

    PEMKeyFile, clusterFile, CAFile must be configured.

    •

    clusterAuthMode should be set to x509

    •

    authenticationMechanisms should be set to MONGODB-X509.

    To Check That your Current MongoDB is configured for sharding setup, execute the

    following command:

    sh.status()

    OR

    db.printShardingStatus()

    Run the following command to verify that the certificate-based authentication is

    configured:

    On Ubuntu:

    cat /etc/mongod.conf | grep "clusterAuthMode"

    On Windows:

    type mongod.conf | findstr “clusterAuthMode”

    Run the following command to verify that the key file-based authentication is

    configured: (Only for Development Purpose)

    On Ubuntu:

    cat /etc/mongod.conf | grep “keyFile”

    On Windows:

    type mongod.conf | findstr “keyFile”'
  remediation: "To authenticate to servers, clients can use x.509 certificates instead of usernames and\npasswords.\nMongoDB\
    \ supports x.509 certificate authentication for use with a secure TLS/SSL\nconnection. The x.509 client authentication\
    \ allows clients to authenticate to servers with\ncertificates rather than with a username and password.\nChange the configuration\
    \ file /etc/mongod.conf on each host, adding the following\nrows:\nnet:\n port: 27017\n tls:\n mode: requireSSL\n PEMKeyFile:\
    \ /etc/mongodb/ssl/server1.pem\n CAFile: /etc/mongodb/ssl/mongoCA.crt\n clusterFile: /etc/mongodb/ssl/server1.pem\n security:\n\
    \ authorization: enabled\n clusterAuthMode: x509\nsecurity:\n authorization: enabled\n clusterAuthMode: x509\nnet:\n tls:\n\
    \ mode: requireTLS\n certificateKeyFile: <path to its TLS/SSL certificate and key file>\n CAFile: <path to root CA PEM\
    \ file to verify received certificate>\n clusterFile: <path to its certificate key file for membership\nauthentication>\n\
    \ bindIp: localhost,<hostname(s)|ip address(es)>\nRestart the daemon\nsudo service mongodb restart\nTo enable authentication\
    \ in the sharded cluster, perform the following steps:(Only for\nDevelopment Purpose)\n•\nGenerate A Key File\n• On each\
    \ component in the shared cluster, enable authentication by editing the\nconfiguration file /etc/mongod.conf. Set the\
    \ keyFile option to the key file’s\npath and then start the component with this command:\nkeyFile = /srv/mongodb/keyfile\n\
    • When starting the component, set --keyFile option, which is an option for both\nmongos instances and mongod instances.\
    \ Set the --keyFile to the key file’s\npath."
  checks:
  - type: command
    command: cat /etc/mongod.conf | grep "clusterAuthMode" && cat /etc/mongod.conf | grep “keyFile”
    expected: Run the following command to verify that the certificate-based authentication is
    severity: medium
    info: 'Based on recommendations

      •

      PEMKeyFile, clusterFile, CAFile must be configured.

      •

      clusterAuthMode should be set to x509

      •

      authenticationMechanisms should be set to MONGODB-X509.

      To Check That your Current MongoDB is configured for sharding setup, execute the

      following command:

      sh.status()

      OR

      db.printShardingStatus()

      Run the following command to verify that the certificate-based authentication is

      co'
- id: '3.1'
  title: Ensure least privilege for database accounts
  scoring: manual
  profile:
  - Level 1- MongoDB
  description: 'MongoDB grants access to data and commands through "role-based" approach, MongoDB is shipped with built-in
    roles that provide the different levels of access commonly needed in a database system. In addition, you can create custom-roles.
    The following roles provide the ability to assign any user any privilege on any database, which means that users with
    one of these roles can assign themselves any privilege on any database: dbOwner role, when scoped to the admin database
    userAdmin role, when scoped to the admin database userAdminAnyDatabase role'
  rationale: Ensuring highly privileged Roles are granted only for database administrators, and roles are not scoped to "admin"
    databases will reduce attack surface and follows the least privilege principle.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/reference/built-in-roles/
  page_start: 28
  audit_raw: 'To check accounts with database roles scoped in "admin" database, use the following

    query:

    db.system.users.find(

    {"roles.role":{$in:["dbOwner","userAdmin","userAdminAnyDatabase"]},"roles.db"

    : "admin" } )'
  remediation: 'If any accounts were listed with built in-roles:

    dbOwner

    userAdmin

    userAdminAnyDatabase

    in "admin" database role then drop them.'
  checks:
  - type: manual_review
    info: 'To check accounts with database roles scoped in "admin" database, use the following

      query:

      db.system.users.find(

      {"roles.role":{$in:["dbOwner","userAdmin","userAdminAnyDatabase"]},"roles.db"

      : "admin" } )'
    severity: medium
- id: '3.2'
  title: Ensure that role-based access control is enabled and configured appropriately
  scoring: manual
  profile:
  - Level 1- MongoDB
  description: Role-based access control (RBAC) is a method of regulating access to resources based on the roles of individual
    users within an enterprise. A user is granted one or more roles that determine the user’s access to database resources
    and operations. Outside of role assignments, the user has no access to the system. MongoDB can use RBAC to govern access
    to MongoDB systems. MongoDB does not enable authorization by default.
  rationale: When properly implemented, RBAC enables users to carry out a wide range of authorized tasks by dynamically regulating
    their actions according to flexible functions. This allows an organization to control employees’ access to all database
    tables through RBAC.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/tutorial/manage-users-and-roles/
  page_start: 30
  audit_raw: 'Connect to MongoDB with the appropriate privileges and run the following command:

    Identify users'' roles and privileges:

    > db.getUser()

    > db.getRole()

    Verify that the appropriate role or roles have been configured for each user.'
  remediation: '1. Establish roles for MongoDB.

    2. Assign the appropriate privileges to each role.

    3. Assign the appropriate users to each role.

    4. Remove any individual privileges assigned to users that are now addressed by

    the roles.

    5. See the reference below for more Information.'
  checks:
  - type: manual_review
    info: 'Connect to MongoDB with the appropriate privileges and run the following command:

      Identify users'' roles and privileges:

      > db.getUser()

      > db.getRole()

      Verify that the appropriate role or roles have been configured for each user.'
    severity: medium
- id: '3.3'
  title: Ensure that MongoDB is run using a non-privileged, dedicated service account
  scoring: manual
  profile:
  - Level 1- MongoDB
  description: The MongoDB service should not be run using a privileged account such as 'root' because this unnecessarily
    exposes the operating system to high risk.
  rationale: Using a non-privileged, dedicated service account restricts the database from accessing the critical areas of
    the operating system which are not required by the MongoDB. This will also mitigate the potential for unauthorized access
    via a compromised, privileged account on the operating system.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/tutorial/manage-users-and-roles/
  page_start: 32
  audit_raw: 'Run the following command to get listing of all mongo instances, the PID number, and

    the PID owner.

    ps -ef | grep -E "mongos|mongod"'
  remediation: '1. Create a dedicated user for performing MongoDB database activity.

    2. Set the Database data files, the keyfile, and the SSL private key files to only be

    readable by the mongod/mongos user.

    3. Set the log files to only be writable by the mongod/mongos user and readable

    only by root.'
  checks:
  - type: command
    command: ps -ef | grep -E "mongos|mongod"
    expected: ''
    severity: medium
    info: 'Run the following command to get listing of all mongo instances, the PID number, and

      the PID owner.

      ps -ef | grep -E "mongos|mongod"'
- id: '3.4'
  title: Ensure that each role for each MongoDB database is needed and grants only the necessary privileges
  scoring: manual
  profile:
  - Level 1- MongoDB
  description: Reviewing all roles periodically and eliminating unneeded roles as well as unneeded privileges from necessary
    roles helps minimize the privileges that each user has.
  rationale: Although role-based access control (RBAC) has many advantages for regulating access to resources, over time some
    roles may no longer be needed, and some roles may grant privileges that are no longer needed.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/reference/privilege-actions/#mongodbauthaction-revokeRole
  - 2. https://www.mongodb.com/docs/v7.0/core/authorization/#std-label-privileges
  page_start: 34
  audit_raw: "Perform the following command to view all roles on the database on which the\ncommand runs, including both built-in\
    \ and user-defined roles, as well as the privileges\ngranted by each role. Ensure that only necessary roles are listed\
    \ and only the\nnecessary privileges are listed for each role.\ndb.runCommand(\n {\n rolesInfo: 1,\n showPrivileges: true,\n\
    \ showBuiltinRoles: true\n }\n)"
  remediation: 'To revoke specified privileges from the user-defined role on the database where the

    command is run. The revokePrivilegesFromRole command has the following syntax:'
  checks:
  - type: manual_review
    info: "Perform the following command to view all roles on the database on which the\ncommand runs, including both built-in\
      \ and user-defined roles, as well as the privileges\ngranted by each role. Ensure that only necessary roles are listed\
      \ and only the\nnecessary privileges are listed for each role.\ndb.runCommand(\n {\n rolesInfo: 1,\n showPrivileges:\
      \ true,\n showBuiltinRoles: true\n }\n)"
    severity: medium
- id: '3.5'
  title: Review Superuser/Admin Roles
  scoring: manual
  profile:
  - Level 2 - MongoDB
  description: Roles provide several advantages that make it easier to manage privileges in a database system. Security administrators
    can control access to their databases in a way that mirrors the structure of their organizations (they can create roles
    in the database that map directly to the job functions in their organizations). The assignment of privileges is simplified.
    Instead of granting the same set of privileges to each individual user in a particular job function, the administrator
    can grant this set of privileges to a role representing that job function and then grant that role to each user in that
    job function.
  rationale: Reviewing the Superuser/Admin roles within a database helps minimize the possibility of privileged unwanted access.
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/core/security-user-defined-roles/
  - 2. https://www.mongodb.com/docs/v7.0/reference/method/#std-label-rolemanagement-methods
  page_start: 36
  audit_raw: 'Superuser roles provide the ability to assign any user any privilege on any database,

    which means that users with one of these roles can assign themselves any privilege on

    any database:

    db.runCommand( { rolesInfo: "dbOwner" } )

    db.runCommand( { rolesInfo: "userAdmin" } )

    db.runCommand( { rolesInfo: "userAdminAnyDatabase" } )

    Root role provides access to the operations and all the resources of the

    readWriteAnyDatabase, dbAdminAnyDatabase, userAdminAnyDatabase,

    clusterAdmin roles, restore combined.

    db.runCommand( { rolesInfo: "readWriteAnyDatabase" } )

    db.runCommand( { rolesInfo: "dbAdminAnyDatabase" } )

    db.runCommand( { rolesInfo: "userAdminAnyDatabase" } )

    db.runCommand( { rolesInfo: "clusterAdmin" } )

    Cluster Administration Roles are used for administering the whole system rather than

    just a single database.

    db.runCommand( { rolesInfo: "hostManager" } )'
  remediation: To remove a user from one or more roles on the current database.
  checks:
  - type: manual_review
    info: 'Superuser roles provide the ability to assign any user any privilege on any database,

      which means that users with one of these roles can assign themselves any privilege on

      any database:

      db.runCommand( { rolesInfo: "dbOwner" } )

      db.runCommand( { rolesInfo: "userAdmin" } )

      db.runCommand( { rolesInfo: "userAdminAnyDatabase" } )

      Root role provides access to the operations and all the resources of the

      readWriteAnyDatabase, dbAdminAnyDatabase, userAdminAnyDatabase,

      clusterAdmin roles, restore combined'
    severity: medium
- id: '4.1'
  title: Ensure legacy TLS protocols are disabled
  scoring: scored
  profile:
  - Level 2 - MongoDB
  description: Only modern TLS protocols should be enabled in MongoDB for all client connections and upstream connections.
    Removing legacy TLS and SSL protocols (SSL 3.0, TLS 1.0 and 1.1), and enabling emerging and stable TLS protocols (TLS
    1.2, and TLS 1.3), ensures users are able to take advantage of strong security capabilities and protects them from insecure
    legacy protocols.
  rationale: 'Why disable TLS 1.0: TLS 1.0 was deprecated from use when PCI DSS Compliance mandated that it not be used for
    any applications processing credit card numbers in June 2018. Why disable TLS 1.1: Because of the increased security associated
    with higher versions of TLS, TLS 1.0 should be disabled.'
  impact: ''
  references:
  - 1. https://www.mongodb.com/docs/v7.0/core/security-transport-encryption/
  page_start: 39
  audit_raw: "To verify that the server uses disables legacy TLS protocols you should check the\ndisabledProtocols directive,\
    \ run the following commands:\nmongod --config /etc/mongod.conf\nReview for disabledProtocols as part of the output shown\
    \ below:\nnet:\n tls:\n mode: requireTLS\n certificateKeyFile: /etc/ssl/mongodb.pem\n CAFile: /etc/ssl/caToValidateClientCertificates.pem\n\
    \ disabledProtocols: TLS1_0,TLS1_1"
  remediation: "Make changes to configuration file, to configure your mongod or mongos instance to\ndisable legacy protocols,\
    \ shut down the instance and update the configuration file with\nthe following setting:\nnet:\n tls:\n mode: requireTLS\n\
    \ certificateKeyFile: /etc/ssl/mongodb.pem\n CAFile: /etc/ssl/caToValidateClientCertificates.pem\n disabledProtocols:\
    \ TLS1_0,TLS1_1\nStart mongod or mongos instance with the configuration file.\nmongod --config /etc/mongod.conf"
  checks:
  - type: manual_review
    info: "To verify that the server uses disables legacy TLS protocols you should check the\ndisabledProtocols directive,\
      \ run the following commands:\nmongod --config /etc/mongod.conf\nReview for disabledProtocols as part of the output\
      \ shown below:\nnet:\n tls:\n mode: requireTLS\n certificateKeyFile: /etc/ssl/mongodb.pem\n CAFile: /etc/ssl/caToValidateClientCertificates.pem\n\
      \ disabledProtocols: TLS1_0,TLS1_1"
    severity: medium
- id: '4.2'
  title: Ensure Weak Protocols are Disabled
  scoring: scored
  profile:
  - Level 1- MongoDB
  description: Servers can be configured to disable specific TLS/SSL protocol versions which may be vulnerable to exploitation
    and/or lack features which improve the level of security as provided by newer versions of the protocol.
  rationale: The TLSv1.0 protocol is vulnerable to the BEAST attack when used in CBC mode (October 2011). Unfortunately, the
    TLSv1.0 uses CBC modes for all of the block mode ciphers, which only leaves the RC4 streaming cipher which is also weak
    and is not recommended. Therefore, it is recommended that the TLSv1.0 protocol be disabled. The TLSv1.1 protocol does
    not support Authenticated Encryption with Associated Data (AEAD) which is designed to simultaneously provide confidentiality,
    integrity, and authenticity. The NIST SP 800-52r2 guidelines for TLS configuration require that TLS 1.2 is configured
    with FIPS-based cipher suites be supported by all government TLS servers and clients and requires support of TLS 1.3 by
    January 1, 2024. A September 2018 IETF draft also depreciates the usage of TLSv1.0 and TLSv1.1 as shown in the references.
  impact: If an attempt to connect using a disabled protocol is made the connection attempt will fail and may have unanticipated
    impact on clients attempting to establish the connection.
  references:
  - 1. https://www.mongodb.com/docs/v7.0/reference/configuration-options/#mongodbsetting-net.ssl.disabledProtocols
  page_start: 41
  audit_raw: 'To verify that the server disable TLS v1.0 and v1.1, run one of the following commands:

    • On Ubuntu:

    cat /etc/mongod.conf | grep –A20 ‘net’ | grep –A10 ‘ssl’ | grep

    ‘disabledProtocols’

    • On Windows:

    type mongod.conf | findstr –A20 ‘net’ | findstr –A10 ‘ssl’ | findstr

    ‘disabledProtocols’

    If TLS1_0,TLS1_1 is not included in the string returned by either of these commands

    this is a fail.'
  remediation: "For mongod (“Primary daemon process for the MongoDB system”)\nIn the configuration file /etc/mongod.conf,\
    \ set the disabledProtocols option to to\ninclude TLS1_0,TLS1_1:\nnet:\n ssl:\n mode: requireSSL\n PEMKeyFile: /etc/ssl/mongodb.pem\n\
    \ CAFile: /etc/ssl/caToValidateClientCertificates.pem\n disabledProtocols: TLS1_0,TLS1_1\nAnd restart monogdb instance\
    \ with\nmongod --config /etc/mongod.conf\nOr\nmongod --sslDisabledProtocols `TLS1_0,TLS1_1"
  checks:
  - type: command
    command: cat /etc/mongod.conf | grep –A20 ‘net’ | grep –A10 ‘ssl’ | grep
    expected: 'To verify that the server disable TLS v1.0 and v1.1, run one of the following commands:'
    severity: medium
    info: 'To verify that the server disable TLS v1.0 and v1.1, run one of the following commands:

      • On Ubuntu:

      cat /etc/mongod.conf | grep –A20 ‘net’ | grep –A10 ‘ssl’ | grep

      ‘disabledProtocols’

      • On Windows:

      type mongod.conf | findstr –A20 ‘net’ | findstr –A10 ‘ssl’ | findstr

      ‘disabledProtocols’

      If TLS1_0,TLS1_1 is not included in the string returned by either of these commands

