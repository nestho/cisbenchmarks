    On Windows:

    type mongod.conf | findstr –A20 ‘net’ | findstr –A10 ‘tls’ | findstr ‘mode’'
  remediation: "Configure MongoDB servers to require the use of SSL or TLS to encrypt all MongoDB\nnetwork communications.\n\
    To implement SSL or TLS to encrypt all MongoDB network communication, perform the\nfollowing steps:\nFor mongod (“Primary\
