- id: '4.3'
  title: Ensure Encryption of Data in Transit TLS or SSL (Transport Encryption)
  scoring: scored
  profile:
  - Level 1- MongoDB
  description: 'Use TLS or SSL to protect all incoming and outgoing connections. This should include using TLS or SSL to encrypt
    communication between the mongod and mongos components of a MongoDB client as well as between all applications and MongoDB.
    MongoDB supports TLS/SSL (Transport Layer Security/Secure Sockets Layer) to encrypt all of MongoDB’s network traffic.
    TLS/SSL ensures that MongoDB network traffic is only readable by the intended client. Please note: As of MongoDB version
    4.2 SSL has been deprecated. Also, starting in MongoDB version 4.0, MongoDB disables support for TLS 1.0 encryption on
    systems where TLS 1.1+ is available.'
  rationale: This prevents sniffing of cleartext traffic between MongoDB components or performing a man-in-the-middle attack
    for MongoDB.
  impact: ''
  references:
