  description: The Federal Information Processing Standard (FIPS) is a computer security standard used to certify software
    modules and libraries that encrypt and decrypt data securely. You can configure MongoDB to run with a FIPS 140-2 certified
    library for OpenSSL. FIPS is a property of the encryption system and not the access control system. However, the environment
    requires FIPS compliant encryption and access control. Organizations must ensure that the access control system uses only
