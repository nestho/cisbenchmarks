  impact: ''
  references: []
  page_start: 193
  audit_raw: "Run the following commands and verify output matches:\n# sysctl net.ipv4.ip_forward\nnet.ipv4.ip_forward = 0\n\
    # grep -E -s \"^\\s*net\\.ipv4\\.ip_forward\\s*=\\s*1\" /etc/sysctl.conf\n/etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf\
    \ /run/sysctl.d/*.conf\nNo value should be returned\nIF IPv6 is enabled:\nRun the following commands and verify output\
    \ matches:\n# sysctl net.ipv6.conf.all.forwarding\nnet.ipv6.conf.all.forwarding = 0\n# grep -E -s \"^\\s*net\\.ipv6\\\
    .conf\\.all\\.forwarding\\s*=\\s*1\" /etc/sysctl.conf\n/etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf\n\
    No value should be returned\nOR\nVerify that IPv6 is disabled:\nRun the following script. Output will confirm if IPv6\
    \ is disabled on the system.\n#!/bin/bash\n[ -n \"$passing\" ] && passing=\"\"\n[ -z \"$(grep \"^\\s*linux\" /boot/grub2/grub.cfg\
    \ | grep -v ipv6.disabled=1)\" ]\n&& passing=\"true\"\ngrep -Eq \"^\\s*net\\.ipv6\\.conf\\.all\\.disable_ipv6\\s*=\\s*1\\\
    b(\\s+#.*)?$\"\n/etc/sysctl.conf \\\n/etc/sysctl.d/*.conf && grep -Eq\n\"^\\s*net\\.ipv6\\.conf\\.default\\.disable_ipv6\\\
    s*=\\s*1\\b(\\s+#.*)?$\" \\\n/etc/sysctl.conf /etc/sysctl.d/*.conf && sysctl\nnet.ipv6.conf.all.disable_ipv6 | \\\ngrep\
    \ -Eq \"^\\s*net\\.ipv6\\.conf\\.all\\.disable_ipv6\\s*=\\s*1\\b(\\s+#.*)?$\" && \\\nsysctl net.ipv6.conf.default.disable_ipv6\
    \ | \\\ngrep -Eq \"^\\s*net\\.ipv6\\.conf\\.default\\.disable_ipv6\\s*=\\s*1\\b(\\s+#.*)?$\" &&\npassing=\"true\"\nif\
    \ [ \"$passing\" = true ] ; then\n echo \"IPv6 is disabled on the system\"\nelse\n echo \"IPv6 is enabled on the system\"\
    \nfi\n194 | P a g e"
  remediation: 'Run the following commands to restore the default parameters and set the active kernel

    parameters:

    # grep -Els "^\s*net\.ipv4\.ip_forward\s*=\s*1" /etc/sysctl.conf

