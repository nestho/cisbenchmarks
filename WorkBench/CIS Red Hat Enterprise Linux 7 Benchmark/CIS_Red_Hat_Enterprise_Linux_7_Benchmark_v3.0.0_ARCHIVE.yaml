  description: 'Unconfined processes run in unconfined domains Note: Occasionally certain daemons such as backup or centralized
    management software may require running unconfined. Any such software should be carefully analyzed and documented before
    such an exception is made.'
  rationale: For unconfined processes, SELinux policy rules are applied, but policy rules exist that allow processes running
    in unconfined domains almost all access. Processes running in unconfined domains fall back to using DAC rules exclusively.
