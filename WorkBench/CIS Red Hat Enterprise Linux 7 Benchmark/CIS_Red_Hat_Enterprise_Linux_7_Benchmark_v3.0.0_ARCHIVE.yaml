- id: 4.2.4
  title: Ensure logrotate is configured
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: 'The system includes the capability of rotating log files regularly to avoid filling up the system with logs
    or making the logs unmanageably large. The file /etc/logrotate.d/syslog is the configuration file used to rotate log files
    created by syslog or rsyslog. Note: If no maxage setting is set for logrotate a situation can occur where logrotate is
    interrupted and fails to delete rotated logfiles. It is recommended to set this to a value greater than the longest any
    log file should exist on your system to ensure that any such logfile is removed but standard rotation settings are not
    overridden.'
  rationale: By keeping the log files smaller and more manageable, a system administrator can easily archive these files to
    another system and spend less time looking through inordinately large log files.
  impact: ''
  references: []
  page_start: 374
  audit_raw: 'Review /etc/logrotate.conf and /etc/logrotate.d/* and verify logs are rotated

    according to site policy.'
  remediation: 'Edit /etc/logrotate.conf and /etc/logrotate.d/* to ensure logs are rotated according

    to site policy.'
  checks:
  - type: manual_review
    info: 'Review /etc/logrotate.conf and /etc/logrotate.d/* and verify logs are rotated

      according to site policy.'
    severity: medium
