  title: Ensure separate partition exists for /var/tmp
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: 'The /var/tmp directory is a world-writable directory used for temporary storage by all users and some applications
    and is intended for temporary files that are preserved across reboots. Notes:  tmpfs should not be used for /var/tmp/
     tmpfs is a temporary filesystem that resides in memory and/or swap partition(s).  Files in tmpfs are automatically
    cleared at each bootup.'
  rationale: Since the /var/tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is
    not bound to a separate partition. In addition, making /var/tmp its own file system allows an administrator to set the
    noexec option on the mount, making /var/tmp useless for an attacker to install executable code. It would also prevent
    an attacker from establishing a hardlink to a system setuid program and wait for it to be updated. Once the program was
    updated, the hardlink would be broken and the attacker would have his own copy of the program. If the program happened
    to have a security vulnerability, the attacker could continue to exploit the known flaw.
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
