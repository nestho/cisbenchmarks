- id: 5.3.2
  title: Ensure lockout for failed password attempts is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'Lock out users after n unsuccessful consecutive login attempts. These settings are commonly configured with
    the pam_faillock.so module. Some environments may continue using the pam_tally2.so module, where this older method may
    simplify automation in mixed environments. Set the lockout number in deny= to the policy in effect at your site. unlock_time=_n_
    is the number of seconds the account remains locked after the number of attempts configured in deny=_n_ has been met.
    Notes:  Additional module options may be set, recommendation only covers those listed here.  When modifying authentication
    configuration using the authconfig utility, the systemauth and password-auth files are overwritten with the settings from
    the authconfig utility. This can be avoided by creating symbolic links in place of the configuration files, which authconfig
    recognizes and does not overwrite. These symbolic links are the default for Fedora 19 derived distributions.  Use of
    the "audit" keyword may log credentials in the case of user error during authentication. This risk should be evaluated
    in the context of the site policies of your organization.  If a user has been locked out because they have reached the
    maximum consecutive failure count defined by deny= in the pam_faillock.so or the pam_tally2.so module, the user can be
    unlocked by issuing following commands. This command sets the failed count to 0, effectively unlocking the user. o If
    pam_faillock.so is used: o # faillock --user <username> --reset o If pam_tally2.so is used: o # pam_tally2 -u <username>
    --reset 438 | P a g e'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/security_guide
  page_start: 438
  audit_raw: 'Verify password lockouts are configured. Ensure that the deny=_n_ follows local site policy.

    This should not exceed deny=5.

    IF pam_failock.so is used:

    Run the following commands:

    # grep -E ''^\s*auth\s+\S+\s+pam_(faillock|unix)\.so'' /etc/pam.d/system-auth

    /etc/pam.d/password-auth

    Verify the output includes the following lines:

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth

    silent audit deny=5 unlock_time=900

