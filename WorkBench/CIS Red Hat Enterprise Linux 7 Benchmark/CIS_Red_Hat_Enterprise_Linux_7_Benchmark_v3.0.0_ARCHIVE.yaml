- id: 1.1.6
  title: Ensure /dev/shm is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: '/dev/shm is a traditional shared memory concept. One program will create a memory portion, which other processes
    (if permitted) can access. Mounting tmpfs at /dev/shm is handled automatically by systemd. Notes:  An entry for /dev/shm
    in /etc/fstab will take precedence.  tmpfs can be resized using the size={size} parameter in /etc/fstab. If we don''t
    specify the size, it will be half the RAM. Resize tmpfs example: tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid,size=2G
    0 0'
  rationale: Any user can upload and execute files inside the /dev/shm similar to the /tmp partition. Configuring /dev/shm
    allows an administrator to set the noexec option on the mount, making /dev/shm useless for an attacker to install executable
    code. It would also prevent an attacker from establishing a hardlink to a system setuid program and wait for it to be
    updated. Once the program was updated, the hardlink would be broken and the attacker would have his own copy of the program.
    If the program happened to have a security vulnerability, the attacker could continue to exploit the known flaw. 40 |
    P a g e
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Run the following command and verify output shows /dev/shm is mounted:

    # mount | grep -E ''\s/dev/shm\s''

    tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev,noexec,relatime,seclabel)

    Run the following command and verify an entry for /dev/shm exists in /etc/fstab:

    # grep -E ''\s/dev/shm\s'' /etc/fstab

    tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid 0 0'
  remediation: 'Edit /etc/fstab and add or edit the following line:

    tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid,seclabel 0 0

    Run the following command to remount /dev/shm:

    # mount -o remount,noexec,nodev,nosuid /dev/shm'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/dev/shm\s'''
    expected: ''
    severity: medium
    info: 'Run the following command and verify output shows /dev/shm is mounted:

      # mount | grep -E ''\s/dev/shm\s''

      tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev,noexec,relatime,seclabel)

      Run the following command and verify an entry for /dev/shm exists in /etc/fstab:

      # grep -E ''\s/dev/shm\s'' /etc/fstab

      tmpfs /dev/shm tmpfs defaults,noexec,nodev,nosuid 0 0'
