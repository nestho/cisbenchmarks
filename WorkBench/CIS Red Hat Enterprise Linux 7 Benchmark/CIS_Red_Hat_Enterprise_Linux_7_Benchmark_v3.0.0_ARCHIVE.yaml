- id: 4.1.15
  title: Ensure system administrator actions (sudolog) are collected
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: 'Monitor the sudo log file. The sudo log file is configured in /etc/sudoers or a file in /etc/sudoers.d. If
    the system has been properly configured to disable the use of the su command and force all administrators to have to log
    in first and then use sudo to execute privileged commands, then all administrator commands will be logged to to the sudo
    log file. Any time a command is executed, an audit event will be triggered as the sudo log file will be opened for write
    and the executed administration command will be written to the log. Notes:  The system must be configured with su disabled
    (See Item 5.6 Ensure access to the su command is restricted) to force all command execution through sudo. This will not
    be effective on the console, as administrators can log in as root.  Reloading the auditd config to set active settings
    may require a system reboot.'
  rationale: Changes in /var/log/sudo.log indicate that an administrator has executed a command or the log file itself has
    been tampered with. Administrators will want to correlate the events written to the audit trail with the records written
    to /var/log/sudo.log to verify if unauthorized commands have been executed. 346 | P a g e
  impact: ''
  references: []
