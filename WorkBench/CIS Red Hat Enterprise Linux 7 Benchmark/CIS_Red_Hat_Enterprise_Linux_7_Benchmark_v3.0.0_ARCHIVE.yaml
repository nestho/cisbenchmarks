  title: Ensure IP forwarding is disabled
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The net.ipv4.ip_forward and net.ipv6.conf.all.forwarding flags are used to tell the system whether it can forward
    packets or not.
  rationale: Setting the flags to 0 ensures that a system with multiple interfaces (for example, a hard proxy), will never
