- id: '5.6'
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo, which allows for more granular control over privileged access. Normally, the su command can be executed by any user.
    By uncommenting the pam_wheel.so statement in /etc/pam.d/su, the su command will only allow users in a specific groups
    to execute su. This group should be empty to reinforce the use of sudo for privileged access.
  rationale: Restricting the use of su , and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo , whereas su can only record that a user executed the su program.
  impact: ''
  references: []
  page_start: 469
  audit_raw: 'Run the following command and verify the output matches the line:

    # grep -E

    ''^\s*auth\s+required\s+pam_wheel\.so\s+(\S+\s+)*use_uid\s+(\S+\s+)*group=\S+\

    s*(\S+\s*)*(\s+#.*)?$'' /etc/pam.d/su

    auth required pam_wheel.so use_uid group=<group_name>

    Run the following command and verify that the group specified in <group_name> contains

    no users:

    # grep <group_name> /etc/group

    <group_name>:x:<GID>:

    There should be no users listed after the Group ID field.

    469 | P a g e'
  remediation: 'Create an empty group that will be specified for use of the su command. The group should

    be named according to site policy.

    Example:

    # groupadd sugroup

    Add the following line to the /etc/pam.d/su file, specifying the empty group:

    auth required pam_wheel.so use_uid group=sugroup'
  checks:
  - type: manual_review
    info: 'Run the following command and verify the output matches the line:

      # grep -E

      ''^\s*auth\s+required\s+pam_wheel\.so\s+(\S+\s+)*use_uid\s+(\S+\s+)*group=\S+\

      s*(\S+\s*)*(\s+#.*)?$'' /etc/pam.d/su

      auth required pam_wheel.so use_uid group=<group_name>

      Run the following command and verify that the group specified in <group_name> contains

      no users:

      # grep <group_name> /etc/group

      <group_name>:x:<GID>:

      There should be no users listed after the Group ID field.

      469 | P a g e'
    severity: medium
- id: 6.1.1
  title: Audit system file permissions
  scoring: manual
  profile:
  - Level 2
  - Level 2
  description: 'The RPM package manager has a number of useful options. One of these, the -V option, can be used to verify
    that system packages are correctly installed. The V option can be used to verify a particular package or to verify all
    system packages. If no output is returned, the package is installed correctly. The following table describes the meaning
    of output from the verify option: Code Meaning S File size differs. M File mode differs (includes permissions and file
    type). 5 The MD5 checksum differs. D The major and minor version numbers differ on a device file. L A mismatch occurs
    in a link. U The file ownership differs. G The file group owner differs. T The file time (mtime) differs. The rpm -qf
    command can be used to determine which package a particular file belongs to. For example the following commands determines
    which package the /etc/ssh/sshd_config file belongs to: # rpm -qf /etc/ssh/sshd_config openssh-server-7.4p1-21.el7.x86_64
    To verify the settings for the package that controls the /bin/bash file, run the following: # rpm -V openssh-server-7.4p1-21.el7.x86_64
    473 | P a g e Note: You can feed the output of the rpm -qf command to the rpm -V command: # rpm -V $(rpm -qf /etc/ssh/sshd_config)
    Notes:  Since packages and important files may change with new updates and releases, it is recommended to verify everything,
    not just a finite list of files. This can be a time consuming task and results may depend on site policy therefore it
    is not a scorable benchmark item, but is provided for those interested in additional security measures.  Some of the
    recommendations of this benchmark alter the state of files audited by this recommendation. The audit command will alert
    for all changes to a file permissions even if the new state is more secure than the default.'
  rationale: It is important to confirm that packaged system files and directories are maintained with the permissions they
    were intended to have from the OS distributor or in accordance with local site policy.
  impact: ''
  references:
  - 1. https://docs.fedoraproject.org/en-US/fedora/rawhide/system-administratorsguide/RPM/#s2-rpm-verifying
  page_start: 473
  audit_raw: 'Run the following command to review all installed packages. Note that this may be very

    time consuming and may be best scheduled via the cron utility. It is recommended that the

    output of this command be redirected to a file that can be reviewed later. This command

    will ignore configuration files due to the extreme likelihood that they will change.

    # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c'
  remediation: 'Investigate the results to ensure any discrepancies found are understood and support

    proper secure operation of the system.'
  checks:
  - type: command
    command: '# rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c'
    expected: ''
    severity: medium
    info: 'Run the following command to review all installed packages. Note that this may be very

      time consuming and may be best scheduled via the cron utility. It is recommended that the

      output of this command be redirected to a file that can be reviewed later. This command

      will ignore configuration files due to the extreme likelihood that they will change.

      # rpm -Va --nomtime --nosize --nomd5 --nolinkto > '
