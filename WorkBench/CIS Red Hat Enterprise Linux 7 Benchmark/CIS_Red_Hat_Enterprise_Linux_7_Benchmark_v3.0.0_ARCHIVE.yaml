- id: 5.4.4
  title: Ensure default user shell timeout is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'TMOUT is an environmental setting that determines the timeout of a shell in seconds.  TMOUT=n - Sets the
    shell timeout to n seconds. A setting of TMOUT=0 disables timeout.  readonly TMOUT- Sets the TMOUT environmental variable
    as readonly, preventing unwanted modification during run-time.  export TMOUT - exports the TMOUT variable System Wide
    Shell Configuration Files:  /etc/profile - used to set system wide environmental variables on users shells. The variables
    are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for
    all shell users of the system. Is only executed for interactive login shells, or shells executed with the --login parameter.
     /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration
    in a shell script within /etc/profile.d to set your own system wide environmental variables.  /etc/bashrc - System wide
    version of .bashrc. In Fedora derived distributions, etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell, but
    redirects output to /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bashrc.'
  rationale: 'Setting a timeout value reduces the window of opportunity for unauthorized user access to another user''s shell
    session that has been left unattended. It also ends the inactive session and releases the resources associated with that
    session. Notes:  The audit and remediation in this recommendation apply to bash and shell. If other shells are supported
    on the system, it is recommended that their configuration files are also checked. Other methods of setting a timeout exist
    for other shells not covered here.  Ensure that the timeout conforms to your local policy. 461 | P a g e'
  impact: ''
  references: []
  page_start: 461
  audit_raw: 'Run the following commands to verify that TMOUT is configured to include a timeout of no

    more than 900 seconds, to be readonly, and to be exported:

    Run the following command to verify that TMOUT is configured in: a .sh file in

    /etc/profile.d/, in /etc/profile, or in /etc/bashrc:

    # for f in /etc/bashrc /etc/profile /etc/profile.d/*.sh ; do grep -Eq

    ''(^|^[^#]*;)\s*(readonly|export(\s+[^$#;]+\s*)*)?\s*TMOUT=(900|[1-8][0-9][09]|[1-9][0-9]|[1-9])\b'' $f && grep -Eq ''(^|^[^#]*;)\s*readonly\s+TMOUT\b''
    $f

    && grep -Eq ''(^|^[^#]*;)\s*export\s+([^$#;]+\s+)*TMOUT\b'' $f && echo "TMOUT

    correctly configured in file: $f"; done

    TMOUT correctly configured in file: <name of file where TMOUT is configured>

    Run the following command to verify that TMOUT is not being changed to a longer timeout:

    # grep -P ''^\s*([^$#;]+\s+)*TMOUT=(9[0-9][1-9]|0+|[19]\d{3,})\b\s*(\S+\s*)*(\s+#.*)?$'' /etc/profile /etc/profile.d/*.sh

    /etc/bashrc

    Nothing should be returned'
  remediation: 'Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/

    directory and remove or edit all TMOUT=_n_ entries to follow local site policy. TMOUT should

    not exceed 900 or be equal to 0.

    Configure TMOUT in one of the following files:

     A file in the /etc/profile.d/ directory ending in .sh

    

    /etc/profile

    

    /etc/bashrc

    TMOUT configuration examples:

     As multiple lines:

    TMOUT=900

    readonly TMOUT

    export TMOUT

     As a single line:

    readonly TMOUT=900 ; export TMOUT

    462 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following commands to verify that TMOUT is configured to include a timeout of no

      more than 900 seconds, to be readonly, and to be exported:

      Run the following command to verify that TMOUT is configured in: a .sh file in

      /etc/profile.d/, in /etc/profile, or in /etc/bashrc:

      # for f in /etc/bashrc /etc/profile /etc/profile.d/*.sh ; do grep -Eq

      ''(^|^[^#]*;)\s*(readonly|export(\s+[^$#;]+\s*)*)?\s*TMOUT=(900|[1-8][0-9][09]|[1-9][0-9]|[1-9])\b'' $f && grep -Eq
      ''(^|^[^#]*;)\s*readonly\s+TMOUT\b'' $'
    severity: medium
- id: 5.4.5
  title: Ensure default user umask is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The user file-creation mode mask (umask) is use to determine the file permission for newly created directories
    and files. In Linux, the default permissions for any newly created directory is 0777 (rwxrwxrwx), and for any newly created
    file it is 0666 (rw-rw-rw-). The umask modifies the default Linux permissions by restricting (masking) these permissions.
    The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file
    mode. umask can be set with either octal or Symbolic values  Octal (Numeric) Value - Represented by either three or four
    digits. ie umask 0027 or umask 027. If a four digit umask is used, the first digit is ignored. The remaining three digits
    effect the resulting permissions for user, group, and world/other respectively.  Symbolic Value - Represented by a comma
    separated list for User u, group g, and world/other o. The permissions listed are not masked by umask. ie a umask set
    by umask u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created directory
    with file mode drwxr-x--- and a newly created file with file mode rw-r-----. The default umask is set in a System Wide
    Shell Configuration File. The user creating the directories or files has the discretion of changing the permissions via
    the chmod command, or choosing a different default umask by adding the umask command into a User Shell Configuration File,
    ( .bash_profile or .bashrc), in their home directory. 464 | P a g e System Wide Shell Configuration Files:  /etc/profile
    - used to set system wide environmental variables on users shells. The variables are sometimes the same ones that are
    in the .bash_profile, however this file is used to set an initial PATH or PS1 for all shell users of the system. Is only
    executed for interactive login shells, or shells executed with the --login parameter.  /etc/profile.d - /etc/profile
    will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration in a shell script within
    /etc/profile.d to set your own system wide environmental variables.  /etc/bashrc - System wide version of .bashrc. In
    Fedora derived distributions, etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell, but redirects output to
    /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bashrc. User Shell
    Configuration Files:  ~/.bash_profile - Is executed to configure your shell before the initial command prompt. Is only
    read by login shells.  ~/.bashrc - Is executed for interactive shells. only read by a shell that''s both interactive
    and non-login'
  rationale: 'Setting a secure default value for umask ensures that users make a conscious choice about their file permissions.
    A permissive umask value could result in directories or files with excessive permissions that can be read and/or written
    to by unauthorized users. Notes:  The audit and remediation in this recommendation apply to bash and shell. If other
    shells are supported on the system, it is recommended that their configuration files also are checked.  Other methods
    of setting a default user umask exist however the shell configuration files are the last run and will override other settings
    if they exist, therefor our recommendation is to configure in the shell configuration files.  If other methods are in
    use in your environment they should be audited and the shell configs should be verified to not override. 465 | P a g e'
  impact: ''
  references: []
  page_start: 464
  audit_raw: 'Run the following commands to verify:

     No System Wide umask is set that allows for a newly created directories''s

    permissions to be less restrictive than 750 (drwxr-x---) or a newly created file''s

    permissions to be less restrictive than 640 (rw-r-----). (umask 027 or umask

    u=rwx,g=rx,o=)

     The default System Wide umask is set to enforce a newly created directories''s

    permissions to be 750 (drwxr-x---), and a newly created file''s permissions be 640

    (rw-r-----). (umask 027 or umask u=rwx,g=rx,o=) or more restrictive.

    Run the following commands to verify and System Wide umask is: 027, u=rwx,g=rx,o=, or

    more restrictive:

    # grep -Ev ''^\s*umask\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\s*(\s*#.*)?$''

    /etc/profile /etc/profile.d/*.sh /etc/bashrc | grep -E ''(^|^[^#]*)umask''

    Nothing should be returned

    Run the following command to verify that a System Wide Default umask of 027,

    u=rwx,g=rx,o=, or more restrictive is set:

    # grep -E ''^\s*umask\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\s*(\s*#.*)?$''

    /etc/profile /etc/profile.d/*.sh /etc/bashrc

    At least one line should be returned.

    Example:

    /etc/profile.d/umask.sh:umask 027

    466 | P a g e'
  remediation: 'Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/ directory

    and remove or edit all umask entries to follow local site policy. Any remaining entries

    should be: umask 027, umask u=rwx,g=rx,o= or more restrictive.

    Configure umask in one of the following files:

     A file in the /etc/profile.d/ directory ending in .sh

     /etc/profile

     /etc/bashrc

    Example:

    # vi /etc/profile.d/set_umask.sh

    umask 027'
  checks:
  - type: command
    command: /etc/profile /etc/profile.d/*.sh /etc/bashrc | grep -E '(^|^[^#]*)umask'
    expected: Run the following command to verify that a System Wide Default umask of 027,
    severity: medium
    info: 'Run the following commands to verify:

       No System Wide umask is set that allows for a newly created directories''s

      permissions to be less restrictive than 750 (drwxr-x---) or a newly created file''s

      permissions to be less restrictive than 640 (rw-r-----). (umask 027 or umask

      u=rwx,g=rx,o=)

       The default System Wide umask is set to enforce a newly created directories''s

      permissions to be 750 (drwxr-x-'
