- id: 1.1.1.4
  title: Ensure mounting of FAT filesystems is limited
  scoring: manual
  profile:
  - Level 2
  - Level 2
  description: The FAT filesystem format is primarily used on older windows systems and portable USB drives or flash modules.
    It comes in three types FAT12 , FAT16 , and FAT32 all of which are supported by the vfat kernel module.
  rationale: 'Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it. Notes:  The FAT filesystem format is used by UEFI systems for the EFI boot partition.
    Disabling the vfat module can prevent boot on UEFI systems.  FAT filesystems are often used on portable USB sticks and
    other flash media which are commonly used to transfer files between workstations, removing VFAT support may prevent the
    ability to transfer files in this way. 27 | P a g e'
  impact: The FAT filesystem format is used by UEFI systems for the EFI boot partition. Disabling the vfat module can prevent
    boot on UEFI systems. FAT filesystems are often used on portable USB sticks and other flash media which are commonly used
    to transfer files between workstations, removing VFAT support may prevent the ability to transfer files in this way.
  references: []
  page_start: 27
  audit_raw: 'If utilizing UEFI the FAT filesystem format is required. If this case, ensure that the FAT

    filesystem is only used where appropriate

    Run the following command

    grep -E -i ''\svfat\s'' /etc/fstab

    And review that any output is appropriate for your environment

    If not utilizing UEFI

    Run the following commands and verify the output is as indicated:

    # modprobe -n -v fat | grep -E ''(fat|install)''

    install /bin/true

    # lsmod | grep fat

    <No output>

    # modprobe -n -v vfat | grep -E ''(vfat|install)''

    install /bin/true

    # lsmod | grep vfat

    <No output>

    # modprobe -n -v msdos | grep -E ''(msdos|install)''

    install /bin/true

    # lsmod | grep msdos

    <No output>

    28 | P a g e'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf and add the

    following lines:

    Example: vim /etc/modprobe.d/fat.conf

    install fat /bin/true

    install vfat /bin/true

    install msdos /bin/true

    Run the following commands to unload the msdos, vfat, and fat modules:

    # rmmod msdos

    # rmmod vfat

    # rmmod fat'
  checks:
  - type: command
    command: 'grep -E -i ''\svfat\s'' /etc/fstab && # modprobe -n -v fat | grep -E ''(fat|install)'' && # lsmod | grep fat
      && # modprobe -n -v vfat | grep -E ''(vfat|install)'' && # lsmod | grep vfat && # modprobe -n -v msdos | grep -E ''(msdos|install)''
      && # lsmod | grep msdos'
    expected: ''
    severity: medium
    info: 'If utilizing UEFI the FAT filesystem format is required. If this case, ensure that the FAT

      filesystem is only used where appropriate

      Run the following command

      grep -E -i ''\svfat\s'' /etc/fstab

      And review that any output is appropriate for your environment

      If not utilizing UEFI

      Run the following commands and verify the output is as indicated:

      # modprobe -n -v fat | grep -E ''(fat|install)''

      install /b'
- id: 1.1.2
  title: Ensure /tmp is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
    Notes:  If an entry for /tmp exists in /etc/fstab it will take precedence over entries in the tmp.mount file.  tmpfs
    can be resized using the size={size} parameter in /etc/fstab or on the Options line in the tmp.mount file. If we don''t
    specify the size, it will be half the RAM. Resize tmpfs examples:  /etc/fstab tmpfs /tmp tmpfs rw,noexec,nodev,nosuid,size=2G
    0 0  tmp.mount [Mount] What=tmpfs Where=/tmp Type=tmpfs Options=mode=1777,strictatime,size=2G,noexec,nodev,nosuid 30
    | P a g e'
  rationale: Making /tmp its own file system allows an administrator to set the noexec option on the mount, making /tmp useless
    for an attacker to install executable code. It would also prevent an attacker from establishing a hardlink to a system
    setuid program and wait for it to be updated. Once the program was updated, the hardlink would be broken and the attacker
    would have his own copy of the program. If the program happened to have a security vulnerability, the attacker could continue
    to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating a separate partition
    for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a default installation a disk-based /tmp will essentially have the whole disk available, as it only creates a single
    / partition. On the other hand, a RAM-based /tmp as with tmpfs will almost certainly be much smaller, which can lead to
    applications filling up the filesystem much more easily.
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  page_start: 30
  audit_raw: "Run the following command and verify output shows /tmp is mounted:\n# mount | grep -E '\\s/tmp\\s'\ntmpfs on\
    \ /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)\nIf /etc/fstab is used:\n Run the following command and verify that\
    \ tmpfs has been mounted to, or a system\npartition has been created for /tmp\n # grep -E '\\s/tmp\\s' /etc/fstab | grep\
    \ -E -v '^\\s*#'\n tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 0\nOR If systemd tmp.mount file is used:\n Run the\
    \ following command and verify that tmp.mount is enabled:\n # systemctl is-enabled tmp.mount\n enabled\n31 | P a g e"
  remediation: "Create or update an entry for /tmp in either /etc/fstab OR in a systemd tmp.mount file:\nIf /etc/fstab is\
    \ used:\n Configure /etc/fstab as appropriate.\n Example:\n tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime\
    \ 0 0\n Run the following command to remount /tmp\n # mount -o remount,noexec,nodev,nosuid /tmp\nOR\nIf systemd tmp.mount\
    \ file is used:\n Run the following command to create the file /etc/systemd/system/tmp.mount if it\ndoesn't exist:\n\
    \ # [ ! -f /etc/systemd/system/tmp.mount ] && cp -v\n/usr/lib/systemd/system/tmp.mount /etc/systemd/system/\n Edit the\
    \ file /etc/systemd/system/tmp.mount:\n [Mount]\n What=tmpfs\n Where=/tmp\n Type=tmpfs\n Options=mode=1777,strictatime,noexec,nodev,nosuid\n\
     Run the following command to reload the systemd daemon:\n # systemctl daemon-reload\n Run the following command to\
    \ unmask tmp.mount:\n # systemctl unmask tmp.mpunt\n Run the following command to enable and start tmp.mount:\n # systemctl\
    \ enable --now tmp.mount\n32 | P a g e"
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'' && # grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#'''
    expected:  Run the following command and verify that tmpfs has been mounted to, or a system
    severity: medium
    info: "Run the following command and verify output shows /tmp is mounted:\n# mount | grep -E '\\s/tmp\\s'\ntmpfs on /tmp\
      \ type tmpfs (rw,nosuid,nodev,noexec,relatime)\nIf /etc/fstab is used:\n Run the following command and verify that\
      \ tmpfs has been mounted to, or a system\npartition has been created for /tmp\n # grep -E '\\s/tmp\\s' /etc/fstab |\
      \ grep -E -v '^\\s*#'\n tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 "
- id: 1.1.3
  title: Ensure noexec option set on /tmp partition
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The noexec mount option specifies that the filesystem cannot contain executable binaries.
  rationale: Since the /tmp filesystem is only intended for temporary file storage, set this option to ensure that users cannot
    run executable binaries from /tmp .
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Verify that the noexec option is set if a /tmp partition exists

    Run the following command and verify that nothing is returned:

    # mount | grep -E ''\s/tmp\s'' | grep -v noexec

    34 | P a g e'
  remediation: 'Edit the /etc/fstab file OR the /etc/systemd/system/local-fs.target.wants/tmp.mount

    file:

    IF /etc/fstab is used to mount /tmp

    Edit the /etc/fstab file and add noexec to the fourth field (mounting options) for the /tmp

    partition. See the fstab(5) manual page for more information.

    Run the following command to remount /tmp :

    # mount -o remount,noexec /tmp

    OR

    IF systemd is used to mount /tmp:

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to add noexec to the /tmp

    mount options:

    [Mount]

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Run the following command to restart the systemd daemon:

    # systemctl daemon-reload

    Run the following command to restart tmp.mount

    # systemctl restart tmp.mount'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'' | grep -v noexec'
    expected: Verify that the noexec option is set if a /tmp partition exists
    severity: medium
    info: 'Verify that the noexec option is set if a /tmp partition exists

      Run the following command and verify that nothing is returned:

      # mount | grep -E ''\s/tmp\s'' | grep -v noexec

      34 | P a g e'
