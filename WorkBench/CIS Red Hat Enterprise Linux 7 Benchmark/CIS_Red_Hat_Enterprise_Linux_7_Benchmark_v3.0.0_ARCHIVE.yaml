- id: 4.2.1.5
  title: Ensure rsyslog is configured to send logs to a remote log host
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The rsyslog utility supports the ability to send logs it gathers to a remote log host running syslogd(8) or
    to receive messages from remote hosts, reducing administrative overhead. Note: The double "at" sign (@@) directs rsyslog
    to use TCP to send log messages to the server, which is a more reliable transport mechanism than the default UDP protocol.'
  rationale: Storing log data on a remote host protects log integrity from local attacks. If an attacker gains root access
    on the local system, they could tamper with or remove log data that is stored on the local system
  impact: ''
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  page_start: 362
  audit_raw: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that logs are

    sent to a central host (where loghost.example.com is the name of your central log host):

    # grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    *.* @@loghost.example.com'
  remediation: 'Edit the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and add the following line

    (where loghost.example.com is the name of your central log host).

    *.* @@loghost.example.com

    Run the following command to reload the rsyslogd configuration:

    # systemctl restart rsyslog

    362 | P a g e'
  checks:
  - type: manual_review
    info: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that logs are

      sent to a central host (where loghost.example.com is the name of your central log host):

      # grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      *.* @@loghost.example.com'
    severity: medium
- id: 4.2.1.6
  title: Ensure remote rsyslog messages are only accepted on designated log hosts.
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: 'By default, rsyslog does not listen for log messages coming in from remote systems. The ModLoad tells rsyslog
    to load the imtcp.so module so it can listen over a network via TCP. The InputTCPServerRun option instructs rsyslogd to
    listen on the specified TCP port. Note: The $ModLoad imtcp line can have the .so extension added to the end of the module,
    or use the full path to the module.'
  rationale: The guidance in the section ensures that remote log hosts are configured to only accept rsyslog data from hosts
    within the specified domain and that those systems that are not designed to be log hosts do not accept any remote rsyslog
    messages. This provides protection from spoofed log data and ensures that system administrators are reviewing reasonably
    complete syslog data in a central location.
  impact: ''
  references:
  - 1. See the rsyslog(8) man page for more information.
  page_start: 364
  audit_raw: 'Run the following commands and verify the resulting lines are uncommented on

    designated log hosts and commented or removed on all others:

    # grep ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    $ModLoad imtcp

    # grep ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    $InputTCPServerRun 514

    364 | P a g e'
  remediation: 'For hosts that are designated as log hosts, edit the /etc/rsyslog.conf file and uncomment or add the following
    lines:

    $ModLoad imtcp

    $InputTCPServerRun 514

    For hosts that are not designated as log hosts, edit the /etc/rsyslog.conf file and

    comment or remove the following lines:

    # $ModLoad imtcp

    # $InputTCPServerRun 514

    Run the following command to reload the rsyslogd configuration:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify the resulting lines are uncommented on

      designated log hosts and commented or removed on all others:

      # grep ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      $ModLoad imtcp

      # grep ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      $InputTCPServerRun 514

      364 | P a g e'
    severity: medium
- id: 4.2.2.1
  title: Ensure journald is configured to send logs to rsyslog
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'Data from journald may be stored in volatile memory or persisted locally on the server. Utilities exist to
    accept remote export of journald logs, however, use of the rsyslog service provides a consistent means of log collection
    and export. Notes:  This recommendation assumes that recommendation 4.2.1.5, "Ensure rsyslog is configured to send logs
    to a remote log host" has been implemented.  The main configuration file /etc/systemd/journald.conf is read before any
    of the custom *.conf files. If there are custom configs present, they override the main configuration parameters  As
    noted in the journald man pages: journald logs may be exported to rsyslog either through the process mentioned here, or
    through a facility like systemdjournald.service. There are trade-offs involved in each implementation, where ForwardToSyslog
    will immediately capture all events (and forward to an external log server, if properly configured), but may not capture
    all boot-up activities. Mechanisms such as systemd-journald.service, on the other hand, will record bootup events, but
    may delay sending the information to rsyslog, leading to the potential for log manipulation prior to export. Be aware
    of the limitations of all tools employed to secure a system.'
  rationale: Storing log data on a remote host protects log integrity from local attacks. If an attacker gains root access
    on the local system, they could tamper with or remove log data that is stored on the local system. 367 | P a g e
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/systemd.adoc#etcsyste
  page_start: 367
  audit_raw: 'Review /etc/systemd/journald.conf and verify that logs are forwarded to syslog

    # grep -E ^\s*ForwardToSyslog /etc/systemd/journald.conf

    ForwardToSyslog=yes'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    ForwardToSyslog=yes'
  checks:
  - type: manual_review
    info: 'Review /etc/systemd/journald.conf and verify that logs are forwarded to syslog

      # grep -E ^\s*ForwardToSyslog /etc/systemd/journald.conf

      ForwardToSyslog=yes'
    severity: medium
- id: 4.2.2.2
  title: Ensure journald is configured to compress large log files
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The journald system includes the capability of compressing overly large files to avoid filling up the system
    with logs or making the logs unmanageably large. Note: The main configuration file /etc/systemd/journald.conf is read
    before any of the custom *.conf files. If there are custom configs present, they override the main configuration parameters'
  rationale: Uncompressed large files may unexpectedly fill a filesystem leading to resource unavailability. Compressing logs
    prior to write can prevent sudden, unexpected filesystem impacts.
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/systemd.adoc#etcsyste
  page_start: 369
  audit_raw: 'Review /etc/systemd/journald.conf and verify that large files will be compressed:

    # grep -E ^\s*Compress /etc/systemd/journald.conf

    Compress=yes'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    Compress=yes'
  checks:
  - type: manual_review
    info: 'Review /etc/systemd/journald.conf and verify that large files will be compressed:

      # grep -E ^\s*Compress /etc/systemd/journald.conf

      Compress=yes'
    severity: medium
- id: 4.2.2.3
  title: Ensure journald is configured to write logfiles to persistent disk
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'Data from journald may be stored in volatile memory or persisted locally on the server. Logs in memory will
    be lost upon a system reboot. By persisting logs to local disk on the server they are protected from loss. Note: The main
    configuration file /etc/systemd/journald.conf is read before any of the custom *.conf files. If there are custom configs
    present, they override the main configuration parameters'
  rationale: Writing log data to disk will provide the ability to forensically reconstruct events which may have impacted
    the operations or security of a system even after a system crash or reboot.
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/systemd.adoc#etcsyste
  page_start: 371
  audit_raw: 'Review /etc/systemd/journald.conf and verify that logs are persisted to disk:

    # grep -E ^\s*Storage /etc/systemd/journald.conf

    Storage=persistent'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    Storage=persistent'
  checks:
  - type: manual_review
    info: 'Review /etc/systemd/journald.conf and verify that logs are persisted to disk:

      # grep -E ^\s*Storage /etc/systemd/journald.conf

      Storage=persistent'
    severity: medium
