  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: Services and ports can be accepted or explicitly rejected or dropped by a zone. For every zone, you can set
    a default behavior that handles incoming traffic that is not further specified. Such behavior is defined by setting the
    target of the zone. There are three options - default, ACCEPT, REJECT, and DROP.  ACCEPT - you accept all incoming packets
    except those disabled by a specific rule.  REJECT - you disable all incoming packets except those that you have allowed
    in specific rules and the source machine is informed about the rejection.  DROP - you disable all incoming packets except
