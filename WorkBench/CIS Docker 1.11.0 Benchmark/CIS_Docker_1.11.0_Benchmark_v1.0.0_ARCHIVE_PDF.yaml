- id: '2.1'
  title: Restrict network traffic between containers
  scoring: scored
  profile:
  - Level 1 - Docker
  description: By default, all network traffic is allowed between containers on the same host. If not desired, restrict all
    the inter container communication. Link specific containers together that require inter communication.
  rationale: By default, unrestricted network traffic is enabled between all containers on the same host. Thus, each container
    has the potential of reading all packets across the container network on the same host. This might lead to unintended
    and unwanted disclosure of information to other containers. Hence, restrict the inter container communication.
  impact: The inter container communication would be disabled. No containers would be able to talk to another container on
    the same host. If any communication between containers on the same host is desired, then it needs to be explicitly defined
    using container linking.
  references:
  - 1. https://docs.docker.com/articles/networking
  page_start: 39
  audit_raw: 'ps -ef | grep docker

    Ensure that the ''--icc'' parameter is set to ''false''.'
  remediation: 'Run the docker in daemon mode and pass ''--icc=false'' as argument.

    For Example,

    docker daemon --icc=false

    39 | P a g e'
