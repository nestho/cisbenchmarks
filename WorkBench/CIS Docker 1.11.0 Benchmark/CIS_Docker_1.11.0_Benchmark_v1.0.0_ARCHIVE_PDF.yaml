- id: '5.11'
  title: Set container CPU priority appropriately
  scoring: scored
  profile:
  - Level 1 - Docker
  description: By default, all containers on a Docker host share the resources equally. By using the resource management capabilities
    of Docker host, such as CPU shares, you can control the host CPU resources that a container may consume.
  rationale: By default, CPU time is divided between containers equally. If it is desired, to control the CPU time amongst
    the container instances, you can use CPU sharing feature. CPU sharing allows to prioritize one container over the other
    and forbids the lower priority container to claim CPU resources more often. This ensures that the high priority containers
    are served better.
  impact: If you do not set proper CPU shares, the container process may have to starve if the resources on the host are not
    available. If the CPU resources on the host are free, CPU shares do not place any restrictions on the CPU that the container
    may use.
  references:
  - 1. https://goldmann.pl/blog/2014/09/11/resource-management-in-docker/
  - 2. http://docs.docker.com/reference/commandline/cli/#run
  page_start: 120
  audit_raw: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: CpuShares={{

    .HostConfig.CpuShares }}''

    If the above command returns 0 or 1024, it means the CPU shares are not in place. If the

    above command returns a non-zero value other than 1024, it means CPU shares are in

    place.'
  remediation: 'Manage the CPU shares between your containers. To do so start the container using ''-c'' or

    ''--cpu-shares'' argument. You may start the container as below:

    $> docker run <Run arguments> --cpu-shares <CPU shares> <Container Image Name or

    ID> <Command>

    For example,

    docker run --interactive --tty --cpu-shares 512 centos /bin/bash

    In the above example, the container is started with a CPU shares of 50% of what the other

    containers use. So, if the other container has CPU shares of 80%, this container will have

    CPU shares of 40%.

    120 | P a g e

    Note: Every new container will have 1024 shares of CPU by default. However, this value is

    shown as ''0'' if you run the command mentioned in the audit section.

    Alternatively,

    1. Navigate to /sys/fs/cgroup/cpu/system.slice/ directory.

