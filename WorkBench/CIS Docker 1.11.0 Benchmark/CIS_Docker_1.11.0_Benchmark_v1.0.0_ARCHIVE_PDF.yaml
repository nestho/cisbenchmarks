- id: '5.24'
  title: Confirm cgroup usage
  scoring: scored
  profile:
  - Level 1 - Docker
  description: It is possible to attach to a particular cgroup on container run. Confirming cgroup usage would ensure that
    containers are running under defined cgroups.
  rationale: System administrators typically define cgroups under which containers are supposed to run. Even if cgroups are
    not explicitly defined by the system administrators, containers run under docker cgroup by default. At run-time, it is
    possible to attach to a different cgroup other than the one that was expected to be used. This usage should be monitored
    and confirmed. By attaching to a different cgroup than the one that is expected, excess permissions and resources might
    be granted to the container and thus, can prove to be unsafe.
  impact: None.
  references:
  - 1. https://docs.docker.com/engine/reference/run/#specifying-custom-cgroups
  - 2. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Resource_Management_Guide/ch01.html
  page_start: 144
  audit_raw: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: CgroupParent={{

    .HostConfig.CgroupParent }}''

    The above command would return the cgroup under which the containers are running. If it

    is blank, it means containers are running under default docker cgroup. In that case, this

    recommendation is compliant. If the containers are found to be running under cgroup

    other than the one that was expected, this recommendation is non-compliant.'
  remediation: Do not use --cgroup-parent option in docker run command unless needed.
