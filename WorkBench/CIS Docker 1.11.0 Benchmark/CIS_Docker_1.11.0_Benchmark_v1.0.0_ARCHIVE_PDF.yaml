benchmark:
  id: cis-docker-1-11-0-benchmark
  title: CIS Docker 1.11.0 Benchmark
  version: 1.0.0
  technology: CIS Docker 1.11.0 Benchmark
  category: WorkBench
  os: CIS Docker 1.11.0 Benchmark
  source_pdf: CIS_Docker_1.11.0_Benchmark_v1.0.0_ARCHIVE_PDF.pdf
  total_pages: 161
  controls_count: 82
controls:
- id: '1.1'
  title: Create a separate partition for containers
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: All Docker containers and their data and metadata is stored under /var/lib/docker directory. By default, /var/lib/docker
    would be mounted under / or /var partitions based on availability.
  rationale: Docker depends on /var/lib/docker as the default directory where all Docker related files, including the images,
    are stored. This directory might fill up fast and soon Docker and the host could become unusable. So, it is advisable
    to create a separate partition (logical volume) for storing Docker files.
  impact: None.
  references:
  - 1. http://www.projectatomic.io/docs/docker-storage-recommendation
  page_start: 11
  audit_raw: 'At the Docker host execute the below command:

    grep /var/lib/docker /etc/fstab

    This should return the partition details for /var/lib/docker mount point.'
  remediation: 'For new installations, create a separate partition for /var/lib/docker mount point. For

    systems that were previously installed, use the Logical Volume Manager (LVM) to create

    partitions.

    11 | P a g e'
  checks:
  - type: command
    command: grep /var/lib/docker /etc/fstab
    expected: This should return the partition details for /var/lib/docker mount point.
    severity: medium
    info: 'At the Docker host execute the below command:

      grep /var/lib/docker /etc/fstab

      This should return the partition details for /var/lib/docker mount point.'
- id: '1.2'
  title: Use the updated Linux Kernel
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Docker in daemon mode has specific kernel requirements. A 3.10 Linux kernel is the minimum requirement for
    Docker.
  rationale: Kernels older than 3.10 lack some of the features required to run Docker containers. These older versions are
    known to have bugs which cause data loss and frequently panic under certain conditions. The latest minor version (3.x.y)
    of the 3.10 (or a newer maintained version) Linux kernel is thus recommended. Additionally, using the updated Linux kernels
    ensures that critical kernel bugs found earlier are fixed.
  impact: None.
  references:
  - 1. https://docs.docker.com/installation/binaries/#check-kernel-dependencies
  - 2. https://docs.docker.com/installation/#installation-list
  page_start: 13
  audit_raw: 'Execute the below command to find out Linux kernel version:

    uname -r

    Ensure that the kernel version found is 3.10 or newer.'
  remediation: Check out the Docker kernel and OS requirements and suitably choose your kernel and OS.
  checks:
  - type: manual_review
    info: 'Execute the below command to find out Linux kernel version:

      uname -r

      Ensure that the kernel version found is 3.10 or newer.'
    severity: medium
- id: '1.3'
  title: Harden the container host
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Containers run on a Linux host. A container host can run one or more containers. It is of utmost importance
    to harden the host to mitigate host security misconfiguration.
  rationale: You should follow infrastructure security best practices and harden your host OS. Keeping the host system hardened
    would ensure that the host vulnerabilities are mitigated. Not hardening the host system could lead to security exposures
    and breaches.
  impact: None.
  references:
  - 1. https://docs.docker.com/articles/security/
  - 2. https://benchmarks.cisecurity.org/downloads/multiform/index.cfm
  page_start: 14
  audit_raw: 'Ensure that the host specific security guidelines are followed. Ask the system

    administrators which security benchmark does current host system comply with. Ensure

    that the host systems actually comply with that host specific security benchmark.'
  remediation: 'You may consider various CIS Security Benchmarks for your container host. If you have

    other security guidelines or regulatory requirements to adhere to, please follow them as

    suitable in your environment.

    Additionally, you can run a kernel with grsecurity and PaX. This would add many safety

    checks, both at compile-time and run-time. It is also designed to defeat many exploits and

    has powerful security features. These features do not require Docker-specific

    configuration, since those security features apply system-wide, independent of containers.'
  checks:
  - type: manual_review
    info: 'Ensure that the host specific security guidelines are followed. Ask the system

      administrators which security benchmark does current host system comply with. Ensure

      that the host systems actually comply with that host specific security benchmark.'
    severity: medium
- id: '1.4'
  title: Remove all non-essential services from the host
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Ensure that the host running the docker daemon is running only the essential services.
  rationale: It is a good practice to implement only one primary function per server to prevent functions that require different
    security levels from co-existing on the same server. Additionally, mixing various application environments on the same
    machine may hinder the granular administration of the respective applications.
  impact: None. 16 | P a g e
  references:
  - 1. http://blog.docker.com/2013/08/containers-docker-how-secure-are-they/
  page_start: 16
  audit_raw: 'Inspect the docker host and ensure that it is exclusively used for running docker

    containers. Other services must not be found. Examples of other services include Web

    Server, database, or any function other than the container''s main process. Some of the

    things you can do to inspect the system for other services are as below:

    Check running processes:

    ps -ef

    Check socket information:

    ss -nlp

    or

    netstat -nlp

    Check inventory:

    rpm -qa (or equivalent)'
  remediation: Move all other services within containers controlled by Docker or to other systems.
  checks:
  - type: command
    command: rpm -qa (or equivalent)
    expected: ''
    severity: medium
    info: 'Inspect the docker host and ensure that it is exclusively used for running docker

      containers. Other services must not be found. Examples of other services include Web

      Server, database, or any function other than the container''s main process. Some of the

      things you can do to inspect the system for other services are as below:

      Check running processes:

      ps -ef

      Check socket information:

      ss -nlp

      or

      nets'
- id: '1.5'
  title: Keep Docker up to date
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: The docker container solution is evolving to maturity and stability at a rapid pace. Like any other software,
    the vendor releases regular updates for Docker software that address security vulnerabilities, product bugs and bring
    in new functionality. Keep a tab on these product updates and upgrade as frequently as when new security vulnerabilities
    are fixed.
  rationale: By staying up to date on Docker updates, vulnerabilities in the Docker software can be mitigated. An educated
    attacker may exploit known vulnerabilities when attempting to attain access or elevate privileges. Not installing regular
    Docker updates may leave you with running vulnerable Docker software. It might lead to elevation privileges, unauthorized
    access or other security breaches.
  impact: None.
  references:
  - 1. https://docs.docker.com/installation/
  - 2. https://github.com/docker/docker/releases/latest
  page_start: 18
  audit_raw: 'Execute the below command and verify that the Docker version is up to date.

    docker version'
  remediation: Download and install the updated Docker software from official Docker repository.
  checks:
  - type: command
    command: docker version
    expected: Execute the below command and verify that the Docker version is up to date.
    severity: medium
    info: 'Execute the below command and verify that the Docker version is up to date.

      docker version'
- id: '1.6'
  title: Only allow trusted users to control Docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: The Docker daemon currently requires 'root' privileges. A user added to the 'docker' group gives him full 'root'
    access rights.
  rationale: Docker allows you to share a directory between the Docker host and a guest container without limiting the access
    rights of the container. This means that you can start a container and map the / directory on your host to the container.
    The container will then be able to alter your host file system without any restrictions. In simple terms, it means that
    you can attain elevated privileges with just being a member of the 'docker' group and then starting a container with mapped
    / directory on the host.
  impact: Rights to build and execute containers as normal user would be restricted.
  references:
  - 1. https://docs.docker.com/articles/security/#docker-daemon-attack-surface
  - 2. https://www.andreas-jung.com/contents/on-docker-security-docker-groupconsidered-harmful
  page_start: 19
  audit_raw: 'Execute the below command on the docker host and ensure that only trusted users are

    members of the ''docker'' group.

    getent group docker'
  remediation: 'Remove any users from the ''docker'' group that are not trusted. Additionally, do not create

    a mapping of sensitive directories on host to container volumes.'
  checks:
  - type: manual_review
    info: 'Execute the below command on the docker host and ensure that only trusted users are

      members of the ''docker'' group.

      getent group docker'
    severity: medium
- id: '1.7'
  title: Audit docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Audit all Docker daemon activities.
  rationale: Apart from auditing your regular Linux file system and system calls, audit Docker daemon as well. Docker daemon
    runs with 'root' privileges. It is thus necessary to audit its activities and usage.
  impact: Auditing generates quite big log files. Ensure to rotate and archive them periodically. Also, create a separate
    partition of audit to avoid filling root file system. 21 | P a g e
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security_Guide/chap-system_auditing.html
  page_start: 21
  audit_raw: 'Verify that there is an audit rule for Docker daemon. For example, execute below

    command:

    auditctl -l | grep /usr/bin/docker

    This should list a rule for Docker daemon.'
  remediation: 'Add a rule for Docker daemon.

    For example,

    Add the line as below line in /etc/audit/audit.rules file:

    -w /usr/bin/docker -k docker

    Then, restart the audit daemon. For example,

    service auditd restart'
  checks:
  - type: command
    command: auditctl -l | grep /usr/bin/docker
    expected: Verify that there is an audit rule for Docker daemon. For example, execute below
    severity: medium
    info: 'Verify that there is an audit rule for Docker daemon. For example, execute below

      command:

      auditctl -l | grep /usr/bin/docker

      This should list a rule for Docker daemon.'
