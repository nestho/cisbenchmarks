- id: '6.5'
  title: Avoid container sprawl
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Do not keep a large number of containers on the same host.
  rationale: The flexibility of containers makes it easy to run multiple instances of applications and indirectly leads to
    Docker images that exist at varying security patch levels. It also means that you are consuming host resources that otherwise
    could have been used for running 'useful' containers. Having more than just the manageable number of containers on a particular
    host makes the situation vulnerable to mishandling, misconfiguration and fragmentation. Thus, avoid container sprawl and
    keep the number of containers on a host to a manageable total.
  impact: If you keep way too few number of containers per host, then perhaps you are not utilizing your host resources very
    adequately.
