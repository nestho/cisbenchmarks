- id: '5.3'
  title: Restrict Linux Kernel Capabilities within containers
  scoring: scored
  profile:
  - Level 1 - Docker
  description: By default, Docker starts containers with a restricted set of Linux Kernel Capabilities. It means that any
    process may be granted the required capabilities instead of root access. Using Linux Kernel Capabilities, the processes
    do not have to run as root for almost all the specific areas where root privileges are usually needed.
  rationale: 'Docker supports the addition and removal of capabilities, allowing use of a non-default profile. This may make
    Docker more secure through capability removal, or less secure through the addition of capabilities. It is thus recommended
    to remove all capabilities except those explicitly required for your container process. For example, capabilities such
    as below are usually not needed for container process: NET_ADMIN SYS_ADMIN SYS_MODULE'
  impact: Based on what Linux Kernel Capabilities were added or dropped, restrictions within the container would apply.
  references:
