  title: Do not use insecure registries
  scoring: scored
  profile:
  - Level 1 - Docker
  description: Docker considers a private registry either secure or insecure. By default, registries are considered secure.
  rationale: A secure registry uses TLS. A copy of registry's CA certificate is placed on the Docker host at '/etc/docker/certs.d/<registry-name>/'
    directory. An insecure registry is the one not having either valid registry certificate or is not using TLS. You should
    not be using any insecure registries in the production environment. Insecure registries can be tampered with leading to
    possible compromise to your production system. Additionally, If a registry is marked as insecure then 'docker pull', 'docker
    push', and 'docker search' commands will not result in an error message and the user might be indefinitely working with
