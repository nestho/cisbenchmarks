- id: '4.5'
  title: Enable Content trust for Docker
  scoring: scored
  profile:
  - Level 2 - Docker
  description: Content trust is disabled by default. You should enable it.
  rationale: Content trust provides the ability to use digital signatures for data sent to and received from remote Docker
    registries. These signatures allow client-side verification of the integrity and publisher of specific image tags. This
    ensures provenance of container images.
  impact: 'In an environment where DOCKER_CONTENT_TRUST is set, you are required to follow trust procedures while working
    with images - build, create, pull, push and run. You can use the --disable-content-trust flag to run individual operations
    on tagged images without content trust on an as-needed basis but that defeats the purpose of enabling content trust and
    hence, should be avoided wherever possible. Note: Content trust is currently only available for users of the public Docker
    Hub. It is currently not available for the Docker Trusted Registry or for private registries.'
  references:
  - 1. https://docs.docker.com/engine/security/trust/content_trust/
  - 2. https://docs.docker.com/engine/reference/commandline/cli/#notary
