- id: '2.8'
  title: Enable user namespace support
  scoring: scored
  profile:
  - Level 2 - Docker
  description: Enable user namespace support in Docker daemon to utilize container user to host user remapping. This recommendation
    is beneficial where containers you are using do not have an explicit container user defined in the container image. If
    container images that you are using have a pre-defined non-root user, this recommendation may be skipped since this feature
    is still in its infancy and might give you unpredictable issues and complexities.
  rationale: The Linux kernel user namespace support in Docker daemon provides additional security for the Docker host system.
    It allows a container to have a unique range of user and group IDs which are outside the traditional user and group range
    utilized by the host system. For example, the root user will have expected administrative privilege inside the container
    but can effectively be mapped to an unprivileged UID on the host system.
