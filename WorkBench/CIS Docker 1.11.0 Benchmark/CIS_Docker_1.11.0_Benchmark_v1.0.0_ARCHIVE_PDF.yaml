- id: '5.15'
  title: Do not share the host's process namespace
  scoring: scored
  profile:
  - Level 1 - Docker
  description: Process ID (PID) namespaces isolate the process ID number space, meaning that processes in different PID namespaces
    can have the same PID. This is process level isolation between containers and the host.
  rationale: PID namespace provides separation of processes. The PID Namespace removes the view of the system processes, and
    allows process ids to be reused including PID 1. If the host's PID namespace is shared with the container, it would basically
    allow processes within the container to see all of the processes on the host system. This breaks the benefit of process
    level isolation between the host and the containers. Someone having access to the container can eventually know all the
    processes running on the host system and can even kill the host system processes from within the container. This can be
    catastrophic. Hence, do not share the host's process namespace with the containers.
  impact: Container processes cannot see the processes on the host system. In certain cases you want your container to share
    the host's process namespace. For example, you could build a container with debugging tools like strace or gdb, but want
    to use these tools when debugging processes within the container. If this is desired, then share only one (or needed)
    host process by using the '-p' switch. 128 | P a g e For example, docker run --pid=host rhel7 strace -p 1234
  references:
  - 1. https://docs.docker.com/reference/run/#pid-settings
  - 2. http://man7.org/linux/man-pages/man7/pid_namespaces.7.html
  page_start: 128
  audit_raw: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: PidMode={{

    .HostConfig.PidMode }}''

    If the above command returns ''host'', it means the host PID namespace is shared with the

    container else this recommendation is compliant.'
  remediation: 'Do not start a container with ''--pid=host'' argument.

    For example, do not start a container as below:

    docker run --interactive --tty --pid=host centos /bin/bash'
  checks:
  - type: command
    command: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: PidMode={{'
    expected: ''
    severity: medium
    info: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: PidMode={{

      .HostConfig.PidMode }}''

      If the above command returns ''host'', it means the host PID namespace is shared with the

      container else this recommendation is compliant.'
