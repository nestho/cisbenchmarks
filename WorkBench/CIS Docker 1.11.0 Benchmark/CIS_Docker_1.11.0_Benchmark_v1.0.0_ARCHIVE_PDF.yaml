- id: '6.4'
  title: Avoid image sprawl
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Do not keep a large number of container images on the same host. Use only tagged images as appropriate.
  rationale: Tagged images are useful to fall back from "latest" to a specific version of an image in production. Images with
    unused or old tags may contain vulnerabilities that might be exploited, if instantiated. Additionally, if you fail to
    remove unused images from the system and there are various such redundant and unused images, the host filesystem may become
    full and could lead to denial of service.
  impact: None
  references:
  - 1. http://craiccomputing.blogspot.in/2014/09/clean-up-unused-docker-containersand.html
  - 2. https://forums.docker.com/t/command-to-remove-all-unused-images/20/8
