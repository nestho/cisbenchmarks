- id: '5.25'
  title: Restrict container from acquiring additional privileges
  scoring: scored
  profile:
  - Level 1 - Docker
  description: Restrict the container from acquiring additional privileges via suid or sgid bits.
  rationale: A process can set the no_new_priv bit in the kernel. It persists across fork, clone and execve. The no_new_priv
    bit ensures that the process or its children processes do not gain any additional privileges via suid or sgid bits. This
    way a lot of dangerous operations become a lot less dangerous because there is no possibility of subverting privileged
    binaries.
  impact: no_new_priv prevents LSMs like SELinux from transitioning to process labels that have access not allowed to the
    current process.
  references:
  - 1. https://github.com/projectatomic/atomic-site/issues/269
  - 2. https://github.com/docker/docker/pull/20727
  page_start: 146
  audit_raw: 'docker ps --quiet | xargs docker inspect --format ''{{ .Id }}: SecurityOpt={{

    .HostConfig.SecurityOpt }}''

    The above command should return all the security options currently configured for the

    containers. no-new-privileges should also be one of them.'
  remediation: 'Start a container as below:

    docker run <run-options> --security-opt=no-new-privileges <IMAGE> <CMD>

    For example,

    docker run --rm -it --security-opt=no-new-privileges ubuntu bash'
  checks:
  - type: command
