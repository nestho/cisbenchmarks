- id: 1.2.2.4.1
  title: Set 'Turn off Autoplay' to 'Enabled:All drives'
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: Autoplay starts to read from a drive as soon as you insert media in the drive, which causes the setup file
    for programs or audio media to start immediately. An attacker could use this feature to launch a program to damage the
    computer or data on the computer. You can enable the Turn off Autoplay setting to disable the Autoplay feature. Autoplay
    is disabled by default on some removable drive types, such as floppy disk and network drives, but not on CD-ROM drives.
    Note You cannot use this policy setting to enable Autoplay on computer drives in which it is disabled by default, such
    as floppy disk and network drives.
  rationale: An attacker could use this feature to launch a program to damage a client computer or data on the computer.
  impact: Users will have to manually launch setup or installation programs that are provided on removable media.
  references: []
