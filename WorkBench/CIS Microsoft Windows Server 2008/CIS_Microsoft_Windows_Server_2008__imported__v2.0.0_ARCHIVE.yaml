- id: 1.1.1.5.1
  title: Kerberos Policy 1.1.1.5.1.1 Configure 'Enforce user logon restrictions'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: Kerberos policy settings determine Kerberos-related attributes of domain user accounts, such as the Maximum
    lifetime for user ticket and Enforce user logon restrictions settings. However, these policy settings are not used for
    stand-alone client computers because they do not participate in a domain. This policy setting specifies whether the tasks
    Publish this file to the Web, Publish this folder to the Web, and Publish the selected items to the Web are available
    from File and Folder Tasks in Windows folders. This policy setting specifies whether Windows will search Windows Update
    for device drivers when no local drivers for a device are present. Note See also Turn off Windows Update device driver
    search prompt in Administrative Templates/System, which governs whether an administrator is prompted before Windows Update
    is searched for device drivers if a driver is not found locally. This policy setting specifies whether Windows Messenger
    can collect anonymous information about how the Windows Messenger software and service is used. This policy setting controls
    whether the computer can download print driver packages over HTTP. To set up HTTP printing, printer drivers that are not
    available in the standard operating system installation might need to be downloaded over HTTP. This policy setting specifies
    whether Search Companion should automatically download content updates during local and Internet searches. This policy
    setting allows you to disable the client computer's ability to print over HTTP, which allows the computer to print to
    printers on the intranet as well as the Internet. This policy setting controls whether Windows will download a list of
    providers for the Web publishing and online ordering wizards.
  rationale: If you disable this policy setting, users could receive session tickets for services that they no longer have
    the right to use because the right was removed after they logged on. Users may publish confidential or sensitive information
    to a public service outside of the control of the organization. If users are able to download and install device drivers
    there is a small chance that they will install a driver that reduces system stability. There is an even smaller possibility
    that they will install a driver that includes malicious code. These risks are very low because Microsoft requires vendors
    to test drivers extensively before they can be published on Windows Update. Large enterprise environments may not want
    to have information collected from managed client computers. Users might download drivers that include malicious code.
    There is a small risk that users will unknowingly reveal sensitive information because of the topics they are searching
    for. This risk is very low because even if this setting is enabled users still must submit search queries to the desired
    search engine in order to perform searches. Information that is transmitted over HTTP through this capability is not protected
    and can be intercepted by malicious users. For this reason, it is not often used in enterprise environments. Although
    the risk is minimal, enabling this setting will reduce the possibility of a user unknowingly downloading malicious content
    through this feature.
  impact: None. This is the default configuration. The Web Publishing wizard is used to download a list of providers and allow
    users to publish content to the Web. Users will not be able to download new or updated device drivers from Windows Update.
    Microsoft uses information collected through the Customer Experience Improvement Program to detect software flaws so that
    they can be corrected more quickly, enabling this setting will reduce the amount of data Microsoft is able to gather for
    this purpose. This policy setting does not prevent the client computer from printing to printers on the intranet or the
    Internet over HTTP. It only prohibits drivers that are not already installed locally from downloading. Internet searches
    will still send the search text and information about the search to Microsoft and the chosen search provider. If you select
    Classic Search, the Search Companion feature will be unavailable. You can select Classic Search by clicking Start, Search,
    Change Preferences, and then Change Internet Search Behavior. If you enable this policy setting, the client computer will
    not be able to print to Internet printers over HTTP. This policy setting affects the client side of Internet printing
    only. Regardless of how it is configured, a computer could act as an Internet Printing server and make its shared printers
    available through HTTP. If this policy setting is enabled, Windows is prevented from downloading providers; only the service
    providers cached in the local registry will display.
