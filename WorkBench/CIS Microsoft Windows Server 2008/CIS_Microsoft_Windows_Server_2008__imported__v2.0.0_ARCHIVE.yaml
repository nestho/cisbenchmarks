- id: 1.1.1.1.100
  title: Set 'IKE and AuthIP IPsec Keying Modules' to 'Automatic'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'The IKEEXT service hosts the Internet Key Exchange (IKE) and Authenticated Internet Protocol (AuthIP) keying
    modules. These keying modules are used for authentication and key exchange in Internet Protocol security (IPsec). Stopping
    or disabling the IKEEXT service will disable IKE and AuthIP key exchange with peer computers. IPsec is typically configured
    to use IKE or AuthIP; therefore, stopping or disabling the IKEEXT service might result in an IPsec failure and might compromise
    the security of the system. It is strongly recommended that you have the IKEEXT service running. This policy setting determines
    whether to disconnect users who are connected to the local computer outside their user account''s valid logon hours. It
    affects the SMB component. If you enable this policy setting, client sessions with the SMB service will be forcibly disconnected
    when the client''s logon hours expire. If you disable this policy setting, established client sessions will be maintained
    after the client''s logon hours expire. If you enable this policy setting you should also enable Network security: Force
    logoff when logon hours expire. If your organization configures logon hours for users, it makes sense to enable this policy
    setting. This policy setting determines whether the Lightweight Directory Access Protocol (LDAP) server requires LDAP
    clients to negotiate data signing. The built-in local guest account is another well-known name to attackers. It is recommended
    to rename this account to something that does not indicate its purpose. Even if you disable this account, which is recommended,
    ensure that you rename it for added security. Note This policy setting is not configured in the Security Templates, nor
    is a new user name for the account suggested here. Suggested user names are omitted to ensure that organizations that
    implement this guidance will not use the same new user name in their environments. This security setting determines whether
    domain controllers will refuse requests from member computers to change computer account passwords. By default, member
    computers change their computer account passwords every 30 days. If enabled, the domain controller will refuse computer
    account password change requests. If it is enabled, this setting does not allow a domain controller to accept any changes
    to a computer account''s password. Default: This policy is not defined, which means that the system treats it as Disabled.
    This policy setting determines whether the Guest account is enabled or disabled. The Guest account allows unauthenticated
    network users to gain access to the system. Note that this setting will have no impact when applied to the domain controller
    organizational unit via group policy because domain controllers have no local account database. It can be configured at
    the domain level via group policy, similar to account lockout and password policy settings. This policy setting determines
    what additional permissions are assigned for anonymous connections to the computer. If you enable this policy setting,
    anonymous Windows users are allowed to perform certain activities, such as enumerate the names of domain accounts and
    network shares. An unauthorized user could anonymously list account names and shared resources and use the information
    to guess passwords or perform social engineering attacks. This policy setting determines which communication sessions,
    or pipes, will have attributes and permissions that allow anonymous access. Note: When you configure this setting you
    specify a list of one or more objects. The delimiter used when entering the list is a line feed or carriage return, that
    is, type the first object on the list, press the Enter button, type the next object, press Enter again, etc. The setting
    value is stored as a comma-delimited list in group policy security templates. It is also rendered as a comma-delimited
    list in Group Policy Editor''s display pane and the Resultant Set of Policy console. It is recorded in the registry as
    a line-feed delimited list in a REG_MULTI_SZ value. The built-in local administrator account is a well-known account name
    that attackers will target. It is recommended to choose another name for this account, and to avoid names that denote
