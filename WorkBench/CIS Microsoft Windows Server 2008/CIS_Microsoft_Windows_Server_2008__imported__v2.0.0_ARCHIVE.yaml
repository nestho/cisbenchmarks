- id: 1.1.1.1.12
  title: Set 'Windows Color System' to 'Manual'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  description: The WcsPlugInService service hosts third-party Windows Color System color device module and gamut map model
    plug-in modules. These plug-in modules are vendorspecific extensions to the Windows Color System baseline color device
    and gamut map modules. Stopping or disabling the WcsPlugInService service will disable this extensibility feature, and
    the Windows Color System will use its baseline model processing rather than the vendor's desired processing. This might
    result in inaccurate color rendering.
  rationale: 'Any service or application is a potential point of attack. Therefore, you should disable or remove any unneeded
