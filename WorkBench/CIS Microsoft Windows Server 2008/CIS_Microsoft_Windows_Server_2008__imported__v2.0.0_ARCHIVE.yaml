    oRebootWithLoggedOnUsers'
  remediation: 'Configure the following Group Policy setting in a manner that is consistent with the

    security and operational requirements of your organization:

    Computer Configuration\Administrative Templates\Windows Components\Windows

    Update\No auto-restart with logged on users for scheduled automatic updates

    installations'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

