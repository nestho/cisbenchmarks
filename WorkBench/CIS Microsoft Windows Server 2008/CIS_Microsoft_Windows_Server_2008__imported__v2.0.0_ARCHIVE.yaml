  title: Configure 'Offer Remote Assistance'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This policy setting determines whether a support person or an IT expert administrator can offer remote assistance
    to computers in your environment if a user does not explicitly request assistance first through a channel, such as e-mail,
    or Instant Messenger. Note The expert cannot connect to the computer unannounced or control it without permission from
    the user. When the expert tries to connect, the user can still choose to deny the connection or give the expert view-only
    privileges. The user must explicitly click the Yes button to allow the expert to remotely control the workstation after
    the Offer Remote Assistance setting is configured to Enabled. If this policy setting is enabled the following options
    are available: . Allow helpers to only view the computer . Allow helpers to remotely control the computer When you configure
    this policy setting, you can also specify a list of users or user groups known as helpers who may offer remote assistance.
    To configure the list of helpers 1. In the Offer Remote Assistance setting configuration window, click Show. A new window
    will open in which you can enter helper names. 2. Add each user or group to the Helper list in one of the following formats:
    . <Domain Name>\<User Name> . <Domain Name>\<Group Name> If this policy setting is disabled or not configured, users and
    or groups will not be able to offer unsolicited remote assistance to computer users in your environment. This policy requires
    Windows Vista or later versions of Windows. This policy setting specifies the maximum size of the log file in kilobytes.
    If you enable this policy setting, you can configure the maximum log file size to be between 1 megabyte (1024 kilobytes)
    and 2 terabytes (2147483647 kilobytes) in kilobyte increments. If you disable or do not configure this policy setting,
    the maximum size of the log file maximum size will be set to the local configuration value. This value can be changed
    by the local administrator using the log properties dialog and it defaults to 20 megabytes. For backwards compatibility
    the same setting can also be configured at Computer Configuration\Windows Settings\Security Settings\Event Log, if set
    at both locations this one will take precedence. This policy setting controls Event Log behavior when the log file reaches
    its maximum size. Old events may or may not be retained according to the Backup log automatically when full policy setting.
    This policy requires Windows Vista or later versions of Windows. This policy setting specifies the maximum size of the
