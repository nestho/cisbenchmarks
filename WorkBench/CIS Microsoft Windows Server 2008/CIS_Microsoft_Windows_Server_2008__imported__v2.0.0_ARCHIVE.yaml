  rationale: 'Any service or application is a potential point of attack. Therefore, you should disable or remove any unneeded
    services or executable files in your environment. There are additional optional services available in Windows that are
    not installed during a default installation of the operating system. Depending on the version of Windows you can add these
    optional services to an existing computer through Add/Remove Programs in Control Panel, Programs and Features in Control
    Panel, Server Manager, or the Configure Your Server Wizard. Important: If you enable additional services, they may depend
    on other services. Add all of the services that are needed for a specific server role to the policy for the server role
    that it performs in your organization. If your organization configures logon hours for users, then it makes sense to enable
    this policy setting. Otherwise, users who should not have access to network resources outside of their logon hours may
    actually be able to continue to use those resources with sessions that were established during allowed hours. Unsigned
    network traffic is susceptible to man-in-the-middle attacks. In such attacks, an intruder captures packets between the
    server and the client, modifies them, and then forwards them to the client. Where LDAP servers are concerned, an attacker
    could cause a client to make decisions that are based on false records from the LDAP directory. To lower the risk of such
    an intrusion in an organizationâ€ s network, you can implement strong physical security measures to protect the network
    infrastructure. Also, you could implement Internet Protocol security (IPsec) authentication header mode (AH), which performs
    mutual authentication and packet integrity for IP traffic to make all types of man-in-the-middle attacks extremely difficult.
    The Guest account exists on all computers that run the Windows operating systems. If you rename this account. it is slightly
    more difficult for unauthorized persons to guess this privileged user name and password combination. If you enable this
    policy setting on all domain controllers in a domain, domain members will not be able to change their computer account
    passwords, and those passwords will be more susceptible to attack. The default Guest account allows unauthenticated network
    users to log on as Guest with no password. These unauthorized users could access any resources that are accessible to
    the Guest account over the network. This capability means that any network shares with permissions that allow access to
    the Guest account, the Guests group, or the Everyone group will be accessible over the network, which could lead to the
    exposure or corruption of data. An unauthorized user could anonymously list account names and shared resources and use
    the information to attempt to guess passwords, perform social engineering attacks, or launch denial of service (DoS) attacks.
    You can restrict access over named pipes such as COMNAP and LOCATOR to help prevent unauthorized access to the network.
    The list of some of the default named pipes and their purpose is provided in the following list: Browser - Named pipe
    for the Computer Browser service. COMNAP - SNABase named pipe. Systems Network Architecture (SNA) is a collection of network
    protocols that were originally developed for IBM mainframe computers. COMNODE - SNA Server named pipe. EPMAPPER - End
    Point Mapper named pipe. LOCATOR - Remote Procedure Call Locator service named pipe. Lsarpc - Named pipe for the Local
    Security Authority Remote Procedure Call service. Netlogon - Named pipe for then NetLogon service. Samr - Named pipe for
    the Security Accounts Manager service. SPOOLSS - Named pipe for the Print Spooler service. SQL\QUERY - Default named pipe
    for SQL Server. Srvsvc - Named pipe for the Server service. TrkSvr - Distributed Link Tracking Server named pipe. TrkWks
    - Distributed Link Tracking Client named pipe. Wkssvc - Named pipe for the Workstation service. The Administrator account
    exists on all computers that run the Windows operating systems. If you rename this account, it is slightly more difficult
    for unauthorized persons to guess this privileged user name and password combination. The built-in Administrator account
    cannot be locked out, regardless of how many times an attacker might use a bad password. This capability makes the Administrator
    account a popular target for brute force attacks thattempt to guess passwords. The value of this countermeasure is lessened
    because this account has a well-known SID, and there are third-party tools that allow authentication by using the SID
    rather than the account name. Therefore, even if you rename the Administrator account, an attacker could launch a brute
    force attack by using the SID to log on. Unsigned network traffic is susceptible to man-in-the-middle attacks. In such
    attacks, an intruder captures packets between the server and the client, modifies them, and then forwards them to the
    client. Where LDAP servers are concerned, an attacker could cause a client to make decisions that are based on false records
    from the LDAP directory. To lower the risk of such an intrusion in an organizationâ€ s network, you can implement strong
    physical security measures to protect the network infrastructure. Also, you could implement Internet Protocol security
    (IPsec) authentication header mode (AH), which performs mutual authentication and packet integrity for IP traffic to make
    all types of man-in-the-middle attacks extremely difficult. In some organizations, it can be a daunting management challenge
    to maintain a regular schedule for periodic password changes for local accounts. Therefore, you may want to disable the
    built-in Administrator account instead of relying on regular password changes to protect it from attack. Another reason
    to disable this built-in account is that it cannot be locked out no matter how many failed logons it accrues, which makes
    it a prime target for brute force attacks thattempt to guess passwords. Also, this account has a well-known security identifier
    (SID) and there are third-party tools that allow authentication by using the SID rather than the account name. This capability
    means that even if you rename the Administrator account, an attacker could launch a brute force attack by using the SID
    to log on. In Active Directorybased domains, each computer has an account and password just like every user. By default,
    the domain-joined computers automatically change their domain password every 30 days. If you increase this interval significantly,
    or set it to 0 so that the computers no longer change their passwords, an attacker will have more time to undertake a
    brute force attack to guess the password of one or more computer accounts. If you enable this policy setting on all domain
    controllers in a domain, domain members will not be able to change their computer account passwords, and those passwords
    will be more susceptible to attack. If you enable this policy setting, jobs that are created by server operators by means
    of the AT service will execute in the context of the account that runs that service. By default, that is the local SYSTEM
    account. If you enable this policy setting, server operators could perform tasks that SYSTEM is able to do but that they
    would typically not be able to do, such as add their account to the local Administrators group. Session hijacking uses
    tools that allow attackers who have access to the same network as the client or server to interrupt, end, or steal a session
    in progress. Attackers can potentially intercept and modify unsigned SMB packets and then forward themso that the server
    might perform undesirable actions. Alternatively, the attacker could pose as the server or client after legitimate authentication
    and gain unauthorized access to data. SMB is the resource sharing protocol that is supported by the Windows operating
    systems. SMB signatures authenticate both users and the servers that host the data. If either side fails the authentication
    process, data transmission will not take place. The number that is assigned to this policy setting indicates the number
    of users whose logon information the servers will cache locally. If the number is set to 10, then the server caches logon
    information for 10 users. When an eleventh user logs on to the computer, the server overwrites the oldest cached logon
    session. Users who access the server console will have their logon credentials cached on that server. An attacker who
    is able to access the file system of the server could locate this cached information and use a brute force attack to attempt
    to determine user passwords. To mitigate this type of attack, Windows encrypts the information and obscures its physical
    location. The number that is assigned to this policy setting indicates the number of users whose logon information the
    servers will cache locally. If the number is set to 10, then the server caches logon information for 10 users. When an
    eleventh user logs on to the computer, the server overwrites the oldest cached logon session. Users who access the server
    console will have their logon credentials cached on that server. An attacker who is able to access the file system of
    the server could locate this cached information and use a brute force attack to attempt to determine user passwords. To
    mitigate this type of attack, Windows encrypts the information and obscures its physical location. Software restriction
    policies help to protect users and computers because they can prevent the execution of unauthorized code, such as viruses
    and Trojans horses. If you enable this policy setting, jobs that are created by server operators by means of the AT service
    will execute in the context of the account that runs that service. By default, that is the local SYSTEM account. If you
    enable this policy setting, server operators could perform tasks that SYSTEM is able to do but that they would typically
    not be able to do, such as add their account to the local Administrators group. You can restrict access over named pipes
    such as COMNAP and LOCATOR to help prevent unauthorized access to the network. The list of some of the default named pipes
    and their purpose is provided in the following list: Browser - Named pipe for the Computer Browser service. COMNAP - SNABase
    named pipe. Systems Network Architecture (SNA) is a collection of network protocols that were originally developed for
    IBM mainframe computers. COMNODE - SNA Server named pipe. EPMAPPER - End Point Mapper named pipe. LOCATOR - Remote Procedure
    Call Locator service named pipe. Lsarpc - Named pipe for the Local Security Authority Remote Procedure Call service. Netlogon
    - Named pipe for then NetLogon service. Samr - Named pipe for the Security Accounts Manager service. SPOOLSS - Named pipe
    for the Print Spooler service. SQL\QUERY - Default named pipe for SQL Server. Srvsvc - Named pipe for the Server service.
    TrkSvr - Distributed Link Tracking Server named pipe. TrkWks - Distributed Link Tracking Client named pipe. Wkssvc - Named
    pipe for the Workstation service. Intellectual property, personally identifiable information, and other confidential data
    are normally manipulated by applications on the computer and require elevated credentials to get access to the information.
    Users and administrators inherently trust applications used with these information sources and provide their credentials.
    If one of these applications is replaced by a rogue application that appears identical to the trusted application the
    confidential data could be compromised and the user''s administrative credentials would also be compromised. An unauthorized
    user could anonymously list account names and use the information to perform social engineering attacks or attempt to
    guess passwords. (Social engineering attacks try to deceive users in some way to obtain passwords or some form of security
    information.) It can be difficult to make users choose strong passwords, and even strong passwords are vulnerable to brute-force
    attacks if an attacker has sufficient time and computing resources. Users may be able to move data on removable disks
    to a different computer where they have administrative privileges. The user could then take ownership of any file, grant
    themselves full control, and view or modify any file. The fact that most removable storage devices will eject media by
    pressing a mechanical button diminishes the advantage of this policy setting. The default grace period that is allowed
    for user movement before the screen saver lock takes effect is five seconds. If you leave the default grace period configuration,
    your computer is vulnerable to a potential attack from someone who could approach the console and attempt to log on to
    the computer before the lock takes effect. An entry to the registry can be made to adjust the length of the grace period.
    This setting reduces vulnerabilities by ensuring that legacy applications only write data to permitted locations. Users
    who can access the console locally could shut down the computer. Attackers could also walk to the local console and restart
    the server, which would cause a temporary denial of service (DoS) condition. Attackers could also shut down the server
    and leave all of its applications and services unavailable. It is very dangerous to enable this setting. Any shares that
    are listed can be accessed by any network user, which could lead to the exposure or corruption of sensitive data. The
    default configuration computers that belong to a domain is that they are automatically required to change the passwords
    for their accounts every 30 days. If you disable this policy setting, computers will retain the same passwords as their
    computer accounts. Computers that are no longer able to automatically change their account password are at risk from an
    attacker who could determine the password for the computer''s domain account. Prior to the introduction of auditing subcategories
    in Windows Vista, it was difficult to track events at a per-system or per-user level. The larger event categories created
    too many events and the key information that needed to be audited was difficult to find. An unauthorized user could anonymously
    list account names and shared resources and use the information to attempt to guess passwords or perform social engineering
    attacks. Each SMB session consumes server resources, and numerous null sessions will slow the server or possibly cause
    it to fail. An attacker could repeatedly establish SMB sessions until the server''s SMB services become slow or unresponsive.
    If you enable this policy setting, the computer can transmit passwords in plaintext across the network to other computers
    that offer SMB services. These other computers may not use any of the SMB security mechanisms that are included with recent
    versions Windows. A malicious user could exhaust a target computer''s resources if it never sent any acknowledgment messages
    for data that was transmitted by the target computer. The Recovery Console can be very useful when you need to troubleshoot
    and repair computers that do not start. However, it is dangerous to allow automatic logon to the console. Anyone could
    walk up to the server, disconnect the power to shut it down, restart it, select Recover Console from the Restart menu,
    and then assume full control of the server. Users sometimes forget to lock their workstations when they are away from
    them, allowing the possibility for malicious users to access their computers. If smart cards are used for authentication,
    the computer should automatically lock itself when the card is removed to ensure that only the user with the smart card
    is accessing resources using those credentials.. A globally visible named object, if incorrectly secured, could be acted
    upon by malicious software that knows the name of the object. For instance, if a synchronization object such as a mutex
    had a poorly chosen discretionary access control list (DACL), then malicious software could access that mutex by name
    and cause the program that created it to malfunction. However, the risk of such an occurrence is very low. One of the
    risks that the UAC feature introduced with Windows Vista is trying to mitigate is that of malicious software running under
    elevated credentials without the user or administrator being aware of its activity. This setting allows the administrator
    to perform operations that require elevated privileges while connected via Remote Assistance. This increases security
    in that organizations can use UAC even when end user support is provided remotely. However, it also reduces security by
    adding the risk that an administrator might allow an unprivileged user to share elevated privileges for an application
    that the administrator needs to use during the Remote Desktop session. Displaying a warning message before logon may help
    prevent an attack by warning the attacker about the consequences of their misconduct before it happens. It may also help
    to reinforce corporate policy by notifying employees of the appropriate policy during the logon process. You can enable
    all of the options for this policy setting to help protect network traffic that uses the NTLM Security Support Provider
    (NTLM SSP) from being exposed or tampered with by an attacker who has gained access to the same network. In other words,
    these options help protect against man-in-the-middle attacks. If you configure a computer for automatic logon, anyone
    who can physically gain access to the computer can also gain access to everything that is on the computer, including any
    network or networks that the computer is connected to. Also, if you enable automatic logon, the password is stored in
    the registry in plaintext. The specific registry key that stores this setting is remotely readable by the Authenticated
    Users group. As a result, this entry is appropriate only if the computer is physically secured and if you ensure that
    untrusted users cannot remotely see the registry. A malicious user could exhaust a target computer''s resources if it
    never sent any acknowledgment messages for data that was transmitted by the target computer. An attacker who steals a
    mobile user''s computer could automatically connect to the organization''s network if the Save This Password check box
    is enabled for the dial-up entry. When a computer joins a domain, a computer account is created. After it joins the domain,
    the computer uses the password for that account to create a secure channel with the domain controller for its domain every
    time that it restarts. Requests that are sent on the secure channel are authenticatedâ€and sensitive information such
    as passwords are encryptedâ€but the channel is not integrity-checked, and not all information is encrypted. If a computer
    is configured to always encrypt or sign secure channel data but the domain controller cannot sign or encrypt any portion
    of the secure channel data, the computer and domain controller cannot establish a secure channel. If the computer is configured
    to encrypt or sign secure channel data when possible, a secure channel can be established, but the level of encryption
    and signing is negotiated. The registry is a database that contains computer configuration information, and much of the
    information is sensitive. An attacker could use this information to facilitate unauthorized activities. To reduce the
    risk of such an attack, suitable ACLs are assigned throughout the registry to help protect it from access by unauthorized
    users. It may be appropriate in some organizations to allow users to install printer drivers on their own workstations.
    However, you should allow only Administrators, not users, to do so on servers, because printer driver installation on
    a server may unintentionally cause the computer to become less stable. A malicious user could install inappropriate printer
    drivers in a deliberate attempt to damage the computer, or a user might accidentally install malicious software that masquerades
    as a printer driver. UIAccess Integrity allows an application to bypass User Interface Privilege Isolation (UIPI) restrictions
    when an application is elevated in privilege from a standard user to an administrator. This is required to support accessibility
    features such as screen readers that are transmitting user interfaces to alternative forms. A process that is started
    with UIAccess rights has the following abilities: â€¢ To set the foreground window. â€¢ To drive any application window
    using SendInput function. â€¢ To use read input for all integrity levels using low-level hooks, raw input, GetKeyState,
    GetAsyncKeyState, and GetKeyboardInput. â€¢ To set journal hooks. â€¢ To uses AttachThreadInput to attach a thread to
    a higher integrity input queue. Some malicious software will attempt to install itself after being given permission to
    run. For example, malicious software with a trusted application shell. The user may have given permission for the program
    to run because the program is trusted, but if they are then prompted for installation of an unknown component this provides
    another way of trapping the software before it can do damage Important information that is kept in real memory may be
    written periodically to the page file to help Windows handle multitasking functions. An attacker who has physical access
    to a server that has been shut down could view the contents of the paging file. The attacker could move the system volume
    into a different computer and then analyze the contents of the paging file. Although this process is time consuming, it
    could expose data that is cached from random access memory (RAM) to the paging file. Caution: An attacker who has physical
    access to the server could bypass this countermeasure by simply unplugging the server from its power source. Session hijacking
    uses tools that allow attackers who have access to the same network as the client or server to interrupt, end, or steal
    a session in progress. Attackers can potentially intercept and modify unsigned SMB packets and then them so that the server
    might perform undesirable actions. Alternatively, the attacker could pose as the server or client after legitimate authentication
    and gain unauthorized access to data. SMB is the resource sharing protocol that is supported by many Windows operating
    systems. SMB signatures authenticate both users and the servers that host the data. If either side fails the authentication
    process, data transmission will not take place. The registry contains sensitive computer configuration information that
    could be used by an attacker to facilitate unauthorized activities. The fact that the default ACLs assigned throughout
    the registry are fairly restrictive and help to protect the registry from access by unauthorized users reduces the risk
    of such an attack. If you disable this policy setting, a user could remain connected to the computer outside of their
    allotted logon hours. An attacker could use source routed packets to obscure their identity and location. Source routing
    allows a computer that sends a packet to specify the route that the packet takes. Session hijacking uses tools that allow
    attackers who have access to the same network as the client or server to interrupt, end, or steal a session in progress.
    Attackers can potentially intercept and modify unsigned SMB packets and then them so that the server might perform undesirable
    actions. Alternatively, the attacker could pose as the server or client after legitimate authentication and gain unauthorized
    access to data. SMB is the resource sharing protocol that is supported by many Windows operating systems. SMB signatures
    authenticate both users and the servers that host the data. If either side fails the authentication process, data transmission
    will not take place. You can enable this policy setting to ensure that the computer will use the most powerful algorithms
    that are available for digital encryption, hashing and signing. Use of these algorithms will minimize the risk of compromise
    of digitally encrypted or signed data by an unauthorized user. Microsoft developed this feature to make it easier for
    users with certain types of physical impairments to log on to computers that run Windows. If users are not required to
    press CTRL+ALT+DEL, they are susceptible to attacks thattempt to intercept their passwords. If CTRL+ALT+DEL is required
    before logon, user passwords are communicated by means of a trusted path. An attacker could install a Trojan horse program
    that looks like the standard Windows logon dialog box and capture the user''s password. The attacker would then be able
    to log on to the compromised account with whatever level of privilege that user has. When back up and restore is used
    it creates a copy of the file system that is identical to the target of the backup. Making regular backups and restore
    volumes is an important part of a your incident response plan, but a malicious user could use a legitimate backup copy
    to get access to information or spoof a legitimate network resource to compromise your enterprise. If a users account
    is compromised or their computer is inadvertently left unsecured the malicious user can use the keys stored for the user
    to access protected resources. You can configure this policy setting so that users must provide a password that is distinct
    from their domain password every time they use a key. This configuration makes it more difficult for an attacker to access
    locally stored user keys, even if the attacker takes control of the userâ€ s computer and determines their logon password.
    Unsigned network traffic is susceptible to man-in-the-middle attacks in which an intruder captures the packets between
    the client and server, modifies them, and then forwards them to the server. For an LDAP server, this susceptibility means
    that an attacker could cause a server to make decisions that are based on false or altered data from the LDAP queries.
    To lower this risk in your network, you can implement strong physical security measures to protect the network infrastructure.
    Also, you can make all types of man-inthe-middle attacks extremely difficult if you require digital signatures on all
    network packets by means of IPsec authentication headers. With the Guest only model, any user who can authenticate to
    your computer over the network does so with guest privileges, which probably means that they will not have write access
    to shared resources on that computer. Although this restriction does increase security, it makes it more difficult for
    authorized users to access shared resources on those computers because ACLs on those resources must include access control
    entries (ACEs) for the Guest account. With the Classic model, local accounts should be password protected. Otherwise,
    if Guest access is enabled, anyone can use those user accounts to access shared system resources. If this policy setting
    is enabled, a user with local access could use the well-known Administrator''s SID to learn the real name of the built-in
    Administrator account, even if it has been renamed. That person could then use the account name to initiate a password
    guessing attack. When a computer running Windows NT, Windows 2000, or later versions of Windows joins a domain, a computer
    account is created. After it joins the domain, the computer uses the password for that account to create a secure channel
    with the domain controller for its domain every time that it restarts. Requests that are sent on the secure channel are
    authenticated—and sensitive information such as passwords are encrypted—but the channel is not integrity-checked, and
    not all information is encrypted. If a computer is configured to always encrypt or sign secure channel data but the domain
    controller cannot sign or encrypt any portion of the secure channel data, the computer and domain controller cannot establish
    a secure channel. If the computer is configured to encrypt or sign secure channel data when possible, a secure channel
    can be established, but the level of encryption and signing is negotiated. Elevation prompt dialog boxes can be spoofed,
    causing users to disclose their passwords to malicious software. Null sessions are a weakness that can be exploited through
    shares (including the default shares) on computers in your environment. It is recommended that user passwords be configured
    to expire periodically. Users will need to be warned that their passwords are going to expire, or they may inadvertently
    be locked out of the computer when their passwords expire. This condition could lead to confusion for users who access
    the network locally, or make it impossible for users to access your organizationâ€ s network through dial-up or virtual
    private network (VPN) connections. Blank passwords are a serious threat to computer security and should be forbidden through
    both organizational policy and suitable technical measures. In fact, the default settings for Windows Server 2003 Active
    Directory® directory service domains require complex passwords of at least seven characters. However, if users with the
    ability to create new accounts bypass your domain-based password policies, they could create accounts with blank passwords.
    For example, a user could build a stand-alone computer, create one or more accounts with blank passwords, and then join
    the computer to the domain. The local accounts with blank passwords would still function. Anyone who knows the name of
    one of these unprotected accounts could then use it to log on. One of the risks that the User Account Control feature
    introduced with Windows Vista is trying to mitigate is that of malicious software running under elevated credentials without
    the user or administrator being aware of its activity. An attack vector for these programs was to discover the password
    of the account named "Administrator" because that user account was created for all installations of Windows. To address
    this risk, in Windows Vista the built-in Administrator account is disabled. In a default installation of a new computer,
    accounts with administrative control over the computer are initially set up in one of two ways: â€¢ If the computer is
    not joined to a domain, the first user account you create has the equivalent permissions as a local administrator. â€¢
    If the computer is joined to a domain, no local administrator accounts are created. The Enterprise or Domain Administrator
    must log on to the computer and create one if a local administrator account is warranted. Once Windows Vista is installed,
    the built-in Administrator account may be enabled, but we strongly recommend that this account remain disabled. Because
    Windows is case-insensitive but the POSIX subsystem will support case sensitivity, failure to enable this policy setting
