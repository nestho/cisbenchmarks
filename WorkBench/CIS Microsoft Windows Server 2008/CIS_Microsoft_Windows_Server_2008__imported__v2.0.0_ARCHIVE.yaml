- id: 1.2.2.1.3
  title: Security 1.2.2.1.3.1 Set 'Retain old events' to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This policy setting controls Event Log behavior when the log file reaches its maximum size. Old events may
    or may not be retained according to the Backup log automatically when full policy setting. This policy requires Windows
    Vista or later versions of Windows. This policy setting specifies the maximum size of the log file in kilobytes. If you
    enable this policy setting, you can configure the maximum log file size to be between 1 megabyte (1024 kilobytes) and
    2 terabytes (2147483647 kilobytes) in kilobyte increments. If you disable or do not configure this policy setting, the
    maximum size of the log file maximum size will be set to the local configuration value. This value can be changed by the
    local administrator using the log properties dialog and it defaults to 20 megabytes. For backwards compatibility the same
    setting can also be configured at Computer Configuration\Windows Settings\Security Settings\Event Log, if set at both
    locations this one will take precedence. This policy setting specifies whether the computer that is about to host the
    remote connection will enforce an encryption level for all data sent between it and the client computer for the remote
    session. This policy setting specifies whether Terminal Services always prompts the client computer for a password upon
    connection. You can use this policy setting to enforce a password prompt for users who log on to Terminal Services, even
    if they already provided the password in the Remote Desktop Connection client. By default, Terminal Services allows users
    to automatically log on if they enter a password in the Remote Desktop Connection client. The Always prompt client for
    password upon connection setting is configured to Enabled for both of the environments that are discussed in this guide.
    Note If you do not configure this policy setting, the local computer administrator can use the Terminal Services Configuration
    tool to either allow or prevent passwords from being automatically sent. This policy setting prevents users from sharing
    the local drives on their client computers to Terminal Servers that they access. Mapped drives appear in the session folder
    tree in Windows Explorer in the following format: \\TSClient\$ If local drives are shared they are left vulnerable to
    intruders who want to exploit the data that is stored on them. This policy setting allows you to control if users can
    connect to a computer using Terminal Services or Remote Desktop. This policy setting helps prevent Terminal Services clients
    from saving passwords on a computer. Note If this policy setting was previously configured as Disabled or Not configured,
    any previously saved passwords will be deleted the first time a Terminal Services client disconnects from any server.'
  rationale: 'If new events are not recorded it may be difficult or impossible to determine the root cause of system problems
    or the unauthorized activities of malicious users If you significantly increase the number of objects to audit in your
    organization, there is a risk that the Security log will reach its capacity and force the computer to shut down if you
    enabled the Audit: Shut down system immediately if unable to log security audits setting. If such a shutdown occurs, the
    computer will be unusable until an administrator clears the Security log. To prevent such a shutdown, you can disable
    the Audit: Shut down system immediately if unable to log security audits setting that is described in Chapter 5, "Security
    Options," and increase the Security log size. Alternatively, you can configure automatic log rotation as described in
    the Microsoft Knowledge Base article "The event log stops logging events before reaching the maximum log size" at http://support.microsoft.com/default.aspx?kbid=312571.
    If Terminal Server client connections are allowed that use low level encryption, it is more likely that an attacker will
    be able to decrypt any captured Terminal Services network traffic. Users have the option to store both their username
    and password when they create a new Remote Desktop connection shortcut. If the server that runs Terminal Services allows
    users who have used this feature to log on to the server but not enter their password, then it is possible that an attacker
    who has gained physical access to the user''s computer could connect to a Terminal Server through the Remote Desktop connection
    shortcut, even though they may not know the user''s password. Data could be forwarded from the user''s Terminal Server
    session to the user''s local computer without any direct user interaction. Any account with the Allow log on through Terminal
    Services user right can log on to the remote console of the computer. If you do not restrict access to legitimate users
    who need to log on to the console of the computer, unauthorized users could download and execute malicious code to elevate
    their privileges. An attacker with physical access to the computer may be able to break the protection guarding saved
    passwords. An attacker who compromises a user''s account and connects to their computer could use saved passwords to gain
    access to additional hosts.'
  impact: When this policy setting is enabled and a log file reaches its maximum size, new events are not written to the log
    and are lost. When this policy setting is disabled and a log file reaches its maximum size, new events overwrite old events.
    When event logs fill to capacity, they will stop recording information unless the retention method for each is set so
    that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent
    data, you can configure the retention method so that older events are overwritten as needed. The consequence of this configuration
    is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they
    can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat
    reduced if you automate the archival and backup of event log data. Ideally, all specifically monitored events should be
    sent to a server that uses Microsoft Operations Manager (MOM) or some other automated monitoring tool. Such a configuration
    is particularly important because an attacker who successfully compromises a server could clear the Security log. If all
    events are sent to a monitoring server, then you will be able to gather forensic information about the attacker's activities.
    Clients that do not support 128-bit encryption will be unable to establish Terminal Server sessions. Users will always
    have to enter their password when they establish new Terminal Server sessions. Drive redirection will not be possible.
    If this setting is enabled legitimate users will be unable to use Terminal Services or Remote Desktop, this could make
    it more difficult for help desk technicians to troubleshoot and resove problems remotely. It would also make it impossible
    to use Terminal Services for hosting shared applications. If you enable this policy setting, the password saving checkbox
    is disabled for Terminal Services clients and users will not be able to save passwords.
