    method for each is set so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the
    risk of loss of recent data, you can configure the retention method so that older events are overwritten as needed. The
    consequence of this configuration is that older events will be removed from the logs. Attackers can take advantage of
