    severity: medium
- id: '1.7'
  title: RACF-ES-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF emergency USERIDs must be properly defined. GROUP ID: V-223652 RULE ID: SV-223652r958508'
  rationale: Emergency accounts are privileged accounts that are established in response to crisis situations where the need
    for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by the organization's system administrators when network or normal logon/access is not available).
    Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in
    response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling time period
    may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account
    should be established for privileged users who need long-term maintenance accounts. To address access requirements, many
    operating systems can be integrated with enterprise-level authentication/access mechanisms that meet or exceed access
    control policy requirements.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Ask the system administrator for a list of all emergency userids available to the site

    along with the associated function of each userid.

    If there are no emergency logonids defined ask the system administrator for an

    alternate documented procedure to handle emergencies.

    If there are no emergency logonids and no documented emergency procedure this is a

    finding.

    Execute an access list for each emergency userid.

    If emergency userids exist at a minimum an emergency logonid will exist with the

    security administration attributes specified in accordance with the following

    requirements.

    If the following guidance is not true, this is a finding.

    At least one userid exists to perform RACF security administration. These userids are

    defined to RACF with the system-SPECIAL attribute. They must not have the

    OPERATIONS attribute.

    If any userids exist to perform operating system functions, they are defined without any

    RACF security administration privileges. These userids are defined to RACF with the

    system-OPERATIONS attribute, and FULL access to all DASD volumes. They must not

    have the SPECIAL attribute.

    NOTE: A user who has the system-OPERATIONS attribute has FULL access

    authorization to all RACF-protected resources in the DASDVOL/GDASDVOL resource

    classes. However, if their userid or any associated group (i.e., default or connect) is in

    the access list of a resource profile, they will only have the access specified in the

    access list.

    All emergency userids are defined to RACF and SYS1.UADS.

    All emergency logonid/logonid(s) are to be implemented with logging to provide an audit

    trail of their activities. This is accomplished with the UAUDIT attribute.

    All emergency logonid/logonid(s) will have distinct, different passwords in SYS1.UADS

    and in RACF, and the site is to establish procedures to ensure that the passwords differ.

    The password for any ID in SYS1.UADS is never to match the password for the same

    ID in RACF.

    All emergency logonid/logonid(s) will have documented procedures to provide a

    mechanism for the use of the IDs. Their release for use is to be logged, and the log is to

    be maintained by the ISSO. When an emergency logonid is released for use, its

    password is to be reset by the ISSO within 12 hours.'
  remediation: 'Configure emergency USERIDs to have access granted only authorizes those

    resources required to support the specific functions of either DASD Recovery or System

    Administration.

    Ensure the following items are in effect regarding emergency userids:

    At a minimum an emergency userids will exists with the security administration

    attributes specified in accordance with the following requirements:

    • Userids exist to perform RACF security administration only. These userids are

    defined to RACF with the system-SPECIAL attribute. They must not have the

    OPERATIONS attribute. Emergency userids will have either SPECIAL or

    OPERATIONS but not both.

    • Userids can be defined to perform operating system functions. Such userids

    must be defined without any RACF security administration privileges. These

    userids are defined to RACF with the system-OPERATIONS attribute, FULL

    access to all DASD volumes resources as well as the FACILITY Class

    STGADMN profiles. They must not have the SPECIAL attribute.

    NOTE: A user who has the system-OPERATIONS attribute has FULL access

    authorization to all RACF-protected resources in the DASDVOL/GDASDVOL resource

    classes. However, if their userid or any associated group (i.e., default or connect) is in

    the access list of a resource profile, they will only have the access specified in the

    access list since access lists override OPERATIONS.

    • Userids exist to perform RACF security administration only. These userids are

    defined to RACF with the system-SPECIAL attribute. They must not have the

    OPERATIONS attribute. Emergency userids will have either SPECIAL or

    OPERATIONS but not both.

    • All emergency userids are defined to RACF and SYS1.UADS. See TSO

    Command Ref for info on adding users to UADS.

    • All emergency userids are to be implemented with logging to provide an audit

    trail of their activities. This is accomplished with the UAUDIT attribute via the

    command:

    ALU UAUDIT

    • All emergency userids will have distinct, different passwords in SYS1.UADS and

    in RACF, and the site is to establish procedures to ensure that the passwords

    differ. The password for any ID in SYS1.UADS is never to match the password

    for the same ID in RACF.

    • All emergency userids will have documented procedures - such as a COOP Plan

    - to provide a mechanism for the use of the IDs. Their release for use is to be

    logged, and the log is to be maintained by the ISSO. When an emergency

    userids is released for use, its password is to be reset by the ISSO within 12

    hours.

    If no emergency userids are in use on the system develop and document a procedure to

    manage emergencies access to the system.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for a list of all emergency userids available to the site

      along with the associated function of each userid.

      If there are no emergency logonids defined ask the system administrator for an

      alternate documented procedure to handle emergencies.

      If there are no emergency logonids and no documented emergency procedure this is a

      finding.

      Execute an access list for each emergency userid.

      If emergency userids exist at a minimum an emergency logonid will exist with the

      securi'
    severity: medium
- id: '1.8'
  title: RACF-ES-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF SETROPTS LOGOPTIONS must be properly configured. GROUP ID: V-223653 RULE ID: SV-223653r958368'
  rationale: 'Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create an account. Auditing account creation
    actions provides logging that can be used for forensic purposes. To address access requirements, many operating systems
    may be integrated with enterprise level authentication/access/auditing mechanisms that meet or exceed access control policy
    requirements. Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000038-GPOS-00016, SRG-OS000039-GPOS-00017, SRG-OS-000040-GPOS-00018,
    SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021, SRG-OS-000240-GPOS-00090, SRG-OS-000241GPOS-00091, SRG-OS-000392-GPOS-00172,
    SRG-OS-000458-GPOS-00203, SRGOS-000461-GPOS-00205, SRG-OS-000462-GPOS-00206, SRG-OS-000463-GPOS00207, SRG-OS-000465-GPOS-00209,
    SRG-OS-000466-GPOS-00210, SRG-OS000470-GPOS-00214, SRG-OS-000471-GPOS-00215, SRG-OS-000471-GPOS-00216, SRG-OS-000472-GPOS-00217,
    SRG-OS-000473-GPOS-00218, SRG-OS-000474GPOS-00219, SRG-OS-000475-GPOS-00220, SRG-OS-000476-GPOS-00221, SRGOS-000477-GPOS-00222'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    Verify that the following LOGOPTIONS are specified:

    LOGOPTIONS "FAILURES" CLASSES = <all the classes listed in the "ACTIVE" class

    as a minimum>

    LOGOPTIONS "NEVER" CLASSES = NONE

    The other LOGOPTIONS may be site determined.

    If the LOGOPTIONS are not set as described above, this is a finding.'
  remediation: 'Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    Ensure that the following LOGOPTIONS are specified:

    LOGOPTIONS "FAILURES" CLASSES = <all the classes listed in the "ACTIVE" class

    as a minimum>

    LOGOPTIONS "NEVER" CLASSES = NONE

    The other LOGOPTIONS may be site determined.'
  checks:
  - type: manual_review
    info: 'Evaluate the impact associated with implementation of the control option. Develop a

