  title: RACF-TC-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS TCP/IP AT-TLS policy must be properly configured in Policy Agent. GROUP ID: V-252553 RULE ID: SV-252553r958472'
  rationale: If events associated with nonlocal administrative access or diagnostic sessions are not logged, a major tool
    for assessing and investigating attacks would not be available. This requirement addresses auditing-related issues associated
    with maintenance tools used specifically for diagnostic and repair actions on organizational information systems. Nonlocal
    maintenance and diagnostic activities are conducted by individuals communicating through an external network (e.g., the
    internet) or an internal network. Local maintenance and diagnostic activities are carried out by individuals physically
    present at the information system or information system component and not communicating across a network connection. This
    requirement applies to hardware/software diagnostic test equipment or tools. This requirement does not cover hardware/software
    components that may support information system maintenance, yet are a part of the system; for example, the software implementing
    "ping," "ls," "ipconfig," or the hardware and software implementing the monitoring port of an Ethernet switch.
  impact: ''
