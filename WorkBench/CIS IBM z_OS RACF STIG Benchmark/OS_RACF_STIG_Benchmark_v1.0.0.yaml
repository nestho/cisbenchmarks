    security setup requirements for the Security Configuration Assistant service is restricted

    to appropriate users, this is not a finding.'
  remediation: 'Review the requirements for security setup requirements for the Security Configuration

    Assistant service and the Security Configuration Assistant service in the zOSMF

    Configuration Guide.

    Configure access for resources in accordance with the site security plan.'
