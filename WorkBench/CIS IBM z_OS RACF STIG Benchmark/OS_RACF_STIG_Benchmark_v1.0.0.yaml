- id: '1.137'
  title: RACF-OS-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS PARMLIB CLOCKxx must have the Accuracy PARM properly coded. GROUP ID: V-223776 RULE ID: SV-223776r998371'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Synchronizing internal information system clocks provides uniformity of time stamps for information systems
    with multiple system clocks and systems connected over a network. Organizations should consider setting time periods for
    different types of systems (e.g., financial, legal, or mission-critical systems). Organizations should also consider endpoints
    that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
    This requirement is related to the comparison done every 24 hours in SRG-OS-000355 because a comparison must be done in
    order to determine the time difference.
