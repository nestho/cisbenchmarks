  audit_raw: 'Refer to the JESPARM member of SYS1.PARMLIB.

    Review the JES2 parameters to determine the localnodeid by searching for OWNNODE

    in the NJEDEF statement, and then searching for NODE(nnnn) (where nnnn is the

    value specified by OWNNODE). The NAME parameter value specified on this NODE

    statement is the localnodeid. Another method is to issue the JES2 command $D

    NODE,NAME,OWNNODE=YES to obtain the NAME of the OWNNODE.

    From the ISPF Command Shell enter:

    RL JESSPOOL *

    Review the following resources defined to the JESSPOOL resource class:

    localnodeid.JES2.$TRCLOG.taskid..JESTRACE

    localnodeid.+MASTER+.SYSLOG.jobid..SYSLOG or

    localnodeid.+BYPASS+.SYSLOG.jobid.-.SYSLOG

    NOTE: These resource profiles may be more generic as long as they pertain directly to

    the JESTRACE and SYSLOG data sets. For example:

    localnodeid.+BYPASS+...*.SYSLOG

    If Userid(s) associated with external writer(s) have complete access, this is not a

    finding.

    Note: An external writer is an STC that removes data sets from the JES spool. In this

    case, it is responsible for archiving the JESTRACE and SYSLOG data sets. The STC

    default name is XWTR and the external writer program is called IASXWR00.

    If Systems personnel and security administrators responsible for diagnosing JES2 and

    z/OS problems have complete access, this is not a finding.

    If Application Development and Application Support personnel responsible for

    diagnosing application problems have READ access to the SYSLOG resource, this is

    not a finding.'
  remediation: 'Configure RACF access authorization for resources defined to the JESTRACE and

    SYSLOG resources in the JESSPOOL resource class to be restricted to the appropriate

    personnel a detailed below.

    Review the following resources defined to the JESSPOOL resource class:

    localnodeid.JES2.$TRCLOG.taskid..JESTRACE

    localnodeid.+MASTER+.SYSLOG.jobid..SYSLOG or

    localnodeid.+BYPASS+.SYSLOG.jobid.*.SYSLOG

    Note: These resource profiles may be more generic as long as they pertain directly to

    the JESTRACE and SYSLOG data sets. For example:

    localnodeid.JES2.$TRCLOG..**

    localnodeid.+MASTER+.SYSLOG..** or

    localnodeid.+BYPASS+.SYSLOG.*.**

    Note: Review the JES2 parameters to determine the localnodeid by searching for

    OWNNODE in the NJEDEF statement, and then searching for NODE(nnnn) (where

    nnnn is the value specified by OWNNODE). The NAME parameter value specified on

    this NODE statement is the localnodeid. Another method is to issue the JES2 command

    $D NODE,NAME,OWNNODE=YES to obtain the NAME of the OWNNODE.

    Ensure that access authorization for the resources mentioned above is restricted to the

    following:

    Userid(s) associated with external writer(s) can have complete access.

    Note: An external writer is a STC that removes data sets from the JES spool. In this

    case, it is responsible for archiving the JESTRACE and SYSLOG data sets. The STC

    default name is XWTR and the external writer program is called IASXWR00.

    Systems personnel and security administrators responsible for diagnosing JES2 and

    z/OS problems can have complete access.

    Application Development and Application Support personnel responsible for diagnosing

