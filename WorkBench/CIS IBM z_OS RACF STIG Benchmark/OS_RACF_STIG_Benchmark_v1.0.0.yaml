- id: '1.45'
  title: RACF-ES-000410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS MCS consoles access authorization(s) for CONSOLE resource(s) must be properly protected. GROUP ID:
    V-223689 RULE ID: SV-223689r958472'
  rationale: 'MCS consoles can be used to issue operator commands. Failure to properly control access to MCS consoles could
    result in unauthorized personnel issuing sensitive operator commands. This exposure may threaten the integrity and availability
    of the operating system environment, and compromise the confidentiality of customer data. Preventing non-privileged users
    from executing privileged functions mitigates the risk that unauthorized individuals or processes may gain unnecessary
    access to information or privileges. Privileged functions include, for example, establishing accounts, performing system
    integrity checks, or administering cryptographic key management activities. Nonprivileged users are individuals that do
    not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code
    protection mechanisms are examples of privileged functions that require protection from non-privileged users. Satisfies:
    SRG-OS-000080-GPOS-00048, SRG-OS-000324-GPOS-00125'
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'Verify the CONSOLxx member of SYS1.PARMLIB.console is defined to RACF with a

    corresponding profile in the CONSOLE resource class.

    If each console is defined to RACF with a corresponding profile in the CONSOLE

    resource class, this is not a finding.

    If the userid associated with each console has READ access to the corresponding

    resource defined in the CONSOLE resource class, this is not a finding.

    If access authorization for CONSOLE resources restricts READ access to operations

    and system programming personnel or authorized personnel, this is not a finding.'
  remediation: 'Define all MCS consoles to the CONSOLE resource class and configure READ access

    to be limited to operators and system programmers.

    Configure the MCS console resources defined to z/OS and the ESM to conform to those

    outlined below.

    Each console defined in the CONSOLxx parmlib member is defined to RACF with a

    corresponding profile in the CONSOLE resource class. See the IBM zOS

    OPERATIONS AND PLANNING guide for further information.

    Each CONSOLE profile is defined with UACC(NONE).

    Example:

    RDEF CONSOLE MMDMST UACC(NONE) OWNER(syspsmpl)

    RDEF CONSOLE MMD041 UACC(NONE) OWNER(syspsmpl)

    RDEF CONSOLE MMDSCN UACC(NONE) OWNER(syspsmpl)

    RDEF CONSOLE ** UACC(NONE) OWNER(syspsmpl) DATA(** represents all

    consoles not specifically defined)

    Do not permit any user or group access to the ** profile. If a new console is added to the

    CONSOLxx member it will be covered by this profile and a subsequent error will display

    in the log, which will allow identification of the undefined console.

    The userid associated with each console will have READ access to the corresponding

    resource defined in the CONSOLE resource class. A sample command file to

    accomplish this is shown here:

    PE MMDMST CL(CONSOLE) ID(mmdmst)

    PE MMDSCN CL(CONSOLE) ID(mmdscn)

    PE MMD041 CL(CONSOLE) ID(mmd041)

    Access authorization for CONSOLE resources restricts READ access to operations and

    system programming personnel or authorized personnel. A sample command file

    showing a permission of READ access for sysprogs and operators is shown here:

    PE MMDMST CL(CONSOLE) ID(syspsmpl opersmpl)

    PE MMDSCN CL(CONSOLE) ID(syspsmpl opersmpl)

    PE MMD041 CL(CONSOLE) ID(syspsmpl opersmpl)'
  checks:
  - type: manual_review
    info: 'Verify the CONSOLxx member of SYS1.PARMLIB.console is defined to RACF with a

      corresponding profile in the CONSOLE resource class.

      If each console is defined to RACF with a corresponding profile in the CONSOLE

      resource class, this is not a finding.

      If the userid associated with each console has READ access to the corresponding

      resource defined in the CONSOLE resource class, this is not a finding.

      If access authorization for CONSOLE resources restricts READ access to operations

      and system programm'
    severity: medium
- id: '1.46'
  title: RACF-ES-000420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF must limit WRITE or greater access to the JES2 System data sets (e.g., Spool, Checkpoint, and Initialization
    parameters) to system programmers only. GROUP ID: V-223690 RULE ID: SV-223690r958472'
  rationale: 'To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement. Satisfies: SRG-OS-000080-GPOS-00048,
    SRG-OS-000259-GPOS-00100, SRG-OS000324-GPOS-00125'
  impact: ''
  references: []
  page_start: 117
  audit_raw: 'The ESM data set rules for the JES2 System data sets (e.g., Spool, Checkpoint, and

    Initialization parameters) do not restrict WRITE or greater access to only z/OS systems

    programming personnel.

    The ESM data set rules for the JES2 System data sets (e.g., Spool, Checkpoint, and

    Initialization parameters) allow inappropriate access not documented and approved by

    ISSO.

    If both of the above are untrue, this is not a finding.

    If either of the above is true, this is a finding.'
  remediation: 'Evaluate the impact of correcting the deficiency. Develop a plan of action and

    implement the changes as required to protect JES2 System datasets (spool,

    checkpoint, and parmlib datasets).

    Configure WRITE or greater access to JES2 System datasets (spool, checkpoint, and

    parmlib datasets) to be limited to system programmers only.

    Access other than this should be documented and approved by the ISSO (for example,

    all SYS1.HASP* data sets).'
  checks:
  - type: manual_review
    info: 'The ESM data set rules for the JES2 System data sets (e.g., Spool, Checkpoint, and

      Initialization parameters) do not restrict WRITE or greater access to only z/OS systems

