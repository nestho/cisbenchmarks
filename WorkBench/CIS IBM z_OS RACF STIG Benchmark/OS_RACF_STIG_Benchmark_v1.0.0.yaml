      -All started task userids are connected to a valid STC group ID.

      -Only userids associated with STCs are connected to STC group IDs.

      -All STC userids are de'
    severity: medium
- id: '1.74'
  title: RACF-ES-000740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM RACF Automatic Data Set Protection (ADSP) SETROPTS value must be set to NOADSP. GROUP ID: V-223721
    RULE ID: SV-223721r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 173
  audit_raw: 'From the ISPF Command Shell enter:

    SETROPTS LIST

    If the ADSP value is NOT IN EFFECT, this is not a finding.

    Note: NOADSP is the required setting. In the SETROPTS LIST output this will display

    as AUTOMATIC DATASET PROTECTION IS NOT IN EFFECT.

    If the ADSP value is IN EFFECT, this is a finding.'
  remediation: 'Configure ADSP SETROPTS value to be set to NOADSP.

    Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    NOADSP is set with the command SETR NOADSP.'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      SETROPTS LIST

      If the ADSP value is NOT IN EFFECT, this is not a finding.

      Note: NOADSP is the required setting. In the SETROPTS LIST output this will display

      as AUTOMATIC DATASET PROTECTION IS NOT IN EFFECT.

      If the ADSP value is IN EFFECT, this is a finding.'
    severity: medium
- id: '1.75'
  title: RACF-ES-000750
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF user accounts must uniquely identify system users. GROUP ID: V-223722 RULE ID: SV-223722r998345'
  rationale: 'To assure individual accountability and prevent unauthorized access, organizational users must be individually
    identified and authenticated. A group authenticator is a generic account used by multiple individuals. Use of a group
    authenticator alone does not uniquely identify individual users. Examples of the group authenticator is the UNIX OS "root"
    user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account. For example, the UNIX and
    Windows operating systems offer a "switch user" capability allowing users to authenticate with their individual credentials
    and, when needed, switch to the administrator role. This method provides for unique individual authentication prior to
    using a group authenticator. Users (and any processes acting on behalf of users) need to be uniquely identified and authenticated
    for all accesses other than those accesses explicitly identified and documented by the organization, which outlines specific
    user actions that can be performed on the operating system without identification or authentication. Requiring individuals
    to be authenticated with an individual authenticator prior to using a group authenticator allows for traceability of actions,
    as well as adding an additional level of protection of the actions that can be taken with group account knowledge. Satisfies:
    SRG-OS-000104-GPOS-00051, SRG-OS-000109-GPOS-00056, SRG-OS000125-GPOS-00065, SRG-OS-000121-GPOS-00062'
  impact: ''
  references: []
  page_start: 175
  audit_raw: 'Obtain a list of all userids that are shared among multiple users (i.e., not uniquely

    identified system users).

    If there are no shared userids on this domain, this is not a finding.

    If there are shared userids on this domain, this is a finding.'
  remediation: 'Identify user accounts defined to the ESM that are being shared among multiple users.

    This may require interviews with appropriate system-level support personnel. Remove

    the shared user accounts from the ESM.'
  checks:
  - type: manual_review
    info: 'Obtain a list of all userids that are shared among multiple users (i.e., not uniquely

      identified system users).

      If there are no shared userids on this domain, this is not a finding.

      If there are shared userids on this domain, this is a finding.'
    severity: medium
- id: '1.76'
  title: RACF-ES-000760
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM RACF INACTIVE SETROPTS value must be set to 35 days. GROUP ID: V-223723 RULE ID: SV-223723r998346'
  rationale: Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier
    and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access
    to their user account has been obtained. Operating systems need to track periods of inactivity and disable application
    identifiers after 35 days of inactivity.
  impact: ''
  references: []
  page_start: 177
  audit_raw: 'From a z/OS command input screen enter:

    List SETRopts

    If the INACTIVE value is set properly In the message "INACTIVE USERIDS ARE

    BEING AUTOMATICALLY REVOKED AFTER xxx DAYS.", where xxx is a value "35" or

    less, this is not a finding.'
  remediation: 'Configure the INACTIVE SETROPTS value to a value that is "35" or less. INACTIVE

    specifies the number of days that a USERID can remain unused and still be considered

    valid.'
  checks:
  - type: manual_review
    info: 'From a z/OS command input screen enter:

      List SETRopts

      If the INACTIVE value is set properly In the message "INACTIVE USERIDS ARE

      BEING AUTOMATICALLY REVOKED AFTER xxx DAYS.", where xxx is a value "35" or

      less, this is not a finding.'
    severity: medium
- id: '1.77'
  title: RACF-ES-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF PASSWORD(RULEn) SETROPTS value(s) must be properly set. GROUP ID: V-223724 RULE ID: SV-223724r998347'
  rationale: 'The shorter the password, the lower the number of possible combinations that need to be tested before the password
    is compromised. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts
    at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how
    long it takes to crack a password. Use of more characters in a password helps to exponentially increase the time and/or
    resources required to compromise the password. Satisfies: SRG-OS-000069-GPOS-00037, SRG-OS-000078-GPOS-00046'
  impact: ''
  references: []
  page_start: 178
  audit_raw: 'From the ISPF Command Shell enter:

    SETRopts

    If the following options are specified, this is not a finding.

    Every PASSWORD(RULE) under "INSTALLATION PASSWORD SYNTAX RULES" is

    defined with the values shown below:

    RULE n LENGTH(8) xxxxxxxx

    The following options are in effect under "PASSWORD PROCESSING OPTIONS":

    "MIXED CASE PASSWORD SUPPORT IS IN EFFECT"

    "SPECIAL CHARACTERS ARE ALLOWED."'
  remediation: 'Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    For z/OS release 1.13 and 1.14 PTF UA90720 must be applied.

    For z/OS Release 2.1 PTF UA90721 must be applied.

    The RACF Command SETR LIST will show the status of RACF Controls including

    PASSWORD SYNTAX RULEs.

    Setting the password syntax to all Mixed Case Alphanumeric and Special Characters is

    activated with the commands:

    setr password(mixedcase)

    setr password(specialchars)

    setr password(rulen(length(8) mixedall(1:8))'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      SETRopts

      If the following options are specified, this is not a finding.

      Every PASSWORD(RULE) under "INSTALLATION PASSWORD SYNTAX RULES" is

      defined with the values shown below:

      RULE n LENGTH(8) xxxxxxxx

      The following options are in effect under "PASSWORD PROCESSING OPTIONS":

      "MIXED CASE PASSWORD SUPPORT IS IN EFFECT"

      "SPECIAL CHARACTERS ARE ALLOWED."'
    severity: medium
- id: '1.78'
  title: RACF-ES-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF exit ICHPWX01 must be installed and properly configured. GROUP ID: V-223725 RULE ID: SV-223725r998349'
  rationale: 'Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Satisfies: SRG-OS-000070-GPOS-00038, SRG-OS-000071-GPOS-00039, SRG-OS000072-GPOS-00040, SRG-OS-000266-GPOS-00101,
    SRG-OS-000480-GPOS-00225'
  impact: ''
  references: []
  page_start: 180
  audit_raw: 'From a system console screen, issue the following modify command:

    F AXR,IRRPWREX LIST

    Review the results of the modify command.

    If the following options are listed, this is not a finding.

    -The number of required character types is 4

    (ensures that at least one uppercase, one lowercase, one number, and one special

    character is used in password)

    -The user''s name cannot be contained in the password.

    (Only three consecutive characters of the user''s name are allowed)

    -The minimum word length checked is eight.

    -The user ID cannot be contained in the password.

    (Only three consecutive characters of the user ID are allowed)

    -Only three unchanged positions of the current password are allowed.

    (These positions need to be consecutive to cause a failure and this check is not case

    sensitive)

    -No more than zero pairs of repeating characters are allowed.

    (This check is not case sensitive)

    -A minimum list of 33 restricted prefix strings is being checked:

    APPL APR AUG ASDF BASIC CADAM DEC DEMO FEB FOCUS GAME IBM JAN JUL

