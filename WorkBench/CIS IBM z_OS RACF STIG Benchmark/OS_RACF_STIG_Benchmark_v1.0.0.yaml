- id: '1.147'
  title: RACF-OS-000310
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'IBM z/OS must not have duplicated sensitive utilities and/or programs existing in APF libraries. GROUP ID:
    V-223787 RULE ID: SV-223787r958478'
  rationale: Removal of unneeded or non-secure functions, ports, protocols, and services mitigate the risk of unauthorized
    connection of devices, unauthorized transfer of information, or other exploitation of these resources.
  impact: ''
  references: []
  page_start: 324
  audit_raw: 'From an ISPF Command line enter:

    TSO ISRDDN APF

    An APF List results

    On the command line enter:

    DUPlicates (make sure there is appropriate access; if there is not you may receive

    insufficient access errors)

    If any of the list of Sensitive Utilities exist in the duplicate APF modules return, this is a

    finding.

    The following list contains Sensitive Utilities that will be checked.

    AHLGTF AMASPZAP AMAZAP AMDIOCP AMZIOCP

    BLSROPTR CSQJU003 CSQJU004 CSQUCVX CSQUTIL

    CSQ1LOGP DEBE DITTO FDRZAPOP GIMSMP

    HHLGTF ICKDSF ICPIOCP IDCSC01 IEHINITT

    IFASMFDP IGWSPZAP IHLGTF IMASPZAP IND$FILE

    IOPIOCP IXPIOCP IYPIOCP IZPIOCP WHOIS

    L052INIT TMSCOPY TMSFORMT TMSLBLPR TMSMULV

    TMSREMOV TMSTPNIT TMSUDSNB'
  remediation: 'Review and ensure that duplicate sensitive utility(ies) and/or program(s) do not exist in

    APF-authorized libraries. Identify all versions of the sensitive utilities contained in APFauthorized libraries listed
    in the above check. In cases where duplicates exist, ensure

    no exposure has been created and written justification has been filed with the ISSO.

    Comparisons among all the APF libraries will be done to ensure that an exposure is not

    created by the existence of identically named modules. Address any sensitive utility

    concerns so that the function can be restricted as required.'
  checks:
