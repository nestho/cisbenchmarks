    parameters impacting the security state of the system, including the parameters required to satisfy other security control
    requirements. Security-related parameters include, for example registry settings; account, file, directory permission
    settings; and settings for functions, ports, protocols, services, and remote connections.
  impact: ''
  references: []
  page_start: 378
  audit_raw: 'Review the logical parmlib data sets, for example SYS1.PARMLIB(IGDSMSxx), to

    identify the fully qualified file names for the following SMS data sets:

    Active Control Data Set (ACDS)

    Communications Data Set (COMMDS)

    If the COMMDS and ACDS SMS data sets identified above reside on different volumes,

    this is not a finding.

    If the COMMDS and ACDS SMS data sets identified above are collocated on the same

    volume, this is a finding.'
  remediation: 'Allocate the primary and backup SMS Control data sets on separate volumes.

    Source Control Data Set (SCDS) contains an SMS configuration, which defines a

    storage management policy.

    Active Control Data Set (ACDS) contains a copy of the most recently activated

    configuration. All systems in an SMS complex use this configuration to manage storage.

    Communications Data Set (COMMDS) contains the name of the ACDS containing the

    currently active storage management policy, the current utilization statistics for each

    system managed volume, and other system information.

    The ACDS data set will reside on a different volume than the COMMDS data set.

    Allocate backup copies of the ADCS and COMMDS data sets on a different shared

    volume from the primary ACDS and COMMDS data sets.'
  checks:
