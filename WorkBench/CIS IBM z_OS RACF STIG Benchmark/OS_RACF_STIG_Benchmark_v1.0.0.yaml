- id: '1.133'
  title: RACF-OS-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS BUFUSEWARN in the SMFPRMxx must be properly set. GROUP ID: V-223772 RULE ID: SV-223772r971542'
  rationale: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit
    logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit
    capability, and system operation may be adversely affected. Audit processing failures include software/hardware errors,
    failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement applies
    to each audit data storage repository (i.e., distinct information system component where audit records are stored), the
    centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both. Satisfies:
    SRG-OS-000343-GPOS-00134, SRG-OS-000344-GPOS-00135, SRG-OS000046-GPOS-00022'
  impact: ''
  references: []
  page_start: 300
  audit_raw: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

    SMFPRMxx member in SYS1.PARMLIB.

    If BUFUSEWARN is set for "75" (75%) or less, this is not a finding.'
  remediation: Configure the BUFUSEWARN statement in SMFPRMxx to "75" (75%) or less.
  checks:
  - type: manual_review
    info: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

      SMFPRMxx member in SYS1.PARMLIB.

      If BUFUSEWARN is set for "75" (75%) or less, this is not a finding.'
    severity: medium
- id: '1.134'
  title: RACF-OS-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS NOBUFFS in SMFPRMxx must be properly set (default is MSG). GROUP ID: V-223773 RULE ID: SV-223773r1038966'
  rationale: 'It is critical that when the operating system is at risk of failing to process audit logs as required, it takes
    action to mitigate the failure. Audit processing failures include: software/hardware errors; failures in the audit capturing
    mechanisms; and audit storage capacity being reached or exceeded. Responses to audit failure depend upon the nature of
    the failure mode. When availability is an overriding concern, other approved actions in response to an audit failure are
    as follows: If the failure was caused by the lack of audit record storage capacity, the operating system must continue
    generating audit records if possible (automatically restarting the audit service if necessary), overwriting the oldest
    audit records in a first-in-first-out manner. If audit records are sent to a centralized collection server and communication
    with this server is lost or the server fails, the operating system must queue audit records locally until communication
    is restored or until the audit records are retrieved manually. Upon restoration of the connection to the centralized collection
    server, action should be taken to synchronize the local audit data with the collection server.'
  impact: ''
  references: []
  page_start: 302
  audit_raw: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

    SMFPRMxx member in SYS1.PARMLIB.

    If NOBUFFS is set to "HALT", this is not a finding.

    Note: If availability is an overriding concern NOBUFFS can be set to MSG.'
  remediation: 'Configure NOBUFFS to "HALT" unless availability is an overriding concern then

    NOBUFFS can be set to MSG.'
  checks:
  - type: manual_review
    info: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

      SMFPRMxx member in SYS1.PARMLIB.

      If NOBUFFS is set to "HALT", this is not a finding.

      Note: If availability is an overriding concern NOBUFFS can be set to MSG.'
    severity: medium
- id: '1.135'
  title: RACF-OS-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS SNTP daemon (SNTPD) must be active. GROUP ID: V-223774 RULE ID: SV-223774r1038944'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing internal information
    system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected
    over a network. Organizations should consider endpoints that may not have regular access to the authoritative time server
    (e.g., mobile, teleworking, and tactical endpoints).
  impact: ''
  references: []
  page_start: 304
  audit_raw: 'From UNIX System Services ISPF Shell navigate to ribbon select tools.

    Select option 1 - Work with Processes.

    If SNTP Daemon (SNTPD) is not active, this is a finding.'
  remediation: 'Obtain a copy of this sample procedure from SEZAINST and store it in one of your

    PROCLIB concatenation data sets.

    Perform the following step to start SNTPD as a procedure:

    Invoke the procedure using the system operator start command. The following sample,

    SEZAINST(SNTPD), shows how to start SNTPD as a procedure:

    //*

    //* Sample procedure for the Simple Network Time Protocol (SNTP)

    //*

    //* z/OS Communications Server Version 1 Release 13

    //* SMP/E Distribution Name: SEZAINST(EZASNPRO)

    //*

    //* Copyright: Licensed Materials - Property of IBM

    //* 5650-ZOS

    //* Copyright IBM Corp. 2002, 2015

    //*

    //* Status: CSV2R2

    //*

    //SNTPD EXEC PGM=SNTPD,REGION=4096K,TIME=NOLIMIT,

    //PARM=''/ -d''

    //SYSPRINT DD SYSOUT=*,DCB=(RECFM=F,LRECL=132,BLKSIZE=132)

    //SYSIN DD DUMMY

    //SYSERR DD SYSOUT=*

    //SYSOUT DD SYSOUT=*,DCB=(RECFM=F,LRECL=132,BLKSIZE=132)

    //CEEDUMP DD SYSOUT=*

    //SYSABEND DD SYSOUT=*'
  checks:
  - type: manual_review
    info: 'From UNIX System Services ISPF Shell navigate to ribbon select tools.

      Select option 1 - Work with Processes.

      If SNTP Daemon (SNTPD) is not active, this is a finding.'
    severity: medium
