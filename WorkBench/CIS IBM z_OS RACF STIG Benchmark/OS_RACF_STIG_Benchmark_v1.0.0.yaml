    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the operating system must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues. MCS consoles can
    be used to issue operator commands. Failure to properly control access to MCS consoles could result in unauthorized personnel
    issuing sensitive operator commands. This exposure may threaten the integrity and availability of the operating system
    environment, and compromise the confidentiality of customer data.
  impact: ''
  references: []
  page_start: 160
  audit_raw: 'Review each CONSOLxx parmlib member.

    If the following guidance is true, this is not a finding.

    The "DEFAULT" statement for each CONSOLxx member specifies

    "LOGON(REQUIRED)" or "LOGON(AUTO)".

    The "CONSOLE" statement for each console assigns a unique name using the "NAME"

    parameter.

    The "CONSOLE" statement for each console specifies "AUTH(INFO)". Exceptions are

    the "AUTH" parameter is not valid for consoles defined with "UNIT(PRT)" and specifying

    "AUTH(MASTER)" is permissible for the system console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the "DEFAULT" statement requirement.'
  remediation: 'Configure the "DEFAULT" statement to specify "LOGON(REQUIRED)" so that all

    operators are required to log on prior to entering z/OS system commands. At the

    discretion of the ISSO, "LOGON(AUTO)" may be used. If "LOGON(AUTO)" is used

    assure that the console userids are defined with minimal access. See ACP00292.

    Configure each "CONSOLE" statement to specify an explicit console NAME. And that

    "AUTH(INFO)" is specified, this also including extended MCS consoles.

    "AUTH(MASTER)" may be specified for systems console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the "DEFAULT" statement requirement.'
  checks:
  - type: manual_review
    info: 'Review each CONSOLxx parmlib member.

      If the following guidance is true, this is not a finding.

