  remediation: 'Review the settings in the /etc/rc. The /etc/rcfile is the system initialization shell script.

    When z/OS UNIX kernel services start, /etc/rc is executed to set file permissions and

    ownership for dynamic system files and to perform other system startup functions such

    as starting daemons. There can be many commands in /etc/rc. There are two specific

    guidelines that must be followed:

    Verify that the CHMOD or CHAUDIT command does not result in less restrictive

    security than what is specified in the table below.

    Immediately prior to each command that starts a daemon, the _BPX_JOBNAME

    variable must be set to match the daemon''s name (e.g., inetd, syslogd). The use of

    _BPX_USERID is at the site''s discretion, but is recommended.

