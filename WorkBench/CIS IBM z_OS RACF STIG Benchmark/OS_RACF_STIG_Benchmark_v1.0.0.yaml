  impact: ''
  references: []
  page_start: 258
  audit_raw: 'From the ISPF Command Shell enter:

    RL JESSPOOL *

    Review the accesses to the JESSPOOL resources.

    If the following guidance is true, this is not a finding.

    Review the JESSPOOL report for resource permissions with the following naming

    convention. These profiles may be fully qualified, be specified as generic, or be

    specified with masking as indicated below:

    localnodeid.userid.jobname.jobid.dsnumber.name

    localnodeid The name of the node on which the SYSIN or SYSOUT data set currently

    resides.

    userid The userid associated with the job. This is the userid RACF uses for validation

    purposes when the job runs.

    jobname The name that appears in the name field of the JOB statement.

    jobid The job number JES2 assigned to the job.

    dsnumber The unique data set number JES2 assigned to the spool data set. A D is the

    first character of this qualifier.

    name The name of the data set specified in the DSN= parameter of the DD statement. If

    the JCL did not specify DSN= on the DD statement that creates the spool data set,

    JES2 uses a question mark (?).

    All users have access to their own JESSPOOL resources.

    The localnodeid. resources are restricted to only system programmers, operators, and

    automated operations personnel with access of ALTER. All access will be logged.

    (localnodeid. resource includes all generic and/or masked permissions, example:

    localnodeid.**, localnodeid.*, etc.)

    The JESSPOOL localnodeid.userid.jobname.jobid.dsnumber.name, whether generic

    and/or masked, can be made available to users when approved by the ISSO. Access

    will be identified at the minimum access for the user to accomplish the users function.

    UPDATE, CONTROL, and ALTER access will be logged. An example is team members

    within a team, providing the capability to view, help, and/or debug other team member

    jobs/processes.

    CSSMTP will be restricted to localnodeid.userid.jobname.jobid.dsnumber.name,

    whether generic and/or masked, when approved by the ISSO. All access will be logged.

    Spooling products users (CA-SPOOL, CA View, etc.) will be restricted to

    localnodeid.userid.jobname.jobid.dsnumber.name, whether generic and/or masked,

    when approved by the ISSO. Logging of access is not required.'
  remediation: 'Configure accesses for JESSPOOL resources as detailed below. The JESSPOOL may

    have more restrictive security at the direction of the ISSO.

    The JESSPOOL resources may be fully qualified, be specified as generic, or be

    specified with masking as indicated below:

    localnodeid.userid.jobname.jobid.dsnumber.name

    localnodeid The name of the node on which the SYSIN or SYSOUT data set currently

    resides.

    userid The userid associated with the job. This is the userid used for validation

    purposes when the job runs.

    jobname The name that appears in the name field of the JOB statement.

    jobid The job number JES2 assigned to the job.

    dsnumber The unique data set number JES2 assigned to the spool data set. A D is the

    first character of this qualifier.

    name The name of the data set specified in the DSN= parameter of the DD statement. If

    the JCL did not specify DSN= on the DD statement that creates the spool data set,

    JES2 uses a question mark (?).

    By default a user has access only to that user''s own JESSPOOL resources. However,

    situations exist where a user legitimately requires access to jobs that run under another

    user''s userid. In particular, if a user routes SYSOUT to an external writer, the external

    writer should have access to that user''s SYSOUT.

    The localnodeid. resource will be restricted to only system programmers, operators, and

    automated operations personnel with access of ALTER. All access will be logged.

    (localnodeid. resource includes all generic and/or masked permissions, example:

    localnodeid.**, localnodeid.*, etc.)

    RDEF JESSPOOL localnodeid.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''PROTECT JESSPOOL AT HIGH LEVEL, REF ZJES0046'')

    PE localnodeid.** CL(JESSPOOL) ID(syspsmpl) ACC(A)

    The JESSPOOL localnodeid.userid.jobname.jobid.dsnumber.name, whether generic

    and/or masked, can be made available to users when approved by the ISSO. Access

    will be identified at the minimum access for the user to accomplish the users function,

    SERVICE(READ, UPDATE, DELETE, ADD). All access will be logged. An example is

    team members within a team, providing the capability to view, help, and/or debug other

    team member jobs/processes. If frequent situations occur where users working on a

    common project require selective access to each other''s jobs, the installation may

    delegate to the individual users the authority to grant access, but only with the approval

    of the ISSO.

    RDEF JESSPOOL localnode.userid.jobname.jobid.dsnumber.name -

    UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ)) -

    DATA(''PROTECT JESSPOOL, REF ZJES0046'')

    PE localnode.userid.jobname.jobid.dsnumber.name CL(JESSPOOL)

    ID(<users_or_groups>) ACC(R)

    If IBM''s SDSF product is installed on the system, resources defined to the JESSPOOL

    resource class control functions related to jobs, output groups, and SYSIN/SYSOUT

    data sets on various SDSF panels.

    CSSMTP will not be granted to the JESSPOOL resource of the high-level "node." or

    "localnodeid.". CSSMTP can have access to the specific approved JESSPOOL

    resources, minimally qualified to the node.userid. and all access will be logged. This will

    ensure system records who (userid) sent traffic to CSSMTP, when, and what

    job/process.

    Spooling products users (CA-SPOOL, CA View, etc.) will be restricted to

    localnodeid.userid.jobname.jobid.dsnumber.name, whether generic and/or masked,

    when approved by the ISSO. Logging of access is not required.

    Conduct a review of JESSPOOL resource rules. If a rule has been determined not to

    have been used within the last two years, the rule must be removed.'
