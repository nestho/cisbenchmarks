    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USGauthorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Use the following
    verbiage for operating systems that have severe limitations on the number of characters that can be displayed in the banner:
    "I''ve read & consent to terms in IS user agreem''t."'
