    z/OS UNIX daemons (e.g., inetd, syslogd, ftpd), and other system software daemons.

    UID(0) is assigned to security administrators who create or maintain user account

    definitions; and to systems programming accounts dedicated to maintenance (e.g.,

    SMP/E) of HFS-based components.

    NOTE: The assignment of UID(0) confers full time superuser privileges, this is not

    appropriate for personal user accounts. Access to the BPX.SUPERUSER resource is

    used to allow personal user accounts to gain short-term access to superuser privileges.'
  checks:
  - type: manual_review
    info: 'From a z/OS command screen enter:

