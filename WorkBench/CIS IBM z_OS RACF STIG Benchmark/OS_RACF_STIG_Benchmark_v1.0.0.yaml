- id: '1.122'
  title: RACF-OS-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS system administrator (SA) must develop a process to disable emergency accounts after the crisis
    is resolved or 72 hours. GROUP ID: V-223761 RULE ID: SV-223761r998357'
  rationale: Emergency accounts are privileged accounts that are established in response to crisis situations where the need
    for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by the organization's SAs when network or normal logon/access is not available). Infrequently used
    accounts are not subject to automatic termination dates. Emergency accounts are accounts created in response to crisis
    situations, usually for use by maintenance personnel. The automatic expiration or disabling time period may be extended
    as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account should be established
    for privileged users who need long-term maintenance accounts. To address access requirements, many operating systems can
    be integrated with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 279
  audit_raw: 'Ask the SA for the documented process to disable emergency accounts.

    If there is no documented process, this is a finding.

    Examine the process, if it does not include procedures to disable emergency accounts

    after the crisis is resolved or 72 hours, this is a finding.'
  remediation: 'Develop a process to disable emergency accounts after the crisis is resolved or 72

    hours.'
  checks:
  - type: manual_review
    info: 'Ask the SA for the documented process to disable emergency accounts.

      If there is no documented process, this is a finding.

      Examine the process, if it does not include procedures to disable emergency accounts

      after the crisis is resolved or 72 hours, this is a finding.'
    severity: medium
- id: '1.123'
  title: RACF-OS-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS system administrator (SA) must develop a process to notify appropriate personnel when accounts
    are created. GROUP ID: V-223762 RULE ID: SV-223762r998358'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create a new account. Notification of account
    creation is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail
    which documents the creation of operating system user accounts and notifies SAs and information system security officers
    (ISSOs) that it exists. Such a process greatly reduces the risk that accounts will be surreptitiously created and provides
    logging that can be used for forensic purposes. To address access requirements, many operating systems can be integrated
    with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
