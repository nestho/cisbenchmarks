- id: '1.182'
  title: RACF-TC-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS data sets for the Base TCP/IP component must be properly protected. GROUP ID: V-223826 RULE ID: SV-223826r958472'
  rationale: 'MVS data sets of the Base TCP/IP component provide the configuration, operational, and executable properties
    of IBMs TCP/IP system product. Failure to properly secure these data sets may lead to unauthorized access resulting in
    the compromise of the integrity and availability of the operating system environment, ACP, and customer data. To mitigate
    the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved
    PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods
    that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically
    give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure
    each authenticated entity also has a validated and current authorization. Authorization is the process of determining
    whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control
    policies and enforcement mechanisms to implement this requirement. Access control policies include: identity-based policies,
    role-based policies, and attribute-based policies. Access enforcement mechanisms include: access control lists, access
    control matrices, and cryptography. These policies and mechanisms must be employed by the application to control access
    between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs,
    and domains) in the information system. Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000259-GPOS-00100'
  impact: ''
  references: []
