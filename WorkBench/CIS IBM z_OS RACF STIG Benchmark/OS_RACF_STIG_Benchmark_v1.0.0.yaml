- id: '1.131'
  title: RACF-OS-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS SMF collection files (system MANx datasets or LOGSTREAM DASD) must have storage capacity to store
    at least one weeks worth of audit data. GROUP ID: V-223770 RULE ID: SV-223770r958752'
  rationale: In order to ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating
    systems need to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity
    is usually performed during initial installation of the operating system.
  impact: ''
  references: []
  page_start: 297
