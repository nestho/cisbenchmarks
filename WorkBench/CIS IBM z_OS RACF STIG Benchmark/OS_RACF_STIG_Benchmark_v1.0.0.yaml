      cd /etc/

      Enter

      ls -alW

      If the file Permission Bits and User Audit Bits for Output log file defined in the

      configuration file are as below, this is not a finding.

      /etc/syslog.conf 0744 faf

      0744 fff

      '
- id: '1.168'
  title: RACF-SL-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS Syslog daemon must be started at z/OS initialization. GROUP ID: V-223813 RULE ID: SV-223813r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 360
  audit_raw: 'SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

    BPXBATCH program. Additionally, other mechanisms (e.g., a job scheduler) may be

    used to automatically start the Syslog daemon. To thoroughly analyze this requirement

    you may need to view the OS SYSLOG using SDSF, find the last IPL, and look for the

    initialization of SYSLOGD.

    If the Syslog daemon SYSLOGD is started automatically during the initialization of the

    z/S/ system, this is not a finding.'
  remediation: 'Review the files used to initialize tasks during system IPL (e.g., /etc/rc, SYS1.PARMLIB,

    any job scheduler definitions) configure the Syslog daemon to start automatically during

    z/OS system initialization.

    It is important that syslogd be started during the initialization phase of the z/OS system

    to ensure that significant messages are not lost. As with other z/OS UNIX daemons,

    there is more than one way to start SYSLOGD. It can be started as a process in the

    /etc/rc file or as a z/OS started task.'
  checks:
  - type: manual_review
    info: 'SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

      BPXBATCH program. Additionally, other mechanisms (e.g., a job scheduler) may be

      used to automatically start the Syslog daemon. To thoroughly analyze this requirement

      you may need to view the OS SYSLOG using SDSF, find the last IPL, and look for the

      initialization of SYSLOGD.

      If the Syslog daemon SYSLOGD is started automatically during the initialization of the

      z/S/ system, this is not a finding.'
    severity: medium
- id: '1.169'
  title: RACF-SL-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS Syslog daemon must be properly defined and secured. GROUP ID: V-223814 RULE ID: SV-223814r958482'
  rationale: The Syslog daemon, known as syslogd, is a zOS UNIX daemon that provides a central processing point for log messages
    issued by other zOS UNIX processes. It is also possible to receive log messages from other network-connected hosts. Some
    of the IBM Communications Server components that may send messages to syslog are the FTP, TFTP, zOS UNIX Telnet, DNS,
    and DHCP servers. The messages may be of varying importance levels including general process information, diagnostic information,
    critical error notification, and audit-class information. Primarily because of the potential to use this information in
    an audit process, there is a security interest in protecting the syslogd process and its associated data. The Syslog daemon
    requires special privileges and access to sensitive resources to provide its system services. Failure to properly define
    and control the Syslog daemon could lead to unauthorized access. This exposure may result in the compromise of the integrity
    and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references: []
  page_start: 362
  audit_raw: 'From z/OS command screen enter:

    ListUser SYSLOGD OMVS (SYSLOGD is usual name of the SYSLOG daemon)

    If all of the following are true, this is not a finding.

    If either of the following is untrue, this is a finding.

    -The SYSLOGD userid is defined as a PROTECTED userid.

    -The SYSLOGD userid has the following z/OS UNIX attributes: UID(0), HOME directory

    ''/'', shell program /bin/sh.

    From z/OS command screen enter:

    RList STARTED SYSLOGD

    If a matching entry in the STARTED resource class exists enabling the use of the

    standard userid and appropriate group, this is not a finding.'
  remediation: 'The Syslog daemon userid is SYSLOGD.

    Define the SYSLOGD userid as a PROTECTED userid.

    Define the SYSLOGD userid has UID(0), HOME(''/''), and PROGRAM(''/bin/sh'') specified

    in the OMVS segment.

    To set up and use as an MVS Started Proc, the following sample commands are

    provided:

    AU SYSLOGD NAME(''stc, tcpip'') NOPASSWORD NOOIDCARD DFLTGRP(STC) -

    OWNER(STC) DATA(''Reference ISLG0020 for proper setup '')

    ALU SYSLOGD DFLTGRP(stctcpx)

    ALU SYSLOGD OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))

    CO SYSLOGD GROUP(stctcpx) OWNER(stctcpx)

    A matching entry mapping the SYSLOGD started proc to the SYSLOGD userid is in the

    STARTED resource class.

    RDEF STARTED SYSLOGD.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    STDATA(USER(SYSLOGD) GROUP(STC))

    If /etc/rc is used to start the Syslog daemon, ensure that the _BPX_JOBNAME and BPX

    USERID environment variables are assigned a value of SYSLOGD.'
  checks:
  - type: manual_review
    info: 'From z/OS command screen enter:

