- id: '1.195'
  title: RACF-US-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS UNIX security parameters in etc/profile must be properly specified. GROUP ID: V-223842 RULE ID: SV-223842r958472'
  rationale: 'Configuring the operating system to implement organization-wide security implementation guides and security
    checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects
    the most restrictive security posture consistent with operational requirements. Configuration settings are the set of
    parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture
    and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the
    system, including the parameters required to satisfy other security control requirements. Security-related parameters
    include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports,
    protocols, services, and remote connections.'
  impact: ''
  references: []
  page_start: 430
  audit_raw: 'From the ISPF Command Shell enter:

    ISHELL

    /etc/profile

    If the final or only instance of the UMASK command in /etc/profile is specified as "umask

    077", this is not a finding.

    If the LOGNAME variable is marked read-only (i.e., "readonly LOGNAME") in

    /etc/profile, this is not a finding.'
  remediation: 'Configure the etc/profile to specify the UMASK command is executed with a value of

    077, the LOGNAME variable is marked read-only for the /etc/profile file, and exceptions

    are documented with the ISSO.'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      ISHELL

      /etc/profile

      If the final or only instance of the UMASK command in /etc/profile is specified as "umask

      077", this is not a finding.

      If the LOGNAME variable is marked read-only (i.e., "readonly LOGNAME") in

      /etc/profile, this is not a finding.'
    severity: medium
- id: '1.196'
  title: RACF-US-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS UNIX security parameters in /etc/rc must be properly specified. GROUP ID: V-223843 RULE ID: SV-223843r958472'
  rationale: 'Configuring the operating system to implement organization-wide security implementation guides and security
    checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects
    the most restrictive security posture consistent with operational requirements. Configuration settings are the set of
    parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture
    and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the
    system, including the parameters required to satisfy other security control requirements. Security-related parameters
    include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports,
    protocols, services, and remote connections.'
  impact: ''
  references: []
  page_start: 432
  audit_raw: 'From the ISPF Command Shell enter:

    ISHELL

    /etc/rc

    If all of the CHMOD commands in /etc/rc do not result in less restrictive access than

    what is specified in the tables below, this is not a finding.

    NOTE: The use of CHMOD commands in /etc/rc is required in most environments to

    comply with the required settings, especially for dynamic objects such as the /dev

    directory.

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    If all of the CHAUDIT commands in /etc/rc do not result in less auditing than what is

    specified in the tables below, this is not a finding.

    NOTE: The use of CHAUDIT commands in /etc/rc may not be necessary. If none are

    found, there is not a finding.

    The possible audit bits settings are as follows:

    f log for failed access attempts

    a log for failed and successful access

    • no auditing

    If the _BPX_JOBNAME variable is appropriately set (i.e., to match daemon name) as

    each daemon (e.g., syslogd, inetd) is started in /etc/rc, this is not a finding.

    NOTE: If _BPX_JOBNAME is not specified, the started address space will be named

    using an inherited value. This could result in reduced security in terms of operator

    command access.

    SYSTEM DIRECTORY SECURITY SETTINGS

    DIRECTORY PERMISSION BITS USER AUDIT BITS FUNCTION

    / [root] 755 faf Root level of all file systems. Holds critical mount points.

    /bin 1755 fff Shell scripts and executables for basic functions

    /dev 1755 fff Character-special files used when logging into the OMVS shell and during

    C language program compilation.

    Files are created during system IPL and on a per-demand basis.

    /etc 1755 faf Configuration programs and files (usually with locally customized data)

    used by z/OS UNIX and other product initialization processes

    /lib 1755 fff System libraries including dynamic link libraries and files for static linking

    /samples 1755 fff Sample configuration and other files

    /tmp 1777 fff Temporary data used by daemons, servers, and users. Note: /tmp must

    have the sticky bit on to restrict file renames and deletions.

    /u 1755 fff Mount point for user home directories and optionally for third-party software

    and other local site files

    /usr 1755 fff Shell scripts, executables, help (man) files and other data. Contains subdirectories (e.g., lpp) and mount
    points used by program products that may be in

    separate file systems.

    /var 1775 fff Dynamic data used internally by products and by elements and features of

    z/OS UNIX.

    SYSTEM FILE SECURITY SETTINGS

    FILE PERMISSION BITS USER AUDIT BITS FUNCTION

    /bin/sh 1755 faf z/OS UNIX shell

    Note: /bin/sh has the sticky bit on to improve performance.

    /dev/console 740 fff The system console file receives messages that may require

    System Administrator (SA) attention.

    /dev/null 666 fff A null file; data written to it is discarded.

    /etc/auto.master and

    any mapname files 740 faf Configuration files for automount facility

    /etc/inetd.conf 740 faf Configuration file for network services

    /etc/init.options 740 faf Kernel initialization options file for z/OS UNIX environment

    /etc/log 744 fff Kernel initialization output file

    /etc/profile 755 faf Environment setup script executed for each user

    /etc/rc 744 faf Kernel initialization script for z/OS UNIX environment

    /etc/steplib 740 faf List of MVS data sets valid for set user ID and set group ID

    executables

    /etc/tablename 740 faf List of z/OS userids and group names with corresponding alias

    names

    /usr/lib/cron/at.allow

