- id: '1.115'
  title: RACF-JS-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS JES2 system commands must be protected in accordance with security requirements. GROUP ID: V-223754
    RULE ID: SV-223754r958472'
  rationale: 'To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement. Access control policies include: identity-based
    policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include: access control lists,
    access control matrices, and cryptography. These policies and mechanisms must be employed by the application to control
    access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs,
    and domains) in the information system.'
  impact: ''
  references: []
  page_start: 262
  audit_raw: 'From the ISPF Command Shell enter:

    RList OPERCMDS *

    If the JES2.** resource is defined to the OPERCMDS class with an access of NONE

    and all access is logged, this is not a finding.

    If access to JES2 system commands defined in the IBM z/OS JES2 Commands is

    restricted to the appropriate personnel (e.g., operations staff, systems programming

    personnel, general users), as determined in the documented site Security Plan, this is

    not a finding.

    If access to specific JES2 system commands is logged as indicated in the documented

    site Security Plan, this is not a finding.

    Note: Display commands and others as deemed by the site IAW site security plan may

    be allowed for all users with no logging.'
  remediation: 'Extended MCS support allows the installation to control the use of JES2 system

    commands through the ESM. These commands are subject to various types of potential

    abuse. For this reason, it is necessary to place restrictions on the JES2 system

    commands that can be entered by particular operators.

    Some commands are particularly dangerous and should only be used when less drastic

    options have been exhausted. Misuse of these commands can create a situation in

    which the only recovery is an IPL.

    To control access to JES2 system commands, apply the following:

    implementing security:

    Define the JES2.** resource in the OPERCMDS class with an access of NONE and all

    access is logged.

    Define the JES2 system commands as specified in the IBM z/OS JES2 Commands to

    be restricted to the appropriate personnel (e.g., operations staff, systems programming

    personnel, general users), as determined in the documented site Security Plan.

    Define the JES2 system commands with proper logging as determined in the

    documented site Security Plan.

    Note: Display commands and others as deemed by the site IAW site security plan may

    be allowed for all users with no logging.

    Build a command file based on the referenced JES2 Command Table. A sample of the

    commands in the command file is provided here:

    RDEF OPERCMDS JES2.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''REQUIRED BY SRR PDI ZJES0052'')

    RDEF OPERCMDS JES2..** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''REQUIRED BY SRR PDI ZJES0052'')

    PE JES2..** CL(OPERCMDS) ID() ACC(U)

    SETR RACL(OPERCMDS) REF'
