    There is an exception when evaluating the UACC for DIGTCERT and NODES resource

    classes.

    The universal access (UACC) for DIGTCERT profiles:

    For profiles in classes other than DIGTCERT, the valid values are NONE, READ,

    EXECUTE, UPDATE, CONTROL, and ALTER. For DIGTCERT profiles, the valid values

    are TRUST, NOTRUST, and HIGHTRST.

    If DIGTCERT Profiles are defined with other than UACC NONE, this is not a finding.

