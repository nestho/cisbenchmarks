    -The number of required character types is four.

    (ensures that at least one uppercase, one lowercase, one number, and one special

    character is used in password phrase)

    -The user''s name is not contained in the password phrase.

    (Only three consecutive characters of the user''s name are allowed)

    -The minimum password phrase length checked is 15.

    -The user ID is not contained in the password phrase.

    (Only three consecutive characters of the user ID are allowed)

    -The new password phrase is at least 50 percent changed positions of the old password

    phrase.

    (These positions need to be consecutive to cause a failure and this check is not case

    sensitive)

    -A minimum list of eight restricted words are being checked:

    ''IBM'' , ''RACF'', ''PASSWORD'', ''PHRASE'', ''PASSPHRASE'', ''SECRET'', ''IBMUSER'',

