  rationale: If anomalies are not acted upon, security functions may fail to secure the system. Security function is defined
    as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy
    and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is
