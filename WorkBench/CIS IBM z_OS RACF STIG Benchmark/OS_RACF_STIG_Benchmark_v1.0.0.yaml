- id: '1.90'
  title: RACF-FT-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS FTP.DATA configuration statements must indicate a BANNER statement with the proper content. GROUP
    ID: V-223736 RULE ID: SV-223736r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the operating system ensures
    privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives,
    policies, regulations, standards, and guidance. System use notifications are required only for access via logon interfaces
    with human users and are not required when such human interfaces do not exist. The banner must be formatted in accordance
    with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:
    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using
    this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts
    and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring,
    network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
    -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS
    are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized
    purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
    for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal
    representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work
    product are private and confidential. See User Agreement for details." Use the following verbiage for operating systems
    that have severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent to
    terms in IS user agreem''t." Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007'
  impact: ''
  references: []
  page_start: 205
  audit_raw: 'Refer to the FTP.DATA file specified on the SYSFTPD DD statement in the FTP started

    task JCL. The SYSFTPD DD statement is optional.

    The search order for FTP.DATA is:

    /etc/ftp.data

    SYSFTPD DD statement

    jobname.FTP.DATA

    SYS1.TCPPARMS(FTPDATA)

    tcpip.FTP.DATA

    Examine the BANNER statement.

    Ensure the BANNER statement in the FTP Data configuration file specifies an HFS file

    or data set that contains a logon banner with the Standard Mandatory DoD Notice and

    Consent Banner. The below banner is mandatory and deviations are not permitted

    except as authorized in writing by the DoD Chief Information Officer. The thrust of this

    new policy is to make it clear that there is no expectation of privacy when using DoD

    information systems and all use of DoD information systems is subject to searching,

    auditing, inspecting, seizing, and monitoring, even if some personal use of a system is

    permitted:

    STANDARD MANDATORY DOD NOTICE AND CONSENT BANNER

    You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USG

    authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details.

    If the BANNER statement in the FTP Data configuration file does not specify an HFS file

    or z/OS data set that contains the Standard Mandatory DoD Notice and Consent

    Banner, this is a finding.'
  remediation: 'Ensure the BANNER statement in the FTP Data configuration file specifies an HFS file

    or z/OS data set that contains a logon Standard Mandatory DoD Notice and Consent

    Banner. The below banner is mandatory and deviations are not permitted except as

    authorized in writing by the DoD Chief Information Officer. The thrust of this new policy

    is to make it clear that there is no expectation of privacy when using DoD information

    systems and all use of DoD information systems is subject to searching, auditing,

    inspecting, seizing, and monitoring, even if some personal use of a system is permitted:

    STANDARD MANDATORY DOD NOTICE AND CONSENT BANNER

    You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USG

    authorized purpose.'
