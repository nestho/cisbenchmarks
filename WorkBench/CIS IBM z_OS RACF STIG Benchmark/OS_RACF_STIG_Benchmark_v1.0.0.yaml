- id: '1.183'
  title: RACF-TC-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS Configuration files for the TCP/IP stack must be properly specified. GROUP ID: V-223827 RULE ID:
    SV-223827r991589'
  rationale: 'Configuring the operating system to implement organization-wide security implementation guides and security
    checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects
    the most restrictive security posture consistent with operational requirements. Configuration settings are the set of
    parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture
    and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the
    system, including the parameters required to satisfy other security control requirements. Security-related parameters
    include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports,
    protocols, services, and remote connections.'
  impact: ''
  references: []
  page_start: 400
  audit_raw: 'Refer to the procedure libraries defined to JES2 and locate the TCPIP JCL member.

    Note:

    If GLOBALTCPIPDATA is specified, any TCPIP.DATA statements contained in the

    specified file or data set take precedence over any TCPIP.DATA statements found

    using the appropriate environment''s (native MVS or z/OS UNIX) search order.

    If GLOBALTCPIPDATA is not specified, the appropriate environment''s (Native MVS or

    z/OS UNIX) search order is used to locate TCPIP.DATA.

    If the PROFILE and SYSTCPD DD statements specify the TCP/IP Profile and Data

    configuration files respectively, this not a finding.

    If the RESOLVER_CONFIG variable on the EXEC statement is set to the same file

    name specified on the SYSTCPD DD statement, this is not a finding.'
  remediation: 'Review the TCP/IP started task JCL to ensure the configuration file names are specified

    on the appropriate DD statements and parameter option.

    During initialization the TCP/IP stack uses fixed search sequences to locate the

    PROFILE.TCPIP and TCPIP.DATA files. However, uncertainty is reduced and security

    auditing is enhanced by explicitly specifying the locations of the files. In the TCP/IP

    started task''s JCL, Data Definition (DD) statements can be used to specify the locations

    of the files. The PROFILE DD statement identifies the PROFILE.TCPIP file and the

    SYSTCPD DD statement identifies the TCPIP.DATA file.

    The location of the TCPIP.DATA file can also be specified by coding the

    RESOLVER_CONFIG environment variable as a parameter of the ENVAR option in the

    TCP/IP started task''s JCL. In fact, the value of this variable is checked before the

    SYSTCPD DD statement by some processes. However, not all processes (e.g., TN3270

    Telnet Server) will access the variable to get the file location. Therefore specifying the

    file location explicitly, both on a DD statement and through the RESOLVER_CONFIG

    environment variable, reduces ambiguity.

    Note:

    If GLOBALTCPIPDATA is specified, any TCPIP.DATA statements contained in the

    specified file or data set take precedence over any TCPIP.DATA statements found

    using the appropriate environment''s (native MVS or z/OS UNIX) search order.

    If GLOBALTCPIPDATA is not specified, the appropriate environment''s (Native MVS or

    z/OS UNIX) search order is used to locate TCPIP.DATA.

    The systems programmer responsible for supporting ICS will ensure that the TCP/IP

    started task''s JCL specifies the PROFILE and SYSTCPD DD statements for the

    PROFILE.TCPIP and TCPIP.DATA configuration files and TCP/IP started task''s JCL

    includes the RESOLVER_CONFIG variable, set to the name of the file specified on the

    SYSTCPD DD statement.'
  checks:
