controls:
- id: '1.1'
  title: RACF-CE-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Certificate Name Filtering must be implemented with appropriate authorization and documentation. GROUP ID:
    V-223646 RULE ID: SV-223646r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and Accesses that occur through authorized use of
    group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Currently the RACDCERT command does not support a generic userid value of ID(*)

    LISTMAP to list all the certificate name filters defined to RACF. However, the following

    commands can be issued to determine if certificate name filtering may be implemented.

    If certificate name filtering is in use, collect documentation describing each active filter

    rule and written approval from the ISSM to use the rule.

    Issue the SETROPTS LIST command. If the DIGTNMAP resource class is active,

    RACF is ready to process any certificate name filters with a Status of TRUST. The

    DIGTNMAP resource class should not be active unless certificate name filtering is

    desired.

    If the DIGTNMAP resource class is not active, this is not a finding.

    Certificate name filters are stored as profiles in the DIGTNMAP resource class. The

    RLIST command is not intended for use with profiles in the DIGTNMAP resource class.

    However it can be used to determine if any profiles are defined. (NOTE: The information

    will not be displayed in a suitable format to easily interpret the filter.)

    RLIST DIGTNMAP *

    If there is nothing to list in the DIGTNMAP resource class, this is not a finding.

    If profile information is displayed, one or more certificate name filters are defined to

    RACF. Under the NAME heading of each profile listing is the userid the filter is being

    mapped to. Issue the following command the list the certificate name filter associated

    with each userid:

    RACDCERT ID(profile name userid) LISTMAP

    NOTE: Certificate name filters are only valid when their Status is TRUST. Therefore,

    you may ignore filters with the NOTRUST status.

    If the DIGTNMAP resource class is active and certificate name filters have a Status of

    TRUST, certificate name filtering is in use.

    If certificate name filtering is in use and filtering rules have been documented and

    approved by the ISSM, this is not a finding.

    If certificate name filtering is in use and filtering rules have not been documented and

    approved by the ISSM, this is a finding.'
  remediation: 'Ensure any certificate name filtering rules in use are documented and approved by the

    ISSM.'
  checks:
  - type: manual_review
    info: 'Currently the RACDCERT command does not support a generic userid value of ID(*)

      LISTMAP to list all the certificate name filters defined to RACF. However, the following

      commands can be issued to determine if certificate name filtering may be implemented.

      If certificate name filtering is in use, collect documentation describing each active filter

      rule and written approval from the ISSM to use the rule.

      Issue the SETROPTS LIST command. If the DIGTNMAP resource class is active,

      RACF is ready to pro'
    severity: medium
- id: '1.2'
  title: RACF-CE-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Expired digital certificates must not be used. GROUP ID: V-223647 RULE ID: SV-223647r958448'
  rationale: The longer and more often a key is used, the more susceptible it is to loss or discovery. This weakens the assurance
    provided to a relying Party that the unique binding between a key and its named subscriber is valid. Therefore, it is
    important that certificates are periodically refreshed. This is in accordance with DoD requirement. Expired Certificate
    must not be in use.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'From the ISPF Command Shell enter:

    RACDCERT CERTAUTH LIST

    If no certificate information is found, this is not a finding.

    NOTE: Certificates are only valid when their Status is TRUST. Therefore, you may

    ignore certificates with the NOTRUST status during the following check.

    Check the expiration (End Date) for each certificate with a status of TRUST.

    If the expiration date has passed, this is a finding.'
  remediation: 'If the certificate is a user or device certificate with a status of TRUST, follow procedures

    to obtain a new certificate or re-key certificate. If it is an expired CA certificate remove it.'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      RACDCERT CERTAUTH LIST

      If no certificate information is found, this is not a finding.

      NOTE: Certificates are only valid when their Status is TRUST. Therefore, you may

      ignore certificates with the NOTRUST status during the following check.

      Check the expiration (End Date) for each certificate with a status of TRUST.

      If the expiration date has passed, this is a finding.'
    severity: medium
- id: '1.3'
  title: RACF-CE-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All digital certificates in use must have a valid path to a trusted certification authority (CA). GROUP ID:
    V-223648 RULE ID: SV-223648r998341'
  rationale: 'The origin of a certificate, or the CA, is crucial in determining if the certificate should be trusted. An approved
    CA establishes grounds for confidence at both ends of communications sessions in ongoing identities of other parties and
    in the validity of information transmitted. Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000403-GPOS-00182'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From the ISPF Command Shell enter:

    RACDCERT CERT AUTH

    If no certificate information is found, this is not a finding.

    NOTE: Certificates are only valid when their Status is TRUST. Therefore, you may

    ignore certificates with the NOTRUST status during the following check.

    If the digital certificate information indicates that the issuer''s distinguished name leads

    to one of the following, this is not a finding:

    a) A DOD PKI Root Certification Authority

    b) An External Root Certification Authority (ECA)

    c) An approved External Partner PKI''s Root Certification Authority

    The DOD Cyber Exchange website contains information as to which certificates maybe

    acceptable (https://public.cyber.mil/pki-pke/interoperability/ or https://cyber.mil/pkipke/interoperability/).

    Examples of an acceptable DOD CA are:

    DOD PKI Class 3 Root CA

    DOD PKI Med Root CA'
  remediation: 'Remove and/or replace certificates with a status of TRUST whose issuer''s distinguished

    name does not lead to a DOD PKI Root Certification Authority, External Root

    Certification Authority (ECA), or an approved External Partner PKI''s Root Certification

    Authority.

    Reference the DOD Cyber Exchange website for complete information as to which

    certificates may be acceptable (https://public.cyber.mil/pki-pke/interoperability/ or

    https://cyber.mil/pki-pke/interoperability/).'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      RACDCERT CERT AUTH

      If no certificate information is found, this is not a finding.

      NOTE: Certificates are only valid when their Status is TRUST. Therefore, you may

      ignore certificates with the NOTRUST status during the following check.

      If the digital certificate information indicates that the issuer''s distinguished name leads

      to one of the following, this is not a finding:

      a) A DOD PKI Root Certification Authority

      b) An External Root Certification Authority (ECA'
    severity: medium
- id: '1.4'
  title: RACF-ES-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'IBM RACF must limit Write or greater access to SYS1.NUCLEUS to system programmers only. GROUP ID: V-223649
    RULE ID: SV-223649r958472'
  rationale: 'This data set contains a large portion of the system initialization (IPL) programs and pointers to the master
    and alternate master catalog. Unauthorized access could result in the compromise of the operating system environment,
    ACP, and customer data. Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000259-GPOS-00100, SRG-OS000324-GPOS-00125'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Execute a dataset access list for SYS1.NUCLEUS.

    If all of the Following are untrue, this is not a finding.

    If any of the following is true, this is a finding.

    -The ACP data set rules for SYS1.NUCLEUS do not restrict WRITE or greater access to

    only z/OS systems programming personnel.

    -The ACP data set rules for SYS1.NUCLEUS do not specify that all (i.e., failures and

    successes) WRITE or greater access will be logged.'
  remediation: 'Review access authorization to critical system files. Evaluate the impact of correcting

    the deficiency. Develop a plan of action and implement the changes required to protect

    SYS1.NUCLEUS.

    Configure the WRITE or greater access to SYS1.NUCLEUS to be limited to system

    programmers only and all WRITE or greater access is logged.'
  checks:
  - type: manual_review
    info: 'Execute a dataset access list for SYS1.NUCLEUS.

      If all of the Following are untrue, this is not a finding.

      If any of the following is true, this is a finding.

      -The ACP data set rules for SYS1.NUCLEUS do not restrict WRITE or greater access to

      only z/OS systems programming personnel.

      -The ACP data set rules for SYS1.NUCLEUS do not specify that all (i.e., failures and

      successes) WRITE or greater access will be logged.'
    severity: medium
