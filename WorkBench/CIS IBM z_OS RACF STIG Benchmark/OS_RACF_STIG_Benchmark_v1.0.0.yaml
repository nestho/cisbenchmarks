- id: '1.80'
  title: RACF-ES-000790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM RACF SETROPTS PASSWORD(MINCHANGE) value must be set to 1. GROUP ID: V-223726 RULE ID: SV-223726r998350'
  rationale: Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse
    or history enforcement requirement. If users are allowed to immediately and continually change their password, then the
    password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password
    reuse.
  impact: ''
  references: []
  page_start: 186
  audit_raw: 'From the ISPF Command Shell enter:

    SETRopts List

    If the PASSWORD(MINCHANGE) value shows PASSWORD MINIMUM CHANGE

    INTERVAL IS <1> DAYS, this is not a finding.'
  remediation: 'Configure PASSWORD(MINCHANGE) SETROPTS value number to "1". This specifies

    the number of days that must pass before a user can change their password.

    Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    The RACF Command SETR LIST will show the status of RACF Controls including

    PASSWORD MINCHANGE. Use the following command as an example command:

    SETROPTS PASSWORD(MINCHANGE(1))'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      SETRopts List

      If the PASSWORD(MINCHANGE) value shows PASSWORD MINIMUM CHANGE

      INTERVAL IS <1> DAYS, this is not a finding.'
    severity: medium
- id: '1.81'
  title: RACF-ES-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF SETROPTS PASSWORD(INTERVAL) must be set to 60 days. GROUP ID: V-223727 RULE ID: SV-223727r1038967'
  rationale: Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed periodically.
    If the operating system does not limit the lifetime of passwords and force users to change their passwords, there is the
    risk that the operating system passwords could be compromised. INTERVAL specifies the maximum number of days that each
    user's password is valid. When a user logs on to the system, RACF compares the system password interval value specified
    in the user profile. RACF uses the lower of the two values to determine if the users password has expired.
  impact: ''
  references: []
  page_start: 187
  audit_raw: 'From the ISPF Command Shell enter:

    SETRopts List

    If the PASSWORD(INTERVAL) value is set properly and the message is PASSWORD

    CHANGE INTERVAL IS 060 DAYS, this is not a finding.'
  remediation: 'Configure PASSWORD(INTERVAL) SETROPTS value to "060" days. This specifies the

    maximum number of days that each user''s password is valid.

    Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    The RACF Command SETR LIST will show the status of RACF Controls including

    PASSWORD INTERVAL.

    Setting the password interval to 60 days is activated with the command SETR

    PASSWORD(INTERVAL(60)).'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      SETRopts List

      If the PASSWORD(INTERVAL) value is set properly and the message is PASSWORD

      CHANGE INTERVAL IS 060 DAYS, this is not a finding.'
    severity: medium
- id: '1.82'
  title: RACF-ES-000810
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM RACF PASSWORD(HISTORY) SETROPTS value must be set to five or more. GROUP ID: V-223728 RULE ID: SV-223728r998354'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. HISTORY specifies the number of previous passwords that RACF saves for each USERID and compares
    with an intended new password. If there is a match with one of the previous passwords, or with the current password, RACF
    rejects the intended new password.
  impact: ''
  references: []
