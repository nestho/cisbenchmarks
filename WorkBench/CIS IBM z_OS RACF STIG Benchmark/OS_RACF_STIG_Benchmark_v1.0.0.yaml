  title: RACF-ES-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF USERIDs possessing the Tape Bypass Label Processing (BLP) privilege must be justified. GROUP ID:
    V-223662 RULE ID: SV-223662r958472'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'From the ISPF Command Shell enter:

    RLIST FACILITY ICHBLP AUTHUSER

    If access authorization to the ICHBLP resource is restricted at the userid level to data

    center personnel (e.g., tape librarian, operations staff, etc.), this is not a finding.

    If no tape management system (e.g., CA-1) is installed the following:

    From the ISPF Command Shell enter:

    SETROPTS LIST

    If the TAPEVOL class is active, this is not a finding.'
  remediation: 'Review all USERIDs with the BLP attribute. Ensure documentation providing

    justification for access is maintained and filed with the ISSO, and that unjustified access

    is removed.

    BLP is controlled thru the FACILITY class profile ICHBLP. Access is removed with the

    following command:

    PE ICHBLP CL(FACILITY) id() DELETE

    a subsequent REFRESH of the FACILITY class may be required via the command:

    SETR RACL(FACILITY) REFRESH'
