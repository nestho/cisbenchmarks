- id: '1.72'
  title: RACF-ES-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM interactive USERIDs defined to RACF must have the required fields completed. GROUP ID: V-223718 RULE ID:
    SV-223718r958482'
  rationale: Interactive users are considered to be users of CICS, IMS, TSO/E, NetView, or other products that support logging
    on at a terminal. Improper assignments of attributes in the LOGONID record for interactive users may allow users excessive
    privileges resulting in unauthorized access.
  impact: ''
  references: []
  page_start: 168
  audit_raw: 'From a z/OS command screen enter:

    ListUser *

    Examine each user entry that has either TSO, CICS, ROSCOE, IMS, or any other

    products that support logging on at a terminal.

    If every user is fully identified with all of the following condition, this is not a finding.

    -Each interactive userid has a valid LAST-ACCESS date that does not contain the value

    UNKNOWN.

    -Each interactive userid has PASS-INTERVAL define and set to a value of 60 days.

    Note: FTP only process and server to server userids may have

    PASSWORD(NOINTERVAL) specified. These users must be identified in the

    FTPUSERS group in the Dialog Process or FTP in the name field. Additionally these

    users must change their passwords on an annual basis.'
  remediation: 'Review all interactive USERID definitions to ensure required information is provided.

    Evaluate the impact of correcting any deficiencies. Develop a plan of action and

    implement the required changes.

    The PASSWORD-INTERVAL for an interactive user must be set to 60 days.

    Note: FTP only process and server to server userids may have

    PASSWORD(NOINTERVAL) specified. These users must be identified in the

    FTPUSERS group in the Dialog Process or FTP in the name field. Additionally, these

    users must change their passwords on an annual basis or less.

    A sample command to accomplish this is shown here:

    PW USER() INTERVAL(60).

    The LAST-ACCESS date must be set to a valid date and not to the value UNKNOWN. A

    sample command to accomplish this is shown here:

    ALU RESUME'
  checks:
  - type: manual_review
    info: 'From a z/OS command screen enter:

      ListUser *

      Examine each user entry that has either TSO, CICS, ROSCOE, IMS, or any other

      products that support logging on at a terminal.

      If every user is fully identified with all of the following condition, this is not a finding.

      -Each interactive userid has a valid LAST-ACCESS date that does not contain the value

      UNKNOWN.

      -Each interactive userid has PASS-INTERVAL define and set to a value of 60 days.

      Note: FTP only process and server to server userids may have'
    severity: medium
- id: '1.73'
  title: RACF-ES-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS Started Tasks must be properly identified and defined to RACF. GROUP ID: V-223719 RULE ID: SV-223719r958482'
  rationale: Started procedures have system generated job statements that do not contain the user, group, or password statements.
    To enable the started procedure to access the same protected resources that users and groups access, started procedures
    must have an associated USERID. If a USERID is not associated with the started procedure, the started procedure will not
    have access to the resources. To ensure accountability and prevent unauthenticated access, organizational users must be
    identified and authenticated to prevent potential misuse and compromise of the system.
  impact: ''
  references: []
  page_start: 170
  audit_raw: 'Refer to the site security plan, the system administrator, and system libraries to

    determine list of stated tasks available on the system.

    If each Started task procedure identified has a unique associated userid or STC userid

    that is unique per product and function, this is not a finding.

    If any of the following are untrue, this is a finding.

    -All started task userids are connected to a valid STC group ID.

    -Only userids associated with STCs are connected to STC group IDs.

    -All STC userids are defined with the PROTECTED attribute.

    From the ISPF Command Shell enter:

    RL STARTED (Alternately execute RACF DSMON utility for the RACSPT report)

    If all of the following is true, this is not a finding,

    If any of the following is untrue, this is a finding.

    -A generic catch all profile of ** is defined to the STARTED resource class.

    -The STC group associated with the ** profile is not granted any explicit data set or

    resource access authorizations.

    -The STC userid associated with the ** profile is not granted any explicit dataset or

    resource access authorizations and is defined with the RESTRICTED attribute.

    Note: Execute the JCL in CNTL(IRRUT100) using the STC group associated with the **

    profile as SYSIN input. This report lists all occurrences of this group within the RACF

    database, including data set and resource access lists.

    Execute RACF utility DSMON RACSPT report.

    If the ICHRIN03 started procedures table is not maintained to support recovery efforts in

    the event the STARTED resource class is deactivated or critical STC profiles are

    deleted, this is a finding.

    If STCs critical to support this recovery effort (e.g., JES2, VTAM, TSO, etc.) are not

    maintained in ICHRIN03 to reflect the current STARTED resource class profiles, this is

    a finding.'
  remediation: 'Define a RACF STARTED Class profile for each Started Proc that maps the proc to a

    unique userid, or STC userids will be unique per product and function if supported by

    vendor documentation. This can be accomplished with the sample command:

    RDEF STARTED .** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    STDATA(USER() GROUP() TRACE(YES))

    A corresponding USERID must be defined with appropriate authority. The "groupname"

    should be a valid STC group with no interactive users.'
  checks:
  - type: manual_review
    info: 'Refer to the site security plan, the system administrator, and system libraries to

      determine list of stated tasks available on the system.

      If each Started task procedure identified has a unique associated userid or STC userid

      that is unique per product and function, this is not a finding.

