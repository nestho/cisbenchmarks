    Phr_word_minlen = 4

    Phr_dict.1 = ''IBM''

    Phr_dict.2 = ''RACF''

    Phr_dict.3 = ''PASSWORD''

    Phr_dict.4 = ''PHRASE''

    Phr_dict.5 = ''PASSPHRAS

    Phr_dict.6 = ''SECRET''

    Phr_dict.7 = ''IBMUSER''

    Phr_dict.8 = ''SYS1''

