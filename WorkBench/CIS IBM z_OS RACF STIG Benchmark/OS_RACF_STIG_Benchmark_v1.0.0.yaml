  title: RACF-UT-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS HFS objects for the z/OS UNIX Telnet Server must be properly protected. GROUP ID: V-223865 RULE ID:
