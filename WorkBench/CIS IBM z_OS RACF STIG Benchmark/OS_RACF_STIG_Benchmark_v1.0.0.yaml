  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'IBM RACF must limit Write or greater access to libraries that contain PPT modules to system programmers only.
    GROUP ID: V-223650 RULE ID: SV-223650r958472'
  rationale: 'Specific PPT designated program modules possess significant security bypass capabilities. Unauthorized access
