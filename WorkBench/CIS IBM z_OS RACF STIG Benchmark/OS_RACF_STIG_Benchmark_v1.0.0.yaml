- id: '1.79'
  title: RACF-ES-000785
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF exit ICHPWX11 for password phrases must be installed and properly configured. GROUP ID: V-230210
    RULE ID: SV-230210r998382'
  rationale: Use of a complex password phrase helps to increase the time and resources required to compromise the password.
    Password phrase complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password phrase complexity is one factor of several that determines how long it takes to crack
    a password. The more complex the password phrase, the greater the number of possible combinations that need to be tested
    before the password is compromised.
  impact: ''
  references: []
  page_start: 184
  audit_raw: 'From a system console screen issue the following modify command:

    F AXR,IRRPHREX LIST

