- id: '1.184'
  title: RACF-TC-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS TCPIP.DATA configuration statement must contain the DOMAINORIGIN or DOMAIN specified for each
    TCP/IP defined. GROUP ID: V-245536 RULE ID: SV-245536r991589'
  rationale: If data origin authentication and data integrity verification are not performed, the resultant response could
    be forged, it may have come from a poisoned cache, the packets could have been intercepted without the resolver's knowledge,
    or resource records could have been removed which would result in query failure or denial of service. Data origin authentication
    verification must be performed to thwart these types of attacks. Each client of name resolution services either performs
    this validation on its own or has authenticated channels to trusted validation providers. Information systems that provide
    name and address resolution services for local clients include, for example, recursive resolving or caching Domain Name
    System (DNS) servers. DNS client resolvers either perform validation of DNSSEC signatures, or clients use authenticated
    channels to recursive resolvers that perform such validations. This is not applicable if DNSSEC is not implemented on
    the local network.
  impact: ''
