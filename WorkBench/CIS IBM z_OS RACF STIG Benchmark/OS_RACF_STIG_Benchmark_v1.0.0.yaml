  title: RACF-OS-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS system administrator (SA) must develop a process to notify information system security officers
    (ISSOs) of account enabling actions. GROUP ID: V-223766 RULE ID: SV-223766r998367'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to enable an existing disabled account. Sending
    notification of account enabling actions to the SAs and ISSOs is one method for mitigating this risk. Such a capability
    greatly reduces the risk that operating system accessibility will be negatively affected for extended periods of time
    and also provides logging that can be used for forensic purposes. In order to detect and respond to events that affect
    user accessibility and application processing, operating systems must audit account enabling actions and, as required,
    notify the appropriate individuals so they can investigate the event. To address access requirements, many operating systems
    can be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy
    requirements.
  impact: ''
