      Facility (APF) authorized modules or libraries.

      • Requires access to system datasets or sensitive information or requires special

      or privileged authority to run.

      For the products in the above category, refer to the Vendor''s support lifecycle

      information for current versions and releases.

      If the software products currently running on the reviewed sy'
    severity: medium
- id: '1.142'
  title: RACF-OS-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must not allow nonexistent or inaccessible LINKLIST libraries. GROUP ID: V-223782 RULE ID: SV-223782r958804'
  rationale: Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating
    systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission
    requirements. This includes functions and services installed at the operating system level. Some of the programs, installed
    by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions,
    functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program
    execution is critical to maintaining a secure system baseline. Methods for complying with this requirement include restricting
    execution of programs in certain environments, while preventing execution in other environments; or limiting execution
    of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments,
    or roles).
  impact: ''
  references: []
  page_start: 315
  audit_raw: 'From and ISPF Command line enter:

    TSO ISRDDN LINKLIST

    Review the list, if there are any DUMMY entries i.e., inaccessible LINKLIST libraries,

    this is a finding.'
  remediation: 'Review all entries contained in the LINKLIST for the actual existence of each library.

    Develop a plan of action to correct deficiencies.

    The Linklist is a default set of libraries that MVS searches for a specified program. This

    facility is used so that a user does not have to know the library names in which utility

    types of programs are stored. Control over membership in the Linklist is specified within

    the operating system. The data set SYS1.PARMLIB(LNKLSTxx) is used to specify the

    library names. (The xx is the suffix designated by the LNK parameter in the IEASYSxx

    member of SYS1.PARMLIB, or overridden by the computer operator at IPL.)

    Use the following recommendations and techniques to control the exposures created by

    the LINKLIST facility:

    -Avoid inclusion of sensitive libraries in the LNKLSTxx member unless absolutely

    required.

    -The LNKLSTxx and PROGxx (LNKLST entries) members will contain only required

    libraries. On a semiannual basis, Software Support should review the volume serial

    numbers, and should verify them in accordance with the system catalog. Software

    Support will remove all nonexistent libraries. The ISSO should modify and/or delete the

    rules associated with these libraries.'
  checks:
  - type: manual_review
    info: 'From and ISPF Command line enter:

      TSO ISRDDN LINKLIST

      Review the list, if there are any DUMMY entries i.e., inaccessible LINKLIST libraries,

      this is a finding.'
    severity: medium
- id: '1.143'
  title: RACF-OS-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must not allow nonexistent or inaccessible Link Pack Area (LPA) libraries. GROUP ID: V-223783 RULE
    ID: SV-223783r958804'
  rationale: Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating
    systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission
    requirements. This includes functions and services installed at the operating system level. Some of the programs, installed
    by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions,
    functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program
    execution is critical to maintaining a secure system baseline. Methods for complying with this requirement include restricting
    execution of programs in certain environments, while preventing execution in other environments; or limiting execution
    of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments,
    or roles).
  impact: ''
  references: []
  page_start: 317
  audit_raw: 'From and ISPF Command line enter:

    TSO ISRDDN LPA

    Review the list, if there are any DUMMY entries i.e., inaccessible LPA libraries, this is a

    finding.'
  remediation: 'Review all entries contained in the LPA members for the actual existence of each

    library. Develop a plan of action to correct deficiencies.

    The system Link Pack Area (LPA) is the component of MVS that maintains core

    operating system functions resident in main storage. A security concern exists when

    libraries from which LPA modules are obtained require APF authorization.

    Control over residence in the LPA is specified within the operating system in the

    following members of the data set SYS1.PARMLIB:

    -LPALSTxx specifies the names of libraries to be concatenated to SYS1.LPALIB when

    the LPA is generated at IPL in an MVS/XA or MVS/ESA system. (The xx is the suffix

    designated by the LPA parameter in the IEASYSxx member of SYS1.PARMLIB or

    overridden by the computer operator at system initial program load [IPL].)

    -IEAFIXxx specifies the names of modules from SYS1.SVCLIB, the LPALSTxx

    concatenation, and the LNKLSTxx concatenation that are to be temporarily fixed in

    central storage in the Fixed LPA (FLPA) for the duration of an IPL. (The xx is the suffix

    designated by the FIX parameter in the IEASYSxx member of SYS1.PARMLIB or

    overridden by the computer operator at IPL.)

    -IEALPAxx specifies the names of modules that will be loaded from the following:

    ? SYS1.SVCLIB

    ? The LPALSTxx concatenation

    ? The LNKLSTxx concatenation as a temporary extension to the existing Pageable

    LPA (PLPA) in the Modified LPA (MLPA) for the duration of an IPL. (The xx is the suffix

    designated by the MLPA parameter in the IEASYSxx member of SYS1.PARMLIB or

    overridden by the computer operator at IPL.)

    Use the following recommendations and techniques to control the exposures created by

    the LPA facility:

    -The LPALSTxx, IEAFIXxx, and IEALPAxx members will contain only required libraries.

    On a semiannual basis, Software Support should review the volume serial numbers,

    and should verify them in accordance with the system catalog. Software Support will

    remove all nonexistent libraries. The ISSO should modify and/or delete the rules

    associated with these libraries.'
  checks:
  - type: manual_review
    info: 'From and ISPF Command line enter:

      TSO ISRDDN LPA

      Review the list, if there are any DUMMY entries i.e., inaccessible LPA libraries, this is a

      finding.'
    severity: medium
- id: '1.144'
  title: RACF-OS-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must not have inaccessible APF libraries defined. GROUP ID: V-223784 RULE ID: SV-223784r958478'
  rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Operating systems are capable of providing
    a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary
    to support essential organizational operations (e.g., key missions, functions). Examples of non-essential capabilities
    include, but are not limited to, games, software packages, tools, and demonstration software, not related to requirements
