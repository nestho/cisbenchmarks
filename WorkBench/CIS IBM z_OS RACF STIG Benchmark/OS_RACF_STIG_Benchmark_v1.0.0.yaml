    If the RACF CSVDYNEX.LIST resource and/or generic equivalent is defined with

    AUDIT(FAILURE(READ)SUCCESS(UPDATE)) and WRITE or greater access restricted

    to system programming personnel, this is not a finding.

    If the RACF CSVDYNEX.LIST resource and/or generic equivalent is defined with READ

    access restricted to auditors, this is not a finding.

    If the products CICS and/or CONTROL-O are on the system, the RACF access to the

    CSVLLA resource and/or generic equivalent will be defined with AUDIT(ALL) and

    UPDATE access restricted to the CICS and CONTROL-O STC userids.

    If any software product requires access to dynamic LPA updates on the system, the

    RACF access to the CSVDYLPA resource and/or generic equivalent will be defined with

    LOG and SERVICE(UPDATE) only after the product has been validated with the

    appropriate STIG or SRG for compliance AND receives documented and filed

    authorization that details the need and any accepted risks from the site ISSM or

    equivalent security authority.

    Note: In the above, UPDATE access can be substituted with ALTER or CONTROL.

    Review the permissions in the IBM documentation when specifying UPDATE.'
  remediation: 'Configure the Dynamic List resources to be defined to the RACF FACILITY resource

    class and protected. Only system programmers and a limited number of authorized

    users and approved authorized Started Tasks are able to issue these commands. All

    access is logged.

    The required CSV-prefixed Facility Class resources are listed below. These resources

    or generic equivalents should be defined and permitted as required with only z/OS

    systems programmers and logging enabled. Minimum required list of CSV-prefixed

    resources:

    CSVAPF.**

    CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC

    CSVAPF.MVS.SETPROG.FORMAT.STATIC

    CSVDYLPA.**

    CSVDYLPA.ADD.**

    CSVDYLPA.DELETE.**

    CSVDYNEX.**

    CSVDYNEX.LIST

    CSVDYNL.**

    CSVDYNL.UPDATE.LNKLST

    CSVLLA.**

    Limit authority to those resources to z/OS systems programmers. Restrict to the

    absolute minimum number of personnel with AUDIT(ALL(READ)) and UPDATE access.

    Sample commands are shown here to accomplish this:

    RDEF FACILITY CSVAPF.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))

    RDEF FACILITY CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC.** UACC(NONE)

    OWNER(syspsmpl) AUDIT(ALL(READ))

    RDEF FACILITY CSVAPF.MVS.SETPROG.FORMAT.STATIC.** UACC(NONE)

    OWNER(syspsmpl) AUDIT(ALL(READ))

    PERMIT CSVAPF.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    PERMIT CSVAPF.MVS.SETPROG.SETPROG.FORMAT.DYNAMIC.**

    CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    PERMIT CSVAPF.MVS.SETPROG.SETPROG.FORMAT.STATIC.** CLASS(FACILITY)

    ID(syspsmpl) ACCESS(UPDATE)

    The CSVDYLPA.ADD resource will be permitted to products BMC Mainview, CA 1, and

    CA Common Services STC userids with AUDIT(ALL(READ)) and UPDATE access.

    The CSVDYLPA.DELETE resource will be permitted to products CA 1 and CA Common

    Services STC userids with AUDIT(ALL(READ)) and UPDATE access.

    Sample commands are shown here to accomplish one set of resources:

    RDEF FACILITY CSVDYLPA.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))

    RDEF FACILITY CSVDYLPA.ADD.** UACC(NONE) OWNER(syspsmpl)

    AUDIT(ALL(READ))

    RDEF FACILITY CSVDYLPA.DELETE.** UACC(NONE) OWNER(syspsmpl)

    AUDIT(ALL(READ))

    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(BMC Mainview STC userid)

    ACCESS(UPDATE)

    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(CA 1 STC userid) ACCESS(UPDATE)

    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(CCS STC userid) ACCESS(UPDATE)

    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(BMC Mainview STC userid)

    ACCESS(UPDATE)

    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(CA 1 STC userid)

    ACCESS(UPDATE)

    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(CCS STC userid)

    ACCESS(UPDATE)

    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(CA 1 STC userid)

    ACCESS(UPDATE)

    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(CCS STC userid)

    ACCESS(UPDATE)

