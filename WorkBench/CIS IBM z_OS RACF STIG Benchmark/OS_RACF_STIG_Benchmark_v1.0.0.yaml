- id: '1.152'
  title: RACF-OS-000400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS must employ a session manager that conceals, via the session lock, information previously visible
    on the display with a publicly viewable image. GROUP ID: V-223794 RULE ID: SV-223794r958404'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not log out because of the temporary nature of the absence. The session lock
    is implemented at the point where session activity can be determined. The operating system session lock event must include
    an obfuscation of the display screen so as to prevent other users from reading what was previously displayed. Publicly
    viewable images can include static or dynamic images, for example, patterns used with screen savers, photographic images,
    solid colors, a clock, a battery life indicator, or a blank screen, with the additional caveat that none of the images
    convey sensitive information.
  impact: ''
  references: []
  page_start: 332
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use, this is a finding.

    If the session manager is not configure to conceal, via the session lock, information

    previously visible on the display with a publicly viewable image, this is a finding.'
  remediation: 'Configure the session manager to conceal, via the session lock, information previously

    visible on the display with a publicly viewable image.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use, this is a finding.

      If the session manager is not configure to conceal, via the session lock, information

      previously visible on the display with a publicly viewable image, this is a finding.'
    severity: medium
- id: '1.153'
  title: RACF-OS-000410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must employ a session manager to manage session lock after a 15-minute period of inactivity. GROUP
    ID: V-223795 RULE ID: SV-223795r958402'
  rationale: A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems
    need to be able to identify when a user's session has idled and take action to initiate the session lock.
  impact: ''
  references: []
  page_start: 333
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use, this is a finding.

    If the session manager is not configured to initiate session lock after a 15-minute period

    of inactivity, this is a finding.'
  remediation: 'Configure the session manager to initiate a session lock after a 15-minute period of

    inactivity.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use, this is a finding.

      If the session manager is not configured to initiate session lock after a 15-minute period

      of inactivity, this is a finding.'
    severity: medium
- id: '1.154'
  title: RACF-OS-000420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must employ a session for users to directly initiate a session lock for all connection types. GROUP
    ID: V-223796 RULE ID: SV-223796r998372'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Rather than be forced to wait for a period
    of time to expire before the user session can be locked, operating systems need to provide users with the ability to manually
    invoke a session lock so users may secure their session should the need arise for them to temporarily vacate the immediate
    physical vicinity.
  impact: ''
  references: []
  page_start: 334
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use, this is a finding.

    If the session manager in use does not allow users to directly initiate a session lock for

    all connection types, this is a finding.'
  remediation: 'Develop a procedure to offload SMF files to a different system or media than the system

    being audited.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use, this is a finding.

      If the session manager in use does not allow users to directly initiate a session lock for

      all connection types, this is a finding.'
    severity: medium
- id: '1.155'
  title: RACF-OS-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must employ a session manager to manage retaining a users session lock until that user reestablishes
    access using established identification and authentication procedures. GROUP ID: V-223797 RULE ID: SV-223797r958400'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, the session lock must remain in place until the user reauthenticates. No other activity
    aside from reauthentication must unlock the system.
  impact: ''
  references: []
  page_start: 335
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use this is a finding.

    If the session manager is not configured to retain a user''s session lock until that user

    reestablishes access using established identification and authentication procedures, this

    is a finding.'
  remediation: 'Configure the session manager to retain a user''s session lock until that user

    reestablishes access using established identification and authentication procedures.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use this is a finding.

      If the session manager is not configured to retain a user''s session lock until that user

      reestablishes access using established identification and authentication procedures, this

      is a finding.'
    severity: medium
- id: '1.156'
  title: RACF-OS-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator must develop a procedure to remove or disable temporary user accounts after
    72 hours. GROUP ID: V-223798 RULE ID: SV-223798r998374'
  rationale: Emergency accounts are privileged accounts that are established in response to crisis situations where the need
    for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by the organization's system administrators when network or normal logon/access is not available).
    Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in
    response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling time period
    may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account
    should be established for privileged users who need long-term maintenance accounts. To address access requirements, many
    operating systems can be integrated with enterprise-level authentication/access mechanisms that meet or exceed access
    control policy requirements.
  impact: ''
  references: []
  page_start: 336
  audit_raw: 'Ask the system administrator (SA) for the procedure to automatically remove or disable

    temporary user accounts after 72 hours.

    If there is no procedure, this is a finding.'
  remediation: 'Develop a procedure to automatically remove or disable temporary user accounts after

    72 hours.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator (SA) for the procedure to automatically remove or disable

      temporary user accounts after 72 hours.

      If there is no procedure, this is a finding.'
    severity: medium
- id: '1.157'
  title: RACF-OS-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator must develop a procedure to notify designated personnel if baseline configurations
    are changed in an unauthorized manner. GROUP ID: V-223800 RULE ID: SV-223800r958794'
  rationale: Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow
    unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects,
    some of which may be relevant to security. Detecting such changes and providing an automated response can help avoid unintended,
    negative consequences that could ultimately affect the security state of the operating system. The operating system's
    IMO/ISSO and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of
    a configuration item.
