  audit_raw: 'If the CONSOLE privilege is not defined to the TSOAUTH resource class, this is not a

    finding.

    At the discretion of the site, users may be allowed to issue z/OS system commands

    from a TSO session. With this in mind, review the following items for users granted the

    CONSOLE resource in the TSOAUTH resource class:

    If Userids are restricted to the INFO level on the AUTH parameter specified in the

    OPERPARM segment of their userid, this is not a finding.

    If Userids are restricted to READ access to the MVS.MCSOPER.userid resource

    defined in the OPERCMDS resource class, this is not a finding.

    If Userids and/or group IDs are restricted to READ access to the CONSOLE resource

    defined in the TSOAUTH resource class, this is not a finding.'
  remediation: 'Evaluate the impact of correcting any deficiencies. Develop a plan of action and

    implement the required changes.

    Ensure the following items are in effect for all MCS consoles:

    Define a profile protecting the use of the CONSOLE command within TSO. A sample

    command to accomplish this is shown here: RDEF TSOAUTH CONSOLE

    UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    Permit only authorized users. A sample command to accomplish this is shown here: PE

    CONSOLE CL(TSOAUTH) ID()

    Set up the OPERPARM segment in corresponding user-class entry. A sample

    command to accomplish this is shown here: ALU OPERPARM(AUTH(INFO))

    Userids are restricted to READ access to the MVS.MCSOPER.userid resource defined

    in the OPERCMDS resource class. A sample command to accomplish this is shown

    here using the GLOBAL class:

    RDEF GLOBAL OPERCMDS ADDMEM(MVS.MCSOPER.&RACUID/READ)

    OWNER(ADMIN)'
