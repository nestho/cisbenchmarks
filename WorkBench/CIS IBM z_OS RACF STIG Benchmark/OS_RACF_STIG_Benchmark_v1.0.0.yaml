- id: '1.117'
  title: RACF-JS-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS RJE workstations and NJE nodes must be controlled in accordance with security requirements. GROUP
    ID: V-223756 RULE ID: SV-223756r991589'
  rationale: 'Configuring the operating system to implement organization-wide security implementation guides and security
    checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects
    the most restrictive security posture consistent with operational requirements. Configuration settings are the set of
    parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture
    and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the
    system, including the parameters required to satisfy other security control requirements. Security-related parameters
    include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports,
    protocols, services, and remote connections.'
  impact: ''
  references: []
  page_start: 268
  audit_raw: 'Note that this guidance addresses RJE Workstations that are "Dedicated". If an RJE

    workstation is dedicated, the assumption is that the RJE to host connection is hardwired between the RJE and host. In
    this case the RMT definition statement will contain

    the keyword LINE= which specifies that this RJE is only connected via that one LINE

    statement.

    Refer to the JES2PARM member of PARMLIB.

    If all of the statements below are true, this is not a finding.

    If any of the statements below are untrue, this is a finding.

    Review the JES2 parameters for RJE workstation definitions by searching for RMT( in

    the report.

    A userid of RMTnnnn is defined to RACF for each RJE workstation, where nnnn is the

    number on the RMT statement.

    No userid segments (e.g., TSO, CICS, etc.) are defined.

    Restricted from accessing all data sets and resources with exception of the

    corresponding JESINPUT class profile for that remote.

    NOTE: Execute the JCL in CNTL(IRRUT100) using the RACF RMTnnnn userids as

    SYSIN input. This report lists all occurrences of these userids within the RACF

    database, including data set and resource access lists.

    A FACILITY-Class profile exists in the format RJE.RMTnnnn where nnn identifies the

    remote number.'
  remediation: 'Note that this guidance addresses RJE Workstations that are "Dedicated". If an RJE

    workstation is dedicated, the assumption is that the RJE to host connection is hardwired between the RJE and host. In
    this case the RMT definition statement will contain

    the keyword LINE= which specifies that this RJE is only connected via that one LINE

    statement.

    Review the JES2 parameters for RJE workstation definitions by searching for RMT( in

    the report.

    Configure the RJE workstation userids to be defined as follows:

    A userid of RMTnnnn is defined to RACF for each RJE workstation, where nnnn is the

    number on the RMT statement.

    No userid segments (e.g., TSO, CICS, etc.) are defined.

    Restricted from accessing all data sets and resources with exception of the

    corresponding JESINPUT-class profile for that remote.

    Review Chapter 17 of the RACF Security Admin Guide. The following is an example

    that show proper implementation:

    AG RMTGRP OWNER(ADMIN) SUPGROUP(ADMIN)

    AU RMT777 NAME(''RMT RJE 777'') DFLTGRP(RMTGRP) OWNER(RMTGRP)

    DATA(''COMPLY WITH ZJES0011'') NOPASS RESTRICTED

    PE RMT777 CL(JESINPUT) ID(RMT777)

    Ensure that a FACILITY-Class profile exists in the format RJE.RMTnnnn where nnn

    identifies the remote number.

    A command example is shown here:

    RDEF FACILITY RJE.RMT777 UACC(NONE) OWNER(ADMIN) DATA(''COMPLY WITH

    ZJES0011 FOR RJE 777'')'
