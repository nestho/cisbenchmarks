    severity: medium
- id: '1.9'
  title: RACF-ES-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM RACF must protect memory and privileged program dumps in accordance with proper security requirements.
    GROUP ID: V-223654 RULE ID: SV-223654r958472'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Execute a resource access list for the IEAABD. resources.

    If the IEAABD. resource and/or generic equivalent is defined with no access and all

    access logged, this is not a finding.

    If the IEAABD.DMPAUTH. resource and/or generic equivalent is defined with READ

    access limited to authorized users, this is not a finding.

    If the IEAABD.DMPAUTH. resource and/or generic equivalent WRITE or greater access

    is restricted to only systems personnel and all access is logged, this is not a finding.

    If the IEAABD.DMPAKEY resource and/or generic equivalent is defined and all access

    is restricted to systems personnel and that all access is logged, this is not a finding.'
  remediation: 'Memory and privileged program dump resources are provided via resources in the

    FACILITY resource class. Configure these resources to the ESM as specified in the

    following.

    (Note: The resources and/or resource prefixes identified below are examples of a

    possible installation. The actual resources and/or resource prefixes are determined

    when the product is actually installed on a system through the product''s installation

    guide and can be site specific.)

    Below is listed the access requirements for memory and privileged program dump

    resources. Ensure the guidelines for the resource type, resources, and/or generic

    equivalent are followed. When protecting the facilities for dumps lists via the FACILITY

    resource class, ensure that the following items are in effect:

    IEAABD.

    IEAABD.DMPAUTH.

    IEAABD.DMPAKEY.

    The RACF resource rules for the resources specify UACC(NONE) and NOWARNING.

    Ensure that no access is given to "IEAABD." resource.

    Example:

    RDEF FACILITY IEAABD.** UACC(NONE) OWNER(owner group) AUDIT(ALL(READ))

    IEAABD.DMPAUTH. READ access is limited to authorized users that have a valid job

    duties requirement for access. WRITE or greater access will be restricted to system

    programming personnel and access will be logged.

    Example:

    RDEF FACILITY IEAABD.DMPAUTH.** UACC(NONE) OWNER(owner group)

    AUDIT(ALL(UPDATE))

    PERMIT IEAABD.DMPAUTH.** CLASS(FACILITY) ID(authusers) ACCESS(READ)

    PERMIT IEAABD.DMPAUTH.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    IEAABD.DMPAKEY. access will be restricted to system programming personnel and

    access will be logged.

    Example:

    RDEF FACILITY IEAABD.DMPAKEY.** UACC(NONE) OWNER(owner group)

    AUDIT(ALL(READ))

    PERMIT IEAABD.DMPAKEY.** CLASS(FACILITY) ID(syspsmpl) ACCESS(READ)'
  checks:
  - type: manual_review
    info: 'Execute a resource access list for the IEAABD. resources.

      If the IEAABD. resource and/or generic equivalent is defined with no access and all

      access logged, this is not a finding.

      If the IEAABD.DMPAUTH. resource and/or generic equivalent is defined with READ

      access limited to authorized users, this is not a finding.

      If the IEAABD.DMPAUTH. resource and/or generic equivalent WRITE or greater access

