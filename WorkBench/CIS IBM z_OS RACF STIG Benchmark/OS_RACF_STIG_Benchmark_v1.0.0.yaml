    If the OPERAUDIT value is not listed as one of the ATTRIBUTES, this is a finding.'
  remediation: 'NOTE: The RACF AUDITOR attribute is required in order to specify SETROPTS

    OPERAUDIT and also to display the OPERAUDIT attribute with the SETROPTS LIST

    command.

    Configure the OPERAUDIT SETROPTS value to be set to OPERAUDIT. This specifies

