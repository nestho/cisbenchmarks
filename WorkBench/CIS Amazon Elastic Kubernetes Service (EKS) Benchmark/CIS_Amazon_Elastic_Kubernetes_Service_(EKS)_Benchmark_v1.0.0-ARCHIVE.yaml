- id: 4.2.6
  title: Minimize the admission of root containers
  scoring: scored
  profile:
  - Level 2
  description: Do not generally permit containers to be run as the root user.
  rationale: Containers may run as any Linux user. Containers which run as the root user, whilst constrained by Container
    Runtime security features still have a escalated likelihood of container breakout. Ideally, all containers should run
    as a defined non-UID 0 user. There should be at least one PodSecurityPolicy (PSP) defined which does not permit root users
    in a container. If you need to run root containers, this should be defined in a separate PSP and you should carefully
    check RBAC controls to ensure that only limited service accounts and users are given permission to access that PSP.
  impact: 79 | P a g e Pods with containers which run as the root user will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/pod-security-policy/#enabling-podsecurity-policies
  page_start: 79
  audit_raw: 'Get the set of PSPs with the following command:

    kubectl get psp

