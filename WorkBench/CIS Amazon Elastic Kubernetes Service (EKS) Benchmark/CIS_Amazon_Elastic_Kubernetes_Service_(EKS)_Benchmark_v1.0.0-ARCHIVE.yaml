- id: 5.5.1
  title: Manage Kubernetes RBAC users with AWS IAM Authenticator for Kubernetes
  scoring: manual
  profile:
  - Level 2
  description: Amazon EKS uses IAM to provide authentication to your Kubernetes cluster through the AWS IAM Authenticator
    for Kubernetes. You can configure the stock kubectl client to work with Amazon EKS by installing the AWS IAM Authenticator
    for Kubernetes and modifying your kubectl configuration file to use it for authentication.
  rationale: On- and off-boarding users is often difficult to automate and prone to error. Using a single source of truth
    for user permissions reduces the number of locations that an individual must be off-boarded from, and prevents users gaining
    unique permissions sets that increase the cost of audit.
  impact: Users must now be assigned to the IAM group created to use this namespace and deploy applications. If they are not
    they will not be able to access the namespace or deploy. 126 | P a g e
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/add-user-role.html
  page_start: 126
  audit_raw: 'To Audit access to the namespace $NAMESPACE, assume the IAM role yourIAMRoleName

    for a user that you created, and then run the following command:

    $ kubectl get role -n $NAMESPACE

    The response lists the RBAC role that has access to this Namespace.'
  remediation: Refer to the 'Managing users or IAM roles for your cluster' in Amazon EKS documentation.
  checks:
