controls:
- id: '2.1'
  title: Logging 2.1.1 Enable audit Logs
  scoring: manual
  profile:
  - Level 1
  description: The audit logs are part of the EKS managed Kubernetes control plane logs that are managed by Amazon EKS. Amazon
    EKS is integrated with AWS CloudTrail, a service that provides a record of actions taken by a user, role, or an AWS service
    in Amazon EKS. CloudTrail captures all API calls for Amazon EKS as events. The calls captured include calls from the Amazon
    EKS console and code calls to the Amazon EKS API operations.
  rationale: Exporting logs and metrics to a dedicated, persistent datastore such as CloudTrail ensures availability of audit
    data following a cluster security event, and provides a central location for analysis of log and metric data collated
    from multiple sources.
  impact: 'Audit logs will be created on the master nodes, which will consume disk space. Care should be taken to avoid generating
    too large volumes of log information as this could impact the available of the cluster nodes. S3 lifecycle features can
    be used to manage the accumulation and management of logs over time. See the following AWS resource for more information
    on these features: http://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html'
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://aws.github.io/aws-eks-best-practices/detective/
  page_start: 13
  audit_raw: "Perform the following to determine if CloudTrail is enabled for all regions:\nVia the Management Console\n1.\
    \ Sign in to the AWS Management Console and open the EKS console at\nhttps://console.aws.amazon.com/eks\n2. Click on Cluster\
    \ Name of the cluster you are auditing\n3. Click Logging\nYou will see Control Plane Logging info\n API Server Audit Authenticator\n\
    \ Enabled/Disabled Enabled/Disabled Enabled/Disabled\n Controller Manager Scheduler\n Enabled/Disabled Enabled/Disabled\n\
    4. Ensure all 5 choices are set to Enabled\n13 | P a g e"
  remediation: 'Perform the following to determine if CloudTrail is enabled for all regions:

    Via The Management Console

    1. Sign in to the AWS Management Console and open the EKS console at

    https://console.aws.amazon.com/eks

    2. Click on Cluster Name of the cluster you are auditing

    3. Click Logging

    4. Select Manage Logging from the button on the right hand side

    5. Toggle each selection to the Enabled position.

    6. Click Save Changes

    Via CLI

    aws --region "${REGION_CODE}" eks describe-cluster --name "${CLUSTER_NAME}" -

    -query ''cluster.logging.clusterLogging[?enabled==true].types'
  checks:
  - type: manual_review
    info: "Perform the following to determine if CloudTrail is enabled for all regions:\nVia the Management Console\n1. Sign\
      \ in to the AWS Management Console and open the EKS console at\nhttps://console.aws.amazon.com/eks\n2. Click on Cluster\
      \ Name of the cluster you are auditing\n3. Click Logging\nYou will see Control Plane Logging info\n API Server Audit\
      \ Authenticator\n Enabled/Disabled Enabled/Disabled Enabled/Disabled\n Controller Manager Scheduler\n Enabled/Disabled\
      \ Enabled/Disabled\n4. Ensure all 5 choices are s"
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: If kubelet is running, and if it is using a file-based kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  page_start: 16
  audit_raw: 'SSH to the worker nodes

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /var/lib/kubelet/kubeconfig which is the location of the kubeconfig file.

    Run this command to obtain the kubeconfig file permissions:

    stat -c %a /var/lib/kubelet/kubeconfig

    16 | P a g e

    The output of the above command gives you the kubeconfig file''s permissions.

    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /var/lib/kubelet/kubeconfig which is the location of th'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: manual
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kubelet controls various parameters for the kubelet service in the worker node. You should
    set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  page_start: 18
  audit_raw: 'SSH to the worker nodes

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /var/lib/kubelet/kubeconfig which is the location of the kubeconfig file.

    Run this command to obtain the kubeconfig file ownership:

    stat -c %U:%G /var/lib/kubelet/kubeconfig

    The output of the above command gives you the kubeconfig file''s ownership. Verify that the

    ownership is set to root:root.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    18 | P a g e

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %U:%G /var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /var/lib/kubelet/kubeconfig which is the location of th'
- id: 3.1.3
  title: Ensure that the kubelet configuration file has permissions set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file is specified you should restrict its file permissions to maintain the integrity of the file. The
    file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  page_start: 20
  audit_raw: 'First, SSH to the relevant worker node:

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /etc/kubernetes/kubelet/kubelet-config.json which is the location of the Kubelet

    config file.

    Run the following command:

    stat -c %a /etc/kubernetes/kubelet/kubelet-config.json

    The output of the above command is the Kubelet config file''s permissions. Verify that the

    permissions are 644 or more restrictive.'
  remediation: 'Run the following command (using the config file location identied in the Audit step)

    20 | P a g e

    chmod 644 /etc/kubernetes/kubelet/kubelet-config.json'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet/kubelet-config.json
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'First, SSH to the relevant worker node:

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet/kubelet-config.'
