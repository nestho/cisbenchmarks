- id: 5.2.1
  title: Prefer using dedicated EKS Service Accounts
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes workloads should not use cluster node service accounts to authenticate to Amazon EKS APIs. Each
    Kubernetes workload that needs to authenticate to other AWS services using AWS IAM should be provisioned with a dedicated
    Service account.
  rationale: 'Manual approaches for authenticating Kubernetes workloads running on Amazon EKS against AWS APIs are: storing
    service account keys as a Kubernetes secret (which introduces manual key rotation and potential for key compromise); or
    use of the underlying nodes'' IAM Service account, which violates the principle of least privilege on a multi-tenanted
    node, when one pod needs to have access to a service, but every other pod on the node that uses the Service account does
    not.'
  impact: ''
  references:
  - 1. https://aws.github.io/aws-eks-best-practices/iam/
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-serviceaccounts.html
  page_start: 112
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service account

    and ensure that it has no roles or cluster roles bound to it apart from the defaults.

    Additionally ensure that the automountServiceAccountToken: false setting is in place for

    each default service account.'
  remediation: 'With IAM roles for service accounts on Amazon EKS clusters, you can associate an IAM role

    with a Kubernetes service account. This service account can then provide AWS permissions

    to the containers in any pod that uses that service account. With this feature, you no longer

    need to provide extended permissions to the worker node IAM role so that pods on that

    node can call AWS APIs.

    Applications must sign their AWS API requests with AWS credentials. This feature provides

    a strategy for managing credentials for your applications, similar to the way that Amazon

    EC2 instance profiles provide credentials to Amazon EC2 instances. Instead of creating and

    distributing your AWS credentials to the containers or using the Amazon EC2 instance’s

    112 | P a g e

    role, you can associate an IAM role with a Kubernetes service account. The applications in

    the pod’s containers can then use an AWS SDK or the AWS CLI to make API requests to

    authorized AWS services.

    The IAM roles for service accounts feature provides the following benefits:

    • Least privilege — By using the IAM roles for service accounts feature, you no longer

    need to provide extended permissions to the worker node IAM role so that pods on

    that node can call AWS APIs. You can scope IAM permissions to a service account,

    and only pods that use that service account have access to those permissions. This

    feature also eliminates the need for third-party solutions such as kiam or kube2iam.

    • Credential isolation — A container can only retrieve credentials for the IAM role

    that is associated with the service account to which it belongs. A container never has

    access to credentials that are intended for another container that belongs to another

    pod.

    • Auditability — Access and event logging is available through CloudTrail to help

    ensure retrospective auditing.

    To get started, see Enabling IAM roles for service accounts on your cluster.

    For an end-to-end walkthrough using eksctl, see Walkthrough: Updating a DaemonSet to

    use IAM for service accounts.'
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service account

      and ensure that it has no roles or cluster roles bound to it apart from the defaults.

      Additionally ensure that the automountServiceAccountToken: false setting is in place for

      each default service account.'
    severity: medium
- id: 5.3.1
  title: Ensure Kubernetes Secrets are encrypted using Customer Master Keys (CMKs) managed in AWS KMS
  scoring: scored
  profile:
  - Level 1
  description: Encrypt Kubernetes secrets, stored in etcd, using secrets encryption feature during Amazon EKS cluster creation.
  rationale: Kubernetes can store secrets that pods can access via a mounted volume. Today, Kubernetes secrets are stored
    with Base64 encoding, but encrypting is the recommended approach. Amazon EKS clusters version 1.13 and higher support
    the capability of encrypting your Kubernetes secrets using AWS Key Management Service (KMS) Customer Managed Keys (CMK).
    The only requirement is to enable the encryption provider support during EKS cluster creation. Use AWS Key Management
    Service (KMS) keys to provide envelope encryption of Kubernetes secrets stored in Amazon EKS. Implementing envelope encryption
    is considered a security best practice for applications that store sensitive data and is part of a defense in depth security
    strategy. Application-layer Secrets Encryption provides an additional layer of security for sensitive data, such as user
    defined Secrets and Secrets required for the operation of the cluster, such as service account keys, which are all stored
    in etcd. Using this functionality, you can use a key, that you manage in AWS KMS, to encrypt data at the application layer.
    This protects against attackers in the event that they manage to gain access to etcd.
  impact: ''
