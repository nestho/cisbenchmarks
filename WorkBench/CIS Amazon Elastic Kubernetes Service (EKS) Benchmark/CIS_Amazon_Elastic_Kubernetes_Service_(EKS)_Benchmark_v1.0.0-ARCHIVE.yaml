- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: manual
  profile:
  - Level 1
  description: Enable Endpoint Private Access to restrict access to the cluster's control plane to only an allowlist of authorized
    IPs.
  rationale: 'Authorized networks are a way of specifying a restricted range of IP addresses that are permitted to access
    your cluster''s control plane. Kubernetes Engine uses both Transport Layer Security (TLS) and authentication to provide
    secure access to your cluster''s control plane from the public internet. This provides you the flexibility to administer
    your cluster from anywhere; however, you might want to further restrict access to a set of IP addresses that you control.
    You can set this restriction by specifying an authorized network. Restricting access to an authorized network can provide
    additional security benefits for your container cluster, including: • Better protection from outsider attacks: Authorized
    networks provide an additional layer of security by limiting external access to a specific set of addresses you designate,
    such as those that originate from your premises. This helps protect access to your cluster in the case of a vulnerability
    in the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized networks
    help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked certificates
    used from outside Amazon EC2 and outside the authorized IP ranges (for example, from addresses outside your company) are
    still denied access.'
  impact: When implementing Endpoint Private Access, be careful to ensure all desired networks are on the allowlist (whitelist)
    to prevent inadvertently blocking external access to your cluster's control plane.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  page_start: 116
  audit_raw: "Input:\n116 | P a g e\naws eks describe-cluster \\\n --region <region> \\\n --name <clustername>\nOutput:\n\
    \ ...\n \"endpointPublicAccess\": false,\n \"endpointPrivateAccess\": true,\n \"publicAccessCidrs\": [\n \"203.0.113.5/32\"\
    \n ]\n ..."
  remediation: "Complete the following steps using the AWS CLI version 1.18.10 or later. You can check\nyour current version\
    \ with aws --version. To install or upgrade the AWS CLI, see Installing\nthe AWS CLI.\nUpdate your cluster API server\
    \ endpoint access with the following AWS CLI command.\nSubstitute your cluster name and desired endpoint access values.\
    \ If you set\nendpointPublicAccess=true, then you can (optionally) enter single CIDR block, or a commaseparated list of\
    \ CIDR blocks for publicAccessCidrs. The blocks cannot include reserved\naddresses. If you specify CIDR blocks, then the\
    \ public API server endpoint will only receive\nrequests from the listed blocks. There is a maximum number of CIDR blocks\
    \ that you can\nspecify. For more information, see Amazon EKS Service Quotas. If you restrict access to\nyour public endpoint\
    \ using CIDR blocks, it is recommended that you also enable private\nendpoint access so that worker nodes and Fargate\
    \ pods (if you use them) can communicate\nwith the cluster. Without the private endpoint enabled, your public access endpoint\
    \ CIDR\nsources must include the egress sources from your VPC. For example, if you have a worker\nnode in a private subnet\
    \ that communicates to the internet through a NAT Gateway, you\nwill need to add the outbound IP address of the NAT gateway\
    \ as part of a whitelisted CIDR\nblock on your public endpoint. If you specify no CIDR blocks, then the public API server\n\
    endpoint receives requests from all (0.0.0.0/0) IP addresses.\nNote\nThe following command enables private access and\
    \ public access from a single IP address\nfor the API server endpoint. Replace 203.0.113.5/32 with a single CIDR block,\
    \ or a commaseparated list of CIDR blocks that you want to restrict network access to.\nExample command:\naws eks update-cluster-config\
    \ \\\n --region region-code \\\n --name dev \\\n --resources-vpc-config \\\n endpointPublicAccess=true, \\\n117 | P a\
    \ g e\n publicAccessCidrs=\"203.0.113.5/32\",\\\n endpointPrivateAccess=true\nOutput:\n{\n \"update\": {\n \"id\": \"\
    e6f0905f-a5d4-4a2a-8c49-EXAMPLE00000\",\n \"status\": \"InProgress\",\n \"type\": \"EndpointAccessUpdate\",\n \"params\"\
    : [\n {\n \"type\": \"EndpointPublicAccess\",\n \"value\": \"true\"\n },\n {\n \"type\": \"EndpointPrivateAccess\",\n\
    \ \"value\": \"true\"\n },\n {\n \"type\": \"publicAccessCidrs\",\n \"value\": \"[\\203.0.113.5/32\\\"]\"\n }\n ],\n \"\
    createdAt\": 1576874258.137,\n \"errors\": []\n }"
  checks:
  - type: manual_review
    info: "Input:\n116 | P a g e\naws eks describe-cluster \\\n --region <region> \\\n --name <clustername>\nOutput:\n ...\n\
      \ \"endpointPublicAccess\": false,\n \"endpointPrivateAccess\": true,\n \"publicAccessCidrs\": [\n \"203.0.113.5/32\"\
      \n ]\n ..."
    severity: medium
- id: 5.4.2
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: manual
  profile:
  - Level 2
  description: Disable access to the Kubernetes API from outside the node network if it is not required.
  rationale: In a private cluster, the master node has two endpoints, a private and public endpoint. The private endpoint
    is the internal IP address of the master, behind an internal load balancer in the master's VPC network. Nodes communicate
    with the master using the private endpoint. The public endpoint enables the Kubernetes API to be accessed from outside
    the master's VPC network. Although Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability
    could potentially expose the Kubernetes publically with unrestricted access. Additionally, an attacker may be able to
    identify the current cluster and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required,
    disabling public endpoint will help prevent such threats, and require the attacker to be on the master's VPC network to
    perform any attack on the Kubernetes API.
  impact: Configure the EKS cluster endpoint to be private. See Modifying Cluster Endpoint Access for further information
    on this topic. 1. Leave the cluster endpoint public and specify which CIDR blocks can communicate with the cluster endpoint.
    The blocks are effectively a whitelisted set of public IP addresses that are allowed to access the cluster endpoint. 2.
    Configure public access with a set of whitelisted CIDR blocks and set private endpoint access to enabled. This will allow
    public access from a specific range of public IPs while forcing all network traffic between the kubelets (workers) and
    the Kubernetes API through the cross-account ENIs that get provisioned into the cluster VPC when the control plane is
    provisioned. 120 | P a g e
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  page_start: 120
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: manual
  profile:
  - Level 1
  description: Disable public IP addresses for cluster nodes, so that they only have private IP addresses. Private Nodes are
    nodes with no public IP addresses.
  rationale: Disabling public IP addresses on cluster nodes restricts access to only internal networks, forcing attackers
    to obtain local network access before attempting to compromise the underlying Kubernetes hosts.
  impact: To enable Private Nodes, the cluster has to also be configured with a private master IP range and IP Aliasing enabled.
    Private Nodes do not have outbound access to the public internet. If you want to provide outbound Internet access for
    your private nodes, you can use Cloud NAT or you can manage your own NAT gateway.
  references: []
  page_start: 122
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: manual
  profile:
  - Level 1
  description: Use Network Policy to restrict pod to pod traffic within a cluster and segregate workloads.
  rationale: By default, all pod to pod traffic within a cluster is allowed. Network Policy creates a podlevel firewall that
    can be used to restrict traffic between sources. Pod traffic is restricted by having a Network Policy that selects it
    (through the use of labels). Once there is any Network Policy in a namespace selecting a particular pod, that pod will
    reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected by
    any Network Policy will continue to accept all traffic. Network Policies are managed via the Kubernetes Network Policy
    API and enforced by a network plugin, simply creating the resource without a compatible network plugin to implement it
    will have no effect. EKS supports Network Policy enforcement through the use of Calico.
  impact: Network Policy requires the Network Policy add-on. This add-on is included automatically when a cluster with Network
    Policy is created, but for an existing cluster, needs to be added prior to enabling Network Policy. Enabling/Disabling
    Network Policy causes a rolling update of all cluster nodes, similar to performing a cluster upgrade. This operation is
    long-running and will block other operations on the cluster (including delete) until it has run to completion. If Network
    Policy is used, a cluster must have at least 2 nodes of type n1-standard-1 or higher. The recommended minimum size cluster
    to run Network Policy enforcement is 3 n1-standard-1 instances. 123 | P a g e Enabling Network Policy enforcement consumes
    additional resources in nodes. Specifically, it increases the memory footprint of the kube-system process by approximately
    128MB, and requires approximately 300 millicores of CPU.
  references: []
  page_start: 123
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
