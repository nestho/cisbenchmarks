- id: 3.2.10
  title: Ensure that the --rotate-certificates argument is not set to false
  scoring: manual
  profile:
  - Level 2
  description: Enable kubelet client certificate rotation.
  rationale: 'The --rotate-certificates setting causes the kubelet to rotate its client certificates by creating new CSRs
    as its existing credentials expire. This automated periodic rotation ensures that the there is no downtime due to expired
    certificates and thus addressing availability in the CIA security triad. Note: This recommendation only applies if you
    let kubelets get their certificates from the API server. In case your kubelet certificates come from an outside authority/tool
    (e.g. Vault) then you need to take care of rotation yourself. Note: This feature also require the RotateKubeletClientCertificate
    feature gate to be enabled (which is the default since Kubernetes v1.7)'
  impact: None
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/41912
