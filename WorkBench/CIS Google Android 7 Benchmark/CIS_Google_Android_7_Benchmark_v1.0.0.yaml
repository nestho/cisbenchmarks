  page_start: 35
  audit_raw: 'Follow the below steps to verify that Android Device Manager is enabled:

    1. Tap the System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Scroll to Device administration.

    5. Tap Device administrators.

    6. Verify that Android Device Manager is enabled.'
  remediation: 'Follow the below steps to enable Android Device Manager:

    1. Tap the System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Scroll to Device administration.

    5. Tap Device administrators.

    6. Tap Android Device Manager.

    7. Tap Activate this device administrator.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Android Device Manager is enabled:

      1. Tap the System Settings Gear Icon.

      2. Scroll to Personal.

      3. Tap Security.

      4. Scroll to Device administration.

      5. Tap Device administrators.

      6. Verify that Android Device Manager is enabled.'
    severity: medium
