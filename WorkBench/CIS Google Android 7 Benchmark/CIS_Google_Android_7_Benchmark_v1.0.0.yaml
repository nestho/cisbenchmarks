- id: '1.17'
  title: Ensure 'Automatic date & time' and 'Automatic time zone' are set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable Automatic date & time. For this setting to work correctly, Automatic time zone setting should also be
    enabled.
  rationale: Automatic date & time setting fetches the date and time information from the cellular provider and is generally
    more accurate and reliable than your own managed and set date and time. Accurate date and time could help in forensics,
    device recovery through Android Device Manager and maintain application and logs in a time-sync manner.
  impact: None 39 | P a g e
  references:
  - 1. https://support.google.com/nexus/answer/2841106?hl=en
  page_start: 39
  audit_raw: 'Follow the below steps to verify that Automatic date & time setting is enabled:

    1. Tap System Settings Gear Icon.

    2. Scroll to System.

    3. Tap Date & time.

    4. Verify that Automatic date & time setting is enabled.

    5. Verify that Automatic time zone setting is enabled as well.'
  remediation: 'Follow the below steps to enable Automatic date & time and Automatic time zone

    settings:

    1. Tap System Settings Gear Icon.

    2. Scroll to System.

    3. Tap Date & time.

    4. Toggle Automatic date & time setting to On position.

    5. Toggle Automatic time zone setting to On position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Automatic date & time setting is enabled:

      1. Tap System Settings Gear Icon.

      2. Scroll to System.

      3. Tap Date & time.

      4. Verify that Automatic date & time setting is enabled.

      5. Verify that Automatic time zone setting is enabled as well.'
    severity: medium
- id: '1.18'
  title: Ensure 'Remotely locate this device' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable remotely locating the device.
  rationale: Remotely locate this device setting helps you to track your lost device using Android Device Manager. It must
    be enabled for improving the recovery possibility of your device.
  impact: This setting requires you to keep location services enabled all the time. This might be a privacy issue for you.
  references:
  - 1. https://support.google.com/accounts/answer/3265955#location
  - 2. https://support.google.com/nexus/answer/6160491?hl=en
  page_start: 41
  audit_raw: 'Follow the below steps to verify that Remotely locate this device setting is enabled:

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Google.

    4. Tap Security.

