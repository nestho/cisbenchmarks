  title: Ensure 'Power button instantly locks' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Pressing the power button should lock the device instantly.
  rationale: Pressing the power button instantly puts the phone to sleep. Enabling Power button instantly locks setting ensures
    that the device is instantly locked as well.
  impact: None
  references:
  - 1. https://support.google.com/nexus/answer/2819522?hl=en
  page_start: 17
  audit_raw: 'Follow the below steps and verify that Power button instantly locks is enabled.

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal section.

    3. Tap Security.

    4. Tap the Gear icon next to Screen lock.

    5. Verify that Power button instantly locks is enabled.'
  remediation: 'Follow the below steps to enable the Power button instantly locks setting.

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal section.

    3. Tap Security.

    4. Tap the Gear icon next to Screen lock.

    5. Toggle Power button instantly locks setting to On position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Power button instantly locks is enabled.

      1. Tap System Settings Gear Icon.

      2. Scroll to Personal section.

      3. Tap Security.

      4. Tap the Gear icon next to Screen lock.

      5. Verify that Power button instantly locks is enabled.'
    severity: medium
- id: '1.6'
  title: Ensure 'Lock Screen Message' is configured
  scoring: scored
  profile:
  - Level 1
  description: Set a message to be displayed on the locked screen.
  rationale: When device screen is locked, a lock screen message helps to provide  deterrent warnings,  device recognition
    without needing to unlock it and  most importantly emergency information Such information could be valuable to both your
    device security as well as personnel security. It is thus recommended to have a suitable lock screen message.
  impact: Anyone who picks up your device can see your message and emergency information without unlocking your phone.
  references:
  - 1. https://support.google.com/nexus/answer/7055029?hl=en&ref_topic=7029556
  page_start: 19
  audit_raw: 'Follow the below steps and verify that Lock screen message is set.

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal section.

    3. Tap Security.

    4. Tap the Gear icon next to Screen lock.

    5. Verify that a suitable Lock screen message is set.'
  remediation: 'Follow the below steps to set up a Lock screen message.

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal section.

    3. Tap Security.

    4. Tap the Gear icon next to Screen lock.

    5. Tap Lock screen message.

    6. Write your message and tap Save.

    19 | P a g e'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Lock screen message is set.

      1. Tap System Settings Gear Icon.

      2. Scroll to Personal section.

      3. Tap Security.

      4. Tap the Gear icon next to Screen lock.

      5. Verify that a suitable Lock screen message is set.'
    severity: medium
- id: '1.7'
  title: Do not connect to untrusted Wi-Fi networks
  scoring: scored
  profile:
  - Level 2
  description: Do not connect to untrusted Wi-Fi networks.
  rationale: Connecting a device to an open untrusted network through unsecured channels can increase the remote attack surface
    of the device. Additionally, at present, the cellular data network is a more difficult medium to sniff than Wi-Fi. If
    you are going to be using public Wi-Fi, using a secure VPN is recommended. In most cases, you should avoid using a public
    or untrusted or free Wi-Fi.
  impact: You might have to use cellular data and would not be able to take advantage of Public WiFi.
  references:
  - 1. https://support.google.com/pixelphone/answer/2819519?hl=en&ref_topic=70843
  page_start: 21
  audit_raw: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

    untrusted network:

    1. Tap System Settings Gear Icon.

    2. Scroll to Wireless & networks.

    3. Tap Wi-Fi.

    4. Verify that the Wi-Fi switch is in the Off position or is connected to a trusted

    network only.'
  remediation: 'Follow the below steps to disable Wi-Fi or connect to a trusted network:

    1. Tap System Settings Gear Icon.

    2. Scroll to Wireless & networks.

    3. Tap Wi-Fi.

    4. Toggle Wi-Fi setting to the Off position or connect to a trusted network.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

      untrusted network:

      1. Tap System Settings Gear Icon.

      2. Scroll to Wireless & networks.

      3. Tap Wi-Fi.

      4. Verify that the Wi-Fi switch is in the Off position or is connected to a trusted

      network only.'
    severity: medium
- id: '1.8'
  title: Ensure 'Make passwords visible' is set to Disabled
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: Disable password visibility during input. Encrypt your device data.
  rationale: This setting controls whether passwords typed into your Android device should be visible on screen, or hidden
    by replacing the letters with dots. When this setting is off, the password is obscured by dots, and only the most recent
    key pressed is visible for a short time after it has been pressed. When this setting is on, the entire password can be
    viewed in plain text, if desired. Disabling this setting protects you against shoulder surfing attacks. Encryption stores
    your data in a form that can be read only when your device is unlocked. Unlocking your encrypted device decrypts your
    data. Encryption protects your data and protects it from disclosure.
  impact: Given the relative difficulty of typing letters accurately on a small on-screen keyboard, it can be helpful to get
    visual feedback on-screen that you have typed all the letters of your password correctly. Disabling password visibility
    might impact user experience. It might take around one hour to encrypt the device for the first time. You may not be able
    to use the device during this time. 24 | P a g e
  references:
  - 1. https://support.google.com/nexus/answer/2844831?hl=en&ref_topic=7029159
  page_start: 23
  audit_raw: 'Follow the below steps to verify Make password visible is set to disabled:

    1. Tap System Settings Gear Icon.

    2. Tap Security.

    3. Verify that Make passwords visible slider is off.

    Follow the below steps to verify that the device is encrypted:

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Verify that the device is encrypted.'
  remediation: 'Follow the below steps to disable Make password visible:

    1. Tap System Settings Gear Icon.

    2. Tap Security.

    3. Toggle Make passwords visible to Off position.

    Follow the below steps to encrypt the device:

    1. Tap System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Scroll to the Encryption section.

    5. Tap Encrypt phone or Encrypt Tablet.

    6. Tap Encrypt phone or Encrypt Tablet again.

    7. Enter Lock screen PIN or password if set.

    8. Tap Continue.

    9. Tap Encrypt phone or Encrypt Tablet.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify Make password visible is set to disabled:

      1. Tap System Settings Gear Icon.

      2. Tap Security.

      3. Verify that Make passwords visible slider is off.

      Follow the below steps to verify that the device is encrypted:

      1. Tap System Settings Gear Icon.

      2. Scroll to Personal.

      3. Tap Security.

      4. Verify that the device is encrypted.'
    severity: medium
- id: '1.10'
  title: Ensure 'Developer Options' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable Developer Options.
  rationale: Enabling Developer Options allows a user to drastically alter certain very advanced settings on the device. This
    can severely affect the way device functions and exposes greater and developmental features to the user. This also exposes
    the device to respond to features such as USB debugging (when enabled) and other such features that could be exploited
    to get malicious access to the device sub-system. Hence, the Developer Options should be disabled.
  impact: None
  references:
  - 1. http://www.howtogeek.com/175151/8-things-you-can-do-in-androids-developeroptions/
  page_start: 26
  audit_raw: 'Follow the below steps to verify that Developer Options is disabled:

    1. Tap System Settings Gear Icon.

    2. Scroll to System.

    3. Tap Developer options.

    4. Verify that it is Off.'
  remediation: 'Follow the below steps to disable Developer Options:

    1. Tap System Settings Gear Icon.

    2. Scroll to System.

    3. Tap Developer options.

    4. Toggle it to Off position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Developer Options is disabled:

      1. Tap System Settings Gear Icon.

      2. Scroll to System.

      3. Tap Developer options.

      4. Verify that it is Off.'
    severity: medium
- id: '1.11'
  title: Ensure 'Unknown sources' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable installation of apps from unknown sources.
  rationale: This setting determines whether applications can be installed from locations other than Google Play. Disabling
    installation from untrusted distribution channels protects against inadvertent installation of untrusted or malicious
    applications. Apps on Google play are vetted by Google Security Team and are mostly safe to install. You should avoid
    installing apps from anywhere else.
  impact: None
  references:
  - 1. https://support.google.com/nexus/answer/2812853?hl=en
  page_start: 28
  audit_raw: 'Follow the below steps to verify that Unknown sources is disabled:

    1. Tap System Settings Gear Icon.

    2. Tap Security.

    3. Scroll to Device administration.

    4. Verify that Unknown sources is disabled.'
  remediation: 'Follow the below steps to disable Unknown sources:

    1. Tap System Settings Gear Icon.

    2. Tap Security.

    3. Scroll to Device administration.

    4. Toggle Unknown sources to Off position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Unknown sources is disabled:

      1. Tap System Settings Gear Icon.

      2. Tap Security.

      3. Scroll to Device administration.

      4. Verify that Unknown sources is disabled.'
    severity: medium
- id: '1.12'
  title: Do not root your device
  scoring: scored
  profile:
  - Level 1
  description: Do not root your device.
  rationale: Rooting your Android device breaks the user level restrictions put by the Android operating system. This significantly
    opens up the device to allow literally any privileged action. Rooting enables any form of alteration to the device. This
    puts the device at a much greater risk because any vulnerability can be exploited without any restrictions. This also
    voids the warranty and future security updates are problematic to install. Hence, for all user purposes, do not root your
    device.
  impact: None
  references:
  - 1. http://www.wikihow.com/Check-if-Your-Android-Cellphone-Is-Rooted-or-Not
  - 2. http://www.wikihow.com/Unroot-Android
  page_start: 30
  audit_raw: 'Detecting whether a device is rooted or not is not straight forward. You would usually need

    to install terminal apps or root checker apps to detect rooted devices. Follow your device

    manufacturer support/documentation/community to detect rooting.'
  remediation: Follow your device manufacturer support/documentation/community to completely unroot your device.
  checks:
  - type: manual_review
    info: 'Detecting whether a device is rooted or not is not straight forward. You would usually need

      to install terminal apps or root checker apps to detect rooted devices. Follow your device

      manufacturer support/documentation/community to detect rooting.'
    severity: medium
- id: '1.13'
  title: Ensure 'Smart Lock' is set to Disabled
  scoring: scored
  profile:
  - Level 2
  description: Disable Smart Lock.
  rationale: Smart Lock detects device presence and its circumstances and automatically keeps it unlocked even if the device
    has a screen password, pin or pattern enabled. Using Smart Lock does not require you to manually unlock the device every
    time if the pre-defined circumstances are met. As a best practice, do not set the device to get unlocked automatically.
    For example, if your device gets stolen and if it is taken to a location predefined in Smart Lock, it would automatically
    unlock. Similarly, if someone could replay your voice, the device would automatically unlock.
  impact: The device would need to be manually unlocked every time.
  references:
  - 1. https://support.google.com/nexus/answer/6093922?hl=en
  page_start: 31
  audit_raw: 'Follow the below steps to verify that Smart Lock is disabled:

    1. Tap the System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Scroll to Advanced.

    5. Tap Trust agents.

    6. Verify that Smart Lock (Google) is Off.'
  remediation: 'Follow the below steps to disable Smart Lock:

    1. Tap the System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Scroll to Advanced.

    5. Tap Trust agents.

    6. Toggle Smart Lock (Google) to Off position.

    31 | P a g e'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Smart Lock is disabled:

      1. Tap the System Settings Gear Icon.

      2. Scroll to Personal.

      3. Tap Security.

      4. Scroll to Advanced.

      5. Tap Trust agents.

      6. Verify that Smart Lock (Google) is Off.'
    severity: medium
- id: '1.14'
  title: Ensure 'Lock SIM card' is set to Enabled
  scoring: scored
  profile:
  - Level 2
  description: Lock SIM card.
  rationale: 'If your device uses a SIM card(s), enable SIM card lock. A SIM card PIN locks the SIM and prevents anyone from
    removing the SIM card from your device and use it on any other device without knowing the PIN. Also, you might choose
    to store your contacts and messages on the SIM card and thus it is highly recommended that you safeguard this valuable
    personal data by setting a custom PIN on the SIM card(s). Note: Only phones that are not locked by the service provider
    can lock the SIM card.'
  impact: You would need to remember your SIM card PIN. If you forget your SIM card PIN, you need your SIM card provider support
    for unlocking the SIM card.
  references:
  - 1. https://support.google.com/android-one/answer/6174402?hl=en-GB
  page_start: 33
  audit_raw: 'Follow the below steps to verify that Lock SIM card is enabled:

    1. Tap the System Settings Gear Icon.

    2. Scroll to Personal.

    3. Tap Security.

    4. Tap Set up SIM card lock.

    5. Verify that Lock SIM card is enabled.

    6. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

    Lock SIM card is enabled there as well.'
  remediation: 'Follow the below steps to enable Lock SIM card:

    1. Call up your SIM card provider and get the default SIM PIN.

    2. Tap the System Settings Gear Icon.

    3. Scroll to Personal.

    4. Tap Security.

    5. Tap Set up SIM card lock.

    6. Tap Lock SIM card.

    7. Enter the default PIN provided by your SIM provider.

    8. Press OK.

    9. The Lock SIM card option will then be enabled.

    33 | P a g e

    10. Tap on Change SIM PIN.

    11. Again provide the default PIN provided (Old PIN) by your SIM card provider.

    12. Type your new custom PIN.

    13. Re-type your new custom PIN.

    14. Press OK.

    15. Your custom SIM PIN is then set.

    16. Repeat the process for your 2nd SIM, if applicable.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Lock SIM card is enabled:

      1. Tap the System Settings Gear Icon.

      2. Scroll to Personal.

      3. Tap Security.

      4. Tap Set up SIM card lock.

      5. Verify that Lock SIM card is enabled.

      6. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

      Lock SIM card is enabled there as well.'
    severity: medium
