- id: '7.13'
  title: Ensure that Network Security Groups Override the Default 'VirtualNetwork' Allow Rules
  scoring: scored
  profile:
  - Level 2
  description: 'A network security group filters traffic by security rules evaluated in priority order until the first match.
    By default, the AllowVnetInBound and AllowVnetOutBound rules permit all traffic carrying the VirtualNetwork service tag.
    A default-deny posture adds an explicit rule, evaluated after every allow rule, that denies all other traffic. Prerequisites:
    Identify every required inbound and outbound path, including Azure platform traffic such as load balancer health probes,
    and create narrowly scoped higherpriority allow rules before adding the deny rule.'
  rationale: 'The VirtualNetwork service tag spans more than the local subnet: Microsoft includes peered virtual networks,
    on-premises ranges reached over VPN or ExpressRoute, and gateway-connected networks. The default rules also permit unrestricted
    outbound access to the internet. Relying on them grants lateral reachability across that trust boundary and an open egress
    path a compromised workload can use for exfiltration or command-and-control.'
  impact: 'An explicit deny-all rule overrides the default VirtualNetwork and internet allow rules, so any inbound or outbound
    path not covered by a higher-priority allow rule stops working. Required platform traffic must be allowed first, including
    Azure load balancer health probes inbound and the outbound dependencies of subnet-injected services. Maintaining these
    allow rules is an ongoing task as connectivity changes. Warning: Do not create an outbound deny-all rule where Microsoft
    prohibits or advises against outbound restriction, including Application Gateway v2 subnets without Network Isolation
    and Microsoft Entra Domain Services subnets. Note: Applying the deny rule before the allow rules are in place can sever
    existing connectivity. Page 259'
  references:
  - 1. https://learn.microsoft.com/azure/virtual-network/network-security-groupsoverview
  - 2. https://learn.microsoft.com/azure/virtual-network/service-tags-overview
  page_start: 259
  audit_raw: "Audit from Azure Portal\n1. Go to Network security groups.\n2. Click the name of a network security group associated\
    \ with a workload subnet or\nnetwork interface.\n3. Under Settings, click Inbound security rules.\n4. Confirm a user-defined\
    \ rule exists with Source set to Any, Source port\nranges set to *, Destination set to Any, Service set to Custom with\n\
    Destination port ranges of *, Protocol set to Any, and Action set to\nDeny, at a priority number higher than (evaluated\
    \ after) every user-defined\nAllow rule.\n5. Under Settings, click Outbound security rules and confirm an\nequivalent\
    \ deny-all rule exists, except where Microsoft prohibits or advises\nagainst outbound restriction (Application Gateway\
    \ v2 without Network Isolation,\nand Microsoft Entra Domain Services).\n6. Repeat for each network security group, excluding\
    \ platform-managed subnets\nsuch as GatewaySubnet (which must not have a network security group),\nAzureBastionSubnet,\
    \ AzureFirewallSubnet, and RouteServerSubnet.\nTo screen the whole estate from Azure Resource Graph, run the following\
    \ query and\nreview each returned network security group against the scope exclusions above:\nresources\n| where type\
    \ =~ 'microsoft.network/networksecuritygroups'\n| mv-expand rule = iff(array_length(properties.securityRules) > 0,\nproperties.securityRules,\
    \ dynamic([null])) limit 1000\n| extend r = rule.properties\n| extend access = tostring(r.access), direction = tostring(r.direction),\
    \ priority =\ntoint(r.priority),\n srcAny = (tostring(r.sourceAddressPrefix) == '*' or\narray_index_of(r.sourceAddressPrefixes,\
    \ '*') >= 0),\n dstAny = (tostring(r.destinationAddressPrefix) == '*' or\narray_index_of(r.destinationAddressPrefixes,\
    \ '*') >= 0),\n sportAny = (tostring(r.sourcePortRange) == '*' or\narray_index_of(r.sourcePortRanges, '*') >= 0),\n dportAny\
    \ = (tostring(r.destinationPortRange) == '*' or\narray_index_of(r.destinationPortRanges, '*') >= 0),\n protoAny = (tostring(r.protocol)\
    \ == '*')\n| extend isDenyAll = (access =~ 'Deny' and srcAny and dstAny and sportAny and\ndportAny and protoAny), isAllow\
    \ = (access =~ 'Allow')\n| summarize inDeny = maxif(priority, isDenyAll and direction =~ 'Inbound'), outDeny\n= maxif(priority,\
    \ isDenyAll and direction =~ 'Outbound'), inAllow = maxif(priority,\nisAllow and direction =~ 'Inbound'), outAllow = maxif(priority,\
    \ isAllow and\ndirection =~ 'Outbound') by id, name\n| where isnull(inDeny) or isnull(outDeny) or inDeny <= coalesce(inAllow,\
    \ -1) or\noutDeny <= coalesce(outAllow, -1)\n Page 260\nA returned network security group is missing an inbound or outbound\
    \ deny-all rule, or\nhas one that is not evaluated after every Allow rule.\nAudit from Azure CLI\nList the deny-all rules\
    \ on each network security group:\naz network nsg rule list --resource-group <resource-group> --nsg-name <networksecurity-group>\
    \ --query \"[?access=='Deny' && protocol=='*' &&\n(sourceAddressPrefix=='*' || contains(sourceAddressPrefixes || \\`[]\\\
    `, '*')) &&\n(sourcePortRange=='*' || contains(sourcePortRanges || \\`[]\\`, '*')) &&\n(destinationAddressPrefix=='*'\
    \ || contains(destinationAddressPrefixes || \\`[]\\`,\n'*')) && (destinationPortRange=='*' || contains(destinationPortRanges\
    \ || \\`[]\\`,\n'*'))].{Name:name, Direction:direction, Priority:priority}\" --output table\nList the highest Allow priority\
    \ per direction:\naz network nsg rule list --resource-group <resource-group> --nsg-name <networksecurity-group> --query\
    \ \"[?access=='Allow'].{Direction:direction,\nPriority:priority}\" --output table\nEnsure a deny-all rule is returned\
    \ for both Inbound and Outbound, each at a priority\nhigher than the highest Allow priority in the same direction.\nAudit\
    \ from PowerShell\nList the deny-all rules on each network security group:\n$nsg = Get-AzNetworkSecurityGroup -Name <network-security-group>\
    \ -ResourceGroupName\n<resource-group>\n$nsg.SecurityRules | Where-Object {\n $_.Access -eq 'Deny' -and $_.Protocol -eq\
    \ '*' -and\n $_.SourceAddressPrefix -contains '*' -and\n $_.SourcePortRange -contains '*' -and\n $_.DestinationAddressPrefix\
    \ -contains '*' -and\n $_.DestinationPortRange -contains '*'\n} | Select-Object Name, Direction, Priority\nList the highest\
    \ Allow priority per direction:\n$nsg.SecurityRules | Where-Object { $_.Access -eq 'Allow' } | Group-Object\nDirection\
    \ | ForEach-Object {\n [pscustomobject]@{ Direction = $_.Name; MaxAllowPriority = ($_.Group.Priority |\nMeasure-Object\
    \ -Maximum).Maximum }\n}\nEnsure a deny-all rule is listed for both Inbound and Outbound, each at a priority\nhigher than\
    \ the highest Allow priority in the same direction.\n Page 261"
  remediation: "Complete the prerequisites in the Description before remediating.\nRemediate from Azure Portal\n1. Go to Network\
    \ security groups.\n2. Click the name of a network security group associated with a workload subnet or\nnetwork interface.\n\
    3. Under Settings, click Inbound security rules, then click Add.\n4. Set Source to Any, Source port ranges to *, Destination\
    \ to Any,\nService to Custom, Destination port ranges to *, Protocol to Any,\nAction to Deny, and Priority to an unused\
    \ number higher than every\nexisting Allow rule, such as the highest free number at or below 4096.\n5. Click Add.\n6.\
    \ Under Settings, click Outbound security rules and repeat steps 3-5 to\nadd an equivalent outbound deny-all rule, unless\
    \ the subnet is one where\nMicrosoft prohibits or advises against outbound restriction (Application Gateway\nv2 without\
    \ Network Isolation, or Microsoft Entra Domain Services).\n7. Repeat for each network security group requiring remediation.\n\
    Remediate from Azure CLI\nAdd the inbound deny-all rule on each in-scope group, and the outbound deny-all rule\nexcept\
    \ where Microsoft prohibits or advises against outbound restriction; use an unused\npriority higher than the group's allow\
    \ rules (the highest free number at or below 4096):\naz network nsg rule create --resource-group <resource-group> --nsg-name\
    \ <networksecurity-group> --name DenyAllInbound --priority <priority> --direction Inbound --\naccess Deny --protocol '*'\
    \ --source-address-prefixes '*' --source-port-ranges '*' -\n-destination-address-prefixes '*' --destination-port-ranges\
    \ '*'\naz network nsg rule create --resource-group <resource-group> --nsg-name <networksecurity-group> --name DenyAllOutbound\
    \ --priority <priority> --direction Outbound -\n-access Deny --protocol '*' --source-address-prefixes '*' --source-port-ranges\
    \ '*'\n--destination-address-prefixes '*' --destination-port-ranges '*'\nRemediate from PowerShell\nAdd the deny-all rules\
    \ with an unused priority higher than the group's allow rules, then\nsave the network security group (omit the outbound\
    \ rule where Microsoft prohibits or\nadvises against outbound restriction):\n Page 262\n$nsg = Get-AzNetworkSecurityGroup\
    \ -Name <network-security-group> -ResourceGroupName\n<resource-group>\nAdd-AzNetworkSecurityRuleConfig -NetworkSecurityGroup\
    \ $nsg -Name 'DenyAllInbound' -\nAccess Deny -Protocol '*' -Direction Inbound -Priority <priority> -\nSourceAddressPrefix\
    \ '*' -SourcePortRange '*' -DestinationAddressPrefix '*' -\nDestinationPortRange '*'\nAdd-AzNetworkSecurityRuleConfig\
    \ -NetworkSecurityGroup $nsg -Name 'DenyAllOutbound'\n-Access Deny -Protocol '*' -Direction Outbound -Priority <priority>\
    \ -\nSourceAddressPrefix '*' -SourcePortRange '*' -DestinationAddressPrefix '*' -\nDestinationPortRange '*'\nSet-AzNetworkSecurityGroup\
    \ -NetworkSecurityGroup $nsg"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Network security groups.

      2. Click the name of a network security group associated with a workload subnet or

      network interface.

      3. Under Settings, click Inbound security rules.

      4. Confirm a user-defined rule exists with Source set to Any, Source port

      ranges set to *, Destination set to Any, Service set to Custom with

      Destination port ranges of *, Protocol set to Any, and Action set to

      Deny, at a priority number higher than (evaluated after) every user-defined

      Allo'
    severity: medium
- id: '7.14'
  title: Ensure the SSL Policy's 'Min protocol version' is Set to 'TLSv1_2' or Higher on Azure Application Gateway
  scoring: scored
  profile:
  - Level 1
  description: The TLS (Transport Layer Security) protocol secures data in transit using asymmetric encryption. Application
    gateways use TLS 1.2 for the Min protocol version by default but can also be configured to use TLS 1.3. According to Microsoft,
    "Starting August 31, 2025, all clients and backend servers interacting with Azure Application Gateway must use Transport
    Layer Security (TLS) 1.2 or higher, as support for TLS 1.0 and 1.1 will be discontinued."
  rationale: 'In NIST SP 800-52 Rev. 2, NIST has mandated that servers that support both government-only applications as well
    as citizen or business-facing applications "shall be configured to use [or negotiate] TLS 1.2 and should be configured
    to use [or negotiate] TLS 1.3 as well." Further, NIST specifies that "agencies shall support TLS 1.3 by January 1, 2024
    [for both government-only and citizen or business-facing applications]." In general, NIST indicates that "servers that
    support TLS 1.3 should be configured to use TLS 1.2 as well. However, TLS 1.2 may be disabled on servers that support
    TLS 1.3 [if TLS 1.2 is not needed for interoperability]." POST-QUANTUM CRYPTOGRAPHY: TLS v1.3 introduces cryptographic
    suites which make Post-Quantum Cryptography (PQC) algorithms accessible. Where possible, TLS v1.3 should be implemented
    as the sole protocol in use for the security of data in transit, but only if TLS 1.2 interoperability is not required.
    These protocols are outdated, vulnerable, and shall not be used: TLS 1.0, TLS 1.1, SSL 2.0, SSL 3.0.'
  impact: Using the latest TLS version may affect compatibility with clients and backend services. Page 265
  references:
  - 1. https://learn.microsoft.com/en-us/azure/application-gateway/application-gatewayssl-policy-overview
  - 2. https://learn.microsoft.com/en-us/cli/azure/network/application-gateway
  page_start: 265
  audit_raw: "Audit from Azure Portal\n1. Go to Application gateways.\n2. Click the name of an application gateway.\n3. Under\
    \ Settings, click Listeners.\n4. Under SSL Policy, ensure Min protocol version is set to TLSv1_2 or\nhigher.\n5. Repeat\
    \ steps 1-4 for each application gateway.\nAudit from Azure CLI\nRun the following command to list application gateways:\n\
    az network application-gateway list\nFor each application gateway, run the following command to get the SSL policy:\n\
    az network application-gateway ssl-policy show --resource-group <resource-group> --\ngateway-name <application-gateway>\n\
    For each SSL policy, run the following command to get the minProtocolVersion:\naz network application-gateway ssl-policy\
    \ predefined show --name <ssl-policy> --\nquery minProtocolVersion\nThe recommended policy names for Azure Application\
    \ Gateway are:\n• 20220101S (TLS 1.2 and 1.3), and\n• 20220101 (TLS 1.2 and 1.3)\nPQC Compliant Cipher: TLS_256_AES_GCM_SHA348\
    \ (with ML-KEM, ML-DSA, SLHDSA for key establishment algorithms approved by NIST currently)\n Page 266"
  remediation: 'Remediate from Azure Portal

    1. Go to Application gateways.

    2. Click the name of an application gateway.

    3. Under Settings, click Listeners.

    4. Under SSL Policy, next to the Selected SSL Policy name, click change.

    5. Select an appropriate SSL policy with a Min protocol version of TLSv1_2

    or higher.

    6. Click Save.

    7. Repeat steps 1-6 for each application gateway requiring remediation.

    Remediate from Azure CLI

    Run the following command to list available SSL policy options:

    az network application-gateway ssl-policy list-options

    Run the following command to list available predefined SSL policies:

    az network application-gateway ssl-policy predefined list

    For each application gateway requiring remediation, run the following command to set a

    predefined SSL policy:

    az network application-gateway ssl-policy set --resource-group <resource-group> --

    gateway-name <application-gateway> --name <ssl-policy> --policy-type Predefined

    Alternatively, run the following command to set a custom SSL policy:

    az network application-gateway ssl-policy set --resource-group <resource-group> --

    gateway-name <application-gateway> --policy-type Custom --min-protocol-version

    <min-protocol-version> --cipher-suites <cipher-suites>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Application gateways.

      2. Click the name of an application gateway.

      3. Under Settings, click Listeners.

      4. Under SSL Policy, ensure Min protocol version is set to TLSv1_2 or

      higher.

      5. Repeat steps 1-4 for each application gateway.

      Audit from Azure CLI

      Run the following command to list application gateways:

      az network application-gateway list

      For each application gateway, run the following command to get the SSL policy:

      az network application-gateway ssl-policy sh'
    severity: medium
- id: '7.15'
  title: Ensure 'HTTP2' is Set to 'Enabled' on Azure Application Gateway
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Enable HTTP/2 for improved performance, efficiency, and security. HTTP/2 protocol support is available to clients
    that connect to application gateway listeners only. Communication with backend server pools is always HTTP/1.1. Enable
    request body inspection so that the Web Application Firewall evaluates the contents of HTTP message bodies for potential
    threats.
  rationale: Enabling HTTP/2 supports use of modern encrypted connections. Enabling request body inspection strengthens security
    by allowing the Web Application Firewall to detect common attacks, such as SQL injection and cross-site scripting.
  impact: Clients and backend services that do not support HTTP/2 will fall back to HTTP/1.1. Page 269 Minor performance impact
    on the Web Application Firewall. Additional effort may be required to monitor findings. Page 273
  references:
  - 1. https://learn.microsoft.com/en-us/azure/application-gateway/features#websocketand-http2-traffic
  - 2. https://learn.microsoft.com/en-us/cli/azure/network/application-gateway
  - 1. https://learn.microsoft.com/en-gb/azure/web-application-firewall/ag/applicationgateway-waf-request-size-limits#request-body-inspection
  - 2. https://learn.microsoft.com/en-us/cli/azure/network/application-gateway
  page_start: 269
  audit_raw: "Audit from Azure Portal\n1. Go to Application gateways.\n2. Click the name of an application gateway.\n3. Under\
    \ Settings, click Configuration.\n4. Ensure HTTP2 is set to Enabled.\n5. Repeat steps 1-4 for each application gateway.\n\
    Audit from Azure CLI\nRun the following command to list application gateways:\naz network application-gateway list\nFor\
    \ each application gateway, run the following command to get the HTTP2 setting:\naz network application-gateway show --resource-group\
    \ <resource-group> --name\n<application-gateway> --query enableHttp2\nEnsure true is returned.\nAudit from PowerShell\n\
    Run the following command to list application gateways:\nGet-AzApplicationGateway\nRun the following command to get the\
    \ application gateway in a resource group with a\ngiven name:\n$gateway = Get-AzApplicationGateway -ResourceGroupName\
    \ <resource-group> -Name\n<application-gateway>\nRun the following command to get the HTTP2 setting:\n$gateway.EnableHttp2\n\
    Ensure True is returned.\nRepeat for each application gateway.\n Page 270\nAudit from Azure Portal\n1. Go to Application\
    \ gateways.\n2. Click the name of an application gateway.\n3. Under Settings, click Web application firewall.\n4. Under\
    \ Associated web application firewall policy, click the policy\nname.\n5. Under Settings, click Policy settings.\n6. Ensure\
    \ the box next to Enforce request body inspection is checked.\n7. Repeat steps 1-6 for each application gateway.\nAudit\
    \ from Azure CLI\nRun the following command to list application gateways:\naz network application-gateway list\nFor each\
    \ application gateway, run the following command to get the firewall policy id:\naz network application-gateway show --resource-group\
    \ <resource-group> --name\n<application-gateway> --query firewallPolicy.id\nFor each firewall policy, run the following\
    \ command to get the request body inspection\nsetting:\naz network application-gateway waf-policy show --ids <firewall-policy>\
    \ --query\npolicySettings.requestBodyCheck\nEnsure true is returned.\nAudit from Azure Policy\nIf referencing a digital\
    \ copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing\
    \ a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: ca85ef9a-741d-461d-8b7a-18c2da82c666 - Name: 'Azure Web\nApplication Firewall on Azure Application Gateway\
    \ should have request body\ninspection enabled'\n Page 274"
  remediation: 'Remediate from Azure Portal

    1. Go to Application gateways.

    2. Click the name of an application gateway.

    3. Under Settings, click Configuration.

    4. Under HTTP2, click Enabled.

    5. Click Save.

    6. Repeat steps 1-5 for each application gateway requiring remediation.

    Remediate from Azure CLI

    For each application gateway requiring remediation, run the following command to

    enable HTTP2:

    az network application-gateway update --resource-group <resource-group> --name

    <application-gateway> --http2 Enabled

    Remediate from PowerShell

    Run the following command to get the application gateway in a resource group with a

    given name:

    $gateway = Get-AzApplicationGateway -ResourceGroupName <resource-group> -Name

    <application-gateway>

    Run the following command to enable HTTP2:

    $gateway.EnableHttp2 = $true

    Run the following command to apply the update:

    Set-AzApplicationGateway -ApplicationGateway $gateway

    Repeat for each application gateway requiring remediation.

    Remediate from Azure Portal

    1. Go to Application gateways.

    2. Click the name of an application gateway.

    3. Under Settings, click Web application firewall.

    4. Under Associated web application firewall policy, click the policy

    name.

    5. Under Settings, click Policy settings.

    6. Check the box next to Enforce request body inspection.

    7. Click Save.

    8. Repeat steps 1-7 for each application gateway and firewall policy requiring

    remediation.

    Remediate from Azure CLI

    For each firewall policy requiring remediation, run the following command to enable

    request body inspection:

    az network application-gateway waf-policy update --ids <firewall-policy> --policysettings request-body-check=true'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Application gateways.

      2. Click the name of an application gateway.

      3. Under Settings, click Configuration.

      4. Ensure HTTP2 is set to Enabled.

      5. Repeat steps 1-4 for each application gateway.

      Audit from Azure CLI

      Run the following command to list application gateways:

      az network application-gateway list

      For each application gateway, run the following command to get the HTTP2 setting:

      az network application-gateway show --resource-group <resource-group> --name

      <ap'
