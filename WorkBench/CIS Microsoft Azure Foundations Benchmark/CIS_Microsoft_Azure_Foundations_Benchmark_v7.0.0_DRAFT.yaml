- id: 6.1.1.5
  title: Ensure that Network Security Group Flow Logs are Captured and Sent to Log Analytics (LEGACY)
  scoring: manual
  profile:
  - Level 2
  description: 'Existing network security group flow logs should stay enabled and send traffic analytics to a central Log
    Analytics workspace until they are migrated to virtual network flow logs. Where a subscription has no network security
    group flow logs, this recommendation is satisfied by Ensure that Virtual Network Flow Logs are Captured and Sent to Log
    Analytics. Warning: Network security group flow logs retire on September 30, 2027; new ones cannot be created after June
    30, 2025, and Azure deletes the remaining flow log resources at retirement.'
  rationale: Flow logs record the IP traffic that each network security group allows or denies. Without them in a central
    workspace, lateral movement and data exfiltration across the network leave no record that Microsoft Sentinel or Azure
    Monitor can query.
  impact: Flow logs are billed per gigabyte collected, traffic analytics adds a per-gigabyte processing charge, and log storage
    is billed separately. Running network security group and virtual network flow logs on the same workloads during migration
    records the traffic twice and adds cost, so delete the network security group flow logs once the virtual network flow
    logs are confirmed. Microsoft's migration script disables the migrated network security group flow logs but does not delete
    them. Page 112
  references:
  - 1. https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-migrate
  - 2. https://azure.microsoft.com/updates/v2/Azure-NSG-flow-logs-Retirement
  page_start: 112
  audit_raw: "Audit from Azure Portal\n1. Go to Network Watcher.\n2. Under Logs, select Flow logs.\n3. Click Add filter.\n\
    4. From the Filter drop-down, select Flow log type.\n5. From the Value drop-down, check Network security group only.\n\
    6. Click Apply.\n7. Ensure that each listed network security group flow log that has not been\nmigrated is enabled and\
    \ has traffic analytics sending to a Log Analytics\nWorkspace.\nDisabled flow logs left behind by the migration script\
    \ are out of scope and should be\ndeleted. If no network security group flow logs are listed, apply Ensure that\nVirtual\
    \ Network Flow Logs are Captured and Sent to Log Analytics\ninstead.\nAudit from Azure CLI\nRun the following command\
    \ for each region that contains network security groups:\naz network watcher flow-log list --location <location> --query\n\
    \"[?contains(targetResourceId, '/networkSecurityGroups/')].{name:name,\nenabled:enabled,\ntrafficAnalytics:flowAnalyticsConfiguration.networkWatcherFlowAnalyticsConfiguratio\n\
    n.enabled,\nworkspace:flowAnalyticsConfiguration.networkWatcherFlowAnalyticsConfiguration.works\npaceResourceId}\" --output\
    \ table\nEnsure that each flow log not yet migrated shows enabled and trafficAnalytics\nas True and a workspace value.\n\
    Audit from PowerShell\nNote: Listing flow logs by location requires Reader on the NetworkWatcherRG\nresource group.\n\
    Run the following command for each region that contains network security groups:\n Page 113\nGet-AzNetworkWatcherFlowLog\
    \ -Location <location> |\n Where-Object { $_.TargetResourceId -like '*/networkSecurityGroups/*' } |\n Select-Object Name,\
    \ TargetResourceId, Enabled,\n @{Name = 'TrafficAnalytics'; Expression =\n{ $_.FlowAnalyticsConfiguration.NetworkWatcherFlowAnalyticsConfiguration.Enabled\
    \ }}\n,\n @{Name = 'Workspace'; Expression =\n{ $_.FlowAnalyticsConfiguration.NetworkWatcherFlowAnalyticsConfiguration.WorkspaceR\n\
    esourceId }}\nEnsure that each flow log not yet migrated shows Enabled and TrafficAnalytics\nas True and a Workspace value.\
    \ If none are returned in any region, apply Ensure\nthat Virtual Network Flow Logs are Captured and Sent to Log\nAnalytics\
    \ instead.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a\
    \ link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this\
    \ URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n• Policy ID: 27960feb-a23c-4577-8d36-ef8b5f35e0be\
    \ - Name: 'All flow log\nresources should be in enabled state'\n• Policy ID: 2f080164-9f4d-497e-9db6-416dc9f7b48a - Name:\
    \ 'Network Watcher\nflow logs should have traffic analytics enabled'\nBoth policies also evaluate virtual network flow\
    \ logs, so filter the compliance results to\nnetwork security group targets.\n Page 114"
  remediation: "Remediate from Azure Portal\n1. Go to Network Watcher.\n2. Under Logs, select Migrate flow logs.\n3. Select\
    \ the subscriptions that contain network security group flow logs.\n4. For each subscription, select the regions to migrate.\n\
    5. Click Download script and JSON file, then run the script as described\nunder Remediate from PowerShell.\n6. After the\
    \ migration completes, go to Network Watcher > Flow logs and filter\nFlow log type to Network security group.\n7. Select\
    \ the migrated network security group flow logs and click Delete.\n8. Confirm that the new virtual network flow logs meet\
    \ Ensure that Virtual\nNetwork Flow Logs are Captured and Sent to Log Analytics.\nRemediate from Azure CLI\nFor a network\
    \ security group flow log that cannot be migrated yet, enable it and its\ntraffic analytics in place:\naz network watcher\
    \ flow-log update --location <location> --name <flow-log-name> --\nenabled true --traffic-analytics true --workspace <log-analytics-workspace-id>\n\
    Remediate from PowerShell\nExtract MigrateFlowLogs.zip and run the script in PowerShell 7 with the Az\nPowerShell module:\n\
    .\\MigrationFromNsgToAzureFlowLogging.ps1\n1. Enter 1 to run the analysis, and enter .\\RegionSubscriptionConfig.json\n\
    when prompted for the scope file.\n2. Review the analysis report, then enter 2 (migration with aggregation) or 3\n(migration\
    \ without aggregation).\n3. Enter n at the rollback prompt to keep the migration.\nFor a network security group flow log\
