    6. Click Save.

    7. Repeat steps 1-6 for each virtual network requiring remediation.

    Remediate from Azure CLI

    For each virtual network requiring remediation, run the following command to enable

    DDoS protection:

    az network vnet update --resource-group <resource-group> --name <virtual-network> -

    -ddos-protection true --ddos-protection-plan <ddos-protection-plan>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Virtual networks.

      2. Click the name of a virtual network.

      3. Under Settings, click DDoS protection.

      4. Ensure DDoS Network Protection is set to Enable.

      5. Repeat steps 1-4 for each virtual network.

