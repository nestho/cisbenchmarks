- id: 6.1.1.1
  title: Ensure that a 'Diagnostic Setting' Exists for Subscription Activity Logs
  scoring: scored
  profile:
  - Level 1
  description: A subscription's activity log is exported only when the subscription has a diagnostic setting that sends it
    to a Log Analytics workspace, storage account, event hub, or partner solution. Diagnostic settings for individual resources
    are covered by the recommendation Ensure that Azure Monitor Resource Logging is Enabled for All Services that Support
    it.
  rationale: The activity log records every control-plane operation in a subscription, including resource deletions, role
    assignments, and policy changes. Azure keeps these entries for only 90 days and outside any central store, so without
    an export to a workspace, storage account, or event hub, where retention is set, an intrusion found later cannot be reconstructed
    or correlated with other logs.
  impact: 'The destination bills for the exported data: ingestion and retention charges apply in a Log Analytics workspace,
    and storage or throughput charges apply to a storage account or event hub. Page 94'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
  - 2. https://learn.microsoft.com/en-us/troubleshoot/azure/azure-monitor/activitylogs/config-export/configure-diagnostic-settings-legacy-log-profiles
  page_start: 94
  audit_raw: "Audit from Azure Portal\n1. Go to Monitor.\n2. Click Activity log.\n3. Click Export Activity Logs.\n4. Select\
    \ a subscription.\n5. Ensure that at least one diagnostic setting is listed, and that it has at least one\ndestination\
    \ and at least one enabled log category.\n6. Repeat steps 4-5 for each subscription.\nAudit from Azure CLI\nRun the following\
    \ command for each subscription:\naz monitor diagnostic-settings subscription list --subscription <subscription-id>\n\
    Ensure that at least one setting has a destination (workspaceId,\nstorageAccountId, eventHubAuthorizationRuleId, or\n\
    marketplacePartnerId) and at least one logs entry with enabled set to true.\nAudit from PowerShell\nRun the following\
    \ command for each subscription:\nGet-AzSubscriptionDiagnosticSetting -SubscriptionId <subscription-id>\nEnsure that at\
    \ least one setting has a destination (WorkspaceId,\nStorageAccountId, EventHubAuthorizationRuleId, or\nMarketplacePartnerId)\
    \ and at least one Log entry with Enabled set to True.\n Page 95"
  remediation: "Remediate from Azure Portal\n1. Go to Monitor.\n2. Click Activity log.\n3. Click Export Activity Logs.\n4.\
    \ Select a subscription.\n5. Click + Add diagnostic setting.\n6. Enter a Diagnostic setting name.\n7. Under Categories,\
    \ select the log categories to export.\n8. Under Destination details, select one or more destinations: Send to Log\nAnalytics\
    \ workspace, Archive to a storage account, Stream to\nan event hub, or Send to partner solution.\n9. Click Save.\n10.\
    \ Repeat steps 4-9 for each subscription.\nRemediate from Azure CLI\nRun the following command for each subscription:\n\
    az monitor diagnostic-settings subscription create --subscription <subscription-id>\n--name <diagnostic-setting-name>\
    \ --location <location> --workspace <log-analyticsworkspace-resource-id> --logs\n'[{\"category\":\"Administrative\",\"\
    enabled\":true},{\"category\":\"Security\",\"enabled\":tru\ne},{\"category\":\"ServiceHealth\",\"enabled\":true},{\"category\"\
    :\"Alert\",\"enabled\":true},\n{\"category\":\"Recommendation\",\"enabled\":true},{\"category\":\"Policy\",\"enabled\"\
    :true},{\n\"category\":\"Autoscale\",\"enabled\":true},{\"category\":\"ResourceHealth\",\"enabled\":true}\n]'\nTo send\
    \ the log to a storage account or event hub instead of, or in addition to, a\nworkspace, add --storage-account <storage-account-resource-id>\
    \ or --\nevent-hub-auth-rule <event-hub-authorization-rule-id> with --eventhub-name <event-hub-name>.\nRemediate from\
    \ PowerShell\nRun the following commands for each subscription:\n Page 96\n$logCategories = @()\nforeach ($category in\n\
    'Administrative','Security','ServiceHealth','Alert','Recommendation','Policy','Auto\nscale','ResourceHealth') {\n $logCategories\
    \ += New-AzDiagnosticSettingSubscriptionLogSettingsObject -\nCategory $category -Enabled $true\n}\nNew-AzSubscriptionDiagnosticSetting\
    \ -SubscriptionId <subscription-id> -Name\n<diagnostic-setting-name> -WorkspaceId <log-analytics-workspace-resource-id>\
    \ -Log\n$logCategories\nTo send the log to a storage account or event hub, add -StorageAccountId\n<storage-account-resource-id>\
    \ or -EventHubAuthorizationRuleId\n<event-hub-authorization-rule-id> with -EventHubName <event-hubname>."
