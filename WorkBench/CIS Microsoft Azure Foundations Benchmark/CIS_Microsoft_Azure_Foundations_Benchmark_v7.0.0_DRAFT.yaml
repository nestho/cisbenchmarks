- id: 6.1.6
  title: Ensure that 'Public Network Access' for Ingestion and Queries is 'Disabled' for Log Analytics Workspaces
  scoring: scored
  profile:
  - Level 2
  description: 'A Log Analytics workspace accepts ingestion and queries from any network, or only from networks connected
    through an Azure Monitor Private Link Scope (AMPLS). The Allow public network access for ingestion and Allow public network
    access for queries settings select between them; each is Enabled (Yes), Disabled (No), or SecuredByPerimeter. Prerequisites:
    Link the workspace to an Azure Monitor Private Link Scope reached through a private endpoint with private DNS from every
    network whose agents, clients, or users send data to or query it.'
  rationale: With public access enabled, the workspace answers queries and accepts ingestion from any internet-connected client
    that holds a valid credential. A stolen credential therefore exposes the security evidence collected in the workspace
    to bulk reading from anywhere, and lets an attacker write fabricated records into it, with no network boundary behind
    authentication to contain either.
  impact: 'Agents, clients, and users outside networks connected to the Private Link Scope can no longer send data to or query
    the workspace. Resource Manager API queries cannot use private links, so VM insights, Container insights, and the Logic
    Apps connector stop returning data. The scope''s private DNS changes Azure Monitor name resolution for every network sharing
    that DNS. Note: Logs and metrics sent by diagnostic settings use a private Microsoft channel that these settings do not
    control, so they keep arriving after both settings are disabled. Page 199'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/private-linkdesign#control-network-access-to-ampls-resources
  - 2. https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/private-linkconfigure
  page_start: 199
  audit_raw: "Audit from Azure Portal\n1. Sign in to the Azure portal.\n2. Navigate to Log Analytics workspaces.\n3. Click\
    \ the name of a workspace.\n4. Under Settings, click Network Isolation.\n5. Verify that Allow public network access for\
    \ ingestion is set to No.\n6. Verify that Allow public network access for queries is set to No.\n7. Repeat steps 2-6 for\
    \ each workspace.\nA workspace is compliant when both settings are No. Yes on either setting is noncompliant.\nAudit from\
    \ Azure CLI\nRun the following command in each subscription to list the settings of every workspace:\naz monitor log-analytics\
    \ workspace list --subscription <subscription-id> --query\n\"[].{Name:name, ResourceGroup:resourceGroup,\nIngestion:publicNetworkAccessForIngestion,\
    \ Query:publicNetworkAccessForQuery}\" --\noutput table\nA compliant workspace shows Disabled under both Ingestion and\
    \ Query. Any\nother value is non-compliant.\nAudit from PowerShell\nRun the following commands in each subscription to\
    \ list the settings of every\nworkspace:\nSet-AzContext -Subscription <subscription-id>\nGet-AzOperationalInsightsWorkspace\
    \ | Select-Object Name, ResourceGroupName,\nPublicNetworkAccessForIngestion, PublicNetworkAccessForQuery\nA compliant\
    \ workspace shows Disabled for both\nPublicNetworkAccessForIngestion and PublicNetworkAccessForQuery.\nAny other value\
    \ is non-compliant.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will\
    \ open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs\
    \ from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n• Policy ID: 6c53d030-cc64-46f0-906d-2bc061cd1334\
    \ - Name: 'Log Analytics\nworkspaces should block log ingestion and querying from public networks'\n Page 200"
  remediation: 'Complete the prerequisites in the Description before remediating.

    Remediate from Azure Portal

    1. Sign in to the Azure portal.

    2. Navigate to Log Analytics workspaces.

    3. Click the name of a workspace.

    4. Under Settings, click Network Isolation.

    5. Set Allow public network access for ingestion to No.

    6. Set Allow public network access for queries to No.

    7. Click Save.

    8. Repeat steps 2-7 for each workspace requiring remediation.

    Remediate from Azure CLI

    For each workspace requiring remediation, run the following command:

    az monitor log-analytics workspace update --resource-group <resource-group-name> --

    workspace-name <workspace-name> --ingestion-access Disabled --query-access Disabled

    Remediate from PowerShell

    For each workspace requiring remediation, run the following command:

    Set-AzOperationalInsightsWorkspace -ResourceGroupName <resource-group-name> -Name

    <workspace-name> -PublicNetworkAccessForIngestion Disabled -

    PublicNetworkAccessForQuery Disabled'
  checks:
