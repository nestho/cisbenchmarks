    \ -Enabled $true -\nCategoryGroup allLogs\nNew-AzDiagnosticSetting -Name <diagnostic-setting-name> -ResourceId <key-vaultresource-id>\
    \ -WorkspaceId <log-analytics-workspace-resource-id> -Log $logSettings\n• To update an existing setting, use its name\
    \ and supply all of its existing\ndestinations, log categories, and metrics (-Metric) again, because the\ncommand replaces\
    \ the whole setting.\n Page 110\n• For a storage account or event hub destination, replace -WorkspaceId with -\nStorageAccountId\
    \ <storage-account-resource-id> or -\nEventHubName <event-hub-name> -EventHubAuthorizationRuleId\n<event-hub-authorization-rule-id>."
