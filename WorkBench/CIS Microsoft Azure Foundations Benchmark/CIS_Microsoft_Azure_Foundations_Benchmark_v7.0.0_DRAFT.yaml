- id: 8.4.1
  title: Ensure an Azure Bastion Host Exists
  scoring: scored
  profile:
  - Level 2
  description: The Azure Bastion service allows secure remote access to Azure Virtual Machines over the Internet without exposing
    remote access protocol ports and services directly to the Internet. The Azure Bastion service provides this access using
    TLS over 443/TCP, and subscribes to hardened configurations within an organization's Azure Active Directory service.
  rationale: The Azure Bastion service allows organizations a more secure means of accessing Azure Virtual Machines over the
    Internet without assigning public IP addresses to those Virtual Machines. The Azure Bastion service provides Remote Desktop
    Protocol (RDP) and Secure Shell (SSH) access to Virtual Machines using TLS within a web browser, thus preventing organizations
    from opening up 3389/TCP and 22/TCP to the Internet on Azure Virtual Machines. Additional benefits of the Bastion service
    includes Multi-Factor Authentication, Conditional Access Policies, and any other hardening measures configured within
    Azure Active Directory using a central point of access.
  impact: The Azure Bastion service incurs additional costs and requires a specific virtual network configuration. The Standard
    tier offers additional configuration options compared to the Basic tier and may incur additional costs for those added
    features.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/bastion/bastion-overview#sku
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.network/getazbastion?view=azps-9.2.0
  page_start: 453
  audit_raw: "Audit from Azure Portal\n1. Click on Bastions\n2. Ensure there is at least one Bastion host listed under the\
    \ Name column\nAudit from Azure CLI\naz network bastion list --subscription <subscription ID>\nEnsure the output of the\
    \ above command is not empty.\nAudit from PowerShell\nRetrieve the Bastion host(s) information for a specific Resource\
    \ Group\nGet-AzBastion -ResourceGroupName <resource group name>\nEnsure the output of the above command is not empty.\n\
    \ Page 453"
  remediation: "Remediate from Azure Portal\n1. Click on Bastions\n2. Select the Subscription\n3. Select the Resource group\n\
    4. Type a Name for the new Bastion host\n5. Select a Region\n6. Choose Standard next to Tier\n7. Use the slider to set\
    \ the Instance count\n8. Select the Virtual network or Create new\n9. Select the Subnet named AzureBastionSubnet. Create\
    \ a Subnet named\nAzureBastionSubnet using a /26 CIDR range if it doesn't already exist.\n10. Select the appropriate Public\
    \ IP address option.\n11. If Create new is selected for the Public IP address option, provide a\nPublic IP address name.\n\
    12. If Use existing is selected for Public IP address option, select an IP\naddress from Choose public IP address\n13.\
    \ Click Next: Tags >\n14. Configure the appropriate Tags\n15. Click Next: Advanced >\n16. Select the appropriate Advanced\
    \ options\n17. Click Next: Review + create >\n18. Click Create\nRemediate from Azure CLI\naz network bastion create --location\
    \ <location> --name <name of bastion host> --\npublic-ip-address <public IP address name or ID> --resource-group <resource\
    \ group\nname or ID> --vnet-name <virtual network containing subnet called\n\"AzureBastionSubnet\"> --scale-units <integer>\
    \ --sku Standard [--disable-copy-paste\ntrue|false] [--enable-ip-connect true|false] [--enable-tunneling true|false]\n\
    Remediate from PowerShell\nCreate the appropriate Virtual network settings and Public IP Address\nsettings.\n Page 454\n\
    $subnetName = \"AzureBastionSubnet\"\n$subnet = New-AzVirtualNetworkSubnetConfig -Name $subnetName -AddressPrefix <IP\n\
    address range in CIDR notation making sure to use a /26>\n$virtualNet = New-AzVirtualNetwork -Name <virtual network name>\
    \ -ResourceGroupName\n<resource group name> -Location <location> -AddressPrefix <IP address range in CIDR\nnotation> -Subnet\
    \ $subnet\n$publicip = New-AzPublicIpAddress -ResourceGroupName <resource group name> -Name\n<public IP address name>\
    \ -Location <location> -AllocationMethod Dynamic -Sku\nStandard\nCreate the Azure Bastion service using the information\
    \ within the created variables\nfrom above.\nNew-AzBastion -ResourceGroupName <resource group name> -Name <bastion name>\
    \ -\nPublicIpAddress $publicip -VirtualNetwork $virtualNet -Sku \"Standard\" -ScaleUnit\n<integer>"
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Click on Bastions\n2. Ensure there is at least one Bastion host listed under the Name\
      \ column\nAudit from Azure CLI\naz network bastion list --subscription <subscription ID>\nEnsure the output of the above\
      \ command is not empty.\nAudit from PowerShell\nRetrieve the Bastion host(s) information for a specific Resource Group\n\
      Get-AzBastion -ResourceGroupName <resource group name>\nEnsure the output of the above command is not empty.\n Page\
      \ 453"
    severity: medium
- id: '8.5'
  title: Ensure Azure DDoS Network Protection is Enabled on Virtual Networks
  scoring: scored
  profile:
  - Level 2
  description: Azure DDoS Network Protection defends resources in virtual networks against distributed denial-of-service (DDoS)
    attacks. While an automated assessment procedure exists for this recommendation, the assessment status remains manual.
    Determining the appropriateness of enabling Azure DDoS Network Protection depends on the context and requirements of each
    organization and environment.
  rationale: Virtual networks and resources are protected against attacks, helping to ensure reliability and availability
    for critical workloads.
  impact: Network Protection is a fixed monthly plan for 100 public IP resources, charged per resource beyond that; one plan
    serves a tenant's subscriptions. DDoS IP Protection protects individual public IP addresses rather than the virtual network,
    so it does not satisfy this recommendation. It is cheaper below 15 public IPs but lacks rapid response, cost protection,
    and WAF discounts. Page 456
  references:
