- id: 8.3.8
  title: Ensure Private Endpoints are Used to Access Azure Key Vault
  scoring: scored
  profile:
  - Level 2
  description: Use private endpoints to allow clients and services to securely access data located over a network via an encrypted
    Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between
    disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your
    network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures
    together. This creates further security through segmenting network traffic and preventing outside sources from accessing
    it. Private endpoints will secure network traffic from Azure Key Vault to the resources requesting secrets and keys.
  rationale: Securing traffic between services through encryption protects the data from easy interception and reading. Private
    endpoints will keep network requests to Azure Key Vault limited to the endpoints attached to the resources that are whitelisted
    to communicate with each other. Assigning the Key Vault to a network without an endpoint will allow other resources on
    that network to view all traffic from the Key Vault to its destination. In spite of the complexity in configuration, this
    is recommended for high security secrets.
  impact: If an Azure Virtual Network is not implemented correctly, this may result in the loss of critical network traffic.
    Private endpoints are charged per hour of use. Refer to https://azure.microsoft.com/enus/pricing/details/private-link/
    and https://azure.microsoft.com/en-us/pricing/calculator/ to estimate potential costs. Page 434
  references:
  - 1. https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/storage-privateendpoints
