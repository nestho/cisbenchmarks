- id: 9.2.1
  title: Ensure That Soft Delete for Blobs on Azure Blob Storage Storage Accounts is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Blob soft delete keeps deleted blobs, snapshots, and versions recoverable for 1 to 365 days, and also keeps
    overwritten blobs on accounts without a hierarchical namespace. It is enabled or disabled per storage account with the
    Blob service; the compliant state is enabled with at least 7 days of retention.
  rationale: Without soft delete or blob versioning, a deleted or overwritten blob is lost at once and the storage account
    cannot restore it. A user error, a faulty application, or an attacker with delete rights can therefore destroy blob data
    immediately, and the loss is permanent unless a separate backup exists.
  impact: Soft-deleted data is billed as active data until retention ends, so overwrite-heavy workloads cost more. On an account
    without a hierarchical namespace, blob soft delete blocks the Data Lake Storage (DFS) endpoint, so DFS clients must use
    the Blob endpoint, and it blocks upgrading to a hierarchical namespace until soft delete is off and all soft-deleted blobs
    have expired. Page 462
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview
  - 2. https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-enable
  page_start: 462
  audit_raw: "Note: No built-in Azure Policy definition audits this setting; the built-in 'Configure soft\ndelete for blobs\
    \ and containers on Storage Accounts' deploys it instead and also\nrequires container soft delete.\nAudit from Azure Portal\n\
    1. Go to Storage accounts.\n2. Click on a storage account.\n3. Under Data management, click Data protection.\n4. Ensure\
    \ that Turn on soft delete for blobs (Enable soft delete\nfor blobs on accounts with a hierarchical namespace) is selected\
    \ and the\nretention period is 7 days or more.\n5. Repeat steps 1-4 for each storage account with the Blob service (every\
    \ account\nexcept premium file share accounts).\nAudit from Azure CLI\nRun the following command to list each storage\
    \ account and its kind:\naz storage account list --query \"[].{name:name, resourceGroup:resourceGroup,\nkind:kind}\" --output\
    \ table\nFor each storage account whose kind is not FileStorage, run the following\ncommand:\naz storage account blob-service-properties\
    \ show --account-name <storage-account> --\nresource-group <resource-group> --query deleteRetentionPolicy\nEnsure that\
    \ enabled is true and days is 7 or more; any other result is non-compliant.\nAudit from PowerShell\nRun the following\
    \ command to list each storage account and its kind:\nGet-AzStorageAccount | Select-Object StorageAccountName, ResourceGroupName,\
    \ Kind\nFor each storage account whose Kind is not FileStorage, run the following\ncommand:\n(Get-AzStorageBlobServiceProperty\
    \ -ResourceGroupName <resource-group> -\nStorageAccountName <storage-account>).DeleteRetentionPolicy\nEnsure that Enabled\
    \ is True and Days is 7 or more; any other result is non-compliant.\n Page 463"
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data management, click Data protection.

    4. Select Turn on soft delete for blobs (Enable soft delete for

    blobs on accounts with a hierarchical namespace).

    5. Enter a retention period of 7 days or more.

    6. Click Save.

    7. Repeat steps 1-6 for each storage account requiring remediation.

    Remediate from Azure CLI

    For each storage account requiring remediation (any account whose kind is not

    FileStorage), run the following command, setting <retention-days> to 7 or more:

    az storage account blob-service-properties update --account-name <storage-account>

    --resource-group <resource-group> --enable-delete-retention true --deleteretention-days <retention-days>

    Remediate from PowerShell

    For each storage account requiring remediation (any account whose Kind is not

    FileStorage), run the following command, setting <retention-days> to 7 or more:

    Enable-AzStorageBlobDeleteRetentionPolicy -ResourceGroupName <resource-group> -

    StorageAccountName <storage-account> -RetentionDays <retention-days>'
  checks:
  - type: manual_review
    info: 'Note: No built-in Azure Policy definition audits this setting; the built-in ''Configure soft

      delete for blobs and containers on Storage Accounts'' deploys it instead and also

      requires container soft delete.

      Audit from Azure Portal

      1. Go to Storage accounts.

      2. Click on a storage account.

      3. Under Data management, click Data protection.

      4. Ensure that Turn on soft delete for blobs (Enable soft delete

      for blobs on accounts with a hierarchical namespace) is selected and the

      retention period is 7 days'
    severity: medium
- id: 9.3.2.1
  title: Ensure that 'Public Network Access' is 'Disabled' for Storage Accounts
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access.
    Use private endpoints to securely manage access within trusted networks. Disallowing public network access for a storage
    account overrides the public access settings for individual containers in that storage account.
  rationale: Disabling public network access improves security by ensuring that a storage account is not exposed on the public
    internet. The default network configuration for a storage account permits a user with appropriate permissions to configure
    public network access to containers and blobs in a storage account. Keep in mind that public access to a container is
    always turned off by default and must be explicitly configured to permit anonymous requests. It grants read-only access
    to these resources without sharing the account key, and without requiring a shared access signature. It is recommended
    not to provide public network access to storage accounts until, and unless, it is strongly desired. A shared access signature
    token or Azure AD RBAC should be used for providing controlled and timed access to blob containers.
  impact: 'NOTE: Prior to disabling public network access, it is strongly recommended that, for each storage account, either:
    • virtual network integration is completed OR • private endpoints/links are set up as described in "Ensure Private Endpoints
    are used to access Storage Accounts." Disabling public network access restricts direct access to the service. This enhances
    security but will require the configuration of a virtual network and/or private endpoints for any services or users needing
    access within trusted networks. Access will have to be managed using shared access signatures or via Azure AD RBAC. Page
    468'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-accessconfigure
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-2-define-and-implement-enterprise-segmentationseparation-ofduties-strategy
  page_start: 468
  audit_raw: "Audit from Azure Portal\n1. Go to Storage Accounts.\n2. For each storage account, under the Security + networking\
    \ section, click\nNetworking.\n3. Ensure the Public network access setting is set to Disabled.\nAudit from Azure CLI\n\
    Ensure publicNetworkAccess is Disabled\naz storage account show --name <storage-account> --resource-group <resource-group>\n\
    --query \"{publicNetworkAccess:publicNetworkAccess}\"\nAudit from PowerShell\nFor each Storage Account, ensure PublicNetworkAccess\
    \ is Disabled\nGet-AzStorageAccount -Name <storage account name> -ResourceGroupName <resource\ngroup name> |select PublicNetworkAccess\n\
