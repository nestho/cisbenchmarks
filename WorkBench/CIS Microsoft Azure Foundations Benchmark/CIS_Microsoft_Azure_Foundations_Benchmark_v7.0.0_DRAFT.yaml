- id: 9.3.5
  title: Ensure that 'Allow Blob anonymous access' is Set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: A storage account either allows or disallows anonymous read access to its blob data. The Allow Blob anonymous
    access setting selects between Enabled and Disabled; when Disabled, it overrides the anonymous access level of every container
    in the account.
  rationale: With anonymous access allowed on the account, any user who can change a container's access level can expose that
    container publicly. Anyone can then read its blobs without credentials, and a container set to the Container level can
    also be listed, so its contents can be enumerated and copied with no identity attached to the requests.
  impact: Once anonymous access is disabled, anonymous requests to every container in the account fail, including containers
    already set for anonymous access. A static website's content stays publicly readable through the static website endpoint.
    Page 489
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-accessprevent
  - 2. https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-accessconfigure
