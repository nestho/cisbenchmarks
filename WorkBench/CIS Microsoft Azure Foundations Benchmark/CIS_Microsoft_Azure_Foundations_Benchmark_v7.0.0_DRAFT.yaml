    the following components: • Agentless scanning for machines • Defender sensor for runtime protection • Azure Policy for
    enforcing security best practices • K8S API access for monitoring and threat detection • Registry access for vulnerability
    assessment Note: Microsoft Defender for Container Registries (''ContainerRegistry'') is deprecated and has been replaced
    by Microsoft Defender for Containers (''Containers'').'
