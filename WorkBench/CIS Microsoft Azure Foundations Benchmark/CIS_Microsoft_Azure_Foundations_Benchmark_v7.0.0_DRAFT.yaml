    \ Portal\n1. Go to Virtual network gateways.\n2. Click the name of a VPN gateway.\n3. Under Settings, click Point-to-site\
    \ configuration.\n4. Verify that Authentication type is set to Microsoft Entra ID only, with\nAzure certificate and RADIUS\
    \ authentication not selected.\n5. Repeat steps 1-4 for each VPN gateway with a point-to-site configuration.\nAudit from\
    \ Azure CLI\nRun the following command for each VPN gateway with a point-to-site configuration:\naz network vnet-gateway\
    \ show --resource-group <resource-group> --name <gatewayname> --query \"vpnClientConfiguration.vpnAuthenticationTypes\"\
    \nVerify that the output is [\"AAD\"]. An output that includes Certificate or Radius is\nnon-compliant.\nAudit from Azure\
    \ Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy\
    \ definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 21a6bc25-125e-4d13-b82d-2e19b7208ab7 - Name: 'VPN gateways\nshould use only Azure Active Directory (Azure\
    \ AD) authentication for point-to-site\nusers'\n Page 248"
  remediation: 'Remediate from Azure Portal

    1. Go to Network Watcher.

    2. Under Logs, select Flow logs.

