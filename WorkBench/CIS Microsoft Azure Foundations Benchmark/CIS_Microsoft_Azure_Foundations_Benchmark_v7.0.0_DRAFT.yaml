- id: 6.1.4
  title: Ensure that Azure Monitor Resource Logging is Enabled for All Services that Support it
  scoring: manual
  profile:
  - Level 1
  description: Resource Logs capture activity to the data access plane while the Activity log is a subscription-level log
    for the control plane. Resource-level diagnostic logs provide insight into operations that were performed within that
    resource itself; for example, reading or updating a secret from a Key Vault. Currently, 95 Azure resources support Azure
    Monitoring (See the more information section for a complete list), including Network Security Groups, Load Balancers,
    Key Vault, AD, Logic Apps, and CosmosDB. The content of these logs varies by resource type. A number of back-end services
    were not configured to log and store Resource Logs for certain activities or for a sufficient length. It is crucial that
    monitoring is correctly configured to log all relevant activities and retain those logs for a sufficient length of time.
    Given that the mean time to detection in an enterprise is 240 days, a minimum retention period of two years is recommended.
    While an automated assessment procedure exists for this recommendation, the assessment status remains manual. Determining
    whether resource logging should be enabled for specific resources depends on the context and requirements of each organization
    and environment.
  rationale: A lack of monitoring reduces the visibility into the data plane, and therefore an organization's ability to detect
    reconnaissance, authorization attempts or other malicious activity. Unlike Activity Logs, Resource Logs are not enabled
    by default. Specifically, without monitoring it would be impossible to tell which entities had accessed a data store that
    was breached. In addition, alerts for failed attempts to access APIs for Web Services or Databases are only possible when
    logging is enabled. This recommendation's Level 1 profile is dependent upon the free level of retention of 30 days. More
    than 30 days retention of resource logs will increase the cost of this recommendation.
  impact: Costs for monitoring varies with Log Volume. Not every resource needs to have logging enabled. It is important to
    determine the security classification of the data being processed by the given resource and adjust the logging based on
    which events need to be tracked. This is typically determined by governance and compliance requirements. Page 185
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threatdetection#lt-3-enable-logging-for-security-investigation
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threatdetection#lt-5-centralize-security-log-management-and-analysis
  page_start: 185
  audit_raw: "Audit from Azure Portal\nThe specific steps for configuring resources within the Azure console vary depending\
    \ on\nresource, but typically the steps are:\n1. Go to the resource\n2. Click on Diagnostic settings\n3. In the blade\
    \ that appears, see if any items appear under Diagnostic\nsettings listing\n4. Click on each of the item to validate setting.\n\
    5. Exit\nAudit from Azure CLI\nList all resources for a subscription\naz resource list --subscription <subscription id>\n\
    For each resource run the following\naz monitor diagnostic-settings list --resource <resource ID>\nAn empty result means\
    \ a diagnostic settings is not configured for that resource.\nAn error message means a diagnostic settings is not supported\
    \ for that resource.\nAudit from PowerShell\nGet a list of resources in a subscription context and store in a variable\n\
    $resources = Get-AzResource\nLoop through each resource to determine if a diagnostic setting is configured or not.\nforeach\
    \ ($resource in $resources) {$diagnosticSetting = Get-AzDiagnosticSetting -\nResourceId $resource.id -ErrorAction \"SilentlyContinue\"\
    ; if\n([string]::IsNullOrEmpty($diagnosticSetting)) {$message = \"Diagnostic Settings not\nconfigured for resource: \"\
    \ + $resource.Name;Write-Output\n$message}else{$diagnosticSetting}}\nA result of Diagnostic Settings not configured for\
    \ resource:\n<resource name> means a diagnostic settings is not configured for that\nresource. Otherwise, the output of\
    \ the above command will show configured\nDiagnostic Settings for a resource.\nAudit from Azure Policy\nIf referencing\
    \ a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\n\
    \ Page 186\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: cf820ca0-f99e-4f3e-84fb-66e913812d21 - Name: 'Resource logs in\nKey Vault should be enabled'\n• Policy ID:\
    \ 91a78b24-f231-4a8a-8da9-02c35b2b6510 - Name: 'App Service apps\nshould have resource logs enabled'\n• Policy ID: 428256e6-1fac-4f48-a757-df34c2b3336d\
    \ - Name: 'Resource logs in\nBatch accounts should be enabled'\n• Policy ID: 057ef27e-665e-4328-8ea3-04b3122bd9fb - Name:\
    \ 'Resource logs in\nAzure Data Lake Store should be enabled'\n• Policy ID: c95c74d9-38fe-4f0d-af86-0c7d626a315c - Name:\
    \ 'Resource logs in\nData Lake Analytics should be enabled'\n• Policy ID: 83a214f7-d01a-484b-91a9-ed54470c9a6a - Name:\
    \ 'Resource logs in\nEvent Hub should be enabled'\n• Policy ID: 383856f8-de7f-44a2-81fc-e5135b5c2aa4 - Name: 'Resource\
    \ logs in\nIoT Hub should be enabled'\n• Policy ID: 34f95f76-5386-4de7-b824-0d8478470c9d - Name: 'Resource logs in\nLogic\
    \ Apps should be enabled'\n• Policy ID: b4330a05-a843-4bc8-bf9a-cacce50c67f4 - Name: 'Resource logs in\nSearch services\
    \ should be enabled'\n• Policy ID: f8d36e2f-389b-4ee4-898d-21aeb69a0f45 - Name: 'Resource logs in\nService Bus should\
    \ be enabled'\n• Policy ID: f9be5368-9bf5-4b84-9e0a-7850da98bb46 - Name: 'Resource logs in\nAzure Stream Analytics should\
    \ be enabled'\n• Policy ID: 8a04f872-51e9-4313-97fb-fc1c3543011c - Name: 'Azure Application\nGateway should have Resource\
    \ logs enabled'\n Page 187"
  remediation: "Azure Subscriptions should log every access and operation for all resources. Logs\nshould be sent to Storage\
    \ and a Log Analytics Workspace or equivalent third-party\nsystem. Logs should be kept in readily-accessible storage for\
    \ a minimum of one year,\nand then moved to inexpensive cold storage for a duration of time as necessary. If\nretention\
    \ policies are set but storing logs in a Storage Account is disabled (for example,\nif only Event Hubs or Log Analytics\
    \ options are selected), the retention policies have no\neffect. Enable all monitoring at first, and then be more aggressive\
    \ moving data to cold\nstorage if the volume of data becomes a cost concern.\nRemediate from Azure Portal\nThe specific\
    \ steps for configuring resources within the Azure console vary depending on\nresource, but typically the steps are:\n\
    1. Go to the resource\n2. Click on Diagnostic settings\n3. In the blade that appears, click Add diagnostic setting\n4.\
    \ Configure the diagnostic settings\n5. Click on Save\nRemediate from Azure CLI\nFor each resource, run the following\
    \ making sure to use a resource appropriate\nJSON encoded category for the --logs option.\naz monitor diagnostic-settings\
    \ create --name <diagnostic settings name> --resource\n<resource ID> --logs \"[{category:<resource specific\ncategory>,enabled:true,rentention-policy:{enabled:true,days:180}}]\"\
    \ --metrics\n\"[{category:AllMetrics,enabled:true,retention-policy:{enabled:true,days:180}}]\" <[-\n-event-hub <event\
    \ hub ID> --event-hub-rule <event hub auth rule ID> | --storageaccount <storage account ID> |--workspace <log analytics\
    \ workspace ID> | --\nmarketplace-partner-id <full resource ID of third-party solution>]>\nRemediate from PowerShell\n\
    Create the log settings object\n$logSettings = @()\n$logSettings += New-AzDiagnosticSettingLogSettingsObject -Enabled\
    \ $true -\nRetentionPolicyDay 180 -RetentionPolicyEnabled $true -Category <resource specific\ncategory>\n$logSettings\
    \ += New-AzDiagnosticSettingLogSettingsObject -Enabled $true -\nRetentionPolicyDay 180 -RetentionPolicyEnabled $true -Category\
    \ <resource specific\ncategory number 2>\nCreate the metric settings object\n Page 188\n$metricSettings = @()\n$metricSettings\
    \ += New-AzDiagnosticSettingMetricSettingsObject -Enabled $true -\nRetentionPolicyDay 180 -RetentionPolicyEnabled $true\
    \ -Category AllMetrics\nCreate the diagnostic setting for a specific resource\nNew-AzDiagnosticSetting -Name \"<diagnostic\
    \ settings name>\" -ResourceId <resource\nID> -Log $logSettings -Metric $metricSettings"
  checks:
  - type: sql
    command: show configured
    severity: medium
    info: 'Audit from Azure Portal

