- id: 9.3.2.2
  title: Ensure Default Network Access Rule for Storage Accounts is Set to Deny
  scoring: scored
  profile:
  - Level 1
  description: Restricting default network access helps to provide a new layer of security, since storage accounts accept
    connections from clients on any network. To limit access to selected networks, the default action must be changed.
  rationale: 'Note: This recommendation is only applicable if Public Network Access has not been disabled due to necessity
    or exception. Storage accounts should be configured to deny access to traffic from all networks (including internet traffic).
    Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific
    applications to be built. Access can also be granted to public internet IP address ranges to enable connections from specific
    internet or on-premises clients. When network rules are configured, only applications from allowed networks can access
    a storage account. When calling from an allowed network, applications continue to require proper authorization (a valid
    access key or SAS token) to access the storage account.'
  impact: All allowed networks must be added to the allow list on each storage account, creating administrative overhead.
    This may result in loss of network connectivity, so do not enable it for critical resources during business hours without
    first confirming the required networks are permitted. Where access is enabled from selected networks, avoid adding public
    internet IP address ranges beyond those strictly required, as broad public allow entries weaken the intended restriction.
    Page 472
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/storage-networksecurity-limitations
  page_start: 472
  audit_raw: "Audit from Azure Portal\n1. Navigate to Storage accounts.\n2. Select the storage account to review.\n3. In the\
    \ service menu, under Security + networking, select Networking.\n4. Confirm Public network access is not set to Enabled\
    \ from all\nnetworks. Enabled from selected networks (with the default rule\ndenying unlisted traffic), Disabled, and\
    \ Secured by perimeter are\ncompliant states; Enabled from all networks is non-compliant.\n5. Repeat for each storage\
    \ account.\nAudit from Azure CLI\nTo review every storage account in the subscription in one call, run the following\n\
    command:\naz storage account list --query \"[].{name:name, resourceGroup:resourceGroup,\npublicNetworkAccess:publicNetworkAccess,\n\
    defaultAction:networkRuleSet.defaultAction}\" --output table\nTo confirm a single storage account, run:\naz storage account\
    \ show --name <storage-account> --resource-group <resource-group>\n--query \"{publicNetworkAccess:publicNetworkAccess,\n\
    defaultAction:networkRuleSet.defaultAction}\"\nAn account whose publicNetworkAccess is Disabled or SecuredByPerimeter\n\
    restricts public access regardless of the default rule and is compliant. An account whose\npublicNetworkAccess is Enabled\
    \ (or empty, which is equivalent to Enabled) is\ncompliant only when defaultAction is Deny; a defaultAction of Allow on\
    \ such an\naccount is non-compliant.\nNote: Disabling public network access does not change the stored default rule, so\
    \ an\naccount with public access disabled may still report a defaultAction of Allow. Evaluate\nthe two properties together\
    \ as stated above.\nAudit from PowerShell\nGet-AzStorageAccount -ResourceGroupName <resource-group> -Name <storage-account>\
    \ |\nSelect-Object PublicNetworkAccess,\n@{Name=\"DefaultAction\";Expression={$_.NetworkRuleSet.DefaultAction}}\nApply\
    \ the same evaluation: a PublicNetworkAccess of Disabled or\nSecuredByPerimeter is compliant; a PublicNetworkAccess of\
    \ Enabled (or empty)\nrequires a DefaultAction of Deny, and Allow is non-compliant.\nAudit from Azure Policy\n Page 473\n\
    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition\
    \ in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 34c877ad-507e-4c82-993e-3452a6e0ad3c - Name: 'Storage accounts\nshould restrict network access'\n• Policy\
    \ ID: 2a1a9cdf-e04d-429a-8416-3bfb72a1b26f - Name: 'Storage accounts\nshould restrict network access using virtual network\
    \ rules'\nNote: The second Policy is a stricter, virtual-network-only variant: in addition to the\ndefault rule, it flags\
    \ accounts that use IP-based allow rules, which this recommendation\notherwise permits.\n Page 474"
  remediation: 'Remediate from Azure Portal

    1. Navigate to Storage accounts.

    2. Select the storage account to remediate.

    3. In the service menu, under Security + networking, select Networking.

    4. Select Manage.

    5. Select Enable, then select Enabled from selected networks.

    6. Add the virtual networks, IP address ranges, or resource instances that require

    access.

    7. Select Save.

    8. Repeat for each storage account requiring remediation.

    Remediate from Azure CLI

    Add an allow rule for each network that requires access before changing the default

    action, or connectivity to the account will be interrupted:

    az storage account network-rule add --resource-group <resource-group> --accountname <storage-account> --subnet <subnet-resource-id>

    Then set the default network action to Deny:

    az storage account update --name <storage-account> --resource-group <resourcegroup> --default-action Deny

    Remediate from PowerShell

    Add an allow rule for each network that requires access before changing the default

    action, or connectivity to the account will be interrupted:

    Add-AzStorageAccountNetworkRule -ResourceGroupName <resource-group> -Name <storageaccount> -VirtualNetworkResourceId <subnet-resource-id>

    Then set the default network action to Deny:

    Update-AzStorageAccountNetworkRuleSet -ResourceGroupName <resource-group> -Name

    <storage-account> -DefaultAction Deny

    Note: Setting Public network access to Disabled (with access provided through

    private endpoints), or securing the account with a network security perimeter, restricts

    public access at least as strongly as the default-deny rule this recommendation

    configures. A network security perimeter supports HTTPS-based storage operations

    only; NFS, SMB, and SFTP access is blocked while the perimeter is in Enforced mode.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Navigate to Storage accounts.

      2. Select the storage account to review.

      3. In the service menu, under Security + networking, select Networking.

      4. Confirm Public network access is not set to Enabled from all

      networks. Enabled from selected networks (with the default rule

      denying unlisted traffic), Disabled, and Secured by perimeter are

      compliant states; Enabled from all networks is non-compliant.

      5. Repeat for each storage account.

      Audit from Azure CLI

      To review every s'
    severity: medium
- id: 9.3.3.1
  title: Ensure that 'Default to Microsoft Entra authorization in the Azure portal' is Set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: The Azure portal authorizes access to blob, file share, and queue data with either the account access key or
    the signed-in user's Microsoft Entra account. The Default to Microsoft Entra authorization in the Azure portal setting,
    Enabled or Disabled, selects whether the portal uses Microsoft Entra ID by default.
  rationale: When the setting is not enabled, the portal accesses data with the account access key for any user whose role
    can list keys, such as Contributor. That access grants full read, write, and delete on all blob, file share, and queue
    data, bypasses data-access role assignments and conditions, and is logged as Shared Key authorization, not under the user's
    identity.
  impact: 'Portal users see no data without a data-access role: Storage Blob Data Reader or Storage Blob Data Contributor
    (blobs), Storage Queue Data Reader or Storage Queue Data Contributor (queues), or Storage File Data Privileged Reader
    or Storage File Data Privileged Contributor (file shares). Users who hold only a data-access role also need the Reader
    role on the storage account. Page 478'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operationsportal#default-to-microsoft-entra-authorization-in-the-azure-portal
