- id: 6.1.5
  title: Ensure Basic, Free, and Consumption SKUs are not used on Production artifacts requiring monitoring and SLA
  scoring: manual
  profile:
  - Level 2
  description: The use of Basic, Free, or Consumption SKUs in Azure, whilst cost effective, have significant limitations in
    terms of what can be monitored and what support can be realized from Microsoft. Typically, these SKUs do not have a service
    SLA and Microsoft may refuse to provide support for them. Furthermore, they offer reduced or no high availability guarantees
    and have limited observability and diagnostic capabilities. As a result, Microsoft may limit or refuse support for workloads
    running on these SKUs. Consequently Basic, Free, or Consumption SKUs should never be used for production workloads unless
    your organization explicitly approved it as an exception. While an automated assessment procedure exists for this recommendation,
    the assessment status remains manual. Determining appropriate SKUs depends on the context and requirements of each organization
    and environment. Page 191
  rationale: 'Typically, production workloads need to be continuously monitored and have high availability and resilience,
    and they should have an SLA with Microsoft. Using Basic, Free, or Consumption SKUs for deployed Azure services generally
    prevents these requirements from being met. Therefore, production workloads must use Standard or higher SKUs to ensure
    operational reliability, and supportability. The following Azure resource types must use Standard SKUs (or higher) at
    a minimum when deployed in production environments: • Public IP Addresses • Network Load Balancers • Azure Cache for Redis
    • Azure SQL (PaaS Databases) • VPN Gateways • Azure Bastion • Application Gateway • Virtual Network Gateway (VPN) • Azure
    Container Registry • Event Hubs • Service Bus • API Management • Azure Monitor (Log Analytics) Using Basic, Free, or Consumption
    SKUs for any of the above services typically removes SLA guarantees, high availability, and operational visibility such
    as monitoring and diagnostics, which are usually considered mandatory requirements for production environments.'
  impact: 'Enforcing Standard (or higher) SKUs for production environments has the following impacts: 1. There will be a cost
    increase compared to Basic or Free SKUs. 2. Improved reliability, monitoring, and Microsoft SLA coverage will be available
    and will provide enterprise-grade support for the production service and compliance with production readiness standards.
    All Azure resources must be clearly classified as Production or Non-Production by one or more of the following mechanisms:
    • Mandatory tags (e.g., Environment=Production) • Separation via Management Groups • Dedicated Subscriptions Page 192'
  references:
  - 1. https://azure.microsoft.com/en-us/support/plans
  - 2. https://azure.microsoft.com/en-us/support/plans/response/
  page_start: 191
  audit_raw: "This needs to be audited by Azure Policy (one for each resource type) and denied for\neach artifact that is\
