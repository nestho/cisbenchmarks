- id: 9.3.3
  title: Ensure that 'Secure transfer required' is Set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: A storage account either accepts requests over insecure connections or rejects them. The Secure transfer required
    setting is Enabled or Disabled; when Enabled, it rejects REST API requests over HTTP and, unless a per-protocol encryption-in-transit
    setting is enabled, unencrypted SMB and NFS connections to Azure file shares.
  rationale: With secure transfer disabled, REST requests to the account can travel over plain HTTP. Data, shared access signature
    tokens, and request headers then cross the network unencrypted, where they can be read or modified in transit.
  impact: Clients that call the REST API over HTTP fail once secure transfer is required. SMB connections without encryption,
    such as SMB 2.1, and NFS file shares mounted without the AZNFS mount helper also fail. For Azure Files, when Require encryption
    in transit is enabled for SMB or NFS, Secure transfer required applies only to REST traffic for the account's file shares,
    and the per-protocol setting governs that protocol. A custom domain mapped directly to a blob endpoint serves HTTP only,
    so on an account that requires secure transfer, serve the custom domain over HTTPS through Azure Front Door or another
    HTTPS-fronting service, such as Azure CDN. Page 481
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-require-securetransfer
  - 2. https://learn.microsoft.com/en-us/azure/templates/microsoft.storage/2025-0101/storageaccounts
  page_start: 481
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. Click on a storage account.\n3. Under Settings, click\
