- id: '7.8'
  title: Ensure that Public IP Addresses are Evaluated on a Periodic Basis
  scoring: manual
  profile:
  - Level 1
  description: Public IP Addresses provide tenant accounts with Internet connectivity for resources contained within the tenant.
    During the creation of certain resources in Azure, a Public IP Address may be created. All Public IP Addresses within
    the tenant should be periodically reviewed for accuracy and necessity. While an automated assessment procedure exists
    for this recommendation, the assessment status remains manual. Evaluating the appropriateness of public IP addresses requires
    a manual review, as it depends on the specific needs and context of each organization and environment.
  rationale: Public IP Addresses allocated to the tenant should be periodically reviewed for necessity. Public IP Addresses
    that are not intentionally assigned and controlled present a publicly facing vector for threat actors and significant
    risk to the tenant. Page 240
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/network/public-ip
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity
  page_start: 240
  audit_raw: 'Audit from Azure Portal

    1. Open the All Resources blade

    2. Click on Add Filter

    3. In the Add Filter window, select the following: Filter: Type Operator: Equals

    Value: Public IP address

