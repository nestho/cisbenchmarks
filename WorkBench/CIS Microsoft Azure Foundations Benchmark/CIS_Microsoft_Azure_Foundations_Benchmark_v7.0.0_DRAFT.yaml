    the expiration date on or after which the secret MUST NOT be used. By default, secrets never expire. It is thus recommended
    to rotate secrets in the key vault and set an explicit expiration date for all secrets. This ensures that the secrets
    cannot be used beyond their assigned lifetimes.
  impact: Secrets cannot be used beyond their assigned expiry date respectively. Secrets need to be rotated periodically wherever
    they are used. Page 418
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/basic-concepts
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/about-keys-secretscertificates
