- id: 6.1.2.1
  title: Ensure that Activity Log Alert Exists for Create Policy Assignment
  scoring: scored
  profile:
  - Level 1
  description: Create an activity log alert for the Create Policy Assignment event.
  rationale: Monitoring for create policy assignment events gives insight into changes done in "Azure policy - assignments"
    and can reduce the time it takes to detect unsolicited changes. Page 131
  impact: ''
  references:
  - 1. https://azure.microsoft.com/en-us/updates?id=classic-alerting-monitoringretirement
  - 2. https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-activitylog-alert-rule
  page_start: 131
  audit_raw: "Audit from Azure Portal\n1. Navigate to the Monitor blade.\n2. Click on Alerts.\n3. In the Alerts window, click\
    \ on Alert rules.\n4. Ensure an alert rule exists where the Condition column contains Operation\nname=Microsoft.Authorization/policyAssignments/write.\n\
    5. Click on the Alert Name associated with the previous step.\n6. Ensure the Condition panel displays the text Whenever\
    \ the Activity Log\nhas an event with Category='Administrative', Operation\nname='Create policy assignment' and does not\
    \ filter on Level, Status\nor Caller.\n7. Ensure the Actions panel displays an Action group is assigned to notify the\n\
    appropriate personnel in your organization.\nAudit from Azure CLI\naz monitor activity-log alert list --subscription <subscription\
    \ ID> --query\n\"[].{Name:name,Enabled:enabled,Condition:condition.allOf,Actions:actions}\"\nLook for Microsoft.Authorization/policyAssignments/write\
    \ in the output. If\nit's missing, generate a finding.\nAudit from PowerShell\nGet-AzActivityLogAlert -SubscriptionId\
    \ <subscription ID>|where-object\n{$_.ConditionAllOf.Equal -match\n\"Microsoft.Authorization/policyAssignments/write\"\
    }|select-object\nLocation,Name,Enabled,ResourceGroupName,ConditionAllOf\nIf the output is empty, an alert rule for Create\
    \ Policy Assignments is not\nconfigured.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking\
    \ a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can\
    \ search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: c5447c04-a4d7-4ba8-a263-c9ee321a6858 - Name: 'An activity log\nalert should exist for specific Policy operations'\n\
    \ Page 132"
  remediation: "Remediate from Azure Portal\n1. Navigate to the Monitor blade.\n2. Select Alerts.\n3. Select Create.\n4. Select\
    \ Alert rule.\n5. Choose a subscription.\n6. Select Apply.\n7. Select the Condition tab.\n8. Click See all signals.\n\
    9. Select Create policy assignment (Policy assignment).\n10. Click Apply.\n11. Select the Actions tab.\n12. Click Select\
    \ action groups to select an existing action group, or\nCreate action group to create a new action group.\n13. Follow\
    \ the prompts to choose or create an action group.\n14. Select the Details tab.\n15. Select a Resource group, provide\
    \ an Alert rule name and an optional\nAlert rule description.\n16. Click Review + create.\n17. Click Create.\nRemediate\
    \ from Azure CLI\naz monitor activity-log alert create --resource-group \"<resource group name>\" --\ncondition category=Administrative\
    \ and\noperationName=Microsoft.Authorization/policyAssignments/write> --scope\n\"/subscriptions/<subscription ID>\" --name\
    \ \"<activity log rule name>\" --subscription\n<subscription ID> --action-group <action group ID>\nRemediate from PowerShell\n\
    Create the conditions object.\n$conditions = @()\n$conditions += New-AzActivityLogAlertAlertRuleAnyOfOrLeafConditionObject\
    \ -Equal\nAdministrative -Field category\n$conditions += New-AzActivityLogAlertAlertRuleAnyOfOrLeafConditionObject -Equal\n\
    Microsoft.Authorization/policyAssignments/write -Field operationName\nGet the Action Group information and store it in\
    \ a variable, then create a new\nAction object.\n Page 133\n$actionGroup = Get-AzActionGroup -ResourceGroupName <resource\
    \ group name> -Name\n<action group name>\n$actionObject = New-AzActivityLogAlertActionGroupObject -Id $actionGroup.Id\n\
    Create the Scope variable.\n$scope = \"/subscriptions/<subscription ID>\"\nCreate the Activity Log Alert Rule for\nMicrosoft.Authorization/policyAssignments/write\n\
    New-AzActivityLogAlert -Name \"<activity alert rule name>\" -ResourceGroupName\n\"<resource group name>\" -Condition $conditions\
    \ -Scope $scope -Location global -\nAction $actionObject -Subscription <subscription ID> -Enabled $true"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Navigate to the Monitor blade.

      2. Click on Alerts.

      3. In the Alerts window, click on Alert rules.

      4. Ensure an alert rule exists where the Condition column contains Operation

      name=Microsoft.Authorization/policyAssignments/write.

      5. Click on the Alert Name associated with the previous step.

      6. Ensure the Condition panel displays the text Whenever the Activity Log

      has an event with Category=''Administrative'', Operation

      name=''Create policy assignment'' and does not filter o'
    severity: medium
