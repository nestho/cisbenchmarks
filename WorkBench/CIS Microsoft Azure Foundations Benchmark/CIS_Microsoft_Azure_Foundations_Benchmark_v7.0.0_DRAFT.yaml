- id: 9.3.4
  title: Ensure the 'Minimum TLS version' for Storage Accounts is Set to 'Version 1.2'
  scoring: scored
  profile:
  - Level 1
  description: 'A storage account''s Minimum TLS version setting defines the lowest Transport Layer Security (TLS) version
    it accepts for requests, and it is either set to a version or left unset. The compliant value is Version 1.2. Warning:
    Azure Storage stopped supporting TLS 1.0 and 1.1 for all storage accounts on February 3, 2026, so requests that use those
    versions fail regardless of this setting.'
  rationale: 'TLS 1.0 and 1.1 have known weaknesses and lack modern cipher suites. An account without an explicit Version
    1.2 minimum relies on platform behavior, not its own configuration, so a future platform or configuration change could
    again permit those protocols. An explicit floor guards against that change and is the only state audits and Azure Policy
    can verify at scale. POST-QUANTUM CRYPTOGRAPHY: TLS v1.3 introduces cryptographic suites which make Post-Quantum Cryptography
    (PQC) algorithms accessible. Where possible, TLS v1.3 should be implemented as the sole protocol in use for the security
    of data in transit, but only if TLS 1.2 interoperability is not required.'
  impact: Because Azure Storage has rejected TLS 1.0 and 1.1 requests since February 3, 2026, setting the minimum to Version
    1.2 does not block any client that can currently connect. Page 485
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/transport-layer-securityconfigure-minimum-version
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/transport-layer-securityconfigure-migrate-to-tls2
  page_start: 485
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. Click on a storage account.\n3. Under Settings, click\
    \ Configuration.\n4. Ensure that Minimum TLS version is set to Version 1.2.\n5. Repeat steps 1-4 for each storage account.\n\
    Audit from Azure CLI\nRun the following command to list each storage account and its minimum TLS version:\naz storage\
    \ account list --query \"[].{name:name, resourceGroup:resourceGroup,\nminimumTlsVersion:minimumTlsVersion}\" --output\
    \ table\nEnsure that minimumTlsVersion is TLS1_2 for each storage account. An empty\nvalue (not set) or any other value\
    \ is non-compliant.\nAudit from PowerShell\nRun the following command to list each storage account and its minimum TLS\
    \ version:\nGet-AzStorageAccount | Select-Object StorageAccountName, ResourceGroupName,\nMinimumTlsVersion\nEnsure that\
    \ MinimumTlsVersion is TLS1_2 for each storage account. An empty\nvalue (not set) or any other value is non-compliant.\n\
    Audit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\n\
    associated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: fe83a0eb-a853-422d-aac2-1bffd182c5d0 - Name: 'Storage accounts\nshould have the specified minimum TLS version'\n\
    Assign this policy with the minimumTlsVersion parameter set to TLS1_2.\n Page 486"
  remediation: 'Remediate from Azure Portal

