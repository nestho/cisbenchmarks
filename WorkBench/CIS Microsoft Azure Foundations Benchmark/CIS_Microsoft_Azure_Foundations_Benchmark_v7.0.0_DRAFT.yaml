- id: 8.1.13
  title: Ensure that Microsoft Defender for Cloud Sends Security Alert Emails to Users with the 'Owner' Role
  scoring: scored
  profile:
  - Level 1
  description: Defender for Cloud alert emails go to the addresses in the subscription's security contact and, optionally,
    to every holder of selected subscription roles. The All users with the following roles setting selects any of Owner, Contributor,
    ServiceAdmin, and AccountAdmin.
  rationale: Subscription owners hold the authority to contain an incident in the subscription. Without role-based notification,
    an alert about an active compromise can reach no one with that authority and sit unread in the portal while the attack
    continues.
  impact: Every user assigned the Owner role on the subscription receives the alert emails, so mail volume grows with the
    number of owners and with the severity threshold set by the recommendation Ensure that 'Notify about alerts with the following
    severity (or higher)' is Enabled. Page 381
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-emailnotifications
