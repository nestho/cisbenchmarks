    Network security group setting shows None. GatewaySubnet, AzureFirewallSubnet, and RouteServerSubnet do not support a
    network security group, and Microsoft reserves AzureFirewallManagementSubnet for the firewall''s management traffic, so
    all four are out of scope. Prerequisites: (Only if using Azure Bastion) Before associating a network security group with
    AzureBastionSubnet, add every inbound and outbound rule Azure Bastion requires; Azure rejects the association otherwise,
    and a later deny rule that shadows them breaks Bastion connections.'
  rationale: Unprotected subnets can expose resources to unauthorized access.
