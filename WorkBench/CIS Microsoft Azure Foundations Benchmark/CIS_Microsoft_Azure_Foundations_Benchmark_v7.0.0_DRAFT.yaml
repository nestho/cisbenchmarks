controls:
- id: 5.1.1
  title: Ensure that 'security defaults' is Enabled in Microsoft Entra ID
  scoring: scored
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access,
    ignore the recommendations in this section and proceed to the Conditional Access section.] Security defaults in Microsoft
    Entra ID make it easier to be secure and help protect your organization. Security defaults contain preconfigured security
    settings for common attacks. Security defaults is available to everyone. The goal is to ensure that all organizations
    have a basic level of security enabled at no extra cost. You may turn on security defaults in the Azure portal.'
  rationale: 'Security defaults provide secure default settings that we manage on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example, doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - when necessary, based on factors such as location,
    device, role, and task. • Disabling authentication from legacy authentication clients, which can’t do MFA.'
  impact: This recommendation should be implemented initially and then may be overridden by other service/product specific
    CIS Benchmarks. Administrators should also be aware that certain configurations in Microsoft Entra ID may impact other
    Microsoft services such as Microsoft 365. Page 34
  references:
  - 1. https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
  page_start: 34
  audit_raw: "Audit from Azure Portal\nTo ensure security defaults is enabled in your directory:\n1. From Azure Home select\
    \ the Portal Menu.\n2. Browse to Microsoft Entra ID > Properties.\n3. Select Manage security defaults.\n4. Under Security\
    \ defaults, verify that Enabled is selected.\nAudit from Azure CLI\naz rest --method get --url\n'https://graph.microsoft.com/v1.0/policies/identitySecurityDefaultsEnforcementPolic\n\
    y' --query \"isEnabled\"\nEnsure the returned value is true.\nAudit from PowerShell\nConnect-MgGraph -Scopes \"Policy.Read.All\"\
    \n(Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy).IsEnabled\nEnsure the returned value is True.\n Page 35"
  remediation: 'Note: These steps require at least the Conditional Access Administrator role.

    Remediate from Azure Portal

    To enable security defaults in your directory:

    1. From Azure Home select the Portal Menu.

    2. Browse to Microsoft Entra ID > Properties.

    3. Select Manage security defaults.

    4. Under Security defaults, select Enabled.

    5. Select Save.

    Remediate from Azure CLI

    az rest --method patch --url

    ''https://graph.microsoft.com/v1.0/policies/identitySecurityDefaultsEnforcementPolic

    y'' --body ''{"isEnabled":true}''

    az rest --method get --url

    ''https://graph.microsoft.com/v1.0/policies/identitySecurityDefaultsEnforcementPolic

    y'' --query "isEnabled"

    Remediate from PowerShell

    Connect-MgGraph -Scopes "Policy.Read.All", "Policy.ReadWrite.SecurityDefaults"

    Update-MgPolicyIdentitySecurityDefaultEnforcementPolicy -IsEnabled:$true

    (Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy).IsEnabled'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      To ensure security defaults is enabled in your directory:

      1. From Azure Home select the Portal Menu.

      2. Browse to Microsoft Entra ID > Properties.

      3. Select Manage security defaults.

      4. Under Security defaults, verify that Enabled is selected.

      Audit from Azure CLI

      az rest --method get --url

      ''https://graph.microsoft.com/v1.0/policies/identitySecurityDefaultsEnforcementPolic

      y'' --query "isEnabled"

      Ensure the returned value is true.

      Audit from PowerShell

      Connect-MgGraph -Sco'
    severity: medium
- id: 5.1.2
  title: Ensure that 'Require Multifactor Authentication to register or join devices with Microsoft Entra' is set to 'Yes'
  scoring: manual
  profile:
  - Level 1
  description: 'NOTE: This recommendation is only relevant if your subscription is using Per-User MFA. If your organization
    is licensed to use Conditional Access, the preferred method of requiring MFA to join devices to Entra ID is to use a Conditional
    Access policy (see additional information below for link). Joining or registering devices to Microsoft Entra ID should
    require multi-factor authentication.'
  rationale: Multi-factor authentication is recommended when adding devices to Microsoft Entra ID. When set to Yes, users
    who are adding devices from the internet must first use the second method of authentication before their device is successfully
    added to the directory. This ensures that rogue devices are not added to the domain using a compromised user account.
  impact: A slight impact of additional overhead, as Administrators will now have to approve every access to the domain.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-allusers-device-registration
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-6-use-strong-authentication-controls
  page_start: 38
  audit_raw: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu\n2. Select Microsoft Entra ID\n3. Under Manage,\
    \ select Devices\n4. Under Manage, select Device settings\n5. Under Microsoft Entra join and registration settings, ensure\n\
    that Require Multifactor Authentication to register or join\ndevices with Microsoft Entra is set to Yes\n Page 38"
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select Devices

    4. Under Manage, select Device settings

    5. Under Microsoft Entra join and registration settings, set

    Require Multifactor Authentication to register or join

    devices with Microsoft Entra to Yes

    6. Click Save'
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu\n2. Select Microsoft Entra ID\n3. Under Manage,\
      \ select Devices\n4. Under Manage, select Device settings\n5. Under Microsoft Entra join and registration settings,\
      \ ensure\nthat Require Multifactor Authentication to register or join\ndevices with Microsoft Entra is set to Yes\n\
      \ Page 38"
    severity: medium
- id: 5.1.3
  title: Ensure that 'Per-user MFA' Status is 'Enabled' or 'Enforced' for All Users
  scoring: scored
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access,
    ignore the recommendations in this section and proceed to the Conditional Access section.] Enable multifactor authentication
    for all users. Note: Since 2024, Azure has been rolling out mandatory multifactor authentication. For more information:
    • https://azure.microsoft.com/en-us/blog/announcing-mandatory-multi-factorauthentication-for-azure-sign-in • https://learn.microsoft.com/en-us/entra/identity/authentication/conceptmandatory-multifactor-authentication'
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Users would require two forms of authentication before any access is granted. Additional administrative time will
    be required for managing dual forms of authentication when enabling multifactor authentication. Page 41
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfahowitworks
  - 2. https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfauserstates
  page_start: 41
  audit_raw: "Note: Reading another user's per-user MFA status requires at least the Global Reader\nor Authentication Policy\
    \ Administrator role.\nAudit from Azure Portal\n1. Go to Microsoft Entra ID.\n2. Under Manage, click Users.\n3. Click\
    \ Per-user MFA from the top menu.\n4. Ensure that Status is Enabled or Enforced for all users.\nAudit from PowerShell\n\
    Per-user MFA status is available only from the Microsoft Graph beta API. Run the\nfollowing commands to list each user\
    \ whose status is neither enabled nor enforced:\nConnect-MgGraph -Scopes \"User.ReadBasic.All\", \"Policy.Read.All\"\n\
    Get-MgUser -All -Property Id, UserPrincipalName | ForEach-Object {\n $state = (Invoke-MgGraphRequest -Method GET -Uri\n\
    \"/beta/users/$($_.Id)/authentication/requirements\").perUserMfaState\n if ($state -notin 'enabled', 'enforced') {\n [pscustomobject]@{\
    \ UserPrincipalName = $_.UserPrincipalName;\nPerUserMfaState = $state }\n }\n}\nIf any user is returned, this recommendation\
    \ is non-compliant.\n Page 42"
  remediation: 'Note: These steps require at least the Authentication Policy Administrator role.

    Remediate from Azure Portal

    1. Go to Microsoft Entra ID.

    2. Under Manage, click Users.

    3. Click Per-user MFA from the top menu.

    4. Click the box next to a user with Status Disabled.

    5. Click Enable MFA.

    6. Click Enable.

    7. Repeat steps 4-6 for each user requiring remediation.

    Other options within Azure Portal

    • https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enableazure-mfa

    • https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfamfasettings

    • https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-oldrequire-mfa-admin

    • https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfagetstarted#enable-multi-factor-authentication-with-conditional-access

    Remediate from PowerShell

    Run the following commands, repeating the second command for each user whose

    status is disabled:

    Connect-MgGraph -Scopes "Policy.ReadWrite.AuthenticationMethod"

    Invoke-MgGraphRequest -Method PATCH -Uri "/beta/users/<user-principalname>/authentication/requirements" -Body ''{"perUserMfaState":"enabled"}''
    -

    ContentType "application/json"'
  checks:
  - type: manual_review
    info: 'Note: Reading another user''s per-user MFA status requires at least the Global Reader

      or Authentication Policy Administrator role.

      Audit from Azure Portal

      1. Go to Microsoft Entra ID.

      2. Under Manage, click Users.

      3. Click Per-user MFA from the top menu.

      4. Ensure that Status is Enabled or Enforced for all users.

      Audit from PowerShell

      Per-user MFA status is available only from the Microsoft Graph beta API. Run the

      following commands to list each user whose status is neither enabled nor enforced:

      '
    severity: medium
- id: 5.1.4
  title: Ensure that 'Allow users to remember multifactor authentication on devices they trust' is Disabled
  scoring: manual
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access,
    ignore the recommendations in this section and proceed to the Conditional Access section.] Do not allow users to remember
    multi-factor authentication on devices.'
  rationale: Remembering Multi-Factor Authentication (MFA) for devices and browsers allows users to have the option to bypass
    MFA for a set number of days after performing a successful sign-in using MFA. This can enhance usability by minimizing
    the number of times a user may need to perform two-step verification on the same device. However, if an account or device
    is compromised, remembering MFA for trusted devices may affect security. Hence, it is recommended that users not be allowed
    to bypass MFA.
  impact: For every login attempt, the user will be required to perform multi-factor authentication.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfamfasettings#remember-multi-factor-authentication-for-devices-that-users-trust
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3identity-management#im-4-use-strong-authentication-controls-for-all-azureactive-directory-based-access
  page_start: 45
  audit_raw: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu\n2. Select Microsoft Entra ID\n3. Under Manage,\
    \ click Users\n4. Click the Per-user MFA button on the top bar\n5. Click on Service settings\n6. Ensure that Allow users\
    \ to remember multi-factor authentication\non devices they trust is not enabled\n Page 45"
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, click Users

    4. Click the Per-user MFA button on the top bar

    5. Click on Service settings

    6. Uncheck the box next to Allow users to remember multi-factor

    authentication on devices they trust

    7. Click Save'
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu\n2. Select Microsoft Entra ID\n3. Under Manage,\
      \ click Users\n4. Click the Per-user MFA button on the top bar\n5. Click on Service settings\n6. Ensure that Allow users\
      \ to remember multi-factor authentication\non devices they trust is not enabled\n Page 45"
    severity: medium
- id: 5.3.1
  title: Ensure that Azure Admin Accounts Are Not Used for Daily Operations
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Azure admin accounts should not be used for routine, non-administrative tasks.
  rationale: Using admin accounts for daily operations increases the risk of accidental misconfigurations and security breaches.
  impact: Minor administrative overhead includes managing separate accounts, enforcing stricter access controls, and potential
    licensing costs for advanced security features.
  references:
  - 1. https://learn.microsoft.com/en-us/security/privileged-access-workstations/criticalimpact-accounts
  - 2. NIST SP 800-53:rev5:AC-6 (2)
  page_start: 49
  audit_raw: "Audit from Azure Portal\nMonitor:\n1. Go to Monitor.\n2. Click Activity log.\n3. Review the activity log and\
    \ ensure that admin accounts are not being used for\ndaily operations.\nMicrosoft Entra ID:\n1. Go to Microsoft Entra\
    \ ID.\n2. Under Monitoring, click Sign-in logs.\n3. Review the sign-in logs and ensure that admin accounts are not being\
    \ accessed\nmore frequently than necessary.\n Page 49"
  remediation: 'If admin accounts are being used for daily operations, consider the following:

    • Monitor and alert on unusual activity.

    • Enforce the principle of least privilege.

    • Revoke any unnecessary administrative access.

    • Use Conditional Access to limit access to resources.

    • Ensure that administrators have separate admin and user accounts.

    • Use Microsoft Entra ID Protection to detect, investigate, and remediate identitybased risks.

    • Use Privileged Identity Management (PIM) in Microsoft Entra ID to limit standing

    administrator access to privileged roles, discover who has access, and review

    privileged access.'
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\nMonitor:\n1. Go to Monitor.\n2. Click Activity log.\n3. Review the activity log and ensure\
      \ that admin accounts are not being used for\ndaily operations.\nMicrosoft Entra ID:\n1. Go to Microsoft Entra ID.\n\
      2. Under Monitoring, click Sign-in logs.\n3. Review the sign-in logs and ensure that admin accounts are not being accessed\n\
      more frequently than necessary.\n Page 49"
    severity: medium
- id: 5.3.2
  title: Ensure that Guest Users are Reviewed on a Regular Basis
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Entra ID has native and extended identity functionality allowing you to invite people from outside
    your organization to be guest users in your cloud account and sign in with their own work, school, or social identities.
    While an automated assessment procedure exists for this recommendation, the assessment status remains manual. Evaluating
    the appropriateness of guest users requires a manual review, as it depends on the specific needs and context of each organization
    and environment.
  rationale: Guest users are typically added outside your employee on-boarding/off-boarding process and could potentially
    be overlooked indefinitely. To prevent this, guest users should be reviewed on a regular basis. During this audit, guest
    users should also be determined to not have administrative privileges.
  impact: Before removing guest users, determine their use and scope. Like removing any user, there may be unforeseen consequences
    to systems if an account is removed without careful consideration. Page 51
  references:
  - 1. https://learn.microsoft.com/en-us/entra/external-id/user-properties
  - 2. https://learn.microsoft.com/en-us/entra/fundamentals/how-to-create-deleteusers#delete-a-user
  page_start: 51
  audit_raw: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu\n2. Select Microsoft Entra ID\n3. Under Manage,\
    \ select Users\n4. Click on Add filter\n5. Select User type\n6. Select Guest from the Value dropdown\n7. Click Apply\n\
    8. Audit the listed guest users\nAudit from Azure CLI\naz ad user list --query \"[?userType=='Guest']\"\nEnsure all users\
    \ listed are still required and not inactive.\nAudit from PowerShell\nConnect to Microsoft Graph, then list guest users:\n\
    Connect-MgGraph -Scopes 'User.Read.All'\nGet-MgUser -Filter \"userType eq 'Guest'\" -All | Select-Object DisplayName,\n\
    UserPrincipalName, UserType\nEnsure all guest users listed are still required and not inactive.\nAudit from Azure Policy\n\
    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition\
    \ in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: e9ac8f8e-ce22-4355-8f04-99b911d6be52 - Name: 'Guest accounts\nwith read permissions on Azure resources should\
    \ be removed'\n• Policy ID: 94e1c2ac-cbbe-4cac-a2b5-389c812dee87 - Name: 'Guest accounts\nwith write permissions on Azure\
    \ resources should be removed'\n• Policy ID: 339353f6-2387-4a45-abe4-7f529d121046 - Name: 'Guest accounts\nwith owner\
    \ permissions on Azure resources should be removed'\n Page 52"
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select Users

    4. Click on Add filter

    5. Select User type

    6. Select Guest from the Value dropdown

    7. Click Apply

    8. Check the box next to all Guest users that are no longer required or are inactive

    9. Click Delete

    10. Click OK

    Remediate from Azure CLI

    Before deleting the user, disable it (using the ID from the Audit Procedure) to determine

    whether any dependent systems rely on it:

    az ad user update --id <exampleaccountid@domain.com> --account-enabled false

    After confirming there are no dependent systems, delete the user:

    az ad user delete --id <exampleaccountid@domain.com>

    Remediate from PowerShell

    Before deleting the user, disable it to determine whether any dependent systems rely on

    it:

    Connect-MgGraph -Scopes ''User.ReadWrite.All''

    Update-MgUser -UserId <exampleaccountid@domain.com> -AccountEnabled:$false

    After confirming there are no dependent systems, delete the user:

    Remove-MgUser -UserId <exampleaccountid@domain.com>'
  checks:
  - type: sql
    command: select the Portal Menu
    severity: medium
    info: 'Audit from Azure Portal

      1. From Azure Home select the Portal Menu

      2. Select Microsoft Entra ID

      3. Under Manage, select Users

      4. Click on Add filter

      5. Select User type

      6. Select Guest from the Value dropdown

      7. Click Apply

      8. Audit the listed guest users

      Audit from Azure CLI

      az ad user list --query "[?userType==''Guest'']"

      Ensure all users listed are still required and not inactive.

      Audit from Power'
- id: 5.3.3
  title: Ensure That Use of the 'User Access Administrator' Role is Restricted
  scoring: scored
  profile:
  - Level 1
  description: The User Access Administrator role grants the ability to view all resources and manage access assignments at
    any subscription or management group level within the tenant. Due to its high privilege level, this role assignment should
    be removed immediately after completing the necessary changes at the root scope to minimize security risks.
  rationale: The User Access Administrator role provides extensive access control privileges. Unnecessary assignments heighten
    the risk of privilege escalation and unauthorized access. Removing the role immediately after use minimizes security exposure.
  impact: Increased administrative effort to manage and remove role assignments appropriately.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/elevateaccess-global-admin
  page_start: 55
  audit_raw: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu.\n2. Select Subscriptions.\n3. Select a subscription.\n\
    4. Select Access control (IAM).\n5. In the horizontal menu select Roles.\n6. Search for User Access Administrator.\n7.\
    \ In the Details column select View.\n8. In the horizontal menu select Assignments.\n9. Audit the list for assignments.\n\
    Audit from Azure CLI\nThe following command only validates the '/' scope and not subscription scopes\nRun the following\
    \ command:\naz role assignment list --role \"User Access Administrator\" --scope \"/\"\nEnsure that the command does not\
    \ return any User Access Administrator role\nassignment information.\n Page 55"
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu.

    2. Select Subscriptions.

    3. Select a subscription.

    4. Select Access control (IAM).

    5. In the horizontal menu select Roles.

    6. Search for User Access Administrator.

    7. In the Details column select View.

    8. In the horizontal menu select Assignments.

    9. Select the user you wish to remove.

    10. Select Remove.

    Remediate from Azure CLI

    Run the following command:

    az role assignment delete --role "User Access Administrator" --scope "/"'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. From Azure Home select the Portal Menu.

      2. Select Subscriptions.

      3. Select a subscription.

      4. Select Access control (IAM).

      5. In the horizontal menu select Roles.

      6. Search for User Access Administrator.

      7. In the Details column select View.

      8. In the horizontal menu select Assignments.

      9. Audit the list for assignments.

      Audit from Azure CLI

      The following command only validates the ''/'' scope and not subscription scopes

      Run the following command:

      az role assignment list'
    severity: medium
- id: 5.3.4
  title: Ensure that All 'Privileged' Role Assignments are Periodically Reviewed
  scoring: manual
  profile:
  - Level 1
  description: Periodic review of privileged role assignments is performed to ensure that the privileged roles assigned to
    users are accurate and appropriate.
  rationale: 'Privileged roles are crown jewel assets that can be used by malicious insiders, threat actors, and even through
    mistake to significantly damage an organization in numerous ways. These roles should be periodically reviewed to: • identify
    lingering permissions assignment (e.g. an administrator has been terminated, the administrator account is being retained,
    but the permissions are no longer necessary and has not been properly addressed by process) • detect lateral movement
    through privilege escalation (e.g. an account with administrative permission has been compromised and is elevating other
    accounts in an attempt to circumvent detection mechanisms)'
  impact: Increased administrative effort to manage and remove role assignments appropriately.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - 2. NIST SP 800-53:rev5:AC-6 (7)
  page_start: 57
  audit_raw: "Audit from Azure Portal\n1. From Azure Home select the Portal Menu.\n2. Select Subscriptions.\n3. Select a subscription.\n\
    4. Select Access control (IAM).\n5. In the horizontal menu, select Roles.\n6. In the second horizontal menu select Privileged\
    \ administrator roles.\n7. For each role, audit by selecting the View link under the Details column.\n8. Once selected,\
    \ choose Assignments to view the users and resources that are\nassigned the role.\nNOTE: The judgement of what constitutes\
    \ 'appropriate and current' assignments\nrequires a clear understanding of your organization's personnel, systems, policy,\
    \ and\nsecurity requirements. This cannot be effectively prescribed in procedure.\n Page 57"
  remediation: ''
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. From Azure Home select the Portal Menu.

      2. Select Subscriptions.

      3. Select a subscription.

      4. Select Access control (IAM).

      5. In the horizontal menu, select Roles.

      6. In the second horizontal menu select Privileged administrator roles.

      7. For each role, audit by selecting the View link under the Details column.

      8. Once selected, choose Assignments to view the users and resources that are

      assigned the role.

      NOTE: The judgement of what constitutes ''appropriate and curren'
    severity: medium
- id: 5.3.5
  title: Ensure Disabled User Accounts do not Have Read, Write, or Owner Permissions
  scoring: manual
  profile:
  - Level 1
  description: When a user account is disabled, any Azure role assignments it holds (including read, write, or owner permissions)
    remain in place unless they are explicitly removed, leaving latent access attached to an account that is no longer in
    active use. Remove read, write, and owner role assignments from disabled Azure user accounts. While an automated assessment
    procedure exists for this recommendation, the assessment status remains manual. Removing role assignments from disabled
    user accounts depends on the context and requirements of each organization and environment.
  rationale: Disabled accounts should not retain access to resources, as this poses a security risk. Removing role assignments
    mitigates potential unauthorized access and enforces the principle of least privilege.
  impact: Ensure disabled accounts are not relied on for break glass or automated processes before removing roles to avoid
    service disruption. Page 59
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/az.resources/get-azaduser
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.resources/getazroleassignment
  page_start: 59
  audit_raw: "Audit from Azure Portal\n1. Go to Microsoft Entra ID.\n2. Under Manage, click Users.\n3. Click Add filter.\n\
    4. Click Account enabled.\n5. Click the toggle switch to set the value to No.\n6. Click Apply.\n7. Click the Display name\
    \ of a disabled user account.\n8. Click Azure role assignments.\n9. Ensure that no read, write, or owner roles are assigned\
    \ to the user account.\n10. Repeat steps 7-9 for each disabled user account.\nAudit from PowerShell\nConnect to Azure,\
    \ then list the Azure role assignments held by each disabled user\naccount:\nConnect-AzAccount\n# Disabled user accounts\
    \ (Get-AzADUser returns the object id as .Id)\n$disabled = Get-AzADUser -Filter \"accountEnabled eq false\"\nforeach ($user\
    \ in $disabled) {\n Get-AzRoleAssignment -ObjectId $user.Id |\n Select-Object\n@{Name='UserPrincipalName';Expression={$user.UserPrincipalName}},\n\
    RoleDefinitionName, Scope\n}\nEnsure that no read, write, or owner roles are returned for any disabled account. An\nempty\
    \ result for a user means it holds no Azure role assignments and is compliant.\nAudit from Azure Policy\nIf referencing\
    \ a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\n\
    If referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
