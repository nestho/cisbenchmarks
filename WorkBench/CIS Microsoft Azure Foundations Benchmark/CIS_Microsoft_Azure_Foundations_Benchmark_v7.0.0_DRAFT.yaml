- id: 8.1.11
  title: Ensure that Microsoft Defender for Cloud is Configured to Check VM Operating Systems for Updates
  scoring: scored
  profile:
  - Level 1
  description: Defender for Cloud reports missing operating system updates on machines from Azure Update Manager assessment
    data. A machine's periodic assessment setting is ImageDefault, which runs no scheduled check, or AutomaticByPlatform,
    which checks for missing updates every 24 hours.
  rationale: A machine that is never assessed has no record of the security updates it lacks. It stays exploitable through
    every published vulnerability it is missing a patch for, with no recommendation or alert to prompt anyone to fix it.
  impact: Defender for Cloud generates the system update recommendations only on subscriptions with Defender for Servers Plan
    2, which is billed per machine; see https://azure.microsoft.com/pricing/details/defender-for-cloud/. Without Plan 2, periodic
    assessment of Azure Arc-enabled machines incurs Azure Update Manager charges. Installing updates can restart machines,
    depending on the reboot setting chosen for the installation. Page 373
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-periodicsystem-updates
  - 2. https://learn.microsoft.com/en-us/azure/update-manager/assessment-options
  page_start: 373
  audit_raw: "Audit from Azure Portal\n1. Go to Microsoft Defender for Cloud.\n2. Select Recommendations.\n3. Search for Machines\
    \ should be configured to periodically check\nfor missing system updates.\n4. Verify that no machines are listed as unhealthy.\n\
    5. Search for System updates should be installed on your machines\n(powered by Azure Update Manager). The cited Azure\
    \ Policy definition\nkeeps the earlier name, powered by Update Center.\n6. Verify that no machines are listed as unhealthy.\n\
    Audit from Azure CLI\nRun the following command for each Azure virtual machine:\naz vm show --resource-group <resource-group>\
    \ --name <vm-name> --query\n\"{windows:osProfile.windowsConfiguration.patchSettings.assessmentMode,\nlinux:osProfile.linuxConfiguration.patchSettings.assessmentMode}\"\
    \nVerify that the value for the machine's operating system is AutomaticByPlatform.\nThis command checks only the periodic\
    \ assessment setting on Azure VMs; use the\nportal method for Azure Arc-enabled machines and for installed updates.\n\
    Audit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\n\
    associated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: f85bf3e0-d513-442e-89c3-1784ad63382b - Name: 'System updates\nshould be installed on your machines (powered\
    \ by Update Center)'\n• Policy ID: bd876905-5b84-4f73-ab2d-2e7a7c4568d9 - Name: 'Machines should\nbe configured to periodically\
    \ check for missing system updates'\n Page 374"
  remediation: 'Remediate from Azure Portal

    1. Go to Microsoft Defender for Cloud.

    2. Select Recommendations.

    3. Select Machines should be configured to periodically check

    for missing system updates.

    4. Select the unhealthy machines, then click Fix.

    5. Select System updates should be installed on your machines

    (powered by Azure Update Manager).

    6. Select the unhealthy machines, then click Fix to install the missing updates.

    Remediate from Azure CLI

    For each Windows virtual machine requiring remediation, run the following command:

    az vm update --resource-group <resource-group> --name <vm-name> --set

    osProfile.windowsConfiguration.patchSettings.assessmentMode=AutomaticByPlatform

