- id: '7.9'
  title: Ensure that Virtual Network Flow Log Retention Days is Set to Greater than or Equal to 90
  scoring: scored
  profile:
  - Level 2
  description: 'Ensure that virtual network flow logs are retained for greater than or equal to 90 days. Azure VPN Gateway
    point-to-site connections authenticate clients with any combination of Azure certificate, RADIUS authentication, and Microsoft
    Entra ID. The Authentication type setting selects which of these methods the gateway accepts. Prerequisites: Before removing
    certificate or RADIUS authentication, add Microsoft Entra ID alongside it and deploy the Azure VPN Client profile to every
    point-to-site user, as the first remediation step describes.'
  rationale: 'Virtual network flow logs provide critical visibility into traffic patterns. Logs can be used to check for anomalies
    and give insight into suspected breaches. Client certificates and RADIUS credentials sit outside the organization''s identity
    provider: a certificate is a long-lived file that works from any device holding it, and RADIUS relies on a separate credential
    store. A stolen certificate or RADIUS credential grants access to the virtual network with no Conditional Access, multifactor
    authentication, or central revocation.'
  impact: • Virtual network flow logs are charged per gigabyte of network flow logs collected and come with a free tier of
    5 GB/month per subscription. • If traffic analytics is enabled with virtual network flow logs, traffic analytics pricing
    applies at per gigabyte processing rates. • The storage of logs is charged separately, and the cost will depend on the
    amount of logs and the retention period. Page 243 Microsoft Entra ID authentication works only over OpenVPN and only with
    the Azure VPN Client for Windows and macOS; the Linux client retired on August 31, 2026. Linux, IKEv2, and SSTP clients
    lose access once the other methods are removed. SSTP cannot be combined with OpenVPN, and the gateway cannot use the Basic
    SKU or a policy-based VPN type. Page 247
  references:
  - 1. https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage
  - 2. https://learn.microsoft.com/en-us/cli/azure/network/watcher/flow-log
  - 1. https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
  - 2. https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
