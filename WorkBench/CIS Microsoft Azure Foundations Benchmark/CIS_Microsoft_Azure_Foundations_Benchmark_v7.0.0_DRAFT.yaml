- id: 8.1.3.1
  title: Ensure that Defender for Servers is Set to 'On'
  scoring: scored
  profile:
  - Level 2
  description: Defender for Servers is a Microsoft Defender for Cloud plan that protects Azure and non-Azure machines. Its
    Status is On or Off; when On, the subplan is Plan 1, which provides the Defender for Endpoint integration, or Plan 2,
    which adds agentless scanning, file integrity monitoring, and just-in-time VM access.
  rationale: Without the plan, machines have no Defender for Cloud threat detection and no endpoint detection and response
    through the Defender for Endpoint integration. An attacker who reaches a VM can then run malware, move laterally, or exploit
    an unpatched service without raising a Defender for Cloud alert.
  impact: 'Defender for Servers is billed per protected machine, and Plan 2 costs more than Plan 1; see https://azure.microsoft.com/pricing/details/defender-for-cloud/
    to estimate costs. Plan 1 can be enabled per subscription or per machine, while Plan 2 can be enabled only per subscription.
    Note: This recommendation passes on either subplan, but in this benchmark Ensure that ''File Integrity Monitoring'' Component
    Status is Set to ''On'' and Ensure that Microsoft Defender for Cloud is Configured to Check VM Operating Systems for Updates
    depend on Plan 2, and Ensure that ''Agentless scanning for machines'' Component Status is Set to ''On'' depends on Plan
    2 or Defender CSPM. Page 303'
