- id: 8.1.1.1
  title: Ensure Microsoft Defender CSPM is Set to 'On'
  scoring: scored
  profile:
  - Level 2
  description: Enable Microsoft Defender CSPM to continuously assess cloud resources for security misconfigurations, compliance
    risks, and exposure to threats.
  rationale: Microsoft Defender CSPM provides detailed visibility into the security state of assets and workloads and offers
    hardening guidance to help improve security posture.
  impact: Enabling Microsoft Defender CSPM incurs hourly charges for each billable compute, database, and storage resource.
    This can lead to significant costs in larger environments. Careful planning and cost analysis are recommended before enabling
    the service. Refer to https://azure.microsoft.com/en-us/pricing/details/defender-forcloud/#pricing for pricing information.
    Page 293
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloudsecurity-posture-management
  - 2. https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-cspmplan
  page_start: 293
  audit_raw: "Audit from Azure Portal\n1. Go to Microsoft Defender for Cloud.\n2. Under Management, click Environment settings.\n\
    3. Click the name of a subscription.\n4. Select the Defender plans blade.\n5. Under Cloud Security Posture Management\
    \ (CSPM), in the row for\nDefender CSPM, ensure Status is set to On.\nAudit from Azure CLI\nRun the following command\
    \ to get the CloudPosture plan pricing tier:\naz security pricing show --name CloudPosture --query pricingTier\nEnsure\
    \ \"Standard\" is returned.\nAudit from PowerShell\nRun the following command to get the CloudPosture plan pricing tier:\n\
    Get-AzSecurityPricing -Name CloudPosture | Select-Object PricingTier\nEnsure Standard is returned.\nAudit from Azure Policy\n\
    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition\
    \ in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 1f90fc71-a595-4066-8974-d4d0802e8ef0 - Name: 'Microsoft Defender\nCSPM should be enabled'\n Page 294"
  remediation: 'Remediate from Azure Portal

    1. Go to Microsoft Defender for Cloud.

    2. Under Management, click Environment settings.

    3. Click the name of a subscription.

    4. Select the Defender plans blade.

    5. Under Cloud Security Posture Management (CSPM), in the row for

    Defender CSPM, set the toggle switch for Status to On.

    6. Click Save.

    Remediate from Azure CLI

    Run the following command to enable Defender CSPM:

    az security pricing create --name CloudPosture --tier Standard --extensions

    name=ApiPosture isEnabled=true

    Remediate from PowerShell

    Run the following command to enable Defender CSPM:

    Set-AzSecurityPricing -Name CloudPosture -PricingTier Standard -Extension

    ''[{"name":"ApiPosture","isEnabled":"True"}]'''
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Microsoft Defender for Cloud.

      2. Under Management, click Environment settings.

      3. Click the name of a subscription.

      4. Select the Defender plans blade.

      5. Under Cloud Security Posture Management (CSPM), in the row for

      Defender CSPM, ensure Status is set to On.

      Audit from Azure CLI

      Run the following command to get the CloudPosture plan pricing tier:

      az security pricing show --name CloudPosture --query pricingTier

      Ensure "Standard" is returned.

      Audit from PowerShel'
    severity: medium
- id: 8.1.2.1
  title: Ensure Microsoft Defender for APIs is Set to 'On'
  scoring: scored
  profile:
  - Level 2
  description: Microsoft Defender for APIs offers full lifecycle protection, detection, and response coverage for APIs. While
    an automated assessment procedure exists for this recommendation, the assessment status remains manual. Due to its potentially
    high cost, Microsoft Defender for APIs may not be suitable for all environments and should be evaluated carefully before
    implementation.
  rationale: Microsoft Defender for APIs helps provide visibility into business-critical APIs, assess and improve their security
    posture, prioritize vulnerability remediation, and detect threats in real time.
  impact: Microsoft Defender for APIs uses a tiered pricing model, billed per subscription per hour, with each tier allowing
