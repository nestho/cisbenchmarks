    \ no retention policy.\n9. Repeat steps 7 and 8 for each virtual network flow log.\nAudit from Azure CLI\nRun the following\
    \ command to list network watchers:\naz network watcher list\nRun the following command to list the name and retention\
    \ policy of flow logs in a\nnetwork watcher:\naz network watcher flow-log list --location <location> --query\n[*].[name,retentionPolicy]\n\
    For each flow log, ensure that days is set to 0, 90, or a number greater than 90. If\ndays is set to 0, the logs are retained\
    \ indefinitely with no retention policy.\nRepeat for each network watcher.\n Page 244\nNote: Some Azure portal builds\
