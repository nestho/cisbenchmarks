- id: 8.1.10.2
  title: Ensure that 'Suspicious prompt evidence' Component Status is Set to 'On'
  scoring: scored
  profile:
  - Level 2
  description: 'Microsoft Defender for AI Services alerts either include the suspicious segments of user prompts and model
    responses as evidence, with sensitive data redacted, or mask that content. The Enable user prompt evidence setting of
    the plan''s suspicious prompt evidence component selects between them, with values On and Off. Prerequisites: Complete
    the recommendation Ensure That Microsoft Defender for AI Services Is Set To ''On'' first, because this component can be
    configured only while the plan is on.'
  rationale: With the component off, Defender for Cloud still detects AI threats but masks prompt and response content in
    alerts, so analysts cannot see what was sent to the model or what it returned. A jailbreak or data-leakage alert then
    cannot be confirmed or scoped from its evidence, delaying response and obscuring what data was disclosed.
  impact: Once on, alert evidence contains redacted snippets of user prompts and model responses. These are customer data,
    visible to anyone who can read the alerts in the Azure portal, the Defender portal, or an attached partner integration,
    which can conflict with data-minimization requirements. Page 369
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding#enablesuspicious-prompt-evidence
  - 2. https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
  page_start: 369
  audit_raw: "Audit from Azure Portal\n1. Navigate to Microsoft Defender for Cloud > Environment settings.\n2. Click the name\
    \ of a subscription.\n3. On the Defender plans page, locate AI services and click Settings.\n4. Verify that Enable user\
    \ prompt evidence is set to On.\n5. Repeat steps 1-4 for each subscription.\nAudit from Azure CLI\nRun the following command\
    \ for each subscription:\naz security pricing show -n 'AI' --subscription <subscription-id> --query\n\"extensions[].{Name:name,\
    \ IsEnabled:isEnabled}\" --output table\nThe subscription is compliant when the AIPromptEvidence row shows True. A value\n\
    of False, or no AIPromptEvidence row, is non-compliant.\nAudit from PowerShell\nRun the following commands for each subscription:\n\
    Set-AzContext -Subscription <subscription-id>\n((Get-AzSecurityPricing -Name 'AI').Extensions | ConvertFrom-Json) | Select-Object\n\
    name, isEnabled\nThe subscription is compliant when the AIPromptEvidence row shows True. A value\nof False, or no AIPromptEvidence\
    \ row, is non-compliant.\n Page 370"
  remediation: 'Note: These steps require the Owner or Contributor role on each subscription. The

    Azure CLI and PowerShell commands set the plan to Standard, which turns it on

    where it is off.

    Remediate from Azure Portal

    1. Navigate to Microsoft Defender for Cloud > Environment settings.

    2. Click the name of a subscription.

    3. On the Defender plans page, locate AI services and click Settings.

    4. Set Enable user prompt evidence to On.

    5. Click Continue.

    6. Click Save.

    7. Repeat steps 1-6 for each subscription.

    Remediate from Azure CLI

    Run the following command for each subscription. For each other extension the Audit

    listed, repeat --extensions with its name, current isEnabled value, and any

    additionalExtensionProperties so the update leaves it unchanged.

    az security pricing create -n ''AI'' --tier ''Standard'' --subscription <subscriptionid> --extensions name=AIPromptEvidence
    isEnabled=True

    Remediate from PowerShell

    Run the following commands for each subscription. They set AIPromptEvidence to

    True, adding it if absent, and resubmit the plan''s other extensions unchanged.

    Set-AzContext -Subscription <subscription-id>

    $extensions = @(((Get-AzSecurityPricing -Name ''AI'').Extensions | ConvertFrom-Json)

    | Select-Object name, isEnabled, additionalExtensionProperties)

    $row = $extensions | Where-Object { $_.name -eq ''AIPromptEvidence'' }

    if ($row) { $row.isEnabled = ''True'' } else { $extensions += [pscustomobject]@{ name

    = ''AIPromptEvidence''; isEnabled = ''True''; additionalExtensionProperties = $null } }

    Set-AzSecurityPricing -Name ''AI'' -PricingTier ''Standard'' -Extension (ConvertTo-Json

    -InputObject $extensions -Compress -Depth 5)'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Navigate to Microsoft Defender for Cloud > Environment settings.

      2. Click the name of a subscription.

      3. On the Defender plans page, locate AI services and click Settings.

      4. Verify that Enable user prompt evidence is set to On.

      5. Repeat steps 1-4 for each subscription.

      Audit from Azure CLI

      Run the following command for each subscription:

      az security pricing show -n ''AI'' --subscription <subscription-id> --query

      "extensions[].{Name:name, IsEnabled:isEnabled}" --output '
