- id: 6.1.1.2
  title: Ensure Diagnostic Setting Captures Appropriate Categories
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'A subscription''s activity log diagnostic setting exports only the categories selected in it, from eight:
    Administrative, ServiceHealth, ResourceHealth, Alert, Autoscale, Recommendation, Security, and Policy. Four are required:
    Administrative, Alert, Policy, and Security. The setting''s existence is covered by Ensure that a ''Diagnostic Setting''
    Exists for Subscription Activity Logs. Customer-managed keys introduce additional depth to security by providing a means
    to manage access control for encryption keys. Where compliance and security frameworks indicate the need, and organizational
    capacity allows, sensitive data at rest can be encrypted using customer-managed keys (CMK) rather than Microsoft-managed
    keys.'
  rationale: Administrative records every Resource Manager write, delete, and action, including role assignment changes; Security
    records Microsoft Defender for Cloud alerts; Policy records Azure Policy audit and deny actions; and Alert records alert
    activations. A setting that omits them drops the events an investigation of a control-plane intrusion relies on, and they
    are lost after the activity log's 90-day retention. Page 99 By default in Azure, data at rest tends to be encrypted using
    Microsoft-managed keys. If your organization wants to control and manage encryption keys for compliance and defense-in-depth,
    customer-managed keys can be established. Configuring the storage account with the activity log export container to use
    CMKs provides additional confidentiality controls on log data, as a given user must have read permission on the corresponding
    storage account and must be granted decrypt permission by the CMK. While it is possible to automate the assessment of
    this recommendation, the assessment status for this recommendation remains 'Manual' due to ideally limited scope. The
    scope of application—which workloads CMK is applied to—should be carefully considered to account for organizational capacity
    and targeted to workloads with specific need for CMK.
  impact: If the key expires due to setting the 'activation date' and 'expiration date', the key must be rotated manually.
    Using customer-managed keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed. Page 103
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-logschema#categories
  - 2. https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnosticsettings
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 99
  audit_raw: "Audit from Azure Portal\n1. Go to Monitor.\n2. Click Activity log.\n3. Click Export Activity Logs.\n4. Select\
    \ a subscription.\n5. Click Edit setting next to each diagnostic setting that has a destination.\n6. Ensure that Administrative,\
    \ Alert, Policy, and Security are each\nchecked in at least one of these diagnostic settings.\n7. Repeat steps 4-6 for\
    \ each subscription.\nAudit from Azure CLI\nRun the following command for each subscription:\naz monitor diagnostic-settings\
    \ subscription list --subscription <subscription-id>\nEnsure that Administrative, Alert, Policy, and Security each have\
    \ a logs\nentry with enabled set to true in at least one setting with a destination\n(workspaceId, storageAccountId, eventHubAuthorizationRuleId,\
    \ or\nserviceBusRuleId).\nAudit from PowerShell\nRun the following command for each subscription:\nGet-AzSubscriptionDiagnosticSetting\
    \ -SubscriptionId <subscription-id> |\n Select-Object Name, WorkspaceId, StorageAccountId, EventHubAuthorizationRuleId,\n\
    ServiceBusRuleId, MarketplacePartnerId,\n @{Name = 'EnabledCategories'; Expression = { ($_.Log | Where-Object\n{ $_.Enabled\
    \ } | ForEach-Object { $_.Category }) -join ', ' }}\nEnsure that Administrative, Alert, Policy, and Security each appear\
    \ in\nEnabledCategories for at least one setting that shows a destination.\n Page 100\nAudit from Azure Portal\n1. Go\
    \ to Monitor.\n2. Select Activity log.\n3. Select Export Activity Logs.\n4. Select a Subscription.\n5. Note the name of\
    \ the Storage Account for the diagnostic setting.\n6. Navigate to Storage accounts.\n7. Click on the storage account name\
    \ noted in Step 5.\n8. Under Security + networking, click Encryption.\n9. Ensure Customer-managed keys is selected and\
    \ a key is set.\nAudit from Azure CLI\n1. Get storage account id configured with log profile:\naz monitor diagnostic-settings\
    \ subscription list --subscription <subscription id> -\n-query 'value[*].storageAccountId'\n2. Ensure the storage account\
    \ is encrypted with CMK:\naz storage account list --query \"[?name=='<Storage Account Name>']\"\nIn command output ensure\
    \ keySource is set to Microsoft.Keyvault and\nkeyVaultProperties is not set to null\nAudit from PowerShell\nGet-AzStorageAccount\
    \ -ResourceGroupName <resource group name> -Name <storage\naccount name>|select-object -ExpandProperty encryption|format-list\n\
    Ensure the value of KeyVaultProperties is not null or empty, and ensure\nKeySource is not set to Microsoft.Storage.\n\
    Audit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\n\
    associated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: fbb99e8e-e444-4da0-9ff1-75c92f5a85b2 - Name: 'Storage account\ncontaining the container with activity logs\
    \ must be encrypted with BYOK'\n Page 104"
  remediation: "Remediate from Azure Portal\n1. Go to Monitor.\n2. Click Activity log.\n3. Click Export Activity Logs.\n4.\
    \ Select a subscription.\n5. Click Edit setting next to a diagnostic setting that has a destination.\n6. Under Categories,\
    \ check Administrative, Alert, Policy, and\nSecurity.\n7. Click Save.\n8. Repeat steps 4-7 for each subscription.\nRemediate\
    \ from Azure CLI\nRun the following command for each subscription, using the name of the existing\ndiagnostic setting,\
    \ and add any other categories it already exports to the --logs list:\naz monitor diagnostic-settings subscription update\
    \ --subscription <subscription-id>\n--name <diagnostic-setting-name> --logs\n'[{\"category\":\"Administrative\",\"enabled\"\
    :true},{\"category\":\"Alert\",\"enabled\":true},\n{\"category\":\"Policy\",\"enabled\":true},{\"category\":\"Security\"\
    ,\"enabled\":true}]'\nRemediate from PowerShell\nRun the following commands for each subscription, using the name of the\
    \ existing\ndiagnostic setting, and add any other categories it already exports to the list:\n$logCategories = @()\nforeach\
    \ ($category in 'Administrative','Alert','Policy','Security') {\n $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject\
    \ -\nCategory $category -Enabled $true\n}\nUpdate-AzSubscriptionDiagnosticSetting -SubscriptionId <subscription-id> -Name\n\
    <diagnostic-setting-name> -Log $logCategories\nRemediate from Azure Portal\n1. Go to Monitor.\n2. Select Activity log.\n\
    3. Select Export Activity Logs.\n4. Select a Subscription.\n5. Note the name of the Storage Account for the diagnostic\
    \ setting.\n6. Navigate to Storage accounts.\n7. Click on the storage account.\n8. Under Security + networking, click\
    \ Encryption.\n9. Next to Encryption type, select Customer-managed keys.\n10. Complete the steps to configure a customer-managed\
    \ key for encryption of\nthe storage account.\nRemediate from Azure CLI\naz storage account update --name <name of the\
    \ storage account> --resource-group\n<resource group for a storage account> --encryption-key-source=Microsoft.Keyvault\
    \ -\n-encryption-key-vault <Key Vault URI> --encryption-key-name <KeyName> --encryptionkey-version <Key Version>\nRemediate\
    \ from PowerShell\nSet-AzStorageAccount -ResourceGroupName <resource group name> -Name <storage\naccount name> -KeyvaultEncryption\
    \ -KeyVaultUri <key vault URI> -KeyName <key name>"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Monitor.

      2. Click Activity log.

      3. Click Export Activity Logs.

      4. Select a subscription.

      5. Click Edit setting next to each diagnostic setting that has a destination.

      6. Ensure that Administrative, Alert, Policy, and Security are each

      checked in at least one of these diagnostic settings.

      7. Repeat steps 4-6 for each subscription.

      Audit from Azure CLI

      Run the following command for each subscription:

      az monitor diagnostic-settings subscription list --subscription <'
