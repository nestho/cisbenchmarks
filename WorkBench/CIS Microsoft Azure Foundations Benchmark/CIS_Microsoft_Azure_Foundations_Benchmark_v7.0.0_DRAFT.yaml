- id: '5.5'
  title: Ensure that a Dedicated Role is Assigned Permissions for Administering Resource Locks
  scoring: manual
  profile:
  - Level 2
  description: Resource locks prevent deletion or modification of a subscription, resource group, or resource regardless of
    a user's role. A dedicated role that grants only lock permissions, either the built-in Locks Contributor role or a custom
    role, lets designated administrators manage locks without holding Owner or User Access Administrator. Users who are set
    as subscription owners are able to make administrative changes to the subscriptions and move them into and out of Microsoft
    Entra ID.
  rationale: Outside a few specialized built-in roles, only Owner and User Access Administrator can create or delete locks,
    and both also control role assignments. Granting either role just to manage locks lets the holder grant themselves or
    anyone else any access within that scope, while the built-in Locks Contributor role or an equivalent custom role grants
    lock management alone. Permissions to move subscriptions in and out of a Microsoft Entra tenant must only be given to
    appropriate administrative personnel. A subscription that is moved into a Microsoft Entra tenant may be within a folder
    to which other users have elevated permissions. This prevents loss of data or unapproved changes of the objects within
    by potential bad actors.
  impact: Maintaining the dedicated role's assignments, and the custom role definition if one is used, adds administrative
    overhead at each scope where the role is assigned. Page 71 Subscriptions will need to have these settings turned off to
    be moved.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-inroles/security#locks-contributor
  - 1. https://learn.microsoft.com/en-us/azure/cost-managementbilling/manage/manage-azure-subscription-policy
  - 2. https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptionsassociated-directory
  page_start: 71
  audit_raw: "Audit from Azure Portal\n1. In the Azure portal, navigate to a subscription or resource group.\n2. Click Access\
    \ control (IAM).\n3. Click Role assignments, search for Locks Contributor, and review its\nassignments.\n4. Click Roles,\
    \ set Type to Custom role, and for each custom role click View in\nthe Details column and review its permissions.\n5.\
    \ For each custom role that qualifies, click Assignments and review the\nassignments.\n6. Ensure that at least one qualifying\
    \ role, either Locks Contributor or a\ncustom role that grants Microsoft.Authorization/locks/* or both\nMicrosoft.Authorization/locks/write\
    \ and\nMicrosoft.Authorization/locks/delete, is assigned to appropriate\nmembers.\n7. Repeat steps 1-6 for each subscription\
    \ or resource group.\nAudit from Azure CLI\nList the custom roles whose actions include a resource lock permission:\n\
    az role definition list --custom-role-only true --query\n\"[?permissions[?actions[?starts_with(@,\n'Microsoft.Authorization/locks')]]].{roleName:roleName,\n\
    actions:permissions[].actions, assignableScopes:assignableScopes}\" --output json\nList the assignments of the built-in\
    \ role and of each qualifying custom role:\naz role assignment list --role \"Locks Contributor\" --all --include-inherited\
    \ --\noutput table\naz role assignment list --role \"<custom-role-name>\" --all --include-inherited --\noutput table\n\
    Ensure that Locks Contributor, or a custom role whose actions include\nMicrosoft.Authorization/locks/* or both\nMicrosoft.Authorization/locks/write\
    \ and\nMicrosoft.Authorization/locks/delete, is assigned only to appropriate\nmembers.\n Page 72\nAudit from PowerShell\n\
    List the custom roles whose actions include a resource lock permission:\nGet-AzRoleDefinition -Custom | Where-Object {\
    \ $_.Actions -like\n'Microsoft.Authorization/locks*' } | Format-Table Name, Id, Actions,\nAssignableScopes\nList the assignments\
    \ of the built-in role and of each qualifying custom role:\nGet-AzRoleAssignment -RoleDefinitionName \"Locks Contributor\"\
    \nGet-AzRoleAssignment -RoleDefinitionName \"<custom-role-name>\"\nEnsure that Locks Contributor, or a custom role whose\
    \ actions include\nMicrosoft.Authorization/locks/* or both\nMicrosoft.Authorization/locks/write and\nMicrosoft.Authorization/locks/delete,\
    \ is assigned only to appropriate\nmembers.\n Page 73\nAudit from Azure Portal\n1. From the Azure Portal Home select the\
    \ portal menu\n2. Select Subscriptions\n3. In the horizontal menu select Manage Policies\n4. Ensure Subscription leaving\
    \ Microsoft Entra tenant and\nSubscription entering Microsoft Entra tenant are set to Permit\nno one"
  remediation: "Remediate from Azure Portal\nTo use the built-in role, assign Locks Contributor by following steps 17-26 below,\n\
    selecting Locks Contributor in step 19. To create a custom role instead:\n1. In the Azure portal, navigate to a subscription\
    \ or resource group.\n2. Click Access control (IAM).\n3. Click + Add.\n4. Click Add custom role.\n5. In the Custom role\
    \ name field enter Resource Lock Administrator.\n6. In the Description field enter Can Administer Resource Locks.\n7.\
    \ For Baseline permissions select Start from scratch.\n8. Click Next.\n9. Click Add permissions.\n10. In the Search for\
    \ a permission box, type\nMicrosoft.Authorization/locks.\n11. Click the result.\n12. Check the box next to Permission.\n\
    13. Click Add.\n14. Click Review + create.\n15. Click Create.\n16. Click OK.\n17. Click + Add.\n18. Click Add role assignment.\n\
    19. In the Search by role name, description, permission, or ID\nbox, type Resource Lock Administrator.\n20. Select the\
    \ role.\n21. Click Next.\n22. Click + Select members.\n23. Select appropriate members.\n24. Click Select.\n25. Click Review\
    \ + assign.\n26. Click Review + assign again.\n27. Repeat steps 1-26 for each subscription or resource group requiring\n\
    remediation.\n Page 74\nRemediate from Azure CLI\nTo use the built-in role, assign it:\naz role assignment create --assignee\
    \ <object-id> --role \"Locks Contributor\" --scope\n<scope>\nTo create a custom role at a management group instead, then\
    \ assign it:\naz role definition create --role-definition '{\"Name\":\"Resource Lock\nAdministrator\",\"Description\"\
    :\"Can Administer Resource\nLocks\",\"Actions\":[\"Microsoft.Authorization/locks/*\"],\"AssignableScopes\":[\"/provider\n\
    s/Microsoft.Management/managementGroups/<management-group-name>\"]}'\naz role assignment create --assignee <object-id>\
    \ --role \"Resource Lock\nAdministrator\" --scope <scope>\nRemediate from PowerShell\nTo use the built-in role, assign\
    \ it:\nNew-AzRoleAssignment -ObjectId <object-id> -RoleDefinitionName \"Locks Contributor\"\n-Scope <scope>\nTo create\
    \ a custom role at a management group instead, then assign it:\n$role = Get-AzRoleDefinition \"User Access Administrator\"\
    \n$role.Id = $null\n$role.Name = \"Resource Lock Administrator\"\n$role.Description = \"Can Administer Resource Locks\"\
    \n$role.Actions.Clear()\n$role.Actions.Add(\"Microsoft.Authorization/locks/*\")\n$role.AssignableScopes.Clear()\n# Scope\
    \ the role to a management group\n$role.AssignableScopes.Add(\"/providers/Microsoft.Management/managementGroups/<manag\n\
    ement-group-name>\")\nNew-AzRoleDefinition -Role $role\nGet-AzRoleDefinition \"Resource Lock Administrator\"\nNew-AzRoleAssignment\
    \ -ObjectId <object-id> -RoleDefinitionName \"Resource Lock\nAdministrator\" -Scope <scope>\nRemediate from Azure Portal\n\
    1. From the Azure Portal Home select the portal menu\n2. Select Subscriptions\n3. In the horizontal menu select Manage\
    \ Policies\n4. Set Subscription leaving Microsoft Entra tenant and\nSubscription entering Microsoft Entra tenant to Permit\
    \ no one\n5. Click Save changes\n Page 78"
