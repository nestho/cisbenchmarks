    \ account list --query \"[].{name:name, resourceGroup:resourceGroup,\nenableHttpsTrafficOnly:enableHttpsTrafficOnly}\"\
    \ --output table\nEnsure that enableHttpsTrafficOnly is true for each storage account.\nAudit from PowerShell\nRun the\
    \ following command to list each storage account and its secure transfer setting:\nGet-AzStorageAccount | Select-Object\
