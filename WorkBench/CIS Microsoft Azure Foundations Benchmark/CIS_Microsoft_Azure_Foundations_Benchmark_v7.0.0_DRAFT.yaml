- id: '5.10'
  title: Ensure Emergency Access Accounts Can Regain Azure Resource Access
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Entra ID roles grant no Azure RBAC, so a tenant can lose all ability to manage its subscriptions
    while Global Administrators remain. A Global Administrator restores access by setting Access management for Azure resources
    to Yes, which grants root-scope access. Maintain emergency access accounts (aka "break-glass accounts") and a tested recovery
    procedure.
  rationale: Because Entra ID and Azure RBAC are secured separately, a tenant can reach a state where no account holds Owner
    or User Access Administrator at any scope, after the last privileged account leaves or root-scope access is removed for
    least privilege. If no Global Administrator can sign in, no one can elevate access, and recovery depends on Microsoft
    support.
  impact: Emergency access accounts are highly privileged standing credentials, so their sign-ins must raise alerts to keep
    them from becoming an unguarded entry point. Each recovery and test temporarily grants control over every subscription
    at the root scope, so it must end by removing that elevation. Conditional Access exclusion applies only where Microsoft
    Entra ID P1 or higher is licensed. Page 86
  references:
  - 1. https://learn.microsoft.com/entra/identity/role-based-access-control/securityemergency-access
  - 2. https://learn.microsoft.com/azure/role-based-access-control/elevate-accessglobal-admin
  page_start: 86
  audit_raw: "Note: Enumerating Azure role assignments at the root scope (/) requires read access\nthere — a Global Administrator\
    \ can read elevated-access assignments, or the auditor\nelevates access to enumerate them and removes that elevation afterward,\
    \ discounting\ntheir own temporary User Access Administrator assignment at / from the results.\nAudit from Azure Portal\n\
    1. In the Microsoft Entra admin center, go to Users and confirm at least two\ndedicated emergency access accounts exist\
    \ that are cloud-only (on-premises\nsync not enabled), not assigned to named individuals, and hold the Global\nAdministrator\
    \ role as an active, permanent assignment (not PIM-eligible).\n2. Open the recovery runbook and confirm it documents the\
    \ elevate-access\nrecovery and records a successful test within the last 90 days.\n3. Confirm an alert rule is configured\
    \ to fire on any sign-in by each emergency\naccess account.\n4. In the Azure portal, go to Management groups, select the\
    \ Tenant Root Group,\nthen Access control (IAM) > Role assignments, and confirm no\nemergency access account holds a standing\
    \ Owner or User Access\nAdministrator assignment. Within the retained (or exported) log period,\nconfirm each past elevate-access\
    \ entry was followed by its removal — in\nMicrosoft Entra ID > Monitoring > Audit logs (Service filter Azure\nRBAC (Elevated\
    \ Access), currently in preview) or in Monitor > Activity\nlog with Activity set to Directory Activity (operation Assigns\
    \ the\ncaller to User Access Administrator role).\n5. For each Conditional Access policy that blocks or restricts sign-in,\
    \ confirm the\nemergency access accounts are excluded (for example through a dedicated\ngroup); report-only policies need\
    \ no exclusion.\nThe recommendation passes when at least two cloud-only emergency access accounts\nwith active, permanent\
    \ Global Administrator assignments and a runbook tested within\n90 days are present, sign-in alerting is configured for\
    \ each account, each account is\nexcluded from the Conditional Access policies that block or restrict sign-in, and no\n\
    emergency access account holds a standing Owner or User Access\nAdministrator assignment at the root scope (/) or the\
    \ Tenant Root Group,\ndiscounting any temporary elevation held by the auditor.\nAudit from Azure CLI\nList any standing\
    \ privileged assignments at the root scope and the Tenant Root Group\nmanagement group (its ID equals the tenant ID):\n\
    \ Page 87\naz role assignment list --scope \"/\" --query \"[?roleDefinitionName=='Owner' ||\nroleDefinitionName=='User\
    \ Access Administrator'].{principal:principalName,\nrole:roleDefinitionName, scope:scope}\" --output table\naz role assignment\
    \ list --scope\n\"/providers/Microsoft.Management/managementGroups/<tenant-root-group-id>\" --query\n\"[?roleDefinitionName=='Owner'\
    \ || roleDefinitionName=='User Access\nAdministrator'].{principal:principalName, role:roleDefinitionName, scope:scope}\"\
    \ --\noutput table\nNeither command should list an emergency access account; disregard the auditor's own\ntemporary User\
    \ Access Administrator entry at /.\nAudit from PowerShell\nList any standing privileged assignments at the root scope\
    \ and the Tenant Root Group\nmanagement group:\nGet-AzRoleAssignment -Scope \"/\" | Where-Object { $_.RoleDefinitionName\
    \ -in \"Owner\",\n\"User Access Administrator\" }\nGet-AzRoleAssignment -Scope\n\"/providers/Microsoft.Management/managementGroups/<tenant-root-group-id>\"\
    \ | WhereObject { $_.RoleDefinitionName -in \"Owner\", \"User Access Administrator\" }\nNeither list should include an\
    \ emergency access account; disregard the auditor's own\ntemporary User Access Administrator entry at /.\n Page 88"
  remediation: 'Remediate from Azure Portal

    1. Create at least two cloud-only emergency access accounts (not synchronized

    from on-premises) and assign them the Global Administrator role as an active,

    permanent assignment (not PIM-eligible), following Microsoft''s emergency

    access account guidance, and store their credentials under dual control.

    2. Configure monitoring so that every sign-in by an emergency access account

    raises a high-priority alert.

    3. Exclude the emergency access accounts (for example through a dedicated

    group) from every Conditional Access policy that blocks or restricts sign-in;

    report-only policies need no exclusion.

    4. Document the recovery procedure. During a recovery, an emergency access

    account signs in, goes to Microsoft Entra ID > Manage > Properties,

    sets Access management for Azure resources to Yes, then signs out

    and back in. It assigns Owner at the specific subscription or management group

    being recovered — never the Tenant Root Group — to the account that will own

    it, restores normal access, then sets Access management for Azure

    resources back to No (removing the root-scope User Access

    Administrator assignment) and signs out.

    5. Test the procedure at least every 90 days and record each result.

    Remediate from Azure CLI

    An emergency access account elevates access, then signs out and back in. It assigns

    Owner at the subscription or management group being recovered (never the Tenant

    Root Group), then removes the elevation afterward:

    az rest --method post --url "/providers/Microsoft.Authorization/elevateAccess?apiversion=2016-07-01"

    az role assignment create --assignee "<recovery-owner-object-id>" --role "Owner" --

    scope "/subscriptions/<subscription-id>"

    az role assignment delete --assignee "<emergency-account-object-id>" --role "User

    Access Administrator" --scope "/"

    Remediate from PowerShell

    After the emergency access account elevates access in the portal and signs out and

    back in, it assigns Owner at the subscription or management group being recovered

    (never the Tenant Root Group), then removes the elevation:

    New-AzRoleAssignment -ObjectId "<recovery-owner-object-id>" -RoleDefinitionName

    "Owner" -Scope "/subscriptions/<subscription-id>"

    Remove-AzRoleAssignment -SignInName "<emergency-account-upn>" -RoleDefinitionName

    "User Access Administrator" -Scope "/"'
