- id: 8.1.12
  title: Ensure that non-deprecated Microsoft Cloud Security Benchmark policies are not set to 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The Microsoft Cloud Security Benchmark (MCSB) is an Azure Policy initiative automatically assigned to all
    subscriptions that evaluates resource configurations against Microsoft security best practice recommendations. Policies
    set to a Disabled effect are not evaluated, removing visibility into the associated recommendation. Microsoft deprecates
    policies when controls are superseded or no longer applicable; deprecated policies are set to Disabled by default and
    require no corrective action. Non-deprecated policies should not be set to Disabled without a documented organizational
    exception. Note: A policy is considered deprecated when its definition name is prefixed with [Deprecated]: in the Azure
    Policy portal and its policyDeprecated metadata property is true.'
  rationale: 'Disabling a non-deprecated MCSB policy prevents Microsoft Defender for Cloud from evaluating the associated
    control and surfacing relevant recommendations, creating an undetected gap in security posture visibility. Exceptions
    allowing non-deprecated MCSB policies to be disabled can be reasonably made but each exception should be documented and
    reconsidered periodically. Examples of reasonable exceptions: • A compensating control exists which cannot be evaluated
    by the policy • A scope exemption exists for certain resources within the evaluated scope • The policy effect conflicts
    with architecturally deliberate choices • The resource type is not used in the evaluated scope Deprecated policies set
    to Disabled reflect an intentional Microsoft lifecycle decision and are not a finding.'
  impact: MCSB policies default to an Audit or AuditIfNotExists effect, which evaluates but does not enforce recommendations.
    Re-enabling a non-deprecated disabled policy restores evaluation only; no enforcement action occurs unless the effect
    is subsequently changed to Deny or DeployIfNotExists by the administrator. Page 377
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/security-policyconcept
  - 2. https://learn.microsoft.com/en-us/azure/defender-for-cloud/implement-securityrecommendations
  page_start: 377
  audit_raw: "Audit from Azure Portal\nPerform the following steps for each Management Group or Subscription:\n1. From Azure\
    \ Home, select the Portal Menu.\n2. Select Microsoft Defender for Cloud.\n3. Under Management, select Environment settings.\n\
    4. Click on the appropriate Management Group or Subscription.\n5. Click Security policies in the left column.\n6. Click\
    \ Microsoft cloud security benchmark.\n7. Click Add filter, select Effect, check the Disabled box, and click Apply.\n\
    8. For each policy returned, confirm whether the definition is deprecated:\n• Deprecated definitions display a [Deprecated]:\
    \ name prefix.\n• Deprecated policies set to Disabled are expected and compliant.\n9. Verify that no non-deprecated policies\
    \ are displayed with a Disabled effect.\n10. Repeat steps 1–9 for each Management Group or Subscription.\nCross-reference\
    \ each overridden policy against current documented exceptions and the\nAzure Policy definitions list to confirm deprecation\
    \ status before treating the result as a\nfinding.\n Page 378"
  remediation: 'No remediation is required for deprecated MCSB policies set to Disabled.

    For non-deprecated policies found to be set to Disabled, restore the effect to its

    default value or document an approved organizational exception.

    Remediate from Azure Portal

    1. From Azure Home, select the Portal Menu.

    2. Select Microsoft Defender for Cloud.

    3. Under Management, select Environment settings.

    4. Click on the appropriate Management Group or Subscription.

    5. Click Security policies in the left column.

    6. Click Microsoft cloud security benchmark.

    7. Click Add filter, select Effect, check Disabled, and click Apply.

    8. Confirm the displayed policy is not deprecated before proceeding.

    9. Click the blue ellipsis ... to the right of the policy name and select Manage effect

    and parameters.

    10. Under Policy effect, select Audit.

    11. Click Save, then click Refresh.

    12. Repeat steps 8–11 for each non-deprecated disabled policy.

    13. Repeat steps 1–12 for each Management Group or Subscription requiring

    remediation.'
  checks:
