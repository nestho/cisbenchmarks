- id: 8.3.9
  title: Ensure Automatic Key Rotation is Enabled within Azure Key Vault
  scoring: scored
  profile:
  - Level 2
  description: Automated cryptographic key rotation in Key Vault allows users to configure Key Vault to automatically generate
    a new key version at a specified frequency. A key rotation policy can be defined for each individual key.
  rationale: 'Automatic key rotation reduces risk by ensuring that keys are rotated without manual intervention. Azure and
    NIST recommend that keys be rotated every two years or less. Refer to ''Table 1: Suggested cryptoperiods for key types''
    on page 46 of the following document for more information: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf.'
  impact: There is an additional cost for each scheduled key rotation. Page 439
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-keyrotation
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/customer-managedkeys-overview#update-the-key-version
  page_start: 439
  audit_raw: "Requisite Permissions - read section overview!\nRBAC Role = Key Vault Reader\nAccess policy permission = Rotation\
    \ Policy Operations: Get Rotation Policy\nAudit from Azure Portal\n1. Go to Key Vaults.\n2. Select a Key Vault.\n3. Under\
    \ Objects, select Keys.\n4. Select a key.\n5. From the top row, select Rotation policy.\n6. Verify that Enable auto rotation\
    \ is set to Enabled.\n7. Verify that Rotation time is set to an appropriate value.\n8. Repeat steps 1-7 for each Key Vault\
    \ and key.\nAudit from Azure CLI\nRun the following command:\naz keyvault key rotation-policy show --vault-name <vault-name>\
    \ --name <key-name>\nVerify that lifetimeActions contains an action of type Rotate whose trigger sets\ntimeAfterCreate\
    \ or timeBeforeExpiry to an appropriate value. A\ntimeBeforeExpiry trigger also requires an expiryTime in the policy attributes.\n\
    Audit from PowerShell\nRun the following command:\nGet-AzKeyVaultKeyRotationPolicy -VaultName <vault-name> -Name <key-name>\n\
    Verify that LifetimeActions contains an action of Rotate with TimeAfterCreate\nor TimeBeforeExpiry set to an appropriate\
    \ value. A TimeBeforeExpiry trigger\nalso requires ExpiresIn to be set.\nAudit from Azure Policy\nIf referencing a digital\
    \ copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing\
    \ a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: d8cf8476-a2ec-4916-896e-992351803c44 - Name: 'Keys should have\na rotation policy ensuring that their rotation\
    \ is scheduled within the specified\nnumber of days after creation.'\n Page 440"
  remediation: "Requisite Permissions - read section overview!\nRBAC Role = Key Vault Crypto Officer\nAccess policy permission\
    \ = Rotation Policy Operations: Set Rotation Policy\nNote: Azure CLI and PowerShell use the ISO8601 duration format for\
    \ time spans. The\nformat is P<timespanInISO8601Format>(Y,M,D). The leading P is required and is\nreferred to as period.\
    \ The (Y,M,D) are for the duration of Year, Month, and Day,\nrespectively. A time frame of 2 years, 2 months, 2 days would\
    \ be P2Y2M2D. For Azure\nCLI and PowerShell, it is easiest to supply the policy flags in a .json file, for\nexample:\n\
    {\n \"lifetimeActions\": [\n {\n \"trigger\": {\n \"timeAfterCreate\": \"P<timespanInISO8601Format>(Y,M,D)\",\n \"timeBeforeExpiry\"\
    \ : null\n },\n \"action\": {\n \"type\": \"Rotate\"\n }\n },\n {\n \"trigger\": {\n \"timeBeforeExpiry\" : \"P<timespanInISO8601Format>(Y,M,D)\"\
    \n },\n \"action\": {\n \"type\": \"Notify\"\n }\n }\n ],\n \"attributes\": {\n \"expiryTime\": \"P<timespanInISO8601Format>(Y,M,D)\"\
    \n }\n}\nRemediate from Azure Portal\n1. Go to Key Vaults.\n2. Select a Key Vault.\n3. Under Objects, select Keys.\n4.\
    \ Select a key.\n5. From the top row, select Rotation policy.\n6. Select an appropriate Expiry time.\n7. Set Enable auto\
    \ rotation to Enabled.\n Page 441\n8. Set an appropriate Rotation option and Rotation time.\n9. Optionally, set a Notification\
    \ time.\n10. Click Save.\n11. Repeat steps 1-10 for each Key Vault and Key.\nRemediate from Azure CLI\nRun the following\
    \ command for each key to enable automatic rotation:\naz keyvault key rotation-policy update --vault-name <vault-name>\
    \ --name <key-name>\n--value <path/to/policy.json>\nRemediate from PowerShell\nRun the following command for each key\
    \ to enable automatic rotation:\nSet-AzKeyVaultKeyRotationPolicy -VaultName <vault-name> -Name <key-name> -\nPolicyPath\
    \ <path/to/policy.json>"
  checks:
  - type: manual_review
    info: 'Requisite Permissions - read section overview!

      RBAC Role = Key Vault Reader

      Access policy permission = Rotation Policy Operations: Get Rotation Policy

      Audit from Azure Portal

      1. Go to Key Vaults.

      2. Select a Key Vault.

      3. Under Objects, select Keys.

      4. Select a key.

      5. From the top row, select Rotation policy.

      6. Verify that Enable auto rotation is set to Enabled.

      7. Verify that Rotation time is set to an appropriate value.

      8. Repeat steps 1-7 for each Key Vault and key.

      Audit from Azure CLI

      Run'
    severity: medium
- id: 8.3.10
  title: Ensure that Azure Key Vault Managed HSM is Used when Required
  scoring: manual
  profile:
  - Level 2
  description: 'Key Vault Premium uses multitenant HSMs that Microsoft operates; Managed HSM is a single-tenant HSM pool with
    a customer-owned security domain. Managed HSM and Premium key versions on HSM Platform 2 are FIPS 140-3 Level 3 validated;
    Premium key versions on HSM Platform 1 are FIPS 140-2 Level 2. Note: Although this recommendation can be audited by command,
    it is Manual because it applies only where a regulatory or contractual requirement mandates a dedicated, customer-controlled
    HSM.'
  rationale: On Key Vault Premium, the HSMs and the root of trust are shared and operated by Microsoft, and cryptographic
    operations are throttled at multitenant limits. Where a requirement mandates key sovereignty, single tenancy, or a customer-owned
    root of trust, keys held in Premium do not meet it, whatever their FIPS validation level.
  impact: 'Managed HSM is billed hourly per HSM pool plus monthly per HSM-protected key version; see https://azure.microsoft.com/pricing/details/key-vault/.
    Billing continues through the soft-delete retention period until the HSM is purged. The customer holds the security domain:
    without it and its quorum of wrapping keys, every key in the HSM is unrecoverable after a disaster or a purge. Page 444'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management
  - 2. https://learn.microsoft.com/en-us/azure/security/fundamentals/key-managementchoose
  page_start: 444
  audit_raw: "Requisite Permissions - read section overview!\nListing Managed HSMs needs only Azure Resource Manager read\
    \ access. Listing the\nkeys in a Managed HSM needs the Managed HSM local RBAC role Managed HSM\nCrypto Auditor.\nAudit\
    \ from Azure CLI\nRun the following command to list Managed HSMs:\naz keyvault list --resource-type hsm --query \"[].{name:name,\n\
    resourceGroup:resourceGroup, location:location}\"\nFor each Managed HSM, run the following command to list its keys:\n\
    az keyvault key list --hsm-name <hsm-name>\nWhere a requirement mandates a dedicated HSM, verify that at least one Managed\n\
    HSM is returned and that the keys in scope of the requirement are listed in it.\n Page 445"
  remediation: 'Requisite Permissions - read section overview!

    Creating a Managed HSM needs Azure Resource Manager permissions. Downloading

    the security domain to activate it needs the Managed HSM local RBAC role Managed

    HSM Administrator, which the administrators named at creation hold.

    Remediate from Azure CLI

    Run the following command to store the object ID of the signed-in user, or prepare a

    space-separated list of administrator object IDs instead:

    oid=$(az ad signed-in-user show --query id --output tsv)

    Run the following command to create a Managed HSM:

    az keyvault create --resource-group <resource-group> --hsm-name <hsm-name> --

    location <location> --retention-days <retention-days> --administrators $oid

    The HSM must then be activated by downloading its security domain, encrypted with at

    least three and at most ten RSA public keys. Generate each key pair, for example with

    OpenSSL:

    openssl req -newkey rsa:2048 -nodes -keyout cert_1.key -x509 -days 365 -out

    cert_1.cer

    As an HSM administrator, run the following command to download the security domain

    and activate the Managed HSM, setting --sd-quorum to the number of private keys

    required to decrypt it:

    az keyvault security-domain download --hsm-name <hsm-name> --sd-wrapping-keys

    <cert-1>.cer <cert-2>.cer <cert-3>.cer --sd-quorum <quorum> --security-domain-file

    <hsm-name>-SD.json

    Store the security domain file and the RSA private keys offline under separate custody;

    they are required for disaster recovery.'
  checks:
  - type: manual_review
    info: 'Requisite Permissions - read section overview!

      Listing Managed HSMs needs only Azure Resource Manager read access. Listing the

      keys in a Managed HSM needs the Managed HSM local RBAC role Managed HSM

      Crypto Auditor.

      Audit from Azure CLI

      Run the following command to list Managed HSMs:

      az keyvault list --resource-type hsm --query "[].{name:name,

      resourceGroup:resourceGroup, location:location}"

      For each Managed HSM, run the following command to list its keys:

      az keyvault key list --hsm-name <hsm-nam'
    severity: medium
- id: 8.3.11
  title: Ensure Certificate 'Validity Period (in months)' is Less Than or Equal to '12'
  scoring: scored
  profile:
  - Level 1
  description: Restrict the validity period of certificates stored in Azure Key Vault to 12 months or less.
  rationale: Limiting certificate validity reduces the risk of misuse if compromised and helps ensure timely renewal, improving
    security and reliability.
  impact: Minor administrative effort required to ensure certificate renewal and lifecycle management. Page 448
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
  - 2. https://learn.microsoft.com/en-us/cli/azure/keyvault
  page_start: 448
  audit_raw: "Requisite Permissions - read section overview!\nRBAC Role = Key Vault Reader\nAccess policy permissions = Certificates:\
    \ List, Get\nAudit from Azure Portal\n1. Go to Key vaults.\n2. Click the name of a key vault.\n3. Under Objects, click\
    \ Certificates.\n4. Click the name of a certificate.\n5. Click Issuance Policy.\n6. Verify that Validity Period (in months)\
    \ is set to 12 or less.\n7. Repeat steps 1-6 for each key vault and certificate.\nAudit from Azure CLI\nRun the following\
    \ command to list key vaults:\naz keyvault list --resource-type vault\nFor each key vault, run the following command to\
    \ list certificates:\naz keyvault certificate list --vault-name <key-vault-name>\nFor each certificate, run the following\
    \ command to get the certificate policy's\nvalidityInMonths setting:\naz keyvault certificate show --id <certificate-id>\
    \ --query\npolicy.x509CertificateProperties.validityInMonths\nVerify that 12 or less is returned.\nAudit from PowerShell\n\
    Run the following command to list key vaults:\nGet-AzKeyVault\nFor each key vault, run the following command to list certificates:\n\
    Get-AzKeyVaultCertificate -VaultName <key-vault-name>\nFor each certificate, run the following command to get the certificate\
    \ policy's\nValidityInMonths setting:\n Page 449\n(Get-AzKeyVaultCertificatePolicy -VaultName <key-vault-name> -Name <certificatename>).ValidityInMonths\n\
    Verify that 12 or less is returned.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking\
    \ a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can\
    \ search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 0a075868-4c26-42ef-914c-5bc007359560 - Name: 'Certificates\nshould have the specified maximum validity period'"
  remediation: 'Requisite Permissions - read section overview!

    RBAC Role = Key Vault Certificates Officer

    Access policy permissions = Certificates: List, Get, Update

    Remediate from Azure Portal

    1. Go to Key vaults.

    2. Click the name of a key vault.

    3. Under Objects, click Certificates.

    4. Click the name of a certificate.

    5. Click Issuance Policy.

    6. Set Validity Period (in months) to an integer between 1 and 12,

    inclusive.

    7. Click Save.

    8. Repeat steps 1-7 for each key vault and certificate requiring remediation.

    Remediate from PowerShell

    For each certificate requiring remediation, run the following command to set

    ValidityInMonths to an integer between 1 and 12, inclusive:

    Set-AzKeyVaultCertificatePolicy -VaultName $vault.VaultName -Name <certificatename> -ValidityInMonths <validity-in-months>'
  checks:
  - type: manual_review
    info: 'Requisite Permissions - read section overview!

      RBAC Role = Key Vault Reader

      Access policy permissions = Certificates: List, Get

      Audit from Azure Portal

      1. Go to Key vaults.

      2. Click the name of a key vault.

      3. Under Objects, click Certificates.

      4. Click the name of a certificate.

      5. Click Issuance Policy.

      6. Verify that Validity Period (in months) is set to 12 or less.

