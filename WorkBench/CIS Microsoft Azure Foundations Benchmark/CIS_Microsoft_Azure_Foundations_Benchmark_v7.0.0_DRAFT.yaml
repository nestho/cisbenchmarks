- id: 8.3.1
  title: Ensure that the Expiration Date is Set for all Keys in Key Vaults using RBAC
  scoring: scored
  profile:
  - Level 1
  description: 'Ensure that all Keys in Azure Key Vaults using Role Based Access Control (RBAC) have an expiration date set.
    Note: The audit commands require data-plane access to each Key Vault in addition to the management-plane Reader role.
    Without data-plane access these commands return empty results silently.'
  rationale: The Azure Key Vault enables users to store and use cryptographic keys within the Microsoft Azure environment.
    The exp (expiration date) attribute identifies the expiration date on or after which the key MUST NOT be used for encryption
    of new data, wrapping of new keys, and signing. By default, keys never expire. It is thus recommended that keys be rotated
    in the key vault and set an explicit expiration date for all keys to help enforce the key rotation. This ensures that
    the keys cannot be used beyond their assigned lifetimes.
  impact: Keys cannot be used beyond their assigned expiration dates respectively. Keys need to be rotated periodically wherever
    they are used. Page 404
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/basic-concepts
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/about-keys-secretscertificates
  page_start: 404
  audit_raw: "Requisite RBAC Permissions for Keys - read section overview!\nAudit Role = Key Vault Crypto User\nAudit from\
    \ Azure Portal\n1. Go to Key vaults.\n2. For each Key vault, under Objects select, Keys.\n3. In the main pane, ensure\
    \ that the status of the key is enabled.\n4. For each enabled key, ensure that an appropriate Expiration date is set.\n\
    Audit from Azure CLI\nGet a list of all the key vaults in your Azure environment by running the following\ncommand:\n\
    az keyvault list\nThen for each key vault listed ensure that the output of the below command contains\nKey ID (kid), enabled\
    \ status as true and Expiration date (expires) is not empty or\nnull:\naz keyvault key list --vault-name <VaultName> --query\n\
    '[*].{\"kid\":kid,\"enabled\":attributes.enabled,\"expires\":attributes.expires}'\nAudit from PowerShell\nRetrieve a list\
    \ of Azure Key Vaults:\nGet-AzKeyVault\nFor each Key vault run the following command to determine which vaults are configured\n\
    to use RBAC.\n(Get-AzKeyVault -VaultName <Vault Name>).EnableRbacAuthorization\nFor each Key vault with the EnableRbacAuthorization\
    \ setting set to True, run the\nfollowing command.\nGet-AzKeyVaultKey -VaultName <Vault Name> | Where-Object { $_.Enabled\
    \ -and -not\n$_.Expires }\nThis returns keys where Expires setting is not configured with a value and the\nEnabled setting\
    \ is set to True.\nTo audit at scale Enumerates ALL Key Vaults in the CURRENT subscription context\nonly. Does NOT cover\
    \ the entire tenant unless you loop through all subscriptions. Uses\nARM (Get-AzResource) to reliably read enableRbacAuthorization.\n\
    \ Page 405\n$vaults = Get-AzResource -ResourceType \"Microsoft.KeyVault/vaults\" | ForEach-Object\n{\n $kv = Get-AzResource\
    \ -ResourceId $_.ResourceId -ExpandProperties\n if ($kv.Properties.enableRbacAuthorization -eq $true) {\n [PSCustomObject]@{\n\
    \ VaultName = $kv.Name\n ResourceGroup = $kv.ResourceGroupName\n EnableRbacAuthorization = $kv.Properties.enableRbacAuthorization\n\
    \ SubscriptionId = $kv.SubscriptionId\n }\n }\n}\nRetrieves ALL keys in EACH RBAC-enabled vault in the CURRENT subscription.\
    \ This\ncan be very heavy in large environments (no filtering at API level). Returns ONLY\nviolations: enabled secrets\
    \ WITHOUT expiration.\nforeach ($vault in $vaults) {\n Get-AzKeyVaultKey -VaultName $vault.VaultName |\n Where-Object\
    \ { $_.Enabled -eq $true -and $_.Expires -eq $null } |\n Select-Object @{Name=\"VaultName\";Expression={$vault.VaultName}},\
    \ Name, Enabled,\nExpires\n}\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy\
    \ ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy\
    \ IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n• Policy ID:\
    \ 152b15f7-8e1f-4c1f-ab71-8c010ba5dbc0 - Name: 'Key Vault keys\nshould have an expiration date'\n Page 406"
  remediation: 'Requisite RBAC Permissions for Keys - read section overview!

    Remediation Role = Key Vault Crypto Officer

    Remediate from Azure Portal

    1. Go to Key vaults.

    2. For each Key vault, under Objects, select Keys.

    3. In the main pane, ensure that the status of the key(s) is Enabled.

    4. Click on the Key without Expiration date.

    5. Click the checkbox Set expiration date and set an appropriate

    Expiration date on the Key.

    6. Click Apply.

    Remediate from Azure CLI

    Update the Expiration date for the key using the below command:

    az keyvault key set-attributes --name <keyName> --vault-name <vaultName> --expires

    Y-m-d''T''H:M:S''Z''

    Remediate from PowerShell

    Set-AzKeyVaultKeyAttribute -VaultName <VaultName> -Name <KeyName> -Expires

    <DateTime>'
  checks:
  - type: manual_review
    info: 'Requisite RBAC Permissions for Keys - read section overview!

      Audit Role = Key Vault Crypto User

