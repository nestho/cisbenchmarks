- id: 6.1.1.4
  title: Ensure that Logging for Azure Key Vault is 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: A key vault exports resource logs only through a diagnostic setting, which captures the AuditEvent log of vault
    requests through the audit category group, the allLogs category group, or the AuditEvent category. allLogs also adds AzurePolicyEvaluationDetails,
    which is optional because it records Azure Policy evaluations rather than vault requests.
  rationale: Monitoring how and when key vaults are accessed, and by whom, enables an audit trail of interactions with confidential
    information, keys, and certificates managed by Azure Key Vault. Enabling logging for Key Vault saves information in a
    user provided destination of either an Azure storage account or Log Analytics workspace. The same destination can be used
    for collecting logs for multiple Key Vaults.
  impact: 'The destination bills for the exported logs: ingestion and retention charges apply in a Log Analytics workspace,
    and storage or throughput charges apply to a storage account or event hub. Page 107'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/howto-logging
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/monitor-key-vaultreference#resource-logs
  page_start: 107
  audit_raw: "Audit from Azure Portal\n1. Go to Key vaults.\n2. Click the name of a key vault.\n3. Under Monitoring, click\
    \ Diagnostic settings.\n4. Click Edit setting next to a diagnostic setting.\n5. Ensure that a destination is configured.\n\
    6. Ensure that audit or allLogs is checked under Category groups, or that\nthe individual category for AuditEvent is checked.\n\
    7. Repeat steps 2-6 for each key vault.\nAudit from Azure CLI\nList key vaults:\naz keyvault list --query \"[].id\" --output\
    \ tsv\nFor each vault, list its diagnostic settings:\naz monitor diagnostic-settings list --resource <key-vault-resource-id>\n\
    Ensure that at least one setting has a destination (workspaceId,\nstorageAccountId, eventHubAuthorizationRuleId, or\n\
    marketplacePartnerId) and an enabled logs entry for the audit or allLogs\ncategory group or the AuditEvent category.\n\
    Audit from PowerShell\nList key vaults:\nGet-AzKeyVault | Select-Object VaultName, ResourceId\nFor each vault, list its\
    \ diagnostic settings:\nGet-AzDiagnosticSetting -ResourceId <key-vault-resource-id> |\n Select-Object Name, WorkspaceId,\
    \ StorageAccountId, EventHubAuthorizationRuleId,\nMarketplacePartnerId,\n @{Name = 'EnabledLogs'; Expression = { ($_.Log\
    \ | Where-Object\n{ $_.Enabled } | ForEach-Object { if ($_.CategoryGroup) { $_.CategoryGroup } else\n{ $_.Category } })\
    \ -join ', ' }}\nEnsure that at least one setting shows a destination and EnabledLogs containing\naudit, allLogs, or AuditEvent.\n\
    Audit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\n\
    associated Policy definition in Azure.\n Page 108\nIf referencing a printed copy, you can search Policy IDs from this\
    \ URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n• Policy ID: cf820ca0-f99e-4f3e-84fb-66e913812d21\
    \ - Name: 'Resource logs in\nKey Vault should be enabled'\nThis Policy passes when any resource log category is enabled,\
    \ so it does not confirm\nthat AuditEvent is collected; confirm that with the Azure CLI or PowerShell method.\n Page 109"
  remediation: "Remediate from Azure Portal\n1. Go to Key vaults.\n2. Click the name of a key vault.\n3. Under Monitoring,\
    \ click Diagnostic settings.\n4. Click Edit setting next to a diagnostic setting, or click Add diagnostic\nsetting and\
    \ enter a Diagnostic setting name.\n5. Under Category groups, check audit and allLogs.\n6. Under Destination details,\
    \ select at least one destination.\n7. Click Save.\n8. Repeat steps 2-7 for each key vault requiring remediation.\nRemediate\
    \ from Azure CLI\nFor each key vault requiring remediation, run the following command:\naz monitor diagnostic-settings\
