- id: '7.6'
  title: Ensure that Network Security Group Flow Log Retention Days is Set to Greater than or equal to 90 (LEGACY)
  scoring: scored
  profile:
  - Level 2
  description: 'Network security group (NSG) flow logs record IP traffic that passes through an NSG to a storage account.
    Each flow log''s Retention days setting is 0, which keeps records indefinitely, or a number of days after which records
    are deleted. Warning: NSG flow logs retire on September 30, 2027, and new NSG flow logs cannot be created after June 30,
    2025; migrate to virtual network flow logs and apply the recommendation Ensure that Virtual Network Flow Log Retention
    Days is Set to Greater than or Equal to 90. Note: This recommendation applies only to NSG flow logs still in use; an NSG
    flow log left disabled by migration to virtual network flow logs is out of scope and should be deleted, not re-enabled.'
  rationale: Flow log records are the evidence used to reconstruct network connections during an investigation, and an intrusion
    can go undetected for weeks. With a short retention period, the records of an attacker's connections are deleted before
    anyone looks for them, leaving no network trail of entry or lateral movement.
  impact: Retaining flow log records for 90 days or longer increases storage consumption and cost in the destination storage
    account. After September 30, 2027, Azure deletes NSG flow log resources, but records already written to storage remain
    and follow their configured retention policy. Page 232
  references:
  - 1. https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
  - 2. https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-manage
  page_start: 232
  audit_raw: "Audit from Azure Portal\n1. Go to Network Watcher.\n2. Under Logs, select Flow logs.\n3. Click the name of a\
    \ network security group flow log that has not been replaced by\na virtual network flow log.\n4. Verify that Status is\
    \ set to On.\n5. Verify that Retention days is set to 0 or to 90 or more. A value of 0 retains\nlogs indefinitely.\n6.\
    \ Repeat steps 1-5 for each network security group flow log still in use.\nAudit from Azure CLI\nRun the following command\
    \ to list the regions that have a network watcher:\naz network watcher list --query \"[].location\" --output tsv\nFor\
    \ each region, run the following command to list its flow logs:\naz network watcher flow-log list --location <location>\
    \ --query \"[].{name:name,\ntarget:targetResourceId, enabled:enabled, retentionDays:retentionPolicy.days}\"\nFor each\
    \ flow log whose target is a network security group still in use, verify that\nenabled is true and retentionDays is 0\
    \ or 90 or more. Disabled flow logs left by\nmigration are out of scope.\n Page 233"
  remediation: 'Remediate from Azure Portal

    1. Go to Network Watcher.

    2. Under Logs, select Flow logs.

    3. Click the name of a network security group flow log requiring remediation.

    4. If the flow log was left disabled by migration to virtual network flow logs, click

    Delete and confirm, then skip to the next flow log.

    5. Set Status to On.

    6. Set Retention days to 0 or to 90 or more.

    7. Click Save.

    8. Repeat steps 1-7 for each network security group flow log requiring remediation.

    Remediate from Azure CLI

    For each network security group flow log still in use, run the following command, setting

    --retention to 0 or to 90 or more:

    az network watcher flow-log update --location <location> --name <flow-log-name> --

    enabled true --retention <number-of-days>

    For each flow log left disabled by migration to virtual network flow logs, delete it instead:

    az network watcher flow-log delete --location <location> --name <flow-log-name>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

