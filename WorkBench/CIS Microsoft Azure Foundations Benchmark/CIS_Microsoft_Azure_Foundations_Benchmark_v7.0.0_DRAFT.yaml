- id: '7.5'
  title: Ensure that WinRM Access from the Internet is Evaluated and Restricted
  scoring: scored
  profile:
  - Level 1
  description: Network security groups should be periodically evaluated for port misconfigurations. Where Windows Remote Management
    (WinRM) access (TCP ports 5985 and 5986) is not explicitly required and narrowly configured for resources attached to
    a network security group, Internet-level access to Azure resources should be restricted or eliminated.
  rationale: Windows Server enables PowerShell Remoting over WinRM by default and accepts remoting connections only from administrators,
    so a WinRM port reachable from the Internet exposes administrator remote command execution to password guessing. A compromised
    virtual machine can then be used to attack other resources on the virtual network or outside Azure.
  impact: Removing Internet access to WinRM ends PowerShell Remoting and other WinRMbased management of the affected virtual
    machines from the Internet, including automation tools. That management must move to another path, such as just-in-time
    VM access (Defender for Servers Plan 2), a VPN, or ExpressRoute. Page 226
  references:
  - 1. https://learn.microsoft.com/en-us/windows/win32/winrm/installation-andconfiguration-for-windows-remote-management
  - 2. https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/winrmsecurity
  page_start: 226
  audit_raw: "Audit from Azure Portal\n1. Go to Network security groups.\n2. Click the name of a network security group.\n\
    3. Under Settings, click Inbound security rules.\n4. Ensure that no inbound security rule exists that matches the following:\n\
    • Port: 5985, 5986, Any, or range including 5985 or 5986\n• Protocol: TCP or Any\n• Source: 0.0.0.0/0, ::/0, Internet,\
    \ or Any\n• Action: Allow\n5. Repeat steps 1-4 for each network security group.\nTo audit from Azure Resource Graph:\n\
    1. Go to Resource Graph Explorer.\n2. Click New query.\n3. Paste the following into the query window:\nresources | where\
    \ type =~ \"microsoft.network/networksecuritygroups\" | project\nid, name, securityRule = properties.securityRules | mv-expand\
    \ securityRule\nlimit 1000 | extend access = securityRule.properties.access, direction =\nsecurityRule.properties.direction,\
    \ protocol =\nsecurityRule.properties.protocol, destinationPort =\ncase(isempty(securityRule.properties.destinationPortRange),\n\
    securityRule.properties.destinationPortRanges,\nsecurityRule.properties.destinationPortRange), sourceAddress =\ncase(isempty(securityRule.properties.sourceAddressPrefix),\n\
    securityRule.properties.sourceAddressPrefixes,\nsecurityRule.properties.sourceAddressPrefix) | where access =~ \"Allow\"\
    \ and\ndirection =~ \"Inbound\" and protocol in~ (\"tcp\", \"*\") | mv-expand\ndestinationPort | mv-expand sourceAddress\
    \ | extend destinationPort =\ntostring(destinationPort) | extend destinationPortMin =\ntoint(split(destinationPort, \"\
    -\")[0]), destinationPortMax =\ntoint(split(destinationPort, \"-\")[-1]) | where destinationPort in (\"*\", \"\")\nor\
    \ (destinationPortMin <= 5985 and destinationPortMax >= 5985) or\n(destinationPortMin <= 5986 and destinationPortMax >=\
    \ 5986) | where\nsourceAddress in~ (\"*\", \"0.0.0.0\", \"internet\", \"any\") or sourceAddress\nendswith \"/0\"\n4. Click\
    \ Run query.\n5. Ensure that no results are returned.\nAudit from Azure CLI\nList network security groups with non-default\
    \ security rules:\n Page 227\naz network nsg list --query \"[*].[name,securityRules]\"\nEnsure that no network security\
    \ group has an inbound security rule that matches the\nfollowing:\n\"access\" : \"Allow\"\n\"destinationPortRange\" :\
    \ \"5985\", \"5986\", \"*\", or \"<range-including-5985-or-5986>\"\n\"direction\" : \"Inbound\"\n\"protocol\" : \"Tcp\"\
    \ or \"*\"\n\"sourceAddressPrefix\" : \"0.0.0.0/0\", \"::/0\", \"Internet\", or \"*\"\nCheck each entry of destinationPortRanges\
    \ and sourceAddressPrefixes the\nsame way.\nAudit from PowerShell\nList inbound Allow rules for TCP or any protocol:\n\
    Get-AzNetworkSecurityGroup | ForEach-Object {\n $nsg = $_\n $nsg.SecurityRules | Where-Object { $_.Direction -eq 'Inbound'\
    \ -and $_.Access -\neq 'Allow' -and $_.Protocol -in 'Tcp', '*' } |\n Select-Object @{n='NetworkSecurityGroup'; e={$nsg.Name}},\n\
    @{n='ResourceGroup'; e={$nsg.ResourceGroupName}}, Name, DestinationPortRange,\nSourceAddressPrefix\n}\nEnsure that no\
    \ listed rule combines a DestinationPortRange entry of 5985, 5986,\n*, or a range including either port with a SourceAddressPrefix\
    \ entry of\n0.0.0.0/0, ::/0, Internet, or *.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark,\
    \ clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy,\
    \ you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 9daedab3-fb2d-461e-b861-71790eead4f6 - Name: 'All network ports\nshould be restricted on network security\
    \ groups associated to your virtual\nmachine'\nThis definition flags inbound rules from Any or Internet on any port for\
    \ network\nsecurity groups associated with virtual machines, so it also reports exposures other than\nWinRM.\n Page 228"
  remediation: "Remediate from Azure Portal\n1. Go to Network security groups.\n2. Click the name of a network security group.\n\
    3. Under Settings, click Inbound security rules.\n4. Identify any inbound security rule matching:\n• Port: 5985, 5986,\
    \ Any, or range including 5985 or 5986\n• Protocol: TCP or Any\n• Source: 0.0.0.0/0, ::/0, Internet, or Any\n• Action:\
    \ Allow\n5. For a matching rule that also allows other ports (Any, a broad range, or several\nports), click the rule,\
    \ then either remove 5985 and 5986 from Destination\nport ranges or set Source to IP Addresses and enter the trusted\n\
    addresses in Source IP addresses/CIDR ranges. Click Save.\n6. For a matching rule that exists only for WinRM, check the\
    \ box next to the rule,\nclick Delete, then click Yes.\n7. Repeat steps 1-6 for each network security group requiring\
    \ remediation.\nRemediate from Azure CLI\nFor a rule that exists only for WinRM, delete it:\naz network nsg rule delete\
    \ --resource-group <resource-group> --nsg-name <networksecurity-group> --name <rule>\nFor a rule that also allows other\
    \ ports, restrict its source or remove 5985 and 5986 from\nits destination ports instead:\naz network nsg rule update\
    \ --resource-group <resource-group> --nsg-name <networksecurity-group> --name <rule> --source-address-prefixes <trusted-address-range>\n\
    az network nsg rule update --resource-group <resource-group> --nsg-name <networksecurity-group> --name <rule> --destination-port-ranges\
    \ <ports-without-5985-5986>\nRemediate from PowerShell\nFor a rule that exists only for WinRM, delete it:\nGet-AzNetworkSecurityGroup\
    \ -ResourceGroupName <resource-group> -Name <networksecurity-group> | Remove-AzNetworkSecurityRuleConfig -Name <rule>\
    \ | SetAzNetworkSecurityGroup\nFor a rule that also allows other ports, restrict its source instead, or assign the\nremaining\
    \ ports to DestinationPortRange the same way:\n Page 229\n$nsg = Get-AzNetworkSecurityGroup -ResourceGroupName <resource-group>\
    \ -Name\n<network-security-group>\n($nsg.SecurityRules | Where-Object { $_.Name -eq '<rule>' }).SourceAddressPrefix =\n\
    [System.String[]]@('<trusted-address-range>')\n$nsg | Set-AzNetworkSecurityGroup"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Network security groups.

