- id: '7.17'
  title: Ensure Bot Protection is Enabled in Azure Web Application Firewall Policy on Azure Application Gateway
  scoring: scored
  profile:
  - Level 2
  description: Enable bot protection on the Web Application Firewall to block or log requests from known malicious IP addresses
    identified through the Microsoft Threat Intelligence feed.
  rationale: Internet traffic from bots can scrape, scan, and search for application vulnerabilities. Enabling bot protection
    stops requests from known malicious IP addresses and enhances the overall security of your application by reducing exposure
    to automated attacks.
  impact: May require monitoring to identify false positives. Page 277
  references:
  - 1. https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/botprotection-overview
  - 2. https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/bot-protection
  page_start: 277
  audit_raw: "Audit from Azure Portal\n1. Go to Application gateways.\n2. Click the name of an application gateway.\n3. Under\
    \ Settings, click Web application firewall.\n4. Under Associated web application firewall policy, click the policy\nname.\n\
    5. Under Settings, click Managed rules.\n6. Ensure a Rule Id containing Microsoft_BotManagerRuleSet is listed.\n7. Click\
    \ the > to expand the row.\n8. Ensure the Status for Malicious Bots is set to Enabled.\n9. Repeat steps 1-8 for each application\
    \ gateway.\nAudit from Azure CLI\nRun the following command to list application gateways:\naz network application-gateway\
    \ list\nFor each application gateway, run the following command to get the firewall policy id:\naz network application-gateway\
    \ show --resource-group <resource-group> --name\n<application-gateway> --query firewallPolicy.id\nFor each firewall policy,\
    \ run the following command to get the managed rule sets:\naz network application-gateway waf-policy show --ids <firewall-policy>\
    \ --query\nmanagedRules.managedRuleSets\nEnsure a managed rule set with ruleSetType of Microsoft_BotManagerRuleSet\nis\
    \ returned, and that no ruleGroupOverrides for ruleGroupName KnownBadBots\nwith state Disabled are returned.\nAudit from\
    \ Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated\
    \ Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: ebea0d86-7fbd-42e3-8a46-27e7568c2525 - Name: 'Bot Protection\nshould be enabled for Azure Application Gateway\
    \ WAF'\n Page 278"
  remediation: 'Remediate from Azure Portal

    1. Go to Application gateways.

    2. Click the name of an application gateway.

    3. Under Settings, click Web application firewall.

    4. Under Associated web application firewall policy, click the policy

    name.

    5. Under Settings, click Managed rules.

    6. Click Assign.

    7. Under Bot Management ruleset, click to display the drop-down menu.

    8. Select a Microsoft_BotManagerRuleSet.

    9. Click Save.

    10. Click X to close the panel.

    11. Repeat steps 1-10 for each application gateway and firewall policy requiring

    remediation.

    Remediate from Azure CLI

    For each firewall policy requiring remediation, run the following command to enable bot

    protection:

    az network application-gateway waf-policy managed-rule rule-set add --resourcegroup <resource-group> --policy-name <firewall-policy>
    --type

    Microsoft_BotManagerRuleSet --version <0.1|1.0|1.1>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Application gateways.

      2. Click the name of an application gateway.

      3. Under Settings, click Web application firewall.

      4. Under Associated web application firewall policy, click the policy

      name.

      5. Under Settings, click Managed rules.

      6. Ensure a Rule Id containing Microsoft_BotManagerRuleSet is listed.

      7. Click the > to expand the row.

      8. Ensure the Status for Malicious Bots is set to Enabled.

      9. Repeat steps 1-8 for each application gateway.

      Audit from Azure CLI'
    severity: medium
- id: '7.18'
  title: Ensure Azure Network Security Perimeter is Used to Secure Azure Platform-as-a-service Resources
  scoring: manual
  profile:
  - Level 2
  description: Azure Network Security Perimeter creates a logical boundary around Azure platform-asa-service (PaaS) resources
    outside of virtual networks. By default, the network security perimeter denies public access to associated PaaS resources,
    with the ability to define explicit rules for inbound and outbound traffic. While an automated assessment procedure exists
    for this recommendation, the assessment status remains manual. Determining appropriate network security perimeter profiles
    and resource assignments depends on the context and requirements of each organization and environment.
  rationale: Network security perimeter denies public access to PaaS resources, reducing exposure and mitigating data exfiltration
    risks.
  impact: Implementation requires administrative effort to configure and maintain network security perimeter profiles and
    resource assignments. Azure does not list any additional charges for using network security perimeters. Page 281
  references:
  - 1. https://learn.microsoft.com/en-us/azure/private-link/network-security-perimeterconcepts
  - 2. https://learn.microsoft.com/en-us/azure/private-link/create-network-securityperimeter-portal
  page_start: 281
  audit_raw: "Audit from Azure Portal\n1. Go to Resource groups.\n2. Click the name of a resource group.\n3. Take note of\
    \ PaaS resources.\n4. Go to Network Security Perimeters.\n5. Click the name of a network security perimeter.\n6. Under\
    \ Settings, click Associated resources.\n7. Take note of the associated resources.\n8. Repeat steps 1-7 and ensure each\
    \ PaaS resource is associated with a network\nsecurity perimeter.\nAudit from Azure CLI\nRun the following command to\
    \ list resource groups:\naz group list\nFor each resource group, run the following command to list resources:\naz resource\
    \ list --resource-group <resource-group>\nTake note of PaaS resources.\nFor each resource group, run the following command\
    \ to list network security perimeters:\naz network perimeter list --resource-group <resource-group>\nFor each network\
    \ security perimeter, run the following command to list resources:\naz network perimeter association list --resource-group\
    \ <resource-group> --\nperimeter-name <network-security-perimeter>\nEnsure each PaaS resource is associated with a network\
    \ security perimeter.\n Page 282"
  remediation: "Remediate from Azure Portal\nCreate and associate PaaS resources with a new network security perimeter:\n\
    1. Go to Network Security Perimeters.\n2. Click + Create.\n3. Select a Subscription and Resource group, provide a Name,\
    \ select a\nRegion, and provide a Profile name.\n4. Click Next.\n5. Click + Add.\n6. Check the box next to a PaaS resource\
    \ to associate it with the network security\nperimeter.\n7. Click Select.\n8. Click Next.\n9. Configure appropriate Inbound\
    \ access rules for your organization.\n10. Click Next.\n11. Configure appropriate Outbound access rules for your organization.\n\
    12. Click Review + create.\n13. Click Create.\nAssociate PaaS resources with an existing network security perimeter:\n\
    1. Go to Network Security Perimeters.\n2. Click the name of a network security perimeter.\n3. Under Settings, click Associated\
    \ resources.\n4. Click + Add.\n5. Select Associate resources with a new profile or Associate\nresources with an existing\
    \ profile.\n6. To associate resources with a new profile:\n1. Provide a Name.\n2. Click Next.\n3. Click + Add.\n4. Check\
    \ the box next to a PaaS resource to associate it with the network\nsecurity perimeter.\n5. Click Select.\n6. Click Next.\n\
    7. Configure appropriate Inbound access rules for your organization.\n8. Click Next.\n9. Configure appropriate Outbound\
    \ access rules for your organization.\n Page 283\n10. Click Review + create.\n11. Click Create.\n7. To associate resources\
    \ with an existing profile:\n1. Next to Profile, click Select to display the drop-down menu.\n2. Select a profile.\n3.\
    \ Click + Add.\n4. Check the box next to a PaaS resource to associate it with the network\nsecurity perimeter.\n5. Click\
    \ Select.\n6. Click Associate.\nRemediate from Azure CLI\nUse az network perimeter profile list or az network perimeter\n\
    profile create to list existing or create a new network security perimeter profile.\nFor each PaaS resource requiring\
    \ association with a network security perimeter, run the\nfollowing command:\naz network perimeter association create\
    \ --resource-group <resource-group> --\nperimeter-name <network-security-perimeter> --association-name <association> --\n\
    private-link-resource \"{id:<paas-resource-id>}\" --profile \"{<profile-id>}\""
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Resource groups.

      2. Click the name of a resource group.

      3. Take note of PaaS resources.

      4. Go to Network Security Perimeters.

      5. Click the name of a network security perimeter.

      6. Under Settings, click Associated resources.

      7. Take note of the associated resources.

      8. Repeat steps 1-7 and ensure each PaaS resource is associated with a network

      security perimeter.

      Audit from Azure CLI

      Run the following command to list resource groups:

      az group list

      For each resourc'
