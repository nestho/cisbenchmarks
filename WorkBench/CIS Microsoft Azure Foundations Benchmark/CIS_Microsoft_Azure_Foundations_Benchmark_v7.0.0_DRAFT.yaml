- id: '7.20'
  title: Ensure Azure Web Application Firewall (WAF) is Enabled on Azure Front Door entry points
  scoring: scored
  profile:
  - Level 2
  description: Azure Web Application Firewall (WAF) helps protect applications from common exploits and attacks by inspecting
    and filtering incoming traffic using security rules.
  rationale: Azure WAF can operate as both a detective and protective control against multiple categories of application-layer
    and network-layer threats, including scripted HTTP attacks, DDoS, and bots. Azure-managed preconfigured rules update automatically
    with signatures for new threats.
  impact: WAF policies in blocking mode can inadvertently prevent legitimate application use. Thorough testing in detection-only
    mode is highly recommended. Full WAF capabilities including Azure-managed preconfigured rules require a Premium SKU; the
    Standard SKU supports custom rules only. Maintenance costs can include additional security operator workloads for custom
    rule development, tuning, unblocking requests, and training. Page 287
  references:
  - 1. https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afdsoverview
  - 2. https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-frontdoor-create-portal
  page_start: 287
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Front Doors.

    2. Click the name of an Azure Front Door resource.

    3. Expand the Settings section, select Front Door manager, ensure each

    Endpoint has one or more associated Security Policies.

    4. Repeat steps 1-3 for each resource.

    Audit from Azure CLI

    Run the following command to list Azure Front Door profiles:

    az resource list --resource-type "Microsoft.Cdn/profiles/afdEndpoints" --query

    "[].{Name:name, ResourceGroup:resourceGroup}"

    For each resource, run the following command to get the firewall policies:

    az afd security-policy list --resource-group <resource-group> --profile-name <name>

    Ensure at least one wafPolicy id is returned and the provisioningState is

    Succeeded.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 055aa869-bc98-4af8-bafc-23f1ab6ffe2c - Name: ''Azure Web

    Application Firewall should be enabled for Azure Front Door entry-points'''
  remediation: "Remediate from Azure Portal\nTo create a WAF policy for an Azure Front Door instance or an Azure Front Door\n\
    Standard or Premium Profile in the Azure Portal:\n1. Search for \"Web Application Firewall (WAF)\", and select Create\
    \ (+).\n2. On the Basics tab of the Create a WAF policy page, enter the details of the\nassociated AFD resource. Ensure\
    \ that Enable policy is checked.\n3. On the next screens, configure Managed rules and Policy settings as required.\n4.\
    \ On the Association tab, select Add association and choose the Azure Front\nDoor Profile, Domain, or Route to protect.\n\
    5. Select Review + create.\n Page 288"
