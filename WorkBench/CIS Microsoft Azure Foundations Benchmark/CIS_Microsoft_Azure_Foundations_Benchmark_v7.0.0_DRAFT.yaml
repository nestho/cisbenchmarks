- id: '6.2'
  title: Ensure that Resource Locks are set for Mission-Critical Azure Resources
  scoring: manual
  profile:
  - Level 2
  description: Resource Manager locks restrict deletion or modification of a subscription, resource group, or resource for
    all users, regardless of their role assignments. A CanNotDelete lock lets authorized users read and modify a resource
    but not delete it; a ReadOnly lock lets them read it but not modify or delete it, similar to the Reader role. While an
    automated assessment procedure exists for this recommendation, the assessment status remains manual. Determining resources
    that require resource locks depends on the context and requirements of each organization and environment.
  rationale: Without a lock, a mission-critical resource can be deleted or overwritten by any identity that holds write or
    delete permission on it, whether through a mistaken change, a faulty automation run, or a compromised account. Deleting
    a resource such as a key vault, database, or virtual network can cause an outage or permanent data loss.
  impact: There can be unintended outcomes of locking a resource. Applying a lock to a parent service will cause it to be
    inherited by all resources within. Conversely, applying a lock to a resource may not apply to connected storage, leaving
    it unlocked. Please see the documentation for further information. Page 203
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  - 2. https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landingzone/design-area/management-platform#inventory-and-visibilityrecommendations
  page_start: 203
  audit_raw: "Audit from Azure Portal\n1. Navigate to the specific Azure Resource or Resource Group.\n2. Click Locks.\n3.\
    \ Ensure the lock is defined with name and description, with type Read-only or\nDelete as appropriate.\nAudit from Azure\
    \ CLI\nList the locks on a mission-critical resource:\naz lock list --resource-group <resource-group-name> --resource-name\
    \ <resource-name>\n--namespace <namespace> --resource-type <resource-type> --parent \"\"\nEnsure that a lock with level\
    \ CanNotDelete or ReadOnly is returned.\nAudit from PowerShell\nSet $resources to the resources your organization has\
    \ identified as mission-critical,\nfor example by resource group as shown in the script below. To select them by tag\n\
    instead, use:\n$resources = Get-AzResource -TagName <tag-name> -TagValue <tag-value>\nWith -AtScope, the results include\
    \ locks on the resource and locks inherited from its\nresource group or subscription, but not locks on child resources.\n\
    \ Page 204\n$resources = Get-AzResource -ResourceGroupName <resource-group-name>\n$complianceResults = @()\nforeach ($resource\
    \ in $resources) {\n $locks = Get-AzResourceLock -ResourceName $resource.Name `\n -ResourceType $resource.ResourceType\
    \ `\n -ResourceGroupName $resource.ResourceGroupName `\n -AtScope\n if (-not $locks) {\n $complianceResults += [PSCustomObject]@{\n\
    \ ResourceName = $resource.Name\n ResourceGroup = $resource.ResourceGroupName\n ResourceType = $resource.ResourceType\n\
    \ LockName = $null\n LockLevel = $null\n Compliant = $false\n }\n continue\n }\n foreach ($lock in $locks) {\n $complianceResults\
    \ += [PSCustomObject]@{\n ResourceName = $resource.Name\n ResourceGroup = $resource.ResourceGroupName\n ResourceType =\
    \ $resource.ResourceType\n LockName = $lock.Name\n LockLevel = $lock.Properties.Level\n Compliant = $lock.Properties.Level\
    \ -in @('CanNotDelete',\n'ReadOnly')\n }\n }\n}\n$complianceResults | Format-Table -AutoSize\nEnsure that every mission-critical\
    \ resource has at least one row with Compliant set to\nTrue.\n Page 205"
  remediation: 'Remediate from Azure Portal

    1. Navigate to the specific Azure Resource or Resource Group.

    2. For each mission-critical resource, click Locks.

    3. Click Add.

    4. Give the lock a name and a description, then select the type, Read-only or

    Delete as appropriate.

    5. Click OK.

    Remediate from Azure CLI

    To lock a resource, provide the name of the resource, its resource type, and its

    resource group name:

    az lock create --name <lock-name> --lock-type CanNotDelete --resource-group

    <resource-group-name> --resource-name <resource-name> --resource-type <resourcetype>

    To apply a read-only lock, use --lock-type ReadOnly.

    Remediate from PowerShell

    New-AzResourceLock -LockLevel CanNotDelete -LockName <lock-name> -ResourceName

    <resource-name> -ResourceType <resource-type> -ResourceGroupName <resource-groupname> -Force

    To apply a read-only lock, use -LockLevel ReadOnly.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Navigate to the specific Azure Resource or Resource Group.

      2. Click Locks.

      3. Ensure the lock is defined with name and description, with type Read-only or

      Delete as appropriate.

      Audit from Azure CLI

      List the locks on a mission-critical resource:

      az lock list --resource-group <resource-group-name> --resource-name <resource-name>

      --namespace <namespace> --resource-type <resource-type> --parent ""

      Ensure that a lock with level CanNotDelete or ReadOnly is returned.

      Audit f'
    severity: medium
- id: '7.1'
  title: Ensure that RDP Access from the Internet is Evaluated and Restricted
  scoring: scored
  profile:
  - Level 1
  description: Network security groups should be periodically evaluated for port misconfigurations. Where RDP is not explicitly
    required and narrowly configured for resources attached to a network security group, Internet-level access to Azure resources
    should be restricted or eliminated.
  rationale: The potential security problem with using RDP over the Internet is that attackers can use various brute force
    techniques to gain access to Azure Virtual Machines. Once the attackers gain access, they can use a virtual machine as
    a launch point for compromising other machines on an Azure Virtual Network or even attack networked devices outside of
    Azure. Page 209
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/network-bestpractices#disable-rdpssh-access-to-virtual-machines
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity#ns-1-establish-network-segmentation-boundaries
  page_start: 209
  audit_raw: "Audit from Azure Portal\n1. Go to Network security groups.\n2. Click the name of a network security group.\n\
    3. Under Settings, click Inbound security rules.\n4. Ensure that no inbound security rule exists that matches the following:\n\
    • Port: 3389 or range including 3389\n• Protocol: TCP or Any\n• Source: 0.0.0.0/0, Internet, or Any\n• Action: Allow\n\
    5. Repeat steps 1-4 for each network security group.\nTo audit from Azure Resource Graph:\n1. Go to Resource Graph Explorer.\n\
    2. Click New query.\n3. Paste the following into the query window:\nresources | where type =~ \"microsoft.network/networksecuritygroups\"\
    \ | project\nid, name, securityRule = properties.securityRules | mv-expand securityRule |\nextend access = securityRule.properties.access,\
    \ direction =\nsecurityRule.properties.direction, protocol =\nsecurityRule.properties.protocol, destinationPort =\ncase(isempty(securityRule.properties.destinationPortRange),\n\
    securityRule.properties.destinationPortRanges,\nsecurityRule.properties.destinationPortRange), sourceAddress =\ncase(isempty(securityRule.properties.sourceAddressPrefix),\n\
    securityRule.properties.sourceAddressPrefixes,\nsecurityRule.properties.sourceAddressPrefix) | where access =~ \"Allow\"\
    \ and\ndirection =~ \"Inbound\" and protocol in~ (\"tcp\", \"*\") | mv-expand\ndestinationPort | mv-expand sourceAddress\
    \ | extend destinationPort =\ntostring(destinationPort) | extend destinationPortMin =\ntoint(split(destinationPort, \"\
    -\")[0]), destinationPortMax =\ntoint(split(destinationPort, \"-\")[-1]) | where destinationPort in (\"*\", \"\")\nor\
    \ (destinationPortMin <= 3389 and destinationPortMax >= 3389) | where\nsourceAddress in~ (\"*\", \"0.0.0.0\", \"internet\"\
    , \"any\") or sourceAddress\nendswith \"/0\"\n4. Click Run query.\n5. Ensure that no results are returned.\nAudit from\
    \ Azure CLI\nList network security groups with non-default security rules:\naz network nsg list --query [*].[name,securityRules]\n\
    \ Page 210\nEnsure that no network security group has an inbound security rule that matches the\nfollowing:\n\"access\"\
    \ : \"Allow\"\n\"destinationPortRange\" : \"3389\", \"*\", or \"<range-including-3389>\"\n\"direction\" : \"Inbound\"\n\
    \"protocol\" : \"TCP\" or \"*\"\n\"sourceAddressPrefix\" : \"0.0.0.0/0\", \"Internet\", or \"*\"\nAudit from Azure Policy\n\
    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition\
    \ in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 22730e10-96f6-4aac-ad84-9383d35b5917 - Name: 'Management\nports should be closed on your virtual machines'"
  remediation: 'Remediate from Azure Portal

    1. Go to Network security groups.

    2. Click the name of a network security group.

    3. Under Settings, click Inbound security rules.

    4. Check the box next to any inbound security rule matching:

    • Port: 3389 or range including 3389

    • Protocol: TCP or Any

    • Source: 0.0.0.0/0, Internet, or Any

    • Action: Allow

    5. Click Delete.

    6. Click Yes.

    7. Repeat steps 1-6 for each network security group requiring remediation.

    Remediate from Azure CLI

    For each network security group rule requiring remediation, run the following command

    to delete the rule:

    az network nsg rule delete --resource-group <resource-group> --nsg-name <networksecurity-group> --name <rule>'
