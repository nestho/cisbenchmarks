- id: '1.10'
  title: Ensure that 'Users can add gallery apps to their Access Panel' is set to 'No'
  scoring: scored
  profile:
  - Level 2
  description: Require administrators to provide consent for the apps before use. Require administrators to register third-party
    applications. Limit guest user permissions.
  rationale: Unless Azure Active Directory is running as an identity provider for third-party applications, do not allow users
    to use their identity outside of your cloud environment. User profiles contain private information such as phone numbers
    and email addresses which could then be sold off to other third parties without requiring any further consent from the
    user. It is recommended to let administrator register custom-developed applications. This ensures that the application
    undergoes a security review before exposing active directory data to it. Limiting guest access ensures that guest accounts
    do not have permission for certain directory tasks, such as enumerating users, groups or other directory resources, and
    cannot be assigned to administrative roles in your directory.
  impact: It might be an additional request that administrators need to fulfill quite often. 36 | P a g e It might be an additional
