- id: '1.3'
  title: Ensure that there are no guest users
  scoring: scored
  profile:
  - Level 1
  description: Do not add guest users if not needed.
  rationale: Azure AD is extended to include Azure AD B2B collaboration, allowing you to invite people from outside your organization
    to be guest users in your cloud account. Until you have a business need to provide guest access to any user, avoid creating
    guest users. Guest users are typically added outside your employee on-boarding/off-boarding process and could potentially
    be overlooked indefinitely leading to a potential vulnerability.
  impact: None
  references:
  - 1. https://blogs.microsoft.com/firehose/2017/06/14/now-you-can-invite-guestusers-to-azure-analysis-services-with-azure-active-directory-b2b/
  page_start: 22
  audit_raw: 'Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to All Users

    4. Click on Show drop down and select Guest users only

    5. Ensure that there are no guest users listed (USER TYPE = Guest)

    Azure Command Line Interface 2.0

    az ad user list --query "[?additionalProperties.userType==''Guest'']"

    If any users are listed, then this recommendation is non-compliant.'
  remediation: Delete the "Guest" users.
  checks:
  - type: sql
    command: Show drop down and select Guest users only
    severity: medium
    info: 'Azure Console

      1. Go to Azure Active Directory

      2. Go to Users and group

      3. Go to All Users

      4. Click on Show drop down and select Guest users only

      5. Ensure that there are no guest users listed (USER TYPE = Guest)

      Azure Command Line Interface 2.0

      az ad user list --query "[?additionalProperties.userType==''Guest'']"

      If any users are listed, then this recommendation is non-compliant.'
- id: '1.4'
  title: Ensure that 'Allow users to remember multi-factor authentication on devices they trust' is 'Disabled'
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: Do not allow users to remember multi-factor authentication on devices. Ensure that two alternate forms of identification
    are provided before allowing a password reset.
  rationale: Remembering Multi-Factor Authentication (MFA) for devices and browsers allows users to have the option to by-pass
    MFA for a set number of days after performing a successful signin using MFA. This can enhance usability by minimizing
    the number of times a user may need to perform two-step verification on the same device. However, if an account or device
    is compromised, remembering MFA for trusted devices may affect security. Hence, it is recommended that users not be allowed
    to bypass MFA. Like multi-factor authentication, setting up dual identification before allowing a password reset ensures
    that the user identity is confirmed via two separate forms of identification. With dual identification set, an attacker
    would require compromising both the identity forms before he/she could maliciously reset a user's password.
  impact: For every login attempt, the user will be required to perform multi-factor authentication. None
  references:
  - 1. https://docs.microsoft.com/en-us/azure/multi-factor-authentication/multi-factorauthentication-whats-next#remember-multi-factor-authentication-for-devices-thatusers-trust
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directorypasswords-faq#password-reset-registration
  page_start: 24
  audit_raw: 'Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to All Users

    4. Click on Multi-Factor Authentication button on the top bar

    5. Click on service settings

    6. Ensure that Allow users to remember multi-factor authentication on

    devices they trust is not enabled

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.

    Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Authentication methods

    5. Ensure that Number of methods required to reset is set to 2

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.'
  remediation: 'Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to All Users

    4. Click on Multi-Factor Authentication button on the top bar

    5. Click on service settings

    24 | P a g e

    6. Disable Allow users to remember multi-factor authentication on devices

    they trust

    Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Authentication methods

    5. Set the Number of methods required to reset to 2

    26 | P a g e'
  checks:
