- id: '1.6'
  title: Ensure that 'Number of days before users are asked to re-confirm their authentication information' is not set to
    "0"
  scoring: scored
  profile:
  - Level 1
  description: Ensure that the number of days before users are asked to re-confirm their authentication information is not
    set to 0. Ensure that users are notified on their primary and secondary emails on password resets.
  rationale: If authentication re-confirmation is disabled, registered users will never be prompted to reconfirm their existing
    authentication information. If the authentication information for a user, such as a phone number or email changes, then
    the password reset information for that user reverts to the previously registered authentication information. User notification
    on password reset is a passive way of confirming password reset activity. It helps the user to recognize unauthorized
    password reset activities.
  impact: None None 30 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directorypasswords-how-it-works#registration
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directorypasswords-how-it-works#notifications
  page_start: 28
  audit_raw: 'Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Registration

    5. Ensure that Number of days before users are asked to re-confirm their

    authentication information is not set to 0

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.

    Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Notification

    5. Ensure that Notify users on password resets? is set to Yes

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.'
  remediation: 'Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Registration

    5. Set the Number of days before users are asked to re-confirm their

    authentication information to your organization defined frequency

    28 | P a g e

    Azure Console

    1. Go to Azure Active Directory

    2. Go to Users and group

    3. Go to Password reset

    4. Go to Notification

    5. Set Notify users on password resets? to Yes'
  checks:
