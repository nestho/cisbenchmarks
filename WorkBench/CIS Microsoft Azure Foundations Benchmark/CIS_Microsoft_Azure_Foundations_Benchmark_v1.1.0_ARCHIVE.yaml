- id: '4.10'
  title: Ensure SQL server's TDE protector is encrypted with BYOK (Use your own key)
  scoring: scored
  profile:
  - Level 2
  description: TDE with BYOK support provides increased transparency and control over the TDE Protector, increased security
    with an HSM-backed external service, and promotion of separation of duties. With TDE, data is encrypted at rest with a
    symmetric key (called the database encryption key) stored in the database or data warehouse distribution. To protect this
    data encryption key (DEK) in the past, only a certificate that the Azure SQL Service managed could be used. Now, with
    BYOK support for TDE, the DEK can be protected with an asymmetric key that is stored in the Key Vault. Key Vault is a
    highly available and scalable cloud-based key store which offers central key management, leverages FIPS 140-2 Level 2
    validated hardware security modules (HSMs), and allows separation of management of keys and data, for additional security.
    Based on business needs or criticality of data/databases hosted a SQL server, it is recommended that the TDE protector
    is encrypted by a key that is managed by the data owner (BYOK).
  rationale: Bring Your Own Key (BYOK) support for Transparent Data Encryption (TDE) allows user control of TDE encryption
    keys and restricts who can access them and when. Azure Key Vault, Azure’s cloud-based external key management system is
    the first key management service where TDE has integrated support for BYOK. With BYOK, the database encryption key is
    protected by an asymmetric key stored in the Key Vault. The asymmetric key is set at the server level and inherited by
    all databases under that server. This feature is currently in preview and we do not recommend using it for production
    workloads until we declare General Availability.
  impact: Once TDE protector is encrypted with BYOK, it transfers entire responsibility of respective key management on you
    and hence you should be more careful about doing any operations on the particular key in order to keep data from corresponding
    SQL server and Databases hosted accessible. 147 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/sql/relationaldatabases/security/encryption/transparent-data-encryption-byok-azure-sql
  - 2. https://azure.microsoft.com/en-in/blog/preview-sql-transparent-data-encryptiontde-with-bring-your-own-key-support/
  page_start: 146
  audit_raw: 'Azure Portal:

    1. Go to SQL servers

    146 | P a g e

    2. For the desired server instance

    3. Click On Transparent data encryption

    4. Ensure that Use your own key is set to YES

    5. Ensure Make selected key the default TDE protector is checked

    Azure CLI:

    az account get-access-token --query

    "{subscripton:subscription,accessToken:accessToken}" --out tsv | xargs -L1

    bash -c ''curl -X GET -H "Authorization: Bearer $1" -H "Content-Type:

    application/json" GET

    https://management.azure.com/subscriptions/$0/resourceGroups/{resourceGroupNa

    me}/providers/Microsoft.Sql/servers/{serverName}/encryptionProtector?apiversion=2015-05-01-preview''

    Ensure the output of the command contains properties

    kind set to azurekeyvault

    serverKeyType set to AzureKeyVault

    uri is not null'
  remediation: 'Azure Console:

    Go to SQL servers

    For the desired server instance

