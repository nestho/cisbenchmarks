- id: '3.3'
  title: Ensure Storage logging is enabled for Queue service for read, write, and delete requests
  scoring: scored
  profile:
  - Level 2
  description: 'The Storage Queue service stores messages that may be read by any client who has access to the storage account.
    A queue can contain an unlimited number of messages, each of which can be up to 64KB in size using version 2011-08-18
    or newer. Storage Logging happens server-side and allows details for both successful and failed requests to be recorded
    in the storage account. These logs allow users to see the details of read, write, and delete operations against the queues.
    Storage Logging log entries contain the following information about individual requests: Timing information such as start
    time, end-to-end latency, and server latency, authentication details , concurrency information and the sizes of the request
    and response messages.'
  rationale: Storage Analytics logs contain detailed information about successful and failed requests to a storage service.
    This information can be used to monitor individual requests and to diagnose issues with a storage service. Requests are
    logged on a best-effort basis. Storage Analytics logging is not enabled by default for your storage account.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/enabling-storagelogging-and-accessing-log-data
  - 2. https://docs.microsoft.com/en-us/rest/api/storageservices/about-storageanalytics-logging
  page_start: 113
  audit_raw: '• Go to Storage Accounts.

