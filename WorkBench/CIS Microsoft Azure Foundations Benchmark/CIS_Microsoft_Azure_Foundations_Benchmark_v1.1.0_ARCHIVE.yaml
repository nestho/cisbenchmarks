- id: '1.16'
  title: Ensure that 'Self-service group management enabled' is set to 'No'
  scoring: scored
  profile:
  - Level 2
  description: Restrict group creation to administrators only. Restrict security group creation to administrators only.
  rationale: Self-service group management enables users to create and manage security groups or Office 365 groups in Azure
