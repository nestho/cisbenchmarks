- id: '8.3'
  title: Ensure that Resource Locks are set for mission critical Azure resources
  scoring: scored
  profile:
  - Level 2
  description: Resource Manager Locks provide a way for administrators to lock down Azure resources to prevent deletion or
    changing of a resource. These locks sit outside of the Role Based Access Controls (RBAC) hierarchy and, when applied,
    will place restrictions on the resource for all users. These are very useful when you have an important resource in your
    subscription that users should not be able to delete or change and can help prevent accidental and malicious changes or
    deletion.
  rationale: As an administrator, you may need to lock a subscription, resource group, or resource to prevent other users
    in your organization from accidentally deleting or modifying critical resources. You can set the lock level to CanNotDelete
    or ReadOnly to achieve this purpose. • CanNotDelete means authorized users can still read and modify a resource, but they
    can't delete the resource. • ReadOnly means authorized users can read a resource, but they can't delete or update the
    resource. Applying this lock is similar to restricting all authorized users to the permissions granted by the Reader role.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-grouplock-resources
  - 2. https://docs.microsoft.com/en-us/azure/azure-resource-manager/resourcemanager-subscription-governance#azure-resource-locks
