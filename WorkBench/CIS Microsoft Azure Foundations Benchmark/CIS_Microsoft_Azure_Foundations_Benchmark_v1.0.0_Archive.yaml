  title: Ensure that the expiry date is set on all Keys
  scoring: scored
  profile:
  - Level 1
  description: Ensure that all Keys in Azure Key Vault have an expiry time set.
  rationale: Azure Key Vault enables users to store and use cryptographic keys within the Microsoft Azure environment. The
    exp (expiration time) attribute identifies the expiration time on or after which the key MUST NOT be used for a cryptographic
    operation. By default, Keys never expire. It is thus recommended that you rotate your keys in the key vault and set an
    explicit expiry time for all keys. This ensures that the keys cannot be used beyond their assigned lifetimes.
  impact: Keys cannot be used beyond their assigned expiry times respectively. You would have to rotate your keys periodically
    at all places they are used.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/key-vault-whatis
