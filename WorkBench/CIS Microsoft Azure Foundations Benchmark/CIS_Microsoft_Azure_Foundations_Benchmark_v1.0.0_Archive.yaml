- id: '1.9'
  title: Ensure that 'Users can consent to apps accessing company data on their behalf' is set to 'No'
  scoring: scored
  profile:
  - Level 2
  description: Require administrators to provide consent for the apps before use.
  rationale: Until you are running Azure Active Directory as an identity provider for third-party applications, do not allow
    users to use the identity outside of your cloud environment. User's profile information contains private information such
    as phone number and email address which could then be sold off to other third parties without requiring any further consent
    from the user.
  impact: It might be an additional request that administrators need to fulfill quite often.
  references:
  - 1. https://blogs.msdn.microsoft.com/exchangedev/2014/06/05/managing-userconsent-for-applications-using-office-365-apis/
  - 2. https://nicksnettravels.builttoroam.com/post/2017/01/24/Admin-Consent-forPermissions-in-Azure-Active-Directory.aspx
  page_start: 31
