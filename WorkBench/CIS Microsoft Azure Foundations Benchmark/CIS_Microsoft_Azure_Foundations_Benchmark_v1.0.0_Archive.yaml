  title: Ensure that shared access signature tokens expire within an hour
  scoring: scored
  profile:
  - Level 1
  description: Expire shared access signature tokens within an hour.
  rationale: A shared access signature (SAS) is a URI that grants restricted access rights to Azure Storage resources. You
    can provide a shared access signature to clients who should not be trusted with your storage account key but whom you
    wish to delegate access to certain storage account resources. By distributing a shared access signature URI to these clients,
    you grant them access to a resource for a specified period of time. This time should be set to as low as possible and
    preferably should be within an hour.
  impact: None
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  page_start: 123
  audit_raw: 'You cannot currently audit SAS token expiry times created historically. Until Microsoft

    makes token expiry time as a setting rather than a token creation parameter, this

    recommendation would require a manual verification.'
