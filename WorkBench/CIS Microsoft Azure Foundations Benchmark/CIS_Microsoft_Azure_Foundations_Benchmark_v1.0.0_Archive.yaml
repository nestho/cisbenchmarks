  scoring: scored
  profile:
  - Level 1
  description: Enable data encryption is transit.
  rationale: The secure transfer option enhances the security of your storage account by only allowing requests to the storage
    account by a secure connection. For example, when calling REST APIs to access your storage accounts, you must connect
    using HTTPs. Any requests using HTTP will be rejected when 'secure transfer required' is enabled. When you are using the
    Azure files service, connection without encryption will fail, including scenarios using SMB 2.1, SMB 3.0 without encryption,
    and some flavors of the Linux SMB client. Because Azure storage doesn’t support HTTPs for custom domain names, this option
    is not applied when using a custom domain name.
