- id: '5.13'
  title: Ensure that logging for Azure KeyVault is 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Enable AuditEvent logging for Key Vault instances to ensure interactions with key vaults are logged and available.
  rationale: Monitoring how and when your key vaults are accessed, and by whom enables an audit trail of interactions with
    your secrets, keys and certificates managed by Azure Keyvault. You can do this by enabling logging for Key Vault, which
    saves information in an Azure storage account that you provide. This creates a new container named insights-logsauditevent
    automatically for your specified storage account, and you can use this same storage account for collecting logs for multiple
    key vaults.
  impact: None
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/key-vault-logging
  page_start: 190
  audit_raw: "Azure Console\n1. Go to Key vaults\n2. For each Key vault\n3. Go to Diagnostic Logs\n4. Click on Edit Settings\n\
    5. Ensure that Archive to a storage account is Enabled\n6. Ensure that AuditEvent is checked and the retention days is\
    \ set to 180 days or as\nappropriate\nAzure Command Line Interface 2.0\nList all key vaults\naz keyvault list\nFor each\
    \ keyvault id\naz monitor diagnostic-settings list --resource <id>\nEnsure that storageAccountId is set as appropriate.\
    \ Also, ensure that category and days\nare set. One of the sample outputs is as below.\n190 | P a g e\n\"logs\": [\n {\n\
    \ \"category\": \"AuditEvent\",\n \"enabled\": true,\n \"retentionPolicy\": {\n \"days\": 180,\n \"enabled\": true\n }\n\
    \ }\n ]"
  remediation: Follow Microsoft Azure documentation and setup Azure Key Vault Logging.
  checks:
  - type: manual_review
    info: 'Azure Console

      1. Go to Key vaults

      2. For each Key vault

      3. Go to Diagnostic Logs

      4. Click on Edit Settings

      5. Ensure that Archive to a storage account is Enabled

      6. Ensure that AuditEvent is checked and the retention days is set to 180 days or as

      appropriate

      Azure Command Line Interface 2.0

      List all key vaults

      az keyvault list

      For each keyvault id

      az monitor diagnostic-settings list --resource <id>

      Ensure that storageAccountId is set as appropriate. Also, ensure that category and days

      are set. O'
    severity: medium
