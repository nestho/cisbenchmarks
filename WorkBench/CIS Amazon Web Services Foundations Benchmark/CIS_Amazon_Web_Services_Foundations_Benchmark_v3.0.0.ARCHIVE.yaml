- id: '3.7'
  title: Ensure VPC flow logging is enabled in all VPCs
  scoring: scored
  profile:
  - Level 2
  description: VPC Flow Logs is a feature that enables you to capture information about the IP traffic going to and from network
    interfaces in your VPC. After you've created a flow log, you can view and retrieve its data in Amazon CloudWatch Logs.
    It is recommended that VPC Flow Logs be enabled for packet "Rejects" for VPCs.
  rationale: VPC Flow Logs provide visibility into network traffic that traverses the VPC and can be used to detect anomalous
    traffic or insight during security workflows.
  impact: 'By default, CloudWatch Logs will store Logs indefinitely unless a specific retention period is defined for the
    log group. When choosing the number of days to retain, keep in mind the average days it takes an organization to realize
    they have been breached is 210 days (at the time of this writing). Since additional time is required to research a breach,
    a minimum 365 day retention policy allows time for detection and research. You may also wish to archive the logs to a
    cheaper storage service rather than simply deleting them. See the following AWS resource to manage CloudWatch Logs retention
    periods: 1. https://docs.aws.amazon.com/AmazonCloudWatch/latest/DeveloperGuide/Settin gLogRetention.html'
  references:
  - 1. CCE-79202-8
  - 2. https://docs.aws.amazon.com/AmazonVPC/latest/UserGuide/flow-logs.html
  page_start: 130
  audit_raw: 'Perform the following to determine if VPC Flow logs are enabled:

    From Console:

    1. Sign into the management console

    2. Select Services then VPC

    3. In the left navigation pane, select Your VPCs

    4. Select a VPC

    5. In the right pane, select the Flow Logs tab.

    6. Ensure a Log Flow exists that has Active in the Status column.

    From Command Line:

    1. Run describe-vpcs command (OSX/Linux/UNIX) to list the VPC networks

    available in the current AWS region:

    aws ec2 describe-vpcs --region <region> --query Vpcs[].VpcId

    2. The command output returns the VpcId available in the selected region.

    3. Run describe-flow-logs command (OSX/Linux/UNIX) using the VPC ID to

    determine if the selected virtual network has the Flow Logs feature enabled:

    aws ec2 describe-flow-logs --filter "Name=resource-id,Values=<vpc-id>"

    4. If there are no Flow Logs created for the selected VPC, the command output will

    return an empty list [].

    5. Repeat step 3 for other VPCs available in the same region.

    6. Change the region by updating --region and repeat steps 1 - 5 for all the VPCs.'
  remediation: "Perform the following to determine if VPC Flow logs is enabled:\nFrom Console:\n1. Sign into the management\
    \ console\n2. Select Services then VPC\n3. In the left navigation pane, select Your VPCs\n4. Select a VPC\n5. In the right\
    \ pane, select the Flow Logs tab.\n6. If no Flow Log exists, click Create Flow Log\n7. For Filter, select Reject\n8. Enter\
    \ in a Role and Destination Log Group\n9. Click Create Log Flow\n10. Click on CloudWatch Logs Group\nNote: Setting the\
    \ filter to \"Reject\" will dramatically reduce the logging data accumulation\nfor this recommendation and provide sufficient\
    \ information for the purposes of breach\ndetection, research and remediation. However, during periods of least privilege\
    \ security\ngroup engineering, setting this the filter to \"All\" can be very helpful in discovering\nexisting traffic\
    \ flows required for proper operation of an already running environment.\nFrom Command Line:\n1. Create a policy document\
    \ and name it as role_policy_document.json and paste\nthe following content:\n{\n \"Version\": \"2012-10-17\",\n \"Statement\"\
    : [\n {\n \"Sid\": \"test\",\n \"Effect\": \"Allow\",\n \"Principal\": {\n \"Service\": \"ec2.amazonaws.com\"\n },\n \"\
    Action\": \"sts:AssumeRole\"\n }\n ]\n}\n2. Create another policy document and name it as iam_policy.json and paste the\n\
    following content:\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Action\":[\n\
    \ \"logs:CreateLogGroup\",\n \"logs:CreateLogStream\",\n \"logs:DescribeLogGroups\",\n \"logs:DescribeLogStreams\",\n\
    \ \"logs:PutLogEvents\",\n \"logs:GetLogEvents\",\n \"logs:FilterLogEvents\"\n ],\n \"Resource\": \"*\"\n }\n ]\n}\n3.\
    \ Run the below command to create an IAM role:\naws iam create-role --role-name <aws_support_iam_role> --assume-role-policydocument\
    \ file://<file-path>role_policy_document.json\n4. Run the below command to create an IAM policy:\naws iam create-policy\
    \ --policy-name <ami-policy-name> --policy-document\nfile://<file-path>iam-policy.json\n5. Run attach-group-policy command\
    \ using the IAM policy ARN returned at the\nprevious step to attach the policy to the IAM role (if the command succeeds,\
    \ no\noutput is returned):\naws iam attach-group-policy --policy-arn arn:aws:iam::<aws-accountid>:policy/<iam-policy-name>\
    \ --group-name <group-name>\n6. Run describe-vpcs to get the VpcId available in the selected region:\naws ec2 describe-vpcs\
    \ --region <region>\n7. The command output should return the VPC Id available in the selected region.\n8. Run create-flow-logs\
    \ to create a flow log for the vpc:\naws ec2 create-flow-logs --resource-type VPC --resource-ids <vpc-id> --\ntraffic-type\
    \ REJECT --log-group-name <log-group-name> --deliver-logspermission-arn <iam-role-arn>\n9. Repeat step 8 for other vpcs\
    \ available in the selected region.\n10. Change the region by updating --region and repeat remediation procedure for\n\
    other vpcs."
  checks:
  - type: manual_review
    info: 'Perform the following to determine if VPC Flow logs are enabled:

      From Console:

      1. Sign into the management console

