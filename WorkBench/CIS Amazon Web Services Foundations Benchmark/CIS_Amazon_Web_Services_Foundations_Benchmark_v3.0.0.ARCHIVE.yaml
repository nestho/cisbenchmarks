- id: '5.5'
  title: Ensure routing tables for VPC peering are "least access"
  scoring: manual
  profile:
  - Level 2
  description: Once a VPC peering connection is established, routing tables must be updated to establish any connections between
    the peered VPCs. These routes can be as specific as desired - even peering a VPC to only a single host on the other side
    of the connection.
  rationale: Being highly selective in peering routing tables is a very effective way of minimizing the impact of breach as
    resources outside of these routes are inaccessible to the peered VPC.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonVPC/latest/PeeringGuide/peeringconfigurations-partial-access.html
  - 2. https://docs.aws.amazon.com/cli/latest/reference/ec2/create-vpc-peeringconnection.html
  page_start: 215
  audit_raw: 'Review routing tables of peered VPCs for whether they route all subnets of each VPC

    and whether that is necessary to accomplish the intended purposes for peering the

    VPCs.

    From Command Line:

    1. List all the route tables from a VPC and check if "GatewayId" is pointing to a

    <peering_connection_id> (e.g. pcx-1a2b3c4d) and if "DestinationCidrBlock" is as

    specific as desired.

    aws ec2 describe-route-tables --filter "Name=vpc-id,Values=<vpc_id>" --query

    "RouteTables[*].{RouteTableId:RouteTableId, VpcId:VpcId, Routes:Routes,

    AssociatedSubnets:Associations[*].SubnetId}"'
  remediation: 'Remove and add route table entries to ensure that the least number of subnets or hosts

    as is required to accomplish the purpose for peering are routable.

    From Command Line:

    1. For each <route_table_id> containing routes non compliant with your routing

    policy (which grants more than desired "least access"), delete the non compliant

    route:

    aws ec2 delete-route --route-table-id <route_table_id> --destination-cidrblock <non_compliant_destination_CIDR>

    2. Create a new compliant route:

    aws ec2 create-route --route-table-id <route_table_id> --destination-cidrblock <compliant_destination_CIDR> --vpc-peering-connection-id

    <peering_connection_id>'
  checks:
  - type: manual_review
    info: 'Review routing tables of peered VPCs for whether they route all subnets of each VPC

      and whether that is necessary to accomplish the intended purposes for peering the

      VPCs.

      From Command Line:

      1. List all the route tables from a VPC and check if "GatewayId" is pointing to a

      <peering_connection_id> (e.g. pcx-1a2b3c4d) and if "DestinationCidrBlock" is as

      specific as desired.

      aws ec2 describe-route-tables --filter "Name=vpc-id,Values=<vpc_id>" --query

      "RouteTables[*].{RouteTableId:RouteTableId, VpcId'
    severity: medium
- id: '5.6'
  title: Ensure that EC2 Metadata Service only allows IMDSv2
  scoring: scored
  profile:
  - Level 1
  description: When enabling the Metadata Service on AWS EC2 instances, users have the option of using either Instance Metadata
    Service Version 1 (IMDSv1; a request/response method) or Instance Metadata Service Version 2 (IMDSv2; a session-oriented
    method).
  rationale: Instance metadata is data about your instance that you can use to configure or manage the running instance. Instance
    metadata is divided into categories, for example, host name, events, and security groups. When enabling the Metadata Service
    on AWS EC2 instances, users have the option of using either Instance Metadata Service Version 1 (IMDSv1; a request/response
    method) or Instance Metadata Service Version 2 (IMDSv2; a session-oriented method). With IMDSv2, every request is now
    protected by session authentication. A session begins and ends a series of requests that software running on an EC2 instance
    uses to access the locally-stored EC2 instance metadata and credentials. Allowing Version 1 of the service may open EC2
    instances to Server-Side Request Forgery (SSRF) attacks, so Amazon recommends utilizing Version 2 for better instance
    security.
  impact: ''
  references:
  - 1. https://aws.amazon.com/blogs/security/defense-in-depth-open-firewalls-reverseproxies-ssrf-vulnerabilities-ec2-instance-metadata-service/
  - 2. https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-instances.html
  page_start: 217
  audit_raw: 'From Console:

    1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at

    https://console.aws.amazon.com/ec2/.

    2. In the left navigation panel, under the INSTANCES section, choose Instances.

    3. Select the EC2 instance that you want to examine.

    4. Check for the IMDSv2 status, and ensure that it is set to Required.

    From Command Line:

    1. Run the describe-instances command using appropriate filtering to list the IDs

    of all the existing EC2 instances currently available in the selected region:

    aws ec2 describe-instances --region <region-name> --output table --query

    "Reservations[*].Instances[*].InstanceId"

    2. The command output should return a table with the requested instance IDs.

    3. Now run the describe-instances command using an instance ID returned at the

    previous step and custom filtering to determine whether the selected instance

    has IMDSv2:

    aws ec2 describe-instances --region <region-name> --instance-ids <instanceid> --query "Reservations[*].Instances[*].MetadataOptions"
    --output table

    4. Ensure for all ec2 instances HttpTokens is set to required and State is set to

    applied.

    5. Repeat steps no. 3 and 4 to verify other EC2 instances provisioned within the

    current region.

    6. Repeat steps no. 1 – 5 to perform the audit process for other AWS regions.'
  remediation: "From Console:\n1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at\nhttps://console.aws.amazon.com/ec2/.\n\
    2. In the left navigation panel, under the INSTANCES section, choose Instances.\n3. Select the EC2 instance that you want\
    \ to examine.\n4. Choose Actions > Instance Settings > Modify instance metadata options.\n5. Ensure Instance metadata\
    \ service is set to Enable and set IMDSv2 to Required.\n6. Repeat steps no. 1 – 5 to perform the remediation process for\
    \ other EC2\nInstances in the all applicable AWS region(s).\nFrom Command Line:\n1. Run the describe-instances command\
    \ using appropriate filtering to list the IDs\nof all the existing EC2 instances currently available in the selected region:\n\
    \ aws ec2 describe-instances --region <region-name> --output table --\nquery \"Reservations[*].Instances[*].InstanceId\"\
    \n2. The command output should return a table with the requested instance IDs.\n3. Now run the modify-instance-metadata-options\
    \ command using an instance ID\nreturned at the previous step to update the Instance Metadata Version:\n aws ec2 modify-instance-metadata-options\
    \ --instance-id <instance-id>\n--http-tokens required --region <region-name>\n4. Repeat steps no. 1 – 3 to perform the\
    \ remediation process for other EC2\nInstances in the same AWS region.\n5. Change the region by updating --region and\
    \ repeat the entire process for other\nregions."
  checks:
  - type: manual_review
    info: 'From Console:

      1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at

