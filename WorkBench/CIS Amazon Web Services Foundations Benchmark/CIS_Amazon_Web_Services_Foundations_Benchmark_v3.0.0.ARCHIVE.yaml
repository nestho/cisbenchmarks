- id: 2.1.4
  title: Ensure that S3 Buckets are configured with 'Block public access (bucket settings)'
  scoring: scored
  profile:
  - Level 1
  description: Amazon S3 provides Block public access (bucket settings) and Block public access (account settings) to help
    you manage public access to Amazon S3 resources. By default, S3 buckets and objects are created with public access disabled.
    However, an IAM principal with sufficient S3 permissions can enable public access at the bucket and/or object level. While
    enabled, Block public access (bucket settings) prevents an individual bucket, and its contained objects, from becoming
    publicly accessible. Similarly, Block public access (account settings) prevents all buckets, and contained objects, from
    becoming publicly accessible across the entire account.
  rationale: Amazon S3 Block public access (bucket settings) prevents the accidental or malicious public exposure of data
    contained within the respective bucket(s). Amazon S3 Block public access (account settings) prevents the accidental or
    malicious public exposure of data contained within all buckets of the respective AWS account. Whether blocking public
    access to all or some buckets is an organizational decision that should be based on data sensitivity, least privilege,
    and use case.
  impact: When you apply Block Public Access settings to an account, the settings apply to all AWS Regions globally. The settings
    might not take effect in all Regions immediately or simultaneously, but they eventually propagate to all Regions.
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/user-guide/block-public-accessaccount.html
  page_start: 83
  audit_raw: "If utilizing Block Public Access (bucket settings)\nFrom Console:\n1. Login to AWS Management Console and open\
    \ the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/\n2. Select the Check box next to the Bucket.\n3. Click\
    \ on 'Edit public access settings'.\n4. Ensure that block public access settings are set appropriately for this bucket\n\
    5. Repeat for all the buckets in your AWS account.\nFrom Command Line:\n1. List all of the S3 Buckets\naws s3 ls\n2. Find\
    \ the public access setting on that bucket\naws s3api get-public-access-block --bucket <name-of-the-bucket>\nOutput if\
    \ Block Public access is enabled:\n{\n \"PublicAccessBlockConfiguration\": {\n \"BlockPublicAcls\": true,\n \"IgnorePublicAcls\"\
    : true,\n \"BlockPublicPolicy\": true,\n \"RestrictPublicBuckets\": true\n }\n}\nIf the output reads false for the separate\
    \ configuration settings then proceed to the\nremediation.\nIf utilizing Block Public Access (account settings)\nFrom\
    \ Console:\n1. Login to AWS Management Console and open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/\n\
    2. Choose Block public access (account settings)\n3. Ensure that block public access settings are set appropriately for\
    \ your AWS\naccount.\nFrom Command Line:\nTo check Public access settings for this account status, run the following command,\n\
    aws s3control get-public-access-block --account-id <ACCT_ID> --region\n<REGION_NAME>\nOutput if Block Public access is\
    \ enabled:\n{\n \"PublicAccessBlockConfiguration\": {\n \"IgnorePublicAcls\": true,\n \"BlockPublicPolicy\": true,\n \"\
    BlockPublicAcls\": true,\n \"RestrictPublicBuckets\": true\n }\n}\nIf the output reads false for the separate configuration\
    \ settings then proceed to the\nremediation."
  remediation: 'If utilizing Block Public Access (bucket settings)

    From Console:

    1. Login to AWS Management Console and open the Amazon S3 console using

    https://console.aws.amazon.com/s3/

    2. Select the Check box next to the Bucket.

    3. Click on ''Edit public access settings''.

    4. Click ''Block all public access''

    5. Repeat for all the buckets in your AWS account that contain sensitive data.

    From Command Line:

    1. List all of the S3 Buckets

    aws s3 ls

    2. Set the Block Public Access to true on that bucket

    aws s3api put-public-access-block --bucket <name-of-bucket> --public-accessblock-configuration

    "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPu

    blicBuckets=true"

    If utilizing Block Public Access (account settings)

    From Console:

    If the output reads true for the separate configuration settings then it is set on the

    account.

    1. Login to AWS Management Console and open the Amazon S3 console using

    https://console.aws.amazon.com/s3/

    2. Choose Block Public Access (account settings)

    3. Choose Edit to change the block public access settings for all the buckets in

    your AWS account

    4. Choose the settings you want to change, and then choose Save. For details

    about each setting, pause on the i icons.

    5. When you''re asked for confirmation, enter confirm. Then Click Confirm to save

    your changes.

    From Command Line:

    To set Block Public access settings for this account, run the following command:

    aws s3control put-public-access-block

    --public-access-block-configuration BlockPublicAcls=true,

    IgnorePublicAcls=true, BlockPublicPolicy=true, RestrictPublicBuckets=true

    --account-id <value>'
  checks:
  - type: manual_review
    info: 'If utilizing Block Public Access (bucket settings)

      From Console:

      1. Login to AWS Management Console and open the Amazon S3 console using

      https://console.aws.amazon.com/s3/

      2. Select the Check box next to the Bucket.

      3. Click on ''Edit public access settings''.

      4. Ensure that block public access settings are set appropriately for this bucket

      5. Repeat for all the buckets in your AWS account.

      From Command Line:

      1. List all of the S3 Buckets

      aws s3 ls

      2. Find the public access setting on that bucket

      '
    severity: medium
- id: 2.2.1
  title: Ensure EBS Volume Encryption is Enabled in all Regions
  scoring: scored
  profile:
  - Level 1
  description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service. While
    disabled by default, forcing encryption at EBS volume creation is supported.
  rationale: Encrypting data at rest reduces the likelihood that it is unintentionally exposed and can nullify the impact
    of disclosure if the encryption remains unbroken.
  impact: Losing access or removing the KMS key in use by the EBS volumes will result in no longer being able to access the
    volumes.
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
  - 2. https://aws.amazon.com/blogs/aws/new-opt-in-to-default-encryption-for-new-ebsvolumes/
  page_start: 88
  audit_raw: 'From Console:

    1. Login to AWS Management Console and open the Amazon EC2 console using

    https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Verify Always encrypt new EBS volumes displays Enabled.

    4. Review every region in-use.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 get-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Review every region in-use.

    Note: EBS volume encryption is configured per region.'
  remediation: 'From Console:

    1. Login to AWS Management Console and open the Amazon EC2 console using

    https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Click Manage.

    4. Click the Enable checkbox.

    5. Click Update EBS encryption

    6. Repeat for every region requiring the change.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 enable-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Repeat every region requiring the change.

    Note: EBS volume encryption is configured per region.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to AWS Management Console and open the Amazon EC2 console using

      https://console.aws.amazon.com/ec2/

      2. Under Account attributes, click EBS encryption.

      3. Verify Always encrypt new EBS volumes displays Enabled.

      4. Review every region in-use.

      Note: EBS volume encryption is configured per region.

      From Command Line:

      1. Run

      aws --region <region> ec2 get-ebs-encryption-by-default

      2. Verify that "EbsEncryptionByDefault": true is displayed.

      3. Review every region in-use.

      Note: EBS'
    severity: medium
- id: 2.3.1
  title: Ensure that encryption-at-rest is enabled for RDS Instances
  scoring: scored
  profile:
  - Level 1
  description: Amazon RDS encrypted DB instances use the industry standard AES-256 encryption algorithm to encrypt your data
    on the server that hosts your Amazon RDS DB instances. After your data is encrypted, Amazon RDS handles authentication
    of access and decryption of your data transparently with a minimal impact on performance.
  rationale: Databases are likely to hold sensitive and critical data, it is highly recommended to implement encryption in
    order to protect your data from unauthorized access or disclosure. With RDS encryption enabled, the data stored on the
    instance's underlying storage, the automated backups, read replicas, and snapshots, are all encrypted.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryptio
  - 2. https://aws.amazon.com/blogs/database/selecting-the-right-encryption-optionsfor-amazon-rds-and-amazon-aurora-databaseengines/#:~:text=With%20RDS%2Dencrypted%20resources%2C%20data,transp
  page_start: 92
  audit_raw: 'From Console:

    1. Login to the AWS Management Console and open the RDS dashboard at

    https://console.aws.amazon.com/rds/

    2. In the navigation pane, under RDS dashboard, click Databases.

    3. Select the RDS Instance that you want to examine

    4. Click Instance Name to see details, then click on Configuration tab.

    5. Under Configuration Details section, In Storage pane search for the Encryption

    Enabled Status.

    6. If the current status is set to Disabled, Encryption is not enabled for the selected

    RDS Instance database instance.

    7. Repeat steps 3 to 7 to verify encryption status of other RDS Instance in same

    region.

    8. Change region from the top of the navigation bar and repeat audit for other

    regions.

    From Command Line:

    1. Run describe-db-instances command to list all RDS Instance database names,

    available in the selected AWS region, Output will return each Instance database

    identifier-name.

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. Run again describe-db-instances command using the RDS Instance identifier

    returned earlier, to determine if the selected database instance is encrypted, The

    command output should return the encryption status True Or False.

    aws rds describe-db-instances --region <region-name> --db-instance-identifier

    <DB-Name> --query ''DBInstances[*].StorageEncrypted''

    3. If the StorageEncrypted parameter value is False, Encryption is not enabled for

    the selected RDS database instance.

    4. Repeat steps 1 to 3 for auditing each RDS Instance and change Region to verify

    for other regions'
  remediation: 'From Console:

    1. Login to the AWS Management Console and open the RDS dashboard at

    https://console.aws.amazon.com/rds/.

    2. In the left navigation panel, click on Databases

    3. Select the Database instance that needs to be encrypted.

    4. Click on Actions button placed at the top right and select Take Snapshot.

    5. On the Take Snapshot page, enter a database name of which you want to take a

    snapshot in the Snapshot Name field and click on Take Snapshot.

    6. Select the newly created snapshot and click on the Action button placed at the

    top right and select Copy snapshot from the Action menu.

    7. On the Make Copy of DB Snapshot page, perform the following:

    • In the New DB Snapshot Identifier field, Enter a name for the new snapshot.

    • Check Copy Tags, New snapshot must have the same tags as the source

    snapshot.

    • Select Yes from the Enable Encryption dropdown list to enable encryption, You

    can choose to use the AWS default encryption key or custom key from Master

    Key dropdown list.

    8. Click Copy Snapshot to create an encrypted copy of the selected instance

    snapshot.

    9. Select the new Snapshot Encrypted Copy and click on the Action button placed

    at the top right and select Restore Snapshot button from the Action menu, This

    will restore the encrypted snapshot to a new database instance.

    10. On the Restore DB Instance page, enter a unique name for the new database

    instance in the DB Instance Identifier field.

    11. Review the instance configuration details and click Restore DB Instance.

    12. As the new instance provisioning process is completed can update application

    configuration to refer to the endpoint of the new Encrypted database instance

    Once the database endpoint is changed at the application level, can remove the

    unencrypted instance.

    From Command Line:

    1. Run describe-db-instances command to list all RDS database names available

    in the selected AWS region, The command output should return the database

    instance identifier.

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. Run create-db-snapshot command to create a snapshot for the selected

    database instance, The command output will return the new snapshot with name

    DB Snapshot Name.

    aws rds create-db-snapshot --region <region-name> --db-snapshot-identifier

    <DB-Snapshot-Name> --db-instance-identifier <DB-Name>

    3. Now run list-aliases command to list the KMS keys aliases available in a

    specified region, The command output should return each key alias currently

    available. For our RDS encryption activation process, locate the ID of the AWS

    default KMS key.

    aws kms list-aliases --region <region-name>

    4. Run copy-db-snapshot command using the default KMS key ID for RDS

    instances returned earlier to create an encrypted copy of the database instance

    snapshot, The command output will return the encrypted instance snapshot

    configuration.

    aws rds copy-db-snapshot --region <region-name> --source-db-snapshotidentifier <DB-Snapshot-Name> --target-db-snapshot-identifier
    <DB-SnapshotName-Encrypted> --copy-tags --kms-key-id <KMS-ID-For-RDS>

    5. Run restore-db-instance-from-db-snapshot command to restore the encrypted

    snapshot created at the previous step to a new database instance, If successful,

    the command output should return the new encrypted database instance

    configuration.

    aws rds restore-db-instance-from-db-snapshot --region <region-name> --dbinstance-identifier <DB-Name-Encrypted> --db-snapshot-identifier
    <DBSnapshot-Name-Encrypted>

    6. Run describe-db-instances command to list all RDS database names, available

    in the selected AWS region, Output will return database instance identifier name

    Select encrypted database name that we just created DB-Name-Encrypted.

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    7. Run again describe-db-instances command using the RDS instance identifier

    returned earlier, to determine if the selected database instance is encrypted, The

    command output should return the encryption status True.

    aws rds describe-db-instances --region <region-name> --db-instance-identifier

    <DB-Name-Encrypted> --query ''DBInstances[*].StorageEncrypted'''
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the AWS Management Console and open the RDS dashboard at

      https://console.aws.amazon.com/rds/

      2. In the navigation pane, under RDS dashboard, click Databases.

      3. Select the RDS Instance that you want to examine

      4. Click Instance Name to see details, then click on Configuration tab.

      5. Under Configuration Details section, In Storage pane search for the Encryption

      Enabled Status.

      6. If the current status is set to Disabled, Encryption is not enabled for the selected

      RDS In'
    severity: medium
- id: 2.3.2
  title: Ensure Auto Minor Version Upgrade feature is Enabled for RDS Instances
  scoring: scored
  profile:
  - Level 1
  description: Ensure that RDS database instances have the Auto Minor Version Upgrade flag enabled in order to receive automatically
    minor engine upgrades during the specified maintenance window. So, RDS instances can get the new features, bug fixes,
    and security patches for their database engines.
  rationale: AWS RDS will occasionally deprecate minor engine versions and provide new ones for an upgrade. When the last
    version number within the release is replaced, the version changed is considered minor. With Auto Minor Version Upgrade
    feature enabled, the version upgrades will occur automatically during the specified maintenance window so your RDS instances
    can get the new features, bug fixes, and security patches for their database engines.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_RDS_Mana
  - 2. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDB
  page_start: 96
  audit_raw: 'From Console:

    1. Log in to the AWS management console and navigate to the RDS dashboard at

    https://console.aws.amazon.com/rds/.

    2. In the left navigation panel, click on Databases.

    3. Select the RDS instance that wants to examine.

    4. Click on the Maintenance and backups panel.

    5. Under the Maintenance section, search for the Auto Minor Version Upgrade

    status.

    • If the current status is set to Disabled, means the feature is not set and the minor

    engine upgrades released will not be applied to the selected RDS instance

    From Command Line:

    1. Run describe-db-instances command to list all RDS database names, available

    in the selected AWS region:

    aws rds describe-db-instances --region <regionName> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. The command output should return each database instance identifier.

    3. Run again describe-db-instances command using the RDS instance identifier

    returned earlier to determine the Auto Minor Version Upgrade status for the

    selected instance:

    aws rds describe-db-instances --region <regionName> --db-instance-identifier

    <dbInstanceIdentifier> --query ''DBInstances[*].AutoMinorVersionUpgrade''

    4. The command output should return the feature current status. If the current

    status is set to true, the feature is enabled and the minor engine upgrades will

    be applied to the selected RDS instance.'
  remediation: 'From Console:

    1. Log in to the AWS management console and navigate to the RDS dashboard at

    https://console.aws.amazon.com/rds/.

    2. In the left navigation panel, click on Databases.

    3. Select the RDS instance that wants to update.

    4. Click on the Modify button placed on the top right side.

    5. On the Modify DB Instance: <instance identifier> page, In the Maintenance

    section, select Auto minor version upgrade click on the Yes radio button.

    6. At the bottom of the page click on Continue, check to Apply Immediately to apply

    the changes immediately, or select Apply during the next scheduled

    maintenance window to avoid any downtime.

    7. Review the changes and click on Modify DB Instance. The instance status

    should change from available to modifying and back to available. Once the

    feature is enabled, the Auto Minor Version Upgrade status should change to

    Yes.

    From Command Line:

    1. Run describe-db-instances command to list all RDS database instance names,

    available in the selected AWS region:

    aws rds describe-db-instances --region <regionName> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. The command output should return each database instance identifier.

    3. Run the modify-db-instance command to modify the selected RDS instance

    configuration this command will apply the changes immediately, Remove --

    apply-immediately to apply changes during the next scheduled maintenance

    window and avoid any downtime:

    aws rds modify-db-instance --region <regionName> --db-instance-identifier

    <dbInstanceIdentifier> --auto-minor-version-upgrade --apply-immediately

    4. The command output should reveal the new configuration metadata for the RDS

    instance and check AutoMinorVersionUpgrade parameter value.

    5. Run describe-db-instances command to check if the Auto Minor Version

    Upgrade feature has been successfully enable:

    aws rds describe-db-instances --region <regionName> --db-instance-identifier

    <dbInstanceIdentifier> --query ''DBInstances[*].AutoMinorVersionUpgrade''

    6. The command output should return the feature current status set to true, the

    feature is enabled and the minor engine upgrades will be applied to the selected

    RDS instance.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Log in to the AWS management console and navigate to the RDS dashboard at

      https://console.aws.amazon.com/rds/.

      2. In the left navigation panel, click on Databases.

      3. Select the RDS instance that wants to examine.

      4. Click on the Maintenance and backups panel.

      5. Under the Maintenance section, search for the Auto Minor Version Upgrade

      status.

      • If the current status is set to Disabled, means the feature is not set and the minor

      engine upgrades released will not be applied to the'
    severity: medium
- id: 2.3.3
  title: Ensure that public access is not given to RDS Instance
  scoring: scored
  profile:
  - Level 1
  description: Ensure and verify that RDS database instances provisioned in your AWS account do restrict unauthorized access
    in order to minimize security risks. To restrict access to any publicly accessible RDS database instance, you must disable
    the database Publicly Accessible flag and update the VPC security group associated with the instance.
  rationale: Ensure that no public-facing RDS database instances are provisioned in your AWS account and restrict unauthorized
    access in order to minimize security risks. When the RDS instance allows unrestricted access (0.0.0.0/0), everyone and
    everything on the Internet can establish a connection to your database and this can increase the opportunity for malicious
    activities such as brute force attacks, PostgreSQL injections, or DoS/DDoS attacks.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.htm
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Scenario2.html
  page_start: 99
  audit_raw: 'From Console:

    1. Log in to the AWS management console and navigate to the RDS dashboard at

    https://console.aws.amazon.com/rds/.

    2. Under the navigation panel, On RDS Dashboard, click Databases.

    3. Select the RDS instance that you want to examine.

    4. Click Instance Name from the dashboard, Under `Connectivity and Security.

    5. On the Security, check if the Publicly Accessible flag status is set to Yes, follow

    the below-mentioned steps to check database subnet access.

    • In the networking section, click the subnet link available under Subnets

    • The link will redirect you to the VPC Subnets page.

    • Select the subnet listed on the page and click the Route Table tab from the

    dashboard bottom panel. If the route table contains any entries with the

    destination CIDR block set to 0.0.0.0/0 and with an Internet Gateway

    attached.

    • The selected RDS database instance was provisioned inside a public subnet,

    therefore is not running within a logically isolated environment and can be

    accessible from the Internet.

    6. Repeat steps no. 4 and 5 to determine the type (public or private) and subnet for

    other RDS database instances provisioned in the current region.

    7. Change the AWS region from the navigation bar and repeat the audit process for

    other regions.

    From Command Line:

    1. Run describe-db-instances command to list all RDS database names, available

    in the selected AWS region:

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. The command output should return each database instance identifier.

    3. Run again describe-db-instances command using the PubliclyAccessible

    parameter as query filter to reveal the database instance Publicly Accessible flag

    status:

    aws rds describe-db-instances --region <region-name> --db-instance-identifier

    <db-instance-name> --query ''DBInstances[*].PubliclyAccessible''

    4. Check for the Publicly Accessible parameter status, If the Publicly Accessible flag

    is set to Yes. Then selected RDS database instance is publicly accessible and

    insecure, follow the below-mentioned steps to check database subnet access

    5. Run again describe-db-instances command using the RDS database instance

    identifier that you want to check and appropriate filtering to describe the VPC

    subnet(s) associated with the selected instance:

    aws rds describe-db-instances --region <region-name> --db-instance-identifier

    <db-name> --query ''DBInstances[*].DBSubnetGroup.Subnets[]''

    • The command output should list the subnets available in the selected database

    subnet group.

    6. Run describe-route-tables command using the ID of the subnet returned at the

    previous step to describe the routes of the VPC route table associated with the

    selected subnet:

    aws ec2 describe-route-tables --region <region-name> --filters

    "Name=association.subnet-id,Values=<SubnetID>" --query

    ''RouteTables[*].Routes[]''

    • If the command returns the route table associated with database instance subnet

    ID. Check the GatewayId and DestinationCidrBlock attributes values returned in

    the output. If the route table contains any entries with the GatewayId value set to

    igw-xxxxxxxx and the DestinationCidrBlock value set to 0.0.0.0/0, the

    selected RDS database instance was provisioned inside a public subnet.

    • Or

    • If the command returns empty results, the route table is implicitly associated with

    subnet, therefore the audit process continues with the next step

    7. Run again describe-db-instances command using the RDS database instance

    identifier that you want to check and appropriate filtering to describe the VPC ID

    associated with the selected instance:

    aws rds describe-db-instances --region <region-name> --db-instance-identifier

    <db-name> --query ''DBInstances[*].DBSubnetGroup.VpcId''

    • The command output should show the VPC ID in the selected database subnet

    group

    8. Now run describe-route-tables command using the ID of the VPC returned at

    the previous step to describe the routes of the VPC main route table implicitly

    associated with the selected subnet:

    aws ec2 describe-route-tables --region <region-name> --filters "Name=vpcid,Values=<VPC-ID>" "Name=association.main,Values=true"
    --query

    ''RouteTables[*].Routes[]''

    • The command output returns the VPC main route table implicitly associated with

    database instance subnet ID. Check the GatewayId and DestinationCidrBlock

    attributes values returned in the output. If the route table contains any entries

    with the GatewayId value set to igw-xxxxxxxx and the DestinationCidrBlock

    value set to 0.0.0.0/0, the selected RDS database instance was provisioned

    inside a public subnet, therefore is not running within a logically isolated

    environment and does not adhere to AWS security best practices.'
  remediation: 'From Console:

    1. Log in to the AWS management console and navigate to the RDS dashboard at

    https://console.aws.amazon.com/rds/.

    2. Under the navigation panel, On RDS Dashboard, click Databases.

    3. Select the RDS instance that you want to update.

    4. Click Modify from the dashboard top menu.

    5. On the Modify DB Instance panel, under the Connectivity section, click on

    Additional connectivity configuration and update the value for Publicly

    Accessible to Not publicly accessible to restrict public access. Follow the below

    steps to update subnet configurations:

    • Select the Connectivity and security tab, and click on the VPC attribute value

    inside the Networking section.

    • Select the Details tab from the VPC dashboard bottom panel and click on Route

    table configuration attribute value.

    • On the Route table details page, select the Routes tab from the dashboard

    bottom panel and click on Edit routes.

    • On the Edit routes page, update the Destination of Target which is set to igwxxxxx and click on Save routes.

    6. On the Modify DB Instance panel Click on Continue and In the Scheduling of

    modifications section, perform one of the following actions based on your

    requirements:

    • Select Apply during the next scheduled maintenance window to apply the

    changes automatically during the next scheduled maintenance window.

    • Select Apply immediately to apply the changes right away. With this option, any

    pending modifications will be asynchronously applied as soon as possible,

    regardless of the maintenance window setting for this RDS database instance.

    Note that any changes available in the pending modifications queue are also

    applied. If any of the pending modifications require downtime, choosing this

    option can cause unexpected downtime for the application.

    7. Repeat steps 3 to 6 for each RDS instance available in the current region.

    8. Change the AWS region from the navigation bar to repeat the process for other

    regions.

    From Command Line:

    1. Run describe-db-instances command to list all RDS database names

    identifiers, available in the selected AWS region:

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. The command output should return each database instance identifier.

    3. Run modify-db-instance command to modify the selected RDS instance

    configuration. Then use the following command to disable the Publicly

    Accessible flag for the selected RDS instances. This command use the applyimmediately flag. If you want to avoid any downtime
    --no-apply-immediately

    flag can be used:

    aws rds modify-db-instance --region <region-name> --db-instance-identifier

    <db-name> --no-publicly-accessible --apply-immediately

    4. The command output should reveal the PubliclyAccessible configuration under

    pending values and should get applied at the specified time.

    5. Updating the Internet Gateway Destination via AWS CLI is not currently

    supported To update information about Internet Gateway use the AWS Console

    Procedure.

    6. Repeat steps 1 to 5 for each RDS instance provisioned in the current region.

    7. Change the AWS region by using the --region filter to repeat the process for

    other regions.'
  checks:
  - type: sql
    command: Select the RDS instance that you want to examine.
    severity: medium
    info: 'From Console:

      1. Log in to the AWS management console and navigate to the RDS dashboard at

      https://console.aws.amazon.com/rds/.

      2. Under the navigation panel, On RDS Dashboard, click Databases.

      3. Select the RDS instance that you want to examine.

      4. Click Instance Name from the dashboard, Under `Connectivity and Security.

      5. On the Security, check if the Publicly Accessible flag status is set to Y'
- id: 2.4.1
  title: Ensure that encryption is enabled for EFS file systems
  scoring: scored
  profile:
  - Level 1
  description: EFS data should be encrypted at rest using AWS KMS (Key Management Service).
  rationale: Data should be encrypted at rest to reduce the risk of a data breach via direct access to the storage device.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/efs/index.ht
  page_start: 105
  audit_raw: 'From Console:

    1. Login to the AWS Management Console and Navigate to `Elastic File System

    (EFS) dashboard.

    2. Select File Systems from the left navigation panel.

    3. Each item on the list has a visible Encrypted field that displays data at rest

    encryption status.

    4. Validate that this field reads Encrypted for all EFS file systems in all AWS

    regions.

    From CLI:

    1. Run describe-file-systems command using custom query filters to list the

    identifiers of all AWS EFS file systems currently available within the selected

    region:

    aws efs describe-file-systems --region <region> --output table --query

    ''FileSystems[*].FileSystemId''

    2. The command output should return a table with the requested file system IDs.

    3. Run describe-file-systems command using the ID of the file system that you want

    to examine as identifier and the necessary query filters:

    aws efs describe-file-systems --region <region> --file-system-id <filesystem-id from step 2 output> --query ''FileSystems[*].Encrypted''

    4. The command output should return the file system encryption status true or false.

    If the returned value is false, the selected AWS EFS file system is not encrypted

    and if the returned value is true, the selected AWS EFS file system is encrypted.'
  remediation: 'It is important to note that EFS file system data at rest encryption must be turned

    on when creating the file system.

    If an EFS file system has been created without data at rest encryption enabled then you

    must create another EFS file system with the correct configuration and transfer the data.

    Steps to create an EFS file system with data encrypted at rest:

    From Console:

    1. Login to the AWS Management Console and Navigate to Elastic File System

    (EFS) dashboard.

    2. Select File Systems from the left navigation panel.

    3. Click Create File System button from the dashboard top menu to start the file

    system setup process.

    4. On the Configure file system access configuration page, perform the following

    actions.

    • Choose the right VPC from the VPC dropdown list.

    • Within Create mount targets section, select the checkboxes for all of the

    Availability Zones (AZs) within the selected VPC. These will be your mount

    targets.

    • Click Next step to continue.

    5. Perform the following on the Configure optional settings page.

    • Create tags to describe your new file system.

    • Choose performance mode based on your requirements.

    • Check Enable encryption checkbox and choose aws/elasticfilesystem from

    Select KMS master key dropdown list to enable encryption for the new file

    system using the default master key provided and managed by AWS KMS.

    • Click Next step to continue.

    6. Review the file system configuration details on the review and create page and

    then click Create File System to create your new AWS EFS file system.

    7. Copy the data from the old unencrypted EFS file system onto the newly create

    encrypted file system.

    8. Remove the unencrypted file system as soon as your data migration to the newly

    create encrypted file system is completed.

    9. Change the AWS region from the navigation bar and repeat the entire process

    for other aws regions.

    From CLI:

    1. Run describe-file-systems command to describe the configuration information

    available for the selected (unencrypted) file system (see Audit section to identify

    the right resource):

    aws efs describe-file-systems --region <region> --file-system-id <filesystem-id from audit section step 2 output>

    2. The command output should return the requested configuration information.

    3. To provision a new AWS EFS file system, you need to generate a universally

    unique identifier (UUID) in order to create the token required by the create-filesystem command. To create the required
    token, you can use a randomly

    generated UUID from "https://www.uuidgenerator.net".

    4. Run create-file-system command using the unique token created at the previous

    step.

    aws efs create-file-system --region <region> --creation-token <Token

    (randomly generated UUID from step 3)> --performance-mode generalPurpose --

    encrypted

    5. The command output should return the new file system configuration metadata.

    6. Run create-mount-target command using the newly created EFS file system ID

    returned at the previous step as identifier and the ID of the Availability Zone (AZ)

    that will represent the mount target:

    aws efs create-mount-target --region <region> --file-system-id <file-systemid> --subnet-id <subnet-id>

    7. The command output should return the new mount target metadata.

    8. Now you can mount your file system from an EC2 instance.

    9. Copy the data from the old unencrypted EFS file system onto the newly create

    encrypted file system.

    10. Remove the unencrypted file system as soon as your data migration to the newly

    create encrypted file system is completed.

    aws efs delete-file-system --region <region> --file-system-id <unencryptedfile-system-id>

    11. Change the AWS region by updating the --region and repeat the entire process

    for other aws regions.'
  checks:
  - type: sql
    command: Select File Systems from the left navigation panel.
    severity: medium
    info: 'From Console:

      1. Login to the AWS Management Console and Navigate to `Elastic File System

      (EFS) dashboard.

      2. Select File Systems from the left navigation panel.

      3. Each item on the list has a visible Encrypted field that displays data at rest

      encryption status.

      4. Validate that this field reads Encrypted for all EFS file systems in all AWS

      regions.

      From CLI:

      1. Run describe-file-systems command u'
- id: '3.1'
  title: Ensure CloudTrail is enabled in all regions
  scoring: scored
  profile:
  - Level 1
  description: AWS CloudTrail is a web service that records AWS API calls for your account and delivers log files to you.
    The recorded information includes the identity of the API caller, the time of the API call, the source IP address of the
    API caller, the request parameters, and the response elements returned by the AWS service. CloudTrail provides a history
    of AWS API calls for an account, including API calls made via the Management Console, SDKs, command line tools, and higher-level
    AWS services (such as CloudFormation).
  rationale: The AWS API call history produced by CloudTrail enables security analysis, resource change tracking, and compliance
    auditing. Additionally, • ensuring that a multi-regions trail exists will ensure that unexpected activity occurring in
    otherwise unused regions is detected • ensuring that a multi-regions trail exists will ensure that Global Service Logging
    is enabled for a trail by default to capture recording of events generated on AWS global services • for a multi-regions
    trail, ensuring that management events configured for all type of Read/Writes ensures recording of management operations
    that are performed on all resources in an AWS account
  impact: 'S3 lifecycle features can be used to manage the accumulation and management of logs over time. See the following
    AWS resource for more information on these features: 1. https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html'
  references:
  - 1. CCE-78913-1
  - 2. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrailconcepts.html#cloudtrail-concepts-management-events
  page_start: 110
  audit_raw: "Perform the following to determine if CloudTrail is enabled for all regions:\nFrom Console:\n1. Sign in to the\
    \ AWS Management Console and open the CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail\n2. Click on Trails\
    \ on the left navigation pane\n• You will be presented with a list of trails across all regions\n3. Ensure at least one\
    \ Trail has Yes specified in the Multi-region trail column\n4. Click on a trail via the link in the Name column\n5. Ensure\
    \ Logging is set to ON\n6. Ensure Multi-region trail is set to Yes\n7. In section Management Events ensure API activity\
    \ set to ALL\nFrom Command Line:\n aws cloudtrail describe-trails\nEnsure IsMultiRegionTrail is set to true\naws cloudtrail\
    \ get-trail-status --name <trailname shown in describe-trails>\nEnsure IsLogging is set to true\naws cloudtrail get-event-selectors\
    \ --trail-name <trailname shown in describetrails>\nEnsure there is at least one fieldSelector for a Trail that equals\
    \ Management\nThis should NOT output any results for Field: \"readOnly\" if either true or false is\nreturned one of the\
    \ checkboxes is not selected for read or write\nExample of correct output:\n\"TrailARN\": \"<your_trail_ARN>\",\n \"AdvancedEventSelectors\"\
    : [\n {\n \"Name\": \"Management events selector\",\n \"FieldSelectors\": [\n {\n \"Field\": \"eventCategory\",\n \"Equals\"\
    : [\n \"Management\"\n ]"
  remediation: 'Perform the following to enable global (Multi-region) CloudTrail logging:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/cloudtrail

    2. Click on Trails on the left navigation pane

    3. Click Get Started Now , if presented

    • Click Add new trail

    • Enter a trail name in the Trail name box

    • A trail created in the console is a multi-region trail by default

    • Specify an S3 bucket name in the S3 bucket box

    • Specify the AWS KMS alias under the Log file SSE-KMS encryption section or

    create a new key

    • Click Next

    4. Ensure Management events check box is selected.

    5. Ensure both Read and Write are check under API activity

    6. Click Next

    7. review your trail settings and click Create trail

    From Command Line:

    aws cloudtrail create-trail --name <trail_name> --bucket-name

    <s3_bucket_for_cloudtrail> --is-multi-region-trail

    aws cloudtrail update-trail --name <trail_name> --is-multi-region-trail

    Note: Creating CloudTrail via CLI without providing any overriding options configures

    Management Events to set All type of Read/Writes by default.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if CloudTrail is enabled for all regions:

      From Console:

      1. Sign in to the AWS Management Console and open the CloudTrail console at

      https://console.aws.amazon.com/cloudtrail

      2. Click on Trails on the left navigation pane

      • You will be presented with a list of trails across all regions

      3. Ensure at least one Trail has Yes specified in the Multi-region trail column

      4. Click on a trail via the link in the Name column

      5. Ensure Logging is set to ON

      6. Ensure Multi-'
    severity: medium
- id: '3.2'
  title: Ensure CloudTrail log file validation is enabled
  scoring: scored
  profile:
  - Level 2
  description: CloudTrail log file validation creates a digitally signed digest file containing a hash of each log that CloudTrail
    writes to S3. These digest files can be used to determine whether a log file was changed, deleted, or unchanged after
    CloudTrail delivered the log. It is recommended that file validation be enabled on all CloudTrails.
  rationale: Enabling log file validation will provide additional integrity checking of CloudTrail logs.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-filevalidation-enabling.html
  - 2. CCE-78914-9
  page_start: 113
  audit_raw: 'Perform the following on each trail to determine if log file validation is enabled:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/cloudtrail

    2. Click on Trails on the left navigation pane

    3. For Every Trail:

    • Click on a trail via the link in the Name column

    • Under the General details section, ensure Log file validation is set to

    Enabled

    From Command Line:

    aws cloudtrail describe-trails

    Ensure LogFileValidationEnabled is set to true for each trail'
  remediation: 'Perform the following to enable log file validation on a given trail:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/cloudtrail

    2. Click on Trails on the left navigation pane

    3. Click on target trail

    4. Within the General details section click edit

    5. Under the Advanced settings section

    6. Check the enable box under Log file validation

    7. Click Save changes

    From Command Line:

    aws cloudtrail update-trail --name <trail_name> --enable-log-file-validation

    Note that periodic validation of logs using these digests can be performed by running

    the following command:

    aws cloudtrail validate-logs --trail-arn <trail_arn> --start-time

    <start_time> --end-time <end_time>'
  checks:
