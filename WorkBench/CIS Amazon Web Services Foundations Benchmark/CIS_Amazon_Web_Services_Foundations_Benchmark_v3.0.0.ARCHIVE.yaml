- id: '1.13'
  title: Ensure there is only one active access key available for any single IAM user
  scoring: scored
  profile:
  - Level 1
  description: Access keys are long-term credentials for an IAM user or the AWS account 'root' user. You can use access keys
    to sign programmatic requests to the AWS CLI or AWS API (directly or using the AWS SDK)
  rationale: Access keys are long-term credentials for an IAM user or the AWS account 'root' user. You can use access keys
    to sign programmatic requests to the AWS CLI or AWS API. One of the best ways to protect your account is to not allow
    users to have multiple access keys.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/general/latest/gr/aws-access-keys-bestpractices.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_accesskeys.html
  page_start: 44
  audit_raw: 'From Console:

    1. Sign in to the AWS Management Console and navigate to IAM dashboard at

    https://console.aws.amazon.com/iam/.

    2. In the left navigation panel, choose Users.

    3. Click on the IAM user name that you want to examine.

    4. On the IAM user configuration page, select Security Credentials tab.

    5. Under Access Keys section, in the Status column, check the current status for

    each access key associated with the IAM user. If the selected IAM user has more

    than one access key activated then the users access configuration does not

    adhere to security best practices and the risk of accidental exposures increases.

    • Repeat steps no. 3 – 5 for each IAM user in your AWS account.

    From Command Line:

    1. Run list-users command to list all IAM users within your account:

    aws iam list-users --query "Users[*].UserName"

    The command output should return an array that contains all your IAM user names.

    2. Run list-access-keys command using the IAM user name list to return the

    current status of each access key associated with the selected IAM user:

    aws iam list-access-keys --user-name <user-name>

    The command output should expose the metadata ("Username", "AccessKeyId",

    "Status", "CreateDate") for each access key on that user account.

    3. Check the Status property value for each key returned to determine each keys

    current state. If the Status property value for more than one IAM access key is

    set to Active, the user access configuration does not adhere to this

    recommendation, refer to the remediation below.

    • Repeat steps no. 2 and 3 for each IAM user in your AWS account.'
  remediation: 'From Console:

    1. Sign in to the AWS Management Console and navigate to IAM dashboard at

    https://console.aws.amazon.com/iam/.

    2. In the left navigation panel, choose Users.

    3. Click on the IAM user name that you want to examine.

    4. On the IAM user configuration page, select Security Credentials tab.

    5. In Access Keys section, choose one access key that is less than 90 days old.

    This should be the only active key used by this IAM user to access AWS

    resources programmatically. Test your application(s) to make sure that the

    chosen access key is working.

    6. In the same Access Keys section, identify your non-operational access keys

    (other than the chosen one) and deactivate it by clicking the Make Inactive link.

    7. If you receive the Change Key Status confirmation box, click Deactivate to switch

    off the selected key.

    8. Repeat steps no. 3 – 7 for each IAM user in your AWS account.

    From Command Line:

    1. Using the IAM user and access key information provided in the Audit CLI,

    choose one access key that is less than 90 days old. This should be the only

    active key used by this IAM user to access AWS resources programmatically.

    Test your application(s) to make sure that the chosen access key is working.

    2. Run the update-access-key command below using the IAM user name and the

    non-operational access key IDs to deactivate the unnecessary key(s). Refer to

    the Audit section to identify the unnecessary access key ID for the selected IAM

    user

    Note - the command does not return any output:

    aws iam update-access-key --access-key-id <access-key-id> --status Inactive -

    -user-name <user-name>

    3. To confirm that the selected access key pair has been successfully deactivated

    run the list-access-keys audit command again for that IAM User:

    aws iam list-access-keys --user-name <user-name>

    • The command output should expose the metadata for each access key

    associated with the IAM user. If the non-operational key pair(s) Status is set to

    Inactive, the key has been successfully deactivated and the IAM user access

    configuration adheres now to this recommendation.

    4. Repeat steps no. 1 – 3 for each IAM user in your AWS account.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Sign in to the AWS Management Console and navigate to IAM dashboard at

      https://console.aws.amazon.com/iam/.

      2. In the left navigation panel, choose Users.

      3. Click on the IAM user name that you want to examine.

      4. On the IAM user configuration page, select Security Credentials tab.

      5. Under Access Keys section, in the Status column, check the current status for

      each access key associated with the IAM user. If the selected IAM user has more

      than one access key activated then the '
    severity: medium
- id: '1.14'
  title: Ensure access keys are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Access keys consist of an access key ID and secret access key, which are used to sign programmatic requests
    that you make to AWS. AWS users need their own access keys to make programmatic calls to AWS from the AWS Command Line
    Interface (AWS CLI), Tools for Windows PowerShell, the AWS SDKs, or direct HTTP calls using the APIs for individual AWS
    services. It is recommended that all access keys be regularly rotated.
  rationale: Rotating access keys will reduce the window of opportunity for an access key that is associated with a compromised
    or terminated account to be used. Access keys should be rotated to ensure that data cannot be accessed with an old key
    which might have been lost, cracked, or stolen.
  impact: ''
  references:
  - 1. CCE-78902-4
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#rotatecredentials
  page_start: 47
  audit_raw: 'Perform the following to determine if access keys are rotated as prescribed:

    From Console:

    1. Go to Management Console (https://console.aws.amazon.com/iam)

    2. Click on Users

    3. Click setting icon

    4. Select Console last sign-in

    5. Click Close

    6. Ensure that Access key age is less than 90 days ago. note) None in the Access

    key age means the user has not used the access key.

    From Command Line:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d

    The access_key_1_last_rotated and the access_key_2_last_rotated fields in this file

    notes The date and time, in ISO 8601 date-time format, when the user''s access key was

    created or last changed. If the user does not have an active access key, the value in

    this field is N/A (not applicable).'
  remediation: 'Perform the following to rotate access keys:

    From Console:

    1. Go to Management Console (https://console.aws.amazon.com/iam)

    2. Click on Users

    3. Click on Security Credentials

    4. As an Administrator

    o Click on Make Inactive for keys that have not been rotated in 90 Days

    5. As an IAM User

    o Click on Make Inactive or Delete for keys which have not been rotated or

    used in 90 Days

    6. Click on Create Access Key

    7. Update programmatic call with new Access Key credentials

    From Command Line:

    1. While the first access key is still active, create a second access key, which is

    active by default. Run the following command:

    aws iam create-access-key

    At this point, the user has two active access keys.

    2. Update all applications and tools to use the new access key.

    3. Determine whether the first access key is still in use by using this command:

    aws iam get-access-key-last-used

    4. One approach is to wait several days and then check the old access key for any

    use before proceeding.

    Even if step Step 3 indicates no use of the old key, it is recommended that you do not

    immediately delete the first access key. Instead, change the state of the first access key

    to Inactive using this command:

    aws iam update-access-key

    5. Use only the new access key to confirm that your applications are working. Any

    applications and tools that still use the original access key will stop working at

    this point because they no longer have access to AWS resources. If you find

    such an application or tool, you can switch its state back to Active to reenable the

    first access key. Then return to step Step 2 and update this application to use the

    new key.

    6. After you wait some period of time to ensure that all applications and tools have

    been updated, you can delete the first access key with this command:

    aws iam delete-access-key'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if access keys are rotated as prescribed:

      From Console:

      1. Go to Management Console (https://console.aws.amazon.com/iam)

      2. Click on Users

      3. Click setting icon

      4. Select Console last sign-in

      5. Click Close

      6. Ensure that Access key age is less than 90 days ago. note) None in the Access

      key age means the user has not used the access key.

      From Command Line:

      aws iam generate-credential-report

      aws iam get-credential-report --query ''Content'' --output text | base64 '
    severity: medium
- id: '1.15'
  title: Ensure IAM Users Receive Permissions Only Through Groups
  scoring: scored
  profile:
  - Level 1
  description: 'IAM users are granted access to services, functions, and data through IAM policies. There are four ways to
    define policies for a user: 1) Edit the user policy directly, aka an inline, or user, policy; 2) attach a policy directly
    to a user; 3) add the user to an IAM group that has an attached policy; 4) add the user to an IAM group that has an inline
    policy. Only the third implementation is recommended.'
  rationale: Assigning IAM policy only through groups unifies permissions management to a single, flexible layer consistent
    with organizational functional roles. By unifying permissions management, the likelihood of excessive permissions is reduced.
  impact: ''
  references:
  - 1. http://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. http://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  page_start: 50
  audit_raw: "Perform the following to determine if an inline policy is set or a policy is directly attached\nto users:\n\
    1. Run the following to get a list of IAM users:\n aws iam list-users --query 'Users[*].UserName' --output text\n2. For\
    \ each user returned, run the following command to determine if any policies\nare attached to them:\n aws iam list-attached-user-policies\
    \ --user-name <iam_user>\n aws iam list-user-policies --user-name <iam_user>\n3. If any policies are returned, the user\
    \ has an inline policy or direct policy\nattachment."
  remediation: 'Perform the following to create an IAM group and assign a policy to it:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. In the navigation pane, click Groups and then click Create New Group .

    3. In the Group Name box, type the name of the group and then click Next Step .

    4. In the list of policies, select the check box for each policy that you want to apply

    to all members of the group. Then click Next Step .

    5. Click Create Group

    Perform the following to add a user to a given group:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. In the navigation pane, click Groups

    3. Select the group to add a user to

    4. Click Add Users To Group

    5. Select the users to be added to the group

    6. Click Add Users

    Perform the following to remove a direct association between a user and policy:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. In the left navigation pane, click on Users

    3. For each user:

    o Select the user

    o Click on the Permissions tab

    o Expand Permissions policies

    o Click X for each policy; then click Detach or Remove (depending on policy

    type)'
  checks:
  - type: manual_review
    info: "Perform the following to determine if an inline policy is set or a policy is directly attached\nto users:\n1. Run\
      \ the following to get a list of IAM users:\n aws iam list-users --query 'Users[*].UserName' --output text\n2. For each\
      \ user returned, run the following command to determine if any policies\nare attached to them:\n aws iam list-attached-user-policies\
      \ --user-name <iam_user>\n aws iam list-user-policies --user-name <iam_user>\n3. If any policies are returned, the user\
      \ has an inline policy or dir"
    severity: medium
- id: '1.16'
  title: Ensure IAM policies that allow full "*:*" administrative privileges are not attached
  scoring: scored
  profile:
  - Level 1
  description: IAM policies are the means by which privileges are granted to users, groups, or roles. It is recommended and
    considered a standard security advice to grant least privilege -that is, granting only the permissions required to perform
    a task. Determine what users need to do and then craft policies for them that let the users perform only those tasks,
    instead of allowing full administrative privileges.
  rationale: 'It''s more secure to start with a minimum set of permissions and grant additional permissions as necessary,
    rather than starting with permissions that are too lenient and then trying to tighten them later. Providing full administrative
    privileges instead of restricting to the minimum set of permissions that the user is required to do exposes the resources
    to potentially unwanted actions. IAM policies that have a statement with "Effect": "Allow" with "Action": "*" over "Resource":
    "*" should be removed.'
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  page_start: 53
  audit_raw: "Perform the following to determine what policies are created:\nFrom Command Line:\n1. Run the following to get\
    \ a list of IAM policies:\n aws iam list-policies --only-attached --output text\n2. For each policy returned, run the\
    \ following command to determine if any policies\nis allowing full administrative privileges on the account:\n aws iam\
    \ get-policy-version --policy-arn <policy_arn> --version-id\n<version>\n3. In output ensure policy should not have any\
    \ Statement block with \"Effect\":\n\"Allow\" and Action set to \"*\" and Resource set to \"*\""
  remediation: "From Console:\nPerform the following to detach the policy that has full administrative privileges:\n1. Sign\
    \ in to the AWS Management Console and open the IAM console at\nhttps://console.aws.amazon.com/iam/.\n2. In the navigation\
    \ pane, click Policies and then search for the policy name found\nin the audit step.\n3. Select the policy that needs\
    \ to be deleted.\n4. In the policy action menu, select first Detach\n5. Select all Users, Groups, Roles that have this\
    \ policy attached\n6. Click Detach Policy\n7. In the policy action menu, select Detach\n8. Select the newly detached policy\
    \ and select Delete\nFrom Command Line:\nPerform the following to detach the policy that has full administrative privileges\
    \ as found\nin the audit step:\n1. Lists all IAM users, groups, and roles that the specified managed policy is\nattached\
