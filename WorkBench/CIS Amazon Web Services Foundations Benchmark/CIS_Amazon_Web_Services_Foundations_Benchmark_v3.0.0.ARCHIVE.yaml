      page from the navigation menu on the left hand side. If a Config recor'
- id: '3.4'
  title: Ensure S3 bucket access logging is enabled on the CloudTrail S3 bucket
  scoring: scored
  profile:
  - Level 1
  description: S3 Bucket Access Logging generates a log that contains access records for each request made to your S3 bucket.
    An access log record contains details about the request, such as the request type, the resources specified in the request
    worked, and the time and date the request was processed. It is recommended that bucket access logging be enabled on the
    CloudTrail S3 bucket.
  rationale: By enabling S3 bucket logging on target S3 buckets, it is possible to capture all events which may affect objects
    within any target buckets. Configuring logs to be placed in a separate bucket allows access to log information which can
    be useful in security and incident response workflows.
  impact: ''
  references:
  - 1. CCE-78918-0
  - 2. https://docs.aws.amazon.com/AmazonS3/latest/dev/ServerLogs.html
  page_start: 119
  audit_raw: "Perform the following ensure the CloudTrail S3 bucket has access logging is enabled:\nFrom Console:\n1. Go to\
    \ the Amazon CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail/home\n2. In the API activity history pane\
    \ on the left, click Trails\n3. In the Trails pane, note the bucket names in the S3 bucket column\n4. Sign in to the AWS\
    \ Management Console and open the S3 console at\nhttps://console.aws.amazon.com/s3.\n5. Under All Buckets click on a target\
    \ S3 bucket\n6. Click on Properties in the top right of the console\n7. Under Bucket: _ <bucket_name> _ click on Logging\n\
    8. Ensure Enabled is checked.\nFrom Command Line:\n1. Get the name of the S3 bucket that CloudTrail is logging to:\naws\
