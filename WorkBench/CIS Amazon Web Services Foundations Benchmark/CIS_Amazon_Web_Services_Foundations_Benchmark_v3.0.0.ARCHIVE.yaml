      3. Click on Account Settings on the Left Pane

      4. Ensure "Prevent password reuse" is checked

      5. Ensure "Number of passwords to remember" is set to 24

      From Command Line:

      aws iam get-account-password-policy

      Ensure the output of the above command includes "Passw'
    severity: medium
- id: '1.10'
  title: Ensure multi-factor authentication (MFA) is enabled for all IAM users that have a console password
  scoring: scored
  profile:
  - Level 1
  description: Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance beyond traditional credentials.
    With MFA enabled, when a user signs in to the AWS Console, they will be prompted for their user name and password as well
    as for an authentication code from their physical or virtual MFA token. It is recommended that MFA be enabled for all
    accounts that have a console password.
  rationale: Enabling MFA provides increased security for console access as it requires the authenticating principal to possess
    a device that displays a time-sensitive key and have knowledge of a credential.
  impact: AWS will soon end support for SMS multi-factor authentication (MFA). New customers are not allowed to use this feature.
    We recommend that existing customers switch to one of the following alternative methods of MFA.
  references:
  - 1. https://tools.ietf.org/html/rfc6238
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
  page_start: 35
