      Enabled

      From Command Line:

      aws cloudtrail describe-trails

      Ensure LogFileValidationEnabled is set to'
    severity: medium
- id: '3.3'
  title: Ensure AWS Config is enabled in all regions
  scoring: scored
  profile:
  - Level 2
  description: AWS Config is a web service that performs configuration management of supported AWS resources within your account
    and delivers log files to you. The recorded information includes the configuration item (AWS resource), relationships
    between configuration items (AWS resources), any configuration changes between resources. It is recommended AWS Config
    be enabled in all regions.
  rationale: The AWS configuration item history captured by AWS Config enables security analysis, resource change tracking,
    and compliance auditing.
  impact: It is recommended AWS Config be enabled in all regions.
  references:
  - 1. CCE-78917-2
  - 2. https://docs.aws.amazon.com/cli/latest/reference/configservice/describeconfiguration-recorder-status.html
  page_start: 115
  audit_raw: "Process to evaluate AWS Config configuration per region\nFrom Console:\n1. Sign in to the AWS Management Console\
    \ and open the AWS Config console at\nhttps://console.aws.amazon.com/config/.\n2. On the top right of the console select\
    \ target Region.\n3. If a Config recorder is enabled in this region, you should navigate to the Settings\npage from the\
    \ navigation menu on the left hand side. If a Config recorder is not\nyet enabled in this region then you should select\
    \ \"Get Started\".\n4. Ensure \"Record all resources supported in this region\" is checked.\n5. Ensure \"Include global\
    \ resources (e.g., AWS IAM resources)\" is checked, unless\nit is enabled in another region (this is only required in\
    \ one region)\n6. Ensure the correct S3 bucket has been defined.\n7. Ensure the correct SNS topic has been defined.\n\
    8. Repeat steps 2 to 7 for each region.\nFrom Command Line:\n1. Run this command to show all AWS Config recorders and\
    \ their properties:\naws configservice describe-configuration-recorders\n2. Evaluate the output to ensure that all recorders\
    \ have a recordingGroup object\nwhich includes \"allSupported\": true. Additionally, ensure that at least one\nrecorder\
    \ has \"includeGlobalResourceTypes\": true\nNote: There is one more parameter \"ResourceTypes\" in recordingGroup object.\
    \ We\ndon't need to check the same as whenever we set \"allSupported\": true, AWS enforces\nresource types to be empty\
    \ (\"ResourceTypes\":[])\nSample Output:\n{\n \"ConfigurationRecorders\": [\n {\n \"recordingGroup\": {\n \"allSupported\"\
    : true,\n \"resourceTypes\": [],\n \"includeGlobalResourceTypes\": true\n },\n \"roleARN\": \"arn:aws:iam::<AWS_Account_ID>:role/servicerole/<config-role-name>\"\
    ,\n \"name\": \"default\"\n }\n ]\n}\n3. Run this command to show the status for all AWS Config recorders:\naws configservice\
    \ describe-configuration-recorder-status\n4. In the output, find recorders with name key matching the recorders that were\n\
    evaluated in step 2. Ensure that they include \"recording\": true and\n\"lastStatus\": \"SUCCESS\""
  remediation: "To implement AWS Config configuration:\nFrom Console:\n1. Select the region you want to focus on in the top\
    \ right of the console\n2. Click Services\n3. Click Config\n4. If a Config recorder is enabled in this region, you should\
    \ navigate to the Settings\npage from the navigation menu on the left hand side. If a Config recorder is not\nyet enabled\
    \ in this region then you should select \"Get Started\".\n5. Select \"Record all resources supported in this region\"\n\
    6. Choose to include global resources (IAM resources)\n7. Specify an S3 bucket in the same account or in another managed\
    \ AWS account\n8. Create an SNS Topic from the same AWS account or another managed AWS\naccount\nFrom Command Line:\n\
    1. Ensure there is an appropriate S3 bucket, SNS topic, and IAM role per the AWS\nConfig Service prerequisites.\n2. Run\
    \ this command to create a new configuration recorder:\naws configservice put-configuration-recorder --configuration-recorder\n\
    name=default,roleARN=arn:aws:iam::012345678912:role/myConfigRole --recordinggroup allSupported=true,includeGlobalResourceTypes=true\n\
    3. Create a delivery channel configuration file locally which specifies the channel\nattributes, populated from the prerequisites\
    \ set up previously:\n{\n \"name\": \"default\",\n \"s3BucketName\": \"my-config-bucket\",\n \"snsTopicARN\": \"arn:aws:sns:us-east-1:012345678912:my-config-notice\"\
    ,\n \"configSnapshotDeliveryProperties\": {\n \"deliveryFrequency\": \"Twelve_Hours\"\n }\n}\n4. Run this command to create\
    \ a new delivery channel, referencing the json\nconfiguration file made in the previous step:\naws configservice put-delivery-channel\
    \ --delivery-channel\nfile://deliveryChannel.json\n5. Start the configuration recorder by running the following command:\n\
    aws configservice start-configuration-recorder --configuration-recorder-name\ndefault"
