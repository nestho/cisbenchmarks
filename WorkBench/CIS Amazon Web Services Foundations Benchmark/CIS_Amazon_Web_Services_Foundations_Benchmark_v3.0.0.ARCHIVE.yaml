    \n },\n \"Action\": \"sts:AssumeRole\"\n }\n ]\n }\n2. Create the IAM role using the above trust policy:\naws iam create-role\
    \ --role-name <aws_support_iam_role> --assume-role-policydocument file:///tmp/TrustPolicy.json\n3. Attach 'AWSSupportAccess'\
