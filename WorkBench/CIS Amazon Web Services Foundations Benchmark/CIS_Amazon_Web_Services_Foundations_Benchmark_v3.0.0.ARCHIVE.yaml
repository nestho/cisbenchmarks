- id: '1.19'
  title: Ensure that all the expired SSL/TLS certificates stored in AWS IAM are removed
  scoring: scored
  profile:
  - Level 1
  description: To enable HTTPS connections to your website or application in AWS, you need an SSL/TLS server certificate.
    You can use ACM or IAM to store and deploy server certificates. Use IAM as a certificate manager only when you must support
    HTTPS connections in a region that is not supported by ACM. IAM securely encrypts your private keys and stores the encrypted
    version in IAM SSL certificate storage. IAM supports deploying server certificates in all regions, but you must obtain
    your certificate from an external provider for use with AWS. You cannot upload an ACM certificate to IAM. Additionally,
    you cannot manage your certificates from the IAM Console.
  rationale: Removing expired SSL/TLS certificates eliminates the risk that an invalid certificate will be deployed accidentally
    to a resource such as AWS Elastic Load Balancer (ELB), which can damage the credibility of the application/website behind
    the ELB. As a best practice, it is recommended to delete expired certificates.
  impact: Deleting the certificate could have implications for your application if you are using an expired server certificate
    with Elastic Load Balancing, CloudFront, etc. One has to make configurations at respective services to ensure there is
    no interruption in application functionality.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_servercerts.html
  - 2. https://docs.aws.amazon.com/cli/latest/reference/iam/delete-servercertificate.html
  page_start: 62
  audit_raw: "From Console:\nGetting the certificates expiration information via AWS Management Console is not\ncurrently\
    \ supported.\nTo request information about the SSL/TLS certificates stored in IAM via the AWS API\nuse the Command Line\
    \ Interface (CLI).\nFrom Command Line:\nRun list-server-certificates command to list all the IAM-stored server certificates:\n\
    aws iam list-server-certificates\nThe command output should return an array that contains all the SSL/TLS certificates\n\
    currently stored in IAM and their metadata (name, ID, expiration date, etc):\n{\n \"ServerCertificateMetadataList\": [\n\
    \ {\n \"ServerCertificateId\": \"EHDGFRW7EJFYTE88D\",\n \"ServerCertificateName\": \"MyServerCertificate\",\n \"Expiration\"\
    : \"2018-07-10T23:59:59Z\",\n \"Path\": \"/\",\n \"Arn\": \"arn:aws:iam::012345678910:servercertificate/MySSLCertificate\"\
    ,\n \"UploadDate\": \"2018-06-10T11:56:08Z\"\n }\n ]\n}\nVerify the ServerCertificateName and Expiration parameter value\
    \ (expiration date) for\neach SSL/TLS certificate returned by the list-server-certificates command and\ndetermine if there\
    \ are any expired server certificates currently stored in AWS IAM. If so,\nuse the AWS API to remove them.\nIf this command\
    \ returns:\n{ { \"ServerCertificateMetadataList\": [] }\nThis means that there are no expired certificates, It DOES NOT\
    \ mean that no\ncertificates exist."
  remediation: 'From Console:

    Removing expired certificates via AWS Management Console is not currently

    supported. To delete SSL/TLS certificates stored in IAM via the AWS API use the

    Command Line Interface (CLI).

    From Command Line:

    To delete Expired Certificate run following command by replacing

    <CERTIFICATE_NAME> with the name of the certificate to delete:

    aws iam delete-server-certificate --server-certificate-name

    <CERTIFICATE_NAME>

    When the preceding command is successful, it does not return any output.'
  checks:
  - type: manual_review
    info: 'From Console:

      Getting the certificates expiration information via AWS Management Console is not

      currently supported.

      To request information about the SSL/TLS certificates stored in IAM via the AWS API

      use the Command Line Interface (CLI).

      From Command Line:

      Run list-server-certificates command to list all the IAM-stored server certificates:

      aws iam list-server-certificates

      The command output should return an array that contains all the SSL/TLS certificates

      currently stored in IAM and their metad'
    severity: medium
- id: '1.20'
  title: Ensure that IAM Access analyzer is enabled for all regions
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Enable IAM Access analyzer for IAM policies about all resources in each active AWS region. IAM Access Analyzer
    is a technology introduced at AWS reinvent 2019. After the Analyzer is enabled in IAM, scan results are displayed on the
    console showing the accessible resources. Scans show resources that other accounts and federated users can access, such
    as KMS keys and IAM roles. So the results allow you to determine if an unintended user is allowed, making it easier for
    administrators to monitor least privileges access. Access Analyzer analyzes only policies that are applied to resources
    in the same AWS Region. In multi-account environments, IAM user centralization facilitates greater user control. User
    access beyond the initial account is then provided via role assumption. Centralization of users can be accomplished through
    federation with an external identity provider or through the use of AWS Organizations.
  rationale: AWS IAM Access Analyzer helps you identify the resources in your organization and accounts, such as Amazon S3
    buckets or IAM roles, that are shared with an external entity. This lets you identify unintended access to your resources
    and data. Access Analyzer identifies resources that are shared with external principals by using logicbased reasoning
    to analyze the resource-based policies in your AWS environment. IAM Access Analyzer continuously monitors all policies
    for S3 bucket, IAM roles, KMS (Key Management Service) keys, AWS Lambda functions, and Amazon SQS(Simple Queue Service)
    queues. Centralizing IAM user management to a single identity store reduces complexity and thus the likelihood of access
    management errors.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-accessanalyzer.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-gettingstarted.html
  page_start: 65
  audit_raw: 'From Console:

    1. Open the IAM console at https://console.aws.amazon.com/iam/

    2. Choose Access analyzer

    3. Click ''Analyzers''

    4. Ensure that at least one analyzer is present

    5. Ensure that the STATUS is set to Active

    6. Repeat these step for each active region

    From Command Line:

    1. Run the following command:

    aws accessanalyzer list-analyzers | grep status

    2. Ensure that at least one Analyzer the status is set to ACTIVE

    3. Repeat the steps above for each active region.

    If an Access analyzer is not listed for each region or the status is not set to active refer

    to the remediation procedure below.

    For multi-account AWS environments with an external identity provider:

    1. Determine the master account for identity federation or IAM user management

    2. Login to that account through the AWS Management Console

    3. Click Services

    4. Click IAM

    5. Click Identity providers

    6. Verify the configuration

    Then, determine all accounts that should not have local users present. For each

    account:

    1. Determine all accounts that should not have local users present

    2. Log into the AWS Management Console

    3. Switch role into each identified account

    4. Click Services

    5. Click IAM

    6. Click Users

    7. Confirm that no IAM users representing individuals are present

    For multi-account AWS environments implementing AWS Organizations without an

    external identity provider:

    1. Determine all accounts that should not have local users present

    2. Log into the AWS Management Console

    3. Switch role into each identified account

    4. Click Services

    5. Click IAM

    6. Click Users

    7. Confirm that no IAM users representing individuals are present'
  remediation: 'From Console:

    Perform the following to enable IAM Access analyzer for IAM policies:

    1. Open the IAM console at https://console.aws.amazon.com/iam/.

    2. Choose Access analyzer.

    3. Choose Create analyzer.

    4. On the Create analyzer page, confirm that the Region displayed is the Region

    where you want to enable Access Analyzer.

    5. Enter a name for the analyzer. Optional as it will generate a name for you

    automatically.

    6. Add any tags that you want to apply to the analyzer. Optional.

    7. Choose Create Analyzer.

    8. Repeat these step for each active region

    From Command Line:

    Run the following command:

    aws accessanalyzer create-analyzer --analyzer-name <NAME> --type

    <ACCOUNT|ORGANIZATION>

    Repeat this command above for each active region.

    Note: The IAM Access Analyzer is successfully configured only when the account you

    use has the necessary permissions.

    The remediation procedure will vary based on the individual organization''s

    implementation of identity federation and/or AWS Organizations with the acceptance

    criteria that no non-service IAM users, and non-root accounts, are present outside the

    account providing centralized IAM user management.'
  checks:
  - type: command
    command: aws accessanalyzer list-analyzers | grep status
    expected: ''
    severity: medium
    info: 'From Console:

      1. Open the IAM console at https://console.aws.amazon.com/iam/

      2. Choose Access analyzer

      3. Click ''Analyzers''

      4. Ensure that at least one analyzer is present

      5. Ensure that the STATUS is set to Active

      6. Repeat these step for each active region

      From Command Line:

      1. Run the following command:

      aws accessanalyzer list-analyzers | grep status

      2. Ensure that at least one Analyzer the sta'
- id: '1.22'
