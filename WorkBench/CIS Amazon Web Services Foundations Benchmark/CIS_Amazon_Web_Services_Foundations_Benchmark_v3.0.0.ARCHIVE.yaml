- id: '1.1'
  title: Maintain current contact details
  scoring: manual
  profile:
  - Level 1
  description: Ensure contact email and telephone details for AWS accounts are current and map to more than one individual
    in your organization. An AWS account supports a number of contact details, and AWS will use these to contact the account
    owner if activity judged to be in breach of Acceptable Use Policy or indicative of likely security compromise is observed
    by the AWS Abuse team. Contact details should not be for a single individual, as circumstances may arise where that individual
    is unavailable. Email contact details should point to a mail alias which forwards email to multiple individuals within
    the organization; where feasible, phone contact details should point to a PABX hunt group or other call-forwarding system.
  rationale: If an AWS account is observed to be behaving in a prohibited or suspicious manner, AWS will attempt to contact
    the account owner by email and phone using the contact details listed. If this is unsuccessful and the account behavior
    needs urgent mitigation, proactive measures may be taken, including throttling of traffic between the account exhibiting
    suspicious behavior and the AWS API endpoints and the Internet. This will result in impaired service to and from the account
    in question, so it is in both the customers' and AWS' best interests that prompt contact can be established. This is best
    achieved by setting AWS account contact details to point to resources which have multiple individuals as recipients, such
    as email aliases and PABX hunt groups.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-accountpayment.html#contact-info
  page_start: 15
  audit_raw: 'This activity can only be performed via the AWS Console, with a user who has

    permission to read and write Billing information (aws-portal:*Billing )

    1. Sign in to the AWS Management Console and open the Billing and Cost

    Management console at https://console.aws.amazon.com/billing/home#/.

    2. On the navigation bar, choose your account name, and then choose Account.

    3. On the Account Settings page, review and verify the current details.

    4. Under Contact Information, review and verify the current details.'
  remediation: 'This activity can only be performed via the AWS Console, with a user who has

    permission to read and write Billing information (aws-portal:*Billing ).

    1. Sign in to the AWS Management Console and open the Billing and Cost

    Management console at https://console.aws.amazon.com/billing/home#/.

    2. On the navigation bar, choose your account name, and then choose Account.

    3. On the Account Settings page, next to Account Settings, choose Edit.

    4. Next to the field that you need to update, choose Edit.

    5. After you have entered your changes, choose Save changes.

    6. After you have made your changes, choose Done.

    7. To edit your contact information, under Contact Information, choose Edit.

    8. For the fields that you want to change, type your updated information, and then

    choose Update.'
  checks:
  - type: manual_review
    info: 'This activity can only be performed via the AWS Console, with a user who has

      permission to read and write Billing information (aws-portal:*Billing )

      1. Sign in to the AWS Management Console and open the Billing and Cost

      Management console at https://console.aws.amazon.com/billing/home#/.

      2. On the navigation bar, choose your account name, and then choose Account.

      3. On the Account Settings page, review and verify the current details.

      4. Under Contact Information, review and verify the current de'
    severity: medium
- id: '1.2'
  title: Ensure security contact information is registered
  scoring: manual
  profile:
  - Level 1
  description: AWS provides customers with the option of specifying the contact information for account's security team. It
    is recommended that this information be provided.
  rationale: Specifying security-specific contact information will help ensure that security advisories sent by AWS reach
    the team in your organization that is best equipped to respond to them.
  impact: ''
  references:
  - 1. CCE-79200-2
  page_start: 17
  audit_raw: 'Perform the following to determine if security contact information is present:

    From Console:

    1. Click on your account name at the top right corner of the console

    2. From the drop-down menu Click My Account

    3. Scroll down to the Alternate Contacts section

    4. Ensure contact information is specified in the Security section

    From Command Line:

    1. Run the following command:

    aws account get-alternate-contact --alternate-contact-type SECURITY

    2. Ensure proper contact information is specified for the Security contact.'
  remediation: 'Perform the following to establish security contact information:

    From Console:

    1. Click on your account name at the top right corner of the console.

    2. From the drop-down menu Click My Account

    3. Scroll down to the Alternate Contacts section

    4. Enter contact information in the Security section

    From Command Line:

    Run the following command with the following input parameters:

    --email-address, --name, and --phone-number.

    aws account put-alternate-contact --alternate-contact-type SECURITY

    Note: Consider specifying an internal email distribution list to ensure emails are

    regularly monitored by more than one individual.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if security contact information is present:

      From Console:

      1. Click on your account name at the top right corner of the console

      2. From the drop-down menu Click My Account

      3. Scroll down to the Alternate Contacts section

      4. Ensure contact information is specified in the Security section

      From Command Line:

      1. Run the following command:

      aws account get-alternate-contact --alternate-contact-type SECURITY

      2. Ensure proper contact information is specified for the Sec'
    severity: medium
- id: '1.3'
  title: Ensure security questions are registered in the AWS account
  scoring: manual
  profile:
  - Level 1
  description: The AWS support portal allows account owners to establish security questions that can be used to authenticate
    individuals calling AWS customer service for support. It is recommended that security questions be established.
  rationale: When creating a new AWS account, a default super user is automatically created. This account is referred to as
    the 'root user' or 'root' account. It is recommended that the use of this account be limited and highly controlled. During
    events in which the 'root' password is no longer accessible or the MFA token associated with 'root' is lost/destroyed
    it is possible, through authentication using secret questions and associated answers, to recover 'root' user login access.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'From Console:

    1. Login to the AWS account as the ''root'' user

    2. On the top right you will see the <Root_Account_Name>

    3. Click on the <Root_Account_Name>

    4. From the drop-down menu Click My Account

    5. In the Configure Security Challenge Questions section on the Personal

    Information page, configure three security challenge questions.

    6. Click Save questions .'
  remediation: 'From Console:

    1. Login to the AWS Account as the ''root'' user

    2. Click on the <Root_Account_Name> from the top right of the console

    3. From the drop-down menu Click My Account

    4. Scroll down to the Configure Security Questions section

    5. Click on Edit

    6. Click on each Question

    • From the drop-down select an appropriate question

    • Click on the Answer section

    • Enter an appropriate answer

    o Follow process for all 3 questions

    7. Click Update when complete

    8. Save Questions and Answers and place in a secure physical location'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the AWS account as the ''root'' user

      2. On the top right you will see the <Root_Account_Name>

      3. Click on the <Root_Account_Name>

      4. From the drop-down menu Click My Account

      5. In the Configure Security Challenge Questions section on the Personal

      Information page, configure three security challenge questions.

      6. Click Save questions .'
    severity: medium
- id: '1.4'
  title: Ensure no 'root' user account access key exists
  scoring: scored
  profile:
  - Level 1
  description: The 'root' user account is the most privileged user in an AWS account. AWS Access Keys provide programmatic
    access to a given AWS account. It is recommended that all access keys associated with the 'root' user account be deleted.
  rationale: Deleting access keys associated with the 'root' user account limits vectors by which the account can be compromised.
    Additionally, deleting the 'root' access keys encourages the creation and use of role based accounts that are least privileged.
  impact: ''
  references:
  - 1. http://docs.aws.amazon.com/general/latest/gr/aws-access-keys-bestpractices.html
  - 2. http://docs.aws.amazon.com/general/latest/gr/managing-aws-access-keys.html
  page_start: 21
  audit_raw: 'Perform the following to determine if the ''root'' user account has access keys:

    From Console:

    1. Login to the AWS Management Console.

    2. Click Services.

    3. Click IAM.

    4. Click on Credential Report.

    5. This will download a .csv file which contains credential usage for all IAM users

    within an AWS Account - open this file.

    6. For the <root_account> user, ensure the access_key_1_active and

    access_key_2_active fields are set to FALSE.

    From Command Line:

    Run the following command:

    aws iam get-account-summary | grep "AccountAccessKeysPresent"

    If no ''root'' access keys exist the output will show "AccountAccessKeysPresent": 0,.

    If the output shows a "1", then ''root'' keys exist and should be deleted.'
  remediation: 'Perform the following to delete active ''root'' user access keys.

    From Console:

    1. Sign in to the AWS Management Console as ''root'' and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. Click on <root_account> at the top right and select My Security Credentials

    from the drop down list.

    3. On the pop out screen Click on Continue to Security Credentials.

    4. Click on Access Keys (Access Key ID and Secret Access Key).

    5. Under the Status column (if there are any Keys which are active).

    6. Click Delete (Note: Deleted keys cannot be recovered).

    Note: While a key can be made inactive, this inactive key will still show up in the CLI

    command from the audit procedure, and may lead to a key being falsely flagged as

    being non-compliant.'
  checks:
  - type: command
    command: aws iam get-account-summary | grep "AccountAccessKeysPresent"
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the ''root'' user account has access keys:

      From Console:

      1. Login to the AWS Management Console.

      2. Click Services.

      3. Click IAM.

      4. Click on Credential Report.

      5. This will download a .csv file which contains credential usage for all IAM users

      within an AWS Account - open this file.

      6. For the <root_account> user, ensure the access_key_1_active and

      access_key_2'
- id: '1.5'
  title: Ensure MFA is enabled for the 'root' user account
  scoring: scored
  profile:
  - Level 1
  description: 'The ''root'' user account is the most privileged user in an AWS account. Multi-factor Authentication (MFA)
    adds an extra layer of protection on top of a username and password. With MFA enabled, when a user signs in to an AWS
    website, they will be prompted for their username and password as well as for an authentication code from their AWS MFA
    device. Note: When virtual MFA is used for ''root'' accounts, it is recommended that the device used is NOT a personal
    device, but rather a dedicated mobile device (tablet or phone) that is managed to be kept charged and secured independent
    of any individual personal devices. ("non-personal virtual MFA") This lessens the risks of losing access to the MFA due
    to device loss, device trade-in or if the individual owning the device is no longer employed at the company.'
  rationale: Enabling MFA provides increased security for console access as it requires the authenticating principal to possess
    a device that emits a time-sensitive key and have knowledge of a credential.
  impact: ''
  references:
  - 1. CCE-78911-5
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html#id_rootuser_manage_mfa
  page_start: 23
  audit_raw: "Perform the following to determine if the 'root' user account has MFA setup:\nFrom Console:\n1. Login to the\
    \ AWS Management Console\n2. Click Services\n3. Click IAM\n4. Click on Credential Report\n5. This will download a .csv\
    \ file which contains credential usage for all IAM users\nwithin an AWS Account - open this file\n6. For the <root_account>\
    \ user, ensure the mfa_active field is set to TRUE .\nFrom Command Line:\n1. Run the following command:\n aws iam get-account-summary\
    \ | grep \"AccountMFAEnabled\"\n2. Ensure the AccountMFAEnabled property is set to 1"
  remediation: 'Perform the following to establish MFA for the ''root'' user account:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    Note: to manage MFA devices for the ''root'' AWS account, you must use your ''root''

    account credentials to sign in to AWS. You cannot manage MFA devices for the ''root''

    account using other credentials.

    2. Choose Dashboard , and under Security Status , expand Activate MFA on your

    root account.

    3. Choose Activate MFA

    4. In the wizard, choose A virtual MFA device and then choose Next Step .

    5. IAM generates and displays configuration information for the virtual MFA device,

    including a QR code graphic. The graphic is a representation of the ''secret

    configuration key'' that is available for manual entry on devices that do not

    support QR codes.

    6. Open your virtual MFA application. (For a list of apps that you can use for hosting

    virtual MFA devices, see Virtual MFA Applications.) If the virtual MFA application

    supports multiple accounts (multiple virtual MFA devices), choose the option to

    create a new account (a new virtual MFA device).

    7. Determine whether the MFA app supports QR codes, and then do one of the

    following:

    o Use the app to scan the QR code. For example, you might choose the

    camera icon or choose an option similar to Scan code, and then use the

    device''s camera to scan the code.

    o In the Manage MFA Device wizard, choose Show secret key for manual

    configuration, and then type the secret configuration key into your MFA

    application.

    When you are finished, the virtual MFA device starts generating one-time passwords.

    In the Manage MFA Device wizard, in the Authentication Code 1 box, type the one-time

    password that currently appears in the virtual MFA device. Wait up to 30 seconds for

    the device to generate a new one-time password. Then type the second one-time

    password into the Authentication Code 2 box. Choose Assign Virtual MFA.'
  checks:
  - type: command
    command: aws iam get-account-summary | grep "AccountMFAEnabled"
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the ''root'' user account has MFA setup:

      From Console:

      1. Login to the AWS Management Console

      2. Click Services

      3. Click IAM

      4. Click on Credential Report

      5. This will download a .csv file which contains credential usage for all IAM users

      within an AWS Account - open this file

      6. For the <root_account> user, ensure the mfa_active field is set to TRUE .

      From Comm'
- id: '1.6'
  title: Ensure hardware MFA is enabled for the 'root' user account
  scoring: manual
  profile:
  - Level 2
  description: The 'root' user account is the most privileged user in an AWS account. MFA adds an extra layer of protection
    on top of a user name and password. With MFA enabled, when a user signs in to an AWS website, they will be prompted for
    their user name and password as well as for an authentication code from their AWS MFA device. For Level 2, it is recommended
    that the 'root' user account be protected with a hardware MFA.
  rationale: 'A hardware MFA has a smaller attack surface than a virtual MFA. For example, a hardware MFA does not suffer
    the attack surface introduced by the mobile smartphone on which a virtual MFA resides. Note: Using hardware MFA for many,
    many AWS accounts may create a logistical device management issue. If this is the case, consider implementing this Level
    2 recommendation selectively to the highest security AWS accounts and the Level 1 recommendation applied to the remaining
    accounts.'
  impact: ''
  references:
  - 1. CCE-78911-5
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_enable_
  page_start: 26
  audit_raw: "Perform the following to determine if the 'root' user account has a hardware MFA setup:\n1. Run the following\
    \ command to determine if the 'root' account has MFA setup:\n aws iam get-account-summary | grep \"AccountMFAEnabled\"\
    \nThe AccountMFAEnabled property is set to 1 will ensure that the 'root' user account has\nMFA (Virtual or Hardware) Enabled.\n\
    If AccountMFAEnabled property is set to 0 the account is not compliant with this\nrecommendation.\n2. If AccountMFAEnabled\
    \ property is set to 1, determine 'root' account has Hardware\nMFA enabled.\nRun the following command to list all virtual\
    \ MFA devices:\n aws iam list-virtual-mfa-devices\nIf the output contains one MFA with the following Serial Number, it\
    \ means the MFA is\nvirtual, not hardware and the account is not compliant with this recommendation:\n\"SerialNumber\"\
    : \"arn:aws:iam::_<aws_account_number>_:mfa/root-account-mfadevice\""
  remediation: 'Perform the following to establish a hardware MFA for the ''root'' user account:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    Note: to manage MFA devices for the AWS ''root'' user account, you must use

    your ''root'' account credentials to sign in to AWS. You cannot manage MFA

    devices for the ''root'' account using other credentials.

    2. Choose Dashboard , and under Security Status , expand Activate MFA on your

    root account.

    3. Choose Activate MFA

    4. In the wizard, choose A hardware MFA device and then choose Next Step .

    5. In the Serial Number box, enter the serial number that is found on the back of the

    MFA device.

    6. In the Authentication Code 1 box, enter the six-digit number displayed by the

    MFA device. You might need to press the button on the front of the device to

    display the number.

    7. Wait 30 seconds while the device refreshes the code, and then enter the next

    six-digit number into the Authentication Code 2 box. You might need to press

    the button on the front of the device again to display the second number.

    8. Choose Next Step . The MFA device is now associated with the AWS account.

    The next time you use your AWS account credentials to sign in, you must type a

    code from the hardware MFA device.

    Remediation for this recommendation is not available through AWS CLI.'
  checks:
  - type: command
    command: aws iam get-account-summary | grep "AccountMFAEnabled"
    expected: ''
    severity: medium
    info: "Perform the following to determine if the 'root' user account has a hardware MFA setup:\n1. Run the following command\
      \ to determine if the 'root' account has MFA setup:\n aws iam get-account-summary | grep \"AccountMFAEnabled\"\nThe\
      \ AccountMFAEnabled property is set to 1 will ensure that the 'root' user account has\nMFA (Virtual or Hardware) Enabled.\n\
      If AccountMFAEnabled property is set to 0 the account "
- id: '1.7'
  title: Eliminate use of the 'root' user for administrative and daily tasks
  scoring: manual
  profile:
  - Level 1
  description: With the creation of an AWS account, a 'root user' is created that cannot be disabled or deleted. That user
    has unrestricted access to and control over all resources in the AWS account. It is highly recommended that the use of
    this account be avoided for everyday tasks.
  rationale: The 'root user' has unrestricted access to and control over all account resources. Use of it is inconsistent
    with the principles of least privilege and separation of duties, and can lead to unnecessary harm due to error or account
    compromise.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  page_start: 29
  audit_raw: 'From Console:

    1. Login to the AWS Management Console at

    https://console.aws.amazon.com/iam/

    2. In the left pane, click Credential Report

    3. Click on Download Report

    4. Open of Save the file locally

    5. Locate the <root account> under the user column

    6. Review password_last_used, access_key_1_last_used_date,

    access_key_2_last_used_date to determine when the ''root user'' was last used.

    From Command Line:

    Run the following CLI commands to provide a credential report for determining the last

    time the ''root user'' was used:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d |

    cut -d, -f1,5,11,16 | grep -B1 ''<root_account>''

    Review password_last_used, access_key_1_last_used_date,

    access_key_2_last_used_date to determine when the root user was last used.

    Note: There are a few conditions under which the use of the ''root'' user account is

    required. Please see the reference links for all of the tasks that require use of the ''root''

    user.'
  remediation: 'If you find that the ''root'' user account is being used for daily activity to include

    administrative tasks that do not require the ''root'' user:

    1. Change the ''root'' user password.

    2. Deactivate or delete any access keys associated with the ''root'' user.

    **Remember, anyone who has ''root'' user credentials for your AWS account has

    unrestricted access to and control of all the resources in your account, including billing

    information.'
  checks:
  - type: command
    command: cut -d, -f1,5,11,16 | grep -B1 '<root_account>'
    expected: ''
    severity: medium
    info: 'From Console:

      1. Login to the AWS Management Console at

      https://console.aws.amazon.com/iam/

      2. In the left pane, click Credential Report

      3. Click on Download Report

      4. Open of Save the file locally

      5. Locate the <root account> under the user column

      6. Review password_last_used, access_key_1_last_used_date,

      access_key_2_last_used_date to determine when the ''root user'' was last used.

      From Command Li'
- id: '1.8'
  title: Ensure IAM password policy requires minimum length of 14 or greater
  scoring: scored
  profile:
  - Level 1
  description: Password policies are, in part, used to enforce password complexity requirements. IAM password policies can
    be used to ensure password are at least a given length. It is recommended that the password policy require a minimum password
    length 14.
  rationale: Setting a password complexity policy increases account resiliency against brute force login attempts.
  impact: ''
  references:
  - 1. CCE-78907-3
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_a
  page_start: 31
  audit_raw: 'Perform the following to ensure the password policy is configured as prescribed:

    From Console:

    1. Login to AWS Console (with appropriate permissions to View Identity Access

    Management Account Settings)

    2. Go to IAM Service on the AWS Console

    3. Click on Account Settings on the Left Pane

    4. Ensure "Minimum password length" is set to 14 or greater.

    From Command Line:

    aws iam get-account-password-policy

    Ensure the output of the above command includes "MinimumPasswordLength": 14 (or

    higher)'
  remediation: "Perform the following to set the password policy as prescribed:\nFrom Console:\n1. Login to AWS Console (with\
    \ appropriate permissions to View Identity Access\nManagement Account Settings)\n2. Go to IAM Service on the AWS Console\n\
    3. Click on Account Settings on the Left Pane\n4. Set \"Minimum password length\" to 14 or greater.\n5. Click \"Apply\
    \ password policy\"\nFrom Command Line:\n aws iam update-account-password-policy --minimum-password-length 14\nNote: All\
    \ commands starting with \"aws iam update-account-password-policy\" can be\ncombined into a single command."
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the password policy is configured as prescribed:

      From Console:

      1. Login to AWS Console (with appropriate permissions to View Identity Access

      Management Account Settings)

      2. Go to IAM Service on the AWS Console

      3. Click on Account Settings on the Left Pane

      4. Ensure "Minimum password length" is set to 14 or greater.

      From Command Line:

      aws iam get-account-password-policy

      Ensure the output of the above command includes "MinimumPasswordLength": 14 (or

      higher)'
    severity: medium
- id: '1.9'
  title: Ensure IAM password policy prevents password reuse
  scoring: scored
  profile:
  - Level 1
  description: IAM password policies can prevent the reuse of a given password by the same user. It is recommended that the
    password policy prevent the reuse of passwords.
  rationale: Preventing password reuse increases account resiliency against brute force login attempts.
  impact: ''
  references:
  - 1. CCE-78908-1
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_a
  page_start: 33
  audit_raw: 'Perform the following to ensure the password policy is configured as prescribed:

    From Console:

    1. Login to AWS Console (with appropriate permissions to View Identity Access

    Management Account Settings)

    2. Go to IAM Service on the AWS Console

    3. Click on Account Settings on the Left Pane

    4. Ensure "Prevent password reuse" is checked

    5. Ensure "Number of passwords to remember" is set to 24

    From Command Line:

    aws iam get-account-password-policy

    Ensure the output of the above command includes "PasswordReusePrevention": 24'
  remediation: "Perform the following to set the password policy as prescribed:\nFrom Console:\n1. Login to AWS Console (with\
    \ appropriate permissions to View Identity Access\nManagement Account Settings)\n2. Go to IAM Service on the AWS Console\n\
    3. Click on Account Settings on the Left Pane\n4. Check \"Prevent password reuse\"\n5. Set \"Number of passwords to remember\"\
    \ is set to 24\nFrom Command Line:\n aws iam update-account-password-policy --password-reuse-prevention 24\nNote: All\
    \ commands starting with \"aws iam update-account-password-policy\" can be\ncombined into a single command."
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the password policy is configured as prescribed:

