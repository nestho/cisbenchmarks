- id: '5.1'
  title: Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports
  scoring: scored
  profile:
  - Level 1
  description: The Network Access Control List (NACL) function provide stateless filtering of ingress and egress network traffic
    to AWS resources. It is recommended that no NACL allows unrestricted ingress access to remote server administration ports,
    such as SSH to port 22 and RDP to port 3389, using either the TDP (6), UDP (17) or ALL (-1) protocols
  rationale: Public access to remote server administration ports, such as 22 and 3389, increases resource attack surface and
    unnecessarily raises the risk of resource compromise.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html#VPC_Sec
  page_start: 206
  audit_raw: 'From Console:

    Perform the following to determine if the account is configured as prescribed:

    1. Login to the AWS Management Console at

    https://console.aws.amazon.com/vpc/home

    2. In the left pane, click Network ACLs

    3. For each network ACL, perform the following:

    o Select the network ACL

    o Click the Inbound Rules tab

    o Ensure no rule exists that has a port range that includes port 22, 3389,

    using the protocols TDP (6), UDP (17) or ALL (-1) or other remote server

    administration ports for your environment and has a Source of 0.0.0.0/0

    and shows ALLOW

    Note: A Port value of ALL or a port range such as 0-1024 are inclusive of port 22, 3389,

    and other remote server administration ports'
  remediation: 'From Console:

    Perform the following:

    1. Login to the AWS Management Console at

    https://console.aws.amazon.com/vpc/home

    2. In the left pane, click Network ACLs

    3. For each network ACL to remediate, perform the following:

    o Select the network ACL

    o Click the Inbound Rules tab

    o Click Edit inbound rules

    o Either A) update the Source field to a range other than 0.0.0.0/0, or, B)

    Click Delete to remove the offending inbound rule

    o Click Save'
  checks:
  - type: manual_review
    info: 'From Console:

      Perform the following to determine if the account is configured as prescribed:

      1. Login to the AWS Management Console at

      https://console.aws.amazon.com/vpc/home

