    \ iam detach-group-policy --group-name <iam_group> --policy-arn\n<policy_arn>\n4. Detach the policy from all IAM Roles:\n\
    \ aws iam detach-role-policy --role-name <iam_role> --policy-arn <policy_arn>"
  checks:
