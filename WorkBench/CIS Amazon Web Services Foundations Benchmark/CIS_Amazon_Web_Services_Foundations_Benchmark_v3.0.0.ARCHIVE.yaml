- id: '4.16'
  title: Ensure AWS Security Hub is enabled
  scoring: scored
  profile:
  - Level 2
  description: Security Hub collects security data from across AWS accounts, services, and supported third-party partner products
    and helps you analyze your security trends and identify the highest priority security issues. When you enable Security
    Hub, it begins to consume, aggregate, organize, and prioritize findings from AWS services that you have enabled, such
    as Amazon GuardDuty, Amazon Inspector, and Amazon Macie. You can also enable integrations with AWS partner security products.
  rationale: AWS Security Hub provides you with a comprehensive view of your security state in AWS and helps you check your
    environment against security industry standards and best practices - enabling you to quickly assess the security posture
    across your AWS accounts.
  impact: It is recommended AWS Security Hub be enabled in all regions. AWS Security Hub requires AWS Config to be enabled.
  references:
  - 1. https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-getstarted.html
  - 2. https://docs.aws.amazon.com/securityhub/latest/userguide/securityhubenable.html#securityhub-enable-api
  page_start: 202
  audit_raw: "The process to evaluate AWS Security Hub configuration per region\nFrom Console:\n1. Sign in to the AWS Management\
    \ Console and open the AWS Security Hub\nconsole at https://console.aws.amazon.com/securityhub/.\n2. On the top right\
    \ of the console, select the target Region.\n3. If presented with the Security Hub > Summary page then Security Hub is\
    \ set-up\nfor the selected region.\n4. If presented with Setup Security Hub or Get Started With Security Hub - follow\n\
    the online instructions.\n5. Repeat steps 2 to 4 for each region.\nFrom Command Line:\nRun the following to list the Securityhub\
    \ status:\naws securityhub describe-hub\nThis will list the Securityhub status by region. Audit for the presence of a\
    \ 'SubscribedAt'\nvalue\nExample output:\n{\n \"HubArn\": \"<Securityhub ARN>\",\n \"SubscribedAt\": \"2022-08-19T17:06:42.398Z\"\
    ,\n \"AutoEnableControls\": true\n}\nAn error will be returned if Securityhub is not enabled.\nExample error:\nAn error\
    \ occurred (InvalidAccessException) when calling the DescribeHub\noperation: Account <Account ID> is not subscribed to\
    \ AWS Security Hub"
  remediation: 'To grant the permissions required to enable Security Hub, attach the Security Hub

    managed policy AWSSecurityHubFullAccess to an IAM user, group, or role.

    Enabling Security Hub

    From Console:

    1. Use the credentials of the IAM identity to sign in to the Security Hub console.

    2. When you open the Security Hub console for the first time, choose Enable AWS

    Security Hub.

    3. On the welcome page, Security standards list the security standards that Security

    Hub supports.

    4. Choose Enable Security Hub.

    From Command Line:

    1. Run the enable-security-hub command. To enable the default standards, include

    --enable-default-standards.

    aws securityhub enable-security-hub --enable-default-standards

    2. To enable the security hub without the default standards, include --no-enabledefault-standards.

    aws securityhub enable-security-hub --no-enable-default-standards'
  checks:
  - type: manual_review
    info: 'The process to evaluate AWS Security Hub configuration per region

