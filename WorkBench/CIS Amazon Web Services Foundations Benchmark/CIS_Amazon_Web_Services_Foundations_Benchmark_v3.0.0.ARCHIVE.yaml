      5. In the right pane, select the Flow Logs tab.

      6. Ensure a Log Flow exists that has Active in the Status column.

      From Command Line:

      1. Run describe-vpcs command (OSX/Linux/UNIX) to list the VPC networks

      available in the current AWS region:

      aws ec2 describe-vpcs --region <region> --query Vpc'
