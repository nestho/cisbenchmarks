- id: '1.17'
  title: Ensure a support role has been created to manage incidents with AWS Support
  scoring: scored
  profile:
  - Level 1
  description: AWS provides a support center that can be used for incident notification and response, as well as technical
    support and customer services. Create an IAM Role, with the appropriate policy assigned, to allow authorized users to
    manage incidents with AWS Support.
  rationale: By implementing least privilege for access control, an IAM Role will require an appropriate IAM Policy to allow
    Support Center Access in order to manage Incidents with AWS Support.
  impact: All AWS Support plans include an unlimited number of account and billing support cases, with no long-term contracts.
    Support billing calculations are performed on a peraccount basis for all plans. Enterprise Support plan customers have
    the option to include multiple enabled accounts in an aggregated monthly billing calculation. Monthly charges for the
    Business and Enterprise support plans are based on each month's AWS usage charges, subject to a monthly minimum, billed
    in advance. When assigning rights, keep in mind that other policies may grant access to Support as well. This may include
    AdministratorAccess and other policies including customer managed policies. Utilizing the AWS managed 'AWSSupportAccess'
    role is one simple way of ensuring that this permission is properly granted. To better support the principle of separation
    of duties, it would be best to only attach this role where necessary.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  - 2. https://aws.amazon.com/premiumsupport/pricing/
