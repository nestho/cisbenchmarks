  title: Ensure MFA Delete is enabled on S3 buckets
  scoring: manual
  profile:
  - Level 2
  description: Once MFA Delete is enabled on your sensitive and classified S3 bucket it requires the user to have two forms
    of authentication.
  rationale: Adding MFA delete to an S3 bucket, requires additional authentication when you change the version state of your
    bucket or you delete and object version adding another layer of security in the event your security credentials are compromised
    or unauthorized access is granted.
  impact: Enabling MFA delete on an S3 bucket could required additional administrator oversight. Enabling MFA delete may impact
    other services that automate the creation and/or deletion of S3 buckets.
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html#MultiFactor
