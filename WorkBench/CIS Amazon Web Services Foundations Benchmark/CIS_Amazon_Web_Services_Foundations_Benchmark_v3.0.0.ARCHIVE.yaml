- id: '3.6'
  title: Ensure rotation for customer-created symmetric CMKs is enabled
  scoring: scored
  profile:
  - Level 2
  description: AWS Key Management Service (KMS) allows customers to rotate the backing key which is key material stored within
    the KMS which is tied to the key ID of the customercreated customer master key (CMK). It is the backing key that is used
    to perform cryptographic operations such as encryption and decryption. Automated key rotation currently retains all prior
    backing keys so that decryption of encrypted data can take place transparently. It is recommended that CMK key rotation
    be enabled for symmetric keys. Key rotation can not be enabled for any asymmetric CMK.
  rationale: Rotating encryption keys helps reduce the potential impact of a compromised key as data encrypted with a new
    key cannot be accessed with a previous key that may have been exposed. Keys should be rotated every year, or upon event
    that would result in the compromise of that key.
  impact: Creation, management, and storage of CMKs may require additional time from an administrator.
  references:
  - 1. https://aws.amazon.com/kms/pricing/
  - 2. https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final
  page_start: 127
  audit_raw: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n3. Select a customer managed CMK where Key spec = SYMMETRIC_DEFAULT.\n\
    4. Select the Key rotation tab.\n5. Ensure the Automatically rotate this KMS key every year checkbox is\nchecked.\n6.\
    \ Repeat steps 3–5 for all customer-managed CMKs where \"Key spec =\nSYMMETRIC_DEFAULT\".\nFrom Command Line:\n1. Run\
    \ the following command to get a list of all keys and their associated KeyIds:\n aws kms list-keys\n2. For each key, note\
    \ the KeyId and run the following command:\ndescribe-key --key-id <kms_key_id>\n3. If the response contains \"KeySpec\
    \ = SYMMETRIC_DEFAULT\", run the following\ncommand:\n aws kms get-key-rotation-status --key-id <kms_key_id>\n4. Ensure\
    \ KeyRotationEnabled is set to true.\n5. Repeat steps 2–4 for all remaining CMKs."
  remediation: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n3. Select a key where Key spec = SYMMETRIC_DEFAULT that\
    \ does not have automatic\nrotation enabled.\n4. Select the Key rotation tab.\n5. Check the Automatically rotate this\
    \ KMS key every year checkbox.\n6. Click Save.\n7. Repeat steps 3–6 for all customer-managed CMKs that do not have automatic\n\
    rotation enabled.\nFrom Command Line:\n1. Run the following command to enable key rotation:\n aws kms enable-key-rotation\
    \ --key-id <kms_key_id>"
  checks:
  - type: manual_review
    info: 'From Console:

