- id: 2.1.1
  title: Ensure S3 Bucket Policy is set to deny HTTP requests
  scoring: scored
  profile:
  - Level 2
  description: At the Amazon S3 bucket level, you can configure permissions through a bucket policy making the objects accessible
    only through HTTPS.
  rationale: By default, Amazon S3 allows both HTTP and HTTPS requests. To achieve only allowing access to Amazon S3 objects
    through HTTPS you also have to explicitly deny access to HTTP requests. Bucket policies that allow HTTPS requests without
    explicitly denying HTTP requests will not comply with this recommendation.
  impact: ''
  references:
  - 1. https://aws.amazon.com/premiumsupport/knowledge-center/s3-bucket-policy-forconfig-rule/
  - 2. https://aws.amazon.com/blogs/security/how-to-use-bucket-policies-and-applydefense-in-depth-to-help-secure-your-amazon-s3-data/
  page_start: 74
  audit_raw: "To allow access to HTTPS you can use a condition that checks for the key\n\"aws:SecureTransport: true\". This\
    \ means that the request is sent through HTTPS but\nthat HTTP can still be used. So to make sure you do not allow HTTP\
    \ access confirm\nthat there is a bucket policy that explicitly denies access for HTTP requests and that it\ncontains\
    \ the key \"aws:SecureTransport\": \"false\".\nFrom Console:\n1. Login to AWS Management Console and open the Amazon S3\
    \ console using\nhttps://console.aws.amazon.com/s3/\n2. Select the Check box next to the Bucket.\n3. Click on 'Permissions',\
    \ then Click on Bucket Policy.\n4. Ensure that a policy is listed that matches:\n'{\n \"Sid\": <optional>,\n \"Effect\"\
    : \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n \"Condition\"\
    : {\n \"Bool\": {\n \"aws:SecureTransport\": \"false\"\n }'\n<optional> and <bucket_name> will be specific to your account\n\
    5. Repeat for all the buckets in your AWS account.\nFrom Command Line:\n1. List all of the S3 Buckets\naws s3 ls\n2. Using\
    \ the list of buckets run this command on each of them:\naws s3api get-bucket-policy --bucket <bucket_name> | grep aws:SecureTransport\n\
    NOTE : If Error being thrown by CLI, it means no Policy has been configured for\nspecified S3 bucket and by default it's\
    \ allowing both HTTP and HTTPS requests.\n3. Confirm that aws:SecureTransport is set to false aws:SecureTransport:false\n\
    4. Confirm that the policy line has Effect set to Deny 'Effect:Deny'"
  remediation: "From Console:\n1. Login to AWS Management Console and open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/\n\
    2. Select the Check box next to the Bucket.\n3. Click on 'Permissions'.\n4. Click 'Bucket Policy'\n5. Add this to the\
    \ existing policy filling in the required information\n{\n \"Sid\": <optional>\",\n \"Effect\": \"Deny\",\n \"Principal\"\
    : \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n \"Condition\": {\n \"Bool\": {\n\
    \ \"aws:SecureTransport\": \"false\"\n }\n }\n }\n6. Save\n7. Repeat for all the buckets in your AWS account that contain\
    \ sensitive data.\nFrom Console\nusing AWS Policy Generator:\n1. Repeat steps 1-4 above.\n2. Click on Policy Generator\
    \ at the bottom of the Bucket Policy Editor\n3. Select Policy Type\nS3 Bucket Policy\n4. Add Statements\n•\nEffect = Deny\n\
    •\nPrincipal = *\n•\nAWS Service = Amazon S3\n•\nActions = *\n•\nAmazon Resource Name = <ARN of the S3 Bucket>\n5. Generate\
    \ Policy\n6. Copy the text and add it to the Bucket Policy.\nFrom Command Line:\n1. Export the bucket policy to a json\
    \ file.\naws s3api get-bucket-policy --bucket <bucket_name> --query Policy --output\ntext > policy.json\n2. Modify the\
    \ policy.json file by adding in this statement:\n{\n \"Sid\": <optional>\",\n \"Effect\": \"Deny\",\n \"Principal\": \"\
    *\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\"\
    : \"false\"\n }\n }\n }\n3. Apply this modified policy back to the S3 bucket:\naws s3api put-bucket-policy --bucket <bucket_name>\
    \ --policy\nfile://policy.json"
  checks:
  - type: command
    command: aws s3api get-bucket-policy --bucket <bucket_name> | grep aws:SecureTransport
