    | not) | select(.metadata.annotations["haproxy.router.openshift.io/ratelimit-connections"] == "true" | not) | .metadata.name]''

    If the above command returns any namespaces, this is a finding.'
  remediation: 'Add the haproxy.router.openshift.io/rate-limit-connections annotation to any routes

    outside the kube-* or openshift-* namespaces

    oc annotate route <route_name> -n <namespace> --overwrite=true

    "haproxy.router.openshift.io/timeout=2s"

    https://docs.openshift.com/container-platform/4.9/networking/routes/routeconfiguration.html'
