    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep "log_format" /etc/audit/auditd.conf'' 2>/dev/null; done

    If the "log_format" option is not "ENRICHED", or the line is missing or commented out,

    this is a finding.

    2. Verify RHCOS takes the appropriate action when an audit processing failure

    occurs by executing following command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep disk_error_action /etc/audit/auditd.conf'' 2>/dev/null;

    done

    If the value of the "disk_error_action" option is not "SYSLOG", "SINGLE", or "HALT", or

    the line is missing, or commented out, ask the system administrator to indicate how the

    system takes appropriate action when an audit process failure occurs. If there is no

    evidence of appropriate action, this is a finding.

    3. Verify the SA and ISSO (at a minimum) are notified when the audit storage

    volume is full.

    Check which action RHEL takes when the audit storage volume is full by executing the

    following command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep max_log_file_action /etc/audit/auditd.conf'' 2>/dev/null;

    done

    If the value of the "max_log_file_action" option is set to "ignore", "rotate", or "suspend",

    or the line is missing or commented out, ask the system administrator to indicate how

    the system takes appropriate action when an audit storage volume is full. If there is no

    evidence of appropriate action, this is a finding.'
