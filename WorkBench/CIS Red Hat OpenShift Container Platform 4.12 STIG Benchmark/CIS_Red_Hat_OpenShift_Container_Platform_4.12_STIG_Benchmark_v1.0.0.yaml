      n "$HOSTNAME "; grep -r usb-storage /etc/modprobe.d/* | grep -i "/bin/true"''

      2>/dev/null; done

      install usb-storage /bin/true

      If the command does not return any output, or the line is commented ou'
- id: '1.81'
  title: CNTR-OS-001060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must continuously scan components, containers, and images for vulnerabilities. GROUP ID: V-257586
    RULE ID: SV-257586r961863'
  rationale: Finding vulnerabilities quickly within the container platform and within containers deployed within the platform
    is important to keep the overall platform secure. When a vulnerability within a component or container is unknown or allowed
    to remain unpatched, other containers and customers within the platform become vulnerability. The vulnerability can lead
    to the loss of application data, organizational infrastructure data, and Denial-of-Service (DoS) to hosted applications.
    Vulnerability scanning can be performed by the container platform or by external applications.
  impact: ''
  references: []
  page_start: 248
  audit_raw: 'To check if the Container Security Operator is running, execute the following:

    oc get deploy -n openshift-operators container-security-operator -

    ojsonpath=''{.status.readyReplicas}''

    If this command returns an error or the number 0, and a separate tool is not being used

    to perform continuous vulnerability scans of components, containers, and container

    images, this is a finding.'
  remediation: 'Vulnerability scanning can be performed by the Container Security Operator, Red Hat

    Advanced Cluster Security (formerly StackRox) or by external applications. Follow

    instructions from the application vendor if using external tool for vulnerability scanning.

    To install the Container Security Operator into the cluster, run the following:

    oc apply -f - << ''EOF''

    apiVersion: operators.coreos.com/v1alpha1 kind: Subscription metadata: labels:

    operators.coreos.com/container-security-operator.openshift-operators: '''' name:

    container-security-operator namespace: openshift-operators spec: channel: stable-3.8

    installPlanApproval: Automatic name: container-security-operator source: redhatoperators sourceNamespace: openshift-marketplace
    EOF'
  checks:
  - type: manual_review
    info: 'To check if the Container Security Operator is running, execute the following:

      oc get deploy -n openshift-operators container-security-operator -

      ojsonpath=''{.status.readyReplicas}''

      If this command returns an error or the number 0, and a separate tool is not being used

      to perform continuous vulnerability scans of components, containers, and container

      images, this is a finding.'
    severity: medium
- id: '1.82'
  title: CNTR-OS-001030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must use USBGuard for hosts that include a USB Controller. GROUP ID:
    V-257585 RULE ID: SV-257585r960963'
  rationale: USBGuard adds an extra layer of security to the overall OpenShift infrastructure. It provides an additional control
    mechanism to prevent potential security threats originating from USB devices. By monitoring and controlling USB access,
    USBGuard helps mitigate risks associated with unauthorized or malicious devices that may attempt to exploit vulnerabilities
    within the system.
  impact: ''
  references: []
  page_start: 250
  audit_raw: '1. Determine if the host devices include a USB Controller by executing the

    following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; lspci'' 2>/dev/null; done

    If there is not a USB Controller, then this requirement is Not Applicable.

    2. Verify the USBGuard service is installed by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; rpm -q usbguard'' 2>/dev/null; done

    If the output returns "package usbguard is not installed", this is a finding.

    3. Verify that USBGuard is set up to log into the Linux audit log.

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -r AuditBackend /etc/usbguard/usbguard-daemon.conf''

    2>/dev/null; done

    The output should return: "AuditBackend=LinuxAudit". If it does not, this is a finding.

    4. Verify the USBGuard has a policy configured with by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; usbguard list-rules'' 2>/dev/null; done

    If USBGuard is not found or the results do not match the organizationally defined rules,

    this is a finding.'
  remediation: "If there is not a USB Controller, this requirement is Not Applicable.\n1. Install the service by executing\
    \ the following:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\n\
    kind: MachineConfig\nmetadata:\n name: 80-usbguard-extensions-$mcpool\n labels:\n machineconfiguration.openshift.io/role:\
    \ $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n extensions:\n - usbguard\n\" | oc apply -f -done\n2. Wait for\
    \ the nodes to reboot. Note: (>oc get mcp) None of the pools should say\nUpdating=true when the update is done.\n3. Enable\
    \ the service by executing the following:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion:\
    \ machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 80-usbguard-service-enable-$mcpool\n labels:\n\
    \ machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n systemd:\n units:\n\
