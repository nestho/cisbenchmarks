- id: '1.10'
  title: CNTR-OS-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must enforce network policy on the namespace for controlling the flow of information within the
    container platform based on organization-defined information flow control policies. GROUP ID: V-257514 RULE ID: SV-257514r960801'
  rationale: OpenShift provides several layers of protection to control the flow of information between the container platform
    components and user services. Each user project is given a separate namespace and OpenShift enforces RBAC policies controlling
    which projects and services users can access. OpenShift forces the use of namespaces. Service accounts are a namespace
    resource as well, so they are segregated. RBAC policies apply to service accounts. In addition, Network Policies are used
    to control the flow of requests between containers hosted on the container platform. It is important to define a default
    Network Policy on the namespace that will be applied automatically to new projects to prevent unintended requests. These
    policies can be updated by the project's administrator (with the appropriate RBAC permissions) to apply a policy that
    is appropriate to the service(s) within the project namespace.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Verify that each user namespace has a Network Policy by executing the following:

    for ns in

    $(oc get namespaces -ojson | jq -r ''.items[] | select((.metadata.name |

    startswith("openshift") | not) and (.metadata.name | startswith("kube-") |

    not) and .metadata.name != "default") | .metadata.name ''); do oc get

    networkpolicy -n$ns; done

    If the above returns any lines saying "No resources found in <PROJECT> namespace.",

    this is a finding. Empty output is not a finding.'
  remediation: "Add a Network Policy to an existing project namespace by performing the following\nsteps:\n1. Create <YOURFILE>.yaml\
    \ and insert the desired resource Network Policy\ncontent. The following is an example resource quota definition:\napiVersion:\
    \ networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n name: allow-from-same-namespace\n namespace: <NAMESPACE>\nspec:\n\
    \ podSelector: {}\n ingress:\n - from:\n - podSelector: {}\n2. Apply the Network Policy definition to the project namespace\
    \ by executing the\nfollowing:\noc apply -f <YOURFILE>.yaml -n <NAMESPACE>\nDetails regarding the configuration of resource\
    \ Network Policy can be reviewed at\nhttps://docs.openshift.com/container-platform/4.12/networking/network_policy/aboutnetwork-policy.html."
  checks:
  - type: manual_review
    info: 'Verify that each user namespace has a Network Policy by executing the following:

