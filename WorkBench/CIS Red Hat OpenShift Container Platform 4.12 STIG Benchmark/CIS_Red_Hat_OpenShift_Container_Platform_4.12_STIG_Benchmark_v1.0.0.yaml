- id: '1.15'
  title: CNTR-OS-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must initiate session audits at system startup. GROUP ID: V-257519
    RULE ID: SV-257519r960888'
  rationale: Initiating session audits at system startup allows for comprehensive monitoring of user activities and system
    events from the moment the system is powered on. Audit logs capture information about login attempts, commands executed,
    file access, and other system activities. By starting session audits at system startup, RHCOS ensures that all relevant
    events are recorded, providing a complete security monitoring solution. Some audit systems also maintain state information
    only available if auditing is enabled before a given process is created. By initiating session audits at system startup,
    RHCOS enhances security monitoring, aids in timely incident detection and response, meets compliance requirements, facilitates
    forensic analysis, and promotes accountability and governance.
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'Verify the RHCOS boot loader configuration has audit enabled, including backlog:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep audit /boot/loader/entries/*.conf || echo "not found"''

    2>/dev/null; done

    If "audit" is not set to "1" or returns "not found", this is a finding.

    If "audit_backlog" is not set to 8192 or returns "not found", this is a finding.'
  remediation: "Apply the machine config by executing the following:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\"\
    \ ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 05-kernelarg-audit-enabled-$mcpool\n\
    \ labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n kernelArguments:\n\
    \ - audit=1\n - audit_backlog_limit=8192\n\" | oc create -f -\ndone"
  checks:
  - type: manual_review
    info: 'Verify the RHCOS boot loader configuration has audit enabled, including backlog:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; grep audit /boot/loader/entries/*.conf || echo "not found"''

      2>/dev/null; done

      If "audit" is not set to "1" or returns "not found", this is a finding.

      If "audit_backlog" is not set to 8192 or returns "not found", this is a finding.'
    severity: medium
- id: '1.16'
  title: CNTR-OS-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All audit records must identify what type of event has occurred within OpenShift. GROUP ID: V-257520 RULE
    ID: SV-257520r960891'
  rationale: 'Within the container platform, audit data can be generated from any of the deployed container platform components.
    This audit data is important when there are issues such as security incidents that must be investigated. Identifying the
    type of event in audit records helps classify and categorize different activities or actions within OpenShift. This classification
    allows for easier analysis, reporting, and filtering of audit logs based on specific event types. It helps distinguish
    between user actions, system events, policy violations, or security incidents, providing a clearer understanding of the
    activities occurring within the platform. Satisfies: SRG-APP-000095-CTR-000170, SRG-APP-000409-CTR-000990, SRG-APP000508-CTR-001300,
    SRG-APP-000510-CTR-001310'
  impact: ''
  references: []
  page_start: 64
  audit_raw: 'Verify the audit service is enabled and active by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; systemctl is-enabled auditd.service; systemctl is-active

    auditd.service'' 2>/dev/null; done

    If the auditd service is not "enabled" and "active" this is a finding.'
  remediation: "Apply the machine config setting auditd to active and enabled by executing the\nfollowing:\nfor mcpool in\n\
    $(oc get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\n\
    metadata:\n name: 80-auditd-service-enable-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n\
    \ config:\n ignition:\n version: 3.1.0\n systemd:\n units:\n - name: auditd.service\n enabled: true\n\" | oc apply -f\
    \ -\ndone"
  checks:
  - type: manual_review
    info: 'Verify the audit service is enabled and active by executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; systemctl is-enabled auditd.service; systemctl is-active

      auditd.service'' 2>/dev/null; done

      If the auditd service is not "enabled" and "active" this is a finding.'
    severity: medium
- id: '1.17'
  title: CNTR-OS-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift audit records must have a date and time association with all events. GROUP ID: V-257521 RULE ID:
    SV-257521r960894'
  rationale: Within the container platform, audit data can be generated from any of the deployed container platform components.
    This audit data is important when there are issues, such as security incidents, that must be investigated. To make the
    audit data worthwhile for the investigation of events, it is necessary to know when the event occurred. To establish the
    time of the event, the audit record must contain the date and time.
  impact: ''
  references: []
  page_start: 66
  audit_raw: '1. Verify Red Hat Enterprise Linux CoreOS (RHCOS) Audit Daemon is configured

    to resolve audit information before writing to disk by executing the following

    command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep "log_format" /etc/audit/auditd.conf'' 2>/dev/null; done

    If the "log_format" option is not "ENRICHED", or the line is missing or commented out,

    this is a finding.

    2. Verify RHCOS takes the appropriate action when an audit processing failure

    occurs.

    Verify RHCOS takes the appropriate action when an audit processing failure occurs by

    executing following command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep disk_error_action /etc/audit/auditd.conf'' 2>/dev/null;

    done

    If the value of the "disk_error_action" option is not "SYSLOG", "SINGLE", or "HALT", or

    the line is missing or commented out, ask the system administrator to indicate how the

    system takes appropriate action when an audit process failure occurs. If there is no

    evidence of appropriate action, this is a finding.

    3. Verify the SA and ISSO (at a minimum) are notified when the audit storage

    volume is full.

    Check which action RHEL takes when the audit storage volume is full by executing the

    following command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep max_log_file_action /etc/audit/auditd.conf'' 2>/dev/null;

    done

    If the value of the "max_log_file_action" option is set to "ignore", "rotate", or "suspend",

    or the line is missing or commented out, ask the system administrator to indicate how

    the system takes appropriate action when an audit storage volume is full. If there is no

    evidence of appropriate action, this is a finding.'
  remediation: "Apply the machine config by executing the following:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\"\
    \ ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 70-auditd-conf-$mcpool\n\
    \ labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n storage:\n\
    \ files:\n - contents:\n source:\ndata:,%23%0A%23%20This%20file%20controls%20the%20configuration%20of%20the%20a\nudit%20daemon%0A%23%0A%0Alocal_events%20%3D%20yes%0Awrite_logs%20%3D%20yes%0A\n\
    log_file%20%3D%20%2Fvar%2Flog%2Faudit%2Faudit.log%0Alog_group%20%3D%20root%0A\nlog_format%20%3D%20ENRICHED%0Aflush%20%3D%20incremental_async%0Afreq%20%3D%20\n\
    50%0Amax_log_file%20%3D%206%0Anum_logs%20%3D%205%0Apriority_boost%20%3D%204%0\nAname_format%20%3D%20hostname%0A%23%23name%20%3D%20mydomain%0Amax_log_file_ac\n\
    tion%20%3D%20syslog%0Aspace_left%20%3D%2025%25%0Aspace_left_action%20%3D%20sy\nslog%0Averify_email%20%3D%20yes%0Aaction_mail_acct%20%3D%20root%0Aadmin_space\n\
    _left%20%3D%2050%0Aadmin_space_left_action%20%3D%20syslog%0Adisk_full_action%\n20%3D%20HALT%0Adisk_error_action%20%3D%20HALT%0Ause_libwrap%20%3D%20yes%0A%23\n\
    %23tcp_listen_port%20%3D%2060%0Atcp_listen_queue%20%3D%205%0Atcp_max_per_addr\n%20%3D%201%0A%23%23tcp_client_ports%20%3D%20102465535%0Atcp_client_max_idle%20%3D%200%0Atransport%20%3D%20TCP%0Akrb5_principa\n\
    l%20%3D%20auditd%0A%23%23krb5_key_file%20%3D%20%2Fetc%2Faudit%2Faudit.key%0Ad\nistribute_network%20%3D%20no%0Aq_depth%20%3D%20400%0Aoverflow_action%20%3D%20\n\
    syslog%0Amax_restarts%20%3D%2010%0Aplugin_dir%20%3D%20%2Fetc%2Faudit%2Fplugin\ns.d%0A\n mode: 0640\n path: /etc/audit/auditd.conf\n\
    \ overwrite: true\n\" | oc apply -f -\ndone"
  checks:
  - type: manual_review
    info: '1. Verify Red Hat Enterprise Linux CoreOS (RHCOS) Audit Daemon is configured

      to resolve audit information before writing to disk by executing the following

      command:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; grep "log_format" /etc/audit/auditd.conf'' 2>/dev/null; done

      If the "log_format" option is not "ENRICHED", or the line is missing or commented out,

      this is a finding.

      2. Verify RHCOS takes the appropriate action when an audit proc'
    severity: medium
- id: '1.18'
  title: CNTR-OS-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All audit records must generate the event results within OpenShift. GROUP ID: V-257522 RULE ID: SV-257522r960903'
  rationale: 'Within the container platform, audit data can be generated from any of the deployed container platform components.
    Since the audit data may be part of a larger audit system, it is important for the audit data to also include the container
    platform name for traceability back to the container platform itself and not just the container platform components. This
    audit data is important when there are issues, such as security incidents, that must be investigated. To make the audit
    data worthwhile for the investigation of events, it is necessary to know the outcome of the event. Protecting the integrity
    of the tools used for auditing purposes is a critical step to ensuring the integrity of audit data. Audit data includes
    all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system
    activity. Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    It is common for attackers to replace the audit tools or inject code into the existing tools with the purpose of providing
    the capability to hide or erase system activity from the audit logs. To address this risk, audit tools must be cryptographically
    signed in order to provide the capability to identify when the audit tools have been modified, manipulated, or replaced.
    An example is a checksum hash of the file or files. Satisfies: SRG-APP-000099-CTR-000190, SRG-APP-000097-CTR-000180, SRG-APP000098-CTR-000185,
    SRG-APP-000100-CTR-000195, SRG-APP-000100-CTR000200, SRG-APP-000109-CTR-000215, SRG-APP-000290-CTR-000670, SRG-APP000357-CTR-000800'
  impact: ''
  references: []
  page_start: 69
  audit_raw: '1. Verify Red Hat Enterprise Linux CoreOS (RHCOS) Audit Daemon is configured

    to resolve audit information before writing to disk, by executing the following

    command:

