    modifications is one method for mitigating this risk. A comprehensive account management process will ensure an audit
    trail documents the creation of application user accounts and, as required, notifies administrators and/or application
    owners exists. Such a process greatly reduces the risk that accounts will be surreptitiously modified and provides logging
    that can be used for forensic purposes. To address access requirements, many application developers choose to integrate
    their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control
    policy requirements. Such integration allows the application developer to offload those access control functions and focus
    on core application features and functionality.
