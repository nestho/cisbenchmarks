    jsonpath="{.objects[?(.kind==''ResourceQuota'')]}{''\n''}"

    Review the ResourceQuota definition. If nothing is return, this is a finding.'
  remediation: "Configure a default resource quota as necessary to protect resource over utilization.\n1. Create a bootstrap\
    \ project template by executing the following:\noc adm create-bootstrap-project-template -o yaml > template.yaml\n2. Edit\
    \ the template and add a ResourceQuota object definition before the\nparameters section.\n- apiVersion: v1\n kind: ResourceQuota\n\
    \ metadata:\n name: example\n spec:\n hard:\n persistentvolumeclaims: \"10\"\n requests.storage: \"50Gi\"\n ...\nparameters:\n\
    3. Apply the project template to the cluster by executing the following:\noc create -f template.yaml -n openshift-config\n\
    Details regarding the configuration of resource quotas can be reviewed at\nhttps://docs.openshift.com/container-platform/4.8/applications/quotas/quotas-settingper-project.html."
