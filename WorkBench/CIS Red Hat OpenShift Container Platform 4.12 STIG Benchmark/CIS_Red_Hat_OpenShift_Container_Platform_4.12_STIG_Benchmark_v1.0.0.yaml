- id: '1.34'
  title: CNTR-OS-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must contain only container images for those capabilities being offered by the container platform.
    GROUP ID: V-257538 RULE ID: SV-257538r960963'
  rationale: Allowing container images to reside within the container platform registry that are not essential to the capabilities
    being offered by the container platform becomes a potential security risk. By allowing these nonessential container images
    to exist, the possibility for accidental instantiation exists. The images may be unpatched, not supported, or offer nonapproved
    capabilities. Those images for customer services are considered essential capabilities.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'To review the container images within the container platform registry, execute the

    following:

    oc get images

    Review the container platform container images to validate that only container images

    necessary for the functionality of the information system are present. If unnecessary

    container images exist, this is a finding.'
  remediation: 'Remove any images from the container registry that are not required for the functionality

    of the system by executing the following:

    oc delete image <IMAGE_NAME> -n <IMAGE_NAMESPACE>'
  checks:
  - type: manual_review
    info: 'To review the container images within the container platform registry, execute the

      following:

      oc get images

      Review the container platform container images to validate that only container images

      necessary for the functionality of the information system are present. If unnecessary

      container images exist, this is a finding.'
    severity: medium
- id: '1.35'
  title: CNTR-OS-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift runtime must enforce ports, protocols, and services that adhere to the PPSM CAL. GROUP ID: V-257539
    RULE ID: SV-257539r1043177'
  rationale: OpenShift Container Platform uses several IPV4 and IPV6 ports and protocols to facilitate cluster communication
    and coordination. Not all these ports are identified and approved by the PPSM CAL. Those ports, protocols, and services
    that fall outside the PPSM CAL must be blocked by the runtime or registered. Instructions on the PPSM can be found in
    DOD Instruction 8551.01 Policy.
  impact: ''
  references: []
  page_start: 111
  audit_raw: 'Review the OpenShift documentation and configuration.

    For additional information, refer to https://docs.openshift.com/containerplatform/4.12/installing/installing_platform_agnostic/installing-platform-agnostic.html.

    1. Interview the application administrator.

    2. Identify the TCP/IP port numbers OpenShift is configured to use and is utilizing

    by using a combination of relevant OS commands and application configuration

    utilities.

    3. Identify the network ports and protocols that are used by kube-apiserver by

    executing the following:

    oc get configmap kube-apiserver-pod -n openshift-kube-apiserver -o

    "jsonpath={ .data[''pod\.yaml''] }" | jq ''..|.containerPort?'' | grep -v "null"

    oc get configmap kube-apiserver-pod -n openshift-kube-apiserver -o

    "jsonpath={ .data[''pod\.yaml''] }" | jq ''..|.hostPort?'' | grep -v "null"

    oc get services -A --show-labels | grep apiserver | awk ''{print $6,$8}'' |

    grep apiserver

    4. Identify the network ports and protocols used by kube-scheduler by executing the

    following:

    oc get configmap kube-scheduler-pod -n openshift-kube-scheduler -o

    "jsonpath={ .data[''pod\.yaml''] }" | jq ''..|.containerPort?'' | grep -v "null"

    oc get services -A --show-labels | grep scheduler | awk ''{print $6,$8}'' |

    grep scheduler

    5. Identify the network ports and protocols used by kube-controller-manager by

    executing the following:

    oc get configmap kube-controller-manager-pod -n openshift-kube-controllermanager -o "jsonpath={ .data[''pod\.yaml''] }"
    | jq ''..|.containerPort?'' | grep

    -v "null"

    oc get services -A --show-labels | grep kube-controller

