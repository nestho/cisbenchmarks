- id: '1.19'
  title: CNTR-OS-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must take appropriate action upon an audit failure. GROUP ID: V-257523 RULE ID: SV-257523r1050555
    expr: | sum by (apiserver,instance)(rate(apiserver_audit_error_total{apiserver=~".+- apiserver"}[5m])) / sum by (apiserver,instance)
    (rate(apiserver_audit_event_total{apiserver=~".+-apiserver"}[5m])) > 0 for: 1m labels: severity: warning EOF'
  rationale: 'It is critical that when the container platform is at risk of failing to process audit logs as required that
    it takes action to mitigate the failure. Audit processing failures include software/hardware errors, failures in the audit
    capturing mechanisms, and audit storage capacity being reached or exceeded. Responses to audit failure depend upon the
    nature of the failure mode. Because availability of the services provided by the container platform, approved actions
    in response to an audit failure are as follows: (i) If the failure was caused by the lack of audit record storage capacity,
    the container platform must continue generating audit records if possible (automatically restarting the audit service
    if necessary), overwriting the oldest audit records in a first-in-first-out manner. (ii) If audit records are sent to
    a centralized collection server and communication with this server is lost or the server fails, the container platform
    must queue audit records locally until communication is restored or until the audit records are retrieved manually. Upon
    restoration of the connection to the centralized collection server, action must be taken to synchronize the local audit
    data with the collection server.'
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Verify there is a Prometheus rule to watch for audit events by executing the following:

    oc get prometheusrule -o yaml --all-namespaces | grep apiserver_audit

    Output: sum by

    (apiserver,instance)(rate(apiserver_audit_error_total{apiserver=".+-

    apiserver"}[5m])) > 0

    If the output above is not displayed, this is a finding.'
  remediation: "Apply the following Prometheus rule by executing the following:\noc apply -f - << 'EOF'\n# platform = multi_platform_ocp\n\
    apiVersion: monitoring.coreos.com/v1\nkind: PrometheusRule\nmetadata:\n name: audit-errors\n namespace: openshift-kube-apiserver\n\
    spec:\n groups:\n - name: apiserver-audit\n rules:\n - alert: AuditLogError\n annotations:\n summary: |-\n An API Server\
