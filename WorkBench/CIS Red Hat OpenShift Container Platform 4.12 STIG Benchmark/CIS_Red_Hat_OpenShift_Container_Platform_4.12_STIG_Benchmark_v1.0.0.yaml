    spec:\n config:\n ignition:\n version: 3.2.0\n storage:\n files:\n - contents:\n source: data:text/plain;charset=utf8;base64,LS0tCmRvY2tlcjoKICByZWdpc3RyeS5hY2Nlc3MucmVkaGF0LmNvbToKICAgIHNpZ3N0\n\
