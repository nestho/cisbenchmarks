  title: CNTR-OS-000970
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records when successful/unsuccessful logon attempts occur. GROUP ID: V-257579
    RULE ID: SV-257579r961824'
  rationale: Audit records provide valuable information for security monitoring and intrusion detection. By generating audit
    logs for logon attempts, OpenShift enables administrators and security teams to track and investigate any unauthorized
    or suspicious access attempts. These records serve as a vital source of information for detecting and responding to potential
    security breaches or unauthorized logon activities. Generating audit records for logon attempts supports user accountability.
    Audit logs provide a trail of logon activities, allowing administrators to attribute specific logon events to individual
    users or entities. This promotes accountability and helps in identifying any unauthorized access attempts or suspicious
    behavior by specific users. By monitoring logon activity logs, administrators and security teams can identify unusual
    or suspicious patterns of logon attempts. Forensic analysts can examine these records to reconstruct the timeline of logon
    activities and determine the scope and nature of the incident.
  impact: ''
  references: []
  page_start: 233
  audit_raw: 'Verify that logons are audited by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n ""$HOSTNAME ""; grep ""logins"" /etc/audit/audit.rules

    /etc/audit/rules.d/*'' 2>/dev/null; done

    The output will look similar to:

    node-name /etc/audit/<file>:-w /var/run/faillock -p wa -k logins

    /etc/audit/<file>:-w /var/log/lastlog -p wa -k logins

    If the two rules above are not found on each node, this is a finding.'
