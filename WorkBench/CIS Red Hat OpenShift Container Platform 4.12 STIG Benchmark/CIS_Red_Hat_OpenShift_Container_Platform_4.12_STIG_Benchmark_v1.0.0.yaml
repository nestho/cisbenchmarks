    record time stamps. GROUP ID: V-257526 RULE ID: SV-257526r960927'
  rationale: Utilizing multiple NTP servers for the chrony daemon in RHCOS ensures accurate and reliable audit record timestamps.
    It improves time synchronization, mitigates time drift, provides redundancy, and enhances resilience against attacks.
    Knowing when a sequence of events for an incident occurred is crucial to understand what may have taken place. Without
    a common clock, the components generating audit events could be out of synchronization and would then present a picture
    of the event that is warped and corrupted. To give a clear picture, it is important that the container platform and its
    components use a common internal clock.
