- id: '1.49'
  title: CNTR-OS-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must prevent kernel profiling. GROUP ID: V-257553 RULE ID: SV-257553r961149'
  rationale: Kernel profiling involves monitoring and analyzing the behavior of the kernel, including its internal operations
    and system calls. This level of access and visibility into the kernel can potentially be exploited by attackers to gather
    sensitive information or launch attacks. By preventing kernel profiling, the attack surface is minimized and the risk
    of unauthorized access or malicious activities targeting the kernel is reduced. Kernel profiling can introduce additional
    overhead and resource utilization, potentially impacting the stability and performance of the system. Profiling tools
    and techniques often involve instrumenting the kernel code, injecting hooks, or collecting detailed data, which may interfere
    with the normal operation of the kernel. By disallowing kernel profiling, OpenShift helps ensure the stability and reliability
    of the platform, preventing any potential disruptions caused by profiling activities.
