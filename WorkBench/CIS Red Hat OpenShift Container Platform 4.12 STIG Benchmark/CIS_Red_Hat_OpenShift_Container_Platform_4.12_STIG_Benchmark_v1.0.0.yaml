- id: '1.62'
  title: CNTR-OS-000810
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must protect against or limit the effects of all types of Denial-of-Service (DoS) attacks by defining
    resource quotas on a namespace. GROUP ID: V-257566 RULE ID: SV-257566r961620'
  rationale: 'OpenShift allows administrators to define resource quotas on a namespace basis. This allows tailoring of the
    shared resources based on a project needs. However, when a new project is created, unless a default project resource quota
    is configured, that project will not have any limits or quotas defined. This could allow someone to create a new project
    and then deploy services that exhaust or overuse the shared cluster resources. It is necessary to ensure that all existing
    namespaces with user-defined workloads have an applied resource quota configured. Using resource quotas will help to mitigate
    a DoS attack by limiting how much CPU, memory, and pods may be consumed in a project. This helps protect other projects
    (namespaces) from being denied resources to process. https://docs.openshift.com/container-platform/4.8/applications/quotas/quotas-settingper-project.html
    Satisfies: SRG-APP-000435-CTR-001070, SRG-APP-000246-CTR-000605, SRG-APP000450-CTR-001105'
