    settings by executing the following command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; less /proc/cpuinfo | grep ''nx'' /proc/cpuinfo | uniq''

    2>/dev/null; done

    (Example Output: flags : fpu vme de pse tsc ms nx rdtscp lm constant_tsc...)

    If "flags" does not contain the "nx" flag, this is a finding.'
