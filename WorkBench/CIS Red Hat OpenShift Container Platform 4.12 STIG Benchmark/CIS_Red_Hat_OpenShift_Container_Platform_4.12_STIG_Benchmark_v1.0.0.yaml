    \ * system:serviceaccount:openshift-infra:pv-recycler-controller\n * system:serviceaccount:openshift-machine-api:machine-api-terminationhandler\n\
    The group \"system:authenticated\" is the default group for any authenticated user, this\ngroup should only be associated\
    \ with the restricted profile. If this group is listed under\nany other SCC Policy, or the restricted SCC policy has been\
    \ altered to allow any of the\nnonpermitted actions, this is a finding.\n2. Determine if there are any cluster roles or\
    \ local roles that allow the use of use of\nnonpermitted SCC policies. The following commands will print the role's name\n\
    and namespace, followed by a list of resource names and if that resource is an\nSCC.\noc get clusterrole.rbac -ojson |\
    \ jq -r '.items[]|select(.rules[]?|select(\n(.apiGroups[]? == (\"security.openshift.io\")) and (.resources[]? ==\n(\"\
    securitycontextconstraints\")) and (.verbs[]? ==\n(\"use\"))))|.metadata.name,{\"scc\":(.rules[]?|select((.resources[]?\
    \ ==\n(\"securitycontextconstraints\"))).resourceNames[]?)}'\noc get role.rbac --all-namespaces -ojson | jq -r\n'.items[]|select(.rules[]?|select(\
    \ (.apiGroups[]? ==\n(\"security.openshift.io\")) and (.resources[]? ==\n(\"securitycontextconstraints\")) and (.verbs[]?\
    \ ==\n(\"use\"))))|.metadata.name,{\"scc\":(.rules[]?|select((.resources[]? ==\n(\"securitycontextconstraints\"))).resourceNames[]?)}'\n\
    Excluding platform specific roles, identify any roles that allow use of nonpermitted SCC\npolicies. For example, the follow\
