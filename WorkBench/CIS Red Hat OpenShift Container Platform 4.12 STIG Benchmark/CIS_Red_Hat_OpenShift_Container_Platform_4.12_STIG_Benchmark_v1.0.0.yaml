      containers:x:993:995:User for housing the sub ID range for

      containers:/var/home/containers:/sbin/nologin

      If there are any user accoun'
    severity: medium
- id: '1.42'
  title: CNTR-OS-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'OpenShift must protect authenticity of communications sessions with the use of FIPSvalidated 140-2 or 140-3
    validated cryptography. GROUP ID: V-257546 RULE ID: SV-257546r1043178'
  rationale: 'FIPS compliance is one of the most critical components required in highly secure environments, to ensure that
    only supported cryptographic technologies are allowed on nodes. Because FIPS must be enabled before the operating system
    used by the cluster boots for the first time, FIPS cannot be disabled after a cluster is deployed. OpenShift employs industry-validated
    cryptographic algorithms, key management practices, and secure protocols, reducing the likelihood of cryptographic vulnerabilities
    and attacks. Satisfies: SRG-APP-000219-CTR-000550, SRG-APP-000635-CTR-001405, SRG-APP000126-CTR-000275, SRG-APP-000411-CTR-000995,
    SRG-APP-000412-CTR001000, SRG-APP-000416-CTR-001015, SRG-APP-000514-CTR-001315'
  impact: ''
  references: []
  page_start: 137
  audit_raw: 'To validate the OpenShift cluster is running with FIPS enabled on each node by

    executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; sysctl crypto.fips_enabled'' 2>/dev/null; done

    If any lines of output end in anything other than 1, this is a finding.'
  remediation: "Reinstall the OpenShift cluster in FIPS mode. The file install-config.yaml has a top-level\nkey that enables\
    \ FIPS mode for all nodes and the cluster platform layer. If the installconfig.yaml was not backed up prior to consumption\
    \ as part of the installation, recreate\nit. An example install-config.yaml with some sections trimmed out for brevity,\
    \ and the\n\"fips: true\" key applied at the top level is shown below:\napiVersion: v1\nbaseDomain: example.com\ncontrolPlane:\n\
    \ name: master\n platform:\n aws:\n [...]\n replicas: 3\ncompute:\n- name: worker\n platform:\n aws:\n replicas: 3\nmetadata:\n\
    \ name: fips-cluster\nnetworking:\n [...]\nplatform:\n aws:\n [...]\nsshKey: ssh-ed25519 AAAA...\npullSecret: '{\"auths\"\
    : ...}'\nfips: true\nOnce the install-config.yaml is saved with corresponding correct information for the\ninstallation\
    \ infrastructure, run the installer to create a cluster that uses FIPS\nValidated/Modules in Process cryptographic libraries.\
    \ The command to install a cluster\nand consume the install-config.yaml is:\n> ./openshift-install create cluster --dir=<installation_directory>\
    \ --loglevel=info\nWhere <installation_directory> is the directory that contains install-config.yaml\nAdditional details\
    \ can be found here: https://docs.openshift.com/containerplatform/4.8/installing/installing-fips.html"
  checks:
  - type: manual_review
    info: 'To validate the OpenShift cluster is running with FIPS enabled on each node by

      executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; sysctl crypto.fips_enabled'' 2>/dev/null; done

      If any lines of output end in anything other than 1, this is a finding.'
    severity: medium
- id: '1.43'
  title: CNTR-OS-000540
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift runtime must isolate security functions from nonsecurity functions. GROUP ID: V-257547 RULE ID:
    SV-257547r961131'
  rationale: An isolation boundary provides access control and protects the integrity of the hardware, software, and firmware
    that perform security functions. Security functions are the hardware, software, and/or firmware of the information system
    responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection
    is based. Operating systems implement code separation (i.e., separation of security functions from nonsecurity functions)
    in several ways, including through the provision of security kernels via processor rings or processor modes. For nonkernel
    code, security function isolation is often achieved through file system protections that serve to protect the code on
    disk and address space protections that protect executing code. Developers and implementers can increase the assurance
    in security functions by employing well-defined security policy models; structured, disciplined, and rigorous hardware
    and software development techniques; and sound system/security engineering principles. Implementation may include isolation
    of memory space and libraries. Operating systems restrict access to security functions using access control mechanisms
    and by implementing least privilege capabilities.
  impact: ''
  references: []
  page_start: 140
  audit_raw: 'Verify the Red Hat Enterprise Linux CoreOS (RHCOS) verifies correct operation of all

    security functions by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; getenforce'' 2>/dev/null; done

    If "SELinux" is not active and not in "Enforcing" mode, this is a finding.'
  remediation: "Apply the machine config by executing the following:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\"\
    \ ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 05-kernelarg-selinux-enforcing-$mcpool\n\
    \ labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n kernelArguments:\n\
    \ - enforcing=1\n\" | oc apply -f -done"
  checks:
  - type: manual_review
    info: 'Verify the Red Hat Enterprise Linux CoreOS (RHCOS) verifies correct operation of all

      security functions by executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; getenforce'' 2>/dev/null; done

      If "SELinux" is not active and not in "Enforcing" mode, this is a finding.'
    severity: medium
