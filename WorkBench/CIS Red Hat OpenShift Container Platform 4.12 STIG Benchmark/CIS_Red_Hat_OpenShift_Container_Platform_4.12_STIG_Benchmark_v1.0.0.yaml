- id: '1.37'
  title: CNTR-OS-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must use multifactor authentication for network access to accounts. GROUP ID: V-257541 RULE ID:
    SV-257541r960972'
  rationale: 'Without the use of multifactor authentication, the ease of access to privileged and nonprivileged functions
    is greatly increased. Multifactor authentication requires using two or more factors to achieve authentication. Factors
    include: (i) something a user knows (e.g., password/PIN); (ii) something a user has (e.g., cryptographic identification
    device, token); or (iii) something a user is (e.g., biometric). A privileged account is defined as an information system
    account with authorizations of a privileged user. A nonprivileged account is any information system account with authorizations
    of a nonprivileged user. Network access is defined as access to an information system by a user (or a process acting on
    behalf of a user) communicating through a network (e.g., local area network, wide area network, or the internet). Satisfies:
    SRG-APP-000149-CTR-000355, SRG-APP-000150-CTR-000360'
  impact: ''
  references: []
  page_start: 118
  audit_raw: 'Verify the authentication operator is configured to use either an LDAP or a

    OpenIDConnect provider by executing the following:

    oc get oauth cluster -o jsonpath="{.spec.identityProviders[*].type}{''\n''}"

    If the output lists any other type besides LDAP or OpenID, this is a finding.'
  remediation: "Configure OpenShift to use an appropriate Identity Provider. Do not use HTPasswd.\nUse either LDAP(AD), OpenIDConnect,\
    \ or an approved identity provider.\nSteps to configure LDAP provider:\n1. Create Secret for BIND DN password by executing\
    \ the following:\noc create secret generic ldap-secret --from-literal=bindPassword=<secret> -n\nopenshift-config\n2. Create\
    \ config map for LDAP Trust CA by executing the following:\noc create configmap ca-config-map --from-file=ca.crt=/path/to/ca\
    \ -n\nopenshift-config\n3. Create LDAP Auth Config Resource YAML: Using the preferred text editor,\ncreate a file named\
    \ ldapidp.yaml using the example content. (replacing config\nvalues as appropriate):\napiVersion: config.openshift.io/v1\n\
