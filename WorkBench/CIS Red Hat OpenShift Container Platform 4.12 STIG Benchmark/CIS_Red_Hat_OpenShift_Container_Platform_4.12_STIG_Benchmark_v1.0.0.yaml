    oc get templates/<PROJECT-REQUEST-TEMPLATE> -n openshift-config -o

    jsonpath="{.objects[?(.kind==''ResourceQuota'')]}{''\n''}"

    Replace <PROJECT-REQUEST-TEMPLATE> with the name of the project request

    template returned from the earlier query.

    If the project template is not defined, or there are no ResourceQuota definitions in it, this

    is a finding.'
  remediation: "Configure a default resource quota to protect resource over utilization by performing the\nfollowing steps:\n\
    1. Create a bootstrap project template (if not already created) by executing the\nfollowing:\noc adm create-bootstrap-project-template\
    \ -o yaml > template.yaml\n2. Edit the template and add a ResourceQuota object definition before the\nparameters section.\n\
    - apiVersion: v1\n kind: ResourceQuota\n metadata:\n name: example\n spec:\n hard:\n persistentvolumeclaims: \"10\"\n\
    \ requests.storage: \"50Gi\"\n ...\nparameters:\n3. Apply the project template to the cluster by executing the following:\n\
    oc create -f template.yaml -n openshift-config\n4. Set the default cluster project request template by executing the following:\n\
    oc patch project.config.openshift.io/cluster --type=merge -p\n'{\"spec\":{\"projectRequestTemplate\":{\"name\": \"<PROJECT_REQUEST_TEMPLATE>\"\
    }}}'\nDetails regarding the configuration of resource quotas can be reviewed at\nhttps://docs.openshift.com/container-platform/4.8/applications/quotas/quotas-settingper-project.html."
  checks:
  - type: manual_review
