- id: '1.31'
  title: CNTR-OS-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must protect audit tools from unauthorized access. GROUP ID: V-257535 RULE ID: SV-257535r960939'
  rationale: 'Protecting audit data also includes identifying and protecting the tools used to view and manipulate log data.
    Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit data. Applications providing
    tools to interface with audit data will leverage user permissions and roles identifying the user accessing the tools and
    the corresponding rights the user enjoys in order to make access decisions regarding the access to audit tools. Audit
    tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate
    audit information system activity and records. Audit tools include custom queries and report generators. Satisfies: SRG-APP-000121-CTR-000255,
    SRG-APP-000122-CTR-000260, SRG-APP000123-CTR-000265'
  impact: ''
  references: []
  page_start: 102
  audit_raw: 'List the users and groups who have permission to view the cluster logging configuration

    by executing the following two commands:

    oc policy who-can view ClusterLogging -n openshift-logging

    oc policy who-can view ClusterLoggingForwarder -n openshift-logging

    Review the list of users and groups who have view access to the cluster logging

    resources. If any user or group listed must not have access to view the cluster logging

    resources, this is a finding.'
  remediation: 'Remove view permissions from any unauthorized user or group by performing one or

    more of the following commands.

    Remove role from user by executing the following:

    oc adm policy remove-role-from-user <ROLE> <USER> -n openshift-logging

    Remove role from group by executing the following:

    oc adm policy remove-role-from-group <ROLE> <GROUP> -n openshift-logging

    Remove cluster role from user by executing the following:

    oc adm policy remove-cluster-role-from-user <CLUSTER_ROLE> <USER> -n

    openshift-logging

    Remove cluster role from group by executing the following:

    oc adm policy remove-cluster-role-from-group <CLUSTER_ROLE> <GROUP> -n

    openshift-logging

    Note: ROLE/CLUSTER_ROLE is the role granting user view permission to

    resources in openshift-logging namespace.'
  checks:
  - type: manual_review
    info: 'List the users and groups who have permission to view the cluster logging configuration

      by executing the following two commands:

      oc policy who-can view ClusterLogging -n openshift-logging

      oc policy who-can view ClusterLoggingForwarder -n openshift-logging

      Review the list of users and groups who have view access to the cluster logging

      resources. If any user or group listed must not have access to view the cluster logging

      resources, this is a finding.'
    severity: medium
- id: '1.32'
  title: CNTR-OS-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must use FIPS-validated cryptographic mechanisms to protect the integrity of log information. GROUP
    ID: V-257536 RULE ID: SV-257536r960951'
  rationale: To fully investigate an incident and to have trust in the audit data that is generated, it is important to put
    in place data protections. Without integrity protections, unauthorized changes may be made to the audit files and reliable
    forensic analysis and discovery of the source of malicious system activity may be degraded. Although digital signatures
    are one example of protecting integrity, this control is not intended to cause a new cryptographic hash to be generated
    every time a record is added to a log file. Integrity protections can also be implemented by using cryptographic techniques
    for security function isolation and file system protections to protect against unauthorized changes.
  impact: ''
  references: []
  page_start: 104
  audit_raw: 'Verify the Cluster Log Forwarder is using an encrypted transport by executing the

    following:

    oc get clusterlogforwarder -n openshift-logging

    For each Cluster Log Forwarder, run the following command to display the

    configuration.

    oc describe clusterlogforwarder <name> -n openshift-logging

    Review the configuration and determine if the transport is secure, such as tls:// or

    https://. If there are any transports configured that are not secured by TLS, this is

    a finding.'
  remediation: 'Edit the Cluster Log Forwarder configuration to configure TLS on the transport by

    executing the following:

    oc edit clusterlogforwarder <name> -n openshift-logging

    For any output->url value that is not using a secure transport, edit the url to use a

    secure (https:// or tls://) transport.

    For detailed information regarding configuration of the Cluster Log Forwarder, refer to

    https://docs.openshift.com/container-platform/4.8/logging/cluster-logging-external.html.'
  checks:
  - type: manual_review
    info: 'Verify the Cluster Log Forwarder is using an encrypted transport by executing the

      following:

      oc get clusterlogforwarder -n openshift-logging

      For each Cluster Log Forwarder, run the following command to display the

      configuration.

      oc describe clusterlogforwarder <name> -n openshift-logging

      Review the configuration and determine if the transport is secure, such as tls:// or

      https://. If there are any transports configured that are not secured by TLS, this is

      a finding.'
    severity: medium
- id: '1.33'
  title: CNTR-OS-000360
  scoring: manual
  profile:
