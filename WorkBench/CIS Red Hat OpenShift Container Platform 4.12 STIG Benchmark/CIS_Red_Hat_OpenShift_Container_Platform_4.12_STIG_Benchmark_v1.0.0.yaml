- id: '1.79'
  title: CNTR-OS-001010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must disable SSHD service. GROUP ID: V-257583 RULE ID: SV-257583r960963'
  rationale: 'Any direct remote access to the RHCOS nodes is not allowed. RHCOS is a singlepurpose container operating system
    and is only supported as a component of the OpenShift Container Platform. Remote management of the RHCOS nodes is performed
    at the OpenShift Container Platform API level. Disabling the SSHD service reduces the attack surface and potential vulnerabilities
    associated with SSH access. SSH is a commonly targeted vector by malicious actors, and disabling the service eliminates
    the potential risks associated with unauthorized SSH access or exploitation of SSH-related vulnerabilities. By disabling
    SSHD, OpenShift can restrict access to the platform to only authorized channels and protocols. This helps mitigate the
    risk of unauthorized access attempts and reduces the exposure to potential brute-force attacks or password-guessing attacks
    against SSH. Disabling SSHD encourages the use of more secure and controlled access mechanisms, such as API-based access
    or secure remote management tools provided by OpenShift. These mechanisms offer better access control and auditing capabilities,
    allowing administrators to manage and monitor access to the platform more effectively. Satisfies: SRG-APP-000141-CTR-000315,
    SRG-APP-000185-CTR-000490'
  impact: ''
  references: []
  page_start: 244
  audit_raw: 'Verify the SSHD service is inactive and disabled by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; systemctl is-enabled sshd.service; systemctl is-active

    sshd.service'' 2>/dev/null; done

    If the SSHD service is either active or enabled this is a finding.'
  remediation: "Apply the machine config to disable SSHD service by executing following:\nfor mcpool in\n$(oc get mcp -oname\
    \ | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name:\
    \ 80-sshd-service-disable-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n\
    \ version: 3.1.0\n systemd:\n units:\n - name: sshd.service\n enabled: false\n\" | oc apply -f -done"
  checks:
  - type: manual_review
    info: 'Verify the SSHD service is inactive and disabled by executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; systemctl is-enabled sshd.service; systemctl is-active

      sshd.service'' 2>/dev/null; done

      If the SSHD service is either active or enabled this is a finding.'
    severity: medium
- id: '1.80'
  title: CNTR-OS-001020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must disable USB Storage kernel module. GROUP ID: V-257584 RULE ID:
    SV-257584r960963'
  rationale: Disabling the USB Storage kernel module helps protect against potential data exfiltration or unauthorized access
    to sensitive data. USB storage devices can be used to transfer data in and out of the system, which poses a risk if unauthorized
    or untrusted devices are connected. By disabling the USB Storage kernel module, OpenShift can prevent the use of USB storage
    devices and reduce the risk of data breaches or unauthorized data transfers. USB storage devices can potentially introduce
    malware or malicious code into the system. Disabling the USB Storage kernel module helps mitigate the risk of malware
    infections or the introduction of malicious software from external storage devices. It prevents unauthorized execution
    of code from USB storage devices, reducing the attack surface and protecting the system from potential security threats.
    Disabling USB storage prevents unauthorized data transfers to and from the system. This helps enforce data loss prevention
    (DLP) policies and mitigates the risk of sensitive or confidential data being copied or stolen using USB storage devices.
    It adds an additional layer of control to protect against data leakage or unauthorized data movement.
  impact: ''
  references: []
  page_start: 246
  audit_raw: 'Verify the operating system disables the ability to load the USB Storage kernel module

    by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -r usb-storage /etc/modprobe.d/* | grep -i "/bin/true"''

    2>/dev/null; done

    install usb-storage /bin/true

    If the command does not return any output, or the line is commented out, and use of

    USB Storage is not documented with the Information System Security Officer (ISSO) as

    an operational requirement, this is a finding.'
  remediation: "Apply the machine config to disable USB Storage to load USB Storage kernel module\nby executing the following:\n\
    for mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\n\
    kind: MachineConfig\nmetadata:\n name: 80-kernmod-usb-storage-disable-$mcpool\n labels:\n machineconfiguration.openshift.io/role:\
    \ $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n storage:\n files:\n - contents:\n source: data:,install%20usb-storage%20/bin/true%0A\n\
    \ mode: 0644\n path: /etc/modprobe.d/75-kernel_module_usb-storage_disabled.conf\n overwrite: true\n\" | oc apply -f -done"
  checks:
  - type: command
    command: n "$HOSTNAME "; grep -r usb-storage /etc/modprobe.d/* | grep -i "/bin/true"'
    expected: ''
    severity: medium
    info: 'Verify the operating system disables the ability to load the USB Storage kernel module

      by executing the following:

      for node in

