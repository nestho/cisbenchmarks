    replay attacks if it is impractical to achieve a successful authentication by recording and replaying a previous authentication
    message. Note that the anti-replay service is implicit when data contains monotonically increasing sequence numbers and
    data integrity is assured. Use of DOD PKI is inherently compliant with this requirement for user and device access. Use
    of Transport Layer Security (TLS), including application protocols such as HTTPS and DNSSEC, that use TLS/SSL as the underlying
    security protocol is also complaint. Configure the information system to use the hash message authentication code (HMAC)
    algorithm for authentication services to Kerberos, SSH, web management tool, and any other access method.
