- id: '1.64'
  title: CNTR-OS-000860
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must implement nonexecutable data to protect its memory from unauthorized
    code execution. GROUP ID: V-257568 RULE ID: SV-257568r961665'
  rationale: The NX bit is a hardware feature that prevents the execution of code from data memory regions. By enabling NX
    bit execute protection, OpenShift ensures that malicious code or exploits cannot execute from areas of memory that are
    intended for data storage. This helps protect against various types of buffer overflow attacks, where an attacker attempts
    to inject and execute malicious code in data memory.
  impact: ''
  references: []
  page_start: 184
  audit_raw: 'Verify the NX (no-execution) bit flag is set on the system by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

