- id: '1.55'
  title: CNTR-OS-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must enforce access restrictions and support auditing of the enforcement actions. GROUP ID: V-257560
    RULE ID: SV-257560r1015797'
  rationale: 'Enforcing access restrictions helps protect the OpenShift environment and its resources from unauthorized access,
    misuse, or malicious activities. By implementing access controls, OpenShift ensures that only authorized users or processes
    can access sensitive data, make changes to configurations, or perform privileged actions. This helps prevent unauthorized
    individuals or entities from compromising the system''s security and integrity. Enforcing access restrictions and auditing
    the enforcement actions ensures accountability for actions performed within the OpenShift environment. It helps identify
    the individuals or processes responsible for specific activities, whether they are legitimate actions or potential security
    breaches. This accountability discourages unauthorized or malicious behavior and supports incident response and forensic
    investigations. Auditing the enforcement actions provides administrators with visibility into the system''s security posture,
    access patterns, and potential security risks. It helps identify anomalies, detect suspicious activities, and monitor
    compliance with established security policies. This operational visibility enables timely detection and response to security
    incidents, ensuring the ongoing security and stability of the OpenShift environment. Satisfies: SRG-APP-000381-CTR-000905,
    SRG-APP-000343-CTR-000780'
  impact: ''
  references: []
  page_start: 166
