- id: '1.60'
  title: CNTR-OS-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift keystore must implement encryption to prevent unauthorized disclosure of information at rest within
    the container platform. GROUP ID: V-257564 RULE ID: SV-257564r1050650'
  rationale: 'By default, etcd data is not encrypted in OpenShift Container Platform. Enable etcd encryption for the cluster
    to provide an additional layer of data security. For example, it can help protect the loss of sensitive data if an etcd
    backup is exposed to the incorrect parties. When users enable etcd encryption, the following OpenShift API server and
    Kubernetes API server resources are encrypted: Secrets Config maps Routes OAuth access tokens OAuth authorize tokens When
    users enable etcd encryption, encryption keys are created. These keys are rotated on a weekly basis. Users must have these
    keys to restore from an etcd backup.'
