  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must allocate audit record storage capacity to store at least one
    weeks'' worth of audit records, when audit records are not immediately sent to a central audit record storage facility.
    GROUP ID: V-257558 RULE ID: SV-257558r961392'
  rationale: To ensure RHCOS has a sufficient storage capacity in which to write the audit logs, operating systems need to
    be able to allocate audit record storage capacity. The task of allocating audit record storage capacity is performed during
    initial installation of the operating system.
  impact: ''
  references: []
  page_start: 164
  audit_raw: 'Verify RHCOS allocates audit record storage capacity to store at least one week of

    audit records when audit records are not immediately sent to a central audit record

    storage facility.

    Check the size of the partition to which audit records are written (with the example being

    /var/log/audit/) by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; df -h /var/log/audit/'' 2>/dev/null; done

    <node> Filesystem Size Used Avail Use% Mounted on

    /dev/sdb4 1.0T 27G 998G 3% /var

    If the audit record partition is not allocated for sufficient storage capacity, this is a

    finding.

    Note: The partition size needed to capture a week of audit records is based on the

    activity level of the system and the total storage capacity available. Typically, 10.0 GB of

