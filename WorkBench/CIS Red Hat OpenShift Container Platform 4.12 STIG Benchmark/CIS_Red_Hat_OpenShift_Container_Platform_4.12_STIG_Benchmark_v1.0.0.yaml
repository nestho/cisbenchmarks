    stance towards compliance, identify potential issues in real-time, and take corrective actions promptly. The Compliance
    Operator assesses compliance of both the Kubernetes API resources of OpenShift Container Platform, as well as the nodes
    running the cluster. The Compliance Operator uses OpenSCAP, a NIST-certified tool, to scan and enforce security policies
    provided by the content. This allows an organization to define organizational policy to align with the SSP, combine it
    with standardized vendorprovided content, and periodically scan the platform in accordance with organizationdefined policy.
  impact: ''
  references: []
