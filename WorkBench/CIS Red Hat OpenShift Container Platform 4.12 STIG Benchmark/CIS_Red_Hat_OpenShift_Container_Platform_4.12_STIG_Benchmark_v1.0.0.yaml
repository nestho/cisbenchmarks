    "ingress-to-route-controller"))|{ "crb": .metadata.name, "roleRef": .roleRef,

    "subjects": .subjects}''

    Find the role to which the service account is bound, if the service account is not bound

    to a cluster role, or the role does not provide sufficient access, this is a finding.'
  remediation: 'If no vulnerability scanning tool is used, this requirement is Not Applicable.

    Create a service if one does not already exist.

    Change to the appropriate namespace by executing the following:

    oc project <namespace>

    Create Service Account in the Project by executing the following:

    oc create sa <service_account_name>

    Verify creation of the Service Account by executing the following:

    oc get sa | grep <service_account_name>

    Bind to the appropriate cluster RBAC role by executing the following:

    oc adm policy add-cluster-role-to-user <role_name> -z <service_account_name>

    For more information, refer to the following guides: https://docs.openshift.com/containerplatform/4.8/authentication/using-rbac.html

    https://docs.openshift.com/container-platform/4.8/authentication/understanding-andcreating-service-accounts.html

    https://docs.openshift.com/container-platform/4.8/authentication/using-service-accountsin-applications.html'
  checks:
  - type: manual_review
    info: 'If no vulnerability scanning tool is used, this requirement is Not Applicable.

