- id: '1.50'
  title: CNTR-OS-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must restrict individuals the ability to launch organizational-defined Denial-ofService (DOS) attacks
    against other information systems by setting a default Resource Quota. GROUP ID: V-257554 RULE ID: SV-257554r961152'
  rationale: OpenShift allows administrators to define resource quotas on a namespace basis. This allows tailoring of the
    shared resources based on a project needs. However, when a new project is created, unless a default project resource quota
    is configured, that project will not have any limits or quotas defined. This could allow someone to create a new project
    and then deploy services that exhaust or overuse the shared cluster resources. Thus, it is necessary to ensure that there
    is a default resource quota configured for all new projects. A Cluster Admin may increase resource quotas on a given project
    namespace, if that project requires additional resources at any time.
  impact: ''
  references: []
  page_start: 154
  audit_raw: 'Check for Resource Quota. Verify a default project template is defined by executing the

    following:

