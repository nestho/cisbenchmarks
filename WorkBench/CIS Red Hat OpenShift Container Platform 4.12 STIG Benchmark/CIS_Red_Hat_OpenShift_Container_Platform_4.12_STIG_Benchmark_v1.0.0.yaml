- id: '1.14'
  title: CNTR-OS-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records when successful/unsuccessful attempts to access privileges occur. GROUP
    ID: V-257518 RULE ID: SV-257518r1050653'
  rationale: 'OpenShift and its components must generate audit records when successful/unsuccessful attempts to access or
    delete security objects, security levels, and privileges occur. All the components must use the same standard so that
    the events can be tied together to understand what took place within the overall container platform. This must establish,
    correlate, and assist with investigating the events relating to an incident or identify those responsible. Without audit
    record generation, access control levels can be accessed by unauthorized users unknowingly for malicious intent, creating
    vulnerabilities within the container platform. Satisfies: SRG-APP-000091-CTR-000160, SRG-APP-000492-CTR-001220, SRG-APP000493-CTR-001225,
    SRG-APP-000494-CTR-001230, SRG-APP-000500-CTR001260, SRG-APP-000507-CTR-001295'
