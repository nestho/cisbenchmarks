  description: 'OpenShift must verify container images. GROUP ID: V-257537 RULE ID: SV-257537r1015794'
  rationale: The container platform must be capable of validating that container images are signed and that the digital signature
    is from a recognized and source approved by the organization. Allowing any container image to be introduced into the registry
    and instantiated into a container can allow for services to be introduced that are not trusted and may contain malicious
    code, which introduces unwanted services. These unwanted services can cause harm and security risks to the hosting server,
    the container platform, other services running within the container platform, and the overall organization.
  impact: ''
  references: []
  page_start: 106
