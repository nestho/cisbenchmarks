- id: '1.65'
  title: CNTR-OS-000870
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must implement ASLR (Address Space Layout Randomization) from unauthorized
    code execution. GROUP ID: V-257569 RULE ID: SV-257569r961665'
  rationale: 'ASLR is a security technique that randomizes the memory layout of processes, making it more difficult for attackers
    to predict the location of system components and exploit memory-based vulnerabilities. By implementing ASLR, OpenShift
    reduces the effectiveness of common attacks such as buffer overflow, return-oriented programming (ROP), and other memory
    corruption exploits. ASLR enhances the resilience of the OpenShift platform by introducing randomness into the memory
    layout. This randomization makes it harder for attackers to exploit vulnerabilities and launch successful attacks. Even
    if a vulnerability exists in the system, the randomized memory layout introduced by ASLR reduces the chances of the attacker
    being able to reliably exploit it, increasing the overall security of the platform. ASLR is particularly effective in
    mitigating remote code execution attacks. By randomizing the memory layout, ASLR prevents attackers from precisely predicting
    the memory addresses needed to execute malicious code. This makes it significantly more challenging for attackers to successfully
    exploit vulnerabilities and execute arbitrary code on the system. Protection of Shared Libraries: ASLR also protects shared
    libraries used by applications running on OpenShift. By randomizing the base addresses of shared libraries, ASLR makes
    it harder for attackers to leverage vulnerabilities in shared libraries to compromise applications or gain unauthorized
    access to the system. It adds an extra layer of protection to prevent attacks targeting shared library vulnerabilities.'
  impact: ''
  references: []
  page_start: 186
  audit_raw: 'Verify Red Hat Enterprise Linux CoreOS (RHCOS) implements ASLR by executing the

    following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; sysctl kernel.randomize_va_space

    '' 2>/dev/null; done

    If "kernel.randomize_va_space" is not set to "2", this is a finding.'
  remediation: "Apply the machine config to implement ASLR by executing the following:\nfor mcpool in\n$(oc get mcp -oname\
    \ | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name:\
    \ 75-sysctl-kernel-randomize-va-space-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n\
    \ ignition:\n version: 3.1.0\n storage:\n files:\n - contents:\n source: data:,kernel.randomize_va_space%3D2%0A\n mode:\
    \ 0644\n path: /etc/sysctl.d/75-sysctl_kernel_randomize_va_space.conf\n overwrite: true\n\" | oc apply -f -done"
  checks:
  - type: manual_review
    info: 'Verify Red Hat Enterprise Linux CoreOS (RHCOS) implements ASLR by executing the

      following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; sysctl kernel.randomize_va_space

      '' 2>/dev/null; done

      If "kernel.randomize_va_space" is not set to "2", this is a finding.'
    severity: medium
