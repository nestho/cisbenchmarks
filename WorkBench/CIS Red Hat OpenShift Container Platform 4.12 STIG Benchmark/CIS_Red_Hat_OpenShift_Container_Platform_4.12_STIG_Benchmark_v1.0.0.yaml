- id: '1.7'
  title: CNTR-OS-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit rules to capture account related actions. GROUP ID: V-257511 RULE ID: SV-257511r1015792'
  rationale: 'Account management actions, such as creation, modification, disabling, removal, and enabling are important changes
    within the system. When management actions are modified, user accessibility is affected. Once an attacker establishes
    access to an application, the attacker often attempts to disable authorized accounts to disrupt services or prevent the
    implementation of countermeasures. In the event of a security incident or policy violation, having detailed audit logs
    for account creation, modification, disabling, removal, and enabling actions is crucial for incident response and forensic
    investigations. These logs provide a trail of activities that can be analyzed to determine the cause, impact, and scope
    of the incident, aiding in the investigation and remediation process. Satisfies: SRG-APP-000028-CTR-000080, SRG-APP-000291-CTR-000675,
    SRG-APP000292-CTR-000680, SRG-APP-000293-CTR-000685, SRG-APP-000294-CTR000690, SRG-APP-000319-CTR-000745, SRG-APP-000320-CTR-000750,
    SRG-APP000509-CTR-001305'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Verify the audit rules capture account creation, modification, disabling, removal, and

    enabling actions by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -e user-modify -e group-modify -e

    audit_rules_usergroup_modification /etc/audit/rules.d/*

    /etc/audit/audit.rules'' 2>/dev/null; done

    Confirm the following rules exist on each node:

    -w /etc/group -p wa -k audit_rules_usergroup_modification

    -w /etc/gshadow -p wa -k audit_rules_usergroup_modification

    -w /etc/security/opasswd -p wa -k audit_rules_usergroup_modification

    -w /etc/passwd -p wa -k audit_rules_usergroup_modification

    -w /etc/shadow -p wa -k audit_rules_usergroup_modification

    If the above rules are not listed on each node, this is a finding.'
  remediation: "Apply the machine config using the following command:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\"\
    \ ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 75-account-modifications-rules-$mcpool\n\
    \ labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n storage:\n\
    \ files:\n - contents:\n source: data:,-w%20/etc/sudoers.d/%20-p%20wa%20-k%20actions%0Aw%20/etc/sudoers%20-p%20wa%20-k%20actions%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/75-audit-sysadmin-actions.rules\n overwrite: true\n - contents:\n source: data:,-w%20/etc/group%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/30-etc_group_usergroup_modification.rules\n overwrite: true\n - contents:\n source:\
    \ data:,-w%20/etc/gshadow%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n mode: 0644\n path: /etc/audit/rules.d/30-etc_gshadow_usergroup_modification.rules\n\
    \ overwrite: true\n - contents:\n source: data:,-w%20/etc/security/opasswd%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/30etc_security_opasswd_usergroup_modification.rules\n overwrite: true\n - contents:\n\
