- id: '1.58'
  title: CNTR-OS-000740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must prevent the installation of patches, service packs, device drivers, or operating system components
    without verification they have been digitally signed using a certificate that is recognized and approved by the organization.
    GROUP ID: V-257561 RULE ID: SV-257561r961473'
  rationale: Integrity of the OpenShift platform is handled by the cluster version operator. The cluster version operator
    will by default GPG verify the integrity of the release image before applying it. The release image contains a sha256
    digest of machine-os-content which is used by the machine config operators for updates. On the host, the container runtime
    (podman) verifies the integrity of that sha256 when pulling the image before the machine config operator reads its content.
    Hence, there is end-to-end GPG-verified integrity for the operating system updates (as well as the rest of the cluster
    components which run as regular containers).
  impact: ''
  references: []
  page_start: 172
  audit_raw: 'To verify integrity of the cluster version, execute the following:

    oc get clusterversion version

    If the Cluster Version Operator is not installed or the AVAILABLE is not set to True, this

    is a finding.

    Run the following command to retrieve the Cluster Version objects in the system:

    oc get clusterversion version -o yaml

    If "verified: true", under status history for each item is not present, this is a finding.'
  remediation: 'By default, the integrity of RH CoreOS is checked by cluster version operator on

    OpenShift platform. If the integrity is not verified, reinstall of the cluster is necessary.

    Refer to instructions: https://docs.openshift.com/containerplatform/4.10/installing/index.html'
  checks:
  - type: manual_review
    info: 'To verify integrity of the cluster version, execute the following:

      oc get clusterversion version

      If the Cluster Version Operator is not installed or the AVAILABLE is not set to True, this

      is a finding.

      Run the following command to retrieve the Cluster Version objects in the system:

      oc get clusterversion version -o yaml

      If "verified: true", under status history for each item is not present, this is a finding.'
    severity: medium
- id: '1.59'
  title: CNTR-OS-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Vulnerability scanning applications must implement privileged access authorization to all OpenShift components,
    containers, and container images for selected organizationdefined vulnerability scanning activities. GROUP ID: V-257563
    RULE ID: SV-257563r961563'
  rationale: OpenShift uses service accounts to provide applications running on or off the platform access to the API service
    using the enforced RBAC policies. Vulnerability scanning applications that need access to the container platform may use
    a service account to grant that access. That service account can then be bound to the appropriate role required. The highest
    level of access granted is the cluster-admin role. Any account bound to that role can access and modify anything on the
    platform. It is strongly recommended to limit the number of accounts bound to that role. Instead, there are other predefined
    cluster level roles that may support the scanning to, such as the view or edit cluster roles. Additionally, custom roles
    may be defined to tailor fit access as needed by the scanning tools.
