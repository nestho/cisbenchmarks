- id: '1.20'
  title: CNTR-OS-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift components must provide the ability to send audit logs to a central enterprise repository for review
    and analysis. GROUP ID: V-257524 RULE ID: SV-257524r960918'
  rationale: 'Sending audit logs to a central enterprise repository allows for centralized log management. Instead of scattered
    logs across multiple OpenShift components, having a centralized repository simplifies log storage, retention, and retrieval.
    It provides a single source of truth for audit logs, making it easier to manage and analyze log data. Centralized audit
    logs are crucial for incident response and forensic investigations. When a security incident occurs, having audit logs
    in a central repository allows security teams to quickly access relevant log data for analysis. It facilitates incident
    reconstruction, root cause analysis, and the identification of the scope and impact of the incident. This is vital for
    effective incident response and minimizing the impact of security breaches. Satisfies: SRG-APP-000111-CTR-000220, SRG-APP-000092-CTR-000165,
    SRG-APP000358-CTR-000805'
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'Determine if cluster log forwarding is configured.

    1. Verify the cluster-logging operator is installed by executing the following:

    oc get subscription/cluster-logging -n openshift-logging

    (Example Output:

    NAME PACKAGE SOURCE CHANNEL

    cluster-logging cluster-logging redhat-operators stable

    )

    If the cluster-logging operator is not present, this is a finding.

    2. List the cluster log forwarders defined by executing the following:

    oc get clusterlogforwarder -n openshift-logging

    If there are no clusterlogforwarders defined, this is a finding.

    3. For each cluster log forwarder listed above, view the configuration details by

    executing the following:

    oc describe clusterlogforwarder/<CLF_NAME> -n openshift-logging

    Review the details of the cluster log forwarder.

    If the configuration is not set to forward logs the organization''s centralized logging

    service, this is a finding.'
  remediation: "To configure log forwarding, the OpenShift Cluster Logging operator first must be\ninstalled, and then the\
    \ Cluster Log Forwarder is configured to forward logs to a\ncentralized log aggregation service.\nTo install the OpenShift\
    \ Cluster Logging operator, execute the following command to\napply the subscription manifests to the cluster:\noc apply\
    \ -f - << 'EOF'\n---\napiVersion: project.openshift.io/v1\nkind: Project\nmetadata:\n labels:\n kubernetes.io/metadata.name:\
    \ openshift-logging\n openshift.io/cluster-monitoring: \"true\"\n name: openshift-logging\nspec: {}\n...\n---\napiVersion:\
    \ operators.coreos.com/v1\nkind: OperatorGroup\nmetadata:\n name: openshift-logging\n namespace: openshift-logging\nspec:\n\
    \ targetNamespaces:\n - openshift-logging\n...\n---\napiVersion: operators.coreos.com/v1alpha1\nkind: Subscription\nmetadata:\n\
    \ labels:\n operators.coreos.com/cluster-logging.openshift-logging: \"\"\n name: cluster-logging\n namespace: openshift-logging\n\
    spec:\n channel: stable\n installPlanApproval: Automatic\n name: cluster-logging\n source: redhat-operators\n sourceNamespace:\
    \ openshift-marketplace\n...\nEOF\nAfter the OpenShift Logging operator has finished installing, a ClusterLogForwarder\n\
    instance can be created to forward cluster logs to a log aggregator. A basic\nconfiguration that would forward OpenShift\
    \ audit, application, and infrastructure logs to\nan rsyslog server that is managed separately and is configured for mTLS\
    \ authentication\nover TCP when sending audit logs, but traditional UDP access for other types of logs,\ncan be provided\
    \ by editing the appropriate values in the Secret resource below and\nchanging the \"url\" parameters in the \"outputs\"\
    \ section of the \"spec\" below, then running\nthe command to apply (Example):\noc apply -f - << 'EOF'\n---\napiVersion:\
    \ v1\nkind: Secret\nmetadata:\n name: rsyslog-tls-secret\n namespace: openshift-logging\ndata:\n tls.crt: <base64 encoded\
    \ client certificate>\n tls.key: <base64 encoded client key>\n ca-bundle.crt: <base64 encoded CA bundle that signed the\
    \ certificate of\nyour rsyslog server>\n...\n---\napiVersion: logging.openshift.io/v1\nkind: ClusterLogForwarder\nmetadata:\n\
    \ name: instance\n namespace: openshift-logging\nspec:\n outputs:\n - name: rsyslog-audit\n type: syslog\n syslog:\n facility:\
    \ security\n rfc: RFC5424\n severity: Informational\n appName: openshift\n msgID: audit\n procID: audit\n url: 'tls://rsyslogserver.example.com:514'\n\
    \ secret:\n name: rsyslog-tls-secret\n - name: rsyslog-apps\n type: syslog\n syslog:\n facility: user\n rfc: RFC5424\n\
    \ severity: Informational\n appName: openshift\n msgID: apps\n procID: apps\n url: 'udp://rsyslogserver.example.com:514'\n\
    \ - name: rsyslog-infra\n type: syslog\n syslog:\n facility: local0\n rfc: RFC5424\n severity: Informational\n appName:\
    \ openshift\n msgID: infra\n procID: infra\n url: 'udp://rsyslogserver.example.com:514'\n pipelines:\n - name: audit-logs\n\
    \ inputRefs:\n - audit\n outputRefs:\n - rsyslog-audit\n - name: apps-logs\n inputRefs:\n - application\n outputRefs:\n\
    \ - rsyslog-apps\n - name: infrastructure-logs\n inputRefs:\n - infrastructure\n outputRefs:\n - rsyslog-infra\n...\n\
    EOF\nNote that many log forwarding destinations are supported, and the fix does not require\nthat users forward audit\
    \ logs to rsyslog over mTLS. To better understand how to\nconfigure the ClusterLogForwarder, consult the OpenShift Logging\
    \ documentation:\nhttps://docs.openshift.com/container-platform/4.8/logging/cluster-logging-external.html"
  checks:
  - type: manual_review
    info: 'Determine if cluster log forwarding is configured.

      1. Verify the cluster-logging operator is installed by executing the following:

      oc get subscription/cluster-logging -n openshift-logging

      (Example Output:

      NAME PACKAGE SOURCE CHANNEL

      cluster-logging cluster-logging redhat-operators stable

      )

      If the cluster-logging operator is not present, this is a finding.

      2. List the cluster log forwarders defined by executing the following:

      oc get clusterlogforwarder -n openshift-logging

      If there are no cluster'
    severity: medium
