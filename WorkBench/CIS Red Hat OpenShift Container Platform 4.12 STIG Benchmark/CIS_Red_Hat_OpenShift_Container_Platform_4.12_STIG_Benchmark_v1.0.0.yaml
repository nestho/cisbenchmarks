- id: '1.45'
  title: CNTR-OS-000570
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must disable virtual syscalls. GROUP ID: V-257549 RULE ID: SV-257549r961149'
  rationale: Virtual syscalls are a mechanism that allows user-space programs to make privileged system calls without transitioning
    to kernel mode. However, this feature can introduce additional security risks. Disabling virtual syscalls helps to mitigate
    potential vulnerabilities associated with this mechanism. By reducing the attack surface and limiting the ways in which
    user-space programs can interact with the kernel, OpenShift can enhance the overall security posture of the platform.
  impact: ''
  references: []
