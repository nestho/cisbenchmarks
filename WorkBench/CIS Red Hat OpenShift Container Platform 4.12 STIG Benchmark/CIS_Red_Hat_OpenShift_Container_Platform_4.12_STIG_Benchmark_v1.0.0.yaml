    \ to the following\nconditions:\\n\\n-The USG routinely intercepts and monitors communications on\nthis IS for purposes\
    \ including, but not limited to, penetration testing,\nCOMSEC monitoring, network operations and defense, personnel misconduct\
    \ (PM),\nlaw enforcement (LE), and counterintelligence (CI) investigations.\\n\\n-At any\ntime, the USG may inspect and\
    \ seize data stored on this IS.\\n\\nCommunications using, or data stored on, this IS are not private, are subject\nto\
    \ routine monitoring, interception, and search, and may be disclosed or used\nfor any USG-authorized purpose.\\n\\n-This\
    \ IS includes security measures (e.g.,\nauthentication and access controls) to protect USG interests--not for your\npersonal\
    \ benefit or privacy.\\n\\n-Notwithstanding the above, using this IS\ndoes not constitute consent to PM, LE or CI investigative\
    \ searching or\nmonitoring of the content of privileged communications, or work product,\nrelated to personal representation\
    \ or services by attorneys,\npsychotherapists, or clergy, and their assistants. Such communications and\nwork product\
    \ are private and confidential. See User Agreement for details.\"'\n| oc apply -f -"
  checks:
