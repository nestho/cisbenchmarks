    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -e module-load -e module-unload -e module-change

    /etc/audit/rules.d/* /etc/audit/audit.rules'' 2>/dev/null; done

