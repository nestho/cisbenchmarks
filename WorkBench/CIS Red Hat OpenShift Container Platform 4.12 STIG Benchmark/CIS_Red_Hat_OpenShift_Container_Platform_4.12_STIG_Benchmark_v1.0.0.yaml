    \ requests.cpu: \"1\"\n requests.memory: 1Gi\n requests.ephemeral-storage: 2Gi\n limits.cpu: \"2\"\n limits.memory: 2Gi\n\
    \ limits.ephemeral-storage: 4Gi\n2. Apply the ResourceQuota definition to the project namespace by executing the\nfollowing:\n\
    oc apply -f <YOURFILE>.yaml -n <NAMESPACE>\nDetails regarding the configuration of resource quotas can be reviewed at\n\
    https://docs.openshift.com/container-platform/4.8/applications/quotas/quotas-settingper-project.html."
  checks:
