    Verify the project request template creates a Network Policy:

    oc get templates/<PROJECT-REQUEST-TEMPLATE> -n openshift-config -o

    jsonpath="{.objects[?(.kind==''NetworkPolicy'')]}{''\n''}"

    Replace <PROJECT-REQUEST-TEMPLATE> with the name of the project request

    template returned from the earlier query. If the project template is not defined, or

    there are no Network Policy definitions in it, this is a finding.'
  remediation: "Configure a default network policy as necessary to protect the flow of information by\nperforming the following\
    \ steps:\n1. Create a bootstrap project template (if not already created) by executing the\nfollowing:\noc adm create-bootstrap-project-template\
    \ -o yaml > template.yaml\n2. Edit the template and add Network Policy object definitions before the\nparameters section.\
    \ For example, the following section defines two policies: one\nto allow requests from the same namespace and one to allow\
    \ from the OpenShift\ningress routing service.\n- apiVersion: networking.k8s.io/v1\n kind: NetworkPolicy\n metadata:\n\
    \ name: allow-from-same-namespace\n spec:\n podSelector:\n ingress:\n - from:\n - podSelector: {}\n- apiVersion: networking.k8s.io/v1\n\
    \ kind: NetworkPolicy\n metadata:\n name: allow-from-openshift-ingress\n spec:\n ingress:\n - from:\n - namespaceSelector:\n\
    \ matchLabels:\n network.openshift.io/policy-group: ingress\n podSelector: {}\n policyTypes:\n - Ingress\nparameters:\n\
    3. Apply the project template to the cluster by executing the following:\noc create -f template.yaml -n openshift-config\n\
    4. Set the default cluster project request template by executing the following:\noc patch project.config.openshift.io/cluster\
    \ --type=merge -p\n'{\"spec\":{\"projectRequestTemplate\":{\"name\": \"<PROJECT_REQUEST_TEMPLATE>\"}}}'\nFor additional\
    \ information regarding network policies, refer to\nhttps://docs.openshift.com/container-platform/4.8/networking/network_policy/aboutnetwork-policy.html."
