  rationale: 'By generating audit records for security object deletions, OpenShift enables administrators and security teams
    to track and investigate any unauthorized or suspicious removal of security objects. These records serve as valuable evidence
    for detecting and responding to potential security incidents. Audit records for unsuccessful attempts to delete security
    objects help in identifying unauthorized activities or potential attacks. If an unauthorized entity attempts to delete
    security objects, the audit records can serve as an early warning sign of a security threat. By monitoring and analyzing
    such records, administrators can detect and mitigate potential security breaches before they escalate. Audit records play
    a vital role in forensic analysis and investigation. In the event of a security incident or suspected compromise, audit
    logs for security object deletions provide valuable information for understanding the scope and impact of the incident.
