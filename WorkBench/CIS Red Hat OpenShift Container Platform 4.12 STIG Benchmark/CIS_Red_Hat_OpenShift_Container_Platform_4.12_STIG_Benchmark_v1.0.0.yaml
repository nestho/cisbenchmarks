- id: '1.29'
  title: CNTR-OS-000310
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must protect audit information from unauthorized modification. GROUP ID: V-257533 RULE ID: SV-257533r960933'
  rationale: 'If audit data were to become compromised, then competent forensic analysis and discovery of the true source
    of potentially malicious system activity is difficult if not impossible to achieve. In addition, access to audit records
    provides information an attacker could potentially use to his or her advantage. To ensure the veracity of audit data,
    the information system and/or the application must protect audit information from all unauthorized access. This includes
    read, write, and copy access. This requirement can be achieved through multiple methods, which will depend upon system
    architecture and design. Commonly employed methods for protecting audit information include least privilege permissions
    as well as restricting the location and number of log file repositories. Additionally, applications with user interfaces
    to audit records must not allow for the unfettered manipulation of or access to those records via the application. If
    the application provides access to the audit data, the application becomes accountable for ensuring audit information
    is protected from unauthorized access. Audit information includes all information (e.g., audit records, audit settings,
    and audit reports) needed to successfully audit information system activity. Satisfies: SRG-APP-000119-CTR-000245, SRG-APP-000120-CTR-000250'
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'Verify the audit system prevents unauthorized changes by executing the following

    command:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n ""$HOSTNAME ""; grep "^\-e\s2\s*$" /etc/audit/audit.rules

    /etc/audit/rules.d/* || echo "not found"'' 2>/dev/null; done

    If the check returns "not found", the audit system is not set to be immutable by adding

    the ""-e 2"" option to the ""/etc/audit/audit.rules"", this is a finding.'
  remediation: "Apply the machine config to prevent unauthorized changes by executing the following:\nfor mcpool in\n$(oc\
    \ get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\n\
    metadata:\n name: 90-immutable-rules-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n\
    \ ignition:\n version: 3.1.0\n storage:\n files:\n - contents:\n source: data:,-e%202%0A\n mode: 0600\n path: /etc/audit/rules.d/90-immutable.rules\n\
    \ overwrite: true\n\" | oc apply -f -\ndone"
  checks:
  - type: manual_review
    info: 'Verify the audit system prevents unauthorized changes by executing the following

      command:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n ""$HOSTNAME ""; grep "^\-e\s2\s*$" /etc/audit/audit.rules

      /etc/audit/rules.d/* || echo "not found"'' 2>/dev/null; done

      If the check returns "not found", the audit system is not set to be immutable by adding

      the ""-e 2"" option to the ""/etc/audit/audit.rules"", this is a finding.'
    severity: medium
- id: '1.30'
  title: CNTR-OS-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must prevent unauthorized changes to logon UIDs. GROUP ID: V-257534 RULE ID: SV-257534r960939'
  rationale: Logon UIDs are used to uniquely identify and authenticate users within the system. By preventing unauthorized
    changes to logon UIDs, OpenShift ensures that user identities remain consistent and accurate. This helps maintain the
    integrity of user accounts and ensures that users can be properly authenticated and authorized for their respective resources
    and actions. User accounts and associated logon UIDs are important for security monitoring, auditing, and accountability
    purposes. By preventing unauthorized changes to logon UIDs, OpenShift ensures that actions performed by users can be accurately
    traced and attributed to the correct user account. This helps with incident investigation, compliance requirements, and
    maintaining overall system security.
