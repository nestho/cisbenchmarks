- id: '1.69'
  title: CNTR-OS-000910
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Compliance Operator must be configured. GROUP ID: V-257573 RULE ID: SV-257573r961731'
  rationale: The Compliance Operator enables continuous compliance monitoring within OpenShift. It regularly assesses the
    environment against defined compliance policies and automatically detects and reports any deviations. This helps organizations
    maintain a proactive stance towards compliance, identify potential issues in real-time, and take corrective actions promptly.
    The Compliance Operator assesses compliance of both the Kubernetes API resources of OpenShift Container Platform, as well
    as the nodes running the cluster. The Compliance Operator uses OpenSCAP, a NIST-certified tool, to scan and enforce security
    policies provided by the content. This allows an organization to define organizational policy to align with the SSP, combine
    it with standardized vendorprovided content, and periodically scan the platform in accordance with organizationdefined
    policy.
  impact: ''
  references: []
  page_start: 193
  audit_raw: 'If Red Hat OpenShift Compliance Operator is not used, this check is Not Applicable.

    Note: If Red Hat OpenShift Compliance Operator is not used, run the checks manually.

    Review the cluster configuration to validate that all required security functions are being

    validated with the Compliance Operator.

    To determine if any scans have been applied to the cluster and the status of the scans,

    execute the following:

    oc get compliancescan -n openshift-compliance

    Example output: NAME PHASE RESULT

    ocp4-cis DONE NON-COMPLIANT

    ocp4-cis-manual DONE NON-COMPLIANT

    ocp4-cis-node-master DONE NON-COMPLIANT

    ocp4-cis-node-master-manual DONE NON-COMPLIANT

    ocp4-cis-node-worker DONE NON-COMPLIANT

    ocp4-cis-node-worker-manual DONE NON-COMPLIANT

    ocp4-moderate DONE NON-COMPLIANT

    ocp4-moderate-manual DONE NON-COMPLIANT

    rhcos4-moderate-master DONE NON-COMPLIANT

    rhcos4-moderate-master-manual DONE NON-COMPLIANT

    rhcos4-moderate-worker DONE NON-COMPLIANT

    rhcos4-moderate-worker-manual DONE NON-COMPLIANT

    If no ComplianceScan names return, the scans do not align to the organizationallydefined appropriate security functions,
    the command returns with an error, or any of the

    results show "NON-COMPLIANT" as their result, then this is a finding.'
  remediation: "If Red Hat OpenShift Compliance Operator is not used,, this check is Not Applicable.\nThe compliance operator\
    \ must be leveraged to ensure that components are configured\nin alignment with the SSP. Install the Compliance Operator\
    \ by executing the following:\noc apply -f - << 'EOF'\n---\napiVersion: project.openshift.io/v1\nkind: Project\nmetadata:\n\
    \ labels:\n kubernetes.io/metadata.name: openshift-compliance\n openshift.io/cluster-monitoring: \"true\"\n name: openshift-compliance\n\
    spec: {}\n...\n---\napiVersion: operators.coreos.com/v1\nkind: OperatorGroup\nmetadata:\n name: compliance-operator\n\
    \ namespace: openshift-compliance\nspec:\n targetNamespaces:\n - openshift-compliance\n...\n---\napiVersion: operators.coreos.com/v1alpha1\n\
    kind: Subscription\nmetadata:\n name: compliance-operator\n namespace: openshift-compliance\nspec:\n channel: release-0.1\n\
    \ installPlanApproval: Automatic\n name: compliance-operator\n source: redhat-operators\n sourceNamespace: openshift-marketplace\n\
    ...\nEOF\nFollowing installation of the Compliance Operator, a ScanSettingBinding object that\nconfigures the Compliance\
    \ Operator to use the desired profile sets must be created.\nTailoredProfiles enable customization of controls to meet\
    \ specific organizational\ncontrols defined in the SSP and can be based on existing profiles or written from\nscratch\
    \ in standard SCAP format. If users have the definition for ScanSettingBinding\nthat aligns profiles with ScanSettings\
    \ in a YAML file named my-scansettingbinding.yml,\nusers would apply that ScanSettingBinding by executing the following:\n\
    oc apply -f my-scansettingbinding.yml -n openshift-compliance\nFor more information about the compliance operator and\
    \ its use, including the creation\nof TailoredProfiles and the ScanSettings available to meet specific security functions\
    \ or\norganizational goals defined in the SSP, refer to https://docs.openshift.com/containerplatform/4.8/security/compliance_operator/compliance-operator-understanding.html."
  checks:
  - type: manual_review
    info: 'If Red Hat OpenShift Compliance Operator is not used, this check is Not Applicable.

      Note: If Red Hat OpenShift Compliance Operator is not used, run the checks manually.

      Review the cluster configuration to validate that all required security functions are being

      validated with the Compliance Operator.

      To determine if any scans have been applied to the cluster and the status of the scans,

      execute the following:

      oc get compliancescan -n openshift-compliance

      Example output: NAME PHASE RESULT

      ocp4-cis'
    severity: medium
- id: '1.70'
  title: CNTR-OS-000920
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must perform verification of the correct operation of security functions: upon startup and/or restart;
