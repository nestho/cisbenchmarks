controls:
- id: '1.1'
  title: CNTR-OS-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must use TLS 1.2 or greater for secure container image transport from trusted sources. GROUP ID:
    V-257505 RULE ID: SV-257505r960759'
  rationale: The authenticity and integrity of the container image during the container image lifecycle is part of the overall
    security posture of the container platform. This begins with the container image creation and pull of a base image from
    a trusted source for child container image creation and the instantiation of the new image into a running service. If
    an insecure protocol is used during transmission of container images at any step of the lifecycle, a bad actor may inject
    nefarious code into the container image. The container image, when instantiated, then becomes a security risk to the container
    platform, the host server, and other containers within the container platform. To thwart the injection of code during
    transmission, a secure protocol (TLS 1.2 or newer) must be used. Further guidance on secure transport protocols can be
    found in NIST SP 800-52.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Verify that no insecure registries are configured by executing the following:

    oc get image.config.openshift.io/cluster -

    ojsonpath=''{.spec.allowedRegistriesForImport}'' | jq -r ''.[] |

    select(.insecure == true)''

    If the above query finds any registries, this is a finding. Empty output is not a finding.

    Verify that no insecure registries are configured by executing the following:

    oc get image.config.openshift.io/cluster -

    ojsonpath=''{.spec.registrySources.insecureRegistries}''

    If the above query returns anything, then this is a finding. Empty output is not a finding.'
  remediation: 'Remove insecure registries from the cluster''s image registry configuration by executing

    the following:

    oc edit image.config.openshift.io/cluster

    Edit or remove any registries where insecure is set to true or are listed under

    insecureRegistries.

    Refer to https://docs.openshift.com/container-platform/4.8/openshift_images/imageconfiguration.html for more details on
    configuring registries in OpenShift.'
  checks:
  - type: manual_review
    info: 'Verify that no insecure registries are configured by executing the following:

      oc get image.config.openshift.io/cluster -

      ojsonpath=''{.spec.allowedRegistriesForImport}'' | jq -r ''.[] |

      select(.insecure == true)''

      If the above query finds any registries, this is a finding. Empty output is not a finding.

      Verify that no insecure registries are configured by executing the following:

      oc get image.config.openshift.io/cluster -

      ojsonpath=''{.spec.registrySources.insecureRegistries}''

      If the above query retu'
    severity: medium
- id: '1.2'
  title: CNTR-OS-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must use TLS 1.2 or greater for secure communication. GROUP ID: V-257506 RULE ID: SV-257506r960759'
  rationale: 'The authenticity and integrity of the container platform and communication between nodes and components must
    be secure. If an insecure protocol is used during transmission of data, the data can be intercepted and manipulated. The
    manipulation of data can be used to inject status changes of the container platform, causing the execution of containers
    or reporting an incorrect healthcheck. To thwart the manipulation of the data during transmission, a secure protocol (TLS
    1.2 or newer) must be used. Further guidance on secure transport protocols can be found in NIST SP 80052. Satisfies: SRG-APP-000014-CTR-000040,
    SRG-APP-000560-CTR-001340'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Verify the TLS Security Profile is not set to a profile that does not enforce TLS 1.2 or

    above.

    View the TLS security profile for the ingress controllers by executing the following:

    oc get --all-namespaces ingresscontrollers.operator.openshift.io -ocustomcolumns="NAME":.metadata.name,"NAMESPACE":.metadata.namespace,"TLS

    PROFILE":.spec.tlsSecurityProfile

    View the TLS security profile for the control plane by executing the following:

    oc get APIServer cluster -ocustom-columns="TLS

    PROFILE":.spec.tlsSecurityProfile

    View the TLS profile for the Kubelet by executing the following:

    oc get kubeletconfigs -ocustom-columns="NAME":.metadata.name,"TLS

    PROFILE":.spec.tlsSecurityProfile

    If any of the above returns a TLS profile of "Old", this is a finding.

    If any of the above returns a TLS profile of "Custom" and the minTLSVersion is not set

    to "VersionTLS12" or greater, this is a finding.

    If the above returns "" TLS profile, this is not a finding as the TLS profile defaults

    to "Intermediate".

    If the kubelet TLS profile check does not return any kubeletconfigs, this is not a finding

    as the default OCP installation uses defaults only.'
  remediation: "Edit each resource and set the TLS Security Profile to Intermediate by executing the\nfollowing:\noc edit\
    \ ingresscontroller <NAME> -n <NAMESPACE>\nAdd the following to the file:\napiVersion: config.openshift.io/v1\nkind: IngressController\n\
    \ ...\nspec:\n tlsSecurityProfile:\n intermediate: {}\n type: Intermediate\nEdit API Server by executing the following:\n\
    oc edit APIServer\nAdd the following to the file:\napiVersion: config.openshift.io/v1\nkind: APIServer\n ...\nspec:\n\
    \ tlsSecurityProfile:\n intermediate: {}\n type: Intermediate\nEdit Kubelet by executing the following:\noc edit KubeletConfig\
    \ <NAME>\nSet to the following:\napiVersion: config.openshift.io/v1\nkind: KubeletConfig\n ...\nspec:\n tlsSecurityProfile:\n\
    \ intermediate: {}\n type: Intermediate"
  checks:
  - type: manual_review
    info: 'Verify the TLS Security Profile is not set to a profile that does not enforce TLS 1.2 or

      above.

      View the TLS security profile for the ingress controllers by executing the following:

      oc get --all-namespaces ingresscontrollers.operator.openshift.io -ocustomcolumns="NAME":.metadata.name,"NAMESPACE":.metadata.namespace,"TLS

      PROFILE":.spec.tlsSecurityProfile

      View the TLS security profile for the control plane by executing the following:

      oc get APIServer cluster -ocustom-columns="TLS

      PROFILE":.spec.tl'
    severity: medium
- id: '1.3'
  title: CNTR-OS-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must use a centralized user management solution to support account management functions. GROUP ID:
    V-257507 RULE ID: SV-257507r1043176'
  rationale: OpenShift supports several different types of identity providers. To add users and grant access to OpenShift,
    an identity provider must be configured. Some of the identity provider types such as HTPassword only provide simple user
    management and are not intended for production. Other types are public services like GitHub. These provider types are
    not appropriate as they are managed by public service providers, and therefore are unable to enforce the organizations
    account management requirements. Use either the LDAP or the OpenIDConnect Identity Provider type to configure OpenShift
    to use the organizations centrally managed IdP that is able to enforce the organization's policies regarding user identity
    management.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Verify the authentication operator is configured to use either an LDAP or a

    OpenIDConnect provider by executing the following:

    oc get oauth cluster -o jsonpath="{.spec.identityProviders[*].type}{''\n''}"

    If the output lists any other type besides LDAP or OpenID, this is a finding.'
  remediation: "Configure OpenShift to use an appropriate Identity Provider. Do not use HTPasswd.\nUse either LDAP(AD), OpenIDConnect,\
    \ or an approved identity provider.\nTo configure LDAP provider:\n1. Create Secret for BIND DN password by executing the\
    \ following:\noc create secret generic ldap-secret --from-literal=bindPassword=<secret> -n\nopenshift-config\n2. Create\
    \ config map for LDAP Trust CA by executing the following:\noc create configmap ca-config-map --from-file=ca.crt=/path/to/ca\
    \ -n\nopenshift-config\n3. Create LDAP Auth Config Resource YAML: Using the preferred text editor,\ncreate a file named\
    \ ldapidp.yaml using the example content. (replacing config\nvalues as appropriate):\napiVersion: config.openshift.io/v1\n\
    kind: OAuth\nmetadata:\n name: cluster\nspec:\n identityProviders:\n - name: ldapidp\n mappingMethod: claim\n type: LDAP\n\
    \ ldap:\n attributes:\n id:\n - dn\n email:\n - mail\n name:\n - cn\n preferredUsername:\n - uid\n bindDN: <\"bindDN\"\
    >\n bindPassword:\n name: ldap-secret\n ca:\n name: ca-config-map\n insecure: false\n url: <URL>\n4. Apply LDAP config\
    \ to cluster by executing the following:\noc apply -f ldapidp.yaml\nNote: For more information on configuring an LDAP\
    \ provider, refer to\nhttps://docs.openshift.com/containerplatform/4.8/authentication/identity_providers/configuring-ldap-identityprovider.html.\n\
    To configure OpenID provider:\n1. Create Secret for Client Secret by executing the following:\noc create secret generic\
    \ idp-secret --from-literal=clientSecret= -n openshift-config\n2. Create config map for OpenID Trust CA by executing the\
    \ following:\noc create configmap ca-config-map --from-file=ca.crt=/path/to/ca -n\nopenshift-config\n3. Create OpenID\
    \ Auth Config Resource YAML. Using the preferred text editor,\ncreate a file named oidcidp.yaml using the example content\
    \ (replacing config\nvalues as appropriate).\napiVersion: config.openshift.io/v1\nkind: OAuth\nmetadata:\n name: cluster\n\
    spec:\n identityProviders:\n - name: oidcidp\n mappingMethod: claim\n type: OpenID\n openID:\n clientID: <clientID>\n\
    \ clientSecret:\n name: oidc-idp-secret\n claims:\n preferredUsername:\n - preferred_username\n name:\n - name\n email:\n\
    \ - email\n ca:\n name: ca-config-map\n issuer: <URL>\n4. Apply OpenID config to cluster by executing the following:\n\
    oc apply -f ldapidp.yaml\nNote: For more information on configuring an OpenID provider, refer to\nhttps://docs.openshift.com/containerplatform/4.8/authentication/identity_providers/configuring-oidc-identityprovider.html."
  checks:
  - type: manual_review
    info: 'Verify the authentication operator is configured to use either an LDAP or a

      OpenIDConnect provider by executing the following:

      oc get oauth cluster -o jsonpath="{.spec.identityProviders[*].type}{''\n''}"

      If the output lists any other type besides LDAP or OpenID, this is a finding.'
    severity: medium
- id: '1.4'
  title: CNTR-OS-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The kubeadmin account must be disabled. GROUP ID: V-257508 RULE ID: SV-257508r1043176'
  rationale: Using a centralized user management solution for account management functions enhances security, simplifies administration,
    improves user experience, facilitates compliance, and provides scalability and integration capabilities. It is a foundational
    element of effective identity and access management practices. OpenShift supports several different types of identity
    providers. To add users and grant access to OpenShift, an identity provider needs to be configured. Some of the identity
    provider types, such as HTPassword, only provide simple user management and are not intended for production. Other types
    are public services, like GitHub. These provider types may not be appropriate as they are managed by public service providers
    and therefore are unable to enforce the organizations account management requirements. After a new install, the default
    authentication uses kubeadmin as the default clusteradmin account. This default account must be disabled and another user
    account must be given cluster-admin rights.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Verify the kubeadmin account is disabled by executing the following:

    oc get secrets kubeadmin -n kube-system

    If the command returns an error, the secret was not found, and this is not a finding.

    (Example output: Error from server (NotFound): secrets "kubeadmin" not found)

    If the command returns a listing that includes the kubeadmin secret, its type, the data

    count, and age, this is a finding.

    (Example Output for not a finding: NAME TYPE DATA AGE kubeadmin Opaque 1

    6h3m)'
  remediation: 'If an alternative IDP is already configured and an administrative user exists with the role

    of cluster-admin, disable the kubeadmin account by running the following command as

    a cluster administrator:

    oc delete secrets kubeadmin -n kube-system'
  checks:
  - type: manual_review
    info: 'Verify the kubeadmin account is disabled by executing the following:

      oc get secrets kubeadmin -n kube-system

      If the command returns an error, the secret was not found, and this is not a finding.

      (Example output: Error from server (NotFound): secrets "kubeadmin" not found)

      If the command returns a listing that includes the kubeadmin secret, its type, the data

      count, and age, this is a finding.

      (Example Output for not a finding: NAME TYPE DATA AGE kubeadmin Opaque 1

      6h3m)'
    severity: medium
- id: '1.5'
  title: CNTR-OS-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must automatically audit account creation. GROUP ID: V-257509 RULE ID: SV-257509r960777'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create a new account. Auditing account creation
    is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail documents
    the creation of application user accounts and, as required, notifies administrators and/or application owners exists.
    Such a process greatly reduces the risk that accounts will be surreptitiously created and provides logging that can be
    used for forensic purposes. To address access requirements, many application developers choose to integrate their applications
    with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
    Such integration allows the application developer to off-load those access control functions and focus on core application
    features and functionality.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify Red Hat Enterprise Linux CoreOS (RHCOS) generates audit records for all

    account creations, modifications, disabling, and termination events that affect

    "/etc/shadow".

    Logging on as administrator, check the auditing rules in "/etc/audit/audit.rules" by

    executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME: "; grep /etc/shadow /etc/audit/audit.rules

    /etc/audit/rules.d/*''; done

    (Example output: -w /etc/shadow -p wa -k identity)

    If the command does not return a line, or the line is commented out, this is a finding.'
  remediation: "Apply the machine config using the following command:\nfor mcpool in\n$(oc get mcp -oname | sed \"s:.*/::\"\
    \ ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n name: 75-account-modifications-rules-$mcpool\n\
    \ labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n ignition:\n version: 3.1.0\n storage:\n\
    \ files:\n - contents:\n source: data:,-w%20/etc/sudoers.d/%20-p%20wa%20-k%20actions%0Aw%20/etc/sudoers%20-p%20wa%20-k%20actions%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/75-audit-sysadmin-actions.rules\n overwrite: true\n - contents:\n source: data:,-w%20/etc/group%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/30-etc_group_usergroup_modification.rules\n overwrite: true\n - contents:\n source:\
    \ data:,-w%20/etc/gshadow%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n mode: 0644\n path: /etc/audit/rules.d/30-etc_gshadow_usergroup_modification.rules\n\
    \ overwrite: true\n - contents:\n source: data:,-w%20/etc/security/opasswd%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/30etc_security_opasswd_usergroup_modification.rules\n overwrite: true\n - contents:\n\
    \ source: data:,-w%20/etc/passwd%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n mode: 0644\n path: /etc/audit/rules.d/30-etc_passwd_usergroup_modification.rules\n\
    \ overwrite: true\n - contents:\n source: data:,-w%20/etc/shadow%20-p%20wa%20k%20audit_rules_usergroup_modification%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/30-etc_shadow_usergroup_modification.rules\n overwrite: true\n\" | oc apply -f\
    \ -\ndone"
  checks:
  - type: manual_review
    info: 'Verify Red Hat Enterprise Linux CoreOS (RHCOS) generates audit records for all

      account creations, modifications, disabling, and termination events that affect

      "/etc/shadow".

      Logging on as administrator, check the auditing rules in "/etc/audit/audit.rules" by

      executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME: "; grep /etc/shadow /etc/audit/audit.rules

      /etc/audit/rules.d/*''; done

      (Example output: -w /etc/shadow -p wa -k '
    severity: medium
- id: '1.6'
