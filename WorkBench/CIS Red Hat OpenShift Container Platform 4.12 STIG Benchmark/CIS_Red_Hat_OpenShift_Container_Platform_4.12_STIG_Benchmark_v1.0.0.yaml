- id: '1.12'
  title: CNTR-OS-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records for all DOD-defined auditable events within all components in the platform.
    GROUP ID: V-257517 RULE ID: SV-257517r960879'
  rationale: 'The OpenShift Platform supports three audit levels: Default, WriteRequestBodies, and AllRequestBodies. The identities
    of the users are logged for all three audit levels log level. The WriteRequestBodies will log the metadata and the request
    body for any create, update, or patch request. The AllRequestBodies will log the metadata and the request body for all
    read and write requests. As this generates a significant number of logs, this level is only to be used as needed. To capture
    sufficient data to investigate an issue, it is required to set the audit level to WriteRequestBodies. For more detailed
    documentation on what is being logged, refer to https://docs.openshift.com/container-platform/4.8/security/audit-log-view.html.
    Satisfies: SRG-APP-000089-CTR-000150, SRG-APP-000090-CTR-000155, SRG-APP000101-CTR-000205, SRG-APP-000510-CTR-001310,
    SRG-APP-000516-CTR-000790'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'To determine at what level the OpenShift audit policy logging verbosity is configured, as

    a cluster-administrator:execute the following command:

    oc get apiserver.config.openshift.io/cluster -

    ojsonpath=''{.spec.audit.profile}''

    If the output from the options does not return WriteRequestBodies or AllRequestBodies,

    this is a finding.'
  remediation: 'As the cluster administrator, update the APIServer.config.openshift.io/cluster object to

    set the profile to the defined level of detail. For example, to configure the profile to

    WriteRequestBodies, meaning that all write requests to any API server object are

    logged in their entirety, by executing the following:

    oc patch apiserver.config.openshift.io/cluster --type=merge -p ''{"spec":

    {"audit": {"profile": "WriteRequestBodies"}}}'''
  checks:
  - type: manual_review
    info: 'To determine at what level the OpenShift audit policy logging verbosity is configured, as

      a cluster-administrator:execute the following command:

      oc get apiserver.config.openshift.io/cluster -

      ojsonpath=''{.spec.audit.profile}''

      If the output from the options does not return WriteRequestBodies or AllRequestBodies,

      this is a finding.'
    severity: medium
- id: '1.13'
  title: CNTR-OS-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'OpenShift must display the Standard Mandatory DOD Notice and Consent Banner before granting access to platform
    components. GROUP ID: V-257516 RULE ID: SV-257516r960843'
  rationale: OpenShift has countless components where different access levels are needed. To control access, the user must
    first log into the component and then be presented with a DOD-approved use notification banner before granting access
    to the component. This guarantees privacy and security notification verbiage used is consistent with applicable federal
    laws, Executive Orders, directives, policies, regulations, standards, and guidance.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'To verify the OpenShift CLI tool is configured to display the DOD Notice and Consent

    Banner, do either of the following steps:

