- id: '1.76'
  title: CNTR-OS-000980
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Red Hat Enterprise Linux CoreOS (RHCOS) must be configured to audit the loading and unloading of dynamic kernel
    modules. GROUP ID: V-257580 RULE ID: SV-257580r961827'
  rationale: By generating audit logs for the loading and unloading of dynamic kernel modules, OpenShift enables administrators
    and security teams to track and investigate any unauthorized or suspicious changes to the kernel modules. These records
    serve as a vital source of information for detecting and responding to potential security breaches or unauthorized module
    manipulations. Audit records play a crucial role in forensic analysis and investigation. In the event of a security incident
    or suspected compromise, audit logs for dynamic kernel module loading and unloading provide valuable information for understanding
    the sequence of events and identifying any unauthorized or malicious module manipulations. Audit records for module loading
    and unloading can be used for system performance analysis and troubleshooting. By reviewing these records, administrators
    can identify any problematic or misbehaving modules that may affect system performance or stability. This helps in diagnosing
    and resolving issues related to kernel modules more effectively.
  impact: ''
  references: []
  page_start: 236
  audit_raw: 'Verify the audit rules capture loading and unloading of kernel modules by executing the

    following:

