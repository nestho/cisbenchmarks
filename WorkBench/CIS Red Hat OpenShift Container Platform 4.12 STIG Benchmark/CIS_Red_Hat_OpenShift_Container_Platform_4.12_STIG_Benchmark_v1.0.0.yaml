    \ name: 05-kernelarg-page-poison-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n\
    \ ignition:\n version: 3.1.0\n kernelArguments:\n - page_poison=1\n\" | oc apply -f -done"
  checks:
