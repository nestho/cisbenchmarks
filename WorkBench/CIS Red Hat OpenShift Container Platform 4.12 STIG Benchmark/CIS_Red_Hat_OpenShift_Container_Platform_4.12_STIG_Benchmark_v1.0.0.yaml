- id: '1.71'
  title: CNTR-OS-000930
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records when successful/unsuccessful attempts to modify privileges occur. GROUP
    ID: V-257575 RULE ID: SV-257575r961800'
  rationale: Audit records provide a crucial source of information for security monitoring and incident response. By generating
    audit records for privilege modification attempts, OpenShift enables administrators and security teams to track and investigate
    any unauthorized or suspicious changes to privileges. These records serve as an essential source of evidence for detecting
    and responding to potential security incidents. Audit records for unsuccessful attempts to modify privileges help in identifying
    unauthorized activities or potential attacks. If an unauthorized entity attempts to modify privileges, the audit records
    can serve as an early warning sign of a security threat. By monitoring and analyzing such records, administrators can
    detect and mitigate potential security breaches before they escalate. Audit records play a vital role in forensic analysis
    and investigation. In the event of a security incident or suspected compromise, audit logs for privilege modifications
    provide valuable information for understanding the scope and impact of the incident.
  impact: ''
  references: []
  page_start: 201
  audit_raw: 'Verify OpenShift is configured to generate audit records when successful/unsuccessful

    attempts to modify privileges occur by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -e "key=unsuccessful-create" -e "key=unsuccessfulmodification" -e "key=delete" -e "key=unsuccessful-access"
    -e "actions" -e

    "key=perm_mod" -e "audit_rules_usergroup_modification" -e "module-change" -

    e "logins" /etc/audit/audit.rules'' 2>/dev/null; done

    Confirm the following rules exist on each node:

    -w /etc/group -p wa -k audit_rules_usergroup_modification

    -w /etc/gshadow -p wa -k audit_rules_usergroup_modification

    -w /etc/passwd -p wa -k audit_rules_usergroup_modification

    -w /etc/security/opasswd -p wa -k audit_rules_usergroup_modification

    -w /etc/shadow -p wa -k audit_rules_usergroup_modification

    -a always,exit -F arch=b32 -S openat,open_by_handle_at -F a2&0x40 -F exit=-

    EACCES -F auid>=1000 -F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b64 -S openat,open_by_handle_at -F a2&0x40 -F exit=-

    EACCES -F auid>=1000 -F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b32 -S open -F a1&0x40 -F exit=-EACCES -F auid>=1000 -

    F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b64 -S open -F a1&0x40 -F exit=-EACCES -F auid>=1000 -

    F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b32 -S openat,open_by_handle_at -F a2&0x40 -F exit=-

    EPERM -F auid>=1000 -F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b64 -S openat,open_by_handle_at -F a2&0x40 -F exit=-

    EPERM -F auid>=1000 -F auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b32 -S open -F a1&0x40 -F exit=-EPERM -F auid>=1000 -F

    auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b64 -S open -F a1&0x40 -F exit=-EPERM -F auid>=1000 -F

    auid!=unset -F key=unsuccessful-create

    -a always,exit -F arch=b32 -S creat -F exit=-EACCES -F auid>=1000 -F

    auid!=unset -F key=unsuccessful-create

