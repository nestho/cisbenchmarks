  rationale: OpenShift provides for two types of application level ingress types, Routes, and Ingresses. Routes have been
    a part of OpenShift since version 3. Ingresses were promoted out of beta in Aug 2020 (kubernetes v1.19). Routes provides
    for three type of TLS configuration options; Edge, Passthrough, and Re-encrypt. Each of those options provide TLS encryption
    over HTTP for inbound transmissions originating outside the cluster. Ingresses will have an IngressController associated
    that manages the routing and proxying of inbound transmissions.
