  audit_raw: 'If Red Hat OpenShift Compliance Operator is not used, this check is Not Applicable.

    Review the cluster configuration to validate that all required security functions are being

    validated with the Compliance Operator.

    To map the schedule of every profile through its ScanSettingBinding and output the

    schedules on which each Profile or TailoredProfile is run, execute the following

    commands:

    declare -A binding_profiles

    declare -A binding_schedule

    while read binding setting profiles; do

    binding_profiles[$binding]="$profiles"; binding_schedule[$binding]=$(oc get

    scansetting -n openshift-compliance $setting -ojsonpath=''{.schedule}''); done

    < <(oc get scansettingbinding -n openshift-compliance -ojsonpath=''{range

    .items[*]}{.metadata.name} {.settingsRef.name} {range .profiles[*]}{.name}

    {end}{"\n"}{end}'')

    for binding in

    "${!binding_profiles[@]}"; do for profile in ${binding_profiles[$binding]};

    do echo "$profile: ${binding_schedule[$binding]}"; done; done

    If any error is returned, this is a finding.

    If the schedules are not at least monthly or within the organizationally defined

    periodicity, this is a finding.

    Check the profiles that are bound to schedules by executing the following:

    To determine which rules are enforced by the profiles that are currently bound to the

    scheduled periodicities, execute the following commands:

    for binding in

    "${!binding_profiles[@]}"; do for profile in ${binding_profiles[$binding]};

    do for rule in $(oc get profile.compliance $profile -n openshift-compliance -

    ojsonpath=''{range .rules[*]}{$}{"\n"}{end}''); do echo "$rule:

    ${binding_schedule[$binding]}"; done; done; done | sort -u

    If the profiles that are bound to schedules do not cover the organization-designed

    security functions, this is a finding.'
  remediation: "If Red Hat OpenShift Compliance Operator is not used, this check is Not Applicable.\nThe compliance operator\
    \ must be leveraged to ensure that components are configured\nin alignment with the SSP at a desired schedule. Install\
    \ the Compliance Operator by\nexecuting the following:\noc apply -f - << 'EOF'\n---\napiVersion: project.openshift.io/v1\n\
    kind: Project\nmetadata:\n labels:\n kubernetes.io/metadata.name: openshift-compliance\n openshift.io/cluster-monitoring:\
    \ \"true\"\n name: openshift-compliance\nspec: {}\n...\n---\napiVersion: operators.coreos.com/v1\nkind: OperatorGroup\n\
    metadata:\n name: compliance-operator\n namespace: openshift-compliance\nspec:\n targetNamespaces:\n - openshift-compliance\n\
    ...\n---\napiVersion: operators.coreos.com/v1alpha1\nkind: Subscription\nmetadata:\n name: compliance-operator\n namespace:\
    \ openshift-compliance\nspec:\n channel: release-0.1\n installPlanApproval: Automatic\n name: compliance-operator\n source:\
    \ redhat-operators\n sourceNamespace: openshift-marketplace\n...\nEOF\nFollowing installation of the Compliance Operator,\
    \ a ScanSettingBinding object that\nconfigures the Compliance Operator to use the desired scan cadence must be created.\n\
    If users have the definition for ScanSettingBinding in a YAML file named myscansettingbinding.yml, users would apply that\
    \ ScanSettingBinding by executing the\nfollowing:\noc apply -f my-scansettingbinding.yml -n openshift-compliance\nFor\
    \ more information about the compliance operator and its use, including the\nconfigurability of scheduling of scan cadence\
    \ in ScanSetting resources and the rolebased access control requirements for manually triggered scans, refer to\nhttps://docs.openshift.com/containerplatform/4.8/security/compliance_operator/compliance-operator-understanding.html."
  checks:
  - type: manual_review
