- id: '1.73'
  title: CNTR-OS-000950
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records when successful/unsuccessful attempts to delete privileges occur. GROUP
    ID: V-257577 RULE ID: SV-257577r961812'
  rationale: Audit records for unsuccessful attempts to delete privileges help in identifying unauthorized activities or potential
    attacks. If an unauthorized entity attempts to remove privileges, the audit records can serve as an early warning sign
    of a security threat. By monitoring and analyzing such records, administrators can detect and mitigate potential security
    breaches before they escalate. Audit records play a vital role in forensic analysis and investigation. In the event of
    a security incident or suspected compromise, audit logs for privilege deletions provide valuable information for understanding
    the scope and impact of the incident.
  impact: ''
  references: []
  page_start: 219
  audit_raw: 'Verify OpenShift is configured to generate audit records when successful/unsuccessful

    attempts to delete security privileges occur by executing the following:

    for node in $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo

    -n "$HOSTNAME "; grep -e "key=delete" -e "key=perm_mod" -e "key=privileged" -e

    "audit_rules_usergroup_modification" /etc/audit/audit.rules'' 2>/dev/null; done

    Confirm the following rules exist on each node:

    -w /etc/group -p wa -k audit_rules_usergroup_modification -w /etc/gshadow -p wa -k

