    -a always,exit -F arch=b32 -S init_module,finit_module -F key=module-load

    -a always,exit -F arch=b64 -S init_module,finit_module -F key=module-load

    -a always,exit -F arch=b32 -S delete_module -F key=module-unload

    -a always,exit -F arch=b64 -S delete_module -F key=module-unload

    -a always,exit -F arch=b32 -S delete_module -k module-change

    -a always,exit -F arch=b64 -S delete_module -k module-change

    -a always,exit -F arch=b32 -S finit_module -k module-change

    -a always,exit -F arch=b64 -S finit_module -k module-change

    -a always,exit -F arch=b32 -S init_module -k module-change

    -a always,exit -F arch=b64 -S init_module -k module-change

    If the above rules are not listed for each node, this is a finding.'
  remediation: "Apply the machine config for audit rules capture by executing the following:\nfor mcpool in\n$(oc get mcp\
    \ -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\nmetadata:\n\
    \ name: 75-kernel-modules-rules-$mcpool\n labels:\n machineconfiguration.openshift.io/role: $mcpool\nspec:\n config:\n\
    \ ignition:\n version: 3.1.0\n storage:\n files:\n - contents:\n source:\ndata:,%23%23%20These%20rules%20watch%20for%20kernel%20module%20insertion.%20B\n\
    y%20monitoring%0A%23%23%20the%20syscall%2C%20we%20do%20not%20need%20any%20wat\nches%20on%20programs.%0A-a%20always%2Cexit%20-F%20arch%3Db32%20S%20init_module%2Cfinit_module%20-F%20key%3Dmodule-load%0Aa%20always%2Cexit%20-F%20arch%3Db64%20-S%20init_module%2Cfinit_module%20F%20key%3Dmodule-load%0A-a%20always%2Cexit%20-F%20arch%3Db32%20S%20delete_module%20-F%20key%3Dmodule-unload%0A-a%20always%2Cexit%20F%20arch%3Db64%20-S%20delete_module%20-F%20key%3Dmodule-unload%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/43-module-load.rules\n overwrite: true\n - contents:\n source: data:,-a%20always%2Cexit%20-F%20arch%3Db32%20S%20delete_module%20-k%20module-change%0A-a%20always%2Cexit%20F%20arch%3Db64%20-S%20delete_module%20-k%20module-change%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/75-kernel-module-loading-delete.rules\n overwrite: true\n - contents:\n source:\
    \ data:,-a%20always%2Cexit%20-F%20arch%3Db32%20S%20finit_module%20-k%20module-change%0A-a%20always%2Cexit%20F%20arch%3Db64%20-S%20finit_module%20-k%20module-change%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/75-kernel-module-loading-finit.rules\n overwrite: true\n - contents:\n source:\
    \ data:,-a%20always%2Cexit%20-F%20arch%3Db32%20S%20init_module%20-k%20module-change%0A-a%20always%2Cexit%20F%20arch%3Db64%20-S%20init_module%20-k%20module-change%0A\n\
    \ mode: 0644\n path: /etc/audit/rules.d/75-kernel-module-loading-init.rules\n overwrite: true\n\" | oc apply -f -done"
  checks:
  - type: manual_review
    info: 'Verify the audit rules capture loading and unloading of kernel modules by executing the

      following:

      for node in

