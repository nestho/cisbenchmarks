  description: 'OpenShift must restrict individuals the ability to launch organizational-defined Denial-ofService (DOS) attacks
    against other information systems by rate-limiting. GROUP ID: V-257555 RULE ID: SV-257555r961152'
  rationale: By setting rate limits, OpenShift can control the number of requests or connections allowed from a single source
    within a specific period. This prevents an excessive influx of requests that can overwhelm the application and degrade
    its performance or availability. Setting rate limits also ensures fair resource allocation, prevents service degradation,
    protects backend systems, and enhances overall security. Along with, helping to maintain the availability, performance,
    and security of the applications hosted on the platform, contributing to a reliable and robust application infrastructure.
    OpenShift has an option to set the rate limit for Routes (refer to link below) when creating new Routes. All routes outside
    the OpenShift namespaces and the kube namespaces must use the rate-limiting annotations. https://docs.openshift.com/container-platform/4.9/networking/routes/routeconfiguration.html#nw-route-specific-annotations_route-configuration
  impact: ''
  references: []
  page_start: 156
