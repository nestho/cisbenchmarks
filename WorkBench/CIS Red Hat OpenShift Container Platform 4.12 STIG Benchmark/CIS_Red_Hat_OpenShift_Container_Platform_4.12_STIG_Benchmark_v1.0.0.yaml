  checks:
  - type: manual_review
    info: 'Verify OpenShift is configured to generate audit records when successful/unsuccessful

      attempts to modify privileges occur by executing the following:

      for node in

      $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

      n "$HOSTNAME "; grep -e "key=unsuccessful-create" -e "key=unsuccessfulmodification" -e "key=delete" -e "key=unsuccessful-access"
      -e "actions" -e

      "key=perm_mod" -e "audit_rules_usergroup_modification" -e "module-change" -

      e "logins" /etc/audit/audit.rules'' 2>/d'
    severity: medium
- id: '1.72'
  title: CNTR-OS-000940
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must generate audit records when successful/unsuccessful attempts to modify security objects occur.
    GROUP ID: V-257576 RULE ID: SV-257576r961803'
  rationale: 'OpenShift and its components must generate audit records when modifying security objects. All the components
    must use the same standard so that the events can be tied together to understand what took place within the overall container
    platform. This must establish, correlate, and help assist with investigating the events relating to an incident, or identify
    those responsible. Without audit record generation, unauthorized users can modify security objects unknowingly for malicious
    intent creating vulnerabilities within the container platform. Satisfies: SRG-APP-000496-CTR-001240, SRG-APP-000497-CTR-001245,
    SRG-APP000498-CTR-001250'
  impact: ''
  references: []
  page_start: 215
  audit_raw: 'Verify the Red Hat Enterprise Linux CoreOS (RHCOS) is configured to generate audit

    records when successful/unsuccessful attempts to modify security categories or objects

    occur by executing the following:

    for node in

    $(oc get node -oname); do oc debug $node -- chroot /host /bin/bash -c ''echo -

    n "$HOSTNAME "; grep -e "key=privileged" -e "key=perm_mod"

    /etc/audit/audit.rules'' 2>/dev/null; done

    Confirm the following rules exist on each node:

    -a always,exit -F arch=b64 -S fremovexattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b32 -S fsetxattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b64 -S fsetxattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b32 -S lremovexattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b64 -S lremovexattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b32 -S lsetxattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b64 -S lsetxattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b32 -S removexattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F arch=b64 -S removexattr -F auid>=1000 -F auid!=unset -F

    key=perm_mod

    -a always,exit -F path=/usr/bin/chcon -F auid>=1000 -F auid!=unset -F

    key=privileged

    -a always,exit -F path=/usr/sbin/restorecon -F auid>=1000 -F auid!=unset -F

    key=privileged

    -a always,exit -F path=/usr/sbin/semanage -F auid>=1000 -F auid!=unset -F

    key=privileged

    -a always,exit -F path=/usr/sbin/setfiles -F auid>=1000 -F auid!=unset -F

    key=privileged

    -a always,exit -F path=/usr/sbin/setsebool -F auid>=1000 -F auid!=unset -F

    key=privileged

    If the above rules are not listed on each node, this is a finding.'
  remediation: "Apply the machine config to configure modification audit records by executing the\nfollowing:\nfor mcpool\
    \ in\n$(oc get mcp -oname | sed \"s:.*/::\" ); do\necho \"apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\n\
