- id: '1.67'
  title: CNTR-OS-000890
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift must contain the latest images with most recent updates and execute within the container platform
    runtime as authorized by IAVM, CTOs, DTMs, and STIGs. GROUP ID: V-257571 RULE ID: SV-257571r961683'
  rationale: It is critical to the security and stability of the container platform and the software services running on the
    platform to ensure that images are deployed through a trusted software supply chain. The OpenShift platform can be configured
    to limit and control which image source repositories may be used by the platform and the users of the platform. By configuring
    this to only allow users to deploy images from trusted sources, lowers the risk for a user to deploy unsafe or untested
    images that would be detrimental to the security and stability of the platform. In order to help users manage images,
    OpenShift uses image streams to provide a level of obstruction for the users. In this way the users can trigger automatic
    redeployments as images are updated. It is also possible to configure the image stream to periodically check the image
    source repository for any updates and automatically pull in the latest updates.
  impact: ''
  references: []
  page_start: 189
  audit_raw: 'Verify the image source policy is configured by executing the following:

    oc get image.config.openshift.io/cluster -o

    jsonpath=''{.spec.registrySources}{"\nAllowedRegistriesForImport:

    "{.spec.allowedRegistriesForImport}{"\n"}''

    If nothing is returned, this is a finding.

    If the registries listed under allowedRegistries, insecureRegistries, or

    AllowedRegistriesForImport are not from trusted sources as defined by the organization,

    this is a finding.'
  remediation: "Edit the cluster image config resource to define the allowed registries by executing the\nfollowing:\noc edit\
    \ image.config.openshift.io/cluster\nThe following is an example configuration. For a detailed explanation of the\nconfiguration\
    \ properties, refer to https://docs.openshift.com/containerplatform/4.8/openshift_images/image-configuration.html.\napiVersion:\
    \ config.openshift.io/v1\nkind: Image\nmetadata:\n annotations:\n release.openshift.io/create-only: \"true\"\n creationTimestamp:\
    \ \"2019-05-17T13:44:26Z\"\n generation: 1\n name: cluster\n resourceVersion: \"8302\"\n selfLink: /apis/config.openshift.io/v1/images/cluster\n\
    \ uid: e34555da-78a9-11e9-b92b-06d6c7da38dc\nspec:\n allowedRegistriesForImport:\n - domainName: quay.io\n insecure: false\n\
    \ additionalTrustedCA:\n name: myconfigmap\n registrySources:\n allowedRegistries:\n - example.com\n - quay.io\n - registry.redhat.io\n\
    \ - image-registry.openshift-image-registry.svc:5000\n - reg1.io/myrepo/myapp:latest\n insecureRegistries:\n - insecure.com\n\
    status:\n internalRegistryHostname: image-registry.openshift-image-registry.svc:5000"
  checks:
  - type: manual_review
    info: 'Verify the image source policy is configured by executing the following:

      oc get image.config.openshift.io/cluster -o

      jsonpath=''{.spec.registrySources}{"\nAllowedRegistriesForImport:

      "{.spec.allowedRegistriesForImport}{"\n"}''

      If nothing is returned, this is a finding.

      If the registries listed under allowedRegistries, insecureRegistries, or

      AllowedRegistriesForImport are not from trusted sources as defined by the organization,

      this is a finding.'
    severity: medium
- id: '1.68'
  title: CNTR-OS-000900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OpenShift runtime must have updates installed within the period directed by an authoritative source (e.g.,
    IAVM, CTOs, DTMs, and STIGs). GROUP ID: V-257572 RULE ID: SV-257572r961683'
  rationale: 'OpenShift runtime must be carefully monitored for vulnerabilities, and when problems are detected, they must
    be remediated quickly. A vulnerable runtime exposes all containers it supports, as well as the host itself, to potentially
    significant risk. Organizations must use tools to look for Common Vulnerabilities and Exposures (CVEs) in the runtimes
    deployed, to upgrade any instances at risk, and to ensure that orchestrators only allow deployments to properly maintained
    runtimes. Satisfies: SRG-APP-000456-CTR-001130, SRG-APP-000456-CTR-001125'
  impact: ''
  references: []
  page_start: 191
  audit_raw: "To list all the imagestreams and identify which imagestream tags are configured to\nperiodically check for updates\
    \ (imagePolicy = { scheduled: true }), execute the following:\noc get imagestream --all-namespaces -o jsonpath='{range\n\
    .items[*]}{.metadata.name}{\"\\n\"}{range .spec.tags[*]}{\"\\t\"}{.name}{\":\n\"}{.importPolicy}{\"\\n\"}'\nThe output\
    \ will be similar to:\nhttpd\n 2.4: {}\n 2.4-el7: {}\n 2.4-el8: {}\n latest: {}\n :\ninstaller\n latest: {\"scheduled\"\
    :true}\n :\ninstaller-artifacts\n latest: {\"scheduled\":true}\n :\nReview the listing, and for each imagestream tag version\
    \ that does not have the value\n'{\"scheduled\":true}' that should otherwise check for updates, this is a finding."
  remediation: 'For container images that are not scheduled to check for updates that otherwise should,

    update the imagestream to schedule updates for each tag by executing the following:

    oc patch imagestream <NAME> -n NAMESPACE --type merge -p

    ''{"spec":{"tags":[{"name":"<TAG_NAME>","importPolicy":{"scheduled":true}}]}}''

    where, NAME: The imagestream name to update NAMESPACE: The namespace the

    imagestream is in. This will most often be ''openshift''. TAG_NAME: The imagestream

    tag to update'
