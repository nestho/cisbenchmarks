- id: 3.2.1.16
  title: (L1) Ensure 'Allow USB accessories while the device is locked' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Institutionally Owned Devices
  description: This recommendation pertains to allowing USB devices to communicate with a locked device.
  rationale: Physical attacks against iOS and iPadOS devices have been developed that exploit the trust of physically connected
    accessories. This has lead to proof of concept data extraction and even commercially available hardware to perform the
    attacks. By requiring the device to be unlocked to remove data, this control reduces the probability of a successful data
    extraction.
  impact: An end-user will not be able to connect their device to a USB accessory while the device is locked.
