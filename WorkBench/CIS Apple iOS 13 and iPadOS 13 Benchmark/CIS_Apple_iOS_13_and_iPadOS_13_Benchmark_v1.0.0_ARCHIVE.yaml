- id: 2.2.1.6
  title: (L1) Ensure 'Allow documents from managed sources in unmanaged destinations' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to Apple's managed app implementation. The terms "managed" and "unmanaged" refer
    to app classifications made through Managed Open In, a feature introduced in iOS 7. Managed Open In provides for data
    containerization. Institutionally provisioned apps are designated managed. Apps elected by the end user are designated
    unmanaged.
  rationale: Limiting data transfer from the managed institutional app space to the unmanaged user space may prevent data
    leakage.
  impact: ''
