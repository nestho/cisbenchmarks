- id: 2.2.1.12
  title: (L1) Ensure 'Show Notification Center in Lock screen' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the display of Notification Center on the lock screen.
  rationale: Communications between the operating system and apps to a user should be controlled to prevent data leakage or
