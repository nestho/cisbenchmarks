- id: 3.2.2.2
  title: (L1) Ensure 'Accept cookies' is set to 'From websites I visit' or `From current website only`
  scoring: scored
  profile:
  - Level 1 - Institutionally Owned Devices
  description: This recommendation pertains to the acceptance of third-party cookies. This recommendation pertains to whether
    Safari, and MDM deployed browsers, will consider certain URL patterns as for managed app spaces only.
  rationale: The HEIST cookie exploit allows for retrieving data from cookies stored on a device. Cookies often follow poor
    coding practices and often include authentication properties. Limiting acceptance of cookies to only those from sites
    intentionally visited reduces the likelihood of exploit. Sensitive files available from a website may be downloaded into
    the unmanaged app spaces by default. By configuring the specific domains that Safari should consider managed, an institution
    may support the secure containerization of their data.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Apps, the menu for Accept

    cookies is set to From websites I visit or From current website only.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Cookie policy enforced is displayed.

