- id: 2.2.2.2
  title: (L1) Ensure 'Accept cookies' is set to 'From websites I visit' or `From current website only`
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the automatic acceptance of third-party cookies. This recommendation pertains
    to whether Safari, and MDM deployed browsers, will consider certain URL patterns as for managed app spaces only.
  rationale: Accepting cookies may allow the web servers to interact with other cookies already in place. For instance, the
    HEIST cookie exploit allows for retrieving data from cookies stored on a device. Cookies often follow poor coding practices
    and include authentication properties. Limiting acceptance of cookies to only those from sites intentionally visited reduces
    the likelihood of exploit. Sensitive files available from a website may be downloaded into the unmanaged app spaces by
    default. By configuring the specific domains that Safari should consider managed, an institution may support the secure
    containerization of their data.
