controls:
- id: '2.1'
  title: General 2.1.1 (L1) Ensure a 'Consent Message' has been 'Configured'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the configuration of a consent message shown at the time of a configuration
    profile installation.
  rationale: In this section of the benchmark, recommendations are for devices that are owned by the end-user. They are voluntarily
    accepting the configuration profile and should be provided an explicit opportunity to consent.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the General tab.

    4. In the right windowpane, verify that under the heading Consent Message, there is

    an appropriate consent message configured.

    From the device, there is no method to determine if the installed configuration profile

    included a consent message.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the General tab.

    4. In the right windowpane, under the heading Consent Message, insert an

    appropriate consent message.

    5. Deploy the Configuration Profile.

    15 | P a g e'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left windowpane, click on the General tab.

      4. In the right windowpane, verify that under the heading Consent Message, there is

      an appropriate consent message configured.

      From the device, there is no method to determine if the installed configuration profile

      included a consent message.'
    severity: medium
- id: 2.1.2
  title: (L1) Ensure 'Controls when the profile can be removed' is set to 'Always'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the removal of a given configuration profile.
  rationale: In this section of the benchmark, recommendations are for devices that are owned by the end-user. They are voluntarily
    accepting the configuration profile and should be able to remove it at will.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the General tab.

    4. In the right windowpane, verify that under the heading Security, the menu

    Controls when the profile can be removed is set to Always.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <Profile Name>.

    5. Verify Remove Profile is displayed near the bottom of the screen.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the General tab.

    4. In the right windowpane, under the heading Security, set the menu Controls when

    the profile can be removed to Always.

    5. Deploy the Configuration Profile.

    17 | P a g e'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left windowpane, click on the General tab.

      4. In the right windowpane, verify that under the heading Security, the menu

      Controls when the profile can be removed is set to Always.

      Or, from the device:

      1. Tap Settings.

      2. Tap General.

      3. Tap Profile.

      4. Tap <Profile Name>.

      5. Verify Remove Profile is displayed near the bottom of the screen.'
    severity: medium
- id: 2.2.1.1
  title: (L1) Ensure 'Allow voice dialing while device is locked' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to initiating phone calls while a device is locked. Voice dialing is handled separate
    from Siri.
  rationale: Allowing calls from a locked device may allow for the impersonation of the device owner.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, the checkbox for

    Allow voice dialing while device is locked is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Voice dialing while locked not allowed is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, uncheck the checkbox for

