  audit_raw: 'By default, users are not assigned any Kubernetes RBAC roles (or clusterroles) by default.

    So before attempting to create a new role (or clusterrole), you must be assigned an

    137 | P a g e

    appropriately privileged role (or clusterrole). A number of such roles and clusterroles are

    always created by default, including the cluster-admin clusterrole (for a full list, see Default

    Roles and Role Bindings in the Kubernetes documentation). The cluster-admin clusterrole

    essentially confers super-user privileges. A user granted the cluster-admin clusterrole can

    perform any operation across all namespaces in a given cluster.'
  remediation: 'Example: Granting the Kubernetes RBAC cluster-admin clusterrole

    Follow these steps to grant a user who is not a tenancy administrator the Kubernetes RBAC

    cluster-admin clusterrole on a cluster deployed on Oracle Cloud Infrastructure:

    1. If you haven''t already done so, follow the steps to set up the cluster''s kubeconfig

    configuration file and (if necessary) set the KUBECONFIG environment variable to

    point to the file. Note that you must set up your own kubeconfig file. You cannot

    access a cluster using a kubeconfig file that a different user set up. See Setting Up

    Cluster Access.

    2. In a terminal window, grant the Kubernetes RBAC cluster-admin clusterrole to the

    user by entering:

    $ kubectl create clusterrolebinding <my-cluster-admin-binding> --

    clusterrole=cluster-admin --user=<user_OCID>

    where:

    • is a string of your choice to be used as the name for the binding between the user

    and the Kubernetes RBAC cluster-admin clusterrole. For example, jdoe_clst_adm

    • <user_OCID> is the user''s OCID (obtained from the Console ). For example,

    ocid1.user.oc1..aaaaa...zutq (abbreviated for readability).

    For example:

    $ kubectl create clusterrolebinding jdoe_clst_adm --clusterrole=cluster-admin

    --user=ocid1.user.oc1..aaaaa...zutq'
