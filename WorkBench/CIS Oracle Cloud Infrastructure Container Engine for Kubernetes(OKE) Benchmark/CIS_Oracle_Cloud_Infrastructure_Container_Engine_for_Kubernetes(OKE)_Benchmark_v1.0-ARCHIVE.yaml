- id: 5.1.2
  title: Minimize user access control to Container Engine for Kubernetes
  scoring: manual
  profile:
  - Level 1
  description: Restrict user access to OKE, limiting interaction with build images to only authorized personnel and service
    accounts.
  rationale: Weak access control to OKE may allow malicious users to replace built images with vulnerable or backdoored containers.
  impact: Care should be taken not to remove access to Oracle Cloud Infrastructure Registry (OCR) for accounts that require
    this for their operation. Any account granted the Storage Object Viewer role at the project level can view all objects
    stored in OCS for the project.
  references: []
  page_start: 119
  audit_raw: 'For most operations on Kubernetes clusters created and managed by Container Engine for

    Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM) provides

    access control. A user''s permissions to access clusters comes from the groups to which they

    belong. The permissions for a group are defined by policies. Policies define what actions

    members of a group can perform, and in which compartments. Users can then access

    clusters and perform operations based on the policies set for the groups they are members

    of.

    IAM provides control over:

    • whether a user can create or delete clusters

    • whether a user can add, remove, or modify node pools

    • which Kubernetes object create/delete/view operations a user can perform on all

    clusters within a compartment or tenancy

    See Policy Configuration for Cluster Creation and Deployment.

    In addition to IAM, the Kubernetes RBAC Authorizer can enforce additional fine-grained

    access control for users on specific clusters via Kubernetes RBAC roles and clusterroles. A

    Kubernetes RBAC role is a collection of permissions. For example, a role might include read

    119 | P a g e

    permission on pods and list permission for pods. A Kubernetes RBAC clusterrole is just like

    a role, but can be used anywhere in the cluster. A Kubernetes RBAC rolebinding maps a role

    to a user or set of users, granting that role''s permissions to those users for resources in that

    namespace. Similarly, a Kubernetes RBAC clusterrolebinding maps a clusterrole to a user

    or set of users, granting that clusterrole''s permissions to those users across the entire

    cluster.'
  remediation: 'By default, users are not assigned any Kubernetes RBAC roles (or clusterroles) by default.

    So before attempting to create a new role (or clusterrole), you must be assigned an

    appropriately privileged role (or clusterrole). A number of such roles and clusterroles are

    always created by default, including the cluster-admin clusterrole (for a full list, see Default

    Roles and Role Bindings in the Kubernetes documentation). The cluster-admin clusterrole

    essentially confers super-user privileges. A user granted the cluster-admin clusterrole can

    perform any operation across all namespaces in a given cluster.

    Note that Oracle Cloud Infrastructure tenancy administrators already have sufficient

    privileges, and do not require the cluster-admin clusterrole.

    See: Granting the Kubernetes RBAC cluster-admin clusterrole'
  checks:
  - type: manual_review
    info: 'For most operations on Kubernetes clusters created and managed by Container Engine for

      Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM) provides

