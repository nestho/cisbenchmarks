controls:
- id: 2.1.1
  title: Client certificate authentication should not be used for users
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes provides the option to use client certificates for user authentication. However as there is no way
    to revoke these certificates when a user leaves an organization or loses their credential, they are not suitable for this
    purpose. It is not possible to fully disable client certificate use within a cluster as it is used for component to component
    authentication.
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. Kubernetes client certificate authentication does not allow for this due to a lack of support for certificate
    revocation.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 13
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of Kubernetes

    client certificate authentication.

    You can verify the availability of client certificates in your OKE cluster.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of client certificates.

    You can remediate the availability of client certificates in your OKE cluster.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of Kubernetes

      client certificate authentication.

      You can verify the availability of client certificates in your OKE cluster.'
    severity: medium
- id: 2.1.2
  title: Ensure OKE service level admins are created to manage OKE
  scoring: manual
  profile:
  - Level 1
  description: 'OKE integrates with Oracle Cloud Infrastructure IAM for authentication and authorization, for all interfaces
    (the Console, SDK or CLI, and REST API). To create, update, and delete clusters and node pools, users must be in groups
    and those group must have the necessary access. Certain cluster operations created by Container Engine for Kubernetes
    may require additional permissions granted via a Kubernetes RBAC role or cluster role. One example is the installing the
    metrics server which requires additional K8s permissions. The following required policy statements to enable users to
    use Container Engine for Kubernetes to create, update, and delete clusters and node pools: Allow group <group-name> to
    manage instance-family in <compartment-name> Allow group <group-name> to use subnets in <compartment-name> Allow group
    <group-name> to read virtual-network-family in <compartmentname> Allow group <group-name> to use vnics in <compartment-name>
    Allow group <group-name> to inspect compartments in <compartment-name> Allow group <group-name> to manage cluster-family
    in <compartment-name>'
  rationale: Creating OKE level administrators helps in tightly controlling access to Oracle Cloud Infrastructure (OCI) services
    to implement the least-privileged security principle.
  impact: ''
  references: []
  page_start: 15
  audit_raw: "1. In the Console, open the navigation menu. Under Governance and Administration, go\nto Identity and click\
    \ Groups. A list of the groups in the compartment you're viewing\nis displayed.\n2. Select the tenancy's root compartment\
    \ or an individual compartment containing\ncluster-related resources from the list on the left.\n3. Open the policy associated\
    \ OKE Administrators\n4. Ensure it contains the below statements:\n15 | P a g e\n Allow group <group-name> to manage instance-family\
    \ in <compartment-name>\n Allow group <group-name> to use subnets in <compartment-name>\n Allow group <group-name> to\
    \ read virtual-network-family in <compartmentname>\n Allow group <group-name> to use vnics in <compartment-name>\n Allow\
    \ group <group-name> to inspect compartments in <compartment-name>\n Allow group <group-name> to manage cluster-family\
    \ in <compartment-name>"
  remediation: "1. In the Console, open the navigation menu. Go to Identity and click Groups.\n2. Click Create Group\n3. Enter\
    \ the following:\n• Name: A name for the group (for example, acme-dev-team-oke-group) that is unique\nwithin the tenancy.\n\
    • Description: A friendly description. You can change this later if you want to. Avoid\nentering confidential information.\n\
    4. Open the navigation menu. Go to Identity and click Policies. A list of the policies in\nthe compartment you're viewing\
    \ is displayed.\n5. Select the tenancy's root compartment or an individual compartment containing\ncluster-related resources\
    \ from the list on the left.\n6. Click Create Policy.\n7. Enter the following:\n• Name: A name for the policy (for example,\
    \ acme-dev-team-oke-required-policy) that\nis unique within the compartment. If you are creating the policy in the tenancy's\n\
    root compartment, the name must be unique across all policies in your tenancy. You\ncannot change this later. Avoid entering\
    \ confidential information.\n• Description: A friendly description. You can change this later if you want to. Avoid\n\
    entering confidential information.\n• Statement: The following required policy statements to enable users to use\nContainer\
    \ Engine for Kubernetes to create, update, and delete clusters and node\npools:\n Allow group <group-name> to manage instance-family\
    \ in <compartment-name>\n Allow group <group-name> to use subnets in <compartment-name>\n Allow group <group-name> to\
    \ read virtual-network-family in <compartmentname>\n Allow group <group-name> to use vnics in <compartment-name>\n Allow\
    \ group <group-name> to inspect compartments in <compartment-name>\n Allow group <group-name> to manage cluster-family\
    \ in <compartment-name>\n16 | P a g e\n8. Click Create\n17 | P a g e\n2.2 Authentication and Authorization"
  checks:
  - type: manual_review
    info: "1. In the Console, open the navigation menu. Under Governance and Administration, go\nto Identity and click Groups.\
      \ A list of the groups in the compartment you're viewing\nis displayed.\n2. Select the tenancy's root compartment or\
      \ an individual compartment containing\ncluster-related resources from the list on the left.\n3. Open the policy associated\
      \ OKE Administrators\n4. Ensure it contains the below statements:\n15 | P a g e\n Allow group <group-name> to manage\
      \ instance-family in <compartment-name>\n A"
    severity: medium
