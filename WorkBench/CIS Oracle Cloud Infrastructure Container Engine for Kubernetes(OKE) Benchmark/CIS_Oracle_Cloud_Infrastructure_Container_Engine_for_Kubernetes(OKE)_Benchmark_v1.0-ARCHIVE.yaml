    info: This control cannot be audited in OKE.
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: If kubelet is running, and if it is using a file-based kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 27
  audit_raw: 'SSH to the worker nodes

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /etc/kubernetes/kubelet.conf and --bootstrap-kubeconfig

    27 | P a g e

    /etc/kubernetes/bootstrap-kubelet.conf which is the location of the kubeconfig files.

    Run this command to obtain the kubeconfig file permissions:

    stat -c %a /etc/kubernetes/kubelet.conf

    stat -c %a /etc/kubernetes/bootstrap-kubelet.conf

    The output of the above command gives you the kubeconfig file''s permissions.

    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet.conf && stat -c %a /etc/kubernetes/bootstrap-kubelet.conf
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /etc/kubernetes/kubelet.conf and --bootstrap-kubeconfig'
- id: 3.1.2
  title: Ensure that the proxy kubeconfig file ownership is set to root:root
  scoring: manual
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kubelet controls various parameters for the kubelet service in the worker node. You should
    set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 29
  audit_raw: 'SSH to the worker nodes

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /etc/kubernetes/kubelet.conf and --bootstrap-kubeconfig

    /etc/kubernetes/bootstrap-kubelet.conf which is the location of the kubeconfig files.

    Run this command to obtain the kubeconfig file ownership:

    stat -c %U:%G etc/kubernetes/kubelet.conf

    stat -c %U:%G etc/kubernetes/bootstrap-kubelet.conf

    The output of the above command gives you the kubeconfig file''s ownership. Verify that the

    ownership is set to root:root.

    29 | P a g e'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chown root:root <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %U:%G etc/kubernetes/kubelet.conf && stat -c %U:%G etc/kubernetes/bootstrap-kubelet.conf
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /etc/kubernetes/kubelet.conf and --bootstrap-kubeconfig'
- id: 3.1.3
  title: Ensure that the kubelet configuration file has permissions set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file is specified you should restrict its file permissions to maintain the integrity of the file. The
    file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 31
  audit_raw: 'First, SSH to the relevant worker node:

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /etc/kubernetes/kubelet.conf and --bootstrap-kubeconfig

    /etc/kubernetes/bootstrap-kubelet.conf which is the location of the kubeconfig files.

    Run this command to obtain the kubeconfig file ownership:

    stat -c %a etc/kubernetes/kubelet.conf

    stat -c %a etc/kubernetes/bootstrap-kubelet.conf

    31 | P a g e

    The output of the above command is the Kubelet config file''s permissions. Verify that the

    permissions are 644 or more restrictive.'
  remediation: 'Run the following command (using the config file location identied in the Audit step)

    chmod 644 /var/lib/kubelet/config.yaml'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a etc/kubernetes/kubelet.conf && stat -c %a etc/kubernetes/bootstrap-kubelet.conf
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'First, SSH to the relevant worker node:

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /etc/kubernetes/kubelet.conf and --boot'
