    \ # Assume that persistentVolumes set up by the cluster admin are safe to\nuse.\n - 'persistentVolumeClaim'\n hostNetwork:\
    \ false\n hostIPC: false\n hostPID: false\n runAsUser:\n # Require the container to run without root privileges.\n rule:\
