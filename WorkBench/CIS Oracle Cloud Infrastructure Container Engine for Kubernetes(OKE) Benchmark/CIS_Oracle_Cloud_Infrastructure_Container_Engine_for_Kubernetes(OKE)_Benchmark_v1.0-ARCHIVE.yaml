- id: 3.2.7
  title: Ensure that the --make-iptables-util-chains argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Allow Kubelet to manage iptables.
  rationale: Kubelets can automatically manage the required changes to iptables based on how you choose your networking options
    for the pods. It is recommended to let kubelets manage the changes to iptables. This ensures that the iptables configuration
    remains in sync with pods networking configuration. Manually configuring iptables with dynamic pod network configuration
    changes might hamper the communication between pods/containers and to the outside world. You might have iptables rules
    too restrictive or too open.
  impact: Kubelet would manage the iptables on the system and keep it in sync. If you are using any other iptables management
    solution, then there might be some conflicts.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
