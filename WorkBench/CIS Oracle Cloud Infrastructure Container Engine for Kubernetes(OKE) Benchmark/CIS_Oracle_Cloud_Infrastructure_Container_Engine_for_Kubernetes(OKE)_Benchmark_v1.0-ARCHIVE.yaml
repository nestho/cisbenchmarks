- id: 5.3.1
  title: Encrypting Kubernetes Secrets at Rest in Etcd
  scoring: manual
  profile:
  - Level 1
  description: Encrypt Kubernetes secrets, stored in etcd, at the application-layer using a customermanaged key.
  rationale: The master nodes in a Kubernetes cluster store sensitive configuration data (such as authentication tokens, passwords,
    and SSH keys) as Kubernetes secret objects in etcd. Etcd is an open source distributed key-value store that Kubernetes
    uses for cluster coordination and state management. In the Kubernetes clusters created by Container Engine for Kubernetes,
    etcd writes and reads data to and from block storage volumes in the Oracle Cloud Infrastructure Block Volume service.
    Although the data in block storage volumes is encrypted, Kubernetes secrets at rest in etcd itself are not encrypted by
    default.
  impact: ''
  references:
  - 1. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Tasks/contengencryptingdata.htm
  page_start: 126
  audit_raw: 'Before you can create a cluster where Kubernetes secrets are encrypted in the etcd keyvalue store, you have
    to:

    • know the name and OCID of a suitable master encryption key in Vault

    • create a dynamic group that includes all clusters in the compartment in which you

    are going to create the new cluster

    • create a policy authorizing the dynamic group to use the master encryption key'
  remediation: 'You can create a cluster in one tenancy that uses a master encryption key in a different

    tenancy. In this case, you have to write cross-tenancy policies to enable the cluster in its

    tenancy to access the master encryption key in the Vault service''s tenancy. Note that if you

    want to create a cluster and specify a master encryption key that''s in a different tenancy,

    you cannot use the Console to create the cluster.

    For example, assume the cluster is in the ClusterTenancy, and the master encryption key is

    126 | P a g e

    in the KeyTenancy. Users belonging to a group (OKEAdminGroup) in the ClusterTenancy

    have permissions to create clusters. A dynamic group (OKEAdminDynGroup) has been

    created in the cluster, with the rule ALL {resource.type = ''cluster'',

    resource.compartment.id = ''ocid1.compartment.oc1..<unique_ID>''}, so all clusters

    created in the ClusterTenancy belong to the dynamic group.

    In the root compartment of the KeyTenancy, the following policies:

    • use the ClusterTenancy''s OCID to map ClusterTenancy to the alias OKE_Tenancy

    • use the OCIDs of OKEAdminGroup and OKEAdminDynGroup to map them to the

    aliases RemoteOKEAdminGroup and RemoteOKEClusterDynGroup respectively

    • give RemoteOKEAdminGroup and RemoteOKEClusterDynGroup the ability to list,

    view, and perform cryptographic operations with a particular master key in the

    KeyTenancy

    Define tenancy OKE_Tenancy as ocid1.tenancy.oc1..<unique_ID>

    Define dynamic-group RemoteOKEClusterDynGroup as

    ocid1.dynamicgroup.oc1..<unique_ID>

    Define group RemoteOKEAdminGroup as ocid1.group.oc1..<unique_ID>

    Admit dynamic-group RemoteOKEClusterDynGroup of tenancy ClusterTenancy to use

    keys in tenancy where target.key.id = ''ocid1.key.oc1..<unique_ID>''

    Admit group RemoteOKEAdminGroup of tenancy ClusterTenancy to use keys in

    tenancy where target.key.id = ''ocid1.key.oc1..<unique_ID>''

    In the root compartment of the ClusterTenancy, the following policies:

    • use the KeyTenancy''s OCID to map KeyTenancy to the alias KMS_Tenancy

    • give OKEAdminGroup and OKEAdminDynGroup the ability to use master keys in the

    KeyTenancy

    • allow OKEAdminDynGroup to use a specific master key obtained from the

    KeyTenancy in the ClusterTenancy

    Define tenancy KMS_Tenancy as ocid1.tenancy.oc1..<unique_ID>

    Endorse group OKEAdminGroup to use keys in tenancy KMS_Tenancy

    Endorse dynamic-group OKEAdminDynGroup to use keys in tenancy KMS_Tenancy

    Allow dynamic-group OKEAdminDynGroup to use keys in tenancy where

    target.key.id = ''ocid1.key.oc1..<unique_ID>''

    See Accessing Object Storage Resources Across Tenancies for more examples of writing

    cross-tenancy policies.

    Having entered the policies, you can now run a command similar to the following to create

    a cluster in the ClusterTenancy that uses the master key obtained from the KeyTenancy:

    oci ce cluster create --name oke-with-cross-kms --kubernetes-version v1.16.8

    --vcn-id ocid1.vcn.oc1.iad.<unique_ID> --service-lb-subnet-ids

    ''["ocid1.subnet.oc1.iad.<unique_ID>"]'' --compartment-id

    ocid1.compartment.oc1..<unique_ID> --kms-key-id ocid1.key.oc1.iad.<unique_ID>

    127 | P a g e'
  checks:
  - type: manual_review
    info: 'Before you can create a cluster where Kubernetes secrets are encrypted in the etcd keyvalue store, you have to:

      • know the name and OCID of a suitable master encryption key in Vault

      • create a dynamic group that includes all clusters in the compartment in which you

      are going to create the new cluster

      • create a policy authorizing the dynamic group to use the master encryption key'
    severity: medium
- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: manual
  profile:
  - Level 1
  description: Enable Master Authorized Networks to restrict access to the cluster's control plane (master endpoint) to only
    an allowlist (whitelist) of authorized IPs.
  rationale: 'Authorized networks are a way of specifying a restricted range of IP addresses that are permitted to access
    your cluster''s control plane. Kubernetes Engine uses both Transport Layer Security (TLS) and authentication to provide
    secure access to your cluster''s control plane from the public internet. This provides you the flexibility to administer
    your cluster from anywhere; however, you might want to further restrict access to a set of IP addresses that you control.
    You can set this restriction by specifying an authorized network. Restricting access to an authorized network can provide
    additional security benefits for your container cluster, including: • Better protection from outsider attacks: Authorized
    networks provide an additional layer of security by limiting external, non-OCP access to a specific set of addresses you
    designate, such as those that originate from your premises. This helps protect access to your cluster in the case of a
    vulnerability in the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized
    networks help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked
    certificates used from outside OCP and outside the authorized IP ranges (for example, from addresses outside your company)
    are still denied access.'
  impact: When implementing Master Authorized Networks, be careful to ensure all desired networks are on the allowlist (whitelist)
    to prevent inadvertently blocking external access to your cluster's control plane.
  references: []
  page_start: 129
  audit_raw: 129 | P a g e
  remediation: ''
  checks:
  - type: manual_review
    info: 129 | P a g e
    severity: medium
- id: 5.4.2
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: manual
  profile:
  - Level 1
  description: Disable access to the Kubernetes API from outside the node network if it is not required.
  rationale: In a private cluster, the master node has two endpoints, a private and public endpoint. The private endpoint
    is the internal IP address of the master, behind an internal load balancer in the master's VPC network. Nodes communicate
    with the master using the private endpoint. The public endpoint enables the Kubernetes API to be accessed from outside
    the master's VPC network. Although Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability
    could potentially expose the Kubernetes publically with unrestricted access. Additionally, an attacker may be able to
    identify the current cluster and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required,
    disabling public endpoint will help prevent such threats, and require the attacker to be on the master's VPC network to
    perform any attack on the Kubernetes API.
  impact: 'This topic gives an overview of the options for enabling private access to services within Oracle Cloud Infrastructure.
    Private access means that traffic does not go over the internet. Access can be from hosts within your virtual cloud network
    (VCN) or your on-premises network. • You can enable private access to certain services within Oracle Cloud Infrastructure
    from your VCN or on-premises network by using either a private endpoint or a service gateway. See the sections that follow.
    • For each private access option, these services or resource types are available: o With a private endpoint: Autonomous
    Database (shared Exadata infrastructure) o With a service gateway: Available services • With either private access option,
    the traffic stays within the Oracle Cloud Infrastructure network and does not traverse the internet. However, if you use
    a service gateway, requests to the service use a public endpoint for the service. 131 | P a g e • If you do not want to
    access a given Oracle service through a public endpoint, Oracle recommends using a private endpoint in your VCN (assuming
    the service supports private endpoints). A private endpoint is represented as a private IP address within a subnet in
    your VCN. See About Private Endpoints'
  references: []
  page_start: 131
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: manual
  profile:
  - Level 1
  description: Disable public IP addresses for cluster nodes, so that they only have private IP addresses. Private Nodes are
    nodes with no public IP addresses.
  rationale: Disabling public IP addresses on cluster nodes restricts access to only internal networks, forcing attackers
    to obtain local network access before attempting to compromise the underlying Kubernetes hosts.
  impact: To enable Private Nodes, the cluster has to also be configured with a private master IP range and IP Aliasing enabled.
    Private Nodes do not have outbound access to the public internet. If you want to provide outbound Internet access for
    your private nodes, you can use Cloud NAT or you can manage your own NAT gateway.
