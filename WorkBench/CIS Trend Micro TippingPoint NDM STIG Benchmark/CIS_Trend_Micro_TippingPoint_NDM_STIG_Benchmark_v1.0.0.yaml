- id: '1.13'
  title: TIPP-NM-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The TippingPoint TPS must have FIPS Mode enforced. GROUP ID: V-242243 RULE ID: SV-242243r754439'
  rationale: Unapproved mechanisms that are used for authentication to the cryptographic module are not validated and therefore
    cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised. Network devices utilizing
    encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the
    current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets
    DoD requirements. However, authentication algorithms must configure security processes to use only FIPS-approved and NIST-recommended
    authentication algorithms.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'In the SMS client, verify the TPS FIPS Mode is enabled.

    1. For TPS, click Devices, All Devices, and the subject device hostname.

    2. Click FIPS Settings and ensure the FIPS Mode is selected.

    If the TPS is not in FIPS mode, this is a finding.'
  remediation: 'In the SMS client, enable the TPS FIPS Mode.

    1. For TPS, click Devices, All Devices, and the subject device hostname.

    2. Click FIPS Settings, then check enabled. This must be done in the approved

    change window, as the TPS will reboot.'
  checks:
  - type: manual_review
    info: 'In the SMS client, verify the TPS FIPS Mode is enabled.

      1. For TPS, click Devices, All Devices, and the subject device hostname.

      2. Click FIPS Settings and ensure the FIPS Mode is selected.

      If the TPS is not in FIPS mode, this is a finding.'
    severity: medium
- id: '1.14'
  title: TIPP-NM-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The TippingPoint SMS must terminate all network connections associated with a device management session at
    the end of the session, or the session must be terminated after 10 minutes of inactivity except to fulfill documented
    and validated mission requirements. GROUP ID: V-242244 RULE ID: SV-242244r754440'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'In the SMS client, ensure the SMS inactivity timeouts are configured.

