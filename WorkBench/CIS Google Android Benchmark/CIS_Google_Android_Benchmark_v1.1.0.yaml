  title: Ensure 'Device Information' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'Disable storing device information to your account. Note: This setting is applicable only for Google Pixel
    range of devices.'
  rationale: Turning on Device Information setting saves various device related information to your account to give you personalized
    results, suggestions, and experiences. The information saved might include contact lists, calendars, alarms, apps, and
    music. Additionally, information such as whether the screen is on, the battery level, the quality of your Wi-Fi or Bluetooth
    connection, touchscreen and sensor readings, and crash reports are also saved and shared with Google. This could be privacy-invasive
