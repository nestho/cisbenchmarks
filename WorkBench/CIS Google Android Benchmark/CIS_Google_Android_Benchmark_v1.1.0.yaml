- id: '1.17'
  title: Ensure 'Allow remote lock and erase' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Enable remotely locking and erasing the device. Scan device for security threats. Improve detection of harmful
    apps.
  rationale: Allow remote lock and erase setting helps you to remotely lock your device or erase your data through Find My
    Device. This helps you to safeguard your privacy and protect your data from unsanctioned access. Scan device for security
    threats setting lets Google regularly check your device and prevent or warn about potential harm. This should be always
    enabled. Enabling Improve harmful app detection setting sends anonymous information to Google about apps that were not
    installed from Google Play. This is especially true if you choose to install apps from "Unknown sources" outside of the
    Google Play Store. This information helps Google better protect everyone from harmful apps.
  impact: This setting requires you to keep location services enabled all the time. This might be a privacy issue for you.
    None 45 | P a g e User data needs to be sent to Google that may incur data charges based on your carrier. Also, this user
    data might contain, but not restricted to, log information, URLs related to the app, device ID, your Android version,
    and IP address.
  references:
  - 1. https://support.google.com/accounts/answer/3265955#location
  - 2. https://support.google.com/nexus/answer/6160491?hl=en
  - 1. https://support.google.com/nexus/answer/2812853?hl=en
  - 1. https://support.google.com/nexus/answer/2812853?hl=en
  page_start: 41
