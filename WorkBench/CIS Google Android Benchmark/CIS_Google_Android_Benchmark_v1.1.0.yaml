    Wi-Fi hotspot could be established only with a password and the data is encrypted in transit. Using WPA2-PSK, the wireless
    access point uses the common passphrase to generate unique encryption keys for each wireless client. If you set security
    to None, the Wi-Fi hotspot does not require any authentication and all data could be possibly captured.
