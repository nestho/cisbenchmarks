controls:
- id: '1.1'
  title: (L1) Ensure device firmware is up to date
  scoring: scored
  profile:
  - Level 1
  description: 'Ensure that the device is kept up to date with security patch levels. The recommended state for this setting
    is: Apply updates.'
  rationale: Firmware updates often include critical security fixes that reduce the probability of an attacker remotely exploiting
    the device. The device should be on the latest security patch level as applicable.
  impact: None
  references:
  - 1. https://source.android.com/security/bulletin/index.html
  page_start: 10
  audit_raw: 'To verify that your device is updated to the most recent firmware version:

    1. Tap Settings Gear Icon.

    2. Tap System.

    3. Tap Advanced.

    4. Tap System update.

    5. Verify that the Android Security patch level is current and that no new updates

    exist.'
  remediation: 'Follow the below steps to check and update the device security patch level:

    1. Tap Settings Gear Icon.

    2. Tap System.

    3. Tap Advanced.

    4. Tap System Updates.

    5. Tap Check for update.

    10 | P a g e

    6. Apply the update, if available.'
  checks:
  - type: manual_review
    info: 'To verify that your device is updated to the most recent firmware version:

      1. Tap Settings Gear Icon.

      2. Tap System.

      3. Tap Advanced.

      4. Tap System update.

      5. Verify that the Android Security patch level is current and that no new updates

      exist.'
    severity: medium
- id: '1.2'
  title: (L1) Ensure 'Screen Lock' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Enable Screen lock. The recommended state for this setting is: Enabled.'
  rationale: Enabling Screen lock requires a form of user authentication before interacting with the device. This strengthens
    application and data protection and overall improves the device security.
  impact: A user will be prompted to unlock the device on every use. 12 | P a g e
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&ref_topic=7029556
  page_start: 12
  audit_raw: 'Verify that a Pattern, PIN or Password has been set for the device.

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device Security section.

    4. Verify that Screen lock has Pattern, PIN or Password underneath the text.'
  remediation: 'To configure a Pattern, PIN or Password for the device:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device Security section.

    4. Tap Screen Lock.

    5. Tap Pattern, PIN or Password.

    6. Enter a complex Pattern, PIN or Password.

    7. Tap Continue.

    8. Enter in the same complex Pattern, PIN or Password again.

    9. Tap OK.'
  checks:
  - type: manual_review
    info: 'Verify that a Pattern, PIN or Password has been set for the device.

      1. Tap Settings Gear Icon.

      2. Tap Security.

      3. Scroll to the Device Security section.

      4. Verify that Screen lock has Pattern, PIN or Password underneath the text.'
    severity: medium
- id: '1.3'
  title: (L1) Ensure 'Make pattern visible' is set to 'Disabled' (if using a pattern as device lock mechanism)
  scoring: scored
  profile:
  - Level 1
  description: 'Disable pattern visibility if using a pattern as device lock mechanism. The recommended state for this setting
    is: Disabled.'
  rationale: Keeping device unlock pattern visible during device unlock can reveal the pattern and is vulnerable to shoulder
    surfing attack. Hence, do not make the device unlock pattern visible.
  impact: The user would have to be careful while entering the device unlock pattern since visual feedback would not provide
    any clues for tracing pattern input.
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&visit_id=636958548
  page_start: 14
  audit_raw: 'Follow the below steps and verify that device unlock pattern is not visible:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security section.

    4. If Screen lock has Pattern underneath the text, follow further steps. If not, then

    this recommendation is not applicable.

    5. Tap the Gear Icon next to Screen lock.

    6. Verify that the Make pattern visible switch is Disabled.'
  remediation: 'To disable device unlock pattern visibility, follow the below steps:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security section.

    4. If Screen lock has Pattern underneath the text, follow further steps. If not, then

    this recommendation is not applicable.

    5. Tap the Gear Icon next to Screen lock.

    6. Toggle Make pattern visible to OFF position.

    14 | P a g e'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that device unlock pattern is not visible:

      1. Tap Settings Gear Icon.

      2. Tap Security.

      3. Scroll to the Device security section.

      4. If Screen lock has Pattern underneath the text, follow further steps. If not, then

      this recommendation is not applicable.

      5. Tap the Gear Icon next to Screen lock.

      6. Verify that the Make pattern visible switch is Disabled.'
    severity: medium
- id: '1.4'
  title: (L1) Ensure 'Automatically Lock' is set to 'Immediately'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'Immediately lock the phone as soon as the device goes to sleep. The recommended state for this setting is:
    Immediately. Pressing the power button should lock the device instantly. The recommended state for this setting is: Enabled.'
  rationale: Automatically and immediately locking the device as soon as it goes to sleep ensure that there is no lag between
    the device entering the sleep state and the device getting locked. At times, the user just rests the device and moves
    away from it. The phone eventually enters the sleep state and automatically and immediately locking it ensures that no
    manual locking of the device is needed. This ensures that the unattended devices are locked immediately as soon as the
    device enters the sleep state. Pressing the power button instantly puts the phone to sleep. Enabling Power button instantly
    locks setting ensures that the device is instantly locked as well.
  impact: None 16 | P a g e None
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&visit_id=636958548
  page_start: 16
  audit_raw: 'Follow the below steps and verify that Automatically Look is set to Immediately:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security section.

    4. Tap the Gear icon next to Screen lock.

    5. Verify that Automatically lock has a text Immediately after sleep underneath it.

    Follow the below steps and verify that Power button instantly locks is Enabled:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security.

    4. Tap the Gear icon next to Screen lock.

    5. Verify that Power button instantly locks is Enabled.'
  remediation: 'Follow the below steps and set Automatically Lock to Immediately:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security section.

    4. Tap the Gear icon next to Screen lock.

    5. Tap Automatically lock.

    6. Tap Immediately.

    Follow the below steps to enable the Power button instantly locks setting:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. Scroll to the Device security.

    4. Tap the Gear icon next to Screen lock.

    5. Toggle Power button instantly locks setting to ON position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Automatically Look is set to Immediately:

      1. Tap Settings Gear Icon.

      2. Tap Security.

      3. Scroll to the Device security section.

      4. Tap the Gear icon next to Screen lock.

      5. Verify that Automatically lock has a text Immediately after sleep underneath it.

      Follow the below steps and verify that Power button instantly locks is Enabled:

      1. Tap Settings Gear Icon.

      2. Tap Security.

      3. Scroll to the Device security.

      4. Tap the Gear icon next to Screen lock.

      5. Veri'
    severity: medium
- id: '1.6'
  title: (L1) Ensure 'Lock Screen Message' is configured
  scoring: scored
  profile:
  - Level 1
  description: 'Set a message to be displayed on the locked screen. The recommended state for this setting is: Configure Lock
    Screen Message.'
  rationale: When device screen is locked, a lock screen message helps to provide  deterrent warnings,  device recognition
    without needing to unlock it and  most importantly emergency information Such information could be valuable to both your
    device security as well as personnel security. It is thus recommended to have a suitable lock screen message.
  impact: Anyone who picks up your device can see your message and emergency information without unlocking your phone.
  references: []
  page_start: 20
  audit_raw: 'Follow the below steps and verify that Lock screen message is set:

    1. Tap Settings Gear Icon.

    2. Tap Display.

    3. Tap Advanced.

    4. Tap Lock screen display.

    5. Scroll to the WHAT TO SHOW section.

    6. Tap Lock screen message.

    7. Verify that a suitable Lock screen message is set.'
  remediation: 'Follow the below steps to set up a Lock screen message:

    1. Tap Settings Gear Icon.

    2. Tap Display.

    3. Tap Advanced.

    4. Tap Lock screen display.

    5. Scroll to the WHAT TO SHOW section.

    6. Tap Lock screen message.

    20 | P a g e

    7. Write your message and tap Save.'
  checks:
  - type: sql
    command: SHOW section.
    severity: medium
    info: 'Follow the below steps and verify that Lock screen message is set:

      1. Tap Settings Gear Icon.

      2. Tap Display.

      3. Tap Advanced.

      4. Tap Lock screen display.

      5. Scroll to the WHAT TO SHOW section.

      6. Tap Lock screen message.

      7. Verify that a suitable Lock screen message is set.'
- id: '1.7'
  title: (L2) Do not connect to untrusted Wi-Fi networks
  scoring: scored
  profile:
  - Level 2
  description: 'Do not connect to untrusted Wi-Fi networks. The recommended state for this setting is: Only connect to trusted
    networks.'
  rationale: Connecting a device to an open untrusted network through unsecured channels can increase the remote attack surface
    of the device. Additionally, at present, the cellular data network is a more difficult medium to sniff than Wi-Fi. If
    you are going to be using public Wi-Fi, using a secure VPN is recommended. In most cases, you should avoid using a public
    or untrusted or free Wi-Fi.
  impact: You might have to use cellular data and would not be able to take advantage of Public WiFi. 22 | P a g e
  references:
  - 1. https://support.google.com/android/answer/9075847?hl=en
  page_start: 22
  audit_raw: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

    untrusted network:

    1. Tap Settings Gear Icon.

    2. Tap Network & internet.

    3. Verify that theWi-Fi switch is in the Off position or is connected to a trusted

    network only.'
  remediation: 'Follow the below steps to disable Wi-Fi or connect to a trusted network:

    1. Tap Settings Gear Icon.

    2. Tap Network & internet.

    3. Toggle Wi-Fi setting to the Off position or connect to a trusted network.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

      untrusted network:

      1. Tap Settings Gear Icon.

      2. Tap Network & internet.

      3. Verify that theWi-Fi switch is in the Off position or is connected to a trusted

      network only.'
    severity: medium
- id: '1.8'
  title: (L2) Ensure 'Show passwords' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'Disable password visibility during input. The recommended state for this setting is: Disabled.'
  rationale: This setting controls whether passwords typed into your Android device should be visible on screen, or hidden
    by replacing the letters with dots. When this setting is off, the password is obscured by dots, and only the most recent
    key pressed is visible for a short time after it has been pressed. When this setting is on, the entire password can be
    viewed in plain text, if desired. Disabling this setting protects you against shoulder surfing attacks.
  impact: Given the relative difficulty of typing letters accurately on a small on-screen keyboard, it can be helpful to get
    visual feedback on-screen that you have typed all the letters of your password correctly. Disabling password visibility
    might impact user experience. 24 | P a g e
  references: []
  page_start: 24
  audit_raw: 'Follow the below steps to verify Show passwords is set to Disabled:

    1. Tap Settings Gear Icon.

    2. Tap Privacy.

    3. Verify that Show passwords slider is OFF.'
  remediation: 'Follow the below steps to disable Show passwords:

    1. Tap Settings Gear Icon.

    2. Tap Privacy.

    3. Toggle Show passwords to OFF position.'
  checks:
  - type: sql
    command: 'Show passwords is set to Disabled:'
    severity: medium
    info: 'Follow the below steps to verify Show passwords is set to Disabled:

      1. Tap Settings Gear Icon.

      2. Tap Privacy.

      3. Verify that Show passwords slider is OFF.'
- id: '1.9'
  title: (L1) Ensure 'Developer Options' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Disable Developer Options. The recommended state for this setting is: Disabled.'
  rationale: Enabling Developer Options allows a user to drastically alter certain very advanced settings on the device. This
    can severely affect the way device functions and exposes greater and developmental features to the user. This also exposes
    the device to respond to features such as USB debugging (when enabled) and other such features that could be exploited
    to get malicious access to the device sub-system. Hence, the Developer Options should be disabled.
  impact: None 26 | P a g e
  references:
  - 1. https://developer.android.com/studio/debug/dev-options
  page_start: 26
  audit_raw: 'Follow the below steps to verify that Developer Options is Disabled:

    1. Tap Settings Gear Icon.

    2. Tap System.

    3. Tap Advanced.

    4. Tap Developer options.

    5. Verify that it is OFF.'
  remediation: 'Follow the below steps to disable Developer Options:

    1. Tap Settings Gear Icon.

    2. Tap System.

    3. Tap Advanced.

    4. Tap Developer options.

    5. Toggle it to OFF position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Developer Options is Disabled:

      1. Tap Settings Gear Icon.

      2. Tap System.

      3. Tap Advanced.

      4. Tap Developer options.

      5. Verify that it is OFF.'
    severity: medium
- id: '1.10'
  title: (L1) Ensure 'Install unknown apps' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Disable installation of apps from unknown sources. The recommended state for this setting is: Disabled.'
  rationale: This setting determines whether applications can be installed from locations other than Google Play. Disabling
    installation from untrusted distribution channels protects against inadvertent installation of untrusted or malicious
    applications. Apps on Google play are vetted by Google Security Team and are mostly safe to install. You should avoid
    installing apps from anywhere else.
  impact: None
  references:
  - 1. https://support.google.com/pixelphone/answer/7391672?hl=en
  page_start: 28
  audit_raw: 'Follow the below steps to verify that Install unknown apps is Disabled:

    1. Tap Settings Gear Icon.

    2. Tap Apps & notifications.

    3. Tap Advanced.

    4. Tap Special app access.

    5. Tap Install unknown apps.

    6. Verify that all of the apps in the list show Not allowed.'
  remediation: 'Follow the below steps to disable Install unknown apps:

    1. Tap Settings Gear Icon.

    2. Tap Apps & notifications.

    3. Tap Advanced.

    4. Tap Special app access.

    5. Tap Install unknown apps.

    6. Tap any app showing Allowed.

    7. Toggle Allow from this source to OFF position.

    28 | P a g e'
  checks:
  - type: sql
    command: show Not allowed.
    severity: medium
    info: 'Follow the below steps to verify that Install unknown apps is Disabled:

      1. Tap Settings Gear Icon.

      2. Tap Apps & notifications.

      3. Tap Advanced.

      4. Tap Special app access.

      5. Tap Install unknown apps.

      6. Verify that all of the apps in the list show Not allowed.'
- id: '1.11'
  title: (L1) Do not root your device
  scoring: scored
  profile:
  - Level 1
  description: 'Do not root your device. The recommended state for this setting is: Do not Root.'
  rationale: Rooting your Android device breaks the user level restrictions put by the Android operating system. This significantly
    opens up the device to allow literally any privileged action. Rooting enables any form of alteration to the device. This
    puts the device at a much greater risk because any vulnerability can be exploited without any restrictions. This also
    voids the warranty and future security updates are problematic to install. Hence, for all user purposes, do not root your
    device.
  impact: None
  references:
  - 1. http://www.wikihow.com/Check-if-Your-Android-Cellphone-Is-Rooted-or-Not
  - 2. http://www.wikihow.com/Unroot-Android
  page_start: 30
  audit_raw: 'Detecting whether a device is rooted or not is not straight forward. You would usually need

    to install terminal apps or root checker apps to detect rooted devices. Follow your device

    manufacturer support/documentation/community to detect rooting.'
  remediation: Follow your device manufacturer support/documentation/community to completely unroot your device.
  checks:
  - type: manual_review
    info: 'Detecting whether a device is rooted or not is not straight forward. You would usually need

      to install terminal apps or root checker apps to detect rooted devices. Follow your device

      manufacturer support/documentation/community to detect rooting.'
    severity: medium
- id: '1.12'
  title: (L2) Ensure 'Smart Lock' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'Disable Smart Lock. The recommended state for this setting is: Disabled.'
  rationale: Smart Lock detects device presence and its circumstances and automatically keeps it unlocked even if the device
    has a screen password, pin or pattern enabled. Using Smart Lock does not require you to manually unlock the device every
    time if the pre-defined circumstances are met. As a best practice, do not set the device to get unlocked automatically.
    For example, if your device gets stolen and if it is taken to a location predefined in Smart Lock, it would automatically
    unlock. Similarly, if someone could replay your voice, the device would automatically unlock.
  impact: The device would need to be manually unlocked every time.
  references:
  - 1. https://support.google.com/android/answer/9075927?hl=en&visit_id=636959420
  page_start: 32
  audit_raw: 'Follow the below steps to verify that Smart Lock is Disabled:

    1. Tap the Settings Gear Icon.

    2. Tap Security.

    3. Tap Advanced.

    4. Tap Trust agents.

    5. Verify that Smart Lock (Google) is OFF.'
  remediation: 'Follow the below steps to disable Smart Lock:

    1. Tap the Settings Gear Icon.

    2. Tap Security.

    3. Tap Advanced.

    4. Tap Trust agents..

    5. Toggle Smart Lock (Google) to OFF position.

    32 | P a g e'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Smart Lock is Disabled:

      1. Tap the Settings Gear Icon.

      2. Tap Security.

      3. Tap Advanced.

      4. Tap Trust agents.

      5. Verify that Smart Lock (Google) is OFF.'
    severity: medium
- id: '1.13'
  title: (L2) Ensure 'Lock SIM card' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  description: 'Lock SIM card. The recommended state for this setting is: Enabled.'
  rationale: 'If your device uses a SIM card(s), enable SIM card lock. A SIM card PIN locks the SIM and prevents anyone from
    removing the SIM card from your device and use it on any other device without knowing the PIN. Also, you might choose
    to store your contacts and messages on the SIM card and thus it is highly recommended that you safeguard this valuable
    personal data by setting a custom PIN on the SIM card(s). Note: Only phones that are not locked by the service provider
    can lock the SIM card.'
  impact: You would need to remember your SIM card PIN. If you forget your SIM card PIN, you need your SIM card provider support
    for unlocking the SIM card.
  references:
  - 1. https://support.google.com/android/answer/6088895?hl=enGB&visit_id=636959420073607202-2748220419&rd=1
  page_start: 34
  audit_raw: 'Follow the below steps to verify that Lock SIM card is Enabled:

    1. Tap the Settings Gear Icon.

    2. Tap Security.

    3. Tap SIM card lock.

    4. Verify that Lock SIM card is Enabled.

    5. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

    Lock SIM card is Enabled there as well.'
  remediation: 'Follow the below steps to enable Lock SIM card:

    1. Call up your SIM card provider and get the default SIM PIN.

    2. Tap the Settings Gear Icon.

    3. Tap Security.

    4. Tap SIM card lock.

    5. Toggle Lock SIM card to the on position.

    6. Enter the default PIN provided by your SIM provider.

    7. Press OK.

    8. The Lock SIM card option will then be enabled.

    34 | P a g e

    9. Tap on Change SIM PIN.

    10. Again provide the default PIN provided (Old PIN) by your SIM card provider.

    11. Type your new custom PIN.

    12. Re-type your new custom PIN.

    13. Press OK.

    14. Your custom SIM PIN is then set.

    15. Repeat the process for your 2nd SIM, if applicable.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Lock SIM card is Enabled:

      1. Tap the Settings Gear Icon.

      2. Tap Security.

      3. Tap SIM card lock.

      4. Verify that Lock SIM card is Enabled.

      5. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

      Lock SIM card is Enabled there as well.'
    severity: medium
