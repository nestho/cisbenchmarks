- id: '1.15'
  title: (L1) Ensure 'Use network-provided time' and 'Use networkprovided time zone' are set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'Enable Use network-provided time. For this setting to work correctly, Use networkprovided time zone` setting
    should also be enabled. The recommended state for this setting is: Enabled. Enable remotely locating the device. The recommended
    state for this setting is: Enabled. Enable remotely locking and erasing the device. The recommended state for this setting
    is: Enabled. Scan device for security threats. The recommended state for this setting is: Enabled. Improve detection of
    harmful apps. The recommended state for this setting is: Enabled.'
  rationale: Use network-provided time setting fetches the date and time information from the cellular provider and is generally
    more accurate and reliable than your own managed and set date and time. Accurate date and time could help in forensics,
    device recovery through Android Device Manager and maintain application and logs in a time-sync manner. Remotely locate
    this device setting helps you to track your lost device using Find My Device. It must be enabled for improving the recovery
    possibility of your device. Allow remote lock and erase setting helps you to remotely lock your device or erase your data
    through Find My Device. This helps you to safeguard your privacy and protect your data from unsanctioned access. Scan
    device for security threats setting lets Google regularly check your device and prevent or warn about potential harm.
    This should be always enabled. Enabling Improve harmful app detection setting sends anonymous information to Google about
    apps that were not installed from Google Play. This is especially true if you choose to install apps from "Unknown sources"
    outside of the Google Play Store. This information helps Google better protect everyone from harmful apps.
  impact: None This setting requires you to keep location services enabled all the time. This might be a privacy issue for
    you. This setting requires you to keep location services enabled all the time. This might be a privacy issue for you.
    None User data needs to be sent to Google that may incur data charges based on your carrier. Also, this user data might
    contain, but not restricted to, log information, URLs related to the app, device ID, your Android version, and IP address.
  references:
  - 1. https://support.google.com/nexus/answer/2841106?hl=en
  - 1. https://support.google.com/accounts/answer/3265955#location
  - 1. https://support.google.com/accounts/answer/3265955#location
  - 1. https://support.google.com/googleplay/answer/2812853?hl=en
  - 1. https://support.google.com/googleplay/answer/2812853?hl=en
