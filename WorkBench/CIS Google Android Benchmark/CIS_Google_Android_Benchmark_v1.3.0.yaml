  scoring: scored
  profile:
  - Level 1
  description: 'Disable instant apps. The recommended state for this setting is: Disabled.'
  rationale: Instant apps allow you to use apps without installing them on your device. On clicking app links, the browser
    downloads and run app modules as desired by the user. Having exposure to an app like this is dangerous since any malicious
    link could then potentially trick the user and then browser could download the app code and run on your device without
    requiring installation. Also, this feature defies enterprise security that relies on blacklisting or whitelisting apps
    based on installation. Hence, it is recommended to turn off instant apps.
  impact: Instant apps will not be available. The app links would open on the browser as other regular links.
  references:
