      Or

      madvise [never]

      The exact fo'
- id: '2.7'
  title: Set the File Descriptor Limit to at Least 15,000 to Accommodate Cluster Growth
  scoring: manual
  profile:
  - Level 1
  description: 'CockroachDB can use a large number of open file descriptors, often more than is available by default. Therefore,
    note the following recommendations. For each CockroachDB node: At a minimum, the file descriptors limit must be 1956 (1700
    per store plus 256 for networking). If the limit is below this threshold, the node will not start. It is recommended to
    set the file descriptors limit to unlimited; otherwise, the recommended limit is at least 15000 (10000 per store plus
    5000 for networking). This higher limit ensures performance and accommodates cluster growth. When the file descriptors
    limit is not high enough to allocate the recommended amounts, CockroachDB allocates 10000 per store and the rest for networking;
    if this would result in networking getting less than 256, CockroachDB instead allocates 256 for networking and evenly
    splits the rest across stores.'
  rationale: 'Failing to configure adequate FD limits can lead to critical operational issues: Startup Failures: If the hard
    limit is below the minimum of 1956, the CockroachDB node will explicitly refuse to start. Operational Instability: Low
    limits prevent the cluster from accommodating growth in storage (more stores) and network connections, leading to runtime
    failures under load. Performance Assurance: The recommended limit of $\ge 15,000$ ensures performance and stability as
    the cluster scales.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-premises
  page_start: 76
  audit_raw: 'Perform the following checks on each CockroachDB node:

    1. Check CockroachDB''s Active Per-Process Hard Limit:

    Use the standard Linux process limits interface:

    cat /proc/$(pgrep cockroach)/limits | grep "open files"

    Expected Results:

    The ''Max open files'' Hard limit must be ≥ 15000(or the value you have set, if higher).

    2. Check systemd service LimitNOFILE (if using systemd):

    Inspect your unit file (for example, /var/systemd/system/cockroach.service or

    similar):

    sudo systemctl cat cockroach | grep -i LimitNOFILE

    3. Verify System-Wide FD Limit:

    The system‑wide file descriptor limit should be at least 10× the per‑process limit (e.g., ≥

    150000 when using 15000 per process)

    cat /proc/sys/fs/file-max

    Expected Results:

    If the CockroachDB process hard limit is < 15000, or the system‑wide limit is too low to

    support that many FDs per process, this is a finding.'
  remediation: '1. Set per‑ process limit:

    To adjust the file descriptors limit for a single process on Linux, enable PAM user limits

    and set the hard limit to the recommendation mentioned above. Note that CockroachDB

    always uses the hard limit, so it''s not technically necessary to adjust the soft limit,

    although we do so in the steps below.

    For example, for a node with 1 stores, we would set the hard limit to at least 15000

    (10000 per store and 5000 for networking) as follows:

    The docs distinguish between systemd‑managed and non‑systemd setups.

    If you use systemd:

    Manually-set limits set using the ulimit command or a configuration file like

    /etc/limits.conf are ignored for services started by systemd. To limit the number

    of open file descriptors, add a line like the following to the service definition for the

    cockroach process:

    LimitNOFILE=15000

    You may also set LimitNOFILE=INFINITY if you have tested that configuration with a

    realistic workload.

    Reload systemd for the new limit to take effect:

    sudo systemctl daemon-reload

    Restart the CockroachDB service:

    sudo systemctl restart cockroach.service

    If you do not use systemd:

    Edit /etc/security/limits.conf and append the following lines to the file:

    * soft nofile 15000

    * hard nofile 15000

    You can replace * with the specific username that runs CockroachDB (for example,

    cockroach). Then:

    Ensure pam_limits.so is enabled in /etc/pam.d/common-session and commonsession-noninteractive:

    session required pam_limits.so

    Reboot or log out / log back in and restart the CockroachDB process, then verify with

    ulimit -a .

    2. Increase system‑ wide file descriptor limit:

    You should also confirm that the file descriptors limit for the entire Linux system is at

    least 10 times higher than the per-process limit documented above (e.g., at least

    150000).

    If using systemd, add in /etc/systemd/system.conf or a drop‑in for the

    Manager service:

    [Manager]

    LimitNOFILE=150000

    Then:

    sudo systemctl daemon-reload

    If not using systemd:

    cat /proc/sys/fs/file-max # check current

    echo 150000 | sudo tee /proc/sys/fs/file-max

    To persist, configure your distribution''s sysctl settings accordingly.

    3. Verify:

    After changes:

    cat /proc/$(pgrep cockroach)/limits | grep "open files"

    cat /proc/sys/fs/file-max

    Confirm:

    Process hard limit for open files ≥ 15000.

    System‑wide file-max ≥ 10× that value.'
  checks:
  - type: command
    command: cat /proc/$(pgrep cockroach)/limits | grep "open files" && sudo systemctl cat cockroach | grep -i LimitNOFILE
      && cat /proc/sys/fs/file-max
    expected: ''
    severity: medium
    info: 'Perform the following checks on each CockroachDB node:

      1. Check CockroachDB''s Active Per-Process Hard Limit:

      Use the standard Linux process limits interface:

      cat /proc/$(pgrep cockroach)/limits | grep "open files"

      Expected Results:

      The ''Max open files'' Hard limit must be ≥ 15000(or the value you have set, if higher).

      2. Check systemd service LimitNOFILE (if using systemd):

      Inspect your unit file ('
- id: '3.1'
  title: Ensure CockroachDB Logging Is Enabled and Logs Are Securely Stored (Manual)
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB's built-in logging must remain enabled to capture database events, and log files should be stored
    in a secure location with appropriate access restrictions. By default, CockroachDB produces log files for subsystems such
    as SQL, authentication, and cluster events. Although logging cannot be fully disabled, misconfiguration (e.g., setting
    --log-dir= empty or invalid) can prevent logs from being retained. Ensuring that logging is active and directed to a secure
    directory provides an audit trail of activity. Only the CockroachDB service account and authorized administrators should
    have access.
  rationale: Logs record authentication attempts, configuration changes, and operational events. Disabling or neglecting logging
    prevents forensic analysis and detection of unauthorized activity. Storing logs on a secure filesystem prevents exposure
    or tampering. Proper log management supports non-repudiation and accountability.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/logging-overview
  - 2. https://www.cockroachlabs.com/docs/stable/configure-logs
  page_start: 82
  audit_raw: "Prerequisite: Control 1.2 is implemented and CockroachDB is started only via systemd\n(e.g., cockroach.service).\n\
    1. Verify that CockroachDB logging is enabled and logs are securely\nstored:\nFor default configurations:\ncockroach debug\
    \ check-log-config\nFor custom configured during:\nCheck for explicit logging flags on the running process:\nInspect the\
    \ ExecStart line in the active systemd unit:\nsudo systemctl cat cockroach.service | grep ExecStart\nExpected Results:\n\
    One of the following is true:\nThe ExecStart line contains --log-dir=<path>, for example:\n --log-dir=/var/lib/cockroach/logs\n\
    (--log-dir=XXX is an alias for --log='file-defaults: {dir: XXX}' ).\nOr the ExecStart line contains either:\n--log-config-file=/path/to/log-config.yaml,\n\
    or\n--log={yaml}.\nIf none of these flags are present, determine the on‑disk store directory from the --\nstore flag (or\
    \ the default cockroach-data) and infer the logging directory as\n<store>/logs.\nFor hardened deployments, prefer an explicit\
    \ log directory separate from the main data\nstore to avoid IOPS contention.\n2. Verify the existence and timeliness of\
    \ log files:\nUsing the identified logging directory (e.g., /cockroach-data/logs or a custom\ndirectory such as /var/lib/cockroach/logs),\
    \ verify that log files exist and have\nrecent modification times, for example: ls -lh /var/lib/cockroach/logs or ls\n\
    -lh /cockroach-data/logs (default)\ntail -n 10 /var/lib/cockroach/logs/cockroach.log\nWith the default logging configuration,\
    \ expect files such as:\ncockroach.log (general / DEV and OPS)\ncockroach-security.log (USER_ADMIN, PRIVILEGES)\ncockroach-sql-audit.log\
    \ (SENSITIVE_ACCESS)\ncockroach-sql-auth.log (SESSIONS)\n3. Verify directory ownership and permissions:\nCheck that the\
    \ log directory and files are owned by the CockroachDB service account\nand have restrictive permissions:\nls -ld /var/lib/cockroach/logs\n\
    Expected Results:\nOwner: cockroach\nGroup: cockroach\nMode: drwx------ (700) or more restrictive.\nThe service in Control\
    \ 1.2 should already be configured to run as User=cockroach\nExpected Results:\nThe systemd service's ExecStart line configures\
    \ logging either via:\n--log-dir=/var/lib/cockroach/logs (or another secure path), or\n--log-config-file or --log={yaml}\
    \ , or, if relying on defaults,\nlogs are observed in <store>/logs (for example, /cockroachdata/logs).\nLog files such\
    \ as cockroach.log, cockroach-security.log, and\ncockroach-sql-audit.log exist in the configured logging directory with\n\
    recent timestamps.\nThe log directory is owned by the CockroachDB service account and has\npermissions of 700 (or stricter).\
    \ Log files are owned by the same account and\nhave permissions of 640 (or stricter).\nIf any of these checks fail, this\
    \ is a finding."
  remediation: "Do not introduce a separate way to start CockroachDB; modify the existing\ncockroach.service from Control\
    \ 1.2.\n1. Create and harden the log directory:\nmkdir -p /var/lib/cockroach/logs\nchown -R cockroach:cockroach /var/lib/cockroach/logs\n\
    chmod 700 /var/lib/cockroach/logs\nThis aligns with the docs' recommendation to use a separate directory from the main\n\
    store for logs in cloud / IOPS‑sensitive deployments.\n2. Add logging configuration to cockroach.service:\nEdit /etc/systemd/system/cockroach.service\
    \ (the unit defined in 1.2) and\nupdate the existing ExecStart to include a secure logging path. For example:\n[Service]\n\
    WorkingDirectory=/var/lib/cockroach\nExecStart=/usr/local/bin/cockroach start \\\n --certs-dir=certs \\\n --store=/var/lib/cockroach\
    \ \\\n --log-dir=/var/lib/cockroach/logs \\\n --advertise-addr=<node address> \\\n --join=<node1 address>,<node2 address>,<node3\
    \ address> \\\n --cache=.25 \\\n --max-sql-memory=.25\nUser=cockroach\n--log-dir=/var/lib/cockroach/logs is an alias for\
    \ --log='file-defaults:\n{dir: /var/lib/cockroach/logs}' .\nAlternatively, point to a YAML configuration:\nExecStart=/usr/local/bin/cockroach\
    \ start \\\n --certs-dir=certs \\\n --store=/var/lib/cockroach \\\n --log-config-file=/etc/cockroach/log-config.yaml \\\
    \n ...\nEnsure the YAML uses appropriate file-defaults / file-groups (e.g., dir,\nfile-permissions, max-file-size, max-group-size)\
    \ consistent with or\nhardening the documented defaults.\nReload and restart:\nsudo systemctl daemon-reload\nsudo systemctl\
    \ restart cockroach.service\n3. Tighten file permissions (if needed):\nIf files were created with looser modes, enforce\
    \ restrictive permissions:\nchmod 640 /var/lib/cockroach/logs/*.log\nIf you use a YAML log config, set file-permissions:\
    \ \"0640\" (or stricter) in file-defaults or\nspecific file-groups.\n4. Validate logging after changes:\nPerform any test\
    \ action such as adding rows, simple query.\nConfirm that new entries appear in the appropriate log files (for example,\n\
    cockroach.log)"
  checks:
  - type: command
    command: sudo systemctl cat cockroach.service | grep ExecStart && ls -ld /var/lib/cockroach/logs
    expected: 1. Verify that CockroachDB logging is enabled and logs are securely
    severity: medium
    info: 'Prerequisite: Control 1.2 is implemented and CockroachDB is started only via systemd

      (e.g., cockroach.service).

      1. Verify that CockroachDB logging is enabled and logs are securely

      stored:

      For default configurations:

      cockroach debug check-log-config

      For custom configured during:

      Check for explicit logging flags on the running process:

      Inspect the ExecStart line in the active systemd unit:

      sudo syst'
- id: '3.2'
  title: Ensure Log Rotation and Retention Settings Are Configured
  scoring: manual
  profile:
  - Level 1
  description: 'CockroachDB log rotation and retention must be configured to prevent uncontrolled growth and to preserve an
    appropriate history window. CockroachDB supports per-group rotation parameters that control both individual file size
    and total group retention. Each log file group can define: max-file-size - maximum size of an individual log file before
    a new file is created. max-group-size - total size (or number of files) to retain before older files are purged. By default,
    CockroachDB rotates each file at ~10 MiB and keeps about 100 MiB (~10 files) per group.'
  rationale: 'Unbounded log growth poses both reliability and security risks. If log files are not rotated, a busy CockroachDB
    node could generate extremely large files, potentially exhausting disk space or complicating log review. Proper log rotation
    ensures: Predictable and capped disk usage. Easier log management and review. Compliance with audit retention policies.
    Smaller, segmented logs suitable for archiving or centralization.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/configure-logs
  - 2. https://www.cockroachlabs.com/docs/stable/logging-overview
  page_start: 87
  audit_raw: "1. Review the active logging configuration:\nTo view the current logging configuration as applied:\nUse the\
    \ following command on a node to display the validated logging\nconfiguration:\ncockroach debug check-log-config\nif you\
    \ want to see the default or currently active configuration.*\nAlternatively, if you start nodes with a static (–log config\
    \ ) YAML file:\nsudo grep -A10 'file-groups:' /etc/cockroach/logging.yaml\nVerify that each file-groups entry used in\
    \ production has reasonable values for:\nmax-file-size\nmax-group-size\n2. Inspect on‑ disk rotation behavior:\nCheck\
    \ the node's log directory (by default inferred from the first store directory as\ncockroach-data/logs, or as customized\
    \ with file-defaults.dir).\nls -lh /var/lib/cockroach/logs\ndu -sh /var/lib/cockroach/logs\n3. Check file sizes and count\
    \ per log group:\nfind /var/lib/cockroach/logs -type f -printf '%p %s\\n' \\\n | sort -k2 -nr | head\n4. Confirm rotation\
    \ behavior via filenames and timestamps:\nls -ltr /var/lib/cockroach/logs | tail\nExpected Results:\nEMultiple timestamped\
    \ files per group (e.g., cockroach.log,\ncockroach.2025-10-22T14_10_00Z.log).\nFile sizes are capped approximately at\
    \ the configured max-file-size.\nThe total size of files per group does not exceed max-group-size(The total\nsize of files\
    \ per group does not exceed ).\nNo single log file grows indefinitely.\nIf logs exceed expected limits or only a single\
    \ oversized file exists, rotation is\nmisconfigured - this is a finding."
  remediation: "1. Use defaults or define explicit rotation settings:\nIf you do not configure a custom logging YAML, CockroachDB\
    \ applies defaults of maxfile-size: 10MiB and max-group-size: 100MiB to most file groups, which are\nacceptable for many\
    \ small‑to‑medium deployments.\nTo explicitly configure rotation and retention for self‑hosted nodes, define or edit a\n\
    logging configuration YAML, for example:\nfile-defaults:\n dir: /var/lib/cockroach/logs\n max-file-size: 10MiB # default\
    \ per-file size\n max-group-size: 500MiB # example: increase retention cluster-wide\n filter: INFO\nsinks:\n file-groups:\n\
    \ default:\n # Inherit dir, max-file-size, max-group-size from file-defaults\n channels: {INFO: [DEV, OPS], WARNING: [HEALTH,\
    \ STORAGE, SESSIONS,\nSQL_SCHEMA,\n USER_ADMIN, PRIVILEGES, SENSITIVE_ACCESS, SQL_EXEC, SQL_PERF,\n SQL_INTERNAL_PERF,\
    \ TELEMETRY, KV_DISTRIBUTION]}\n sql-audit:\n channels: {INFO: [SENSITIVE_ACCESS]}\n max-file-size: 20MiB # override if\
    \ audit volume is high\n max-group-size: 200MiB\n buffered-writes: false # typical for security/audit logs\n auditable:\
    \ true # when using file-based auditing\nfile-defaults is the recommended place to set common dir, max-filesize and max-group-size\
    \ for all file groups, overriding only where necessary.\nmax-group-size controls total bytes of all log files per group;\
    \ when exceeded,\nthe oldest files are removed asynchronously.\n2. Start nodes with the configuration:\nStart (or restart)\
    \ each self‑hosted node with the logging configuration:\nFor nodes started directly with cockroach start , apply the logging\n\
    configuration as follows:\ncockroach start \\\n --certs-dir=/var/lib/cockroach/certs \\\n --store=/var/lib/cockroach \\\
    \n --log-config-file=/etc/cockroach/logging.yaml\nAlternatively, you can override rotation parameters inline with the\
    \ --log flag, for\nexample:\ncockroach start \\\n --certs-dir=/var/lib/cockroach/certs \\\n --store=/var/lib/cockroach\
    \ \\\n --log='file-defaults: {dir: /var/lib/cockroach/logs, max-file-size: 10MiB,\nmax-group-size: 500MiB}'\n```[[cockroach\
    \ start – logging]\n(https://www.cockroachlabs.com/docs/stable/cockroach-start#logging)]\nFor nodes managed by systemd\
    \ using cockroachdb.service, add the same\n--log or --log-config-file (example: --log-configfile=/etc/cockroach/logging.yaml)\
    \ flags to the ExecStart line in the\nservice unit and then run:\nsudo systemctl daemon-reload\nsudo systemctl restart\
    \ securecockroachdb\n3. Adjust retention to meet policy:\nSet max-group-size (or max-file-count if used) to retain logs\
    \ for the\ndesired number of days.\nEstimate daily log volume to determine appropriate total retention (i.e. In\nhigh‑traffic\
    \ deployments, It is recommendded increasing file-defaults.maxgroup-size to 500MiB or 1GiB to extend log retention).\n\
    If a centralized log management system is used, keep only a small local backlog\nand forward older logs.\n4. Verify rotation\
    \ after changes:\nAfter configuration, monitor the log directory over time.\nYou should observe:\nNew files being created\
    \ when size thresholds are exceeded.\nOldest files automatically deleted when the total size limit is reached.\nIf this\
    \ behavior does not occur,:\nThe YAML syntax (especially indentation and placement under file-defaults\nand sinks.file-groups).\n\
    That nodes were actually started with --log or --log-config-file and not\nwith conflicting flags such as --log-dir alone.\n\
    5. Ensure diagnostic bundles can still be collected:\nEnsure that rotation does not interfere with diagnostic collections.\n\
    The cockroach debug zip command automatically includes rotated log files.\nAs a best practice, avoid setting max-file-size\
    \ extremely low (for example, a few\nkilobytes), as this could create thousands of small files and impact performance\
    \ or\nmanageability."
  checks:
  - type: command
    command: ls -lh /var/lib/cockroach/logs && find /var/lib/cockroach/logs -type f -printf '%p %s\n' \ && ls -ltr /var/lib/cockroach/logs
      | tail
    expected: 'Verify that each file-groups entry used in production has reasonable values for:'
    severity: medium
    info: '1. Review the active logging configuration:

      To view the current logging configuration as applied:

      Use the following command on a node to display the validated logging

      configuration:

      cockroach debug check-log-config

      if you want to see the default or currently active configuration.*

      Alternatively, if you start nodes with a static (–log config ) YAML file:

      sudo grep -A10 ''file-groups:'' /etc/cockroach'
- id: '3.3'
  title: Ensure Connection Authentication Logging Is Enabled
  scoring: manual
  profile:
  - Level 1
  description: 'CockroachDB can log client connection attempts, successful logins, authentication failures, and session disconnections
    through the SESSIONS logging channel. By default, this channel''s logging is disabled to minimize overhead on all clusters.
    Enabling connection and authentication logging ensures that each login event is recorded with details such as the username,
    client host/IP address, and timestamp for both connection and disconnection events. These settings are controlled by two
    cluster parameters: server.auth_log.sql_connections.enabled - logs connection open and close events. server.auth_log.sql_sessions.enabled
    - logs authentication successes, failures, and session termination. Both parameters must be set to true to enable comprehensive
    session logging.'
  rationale: Tracking who connects to the database, when, and from where is fundamental to security monitoring. Authentication
    logs provide early visibility into brute-force attempts, misuse of credentials, or anomalous login patterns. They form
    a crucial audit trail for compliance and incident response.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/logging-overview
  - 2. https://www.cockroachlabs.com/docs/stable/configure-logs
  page_start: 92
  audit_raw: '1. Verify cluster settings for connection and session authentication

    logging:

    cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \

    -e "SHOW CLUSTER SETTING server.auth_log.sql_connections.enabled;"

    cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \

    -e "SHOW CLUSTER SETTING server.auth_log.sql_sessions.enabled;"

    Expected Results:

    server.auth_log.sql_connections.enabled

    -------------------------------

    true

    server.auth_log.sql_sessions.enabled

    ----------------------------

    true

    Both settings must be true for comprehensive logging of connection and authentication

    events to SESSIONS.

    2. Verify that the SESSIONS log file is present and contains recent

    events:

    Determine the logging directory (default <store>/logs, for example

    /var/lib/cockroach/logs).

    ls -lh /var/lib/cockroach/logs/

    tail -n 10 /var/lib/cockroach/logs/cockroach-sql-auth.log

    In the default configuration, you should see cockroach-sql-auth.log (or rotated variants

    such as cockroach-sql-auth.2025-…log) tied to the SESSIONS channel.

    Expected Result :

    JSON event entries with EventType such as client_connection_start,

    client_connection_end, client_authentication_info,

    client_authentication_ok, client_authentication_failed, and

    client_session_end.

    Fields including User, RemoteAddress, Network, Transport, and

    timestamps. Example (password failure):

    ... "EventType":"client_authentication_failed", ...

    "User":"‹roach›","Detail":"‹password authentication failed for user

    roach›","Method":"cert-password"}

    ... "EventType":"client_session_end", ...

    "RemoteAddress":"‹[::1]:52632›","Duration":...

    3. Verify events via system.eventlog:

    If server.eventlog.enabled is true (default), notable SQL session events are also written

    into system.eventlog per tenant.

    cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \

    -e "SELECT timestamp, (info::JSONB)->>''EventType'' AS eventtype, info FROM

    system.eventlog WHERE (info::JSONB)->>''EventType'' IN (''client_connection_start'',

    ''client_connection_end'', ''client_authentication_failed'', ''client_session_end'')

    ORDER BY timestamp DESC LIMIT 20;"

    Presence of recent records for active clients further confirms that connection and

    authentication events are being captured.

    4. Verify inclusion in centralized logging:

    If you ship logs to a SIEM or log aggregator, confirm that messages from the SESSIONS

    channel (typically from cockroach-sql-auth.log) are collected. How you query this

    depends on your logging stack.'
  remediation: "1. Enable connection and authentication logging:\nUse SQL to enable both cluster settings:\ncockroach sql\
    \ --certs-dir=/var/lib/cockroach/certs --host=<node> \\\n-e \"SET CLUSTER SETTING server.auth_log.sql_connections.enabled\
    \ = true;\"\ncockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \\\n-e \\\"SET CLUSTER SETTING server.auth_log.sql_sessions.enabled\
    \ = true;\\\"\nThese settings apply cluster‑wide and persist across restarts.\n2. Ensure SESSIONS channel is logged to\
    \ disk\nWith the default logging configuration, the SESSIONS channel is already mapped to\ncockroach-sql-auth.log via\
    \ the sql-auth file group.\nBy default, server.auth_log.sql_connections.enabled and\nserver.auth_log.sql_sessions.enabled\
    \ are false, so no connection events are\nlogged.\nIf you use a custom logging YAML, verify that SESSIONS is included\
    \ in at least one file\nsink, for example:\nsinks:\n file-groups:\n sql-auth:\n channels: {INFO: [SESSIONS]}\n dir: /var/lib/cockroach/logs\n\
    \ max-file-size: 10MiB\n max-group-size: 100MiB\n buffered-writes: false\n format: crdb-v2\nThis ensures SESSIONS events\
    \ are persisted to disk. Adjust rotation (max-filesize, max-group-size) in line with Control 3.2.\n3. Be aware of performance\
    \ impact:\nCockroach Labs documents that enabling\nserver.auth_log.sql_connections.enabled and\nserver.auth_log.sql_sessions.enabled\
    \ can impact performance because\neach event incurs a disk write.\nEnable both by default on security‑sensitive or audited\
    \ clusters.\nOn extremely high‑throughput clusters, consider sampling or tightening HBA\nrules while monitoring the performance\
    \ impact.\n4. Integrate with centralized logging (if applicable):\nInclude cockroach-sql-auth.log (or the custom sink\
    \ that carries\nSESSIONS) in your log shipping configuration.\nUse the structured fields (EventType, User, RemoteAddress,\
    \ Method,\nReason) for alerting on repeated failures or suspicious IP ranges."
  checks:
  - type: command
    command: ls -lh /var/lib/cockroach/logs/
    expected: 2. Verify that the SESSIONS log file is present and contains recent
    severity: medium
    info: '1. Verify cluster settings for connection and session authentication

      logging:

      cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \

      -e "SHOW CLUSTER SETTING server.auth_log.sql_connections.enabled;"

      cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \

      -e "SHOW CLUSTER SETTING server.auth_log.sql_sessions.enabled;"

      Expected Results:

      server.auth_log.sql_connections.enabled'
- id: '3.4'
  title: Ensure Database Monitoring and Alerting Are in Place
  scoring: manual
  profile:
  - Level 1
  description: 'A robust monitoring and alerting system must be implemented for CockroachDB to continuously observe the health,
    performance, and security posture of the database cluster. CockroachDB exposes detailed metrics and events through its
    internal timeseries database and provides a built-in Admin UI (DB Console) for visualization. For comprehensive observability,
    these metrics should be exported to an external monitoring stack such as Prometheus and Grafana, and alerts should be
    configured using tools like Alertmanager or equivalent monitoring services. Key aspects include: Node and Cluster Health:
    Live node count, replication status, and underreplicated ranges. Performance Metrics: Throughput, latency, and resource
    utilization (CPU, memory, disk). Security Events: Frequent authentication failures, unusual query volume, or configuration
    changes. Backup and Job Status: Ensure scheduled tasks complete successfully. Please find more information here: https://www.cockroachlabs.com/docs/stable/essential-metrics-self-hosted'
  rationale: Continuous monitoring enables early detection of both operational and security anomalies. Metrics and alerts
    allow administrators to respond proactively to incidents such as node outages, disk exhaustion, performance degradation,
    or unauthorized activity. Effective monitoring also supports compliance frameworks that require audit log management and
    system availability oversight.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/monitor-cockroachdb-withprometheus
  - 2. https://www.cockroachlabs.com/docs/stable/monitoring-and-alerting
  page_start: 97
  audit_raw: 'Perform the following checks to confirm that monitoring and alerting

    are properly configured:

    # 1. Verify that Prometheus or an equivalent collector is scraping CockroachDB

    metrics

    # Check the Prometheus configuration for CockroachDB targets:

    grep "cockroach" /etc/prometheus/prometheus.yml

    # or verify metrics endpoint access directly from a node:

    curl -s http://<node-host>:8080/_status/vars | head

    # 2. Verify Grafana dashboards are deployed and show live data

    # (Log into Grafana at https://<grafana-server>:3000 and confirm CockroachDB

    panels update)

    # The official dashboard JSON is available from Cockroach Labs documentation.

    # 3. Verify alerting rules are configured (Prometheus Alertmanager or equivalent)

    grep "alert:" /etc/prometheus/alert.rules.yml

    # Expected rules: node down, high CPU usage, low disk space, replication issues,

    failed backups, etc.

    # 4. Verify DB Console (Admin UI) metrics and event logs

    # Access https://<node>:8080, navigate to:

    # Metrics → confirm charts update.

    # Advanced Debug → Events → confirm node join/restart/configuration events appear.

    # 5. Verify process ownership and alert response procedures

    # Interview administrators or review documentation confirming that alerts are

    actively monitored and acted upon.

    Expected Results:

    Metrics endpoint (/_status/vars) is reachable and producing data.

    Grafana dashboards show current activity and historical trends.

    Alerting rules exist for critical events (node down, high latency, disk <15%).

    Admin UI displays live metrics and events.

    A defined process exists for alert response and periodic review.

    If any of these components are missing or inactive, this is a finding.'
  remediation: "1. Integrate with Prometheus and Grafana:\nConfigure Prometheus to scrape metrics from all CockroachDB nodes\
    \ (default endpoint:\nhttp://<node>:8080/_status/vars).\nExample Prometheus job configuration:\nscrape_configs:\n - job_name:\
    \ 'cockroachdb'\n scrape_interval: 10s\n static_configs:\n - targets: ['node1:8080', 'node2:8080', 'node3:8080']\nImport\
    \ the official CockroachDB Grafana dashboard JSON from Cockroach Labs to\nvisualize performance data.\n2. Set Up Alerting:\n\
    Define alert rules for conditions such as:\nNode down or unreachable for >1 minute\nDisk capacity <15%\nCPU >90% for 10\
    \ minutes\nQuery latency above threshold\nFrequent authentication failures;\nIntegrate alerts with notification channels\
    \ (email, PagerDuty, Slack, etc.).\n3. Use and Secure the DB Console:\nEnsure the Admin UI is enabled and accessible over\
    \ TLS.\nRegularly review Metrics and Events pages for anomalies.\n4. Centralize Logs and Correlate with Metrics:\nForward\
    \ CockroachDB logs and audit data to your SIEM or log management platform.\n5. Establish Routine Checks:\nConduct periodic\
    \ reviews of dashboards and alerts, perform simulated outage drills, and\nupdate rules as new risks or features emerge."
  checks:
  - type: command
    command: grep "cockroach" /etc/prometheus/prometheus.yml && grep "alert:" /etc/prometheus/alert.rules.yml
    expected: '# 1. Verify that Prometheus or an equivalent collector is scraping CockroachDB'
    severity: medium
    info: 'Perform the following checks to confirm that monitoring and alerting

      are properly configured:

      # 1. Verify that Prometheus or an equivalent collector is scraping CockroachDB

      metrics

      # Check the Prometheus configuration for CockroachDB targets:

      grep "cockroach" /etc/prometheus/prometheus.yml

      # or verify metrics endpoint access directly from a node:

      curl -s http://<node-host>:8080/_status/vars | head'
- id: '4.1'
  title: Restrict Access Using Host-Based Authentication
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB uses a host-based authentication (HBA) configuration to control which SQL connection attempts are
    allowed to proceed and which authentication methods they may use, based on the originating IP address and the SQL user.
    HBA rules are expressed in a PostgreSQL‑compatible DSL and stored in the server.host_based_authentication.configuration
    cluster setting; each rule defines a connection type, database scope (currently always all), user, address (IP/CIDR),
    and authentication method. By configuring this setting, administrators can explicitly restrict inbound SQL connections
    to approved network ranges and enforce the desired authentication methods per origin, adding an application‑layer access‑control
    boundary on top of network‑level controls. For hardened deployments, HBA rules should permit connections only from trusted
    IP addresses or CIDR ranges and then require strong authentication methods such as TLS client certificates (cert / cert-password
    / cert-scram-sha-256) or SCRAM-SHA-256 (scram-sha-256), depending on organizational policy. Less restrictive methods like
    password can be allowed where justified, but unauthenticated or trivially authenticated methods such as trust should be
    avoided in production, and reject should be used as a catch‑all deny rule for unintended origins.
  rationale: Restrictive HBA configuration reduces the attack surface by ensuring that only connections from explicitly permitted
    IP addresses or ranges can reach the authentication stage, even if credentials are compromised. Binding each allowed origin
    to a strong authentication method, such as certificate‑based or SCRAM‑SHA‑256 authentication, limits downgrade opportunities
    and helps prevent unauthorized network‑based access. Because HBA operates at the SQL layer, it provides an additional
    defense‑in‑depth control beyond network firewalls and load balancer rules, and can be used to implement patterns such
    as "jumpbox‑only" access or IP‑scoped user rules.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/security-reference/scramauthentication
  - 2. https://www.cockroachlabs.com/docs/stable/security-reference/config-secure-hba
  page_start: 102
  audit_raw: '1. Review HBA configuration for allowed network origins

    SHOW CLUSTER SETTING server.host_based_authentication.configuration;

    Expected Results:

    Rules explicitly list approved IP addresses or CIDR ranges for client access (for

    example, a jumpbox /32 or specific app subnets).

    A final rule (or equivalent configuration) rejects all other addresses using reject or

    an IP pattern that effectively denies unintended sources.

    Fail if:

    The configuration is empty or effectively equivalent to host all all all

    password on self‑hosted, which is the default and not hardened.

    Broad patterns such as all without a corresponding reject rule allow unvetted

    origins that violate organizational policy.

    2. Verify authentication methods for each origin

    From the same server.host_based_authentication.configuration output,

    inspect the METHOD column for each rule.

    Expected Results:

    Strong methods such as cert, cert-password, cert-scram-sha-256, or

    scram-sha-256 are used where required by policy.

    reject is used for disallowed origins.

    Fail if:

    Rules intended to be hardened rely on trust (no authentication) or on weaker

    methods in contexts where strong methods are mandated by policy (for example,

    where the Benchmark requires SCRAM‑only, but password is still allowed).

    3. Verify default‑ deny behavior

    Confirm that the effective rule set implements a default‑deny stance—for example, by

    ending with:

    host all all all reject

    as shown in hardened examples.

    Fail if:

    There is no explicit or effective deny rule for "all other" origins, resulting in unintended

    access from unlisted networks.'
  remediation: "1. Define explicit whitelisted origins\nConstruct an HBA configuration that lists only authorized IP ranges\
    \ or hosts. For\nexample:\nSET CLUSTER SETTING server.host_based_authentication.configuration = '\n TYPE DATABASE USER\
    \ ADDRESS METHOD\n host all jump_user 203.0.113.10/32 password\n host all app_user 198.51.100.0/24 password\n host all\
    \ all all reject\n';\nThis pattern mirrors the documented approach of whitelisting a jumpbox or application\nIPs and rejecting\
    \ all others.\n2. Enforce appropriate authentication methods\nAdjust the METHOD column so that each allowed origin uses\
    \ an authentication method\nconsistent with organizational policy (for example, cert or scram-sha-256 for human\nusers,\
    \ cert/cert-scram-sha-256 for service accounts), following the supported\nmethods listed in the documentation.\n3. Remove\
    \ or tighten permissive rules:\nReplace overly broad rules (for example, host all all all password ) with\nIP‑scoped entries\
    \ and a final reject rule.\nRemove or narrow any rules that grant access from unapproved IP ranges or that\npermit methods\
    \ contrary to hardening policy.\n4. Apply configuration changes\nSet the updated HBA configuration:\nSET CLUSTER SETTING\
    \ server.host_based_authentication.configuration = '<rules>';\nNo node restart is required; HBA changes take effect from\
    \ the cluster setting, but\nexisting sessions will continue using the authentication method under which they\nwere established."
