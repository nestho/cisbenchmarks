      devices.

      2. Verify Physical RAM Sizing vs. vCPU:

      Compare the node''s RAM to Cockroach Labs'' minimum production '
- id: '2.6'
  title: Configure Transparent Huge Pages (THP) to madvise to Avoid Increased Memory Usage
  scoring: manual
  profile:
  - Level 1
  description: Linux Transparent Huge Pages (THP) is a kernel feature that automatically manages large memory pages to improve
    performance for some workloads. However, for databases such as CockroachDB, this behavior can cause unpredictable latency
    spikes, increased memory fragmentation, and excessive CPU overhead due to THP defragmentation. Cockroach Labs recommends
    configuring THP to madvise instead of the default always mode. This allows CockroachDB to control when huge pages are
    used without forcing the kernel to automatically allocate them for all processes.
  rationale: 'THP in always mode may result in: Unwanted latency from page compaction and defragmentation. Increased memory
    consumption under load. CPU overhead when the kernel continually attempts to merge pages. Setting THP to madvise ensures
    CockroachDB explicitly requests huge pages when beneficial while maintaining predictable memory performance and reducing
    kernel overhead. This configuration aligns with production best practices for database workloads and CIS Linux performance
    hardening standards.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://access.redhat.com/solutions/46111
  page_start: 72
  audit_raw: 'Perform the following commands on each CockroachDB node to verify THP

    configuration:

    # 1. Check the current THP mode

    cat /sys/kernel/mm/transparent_hugepage/enabled

    # 2. Check the defrag setting

    cat /sys/kernel/mm/transparent_hugepage/defrag

    Expected Results:

    The enabled line should show madvise as the active mode, for example:

    Example output:

    always madvise [never]

    Or

    madvise [never]

    The exact formatting may vary by kernel, but madvise should be the

    selected (bracketed) option.

    If [always] is selected (for example, [always] madvise never ), this deviates from

    the CockroachDB recommendation and is a finding for new deployments or for existing

    deployments without a comfortable memory margin.'
  remediation: '1. Temporarily set THP to madvise (takes effect immediately):

    On each node (run as root or via sudo):

    echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled

    #Optionally, align the defrag behavior:

    echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/defrag

    2. Persist the setting across reboots

    Use your distribution''s standard method (for example, systemd unit, boot‑time script, or

    vendor‑recommended approach) to ensure enabled is set to madvise at boot.

    Cockroach Labs notes that the method for permanently changing the THP setting

    depends on the OS, please refer to the OS documentations.

    3. Verify the configuration after reboot:

    cat /sys/kernel/mm/transparent_hugepage/enabled

    Confirm that madvise remains the active selection.'
  checks:
  - type: command
    command: cat /sys/kernel/mm/transparent_hugepage/enabled && cat /sys/kernel/mm/transparent_hugepage/defrag
    expected: ''
    severity: medium
    info: 'Perform the following commands on each CockroachDB node to verify THP

