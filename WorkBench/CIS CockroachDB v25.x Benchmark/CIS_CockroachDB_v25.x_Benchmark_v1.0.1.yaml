- id: '2.3'
  title: Do Not Grant Sudo Privileges to the CockroachDB Process User
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB should run under a dedicated, non-root operating system account that has only the permissions required
    to read and write CockroachDB's data, log, and certificate directories. This dedicated service user (commonly cockroach)
    must not be granted sudo privileges or be included in any privileged system groups (such as wheel, sudo, or adm). Allowing
    the CockroachDB service account to escalate privileges could enable an attacker who compromises the database process to
    gain full control of the underlying host. This violates the principle of least privilege and undermines system isolation.
  rationale: 'Restricting the CockroachDB service account to minimal privileges ensures that even if the CockroachDB process
    or a client connection is compromised, the attacker cannot: Escalate to root access. Modify system configurations or kernel
    parameters. Access sensitive files outside CockroachDB directories. Install or execute arbitrary system commands. This
    control upholds operating system-level separation between application processes and administrative privileges, reducing
    the risk of full system compromise.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-premises
  page_start: 60
  audit_raw: 'Perform the following checks on each CockroachDB node to verify that the process user

    does not have sudo or root-level privileges:

    # 1. Identify the CockroachDB process user

    ps -eo user,comm | grep ''[c]ockroach''

    # 2. Verify the user''s UID is non-root (should not be 0)

    id -u cockroach

    # Expected: A non-zero value (e.g., 997)

    # Inspect the systemd unit to confirm non ‑root user

    sudo systemctl cat cockroach | grep -E ''^User=|^Group=''

    #Expected : User=cockroach ; Group=cockroach

    # 3. Check if the user belongs to privileged groups

    id cockroach

    # Ensure groups like ''sudo'', ''wheel'', or ''adm'' are NOT listed.

    # 4. Verify that the user does not have sudo permissions

    sudo -l -U cockroach

    Expected Results:

    The CockroachDB process runs under a dedicated non-root user (e.g.,

    cockroach).

    The user is not a member of any privileged system groups.

    The sudo -l command returns "user cockroach is not allowed to run sudo" or a

    similar denial message.

    If the CockroachDB service account can execute commands as root or escalate

    privileges, this is a finding.'
  remediation: '1. Create a dedicated non-privileged account for CockroachDB if it

    does not already exist:

    # Create Cockroach directory

    mkdir -p /var/lib/cockroach

    # Create a Unix user named ''cockroach''

    useradd cockroach

    # Make the directory owned by ''cockroach''

    chown -R cockroach /var/lib/cockroach

    The docs use useradd cockroach directly; you may additionally configure shell/flags

    to fit your distro standards.

    2. Remove any sudo privileges for the CockroachDB user:

    Edit /etc/sudoers or /etc/sudoers.d/* and delete any entries granting

    CockroachDB ALL privileges.

    For example, remove lines such as:

    Edit /etc/sudoers or ``/etc/security/limits.d/cockroach.conf`:

    cockroach ALL=(ALL) NOPASSWD: ALL

    Log out and back in, or restart the CockroachDB process to apply.

    3. Verify service operation:

    Ensure the CockroachDB systemd unit runs as the cockroach user and group:

    grep -E ''User=|Group='' /etc/systemd/system/cockroach.service

    Ensure the output:

    User=cockroach

    Group=cockroach

    Expected Results:

    User=cockroach

    Group=cockroach

    Reload systemd and restart CockroachDB if changes are made:

    sudo systemctl daemon-reload

    sudo systemctl restart cockroach'
  checks:
  - type: command
    command: ps -eo user,comm | grep '[c]ockroach' && sudo systemctl cat cockroach | grep -E '^User=|^Group='
    expected: Perform the following checks on each CockroachDB node to verify that the process user
