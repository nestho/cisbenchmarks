- id: '2.4'
  title: Ensure Database Servers Are Isolated in a Separate Subnet with Restricted Ingress and Egress
  scoring: manual
  profile:
  - Level 1
  description: 'The core requirement is to deploy CockroachDB nodes on private, non-public networks (subnets, VLANs, or VPC
    private segments) and to use strict firewall or security group rules to control access to the required ports. This ensures
    the database is shielded from the public internet and enforces least-privilege access. For enhanced security, it is a
    best practice to separate the listen address for internode communication from the listen address used for client SQL connections.
    The three critical TCP ports to control are: 26257 (SQL Traffic): Must be accessible only to application servers, and
    authorized load balancers. 8080 (DB Console): Must be highly restricted, ideally accessible only by administrator networks
    or via secure tunneling (e.g., SSH). Other Port (e.g. 26357): Must be accessible only by other CockroachDB nodes.'
  rationale: 'Network segmentation limits the blast radius of a compromise and prevents direct exposure of database nodes
    to the public Internet or untrusted systems. By isolating CockroachDB in a dedicated subnet, you: Reduce the attack surface
    available to external threats. Prevent lateral movement from compromised web/app servers. Enforce least-privilege access
    paths between tiers. Support compliance requirements for network zoning and data-plane isolation. Improperly exposing
    CockroachDB to shared or public networks can result in unauthorized access, data exfiltration, or denial-of-service attacks.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-premises
  page_start: 64
  audit_raw: "Perform the following checks to confirm CockroachDB nodes are deployed in a\ndedicated subnet or network segment\
    \ with restrictive security rules.\n1. Identify CockroachDB Node Addresses and Network Placement:\nCheck Node IPs: Use\
    \ the cockroach node status command to list the\naddresses the cluster is using for communication.\ncockroach node status\
    \ \\\n --certs-dir=/path/to/certs \\\n --host=<node-address> \\\n --format=table\nExpected Results:\nConfirm the node\
    \ addresses are internal/private (e.g., RFC 1918 ranges like 10.x.x.x,\n172.16.x.x, or 192.168.x.x) and are consistent\
    \ with your controlled internal\nnetwork segments (VLANs or VPC private subnets).\n2. Review Ingress Firewall / Security\
    \ Group Rules:\nReview the host-level firewalls (e.g., iptables, firewalld) or cloud security groups (AWS,\nGCP, Azure)\
    \ applied to the CockroachDB nodes.\nPort Purp\nose\nRequired Ingress Sources\n(Must be restricted)\nFinding if\n26257/TCP\
    \ SQL\nClient\ns\nOnly permit ingress from\nApplication Servers and Load\nBalancers.\nOpen to 0.0.0.0/0 or\nuntrusted\
    \ public networks.\n8080/TCP DB\nCons\nole\nAdmin IP ranges only or local\nhost (if using an SSH tunnel).\nOpen to 0.0.0.0/0\
    \ or\naccessible from non-admin\nnetworks.\nOther Port\n(e.g.\n26357/TCP)\nInternode\nOther CockroachDB Nodes\n(for cluster\
    \ sync).\nOpen to 0.0.0.0/0 or\nuntrusted public networks.\n3. Review Egress Rules:\nReview network perimeter devices\
    \ (or security groups) controlling outbound traffic from\nthe CockroachDB subnet.\nExpected Results:\nEgress is generally\
    \ restricted, allowing traffic only to required external services (e.g.,\nNTP servers, object storage for backups, monitoring\
    \ endpoints)."
  remediation: "1. Place CockroachDB Nodes in Private Networks:\nEnsure all CockroachDB VMs are located in a private VLAN\
    \ or non-internet-routable\nsubnet. If a public IP is assigned for management, ensure it is not the primary address\n\
    used for cluster communication and that its inbound ports are fully locked down.\n2. Tighten Inbound Access:\nConfigure\
    \ host-based firewalls or network security groups to enforce the principle of\nleast-privilege:\nFor Port 26257/TCP:\n\
    Permit: Inbound traffic only from the IP ranges/security groups associated\nwith:\nThe other CockroachDB nodes.\nLoad\
    \ balancers (if applicable).\nDeny: All other traffic by default.\nFor Port 8080/TCP (DB Console):\nPermit: Inbound traffic\
    \ only from specific, known admin IP ranges (e.g.,\nVPN gateways or jump hosts).\nHighly Recommended: Block direct external\
    \ access and require\nadministrators to use an SSH tunnel to securely access the DB Console\nvia a jump host.\nFor Other\
    \ Port (26357/TCP) :\nPermit: Inbound traffic only from the IP ranges/security groups associated\nwith:\nThe other CockroachDB\
    \ nodes.\n3. Separate Internal and SQL Ports\nCockroachDB allows you to separate the listen address for internal inter-node\n\
    communication from the listen address used for client connections connections.\nThis is the best practice for granular\
    \ security control.\n--listen-addr: Defines the address and port used for inter-node (cluster)\ncommunication. Restrict\
    \ this port to only allow traffic from other\nCockroachDB nodes.\n--sql-addr: Defines the address and port used for client\
    \ SQL connections.\nRestrict this port to only allow traffic from application servers or load\nbalancers.\nExample Command:\n\
    cockroach start \\\n --listen-addr=10.0.0.1:26357 \\\n --sql-addr=192.168.1.1:26257 \\\nThis configuration allows you\
    \ to:\nBlock all external access to 10.0.0.1:26357 (the inter-node port), only allowing\ntraffic from the internal IP\
    \ range of other nodes.\nRestrict access to 192.168.1.1:26257 (the SQL port) to application servers and\nload balancers.\n\
    4. Restrict Outbound Access:\nFollowing general security hardening principles, implement a restrictive egress policy:\n\
    Allow: Outbound traffic only to necessary services (e.g., NTP, S3/GCS/Azure\nBlob for backups, monitoring/logging endpoints).\n\
    Deny: All other outbound traffic by default."
