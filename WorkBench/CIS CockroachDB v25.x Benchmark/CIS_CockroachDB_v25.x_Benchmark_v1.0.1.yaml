- id: '4.2'
  title: Restrict and Secure Password Authentication
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB self-hosted clusters support several authentication methods for SQL clients, including passwords,
    SCRAM-SHA-256, TLS client certificates, and others such as GSSAPI/Kerberos (Enterprise), JWT, LDAP/AD and OIDC. For production,
    Cockroach Labs recommends using TLS client certificates instead of passwords, and provides first-class support for SCRAM-SHA-256
    as a stronger password-based mechanism where passwords are still required. In self-hosted environments, operators can
    further restrict where and how password authentication is used by configuring the HBA rules (server.host_based_authentication.configuration)
    and by managing per-user authentication settings via SQL statements such as CREATE USER and ALTER USER . CockroachDB supports
    SCRAM-SHA-256 for storing and verifying password credentials and provides guidance for enabling SCRAM for new and existing
    users, including migration from older cleartext/bcrypt formats. Operators can configure the cluster to encrypt new passwords
    using SCRAM-SHA-256 (server.user_login.password_encryption = 'scram-sha-256' ) and allow pre-hashed SCRAM passwords where
    strict isolation of cleartext credentials is required. For hardened self-hosted deployments, passwords should be minimized
    and, where necessary, protected with SCRAM-SHA-256 and constrained to specific users and client origins via HBA rules,
    while the majority of access relies on stronger certificate-based or externally managed authentication mechanisms.
  rationale: Password-based authentication is more susceptible to brute-force attacks, credential reuse, and phishing than
    certificate-based or federated identity mechanisms. CockroachDB's support for TLS client certificates and SCRAM-SHA-256
    enables operators to reduce these risks by preferring certificate-based authentication and, where passwords remain in
    use, storing them as strong SCRAM hashes instead of weaker or cleartext formats. Enforcing SCRAM-SHA-256 for password
    credentials and phasing out legacy cleartext/bcrypt formats hardens the cluster against offline cracking and replay attacks,
    and aligns with CockroachDB's recommendation to migrate existing users to SCRAM. Separating privileged access paths and
    favoring certificate-based authentication for highly privileged roles (for example, root with TLS client certificates)
    provides stronger cryptographic guarantees and reduces reliance on reusable secrets for critical administration tasks.
    Restricting where password authentication is allowed—via both user configuration and HBA rules—helps ensure that password-based
    logins are tightly controlled, strongly hashed, and limited in scope, contributing to a defense-in-depth posture for self-hosted
    clusters.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/authentication.html
  - 2. https://www.cockroachlabs.com/docs/stable/scram-authentication.html
  page_start: 106
  audit_raw: '1. Review SQL users and hashed password formats

    List users:

    SHOW USERS;

    This shows usernames and role memberships

    To inspect stored password hashes and infer whether SCRAM-SHA-256 is used:

    SET bytea_output = ''escape'';

    SELECT username, "hashedPassword"

    FROM system.users

    WHERE "hashedPassword" IS NOT NULL;

    SCRAM-SHA-256 hashes appear with the SCRAM-SHA-256$... prefix when decoded

    from hex

    Expected Results (for hardened deployments):

    Most privileged and application accounts either:

    Do not have a password (and use certificate or other non-password auth),

    or

    Have SCRAM-SHA-256 hashes, not legacy/bcrypt formats.

    No unexpected users with password hashes exist beyond those intended by

    policy.

    Fail if:

    Many or all users have legacy non-SCRAM hashes, contrary to cluster policy

    where SCRAM is required.

    Users that should rely on certificate-based or external authentication still have

    local password hashes, against policy.

    2. Verify cluster settings enforce SCRAM-SHA-256 for new/updated

    passwords

    Check the password encryption mode:

    SHOW CLUSTER SETTING server.user_login.password_encryption;

    Expected Results:

    scram-sha-256 for hardened self-hosted deployments.

    Optionally, confirm automatic migration of bcrypt passwords to SCRAM (if enabled by

    policy):

    SHOW CLUSTER SETTING

    server.user_login.upgrade_bcrypt_stored_passwords_to_scram.enabled;

    Expected Results (if migration is desired):

    true in v22.2+ to automatically upgrade legacy bcrypt hashes on first login.

    Fail if:

    server.user_login.password_encryption is not set to scram-sha-256

    where policy requires SCRAM.

    Automatic upgrade settings conflict with the organization''s migration strategy.

    3. Review HBA configuration for password-based methods

    Display HBA:

    SHOW CLUSTER SETTING server.host_based_authentication.configuration;

    Inspect METHOD values for rules that allow password-based authentication, such as

    password or scram-sha-256.

    Expected Results:

    Password-based methods appear only where explicitly intended (for example,

    limited user/IP combinations).

    No trust entries are used in hardened self-hosted production.

    Fail if:

    Broad rules (for example, host all all all password) permit password

    authentication from unbounded origins against policy.

    trust or other unauthenticated methods appear in production HBA.'
  remediation: "1. Enable SCRAM-SHA-256 for new passwords\nConfigure the cluster to use SCRAM-SHA-256 for all newly set passwords:\n\
    SET CLUSTER SETTING server.user_login.password_encryption = 'scram-sha-256';\nThis ensures that any CREATE USER ... WITH\
    \ PASSWORD or ALTER USER ...\nWITH PASSWORD operations store SCRAM-SHA-256 hashes.\n2. Migrate existing users to SCRAM-SHA-256\n\
    If legacy/bcrypt hashes exist and migration is desired:\nFor eventual migration:\nSET CLUSTER SETTING\nserver.user_login.upgrade_bcrypt_stored_passwords_to_scram.enabled\
    \ = true;\nFor immediate migration, rotate passwords:\nALTER USER {user} WITH PASSWORD '{new_password}';\nThis writes\
    \ a SCRAM-SHA-256 hash if\nserver.user_login.password_encryption = 'scram-sha-256' .\n3. Optionally implement strict isolation\
    \ of cleartext credentials\nFor environments that require full separation of cleartext password handling:\nEnable acceptance\
    \ of pre-computed SCRAM hashes:\nSET CLUSTER SETTING server.user_login.store_client_pre_hashed_passwords.enabled =\ntrue;\n\
    Configure HBA to allow only scram-sha-256 and/or cert-scram-sha-256,\nand remove password/cert-password from allowed methods:\n\
    SET CLUSTER SETTING server.host_based_authentication.configuration = '\n TYPE DATABASE USER ADDRESS METHOD\n host all\
    \ app_user all scram-sha-256\n host all all all reject\n';\nGenerate SCRAM hashes externally and use them directly in\
    \ CREATE USER / ALTER\nUSER statements as documented.\n4. Tighten HBA rules around password usage\nReplace broad password-based\
    \ rules with IP-scoped and user-scoped entries that use\nscram-sha-256 where passwords are allowed and reject for other\
    \ cases, following\nthe secure HBA examples."
  checks:
  - type: sql
    command: SHOW USERS;
    severity: medium
    info: '1. Review SQL users and hashed password formats

      List users:

      SHOW USERS;

      This shows usernames and role memberships

      To inspect stored password hashes and infer whether SCRAM-SHA-256 is used:

      SET bytea_output = ''escape'';

      SELECT username, "hashedPassword"

      FROM system.users

      WHERE "hashedPassword" IS NOT NULL;

      SCRAM-SHA-256 hashes appear with the SCRAM-SHA-256$... prefix when decoded

      from hex

      Expected R'
- id: '4.3'
  title: Secure the root User and Administrative Roles
  scoring: manual
  profile:
  - Level 1
  description: The root user in CockroachDB has unrestricted administrative privileges across the entire cluster. Because
    compromise of root grants full control, its use must be tightly restricted and secured. The root account should authenticate
    exclusively with TLS client certificates (mTLS), and password authentication must be disabled. Access to root should be
    limited to hardened administrative hosts (e.g., jump boxes/bastion hosts) via host-based access rules. The root user must
    not be used for day-to-day operations, routine queries, application access, or automated scripts; instead, operational
    tasks should be performed using delegated roles with least privilege.
  rationale: The root account is a high-value target for attackers. Certificate-based authentication provides significantly
    stronger protection than passwords because it requires possession of a private key rather than a reusable secret. Preventing
    password authentication for root, restricting where root can log in from, and enforcing strict operational separation
    reduces the risk of cluster-wide compromise. Delegating password fallback to a separate emergency user (Control 1.3) preserves
    recoverability without weakening root security.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/authentication.html
  - 2. https://www.cockroachlabs.com/docs/stable/security-reference/transport-layersecurity
  page_start: 112
  audit_raw: '1. Verify root authentication requires TLS client certificates (mTLS):

    Check HBA configuration:

    SHOW CLUSTER SETTING server.host_based_authentication.configuration;

    Expected Results:

    Entries for root use methods such as cert or cert-*.

    No password-based or unauthenticated method (password, scram-sha-256,

    trust) appears for root.

    root access restricted to specific jump-box IP addresses or CIDR blocks.

    No wildcard or universal access (e.g., all, 0.0.0.0/0, ::/0).

    Fail if:

    Any rule allows root to authenticate using a password.

    Any rule allows root without certificate authentication.

    root can connect from any IP or a broad range outside approved admin hosts.

    2. Verify root is not used for routine or application operations

    If audit logs are enabled:

    cockroach sql --execute="

    SELECT timestamp, eventType, reportingID

    FROM system.eventlog

    WHERE info LIKE ''%root%'';

    "

    Fail if:

    root is used frequently by applications or scripts.

    Routine operations are performed using root instead of delegated roles.'
  remediation: "1. Enforce certificate-only authentication for root\nUpdate the HBA configuration to allow only certificate-based\
    \ methods:\nSET CLUSTER SETTING server.host_based_authentication.configuration = '\n TYPE DATABASE USER ADDRESS METHOD\n\
    \ host all root <jumpbox-cidr> cert\n host all root all reject\n';\nReplace <jumpbox-cidr> with your actual admin network.\n\
    2. Restrict root usage operationally\nReplace script usage with least-privilege service accounts.\nEnsure applications\
    \ do not use root.\nUse root only for tasks requiring full administrative privilege."
  checks:
  - type: sql
    command: SHOW CLUSTER SETTING server.host_based_authentication.configuration;
    severity: medium
    info: '1. Verify root authentication requires TLS client certificates (mTLS):

      Check HBA configuration:

      SHOW CLUSTER SETTING server.host_based_authentication.configuration;

      Expected Results:

      Entries for root use methods such as cert or cert-*.

      No password-based or unauthenticated method (password, scram-sha-256,

      trust) appears for root.

      root access restricted to specific jump-box IP addresses or CIDR bloc'
- id: '4.4'
  title: Centralize and Standardize User Management
  scoring: manual
  profile:
  - Level 1
  description: Self-hosted CockroachDB clusters should maintain consistent and centralized management of database user identities
    to ensure secure, controlled, and predictable access. CockroachDB supports several external authentication systems—such
    as OIDC, GSSAPI/Kerberos, and LDAP—but organizations may also centralize identity management by standardizing how CockroachDB
    accounts are created, assigned roles, and deprovisioned. Centralizing user lifecycle processes reduces the risk of unmanaged
    or orphaned accounts and ensures that authentication and authorization policies are applied consistently across environments.
    When possible, administrators should prefer certificate-based authentication or integrate CockroachDB with an external
    identity provider to unify identity governance.
  rationale: Decentralized or ad-hoc management of CockroachDB user accounts increases the likelihood of misaligned privileges,
    stale accounts, and unauthorized access. A centralized user management process—whether implemented operationally or via
    integration with an external directory—improves governance, auditability, and consistency. Even without full IdP integration,
    standardizing user provisioning, modification, and deprovisioning across self-hosted clusters strengthens security posture.
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/authentication.html
  - 2. https://www.cockroachlabs.com/docs/stable/authentication#oidc-authentication
  page_start: 116
  audit_raw: "1. Review user lifecycle documentation or practices:\nVerify administrators follow a defined user management\
    \ workflow including:\nApproval required for account creation\nStandard role assignment rules\nPrompt deprovisioning of\
    \ users who no longer require access\nFail if:\nNo documented or enforced process exists\nUsers remain active after leaving\
    \ the organization or after their access is no\nlonger needed\n2. Review CockroachDB users for orphaned or unused accounts:\n\
    Run:\nSHOW USERS;\nExpected Results:\nOnly current, authorized users exist\nNo stale, unused, or orphaned accounts appear\n\
    Fail if:\nAccounts exist that do not correspond to active personnel or services\n3. Verify consistent authentication methods\n\
    Check whether users have local password hashes (meaning they rely on password\nauth) or no hash (meaning certificate/IdP\
    \ authentication):\nSELECT username,\n (hashedPassword != '\\x') AS has_password\nFROM system.users;\nInterpretation:\n\
    has_password = false → user authenticates via certificates or external\nidentity\nhas_password = true → user authenticates\
    \ using a password\nFail if:\nAuthentication methods vary without policy\nUsers authenticate in ways that contradict organizational\
    \ standards\nUsers expected to use certificates still have password hashes\n4. If external identity integration is used,\
    \ verify configuration:\n(Required only if the organization has deployed external auth.)\nConfirm that:\nOIDC configuration\
    \ is valid\nKerberos/GSSAPI or LDAP settings are correct\nAuthentication flows align with organizational identity policies"
  remediation: '1. Establish a centralized user management process

    Document and enforce:

    Account creation approval

    Standardized role/privilege assignment

    Required justification for role elevation

    Timely account deprovisioning

    2. Remove orphaned or unauthorized accounts

    DROP USER <username>;

    Only after confirming the user is no longer required and privileges are reassigned as

    needed.

    Encourage certificate-based authentication for administrators and service

    accounts.

    3. (Optional) Integrate an external identity provider

    If suitable for the environment, configure CockroachDB with:

    OIDC

    GSSAPI/Kerberos

    LDAP

    To unify database identities with organizational IAM.'
  checks:
  - type: sql
    command: SHOW USERS;
    severity: medium
    info: '1. Review user lifecycle documentation or practices:

      Verify administrators follow a defined user management workflow including:

      Approval required for account creation

      Standard role assignment rules

      Prompt deprovisioning of users who no longer require access

      Fail if:

      No documented or enforced process exists

      Users remain active after leaving the organization or after their access is no

      longer needed'
- id: '5.1'
  title: Ensure Backups Are Encrypted Using an External Method
  scoring: manual
  profile:
  - Level 1
  description: 'In self-hosted CockroachDB deployments, the Encryption-at-Rest (EAR) feature encrypts only the node''s local
    on-disk data, including SSTables, write-ahead logs (WAL), and temporary files. EAR does not encrypt backup files created
    using the BACKUP statement. By default, backups generated by CockroachDB are written as plaintext objects to the configured
    backup destination unless an explicit backup encryption mechanism is enabled. As a result, backup data may be exposed
    if the storage location is accessed by unauthorized users. To protect backup data, organizations must apply separate encryption
    for all backup files using one or more of the following CockroachDB-supported methods: Cloud Key Management Service (KMS)
    - based encryption (recommended), using AWS KMS, GCP Cloud KMS, or Azure Key Vault to encrypt a randomly generated data-encryption
    key for each backup. AES-256 passphrase-based encryption, which encrypts backup manifests and data files using a key derived
    from a strong passphrase. Storage-provider encryption, where the destination storage system enforces encryption at rest
    (for example, Amazon S3 server-side encryption, Google Cloud Storage default encryption or CMEK, or Azure Storage Service
    Encryption).'
  rationale: 'Backup files typically contain a complete copy of the database, including sensitive or regulated information.
    Because CockroachDB''s EAR feature does not protect backup objects, leaving backups unencrypted exposes organizations
    to risks such as: Compromise of cloud storage buckets or local filesystems Misconfigured access control lists (ACLs) or
    IAM policies Exposure through snapshots or removable media Insider access or credential theft Using explicit backup encryption—either
    at the SQL level (passphrase or KMS) or enforced at the storage layer—ensures that backup data remains confidential even
    if the backup storage location is compromised. This provides cryptographic separation between live database storage and
    backup data and aligns with regulatory requirements for encryption of data at rest.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/backup#options
  - 2. https://www.cockroachlabs.com/docs/stable/take-and-restore-encrypted-backups
  page_start: 121
  audit_raw: '1. Identify recent CockroachDB backups

    Artifact‑level view :

    SHOW BACKUPS IN ''s3://bucket/path?AUTH=...'';

    SHOW BACKUP FROM ''<subdir>''

    IN ''s3://bucket/path?AUTH=...'';

    Job‑level view :

    SELECT *

    FROM system.jobs

    WHERE job_type = ''BACKUP''

    ORDER BY created DESC;

    Warning (unsafe internals, audit‑only):

    This step uses the system.jobs table behind the allow_unsafe_internals

    gate and is not a supported production API for general use . Treat it strictly as a

    break‑ glass operation during periodic audits, run only in a dedicated admin

    session by authorized operators . Do not expose this query or

    allow_unsafe_internals = true to application workloads or end users,

    and end the session (or reset allow_unsafe_internals to off) immediately

    after the check .

    SET allow_unsafe_internals = false;

    If you need history beyond the jobs retention window, there is no long‑ term

    source in SQL; you need exported logs / observability (e.g.,

    recovery_event in eventlog, log shipping to SIEM) to prove older backups

    were taken.

    2. Inspect backup job options for encryption

    For each backup job, inspect its details (for example, using SHOW JOB job_id or

    equivalent) and verify whether one of the following options is present:

    encryption_passphrase

    kms = ...

    If neither option appears and storage-layer encryption is not being used (see Step 3),

    record a finding.

    3. Validate destination storage encryption

    Using cloud or storage tooling outside of CockroachDB, verify encryption at rest is

    enforced for the backup destination:

    AWS S3: Confirm server-side encryption (SSE-S3 or SSE-KMS) is enabled.

    Google Cloud Storage: Confirm default encryption or customer-managed

    encryption keys (CMEK) are configured.

    Azure Blob Storage: Confirm Storage Service Encryption is enabled.

    If backups are written to a local filesystem, verify that filesystem-level or external

    encryption is enabled using operating system or platform tooling.

    If encryption is not enforced at the storage layer, record a finding.

    4. Verify secure handling of passphrases and keys

    Confirm that backup encryption_passphrase or KMS credentials are not stored in

    plaintext within:

    Shell scripts

    Systemd unit files

    Application source code

    CI/CD pipelines

    Logs or configuration files

    Secrets should be stored in an approved secret-management solution.'
  remediation: "Option 1 - Enable AES-256 Passphrase-Based Backup Encryption\nConfigure backups to use passphrase-based encryption:\n\
    BACKUP DATABASE <db>\nINTO 's3://bucket/path?AWS_ACCESS_KEY_ID=...&AWS_SECRET_ACCESS_KEY=...'\nWITH encryption_passphrase\
    \ = '<strong-passphrase>';\nUse an external secret manager (e.g., Vault, AWS Secrets Manager) to store the\npassphrase\
    \ (not documented in CockroachDB, but strongly recommended\noperationally).\nOption 2 — Use Cloud KMS - managed encryption\
    \ (recommended)\nUse the kms option so that CockroachDB encrypts each backup with a random 256‑bit\nkey, which is then\
    \ encrypted by the cloud KMS.\nExample — AWS KMS:\nBACKUP INTO 's3://{BUCKET NAME}?AWS_ACCESS_KEY_ID={KEY ID}&AWS_SECRET_ACCESS_KEY=\n\
    {SECRET ACCESS KEY}'\n WITH kms = 'aws:///{key}?AWS_ACCESS_KEY_ID={KEY ID}&AWS_SECRET_ACCESS_KEY=\n{SECRET ACCESS KEY}&REGION=us-east-1';\n\
    Example — GCP KMS:\nBACKUP INTO 'gs://{BUCKET NAME}?AUTH=specified&CREDENTIALS={ENCODED KEY}'\n WITH kms = 'gs:///projects/{project\
    \ name}/locations/us-east1/keyRings/{key\nring name}/cryptoKeys/{key name}?AUTH=specified&CREDENTIALS={encoded key}';\n\
    Example — AZURE KMS:\nBACKUP INTO 'azure-blob://{container name}?AUTH=specified&AZURE_ACCOUNT_NAME=\n{account name}&AZURE_CLIENT_ID={client\
    \ ID}&AZURE_CLIENT_SECRET={client\nsecret}&AZURE_TENANT_ID={tenant ID}'\n WITH kms = 'azure-kms:///{key}/{key version}?AZURE_TENANT_ID={tenant\n\
    ID}&AZURE_CLIENT_ID={client ID}&AZURE_CLIENT_SECRET={client\nsecret}&AZURE_VAULT_NAME={key vault name}';\nThe same kms\
    \ URI(s) must be supplied for RESTORE and SHOW BACKUP to decrypt the\nbackup.\nOption 3 — Enforce encryption at the storage\
    \ layer\nIf you do not use SQL-level backup encryption:\nConfigure S3, GCS, or Azure Blob Storage to require server-side\
    \ encryption for\nall objects.\nEnsure bucket/container policies block uploads without encryption.\nCockroachDB will then\
    \ write plaintext backup objects that are encrypted at rest by the\nstorage provider."
  checks:
  - type: sql
    command: SHOW BACKUPS IN 's3://bucket/path?AUTH=...';
    severity: medium
    info: '1. Identify recent CockroachDB backups

      Artifact‑level view :

      SHOW BACKUPS IN ''s3://bucket/path?AUTH=...'';

      SHOW BACKUP FROM ''<subdir>''

      IN ''s3://bucket/path?AUTH=...'';

      Job‑level view :

      SELECT *

      FROM system.jobs

      WHERE job_type = ''BACKUP''

      ORDER BY created DESC;

      Warning (unsafe internals, audit‑only):

      This step uses the system.jobs table behind the allow_unsafe_internals

      gate and is not a supported pro'
- id: '5.2'
  title: Periodically Test Backup Recovery Procedures
  scoring: manual
  profile:
  - Level 1
  description: 'Self-hosted CockroachDB deployments must regularly test backup recovery procedures to ensure that backups
    can be successfully restored, data integrity is preserved, and security controls remain effective during restoration.
    CockroachDB provides multiple backup and restore features, including full and incremental backups, encrypted backups,
    and backup validation tools. These features allow you to verify that stored backups are restorable without always performing
    a full restore. While creating backups (including encrypted backups) is critical, backups that are never tested may be
    unusable due to corruption, misconfiguration, missing encryption keys, expired credentials, or incorrect recovery procedures.
    Periodic restore testing validates that: Backup files are complete and readable (for example, via SHOW BACKUP ... WITH
    check_files or RESTORE ... WITH schema_only , verify_backup_table_data). Encryption mechanisms (passphrase or KMS) function
    correctly during restore when using encrypted backups. Required credentials and permissions to access external/cloud storage
    are available and functional. Restore procedures are documented, repeatable, and effective. Restore testing must be performed
    in a non-production environment (for example, an empty or dedicated test cluster) to avoid impacting live workloads and
    to prevent accidental data exposure. schema_only restores and validation restores can be run on such test clusters and
    then dropped after validation.'
  rationale: 'Backups that cannot be restored are operationally equivalent to having no backups at all. CockroachDB provides
    tools to take and restore full and incremental backups, including encrypted backups, and to validate that backups are
    restorable. Common failure scenarios include: Lost or inaccessible encryption passphrases or KMS keys required to restore
    encrypted backups. Undocumented or untested recovery steps. Corrupted or incomplete backup artifacts (for example, missing
    SST files in cloud storage). Regular restore testing using CockroachDB''s validation and restore mechanisms ensures that:
    Recovery time objectives (RTOs) defined in the disaster recovery strategy are achievable in practice. Data integrity is
    preserved end-to-end by confirming that schemas and data can be restored and, where applicable, that table data files
    are present and uncorrupted. Encryption and access controls remain enforced during recovery when using encrypted backups.
    Organizations are prepared for real incident response scenarios, including ransomware or other disaster events. Testing
    recovery procedures is a fundamental resilience practice and is aligned with CockroachDB''s disaster recovery and data
    resilience guidance.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/backup
  - 2. https://www.cockroachlabs.com/docs/stable/restore
  page_start: 126
  audit_raw: '1. Verify existence of documented restore procedures

    Confirm that the organization maintains documented procedures covering:

    Where CockroachDB backups are stored (for example, S3, GCS, Azure Blob, or

    other supported cloud storage).

    How to restore backups, including:

    Use of RESTORE for full‑ cluster, database, or table restores into a

    non‑ production CockroachDB cluster (for example, a dedicated

    DR/test cluster).

    Steps to provision or scale a recovery cluster (infrastructure,

    networking, access control) and restore into it, so that DR procedures

    exercise real‑world operational workflows (not just validation options).

    Use of backup validation options (for testing/debug only), including:

    Use of RESTORE ... WITH schema_only as a fast validation /

    debugging tool to confirm:

    Storage credentials and IAM are correct.

    Backups exist and are discoverable.

    Basic schema and version compatibility.

    Optional use of RESTORE ... WITH schema_only ,

    verify_backup_table_data only where required for additional

    assurance or compliance (for example, to checksum table data files in

    backup storage). Note that this option:

    Must always be used together with schema_only.

    Is primarily a validation aid, and is not a substitute for a full

    restore into a real CockroachDB cluster.

    How to restore encrypted backups, including:

    Required kms configuration (AWS KMS, GCP KMS, Azure Key Vault) or

    Required encryption_passphrase usage.

    Required credentials and permissions to access backup storage and KMS.

    Validation steps after restore (for example, checking schemas, running queries,

    or using backup validation options)

    If no documented restore procedure exists -> Finding

    2. Verify restore testing frequency

    Review operational records, tickets, or logs to confirm that restore tests or backup

    validation operations are performed on a defined schedule (for example, quarterly, biannually, or after major changes).

    Evidence may include:

    Change records or DR test reports referencing RESTORE or SHOW BACKUP ...

    WITH check_files .

    Runbooks or automation with execution timestamps for validation restores (for

    example, schema_only or verify_backup_table_data restores).

    CI/CD or automation logs showing periodic backup validation or test restores.

    Monitoring or observability records for backup and restore jobs.

    If restore testing is ad-hoc or never performed → Finding.

    3. Validate successful restore execution

    Confirm that at least one recent restore or validation test was successfully completed in

    a non-production environment, including:

    Successful access to backup storage and reading of backup files (for example,

    via SHOW BACKUP ... WITH check_files or a validation restore).

    Successful cluster, database, or table restore or validation restore, such as:

    RESTORE ... WITH schema_only to validate schema.

    RESTORE ... WITH schema_only, verify_backup_table_data to

    validate that table data files are present and uncorrupted.

    Verification that restored objects (schemas and, where applicable, data) are

    accessible in the test environment.

    For encrypted backups, confirm that restore tests used the correct encryption

    configuration:

    WITH kms = ''kms://...'' (or equivalent) for KMS-encrypted backups, or

    WITH encryption_passphrase = ''...'' for passphrase-encrypted

    backups.

    Failure to restore or validate encrypted backups → Finding.

    4. Validate post-restore security controls

    After restore testing, verify that:

    Restored data remains protected according to the organization''s encryption-atrest configuration (for example, if encryption
    at rest is enabled on the test cluster,

    it remains enabled after restore).

    Access controls (SQL users/roles and network controls) are correctly applied in

    the test environment and do not expose restored data beyond intended scope.

    Temporary credentials or secrets used during testing (for example, temporary

    cloud storage keys or KMS credentials) are revoked or rotated according to

    organizational policy.

    If security controls are bypassed or weakened during restore → Finding.'
  remediation: '1. Define a restore testing schedule

    Establish a policy requiring restore or backup validation testing at a regular cadence

    and after key changes, such as:

    Changes to backup configuration or destinations.

    Changes to backup encryption (for example, enabling encrypted backups or

    changing KMS configuration).

    KMS key rotation or changes to encryption keys.

    IAM or credential changes affecting access to backup storage or KMS.

    Major CockroachDB version upgrades that may affect backup/restore

    compatibility.

    2. Perform restore tests in a non-production environment

    Restore or validate backups into a dedicated test cluster or isolated environment using

    documented procedures:

    Primary DR validation (recommended):

    Run a normal RESTORE (cluster, database, or table, as appropriate) into a real

    CockroachDB cluster (non‑production) and validate that:

    The cluster can be provisioned or scaled for recovery.

    Restored objects are present and accessible.

    Representative application queries run successfully against the restored

    data.

    Supplementary / faster validation between full DR tests (optional):

    For schema validation and credential checks, use:

    RESTORE ... WITH schema_only; on an empty or test cluster to

    validate backup existence, storage/KMS credentials, and schema/version

    compatibility.

    Where required for additional assurance or compliance, use:

    RESTORE ... WITH schema_only,

    verify_backup_table_data; to read and checksum table data from

    backup storage without writing it to disk. This is a validation/debugging

    tool and does not replace periodic full RESTORE tests into a real cluster.

    For encrypted backups, ensure restore commands include the correct KMS or

    passphrase configuration.

    After validation, drop the restored database or destroy the test cluster to return the

    environment to its pre-test state.

    3. Validate data integrity

    After restoration or validation:

    Verify that database objects (databases, tables, schemas) are present using

    standard SQL inspection (for example, SHOW TABLES ).

    Run basic queries to confirm data accessibility when performing a full restore

    test.

    Confirm schema and metadata integrity (for example, that table definitions match

    expectations).

    Where applicable, rely on verify_backup_table_data to ensure that table

    data files are present and uncorrupted.

    4. Document and remediate failures

    If restore testing or backup validation reveals failures:

    Update documentation and automation (runbooks, scripts, or scheduled jobs) to

    reflect correct restore and validation procedures.

    Correct permission, connectivity, or encryption issues (for example, missing KMS

    permissions or incorrect storage URIs).

    Re-run restore or validation tests until successful.

    Maintain records of restore tests and outcomes, including timestamps, scope

    (cluster/database/table), and any issues discovered and resolved.'
  checks:
  - type: sql
    command: SHOW BACKUP ...
    severity: medium
    info: '1. Verify existence of documented restore procedures

      Confirm that the organization maintains documented procedures covering:

      Where CockroachDB backups are stored (for example, S3, GCS, Azure Blob, or

      other supported cloud storage).

      How to restore backups, including:

      Use of RESTORE for full‑ cluster, database, or table restores into a

      non‑ production CockroachDB cluster (for example, a dedicated

      DR'
- id: '5.3'
  title: Control Key Data Usage for Multi-Region Clusters with Data Localization Restrictions
  scoring: manual
  profile:
  - Level 1
  description: 'In self-hosted CockroachDB multi-region clusters, organizations must ensure that Personally Identifiable Information
    (PII) or other regulated data is not used as part of primary key constraints or secondary indexes. In CockroachDB, primary
    keys define the primary index, and primary key columns are implicitly included in all secondary indexes. When a column
    is included in a primary key or index, its values are: 1. Stored in index keyspace entries as part of the primary or secondary
    index. 2. Implicitly included in secondary indexes when part of the primary key. 3. Distributed and replicated across
    the cluster for query routing and fault tolerance, including across regions in multi-region deployments. As a result,
    placing PII fields (such as names, email addresses, phone numbers, national identifiers, or other sensitive attributes)
    into primary keys or secondary indexes can cause unintentional cross-region data replication, potentially conflicting
    with data localization, residency, or sovereignty requirements. CockroachDB''s data domiciling and multi-region features
    (for example, REGIONAL BY ROW, super regions, and placement controls) are designed to help keep data within specific geographic
    boundaries, but indexed columns are still part of the distributed keyvalue and index structures. To comply with data localization
    restrictions, organizations should ensure that PII fields are stored only as non-indexed columns where possible, and that
    primary keys and indexes use non-sensitive surrogate identifiers. CockroachDB documentation recommends using UUIDs or
    composite keys with well-distributed, non-sensitive columns as primary keys, and warns about the implications of primary
    key design on data distribution.'
  rationale: 'CockroachDB''s distributed architecture prioritizes availability and low-latency access by automatically sharding
    and replicating data, including index structures, across nodes and regions. While this behavior is desirable for performance
    and resilience, it has implications for sensitive data: Primary key values are embedded in the primary index and implicitly
    included in all secondary indexes. Secondary indexes store indexed column values and primary key columns, which are distributed
    across the cluster. In multi-region deployments, index data participates in the same replication and placement mechanisms
    as other data, and may be present in multiple regions for availability and latency. If PII is used in keys or indexes,
    it may: Be stored or replicated in regions where it is not intended to reside, complicating compliance with GDPR, CCPA,
    or other data residency regulations. Be exposed to administrators or systems in other jurisdictions that have access to
    those regions. Make it harder to enforce strict data localization using features like super regions or placement restrictions,
    because indexed values are part of the distributed keyspace. By using surrogate keys (for example, UUIDs) and restricting
    PII to non-indexed columns, organizations can: 1. Follow CockroachDB''s primary key best practices (for example, using
    UUIDs for single-column primary keys). 2. Maintain CockroachDB''s performance and availability benefits. 3. Better align
    with data domiciling and data sovereignty requirements by limiting where sensitive values appear in the distributed keyspace.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/multiregion-overview
  - 2. https://www.cockroachlabs.com/docs/stable/table-localities
  page_start: 132
  audit_raw: '1. Identify multi-region configuration

    Confirm that the CockroachDB cluster is configured for multi-region deployment.

    Evidence may include:

    Databases configured with PRIMARY REGION and additional REGION entries.

    Use of table locality settings such as LOCALITY REGIONAL BY TABLE ,

    LOCALITY REGIONAL BY ROW , or LOCALITY GLOBAL .

    Use of super regions or placement controls for data domiciling.

    If the cluster is single-region only and not using multi-region abstractions, this control

    may be marked Not Applicable.

    2. Identify tables containing PII

    Review database schemas, data classification inventories, or application documentation

    to identify tables containing PII or regulated data. CockroachDB does not automatically

    classify PII, so this step relies on organizational data classification.

    Common examples include columns such as:

    Name, email address, phone number.

    National ID numbers.

    Customer identifiers tied to real individuals.

    Account numbers associated with personal data.

    If no inventory exists, auditors may need to sample schemas and consult application

    owners.

    3. Review primary key definitions

    Inspect table definitions to identify whether PII fields are included in primary keys.

    Use:

    SHOW CREATE TABLE <table_name>;

    Review the PRIMARY KEY clause in the CREATE TABLE statement.

    If any PII column appears in the PRIMARY KEY definition -> Finding.

    4. Review secondary indexes

    List indexes for tables containing PII:

    SHOW INDEXES FROM <table_name>;

    The SHOW INDEX output lists each index and its columns, including implicitly included

    primary key columns.

    Finding if:

    Any PII column is included as an indexed column in a secondary index (that is,

    appears with storing = false and implicit = false for that index).

    PII appears as part of the primary key and therefore is implicitly included in all

    secondary indexes (implicit = true for that column in secondary indexes).

    5. Validate use of surrogate identifiers

    Confirm that:

    Primary keys use non-sensitive surrogate identifiers (for example, UUIDs

    generated with gen_random_uuid() or other non-PII identifiers), consistent

    with CockroachDB primary key best practices.

    PII columns are stored as non-indexed attributes unless explicitly required for

    lawful and documented reasons (for example, regulatory or business

    requirements that have been reviewed and approved).

    Where PII must be indexed, table locality and data domiciling configurations (for

    example, REGIONAL BY ROW plus super regions) are used to constrain where

    that data is stored and replicated'
  remediation: '1. Replace PII-based keys with surrogate keys

    Refactor schemas so that primary keys use surrogate identifiers instead of PII.

    CockroachDB recommends:

    Using UUID-typed columns with default values generated by

    gen_random_uuid() for single-column primary keys.

    Using composite primary keys where the leading column is a well-distributed,

    non-sensitive identifier.

    Ensure PII columns are stored as regular, non-indexed fields where possible.

    Schema changes may require:

    Creating a new surrogate key column.

    Updating application code to reference the surrogate key.

    Using ALTER TABLE ... ALTER PRIMARY KEY to change the primary key

    definition (not explicitly covered in the provided sources, but implied by

    CockroachD''s support for primary key changes).

    2. Remove or redesign PII-based secondary indexes

    Where indexing on PII is not strictly required:

    Drop secondary indexes containing PII columns using DROP INDEX .

    Replace them with indexes on non-sensitive identifiers (for example, surrogate

    keys) that can still support required query patterns.

    If indexing on PII is required for business reasons:

    Document the justification and obtain compliance or legal approval.

    Where possible, restrict table locality and data placement using multi-region

    features (for example, REGIONAL BY ROW plus super regions or placement

    controls) so that PII-bearing indexes are domiciled within the required geographic

    boundary.

    3. Validate data locality after changes

    After schema changes:

    Verify table locality settings using SHOW CREATE TABLE and database region

    configuration (ALTER DATABASE ... PRIMARY REGION , ADD REGION , ADD

    SUPER REGION ).

    Confirm that PII columns are not part of primary keys or secondary indexes by

    re-running SHOW CREATE TABLE and SHOW INDEXES FROM

    <table_name>.

    Re-test application queries to ensure functionality and performance are

    preserved, adjusting query patterns to use surrogate keys where necessary.

    For data domiciling scenarios, verify that regional placement (for example,

    REGIONAL BY ROW with crdb_region, super regions) still enforces the

    intended residency boundaries.'
  checks:
  - type: sql
    command: SHOW CREATE TABLE <table_name>;
    severity: medium
    info: '1. Identify multi-region configuration

      Confirm that the CockroachDB cluster is configured for multi-region deployment.

      Evidence may include:

      Databases configured with PRIMARY REGION and additional REGION entries.

      Use of table locality settings such as LOCALITY REGIONAL BY TABLE ,

      LOCALITY REGIONAL BY ROW , or LOCALITY GLOBAL .

      Use of super regions or placement controls for data domiciling.

      If the '
- id: '6.1'
  title: Ensure Certificate File Permissions and Validity
  scoring: manual
  profile:
  - Level 1
  description: While Control 1.3 ensures the cluster operates with TLS enabled, this control focuses on the security and maintenance
    of the certificate files residing on the node's file system. Critical security artifacts, specifically private keys (node.key,
    client.root.key), must be protected with strict OS-level file permissions to prevent unauthorized local users from reading
    the keys. Additionally, certificates must be actively monitored for validity periods to prevent outages caused by expiration.
  rationale: If a private key file on the disk is improperly secured and world-readable (e.g., chmod 644 or 777), a local
    attacker on the host system can copy the key, leading to a direct compromise of the private key. This compromises the
    confidentiality of the system, potentially allowing the attacker to decrypt captured network traffic. Enforcing strict
    OSlevel file permissions (0600) ensures that only the dedicated database user can read the keys, significantly reducing
    the likelihood of a private key compromise. Furthermore, failing to monitor certificate expiration leads to sudden cluster
    unavailability when the certificates become invalid and rotation is neglected.
  impact: ''
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/create-security-certificates.html
  - 2. https://www.cockroachlabs.com/docs/stable/cockroach-cert.html#rotatecertificates
  page_start: 139
  audit_raw: '1. Verify Private Key Permissions:

    Run the following command to check permissions for all .key files in the certificate

    directory.:

    ls -l /var/lib/cockroach/certs/*.key

    Expected Results:

    Permissions must be -rw------- (600) or -r-------- (400).

    Owner must be the database user (e.g., cockroach).

    Findings: Mark as failed if permissions allow Group or Others to read/write (e.g., -rwr--r--).

    2. Verify Certificate Permissions:

    Run the following command to check permissions for .crt files:

    ls -l /var/lib/cockroach/certs/*.crt

    Expected Results:

    Permissions should be -rw-r--r-- (644).

    Owner must be the database user (e.g., cockroach).

    3. Verify Certificate Expiration:

    Check the expiration date of the current node certificate.

    openssl x509 -in /var/lib/cockroach/certs/node.crt -noout -enddate

    Expected Results:

    The output date must be in the future.'
  remediation: '1. Restrict Private Key Permissions:

    If keys are found to be too open, lock them down immediately.

    chmod 600 /var/lib/cockroach/certs/*.key

    2. Correct Ownership:

    Ensure the directory and files are owned by the specific CockroachDB user.

    chown -R cockroach:cockroach /var/lib/cockroach/certs

    3. Renew Expiring Certificates:

    If openssl indicates the certificate is expired or near expiration:

    Generate new certificates on your secure CA workstation (as defined in Control

    1.3 Remediation).

    Upload them to /var/lib/cockroach/certs on the node.

    Reload the certificates by sending a SIGHUP to the process:

    pkill -SIGHUP cockroach'
  checks:
  - type: command
    command: ls -l /var/lib/cockroach/certs/*.key && ls -l /var/lib/cockroach/certs/*.crt
    expected: ''
    severity: medium
    info: '1. Verify Private Key Permissions:

      Run the following command to check permissions for all .key files in the certificate

      directory.:

      ls -l /var/lib/cockroach/certs/*.key

      Expected Results:

      Permissions must be -rw------- (600) or -r-------- (400).

      Owner must be the database user (e.g., cockroach).

      Findings: Mark as failed if permissions allow Group or Others to read/write (e.g., -rwr--r--).

      2. Verify'
- id: '6.2'
  title: Ensure local connections via UNIX domain sockets are configured correctly
  scoring: manual
  profile:
  - Level 1
  description: UNIX domain sockets provide secure local inter-process communication for database connections on the same host.
    When combined with certificate-based authentication (see section 6.0), UNIX domain sockets offer the most secure mechanism
    for local database access. For matching UNIX usernames, certificate-less authentication via UNIX domain sockets can provide
    secure local access without requiring certificate management, though certificate-based authentication is still recommended
    for maximum security. UNIX domain sockets eliminate network-based attack vectors and provide file systemlevel access controls.
    The socket file location, permissions, and authentication methods should be properly configured to prevent unauthorized
    local access.
  rationale: 'UNIX domain sockets provide several security advantages for local connections: No network exposure or attack
    surface File system-level access controls Better performance than TCP/IP for local connections Integration with UNIX user
    authentication Reduced complexity for local administrative tasks'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/authentication.html
  - 2. https://www.cockroachlabs.com/docs/stable/connection-parameters.html
  page_start: 143
  audit_raw: 'Prerequisites: Ensure certificate infrastructure is properly configured (see section 6.0).

    Verify that UNIX domain socket connections work with certificate authentication:

    # Test local connection via UNIX domain socket with certificates

    cockroach sql --certs-dir=certs --host=/tmp --user=root

    root@localhost:26257/defaultdb>

    Test UNIX domain socket path configuration:

    # Check default socket location

    ls -la /tmp/.s.PGSQL.26257

    srwxrwxrwx 1 cockroach cockroach 0 [date] /tmp/.s.PGSQL.26257

    # Test connection with explicit socket directory

    cockroach sql --certs-dir=certs --host=/var/run/cockroach --user=root

    root@localhost:26257/defaultdb>

    Verify that insecure connections are rejected:

    # Attempt insecure connection via UNIX socket

    cockroach sql --insecure --host=/tmp --user=root

    ERROR: server is not running in insecure mode, must use certificates

    Verify socket file permissions and ownership:

    # Check socket file permissions

    ls -la /tmp/.s.PGSQL.*

    srwxrwxrwx 1 cockroach cockroach 0 [date] /tmp/.s.PGSQL.26257

    # Check socket directory permissions

    ls -ld /tmp

    drwxrwxrwt 10 root root 4096 [date] /tmp

    Test user-specific certificate authentication:

    # Test with user-specific certificates

    su - user1

    cockroach sql --certs-dir=/home/user1/certs --host=/tmp --user=user1

    user1@localhost:26257/defaultdb>'
  remediation: "Prerequisites: Complete certificate infrastructure setup as described in section 6.0.\n1. Configure UNIX Domain\
    \ Socket Location\n# Start CockroachDB with custom socket directory\ncockroach start \\\n --certs-dir=certs \\\n --store=node1\
    \ \\\n --listen-addr=localhost:26257 \\\n --socket-dir=/var/run/cockroach \\\n --http-addr=localhost:8080\n# Ensure socket\
    \ directory has appropriate permissions\nmkdir -p /var/run/cockroach\nchown cockroach:cockroach /var/run/cockroach\nchmod\
    \ 755 /var/run/cockroach\n2. Create Client Certificates for Local Users\n# Create database user\ncockroach sql --certs-dir=certs\
    \ --host=/tmp --execute=\"CREATE USER localuser;\"\n# Create client certificate for local user\ncockroach cert create-client\
    \ localuser --certs-dir=certs --ca-key=ca-key/ca.key\n# Create user-specific certificate directory\nmkdir -p /home/localuser/.cockroach-certs\n\
    cp certs/ca.crt /home/localuser/.cockroach-certs/\ncp certs/client.localuser.crt /home/localuser/.cockroach-certs/\ncp\
    \ certs/client.localuser.key /home/localuser/.cockroach-certs/\n# Set appropriate permissions\nchown -R localuser:localuser\
    \ /home/localuser/.cockroach-certs\nchmod 700 /home/localuser/.cockroach-certs\nchmod 600 /home/localuser/.cockroach-certs/client.localuser.key\n\
    chmod 644 /home/localuser/.cockroach-certs/*.crt\n3. Test Local Authentication\n# Test as root user\ncockroach sql --certs-dir=certs\
    \ --host=/tmp --user=root\n# Test as regular user\nsu - localuser\ncockroach sql --certs-dir=/home/localuser/.cockroach-certs\
    \ --host=/tmp --\nuser=localuser\n4. Security Hardening\n# Remove world permissions from socket if needed (depends on\
    \ use case)\n# Note: This may prevent legitimate access by other users\nchmod 660 /tmp/.s.PGSQL.26257\n# For production,\
    \ consider dedicated socket directory\nmkdir -p /var/lib/cockroach/sockets\nchown cockroach:cockroach /var/lib/cockroach/sockets\n\
    chmod 750 /var/lib/cockroach/sockets"
  checks:
  - type: command
    command: ls -la /tmp/.s.PGSQL.26257 && ls -la /tmp/.s.PGSQL.* && ls -ld /tmp
    expected: 'Verify that UNIX domain socket connections work with certificate authentication:'
    severity: medium
    info: 'Prerequisites: Ensure certificate infrastructure is properly configured (see section 6.0).

      Verify that UNIX domain socket connections work with certificate authentication:

      # Test local connection via UNIX domain socket with certificates

      cockroach sql --certs-dir=certs --host=/tmp --user=root

      root@localhost:26257/defaultdb>

      Test UNIX domain socket path configuration:

      # Check default socket location'
- id: '6.3'
  title: Ensure remote connections via TCP/IP sockets are configured correctly
  scoring: manual
  profile:
  - Level 1
  description: 'TCP/IP connections enable remote access to CockroachDB clusters across networks. CockroachDB supports multiple
    authentication methods for remote connections, with certificate-based authentication being the most secure option. All
    TCP/IP connections must use TLS encryption to protect data in transit. Remote connection security depends on proper network
    configuration, authentication method selection, and TLS settings. Certificate-based authentication is strongly recommended
    for production environments as it provides mutual TLS authentication and eliminates password-based attack vectors. Supported
    authentication methods for remote connections include: Certificate-based authentication: Uses client certificates signed
    by the cluster''s CA (recommended) Password authentication: Username and password over TLS GSSAPI/Kerberos: For enterprise
    environments with existing Kerberos infrastructure OIDC/JWT: For integration with identity providers'
  rationale: 'Secure remote connections are essential for: Distributed cluster administration Application connectivity from
    remote hosts Multi-tier architecture security Compliance with data protection requirements Prevention of network-based
    attacks'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/authentication.html
  - 2. https://www.cockroachlabs.com/docs/stable/connection-parameters.html
  page_start: 148
  audit_raw: 'Prerequisites: Ensure certificate infrastructure is properly configured (see section 6.0).

    Test certificate-based authentication for remote connections:

    # Test from remote host using certificates

    cockroach sql --certs-dir=certs --host=database-server:26257 --user=root

    root@database-server:26257/defaultdb>

    Verify TLS encryption is enforced:

    # Attempt insecure connection (should fail)

    cockroach sql --insecure --host=database-server:26257 --user=root

    ERROR: server is not running in insecure mode, must use certificates

    # Test secure connection

    cockroach sql --certs-dir=certs --host=database-server:26257 --user=root

    root@database-server:26257/defaultdb>

    Test password-based authentication over TLS:

    # First, set password for user (if using password auth)

    cockroach sql --certs-dir=certs --host=database-server:26257 --execute="ALTER USER

    appuser WITH PASSWORD ''secure_password'';"

    # Test password authentication from remote host

    cockroach sql --host=database-server:26257 --user=appuser

    Enter password:

    appuser@database-server:26257/defaultdb>

    Verify connection from multiple remote locations:

    # Test from application server

    cockroach sql --certs-dir=app-certs --host=db1.example.com:26257 --user=appuser

    # Test from backup server

    cockroach sql --certs-dir=backup-certs --host=db1.example.com:26257 --

    user=backupuser

    # Test from monitoring system

    cockroach sql --certs-dir=monitor-certs --host=db1.example.com:26257 --

    user=monitoruser

    Check TLS configuration and cipher suites:

    # Verify TLS version and cipher suites (requires openssl)

    echo | openssl s_client -connect database-server:26257 -tls1_2 2>/dev/null | grep

    -E "(Protocol|Cipher)"'
  remediation: "Prerequisites: Complete certificate infrastructure setup as described in section 6.0.\n1. Configure Server\
    \ for Remote Access\n# Start CockroachDB listening on appropriate network interfaces\ncockroach start \\\n --certs-dir=certs\
    \ \\\n --store=node1 \\\n --listen-addr=0.0.0.0:26257 \\\n --advertise-addr=database-server:26257 \\\n --http-addr=0.0.0.0:8080\
    \ \\\n --join=database-server:26257\n# For multi-node clusters, configure each node\ncockroach start \\\n --certs-dir=certs\
    \ \\\n --store=node2 \\\n --listen-addr=0.0.0.0:26257 \\\n --advertise-addr=db2.example.com:26257 \\\n --http-addr=0.0.0.0:8080\
    \ \\\n --join=db1.example.com:26257,db2.example.com:26257,db3.example.com:26257\n2. Create Remote Users and Certificates\n\
    -- Create users for remote access\nCREATE USER appuser;\nCREATE USER backupuser;\nCREATE USER monitoruser;\n-- For password-based\
    \ authentication, set passwords\nALTER USER appuser WITH PASSWORD 'strong_app_password';\nALTER USER monitoruser WITH\
    \ PASSWORD 'strong_monitor_password';\n-- Grant appropriate privileges\nGRANT ALL ON DATABASE myapp TO appuser;\nGRANT\
    \ SELECT ON DATABASE myapp TO monitoruser;\nGRANT ALL ON DATABASE *.* TO backupuser;\n3. Generate and Distribute Client\
    \ Certificates\n# Create client certificates for remote users\ncockroach cert create-client appuser --certs-dir=certs\
    \ --ca-key=ca-key/ca.key\ncockroach cert create-client backupuser --certs-dir=certs --ca-key=ca-key/ca.key\ncockroach\
    \ cert create-client monitoruser --certs-dir=certs --ca-key=ca-key/ca.key\n# Securely distribute certificates to remote\
    \ hosts\n# Application server\nscp certs/ca.crt certs/client.appuser.* appserver:/var/lib/cockroach/certs/\nssh appserver\
    \ \"chown -R app:app /var/lib/cockroach/certs && chmod 600\n/var/lib/cockroach/certs/client.appuser.key\"\n# Backup server\n\
    scp certs/ca.crt certs/client.backupuser.* backupserver:/opt/backup/certs/\nssh backupserver \"chown -R backup:backup\
    \ /opt/backup/certs && chmod 600\n/opt/backup/certs/client.backupuser.key\"\n# Monitoring server\nscp certs/ca.crt certs/client.monitoruser.*\
    \ monitor:/var/lib/monitoring/certs/\nssh monitor \"chown -R monitor:monitor /var/lib/monitoring/certs && chmod 600\n\
    /var/lib/monitoring/certs/client.monitoruser.key\"\n4. Network Security Configuration\n# Configure firewall to restrict\
    \ access (example with iptables)\n# Allow only specific hosts to connect to CockroachDB port\niptables -A INPUT -p tcp\
    \ --dport 26257 -s 10.0.1.100 -j ACCEPT # app server\niptables -A INPUT -p tcp --dport 26257 -s 10.0.1.200 -j ACCEPT #\
    \ backup server\niptables -A INPUT -p tcp --dport 26257 -s 10.0.1.300 -j ACCEPT # monitor server\niptables -A INPUT -p\
    \ tcp --dport 26257 -j DROP # deny all others\n# For cloud environments, use security groups or network policies\n# Example\
    \ AWS security group rule:\n# Port: 26257, Protocol: TCP, Source: sg-app-servers\n# Port: 26257, Protocol: TCP, Source:\
    \ sg-backup-servers\n5. Test Remote Connectivity\n# Test from application server\nssh appserver\ncockroach sql --certs-dir=/var/lib/cockroach/certs\
    \ --host=database-server:26257 --\nuser=appuser\n# Test from backup server\nssh backupserver\ncockroach sql --certs-dir=/opt/backup/certs\
    \ --host=database-server:26257 --\nuser=backupuser\n# Test connection pooling and load balancing\ncockroach sql --certs-dir=certs\
    \ --\nhost=db1.example.com:26257,db2.example.com:26257,db3.example.com:26257 --\nuser=appuser"
  checks:
  - type: manual_review
    info: 'Prerequisites: Ensure certificate infrastructure is properly configured (see section 6.0).

      Test certificate-based authentication for remote connections:

      # Test from remote host using certificates

      cockroach sql --certs-dir=certs --host=database-server:26257 --user=root

      root@database-server:26257/defaultdb>

      Verify TLS encryption is enforced:

      # Attempt insecure connection (should fail)

      cockroach sql --insecure --host=database-server:26257 --user=root

      ERROR: server is not running in insecure mode, m'
    severity: medium
- id: '6.4'
  title: Ensure Security Audit Logging Is Enabled
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB provides comprehensive audit logging capabilities to track securityrelevant events including user
    authentication, privilege changes, and access to sensitive data. Role-based audit logging allows administrators to configure
    which users, roles, or statements should be logged, while sensitive access logging can track access to specific tables
    or databases containing sensitive information. Audit logging is essential for compliance, security monitoring, incident
    response, and detecting unauthorized access or privilege escalation attempts. CockroachDB supports multiple logging channels
    including SESSIONS, USER_ADMIN, PRIVILEGES, and SENSITIVE_ACCESS that can be configured to capture different types of
    security events. The sql.log.user_audit cluster setting enables role-based audit logging, allowing administrators to specify
    which users or roles should have their SQL statements logged. Additionally, table-level audit logging can be enabled using
    EXPERIMENTAL_AUDIT to track all access (read and write) to sensitive tables.
  rationale: 'Security audit logging provides several critical functions: Accountability: Establishes a record of who performed
    what actions and when, supporting non-repudiation requirements Compliance: Many regulatory frameworks (PCI-DSS, HIPAA,
    SOX, GDPR) require audit trails for sensitive data access Threat Detection: Enables detection of suspicious patterns,
    unauthorized access attempts, or privilege escalation Incident Response: Provides forensic evidence for security incidents
    and data breaches Operational Monitoring: Helps identify misconfigurations, policy violations, or operational issues Without
    proper audit logging, organizations cannot effectively monitor database activity, detect security incidents, or demonstrate
    compliance with regulatory requirements. Logging should capture authentication events, privilege changes, and access to
    sensitive data as a minimum baseline for Level 1 security.'
  impact: ''
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/role-based-audit-logging.html
  - 2. https://www.cockroachlabs.com/docs/stable/sql-audit-logging.html
  page_start: 155
  audit_raw: "1. Verify role-based audit logging is configured:\nSHOW CLUSTER SETTING sql.log.user_audit;\nThe documented\
    \ syntax for sql.log.user_audit is table‑like text, where\neach line is:\nUSER_OR_ROLE STATEMENT_FILTER\nThis setting\
    \ must contain one or more audit rules in the documented table‑like syntax\n(user/role and statement filter).\nExpected\
    \ Results (conceptual):\nsql.log.user_audit is non‑empty and includes appropriate entries for\nprivileged users/roles\
    \ (for example, admin, root, or an equivalent privileged role),\nor a global rule (for example, ALL).\nExplicit entries\
    \ for privileged users/roles (for example, admin ALL , root\nALL, or other high‑privilege roles).\n2. Check logging channel\
    \ configuration:\nReview the logging configuration to ensure a file sink (for example, security) includes\nthe security‑relevant\
    \ channels and is marked auditable. A typical configuration is:\nsinks:\n file-groups:\n security:\n channels: [SESSIONS,\
    \ USER_ADMIN, PRIVILEGES, SENSITIVE_ACCESS]\n auditable: true\nThis writes combined output to a cockroach-security.log\
    \ file in the configured\nlogging directory and enforces non‑repudiable logging via auditable: true .\nExpected Results:\n\
    A sink exists that includes SESSIONS, USER_ADMIN, PRIVILEGES, and\nSENSITIVE_ACCESS, and auditable: true is set for that\
    \ sink.\nFail if:\nThese channels are not present in any sink, or\nNo security‑relevant sink is configured as auditable.\n\
    3. Verify security event logging is active:\nFor connection events, confirm the cluster setting is enabled:\nSHOW CLUSTER\
    \ SETTING server.auth_log.sql_connections.enabled;\nExpected Results:\nserver.auth_log.sql_connections.enabled is true,\
    \ and\nThe SESSIONS channel is included in an active sink.\nFail if:\nserver.auth_log.sql_connections.enabled is false\
    \ or\nSESSIONS is not routed to any sink.\n4. Test audit log generation:\nAs a privileged user covered by sql.log.user_audit,\
    \ execute a simple statement\n(for example, a SELECT or CREATE USER ) and verify that an audit event is written to\nthe\
    \ configured sink (for example, cockroach-security.log).\nExpected Results:\nThe test statement appears in the audit logs\
    \ with timestamp, user, and statement\ntext.\nFail if:\nNo corresponding audit entry is observed in the configured logs."
  remediation: "1. Enable role-based SQL audit logging::\nEnable role-based SQL audit logging\nConfigure sql.log.user_audit\
    \ with appropriate rules. The setting uses a table‑like\nsyntax where each row specifies a user/role and a statement filter\
    \ (ALL or NONE).\nExample - audit all statements for all users:\n-- Example - audit all statements for all users:\nSET\
    \ CLUSTER SETTING sql.log.user_audit = 'ALL ALL';;\n-- Example - audit all statements for specific roles (one per line):\n\
    SET CLUSTER SETTING sql.log.user_audit = '\nadmin ALL\nroot ALL\n';\n(Adjust syntax to match your CockroachDB version's\
    \ documented examples.)\n2. Configure security logging channels in an auditable sink:\nEnsure your logging configuration\
    \ includes a security file group with the recommended\nchannels and auditable: true:\nsinks:\n file-groups:\n security:\n\
    \ channels: [SESSIONS, USER_ADMIN, PRIVILEGES, SENSITIVE_ACCESS]\n auditable: true\nApply the configuration according\
    \ to your deployment method (for example, via logconfig at node start or the appropriate cluster setting, depending on\
    \ version).\n3. Enable connection/authentication logging:\nTurn on SQL client connection logging to the SESSIONS channel:\n\
    SET CLUSTER SETTING server.auth_log.sql_connections.enabled = true;\n4. (Optional) Optimize audit evaluation performance:\n\
    If you use complex sql.log.user_audit configurations, consider enabling reduced‑config\nevaluation to compute the audit\
    \ configuration once per session:\nSET CLUSTER SETTING sql.log.user_audit.reduced_config.enabled = true;"
  checks:
  - type: sql
    command: SHOW CLUSTER SETTING sql.log.user_audit;
    severity: medium
    info: '1. Verify role-based audit logging is configured:

      SHOW CLUSTER SETTING sql.log.user_audit;

      The documented syntax for sql.log.user_audit is table‑like text, where

      each line is:

      USER_OR_ROLE STATEMENT_FILTER

      This setting must contain one or more audit rules in the documented table‑like syntax

      (user/role and statement filter).

      Expected Results (conceptual):

      sql.log.user_audit is non‑empty and include'
- id: '6.5'
  title: Ensure OCSP Certificate Revocation Checking Is Enabled
  scoring: manual
  profile:
  - Level 1
  description: 'Online Certificate Status Protocol (OCSP) is a mechanism for checking whether a certificate has been revoked
    by its Certificate Authority (CA) before it expires. CockroachDB supports OCSP checking through the security.ocsp.mode
    cluster setting, which can be configured to verify certificate revocation status when validating client and node certificates.
    When enabled, CockroachDB will query the OCSP responder specified in the certificate (or a configured OCSP server) to
    verify that certificates have not been revoked. This provides defense-in-depth for certificate-based authentication by
    ensuring that compromised or revoked certificates cannot be used to authenticate to the cluster, even if they are still
    within their validity period. OCSP checking is particularly important in environments where certificates may need to be
    revoked before expiration due to: Compromised private keys Certificate misuse or unauthorized access Organizational policy
    changes Employee termination or role changes'
  rationale: 'Certificate revocation checking addresses a critical gap in certificate-based authentication: a certificate
    that is valid (not expired) but has been revoked should not be accepted for authentication. Without OCSP checking, a compromised
    certificate could continue to be used until it naturally expires, which could be months or years. Key security benefits
    of OCSP checking include: Revocation Detection: Immediately detects and rejects certificates that have been revoked by
    the CA Compromise Response: Enables rapid response to certificate compromises by revoking affected certificates Compliance:
    Meets requirements for certificate validation in regulated environments Defense-in-Depth: Adds an additional layer of
    security beyond basic certificate validation The security.ocsp.mode setting supports three modes: off: OCSP checking is
    disabled (default) lax: OCSP checking is performed, but certificate validation succeeds even if OCSP check fails (e.g.,
    OCSP server unavailable) strict: OCSP checking is required, and certificate validation fails if OCSP check fails or cannot
    be performed For production environments, strict mode is recommended to ensure that revoked certificates are always rejected,
    though lax mode may be appropriate in environments where OCSP server availability cannot be guaranteed.'
  impact: ''
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/cluster-settings.html
  - 2. https://www.cockroachlabs.com/docs/stable/security-best-practices.html
  page_start: 160
  audit_raw: "1. Verify OCSP mode is configured:\nSHOW CLUSTER SETTING security.ocsp.mode;\nExpected Results:\nShould be set\
    \ to strict or lax (not off)\nstrict is recommended for production environments with reliable OCSP server\navailability\n\
    lax may be acceptable if OCSP server availability cannot be guaranteed\nFail if:\nThe setting is off (disabled)\nThe setting\
    \ is not configured (defaults to off)\n2. Verify OCSP server configuration (if applicable):\nCheck if OCSP servers are\
    \ configured for certificate validation:\n-- Check cluster settings related to OCSP\nSHOW CLUSTER SETTING security.ocsp.timeout;\n\
    Expected Results:\nOCSP timeout settings should be configured appropriately if OCSP is enabled\nTimeout should be reasonable\
    \ (e.g., 3s to 10s) to avoid blocking certificate\nvalidation\nNote: Some OCSP configuration may be specified in certificates\
    \ themselves (OCSP\nresponder URLs) rather than cluster settings.\n3. Test OCSP checking behavior:\nTo verify OCSP checking\
    \ is working:\n# Check certificate for OCSP responder URL\nopenssl x509 -in certs/client.crt -noout -ocsp_uri\n# Test\
    \ OCSP query (if OCSP responder is accessible)\nopenssl ocsp -issuer certs/ca.crt -cert certs/client.crt \\\n -url $(openssl\
    \ x509 -in certs/client.crt -noout -ocsp_uri)\nExpected Results:\nCertificates should include OCSP responder URLs (if\
    \ OCSP is to be used)\nOCSP queries should return valid responses when certificates are not revoked\n4. Review certificate\
    \ validation logs:\nCheck logs for OCSP-related messages:\n# Check for OCSP validation in logs\ngrep -i \"ocsp\" /var/lib/cockroach/logs/cockroach.log\
    \ | tail -20\nExpected Results:\nLogs should show OCSP checking activity when certificates are validated\nNo errors indicating\
    \ OCSP server unavailability (if in strict mode)"
  remediation: "1. Enable OCSP checking:\nConfigure OCSP mode based on organizational requirements:\n-- For production with\
    \ reliable OCSP server: use strict mode\nSET CLUSTER SETTING security.ocsp.mode = 'strict';\n-- For environments where\
    \ OCSP server availability cannot be guaranteed: use lax\nmode\nSET CLUSTER SETTING security.ocsp.mode = 'lax';\nMode\
    \ Selection:\nstrict: Recommended for production. Certificates will be rejected if OCSP\ncheck fails or cannot be performed.\
    \ Requires reliable OCSP server availability.\nlax: Use when OCSP server availability cannot be guaranteed. Certificates\
    \ are\nvalidated even if OCSP check fails, but revoked certificates are still rejected\nwhen OCSP check succeeds.\n2.\
    \ Configure OCSP cache and timeout (if needed):\nOptimize OCSP performance and reliability:\n-- Configure OCSP query timeout\
    \ (default: 3s)\nSET CLUSTER SETTING security.ocsp.timeout = '5s';\nRecommended Values:\nTimeout: 3s to 10s (prevent blocking\
    \ certificate validation)\n3. Ensure certificates include OCSP responder URLs:\nWhen generating certificates, ensure they\
    \ include OCSP responder information:\n## When creating certificates, include OCSP responder URL in certificate\nextensions\n\
    # This is typically handled by the CA or certificate generation tool\ncockroach cert create-client \\\n client_name \\\
    \n --certs-dir=certs \\\n --ca-key=ca-key/ca.key \\\n --ocsp-url=https://ocsp.example.com\n4. Certificate Validation\n\
    # Verify certificate chain\nopenssl verify -CAfile certs/ca.crt certs/node.crt\n# Check certificate expiration dates\n\
    for cert in certs/*.crt; do\n echo \"Certificate: $cert\"\n openssl x509 -in \"$cert\" -noout -dates\n echo\ndone\nNote:\
    \ OCSP responder URLs can be specified in certificates or configured separately\ndepending on the certificate generation\
    \ method used.\n5. Verify OCSP server availability:\nEnsure OCSP responder is accessible and functioning:\n# Test OCSP\
    \ responder accessibility\ncurl -I https://ocsp.example.com\n# Test OCSP query\nopenssl ocsp -issuer certs/ca.crt -cert\
    \ certs/client.crt \\\n -url https://ocsp.example.com\n6. Monitor OCSP checking:\nAfter enabling OCSP, monitor for:\n\
    OCSP query failures or timeouts\nCertificate validation failures due to OCSP issues\nPerformance impact from OCSP checking\n\
    -- Monitor certificate validation (may require log analysis)\n-- Check for OCSP-related errors in logs\n7. Document OCSP\
    \ configuration:\nMaintain documentation of:\nOCSP mode selection and rationale\nOCSP server locations and availability\
    \ requirements\nCache and timeout settings\nProcedures for certificate revocation\nMonitoring and alerting for OCSP failures"
  checks:
  - type: command
    command: grep -i "ocsp" /var/lib/cockroach/logs/cockroach.log | tail -20
    expected: OCSP queries should return valid responses when certificates are not revoked
    severity: medium
    info: '1. Verify OCSP mode is configured:

      SHOW CLUSTER SETTING security.ocsp.mode;

      Expected Results:

      Should be set to strict or lax (not off)

      strict is recommended for production environments with reliable OCSP server

      availability

      lax may be acceptable if OCSP server availability cannot be guaranteed

      Fail if:

      The setting is off (disabled)

      The setting is not configured (defaults to off)

      2. Verify OCSP ser'
- id: '6.6'
  title: Ensure SQL Session Idle Timeouts Are Configured for SQL Roles
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB allows administrators to define role-level SQL session idle timeouts using the idle_in_session_timeout
    session variable. This setting ensures that any session authenticated under a given SQL role is automatically terminated
    after a defined period of inactivity. Configuring idle session timeouts for SQL roles provides a more granular control
    model than cluster-wide settings. It ensures that different classes of users—such as read-only roles, application service
    accounts, or privileged administrators—are governed by timeout values that reflect their risk level and organizational
    policy. This control is particularly important for organizations subject to compliance frameworks that mandate automatic
    termination of inactive sessions (e.g., SOC 2, NIST 800-53 AC-12, PCI DSS 8.2.8). Using per-role idle session timeouts
    helps enforce consistent and auditable policy compliance.
  rationale: 'Without enforced role-level idle timeout settings, SQL sessions may remain active indefinitely, creating several
    risks: Security Risks Abandoned Session Exposure: Idle but authenticated sessions can be abused if an attacker gains access
    to the client environment or connection path. Privilege Abuse: Privileged roles without idle timeouts increase the likelihood
    of misuse or lateral movement. Session Hijacking: Long-lived sessions expand the window of opportunity for an attacker
    to intercept and reuse session credentials. Compliance Risks Many standards require automatic termination of inactive
    sessions. For example: SOC 2 (CC6.x): Requires controls on session management. NIST 800-53 AC-12: Requires automatic session
    termination after inactivity. PCI DSS 8.2.8: Requires session timeouts of 15 minutes or less unless justified. Failure
    to configure role-specific idle timeouts may lead to audit findings and noncompliance. Operational Benefits Reduces buildup
    of idle or abandoned sessions Provides predictable resource usage Enforces security baselines consistently across user
    groups'
  impact: ''
  references:
  - 1. https://www.cockroachlabs.com/docs/v25.4/cluster-settings
  - 2. https://www.cockroachlabs.com/docs/v25.4/security-reference/authorization
  page_start: 167
  audit_raw: '1. Identify the SQL role and view its idle session timeout

    configuration:

    Identify the SQL role and view its idle session timeout configuration

    SHOW DEFAULT SESSION VARIABLES FOR ROLE <role_name>;

    (Note: This statement only returns session variables that have been explicitly changed

    from their defaults. If no variables have been changed for the role, it will return no

    results.)

    Expected Results:

    idle_in_session_timeout explicitly appears in the results table.

    The value is non-zero and aligned with organizational policy (e.g., 15m, 30m,

    1h).

    Fail if:

    The statement returns no results (meaning idle_in_session_timeout is

    unset/default).

    The timeout is explicitly set to 0 (disabled).

    The timeout exceeds the organization''s session inactivity limits without a

    documented business justification.'
  remediation: '1. Set idle timeout for a SQL role:

    Set a reasonable timeout for idle connections:

    ALTER ROLE <role_name>

    SET idle_in_session_timeout = ''<duration>'';

    -- Example - set 30-minute idle timeout for a read-only role:

    ALTER ROLE table_reader

    SET idle_in_session_timeout = ''30m'';

    Recommended Values

    High-security environments: 10m-15m

    Standard enterprise roles: 15m-30m

    Administrative roles: 15m-30m (stricter values recommended)

    Application roles: 30m-1h (with documented justification)

    Values should reflect:

    Organizational security policies

    Compliance requirements

    Justified business or application needs

    2. Verify timeout configuration after applying settings:

    SHOW DEFAULT SESSION VARIABLES FOR ROLE <role_name>;

    Expected Results:

    idle_in_session_timeout reflects the newly configured value.

    Note on Session Variable Precedence: idle_in_session_timeout will use the

    newly configured default, but CockroachDB applies session variables according to a

    precedence hierarchy. Even if you set idle_in_session_timeout globally (for

    example with ALTER ROLE ALL SET idle_in_session_timeout = {value} or at

    a role level), a user can:

    Override it in their current session with SET idle_in_session_timeout =

    {value},

    and

    Have it overridden by a more specific ALTER ROLE {role_name} IN DATABASE

    {db_name} SET idle_in_session_timeout = {value} setting, which takes

    precedence over broader role- or cluster-level defaults.

    3. Document configuration:

    Maintain documentation that includes:

    Assigned timeout values per role

    Rationale supporting each timeout (e.g., compliance mapping)

    Exceptions or deviations

    Review process and periodic re-validation'
  checks:
  - type: sql
    command: SHOW DEFAULT SESSION VARIABLES FOR ROLE <role_name>;
    severity: medium
    info: '1. Identify the SQL role and view its idle session timeout

      configuration:

      Identify the SQL role and view its idle session timeout configuration

      SHOW DEFAULT SESSION VARIABLES FOR ROLE <role_name>;

      (Note: This statement only returns session variables that have been explicitly changed

      from their defaults. If no variables have been changed for the role, it will return no

      results.)

      Expected Results:

      i'
