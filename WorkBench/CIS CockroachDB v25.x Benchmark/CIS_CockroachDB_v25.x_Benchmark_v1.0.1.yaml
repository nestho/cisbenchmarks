- id: '2.5'
  title: Disable Linux Memory Swapping to Prevent Performance and Stability Issues
  scoring: manual
  profile:
  - Level 1
  description: 'For production CockroachDB deployments on Linux VMs or bare-metal, it is a critical requirement to disable
    Linux memory swapping or ensure the system has adequate RAM to prevent swap usage. Swapping database memory pages to slow
    disk I/O introduces severe and unpredictable latency, compromising the database''s performance and stability. The core
    strategy is to: Provision sufficient physical RAM (minimum 4 GiB RAM per vCPU in production). Configure CockroachDB''s
    memory limits (--cache and --max-sql-memory) conservatively to prevent the process from exceeding available RAM.'
  rationale: 'Memory swapping introduces unpredictable I/O latency when data is paged to disk. In CockroachDB, this can lead
    to: Increased transaction latency or timeouts. Node unresponsiveness or crash loops under memory contention. Delayed Raft
    consensus and loss of quorum availability. Disabling swap guarantees that memory access is always from physical RAM, ensuring
    consistent performance and preventing severe performance regressions during heavy load. This aligns with Cockroach Labs''
    production guidance and CIS system hardening principles for high-performance database systems.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-premises
  page_start: 68
  audit_raw: '1. Perform the following commands on each CockroachDB node to

    verify that swap is disabled:

    # 1. Check current swap status

    sudo swapon --show

    # 2. Confirm kernel swap configuration

    cat /proc/swaps

    Expected Results:

    swapon --show and /proc/swaps produce no output, indicating no active swap

    devices.

    2. Verify Physical RAM Sizing vs. vCPU:

    Compare the node''s RAM to Cockroach Labs'' minimum production recommendation:

    At least 4 GiB RAM per vCPU for production nodes.

    2 GiB per vCPU is only acceptable for testing, not production.

    3. Check CockroachDB Memory Configuration

    Inspect the node''s startup configuration (e.g., the systemd service file) for the memory

    allocation flags.

    Formula Check: The total estimated maximum memory usage for the CockroachDB

    process should not exceed 80% of system RAM.

    (2 × --max-sql-memory) + --cache <= 80% of system RAM

    --cache (Pebble block cache): Should be set to 25% or higher of system RAM.

    --max-sql-memory (SQL temporary data): Should be set to ensure the total

    formula is met.

    If the calculated memory usage exceeds 80% of RAM, or if --cache is below 25% of

    RAM, it is a finding.'
  remediation: '1. Ensure Adequate RAM and Tune Limits:

    Provisioning: Upgrade hardware or VM resources to meet the 4 GiB RAM per

    vCPU requirement.

    Tuning: Adjust the --cache and --max-sql-memory flags in the cockroach start

    command to adhere to the 80% safety margin.

    Example: On a 16 GiB RAM VM, the limit is 16 GiB * 0.8 = 12.8 GiB.

    Set --cache=0.25 (4 GiB)

    Set --max-sql-memory=0.25 (4 GiB)

    Total check: (2* 4 GiB) + 4 GiB = 12 GiB. This is safely below 12.8 GiB.

    2. Disable Swap Permanently:

    Apply the standard Linux hardening procedure to disable swap on the host:

    Temporarily Disable Swap: Use the swapoff command to immediately disable

    all active swap devices:

    sudo swapoff -a

    Permanently Disable Swap: Edit the /etc/fstab file and comment out or

    remove the line corresponding to the swap partition or swap file. This prevents

    the OS from activating swap on reboot.

    # Open /etc/fstab in a text editor (e.g., nano or vi)

    sudo nano /etc/fstab

    # Locate and comment out the swap entry (add a ''#'' at the start)

    # /dev/mapper/centos-swap swap swap defaults 0 0 <-- This line should be

    commented

    Reboot the host to confirm the changes are persistent, then re-run the audit step

    (sudo swapon --show ).'
  checks:
  - type: command
    command: cat /proc/swaps
    expected: 'verify that swap is disabled:'
    severity: medium
    info: '1. Perform the following commands on each CockroachDB node to

