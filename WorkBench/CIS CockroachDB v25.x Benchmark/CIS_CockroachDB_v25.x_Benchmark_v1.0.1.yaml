controls:
- id: '1.1'
  title: Obtain the binary from an official and trusted source and verify the SHA-256 sum after downloading.
  scoring: manual
  profile:
  - Level 1
  description: 'CockroachDB server binaries and supporting tools must be obtained only from official Cockroach Labs release
    sources and verified using the published SHA‑256 checksum before installation. The canonical sources for CockroachDB self‑hosted
    binaries are: The CockroachDB Releases pages, which link to official versioned binaries. https://binaries.cockroachdb.com/(binary
    distribution site), which hosts release artifacts such as full binaries and associated checksum files. For FIPS‑ready
    runtimes, Cockroach Labs publishes per‑version download links and corresponding SHA‑256 checksum files (e.g., cockroach-v25.4.0.linux-amd64fips.tgz
    and cockroach-v25.4.0.linux-amd64-fips.tgz.sha256sum) on the official documentation site and serves them from binaries.cockroachdb.com.
    Administrators must verify that the locally computed SHA‑256 checksum of any downloaded CockroachDB binary matches the
    corresponding checksum value published by Cockroach Labs before using it for installation or upgrade.'
  rationale: 'Obtaining CockroachDB binaries exclusively from official Cockroach Labs distribution endpoints and verifying
    them against the published SHA‑256 checksums helps ensure: Integrity - The downloaded binary has not been corrupted or
    altered in transit. Authenticity - The binary corresponds to an official Cockroach Labs release and is traceable to a
    documented version. Consistency - All CockroachDB nodes and environments run binaries that match known, documented release
    builds. Relying on unofficial sources or skipping checksum verification increases the risk of: Malicious or trojanized
    CockroachDB binaries. Outdated builds with known vulnerabilities. Inconsistent behavior between environments due to untracked
    or modified binaries.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/releases/
  - 2. https://binaries.cockroachdb.com/
  page_start: 16
  audit_raw: "1. Inspect package pipelines / automation\nReview CI/CD pipelines, configuration‑management code, and installation\
    \ scripts that\nfetch CockroachDB binaries.\nConfirm they download CockroachDB artifacts only from:\nhttps://binaries.cockroachdb.com/,\
    \ or\nAn internal mirror that itself synchronizes exclusively from Cockroach Labs\nofficial distribution.\nInspect your\
    \ package pipelines to ensure they only pull from binaries.cockroachdb.com.\n2. Verify checksum for a downloaded artifact\n\
    On an administrator workstation or build node:\n#Example: Linux ARM64; adjust FILE_NAME/VERSION as needed\nVERSION=\"\
    v25.3.4\"\nFILE_NAME=\"cockroach-${VERSION}.linux-arm64.tgz\" # for Linux x86_64 use\n\"cockroach-${VERSION}.linux-amd64.tgz\"\
    \nFILE_URL=\"https://binaries.cockroachdb.com/${FILE_NAME}\"\nSHA_URL=\"${FILE_URL}.sha256sum\"\n# Ensure file exists\
    \ locally (or download it)\nif [ ! -f \"$FILE_NAME\" ]; then\n echo \"Missing $FILE_NAME. Download it from official source\
    \ first: $FILE_URL\"\n exit 1\nfi\n# Verify SHA-256 checksum against Cockroach Labs-published value\nif [ \"$(wget -qO-\
    \ \"$SHA_URL\" | awk '{print $1}')\" == \"$(sha256sum \"$FILE_NAME\" |\nawk '{print $1}')\" ]; then\n echo \"OK: SHA-256\
    \ matches Cockroach Labs' published checksum.\"\nelse\n echo \"FAIL: SHA-256 mismatch. File may be corrupted or tampered.\"\
    \n exit 2\nfi\nIf the checksum does not match the published SHA-256 from Cockroach Labs, this is a\nfinding.\nExpected\
    \ Results:\nAll automation and manual procedures that obtain CockroachDB binaries:\nPull artifacts from https://binaries.cockroachdb.com/\
    \ or from an\ninternal mirror that itself only syncs from Cockroach Labs official sources.\nFor each CockroachDB binary\
    \ used in production or non‑production\nenvironments:\nThe SHA‑256 checksum is verified against the corresponding Cockroach\n\
    Labs-published .sha256sum before installation or upgrade.\nAny mismatch between the computed checksum and the published\
    \ checksum is\ntreated as a security finding, and the affected artifact is not used."
  remediation: '1. Reconfigure package pipelines

    Update all package managers, automation scripts, and manual runbooks to download

    CockroachDB binaries and tools only from:

    https://binaries.cockroachdb.com/,

    or

    A vetted internal mirror that pulls from this official source.

    2. Download CockroachDB from official source and verify checksum

    #Example: Linux ARM64; Adjust VERSION as needed

    VERSION="v25.3.4"

    wget "https://binaries.cockroachdb.com/cockroach-${VERSION}.linux-amd64.tgz" # for

    Linux x86_64 use "https://binaries.cockroachdb.com/cockroach-${VERSION}.linuxamd64.tgz"

    wget "https://binaries.cockroachdb.com/cockroach-${VERSION}.linuxamd64.tgz.sha256sum" # for Linux x86_64 use

    "https://binaries.cockroachdb.com/cockroach-${VERSION}.linux-amd64.tgz.sha256sum"

    # Verify checksum

    sha256sum "cockroach-${VERSION}.linux-amd64.tgz"

    cat "cockroach-${VERSION}.linux-amd64.tgz.sha256sum"'
  checks:
  - type: manual_review
    info: '1. Inspect package pipelines / automation

      Review CI/CD pipelines, configuration‑management code, and installation scripts that

      fetch CockroachDB binaries.

      Confirm they download CockroachDB artifacts only from:

      https://binaries.cockroachdb.com/, or

      An internal mirror that itself synchronizes exclusively from Cockroach Labs

      official distribution.

      Inspect your package pipelines to ensure they only pull from binaries.cockroachdb.com.

      2. Verify checksum for a downloaded artifact

      On an administrator w'
    severity: medium
- id: '1.2'
  title: Ensure CockroachDB systemd Service Files Are Enabled
  scoring: manual
  profile:
  - Level 1
  description: Confirm, and correct if necessary, that the CockroachDB systemd service is enabled on Linux-based systems.
    This ensures CockroachDB starts automatically at system boot, recovers gracefully from crashes, and is consistently managed
    under a dedicated non-root service account.
  rationale: 'Running CockroachDB as a foreground/background process without a service manager increases the risk of: Nodes
    not starting after system reboot or crash. Inconsistent privilege separation (e.g., accidentally running as root). Logs
    not being integrated into the system audit/logging pipeline. By enabling CockroachDB as a systemd service: The service
    is automatically started at boot and restarted on failure. CockroachDB runs as a dedicated non-root account (cockroach),
    enforcing least privilege. Service lifecycle is auditable via systemctl.'
  impact: N/A
  references:
  - 1. https://man7.org/linux/man-pages/man1/systemctl.1.html
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-aws?
  page_start: 20
  audit_raw: 'Run the following to confirm that CockroachDB is registered as a systemd service and

    enabled:

    ## Identify CockroachDB service unit if it exists

    systemctl list-unit-files | grep cockroach | awk ''{print $1}''

    # Check if the service is enabled at boot

    systemctl is-enabled cockroach.service

    (or as identified from previous command)

    # Confirm it is active and running

    systemctl status cockroach.service

    # Verify it runs under the dedicated ''cockroach'' user

    ps -u cockroach -f | grep cockroach

    Expected Results:

    A CockroachDB service unit (for example, cockroach.service or

    securecockroachdb.service) exists under systemd.

    The unit is enabled and active (running).

    The CockroachDB process runs as the cockroach user (non‑root).

    If the service is absent, disabled, not running, or running as root, this is a finding.'
  remediation: 'For each initial node of your cluster, complete the following steps:

    1. Create the Cockroach directory:

    mkdir /var/lib/cockroach

    2. Create a Unix user named cockroach:

    useradd cockroach

    3. Move the certs directory to the cockroach directory:

    mv certs /var/lib/cockroach/

    4. Change the ownership of the cockroach directory to the user

    cockroach:

    chown -R cockroach /var/lib/cockroach

    5. Download the sample configuration template and save the file in

    the /etc/systemd/system/ directory:

    curl -o cockroach.service

    https://raw.githubusercontent.com/cockroachdb/docs/main/src/current/_includes/v25.

    4/prod-deployment/securecockroachdb.service

    OR

    [Unit]

    Description=Cockroach Database cluster node

    Requires=network.target

    [Service]

    Type=notify

    WorkingDirectory=/var/lib/cockroach

    ExecStart=/usr/local/bin/cockroach start --certs-dir=certs --advertise-addr=<nodeaddress> --listen-addr=<node-address>:26357

    --sql-adr=<node-address>:26257 --http-addr=<node-address>:8080 --join=<node1

    address>,<node2 address>,<node3 address> --cache=.25 --max-sql-memory=.25

    ExecStop=/usr/local/bin/cockroach node drain --self --certs-dir=certs

    TimeoutStopSec=300

    Restart=always

    RestartSec=10

    StandardOutput=syslog

    StandardError=syslog

    SyslogIdentifier=cockroach

    User=cockroach

    [Install]

    WantedBy=default.target

    Save the file in the /etc/systemd/system/directory.

    6. Customize the sample configuration template for your deployment:

    Specify values for the following flags in the sample configuration template:

    --advertise-addr:

    Specifies the IP address/hostname and port to tell other nodes to use. The

    port number can be omitted, in which case it defaults to 26257.

    This value must route to an IP address the node is listening on (with --

    listen-addr unspecified, the node listens on all IP addresses).

    In some networking scenarios, you may need to use --advertise-addr

    and/or --listen-addr differently.

    For enhanced security, it is a best practice to separate the listen address for internode communication from the listen
    address used for client SQL connections.

    --join :

    Identifies the address of 3-5 of the initial nodes of the cluster. These addresses

    should match the addresses that the target nodes are advertising..

    Optionally include --locality :

    if using multi‑region/latency‑aware features.

    7. Reload systemd and enable the service:

    systemctl daemon-reload

    systemctl enable cockroach.service

    systemctl start cockroach.service

    Repeat these steps for each additional node that you want in your

    cluster.

    Note: systemd handles node restarts in case of node failure. To stop a node without

    systemd restarting it, run :

    systemctl stop cockroach.service'
  checks:
  - type: command
    command: systemctl list-unit-files | grep cockroach | awk '{print $1}' && systemctl is-enabled cockroach.service && systemctl
      status cockroach.service && ps -u cockroach -f | grep cockroach
    expected: ''
    severity: medium
    info: 'Run the following to confirm that CockroachDB is registered as a systemd service and

      enabled:

      ## Identify CockroachDB service unit if it exists

      systemctl list-unit-files | grep cockroach | awk ''{print $1}''

      # Check if the service is enabled at boot

      systemctl is-enabled cockroach.service

      (or as identified from previous command)

      # Confirm it is active and running

      systemctl status cockroach.service

      # '
- id: '1.3'
  title: Ensure CockroachDB Cluster is Initialized Securely with TLS
  scoring: manual
  profile:
  - Level 1
  description: 'CockroachDB clusters must be initialized and operated in secure mode so that all internode and client-node
    communication uses TLS with certificates signed by a trusted CA. CockroachDB''s production documentation strongly recommends
    running secure clusters (with --certs-dir and valid certificates) instead of using --insecure, which disables all encryption
    and authentication. Nodes must: Start with valid TLS certificates in a --certs-dir directory: ca.crt, node.crt, node.key.
    Use mutual TLS between nodes and TLS between clients and nodes. Avoid --insecure in all production deployments. The controls
    in this section establish the baseline secure configuration for CockroachDB using TLS-encrypted TCP/IP communication.
    Additional hardening options, such as using UNIX domain sockets for local connections, may be introduced in later controls.
    These options do not replace or invalidate the secure configuration defined here, instead they provide complementary,
    defense-indepth enhancements where applicable.'
  rationale: 'Initializing the cluster securely ensures: TLS is required by default for CockroachDB communication. A node
    certificate (TLS 1.3) is required on each node, with hostnames/IPs in CN/SAN and signed by a trusted CA. Clients and nodes
    authenticate via certificates or passwords, but node identity is always enforced via TLS certificates in secure mode.
    The --insecure flag disables all encryption and authentication. This configuration is strictly intended for non-production
    testing environments and must never be used in a production deployment. Secure initialization ensures: Encryption in transit
    for all internode and client-node traffic. Authenticated membership: only nodes with valid, CA-signed node.crt can join.
    Strong access control via cryptographic identities for nodes and (optionally) clients.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/secure-a-cluster.html
  - 2. https://www.cockroachlabs.com/docs/stable/cockroach-start
  page_start: 25
  audit_raw: "1. Confirm the cluster is not running with --insecure\nRun the following command on any node:\nps -ef | grep\
    \ cockroach\nExpected Results:\nIf --insecure appears, the node is definitely operating insecurely.\nIf --accept-sql-without-tls\
    \ appears,\nTLS encryption is still used for all traffic.\nSQL clients may connect with sslmode=off/cockroach sql --insecure,\n\
    skipping TLS authentication but not encryption\n2. Verify presence and ownership of certificate directory\nExamples generally\
    \ use a certs directory under a CockroachDB data directory (e.g.,\n/var/lib/cockroach/certs), owned by the cockroach user.\n\
    ls -ld /var/lib/cockroach/certs\nls -l /var/lib/cockroach/certs\nExpected Results:\nDirectory is owned by a dedicated\
    \ CockroachDB account (e.g.,\ncockroach:cockroach).\nContains at least: ca.crt, node.crt, node.key. For client certs on\
    \ that host,\nclient.<user>.crt and client.<user>.key (e.g., client.root.*).\n3. Validate node certificate against the\
    \ CA\nUse OpenSSL to verify that node.crt is signed by the cluster CA:\nopenssl verify -CAfile /var/lib/cockroach/certs/ca.crt\n\
    /var/lib/cockroach/certs/node.crt\nExpected Results:\n/var/lib/cockroach/certs/node.crt: OK\nOutput shows the node certificate\
    \ as OK.\nThis aligns with the requirement that node.crt must be signed by ca.crt.\n4. Confirm cluster identity and secure\
    \ connectivity:\nUse the secure CLI to query node status:\ncockroach node status --certs-dir=/var/lib/cockroach/certs\
    \ --host=<node-host>\nIf you connect this way to each node (or to different addresses that might represent\ndifferent\
    \ clusters), you can compare the Cluster ID line in the welcome message. All\nnodes that belong to the same cluster must\
    \ report the same cluster\nExpected Results:\nCommand succeeds using certificates (no --insecure).\nAll nodes you query\
    \ report the same Cluster ID and nodes are available. The\ndocs note that nodes in the same cluster share a cluster ID;\
    \ CLI usage with --\ncerts-dir is the standard secure pattern.\ncockroach sql \\\n --certs-dir=/var/lib/cockroach/certs\
    \ \\\n --host=<node-host> \\\n -e \"SHOW DATABASES;\"\nA successful connection without --insecure confirms secure SQL\
    \ connectivity."
  remediation: "1. Generate the cluster Certificate Authority (CA):\nThe documentation suggests creating two directories on\
    \ your local machine: certs (for\npublic files) and my-safe-directory (for the private CA key).\nOn a secure workstation:\n\
    # Create directories for certificates\n# `certs` : You'll generate your CA certificate and all node and client\ncertificates\
    \ and keys in this directory.\n# `my-safe-directory` : You'll generate your CA key in this directory and then\nreference\
    \ the key when generating node and client certificates.\nmkdir certs my-safe-directory\n# Generate the cluster Certificate\
    \ Authority (CA)\ncockroach cert create-ca \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\n2. Generate\
    \ node certificates for each node (Repeat this block for\neach node):\nFor each node, issue a multi-purpose node.crt with\
    \ all relevant addresses and DNS\nnames (node IPs/hostnames, load-balancer addresses, localhost).\nExample:\n# NOTE: Replace\
    \ <node-ip>, <node-hostname>, and <load-balancer> addresses.\ncockroach cert create-node \\\n <node-internal-ip> \\\n\
    \ <node-external-ip> \\\n <node-hostname> \\\n localhost \\\n 127.0.0.1 \\\n <load-balancer-ip> \\\n <load-balancer-hostname>\
    \ \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\nAfter uploading each node's cert/key, remove or overwrite\
    \ node.crt/node.key\nlocally before generating the next node's pair, as recommended.\n3. Generate client certificate for\
    \ the root user:\ncockroach cert create-client \\\n root \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\n\
    This creates client.root.crt and client.root.key, used for secure\nadministrative access.\n4. Distribute and Secure Certificates\
    \ (on each node):\nOn each node, create a certs directory under the Cockroach data directory and upload\nthe appropriate\
    \ files. The docs commonly use ~/certs or\n/var/lib/cockroach/certs.\nssh <username>@<node-address> \"mkdir -p /var/lib/cockroach/certs\"\
    \nscp certs/ca.crt certs/node.crt certs/node.key \\\n <username>@<node-address>:/var/lib/cockroach/certs\nSet ownership\
    \ so the CockroachDB Unix user (e.g., cockroach) owns the directory:\nchown -R cockroach:cockroach /var/lib/cockroach\n\
    Optionally copy client.root.* to a secure admin host where you run cockroach sql.\nAction Command (Run on Local Machine)\n\
    Upload CA and Node\nCertificates\nscp certs/ca.crt certs/node.crt\ncerts/node.key <username>@<nodeaddress>:~/certs\n(Local)\
    \ Cleanup rm certs/node.crt certs/node.key (To\nprepare for the next node's cert generation)\nUpload Client Certificate\n\
    (for local\nadmin/troubleshooting)\nscp certs/client.root.crt\ncerts/client.root.key <username>@<nodeaddress>:~/certs\n\
    5. Start and Initialize the Cluster Securely (on each node):\n5.1. Start each node with --certs-dir (no --insecure):\n\
    The service file (cockroach.service from the previous control) contains the --\ncerts-dir=certs flag and is configured\
    \ to run from the /var/lib/cockroach\nworking directory:\nEnsure the ExecStart line includes --certs-dir and excludes\
    \ --insecure:\n [Unit]\nDescription=CockroachDB\nDocumentation=https://www.cockroachlabs.com/docs/\nAfter=network.target\n\
    [Service]\nType=notify\nUser=cockroach\nGroup=cockroach\nWorkingDirectory=/var/lib/cockroach\nExecStart=/usr/local/bin/cockroach\
    \ start \\\n --certs-dir=/var/lib/cockroach/certs \\\n --advertise-addr=<node-address> \\\n --join=<node1-address>,<node2-address>,<node3-address>\
    \ \\\n --cache=.25 \\\n --max-sql-memory=.25\nTimeoutStopSec=60\nRestart=always\nRestartSec=10\nStandardOutput=syslog\n\
    StandardError=syslog\n[Install]\nWantedBy=multi-user.target\n5.2. Enable and Start the Service Reload the systemd daemon\
    \ to\nrecognize the configuration, then enable and start the service:\nsudo systemctl daemon-reload\nsudo systemctl enable\
    \ cockroach.service\nsudo systemctl start cockroach.service\nVerify the service is running:\nsystemctl status cockroach.service\n\
    5.3. Initialize the cluster securely (Run only once from the local\nmachine)\nOnce all nodes are running, initialize the\
    \ cluster using the root client certificate.\nAfter all nodes are started in secure mode:\n# Run once from the local machine:\n\
    cockroach init \\\n--certs-dir=certs \\\n--host=<first-node-host>\n6. Verify Secure Operation\nUse secure client connection\
    \ (this already proves certs are working):\ncockroach sql \\\n--certs-dir=certs \\\n--host=<node-host> \\\n-e \"SHOW DATABASES;\"\
    \nCheck node status and liveness with --certs-dir:\ncockroach node status --certs-dir=/var/lib/cockroach/certs --host=<nodehost>\n\
    Cluster ID consistency:\ncockroach sql --certs-dir=certs --host=<node-host>\nAll nodes should report secure status and\
    \ the same cluster ID."
  checks:
  - type: command
    command: ps -ef | grep cockroach && ls -ld /var/lib/cockroach/certs && ls -l /var/lib/cockroach/certs
    expected: 'Use OpenSSL to verify that node.crt is signed by the cluster CA:'
    severity: medium
    info: '1. Confirm the cluster is not running with --insecure

      Run the following command on any node:

      ps -ef | grep cockroach

      Expected Results:

      If --insecure appears, the node is definitely operating insecurely.

      If --accept-sql-without-tls appears,

      TLS encryption is still used for all traffic.

      SQL clients may connect with sslmode=off/cockroach sql --insecure,

      skipping TLS authentication but not encryption

      '
- id: '1.4'
  title: Do Not Use the --insecure Flag in Production Environments Under Any Circumstances
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB supports an --insecure startup option that disables all node-to-node and client-to-node encryption,
    authentication, and certificate validation. When started in this mode, the cluster operates entirely without Transport
    Layer Security (TLS), allowing unauthenticated and unencrypted connections. This option exists only for initial testing
    or ephemeral local development. It must never be used in production or multi-node environments, where it exposes the cluster
    to interception, tampering, or unauthorized node participation.
  rationale: 'Starting CockroachDB with -insecure removes fundamental security controls and nullifies all certificate-based
    trust relationships. In insecure mode: Network traffic is transmitted in plaintext. Nodes can impersonate other nodes
    and join clusters without verification. Client authentication is disabled. Sensitive data (SQL queries, credentials, session
    tokens) can be read or modified in transit. Running CockroachDB insecurely in production constitutes a critical finding
    and can result in data compromise, regulatory non-compliance, or full cluster takeover. This reduces the risk of privilege
    escalation, unauthorized data access, and tampering with sensitive files such as logs, data stores, and TLS certificates.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/secure-a-cluster.html
  - 2. https://www.cockroachlabs.com/docs/stable/cockroach-start
  page_start: 33
  audit_raw: '1. Check for --insecure usage:

    ps -ef | grep cockroach | grep -- ''--insecure''

    Findings if:

    No output. If --insecure appears in any process command line, this is a finding.

    2. Review logs for insecure startup warnings:

    grep -i "insecure mode" /var/lib/cockroach/logs/cockroach.log

    Expected Results:

    No entries indicating "* WARNING: RUNNING IN INSECURE MODE!".'
  remediation: "1. Stop all insecure nodes:\nsudo systemctl stop cockroach.service\n2. Generate a certificate authority and\
    \ signed certificates:\ncockroach cert create-ca \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\ncockroach\
    \ cert create-node \\\n <addresses/hostnames...> \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\ncockroach\
    \ cert create-client \\\n root \\\n --certs-dir=certs \\\n --ca-key=my-safe-directory/ca.key\n3. Remove insecure configuration\
    \ from systemd:\nEdit the systemd unit file (usually /etc/systemd/system/cockroach.service) to\nremove --insecure and\
    \ add --certs-dir.\nAutomated cleanup (use with caution):\nsudo grep -Rl \"--insecure\" /etc/systemd/system | xargs sudo\
    \ sed -i '/--insecure/d'\n4. Manual Configuration (Recommended):\nEnsure the ExecStart line looks like this:\nExecStart=/usr/local/bin/cockroach\
    \ start \\\n --certs-dir=/var/lib/cockroach/certs \\\n --advertise-addr=<node-address> \\\n --listen-addr=<node-address>:26357\
    \ \\\n --sql-adr=<node-address>:26257 \\\n --http-addr=<node-address>:8080 \\\n --join=<peer-nodes> \\\n --cache=.25 \\\
    \n --max-sql-memory=.25\n5. Reload and Restart Securely Reload the systemd daemon to apply\nchanges and restart the service:\n\
    sudo systemctl daemon-reload\nsudo systemctl start cockroach.service\n6. Initialize the cluster securely (if new) If this\
    \ is a fresh cluster being\nconverted to secure mode before initialization:\ncockroach init \\\n --certs-dir=/var/lib/cockroach/certs\
    \ \\\n --host=<first-node-host>\n7. Remove any insecure startup configuration:\nsudo grep -Rl \"--insecure\" /etc/systemd/system\
    \ | xargs sudo sed -i '/--insecure/d'\nsudo systemctl daemon-reload\nsudo systemctl restart cockroach.service\n8. Verify\
    \ secure operation:\ncockroach sql --certs-dir=/car/lib/cockroach/certs --host=<node> -e \\\n\"select node_id, field as\
    \ property, substr(value,1,36) as value \\\n from crdb_internal.node_build_info \\\n where field='ClusterID' \\\n order\
    \ by 1,2;\"\nExpected Results:\nAll nodes should share the same Cluster ID and report secure status."
  checks:
  - type: command
    command: ps -ef | grep cockroach | grep -- '--insecure' && grep -i "insecure mode" /var/lib/cockroach/logs/cockroach.log
    expected: ''
    severity: medium
    info: '1. Check for --insecure usage:

      ps -ef | grep cockroach | grep -- ''--insecure''

      Findings if:

      No output. If --insecure appears in any process command line, this is a finding.

      2. Review logs for insecure startup warnings:

      grep -i "insecure mode" /var/lib/cockroach/logs/cockroach.log

      Expected Results:

      No entries indicating "* WARNING: RUNNING IN INSECURE MODE!".'
- id: '1.5'
  title: Ensure All Cluster Nodes Are Running the Exact Same Version, Including the Patch Release Number
  scoring: manual
  profile:
  - Level 1
  description: 'All CockroachDB nodes in a self‑hosted cluster must run the same major, minor, and patch version of the CockroachDB
    binary. The docs explicitly recommend that "all cluster nodes are running exactly the same CockroachDB version, including
    the patch release version number," and call out version mismatch as an essential alert condition. Mixed versions usually
    occur when: A rolling upgrade was started but not completed. Some nodes were missed during upgrade or restarted with an
    outdated binary. Manual differences in binaries were introduced. CockroachDB supports rolling upgrades by updating one
    node at a time, but the expectation is that after the upgrade is complete, all nodes are on the same patch version.'
  rationale: 'Maintaining version consistency across all cluster nodes ensures that: Consensus protocols (Raft) and replication
    mechanisms function correctly. All nodes interpret metadata, schema changes, and internal APIs consistently. Security
    patches and bug fixes are uniformly applied across the cluster. Operational procedures such as backups, restores, and
    upgrades behave predictably. Running nodes on mixed patch versions introduces operational risks such as: Split-brain conditions
    or inconsistent data state across replicas. Feature mismatches (newer nodes using RPCs unsupported by older peers). Failed
    schema migrations or upgrade finalization errors. Version uniformity is a key production readiness requirement defined
    by Cockroach Labs for cluster stability and compliance with enterprise-grade support contracts'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/releases/
  - 2. https://www.cockroachlabs.com/docs/releases/advisories.html
  page_start: 38
  audit_raw: '1. Check the CockroachDB version running on each node:

    From any node host you can run:

    cockroach version

    Or

    The DB Console (Cluster Overview → Node List ) shows each node''s version.

    You should verify that all nodes are on the same version before starting an upgrade and

    to use the DB Console Node List to confirm uniformity.

    Expected Results:

    All nodes should report the same CockroachDB version before and during an upgrade.

    If any node is on a different version, that indicates an incomplete or inconsistent

    upgrade and must be corrected before proceeding.

    3. Check upgrade status:

    For major‑ version upgrades:

    The upgrade is not complete until finalized (or auto‑finalization completes).

    Finalization is done by setting the version cluster setting to the new major

    version, or by allowing auto‑finalization to run.

    To check the cluster''s logical version:

    cockroach sql --certs-dir=//var/lib/cockroach/certs --host=<node> -e \

    "SHOW CLUSTER SETTING version;"

    Expected Results:

    After a completed major upgrade, this shows the new major version (e.g., 24.3

    or 25.4 depending on docs/release)

    If it still shows the prior major version, finalization has not completed, and

    some migration jobs may still be running.'
  remediation: "1. Identify out-of-date nodes:\ncockroach node status --certs-dir=/var/lib/cockroach/certs --host=<node> --\n\
    format=table\nReview build or version fields to locate mismatched nodes.\n2. Download the latest consistent binary\nPlease\
    \ refer to Control 1.1\n3. Perform a rolling restart (Upgrade one node at a time.):\nUse cockroach node drain with --shutdown\
    \ to gracefully drain and then\nterminate the node's process.\nReplace the binary, then restart via your process manager\
    \ (systemd, etc.).\n3.1. Drain the node and terminate the process:\ncockroach node drain <node-id> \\\n --shutdown \\\n\
    \ --host= {address of any live node} \\\n --certs-dir=/var/lib/cockroach/certs\nThis uses cockroach node drain to:\nDrain\
    \ the node.\nThen shut down the cockroach process automatically because of --shutdown.\n3.2. Replace the binary\nOn that\
    \ node:\nInstall or copy the new cockroach binary in place of the old one (e.g.,\n/var/lib/cockroach)\n3.3. Restart the\
    \ node via your process manager\nFor a systemd‑managed service:\nsystemctl start cockroach.service\n(Use your actual service\
    \ name, e.g., cockroach as configured in your unit file.)\n3.4. Verify the node has rejoined and is ready\nAfter a short\
    \ wait, confirm the node is serving SQL:\ncockroach sql --certs-dir=/var/lib/cockroach/certs --host=<upgraded-node> \\\
    \n -e \"SELECT 1;\"\nRepeat for the next node until all nodes have been drained, shut down, upgraded,\nand restarted with\
    \ the new binary.\n4. Verify all nodes now run the same version:\nAfter completing the rolling procedure:\nUse the DB\
    \ Console Node List to confirm that every node now reports the same\nCockroachDB version and build.\nIf your monitoring\
    \ is configured per the Version mismatch alert guidance, it should no\nlonger fire once all build timestamps are aligned.\n\
    5. Finalize the cluster upgrade (if applicable):\nIf this remediation is part of a major‑ version upgrade and you have\
    \ disabled\nauto‑finalization (for example, via cluster.auto_upgrade.enabled = false), then\nonce all nodes are on the\
    \ new binary and healthy, you must finalize:\ncockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> -e \"SET\
    \ CLUSTER\nSETTING version = '{VERSION}';\"\nReplace {VERSION} with the new major version, such as 25.4\nFinalization\
    \ completes when:\nSHOW CLUSTER SETTING version returns the new version, and\nAll migration and schema change jobs have\
    \ reached terminal states."
  checks:
  - type: sql
    command: SHOW CLUSTER SETTING version;
    severity: medium
    info: '1. Check the CockroachDB version running on each node:

      From any node host you can run:

      cockroach version

      Or

      The DB Console (Cluster Overview → Node List ) shows each node''s version.

      You should verify that all nodes are on the same version before starting an upgrade and

      to use the DB Console Node List to confirm uniformity.

      Expected Results:

      All nodes should report the same CockroachDB version befo'
- id: '1.6'
  title: Establish a Process for Rolling Upgrades to Apply Security Patches Without Downtime
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB supports rolling upgrades, allowing administrators to apply security patches, minor version updates,
    and configuration changes without cluster downtime. A rolling upgrade updates one node at a time, while the remaining
    nodes continue serving traffic and maintaining quorum. Establishing a formal, documented rolling upgrade process ensures
    consistent patch application, reduces service disruption, and maintains the cluster's integrity and availability. This
    process must include pre-upgrade validation, stepwise node restarts, health verification, and post-upgrade finalization.
  rationale: 'A defined rolling upgrade process: Ensures security patches and bug fixes are applied consistently across nodes.
    Maintains continuous availability by preserving quorum during upgrades. Prevents version drift and configuration inconsistencies.
    Enables safe rollback or recovery in case of unexpected upgrade failures. Reduces operational risk while maintaining compliance
    with patch management policies. Without a controlled rolling upgrade process: Clusters may suffer unplanned downtime,
    split-brain events, or data unavailability. Nodes could run outdated, unpatched binaries, exposing vulnerabilities. Partial
    upgrades could lead to inconsistent Raft or schema states.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/upgrade-cockroach-version.html
  - 2. https://www.cockroachlabs.com/docs/stable/recommended-productionsettings.html
  page_start: 43
  audit_raw: 'Run the following checks:

    1. Verify presence of a documented upgrade procedure

    Confirm your organization has a written or automated process for performing rolling

    upgrades, including:

    Stepwise node restarts (one node at a time).

    Verification commands and pre/post checks.

    Defined rollback plan.

    Reference to Cockroach Labs'' upgrade documentation.

    Review operational runbooks or CI/CD pipelines.

    2. Check CockroachDB cluster health before upgrade:

    cockroach node status --certs-dir="certs" --all

    Expected Results:

    All nodes report the same version,is_available: true, and the cluster is fully

    replicated.

    3. Verify rolling upgrade sequence logs exist:

    grep -i "upgrade" /var/lib/cockroach/logs/cockroach.log

    Expected Results:

    Log entries should show sequential node restarts, not simultaneous restarts across all

    nodes.

    4. Confirm upgrade finalization post-process:

    cockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> -e "SHOW CLUSTER

    SETTING version;"

    Expected Results:

    Cluster version matches the upgraded binary version.'
  remediation: "1. Prepare for rolling upgrade:\nConfirm cluster health and full replication:\ncockroach node status --certs-dir=/var/lib/cockroach/certs\
    \ --host=<node>\ncockroach node status --certs-dir=/var/lib/cockroach/certs --all\nBackups are strongly recommended before\
    \ upgrades.\n2. Upgrade CockroachDB binary on each node (one at a time):\nUse cockroach node drain with --shutdown to\
    \ gracefully drain and then\nterminate the node's process.\nReplace the binary, then restart via your process manager\
    \ (systemd, etc.).\n2.1. Drain the node and terminate the process:\ncockroach node drain <node-id> \\\n --shutdown \\\n\
    \ --host= {address of any live node} \\\n --certs-dir=/var/lib/cockroach/certs\nThis uses cockroach node drain to:\nDrain\
    \ the node.\nThen shut down the cockroach process automatically because of --shutdown.\n2.2. Replace the binary\nOn that\
    \ node (Follow Control 1.1):\nInstall or copy the new cockroach binary in place of the old one (e.g.,\n/var/lib/cockroach)\n\
    2.3. Restart the node via your process manager\nFor a systemd‑managed service:\nsystemctl start cockroach.service\n(Use\
    \ your actual service name, e.g., cockroach as configured in your unit file.)\n2.4. Verify the node has rejoined and is\
    \ ready\nAfter a short wait, confirm the node is serving SQL:\ncockroach sql --certs-dir=/var/lib/cockroach/certs --host=<upgraded-node>\
    \ \\\n -e \"SELECT 1;\"\nIterate through the remaining nodes, ensuring that each node is drained, shut\ndown, upgraded,\
    \ and restarted. To ensure data availability, strictly enforce a wait\nperiod after each restart until the cluster reports\
    \ no under-replicated ranges\nbefore attempting to upgrade the subsequent node.\nExpected Results:\nNode shows is_available\
    \ : true and matches the new build tag.\n3. Finalize the cluster version after all nodes upgraded:\ncockroach sql --certs-dir=/var/lib/cockroach/certs\
    \ --host=<node>\nSET CLUSTER SETTING version = '{VERSION}';\"\nReplace {VERSION} with the new major version, such as 25.4\n\
    4. Verify upgrade success:\ncockroach sql --certs-dir=/var/lib/cockroach/certs --host=<node> \\\n -e \"SHOW CLUSTER SETTING\
    \ version;\""
  checks:
  - type: command
    command: grep -i "upgrade" /var/lib/cockroach/logs/cockroach.log
    expected: ''
    severity: medium
    info: 'Run the following checks:

      1. Verify presence of a documented upgrade procedure

      Confirm your organization has a written or automated process for performing rolling

      upgrades, including:

      Stepwise node restarts (one node at a time).

      Verification commands and pre/post checks.

      Defined rollback plan.

      Reference to Cockroach Labs'' upgrade documentation.

      Review operational runbooks or CI/CD pipelines.

      2. Ch'
- id: '1.7'
  title: Ensure Encryption at Rest Keys Are Managed by an External KMS and Retrieved at Startup
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB supports the use of external key management systems (KMS), such as HashiCorp Vault, to securely
    manage and deliver encryption keys used for encryption at rest. External key managers provide a centralized and auditable
    way to store and rotate keys and supply them dynamically to CockroachDB at startup. By retrieving keys securely at runtime
    instead of storing them on local disks or in configuration files, administrators can reduce the risk of key exposure and
    strengthen compliance with data protection standards.
  rationale: 'Managing encryption keys within the same host that stores the encrypted data increases risk in the event of
    a host or filesystem compromise. Integrating CockroachDB with an external KMS ensures that: Encryption keys are not stored
    in plaintext on local systems. Keys can be rotated and revoked centrally. Only authorized CockroachDB nodes can access
    the keys at runtime. Audit trails record every key access for accountability and compliance. Without a secure external
    key manager, any compromise of a database node could reveal local key material and allow attackers to decrypt sensitive
    data.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/manage-certs-vault.html
  - 2. https://www.cockroachlabs.com/docs/stable/encryption.html
  page_start: 47
  audit_raw: '1. Check for enterprise encryption configuration:

    ps -ef | grep cockroach | grep -- ''--enterprise-encryption''

    Expected Results:

    Each CockroachDB process for encrypted stores includes a --enterpriseencryption=path=...,key=...,old-key=...,rotation-period=...

    argument.

    Note: Note: Once --enterprise-encryption has been configured for a store, it

    must always be present on that node.

    2. Inspect configuration for external key source:

    # Look for Vault, Transit, or other secret loader references

    grep -Ri "vault" /etc/cockroach /usr/lib/systemd/system

    grep -Ri "encryption-key" /etc/cockroach /usr/lib/systemd/system

    Expected Results:

    You may find references to Vault (or another secret delivery mechanism) in:

    systemd unit files (e.g., ExecStartPre scripts fetching keys),

    wrapper scripts under /etc/cockroach,

    environment variables that point to Vault or a secret loader.

    3. Verify that local key files are not present:

    # Look for key files under Cockroach-related paths

    find /etc/cockroach /var/lib/cockroach -type f -name "*.key" -ls

    Expected Results:

    Store key files do exist somewhere (since self‑hosted Enterprise Encryption at

    Rest requires them).

    They are:

    Not on the same partition/drive as the data directory (e.g.,

    /var/lib/cockroach).

    Protected by file permissions: owned by the CockroachDB user, not worldreadable.

    If you find key files inside the data directory or on the same volume, that is a

    finding to remediate.'
  remediation: "1. Deploy or connect to a supported key management system:\nSuch as HashiCorp Vault, AWS KMS, or another trusted\
    \ external provider.\n2. Configure the Systemd Service to enable encryption:\nEdit the service file at /etc/systemd/system/cockroach.service.\
    \ Update the\nExecStart command to include the --enterprise-encryption flag:\nExample Configuration (File-based key on\
    \ separate volume):\nExecStart=/usr/local/bin/cockroach start \\\n --certs-dir=/var/lib/cockroach/certs \\\n --store=/var/lib/cockroach\
    \ \\\n --enterprise-encryption=path=/var/lib/cockroach,key=/secure-keys/crdbstore.key,old-key=plain \\\n --advertise-addr=<node-address>\
    \ \\\n --listen-addr=<node-address>:26357 \\\n --http-addr=<node-address>:8080 \\\n --sql-adr=<node-address>:26257 \\\n\
    \ --join=<peer-nodes>\nold-key=plain is used only when first enabling encryption on an existing plaintext\ncluster to\
    \ allow rotation. Once encrypted, remove old-key=plain.\n3. Secure the key files If using local key files (instead of\
    \ a direct KMS\nintegration), ensure they are strictly protected:\n# Create a secure directory separate from data\nsudo\
    \ mkdir -p /secure-keys\n# Move/Generate key\nsudo mv /path/to/generated.key /secure-keys/crdb-store.key\n# Restrict permissions\n\
    sudo chown -R cockroach:cockroach /secure-keys\nsudo chmod 700 /secure-keys\nsudo chmod 400 /secure-keys/crdb-store.key\n\
    4. Reload and Restart Reload systemd and restart the service to apply\nencryption:\nsudo systemctl daemon-reload\nsudo\
    \ systemctl restart cockroach.service\n5. Verify encryption status:\nUse the CockroachDB debug tooling to validate that\
    \ encryption is active and that a store\nkey is in use.\ncockroach debug encryption-active-key /var/lib/cockroach\nExpected\
    \ Results:\nEncryption is active and keys are sourced from the external KMS."
  checks:
  - type: command
    command: ps -ef | grep cockroach | grep -- '--enterprise-encryption' && grep -Ri "vault" /etc/cockroach /usr/lib/systemd/system
      && grep -Ri "encryption-key" /etc/cockroach /usr/lib/systemd/system && find /etc/cockroach /var/lib/cockroach -type
      f -name "*.key" -ls
    expected: '3. Verify that local key files are not present:'
    severity: medium
    info: '1. Check for enterprise encryption configuration:

      ps -ef | grep cockroach | grep -- ''--enterprise-encryption''

      Expected Results:

      Each CockroachDB process for encrypted stores includes a --enterpriseencryption=path=...,key=...,old-key=...,rotation-period=...

      argument.

      Note: Note: Once --enterprise-encryption has been configured for a store, it

      must always be present on that node.

      2. Inspect configur'
- id: '2.1'
  title: Ensure Network Time Protocol (NTP) Service Is Configured for Cluster Clock Synchronization
  scoring: manual
  profile:
  - Level 1
  description: CockroachDB requires moderate levels of clock synchronization to preserve data consistency. When a node detects
    that its clock is out of sync with at least half of the other nodes in the cluster by 80% of the maximum offset allowed
    (500 ms by default), it will spontaneously shut down to avoid consistency anomalies. Administrators must run clock synchronization
    software (for example, NTP or chrony) on each node and use compatible time sources (e.g. Google Public NTP, Amazon Time
    Sync Service) that implement leap-second smearing consistently across the cluster. CockroachDB does not install or configure
    NTP automatically, this must be done at the OS or platform level.
  rationale: 'Accurate clock synchronization is critical for CockroachDB to ensure: Serializable transactions: Prevents transaction
    overlap errors. Reliable Raft consensus: Ensures proper election and replication timing. Accurate event logs: Enables
    consistent auditing and troubleshooting. Automatic fault detection: Prevents unnecessary node shutdowns caused by clock
    drift. Without NTP, clock skew can cause transaction uncertainty, stale reads, data inconsistencies, or even cluster instability.'
  impact: ''
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/start-a-node
  page_start: 52
  audit_raw: 'Key Requirement:

    Some clock sync service (NTP, chrony, etc.) is running on each node.

    All nodes are synchronized to compatible, leap-smearing time sources (e.g.,

    Amazon Time Sync, Google internal/public NTP), or chrony with client-side

    smearing configured consistently.

    Clock offsets stay within the configured --max-offset.

    1. Confirm an NTP/chrony service is active (platform/OS-specific):

    Use your OS tools (for example, systemctl status chronyd, timedatectl, etc.) to ensure

    one clock sync service is enabled and running on each node.

    2. Verify time source selection and leap-second behavior:

    Check that all nodes use:

    Amazon Time Sync Service on AWS.

    Google internal NTP on GCE, or Google Public NTP elsewhere.

    Or chrony with client-side leap smearing if your time source does not smear

    server-side, configured the same way on all nodes

    3. Inspect CockroachDB''s view of clock offsets

    The --max-offset flag is a startup parameter for the cockroach start command, with

    a default value of 500 milliseconds (ms).

    To inspect clock offsets between nodes, use Prometheus metrics such as

    clock_offset_meannanos or view the Clock Offset graph in the DB Console. These tools

    provide visibility into clock synchronization and help ensure offsets remain well below

    the configured --max-offset

    Expected Results:

    Offsets are well below the configured --max-offset (500 ms by default).

    4. Check logs for clock skew errors:

    grep -i "clock" /var/lib/cockroach/logs/cockroach.log

    Expected Results:

    No entries indicating that a node is "more than 400ms away from at least half of the

    known nodes" or similar clock-offset errors.'
  remediation: 'Key requirements:

    Run one clock sync service (NTP/chrony or provider''s built-in time source) on

    each node.

    Use compatible, leap-smearing time sources across all nodes.

    1. Install and enable a time sync service (per environment):

    AWS EC2: Configure each instance to use Amazon Time Sync Service via

    169.254.169.123, verify via chronyc sources -v .

    GCE: use GCE''s internal NTP via metadata.google.internal; optionally

    Google Public NTP (time.google.com) for non-GCE nodes.

    On‑prem / DigitalOcean / Azure: install NTP (or chrony) and configure Google

    Public NTP (time[1-4].google.com) as the source.

    2. Configure trusted, compatible NTP sources:

    Follow the environment-specific doc:

    Use:

    Amazon Time Sync on AWS.

    GCP internal NTP on GCE.

    Google Public NTP (time.google.com, time1-4.google.com)

    elsewhere.

    Ensure all nodes are synced either:

    To the same time source, or

    To sources that implement leap second smearing in the same way

    (Google and Amazon are compatible with each other but not with default

    NTP pool).

    3. Restart and verify the time service:

    Use your OS commands (for example, systemctl restart chronyd then chronyc

    sources -v , or timedatectl) to verify:

    The service is running on all nodes.

    Nodes are synchronized to the intended sources (e.g., 169.254.169.123 for AWS,

    time*.google.com for Google NTP).

    4. Validate CockroachDB cluster offset:

    Clock offsets, as observed via Prometheus metrics or the DB Console, are well below

    the configured --max-offset (500 ms by default).

    5. (Optional hardening):

    Prefer internal/enterprise NTP sources or cloud‑provider services (Amazon Time

    Sync, Google internal NTP).

    If not using Google/AWS services, configure chrony with client‑side leap

    smearing, identically on all nodes.

    5. (Optional) Harden configuration using authenticated or internal NTP sources

    for production deployments.'
  checks:
  - type: command
    command: grep -i "clock" /var/lib/cockroach/logs/cockroach.log
    expected: ''
    severity: medium
    info: 'Key Requirement:

      Some clock sync service (NTP, chrony, etc.) is running on each node.

      All nodes are synchronized to compatible, leap-smearing time sources (e.g.,

      Amazon Time Sync, Google internal/public NTP), or chrony with client-side

      smearing configured consistently.

      Clock offsets stay within the configured --max-offset.

      1. Confirm an NTP/chrony service is active (platform/OS-specific):

      Use your'
- id: '2.2'
  title: Ensure Each CockroachDB Node Runs as a Dedicated Process on a Separate Host
  scoring: manual
  profile:
  - Level 1
  description: For all self-hosted VM or bare-metal production deployments (on-premises or on cloud providers like AWS, GCP,
    Azure), each CockroachDB node must run as a single, dedicated cockroach start process on its own physical or virtual machine
    (VM). It is a critical violation of best practices to co-locate multiple CockroachDB node processes on the same host,
    as this undermines the database's high-availability design and fault tolerance. Additionally, the data directory/storage
    volume for each node must be unique and not shared across any other node.
  rationale: 'CockroachDB''s distributed consensus mechanism (Raft) and replication model are fundamentally built on the assumption
    that each node is an independent failure domain. Single Point of Failure (SPOF): Running multiple nodes on the same VM
    turns that single host into an SPOF. A simple hardware failure, OS crash, or kernel panic on that host could simultaneously
    take down multiple data replicas, potentially eliminating the quorum required for the cluster to remain available. Undermined
    Fault Tolerance: Co-location means data ranges (replicas) are not properly isolated. This defeats the purpose of maintaining
    multiple replicas across different failure zones. Resource Contention: Sharing CPU, I/O, and network resources among multiple
    node processes can lead to unpredictable latency, performance issues, and conflicts. Data Corruption Risk: Sharing the
    same data directory (--store path) between two or more active node processes will lead to locking errors and data corruption.'
  impact: N/A
  references:
  - 1. https://www.cockroachlabs.com/docs/stable/recommended-production-settings
  - 2. https://www.cockroachlabs.com/docs/stable/deploy-cockroachdb-on-premises
  page_start: 56
  audit_raw: 'Perform the following checks on every host intended to run a CockroachDB node:

    1. Verify that only one CockroachDB process is active per host:

    #Check for active "cockroach start" processes on the VM:

    ps -ef | grep ''[c]ockroach start''

    Expected Results:

    At most one cockroach start process per VM.

    2. Verify Data Directories Are Isolated:

    #Examine the data directory paths used by the node process (e.g., the default

    "/var/lib/cockroach" or a custom "--store" path):

    ls -ld /var/lib/cockroach

    # Also check any other custom store paths

    Expected Results:

    Each CockroachDB node process may use one or more unique data directories

    by specifying multiple --store flags (for example, when using multiple disks or

    SSDs on a single node).

    Each data directory or disk must be dedicated to a single node process and must

    not be shared with any other CockroachDB node process or host. Sharing a data

    directory or disk between node processes is not supported and can lead to data

    corruption or operational issues

    3. Confirm Topology Design:

    From your deployment design and inventory, verify that the number of VMs equals the

    number of CockroachDB nodes. All self‑hosted deployment guides state that each node

    should run on a separate VM or machine

    Expected Results:

    The number of dedicated VMs (or physical hosts) must equal the number of

    CockroachDB nodes deployed.

    There should be no documented or intentional design to run multiple node

    processes on a single VM.'
  remediation: "If any host is found to be running more than one cockroach start process, or if storage is\nshared:\n1. Stop\
    \ Extra CockroachDB Processes:\nOn the overloaded host, identify and stop the excess node processes:\n# Identify all cockroach\
    \ start processes\nps -ef | grep '[c]ockroach start'\n# Stop via systemd if used (assuming only one service should remain)\n\
    systemctl stop cockroach.service\n2. Provision Separate VMs and Re-deploy:\nThe nodes that were stopped must be moved\
    \ to their own dedicated infrastructure:\nProvision a new VM or host for each node that was sharing a machine.\nInstall\
    \ CockroachDB on the new host.\nConfigure your virtualization platform (e.g., VMware, Hyper-V) to enforce AntiAffinity\
    \ rules. This guarantees that no two CockroachDB VMs are ever scheduled\nto run on the same underlying physical host.\
    \ This prevents a single hardware\nfailure from taking down multiple nodes.\nCreate a dedicated, unique data directory\
    \ and ensure proper ownership before\nstarting the node:\nmkdir /var/lib/cockroach\nuseradd cockroach\nchown -R cockroach\
    \ /var/lib/cockroach\n3. Start Each Node as a Single Service on Its Own Host:\nUse a single cockroach start per machine,\
    \ either manually or via systemd. For\nexample (secure on‑premises):\ncockroach start \\\n --certs-dir=/var/lib/cockroach/certs\
    \ \\\n --store=/var/lib/cockroach \\\n --advertise-addr=<node-ip-address>:26257 \\\n --listen-addr=10.0.0.1:26357 \\ #\
    \ Note: This configuration is discussed in a\nfurther control\n --sql-addr=192.168.1.1:26257 \\ # Note: This configuration\
    \ is discussed in a\nfurther control\n --join=<node1-addr>,<node2-addr>,<node3-addr> \\\n --cache=.25 \\\n --max-sql-memory=.25\
    \ \\\n --background\nOr using the systemd service template from the docs, with one instance per host and --\nadvertise-addr\
    \ set to that host's address. (Control 1.2)\n4. Ensure Storage is Not Shared\nVerify that the --store directory on the\
