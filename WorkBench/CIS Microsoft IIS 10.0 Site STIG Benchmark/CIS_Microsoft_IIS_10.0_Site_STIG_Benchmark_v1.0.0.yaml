    Remove any non-DOD certificates if present.

    Follow the procedures below for each site hosted on the IIS 10.0 web server to bind the

    certificates to the site:

    Click on the site needing the certificate.

    Select "Bindings" under the "Actions" pane.

    Click on the binding needing a certificate and select "Edit", or add a site binding for

    HTTPS.

    Assign the certificate to the website by choosing it under the "SSL Certificate" dropdown and clicking "OK".'
