- id: '1.14'
  title: IIST-SI-000221
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Anonymous IIS 10.0 website access accounts must be restricted. GROUP ID: V-218750 RULE ID: SV-218750r961095'
  rationale: Many of the security problems that occur are not the result of a user gaining access to files or data for which
    the user does not have permissions, but rather users are assigned incorrect permissions to unauthorized data. The files,
    directories, and data stored on the web server must be evaluated and a determination made concerning authorized access
    to information and programs on the server. Only authorized users and administrative accounts will be allowed on the host
    server in order to maintain the web server, applications, and review the server operations.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Check the account used for anonymous access to the website.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Double-click "Authentication" in the IIS section of the website’s Home Pane.

    If "Anonymous access" is disabled, this is Not a Finding.

    If "Anonymous access" is enabled, click "Anonymous Authentication".

    Click "Edit" in the "Actions" pane.

    If the "Specific user" radio button is enabled and an ID is specified in the adjacent

    control box, this is the ID being used for anonymous access. Note the account name.

    If nothing is tied to "Specific User", this is Not a Finding.

    Check privileged groups that may allow the anonymous account inappropriate

    membership:

    Open "Computer Management" on the machine.

    Expand "Local Users and Groups".

    Open "Groups".

    Review the members of any of the following privileged groups:

    Administrators

    Backup Operators

    Certificate Services (of any designation)

    Distributed COM Users

    Event Log Readers

    Network Configuration Operators

    Performance Log Users

    Performance Monitor Users

    Power Users

    Print Operators

    Remote Desktop Users

    Replicator

    Double-click each group and review its members.

    If the IUSR account or any account noted above used for anonymous access is a

    member of any group with privileged access, this is a finding.'
  remediation: 'Remove the Anonymous access account from all privileged accounts and all privileged

    groups.'
  checks:
  - type: manual_review
    info: 'Check the account used for anonymous access to the website.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Open the IIS 10.0 Manager.

      Double-click "Authentication" in the IIS section of the website’s Home Pane.

      If "Anonymous access" is disabled, this is Not a Finding.

      If "Anonymous access" is enabled, click "Anonymous Authentication".

      Click "Edit" in the "Actions" pane.

      If the "Specific user" radio button is enabled and an ID is specified in the adjacent

      control box'
    severity: medium
- id: '1.15'
  title: IIST-SI-000223
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must generate unique session identifiers that cannot be reliably reproduced. GROUP ID:
    V-218751 RULE ID: SV-218751r1043181'
  rationale: Communication between a client and the web server is done using the HTTP protocol, but HTTP is a stateless protocol.
    To maintain a connection or session, a web server will generate a session identifier (ID) for each client session when
    the session is initiated. The session ID allows the web server to track a user session and, in many cases, the user, if
    the user previously logged into a hosted application. By being able to guess session IDs, an attacker can easily perform
    a man-in-the-middle attack. To truly generate random session identifiers that cannot be reproduced, the web server session
    ID generator, when used twice with the same input criteria, must generate an unrelated random ID. The session ID generator
    must be a FIPS 140-2-approved generator.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Note: If ASP.NET is not installed, this is Not Applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the "ASP.NET" section, select "Session State".

    Under "Session State" Mode Settings, verify the "In Process" mode is selected.

    If the "In Process" mode is selected, this is not a finding.

    Alternative method:

    Click the site name.

    Select "Configuration Editor" under the "Management" section.

    From the "Section:" drop-down list at the top of the configuration editor, locate

    "system.web/sessionState".

    Verify the "mode" reflects "InProc".

    If the "mode" is not set to "InProc", this is a finding.

    If the system being reviewed is part of a Web Farm, interview the System Administrator

    to ensure Session State Tracking is enabled via a SQL server, or other means. If

    Session State Tracking is enabled on the Web Farm, this is not a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the ASP.NET section, select "Session State".

    Under "Session State" Mode Settings, select the "In Process" mode.'
  checks:
  - type: sql
    command: select "Session State".
    severity: medium
    info: 'Note: If ASP.NET is not installed, this is Not Applicable.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

