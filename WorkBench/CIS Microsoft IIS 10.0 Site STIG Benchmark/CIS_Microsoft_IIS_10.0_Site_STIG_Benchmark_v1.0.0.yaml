    hosting any content, this requirement is Not Applicable.

    Open the IIS 10.0 Manager.

    Perform for each Application Pool.

    Click "Application Pools".

    Highlight an Application Pool and click "Advanced Settings" in the "Action" Pane.

    Scroll down to the "Recycling section" and verify the value for "Request Limit" is set to a

    value other than "0".

    If the "Request Limit" is set to a value of "0", this is a finding.

    If the system must require "Request Limit" to be set to "0", it is documented and

    approved by the ISSO, this is not a finding.'
  remediation: 'Open the IIS 10.0 Manager.

    Click "Application Pools".

    Highlight an Application Pool and click "Advanced Settings" in the "Action" Pane.

    Scroll down to the "Recycling section" and set the value for "Request Limit" to greater

    than "0".

    Click "OK".'
