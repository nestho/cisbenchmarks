- id: '1.38'
  title: IIST-SI-000258
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The application pools rapid fail protection for each IIS 10.0 website must be enabled. GROUP ID: V-218777
    RULE ID: SV-218777r961863'
  rationale: Rapid fail protection is a feature that interrogates the health of worker processes associated with websites
    and web applications. It can be configured to perform a number of actions such as shutting down and restarting worker
    processes that have reached failure thresholds. By not setting rapid fail protection, the web server could become unstable
    in the event of a worker process crash potentially leaving the web server unusable.
  impact: ''
  references: []
