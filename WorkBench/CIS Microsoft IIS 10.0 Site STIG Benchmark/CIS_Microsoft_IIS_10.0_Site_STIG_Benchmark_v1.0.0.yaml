- id: '1.9'
  title: IIST-SI-000214
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must have Multipurpose Internet Mail Extensions (MIME) that invoke OS shell programs
    disabled. GROUP ID: V-218743 RULE ID: SV-218743r1111802'
  rationale: Controlling what a user of a hosted application can access is part of the security posture of the web server.
    Any time a user can access more functionality than is needed for the operation of the hosted application poses a security
    issue. A user with too much access can view information that is not needed for the user's job role, or could use the function
    in an unintentional manner. A MIME tells the web server what type of program various file types and extensions are and
    what external utilities or programs are needed to execute the file type. A shell is a program that serves as the basic
    interface between the user and the operating system, so hosted application users must not have access to these programs.
    Shell programs may execute shell escapes and can then perform unauthorized activities that could damage the security posture
    of the web server.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Note: If the server is hosting WSUS, this is not applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click on the IIS 10.0 site.

    Under IIS, double-click the “MIME Types” icon.

    From the "Group by:" drop-down list, select "Content Type".

    From the list of extensions under "Application", verify MIME types for OS shell program

    extensions have been removed, to include at a minimum, the following extensions:

    .exe

    .dll

    .com

    .bat

    .csh

    If any OS shell MIME types are configured, this is a finding.

    Note: For a WSUS deployment, .exe extensions may remain.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click on the IIS 10.0 site.

    Under IIS, double-click the “MIME Types” icon.

    From the "Group by:" drop-down list, select "Content Type".

    From the list of extensions under "Application", remove MIME types for OS shell

    program extensions, to include at a minimum, the following extensions:

    .exe

    .dll

    .com

    .bat

    .csh

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: sql
    command: select "Content Type".
    severity: medium
    info: 'Note: If the server is hosting WSUS, this is not applicable.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Open the IIS 10.0 Manager.

      Click on the IIS 10.0 site.

