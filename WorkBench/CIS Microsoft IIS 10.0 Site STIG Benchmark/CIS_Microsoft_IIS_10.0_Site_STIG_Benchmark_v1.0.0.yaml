- id: '1.26'
  title: IIST-SI-000235
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Idle Time-out monitor for each IIS 10.0 website must be enabled. GROUP ID: V-218762 RULE ID: SV-218762r1043182'
  rationale: The idle time-out attribute controls the amount of time a worker process will remain idle before it shuts down.
    A worker process is idle if it is not processing requests and no new requests are received. The purpose of this attribute
    is to conserve system resources; the default value for idle time-out is 20 minutes. By default, the World Wide Web (WWW)
    service establishes an overlapped recycle, in which the worker process to be shut down is kept running until after a new
    worker process is started.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'If this IIS 10.0 installation is supporting Microsoft Exchange, and not otherwise hosting

    any content, this requirement is Not Applicable.

