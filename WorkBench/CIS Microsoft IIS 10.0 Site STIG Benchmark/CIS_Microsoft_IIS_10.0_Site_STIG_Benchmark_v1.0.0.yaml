- id: '1.39'
  title: IIST-SI-000259
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The application pools rapid fail protection settings for each IIS 10.0 website must be managed. GROUP ID:
    V-218778 RULE ID: SV-218778r961863'
  rationale: Windows Process Activation Service (WAS) manages application pool configuration and may flag a worker process
    as unhealthy and shut it down. The rapid fail protection must be set to a suitable value. A lack of response from the
    worker process might mean the worker process does not have a thread to respond to the ping request, or that it is hanging
    for some other reason. The ping interval and ping response time may need adjustment to gain access to timely information
    about application pool health without triggering false, unhealthy conditions.
  impact: ''
  references: []
