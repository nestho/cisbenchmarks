- id: '1.34'
  title: IIST-SI-000246
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cookies exchanged between the IIS 10.0 website and the client must have cookie properties set to prohibit
    client-side scripts from reading the cookie data. GROUP ID: V-218770 RULE ID: SV-218770r1111816'
  rationale: 'A cookie can be read by client-side scripts easily if cookie properties are not set properly. By allowing cookies
    to be read by the client-side scripts, information such as session identifiers could be compromised and used by an attacker
    who intercepts the cookie. Setting cookie properties (i.e., HttpOnly property) to disallow client-side scripts from reading
    cookies better protects the information inside the cookie. Satisfies: SRG-APP-000439-WSR-000154, SRG-APP-000439-SSR-000155,
    SRGAPP-000439-WSR-000153'
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'Note: If the server being reviewed is a public IIS 10.0 web server, this is not applicable.

    Note: If the server being reviewed is hosting SharePoint, this is not applicable.

    Note: If the server being reviewed is hosting WSUS, this is not applicable.

    Note: If SSL is installed on load balancer/proxy server through which traffic is routed to

    the IIS 10.0 server, and the IIS 10.0 server receives traffic from the load balancer/proxy

    server, the SSL requirement must be met on the load balancer/proxy server.

    Note: If the server is providing OCSP, and not otherwise hosting any content, this

    requirement is not applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Access the IIS 10.0 Manager.

    Under the "Management" section, double-click the "Configuration Editor" icon.

    From the "Section:" drop-down list, select "system.web/httpCookies".

    Verify the "require SSL" is set to "True".

    From the "Section:" drop-down list, select "system.web/sessionState".

    Verify the "compressionEnabled" is set to "False".

    If both the "system.web/httpCookies:require SSL" is set to "True" and the

    "system.web/sessionState:compressionEnabled" is set to "False", this is not a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Access the IIS 10.0 Manager.

    Under "Management" section, double-click the "Configuration Editor" icon.

