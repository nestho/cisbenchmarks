    pane.

    Scroll down to the "Process Model" section and verify the value for "Idle Time-out" is not

    "0".

    If the "Idle Time-out" is set to "0", this is a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the Application Pools.

    Highlight an Application Pool to review and click "Advanced Settings" in the "Actions"

    pane.

    Scroll down to the "Process Model" section and set the value for "Idle Time-out" to

    something other than "0". "20" or less is recommended if the amount of RAM on the

    system is limited.'
