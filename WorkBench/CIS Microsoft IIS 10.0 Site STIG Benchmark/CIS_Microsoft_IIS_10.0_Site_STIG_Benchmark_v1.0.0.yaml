      logging is being written.

      Confirm with the System Administrator that the designated log path is of sufficient size

      to maintain the logging.

      Under "Log File Rollover", verify "Do not create new log files" is not selected.

      Verify a schedule is co'
    severity: medium
- id: '1.30'
  title: IIST-SI-000239
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 websites must use ports, protocols, and services according to Ports, Protocols, and Services
    Management (PPSM) guidelines. GROUP ID: V-218766 RULE ID: SV-218766r1111809'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The web server must provide the capability to
    disable or deactivate network-related services deemed to be non-essential to the server mission, too unsecure, or prohibited
    by the PPSM CAL and vulnerability assessments. Failure to comply with DoD ports, protocols, and services (PPS) requirements
    can result in compromise of enclave boundary protections and/or functionality of the AIS. The ISSM will ensure web servers
    are configured to use only authorized PPS in accordance with the Network Infrastructure STIG, DoD Instruction 8551.1,
    PPSM, and the associated PPS Assurance Category Assignments List.
  impact: ''
  references: []
  page_start: 69
  audit_raw: 'Note: If the server is providing OCSP, and not otherwise hosting any content, this

    requirement is not applicable.

    Review the website to determine if HTTP and HTTPs (e.g., 80 and 443) are used in

    accordance with those ports and services registered and approved for use by the DOD

    PPSM. Any variation in PPS will be documented, registered, and approved by the

    PPSM.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name under review.

    In the "Action" Pane, click "Bindings".

    Review the ports and protocols. If unknown ports or protocols are used, then this is a

    finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name under review.

    In the "Action" Pane, click "Bindings".

    Edit to change an existing binding and set the correct ports and protocol.'
