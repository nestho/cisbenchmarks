controls:
- id: '1.1'
  title: IIST-SI-000201
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website session state must be enabled. GROUP ID: V-218735 RULE ID: SV-218735r1022667'
  rationale: When the session information is stored on the client, the session ID, along with the user authorization and identity
    information, is sent along with each client request and is either stored in a cookie, embedded in the uniform resource
    locator (URL), or placed in a hidden field on the displayed form. Each of these offers advantages and disadvantages. The
    biggest disadvantage to all three is the hijacking of a session along with all of the user's credentials. When the user
    authorization and identity information is stored on the server in a protected and encrypted database, the communication
    between the client and web server will only send the session identifier, and the server can then retrieve user credentials
    for the session when needed. If, during transmission, the session were to be hijacked, the user's credentials would not
    be compromised. ASP.NET provides a session state, which is available as the HttpSessionState class, as a method of storing
    session-specific information that is visible only within the session. ASP.NET session state identifies requests from the
    same browser during a limited time window as a session, and provides the ability to persist variable values for the duration
    of that session.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Note: If ASP.NET is not installed, this is Not Applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the "ASP.NET" section, select "Session State".

    Under "Session State Mode Settings", verify the "In Process" mode is selected.

    If the "Session State Mode Settings" is set to "In Process", this is not a finding.

    Alternative method:

    Click the site name.

    Select "Configuration Editor" under the "Management" section.

    From the "Section:" drop-down list at the top of the configuration editor, locate

    "system.web/sessionState".

    Verify the "mode" reflects "InProc".

    If the "mode" is not set to "InProc", this is a finding.

    If the system being reviewed is part of a Web Farm, interview the System Administrator

    to ensure Session State Tracking is enabled via a SQL server, or other means. If

    Session State Tracking is enabled on the Web Farm, this is not a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the "ASP.NET" section, select "Session State".

    Under "Session State Mode Settings", verify the "In Process" mode is selected.

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: sql
    command: select "Session State".
    severity: medium
    info: 'Note: If ASP.NET is not installed, this is Not Applicable.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Open the IIS 10.0 Manager.

      Click the site name.

      Under the "ASP.NET" section, select "Session State".

      Under "Session State Mode Settings", verify the "In Process" mode is selected.

      If the "Session State Mode Settings" is set to "In Process", this is not a finding.

      '
- id: '1.2'
  title: IIST-SI-000202
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website session state cookie settings must be configured to Use Cookies mode. GROUP ID: V-218736
    RULE ID: SV-218736r1022669'
  rationale: When the session information is stored on the client, the session ID, along with the user authorization and identity
    information, is sent along with each client request and is stored in either a cookie, embedded in the uniform resource
    locator (URL), or placed in a hidden field on the displayed form. Each of these offers advantages and disadvantages. The
    biggest disadvantage to all three is the hijacking of a session along with all of the user's credentials. When the user
    authorization and identity information is stored on the server in a protected and encrypted database, the communication
    between the client and website will only send the session identifier, and the server can then retrieve user credentials
    for the session when needed. If, during transmission, the session were to be hijacked, the user's credentials would not
    be compromised. ASP.NET provides a session state, which is available as the HttpSessionState class, as a method of storing
    session-specific information visible only within the session. ASP.NET session state identifies requests from the same
    browser during a limited time window as a session and provides the ability to persist variable values for the duration
    of that session. When using the URI mode for cookie settings under session state, IIS will reject and reissue session
    IDs that do not have active sessions. Configuring IIS to expire session IDs and regenerate tokens gives a potential attacker
    less time to capture a cookie and gain access to server content.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Note: If ASP.NET is not installed, this is Not Applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the "ASP.NET" section, select "Session State".

    Under "Cookie Settings", verify the "Use Cookies" mode is selected from the "Mode:"

    drop-down list.

    If the "Use Cookies" mode is selected, this is not a finding.

    Alternative method:

    Click the site name.

    Select "Configuration Editor" under the "Management" section.

    From the "Section:" drop-down list at the top of the configuration editor, locate

    "system.web/sessionState".

    Verify the "cookieless" is set to "UseCookies".

    If the "cookieless" is not set to "UseCookies", this is a finding.

    Note: If IIS 10.0 server/site is used only for system-to-system maintenance, does not

    allow users to connect to interface, and is restricted to specific system IPs, this is Not

    Applicable.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Under the ASP.NET section, select "Session State".

    Under "Cookie Settings", select the "Use Cookies" from the "Mode:" drop-down list.

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: sql
    command: select "Session State".
    severity: medium
    info: 'Note: If ASP.NET is not installed, this is Not Applicable.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Open the IIS 10.0 Manager.

      Click the site name.

      Under the "ASP.NET" section, select "Session State".

      Under "Cookie Settings", verify the "Use Cookies" mode is selected from the "Mode:"

      drop-down list.

      If the "Use Cookies" mode is selected, this is not a finding.

      A'
- id: '1.3'
  title: IIST-SI-000203
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'A private IIS 10.0 website must only accept Secure Socket Layer (SSL) connections. GROUP ID: V-218737 RULE
    ID: SV-218737r1022671'
  rationale: Transport Layer Security (TLS) encryption is a required security setting for a private web server. Encryption
    of private information is essential to ensuring data confidentiality. If private information is not encrypted, it can
    be intercepted and easily read by an unauthorized party. A private web server must use a FIPS 140-2-approved TLS version,
    and all non-FIPS-approved SSL versions must be disabled. NIST SP 800-52 specifies the preferred configurations for government
    systems.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Note: If the server being reviewed is a public IIS 10.0 web server, this is Not Applicable.

    Note: If the server is hosting SharePoint, this is Not Applicable.

    Note: If the server is hosting WSUS, this is Not Applicable.

    Note: If SSL is installed on load balancer/proxy server through which traffic is routed to

    the IIS 10.0 server, and the IIS 10.0 server receives traffic from the load balancer/proxy

    server, the SSL requirement must be met on the load balancer/proxy server and is Not

    Applicable in this STIG.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Double-click the "SSL Settings" icon.

    Verify "Require SSL" check box is selected.

    If the "Require SSL" check box is not selected, this is a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Double-click the "SSL Settings" icon.

    Select "Require SSL" check box.

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: manual_review
    info: 'Note: If the server being reviewed is a public IIS 10.0 web server, this is Not Applicable.

      Note: If the server is hosting SharePoint, this is Not Applicable.

      Note: If the server is hosting WSUS, this is Not Applicable.

      Note: If SSL is installed on load balancer/proxy server through which traffic is routed to

      the IIS 10.0 server, and the IIS 10.0 server receives traffic from the load balancer/proxy

      server, the SSL requirement must be met on the load balancer/proxy server and is Not

      Applicable in'
    severity: medium
