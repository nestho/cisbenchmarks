  description: 'The IIS 10.0 website must be configured to limit the maxURL. GROUP ID: V-218753 RULE ID: SV-218753r961152'
  rationale: Request filtering replaces URLScan in IIS, enabling administrators to create a more granular rule set with which
    to allow or reject inbound web content. By setting limits on web requests, it helps to ensure availability of web services
    and may also help mitigate the risk of buffer overflow type attacks. The MaxURL Request Filter limits the number of bytes
    the server will accept in a URL.
  impact: ''
  references: []
