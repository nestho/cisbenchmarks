- id: '1.27'
  title: IIST-SI-000236
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 websites connectionTimeout setting must be explicitly configured to disconnect an idle session.
    GROUP ID: V-218763 RULE ID: SV-218763r1043182'
  rationale: Leaving sessions open indefinitely is a major security risk. An attacker can easily use an already authenticated
    session to access the hosted application as the previously authenticated user. By closing sessions after a set period
    of inactivity, the web server can make certain that those sessions that are not closed through the user logging out of
    an application are eventually closed. Acceptable values are 5 minutes for high-value applications, 10 minutes for mediumvalue
    applications, and 15 minutes for low-value applications.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Select "Configuration Editor" under the "Management" section.

    From the "Section:" drop-down list at the top of the configuration editor, locate

    "system.web/sessionState".

    Verify the "timeout" is set to "00:15:00 or less”.

    If "timeout" is not set to "00:15:00 or less”, this is a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Select "Configuration Editor" under the "Management" section.

    From the "Section:" drop-down list at the top of the configuration editor, locate

    "system.web/sessionState".

    Set the "timeout" to "00:15:00 or less”.

    In the "Actions" pane, click "Apply".'
