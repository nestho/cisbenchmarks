- id: '1.36'
  title: IIST-SI-000252
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The maximum number of requests an application pool can process for each IIS 10.0 website must be explicitly
    set. GROUP ID: V-218772 RULE ID: SV-218772r1022694'
  rationale: IIS application pools can be periodically recycled to avoid unstable states possibly leading to application crashes,
    hangs, or memory leaks. By default, application pool recycling is overlapped, which means the worker process to be shut
    down is kept running until after a new worker process is started. After a new worker process starts, new requests are
    passed to it. The old worker process shuts down after it finishes processing its existing requests, or after a configured
    time-out, whichever comes first. This way of recycling ensures uninterrupted service to clients.
  impact: ''
  references: []
  page_start: 80
  audit_raw: 'Note: If the IIS Application Pool is hosting Microsoft SharePoint, this is Not Applicable.

    Note: If this server is hosting WSUS, this requirement is Not Applicable.

