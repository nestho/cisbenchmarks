- id: '1.42'
  title: IIST-SI-000263
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Backup interactive scripts on the IIS 10.0 server must be removed. GROUP ID: V-218781 RULE ID: SV-218781r1022700'
  rationale: Copies of backup files will not execute on the server, but they can be read by the anonymous user if special
    precautions are not taken. Such backup copies contain the same sensitive information as the actual script being executed
    and, as such, are useful to malicious users. Techniques and systems exist today to search web servers for such files and
    are able to exploit the information contained in them.
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'If the website does not utilize CGI, this finding is Not Applicable.

    Open the IIS 10.0 Manager.

    Right-click the IIS 10.0 web site name and select "Explore".

    Search for the listed script extensions

    Search for the following files: *.bak, *.old, *.temp, *.tmp, *.backup, or “copy of...”.

    If files with these extensions are found, this is a finding.'
  remediation: Remove the backup files from the production web server.
  checks:
  - type: manual_review
    info: 'If the website does not utilize CGI, this finding is Not Applicable.

      Open the IIS 10.0 Manager.

      Right-click the IIS 10.0 web site name and select "Explore".

      Search for the listed script extensions

      Search for the following files: *.bak, *.old, *.temp, *.tmp, *.backup, or “copy of...”.

      If files with these extensions are found, this is a finding.'
    severity: medium
- id: '1.43'
  title: IIST-SI-000264
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The required DoD banner page must be displayed to authenticated users accessing a DoD private website. GROUP
    ID: V-218782 RULE ID: SV-218782r1111818'
  rationale: A consent banner will be in place to inform prospective entrants the website they are about to enter is a DoD
    website and their activity is subject to monitoring. The document, DoDI 8500.01, establishes the policy on the use of
    DoD information systems. It requires the use of a standard Notice and Consent Banner and standard text to be included
    in user agreements. The requirement for the banner is for websites with security and access controls. These are restricted
    and not publicly accessible. If the website does not require authentication/authorization for use, then the banner does
    not need to be present. A manual check of the document root directory for a banner page file (such as banner.html) or
    navigation to the website via a browser can be used to confirm the information provided from interviewing the web staff.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'Note: This requirement is only applicable for private DOD websites.

    Note: If the server being reviewed is hosting WSUS, this is not applicable.

    If a banner is required, the following banner page must be in place:

    “You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    • At any time, the USG may inspect and seize data stored on this IS.

    • Communications using, or data stored on, this IS are not private, are subject to

    routine monitoring, interception, and search, and may be disclosed or used for

    any USG-authorized purpose.

    • This IS includes security measures (e.g., authentication and access controls) to

    protect USG interests—not for your personal benefit or privacy.

    • Notwithstanding the above, using this IS does not constitute consent to PM, LE

    or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or services

    by attorneys, psychotherapists, or clergy, and their assistants. Such

    communications and work product are private and confidential. See User

    Agreement for details.”

    OR

    If your system cannot meet the character limits to store this amount of text in the

    banner, the following is another option for the warning banner:

    "I''ve read & consent to terms in IS user agreem''t."

    NOTE: While DoDI 8500.01 does not contain a copy of the banner to be used, it does

    point to the RMF Knowledge Service for a copy of the required text. It is also noted that

    the banner is to be displayed only once when the individual enters the site and not for

    each page.

    If the access-controlled website does not display this banner page before entry, this is a

    finding.'
  remediation: 'Configure a DoD private website to display the required DoD banner page when

    authentication is required for user access.'
  checks:
  - type: manual_review
    info: 'Note: This requirement is only applicable for private DOD websites.

      Note: If the server being reviewed is hosting WSUS, this is not applicable.

      If a banner is required, the following banner page must be in place:

