- id: '1.10'
  title: IIST-SI-000215
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Mappings to unused and vulnerable scripts on the IIS 10.0 website must be removed. GROUP ID: V-218744 RULE
    ID: SV-218744r960963'
  rationale: IIS 10.0 will either allow or deny script execution based on file extension. The ability to control script execution
    is controlled through two features with IIS 10.0, Request Filtering and Handler Mappings. For Handler Mappings, the ISSO
    must document and approve all allowable file extensions the website allows (white list) and denies (black list). The white
    list and black list will be compared to the Handler Mappings in IIS 8. Handler Mappings at the site level take precedence
    over Handler Mappings at the server level.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Note: If the server being reviewed is hosting SharePoint, this is Not Applicable.

    For Handler Mappings, the ISSO must document and approve all allowable scripts the

    website allows (white list) and denies (black list). The white list and black list will be

    compared to the Handler Mappings in IIS 10.0. Handler Mappings at the site level take

    precedence over Handler Mappings at the server level.

    Open the IIS 10.0 Manager.

    Click the site name under review.

    Double-click "Handler Mappings".

    If any script file extensions from the black list are enabled, this is a finding.'
  remediation: 'Open the IIS 10.0 Manager.

    Click the site name under review.

    Double-click "Handler Mappings".

    Remove any script file extensions listed on the black list that are enabled.

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: manual_review
    info: 'Note: If the server being reviewed is hosting SharePoint, this is Not Applicable.

      For Handler Mappings, the ISSO must document and approve all allowable scripts the

      website allows (white list) and denies (black list). The white list and black list will be

      compared to the Handler Mappings in IIS 10.0. Handler Mappings at the site level take

