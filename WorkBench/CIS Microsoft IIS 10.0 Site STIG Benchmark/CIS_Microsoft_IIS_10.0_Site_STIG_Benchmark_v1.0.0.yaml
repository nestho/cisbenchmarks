  title: IIST-SI-000241
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must only accept client certificates issued by DOD PKI or DODapproved PKI Certification
    Authorities (CAs). GROUP ID: V-218767 RULE ID: SV-218767r1111811'
  rationale: The use of a DOD PKI certificate ensures clients the private website they are connecting to is legitimate, and
    is an essential part of the DOD defense-in-depth strategy.
