    is controlled through two features with IIS 10.0, Request Filtering and Handler Mappings. For Request Filtering, the ISSO
    must document and approve all allowable file extensions the website allows (white list) and denies (black list) by the
    website. The white list and black list will be compared to the Request Filtering in IIS 10.0. Request Filtering at the
    site level take precedence over Request Filtering at the server level.
