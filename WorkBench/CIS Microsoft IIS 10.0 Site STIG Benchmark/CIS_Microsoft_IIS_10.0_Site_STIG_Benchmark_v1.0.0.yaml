    severity: medium
- id: '1.29'
  title: IIST-SI-000238
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must use a logging mechanism configured to allocate log record storage capacity large
    enough to accommodate the logging requirements of the IIS 10.0 website. GROUP ID: V-218765 RULE ID: SV-218765r961392'
  rationale: To make certain the logging mechanism used by the web server has sufficient storage capacity in which to write
    the logs, the logging mechanism must be able to allocate log record storage capacity. The task of allocating log record
    storage capacity is usually performed during initial installation of the logging mechanism. The system administrator will
    usually coordinate the allocation of physical drive space with the web server administrator along with the physical location
    of the partition and disk. Refer to NIST SP 800-92 for specific requirements on log rotation and storage dependent on
    the impact of the web server.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Access the IIS 10.0 web server IIS 10.0 Manager.

    Under "IIS" double-click on the "Logging" icon.

    In the "Logging" configuration box, determine the "Directory:" to which the "W3C"

    logging is being written.

    Confirm with the System Administrator that the designated log path is of sufficient size

    to maintain the logging.

    Under "Log File Rollover", verify "Do not create new log files" is not selected.

    Verify a schedule is configured to rollover log files on a regular basis.

    Consult with the System Administrator to determine if there is a documented process for

    moving the log files off of the IIS 10.0 web server to another logging device.

    If the designated logging path device is not of sufficient space to maintain all log files

    and there is not a schedule to rollover files on a regular basis, this is a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Under "IIS" double-click on the "Logging" icon.

    If necessary, in the "Logging" configuration box, redesignate a log path to a location

    able to house the logs.

    Under "Log File Rollover", deselect the "Do not create new log files" setting.

    Configure a schedule to rollover log files on a regular basis.'
  checks:
  - type: manual_review
    info: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Access the IIS 10.0 web server IIS 10.0 Manager.

      Under "IIS" double-click on the "Logging" icon.

