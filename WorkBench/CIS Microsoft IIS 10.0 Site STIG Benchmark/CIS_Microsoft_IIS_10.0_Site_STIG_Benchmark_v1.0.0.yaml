- id: '1.28'
  title: IIST-SI-000237
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must provide the capability to immediately disconnect or disable remote access to the
    hosted applications. GROUP ID: V-218764 RULE ID: SV-218764r961281'
  rationale: During an attack on the web server or any of the hosted applications, the system administrator may need to disconnect
    or disable access by users to stop the attack. The web server must provide a capability to disconnect users to a hosted
    application without compromising other hosted applications unless deemed necessary to stop the attack. Methods to disconnect
    or disable connections are to stop the application service for a specified hosted application, stop the web server, or
    block all connections through web server access list. The web server capabilities used to disconnect or disable users
    from connecting to hosted applications and the web server must be documented to make certain that during an attack, the
    proper action is taken to conserve connectivity to any other hosted application if possible and to make certain log data
    is conserved for later forensic analysis.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'Interview the System Administrator and Web Manager.

    Ask for documentation for the IIS 10.0 web server administration.

    Verify there are documented procedures for shutting down an IIS 10.0 website in the

    event of an attack. The procedure should, at a minimum, provide the following steps:

    Determine the respective website for the application at risk of an attack.

    Access the IIS 10.0 web server IIS 10.0 Manager.

    Select the respective website.

    In the "Actions" pane, under "Manage Website", click "Stop".

    If necessary, stop all websites.

    If necessary, stop the IIS 10.0 web server by selecting the web server in the IIS 10.0

    Manager.

    In the "Actions" pane, under "Manage Server", click "Stop".

    If there are not documented procedures with, at a minimum, the mentioned steps for

    stopping a website, this is a finding.'
  remediation: 'Prepare documented procedures for shutting down an IIS 10.0 website in the event of

    an attack. The procedure should, at a minimum, provide the following steps:

    Determine the respective website for the application at risk of an attack.

    Access the IIS 10.0 web server IIS 10.0 Manager.

    Select the respective website.

    In the "Actions" pane, under "Manage Website", click "Stop".

    If necessary, stop all websites.

    If necessary, stop the IIS 10.0 web server by selecting the web server in the IIS 10.0

    Manager.

    In the "Actions" pane, under "Manage Server", click "Stop".'
  checks:
  - type: manual_review
    info: 'Interview the System Administrator and Web Manager.

