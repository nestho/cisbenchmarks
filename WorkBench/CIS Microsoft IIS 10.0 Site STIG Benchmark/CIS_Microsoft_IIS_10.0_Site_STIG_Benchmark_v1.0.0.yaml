      selected.

      If the "Both log file and ETW event" radio button is not selected, this is a finding.

      Note: "Microsoft-IIS-Logging/logs" must be enabled prior to configuring this setting.

      More co'
    severity: medium
- id: '1.6'
  title: IIST-SI-000208
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'An IIS 10.0 website behind a load balancer or proxy server must produce log records containing the source
    client IP, and destination information. GROUP ID: V-218740 RULE ID: SV-218740r960900'
  rationale: Web server logging capability is critical for accurate forensic analysis. Without sufficient and accurate information,
    a correct replay of the events cannot be determined. Ascertaining the correct source (e.g., source IP), of the events
    is important during forensic analysis. Correctly determining the source of events will add information to the overall
    reconstruction of the loggable event. By determining the source of the event correctly, analysis of the enterprise can
    be undertaken to determine if events tied to the source occurred in other areas within the enterprise. A web server behind
    a load balancer or proxy server, when not configured correctly, will record the load balancer or proxy server as the source
    of every loggable event. When looking at the information forensically, this information is not helpful in the investigation
    of events. The web server must record with each event the client source of the event.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Interview the System Administrator to review the configuration of the IIS 10.0

    architecture and determine if inbound web traffic is passed through a proxy.

    If the IIS 10.0 is receiving inbound web traffic through a proxy, the audit logs must be

    reviewed to determine if correct source information is being passed through by the

    proxy server.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Open the IIS 10.0 Manager.

    Click the site name.

    Click the "Logging" icon.

    Click "View log file".

    When log file is displayed, review source IP information in log entries and verify entries

    do not reflect the IP address of the proxy server.

    If the website is not behind a load balancer or proxy server, this is Not Applicable.

    If the log entries in the log file(s) reflect the IP address of the proxy server as the

    source, this is a finding.

    If provisions have been made to log the client IP via another field (i.e., utilizing XForwarded-For), this is not a finding.'
  remediation: 'Access the proxy server through which inbound web traffic is passed and configure

    settings to pass web traffic to the IIS 10.0 web server transparently.'
  checks:
  - type: manual_review
    info: 'Interview the System Administrator to review the configuration of the IIS 10.0

      architecture and determine if inbound web traffic is passed through a proxy.

      If the IIS 10.0 is receiving inbound web traffic through a proxy, the audit logs must be

      reviewed to determine if correct source information is being passed through by the

      proxy server.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Open the IIS 10.0 Manager.

      Click the site name.

      Click the "Logging" icon.

      Click "'
    severity: medium
- id: '1.7'
  title: IIST-SI-000209
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IIS 10.0 website must produce log records that contain sufficient information to establish the outcome
    (success or failure) of IIS 10.0 website events. GROUP ID: V-218741 RULE ID: SV-218741r1022677'
  rationale: Web server logging capability is critical for accurate forensic analysis. Without sufficient and accurate information,
    a correct replay of the events cannot be determined. Ascertaining the success or failure of an event is important during
    forensic analysis. Correctly determining the outcome will add information to the overall reconstruction of the loggable
    event. By determining the success or failure of the event correctly, analysis of the enterprise can be undertaken to determine
    if events tied to the event occurred in other areas within the enterprise. Without sufficient information establishing
    the success or failure of the logged event, investigation into the cause of event is severely hindered. The success or
    failure also provides a means to measure the impact of an event and help authorized personnel to determine the appropriate
    response. Log record content that may be necessary to satisfy the requirement of this control includes, but is not limited
    to, time stamps, source and destination IP addresses, user/process identifiers, event descriptions, applicationspecific
    events, success/fail indications, file names involved, access control, or flow control rules invoked.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Note: If this server is hosting WSUS, this requirement is Not Applicable.

    Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Select the website being reviewed.

    Under "IIS", double-click the "Logging" icon.

    Verify the "Format:" under "Log File" is configured to "W3C".

    Select "Fields".

    Under "Custom Fields", verify the following fields are selected:

    Request Header >> Connection

    Request Header >> Warning

    If any of the above fields are not selected, this is a finding.'
  remediation: 'Follow the procedures below for each site hosted on the IIS 10.0 web server:

    Select the website being reviewed.

    Under "IIS", double-click the "Logging" icon.

    Configure the "Format:" under "Log File" to "W3C".

    Select "Fields".

    Under "Custom Fields", select the following fields:

    Request Header >> Connection

    Request Header >> Warning

    Click "OK".

    Select "Apply" from the "Actions" pane.'
  checks:
  - type: manual_review
    info: 'Note: If this server is hosting WSUS, this requirement is Not Applicable.

      Follow the procedures below for each site hosted on the IIS 10.0 web server:

      Select the website being reviewed.

      Under "IIS", double-click the "Logging" icon.

      Verify the "Format:" under "Log File" is configured to "W3C".

      Select "Fields".

      Under "Custom Fields", verify the following fields are selected:

      Request Header >> Connection

      Request Header >> Warning

      If any of the above fields are not selected, this is a finding.'
    severity: medium
