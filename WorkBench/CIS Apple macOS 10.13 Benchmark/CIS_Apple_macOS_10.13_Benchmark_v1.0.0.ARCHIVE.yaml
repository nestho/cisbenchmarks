- id: '7.1'
  title: Wireless technology on macOS
  scoring: scored
  profile:
  - Level 2
  description: Some organizations have comprehensive rules that cover the use of wireless technologies in order to implement
    operational security. There are specific policies governing the use of both Bluetooth and Wi-Fi (802.11) that often include
    disabling the wireless capability in either software or hardware or both. Wireless access is part of the feature set required
    for mobile computers and is considered essential for most users. The general use case for macOS is to use wireless connectivity,
    Apple provides a wireless network card and Bluetooth capability in almost every product they make. Bluetooth keyboards
    are now the default selection where a keyboard is not already integrated into the device. There are instructions on how
    to remove parts of the operating system in order to remediate wireless connectivity but they are not recommended within
    the scope of this Benchmark. https://apple.stackexchange.com/questions/99686/how-to-easily-and-completelydisable-enable-wlan-so-it-cannot-be-turned-on-agai
