  title: iCloud Drive Document sync
  scoring: scored
  profile:
  - Level 2
  description: With macOS 10.12 Apple introduced the capability to have a user's Documents folder automatically synchronize
    to the user's iCloud Drive, providing they have enough room purchased through Apple on their iCloud drive. This capability
    mirrors what Microsoft is doing with the use of OneDrive and Office 365. There are concerns with using this capability.
    The storage space that Apple provides for free is used by users with iCloud mail, all of a user's Photo Library created
    with the ever larger Multi-Pixel iPhone cameras and all of the iOS Backups. Adding a synchronization capability for users
    who have files going back a decade or more and storage may be tight without much larger Apple charges than the free 5GB.
    Users with multiple computers running 10.12 and above with unique content on each will have issues as well. Enterprise
    users may not be allowed to store Enterprise information in a third party public cloud. In previous implementations iCloud
    Drive or even DropBox the user selected what files were synchronized even if there were no other controls. The new feature
    synchronizes all files in a folder widely used to put working files. The automatic synchronization of all files in a user's
    Documents folder should be disabled. https://derflounder.wordpress.com/2016/09/23/icloud-desktop-and-documents-inmacos-sierra-the-good-the-bad-and-the-ugly/
