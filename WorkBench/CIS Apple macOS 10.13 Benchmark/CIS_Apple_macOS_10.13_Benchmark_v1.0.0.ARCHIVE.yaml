- id: '2.11'
  title: Java 6 is not the default Java runtime
  scoring: scored
  profile:
  - Level 2
  description: Apple had made Java part of the core Operating System for macOS. Apple is no longer providing Java updates
    for macOS and updated JREs and JDK are made available by Oracle. The latest version of Java 6 made available by Apple
    has many unpatched vulnerabilities and should not be the default runtime for Java applets that request one from the Operating
    System
  rationale: Java has been one of the most exploited environments and Java 6, which was provided as an OS component by Apple,
    is no longer maintained by Apple or Oracle. The old versions provided by Apple are both unsupported and missing the more
    modern security controls that have limited current exploits. The EOL version may still be installed and should be removed
    from the computer or not be in the default path.
  impact: Old applications may rely on either an Apple supplied version of Java 6 or an updated JDK. 91 | P a g e
