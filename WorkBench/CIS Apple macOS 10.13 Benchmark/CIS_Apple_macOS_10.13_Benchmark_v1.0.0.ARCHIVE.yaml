- id: '3.2'
  title: Configure Security Auditing Flags
  scoring: scored
  profile:
  - Level 2
  description: Auditing is the capture and maintenance of information about security-related events.
  rationale: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises or attacks that have occurred, have begun, or are about to begin. Audit logs are
    necessary to provide a trail of evidence in case the system or network is compromised.
  impact: ''
  references: []
  page_start: 96
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo egrep "^flags:" /etc/security/audit_control

    2. Ensure at least the following flags are present:

     lo - audit successful/failed login/logout events

     ad - audit successful/failed administrative events

     fd - audit successful/failed file deletion events

     fm - audit successful/failed file attribute modification events

     -all - audit all failed events across all audit classes

    Note: excluding potentially noisy audit events may be ideal, depending on your use-case.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and edit the /etc/security/audit_control file

    2. Find the line beginning with "flags"

    3. Add the following flags: lo, ad, fd, fm, -all.

    4. Save the file.

