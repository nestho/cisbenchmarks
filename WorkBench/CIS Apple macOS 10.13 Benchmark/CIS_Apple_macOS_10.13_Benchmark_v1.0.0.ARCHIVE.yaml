- id: '5.20'
  title: Disable Fast User Switching
  scoring: scored
  profile:
  - Level 2
  description: Fast user switching allows a person to quickly log in to the computer with a different account. While only
    a minimal security risk, when a second user is logged in, that user might be able to see what processes the first user
    is using, or possibly gain other information about the first user. In a large directory environment where it is difficult
    to limit login access many valid users can login to other user's assigned computers.
  rationale: Fast user switching allows multiple users to run applications simultaneously at console. There can be information
    disclosed about processes running under a different user. Without a specific configuration to save data and log out users
    can have unsaved data running in a background session that is not obvious.
  impact: 'Where support staff visit users computers consoles they will not be able to log in to their own session if there
    is an active and locked session. Notes: macOS is a multi-user operating system, and there are other similar methods that
    might provide the same kind of risk. The Remote Login service that can be turned on in the Sharing System Preferences
    pane is another. 154 | P a g e'
  references: []
  page_start: 154
  audit_raw: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

    checkbox is off.'
  remediation: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

    checkbox is off.'
  checks:
  - type: manual_review
    info: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

      checkbox is off.'
    severity: medium
- id: '5.21'
  title: Secure individual keychains and items
  scoring: scored
  profile:
  - Level 2
  description: By default, the keychain for an account, especially a local account, have the same password as the account's
    logon password. It is possible to change the passwords on keychains to something different than the login password, and
    doing so would keep that keychain locked until needed after login. This is especially important when a smartcard is being
    used for console login. Keychains need to be protected by more than a pin in order to be secured and the default behavior
    with a smartcard will result in a pin for the login password. Individual keychain entries can have special ACLs to increase
    security as well.
  rationale: Each keychain entry can have different access controls. It's possible to set the keychain item to require a keychain
    password every time an item is accessed, even if the keychain is unlocked. This level of security could be useful for
    bank passwords or other passwords that need extra security.
  impact: Having to enter the keychain password for each access could become inconvenient and/or tedious for users. 155 |
    P a g e
  references: []
  page_start: 155
  audit_raw: '1. Open Utilities

    2. Select Keychain Access

    3. Double-click keychain

    4. Select Access Control

    5. Verify if the box next to "Ask for Keychain Password" is checked'
  remediation: '1. Open Utilities

    2. Select Keychain Access

