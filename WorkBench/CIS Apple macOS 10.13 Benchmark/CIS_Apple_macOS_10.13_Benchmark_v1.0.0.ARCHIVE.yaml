- id: '7.10'
  title: Repairing permissions is no longer needed
  scoring: scored
  profile:
  - Level 1
  description: With the introduction of System Integrity Protection (SIP) Apple has removed the necessity of repairing permissions.
    In earlier versions of the Operating System repair permissions checked the receipt files of installed software and ensured
    that the existing permissions in the file system matched what the receipts said it should. System integrity protection
    manages and blocks permission to certain directories continuously. http://www.macissues.com/2015/10/02/about-os-x-10-11-el-capitan-and-permissionsfixes/
