- id: '5.8'
  title: Ensure login keychain is locked when the computer sleeps
  scoring: scored
  profile:
  - Level 2
  description: The login keychain is a secure database store for passwords and certificates and is created for each user account
    on macOS. The system software itself uses keychains for secure storage. Anyone with physical access to an unlocked keychain
    where the screen is also unlocked can copy all passwords in that keychain. The approach recommended here is that the login
    keychain be set to lock when when the computer sleeps to reduce the risk of password exposure. Organizations that use
    Firefox and Thunderbird will have a much different tolerance than those organization using keychain aware applications
    extensively.
  rationale: While logged in, the keychain does not prompt the user for passwords for various systems and/or programs. This
    can be exploited by unauthorized users to gain access to password protected programs and/or systems in the absence of
    the user.
  impact: The user may experience multiple prompts to unlock the keychain when waking from sleep. 140 | P a g e
  references: []
