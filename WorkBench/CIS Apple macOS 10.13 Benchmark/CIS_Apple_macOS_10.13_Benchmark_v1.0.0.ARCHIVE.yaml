- id: 2.4.8
  title: Disable File Sharing
  scoring: scored
  profile:
  - Level 1
  description: 'Apple''s File Sharing uses a combination of SMB (Windows sharing) and AFP (Mac sharing) Two common ways to
    share files using File Sharing are: 1. Apple File Protocol (AFP) AFP automatically uses encrypted logins, so this method
    of sharing files is fairly secure. The entire hard disk is shared to administrator user accounts. Individual home folders
    are shared to their respective user accounts. Users'' "Public" folders (and the "Drop Box" folder inside) are shared to
    any user account that has sharing access to the computer (i.e. anyone in the "staff" group, including the guest account
    if it is enabled). 2. Server Message Block (SMB), Common Internet File System (CIFS) When Windows (or possibly Linux)
    computers need to access file shared on a Mac, SMB/CIFS file sharing is commonly used. Apple warns that SMB sharing stores
    passwords is a less secure fashion than AFP sharing and anyone with system access can gain access to the password for
    that account. When sharing with SMB, each user that will access the Mac must have SMB enabled.'
  rationale: By disabling file sharing, the remote attack surface and risk of unauthorized access to files stored on the system
    is reduced. 47 | P a g e
  impact: File Sharing can be used to share documents with other users but hardened servers should be used rather than user
    endpoints. Turning on file sharing increases the visibility and attack surface of a system unnecessarily. 48 | P a g e
  references: []
  page_start: 47
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal to check the Apple File Server status:

    sudo launchctl list | egrep AppleFileServer

    2. Ensure no output is present

