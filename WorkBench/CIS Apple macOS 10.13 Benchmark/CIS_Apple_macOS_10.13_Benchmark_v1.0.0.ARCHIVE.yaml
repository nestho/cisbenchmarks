  title: Automatic Actions for Optical Media
  scoring: scored
  profile:
  - Level 1
  description: Managing automatic actions, while useful in very few situations, is unlikely to increase security on the computer
    and does complicate the users experience and add additional complexity to the configuration. These settings are user controlled
