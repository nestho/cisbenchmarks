- id: '5.23'
  title: System Integrity Protection status
  scoring: scored
  profile:
  - Level 1
  description: System Integrity Protection is a security feature introduced in OS X 10.11 El Capitan. System Integrity Protection
    restricts access to System domain locations and restricts runtime attachment to system processes. Any attempt to attempt
    to inspect or attach to a system process will fail. Kernel Extensions are now restricted to /Library/Extensions and are
    required to be signed with a Developer ID.
  rationale: Running without System Integrity Protection on a production system runs the risk of the modification of system
    binaries or code injection of system processes that would otherwise be protected by SIP.
  impact: System binaries and processes could become compromised 158 | P a g e 6 User Accounts and Environment Account management
    is a central part of security for any computer system including macOS. General practices should be followed to ensure
    that all accounts on a system are still needed and that default accounts have been removed. Users with admin roles should
    have distinct accounts for Admin functions as well as day to day work where the passwords are different and known only
    by the user assigned to the account. Accounts with Elevated privileges should not be easily discerned from the account
    name from standard accounts. When any computer system is added to a Directory System there are additional controls available
    including user account management that are not available in a standalone computer. One of the drawbacks is the local computer
    is no longer in control of the accounts that can access or manage it if given permission. For macOS if the computer is
    connected to a Directory any standard user can now login to the computer at console which by default may be desirable
    or not depending on the use case. If an admin group is allowed to administer the local computer the membership of that
    group is controlled completely in the Directory. macOS computers connected to a Directory should be configured so that
    the risk is appropriate for the mission use of the computer. Only those accounts that require local authentication should
    be allowed, only required administrator accounts should be in the local administrator group. Authenticated Users for console
    access and Domain Admins for Administration may be too broad or too limited 159 | P a g e 6.1 Accounts Preferences Action
    Items Proper account management is critical to computer security. Many options and settings in the Account System Preference
    Pane can be used to increase the security of the Mac.
  references: []
