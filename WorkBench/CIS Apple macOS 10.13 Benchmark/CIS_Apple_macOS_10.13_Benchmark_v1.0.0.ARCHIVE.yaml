- id: '6.4'
  title: Safari disable Internet Plugins for global use
  scoring: scored
  profile:
  - Level 2
  description: Starting with Safari 10 and continuing with 11 Apple changed the model on how the builtin web browser handles
    Internet Plug-Ins. Instead of using a global approach where the Plug-in is either on or off for all sites the default
    decision is about allowing, not allowing, or allowing permanently for a specific site that is visited. Other browsers
    are moving to stop using Plug-ins altogether and insist on the use of HTML 5 for rich content. Only allowing Plug-in content
    from specific sites is a viable security option. In the Security Preferences, Plug-in settings it is possible to override
    the security feature and enable Plug-in content globally by Plug-in. With the controls planned in other macOS browsers
    allowing content globally is likely to put Safari users more at risk than other browser users. There are three options
    for Internet Plug-ins with Safari 10 "When visiting other websites" Ask, Off or On. The on setting should not be used.
    https://support.apple.com/en-us/HT202819
  rationale: Allow Internet Plugins only on required sites
