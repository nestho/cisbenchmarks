- id: '7.14'
  title: System information backup to remote computers
  scoring: scored
  profile:
  - Level 2
  description: It is best practice to ensure that local computers are not a single point of failure for logging and auditing
    records about activity on the computer itself. Whether end user activity or system process information a mechanism should
    be in place to transfer the logs to another system that is hardened to receive them. A hardened log host reduces the risk
    of failure or compromise, particularly with user end points. From an enterprise management standpoint those records should
    be reviewed to ensure that there is not a common exploitable vulnerability, system bug or even hardware issue that can
    affect other devices in the environment. With changes in Apple's logging methods in the last few years third party tools
    appear to be preferred to ensure logs and records are obtained appropriately. Aggressive retention likely requires more
    space than available on built-in SSDs even if offline Time Machine backups are large and pristine. Please ensure that
    solutions to capture and retain log and audit records are in place. 189 | P a g e
