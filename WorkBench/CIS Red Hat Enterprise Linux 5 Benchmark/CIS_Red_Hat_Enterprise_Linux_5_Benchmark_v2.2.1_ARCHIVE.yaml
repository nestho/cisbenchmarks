- id: 8.1.2
  title: Remove OS Information from Login Warning Banners
  scoring: scored
  profile:
  - Level 1
  description: 'Unix-based systems have typically displayed information about the OS release and patch level upon logging
    in to the system. This information can be useful to developers who are developing software for a particular OS platform.
    If mingetty(8) supports the following options, they display operating system information: \m - machine architecture (uname
    -m) \r - operating system release (uname -r) \s - operating system name \v - operating system version (uname -v)'
  rationale: Displaying OS and patch level information in login banners also has the side effect of providing detailed system
    information to attackers attempting to target specific exploits of a system. Authorized users can easily get this information
    by running the "uname -a" command once they have logged in.
  impact: ''
  references:
  - 1. N/A
  page_start: 361
  audit_raw: 'Perform the following commands to check if OS information is set to be displayed in the

    system login banners:

    # grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep ''^ID='' /etc/os-release | cut -d= -

    f2 | sed -e ''s/"//g''))" /etc/issue

    # grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep ''^ID='' /etc/os-release | cut -d= -

    f2 | sed -e ''s/"//g''))" /etc/motd

    # grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep ''^ID='' /etc/os-release | cut -d= -

    f2 | sed -e ''s/"//g''))" /etc/issue.net'
  remediation: 'Edit the /etc/issue, /etc/motd, and /etc/issue.net files with the appropriate contents

    according to your site policy, remove any instances of \m ,\r ,\s ,\v, or references to the OS

    platform'
  checks:
  - type: manual_review
    info: 'Perform the following commands to check if OS information is set to be displayed in the

      system login banners:

      # grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep ''^ID='' /etc/os-release | cut -d= -

