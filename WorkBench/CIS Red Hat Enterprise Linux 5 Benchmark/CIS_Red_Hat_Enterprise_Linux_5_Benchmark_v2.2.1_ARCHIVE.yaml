  title: Set Lockout for Failed Password Attempts
  scoring: manual
  profile:
  - Level 1
  description: Lock out userIDs after n unsuccessful consecutive login attempts. The first set of changes are made to the
    main PAM configuration file /etc/pam.d/system-auth. The second set of changes are applied to the program specific PAM
    configuration file (in this case, the ssh daemon). The second set of changes must be applied to each program that will
    lock out userID's. Set the lockout number to the policy in effect at your site.
  rationale: Locking out userIDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: ''
  references: []
  page_start: 332
  audit_raw: 'Perform the following to determine the current settings for userID lockout.

