- id: 2.1.1
  title: Remove telnet-server
  scoring: scored
  profile:
  - Level 1
  description: The telnet-server package contains the telnetd daemon, which accepts connections from users from other systems
    via the telnet protocol.
  rationale: The telnet protocol is insecure and unencrypted. The use of an unencrypted transmission medium could allow a
    user with access to sniff network traffic the ability to steal credentials. The ssh package provides an encrypted session
    and stronger security and is included in most Red Hat Linux distributions.
