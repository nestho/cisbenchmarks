- id: '3.6'
  title: Configure Network Time Protocol (NTP)
  scoring: scored
  profile:
  - Level 1
  description: The Network Time Protocol (NTP) is designed to synchronize system clocks across a variety of systems and use
    a source that is highly accurate. The version of NTP delivered with Red Hat can be found at http://www.ntp.org. NTP can
    be configured to be a client and/or a server.
  rationale: It is recommended that physical systems and virtual guests lacking direct access to the physical host's clock
    be configured as NTP clients to synchronize their clocks (especially to support time sensitive security mechanisms like
    Kerberos). This also ensures log files have consistent time records across the enterprise, which aids in forensic investigations.
  impact: ''
  references:
  - 1. http://www.ntp.org
  page_start: 153
  audit_raw: 'The following script checks for the correct parameters on restrict default and restrict -6

    default:

    # grep "restrict default" /etc/ntp.conf

    restrict default kod nomodify nopeer notrap noquery

    # grep "restrict -6 default" /etc/ntp.conf

    restrict -6 default kod nomodify nopeer notrap noquery

    Perform the following to determine if the system is configured to use an NTP Server and

    that the ntp daemon is running as an unprivileged user.

    # grep "^server" /etc/ntp.conf

    server <ntp-server>

    # grep "ntp:ntp" /etc/sysconfig/ntpd

    OPTIONS="-u ntp:ntp -p /var/run/ntpd.pid"

    153 | P a g e'
  remediation: 'Add the following lines to /etc/ntp.conf:

    # Script to fix /etc/ntp.conf

    cp /etc/ntp.conf /tmp/ntp.conf.$$

    egrep -v ''(restrict default|restrict -6 default)'' /tmp/ntp.conf.$$ >

    /etc/ntp.conf

    ed /etc/ntp.conf << END

    0a

    restrict default kod nomodify nopeer notrap noquery

    restrict -6 default kod nomodify nopeer notrap noquery

    .

    w

    q

    END

    Ensure /etc/ntp.conf has an NTP server specified:

    server <ntp-server>

    Note: is the IP address or hostname of a trusted time server. Configuring an NTP server is

    outside the scope of this benchmark.'
  checks:
  - type: manual_review
    info: 'The following script checks for the correct parameters on restrict default and restrict -6

      default:

      # grep "restrict default" /etc/ntp.conf

      restrict default kod nomodify nopeer notrap noquery

      # grep "restrict -6 default" /etc/ntp.conf

      restrict -6 default kod nomodify nopeer notrap noquery

      Perform the following to determine if the system is configured to use an NTP Server and

      that the ntp daemon is running as an unprivileged user.

      # grep "^server" /etc/ntp.conf

      server <ntp-server>

      # grep "ntp:ntp'
