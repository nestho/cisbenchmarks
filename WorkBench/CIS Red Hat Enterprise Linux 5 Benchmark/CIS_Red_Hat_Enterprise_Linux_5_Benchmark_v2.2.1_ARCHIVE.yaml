  description: The default umask determines the permissions of files created by users. The user creating the file has the
    discretion of making their files and directories readable by others via the chmod command. Users who wish to allow their
    files and directories to be readable by others by default may choose a different default umask by inserting the umask
    command into the standard shell configuration files (.profile, .cshrc, etc.) in their home directories.
  rationale: 'Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system. Note: The directives in this section apply to bash and shell. If
    other shells are supported on the system, it is recommended that their configuration files also are checked.'
  impact: ''
  references: []
  page_start: 354
  audit_raw: 'Run the following commands and verify output

    # grep "^umask 077" /etc/bashrc

    umask 077

    # grep "^umask 077" /etc/profile.d/*

    umask 077'
  remediation: 'Edit the /etc/bashrc and /etc/profile.d/cis.sh files (and the appropriate files for any

    other shell supported on your system) and add the following the UMASK parameter as

    shown:

    umask 077

    354 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output

      # grep "^umask 077" /etc/bashrc

      umask 077

      # grep "^umask 077" /etc/profile.d/*

      umask 077'
    severity: medium
