  description: Periodically, Red Hat releases updates to the Red Hat operating system to support new hardware platforms, deliver
    new functionality as well as the bundle together a set of patches that can be tested as a unit.
  rationale: Newer updates may contain security enhancements that would not be available through the standard patching process.
