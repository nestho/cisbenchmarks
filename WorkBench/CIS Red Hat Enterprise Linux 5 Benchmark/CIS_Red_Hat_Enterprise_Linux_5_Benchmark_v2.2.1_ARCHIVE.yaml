- id: 9.1.1
  title: Verify System File Permissions
  scoring: manual
  profile:
  - Level 2
  description: 'The RPM package manager has a number of useful options. One of these, the -V (or - verify) option, can be
    used to verify that system packages are correctly installed. The -V option can be used to verify a particular package
    or to verify all system packages (-Va). If no output is returned, the package is installed correctly. The following table
    describes the meaning of output from the verify option: Code Meaning • S - File size differs. • M - File mode differs
    (includes permissions and file type). • 5 - The MD5 checksum differs. • D - The major and minor version numbers differ
    on a device file. • L - A mismatch occurs in a link. • U - The file ownership differs. • G - The file group owner differs.
    • T - The file time (mtime) differs. The rpm -qf command can be used to determine which package a particular file belongs
    to. For example the following command determines which package the /etc/passwd file belongs to: # rpm -qf /etc/passwd
    setup-2.5.58-7.el5 To verify the settings for the package that controls the /etc/passwd file, run the following: # rpm
    -V setup-2.5.58-7.el5 367 | P a g e Note that you can feed the output of the rpm -qf command to the rpm -V command: #
    rpm -V $(rpm -qf /etc/passwd)'
  rationale: 'It is important to confirm that packaged system files and directories are maintained with the permissions they
    were intended to have from the OS vendor. Note: Since packages and important files may change with new updates and releases,
    it is recommended to verify everything, not just a finite list of files. This can be a time consuming task and is therefore
    not a scorable benchmark item, but is provided for those interested in additional security measures.'
  impact: ''
  references:
  - 1. N/A
  - 2. http://docs.fedoraproject.org/enUS/Fedora_Draft_Documentation/0.1/html/RPM_Guide/index.html
  page_start: 367
  audit_raw: 'Run the following command to review all installed packages.

    Note: this may be very time consuming and may be best scheduled via the cron utility. It is

    recommended that the output of this command be redirected to a file that can be reviewed

    later.

    # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c'
  remediation: 'Correct any discrepancies found and rerun the command until output is clean or risk is

    mitigated or accepted.'
  checks:
  - type: command
    command: '# rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c'
    expected: ''
    severity: medium
    info: 'Run the following command to review all installed packages.

      Note: this may be very time consuming and may be best scheduled via the cron utility. It is

      recommended that the output of this command be redirected to a file that can be reviewed

      later.

      # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c'
