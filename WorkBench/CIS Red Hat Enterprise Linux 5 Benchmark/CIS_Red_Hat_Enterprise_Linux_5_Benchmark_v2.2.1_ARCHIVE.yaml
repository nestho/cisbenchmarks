  title: Upgrade Password Hashing Algorithm to SHA-512
  scoring: scored
  profile:
  - Level 1
  description: The SHA-512 encryption has been available since Red Hat release 5.2,. The commands below change password encryption
    from md5 to sha512 ( a much stronger encryption algorithm). All existing accounts will need to perform a password change
    to upgrade the stored hashes to the new algorithm.
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords.
