controls:
- id: 1.1.1
  title: Create Separate Partition for /tmp
  scoring: scored
  profile:
  - Level 1
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not
    bound to a separate partition. In addition, making /tmp its own file system allows an administrator to set the noexec
    option on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker
    from establishing a hardlink to a system setuid program and wait for it to be updated. Once the program was updated, the
    hardlink would be broken and the attacker would have his own copy of the program. If the program happened to have a security
    vulnerability, the attacker could continue to exploit the known flaw.
  impact: ''
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. CCE-14161-4
  page_start: 20
  audit_raw: 'Verify that there is a /tmp file partition in the /etc/fstab file.

    # grep /tmp /etc/fstab'
  remediation: 'For new installations, check the box to "Review and modify partitioning" and create a

    separate partition for /tmp. For systems that were previously installed, use the Logical

    Volume Manager (LVM) to create partitions.'
  checks:
  - type: manual_review
    info: 'Verify that there is a /tmp file partition in the /etc/fstab file.

      # grep /tmp /etc/fstab'
    severity: medium
- id: 1.1.2
  title: Set nodev option for /tmp Partition
  scoring: scored
  profile:
  - Level 1
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices in /tmp.
  impact: ''
  references:
  - 1. CCE-14412-1
  page_start: 22
  audit_raw: 'Run the following commands to determine if the system is configured as recommended.

    # grep /tmp /etc/fstab | grep nodev

    # mount | grep /tmp | grep nodev

    If either command emits no output then the system is not configured as recommended.'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options). See the

    fstab(5) manual page for more information.

    # mount -o remount,nodev /tmp'
  checks:
  - type: command
    command: '# grep /tmp /etc/fstab | grep nodev && # mount | grep /tmp | grep nodev'
    expected: ''
    severity: medium
    info: 'Run the following commands to determine if the system is configured as recommended.

      # grep /tmp /etc/fstab | grep nodev

      # mount | grep /tmp | grep nodev

      If either command emits no output then the system is not configured as recommended.'
- id: 1.1.3
  title: Set nosuid option for /tmp Partition
  scoring: scored
  profile:
  - Level 1
  description: The nosuid mount option specifies that the filesystem cannot contain set userid files.
  rationale: 'Since the /tmp filesystem is only intended for temporary file storage, set this option to ensure that users
    cannot create set userid files in /tmp. # mount -o remount,nosuid /tmp'
  impact: ''
  references:
  - 1. CCE-14940-1
  page_start: 23
  audit_raw: 'Run the following commands to determine if the system is configured as recommended.

    # grep /tmp /etc/fstab | grep nosuid

    # mount | grep /tmp | grep nosuid

    If either command emits no output then the system is not configured as recommended.'
  remediation: 'Edit the /etc/fstab file and add nosuid to the fourth field (mounting options). See the

    fstab(5) manual page for more information.'
  checks:
  - type: command
    command: '# grep /tmp /etc/fstab | grep nosuid && # mount | grep /tmp | grep nosuid'
    expected: ''
    severity: medium
    info: 'Run the following commands to determine if the system is configured as recommended.

      # grep /tmp /etc/fstab | grep nosuid

      # mount | grep /tmp | grep nosuid

      If either command emits no output then the system is not configured as recommended.'
- id: 1.1.4
  title: Set noexec option for /tmp Partition
  scoring: scored
  profile:
  - Level 1
  description: The noexec mount option specifies that the filesystem cannot contain executable binaries.
  rationale: Since the tmp filesystem is only intended for temporary file storage, set this option to ensure that users cannot
    run executable binaries from /tmp.
  impact: ''
  references:
  - 1. CCE-14412-1
  page_start: 25
  audit_raw: 'Run the following commands to determine if the system is configured as recommended.

    # grep /tmp /etc/fstab | grep noexec

    # mount | grep /tmp | grep noexec

    If either command emits no output then the system is not configured as recommended.'
  remediation: 'Edit the /etc/fstab file and add noexec to the fourth field (mounting options). See the

    fstab(5) manual page for more information.

    # mount -o remount,noexec /tmp'
  checks:
  - type: command
    command: '# grep /tmp /etc/fstab | grep noexec && # mount | grep /tmp | grep noexec'
    expected: ''
    severity: medium
    info: 'Run the following commands to determine if the system is configured as recommended.

      # grep /tmp /etc/fstab | grep noexec

      # mount | grep /tmp | grep noexec

      If either command emits no output then the system is not configured as recommended.'
- id: 1.1.5
  title: Create Separate Partition for /var
  scoring: scored
  profile:
  - Level 1
  description: The /var directory is used by daemons and other system services to temporarily store dynamic data. Some directories
    created by these processes may be world-writable.
  rationale: Since the /var directory may contain world-writable files and directories, there is a risk of resource exhaustion
    if it is not bound to a separate partition.
  impact: ''
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. CCE-14777-7
  page_start: 26
  audit_raw: 'Run the following command:

    # grep /var /etc/fstab

    <volume> /var ext3 <options>'
  remediation: 'For new installations, check the box to "Review and modify partitioning" and create a

    separate partition for /var.

    For systems that were previously installed, use the Logical Volume Manager (LVM) to

    create partitions.'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep /var /etc/fstab

      <volume> /var ext3 <options>'
    severity: medium
- id: 1.1.6
  title: Bind Mount the /var/tmp directory to /tmp
  scoring: scored
  profile:
  - Level 1
  description: The /var/tmp directory is normally a standalone directory in the /var file system. Binding /var/tmp to /tmp
    establishes an unbreakable link to /tmp that cannot be removed (even by the root user). It also allows /var/tmp to inherit
    the same mount options that /tmp owns, allowing /var/tmp to be protected in the same /tmp is protected. It will also prevent
    /var from filling up with temporary files as the contents of /var/tmp will actually reside in the file system containing
    /tmp.
  rationale: All programs that use /var/tmp and /tmp to read/write temporary files will always be written to the /tmp file
    system, preventing a user from running the /var file system out of space or trying to perform operations that have been
    blocked in the /tmp filesystem.
  impact: ''
  references:
  - 1. CCE-14584-7
  page_start: 28
  audit_raw: 'Perform the following to determine if the system is configured as recommended:

    # grep -e "^\/tmp" /etc/fstab | grep ''/var/tmp''

    /tmp /var/tmp none bind 0 0

    # mount | grep -e "^\/tmp" | grep ''/var/tmp''

    /tmp on /var/tmp type none (rw,bind)

    If the above commands emit no output then the system is not configured as recommended.'
  remediation: 'Run the following command

    # mount --bind /tmp /var/tmp

    Edit the /etc/fstab file to contain the following line:

    /tmp /var/tmp none bind 0 0

    28 | P a g e'
  checks:
  - type: command
    command: '# grep -e "^\/tmp" /etc/fstab | grep ''/var/tmp'' && # mount | grep -e "^\/tmp" | grep ''/var/tmp'''
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the system is configured as recommended:

      # grep -e "^\/tmp" /etc/fstab | grep ''/var/tmp''

      /tmp /var/tmp none bind 0 0

      # mount | grep -e "^\/tmp" | grep ''/var/tmp''

      /tmp on /var/tmp type none (rw,bind)

      If the above commands emit no output then the system is not configured as recommended.'
- id: 1.1.7
  title: Create Separate Partition for /var/log
  scoring: scored
  profile:
  - Level 1
  description: The /var/log directory is used by system services to store log data.
  rationale: 'There are two important reasons to ensure that system logs are stored on a separate partition: protection against
    resource exhaustion (since logs can grow quite large) and protection of audit data.'
  impact: ''
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. CCE-14011-1
  page_start: 30
  audit_raw: 'Run the following command:

    # grep /var/log /etc/fstab

    <volume> /var/log ext3 <options>'
  remediation: 'For new installations, check the box to "Review and modify partitioning" and create a

    separate partition for /var/log. For systems that were previously installed, use the Logical

    Volume Manager (LVM) to create partitions.'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep /var/log /etc/fstab

      <volume> /var/log ext3 <options>'
    severity: medium
- id: 1.1.8
  title: Create Separate Partition for /var/log/audit
  scoring: scored
  profile:
  - Level 1
  description: The auditing daemon, auditd, stores log data in the /var/log/audit directory.
  rationale: 'There are two important reasons to ensure that data gathered by auditd is stored on a separate partition: protection
    against resource exhaustion (since the audit.log file can grow quite large) and protection of audit data. The audit daemon
    calculates how much free space is left and performs actions based on the results. If other processes (such as syslog)
    consume space in the same partition as auditd, it may not perform as desired.'
  impact: ''
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. CCE-14171-3
  page_start: 31
  audit_raw: 'Run the following command

    # grep /var/log/audit /etc/fstab

    <volume> /var/log/audit ext3 <options>'
  remediation: 'For new installations, check the box to "Review and modify partitioning" and create a

    separate partition for /var/log/audit. For systems that were previously installed, use the

    Logical Volume Manager (LVM) to create partitions.'
  checks:
  - type: manual_review
    info: 'Run the following command

      # grep /var/log/audit /etc/fstab

      <volume> /var/log/audit ext3 <options>'
    severity: medium
