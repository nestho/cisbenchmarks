- id: 1.6.5
  title: Disable Prelink
  scoring: scored
  profile:
  - Level 1
  description: Prelinking is a performance enhancing feature that decreases process start up time. It loads shared libraries
    into addresses for which the linking of required symbols has already been performed. After a binary has been prelinked,
    the addresses at which shared libraries is not changed, even if kernel.randomize_va_space is set to 1.
  rationale: There is a bug in prelink that interferes with AIDE, the Linux file integrity checker. This has been fixed in
    RHEL6 (so prelink does not need to be disabled in RHEL6 systems).
  impact: ''
  references: []
  page_start: 104
  audit_raw: 'Perform the following to determine or prelinking is disabled.

