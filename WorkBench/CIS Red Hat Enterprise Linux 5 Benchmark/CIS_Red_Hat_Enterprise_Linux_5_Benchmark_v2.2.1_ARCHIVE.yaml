- id: 1.6.1
  title: Restrict Core Dumps
  scoring: scored
  profile:
  - Level 1
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file. The system provides the ability to set a soft
    limit for core dumps, but this can be overridden by the user.
  rationale: Setting a hard limit on core dumps prevents users from overriding the soft variable. If core dumps are required,
    consider setting limits for user groups (see limits.conf(5)). In addition, setting the fs.suid.dumpable variable to 0
    will prevent setuid programs from dumping core.
  impact: ''
  references: []
  page_start: 97
  audit_raw: 'Perform the following to determine if core dumps are restricted.

    # grep "hard core" /etc/security/limits.conf

    * hard core 0

    # sysctl fs.suid_dumpable

    fs.suid_dumpable = 0'
  remediation: 'Add the following line to the /etc/security/limits.conf file.

    * hard core 0

    Add the following line to the /etc/sysctl.conf file.

    fs.suid_dumpable = 0'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if core dumps are restricted.

      # grep "hard core" /etc/security/limits.conf

      * hard core 0

      # sysctl fs.suid_dumpable

      fs.suid_dumpable = 0'
    severity: medium
