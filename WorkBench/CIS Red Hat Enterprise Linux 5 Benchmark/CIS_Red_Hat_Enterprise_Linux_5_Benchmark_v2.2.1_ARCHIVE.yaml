- id: 9.1.3
  title: Verify Permissions on /etc/shadow
  scoring: scored
  profile:
  - Level 1
  description: The /etc/shadow file is used to store the information about user accounts that is critical to the security
    of those accounts, such as the hashed password and other security information.
  rationale: If attackers can gain read access to the /etc/shadow file, they can easily run a password cracking program against
    the hashed password to break it. Other security information that is stored in the /etc/shadow file (such as expiration)
    could also be useful to subvert the user accounts.
  impact: ''
