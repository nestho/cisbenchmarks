- id: 5.3.13
  title: Collect Use of Privileged Commands
  scoring: scored
  profile:
  - Level 2
  description: Monitor privileged programs (thos that have the setuid and/or setgid bit set on execution) to determine if
    unprivileged users are running these commands.
  rationale: Execution of privileged commands by non-privileged users could be an indication of someone trying to gain unauthorized
    access to the system.
  impact: ''
  references:
  - 1. CCE-14296-8
  page_start: 266
  audit_raw: 'Run the following command replacing <partition> with a list of partitions where

    programs can be executed from on your system:

    # find <partition> -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk

    ''{print "-a always,exit -F path=" $1 " -F perm=x -F auid>=''"$(awk

    ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)"'' -F auid!=4294967295 -k

    privileged" }''

    Verify all resulting lines are the /etc/audit/audit.rules file

    266 | P a g e'
  remediation: 'To remediate this issue, the system administrator will have to execute a find command to

    locate all the privileged programs and then add an audit line for each one of them.

    The audit parameters associated with this are as follows:

    • -F path=" $1 “- will populate each file name found through the find command and

    processed by awk.

    • -F perm=x - will write an audit record if the file is executed.

    • -F auid>=500 - will write a record if the user executing the command is not a

    privileged user.

    • -F auid!= 4294967295 - will ignore Daemon events

    All audit records should be tagged with the identifier "privileged".

    Run the following command replacing with a list of partitions where programs can be

    executed from on your system:

    # find <partition> -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk

    ''{print "-a always,exit -F path=" $1 " -F perm=x -F auid>=''"$(awk

    ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)"'' -F auid!=4294967295 -k

    privileged" }''

    Edit the /etc/audit/audit.rules file.

    Example:

    # find / -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk ''{print "-a

    always,exit -F path=" $1 " -F perm=x -F auid>=''"$(awk ''/^\s*UID_MIN/{print

    $2}'' /etc/login.defs)"'' -F auid!=4294967295 -k privileged" }'' >>

    /etc/audit/audit.rules'
  checks:
  - type: manual_review
    info: 'Run the following command replacing <partition> with a list of partitions where

      programs can be executed from on your system:

      # find <partition> -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk

      ''{print "-a always,exit -F path=" $1 " -F perm=x -F auid>=''"$(awk

      ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)"'' -F auid!=4294967295 -k

      privileged" }''

      Verify all resulting lines are the /etc/audit/audit.rules file

      266 | P a g e'
    severity: medium
- id: 5.3.14
  title: Collect Successful File System Mounts
  scoring: scored
  profile:
  - Level 2
  description: Monitor the use of the mount system call. The mount (and umount) system call controls the mounting and unmounting
    of file systems. The parameters below configure the system to create an audit record when the mount system call is used
    by a non-privileged user
  rationale: It is highly unusual for a non privileged user to mount file systems to the system. While tracking mount commands
    gives the system administrator evidence that external media may have been mounted (based on a review of the source of
    the mount and confirming it's an external media type), it does not conclusively indicate that data was exported to the
    media. System administrators who wish to determine if data were exported, would also have to track successful open, creat
    and truncate system calls requiring write access to a file under the mount point of the external media file system. This
    could give a fair indication that a write occurred. The only way to truly prove it, would be to track successful writes
    to the external media. Tracking write system calls could quickly fill up the audit log and is not recommended. Recommendations
    on configuration options to track data export to media is beyond the scope of this document. **Note:**This tracks successful
    and unsuccessful mount commands. File system mounts do not have to come from external media and this action still does
    not verify write (e.g. CD ROMS) 268 | P a g e
  impact: ''
  references:
  - 1. CCE-4024-6
  page_start: 268
  audit_raw: 'For 64 bit systems perform the following command and ensure the output is as shown to

    determine if filesystem mounts are recorded.

