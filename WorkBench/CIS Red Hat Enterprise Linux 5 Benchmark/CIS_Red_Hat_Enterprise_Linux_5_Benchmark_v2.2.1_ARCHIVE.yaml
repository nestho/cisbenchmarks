- id: 1.5.3
  title: Set Boot Loader Password
  scoring: scored
  profile:
  - Level 1
  description: Setting the boot loader password will require that anyone rebooting system must enter a password before being
    able to set command line boot parameters
  rationale: Requiring a boot password upon execution of the boot loader will prevent an unauthorized user from entering boot
    parameters or changing the boot partition. This prevents users from weakening security (e.g. turning off SELinux at boot
    time).
  impact: ''
  references:
  - 1. CCE-3818-2
  page_start: 92
  audit_raw: 'Perform the following to determine if a password is required to set command line boot

    parameters:

    # grep "^password" /etc/grub.conf

    password --md5 <passwd hash>'
  remediation: 'Run the following:

    #!/bin/bash

    grub-md5-crypt | tee /tmp/$$

    x=$(tail -1 /tmp/$$)

    /bin/rm -f /tmp/$$

    ed /etc/grub.conf << END > /dev/null 2>&1

    g/^password/d

    $

    ?^#?

    a

    password --md5 $x

    .

    w

    q

    END'
