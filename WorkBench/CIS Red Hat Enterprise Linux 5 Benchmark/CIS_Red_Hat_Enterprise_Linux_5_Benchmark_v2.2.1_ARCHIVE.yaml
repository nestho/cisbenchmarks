    to determine if the adjtimex (tune kernel clock), settimeofday (Set time, using timeval and timezone structures) stime
    (using seconds since 1/1/1970) or clock\_settime (allows for the setting of several internal clocks and timers) system
    calls have been executed and always write an audit record to the /var/log/audit.log file upon exit, tagging the records
    with the identifier "time-change"
  rationale: Unexpected changes in system data and/or time could be a sign of malicious activity on the system.
  impact: ''
  references: []
