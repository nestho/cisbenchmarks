- id: 5.3.18
  title: Collect Kernel Module Loading and Unloading
  scoring: scored
  profile:
  - Level 2
  description: Monitor the loading and unloading of kernel modules. The programs insmod (install a kernel module), rmmod (remove
    a kernel module), and modprobe (a more sophisticated program to load and unload modules, as well as some other features)
    control loading and unloading of modules. The init_module (load a module) and delete\_module (delete a module) system
    calls control loading and unloading of modules. Any execution of the loading and unloading module programs and system
    calls will trigger an audit record with an identifier of "modules".
  rationale: Monitoring the use of insmod, rmmod and modprobe could provide system administrators with evidence that an unauthorized
    user loaded or unloaded a kernel module, possibly compromising the security of the system. Monitoring of the init_module
    and delete_module system calls would reflect an unauthorized user attempting to use a different program to load and unload
    modules.
  impact: ''
  references:
