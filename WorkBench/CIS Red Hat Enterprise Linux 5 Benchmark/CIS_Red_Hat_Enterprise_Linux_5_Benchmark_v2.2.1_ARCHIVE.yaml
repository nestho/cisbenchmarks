  audit_raw: 'Perform the following to determine if events where the system date and/or time has been

    modified are captured.

    On a 64 bit system, perform the following command and ensure the output is as shown.

    # grep time_change /etc/audit/audit.rules

    -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change

    -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k timechange

    -a always,exit -F arch=b64 -S clock_settime -k time-change

    -a always,exit -F arch=b32 -S clock_settime -k time-change

    -w /etc/localtime -p wa -k time-change

    On a 32 bit system, perform the following command and ensure the output is as shown.

    # grep time_change /etc/audit/audit.rules

    -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k timechange

    -a always,exit -F arch=b32 -S clock_settime -k time-change

    -w /etc/localtime -p wa -k time-change

    246 | P a g e'
  remediation: 'For 64 bit systems, add the following lines to the /etc/audit/audit.rules file.

    -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change

    -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k timechange

    -a always,exit -F arch=b64 -S clock_settime -k time-change

