- id: 5.1.2
  title: Create and Set Permissions on syslog Log Files
  scoring: scored
  profile:
  - Level 1
  description: A log file must already exist for syslog to be able to write to it.
  rationale: It is important to ensure that log files exist and have the correct permissions to ensure that sensitive syslog
    data is archived and protected.
  impact: ''
  references:
  - 1. See the syslog.conf(5) man page for more information.
  page_start: 219
  audit_raw: 'For each LOGFILE listed in the /etc/syslog.conf file, perform the following commands and

    verify that the owner:group is root:root and the permissions are 0600 (for sites that do

    not use a security group) and root:<securegrp> with permissions of 0640 (for sites that

    use a secure group):

    # ls -l LOGFILE'
  remediation: 'For sites that have not implemented a secure admin group: For each LOGFILE listed in the

    /etc/syslog.conf file, perform the following commands:

    # touch <LOGFILE>

    # chown root:root <LOGFILE>

    # chmod og-rwx <LOGFILE>

    For sites that have implemented a secure admin group: For each LOGFILE listed in the

    /etc/syslog.conf file, perform the following commands (where is the name of the security

    group):

    # touch <LOGFILE>

    # chown root:<securegrp> <LOGFILE>

    # chmod g-wx,o-rwx <LOGFILE>'
  checks:
  - type: manual_review
    info: 'For each LOGFILE listed in the /etc/syslog.conf file, perform the following commands and

