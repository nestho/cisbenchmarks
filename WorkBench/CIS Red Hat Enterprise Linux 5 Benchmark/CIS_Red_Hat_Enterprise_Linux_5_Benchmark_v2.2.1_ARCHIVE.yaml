- id: 1.1.17
  title: Set Sticky Bit on All World-Writable Directories
  scoring: scored
  profile:
  - Level 1
  description: Setting the sticky bit on world writable directories prevents users from deleting or renaming files in that
    directory that are not owned by them.
  rationale: This feature prevents the ability to delete or rename files in world writable directories (such as /tmp) that
    are owned by another user.
  impact: ''
  references:
  - 1. CCE-3399-3
  page_start: 46
  audit_raw: 'Run the following command to verify no world writable directories exist without the sticky

    bit set:

    # df --local -P 2> /dev/null | awk ''{if (NR!=1) print $6}'' | xargs -I ''{}''

    find ''{}'' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null

    No output should be returned.'
  remediation: 'Run the following command to set the sticky bit on all world writable directories:

    # df --local -P | awk ''{if (NR!=1) print $6}'' | xargs -I ''{}'' find ''{}'' -xdev

    -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null | xargs -I ''{}'' chmod

    a+t ''{}'''
  checks:
  - type: command
    command: find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null
    expected: ''
    severity: medium
    info: 'Run the following command to verify no world writable directories exist without the sticky

      bit set:

      # df --local -P 2> /dev/null | awk ''{if (NR!=1) print $6}'' | xargs -I ''{}''

      find ''{}'' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null

      No output should be returned.'
- id: 1.1.18
  title: Disable Mounting of cramfs Filesystems
  scoring: scored
  profile:
  - Level 2
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the server. If this filesystem
    type is not needed, disable it.
  impact: ''
  references:
  - 1. CCE-14089-7
  page_start: 48
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # /sbin/modprobe -n -v cramfs

    install /bin/true

    # /sbin/lsmod | grep cramfs

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: /etc/modprobe.d/cramfs.conf

    Add the following line:

    install cramfs /bin/true'
  checks:
  - type: command
    command: '# /sbin/lsmod | grep cramfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # /sbin/modprobe -n -v cramfs

