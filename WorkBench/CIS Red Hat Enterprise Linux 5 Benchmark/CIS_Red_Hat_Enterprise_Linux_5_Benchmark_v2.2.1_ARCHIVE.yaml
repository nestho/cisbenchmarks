- id: 1.1.10
  title: Add nodev Option to /home
  scoring: scored
  profile:
  - Level 1
  description: When set on a file system, this option prevents character and block special devices from being defined, or
    if they exist, from being used as character and block special devices.
  rationale: 'Since the user partitions are not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices. Note: The actions in the item refer to the /home partition, which is the
    default user partition that is defined in RHEL5. If you have created other user partitions, it is recommended that the
    Remediation and Audit steps be applied to these partitions as well.'
  impact: ''
  references:
  - 1. CCE-4249-9
  page_start: 33
  audit_raw: 'Run the following commands:

    # grep /home /etc/fstab

    Verify that nodev is an option

    # mount | grep /home

    <each user partition> on <mount point> type <fstype> (nodev)

    Note: There may be other options listed for this filesystem'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options). See the

    fstab(5) manual page for more information.

    # mount -o remount,nodev /home'
  checks:
  - type: command
    command: '# mount | grep /home'
    expected: Verify that nodev is an option
    severity: medium
    info: 'Run the following commands:

      # grep /home /etc/fstab

      Verify that nodev is an option

      # mount | grep /home

      <each user partition> on <mount point> type <fstype> (nodev)

      Note: There may be other options listed for this filesystem'
- id: 1.1.11
  title: Add nodev Option to Removable Media Partitions
  scoring: manual
  profile:
  - Level 1
  description: Set nodev on removable media to prevent character and block special devices that are present on the removable
    be treated as these device files.
  rationale: Removable media containing character and block special devices could be used to circumvent security controls
    by allowing non-root users to access sensitive device files such as /dev/kmem or the raw disk partitions.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Run the following command:

    # grep <each removable media mountpoint> /etc/fstab

    Verify that nodev is an option'
  remediation: 'Edit the /etc/fstab file and add "nodev" to the fourth field (mounting options). Look for

    entries that have mount points that contain words such as floppy or cdrom. See the

    fstab(5)manual page for more information.'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep <each removable media mountpoint> /etc/fstab

      Verify that nodev is an option'
    severity: medium
