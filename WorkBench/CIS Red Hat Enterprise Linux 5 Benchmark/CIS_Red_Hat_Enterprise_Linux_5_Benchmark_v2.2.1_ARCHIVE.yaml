  title: Create Separate Partition for /home
  scoring: scored
  profile:
  - Level 1
  description: The /home directory is used to support disk storage needs of local users.
  rationale: If the system is intended to support local users, create a separate partition for the /home directory to protect
    against resource exhaustion and restrict the type of files that can be stored under /home.
  impact: ''
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
