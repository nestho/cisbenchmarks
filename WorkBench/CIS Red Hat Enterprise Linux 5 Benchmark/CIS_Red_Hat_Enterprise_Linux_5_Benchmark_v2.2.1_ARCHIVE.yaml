  remediation: 'Edit /etc/sysconfig/prelink and set PRELINKING=no:

    PRELINKING=no

    Note: If the feature is changed from yes to no, run /usr/sbin/prelink -ua to revert

    binaries and libraries to their original context before prelinking.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine or prelinking is disabled.

      # grep PRELINKING /etc/sysconfig/prelink

      PRELINKING=no'
    severity: medium
- id: '1.7'
