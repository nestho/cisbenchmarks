  title: Collect Discretionary Access Control Permission Modification Events
  scoring: scored
  profile:
  - Level 2
  description: Monitor changes to file permissions, attributes, ownership and group. The parameters inn this section track
    changes for system calls that affect file permissions and attributes. The chmod, fchmod and fchmodat system calls affect
