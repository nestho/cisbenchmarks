  title: Set Daemon umask
  scoring: scored
  profile:
  - Level 1
  description: Set the default umask for all processes started at boot time. The settings in umask selectively turn off default
    permission when a file is created by a daemon process.
  rationale: Setting the umask to 027 will make sure that files created by daemons will not be readable, writable or executable
    by any other than the group and owner of the daemon process and will not be writable by the group of the daemon process.
    The daemon process can manually override these settings if these files need additional permission.
