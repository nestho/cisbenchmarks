- id: 6.1.10
  title: Restrict at/cron to Authorized Users
  scoring: scored
  profile:
  - Level 1
  description: Configure /etc/cron.allow and /etc/at.allow to allow specific users to use these services. If /etc/cron.allow
    or /etc/at.allow do not exist, then /etc/at.deny and /etc/cron.deny are checked. Any user not specifically defined in
    those files is allowed to use at and cron. By removing the files, only users in /etc/cron.allow and /etc/at.allow are
    allowed to use at and cron. Note that even though a given user is not listed in cron.allow, cron jobs can still be run
    as that user. The cron.allow file only controls administrative access to the crontab command for scheduling and modifying
    cron jobs.
  rationale: On many systems, only the system administrator is authorized to schedule cron jobs. Using the cron.allow file
    to control who can run cron jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny
    list, you could potentially add a user ID to the system and forget to add it to the deny files. and use SSH to prevent
    session hijacking and sniffing of sensitive data off the network. 304 | P a g e
  impact: ''
  references: []
  page_start: 302
  audit_raw: 'Perform the following to determine if the remediation in the section has been performed:

    # ls -l /etc/cron.deny

    [no output returned]

    # ls -l /etc/at.deny

    [no output returned]

    # ls -l /etc/cron.allow

    -rw------- 1 root root <date> /etc/cron.allow

    # ls -l /etc/at.allow

    -rw------- 1 root root <date> /etc/at.allow

    302 | P a g e'
  remediation: 'Run the following command to remove /etc/cron.deny:

    # /bin/rm /etc/cron.deny

    Run the follwoing command to remove /etc/at.deny:

    # /bin/rm /etc/at.deny

    Run the following command to create /etc/cron.allow

    # touch /etc/cron.allow

    Run the following command to create /etc/at.allow:

    # touch /etc/at.allow

    Run the following commands to update the owner, group, and permissions on

    /etc/cron.allow

    # chmod og-rwx /etc/cron.allow

    # chown root:root /etc/cron.allow

    Run the following commands to update the owner, group, and permissions on

    /etc/at.allow

    Run the following command to create /etc/at.allow:

    # chmod og-rwx /etc/at.allow

    # chown root:root /etc/at.allow'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the remediation in the section has been performed:

      # ls -l /etc/cron.deny

      [no output returned]

      # ls -l /etc/at.deny

      [no output returned]

      # ls -l /etc/cron.allow

      -rw------- 1 root root <date> /etc/cron.allow

      # ls -l /etc/at.allow

      -rw------- 1 root root <date> /etc/at.allow

      302 | P a g e'
    severity: medium
