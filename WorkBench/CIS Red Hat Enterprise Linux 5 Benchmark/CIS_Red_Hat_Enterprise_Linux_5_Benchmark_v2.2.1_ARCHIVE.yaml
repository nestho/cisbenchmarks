- id: 6.2.13
  title: Limit Access via SSH
  scoring: scored
  profile:
  - Level 1
  description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended
    that at least one of the following options be leveraged: AllowUsersThe AllowUsers variable gives the system administrator
    the option of allowing specific users to ssh into the system. The list consists of comma separated user names. Numeric
    userIDs are not recognized with this variable. If a system administrator wants to restrict user access further by only
    allowing the allowed users to log in from a particular host, the entry can be specified in the form of user@host. AllowGroupsThe
    AllowGroups variable gives the system administrator the option of allowing specific groups of users to ssh into the system.
    The list consists of comma separated user names. Numeric groupIDs are not recognized with this variable. DenyUsersThe
    DenyUsers variable gives the system administrator the option of denying specific users to ssh into the system. The list
    consists of comma separated user names. Numeric userIDs are not recognized with this variable. If a system administrator
    wants to restrict user access further by specifically denying a user''s access from a particular host, the entry can be
    specified in the form of user@host. DenyGroupsThe DenyGroups variable gives the system administrator the option of denying
    specific groups of users to ssh into the system. The list consists of comma separated group names. Numeric groupIDs are
    not recognized with this variable.'
  rationale: Restricting which users can remotely access the system via SSH will help ensure that only authorized users access
    the system. 324 | P a g e
