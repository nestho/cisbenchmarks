- id: 6.3.3
  title: Use pam_deny.so to Deny Services
  scoring: manual
  profile:
  - Level 1
  description: Adding pam_deny.so as a requisite to a PAM aware service allows you to quickly disable the service. The requisite
    tag on the auth line tells PAM that authentication must fail if the name module returns a failure. Since pam_deny.so always
    returns failure, authentication will always fail for this service. This mechanism can be applied to any other PAM aware
    service on the system.
  rationale: While there are other ways to disable a service, adding pam_deny.so allows you to disable the service for new
    users without affecting current users of the service.
