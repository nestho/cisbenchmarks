- id: 5.3.15
  title: Collect File Deletion Events by User
  scoring: scored
  profile:
  - Level 2
  description: Monitor the use of system calls associated with the deletion or renaming of files and file attributes. This
    configuration statement sets up monitoring for the unlink (remove a file), unlinkat (remove a file attribute), rename
    (rename a file) and renameat (rename a file attribute) system calls and tags them with the identifier "delete". Monitor
    scope changes for system administrations. If the system has been properly configured to force system administrators to
    log in as themselves first and then use the sudo command to execute privileged commands, it is possible to monitor changes
    in scope. The file /etc/sudoers will be written to when the file or its attributes have changed. The audit records will
    be tagged with the identifier "scope."
  rationale: Monitoring these calls from non-privileged users could provide a system administrator with evidence that inappropriate
    removal of files and file attributes associated with protected files is occurring. While this audit option will look at
    all events, system administrators will want to look for specific privileged files that are being deleted or altered. Changes
    in the /etc/sudoers file can indicate that an unauthorized change has been made to scope of system administrator activity.
