- id: 6.2.2
  title: Set LogLevel to INFO
  scoring: scored
  profile:
  - Level 1
  description: The INFO parameter specifies that record login and logout activity will be logged.
  rationale: SSH provides several logging levels with varying amounts of verbosity. The "DEBUG" is specifically not recommended
    other than strictly for debugging SSH communications since it provides so much data that it is difficult to identify important
    security information. The "INFO" level is the basic level that only records login activity of SSH users. The VERBOSE level
    records both login and logout activity. In many situations, such as Incident Response, it is important to determine when
    a particular user was active on a system. The logout record can eliminate those users who disconnected, which helps narrow
    the field.
  impact: ''
  references: []
  page_start: 306
  audit_raw: 'To verify the correct SSH setting, run the following command and verify that the output is

    as shown:

    # grep "^LogLevel" /etc/ssh/sshd_config

    LogLevel INFO'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameter as follows:

    LogLevel INFO'
  checks:
  - type: manual_review
    info: 'To verify the correct SSH setting, run the following command and verify that the output is

      as shown:

      # grep "^LogLevel" /etc/ssh/sshd_config

      LogLevel INFO'
    severity: medium
