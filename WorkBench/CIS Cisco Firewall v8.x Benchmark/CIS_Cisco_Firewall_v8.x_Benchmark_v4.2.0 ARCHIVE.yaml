  rationale: The intrusion prevention is an additional feature for which the security appliance audits the traffic in order
    to identify vulnerability exploits. This is achieved because specific signatures are matched in the traffic. There are
    two types of signatures, attack signature for which the traffic is intended to harm the internal resource and informational
    signature for which the traffic is to gather information on internal resources through port scans, ping sweeps, DNS zone
    transfers and many others. The possible actions to prevent the intrusion are to drop the traffic, to reset the connection
