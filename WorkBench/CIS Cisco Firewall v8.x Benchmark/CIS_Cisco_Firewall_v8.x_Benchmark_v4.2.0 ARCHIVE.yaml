  title: Ensure 'logging buffer size' is greater than or equal to '524288' bytes (512kb)
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Determines the size of the local buffer in which the logs are stored so that they can be checked by the administrator.
  rationale: The internal log buffer serves as a temporary storage location. New messages are appended to the end of the list.
    When the buffer is full, that is, when the buffer wraps, old messages are overwritten as new messages are generated. The
    internal log buffer allows the administrator performing a health check on the system to locally have the last logs generated.
