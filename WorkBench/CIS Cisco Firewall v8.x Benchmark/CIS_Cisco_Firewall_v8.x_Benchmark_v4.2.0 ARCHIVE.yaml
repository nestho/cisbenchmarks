- id: '3.7'
  title: Ensure 'ip verify' is set to 'reverse-path' for untrusted interfaces
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Enables the unicast Reverse-Path Forwarding (uRPF) on untrusted interfaces.
  rationale: The unicast Reverse-Path Forwarding(uRPF) enabled on an interface ensures that for a packet received on an interface,
    the security appliance checks the routing table to make sure that the same interface is used to get back to the source
    IP address. If it is not the case, the packet will be dropped. This should be enabled by default on untrusted interfaces
    in order to prevent attackers from spoofing internal IP addresses. For the other internal interfaces, the uRPF should
    be enabled if there is no case of asymmetric routing for which the path to send a packet to the source IP address is different
