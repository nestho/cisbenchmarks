- id: 1.4.2.1
  title: Ensure 'TACACS+/RADIUS' is configured correctly
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Specifies the AAA server-group and each individual server using the TACACS+ or RADIUS protocol
  rationale: 'Authentication, authorization and accounting (AAA) scheme provide an authoritative source for managing and monitoring
    access for devices. Many protocols are supported for the communication between the systems and the AAA servers: http-form,
    kerberos, ldap, nt, radius, sdi, tacacs+.'
  impact: ''
  references:
  - 1. http://www.cisco.com/en/US/docs/security/asa/asa90/command/reference/a1.h
  page_start: 38
  audit_raw: '• Step 1: Acquire the enterprise standard protocol (protocol_name) for authentication

    (TACACS+ or RADIUS)

    • Step 2: Perform the following to determine if the AAA server-group is configured

    with the required protocol

    hostname#sh run aaa-server | i protocol.<protocol_name>

    The output should look like:

    aaa-server server_group_name protocol protocol_name

    Example:

    Asa#sh run aaa-server | i protocol.tacacs+

    aaa-server cisco_tacacs protocol tacacs+

    Here the the protocol_name is tacacs+ and server_group_name is cisco_tacacs

    • Step 3: If an output is displayed, go to the step 4. If not, it is a finding and the

    remediation procedure should be applied.

    38 | P a g e

    • Step 4: Perform the following to determine if there is at least an AAA server

    configured for the server group <server_group_name> identified in step 2

    hostname#sh run aaa-server <server_group_name> | i host

    The output should look like:

    aaa-server server_group_name (interface_name) host server_ip_address

    Example:

    Asa#sh run aaa-server cisco_tacacs | i host

    aaa-server cisco_tacacs (MGMT) host 192.16.0.223

    Here the server_group_name is cisco_tacacs, the interface_name is MGMT and the

    server_ip_address is 192.168.0.223

    • Step 5: If an output is displayed, the system is compliant. If not, it is a finding and the

    remediation procedure should be applied.'
  remediation: '• Step 1: Acquire the enterprise standard protocol (protocol_name) for authentication

    (TACACS+ or RADIUS)

    • Step 2: Run the following to configure the AAA server-group for the required

    protocol

    hostname(config)#aaa-server <server-group_name> protocol <protocol_name>

    • Step 3: Run the following to configure the AAA server:

    hostname(config)#aaa-server <server-group_name> (<interface_name>) host <aaaserver_ip> <shared_key>

    server-group_name: the above server-group configured

    interface_name: the network interface from which the AAA server will be accessed

    aaa-server_ip: the IP address of the AAA server

    shared_key: the TACACS+ or RADIUS shared key'
  checks:
  - type: manual_review
    info: '• Step 1: Acquire the enterprise standard protocol (protocol_name) for authentication

