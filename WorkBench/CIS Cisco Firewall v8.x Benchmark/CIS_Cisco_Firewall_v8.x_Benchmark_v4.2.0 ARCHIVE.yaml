- id: '3.5'
  title: Ensure DOS protection is enabled for untrusted interfaces
  scoring: manual
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Determines the maximum connections, maximum embryonic connections, maximum connections per client and maximum
    embryonic connections per client that can be accepted on the outside interface
  rationale: Limiting the number of connections protects from a DoS attack. The ASA uses the per-client limits and the embryonic
    connection limits to trigger TCP Intercept, which protects inside systems from a DoS attack perpetrated by flooding an
    interface with TCP SYN packets. An embryonic connection is a connection request that has not finished the necessary handshake
    between source and destination. TCP Intercept uses the SYN cookies algorithm to prevent TCP SYN-flooding attacks. A SYN-flooding
    attack consists of a series of SYN packets usually originating from spoofed IP addresses. The constant flood of SYN packets
    keeps the server SYN queue full, which prevents it from servicing connection requests.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa82/configuration/guide/
  page_start: 152
  audit_raw: "• Step 1: Run the following to determine whether the DOS protection is enabled\nhostname#sh run policy-map |\
    \ i set.connection\nThe output should look like:\n set connection connection_type max_value\nThe example below gives the\
    \ values for maximum connections, maximum embryonic\nconnections, maximum connections per client and maximum embryonic\
    \ connections per\nclient\nAsa#sh run policy-map | i set.connection\n set connection conn-max 9500\n set connection embryonic-conn-max\
    \ 5000\n set connection per-client-embryonic-max 100\n set connection per-client-max 75\n• Step 2: If an output is displayed,\
    \ the system is compliant. If not, there is a finding.\n152 | P a g e"
  remediation: '• Step 1: Acquire the enterprise standard values for maximum connections, maximum

    embryonic connections, maximum connections per client and maximum embryonic

    connections per client

    • Step 2: Run the following to configure the class to identify the traffic on which DOS

    protection should be performed.

    hostname(config)# class-map <class_name>

    hostname(config-cmap)# match any

    Step 3: Run the following to configure the policy that will determine the maximum

    connections to be applied on the class previously configured

    hostname(config)# policy-map <policy_name>

    hostname(config-pmap)# class <class_name>

    hostname(config-pmap-c)# set connection conn-max <enterprise_max_number>

    hostname(config-pmap-c)# set connection embryonic-conn-max

    <enterprise_max_number>

    hostname(config-pmap-c)# set connection per-client-embryonic-max

    <enterprise_max_number>

    hostname(config-pmap-c)# set connection per-client-max

    <enterprise_max_number>

    The enterprise_max_number parameter is to be taken between 0 and 65535.

    • Step 4: Run the following to apply the policy previously configured on the untrusted

    hostname(config-pmap-c)# service-policy <policy_name> interface

    <untrusted_interface_name>'
  checks:
  - type: manual_review
    info: "• Step 1: Run the following to determine whether the DOS protection is enabled\nhostname#sh run policy-map | i\
