controls:
- id: 1.1.1
  title: Ensure 'Logon Password' is set
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Changes the default login password.
  rationale: The login password is used for Telnet and SSH connections. The default device configuration does not require
    any strong user authentication enabling unfettered access to an attacker that can reach the device. A user can enter the
    default password and just press the Enter key at the Password prompt to login to the device. Setting the login password
    causes the device to enforce use of a strong password to access user mode. Using default or well-known passwords makes
    it easier for an attacker to gain entry to a device.
  impact: ''
  references:
  - 1. http://www.cisco.com/en/US/docs/security/asa/asa90/command/reference/p1.h
  page_start: 9
  audit_raw: '• Step 1: Run the following to determine whether the login password is set

    hostname# show running-config passwd

    The output should look like

    passwd xxxxxx encrypted

    Example:

    Asa#show running-config passwd

    passwd 8Ry2YjIyt7RRXU24 encrypted

    Here 8Ry2YjIyt7RRXU24 is the encrypted format of the plain-text password used as login

    password

    • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: '9 | P a g e

    Run the following to set the login password.

    hostname(config)#passwd <login_password>

    The login_password parameter should be the plain-text password used to log into the

    system'
  checks:
  - type: sql
    command: show running-config passwd
    severity: medium
    info: '• Step 1: Run the following to determine whether the login password is set

      hostname# show running-config passwd

      The output should look like

      passwd xxxxxx encrypted

      Example:

      Asa#show running-config passwd

      passwd 8Ry2YjIyt7RRXU24 encrypted

      Here 8Ry2YjIyt7RRXU24 is the encrypted format of the plain-text password used as login

      password

      • Step 2: If an output is displayed, the system is compliant. If n'
- id: 1.1.2
  title: Ensure 'Enable Password' is set
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Sets the password for users accessing privileged EXEC mode when they run the enable command.
  rationale: The default device configuration does not require any strong user authentication enabling unfettered access to
    an attacker that can reach the device. A user can enter the default password and just press the Enter key at the Password
    prompt to login to the device. Setting the enable password causes the device to enforce use of a strong password to access
    privileged EXEC mode. Using default or well-known passwords makes it easier for an attacker to gain entry to a device.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa82/configuration/guide/
  page_start: 11
  audit_raw: '• Step 1: Run the following to determine whether the login password is set

    hostname#show run | inc enable

    The output should look like

    enable password xxxxxxx encrypted

    Example:

    Asa#show run enable

    enable password 8Ry2YjIyt7RRXU24 encrypted

    Here 8Ry2YjIyt7RRXU24 is the encrypted format of the plain-text password used as enable

    password

    • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: 'Run the following to set the enable password.

    hostname(config)#enable password <enable_password> level <privilege_level>

    11 | P a g e

    The enable_password parameter should be the plain-text password used to log into the

    enable mode

    If the privilege level is not configured, the default one is 15'
  checks:
  - type: sql
    command: show run | inc enable
    severity: medium
    info: '• Step 1: Run the following to determine whether the login password is set

      hostname#show run | inc enable

      The output should look like

      enable password xxxxxxx encrypted

      Example:

      Asa#show run enable

      enable password 8Ry2YjIyt7RRXU24 encrypted

      Here 8Ry2YjIyt7RRXU24 is the encrypted format of the plain-text password used as enable

      password

      • Step 2: If an output is displayed, the system is compliant. I'
- id: 1.1.3
  title: Ensure 'Master Key Passphrase' is set
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Defines the master key passphrase used for to encrypt the application secret-keys contained in the configuration
    file for software releases from 8.3(1) and above.
  rationale: For ASA software releases from 8.3 and below, the VPN preshared keys, Tacacs+/Radius shared keys or Routing protocols
    authentication passwords are encrypted in the runningconfiguration once generated. They can be viewed in plain-text when
    the file is transferred through TFTP or FTP to be stored out of the device. Therefore, if the stored file falls into the
    hands on an attacker, he/she will have all the passwords and application encryption keys. From version 8.3(1) and above,
    the master key passphrase helps to generate the AES encryption key used to encrypt secret-keys both in the running configuration
    and when the file is exported through TFTP or FTP to be stored in a different location. It improves the security because
    the master key is never displayed in the runningconfiguration.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa83/configuration/guide/
  page_start: 13
  audit_raw: '• Step 1: Run the following to find whether the software version of the security

    appliance is from 8.3(1) and above

    hostname# sh version | i Software_Version_8.[3-9] hostname# sh version | i

    Software_Version_9.[0-9]

    Example:

    asa-dmz# sh version | i Software_Version_8.[3-9]

    Cisco Adaptive Security Appliance Software Version 8.4(2)

    asa-dmz# sh version | i Software_Version_9.[0-9]

    In this example, the software version is 8.4(2

    Datacenter-fw-01# sh version | i Software_Version_8.[3-9]

    Datacenter-fw-01# sh version | i Software_Version_9.[0-9]

    Cisco Adaptive Security Appliance Software Version 9.5(2) <system>

    13 | P a g e

    In this example, the software version is 9.5(2)

    • Step 2: If an output is displayed, go to the step 3. If not, the release is not from 8.3(1)

    and above and the recommendation is not applicable.

    • Step 3: Run the following to find whether the existing keys are type 6 encrypted

    hostname# sh run | in key.6

    Example:

    cis-asa-1/admin# sh run | in key.6

    key 6 "JDYkW0hEIquGiXMdznN2

    Here the Tacacs+ key is encrypted using AES encryption and master key. If it was not the

    case, the key would be displayed with stars only as follows: key ******

    • Step 4: If an output is displayed, the system is compliant, if not it is a finding.'
  remediation: '• Step 1: Set the master key passphrase with the following command:

    hostname (config)# key config-key password-encryption <passphrase>

    The passphrase is between 8 and 128 characters long

    • Step 2: Enable the AES encryption of existing keys of the running-configuration

    hostname(config)# password encryption aes

    • Step 3: Run the following for the encryption of keys in the startup-configuration

    hostname(config)# write memory'
  checks:
  - type: manual_review
    info: '• Step 1: Run the following to find whether the software version of the security

      appliance is from 8.3(1) and above

      hostname# sh version | i Software_Version_8.[3-9] hostname# sh version | i

      Software_Version_9.[0-9]

      Example:

      asa-dmz# sh version | i Software_Version_8.[3-9]

      Cisco Adaptive Security Appliance Software Version 8.4(2)

      asa-dmz# sh version | i Software_Version_9.[0-9]

      In this example, the software version is 8.4(2

      Datacenter-fw-01# sh version | i Software_Version_8.[3-9]

      Datacenter-fw-'
    severity: medium
- id: 1.1.4
  title: Ensure 'Password Recovery' is disabled
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Disables the password recovery
  rationale: Disabling the password recovery is an additional physical control. It will prevent an attacker that will have
    circumvented all the physical safeguards and being in contact with the security appliance to change the existing login
    password, enable password and local user password and then hack the system.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa84/configuration/guide/
  page_start: 15
  audit_raw: '• Step 1: Run the following to determine if the password recovery has been disabled

    hostname#sh run | in no.service.password-recovery

    • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: 'Run the following to disable the password recovery:

    hostname (config)# no service password-recovery'
  checks:
  - type: manual_review
    info: '• Step 1: Run the following to determine if the password recovery has been disabled

      hostname#sh run | in no.service.password-recovery

      • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
    severity: medium
- id: 1.1.5
  title: Ensure 'Password Policy' is enabled
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Enforces the Enterprise Password Policy by setting compliant local password requirements for the security appliance
  rationale: The password policy helps to prevent unauthorized accesses by enforcing the password for more complexity and
    making them difficult to be guessed. This applies to the local database.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa91/configuration/genera
  page_start: 17
  audit_raw: '• Step 1: Run the following to determine whether the password-policy is set

    hostname#show run password-policy

    Example:

    Asa#sh run password-policy

    password-policy minimum-length 8

    password-policy minimum-numeric 1

    Here the password-policy is configured for the passwords to have at least 8 characters and

    to contain at least a number

    • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: '• Step 1: Run the following to set the password lifetime in days to less than or equal to

    180

    hostname(config)#password-policy lifetime 30

    • Step 2: Run the following to set the minimum number of characters that must be

    changed between the old and the new passwords, to be to be greater than or equal

    to 14

    17 | P a g e

    hostname(config)#password-policy minimum-changes 14

    • Step 3: Run the following to set the minimum number of upper case characters in

    the password, to be to be greater than or equal to 1

    hostname(config)#password-policy minimum-uppercase 1

    • Step 4: Run the following to set the minimum number of lower case characters in

    the password, to be to be greater than or equal to 1

    hostname(config)#password-policy minimum-lowercase 1

    • Step 5: Run the following to set the minimum number of numeric characters in the

    password, to be greater than or equal to 1

    hostname(config)#password-policy minimum-numeric 1

    • Step 6: Run the following to set the minimum number of special characters in the

    password, to be greater than or equal to 1

    hostname(config)#password-policy minimum-special 1

    • Step 7: Run the following to set the password minimum length, to be greater than or

    equal to 14

    hostname(config)#password-policy minimum-length 14'
  checks:
  - type: sql
    command: show run password-policy
    severity: medium
    info: '• Step 1: Run the following to determine whether the password-policy is set

      hostname#show run password-policy

      Example:

      Asa#sh run password-policy

      password-policy minimum-length 8

      password-policy minimum-numeric 1

      Here the password-policy is configured for the passwords to have at least 8 characters and

      to contain at least a number

      • Step 2: If an output is displayed, the system is compliant. If no'
- id: 1.2.1
  title: Ensure 'Domain Name' is set
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Sets the domain name for the security appliance
  rationale: The domain name is important during the deployment of RSA keys and certificates used by the appliance.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa84/configuration/guide/
  page_start: 20
  audit_raw: '• Step 1: Acquire the enterprise domain name <enterprise_domain>

    • Step 2: Run the following to check whether it is configured

    hostname#sh run | inc domain-name

    The output should be the domain.

    Example:

    asa_internet#sh run domain-name | in example.com

    example.com

    • Step 3: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: '• Step 1: Acquire the enterprise domain name (enterprise_domain)

    • Step 2: Run the following to configure the domain name

    hostname(config)#domain-name <enterprise_domain>'
  checks:
  - type: manual_review
    info: '• Step 1: Acquire the enterprise domain name <enterprise_domain>

      • Step 2: Run the following to check whether it is configured

      hostname#sh run | inc domain-name

      The output should be the domain.

      Example:

      asa_internet#sh run domain-name | in example.com

      example.com

      • Step 3: If an output is displayed, the system is compliant. If not, it is a finding.'
    severity: medium
- id: 1.2.2
  title: Ensure 'Host Name' is set
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Changes the device default hostname
  rationale: The device hostname plays an important role in asset inventory and identification as a security requirement,
    but also in the public keys and certificate deployments as well as when correlating logs from different systems during
    an incident handling.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa84/configuration/guide/
  page_start: 22
  audit_raw: '• Step 1: Run the following to check whether the default name is changed

    hostname# sh run hostname | e _ciscoasa_|_asa

    The output should look like:

    hostnamem name_of_device

    where the name_of_device is not the default one.

    Example:

    Datacenter-asa-1# sh run hostname | e _ciscoasa_|_asa_

    hostname Datacenter-asa-1

    Here the hostname is Datacenter-asa-1

    • Step 2: If an output is displayed, the system is compliant. If not it is a finding.'
  remediation: '• Step 1: Acquire the enterprise naming convention to build the name_of_device

    • Step 2: Run the following to configure the device hostname

    hostname(config)#hostname <name_of_device>'
  checks:
  - type: manual_review
    info: '• Step 1: Run the following to check whether the default name is changed

      hostname# sh run hostname | e _ciscoasa_|_asa

      The output should look like:

      hostnamem name_of_device

      where the name_of_device is not the default one.

      Example:

      Datacenter-asa-1# sh run hostname | e _ciscoasa_|_asa_

      hostname Datacenter-asa-1

      Here the hostname is Datacenter-asa-1

      • Step 2: If an output is displayed, the system is compliant. If not it is a finding.'
    severity: medium
- id: 1.2.3
  title: Ensure 'Failover' is enabled
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Enables failover between the security appliance and another security appliance in order to achieve high availability
  rationale: Enabling failover helps to meet the availability requirement of the security CIA (Confidentiality - Integrity
    - Availability) triad, ensuring a physical and logical redundancy of firewalls in order to avoid service disruption should
    the security appliance or its component fails. It requires to identical systems in hardware and software version connected
    through a failover and a state links.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa91/configuration/genera
  page_start: 24
  audit_raw: '• Step 1: Run the following to check if failover is enabled

    hostname#sh run failover | grep -v no

    Example:

    Asa-fw# sh run failover | grep -v no

    failover

    failover lan unit secondary

    failover lan interface fointerface GigabitEthernet0/0

    failover link fointerface GigabitEthernet0/0

    failover interface ip fointerface 10.0.0.1 255.0.0.0 standby 10.0.0.2

    • Step 2: If an output is displayed, the system is compliant. If not, it is a finding.'
  remediation: 'Follow the steps below to enable active/standby failover. The commands are run in the

    system execution space

    • Step 1: For each appliance, identify the failover link physical interface

    <failover_interface_physical> and assign it a name <failover_interface_name> and IP

    address <failover_interface_ip> and subnet mask <failover_interface_mask>. Identify

    the other device IP address for each appliance as <peer_failover_ip>

    24 | P a g e

    • Step 2: For each appliance, identify the state link physical interface

    <state_interface_physical> and assign it a name <state_interface_name> and IP

    address <state_interface_ip> and subnet mask <state_interface_mask>. Identify the

    other device IP address for each appliance as <peer_state_ip>

    • Step 3: Run the following on the Active device to set it as primary node

    hostname(config)#failover lan unit primary

    • Step 4: Run the following on the Standby device to set it as secondary node

    hostname(config)#failover lan unit secondary

    • Step 5: Run the following on both security appliances

    hostname(config)#failover lan interface <failover_interface_name>

    <failover_interface_physical>

    hostname(config)#failover interface ip <failover_interface_name>

    <failover_interface_ip> <failover_interface_mask> standby <peer_failover_ip>

    hostname(config)#interface <failover_interface_physical>

    hostname(config-if)#no shutdown

    hostname(config)#failover link <state_interface_name>

    <state_interface_physical>

    hostname(config)#failover interface ip <state_interface_name>

    <state_interface_ip> <state_interface_mask> standby <peer_state_ip>

    hostname(config)#interface <state_interface_physical>

    hostname(config-if)#no shutdown

    hostname(config)#failover

    hostname(config)#write memory'
  checks:
  - type: command
    command: hostname#sh run failover | grep -v no && Asa-fw# sh run failover | grep -v no
    expected: ''
    severity: medium
    info: '• Step 1: Run the following to check if failover is enabled

      hostname#sh run failover | grep -v no

      Example:

      Asa-fw# sh run failover | grep -v no

      failover

      failover lan unit secondary

      failover lan interface fointerface GigabitEthernet0/0

      failover link fointerface GigabitEthernet0/0

      failover interface ip fointerface 10.0.0.1 255.0.0.0 standby 10.0.0.2

      • Step 2: If an output is displayed, the system is'
- id: 1.2.4
  title: Ensure 'Unused Interfaces' is disable
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Disables the unused interfaces
  rationale: Shutting down the unused interfaces is a complement to physical security. In fact, an attacker connecting physically
    to an unused port of the security appliance can use the interface to gain access to the device if the relevant interface
    has not been disabled and the source restriction to management access is not enabled.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa72/configuration/guide/
  page_start: 26
  audit_raw: '• Step 1: Run the following command to check if there are unsused ports that have not

    been disabled.

    hostname#sh int ip brief | in __down

    Example:

    This first command lists all the interfaces

    Corp-FW# show int ip brief

    Interface IP-Address OK? Method Status

    Protocol

    GigabitEthernet0/1 unassigned YES unset up

    up

    GigabitEthernet0/1.201 172.16.61.1 YES CONFIG up

    up

    GigabitEthernet0/1.202 172.16.62.171 YES CONFIG up

    up

    GigabitEthernet1/0 unassigned YES unset administratively down

    down

    GigabitEthernet1/1 unassigned YES unset administratively down

    down

    GigabitEthernet1/2 unassigned YES unset down

    down

    GigabitEthernet1/3 192.168.1.11 YES manual up

    up

    This second command is the audit command which looks for unused interfaces that are not

    disabled

    26 | P a g e

    Corp-FW#sh int ip brief | in __down

    GigabitEthernet1/2 unassigned YES unset down

    down

    Here, the interface GigabitEthernet1/2 is unused but not shutdown since the status is

    ''down'' instead of being ''administratively down''

    • Step 2: If there is no output displayed, the system is compliant. If not, it is a finding.'
  remediation: '• Step 1: Identify the physical name <interface_physical_name> of the unused

    interfaces that are not disabled

    • Step 2: For each of the identified interfaces, run the following command

    Hostname(config)#interface <interface_physical_name>

    Hostname(config-if)#shutdown'
  checks:
  - type: sql
    command: show int ip brief
    severity: medium
    info: '• Step 1: Run the following command to check if there are unsused ports that have not

      been disabled.

      hostname#sh int ip brief | in __down

      Example:

      This first command lists all the interfaces

      Corp-FW# show int ip brief

      Interface IP-Address OK? Method Status

      Protocol

      GigabitEthernet0/1 unassigned YES unset up

      up

      GigabitEthernet0/1.201 172.16.61.1 YES CONFIG up

      up

      GigabitEthernet0/1.202 172.16.62.171'
- id: 1.3.1
  title: Ensure 'Image Integrity' is correct
  scoring: manual
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Verifies integrity of an uploaded software before upgrading the system
  rationale: Sometimes, manipulating software from downloading them from the Cisco.com website to uploading them in the security
    appliance can modify the software, mostly when the copy has not been properly performed or the software has transited
    into malware infected machines. For an upgrade to be performed without downtime, the image integrity should be verified.
  impact: ''
  references: []
  page_start: 28
  audit_raw: '• Step 1: Acquire the location in the security appliance of the new image

    <new_image_location> and the MD5 checksum <md5_checksum> from the

    Cisco.com Website

    • Step 2: Run the following command to verify that the MD5 checksum value of the

    new image matches the one provided on the Cisco.com Website

    hostname#verify <new_image_location> <md5_checksum>

    Example:

    Asa-fw# verify disk0:asa803-6-k8.bin 76b5448039e642099334abbfec5a8705

    Verifying file integrity of disk0:/asa803-6-k8.bin!!!!!!!!!!!!!!!!!!

    !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    <lines omitted> !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!Done!

    Verified (disk0:/asa803-6-k8.bin) = 76b5448039e642099334abbfec5a8705

    The new image location is disk0:asa803-6-k8.bin

    • Step 3: If the message ''Verified'' appears at the end of the output, the new image is

    valid. If instead the message ''%Error verifying'' is displayed, the image is not valid.

    It is a finding.

    28 | P a g e'
  remediation: 'Download a new image from the Cisco.com website and apply the audit procedure until

    obtaining the message ''Verified'' at the end of the output.'
  checks:
  - type: manual_review
    info: '• Step 1: Acquire the location in the security appliance of the new image

      <new_image_location> and the MD5 checksum <md5_checksum> from the

      Cisco.com Website

      • Step 2: Run the following command to verify that the MD5 checksum value of the

      new image matches the one provided on the Cisco.com Website

      hostname#verify <new_image_location> <md5_checksum>

      Example:

      Asa-fw# verify disk0:asa803-6-k8.bin 76b5448039e642099334abbfec5a8705

      Verifying file integrity of disk0:/asa803-6-k8.bin!!!!!!!!!!!!!!!!!!

      !'
    severity: medium
- id: 1.3.2
  title: Ensure 'Image Authenticity' is correct
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Verifies for digitally signed images that the running image is from a trusted source
  rationale: The software image being a code can be vulnerable to many attacks such as malicious code injection in the software,
    the modification of the code installed in the ROM. In order to ensure that the image running is from a trusted source,
    the image is digitally signed and its certificate should be verified.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa-commandreference/S/cmdref3/s12.html
  page_start: 30
  audit_raw: "• Step 1: Run the following command to verify the authenticity of the image currently\nrunning on the security\
    \ appliance\nhostname#show software authenticity running | in CiscoSystems$\nExample:\nAsa-fw# show software authenticity\
    \ running\nImage type : Release\n Signer Information\n Common Name : abraxas\n Organization Unit : ASAv\n Organization\
    \ Name : CiscoSystems\n Certificate Serial Number : 565963AF\n Hash Algorithm : SHA2 512\n Signature Algorithm : 2048-bit\
    \ RSA\n Key Version : A\nAsa-fw# show software authenticity running | in CiscoSystems$\n Organization Name : CiscoSystems\n\
    • Step 2: If an output is displayed, the image is sourced from Cisco. The system is\ncompliant. If there is no output\
    \ displayed, the image is not from a trusted source. It\nis a finding."
  remediation: '• Step 1: Correct the errors on the hardware and software

    • Step 2: Run the audit procedure until the system is compliant

    30 | P a g e

    • Step 3: Implement secure delivery of hardware and harden the software

    distribution server'
  checks:
  - type: sql
    command: show software authenticity running | in CiscoSystems$
    severity: medium
    info: "• Step 1: Run the following command to verify the authenticity of the image currently\nrunning on the security\
      \ appliance\nhostname#show software authenticity running | in CiscoSystems$\nExample:\nAsa-fw# show software authenticity\
      \ running\nImage type : Release\n Signer Information\n Common Name : abraxas\n Organization Unit : ASAv\n Organization\
      \ Name : CiscoSystems\n Certificate Serial Number : 565963AF\n Ha"
- id: 1.4.1.1
  title: Ensure 'aaa local authentication max failed attempts' is set to less than or equal to '3'
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
