  description: Sets the security level of the Internet facing interface to 0
  rationale: Where security zones are not configured, the Internet facing interface is the most untrusted interface and must
    have the lowest security-level that is 0. Therefore, any traffic initiated from this interface to the other interfaces
    of the security appliance must be checked by a specific access-control list rule in order to be permitted.
