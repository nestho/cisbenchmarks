  profile:
  - Level 1 - Cisco ASA 8.x
  description: Enables the authentication of RIPv2 neighbor before routing information is received from the neighbor
  rationale: Enabling the routing protocol authentication prevents against attackers who can send wrong routing information
    in order to redirect traffic to their network or send malformed packets in order to saturate and to exhaust the control
    plane.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/support/docs/security/asa-5500-x-series-nextgeneration-firewalls/107255-asa-8x-rip-config-ex.html
  page_start: 131
  audit_raw: "• Step 1: Run the following command to check if the RIP protocol is enabled\nhostname#sh run | in router.rip\n\
    Example:\nAsa-fw#sh run | in router.rip\nrouter rip\n• Step 2: If an output is displayed, RIP is enabled. Go to Step 3.\
    \ If there is no output,\nRIP is not enabled and the recommendation is not applicable.\n• Step 3: Run the following to\
    \ check whether RIP authentication is enabled\nhostname#sh run | in rip.authentication.key\nExample:\nAsa-fw#sh run |\
    \ in rip.authentication.key\n rip authentication key ***** key_id 11\n• Step 4: If an output is displayed, the system\
    \ is compliant. If not, it is a finding.\n131 | P a g e"
  remediation: '• Step 1: Acquire the interface <interface_name> used by the firewall to receive RIP

    routing updates

    • Step 2: Agree with the neighbor device on the authencation key <key_value> and

