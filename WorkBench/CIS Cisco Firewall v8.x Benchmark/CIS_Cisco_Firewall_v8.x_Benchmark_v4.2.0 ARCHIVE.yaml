    severity: medium
- id: 1.6.3
  title: Ensure 'RSA key pair' is greater than or equal to 2048 bits
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Generates an RSA key pair used by SSH protocol of at least 2048 bits
  rationale: Secure Shell (SSH) is a secure remote-login protocol. The ASA allows SSH connections to the ASA for management
    purposes and supports the SSH DES and 3DES ciphers. SSH uses a key-exchange method based on Rivest-Shamir-Adleman (RSA)
    public-key. Since RSA 1024bit keys are likely to become crackable, it is recommended to have RSA keys of at least 2048
    bits.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/security/asa/asa91/configuration/genera
  page_start: 77
  audit_raw: "• Step 1: Run the following to determine whether the RSA key modulus size is equal\nor greater than 2048 bits.\n\
    hostname#sh crypto key mypubkey rsa | i _Modulus_Size_.bits.._[2-9][0-9][09][0-9]\nThs is an example of output where the\
    \ key pair modulus size is 2048 bits:\nAsa# sh crypto key mypubkey rsa | i _Modulus_Size_.bits.._[2-9][0-9][0-9][09]\n\
    \ Modulus Size (bits): 2048\n• Step 2: If this output is not displayed, either there is no key configured, either the\n\
    available modulus size is less than 2048 bits. The system is not compliant. If is a\nfinding.\n• Step 3: Run the following\
    \ to check if there is already an existing RSA key pair:\nhostname# sh crypto key mypubkey rsa | i ^Key|^_Usage|^_Modulus\n\
    The example below shows that there are already created RSA key pairs but they are not\ncompliant, since one is 1024 bits\
    \ and the other 768 bits.\nAsa# sh crypto key mypubkey rsa | i ^Key|^_Usage|^_Modulus\n77 | P a g e\n Key pair was generated\
    \ at: 13:54:47 UTC Sep 14 2008\n Key name: <Default-RSA-Key>\n Usage: General Purpose Key\n Modulus Size (bits): 1024\n\
    \ Key pair was generated at: 06:43:39 UTC Mar 2 2003\n Key name: <Default-RSA-Key>.server\n Usage: Encryption Key\n Modulus\
    \ Size (bits): 768"
  remediation: '• Step 1: Acquire the enterprise standard RSA key size greater or equal than 2048 bits

    • Step 2: If the audit procedure revealed existing non-compliant key pairs, run the

    following to remove them:

    hostname(config)#crypto key zeroize rsa

    • Step 3: Run the following to generate compliant RSA key pair:

    hostname(config)# crypto key generate rsa modulus <enterprise_RSA_key_size>

    • Step 4: Run the following to save the RSA keys to persistent Flash memory

    hostname(config)#write memory'
  checks:
  - type: manual_review
    info: "• Step 1: Run the following to determine whether the RSA key modulus size is equal\nor greater than 2048 bits.\n\
      hostname#sh crypto key mypubkey rsa | i _Modulus_Size_.bits.._[2-9][0-9][09][0-9]\nThs is an example of output where\
      \ the key pair modulus size is 2048 bits:\nAsa# sh crypto key mypubkey rsa | i _Modulus_Size_.bits.._[2-9][0-9][0-9][09]\n\
      \ Modulus Size (bits): 2048\n• Step 2: If this output is not displayed, either there is no key configured, either the\n\
      available modulus size is less than 2048"
    severity: medium
