      \ values for maximum connections, maximum embryonic\nconnections, maximum connections per client and maximum embryonic\
      \ connections per\nclient\nAsa#sh run policy-map | i set.connection\n set connection conn-max 9500\n set connection\
      \ embryonic-conn-max 5000\n set connection per-client"
    severity: medium
