  title: Ensure 'SSH version 2' is enabled
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Sets the SSH version to 2
  rationale: SSH is an application running on top of a reliable transport layer, such as TCP/IP, that provides strong authentication
    and encryption capabilities. The ASA allows SSH connections to the ASA for management purposes. The ASA supports the SSH
    remote shell functionality provided in SSH Versions 1 and 2. However, SSH version is known to be a vulnerable protocol
    that can be exploited by attackers.
