  title: Ensure 'aaa authentication enable console' is configured correctly
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Authenticates users trying to access the Enable mode (privileged EXEC mode) through the 'enable' command.
  rationale: The default access to enable mode is done through a password. AAA provides a primary method for authenticating
    users (a username/password database stored on a TACACS+ or RADIUS server or group of servers) and then specifies backup
    method (a locally stored username/password database). The backup method is used if the primary method's database cannot
    be accessed by the networking device.
