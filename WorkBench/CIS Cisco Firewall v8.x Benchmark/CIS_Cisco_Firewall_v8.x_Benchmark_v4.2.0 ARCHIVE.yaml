    viewing it.
  rationale: Having a correct time set on a Cisco ASA is important for two main reasons. The first reason is that digital
    certificates compare this time to the range defined by their Valid From and Valid To fields to define a specific validity
    period. The second reason is to have a relevant time stamps when logging information. Whether you are sending messages
    to a syslog server, sending messages to an SNMP monitoring station, or performing packet captures, time stamps have little
    usefulness if you cannot be certain of their accuracy.
