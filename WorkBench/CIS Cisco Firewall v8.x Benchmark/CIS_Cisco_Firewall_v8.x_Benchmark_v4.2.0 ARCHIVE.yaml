- id: '3.3'
  title: Ensure packet fragments are restricted for untrusted interfaces
  scoring: scored
  profile:
  - Level 1 - Cisco ASA 8.x
  description: Sets the security appliance to drop fragmented packets received on the untrusted interface.
  rationale: Attackers use fragmentation to evade security systems such as firewalls or IPS because the checks are usually
    performed on the first fragment. They can then put malicious payload in the other fragments to perform DoS against internal
    systems. Disabling the fragmentation on the security appliance implies changing its default behavior from accepting up
    to 24 fragments in a packet to accepting only 1 fragment in a packet. In other words, it implies accepting only non fragmented
    packets.
  impact: ''
  references:
  - 1. http://www.cisco.com/en/US/docs/security/asa/asa90/command/reference/f2.ht
