- id: '7.1'
  title: Sanitize Database and Application User Input
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: Always validate user input received from a database client or application by testing type, length, format,
    and range prior to transmitting it to the database server.
  rationale: Sanitizing user input drastically minimizes risk of SQL injection.
  impact: Sanitize user input may require changes to application code or database object syntax. These changes can require
    applications or databases to be taken temporarily off-line. Any change to TSQL or application code should be thoroughly
    tested in testing environment before production implementation.
  references:
  - 1. https://www.owasp.org/index.php/SQL_Injection
  - 2. http://msdn.microsoft.com/en-us/library/ms161953(v=sql.100).aspx
  page_start: 49
  audit_raw: 'Check with the application teams to ensure any database interaction is through the use of

    stored procedures and not dynamic SQL. Revoke any INSERT, UPDATE, or DELETE

    privileges to users so that modifications to data must be done through stored procedures.

    Verify that there''s no SQL query in the application code produced by string concatenation.'
  remediation: '49 | P a g e

    The following steps can be taken to remediate SQL injection vulnerabilities:

    • Review TSQL and application code for SQL Injection

    • Only permit minimally privileged accounts to send user input to the server

    • Minimize the risk of SQL injection attack by using parameterized commands and

    stored procedures

    • Reject user input containing binary data, escape sequences, and comment

    characters

    • Always validate user input and do not use it directly to build SQL statements'
  checks:
  - type: manual_review
    info: 'Check with the application teams to ensure any database interaction is through the use of

      stored procedures and not dynamic SQL. Revoke any INSERT, UPDATE, or DELETE

      privileges to users so that modifications to data must be done through stored procedures.

      Verify that there''s no SQL query in the application code produced by string concatenation.'
    severity: medium
- id: '7.2'
  title: Set the 'CLR Assembly Permission Set' to SAFE_ACCESS for All CLR Assemblies
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: Setting CLR Assembly Permission Sets to SAFE_ACCESS will prevent assemblies from accessing external system
    resources such as files, the network, environment variables, or the registry.
  rationale: Assemblies with EXTERNAL_ACCESS or UNSAFE permission sets can be used to access sensitive areas of the operating
    system, steal and/or transmit data and alter the state and other protection measures of the underlying Windows Operating
    System.
  impact: The remediation measure should first be tested within a test environment prior to production to ensure the assembly
    still functions as designed with SAFE permission setting.
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms345101(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms189790(v=sql.100).aspx
  page_start: 50
  audit_raw: "Execute the following SQL statement:\n50 | P a g e\nSELECT name,\n permission_set_desc\nFROM sys.assemblies\n\
    where is_user_defined = 1;\nAll the returned assemblies should show SAFE_ACCESS in the permission_set_desc column."
  remediation: ALTER ASSEMBLY assembly_name WITH PERMISSION_SET = SAFE;
  checks:
  - type: sql
    command: SELECT name,
    severity: medium
    info: "Execute the following SQL statement:\n50 | P a g e\nSELECT name,\n permission_set_desc\nFROM sys.assemblies\nwhere\
      \ is_user_defined = 1;\nAll the returned assemblies should show SAFE_ACCESS in the permission_set_desc column."
