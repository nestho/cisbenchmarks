- id: '2.11'
  title: Disable Unnecessary SQL Server Protocols
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: SQL Server supports Shared Memory, Named Pipes, TCP/IP and VIA protocols. However, SQL Server should be configured
    to use the bare minimum required based on the organization's needs.
  rationale: Using fewer protocols minimizes the attack surface of SQL Server and in some cases can protect it from remote
    attacks.
  impact: The Database Engine must be stopped and restarted for the change to take effect.
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms191294(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms191294(v=sql.100).aspx
  page_start: 20
  audit_raw: 'Open SQL Server Configuration Manager; go to the SQL Server Network

    Configuration. Ensure that only required protocols are enabled.'
  remediation: 'Open SQL Server Configuration Manager; go to the SQL Server Network

    Configuration. Ensure that only required protocols are enabled. Disable protocols not

    necessary.'
  checks:
  - type: manual_review
    info: 'Open SQL Server Configuration Manager; go to the SQL Server Network

      Configuration. Ensure that only required protocols are enabled.'
    severity: medium
- id: '2.12'
  title: Configure SQL Server to use non-standard ports
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: 20 | P a g e If enabled, the default SQL Server instance will be assigned a default port of TCP:1433 for TCP/IP
    communication. Administrators can also configure named instances to use TCP:1433 for communication. TCP:1433 is a widely
    known SQL Server port and this port assignment should be changed.
  rationale: Using a non-default port helps protect the database from attacks directed to the default port.
  impact: Changing the default port will force DAC (Default Administrator Connection) to listen on a random port. Also, it
    might make benign applications, such as application firewalls, require special configuration.
  references:
  - 1. http://support.microsoft.com/kb/308091
  - 2. http://msdn.microsoft.com/en-us/library/ms177440(v=sql.105).aspx
  page_start: 20
  audit_raw: 'Open a powershell window and run the following command:

    PS C:\>netstat -ano|select-string 1433.+listening

    This should return no lines. If any lines returned, check the process id in the last column if

    it''s a SQL Server instance.'
  remediation: '1. In SQL Server Configuration Manager, in the console pane, expand SQL Server

    Network Configuration, expand Protocols for , and then double-click the TCP/IP or

    VIA protocol

    2. In the TCP/IP Properties dialog box, on the IP Addresses tab, several IP addresses

    appear in the format IP1, IP2, up to IPAll. One of these is for the IP address of the

    loopback adapter, 127.0.0.1. Additional IP addresses appear for each IP Address on

    the computer

    3. Change the TCP Port field from 1433 to another non-standard port or leave the TCP

    Port field empty and set the TCP Dynamic Ports value to 0 to enable dynamic port

    assignment and then click OK.

    4. In the console pane, click SQL Server Services.

    5. In the details pane, right-click SQL Server () and then click Restart, to stop and

    restart SQL Server.'
  checks:
  - type: manual_review
    info: 'Open a powershell window and run the following command:

      PS C:\>netstat -ano|select-string 1433.+listening

      This should return no lines. If any lines returned, check the process id in the last column if

      it''s a SQL Server instance.'
    severity: medium
- id: '2.13'
  title: Set the 'Hide Instance' option to 'Yes' for Production SQL Server instances
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: SQL Server instances within production environments should be designated as hidden to prevent advertisement
    by the SQL Server Browser service.
  rationale: Designating production SQL Server instances as hidden leads to a more secure installation because they cannot
    be enumerated.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms179327(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms179327(v=sql.100).aspx
  page_start: 22
  audit_raw: '1. In SQL Server Configuration Manager, expand SQL Server Network Configuration,

    right-click Protocols for <server instance>, and then select Properties.

    2. On the Flags tab, in the Hide Instance box, select Yes, and then click OK to close the

    dialog box. The change takes effect immediately for new connections.'
  remediation: '1. In SQL Server Configuration Manager, expand SQL Server Network Configuration,

    right-click Protocols for <server instance>, and then select Properties.

    2. On the Flags tab, in the Hide Instance box, select Yes, and then click OK to close the

    dialog box. The change takes effect immediately for new connections.'
  checks:
  - type: manual_review
    info: '1. In SQL Server Configuration Manager, expand SQL Server Network Configuration,

      right-click Protocols for <server instance>, and then select Properties.

      2. On the Flags tab, in the Hide Instance box, select Yes, and then click OK to close the

      dialog box. The change takes effect immediately for new connections.'
    severity: medium
- id: '2.14'
  title: Disable the 'sa' Login Account
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: The sa account is a widely known and often widely used SQL Server account with sysadmin privileges.
  rationale: Enforcing this control reduces the probability of an attacker executing brute force attacks against a well-known
    principal.
  impact: It is not a good security practice to code applications or scripts to use the sa account. However, if this has been
    done disabling the sa account will prevent scripts and applications for authenticating to the database server and executing
    required tasks or functions.
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms188786(v=sql.100).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms188786(v=sql.105).aspx
  page_start: 22
  audit_raw: 'Use the following syntax to determine if the sa account is disabled.

    SELECT name, is_disabled

    FROM sys.server_principals

    WHERE sid = 0x01;

    An is_disabled value of 1 indicates the account is currently disabled.'
  remediation: 'Execute the following query:

    ALTER LOGIN sa DISABLE;'
  checks:
  - type: sql
    command: SELECT name, is_disabled
    severity: medium
    info: 'Use the following syntax to determine if the sa account is disabled.

      SELECT name, is_disabled

      FROM sys.server_principals

      WHERE sid = 0x01;

      An is_disabled value of 1 indicates the account is currently disabled.'
- id: '2.15'
  title: Rename the 'sa' Login Account
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: The sa account is a widely known and often widely used SQL Server account with sysadmin privileges.
  rationale: It is more difficult to launch password-guessing and brute-force attacks against the sa account if the username
    is not known.
  impact: It is not a good security practice to code applications or scripts to use the sa account. However, if this has been
    done renaming the sa account will prevent scripts and applications for authenticating to the database server and executing
    required tasks or functions.
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms144284.aspx
  page_start: 23
  audit_raw: 'Use the following syntax to determine if the sa account is renamed.

    SELECT name

    FROM sys.server_principals

    WHERE sid = 0x01;

    A name of sa indicates the account has not been renamed.'
  remediation: 'Replace the different_user value within the below syntax and execute rename the sa login.

    ALTER LOGIN sa WITH NAME = different_user;'
  checks:
  - type: sql
    command: SELECT name
    severity: medium
    info: 'Use the following syntax to determine if the sa account is renamed.

      SELECT name

      FROM sys.server_principals

      WHERE sid = 0x01;

      A name of sa indicates the account has not been renamed.'
- id: '3.1'
  title: Revoke Execute on 'xp_availablemedia' to PUBLIC
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: Lists all available storage devices that may be written to.
  rationale: Ensuring this procedure is disabled will prevent an attacker from viewing local available drives for directory
    and file enumeration. This procedure is currently leveraged by several automated SQL Injection tools.
  impact: ''
  references:
  - 1. No references available as this is an undocumented extended stored procedure.
  page_start: 25
  audit_raw: 'The following steps can be used to audit using SQL Server Management Studio:

    1. In Object Explorer, navigate to the SQL Server instance and expand the path:

    Databases\System Databases\master\Programmability\Extended Stored

    Procedures\System Extended Stored Procedures

    2. Locate xp_availablemedia, right click and select Properties

    3. Select the Permissions tab

    4. If the ''public'' entry does not exist within the Users or Roles listing the server is in

    compliance with the recommendation and you can halt further steps. If the ''public''

    entry does exist proceed to step 5

    5. Select the ''public'' entry within the Users or Roles listing

    6. If the Grant checkbox for the Execute permission is checked the Public role

    maintains Execute permission on the procedure and the listed remediation

    procedure should be followed.

    The following steps can be used to audit using Transact-SQL:

    select OBJECT_NAME(major_id) as ''extended_procedure'', permission_name, ''PUBLIC'' as

    ''to_principal'' from sys.database_permissions where major_id =

    OBJECT_ID(''xp_availablemedia'') AND [type] = ''EX'' AND grantee_principal_id = 0

    Any record returned indicates the public role maintains execute permission on the

