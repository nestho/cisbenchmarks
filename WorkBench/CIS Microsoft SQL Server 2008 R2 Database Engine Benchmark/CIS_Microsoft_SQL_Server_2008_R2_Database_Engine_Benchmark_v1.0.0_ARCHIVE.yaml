- id: '2.7'
  title: Set the 'Remote Admin Connections' Server Configuration Option to 0
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: This option defines whether the Dedicated Admin Connection (DAC) is listening on localhost only or on the SQL
    Server IP address.
  rationale: The Dedicated Admin Connection is a powerful database feature that allows connected users to circumvent the SQL
    Server abstraction layer and have direct access to several system tables which can be used to conduct malicious activities.
    This feature should be restricted to local administration only to reduce exposure.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms190468(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms190468(v=sql.100).aspx
  page_start: 16
  audit_raw: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use\
    \ as int) as value_in_use\nFROM sys.configurations\nWHERE name = 'Remote admin connections';\nBoth value columns must\
    \ show 1 on clustered installations."
  remediation: 'Run the following T-SQL command on clustered installations:

    EXECUTE sp_configure ''show advanced options'', 1;

    RECONFIGURE;

    EXECUTE sp_configure ''Remote admin connections'', 1;

    RECONFIGURE;

    GO

    EXECUTE sp_configure ''show advanced options'', 0;

    RECONFIGURE;'
  checks:
  - type: manual_review
    info: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use as\
      \ int) as value_in_use\nFROM sys.configurations\nWHERE name = 'Remote admin connections';\nBoth value columns must show\
      \ 1 on clustered installations."
    severity: medium
