controls:
- id: '1.1'
  title: Install the Latest SQL Server Service Packs and Hotfixes
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: SQL Server patches contain program updates that fix security and product functionality issues found in the
    software. These patches can be installed with a hotfix which is a single patch, a cumulative update which is a small group
    of patches or a service pack which is a large collection of patches. The SQL Server version and patch levels should be
    the most recent compatible with the organizations' operational needs
  rationale: Using the most recent SQL Server software, along with all applicable patches can help limit the possibilities
    for vulnerabilities in the software, the installation version and/or patches applied during setup should be established
    according to the needs of the organization.
  impact: ''
  references:
  - 1. http://support.microsoft.com/sp
  - 2. http://support.microsoft.com/kb/968382
  page_start: 9
  audit_raw: 'To determine your SQL Server service pack level, run the following code snippet.

    SELECT SERVERPROPERTY(''ProductLevel'') as SP_installed,

    SERVERPROPERTY(''ProductVersion'') as Version;

    First column returns the installed Service Pack level, the second is the exact build number.'
  remediation: 'Identify the current version and patch level of your SQL Server instances and ensure they

    contain the latest security fixes. Make sure to test these fixes in your test environments

    before updating production instances.

    9 | P a g e

    The most recent SQL Server patches can be found here:

    Hotfixes and Cumulative updates: http://blogs.msdn.com/b/sqlreleaseservices/

    Service Packs: http://support.microsoft.com/kb/968382'
  checks:
  - type: manual_review
    info: 'To determine your SQL Server service pack level, run the following code snippet.

      SELECT SERVERPROPERTY(''ProductLevel'') as SP_installed,

      SERVERPROPERTY(''ProductVersion'') as Version;

      First column returns the installed Service Pack level, the second is the exact build number.'
    severity: medium
- id: '2.1'
  title: Set the 'Ad Hoc Distributed Queries' Server Configuration Option to 0
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: Ad Hoc Distributed Queries Allow users to query data and execute statements on external data sources. This
    functionality should be disabled.
  rationale: This feature can be used to remotely access and exploit vulnerabilities on remote SQL Server instances and to
    run unsafe Visual Basic for Application functions.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms187569(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms187569(v=sql.100).aspx
  page_start: 10
  audit_raw: 'Run the following T-SQL command:

    SELECT name, CAST(value as int) as value_configured, CAST(value_in_use as int) as

    value_in_use

    FROM sys.configurations

    WHERE name = ''ad hoc distributed queries'';

    10 | P a g e

    Both value columns must show 0.'
  remediation: 'Run the following T-SQL command:

    EXECUTE sp_configure ''show advanced options'', 1;

    RECONFIGURE;

    EXECUTE sp_configure ''Ad Hoc Distributed Queries'', 0;

    RECONFIGURE;

    GO

    EXECUTE sp_configure ''show advanced options'', 0;

    RECONFIGURE;'
  checks:
  - type: manual_review
    info: 'Run the following T-SQL command:

      SELECT name, CAST(value as int) as value_configured, CAST(value_in_use as int) as

      value_in_use

      FROM sys.configurations

      WHERE name = ''ad hoc distributed queries'';

      10 | P a g e

      Both value columns must show 0.'
    severity: medium
- id: '2.2'
  title: Set the 'CLR Enabled' Server Configuration Option to 0
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: The CLR enabled option specifies whether user assemblies can be run by SQL Server.
  rationale: Enabling use of CLR assemblies widens the attack surface of SQL Server and puts it at risk from both inadvertent
    and malicious assemblies.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use\
    \ as int) as value_in_use\nFROM sys.configurations\nWHERE name = 'clr enabled';\nBoth value columns must show 0.\n11 |\
    \ P a g e"
  remediation: 'Run the following T-SQL command:

    EXECUTE sp_configure ''clr enabled'', 0;

    RECONFIGURE;'
  checks:
  - type: manual_review
    info: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use as\
      \ int) as value_in_use\nFROM sys.configurations\nWHERE name = 'clr enabled';\nBoth value columns must show 0.\n11 |\
      \ P a g e"
    severity: medium
- id: '2.3'
  title: Set the 'Cross DB Ownership Chaining' Server Configuration Option to 0
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: This option allows controlling cross-database ownership chaining across all databases.
  rationale: This option allows a member of the db_owner role in a database to gain access to objects owned by a login in
    any other database, causing an unnecessary information disclosure.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms188694(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms188694(v=sql.100).aspx
  page_start: 12
  audit_raw: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use\
    \ as int) as value_in_use\nFROM sys.configurations\nWHERE name = 'Cross db ownership chaining';\nBoth value columns must\
    \ show 0."
  remediation: 'Run the following T-SQL command:

    EXECUTE sp_configure ''Cross db ownership chaining'', 0;

    RECONFIGURE;

    GO'
  checks:
  - type: manual_review
    info: "Run the following T-SQL command:\nSELECT name,\n CAST(value as int) as value_configured,\n CAST(value_in_use as\
      \ int) as value_in_use\nFROM sys.configurations\nWHERE name = 'Cross db ownership chaining';\nBoth value columns must\
      \ show 0."
    severity: medium
