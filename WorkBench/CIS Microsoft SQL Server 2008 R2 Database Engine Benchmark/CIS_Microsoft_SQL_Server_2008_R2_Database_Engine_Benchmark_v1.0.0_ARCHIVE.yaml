- id: '4.2'
  title: Revoke CONNECT permissions on the 'guest user' within all SQL Server databases excluding the master, msdb and tempdb
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: Removes the right of guest users to connect to SQL Server user databases.
  rationale: A login assumes the identity of the guest user when a login has access to SQL Server but does not have access
    to a database through its own account and the database has a guest user account. Revoking the connect permission for the
    guest user will ensure that a login is not able to access database information without explicit access to do so.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/bb402861(v=sql.105).aspx
  - 2. http://msdn.microsoft.com/en-us/library/bb402861(v=sql.100).aspx
  page_start: 42
  audit_raw: 'Run the following code snippet in each database in the instance to determine if the guest

    user exists.

