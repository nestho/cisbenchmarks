- id: '2.10'
  title: Set the 'Trustworthy' Database Property to Off
  scoring: scored
  profile:
  - Level 1 - SQL Server 2008.x
  description: The TRUSTWORTHY option allows database objects to access objects in other database under certain circumstances.
  rationale: Provides protection from malicious CLR assemblies or extended procedures.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/ms187861(v=sql.100).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms187861(v=sql.105).aspx
  page_start: 19
  audit_raw: 'Run the following T-SQL query to list the database with a Trustworthy database property

    value of ON:

    SELECT name

    FROM sys.databases

    WHERE is_trustworthy_on = 1

    AND name != ''msdb''

    AND state = 0;'
  remediation: 'Execute the following statement against the database:

    ALTER DATABASE <dbname>

    SET TRUSTWORTHY OFF;'
