    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, uncheck the checkbox for

    Allow users to accept untrusted TLS certificates.

    24 | P a g e

    5. Deploy the Configuration Profile.'
