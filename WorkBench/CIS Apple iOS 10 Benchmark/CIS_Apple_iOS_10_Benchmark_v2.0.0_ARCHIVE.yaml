- id: 2.2.1.11
  title: (L1) Ensure 'Show Control Center in Lock screen' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the display of Control Center on the lock screen.
  rationale: When a device is lost or stolen, the Control Center may be used to enable airplane mode; thus preventing locating
    or erasing the device. Disabling Control Center forces a malicious actor to power down the device, which then discards
    the encryption key in memory. This makes some attacks based on physical possession more difficult.
  impact: ''
  references: []
