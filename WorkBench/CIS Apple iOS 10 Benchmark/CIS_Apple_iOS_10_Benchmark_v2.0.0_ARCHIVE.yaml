- id: 2.2.1.3
  title: (L1) Ensure 'Allow managed apps to store data in iCloud' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to managed apps storing and syncing data through iCloud. This recommendation pertains
    to encrypting iTunes backups of iOS devices.
  rationale: This recommendation addresses data leakage. It prevents a user from installing an app that is managed by the
    organization on a personal device and having iCloud sync the managed app data to the personal, non-managed app. Data that
    are stored securely on an iOS device may be trivially accessed from a local computer backup. Forcing the encryption of
    backups protects data from being compromised if the local host computer is compromised.
  impact: Syncing managed app data between multiple managed devices will not be possible. End-users must configure a password
    for the encrypted backup; the complexity of which is not managed.
  references: []
  page_start: 20
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, the checkbox for

    Allow managed apps to store data in iCloud is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Managed apps cloud sync not allowed is displayed

    From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, the checkbox for

    Force encrypted backups is checked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Encrypted backups enforced is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, uncheck the checkbox for

    Allow managed apps to store data in iCloud.

    5. Deploy the Configuration Profile.

    20 | P a g e

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, check the checkbox for

    Force encrypted backups.

    5. Deploy the Configuration Profile.

    22 | P a g e'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left windowpane, click on the Restrictions tab.

