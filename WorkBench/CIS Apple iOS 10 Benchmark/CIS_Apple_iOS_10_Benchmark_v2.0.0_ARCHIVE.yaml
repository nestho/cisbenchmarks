    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap Profile.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Establishing untrusted TLS connections not allowed is displayed.'
  remediation: '1. Open Apple Configurator.

