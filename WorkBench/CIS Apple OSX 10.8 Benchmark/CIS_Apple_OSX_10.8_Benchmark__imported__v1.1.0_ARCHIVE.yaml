- id: '3.4'
  title: Configure Security Auditing Flags
  scoring: scored
  profile:
  - Level 1
  description: Auditing is the capture and maintenance of information about security-related events.
  rationale: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises or attacks that have occurred, has begun, or is about to begin. Audit logs are necessary
    to provide a trail of evidence in case the system or network is compromised.
  impact: ''
  references:
  - '1. Rule Version (STIG-ID): OSX00145 M6'
  page_start: 66
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    sudo egrep "^flags:" /etc/security/audit_control

    2. Ensure at least the following flags are present:

    - `lo` - audit successful/failed login/logout events

    - ad - audit successful/failed administrative events

    - `fd` - audit successful/failed file deletion events

    - `fm` - audit successful/failed file attribute modification events

    - `-all` - audit all failed events across all audit classes

    Note: excluding potentially noisy audit events may be ideal, depending on

    your use-case. For example, DISA recommends filtering failed file attribute

    access events (`^-fa`), failed file creation events (`^-fc`), and failed file

    closure events (`^-cl`).'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and edit the /etc/security/audit\_control file

    2. Find the line beginning with "flags"

    3. Add the following flags: lo, ad, fd, fm, -all.

    4. Save the file.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      sudo egrep "^flags:" /etc/security/audit_control

      2. Ensure at least the following flags are present:

      - `lo` - audit successful/failed login/logout events

      - ad - audit successful/failed administrative events

      - `fd` - audit successful/failed file deletion events

      - `fm` - audit successful/failed file attribute modification events

      - `-all` - audit all failed events across all audit c'
    severity: medium
- id: '4.1'
  title: Disable Bonjour advertising service
  scoring: scored
  profile:
  - Level 2
  description: Bonjour is an auto-discovery mechanism for TCP/IP devices which enumerate devices and services within a local
    subnet. DNS on Mac OS X 10.8 is integrated with Bonjour and should not be turned off, but Bonjour advertising service
    can be disabled.
  rationale: Bonjour can simplify device discovery from an internal rogue or compromised host. An attacker could use Bonjour's
    multicast DNS feature to discover a vulnerable or poorlyconfigured service or additional information to aid a targeted
    attack.
  impact: Some applications, like Final Cut Studio and AirPort Base Station management, may not operate properly if the mDNSResponder
    is turned off.
  references: []
  page_start: 68
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    defaults read /Library/Preferences/com.apple.alf globalstate

    2. Verify the value returned is `1` or `2`'
  remediation: "Perform the following to implement the prescribed state:\n1. Make a backup copy of the mDNSResponder.plist\
    \ file as a precaution.\n2. Open the mDNSResponder.plist file in Terminal using your preferred text editor.\nBelow is\
    \ a sample command: ```\nsudo nano \"/System/Library/LaunchDaemons/com.apple.mDNSResponder.plist\"\n3. Add `<string>-NoMulticastAdvertisements</string>`\
    \ to the array in the\n`ProgramArguments` section. For example, the following: ```\n <key>ProgramArguments</key>\n <array>\n\
    \ <string>/usr/sbin/mDNSResponder</string>\n <string>-launchd</string>\n </array>\n```becomes: ```\n <key>ProgramArguments</key>\n\
    \ <array>\n <string>/usr/sbin/mDNSResponder</string>\n <string>-launchd</string>\n <string>-NoMulticastAdvertisements</string>\n\
    \ </array>\n4. Save the file."
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      defaults read /Library/Preferences/com.apple.alf globalstate

      2. Verify the value returned is `1` or `2`'
    severity: medium
