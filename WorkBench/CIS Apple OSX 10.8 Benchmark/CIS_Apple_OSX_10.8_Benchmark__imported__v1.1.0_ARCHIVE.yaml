- id: 5.1.2
  title: Repair permissions regularly to ensure binaries and other System files have appropriate permissions
  scoring: manual
  profile:
  - Level 1
  description: Software installations, Upgrades and updates and end user activity can all end up changing the access controls
    on the Operating System. On a normal system lots of files get touched and changed and proper maintenance is necessary
    for good security. The standard software load on an end user system has so many moving parts that have regular updates
    to require periodic file permissions repair. We believe that a weekly permissions check should be scheduled to fix anything
    needed.
  rationale: Permission problems can lead to exploitable gaps in the operating system. Without expected controls in place
    the system is more likely to be successfully attacked.
  impact: System executables and other important files could be modified much more easily if appropriate permissions are not
    in place.
  references: []
  page_start: 76
  audit_raw: 'Check the System logs to ensure that Repair permissions was run in the last week.

    sudo cat /var/log/system.log* | grep RepairPermissions'
  remediation: 'Manually run the check using Disk Utility or through the command line. A schedule

    should be set in /etc/periodic/weekly/

    sudo diskutil repairPermissions /'
  checks:
  - type: command
    command: sudo cat /var/log/system.log* | grep RepairPermissions
    expected: ''
    severity: medium
    info: 'Check the System logs to ensure that Repair permissions was run in the last week.

      sudo cat /var/log/system.log* | grep RepairPermissions'
