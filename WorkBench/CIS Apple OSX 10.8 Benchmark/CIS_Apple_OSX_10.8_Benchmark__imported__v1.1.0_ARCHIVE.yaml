controls:
- id: '1.1'
  title: Verify all application software is current
  scoring: scored
  profile:
  - Level 1
  description: Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered.
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Missing patches can lead to more exploit opportunities.
  references:
  - '1. Rule Version (STIG-ID): OSX00055 M6'
  page_start: 14
  audit_raw: "Perform the following to ensure the system is configured as prescribed:\n1. Choose Apple (\n ) menu > Software\
    \ Update - If prompted, enter an admin name\nand password.\n2. Verify that all available updates and software patches\
    \ are installed.\nAlternatively:\n1. In Terminal, run the following: ```\nsudo softwareupdate -l\n2. Result: `No new software\
    \ available`"
  remediation: "Perform the following to ensure the system is configured as prescribed:\n1. Choose Apple (\n ) menu > Software\
    \ Update - If prompted, enter an admin name\nand password.\n2. Install all available updates and software patches that\
    \ are applicable.\nAlternatively:\n1. In Terminal, run the following: ```\nsudo softwareupdate -l\n2. In Terminal, run\
    \ the following for any packages that show up in step 1:\n```\nsudo softwareupdate -i <em>packagename</em>"
  checks:
  - type: manual_review
    info: "Perform the following to ensure the system is configured as prescribed:\n1. Choose Apple (\n ) menu > Software\
      \ Update - If prompted, enter an admin name\nand password.\n2. Verify that all available updates and software patches\
      \ are installed.\nAlternatively:\n1. In Terminal, run the following: ```\nsudo softwareupdate -l\n2. Result: `No new\
      \ software available`"
    severity: medium
- id: '1.2'
  title: Enable Auto Update
  scoring: scored
  profile:
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates.
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities.
  impact: ''
  references:
  - '1. Rule Version (STIG-ID): OSX00290 M6'
  - 2.1 Bluetooth
  page_start: 16
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Open a terminal session and enter the following command: ```

    sudo softwareupdate --schedule

    2. Make sure the result is: `Automatic check is on`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable the auto

    update feature: ```

    sudo softwareupdate --schedule on'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Open a terminal session and enter the following command: ```

      sudo softwareupdate --schedule

      2. Make sure the result is: `Automatic check is on`'
    severity: medium
- id: 2.1.1
  title: Disable Bluetooth, if no paired devices exist
  scoring: scored
  profile:
  - Level 1
  description: Bluetooth devices use a wireless communications system that replaces the cables connecting them to system.
    It is by design a peer-to-peer network technology and typically lacks centralized administration and security enforcement
    infrastructure.
  rationale: Bluetooth is particularly susceptible to a diverse set of security vulnerabilities involving identity detection,
    location tracking, denial of service, unintended control and access of data and voice channels, and unauthorized device
    control and data access.
  impact: There have been many Bluetooth exploits, while Bluetooth can be hardened it does create a local wireless network
    that can be attacked to compromise both devices and information.
  references:
  - 1. Bluetooth Security, Systems and Network Analysis Center, National Security
  page_start: 19
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command: ```

    defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

    2. If the value returned is `0 `the computer is compliant.

    3. If the value returned is `1`` `that indicates that Bluetooth is enabled;

    the computer is compliant only if paired devices exist. Use the following

    step.

    4. If step 3 is 1 in Terminal, run the following command: ```

    <span>system_profiler | grep "Bluetooth:" -A 20 | grep Connectable</span>

    5. Output should include: Connectable: Yes'
  remediation: 'Perform the following to implement the prescribed state:

    1. In Terminal, run the following commands: ```

    sudo defaults write /Library/Preferences/com.apple.Bluetooth \

    ControllerPowerState -int 0

    sudo killall -HUP blued'
  checks:
  - type: command
    command: <span>system_profiler | grep "Bluetooth:" -A 20 | grep Connectable</span>
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command: ```

      defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

      2. If the value returned is `0 `the computer is compliant.

      3. If the value returned is `1`` `that indicates that Bluetooth is enabled;

      the computer is compliant only if paired devices exist. Use the follow'
- id: 2.1.2
  title: Disable Bluetooth "Discoverable" mode when not pairing devices
  scoring: scored
  profile:
  - Level 1
  description: When Bluetooth is set to discoverable mode, the Mac sends a signal indicating that it's available to pair with
    another Bluetooth device. When a device is "discoverable" it broadcasts information about itself and it's location.
  rationale: When in the discoverable state an unauthorized user could gain access to the system by pairing it with a remote
    device.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

    2. Verify the value returned is Discoverable: Off'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Bluetooth

    3. Uncheck Discoverable'
  checks:
  - type: command
    command: /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

      2. Verify the value returned is Discoverable: Off'
- id: 2.1.3
  title: Show Bluetooth status in menu bar
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, Discoverable, what paired devices exist and are currently active.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

    2. Verify the value returned is: `/System/Library/CoreServices/Menu

    Extras/Bluetooth.menu`'
  remediation: 'In System Preferences: Bluetooth, turn Show Bluetooth Status In Menu Bar on.

    2.2 Date & Time

    This section contains recommendations related to the configurable items under the Date

    & Time panel.'
  checks:
  - type: command
    command: defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

      2. Verify the value returned is: `/System/Library/CoreServices/Menu

      Extras/Bluetooth.menu`'
- id: 2.2.1
  title: Enable "Set time and date automatically"
  scoring: scored
  profile:
  - Level 1
  description: Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries.
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features.
  impact: 'Note: If your organization has internal time servers, enter them here. Enterprise mobile devices may need to use
    a mix of internal and external time servers.'
  references:
  - '1. Rule Version (STIG-ID): OSX00285 M6'
  - 2.3 Desktop & Screen Saver
  page_start: 24
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command: ```

    sudo systemsetup -getusingnetworktime

    2. Verify that the results are: `Network Time: On`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Date & Time

    3. Select Set date and time automatically

    Alternatively run the following command:

    sudo systemsetup -setnetworktimeserver <timeserver>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command: ```

      sudo systemsetup -getusingnetworktime

      2. Verify that the results are: `Network Time: On`'
    severity: medium
- id: 2.3.1
  title: Set an inactivity interval of 20 minutes or less for the screen saver
  scoring: scored
  profile:
  - Level 1
  description: A locking screensaver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In OS X the screensaver starts after a value selected
    in a drop down menu, 10 minutes and 20 minutes are both options and either is acceptable. Any value can be selected through
    the command line or script but a number that is not reflected in the GUI can be problematic. 20 minutes is the default
    for new accounts.
  rationale: Setting an inactivity interval for the screensaver prevents unauthorized persons from viewing a system left unattended
    for an extensive period of time.
  impact: If the screensaver is not set users may leave the computer available for an unauthorized to person to access information.
  references: []
  page_start: 26
  audit_raw: "The preferred audit procedure for this control will evaluate every user account on the\nbox and will report\
    \ on all users where the value has been set. If the default value of 20\nminutes is used and the user has never changed\
    \ the setting there will not be an audit\nresult on their compliant setting.\nPerform the following to ensure the system\
    \ is configured as prescribed:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep \"IOPlatformUUID\" | sed -e\n's/^.*\
    \ \"\\(.*\\)\"$/\\1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
    \ if [ -e $PREF.plist ]\n<span> then </span><span> echo -n \"Checking User: '$i': \" defaults read\n$PREF.plist idleTime\
    \ 2>&1 fi done</span>\nVerify the setting is not 0 but is adequately low (< 1200)\nPerform the following to ensure the\
    \ system is configured as prescribed for the current\nlogged in user:\n1. In Terminal, run the following command: ```\n\
    defaults -currentHost read com.apple.screensaver idleTime\n2. Verify the setting is not but is adequately low (_< 1200_)"
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Desktop & Screen Saver

    3. Select Screen__Saver

    4. Set Start after to 20 minutes or less

    Alternatively:

    1. In Terminal, run one of the the following commands: ```

    defaults -currentHost write com.apple.screensaver idleTime -int 600

    defaults -currentHost write com.apple.screensaver idleTime -int 1200

    There are anomalies if the command line is used make the setting something

    other than what is available in the GUI Menu. Choose either 10 minutes or 20

    minutes,'
  checks:
  - type: command
    command: UUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep "IOPlatformUUID" | sed -e
    expected: ''
    severity: medium
    info: 'The preferred audit procedure for this control will evaluate every user account on the

      box and will report on all users where the value has been set. If the default value of 20

      minutes is used and the user has never changed the setting there will not be an audit

      result on their compliant setting.

      Perform the following to ensure the system is configured as prescribed:

      UUID=`ioreg -rd1 -c IOPlatform'
- id: 2.3.2
  title: Secure screen saver corners
  scoring: scored
  profile:
  - Level 2
  description: Hot Corners can be configured to disable the screen saver by moving the mouse cursor to a corner of the screen.
  rationale: Setting a hot corner to disable the screen saver poses a potential security risk since an unauthorized person
    could use this to bypass the login screen and gain access to the system.
  impact: ''
  references:
  - 1. SV-37242r1_rule
  page_start: 28
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. For all users, run the following command in Terminal: ```

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    2. Verify that `6` is not returned for any key value for any user.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Mission Control

    3. Select Hot Corners

    4. Remove any corners which are set to Disable Screen Saver'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: 2. Verify that `6` is not returned for any key value for any user.
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. For all users, run the following command in Terminal: ```

      defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

      2. Verify that `6` is not returned for any key value for any user.'
- id: 2.3.3
  title: Verify Display Sleep is set to a value larger than the Screen Saver
  scoring: manual
  profile:
  - Level 1
  description: If the Screen Saver is used to lock the screen, verify the Display Sleep settings are longer than the Screen
    Saver setting. If the display goes to sleep before the screen saver activates, the computer will appear to be off, but
    will be unprotected.
  rationale: Users of the system can easily assume that the computer is protected when the display goes to sleep. The computer
    should be configured so that the screen is locked whenever the display turns off automatically.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'In System Preferences: Energy Saver, verify the slider for "Put the display(s) to sleep..."

    to a reasonable number, but longer than the screen saver setting. The Mac will display

    a warning if the number is too short.

    Alternatively, use the following command:

    pmset -g | grep displaysleep

    and verify the value returned is longer than the Screen Saver, if the Screen Saver is

    used to lock the screen.'
  remediation: 'In System Preferences: Energy Saver, drag the slider for "Put the display(s) to sleep..."

    to a reasonable number, but longer than the screen saver setting. The Mac will display

    a warning if the number is too short.

    Alternatively, use the following command:

    sudo pmset -c displaysleep 0

    Note: The -c flag means "wall power." Different settings must be used for other power

    sources.'
  checks:
  - type: command
    command: pmset -g | grep displaysleep
    expected: ''
    severity: medium
    info: 'In System Preferences: Energy Saver, verify the slider for "Put the display(s) to sleep..."

      to a reasonable number, but longer than the screen saver setting. The Mac will display

      a warning if the number is too short.

      Alternatively, use the following command:

      pmset -g | grep displaysleep

      and verify the value returned is longer than the Screen Saver, if the Screen Saver is

      used to lock the screen.'
- id: 2.3.4
  title: Set a screen corner to Start Screen Saver
  scoring: scored
  profile:
  - Level 2
  description: The intent of this control is to resemble control-alt-delete on Windows Systems as a means of quickly locking
    the screen. If the user of the system is stepping away from the computer the best practice is to lock the screen and setting
    a hot corner is an appropriate method.
  rationale: Ensuring the user has a quick method to lock their screen may reduce opportunity for individuals in close physical
    proximity of the device to see screen contents.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'In System Preferences: Exposé & Spaces, make sure at least one Active Screen

    Corner is set to Start Screen Saver. Make sure the user knows about this feature.

    Alternatively, run the following command for each user:

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    For each user, verify at least one of the *-corner keys has a value of 5.For example,

    "wvous-tl-corner" = 5.'
  remediation: 'In System Preferences: Exposé & Spaces, make sure at least one Active Screen

    Corner is set to Start Screen Saver. Make sure the user knows about this feature.

    The screen corners can be set using the defaults command, but the permutations of

    combinations are many. The plist file to check is

    ~/Library/Preferences/com.apple.dock and the keys are

    wvous-bl-corner

    wvous-br-corner

    wvous-tl-corner

    wvous-tr-corner

    There are also modifier keys to check and various values for each of these keys. A

    value of 5 means the corner will start the screen saver. The corresponding wvous-xxmodifier key should be set to 0.

    2.4 Sharing

    This section contains recommendations related to the configurable items under the

    Sharing panel.'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: ''
    severity: medium
    info: 'In System Preferences: Exposé & Spaces, make sure at least one Active Screen

      Corner is set to Start Screen Saver. Make sure the user knows about this feature.

      Alternatively, run the following command for each user:

      defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

      For each user, verify at least one of the *-corner keys has a value of 5.For example,

      "wvous-tl-corner" = 5.'
- id: 2.4.1
  title: Disable Remote Apple Events
  scoring: scored
  profile:
  - Level 1
  description: Apple Events is a technology that allows one program to communicate with other programs. Remote Apple Events
    allows a program on one computer to communicate with a program on a different computer.
  rationale: Disabling Remote Apple Events mitigates the risk of an unauthorized program gaining access to the system.
  impact: With remote Apple events turned on, an AppleScript program running on another Mac can interact with the local computer.
  references: []
  page_start: 32
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    sudo systemsetup -getremoteappleevents

    2. Verify the value returned is `Remote Apple Events: Off`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal: ```

    sudo systemsetup -setremoteappleevents off'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      sudo systemsetup -getremoteappleevents

      2. Verify the value returned is `Remote Apple Events: Off`'
    severity: medium
- id: 2.4.2
  title: Disable Internet Sharing
  scoring: scored
  profile:
  - Level 1
  description: Internet Sharing uses the open source natd process to share an internet connection with other computers and
    devices on a local network.
  rationale: Disabling Internet Sharing reduces the remote attack surface of the system.
  impact: Internet sharing allows the computer to function as a router and other computers to use it for access. This can
    expose both the computer itself and the networks it is accessing to unacceptable access from unapproved devices.
  references: []
  page_start: 33
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    sudo defaults read /Library/Preferences/SystemConfiguration/com.apple.nat | \

    grep -i Enabled

    No output should be present or file should not exist.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following commands in Terminal: ```

    sudo defaults write /Library/Preferences/SystemConfiguration/com.apple.nat \

    NAT -dict Enabled -int 0

    sudo launchctl unload -w /System/Library/LaunchDaemons/ \

    com.apple.InternetSharing.plist'
  checks:
  - type: command
    command: grep -i Enabled
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      sudo defaults read /Library/Preferences/SystemConfiguration/com.apple.nat | \

      grep -i Enabled

      No output should be present or file should not exist.'
- id: 2.4.3
  title: Disable Screen Sharing
  scoring: scored
  profile:
  - Level 1
  description: Screen sharing allows a computer to connect to another computer on a network and display the computer's screen.
    While sharing the computer's screen, the user can control what happens on that computer, such as opening documents or
    applications, opening, moving, or closing windows, and even shutting down the computer.
  rationale: Disabling screen sharing mitigates the risk of remote connections being made without the user of the console
    knowing that they are sharing the computer.
  impact: ''
  references:
  - 1. http://support.apple.com/kb/ph11151
  page_start: 34
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    sudo launchctl load

    /System/Library/LaunchDaemons/com.apple.screensharing.plist

    2. Verify the value returned is `n``othing found to load`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Sharing

    3. Uncheck Screen Sharing'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      sudo launchctl load

      /System/Library/LaunchDaemons/com.apple.screensharing.plist

      2. Verify the value returned is `n``othing found to load`'
    severity: medium
- id: 2.4.4
  title: Disable Printer Sharing
  scoring: scored
  profile:
  - Level 1
  description: By enabling Printer sharing the computer is set up as a print server to accept print jobs from other computers.
    Dedicated print servers or direct IP printing should be used instead.
  rationale: Disabling Printer Sharing mitigates the risk of attackers attempting to exploit the print server to gain access
    to the system.
  impact: ''
  references:
  - 1. http://support.apple.com/kb/PH11450
  page_start: 35
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    system_profiler SPPrintersDataType

    The output should show "Shared: No" for all printers. If no printers are

    present, the above command will yield "`Status: The printers list is empty.`"'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Sharing

    3. Uncheck Printer Sharing'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      system_profiler SPPrintersDataType

      The output should show "Shared: No" for all printers. If no printers are

      present, the above command will yield "`Status: The printers list is empty.`"'
    severity: medium
- id: 2.4.5
  title: Disable Remote Login
  scoring: scored
  profile:
  - Level 1
  description: Remote Login allows an interactive terminal connection to a computer.
  rationale: Disabling Remote Login mitigates the risk of an unauthorized person gaining access to the system via Secure Shell
    (SSH). Additionally, the scope of the benchmark is for Apple OSX clients, not servers. OS X does not have an IP based
    firewall, TCP Wrappers, Brute-Force password guessing mitigations, or frequent POSIX patching enabled by default and most
    OS X computers are mobile workstations. All of these factors can be parts of running a hardened SSH server.
  impact: 'The SSH server built-in to OS X should not be enabled on a standard user computer, particularly one that changes
    locations and IP addresses. A standard user that runs local applications including email, web browser and productivity
    tools should not use the same device as a server. There are Enterprise tool-sets that do take advantage of SSH and if
    they are in use the computer should be locked down to only respond to known trusted IP addresses and appropriate admin
    service accounts. For OS X computers that are being used for specialized functions there are several options to harden
    the SSH server to protect against unauthorized access including brute force attacks. There are some basic criteria that
    need to be considered: • Do not open an SSH server to the internet without controls in place to mitigate SSH brute force
    attacks, this is particularly important for systems bound to Directory environments. It is great to have controls in place
    to protect the system but if they trigger after the user is already locked out of their account they are not optimal.
    If authorization happens after authentication directory accounts for users that don''t even use the system can be locked
    out. • Do not use SSH key pairs when there is no insight to the security on the client system that will authenticate into
    the server with a private key. If an attacker gets access to the remote system and can find the key they may not need
    a password or a key logger to access the SSH server. • Detailed instructions on hardening an SSH server, if needed, are
    available in the CIS Linux Benchmarks but it is beyond the scope of this benchmark'
  references:
  - '1. Rule Version (STIG-ID): OSX00495 M6'
  page_start: 36
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    sudo systemsetup -getremotelogin

    2. Verify the value returned is `Remote Login: Off`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal: ```

    sudo systemsetup -setremotelogin off'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      sudo systemsetup -getremotelogin

      2. Verify the value returned is `Remote Login: Off`'
    severity: medium
