  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. For each user on the system, run the following command in Terminal: ```

    defaults read ~/Library/Preferences/com.apple.finder EmptyTrashSecurely

    2. Make sure the value returned for each user is `1.`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Select Finder

    2. Select Preferences

    3. Select Advanced

    4. Check Empty Trash Securely

    3 Logging and Auditing

    This section provide guidance on configuring the logging and auditing facilities available

    in OSX 10.8.

    3.1 Configure newsyslog.conf

    It is important to save logs long enough to meet organizational requirements. The logs

    can assist in troubleshooting problems as well as used for forensic investigations in the

    case of network attacks, malware or employee misuse. Many of the retention and

    rotation configurations are set in the /etc/newsyslog.conf file.

    This Benchmark documents how to retain roughly 60 days, 9 weeks or 2 months of logs

    through rotation and retention settings. The thought was that 30 days is insufficient in

    most use cases and organizations with other requirements may very well exceed the

    minimum requirements documented here. The following controls provide specifics on

    weekly rotations and keeping a minimum of nine instances. Logs may be rotated daily,

    weekly or monthly and retained as long as needed. More detail are in the man page for

    newsyslog.conf.

    Users of this Benchmark should be aware that OS X also uses /etc/asl.conf, there are

    details in the asl.conf man page. There are no current suggestions to modify that

    configuration of asl.conf for this (10.8) benchmark, there are configuration changes to

    asl.conf as part of the 10.9 Benchmark.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. For each user on the system, run the following command in Terminal: ```

      defaults read ~/Library/Preferences/com.apple.finder EmptyTrashSecurely

      2. Make sure the value returned for each user is `1.`'
    severity: medium
