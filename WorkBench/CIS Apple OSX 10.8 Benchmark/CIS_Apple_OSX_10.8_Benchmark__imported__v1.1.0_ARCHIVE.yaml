  description: Secure Empty Trash not only removes the file information from the file directory, it also overwrites the data
    in the file with meaningless data, thus preventing the file from being recovered.
  rationale: Configuring Secure Empty Trash mitigates the risk of an admin user on the system recovering sensitive files that
    the user has deleted. It is possible for anyone with physical access to the device to get access if FileVault is not used.
  impact: Secure Empty Trash can take a long time, with FileVault in place the protection is erasing data within an already
    encrypted volume.
  references: []
