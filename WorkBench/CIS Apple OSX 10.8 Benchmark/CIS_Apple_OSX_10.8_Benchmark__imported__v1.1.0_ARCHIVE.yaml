- id: '5.3'
  title: Automatically lock the login keychain after 15 minutes of inactivity and when sleeping
  scoring: scored
  profile:
  - Level 1
  description: The keychain is a secure database store for passwords and certificates and is created for each user account
    on Mac OS X. The system software itself uses keychains for secure storage.
  rationale: While logged in, the keychain does not prompt the user for passwords for various systems and/or programs. This
    can be exploited by unauthorized users to gain access to password protected programs and/or systems in the absence of
    the user. Timing out the keychain can reduce the exploitation window.
  impact: If the timeout is set too low on heavily used items the user will be annoyed and may use workarounds.
  references: []
  page_start: 82
  audit_raw: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal: ```

    security show-keychain-info

    2. Verify the value returned is:` Keychain "<NULL>" lock-on-sleep

    timeout=900s`'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open Utilities

    2. Select Keychain Access

    3. Select a keychain

    4. Select Edit

    5. Select Change Settings for keychain <keychain_name>

    6. Authenticate, if requested.

    7. Select Lock when sleeping setting

    8. Change the Lock after # minutes of inactivity setting for the Login Keychain to 15

    minutes or based on the access frequency of the security credentials included in

    the keychain for other keychains.'
  checks:
  - type: manual_review
    info: 'Perform the following to implement the prescribed state:

      1. Run the following command in Terminal: ```

      security show-keychain-info

      2. Verify the value returned is:` Keychain "<NULL>" lock-on-sleep

      timeout=900s`'
    severity: medium
- id: '5.4'
  title: Do not enable the "root" account
  scoring: scored
  profile:
  - Level 2
  description: The root account is a superuser account that has access privileges to perform any actions and read/write to
    any file on the computer. In the UNIX/Linux world, the system administrator commonly uses the root account to perform
    administrative functions.
  rationale: Enabling the root account puts the system at risk since any exploit would have unlimited access privileges within
    the system. Using the sudo command allows users to perform functions as a root user while limiting and password protecting
    the access privileges. By default the root account is not enabled on a Mac OS X client computer. It is enabled on Mac
    OS X Server. An administrator can escalate privileges using the sudo command (use -s or -i to get a root shell).
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    dscl . -read /Users/root AuthenticationAuthority

    2. Verify the value returned is: ```

    No such key: AuthenticationAuthority'
  remediation: 'Open System Preferences, Uses & Groups. Click the lock icon to unlock it. In the

    Network Account Server section, click Join or Edit. Click Open Directory Utility. Click the

