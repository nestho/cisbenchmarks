- id: '7.8'
  title: AirDrop
  scoring: manual
  profile:
  - Level 2
  description: Airdrop is an adhoc file transfer capability that on OS X works over wireless networks. Each user must select
    "AirDrop" in a Finder Window. After the other computer is visible a file can be drag-and-dropped from one computer to
    another. Each file must be explicitly accepted. When AirDrop is no longer selected the discoverable portion as well as
    the file transfer capabilities are off. This transfer is limited to the range of adhoc wireless networks, is not always
    available like file sharing services, and does not involve data storage on public clouds or the creation of additional
    electronic copies on infrastructure file, email, ftp servers. Compared to many of the common file transfer methods AirDrop
    is both simpler and more secure. If all other file transfer methods are heavily audited or blocked this methodology may
    circumvent audit controls. AirDrop does not respect network segmentation in the same physical space. If your organization
    has computers located in the same physical location that have logical controls to prevent any data from transferring between
    them (including the use of third party servers) you should disable Air Drop. http://siliconchaos.com/2012/07/disable-airdrop-in-mac-os-x-lion/
    http://www.macprovideo.com/hub/mac-osx/osx-airdrop-great-for-sharing-why-it-willnever-work
