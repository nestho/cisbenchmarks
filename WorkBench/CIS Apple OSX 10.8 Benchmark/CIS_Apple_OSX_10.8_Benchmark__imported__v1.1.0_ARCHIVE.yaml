- id: 2.4.8
  title: Disable File Sharing
  scoring: scored
  profile:
  - Level 1
  description: 'Apple''s File Sharing uses a combination of many technologies: FTP, SMB (Windows sharing) and AFP (Mac sharing)
    Three common ways to share files using File Sharing are: 1. Apple File Protocol (AFP) AFP under Snow Leopard automatically
    uses encrypted logins, so this method of sharing files is fairly secure. The entire hard disk is shared to administrator
    user accounts. Individual home folders are shared to their respective user accounts. Users'' "Public" folders (and the
    "Drop Box" folder inside) are shared to any user account that has sharing access to the computer (i.e. anyone in the "staff"
    group, including the guest account if it is enabled). 2. File Transfer Protocol (FTP) FTP send password via clear text
    and thus is very insecure. FTP is commonly used for anonymous upload and download of files where security is of less concern.
    FTP should not be used on a client Mac except in rare case for temporary anonymous sharing. 3. Server Message Block (SMB),
    Common Internet File System (CIFS) When Windows (or possibly Linux) computers need to access file shared on a Mac, SMB/CIFS
    file sharing is commonly used. Apple warns that SMB sharing stores passwords is a less secure fashion than AFP sharing
    and anyone with system access can gain access to the password for that account. When sharing with SMB, each user that
    will access the Mac must have SMB enabled.'
  rationale: By disabling file sharing, the remote attack surface and risk of unauthorized access to files stored on the system
    is reduced.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal: ```

    sudo launchctl list | egrep ''(ftp|nmdb|smdb|AppleFileServer)''

    2. Ensure no output is present'
  remediation: 'Perform the following to implement the prescribed state:

    • Run the following command in Terminal to turn off AFP from the command line:

    ```

    sudo launchctl unload -w \

    /System/Library/LaunchDaemons/com.apple.AppleFileServer.plist

    • Run the following command in Terminal to turn off FTP from the command line:

    ```

    sudo launchctl unload -w /System/Library/LaunchDaemons/ftp.plist

    • Run the following command in Terminal to turn off SMB sharing from the CLI: ```

    sudo defaults delete

    /Library/Preferences/SystemConfiguration/com.apple.smb.server

    EnabledServices

    sudo launchctl unload -w /System/Library/LaunchDaemons/nmbd.plist

    sudo launchctl unload -w /System/Library/LaunchDaemons/smbd.plist'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal: ```

      sudo launchctl list | egrep ''(ftp|nmdb|smdb|AppleFileServer)''

      2. Ensure no output is present'
    severity: medium
