    severity: medium
- id: 5.1.1
  title: Secure Home Folders
  scoring: scored
  profile:
  - Level 1
  description: By default OS X 10.8 is set up to allow users to see into the top level of the home folder of all other networked
    users. This allows the user to drop files into the "Drop Box" folders of other users. Users are unable to see the sub-folders
    of the other networked users; folders such as My Documents and Library.
  rationale: Allowing all users to view the top level of all networked user's home folder may not be desirable since it may
    lead to the revelation of sensitive information.
  impact: If implemented, users will not be able to use the "Public" folders in other users' home folders. "Public" folders
    with appropriate permissions would need to be set up in the /Shared folder.
  references: []
  page_start: 74
  audit_raw: "Perform the following to ensure the system is configured as prescribed:\n1. Run the following command in Terminal:\
    \ ```\nls -l /Users/\n2. Verify the value returned is either: ```\n <span>drwx------</span>\n1.\ndrwx--x--x"
  remediation: 'Perform the following to implement the prescribed state:

    1. Run one of the following commands in Terminal: ```

    sudo chmod -R og-rwx /Users/

    2. ```

    sudo chmod -R og-rw /Users/<username>

    3. Substitute user name in <username>.

    4. This command has to be run for each user account with a local home folder.'
  checks:
  - type: command
    command: ls -l /Users/
    expected: ''
    severity: medium
    info: "Perform the following to ensure the system is configured as prescribed:\n1. Run the following command in Terminal:\
