- id: '4.3'
  title: Create network specific locations
  scoring: manual
  profile:
  - Level 2
  description: The network location feature of the Mac is very powerful tool to manage network security. By creating different
    network locations, a user can easily (and without administrative privileges) change the network settings on the Mac. By
    only using the network interfaces needed at any specific time, exposure to attackers is limited. A little understanding
    of how the Network System Preferences pane works is required.
  rationale: Network locations allow the computer to have specific configurations ready for network access when required.
    Locations can be used to manage which network interfaces are available for specialized network access
  impact: Unneeded network interfaces increases the attack surface and could lead to a successful exploit.
  references: []
  page_start: 71
  audit_raw: 'Open System Preferences: Network

    Verify each network location is set up properly.'
  remediation: 'Create multiple network locations as needed.

    Delete the Automatic location for any device that does not use multiple network services

    set for DHCP or dynamic addressing. If network services like FireWire, VPN, AirPort or

    Ethernet are not used by a specific device class those services should be deleted:

    1. Select Edit Locations from the Locations popup menu.

    2. Select the Automatic location.

    3. Click the minus button for any unneeded service.'
