    4. In the Security section, ensure that Allow only SSL connections option is

    selected.

    From Google Cloud CLI

    1. Get the detailed configuration for every SQL database instance using the

    following command:

    gcloud sql instances list --format=json

    Ensure that section settings: ipConfiguration has the parameter sslMode set to

    ENCRYPTED_ONLY .'
  remediation: 'From Google Cloud Console

