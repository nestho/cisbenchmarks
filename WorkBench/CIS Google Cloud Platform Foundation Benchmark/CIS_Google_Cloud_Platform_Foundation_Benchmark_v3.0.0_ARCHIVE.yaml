      gcloud compute instances list --format=json | jq -r ''. | "vTPM:

      \(.[].shieldedInstanceConfig.enableVtpm) IntegrityMonitoring:

      \(.[].shieldedInstanceC'
    severity: medium
- id: '4.9'
  title: Ensure That Compute Instances Do Not Have Public IP Addresses
  scoring: scored
  profile:
  - Level 2
  description: Compute instances should not be configured to have external IP addresses.
  rationale: To reduce your attack surface, Compute instances should not have public IP addresses. Instead, instances should
    be configured behind load balancers, to minimize the instance's exposure to the internet.
  impact: Removing the external IP address from your Compute instance may cause some applications to stop working.
  references:
  - 1. https://cloud.google.com/load-balancing/docs/backendservice#backends_and_external_ip_addresses
  - 2. https://cloud.google.com/compute/docs/instances/connectingadvanced#sshbetweeninstances
