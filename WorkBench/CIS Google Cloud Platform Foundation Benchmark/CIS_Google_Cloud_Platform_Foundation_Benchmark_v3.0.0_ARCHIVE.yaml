- id: 6.3.6
  title: Ensure '3625 (trace flag)' database flag for all Cloud SQL Server instances is set to 'on'
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to set 3625 (trace flag) database flag for Cloud SQL SQL Server instance to on. It is recommended
    not to set contained database authentication database flag for Cloud SQL on the SQL Server instance to on.
  rationale: Microsoft SQL Trace Flags are frequently used to diagnose performance issues or to debug stored procedures or
    complex computer systems, but they may also be recommended by Microsoft Support to address behavior that is negatively
    impacting a specific workload. All documented trace flags and those recommended by Microsoft Support are fully supported
    in a production environment when used as directed. 3625(trace log) Limits the amount of information returned to users
    who are not members of the sysadmin fixed server role, by masking the parameters of some error messages using '******'.
    Setting this in a Google Cloud flag for the instance allows for security through obscurity and prevents the disclosure
    of sensitive information, hence this is recommended to set this flag globally to on to prevent the flag having been left
    off, or changed by bad actors. This recommendation is applicable to SQL Server database instances. A contained database
    includes all database settings and metadata required to define the database and has no configuration dependencies on the
    instance of the Database Engine where the database is installed. Users can connect to the database without authenticating
    a login at the Database Engine level. Isolating the database from the Database Engine makes it possible to easily move
    the database to another instance of SQL Server. Contained databases have some unique threats that should be understood
    and mitigated by SQL Server Database Engine administrators. Most of the threats are related to the USER WITH PASSWORD
    authentication process, which moves the authentication boundary from the Database Engine level to the database level,
    hence this is recommended not to enable this flag. This recommendation is applicable to SQL Server database instances.
  impact: Changing flags on a database may cause it to be restarted. The best time to do this is at a time where there is
    low usage. When contained database authentication is off (0) for the instance, contained databases cannot be created,
    or attached to the Database Engine. Turning on logging will increase the required storage over time. Mismanaged logs may
    cause your storage costs to increase. Setting custom flags via command line on certain instances will cause all omitted
    flags to be reset to defaults. This may cause you to lose custom flags and could result in unforeseen complications or
    instance restarts. Because of this, it is recommended you apply these flags changes during a period of low usage.
  references:
  - 1. https://cloud.google.com/sql/docs/sqlserver/flags
  - 2. https://docs.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcctraceon-trace-flags-transact-sql?view=sql-server-ver15#trace-flags
  - 1. https://cloud.google.com/sql/docs/sqlserver/flags
