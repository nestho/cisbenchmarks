controls:
- id: '1.1'
  title: Ensure that Corporate Login Credentials are Used
  scoring: manual
  profile:
  - Level 1
  description: Use corporate login credentials instead of consumer accounts, such as Gmail accounts.
  rationale: It is recommended fully-managed corporate Google accounts be used for increased visibility, auditing, and controlling
    access to Cloud Platform resources. Email accounts based outside of the user's organization, such as consumer accounts,
    should not be used for business purposes.
  impact: There will be increased overhead as maintaining accounts will now be required. For smaller organizations, this will
    not be an issue, but will balloon with size.
  references:
  - 1. https://support.google.com/work/android/answer/6371476
  - 2. https://cloud.google.com/sdk/gcloud/reference/projects/get-iam-policy
  page_start: 16
  audit_raw: 'For each Google Cloud Platform project, list the accounts that have been granted

    access to that project:

    From Google Cloud CLI

    gcloud projects get-iam-policy PROJECT_ID

    Also list the accounts added on each folder:

    gcloud resource-manager folders get-iam-policy FOLDER_ID

    And list your organization''s IAM policy:

    gcloud organizations get-iam-policy ORGANIZATION_ID

    No email accounts outside the organization domain should be granted permissions in

    the IAM policies. This excludes Google-owned service accounts.'
  remediation: 'Remove all consumer Google accounts from IAM policies. Follow the documentation

    and setup corporate login accounts.

    Prevention:

    To ensure that no email addresses outside the organization can be granted IAM

    permissions to its Google Cloud projects, folders or organization, turn on the

    Organization Policy for Domain Restricted Sharing. Learn more at:

    https://cloud.google.com/resource-manager/docs/organization-policy/restrictingdomains'
  checks:
  - type: manual_review
    info: 'For each Google Cloud Platform project, list the accounts that have been granted

      access to that project:

      From Google Cloud CLI

      gcloud projects get-iam-policy PROJECT_ID

      Also list the accounts added on each folder:

      gcloud resource-manager folders get-iam-policy FOLDER_ID

      And list your organization''s IAM policy:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      No email accounts outside the organization domain should be granted permissions in

      the IAM policies. This excludes Google-owned service '
    severity: medium
- id: '1.2'
  title: Ensure that Multi-Factor Authentication is 'Enabled' for All Non-Service Accounts
  scoring: manual
  profile:
  - Level 1
  description: Setup multi-factor authentication for Google Cloud Platform accounts.
  rationale: Multi-factor authentication requires more than one mechanism to authenticate a user. This secures user logins
    from attackers exploiting stolen or weak credentials.
  impact: ''
  references:
  - 1. https://cloud.google.com/solutions/securing-gcp-account-u2f
  - 2. https://support.google.com/accounts/answer/185839
  page_start: 18
  audit_raw: 'From Google Cloud Console

    For each Google Cloud Platform project, folder, or organization:

    1. Identify non-service accounts.

    2. Manually verify that multi-factor authentication for each account is set.'
  remediation: 'From Google Cloud Console

    For each Google Cloud Platform project:

    1. Identify non-service accounts.

    2. Setup multi-factor authentication for each account.'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      For each Google Cloud Platform project, folder, or organization:

      1. Identify non-service accounts.

      2. Manually verify that multi-factor authentication for each account is set.'
    severity: medium
- id: '1.3'
  title: Ensure that Security Key Enforcement is Enabled for All Admin Accounts
  scoring: manual
  profile:
  - Level 2
  description: Setup Security Key Enforcement for Google Cloud Platform admin accounts.
  rationale: 'Google Cloud Platform users with Organization Administrator roles have the highest level of privilege in the
    organization. These accounts should be protected with the strongest form of two-factor authentication: Security Key Enforcement.
    Ensure that admins use Security Keys to log in instead of weaker second factors like SMS or onetime passwords (OTP). Security
    Keys are actual physical keys used to access Google Organization Administrator Accounts. They send an encrypted signature
    rather than a code, ensuring that logins cannot be phished.'
  impact: If an organization administrator loses access to their security key, the user could lose access to their account.
    For this reason, it is important to set up backup security keys.
  references:
  - 1. https://cloud.google.com/security-key/
  - 2. https://gsuite.google.com/learnmore/key_for_working_smarter_faster_and_more_securely.html
  page_start: 20
  audit_raw: '1. Identify users with Organization Administrator privileges:

    gcloud organizations get-iam-policy ORGANIZATION_ID

    Look for members granted the role "roles/resourcemanager.organizationAdmin".

    2. Manually verify that Security Key Enforcement has been enabled for each

    account.'
  remediation: '1. Identify users with the Organization Administrator role.

    2. Setup Security Key Enforcement for each account. Learn more at:

    https://cloud.google.com/security-key/'
  checks:
  - type: manual_review
    info: '1. Identify users with Organization Administrator privileges:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      Look for members granted the role "roles/resourcemanager.organizationAdmin".

      2. Manually verify that Security Key Enforcement has been enabled for each

      account.'
    severity: medium
- id: '1.4'
  title: Ensure That There Are Only GCP-Managed Service Account Keys for Each Service Account
  scoring: scored
  profile:
  - Level 1
  description: User-managed service accounts should not have user-managed keys.
  rationale: 'Anyone who has access to the keys will be able to access resources through the service account. GCP-managed
    keys are used by Cloud Platform services such as App Engine and Compute Engine. These keys cannot be downloaded. Google
    will keep the keys and automatically rotate them on an approximately weekly basis. User-managed keys are created, downloadable,
    and managed by users. They expire 10 years from creation. For user-managed keys, the user has to take ownership of key
    management activities which include: • Key storage • Key distribution • Key revocation • Key rotation • Protecting the
    keys from unauthorized users • Key recovery Even with key owner precautions, keys can be easily leaked by common development
    malpractices like checking keys into the source code or leaving them in the Downloads directory, or accidentally leaving
    them on support blogs/channels. It is recommended to prevent user-managed service account keys.'
  impact: Deleting user-managed service account keys may break communication with the applications using the corresponding
    keys.
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  - 2. https://cloud.google.com/resource-manager/docs/organization-policy/restrictingservice-accounts
  page_start: 22
  audit_raw: 'From Google Cloud Console

    1. Go to the IAM page in the GCP Console using

    https://console.cloud.google.com/iam-admin/iam

    2. In the left navigation pane, click Service accounts. All service accounts and their

    corresponding keys are listed.

    3. Click the service accounts and check if keys exist.

    From Google Cloud CLI

    List All the service accounts:

    gcloud iam service-accounts list

    Identify user-managed service accounts which have an account EMAIL ending with

    iam.gserviceaccount.com

    For each user-managed service account, list the keys managed by the user:

    gcloud iam service-accounts keys list --iam-account=<Service Account> --

    managed-by=user

    No keys should be listed.'
  remediation: 'From Google Cloud Console

    1. Go to the IAM page in the GCP Console using

    https://console.cloud.google.com/iam-admin/iam

    2. In the left navigation pane, click Service accounts. All service accounts and their

    corresponding keys are listed.

    3. Click the service account.

    4. Click the edit and delete the keys.

    From Google Cloud CLI

    To delete a user managed Service Account Key,

    gcloud iam service-accounts keys delete --iam-account=<user-managed-serviceaccount-EMAIL> <KEY-ID>

    Prevention:

    You can disable service account key creation through the Disable service account

    key creation Organization policy by visiting https://console.cloud.google.com/iamadmin/orgpolicies/iam-disableServiceAccountKeyCreation.
    Learn more at:

    https://cloud.google.com/resource-manager/docs/organization-policy/restricting-serviceaccounts

    In addition, if you do not need to have service accounts in your project, you can also

    prevent the creation of service accounts through the Disable service account

    creation Organization policy: https://console.cloud.google.com/iamadmin/orgpolicies/iam-disableServiceAccountCreation.'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Go to the IAM page in the GCP Console using

      https://console.cloud.google.com/iam-admin/iam

      2. In the left navigation pane, click Service accounts. All service accounts and their

      corresponding keys are listed.

      3. Click the service accounts and check if keys exist.

      From Google Cloud CLI

      List All the service accounts:

      gcloud iam service-accounts list

      Identify user-managed service accounts which have an account EMAIL ending with

      iam.gserviceaccount.com

      For each user-mana'
    severity: medium
- id: '1.5'
  title: Ensure That Service Account Has No Admin Privileges
  scoring: scored
  profile:
  - Level 1
  description: A service account is a special Google account that belongs to an application or a VM, instead of to an individual
    end-user. The application uses the service account to call the service's Google API so that users aren't directly involved.
    It's recommended not to use admin access for ServiceAccount. It is recommended to assign the Service Account User (iam.serviceAccountUser)
    and Service Account Token Creator (iam.serviceAccountTokenCreator) roles to a user for a specific service account rather
    than assigning the role to a user at project level.
  rationale: Service accounts represent service-level security of the Resources (application or a VM) which can be determined
    by the roles assigned to it. Enrolling ServiceAccount with Admin rights gives full access to an assigned application or
    a VM. A ServiceAccount Access holder can perform critical actions like delete, update change settings, etc. without user
    intervention. For this reason, it's recommended that service accounts not have Admin rights. A service account is a special
    Google account that belongs to an application or a virtual machine (VM), instead of to an individual end-user. Application/VM-Instance
    uses the service account to call the service's Google API so that users aren't directly involved. In addition to being
    an identity, a service account is a resource that has IAM policies attached to it. These policies determine who can use
    the service account. Users with IAM roles to update the App Engine and Compute Engine instances (such as App Engine Deployer
    or Compute Instance Admin) can effectively run code as the service accounts used to run these instances, and indirectly
    gain access to all the resources for which the service accounts have access. Similarly, SSH access to a Compute Engine
    instance may also provide the ability to execute code as that instance/Service account. Based on business needs, there
    could be multiple user-managed service accounts configured for a project. Granting the iam.serviceAccountUser or iam.serviceAccountTokenCreator
    roles to a user for a project gives the user access to all service accounts in the project, including service accounts
    that may be created in the future. This can result in elevation of privileges by using service accounts and corresponding
    Compute Engine instances. In order to implement least privileges best practices, IAM users should not be assigned the
    Service Account User or Service Account Token Creator roles at the project level. Instead, these roles should be assigned
    to a user for a specific service account, giving that user access to the service account. The Service Account User allows
    a user to bind a service account to a long-running job service, whereas the Service Account Token Creator role allows
    a user to directly impersonate (or assert) the identity of a service account.
  impact: Removing *Admin or *admin or Editor or Owner role assignments from service accounts may break functionality that
    uses impacted service accounts. Required role(s) should be assigned to impacted service accounts in order to restore broken
    functionalities. After revoking Service Account User or Service Account Token Creator roles at the project level from
    all impacted user account(s), these roles should be assigned to a user(s) for specific service account(s) according to
    business needs.
  references:
  - 1. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  - 1. https://cloud.google.com/iam/docs/service-accounts
  - 2. https://cloud.google.com/iam/docs/granting-roles-to-service-accounts
  page_start: 25
  audit_raw: "From Google Cloud Console\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iamadmin/iam\n2.\
    \ Under the IAM Tab look for VIEW BY PRINCIPALS\n3. Filter PRINCIPALS using type : Service account\n4. Look for the Service\
    \ Account with the nomenclature:\nSERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com\n5. Ensure that there are no\
    \ such Service Accounts with roles containing *Admin or\n*admin or role matching Editor or role matching Owner under Role\
    \ column.\nFrom Google Cloud CLI\n1. Get the policy that you want to modify, and write it to a JSON file:\ngcloud projects\
    \ get-iam-policy PROJECT_ID --format json > iam.json\n2. The contents of the JSON file will look similar to the following.\
    \ Note that role of\nmembers group associated with each serviceaccount does not contain *Admin or\n*admin or does not\
    \ match roles/editor or does not match roles/owner.\nThis recommendation is only applicable to User-Managed user-created\
    \ service\naccounts. These accounts have the nomenclature:\nSERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com. Note\
    \ that some Googlemanaged, Google-created service accounts have the same naming format, and should\nbe excluded (e.g.,\
    \ appsdev-apps-dev-script-auth@system.gserviceaccount.com which\nneeds the Owner role).\nSample Json output:\n{\n\"bindings\"\
    : [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n ],\n \"role\": \"roles/appengine.appAdmin\"\
    \n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\": \"roles/owner\"\n},\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\n ],\n \"role\": \"roles/editor\"\n}\n],\n\"\
    etag\": \"BwUjMhCsNvY=\",\n\"version\": 1\n}\nFrom Google Cloud Console\n1. Go to the IAM page in the GCP Console by visiting\n\
    https://console.cloud.google.com/iam-admin/iam\n2. Click on the filter table text bar, Type Role: Service Account User.\n\
    3. Ensure no user is listed as a result of the filter.\n4. Click on the filter table text bar, Type Role: Service Account\
    \ Token Creator.\n5. Ensure no user is listed as a result of the filter.\nFrom Google Cloud CLI\nTo ensure IAM users are\
    \ not assigned Service Account User role at the project level:\ngcloud projects get-iam-policy PROJECT_ID --format json\
    \ | jq\n'.bindings[].role' | grep \"roles/iam.serviceAccountUser\"\ngcloud projects get-iam-policy PROJECT_ID --format\
    \ json | jq\n'.bindings[].role' | grep \"roles/iam.serviceAccountTokenCreator\"\nThese commands should not return any\
    \ output."
  remediation: "From Google Cloud Console\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iamadmin/iam\n\
    2. Under the IAM Tab look for VIEW BY PRINCIPALS\n3. Filter PRINCIPALS using type : Service account\n4. Look for the Service\
    \ Account with the Principal nomenclature:\nSERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com\n5. Identify User-Managed\
    \ user created service account with roles containing *Admin\nor *admin or role matching Editor or role matching Owner\
    \ under Role Column.\n6. Click on Edit (Pencil Icon) for the Service Account, it will open all the roles\nwhich are assigned\
    \ to the Service Account.\n7. Click the Delete bin icon to remove the role from the Principal (service account\nin this\
    \ case)\nFrom Google Cloud CLI\ngcloud projects get-iam-policy PROJECT_ID --format json > iam.json\n1. Using a text editor,\
    \ Remove Role which contains roles/*Admin or roles/*admin\nor matched roles/editor or matches 'roles/owner`. Add a role\
    \ to the bindings\narray that defines the group members and the role for those members.\nFor example, to grant the role\
    \ roles/appengine.appViewer to the ServiceAccount which\nis roles/editor, you would change the example shown below as\
    \ follows:\n{\n\"bindings\": [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n\
    \ ],\n \"role\": \"roles/appengine.appViewer\"\n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\": \"\
    roles/owner\"\n },\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\
    \n ],\n \"role\": \"roles/editor\"\n}\n],\n\"etag\": \"BwUjMhCsNvY=\"\n}\n2. Update the project's IAM policy:\ngcloud\
    \ projects set-iam-policy PROJECT_ID iam.json\nFrom Google Cloud Console\n1. Go to the IAM page in the GCP Console by\
    \ visiting:\nhttps://console.cloud.google.com/iam-admin/iam.\n2. Click on the filter table text bar. Type Role: Service\
    \ Account User\n3. Click the Delete Bin icon in front of the role Service Account User for every user\nlisted as a result\
    \ of a filter.\n4. Click on the filter table text bar. Type Role: Service Account Token Creator\n5. Click the Delete Bin\
    \ icon in front of the role Service Account Token Creator for\nevery user listed as a result of a filter.\nFrom Google\
    \ Cloud CLI\n1. Using a text editor, remove the bindings with the roles/iam.serviceAccountUser\nor roles/iam.serviceAccountTokenCreator.\n\
    For example, you can use the iam.json file shown below as follows:\n{\n\"bindings\": [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n ],\n \"role\": \"roles/appengine.appViewer\"\n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\":\
    \ \"roles/owner\"\n },\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\
    \n ],\n \"role\": \"roles/editor\"\n}\n],\n\"etag\": \"BwUjMhCsNvY=\"\n }\n2. Update the project's IAM policy:\ngcloud\
    \ projects set-iam-policy PROJECT_ID iam.json"
  checks:
  - type: command
    command: '''.bindings[].role'' | grep "roles/iam.serviceAccountUser" && ''.bindings[].role'' | grep "roles/iam.serviceAccountTokenCreator"'
    expected: ''
    severity: medium
    info: 'From Google Cloud Console

      1. Go to IAM & admin/IAM using https://console.cloud.google.com/iamadmin/iam

      2. Under the IAM Tab look for VIEW BY PRINCIPALS

      3. Filter PRINCIPALS using type : Service account

      4. Look for the Service Account with the nomenclature:

      SERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com

      5. Ensure that there are no such Service Accounts with roles containing *Admin or

      *admi'
- id: '1.7'
  title: Ensure User-Managed/External Keys for Service Accounts Are Rotated Every 90 Days or Fewer
  scoring: scored
  profile:
  - Level 1
  description: Service Account keys consist of a key ID (Private_key_Id) and Private key, which are used to sign programmatic
    requests users make to Google cloud services accessible to that particular service account. It is recommended that all
    Service Account keys are regularly rotated.
  rationale: Rotating Service Account keys will reduce the window of opportunity for an access key that is associated with
    a compromised or terminated account to be used. Service Account keys should be rotated to ensure that data cannot be accessed
    with an old key that might have been lost, cracked, or stolen. Each service account is associated with a key pair managed
    by Google Cloud Platform (GCP). It is used for service-to-service authentication within GCP. Google rotates the keys daily.
    GCP provides the option to create one or more user-managed (also called external key pairs) key pairs for use from outside
    GCP (for example, for use with Application Default Credentials). When a new key pair is created, the user is required
    to download the private key (which is not retained by Google). With external keys, users are responsible for keeping the
    private key secure and other management operations such as key rotation. External keys can be managed by the IAM API,
    gcloud command-line tool, or the Service Accounts page in the Google Cloud Platform Console. GCP facilitates up to 10
    external service account keys per service account to facilitate key rotation.
  impact: Rotating service account keys will break communication for dependent applications. Dependent applications need to
    be configured manually with the new key ID displayed in the Service account keys section and the private key downloaded
    by the user.
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  - 2. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/keys/list
  page_start: 33
  audit_raw: 'From Google Cloud Console

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In the section Service Account Keys, for every External (user-managed) service

    account key listed ensure the creation date is within the past 90 days.

    From Google Cloud CLI

    1. List all Service accounts from a project.

    gcloud iam service-accounts list

    2. For every service account list service account keys.

    gcloud iam service-accounts keys list --iam-account

    [Service_Account_Email_Id] --format=json

    3. Ensure every service account key for a service account has a "validAfterTime"

    value within the past 90 days.'
  remediation: 'From Google Cloud Console

    Delete any external (user-managed) Service Account Key older than 90 days:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In the Section Service Account Keys, for every external (user-managed) service

    account key where creation date is greater than or equal to the past 90 days,

    click Delete Bin Icon to Delete Service Account key

    Create a new external (user-managed) Service Account Key for a Service

    Account:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. Click Create Credentials and Select Service Account Key.

    3. Choose the service account in the drop-down list for which an External (usermanaged) Service Account key needs to be
    created.

    4. Select the desired key type format among JSON or P12.

    5. Click Create. It will download the private key. Keep it safe.

    6. Click Close if prompted.

    7. The site will redirect to the APIs & Services\Credentials page. Make a note of

    the new ID displayed in the Service account keys section.'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Go to APIs & Services\Credentials using

      https://console.cloud.google.com/apis/credentials

      2. In the section Service Account Keys, for every External (user-managed) service

      account key listed ensure the creation date is within the past 90 days.

      From Google Cloud CLI

      1. List all Service accounts from a project.

      gcloud iam service-accounts list

      2. For every service account list service account keys.

      gcloud iam service-accounts keys list --iam-account

      [Service_Account_Em'
    severity: medium
- id: '1.8'
  title: Ensure That Separation of Duties Is Enforced While Assigning Service Account Related Roles to Users
  scoring: scored
  profile:
  - Level 2
  description: It is recommended that the principle of 'Separation of Duties' is enforced while assigning service-account
    related roles to users.
  rationale: The built-in/predefined IAM role Service Account admin allows the user/identity to create, delete, and manage
    service account(s). The built-in/predefined IAM role Service Account User allows the user/identity (with adequate privileges
    on Compute and App Engine) to assign service account(s) to Apps/Compute Instances. Separation of duties is the concept
    of ensuring that one individual does not have all necessary permissions to be able to complete a malicious action. In
    Cloud IAM - service accounts, this could be an action such as using a service account to access resources that user should
    not normally have access to. Separation of duties is a business control typically used in larger organizations, meant
    to help avoid security or privacy incidents and errors. It is considered best practice. No user should have Service Account
    Admin and Service Account User roles assigned at the same time.
  impact: The removed role should be assigned to a different user based on business needs.
  references:
  - 1. https://cloud.google.com/iam/docs/service-accounts
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  page_start: 36
  audit_raw: "From Google Cloud Console\n1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iamadmin/iam.\n2.\
    \ Ensure no member has the roles Service Account Admin and Service account\nUser assigned together.\nFrom Google Cloud\
    \ CLI\n1. List all users and role assignments:\ngcloud projects get-iam-policy [Project_ID] --format json | \\\n jq -r\
    \ '[\n ([\"Service_Account_Admin_and_User\"] | (., map(length*\"-\"))),\n (\n [\n .bindings[] |\n select(.role == \"roles/iam.serviceAccountAdmin\"\
    \ or .role ==\n\"roles/iam.serviceAccountUser\").members[]\n ] |\n group_by(.) |\n map({User: ., Count: length}) |\n .[]\
    \ |\n select(.Count == 2).User |\n unique\n )\n ] |\n .[] |\n @tsv'\n2. All common users listed under Service_Account_Admin_and_User\
    \ are assigned\nboth the roles/iam.serviceAccountAdmin and roles/iam.serviceAccountUser\nroles."
  remediation: 'From Google Cloud Console

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iamadmin/iam.

    2. For any member having both Service Account Admin and Service account User

    roles granted/assigned, click the Delete Bin icon to remove either role from the

    member.

    Removal of a role should be done based on the business requirements.'
  checks:
  - type: manual_review
    info: "From Google Cloud Console\n1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iamadmin/iam.\n2. Ensure\
      \ no member has the roles Service Account Admin and Service account\nUser assigned together.\nFrom Google Cloud CLI\n\
      1. List all users and role assignments:\ngcloud projects get-iam-policy [Project_ID] --format json | \\\n jq -r '[\n\
      \ ([\"Service_Account_Admin_and_User\"] | (., map(length*\"-\"))),\n (\n [\n .bindings[] |\n select(.role == \"roles/iam.serviceAccountAdmin\"\
      \ or .role ==\n\"roles/iam.service"
    severity: medium
- id: '1.9'
  title: Ensure That Cloud KMS Cryptokeys Are Not Anonymously or Publicly Accessible
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that the IAM policy on Cloud KMS cryptokeys should restrict anonymous and/or public access.
  rationale: Granting permissions to allUsers or allAuthenticatedUsers allows anyone to access the dataset. Such access might
    not be desirable if sensitive data is stored at the location. In this case, ensure that anonymous and/or public access
    to a Cloud KMS cryptokey is not allowed.
  impact: Removing the binding for allUsers and allAuthenticatedUsers members denies accessing cryptokeys to anonymous or
    public users.
  references:
  - 1. https://cloud.google.com/sdk/gcloud/reference/kms/keys/remove-iam-policybinding
  - 2. https://cloud.google.com/sdk/gcloud/reference/kms/keys/set-iam-policy
  page_start: 39
  audit_raw: 'From Google Cloud CLI

    1. List all Cloud KMS Cryptokeys.

