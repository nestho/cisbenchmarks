  rationale: SQL database connections if successfully trapped (MITM); can reveal sensitive data like credentials, database
    queries, query outputs etc. For security, it is recommended to always use SSL encryption when connecting to your instance.
    This recommendation is applicable for Postgresql, MySql generation 1, MySql generation 2 and SQL Server 2017 instances.
  impact: After enforcing SSL requirement for connections, existing client will not be able to communicate with Cloud SQL
    database instance unless they use SSL encrypted connections to communicate to Cloud SQL database instance.
