- id: '5.2'
  title: Ensure That Cloud Storage Buckets Have Uniform BucketLevel Access Enabled
  scoring: scored
  profile:
  - Level 2
  description: It is recommended that uniform bucket-level access is enabled on Cloud Storage buckets.
  rationale: 'It is recommended to use uniform bucket-level access to unify and simplify how you grant access to your Cloud
    Storage resources. Cloud Storage offers two systems for granting users permission to access your buckets and objects:
    Cloud Identity and Access Management (Cloud IAM) and Access Control Lists (ACLs). These systems act in parallel - in order
    for a user to access a Cloud Storage resource, only one of the systems needs to grant the user permission. Cloud IAM is
    used throughout Google Cloud and allows you to grant a variety of permissions at the bucket and project levels. ACLs are
    used only by Cloud Storage and have limited permission options, but they allow you to grant permissions on a per-object
    basis. In order to support a uniform permissioning system, Cloud Storage has uniform bucketlevel access. Using this feature
    disables ACLs for all Cloud Storage resources: access to Cloud Storage resources then is granted exclusively through Cloud
    IAM. Enabling uniform bucket-level access guarantees that if a Storage bucket is not publicly accessible, no object in
    the bucket is publicly accessible either.'
  impact: If you enable uniform bucket-level access, you revoke access from users who gain their access solely through object
    ACLs. Certain Google Cloud services, such as Stackdriver, Cloud Audit Logs, and Datastore, cannot export to Cloud Storage
    buckets that have uniform bucket-level access enabled.
  references:
  - 1. https://cloud.google.com/storage/docs/uniform-bucket-level-access
  - 2. https://cloud.google.com/storage/docs/using-uniform-bucket-level-access
  page_start: 200
  audit_raw: "From Google Cloud Console\n1. Open the Cloud Storage browser in the Google Cloud Console by visiting:\nhttps://console.cloud.google.com/storage/browser\n\
    2. For each bucket, make sure that Access control column has the value Uniform.\nFrom Google Cloud CLI\n1. List all buckets\
    \ in a project\ngsutil ls\n2. For each bucket, verify that uniform bucket-level access is enabled.\ngsutil uniformbucketlevelaccess\
    \ get gs://BUCKET_NAME/\nIf uniform bucket-level access is enabled, the response looks like:\nUniform bucket-level access\
    \ setting for gs://BUCKET_NAME/:\n Enabled: True\n LockedTime: LOCK_DATE"
  remediation: 'From Google Cloud Console

    1. Open the Cloud Storage browser in the Google Cloud Console by visiting:

    https://console.cloud.google.com/storage/browser

    2. In the list of buckets, click on the name of the desired bucket.

    3. Select the Permissions tab near the top of the page.

    4. In the text box that starts with This bucket uses fine-grained access

    control..., click Edit.

    5. In the pop-up menu that appears, select Uniform.

    6. Click Save.

    From Google Cloud CLI

    Use the on option in a uniformbucketlevelaccess set command:

    gsutil uniformbucketlevelaccess set on gs://BUCKET_NAME/

    Prevention

    You can set up an Organization Policy to enforce that any new bucket has uniform

    bucket level access enabled. Learn more at:

    https://cloud.google.com/storage/docs/setting-org-policies#uniform-bucket'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Open the Cloud Storage browser in the Google Cloud Console by visiting:

      https://console.cloud.google.com/storage/browser

      2. For each bucket, make sure that Access control column has the value Uniform.

      From Google Cloud CLI

      1. List all buckets in a project

      gsutil ls

      2. For each bucket, verify that uniform bucket-level access is enabled.

      gsutil uniformbucketlevelaccess get gs://BUCKET_NAME/

      If uniform bucket-level access is enabled, the response looks like:

      Uniform buc'
    severity: medium
- id: 6.1.1
  title: Ensure That a MySQL Database Instance Does Not Allow Anyone To Connect With Administrative Privileges
  scoring: manual
  profile:
  - Level 1
  description: It is recommended to set a password for the administrative user (root by default) to prevent unauthorized access
    to the SQL database instances. This recommendation is applicable only for MySQL Instances. PostgreSQL does not offer any
    setting for No Password from the cloud console.
  rationale: At the time of MySQL Instance creation, not providing an administrative password allows anyone to connect to
    the SQL database instance with administrative privileges. The root password should be set to ensure only authorized users
    have these privileges.
  impact: Connection strings for administrative clients need to be reconfigured to use a password.
  references:
  - 1. https://cloud.google.com/sql/docs/mysql/create-manage-users
  - 2. https://cloud.google.com/sql/docs/mysql/create-instance
  page_start: 205
  audit_raw: 'From Google Cloud CLI

    1. List All SQL database instances of type MySQL:

    gcloud sql instances list --filter=''DATABASE_VERSION:MYSQL* --project

    <project_id> --format="(NAME,PRIMARY_ADDRESS)"''

    2. For every MySQL instance try to connect using the PRIMARY_ADDRESS, if available:

    mysql -u root -h <mysql_instance_ip_address>

    The command should return either an error message or a password prompt.

    Sample Error message:

    ERROR 1045 (28000): Access denied for user ''root''@''<Instance_IP>'' (using

    password: NO)

    If a command produces the mysql> prompt, the MySQL instance allows anyone to

    connect with administrative privileges without needing a password.

    Note: The No Password setting is exposed only at the time of MySQL instance creation.

    Once the instance is created, the Google Cloud Platform Console does not expose the

    set to confirm whether a password for an administrative user is set to a MySQL

    instance.'
  remediation: 'From Google Cloud Console

    1. Go to the Cloud SQL Instances page in the Google Cloud Platform Console

    using https://console.cloud.google.com/sql/

    2. Select the instance to open its Overview page.

    3. Select Access Control > Users.

    4. Click the More actions icon for the user to be updated.

    5. Select Change password, specify a New password, and click OK.

    From Google Cloud CLI

    1. Set a password to a MySql instance:

    gcloud sql users set-password root --host=<host> --instance=<instance_name> -

    -prompt-for-password

    2. A prompt will appear, requiring the user to enter a password:

    Instance Password:

    3. With a successful password configured, the following message should be seen:

    Updating Cloud SQL user...done.'
  checks:
  - type: manual_review
    info: 'From Google Cloud CLI

      1. List All SQL database instances of type MySQL:

      gcloud sql instances list --filter=''DATABASE_VERSION:MYSQL* --project

      <project_id> --format="(NAME,PRIMARY_ADDRESS)"''

      2. For every MySQL instance try to connect using the PRIMARY_ADDRESS, if available:

      mysql -u root -h <mysql_instance_ip_address>

      The command should return either an error message or a password prompt.

      Sample Error message:

      ERROR 1045 (28000): Access denied for user ''root''@''<Instance_IP>'' (using

      password: NO)

      '
    severity: medium
- id: 6.1.2
  title: Ensure ‘Skip_show_database’ Database Flag for Cloud SQL MySQL Instance Is Set to ‘On’
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to set skip_show_database database flag for Cloud SQL Mysql instance to on
  rationale: 'skip_show_database database flag prevents people from using the SHOW DATABASES statement if they do not have
    the SHOW DATABASES privilege. This can improve security if you have concerns about users being able to see databases belonging
    to other users. Its effect depends on the SHOW DATABASES privilege: If the variable value is ON, the SHOW DATABASES statement
    is permitted only to users who have the SHOW DATABASES privilege, and the statement displays all database names. If the
    value is OFF, SHOW DATABASES is permitted to all users, but displays the names of only those databases for which the user
    has the SHOW DATABASES or other privilege. This recommendation is applicable to Mysql database instances.'
  impact: ''
  references:
  - 1. https://cloud.google.com/sql/docs/mysql/flags
  - 2. https://dev.mysql.com/doc/refman/5.7/en/server-systemvariables.html#sysvar_skip_show_database
  page_start: 208
  audit_raw: 'From Google Cloud Console

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Select the instance to open its Instance Overview page

    3. Ensure the database flag skip_show_database that has been set is listed under

    the Database flags section.

    From Google Cloud CLI

    1. List all Cloud SQL database Instances

    gcloud sql instances list

    2. Ensure the below command returns on for every Cloud SQL Mysql database

    instance

    gcloud sql instances describe <INSTANCE_NAME> --format=json | jq

    ''.settings.databaseFlags[] | select(.name=="skip_show_database")|.value'''
  remediation: 'From Google Cloud Console

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Select the Mysql instance for which you want to enable to database flag.

    3. Click Edit.

    4. Scroll down to the Flags section.

    5. To set a flag that has not been set on the instance before, click Add a Database

    Flag, choose the flag skip_show_database from the drop-down menu, and set its

    value to on.

    6. Click Save to save your changes.

    7. Confirm your changes under Flags on the Overview page.

    From Google Cloud CLI

    1. List all Cloud SQL database Instances

    gcloud sql instances list

    2. Configure the skip_show_database database flag for every Cloud SQL Mysql

    database instance using the below command.

    gcloud sql instances patch <INSTANCE_NAME> --database-flags

    skip_show_database=on

    Note:

    This command will overwrite all database flags previously set. To keep those and add

    new ones, include the values for all flags you want set on the instance; any flag not

    specifically included is set to its default value. For flags that do not take a value, specify

    the flag name followed by an equals sign ("=").'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

