    report OS inventory data. A patch compliance API periodically reads this data, and cross references metadata to determine
    if the latest updates are installed. This is not the only Patch Management solution available to your organization and
    you should weigh your needs before committing to using this method.
  rationale: Keeping virtual machine operating systems up to date is a security best practice. Using this service will simplify
    this process.
  impact: Most Operating Systems require a restart or changing critical resources to apply the updates. Using the Google Cloud
    VM manager for its OS Patch management will incur additional costs for each VM managed by it. Please view the VM manager
    pricing reference for further information.
