    artificially limiting connections.
  rationale: The user connections option specifies the maximum number of simultaneous user connections that are allowed on
    an instance of SQL Server. The actual number of user connections allowed also depends on the version of SQL Server that
    you are using, and also the limits of your application or applications and hardware. SQL Server allows a maximum of 32,767
    user connections. Because user connections is by default a selfconfiguring value, with SQL Server adjusting the maximum
    number of user connections automatically as needed, up to the maximum value allowable. For example, if only 10 users are
    logged in, 10 user connection objects are allocated. In most cases, you do not have to change the value for this option.
    The default is 0, which means that the maximum (32,767) user connections are allowed. However if there is a number defined
    here that limits connections, SQL Server will not allow anymore above this limit. If the connections are at the limit,
    any new requests will be dropped, potentially causing lost data or outages for those using the database.
  impact: Setting custom flags via command line on certain instances will cause all omitted flags to be reset to defaults.
    This may cause you to lose custom flags and could result in unforeseen complications or instance restarts. Because of
    this, it is recommended you apply these flags changes during a period of low usage.
  references:
  - 1. https://cloud.google.com/sql/docs/sqlserver/flags
