- id: '2.5'
  title: Ensure That the Log Metric Filter and Alerts Exist for Audit Configuration Changes
  scoring: scored
  profile:
  - Level 1
  description: Google Cloud Platform (GCP) services write audit log entries to the Admin Activity and Data Access logs to
    help answer the questions of, "who did what, where, and when?" within GCP projects. Cloud audit logging records information
    includes the identity of the API caller, the time of the API call, the source IP address of the API caller, the request
    parameters, and the response elements returned by GCP services. Cloud audit logging provides a history of GCP API calls
    for an account, including API calls made via the console, SDKs, command-line tools, and other GCP services.
  rationale: Admin activity and data access logs produced by cloud audit logging enable security analysis, resource change
    tracking, and compliance auditing. Configuring the metric filter and alerts for audit configuration changes ensures the
    recommended state of audit configuration is maintained so that all activities in the project are audit-able at any point
    in time.
  impact: Enabling of logging may result in your project being charged for the additional logs usage.
  references:
  - 1. https://cloud.google.com/logging/docs/logs-based-metrics/
  - 2. https://cloud.google.com/monitoring/custom-metrics/
  page_start: 83
  audit_raw: 'From Google Cloud Console

    Ensure the prescribed log metric is present:

    1. Go to Logging/Logs-based Metrics by visiting

    https://console.cloud.google.com/logs/metrics.

    2. In the User-defined Metrics section, ensure that at least one metric

    <Log_Metric_Name> is present with the filter text:

    protoPayload.methodName="SetIamPolicy" AND

    protoPayload.serviceData.policyDelta.auditConfigDeltas:*

    Ensure that the prescribed alerting policy is present:

    3. Go to Alerting by visiting https://console.cloud.google.com/monitoring/alerting.

    4. Under the Policies section, ensure that at least one alert policy exists for the log

    metric above. Clicking on the policy should show that it is configured with a

    condition. For example, Violates when: Any

    logging.googleapis.com/user/<Log Metric Name> stream is above a

    threshold of 0 for greater than zero(0) seconds, means that the alert will

    trigger for any new owner change. Verify that the chosen alerting thresholds

    make sense for the user''s organization.

