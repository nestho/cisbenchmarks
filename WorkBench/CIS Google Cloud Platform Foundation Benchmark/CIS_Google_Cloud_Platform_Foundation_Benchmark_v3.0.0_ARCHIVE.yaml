    is OFF by default. When Advanced Analytics Services is installed, setup can optionally set this property to true. As the
    External Scripts Enabled feature allows scripts external to SQL such as files located in an R library to be executed,
    which could adversely affect the security of the system, hence this should be disabled. This recommendation is applicable
    to SQL Server database instances.
