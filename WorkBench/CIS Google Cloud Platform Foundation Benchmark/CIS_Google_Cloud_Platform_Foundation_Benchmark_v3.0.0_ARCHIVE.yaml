  title: Ensure That Instances Are Not Configured To Use the Default Service Account
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to configure your instance to not use the default Compute Engine service account because
    it has the Editor role on the project.
  rationale: When a default Compute Engine service account is created, it is automatically granted the Editor role (roles/editor)
    on your project which allows read and write access to most Google Cloud Services. This role includes a very large number
    of permissions. To defend against privilege escalations if your VM is compromised and prevent an attacker from gaining
    access to all of your project, you should either revoke the Editor role from the default Compute Engine service account
    or create a new service account and assign only the permissions needed by your instance. To mitigate this at scale, we
    strongly recommend that you disable the automatic role grant by adding a constraint to your organization policy. The default
    Compute Engine service account is named [PROJECT_NUMBER]- compute@developer.gserviceaccount.com.
