  description: 'The log_error_verbosity flag controls the verbosity/details of messages logged. Valid values are: • TERSE
    • DEFAULT • VERBOSE TERSE excludes the logging of DETAIL, HINT, QUERY, and CONTEXT error information. VERBOSE output includes
    the SQLSTATE error code, source code file name, function name, and line number that generated the error. Ensure an appropriate
    value is set to ''DEFAULT'' or stricter.'
  rationale: Auditing helps in troubleshooting operational problems and also permits forensic analysis. If log_error_verbosity
    is not set to the correct value, too many details or too few details may be logged. This flag should be configured with
    a value of 'DEFAULT' or stricter. This recommendation is applicable to PostgreSQL database instances.
  impact: Turning on logging will increase the required storage over time. Mismanaged logs may cause your storage costs to
    increase. Setting custom flags via command line on certain instances will cause all omitted flags to be reset to defaults.
    This may cause you to lose custom flags and could result in unforeseen complications or instance restarts. Because of
    this, it is recommended you apply these flags changes during a period of low usage.
