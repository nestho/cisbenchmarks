- id: 6.2.4
  title: Ensure ‘Log_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set Appropriately
  scoring: scored
  profile:
  - Level 2
  description: 'The value of log_statement flag determined the SQL statements that are logged. Valid values are: • none •
    ddl • mod • all The value ddl logs all data definition statements. The value mod logs all ddl statements, plus data-modifying
    statements. The statements are logged after a basic parsing is done and statement type is determined, thus this does not
    logs statements with errors. When using extended query protocol, logging occurs after an Execute message is received and
    values of the Bind parameters are included. A value of ''ddl'' is recommended unless otherwise directed by your organization''s
    logging policy.'
  rationale: Auditing helps in forensic analysis. If log_statement is not set to the correct value, too many statements may
    be logged leading to issues in finding the relevant information from the logs, or too few statements may be logged with
    relevant information missing from the logs. Setting log_statement to align with your organization's security and logging
    policies facilitates later auditing and review of database activities. This recommendation is applicable to PostgreSQL
    database instances.
