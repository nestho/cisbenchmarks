- id: '5.1'
  title: Ensure That Cloud Storage Bucket Is Not Anonymously or Publicly Accessible
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that IAM policy on Cloud Storage bucket does not allows anonymous or public access.
  rationale: Allowing anonymous or public access grants permissions to anyone to access bucket content. Such access might
    not be desired if you are storing any sensitive data. Hence, ensure that anonymous or public access to a bucket is not
    allowed.
  impact: No storage buckets would be publicly accessible. You would have to explicitly administer bucket access.
  references:
  - 1. https://cloud.google.com/storage/docs/access-control/iam-reference
  - 2. https://cloud.google.com/storage/docs/access-control/making-data-public
  page_start: 197
  audit_raw: 'From Google Cloud Console

    1. Go to Storage browser by visiting

    https://console.cloud.google.com/storage/browser.

    2. Click on each bucket name to go to its Bucket details page.

    3. Click on the Permissions tab.

    4. Ensure that allUsers and allAuthenticatedUsers are not in the Members list.

    From Google Cloud CLI

    1. List all buckets in a project

    gsutil ls

