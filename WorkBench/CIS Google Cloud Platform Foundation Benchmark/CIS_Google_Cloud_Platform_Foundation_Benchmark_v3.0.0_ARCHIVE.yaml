- id: '3.1'
  title: Ensure That the Default Network Does Not Exist in a Project
  scoring: scored
  profile:
  - Level 2
  description: To prevent use of default network, a project should not have a default network.
  rationale: 'The default network has a preconfigured network configuration and automatically generates the following insecure
    firewall rules: • default-allow-internal: Allows ingress connections for all protocols and ports among instances in the
    network. • default-allow-ssh: Allows ingress connections on TCP port 22(SSH) from any source to any instance in the network.
    • default-allow-rdp: Allows ingress connections on TCP port 3389(RDP) from any source to any instance in the network.
    • default-allow-icmp: Allows ingress ICMP traffic from any source to any instance in the network. These automatically
    created firewall rules do not get audit logged by default. Furthermore, the default network is an auto mode network, which
    means that its subnets use the same predefined range of IP addresses, and as a result, it''s not possible to use Cloud
    VPN or VPC Network Peering with the default network. Based on organization security and networking requirements, the organization
    should create a new network and delete the default network.'
  impact: When an organization deletes the default network, it will need to remove all asests from that network and migrate
    them to a new network.
  references:
  - 1. https://cloud.google.com/compute/docs/networking#firewall_rules
  - 2. https://cloud.google.com/compute/docs/reference/latest/networks/insert
  page_start: 127
  audit_raw: 'From Google Cloud Console

    1. Go to the VPC networks page by visiting:

    https://console.cloud.google.com/networking/networks/list.

    2. Ensure that a network with the name default is not present.

    From Google Cloud CLI

    1. Set the project name in the Google Cloud Shell:

    gcloud config set project PROJECT_ID

    2. List the networks configured in that project:

    gcloud compute networks list

    It should not list default as one of the available networks in that project.'
  remediation: 'From Google Cloud Console

    1. Go to the VPC networks page by visiting:

    https://console.cloud.google.com/networking/networks/list.

    2. Click the network named default.

    3. On the network detail page, click EDIT.

    4. Click DELETE VPC NETWORK.

    5. If needed, create a new network to replace the default network.

    From Google Cloud CLI

    For each Google Cloud Platform project,

    1. Delete the default network:

    gcloud compute networks delete default

    2. If needed, create a new network to replace it:

    gcloud compute networks create NETWORK_NAME

    Prevention:

    The user can prevent the default network and its insecure default firewall rules from

    being created by setting up an Organization Policy to Skip default network creation

    at https://console.cloud.google.com/iam-admin/orgpolicies/computeskipDefaultNetworkCreation.'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Go to the VPC networks page by visiting:

      https://console.cloud.google.com/networking/networks/list.

      2. Ensure that a network with the name default is not present.

      From Google Cloud CLI

      1. Set the project name in the Google Cloud Shell:

      gcloud config set project PROJECT_ID

      2. List the networks configured in that project:

      gcloud compute networks list

      It should not list default as one of the available networks in that project.'
    severity: medium
- id: '3.2'
  title: Ensure Legacy Networks Do Not Exist for Older Projects
  scoring: scored
  profile:
  - Level 1
  description: In order to prevent use of legacy networks, a project should not have a legacy network configured. As of now,
    Legacy Networks are gradually being phased out, and you can no longer create projects with them. This recommendation is
    to check older projects to ensure that they are not using Legacy Networks.
  rationale: Legacy networks have a single network IPv4 prefix range and a single gateway IP address for the whole network.
    The network is global in scope and spans all cloud regions. Subnetworks cannot be created in a legacy network and are
    unable to switch from legacy to auto or custom subnet networks. Legacy networks can have an impact for high network traffic
    projects and are subject to a single point of contention or failure.
