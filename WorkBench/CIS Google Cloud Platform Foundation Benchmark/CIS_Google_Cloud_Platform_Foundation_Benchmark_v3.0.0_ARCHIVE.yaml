- id: '1.13'
  title: Ensure API Keys Are Restricted To Use by Only Specified Hosts and Apps
  scoring: manual
  profile:
  - Level 2
  description: API Keys should only be used for services in cases where other authentication methods are unavailable. In this
    case, unrestricted keys are insecure because they can be viewed publicly, such as from within a browser, or they can be
    accessed on a device where the key resides. It is recommended to restrict API key usage to trusted hosts, HTTP referrers
    and apps. It is recommended to use the more secure standard authentication flow instead.
  rationale: 'Security risks involved in using API-Keys appear below: • API keys are simple encrypted strings • API keys do
    not identify the user or the application making the API request • API keys are typically accessible to clients, making
    it easy to discover and steal an API key In light of these potential risks, Google recommends using the standard authentication
    flow instead of API keys. However, there are limited cases where API keys are more appropriate. For example, if there
    is a mobile application that needs to use the Google Cloud Translation API, but doesn''t otherwise need a backend server,
    API keys are the simplest way to authenticate to that API. In order to reduce attack vectors, API-Keys can be restricted
    only to trusted hosts, HTTP referrers and applications.'
  impact: Setting Application Restrictions may break existing application functioning, if not done carefully.
  references:
  - 1. https://cloud.google.com/docs/authentication/api-keys
  - 2. https://cloud.google.com/sdk/gcloud/reference/services/api-keys/list
  page_start: 50
  audit_raw: 'From Google Cloud Console

