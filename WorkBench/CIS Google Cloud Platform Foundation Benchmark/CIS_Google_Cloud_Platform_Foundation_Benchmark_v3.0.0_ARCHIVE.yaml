- id: '7.4'
  title: Ensure all data in BigQuery has been classified
  scoring: manual
  profile:
  - Level 2
  description: BigQuery tables can contain sensitive data that for security purposes should be discovered, monitored, classified,
    and protected. Google Cloud's Sensitive Data Protection tools can automatically provide data classification of all BigQuery
    data across an organization.
  rationale: Using a cloud service or 3rd party software to continuously monitor and automate the process of data discovery
    and classification for BigQuery tables is an important part of protecting the data. Sensitive Data Protection is a fully
    managed data protection and data privacy platform that uses machine learning and pattern matching to discover and classify
    sensitive data in Google Cloud.
  impact: There is a cost associated with using Sensitive Data Protection. There is also typically a cost associated with
    3rd party tools that perform similar processes and protection.
  references:
  - 1. https://cloud.google.com/dlp/docs/data-profiles
  - 2. https://cloud.google.com/dlp/docs/analyze-data-profiles
  page_start: 281
  audit_raw: '1. Go to Cloud DLP by visiting

    https://console.cloud.google.com/dlp/landing/dataProfiles/configurations.

    2. Verify there is a discovery scan configuration either for the organization or

    project.'
  remediation: 'Enable profiling:

    1. Go to Cloud DLP by visiting

    https://console.cloud.google.com/dlp/landing/dataProfiles/configurations

    2. Click "Create Configuration"

    3. For projects follow https://cloud.google.com/dlp/docs/profile-project. For

    organizations or folders follow https://cloud.google.com/dlp/docs/profile-org-folder

    Review findings:

    • Columns or tables with high data risk have evidence of sensitive information

    without additional protections. To lower the data risk score, consider doing the

    following:

    • For columns containing sensitive data, apply a BigQuery policy tag to restrict

    access to accounts with specific access rights.

    • De-identify the raw sensitive data using de-identification techniques like masking

    and tokenization.

    Incorporate findings into your security and governance operations:

    • Enable sending findings into your security and posture services. You can publish

    data profiles to Security Command Center and Chronicle.

    • Automate remediation or enable alerting of new or changed data risk with

    Pub/Sub.'
  checks:
  - type: manual_review
    info: '1. Go to Cloud DLP by visiting

      https://console.cloud.google.com/dlp/landing/dataProfiles/configurations.

      2. Verify there is a discovery scan configuration either for the organization or

      project.'
    severity: medium
- id: '8.1'
  title: Ensure that Dataproc Cluster is encrypted using CustomerManaged Encryption Key
  scoring: scored
  profile:
  - Level 2
  description: When you use Dataproc, cluster and job data is stored on Persistent Disks (PDs) associated with the Compute
    Engine VMs in your cluster and in a Cloud Storage staging bucket. This PD and bucket data is encrypted using a Google-generated
    data encryption key (DEK) and key encryption key (KEK). The CMEK feature allows you to create, use, and revoke the key
    encryption key (KEK). Google still controls the data encryption key (DEK).
  rationale: '"Cloud services offer the ability to protect data related to those services using encryption keys managed by
    the customer within Cloud KMS. These encryption keys are called customer-managed encryption keys (CMEK). When you protect
    data in Google Cloud services with CMEK, the CMEK key is within your control.'
  impact: Using Customer Managed Keys involves additional overhead in maintenance by administrators.
  references:
  - 1. https://cloud.google.com/docs/security/encryption/default-encryption
  page_start: 284
  audit_raw: 'From Google Cloud Console

    1. Login to the GCP Console and navigate to the Dataproc Cluster page by visiting

    https://console.cloud.google.com/dataproc/clusters.

    2. Select the project from the project dropdown list.

    3. On the Dataproc Clusters page, select the cluster and click on the Name

    attribute value that you want to examine.

    4. On the details page, select the Configurations tab.

    5. On the Configurations tab, check the Encryption type configuration attribute

    value. If the value is set to Google-managed key, then Dataproc Cluster is not

    encrypted with Customer managed encryption keys.

    Repeat step no. 3 - 5 for other Dataproc Clusters available in the selected project.

    6. Change the project from the project dropdown list and repeat the audit procedure

    for other projects.

    From Google Cloud CLI

    1. Run clusters list command to list all the Dataproc Clusters available in the region:

    gcloud dataproc clusters list --region=''us-central1''

    2. Run clusters describe command to get the key details of the selected cluster:

    gcloud dataproc clusters describe <cluster_name> --region=us-central1 --

    flatten=config.encryptionConfig.gcePdKmsKeyName

    3. If the above command output return "null", then the selected cluster is not

    encrypted with Customer managed encryption keys.

    4. Repeat step no. 2 and 3 for other Dataproc Clusters available in the selected

    region. Change the region by updating --region and repeat step no. 2 for other

    clusters available in the project. Change the project by running the below

    command and repeat the audit procedure for other Dataproc clusters available in

    other projects:

    gcloud config set project <project_ID>"'
  remediation: 'From Google Cloud Console

    1. Login to the GCP Console and navigate to the Dataproc Cluster page by visiting

    https://console.cloud.google.com/dataproc/clusters.

    2. Select the project from the projects dropdown list.

    3. On the Dataproc Cluster page, click on the Create Cluster to create a new

    cluster with Customer managed encryption keys.

    4. On Create a cluster page, perform below steps:

    • Inside Set up cluster section perform below steps:

    -In the Name textbox, provide a name for your cluster.

    o From Location select the location in which you want to deploy a cluster.

    o Configure other configurations as per your requirements.

    • Inside Configure Nodes and Customize cluster section configure the settings as

    per your requirements.

    • Inside Manage security section, perform below steps:

    o From Encryption, select Customer-managed key.

    o Select a customer-managed key from dropdown list.

    o Ensure that the selected KMS Key have Cloud KMS CryptoKey

    Encrypter/Decrypter role assign to Dataproc Cluster service account

    ("serviceAccount:service-<project_number>@computesystem.iam.gserviceaccount.com").

    o Click on Create to create a cluster.

    • Once the cluster is created migrate all your workloads from the older cluster to

    the new cluster and delete the old cluster by performing the below steps:

    o On the Clusters page, select the old cluster and click on Delete cluster.

    o On the Confirm deletion window, click on Confirm to delete the cluster.

    o Repeat step above for other Dataproc clusters available in the selected

    project.

    • Change the project from the project dropdown list and repeat the remediation

    procedure for other Dataproc clusters available in other projects.

    From Google Cloud CLI

    Before creating cluster ensure that the selected KMS Key have Cloud KMS CryptoKey

    Encrypter/Decrypter role assign to Dataproc Cluster service account

    ("serviceAccount:service-<project_number>@computesystem.iam.gserviceaccount.com").

    Run clusters create command to create new cluster with customer-managed key:

    gcloud dataproc clusters create <cluster_name> --region=us-central1 --gce-pdkms-key=<key_resource_name>

    The above command will create a new cluster in the selected region.

    Once the cluster is created migrate all your workloads from the older cluster to the new

    cluster and Run clusters delete command to delete cluster:

    gcloud dataproc clusters delete <cluster_name> --region=us-central1

    Repeat step no. 1 to create a new Dataproc cluster.

    Change the project by running the below command and repeat the remediation

    procedure for other projects:

    gcloud config set project <project_ID>"'
