- id: '3.8'
  title: Ensure that VPC Flow Logs is Enabled for Every Subnet in a VPC Network
  scoring: scored
  profile:
  - Level 2
  description: Flow Logs is a feature that enables users to capture information about the IP traffic going to and from network
    interfaces in the organization's VPC Subnets. Once a flow log is created, the user can view and retrieve its data in Stackdriver
    Logging. It is recommended that Flow Logs be enabled for every business-critical VPC subnet.
  rationale: 'VPC networks and subnetworks not reserved for internal HTTP(S) load balancing provide logically isolated and
    secure network partitions where GCP resources can be launched. When Flow Logs are enabled for a subnet, VMs within that
    subnet start reporting on all Transmission Control Protocol (TCP) and User Datagram Protocol (UDP) flows. Each VM samples
    the TCP and UDP flows it sees, inbound and outbound, whether the flow is to or from another VM, a host in the on-premises
    datacenter, a Google service, or a host on the Internet. If two GCP VMs are communicating, and both are in subnets that
    have VPC Flow Logs enabled, both VMs report the flows. Flow Logs supports the following use cases: • Network monitoring
    • Understanding network usage and optimizing network traffic expenses • Network forensics • Real-time security analysis
    Flow Logs provide visibility into network traffic for each VM inside the subnet and can be used to detect anomalous traffic
    or provide insight during security workflows. The Flow Logs must be configured such that all network traffic is logged,
    the interval of logging is granular to provide detailed information on the connections, no logs are filtered, and metadata
    to facilitate investigations are included. Note: Subnets reserved for use by internal HTTP(S) load balancers do not support
    VPC flow logs.'
  impact: 'Standard pricing for Stackdriver Logging, BigQuery, or Cloud Pub/Sub applies. VPC Flow Logs generation will be
    charged starting in GA as described in reference: https://cloud.google.com/vpc/'
  references:
  - 1. https://cloud.google.com/vpc/docs/using-flow-logs#enabling_vpc_flow_logging
  - 2. https://cloud.google.com/vpc/
  page_start: 144
  audit_raw: "From Google Cloud Console\n1. Go to the VPC network GCP Console visiting\nhttps://console.cloud.google.com/networking/networks/list\n\
    2. From the list of network subnets, make sure for each subnet:\n• Flow Logs is set to On\n• Aggregation Interval is set\
    \ to 5 sec\n• Include metadata checkbox is checked\n• Sample rate is set to 100%\nNote: It is not possible to determine\
    \ if a Log filter has been defined from the console.\nFrom Google Cloud CLI\ngcloud compute networks subnets list --format\
    \ json | \\\n jq -r\n'([\"Subnet\",\"Purpose\",\"Flow_Logs\",\"Aggregation_Interval\",\"Flow_Sampling\",\"Met\nadata\"\
    ,\"Logs_Filtered\"] | (., map(length*\"-\"))),\n (.[] |\n [\n .name,\n .purpose,\n (if has(\"enableFlowLogs\") and .enableFlowLogs\
    \ == true then\n\"Enabled\" else \"Disabled\" end),\n (if has(\"logConfig\") then .logConfig.aggregationInterval else\n\
    \"N/A\" end),\n (if has(\"logConfig\") then .logConfig.flowSampling else \"N/A\"\nend),\n (if has(\"logConfig\") then\
    \ .logConfig.metadata else \"N/A\" end),\n (if has(\"logConfig\") then (.logConfig | has(\"filterExpr\")) else\n\"N/A\"\
    \ end)\n ]\n ) |\n @tsv' | \\\n column -t\nThe output of the above command will list:\n• each subnet\n• the subnet's purpose\n\
    • a Enabled or Disabled value if Flow Logs are enabled\n• the value for Aggregation Interval or N/A if disabled, the value\
    \ for Flow\nSampling or N/A if disabled\n• the value for Metadata or N/A if disabled\n• 'true' or 'false' if a Logging\
    \ Filter is configured or 'N/A' if disabled.\nIf the subnet's purpose is PRIVATE then Flow Logs should be Enabled.\nIf\
    \ Flow Logs is enabled then:\n• Aggregation_Interval should be INTERVAL_5_SEC\n• Flow_Sampling should be 1\n• Metadata\
    \ should be INCLUDE_ALL_METADATA\n• Logs_Filtered should be false."
  remediation: 'From Google Cloud Console

    1. Go to the VPC network GCP Console visiting

    https://console.cloud.google.com/networking/networks/list

    2. Click the name of a subnet, The Subnet details page displays.

    3. Click the EDIT button.

    4. Set Flow Logs to On.

    5. Expand the Configure Logs section.

    6. Set Aggregation Interval to 5 SEC.

    7. Check the box beside Include metadata.

    8. Set Sample rate to 100.

    9. Click Save.

    Note: It is not possible to configure a Log filter from the console.

    From Google Cloud CLI

    To enable VPC Flow Logs for a network subnet, run the following command:

    gcloud compute networks subnets update [SUBNET_NAME] --region [REGION] --

    enable-flow-logs --logging-aggregation-interval=interval-5-sec --loggingflow-sampling=1 --logging-metadata=include-all'
  checks:
  - type: manual_review
    info: "From Google Cloud Console\n1. Go to the VPC network GCP Console visiting\nhttps://console.cloud.google.com/networking/networks/list\n\
      2. From the list of network subnets, make sure for each subnet:\n• Flow Logs is set to On\n• Aggregation Interval is\
      \ set to 5 sec\n• Include metadata checkbox is checked\n• Sample rate is set to 100%\nNote: It is not possible to determine\
      \ if a Log filter has been defined from the console.\nFrom Google Cloud CLI\ngcloud compute networks subnets list --format\
      \ json | \\\n jq -r\n'"
    severity: medium
- id: '3.9'
  title: Ensure No HTTPS or SSL Proxy Load Balancers Permit SSL Policies With Weak Cipher Suites
  scoring: manual
  profile:
  - Level 1
  description: 'Secure Sockets Layer (SSL) policies determine what port Transport Layer Security (TLS) features clients are
    permitted to use when connecting to load balancers. To prevent usage of insecure features, SSL policies should use (a)
    at least TLS 1.2 with the MODERN profile; or (b) the RESTRICTED profile, because it effectively requires clients to use
    TLS 1.2 regardless of the chosen minimum TLS version; or (3) a CUSTOM profile that does not support any of the following
    features: TLS_RSA_WITH_AES_128_GCM_SHA256 TLS_RSA_WITH_AES_256_GCM_SHA384 TLS_RSA_WITH_AES_128_CBC_SHA TLS_RSA_WITH_AES_256_CBC_SHA
    TLS_RSA_WITH_3DES_EDE_CBC_SHA'
  rationale: Load balancers are used to efficiently distribute traffic across multiple servers. Both SSL proxy and HTTPS load
    balancers are external load balancers, meaning they distribute traffic from the Internet to a GCP network. GCP customers
    can configure load balancer SSL policies with a minimum TLS version (1.0, 1.1, or 1.2) that clients can use to establish
    a connection, along with a profile (Compatible, Modern, Restricted, or Custom) that specifies permissible cipher suites.
    To comply with users using outdated protocols, GCP load balancers can be configured to permit insecure cipher suites.
    In fact, the GCP default SSL policy uses a minimum TLS version of 1.0 and a Compatible profile, which allows the widest
    range of insecure cipher suites. As a result, it is easy for customers to configure a load balancer without even knowing
    that they are permitting outdated cipher suites.
  impact: Creating more secure SSL policies can prevent clients using older TLS versions from establishing a connection.
  references:
  - 1. https://cloud.google.com/load-balancing/docs/use-ssl-policies
  - 2. https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-52r2.pdf
  page_start: 148
  audit_raw: 'From Google Cloud Console

    1. See all load balancers by visiting https://console.cloud.google.com/netservices/loadbalancing/loadBalancers/list.

    2. For each load balancer for SSL (Proxy) or HTTPS, click on its name to go the Load

    balancer details page.

    3. Ensure that each target proxy entry in the Frontend table has an SSL Policy

    configured.

    4. Click on each SSL policy to go to its SSL policy details page.

    5. Ensure that the SSL policy satisfies one of the following conditions:

    • has a Min TLS set to TLS 1.2 and Profile set to Modern profile, or

    • has Profile set to Restricted. Note that a Restricted profile effectively requires

    clients to use TLS 1.2 regardless of the chosen minimum TLS version, or

    • has Profile set to Custom and the following features are all disabled:

    TLS_RSA_WITH_AES_128_GCM_SHA256

    TLS_RSA_WITH_AES_256_GCM_SHA384

    TLS_RSA_WITH_AES_128_CBC_SHA

    TLS_RSA_WITH_AES_256_CBC_SHA

    TLS_RSA_WITH_3DES_EDE_CBC_SHA

    From Google Cloud CLI

    1. List all TargetHttpsProxies and TargetSslProxies.

    gcloud compute target-https-proxies list

    gcloud compute target-ssl-proxies list

    2. For each target proxy, list its properties:

    gcloud compute target-https-proxies describe TARGET_HTTPS_PROXY_NAME

    gcloud compute target-ssl-proxies describe TARGET_SSL_PROXY_NAME

    3. Ensure that the sslPolicy field is present and identifies the name of the SSL

    policy:

    sslPolicy:

    https://www.googleapis.com/compute/v1/projects/PROJECT_ID/global/sslPolicies/

    SSL_POLICY_NAME

    If the sslPolicy field is missing from the configuration, it means that the GCP default

    policy is used, which is insecure.

    4. Describe the SSL policy:

    gcloud compute ssl-policies describe SSL_POLICY_NAME

