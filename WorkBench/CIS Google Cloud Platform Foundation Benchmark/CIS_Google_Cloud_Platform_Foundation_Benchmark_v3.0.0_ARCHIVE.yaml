- id: '3.3'
  title: Ensure That DNSSEC Is Enabled for Cloud DNS
  scoring: scored
  profile:
  - Level 1
  description: Cloud Domain Name System (DNS) is a fast, reliable and cost-effective domain name system that powers millions
    of domains on the internet. Domain Name System Security Extensions (DNSSEC) in Cloud DNS enables domain owners to take
    easy steps to protect their domains against DNS hijacking and man-in-the-middle and other attacks.
  rationale: Domain Name System Security Extensions (DNSSEC) adds security to the DNS protocol by enabling DNS responses to
    be validated. Having a trustworthy DNS that translates a domain name like www.example.com into its associated IP address
    is an increasingly important building block of today’s web-based applications. Attackers can hijack this process of domain/IP
    lookup and redirect users to a malicious site through DNS hijacking and man-in-the-middle attacks. DNSSEC helps mitigate
    the risk of such attacks by cryptographically signing DNS records. As a result, it prevents attackers from issuing fake
    DNS responses that may misdirect browsers to nefarious websites.
  impact: ''
  references:
  - 1. https://cloudplatform.googleblog.com/2017/11/DNSSEC-now-available-in-CloudDNS.html
  - 2. https://cloud.google.com/dns/dnssec-config#enabling
  page_start: 132
  audit_raw: 'From Google Cloud Console

    1. Go to Cloud DNS by visiting https://console.cloud.google.com/netservices/dns/zones.

    2. For each zone of Type Public, ensure that DNSSEC is set to On.

    From Google Cloud CLI

    1. List all the Managed Zones in a project:

    gcloud dns managed-zones list

    2. For each zone of VISIBILITY public, get its metadata:

    gcloud dns managed-zones describe ZONE_NAME

    3. Ensure that dnssecConfig.state property is on.'
  remediation: 'From Google Cloud Console

    1. Go to Cloud DNS by visiting https://console.cloud.google.com/netservices/dns/zones.

    2. For each zone of Type Public, set DNSSEC to On.

    From Google Cloud CLI

    Use the below command to enable DNSSEC for Cloud DNS Zone Name.

    gcloud dns managed-zones update ZONE_NAME --dnssec-state on'
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Go to Cloud DNS by visiting https://console.cloud.google.com/netservices/dns/zones.

      2. For each zone of Type Public, ensure that DNSSEC is set to On.

      From Google Cloud CLI

      1. List all the Managed Zones in a project:

      gcloud dns managed-zones list

      2. For each zone of VISIBILITY public, get its metadata:

      gcloud dns managed-zones describe ZONE_NAME

      3. Ensure that dnssecConfig.state property is on.'
    severity: medium
- id: '3.4'
  title: Ensure That RSASHA1 Is Not Used for the Key-Signing Key in Cloud DNS DNSSEC
  scoring: scored
  profile:
  - Level 1
  description: 'NOTE: Currently, the SHA1 algorithm has been removed from general use by Google, and, if being used, needs
    to be whitelisted on a project basis by Google and will also, therefore, require a Google Cloud support contract. DNSSEC
    algorithm numbers in this registry may be used in CERT RRs. Zone signing (DNSSEC) and transaction security mechanisms
    (SIG(0) and TSIG) make use of particular subsets of these algorithms. The algorithm used for key signing should be a recommended
    one and it should be strong.'
  rationale: Domain Name System Security Extensions (DNSSEC) algorithm numbers in this registry may be used in CERT RRs. Zonesigning
    (DNSSEC) and transaction security mechanisms (SIG(0) and TSIG) make use of particular subsets of these algorithms. The
    algorithm used for key signing should be a recommended one and it should be strong. When enabling DNSSEC for a managed
    zone, or creating a managed zone with DNSSEC, the user can select the DNSSEC signing algorithms and the denial-ofexistence
    type. Changing the DNSSEC settings is only effective for a managed zone if DNSSEC is not already enabled. If there is
    a need to change the settings for a managed zone where it has been enabled, turn DNSSEC off and then re-enable it with
    different settings.
  impact: ''
  references:
  - 1. https://cloud.google.com/dns/dnssec-advanced#advanced_signing_options
  page_start: 134
  audit_raw: 'From Google Cloud CLI

    Ensure the property algorithm for keyType keySigning is not using RSASHA1.

    gcloud dns managed-zones describe ZONENAME --

    format="json(dnsName,dnssecConfig.state,dnssecConfig.defaultKeySpecs)"'
  remediation: 'From Google Cloud CLI

    1. If it is necessary to change the settings for a managed zone where it has been

    enabled, DNSSEC must be turned off and re-enabled with different settings. To

    turn off DNSSEC, run the following command:

    gcloud dns managed-zones update ZONE_NAME --dnssec-state off

    2. To update key-signing for a reported managed DNS Zone, run the following

    command:

    gcloud dns managed-zones update ZONE_NAME --dnssec-state on --ksk-algorithm

    KSK_ALGORITHM --ksk-key-length KSK_KEY_LENGTH --zsk-algorithm ZSK_ALGORITHM -

    -zsk-key-length ZSK_KEY_LENGTH --denial-of-existence DENIAL_OF_EXISTENCE

    Supported algorithm options and key lengths are as follows.

    Algorithm KSK Length ZSK Length

    --------- ---------- ----------

    RSASHA1 1024,2048 1024,2048

    RSASHA256 1024,2048 1024,2048

    RSASHA512 1024,2048 1024,2048

    ECDSAP256SHA256 256 256

    ECDSAP384SHA384 384 384'
  checks:
  - type: manual_review
    info: 'From Google Cloud CLI

      Ensure the property algorithm for keyType keySigning is not using RSASHA1.

      gcloud dns managed-zones describe ZONENAME --

      format="json(dnsName,dnssecConfig.state,dnssecConfig.defaultKeySpecs)"'
    severity: medium
