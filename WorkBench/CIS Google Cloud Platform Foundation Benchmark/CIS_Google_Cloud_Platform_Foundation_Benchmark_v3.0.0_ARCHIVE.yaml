- id: '2.14'
  title: Ensure 'Access Transparency' is 'Enabled'
  scoring: manual
  profile:
  - Level 2
  description: GCP Access Transparency provides audit logs for all actions that Google personnel take in your Google Cloud
    resources.
  rationale: Controlling access to your information is one of the foundations of information security. Given that Google Employees
    do have access to your organizations' projects for support reasons, you should have logging in place to view who, when,
    and why your information is being accessed.
  impact: 'To use Access Transparency your organization will need to have at one of the following support level: Premium,
    Enterprise, Platinum, or Gold. There will be subscription costs associated with support, as well as increased storage
    costs for storing the logs. You will also not be able to turn Access Transparency off yourself, and you will need to submit
    a service request to Google Cloud Support.'
  references:
