- id: 6.3.2
  title: Ensure that the 'cross db ownership chaining' database flag for Cloud SQL SQL Server instance is set to 'off'
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to set cross db ownership chaining database flag for Cloud SQL SQL Server instance to off.
    This flag is deprecated for all SQL Server versions in CGP. Going forward, you can't set its value to on. However, if
    you have this flag enabled, we strongly recommend that you either remove the flag from your database or set it to off.
    For cross-database access, use the Microsoft tutorial for signing stored procedures with a certificate.
  rationale: Use the cross db ownership for chaining option to configure cross-database ownership chaining for an instance
    of Microsoft SQL Server. This server option allows you to control cross-database ownership chaining at the database level
    or to allow crossdatabase ownership chaining for all databases. Enabling cross db ownership is not recommended unless
    all of the databases hosted by the instance of SQL Server must participate in cross-database ownership chaining and you
    are aware of the security implications of this setting. This recommendation is applicable to SQL Server database instances.
  impact: Updating flags may cause the database to restart. This may cause it to unavailable for a short amount of time, so
    this is best done at a time of low usage. You should also determine if the tables in your databases reference another
    table without using credentials for that database, as turning off cross database ownership will break this relationship.
