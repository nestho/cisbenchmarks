- id: '4.10'
  title: Ensure That App Engine Applications Enforce HTTPS Connections
  scoring: manual
  profile:
  - Level 2
  description: In order to maintain the highest level of security all connections to an application should be secure by default.
  rationale: Insecure HTTP connections maybe subject to eavesdropping which can expose sensitive data.
  impact: All connections to appengine will automatically be redirected to the HTTPS endpoint ensuring that all connections
    are secured by TLS.
  references:
  - 1. https://cloud.google.com/appengine/docs/standard/python3/config/appref
  - 2. https://cloud.google.com/appengine/docs/flexible/nodejs/configuring-your-appwith-app-yaml
  page_start: 184
  audit_raw: "Verify that the app.yaml file controlling the application contains a line which enforces\nsecure connections.\
    \ For example\nhandlers:\n- url: /.*\n secure: always\n redirect_http_response_code: 301\n script: auto\nhttps://cloud.google.com/appengine/docs/standard/python3/config/appref"
  remediation: "Add a line to the app.yaml file controlling the application which enforces secure\nconnections. For example\n\
    handlers:\n- url: /.*\n **secure: always**\n redirect_http_response_code: 301\n script: auto\n[https://cloud.google.com/appengine/docs/standard/python3/config/appref]"
