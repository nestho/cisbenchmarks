- id: 6.2.5
  title: Ensure that the ‘Log_min_messages’ Flag for a Cloud SQL PostgreSQL Instance is set at minimum to 'Warning'
  scoring: scored
  profile:
  - Level 1
  description: The log_min_messages flag defines the minimum message severity level that is considered as an error statement.
    Messages for error statements are logged with the SQL statement. Valid values include (from lowest to highest severity)
    DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, and PANIC. Each severity level includes
    the subsequent levels mentioned above. ERROR is considered the best practice setting. Changes should only be made in accordance
    with the organization's logging policy.
  rationale: Auditing helps in troubleshooting operational problems and also permits forensic analysis. If log_min_messages
    is not set to the correct value, messages may not be classified as error messages appropriately. An organization will
    need to decide their own threshold for logging log_min_messages flag. This recommendation is applicable to PostgreSQL
    database instances.
  impact: 'Setting the threshold too low will might result in increased log storage size and length, making it difficult to
    find actual errors. Setting the threshold to ''Warning'' will log messages for the most needed error messages. Higher
    severity levels may cause errors needed to troubleshoot to not be logged. Note: To effectively turn off logging failing
    statements, set this parameter to PANIC.'
  references:
  - 1. https://cloud.google.com/sql/docs/postgres/flags
  - 2. https://www.postgresql.org/docs/9.6/runtime-config-logging.html#RUNTIMECONFIG-LOGGING-WHEN
