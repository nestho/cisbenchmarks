- id: '2.1'
  title: Ensure That Cloud Audit Logging Is Configured Properly
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that Cloud Audit Logging is configured to track all admin activities and read, write access
    to user data.
  rationale: 'Cloud Audit Logging maintains two audit logs for each project, folder, and organization: Admin Activity and
    Data Access. 1. Admin Activity logs contain log entries for API calls or other administrative actions that modify the
    configuration or metadata of resources. Admin Activity audit logs are enabled for all services and cannot be configured.
    2. Data Access audit logs record API calls that create, modify, or read userprovided data. These are disabled by default
    and should be enabled. There are three kinds of Data Access audit log information: o Admin read: Records operations that
    read metadata or configuration information. Admin Activity audit logs record writes of metadata and configuration information
    that cannot be disabled. o Data read: Records operations that read user-provided data. o Data write: Records operations
    that write user-provided data. It is recommended to have an effective default audit config configured in such a way that:
    1. logtype is set to DATA_READ (to log user activity tracking) and DATA_WRITES (to log changes/tampering to user data).
    2. audit config is enabled for all the services supported by the Data Access audit logs feature. 3. Logs should be captured
    for all users, i.e., there are no exempted users in any of the audit config sections. This will ensure overriding the
    audit config will not contradict the requirement.'
  impact: There is no charge for Admin Activity audit logs. Enabling the Data Access audit logs might result in your project
    being charged for the additional logs usage.
  references:
  - 1. https://cloud.google.com/logging/docs/audit/
  - 2. https://cloud.google.com/logging/docs/audit/configure-data-access
  page_start: 68
  audit_raw: "From Google Cloud Console\n1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.\n\
    2. Ensure that Admin Read, Data Write, and Data Read are enabled for all Google\nCloud services and that no exemptions\
    \ are allowed.\nFrom Google Cloud CLI\n1. List the Identity and Access Management (IAM) policies for the project, folder,\
    \ or\norganization:\ngcloud organizations get-iam-policy ORGANIZATION_ID\ngcloud resource-manager folders get-iam-policy\
    \ FOLDER_ID\ngcloud projects get-iam-policy PROJECT_ID\n2. Policy should have a default auditConfigs section which has\
    \ the logtype set to\nDATA_WRITES and DATA_READ for all services. Note that projects inherit\nsettings from folders, which\
    \ in turn inherit settings from the organization. When\ncalled, projects get-iam-policy, the result shows only the policies\
    \ set in the\nproject, not the policies inherited from the parent folder or organization.\nNevertheless, if the parent\
    \ folder has Cloud Audit Logging enabled, the project\ndoes as well.\nSample output for default audit configs may look\
    \ like this:\n auditConfigs:\n - auditLogConfigs:\n - logType: ADMIN_READ\n - logType: DATA_WRITE\n - logType: DATA_READ\n\
    \ service: allServices\n3. Any of the auditConfigs sections should not have parameter\n\"exemptedMembers:\" set, which\
    \ will ensure that Logging is enabled for all users\nand no user is exempted."
  remediation: "From Google Cloud Console\n1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.\n\
    2. Follow the steps at https://cloud.google.com/logging/docs/audit/configure-dataaccess to enable audit logs for all Google\
    \ Cloud services. Ensure that no\nexemptions are allowed.\nFrom Google Cloud CLI\n1. To read the project's IAM policy\
    \ and store it in a file run a command:\ngcloud projects get-iam-policy PROJECT_ID > /tmp/project_policy.yaml\nAlternatively,\
    \ the policy can be set at the organization or folder level. If setting the policy\nat the organization level, it is not\
    \ necessary to also set it for each folder or project.\ngcloud organizations get-iam-policy ORGANIZATION_ID > /tmp/org_policy.yaml\n\
    gcloud resource-manager folders get-iam-policy FOLDER_ID >\n/tmp/folder_policy.yaml\n2. Edit policy in /tmp/policy.yaml,\
    \ adding or changing only the audit logs\nconfiguration to:\nNote: Admin Activity Logs are enabled by default, and cannot\
    \ be disabled.\nSo they are not listed in these configuration changes.\nauditConfigs:\n- auditLogConfigs:\n - logType:\
    \ DATA_WRITE\n - logType: DATA_READ\n service: allServices\nNote: exemptedMembers: is not set as audit logging should\
    \ be enabled for all the users\n3. To write new IAM policy run command:\ngcloud organizations set-iam-policy ORGANIZATION_ID\
    \ /tmp/org_policy.yaml\ngcloud resource-manager folders set-iam-policy FOLDER_ID\n/tmp/folder_policy.yaml\ngcloud projects\
    \ set-iam-policy PROJECT_ID /tmp/project_policy.yaml\nIf the preceding command reports a conflict with another change,\
    \ then repeat these\nsteps, starting with the first step."
  checks:
  - type: manual_review
    info: 'From Google Cloud Console

      1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.

      2. Ensure that Admin Read, Data Write, and Data Read are enabled for all Google

      Cloud services and that no exemptions are allowed.

      From Google Cloud CLI

      1. List the Identity and Access Management (IAM) policies for the project, folder, or

      organization:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      gcloud resource-manager folders get-iam-policy FOLDER_ID

      gcloud projects get-iam-policy'
    severity: medium
- id: '2.2'
  title: Ensure That Sinks Are Configured for All Log Entries
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: It is recommended to create a sink that will export copies of all the log entries. This can help aggregate
    logs from multiple projects and export them to a Security Information and Event Management (SIEM). Enabling retention
    policies on log buckets will protect logs stored in cloud storage buckets from being overwritten or accidentally deleted.
    It is recommended to set up retention policies and configure Bucket Lock on all storage buckets that are used as log sinks.
  rationale: Log entries are held in Cloud Logging. To aggregate logs, export them to a SIEM. To keep them longer, it is recommended
    to set up a log sink. Exporting involves writing a filter that selects the log entries to export, and choosing a destination
    in Cloud Storage, BigQuery, or Cloud Pub/Sub. The filter and destination are held in an object called a sink. To ensure
    all log entries are exported to sinks, ensure that there is no filter configured for a sink. Sinks can be created in projects,
    organizations, folders, and billing accounts. Logs can be exported by creating one or more sinks that include a log filter
    and a destination. As Cloud Logging receives new log entries, they are compared against each sink. If a log entry matches
    a sink's filter, then a copy of the log entry is written to the destination. Sinks can be configured to export logs in
    storage buckets. It is recommended to configure a data retention policy for these cloud storage buckets and to lock the
    data retention policy; thus permanently preventing the policy from being reduced or removed. This way, if the system is
    ever compromised by an attacker or a malicious insider who wants to cover their tracks, the activity logs are definitely
    preserved for forensics and security investigations.
  impact: There are no costs or limitations in Cloud Logging for exporting logs, but the export destinations charge for storing
    or transmitting the log data. Locking a bucket is an irreversible action. Once you lock a bucket, you cannot remove the
    retention policy from the bucket or decrease the retention period for the policy. You will then have to wait for the retention
    period for all items within the bucket before you can delete them, and then the bucket.
  references:
  - 1. https://cloud.google.com/logging/docs/reference/tools/gcloud-logging
  - 2. https://cloud.google.com/logging/quotas
  - 1. https://cloud.google.com/storage/docs/bucket-lock
  - 2. https://cloud.google.com/storage/docs/using-bucket-lock
  page_start: 72
  audit_raw: 'From Google Cloud Console

    1. Go to Logs Router by visiting https://console.cloud.google.com/logs/router.

    2. For every sink, click the 3-dot button for Menu options and select View sink

    details.

    3. Ensure there is at least one sink with an empty Inclusion filter.

    4. Additionally, ensure that the resource configured as Destination exists.

    From Google Cloud CLI

    1. Ensure that a sink with an empty filter exists. List the sinks for the project,

    folder or organization. If sinks are configured at a folder or organization level,

    they do not need to be configured for each project:

    gcloud logging sinks list --folder=FOLDER_ID | --organization=ORGANIZATION_ID

    | --project=PROJECT_ID

    The output should list at least one sink with an empty filter.

    2. Additionally, ensure that the resource configured as Destination exists.

    See https://cloud.google.com/sdk/gcloud/reference/beta/logging/sinks/list for more

    information.

    From Google Cloud Console

    1. Open the Cloud Storage browser in the Google Cloud Console by visiting

    https://console.cloud.google.com/storage/browser.

    2. In the Column display options menu, make sure Retention policy is checked.

    3. In the list of buckets, the retention period of each bucket is found in the

    Retention policy column. If the retention policy is locked, an image of a lock

    appears directly to the left of the retention period.

    From Google Cloud CLI

    1. To list all sinks destined to storage buckets:

    gcloud logging sinks list --folder=FOLDER_ID | --organization=ORGANIZATION_ID

    | --project=PROJECT_ID

    2. For every storage bucket listed above, verify that retention policies and Bucket

    Lock are enabled:

    gsutil retention get gs://BUCKET_NAME

    For more information, see https://cloud.google.com/storage/docs/using-bucketlock#view-policy.'
  remediation: 'From Google Cloud Console

    1. Go to Logs Router by visiting https://console.cloud.google.com/logs/router.

    2. Click on the arrow symbol with CREATE SINK text.

    3. Fill out the fields for Sink details.

    4. Choose Cloud Logging bucket in the Select sink destination drop down menu.

    5. Choose a log bucket in the next drop down menu.

    6. If an inclusion filter is not provided for this sink, all ingested logs will be routed to

    the destination provided above. This may result in higher than expected resource

    usage.

    7. Click Create Sink.

    For more information, see

    https://cloud.google.com/logging/docs/export/configure_export_v2#dest-create.

    From Google Cloud CLI

    To create a sink to export all log entries in a Google Cloud Storage bucket:

    gcloud logging sinks create <sink-name>

    storage.googleapis.com/DESTINATION_BUCKET_NAME

    Sinks can be created for a folder or organization, which will include all projects.

    gcloud logging sinks create <sink-name>

    storage.googleapis.com/DESTINATION_BUCKET_NAME --include-children --

    folder=FOLDER_ID | --organization=ORGANIZATION_ID

    Note:

    1. A sink created by the command-line above will export logs in storage buckets.

    However, sinks can be configured to export logs into BigQuery, or Cloud

    Pub/Sub, or Custom Destination.

    2. While creating a sink, the sink option --log-filter is not used to ensure the sink

    exports all log entries.

    3. A sink can be created at a folder or organization level that collects the logs of all

    the projects underneath bypassing the option --include-children in the gcloud

    command.

    From Google Cloud Console

    1. If sinks are not configured, first follow the instructions in the recommendation:

    Ensure that sinks are configured for all Log entries.

    2. For each storage bucket configured as a sink, go to the Cloud Storage browser

    at https://console.cloud.google.com/storage/browser/<BUCKET_NAME>.

    3. Select the Bucket Lock tab near the top of the page.

    4. In the Retention policy entry, click the Add Duration link. The Set a retention

    policy dialog box appears.

    5. Enter the desired length of time for the retention period and click Save policy.

    6. Set the Lock status for this retention policy to Locked.

    From Google Cloud CLI

    1. To list all sinks destined to storage buckets:

    gcloud logging sinks list --folder=FOLDER_ID | --organization=ORGANIZATION_ID

    | --project=PROJECT_ID

    2. For each storage bucket listed above, set a retention policy and lock it:

    gsutil retention set [TIME_DURATION] gs://[BUCKET_NAME]

    gsutil retention lock gs://[BUCKET_NAME]

    For more information, visit https://cloud.google.com/storage/docs/using-bucket-lock#setpolicy.'
