- id: 6.1.3
  title: Ensure That the ‘Local_infile’ Database Flag for a Cloud SQL MySQL Instance Is Set to ‘Off’
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to set the local_infile database flag for a Cloud SQL MySQL instance to off.
  rationale: The local_infile flag controls the server-side LOCAL capability for LOAD DATA statements. Depending on the local_infile
    setting, the server refuses or permits local data loading by clients that have LOCAL enabled on the client side. To explicitly
    cause the server to refuse LOAD DATA LOCAL statements (regardless of how client programs and libraries are configured
    at build time or runtime), start mysqld with local_infile disabled. local_infile can also be set at runtime. Due to security
    issues associated with the local_infile flag, it is recommended to disable it. This recommendation is applicable to MySQL
    database instances.
  impact: Disabling local_infile makes the server refuse local data loading by clients that have LOCAL enabled on the client
    side.
  references:
