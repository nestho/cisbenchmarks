    \ --format=json\n1. The output should not contain an accessConfigs section under\nnetworkInterfaces. Note that the natIP\
    \ value is present only for instances that\nare running or for instances that are stopped but have a static IP address.\
    \ For\ninstances that are stopped and are configured to have an ephemeral public IP\naddress, the natIP field will not\
    \ be present. Example output:\nnetworkInterfaces:\n- accessConfigs:\n - kind: compute#accessConfig\n name: External NAT\n\
    \ networkTier: STANDARD\n type: ONE_TO_ONE_NAT\nException:\nInstances created by GKE should be excluded because some of\
    \ them have external IP\naddresses and cannot be changed by editing the instance settings. Instances created\nby GKE should\
    \ be excluded. These instances have names that start with \"gke-\" and are\nlabeled \"goog-gke-node\"."
  remediation: "From Google Cloud Console\n1. Go to the VM instances page by visiting:\nhttps://console.cloud.google.com/compute/instances.\n\
    2. Click on the instance name to go the the Instance detail page.\n3. Click Edit.\n4. For each Network interface, ensure\
    \ that External IP is set to None.\n5. Click Done and then click Save.\nFrom Google Cloud CLI\n1. Describe the instance\
    \ properties:\ngcloud compute instances describe <INSTANCE_NAME> --zone=<ZONE>\n2. Identify the access config name that\
    \ contains the external IP address. This\naccess config appears in the following format:\nnetworkInterfaces:\n- accessConfigs:\n\
    \ - kind: compute#accessConfig\n name: External NAT\n natIP: 130.211.181.55\n type: ONE_TO_ONE_NAT\n3. Delete the access\
    \ config.\ngcloud compute instances delete-access-config <INSTANCE_NAME> --zone=<ZONE> -\n-access-config-name <ACCESS_CONFIG_NAME>\n\
    In the above example, the ACCESS_CONFIG_NAME is External NAT. The name of your\naccess config might be different.\nPrevention:\n\
    You can configure the Define allowed external IPs for VM instances Organization\nPolicy to prevent VMs from being configured\
    \ with public IP addresses. Learn more at:\nhttps://console.cloud.google.com/orgpolicies/compute-vmExternalIpAccess"
