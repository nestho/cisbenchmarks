- id: 6.2.6
  title: Ensure ‘Log_min_error_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘Error’ or Stricter
  scoring: scored
  profile:
  - Level 1
  description: The log_min_error_statement flag defines the minimum message severity level that are considered as an error
    statement. Messages for error statements are logged with the SQL statement. Valid values include (from lowest to highest
    severity) DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, and PANIC. Each severity level
    includes the subsequent levels mentioned above. Ensure a value of ERROR or stricter is set. The log_min_duration_statement
    flag defines the minimum amount of execution time of a statement in milliseconds where the total duration of the statement
    is logged. Ensure that log_min_duration_statement is disabled, i.e., a value of -1 is set. Ensure cloudsql.enable_pgaudit
    database flag for Cloud SQL PostgreSQL instance is set to on to allow for centralized logging.
  rationale: Auditing helps in troubleshooting operational problems and also permits forensic analysis. If log_min_error_statement
    is not set to the correct value, messages may not be classified as error messages appropriately. Considering general log
    messages as error messages would make is difficult to find actual errors and considering only stricter severity levels
    as error messages may skip actual errors to log their SQL statements. The log_min_error_statement flag should be set to
    ERROR or stricter. This recommendation is applicable to PostgreSQL database instances. Logging SQL statements may include
    sensitive information that should not be recorded in logs. This recommendation is applicable to PostgreSQL database instances.
    As numerous other recommendations in this section consist of turning on flags for logging purposes, your organization
    will need a way to manage these logs. You may have a solution already in place. If you do not, consider installing and
    enabling the open source pgaudit extension within PostgreSQL and enabling its corresponding flag of cloudsql.enable_pgaudit.
    This flag and installing the extension enables database auditing in PostgreSQL through the open-source pgAudit extension.
