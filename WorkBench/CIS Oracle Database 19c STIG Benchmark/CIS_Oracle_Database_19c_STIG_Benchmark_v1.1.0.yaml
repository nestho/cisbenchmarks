      Determine if there are methods to disable use or access, or to remove definitions for

      external executable objects.

      Verify any application executable objects listed are authorized by the information

      system security officer (ISSO).

      To check for external procedures, execute the following query, whic'
- id: '1.63'
  title: O19C-00-013400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to external executables must be disabled or restricted. GROUP ID: V-270557 RULE ID: SV-270557r1065281'
  rationale: The Oracle external procedure capability provides use of the Oracle process account outside the operation of
    the database management system (DBMS) process. It can be used to submit and execute applications stored externally from
    the database under operating system controls. The external procedure process is the subject of frequent and successful
    attacks as it allows unauthenticated use of the Oracle process account on the operating system. As of Oracle version 11.1,
    the external procedure agent may be run directly from the database and not require use of the Oracle listener. This reduces
    the risk of unauthorized access to the procedure from outside of the database process.
  impact: ''
  references: []
  page_start: 159
  audit_raw: 'Review the system documentation to determine if the use of the external procedure

    agent is authorized.

    Review the ORACLE_HOME/bin directory or search the ORACLE_BASE path for the

    executable extproc (Unix) or extproc.exe (Windows).

    If external procedure agent is not authorized for use in the system documentation and

    the executable file does not exist or is restricted, this is not a finding.

    If external procedure agent is not authorized for use in the system documentation and

    the executable file exists and is not restricted, this is a finding.

    If use of the external procedure agent is authorized, ensure extproc is restricted to

    execution of authorized applications.

    External jobs are run using the account "nobody" by default.

    Review the contents of the file ORACLE_HOME/rdbms/admin/externaljob.ora for the

    lines run_user= and run_group=.

    If the user assigned to these parameters is not "nobody", this is a finding.

    The external procedure agent (extproc executable) is available directly from the

    database and does not require definition in the listener.ora file for use.

    Review the contents of the file ORACLE_HOME/hs/admin/extproc.ora.

    If the file does not exist, this is a finding.

    If the following entry does not appear in the file, this is a finding:

    EXTPROC_DLLS=ONLY:[dll full file name1]:[dll full file name2]:..

    [dll full file name] represents a full path and file name.

    This list of file names is separated by ":".

    Note: If "ONLY" is specified, then the list is restricted to allow execution of only the DLLs

    specified in the list and is not a finding. If "ANY" is specified, then there are no

    restrictions for execution except what is controlled by operating system permissions and

    is a finding. If no specification is made, any files located in the %ORACLE_HOME%\bin

    directory on Windows systems or $ORACLE_HOME/lib directory on Unix systems can be

    executed (the default) and is a finding.

    Ensure that EXTPROC is not accessible from the listener.

    Review the listener.ora file. If any entries reference "extproc", this is a finding.

    Determine if the external procedure agent is in use per Oracle 10.x conventions.

    Review the listener.ora file.

    If any entries reference "extproc", then the agent is in use.

    If external procedure agent is not authorized for use in the system documentation and

    references to "extproc" exist, this is a finding.

    Sample listener.ora entries with extproc included:

    LISTENER =

    (DESCRIPTION =

    (ADDRESS = (PROTOCOL = TCP)(HOST = 127.0.0.1)(PORT = 1521))

    )

    EXTLSNR =

    (DESCRIPTION =

    (ADDRESS = (PROTOCOL = IPC)(KEY = EXTPROC))

    )

    SID_LIST_LISTENER =

    (SID_LIST =

    (SID_DESC =

    (GLOBAL_DBNAME = ORCL)

    (ORACLE_HOME = /home/oracle/app/oracle/product/19.0/db_1)

    (SID_NAME = ORCL)

    )

    )

    SID_LIST_EXTLSNR =

    (SID_LIST =

    (SID_DESC =

    (PROGRAM = extproc)

    (SID_NAME = PLSExtProc)

    (ORACLE_HOME = /home/oracle/app/oracle/product/19.0/db_1)

    (ENVS="EXTPROC_DLLS=ONLY:/home/app1/app1lib.so:/home/app2/app2lib.so,

    LD_LIBRARY_PATH=/private/app2/lib:/private/app1,

    MYPATH=/usr/fso:/usr/local/packages")

    )

    )

    Sample tnsnames.ora entries with extproc included:

    ORCL =

    (DESCRIPTION =

    (ADDRESS_LIST =

    (ADDRESS = (PROTOCOL = TCP)(HOST = 127.0.0.1)(PORT = 1521))

    )

    (CONNECT_DATA =

    (SERVICE_NAME = ORCL)

    )

    )

    EXTPROC_CONNECTION_DATA =

    (DESCRIPTION =

    (ADDRESS_LIST =

    (ADDRESS = (PROTOCOL = IPC)(KEY = extproc))

    )

    (CONNECT_DATA =

    (SERVER = DEDICATED)

    (SERVICE_NAME = PLSExtProc)

    )

    )

    If EXTPROC is in use, confirm that a listener is dedicated to serving the external

    procedure agent (as shown above).

    View the protocols configured for the listener.

    For the listener to be dedicated, the only entries will be to specify extproc.

    If there is not a dedicated listener in use for the external procedure agent, this is a

    finding.

    If the PROTOCOL= specified is other than IPC, this is a finding.

    Verify and ensure extproc is restricted executing authorized external applications only

    and extproc is restricted to execution of authorized applications.

    Review the listener.ora file.

    If the following entry does not exist, this is a finding:

    EXTPROC_DLLS=ONLY:[dll full file name1]:[dll full file name2]:...

    Note: [dll full file name] represents a full path and file name. This list of file names is

    separated by ":".

    Note: If "ONLY" is specified, then the list is restricted to allow execution of only the DLLs

    specified in the list and is not a finding. If "ANY" is specified, then there are no

    restrictions for execution except what is controlled by operating system permissions and

    is a finding. If no specification is made, any files located in the %ORACLE_HOME%\bin

    directory on Windows systems or $ORACLE_HOME/lib directory on Unix systems can be

    executed (the default) and is a finding.

    View the listener.ora file (usually in ORACLE_HOME/network/admin or directory specified

    by the TNS_ADMIN environment variable).

    If multiple listener processes are running, then the listener.ora file for each must be

    viewed.

    For each process, determine the directory specified in the ORACLE_HOME or TNS_ADMIN

    environment variable defined for the process account to locate the listener.ora file.'
  remediation: 'If use of the external procedure agent is required, then authorize and document the

    requirement in the system documentation.

    If the external procedure agent must be accessible to the Oracle listener, then specify

    this and authorize it in the system documentation.

    If use of the Oracle External Procedure agent is not required:

    1. Stop the Oracle Listener process.

    2. Remove all references to extproc in the listener.ora and tnsnames.ora files.

    3. Alter the permissions on the executable files:

    Unix: Remove read/write/execute permissions from owner, group, and world.

    Windows: Remove Groups/Users from the executable (except groups SYSTEM

    and ADMINISTRATORS) and allow READ [only] for SYSTEM and ADMINISTRATORS

    groups.

    If required:

    1. Restrict extproc execution to only authorized applications.

    2. Specify EXTPROC_DLLS=ONLY: [list of authorized DLLS] in the

    extproc.ora and the listener.ora files.

    3. Create a separate, dedicated listener for use by the external procedure agent.

    Refer to the Oracle Net Services Administrators Guides, External Procedures section

    for detailed configuration information.'
  checks:
  - type: manual_review
    info: 'Review the system documentation to determine if the use of the external procedure

      agent is authorized.

      Review the ORACLE_HOME/bin directory or search the ORACLE_BASE path for the

      executable extproc (Unix) or extproc.exe (Windows).

      If external procedure agent is not authorized for use in the system documentation and

      the executable file does not exist or is restricted, this is not a finding.

      If external procedure agent is not authorized for use in the system documentation and

      the executable file e'
    severity: medium
- id: '1.64'
  title: O19C-00-013500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must be configured to prohibit or restrict the use of organizationdefined functions, ports,
    protocols, and/or services, as defined in the Ports, Protocols, and Services Management Category Assurance List (PPSM
    CAL) and vulnerability assessments. GROUP ID: V-270558 RULE ID: SV-270558r1065283'
  rationale: 'To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports/protocols/services on information systems. Applications are capable of providing a wide variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email
    and web services); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the application must support the organizational requirements providing
    only essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized,
    and approved to conduct official business or to address authorized quality of life issues. Database Management Systems
    using ports, protocols, and services deemed unsafe are open to attack through those ports, protocols, and services. This
    can allow unauthorized access to the database and through the database to other components of the information system.
    Satisfies: SRG-APP-000142-DB-000094, SRG-APP-000383-DB-000364'
  impact: ''
  references: []
  page_start: 164
  audit_raw: 'Review the database management system (DBMS) settings for unapproved functions,

    ports, protocols, and services.

    If any are found, this is a finding.

    For definitive information on PPSM, refer to https://cyber.mil/ppsm/.

    In the Oracle database, the communications with the database and incoming requests

    are performed by the Oracle Listener. The Oracle Listener listens on a specific port or

    ports for connections to a specific database. The Oracle Listener has configuration files

    located in the $ORACLE_HOME/network/admin directory. To check the ports and

    protocols in use, go to that directory and review the SQLNET.ora, LISTENER.ora, and

    the TNSNAMES.ora. If protocols or ports are in use that are not authorized, this is a

    finding.'
  remediation: 'Disable functions, ports, protocols, and services that are not approved.

    Change the SQLNET.ora, LISTENER.ora, and TNSNAMES.ora files to reflect the proper

    use of ports, protocols, and services that are approved at the site.

    If changes to the Listener are made, the files associated with the Listener must be

    reloaded by issuing the following commands at the Unix/Linux or Windows prompt.

    Issue the command to verify what the current status is:

    $ lsnrctl stat

    Load the new file that was corrected to reflect site-specific requirements:

    $ lsnrctl reload

    Check the status again to verify that the changes have taken place:

    $ lsnrctl stat'
  checks:
  - type: manual_review
    info: 'Review the database management system (DBMS) settings for unapproved functions,

      ports, protocols, and services.

      If any are found, this is a finding.

      For definitive information on PPSM, refer to https://cyber.mil/ppsm/.

      In the Oracle database, the communications with the database and incoming requests

      are performed by the Oracle Listener. The Oracle Listener listens on a specific port or

      ports for connections to a specific database. The Oracle Listener has configuration files

      located in the $ORAC'
    severity: medium
- id: '1.65'
  title: O19C-00-013700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must ensure users are authenticated with an individual authenticator prior to using a shared
    authenticator. GROUP ID: V-270559 RULE ID: SV-270559r1068298'
  rationale: To assure individual accountability and prevent unauthorized access, application users (and any processes acting
    on behalf of users) must be individually identified and authenticated. A shared authenticator is a generic account used
    by multiple individuals. Use of a shared authenticator alone does not uniquely identify individual users. An example of
    a shared authenticator is the Unix OS "root" user account, a Windows "administrator" account, a "SA" account, or a "helpdesk"
    account. For example, the Unix and Windows operating systems offer a "switch user" capability allowing users to authenticate
    with their individual credentials and, when needed, switch to the administrator role. This method provides for unique
    individual authentication prior to using a shared authenticator. Some applications may not have the need to provide a
    group authenticator; this is considered a matter of application design. In those instances where the application design
    includes the use of a shared authenticator, this requirement will apply. There may also be instances when specific user
    actions need to be performed on the information system without unique user identification or authentication. An example
    of this type of access is a web server which contains publicly releasable information. These types of accesses are allowed
    but must be explicitly identified and documented by the organization. When shared accounts are used without another means
    of identifying individual users, users may deny having performed a particular action. Oracle Access Manager may be helpful
    in meeting this requirement. Oracle Access Manager is used when there is a need for multifactor authentication of applications
    front-ending Oracle Datasets that may use group accounts. Oracle Access Manager supports using PKI-based smart cards (CAC,
    PIV) for multifactor authentication. When a user authenticates to a smart card application, the smart card engine produces
    a certificate-based authentication token. Can configure a certificatebased authentication scheme in Oracle Access Manager
    that uses information from the smart card certificate. Certificate-based authentication works with any smart card or similar
    device that presents an X.509 certificate.
  impact: ''
  references: []
  page_start: 166
  audit_raw: 'Review database management system (DBMS) settings, OS settings, and/or enterpriselevel authentication/access
    mechanism settings to determine whether shared accounts

    exist. If shared accounts do not exist, this is Not Applicable.

    Review DBMS settings to determine if individual authentication is required before

    shared authentication.

    If shared authentication does not require prior individual authentication, this is a finding.

    If using Oracle Access Manager:

    Verify the Authentication Module is set up properly:

    1. Go to the Oracle Access Manager Home Screen and click the Policy

    Configuration tab. Select the X509Scheme.

    2. Ensure the Authentication Module option is set to X509Plugin.

    Verify the Authentication policy is using the x509Scheme:

    1. Go to Oracle Access Manager Home Screen and click the Policy Configuration

    tab.

    2. Select Application Domains. Select Search.

    3. Select the application domain protecting the Oracle Database.

    4. Select the Authentication Policies tab and click Protected Resource Policy.

    5. Make sure the Authentication Scheme is set to x509Scheme.'
  remediation: 'Configure the DBMS, OS, and/or enterprise-level authentication/access mechanism to

    require individual authentication prior to authentication for shared account access.

    If appropriate, install Oracle Access Manager to provide multifactor authentication of

    applications front-ending Oracle Databases and using shared accounts. After

    installation, use x509 Authentication modules provided out of the box.'
  checks:
  - type: manual_review
    info: 'Review database management system (DBMS) settings, OS settings, and/or enterpriselevel authentication/access mechanism
      settings to determine whether shared accounts

      exist. If shared accounts do not exist, this is Not Applicable.

      Review DBMS settings to determine if individual authentication is required before

      shared authentication.

      If shared authentication does not require prior individual authentication, this is a finding.

      If using Oracle Access Manager:

      Verify the Authentication Module is set '
    severity: medium
- id: '1.66'
  title: O19C-00-013800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must uniquely identify and authenticate organizational users (or processes acting on behalf
    of organizational users). GROUP ID: V-270560 RULE ID: SV-270560r1065286'
  rationale: To ensure accountability and prevent unauthorized access, organizational users must be identified and authenticated.
    Organizational users include organizational employees or individuals the organization deems to have equivalent status
    of employees (e.g., contractors, guest researchers, individuals from allied nations). Users (and any processes acting
    on behalf of users) are uniquely identified and authenticated for all accesses other than those accesses explicitly identified
    and documented by the organization which outlines specific user actions that can be performed on the information system
    without identification or authentication.
  impact: ''
  references: []
  page_start: 169
  audit_raw: 'Review database management system (DBMS) settings, OS settings, and/or enterpriselevel authentication/access
    mechanism settings, and site practices, to determine

    whether organizational users are uniquely identified and authenticated when logging on

    to the system.

    If organizational users are not uniquely identified and authenticated, this is a finding.'
  remediation: 'Configure the DBMS, OS, and/or enterprise-level authentication/access mechanism to

    uniquely identify and authenticate all organizational users who log on to the system.

    Ensure that each user has a separate account from all other users.'
  checks:
  - type: manual_review
    info: 'Review database management system (DBMS) settings, OS settings, and/or enterpriselevel authentication/access mechanism
      settings, and site practices, to determine

      whether organizational users are uniquely identified and authenticated when logging on

      to the system.

      If organizational users are not uniquely identified and authenticated, this is a finding.'
    severity: medium
- id: '1.67'
  title: O19C-00-013900
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must enforce the DOD standards for password complexity. GROUP ID: V-270561 RULE ID: SV-270561r1112485'
  rationale: OS/enterprise authentication and identification must be used (SRG-APP-000023-DB000001). Native database management
    system (DBMS) authentication may be used only when circumstances make it unavoidable; and must be documented and authorizing
    official (AO)-approved. The DOD standard for authentication is DOD-approved PKI certificates. Authentication based on
    User ID and Password may be used only when it is not possible to employ a PKI certificate and requires AO approval. In
    such cases, the DOD standards for password complexity and lifetime must be implemented. DBMS products that can inherit
    the rules for these from the operating system or access control program (e.g., Microsoft Active Directory) must be configured
    to do so. For other DBMSs, the rules must be enforced using available configuration parameters or custom code. Note that
    user authentication and account management must be done via an enterprisewide mechanism whenever possible. Examples of
    enterprise-level authentication/access mechanisms include, but are not limited to, Active Directory and LDAP. This requirement
    applies to cases where it is necessary to have accounts directly managed by Oracle.
  impact: ''
  references: []
  page_start: 171
  audit_raw: 'If all user accounts are authenticated by the OS or an enterprise-level

    authentication/access mechanism and not by Oracle, this is not a finding.

    For each profile that can be applied to accounts where authentication is under Oracle''s

    control, determine the password verification function that is in use:

    SELECT * FROM SYS.DBA_PROFILES

    WHERE RESOURCE_NAME = ''PASSWORD_VERIFY_FUNCTION''

    ORDER BY PROFILE;

    Note: Profiles can inherit settings from another profile so some password functions

    could be set to DEFAULT. If so, review the DEFAULT profile function name.

    If the function name is null for any profile, this is a finding.

    Review the password verification functions specified for the

    PASSWORD_VERIFY_FUNCTION settings for each profile. Determine whether the following

    rules are enforced by the code in those functions.

    a. Minimum of 15 characters, including at least one of each of the following character

    sets:

    • Uppercase

    • Lowercase

    • Numeric

    • Special characters (e.g., ~ ! @ # $ % ^ & * ( ) _ + = - '' [ ] / ? > <)

    b. Minimum number of characters changed from previous password: 50 percent of the

    minimum password length; that is, eight.

    If any of the above password requirements are not included in the function, this is a

    finding.'
  remediation: 'If all user accounts are authenticated by the OS or an enterprise-level

    authentication/access mechanism, and not by Oracle, no fix to the DBMS is required.

    If any user accounts are managed by Oracle, develop, test, and implement a password

    verification function that enforces DOD requirements.

    Oracle supplies a sample function called ORA12C_STIG_VERIFY_FUNCTION. This can be

    used as the starting point for a customized function. The script file is found in the

    following location on the server depending on OS:

    Windows:

    %ORACLE_HOME%\RDBMS\ADMIN\catpvf.sql

    Unix/Linux:

    $ORACLE_HOME/rdbms/admin/catpvf.sql'
  checks:
  - type: sql
    command: SELECT * FROM SYS.DBA_PROFILES
    severity: medium
    info: 'If all user accounts are authenticated by the OS or an enterprise-level

      authentication/access mechanism and not by Oracle, this is not a finding.

      For each profile that can be applied to accounts where authentication is under Oracle''s

      control, determine the password verification function that is in use:

      SELECT * FROM SYS.DBA_PROFILES

      WHERE RESOURCE_NAME = ''PASSWORD_VERIFY_FUNCTION''

      ORDER BY PROFILE'
- id: '1.68'
  title: O19C-00-014600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Procedures for establishing temporary passwords that meet DOD password requirements for new accounts must
    be defined, documented, and implemented. GROUP ID: V-270562 RULE ID: SV-270562r1064964'
  rationale: Password maximum lifetime is the maximum period of time, (typically in days) a user's password may be in effect
    before the user is forced to change it. Passwords need to be changed at specific policy-based intervals as per policy.
    Any password, no matter how complex, can eventually be cracked. One method of minimizing this risk is to use complex passwords
    and periodically change them. If the application does not limit the lifetime of passwords and force users to change their
    passwords, there is the risk that the system and/or application passwords could be compromised. New accounts authenticated
    by passwords that are created without a password or with an easily guessed password are vulnerable to unauthorized access.
    Procedures for creating new accounts with passwords should include the required assignment of a temporary password to
    be modified by the user upon first use. Note that user authentication and account management must be done via an enterprisewide
    mechanism whenever possible. Examples of enterprise-level authentication/access mechanisms include, but are not limited
    to, Active Directory and LDAP With respect to Oracle, this requirement applies to cases where it is necessary to have
    accounts directly managed by Oracle.
  impact: ''
  references: []
  page_start: 173
  audit_raw: 'If all user accounts are authenticated by the OS or an enterprise-level

    authentication/access mechanism, and not by Oracle, this is not a finding.

    Where accounts are authenticated using passwords, review procedures and

    implementation evidence for creation of temporary passwords.

    If the procedures or evidence do not exist or do not enforce passwords to meet DOD

