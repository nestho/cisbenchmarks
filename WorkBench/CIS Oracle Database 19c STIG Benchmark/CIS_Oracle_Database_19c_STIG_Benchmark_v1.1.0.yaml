- id: '1.57'
  title: O19C-00-012500
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must disable user accounts after 35 days of inactivity. GROUP ID: V-270551 RULE ID: SV-270551r1112483'
  rationale: Attackers that are able to exploit an inactive database management system (DBMS) account can potentially obtain
    and maintain undetected access to the database. Owners of inactive DBMS accounts will not notice if unauthorized access
    to their user account has been obtained. All DBMS need to track periods of user inactivity and disable accounts after
    35 days of inactivity. Such a process greatly reduces the risk that accounts will be hijacked, leading to a data compromise.
    To address access requirements, some database administrators choose to integrate their databases with enterprise-level
    authentication/access mechanisms that meet or exceed access control policy requirements. Such integration allows the database
    administrator to off-load those access control functions and focus on core application features and functionality. This
    policy does not apply to either emergency accounts or infrequently used accounts. Infrequently used accounts are local
    logon administrator accounts used by system administrators when network or normal logon/access is not available. Emergency
    accounts are administrator accounts created in response to crisis situations. Note that user authentication and account
    management must be done via an enterprisewide mechanism whenever possible. Examples of enterprise-level authentication/access
    mechanisms include, but are not limited to, Active Directory and LDAP. This requirement applies to cases where it is necessary
    to have accounts directly managed by Oracle.
  impact: ''
  references: []
  page_start: 145
  audit_raw: 'If all user accounts are managed and authenticated by the OS or an enterprise-level

    authentication/access mechanism, and not by Oracle, this is not a finding.

    For accounts managed by Oracle, check DBMS settings to determine if accounts are

    automatically disabled by the system after 35 days of inactivity.

    In Oracle 12c, Oracle introduced a new security parameter in the profile called

    INACTIVE_ACCOUNT_TIME. This parameter specifies the number of days permitted the

    account will be in OPEN state since the last login, after that will be LOCKED if no

    successful logins happens after the specified duration.

    Check to verify what profile each user is associated with, if any, with this query:

    select username, profile

    from dba_users

    order by 1,2;

    Then, check the profile to verify what the inactive_account_time is set to in the table

    dba_profiles; the inactive_account_time is a value stored in the LIMIT column,

    and identified by the value inactive_account_time in the RESOURCE_NAME column.

    SQL>select profile, resource_name, resource_type, limit from dba_profiles

    where upper(resource_name) = ''INACTIVE_ACCOUNT_TIME'';

    If the INACTIVE_ACCOUNT_TIME parameter is set to UNLIMITED (default) or it is set to

    more than 35 days, this is a finding.

    If INACTIVE_ACCOUNT_TIME is not a parameter associated with the profile, then check

    for a script or an automated job that is run daily that checks the audit trail or to ensure

    every user account has logged in within the last 35 days. If one is not present, this is a

    finding.'
  remediation: 'For accounts managed by Oracle, issue the statement:

    ALTER PROFILE profile_name LIMIT inactive_account_time 35;

    Or

    Change the profile for the DBMS account to ORA_STIG_PROFILE (which has the

    inactive_account_time parameter set to 35):

    ALTER USER user_name PROFILE ora_stig_profile;

    An alternate method is to create a script or store procedure that runs once a day.

    Write a SQL statement to determine accounts that have not logged in within 35 days:

    Example:

    select username

    from dba_audit_trail

    where action_name = ''LOGON''

    group by username having max(timestamp) < sysdate - 36

    Then, disable all accounts that have not logged in within 35 days.'
  checks:
  - type: sql
    command: select username, profile
    severity: medium
    info: 'If all user accounts are managed and authenticated by the OS or an enterprise-level

      authentication/access mechanism, and not by Oracle, this is not a finding.

      For accounts managed by Oracle, check DBMS settings to determine if accounts are

      automatically disabled by the system after 35 days of inactivity.

      In Oracle 12c, Oracle introduced a new security parameter in the profile called

      INACTIVE_ACCOU'
- id: '1.58'
  title: O19C-00-012900
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database default demonstration and sample databases, database objects, and applications must be removed.
    GROUP ID: V-270552 RULE ID: SV-270552r1064934'
  rationale: Information systems are capable of providing a wide variety of functions and services. Some of the functions
    and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). It is detrimental for applications to provide, or install by default, functionality exceeding requirements
    or mission objectives. Examples include, but are not limited to, installing advertising software, demonstrations, or browser
    plugins not related to requirements or providing a wide array of functionality not required for the mission. Applications
    must adhere to the principles of least functionality by providing only essential capabilities. Demonstration and sample
    database objects and applications present publicly known attack points for malicious users. These demonstration and sample
    objects are meant to provide simple examples of coding specific functions and are not developed to prevent vulnerabilities
    from being introduced to the database management system (DBMS) and host system.
  impact: ''
  references: []
  page_start: 148
  audit_raw: 'If Oracle is hosted on a server that does not support production systems, and is

    designated for the deployment of samples and demonstrations, this is Not Applicable.

    Review documentation and websites from Oracle and any other relevant vendors for

    vendor-provided demonstration or sample databases, database applications, schemas,

    objects, and files.

    Review the Oracle DBMS to determine if any of the demonstration and sample

    databases, schemas, database applications, or files are installed in the database or are

    included with the DBMS application. If any are present in the database or are included

    with the DBMS application, this is a finding.

    The Oracle Default Sample Schema User Accounts are:

    BI: Owns the Business Intelligence schema included in the Oracle Sample Schemas.

    HR: Manages the Human Resources schema. Schema stores information about the

    employees and the facilities of the company.

    OE: Manages the Order Entry schema. Schema stores product inventories and sales of

    the company''s products through various channels.

    PM: Manages the Product Media schema. Schema contains descriptions and detailed

    information about each product sold by the company.

    IX: Manages the Information Exchange schema. Schema manages shipping through

    business-to-business (B2B) applications database.

    SH: Manages the Sales schema. Schema stores statistics to facilitate business

    decisions.

    SCOTT: A demonstration account with a simple schema.

    Connect to Oracle as SYSDBA and run the following SQL to check for presence of Oracle

    Default Sample Schema User Accounts:

    select distinct(username)

    from dba_users

    where username in

    (''BI'',''HR'',''OE'',''PM'',''IX'',''SH'',''SCOTT'');

    If any of the users listed above is returned, it means that there are demo programs

    installed, and this is a finding.'
  remediation: 'Remove any demonstration and sample databases, database applications, objects, and

    files from the DBMS.

    To remove an account and all objects owned by that account (using BI as an example):

    DROP USER BI CASCADE;

    To remove objects without removing their owner, use the appropriate DROP statement

    (DROP TABLE, DROP VIEW, etc.).'
