      FROM sys.v_$parameter

      WHERE vp.name = ''remote_os_roles''

      ORDER BY 1;

      If the PARAMETER_VALUE is not FALSE, that is a finding.

      If using a CDB database:

      From SQL*Plus (in t'
- id: '1.31'
  title: O19C-00-009300
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle SQL92_SECURITY parameter must be set to TRUE. GROUP ID: V-270525 RULE ID: SV-270525r1112473'
  rationale: 'The configuration option SQL92_SECURITY specifies whether table-level SELECT privileges are required to execute
    an update or delete those references table column values. If this option is disabled (set to FALSE), the UPDATE privilege
    can be used to determine values that should require SELECT privileges. The SQL92_SECURITY setting of TRUE prevents the
    exploitation of user credentials with only DELETE or UPDATE privileges on a table from being able to derive column values
    in that table by performing a series of update/delete statements using a where clause, and rolling back the change. In
    the following example, with SQL92_SECURITY set to FALSE, a user with only delete privilege on the scott.emp table is able
    to derive that there is one employee with a salary greater than 3000. With SQL92_SECURITY set to TRUE, that user is prevented
    from attempting to derive a value. SQL92_SECURITY = FALSE SQL> delete from scott.emp where sal > 3000; 1 row deleted SQL>
    rollback; Rollback complete SQL92_SECURITY = TRUE SQL> delete from scott.emp where sal > 3000; delete from scott.emp where
    sal > 3000 * ERROR at line 1: ORA-01031: insufficient privileges'
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'To verify the current status of the SQL92_SECURITY parameter use the SQL statement:

    If using a non-CDB database: From SQL*Plus:

    select value

    from v$parameter

    where name = ''sql92_security'';

    If using a CDB database: From SQL*Plus:

    column name format a20

    column parameter_value format a20

    SELECT name, inst_id, con_id, value AS PARAMETER_VALUE

    FROM sys.gv_$parameter

    WHERE name = ''sql92_security''

    ORDER BY 1;

    Check Result:

    The CDB database and all PDBs must be checked.

    If the value returned is set to FALSE, this is a finding.

    If the parameter is set to TRUE or does not exist, this is not a finding.

    In any instance or container, if the PARAMETER_VALUE is not TRUE, that is a finding.'
  remediation: 'Enable SQL92 security.

    From SQL*Plus:

    alter system set sql92_security = TRUE scope = spfile;

    The above SQL*Plus command will set the parameter to take effect at next system

    startup.'
  checks:
  - type: sql
    command: select value
    severity: medium
    info: 'To verify the current status of the SQL92_SECURITY parameter use the SQL statement:

      If using a non-CDB database: From SQL*Plus:

      select value

      from v$parameter

