  references: []
  page_start: 152
  audit_raw: 'Run this query to check to verify what integrated components are installed in the

    database:

    SELECT parameter, value

    from v$option

    where parameter in

    (

    ''Data Mining'',

    ''Oracle Database Extensions for .NET'',

    ''OLAP'',

    ''Partitioning'',

    ''Real Application Testing''

    );

    This will return all of the relevant database options and their status. TRUE means that

    the option is installed. If the option is not installed, the option will be set to FALSE.

    Review the options and check the system documentation to verify what is required. If all

    listed components are authorized to be in use, this is not a finding.

    If any unused components or features are listed by the query as TRUE, this is a finding.'
  remediation: 'In the system documentation list the integrated components required for operation of

    applications that will be accessing the DBMS.

    For Oracle Database 12.1 and higher, only the following components can be

    enabled/disabled:

    Oracle Data Mining (dm)

    Oracle Database Extensions for .NET (ode_net)

    Oracle OLAP (olap)

    Oracle Partitioning (partitioning)

    Real Application Testing (rat)

    Use the chopt utility (an Oracle-supplied operating system command that resides in the

    <Oracle Home path>/bin directory) to disable each option that should not be

    available. The command format is

    chopt <enable|disable> <option>

    where is any of the abbreviations in parentheses in the list above. For example, to

    disable Real Application Testing, issue the following command at an OS prompt:

    chopt disable rat

    Restart the Oracle service.

    Refer to My Oracle Support Document 948061.1 for more on the chopt command.'
