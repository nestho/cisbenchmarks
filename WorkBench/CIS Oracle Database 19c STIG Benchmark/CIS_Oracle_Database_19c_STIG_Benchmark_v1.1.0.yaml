    after the "/" is the left most number of bits in the address that must match for the rule to

    apply.'
  remediation: 'Configure the database listener to restrict access by IP address or set up an external

    device to restrict network access to the DBMS.

    More information can be found at https://docs.oracle.com/en/database/oracle/oracledatabase/19/netrf/parameters-for-the-sqlnet.ora.html#GUID-5C3AB641-7541-4CE9BC9E-BA5DD30616A8.'
