  title: O19C-00-019900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must, for password-based authentication, require immediate selection of a new password upon
    account recovery. GROUP ID: V-270588 RULE ID: SV-270588r1065042'
  rationale: Password-based authentication applies to passwords regardless of whether they are used in single-factor or multifactor
    authentication (MFA). Long passwords or passphrases are preferable over shorter passwords. Enforced composition rules
    provide marginal security benefits while decreasing usability. However, organizations may choose to establish certain
    rules for password generation (e.g., minimum character length for long passwords) under certain circumstances and can
    enforce this requirement in IA-5(1)(h). Account recovery can occur, for example, in situations when a password is forgotten.
    Cryptographically protected passwords include salted one-way cryptographic hashes of passwords. The list of commonly used,
    compromised, or expected passwords includes passwords obtained from previous breach corpuses, dictionary words, and repetitive
    or sequential characters. The list includes contextspecific words, such as the name of the service, username, and derivatives
    thereof.
  impact: ''
  references: []
  page_start: 235
  audit_raw: 'Verify the database management system (DBMS) is configured to require immediate

    selection of a new password upon account recovery.

    All scripts, functions, triggers, and stored procedures that are used to create a user or

    reset a user''s password should include a line similar to the following: alter user

    password expire;

    If they do not, this is a finding.

    If the DBMS is not configured to require immediate selection of a new password upon

    account recovery, this is a finding.'
  remediation: 'Configure the DBMS to require immediate selection of a new password upon account

    recovery.

    One way to configure this is to ensure that all scripts, functions, triggers, and stored

    procedures that are used to create a user or reset a user''s password should include a

    line similar to the following: alter user password expire;'
  checks:
  - type: manual_review
    info: 'Verify the database management system (DBMS) is configured to require immediate

      selection of a new password upon account recovery.

      All scripts, functions, triggers, and stored procedures that are used to create a user or

      reset a user''s password should include a line similar to the following: alter user

      password expire;

      If they do not, this is a finding.

      If the DBMS is not configured to require immediate selection of a new password upon

      account recovery, this is a finding.'
    severity: medium
- id: '1.94'
  title: O19C-00-020400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must include only approved trust anchors in trust stores or certificate stores managed by
    the organization. GROUP ID: V-270589 RULE ID: SV-270589r1136927'
  rationale: Public key infrastructure (PKI) certificates are certificates with visibility external to organizational systems
    and certificates related to the internal operations of systems, such as application-specific time services. In cryptographic
    systems with a hierarchical structure, a trust anchor is an authoritative source (i.e., a certificate authority) for which
    trust is assumed and not derived. A root certificate for a PKI system is an example of a trust anchor. A trust store or
    certificate store maintains a list of trusted root certificates.
  impact: ''
  references: []
  page_start: 237
  audit_raw: 'If all accounts are authenticated by the OS or an enterprise-level authentication/access

    mechanism and not by Oracle, this is not a finding.

    Verify the database management system (DBMS) is configured to include only

    approved trust anchors in trust stores or certificate stores managed by the organization.

    If trust stores or certification paths are not being validated back to a trust anchor, this is

    a finding.

    The database supports PKI-based authentication by using digital certificates over

    Transport Layer Security (TLS) in addition to the native encryption and data integrity

    capabilities of these protocols.

    Oracle provides a complete PKI that is based on RSA Security, Inc., Public-Key

    Cryptography Standards, and interoperates with Oracle servers and clients. The

    database uses a wallet that is a container to store authentication and signing

    credentials, including private keys, certificates, and trusted certificates needed by TLS.

    In an Oracle environment, every entity that communicates over TLS must have a wallet

    containing an X.509 version 3 certificate, private key, and list of trusted certificates.

    If the $ORACLE_HOME/network/admin/sqlnet.ora contains the following entries, TLS

    is installed.

    WALLET_LOCATION = (SOURCE=

    (METHOD = FILE)

    (METHOD_DATA =

    DIRECTORY=/wallet)

    SSL_CIPHER_SUITES=(SSL_cipher_suiteExample)

    SSL_VERSION = 1.1 or 1.2

    SSL_CLIENT_AUTHENTICATION=TRUE'
  remediation: 'Configure the DBMS to include only approved trust anchors in trust stores or certificate

    stores managed by the organization.

    Configure the database to support TLS protocols and the Oracle Wallet to store

    authentication and signing credentials, including private keys.'
  checks:
  - type: manual_review
    info: 'If all accounts are authenticated by the OS or an enterprise-level authentication/access

      mechanism and not by Oracle, this is not a finding.

      Verify the database management system (DBMS) is configured to include only

      approved trust anchors in trust stores or certificate stores managed by the organization.

      If trust stores or certification paths are not being validated back to a trust anchor, this is

      a finding.

      The database supports PKI-based authentication by using digital certificates over

      Transp'
    severity: medium
- id: '1.95'
  title: O19C-00-020500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'A minimum of three Oracle Control Files must be created and each stored on a separate physical and logical
    device. GROUP ID: V-275999 RULE ID: SV-275999r1115962'
  rationale: Oracle control files store information critical to Oracle database integrity. Oracle uses these files to maintain
    time synchronization of database files and verify the validity of system data and log files at system startup. Loss of
    access to the control files can affect database availability, integrity, and recovery. Oracle Pluggable Databases (PDBs)
    do not contain their own control files; instead, all PDBs within a Container Database (CDB) share control files managed
    by the CDB.
  impact: ''
  references: []
  page_start: 239
  audit_raw: 'Use the SQL statement below to obtain information on each currently existing Control

    File:

    SELECT name

    FROM sys.v$controlfile

    ORDER BY 1;

    Oracle Best Practice: Oracle recommends a minimum of three Oracle Control Files and

    each stored on a separate physical and logical device (RAID 1 + 0).

    DOD guidance recommends: Each control file must be located on a separate physical

    and logical (virtual) storage device.

    Consult with the storage administrator, system administrator, or database administrator

    to determine whether the mount points or partitions referenced in the file paths indicate

    separate physical disks or directories on RAID devices.

    Note: Distinct does not equal dedicated. May share directory space with other Oracle

    database instances if present.

    If the minimum of three control files is not met, this is a finding.'
  remediation: 'To prevent loss of service during disk failure, multiple copies of Oracle control files must

    be maintained on separate disks in archived directories or on separate, archived

    directories within one or more RAID devices.

    Adding or moving a control file requires careful planning and execution.

    Consult and follow the instructions for creating control files in the Oracle Database

    Administrator''s Guide, under Steps for Creating New Control Files.'
  checks:
  - type: sql
    command: SELECT name
    severity: medium
    info: 'Use the SQL statement below to obtain information on each currently existing Control

      File:

      SELECT name

      FROM sys.v$controlfile

      ORDER BY 1;

