    command: SELECT COUNT(*)
    severity: medium
    info: 'Review the system documentation to identify additional site-specific information not

      covered by the default audit options, the organization has determined to be necessary.

      If there are none, this is not a finding.

      If any additional information is defined, compare those auditable events that are not

      covered by unified auditing with the existing Fine-Grained Auditing (FGA) specifications

      returned by'
- id: '1.12'
  title: O19C-00-005700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must allocate audit record storage capacity in accordance with organization-defined audit
    record storage requirements. GROUP ID: V-270506 RULE ID: SV-270506r1167744'
  rationale: 'To ensure sufficient storage capacity for the audit logs, Oracle Database must be able to allocate audit record
    storage capacity. Although another requirement (SRG-APP000515-DB-000318) mandates audit data be off-loaded to a centralized
    log management system, it remains necessary to provide space on the database server to serve as a buffer against outages
    and capacity limits of the off-loading mechanism. The task of allocating audit record storage capacity is usually performed
    during initial installation of the database management system (DBMS) and is closely associated with the database administrator
    (DBA) and system administrator roles. The DBA or system administrator will usually coordinate the allocation of physical
    drive space with the application owner/installer and the application will prompt the installer to provide the capacity
    information, the physical location of the disk, or both. In determining the capacity requirements, consider such factors
    as: total number of users; expected number of concurrent users during busy periods; number and type of events being monitored;
    types and amounts of data being captured; the frequency/speed with which audit records are off-loaded to the central log
    management system; and any limitations that exist on the DBMS''s ability to reuse the space formerly occupied by off-loaded
    records.'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Review the DBMS settings to determine whether audit logging is configured to produce

    logs consistent with the amount of space allocated for logging. If auditing will generate

    excessive logs so that they may outgrow the space reserved for logging, this is a

    finding.

    If file-based auditing is in use, check that sufficient space is available to support the

    file(s). If not, this is a finding.

    If standard, table-based auditing is used, the audit logs are written to a table called

    AUD$; and if a Virtual Private Database is deployed, a table is created called FGA_LOG$.

    sqlplus connect as sysdba

    SELECT table_name, tablespace_name

    FROM dba_tables

    WHERE table_name IN (''AUD$'')

    ORDER BY table_name;

    TABLE_NAME TABLESPACE_NAME

    ----------------------------- ------------------------------

    AUD$ SYSTEM

    The AUD$ table should be in its own tablespace. If the tablespace name is SYSTEM, this

    is a finding.

    Check the current location of the audit trail tables:

    SELECT inst_id, con_id, name, value

    FROM sys.gv_$parameter

    WHERE name IN (''audit_file_dest'', ''unified_audit_systemlog'');

    Verify adequate space is allocated for the audit trail location.

    If Unified Auditing is used:

    Audit logs are written to tables in the AUDSYS schema. The default tablespace for

    AUDSYS is USERS, and it should be in its own tablespace.

    If the tablespace name is USERS, this is a finding.

    Investigate whether there have been any incidents where the DBMS ran out of audit log

    space since the last time the space was allocated or other corrective measures were

    taken. If there have been, this is a finding.'
  remediation: 'Allocate sufficient audit file/table space to support peak demand.

    If audit records are being written to the table sys.aud$, create a new tablespace

    dedicated to the AUD$ table and move AUD$ using the statement below:

    exec sys.dbms_audit_mgmt.move_dbaudit_tables(''<tablespace_name>'');

    Ensure that audit tables are in their own tablespaces and that the tablespaces have

    enough room for the volume of log data that will be produced.

    Detailed procedures for how to alter the tablespace for audit logs can be found here:

    https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/ALTERTABLESPACE.html.'
  checks:
  - type: sql
    command: SELECT table_name, tablespace_name
    severity: medium
    info: 'Review the DBMS settings to determine whether audit logging is configured to produce

      logs consistent with the amount of space allocated for logging. If auditing will generate

      excessive logs so that they may outgrow the space reserved for logging, this is a

      finding.

      If file-based auditing is in use, check that sufficient space is available to support the

      file(s). If not, this is a finding.

      If stand'
- id: '1.13'
  title: O19C-00-005800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must off-load audit data to a separate log management facility; this must be continuous and
    in near-real-time for systems with a network connection to the storage facility, and weekly or more often for stand-alone
    systems. GROUP ID: V-270507 RULE ID: SV-270507r1065200'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. The database management system (DBMS)
    may write audit records to database tables, files in the file system, other kinds of local repositories, or a centralized
    log management system. Whatever the method used, it must be compatible with off-loading the records to the centralized
    system.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'Review the system documentation for a description of how audit records are off-loaded.

    If there is no centralized audit log management system, for the audit data to be written

    to, this is a finding.

    If the DBMS has a continuous network connection to the centralized log management

    system, but the DBMS audit records are not written directly to the centralized log

    management system or transferred in near-real-time, this is a finding.

    If the DBMS does not have a continuous network connection to the centralized log

    management system, and the DBMS audit records are not transferred to the centralized

    log management system weekly or more often, this is a finding.'
  remediation: 'Configure the DBMS or deploy and configure software tools to transfer audit records to

    a centralized log management system, continuously and in near-real-time where a

    continuous network connection to the log management system exists, or at least weekly

    in the absence of such a connection.

    Consider deploying the Oracle Audit Vault, which is Oracle''s centralized audit log

    management system. Oracle Audit Vault is a powerful enterprise-wide audit solution

    that provides centralized location and configuration of audit information that is captured

    in audit records which are generated by all databases including Oracle, or other

    databases (SQL Server, MySQL, etc.), and various components of the DBMS, as well

    as, operating systems, file systems, directory services, or custom audit data in either

    database tables or XML files.

    Oracle Audit Vault consumes audit data from databases, which may be automatically

    purged from the target database after it has been moved to the Oracle Audit Vault

    Server, freeing up valuable space for business data. Oracle Audit Vault Server supports

    data retention policies on a per source basis, making it possible to meet internal or

    external compliance requirements. To prevent unauthorized access or tampering,

    Oracle Audit Vault encrypts audit and event data at every stage, in transmission and at

    rest. For Oracle Databases, Oracle Audit Vault can track changes to data, user

    entitlements, and stored procedures. Historical tracking of important data attributes

    allows users to quickly report on the lifecycle of a data attribute. User entitlements

    tracking enables easy reporting on which users have what privileges, along with

    differential reporting on what has changed since the last report. Maliciously modified

    stored procedures are a frequent vector for data theft-stored procedure tracking helps

    users quickly spot changes. With support for Oracle''s unified audit, it is easy to

    implement best practices for auditing using preseeded audit policies.'
  checks:
  - type: manual_review
    info: 'Review the system documentation for a description of how audit records are off-loaded.

      If there is no centralized audit log management system, for the audit data to be written

      to, this is a finding.

      If the DBMS has a continuous network connection to the centralized log management

      system, but the DBMS audit records are not written directly to the centralized log

      management system or transferred in near-real-time, this is a finding.

      If the DBMS does not have a continuous network connection to the '
    severity: medium
- id: '1.14'
  title: O19C-00-005900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Database, or the logging or alerting mechanism the application uses, must provide a warning when
    allocated audit record storage volume record storage volume reaches 75 percent of maximum audit record storage capacity.
    GROUP ID: V-270508 RULE ID: SV-270508r1065201'
  rationale: Organizations are required to use a central log management system, so, under normal conditions, the audit space
    allocated to the database management system (DBMS) on its own server will not be an issue. However, space will still be
    required on the DBMS server for audit records in transit, and, under abnormal conditions, this could fill up. Since a
    requirement exists to halt processing upon audit failure, a service outage would result. If support personnel are not
    notified immediately upon storage volume usage reaching 75 percent, they are unable to plan for storage capacity expansion.
    The appropriate support staff include, at a minimum, the information system security officer (ISSO) and the database administrator
    (DBA)/system administrator (SA).
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'Review OS or third-party logging application settings to determine whether a warning

    will be provided when 75 percent of DBMS audit log storage capacity is reached.

    If no warning will be provided, this is a finding.'
  remediation: 'Modify DBMS, OS, or third-party logging application settings to alert appropriate

    personnel when 75 percent of log storage capacity is reached.

    For ease of management, it is recommended that the audit tables be kept in a dedicated

    tablespace.

    If Oracle Enterprise Manager is in use, the capability to issue such an alert is built in

    and configurable via the console so an email can be sent to a designated administrator.

    If Enterprise Manager is unavailable, the following script can be used to monitor storage

    space; this can be combined with additional code to email the appropriate administrator

    so they can take action.

    sqlplus connect as sysdba

    set pagesize 300

    set linesize 120

    column sumb format 9,999,999,999,999

    column extents format 999999

    column bytes format 9,999,999,999,999

    column largest format 9,999,999,999,999

    column Tot_Size format 9,999,999,999,999

    column Tot_Free format 9,999,999,999,999

    column Pct_Free format 9,999,999,999,999

    column Chunks_Free format 9,999,999,999,999

    column Max_Free format 9,999,999,999,999

    set echo off

    spool TSINFO.txt

    PROMPT SPACE AVAILABLE IN TABLESPACES

    select a.tablespace_name,sum(a.tots) Tot_Size,

    sum(a.sumb) Tot_Free,

    sum(a.sumb)*100/sum(a.tots) Pct_Free,

    sum(a.largest) Max_Free,sum(a.chunks) Chunks_Free

    from

    (

    select tablespace_name,0 tots,sum(bytes) sumb,

    max(bytes) largest,count(*) chunks

    from dba_free_space a

    group by tablespace_name

    union

    select tablespace_name,sum(bytes) tots,0,0,0 from

    dba_data_files

    group by tablespace_name) a

    group by a.tablespace_name;

    Sample Output

    SPACE AVAILABLE IN TABLESPACES

    TABLESPACE_NAME TOT_SIZE TOT_FREE PCT_FREE MAX_FREE

    CHUNKS_FREE

    --------------- ----------- ----------- ----------- ---------- ---------

    ----

    DES2 41,943,040 30,935,040 74 30,935,040

    1

    DES2_I 31,457,280 23,396,352 74 23,396,352

    1

    RBS 60,817,408 57,085,952 94 52,426,752

    16

    SYSTEM 94,371,840 5,386,240 6 5,013,504

    3

    TEMP 563,200 561,152 100 133,120

    5

    TOOLS 120,586,240 89,407,488 74 78,190,592

    12

    USERS 1,048,576 26,624 3 26,624

    1'
  checks:
  - type: manual_review
    info: 'Review OS or third-party logging application settings to determine whether a warning

      will be provided when 75 percent of DBMS audit log storage capacity is reached.

      If no warning will be provided, this is a finding.'
    severity: medium
- id: '1.15'
  title: O19C-00-006000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must provide an immediate real-time alert to appropriate support staff of all audit log failures.
    GROUP ID: V-270509 RULE ID: SV-270509r1065202'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability,
    and system operation may be adversely affected. The appropriate support staff include, at a minimum, the information system
    security officer (ISSO) and the database administrator (DBA)/system administrator (SA). A failure of database auditing
    will result in either the database continuing to function without auditing or in a complete halt to database operations.
    When audit processing fails, appropriate personnel must be alerted immediately to avoid further downtime or unaudited
    transactions. Alerts provide organizations with urgent messages. Real-time alerts provide these messages immediately (i.e.,
    the time from event detection to alert occurs in seconds or less). If Oracle Enterprise Manager is in use, the capability
    to issue such an alert is built in and configurable via the console so an alert can be sent to a designated administrator.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Review Oracle Database, OS, or third-party logging software settings to determine

    whether a real-time alert will be sent to the appropriate personnel when auditing fails for

    any reason.

    If real-time alerts are not sent upon auditing failure, this is a finding.'
  remediation: 'Configure logging software to send a real-time alert to appropriate personnel when

    auditing fails for any reason.

    Oracle recommends the use of Oracle Enterprise Manager.'
  checks:
  - type: manual_review
    info: 'Review Oracle Database, OS, or third-party logging software settings to determine

      whether a real-time alert will be sent to the appropriate personnel when auditing fails for

      any reason.

      If real-time alerts are not sent upon auditing failure, this is a finding.'
    severity: medium
- id: '1.16'
  title: O19C-00-006600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The audit information produced by the Oracle Database must be protected from unauthorized access, modification,
    or deletion. GROUP ID: V-270510 RULE ID: SV-270510r1068294'
  rationale: 'If audit data were to become compromised, then competent forensic analysis and discovery of the true source
    of potentially malicious system activity is difficult, if not impossible, to achieve. In addition, access to audit records
    provides information an attacker could potentially use to his or her advantage. To ensure the veracity of audit data,
    the information system and/or the application must protect audit information from any and all unauthorized access. This
    includes read, write, copy, etc. This requirement can be achieved through multiple methods which will depend upon system
    architecture and design. Some commonly employed methods include ensuring log files enjoy the proper file system permissions
    using file system protections and limiting log data location. Additionally, applications with user interfaces to audit
    records must not allow for the unfettered manipulation of or access to those records via the application. If the application
    provides access to the audit data, the application becomes accountable for ensuring that audit information is protected
    from unauthorized access. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to successfully audit information system activity. Modification or deletion of database audit data could mask the
    theft of, or the unauthorized modification of, sensitive data stored in the database. Satisfies: SRG-APP-000118-DB-000059,
    SRG-APP-000119-DB-000060, SRG-APP000120-DB-000061'
  impact: ''
  references: []
  page_start: 59
  audit_raw: "Review locations of audit logs, both internal to the database and database audit logs\nlocated at the operating\
    \ system level. Verify there are appropriate controls and\npermissions to protect the audit information from unauthorized\
    \ access.\nIf appropriate controls and permissions do not exist, this is a finding.\nFrom SQL*Plus or SQL Developer:\n\
    select value from v$parameter where name = 'audit_trail';\nselect value from v$parameter where name = 'audit_file_dest';\n\
    If audit_trail is set to OS, XML or XML EXTENDED, this means logs are stored at the\noperating system level.\nIf audit_trail\
    \ is set to OS, but the audit records are routed directly to a separate log\nserver without writing to the local file\
    \ system, this is not a finding.\nIf audit_trail is set to DB or \"DB, EXTENDED\" this means logs are stored in the\n\
    database.\nIf any logs are written to the database, DBA_TAB_PRIVS describes all object grants in the\ndatabase.\nIf standard\
    \ auditing is in use, follow the below, check permissions on the AUD$ table.\nsqlplus connect as sysdba;\nSQL> SELECT\
    \ GRANTEE, TABLE_NAME, PRIVILEGE\nFROM DBA_TAB_PRIVS where table_name = 'AUD$';\nIf Unified Auditing is used, check permissions\
    \ on the AUDSYS tables.\nsqlplus connect as sysdba;\nSQL> SELECT GRANTEE, TABLE_NAME, PRIVILEGE\nFROM DBA_TAB_PRIVS where\
    \ owner='AUDSYS';\nIf appropriate controls and permissions are not implemented, this is a finding.\nIf audit logs located\
    \ at the operating system level:\nOn Unix Systems:\n ls -ld [pathname]\nSubstitute [pathname] with the directory paths\
    \ listed from the above SQL statements for\naudit_file_dest.\nIf permissions are granted for world access, this is a finding.\n\
    If any groups that include members other than software owner accounts, DBAs,\nauditors, oracle processes, or any account\
    \ not listed as authorized, this is a finding.\nOn Windows Systems (from Windows Explorer):\nBrowse to the directory specified.\
    \ Select and right-click on the directory >> Properties\n>> Security tab. On Windows hosts, records are also written to\
    \ the Windows application\nevent log. The location of the application event log is listed under Properties for the log\n\
    under the Windows console. The default location is\nC:\\WINDOWS\\system32\\config\\EventLogs\\AppEvent.Evt.\nSelect and\
    \ right-click on the directory >> Properties >> Security tab.\nIf permissions are granted to everyone, this is a finding.\n\
    If any accounts other than the administrators, software owner accounts, DBAs, auditors,\nOracle processes, or any account\
    \ not listed as authorized, this is a finding.\nCompare path to %ORACLE_HOME%. If audit_file_dest is a subdirectory of\n\
    %ORACLE_HOME%, this is a finding."
  remediation: 'Add controls and modify permissions to protect database audit log data from

    unauthorized modification, whether stored in the database itself or at the OS level.

    Logs are stored in the database:

    For Standard Auditing, Revoke access to the AUD$ table to anyone who should not

    have access to it.

    For Unified Auditing, Revoke access to the tables with AUDSYS as the owner.

    Use the REVOKE statement to remove permissions from a specific user or from all users

    to perform actions on database objects.

    REVOKE privilege-type ON [ TABLE ] { table-Name | view-Name } FROM grantees

    Use the ALL PRIVILEGES privilege type to revoke all of the permissions from the user

    for the specified table. Can also revoke one or more table privileges by specifying a

    privilege-list.

    Use the DELETE privilege type to revoke permission to delete rows from the specified

    table.

    Use the INSERT privilege type to revoke permission to insert rows into the specified

    table.

    Use the REFERENCES privilege type to revoke permission to create a foreign key

    reference to the specified table. If a column list is specified with the REFERENCES

    privilege, the permission is revoked on only the foreign key reference to the specified

    columns.

    Use the SELECT privilege type to revoke permission to perform SELECT statements on a

    table or view. If a column list is specified with the SELECT privilege, the permission is

    revoked on only those columns. If no column list is specified, then the privilege is valid

    on all of the columns in the table.

    Use the TRIGGER privilege type to revoke permission to create a trigger on the specified

    table.

    Use the UPDATE privilege type to revoke permission to use the UPDATE statement on the

    specified table. If a column list is specified, the permission is revoked only on the

    specified columns.

    For file-based/OS level auditing, establish an audit file directory separate from the

    Oracle Home.

    Alter host system permissions to the AUDIT_FILE_DEST directory to the Oracle process

    and software owner accounts, DBAs, backup accounts, SAs (if required), and auditors.

    Authorize and document user access requirements to the directory outside of the

    Oracle, DBA, and SA account list in the system documentation.'
  checks:
  - type: command
    command: ls -ld [pathname]
    expected: ''
    severity: medium
    info: 'Review locations of audit logs, both internal to the database and database audit logs

      located at the operating system level. Verify there are appropriate controls and

      permissions to protect the audit information from unauthorized access.

      If appropriate controls and permissions do not exist, this is a finding.

      From SQL*Plus or SQL Developer:

      select value from v$parameter where name = ''audit_trail'';'
- id: '1.17'
  title: O19C-00-006900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The system must protect audit tools from unauthorized access, modification, or deletion. GROUP ID: V-270511
    RULE ID: SV-270511r1065262'
  rationale: 'Protecting audit data also includes identifying and protecting the tools used to view and manipulate log data.
    Depending upon the log format and application, system and application log tools may provide the only means to manipulate
    and manage application and system log data. It is, therefore, imperative that access to audit tools be controlled and
    protected from unauthorized access. Applications providing tools to interface with audit data will leverage user permissions
    and roles identifying the user accessing the tools and the corresponding rights the user enjoys in order make access decisions
    regarding the access to audit tools. Audit tools include, but are not limited to, OS-provided audit tools, vendor-provided
    audit tools, and open source audit tools needed to successfully view and manipulate audit information system activity
    and records. If an attacker were to gain access to audit tools, he could analyze audit logs for system weaknesses or weaknesses
    in the auditing itself. An attacker could also manipulate logs to hide evidence of malicious activity. Satisfies: SRG-APP-000121-DB-000202,
    SRG-APP-000122-DB-000203, SRG-APP000123-DB-000204'
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review access permissions to tools used to view or modify audit log data. These tools

    may include the database management system (DBMS) itself or tools external to the

    database.

    If appropriate permissions and access controls are not applied to prevent unauthorized

    access, modification, or deletion of these tools, this is a finding.'
  remediation: 'Add or modify access controls and permissions to tools used to view or modify audit log

    data. Tools must be accessible by authorized personnel only.'
  checks:
  - type: manual_review
    info: 'Review access permissions to tools used to view or modify audit log data. These tools

      may include the database management system (DBMS) itself or tools external to the

      database.

      If appropriate permissions and access controls are not applied to prevent unauthorized

      access, modification, or deletion of these tools, this is a finding.'
    severity: medium
