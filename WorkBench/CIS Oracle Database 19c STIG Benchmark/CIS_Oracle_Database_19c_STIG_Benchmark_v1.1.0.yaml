- id: '1.33'
  title: O19C-00-009500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'System privileges granted using the WITH ADMIN OPTION must not be granted to unauthorized user accounts. GROUP
    ID: V-270527 RULE ID: SV-270527r1065266'
  rationale: The WITH ADMIN OPTION allows the grantee to grant a privilege to another database account. Best security practice
    restricts the privilege of assigning privileges to authorized personnel. Authorized personnel include database administrators
    (DBAs), object owners, and, where designed and included in the application's functions, application administrators. Restricting
    privilege-granting functions to authorized accounts can help decrease mismanagement of privileges and wrongful assignments
    to unauthorized accounts.
  impact: ''
  references: []
  page_start: 97
  audit_raw: 'A default Oracle Database installation provides a set of predefined administrative

    accounts and nonadministrative accounts. These are accounts that have special

    privileges required to administer areas of the database, such as the CREATE ANY TABLE

    or ALTER SESSION privilege or EXECUTE privileges on packages owned by the SYS

    schema. The default tablespace for administrative accounts is either SYSTEM or SYSAUX.

    Nonadministrative user accounts only have the minimum privileges needed to perform

    their jobs. Their default tablespace is USERS.

    To protect these accounts from unauthorized access, the installation process expires

    and locks most of these accounts, except where noted below. The database

    administrator is responsible for unlocking and resetting these accounts, as required.

    Nonadministrative Accounts - Expired and locked:

    APEX_PUBLIC_USER, DIP, FLOWS_040100*, FLOWS_FILES, MDDATA,

    SPATIAL_WFS_ADMIN_USR, XS$NULL

    Administrative Accounts - Expired and Locked:

    ANONYMOUS, CTXSYS, EXFSYS, LBACSYS, MDSYS, OLAPSYS, ORACLE_OCM, ORDDATA,

    OWBSYS, ORDPLUGINS, ORDSYS, OUTLN, SI_INFORMTN_SCHEMA,

    SPATIAL_CSW_ADMIN_USR, WK_TEST, WK_SYS, WKPROXY, WMSYS, XDB

    Administrative Accounts - Open:

    DBSNMP, MGMT_VIEW, SYS, SYSMAN, SYSTEM, SYSKM

    *Subject to change based on version installed.

    Run the SQL query:

    From SQL*Plus:

    select grantee, privilege from dba_sys_privs

    where grantee not in (&lt;list of nonapplicable accounts>)

    and admin_option = ''YES''

    and grantee not in

    (select grantee from dba_role_privs where granted_role = ''DBA'');

    (With respect to the list of special accounts that are excluded from this requirement, it is

    expected that the DBA will maintain the list to suit local circumstances, adding special

    accounts as necessary and removing any that are not supposed to be in use in the

    Oracle deployment that is under review.)

    If any accounts that are not authorized to have the ADMIN OPTION are listed, this is a

    finding.'
  remediation: 'Revoke assignment of privileges with the WITH ADMIN OPTION from unauthorized users

    and regrant them without the option.

    From SQL*Plus:

    revoke [privilege name] from user [username];

    Replace [privilege name] with the named privilege and [username] with the named user.

    Restrict use of the WITH ADMIN OPTION to authorized administrators.

    Document authorized privilege assignments with the WITH ADMIN OPTION in the system

    documentation.'
  checks:
  - type: sql
    command: select grantee, privilege from dba_sys_privs
    severity: medium
    info: 'A default Oracle Database installation provides a set of predefined administrative

      accounts and nonadministrative accounts. These are accounts that have special

      privileges required to administer areas of the database, such as the CREATE ANY TABLE

      or ALTER SESSION privilege or EXECUTE privileges on packages owned by the SYS

      schema. The default tablespace for administrative accounts is either SYSTEM'
- id: '1.34'
  title: O19C-00-009600
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'System Privileges must not be granted to PUBLIC. GROUP ID: V-270528 RULE ID: SV-270528r1064862'
  rationale: System privileges can be granted to users and roles and to the user group PUBLIC. All privileges granted to PUBLIC
    are accessible to every user in the database. Many of these privileges convey considerable authority over the database
    and should be granted only to those persons responsible for administering the database. In general, these privileges should
    be granted to roles and then the appropriate roles should be granted to users. System privileges must never be granted
    to PUBLIC as this could allow users to compromise the database.
  impact: ''
  references: []
  page_start: 99
  audit_raw: 'From SQL*Plus:

    Select privilege

    from dba_sys_privs

    where grantee = ''PUBLIC'';

    If any records are returned, this is a finding.'
  remediation: 'Revoke any system privileges assigned to PUBLIC:

    From SQL*Plus:

    revoke [system privilege] from PUBLIC;

    Replace [system privilege] with the named system privilege.

    Note: System privileges are not granted to PUBLIC by default and would indicate a

    custom action.'
  checks:
  - type: sql
    command: Select privilege
    severity: medium
    info: 'From SQL*Plus:

      Select privilege

      from dba_sys_privs

      where grantee = ''PUBLIC'';

      If any records are returned, this is a finding.'
