      If the DBMS settings for concurrent sessions for each profile are greater than the sitespecific maximum number of sessions
      (or the database maximum number of sessions)

      for the user type, this is a finding.

      The reason for "si'
- id: '1.2'
  title: O19C-00-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must protect against or limit the effects of organization-defined types of denial-of-service
    (DoS) attacks. GROUP ID: V-270496 RULE ID: SV-270496r1167727'
  rationale: 'DOS attacks, more correctly characterized as "Denial-of-Service Events" as they most often the result of run-away
    processes and accidents, are the result of an excessive demand for a limiting resource. A variety of technologies exist
    to limit, or in some cases, eliminate the effects of DoS attacks. For example, boundary protection devices can filter
    certain types of packets to protect devices on an organization''s internal network from being directly affected by DoS
    attacks but within the database itself, Oracle provides the following mechanisms: 1. Reduction of excessive concurrent
    connections from a single user (see STIG_ID O19C-00-000100). 2. Limiting the database connection rate (LISTENER.ORA).
    3. Limiting the amount of CPU available to users with Profile kernel limits. 4. Limiting the amount of I/O available to
    users with Profile kernel limits. 5. Limiting the amount of storage space with tablespace quotas. 6. Limiting idle time
    with profile kernel limits. Other best practices such as limiting the number of parallel handles available to users with
    Resource Manager Plans or using CMAN are also recommended as part of an overall plan for DoS prevention.'
  impact: ''
  references: []
  page_start: 19
  audit_raw: "Review database management system (DBMS) settings to verify the DBMS implements\nmeasures to limit the effects\
    \ of a DoS event.\nRate Limit:\nCheck the $ORACLE_HOME/network/admin/listener.ora to verify a Rate Limit has\nbeen established.\
    \ A rate limit is used to prevent DoS attacks on a database or to control\na logon storm such as may be caused by an application\
    \ server or pool restart.\nIf a rate limit has not been set similar to one of the two examples in Listing 1, this is a\n\
    finding.\nListing 1\nCONNECTION_RATE_LISTENER=10\nLISTENER= (\n ADDRESS_LIST=\n (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1521)(RATE_LIMIT=yes))\n\
    \ (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1522)(RATE_LIMIT=yes))\n (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1526))\n )\nLISTENER=\n\
    \ (ADDRESS_LIST=\n (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1521)(RATE_LIMIT=8))\n (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1522)(RATE_LIMIT=12))\n\
    \ (ADDRESS=(PROTOCOL=tcp)(HOST=)(PORT=1526))\n )\nDatabase Profiles: If the database profiles, as shown in Listing 2 do\
    \ not contain\nresource controls similar to those shown, but appropriate to the target database's\ninfrastructure and\
    \ utilization, that is a finding.\nListing 2\nSELECT cp.con_id, cp.profile, cp.resource_name, cp.limit\nFROM sys.cdb_profiles\
    \ cp\nWHERE resource_name IN ('CPU_PER_CALL', 'IDLE_TIME',\n'LOGICAL_READS_PER_CALL');\nORDER BY 1,2,3;\nTablespace Quota:\n\
    Listing 3\nSELECT ctq.con_id, ctq.tablespace_name, ctq.username, ctq.max_bytes,\nctq.max_blocks\nFROM sys.cdb_ts_quotas\
    \ ctq\nWHERE ((max_bytes = -1) OR (max_blocks = -1))\nAND (ctq.con_id, ctq.tablespace_name) IN (SELECT ct.con_id,\nct.tablespace_name\
    \ FROM sys.cdb_tablespaces ct)\nORDER BY 1;\nIf any rows returned have a MAX_BYTES or MAX_BLOCKS equal to minus one (-1)\
    \ that is a\nfinding."
  remediation: 'Implement measures to limit the effects of organization-defined types of DoS attacks.

    For each of the three queries in the Check, if there are findings, make the changes

    required to bring the environment into compliance.

    For Listing 1: Modify the $ORACLE_HOME/network/admin/listener.ora to establish a

    Rate Limit. Restart the listener for changes to take effect.

    For Listing 2: Set limits on all profiles for CPU_PER_CALL, IDLE_TIME, and

    LOGICAL_READS_PER_CALL.

    For Listing 3: Enforce reasonable limits for tablespace consumption sufficient to prevent

    a DOS attack from impacting multiple applications or multiple services.'
  checks:
  - type: sql
    command: SELECT cp.con_id, cp.profile, cp.resource_name, cp.limit
    severity: medium
    info: 'Review database management system (DBMS) settings to verify the DBMS implements

      measures to limit the effects of a DoS event.

      Rate Limit:

      Check the $ORACLE_HOME/network/admin/listener.ora to verify a Rate Limit has

      been established. A rate limit is used to prevent DoS attacks on a database or to control

      a logon storm such as may be caused by an application server or pool restart.

      If a rate limit h'
- id: '1.3'
  title: O19C-00-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must automatically terminate a user session after organization-defined conditions or trigger
    events requiring session disconnect. GROUP ID: V-270497 RULE ID: SV-270497r1167730'
  rationale: 'This addresses the termination of user-initiated logical sessions in contrast to the termination of network
    connections associated with communications sessions (i.e., network disconnect). A logical session (for local, network,
    and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses an organizational information
    system. Such user sessions can be terminated (and thus terminate user access) without terminating network sessions. Session
    termination ends all processes associated with a user''s logical session except those batch processes/jobs that are specifically
    created by the user (i.e., session owner) to continue after the session is terminated. Conditions or trigger events requiring
    automatic session termination can include, for example, organization-defined periods of user inactivity, targeted responses
    to certain types of incidents, and time-of-day restrictions on information system use. This capability is typically reserved
    for specific cases where the system owner, data owner, or organization requires additional assurance. Satisfies: SRG-APP-000295-DB-000305,
    SRG-APP-000296-DB-000306'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review system documentation to obtain the organization''s definition of circumstances

    requiring automatic session termination. If the documentation explicitly states that such

    termination is not required or is prohibited, this is not a finding.

    If no documentation exists or an automatic session termination time is not explicitly

    defined, assume a time of 15 minutes.

    To check the max_idle_time set, run the following query:

    SELECT gp.inst_id, gp.con_id, gp.value

    FROM sys.gv_$parameter gp

    WHERE gp.name = ''max_idle_time'';

    If the value returned is "0" or does not match the documented requirement (or 15 when

    none is specified), this is a finding.'
  remediation: 'Configure the database management system (DBMS) to automatically terminate a user

    session after organization-defined conditions, 15 minutes, or a trigger event requiring

    session termination.

    To terminate a session after a certain amount of time independent of the consumed

    resources needed by other users, then set the MAX_IDLE_TIME initialization parameter.

    The MAX_IDLE_TIME parameter specifies the maximum number of minutes a session

    can be idle. After the specified amount of time, MAX_IDLE_TIME kills sessions.

    ALTER SYSTEM SET max_idle_time = 15

    COMMENT = ''Altered <date> for STIG compliance'' -- self documenting

    SID = ''*'' -- required for RAC

    SCOPE = BOTH;'
  checks:
  - type: sql
    command: SELECT gp.inst_id, gp.con_id, gp.value
    severity: medium
    info: 'Review system documentation to obtain the organization''s definition of circumstances

      requiring automatic session termination. If the documentation explicitly states that such

      termination is not required or is prohibited, this is not a finding.

      If no documentation exists or an automatic session termination time is not explicitly

      defined, assume a time of 15 minutes.

      To check the max_idle_time set, '
- id: '1.4'
  title: O19C-00-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must associate organization-defined types of security labels having organization-defined security
    label values with information in storage. GROUP ID: V-270498 RULE ID: SV-270498r1167732'
  rationale: 'Without the association of security labels to information, there is no basis for the database management system
    (DBMS) to make security-related access-control decisions. Security labels are abstractions representing the basic properties
    or characteristics of an entity (e.g., subjects and objects) with respect to safeguarding information. These labels are
    typically associated with internal data structures (e.g., tables, rows) within the database and are used to enable the
    implementation of access control and flow control policies, reflect special dissemination, handling, or distribution instructions,
    or support other aspects of the information security policy. One example includes marking data as classified or CUI. These
    security labels may be assigned manually or during data processing, but, either way, it is imperative these assignments
    are maintained while the data is in storage. If the security labels are lost when the data is stored, there is the risk
    of a data compromise. Some DBMS systems provide the feature to assign security labels to data elements. If labeling is
    required, implementation options include the Oracle Label Security package, or a third-party product, or custom-developed
    functionality. The confidentiality and integrity of the data depends upon the security label assignment where this feature
    is in use. Satisfies: SRG-APP-000311-DB-000308, SRG-APP-000313-DB-000309, SRG-APP000314-DB-000310'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'If no data has been identified as being sensitive or classified in the system

    documentation, this is not a finding.

    If security labeling is not required, this is not a finding.

    If security labeling requirements have been specified, but the security labeling is not

    implemented or does not reliably maintain labels on information in storage, this is a

    finding.'
  remediation: 'Define the policy for security labels defined for the data.

    Document the security label requirements and configure database security labels in

    accordance with the policy.

    To provide reliable security labeling of information in storage, enable DBMS features;

    deploy third-party software; or add custom data structures, data elements, and

    application code.

    Oracle recommends Oracle Label Security.

    For additional information on Oracle Label Security:

    https://docs.oracle.com/en/database/oracle/oracle-database/19/olsag/label-securityadministrators-guide.pdf.'
  checks:
  - type: manual_review
    info: 'If no data has been identified as being sensitive or classified in the system

      documentation, this is not a finding.

      If security labeling is not required, this is not a finding.

      If security labeling requirements have been specified, but the security labeling is not

      implemented or does not reliably maintain labels on information in storage, this is a

      finding.'
    severity: medium
- id: '1.5'
  title: O19C-00-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database must integrate with an organization-level authentication/access mechanism providing account
    management and automation for all users, groups, roles, and any other principals. GROUP ID: V-270499 RULE ID: SV-270499r1064775'
  rationale: 'Enterprise environments make account management for applications and databases challenging and complex. A manual
    process for account management functions adds the risk of a potential oversight or other error. Managing accounts for
    the same person in multiple places is inefficient and prone to problems with consistency and synchronization. A comprehensive
    application account management process that includes automation helps to ensure that accounts designated as requiring
    attention are consistently and promptly addressed. Examples include, but are not limited to, using automation to act on
    multiple accounts designated as inactive, suspended, or terminated, or by disabling accounts located in noncentralized
    account stores, such as multiple servers. Account management functions can also include assignment of group or role membership;
    identifying account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination;
    and administrative alerts. The use of automated mechanisms can include, for example: using email or text messaging to
    notify account managers when users are terminated or transferred; using the information system to monitor account usage;
    and using automated telephone notification to report atypical system account usage. Oracle Database must be configured
    to automatically use organization-level account management functions, and these functions must immediately enforce the
    organization''s current account policy. Automation may be comprised of differing technologies that when placed together
    contain an overall mechanism supporting an organization''s automated account management requirements.'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'If all user accounts are authenticated by the OS or an enterprise-level

    authentication/access mechanism, and not by Oracle, this is not a finding.

    If an Oracle feature/product, an OS feature, a third-party product, or custom code is

    used to automate account management, this is not a finding.

    If there are any accounts managed by the Oracle Database, review the system

    documentation for justification and approval of these accounts.

    If any Oracle-managed accounts exist that are not documented and approved, this is a

    finding.'
  remediation: 'Integrate database management system (DBMS) security with an organization-level

    authentication/access mechanism providing account management for all users, groups,

    roles, and any other principals.

    For each Oracle-managed account that is not documented and approved, either transfer

    it to management by the external mechanism, or document the need for it and obtain

    approval, as appropriate.

    Utilize an Oracle feature/product, an OS feature, a third-party product, or custom code

    to automate as much account maintenance functionality as possible.'
  checks:
  - type: manual_review
    info: 'If all user accounts are authenticated by the OS or an enterprise-level

      authentication/access mechanism, and not by Oracle, this is not a finding.

      If an Oracle feature/product, an OS feature, a third-party product, or custom code is

      used to automate account management, this is not a finding.

      If there are any accounts managed by the Oracle Database, review the system

      documentation for justification and approval of these accounts.

      If any Oracle-managed accounts exist that are not documented and ap'
    severity: medium
- id: '1.6'
  title: O19C-00-001000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database must enforce approved authorizations for logical access to the system in accordance with applicable
    policy. GROUP ID: V-270500 RULE ID: SV-270500r1167734'
  rationale: 'Authentication with a DOD-approved public key infrastructure (PKI) certificate does not necessarily imply authorization
    to access the database management system (DBMS). To mitigate the risk of unauthorized access to sensitive information
    by entities that have been issued certificates by DOD-approved PKIs, all DOD systems, including databases, must be properly
    configured to implement access control policies. Successful authentication must not automatically give an entity access
    to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated
    entity also has a validated and current authorization. Authorization is the process of determining whether an entity,
    once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement
    mechanisms to implement this requirement. Access control policies include identity-based policies, role-based policies,
    and attribute-based policies. Access enforcement mechanisms include access control lists, access control matrices, and
    cryptography. These policies and mechanisms must be employed by the application to control access between users (or processes
    acting on behalf of users) and objects (e.g., devices, files, records, processes, programs, and domains) in the information
    system. This requirement is applicable to access control enforcement applications, a category that includes database management
    systems. If the DBMS does not follow applicable policy when approving access, it may be in conflict with networks or other
    applications in the information system. This may result in users either gaining or being denied access inappropriately
    and in conflict with applicable policy. Satisfies: SRG-APP-000033-DB-000084, SRG-APP-000340-DB-000304'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Check DBMS settings to determine whether users are restricted from accessing objects

    and data they are not authorized to access. If appropriate access controls are not

    implemented to restrict access to authorized users and to restrict the access of those

    users to objects and data they are authorized to verify, this is a finding.

    One option to isolate access is by using the Oracle Database Vault. To check to verify

    the Oracle Database Vault is installed, issue the following query:

    SQL> SELECT * FROM sys.v_$option WHERE parameter = ''Oracle Database Vault'';

    If Oracle Database Vault is installed, review its settings for appropriateness and

    completeness of the access it permits and denies to each type of user. If appropriate

    and complete, this is not a finding.

    If Oracle Database Vault is not installed, review the roles and profiles in the database

    and the assignment of users to these for appropriateness and completeness of the

    access permitted and denied each type of user. If appropriate and complete, this is not

    a finding.

    If the access permitted and denied each type of user is inappropriate or incomplete, this

    is a finding.

    Following are code examples for reviewing roles, profiles, etc.

    Find out what role the users have:

    select *

    from sys.cdb_role_privs

    where granted_role = ''<role>''

    List all roles given to a user:

    select *

    from sys.cba_role_privs

    where grantee = ''<username>'';

    List all roles for all users:

    column grantee format a32

    column granted_role format a32

    break on grantee

    SELECT con_id, grantee, granted_role

    FROM sys.cdb_role_privs

    ORDER BY 1,2,3;

    Use the following query to list all privileges given to a user:

    SELECT LPAD('' '', 2*level) || granted_role "User roles and privileges"

    FROM (

    /* THE USERS */

    SELECT con_id, NULL AS grantee, username granted_role

    FROM sys.cdb_users

    WHERE username LIKE UPPER(''<enter_username>'')

    /* THE ROLES TO ROLES RELATIONS */

    UNION SELECT con_id, grantee, granted_role

    FROM sys.cdb_role_privs

    /* THE ROLES TO PRIVILEGE RELATIONS */

    UNION

    SELECT con_id, grantee, privilege

    FROM sys.cdb_sys_privs)

    START WITH grantee IS NULL

    CONNECT BY grantee = PRIOR granted_role;

    List which tables a certain role gives SELECT and READ access to using the query:

    SELECT * FROM sys.role_tab_privs WHERE role = ''<role>''

    AND privilege IN (''READ'', ''SELECT'');

    List all tables a user can SELECT and READ from using the query:

    SELECT * FROM sys.cdb_tab_privs

    WHERE grantee =''<username>'' AND privilege IN (''READ'', ''SELECT'');

    List all users who can SELECT on a particular table (either through being given a

    relevant role or through a direct grant, e.g., grant select on a table to Joe). The result of

    this query should also show through which role the user has this access or whether it

    was a direct grant.

    SELECT grantee,''Granted Through Role'' as Grant_Type, role, table_name

    FROM CONTAINERS(sys.role_tab_privs) rtp, sys.cdb_role_privs crp

    WHERE rtp.role = crp.granted_role

    AND rtp.con_id = crp.con_id

    AND table_name = ''<TABLENAME>''

    UNION

    SELECT grantee, ''Direct Grant'' as Grant_Type, NULL AS role, table_name

    FROM sys.cdb_tab_privs

    WHERE table_name = ''<TABLENAME>'';'
  remediation: 'If Oracle Database Vault is in use, use it to configure the correct access privileges for

    each type of user.

    If Oracle Database Vault is not in use, configure the correct access privileges for each

    type of user using Roles and Profiles.

    Oracle recommends using Database Vault.

    For more information on the configuration of Database Vault, refer to the Database

    Vault Administrator''s Guide: https://docs.oracle.com/en/database/oracle/oracledatabase/19/dvadm/database-vault-administrators-guide.pdf.'
  checks:
  - type: sql
    command: SELECT * FROM sys.v_$option WHERE parameter = 'Oracle Database Vault';
    severity: medium
    info: 'Check DBMS settings to determine whether users are restricted from accessing objects

      and data they are not authorized to access. If appropriate access controls are not

      implemented to restrict access to authorized users and to restrict the access of those

      users to objects and data they are authorized to verify, this is a finding.

      One option to isolate access is by using the Oracle Database Vault. T'
- id: '1.7'
  title: O19C-00-001700
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Oracle Database must protect against an individual who uses a shared account falsely denying having performed
    a particular action. GROUP ID: V-270501 RULE ID: SV-270501r1167736'
  rationale: 'Nonrepudiation of actions taken is required to maintain application integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Nonrepudiation protects individuals against later claims by an author
    of not having authored a particular document, a sender of not having transmitted a message, a receiver of not having received
    a message, or a signatory of not having signed a document. Authentication via shared accounts does not provide individual
    accountability for actions taken on the database management system (DBMS) or data. Whenever a single database account
    is used to connect to the database, a secondary authentication method that provides individual accountability is required.
    This scenario most frequently occurs when an externally hosted application authenticates individual users to the application
    and the application uses a single account to retrieve or update database information on behalf of the individual users.
    When shared accounts are used without another means of identifying individual users, users may deny having performed a
    particular action. This calls for inspection of application source code, which requires collaboration with the application
    developers. In many cases, the database administrator (DBA) is organizationally separate from the application developers
    and may have limited, if any, access to source code. Nevertheless, protections of this type are so important to the secure
    operation of databases that they must not be ignored. At a minimum, the DBA must attempt to obtain assurances from the
    development organization that this issue has been addressed and must document what has been discovered. Satisfies: SRG-APP-000080-DB-000063,
    SRG-APP-000815-DB-000160'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'If there are no shared accounts available to more than one user, this is not a finding.

    Review database, application, and/or OS settings to determine whether users can be

    identified as individuals when using shared accounts.

    If the individual user of a shared account cannot be identified, this is a finding.

    If Standard Auditing is used:

    To ensure user activities other than SELECT, INSERT, UPDATE, and DELETE are also

    monitored and attributed to individuals, verify that Oracle auditing is enabled. To verify

    Oracle is configured to capture audit data, enter the following SQL*Plus command:

    SHOW PARAMETER AUDIT_TRAIL

    Or run the following SQL query:

    col display_value format a10

    col default_value format a10

    SELECT inst_id, con_id, display_value, default_value, isdefault

    FROM sys.gv_$parameter WHERE name = ''audit_trail'';

    If the query returns the display_value "NONE", for any instance or container, this is a

    finding.

    If Unified Auditing is used:

    To ensure that user activities other than SELECT, INSERT, UPDATE, and DELETE are also

    monitored and attributed to individuals, verify that Oracle auditing is enabled. To verify

    Oracle is configured to capture audit data, enter the following SQL*Plus query:

    col value format a10

    SELECT inst_id, con_id, value

    FROM sys.gv_$option

    WHERE parameter = ''Unified Auditing'';

    If the query returns something other than "TRUE", for any instance or container, this is a

    finding.'
  remediation: 'Use accounts assigned to individual users. Configure DBMS to provide individual

    accountability at the DBMS level, and in audit logs, for actions performed under a

    shared database account.

    Modify applications and data tables that are not capturing individual user identity to do

    so.

    Create and enforce the use of individual user IDs for logging on to Oracle tools and

    third-party products.

    If Oracle auditing is not already enabled, enable it.

    If Standard Auditing is used:

    If Oracle (or third-party) auditing is not already enabled, enable it. For Oracle auditing,

    use this query:

    ALTER SYSTEM SET AUDIT_TRAIL=<audit trail type> SID=''*'' SCOPE=SPFILE;

    Audit trail type can be ''OS'', ''DB'', ''DB,EXTENDED'', ''XML'' or ''XML,EXTENDED''.

    After executing this statement, it may be necessary to shut down and restart the Oracle

    database.

    If Unified Auditing is used:

    Link the oracle binary with uniaud_on, and then restart the database. Oracle Database

    Upgrade Guide describes how to enable unified auditing.

    For more information on the configuration of auditing, refer to the following documents:

    "Auditing Database Activity" in the Oracle Database 19c Security Guide:

    https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/index.html

    "Monitoring Database Activity with Auditing" in the Oracle Database Security Guide:

    https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/index.html

    "DBMS_AUDIT_MGMT" in the Oracle Database PL/SQL Packages and Types

    Reference: https://docs.oracle.com/en/database/oracle/oracle-database/19/arpls/

    Oracle Database Upgrade Guide: https://docs.oracle.com/en/database/oracle/oracledatabase/19/upgrd/index.html

    If the site-specific audit requirements are not covered by the default audit options,

    deploy and configure Fine-Grained Auditing. For details, refer to Oracle documentation

    at the locations above.

    If this level of auditing does not meet site-specific requirements, consider deploying the

    Oracle Audit Vault. The Audit Vault is a highly configurable option from Oracle made

    specifically for performing the audit functions. It has reporting capabilities as well as

    user-defined rules that provide additional flexibility for complex auditing requirements.'
