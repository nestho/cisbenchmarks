- id: '1.61'
  title: O19C-00-013200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OS accounts used to run external procedures called by Oracle Database must have limited privileges. GROUP
    ID: V-270555 RULE ID: SV-270555r1115550'
  rationale: This requirement is intended to limit exposure due to operating from within a privileged account or role. The
    inclusion of role is intended to address those situations where an access control policy, such as Role Based Access Control
    (RBAC) is being implemented and where a change of role provides the same degree of assurance in the change of access authorizations
    for both the user and all processes acting on behalf of the user as would be provided by a change between a privileged
    and nonprivileged account. To limit exposure when operating from within a privileged account or role, the application
    must support organizational requirements that users of information system accounts, or roles, with access to organization-defined
    lists of security functions or security-relevant information, use nonprivileged accounts, or roles, when accessing other
    (nonsecurity) system functions. Use of privileged accounts for nonadministrative purposes puts data at risk of unintended
    or unauthorized loss, modification, or exposure. In particular, database administrator (DBA) accounts if used for nonadministration
    application development or application maintenance can lead to misassignment of privileges where privileges are inherited
    by object owners. It may also lead to loss or compromise of application data where the elevated privileges bypass controls
    designed in and provided by applications. External applications called or spawned by the database management system (DBMS)
    process may be executed under OS accounts with unnecessary privileges. This can lead to unauthorized access to OS resources
    and compromise of the OS, the DBMS or any other services provided by the host platform.
  impact: ''
  references: []
