- id: '1.22'
  title: O19C-00-008000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Database software installation account must be restricted to authorized users. GROUP ID: V-270516
    RULE ID: SV-270516r1064826'
  rationale: When dealing with change control issues, it should be noted any changes to the hardware, software, and/or firmware
    components of the information system and/or application can have significant effects on the overall security of the system.
    If the system were to allow any user to make changes to software libraries, then those changes might be implemented without
    undergoing the appropriate testing and approvals that are part of a robust change management process. Accordingly, only
    qualified and authorized individuals must be allowed access to information system components for purposes of initiating
    changes, including upgrades and modifications. Database administrator (DBA) and other privileged administrative or application
    owner accounts are granted privileges that allow actions that can have a great impact on database security and operation.
    It is especially important to grant privileged access to only those persons who are qualified and authorized to use them.
    This requirement is particularly important because Oracle equates the installation account with the SYS account - the
    super-DBA. Once logged on to the operating system, this account can connect to the database AS SYSDBA without further
    authentication. It is very powerful and, by virtue of not being linked to any one person, cannot be audited to the level
    of the individual.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'Review procedures for controlling and granting access to use of the database

    management system (DBMS) software installation account.

    If access or use of this account is not restricted to the minimum number of personnel

    required, or if unauthorized access to the account has been granted, this is a finding.'
  remediation: 'Develop, document, and implement procedures to restrict use of the DBMS software

    installation account.'
  checks:
  - type: manual_review
    info: 'Review procedures for controlling and granting access to use of the database

      management system (DBMS) software installation account.

      If access or use of this account is not restricted to the minimum number of personnel

      required, or if unauthorized access to the account has been granted, this is a finding.'
    severity: medium
- id: '1.23'
  title: O19C-00-008100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database software directories, including database management system (DBMS) configuration files, must be stored
    in dedicated directories, or DASD pools, separate from the host OS and other applications. GROUP ID: V-270517 RULE ID:
    SV-270517r1064829'
  rationale: When dealing with change control issues, it should be noted, any changes to the hardware, software, and/or firmware
    components of the information system and/or application can potentially have significant effects on the overall security
    of the system. Multiple applications can provide a cumulative negative effect. A vulnerability and subsequent exploit
    to one application can lead to an exploit of other applications sharing the same security context. For example, an exploit
    to a web server process that leads to unauthorized administrative access to host system directories can most likely lead
    to a compromise of all applications hosted by the same system. Database software not installed using dedicated directories
    both threatens and is threatened by other hosted applications. Access controls defined for one application may by default
    provide access to the other application's database objects or directories. Any method that provides any level of separation
    of security context assists in the protection between applications.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Review the DBMS software library directory and note other root directories located on

    the same disk directory or any subdirectories. If any non-DBMS software directories

    exist on the disk directory, examine or investigate their use.

    If any of the directories are used by other applications, including third-party applications

    that use the DBMS, this is a finding.

    Only applications that are required for the functioning and administration, not use, of the

    DBMS should be located on the same disk directory as the DBMS software libraries.

    For databases located on mainframes, confirm that the database and its configuration

    files are isolated in their own DASD pools.

    If database software and database configuration files share DASD with other

    applications, this is a finding.'
  remediation: 'Install all applications on directories, or pools, separate from the DBMS software library

    directory. Relocate any directories or reinstall other application software that currently

    shares the DBMS software library directory to separate directories.

    For mainframe-based databases, locate database software and configuration files in

    separate DASD pools from other mainframe applications.'
  checks:
  - type: manual_review
    info: 'Review the DBMS software library directory and note other root directories located on

      the same disk directory or any subdirectories. If any non-DBMS software directories

      exist on the disk directory, examine or investigate their use.

      If any of the directories are used by other applications, including third-party applications

      that use the DBMS, this is a finding.

      Only applications that are required for the functioning and administration, not use, of the

      DBMS should be located on the same disk dire'
    severity: medium
- id: '1.24'
  title: O19C-00-008200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database objects must be owned by accounts authorized for ownership. GROUP ID: V-270518 RULE ID: SV-270518r1064832'
  rationale: Within the database, object ownership implies full privileges to the owned object including the privilege to
    assign access to the owned objects to other subjects. Unmanaged or uncontrolled ownership of objects can lead to unauthorized
    object grants and alterations, and unauthorized modifications to data. If critical tables or other objects rely on unauthorized
    owner accounts, these objects can be lost when an account is removed. It may be the case that there are accounts that
    are authorized to own synonyms, but no other objects. If this is so, it should be documented.
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'Review system documentation to identify accounts authorized to own database objects.

    Review accounts in the database management systems (DBMSs) that own objects.

    If any database objects are found to be owned by users not authorized to own database

    objects, this is a finding.

    Query the object DBA_OBJECTS to show the users who own objects in the database. The

    query below will return all of the users who own objects.

    sqlplus connect as sysdba

    SQL>select owner, object_type, count(*) from dba_objects

    group by owner, object_type

    order by owner, object_type;

    If these owners are not authorized owners, select all of the objects these owners have

    generated and decide who they should belong to. To make a list of all of the objects, the

    unauthorized owner has to perform the following query.

    SQL>select * from dba_objects where owner =&unauthorized_owner;'
  remediation: 'Update system documentation to include list of accounts authorized for object

    ownership.

    Reassign ownership of authorized objects to authorized object owner accounts.'
  checks:
  - type: sql
    command: show the users who own objects in the database. The
    severity: medium
    info: 'Review system documentation to identify accounts authorized to own database objects.

      Review accounts in the database management systems (DBMSs) that own objects.

      If any database objects are found to be owned by users not authorized to own database

      objects, this is a finding.

      Query the object DBA_OBJECTS to show the users who own objects in the database. The

      query below will return all of the users'
- id: '1.25'
  title: O19C-00-008300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The role(s)/group(s) used to modify database structure (including but not necessarily limited to tables, indexes,
    storage, etc.) and logic modules (stored procedures, functions, triggers, links to software external to the DBMS, etc.)
    must be restricted to authorized users. GROUP ID: V-270519 RULE ID: SV-270519r1112463'
  rationale: If the database management system (DBMS) were to allow any user to make changes to database structure or logic,
    then those changes might be implemented without undergoing the appropriate testing and approvals that are part of a robust
    change management process. Accordingly, only qualified and authorized individuals must be allowed to obtain access to
    information system components for purposes of initiating changes, including upgrades and modifications. Unmanaged changes
    that occur to the database software libraries or configuration can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 79
  audit_raw: 'Review accounts for direct assignment of administrative privileges. Connected as

    SYSDBA, run the query:

    SELECT grantee, privilege

    FROM dba_sys_privs

    WHERE grantee IN

    (

    SELECT username

    FROM dba_users

    WHERE username NOT IN

    (

    ''XDB'', ''SYSTEM'', ''SYS'', ''LBACSYS'',

    ''DVSYS'', ''DVF'', ''SYSMAN_RO'',

    ''SYSMAN_BIPLATFORM'', ''SYSMAN_MDS'',

    ''SYSMAN_OPSS'', ''SYSMAN_STB'', ''DBSNMP'',

    ''SYSMAN'', ''APEX_040200'', ''WMSYS'',

    ''SYSDG'', ''SYSBACKUP'', ''SPATIAL_WFS_ADMIN_USR'',

    ''SPATIAL_CSW_ADMIN_US'', ''GSMCATUSER'',

    ''OLAPSYS'', ''SI_INFORMTN_SCHEMA'',

    ''OUTLN'', ''ORDSYS'', ''ORDDATA'', ''OJVMSYS'',

