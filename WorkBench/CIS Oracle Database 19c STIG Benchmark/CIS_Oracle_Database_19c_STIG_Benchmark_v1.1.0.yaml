    The database supports authentication by using digital certificates over TLS in addition to

    the native encryption and data integrity capabilities of these protocols.

    An Oracle Wallet is a container that is used to store authentication and signing

    credentials, including private keys, certificates, and trusted certificates needed by TLS.

    In an Oracle environment, every entity that communicates over TLS must have a wallet

    containing an X.509 version 3 certificate, private key, and list of trusted certificates, with

    the exception of Diffie-Hellman.

    Verify the $ORACLE_HOME/network/admin/sqlnet.ora contains entries similar to the

    following to confirm TLS is installed:

    WALLET_LOCATION = (SOURCE=

