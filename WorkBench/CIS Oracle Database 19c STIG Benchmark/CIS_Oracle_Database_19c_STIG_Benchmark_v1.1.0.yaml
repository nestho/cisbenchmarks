- id: '1.86'
  title: O19C-00-017900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must check the validity of data inputs. GROUP ID: V-270580 RULE ID: SV-270580r1068300'
  rationale: 'Invalid user input occurs when a user inserts data or characters into an application''s data entry fields and
    the application is unprepared to process that data. This results in unanticipated application behavior, potentially leading
    to an application or information system compromise. Invalid user input is one of the primary methods employed when attempting
    to compromise an application. All applications need to validate the data users attempt to input to the application for
    processing. Rules for checking the valid syntax and semantics of information system inputs (e.g., character set, length,
    numerical range, acceptable values) are in place to verify inputs match specified definitions for format and content.
    Inputs passed to interpreters are prescreened to prevent the content from being unintentionally interpreted as commands.
    This requires for inspection of application source code, which will involve collaboration with the application developers.
    It is recognized that in many cases, the database administrator (DBA) is organizationally separate from the application
    developers and may have limited, if any, access to source code. Nevertheless, protections of this type are so important
    to the secure operation of databases that they must not be ignored. At a minimum, the DBA must attempt to obtain assurances
    from the development organization that this issue has been addressed and must document what has been discovered. Oracle
    provides built-in processes to keep data and its integrity intact by using constraints. Integrity Constraint States can
    specify that a constraint is enabled (ENABLE) or disabled (DISABLE). If a constraint is enabled, data is checked as it
    is entered or updated in the database, and data that does not conform to the constraint is prevented from being entered.
    If a constraint is disabled, then data that does not conform can be allowed to enter the database. Additionally, can specify
    that existing data in the table must conform to the constraint (VALIDATE). Conversely, if specified NOVALIDATE, are not
    ensured that existing data conforms. An integrity constraint defined on a table can be in one of the following states:
    • ENABLE, VALIDATE • ENABLE, NOVALIDATE • DISABLE, VALIDATE • DISABLE, NOVALIDATE'
  impact: ''
  references: []
  page_start: 217
  audit_raw: 'Review database management system (DBMS) code, settings, field definitions,

    constraints, and triggers to determine whether or not data being input into the database

    is validated.

    If code exists that allows invalid data to be acted upon or input into the database, this is

    a finding.

    If field definitions do not exist in the database, this is a finding.

    If fields do not contain enabled constraints where required, this is a finding.'
  remediation: 'Modify database code to properly validate data before it is put into the database or

    acted upon by the database.

    Modify database to contain field definitions for each field in the database.

    Modify database to contain constraints on database columns and tables that require

    them for data validity.

    Review the application schemas implemented on the system. Check the DDL for the

    tables that are created for the applications to verify constraints have been enabled.

    Enabling Constraints Upon Definition: The following CREATE TABLE and ALTER

    TABLE statements both define and enable integrity constraints:

    CREATE TABLE emp (

    empno NUMBER(5) CONSTRAINT emp.pk PRIMARY KEY, . . . ) ;

    ALTER TABLE emp

    ADD CONSTRAINT emp.pk PRIMARY KEY (empno);

    An ALTER TABLE statement that defines and attempts to enable an integrity constraint

    can fail because existing rows of the table violate the integrity constraint. In this case,

    the statement is rolled back, and the constraint definition is not stored and not enabled.

    When enabling a UNIQUE or PRIMARY KEY constraint, an associated index is created.

    For details about the meaning of these states and an understanding of their

    consequences, refer to the Oracle Database SQL Language Reference. Some of these

    consequences are discussed here.

    Disabling Constraints: To enforce the rules defined by integrity constraints, the

    constraints should always be enabled. However, consider temporarily disabling the

    integrity constraints of a table for the following performance reasons:

    • When loading large amounts of data into a table;

    • When performing batch operations that make massive changes to a table (for

    example, changing every employee''s number by adding 1000 to the existing

    number); or

    • When importing or exporting one table at a time.

    In all three cases, temporarily disabling integrity constraints can improve the

    performance of the operation, especially in data warehouse configurations.

    It is possible to enter data that violates a constraint while that constraint is disabled.

    Thus, always enable the constraint after completing any of the operations listed in the

    preceding bullet list.

    Enabling Constraints: While a constraint is enabled, no row violating the constraint can

    be inserted into the table. However, while the constraint is disabled, such a row can be

    inserted. This row is known as an exception to the constraint. If the constraint is in the

    ENABLE, NOVALIDATE state, violations resulting from data entered while the constraint

    was disabled remain. The rows that violate the constraint must be either updated or

    deleted in order for the constraint to be put in the validated state.

    Can identify exceptions to a specific integrity constraint while attempting to enable the

    constraint. Refer to "Reporting Constraint Exceptions". All rows violating constraints are

    noted in an EXCEPTIONS table, which can be examined.

    ENABLE, NOVALIDATE Constraint State: When a constraint is in the ENABLE,

    NOVALIDATE state, all subsequent statements are checked for conformity to the

    constraint. However, any existing data in the table is not checked. A table with ENABLE,

    NOVALIDATE constraints can contain invalid data, but it is not possible to add new invalid

    data to it. Constraints in the ENABLE, NOVALIDATE state is most useful in data

    warehouse configurations that are uploading valid OLTP data.

    Enabling a constraint does not require validation. Enabling a constraint NOVALIDATE is

    much faster than enabling and validating a constraint. Also, validating a constraint that

    is already enabled does not require any DML locks during validation (unlike validating a

    previously disabled constraint). Enforcement guarantees that no violations are

    introduced during the validation. Hence, enabling without validating reduces the

    downtime typically associated with enabling a constraint.

    Efficient Use of Integrity Constraints: A Procedure: Using integrity constraint states in

    the following order can ensure the best benefits:

    • Disable state.

    • Perform the operation (load, export, import).

    • ENABLE, NOVALIDATE state.

    • Enable state.

    Some benefits of using constraints in this order are:

    • No locks are held.

    • All constraints can go to enable state concurrently.

    • Constraint enabling is done in parallel.

    • Concurrent activity on table is permitted.

    Setting Integrity Constraints Upon Definition: When an integrity constraint is defined in a

    CREATE TABLE or ALTER TABLE statement, it can be enabled, disabled, or validated or

    not validated as determined by the specification of the ENABLE/DISABLE clause. If the

    ENABLE/DISABLE clause is not specified in a constraint definition, the database

    automatically enables and validates the constraint.

    Disabling Constraints Upon Definition: The following CREATE TABLE and ALTER

    TABLE statements both define and disable integrity constraints:

    CREATE TABLE emp (

    empno NUMBER(5) PRIMARY KEY DISABLE, . . . ;

    ALTER TABLE emp

    ADD PRIMARY KEY (empno) DISABLE;

    An ALTER TABLE statement that defines and disables an integrity constraint never fails

    because of rows in the table that violate the integrity constraint. The definition of the

    constraint is allowed because its rule is not enforced.

    Enabling Constraints Upon Definition:

    The following CREATE TABLE and ALTER TABLE statements both define and enable

    integrity constraints:

    CREATE TABLE emp (

    empno NUMBER(5) CONSTRAINT emp.pk PRIMARY KEY, . . . ;

    ALTER TABLE emp

    ADD CONSTRAINT emp.pk PRIMARY KEY (empno);

    An ALTER TABLE statement that defines and attempts to enable an integrity constraint

    can fail because rows of the table violate the integrity constraint. If this case, the

    statement is rolled back, and the constraint definition is not stored and not enabled.'
  checks:
  - type: manual_review
    info: 'Review database management system (DBMS) code, settings, field definitions,

      constraints, and triggers to determine whether or not data being input into the database

      is validated.

      If code exists that allows invalid data to be acted upon or input into the database, this is

      a finding.

      If field definitions do not exist in the database, this is a finding.

      If fields do not contain enabled constraints where required, this is a finding.'
    severity: medium
- id: '1.87'
  title: O19C-00-018000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The database management system (DBMS) and associated applications must reserve the use of dynamic code execution
    for situations that require it. GROUP ID: V-270581 RULE ID: SV-270581r1065225'
  rationale: With respect to database management systems, one class of threat is known as SQL Injection, or more generally,
    code injection. It takes advantage of the dynamic execution capabilities of various programming languages, including dialects
    of SQL. In such cases, the attacker deduces the manner in which SQL statements are being processed, either from inside
    knowledge or by observing system behavior in response to invalid inputs. When the attacker identifies scenarios where
    SQL queries are being assembled by application code (which may be within the database or separate from it) and executed
    dynamically, the attacker is then able to craft input strings that subvert the intent of the query. Potentially, the attacker
    can gain unauthorized access to data, including security settings, and severely corrupt or destroy the database. The principal
    protection against code injection is not to use dynamic execution except where it provides necessary functionality that
    cannot be used otherwise. Use strongly typed data items rather than general-purpose strings as input parameters to taskspecific,
    precompiled stored procedures and functions (and triggers). This requires inspection of application source code, which
    will involve collaboration with the application developers. It is recognized that in many cases, the database administrator
    (DBA) is organizationally separate from the application developers, and may have limited, if any, access to source code.
    Nevertheless, protections of this type are so important to the secure operation of databases that they must not be ignored.
    At a minimum, the DBA must attempt to obtain assurances from the development organization that this issue has been addressed
    and must document what has been discovered.
  impact: ''
  references: []
  page_start: 221
  audit_raw: 'Review DBMS source code (stored procedures, functions, triggers) and application

    source code, to identify cases of dynamic code execution.

    If dynamic code execution is employed in circumstances where the objective could

    practically be satisfied by static execution with strongly typed parameters, this is a

    finding.'
  remediation: 'Where dynamic code execution is employed in circumstances where the objective could

    practically be satisfied by static execution with strongly typed parameters, modify the

    code to do so.'
  checks:
  - type: manual_review
    info: 'Review DBMS source code (stored procedures, functions, triggers) and application

      source code, to identify cases of dynamic code execution.

      If dynamic code execution is employed in circumstances where the objective could

      practically be satisfied by static execution with strongly typed parameters, this is a

      finding.'
    severity: medium
- id: '1.88'
  title: O19C-00-018100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The database management system (DBMS) and associated applications, when making use of dynamic code execution,
    must take steps against invalid values that may be used in a SQL injection attack, therefore resulting in steps to prevent
    a SQL injection attack. GROUP ID: V-270582 RULE ID: SV-270582r1065226'
  rationale: 'With respect to database management systems, one class of threat is known as SQL Injection, or more generally,
    code injection. It takes advantage of the dynamic execution capabilities of various programming languages, including dialects
    of SQL. In such cases, the attacker deduces the manner in which SQL statements are being processed, either from inside
    knowledge or by observing system behavior in response to invalid inputs. When the attacker identifies scenarios where
    SQL queries are being assembled by application code (which may be within the database or separate from it) and executed
    dynamically, the attacker is then able to craft input strings that subvert the intent of the query. Potentially, the attacker
    can gain unauthorized access to data, including security settings, and severely corrupt or destroy the database. The principal
    protection against code injection is not to use dynamic execution except where it provides necessary functionality that
    cannot be used otherwise. Use strongly typed data items rather than general purpose strings as input parameters to taskspecific,
    precompiled stored procedures and functions (and triggers). When dynamic execution is necessary, ways to mitigate the
    risk include the following, which should be implemented both in the on-screen application and at the database level, in
    the stored procedures: • Allow strings as input only when necessary. • Rely on data typing to validate numbers, dates,
    etc. Do not accept invalid values. If substituting other values for them, think carefully about whether this could be
    subverted. • Limit the size of input strings to what is truly necessary. • If single quotes/apostrophes, double quotes,
    semicolons, equals signs, angle brackets, or square brackets will never be valid as input, reject them. • If comment markers
    will never be valid as input, reject them. In SQL, these are - - or /* */ • If HTML and XML tags, entities, comments,
    etc., will never be valid, reject them. • If wildcards are present, reject them unless truly necessary. In SQL these are
    the underscore and the percentage sign, and the word ESCAPE is also a clue that wildcards are in use. • If SQL key words,
    such as SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, ESCAPE, UNION, GRANT, REVOKE, DENY, MODIFY will never be
    valid, reject them. Use case-insensitive comparisons when searching for these. Bear in mind that some of these words,
    particularly Grant (as a person''s name), could also be valid input. • If there are range limits on the values that may
    be entered, enforce those limits. • Institute procedures for inspection of programs for correct use of dynamic coding,
    by a party other than the developer. • Conduct rigorous testing of program modules that use dynamic coding, searching
    for ways to subvert the intended use. • Record the inspection and testing in the system documentation. • Bear in mind
    that all this applies not only to screen input, but also to the values in an incoming message to a web service or to a
    stored procedure called by a software component that has not itself been hardened in these ways. Not only can the caller
    be subject to such vulnerabilities; it may itself be the attacker. This requires for inspection of application source
    code, which will involve collaboration with the application developers. It is recognized that in many cases, the database
    administrator (DBA) is organizationally separate from the application developers, and may have limited, if any, access
    to source code. Nevertheless, protections of this type are so important to the secure operation of databases that they
    must not be ignored. At a minimum, the DBA must attempt to obtain assurances from the development organization that this
    issue has been addressed and must document what has been discovered.'
  impact: ''
  references: []
  page_start: 223
  audit_raw: 'Review DBMS source code (stored procedures, functions, triggers) and application

    source code to identify cases of dynamic code execution.

    If dynamic code execution is employed without protective measures against code

    injection, this is a finding.'
  remediation: 'Where dynamic code execution is used, modify the code to implement protections

    against code injection.'
  checks:
  - type: manual_review
    info: 'Review DBMS source code (stored procedures, functions, triggers) and application

      source code to identify cases of dynamic code execution.

      If dynamic code execution is employed without protective measures against code

      injection, this is a finding.'
    severity: medium
- id: '1.89'
  title: O19C-00-018300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must only generate error messages that provide information necessary for corrective actions
    without revealing organization-defined sensitive or potentially harmful information in error logs and administrative messages
    that could be exploited. GROUP ID: V-270583 RULE ID: SV-270583r1065027'
  rationale: Any database management system (DBMS) or associated application providing too much information in error messages
    on the screen or printout risks compromising the data and security of the system. The structure and content of error messages
    need to be carefully considered by the organization and development team. Databases can inadvertently provide a wealth
    of information to an attacker through improperly handled error messages. In addition to sensitive business or personal
    information, database errors can provide host names, IP addresses, usernames, and other system information not required
    for troubleshooting but very useful to someone targeting the system. Carefully consider the structure/content of error
    messages. The extent to which information systems are able to identify and handle error conditions is guided by organizational
    policy and operational requirements. Information that could be exploited by adversaries includes, for example, logon attempts
    with passwords entered by mistake as the username, mission/business information that can be derived from (if not stated
    explicitly by) information recorded, and personal information, such as account numbers, social security numbers, and credit
    card numbers. This requires for inspection of application source code, which will involve collaboration with the application
    developers. It is recognized that in many cases, the database administrator (DBA) is organizationally separate from the
    application developers, and may have limited, if any, access to source code. Nevertheless, protections of this type are
    so important to the secure operation of databases that they must not be ignored. At a minimum, the database administrator
    (DBA) must attempt to obtain assurances from the development organization that this issue has been addressed and must
    document what has been discovered. Out of the box, Oracle Database covers this. For example, if a user does not have access
    to a table, the error is just that the table or view does not exist. The Oracle Database is not going to display a Social
    Security Number in an error code unless an application is programmed to do so. Oracle applications will not expose the
    actual transactional data to a screen. The only way Oracle will capture this information is to enable specific logging
    levels. Custom code would require a review to ensure compliance.
  impact: ''
  references: []
  page_start: 226
  audit_raw: 'Check DBMS settings and custom database and application code to verify error

    messages do not contain information beyond what is needed for troubleshooting the

    issue.

    If database errors contain PII data, sensitive business data, or information useful for

    identifying the host system, this is a finding.'
  remediation: 'Configure DBMS and custom database and application code not to divulge sensitive

    information or information useful for system identification in error information.'
  checks:
  - type: manual_review
    info: 'Check DBMS settings and custom database and application code to verify error

      messages do not contain information beyond what is needed for troubleshooting the

      issue.

      If database errors contain PII data, sensitive business data, or information useful for

      identifying the host system, this is a finding.'
    severity: medium
- id: '1.90'
  title: O19C-00-018400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must restrict error messages so only authorized personnel may view them. GROUP ID: V-270584
    RULE ID: SV-270584r1065296'
  rationale: Any database management system (DBMS) or associated application providing too much information in error messages
    on the screen or printout risks compromising the data and security of the system. The structure and content of error messages
    need to be carefully considered by the organization and development team. Databases can inadvertently provide a wealth
    of information to an attacker through improperly handled error messages. In addition to sensitive business or personal
    information, database errors can provide host names, IP addresses, usernames, and other system information not required
    for troubleshooting but very useful to someone targeting the system. Carefully consider the structure/content of error
    messages. The extent to which information systems are able to identify and handle error conditions is guided by organizational
    policy and operational requirements. Information that could be exploited by adversaries includes, for example, logon attempts
    with passwords entered by mistake as the username, mission/business information that can be derived from (if not stated
    explicitly by) information recorded, and personal information, such as account numbers, social security numbers, and credit
    card numbers. This requires for inspection of application source code, which will involve collaboration with the application
    developers. It is recognized that in many cases, the database administrator (DBA) is organizationally separate from the
    application developers, and may have limited, if any, access to source code. Nevertheless, protections of this type are
    so important to the secure operation of databases that they must not be ignored. At a minimum, the DBA must attempt to
    obtain assurances from the development organization that this issue has been addressed and must document what has been
    discovered.
  impact: ''
  references: []
  page_start: 228
  audit_raw: 'Check DBMS settings and custom database code to determine if error messages are

    ever displayed to unauthorized individuals:

    • i) Review all end-user-facing applications that use the database, to determine

    whether they display any DBMS-generated error messages to general users. If

    they do, this is a finding.

    • ii) Review whether the database is accessible to users who are not authorized

    system administrators or database administrators, via the following types of

    software:

    o iia) Oracle SQL*Plus.

    o iib) Reporting and analysis tools.

    o iic) Database management and/or development tools, such as, but not

    limited to, Toad.

    o iid) Application development tools, such as, but not limited to, Oracle

    JDeveloper, Microsoft Visual Studio, PowerBuilder, or Eclipse.

    If the answer to the preceding question (iia through iid) is Yes, inquire whether, for each

    role or individual with respect to each tool, this access is required to enable the user(s)

    to perform authorized job duties. If No, this is a finding. If Yes, continue:

    For each tool in use, determine whether it is capable of suppressing DBMS-generated

    error messages, and if it is, whether it is configured to do so.

    Determine whether the role or individual, with respect to each tool, needs to verify

    detailed DBMS-generated error messages.

    If No, and if the tool is not configured to suppress such messages, this is a finding.

    If Yes, determine whether the role/user''s need to verify such messages is documented

    in the system documentation. If so, this is not a finding. If not, this is a finding.'
  remediation: 'For each end-user-facing application that displays DBMS-generated error messages,

    configure or recode it to suppress these messages.

    If the application is coded in Oracle PL/SQL, the EXCEPTION block can be used to

    suppress or divert error messages. Most other programming languages provide

    comparable facilities, such as TRY ... CATCH.

    For each unauthorized user of each tool, remove the ability to access it. For each tool

    where access to DBMS error messages is not required and can be configured,

    suppress the messages. For each role/user that needs access to the error messages or

    needs a tool where the messages cannot be suppressed, document the need in the

    system documentation.'
  checks:
  - type: manual_review
    info: 'Check DBMS settings and custom database code to determine if error messages are

      ever displayed to unauthorized individuals:

      • i) Review all end-user-facing applications that use the database, to determine

      whether they display any DBMS-generated error messages to general users. If

      they do, this is a finding.

      • ii) Review whether the database is accessible to users who are not authorized

      system administrators or database administrators, via the following types of

      software:

      o iia) Oracle SQL*Plus.

      '
    severity: medium
- id: '1.91'
  title: O19C-00-018600
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database software must be evaluated and patched against newly found vulnerabilities. GROUP ID: V-270585
    RULE ID: SV-270585r1137667'
  rationale: Security flaws with software applications, including database management systems, are discovered daily. Vendors
    are constantly updating and patching their products to address newly discovered security vulnerabilities. Organizations
    (including any contractor to the organization) are required to promptly install security-relevant software updates (e.g.,
    patches, service packs, and hot fixes). Flaws discovered during security assessments, continuous monitoring, incident
    response activities, or information system error handling must also be addressed expeditiously. Organization-defined time
    periods for updating security-relevant software may vary based on a variety of factors including, for example, the security
    category of the information system or the criticality of the update (i.e., severity of the vulnerability related to the
    discovered flaw). This requirement will apply to software patch management solutions that are used to install patches
    across the enclave and also to applications themselves that are not part of that patch management solution. For example,
    many browsers today provide the capability to install their own patch software. Patch criticality, as well as system criticality,
    will vary. Therefore, the tactical situations regarding the patch management process will also vary. This means that the
    time period used must be a configurable parameter. Time frames for application of security-relevant software updates may
    be dependent upon the Information Assurance Vulnerability Management (IAVM) process. The application will be configured
    to check for and install security-relevant software updates within an identified time period from the availability of
    the update. The specific time period will be defined by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs).
  impact: ''
  references: []
  page_start: 231
  audit_raw: 'When the Quarterly CPU is released, check the CPU Notice and note the specific patch

    number for the system. Then, issue the following command:

    SELECT patch_id, source_version, action, status, description

    from dba_registry_sqlpatch;

    This will generate the patch levels for the home and any specific patches that have

    been applied to it.

    If the currently installed patch levels are lower than the latest, this is a finding.'
  remediation: 'Institute and adhere to policies and procedures to ensure that patches are consistently

    applied to the Oracle Database within the time allowed.

    Follow the instructions provided by Oracle to download and apply the appropriate

    security patches.

    Log on to My Oracle Support.

    Select patches and download the specific patch number and corresponding sha256

    checksum. Once the patch is downloaded to the server, check the sha256 checksum to

    make sure the patch is valid.

    To check the sha256 Checksum in Linux/Unix, the command is:

    $ sha256sum /home/myuser/test_file4

    09b4b51a60d6913b82e3353eef179969ad0968ff8acfb37ca891f04df67b93f0

    /home/myuser/test_file5

    Once the checksum is validated, apply the patch:

    $ cd $ORACLE_HOME

    $ opatch apply'
  checks:
  - type: sql
    command: SELECT patch_id, source_version, action, status, description
    severity: medium
    info: 'When the Quarterly CPU is released, check the CPU Notice and note the specific patch

      number for the system. Then, issue the following command:

      SELECT patch_id, source_version, action, status, description

      from dba_registry_sqlpatch;

