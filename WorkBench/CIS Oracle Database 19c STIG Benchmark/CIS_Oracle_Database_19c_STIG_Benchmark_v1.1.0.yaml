    Check database management system (DBMS) settings, OS settings, and/or enterpriselevel authentication/access mechanisms
    settings to determine if the site uses a

    mechanism whereby temporary are terminated after a 72-hour time period. If not, this is

    a finding.'
  remediation: 'If using database mechanisms to satisfy this requirement, use a profile with a distinctive

    name (for example, TEMPORARY_USERS), so that temporary users can be easily

    identified. Whenever a temporary user account is created, assign it to this profile.

    Create a job to lock accounts under this profile that are more than 72 hours old.'
