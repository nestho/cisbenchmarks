- id: '1.41'
  title: O19C-00-010500
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle _TRACE_FILES_PUBLIC parameter if present must be set to FALSE. GROUP ID: V-270535 RULE ID: SV-270535r1065307'
  rationale: The _TRACE_FILES_PUBLIC parameter is used to make trace files used for debugging database applications and events
    available to all database users. Use of this capability precludes the discrete assignment of privileges based on job function.
    Additionally, its use may provide access to external files and data to unauthorized users.
  impact: ''
  references: []
  page_start: 112
  audit_raw: 'From SQL*Plus:

    select value

    from v$parameter

    where name = ''_trace_files_public'';

    If the value returned is TRUE, this is a finding.

    If the parameter does not exist or is set to FALSE, this is not a finding.'
  remediation: 'From SQL*Plus (shutdown database instance):

    shutdown immediate

    From SQL*Plus (create a pfile from spfile):

    create pfile=''[PATH]init[SID].ora'' from spfile;

    Edit the init[SID].ora file and remove the following line:

    *._trace_files_public=TRUE

    From SQL*Plus (update the spfile using the pfile):

    create spfile from pfile=''[PATH]init[SID].ora'';

    From SQL*Plus (start the database instance):

    startup

    Note: [PATH] depends on the platform (Windows or Unix).

    Ensure the file is directed to a writable location.

    [SID] is equal to the oracle SID or database instance ID.'
  checks:
  - type: sql
    command: select value
    severity: medium
    info: 'From SQL*Plus:

      select value

      from v$parameter

      where name = ''_trace_files_public'';

      If the value returned is TRUE, this is a finding.

      If the parameter does not exist or is set to FALSE, this is not a finding.'
- id: '1.42'
  title: O19C-00-010600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database production application and data directories must be protected from developers on shared production/development
    database management system (DBMS) host systems. GROUP ID: V-270536 RULE ID: SV-270536r1064886'
  rationale: Developer roles must not be assigned DBMS administrative privileges to production DBMS application and data directories.
    The separation of production database administrator (DBA) and developer roles helps protect the production system from
    unauthorized, malicious, or unintentional interruption due to development activities.
  impact: ''
  references: []
  page_start: 114
  audit_raw: 'If the DBMS or DBMS host is not shared by production and development activities, this

    check is not a finding.

    Review OS DBA group membership.

    If any developer accounts, as identified in the system documentation, have been

    assigned DBA privileges, this is a finding.

    Note: Though shared production/nonproduction DBMS installations was allowed under

    previous database STIG guidance, doing so may place it in violation of OS, Application,

    Network, or Enclave STIG guidance. Ensure that any shared production/nonproduction

    DBMS installation meets STIG guidance requirements at all levels or mitigates any

    conflicts in STIG guidance with the authorizing official (AO).'
  remediation: 'Create separate DBMS host OS groups for developer and production DBAs.

    Do not assign production DBA OS group membership to accounts used for

    development.

    Remove development accounts from production DBA OS group membership.

    Recommend establishing a dedicated DBMS host for production DBMS installations. A

    dedicated host system in this case refers to an instance of the operating system at a

    minimum. The operating system may reside on a virtual host machine where supported

    by the DBMS vendor.'
  checks:
  - type: manual_review
    info: 'If the DBMS or DBMS host is not shared by production and development activities, this

      check is not a finding.

      Review OS DBA group membership.

      If any developer accounts, as identified in the system documentation, have been

