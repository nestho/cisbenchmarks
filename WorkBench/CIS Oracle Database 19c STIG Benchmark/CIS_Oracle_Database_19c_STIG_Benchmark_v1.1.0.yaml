- id: '1.26'
  title: O19C-00-008400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must be configured in accordance with the security configuration settings based on DOD security
    configuration and implementation guidance, including STIGs, NSA configuration guides, CTOs, DTMs, and IAVMs. GROUP ID:
    V-270520 RULE ID: SV-270520r1115964'
  rationale: Configuring the database management system (DBMS) to implement organizationwide security implementation guides
    and security checklists ensures compliance with federal standards and establishes a common security baseline across DOD
    that reflects the most restrictive security posture consistent with operational requirements. In addition to this SRG,
    sources of guidance on security and information assurance exist. These include NSA configuration guides, CTOs, DTMs, and
    IAVMs. Oracle Database must be configured in compliance with guidance from all such relevant sources, with specific emphasis
    on the database security standards of each organization.
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'Oracle Database Security Assessment Tool (DBSAT) provides prioritized

    recommendations on how to mitigate identified security risks or gaps within Oracle

    Databases.

    With DBSAT, DISA STIG rules that are process-related, such as review system

    documentation to identify accounts authorized to own database objects, are now

    included, and marked as "Evaluate" and display details that help customers validate

    compliance. DBSAT automates the STIG checks whenever possible, and if the checks

    are process-related, DBSAT provides visibility so they can be tracked and manually

    validated.

    Download the latest version of the Oracle Database Security Assessment Tool

    (DBSAT). DBSAT is provided by Oracle at no additional cost:

    https://www.oracle.com/database/technologies/security/dbsat.html

    DBSAT analyzes information on the database and listener configuration to identify

    configuration settings that may unnecessarily introduce risk. DBSAT goes beyond

    simple configuration checking, examining user accounts, privilege and role grants,

    authorization control, separation of duties, fine-grained access control, data encryption

    and key management, auditing policies, and OS file permissions. DBSAT applies rules

    to quickly assess the current security status of a database and produce findings in all

    the areas above.

    In addition, to the Oracle database STIG checks, DBSAT helps identify areas where

    your database configuration, operation, or implementation introduces risks and

    recommends changes and controls to mitigate those risks according Oracle database

    security best practices.

    If there is evidence that the DBSAT tool is not used with the output reviewed regularly

    (annually), this is a finding.'
  remediation: 'For each finding, DBSAT recommends remediation activities that follow best practices

    to reduce or mitigate risk. Review the security status, provided by the DBSAT report,

    check the categories (sections) and review the findings by risk level and

    recommendations. For each recommendation, each organization must determine which

    remediation activities to implement according to their security policies.'
  checks:
  - type: manual_review
    info: 'Oracle Database Security Assessment Tool (DBSAT) provides prioritized

      recommendations on how to mitigate identified security risks or gaps within Oracle

      Databases.

      With DBSAT, DISA STIG rules that are process-related, such as review system

      documentation to identify accounts authorized to own database objects, are now

      included, and marked as "Evaluate" and display details that help customers validate

      compliance. DBSAT automates the STIG checks whenever possible, and if the checks

      are process-rela'
    severity: medium
- id: '1.27'
  title: O19C-00-008600
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle instance names must not contain Oracle version numbers. GROUP ID: V-270521 RULE ID: SV-270521r1112467'
  rationale: Service names may be discovered by unauthenticated users. If the service name includes version numbers or other
    database product information, a malicious user may use that information to develop a targeted attack.
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'If using a non-CDB database:

    From SQL*Plus:

    select instance_name, version from v$instance;

    If using a CDB database:

    To check the container database (CDB):

    From SQL*Plus:

    select instance_name, version from v$instance;

    To check the pluggable databases (PDBs) within the CDB:

    select name from v$pdbs;

    Check Instance Name:

    If the instance name returned references the Oracle release number, this is a finding.

    Numbers used that include version numbers by coincidence are not a finding.

    The database administrator (DBA) should be able to relate the significance of the

    presence of a digit in the SID.'
  remediation: 'Follow the instructions in Oracle MetaLink Note 15390.1 (and related documents) to

    change the SID for the database without recreating the database to a value that does

    not identify the Oracle version.'
  checks:
  - type: sql
    command: select instance_name, version from v$instance;
    severity: medium
    info: 'If using a non-CDB database:

      From SQL*Plus:

      select instance_name, version from v$instance;

      If using a CDB database:

      To check the container database (CDB):

      From SQL*Plus:

      select instance_name, version from v$instance;

      To check the pluggable databases (PDBs) within the CDB:

      select name from v$pdbs;

      Check Instance Name:

      If the instance name returned references the Oracle release number, this is a fin'
- id: '1.28'
  title: O19C-00-008700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Fixed user and PUBLIC Database links must be authorized for use. GROUP ID: V-270522 RULE ID: SV-270522r1115956'
  rationale: Database links define connections that may be used by the local Oracle database to access remote Oracle databases
    (homogenous links) and non-Oracle Databases (heterogeneous links). These links provide a means for a compromise to the
    local database to spread to remote databases and for a compromise of a remote database to the local database in a distributed
    database environment. Limiting or eliminating the use of database links, where they are not required to support the operational
    system, can help isolate compromises, mitigate risk, and reduce the potential attack surface.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'If using a non-CDB database: Use the following query to get a list of database links.

    From SQL*Plus:

    select owner||'': ''||db_link from dba_db_links;

    If using a CDB database:

    Use the following query to get a list of database links.

    select con_id_to_con_name(con_id) con_id, owner, db_link, username, host from

    cdb_db_links order by 1,2,3;

    Check Results:

    If no rows are returned from the first SQL statement, this check is not a finding.

    If there are rows returned, verify the database links are required. If they are required

    and exist, this is not a finding.'
  remediation: 'Document all authorized connections from the database to remote databases.

    Remove all unauthorized remote database connection definitions from the database.

    From SQL*Plus:

    drop database link [link name];

    OR

    drop public database link [link name];

    Review remote database connection definitions periodically and confirm their use is still

    required and authorized.'
  checks:
  - type: sql
    command: 'select owner||'': ''||db_link from dba_db_links;'
    severity: medium
    info: 'If using a non-CDB database: Use the following query to get a list of database links.

      From SQL*Plus:

      select owner||'': ''||db_link from dba_db_links;

      If using a CDB database:

      Use the following query to get a list of database links.

      select con_id_to_con_name(con_id) con_id, owner, db_link, username, host from

      cdb_db_links order by 1,2,3;

      Check Results:

      If no rows are returned from the first SQL state'
- id: '1.29'
  title: O19C-00-009000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle WITH GRANT OPTION privilege must be limited when granted to nondatabase administrator (DBA) or
    nonapplication administrator user accounts. GROUP ID: V-270523 RULE ID: SV-270523r1167746'
  rationale: Specifying WITH GRANT OPTION enables the grantee to grant the object privileges to other users and roles. An
    account permission to grant privileges within the database is an administrative function. Minimizing the number and privileges
    of administrative accounts reduces the chances of privileged account exploitation. Application user accounts limit WITH
    GRANT OPTION privileges since, by definition, they require only privileges to execute procedures or view/edit data.
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'Execute the query:

    select grantee||'': ''||owner||''.''||table_name

    from dba_tab_privs

    where grantable = ''YES''

    and grantee not in (select distinct owner from dba_objects)

    and grantee not in (select grantee from dba_role_privs where granted_role =

    ''DBA'')

    and table_name not like ''SYS_PLSQL_%''

    order by grantee;

    If any accounts are listed, verify accounts are documented and approved for the WITH

    GRANT option.

    If non-DBA interactive user or application accounts have WITH GRANT without being

    documented and approved, this is a finding.'
  remediation: 'Revoke privileges granted the WITH GRANT OPTION from non-DBA and accounts that

    do not own application objects or document the need for WITH GRANT OPTION and get

    approval.

    Re-grant privileges without specifying WITH GRANT OPTION.

    Note: Do not revoke the system-generated grants such as those found on SYS_PLSQL_%

    objects. They are system generated object types (aka ShadowTypes), created internally

    by Oracle when using the Pipelined Table Functions. This can result in (incorrect)

    compilation failures and/or invalidations when the users who are supposed to have

    access to the shadow types find themselves without access.'
  checks:
  - type: sql
    command: 'select grantee||'': ''||owner||''.''||table_name'
    severity: medium
    info: 'Execute the query:

      select grantee||'': ''||owner||''.''||table_name

      from dba_tab_privs

      where grantable = ''YES''

      and grantee not in (select distinct owner from dba_objects)

      and grantee not in (select grantee from dba_role_privs where granted_role =

      ''DBA'')

      and table_name not like ''SYS_PLSQL_%''

      order by grantee;

      If any accounts are listed, verify accounts are documented and approved for the WITH

      GRANT opt'
- id: '1.30'
  title: O19C-00-009200
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle REMOTE_OS_ROLES parameter must be set to FALSE. GROUP ID: V-270524 RULE ID: SV-270524r1112471'
  rationale: Setting REMOTE_OS_ROLES to TRUE allows operating system groups to control Oracle roles. The default value of
    FALSE causes roles to be identified and managed by the database. If REMOTE_OS_ROLES is set to TRUE, a remote user could
    impersonate another operating system user over a network connection. DOD requires the REMOTE_OS_ROLES to be set to FALSE.
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'To verify the current status of the remote_os_roles parameter use the SQL statement:

    If using a non-CDB database:

    From SQL*Plus:

    COLUMN name format a20

    COLUMN parameter_value format a20

    SELECT name, con_id, value AS PARAMETER_VALUE

    FROM sys.v_$parameter

    WHERE vp.name = ''remote_os_roles''

    ORDER BY 1;

    If the PARAMETER_VALUE is not FALSE, that is a finding.

    If using a CDB database:

    From SQL*Plus (in the CDB database):

    COLUMN name format a20

    COLUMN parameter_value format a20

    SELECT name, inst_id, con_id, value AS PARAMETER_VALUE

    FROM sys.gv_$parameter

    WHERE vp.name = ''remote_os_roles''

    ORDER BY 1;

    In the CDB database, if the PARAMETER_VALUE is not FALSE, that is a finding.'
  remediation: 'Set the parameter to FALSE for all instances. If using Oracle Multitenant, set the value to

    FALSE for the container database and all pluggable databases will be set to FALSE as

    well.

    ALTER SYSTEM SET remote_os_roles = FALSE scope=spfile;

    sid=''container_name'' is optional

    Restart the database for the change to take effect.'
  checks:
