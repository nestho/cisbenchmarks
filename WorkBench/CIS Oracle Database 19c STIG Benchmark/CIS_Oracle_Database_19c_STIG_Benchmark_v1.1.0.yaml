      database(s).

      On Unix Systems:

      ls -ld [pathname]

      Replace [pathname] with the directory path where the Oracle Database software is

      installed (e.g., /u01/app/oracle/product/19.0.0/dbhome_1).

      If permissions are granted for world access, this is a finding.

      If any groups that include members other than the software ow'
- id: '1.19'
  title: O19C-00-007400
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database products must be a version supported by the vendor. GROUP ID: V-270513 RULE ID: SV-270513r1138543'
  rationale: Unsupported commercial and database systems should not be used because fixes to newly identified bugs will not
    be implemented by the vendor. The lack of support can result in potential vulnerabilities. Systems at unsupported servicing
    levels or releases will not receive security updates for new vulnerabilities, which leaves them subject to exploitation.
    When maintenance updates and patches are no longer available, the database software is no longer considered supported
    and should be upgraded or decommissioned.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'Review the system documentation and interview the database administrator.

    Identify all database software components.

    Review the version and release information.

    From SQL*Plus:

    Select version from v$instance;

    Access the vendor website or use other means to verify the version is still supported.

    Oracle Release schedule:

    https://support.oracle.com/knowledge/Oracle%20Database%20Products/742060_1.html

    If the Oracle version or any of the software components are not supported by the

    vendor, this is a finding.'
  remediation: 'Remove or decommission all unsupported software products.

    Upgrade unsupported DBMS or unsupported components to a supported version of the

    product.'
