      encryption is not configured, check with the database administ'
- id: '1.78'
  title: O19C-00-016100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must separate user functionality (including user interface services) from database management
    functionality. GROUP ID: V-270572 RULE ID: SV-270572r1137655'
  rationale: Information system management functionality includes functions necessary to administer databases, network components,
    workstations, or servers, and typically requires privileged user access. The separation of user functionality from information
    system management functionality is either physical or logical and is accomplished by using different computers, different
    central processing units, different instances of the operating system, different network addresses, combinations of these
    methods, or other methods, as appropriate. An example of this type of separation is observed in web administrative interfaces
    that use separate authentication methods for users of any other information system resources. This may include isolating
    the administrative interface on a different domain and with additional access controls. If administrative functionality
    or information regarding database management system (DBMS) management is presented on an interface available for users,
    information on DBMS settings may be inadvertently made available to the user.
  impact: ''
  references: []
  page_start: 200
  audit_raw: 'Check DBMS settings and vendor documentation to verify administrative functionality is

    separate from user functionality.

    If administrator and general user functionality is not separated either physically or

    logically, this is a finding.'
  remediation: 'Configure DBMS settings to separate database administration and general user

    functionality. Provide those who have both administrative and general-user

    responsibilities with separate accounts for these separate functions.

    This includes separation of duties for administrative users, schema owners, and

    application (general) users. Oracle''s recommendation is Oracle Database Vault to solve

    this problem.

    Oracle Database Vault provides controls to prevent unauthorized privileged users from

    accessing sensitive data and to prevent unauthorized database changes. Oracle

    Database Vault provides database roles that enable different users to perform specific

    tasks, based on separation-of-duty guidelines. One of the biggest benefits resulting from

    regulatory compliance has been security awareness. Oracle Database Vault helps

    DBAs design flexible security policies for their database.'
  checks:
  - type: manual_review
    info: 'Check DBMS settings and vendor documentation to verify administrative functionality is

      separate from user functionality.

      If administrator and general user functionality is not separated either physically or

      logically, this is a finding.'
    severity: medium
- id: '1.79'
  title: O19C-00-016700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must preserve any organization-defined system state information in the event of a system failure.
    GROUP ID: V-270573 RULE ID: SV-270573r1064997'
  rationale: Failure in a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure in a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. Preserving information system state information
    helps to facilitate system restart and return to the operational mode of the organization with less disruption of mission/business
    processes.
  impact: ''
  references: []
  page_start: 202
  audit_raw: 'If the database is used solely for transient data (such as one dedicated to ExtractTransform-Load [ETL]), and
    a clear plan exists for the recovery of the database by

    means other than archiving, this is not a finding.

    If it has been determined that up-to-the second recovery is not necessary and this fact

    is recorded in the system documentation, with appropriate approval, this is not a finding.

    Check database management system (DBMS) settings to determine whether system

    state information is being preserved in the event of a system failure.

    The necessary state information is defined as "information necessary to determine

    cause of failure and to return to operations with least disruption to mission/business

    processes".

    Oracle creates what is known as archive logs. Archive logs contain information required

    to replay a transaction should something happen. The redo logs are also used to copy

    transactions or pieces of transactions.

    Issue the following commands to check the status of archive log mode:

    $ sqlplus connect as sysdba --Check current archivelog mode in database

    SQL> archive log list

    Database log mode Archive Mode

    Automatic archival Enabled

    Archive destination /home/oracle/app/oracle/arc2/ORCL

    Oldest online log sequence 433

    Next log sequence to archive 435

    Current log sequence 435

    If archive log mode is not enabled, this is a finding.'
  remediation: 'Configure DBMS settings to preserve all required system state information in the event

    of a system failure.

    If the database is not in archive log mode, issue the following commands to put the

    database in archive log mode. The database must be normally shutdown and restarted

    before it can be placed in archive log mode.

    $ sqlplus connect as sysdba -- stop and dismount database and shutdown

    instance.

    SQL> shutdown immediate;

    Database closed.

    Database dismounted.

    ORACLE instance shut down.

    SQL> startup mount; -- Restart instance.

    ORACLE instance started.

    Total System Global Area 1653518336 bytes

    Fixed Size 2228904 bytes

    Variable Size 1325403480 bytes

    Database Buffers 318767104 bytes

    Redo Buffers 7118848 bytes

    Database mounted.

    SQL> alter database archivelog; -- Enable ArchiveLog

    Database altered.

    SQL> alter database open; -- Re-open database

    Database altered.

    Issue the following command to verify the new status:

    SQL> select log_mode from v$database;

    LOG_MODE

    ------------

    ARCHIVELOG

    SQL> archive log list;

    Database log mode Archive Mode

    Automatic archival Enabled

    Archive destination USE_DB_RECOVERY_FILE_DEST

    Oldest online log sequence 294

    Next log sequence to archive 296

    Current log sequence 296

    The database is now in archive log mode, and transactions are either being recorded to

    transport to another database or being reapplied if the database becomes corrupt and

    needs to be restored from the last backup. Use the redo logs to replay transactions not

    captured in the backup.'
  checks:
  - type: manual_review
    info: 'If the database is used solely for transient data (such as one dedicated to ExtractTransform-Load [ETL]), and a
      clear plan exists for the recovery of the database by

      means other than archiving, this is not a finding.

      If it has been determined that up-to-the second recovery is not necessary and this fact

      is recorded in the system documentation, with appropriate approval, this is not a finding.

      Check database management system (DBMS) settings to determine whether system

      state information is being '
    severity: medium
- id: '1.80'
  title: O19C-00-016800
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database must take needed steps to protect data at rest and ensure confidentiality and integrity of
    application data. GROUP ID: V-270574 RULE ID: SV-270574r1065000'
  rationale: This control is intended to address the confidentiality and integrity of information at rest in nonmobile devices
    and covers user information and system information. Information at rest refers to the state of information when it is
    located on a secondary storage device (e.g., disk drive, tape drive) within an organizational information system. Applications
    and application users generate information throughout the course of their application use. User-generated data and application-specific
    configuration data both need to be protected. Configurations and/or rule sets for firewalls, gateways, intrusion detection/prevention
    systems, and filtering routers and authenticator content are examples of system information likely requiring protection.
    Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as appropriate.
    If the confidentiality and integrity of application data is not protected, the data will be open to compromise and unauthorized
    modification.
  impact: ''
  references: []
  page_start: 205
  audit_raw: 'If the application owner and authorizing official (AO) have determined that encryption of

    data at rest is not required, this is not a finding.

    Review database management system (DBMS) settings to determine whether controls

    exist to protect the confidentiality and integrity of data at rest in the database.

    If controls do not exist or are not enabled, this is a finding.

    To ensure that the appropriate controls are in place, discuss the precautions taken with

    the site database administrators (DBAs) and system administrators (SAs) and try to

    modify data at rest.

    Oracle recommends using Transparent Data Encryption, which is part of Oracle

    Advanced Security Option, to protect data.

    To check to verify the data is encrypted, for example, upon an auditor''s request Oracle

    provides views that document the encryption status of the database. For TDE column

    encryption, use the view "dba_encrypted_columns", which lists the owner, table name,

    column name, encryption algorithm, and salt for all encrypted columns. For TDE

    tablespace encryption, the following SQL statement lists all encrypted tablespaces with

    their encryption algorithm and corresponding, encrypted, data files. Issue the following

    commands to check to verify the data at rest is encrypted.

    $ sqlplus connect as sysdba

    SQL> SELECT t.name "TSName",

    e.encryptionalg "Algorithm",

    d.file_name "File Name"

    FROM v$tablespace t,

    v$encrypted_tablespaces e,

    dba_data_files d

    WHERE t.ts# = e.ts#

    and t.name = d.tablespace_name;

    The next SQL statement lists the table owner, tables within encrypted tablespaces, and

    the encryption algorithm:

    SQL> SELECT a.owner "Owner",

    a.table_name "Table Name",

    e.encryptionalg "Algorithm"

    FROM dba_tables a,

    v$encrypted_tablespaces e

    WHERE a.tablespace_name in (select t.name from v$tablespace t,

    v$encrypted_tablespaces e where t.ts# = e.ts#);'
  remediation: 'Apply appropriate controls to protect the confidentiality and integrity of data at rest in the

    database.

    If no site-specific precautions are in place, use Oracle Advanced Security Option to

    encrypt data at rest.

    If Oracle Advanced Security Option is not an option, use site-specific procedures to

    secure data at rest.'
  checks:
  - type: sql
    command: SELECT t.name "TSName",
    severity: medium
    info: 'If the application owner and authorizing official (AO) have determined that encryption of

      data at rest is not required, this is not a finding.

      Review database management system (DBMS) settings to determine whether controls

      exist to protect the confidentiality and integrity of data at rest in the database.

      If controls do not exist or are not enabled, this is a finding.

      To ensure that the appropriat'
- id: '1.81'
  title: O19C-00-016900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must implement cryptographic mechanisms to prevent unauthorized modification of organization-defined
    information at rest (to include, at a minimum, PII and classified information) on organization-defined information system
    components. GROUP ID: V-270575 RULE ID: SV-270575r1065003'
  rationale: Database management systems (DBMSs) handling data requiring data at rest protections must employ cryptographic
    mechanisms to prevent unauthorized disclosure and modification of the information at rest. These cryptographic mechanisms
    may be native to the DBMS or implemented via additional software or operating system/file system settings, as appropriate
    to the situation. Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational
    information. The strength of the mechanism is commensurate with the security category and/or classification of the information.
    Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or
    encrypt specific data structures (e.g., files, records, or fields). The decision whether and what to encrypt rests with
    the data owner and is also influenced by the physical measures taken to secure the equipment and media on which the information
    resides.
  impact: ''
  references: []
  page_start: 207
  audit_raw: 'Review the system documentation to determine whether the organization has defined

    the information at rest that is to be protected from modification, which must include, at a

    minimum, PII and classified information.

    If no information is identified as requiring such protection, this is not a finding.

    Review the configuration of the DBMS, operating system/file system, and additional

    software as relevant.

    If any of the information defined as requiring cryptographic protection from modification

    is not encrypted in a manner that provides the required level of protection, this is a

    finding.'
  remediation: 'Configure the DBMS, operating system/file system, and additional software as relevant,

    to provide the required level of cryptographic protection.'
  checks:
  - type: manual_review
    info: 'Review the system documentation to determine whether the organization has defined

      the information at rest that is to be protected from modification, which must include, at a

      minimum, PII and classified information.

      If no information is identified as requiring such protection, this is not a finding.

      Review the configuration of the DBMS, operating system/file system, and additional

      software as relevant.

      If any of the information defined as requiring cryptographic protection from modification

      is no'
    severity: medium
- id: '1.82'
  title: O19C-00-017100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must isolate security functions from nonsecurity functions by means of separate security domains.
    GROUP ID: V-270576 RULE ID: SV-270576r1065006'
  rationale: An isolation boundary provides access control and protects the integrity of the hardware, software, and firmware
    that perform security functions. Security functions are the hardware, software, and/or firmware of the information system
    responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection
    is based. Developers and implementers can increase the assurance in security functions by employing well-defined security
    policy models; structured, disciplined, and rigorous hardware and software development techniques; and sound system/security
    engineering principles. Database management systems (DBMSs) typically separate security functionality from nonsecurity
    functionality via separate databases or schemas. Database objects or code implementing security functionality should not
    be commingled with objects or code implementing application logic. When security and nonsecurity functionality are commingled,
    users who have access to nonsecurity functionality may be able to access security functionality.
  impact: ''
  references: []
  page_start: 209
  audit_raw: 'Check DBMS settings to determine whether objects or code implementing security

    functionality are located in a separate security domain, such as a separate database or

    schema created specifically for security functionality.

    If security-related database objects or code are not kept separate, this is a finding.

    The Oracle elements of security functionality, such as the roles, permissions, and

    profiles, along with password complexity requirements, are stored in separate schemas

    in the database. Review any site-specific applications security modules built into the

    database and determine what schema they are located in and take appropriate action.

    The Oracle objects will be in the Oracle Data Dictionary.'
  remediation: 'Locate security-related database objects and code in a separate database, schema, or

    other separate security domain from database objects and code implementing

    application logic. (This is the default behavior for Oracle.) Review any site-specific

    applications security modules built into the database: determine what schema they are

    located in and take appropriate action.'
  checks:
  - type: manual_review
    info: 'Check DBMS settings to determine whether objects or code implementing security

      functionality are located in a separate security domain, such as a separate database or

      schema created specifically for security functionality.

      If security-related database objects or code are not kept separate, this is a finding.

      The Oracle elements of security functionality, such as the roles, permissions, and

      profiles, along with password complexity requirements, are stored in separate schemas

      in the database. Revi'
