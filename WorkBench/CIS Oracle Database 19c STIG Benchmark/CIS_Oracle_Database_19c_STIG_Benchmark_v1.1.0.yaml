- id: '1.53'
  title: O19C-00-012100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must provide a mechanism to automatically remove or disable temporary user accounts after
    72 hours. GROUP ID: V-270547 RULE ID: SV-270547r1064919'
  rationale: Temporary application accounts could ostensibly be used in the event of a vendor support visit where a support
    representative requires a temporary unique account to perform diagnostic testing or conduct some other support related
    activity. When these types of accounts are created, there is a risk that the temporary account may remain in place and
    active after the support representative has left. To address this, in the event temporary application accounts are required,
    the application must ensure accounts designated as temporary in nature must automatically terminate these accounts after
    a period of 72 hours. Such a process and capability greatly reduces the risk that accounts will be misused, hijacked,
    or data compromised. Note that user authentication and account management should be done via an enterprise-wide mechanism
    whenever possible. Examples of enterprise-level authentication/access mechanisms include, but are not limited to, Active
    Directory and LDAP. This requirement applies to cases where it is necessary to have accounts directly managed by Oracle.
    Temporary database accounts must be automatically terminated after a 72-hour time period to mitigate the risk of the account
    being used beyond its original purpose or timeframe.
  impact: ''
  references: []
  page_start: 137
  audit_raw: 'If the organization has a policy, consistently enforced, forbidding the creation of

    emergency or temporary accounts, this is not a finding.

