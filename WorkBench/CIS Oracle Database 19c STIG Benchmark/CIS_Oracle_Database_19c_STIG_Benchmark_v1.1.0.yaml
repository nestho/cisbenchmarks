  title: O19C-00-015200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database, when using public key infrastructure (PKI)-based authentication, must enforce authorized
    access to the corresponding private key. GROUP ID: V-270566 RULE ID: SV-270566r1136923'
  rationale: The cornerstone of the PKI is the private key used to encrypt or digitally sign information. If the private key
    is stolen, this will lead to the compromise of the authentication and nonrepudiation gained through PKI because the attacker
    can use the private key to digitally sign documents and can pretend to be the authorized user. Both the holders of a digital
    certificate and the issuing authority must protect the computers, storage devices, or whatever they use to keep the private
    keys. All access to the private key of Oracle Database must be restricted to authorized and authenticated users. If unauthorized
    users have access to the database management system's (DBMS's) private key, an attacker could gain access to the primary
    key and use it to impersonate the database on the network. Transport Layer Security (TLS) is the successor protocol to
    Secure Sockets Layer (SSL). Although the Oracle configuration parameters have names including 'SSL', such as SSL_VERSION
    and SSL_CIPHER_SUITES, they refer to TLS.
