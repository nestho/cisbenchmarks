- id: '1.36'
  title: O19C-00-009800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Object permissions granted to PUBLIC must be restricted. GROUP ID: V-270530 RULE ID: SV-270530r1065320'
  rationale: Permissions on objects may be granted to the user group PUBLIC. Because every database user is a member of the
    PUBLIC group, granting object permissions to PUBLIC gives all users in the database access to that object. In a secure
    environment, granting object permissions to PUBLIC must be restricted to those objects that all users are allowed to access.
    The policy does not require object permissions assigned to PUBLIC by the installation of Oracle Database server components
    be revoked.
  impact: ''
  references: []
