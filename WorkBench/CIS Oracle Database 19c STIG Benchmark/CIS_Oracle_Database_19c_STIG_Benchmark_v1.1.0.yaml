    is a finding.

    The list of special accounts that are excluded from this requirement may not be

    complete. It is expected that the database administrator (DBA) will edit the list to suit

    local circumstances, adding other special accounts as necessary, and removing any

    that are not supposed to be in use in the Oracle deployment that is under review.'
  remediation: 'Create roles for administrative function assignments. Assign the necessary privileges

    for the administrative functions to a role. Do not assign administrative privileges directly

    to users, except for those that Oracle does not permit to be assigned via roles.'
