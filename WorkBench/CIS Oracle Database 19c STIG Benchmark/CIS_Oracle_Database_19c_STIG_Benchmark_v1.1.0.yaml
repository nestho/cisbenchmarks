  title: O19C-00-016000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database must implement NIST FIPS 140-2/140-3 validated cryptographic modules to protect unclassified
    information requiring confidentiality and cryptographic protection, in accordance with the data owner''s requirements.
    GROUP ID: V-270571 RULE ID: SV-270571r1137664'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The
    application must implement cryptographic modules adhering to the higher standards approved by the federal government since
    this provides assurance they have been tested and validated. It is the responsibility of the data owner to assess the
    cryptography requirements in light of applicable federal laws, Executive Orders, directives, policies, regulations, and
    standards. For detailed information, refer to NIST FIPS Publication 140-3, Security Requirements For Cryptographic Modules.
    Note that the product's cryptographic modules must be validated and certified by NIST as FIPS-compliant.
  impact: ''
  references: []
  page_start: 197
  audit_raw: 'If encryption is not required for the database, this is not a finding.

    If the database management system (DBMS) has not implemented federally required

    cryptographic protections for the level of classification of the data it contains, this is a

    finding.

    Check the following settings to verify FIPS 140-2/140-3 encryption is configured. If

    encryption is not configured, check with the database administrator (DBA) and system

    administrator (SA) to verify if other mechanisms or third-party products are deployed to

    encrypt data during the transmission or storage of data.

    For Transparent Data Encryption and DBMS_CRYPTO:

    To verify if Oracle is configured for FIPS 140 Transparent Data Encryption and/or

    DBMS_CRYPTO, enter the following SQL*Plus command:

    SHOW PARAMETER DBFIPS_140

    or the following SQL query:

    SELECT * FROM SYS.V$PARAMETER WHERE NAME = ''DBFIPS_140'';

    If Oracle returns the value "FALSE", or returns no rows, this is a finding.

    To verify if Oracle is configured for FIPS 140 Secure Sockets Layer (SSL)/Transport

    Layer Security (TLS) authentication and/or encryption:

