- id: '1.74'
  title: O19C-00-015400
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'When using command-line tools such as Oracle SQL*Plus, which can accept a plaintext password, users must use
    an alternative logon method that does not expose the password. GROUP ID: V-270568 RULE ID: SV-270568r1136925'
  rationale: The DOD standard for authentication is DOD-approved public key infrastructure (PKI) certificates. Normally, with
    PKI authentication, the interaction with the user for authentication will be handled by a software component separate
    from the database management system (DBMS), such as ActivIdentity ActivClient. However, in cases where the DBMS controls
    the interaction, this requirement applies. To prevent the compromise of authentication information such as passwords and
    PINs during the authentication process, the feedback from the system must not provide any information that would allow
    an unauthorized user to compromise the authentication mechanism. Obfuscation of user-provided authentication secrets when
    typed into the system is a method used in addressing this risk. Displaying asterisks when a user types in a password or
    a smart card PIN is an example of obscuring feedback of authentication secrets. This requires reviewing applications,
    which will involve collaboration with the application developers. It is recognized that in many cases, the database administrator
    (DBA) is organizationally separate from the application developers, and may have limited, if any, access to source code.
    Nevertheless, protections of this type are so important to the secure operation of databases that they must not be ignored.
    At a minimum, the DBA must attempt to obtain assurances from the development organization that this issue has been addressed
    and must document what has been discovered.
  impact: ''
