  description: 'Use of the Oracle Database installation account must be logged. GROUP ID: V-270537 RULE ID: SV-270537r1064889'
  rationale: The database management system (DBMS) installation account may be used by any authorized user to perform DBMS
    installation or maintenance. Without logging, accountability for actions attributed to the account is lost.
