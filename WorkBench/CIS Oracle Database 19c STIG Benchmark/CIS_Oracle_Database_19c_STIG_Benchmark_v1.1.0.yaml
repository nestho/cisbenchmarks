- id: '1.20'
  title: O19C-00-007700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database software, applications, and configuration files must be monitored to discover unauthorized changes.
    GROUP ID: V-270514 RULE ID: SV-270514r1064820'
  rationale: If the system were to allow any user to make changes to software libraries, then those changes might be implemented
    without undergoing the appropriate testing and approvals that are part of a robust change management process. Accordingly,
    only qualified and authorized individuals must be allowed to obtain access to information system components for purposes
    of initiating changes, including upgrades and modifications. Unmanaged changes that occur to the database software libraries
    or configuration can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 69
  audit_raw: 'Review monitoring procedures and implementation evidence to verify that monitoring of

    changes to database software libraries, related applications, and configuration files is

    done.

    Verify that the list of files and directories being monitored is complete. If monitoring does

    not occur or is not complete, this is a finding.'
  remediation: 'Implement procedures to monitor for unauthorized changes to database management

    system (DBMS) software libraries, related software application libraries, and

    configuration files. If a third-party automated tool is not employed, an automated job that

    reports file information on the directories and files of interest and compares them to the

    baseline report for the same will meet the requirement.

    File hashes or checksums should be used for comparisons since file dates may be

    manipulated by malicious users.'
  checks:
  - type: manual_review
    info: 'Review monitoring procedures and implementation evidence to verify that monitoring of

