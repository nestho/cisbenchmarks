- id: '1.92'
  title: O19C-00-019800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Database must, for password-based authentication, verify that when users create or update passwords,
    the passwords are not found on the list of commonly used, expected, or compromised passwords in IA-5 (1) (a). GROUP ID:
    V-270587 RULE ID: SV-270587r1112489'
  rationale: Password-based authentication applies to passwords regardless of whether they are used in single-factor or multifactor
    authentication (MFA). Long passwords or passphrases are preferable over shorter passwords. Enforced composition rules
    provide marginal security benefits while decreasing usability. However, organizations may choose to establish certain
    rules for password generation (e.g., minimum character length for long passwords) under certain circumstances and can
    enforce this requirement in IA-5(1)(h). Account recovery can occur, for example, in situations when a password is forgotten.
    Cryptographically protected passwords include salted one-way cryptographic hashes of passwords. The list of commonly used,
    compromised, or expected passwords includes passwords obtained from previous breach corpuses, dictionary words, and repetitive
    or sequential characters. The list includes contextspecific words, such as the name of the service, username, and derivatives
    thereof.
  impact: ''
  references: []
  page_start: 233
  audit_raw: 'Verify the database management system (DBMS) is configured to verify when users

    create or update passwords, that the passwords are not found on the list of commonly

    used, expected, or compromised passwords in IA-5 (1) (a).

    If all user accounts are authenticated by the OS or an enterprise-level

    authentication/access mechanism, and not by Oracle, this is not a finding.

    For each profile that can be applied to accounts where authentication is under Oracle''s

    control, determine the password verification function that is in use:

    SELECT * FROM SYS.DBA_PROFILES

    WHERE RESOURCE_NAME = ''PASSWORD_VERIFY_FUNCTION''

    ORDER BY PROFILE;

    Note: Profiles can inherit settings from another profile so some password functions

    could be set to DEFAULT. If so, review the DEFAULT profile function name.

    If the function name is null for any profile, this is a finding.

    Review the password verification functions specified for the

    PASSWORD_VERIFY_FUNCTION settings for each profile. Determine whether it is

    configured for when users create or update passwords, that the passwords are not

    found on the list of commonly-used, expected, or compromised passwords.

    If the verify_function is not configured to verify when users create or update passwords,

    that the passwords are not found on the list of commonly-used, expected, or

    compromised passwords in IA-5 (1) (a), this is a finding.'
  remediation: 'If any user accounts are managed by Oracle, develop, test, and implement a password

    verification function that enforces DOD requirements.

    Configure the password verify function to verify when users create or update

    passwords, that the passwords are not found on the list of commonly-used, expected, or

    compromised passwords in IA-5 (1) (a).

    Oracle supplies a sample function called ORA12C_STIG_VERIFY_FUNCTION. This can be

    used as the starting point for a customized function. The script file is found in the

    following location on the server depending on OS:

    Windows:

    %ORACLE_HOME%\RDBMS\ADMIN\catpvf.sql

    Unix/Linux:

    $ORACLE_HOME/rdbms/admin/catpvf.sql'
  checks:
  - type: sql
    command: SELECT * FROM SYS.DBA_PROFILES
    severity: medium
    info: 'Verify the database management system (DBMS) is configured to verify when users

      create or update passwords, that the passwords are not found on the list of commonly

      used, expected, or compromised passwords in IA-5 (1) (a).

      If all user accounts are authenticated by the OS or an enterprise-level

      authentication/access mechanism, and not by Oracle, this is not a finding.

