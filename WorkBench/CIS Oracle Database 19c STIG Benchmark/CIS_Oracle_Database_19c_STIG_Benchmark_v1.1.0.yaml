      If any accounts listed in the first list are also listed in the second list'
- id: '1.51'
  title: O19C-00-011900
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Oracle Database default accounts must be assigned custom passwords. GROUP ID: V-270545 RULE ID: SV-270545r1064913'
  rationale: Password maximum lifetime is the maximum period of time, (typically in days) a user's password may be in effect
    before the user is forced to change it. Passwords need to be changed at specific policy-based intervals as per policy.
    Any password, no matter how complex, can eventually be cracked. One method of minimizing this risk is to use complex passwords
    and periodically change them. If the application does not limit the lifetime of passwords and force users to change their
    passwords, there is the risk that the system and/or application passwords could be compromised. Database management system
    (DBMS) default passwords provide a commonly known and exploited means for unauthorized access to database installations.
  impact: ''
  references: []
  page_start: 131
  audit_raw: 'Use this query to identify the Oracle-supplied accounts that still have their default

    passwords:

    SELECT *

    FROM SYS.DBA_USERS_WITH_DEFPWD;

    If any accounts other than XS$NULL are listed, this is a finding.

    XS$NULL is an internal account that represents the absence of a user in a session.

    Because XS$NULL is not a user, this account can only be accessed by the Oracle

    Database instance. XS$NULL has no privileges and no one can authenticate as

    XS$NULL, nor can authentication credentials ever be assigned to XS$NULL.'
  remediation: 'Change passwords for database management system (DBMS) accounts to nondefault

    values. Where necessary, unlock or enable accounts to change the password, and then

    return the account to disabled or locked status.'
  checks:
  - type: sql
    command: SELECT *
