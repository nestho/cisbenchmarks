- id: '3.1'
  title: Validate Proxy Settings
  scoring: manual
  profile:
  - Level 1
  description: Firefox can be configured to use one or more proxy servers. When a proxy server is configured for a given protocol
    (HTTP, FTP, Gopher, etc), Firefox will send applicable requests to that proxy server for fulfillment. It is recommended
    that the list of proxy servers configured in Firefox be reviewed to ensure it contains only trusted proxy servers.
  rationale: Depending on the protocol used, the proxy server will have access to read and/or alter all information communicated
    between Firefox and the target server, such a web site.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Perform the following procedure:

    1. Drop down the Firefox menu

    2. Click on Options

    3. Select Options from the list

    4. Click on the Advanced Button in the Options window

    5. Click on Network Tab

    6. Click on Settings Button

    7. Ensure that the proxy listed (if any) is the one configured and approved by the

    enterprise.'
  remediation: 'Perform the following procedure:

    1. Drop down the Firefox menu

    2. Click on Options

    3. Select Options from the list

    4. Click on the Advanced Button in the Options window

    5. Click on Network Tab

    6. Click on Settings Button

    7. Ensure that the proxy listed (if any) is the one configured and approved by the

    enterprise.'
  checks:
  - type: sql
    command: Select Options from the list
    severity: medium
    info: 'Perform the following procedure:

      1. Drop down the Firefox menu

      2. Click on Options

      3. Select Options from the list

      4. Click on the Advanced Button in the Options window

      5. Click on Network Tab

      6. Click on Settings Button

      7. Ensure that the proxy listed (if any) is the one configured and approved by the

      enterprise.'
- id: '3.2'
  title: Do Not Send Cross SSL/TLS Referrer Header
  scoring: scored
  profile:
  - Level 2
  description: This preference dictates whether Firefox will send the URL of the SSL/TLS-protected referring site to the referred
    SSL/TLS protected site.
  rationale: The URL of the SSL-protected referring site may contain sensitive information. Preventing this URL from being
    sent mitigates the risk that the sensitive information will be disclosed.
  impact: Enabling this setting may negatively impact the functionality of websites that rely on receiving referrer information.
  references: []
  page_start: 27
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type network.http.sendSecureXSiteReferrer in the filter

    3. Ensure the preferences listed are set to the values specified below: ```

    network.http.sendSecureXSiteReferrer=false'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg: ```

    lockPref("network.http.sendSecureXSiteReferrer", false);'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

