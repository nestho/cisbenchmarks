- id: '2.4'
  title: Set Update Interval Time Checks
  scoring: scored
  profile:
  - Level 1
  description: This configuration sets the amount of time the system waits in between each check for updates.
  rationale: Frequent checks for updates will mitigate the risk that a system is left vulnerable to known risks for an extended
    period of time.
  impact: app.update.enabled must be set to true for this preference to take effect.
  references: []
  page_start: 21
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type app.update.interval in the filter

    3. Ensure the preferences listed are set to the values specified below: ```

    app.update.interval=43200'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg: ```

    lockPref("app.update.interval", 43200);'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

      1. Type about:config in the address bar

      2. Type app.update.interval in the filter

      3. Ensure the preferences listed are set to the values specified below: ```

      app.update.interval=43200'
    severity: medium
- id: '2.5'
  title: Set Update Wait Time Prompt
  scoring: scored
  profile:
  - Level 1
  description: This setting determines the amount of time, in seconds, which the system will wait before displaying the Software
    Update dialogue box (after an unobtrusive alert has already been shown).
  rationale: Encouraging the user to update software as soon as possible mitigates the risk that a system will be left vulnerable.
  impact: 1. For this preference to have an effect app.update.enabled must be true and app.update.silent must be false. 2.
    The full Software Update dialog is still subject toapp.update.idletime.
  references: []
  page_start: 22
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type app.update.promptWaitTime in the filter

    3. Ensure the preferences listed are set to the values specified below: ```

    app.update.promptWaitTime=172800'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg: ```

    lockPref("app.update.promptWaitTime", 172800);'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

      1. Type about:config in the address bar

      2. Type app.update.promptWaitTime in the filter

      3. Ensure the preferences listed are set to the values specified below: ```

