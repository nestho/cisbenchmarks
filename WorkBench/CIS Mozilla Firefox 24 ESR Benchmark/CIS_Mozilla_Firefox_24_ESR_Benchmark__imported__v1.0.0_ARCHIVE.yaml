- id: '3.4'
  title: Enable Warning For "Phishy" URLs
  scoring: scored
  profile:
  - Level 1
  description: It is possible to disguise a website's true location by making use of username/password syntax within the URL
    (known as "phishy URLs"). This setting will display a warning message whenever a user clicks a link to a phishy URL.
  rationale: This will protect against phishing.
  impact: ''
  references:
  - 1. http://dxr.mozilla.org/mozilla-central/search?q=%2Bfunctionref%3Amozilla%3A%3Anet%3A%3AnsHttpHandler%3A%3APhishyUserPassLen
  page_start: 29
  audit_raw: 'Perform the following procedure:

