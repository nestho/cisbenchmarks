- id: '2.1'
  title: Enable Automatic Updates
  scoring: scored
  profile:
  - Level 1
  description: This feature configures Firefox to automatically download and install updates as they are made available.
  rationale: Security updates ensure that users are safe from known software bugs and vulnerabilities.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type app.update.auto in the filter

    3. Ensure the preferences listed are set to the values specified below: ```

    app.update.enabled=true

    app.update.auto=true

    app.update.staging.enabled=true'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg: ```

    lockPref("app.update.enabled", true);

    lockPref("app.update.auto", true);

    lockPref("app.update.staging.enabled", true);'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

      1. Type about:config in the address bar

      2. Type app.update.auto in the filter

      3. Ensure the preferences listed are set to the values specified below: ```

      app.update.enabled=true

      app.update.auto=true

      app.update.staging.enabled=true'
    severity: medium
