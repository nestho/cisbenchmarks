- id: '4.1'
  title: Set SSL Override Behavior
  scoring: scored
  profile:
  - Level 2
  description: When Firefox encounters an invalid certificate and the user clicks "Add Exception", the chrome://pippki/content/exceptionDialog.xul
    dialog is shown. This dialog has a text box for a URL to fetch a certificate from and a "Get Certificate" button to fetch
    that certificate. This preference controls whether Firefox will or will not automatically fill in the URL text box and
    auto-fetch the certificate on behalf of the user. Setting this preference to 0 forces the user to enter a URL and click
    the "Get Certificate" button before adding an exception for an invalid cert.
  rationale: Requiring the user to manually enter the server's URL and fetch the certificate may provide additional opportunity
    to scrutinize the certificate before adding an exception for a potentially fraudulent certificate.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type browser.ssl\_override\_behavior in the filter

    3. Ensure the preferences listed are set to the values specified below: ```

    browser.ssl_override_behavior=0'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg: ```

    lockPref("browser.ssl_override_behavior", 0);'
