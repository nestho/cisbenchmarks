    162 | P a g e\n2. Select the cluster under test from the list of clusters, and ensure that Shielded GKE\nNodes are 'Enabled'\
    \ under the Details pane.\n1.1.1.6 Using Command Line:\nRun the following command:\ngcloud beta container clusters describe\
    \ $CLUSTER_NAME \\\n --format json | jq '.shieldedNodes'\nThis will return the following if Shielded GKE Nodes are enabled:\n\
    {\n \"enabled\": true\n}"
  remediation: "1.1.1.7 Using Google Cloud Console:\nTo update an existing cluster to use Shielded GKE nodes:\n1. Navigate\
