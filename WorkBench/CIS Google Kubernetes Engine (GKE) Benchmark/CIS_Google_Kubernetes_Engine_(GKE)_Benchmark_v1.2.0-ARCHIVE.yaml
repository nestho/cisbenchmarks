- id: 5.6.8
  title: Ensure use of Google-managed SSL Certificates
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Encrypt traffic to HTTPS load balancers using Google-managed SSL certificates.
  rationale: Encrypting traffic between users and your Kubernetes workload is fundamental to protecting data sent over the
    web. Google-managed SSL Certificates are provisioned, renewed, and managed for your domain names. This is only available
    for HTTPS load balancers created using Ingress Resources, and not TCP/UDP load balancers created using Service of type:LoadBalancer.
  impact: Google-managed SSL Certificates are less flexible than certificates you obtain and manage yourself. Managed certificates
    support a single, non-wildcard domain. Self-managed certificates can support wildcards and multiple subject alternative
    names (SANs).
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/managed-certs
