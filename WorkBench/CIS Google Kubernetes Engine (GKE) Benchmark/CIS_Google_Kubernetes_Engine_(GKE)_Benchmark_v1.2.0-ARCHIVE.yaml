- id: 5.1.4
  title: Minimize Container Registries to only those approved
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Use Binary Authorization to allowlist (whitelist) only approved container registries.
  rationale: Allowing unrestricted access to external container registries provides the opportunity for malicious or unapproved
    containers to be deployed into the cluster. Allowlisting only approved container registries reduces this risk. See also
    Recommendation 6.10.5.
  impact: All container images to be deployed to the cluster must be hosted within an approved container image registry. If
    public registries are not on the allowlist, a process for bringing commonly used container images into an approved private
    registry and keeping them up to date will be required.
  references:
  - 1. https://cloud.google.com/binary-authorization/docs/policy-yaml-reference
  page_start: 128
  audit_raw: "1.1.1.1 Using Google Cloud Console:\nCheck that Binary Authorization is enabled for the GKE cluster:\n1. Go\
    \ to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Click on the cluster and on the\
    \ Details pane, ensure that Binary Authorization is set\nto 'Enabled'.\nThen assess the contents of the policy:\n1. Go\
    \ to Binary Authorization by visiting\nhttps://console.cloud.google.com/security/binary-authorization\n2. Ensure the project\
    \ default rule is not set to 'Allow all images' under Policy\ndeployment rules.\n3. Review the list of 'Images exempt\
    \ from policy' for unauthorized container registries.\n128 | P a g e\n1.1.1.2 Using Command Line:\nCheck that Binary Authorization\
    \ is enabled for the GKE cluster:\ngcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --\nformat json\
    \ | jq .binaryAuthorization\nThis will return the following if Binary Authorization is enabled:\n{\n \"enabled\": true\n\
    }\nThen assess the contents of the policy:\ngcloud container binauthz policy export > current-policy.yaml\nEnsure that\
    \ the current policy is not configured to allow all images (evaluationMode:\nALWAYS_ALLOW).\nReview the list of admissionWhitelistPatterns\
    \ for unauthorized container registries.\ncat current-policy.yaml\nadmissionWhitelistPatterns:\n...\ndefaultAdmissionRule:\n\
    \ evaluationMode: ALWAYS_ALLOW"
  remediation: "1.1.1.3 Using Google Cloud Console:\n1. Go to Binary Authorization by visiting\nhttps://console.cloud.google.com/security/binary-authorization\n\
    2. Enable Binary Authorization API (if disabled)\n3. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    4. Select Kubernetes cluster for which Binary Authorization is disabled\n5. Click EDIT\n6. Set Binary Authorization to\
    \ 'Enabled'\n7. Click SAVE\n8. Return to the Binary Authorization by visiting\nhttps://console.cloud.google.com/security/binary-authorization\n\
    9. Set an appropriate policy for your cluster and enter the approved container\nregistries under 'Image paths'.\n129 |\
