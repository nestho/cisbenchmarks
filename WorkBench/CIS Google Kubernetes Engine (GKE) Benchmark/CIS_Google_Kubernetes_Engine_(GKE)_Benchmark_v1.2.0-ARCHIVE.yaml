    \ instead of these services in order to use Google\nmanaged SSL certificates.\nFor the ingresses within your cluster,\
    \ run the following command:\nkubectl get ingress -A -o json | jq .items[] | jq \\\n '{name: .metadata.name, annotations:\
    \ .metadata.annotations, namespace:\n.metadata.namespace, status: .status}'\nThe above command should return the name\
