- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The RBAC role cluster-admin provides wide-ranging powers over the environment and should be used only where
    and when needed.
  rationale: Kubernetes provides a set of default roles where RBAC is used. Some of these roles such as cluster-admin provide
    wide-ranging privileges which should only be applied where absolutely necessary. Roles such as cluster-admin allow super-user
    access to perform any action on any resource. When used in a ClusterRoleBinding, it gives full control over every resource
    in the cluster and in all namespaces. When used in a RoleBinding, it gives full control over every resource in the rolebinding's
    namespace, including the namespace itself.
  impact: 'Care should be taken before removing any clusterrolebindings from the environment to ensure they were not required
    for operation of the cluster. Specifically, modifications should not be made to clusterrolebindings with the system: prefix
    as they are required for the operation of system components.'
  references:
  - 1. https://kubernetes.io/docs/admin/authorization/rbac/#user-facing-roles
  page_start: 71
  audit_raw: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing the

    clusterrolebinding output for each role binding that has access to the cluster-admin

    role.

    kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

    Review each principal listed and ensure that cluster-admin privilege is required for it.'
  remediation: '71 | P a g e

    Identify all clusterrolebindings to the cluster-admin role. Check if they are used and if they

    need this role or if they could use a role with fewer privileges.

    Where possible, first bind users to a lower privileged role and then remove the

    clusterrolebinding to the cluster-admin role :

    kubectl delete clusterrolebinding [name]'
  checks:
  - type: manual_review
    info: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing the

      clusterrolebinding output for each role binding that has access to the cluster-admin

      role.

      kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

      Review each principal listed and ensure that cluster-admin privilege is required for it.'
    severity: medium
- id: 4.1.2
  title: Minimize access to secrets
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials
    used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users
    to reduce the risk of privilege escalation.
  rationale: Inappropriate access to secrets stored within the Kubernetes cluster can allow for an attacker to gain additional
    access to the Kubernetes cluster or external resources whose credentials are stored as secrets.
  impact: Care should be taken not to remove access to secrets to system components which require this for their operation
  references: []
  page_start: 73
  audit_raw: 'Review the users who have get, list or watch access to secrets objects in the Kubernetes

    API.'
  remediation: Where possible, remove get, list and watch access to secret objects in the cluster.
  checks:
  - type: manual_review
    info: 'Review the users who have get, list or watch access to secrets objects in the Kubernetes

      API.'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes Roles and ClusterRoles provide access to resources based on sets of objects and actions that can
    be taken on those objects. It is possible to set either of these to be the wildcard "*" which matches all items. Use of
    wildcards is not optimal from a security perspective as it may allow for inadvertent access to be granted when new resources
    are added to the Kubernetes API either as CRDs or in later versions of the product.
  rationale: The principle of least privilege recommends that users are provided only the access required for their role and
    nothing more. The use of wildcard rights grants is likely to provide excessive rights to the Kubernetes API.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Retrieve the roles defined across each namespaces in the cluster and review for wildcards

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Where possible replace any use of wildcards in clusterroles and roles with specific objects

    or actions.'
  checks:
  - type: manual_review
    info: 'Retrieve the roles defined across each namespaces in the cluster and review for wildcards

      kubectl get roles --all-namespaces -o yaml

      Retrieve the cluster roles defined in the cluster and review for wildcards

      kubectl get clusterroles -o yaml'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The ability to create pods in a namespace can provide a number of opportunities for privilege escalation, such
    as assigning privileged service accounts to these pods or mounting hostPaths with access to sensitive data (unless Pod
    Security Policies are implemented to restrict this access) As such, access to create new pods should be restricted to
    the smallest possible group of users.
  rationale: The ability to create pods in a cluster opens up possibilities for privilege escalation and should be restricted,
    where possible.
  impact: Care should be taken not to remove access to pods to system components which require this for their operation
  references: []
  page_start: 77
  audit_raw: Review the users who have create access to pod objects in the Kubernetes API.
  remediation: Where possible, remove create access to pod objects in the cluster.
  checks:
  - type: manual_review
    info: Review the users who have create access to pod objects in the Kubernetes API.
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used.
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: The default service account should not be used to ensure that rights granted to applications can be more easily
    audited and reviewed.
  rationale: Kubernetes provides a default service account which is used by cluster workloads where no specific service account
    is assigned to the pod. Where access to the Kubernetes API from a pod is required, a specific service account should be
    created for that pod, and rights granted to that service account. The default service account should be configured such
    that it does not provide a service account token and does not have any explicit rights assignments.
  impact: All workloads which require access to the Kubernetes API will require an explicit service account to be created.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 79
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service account

    and ensure that it has no roles or cluster roles bound to it apart from the defaults.

    Additionally ensure that the automountServiceAccountToken: false setting is in place for

    each default service account.'
  remediation: 'Create explicit service accounts wherever a Kubernetes workload requires specific access

    to the Kubernetes API server.

    Modify the configuration of each default service account to include this value

    automountServiceAccountToken: false'
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service account

      and ensure that it has no roles or cluster roles bound to it apart from the defaults.

      Additionally ensure that the automountServiceAccountToken: false setting is in place for

      each default service account.'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly
    needs to communicate with the API server
  rationale: Mounting service account tokens inside pods can provide an avenue for privilege escalation attacks where an attacker
    is able to compromise a single pod in the cluster. Avoiding mounting these tokens removes this attack avenue.
  impact: Pods mounted without service account tokens will not be able to communicate with the API server, except where the
    resource is available to unauthenticated principals.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 81
  audit_raw: 'Review pod and service account objects in the cluster and ensure that the option below is

    set, unless the resource explicitly requires this access.

    automountServiceAccountToken: false'
  remediation: 'Modify the definition of pods and service accounts which do not need to mount service

    account tokens to disable it.'
  checks:
  - type: manual_review
    info: 'Review pod and service account objects in the cluster and ensure that the option below is

      set, unless the resource explicitly requires this access.

      automountServiceAccountToken: false'
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Do not generally permit containers to be run with the securityContext.privileged flag set to true.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A container running with full
    privileges can do almost everything that the host can do. This flag exists to allow special use-cases, like manipulating
    the network stack and accessing devices. There should be at least one PodSecurityPolicy (PSP) defined which does not permit
    privileged containers. If you need to run privileged containers, this should be defined in a separate PSP and you should
    carefully check RBAC controls to ensure that only limited service accounts and users are given permission to access that
    PSP.
  impact: 'Pods defined with spec.containers[].securityContext.privileged: true will not be permitted.'
  references:
