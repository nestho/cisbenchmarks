    \ check that 'Boot disk\nencryption type' is set to 'Customer managed' with the desired key.\n213 | P a g e\nFOR ATTACHED\
    \ DISKS:\n1. Go to Compute Engine Disks by visiting\nhttps://console.cloud.google.com/compute/disks\n2. Select each disk\
    \ used by the cluster, and ensure the 'Encryption Type' is listed as\n'Customer Managed'.\n1.1.1.12 Using Command Line:\n\
    FOR NODE BOOT DISKS:\nRun this command:\ngcloud beta container node-pools describe [NODE_POOL_NAME] \\\n --cluster [CLUSTER_NAME]\n\
    Verify that the output of the above command includes a diskType of either pd-standard or\npd-ssd, and the bootDiskKmsKey\
    \ is specified as the desired key.\nFOR ATTACHED DISKS:\nIdentify the Persistent Volumes Used by the cluster:\nkubectl\
