    4. Click SAVE.\n1.1.1.8 Using Command Line:\nTo migrate an existing cluster, you will need to specify the --enable-shielded-nodes\
    \ flag\non a cluster update command:\ngcloud beta container clusters update $CLUSTER_NAME \\\n --zone $CLUSTER_ZONE \\\
    \n --enable-shielded-nodes"
