- id: 5.3.1
  title: Ensure Kubernetes Secrets are encrypted using keys managed in Cloud KMS
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Encrypt Kubernetes secrets, stored in etcd, at the application-layer using a customermanaged key in Cloud KMS.
  rationale: By default, GKE encrypts customer content stored at rest, including Secrets. GKE handles and manages this default
    encryption for you without any additional action on your part. Application-layer Secrets Encryption provides an additional
    layer of security for sensitive data, such as user defined Secrets and Secrets required for the operation of the cluster,
    such as service account keys, which are all stored in etcd. Using this functionality, you can use a key, that you manage
    in Cloud KMS, to encrypt data at the application layer. This protects against attackers in the event that they manage
    to gain access to etcd.
  impact: To use the Cloud KMS CryptoKey to protect etcd in the cluster, the 'Kubernetes Engine Service Agent' Service account
    must hold the 'Cloud KMS CryptoKey Encrypter/Decrypter' role.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets
  page_start: 140
  audit_raw: 'Using Google Cloud Console:

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. From the list of clusters, click on each cluster to bring up the Details pane, and

    ensure Application-layer Secrets Encryption is set to ''Enabled''.

    140 | P a g e

    Using Command Line:

    gcloud container clusters describe $CLUSTER_NAME --zone $ZONE --format json |

    jq ''.databaseEncryption''

    If configured correctly, the output from the command returns a response containing the

    following detail:

    keyName=projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/crypt

    oKeys/[KEY_NAME]

    state=ENCRYPTED'
  remediation: "To enable Application-layer Secrets Encryption, several configuration items are required.\nThese include:\n\
    • A key ring\n• A key\n• A GKE service account with Cloud KMS CryptoKey Encrypter/Decrypter role\nOnce these are created,\
    \ Application-layer Secrets Encryption can be enabled on an existing\nor new cluster.\nUsing Google Cloud Console:\nTo\
    \ create a key\n1. Go to Cloud KMS by visiting https://console.cloud.google.com/security/kms\n2. Select CREATE KEY RING\n\
    3. Enter a Key ring name and the region where the keys will be stored\n4. Click CREATE\n5. Enter a Key name and appropriate\
    \ rotation period within the Create key pane\n6. Click CREATE\nTo enable on a new cluster\n1. Go to Kubernetes Engine\
    \ by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Click CREATE CLUSTER\n3. Expand the template by clicking\
    \ 'Availability, networking, security, and additional\nfeatures' and check the 'Enable Application-layer Secrets Encryption'\
    \ checkbox.\n4. Select the desired Key as the customer-managed key and if prompted grant\npermissions to the GKE Service\
    \ account\n5. Click CREATE.\nTo enable on an existing cluster\n141 | P a g e\n1. Go to Kubernetes Engine by visiting\n\
    https://console.cloud.google.com/kubernetes/list\n2. Click to edit cluster you want to modify.\n3. Enable Application-layer\
    \ Secrets Encryption and choose the desired Key\n4. Click SAVE.\nUsing Command Line:\nTo create a key:\nCreate a key ring:\n\
    gcloud kms keyrings create [RING_NAME] \\\n --location [LOCATION] \\\n --project [KEY_PROJECT_ID]\nCreate a key:\ngcloud\
    \ kms keys create [KEY_NAME] \\\n --location [LOCATION] \\\n --keyring [RING_NAME] \\\n --purpose encryption \\\n --project\
    \ [KEY_PROJECT_ID]\nGrant the Kubernetes Engine Service Agent service account the Cloud KMS CryptoKey\nEncrypter/Decrypter\
    \ role:\ngcloud kms keys add-iam-policy-binding [KEY_NAME] \\\n --location [LOCATION] \\\n --keyring [RING_NAME] \\\n\
    \ --member serviceAccount:[SERVICE_ACCOUNT_NAME] \\\n --role roles/cloudkms.cryptoKeyEncrypterDecrypter \\\n --project\
    \ [KEY_PROJECT_ID]\nTo create a new cluster with Application-layer Secrets Encryption:\ngcloud container clusters create\
    \ [CLUSTER_NAME] \\\n --cluster-version=latest \\\n --zone [ZONE] \\\n --database-encryption-key\nprojects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKey\n\
    s/[KEY_NAME] \\\n --project [CLUSTER_PROJECT_ID]\nTo enable on an existing cluster\ngcloud container clusters update [CLUSTER_NAME]\
    \ \\\n --zone [ZONE] \\\n --database-encryption-key\nprojects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKey\n\
    s/[KEY_NAME] \\\n --project [CLUSTER_PROJECT_ID]\n142 | P a g e"
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. From the list of clusters, click on each cluster to bring up the Details pane, and

      ensure Application-layer Secrets Encryption is set to ''Enabled''.

      140 | P a g e

      Using Command Line:

      gcloud container clusters describe $CLUSTER_NAME --zone $ZONE --format json |

      jq ''.databaseEncryption''

      If configured correctly, the output from the command returns a response containing the

      following'
    severity: medium
- id: 5.4.1
  title: Ensure legacy Compute Engine instance metadata APIs are Disabled
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Disable the legacy GCE instance metadata APIs for GKE nodes. Under some circumstances, these can be used from
    within a pod to extract the node's credentials.
  rationale: The legacy GCE metadata endpoint allows simple HTTP requests to be made returning sensitive information. To prevent
    the enumeration of metadata endpoints and data exfiltration, the legacy metadata endpoint must be disabled. Without requiring
    a custom HTTP header when accessing the legacy GCE metadata endpoint, a flaw in an application that allows an attacker
    to trick the code into retrieving the contents of an attacker-specified web URL could provide a simple method for enumeration
    and potential credential exfiltration. By requiring a custom HTTP header, the attacker needs to exploit an application
    flaw that allows them to control the URL and also add custom headers in order to carry out this attack successfully.
  impact: Any workloads using the legacy GCE metadata endpoint will no longer be able to retrieve metadata from the endpoint.
    Use Workload Identity instead.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/protecting-clustermetadata#disable-legacy-apis
  page_start: 144
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, make sure that the Details page for each Node pool displays\nunder the 'GCE instance metadata'\
    \ heading: disable-legacy-endpoints: true.\n144 | P a g e\nUsing Command Line:\nTo check if the legacy metadata API is\
    \ disabled for an individual Node pool, run the\nfollowing command:\ngcloud container node-pools describe $NODE_POOL \\\
    \n --cluster $CLUSTER_NAME --zone $COMPUTE_ZONE \\\n --format json | jq '.config.metadata'\nAlternatively to audit all\
    \ of the clusters Node pools simultaneously, run the following\ncommand:\ngcloud container clusters describe $CLUSTER_NAME\
    \ \\\n --zone $COMPUTE_ZONE \\\n --format json | jq .nodePools[].config.metadata\nFor each of the Node pools with the\
    \ correct setting the output of the above command\nreturns:\n \"disable-legacy-endpoints\"\": \"\"true\""
  remediation: "The legacy GCE metadata endpoint must be disabled upon the cluster or node-pool\ncreation. For GKE versions\
    \ 1.12 and newer, the legacy GCE metadata endpoint is disabled\nby default.\nUsing Google Cloud Console:\nTo update an\
    \ existing cluster, create a new Node pool with the legacy GCE metadata\nendpoint disabled:\n1. Go to Kubernetes Engine\
    \ by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Click on the name of cluster to be upgraded and click\
    \ ADD NODE POOL.\n3. Ensure that GCE instance metadata is set to the key:value pair of disable-legacyendpoints: true\n\
    4. Click SAVE\nYou will need to migrate workloads from any existing non-conforming Node pools, to the\nnew Node pool,\
    \ then delete non-conforming Node pools to complete the remediation.\nUsing Command Line:\nTo update an existing cluster,\
    \ create a new Node pool with the legacy GCE metadata\nendpoint disabled:\ngcloud container node-pools create [POOL_NAME]\
    \ \\\n --metadata disable-legacy-endpoints=true \\\n --cluster [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE]\n145 | P a g\
    \ e\nYou will need to migrate workloads from any existing non-conforming Node pools, to the\nnew Node pool, then delete\
    \ non-conforming Node pools to complete the remediation."
  checks:
  - type: manual_review
    info: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
      2. From the list of clusters, make sure that the Details page for each Node pool displays\nunder the 'GCE instance metadata'\
      \ heading: disable-legacy-endpoints: true.\n144 | P a g e\nUsing Command Line:\nTo check if the legacy metadata API\
      \ is disabled for an individual Node pool, run the\nfollowing command:\ngcloud container node-pools describe $NODE_POOL\
      \ \\\n --cluster $CLUSTER_NAME --zone"
    severity: medium
- id: 5.4.2
  title: Ensure the GKE Metadata Server is Enabled
  scoring: scored
  profile:
  - Level 2 - Master Node
  description: Running the GKE Metadata Server prevents workloads from accessing sensitive instance metadata and facilitates
    Workload Identity
  rationale: Every node stores its metadata on a metadata server. Some of this metadata, such as kubelet credentials and the
    VM instance identity token, is sensitive and should not be exposed to a Kubernetes workload. Enabling the GKE Metadata
    server prevents pods (that are not running on the host network) from accessing this metadata and facilitates Workload
    Identity. When unspecified, the default setting allows running pods to have full access to the node's underlying metadata
    server.
  impact: The GKE Metadata Server must be run when using Workload Identity. Because Workload Identity replaces the need to
    use Metadata Concealment, the two approaches are incompatible. When the GKE Metadata Server and Workload Identity are
    enabled, unless the Pod is running on the host network, Pods cannot use the the Compute Engine default service account.
    You may also need to modify workloads in order for them to use Workoad Identity as described within https://cloud.google.com/kubernetes-engine/docs/how-to/workloadidentity.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/protecting-clustermetadata#concealment
  page_start: 147
  audit_raw: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    147 | P a g e\n2. From the list of clusters, click on the name of the cluster of interest and for each\nNode pool within\
    \ the cluster, open the Details pane, and ensure that the GKE\nMetadata Server is set to 'Enabled'.\nUsing Command Line\n\
    To check whether the GKE Metadata Server is enabled for each Node pool within a cluster,\nrun the following command:\n\
    gcloud beta container clusters describe $CLUSTER_NAME \\\n --zone $COMPUTE_ZONE \\\n --format json | jq .nodePools[].config.workloadMetadataConfig\n\
    This should return the following for each Node pool:\n{\n \"nodeMetadata\": GKE_METADATA\n}\nNull ({ }) is returned if\
    \ the GKE Metadata Server is not enabled."
  remediation: "The GKE Metadata Server requires Workload Identity to be enabled on a cluster. Modify the\ncluster to enable\
    \ Workload Identity and enable the GKE Metadata Server.\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\n\
    https://console.cloud.google.com/kubernetes/list\n2. From the list of clusters, select the cluster for which Workload\
    \ Identity is disabled.\n3. Click on EDIT\n4. Set Workload Identity to 'Enabled' and set the Workload Identity Namespace\
    \ to the\nnamespace of the Cloud project containing the cluster, e.g:\n[PROJECT_ID].svc.id.goog\n5. Click SAVE and wait\
    \ for the cluster to update\n6. Once the cluster has updated, select each Node pool within the cluster Details page\n\
    7. For each Node pool, select EDIT within the Node pool details page\n8. Within the Edit node pool pane, check the 'Enable\
    \ GKE Metadata Server checkbox'\n9. Click SAVE.\nUsing Command Line\ngcloud beta container clusters update [CLUSTER_NAME]\
    \ \\\n --identity-namespace=[PROJECT_ID].svc.id.goog\n148 | P a g e\nNote that existing Node pools are unaffected. New\
    \ Node pools default to --workloadmetadata-from-node=GKE_METADATA_SERVER.\nTo modify an existing Node pool to enable GKE\
    \ Metadata Server:\ngcloud beta container node-pools update [NODEPOOL_NAME] \\\n --cluster=[CLUSTER_NAME] \\\n --workload-metadata-from-node=GKE_METADATA_SERVER\n\
    You may also need to modify workloads in order for them to use Workload Identity as\ndescribed within https://cloud.google.com/kubernetes-engine/docs/how-to/workloadidentity."
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      147 | P a g e

      2. From the list of clusters, click on the name of the cluster of interest and for each

      Node pool within the cluster, open the Details pane, and ensure that the GKE

      Metadata Server is set to ''Enabled''.

      Using Command Line

      To check whether the GKE Metadata Server is enabled for each Node pool within a cluster,

      run the following command:

      gcloud beta container clusters des'
    severity: medium
- id: 5.5.1
  title: Ensure Container-Optimized OS (COS) is used for GKE node images
  scoring: scored
  profile:
  - Level 2 - Master Node
  description: Use Container-Optimized OS (COS) as a managed, optimized and hardened base OS that limits the host's attack
    surface.
  rationale: 'COS is an operating system image for Compute Engine VMs optimized for running containers. With COS, you can
    bring up your containers on Google Cloud Platform quickly, efficiently, and securely. Using COS as the node image provides
    the following benefits: • Run containers out of the box: COS instances come pre-installed with the container runtime and
    cloud-init. With a COS instance, you can bring up your container at the same time you create your VM, with no on-host
    setup required. • Smaller attack surface: COS has a smaller footprint, reducing your instance''s potential attack surface.
    • Locked-down by default: COS instances include a locked-down firewall and other security settings by default.'
  impact: If modifying an existing cluster's Node pool to run COS, the upgrade operation used is longrunning and will block
    other operations on the cluster (including delete) until it has run to completion. COS nodes also provide an option with
    containerd as the main container runtime directly integrated with Kubernetes instead of docker. Thus, on these nodes,
    Docker cannot view or access containers or images managed by Kubernetes. Your applications should not interact with Docker
    directly. For general troubleshooting or debugging, use crictl instead.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
  - 2. https://cloud.google.com/container-optimized-os/docs/
  page_start: 150
  audit_raw: "150 | P a g e\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, select the cluster under test.\n3. Under the 'Node pools' section, make sure that for each\
    \ of the Node pools,\n'Container-Optimized OS (COS)' is listed in the 'Image type' column.\nUsing Command line\nTo check\
    \ Node image type for an existing cluster's Node pool:\ngcloud container node-pools describe $NODE_POOL \\\n --cluster\
    \ $CLUSTER_NAME --zone $COMPUTE_ZONE \\\n --format json | jq '.config.imageType'\nThe output of the above command returns\
    \ COS, if COS is used for Node images."
  remediation: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the Kubernetes cluster which does not use COS\n3. Under the Node pools heading, select the Node Pool that requires\
    \ alteration\n4. Click EDIT\n5. Under the Image Type heading click CHANGE\n6. From the pop-up menu select Container-Optimized\
    \ OS (cos) and click CHANGE\n7. Repeat for all non-compliant Node pools.\nUsing Command Line\nTo set the node image to\
    \ cos for an existing cluster's Node pool:\ngcloud container clusters upgrade [CLUSTER_NAME]\\\n --image-type cos \\\n\
    \ --zone [COMPUTE_ZONE] --node-pool [POOL_NAME]"
  checks:
  - type: manual_review
    info: "150 | P a g e\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
      2. From the list of clusters, select the cluster under test.\n3. Under the 'Node pools' section, make sure that for\
      \ each of the Node pools,\n'Container-Optimized OS (COS)' is listed in the 'Image type' column.\nUsing Command line\n\
      To check Node image type for an existing cluster's Node pool:\ngcloud container node-pools describe $NODE_POOL \\\n\
      \ --cluster $CLUSTER_NAME --zone "
    severity: medium
- id: 5.5.2
  title: Ensure Node Auto-Repair is enabled for GKE nodes
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Nodes in a degraded state are an unknown quantity and so may pose a security risk.
  rationale: Kubernetes Engine's node auto-repair feature helps you keep the nodes in your cluster in a healthy, running state.
    When enabled, Kubernetes Engine makes periodic checks on the health state of each node in your cluster. If a node fails
    consecutive health checks over an extended time period, Kubernetes Engine initiates a repair process for that node.
  impact: If multiple nodes require repair, Kubernetes Engine might repair them in parallel. Kubernetes Engine limits number
    of repairs depending on the size of the cluster (bigger clusters have a higher limit) and the number of broken nodes in
    the cluster (limit decreases if many nodes are broken). Node auto-repair is not available on Alpha Clusters.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/node-auto-repair
  page_start: 153
  audit_raw: "This Audit process utilize 3 parameterized variables.\nPlease set your environment to include the following\
    \ Parameters.\n$POOL_NAME\n$CLUSTER_NAME\n$COMPUTE_ZONE\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\n\
    https://console.cloud.google.com/kubernetes/list\n2. From the list of clusters, select the desired cluster. For each Node\
    \ pool, view the\nNode pool Details pane and ensure that under the 'Management' heading, 'Autorepair' is set to 'Enabled'.\n\
    Using Command Line:\nTo check the existence of node auto-repair for an existing cluster's Node pool, run:\n153 | P a g\
    \ e\ngcloud container node-pools describe $POOL_NAME --cluster $CLUSTER_NAME --\nzone $COMPUTE_ZONE --format json | jq\
    \ '.management'\nEnsure the output of the above command has JSON key attribute autoRepair set to true:\n{\n \"autoRepair\"\
    : true\n}"
  remediation: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Select Kubernetes clusters for which node auto-repair is disabled

    3. Click on the name of the Node pool that requires node auto-repair to be enabled

    4. Within the Node pool details pane click EDIT

    5. Under the ''Management'' heading, ensure the ''Enable Auto-repair'' box is checked.

    6. Click SAVE.

    Using Command Line

    To enable node auto-repair for an existing cluster with Node pool, run the following

    command:

    gcloud container node-pools update $POOL_NAME --cluster $CLUSTER_NAME --zone

    $COMPUTE_ZONE --enable-autorepair'
  checks:
