  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file is specified you should restrict its file permissions to maintain the integrity of the file. The
    file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 26
  audit_raw: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    1. SSH to the relevant node

    2. Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    26 | P a g e

    The output of the above command should return something similar to --config

    /home/kubernetes/kubelet-config.yaml which is the location of the Kubelet config file.

    3. Run the following command:

    stat -c %a /home/kubernetes/kubelet-config.yaml

    The output of the above command is the Kubelet config file''s permissions. Verify that the

    permissions are 644 or more restrictive.'
  remediation: 'Run the following command (using the config file location identied in the Audit step)

    chmod 644 /var/lib/kubelet/config.yaml'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /home/kubernetes/kubelet-config.yaml
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired Node

      pool to open the Node pool Details page

      3. Note the name of the desired node

      4. Go to VM Instances by visiting

