- id: 5.5.5
  title: Ensure Shielded GKE Nodes are Enabled
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Shielded GKE Nodes provides verifiable integrity via secure boot, virtual trusted platform module (vTPM)-enabled
    measured boot, and integrity monitoring.
  rationale: Shielded GKE nodes protects clusters against boot- or kernel-level malware or rootkits which persist beyond infected
    OS. Shielded GKE nodes run firmware which is signed and verified using Google's Certificate Authority, ensuring that the
    nodes' firmware is unmodified and establishing the root of trust for Secure Boot. GKE node identity is strongly protected
    via virtual Trusted Platform Module (vTPM) and verified remotely by the master node before the node joins the cluster.
    Lastly, GKE node integrity (i.e., boot sequence and kernel) is measured and can be monitored and verified remotely.
  impact: After you enable Shielded GKE Nodes in a cluster, any nodes created in a Node pool without Shielded GKE Nodes enabled,
    or created outside of any Node pool, aren't able to join the cluster. Shielded GKE Nodes can only be used with Container-Optimized
    OS (COS), COS with containerd, and Ubuntu node images.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/shielded-gke-nodes
