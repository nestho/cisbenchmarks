- id: 5.5.3
  title: Ensure Node Auto-Upgrade is enabled for GKE nodes
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Node auto-upgrade keeps nodes at the current Kubernetes and OS security patch level to mitigate known vulnerabilities.
  rationale: Node auto-upgrade helps you keep the nodes in your cluster or Node pool up to date with the latest stable patch
    version of Kubernetes as well as the underlying node operating system. Node auto-upgrade uses the same update mechanism
    as manual node upgrades. Node pools with node auto-upgrade enabled are automatically scheduled for upgrades when a new
    stable Kubernetes version becomes available. When the upgrade is performed, the Node pool is upgraded to match the current
    cluster master version. From a security perspective, this has the benefit of applying security updates automatically to
    the Kubernetes Engine when security fixes are released.
  impact: Enabling node auto-upgrade does not cause your nodes to upgrade immediately. Automatic upgrades occur at regular
    intervals at the discretion of the Kubernetes Engine team. To prevent upgrades occurring during a peak period for your
    cluster, you should define a maintenance window. A maintenance window is a four-hour timeframe that you choose in which
    automatic upgrades should occur. Upgrades can occur on any day of the week, and at any time within the timeframe. To prevent
    upgrades from occurring during certain dates, you should define a maintenance exclusion. A maintenance exclusion can span
    multiple days.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/node-auto-upgrades
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/maintenance-windowsand-exclusions
  page_start: 156
  audit_raw: "This Audit process utilize 3 parameterized variables.\nplease set your environment to include the following\
    \ Parmaters.\n$POOL_NAME\n$CLUSTER_NAME\n$COMPUTE_ZONE\nUsing Google Cloud Console\n156 | P a g e\n1. Go to Kubernetes\
    \ Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. From the list of clusters, select the desired\
    \ cluster. For each Node pool, view the\nNode pool Details pane and ensure that under the 'Management' heading, 'Autoupgrade'\
    \ is set to 'Enabled'.\nUsing Command Line\nTo check the existence of node auto-upgrade for an existing cluster's Node\
    \ pool, run:\ngcloud container node-pools describe [NODE_POOL_NAME] \\\n --cluster [CLUSTER_NAME] --zone [COMPUTE_ZONE]\
    \ \\\n --format json | jq '.management'\nEnsure the output of the above command has JSON key attribute autoUpgrade set\
    \ to true:\n{\n \"autoUpgrade\": true\n}\nIf node auto-upgrade is disabled, the output of the above command output will\
    \ not contain\nthe autoUpgrade entry."
  remediation: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
