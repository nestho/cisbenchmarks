- id: 5.8.1
  title: Ensure Basic Authentication using static passwords is Disabled
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Disable Basic Authentication (basic auth) for API server authentication as it uses static passwords which need
    to be rotated.
  rationale: Basic Authentication allows a user to authenticate to a Kubernetes cluster with a username and static password
    which is stored in plaintext (without any encryption). Disabling Basic Authentication will prevent attacks like brute
    force and credential stuffing. It is recommended to disable Basic Authentication and instead use another authentication
    method such as OpenID Connect. GKE manages authentication via gcloud using the OpenID Connect token method, setting up
    the Kubernetes configuration, getting an access token, and keeping it up to date. This means Basic Authentication using
    static passwords and Client Certificate authentication, which both require additional management overhead of key management
    and rotation, are not necessary and should be disabled. When Basic Authentication is disabled, you will still be able
    to authenticate to the cluster with other authentication methods, such as OpenID Connect tokens. See also Recommendation
    6.8.2 to disable authentication using Client Certificates.
  impact: Users will no longer be able to authenticate with a static password. You will have to configure and use alternate
    authentication mechanisms, such as OpenID Connect tokens.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster#restrict_authn_methods
  page_start: 202
  audit_raw: "202 | P a g e\nThe audit script for this recommendation utilizes 3 variables:\n$NODE_POOL\n$CLUSTER_NAME\n$COMPUTE_ZONE\n\
    Please set these parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google\
    \ Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. From the\
    \ list of clusters, select the desired cluster\n3. Within the Details pane, click 'Show cluster certificate' next to 'Endpoint'\
    \ heading\n4. Within the 'Cluster Credentials' pop-up the message, \"Basic authentication for this\ncluster is disabled\
    \ \" should be displayed, and the field 'Basic Auth credentials\n(Username and Password)' missing.\nUsing Command Line\n\
    To check Basic Authentication status for an existing cluster's nodes, run the following\ncommand:\ngcloud container clusters\
    \ describe $CLUSTER_NAME \\\n --zone $COMPUTE_ZONE \\\n --format json | jq '.masterAuth.password and .masterAuth.username'\n\
    The output of the above command should return false, if Basic Authentication is disabled.\nIf Basic Authentication is\
    \ enabled, the above command will return true."
  remediation: "1.1.1.9 Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the Kubernetes cluster for which Basic Authentication is currently enabled\n3. Click on EDIT\n4. Set 'Basic\
    \ authentication' to 'Disabled'\n5. Click SAVE.\n1.1.1.10 Using Command Line:\nTo update an existing cluster and disable\
    \ Basic Authentication by removing the static\npassword:\n203 | P a g e\ngcloud container clusters update [CLUSTER_NAME]\
    \ \\\n --no-enable-basic-auth"
