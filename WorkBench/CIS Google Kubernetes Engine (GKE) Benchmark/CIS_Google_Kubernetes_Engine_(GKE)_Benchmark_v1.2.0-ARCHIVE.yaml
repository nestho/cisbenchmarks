    1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. If a cluster appears under\
    \ the 'Kubernetes alpha clusters' heading, it is an Alpha\ncluster.\nUsing Command Line\nRun the command:\ngcloud container\
    \ clusters describe $CLUSTER_NAME \\\n --zone $COMPUTE-ZONE \\\n --format json | jq '.enableKubernetesAlpha'\n220 | P\
    \ a g e\nThe output of the above command will return true if it is an Alpha cluster."
  remediation: "Alpha features cannot be disabled. To remediate, a new cluster must be created.\nUsing Google Cloud Console\n\
    1. Go to Kubernetes Engine by visiting https://console.cloud.google.com/kubernetes/\n2. Click CREATE CLUSTER\n3. Unless\
