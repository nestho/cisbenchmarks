- id: 5.5.4
  title: When creating New Clusters - Automate GKE version management using Release Channels
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Subscribe to the Regular or Stable Release Channel to automate version upgrades to the GKE cluster and to reduce
    version management complexity to the number of features and level of stability required.
  rationale: Release Channels signal a graduating level of stability and production-readiness. These are based on observed
    performance of GKE clusters running that version and represent experience and confidence in the cluster version. The Regular
    release channel upgrades every few weeks and is for production users who need features not yet offered in the Stable channel.
    These versions have passed internal validation, but don't have enough historical data to guarantee their stability. Known
    issues generally have known workarounds. The Stable release channel upgrades every few months and is for production users
    who need stability above all else, and for whom frequent upgrades are too risky. These versions have passed internal validation
    and have been shown to be stable and reliable in production, based on the observed performance of those clusters. Critical
    security patches are delivered to all release channels.
  impact: Once release channels are enabled on a cluster, they cannot be disabled. To stop using release channels, you must
    recreate the cluster without the --release-channel flag. Node auto-upgrade is enabled (and cannot be disabled), so your
    cluster is updated automatically from releases available in the chosen release channel.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/release-channels
  page_start: 159
  audit_raw: "Using Google Cloud Console\n159 | P a g e\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, select the desired cluster\n3. Within the Details pane, if using a release channel, the\
    \ release channel should be set\nto the 'Regular' or 'Stable' channel.\nUsing Command Line\nRun the following command:\n\
    gcloud beta container clusters describe [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --format json | jq .releaseChannel.channel\n\
    The output of the above command will return regular or stable if these release channels\nare being used to manage automatic\
    \ upgrades for your cluster."
  remediation: "Currently, cluster Release Channels are only configurable at cluster provisioning time.\nUsing Google Cloud\
    \ Console\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list\n2. Click CREATE\
    \ CLUSTER\n3. Under the 'Master Version' heading, click the 'Use Release Channels' button\n4. Select the 'Regular' or\
    \ 'Stable' channels from the 'Release Channel' drop down menu\n5. Configure the rest of the cluster settings as desired\n\
    6. Click CREATE.\nUsing Command Line\nCreate a new cluster by running the following command:\ngcloud beta container clusters\
    \ create [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --release-channel [RELEASE_CHANNEL]\nwhere [RELEASE_CHANNEL] is\
    \ stable or regular according to your needs."
  checks:
