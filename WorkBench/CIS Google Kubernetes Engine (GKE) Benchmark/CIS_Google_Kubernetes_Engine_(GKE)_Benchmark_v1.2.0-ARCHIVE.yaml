- id: 5.2.1
  title: Ensure GKE clusters are not running using the Compute Engine default service account
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Create and use minimally privileged Service accounts to run GKE cluster nodes instead of using the Compute
    Engine default Service account. Unnecessary permissions could be abused in the case of a node compromise.
  rationale: A GCP service account (as distinct from a Kubernetes ServiceAccount) is an identity that an instance or an application
    can use to run GCP API requests on your behalf. This identity is used to identify virtual machine instances to other Google
    Cloud Platform services. By default, Kubernetes Engine nodes use the Compute Engine default service account. This account
    has broad access by default, as defined by access scopes, making it useful to a wide variety of applications on the VM,
    but it has more permissions than are required to run your Kubernetes Engine cluster. You should create and use a minimally
    privileged service account to run your Kubernetes Engine cluster instead of using the Compute Engine default service account,
    and create separate service accounts for each Kubernetes Workload (See Recommendation 6.2.2). Kubernetes Engine requires,
    at a minimum, the node service account to have the monitoring.viewer, monitoring.metricWriter, and logging.logWriter roles.
    Additional roles may need to be added for the nodes to pull images from GCR.
  impact: Instances are automatically granted the https://www.googleapis.com/auth/cloud-platform scope to allow full access
    to all Google Cloud APIs. This is so that the IAM permissions of the instance are completely determined by the IAM roles
    of the Service account. Thus if Kubernetes workloads were using cluster access scopes to perform actions using Google
    131 | P a g e APIs, they may no longer be able to, if not permitted by the permissions of the Service account. To remediate,
    follow Recommendation 6.2.2. The Service account roles listed here are the minimum required to run the cluster. Additional
    roles may be required to pull from a private instance of Google Container Registry (GCR).
  references:
  - 1. https://cloud.google.com/compute/docs/access/serviceaccounts#compute_engine_default_service_account
  page_start: 131
  audit_raw: "The audit script for this recommendation utilizes 3 variables:\n$NODE_POOL\n$CLUSTER_NAME\n$COMPUTE_ZONE\nPlease\
    \ set these parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google Cloud\
    \ Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Select the cluster\
    \ under test and click on each Node pool to bring up the Node pool\ndetails page. Ensure that for each Node pool the Service\
    \ account is not set to default\nunder the Security heading.\nTo check the permissions allocated to the service account\
    \ are the minimum required for\ncluster operation:\n1. Go to IAM by visiting https://console.cloud.google.com/iam-admin/iam\n\
    2. From the list of Service accounts, ensure each cluster Service account has only the\nfollowing roles:\n• Logs Writer\n\
    • Monitoring Metric Writer\n• Monitoring Viewer\nUsing Command line:\nTo check which Service account is set for an existing\
    \ cluster, run the following command:\ngcloud container node-pools describe $NODE_POOL \\\n --cluster $CLUSTER_NAME --zone\
    \ $COMPUTE_ZONE \\\n --format json | jq '.config.serviceAccount'\nThe output of the above command will return default\
    \ if default Service account is used for\nProject access.\n132 | P a g e\nTo check that the permissions allocated to the\
    \ service account are the minimum required\nfor cluster operation:\ngcloud projects get-iam-policy [PROJECT_ID] \\\n --flatten=\"\
    bindings[].members\" \\\n --format='table(bindings.role)' \\\n --filter=\"bindings.members:[SERVICE_ACCOUNT]\"\nReview\
    \ the output to ensure that the service account only has the roles required to run the\ncluster:\n•\nroles/logging.logWriter\n\
    •\nroles/monitoring.metricWriter\n•\nroles/monitoring.viewer"
  remediation: "Using Google Cloud Console:\nTo create a minimally privileged service account.\n1. Go to Service Accounts\
    \ by visiting https://console.cloud.google.com/iamadmin/serviceaccounts\n2. Click on CREATE SERVICE ACCOUNT\n3. Enter\
    \ Service Account Details\n4. Click CREATE\n5. Within Service Account permissions add the following roles:\n• Logs Writer\n\
    • Monitoring Metric Writer\n• Monitoring Viewer\n6. Click CONTINUE\n7. Grant users access to this service account and\
    \ create keys as required\n8. Click DONE.\nTo create a Node pool to use the Service account:\n1. Go to Kubernetes Engine\
    \ by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Click on the cluster name within which the Node pool\
    \ will be launched\n3. Click on ADD NODE POOL\n133 | P a g e\n4. Within the Node Pool options select the minimally privileged\
    \ service account from\nthe Service Account drop down under the 'Security' heading\n5. Click SAVE to launch the Node pool.\n\
    You will need to migrate your workloads to the new Node pool, and delete Node pools that\nuse the default service account\
    \ to complete the remediation.\nUsing Command Line:\nTo create a minimally privileged service account:\ngcloud iam service-accounts\
    \ create [SA_NAME] \\\n --display-name \"GKE Node Service Account\"\nexport NODE_SA_EMAIL=`gcloud iam service-accounts\
    \ list \\\n --format='value(email)' \\\n --filter='displayName:GKE Node Service Account'`\nGrant the following roles to\
    \ the service account:\nexport PROJECT_ID=`gcloud config get-value project`\ngcloud projects add-iam-policy-binding $PROJECT_ID\
    \ \\\n --member serviceAccount:$NODE_SA_EMAIL \\\n --role roles/monitoring.metricWriter\ngcloud projects add-iam-policy-binding\
    \ $PROJECT_ID \\\n --member serviceAccount:$NODE_SA_EMAIL \\\n --role roles/monitoring.viewer\ngcloud projects add-iam-policy-binding\
    \ $PROJECT_ID \\\n --member serviceAccount:$NODE_SA_EMAIL \\\n --role roles/logging.logWriter\nTo create a new Node pool\
    \ using the Service account, run the following command:\ngcloud container node-pools create [NODE_POOL] \\\n --service-account=[SA_NAME]@[PROJECT_ID].iam.gserviceaccount.com\
    \ \\\n --cluster=[CLUSTER_NAME] --zone [COMPUTE_ZONE]\nYou will need to migrate your workloads to the new Node pool, and\
    \ delete Node pools that\nuse the default service account to complete the remediation."
  checks:
  - type: manual_review
    info: 'The audit script for this recommendation utilizes 3 variables:

      $NODE_POOL

      $CLUSTER_NAME

      $COMPUTE_ZONE

      Please set these parameters on the system where you will be executing your gcloud audit

      script or command.

      Using Google Cloud Console:

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Select the cluster under test and click on each Node pool to bring up the Node pool

      details page. Ensure that for each Node pool the Service account is not set to default

      u'
    severity: medium
- id: 5.2.2
  title: Prefer using dedicated GCP Service Accounts and Workload Identity
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes workloads should not use cluster node service accounts to authenticate to Google Cloud APIs. Each
    Kubernetes Workload that needs to authenticate to other Google services using Cloud IAM should be provisioned a dedicated
    Service account. Enabling Workload Identity manages the distribution and rotation of Service account keys for the workloads
    to use.
  rationale: 'Manual approaches for authenticating Kubernetes workloads running on GKE against Google Cloud APIs are: storing
    service account keys as a Kubernetes secret (which introduces manual key rotation and potential for key compromise); or
    use of the underlying nodes'' IAM Service account, which violates the principle of least privilege on a multitenanted
    node, when one pod needs to have access to a service, but every other pod on the node that uses the Service account does
    not. Once a relationship between a Kubernetes Service account and a GCP Service account has been configured, any workload
    running as the Kubernetes Service account automatically authenticates as the mapped GCP Service account when accessing
    Google Cloud APIs on a cluster with Workload Identity enabled.'
  impact: During the Workload Identity beta, a GCP project can have a maximum of 20 clusters with Workload Identity enabled.
    Workload Identity replaces the need to use Metadata Concealment and as such, the two approaches are incompatible. The
    sensitive metadata protected by Metadata Concealment is also protected by Workload Identity. When Workload Identity is
    enabled, you can no longer use the Compute Engine default Service account. Correspondingly, Workload Identity can't be
    used with Pods running in the host network. You may also need to modify workloads in order for them to use Workoad Identity
    as described within https://cloud.google.com/kubernetesengine/docs/how-to/workload-identity 136 | P a g e GKE infrastructure
    pods such as Stackdriver will continue to use the Node's Service account.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  page_start: 136
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, click on each cluster to bring up the Details pane, make sure\nfor each cluster Workload\
    \ Identity is set to 'Enabled' under the 'Cluster' section and\nensure that the Workload Identity Namespace is set to\
    \ the namespace of the GCP\nproject containing the cluster, e.g: $PROJECT_ID.svc.id.goog\n3. Additionally, click on each\
    \ Node pool within each cluster to observe the Node pool\nDetails pane, and ensure that the GKE Metadata Server is 'Enabled'.\n\
    Using Command Line:\ngcloud beta container clusters describe $CLUSTER_NAME --zone $CLUSTER_ZONE\nIf Workload Identity\
    \ is enabled, the following fields should be present, and the\n$PROJECT_ID should be set to the namespace of the GCP project\
    \ containing the cluster:\nworkloadIdentityConfig:\n identityNamespace:[PROJECT_ID].svc.id.goog\nFor each Node pool, ensure\
    \ the following is set.\nworkloadMetadataConfig:\n nodeMetadata: GKE_METADATA_SERVER\nYou will also need to manually audit\
    \ each Kubernetes workload requiring Google Cloud API\naccess to ensure that Workload Identity is being used and not some\
    \ other method."
  remediation: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, select your cluster for which Workload Identity is disabled.\n3. Click on EDIT\n4. Set Workload\
    \ Identity to 'Enabled' and set the Workload Identity Namespace to the\nnamespace of the Cloud project containing the\
    \ cluster, e.g:\n[PROJECT_ID].svc.id.goog\n5. Click SAVE and wait for the cluster to update\n137 | P a g e\n6. Once the\
    \ cluster has updated, select each Node pool within the cluster Details page\n7. For each Node pool, select EDIT within\
    \ the Node pool Details page\n8. Within the Edit node pool pane, check the 'Enable GKE Metadata Server' checkbox\nand\
    \ click SAVE.\nUsing Command Line:\ngcloud beta container clusters update [CLUSTER_NAME] --zone [CLUSTER_ZONE] \\\n --identity-namespace=[PROJECT_ID].svc.id.goog\n\
    Note that existing Node pools are unaffected. New Node pools default to --workloadmetadata-from-node=GKE_METADATA_SERVER.\n\
    Then, modify existing Node pools to enable GKE_METADATA_SERVER:\ngcloud beta container node-pools update [NODEPOOL_NAME]\
    \ \\\n --cluster=[CLUSTER_NAME] --zone [CLUSTER_ZONE] \\\n --workload-metadata-from-node=GKE_METADATA_SERVER\nYou may\
    \ also need to modify workloads in order for them to use Workload Identity as\ndescribed within https://cloud.google.com/kubernetes-engine/docs/how-to/workloadidentity.\
    \ Also consider the effects on the availability of your hosted workloads as Node\npools are updated, it may be more appropriate\
    \ to create new Node Pools."
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      1. Go to Kubernetes Engine by visiting

