- id: 5.8.2
  title: Ensure authentication using Client Certificates is Disabled
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Disable Client Certificates, which require certificate rotation, for authentication. Instead, use another authentication
    method like OpenID Connect.
  rationale: With Client Certificate authentication, a client presents a certificate that the API server verifies with the
    specified Certificate Authority. In GKE, Client Certificates are signed by the cluster root Certificate Authority. When
    retrieved, the Client Certificate is only base64 encoded and not encrypted. GKE manages authentication via gcloud for
    you using the OpenID Connect token method, setting up the Kubernetes configuration, getting an access token, and keeping
    it up to date. This means Basic Authentication using static passwords and Client Certificate authentication, which both
    require additional management overhead of key management and rotation, are not necessary and should be disabled. When
    Client Certificate authentication is disabled, you will still be able to authenticate to the cluster with other authentication
    methods, such as OpenID Connect tokens. See also Recommendation 6.8.1 to disable authentication using static passwords,
    known as Basic Authentication.
  impact: Users will no longer be able to authenticate with the pre-provisioned x509 certificate. You will have to configure
    and use alternate authentication mechanisms, such as OpenID Connect tokens.
  references:
