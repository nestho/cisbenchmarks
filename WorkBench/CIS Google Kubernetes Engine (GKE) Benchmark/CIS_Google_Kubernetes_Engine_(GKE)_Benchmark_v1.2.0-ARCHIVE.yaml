- id: 5.10.4
  title: Consider GKE Sandbox for running untrusted workloads
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Use GKE Sandbox to restrict untrusted workloads as an additional layer of protection when running in a multi-tenant
    environment.
  rationale: GKE Sandbox provides an extra layer of security to prevent untrusted code from affecting the host kernel on your
    cluster nodes. When you enable GKE Sandbox on a Node pool, a sandbox is created for each Pod running on a node in that
    Node pool. In addition, nodes running sandboxed Pods are prevented from accessing other GCP services or cluster metadata.
    Each sandbox uses its own userspace kernel. Multi-tenant clusters and clusters whose containers run untrusted workloads
    are more exposed to security vulnerabilities than other clusters. Examples include SaaS providers, web-hosting providers,
    or other organizations that allow their users to upload and run code. A flaw in the container runtime or in the host kernel
    could allow a process running within a container to 'escape' the container and affect the node's kernel, potentially bringing
    down the node. The potential also exists for a malicious tenant to gain access to and exfiltrate another tenant's data
    in memory or on disk, by exploiting such a defect.
  impact: 'Using GKE Sandbox requires the node image to be set to Container-Optimized OS with containerd (cos_containerd).
    It is not currently possible to use GKE Sandbox along with the following Kubernetes features: • Accelerators such as GPUs
    or TPUs • Istio • Monitoring statistics at the level of the Pod or container • Hostpath storage • Per-container PID namespace
    225 | P a g e • CPU and memory limits are only applied for Guaranteed Pods and Burstable Pods, and only when CPU and memory
    limits are specified for all containers running in the Pod • Pods using PodSecurityPolicies that specify host namespaces,
    such as hostNetwork, hostPID, or hostIPC • Pods using PodSecurityPolicy settings such as privileged mode • VolumeDevices
    • Portforward • Linux kernel security modules such as Seccomp, Apparmor, or Selinux Sysctl, NoNewPrivileges, bidirectional
    MountPropagation, FSGroup, or ProcMount'
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/sandbox-pods
  page_start: 225
  audit_raw: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click on each cluster, and click on any Node pools that are not provisioned by\ndefault\n3. On the Node pool Details\
    \ page, under the 'Security' heading on the Node pool details\npage, check that 'Sandbox with gVisor' is set to 'Enabled'.\n\
    The default node pool cannot use GKE Sandbox.\nUsing Command Line\nRun this command:\ngcloud container node-pools describe\
    \ [NODE_POOL_NAME] \\\n --zone [COMPUTE-ZONE] \\\n --cluster [CLUSTER_NAME] \\\n --format json | jq '.config.sandboxConfig'\n\
    The output of the above command will return the following if the Node pool is running a\nsandbox:\n{\n \"sandboxType\"\
    :\"gvisor\"\n}\nIf there is no sandbox, the above command output will be null ({ }).\nThe default node pool cannot use\
    \ GKE Sandbox."
  remediation: "Once a node pool is created, GKE Sandbox cannot be enabled, rather a new node pool is\nrequired. The default\
    \ node pool (the first node pool in your cluster, created when the\n226 | P a g e\ncluster is created) cannot use GKE\
    \ Sandbox.\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting https://console.cloud.google.com/kubernetes/\n\
    2. Click ADD NODE POOL\n3. Configure the Node pool with following settings:\no For the node version, select v1.12.6-gke.8\
    \ or higher\no For the node image, select 'Container-Optimized OS with Containerd\n(cos_containerd) (beta)'\no Under 'Security',\
    \ select 'Enable sandbox with gVisor'\n4. Configure other Node pool settings as required\n5. Click SAVE.\nUsing Command\
    \ Line\nTo enable GKE Sandbox on an existing cluster, a new Node pool must be created.\ngcloud container node-pools create\
    \ [NODE_POOL_NAME] \\\n --zone=[COMPUTE-ZONE] \\\n --cluster=[CLUSTER_NAME] \\\n --image-type=cos_containerd \\\n --sandbox\
    \ type=gvisor"
  checks:
  - type: manual_review
    info: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
      2. Click on each cluster, and click on any Node pools that are not provisioned by\ndefault\n3. On the Node pool Details\
      \ page, under the 'Security' heading on the Node pool details\npage, check that 'Sandbox with gVisor' is set to 'Enabled'.\n\
      The default node pool cannot use GKE Sandbox.\nUsing Command Line\nRun this command:\ngcloud container node-pools describe\
      \ [NODE_POOL_NAME] \\\n --zone "
    severity: medium
- id: 5.10.5
  title: Ensure use of Binary Authorization
  scoring: scored
  profile:
  - Level 2 - Master Node
  description: Binary Authorization helps to protect supply-chain security by only allowing images with verifiable cryptographically
    signed metadata into the cluster.
  rationale: Binary Authorization provides software supply-chain security for images that you deploy to GKE from Google Container
    Registry (GCR) or another container image registry. Binary Authorization requires images to be signed by trusted authorities
    during the development process. These signatures are then validated at deployment time. By enforcing validation, you can
    gain tighter control over your container environment by ensuring only verified images are integrated into the build-and-release
    process.
  impact: Care must be taken when defining policy in order to prevent inadvertent denial of container image deployments. Depending
    on policy, attestations for existing container images running within the cluster may need to be created before those images
    are redeployed or pulled as part of the pod churn. To prevent key system images from being denied deployment, consider
    the use of global policy evaluation mode, which uses a global policy provided by Google and exempts a list of Google-provided
    system images from further policy evaluation.
  references:
  - 1. https://cloud.google.com/binary-authorization/
  page_start: 229
  audit_raw: "The audit script for this recommendation utilizes 2 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\nPlease set these\
    \ parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google Cloud Console\n\
    To check that Binary Authorization is enabled for the GKE cluster:\n1. Go to the Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    229 | P a g e\n2. Click on the desired cluster. On the Details pane, ensure that 'Binary Authorization'\nis set to 'Enabled'.\n\
    Then, assess the contents of the policy:\n3. Go to Binary Authorization by visiting\nhttps://console.cloud.google.com/security/binary-authorization\n\
    4. Ensure a policy is defined and the project default rule is not configured to 'Allow all\nimages'.\nUsing Command Line\n\
    To check that Binary Authorization is enabled for the GKE cluster:\ngcloud container clusters describe $CLUSTER_NAME \\\
    \n --zone $COMPUTE_ZONE \\\n --format json | jq .binaryAuthorization\nThe above command output will be the following if\
    \ Binary Authorization is enabled:\n{\n \"enabled\": true\n}\nThen, assess the contents of the policy:\ngcloud container\
    \ binauthz policy export > current-policy.yaml\nEnsure that the current policy is not configured to allow all images (evaluationMode:\n\
    ALWAYS_ALLOW):\ncat current-policy.yaml\n...\ndefaultAdmissionRule:\n evaluationMode: ALWAYS_ALLOW"
  remediation: "Using Google Cloud Console\n1. Go to Binary Authorization by visiting\nhttps://console.cloud.google.com/security/binary-authorization\n\
    2. Enable the Binary Authorization API (if disabled)\n3. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    4. Select the Kubernetes cluster for which Binary Authorization is disabled\n5. Click EDIT\n6. Set 'Binary Authorization'\
    \ to 'Enabled'\n7. Click SAVE\n230 | P a g e\n8. Return to Binary Authorization at\nhttps://console.cloud.google.com/security/binary-authorization\n\
    9. Set an appropriate policy for your cluster.\nUsing Command Line\nUpdate the cluster to enable Binary Authorization:\n\
    gcloud container cluster update [CLUSTER_NAME] \\\n --zone [COMPUTE-ZONE] \\\n --enable-binauthz\nCreate a Binary Authorization\
    \ Policy using the Binary Authorization Policy Reference\n(https://cloud.google.com/binary-authorization/docs/policy-yaml-reference)\
    \ for\nguidance.\nImport the policy file into Binary Authorization:\ngcloud container binauthz policy import [YAML_POLICY]"
