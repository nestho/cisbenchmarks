- id: 5.6.2
  title: Ensure use of VPC-native clusters
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Create Alias IPs for the node network CIDR range in order to subsequently configure IPbased policies and firewalling
    for pods. A cluster that uses Alias IPs is called a 'VPC-native' cluster.
  rationale: 'Using Alias IPs has several benefits: • Pod IPs are reserved within the network ahead of time, which prevents
    conflict with other compute resources. • The networking layer can perform anti-spoofing checks to ensure that egress traffic
    is not sent with arbitrary source IPs. • Firewall controls for Pods can be applied separately from their nodes. • Alias
    IPs allow Pods to directly access hosted services without using a NAT gateway.'
  impact: You cannot currently migrate an existing cluster that uses routes for Pod routing to a cluster that uses Alias IPs.
    Cluster IPs for internal services remain only available from within the cluster. If you want to access a Kubernetes Service
    from within the VPC, but from outside of the cluster, use an internal load balancer.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips
  - 2. https://cloud.google.com/vpc/docs/alias-ip
  page_start: 173
  audit_raw: "The audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\nPlease set these\
    \ parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google Cloud Console:\n\
    1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n173 | P a g e\n2. From the list\
    \ of clusters, click on the desired cluster to open the Details page. Under\nthe 'Cluster' section, make sure 'VPC native\
    \ (using alias IP)' is set to 'Enabled'.\nUsing Command Line:\nTo check Alias IP is enabled for an existing cluster, run\
    \ the following command:\ngcloud container clusters describe [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --format json\
    \ | jq '.ipAllocationPolicy.useIpAliases'\nThe output of the above command should return true, if VPC-native (using alias\
    \ IP) is\nenabled. If VPC-native (using alias IP) is disabled, the above command will return null ({\n})."
  remediation: "Use of Alias IPs cannot be enabled on an existing cluster. To create a new cluster using Alias\nIPs, follow\
    \ the instructions below.\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click CREATE CLUSTER\n3. Configure your cluster as desired. Then, click 'Availability, networking, security, and\n\
    additional features'\n4. In the 'VPC-native' section, leave 'Enable VPC-native (using alias IP)' selected\n5. Click CREATE.\n\
    Using Command Line\nTo enable Alias IP on a new cluster, run the following command:\ngcloud container clusters create\
    \ [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --enable-ip-alias"
