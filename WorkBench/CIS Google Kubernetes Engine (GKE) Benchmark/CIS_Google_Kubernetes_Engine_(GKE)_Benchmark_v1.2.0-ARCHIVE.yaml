- id: 5.10.2
  title: Ensure that Alpha clusters are not used for production workloads
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Alpha clusters are not covered by an SLA and are not production-ready.
  rationale: Alpha clusters are designed for early adopters to experiment with workloads that take advantage of new features
    before those features are production-ready. They have all Kubernetes API features enabled, but are not covered by the
    GKE SLA, do not receive security updates, have node auto-upgrade and node auto-repair disabled, and cannot be upgraded.
    They are also automatically deleted after 30 days.
  impact: Users and workloads will not be able to take advantage of features included within Alpha clusters.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/alpha-clusters
  page_start: 220
  audit_raw: "The audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\nPlease set these\
