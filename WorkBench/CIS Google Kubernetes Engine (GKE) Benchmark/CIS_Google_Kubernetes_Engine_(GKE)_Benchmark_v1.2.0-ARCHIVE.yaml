controls:
- id: 2.1.1
  title: Client certificate authentication should not be used for users
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes provides the option to use client certificates for user authentication. However as there is no way
    to revoke these certificates when a user leaves an organization or loses their credential, they are not suitable for this
    purpose. It is not possible to fully disable client certificate use within a cluster as it is used for component to component
    authentication.
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. Kubernetes client certificate authentication does not allow for this due to a lack of support for certificate
    revocation. See also Recommendation 6.8.2 for GKE specifically.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 15
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of Kubernetes

    client certificate authentication.

    You can verify the availability of client certificates in your GKE cluster. See

    Recommendation 6.8.2.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of client certificates.

    15 | P a g e

    You can remediate the availability of client certificates in your GKE cluster. See

    Recommendation 6.8.2.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of Kubernetes

      client certificate authentication.

      You can verify the availability of client certificates in your GKE cluster. See

      Recommendation 6.8.2.'
    severity: medium
- id: '2.2'
  title: Logging 2.2.1 Ensure that a minimal audit policy is created
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Kubernetes can audit the details of requests made to the API server. The --audit-policyfile flag must be set
    for this logging to be enabled.
  rationale: Logging is an important detective control for all systems, to detect potential unauthorised access.
  impact: Audit logs will be created on the master nodes, which will consume disk space. Care should be taken to avoid generating
    too large volumes of log information as this could impact the available of the cluster nodes.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 17
  audit_raw: This control cannot be audited in GKE.
  remediation: This control cannot be modified in GKE.
  checks:
  - type: manual_review
    info: This control cannot be audited in GKE.
    severity: medium
- id: 2.2.2
  title: Ensure that the audit policy covers key security concerns
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Ensure that the audit policy created for the cluster covers key security concerns.
  rationale: Security audit logs should cover access and modification of key resources in the cluster, to enable them to form
    an effective part of a security environment.
  impact: Increasing audit logging will consume resources on the nodes or other log destination.
  references:
  - 1. https://github.com/k8scop/k8s-securitydashboard/blob/master/configs/kubernetes/adv-audit.yaml
  - 2. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/#audit-policy
  page_start: 19
  audit_raw: This control cannot be audited in GKE.
  remediation: This control cannot be modified in GKE.
  checks:
  - type: manual_review
    info: This control cannot be audited in GKE.
    severity: medium
- id: 3.1.1
  title: Ensure that the proxy kubeconfig file permissions are set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1 - Worker Node
  description: If kube-proxy is running, and if it is using a file-based kubeconfig file, ensure that the proxy kubeconfig
    file has permissions of 644 or more restrictive.
  rationale: The kube-proxy kubeconfig file controls various parameters of the kube-proxy service in the worker node. You
    should restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kube-proxy with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 21
  audit_raw: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    21 | P a g e

    1. SSH to the relevant node.

    2. Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kube-proxy

    The output of the above command should return something similar to --kubeconfig

    /var/lib/kube-proxy/kubeconfig which is the location of the kubeconfig file.

    3. Run this command to obtain the kubeconfig file permissions:

    stat -c %a /var/lib/kube-proxy/kubeconfig

    The output of the above command gives you the kubeconfig file''s permissions.

    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kube-proxy && stat -c %a /var/lib/kube-proxy/kubeconfig
    expected: The output of the above command should return something similar to --kubeconfig
    severity: medium
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired Node

      pool to open the Node pool Details page

      3. Note the name of the desired node

      4. Go to VM Instances by visiting

      https://console.cloud.google.com/compute/instances

      5. Find the desired node and click'
- id: 3.1.2
  title: Ensure that the proxy kubeconfig file ownership is set to root:root
  scoring: manual
  profile:
  - Level 1 - Worker Node
  description: If kube-proxy is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kube-proxy controls various parameters for the kube-proxy service in the worker node.
    You should set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 24
  audit_raw: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    1. SSH to the relevant node

    2. Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kube-proxy

    The output of the above command should return something similar to --kubeconfig

    /var/lib/kube-proxy/kubeconfig which is the location of the kubeconfig file.

    24 | P a g e

    3. Run this command to obtain the kubeconfig file ownership:

    stat -c %U:%G /var/lib/kube-proxy/kubeconfig

    The output of the above command gives you the kubeconfig file''s ownership. Verify that the

    ownership is set to root:root.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kube-proxy && stat -c %U:%G /var/lib/kube-proxy/kubeconfig
    expected: The output of the above command should return something similar to --kubeconfig
    severity: medium
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired Node

      pool to open the Node pool Details page

      3. Note the name of the desired node

      4. Go to VM Instances by visiting

      https://console.cloud.google.com/compute/instances

      5. Find the desired node and click'
- id: 3.1.3
