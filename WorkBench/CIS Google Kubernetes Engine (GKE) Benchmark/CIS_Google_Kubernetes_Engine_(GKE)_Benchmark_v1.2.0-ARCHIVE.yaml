    \ existing cluster's Node pool, run the following\ncommand:\ngcloud container node-pools update [NODE_POOL] \\\n --cluster\
    \ [CLUSTER_NAME] --zone [COMPUTE_ZONE] \\\n --enable-autoupgrade"
  checks:
  - type: manual_review
