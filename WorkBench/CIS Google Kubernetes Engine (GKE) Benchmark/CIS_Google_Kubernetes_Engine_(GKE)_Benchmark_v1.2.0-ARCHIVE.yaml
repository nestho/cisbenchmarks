    \ the option 'Enable Kubernetes alpha\nfeatures in this cluster' will not be available. Ensure this feature is not checked\n\
    4. Click CREATE.\nUsing Command Line:\nUpon creating a new cluster\ngcloud container clusters create [CLUSTER_NAME] \\\
