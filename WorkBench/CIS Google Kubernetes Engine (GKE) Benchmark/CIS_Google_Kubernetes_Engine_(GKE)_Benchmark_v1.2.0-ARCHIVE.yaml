- id: 5.10.3
  title: Ensure Pod Security Policy is Enabled and set as appropriate
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Pod Security Policy should be used to prevent privileged containers where possible and enforce namespace and
    workload configurations.
  rationale: A Pod Security Policy is a cluster-level resource that controls security sensitive aspects of the pod specification.
    A PodSecurityPolicy object defines a set of conditions that a pod must run with in order to be accepted into the system,
    as well as defaults for the related fields. When a request to create or update a Pod does not meet the conditions in the
    Pod Security Policy, that request is rejected and an error is returned. The Pod Security Policy admission controller validates
    requests against available Pod Security Policies. PodSecurityPolicies specify a list of restrictions, requirements, and
    defaults for Pods created under the policy. See further details on recommended policies in Recommendation section 5.2.
  impact: If you enable the Pod Security Policy controller without first defining and authorizing any actual policies, no
    users, controllers, or service accounts can create or update Pods. If you are working with an existing cluster, you should
    define and authorize policies before enabling the controller.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/pod-security-policies
  - 2. https://kubernetes.io/docs/concepts/policy/pod-security-policy
  page_start: 222
  audit_raw: "The audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\nPlease set these\
    \ parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google Cloud Console:\n\
    There is no means of auditing the Pod Security Policy Admission controller from the\nconsole.\n222 | P a g e\nUsing Command\
    \ Line\nTo check Pod Security Policy Admission Controller is enabled for an existing cluster, run\nthe following command,\n\
    gcloud beta container clusters describe $CLUSTER_NAME \\\n --zone $COMPUTE_ZONE \\\n --format json | jq '.podSecurityPolicyConfig'\n\
    Ensure the output of the above command has JSON key attribute enabled set to true:\n{\n \"enabled\": true\n}\nIf Pod Security\
    \ Policy is disabled, the above command output will return null ({ })."
  remediation: "Using Google Cloud Console\nThere is no means of enabling the Pod Security Policy Admission controller on\
    \ an existing\nor new cluster from the console.\nUsing Command Line\nTo enable Pod Security Policy for an existing cluster,\
    \ run the following command:\ngcloud beta container clusters update [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --enable-pod-security-policy"
  checks:
  - type: manual_review
