- id: 5.6.3
  title: Ensure Master Authorized Networks is Enabled
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Enable Master Authorized Networks to restrict access to the cluster's control plane (master endpoint) to only
    an allowlist (whitelist) of authorized IPs.
  rationale: 'Authorized networks are a way of specifying a restricted range of IP addresses that are permitted to access
    your cluster''s control plane. Kubernetes Engine uses both Transport Layer Security (TLS) and authentication to provide
    secure access to your cluster''s control plane from the public internet. This provides you the flexibility to administer
    your cluster from anywhere; however, you might want to further restrict access to a set of IP addresses that you control.
    You can set this restriction by specifying an authorized network. Master Authorized Networks blocks untrusted IP addresses.
    Google Cloud Platform IPs (such as traffic from Compute Engine VMs) can reach your master through HTTPS provided that
    they have the necessary Kubernetes credentials. Restricting access to an authorized network can provide additional security
    benefits for your container cluster, including: • Better protection from outsider attacks: Authorized networks provide
    an additional layer of security by limiting external, non-GCP access to a specific set of addresses you designate, such
    as those that originate from your premises. This helps protect access to your cluster in the case of a vulnerability in
    the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized networks
    help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked certificates
    used from outside GCP and outside the authorized IP ranges (for example, from addresses outside your company) are still
    denied access.'
  impact: When implementing Master Authorized Networks, be careful to ensure all desired networks are on the allowlist (whitelist)
    to prevent inadvertently blocking external access to your cluster's control plane.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/authorized-networks
  page_start: 176
  audit_raw: "176 | P a g e\nThe audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\n\
    Please set these parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google\
    \ Cloud Console\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list\n2. From the\
    \ list of clusters, click on the cluster to open the Details page and make sure\n'Master authorized networks' is set to\
    \ 'Enabled'.\nUsing Command Line\nTo check Master Authorized Networks status for an existing cluster, run the following\n\
    command;\ngcloud container clusters describe $CLUSTER_NAME\n --zone $COMPUTE_ZONE\n --format json | jq '.masterAuthorizedNetworksConfig'\n\
    The output should return\n{\n \"enabled\": true\n}\nif Master Authorized Networks is enabled. If Master Authorized Networks\
    \ is disabled, the\nabove command will return null ({ })."
  remediation: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select Kubernetes clusters for which Master Authorized Networks is disabled\n3. Click on EDIT\n4. Set 'Master authorized\
    \ networks' to 'Enabled' and add authorize networks\n5. Click SAVE.\nUsing Command Line\nTo enable Master Authorized Networks\
    \ for an existing cluster, run the following command:\n177 | P a g e\ngcloud container clusters update [CLUSTER_NAME]\
    \ \\\n --zone [COMPUTE_ZONE] \\\n --enable-master-authorized-networks\nAlong with this, you can list authorized networks\
    \ using the --master-authorizednetworks flag which contains a list of up to 20 external networks that are allowed to\n\
    connect to your cluster's control plane through HTTPS. You provide these networks as a\ncomma-separated list of addresses\
    \ in CIDR notation (such as 90.90.100.0/24)."
  checks:
