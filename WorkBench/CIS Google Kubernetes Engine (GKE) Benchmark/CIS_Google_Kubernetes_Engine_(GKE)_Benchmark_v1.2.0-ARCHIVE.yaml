- id: 3.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Enable Kubelet authentication using certificates.
  rationale: The connections from the apiserver to the kubelet are used for fetching logs for pods, attaching (through kubectl)
    to running pods, and using the kubelet’s port-forwarding functionality. These connections terminate at the kubelet’s HTTPS
    endpoint. By default, the apiserver does not verify the kubelet’s serving certificate, which makes the connection subject
    to man-in-the-middle attacks, and unsafe to run over untrusted and/or public networks. Enabling Kubelet certificate authentication
    ensures that the apiserver could authenticate the Kubelet before submitting any requests.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubeletauthentication-authorization/
  page_start: 37
  audit_raw: 'Audit Method 1:

    Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    1. SSH to the relevant node

    2. Run the following command on each node to find the appropriate Kubelet config file:

    37 | P a g e

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /home/kubernetes/kubelet-config.yaml which is the location of the Kubelet config file.

    3. Open the Kubelet config file:

    sudo vim /home/kubernetes/kubelet-config.yaml

    Verify that the --client-ca-file argument exists and is set to the location of the client

    certificate authority file.

    If the --client-ca-file argument is not present, check that there is a Kubelet config file

    specified by --config, and that the file sets authentication: x509: clientCAFile to the

    location of the client certificate authority file.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of clientCAFile by

    extracting the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=gke-cluster-1-default-pool-8f187292-f0dm (example node name

    from "kubectl get nodes")

