  title: Enable Customer-Managed Encryption Keys (CMEK) for GKE Persistent Disks (PD)
  scoring: manual
  profile:
  - Level 1 - Worker Node
  description: Use Customer-Managed Encryption Keys (CMEK) to encrypt node boot and dynamicallyprovisioned attached Google
    Compute Engine Persistent Disks (PDs) using keys managed within Cloud Key Management Service (Cloud KMS).
  rationale: GCE persistent disks are encrypted at rest by default using envelope encryption with keys managed by Google.
    For additional protection, users can manage the Key Encryption Keys using Cloud KMS.
  impact: While GKE CMEK is in beta, encryption of dynamically-provisioned attached disks requires the use of the self-provisioned
    Compute Engine Persistent Disk CSI Driver v0.5.1 or higher. If you are configuring CMEK with a regional cluster, the cluster
    must run GKE 1.14 or higher.
