- id: 3.2.1
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Disable anonymous requests to the Kubelet server.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the Kubelet server. You should rely on authentication to authorize access
    and disallow anonymous requests.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 30
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for authentication:

    anonymous: enabled set to false.

    Using Google Cloud Console

    30 | P a g e

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    1. SSH to the relevant node

    2. Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /home/kubernetes/kubelet-config.yaml which is the location of the Kubelet config file.

    3. Open the Kubelet config file:

    sudo vim /home/kubernetes/kubelet-config.yaml

    4. Verify that the --anonymous-auth argument is set to false.

    This executable argument may be omitted, provided there is a corresponding entry set to

    false in the Kubelet config file.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of authentication...

    anonymous.*enabled.*false} by extracting the live configuration from the nodes running

    kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=gke-cluster-1-default-pool-8f187292-f0dm (example node name

    31 | P a g e

    from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If using a Kubelet config file, edit the file to set authentication: anonymous: enabled to

    false.

    If using executable arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubeadm.conf on each worker node and

    set the below parameter in KUBELET_SYSTEM_PODS_ARGS variable.

    --anonymous-auth=false

    Based on your system, restart the kubelet service. For example:

    systemctl daemon-reload

    systemctl restart kubelet.service

    Remediation Method 2:

    If using the api configz endpoint consider searching for the status of authentication...

    anonymous.*enabled.*false} by extracting the live configuration from the nodes running

    kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a Live

    Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=gke-cluster-1-default-pool-8f187292-f0dm (example node name

    from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all three remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Audit Method 1:

      If using a Kubelet configuration file, check that there is an entry for authentication:

      anonymous: enabled set to false.

      Using Google Cloud Console

      30 | P a g e

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired Node

      pool to open the Node pool Details page

      3. Not'
- id: 3.2.2
  title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  scoring: scored
  profile:
  - Level 1 - Worker Node
  description: Do not allow all requests. Enable explicit authorization.
  rationale: Kubelets, by default, allow all authenticated requests (even anonymous ones) without needing explicit authorization
    checks from the apiserver. You should restrict this behavior and only allow explicitly authorized requests.
  impact: Unauthorized requests will be denied.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 34
  audit_raw: 'Audit Method 1:

    Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click on the desired cluster to open the Details page, then click on the desired Node

    pool to open the Node pool Details page

    3. Note the name of the desired node

    4. Go to VM Instances by visiting

    https://console.cloud.google.com/compute/instances

    5. Find the desired node and click on ''SSH'' to open an SSH connection to the node.

    Using Command Line

    1. SSH to the relevant node

    2. Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /home/kubernetes/kubelet-config.yaml which is the location of the Kubelet config file.

    34 | P a g e

    3. Open the Kubelet config file:

    sudo vim /home/kubernetes/kubelet-config.yaml

    If the --authorization-mode argument is present check that it is not set to AlwaysAllow. If

    it is not present check that there is a Kubelet config file specified by --config, and that file

    sets authorization: mode to something other than AlwaysAllow.

    It is also possible to review the running configuration of a Kubelet via the /configz

    endpoint on the Kubelet API port (typically 10250/TCP). Accessing these with appropriate

    credentials will provide details of the Kubelet''s configuration.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of authorization mode

    "Webhook" by extracting the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=gke-cluster-1-default-pool-8f187292-f0dm (example node name

    from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If using a Kubelet config file, edit the file to set authorization: mode to Webhook.

    If using executable arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubeadm.conf on each worker node and

    set the below parameter in KUBELET_AUTHZ_ARGS variable.

    --authorization-mode=Webhook

    Based on your system, restart the kubelet service. For example:

    systemctl daemon-reload

    systemctl restart kubelet.service

    35 | P a g e

    Remediation Method 2:

    If using the api configz endpoint consider searching for the status of authorization mode

    "Webhook" by extracting the live configuration from the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a Live

    Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=gke-cluster-1-default-pool-8f187292-f0dm (example node name

    from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all three remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Audit Method 1:

      Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

