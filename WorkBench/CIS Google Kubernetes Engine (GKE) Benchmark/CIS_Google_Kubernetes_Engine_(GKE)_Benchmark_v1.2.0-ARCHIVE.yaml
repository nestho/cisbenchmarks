- id: 5.7.1
  title: Ensure Stackdriver Kubernetes Logging and Monitoring is Enabled
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Send logs and metrics to a remote aggregator to mitigate the risk of local tampering in the event of a breach.
  rationale: 'Exporting logs and metrics to a dedicated, persistent datastore such as Stackdriver ensures availability of
    audit data following a cluster security event, and provides a central location for analysis of log and metric data collated
    from multiple sources. Currently, there are two mutually exclusive variants of Stackdriver available for use with GKE
    clusters: Legacy Stackdriver Support and Stackdriver Kubernetes Engine Monitoring Support. Although Stackdriver Kubernetes
    Engine Monitoring is the preferred option, starting with GKE versions 1.12.7 and 1.13, Legacy Stackdriver is the default
    option up through GKE version 1.13. The use of either of these services is sufficient to pass the benchmark recommendation.
    However, note that as Legacy Stackdriver Support is not getting any improvements and lacks features present in Stackdriver
    Kubernetes Engine Monitoring, Legacy Stackdriver Support may be deprecated in favour of Stackdriver Kubernetes Engine
    Monitoring Support in future versions of this benchmark.'
