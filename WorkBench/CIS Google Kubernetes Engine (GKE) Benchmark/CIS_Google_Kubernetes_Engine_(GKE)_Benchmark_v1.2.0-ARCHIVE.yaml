- id: 5.6.7
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Use Network Policy to restrict pod to pod traffic within a cluster and segregate workloads.
  rationale: By default, all pod to pod traffic within a cluster is allowed. Network Policy creates a podlevel firewall that
    can be used to restrict traffic between sources. Pod traffic is restricted by having a Network Policy that selects it
    (through the use of labels). Once there is any Network Policy in a namespace selecting a particular pod, that pod will
    reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected by
    any Network Policy will continue to accept all traffic. Network Policies are managed via the Kubernetes Network Policy
    API and enforced by a network plugin, simply creating the resource without a compatible network plugin to implement it
    will have no effect. GKE supports Network Policy enforcement through the use of Calico.
  impact: Network Policy requires the Network Policy add-on. This add-on is included automatically when a cluster with Network
    Policy is created, but for an existing cluster, needs to be added prior to enabling Network Policy. Enabling/Disabling
    Network Policy causes a rolling update of all cluster nodes, similar to performing a cluster upgrade. This operation is
    long-running and will block other operations on the cluster (including delete) until it has run to completion. If Network
    Policy is used, a cluster must have at least 2 nodes of type n1-standard-1 or higher. The recommended minimum size cluster
    to run Network Policy enforcement is 3 n1-standard-1 instances. Enabling Network Policy enforcement consumes additional
    resources in nodes. Specifically, it increases the memory footprint of the kube-system process by approximately 128MB,
    and requires approximately 300 millicores of CPU.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/network-policy
  page_start: 189
  audit_raw: "189 | P a g e\nThe audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\n$COMPUTE_ZONE\n\
    Please set these parameters on the system where you will be executing your gcloud audit\nscript or command.\nUsing Google\
    \ Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. From the\
    \ list of clusters, click on the desired cluster, and ensure that 'Network\npolicy' is set to 'Enabled'.\nUsing Command\
    \ Line\nTo check Network Policy is enabled for an existing cluster, run the following command,\ngcloud container clusters\
    \ describe $CLUSTER_NAME \\\n --zone $COMPUTE_ZONE \\\n --format json | jq '.networkPolicy'\nThe output of the above command\
    \ should be:\n{\n \"enabled\": true\n}\nif Network Policy is enabled. If Network policy is disabled, the above command\
    \ output will\nreturn null ({ })."
  remediation: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the cluster for which Network policy is disabled\n3. Click EDIT\n4. Set 'Network policy for master' to 'Enabled'\n\
    5. Click SAVE\n6. Once the cluster has updated, repeat steps 1-3\n7. Set 'Network Policy for nodes' to 'Enabled'\n8. Click\
    \ SAVE.\nUsing Command Line\nTo enable Network Policy for an existing cluster, firstly enable the Network Policy add-on:\n\
    190 | P a g e\ngcloud container clusters update [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --update-addons NetworkPolicy=ENABLED\n\
    Then, enable Network Policy:\ngcloud container clusters update [CLUSTER_NAME] \\\n --zone [COMPUTE_ZONE] \\\n --enable-network-policy"
  checks:
