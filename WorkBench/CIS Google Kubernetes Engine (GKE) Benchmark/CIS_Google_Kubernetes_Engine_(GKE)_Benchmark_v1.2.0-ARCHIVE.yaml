- id: 5.8.4
  title: Ensure Legacy Authorization (ABAC) is Disabled
  scoring: scored
  profile:
  - Level 1 - Master Node
  description: Legacy Authorization, also known as Attribute-Based Access Control (ABAC) has been superseded by Role-Based
    Access Control (RBAC) and is not under active development. RBAC is the recommended way to manage permissions in Kubernetes.
  rationale: In Kubernetes, RBAC is used to grant permissions to resources at the cluster and namespace level. RBAC allows
    you to define roles with rules containing a set of permissions, whilst the legacy authorizer (ABAC) in Kubernetes Engine
    grants broad, statically defined permissions. As RBAC provides significant security advantages over ABAC, it is recommended
    option for access control. Where possible, legacy authorization must be disabled for GKE clusters.
  impact: Once the cluster has the legacy authorizer disabled, you must grant your user the ability to create authorization
    roles using RBAC to ensure that your role-based access control permissions take effect.
