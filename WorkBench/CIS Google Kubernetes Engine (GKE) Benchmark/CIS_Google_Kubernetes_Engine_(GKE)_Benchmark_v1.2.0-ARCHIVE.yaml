- id: 5.10.6
  title: Enable Cloud Security Command Center (Cloud SCC)
  scoring: manual
  profile:
  - Level 1 - Master Node
  description: Enable Cloud Security Command Center (Cloud SCC) to provide a centralized view of security for your GKE clusters.
  rationale: Cloud Security Command Center (Cloud SCC) is the canonical security and data risk database for GCP. Cloud SCC
    enables you to understand your security and data attack surface by providing asset inventory, discovery, search, and management.
  impact: None.
  references:
  - 1. https://cloud.google.com/security-command-center/
  - 2. https://cloud.google.com/security-command-center/docs/quickstart-scc-setup
  page_start: 232
  audit_raw: 'Using Google Cloud Console

    1. Navigate to the Cloud SCC dashboard at

    https://console.cloud.google.com/security/command-center/dashboard

    2. Observe the ''Assets Summary'' is populated with resources.

    Using Command Line

    To determine if Cloud SCC is enabled and indexing assets, observe the output of the

    following command:

    gcloud alpha scc assets list $PROJECT_ID

    If the output of the above command returns GKE assets, Cloud SCC is enabled and indexing

    GKE resources.'
  remediation: Follow the instructions at https://cloud.google.com/security-commandcenter/docs/quickstart-scc-setup.
