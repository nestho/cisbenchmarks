    [EXAMPLE_CERTIFICATE] should exist within the same namespace as the ingress."
  remediation: 'If services of type:LoadBalancer are discovered, consider replacing the Service with an

    Ingress.

    To configure the Ingress and use Google-managed SSL certificates, follow the instructions

    as listed at https://cloud.google.com/kubernetes-engine/docs/how-to/managed-certs.'
