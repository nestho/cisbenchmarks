- id: 5.6.4
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: manual
  profile:
  - Level 2 - Master Node
  description: Disable access to the Kubernetes API from outside the node network if it is not required.
  rationale: In a private cluster, the master node has two endpoints, a private and public endpoint. The private endpoint
    is the internal IP address of the master, behind an internal load balancer in the master's VPC network. Nodes communicate
    with the master using the private endpoint. The public endpoint enables the Kubernetes API to be accessed from outside
    the master's VPC network. Although Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability
    could potentially expose the Kubernetes publically with unrestricted access. Additionally, an attacker may be able to
    identify the current cluster and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required,
    disabling public endpoint will help prevent such threats, and require the attacker to be on the master's VPC network to
    perform any attack on the Kubernetes API.
  impact: To enable a Private Endpoint, the cluster has to also be configured with private nodes, a private master IP range
    and IP aliasing enabled. If the Private Endpoint flag --enable-private-endpoint is passed to the gcloud CLI, or the external
    IP address undefined in the Google Cloud Console during cluster creation, then all access from a public IP address is
    prohibited.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/private-clusters
  page_start: 179
  audit_raw: "The audit script for this recommendation utilizes 3 variables:\n$CLUSTER_NAME\nPlease set these parameters on\
    \ the system where you will be executing your gcloud audit\nscript or command.\nUsing Google Cloud Console\n179 | P a\
    \ g e\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n2. Select the desired\
    \ cluster, and within the Details pane, make sure the 'Endpoint'\ndoes not have a public IP address.\nUsing Command Line\n\
    Run this command:\ngcloud container clusters describe $CLUSTER_NAME \\\n --format json | jq '.privateClusterConfig.enablePrivateEndpoint'\n\
    The output of the above command returns true if a Private Endpoint is enabled with Public\nAccess disabled.\nFor an additional\
    \ check, the endpoint parameter can be queried with the following\ncommand:\ngcloud container clusters describe $CLUSTER_NAME\
    \ \\\n --format json | jq '.endpoint'\nThe output of the above command returns a private IP address if Private Endpoint\
    \ is\nenabled with Public Access disabled."
  remediation: "Once a cluster is created without enabling Private Endpoint only, it cannot be remediated.\nRather, the cluster\
    \ must be recreated.\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click CREATE CLUSTER\n3. Configure the cluster as desired then click 'Availability, networking, security, and\nadditional\
    \ features'\n4. Under 'Network Security' ensure the 'Private cluster' checkbox is checked\n5. Clear the 'Access master\
    \ using its external IP address' checkbox.\n6. Configure other settings as required\n7. Click CREATE.\nUsing Command Line\n\
    Create a cluster with a Private Endpoint enabled and Public Access disabled by including\nthe --enable-private-endpoint\
    \ flag within the cluster create command:\ngcloud container clusters create [CLUSTER_NAME] \\\n --enable-private-endpoint\n\
    180 | P a g e\nSetting this flag also requires the setting of --enable-private-nodes, --enable-ip-alias\nand --master-ipv4-cidr=[MASTER_CIDR_RANGE]."
  checks:
  - type: manual_review
    info: 'The audit script for this recommendation utilizes 3 variables:

      $CLUSTER_NAME

      Please set these parameters on the system where you will be executing your gcloud audit

      script or command.

      Using Google Cloud Console

