- id: '2.7'
  title: Ensure remote access capabilities for the User-ID service account are forbidden.
  scoring: scored
  profile:
  - Level 1
  description: Restrict the User-ID service account’s ability to gain remote access into the organization. This capability
    could be made available through a variety of technologies, such as VPN, Citrix GoToMyPC, or TeamViewer. Remote services
    that integrate authentication with the organization’s Active Directory may unintentionally allow the User-ID service account
    to gain remote access.
  rationale: In the event of a compromised User-ID service account, restricting the account’s ability to remotely access resources
    within the organization’s internal network reduces the impact of a service account compromise.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. https://community.rapid7.com/docs/DOC-2881
  page_start: 62
  audit_raw: 'Auditing is operating-system dependent. For instance, in Windows Active Directory, this

    account should not be included in any group that grants the account access to VPN or

    Wireless access. In addition, domain administrative accounts should not have remote

    desktop (RDP) access to all domain member workstations.'
  remediation: 'Remove this account from all groups that might grant remote access to the network, or to

    any network services or hosts. Remediation is operating-system dependent. For instance,

    in Windows Active Directory, this account should be removed from any group that grants

    the account access to VPN or Wireless access. In addition, domain administrative accounts

    by default have remote desktop (RDP) access to all domain member workstations - this

    should be explicitly denied for this account.'
