controls:
- id: 1.1.1
  title: Ensure 'Login Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Configure a login banner, ideally approved by the organization’s legal team. This banner should, at minimum,
    prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word “welcome” or similar words
    of invitation.
  rationale: Through a properly stated login banner, the risk of unintentional access to the device by unauthorized users
    is reduced. Should legal action take place against a person accessing the device without authorization, the login banner
    greatly diminishes a defendant’s claim of ignorance.
  impact: ''
  references:
  - 1. “How to Configure the Device Login Banner” -
  - https://live.paloaltonetworks.com/docs/DOC-7964
  page_start: 13
  audit_raw: 'Navigate to Device > Setup > Management > General Settings.

    Verify Login Banner is set appropriately.'
  remediation: 'Navigate to Device > Setup > Management > General Settings.

    Set Login Banner as appropriate.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > General Settings.

      Verify Login Banner is set appropriately.'
    severity: medium
- id: 1.1.2
  title: Ensure 'Enable Log on High DP Load' is enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable the option 'Enable Log on High DP Load' feature. When this option is selected, a system log entry is
    created when the device’s packet processing load reaches 100% utilization.
  rationale: When the device’s packet processing load reaches 100%, a degradation in the availability of services accessed
    through the device can occur. Logging this event can help with troubleshooting system performance.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-4075
  - 1.2 Management Interface Settings
  page_start: 14
  audit_raw: 'Navigate to Device > Setup > Management > Logging and Reporting Settings > Log

    Export and Reporting.

    Verify Enable Log on High DP Load is checked.'
  remediation: 'Navigate to Device > Setup > Management > Logging and Reporting Settings > Log

    Export and Reporting.

    Set the Enable Log on High DP Load box to checked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Logging and Reporting Settings > Log

      Export and Reporting.

      Verify Enable Log on High DP Load is checked.'
    severity: medium
- id: 1.2.1
  title: Ensure 'Permitted IP Addresses' is set to those necessary for device management
  scoring: scored
  profile:
  - Level 1
  description: Permit only the necessary IP addresses to be used to manage the device.
  rationale: Management access to the device should be restricted to the IP addresses used by firewall administrators. Permitting
    management access from other IP addresses increases the risk of unauthorized access through password guessing, stolen
    credentials, or other means.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-8432
  page_start: 15
  audit_raw: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Verify Permitted IP Addresses is limited to those necessary for device management.'
  remediation: 'Navigate to Device > Setup > Management > Management Interface Settings.

    Set Permitted IP Addresses to only those necessary for device management.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Management Interface Settings .

      Verify Permitted IP Addresses is limited to those necessary for device management.'
    severity: medium
- id: 1.2.2
  title: Ensure 'Permitted IP Addresses' is set for all management profiles where SSH, HTTPS, or SNMP is enabled
  scoring: scored
  profile:
  - Level 1
  description: For all management profiles, only the IP addresses required for device management should be specified.
  rationale: If a Permitted IP Addresses list is either not specified or is too broad, an attacker may gain the ability to
    attempt management access from unintended locations, such as the Internet. The “Ensure 'Security Policy' denying any/all
    traffic exists at the bottom of the security policies ruleset” recommendation in this benchmark can provide additional
    protection by requiring a security policy specifically allowing device management access.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-8432
  page_start: 17
  audit_raw: 'Navigate to Network > Network Profiles > Interface Management.

    Verify Permitted IP Addresses is limited to those necessary for device management.'
  remediation: 'Navigate to Network > Network Profiles > Interface Management.

    Set Permitted IP Addresses to only include those necessary for device management.'
  checks:
  - type: manual_review
    info: 'Navigate to Network > Network Profiles > Interface Management.

      Verify Permitted IP Addresses is limited to those necessary for device management.'
    severity: medium
- id: 1.2.3
  title: Ensure HTTP and Telnet options are disabled for the Management Interface
  scoring: scored
  profile:
  - Level 1
  description: HTTP and Telnet options should not be enabled for device management.
  rationale: Management access over clear text services such as HTTP or Telnet could result in a compromise of administrator
    credentials and other sensitive information related to device management.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/t5/Configuration-Articles/How-to-Configure-aLayer-3-Interface-to-act-as-a-Management-Port/ta-p/59024
  page_start: 19
  audit_raw: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Verify that the HTTP and Telnet options are both unchecked.'
  remediation: 'Navigate to Device > Setup > Management > Management Interface Settings.

    Set the HTTP and Telnet boxes to unchecked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Management Interface Settings .

      Verify that the HTTP and Telnet options are both unchecked.'
    severity: medium
- id: 1.2.4
  title: Ensure valid certificate is set for browser-based administrator interface
  scoring: scored
  profile:
  - Level 2
  description: 'In most cases, a browser HTTPS interface is used to administer the Palo Alto appliance. The certificate used
    to secure this session should satisfy the following criteria: 1. A valid certificate from a trusted source should be used.
    While a certificate from a trusted Public Certificate Authority is certainly valid, one from a trusted Private Certificate
    Authority is absolutely acceptable for this purpose. 2. The certificate should have a valid date. It should not have a
    "to" date in the past (it should not be expired), and should not have a "from" date in the future. 3. The certificate
    should use an acceptable cipher and encryption level.'
  rationale: If a certificate that is self-signed, expired, or otherwise invalid is used for the browser HTTPS interface,
    administrators in most cases will not be able to tell if their session is being eavesdropped on or injected into by a
    "Man in the Middle" attack.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by reviewing

    the appropriate certificate:

    Navigate to Device > Certificate Management > Certificates

    Verify that there is an appropriately named Certificate Profile for Management Interface

    Access:

    Navigate to Device > Certificate Management > Certificate Profile

    Verify that the Authentication Profile field contains the Certificate Profile created for

    Management Interface Access:

    Navigate to Device > Setup > Management (tab) > Authentication Settings >

    Authentication Profile (field)

    ARCHIVE

    21 | P a g e'
  remediation: 'If a new administrative certificate is needed, acquire a certificate that meets the stated

    criteria and set it:

    Navigate to Device > Certificate Management > Certificates

    Set an appropriately named Certificate Profile for Management Interface Access:

    Navigate to Device > Certificate Management > Certificate Profile

    Set the Authentication Profile field so it contains the Certificate Profile created for

    Management Interface Access:

    Navigate to Device > Setup > Management (tab) > Authentication Settings >

    Authentication Profile (field)'
  checks:
  - type: manual_review
    info: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by reviewing

      the appropriate certificate:

      Navigate to Device > Certificate Management > Certificates

      Verify that there is an appropriately named Certificate Profile for Management Interface

      Access:

      Navigate to Device > Certificate Management > Certificate Profile

      Verify that the Authentication Profile field contains the Certificate Profile created for

      Management Interface Access:

      Navigate to Device > Setup > Management '
    severity: medium
- id: 1.3.1
  title: Ensure 'Minimum Password Complexity' is enabled
  scoring: scored
  profile:
  - Level 1
  description: This checks all new passwords to ensure that they meet basic requirements for strong passwords.
  rationale: Password complexity recommendations are derived from the USGCB (United States Government Configuration Baseline),
    Common Weakness Enumeration, and benchmarks published by the CIS (Center for Internet Security). Password complexity adds
    entropy to a password, in comparison to a simple password of the same length. A complex password is more difficult to
    attack, either directly against administrative interfaces or cryptographically, against captured password hashes. However,
    making a password of greater length will generally have a greater impact in this regard, in comparison to making a shorter
    password more complex.
  impact: ''
  references:
  - 1. https://www.paloaltonetworks.com/documentation/71/pan-os/web-interfacehelp/device/device-setup-management#48340
  page_start: 23
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Verify Enabled is checked'
  remediation: 'Navigate to Device > Setup > Management > Minimum Password Complexity.

    Set Enabled to be checked'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

      Verify Enabled is checked'
    severity: medium
- id: 1.3.2
  title: Ensure 'Minimum Length' is greater than or equal to 12
  scoring: scored
  profile:
  - Level 1
  description: This determines the least number of characters that make up a password for a user account.
  rationale: A longer password is much more difficult to attack, either directly against administrative interfaces or cryptographically,
    against captured password hashes. Making a password of greater length will generally have a greater impact in this regard,
    in comparison to making a shorter password more complex.
  impact: Longer passwords are much more difficult to attack. This is true of attacks against the administrative interfaces
    themselves, or of decryption attacks against captured hashes.
  references:
  - 1. https://www.paloaltonetworks.com/documentation/71/pan-os/web-interfacehelp/device/device-setup-management#48340
  page_start: 25
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Verify Minimum Length is greater than or equal to 12'
  remediation: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Set Minimum Length to greater than or equal to 12'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

      Verify Minimum Length is greater than or equal to 12'
    severity: medium
- id: 1.3.3
  title: Ensure 'Prevent Password Reuse Limit' is set to 24 or more passwords
  scoring: scored
  profile:
  - Level 1
  description: This determines the number of unique passwords that have to be most recently used for a user account before
    a previous password can be reused.
  rationale: The longer a user uses the same password, the greater the chance that an attacker can determine the password
    through brute force attacks. Also, any accounts that may have been compromised will remain exploitable for as long as
    the password is left unchanged. If password changes are required but password reuse is not prevented, or if users continually
    reuse a small number of passwords, the effectiveness of a good password policy is greatly reduced.
  impact: ''
  references:
  - 1. https://www.paloaltonetworks.com/documentation/71/pan-os/web-interfacehelp/device/device-setup-management#48340
  page_start: 27
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Verify Prevent Password Reuse Limit is greater than or equal to 24'
  remediation: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Set Prevent Password Reuse Limit to greater than or equal to 24'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

      Verify Prevent Password Reuse Limit is greater than or equal to 24'
    severity: medium
- id: 1.3.4
  title: Ensure 'Required Password Change Period' is less than or equal to 90 days
  scoring: scored
  profile:
  - Level 1
  description: This defines how long a user can use a password before it expires.
  rationale: The longer a password exists, the higher the likelihood that it will be compromised by a brute force attack,
    by an attacker gaining general knowledge about the user and guessing the password, or by the user sharing the password.
  impact: Failure to change administrative passwords can result in a slow "creep" of people who have access. Especially in
    a situation with high staff turnover (for instance, in a NOC or SOC situation), administrative passwords need to be changed
    frequently.
  references:
  - 1. 2. https://www.paloaltonetworks.com/documentation/71/pan-os/web-interfacehelp/device/device-setup-management#48340
  page_start: 29
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Verify Required Password Change Period (days) is less than or equal to 90'
  remediation: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

    Set Required Password Change Period (days) to less than or equal to 90'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Minimum Password Complexity .

      Verify Required Password Change Period (days) is less than or equal to 90'
    severity: medium
- id: 1.3.5
  title: Ensure 'Password Profiles' do not exist
  scoring: scored
  profile:
  - Level 1
  description: Password profiles that are weaker than the recommended minimum password complexity settings must not exist.
  rationale: As password profiles override any 'Minimum Password Complexity' settings defined in the device, they generally
    should not exist. If these password profiles do exist, they should enforce stronger password policies than what is set
    in the 'Minimum Password Complexity' settings.
  impact: ''
  references:
  - 1. https://www.paloaltonetworks.com/documentation/71/pan-os/web-interfacehelp/device/device-password-profiles
