- id: '2.8'
  title: Ensure that security policies restrict User-ID Agent traffic from crossing into untrusted zones
  scoring: scored
  profile:
  - Level 1
  description: Create security policies to deny Palo Alto User-ID traffic originating from the interface configured for the
    UID Agent service that are destined to any untrusted zone.
  rationale: If User-ID and WMI probes are sent to untrusted zones, the risk of privileged information disclosure exists.
    The information disclosed can include the User-ID Agent service account name, domain name, and encrypted password hashes
    sent in User-ID and WMI probes. To prevent this exposure, msrpc traffic originating from the firewall to untrusted networks
    should be explicitly denied. This security policy should be in effect even for environments not currently using WMI probing
    to help guard against possible probe misconfigurations in the future. This setting is a "fail safe" to prevent exposure
    of this information if any of the other WMI User control settings are misconfigured.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
