- id: '8.1'
  title: Ensure 'SSL Forward Proxy Policy' for traffic destined to the Internet is configured
  scoring: scored
  profile:
  - Level 1
  description: Configure SSL Forward Proxy for all traffic destined to the Internet. Include all categories except financial-services
    and health-and-medicine.
  rationale: Without SSL inspection, the firewall cannot apply many of its protection features against encrypted traffic.
    The amount of encrypted malware traffic continues to rise, and legitimate websites using SSL encryption are hacked or
    tricked into delivering malware on a frequent basis. As encryption on the Internet continues to grow at a rapid rate,
    SSL inspection is no longer optional as a practical security measure. If proper decryption is not configured, it follows
    that the majority of traffic is not being fully inspected for malicious content or policy violations. This is a major
    exposure, allowing delivery of exploits and payloads direct to user desktops.
  impact: ''
  references:
  - 1. “How to Implement SSL Decryption” -
  - https://live.paloaltonetworks.com/docs/DOC- 1412
  - 2. “PAN-OS Administrator's Guide 6.1 (English)” -
  - https://live.paloaltonetworks.com/docs/DOC-8246
  page_start: 132
  audit_raw: 'Navigate to Policies > Decryption.

    Verify SSL Forward Proxy is set for all traffic destined to the Internet. Include all

