- id: '5.4'
  title: Ensure forwarding of decrypted content to WildFire is enabled
  scoring: scored
  profile:
  - Level 1
  description: Allow the firewall to forward decrypted content to WildFire. Note that SSL Forward-Proxy must also be enabled
    and configured for this setting to take effect on inside-to-outside traffic flows.
  rationale: As encrypted Internet traffic continues to proliferate, WildFire becomes less effective unless it is allowed
    to act on decrypted content. For example, if a user downloads a malicious pdf over SSL, WildFire can only provide analysis
    if 1) the session is decrypted by the firewall and 2) forwarding of decrypted content is enabled. In today's internet,
    roughly 70-80% of all user traffic is encrypted. If Wildfire is not configured to analyze encrypted content, the effectiveness
    of Wildfire is drastically reduced.
  impact: ''
  references:
  - 1. “WildFire Fails Forwarding File to Cloud for Encrypted Traffic” -
  - https://live.paloaltonetworks.com/docs/DOC-6845
  - 2. 7.0 WF Admin guide -
  - https://www.paloaltonetworks.com/documentation/70/wildfire/wf_admin
  page_start: 81
  audit_raw: 'Navigate to Device > Setup > Content-ID > Content-ID Settings.

    Verify that Allow forwarding of decrypted content is checked.'
  remediation: 'Navigate to Device > Setup > Content-ID > Content-ID Settings.

    Set Allow forwarding of decrypted content to be checked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Content-ID > Content-ID Settings.

      Verify that Allow forwarding of decrypted content is checked.'
    severity: medium
- id: '5.5'
  title: Ensure all WildFire session information settings are enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable all options under Session Information Settings for WildFire.
  rationale: Permitting the firewall to send all of this information to WildFire creates more detailed reports, thereby making
    the process of tracking down potentially infected devices more efficient. This could prevent an infected system from further
    infecting the environment. Environments with security policies restricting sending this data to the WildFire cloud can
    instead utilize an on-premises WildFire appliance. In addition, risk can be analyzed in the context of the destination
    host and user account, either during analysis or during incident response.
  impact: ''
  references:
  - 1. “WildFire Administrator's Guide 6.1 (English)” -
  - https://live.paloaltonetworks.com/docs/DOC-8251
