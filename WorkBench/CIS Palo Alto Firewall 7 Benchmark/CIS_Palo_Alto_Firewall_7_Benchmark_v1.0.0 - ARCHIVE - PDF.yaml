- id: '8.2'
  title: Ensure 'SSL Inbound Inspection' is required for all untrusted traffic destined for servers using SSL or TLS
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 2
  description: 'Configure SSL Inbound Inspection for all untrusted traffic destined for servers using SSL or TLS. The CA Certificate
    used for in-line HTTP Man in the Middle should be trusted by target users. There are two classes of users that need to
    be considered. 1: Users that are members of the organization, users of machines under control of the organization. For
    these people and machines, ensure that the CA Certificate is in one of the Trusted CA certificate stores. This is easily
    done in Active Directory, using Group Policies for instance. A MDM (Mobile Device Manager) can be used to accomplish the
    same task for mobile devices such as telephones or tablets. Other central management or orchestration tools can be used
    for Linux or "IoT" (Internet of Things) devices. 2: Users that are not member of the organization - often these are classed
    as "Visitors" in the policies of the organization. If a public CA Certificate is a possibility for your organization,
    then that is one approach. A second approach is to not decrypt affected traffic - this is easily done, but leaves the
    majority of "visitor" traffic uninspected and potentially carrying malicious content. The final approach, and the one
    most commonly seen, is to use the same certificate as is used for members organization. In this last case, visitors will
    see a certificate warning, but the issuing CA will be the organization that they are visiting.'
  rationale: Without SSL Inbound Inspection, the firewall is not able to protect SSL or TLS-enabled webservers against many
    threats. Using a self-signed certificate, or any certificate that generates a warning in the browser, means that members
    of the organization have no method of determining if they are being presented with a legitimate certificate, or an attacker's
    "man in the middle' certificate. It also very rapidly teaches members of the organization to bypass all security warnings
    of this type.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/t5/Configuration-Articles/How-to-Implementand-Test-SSL-Decryption/ta-p/59719
  - 2. https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os/certificatemanagement
  page_start: 134
  audit_raw: 'Navigate to Policies > Decryption.

