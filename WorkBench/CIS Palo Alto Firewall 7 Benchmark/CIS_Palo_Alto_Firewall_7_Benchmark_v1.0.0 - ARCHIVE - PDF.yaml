    severity: medium
- id: 1.6.2
  title: Ensure redundant NTP servers are configured appropriately
  scoring: scored
  profile:
  - Level 1
  description: These settings enable use of primary and secondary NTP servers to provide redundancy in case of a failure involving
    the primary NTP server.
  rationale: NTP enables the device to maintain an accurate time and date when receiving updates from a reliable NTP server.
    Accurate timestamps are critical when correlating events with other systems, troubleshooting, or performing investigative
    work. Logs and certain cryptographic functions, such as those utilizing certificates, rely on accurate time and date parameters.
    In addition, rules referencing a Schedule object will not function as intended if the device’s time and date are incorrect.
    For additional security, authenticated NTP can be utilized. If Symmetric Key is selected, only SHA1 should be used as
    MD5 is considered severely compromised.
  impact: ''
  references:
  - 1. “The NIST Authenticated NTP Service” -
  - http://www.nist.gov/pml/div688/grp40/authntp.cfm
  - 2. PAN-OS Administrator's Guide 7.1 (English)" -
  - https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/framem
  page_start: 46
  audit_raw: 'Navigate to Device > Setup > Services > Services.

    Verify Primary NTP Server Address is set appropriately.

    Verify Secondary NTP Server Address is set appropriately.'
  remediation: 'Navigate to Device > Setup > Services > Services.

    Set Primary NTP Server Address appropriately.

    Set Secondary NTP Server Address appropriately.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Services > Services.

      Verify Primary NTP Server Address is set appropriately.

      Verify Secondary NTP Server Address is set appropriately.'
    severity: medium
- id: 1.6.3
  title: Ensure that the certificate securing Remote Access VPNs is valid
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'The Certificate used to secure Remote Access VPNs should satisfy the following criteria:  It should be a
    valid certificate from a trusted source. In almost cases this means a trusted Public Certificate Authority, as in most
    cases remote access VPN users will not have access to any Private Certificate Authorities for Certificate validation.
     The certificate should have a valid date. It should not have a "to" date in the past (it should not be expired), and
    should not have a "from" date in the future.  The key length used to encrypt the certificate should be 2048 bits or more.
     The hash used to sign the certificate should be SHA-2 or better.'
  rationale: If presented with a certificate error, the end user in most cases will not be able to tell if their session is
    using a self-signed or expired certificate, or if their session is being eavesdropped on or injected into by a "Man in
    the Middle" attack.
  impact: ''
  references:
