- id: '6.6'
  title: Ensure a secure anti-spyware profile is applied to all security policies permitting traffic to the Internet
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Create one or more anti-spyware profiles and collectively apply them to all security policies permitting traffic
    to the Internet. The anti-spyware profiles may be applied to the security policies directly or through a profile group.
    Configure a Vulnerability Protection Profile set to block attacks against any critical or high vulnerabilities, at minimum,
    and set to default on any medium, low, or informational vulnerabilities. Configuring an alert action for low and informational,
    instead of default, will produce additional information at the expense of greater log utilization.
  rationale: By applying secure anti-spyware profiles to all applicable traffic, the threat of sensitive data exfiltration
    or command-and-control traffic successfully passing through the firewall is greatly reduced. Anti-spyware profiles are
    not restricted to particular protocols like antivirus profiles, so anti-spyware profiles should be applied to all security
    policies permitting traffic to the Internet. Assigning an anti-spyware profile to each trusted zone will quickly and easily
    identify trusted hosts that have been infected with spyware, by identifying the infection from their outbound network
    traffic. In addition, that outbound network traffic will be blocked by the profile. A Vulnerability Protection Profile
    helps to protect assets by alerting on, or blocking, network attacks. The default action for attacks against many critical
    and high vulnerabilities is to only alert on the attack - not to block.
  impact: ''
  references:
