  description: Apply a WildFire file blocking profile to all security policies allowing Internet traffic flows. In the following
    example, the “WildFire” blocking profile is included in the “Inside to Outside” profile group. In a production setting,
    both inbound and outbound traffic should be inspected and have a Wildfire blocking policy applied.
  rationale: Traffic matching security policies that do not include a WildFire file blocking profile will not utilize WildFire
    for file analysis. Wildfire analysis is one of the key security measures available on this platform. Without Wildfire
