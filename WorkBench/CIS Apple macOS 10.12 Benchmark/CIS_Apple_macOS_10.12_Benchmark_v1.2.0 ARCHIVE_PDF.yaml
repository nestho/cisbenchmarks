- id: '6.5'
  title: Use parental controls for systems that are not centrally managed
  scoring: manual
  profile:
  - Level 2
  description: Many aspects and features of macOS can be restricted on a user-by-user basis via the Parental Controls feature.
    This includes computer usage time limits, application accessibility limitations, and website restrictions. Although this
    feature is called Parental Controls, these restrictions may be appropriate for corporate, government, or educational use.
  rationale: Limiting usage and restricting features for managed users reduces the risk of the user and/or system being exposed
    to malicious and/or inappropriate content.
  impact: The extensive use of parental controls adds to the configuration management burden and can limit legitimate user
    activity.
