controls:
- id: '1.1'
  title: Verify all Apple provided software is current
  scoring: scored
  profile:
  - Level 1
  description: Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered. There is no simple way to complete this action without a network connection to an Apple software repository.
    Please ensure appropriate access for this control. This check is only for what Apple provides through software update.
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Missing patches can lead to more exploit opportunities. 13 | Page
  references: []
  page_start: 13
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Choose Apple menu > App Store

    2. Select Updates

    3. Verify that all available updates and software patches are installed.

    Alternatively:

    1. In Terminal, run the following:

    softwareupdate -l

    2. Result: No new software available

    Computers that have installed pre-release software in the past will fail this check if there

    are pre-release software updates available when audited. In the App Store setting System

    Preferences the computer may be set to no longer receive pre-release software.

    Alternatively

    defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

    LastFullSuccessfulDate

    Response should be in the last 30 days (Example)

    LastFullSuccessfulDate = "2018-02-27 00:16:40 +0000";

    14 | Page'
  remediation: 'Perform the following to ensure the system is configured as prescribed:

    1. Choose Apple menu > App Store – If prompted, enter an admin name and password.

    2. Install all available updates and software patches that are applicable.

    Alternatively:

    1. In Terminal, run the following:

    softwareupdate -l

    2. In Terminal, run the following for any packages that show up in step 1:

    sudo softwareupdate -i <packagename>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Choose Apple menu > App Store

      2. Select Updates

      3. Verify that all available updates and software patches are installed.

      Alternatively:

      1. In Terminal, run the following:

      softwareupdate -l

      2. Result: No new software available

      Computers that have installed pre-release software in the past will fail this check if there

      are pre-release software updates available when audited. In the App Store setting System

      Preferences the c'
    severity: medium
- id: '1.2'
  title: Enable Auto Update
  scoring: scored
  profile:
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates. If "Automatically
    check for updates" is not selected background updates for new malware definition files from Apple for XProtect and Gatekeeper
    will not occur. http://macops.ca/os-x-admins-your-clients-are-not-getting-background-security-updates/ https://derflounder.wordpress.com/2014/12/17/forcing-xprotect-blacklist-updates-onmavericks-and-yosemite/
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities.
  impact: Without automatic update, updates may not be made in a timely manner and the system will be exposed to additional
    risk.
  references: []
  page_start: 16
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Open a terminal session and enter the following command:

    defaults read /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticCheckEnabled

    2. Make sure the result is: 1

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.

    16 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    Open a terminal session and enter the following command to enable the auto update

    feature:

    sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticCheckEnabled -int 1'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Open a terminal session and enter the following command:

      defaults read /Library/Preferences/com.apple.SoftwareUpdate

      AutomaticCheckEnabled

      2. Make sure the result is: 1

      If automatic updates were selected during system set-up this setting may not have left an

      auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

      audited results.

      16 | Page'
    severity: medium
- id: '1.3'
  title: Enable app update installs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that application updates are installed after they are available from Apple. These updates do not require
    reboots or admin privileges for end users.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited
  impact: Unpatched software may be exploited
  references: []
  page_start: 18
  audit_raw: '1. Open System Preferences

    2. Select App Store

    3. Select Install app updates

    4. Verify that all available updates and software patches are installed.

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.commerce AutoUpdate

    2. Verify the value returned is 1.

    18 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable the auto update

    feature:

    sudo defaults write /Library/Preferences/com.apple.commerce AutoUpdate -bool

    TRUE

    The remediation requires a log out and log in to show in the GUI. Please note that.'
  checks:
  - type: manual_review
    info: '1. Open System Preferences

      2. Select App Store

      3. Select Install app updates

      4. Verify that all available updates and software patches are installed.

      Alternatively:

      Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read /Library/Preferences/com.apple.commerce AutoUpdate

      2. Verify the value returned is 1.

      18 | Page'
    severity: medium
- id: '1.4'
  title: Enable system data files and security update installs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that system and security updates are installed after they are available from Apple. This setting enables
    definition updates for XProtect and Gatekeeper, with this setting in place new malware and adware that Apple has added
    to the list of malware or untrusted software will not execute. These updates do not require reboots or end user admin
    rights. http://www.thesafemac.com/tag/xprotect/ https://support.apple.com/en-us/HT202491
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited
  impact: Unpatched software may be exploited 20 | Page
  references: []
  page_start: 20
  audit_raw: '1. Open System Preferences

    2. Select App Store

    3. Select install system data files and security updates

    4. Verify that all available updates and software patches are installed.

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

    ''(ConfigDataInstall|CriticalUpdateInstall)''

    2. Make sure the result is: ConfigDataInstall = 1; CriticalUpdateInstall = 1;

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.'
  remediation: 'Perform the following to implement the prescribed state:

    Open a terminal session and enter the following command to enable install system data

    files and security updates:

    sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate

    ConfigDataInstall -bool true && sudo defaults write

    /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool

    true'
  checks:
  - type: manual_review
    info: '1. Open System Preferences

      2. Select App Store

      3. Select install system data files and security updates

      4. Verify that all available updates and software patches are installed.

      Alternatively:

      Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read /Library/Preferences/com.apple.SoftwareUpdate | egrep

      ''(ConfigDataInstall|CriticalUpdateInstall)''

      2. Make sure the result is: ConfigDataInstall = 1; CriticalUpdateInstall = 1;

      If a'
    severity: medium
- id: '1.5'
  title: Enable macOS update installs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that macOS updates are installed after they are available from Apple. This setting enables macOS updates
    to be automatically installed. Some environments will want to approve and test updates before they are delivered. It is
    best practice to test first where updates can and have caused disruptions to operations. Automatic updates should be turned
    off where changes are tightly controlled and there are mature testing and approval processes. Automatic updates should
    not be turned off so the admin can call the users first to let them know it's ok to install. A dependable repeatable process
    involving a patch agent or remote management tool should be in place before auto-updates are turned off.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited
  impact: Unpatched software may be exploited 22 | Page
  references: []
  page_start: 22
  audit_raw: '1. Open System Preferences

    2. Select App Store

    3. Select Install macOS updates

    4. Verify that all available updates and software patches are installed.

    Alternatively:

    Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.commerce

    AutoUpdateRestartRequired

    2. Make sure the result is: 1

    If automatic updates were selected during system set-up this setting may not have left an

    auditable artifact. Please turn off the check and re-enable when the GUI does not reflect the

    audited results.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open a terminal session and enter the following command to enable install system

    data files and security updates:

    sudo defaults write /Library/Preferences/com.apple.commerce

    AutoUpdateRestartRequired -bool TRUE'
  checks:
  - type: manual_review
    info: '1. Open System Preferences

      2. Select App Store

      3. Select Install macOS updates

      4. Verify that all available updates and software patches are installed.

      Alternatively:

      Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read /Library/Preferences/com.apple.commerce

      AutoUpdateRestartRequired

      2. Make sure the result is: 1

      If automatic updates were selected during system set-up this setting may not have left an

      auditable artifact.'
    severity: medium
- id: 2.1.1
  title: Turn off Bluetooth, if no paired devices exist
  scoring: scored
  profile:
  - Level 1
  description: Bluetooth devices use a wireless communications system that replaces the cables used by other peripherals to
    connect to a system. It is by design a peer-to-peer network technology and typically lacks centralized administration
    and security enforcement infrastructure.
  rationale: Bluetooth is particularly susceptible to a diverse set of security vulnerabilities involving identity detection,
    location tracking, denial of service, unintended control and access of data and voice channels, and unauthorized device
    control and data access.
  impact: There have been many Bluetooth exploits, while Bluetooth can be hardened it does create a local wireless network
    that can be attacked to compromise both devices and information. Apple has emphasized the ease of use in Bluetooth devices
    so it is generally expected that Bluetooth will be used. Turning off Bluetooth with this control will also disable the
    Bluetooth sharing capability that is more strongly recommended against in control 2.4.7. 26 | Page
  references: []
  page_start: 26
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command:

    defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

    2. If the value returned is 0 the computer is compliant.

    3. If the value returned is 1 that indicates that Bluetooth is enabled; the computer is

    compliant only if paired devices exist. Use the following step.

    4. If the value returned in step 1 is 1 in the Terminal, run the following command:

    system_profiler SPBluetoothDataType | grep "Bluetooth:" -A 20 | grep

    Connectable

    5. Output should include: Connectable: Yes'
  remediation: 'Perform the following to implement the prescribed state:

    1. In a Terminal, run the following commands:

    sudo defaults write /Library/Preferences/com.apple.Bluetooth

    ControllerPowerState -int 0

    sudo killall -HUP blued'
  checks:
  - type: command
    command: system_profiler SPBluetoothDataType | grep "Bluetooth:" -A 20 | grep
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command:

      defaults read /Library/Preferences/com.apple.Bluetooth ControllerPowerState

      2. If the value returned is 0 the computer is compliant.

      3. If the value returned is 1 that indicates that Bluetooth is enabled; the computer is

      compliant only if paired devices exist. Use the following step.

      '
- id: 2.1.2
  title: Turn off Bluetooth "Discoverable" mode when not pairing devices
  scoring: scored
  profile:
  - Level 1
  description: When Bluetooth is set to discoverable mode, the Mac sends a signal indicating that it's available to pair with
    another Bluetooth device. When a device is "discoverable" it broadcasts information about itself and its location. Starting
    with OS X 10.9 Discoverable mode is enabled while the Bluetooth System Preference is open and turned off once closed.
    Systems that have the Bluetooth System Preference open at the time of audit will show as Discoverable.
  rationale: When in the discoverable state an unauthorized user could gain access to the system by pairing it with a remote
    device.
  impact: The system will need to be made Discoverable in order to easily pair Bluetooth peripherals
  references: []
  page_start: 28
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

    2. Verify the value returned is Discoverable: Off'
  remediation: 'Perform the following to implement the prescribed state:

    Starting with OS X (10.9) Bluetooth is only set to Discoverable when the Bluetooth System

    Preference is selected. To ensure that the computer is not Discoverable do not leave that

    preference open.

    28 | Page'
  checks:
  - type: command
    command: /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      /usr/sbin/system_profiler SPBluetoothDataType | grep -i discoverable

      2. Verify the value returned is Discoverable: Off'
- id: 2.1.3
  title: Show Bluetooth status in menu bar
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, Discoverable, what paired devices exist and are currently active.
  impact: Bluetooth is a useful wireless tool that has been widely exploited when configured improperly. The user should have
    insight into the Bluetooth status.
  references: []
  page_start: 30
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

    2. Verify the value returned is: /System/Library/CoreServices/Menu

    Extras/Bluetooth.menu

    30 | Page'
  remediation: 'In System Preferences: Bluetooth, turn Show Bluetooth Status In Menu Bar on.

    Alternatively run the following in the command line:

    defaults write com.apple.systemuiserver menuExtras -array-add

    "/System/Library/CoreServices/Menu Extras/Bluetooth.menu"

    If the remediation is run multiple times multiple instances of the Bluetooth status will

    appear after rebooting the system. Command-click and drag the unwanted icons off the

    menu bar

    http://osxdaily.com/2012/01/05/remove-icons-menu-bar-mac-os-x/'
  checks:
  - type: command
    command: defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu
    expected: ''
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read com.apple.systemuiserver menuExtras | grep Bluetooth.menu

      2. Verify the value returned is: /System/Library/CoreServices/Menu

      Extras/Bluetooth.menu

      30 | Page'
- id: 2.2.1
  title: Enable "Set time and date automatically"
  scoring: scored
  profile:
  - Level 1
  description: 'Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries. Note: If your organization has internal time servers, enter them here. Enterprise mobile devices may
    need to use a mix of internal and external time servers. If multiple servers are required use the Date & Time System Preference
    with each server separated by a space.'
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features.
  impact: Apple's automatic time update solution will enable an NTP server that is not controlled by the Application Firewall.
    Turning on "Set time and date automatically" allows other computers to connect to set their time and allows for exploit
    attempts against ntpd. It also allows for more accurate network detection and OS fingerprinting Current testing shows
    scanners can easily determine the MAC address and the OS vendor. More extensive OS fingerprinting may be possible. 33
    | Page
  references: []
  page_start: 33
  audit_raw: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Date & Time

    3. Select Set date and time automatically

    Alternatively run the following commands:

    Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command:

    sudo systemsetup -getusingnetworktime

    2. Verify that the results are: Network Time: On'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Date & Time

    3. Select Set date and time automatically

    Alternatively run the following commands:

    sudo systemsetup -setnetworktimeserver <timeserver>

    sudo systemsetup –setusingnetworktime on'
  checks:
  - type: manual_review
    info: 'Perform the following to implement the prescribed state:

      1. Open System Preferences

      2. Select Date & Time

      3. Select Set date and time automatically

      Alternatively run the following commands:

      Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command:

      sudo systemsetup -getusingnetworktime

      2. Verify that the results are: Network Time: On'
    severity: medium
- id: 2.2.2
  title: Ensure time set is within appropriate limits
  scoring: scored
  profile:
  - Level 1
  description: Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries. Ensure that time on the computer is within acceptable limits. Truly accurate time is measured within
    milliseconds, for this audit a drift under four and a half minutes passes the control check. Since Kerberos is one of
    the important features of macOS integration into Directory systems the guidance here is to warn you before there could
    be an impact to operations. From the perspective of accurate time this check is not strict, it may be too great for your
    organization, adjust to a smaller offset value as needed.
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features. Audit check is for more than 4 minutes and
    30 seconds ahead or behind.
  impact: Accurate time is required for many computer functions.
  references: []
  page_start: 35
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. In Terminal, run the following command:

    sudo systemsetup -getnetworktimeserver

    2. Use "Network Time Server:" <your.time.server> to capture drift

    sudo ntpdate -svd <your.time.server> | egrep offset

    3. Ensure that the offset result(s) are smaller than 270.x or -270.x seconds

    35 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    1. In Terminal, run the following command:

    sudo systemsetup -getnetworktimeserver

    2. Use "Network Time Server:" <your.time.server> to capture drift

    sudo ntpdate -sv <your.time.server>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. In Terminal, run the following command:

      sudo systemsetup -getnetworktimeserver

      2. Use "Network Time Server:" <your.time.server> to capture drift

      sudo ntpdate -svd <your.time.server> | egrep offset

      3. Ensure that the offset result(s) are smaller than 270.x or -270.x seconds

      35 | Page'
    severity: medium
- id: 2.3.1
  title: Set an inactivity interval of 20 minutes or less for the screen saver
  scoring: scored
  profile:
  - Level 1
  description: A locking screensaver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In macOS the screensaver starts after a value selected
    in a drop down menu, 10 minutes and 20 minutes are both options and either is acceptable. Any value can be selected through
    the command line or script but a number that is not reflected in the GUI can be problematic. 20 minutes is the default
    for new accounts.
  rationale: Setting an inactivity interval for the screensaver prevents unauthorized persons from viewing a system left unattended
    for an extensive period of time.
  impact: If the screensaver is not set users may leave the computer available for an unauthorized person to access information.
    38 | Page
  references: []
  page_start: 38
  audit_raw: "The preferred audit procedure for this control will evaluate every user account on the box\nand will report\
    \ on all users where the value has been set. If the default value of 20 minutes\nis used and the user has never changed\
    \ the setting there will not be an audit result on their\ncompliant setting.\nPerform the following to ensure the system\
    \ is configured as prescribed:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep \"IOPlatformUUID\" | sed -e\n's/^.*\
    \ \"(.*)\"$/1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
    \ if [ -e $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n defaults read $PREF.plist idleTime 2>&1\n fi\ndone\n\
    Verify the setting is not 0 but is adequately low (< 1200)\nPerform the following to ensure the system is configured as\
    \ prescribed for the current\nlogged in user:\n1. In Terminal, run the following command:\ndefaults -currentHost read\
    \ com.apple.screensaver idleTime\n2. Verify the setting is not but is adequately low (< 1200)\n39 | Page"
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Desktop & Screen Saver

    3. Select Screen__Saver

    4. Set Start after to 20 minutes or less

    Alternatively:

    1. In Terminal, run one of the the following commands:

    defaults -currentHost write com.apple.screensaver idleTime -int 600

    defaults -currentHost write com.apple.screensaver idleTime -int 1200

    There are anomalies if the command line is used to make the setting something other than

    what is available in the GUI Menu. Choose either 10 minutes or 20 minutes,'
  checks:
  - type: command
    command: UUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep "IOPlatformUUID" | sed -e
    expected: ''
    severity: medium
    info: 'The preferred audit procedure for this control will evaluate every user account on the box

      and will report on all users where the value has been set. If the default value of 20 minutes

      is used and the user has never changed the setting there will not be an audit result on their

      compliant setting.

      Perform the following to ensure the system is configured as prescribed:

      UUID=`ioreg -rd1 -c IOPlatform'
- id: 2.3.2
  title: Secure screen saver corners
  scoring: scored
  profile:
  - Level 2
  description: Hot Corners can be configured to disable the screen saver by moving the mouse cursor to a corner of the screen.
  rationale: Setting a hot corner to disable the screen saver poses a potential security risk since an unauthorized person
    could use this to bypass the login screen and gain access to the system.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. For all users, run the following command in Terminal:

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    2. Verify that 6 is not returned for any key value for any user.'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open System Preferences

    2. Select Mission Control

    3. Select Hot Corners

    4. Remove any corners which are set to Disable Screen Saver'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: 2. Verify that 6 is not returned for any key value for any user.
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. For all users, run the following command in Terminal:

      defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

      2. Verify that 6 is not returned for any key value for any user.'
- id: 2.3.3
  title: Set a screen corner to Start Screen Saver
  scoring: scored
  profile:
  - Level 1
  description: The intent of this control is to resemble control-alt-delete on Windows Systems as a means of quickly locking
    the screen. If the user of the system is stepping away from the computer the best practice is to lock the screen and setting
    a hot corner is an appropriate method.
  rationale: Ensuring the user has a quick method to lock their screen may reduce opportunity for individuals in close physical
    proximity of the device to see screen contents.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

    least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

    this feature.

    Alternatively, run the following command for each user:

    defaults read ~/Library/Preferences/com.apple.dock | grep -i corner

    For each user, verify at least one of the *-corner keys has a value of 5. For example,

    "wvous-tl-corner" = 5.

    42 | Page'
  remediation: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

    least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

    this feature.

    The screen corners can be set using the defaults command, but the permutations of

    combinations are many. The plist file to check is ~/Library/Preferences/com.apple.dock

    and the keys are

    wvous-bl-corner

    wvous-br-corner

    wvous-tl-corner

    wvous-tr-corner

    There are also modifier keys to check and various values for each of these keys. A value of 5

    means the corner will start the screen saver. The corresponding wvous-xx-modifier key

    should be set to 0.'
  checks:
  - type: command
    command: defaults read ~/Library/Preferences/com.apple.dock | grep -i corner
    expected: ''
    severity: medium
    info: 'In System Preferences: Desktop & Screen Saver: Screen Saver: Hot Corners, make sure at

      least one Active Screen Corner is set to Start Screen Saver. Make sure the user knows about

      this feature.

      Alternatively, run the following command for each user:

