- id: '2.9'
  title: Pair the remote control infrared receiver if enabled
  scoring: scored
  profile:
  - Level 1
  description: An infrared receiver is a piece of hardware that sends information from an infrared remote control to another
    device by receiving and decoding signals. If a remote is used with a computer, a specific remote, or "pair", can be set-up
    to work with the computer. This will allow only the paired remote to work on that computer. If a remote is needed the
    receiver should only be accessible by a paired device. Many models do not have infrared hardware. The audit check looks
    for the hardware first.
  rationale: An infrared remote can be used from a distance to circumvent physical security controls. A remote could also
    be used to page through a document or presentation, thus revealing sensitive information. While Apple hardware that still
    supports infrared is uncommon and has not been manufactured in years it still does exist. This control checks first for
    the presence of an IR receiver so systems that do not have IR will quickly pass this control check.
  impact: ''
  references:
  - 1. http://support.apple.com/kb/PH11060
  page_start: 101
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    system_profiler 2>/dev/null | egrep "IR Receiver"

    2. If "IR Receiver" information is returned run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.driver.AppleIRController

    3. Verify the value returned for DeviceEnabled = 0; If the value returned is

    DeviceEnabled = 1, then verify the value returned for the UIDFilter does not equal

    none

    101 | Page'
  remediation: 'Perform one of the following to implement the prescribed state:

    Disable the remote control infrared receiver:

    1. Open System Preferences

    2. Select Security & Privacy

    3. Select the General tab

    4. Select Advanced

    5. Check Disable remote control infrared receiver

    Pair a remote control infrared receiver:

    1. Holding the remote close to the computer, point the remote at the front of the

    computer.

    2. Pair the Apple Remote.

    • If you have an Apple Remote with seven buttons, press and hold both the Right and

    Menu buttons on the remote until the paired-remote icon appears on your screen

    • If you have an Apple Remote with six buttons, press and hold both the Next and

    Menu buttons on the remote until the paired-remote icon appears on your screen

    To disable the IR Receiver through the command line

    defaults read /Library/Preferences/com.apple.driver.AppleIRController

    DeviceEnabled -bool no'
