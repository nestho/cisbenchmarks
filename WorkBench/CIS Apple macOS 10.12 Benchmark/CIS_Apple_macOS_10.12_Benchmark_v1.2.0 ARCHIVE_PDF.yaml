- id: 2.5.1
  title: Disable "Wake for network access"
  scoring: scored
  profile:
  - Level 1
  description: This feature allows other users to be able to access your computer’s shared resources, such as shared printers
    or iTunes playlists, even when your computer is in sleep mode. In a closed network when only authorized devices could
    wake a computer it could be valuable to wake computers in order to do management push activity. Where mobile workstations
    and agents exist the device will more likely check in to receive updates when already awake. Mobile devices should not
    be listening for signals on unmanaged network where untrusted devices could send wake signals.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access.
  impact: Management programs like Apple Remote Desktop Administrator use this feature to wake computers. If turned off, such
    management programs will not be able to wake a computer over the LAN. If the wake-on-LAN feature is needed, do not turn
    off this feature. The control to prevent computer sleep has been retired for this version of the Benchmark. Forcing the
    computer to stay on and use energy in case a management push is needed is contrary to most current management processes.
    Only keep computers unslept if after hours pushes are required on closed LANs.
