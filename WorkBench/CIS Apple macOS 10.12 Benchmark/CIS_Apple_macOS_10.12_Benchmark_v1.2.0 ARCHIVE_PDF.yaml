- id: '5.17'
  title: Disable Fast User Switching
  scoring: manual
  profile:
  - Level 2
  description: Fast user switching allows a person to quickly log in to the computer with a different account. While only
    a minimal security risk, when a second user is logged in, that user might be able to see what processes the first user
    is using, or possibly gain other information about the first user. In a large directory environment where it is difficult
    to limit login access many valid users can login to other user's assigned computers.
  rationale: Fast user switching allows multiple users to run applications simultaneously at console. There can be information
    disclosed about processes running under a different user. Without a specific configuration to save data and log out users
    can have unsaved data running in a background session that is not obvious.
  impact: Where support staff visit users computers consoles they will not be able to log in to their own session if there
    is an active and locked session.
  references: []
  page_start: 189
  audit_raw: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

    checkbox is off.'
  remediation: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

    checkbox is off.'
  checks:
  - type: manual_review
    info: 'In System Preferences: Accounts, Login Options, make sure the "Enable fast user switching"

      checkbox is off.'
    severity: medium
- id: '5.18'
  title: Secure individual keychains and items
  scoring: manual
  profile:
  - Level 2
  description: By default, the keychain for an account, especially a local account, have the same password as the account's
    logon password. It is possible to change the passwords on keychains to something different than the login password, and
    doing so would keep that keychain locked until needed after login. This is especially important when a smartcard is being
    used for console login. Keychains need to be protected by more than a pin in order to be secured and the default behavior
    with a smartcard will result in a pin for the login password. Individual keychain entries can have special ACLs to increase
    security as well.
  rationale: Each keychain entry can have different access controls. It's possible to set the keychain item to require a keychain
    password every time an item is accessed, even if the keychain is unlocked. This level of security could be useful for
    bank passwords or other passwords that need extra security.
  impact: Having to enter the keychain password for each access could become inconvenient and/or tedious for users.
  references: []
  page_start: 191
  audit_raw: '1. Open Utilities

    2. Select Keychain Access

    3. Double-click keychain

    4. Select Access Control

    5. Verify if the box next to "Ask for Keychain Password" is checked'
  remediation: '1. Open Utilities

    2. Select Keychain Access

    3. Double-click keychain

    4. Select Access Control

    5. Check box next to "Ask for Keychain Password"

    191 | Page'
  checks:
  - type: manual_review
    info: '1. Open Utilities

      2. Select Keychain Access

      3. Double-click keychain

      4. Select Access Control

      5. Verify if the box next to "Ask for Keychain Password" is checked'
    severity: medium
- id: '5.19'
  title: Create specialized keychains for different purposes
  scoring: manual
  profile:
  - Level 2
  description: The keychain is a secure database store for passwords and certificates and is created for each user account
    on macOS. The system software itself uses keychains for secure storage. Users can create more than one keychain to protect
    various passwords separately.
  rationale: If the user can logically split password and other entries into different keychains with different passwords,
    a compromise of one password will have limited effect.
  impact: Using multiple keychains can be inconvenient. It is also not necessarily possible for all kinds of data, such as
    Safari auto-fill information, to be stored in secondary keychains. Not all keychain-aware applications may provide an
    interface to choose secondary keychains.
  references: []
  page_start: 193
  audit_raw: '1. Open Utilities

    2. Select Keychain Access

    3. Verify there are multiple keychains listed under Keychains on the upper lefthand

    side of the window'
  remediation: '1. Open Utilities

    2. Select Keychain Access

    3. Select File

    4. Select New Keychain

    5. Input name of new keychain next to Save As

    6. Select Create

    7. Drag and drop desired keychain items into new keychain from login keychain'
  checks:
  - type: manual_review
    info: '1. Open Utilities

      2. Select Keychain Access

      3. Verify there are multiple keychains listed under Keychains on the upper lefthand

      side of the window'
    severity: medium
- id: '5.20'
  title: System Integrity Protection status
  scoring: scored
  profile:
  - Level 1
  description: System Integrity Protection is a security feature introduced in OS X 10.11 El Capitan. System Integrity Protection
    restricts access to System domain locations and restricts runtime attachment to system processes. Any attempt to attempt
    to inspect or attach to a system process will fail. Kernel Extensions are now restricted to /Library/Extensions and are
    required to be signed with a Developer ID.
  rationale: Running without System Integrity Protection on a production system runs the risk of the modification of system
    binaries or code injection of system processes that would otherwise be protected by SIP.
  impact: System binaries and processes could become compromised
  references: []
  page_start: 195
  audit_raw: 'Perform the following to determine the System Integrity Protection status.

    1. Run the following command in Terminal:

    /usr/bin/csrutil status

    2. The output should be:

    System Integrity Protection status: enabled.

    195 | Page'
  remediation: 'Perform the following while booted in macOS Recovery Partition.

    1. Select Terminal from the Utilities menu

    2. Run the following command in Terminal:

    /usr/bin/csrutil enable

    3. The output should be:

    Successfully enabled System Integrity Protection. Please restart the machine

    for the changes to take effect.

    4. Reboot.

    If a change is to the status is attempted from the booted Operating System rather than the

    recovery partition an error will be generated.

    csrutil: failed to modify system integrity configuration. This tool needs to be executed from

    the Recovery OS.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine the System Integrity Protection status.

      1. Run the following command in Terminal:

      /usr/bin/csrutil status

      2. The output should be:

      System Integrity Protection status: enabled.

      195 | Page'
    severity: medium
