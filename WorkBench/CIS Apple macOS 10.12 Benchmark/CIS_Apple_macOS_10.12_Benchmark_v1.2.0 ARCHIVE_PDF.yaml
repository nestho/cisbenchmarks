- id: '7.7'
  title: App Store Automatically download apps purchased on other Macs Considerations
  scoring: manual
  profile:
  - Level 2
  description: With 10.9 Apple expanded the capability of the App Store to automatically download macOS applications that
    were purchased in the App Store on another Mac. This feature can be very desirable for personal Macs or in a small business
    setting so that all purchased software through Apple's App Store is provisioned on all macOS Computers, just like iOS.
    This feature may not be desirable in Enterprise environments where the expectations of handling software licenses, tracking
    software inventory and personal software are different. Please evaluate your organizations expectations about the use
    of personal software and software license tracking to align with this setting. For those organizations that are using
    Enterprise Apple IDs for their employees the reverse is true. If the user has the username and password for their Apple
    ID and software is being purchased on that account the user could download the software on other computers they have access
    to.
