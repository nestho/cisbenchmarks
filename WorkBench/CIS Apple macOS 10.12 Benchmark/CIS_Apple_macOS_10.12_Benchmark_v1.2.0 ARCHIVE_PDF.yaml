- id: '5.13'
  title: Disable ability to login to another user's active and locked session
  scoring: scored
  profile:
  - Level 1
  description: macOS has a privilege that can be granted to any user that will allow that user to unlock active user's sessions.
  rationale: Disabling the admins and/or user's ability to log into another user's active and locked session prevents unauthorized
    persons from viewing potentially sensitive and/or personal information.
  impact: While Fast user switching is a workaround for some lab environments especially where there is even less of an expectation
    of privacy this setting change may impact some maintenance workflows
  references: []
  page_start: 182
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    /usr/bin/security authorizationdb read system.login.screensaver 2>/dev/null |

    /usr/bin/grep -A 1 "<array>" | /usr/bin/awk -F "<|>" ''END{ print $3 }''

    2. Returned value should be "use-login-window-ui" if the system is configured as

    recommended.

    182 | Page'
  remediation: 'Edit the Authorization Database "authorizationdb" by replacing "authenticate-sessionowner-or-admin" with "use-login-window-ui"

    References

    https://derflounder.wordpress.com/2014/02/16/managing-the-authorization-databasein-os-x-mavericks/

    https://www.jamf.com/jamf-nation/discussions/18195/system-login-screensaver'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      /usr/bin/security authorizationdb read system.login.screensaver 2>/dev/null |

      /usr/bin/grep -A 1 "<array>" | /usr/bin/awk -F "<|>" ''END{ print $3 }''

      2. Returned value should be "use-login-window-ui" if the system is configured as

      recommended.

      182 | Page'
    severity: medium
