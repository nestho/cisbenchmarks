- id: '7.14'
  title: Apple File System (APFS)
  scoring: manual
  profile:
  - Level 1
  description: With the release of macOS 10.12 Apple has included a developer preview of a new file system called APFS. Many
    features desired in a modern file system are ready for use and some will be available when the release version is available
    in 2017. At this time the file system cannot be used for boot volumes or with FileVault. Filesystem formatting and manipulation
    is only available in the command line and not the GUI and there are some reported gaps with the encryption capabilities.
    Until the filesystem supports boot volumes, FileVault, OS integrated encryption and key management as well as GUI management
    it should not be used with production systems. APFS is part of macOS 10.13 and is expected to be used there. It is still
    recommended not to use on 10.12 systems. For more information on APFS https://developer.apple.com/library/prerelease/content/documentation/FileManagemen
    t/Conceptual/APFS_Guide/Introduction/Introduction.html#//apple_ref/doc/uid/TP4001 6999-CH1-DontLinkElementID_18 http://arstechnica.com/apple/2016/09/macos-10-12-sierra-the-ars-technica-review/8/
  rationale: APFS in macOS 10.12 has limitations that were resolved in macOS 10.13. The unfinished feature set argue agains
    the use of APFS in production systems that are not running 10.13 or higher.
  impact: ''
  references: []
