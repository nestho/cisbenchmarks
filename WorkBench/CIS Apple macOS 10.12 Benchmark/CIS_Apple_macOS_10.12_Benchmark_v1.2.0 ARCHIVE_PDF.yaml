- id: '4.1'
  title: Disable Bonjour advertising service
  scoring: scored
  profile:
  - Level 2
  description: Bonjour is an auto-discovery mechanism for TCP/IP devices which enumerate devices and services within a local
    subnet. DNS on macOS is integrated with Bonjour and should not be turned off, but the Bonjour advertising service can
    be disabled.
  rationale: Bonjour can simplify device discovery from an internal rogue or compromised host. An attacker could use Bonjour's
    multicast DNS feature to discover a vulnerable or poorlyconfigured service or additional information to aid a targeted
    attack. Implementing this control disables the continuous broadcasting of "I'm here!" messages. Typical end-user endpoints
    should not have to advertise services to other computers. This setting does not stop the computer from sending out service
    discovery messages when looking for services on an internal subnet, if the computer is looking for a printer or server
    and using service discovery. To block all Bonjour traffic except to approved devices the pf or other firewall would be
    needed.
  impact: Some applications, like Final Cut Studio and AirPort Base Station management, may not operate properly if the mDNSResponder
    is turned off.
  references: []
  page_start: 122
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read /Library/Preferences/com.apple.mDNSResponder.plist

    NoMulticastAdvertisements

    2. Verify the value returned is 1

    122 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    Run the following command in Terminal:

    defaults write /Library/Preferences/com.apple.mDNSResponder.plist

    NoMulticastAdvertisements'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read /Library/Preferences/com.apple.mDNSResponder.plist

      NoMulticastAdvertisements

      2. Verify the value returned is 1

      122 | Page'
    severity: medium
