  scoring: scored
  profile:
  - Level 1
  description: System Preferences controls system and user settings on a macOS Computer. System Preferences allows the user
    to tailor their experience on the computer as well as allowing the System Administrator to configure global security settings.
    Some of the settings should only be altered by the person responsible for the computer.
  rationale: By requiring a password to unlock System-wide System Preferences the risk is mitigated of a user changing configurations
    that affect the entire system and requires an admin user to re-authenticate to make changes
  impact: If Automatic login is not disabled an unauthorized user could login without supplying a user password or credential.
  references: []
