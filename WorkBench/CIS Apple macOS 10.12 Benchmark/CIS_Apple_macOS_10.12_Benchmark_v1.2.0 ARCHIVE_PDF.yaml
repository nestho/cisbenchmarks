    The output should be ≤ 365'
  remediation: 'Run the following command to require that passwords expire after at most 365 days:

    $ sudo pwpolicy -a <administratoraccount> -setaccountpolicies

    "maxMinutesUntilChangePassword=<value≤525600>"

