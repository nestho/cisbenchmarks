      configuration for every active user.

      210 | Page'
    severity: medium
- id: '6.3'
  title: Disable the automatic run of safe files in Safari
  scoring: scored
  profile:
  - Level 1
  description: Safari will automatically run or execute what it considers safe files. This can include installers and other
    files that execute on the operating system. Safari bases file safety by using a list of filetypes maintained by Apple.
    The list of files include text, image, video and archive formats that would be run in the context of the OS rather than
    the browser.
  rationale: Hackers have taken advantage of this setting via drive-by attacks. These attacks occur when a user visits a legitimate
    website that has been corrupted. The user unknowingly downloads a malicious file either by closing an infected pop-up
    or hovering over a malicious banner. An attacker can create a malicious file that will fall within Safari's safe file
    list that will download and execute without user input.
  impact: Apple considers many files that the operating system itself auto-executes as "safe files." Many of these files could
    be malicious and could execute locally without the user even knowing that a file of a specific type had been download.
  references: []
  page_start: 212
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    defaults read com.apple.Safari AutoOpenSafeDownloads

    2. The result should be 0

    212 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    1. Open Safari

    2. Select Safari from the menu bar

    3. Select Preferences

    4. Select General

    5. Uncheck Open "safe" files after downloading

    Alternatively run the following command in Terminal:

    defaults write com.apple.Safari AutoOpenSafeDownloads -boolean no'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      defaults read com.apple.Safari AutoOpenSafeDownloads

      2. The result should be 0

      212 | Page'
    severity: medium
- id: '6.4'
  title: Safari disable Internet Plugins for global use
  scoring: manual
  profile:
  - Level 2
  description: Starting with Safari 10 and continuing with 11 Apple changed the model on how the builtin web browser handles
    Internet Plug-Ins. Instead of using a global approach where the Plug-in is either on or off for all sites the default
    decision is about allowing, not allowing, or allowing permanently for a specific site that is visited. Other browsers
    are moving to stop using Plug-ins altogether and insist on the use of HTML 5 for rich content. Only allowing Plug-in content
    from specific sites is a viable security option. In the Security Preferences, Plug-in settings it is possible to override
    the security feature and enable Plug-in content globally by Plug-in. With the controls planned in other macOS browsers
    allowing content globally is likely to put Safari users more at risk than other browser users. There are three options
    for Internet Plug-ins with Safari 10 "When visiting other websites" Ask, Off or On. The on setting should not be used.
    https://support.apple.com/en-us/HT202819
  rationale: Allow Internet Plugins only on required sites
  impact: Users will have to approve Internet Plugin use by site.
