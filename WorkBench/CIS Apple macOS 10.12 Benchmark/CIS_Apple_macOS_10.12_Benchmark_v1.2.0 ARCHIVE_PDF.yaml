- id: '3.3'
  title: Ensure security auditing retention
  scoring: scored
  profile:
  - Level 1
  description: 'The macOS audit capability contains important information to investigate security or operational issues. This
    resource is only completely useful if it is retained long enough to allow technical staff to find the root cause of anomalies
    in the records. Retention can be set to respect both size and longevity. To retain as much as possible under a certain
    size the recommendation is to use: expire-after:60d OR 1G More info in the man page man audit_control'
  rationale: The audit records need to be retained long enough to be reviewed as necessary.
  impact: The recommendation is that at least 60 days or 1 gigabyte of audit records are retained. Systems that very little
    remaining disk space may have issues retaining sufficient data.
  references: []
  page_start: 113
  audit_raw: 'Run from the command line

    sudo cat /etc/security/audit_control | egrep expire-after

    Results should be the following or larger/higher

    expire-after:60d OR 1G'
  remediation: 'Edit the /etc/security/audit_control file so that:

    expire-after is at least 60d OR 1G

    113 | Page'
  checks:
  - type: manual_review
    info: 'Run from the command line

      sudo cat /etc/security/audit_control | egrep expire-after

      Results should be the following or larger/higher

      expire-after:60d OR 1G'
    severity: medium
- id: '3.4'
  title: Control access to audit records
  scoring: scored
  profile:
  - Level 1
  description: The audit system on macOS writes important operational and security information that can be both useful for
    an attacker and a place for an attacker to attempt to obfuscate unwanted changes that were recorded. As part of defense-in-depth
    the /etc/security/audit_control configuration and the files in /var/audit should be owned only by root with group wheel
    with read only rights and no other access allowed. macOS ACLs should not be used for these files.
  rationale: Audit records should never be changed except by the system daemon posting events. Records may be viewed or extracts
    manipulated but the authoritative files should be protected from unauthorized changes.
  impact: This control is only checking the default configuration to ensure that unwanted access to audit records is not available.
  references: []
  page_start: 115
  audit_raw: 'Use ls -le to check file access rights.

    ls -le /etc/security/audit_control

    ls -le /var/audit/

    All entries should be owned by root with group wheel with read access and no other access,

    including no ACLs

    Example

    -r-------- 1 root wheel 364 Jun 29 18:50 /etc/security/audit_control

    and

    -r--r----- 1 root wheel 51240 Jun 4 05:34 20180604092609.crash_recovery

    -r--r----- 1 root wheel 900686 Jul 4 09:29 20180604094343.not_terminated

    lrwxr-xr-x 1 root wheel 40 Jun 4 05:43 current ->

    /var/audit/20180604094343.not_terminated

    The current symbolic link will have different Access Control

    115 | Page'
  remediation: 'If the system has different access controls on the audit logs and the changes cannot be

    traced a new install may be prudent. Check for signs of file tampering as well as

    unapproved OS changes.'
  checks:
  - type: command
    command: ls -le /etc/security/audit_control && ls -le /var/audit/
    expected: ''
    severity: medium
    info: 'Use ls -le to check file access rights.

      ls -le /etc/security/audit_control

      ls -le /var/audit/

      All entries should be owned by root with group wheel with read access and no other access,

      including no ACLs

      Example

      -r-------- 1 root wheel 364 Jun 29 18:50 /etc/security/audit_control

      and

      -r--r----- 1 root wheel 51240 Jun 4 05:34 20180604092609.crash_recovery

      -r--r----- 1 root wheel 900686 Jul 4 09:29 2'
- id: '3.5'
  title: Retain install.log for 365 or more days
  scoring: scored
  profile:
  - Level 1
  description: macOS writes information pertaining to system-related events to the file /var/log/install.log and has a configurable
    retention policy for this file. The default logging setting limits the file size of the logs and the maximum size for
    all logs. The default allows for an errant application to fill the log files and does not enforce sufficient log retention.
    The Benchmark recommends a value based on standard use cases. The value should align with local requirements within the
    organization. The default value has an "all_max" file limitation, no reference to a minimum retention and a less precise
    rotation argument. • The maximum file size limitation string should be removed "all_max=" • An organization appropriate
    retention should be added "ttl=" • The rotation should be set with time stamps "rotate=utc" or "rotate=local"
  rationale: Archiving and retaining install.log for at least a year is beneficial in the event of an incident as it will
    allow the user to view the various changes to the system along with the date and time they occurred.
  impact: Without log files system maintenance and security forensics cannot be properly performed.
  references: []
  page_start: 117
  audit_raw: 'Perform the following to ensure the system is configured as prescribed:

    1. Run the following command in Terminal:

    grep -i ttl /etc/asl/com.apple.install

    2. Verify that ttl is 365 or higher for install.log

    117 | Page'
  remediation: 'Perform the following to implement the prescribed state:

    1. Run the following command in Terminal:

    sudo vim /etc/asl/com.apple.install

    2. Replace or edit the current setting with a compliant setting

    * file /var/log/install.log mode=0640 format=bsd rotate=utc compress

    file_max=5M ttl=365'
  checks:
  - type: command
    command: grep -i ttl /etc/asl/com.apple.install
    expected: 2. Verify that ttl is 365 or higher for install.log
    severity: medium
    info: 'Perform the following to ensure the system is configured as prescribed:

      1. Run the following command in Terminal:

      grep -i ttl /etc/asl/com.apple.install

      2. Verify that ttl is 365 or higher for install.log

      117 | Page'
