  description: Rootless mode executes the Docker daemon and containers inside a user namespace, with both the daemon and the
    container are running without root privileges.
  rationale: Rootless mode allows running the Docker daemon and containers as a non-root user to mitigate potential vulnerabilities
    in the daemon and the container runtime.
