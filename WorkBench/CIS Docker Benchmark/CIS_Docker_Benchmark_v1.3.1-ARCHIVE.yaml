- id: '2.9'
  title: Enable user namespace support
  scoring: scored
  profile:
  - Level 2 - Docker - Linux
  description: You should enable user namespace support in Docker daemon to utilize container user to host user re-mapping.
    This recommendation is beneficial where the containers you are using do not have an explicit container user defined in
    the container image. If the container images that you are using have a pre-defined non-root user, this recommendation
    may be skipped as this feature is still in its infancy, and might result in unpredictable issues or difficulty in configuration.
  rationale: The Linux kernel "user namespace" support within the Docker daemon provides additional security for the Docker
    host system. It allows a container to have a unique range of user and group IDs which are outside the traditional user
    and group range utilized by the host system. For example, the root user can have the expected administrative privileges
    inside the container but can effectively be mapped to an unprivileged UID on the host system.
  impact: User namespace remapping is incompatible with a number of Docker features and also currently breaks some of its
    functionalities. Reference the Docker documentation and included links for details.
  references:
  - 1. https://man7.org/linux/man-pages/man7/user_namespaces.7.html
  - 2. https://docs.docker.com/engine/reference/commandline/dockerd/#daemon-usernamespace-options
