- id: '2.4'
  title: Ensure Docker is allowed to make changes to iptables
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The iptables firewall is used to set up, maintain, and inspect the tables of IP packet filter rules within
    the Linux kernel. The Docker daemon should be allowed to make changes to the iptables ruleset.
  rationale: Docker will never make changes to your system iptables rules unless you allow it to do so. If you do allow this,
    Docker server will automatically make any required changes. We recommended letting Docker make changes to iptables automatically
    in order to avoid networking misconfigurations that could affect the communication between containers and with the outside
    world. Additionally, this reduces the administrative overhead of updating iptables every time you add containers or modify
    networking options.
  impact: The Docker daemon service requires iptables rules to be enabled before it starts. Any restarts of iptables during
    Docker daemon operation may result in losing Docker created rules. Adding iptables-persistent to your iptables install
    can assist with mitigation of this impact.
  references:
  - 1. https://docs.docker.com/engine/reference/commandline/dockerd/
  - 2. https://docs.docker.com/network/iptables/
  page_start: 61
  audit_raw: 'To confirm this setting you should review the dockerd start-up options and the settings in

    /etc/docker/daemon.json

    To review the dockerd startup options, use:

    ps -ef | grep dockerd

    Ensure that the --iptables parameter is either not present or not set to false.

    The contents of /etc/docker/daemon.json should also be reviewed for this setting.'
  remediation: 'Do not run the Docker daemon with --iptables=false parameter. For example, do not

    start the Docker daemon as below:

    61 | P a g e

    dockerd --iptables=false'
  checks:
  - type: command
    command: ps -ef | grep dockerd
    expected: ''
    severity: medium
    info: 'To confirm this setting you should review the dockerd start-up options and the settings in

      /etc/docker/daemon.json

