- id: '6.2'
  title: Ensure that container sprawl is avoided
  scoring: manual
  profile:
  - Level 1 - Linux Host OS
  description: You should not keep a large number of containers on the same host.
  rationale: The flexibility of containers makes it easy to run multiple instances of applications and therefore indirectly
    leads to Docker images that can exist at varying security patch levels. It also means that you are consuming host resources
    that otherwise could have been used for running 'useful' containers. Having more than just an essential number of containers
    on a particular host makes the system vulnerable to mishandling, misconfiguration and fragmentation. You should therefore
    keep the number of containers on a given host to the minimum number commensurate with serving production applications.
  impact: You should retain containers that are actively in use, and delete ones which are no longer needed.
