- id: '5.11'
  title: Ensure that CPU priority is set appropriately on containers
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, all containers on a Docker host share resources equally. By using the resource management capabilities
    of the Docker host you can control the host CPU resources that a container may consume.
  rationale: By default, CPU time is divided between containers equally. If you wish to control available CPU resources amongst
    container instances, you can use the CPU sharing feature. CPU sharing allows you to prioritize one container over others
    and prevents lower priority containers from absorbing CPU resources which may be required by other processes. This ensures
    that high priority containers are able to claim the CPU runtime they require.
  impact: If you do not correctly assign CPU thresholds, the container process may run out of resources and become unresponsive.
    If CPU resources on the host are not constrainted, CPU shares do not place any restrictions on individual resources.
  references:
  - 1. https://docs.docker.com/config/containers/resource_constraints/#cpu
  - 2. https://docs.docker.com/engine/reference/commandline/run/#options
