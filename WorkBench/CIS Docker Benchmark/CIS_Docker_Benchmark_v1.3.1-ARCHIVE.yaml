- id: '7.2'
  title: Ensure that the minimum number of manager nodes have been created in a swarm
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: You should ensure that the minimum number of required manager nodes is created in a swarm.
  rationale: Manager nodes within a swarm have control over the swarm and can change its configuration, including modifying
    security parameters. Having excessive manager nodes could render the swarm more susceptible to compromise. If fault tolerance
    is not required in the manager nodes, a single node should be elected as a manger. If fault tolerance is required then
    the smallest odd number to achieve the appropriate level of tolerance should be configured. This should always be an odd
    number in order to ensure that a quorum is reached.
  impact: None
  references:
  - 1. https://docs.docker.com/engine/swarm/manage-nodes/
  - 2. https://docs.docker.com/engine/swarm/admin_guide/#add-manager-nodes-forfault-tolerance
  page_start: 234
