- id: '5.30'
  title: Ensure that the host's user namespaces are not shared
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: You should not share the host's user namespaces with containers running on it.
  rationale: User namespaces ensure that a root process inside the container will be mapped to a nonroot process outside the
    container. Sharing the user namespaces of the host with the container does not therefore isolate users on the host from
    users in the containers.
  impact: None
  references:
  - 1. https://docs.docker.com/engine/security/userns-remap/
  - 2. https://docs.docker.com/engine/reference/commandline/run/#options
  page_start: 223
