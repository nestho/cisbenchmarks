- id: 1.1.6
  title: Ensure auditing is configured for Docker files and directories - /etc/docker
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Audit /etc/docker.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files
    and directories. The Docker daemon runs with root privilege and its behavior depends on some key files and directories,
    one of these being /etc/docker. This holds various certificates and keys used for TLS communication between Docker daemon
