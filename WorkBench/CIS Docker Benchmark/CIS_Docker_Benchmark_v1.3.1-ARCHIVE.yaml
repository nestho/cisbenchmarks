    to 5.
  rationale: If you indefinitely keep trying to start the container, it could possibly lead to a denial of service on the
    host. It could be an easy way to do a distributed denial of service attack especially if you have many containers on the
    same host. Additionally, ignoring the exit status of the container and always attempting to restart the container, leads
    to noninvestigation of the root cause behind containers getting terminated. If a container gets terminated, you should
    investigate on the reason behind it instead of just attempting to restart it indefinitely. You should use the on-failure
    restart policy to limit the number of container restarts to a maximum of 5 attempts.
