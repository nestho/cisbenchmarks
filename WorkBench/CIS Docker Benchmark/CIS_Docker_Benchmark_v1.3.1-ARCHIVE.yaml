- id: '7.3'
  title: Ensure that swarm services are bound to a specific host interface
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, Docker swarm services will listen on all interfaces on the host. This may not be necessary for
    the operation of the swarm where the host has multiple network interfaces.
  rationale: When a swarm is initialized the default value for the --listen-addr flag is 0.0.0.0:2377 which means that swarm
    services will listen on all interfaces on the host. If a host has multiple network interfaces this may be undesirable
    as it could expose swarm services to networks which are not involved with the operation of the swarm. By passing a specific
    IP address to the --listen-addr, a specific network interface can be specified, limiting this exposure.
  impact: None
  references:
  - 1. https://docs.docker.com/engine/reference/commandline/swarm_init/#--listenaddr
  - 2. https://docs.docker.com/engine/swarm/admin_guide/#recover-from-disaster
