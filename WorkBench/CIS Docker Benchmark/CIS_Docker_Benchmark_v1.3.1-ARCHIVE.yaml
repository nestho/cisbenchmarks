- id: '2.6'
  title: Ensure aufs storage driver is not used
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: Do not use aufs as the storage driver for your Docker instance.
  rationale: The aufs storage driver is the oldest storage driver used on Linux systems. It is based on a Linux kernel patch-set
    that is unlikely in future to be merged into the main OS kernel. The aufs driver is also known to cause some serious kernel
    crashes. aufs only has legacy support within systems using Docker. Most importantly, aufs is not a supported driver in
    many Linux distributions using latest Linux kernels and has also been deprecated with Docker Engine release 20.10.
  impact: aufs is the only storage driver that allows containers to share executable and shared library memory. It might be
    useful if you are running thousands of containers with the same program or libraries, however its use should be reviewed
    in line with your organization's security policy.
  references:
  - 1. https://docs.docker.com/storage/storagedriver/select-storage-driver/
  page_start: 65
  audit_raw: 'Execute the below command and verify that aufs is not used as storage driver:

    docker info --format ''Storage Driver: {{ .Driver }}''

    The above command should not return aufs.'
  remediation: 'Do not explicitly use aufs as storage driver.

    For example, do not start Docker daemon as below:

    dockerd --storage-driver aufs'
  checks:
  - type: command
    command: 'docker info --format ''Storage Driver: {{ .Driver }}'''
    expected: 'Execute the below command and verify that aufs is not used as storage driver:'
    severity: medium
    info: 'Execute the below command and verify that aufs is not used as storage driver:

      docker info --format ''Storage Driver: {{ .Driver }}''

      The above command should not return aufs.'
- id: '2.7'
  title: Ensure TLS authentication for Docker daemon is configured
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: It is possible to make the Docker daemon available remotely over a TCP port. If this is required, you should
    ensure that TLS authentication is configured in order to restrict access to the Docker daemon via IP address and port.
  rationale: By default, the Docker daemon binds to a non-networked Unix socket and runs with root privileges. If you change
    the default Docker daemon binding to a TCP port or any other Unix socket, anyone with access to that port or socket could
    have full access to the Docker daemon and therefore in turn to the host system. For this reason, you should not bind the
    Docker daemon to another IP/port or a Unix socket. If you must expose the Docker daemon via a network socket, you should
    configure TLS authentication for the daemon and for any Docker Swarm APIs (if they are in use). This type of configuration
    restricts the connections to your Docker daemon over the network to a limited number of clients who have access to the
    TLS client credentials.
  impact: You would need to manage and guard certificates and keys for the Docker daemon and Docker clients.
  references:
  - 1. https://docs.docker.com/engine/security/https/
  page_start: 67
  audit_raw: 'To confirm this setting, review the dockerd start-up options and any settings in

    /etc/docker/daemon.json.

    To review the dockerd startup options, use:

    ps -ef | grep dockerd

    Ensure that the below parameters are present:

    --tlsverify

    --tlscacert

    67 | P a g e

    --tlscert

    --tlskey

    The contents of /etc/docker/daemon.json to ensure these settings are in place.'
  remediation: Follow the steps mentioned in the Docker documentation or other references.
  checks:
  - type: command
    command: ps -ef | grep dockerd
    expected: ''
    severity: medium
    info: 'To confirm this setting, review the dockerd start-up options and any settings in

