controls:
- id: 1.1.1
  title: Ensure a separate partition for containers has been created
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: All Docker containers and their data and metadata is stored under /var/lib/docker directory. By default, /var/lib/docker
    should be mounted under either the / or /var partitions dependent on how the Linux operating system in use is configured.
  rationale: Docker depends on /var/lib/docker as the default directory where all Docker related files, including the images,
    are stored. This directory could fill up quickly causing both Docker and the host to become unusable. For this reason,
    you should create a separate partition (logical volume) for storing Docker files.
  impact: None.
  references:
  - 1. https://www.projectatomic.io/docs/docker-storage-recommendation/
  - 2. https://docs.docker.com/storage/
  page_start: 15
  audit_raw: 'At the Docker host execute one of the below commands:

    grep ''/var/lib/docker\s'' /proc/mounts

    This should return the partition details for the /var/lib/docker mountpoint.

    mountpoint -- "$(docker info -f ''{{ .DockerRootDir }}'')"

    This should return whether the configured root directory is a mount point.'
  remediation: '15 | P a g e

    For new installations, you should create a separate partition for the /var/lib/docker

    mount point. For systems which have already been installed, you should use the Logical

    Volume Manager (LVM) within Linux to create a new partition.'
  checks:
  - type: command
    command: grep '/var/lib/docker\s' /proc/mounts
    expected: This should return the partition details for the /var/lib/docker mountpoint.
    severity: medium
    info: 'At the Docker host execute one of the below commands:

      grep ''/var/lib/docker\s'' /proc/mounts

      This should return the partition details for the /var/lib/docker mountpoint.

      mountpoint -- "$(docker info -f ''{{ .DockerRootDir }}'')"

      This should return whether the configured root directory is a mount point.'
- id: 1.1.2
  title: Ensure only trusted users are allowed to control Docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: The Docker daemon currently requires access to the Docker socket which is, by default, owned by the user root
    and the group docker.
  rationale: Docker allows you to share a directory between the Docker host and a guest container without limiting the access
    rights of the container. This means that you can start a container and map the / directory on your host to the container.
    The container would then be able to modify your host file system without any restrictions. This means that you could gain
    elevated privileges simply by being a member of the docker group and subsequently start a container which maps the root
    / directory on the host.
  impact: Provided the proceeding instructions are implemented, rights to build and execute containers as normal user would
    be restricted.
  references:
  - 1. https://docs.docker.com/engine/security/#docker-daemon-attack-surface
  - 2. http://www.projectatomic.io/blog/2015/08/why-we-dont-let-non-root-users-rundocker-in-centos-fedora-or-rhel/
  page_start: 17
  audit_raw: 'Execute the following command on the docker host and ensure that only trusted users are

    members of the docker group.

    getent group docker'
  remediation: 'You should remove any untrusted users from the docker group. Additionally, you should

    not create a mapping of sensitive directories from the host to container volumes.'
  checks:
  - type: manual_review
    info: 'Execute the following command on the docker host and ensure that only trusted users are

      members of the docker group.

      getent group docker'
    severity: medium
- id: 1.1.3
  title: Ensure auditing is configured for the Docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Audit all Docker daemon activities.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit the Docker daemon. Because
    this daemon runs with root privileges. It is very important to audit its activities and usage.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition.
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/8/html/system_design_guide/auditing-thesystem_system-design-guide
  page_start: 19
  audit_raw: 'Verify that there are audit rules for the Docker daemon. For example, you could execute the

    following command:

    auditctl -l | grep /usr/bin/dockerd

    This should show the rules associated with the Docker daemon.'
  remediation: 'You should add rules for the Docker daemon.

    For example:

    Add the line below to the /etc/audit/audit.rules file:

    -w /usr/bin/dockerd -k docker

    Then, restart the audit daemon using the following command

    systemctl restart auditd'
  checks:
  - type: command
    command: auditctl -l | grep /usr/bin/dockerd
    expected: Verify that there are audit rules for the Docker daemon. For example, you could execute the
    severity: medium
    info: 'Verify that there are audit rules for the Docker daemon. For example, you could execute the

      following command:

      auditctl -l | grep /usr/bin/dockerd

      This should show the rules associated with the Docker daemon.'
- id: 1.1.4
  title: Ensure auditing is configured for Docker files and directories - /run/containerd
  scoring: scored
  profile:
  - Level 2 - Linux Host OS
  description: Audit /run/containerd.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files
    and directories. The Docker daemon runs with root privileges and its behaviour depends on some key files and directories.
    /run/containerd is one such directory. As it holds all the information about containers it should be audited.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition.
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/8/html/system_design_guide/auditing-thesystem_system-design-guide
  page_start: 21
  audit_raw: 'You should verify that there is an audit rule applied to the /run/containerd directory.

    For example, you could execute the command below:

    auditctl -l | grep /run/containerd

    This should list a rule for the /run/containerd directory.'
  remediation: 'You should add a rule for the /run/containerd directory.

    For example,

    Add the line as below to the /etc/audit/audit.rules file:

    -a exit,always -F path=/run/containerd -F perm=war -k docker

    Then, restart the audit daemon using the following command

    systemctl restart auditd

    21 | P a g e'
  checks:
  - type: command
    command: auditctl -l | grep /run/containerd
    expected: You should verify that there is an audit rule applied to the /run/containerd directory.
    severity: medium
    info: 'You should verify that there is an audit rule applied to the /run/containerd directory.

      For example, you could execute the command below:

      auditctl -l | grep /run/containerd

      This should list a rule for the /run/containerd directory.'
