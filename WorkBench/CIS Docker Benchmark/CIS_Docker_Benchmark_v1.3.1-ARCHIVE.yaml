- id: '2.8'
  title: Ensure the default ulimit is configured appropriately
  scoring: manual
  profile:
  - Level 1 - Docker - Linux
  description: Set the default ulimit options as appropriate in your environment.
  rationale: ulimit provides control over the resources available to the shell and to processes which it starts. Setting system
    resource limits judiciously can save you from disasters such as a fork bomb. On occasion, even friendly users and legitimate
    processes can overuse system resources and can make the system unusable. Setting the default ulimit for the Docker daemon
    enforces the ulimit for all container instances. In this case you would not need to setup ulimit for each container instance.
    However, the default ulimit can be overridden during container runtime, if needed. Therefore, in order to have proper
    control over system resources, define a default ulimit as is needed in your environment.
  impact: If ulimits are set incorrectly this could cause issues with system resources, possibly causing a denial of service
    condition.
  references:
