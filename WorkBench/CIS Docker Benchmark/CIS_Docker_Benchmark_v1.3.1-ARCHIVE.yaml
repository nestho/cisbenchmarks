- id: '5.27'
  title: Ensure that Docker commands always make use of the latest version of their image
  scoring: manual
  profile:
  - Level 1 - Docker - Linux
  description: You should always ensure that you are using the latest version of the images within your repository and not
    cached older versions.
  rationale: Multiple Docker commands such as docker pull, docker run etc. are known to have an issue where by default, they
    extract the local copy of the image, if present, even though there is an updated version of the image with the same tag
    in the upstream repository. This could lead to using older images containing known vulnerabilites.
  impact: None
  references:
  - 1. https://docs.docker.com/engine/reference/commandline/pull/
  page_start: 217
  audit_raw: 'You should carry out the following steps:

    Step 1: Open your image repository and list the image version history for the image you

    are inspecting.

    Step 2: Observe the status when the docker pull command is triggered.

    If the status is shown as Image is up to date, it means that you are getting the cached

    version of the image.

    Step 3: Match the version of the image you are running to the latest version reported in

    your repository and this will tell you whether you are running the cached version or the

    latest copy.'
  remediation: 'You should use proper version pinning mechanisms (the "latest" tag which is assigned by

    default is still vulnerable to caching attacks) to avoid extracting cached older versions.

    Version pinning mechanisms should be used for base images, packages, and entire images.

    You can customize version pinning rules according to your requirements.'
  checks:
  - type: manual_review
    info: 'You should carry out the following steps:

      Step 1: Open your image repository and list the image version history for the image you

      are inspecting.

      Step 2: Observe the status when the docker pull command is triggered.

      If the status is shown as Image is up to date, it means that you are getting the cached

      version of the image.

      Step 3: Match the version of the image you are running to the latest version reported in

      your repository and this will tell you whether you are running the cached version or '
    severity: medium
- id: '5.28'
  title: Ensure that the PIDs cgroup limit is used
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: You should use the --pids-limit flag at container runtime.
  rationale: Attackers could launch a fork bomb with a single command inside the container. This fork bomb could crash the
    entire system and would require a restart of the host to make the system functional again. Using the PIDs cgroup parameter
    --pids-limit would prevent this kind of attack by restricting the number of forks that can happen inside a container within
    a specified time frame.
  impact: Set the PIDs limit value as appropriate. Incorrect values might leave containers unusable.
  references:
  - 1. https://docs.docker.com/engine/reference/commandline/run/
  page_start: 219
  audit_raw: 'You should run the command below and ensure that PidsLimit is not set to 0 or -1. A

    PidsLimit of 0 or -1 means that any number of processes can be forked concurrently inside

    the container.

    docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:

    PidsLimit={{ .HostConfig.PidsLimit }}'''
  remediation: 'Use --pids-limit flag with an appropriate value when launching the container.

    For example:

    docker run -it --pids-limit 100 <Image ID>

    In the above example, the number of processes allowed to run at any given time is set to

    100. After a limit of 100 concurrently running processes is reached, Docker would restrict

    any new process creation.'
  checks:
  - type: command
    command: 'docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:'
    expected: ''
    severity: medium
    info: 'You should run the command below and ensure that PidsLimit is not set to 0 or -1. A

      PidsLimit of 0 or -1 means that any number of processes can be forked concurrently inside

      the container.

      docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:

      PidsLimit={{ .HostConfig.PidsLimit }}'''
