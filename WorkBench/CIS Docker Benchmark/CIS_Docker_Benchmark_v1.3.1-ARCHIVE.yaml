  rationale: Tagged images are useful if you need to fall back from the "latest" version to a specific version of an image
    in production. Images with unused or old tags may contain vulnerabilities that might be exploited if instantiated.
  impact: docker system prune -a removes all exited containers as well as all images and volumes that are not referenced by
    running containers. If any images are removed, this would result in needing to reload the images to the host.
