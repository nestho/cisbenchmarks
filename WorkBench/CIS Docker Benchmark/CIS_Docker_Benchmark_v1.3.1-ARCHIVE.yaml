- id: '2.12'
  title: Ensure that authorization for Docker client commands is enabled
  scoring: scored
  profile:
  - Level 2 - Docker - Linux
  description: You should use native Docker authorization plugins or a third party authorization mechanism with the Docker
    daemon to manage access to Docker client commands.
  rationale: Docker’s out-of-the-box authorization model is currently "all or nothing". This means that any user with permission
    to access the Docker daemon can run any Docker client command. The same is true for remote users accessing Docker’s API
    to contact the daemon. If you require greater access control, you can create authorization plugins and add them to your
    Docker daemon configuration. Using an authorization plugin, a Docker administrator can configure granular access policies
    for managing access to the Docker daemon. Third party integrations of Docker may implement their own authorization models
    to require authorization with the Docker daemon outside of docker's native authorization plugin (i.e. Kubernetes, Cloud
    Foundry, Openshift).
  impact: Each Docker command needs to pass through the authorization plugin mechanism. This may have a performance impact.
    It may be possible to use alternative mechanisms that do not have this performance hit.
  references:
  - 1. https://docs.docker.com/engine/reference/commandline/dockerd/#accessauthorization
  - 2. https://docs.docker.com/engine/extend/plugins_authorization/
