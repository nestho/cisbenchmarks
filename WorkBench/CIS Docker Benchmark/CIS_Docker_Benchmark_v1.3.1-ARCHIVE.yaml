- id: '4.5'
  title: Ensure Content trust for Docker is Enabled
  scoring: scored
  profile:
  - Level 2 - Docker - Linux
  description: Content trust is disabled by default and should be enabled in line with organizational security policy.
  rationale: Content trust provides the ability to use digital signatures for data sent to and received from remote Docker
    registries. These signatures allow client-side verification of the identity and the publisher of specific image tags and
    ensures the provenance of container images.
  impact: 'In an environment where DOCKER_CONTENT_TRUST is set, you are required to follow trust procedures whilst working
    with the image related commands - build, create, pull, push and run. You can use the --disable-content-trust flag to run
    individual operations on tagged images without content trust on an as needed basis, but this defeats the purpose of enabling
    content trust and therefore should be avoided wherever possible. Note: Content trust is currently only available for users
    of the public Docker Hub. It is currently not available for the Docker Trusted Registry or for private registries.'
  references:
  - 1. https://docs.docker.com/engine/security/trust/
  - 2. https://docs.docker.com/notary/service_architecture/
