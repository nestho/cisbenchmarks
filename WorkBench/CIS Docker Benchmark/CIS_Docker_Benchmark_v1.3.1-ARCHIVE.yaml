- id: '7.10'
  title: Ensure that management plane traffic is separated from data plane traffic
  scoring: manual
  profile:
  - Level 2 - Docker - Linux
  description: You should separate management plane traffic from data plane traffic.
  rationale: Separating management plane traffic from data plane traffic ensures that these types of traffic are segregated
    from each other. These traffic flows can then be individually monitored and tied to different traffic control policies
    and monitoring. This also ensures that the management plane is always reachable even if there is a great deal of traffic
    on the data plane.
