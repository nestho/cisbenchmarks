- id: '5.15'
  title: Ensure that the host's process namespace is not shared
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The Process ID (PID) namespace isolates the process ID space, meaning that processes in different PID namespaces
    can have the same PID. This creates process level isolation between the containers and the host.
  rationale: PID namespace provides separation between processes. It prevents system processes from being visible, and allows
    process ids to be reused including PID 1. If the host's PID namespace is shared with containers, it would basically allow
    these to see all of the processes on the host system. This reduces the benefit of process level isolation between the
    host and the containers. Under these circumstances a malicious user who has access to a container could get access to
    processes on the host itself, manipulate them, and even be able to kill them. This could allow for the host itself being
    shut down, which could be extremely serious, particularly in a multi-tenanted environment. You should not share the host's
    process namespace with the containers running on it.
  impact: 'Container processes cannot see processes on the host system. In certain circumstances, you may want your container
    to share the host''s process namespace. For example, you could build a container containing debugging tools such as strace
    or gdb, and want to use these tools when debugging processes on the host. If this is desired, then share specific host
    processes using the -p switch. For example: docker run --pid=host rhel7 strace -p 1234'
  references:
  - 1. https://docs.docker.com/engine/reference/run/#pid-settings---pid
  - 2. https://man7.org/linux/man-pages/man7/pid_namespaces.7.html
  page_start: 192
  audit_raw: 'You should run the following command:

    docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:

    PidMode={{ .HostConfig.PidMode }}''

    192 | P a g e

    If the command above returns host, it means that the host PID namespace is shared with

    its containers; any other result means that the system is configured in line with good

    security practice.'
  remediation: 'You should not start a container with the --pid=host argument.

    For example, do not start a container with the command below:

    docker run --interactive --tty --pid=host centos /bin/bash'
  checks:
  - type: command
    command: 'docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:'
    expected: ''
    severity: medium
    info: 'You should run the following command:

      docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:

      PidMode={{ .HostConfig.PidMode }}''

      192 | P a g e

      If the command above returns host, it means that the host PID namespace is shared with

      its containers; any other result means that the system is configured in line with good

      security practice.'
- id: '5.16'
  title: Ensure that the host's IPC namespace is not shared
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: IPC (POSIX/SysV IPC) namespace provides separation of named shared memory segments, semaphores and message
    queues. The IPC namespace on the host should therefore not be shared with containers and should remain isolated.
  rationale: The IPC namespace provides separation of IPC between the host and containers. If the host's IPC namespace is
    shared with the container, it would allow processes within the container to see all of IPC communications on the host
    system. This would remove the benefit of IPC level isolation between host and containers. An attacker with access to a
    container could get access to the host at this level with major consequences. The IPC namespace should therefore not be
    shared between the host and its containers.
  impact: 'Shared memory segments are used in order to accelerate interprocess communications, commonly in high-performance
    applications. If this type of application is containerized into multiple containers, you might need to share the IPC namespace
    of the containers in order to achieve high performance. Under these circumstances, you should still only share container
    specific IPC namespaces and not the host IPC namespace. A container''s IPC namespace can be shared with another container
    as shown below: docker run --interactive --tty --ipc=container:e3a7a1a97c58 centos /bin/bash'
  references:
  - 1. https://docs.docker.com/engine/reference/run/#ipc-settings---ipc
  - 2. https://www.man7.org/linux/man-pages/man7/ipc_namespaces.7.html
