- id: '2.16'
  title: Ensure Userland Proxy is Disabled
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The Docker daemon starts a userland proxy service for port forwarding whenever a port is exposed. Where hairpin
    NAT is available, this service is generally superfluous to requirements and can be disabled.
  rationale: The Docker engine provides two mechanisms for forwarding ports from the host to containers, hairpin NAT, and
    the use of a userland proxy. In most circumstances, the hairpin NAT mode is preferred as it improves performance and makes
    use of native Linux iptables functionality instead of using an additional component. Where hairpin NAT is available, the
    userland proxy should be disabled on startup to reduce the attack surface of the installation.
  impact: Some systems with older Linux kernels may not be able to support hairpin NAT and therefore require the userland
    proxy service. Also, some networking setups can be impacted by the removal of the userland proxy.
  references:
  - 1. http://windsock.io/the-docker-proxy/
