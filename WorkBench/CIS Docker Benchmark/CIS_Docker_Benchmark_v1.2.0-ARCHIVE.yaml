- id: 8.1.6
  title: Set the Per-User Session Limit to a value of '3' or lower
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The "Per User Limit" Login Session Control which is configured in the UCP "Admin Settings" | "Authentication
    & Authorization" section specifies the maximum number of sessions that any user can have active at any given time. If
    creating a new session would put a user over this limit then the least recently used session will be deleted. Set this
    limit to a lower value but greater than '0' to prevent users from initiating an unecessarily high number of concurrent
    sessions. This limit applies to users that are authenticated to UCP and/or DTR as the built-in authentication and authorization
    backplane in UCP serves both UCP and DTR.
  rationale: By default, UCP sets the "Per User Limit" value to '10' which may be too high for the number of concurrent sessions
    that users are allotted. Users who are able to maintain a large number of concurrent sessions could be subject to phishing
    attacks or similar that result in unauthorized sessions with a UCP and/or DTR cluster. Furthermore, setting a value of
    '0' disables limiting the number of sessions that users may have, and this is not in line with good security practice.
  impact: None.
