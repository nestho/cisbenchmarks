- id: '7.6'
  title: Ensure that swarm manager is run in auto-lock mode
  scoring: scored
  profile:
  - Level 2 - Docker - Linux
  description: You should review whether you wish to run Docker swarm manager in auto-lock mode.
  rationale: When Docker restarts, both the TLS key used to encrypt communication among swarm nodes, and the key used to encrypt
    and decrypt Raft logs on disk, are loaded into each manager node's memory. You could protect the mutual TLS encryption
    key and the key used to encrypt and decrypt Raft logs at rest. This protection could be enabled by initializing the swarm
    with the --autolock flag. With --autolockenabled, when Docker restarts, you must unlock the swarm first, using a key encryption
    key generated by Docker when the swarm was initialized. This has benefits in a high security environment, however these
    should be balanced against the support issues caused by the swarm not starting automatically if, for example the host
    were to experience an outage.
  impact: A swarm in auto-lock mode will not recover from a restart without manual intervention from an administrator to enter
    the unlock key. This may not always be desirable, and should be reviewed at a policy level.
