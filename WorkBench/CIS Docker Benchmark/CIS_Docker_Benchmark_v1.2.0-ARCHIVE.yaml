- id: '5.3'
  title: Ensure that Linux kernel capabilities are restricted within containers
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, Docker starts containers with a restricted set of Linux kernel capabilities. This means that any
    process can be granted the required capabilities instead of giving it root access. Using Linux kernel capabilities, processes
    in general do not need to run as the root user.
  rationale: Docker supports the addition and removal of capabilities. You should remove all capabilities not required for
    the correct function of the container. Specifically, in the default capability set provided by Docker, the NET_RAW capability
    should be removed if not explicitly required, as it can give an attacker with access to a container the ability to create
    spoofed network traffic.
  impact: Restrictions on processes within a container are based on which Linux capabilities are in force. Removal of the
    NET_RAW capability prevents the container from creating raw sockets which is good security practice under most circumstances,
    but may affect some networking utilities.
  references:
  - 1. https://docs.docker.com/engine/security/security/#linux-kernel-capabilities
  - 2. http://man7.org/linux/man-pages/man7/capabilities.7.html
  page_start: 147
  audit_raw: 'You should run the following command:

    docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}: CapAdd={{

    .HostConfig.CapAdd }} CapDrop={{ .HostConfig.CapDrop }}''

    Verify that the added and deleted Linux kernel capabilities are in line with the ones needed

    by the container process in each container instance. Specifically, ensure that the NET_RAW

    capability is removed if not required.'
  remediation: 'You should execute the command below to add required capabilities:

    docker run --cap-add={"Capability 1","Capability 2"} <Run arguments>

    <Container Image Name or ID> <Command>

    You should execute the command below to remove unneeded capabilities:

    docker run --cap-drop={"Capability 1","Capability 2"} <Run arguments>

    <Container Image Name or ID> <Command>

    147 | P a g e

    Alternatively, you could remove all the currently configured capabilities and then restore

    only the ones you specifically use:

    docker run --cap-drop=all --cap-add={"Capability 1","Capability 2"} <Run

    arguments> <Container Image Name or ID> <Command>'
