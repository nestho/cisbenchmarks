- id: '4.6'
  title: Ensure that HEALTHCHECK instructions have been added to container images
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: You should add the HEALTHCHECK instruction to your Docker container images in order to ensure that health checks
    are executed against running containers. You should not use OS package manager update instructions such as apt-get update
    or yum update either alone or in a single line in the Dockerfile.
  rationale: An important security control is that of availability. Adding the HEALTHCHECK instruction to your container image
    ensures that the Docker engine periodically checks the running container instances against that instruction to ensure
    that containers are still operational. Based on the results of the health check, the Docker engine could terminate containers
    which are not responding correctly, and instantiate new ones. Adding update instructions in a single line on the Dockerfile
    will cause the update layer to be cached. When you then build any image later using the same instruction, this will cause
    the previously cached update layer to be used, potentially preventing any fresh updates from being applied to later builds.
