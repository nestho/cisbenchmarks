    to noninvestigation of the root cause behind containers getting terminated. If a container gets terminated, you should
    investigate on the reason behind it instead of just attempting to restart it indefinitely. You should use the on-failure
    restart policy to limit the number of container restarts to a maximum of 5 attempts.
