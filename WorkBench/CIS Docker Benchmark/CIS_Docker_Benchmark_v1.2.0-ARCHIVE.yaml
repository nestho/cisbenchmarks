- id: 8.2.1
  title: Enable image vulnerability scanning
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: It is important to ensure that your Docker images are free from vulnerabilities. The Docker Trusted Registry
    (DTR) includes image vulnerability scanning which can check any packages included in your image against known vulnerability
    databases. This capability should be enabled to satisfy this recommendation.
  rationale: Running Docker containers based on images with known vulnerabilities exposes your organization to a greater level
    of risk. The vulnerability scanning service included with DTR can check the signature of any packages included in your
    image's layers against both the MITRE Common Vulnerabilities and Exposures (CVE) database and NIST National Vulnerability
    Database (NVD). Docker Inc. maintains a security scanning database which is an aggregation of the MITRE CVE and NIST NVD
    data that can be read by DTR. DTR's vulnerability scanning capabilty can operate in online mode, where it connects directly
    to Docker's database at https://dss-cve-updates.docker.com/. It can also operate in offline mode, where the user must
    download a .tar file that contains the aggregated database that DTR can read. Docker Inc. updates this database on a daily
    basis.
  impact: None.
