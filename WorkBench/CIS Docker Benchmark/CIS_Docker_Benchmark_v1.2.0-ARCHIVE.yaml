- id: 1.2.6
  title: Ensure auditing is configured for Docker files and directories - docker.service
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Audit the docker.service if applicable.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files
    and directories. The Docker daemon runs with root privileges and its behavior depends on some key files and directories
    with docker.service being one such file. The docker.service file might be present if the daemon parameters have been changed
    by an administrator. If so, it holds various parameters for the Docker daemon and should be audited.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition.
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security_Guide/chap-system_auditing.html
  page_start: 29
  audit_raw: 'Step 1: Find out the file location:

    systemctl show -p FragmentPath docker.service

    Step 2: If the file does not exist, this recommendation does not apply. If the file does exist,

    verify that there is an audit rule corresponding to the file:

    For example, you could execute the command below:

    auditctl -l | grep docker.service

    This should display a rule for docker.service.'
  remediation: 'If the file exists, a rule for it should be added.

    For example:

    Add the line as below in /etc/audit/audit.rules file:

    -w /usr/lib/systemd/system/docker.service -k docker

    Then restart the audit daemon.

    For example:

    29 | P a g e

    service auditd restart'
  checks:
