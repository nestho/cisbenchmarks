- id: '5.10'
  title: Ensure that the memory usage for containers is limited
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, all containers on a Docker host share resources equally. By using the resource management capabilities
    of the Docker host, you can control the amount of memory that a container is able to use.
  rationale: By default a container can use all of the memory on the host. You can use memory limit mechanisms to prevent
    a denial of service occurring where one container consumes all of the host’s resources and other containers on the same
    host are therefore not able to function. Having no limit on memory usage can lead to issues where one container can easily
    make the whole system unstable and as a result unusable.
  impact: If correct memory limits are not set on each container, one process can expand its usage and cause other containers
    to run out of resources.
  references:
  - 1. https://goldmann.pl/blog/2014/09/11/resource-management-in-docker/
  - 2. https://docs.docker.com/engine/reference/commandline/run/#options
  page_start: 162
