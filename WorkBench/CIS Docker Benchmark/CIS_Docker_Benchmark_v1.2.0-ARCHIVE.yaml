- id: 8.1.3
  title: Enforce the use of client certificate bundles for unprivileged users
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  - Level 1 - Docker Engine - Enterprise
  description: While you can communicate with a UCP cluster by connecting as a user with administrative permissions directly
    to one of the UCP Manager nodes, we recommend that unprivileged users should instead be provided with client certificate
    bundles so that their access rights are controlled via the built-in role-based access control (RBAC) model. The Universal
    Control Plane provides robust role-based access control (RBAC) capabilities that can be used to further harden a deployment.
    Building off of the default set of RBAC components which includes subjects, roles, resource collections, and grants, an
    appropriate RBAC model should be developed that aligns with your organization's IT Security policies. This involves creating
    custom roles and collections.
  rationale: 'UCP cluster administrators can leverage the built-in RBAC capabilities within Docker and provide client certificate
    bundles to unprivileged users rather than allowing them to connect directly to the Manager and/or Worker nodes in the
    cluster. This prevents unprivileged users from being able to directly access or manipulate cluster resources. With the
    use of UCP client certificate bundles you do not need to include standard users in the "docker" security group and instead
    you can facilitate user access to the cluster via RBAC. The RBAC functionality provided by UCP includes a set of defaults
    that should be customized to satisfy your organization''s security requirements. The following roles are included by default:
    None, View Only, Restricted Control, Scheduler, and Full Control. While by default, these roles are applicable to a number
    of simple management and application deployment scenarios, they are too broad in regards to the permissions allocated
    by each. As such, custom roles should be created to extend these defaults.'
  impact: None. None
  references:
  - 1. https://docs.docker.com/ee/ucp/user-access/cli/
  - 2. https://success.docker.com/article/Docker_Reference_Architecture_Securing_Docker_EE_and_Security_Best_Practices#ucpsecurity
  - 1. https://docs.docker.com/datacenter/ucp/2.2/guides/access-control/
