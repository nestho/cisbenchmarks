- id: '5.7'
  title: Ensure privileged ports are not mapped within containers
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The TCP/IP port numbers below 1024are considered privileged ports. Normal users and processes are not allowed
    to use them for various security reasons. Docker does, however allow a container port to be mapped to a privileged port.
    The dockerfile for a container image defines the ports which are opened by default on a container instance. The list of
    ports are relevant to the application you are running within the container and should only be open if they are needed.
  rationale: By default, if the user does not specifically declare a container port to host port mapping, Docker automatically
    and correctly maps the container port to one available in the 4915365535 range on the host. Docker does, however, allow
    a container port to be mapped to a privileged port on the host if the user explicitly declares it. This is because containers
    are executed with NET_BIND_SERVICE Linux kernel capability which does not restrict privileged port mapping. The privileged
    ports receive and transmit various pieces of data which are security sensitive and allowing containers to use them is
    not in line with good security practice. A container can be run with only the ports defined in the Dockerfile for its
    image or can alternatively be arbitrarily passed run time parameters to open a list of ports. Additionally, in the course
    of time, the Dockerfile may undergo various changes and the list of exposed ports may or may not still be relevant to
    the application you are running within the container. Opening unneeded ports increases the attack surface of the container
    and the associated containerized application. Good security practice is to only open ports that are needed for the correct
    operation of the application.
  impact: None. 156 | P a g e None.
  references:
  - 1. https://docs.docker.com/engine/userguide/networking/
  - 1. https://docs.docker.com/engine/userguide/networking/
