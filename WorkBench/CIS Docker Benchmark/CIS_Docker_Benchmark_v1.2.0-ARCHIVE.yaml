  description: AppArmor is an effective and easy-to-use Linux application security system. It is available on some Linux distributions
    by default, for example, on Debian and Ubuntu.
  rationale: AppArmor protects the Linux OS and applications from various threats by enforcing a security policy which is
    also known as an AppArmor profile. You can create your own AppArmor profile for containers or use Docker's default profile.
    Enabling this feature enforces security policies on containers as defined in the profile.
  impact: The container will have the security controls defined in the AppArmor profile. It should be noted that if the AppArmor
