  title: Ensure that the container is restricted from acquiring additional privileges
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: You should restrict the container from acquiring additional privileges via suid or sgid bits.
  rationale: A process can set the no_new_priv bit in the kernel and this persists across forks, clones and execve. The no_new_priv
    bit ensures that the process and its child processes do not gain any additional privileges via suid or sgid bits. This
    reduces the danger associated with many operations because the possibility of subverting privileged binaries is lessened.
  impact: The no_new_priv option prevents LSMs like SELinux from allowing processes to acquire new privileges
  references:
