- id: '5.9'
  title: Ensure that the host's network namespace is not shared
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: When the networking mode on a container is set to --net=host, the container is not placed inside a separate
    network stack. Effectively, applying this option instructs Docker to not containerize the container's networking. The
    consequence of this is that the container lives "outside" in the main Docker host and has full access to its network interfaces.
