controls:
- id: 1.1.1
  title: Ensure the container host has been Hardened
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: A container host is able to run one or more containers. It is of utmost importance to harden the host to mitigate
    host security misconfiguration.
  rationale: You should follow infrastructure security best practices and harden your host OS. Keeping the host system hardened
    will ensure that host vulnerabilities are mitigated. Not hardening the host system could lead to security exposures and
    breaches.
  impact: None.
  references:
  - 1. https://docs.docker.com/engine/security/security/
  - 2. https://learn.cisecurity.org/benchmarks
  page_start: 15
  audit_raw: 'Ensure that the host specific security guidelines are followed. Ask the system

    administrators which security benchmark the current host system should currently be

    compliant with and check that security standards associated with this standard are

    currently in place.'
  remediation: 'You may consider various CIS Security Benchmarks for your container host. If you have

    other security guidelines or regulatory requirements to adhere to, please follow them as

    suitable in your environment.'
  checks:
  - type: manual_review
    info: 'Ensure that the host specific security guidelines are followed. Ask the system

      administrators which security benchmark the current host system should currently be

      compliant with and check that security standards associated with this standard are

      currently in place.'
    severity: medium
- id: 1.1.2
  title: Ensure that the version of Docker is up to date
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Frequent releases for Docker are issued which address security vulnerabilities, resolve product bugs and bring
    in new functionality. You should keep a tab on these product updates and upgrade as frequently as possible in line with
    the general IT security policy of your organization.
  rationale: By staying up to date on Docker updates, vulnerabilities in the software can be mitigated. An experienced attacker
    may be able to exploit known vulnerabilities resulting in them being able to attain inappropriate access or to elevate
    their privileges. If you do not ensure that Docker is running at the most current release consistent with the requirements
    of of your application, you may introduce unwanted behaviour and it is therefore important to ensure that you monitor
    software versions and upgrade in a timely fashion.
  impact: You should perform a risk assessment regarding Docker version updates and review how they may impact your operations.
    You should be aware that third-party products that use Docker may require older major versions of Docker to be supported,
    and this should be reviewed in line with the general IT security policy of your organization, particularly where security
    vulnerabilities in older versions have been publicly disclosed. 17 | P a g e
  references:
  - 1. https://docs.docker.com/engine/installation/
  - 2. https://github.com/moby/moby/releases/latest
  page_start: 17
  audit_raw: 'You should execute the command below in order to verify that the Docker version is up to

    date in line with the requirements of the application you are running. It should be noted

    that it is not a security requirement to be at the most up to date version, provided the

    version you are using does not contain any critical or high security vulnerabilities.

    docker version'
  remediation: 'You should monitor versions of Docker releases and make sure your software is updated as

    required.'
  checks:
  - type: command
    command: docker version
    expected: You should execute the command below in order to verify that the Docker version is up to
    severity: medium
    info: 'You should execute the command below in order to verify that the Docker version is up to

      date in line with the requirements of the application you are running. It should be noted

      that it is not a security requirement to be at the most up to date version, provided the

      version you are using does not contain any critical or high security vulnerabilities.

      docker version'
- id: 1.2.1
  title: Ensure a separate partition for containers has been created
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: All Docker containers and their data and metadata is stored under /var/lib/docker directory. By default, /var/lib/docker
    should be mounted under either the / or /var partitions dependent on how the Linux operating system in use is configured.
  rationale: Docker depends on /var/lib/docker as the default directory where all Docker related files, including the images,
    are stored. This directory could fill up quickly causing both Docker and the host to become unusable. For this reason,
    you should create a separate partition (logical volume) for storing Docker files.
  impact: None.
  references:
  - 1. https://www.projectatomic.io/docs/docker-storage-recommendation/
  page_start: 19
  audit_raw: 'At the Docker host execute one of the below commands:

    grep ''/var/lib/docker\s'' /proc/mounts

    This should return the partition details for the /var/lib/docker mountpoint.

    mountpoint -- "$(docker info -f ''{{ .DockerRootDir }}'')"

    This should return whether the configured root directory is a mount point.'
  remediation: 'For new installations, you should create a separate partition for the /var/lib/docker

    mount point. For systems which have already been installed, you should use the Logical

    Volume Manager (LVM) within Linux to create a new partition.

    19 | P a g e'
  checks:
  - type: command
    command: grep '/var/lib/docker\s' /proc/mounts
    expected: This should return the partition details for the /var/lib/docker mountpoint.
    severity: medium
    info: 'At the Docker host execute one of the below commands:

      grep ''/var/lib/docker\s'' /proc/mounts

      This should return the partition details for the /var/lib/docker mountpoint.

      mountpoint -- "$(docker info -f ''{{ .DockerRootDir }}'')"

      This should return whether the configured root directory is a mount point.'
- id: 1.2.2
  title: Ensure only trusted users are allowed to control Docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: The Docker daemon currently requires access to the Docker socket which is, by default, owned by the user root
    and the group docker.
  rationale: Docker allows you to share a directory between the Docker host and a guest container without limiting the access
    rights of the container. This means that you can start a container and map the / directory on your host to the container.
    The container would then be able to modify your host file system without any restrictions. This means that you could gain
    elevated privileges simply by being a member of the docker group and subsequently start a container which maps the root
    / directory on the host.
  impact: Provided the proceeding instructions are implemented, rights to build and execute containers as normal user would
    be restricted.
  references:
  - 1. https://docs.docker.com/engine/security/security/#docker-daemon-attacksurface
  - 2. https://www.andreas-jung.com/contents/on-docker-security-docker-groupconsidered-harmful
  page_start: 21
  audit_raw: 'Execute the following command on the docker host and ensure that only trusted users are

    members of the docker group.

    getent group docker'
  remediation: 'You should remove any untrusted users from the docker group. Additionally, you should

    not create a mapping of sensitive directories from the host to container volumes.'
  checks:
  - type: manual_review
    info: 'Execute the following command on the docker host and ensure that only trusted users are

      members of the docker group.

      getent group docker'
    severity: medium
- id: 1.2.3
  title: Ensure auditing is configured for the Docker daemon
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  description: Audit all Docker daemon activities.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit the Docker daemon. Because
    this daemon runs with root privileges. It is very important to audit its activities and usage.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition. 23 | P a g e
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security_Guide/chap-system_auditing.html
  page_start: 23
  audit_raw: 'Verify that there are audit rules for the Docker daemon. For example, you could execute the

    following command:

    auditctl -l | grep /usr/bin/dockerd

    This should show the rules associated with the Docker daemon.'
  remediation: 'You should add rules for the Docker daemon.

    For example:

    Add the line below to the /etc/audit/audit.rules file:

    -w /usr/bin/dockerd -k docker

    Then, restart the audit daemon using the following command

    service auditd restart'
  checks:
  - type: command
    command: auditctl -l | grep /usr/bin/dockerd
    expected: Verify that there are audit rules for the Docker daemon. For example, you could execute the
    severity: medium
    info: 'Verify that there are audit rules for the Docker daemon. For example, you could execute the

      following command:

      auditctl -l | grep /usr/bin/dockerd

      This should show the rules associated with the Docker daemon.'
- id: 1.2.4
  title: Ensure auditing is configured for Docker files and directories - /var/lib/docker
  scoring: scored
  profile:
  - Level 2 - Linux Host OS
  description: Audit /var/lib/docker.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files
    and directories. The Docker daemon runs with root privileges and its behaviour depends on some key files and directories.
    /var/lib/docker is one such directory. As it holds all the information about containers it should be audited.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition.
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security_Guide/chap-system_auditing.html
  page_start: 25
  audit_raw: 'You should verify that there is an audit rule applied to the /var/lib/docker directory.

    For example, you could execute the command below:

    auditctl -l | grep /var/lib/docker

    This should list a rule for the /var/lib/docker directory.'
  remediation: 'You should add a rule for the /var/lib/docker directory.

    For example,

    Add the line as below to the /etc/audit/audit.rules file:

    -w /var/lib/docker -k docker

    Then restart the audit daemon.

    For example,

    service auditd restart

    25 | P a g e'
  checks:
  - type: command
    command: auditctl -l | grep /var/lib/docker
    expected: You should verify that there is an audit rule applied to the /var/lib/docker directory.
    severity: medium
    info: 'You should verify that there is an audit rule applied to the /var/lib/docker directory.

      For example, you could execute the command below:

      auditctl -l | grep /var/lib/docker

      This should list a rule for the /var/lib/docker directory.'
