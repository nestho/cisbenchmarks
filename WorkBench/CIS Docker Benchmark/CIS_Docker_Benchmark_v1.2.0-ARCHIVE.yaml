- id: '2.1'
  title: Ensure network traffic is restricted between containers on the default bridge
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, all network traffic is allowed between containers on the same host on the default network bridge.
    If not desired, restrict all inter-container communication. Link specific containers together that require communication.
    Alternatively, you can create custom network and only join containers that need to communicate to that custom network.
