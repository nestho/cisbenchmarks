- id: '5.11'
  title: Ensure that CPU priority is set appropriately on containers
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: By default, all containers on a Docker host share resources equally. By using the resource management capabilities
    of the Docker host you can control the host CPU resources that a container may consume.
  rationale: By default, CPU time is divided between containers equally. If you wish to control available CPU resources amongst
    container instances, you can use the CPU sharing feature. CPU sharing allows you to prioritize one container over others
    and prevents lower priority containers from absorbing CPU resources which may be required by other processes. This ensures
    that high priority containers are able to claim the CPU runtime they require.
  impact: If you do not correctly assign CPU thresholds, the container process may run out of resources and become unresponsive.
    If CPU resources on the host are not constrainted, CPU shares do not place any restrictions on individual resources.
  references:
  - 1. https://goldmann.pl/blog/2014/09/11/resource-management-in-docker/
  - 2. https://docs.docker.com/engine/reference/commandline/run/#options
  page_start: 164
  audit_raw: 'You should run the following command.

    docker ps --quiet --all | xargs docker inspect --format ''{{ .Id }}:

    CpuShares={{ .HostConfig.CpuShares }}''

    If the above command returns 0 or 1024, it means that CPU shares are not in place. If it

    returns a non-zero value other than 1024, it means that they are in place.'
  remediation: 'You should manage the CPU runtime between your containers dependent on their priority

    within your organization. To do so start the container using the --cpu-shares argument.

    For example, you could run a container as below:

    docker run --interactive --tty --cpu-shares 512 centos /bin/bash

    In the example above, the container is started with CPU shares of 50% of what other

    containers use. So if the other container has CPU shares of 80%, this container will have

    CPU shares of 40%.

    Every new container will have 1024 shares of CPU by default. However, this value is shown

    as 0 if you run the command mentioned in the audit section.

    Alternatively:

    164 | P a g e

    1. Navigate to the /sys/fs/cgroup/cpu/system.slice/ directory.

    2. Check your container instance ID using docker ps.

    3. Inside the above directory (in step 1), you could have a directory called, for

    example: docker-<Instance ID>.scope. For example, docker4acae729e8659c6be696ee35b2237cc1fe4edd2672e9186434c5116e1a6fbed6.scope.

    Navigate to this directory.

    4. You will find a file named cpu.shares. Execute cat cpu.shares. This will always

    give you the CPU share value based on the system. Even if there are no CPU shares

    configured using the -c or --cpu-shares argument in the docker run command,

    this file will have a value of 1024.

    If you set one container’s CPU shares to 512 it will receive half of the CPU time compared to

    the other containers. So if you take 1024 as 100% you can then derive the number that you

    should set for respective CPU shares. For example, use 512 if you want to set it to 50% and

    256 if you want to set it 25%.'
