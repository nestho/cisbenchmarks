  description: It is possible to attach to a particular cgroup when a container is instantiated. Confirming cgroup usage would
    ensure that containers are running in defined cgroups.
  rationale: System administrators typically define cgroups in which containers are supposed to run. If cgroups are not explicitly
    defined by the system administrator, containers run in the docker cgroup by default. At run time, it is possible to attach
    a container to a different cgroup other than the one originally defined. This usage should be monitored and confirmed,
    as by attaching to a different cgroup, excess permissions and resources might be granted to the container and this can
