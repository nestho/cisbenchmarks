- id: 8.1.7
  title: Set the "Lifetime Minutes" and "Renewal Threshold Minutes" values to '15' or lower and '0' respectively
  scoring: scored
  profile:
  - Level 1 - Docker - Linux
  description: The "Lifetime Minutes" Login Session Control which is configured in the UCP "Admin Settings" | "Authentication
    & Authorization" section specifies the initial lifetime (in minutes) of a session from the moment it is generated. This
    should be set to a value of '15' or lower so as to restrict a Docker Enterprise user's session length to 15 minutes or
    less. The "Renewal Threshold Minutes" Login Session Control which is also configured in the UCP "Admin Settings" | "Authentication
    & Authorization" section indicates the period of time (in minutes) before the expiration of a session where, if set, a
    session will be extended by the current configured lifetime from then. This value cannot be greater than the configured
    lifetime. A value equal to the lifetime means that sessions will be extended with every use. A value of zero indicates
    that sessions should never be extended, but this may result in unexpectedly being logged out if the session expires while
    performing a series of actions in the UI. This value should be set to '0' to prevent a user's session from being extended
    for any period of time.
  rationale: By default, the values of "Lifetime Minutes" and "Renewal Threshold Minutes" are set to '60' and '20' respectively.
    These values are too high for some organizations and could result in users maintaining active sessions to a Docker Enterprise
    cluster for a longer period of time than is desired. This makes users prone to session compromise if they are away from
    their workstations for an extended period of time.
  impact: Setting the "Lifetime Minutes" setting to a value that is too lower would result in users having to constantly re-authenticate
    to their Docker Enterprise cluster. 245 | P a g e
