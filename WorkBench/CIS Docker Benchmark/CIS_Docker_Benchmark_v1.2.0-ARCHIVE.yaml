  description: Using the --privileged flag provides all Linux kernel capabilities to the container to which it is applied
    and therefore overwrites the --cap-add and --cap-drop flags. For this reason you should ensure that it is not used.
  rationale: The --privileged flag provides all capabilities to the container to which it is applied, and also lifts all the
    limitations enforced by the device cgroup controller. As a consequence this the container has most of the rights of the
    underlying host. This flag only exists to allow for specific use cases (for example running Docker within Docker) and
    should not generally be used.
  impact: If you start a container without the --privileged flag, it will not have excessive default capabilities.
  references:
  - 1. https://docs.docker.com/engine/reference/run/#runtime-privilege-and-linuxcapabilities
