controls:
- id: 1.1.1.1.1
  title: Ensure minimum passcode length is set to at least 6 characters
  scoring: manual
  profile:
  - Level 1
  description: For security purposes, Zoom has a few requirements that your passcode must meet. Minimum passcode length must
    be at least 6 characters.
  rationale: This ensures the passcode complexity requirements are met and a strong passcode is set for meetings.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Security -> Passcode Requirement -> Have a minimum passcode length, and

    check if it is set to enabled.'
  remediation: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Security -> Passcode Requirement -> Have a minimum passcode length, and

    ensure it is set to enabled.'
  checks:
  - type: manual_review
    info: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

      Settings -> Security -> Passcode Requirement -> Have a minimum passcode length, and

      check if it is set to enabled.'
    severity: medium
