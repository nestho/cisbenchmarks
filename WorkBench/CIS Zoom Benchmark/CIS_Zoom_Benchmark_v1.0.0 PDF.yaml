- id: 1.1.1.6
  title: Ensure require a password for instant meetings is set to enabled
  scoring: manual
  profile:
  - Level 1
  description: A random passcode will be generated when starting an instant meeting.
  rationale: Enabling this setting shall increase security for meetings that are created instantly. A participant requires
    the passcode to be entered for joining.
  impact: This setting may not be helpful in a scenario, where participants need to join a meeting that was created instantly
    and does not want to input a passcode to join.
  references:
  - 1. https://support.zoom.us/hc/en-us/articles/115005756143
  page_start: 30
  audit_raw: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Security -> Require a passcode for instant meetings, and check if it is set to

    enabled.'
