- id: 1.1.2.4
  title: Ensure join before host is set to disabled
  scoring: scored
  profile:
  - Level 1
  description: Allow participants to join the meeting before the host arrives should be set to disabled and locked off.
  rationale: This ensures people joining a meeting do not enter a meeting before the host has arrived. If there are annoying
    users, they cannot be removed or muted until the host arrives. Locking the setting ensures no one changes this when creating
    a meeting.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

