- id: 1.1.1.2
  title: Ensure waiting room is set to enabled
  scoring: manual
  profile:
  - Level 2
  - Level 1
  description: When participants join a meeting, place them in a waiting room and require the host to admit them individually.
    Enabling the waiting room automatically disables the setting for allowing participants to join before host.
  rationale: This option ensures that the participants are by default entered into meeting.
  impact: When hundreds of participants are joining, the Co-Hosts has to admit all participants and may take time.
  references: []
  page_start: 26
  audit_raw: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Meeting -> Waiting Room and check if it is set to enabled.'
  remediation: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Meeting -> Waiting Room and ensure it is set to enabled.'
  checks:
  - type: manual_review
    info: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

      Settings -> Meeting -> Waiting Room and check if it is set to enabled.'
    severity: medium
- id: 1.1.1.3
  title: Ensure waiting room options is set to everyone
  scoring: manual
  profile:
  - Level 1
  description: Click on "Edit Options" to choose who should go in the waiting room? A) Everyone, B) Users not in your account,
    C) Users who are not in your account and not part of the allowed domains
  rationale: This shall increase the security by choosing which participants should go into waiting room when joining a meeting.
  impact: ''
  references:
  - 1. https://support.zoom.us/hc/en-us/articles/115000332726-Waiting-Room
  page_start: 27
  audit_raw: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Meeting -> Security -> Waiting Room Option and click on “Edit Options” to see

    which option is selected.'
  remediation: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

    Settings -> Meeting -> Security -> Waiting Room Option and click on “Edit Options” to and

    ensure “Everyone” option is selected.'
  checks:
  - type: manual_review
    info: 'Go into the Zoom Admin Dashboard on the zoom website. Account Management -> Account

      Settings -> Meeting -> Security -> Waiting Room Option and click on “Edit Options” to see

      which option is selected.'
    severity: medium
