controls:
- id: 1.1.1
  title: (L2) Ensure 'ChatMCP' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'This policy setting controls integration with Model Context Protocol (MCP) servers. The recommended state
    for this setting is: Disabled.'
  rationale: Integration with third-party MCP servers may result in unintended disclosure of information to the party running
    the server.
  impact: Users will not be able to use MCP server integrations.
  references:
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_centrally-manage-vs-codesettings
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:ChatMCP'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Chat\ChatMCP

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:ChatMCP'
    severity: medium
- id: 1.1.2
  title: (L1) Ensure 'ChatToolsAutoApprove' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls auto-approval for agent mode chat tools. The recommended state for this setting
    is: Disabled.'
  rationale: Automatic activation of agent mode tools may result in inadvertent disclosure of sensitive data to third-party
    servers backing the chat tool or unexpected modification to project files.
  impact: Users will need to manually approve agent mode before it can be used.
  references:
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_centrally-manage-vs-codesettings
  page_start: 19
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:ChatToolsAutoApprove'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Chat\ChatToolsAutoApprove

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:ChatToolsAutoApprove'
    severity: medium
- id: 1.2.1
  title: (L2) Ensure 'AllowedExtensions' is configured
  scoring: manual
  profile:
  - Level 2
  description: 'This policy setting configures a list of extension selectors that determine which extensions are allowed or
    blocked. The recommended state for this setting is: Enabled with a list of allowed extensions.'
  rationale: Allowing users to install any extension may result in unintended information disclosure to third parties, or
    the installation of malware.
  impact: IT administrators will need to maintain the list of allow-listed extensions. Depending on individual end-user needs,
    it may not be practical to allow specific extensions. Allowing by publisher may be more practical.
  references:
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_configure-allowedextensions
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_SZ value containing a JSON string.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:AllowedExtensions'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled along with a JSON string defining the approved extensions:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Extensions\AllowedExtensions

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_SZ value containing a JSON string.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:AllowedExtensions'
    severity: medium
- id: 1.3.1
  title: (L2) Ensure 'EnableFeedback' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'This policy setting controls feedback mechanisms, such as the issue reporter and surveys. The recommended
    state for this setting is: Disabled.'
  rationale: The VS Code issue reporter can be configured to submit context such as basic system configuration and application
    settings. This may inadvertently disclose information that some organizations consider confidential.
  impact: Users will not be able to use in-application feedback tools.
  references:
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_centrally-manage-vs-codesettings
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:EnableFeedback'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Telemetry\EnableFeedback

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:EnableFeedback'
    severity: medium
- id: 1.3.2
  title: '(L1) Ensure ''TelemetryLevel'' is set to ''Enabled: off'''
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls telemetry for VS Code and extensions. The recommended state for this setting
    is: Enabled: off. This policy setting controls whether VS Code automatically updates when a new version is released. The
    recommended state for this setting is: Enabled: Enable Automatic Update Checks. Code will check for updates automatically
    and periodically.'
  rationale: Enabling this feature sends data to Microsoft and potentially third-party extension developers, which could lead
    to sensitive data being exposed. Software needs to be patched regularly to address vulnerabilities.
  impact: Data will not be shared with Microsoft or extension developers. None; this is the default behavior.
  references:
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_configure-telemetry-level
  - 1. https://code.visualstudio.com/docs/setup/enterprise#_configure-automaticupdates
  page_start: 27
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_SZ value of off.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:TelemetryLevel

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_SZ value of default.

    HKLM\SOFTWARE\Policies\Microsoft\VSCode:UpdateMode'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: off:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Telemetry\TelemetryLevel

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.

    To establish the recommended configuration via GP, set the following UI path to

    Enabled: Enable Automatic Update Checks. Code will check for updates

    automatically and periodically.:

    Computer Configuration\Policies\Administrative Templates\Visual Studio

    Code\Update\UpdateMode

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template VScode.admx, which is available in the VS Code installation directory under

    the policies folder.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_SZ value of off.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:TelemetryLevel

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_SZ value of default.

      HKLM\SOFTWARE\Policies\Microsoft\VSCode:Upd'
    severity: medium
