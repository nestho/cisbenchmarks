  scoring: scored
  profile:
  - Level 1
  description: Restrict the User-ID service account’s ability to gain remote access into the organization. This capability
    could be made available through a variety of technologies, such as VPN, Citrix GoToMyPC, or TeamViewer. Remote services
    that integrate authentication with the organization’s Active Directory may unintentionally allow the User-ID service account
    to gain remote access.
  rationale: In the event of a compromised User-ID service account, restricting the account’s ability to remotely access resources
    within the organization’s internal network reduces the impact of a service account compromise.
