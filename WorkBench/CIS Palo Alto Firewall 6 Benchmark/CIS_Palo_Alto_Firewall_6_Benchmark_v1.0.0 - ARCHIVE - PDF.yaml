    \ letters in the password\n+ minimum-special-characters Minimum special characters(non-alphanumeric) in\nthe password\n\
    + minimum-uppercase-letters Minimum uppercase letters in the password\nARCHIVE\n29 | P a g e\n+ new-password-differs-by-characters\
