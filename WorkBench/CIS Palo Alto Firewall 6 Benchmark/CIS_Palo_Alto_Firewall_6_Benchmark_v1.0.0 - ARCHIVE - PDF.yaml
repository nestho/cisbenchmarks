    are configured:

    username@hostname>show deviceconfig system ntp-servers'
  remediation: "Navigate to Device > Setup > Services > Services.\nSet Primary NTP Server Address appropriately.\nARCHIVE\n\
    53 | P a g e\nSet Secondary NTP Server Address appropriately.\nor\nTo remediate these settings, execute the following\
    \ CLI commands:\n username@hostname#set deviceconfig system ntp-servers primary-ntp-server\n username@hostname#set deviceconfig\
    \ system ntp-servers secondary-ntp-server"
  checks:
  - type: sql
