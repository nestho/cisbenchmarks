  scoring: scored
  profile:
  - Level 1
  description: This defines how long a user can use a password before it expires.
  rationale: The longer a password exists, the higher the likelihood that it will be compromised by a brute force attack,
    by an attacker gaining general knowledge about the user and guessing the password, or by the user sharing the password.
