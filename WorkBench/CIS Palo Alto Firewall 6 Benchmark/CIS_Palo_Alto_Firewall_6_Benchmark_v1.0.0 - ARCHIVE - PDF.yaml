- id: '5.5'
  title: Ensure all WildFire session information settings are enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable all options under Session Information Settings for WildFire.
  rationale: Permitting the firewall to send all of this information to WildFire creates more detailed reports, thereby making
    the process of tracking down potentially infected devices more efficient. This could prevent an infected system from further
    infecting the environment. Environments with security policies restricting sending this data to the WildFire cloud can
    instead utilize an on-premises WildFire appliance. In addition, risk can be analyzed in the context of the destination
    host and user account, either during analysis or during incident response.
  impact: ''
  references:
  - 1. “WildFire Administrator's Guide 6.1 (English)” -
  - https://live.paloaltonetworks.com/docs/DOC-8251
