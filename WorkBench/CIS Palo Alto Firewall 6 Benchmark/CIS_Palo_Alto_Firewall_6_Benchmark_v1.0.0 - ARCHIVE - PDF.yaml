- id: '6.10'
  title: Ensure that URL Filtering uses the action of “block” or “override” on the URL categories
  scoring: scored
  profile:
  - Level 1
  description: 'Ideally, deciding which URL categories to block, and which to allow, is a joint effort between IT and another
    entity of authority within an organization—such as the legal department or administration. For most organizations, blocking
    or requiring an override on the following categories represents a minimum baseline: adult, hacking, malware, phishing,
    and proxy-avoidance-and-anonymizers.'
  rationale: Certain URL categories pose a technology-centric threat, such as malware, phishing, hacking, and proxy-avoidance-and-anonymizers.
    Users visiting websites in these categories, many times unintentionally, are at greater risk of compromising the security
    of their system. Other categories, such as adult, may pose a legal liability.
  impact: ''
  references:
  - 1. “PAN-OS Administrator's Guide 6.1 (English)” -
  - https://live.paloaltonetworks.com/docs/DOC-8246
