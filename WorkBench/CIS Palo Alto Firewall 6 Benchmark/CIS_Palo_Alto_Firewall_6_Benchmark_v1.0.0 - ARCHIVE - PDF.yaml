      username@hostname>show deviceconfig system ntp-servers'
- id: 1.6.3
  title: Ensure that the certificate securing Remote Access VPNs is valid
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'The Certificate used to secure Remote Access VPNs should satisfy the following criteria:  It should be a
    valid certificate from a trusted source. In almost cases this means a trusted Public Certificate Authority, as in most
    cases remote access VPN users will not have access to any Private Certificate Authorities for Certificate validation.
     The certificate should have a valid date. It should not have a "to" date in the past (it should not be expired), and
    should not have a "from" date in the future.  The key length used to encrypt the certificate should be 2048 bits or more.
     The hash used to sign the certificate should be SHA-2 or better.'
  rationale: If presented with a certificate error, the end user in most cases will not be able to tell if their session is
    using a self-signed or expired certificate, or if their session is being eavesdropped on or injected into by a "Man in
    the Middle" attack.
  impact: ''
  references:
  - 1. https://www.paloaltonetworks.com/documentation/60/globalprotect/global_prot
  - 2. https://www.paloaltonetworks.com/documentation/60/globalprotect/global_prot
  page_start: 55
  audit_raw: 'Verify that the certificate being used to secure the VPN meets the criteria listed above:

    Navigate to Device > Management > Certificate Management > Certificates

    Ensure that a valid certificate is applied to the HTTPS portal:

    Navigate to Network > GlobalProtect > Portals > Portal Configuration > Server

    Certificate

    Ensure that a valid certificate is applied to the GlobalProtect Gateway:

    Navigate to Network > GlobalProtect > Gateways > General > Server Certificate'
  remediation: 'Create a CSR and install a certificate from a public CA here:

    Navigate to Device > Management > Certificate Management > Certificates

    ARCHIVE

    55 | P a g e

    Apply a valid certificate to the HTTPS portal:

    Navigate to Network > GlobalProtect > Portals > Portal Configuration > Server

    Certificate

    Apply a valid certificate to the GlobalProtect Gateway:

    Navigate to Network > GlobalProtect > Gateways > General > Server Certificate'
  checks:
  - type: manual_review
    info: 'Verify that the certificate being used to secure the VPN meets the criteria listed above:

      Navigate to Device > Management > Certificate Management > Certificates

      Ensure that a valid certificate is applied to the HTTPS portal:

      Navigate to Network > GlobalProtect > Portals > Portal Configuration > Server

      Certificate

      Ensure that a valid certificate is applied to the GlobalProtect Gateway:

      Navigate to Network > GlobalProtect > Gateways > General > Server Certificate'
    severity: medium
- id: '2.1'
  title: Ensure that IP addresses are mapped to usernames
  scoring: scored
  profile:
  - Level 2
  description: Configure appropriate settings to map IP addresses to usernames. Mapping userids to IP addresses is what permits
    the firewall to create rules based on userids and groups rather than IP addresses and subnets, as well as log events by
    userids rather than IP addresses or DNS names. The specifics of how to achieve IP-to-username mapping is highly dependent
    on the environment. It can be enabled by integrating the firewall with a domain controller, Exchange server, captive portal,
    Terminal Server, User-ID Agent, XML API, or syslog data from a variety of devices.
  rationale: Understanding which user is involved in a security incident allows appropriate personnel to move quickly between
    the detection and reaction phases of incident response. In environments with either short DHCP lease times, or where users
    may move frequently between systems, the ability to analyze or report, or alert on events based on user accounts or user
    groups is a tremendous advantage. For forensics tasks when DHCP lease information may not be available, the Source User
    information may be the only way to tie together related data.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. “User-ID Best Practices - PAN-OS 5.0, 6.0” -
  - https://live.paloaltonetworks.com/docs/DOC-6591
  - https://live.paloaltonetworks.com/docs/DOC-4994
  - https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os
  page_start: 57
  audit_raw: "To validate if this recommendation has been met, look at the Source User column in the\nURL Filtering or Traffic\
    \ logs (Monitor > Logs > URL Filtering and Monitor > Logs >\nTraffic Logs, respectively.) User traffic originating from\
    \ a trusted zone should identify a\nusername.\nor\nExecute the following CLI command to display the status of the Agent\
    \ and connection\nstatistics:\nARCHIVE\n57 | P a g e\nusername@hostname#show user user-id-agent state all\nExecute the\
    \ following CLI command to display IP mappings:\n username@hostname#show user ip-user-mapping all\nExecute the following\
    \ CLI command if using an LDAP server:\nusername@hostname#show user group-mapping state all\nusername@hostname#show user\
    \ group list\nusername@hostname#show user group name <group name>"
  remediation: 'To Set User-ID Agents

    Navigate to Device > User-ID Agents

    Set the Name, IP Address and Port of the User-ID Agent

    Enable User Identification for each monitored zone that will have user accounts:

    Navigate to Network > Zone, for each relevant zone enable User Identification

    To Set Terminal Services Agents

    Navigate to Device > Terminal Services Agents

    Set the Name, IP Address and Port of the Terminal Services Agent

    Enable User Identification for each monitored zone that will have Terminal Servers:

    Navigate to Network > Zone, enable User Identification'
  checks:
  - type: sql
    command: show user user-id-agent state all
    severity: medium
    info: 'To validate if this recommendation has been met, look at the Source User column in the

      URL Filtering or Traffic logs (Monitor > Logs > URL Filtering and Monitor > Logs >

      Traffic Logs, respectively.) User traffic originating from a trusted zone should identify a

      username.

      or

      Execute the following CLI command to display the status of the Agent and connection

      statistics:

      ARCHIVE

      57 | P a g e

      username'
- id: '2.2'
  title: Ensure that WMI probing is disabled
  scoring: scored
  profile:
  - Level 2
  description: Disable WMI probing if it is not required for User-ID functionality in the environment.
  rationale: By default, WMI probing requires a domain administrator account. A malicious user could capture the encrypted
    password hash for offline cracking or relayed authentication attacks. Relying on other forms of user identification, such
    as security log monitoring, mitigates this risk.
  impact: While this removes the exposure of having the WMI user account password being compromised, it also reduces the effectiveness
    of user identification during operation of the firewall (applying rules and policies). This trade-off should be weighed
    carefully for all installations.
  references:
  - '1. “R7-2014-16: Palo Alto Networks User-ID Credential Exposure” -'
  - http://bit.ly/1GcbmD4
  - 2. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - https://live.paloaltonetworks.com/docs/DOC-6591
  page_start: 59
  audit_raw: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

    User ID Agent Setup.

    Verify that Enable Probing is not checked.'
  remediation: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

    User ID Agent Setup.

    Set Enable Probing so it is unchecked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > User Identification > User Mapping > Palo Alto Networks

      User ID Agent Setup.

      Verify that Enable Probing is not checked.'
    severity: medium
- id: '2.3'
  title: Ensure that User-ID is only enabled for internal trusted interfaces
  scoring: scored
  profile:
  - Level 1
  description: Only enable the User-ID option for interfaces that are both internal and trusted. There is rarely a legitimate
    need to allow WMI probing on an untrusted interface.
  rationale: PAN released a customer advisory in October of 2014 warning of WMI probing on untrusted interfaces with User-ID
    enabled. This can result in theft of the password hash for the account used in WMI probing.
  impact: ''
  references:
  - '1. “Customer advisory: Security Impact of User-ID Misconfiguration” -'
  - https://live.paloaltonetworks.com/docs/DOC-8125
  - '2. “R7-2014-16: Palo Alto Networks User-ID Credential Exposure” -'
  - http://bit.ly/1GcbmD4
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - https://live.paloaltonetworks.com/docs/DOC-6591
  page_start: 61
  audit_raw: 'Navigate to Network > Network Profiles > Interface Management.

    Verify that User-ID is only enabled for interfaces that are both internal and trusted.'
  remediation: 'Navigate to Network > Network Profiles > Interface Management.

    Set User-ID to be checked only for interfaces that are both internal and trusted;

    uncheck it for all other interfaces.'
  checks:
  - type: manual_review
    info: 'Navigate to Network > Network Profiles > Interface Management.

      Verify that User-ID is only enabled for interfaces that are both internal and trusted.'
    severity: medium
- id: '2.4'
  title: Ensure that 'Include/Exclude Networks' is used if User-ID is enabled
  scoring: scored
  profile:
  - Level 1
  description: If User-ID is configured, use the Include/Exclude Networks section to limit the User-ID scope to operate only
    on trusted networks. There is rarely a legitimate need to allow WMI probing on an untrusted network.
  rationale: The Include/Exclude Networks feature allow users to configure boundaries for the User-ID service. By using the
    feature to limit User-ID probing to only trusted internal networks, the risks of privileged information disclosure through
    sent probes can be reduced. Note that if an entry appears in the Include/Exclude Networks section, an implicit exclude-allnetworks
    policy will take effect for all other networks.
  impact: ''
  references:
  - 1. Best Practices for Securing User-ID Deployments -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  page_start: 62
  audit_raw: 'Navigate to Device > User Identification > User Mapping > Include/Exclude

    Networks.

    Verify that all trusted internal networks have a Discovery value of Include.

    Verify that all untrusted external networks have a Discovery value of Exclude.'
  remediation: 'Navigate to Device > User Identification > User Mapping > Include/Exclude

    Networks.

    Set all trusted internal networks to have a Discovery value of Include.

    Set all untrusted external networks to have a Discovery value of Exclude.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > User Identification > User Mapping > Include/Exclude

      Networks.

      Verify that all trusted internal networks have a Discovery value of Include.

      Verify that all untrusted external networks have a Discovery value of Exclude.'
    severity: medium
- id: '2.5'
  title: Ensure that the User-ID Agent has minimal permissions if User-ID is enabled
  scoring: scored
  profile:
  - Level 1
  description: If the integrated (on-device) User-ID Agent is utilized, the Active Directory account for the agent should
    only be a member of the Event Log Readers group, Distributed COM Users group, and Domain Users group. If the Windows User-ID
    agent is utilized, the Active Directory account for the agent should only be a member of the Event Log Readers group,
    Server Operators group, and Domain Users group.
  rationale: As a principle of least privilege, user accounts should have only minimum necessary permissions. If an attacker
    compromises a User-ID service account with domain admin rights, the organization is at far greater risk than if the service
    account were only granted minimum rights.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. “User-ID Best Practices - PAN-OS 5.0, 6.0” -
  - https://live.paloaltonetworks.com/docs/DOC-6591
  - https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os/userid/configure-user-mapping-using-the-windows-user-id-agent
  - https://www.paloaltonetworks.com/documentation/61/pan-os/pan-os/userid/configure-user-mapping-using-the-pan-os-integrated-user-id-agent.html
