- id: 1.5.1
  title: Ensure 'V3' is selected for SNMP polling
  scoring: scored
  profile:
  - Level 1
  description: For SNMP polling, only SNMPv3 should be used.
  rationale: SNMPv3 utilizes AES-128 encryption, message integrity, user authorization, and device authentication security
    features. SNMPv2c does not provide these security features. If an SNMPv2c community string is intercepted or otherwise
    obtained, an attacker could gain read access to the firewall. Note that SNMP write access is not possible.
  impact: ''
  references:
  - 1. “How to Setup SNMPv3 Polling” - https://live.paloaltonetworks.com/docs/DOC4037
  - 2. “Using the Simple Network Management Protocol (SNMP)” -
  - https://live.paloaltonetworks.com/docs/DOC-4627
  - 1.6 Device Services Settings
  page_start: 49
  audit_raw: "Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup\nVerify V3 is selected.\nor\nExecute the\
    \ following CLI command to verify SNMPv3 is configured:\n username@hostname#show deviceconfig system snmp-setting"
  remediation: "Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup\nSelect V3.\nor\nTo remediate this setting,\
    \ execute the following CLI command:\n username@hostname#set deviceconfig system snmp-setting access-setting version v3\n\
    ARCHIVE\n49 | P a g e"
  checks:
  - type: sql
    command: show deviceconfig system snmp-setting
    severity: medium
    info: "Navigate to Device > Setup > Operations > Miscellaneous > SNMP Setup\nVerify V3 is selected.\nor\nExecute the following\
      \ CLI command to verify SNMPv3 is configured:\n username@hostname#show deviceconfig system snmp-setting"
