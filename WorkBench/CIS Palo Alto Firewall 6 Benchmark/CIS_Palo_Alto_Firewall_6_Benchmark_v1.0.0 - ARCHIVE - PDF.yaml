    \ is checked.\nor\nExecute the following CLI command to verify ssl-decryption configuration:\n username@hostname#show\
    \ setting ssl-decrypt | match decrypted"
  remediation: 'Navigate to Device > Setup > Content-ID > Content-ID Settings.

    Set Allow forwarding of decrypted content to be checked.

    or

