- id: 1.3.5
  title: Ensure 'Password Profiles' do not exist
  scoring: scored
  profile:
  - Level 1
  description: Password profiles that are weaker than the recommended minimum password complexity settings must not exist.
  rationale: As password profiles override any 'Minimum Password Complexity' settings defined in the device, they generally
    should not exist. If these password profiles do exist, they should enforce stronger password policies than what is set
    in the 'Minimum Password Complexity' settings.
  impact: ''
  references:
  - 1. PAN-OS 6.1 Administrator’s Guide pg.53
  page_start: 31
  audit_raw: 'Navigate to Device > Password Profiles.

    Verify Password Profiles weaker than the recommended minimum password complexity

    settings do not exist.

    or

    Execute the following CLI command:

    username@hostname#show mgt-config password-profile'
  remediation: 'Navigate to Device > Password Profiles.

    Ensure Password Profiles weaker than the recommended minimum password complexity

    settings do not exist.

    or

    Execute the following CLI command:

    username@hostname#set mgt-config password-profile <none>'
  checks:
  - type: sql
    command: show mgt-config password-profile
    severity: medium
    info: 'Navigate to Device > Password Profiles.

      Verify Password Profiles weaker than the recommended minimum password complexity

      settings do not exist.

