controls:
- id: 1.1.1
  title: Ensure 'Login Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Configure a login banner, ideally approved by the organization’s legal team. This banner should, at minimum,
    prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word “welcome” or similar words
    of invitation.
  rationale: Through a properly stated login banner, the risk of unintentional access to the device by unauthorized users
    is reduced. Should legal action take place against a person accessing the device without authorization, the login banner
    greatly diminishes a defendant’s claim of ignorance.
  impact: ''
  references:
  - 1. “How to Configure the Device Login Banner” -
  - https://live.paloaltonetworks.com/docs/DOC-7964
  page_start: 13
  audit_raw: 'Navigate to Device > Setup > Management > General Settings.

    Verify Login Banner is set appropriately.

    or

    Execute the following CLI command to verify a login banner is configured:

    username@hostname#show deviceconfig system | match login-banner'
  remediation: 'Navigate to Device > Setup > Management > General Settings.

    Set Login Banner as appropriate.

    or

    To remediate this setting using the CLI, execute the following command:

    username@hostname#set deviceconfig system login-banner <value>

    ARCHIVE

    13 | P a g e'
  checks:
  - type: sql
    command: show deviceconfig system | match login-banner
    severity: medium
    info: 'Navigate to Device > Setup > Management > General Settings.

      Verify Login Banner is set appropriately.

      or

      Execute the following CLI command to verify a login banner is configured:

      username@hostname#show deviceconfig system | match login-banner'
- id: 1.1.2
  title: Ensure 'Enable Log on High DP Load' is enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable the option 'Enable Log on High DP Load' feature. When this option is selected, a system log entry is
    created when the device’s packet processing load reaches 100% utilization.
  rationale: When the device’s packet processing load reaches 100%, a degradation in the availability of services accessed
    through the device can occur. Logging this event can help with troubleshooting system performance.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-4075
  - 1.2 Management Interface Settings
  page_start: 15
  audit_raw: 'Navigate to Device > Setup > Management > Logging and Reporting Settings .

    Verify Enable Log on High DP Load is checked.

    or

    Execute the following CLI command to verify DP load log settings:

    username@hostname#show deviceconfig setting | match enable-log-high-dp-load'
  remediation: "Navigate to Device > Setup > Management > Logging and Reporting Settings .\nSet the Enable Log on High DP\
    \ Load box to checked.\nor\nTo remediate this setting using the CLI, execute the following command:\n username@hostname#set\
    \ deviceconfig setting management enable-log-high-dp-load yes"
  checks:
  - type: sql
    command: show deviceconfig setting | match enable-log-high-dp-load
    severity: medium
    info: 'Navigate to Device > Setup > Management > Logging and Reporting Settings .

      Verify Enable Log on High DP Load is checked.

      or

      Execute the following CLI command to verify DP load log settings:

      username@hostname#show deviceconfig setting | match enable-log-high-dp-load'
- id: 1.2.1
  title: Ensure 'Permitted IP Addresses' is set to those necessary for device management
  scoring: scored
  profile:
  - Level 1
  description: Permit only the necessary IP addresses to be used to manage the device.
  rationale: Management access to the device should be restricted to the IP addresses used by firewall administrators. Permitting
    management access from other IP addresses increases the risk of unauthorized access through password guessing, stolen
    credentials, or other means.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-8432
  page_start: 17
  audit_raw: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Verify Permitted IP Addresses is limited to those necessary for device management.

    or

    Execute the following CLI command to verify that all IP addresses listed for the setting are

    approved for device management:

    username@hostname#run show interface management'
  remediation: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Set Permitted IP Addresses to only those necessary for device management.

    or

    To remediate this setting using the CLI, execute the following command:

    username@hostname#set deviceconfig system permitted-ip <ipaddress/netmask>

    ARCHIVE

    17 | P a g e

    username@hostname#commit'
  checks:
  - type: sql
    command: show interface management
    severity: medium
    info: 'Navigate to Device > Setup > Management > Management Interface Settings .

      Verify Permitted IP Addresses is limited to those necessary for device management.

      or

      Execute the following CLI command to verify that all IP addresses listed for the setting are

      approved for device management:

      username@hostname#run show interface management'
- id: 1.2.2
  title: Ensure 'Permitted IP Addresses' is set for all management profiles where SSH, HTTPS, or SNMP is enabled
  scoring: scored
  profile:
  - Level 1
  description: For all management profiles, only the IP addresses required for device management should be specified.
  rationale: If a Permitted IP Addresses list is either not specified or is too broad, an attacker may gain the ability to
    attempt management access from unintended locations, such as the Internet. The “Ensure 'Security Policy' denying any/all
    traffic exists at the bottom of the security policies ruleset” recommendation in this benchmark can provide additional
    protection by requiring a security policy specifically allowing device management access.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-8432
  page_start: 19
  audit_raw: 'Navigate to Network > Network Profiles > Interface Management.

    Verify Permitted IP Addresses is limited to those necessary for device management.'
  remediation: 'Navigate to Network > Network Profiles > Interface Management.

    Set Permitted IP Addresses to only include those necessary for device management.

    or

    To remediate this setting using the CLI, execute the following commands:

    username@hostname#set network profiles interface-management-profile permitted-ip

    username@hostname#commit'
  checks:
  - type: manual_review
    info: 'Navigate to Network > Network Profiles > Interface Management.

      Verify Permitted IP Addresses is limited to those necessary for device management.'
    severity: medium
- id: 1.2.3
  title: Ensure HTTP and Telnet options are disabled for the Management Interface
  scoring: scored
  profile:
  - Level 1
  description: HTTP and Telnet options should not be enabled for device management.
  rationale: Management access over cleartext services such as HTTP or Telnet could result in a compromise of administrator
    credentials and other sensitive information related to device management.
  impact: ''
  references:
  - 1. https://live.paloaltonetworks.com/docs/DOC-2005
  page_start: 20
  audit_raw: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Verify that the HTTP and Telnet options are both unchecked.'
  remediation: 'Navigate to Device > Setup > Management > Management Interface Settings .

    Set the HTTP and Telnet boxes to unchecked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Management Interface Settings .

      Verify that the HTTP and Telnet options are both unchecked.'
    severity: medium
- id: 1.2.4
  title: Ensure valid certificate is set for browser-based administrator interface
  scoring: scored
  profile:
  - Level 2
  description: 'In most cases, a browser HTTPS interface is used to administer the Palo Alto appliance. The certificate used
    to secure this session should satisfy the following criteria: 1. A valid certificate from a trusted source should be used.
    While a certificate from a trusted Public Certificate Authority is certainly valid, one from a trusted Private Certificate
    Authority is absolutely acceptable for this purpose. 2. The certificate should have a valid date. It should not have a
    "to" date in the past (it should not be expired), and should not have a "from" date in the future. 3. The certificate
    should use an acceptable cipher and encryption level.'
  rationale: If a certificate that is self-signed, expired, or otherwise invalid is used for the browser HTTPS interface,
    administrators in most cases will not be able to tell if their session is being eavesdropped on or injected into by a
    "Man in the Middle" attack.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by reviewing

    the appropriate certificate:

    Navigate to Device > Setup > Certificate Management > Certificates

    Verify that there is an appropriately named Certificate Profile for Management Interface

    Access:

    Navigate to Device > Setup > Certificate Management > Certificate Profile

    Verify that the Authentication Profile field contains the Certificate Profile created for

    Management Interface Access:

    Navigate to Device > Setup > Management (tab) > Authentication Settings >

    Authentication Profile (field)

    ARCHIVE

    21 | P a g e'
  remediation: 'If a new administrative certificate is needed, acquire a certificate that meets the stated

    criteria and set it:

    Navigate to Device > Setup > Certificate Management > Certificates

    Set an appropriately named Certificate Profile for Management Interface Access:

    Navigate to Device > Setup > Certificate Management > Certificate Profile

    Set the Authentication Profile field so it contains the Certificate Profile created for

    Management Interface Access:

    Navigate to Device > Setup > Management (tab) > Authentication Settings >

    Authentication Profile (field)'
  checks:
  - type: manual_review
    info: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by reviewing

      the appropriate certificate:

      Navigate to Device > Setup > Certificate Management > Certificates

      Verify that there is an appropriately named Certificate Profile for Management Interface

      Access:

      Navigate to Device > Setup > Certificate Management > Certificate Profile

      Verify that the Authentication Profile field contains the Certificate Profile created for

      Management Interface Access:

      Navigate to Device > Set'
    severity: medium
- id: 1.3.1
  title: Ensure 'Minimum Password Complexity' is enabled
  scoring: scored
  profile:
  - Level 1
  description: This checks all new passwords to ensure that they meet basic requirements for strong passwords.
  rationale: Password complexity recommendations are derived from the USGCB (United States Government Configuration Baseline),
    Common Weakness Enumeration, and benchmarks published by the CIS (Center for Internet Security).
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Navigate to Device > Setup > Management > Minimum Password Complexity.\nVerify Enabled is checked\nor\nExecute\
    \ the following CLI command:\n username@hostname#show mgt-config password-complexity"
  remediation: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nSet Enabled to be checked\nor\nExecute\
    \ the following CLI command:\n username@hostname#set mgt-config password-complexity\n+ block-repeated-characters Block\
    \ repeated characters count\n+ block-username-inclusion Block inclusion of username and it's reverse\nARCHIVE\n23 | P\
    \ a g e\n+ enabled Enable minimal password complexity enforcement\n+ minimum-length Minimum password length\n+ minimum-lowercase-letters\
    \ Minimum lowercase letters in the password\n+ minimum-numeric-letters Minimum numeric(0-9) letters in the password\n\
    + minimum-special-characters Minimum special characters(non-alphanumeric) in\nthe password\n+ minimum-uppercase-letters\
    \ Minimum uppercase letters in the password\n+ new-password-differs-by-characters New Password must differ by the count\
    \ chars\n+ password-change-on-first-login Password must change on first time login\n+ password-change-period-block Password\
    \ change block period\n+ password-history-count Save password history for password changes\n> password-change password-change\n\
    \ <Enter> Finish input\n# commit"
  checks:
  - type: sql
    command: show mgt-config password-complexity
    severity: medium
    info: "Navigate to Device > Setup > Management > Minimum Password Complexity.\nVerify Enabled is checked\nor\nExecute\
      \ the following CLI command:\n username@hostname#show mgt-config password-complexity"
- id: 1.3.2
  title: Ensure 'Minimum Length' is greater than or equal to 12
  scoring: scored
  profile:
  - Level 1
  description: This determines the least number of characters that make up a password for a user account.
  rationale: Types of password attacks include dictionary attacks (which attempt to use common words and phrases) and brute
    force attacks (which try every possible combination of characters).
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nVerify Minimum Length is greater than\
    \ or equal to 12\nor\nExecute the following CLI command:\n username@hostname#show mgt-config password-complexity | match\
    \ minimum-length"
  remediation: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nSet Minimum Length to greater than\
    \ or equal to 12\nor\nExecute the following CLI command:\n username@hostname#set mgt-config password-complexity minimum-length\
    \ <>\n+ block-repeated-characters Block repeated characters count\n+ block-username-inclusion Block inclusion of username\
    \ and it's reverse\n+ enabled Enable minimal password complexity enforcement\n+ minimum-length Minimum password length\n\
    + minimum-lowercase-letters Minimum lowercase letters in the password\n+ minimum-numeric-letters Minimum numeric(0-9)\
    \ letters in the password\n+ minimum-special-characters Minimum special characters(non-alphanumeric) in\nthe password\n\
    + minimum-uppercase-letters Minimum uppercase letters in the password\n+ new-password-differs-by-characters New Password\
    \ must differ by the count chars\n+ password-change-on-first-login Password must change on first time login\nARCHIVE\n\
    25 | P a g e\n+ password-change-period-block Password change block period\n+ password-history-count Save password history\
    \ for password changes\n> password-change password-change\n <Enter> Finish input\n# commit"
  checks:
  - type: sql
    command: show mgt-config password-complexity | match minimum-length
    severity: medium
    info: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nVerify Minimum Length is greater than\
      \ or equal to 12\nor\nExecute the following CLI command:\n username@hostname#show mgt-config password-complexity | match\
      \ minimum-length"
- id: 1.3.3
  title: Ensure 'Prevent Password Reuse Limit' is set to 24 or more passwords
  scoring: scored
  profile:
  - Level 1
  description: This determines the number of unique passwords that have to be most recently used for a user account before
    a previous password can be reused.
  rationale: The longer a user uses the same password, the greater the chance that an attacker can determine the password
    through brute force attacks. Also, any accounts that may have been compromised will remain exploitable for as long as
    the password is left unchanged. If password changes are required but password reuse is not prevented, or if users continually
    reuse a small number of passwords, the effectiveness of a good password policy is greatly reduced.
  impact: ''
  references: []
  page_start: 27
  audit_raw: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nVerify Prevent Password Reuse Limit\
    \ is greater than or equal to 24\nor\nExecute the following CLI command:\n username@hostname#show mgt-config password-complexity\
    \ | match password-history-count"
  remediation: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nSet Prevent Password Reuse Limit\
    \ to greater than or equal to 24\nor\nExecute the following CLI command:\n username@set mgt-config password-complexity\
    \ password-history-count <>\n+ block-repeated-characters Block repeated characters count\n+ block-username-inclusion Block\
    \ inclusion of username and it's reverse\nARCHIVE\n27 | P a g e\n+ enabled Enable minimal password complexity enforcement\n\
    + minimum-length Minimum password length\n+ minimum-lowercase-letters Minimum lowercase letters in the password\n+ minimum-numeric-letters\
    \ Minimum numeric(0-9) letters in the password\n+ minimum-special-characters Minimum special characters(non-alphanumeric)\
    \ in\nthe password\n+ minimum-uppercase-letters Minimum uppercase letters in the password\n+ new-password-differs-by-characters\
    \ New Password must differ by the count chars\n+ password-change-on-first-login Password must change on first time login\n\
    + password-change-period-block Password change block period\n+ password-history-count Save password history for password\
    \ changes\n> password-change password-change\n <Enter> Finish input\n# commit"
  checks:
  - type: sql
    command: show mgt-config password-complexity | match password-history-count
    severity: medium
    info: "Navigate to Device > Setup > Management > Minimum Password Complexity .\nVerify Prevent Password Reuse Limit is\
      \ greater than or equal to 24\nor\nExecute the following CLI command:\n username@hostname#show mgt-config password-complexity\
      \ | match password-history-count"
- id: 1.3.4
