- id: '6.14'
  title: Ensure alerting after a threshold of credit card or Social Security numbers is detected is enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This guideline is highly specific to an organization. While blocking of credit card or Social Security numbers
    will not occur with the recommended settings below, careful tuning is also recommended. Configure a Data Pattern with
    the following values: CC# - 10 SSN# - 20 SSN# (without dash) – 1'
  rationale: Credit card and Social Security numbers are sensitive, and should never traverse an organization’s Internet connection
    in clear text. Passing sensitive data within an organization should also be avoided whenever possible. Detecting and blocking
    known sensitive information is a basic protection against a data breach or data loss. Not implementing these defenses
    can lead to loss of regulatory accreditation (such as PCI, HIPAA etc), or can lead to legal action from injured parties
    or regulatory bodies.
