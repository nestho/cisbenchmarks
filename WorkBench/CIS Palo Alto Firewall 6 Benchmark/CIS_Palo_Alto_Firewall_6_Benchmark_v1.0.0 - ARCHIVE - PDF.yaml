  description: If a single rule exists within the anti-spyware profile, configure it to block on any spyware severity level,
    any category, and any threat. If multiple rules exist within the anti-spyware profile, ensure all spyware categories,
    threats, and severity levels are set to be blocked. Additional rules may exist for packet capture or exclusion purposes.
  rationale: Requiring a blocking policy for all spyware threats, categories, and severities reduces the risk of spyware traffic
    from successfully exiting the organization. Without an anti-spyware profile assigned to any potential hostile zone, the
    first protection in the path against malware is removed, leaving in most cases only the desktop endpoint protection application
