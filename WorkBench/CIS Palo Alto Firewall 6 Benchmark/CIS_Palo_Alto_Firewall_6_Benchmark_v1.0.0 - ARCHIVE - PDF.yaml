- id: '7.3'
  title: Ensure 'Security Policy' denying any/all traffic exists at the bottom of the security policies ruleset
  scoring: scored
  profile:
  - Level 2
  description: EXTREME CAUTION MUST BE USED BEFORE IMPLEMENTING THIS RECOMMENDATION, AS CERTAIN TRAFFIC PERMITTED BY DEFAULT
    WILL BE DENIED UNLESS SPECIFICALLY ALLOWED. Create a security rule at the bottom of the security policies ruleset denying
    any traffic, regardless of source, destination, or application. Ensure this policy is set to log at session end, just
    before pre-defined intrazone-default and interzone-default rules.
  rationale: In incident response, logging denied traffic is often just as important as logging permitted traffic. The logs
    for denied traffic can be used to establish a pattern of failed attack attempts before the final attack succeeds. This
    can be used in attribution and identification of the attacker, but can also be used to help identify which defenses need
    shoring up to defend against future attacks. Viewing denied traffic can also be useful for understanding how security
    policies are affecting traffic. Palo Alto firewalls do not log denied traffic by default. Therefore, to acquire visibility
    to denied traffic, a “deny and log” policy must be created at the end of the security policy ruleset.
  impact: ''
  references:
  - 1. “Dynamic Protocols on Palo Alto Networks Devices that Do Not Require Security
  - 2. “Security Policy Guidelines” - https://live.paloaltonetworks.com/docs/DOC-3469
