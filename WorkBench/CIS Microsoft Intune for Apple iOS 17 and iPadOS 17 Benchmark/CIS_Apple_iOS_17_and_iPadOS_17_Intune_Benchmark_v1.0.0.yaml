- id: 2.2.2
  title: Ensure "Require Safari fraud warnings" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This enforces the feature to display fraud warnings within the Safari web browser.
  rationale: Fraudulent websites masquerade as legitimate instances of financial, business, or other sensitive sites. They
    are designed to capture user credentials, often through phishing campaigns. Safari's fraudulent website warning feature
    helps protect end users from such sites. For increased security, the Safari web browser should be used to enforce fraud
    warnings.
  impact: ''
  references: []
