controls:
- id: 2.1.1
  title: Ensure "Block viewing corporate documents in unmanaged apps" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This prevents viewing corporate documents in unmanaged apps.
  rationale: By default, depending on per-app policies, the OS might allow corporate documents to be viewed in any app.
  impact: Third-party keyboards may not function correctly with this restriction set.
  references: []
  page_start: 17
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration profiles

    3. Select the profile which applies to the iOS/iPadOS device

    4. Under Configuration settings

    5. Select the App Store, Doc Viewing, Gaming heading

    6. Verify that Block viewing corporate documents in unmanaged apps is present

    and set to Yes

    Or, from the device:

    1. Tap Settings

    2. Tap General

    3. Tap VPN & Device Management

    4. Tap <Profile Name>

    5. Tap Restrictions

    6. Confirm Opening documents from managed to unmanaged apps not allowed is

    displayed'
  remediation: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration profiles

    3. Select the profile which applies to the iOS/iPadOS device

    4. Click edit, next to Configuration settings

    5. Select the App Store, Doc Viewing, Gaming heading

    6. Set Block viewing corporate documents in unmanaged apps to Yes'
  checks:
  - type: manual_review
    info: 'From the Microsoft Intune admin center:

      1. Select Devices

      2. Select Configuration profiles

      3. Select the profile which applies to the iOS/iPadOS device

      4. Under Configuration settings

