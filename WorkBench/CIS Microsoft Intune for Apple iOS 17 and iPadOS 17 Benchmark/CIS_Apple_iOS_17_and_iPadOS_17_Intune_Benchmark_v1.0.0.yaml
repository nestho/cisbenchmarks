- id: 2.3.2
  title: Ensure "Block managed apps from storing data in iCloud" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This prevents managed apps from storing and syncing data to the user's iCloud account.
  rationale: This recommendation addresses intentional or unintentional data leakage. It prevents a user from installing an
    application that is managed by the organization on a personal device and allowing iCloud to sync the managed application's
    data to the personal, nonmanaged application.
  impact: Data created within apps on the device may be lost if the end user has not transferred it to another device.
  references: []
  page_start: 31
