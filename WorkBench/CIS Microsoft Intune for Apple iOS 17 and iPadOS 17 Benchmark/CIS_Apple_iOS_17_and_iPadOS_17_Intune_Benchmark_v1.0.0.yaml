  description: This recommendation blocks untrusted Transport Layer Security (TLS) certificates.
  rationale: iOS devices maintain a list of trusted TLS certificate roots. An organization may choose to add their own certificates
    to the list by using a configuration profile. Allowing users to bypass that list and accept self-signed or otherwise unverified/invalid
    certificates may increase the likelihood of an incident.
  impact: The device automatically rejects untrusted HTTPS certificates without prompting the user. Services using self-signed
    certificates will not function.
