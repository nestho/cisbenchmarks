- id: '2.3'
  title: Cloud and Storage 2.3.1 Ensure "Force encrypted backup" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This requires device backups to be stored in an encrypted state.
  rationale: Data that are stored securely on an iOS or iPadOS device may be trivially accessed from a local computer backup.
    Forcing the encryption of backups protects data from being compromised if the local host computer is compromised.
  impact: End users must configure a password for the encrypted backup, the complexity of which is not managed.
  references: []
  page_start: 28
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration profiles

    3. Select the profile which applies to the iOS/iPadOS device

    4. Under Configuration settings

    5. Select the Cloud and Storage heading

    6. Verify that Force encrypted backup is present and set to Yes

    Or, from the device:

    1. Tap Settings

    2. Tap General

    3. Tap VPN & Device Management

    4. Tap <Profile Name>

    5. Tap Restrictions

    6. Confirm Encrypted backups enforced is displayed'
  remediation: 'From the Microsoft Intune admin center:

