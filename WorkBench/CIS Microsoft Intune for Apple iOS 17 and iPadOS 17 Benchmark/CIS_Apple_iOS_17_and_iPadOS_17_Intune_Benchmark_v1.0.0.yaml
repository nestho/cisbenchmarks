- id: 2.2.1
  title: Ensure "Block Siri while device is locked" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This prevents access to Siri when the device is locked.
  rationale: Accessing Siri on a locked device may allow unauthorized users to access information otherwise not available
    to them, such as messaging, contacts, and a variety of other data.
  impact: The end user must unlock the device before interacting with Siri.
