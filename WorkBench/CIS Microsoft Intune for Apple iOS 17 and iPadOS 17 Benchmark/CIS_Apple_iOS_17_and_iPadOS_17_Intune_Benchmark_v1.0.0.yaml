- id: 2.5.6
  title: Ensure "Limit Apple personalized advertising" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: Apple provides a framework that allows advertisers to target Apple users with advertisements relevant to them
    and their interests by means of a unique identifier. For such personalized advertisements to be delivered, however, detailed
    information is collected, correlated, and made available to advertisers. This information is valuable to both advertisers
    and attackers and has been used with other metadata to reveal users' identities.
  rationale: Disabling the use of a unique identifier helps hinder the tracking of users, which in turn supports protection
    of user data.
  impact: Users will see generic advertising rather than targeted advertising. Apple has warned that this will reduce the
    number of relevant ads.
