- id: 2.4.1
  title: Ensure "Force Apple Watch wrist detection" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This restriction forces wrist detection to be enabled to paired Apple Watches. When enforced, the Apple Watch
    won't display notifications when it's not being worn. The Apple Watch will also lock itself when it has been removed from
    a user's wrist.
  rationale: Wrist detection prevents a removed Apple Watch from providing access to information not otherwise available.
    It will also automatically lock if the watch was removed.
  impact: ''
  references: []
