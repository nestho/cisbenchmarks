- id: 2.6.1
  title: Ensure "Block Control Center access in lock screen" is set to "Yes"
  scoring: manual
  profile:
  - Level 1 - Unsupervised Devices
  description: This restriction prevents access to the Control Center on the lock screen. Passcode/Face ID must be set for
    this to apply.
  rationale: When a device is lost or stolen, the Control Center may be used to enable airplane mode, thus preventing locating
    or erasing the device. Disabling Control Center forces a malicious actor to power down the device, which then discards
    the encryption key in memory. This makes some attacks based on physical possession more difficult. Further information
    such as media recently played, alarm information, and latest calculator history can also be seen.
  impact: ''
  references: []
