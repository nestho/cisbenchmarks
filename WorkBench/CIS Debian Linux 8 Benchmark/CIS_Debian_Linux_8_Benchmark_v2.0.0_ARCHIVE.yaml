- id: '5.6'
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo, which allows for more granular control over privileged access. Normally, the su command can be executed by any user.
    By uncommenting the pam_wheel.so statement in /etc/pam.d/su, the su command will only allow users in the sudo group to
    execute su.
  rationale: Restricting the use of su, and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo, whereas su can only record that a user executed the su program.
  impact: ''
  references: []
  page_start: 421
  audit_raw: 'Run the following command and verify output includes matching line:

    # grep pam_wheel.so /etc/pam.d/su

    auth required pam_wheel.so

    Run the following command and verify users in sudo group match site policy:

    # grep sudo /etc/group

    sudo:x:10:root,<user list>

    421 | P a g e'
  remediation: 'Add the following line to the /etc/pam.d/su file:

    auth required pam_wheel.so

    Create a comma separated list of users in the sudo statement in the /etc/group file:

    sudo:x:10:root,<user list>

    Notes:

    The use_uid option to pam_wheel.so is a no-op on debian based systems. It is acceptable

    but not required as these systems use its behavior as default.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output includes matching line:

      # grep pam_wheel.so /etc/pam.d/su

      auth required pam_wheel.so

      Run the following command and verify users in sudo group match site policy:

      # grep sudo /etc/group

      sudo:x:10:root,<user list>

      421 | P a g e'
    severity: medium
- id: 6.1.1
  title: Audit system file permissions
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: 'The Debian package manager has a number of useful options. One of these, the --verify option, can be used
    to verify that system packages are correctly installed. The --verify option can be used to verify a particular package
    or to verify all system packages. If no output is returned, the package is installed correctly. The following table describes
    the meaning of output from the verify option: Code Meaning S File size differs. M File mode differs (includes permissions
    and file type). 5 The MD5 checksum differs. D The major and minor version numbers differ on a device file. L A mismatch
    occurs in a link. U The file ownership differs. G The file group owner differs. T The file time (mtime) differs. The dpkg
    -S command can be used to determine which package a particular file belongs to. For example the following commands determines
    which package the /bin/bash file belongs to: # dpkg -S /bin/bash bash: /bin/bash To verify the settings for the package
    that controls the /bin/bash file, run the following: # dpkg --verify bash ??5?????? c /etc/bash.bashrc 425 | P a g e'
  rationale: It is important to confirm that packaged system files and directories are maintained with the permissions they
    were intended to have from the OS vendor.
  impact: ''
  references: []
  page_start: 425
  audit_raw: 'Run the following command to review all installed packages. Note that this may be very

    time consuming and may be best scheduled via the cron utility. It is recommended that the

    output of this command be redirected to a file that can be reviewed later.

    # dpkg --verify <filename>'
  remediation: 'Correct any discrepancies found and rerun the audit until output is clean or risk is

    mitigated or accepted.

    Notes:

    Since packages and important files may change with new updates and releases, it is

    recommended to verify everything, not just a finite list of files. This can be a time

    consuming task and results may depend on site policy therefore it is not a scorable

    benchmark item, but is provided for those interested in additional security measures.

    Some of the recommendations of this benchmark alter the state of files audited by this

    recommendation. The audit command will alert for all changes to a file permissions even if

    the new state is more secure than the default.

    426 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following command to review all installed packages. Note that this may be very

      time consuming and may be best scheduled via the cron utility. It is recommended that the

      output of this command be redirected to a file that can be reviewed later.

      # dpkg --verify <filename>'
    severity: medium
