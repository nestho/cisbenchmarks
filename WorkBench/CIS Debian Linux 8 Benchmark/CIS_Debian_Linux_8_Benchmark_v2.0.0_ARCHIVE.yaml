- id: 5.4.2
  title: Ensure system accounts are non-login
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: There are a number of accounts provided with Debian that are used to manage applications and are not intended
    to provide an interactive shell.
  rationale: It is important to make sure that accounts that are not being used by regular users are prevented from being
    used to provide an interactive shell. By default, Debian sets the password field for these accounts to an invalid string,
    but it is also recommended that the shell field in the password file be set to /usr/sbin/nologin. This prevents the account
    from potentially being used to run any commands. Some built-in accounts may use /bin/false which is also acceptable. This
    prevents the account from potentially being used to run any commands.
  impact: ''
  references: []
  page_start: 413
  audit_raw: 'Run the following scripts and verify no results are returned:

    egrep -v "^\+" /etc/passwd | awk -F: ''($1!="root" && $1!="sync" &&

    $1!="shutdown" && $1!="halt" && $3<1000 && $7!="/usr/sbin/nologin" &&

    $7!="/bin/false") {print}''

    for user in `awk -F: ''($1!="root" && $3 < 1000) {print $1 }'' /etc/passwd`; do

    passwd -S $user | awk -F '' '' ''($2!="L") {print $1}''; done

    413 | P a g e'
  remediation: "Set the shell for any accounts returned by the audit script to /usr/sbin/nologin:\n# usermod -s /usr/sbin/nologin\n\
    The following script will automatically set all user shells required to /usr/sbin/nologin\nand lock the sync, shutdown,\
    \ and halt users:\n#!/bin/bash\nfor user in `awk -F: '($3 < 1000) {print $1 }' /etc/passwd`; do\n if [ $user != \"root\"\
    \ ]; then\n usermod -L $user\n if [ $user != \"sync\" ] && [ $user != \"shutdown\" ] && [ $user != \"halt\" ];\nthen\n\
    \ usermod -s /usr/sbin/nologin $user\n fi\n fi\ndone"
