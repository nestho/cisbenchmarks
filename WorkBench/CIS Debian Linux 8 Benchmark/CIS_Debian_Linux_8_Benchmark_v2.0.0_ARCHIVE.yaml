- id: 1.1.2
  title: Ensure /tmp is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not
    bound to a separate partition. In addition, making /tmp its own file system allows an administrator to set the noexec
    option on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker
    from establishing a hardlink to a system setuid program and wait for it to be updated. Once the program was updated, the
    hardlink would be broken and the attacker would have his own copy of the program. If the program happened to have a security
    vulnerability, the attacker could continue to exploit the known flaw. This can be accomplished by either mounting tmpfs
    to /tmp, or creating a separate partition for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a default installation a disk-based /tmp will essentially have the whole disk available, as it only creates a single
    / partition. On the other hand, a RAM-based /tmp as with tmpfs will almost certainly be much smaller, which can lead to
    applications filling up the filesystem much more easily. /tmp utalizing tmpfs can be resized using the size={size} parameter
    on the Options line on the tmp.mount file
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  page_start: 34
  audit_raw: 'Run the following command and verify output shows /tmp is mounted:

    # mount | grep /tmp

    tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

    run the following command and verify that tmpfs has been mounted to, or a system

    partition has been created for /tmp

    # systemctl is-enabled tmp.mount

    enabled

    34 | P a g e'
  remediation: 'Configure /etc/fstab as appropriate.

    example:

    tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0

    or

    Run the following commands to enable systemd /tmp mounting:

    systemctl unmask tmp.mount

    systemctl enable tmp.mount

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to configure the /tmp

    mount:

    [Mount]

    What=tmpfs

    Where=/tmp

    Type=tmpfs

    Options=mode=1777,strictatime,noexec,nodev,nosuid'
  checks:
  - type: command
    command: '# mount | grep /tmp'
    expected: run the following command and verify that tmpfs has been mounted to, or a system
    severity: medium
    info: 'Run the following command and verify output shows /tmp is mounted:

      # mount | grep /tmp

      tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

      run the following command and verify that tmpfs has been mounted to, or a system

      partition has been created for /tmp

      # systemctl is-enabled tmp.mount

      enabled

      34 | P a g e'
- id: 1.1.3
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The nodevmount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmpfilesystem is not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices in /tmp.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'If a /tmp partition exists run the following command and verify that the nodev option is set

    on /tmp:

    # mount | grep /tmp

    tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

    37 | P a g e'
  remediation: 'If using the /etc/fstab for configuring /tmp do the following:

    Edit the /etc/fstabfile and add nodevto the fourth field (mounting options) for the /tmp

    partition. See the fstab(5) manual page for more information.

    Run the following command to remount /tmp:

    # mount -o remount,nodev /tmp

    If using systemd tmp.mount for configuring /tmp do the following:

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount and add the nodev option

    to the Options line

    Example:

    [Mount]

    What=tmpfs

    Where=/tmp

    Type=tmpfs

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Run the following command to remount /tmp:

    # mount -o remount,nosuid /tmp

    Notes:

    If the /etc/fstab includes /tmp it will take precedence over the tmp.mount file'
  checks:
  - type: command
    command: '# mount | grep /tmp'
    expected: If a /tmp partition exists run the following command and verify that the nodev option is set
    severity: medium
    info: 'If a /tmp partition exists run the following command and verify that the nodev option is set

      on /tmp:

      # mount | grep /tmp

      tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

      37 | P a g e'
