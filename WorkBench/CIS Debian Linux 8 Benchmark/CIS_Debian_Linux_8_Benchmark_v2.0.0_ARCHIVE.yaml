    89 | P a g e'
  remediation: 'Run the following command to restore binaries to normal:

    # prelink -ua

    Run the following command to uninstall prelink:

    # apt-get remove prelink'
  checks:
  - type: manual_review
    info: 'Run the following command and verify prelink is not installed:

      # dpkg -s prelink

      89 | P a g e'
    severity: medium
