- id: 6.2.20
  title: Ensure shadow group is empty
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The shadow group allows system programs which require access the ability to read the /etc/shadow file. No users
    should be assigned to the shadow group.
  rationale: Any users assigned to the shadow group would be granted read access to the /etc/shadow file. If attackers can
    gain read access to the /etc/shadowfile, they can easily run a password cracking program against the hashed passwords
    to break them. Other security information that is stored in the /etc/shadowfile (such as expiration) could also be useful
    to subvert additional user accounts.
  impact: ''
  references: []
  page_start: 487
  audit_raw: 'Run the following commands and verify no results are returned:

    # grep ^shadow:[^:]*:[^:]*:[^:]+ /etc/group

    # awk -F: ''($4 == "<shadow-gid>") { print }'' /etc/passwd

    487 | P a g e'
  remediation: 'Remove all users from the shadow group, and change the primary group of any users with

    shadow as their primary group.'
