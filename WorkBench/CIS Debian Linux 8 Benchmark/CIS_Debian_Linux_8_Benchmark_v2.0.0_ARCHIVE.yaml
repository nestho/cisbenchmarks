- id: 6.2.18
  title: Ensure no duplicate user names exist
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Although the useraddprogram will not let you create a duplicate user name, it is possible for an administrator
    to manually edit the /etc/passwdfile and change the user name.
  rationale: If a user is assigned a duplicate user name, it will create and have access to files with the first UID for that
    username in /etc/passwd. For example, if "test4" has a UID of 1000 and a subsequent "test4" entry has a UID of 2000, logging
    in as "test4" will use UID 1000. Effectively, the UID is shared, which is a security problem.
  impact: ''
  references: []
  page_start: 483
  audit_raw: "Run the following script and verify no results are returned:\n#!/bin/bash\ncat /etc/passwd | cut -f1 -d\":\"\
    \ | sort -n | uniq -c | while read x ; do\n [ -z \"${x}\" ] && break\n set - $x\n if [ $1 -gt 1 ]; then\n uids=`awk -F:\
    \ '($1 == n) { print $3 }' n=$2 /etc/passwd | xargs`\n echo \"Duplicate User Name ($2): ${uids}\"\n fi\ndone\n483 | P\
    \ a g e"
  remediation: 'Based on the results of the audit script, establish unique user names for the users. File

    ownerships will automatically reflect the change as long as the users have unique UIDs.'
