- id: '5.8'
  title: Ensure the HTTP TRACE Method Is Disabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Use the Apache TraceEnable directive to disable the HTTP TRACE request method.
  rationale: The HTTP 1.1 protocol requires support for the TRACE request method which reflects the request back as a response
    and was intended for diagnostics purposes. The TRACE method is not needed and is easily subjected to abuse and should
    be disabled.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#traceenable
  - 2. https://www.ietf.org/rfc/rfc2616.txt
  page_start: 93
  audit_raw: 'Perform the following to determine if the recommended state is implemented:

    1. Locate the Apache configuration files and included configuration files.

    2. Verify there is a single TraceEnable directive configured with a value of off.'
  remediation: 'Perform the following to implement the recommended state:

    1. Locate the main Apache configuration file such as httpd.conf.

    2. Add a TraceEnable directive to the server level configuration with a value of off.

    Server level configuration is the top-level configuration, not nested within any other

    directives like <Directory> or <Location>.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the recommended state is implemented:

      1. Locate the Apache configuration files and included configuration files.

      2. Verify there is a single TraceEnable directive configured with a value of off.'
    severity: medium
- id: '5.9'
  title: Ensure Old HTTP Protocol Versions Are Disallowed
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The Apache modules mod_rewrite or mod_security can be used to disallow old and invalid HTTP protocols versions.
    The HTTP version 1.1 RFC is dated June 1999 and has been supported by Apache since version 1.2. It should no longer be
    necessary to allow ancient versions of HTTP such as 1.0 and prior.
  rationale: Many malicious automated programs, vulnerability scanners and fingerprinting tools will send abnormal HTTP protocol
    versions to see how the web server responds. These requests are usually part of the attacker's enumeration process and
    therefore it is important that we respond by denying these requests.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_rewrite.html
  page_start: 95
  audit_raw: 'Perform the following to determine if the recommended state is implemented:

    1. Locate the Apache configuration files and included configuration files.

    2. Verify there is a rewrite condition within the global server context that disallows

    requests that do not include the HTTP/1.1 header as shown below.

    RewriteEngine On

    RewriteCond %{THE_REQUEST} !HTTP/1\.1$

    RewriteRule .* - [F]

    3. Verify the following directives are included in each section so that the main server

    settings will be inherited.

    RewriteEngine On

    RewriteOptions Inherit'
  remediation: 'Perform the following to implement the recommended state:

    1. Load the mod_rewrite module for Apache by doing either one of the following:

    95 | Page

    o Build Apache with mod_rewrite statically loaded during the build, by adding

    the --enable-rewrite option to the ./configure script.

    ./configure --enable-rewrite.

    o Or, dynamically loading the module with the LoadModule directive in the

    httpd.conf configuration file.

    LoadModule rewrite_module modules/mod_rewrite.so

    2. Locate the main Apache configuration file such as httpd.conf and add the following

    rewrite condition to match HTTP/1.1 and the rewrite rule to the global server level

    configuration to disallow other protocol versions.

    RewriteEngine On

    RewriteCond %{THE_REQUEST} !HTTP/1\.1$

    RewriteRule .* - [F]

    3. By default, mod_rewrite configuration settings from the main server context are not

    inherited by virtual hosts. Therefore, it is also necessary to add the following

    directives in each section to inherit the main server settings.

    RewriteEngine On

    RewriteOptions Inherit'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the recommended state is implemented:

      1. Locate the Apache configuration files and included configuration files.

      2. Verify there is a rewrite condition within the global server context that disallows

      requests that do not include the HTTP/1.1 header as shown below.

      RewriteEngine On

      RewriteCond %{THE_REQUEST} !HTTP/1\.1$

      RewriteRule .* - [F]

      3. Verify the following directives are included in each section so that the main server

      settings will be inherited.

      Rewr'
    severity: medium
- id: '5.10'
  title: Ensure Access to .ht* Files Is Restricted
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Restrict access to any files beginning with .ht using the FilesMatch directive.
  rationale: The default name for access filename which allows files in web directories to override the Apache configuration
    is .htaccess. The usage of access files should not be allowed, but as a defense in depth a FilesMatch directive is recommended
    to prevent web clients from viewing those files in case they are created. Also a common name for web password and group
    files are .htpasswd and .htgroup. Neither of these files should be placed in the document root, but, in the event they
    are, the FilesMatch directive can be used to prevent them from being viewed by web clients.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#filesmatch
  page_start: 97
  audit_raw: "Perform the following steps to determine if the recommended state is implemented:\nVerify that a FilesMatch\
    \ directive similar to the one below is present in the apache\nconfiguration and not commented out. The deprecated Deny\
    \ from All directive may be\nused instead of the Require directive.\n<FilesMatch \"^\\.ht\">\n Require all denied\n</FilesMatch>"
  remediation: "Perform the following to implement the recommended state:\nAdd or modify the following lines in the Apache\
    \ configuration file at the server\nconfiguration level.\n<FilesMatch \"^\\.ht\">\n Require all denied\n</FilesMatch>\n\
    97 | Page"
  checks:
  - type: manual_review
    info: "Perform the following steps to determine if the recommended state is implemented:\nVerify that a FilesMatch directive\
      \ similar to the one below is present in the apache\nconfiguration and not commented out. The deprecated Deny from All\
      \ directive may be\nused instead of the Require directive.\n<FilesMatch \"^\\.ht\">\n Require all denied\n</FilesMatch>"
    severity: medium
- id: '5.11'
  title: Ensure Access to Inappropriate File Extensions Is Restricted
  scoring: scored
  profile:
  - Level 2
  description: Restrict access to inappropriate file extensions that are not expected to be a legitimate part of web sites
    using the FilesMatch directive.
  rationale: There are many files that are often left within the web server document root that could provide an attacker with
    sensitive information. Most often these files are mistakenly left behind after installation, trouble-shooting, or backing
    up files before editing. Regardless of the reason for their creation, these files can still be served by Apache even when
    there is no hyperlink pointing to them. The web administrators should use the FilesMatch directive to restrict access
    to only those file extensions that are appropriate for the web server. Rather than create a list of potentially inappropriate
    file extensions such as .bak, .config, .old, etc, it is recommended instead that a white list of the appropriate and expected
    file extensions for the web server be created, reviewed and restricted with a FilesMatch directive.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#filesmatch
  page_start: 99
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify that the FilesMatch directive that denies access to all files is present as

    shown in step 3 of the remediation.

    2. Verify that there is another FilesMatch directive similar to the one in step 4 of the

    remediation, with an expression that matches the approved file extensions.'
  remediation: "Perform the following to implement the recommended state:\n1. Compile a list of existing file extension on\
    \ the web server. The following find/awk\ncommand may be useful, but is likely to need some customization according to\
    \ the\nappropriate webroot directories for your web server. Please note that the find\ncommand skips over any files without\
    \ a dot (.) in the file name, as these are not\nexpected to be appropriate web content.\n99 | Page\nfind */htdocs -type\
    \ f -name '*.*' | awk -F. '{print $NF }' | sort -u\n2. Review the list of existing file extensions, for appropriate content\
    \ for the web\nserver, remove those that are inappropriate and add any additional file extensions\nexpected to be added\
    \ to the web server in the near future.\n3. Add the FilesMatch directive below which denies access to all files by default.\n\
    # Block all files by default, unless specifically allowed.\n<FilesMatch \"^.*$\">\n Require all denied\n</FilesMatch>\n\
    4. Add another a FilesMatch directive that allows access to those file extensions\nspecifically allowed from the review\
    \ process in step 2. An example FilesMatch\ndirective is below. The file extensions in the regular expression should match\
    \ your\napproved list, and not necessarily the expression below.\n# Allow files with specifically approved file extensions\n\
    # Such as (css, htm; html; js; pdf; txt; xml; xsl; ...),\n# images (gif; ico; jpeg; jpg; png; ...), multimedia\n<FilesMatch\
    \ \"^.*\\.(css|html?|js|pdf|txt|xml|xsl|gif|ico|jpe?g|png)$\">\n Require all granted\n</FilesMatch>"
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify that the FilesMatch directive that denies access to all files is present as

      shown in step 3 of the remediation.

      2. Verify that there is another FilesMatch directive similar to the one in step 4 of the

      remediation, with an expression that matches the approved file extensions.'
    severity: medium
- id: '5.12'
  title: Ensure IP Address Based Requests Are Disallowed
  scoring: scored
  profile:
  - Level 2
  description: The Apache module mod_rewrite can be used to disallow access for requests that use an IP address instead of
    a host name for the URL. Most normal access to the website from browsers and automated software will use a host name which
    will therefore include the host name in the HTTP HOST header.
  rationale: A common malware propagation and automated network scanning technique is to use IP addresses rather than host
    names for web requests, since it's much simpler to automate. By denying IP based web requests, these automated techniques
    will be denied access to the website. Of course, malicious web scanning techniques continue to evolve, and many are now
    using hostnames, however denying access to the IP based requests is still a worthwhile defense.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_rewrite.html
  page_start: 101
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Locate the Apache configuration files and included configuration files.

    2. Verify there is a rewrite condition within the global server context that disallows IP

    based requests by requiring a HTTP HOST header similar to the example shown

    below.

    RewriteCond %{HTTP_HOST} !^www\.example\.com [NC]

    RewriteCond %{REQUEST_URI} !^/error [NC]

    RewriteRule ^.(.*) - [L,F]'
  remediation: 'Perform the following to implement the recommended state:

    1. Load the mod_rewrite module for Apache by doing either one of the following:

    o Build Apache with mod_rewrite statically loaded during the build, by adding

    the --enable-rewrite option to the ./configure script.

    ./configure --enable-rewrite

    101 | Page

    o Or, dynamically loading the module with the LoadModule directive in the

    httpd.conf configuration file.

    LoadModule rewrite_module modules/mod_rewrite.so

    2. Add the RewriteEngine directive to the configuration within the global server

    context with the value of on so that the rewrite engine is enabled.

    RewriteEngine On

    3. Locate the Apache configuration file such as httpd.conf and add the following

    rewrite condition to match the expected host name of the top server level

    configuration.

    RewriteCond %{HTTP_HOST} !^www\.example\.com [NC]

    RewriteCond %{REQUEST_URI} !^/error [NC]

    RewriteRule ^.(.*) - [L,F]'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Locate the Apache configuration files and included configuration files.

      2. Verify there is a rewrite condition within the global server context that disallows IP

      based requests by requiring a HTTP HOST header similar to the example shown

      below.

      RewriteCond %{HTTP_HOST} !^www\.example\.com [NC]

      RewriteCond %{REQUEST_URI} !^/error [NC]

      RewriteRule ^.(.*) - [L,F]'
    severity: medium
- id: '5.13'
  title: Ensure the IP Addresses for Listening for Requests Are Specified
  scoring: scored
  profile:
  - Level 2
  description: The Apache Listen directive specifies the IP addresses and port numbers the Apache web server will listen for
    requests. Rather than be unrestricted to listen on all IP addresses available to the system, the specific IP address or
    addresses intended should be explicitly specified. Specifically, a Listen directive with no IP address specified, or with
    an IP address of zeros should not be used.
  rationale: Having multiple interfaces on web servers is fairly common, and without explicit Listen directives, the web server
    is likely to be listening on an inappropriate IP address / interface that was not intended for the web server. Single
    homed system with a single IP addressed are also required to have an explicit IP address in the Listen directive, in case
    additional interfaces are added to the system at a later date.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mpm_common.html#listen
  page_start: 103
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Verify that no Listen directives are in the Apache configuration file with no IP address

    specified, or with an IP address of all zeros.'
  remediation: 'Perform the following to implement the recommended state:

    1. Find any Listen directives in the Apache configuration file with no IP address

    specified, or with an IP address of all zeros similar to the examples below. Keep in

    mind there may be both IPv4 and IPv6 addresses on the system.

    Listen 80

    Listen 0.0.0.0:80

    Listen [::ffff:0.0.0.0]:80

    2. Modify the Listen directives in the Apache configuration file to have explicit IP

    addresses according to the intended usage. Multiple Listendirectives may be

    specified for each IP address & Port.

    103 | Page

    Listen 10.1.2.3:80

    Listen 192.168.4.5:80

    Listen [2001:db8::a00:20ff:fea7:ccea]:80'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Verify that no Listen directives are in the Apache configuration file with no IP address

      specified, or with an IP address of all zeros.'
    severity: medium
- id: '5.14'
  title: Ensure Browser Framing Is Restricted
  scoring: scored
  profile:
  - Level 2
  description: To prevent Clickjacking or UI Redressing attacks, it’s important for the server to include an HTTP header which
    instructs browsers to restrict the content from being framed. There are two headers that may be used. The Content-Security-Policy
    header, or the X-Frame-Options header. The Header directive allows server HTTP response headers to be added, replaced
    or merged. We will use the directive to add a server HTTP response header to tell browsers to restrict all of the web
    pages from being framed by other web sites.
  rationale: Using iframes and regular web frames to embed malicious content along with expected web content has been a favored
    attack vector for attacking web clients for a long time. This can happen when the attacker lures the victim to a malicious
    web site, which uses frames to include the expected content from the legitimate site. The attack can also be performed
    via XSS (either reflected, DOM or stored XSS) to add the malicious content to the legitimate web site. To combat this
    attack vector, either an X-Frame-Options response header or a ContentSecurity-Policy response header may be used. The
    Content-Security-Policy header is the preferred solution. The X-Frame-Options header should have a value of either DENY,
    which prevents all framing, or SAMEORIGIN which prevents framing except via pages which share the same origin. The Content-Security-Policy
    header may also be to restrict framing with a frame-ancestors directive and a value of none or self
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_headers.html#header
  - 2. https://owasp.org/www-project-cheatsheets/cheatsheets/Content_Security_Policy_Cheat_Sheet
  page_start: 105
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    • Ensure a Header directive for Content-Security-Policy is present in the Apache

    configuration and has the condition always, an action of set or append and a

    directive of frame-ancestors with a value of none or self, as shown below:

    # grep -i Content-Security-Policy $APACHE_PREFIX/conf/httpd.conf

    Header always append ''Content-Security-Policy frame-ancestors self''

    105 | Page

    • If no Content-Security-Policy header is found, check if a header directive for X-FrameOptions is present in the Apache
    configuration and has the condition always, an

    action of set or append and a value of SAMEORIGIN or DENY, as shown below:

    # grep -i X-Frame-Options $APACHE_PREFIX/conf/httpd.conf

    Header always set X-Frame-Options SAMEORIGIN

    If either header configuration is present and has as a compliant value, then the server is

    compliant.'
  remediation: 'Perform the following to implement the recommended state:

    Add or modify the Header directive for the Content-Security-Policy header in the Apache

    configuration to have the condition always, an action of append and a value of frameancestors self, as shown below.

    Header always append ''Content-Security-Policy frame-ancestors self'''
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      • Ensure a Header directive for Content-Security-Policy is present in the Apache

      configuration and has the condition always, an action of set or append and a

      directive of frame-ancestors with a value of none or self, as shown below:

      # grep -i Content-Security-Policy $APACHE_PREFIX/conf/httpd.conf

      Header always append ''Content-Security-Policy frame-ancestors self''

      105 | Page

      • If no Content-Security-Policy header is'
    severity: medium
- id: '6.1'
  title: Ensure the Error Log Filename and Severity Level Are Configured Correctly
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The LogLevel directive is used to configure the severity level for the error logs. While the ErrorLog directive
    configures the error log file name. The log level values are the standard syslog levels of emerg, alert, crit, error,
    warn, notice, info and debug. The recommended level is notice for most modules, so that all errors from the emerg level
    through notice level will be logged. The recommended setting for the core module is info so that any not found requests
    will be included in the error logs.
  rationale: The server error logs are invaluable because they can also be used to spot any potential problems before they
    become serious. Most importantly, they can be used to watch for anomalous behavior such as a lot of not found or unauthorized
    errors may be an indication that an attack is pending or has occurred. Starting with Apache 2.4 the error log does not
    include the not found errors except at the info logging level. Therefore, it is important that the log level be set to
    info for the core module. The not found requests need to be included in the error log for both forensics' investigation
    and host intrusion detection purposes. Monitoring the access logs may not be practical for many web servers with high
    volume traffic.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/logs.html
  - 2. https://httpd.apache.org/docs/2.4/mod/core.html#loglevel
  page_start: 107
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify the LogLevel in the Apache server configuration has a value of info or lower

    for the core module and notice or lower for other modules. Note that it is also

    compliant to have a value of info or debug if there is a need for a more verbose log

    107 | Page

    and the storage and monitoring processes are capable of handling the extra load.

    The recommended value is notice core:info.

    2. Verify the ErrorLog directive is configured to an appropriate log file or syslog

    facility.

    3. Verify there is a similar ErrorLog directive for each virtual host configured if the

    virtual host will have different people responsible for the web site.'
  remediation: 'Perform the following to implement the recommended state:

    1. Add or modify the LogLevel in the Apache configuration to have a value of info or

    lower for the core module and notice or lower for all other modules. Note that is it

    is compliant to have a value of info or debug if there is a need for a more verbose log

    and the storage and monitoring processes are capable of handling the extra load.

    The recommended value is notice core:info.

    LogLevel notice core:info

    2. Add an ErrorLog directive if not already configured. The file path may be relative or

    absolute, or the logs may be configured to be sent to a syslog server.

    ErrorLog "logs/error_log"

    3. Add a similar ErrorLog directive for each virtual host configured if the virtual host

    will have different people responsible for the web site. Each responsible individual

    or organization needs access to their own web logs and needs the

    skills/training/tools for monitoring the logs.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify the LogLevel in the Apache server configuration has a value of info or lower

      for the core module and notice or lower for other modules. Note that it is also

      compliant to have a value of info or debug if there is a need for a more verbose log

      107 | Page

      and the storage and monitoring processes are capable of handling the extra load.

      The recommended value is notice core:info.

      2. Verify the ErrorLog directiv'
    severity: medium
- id: '6.2'
  title: Ensure a Syslog Facility Is Configured for Error Logging
  scoring: scored
  profile:
  - Level 2
  description: The ErrorLog directive should be configured to send logs to a syslog facility so that the logs can be processed
    and monitored along with the system logs.
  rationale: It is easy for the web server error logs to be overlooked in the log monitoring process, and yet the application
    level attacks have become the most common and are extremely important for detecting attacks early, as well as detecting
    non-malicious problems such as a broken link, or internal errors. By including the Apache error logs with the system logging
    facility, the application logs are more likely to be included in the established log monitoring process.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/logs.html
  - 2. https://httpd.apache.org/docs/2.4/mod/core.html#loglevel
  page_start: 110
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify that the ErrorLog in the Apache server configuration has a value of

    syslog:facility where facility can be any of the syslog facility values such as

    local1.

    2. Verify there is a similar ErrorLog directive which is either configured or inherited

    for each virtual host.'
  remediation: 'Perform the following to implement the recommended state:

    1. Add an ErrorLog directive if not already configured. Any appropriate syslog facility

    may be used in place of local1.

    ErrorLog "syslog:local1"

    2. Add a similar ErrorLog directive for each virtual host if necessary.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify that the ErrorLog in the Apache server configuration has a value of

      syslog:facility where facility can be any of the syslog facility values such as

      local1.

      2. Verify there is a similar ErrorLog directive which is either configured or inherited

      for each virtual host.'
    severity: medium
- id: '6.3'
  title: Ensure the Server Access Log Is Configured Correctly
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The LogFormat directive defines a nickname for a log format and information to be included in the access log
    entries. The CustomLog directive specifies the log file, syslog facility or piped logging utility.
  rationale: The server access logs are also invaluable for a variety of reasons. They can be used to determine what resources
    are being used most. Most importantly, they can be used to investigate anomalous behavior that may be an indication that
    an attack is pending or has occurred. If the server only logs errors, and does not log successful access, then it is very
    difficult to investigate incidents. You may see that the errors stop, and wonder if the attacker gave up, or was the attack
    successful.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_log_config.html#customlog
  - 2. https://httpd.apache.org/docs/2.4/mod/mod_log_config.html#formats
  page_start: 112
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify the CustomLog directive is configured to an appropriate log file, syslog facility,

    or piped logging utility and the directive uses a log format that includes all of the

    format string tokens listed below. The log format string may be specified as a

    LogFormat nickname or as an explicit string. For example, either of the following

    two configurations are compliant:

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{Useragent}i\"" combined

    CustomLog log/access_log combined

    CustomLog log/access_log "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\"

    \"%{User- agent}i\""

    The log format string should include the following tokens in any order. The portion "

    = description text. " describes the information to be logged.

    o %h = Remote hostname or IP address if HostnameLookups is set to Off, which

    is the default.

    112 | Page

    o %l =Remote logname / identity.

    o %u =Remote user, if the request was authenticated.

    o %t = Time the request was received,

    o %r = First line of request.

    o %>s = Final status.

    o %b = Size of response in bytes.

    o %{Referer}i = Variable value for Referer header.

    o %{User-agent}i = Variable value for User Agent header.

    2. Verify there is a similar CustomLog directives for each virtual host configured if the

