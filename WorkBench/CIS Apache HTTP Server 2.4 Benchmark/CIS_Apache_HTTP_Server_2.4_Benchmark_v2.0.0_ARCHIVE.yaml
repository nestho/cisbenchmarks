    policies. AppArmor can enforce rules on programs for file access and network connections and restrict actions based on
    defined policies.
  rationale: Web applications and web services continue to be one of the leading attack vectors for black-hat criminals to
    gain access to information and servers. The threat is high because web servers are often externally accessible and typically
    have the greatest share of serverside vulnerabilities. The AppArmor mandatory access controls provide a much stronger
    security model which can be used to implement a deny-by-default model which only allows what is explicitly permitted.
  impact: ''
  references:
  - 1. https://help.ubuntu.com/community/AppArmor
