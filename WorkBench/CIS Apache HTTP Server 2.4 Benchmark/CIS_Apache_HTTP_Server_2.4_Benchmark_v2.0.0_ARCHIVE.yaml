    severity: medium
- id: '9.1'
  title: Ensure the TimeOut Is Set to 10 or Less
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Denial of Service (DoS) is an attack technique with the intent of preventing a web site from serving normal
    user activity. DoS attacks, which are normally applied to the network layer, are also possible at the application layer.
    These malicious attacks can succeed by starving a system of critical resources, vulnerability exploit, or abuse of functionality.
    Although there is no 100% solution for preventing DoS attacks, the following recommendation uses the Timeout directive
    to mitigate some of the risk, by requiring more effort for a successful DoS attack. Of course, DoS attacks can happen
    in rather unintentional ways as well as intentional and these directives will help in many of those situations as well.
  rationale: One common technique for DoS is to initiate many connections to the server. By decreasing the timeout for old
    connections and we allow the server to free up resources more quickly and be more responsive. By making the server more
    efficient, it will be more resilient to DoS conditions. The Timeout directive affects several timeout values for Apache,
    so review the Apache document carefully. http://httpd.apache.org/docs/2.4/mod/core.html#timeout
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#timeout
  page_start: 170
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Verify that the Timeout directive is specified in the Apache configuration files to have a

    value of 10 seconds or shorter.

    170 | Page'
  remediation: 'Perform the following to implement the recommended state:

    Add or modify the Timeout directive in the Apache configuration to have a value of 10

    seconds or shorter.

    Timeout 10'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Verify that the Timeout directive is specified in the Apache configuration files to have a

      value of 10 seconds or shorter.

      170 | Page'
    severity: medium
- id: '9.2'
  title: Ensure KeepAlive Is Enabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The KeepAlive directive controls whether Apache will reuse the same TCP connection per client to process subsequent
    HTTP requests from that client. It is recommended that the KeepAlive directive be set to On.
  rationale: Allowing per-client reuse of TCP sockets reduces the amount of system and network resources required to serve
    requests. This efficiency gain may improve a server's resiliency to DoS attacks.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#keepalive
  page_start: 172
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

