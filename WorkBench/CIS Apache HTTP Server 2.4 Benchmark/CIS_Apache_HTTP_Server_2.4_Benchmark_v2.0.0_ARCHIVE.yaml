    For the server and all virtual host and directory configurations verify that either

    1. The FileETag directive is not present, or

    2. The configured FileETag value does not contain any of the values all or inode or

    +inode.'
  remediation: 'Perform the following to implement the recommended state:

    Remove all instances of the FileETag directive. Alternatively, add or modify the FileETag

    directive in the server and each virtual host configuration to have either the value None or

    MTime Size.'
