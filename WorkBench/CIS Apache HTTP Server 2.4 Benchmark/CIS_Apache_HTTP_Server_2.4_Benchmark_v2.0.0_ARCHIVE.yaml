- id: '7.9'
  title: Ensure All Web Content is Accessed via HTTPS
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: All of the website content should be served via HTTPS rather than HTTP. A redirect from the HTTP website to
    the HTTPS content is often useful and is recommended, but all significant content should be accessed via HTTPS so that
    it is authenticated and encrypted.
  rationale: The usage of clear text HTTP prevents the client browser from authenticating the connection and ensuring the
    integrity of the website information. Without the HTTPS authentication, a client may be subjected to a variety of man-in-the-middle
    and spoofing attacks which would cause them to receive modified web content which could harm the organization’s reputation.
    Through DNS attacks or malicious redirects, the client could arrive at a malicious website instead of the intended website.
    The malicious website could deliver malware, request credentials, or deliver false information.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html
  page_start: 150
  audit_raw: "Perform the following to determine if the recommended state is implemented:\n• Gather the list of listening\
    \ IP addresses from the Apache configuration files. The\ncommands below may be used to extract the relevant IP addresses\
    \ from the\nconfiguration files. The CONF_DIRS variable needs to be set to the list of directories\nthat contain all of\
    \ the Apache configuration files.\n## Replace the following directory list with the appropriate list.\nCONF_DIRS=”/etc/httpd/conf\
    \ /etc/httpd/conf.d /etc/httpd/conf_dir2 . . .\n“\nCONFS=$(find $CONF_DIRS -type f -name '*.conf' )\n## Search for Listen\
    \ directives that are not port :443 or https\nIPS=$(egrep -ih '^\\s*Listen ' $CONFS | egrep -iv '(:443\\b)|https' | cut\n\
    -d' ' -f2)\n• Gather the list of virtual host names from the Apache configuration files. The\ncommands below can be used\
    \ to extract the relevant virtual host names from the\nconfiguration files listed in $CONFS. The resulting list will include\
    \ all virtual hosts not\nrunning on port :443. Although some listed virtual hosts may be TLS enabled, but on\n150 | Page\n\
    a non-standard port. Such websites will return an error rather than HTML content,\nas shown in the final steps.\n## Get\
    \ host names and ports of all of the virtual hosts\nVHOSTS=$(egrep -iho '^\\s*<VirtualHost .*>' $CONFS | egrep -io '\\\
    s+[AZ:.0-9]+>$' | \\\n tr -d ' >')\n• For each of the IP address and virtual hosts name, prefix the IP address or host\n\
    name with the http:// protocol, and add the final slash as well.\nURLS=$(for h in $LIPADDR $VHOSTS ; do echo \"http://$h/\"\
    ; done)\n• Check to ensure each URL does not deliver significate web content via the HTTP\nprotocol. The URL’s may be\
    \ manually entered in a browser for testing, or may be\nscripted with a command line web client such as curl, as shown\
    \ below.\n## For each of the URL’s test with curl, and truncate the output to 300\ncharacters\nfor u in $URLS ; do echo\
    \ -e \"\\n\\n\\n=== $u ===\"; curl -fSs $u | head -c\n300 ; done\nAny URLs which return significant HTML document content,\
