- id: '8.4'
  title: Ensure ETag Response Header Fields Do Not Include Inodes
  scoring: scored
  profile:
  - Level 2
  description: The FileETag directive configures the file attributes that are used to create the ETag (entity tag) response
    header field when the document is based on a static file. The ETag value is used in cache management to save network bandwidth.
    The value returned may be based on combinations of the file inode, the modification time, and the file size.
  rationale: When the FileETag is configured to include the file inode number, remote attackers may be able to discern the
    inode number from returned values. The inode is considered sensitive information, as it could be useful in assisting in
    other attacks.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/core.html#FileETag
  - 2. https://nvd.nist.gov/vuln/detail/CVE-2003-1418
  page_start: 168
