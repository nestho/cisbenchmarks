    not present. If the directive is not present the default value is On.'
  remediation: 'Perform the following to implement the recommended state:

    Add or modify the KeepAlive directive in the Apache configuration to have a value of On, so

    that KeepAlive connections are enabled.

    KeepAlive On'
  checks:
