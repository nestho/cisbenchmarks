    three supported cache types, any of them are considered compliant.

    • Verify the SSLUseStapling directive is enabled with a value of on'
  remediation: 'Perform the following to implement the recommended state:

    Add or modify the SSLUseStapling directive to have a value of on in the Apache server

    153 | Page

    level configuration and every virtual host that is SSL enabled. Also ensure that

    SSLStaplingCache is set to one of the three cache types similar to the examples below.

    SSLUseStapling On

    SSLStaplingCache "shmcb:logs/ssl_staple_cache(512000)"

    - orSSLStaplingCache "dbm:logs/ssl_staple_cache.db"

    - or -

    SSLStaplingCache dc:UNIX:logs/ssl_staple_socket'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented. At the

      Apache server level configuration and for every virtual host that is SSL enabled:

      • Verify the SSLStaplingCache directive is present and not commented out. There are

      three supported cache types, any of them are considered compliant.

      • Verify the SSLUseStapling directive is enabled with a value of on'
    severity: medium
- id: '7.11'
  title: Ensure HTTP Strict Transport Security Is Enabled
  scoring: scored
  profile:
  - Level 2
  description: HTTP Strict Transport Security (HSTS) is an optional web server security policy mechanism specified by an HTTP
    Server header. The HSTS header allows a server declaration that only HTTPS communication should be used rather than clear
    text HTTP communication.
  rationale: Usage of HTTP Strict Transport Security (HSTS) helps protect HSTS compliant browsers and other agents from HTTP
    downgrade attacks. Downgrade attacks include a variety of man-in-the-middle attacks which leave the web communication
    vulnerable to disclosure and modification by forcing the usage of HTTP rather than HTTPS communication. The sslstrip attack
    tool by Moxie Marlinspike released in 2009 is one such attack, which works when the server allows both HTTP and HTTPS
    communication. However, a man-inthe-middle HTTP-to-HTTPS proxy would be effective in cases where the server required HTTPS,
    but did not publish an HSTS policy to the browser. This attack would also be effective on browsers which were not compliant
    with HSTS. All current up-to-date browsers support HSTS. The HSTS header specifies a length of time in seconds that the
    browser/user agent should access the server only using HTTPS. The header may also specify if all sub-domains should also
    be included in the same policy. Once a compliant browser receives the HSTS Header it will not allow access to the server
    via HTTP. Therefore, it is important that you ensure that there is no portion of the web site or web application that
    requires HTTP prior to enabling the HSTS protocol. If all sub-domains are to be included via the includeSubDomains option,
    then carefully consider all various host names, web applications and third-party services used to include any DNS CNAME
    values that may be impacted. An overly broad includeSubDomains policy will disable access to HTTP web sites for all websites
    with the same domain name. Also consider that the access will be disabled for the number of seconds given in the max-age
    value, so in the event a mistake is made, a large value, such as a year, could create significant support issues. An optional
    flag of preload may be added if the web site name is to be submitted to be preloaded in Chrome, Firefox and Safari browsers.
    See https://hstspreload.appspot.com/ for details. 155 | Page
  impact: ''
  references:
  - 1. https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
  - 2. https://www.owasp.org/index.php/HTTP_Strict_Transport_Security
  page_start: 155
