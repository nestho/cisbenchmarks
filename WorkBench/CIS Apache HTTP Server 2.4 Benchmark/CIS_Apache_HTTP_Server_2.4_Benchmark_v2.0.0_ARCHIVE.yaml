- id: '3.7'
  title: Ensure the Core Dump Directory Is Secured
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The CoreDumpDirectory directive is used to specify the directory Apache attempts to switch to before creating
    the core dump. Core dumps will be disabled if the directory is not writable by the Apache user. Also, core dumps will
    be disabled if the server is started as root and switches to a non-root user, as is typical. It is recommended that the
    CoreDumpDirectory directive be set to a directory that is owned by the root user, owned by the group the Apache HTTPD
    process executes as, and be inaccessible to other users.
  rationale: Core dumps are snapshots of memory and may contain sensitive information that should not be accessible by other
    accounts on the system.
  impact: ''
  references:
