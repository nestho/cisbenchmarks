- id: '8.3'
  title: Ensure All Default Apache Content Is Removed
  scoring: scored
  profile:
  - Level 2
  description: In previous recommendations, we have removed default content such as the Apache manuals and default CGI programs.
    However, if you want to further restrict information leakage about the web server, it is important that default content
    such as icons are not left on the web server.
  rationale: To identify the type of web servers and versions software installed it is common for attackers to scan for icons
    or special content specific to the server type and version. A simple request like http://example.com/icons/apache_pb2.png
    may tell the attacker that the server is Apache 2.4. Many icons are used primarily for auto indexing, which is also recommended
    to be disabled.
  impact: ''
  references: []
  page_start: 166
  audit_raw: 'Perform the following step to determine if the recommended state is implemented:

    Verify that there is no alias or directory access to the Apache icons directory in any of the

    Apache configuration files.'
  remediation: 'Perform either of the following to implement the recommended state:

    1. The default source build places the auto-index and icon configurations in the

    extra/httpd-autoindex.conf file, so it can be disabled by leaving the include line

    commented out in the main httpd.conffile as shown below.

    # Fancy directory listings

    #Include conf/extra/httpd-autoindex.conf

    2. Alternatively, the icon alias directive and the directory access control configuration

    can be commented out as shown if present:

    # We include the /icons/ alias for FancyIndexed directory listings. If

    # you do not use FancyIndexing, you may comment this out.

