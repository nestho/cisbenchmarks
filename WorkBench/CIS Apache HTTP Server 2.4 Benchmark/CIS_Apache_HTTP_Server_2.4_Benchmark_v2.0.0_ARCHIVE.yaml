    Last-Modified: Mon, 19 Jun 2006 14:47:16 GMT

    ETag: "152-41694d7a92500"

    Accept-Ranges: bytes

    Content-Length: 438

    Connection: close

    Content-Type: text/html'
  remediation: 'Perform the following to implement the recommended state:

