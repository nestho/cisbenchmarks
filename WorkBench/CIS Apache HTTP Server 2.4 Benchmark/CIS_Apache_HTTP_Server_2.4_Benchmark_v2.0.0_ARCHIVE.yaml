- id: '7.4'
  title: Ensure the TLSv1.0 and TLSv1.1 Protocols are Disabled
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: The TLSv1.0 and TLSv1.1 protocols should be disabled via the SSLProtocol directive. The TLSv1.0 protocol is
    vulnerable to information disclosure and both protocols lack support for modern cryptographic algorithms including authenticated
    encryption. The only SSL/TLS protocols that should be allowed is TLSv1.2 along with the newer TLSv1.3 protocol.
  rationale: The TLSv1.0 protocol is vulnerable to the BEAST attack when used in CBC mode (October 2011). Unfortunately, the
    TLSv1.0 uses CBC modes for all of the block mode ciphers, which only leaves the RC4 streaming cipher which is also weak
    and is not recommended. Therefore, it is recommended that the TLSv1.0 protocol be disabled. The TLSv1.1 protocol does
    not support Authenticated Encryption with Associated Data (AEAD) which is designed to simultaneously provide confidentiality,
    integrity, and authenticity. All major up-to-date browsers support TLSv1.2, and most recent versions of FireFox and Chrome
    support the newer TLSv1.3 protocol, since 2017. The NIST SP 800-52r2 guidelines for TLS configuration require that TLS
    1.2 is configured with FIPS-based cipher suites be supported by all government TLS servers and clients and requires support
    of TLS 1.3 by January 1, 2024. A September 2018 IETF draft also depreciates the usage of TLSv1.0 and TLSv1.1 as shown
    in the references. As of March 2020 all major browsers will no longer support TLS 1.0 or TLS 1.1.
  impact: ''
  references:
  - 1. https://www.godaddy.com/garage/browser-support-tls-10-11/
  - 2. https://caniuse.com/#search=tls%201.2
  page_start: 138
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Search the Apache configuration files for the SSLProtocol directive and ensure it matches

    one of the values below.

    SSLProtocol TLSv1.2 TLSv1.3

    SSLProtocol TLSv1.2

    138 | Page'
  remediation: 'Perform the following to implement the recommended state:

    1. Check if the TLSv1.3 protocol is supported by the Apache server by either checking

    that the version of OpenSSL is 1.1.1 or later or place the TLSv1.3 value in the

    SSLProtocol string of a configuration file and check the syntax with the ‘httpd -t’

    command before using the file in production. Two examples below are shown of

    servers that do support the TLSv1.3 protocol.

    $ openssl version

    OpenSSL 1.1.1a 20 Nov 2018

    ### _(Add TLSv1.3 to the SSLProtocol directive)_

    # httpd -t

    Syntax OK

    2. Search the Apache configuration files for the SSLProtocol directive; add the

    directive, if not present, or change the value to TLSv1.2 or TLSv1.2 TLSv1.3 if the

    TLSv1.3 protocol is supported.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Search the Apache configuration files for the SSLProtocol directive and ensure it matches

      one of the values below.

      SSLProtocol TLSv1.2 TLSv1.3

      SSLProtocol TLSv1.2

      138 | Page'
    severity: medium
- id: '7.5'
  title: Ensure Weak SSL/TLS Ciphers Are Disabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Disable weak SSL ciphers using the SSLCipherSuite, and SSLHonorCipherOrder directives. The SSLCipherSuite directive
    specifies which ciphers are allowed in the negotiation with the client. While the SSLHonorCipherOrder causes the server's
    preferred ciphers to be used instead of the clients' specified preferences.
  rationale: The SSL/TLS protocols support a large number of encryption ciphers including many weak ciphers that are subject
    to man-in-the middle attacks and information disclosure. Some implementations even support the NULL cipher which allows
    a TLS connection without any encryption! Therefore, it is critical to ensure the configuration only allows strong ciphers
    greater than or equal to 128-bit to be negotiated with the client. Stronger 256-bit ciphers should be allowed and preferred.
    In addition, enabling the SSLHonorCipherOrder further protects the client from man-in-the-middle downgrade attacks by
    ensuring the server's preferred ciphers will be used rather than the clients' preferences. In addition, the RC4 stream
    ciphers should be disabled, even though they are widely used and have been recommended in previous Apache benchmarks as
    a means of mitigating attacks based on CBC cipher vulnerabilities. The RC4 ciphers have known cryptographic weaknesses
    and are no longer recommended. The IETF has published RFC 7465 standard [2] that would disallow RC4 negotiation for all
    TLS versions. While the document is somewhat new (Feb 2015) it is expected the RC4 cipher suites will begin to disappear
    from options in TLS deployments. In the meantime, it is important to ensure that RC4-based cipher suites are disabled
    in the configuration.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslciphersuite
  - 2. https://www.ssllabs.com/
  page_start: 140
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    The SSL protocols and ciphers supported can be easily tested by connecting to a running

    web server with an up-to-date version of the sslscan tool. The tool is available on Kali Linux

    https://www.kali.org/, or via github https://github.com/rbsec/sslscan The tool will color

    highlight the following weak ciphers.

    140 | Page

    • Red Background NULL cipher (no encryption)

    • Red Broken cipher (<= 40 bit), broken protocol (SSLv2 or SSLv3)

    • Yellow Weak cipher (<= 56 bit or RC4)

    • Purple Anonymous cipher (ADH or AECDH)

    Alternatively, the Qualys SSL Labs has a website that may be used for testing external

    servers. https://www.ssllabs.com/

    Alternatively, verify the SSLCipherSuite directive is present and has the following values

    to disable weak ciphers in the Apache server level configuration and every virtual host that

    is SSL/TLS enabled.

    SSLHonorCipherOrder On

    SSLCipherSuite ALL:!EXP:!NULL:!LOW:!SSLv2:!RC4:!aNULL'
  remediation: 'Perform the following to implement the recommended state:

    Ensure the SSLCipherSuite includes all of the following:

    !NULL:!SSLv2:!RC4:!aNULL values. For example, add or modify the following line in the

    Apache server level configuration and every virtual host that is TLS enabled:

    SSLHonorCipherOrder On

    SSLCipherSuite ALL:!EXP:!NULL:!LOW:!SSLv2:!RC4:!aNULL

    It is not recommended to add !SSLv3 to the directive even if the SSLv3 protocol is not in

    use. Doing so disables ALL of the ciphers that may used with SSLv3, which includes the

    same ciphers used with the TLS protocols. The !aNULL will disable both the ADH and

    AECDH ciphers, so the !ADH is not required.

    IMPORTANT NOTE: The above SSLCipherSuite value disables only the weak ciphers but

    allows medium strength and other ciphers which should also be disabled. Refer to the

    remaining TLS benchmark recommendations for stronger cipher suite values. The

    following cipher suite value will meet all of the level 1 and level 2 benchmark

    recommendations. As always, testing prior to production use is highly recommended.

    SSLHonorCipherOrder On

    SSLCipherSuite EECDH:EDH:!NULL:!SSLv2:!RC4:!aNULL:!3DES:!IDEA'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      The SSL protocols and ciphers supported can be easily tested by connecting to a running

