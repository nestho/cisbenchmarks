- id: '9.3'
  title: Ensure MaxKeepAliveRequests is Set to a Value of 100 or Greater
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The MaxKeepAliveRequests directive limits the number of requests allowed per connection when KeepAlive is on.
    If it is set to 0, unlimited requests will be allowed.
  rationale: The MaxKeepAliveRequests directive is important to be used to mitigate the risk of Denial of Service (DoS) attack
    technique by reducing the overhead imposed on the server. The KeepAlive directive must be enabled before it is effective.
    Enabling KeepAlives allows for multiple HTTP requests to be sent while keeping the same TCP connection alive. This reduces
    the overhead of having to setup and tear down TCP connections for each request. By making the server more efficient, it
    will be more resilient to DoS conditions.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#maxkeepaliverequests
  page_start: 174
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

