- id: '4.3'
  title: Ensure OverRide Is Disabled for the OS Root Directory
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The Apache AllowOverRide directive and the new AllowOverrideList directive allow for .htaccess files to be
    used to override much of the configuration, including authentication, handling of document types, auto generated indexes,
    access control, and options. When the server finds an .htaccess file (as specified by AccessFileName) it needs to know
    which directives declared in that file can override earlier access information. When this directive is set to None, then
    .htaccess files are completely ignored. In this case, the server will not even attempt to read .htaccess files in the
    filesystem. When this directive is set to All, then any directive which has the .htaccess Context is allowed in the .htaccess
    files.
  rationale: While the functionality of htaccess files is sometimes convenient, usage decentralizes the access controls and
    increases the risk of configurations being changed or viewed inappropriately by an unintended or rogue .htaccess file.
    Consider also that some of the more common vulnerabilities in web servers and web applications allow the web files to
    be viewed or to be modified, then it is wise to keep the configuration out of the web server from being placed in .htaccess
    files.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/core.html#allowoverride
  - 2. https://httpd.apache.org/docs/2.4/mod/core.html#allowoverridelist
  page_start: 71
  audit_raw: 'Perform the following to determine if the recommended state is implemented:

    1. Search the Apache configuration files (httpd.conf and any included configuration

    files) to find a root element.

    2. Ensure there is a single AllowOverride directive with the value of None.

    3. Ensure there are no AllowOverrideList directives present.

    The following may be useful for extracting root directory elements from the Apache

    configuration for auditing.

    $ perl -ne ''print if /^ *<Directory *\//i .. /<\/Directory/i''

    $APACHE_PREFIX/conf/httpd.conf

    71 | Page'
  remediation: "Perform the following to implement the recommended state:\n1. Search the Apache configuration files (httpd.conf\
    \ and any included configuration\nfiles) to find a root <Directory> element.\n2. Remove any AllowOverrideList directives\
    \ found.\n3. Add a single AllowOverride directive if there is none.\n4. Set the value for AllowOverride to None.\n<Directory\
    \ />\n . . .\n AllowOverride None\n . . .\n</Directory>"
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the recommended state is implemented:

      1. Search the Apache configuration files (httpd.conf and any included configuration

