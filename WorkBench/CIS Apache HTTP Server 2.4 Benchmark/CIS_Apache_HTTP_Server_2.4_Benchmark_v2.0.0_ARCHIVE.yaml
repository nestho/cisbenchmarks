- id: '7.6'
  title: Ensure Insecure SSL Renegotiation Is Not Enabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'A man-in-the-middle renegotiation attack was discovered in SSLv3 and TLSv1 in November, 2009 (CVE-2009-3555).
    First, a work around and then a fix was approved as an Internet Standard as RFC 574, Feb 2010. The work around, which
    removes the renegotiation, is available from OpenSSL as of version 0.9.8l and newer versions. For details: https://www.openssl.org/news/secadv_20091111.txt
    The SSLInsecureRenegotiation directive was added in Apache 2.2.15, for web servers linked with OpenSSL version 0.9.8m
    or later, to provide backward compatibility to clients with the older, unpatched SSL implementations.'
  rationale: Enabling the SSLInsecureRenegotiation directive leaves the server vulnerable to man-inthe-middle renegotiation
    attack. Therefore, the SSLInsecureRenegotiation directive should not be enabled.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslinsecurerenegotiation
  - 2. https://cve.mitre.org/cgi-bin/cvename.cgi?name=CAN-2009-3555
  page_start: 143
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Search the Apache configuration files for the SSLInsecureRenegotiation directive and

    verify that the directive is either not present or has a value of off.'
  remediation: 'Perform the following to implement the recommended state:

    Search the Apache configuration files for the SSLInsecureRenegotiation directive. If the

    directive is present modify the value to be off. If the directive is not present then no action

    is required.

    SSLInsecureRenegotiation off'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Search the Apache configuration files for the SSLInsecureRenegotiation directive and

      verify that the directive is either not present or has a value of off.'
    severity: medium
- id: '7.7'
  title: Ensure SSL Compression is not Enabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The SSLCompression directive controls whether SSL compression is used by Apache when serving content over HTTPS.
    It is recommended that the SSLCompression directive be set to off.
  rationale: If SSL compression is enabled, HTTPS communication between the client and the server may be at increased risk
    to the CRIME attack. The CRIME attack increases a malicious actor's ability to derive the value of a session cookie, which
    commonly contains an authenticator. If the authenticator in a session cookie is derived, it can be used to impersonate
    the account associated with the authenticator.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslcompression
  - 2. https://en.wikipedia.org/wiki/CRIME_(security_exploit)
  page_start: 145
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Search the Apache configuration files for the SSLCompression directive.

    2. Verify that the directive either does not exist or exists and is set to off.'
  remediation: 'Perform the following to implement the recommended state:

    1. Search the Apache configuration files for the SSLCompression directive.

    2. If the directive is present, set it to off.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Search the Apache configuration files for the SSLCompression directive.

      2. Verify that the directive either does not exist or exists and is set to off.'
    severity: medium
- id: '7.8'
  title: Ensure Medium Strength SSL/TLS Ciphers Are Disabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The SSLCipherSuite directive specifies which ciphers are allowed in the negotiation with the client. Disable
    the medium strength ciphers such as Triple DES (3DES) and IDEA by adding !3DES and !IDEA in the SSLCipherSuite directive.
  rationale: Although Triple DES has been a trusted standard in the past, several vulnerabilities for it have been published
    over the years and it is no longer considered secure. A vulnerable against 3DES in CBC mode was nicknamed the SWEET32
    attack, was published in 2016 as CVE-2016-2183. The IDEA cipher in CBC mode, is also vulnerable to the SWEET32 attack.
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslprotocol
  - 2. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslciphersuite
  page_start: 147
