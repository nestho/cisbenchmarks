- id: '6.7'
  title: Ensure the OWASP ModSecurity Core Rule Set Is Installed and Enabled
  scoring: scored
  profile:
  - Level 2
  description: 'The OWASP ModSecurity Core Rules Set (CRS) is a set of open source web application defensive rules for the
    ModSecurity web application firewall (WAF). The OWASP ModSecurity CRS provides baseline protections in the following attack/threat
    categories: • HTTP Protection - detecting violations of the HTTP protocol and a locally defined usage policy. • Real-time
    Blacklist Lookups - utilizes 3rd Party IP Reputation • HTTP Denial of Service Protections - defense against HTTP Flooding
    and Slow HTTP DoS Attacks. • Common Web Attacks Protection - detecting common web application security attack. • Automation
    Detection - detecting bots, crawlers, scanners and other surface malicious activity. • Integration with AV Scanning for
    File Uploads - detects malicious files uploaded through the web application. • Tracking Sensitive Data - tracks credit
    card usage and blocks leakages. • Trojan Protection - detecting access to trojan horses. • Identification of Application
    Defects - alerts on application misconfigurations. • Error Detection and Hiding - disguising error messages sent by the
    server. Note: Like other application security/application firewall systems, ModSecurity requires a significant commitment
    of staff resources for initial tuning of the rules and handling alerts. In some cases, this may require additional time
    working with application developers/maintainers to modify applications based on analysis of the results of tuning and
    monitoring logs. After setup, an ongoing commitment of staff is required for monitoring logs and ongoing tuning, especially
    after upgrades/patches. Without this commitment to tuning and monitoring, installing ModSecurity may NOT be effective
    and may provide a false sense of security.'
  rationale: Installing, configuring and enabling of the OWASP ModSecurity Core Rule Set (CRS), provides additional baseline
    security defense, and provides a good starting point to customize the monitoring and blocking of common web application
    attacks. 122 | Page
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/Category:OWASP_ModSecurity_Core_Rule_Set_
  - 2. https://www.modsecurity.org/
  page_start: 122
  audit_raw: 'For the OWASP ModSecurity CRS version 2.2.9, perform the following to audit the

    configuration.

    In the 2.2.9 release, the OWASP ModSecurity CRS contains 15 base_rule configuration files,

    each with rule sets. The CRS also contains 14 optional rule sets, and 17 experimental rule

    sets. Since it is expected that customization and testing will be necessary to implement the

    CRS, it is not expected that any site will implement all CRS configuration files / rule sets.

    Therefore, for the purpose of auditing, the OWASP ModSecurity CRS will be considered

    implemented if 200 or more of the security rules (SecRule) are active in the CRS

    configuration files. The default 2.2.9 installation contains 227 security rules. Perform the

    following to determine if 2.2.9 OWASP ModSecurity CRS is enabled:

    • Set RULE_DIR environment variable to the directory where the active rules are

    included from the modsecurity configuration file. An example is shown below.

    RULE_DIR=$APACHE_PREFIX/modsecurity.d/activated_rules/

    • Use the following command to count the security rules in all of the active CRS

    configuration files.

    find $APACHE_PREFIX/modsecurity.d/activated_rules/ -name

    ''modsecurity_crs_*.conf'' | xargs grep ''^SecRule '' | wc -l

    • If the number of active files is 200 or greater, then OWASP ModSecurity CRS is

    considered active and the audit passed.

    For the OWASP ModSecurity CRS version 3.0, perform the following to audit the

    configuration.

    In the 3.0 release, the OWASP ModSecurity CRS contains 29 rule configuration files, each

    with rule sets. It is expected that customization and testing will be necessary to implement

    the CRS; it is not expected that any site will implement all CRS configuration files / rule

    sets. Therefore, for the purpose of auditing, the OWASP ModSecurity CRS v3.0 will be

    considered implemented if 325 or more of the security rules (SecRule) are active in the CRS

    configuration files. The default OWASP ModSecurity CRS 3.0 installation contains 462

    security rules. In addition to the rules, there are three additional values that have to be set.

    The Inbound and the Outbound Anomaly Threshold and the Paranoia Mode. The Anomaly

    Threshold values set a limit so that traffic is not blocked until the threshold is exceeded.

    Any traffic that triggers enough active rules so that the additive value of each rule exceeds

    the threshold value will be block. The suitable paranoia level has to be defined according to

    the security level of the service in question. The default value of 1 should be applicable for

    123 | Page

    any online service. The Paranoia Level 2 should be chosen for online services with a need

    for further hardening, (such as online services with a wide attack surface or online services

    with known security issues and concerns). Paranoia Level 3 and Level 4 cater services with

    even higher security requirements but have to be considered experimental.

    Perform the following to determine if OWASP ModSecurity CRS 3.0 is enabled, and is

    configured to meet or exceed the expected values:

    • Set RULE_DIR environment variable to the directory where the active rules are

    included from the modsecurity configuration file. An example is shown below.

    RULE_DIR=$APACHE_PREFIX/modsecurity.d/owasp-modsecurity-crs-3.0.0/

    • Use the following command to count the security rules in all of the active CRS

    configuration files.

    find $RULE_DIR -name ''*.conf'' | xargs grep ''^SecRule '' | wc -l

    • If the number of active rules is 325 or greater then OWASP ModSecurity CRS 3.0 is

    considered active.

    • The Inbound Anomaly Threshold must be less than or equal to 5, and can be checked

    with the following command.

    find $RULE_DIR -name ''*.conf'' | xargs egrep -v ''^\s*#'' | grep

    ''setvar:tx.inbound_anomaly_score_threshold''

    • The Outbound Anomaly Threshold must be less than or equal to 4, and may be

    audited with the following command.

    find $RULE_DIR -name ''*.conf'' | xargs egrep -v ''^\s*#'' | grep

    ''setvar:tx.outbound_anomaly_score_threshold''

    • The Paranoia Level must be greater than or equal to 1, and may be audited with the

    following command.

    find $RULE_DIR -name ''*.conf'' | xargs egrep -v ''^\s*#'' | grep

    ''setvar:tx.paranoia_level'''
  remediation: 'Install, configure and test the OWASP ModSecurity Core Rule Set:

    1. Download the OWASP ModSecurity CRS from the project page

    https://www.owasp.org/index.php/Category:OWASP_ModSecurity_Core_Rule_Set_

    Project

    2. Unbundled the archive and follow the instructions in the INSTALL file.

    124 | Page

    3. Depending on the CRS version used, the crs-setup.conf or the

    modsecurity_crs_10_setup.conf file will be required, and rules in the base_rules

    directory are intended as a baseline useful for most applications.

    4. Test the application for correct functionality after installing the CRS. Check web

    server error logs and the modsec_audit.log file for blocked requests due to false

    positives.

    5. It is also recommended to test the application response to malicious traffic such as

    an automated web application scanner to ensure the rules are active. The web

    server error log and modsec_audit.log files should show logs of the attacks and the

    servers response codes.'
  checks:
  - type: command
    command: find $APACHE_PREFIX/modsecurity.d/activated_rules/ -name && find $RULE_DIR -name '*.conf' | xargs grep '^SecRule
      ' | wc -l && find $RULE_DIR -name '*.conf' | xargs egrep -v '^\s*#' | grep && find $RULE_DIR -name '*.conf' | xargs
      egrep -v '^\s*#' | grep && find $RULE_DIR -name '*.conf' | xargs egrep -v '^\s*#' | grep
    expected: ''
    severity: medium
    info: 'For the OWASP ModSecurity CRS version 2.2.9, perform the following to audit the

      configuration.

      In the 2.2.9 release, the OWASP ModSecurity CRS contains 15 base_rule configuration files,

      each with rule sets. The CRS also contains 14 optional rule sets, and 17 experimental rule

      sets. Since it is expected that customization and testing will be necessary to implement the

      CRS, it is not expected that a'
- id: '7.1'
  title: Ensure mod_ssl and/or mod_nss Is Installed
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Secure Sockets Layer (SSL) was developed by Netscape and turned into an open standard and was renamed Transport
    Layer Security (TLS) as part of the process. TLS is important for protecting communication and can provide authentication
    of the server and even the client. However, contrary to vendor claims, implementing SSL does NOT directly make your web
    server more secure! SSL is used to encrypt traffic and therefore does provide confidentiality of private information and
    users credentials. Keep in mind, however that just because you have encrypted the data in transit does not mean that the
    data provided by the client is secure while it is on the server. Also, SSL does not protect the web server, as attackers
    will easily target SSL-Enabled web servers, and the attack will be hidden in the encrypted channel. The mod_ssl module
    is the standard, most used module that implements SSL/TLS for Apache. A newer module found on Red Hat systems can be a
    compliment or replacement for mod_ssl and provides the same functionality plus additional security services. The mod_nss
    is an Apache module implementation of the Network Security Services (NSS) software from Mozilla, which implements a wide
    range of cryptographic functions in addition to TLS.
  rationale: 'It is best to plan for SSL/TLS implementation from the beginning of any new web server. As most web servers
    have some need for SSL/TLS due to: • Non-public information submitted that should be protected as it''s transmitted to
    the web server. • Non-public information that is downloaded from the web server. • Users are going to be authenticated
    to some portion of the web server 127 | Page • There is a need to authenticate the web server to ensure users that they
    have reached the real web server and have not been phished or redirected to a bogus site.'
  impact: ''
  references:
  - 1. https://httpd.apache.org/docs/2.4/mod/mod_ssl.html
  - 2. https://www.centos.org/docs/5/html/5.4/technical-notes/mod_nss.html
  page_start: 127
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Ensure the mod_ssl and/or mod_nssis loaded in the Apache configuration:

    # httpd -M | egrep ''ssl_module|nss_module''

    Results should show either or both of the modules.'
  remediation: 'Perform either of the following to implement the recommended state:

    1. For Apache installations built from the source, use the option --with-ssl= to

    specify the openssl path, and the --enable-ssl configure option to add the SSL

    modules to the build. The --with-included-apr configure option may be necessary

    if there are conflicts with the platform version. If a new version of Openssl is needed

    it may be downloaded from http://www.openssl.org/ See the Apache

    documentation on building from source

    http://httpd.apache.org/docs/2.4/install.htmlfor details.

    # ./configure --with-included-apr --with-ssl=$OPENSSL_DIR --enable-ssl

    2. For installations using OS packages, it is typically just a matter of ensuring the

    mod_ssl package is installed. The mod_nsspackage might also be installed. The

    following yum commands are suitable for Red Hat Linux.

    # yum install mod_ssl'
  checks:
  - type: sql
    command: show either or both of the modules.
    severity: medium
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Ensure the mod_ssl and/or mod_nssis loaded in the Apache configuration:

      # httpd -M | egrep ''ssl_module|nss_module''

      Results should show either or both of the modules.'
- id: '7.2'
  title: Ensure a Valid Trusted Certificate Is Installed
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'The default SSL certificate is self-signed and is not trusted. Install a valid certificate signed by a commonly
    trusted certificate authority. To be valid, the certificate must be: • Signed by a trusted certificate authority • Not
    be expired, and • Have a common name that matches the host name of the web server, such as www.example.com. Note: Some
    previously "Trusted" Certificate Authority certificates had been signed with a weak hash algorithm such as MD5, or SHA1.
    These signature algorithms are known to be vulnerable to collision attacks. Note that it’s not the just the signature
    on the server''s certificate, but any signature up the certificate chain. Such CA certificates are considered no longer
    trusted as of January 1, 2017.'
  rationale: A digital certificate on your server automatically communicates your site's authenticity to visitors' web browsers.
    If a trusted authority signs your certificate, it confirms for the visitor they are actually communicating with you, and
    not with a fraudulent site stealing credit card numbers or personal information.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29
  - 2. https://httpd.apache.org/docs/2.4/ssl/ssl_faq.html#realcert
  page_start: 130
  audit_raw: 'Perform one or more of the following steps to determine if the recommended state is

    implemented:

    1. The Qualys SSL Labs has a website that may be used for testing external servers.

    https://www.ssllabs.com/ssltest/ Enter the external host name of the server and

    wait for an extensive tests of TLS protocols and ciphers, in addition to testing the

    server certificate and the entire certificate authority chain. The SSL Labs test will

    report any weak digital signatures of the intermediate certificate authorities. For

    example, the report may include a warning of:

    130 | Page

    Intermediate certificate has an insecure signature. Upgrade to SHA2 as

    soon as possible to avoid browser warnings.

    In addition, the weak SHA1 or MD5 signature algorithm will be highlighted with red

    text where the additional intermediate CA certificates are enumerated. For example,

    the certificate below from an SSL Labs report used SHA1 for the digital signature:

    o Subject The Go Daddy Group, Inc.

    o Fingerprint SHA256: 18f8a7. . .

    o Pin SHA256: VjLZe. . .

    o Valid until Sat, 29 Jun . . .

    o Key RSA 2048 bits (e 3)

    o Issuer http://www...

    o Signature algorithm SHA1withRSA INSECURE

    If a weak signature is found, then follow your certificate authority’s process for

    having the server certificate re-issued / re-signed, in order to ensure that it is signed

    with a strong digital signature.

    2. If the server is not an external server, or is not running on the standard port 443, a

    vulnerability scanner such as Nessus may be used to validate both the server

    certificate and the intermediate certificate chain. Custom certificate authorities may

    also be tested by loading the root certificate into the vulnerability scanner.

    3. The testing can also be done by connecting to a running web server with your

    favorite browser and checking for a warning with regard to the certificate trust.

    However, some browsers may not warn of weak digital signatures, or other

    certificate issues.

    4. OpenSSL can also be used to validate a certificate as a valid trusted certificate, using

    a trusted bundle of CA certificate. It is important that the CA bundle of certificates be

    an already validated and trusted file in order for the test to be valid.

    $ openssl verify -CAfile /etc/ssl/certs/ca-bundle.crt -purpose

    sslserver

    /etc/ssl/certs/example.com.crt

    /etc/ssl/certs/example.com.crt: OK

    A specific error message and code will be reported in addition to the OK if the

    certificate is not valid, For example:

    error 10 at 0 depth lookup:certificate has expired

    OK

    Of course, it is important here as well to be sure of the integrity of the trusted

    certificate authorities used by the web client. Visit the OWASP testing SSL web page

    131 | Page

    for additional suggestions:

    https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29'
  remediation: "Perform the following to implement the recommended state:\n1. Decide on the host name to be used for the certificate.\
    \ It is important to remember\nthat the browser will compare the host name in the URL to the common name in the\ncertificate,\
    \ so that it is important that all https: URL's match the correct host name.\nSpecifically, the host name www.example.com\
    \ is not the same as example.com nor the\nsame as ssl.example.com.\n2. Generate a private key using openssl. Although\
    \ certificate key lengths of 1024 have\nbeen common in the past, a key length of 2048 is now recommended for strong\n\
    authentication. The key must be kept confidential and will be encrypted with a\npassphrase by default. Follow the steps\
    \ below and respond to the prompts for a\npassphrase. See the Apache or OpenSSL documentation for details:\no https://httpd.apache.org/docs/2.4/ssl/ssl_faq.html#realcert\n\
    o https://www.openssl.org/docs/HOWTO/certificates.txt\n# cd /etc/ssl/certs\n# umask 077\n# openssl genrsa -aes128 2048\
    \ > example.com.key\nGenerating RSA private key, 2048 bit long modulus\n...+++\ne is 65537 (0x10001)\nEnter pass phrase:\n\
    Verifying - Enter pass phrase:\n3. Create a certificate specific template configuration file. It is important that common\n\
    name in the certificate exactly make the web host name in the intended URL. If there\nare multiple host names which may\
    \ be used, as is very common, then the\nsubjectAltName (SAN) field should be filled with all of the alternate names. Creating\n\
    a template configuration file specific to the server certificate is helpful, as it allows\nfor multiple entries in the\
    \ subjectAltName. Also, any typos in the CSR can be\npotentially costly due to the lost time, so using a file, rather\
    \ than hand typing helps\nprevent errors. To create a template configuration file, make a local copy of the\nopenssl.cnf\
    \ typically found in /etc/ssl/ or /etc/pki/tls/\n# cp /etc/ssl/openssl.cnf ex1.cnf\n4. Find the request section which\
    \ follows the line “[ req ] \". Then add or modify the\nconfiguration file to include the appropriate values for the host\
    \ names. It is\nrecommended (but not required) that the first subjectAltName match the\ncommonName.\n132 | Page\n[ req\
    \ ]\n. . .\ndistinguished_name = req_distinguished_name\nreq_extensions = req_ext\n[ req_ext ]\nsubjectAltName = @alt_names\n\
