- id: 3.2.1
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable anonymous requests to the Kubelet server.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the Kubelet server. You should rely on authentication to authorize access
    and disallow anonymous requests.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 28
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for authentication:

    anonymous: enabled set to false.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /etc/kubernetes/kubelet/kubelet-config.json which is the location of the Kubelet

    config file.

    Open the Kubelet config file:

    sudo more /etc/kubernetes/kubelet/kubelet-config.json

    Verify that the "authentication": { "anonymous": { "enabled": false } argument is

    set to false.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of authentication...

    "anonymous":{"enabled":false} by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If modifying the Kubelet config file, edit the kubelet-config.json file

    /etc/kubernetes/kubelet/kubelet-config.json and set the below parameter to false

    "anonymous": "enabled": false

    Remediation Method 2:

    If using executable arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubelet-args.conf on each worker node

    and add the below parameter at the end of the KUBELET_ARGS variable string.

    --anonymous-auth=false

    Remediation Method 3:

    If using the api configz endpoint consider searching for the status of

    "authentication.*anonymous":{"enabled":false}" by extracting the live configuration

    from the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a

    Live Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all three remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Audit Method 1:

      If using a Kubelet configuration file, check that there is an entry for authentication:

      anonymous: enabled set to false.

      First, SSH to the relevant node:

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet/kubelet-config.json whic'
- id: 3.2.2
  title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  scoring: scored
  profile:
  - Level 1
  description: Do not allow all requests. Enable explicit authorization.
  rationale: Kubelets, by default, allow all authenticated requests (even anonymous ones) without needing explicit authorization
    checks from the apiserver. You should restrict this behavior and only allow explicitly authorized requests.
  impact: Unauthorized requests will be denied.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 31
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for "authentication":

    "webhook": "enabled" set to true.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /etc/kubernetes/kubelet/kubelet-config.json which is the location of the Kubelet

    config file.

    Open the Kubelet config file:

    sudo more /etc/kubernetes/kubelet/kubelet-config.json

    Verify that the "authentication": {"webhook": { "enabled": is set to true.

    If the "authentication": {"mode": { argument is present check that it is not set to

    AlwaysAllow. If it is not present check that there is a Kubelet config file specified by --

    config, and that file sets "authentication": {"mode": { to something other than

    AlwaysAllow.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of authentication...

    "webhook":{"enabled":true} by extracting the live configuration from the nodes running

    kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If modifying the Kubelet config file, edit the kubelet-config.json file

    /etc/kubernetes/kubelet/kubelet-config.json and set the below parameter to false

    "authentication"... "webhook":{"enabled":true

    Remediation Method 2:

    If using executable arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubelet-args.conf on each worker node

    and add the below parameter at the end of the KUBELET_ARGS variable string.

    --authorization-mode=Webhook

    Remediation Method 3:

    If using the api configz endpoint consider searching for the status of

    "authentication.*webhook":{"enabled":true" by extracting the live configuration from

    the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a

    Live Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all three remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Audit Method 1:

      If using a Kubelet configuration file, check that there is an entry for "authentication":

      "webhook": "enabled" set to true.

      First, SSH to the relevant node:

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet/kubelet-config.json w'
- id: 3.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Enable Kubelet authentication using certificates.
  rationale: The connections from the apiserver to the kubelet are used for fetching logs for pods, attaching (through kubectl)
    to running pods, and using the kubelet’s port-forwarding functionality. These connections terminate at the kubelet’s HTTPS
    endpoint. By default, the apiserver does not verify the kubelet’s serving certificate, which makes the connection subject
    to man-in-the-middle attacks, and unsafe to run over untrusted and/or public networks. Enabling Kubelet certificate authentication
    ensures that the apiserver could authenticate the Kubelet before submitting any requests.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubeletauthentication-authorization/
  page_start: 34
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for "x509":

    {"clientCAFile:" set to the location of the client certificate authority file.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /etc/kubernetes/kubelet/kubelet-config.json which is the location of the Kubelet

    config file.

    Open the Kubelet config file:

    sudo more /etc/kubernetes/kubelet/kubelet-config.json

    Verify that the "x509": {"clientCAFile:" argument exists and is set to the location of

    the client certificate authority file.

    If the "x509": {"clientCAFile:" argument is not present, check that there is a Kubelet

    config file specified by --config, and that the file sets "authentication": { "x509":

    {"clientCAFile:" to the location of the client certificate authority file.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of authentication..

    x509":("clientCAFile":"/etc/kubernetes/pki/ca.crt by extracting the live

    configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output of

    "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If modifying the Kubelet config file, edit the kubelet-config.json file

    /etc/kubernetes/kubelet/kubelet-config.json and set the below parameter to false

    "authentication": { "x509": {"clientCAFile:" to the location of the client CA

    file.

    Remediation Method 2:

    If using executable arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubelet-args.conf on each worker node

    and add the below parameter at the end of the KUBELET_ARGS variable string.

    --client-ca-file=<path/to/client-ca-file>

    Remediation Method 3:

    If using the api configz endpoint consider searching for the status of

    "authentication.*x509":("clientCAFile":"/etc/kubernetes/pki/ca.crt" by

    extracting the live configuration from the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a

    Live Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all three remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: The output of the above command should return something similar to --config
    severity: medium
    info: 'Audit Method 1:

      If using a Kubelet configuration file, check that there is an entry for "x509":

      {"clientCAFile:" set to the location of the client certificate authority file.

      First, SSH to the relevant node:

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kuber'
- id: 3.2.4
  title: Ensure that the --read-only-port is secured
  scoring: manual
  profile:
  - Level 1
  description: Disable the read-only port.
  rationale: The Kubelet process provides a read-only API in addition to the main Kubelet API. Unauthenticated access is provided
    to this read-only API which could possibly retrieve potentially sensitive information about the cluster.
