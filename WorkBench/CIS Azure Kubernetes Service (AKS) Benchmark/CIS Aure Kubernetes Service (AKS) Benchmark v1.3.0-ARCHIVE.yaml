- id: 3.1.3
  title: Ensure that the kubelet configuration file has permissions set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file is specified you should restrict its file permissions to maintain the integrity of the file. The
    file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 23
  audit_raw: 'First, SSH to the relevant worker node:

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate Kubelet config file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --config

    /etc/kubernetes/kubelet/kubelet-config.json which is the location of the Kubelet

    config file.

    Run the following command:

    stat -c %a /etc/kubernetes/kubelet/kubelet-config.json

    The output of the above command is the Kubelet config file''s permissions. Verify that

    the permissions are 644 or more restrictive.'
  remediation: 'Run the following command (using the config file location identified in the Audit step)

    chmod 644 /etc/kubernetes/kubelet/kubelet-config.json'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet/kubelet-config.json
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'First, SSH to the relevant worker node:

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet/kubelet-config.'
