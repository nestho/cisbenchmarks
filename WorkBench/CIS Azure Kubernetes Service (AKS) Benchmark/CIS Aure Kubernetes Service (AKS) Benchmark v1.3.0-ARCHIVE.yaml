- id: 4.7.2
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 2
  description: Apply Security Context to Your Pods and Containers
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing your containers and pods, make sure that you configure the security context for
    your pods, containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security
    parameters that will be assigned to the pod/container/volume. There are two levels of security context: pod level security
    context, and container level security context.'
  impact: If you incorrectly apply security contexts, you may have trouble running the pods.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/security-context/
  - 2. https://learn.cisecurity.org/benchmarks
  page_start: 101
  audit_raw: 'Review the pod definitions in your cluster and verify that you have security contexts

    defined as appropriate.'
  remediation: "As a best practice we recommend that you scope the binding for privileged pods to\nservice accounts within\
    \ a particular namespace, e.g. kube-system, and limiting access\nto that namespace. For all other serviceaccounts/namespaces,\
    \ we recommend\nimplementing a more restrictive policy such as this:\napiVersion: policy/v1beta1\nkind: PodSecurityPolicy\n\
    metadata:\n name: restricted\n annotations:\n seccomp.security.alpha.kubernetes.io/allowedProfileNames:\n'docker/default,runtime/default'\n\
    \ apparmor.security.beta.kubernetes.io/allowedProfileNames:\n'runtime/default'\n seccomp.security.alpha.kubernetes.io/defaultProfileName:\n\
    'runtime/default'\n apparmor.security.beta.kubernetes.io/defaultProfileName:\n'runtime/default'\nspec:\n privileged: false\n\
    \ # Required to prevent escalations to root.\n allowPrivilegeEscalation: false\n # This is redundant with non-root + disallow\
    \ privilege escalation,\n # but we can provide it for defense in depth.\n requiredDropCapabilities:\n - ALL\n # Allow\
    \ core volume types.\n volumes:\n - 'configMap'\n - 'emptyDir'\n - 'projected'\n - 'secret'\n - 'downwardAPI'\n # Assume\
    \ that persistentVolumes set up by the cluster admin are safe to\nuse.\n - 'persistentVolumeClaim'\n hostNetwork: false\n\
    \ hostIPC: false\n hostPID: false\n runAsUser:\n # Require the container to run without root privileges.\n rule: 'MustRunAsNonRoot'\n\
    \ seLinux:\n # This policy assumes the nodes are using AppArmor rather than SELinux.\n rule: 'RunAsAny'\n supplementalGroups:\n\
    \ rule: 'MustRunAs'\n ranges:\n # Forbid adding the root group.\n - min: 1\n max: 65535\n fsGroup:\n rule: 'MustRunAs'\n\
    \ ranges:\n # Forbid adding the root group.\n - min: 1\n max: 65535\n readOnlyRootFilesystem: false\nThis policy prevents\
    \ pods from running as privileged or escalating privileges. It also\nrestricts the types of volumes that can be mounted\
    \ and the root supplemental groups\nthat can be added.\nAnother, albeit similar, approach is to start with policy that\
    \ locks everything down and\nincrementally add exceptions for applications that need looser restrictions such as\nlogging\
    \ agents which need the ability to mount a host path."
  checks:
  - type: manual_review
    info: 'Review the pod definitions in your cluster and verify that you have security contexts

      defined as appropriate.'
    severity: medium
