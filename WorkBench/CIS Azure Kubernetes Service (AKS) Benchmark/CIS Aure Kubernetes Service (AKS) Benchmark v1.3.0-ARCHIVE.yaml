- id: 5.1.1
  title: Ensure Image Vulnerability Scanning using Azure Defender image scanning or a third party provider
  scoring: manual
  profile:
  - Level 1
  description: Scan images being deployed to Azure (AKS) for vulnerabilities. Vulnerability scanning for images stored in
    Azure Container Registry is generally available in Azure Security Center. This capability is powered by Qualys, a leading
    provider of information security. When you push an image to Container Registry, Security Center automatically scans it,
    then checks for known vulnerabilities in packages or dependencies defined in the file. When the scan completes (after
    about 10 minutes), Security Center provides details and a security classification for each vulnerability detected, along
    with guidance on how to remediate issues and protect vulnerable attack surfaces. Restrict user access to Azure Container
    Registry (ACR), limiting interaction with build images to only authorized personnel and service accounts.
  rationale: Vulnerabilities in software packages can be exploited by hackers or malicious users to obtain unauthorized access
    to local cloud resources. Azure Defender and other third party products allow images to be scanned for known vulnerabilities.
    Weak access control to Azure Container Registry (ACR) may allow malicious users to replace built images with vulnerable
    containers.
  impact: When using an Azure container registry, you might occasionally encounter problems. For example, you might not be
    able to pull a container image because of an issue with Docker in your local environment. Or, a network issue might prevent
    you from connecting to the registry. Care should be taken not to remove access to Azure ACR for accounts that require
    this for their operation.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security-center/defender-for-containerregistries-usage
  - 2. https://docs.microsoft.com/en-us/azure/container-registry/container-registrycheck-health
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
