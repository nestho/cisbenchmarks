- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: The RBAC role cluster-admin provides wide-ranging powers over the environment and should be used only where
    and when needed.
  rationale: Kubernetes provides a set of default roles where RBAC is used. Some of these roles such as cluster-admin provide
    wide-ranging privileges which should only be applied where absolutely necessary. Roles such as cluster-admin allow super-user
    access to perform any action on any resource. When used in a ClusterRoleBinding, it gives full control over every resource
    in the cluster and in all namespaces. When used in a RoleBinding, it gives full control over every resource in the rolebinding's
    namespace, including the namespace itself.
  impact: 'Care should be taken before removing any clusterrolebindings from the environment to ensure they were not required
    for operation of the cluster. Specifically, modifications should not be made to clusterrolebindings with the system: prefix
    as they are required for the operation of system components.'
  references:
  - 1. https://kubernetes.io/docs/admin/authorization/rbac/#user-facing-roles
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
  page_start: 56
  audit_raw: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

    the clusterrolebinding output for each role binding that has access to the clusteradmin role.

    kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

    Review each principal listed and ensure that cluster-admin privilege is required for it.'
  remediation: 'Identify all clusterrolebindings to the cluster-admin role. Check if they are used and if

    they need this role or if they could use a role with fewer privileges.

    Where possible, first bind users to a lower privileged role and then remove the

    clusterrolebinding to the cluster-admin role :

    kubectl delete clusterrolebinding [name]'
  checks:
  - type: manual_review
    info: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

      the clusterrolebinding output for each role binding that has access to the clusteradmin role.

      kubectl get clusterrolebindings -o=customcolumns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT:.subjects[*].name

      Review each principal listed and ensure that cluster-admin privilege is required for it.'
    severity: medium
- id: 4.1.2
  title: Minimize access to secrets
  scoring: manual
  profile:
  - Level 1
  description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials
    used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users
    to reduce the risk of privilege escalation.
  rationale: Inappropriate access to secrets stored within the Kubernetes cluster can allow for an attacker to gain additional
    access to the Kubernetes cluster or external resources whose credentials are stored as secrets.
  impact: Care should be taken not to remove access to secrets to system components which require this for their operation
  references:
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2identity-management#im-7-eliminate-unintended-credential-exposure
  page_start: 58
  audit_raw: 'Review the users who have get, list or watch access to secrets objects in the

    Kubernetes API.'
  remediation: Where possible, remove get, list and watch access to secret objects in the cluster.
  checks:
  - type: manual_review
    info: 'Review the users who have get, list or watch access to secrets objects in the

      Kubernetes API.'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Roles and ClusterRoles provide access to resources based on sets of objects and actions that can
    be taken on those objects. It is possible to set either of these to be the wildcard "*" which matches all items. Use of
    wildcards is not optimal from a security perspective as it may allow for inadvertent access to be granted when new resources
    are added to the Kubernetes API either as CRDs or in later versions of the product.
  rationale: The principle of least privilege recommends that users are provided only the access required for their role and
    nothing more. The use of wildcard rights grants is likely to provide excessive rights to the Kubernetes API.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
  page_start: 60
  audit_raw: 'Retrieve the roles defined across each namespaces in the cluster and review for

    wildcards

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Where possible replace any use of wildcards in clusterroles and roles with specific

    objects or actions.'
  checks:
  - type: manual_review
    info: 'Retrieve the roles defined across each namespaces in the cluster and review for

      wildcards

      kubectl get roles --all-namespaces -o yaml

      Retrieve the cluster roles defined in the cluster and review for wildcards

      kubectl get clusterroles -o yaml'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create pods in a namespace can provide a number of opportunities for privilege escalation, such
    as assigning privileged service accounts to these pods or mounting hostPaths with access to sensitive data (unless Pod
    Security Policies are implemented to restrict this access) As such, access to create new pods should be restricted to
    the smallest possible group of users.
  rationale: The ability to create pods in a cluster opens up possibilities for privilege escalation and should be restricted,
    where possible.
  impact: Care should be taken not to remove access to pods to system components which require this for their operation
  references:
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
  page_start: 62
  audit_raw: Review the users who have create access to pod objects in the Kubernetes API.
  remediation: Where possible, remove create access to pod objects in the cluster.
  checks:
  - type: manual_review
    info: Review the users who have create access to pod objects in the Kubernetes API.
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used.
  scoring: manual
  profile:
  - Level 1
  description: The default service account should not be used to ensure that rights granted to applications can be more easily
    audited and reviewed.
  rationale: Kubernetes provides a default service account which is used by cluster workloads where no specific service account
    is assigned to the pod. Where access to the Kubernetes API from a pod is required, a specific service account should be
    created for that pod, and rights granted to that service account. The default service account should be configured such
    that it does not provide a service account token and does not have any explicit rights assignments.
  impact: All workloads which require access to the Kubernetes API will require an explicit service account to be created.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2identity-management#im-2-manage-application-identities-securely-andautomatically
  page_start: 64
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service

    account and ensure that it has no roles or cluster roles bound to it apart from the

    defaults.

    Additionally ensure that the automountServiceAccountToken: false setting is in place

    for each default service account.'
  remediation: 'Create explicit service accounts wherever a Kubernetes workload requires specific

    access to the Kubernetes API server.

    Modify the configuration of each default service account to include this value

    automountServiceAccountToken: false

    Automatic remediation for the default account:

    kubectl patch serviceaccount default -p $''automountServiceAccountToken:

    false'''
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service

      account and ensure that it has no roles or cluster roles bound to it apart from the

      defaults.

      Additionally ensure that the automountServiceAccountToken: false setting is in place

      for each default service account.'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: manual
  profile:
  - Level 1
  description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly
    needs to communicate with the API server
  rationale: Mounting service account tokens inside pods can provide an avenue for privilege escalation attacks where an attacker
    is able to compromise a single pod in the cluster. Avoiding mounting these tokens removes this attack avenue.
  impact: Pods mounted without service account tokens will not be able to communicate with the API server, except where the
    resource is available to unauthenticated principals.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2identity-management#im-2-manage-application-identities-securely-andautomatically
  page_start: 66
  audit_raw: 'Review pod and service account objects in the cluster and ensure that the option below

    is set, unless the resource explicitly requires this access.

    automountServiceAccountToken: false'
  remediation: 'Modify the definition of pods and service accounts which do not need to mount service

    account tokens to disable it.'
  checks:
  - type: manual_review
    info: 'Review pod and service account objects in the cluster and ensure that the option below

      is set, unless the resource explicitly requires this access.

      automountServiceAccountToken: false'
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the securityContext.privileged flag set to true.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A container running with full
    privileges can do almost everything that the host can do. This flag exists to allow special use-cases, like manipulating
    the network stack and accessing devices. There should be at least one admission control policy defined which does not
    permit privileged containers. If you need to run privileged containers, this should be defined in a separate policy and
    you should carefully check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true and spec.ephemeralContainers[].securityContext.privileged: true will not be permitted.'
  references:
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2governance-strategy#gs-2-define-enterprise-segmentation-strategy
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-psa
  page_start: 69
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of privileged containers.'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of privileged containers.

    To enable PSA for a namespace in your cluster, set the podsecurity.kubernetes.io/enforce label with the policy value you
    want to enforce.

    kubectl label --overwrite ns NAMESPACE podsecurity.kubernetes.io/enforce=restricted

    The above command enforces the restricted policy for the NAMESPACE namespace.

    You can also enable Pod Security Admission for all your namespaces. For example:

    kubectl label --overwrite ns --all pod-security.kubernetes.io/warn=baseline'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of privileged containers.'
    severity: medium
- id: 4.2.2
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
    also has access to ptrace capabilities this can be used to escalate privileges outside of the container. There should
    be at least one admission control policy defined which does not permit containers to share the host PID namespace. If
    you need to run containers which require hostPID, this should be defined in a separate policy and you should carefully
    check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.hostPID: true will not be permitted unless they are run under a specific policy.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-psa
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2-dataprotection#dp-2-protect-sensitive-data
  page_start: 71
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of hostPID containers'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of hostPID containers.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of hostPID containers'
    severity: medium
- id: 4.2.3
  title: Minimize the admission of containers wishing to share the host IPC namespace
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the hostIPC flag set to true.
  rationale: A container running in the host's IPC namespace can use IPC to interact with processes outside the container.
    There should be at least one admission control policy defined which does not permit containers to share the host IPC namespace.
    If you need to run containers which require hostIPC, this should be defined in a separate policy and you should carefully
    check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.hostIPC: true will not be permitted unless they are run under a specific policy.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2-dataprotection#dp-2-protect-sensitive-data
  page_start: 73
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of hostIPC containers'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of hostIPC containers.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of hostIPC containers'
    severity: medium
- id: 4.2.4
  title: Minimize the admission of containers wishing to share the host network namespace
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the hostNetwork flag set to true.
  rationale: A container running in the host's network namespace could access the local loopback device, and could access
    network traffic to and from other pods. There should be at least one admission control policy defined which does not permit
    containers to share the host network namespace. If you need to run containers which require access to the host's network
    namespaces, this should be defined in a separate policy and you should carefully check to ensure that only limited service
    accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.hostNetwork: true will not be permitted unless they are run under a specific policy.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2-dataprotection#dp-2-protect-sensitive-data
  page_start: 75
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of hostNetwork containers'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of hostNetwork containers.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of hostNetwork containers'
    severity: medium
- id: 4.2.5
  title: Minimize the admission of containers with allowPrivilegeEscalation
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the allowPrivilegeEscalation flag set to true. Allowing this
    right can lead to a process running a container getting more rights than it started with. It's important to note that
    these rights are still constrained by the overall container sandbox, and this setting does not relate to the use of privileged
    containers.
  rationale: A container running with the allowPrivilegeEscalation flag set to true may have processes that can gain more
    privileges than their parent. There should be at least one admission control policy defined which does not permit containers
    to allow privilege escalation. The option exists (and is defaulted to true) to permit setuid binaries to run. If you have
    need to run containers which use setuid binaries or require privilege escalation, this should be defined in a separate
    policy and you should carefully check to ensure that only limited service accounts and users are given permission to use
    that policy.
  impact: 'Pods defined with spec.allowPrivilegeEscalation: true will not be permitted unless they are run under a specific
    policy.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
  page_start: 77
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of containers which allow privilege escalation.'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of containers with .spec.allowPrivilegeEscalation set to true.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of containers which allow privilege escalation.'
    severity: medium
- id: 4.2.6
  title: Minimize the admission of root containers
  scoring: manual
  profile:
  - Level 2
  description: Do not generally permit containers to be run as the root user.
  rationale: Containers may run as any Linux user. Containers which run as the root user, whilst constrained by Container
    Runtime security features still have a escalated likelihood of container breakout. Ideally, all containers should run
    as a defined non-UID 0 user. There should be at least one admission control policy defined which does not permit root
    containers. If you need to run root containers, this should be defined in a separate policy and you should carefully check
    to ensure that only limited service accounts and users are given permission to use that policy.
  impact: Pods with containers which run as the root user will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2privileged-access#pa-7-follow-just-enough-administration-least-privilege-principle
  page_start: 79
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    restricts the use of root containers by setting MustRunAsNonRoot or MustRunAs with the

    range of UIDs not including 0.'
  remediation: 'Create a policy for each namespace in the cluster, ensuring that either

    MustRunAsNonRoot or MustRunAs with the range of UIDs not including 0, is set.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      restricts the use of root containers by setting MustRunAsNonRoot or MustRunAs with the

      range of UIDs not including 0.'
    severity: medium
- id: 4.2.7
  title: Minimize the admission of containers with added capabilities
  scoring: manual
  profile:
  - Level 1
  description: Do not generally permit containers with capabilities assigned beyond the default set.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities outside
    this set can be added to containers which could expose them to risks of container breakout attacks. There should be at
    least one policy defined which prevents containers with capabilities beyond the default set from launching. If you need
    to run containers with additional capabilities, this should be defined in a separate policy and you should carefully check
    to ensure that only limited service accounts and users are given permission to use that policy.
  impact: Pods with containers which require capabilities out with the default set will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-and-unprivilegedlinux-containers/
  page_start: 81
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that policies are

    present which prevent allowedCapabilities to be set to anything other than an empty

    array.'
  remediation: 'Ensure that allowedCapabilities is not present in policies for the cluster unless it is set

    to an empty array.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that policies are

      present which prevent allowedCapabilities to be set to anything other than an empty

      array.'
    severity: medium
- id: 4.2.8
  title: Minimize the admission of containers with capabilities assigned
  scoring: manual
  profile:
  - Level 2
  description: Do not generally permit containers with capabilities
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. Capabilities are parts
    of the rights generally granted on a Linux system to the root user. In many cases applications running in containers do
    not require any capabilities to operate, so from the perspective of the principal of least privilege use of capabilities
    should be minimized.
  impact: Pods with containers require capabilities to operate will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-and-unprivilegedlinux-containers/
  page_start: 83
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that at least one policy

    requires that capabilities are dropped by all containers.'
  remediation: 'Review the use of capabilities in applications running on your cluster. Where a

    namespace contains applications which do not require any Linux capabilities to operate

    consider adding a policy which forbids the admission of containers which do not drop all

    capabilities.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that at least one policy

      requires that capabilities are dropped by all containers.'
    severity: medium
- id: '4.4'
  title: CNI Plugin 4.4.1 Ensure latest CNI version is used
  scoring: manual
  profile:
  - Level 1
  description: There are a variety of CNI plugins available for Kubernetes. If the CNI in use does not support Network Policies
    it may not be possible to effectively restrict traffic in the cluster.
  rationale: Kubernetes network policies are enforced by the CNI plugin in use. As such it is important to ensure that the
    CNI plugin supports both Ingress and Egress network policies.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storagenet/network-plugins/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2network-security#ns-1-implement-security-for-internal-traffic
  page_start: 85
  audit_raw: Ensure CNI plugin supports network policies.
  remediation: 'As with RBAC policies, network policies should adhere to the policy of least privileged

    access. Start by creating a deny all policy that restricts all inbound and outbound traffic

    from a namespace or create a global policy using Calico.'
  checks:
  - type: manual_review
    info: Ensure CNI plugin supports network policies.
    severity: medium
- id: 4.4.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: manual
  profile:
  - Level 2
  description: Use network policies to isolate traffic in your cluster network.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. Once there is any Network Policy in a namespace selecting a particular pod, that pod
    will reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected
    by any Network Policy will continue to accept all traffic"
  impact: Once there is any Network Policy in a namespace selecting a particular pod, that pod will reject any connections
    that are not allowed by any Network Policy. Other pods in the namespace that are not selected by any Network Policy will
    continue to accept all traffic"
  references:
  - 1. https://kubernetes.io/docs/concepts/services-networking/networkpolicies/
  - 2. https://octetz.com/posts/k8s-network-policy-apis
  page_start: 88
  audit_raw: 'Run the below command and review the NetworkPolicy objects created in the cluster.

    kubectl get networkpolicy --all-namespaces

    Ensure that each namespace defined in the cluster has at least one Network Policy.'
  remediation: Follow the documentation and create NetworkPolicy objects as you need them.
  checks:
  - type: manual_review
    info: 'Run the below command and review the NetworkPolicy objects created in the cluster.

      kubectl get networkpolicy --all-namespaces

      Ensure that each namespace defined in the cluster has at least one Network Policy.'
    severity: medium
- id: 4.5.1
  title: Prefer using secrets as files over secrets as environment variables
  scoring: manual
  profile:
  - Level 2
  description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment
    variable secrets.
  rationale: It is reasonably common for application code to log out its environment (particularly in the event of an error).
    This will include any secret values passed in as environment variables, so secrets can easily be exposed to any user or
    entity who has access to the logs.
  impact: Application code which expects to read secrets in the form of environment variables would need modification
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2identity-management#im-7-eliminate-unintended-credential-exposure
  page_start: 91
  audit_raw: 'Run the following command to find references to objects which use environment

    variables defined from secrets.

    kubectl get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

    {.metadata.name} {"\n"}{end}'' -A'
  remediation: 'If possible, rewrite application code to read secrets from mounted secret files, rather

    than from environment variables.'
  checks:
  - type: manual_review
    info: 'Run the following command to find references to objects which use environment

      variables defined from secrets.

      kubectl get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

      {.metadata.name} {"\n"}{end}'' -A'
    severity: medium
- id: 4.5.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider the use of an external secrets storage and management system, instead of using Kubernetes Secrets
    directly, if you have more complex secret management needs. Ensure the solution requires authentication to access secrets,
    has auditing of access to and use of secrets, and encrypts secrets. Some solutions also make it easier to rotate secrets.
  rationale: Kubernetes supports secrets as first-class objects, but care needs to be taken to ensure that access to secrets
    is carefully limited. Using an external secrets provider can ease the management of access to secrets, especially where
    secrests are used across both Kubernetes and non-Kubernetes environments.
  impact: None
  references:
  - 1. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2identity-management#im-7-eliminate-unintended-credential-exposure
  page_start: 93
  audit_raw: Review your secrets management implementation.
  remediation: 'Refer to the secrets management options offered by your cloud provider or a third-party

    secrets management solution.'
  checks:
  - type: manual_review
    info: Review your secrets management implementation.
    severity: medium
- id: 4.6.1
  title: Verify that admission controllers are working as expected
  scoring: manual
  profile:
  - Level 1
  description: An admission controller is a piece of code that intercepts requests to the Kubernetes API server prior to persistence
    of the object, but after the request is authenticated and authorized. Admission controllers limit requests to create,
    delete, modify or connect to (proxy). They do not support read requests. The admission control process proceeds in two
    phases. In the first phase, mutating admission controllers are run. In the second phase, validating admission controllers
    are run. Note again that some of the controllers are both. If any of the controllers in either phase reject the request,
    the entire request is rejected immediately and an error is returned to the end-user.
  rationale: If there are problems in the admission control pipeline, it can block a large number of requests to the API server.
