- id: 3.2.7
  title: Ensure that the --hostname-override argument is not set
  scoring: manual
  profile:
  - Level 1
  description: Do not override node hostnames.
  rationale: Overriding hostnames could potentially break TLS setup between the kubelet and the apiserver. Additionally, with
    overridden hostnames, it becomes increasingly difficult to associate logs with a particular node and process them for
    security analytics. Hence, you should setup your kubelet nodes with resolvable FQDNs and avoid overriding the hostnames
    with IPs. Usage of --hostname-override also may have some undefined/unsupported behaviours.
  impact: --hostname-override may not take when the kubelet also has --cloud-provider aws
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://github.com/kubernetes/kubernetes/issues/22063
  page_start: 45
  audit_raw: 'Audit Method 1:

