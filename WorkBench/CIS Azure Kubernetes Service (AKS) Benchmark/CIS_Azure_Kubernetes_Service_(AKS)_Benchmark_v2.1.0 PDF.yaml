- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that cluster-admin access in AKS is granted only to identities with a documented need for full cluster
    administration. This review should cover all Kubernetes RBAC privilege paths, such as ClusterRoleBinding assignments to
    the clusteradmin ClusterRole, and Microsoft Entra ID authorization for the Kubernetes API assignments, such as Azure Kubernetes
    Service RBAC Cluster Admin. It should also cover Azure Kubernetes Service Cluster Admin Role assignments that permit retrieval
    of cluster administrator credentials when local accounts are enabled. Where administrative needs are limited to a namespace,
    application, or team, lower privilege roles and namespace bindings should be used instead of full cluster administrative
    access.
  rationale: This control supports least privilege in the highest risk portion of the AKS authorization model. AKS provides
    built in Reader, Writer, Admin, and Cluster Admin roles so permissions can be limited to operational need rather than
    defaulting to full cluster authority. Kubernetes guidance reinforces the same principle by recommending minimal RBAC permissions
    for users and service accounts and favoring namespace permissions where possible. The Azure Kubernetes Service RBAC Cluster
    Admin role permits any action on every Kubernetes resource. Azure assignments inherited from a resource group, subscription,
    or management group can extend this authority to multiple current and future AKS clusters and must also be reviewed. Excessive
    RBAC privileges in Kubernetes can create direct or indirect escalation paths. The Azure Kubernetes Service RBAC Writer
    role can access Secrets and run Pods as any service account in the namespace, allowing the assignee to obtain that service
    account’s API permissions. Kubernetes also documents broader escalation risks associated with powerful permissions and
    cluster bindings. Because AKS may authorize Microsoft Entra identities through Azure RBAC while service accounts are authorized
    through Kubernetes RBAC, controlling cluster-admin use is necessary to keep privileged access exceptional, auditable,
    and limited. Kubernetes RBAC permissions are additive and do not include deny rules, so a restrictive binding does not
    offset a separate cluster-admin grant. Page 66
  impact: If cluster-admin is assigned too broadly a compromised user, group, service principal, or service account can move
    from limited operational access to effective control over the entire cluster. That can allow unauthorized changes to RBAC
    policy, workloads, Secrets, admission controls, and other cluster resources across namespaces, increasing the likelihood
    that a single credential exposure, misconfiguration, or automation error becomes a security or availability incident affecting
    the entire cluster. Removing a broad administrator grant without first providing required replacement permissions can
    interrupt administrative commands, deployment automation, controllers, and support procedures. Assign the necessary lower
    privilege role before removing cluster-admin access, and allow up to five minutes for a new Azure role assignment to propagate.
    Page 67
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 66
  audit_raw: "This audit statement identifies the principals that are granted the Kubernetes clusteradmin role by reviewing\
    \ ClusterRoleBinding assignments in the AKS cluster. It\nfilters the binding output to show each binding name and the\
    \ associated user, group, or\nservice account, allowing the reviewer to determine which identities have unrestricted\n\
    cluster administrative access.\nkubectl get clusterrolebindings -o json | jq -r '\n ([\"BINDING\",\"KIND\",\"NAMESPACE\"\
    ,\"NAME\"] | join(\" | \")),\n (\n .items[]\n | select(.roleRef.name==\"cluster-admin\")\n | .metadata.name as $binding\n\
    \ | (.subjects // [])[]\n | [$binding, .kind, (.namespace // \"-\"), .name]\n | join(\" | \")\n )\n'\nExample output with\
    \ headers and piped separation of values. Review each principal\nlisted and ensure that cluster-admin privilege is required\
    \ for it.\nBINDING | KIND | NAMESPACE | NAME\naks-cluster-admin-binding | User | - | clusterAdmin\naks-cluster-admin-binding\
    \ | User | - | clusterUser\ncluster-admin | Group | - | system:masters\ncustom-cluster-admin | ServiceAccount | kube-system\
    \ | admin-sa"
  remediation: "Review all ClusterRoleBinding objects that grant access to the Kubernetes\ncluster-admin role and identify\
    \ the users, groups, or service accounts associated\nwith each binding. Validate whether each principal still requires\
    \ full cluster-wide\nadministrative access or whether its responsibilities can be met through a lowerprivileged role,\
    \ preferably a namespace-scoped Role/RoleBinding or a more limited\nClusterRole, in accordance with AKS and Kubernetes\
    \ least-privilege guidance.\nWhere full administrative access is not required, first assign the principal to an approved\n\
    lower-privilege role and confirm that required operational tasks continue to function as\nexpected. After the replacement\
    \ access has been validated, remove the unnecessary\ncluster-admin binding to reduce the risk of privilege escalation\
    \ and cluster-wide\nmisuse.\nkubectl delete clusterrolebinding [name]\n Page 68"
