    info: 'Review each AKS cluster to determine how the Kubernetes API server is exposed and

      whether network restrictions are configured appropriately. Specifically, verify whether

      the cluster is deployed as a private cluster, whether a public FQDN remains enabled for

      that private cluster, and whether authorized IP ranges are configured on any public API

      server endpoint. For AKS, authorized IP ranges apply t'
- id: 5.4.2
  title: Use private AKS clusters and disable the public API server FQDN
  scoring: scored
  profile:
  - Level 2
  description: Provisioning AKS in private cluster mode limits control plane exposure by placing the Kubernetes API server
    on private addressing and requiring connectivity through approved private network paths rather than broad public network
    access. In this design, AKS creates the required private connectivity and DNS configuration needed for internal name resolution,
    and the public FQDN can also be disabled when the security requirement is to prevent the control plane from publishing
    any public DNS name. This reduces the external attack surface of the cluster management plane and aligns API server access
    to approved private network paths only.
  rationale: Because the AKS API server is public by default, provisioning the cluster in private cluster mode materially
    reduces control plane exposure by shifting API server access from internet routable paths to private addressing and private
    DNS resolution. Private Link based clusters use a private endpoint, while clusters with API Server VNet Integration use
    an internal load balancer address in the delegated API server subnet. This constrains administrative access to approved
    internal network paths and reduces dependence on public endpoint protections alone. Disabling the public FQDN provides
    additional hardening because private AKS clusters otherwise publish both private and public DNS names by default. A public
    FQDN on a private cluster is only a publicly resolvable name and does not create a public API endpoint.
  impact: Private AKS clusters require all administrative access, automation, and API integrations to use approved private
    network paths and private DNS resolution to reach the Kubernetes API server. This can require updates to network routing,
    DNS forwarding, jump host or VPN design, CI/CD runner placement, and access methods for dependent services that manage
    or interact with the cluster control plane. Azure DevOps Microsoft hosted agents are not supported for private clusters,
    so pipelines require self hosted agents on a connected network or another supported private access method. Page 179
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/private-clusters
  - 2. https://learn.microsoft.com/en-us/azure/aks/api-server-vnet-integration
  page_start: 179
  audit_raw: "Review the AKS cluster apiServerAccessProfile to confirm the control plane is\ndeployed as a private AKS cluster\
    \ and that the public FQDN is disabled when the\nsecurity standard requires no public DNS name for the Kubernetes API\
    \ server. A private\nAKS cluster uses internal IP addressing for the API server. Private Link based clusters\nuse a private\
    \ endpoint, while API Server VNet Integration places the API server behind\nan internal load balancer address in a delegated\
    \ subnet. In addition, private AKS\nclusters create both private and public FQDNs by default unless the public FQDN is\n\
    explicitly disabled.\naz aks show \\\n --name \"${CLUSTER_NAME}\" \\\n --resource-group \"${RESOURCE_GROUP}\" \\\n --query\
    \ \"{enablePrivateCluster:apiServerAccessProfile.enablePrivateCluster,\nenablePublicFqdn:apiServerAccessProfile.enablePublicFqdn,\n\
    authorizedIpRanges:apiServerAccessProfile.authorizedIpRanges}\" \\\n --output json\nOutput should be similar to:\n{\n\
    \ \"enablePrivateCluster\": true,\n \"enablePublicFqdn\": false,\n \"authorizedIpRanges\": null\n}\n• enablePrivateCluster\
    \ should be true to show the cluster is deployed in\nprivate cluster mode. Microsoft states that a private cluster API\
    \ server uses\ninternal IP addresses. The exact private connection method depends on whether\nthe cluster uses Private\
    \ Link or API Server VNet Integration.\n• enablePublicFqdn should be false when the requirement is to prevent the\nAPI\
    \ server from publishing a public DNS name. Microsoft documents that private\nAKS clusters create both private and public\
    \ FQDNs by default unless the public\nFQDN is disabled.\n• authorizedIpRanges is not the primary compliance check for\
    \ this control.\nMicrosoft states that authorized IP ranges apply only to the public API server\nendpoint and cannot be\
    \ used with private clusters.\n• If enablePrivateCluster is false, the cluster does not meet this control\nbecause the\
    \ API server is not restricted to private cluster connectivity.\n• If enablePrivateCluster is true but enablePublicFqdn\
    \ is also true, the\ncluster is private but still publishes a public DNS name, so it would not meet a\nstricter requirement\
    \ that public control plane naming be disabled. This does not\nmean the private cluster has a public API endpoint.\n Page\
    \ 180"
  remediation: 'Use the apiServerAccessProfile results to determine whether the cluster must be

    moved to private cluster mode and whether the public FQDN must be disabled.

    Remediation should bring the cluster to enablePrivateCluster: true and, where

    required by policy, enablePublicFqdn: false; the detailed action depends on

    whether the cluster is new or existing and whether API Server VNet Integration is

    already in place.

    1. If enablePrivateCluster is false on a new deployment, create the cluster

    as private by using az aks create --enable-private-cluster add --

    disable-public-fqdn when the requirement is to prevent publication of a

    public DNS name for the API server.

    2. If enablePrivateCluster is false on an existing cluster, first determine

    whether the cluster already uses API Server VNet Integration. Microsoft states

    that clusters with API Server VNet Integration can have private cluster mode

    enabled without redeployment; the documented update path is az aks update

    --enable-private-cluster --enable-apiserver-vnet-integration

    --apiserver-subnet-id <subnet-id>.

    3. If API Server VNet Integration must be enabled on an existing cluster first, plan

    for the documented operational effects: the feature is permanent, requires an

    immediate cluster restart after enablement, performs a rolling node image

    upgrade, and can change the API server IP address even though the hostname

    stays the same.

    4. If enablePrivateCluster is true but enablePublicFqdn is true, disable

    the public FQDN by running az aks update --disable-public-fqdn

    against the private cluster.

    5. After remediation, rerun the audit command and confirm

    enablePrivateCluster is true and enablePublicFqdn is false then

    validate that private DNS resolution and approved private network paths can still

    reach the API server.'
