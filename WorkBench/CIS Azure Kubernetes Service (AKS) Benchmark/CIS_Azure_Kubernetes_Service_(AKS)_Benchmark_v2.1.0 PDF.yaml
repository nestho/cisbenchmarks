- id: 4.1.8
  title: Minimize access to create persistent storage
  scoring: manual
  profile:
  - Level 1
  description: Permission to create persistent storage in AKS is granted only where it is required. This includes direct creation
    of PersistentVolume objects and, more commonly, creation of PersistentVolumeClaim objects that reference an existing StorageClass
    and cause a CSI driver to provision an Azure Disk, Azure Files share, or other supported storage resource. Creating a
    StorageClass is a separate administrative action that defines provisioning options. For service accounts, this remains
    an RBAC concern because AKS uses Kubernetes RBAC to grant access to Kubernetes resources, Kubernetes service accounts
    continue to rely on Kubernetes RBAC.
  rationale: 'Minimizing this access is important because persistent volumes in AKS are durable resources that can outlive
    individual pods, and dynamic provisioning can automatically create backing Azure storage when a claim is submitted. Microsoft’s
    AKS storage guidance states that a PV can exist beyond the lifetime of a pod, that dynamic provisioning uses a storage
    class to determine what resource to create, and that the Azure Disk and Azure Files CSI drivers manage the lifecycle of
    those Azure storage resources. The reclaim policy determines whether backing storage is deleted or retained after the
    claim is released, so storage creation permissions can also affect data retention. As a result, storage creation rights
    are more sensitive than ordinary workload write access: they can allocate durable storage, influence performance tier
    and storage type, and establish new data persistence paths inside the cluster.'
  impact: If access to create persistent storage is granted too broadly in AKS, a user or service account can provision durable
    storage resources that remain beyond pod termination and can consume Azure storage capacity and related resources without
    a justified need. In clusters using dynamic provisioning, that can result in automatic creation of Azure disks or file
    shares, expansion of the data footprint of a workload, and additional opportunities for unintended data retention, data
    exposure, or cost growth. A Retain reclaim policy can preserve the backing storage and its data after a claim is deleted,
    requiring separate administrative cleanup. Where those permissions are held by service accounts, a compromised workload
    can use them to establish new persistent storage for data staging, log retention, or other unauthorized cluster activity.
    Page 87
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-storage
  - 2. https://learn.microsoft.com/en-us/azure/aks/azure-csi-disk-storage-provision
  page_start: 87
  audit_raw: 'Review AKS RBAC to identify any users, groups, or service accounts that can create

    PersistentVolume, PersistentVolumeClaim, or StorageClass resources.

    Review the applicable Kubernetes Role, ClusterRole, RoleBinding, and

    ClusterRoleBinding objects. If Microsoft Entra ID authorization for the Kubernetes

    API is enabled, also review Azure role assignments and custom roles that grant these

    permissions. Treat PersistentVolumeClaim creation as a storage provisioning path

    because a claim can trigger dynamic provisioning through an existing StorageClass.

    Review PersistentVolume and StorageClass creation separately because they

    are cluster administrative permissions.'
  remediation: 'Remove persistent storage creation rights from any user, group, or service account that

    does not require them, and replace broad assignments with the role that provides only

    the required permissions and scope possible. Limit direct PersistentVolume and

    StorageClass administration to approved administrators, and allow workloads to to

    create PersistentVolumeClaim objects only in the required namespace. Kubernetes

    RBAC does not restrict which existing StorageClass a principal can name in a claim. If

    workloads must be limited to approved storage classes, enforce that requirement

    through an admission policy, such as Azure Policy for Kubernetes. After changes are

    made, verify that required applications can still provision storage through the intended

    AKS CSI driver path.'
  checks:
  - type: manual_review
    info: 'Review AKS RBAC to identify any users, groups, or service accounts that can create

      PersistentVolume, PersistentVolumeClaim, or StorageClass resources.

      Review the applicable Kubernetes Role, ClusterRole, RoleBinding, and

      ClusterRoleBinding objects. If Microsoft Entra ID authorization for the Kubernetes

      API is enabled, also review Azure role assignments and custom roles that grant these

      permissions. Treat PersistentVolumeClaim creation as a storage provisioning path

      because a claim can trigger dyn'
    severity: medium
- id: 4.1.9
  title: Minimize access to the nodes/proxy subresource
  scoring: manual
  profile:
  - Level 1
  description: Review AKS authorization to ensure access to the nodes/proxy subresource is granted only to identities with
    a documented operational need. Review Kubernetes ClusterRole and ClusterRoleBinding objects, service accounts that receive
    this access, and applicable Azure role assignments when Azure RBAC for Kubernetes authorization is enabled. A namespace
    Role or RoleBinding cannot grant effective access to nodes/proxy because Node objects are cluster resources.
  rationale: Limiting nodes/proxy access is important because the Kubernetes API server proxies an authorized request to the
    kubelet API. Microsoft has documented that GET access to nodes/proxy can be used over WebSockets to execute commands in
    pods on a reachable node because the kubelet authorizes the initial GET request without a second authorization check for
    the CREATE verb normally associated with /exec, /run, /attach, and /portforward. The API server can record the initial
    proxy request, but it does not provide a separate Kubernetes API audit event for each operation performed through the
    proxied kubelet connection. Admission controls also do not reevaluate each kubelet operation. Current AKS releases use
    narrower node permissions for the managed Container Insights addon, but customer managed nodes/proxy access must still
    be restricted.
  impact: If nodes/proxy access is granted too broadly in AKS, a user or service account can reach kubelet API functions beyond
    its intended responsibilities. This can include command execution in pods on a reachable node through /exec, /run, /attach,
    or /portforward. A compromised identity could access workload data, alter running processes, disrupt applications, or
    move beyond its intended namespace. Because only the initial proxy request is visible to Kubernetes API auditing, an investigation
    might not have a separate audit event for every action performed through the connection. Page 90
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/security-bulletins/overview
  - 2. https://learn.microsoft.com/en-us/azure/aks/node-access
  page_start: 90
  audit_raw: "working\nReview custom Kubernetes ClusterRole and ClusterRoleBinding objects that\ngrant access to the nodes/proxy\
    \ subresource. Include rules that grant nodes/proxy\ndirectly or through resource wildcards such as nodes/* or *. Confirm\
    \ that each\nassignment is required for an approved troubleshooting, maintenance, or platform\nadministration function.\n\
    If Azure RBAC for Kubernetes authorization is enabled, also review direct and inherited\nAzure role assignments and custom\
    \ roles that permit this resource or all Kubernetes\nresources.\nThe following command returns the name, resource type,\
    \ and allowed verbs for custom\nClusterRole objects that grant this access. It excludes default bootstrapped roles and\n\
    names beginning with system:. Review the ClusterRoleBinding objects that\nreference each returned role to identify the\
    \ users, groups, or service accounts that\nreceive it.\nkubectl get clusterroles -o json | jq -r '\n .items[]\n | select(.metadata.labels[\"\
    kubernetes.io/bootstrapping\"] != \"rbac-defaults\")\n | select(.metadata.name | startswith(\"system:\") | not)\n | select(any(.rules[]?;\
    \ any(.resources[]?; .==\"nodes/proxy\" or .==\"nodes/*\"\nor .==\"*\")))\n | [\n \"ClusterRole\",\n \"-\",\n .metadata.name,\n\
    \ \"verbs=\" + (\n [.rules[]?\n | select(any(.resources[]?; .==\"nodes/proxy\" or .==\"nodes/*\" or .==\"*\"))\n | .verbs[]?\n\
    \ ] | unique | join(\",\")\n )\n ]\n | @tsv\n'\nExample output:\nClusterRole - aks-service\nverbs=create,delete,get,list,patch,update,watch\n\
    \ Page 91"
  remediation: 'Reduce custom RBAC access to the nodes/proxy API path so it is limited to

    approved administrative identities that require kubelet access.

    • Remove nodes/proxy, nodes/*, or applicable wildcard rules from any custom

    ClusterRole that does not require kubelet proxy access.

    • Where node data is still required, use the narrower node subresource and verbs

    supported by the current AKS release instead of nodes/proxy.

    • Remove any ClusterRoleBinding that grants this access to a workload

    service account, CI/CD identity, or operator group without an approved

    requirement.

    • Remove equivalent Azure role assignments or custom role permissions when

    Azure RBAC for Kubernetes authorization is enabled.

    • Keep the cluster on a supported AKS release so managed add-ons use current

    node permissions, and do not modify AKS managed RBAC objects.

    • Document the purpose and owner of each approved exception, then verify that

    required support tasks still work and no unnecessary assignment retains

    nodes/proxy access.'
  checks:
  - type: manual_review
    info: 'working

      Review custom Kubernetes ClusterRole and ClusterRoleBinding objects that

      grant access to the nodes/proxy subresource. Include rules that grant nodes/proxy

      directly or through resource wildcards such as nodes/* or *. Confirm that each

      assignment is required for an approved troubleshooting, maintenance, or platform

      administration function.

      If Azure RBAC for Kubernetes authorization is enabled, also review direct and inherited

      Azure role assignments and custom roles that permit this resourc'
    severity: medium
- id: 4.1.10
  title: Minimize access to the approval subresource of CertificateSigningRequests objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to the approval subresource of CertificateSigningRequests objects so that only tightly controlled
    administrative identities can approve certificate requests in AKS. AKS uses certificates for component authentication,
    and uses CSRs as part of kubelet client certificate bootstrap and rotation, AKS authorization is intentionally granular
    and is meant to give users, groups, and service accounts access only to the resources they require. In practice, this
    means CSR approval authority should not be broadly included in general purpose cluster roles, namespace admin roles, or
    workload identities.
  rationale: It is important to preserve the integrity of the AKS trust chain and keep certificate issuance under strict administrative
    control. Microsoft recommends securing API server access with the lowest possible permission levels, and AKS RBAC is designed
    to scope permissions precisely across cluster and namespace boundaries. The update on the certificatesigningrequests/approval
    subresource permits an identity to approve or deny a CSR. Approval alone does not issue a certificate. A signer must issue
    the certificate, and Kubernetes RBAC determines the permissions of the resulting identity. Limiting CSR approval therefore
    keeps certificate trust separate from ordinary workload and namespace operations.
  impact: If access is not minimized, the blast radius of an RBAC mistake in AKS grows significantly. A compromised identity
    could approve a malicious CSR. If an authorized signer issues the requested client certificate, it could be used to authenticate
    to the Kubernetes API with the permissions assigned to the resulting identity. Operationally, restricting this access
    improves separation of duties, reduces the number of identities that can affect cluster authentication state, and makes
    audit review of highly privileged RBAC assignments more defensible in AKS. Removing access required by an approved certificate
    workflow can interrupt kubelet bootstrap, certificate rotation, or a custom certificate process. Page 93
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/certificate-rotation
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  page_start: 93
  audit_raw: 'Audit this control by reviewing how privileged access is actually granted across the AKS

    authorization model and then verifying that CSR approval authority is limited to a very

    small set of approved administrative identities. This is not a discrete platform setting. It

    is a least privilege review across Microsoft Entra integration, Kubernetes RBAC, and,

    where enabled, Azure RBAC for Kubernetes Authorization. The review should confirm

    whether any ClusterRole can approve the CertificateSigningRequests approval

    subresource, whether that privilege is granted to users, groups, or service accounts that

    do not require it.

    • Determine whether access is governed by Kubernetes RBAC, Azure RBAC for

    Kubernetes Authorization, or both.

    • Review ClusterRole rules for the

    certificatesigningrequests/approval subresource.

    • Trace any matching rules through ClusterRoleBinding assignments to the

    exact users, groups, and service accounts that receive them.

    • Confirm the permission is restricted to tightly controlled cluster-admin

    identities and not exposed through broad custom roles or workload identities.

    If Azure RBAC for Kubernetes Authorization is enabled, review Azure role assignments

    and custom roles that permit CSR write operations.'
  remediation: 'Remediate this control by removing certificatesigningrequests/approval

    access from any ClusterRole that is not explicitly required for cluster certificate

    administration, then rebind that capability only to tightly controlled AKS administrative

    identities. The preferred model is to use Microsoft Entra integration with least privilege

    Kubernetes RBAC and, where enabled, Azure RBAC for Kubernetes Authorization while

    limiting cluster permissions to approved identities.

    If Azure RBAC for Kubernetes Authorization is enabled, remove unnecessary Azure role

    assignments or CSR write permissions from custom roles. Finally, validate that only

    expected AKS certificate workflows, such as kubelet TLS bootstrapping and rotation,

    continue to generate approved CSRs after permissions are tightened. Do not modify

    AKS managed system roles or bindings.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing how privileged access is actually granted across the AKS

      authorization model and then verifying that CSR approval authority is limited to a very

      small set of approved administrative identities. This is not a discrete platform setting. It

      is a least privilege review across Microsoft Entra integration, Kubernetes RBAC, and,

      where enabled, Azure RBAC for Kubernetes Authorization. The review should confirm

      whether any ClusterRole can approve the CertificateSigningRequ'
    severity: medium
- id: 4.1.11
  title: Minimize access to webhook configuration objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to webhook configuration objects so that only tightly controlled cluster administrative identities
    can create, update, or delete ValidatingWebhookConfiguration and MutatingWebhookConfiguration resources in AKS. Admission
    controllers run after authentication and authorization but before an object is persisted, and Microsoft’s AKS documentation
    shows that webhook configurations define the webhook service endpoint and related trust material used by the API server.
    These objects can govern validation and mutation behavior used by components such as Azure Policy / Gatekeeper, service
    mesh injectors, and other admission integrations, so they should not be broadly writable by general users, namespace operators,
    or workload service accounts. Users with rights to create, update, patch, or delete validatingwebhookconfigurations or
    mutatingwebhookconfigurations can control webhooks that receive matching admission requests. Mutating webhooks can also
    modify matching objects before they are persisted.. This could allow for privilege escalation or disruption of the operation
    of the cluster.
  rationale: 'Preserve the integrity of the AKS admission path and prevent non-administrative identities from changing how
    the API server evaluates or mutates requests. Microsoft’s AKS identity guidance states that Kubernetes RBAC should grant
    users, groups, and service accounts only the resources they need, and that service accounts continue to rely on normal
    Kubernetes RBAC even when Azure RBAC for Kubernetes Authorization is enabled for Microsoft Entra identities. Because webhook
    configuration objects determine which requests are intercepted and which service in the cluster service receives those
    admission callbacks, broad write access creates a privilege boundary issue: a compromised user or service account with
    webhook configuration permissions could alter policy enforcement behavior or redirect admission processing in ways that
    exceed its intended operational role. Write access can change webhook rules, selectors, clientConfig, caBundle, and failurePolicy,
    which control request matching, endpoint trust, and API server behavior when the webhook is unavailable. Page 96'
  impact: If access is not minimized, the impact in AKS is both security and operational. Microsoft documents that unhealthy
    admission controllers can block API server requests, and AKS specifically warns that overly broad webhook rules or webhook
    configurations that apply to AKS-managed cluster resources such as nodes, leases, or clusterroles can cause operations
    like cluster stop to fail with ValidationError. In practice, unnecessary access to webhook configuration objects can therefore
    lead to rejected or unexpectedly modified resource admissions, disruption of policy enforcement or sidecar injection workflows,
    and instability in cluster lifecycle or platform operations that depend on predictable admission behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/start-stop-cluster
  - 2. https://learn.microsoft.com/en-us/azure/architecture/operator-guides/aks/akstriage-controllers
  page_start: 96
  audit_raw: "Audit this control by identifying who can modify cluster webhook configuration resources\nand confirming that\
    \ webhook definitions are limited to approved admission use cases in\nAKS. The review should verify that ValidatingWebhookConfiguration\
    \ and\nMutatingWebhookConfiguration objects are present only where operationally\nrequired, that their coverage is not\
    \ broader than necessary, and that access to manage\nthem is restricted through least privilege RBAC. Microsoft’s AKS\
    \ guidance also warns\nthat misconfigured admission webhooks can disrupt cluster operations, especially when\nthey apply\
    \ too broadly or affect AKS managed resources.\n• Identify whether cluster access is governed through Kubernetes RBAC\
    \ alone or\nalso through Azure RBAC for Kubernetes Authorization.\n• Review ClusterRole rules roles for permissions on\n\
    validatingwebhookconfigurations and\nmutatingwebhookconfigurations.\n• Trace those permissions through ClusterRoleBinding\
    \ objects to the exact users,\ngroups, and service accounts that receive them.\n• If Azure RBAC for Kubernetes Authorization\
    \ is enabled, review Azure role\nassignments and custom roles that permit webhook configuration write or delete\noperations.\n\
    • Review existing webhook configurations to confirm their rules, selectors, and\nscope are narrowly defined and do not\
    \ target AKS managed namespaces or\nresources.\nkubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations\
    \ -o wide\nThis command retrieves all validating and mutating admission webhook configuration\nobjects in the cluster\
    \ and provides an inventory of the configured webhooks. Review an\nindividual object in YAML to evaluate its rules, selectors,\
    \ endpoint, trust material, and\nfailure behavior.\n Page 97"
  remediation: 'Remediate this control by removing permission to create, update, patch, or delete

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration

    objects from broad ClusterRole assignments, and then rebinding that access only to

    tightly controlled cluster administrative identities. Use least privilege Kubernetes RBAC

    and, where enabled, Azure RBAC for Kubernetes Authorization, with access granted

    through centrally managed identity groups rather than widely distributed individual

    assignments.

    Service account permissions should be reviewed as part of the same effort so workload

    identities do not inherit cluster webhook management capability. Remove unnecessary

    Azure role assignments or webhook configuration permissions from custom roles when

    Azure RBAC for Kubernetes Authorization is enabled. Review each webhook

    configuration and narrow its match criteria to only the required namespaces, resources,

    and operations. Avoid broad webhook rules, exclude AKS internal namespaces and

    managed resources, and keep webhook backends healthy so admission processing

    does not disrupt API server requests or normal cluster lifecycle operations. Do not

    directly modify AKS managed webhook configurations.'
  checks:
  - type: manual_review
