- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Verify that service account tokens in AKS are mounted only for pods that require Kubernetes API access or an
    explicitly configured workload identity flow. Confirm that pods and service accounts are not broadly relying on default
    token mounting, and that token projection is limited to workloads with a defined operational need. Azure Policy includes
    an AKS definition that can set automountServiceAccountToken to false, and workload identity guidance requires explicit
    pod labeling for token projection.
  rationale: 'Limiting service account token mounts is important because a mounted token is an authentication credential.
    Unless mounting is disabled, Kubernetes can project a short lived token into a Pod that authenticates to the Kubernetes
    API server as the associated service account, and AKS policy guidance states that setting automountServiceAccountToken
    to false increases security by avoiding default token automatic mounting. AKS workload identity guidance reinforces the
    same principle by making projected service account tokens explicit rather than automatic. Microsoft documents that pods
    must be labeled azure.workload.identity/use: "true" for the workload identity webhook to inject the projected token volume
    and Azure specific environment variables, which supports treating token mounting as an intentional workload requirement
    rather than a default behavior.'
  impact: When service account tokens are mounted more broadly than necessary in AKS, more pods than required receive credentials
    that can authenticate to the Kubernetes API with the permissions granted to the associated service account. That increases
    the number of workloads from which API access could be exercised if a pod is compromised or misconfigured, and it weakens
    workload separation by exposing credentials to pods that do not need them. Projected tokens are short lived, but a compromised
    pod can use a mounted token while it remains valid. Page 81
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  page_start: 81
