    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from "kubectl

    get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: "If an audit shows RotateKubeletServerCertificate set to false or blank, the\npreferred remediation method\
    \ is to replace the affected node pool with a new pool and\nlet the kubelet come up through the normal AKS-managed bootstrap\
    \ path, rather than\ntrying to update the setting manually into existing nodes. This is preferred because the\nkubelet\
    \ serving certificate rotation in Kubernetes is tied to serverTLSBootstrap, which\nmoves the kubelet away from a self-signed\
    \ serving certificate and into the CSR-based\ncertificate workflow, while AKS treats kubelet serving certificate rotation\
    \ as a managed\nplatform capability on supported node pools. In addition, replacing the node pool gives\nyou a consistent,\
    \ repeatable way to bring every node up through the same managed\ncertificate path.\nThe rebuilding the node pool supports\
    \ durability and consistency:\n Page 63\n• AKS applies kubelet and OS tuning through node-pool provisioning and a\ndocumented\
    \ subset of supported node configuration, rather than through ad hoc\nmanual changes.\n• A manual edit to /etc/default/kubelet\
    \ is not recommended because that\nfile feeds KUBELET_EXTRA_ARGS, which Kubernetes describes as a last-resort\noverride\
    \ that is applied last and therefore has the highest priority over conflicting\nwith kubelet settings.\n• Running az aks\
    \ nodepool update is not a reliable fix for this control\nbecause kubelet serving certificate rotation is handled by AKS\
    \ as a managed\ncapability, not as a normal kubelet setting you manually toggle.\n• Replacing the node pool is more reliable\
    \ method because all new nodes are\nrebuilt through the same managed bootstrap path, which keeps servingcertificate behavior\
    \ consistent across the pool.\nImportant: Directly editing /etc/default/kubelet may appear to work temporarily,\nbut it\
    \ is a poor solution because it bypasses the normal managed lifecycle and relies on\na high-priority local override. For\
    \ RotateKubeletServerCertificate specifically,\nthat is especially problematic because the setting relates to the kubelet’s\
    \ serving-side\nTLS identity and CSR flow, so a one-off manual edit can leave one node behaving\ndifferently from the\
    \ rest of the pool while future replacement nodes come up using the\nmanaged AKS behavior instead."
