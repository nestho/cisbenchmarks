    \ cluster scope. If Azure RBAC for\nKubernetes Authorization is enabled, also review Azure role assignments at the\ncluster\
    \ and namespace scopes.\n• Review whether controls within each namespace controls such as quotas and\nnetwork policies\
    \ are applied where required.\nQuick inventory checks:\nkubectl get namespaces\nkubectl get rolebindings,roles -A\nkubectl\
    \ get clusterrolebindings,clusterroles\nkubectl get resourcequota,networkpolicy -A\nA namespace should be considered adequately\
    \ administered only when it has a clear\npurpose, appropriately scoped RBAC, and the controls needed for that workload\
    \ or\nteam.\n Page 138"
  remediation: 'Microsoft recommends namespaces as the logical isolation boundary for workloads and

    resources in shared clusters, combined with governance within each namespace

    governance such as quotas and network policies; where stronger tenant isolation is

    required, Microsoft recommends separate clusters rather than relying on namespaces

    alone.

    1. Create separate namespaces for each team, application, or environment that

    requires its own administrative scope.

    2. Move user workloads out of the default namespace and into the appropriate

    namespace.

    3. Rebind access using Role and RoleBinding objects in the required namespace,

    or Azure RBAC assignments limited to the required namespace where

    applicable.

    4. Apply namespace-level controls such as resource quotas and network policies to

    reinforce the administrative boundary.

    5. Remove unused namespacesonly after confirming they contain no required

    resources and reduce permissions that apply throughout the cluster that bypass

    intended namespace separation.'
  checks:
  - type: manual_review
    info: 'Verify that namespaces are not only present, but are being used as intentional

