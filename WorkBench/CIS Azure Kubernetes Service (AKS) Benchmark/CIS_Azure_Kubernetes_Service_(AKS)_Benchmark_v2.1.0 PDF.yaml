    : \"overlay\",\n \"networkPolicy\": \"azure\"\n}\nThis command returns the key AKS network profile fields needed to determine\
    \ whether\nthe cluster is using Azure CNI Overlay. The network policy and data plane fields provide\nadditional network\
    \ context.\n Page 123"
  remediation: 'Migrate the cluster to Azure CNI Overlay if it is still using Kubenet or Azure CNI Node

    Subnet, and complete the change through supported AKS upgrade paths. Microsoft

    documents a single forward only migration path to Azure CNI Overlay for existing

    clusters, and if Azure CNI Powered by Cilium is also required, the IPAM mode update to

    Overlay and the data plane update to Cilium must be performed as separate operations.

    The migration to Overlay is irreversible, so validate the migration prerequisites, pod and

    service CIDRs, and application connectivity before making the change.

    • Review the current networkProfile to identify the active network plugin,

