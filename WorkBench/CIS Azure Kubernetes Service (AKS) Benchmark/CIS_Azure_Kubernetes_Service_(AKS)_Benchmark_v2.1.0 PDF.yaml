- id: 5.2.1
  title: Use dedicated Kubernetes service accounts for AKS workloads
  scoring: manual
  profile:
  - Level 1
  description: It is important to use dedicated Kubernetes service accounts in AKS so identity, permissions, and token use
    are isolated to the specific workload that requires them, rather than shared across unrelated pods. Kubernetes service
    accounts remain a core Kubernetes identity construct and also serve as the anchor for Microsoft Entra Workload ID, which
    allows access to Kubernetes and Azure resources to be scoped per workload.
  rationale: Using dedicated service accounts supports least privilege by allowing each AKS workload to receive only the Kubernetes
    RBAC permissions and Azure access it actually requires, instead of sharing identity and permissions through a common account.
    It also helps limit token exposure and lateral movement, because a pod can use its mounted service account token with
    the permissions assigned to that service account. Kubernetes normally uses projected, time limited service account tokens
    for pods, and unnecessary token mounting increases the number of workloads that carry usable credentials.
  impact: This approach adds per workload identity configuration, because each application may need its own service account,
    RBAC binding, and, if it accesses Azure resources, Microsoft Entra Workload ID configuration, including an enabled OIDC
    issuer and Workload ID feature on the cluster, a service account annotation, the required pod label, and a federated identity
    credential. If those settings are incomplete, workloads can fail to authenticate or access required resources. Page 165
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  page_start: 165
  audit_raw: "For each namespace, verify that workloads do not use the default service account\nunless required, and confirm\
    \ that the default service account has no custom role\nbindings beyond baseline defaults. Review workload-specific service\
    \ accounts to\nensure permissions are scoped with least privilege, and confirm\nautomountServiceAccountToken is disabled\
    \ where token access is not needed.\n• Review each namespace for pods and workload controllers that use the\ndefault service\
    \ account, and flag any use that is not explicitly required,\nbecause dedicated service accounts are the workload identity\
    \ boundary in AKS.\n• Review RoleBinding and ClusterRoleBinding assignments for the\ndefault service account and confirm\
    \ it has no custom permissions beyond\nbaseline defaults; then verify workload-specific service accounts are bound only\n\
    to the minimum required RBAC roles.\n• Check service accounts and pod specs for unnecessary token exposure, and\nconfirm\
    \ automountServiceAccountToken is set to false where a workload\ndoes not need a service account token.\n• For workloads\
    \ that access Azure resources, verify they use a dedicated\nKubernetes service account with the expected workload identity\
    \ configuration,\nincluding an enabled OIDC issuer and Workload ID feature, the required pod\nlabel, service account annotation\
    \ and federated identity mapping, rather than a\nshared or default account.\nUse this simple inventory command to identify\
    \ the service account used by each\nrunning pod:\nkubectl get pods -A -o customcolumns=\"NAMESPACE:.metadata.namespace,POD:.metadata.name,SERVICEACCOUNT:.spec.serv\n\
    iceAccountName\"\n Page 166"
  remediation: 'Use a dedicated Kubernetes service account for each AKS workload that requires

    identity, and replace use of the namespace default service account wherever it is not

    explicitly required. Scope each service account to only the Kubernetes permissions and

    Azure resource access needed by that workload, and prevent service account tokens

    from being mounted into pods unless token access is required.

    1. Create a separate Kubernetes service account for each workload or application

    boundary that requires distinct access.

    2. Bind each service account only to the minimum required Kubernetes Role or

    ClusterRole, and avoid granting custom permissions to the namespace

    default service account. Prefer a RoleBinding in the required namespace when

    permissions do not need to apply throughout the cluster.

    3. Set automountServiceAccountToken: false for pods that do not need a

    service account token.

    4. If a workload needs access to Azure resources, enable the AKS OIDC issuer and

    Microsoft Entra Workload ID, create the federated identity credential, and

    annotate the dedicated service account for that workload. Apply the

    azure.workload.identity/use: "true" label to the pod template.

    5. Update Deployments, StatefulSets, CronJobs, and other controllers so they

    reference the intended dedicated service account through

    spec.serviceAccountName.'
  checks:
  - type: manual_review
    info: 'For each namespace, verify that workloads do not use the default service account

      unless required, and confirm that the default service account has no custom role

      bindings beyond baseline defaults. Review workload-specific service accounts to

      ensure permissions are scoped with least privilege, and confirm

      automountServiceAccountToken is disabled where token access is not needed.

      • Review each namespace for pods and workload controllers that use the

      default service account, and flag any use that i'
    severity: medium
- id: 5.3.1
  title: Encrypt Kubernetes Secrets at rest with AKS KMS protection
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Secret data stored by AKS in etcd must be protected with encryption at rest, and, when additional
    KMS protection is required, that protection should be implemented through the AKS KMS provider integrated with Azure Key
    Vault. Azure platform encryption remains the baseline storage layer protection, while KMS adds envelope encryption of
    Kubernetes secrets before they are committed to etcd. In addition, AKS KMS supports either platform keys for simpler operation
    or customer managed keys in Azure Key Vault when you need direct control over the encryption key lifecycle.
  rationale: AKS stores Kubernetes Secret objects in etcd, so encrypting them adds protection beyond the baseline Azure storage
    layer encryption. When AKS KMS is used, the Kubernetes API server encrypts Secret data with a data encryption key and
    protects that key with a key encryption key in Azure Key Vault before the encrypted data is written to etcd. This keeps
    the key encryption key separate from the encrypted Secret data.
  impact: Using AKS KMS strengthens Secret data at rest. Customer managed keys add a direct dependency on the configured Key
    Vault, key, managed identity, and access configuration. Microsoft notes that deleting the key or Key Vault can make cluster
    secrets unrecoverable. After the current KMS data encryption experience is enabled, it cannot be disabled or downgraded.
    The current experience is in Preview and requires managed identity and a supported cluster configuration. Private Key
    Vault access uses the trusted services firewall exception rather than a private endpoint. Page 170
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/kms-data-encryption
  - 2. https://learn.microsoft.com/en-us/azure/aks/kms-data-encryption-concepts
  page_start: 170
  audit_raw: "Review each AKS cluster in scope to determine whether Key Management Service\n(KMS) encryption for Kubernetes\
    \ Secrets is enabled and correctly configured. Note the\nAzure platform encryption is always enabled for data at rest,\
    \ but AKS KMS adds a\nseparate encryption layer that encrypts Kubernetes Secret data before it is written to\netcd by\
    \ using Azure Key Vault keys.\nVerify\nsecurityProfile.kubernetesResourceObjectEncryptionProfile.infras\ntructureEncryption\
    \ is Enabled for the current KMS data encryption experience. If\nsecurityProfile.azureKeyVaultKms.enabled is true, review\
    \ the key identifier\nand Key Vault fields to determine whether customer managed keys are configured. A\ncluster with\
    \ azureKeyVaultKms.enabled set to true but no infrastructure\nencryption value may be using the legacy KMS experience\
    \ and should be evaluated for\nsupported migration. For customer managed keys, confirm the referenced key is\nenabled,\
    \ has not expired, and remains available. For a private Key Vault, confirm the\ntrusted services firewall exception and\
    \ managed identity access are configured.\nUse the following command to inspect the KMS configuration for a specific cluster:\n\
    az aks show \\\n --name $CLUSTER_NAME \\\n --resource-group $RESOURCE_GROUP \\\n --query\n\"{InfrastructureEncryption:securityProfile.kubernetesResourceObjectEncryptionProfil\n\
    e.infrastructureEncryption, \\\n CustomerManagedKeyEnabled:securityProfile.azureKeyVaultKms.enabled,\nKeyId:securityProfile.azureKeyVaultKms.keyId,\
    \ \\\n KeyVaultNetworkAccess:securityProfile.azureKeyVaultKms.keyVaultNetworkAccess, \\\n KeyVaultResourceId:securityProfile.azureKeyVaultKms.keyVaultResourceId}\"\
    \ -o json\nFor the current KMS experience, InfrastructureEncryption should be Enabled.\nWith platform managed keys, the\
    \ customer managed key fields can be empty. With\ncustomer-managed keys, CustomerManagedKeyEnabled should be true, and\
    \ the\nexpected key identifier and Key Vault values should be present. If both current and\nlegacy KMS indicators are\
    \ absent or disabled, the control is not satisfied.\n Page 171"
  remediation: 'For AKS clusters that do not use KMS for Kubernetes Secret encryption, enable AKS

    KMS so Secret data is encrypted before it is written to etcd. AKS distinguishes this from

    the baseline Azure platform encryption that is always on at the storage layer, and

    documents AKS KMS as the added Azure Key Vault backed encryption layer for

    Kubernetes secrets. For supported clusters where Preview use is approved, use the

    current KMS data encryption model. If Preview use is not approved, use or maintain the

    supported legacy KMS experience and plan migration when appropriate. Where

    customer managed keys are required, configure the Azure Key Vault key, assign the

    required managed identity and permissions, enable KMS on the cluster, and then verify

    the cluster security profile reflects the expected KMS settings.

    1. Identify AKS clusters where neither the current nor legacy KMS experience is

    enabled for Kubernetes Secret encryption, using cluster configuration review or

    Azure Policy.

    2. Decide whether to use platform managed keys or customer managed keys in

    Azure Key Vault based on the organization’s key ownership and compliance

    requirements.

    3. For customer managed key deployments, create or select the Azure Key Vault

    key, assign a user assigned managed identity, and grant the identity the required

    key permissions before enabling KMS.

    4. If a private Key Vault is used, configure the Key Vault firewall to allow trusted

    Azure services and confirm the managed identity can access and use the vault.

    5. After remediation, validate that the AKS securityProfile shows infrastructure

    encryption enabled and, for customer managed keys, the expected Key Vault

    configuration. Confirm the referenced vault and key remain available to avoid

    loss of access to encrypted secrets.'
  checks:
  - type: manual_review
    info: 'Review each AKS cluster in scope to determine whether Key Management Service

      (KMS) encryption for Kubernetes Secrets is enabled and correctly configured. Note the

      Azure platform encryption is always enabled for data at rest, but AKS KMS adds a

      separate encryption layer that encrypts Kubernetes Secret data before it is written to

      etcd by using Azure Key Vault keys.

      Verify

      securityProfile.kubernetesResourceObjectEncryptionProfile.infras

      tructureEncryption is Enabled for the current KMS data encryp'
    severity: medium
- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: scored
  profile:
  - Level 1
  description: The AKS control plane endpoint should be exposed only through approved network paths rather than being broadly
    reachable. For AKS, the control plane is the Kubernetes API server. For public clusters, API server authorized IP ranges
    can be used to limit access to specific public IP addresses or CIDR blocks and deny all other sources. For more restrictive
    deployments, AKS also supports private clusters, where the API server is exposed through a private endpoint with private
    DNS resolution, and API Server VNet Integration, keeps node to API server traffic on private networking. API Server VNet
    Integration supports both public and private clusters and does not by itself restrict external access to a public API
    server.
  rationale: The Kubernetes API server is assigned a public IP address by default, so restricting access to approved source
    IP addresses reduces exposure of the control plane to unsolicited network traffic. API server authorized IP ranges allow
    only specified public IP addresses or CIDR blocks to reach the public API server endpoint, while requests from other source
    IPs are blocked. For environments that do not permit internet reachable management endpoints, Microsoft recommends using
    a private cluster so API server access stays on private network paths instead of relying on public endpoint filtering
    alone.
  impact: Restricting the AKS control plane endpoint changes how administrators and automation reach the Kubernetes API server.
    If API server authorized IP ranges are used, all required administrator or egress public IP ranges must be explicitly
    allowed or legitimate access can be blocked; authorized IP ranges apply only to the public API server endpoint and cannot
    be used with private clusters. If a private cluster is used, management access must come from the cluster VNet, a peered
    network, or another approved private access path, and proper private DNS resolution is required. A public FQDN on a private
    cluster is only a publicly resolvable DNS name and does not create a public API endpoint. Microsoft also notes that private
    clusters do not support Azure DevOps Microsoft hosted agents, and any dependent private services such as Azure Container
    Registry must be reachable through an appropriate private network and DNS design. Converting an existing AKS Standard
    cluster to API Server VNet Integration is permanent, requires a cluster restart, performs a rolling node image upgrade,
    and changes the API server IP address. Page 175
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
  - 2. https://learn.microsoft.com/en-us/azure/aks/private-clusters
  page_start: 175
  audit_raw: "Review each AKS cluster to determine how the Kubernetes API server is exposed and\nwhether network restrictions\
    \ are configured appropriately. Specifically, verify whether\nthe cluster is deployed as a private cluster, whether a\
    \ public FQDN remains enabled for\nthat private cluster, and whether authorized IP ranges are configured on any public\
    \ API\nserver endpoint. For AKS, authorized IP ranges apply to the public API server endpoint,\nwhile private cluster\
    \ access is controlled through private networking and DNS design\nrather than public IP allowlisting.\naz aks show \\\n\
    \ --name \"${CLUSTER_NAME}\" \\\n --resource-group \"${RESOURCE_GROUP}\" \\\n --query \"{enablePrivateCluster:apiServerAccessProfile.enablePrivateCluster,\n\
    enablePublicFqdn:apiServerAccessProfile.enablePublicFqdn,\nauthorizedIpRanges:apiServerAccessProfile.authorizedIpRanges}\"\
    \ \\\n --output json\nInterpretation:\n• enablePrivateCluster: true means the cluster is configured as a private\nAKS\
    \ cluster and the API server is intended to be reached through private network\nconnectivity.\n• enablePublicFqdn: true\
    \ means a public DNS name exists for the API\nserver. For a private cluster, this does not indicate that a public API\
    \ endpoint\nexists. The public FQDN can be disabled when the security standard prohibits a\npublicly resolvable API server\
    \ name. This setting should not be described as\nendpointPublicAccess.\n• authorizedIpRanges lists the allowed source\
    \ CIDR ranges for access to the\npublic API server endpoint. If the list is empty or null on a public cluster, there is\n\
    no IP address restriction on that public endpoint. Authorized IP ranges are not\nsupported with private clusters.\nThe\
    \ result for a private cluster should show enablePrivateCluster as true.\nenablePublicFqdn should be evaluated against\
    \ your security standard, and\nauthorizedIpRanges should only be treated as relevant where a public API server\nendpoint\
    \ is in play. For a public cluster, the key networking control is whether\nauthorizedIpRanges is populated with only approved\
    \ administrator or egress CIDR\nblocks.\n Page 176"
  remediation: 'If the cluster is intended to expose the Kubernetes API server only over private network

    paths, use a private AKS cluster; if the cluster is already private but a public DNS name

    is still published, disable the public FQDN when required by the security standard. If the

    cluster must keep a public API server endpoint, configure authorized IP ranges so only

    approved administrator and egress CIDR ranges can reach it. Microsoft notes that

    authorized IP ranges apply only to the public API server endpoint, recommends

    including both the cluster egress IP and the networks used to administer the cluster,

    and states that rule updates can take up to two minutes to propagate.

    1. If enablePrivateCluster is false and the cluster should be managed only

    over private connectivity, enable API Server VNet Integration on the supported

    existing AKS Standard cluster, complete the required restart, and then enable

    private cluster mode. API Server VNet Integration cannot be disabled after

    conversion.

    2. If enablePrivateCluster is true but enablePublicFqdn is also true and

    your standard does not allow a public DNS name, disable the public FQDN for

    the private cluster.

    3. If the cluster keeps a public API server endpoint and authorizedIpRanges is

    empty or null, add approved CIDR ranges so the API server is not broadly

    reachable from the internet.

    4. If authorizedIpRanges is present but incomplete, update it to include only the

    required administrator, VPN, firewall, NAT gateway, and other approved egress

    ranges including, the cluster egress IP and the networks from which the cluster is

    administered.

    5. After remediation, rerun the same az aks show audit query and test access

    from both approved and nonapproved network paths, allowing for the

    documented propagation delay before confirming results.'
