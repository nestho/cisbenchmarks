      assignments in the AKS cluster. It

      filters the binding output to show each binding name and the associated user, group, or

      service account, allowing the reviewer to determine which identities have unrestricted

      cluster administrative access.

      kubectl get clusterrolebinding'
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in AKS are granted to only identities with a defined purpose.
    The review should include Azure role assignments used by Microsoft Entra ID authorization for the Kubernetes API, Kubernetes
    RBAC roles and bindings, and service account permissions, with particular attention to permissions that allow get, list,
    or watch access to secrets, because those permissions expose sensitive namespace data. In AKS, access should be limited
    to the minimum scope and privilege necessary for the workload or administrator function being performed. The Kubernetes
    API stores secrets, which may be service account tokens for the Kubernetes API or credentials used by workloads in the
    cluster. Access to these secrets should be restricted to the smallest possible group of users to reduce the risk of privilege
    escalation.
  rationale: This requirement is necessary because unnecessary access to Secrets in AKS increases the risk of credential exposure
    and privilege escalation. Microsoft’s AKS guidance notes that access to secret contents can expose service account credentials,
    and that combining secret access with the ability to run pods as service accounts can enable a principal to gain that
    service account’s API access level. Kubernetes also treats get, list, and watch access to Secret objects as sensitive
    because the API responses can include Secret data rather than metadata alone. Minimizing secret access in AKS therefore
    helps reduce the likelihood that a user, workload, or service account can expose sensitive data or expand its effective
    privileges beyond what is required.
  impact: If access to Secrets is granted too broadly in AKS, a compromised user, group, service principal, managed identity,
    or service account can retrieve sensitive application data, credentials, certificates, or tokens from one or more namespaces.
    That access can then be used to impersonate workloads, obtain additional API access, or expose confidential configuration
    information, increasing the risk of lateral movement and a broader cluster security incident. Page 70
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  page_start: 70
  audit_raw: 'Review the users, groups, and service accounts that have get, list, or watch access

    to Secret objects in the Kubernetes API. Identify these permissions in Kubernetes Role

    and ClusterRole rules, then trace the associated RoleBinding and

    ClusterRoleBinding objects to the affected identities.

    If Microsoft Entra ID authorization for the Kubernetes API is enabled, also review Azure

    role assignments to users, groups, service principals, and managed identities that allow

    access to Secrets. This includes Azure Kubernetes Service RBAC Writer, Admin,

    Cluster Admin, and applicable custom roles. Confirm that each assignment is required

    and limited to the necessary namespace or cluster resources.'
  remediation: "Where access is not required, remove get, list, and watch access to Secret objects\nin the cluster. For Kubernetes\
    \ RBAC, remove the unnecessary verbs from the\napplicable Role or ClusterRole, or remove the binding that grants the role\
    \ to the\nidentity. For Microsoft Entra ID authorization, replace broad assignments with a role that\ndoes not permit\
    \ Secret access, such as Azure Kubernetes Service RBAC Reader when\nread access to other resources is sufficient.\nConfirm\
    \ that workloads, controllers, and administrative processes continue to function\nwith the replacement permissions before\
    \ removing the existing access.\n Page 71"
  checks:
  - type: manual_review
    info: 'Review the users, groups, and service accounts that have get, list, or watch access

      to Secret objects in the Kubernetes API. Identify these permissions in Kubernetes Role

      and ClusterRole rules, then trace the associated RoleBinding and

      ClusterRoleBinding objects to the affected identities.

      If Microsoft Entra ID authorization for the Kubernetes API is enabled, also review Azure

      role assignments to users, groups, service principals, and managed identities that allow

      access to Secrets. This include'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole definitions in AKS do not use wildcard entries such as * for verbs,
    resources, or apiGroups unless a documented administrative need exists. This is particularly relevant for service accounts
    because their authorization continues to rely on Kubernetes RBAC.
  rationale: This recommendation is necessary because wildcard permissions make RBAC scope harder to predict and harder to
    constrain. Kubernetes guidance explicitly recommends avoiding wildcard permissions where possible, especially across all
    resources, because Kubernetes is extensible and wildcard access applies not only to resource types that exist today but
    also to resource types introduced later. Since RBAC permissions are purely additive, a wildcard can silently expand what
    a bound principal is allowed to do without any corresponding narrowing control in the role itself. The risk remains material
    even when Microsoft Entra ID authorization for the Kubernetes API is enabled, because AKS can use both authorization models,
    and Kubernetes RBAC remains responsible for permissions granted to service accounts through Role, ClusterRole, and binding
    objects. As a result, wildcard rules in Role and ClusterRole objects can still over privilege workloads and controllers
    that run under service accounts, even in clusters where human user access is otherwise managed through Microsoft Entra
    ID authorization.
  impact: If wildcard permissions are used broadly in AKS, a user or service account can receive access beyond the intended
    set of API resources or actions, including newly introduced resources such as CRDs or additional subresources covered
    by the wildcard rule. When those roles are bound throughout the cluster or attached to workload service accounts, a compromised
    pod, controller, or user session can perform actions outside its expected boundary, increasing the risk of unauthorized
    changes, privilege escalation, and wider cluster impact. Page 73
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 73
  audit_raw: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

    use in verbs, resources, or apiGroups, and identify any RoleBinding or

    ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

    Retrieve the roles defined across all namespaces in the cluster and review for wildcards

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Replace wildcard entries in Role and ClusterRole objects with only the specific

    verbs, resources, and apiGroups required for the workload or administrator function.

    Prefer Role and RoleBinding objects within the required namespace instead of

    permissions throughout the cluster wherever possible.

    This is particularly important for service accounts and controllers because extended

    Kubernetes RBAC rules can still over privilege workloads even when human user

    access is managed through Microsoft Entra ID authorization for the Kubernetes API.'
  checks:
  - type: manual_review
    info: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

      use in verbs, resources, or apiGroups, and identify any RoleBinding or

      ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

      Retrieve the roles defined across all namespaces in the cluster and review for wildcards

      kubectl get roles --all-namespaces -o yaml

      Retrieve the cluster roles defined in the cluster and review for wildcards

      kubectl get clusterroles -o yaml'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create pods in a namespace can provide a number of opportunities for privilege escalation, such
    as assigning privileged service accounts to these pods or mounting hostPaths with access to sensitive data. Pod Security
    Policies are no longer supported. Pod Security Admission or Azure Policy can restrict risky pod configurations, but these
    controls do not replace least privilege for pod creation. This verifies that permission to create or run pods in AKS is
    granted only to identities with a documented operational need. The review should include RBAC assignments to users, groups,
    and service accounts that allow pod creation or the ability to run pods under service accounts, because AKS treats pod
    execution as a security-relevant action rather than a routine read/write permission.
  rationale: This requirement is necessary because pod creation in AKS can translate into API access through service accounts.
    Pods can receive a projected service account token and use it to authenticate to the API server as the selected service
    account, and AKS RBAC guidance notes that the ability to run pods as any service account in a namespace can be used to
    gain that service account’s API access level. A principal that can create a Pod controls fields such as serviceAccountName,
    container images, volumes, and security context. Admission controls can restrict some pod specifications, but they do
    not replace RBAC restrictions on who can create Pods.
  impact: If pod creation is granted too broadly in AKS, a compromised or misused identity can create Pods that use available
    service accounts and exercise the Kubernetes API permissions granted to those accounts, and reach resources or API actions
    beyond its intended role. This increases the risk of privilege escalation, sensitive data exposure, and wider namespace
    or cluster impact from a single account or workload with excessive permissions.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  - 2. https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization
  page_start: 75
  audit_raw: "Review AKS authorization to determine whether access is controlled through Microsoft\nEntra ID authorization\
    \ for the Kubernetes API, Kubernetes RBAC, or both. Identify the\nusers, groups, and service accounts that can create\
    \ Pods. Confirm that each\nassignment is required for the principal’s function, with particular attention to service\n\
    accounts and namespace write access. Flag unnecessary pod creation rights for\nremediation.\n Page 75"
  remediation: 'The following steps help reduce pod creation access to the minimum required in AKS:

    • Identify all Azure role assignments used by Microsoft Entra ID authorization for

    the Kubernetes API and Kubernetes RBAC bindings that allow pod creation,

    including access within a namespace and access throughout the cluster.

    • Remove pod creation rights from any user, group, or service account that does

    not have a documented operational need.

    • Replace broad permissions with a role that has only the required permissions,

    preferably limited to the required namespace rather than throughout the cluster.

    • Ensure workloads use dedicated service accounts with only the permissions

    required for the application or controller.

    • Revalidate access after changes to confirm required workloads still run and

    unnecessary pod creation rights have been removed.'
  checks:
  - type: manual_review
    info: "Review AKS authorization to determine whether access is controlled through Microsoft\nEntra ID authorization for\
      \ the Kubernetes API, Kubernetes RBAC, or both. Identify the\nusers, groups, and service accounts that can create Pods.\
      \ Confirm that each\nassignment is required for the principal’s function, with particular attention to service\naccounts\
      \ and namespace write access. Flag unnecessary pod creation rights for\nremediation.\n Page 75"
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: Ensure that default service accounts are not actively used by verifying that application and automation pods
    in AKS do not rely on the namespace default service account when a dedicated service account should be used instead. Confirm
    that workloads explicitly specify the intended serviceAccountName, the default service account is not bound to unnecessary
    Kubernetes RBAC permissions, and it is not being used as the identity boundary for workloads that need distinct API permissions
    or Microsoft Entra Workload ID behavior.
  rationale: 'This is recommended because AKS service accounts are operational identities, not just deployment defaults. Unless
    token mounting is disabled, Kubernetes can project a short lived service account token into a Pod for authentication to
    the Kubernetes API server. AKS also documents that when Azure RBAC integration is used, identities outside Microsoft Entra
    ID, including Kubernetes service accounts, still fall back to normal Kubernetes RBAC. Using the default service account
    therefore makes it harder to apply least privilege cleanly, because multiple workloads can end up sharing the same Kubernetes
    identity and API authorization path within a namespace. AKS documentation also shows that service account token handling
    is security relevant: Microsoft publishes an AKS Azure Policy definition that sets automountServiceAccountToken to false
    because avoiding default token automatic mounting increases security, and AKS Workload ID uses explicit pod labels plus
    service account configuration to project and exchange service account tokens for Microsoft Entra access tokens. Together,
    that guidance supports using dedicated, intentional service accounts rather than actively relying on the default account
    for ordinary workloads. Page 77'
  impact: If the default service account is actively used in AKS, multiple workloads in the same namespace can inherit the
    same Kubernetes identity and any RBAC permissions associated with it, which increases the blast radius of a pod compromise
    or workload misconfiguration. It also weakens separation of duties, makes it harder to assign workload specific permissions,
    and reduces audit clarity because API access is attributed to a shared namespace service account rather than a dedicated
    workload identity. In clusters using Microsoft Entra Workload ID, using a shared service account can also complicate token
    projection and mapping between the workload and identity that AKS expects to be explicit. Page 78
  references:
