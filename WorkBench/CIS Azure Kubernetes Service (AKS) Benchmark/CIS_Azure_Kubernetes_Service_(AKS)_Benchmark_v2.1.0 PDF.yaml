  remediation: 'Restrict AKS access to ACR so the cluster can only pull images needed for workload

    startup and cannot push, delete, or administer registry content. For AKS, this means

    using the kubelet managed identity for registry authentication and assigning only the

    minimum pull role required by the registry authorization mode: AcrPull for registries

