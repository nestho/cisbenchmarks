    restriction is enabled for non-host network pods. Microsoft also notes that running noncompliant workloads places the
    cluster at risk, so broad use of hostNetwork weakens both security posture and operational assurance. When an applicable
    admission policy is enforced, Pods defined with spec.hostNetwork: true are denied unless an approved exception applies.
