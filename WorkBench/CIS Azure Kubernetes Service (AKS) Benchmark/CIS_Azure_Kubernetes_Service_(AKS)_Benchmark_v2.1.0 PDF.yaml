- id: 3.2.8
  title: Ensure that the RotateKubeletServerCertificate argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: RotateKubeletServerCertificate is a Kubernetes feature gate that enables rotation of the TLS serving certificate
    presented by the kubelet HTTPS endpoint. In AKS, kubelet serving certificate rotation uses server TLS bootstrapping to
    obtain and renew a certificate signed by the cluster certificate authority.
  rationale: Components such as Metrics Server connect to kubelet serving endpoints over TLS. When serving certificate rotation
    is enabled, each kubelet uses the kubernetes.io/kubelet-serving signer to request a serving certificate through the Kubernetes
    certificate signing request API. After the request is approved and issued, the kubelet uses a certificate signed by the
    cluster certificate authority and renews it through the same process. This allows clients that trust the cluster certificate
    authority to validate the kubelet endpoint identity instead of relying on a certificate generated and signed locally by
    the node. serverTLSBootstrap enables the kubelet to request the serving certificate, while the RotateKubeletServerCertificate
    feature gate enables its continued rotation. This mechanism is separate from rotateCertificates, which renews the kubelet
    client certificate used when the node authenticates to the API server.
  impact: Without kubelet serving certificate rotation, an AKS node can use a locally generated, self-signed certificate for
    its kubelet HTTPS endpoint. Clients cannot validate that certificate through the cluster certificate authority unless
    they use a separate trust configuration, which can disrupt or weaken certificate validation for components that connect
    directly to the kubelet. Page 62
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/45059
  - 2. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#kubelet-configuration
  page_start: 62
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

