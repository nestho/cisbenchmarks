- id: 3.2.2
  title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  scoring: scored
  profile:
  - Level 1
  description: Ensure that the kubelet on each AKS worker node does not use AlwaysAllow authorization. Use Webhook so authenticated
    requests to the kubelet HTTPS endpoint require an authorization decision before access is granted. This worker-node kubelet
    setting ensures the --authorization-mode argument is not set to AlwaysAllow, which would permit requests to the kubelet
    without proper authorization checks. Using a secure mode such as Webhook helps require authorization for access to the
    kubelet endpoint and reduces the risk of unauthorized node-level access.
  rationale: AlwaysAllow approves every request that reaches kubelet authorization, regardless of the authenticated identity
    or requested operation. Authentication still occurs separately, so this setting does not by itself permit unauthenticated
    access, but it eliminates the authorization check that should restrict access to kubelet APIs. With Webhook, the kubelet
    sends a SubjectAccessReview to the Kubernetes API server. The configured API server authorizers evaluate the request attributes
    and return an allow or deny decision. This protects sensitive kubelet functions, including access to pod logs, command
    execution, attachment, port forwarding, and other operations exposed through the kubelet API.
  impact: Requests that are not approved by the configured API server authorizers are denied. Monitoring tools, administrative
    clients, and platform components that connect to the kubelet endpoint must authenticate and have permission for the requested
    operation. Page 42
  references:
