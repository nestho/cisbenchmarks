- id: 5.1.1
  title: Ensure container image vulnerability scanning with Defender for Containers or a third-party provider
  scoring: manual
  profile:
  - Level 1
  description: Ensure vulnerability scanning is enabled for container images that are stored in registries and intended for
    deployment to AKS, using Microsoft Defender for Containers, Defender CSPM where supported, or an equivalent third party
    scanner. This control applies both to registry images and, where enabled and supported, to running containers in AKS.
    For Defender based coverage, registry image assessment requires Registry access to be enabled, and Microsoft documents
    support for scanning images in ACR and other supported registries; scans occur for newly pushed or imported images and
    daily rescans update findings for images pushed or pulled within the previous 30 days and images currently running in
    monitored clusters so findings remain current as new CVEs are published.
  rationale: It is important to reduce software supply chain risk before vulnerable images are deployed or continue running
    in AKS. Container images should be scanned for vulnerabilities and only validated images should be deployed. Defender
    for Containers adds technical depth by performing agentless vulnerability assessment across supported container images,
    including OS packages and supported language packages, and then surfacing CVE findings and remediation guidance through
    Defender for Cloud recommendations. These findings support a preventive control when image promotion or admission processes
    block images that do not meet approved vulnerability criteria. Without that enforcement, scanning remains a detection
    and prioritization control.
  impact: Implementing this control may require additional registry integration, scan result review, and remediation work
    before images are promoted to AKS. Defender plans or third party scanning services can also introduce additional cost.
    Vulnerable images may need to be rebuilt, patched, replaced, or blocked from deployment, which can add operational overhead
    but improves the security of the container supply chain. Page 149
  references:
