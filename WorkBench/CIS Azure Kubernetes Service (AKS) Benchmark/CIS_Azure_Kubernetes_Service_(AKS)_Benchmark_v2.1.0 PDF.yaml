- id: 3.2.7
  title: Ensure that rotateCertificates is set to true
  scoring: scored
  profile:
  - Level 2
  description: The value of rotateCertificates (-rotate-certificates argument) should be set to true because it allows the
    kubelet to automatically generate a new key and request a replacement client certificate from the Kubernetes API as the
    current certificate approaches expiration. That client certificate is what the kubelet uses to authenticate to the API
    server, so keeping rotation enabled helps prevent the node from relying on an aging certificate that could eventually
    become stale or expire. In practical terms, the expected secure state is that certificate rotation is on, which in AKS
    aligns with the CIS control that the --rotate-certificates argument must not be set to false.
  rationale: This setting should be true because it verifies that kubelet identity is being refreshed through Kubernetes’
    normal PKI renewal process rather than depending on a long-lived credential. From a security and operational control standpoint,
    that matters because static node credentials are harder to govern over time and provide less assurance that node authentication
    is being actively maintained through the platform’s intended certificate workflow. The related RotateKubeletServerCertificate
    setting should be evaluated separately because it covers a different certificate role. rotateCertificates governs the
    kubelet’s outbound client identity to the control plane, while RotateKubeletServerCertificate is tied to kubelet serving
    certificate rotation, used when the kubelet presents a TLS certificate as a server endpoint. Kubernetes documents serving
    certificate rotation through TLS bootstrapping and notes that serverTLSBootstrap depends on the RotateKubeletServerCertificate
    feature, and AKS lists the two controls separately in its CIS mapping. Together, they show whether both sides of kubelet
    certificate trust are being managed correctly, not just one.
  impact: If rotateCertificates is set to false, the kubelet does not automatically request a replacement client certificate
    as expiration approaches. An expired certificate can prevent the kubelet from authenticating to the API server, interrupting
    node status updates, pod assignment processing, and other kubelet communication with the control plane. Normal automatic
    renewal is designed to replace the certificate and reconnect without workload administrator action. Page 59
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/41912
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet-tlsbootstrapping/#kubelet-configuration
  page_start: 59
