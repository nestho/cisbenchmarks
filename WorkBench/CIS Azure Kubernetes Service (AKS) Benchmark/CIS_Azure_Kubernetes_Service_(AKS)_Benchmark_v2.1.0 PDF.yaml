controls:
- id: 2.1.1
  title: Enable Diagnostic Platform Logs and Metrics
  scoring: manual
  profile:
  - Level 1
  description: With Azure Kubernetes Service (AKS), Microsoft manages the Kubernetes control plane, including components such
    as the API server, controller manager, and scheduler. In an AKS Standard cluster, you manage the node pools, workloads,
    and supporting cluster configuration while using the managed Kubernetes API. To troubleshoot cluster operations, you may
    need to review logs generated by the control plane and enabled AKS services. Azure Monitor diagnostic settings determine
    which AKS control plane resource log categories and exportable platform metrics are routed to configured destinations.
    These destinations can include a Log Analytics workspace for analysis, Azure Storage for retention, or Azure Event Hubs
    for integration with external monitoring and security systems.
  rationale: Routing AKS control plane resource logs to a persistent destination preserves Kubernetes API audit events and
    component activity outside the managed control plane. In Log Analytics resource specific mode, records are written to
    the AKSAudit, AKSAuditAdmin, and AKSControlPlane tables, where they can be correlated with Azure activity and metric data
    through queries, workbooks, and alerts. This correlation supports detection of unauthorized API activity, investigation
    of control plane failures, reconstruction of security events, and verification of administrative changes. Page 16
  impact: Azure automatically collects the subscription Activity Log and AKS platform metrics, but it does not collect or
    store AKS control plane resource logs until a diagnostic setting routes them to a destination. Enabling resource logs
    introduces ingestion, retention, and possible export costs, particularly for kube-audit, which includes read operations
    such as get and list. When complete API request visibility is not required, kubeaudit-admin reduces volume by retaining
    modifying operations while excluding get and list events. Select the API server, controller manager, scheduler, autoscaler,
    cloud controller manager, Guard, CSI controller, audit, and other feature dependent categories according to monitoring
    requirements. Platform metrics remain available in Azure Monitor Metrics without diagnostic settings. Route AllMetrics
    to Log Analytics only when retention or correlation through log queries is required because metric export can add cost,
    not every metric is exportable, and multidimensional metrics are flattened and aggregated when exported through diagnostic
    settings. Page 17
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://docs.microsoft.com/en-us/azure/aks/view-master-logs
  page_start: 16
  audit_raw: "Azure collects the Activity Log and AKS platform metrics automatically. AKS control\nplane logs are resource\
    \ logs and are not collected or stored until a diagnostic setting\nroutes selected categories to at least one destination.\
    \ Audit the configured settings and\nconfirm that records reach the intended destination as follows:\n1. In the Azure\
    \ portal, open the AKS cluster and select Monitoring, Diagnostic\nsettings.\n2. Confirm that at least one diagnostic setting\
    \ routes the required log categories to a\nLog Analytics workspace, Azure Storage, or Azure Event Hubs. For Log\nAnalytics,\
    \ confirm that Resource specific is selected so records are written to\ndedicated AKS tables.\n3. Confirm that the selected\
    \ categories meet the cluster’s monitoring requirements.\nA practical initial selection includes:\n• kube-apiserver\n\
    • kube-audit-admin\n• kube-controller-manager\n• cluster-autoscaler when autoscaling is enabled\n• guard when Microsoft\
    \ Entra ID is enabled\n• kube-audit when read operations must be included in the audit trail\n4. Check AllMetrics only\
    \ when platform metrics must be routed to another\ndestination. Its absence is not an audit failure when platform metrics\
    \ are available\nthrough Azure Monitor Metrics or Managed Prometheus.\n5. Optionally verify the configuration with Azure\
    \ CLI:\naz monitor diagnostic-settings list \\\n --resource $CLUSTER_NAME \\\n --resource-group $RESOURCE_GROUP \\\n --resource-type\
    \ Microsoft.ContainerService/managedClusters"
  remediation: "Configure a diagnostic setting for the AKS control plane resource logs as follows:\n1. Create or identify\
    \ a Log Analytics workspace. Prefer the workspace used for the\ncluster’s container logs. The workspace can be in another\
    \ subscription when the\nadministrator has the required Azure RBAC access to both subscriptions.\n2. In the Azure portal,\
    \ open the AKS cluster.\n3. Select Monitoring, Diagnostic settings.\n4. Select Add diagnostic setting.\n Page 18\n5. Enter\
    \ a descriptive name such as Collect Control Plane Logs.\n6. Select Send to Log Analytics workspace, choose the workspace,\
    \ and select\nResource specific. Add Azure Storage when audit retention requirements justify\na lower cost archival destination,\
    \ or Azure Event Hubs when logs must be\nforwarded to an external monitoring or security system.\n7. Select only the categories\
    \ required for the cluster. Use the following initial\nconfiguration and add other categories as monitoring needs develop:\n\
    • Send kube-apiserver to Log Analytics.\n• Send kube-audit-admin to Log Analytics.\n• Send kube-controller-manager to\
    \ Log Analytics.\n• Send cluster-autoscaler to Log Analytics when autoscaling is\nenabled.\n• Send guard to Log Analytics\
    \ when Microsoft Entra ID is enabled.\n• Send kube-audit to Azure Storage when a full API audit trail, including\nget\
    \ and list events, must be retained.\n• Add kube-scheduler, cloud-controller-manager, CSI controller,\nKarpenter, or Fleet\
    \ categories only when they support an identified\noperational requirement.\n8. Leave AllMetrics disabled unless platform\
    \ metrics must be exported for\nretention or correlation in Log Analytics. Azure collects platform metrics\nautomatically,\
    \ and current guidance recommends avoiding redundant metric\nexport. If this control specifically requires metrics in\
    \ the destination, select\nAllMetrics.\n9. Save the diagnostic setting.\n10. Allow up to 90 minutes for data to begin\
    \ reaching the destination. If no data\nappears within 24 hours, verify that relevant events were generated and\ntroubleshoot\
    \ the routing configuration.\nConfirm that Log Analytics receives records in AKSControlPlane,\nAKSAuditAdmin, or AKSAudit,\
    \ according to the enabled categories.\nDo not enable both audit categories without a defined requirement. kube-audit-admin\n\
    excludes get and list events and is appropriate for routine monitoring of modifying API\noperations. kube-audit provides\
    \ the broader trail but can generate substantial volume\nand cost."
  checks:
  - type: manual_review
    info: 'Azure collects the Activity Log and AKS platform metrics automatically. AKS control

      plane logs are resource logs and are not collected or stored until a diagnostic setting

      routes selected categories to at least one destination. Audit the configured settings and

      confirm that records reach the intended destination as follows:

      1. In the Azure portal, open the AKS cluster and select Monitoring, Diagnostic

      settings.

      2. Confirm that at least one diagnostic setting routes the required log categories to'
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If the kubelet uses a kubeconfig file, ensure that its permissions are set to 644 or more restrictive. Permissions
    of 644 allow the file owner to read and modify the file while limiting the group and everyone else to read access. Administrators
    may use 600 when group and everyone else should have no access.
  rationale: 'The kubelet kubeconfig file contains the connection and authentication settings the kubelet uses to communicate
    with the Kubernetes API server. AKS provisions the kubelet client certificate and corresponding kubeconfig through TLS
    bootstrapping and automatically rotates the client certificate. Permissions of 644 provide the following access: • The
    owner can read and modify the file. • Members of the file’s group can read the file but cannot modify it. • Everyone else
    can read the file but cannot modify it. This configuration protects the file from unauthorized modification while allowing
    read access for operational or administrative purposes. If that read access is not required, an administrator may use
    600, which allows only the file owner to read or modify the file and gives the group and everyone else no access.'
  impact: Permissions of 644 should not affect kubelet operation because the file owner retains read and write access. Using
    600 should also have no operational effect when the kubelet runs under the file owner or another identity with sufficient
    privileges. Incorrect permissions or ownership that prevent the kubelet from reading the file can stop the service from
    starting or authenticating to the Kubernetes API server, potentially leaving the node in a NotReady state. Direct changes
    to AKS node files might not persist through an upgrade, scale operation, update, or reboot. Page 22
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 22
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the\nkubeconfig\
    \ file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %a /var/lib/kubelet/kubeconfig (or stat\
    \ -c %a\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig\
    \ file's permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more restrictive.\n\
    Method 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's\
    \ file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system\
    \ into the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\n\
    \ Page 23\napiVersion: v1\nkind: Pod\nmetadata:\n name: file-check\nspec:\n volumes:\n - name: host-root\n hostPath:\n\
    \ path: /\n type: Directory\n containers:\n - name: nsenter\n image: busybox\n command: [\"sleep\", \"3600\"]\n volumeMounts:\n\
    \ - name: host-root\n mountPath: /host\n securityContext:\n privileged: true\nSave this to a file (e.g., file-check-pod.yaml)\
    \ and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file\
    \ permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access\
    \ the node's file system through\nthe /host directory and check the permission level of the file:\nls -l /host/var/lib/kubelet/kubeconfig\n\
    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %a /var/lib/kubelet/kubeconfig (or stat -c %a &&
      ls -l /host/var/lib/kubelet/kubeconfig
    expected: Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/var/li'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: On each AKS worker node, ensure that the kubelet kubeconfig file is owned by root:root. This ownership assigns
    the privileged root account and root group to the file.
  rationale: The kubelet kubeconfig file contains the connection and authentication settings used by the kubelet to communicate
    with the Kubernetes API server. AKS uses a node identity to provision the kubelet client certificate and corresponding
    kubeconfig through TLS bootstrapping and automatically rotates the client certificate. Assigning the file to root:root
    ensures that owner privileges remain with the root account and reduces the risk that an unprivileged account can replace
    or redirect the kubelet configuration. Ownership and permissions provide separate controls. Ownership identifies the controlling
    user and group, while the permission mode determines whether that owner, group, or everyone else can read or modify the
    file. The root:root ownership setting should therefore be used together with the approved kubeconfig permission setting.
  impact: Ownership of root:root has no expected operational effect when the kubelet retains permission to read its configuration.
    Incorrect ownership or permissions can prevent kubelet access, causing service startup or API server authentication failures
    that can leave the node in a NotReady state. Ownership assigned to an unprivileged account can also allow that account
    to change the file when owner write permission is enabled. Page 26
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 26
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the\nkubeconfig\
    \ file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %U:%G /var/lib/kubelet/kubeconfig (or stat\
    \ -c %U:%G\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig\
    \ file's ownership. Verify that\nthe ownership is set to root:root.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will\
    \ need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying a pod\
    \ that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a simple pod definition\
    \ that mounts the root of the host to /host\nwithin the pod:\n Page 27\napiVersion: v1\nkind: Pod\nmetadata:\n name: file-check\n\
    spec:\n volumes:\n - name: host-root\n hostPath:\n path: /\n type: Directory\n containers:\n - name: nsenter\n image:\
    \ busybox\n command: [\"sleep\", \"3600\"]\n volumeMounts:\n - name: host-root\n mountPath: /host\n securityContext:\n\
    \ privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\n\
    Once the pod is running, you can exec into it to check file ownership on the node:\nkubectl exec -it file-check -- sh\n\
    Now you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check\
    \ the ownership of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nThe output of the above command gives you the kubeconfig\
    \ file's ownership. Verify that\nthe ownership is set to root:root."
  remediation: 'Run the below command (based on the file location on your system) on each worker

    node. For example,

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %U:%G /var/lib/kubelet/kubeconfig (or stat -c %U:%G
      && ls -l /host/var/lib/kubelet/kubeconfig
    expected: The output of the above command gives you the kubeconfig file's ownership. Verify that
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/var/li'
- id: 3.1.3
  title: Ensure that the azure.json file has permissions set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: The /etc/kubernetes/azure.json file on an AKS Linux worker node contains sensitive cluster identity and Azure
    integration configuration used by AKS components. Ensure that its permissions are set to 644 or more restrictive. Administrators
    may use 600 when the group and everyone else do not require read access.
  rationale: AKS components use azure.json as cluster identity and Azure integration configuration. On clusters that use a
    service principal, the file stores the service principal credentials. New AKS clusters use a system assigned managed identity
    by default, and Azure manages the identity credentials without requiring administrators to provision or rotate stored
    secrets. The file still contains sensitive identity configuration and should be protected from unauthorized modification.
    Permissions of 644 allow the owner to read and modify the file while allowing the group and everyone else to read it.
    This prevents those accounts from modifying the configuration but does not prevent disclosure. If that read access is
    unnecessary, an administrator may use 600, which gives the group and everyone else no access.
  impact: Permissions of 644 should not affect normal AKS operation because components retain read access, but all local accounts
    can read the file. This exposure is more significant on clusters that use a service principal because the file contains
    its credentials. A more restrictive mode such as 600 should be applied only after confirming that every required AKS component
    can read the file. Permissions or ownership that block required access can cause Azure authentication failures and might
    affect operations such as image pulls or interaction with Azure resources. Page 30
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 30
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ azure.json config file:\nfind / -name azure.json 2>/dev/null\nThe output of the above command should return something\
    \ similar to\n/etc/kubernetes/azure.json (or /host/etc/kubernetes/azure.json if you\nare in debug mode).\nRun the following\
    \ command to gain the file permissions:\nstat -c %a /etc/kubernetes/azure.json (or stat -c %a\n/host/etc/kubernetes/azure.json\
    \ if you are in debug mode)\nThe output of the above command is the azure.json file's permissions. Verify that the\npermissions\
    \ are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged\
    \ enough to access the host's file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount\
    \ the\nnode's file system into the pod.\nHere's an example of a simple pod definition that mounts the root of the host\
    \ to /host\nwithin the pod:\n Page 31\napiVersion: v1\nkind: Pod\nmetadata:\n name: file-check\nspec:\n volumes:\n - name:\
    \ host-root\n hostPath:\n path: /\n type: Directory\n containers:\n - name: nsenter\n image: busybox\n command: [\"sleep\"\
    , \"3600\"]\n volumeMounts:\n - name: host-root\n mountPath: /host\n securityContext:\n privileged: true\nSave this to\
    \ a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running,\
    \ you can exec into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell\
    \ inside the pod, but you can access the node's file system through\nthe /host directory and check the permission level\
    \ of the file:\nls -l /host/etc/kubernetes/azure.json\nVerify that if a file is specified and it exists, the permissions\
    \ are 644 or more restrictive."
  remediation: 'Run the following command (using the config file location identified in the Audit step)

    chmod 644 /etc/kubernetes/azure.json'
  checks:
  - type: command
    command: find / -name azure.json 2>/dev/null && stat -c %a /etc/kubernetes/azure.json (or stat -c %a && ls -l /host/etc/kubernetes/azure.json
    expected: The output of the above command should return something similar to
