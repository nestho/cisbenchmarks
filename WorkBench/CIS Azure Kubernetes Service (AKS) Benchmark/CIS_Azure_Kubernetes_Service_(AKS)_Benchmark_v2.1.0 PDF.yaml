- id: 3.2.4
  title: Ensure that the --read-only-port is set to 0
  scoring: manual
  profile:
  - Level 1
  description: this worker-node kubelet setting ensures that the --read-only-port value is set to 0, which disables the kubelet’s
    unauthenticated read-only endpoint. This helps prevent unauthenticated access to node and workload information exposed
    by the kubelet and remains a current AKS worker-node control.
  rationale: The kubelet read-only port exposes a read-only HTTP endpoint on the worker node that does not enforce authentication
    or authorization. In current Kubernetes configuration, readOnlyPort set to 0 disables that service, while any nonzero
    value enables an endpoint that can expose node and workload information without the normal kubelet access controls. For
    AKS worker nodes, setting --read-only-port to 0 helps remove an unnecessary unauthenticated interface from the node and
    reduces the risk of information disclosure through the kubelet. From a hardening perspective, the kubelet should expose
    management functionality only through its secured interfaces, where authentication and authorization controls can be applied.
    Leaving the read-only port enabled creates an alternate access path that bypasses those protections and can provide visibility
    into node and pod state that should be restricted to authorized clients.
  impact: Removal of the read-only port will require that any service which made use of it will need to be re-configured to
    use the main Kubelet API. Legacy monitoring agents, health checks, or other clients that connect to the unauthenticated
    HTTP port, commonly port 10255, will stop working. Reconfigure them to use the kubelet HTTPS endpoint, normally port 10250,
    with a supported credential and the required authorization. Do not reopen the read only port for compatibility. Page 49
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 49
  audit_raw: "Audit Method 1:\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined\
    \ variables:\nkubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node\
    \ to find the appropriate kubeconfig value:\nps -efww | grep '[k]ubelet' | grep -- '--read-only-port'\nThe command line\
    \ output should show the -read-only-port flag is set to 0.\nFor AKS worker nodes, this audit check verifies that the kubelet\
    \ --read-only-port setting\nis configured to 0, which disables the kubelet’s unauthenticated read-only endpoint. This\n\
    control is important because the read-only port does not enforce authentication or\nauthorization, and leaving it enabled\
    \ can expose node and workload information without\nproper access controls.\n Page 50"
  remediation: 'If the --read-only-port parameter is not set to 0, and manual modification is

    required, review the following file, which contains the KUBELET_FLAGS values used to

    build the kubelet command-line parameters.

    /etc/default/kubelet

    Before editing anything, enter debug mode and run chroot to verify what your node is

    actually using:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    chroot /host

    systemctl cat kubelet

    If the service shows an EnvironmentFile=/etc/default/kubelet and references

    KUBELET_FLAGS, that is the file you would edit. If it does not, then the next place to

    check is the kubelet systemd unit or drop-in, such as:

    /etc/systemd/system/kubelet.service

    /etc/systemd/system/kubelet.service.d/*.conf

    After a changing the kubelet config file, restart the kubelet service and check status.

    The usual recheck sequence would be:

    systemctl daemon-reload

    systemctl restart kubelet

    systemctl status kubelet -l

    ps -efww | grep ''[k]ubelet'' | grep -- ''--client-ca-file''

    Important: In AKS, --read-only-port should be set to 0 to disable the kubelet’s

    unauthenticated read-only endpoint. Although a manual change in /etc/default/kubelet

    may work temporarily on a node after restarting kubelet, it is not the supported or

    durable AKS method for enforcing this control. The supported path, if available in your

    environment, would be through an AKS API or CLI-based kubelet configuration

