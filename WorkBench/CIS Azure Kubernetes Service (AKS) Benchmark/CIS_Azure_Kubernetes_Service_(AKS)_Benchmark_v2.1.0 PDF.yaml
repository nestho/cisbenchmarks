- id: 4.2.5
  title: Minimize the admission of containers with allowPrivilegeEscalation
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of containers with allowPrivilegeEscalation=true so that users, groups, and service
    accounts with deployment rights cannot broadly create Pods containing regular, init, or ephemeral containers that permit
    a process to gain more privileges than its parent. Microsoft documents allowPrivilegeEscalation as a container security
    context setting that should be designed to stay false, Pod Security Admission is enabled by default, and Azure Policy
    for AKS includes built in controls that can restrict privilege escalation at admission time. It's important to note that
    these rights are still constrained by the overall container sandbox, but privileged containers automatically permit privilege
    escalation and must be controlled separately.
  rationale: A container running with the allowPrivilegeEscalation flag set to true may have processes that can gain more
    privileges than their parent. There should be at least one admission control policy defined which does not permit containers
    to allow privilege escalation. The option exists and defaults to true when omitted to permit set uid binaries to run.
    The restricted Pod Security Standard requires this field to be set to false for Linux containers. If you have need to
    run containers which use set uid binaries or require privilege escalation, this should be defined in a separate namespace
    with an approved policy exception, and access to manage that exception should be limited. Page 117
  impact: If admission of containers with allowPrivilegeEscalation=true is not minimized, an identity with workload deployment
    or update rights can introduce pods that run outside Microsoft’s recommended AKS security baseline. Microsoft notes that
    noncompliant workloads place the cluster at risk, and its current guidance treats privilege escalation as a condition
    that should be avoided or automatically corrected. Operationally, broad admission of such containers weakens workload
    isolation, increases the blast radius of a container compromise, and makes policy enforcement less reliable across namespaces
    and teams. When the restricted Pod Security Standard or an equivalent policy is enforced, Pods containing regular, init,
    or ephemeral containers with securityContext.allowPrivilegeEscalation set to true or left unset are denied unless an approved
    exception applies. Page 118
  references:
  - 1. https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-forkubernetes
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
  page_start: 117
  audit_raw: "List the policies in use for each namespace in the cluster, ensure that each policy\ndisallows the admission\
    \ of containers which allow privilege escalation.\nThis command gets all pods across all namespaces, outputs their details\
    \ in JSON\nformat, and uses jq to parse and filter the output for containers with\nallowPrivilegeEscalation set to true.\
    \ Here is a command to list all pods (across all\nnamespaces) where any container has securityContext.allowPrivilegeEscalation:\
    \ true:\nkubectl get pods -A -o json \\\n| jq -r '\n .items[]\n | .metadata.namespace as $ns\n | .metadata.name as $pod\n\
    \ | (.spec.initContainers[]?, .spec.containers[]?) as $c\n | ($c.securityContext.allowPrivilegeEscalation // false) as\
    \ $ape\n | select($ape == true)\n | \"\\($ns)/\\($pod)\\tcontainer=\\($c.name)\\tallowPrivilegeEscalation=true\"\n'\n\
    • -A — checks all namespaces.\n• (.spec.initContainers[]?, .spec.containers[]?) — inspects both regular and init\ncontainers.\n\
    • .securityContext.allowPrivilegeEscalation — the field that controls privilege\nescalation.\n• // false — safely defaults\
    \ to false if the field is missing.\nOR to filter out system namespaces in AKS:\nEXCLUDE_NS='[\"kube-system\",\"kube-public\"\
    ,\"kube-node-lease\",\"gatekeepersystem\",\"azure-arc\"]'\nkubectl get pods -A -o json \\\n| jq -r --argjson ex \"$EXCLUDE_NS\"\
    \ '\n .items[]\n | select( (.metadata.namespace as $ns | $ex | index($ns) | not) )\n | .metadata.namespace as $ns\n |\
    \ .metadata.name as $pod\n | (.spec.initContainers[]?, .spec.containers[]?) as $c\n | ($c.securityContext.allowPrivilegeEscalation\
    \ // false) as $ape\n | select($ape == true)\n | \"\\($ns)/\\($pod)\\tcontainer=\\($c.name)\\tallowPrivilegeEscalation=true\"\
    \n'\nWhen creating a Pod Security Policy, [\"kube-system\"] namespaces are excluded by\ndefault.\n Page 119\nThis command\
    \ uses jq, a command-line JSON processor, to parse the JSON output\nfrom kubectl get pods and filter out pods where any\
    \ container has the\nsecurityContext.privileged flag set to true. Please note that you might need to adjust the\ncommand\
    \ depending on your specific requirements and the structure of your pod\nspecifications."
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of containers with .spec.allowPrivilegeEscalation set to true.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

