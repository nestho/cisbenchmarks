- id: 4.5.2
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 2
  description: Apply securityContext settings to pods and containers so workload runtime behavior is explicitly constrained
    instead of relying on image defaults or permissive cluster admission. Microsoft’s current AKS pod security guidance identifies
    out settings such as runAsNonRoot, runAsUser, runAsGroup, fsGroup, allowPrivilegeEscalation, capabilities, and seccompProfile,
    and AKS supports enforcing or validating these expectations through Pod Security Admission and Deployment Safeguards.
  rationale: Applying securityContext reduces container runtime privilege and strengthens isolation between the application
    and the host. It helps enforce least privilege execution by avoiding root access, limiting unnecessary privilege escalation,
    and supporting Linux security controls such as AppArmor, and seccomp. User namespaces are configured separately with spec.hostUsers
    rather than securityContext. These restrictions are defined in the workload manifest and carried consistently into deployment.
    Pod settings such as fsGroup can apply across containers in a pod, while settings such as allowPrivilegeEscalation and
    capabilities are defined for individual containers.
  impact: If security context is not explicitly applied, AKS workloads can run with broader privileges than intended, weakening
    runtime security and workload isolation. Depending on the container image and omitted settings, a container can run as
    root, retain unnecessary Linux capabilities, or permit a process to gain more privileges than its parent. Pod Security
    Admission and Deployment Safeguards can warn on or deny workload creation or updates that violate configured security
    requirements, which can interrupt deployment until manifests are corrected. Page 141
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/developer-best-practices-podsecurity
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-psa
  page_start: 141
  audit_raw: "Audit this control by reviewing workload manifests to confirm pod and container\nsecurityContext settings are\
    \ explicitly defined and aligned to the AKS security\nbaseline. In current AKS guidance, securityContext is the primary\
    \ manifest\nmechanism for enforcing least privilege runtime behavior, and AKS supports validating\nor enforcing these\
    \ settings through Pod Security Admission and Deployment\nSafeguards.\n• Review pod specs for explicit securityContext\
    \ settings at the pod and\ncontainer level, including regular, init, and ephemeral containers. Focus on\nrunAsNonRoot,\
    \ runAsUser, runAsGroup, fsGroup,\nallowPrivilegeEscalation, capabilities, and seccompProfile.\n• Flag workloads that\
    \ run as root, allow privilege escalation, or omit required\nsecurity context controls as findings unless formally approved.\
    \ Microsoft\nspecifically recommends setting allowPrivilegeEscalation to false and\nrunning as a defined user other than\
    \ root user or group.\n• Verify the cluster is using Pod Security Admission labels on each applicable\nnamespace, since\
    \ AKS supports enforce, audit, and warn modes for Pod\nSecurity Standards.\n• Confirm whether Deployment Safeguards is\
    \ enabled to warn on or deny\nnoncompliant workload settings at create or update time.\n Page 142"
  remediation: 'Remediate by defining and enforcing a hardened pod/container security baseline for all

    application namespaces in AKS, then requiring workloads to declare the necessary

    securityContext fields in their manifests. Pod Security Admission is enabled by

    default and is applied with namespace labels, while Microsoft’s pod security guidance

    recommends explicit settings such as execution without root access,

    allowPrivilegeEscalation: false, limited capabilities, and seccompProfile.

    For broader cluster governance, AKS also supports Deployment Safeguards to provide

    warning or denial enforcement for noncompliant workload definitions at create or update

    time.

    • Apply PSA restricted labels to general application namespaces that can meet the

    Restricted Pod Security Standard, using warn and audit first where rollout

    needs to be staged. The Baseline Pod Security Standard alone does not enforce

    the full set of security context restrictions covered by this control.

    • Update workload manifests to define pod and container securityContext

    values for regular, init, and ephemeral containers such as runAsNonRoot,

    explicit user/group IDs where required, allowPrivilegeEscalation:

    false, dropped capabilities, and seccompProfile.type:

    RuntimeDefault.

    • Restrict exception workloads to tightly controlled namespaces and service

    accounts, and limit who can deploy there through RBAC limited to that

    namespace.

    • Use Deployment Safeguards where centralized warning or denial enforcement is

    needed for pod security settings.

    • Revalidate workloads after rollout to confirm required applications still function

    without unnecessary privileges, root execution, or unnecessary host access.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing workload manifests to confirm pod and container

      securityContext settings are explicitly defined and aligned to the AKS security

      baseline. In current AKS guidance, securityContext is the primary manifest

      mechanism for enforcing least privilege runtime behavior, and AKS supports validating

      or enforcing these settings through Pod Security Admission and Deployment

      Safeguards.

      • Review pod specs for explicit securityContext settings at the pod and

      container level, incl'
    severity: medium
- id: 4.5.3
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 2
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended team, application, or environment boundary. Namespaces are the built-in way to logically divide
    cluster resources and limit access, while the default namespace exists mainly so a cluster can be used immediately without
    first creating a new namespace. Microsoft’s current AKS namespace guidance also ties namespace design to controls within
    each namespace controls such as RBAC, quotas, and network policies.
  rationale: It is important to preserve least privilege administration and make governance within each namespace actually
    usable. Namespaces form the logical isolation boundary in shared clusters, and AKS RBAC can limit permissions to a single
    namespace instead of the whole cluster. When workloads stay in default, it becomes harder to apply clean administrative
    separation, delegated access, resource quotas, and network segmentation by namespace in the way AKS is designed to support.
  impact: Using the default namespace for application workloads weakens administrative separation and increases the blast
    radius of mistakes or misuse within that namespace. Microsoft also flags default namespace usage as an AKS security recommendation
    because it can expose common resource types such as Pods, Secrets, Services, ServiceAccounts, and ConfigMaps to broader
    access. When the Azure built in policy uses the Deny effect, creation of these targeted resource types in the default
    namespace can be blocked, so existing applications should be migrated before enforcement. Page 145
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/core-aks-concepts
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-managed-namespaces
  page_start: 145
  audit_raw: 'Verify that the default namespace is not being used as a landing zone for user

    managed applications, supporting resources, or service accounts used by applications.

    Namespaces are the logical administrative boundary for workloads, and Microsoft flags

    use of the default namespace as a security recommendation because it can expose

    common namespace resource types to broader access. A namespace should pass this

    control only when application resources have been moved into dedicated namespaces

    and default is not being used for normal workload administration.

    • List resources in the default namespace and identify any user managed

    workloads or supporting objects.

    • Review whether application resources, service accounts, ConfigMaps, and

    Secrets are being created in default instead of dedicated namespaces.

    • Treat any unapproved application use of default as a finding, even if the

    namespace also contains expected objects created by Kubernetes or AKS.

    • Confirm user and service account access is limited to dedicated namespaces

    rather than relying on default for routine operations.

    If the Azure built in policy is assigned, review its compliance results and configured

    effect.

    kubectl get

