  title: Ensure that the azure.json file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: The /etc/kubernetes/azure.json file on an AKS worker node contains sensitive cluster identity and Azure integration
    configuration used by AKS components. Ensure that the file is owned by root:root so its owner and group remain assigned
    to privileged system identities.
  rationale: AKS components use azure.json as cluster identity and Azure integration configuration. On clusters that use a
    service principal, the file stores the service principal credentials. New AKS clusters use a system assigned managed identity
    by default, and Azure manages the identity credentials without requiring administrators to provision or rotate stored
    secrets. Assigning the file to root:root keeps owner privileges with the root account and prevents an unprivileged account
    from gaining owner level control of the file. Ownership does not by itself protect confidentiality or prevent modification.
    The permission mode determines whether the owner, group, or everyone else can read or modify the file, so root:root should
    be used together with the approved azure.json permission setting.
  impact: Ownership of root:root should not affect normal AKS operation when required components retain read access through
    the file permission mode. Incorrect ownership can give an unintended account owner level write access or, when combined
    with restrictive permissions, prevent AKS components from reading the file. This can cause Azure authentication failures
    and might affect operations such as image pulls or interaction with Azure resources. Page 34
