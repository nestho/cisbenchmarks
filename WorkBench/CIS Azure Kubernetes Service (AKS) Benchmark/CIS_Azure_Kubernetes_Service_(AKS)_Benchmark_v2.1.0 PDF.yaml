    \ API server over time.\nRebuilding the pool allows new nodes to be provisioned, bootstrapped, and joined\nthrough the\
    \ same managed configuration path, which helps ensure consistent kubelet\nbehavior across the pool and avoids carrying\
    \ forward nodes whose certificate lifecycle\nor startup arguments may already have drifted from the intended state.\n\
