- id: 3.2.1
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Ensure that anonymous authentication is disabled for the kubelet on each AKS worker node. Requests to the kubelet
    HTTPS endpoint must present credentials accepted by a configured authentication method. This setting applies to the worker
    node kubelet and ensures that --anonymous-auth is set to false, meaning the kubelet does not accept unauthenticated anonymous
    requests to its HTTPS endpoint. This helps reduce the risk of unauthorized access to node-level information and operations.
  rationale: If anonymous authentication is enabled, a request that is not authenticated by another configured method is assigned
    the identity system:anonymous and the group system:unauthenticated, then passed to kubelet authorization. The request
    is not automatically permitted, but its outcome depends on the configured authorizer and permissions. Setting anonymousAuth
    to false, --anonymous-auth=false, rejects these requests during authentication. This removes anonymous access as a path
    to kubelet APIs that can expose node and workload information or perform operations such as retrieving logs and executing
    commands. Authorization remains necessary for authenticated requests. AKS enables Node authorization by default on Kubernetes
    1.24 and later to restrict kubelet API requests.
  impact: Unauthenticated requests to the kubelet HTTPS endpoint are rejected. Monitoring agents, health checks, or administrative
    tools that connect directly to that endpoint must use a supported credential and have the required authorization. Page
    39
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 39
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    Run the following command on each node to find the appropriate kubeconfig file:

