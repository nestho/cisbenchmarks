- id: 4.3.1
  title: Ensure Azure CNI Overlay is used
  scoring: manual
  profile:
  - Level 1
  description: Ensure the AKS cluster uses Azure CNI Overlay as the supported overlay networking model and remains on current
    AKS managed networking components through cluster and node image upgrades. Azure CNI Overlay is the recommended CNI plugin
    for most overlay scenarios and the general recommendation for pod networking, while AKS delivers related component, feature,
    and security updates through its managed upgrade model rather than through a separately administered CNI package lifecycle.
    There is no separate Azure CNI Overlay version for the customer to select or audit.
  rationale: It is important to maintain a supported and current networking architecture that aligns with Microsoft’s recommended
    AKS design. Azure CNI Overlay uses a separate pod CIDR, simplifies IP address management, and is identified by Microsoft
    as the preferred general networking choice for many AKS deployments. Microsoft also states that clusters need updates
    to newer IPAM modes and data plane technologies to access the latest features and supportability, which makes staying
    current on the supported overlay model operationally important even in a managed service.
  impact: If this control is not maintained, the cluster can remain on older or legacy networking approaches that carry higher
    support and operational risk. Microsoft also documents supported forward migration paths from Kubenet and Azure CNI Node
    Subnet to Azure CNI Overlay, which reinforces that Overlay is the current direction of travel for supported overlay networking
    in AKS. Where Overlay is the approved design, not using it can increase virtual network IP consumption, limit cluster
    scale, and increase IP planning complexity. Page 122
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/plan-pod-networking
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-network-cni-overview
  page_start: 122
  audit_raw: "Verify that the AKS cluster is using Azure CNI Overlay as its networking model. In\ncurrent AKS guidance, Azure\
    \ CNI Overlay is the recommended plugin for most overlay\nscenarios, and AKS exposes the relevant audit fields through\
    \ networkProfile,\nincluding the network plugin, overlay mode, network policy, and network data plane.\nThe network policy\
    \ and data plane values provide additional context but do not\ndetermine whether Azure CNI Overlay is enabled.\n• Confirm\
    \ the cluster networkProfile shows networkPlugin set to azure\nand networkPluginMode set to overlay.\n• Review the networkPolicy\
    \ setting to record the policy engine in use as\nadditional context.\n• Review the networkDataplane value to determine\
    \ whether the cluster is using\nthe Azure data plane or Cilium.\n• Verify the configured network architecture aligns with\
    \ current AKS guidance,\nwhich recommends Azure CNI Overlay for most overlay scenarios.\n• Record the returned values\
    \ as audit evidence and treat the control as not fully\nsatisfied if networkPlugin is not set to azure or networkPluginMode\
