- id: 4.1.12
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to service account token creation so that only tightly controlled administrative or platform
    identities can request tokens for Kubernetes service accounts in AKS. AKS uses service accounts as a core Kubernetes identity
    type and documents that workloads can use Service Account Token Volume Projection to obtain a Kubernetes token, and AKS
    OIDC guidance states that projected service account tokens are required for Kubernetes 1.30+ clusters, with a maximum
    token lifetime of 24 hours. In practice, permission to create or issue these tokens should not be broadly granted to namespace
    operators, CI/CD identities, or general workload service accounts. The relevant Kubernetes RBAC permission is create on
    the serviceaccounts/token subresource. It permits a token request for a named service account within the authorized namespace.
    These tokens are time limited rather than long lived Secret tokens.
  rationale: Microsoft’s AKS guidance states that Kubernetes RBAC should grant users, groups, and service accounts only the
    resources they need, and Microsoft also notes that Azure RBAC for Kubernetes Authorization and Kubernetes RBAC must still
    be managed separately. In addition, AKS built-in role guidance warns that access patterns involving Secrets or the ability
    to run pods as any service account can be used to gain that service account’s API access. Granting create on serviceaccounts/token
    provides a direct path to a usable service account credential. The token can authenticate with the Kubernetes permissions
    of the targeted service account until it expires, subject to its configured audience and other token restrictions. Page
    100
  impact: If access is not minimized, a compromised user, group, or automation identity could mint time limited but valid
    service-account tokens and use them to authenticate to the Kubernetes API with the effective rights of the targeted service
    account. Removing the requester’s access does not by itself immediately invalidate a token that was already issued. In
    clusters that use Microsoft Entra Workload ID, Microsoft documents that the AKS cluster acts as the token issuer and that
    the projected service account token can be exchanged through OIDC federation for a Microsoft Entra token to access Azure
    resources when the service account, token audience, and federated identity credential are configured for that exchange,
    which expands the blast radius beyond Kubernetes operations.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-oidc-issuer
  - 2. https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  page_start: 100
  audit_raw: "Confirm that the ability to create service account tokens is restricted to only the\nidentities that explicitly\
    \ require it for approved platform or workload operations. Service\naccounts remain Kubernetes identities governed by\
    \ Kubernetes RBAC, while Microsoft\nEntra Workload ID relies on projected service account tokens and OIDC federation to\n\
    obtain Azure access tokens, so unnecessary token-creation rights should be treated as\na credential-issuance risk rather\
    \ than a routine namespace permission. Where Azure\nRBAC for Kubernetes Authorization is enabled, review it alongside\
    \ Kubernetes RBAC\nbecause the two authorization models are managed separately in AKS.\n• Determine whether the cluster\
    \ uses Kubernetes RBAC only or Azure RBAC for\nKubernetes Authorization in addition to Kubernetes RBAC.\n• Review Role\
    \ and ClusterRole rules for create access to\nserviceaccounts/token, including wildcard verbs or resources.\n• Trace those\
    \ permissions through bindings to the exact users, groups, and service\naccounts that inherit them.\n• If Azure RBAC for\
    \ Kubernetes Authorization is enabled, review applicable Azure\nrole assignments and custom roles that grant write access\
    \ to service accounts or\nall Kubernetes resources.\n• Confirm each assignee has a documented need for token issuance\
    \ and that the\npermission is not exposed through broad custom roles, CI/CD identities, or\nworkload service accounts.\n\
    • Validate that current service-account token use aligns with expected AKS\nworkload identity or platform behavior and\
    \ not ad hoc credential minting.\n Page 101"
  remediation: 'Review all Role and ClusterRole definitions for access to the

    serviceaccounts/token subresource, removing that permission from any user,

    group, CI/CD identity, or workload service account that does not have a documented

    operational requirement. Service accounts are still governed through Kubernetes

    RBAC, and Microsoft’s guidance is to grant users, groups, and service accounts only

    the permissions they need. This review should also account for Azure RBAC for

    Kubernetes Authorization where it is enabled, because Microsoft documents that

    Microsoft Entra identities and Kubernetes service accounts follow different authorization

    paths in AKS.

    1. Review Role and ClusterRole objects for serviceaccounts/token access.

    2. Remove that permission from broad operational roles, CI/CD identities, and

    workload service accounts.

    3. Reassign it only to approved administrative or platform identities with a

    documented need.

    4. Where Azure RBAC for Kubernetes Authorization is enabled, remove

    unnecessary role assignments or custom role permissions that provide

    equivalent access.

    5. Validate that required workload identity and projected-token flows still function

    correctly.

    6. Recheck bindings to confirm no unintended subject still inherits token-creation

    rights'
  checks:
  - type: manual_review
    info: 'Confirm that the ability to create service account tokens is restricted to only the

      identities that explicitly require it for approved platform or workload operations. Service

      accounts remain Kubernetes identities governed by Kubernetes RBAC, while Microsoft

      Entra Workload ID relies on projected service account tokens and OIDC federation to

      obtain Azure access tokens, so unnecessary token-creation rights should be treated as

      a credential-issuance risk rather than a routine namespace permission. '
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of privileged containers by restricting the ability to create pods whose containers,
    init containers, or ephemeral containers run with securityContext.privileged=true, and reserve that capability for narrowly
    approved platform scenarios only. AKS Standard supports privileged workload admission controls through Pod Security Admission
    within namespaces and through Azure Policy or optional Deployment Safeguards throughout the cluster.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A privileged container can perform
    many host level operations, including manipulating network settings, accessing devices, and mounting file systems. This
    flag exists to allow special use-cases, like manipulating the network stack and accessing devices. There should be at
    least one enforcing admission control policy defined which does not permit privileged containers. If you need to run privileged
    containers, this should be defined in a separate namespace policy, and only limited administrators should be permitted
    to change the namespace labels or policy exemptions that allow the exception.
  impact: 'When an applicable admission policy is enforced, Pods defined with spec.containers[].securityContext.privileged:
    true, spec.initContainers[].securityContext.privileged: true and spec.ephemeralContainers[].securityContext.privileged:
    true will not be permitted. Pod Security Admission does not remove existing running pods when an enforcing namespace label
    is added. Page 105'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-forkubernetes
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
  page_start: 105
  audit_raw: "List the policies in use for each namespace in the cluster, and ensure that each policy\ndisallows the admission\
    \ of privileged containers.\nSince manually searching through each pod's configuration might be tedious, especially\n\
    in environments with many pods, you can use a more automated approach with grep or\nother command-line tools.\nHere's\
    \ an example of how you might approach this with a combination of kubectl, grep,\nand shell scripting for a more automated\
    \ solution:\nkubectl get pods -A -o json \\\n| jq -r '\n .items[]\n | .metadata.namespace as $ns\n | .metadata.name as\
    \ $pod\n | .spec.containers[]? as $c\n | select(($c.securityContext.privileged // false) == true)\n | \"\\($ns)/\\($pod)\\\
    tcontainer=\\($c.name)\\tprivileged=true\"\n'\nSample Output:\nkube-system/csi-azuredisk-node-2brwf container=azuredisk\
    \ privileged=true\nkube-system/csi-azurefile-node-4l8qk container=azfilesrefresh privileged=true\nkube-system/csi-azurefile-node-4l8qk\
    \ container=azurefile privileged=true\nkube-system/kube-proxy-l8vzl container=kube-proxy privileged=true\nReview AKS managed\
    \ system pods separately from user workloads. Do not modify\nAKS managed components."
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of privileged containers.

    To enable PSA for a namespace in your cluster, set the podsecurity.kubernetes.io/enforce label with the policy value you
    want to enforce.

    kubectl label --overwrite ns NAMESPACE podsecurity.kubernetes.io/enforce=restricted

    The above command enforces the restricted policy for the NAMESPACE namespace.

    For centralized enforcement, configure Azure Policy or optional Deployment Safeguards

    in Enforce mode.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, and ensure that each policy

      disallows the admission of privileged containers.

      Since manually searching through each pod''s configuration might be tedious, especially

      in environments with many pods, you can use a more automated approach with grep or

      other command-line tools.

      Here''s an example of how you might approach this with a combination of kubectl, grep,

      and shell scripting for a more automated solution:

      kubectl get pods -A -o json \'
    severity: medium
- id: 4.2.2
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of pods that request spec.hostPID=true so that only tightly controlled, explicitly approved
    platform workloads can share the host process ID namespace in AKS. Users, groups, and service accounts with deployment
    rights should not be able to create or update workloads that use host PID sharing without an approved exception. AKS Standard
    supports Pod Security Admission, Azure Policy, and optional Deployment Safeguards for this enforcement. Do not generally
    permit containers to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
    also has access to ptrace capabilities this can be used to escalate privileges outside of the container. There should
    be at least one admission control policy defined which does not permit containers to share the host PID namespace. If
    containers require hostPID, place them in a dedicated namespace with an approved policy exception and limit who can manage
    that exception.
  impact: 'If admission of host PID sharing is not minimized, an identity with pod or workload deployment rights can introduce
    workloads that weaken node-level workload isolation and expand the blast radius of a container compromise. In AKS, Microsoft
    emphasizes securing workload access especially in logically isolated or multi-tenant clusters, and the built-in AKS policy
    specifically treats host namespace sharing as a condition that should be blocked. Operationally, broad use of hostPID
    can make containment, troubleshooting, and assurance of workload boundaries more difficult because the pod is no longer
    operating within the default process-isolation boundary. When an applicable admission policy is enforced, Pods defined
    with spec.hostPID: true are denied unless an approved exception applies. Page 108'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-psa
  - 2. https://learn.microsoft.com/en-us/azure/aks/deployment-safeguards
  page_start: 108
  audit_raw: "List the policies in use for each namespace in the cluster, ensure that each policy\ndisallows the admission\
    \ of hostPID containers\nReview Pod Security Admission enforcement labels with the following command. Also\nverify whether\
    \ Azure Policy or Deployment Safeguards provide enforcement for\nnamespaces without an applicable label.\nkubectl get\
    \ namespaces -L pod-security.kubernetes.io/enforce\nSearch for the hostPID Flag: In the YAML output, look for the hostPID\
    \ setting under\nthe spec section to check if it is set to true.\nkubectl get pods -A -o json \\\n| jq -r '\n .items[]\n\
    \ | select((.spec.hostPID // false) == true)\n | \"\\(.metadata.namespace)/\\(.metadata.name)\"\n'\nThis command retrieves\
    \ all pods across all namespaces in JSON format, then uses jq\nto filter out those with the hostPID flag set to true,\
    \ and finally formats the output to\nshow the namespace and name of each matching pod."
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of hostPID containers.

    To enforce the baseline Pod Security Standard for a namespace, apply the following

    label:

    kubectl label --overwrite ns NAMESPACE pod-security.kubernetes.io/enforce=baseline

    Where centralized enforcement is required, configure Azure Policy or Deployment

    Safeguards in Enforce mode. Validate approved workloads before enforcement

    because noncompliant Pod creation and updates will be denied.'
  checks:
  - type: sql
    command: show the namespace and name of each matching pod.
    severity: medium
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of hostPID containers

      Review Pod Security Admission enforcement labels with the following command. Also

      verify whether Azure Policy or Deployment Safeguards provide enforcement for

      namespaces without an applicable label.

      kubectl get namespaces -L pod-security.kubernetes.io/enforce

      Search for'
