    severity: medium
    info: "Review each AKS node pool to determine whether node public IPs are enabled. This\ncontrol evaluates a node pool\
      \ setting, not a control plane setting. Microsoft documents\nnode public IPs as an optional feature for specific scenarios,\
      \ and the default value of\nenableNodePublicIP is false.\nUse this command to audit all node pools in the cluster:\n\
      az aks show \\\n --name \"${CLUSTER_NAME}\" \\\n --resource-gro"
- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: The cluster should have a supported network policy engine enabled so Kubernetes NetworkPolicy resources can
    be enforced. Network policies in AKS are used to allow or deny traffic between pods based on selectors such as namespace,
    labels, and ports. AKS documentation lists Cilium, Azure Network Policy Manager (NPM), and Calico as AKS network policy
    options, while also documenting that Azure CNI Powered by Cilium can enforce network policies without installing a separate
    policy engine and is the recommended path for new Linux deployments.
  rationale: Pod traffic is permitted by default unless network policy enforcement is enabled, so workloads can communicate
    laterally across namespaces and application tiers without pod level restriction. Enabling network policy adds a Kubernetes
    native enforcement layer that filters ingress and egress traffic between pods by using label, namespace, and port based
    rules, which is the technical mechanism AKS uses for east west microsegmentation. This allows the cluster to restrict
    traffic paths to only those required by the application design, instead of relying on unrestricted pod-to-pod communication.
  impact: Network policy in AKS introduces engine specific operational and compatibility considerations. On existing clusters,
    Microsoft states that installing Azure NPM or Calico triggers a simultaneous node pool reimage, and the selected engine
    must be validated against platform constraints such as Cilium being Linux only and documented policy behavior differences.
    Migration to the Cilium data plane also reimages node pools, and Cilium begins enforcing policies only after the reimage
    completes. Page 187
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-network-policies
  - 2. https://learn.microsoft.com/en-us/azure/aks/azure-cni-powered-by-cilium
  page_start: 187
  audit_raw: "Review the AKS cluster networkProfile to verify that a supported network policy\ncapability is enabled and that\
    \ the configured policy model matches the cluster’s\nnetworking design. Current networkProfile.networkPolicy can be azure,\n\
    calico, cilium, or none, and networkProfile.networkDataplane can be\nazure or cilium. Because modern AKS Cilium based\
    \ deployments use the Cilium\ndataplane, the audit should evaluate both fields together instead of checking\nnetworkPolicy\
    \ alone.\nRun this command:\naz aks show \\\n --name \"${CLUSTER_NAME}\" \\\n --resource-group \"${RESOURCE_GROUP}\" \\\
    \n --query\n\"{networkPolicy:networkProfile.networkPolicy,networkDataplane:networkProfile.networ\nkDataplane,networkPlugin:networkProfile.networkPlugin,networkPluginMode:networkProf\n\
    ile.networkPluginMode}\" \\\n --output json\nThe results should show networkPolicy set to an approved value rather than\
    \ null\nor none If your standard prefers or requires Cilium, the expected result should also\nshow networkDataplane: \"\
    cilium\". Microsoft’s current AKS documentation also\nstates that pods can communicate without limitation by default,\
    \ so a result showing no\nactive network policy capability should be treated as noncompliant unless there is a\ndocumented\
    \ exception.\nOutput results would show:\n• networkPolicy: \"none\" or null indicates that AKS network policy\nenforcement\
    \ is not enabled. In that state, pod-to-pod traffic is not being controlled\nby a network policy engine.\n• networkPolicy:\
    \ \"azure\" indicates Azure Network Policy Manager is\nconfigured. This is still a valid setting today, but Microsoft\
    \ has published a\nretirement date of September 30, 2028 for Azure NPM on Linux nodes, so this\nshould usually be treated\
    \ as a transitional state rather than the preferred long\nterm target.\n• networkPolicy: \"calico\" indicates Calico is\
    \ configured as the policy\nengine. This is a supported AKS option and should be assessed against your\napproved engine\
    \ standard.\n• networkPolicy: \"cilium\" together with networkDataplane: \"cilium\"\nindicates a Cilium based AKS configuration,\
    \ which aligns with Microsoft’s current\nAzure CNI Powered by Cilium model. Microsoft recommends Cilium for new\nLinux\
    \ deployments because of its eBPF based enforcement and broader feature\nset.\n Page 188\n• networkPlugin and networkPluginMode\
    \ should also be reviewed because\nengine support depends on the broader AKS networking model. For example,\nMicrosoft\
    \ documents Azure CNI Powered by Cilium using Azure CNI with\nnetworkDataplane: cilium, and the managed cluster schema\
    \ shows these\nfields are part of the same evaluated network profile."
  remediation: 'Align each AKS cluster to an approved network policy baseline based on the

    networkProfile audit results. If networkPolicy is none or null, enable a

    supported policy capability so pod-to-pod traffic is no longer unmanaged by default. For

    new Linux AKS deployments, the preferred target state is Azure CNI Powered by Cilium

    with Cilium network policy, because it provides Kubernetes native policy enforcement

    on an eBPF dataplane and is the recommended direction for new deployments.

    For existing clusters, treat remediation as a planned networking migration and

    standardization effort. Move clusters from nonpreferred engines to the approved target

    state, validate policy behavior after the change, and account for the required node pool

    reimage. Existing Azure CNI modes can migrate directly to the Cilium data plane.

    Kubenet clusters must first migrate to Azure CNI Overlay and then update the data

    plane to Cilium as a separate operation. The remediation end state should be an AKS

    configuration where the selected policy engine and dataplane are both supported,

    intentional, and matched to the cluster’s operating system and networking design.'
  checks:
  - type: sql
    command: show \
    severity: medium
    info: 'Review the AKS cluster networkProfile to verify that a supported network policy

      capability is enabled and that the configured policy model matches the cluster’s

      networking design. Current networkProfile.networkPolicy can be azure,

      calico, cilium, or none, and networkProfile.networkDataplane can be

      azure or cilium. Because modern AKS Cilium based deployments use the Cilium

      dataplane, the audit shou'
- id: 5.4.5
  title: Use HTTPS with valid TLS certificates for externally exposed workloads
  scoring: manual
  profile:
  - Level 2
  description: Protect externally exposed AKS applications by ensuring client connections use HTTPS with a valid TLS certificate
    instead of plaintext HTTP at the cluster entry point. That protection is typically applied at the ingress or gateway layer,
    where external web traffic is accepted and routed to backend services. Using TLS at that layer reduces the risk of exposing
    application traffic, credentials, session data, or other sensitive content in transit.
  rationale: External HTTP traffic is commonly handled by an Ingress controller or Gateway implementation, not by the Layer
    4 Standard Load Balancer itself. That means the relevant enforcement point for this control is the Layer 7 listener that
    accepts requests for the application hostname. When that listener is configured for HTTPS, the client performs a TLS handshake
    with the endpoint, validates the server certificate for the requested DNS name, and establishes an encrypted session before
    any HTTP payload is exchanged. A valid public certificate must be within its validity period, contain the requested hostname
    in its subject alternative name, and chain to a certificate authority trusted by the client. AKS supports this model through
    ingress configurations that bind a certificate to the tls section of an Ingress resource, including certificate material
    sourced from Azure Key Vault and referenced through the generated Kubernetes TLS secret. The Application Routing Gateway
    API integration can also reconcile the SecretProviderClass, Kubernetes TLS Secret, and Gateway listener certificate reference
    for a certificate stored in Azure Key Vault. The ingress path can then perform TLS termination and forward traffic to
    backend services according to the configured routing rules.
  impact: Enforcing this control adds certificate management to the AKS ingress path, including hostname and certificate matching,
    secret or Key Vault integration, and certificate rotation for the exposed listener. Expired, untrusted, or mismatched
    certificates can cause client warnings or connection failures, and disabling plaintext HTTP can affect clients that do
    not support HTTPS or follow redirects. TLS termination protects traffic between the client and the entry point only. Encryption
    from the entry point to the backend must be configured separately when the security design requires end to end TLS. Page
    191
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-network-ingress
  - 2. https://learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api-dns-tls
  page_start: 191
  audit_raw: "It is important to review this at the Ingress or Gateway layer, and at any public\nLoadBalancer Service that\
    \ exposes web traffic directly, since those components are the\nprimary enforcement points for external HTTP and TLS termination.\
    \ The purpose of the\nreview is to confirm that public application entry points are not exposing client traffic\nover\
    \ plaintext HTTP and that every externally published hostname is protected by a\ncertificate based HTTPS or TLS listener.\
    \ Ingress can provide SSL termination, and the\nApplication Routing add on supports certificate based HTTPS using Azure\
    \ Key Vault\nintegration.\n• Review all externally exposed Ingress and Gateway resources, plus public\nLoadBalancer Services\
    \ that carry web traffic, and identify every public hostname,\nlistener, and route used to publish HTTP application traffic.\n\
    • For each exposed hostname, verify the listener is configured for HTTPS or TLS\nrather than HTTP only exposure, and confirm\
    \ the configuration includes a valid\ncertificate reference for termination. Confirm plaintext HTTP is disabled or\nredirects\
    \ to HTTPS. AKS Gateway and ingress configurations are the\nenforcement points for this control.\n• Confirm the certificate\
    \ source is valid and intentional, such as a Kubernetes TLS\nsecret or a certificate synchronized from Azure Key Vault,\
    \ and verify the\ncertificate is bound to the correct hostname. Validate that the certificate has not\nexpired, its subject\
    \ alternative name matches the published hostname, and its\nchain is trusted by expected clients. AKS application routing\
    \ supports SSL/TLS\ncertificate use through these patterns.\n• Treat externally exposed HTTP only listeners, missing TLS\
    \ secret references,\ninvalid or expired certificates, or public hostnames without certificate based\nlistener configuration\
    \ as findings, because those conditions indicate traffic can\nreach the workload entry point without effective HTTPS protection.\n\
    • If the cluster uses the application routing add on, also verify the intended\ncertificate management path is in place,\
    \ since managed Ingress and Gateway\nimplementations support TLS termination and Azure Key Vault certificate\nintegration.\n\
    \ Page 192"
  remediation: 'Remediate by ensuring every externally exposed AKS web entry point is published

    through an Ingress or Gateway listener configured for HTTPS/TLS, with a valid

    certificate bound to the public hostname. If a public LoadBalancer Service exposes a

    web application directly, configure TLS in the application or place the service behind an

    approved TLS terminating entry point. HTTPS protection is typically implemented at the

    Layer 7 ingress or gateway layer, where client traffic is accepted and TLS is terminated

    before traffic is forwarded to backend services. The remediation objective is to eliminate

    plaintext HTTP exposure for public application endpoints and standardize certificate

    based TLS for all external web traffic.

    1. Update each public Ingress or Gateway that currently exposes HTTP only traffic

    so the listener uses HTTPS or TLS for the published hostname. Disable the

    HTTP listener or configure it to redirect to HTTPS.

    2. Bind a valid certificate and private key to each exposed hostname, either through

    a Kubernetes kubernetes.io/tls secret or through an AKS supported

    certificate integration such as Azure Key Vault.

    3. Ensure the certificate subject or SAN matches the DNS name being published,

    the certificate chains to a trusted authority, and renewal occurs before expiration

    so the listener can complete TLS negotiation correctly for the requested host.

    AKS application routing guidance is based on configuring certificates for the

    custom domain used by the ingress endpoint.

    4. Where the cluster uses the Application Routing add on and Azure Key Vault,

    configure the supported certificate integration and automatic rotation so TLS

    material is centrally managed and available to the ingress path.

    5. Configure encryption from the ingress or gateway to the backend when the

    approved design requires end to end TLS.

    6. After remediation, verify that public endpoints redirect or serve over HTTPS only,

    that the listener presents the expected certificate, and that backend routing still

    functions after TLS termination. AKS ingress supports SSL/TLS termination as

    part of the application entry configuration.'
  checks:
  - type: manual_review
    info: 'It is important to review this at the Ingress or Gateway layer, and at any public

      LoadBalancer Service that exposes web traffic directly, since those components are the

      primary enforcement points for external HTTP and TLS termination. The purpose of the

      review is to confirm that public application entry points are not exposing client traffic

      over plaintext HTTP and that every externally published hostname is protected by a

      certificate based HTTPS or TLS listener. Ingress can provide SSL terminat'
    severity: medium
- id: 5.5.1
  title: Use Microsoft Entra ID identities with Kubernetes RBAC
  scoring: manual
  profile:
  - Level 2
  description: Using Microsoft Entra ID for AKS user access helps ensure that Kubernetes permissions are tied to centrally
    managed enterprise identities and groups instead of separate user credentials maintained for the cluster. At a high level,
    this improves control over who can authenticate to the cluster and lets access decisions follow the organization’s normal
    identity lifecycle, such as user onboarding, group membership changes, and access removal. Kubernetes RBAC then grants
    those authenticated identities only the permissions required in the cluster.
  rationale: Microsoft Entra integration supplies the authentication layer for Kubernetes API access by issuing an authentication
    token, and AKS managed integration handles the application plumbing that older legacy integrations required administrators
    to register manually. After the user authenticates, Kubernetes RBAC evaluates that Entra user or group identity through
    RoleBinding and ClusterRoleBinding objects inside the cluster. Microsoft Entra groups appear in authentication tokens
    by object ID rather than display name, so group bindings should use the correct immutable object ID. For user access,
    AKS clusters use the exec credential format with kubelogin, which acts as the credential plugin for Microsoft Entra authentication.
    This lets AKS use enterprise identities for Kubernetes authorization decisions without maintaining separate Kubernetes
    user accounts in the cluster itself. The Azure Kubernetes Service Cluster User Role can allow an identity to retrieve
    user credentials for the cluster, but Kubernetes RoleBinding and ClusterRoleBinding objects still determine what that
    identity can do through the Kubernetes API.
  impact: This model shifts AKS user access to an Entra sign in and group authorization flow, and it is commonly paired with
    disabling local accounts so static --admin credentials do not remain available as an alternate access path. Users need
    kubelogin and must satisfy applicable Microsoft Entra authentication and Conditional Access requirements. Incorrect group
    object IDs, missing Kubernetes bindings, or missing permission to retrieve user credentials can prevent legitimate access.
    Disabling local accounts can also interrupt scripts or operational processes that rely on --admin. For an existing cluster,
    certificate rotation is required after local accounts are disabled to revoke previously issued local credentials. Page
    196
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/kubernetes-rbac-entra-id
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  page_start: 196
  audit_raw: "Review the AKS cluster configuration to confirm user authentication is integrated with\nMicrosoft Entra ID and\
    \ that cluster authorization is being managed through Kubernetes\nRBAC bindings for Entra users or groups, rather than\
    \ relying on local cluster\ncredentials. A brief audit should verify that AKS managed Entra integration is enabled,\n\
    that appropriate Entra admin group object IDs are configured, that Kubernetes RBAC is\nenabled and Azure RBAC for Kubernetes\
    \ Authorization is disabled for this specific\nauthorization model, and that local accounts are disabled where the security\
    \ standard\nrequires removal of the alternate --admin access path. Confirm each Entra\nadministrator group object ID is\
    \ correct, its membership is limited to approved\nadministrators, and it is not treated as a substitute for reviewing\
    \ other Kubernetes\nRBAC bindings. AKS documents Entra-integrated Kubernetes RBAC as a supported\nmodel, and separately\
    \ documents disabling local accounts to prevent access that\nbypasses Entra authentication and its associated audit controls.\n\
    Use the following command to review the cluster authentication and authorization\nconfiguration:\naz aks show --resource-group\
    \ ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query\n\"{managedEntra:aadProfile.managed,kubernetesRbac:enableRbac,azureRbac:aadProfile.en\n\
    ableAzureRbac,adminGroups:aadProfile.adminGroupObjectIds,localAccountsDisabled:disa\nbleLocalAccounts}\" -o json\n1. Confirm\
    \ managedEntra and kubernetesRbac are true.\n2. Confirm azureRbac is false because this control evaluates Microsoft Entra\n\
    authentication with Kubernetes RBAC, not Azure RBAC for Kubernetes\nAuthorization.\n3. Review adminGroups and confirm\
    \ only approved Entra administrator group\nobject IDs are configured.\n4. Confirm localAccountsDisabled is true when all\
    \ human access must use\nMicrosoft Entra ID.\n5. Review RoleBinding and ClusterRoleBinding objects and verify that Microsoft\n\
    Entra users or groups receive only approved Kubernetes permissions. Use group\nobject IDs for Entra group subjects.\n\
    6. Review Azure role assignments that allow users or groups to retrieve user\ncredentials, and confirm they do not grant\
    \ local administrator credentials.\n Page 197"
  remediation: 'If the cluster is not using AKS managed Microsoft Entra integration with Kubernetes

    RBAC, enable that identity model and assign access through approved Entra groups

    that are then mapped to Kubernetes Roles and ClusterRoles by RoleBinding or

    ClusterRoleBinding. Keep Azure RBAC for Kubernetes Authorization disabled

    when Kubernetes RBAC is the approved authorization model. Where the goal is to

    ensure all human access is governed through Entra, also disable local accounts so

    static local admin credentials do not remain available as a parallel access method; AKS

    guidance notes that if local accounts are disabled on an existing cluster, cluster

    certificates should be rotated to revoke previously issued local account credentials.

    1. Enable AKS managed Microsoft Entra integration and configure an approved

    Entra administrator group so administrative access is preserved during the

    change.

    2. Grant approved users or groups the Azure Kubernetes Service Cluster User Role

    when they need to retrieve user credentials for the cluster.

    3. Create Kubernetes Roles and RoleBindings for permissions limited to a

    required namespace. Use ClusterRoles and ClusterRoleBindings only

    when permissions must apply throughout the cluster.

    4. Use Microsoft Entra group object IDs in group bindings and remove obsolete

    direct user bindings or bindings to deleted groups.

    5. Configure supported kubelogin authentication for administrators and users,

    then validate access with representative identities.

    6. Disable local accounts after all required Entra access paths are verified. For an

    existing cluster, rotate the cluster certificates to revoke previously issued local

    credentials.'
  checks:
  - type: manual_review
    info: 'Review the AKS cluster configuration to confirm user authentication is integrated with

      Microsoft Entra ID and that cluster authorization is being managed through Kubernetes

      RBAC bindings for Entra users or groups, rather than relying on local cluster

      credentials. A brief audit should verify that AKS managed Entra integration is enabled,

      that appropriate Entra admin group object IDs are configured, that Kubernetes RBAC is

      enabled and Azure RBAC for Kubernetes Authorization is disabled for this sp'
    severity: medium
- id: 5.5.2
  title: Use Microsoft Entra ID authorization for the Kubernetes API
  scoring: manual
  profile:
  - Level 2
  description: Using Microsoft Entra ID authorization for the Kubernetes API helps centralize AKS access control in the same
    Azure IAM model used for other Azure resources, instead of managing human user permissions only through Kubernetes bindings.
    At a high level, this improves consistency, makes access assignment easier to govern across subscriptions and clusters,
    and supports least privilege access by assigning only the Azure roles needed for Kubernetes API use.
  rationale: Microsoft Entra ID authorization for the Kubernetes API uses a Kubernetes authorization webhook after the user
    is authenticated through Microsoft Entra ID. Requests to the Kubernetes API follow the Entra integrated authentication
    flow, and once the calling identity is validated, AKS uses Azure RBAC role assignments to determine what Kubernetes resources
    that identity can access. AKS supports this model with built in Azure roles such as Azure Kubernetes Service RBAC Reader,
    Writer, Admin, and Cluster Admin, and it also allows the use of custom Azure roles where needed. Role assignments can
    be limited to a namespace or cluster, or inherited from the resource group, subscription, or management group that contains
    the cluster. This authorization model depends on managed Microsoft Entra integration being enabled on the cluster first.
    It also requires the Microsoft Entra tenant used for authentication to be the same tenant associated with the subscription
    that contains the AKS cluster. Identities that do not authenticate through Entra, such as Kubernetes service accounts,
    are not evaluated through Microsoft Entra ID authorization and continue to use standard Kubernetes RBAC instead. When
    custom Azure RBAC roles are used, permission design should account for the difference between custom resource definitions
    (CRDs) and standard Kubernetes resources. Standard Kubernetes resources use the supported AKS data actions defined in
    the custom role. For custom resources, current AKS authorization supports custom roles with Azure ABAC conditions that
    can limit access to required CRD groups and kinds. This avoids granting access to every custom resource when only specific
    CRDs are required. Page 200
  impact: This model shifts AKS authorization for Entra users and groups into Azure role assignment management, which reduces
    the need to maintain Kubernetes RoleBinding and ClusterRoleBinding objects for those human identities. Operationally,
    access changes are subject to Azure role assignment propagation, and Microsoft notes new assignments can take up to five
    minutes to take effect. Assignments made above the cluster can apply to multiple current and future clusters, so an incorrect
    assignment level can grant more access than intended. Users can also be denied access if they have permission to retrieve
    cluster credentials but lack an AKS RBAC role that authorizes Kubernetes API operations.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-cluster-authorization
  page_start: 200
  audit_raw: "Review the AKS cluster to confirm AKS managed Microsoft Entra integration is enabled\nand Microsoft Entra ID\
    \ authorization for the Kubernetes API is turned on, because this\nauthorization model depends on managed Entra integration\
    \ first. Then verify that\naccess for human users, groups, and service principals and groups is being granted\nthrough\
    \ Azure role assignments for Kubernetes authorization rather than primarily\nthrough Kubernetes RoleBinding and ClusterRoleBinding\
    \ objects for those Entra\nidentities. As part of the review, confirm the cluster is using the same Entra tenant as\n\
    the subscription that contains the AKS cluster, since that is a requirement for this\nauthorization model.Also review\
    \ role assignments inherited from Azure resource levels\nabove the cluster.\nUse the following command to review the cluster\
    \ configuration:\naz aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query\n\"{managedEntra:aadProfile.managed,azureRbac:aadProfile.enableAzureRbac,tenantId:aad\n\
    Profile.tenantId,localAccountsDisabled:disableLocalAccounts}\" -o json\n1. Confirm managedEntra and azureRbac are true.\n\
    2. Confirm tenantId matches the Microsoft Entra tenant associated with the Azure\nsubscription.\n3. Review direct and\
    \ inherited Azure role assignments and confirm each user,\ngroup, or service principal has only the required AKS RBAC\
    \ role.\n4. Review custom roles and Azure ABAC conditions for custom resource access\nand confirm they identify only the\
    \ required CRD groups and kinds.\n5. Confirm localAccountsDisabled is true when all human access must use\nMicrosoft Entra\
    \ ID.\n Page 201"
  remediation: 'If the cluster is not using Microsoft Entra ID authorization for the Kubernetes API,

    enable AKS managed Microsoft Entra integration first, then enable Azure RBAC on the

    cluster and move user access management to Azure role assignments using the built in

    AKS RBAC roles or approved custom roles. For stronger control, pair this with disabling

    local accounts so static --admin access does not remain available as an alternate

    path; if local accounts are disabled on an existing cluster, rotate cluster certificates to

    revoke previously issued local account credentials. For custom resource access, use an

    approved custom role and Azure ABAC conditions to limit access to the required CRD

    groups and kinds where supported.

    1. Enable AKS managed Microsoft Entra integration and Azure RBAC for

    Kubernetes authorization.

    2. Assign approved Microsoft Entra groups the minimum required Azure Kubernetes

    Service RBAC role at the required namespace or cluster. Use a higher Azure

    resource level only when access must apply to every cluster below that resource.

    3. Remove obsolete or duplicate Azure role assignments and retire Kubernetes

    bindings for human Entra identities after replacement access has been validated.

    4. Create approved custom roles and Azure ABAC conditions for required custom

    resource access.

    5. Disable local accounts after the Microsoft Entra access path is verified. For an

    existing cluster, rotate cluster certificates to revoke previously issued local

    credentials.'
  checks:
  - type: manual_review
    info: 'Review the AKS cluster to confirm AKS managed Microsoft Entra integration is enabled

      and Microsoft Entra ID authorization for the Kubernetes API is turned on, because this

      authorization model depends on managed Entra integration first. Then verify that

      access for human users, groups, and service principals and groups is being granted

      through Azure role assignments for Kubernetes authorization rather than primarily

      through Kubernetes RoleBinding and ClusterRoleBinding objects for those Entra

      iden'
    severity: medium
