    \ minimum required permissions and service accounts\ncontinue to rely on Kubernetes RBAC.\n• Update each affected custom\
    \ Role to remove unnecessary bind, escalate, or\nimpersonate rules.\n• Update each affected custom ClusterRole to retain\
    \ only the specific elevated\npermission that is explicitly required.\n• Remove unnecessary corresponding DataActions\
    \ from Azure custom roles used\nto authorize access to the Kubernetes API.\n• Replace broad assignments with roles that\
    \ have fewer permissions, and limit\naccess to the required namespace rather than the entire cluster where possible.\n\
    \ Page 85\n• Do not assign these permissions to workload service accounts unless there is a\ndocumented and approved need.\n\
    • Revalidate access after the change to confirm that only approved administrative\nidentities retain these permissions."
