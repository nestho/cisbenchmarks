- id: 5.1.4
  title: Restrict AKS workloads to approved container registries only
  scoring: manual
  profile:
  - Level 2
  description: Configure AKS so workloads pull images only from registries that have been explicitly approved by the organization,
    such as selected ACR instances or other trusted registries. This is typically enforced with Azure Policy by auditing or
    denying deployments whose image references do not match approved image source patterns, while AKS to ACR integration provides
    the managed identity and pull role pattern needed for authorized image retrieval from those registries.
  rationale: Limiting AKS to approved registries reduces the chance that pods will run images from unknown, unvetted, or malicious
    sources. Microsoft recommends deploying only validated images, and the built in policy for allowed images is intended
    to reduce exposure to unknown vulnerabilities, security issues, and malicious images from untrusted registries. The policy
    evaluates the complete image reference against configured patterns, allowing approved registry and repository paths to
    be enforced consistently.
  impact: Enforcement may block deployments that reference nonapproved registries until those images are moved to, or mirrored
    into, an approved source. It also requires policy maintenance and valid pull permissions for each approved registry, but
    it strengthens image provenance and deployment consistency in AKS. A deny policy blocks new or updated noncompliant workloads
    but does not remove existing running pods, so existing image references must also be reviewed. Page 161
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
  - 2. https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-inpolicies
  page_start: 161
  audit_raw: 'Review AKS image source controls to confirm workloads are limited to approved

