- id: 3.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Ensure that the kubelet on each AKS worker node has --client-ca-file configured with the appropriate trusted
    CA file. This enables the kubelet to authenticate X.509 client certificates presented to its HTTPS endpoint.
  rationale: The kubelet HTTPS endpoint exposes information of varying sensitivity and operations with significant authority
    on the node and inside containers. When --client-ca-file is configured, the kubelet uses the CA certificates in the specified
    file to verify that a presented client certificate was issued by a trusted CA before accepting the certificate as an authenticated
    identity. The CA file defines which certificate issuers the kubelet trusts. It does not authorize access by itself. After
    authentication, the request must still pass kubelet authorization, preferably through Webhook. AKS creates a CA unique
    to the cluster and uses certificates for authentication between managed control plane and data plane components, so the
    kubelet must retain the AKS managed CA file required for those connections.
  impact: If the CA file is missing, unreadable, expired, or does not contain the required CA certificate, X.509 client certificate
    authentication is unavailable or valid clients fail authentication. This can disrupt control plane or administrative access
    to kubelet functions, including logs, metrics, and container operations. A missing CA file does not cause the kubelet
    to trust arbitrary certificates. If the file contains an unintended CA certificate, certificates issued by that CA can
    authenticate to the kubelet, although authorization must still permit the requested operation. Page 45
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
