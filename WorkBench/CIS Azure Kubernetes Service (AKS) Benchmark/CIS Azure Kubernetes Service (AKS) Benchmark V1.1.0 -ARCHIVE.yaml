- id: 5.5.1
  title: Manage Kubernetes RBAC users with Azure AD
  scoring: manual
  profile:
  - Level 2
  description: Azure Kubernetes Service (AKS) can be configured to use Azure Active Directory (AD) for user authentication.
    In this configuration, you sign in to an AKS cluster using an Azure AD authentication token. You can also configure Kubernetes
    role-based access control (Kubernetes RBAC) to limit access to cluster resources based a user's identity or group membership.
  rationale: Kubernetes RBAC and AKS help you secure your cluster access and provide only the minimum required permissions
    to developers and operators.
