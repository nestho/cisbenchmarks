controls:
- id: '2.1'
  title: Logging 2.1.1 Enable audit Logs
  scoring: manual
  profile:
  - Level 1
  description: With Azure Kubernetes Service (AKS), the control plane components such as the kubeapiserver and kube-controller-manager
    are provided as a managed service. You create and manage the nodes that run the kubelet and container runtime, and deploy
    your applications through the managed Kubernetes API server. To help troubleshoot your application and services, you may
    need to view the logs generated by these control plane components. To help collect and review data from multiple sources,
    Azure Monitor logs provides a query language and analytics engine that provides insights to your environment. A workspace
    is used to collate and analyze the data, and can integrate with other Azure services such as Application Insights and
    Security Center.
  rationale: Exporting logs and metrics to a dedicated, persistent datastore ensures availability of audit data following
    a cluster security event, and provides a central location for analysis of log and metric data collated from multiple sources.
  impact: 'What is collected from Kubernetes clusters Container insights includes a predefined set of metrics and inventory
    items collected that are written as log data in your Log Analytics workspace. All metrics listed below are collected by
    default every one minute. Node metrics collected The following list is the 24 metrics per node that are collected: cpuUsageNanoCores
    cpuCapacityNanoCores cpuAllocatableNanoCores memoryRssBytes memoryWorkingSetBytes memoryCapacityBytes memoryAllocatableBytes
    restartTimeEpoch used (disk) free (disk) used_percent (disk) io_time (diskio) writes (diskio) reads (diskio) write_bytes
    (diskio) write_time (diskio) iops_in_progress (diskio) read_bytes (diskio) read_time (diskio) err_in (net) err_out (net)
    bytes_recv (net) bytes_sent (net) Kubelet_docker_operations (kubelet) Container metrics The following list is the eight
    metrics per container collected: 14 | P a g e cpuUsageNanoCores cpuRequestNanoCores cpuLimitNanoCores memoryRssBytes memoryWorkingSetBytes
    memoryRequestBytes memoryLimitBytes restartTimeEpoch Cluster inventory The following list is the cluster inventory data
    collected by default: KubePodInventory – 1 per minute per container KubeNodeInventory – 1 per node per minute KubeServices
    – 1 per service per minute ContainerInventory – 1 per container per minute'
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://docs.microsoft.com/en-us/azure/aks/view-master-logs
  page_start: 14
  audit_raw: ''
  remediation: 'Azure audit logs are enabled and managed in the Azure portal. To enable log collection for

    the Kubernetes master components in your AKS cluster, open the Azure portal in a web

    browser and complete the following steps:

    1. Select the resource group for your AKS cluster, such as myResourceGroup. Don''t

    select the resource group that contains your individual AKS cluster resources, such

    as MC_myResourceGroup_myAKSCluster_eastus.

    2. On the left-hand side, choose Diagnostic settings.

    3. Select your AKS cluster, such as myAKSCluster, then choose to Add diagnostic

    setting.

    4. Enter a name, such as myAKSClusterLogs, then select the option to Send to Log

    Analytics.

    5. Select an existing workspace or create a new one. If you create a workspace, provide

    a workspace name, a resource group, and a location.

    6. In the list of available logs, select the logs you wish to enable. For this example,

    enable the kube-audit and kube-audit-admin logs. Common logs include the kubeapiserver, kube-controller-manager, and kube-scheduler.
    You can return and change

    the collected logs once Log Analytics workspaces are enabled.

    7. When ready, select Save to enable collection of the selected logs.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: manual
  profile:
  - Level 1
  description: If kubelet is running, and if it is using a file-based kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 19
  audit_raw: 'SSH to the worker nodes

    To check to see if the Kubelet Service is running:

    sudo systemctl status kubelet

    The output should return Active: active (running) since..

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -ef | grep kubelet

    The output of the above command should return something similar to --kubeconfig

    /var/lib/kubelet/kubeconfig which is the location of the kubeconfig file.

    Run this command to obtain the kubeconfig file permissions:

    stat -c %a /var/lib/kubelet/kubeconfig

    19 | P a g e

    The output of the above command gives you the kubeconfig file''s permissions.

    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.'
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'SSH to the worker nodes

