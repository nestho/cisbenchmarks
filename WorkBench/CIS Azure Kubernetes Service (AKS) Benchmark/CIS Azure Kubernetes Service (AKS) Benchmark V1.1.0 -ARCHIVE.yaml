- id: 3.2.11
  title: Ensure that the RotateKubeletServerCertificate argument is set to true
  scoring: manual
  profile:
  - Level 1
  description: Enable kubelet server certificate rotation.
  rationale: 'RotateKubeletServerCertificate causes the kubelet to both request a serving certificate after bootstrapping
    its client credentials and rotate the certificate as its existing credentials expire. This automated periodic rotation
    ensures that the there are no downtimes due to expired certificates and thus addressing availability in the CIA security
    triad. Note: This recommendation only applies if you let kubelets get their certificates from the API server. In case
    your kubelet certificates come from an outside authority/tool (e.g. Vault) then you need to take care of rotation yourself.'
  impact: None
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/45059
  - 2. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#kubeletconfiguration
