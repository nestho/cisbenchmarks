    kubectl get psp <name> -o=jsonpath=''{.spec.runAsUser.rule}''

    Verify that there is at least one PSP which returns MustRunAsNonRoot or MustRunAs with the

    range of UIDs not including 0.'
  remediation: '84 | P a g e

