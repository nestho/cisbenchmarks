- id: 4.2.7
  title: Minimize the admission of containers with the NET_RAW capability
  scoring: scored
  profile:
  - Level 1
  description: Do not generally permit containers with the potentially dangerous NET_RAW capability.
  rationale: Containers run with a default set of capabilities as assigned by the Container Runtime. By default this can include
    potentially dangerous capabilities. With Docker as the container runtime the NET_RAW capability is enabled which may be
    misused by malicious containers. Ideally, all containers should drop this capability. There should be at least one PodSecurityPolicy
    (PSP) defined which prevents containers with the NET_RAW capability from launching. If you need to run containers with
    this capability, this should be defined in a separate PSP and you should carefully check RBAC controls to ensure that
    only limited service accounts and users are given permission to access that PSP.
  impact: Pods with containers which run with the NET_RAW capability will not be permitted.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/pod-security-policy/#enabling-podsecurity-policies
  - 2. https://www.nccgroup.trust/uk/our-research/abusing-privileged-andunprivileged-linux-containers/
  page_start: 86
  audit_raw: 'Get the set of PSPs with the following command:

    kubectl get psp

