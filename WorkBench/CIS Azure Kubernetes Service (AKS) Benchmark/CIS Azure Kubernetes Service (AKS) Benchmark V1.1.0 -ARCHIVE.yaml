- id: 3.2.6
  title: Ensure that the --protect-kernel-defaults argument is set to true
  scoring: manual
  profile:
  - Level 1
  description: Protect tuned kernel parameters from overriding kubelet default kernel parameter values.
  rationale: Kernel parameters are usually tuned and hardened by the system administrators before putting the systems into
    production. These parameters protect the kernel and the system. Your kubelet kernel defaults that rely on such parameters
    should be appropriately set to match the desired secured system state. Ignoring this could potentially lead to running
    pods with undesired kernel behavior.
  impact: You would have to re-tune kernel parameters to match kubelet parameters.
  references:
