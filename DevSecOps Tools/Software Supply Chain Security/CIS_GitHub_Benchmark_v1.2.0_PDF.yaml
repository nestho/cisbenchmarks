  title: Ensure force push code to branches is denied
  scoring: manual
  profile:
  - Level 1
  description: The "Force Push" option allows users with "Push" permissions to force their changes directly to the branch
    without a pull request, and thus should be disabled.
  rationale: The "Force Push" option allows users to override the existing code with their own code. This can lead to both
    intentional and unintentional data loss, as well as data infection with malicious code. Disabling the "Force Push" option
    prohibits users from forcing their changes to the master branch, which ultimately prevents malicious code from entering
    source code.
  impact: Users cannot force push to protected branches.
