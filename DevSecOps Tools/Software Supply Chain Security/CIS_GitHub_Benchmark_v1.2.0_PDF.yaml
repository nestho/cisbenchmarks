  title: Ensure the build environment is logged
  scoring: manual
  profile:
  - Level 1
  description: Keep build logs of the build environment detailing configuration and all activity within it. Also, consider
    to store them in a centralized organizational log store.
  rationale: 'Logging the environment is important for two primary reasons: one, for debugging and investigating the environment
    in case of a bug or security incident; and two, for reproducing the environment easily when needed. Storing these logs
    in a centralized organizational log store allows the organization to generate useful insights and identify anomalies in
    the build process faster.'
  impact: ''
  references: []
  page_start: 128
  audit_raw: 'Verify that the build environment is logged and stored in a centralized organizational log

    store.'
  remediation: 'Keep logs of the build environment. For example, use the .buildinfo file for Debian build

    workers. Also, store the logs in a centralized organizational log store.'
  checks:
  - type: manual_review
    info: 'Verify that the build environment is logged and stored in a centralized organizational log

      store.'
    severity: medium
- id: 2.1.4
  title: Ensure the creation of the build environment is automated
  scoring: manual
  profile:
  - Level 1
  description: Automate the creation of the build environment.
  rationale: Automating the deployment of the build environment reduces the risk for human mistakes — such as a wrong configuration
    or exposure of sensitive data — because it requires less human interaction and intervention. It also eases re-deployment
    of the environment. It is best to automate with Infrastructure as Code because it offers more control over changes made
    to the environment creation configuration and stores to a version control platform.
  impact: ''
  references: []
  page_start: 129
  audit_raw: 'Verify that the deployment of the build environment is automated and can be easily

    redeployed.'
  remediation: Automate the deployment of the build environment.
  checks:
  - type: manual_review
    info: 'Verify that the deployment of the build environment is automated and can be easily

      redeployed.'
    severity: medium
- id: 2.1.5
  title: Ensure access to build environments is limited
  scoring: manual
  profile:
  - Level 1
  description: Restrict access to the build environment (orchestrator, pipeline executor, their environment, etc.) to trusted
    and qualified users only.
  rationale: A build environment contains sensitive data such as environment variables, secrets, and the source code itself.
    Any user that has access to this environment can make changes to the build process, including changes to the code within
    it. Restricting access to the build environment to trusted and qualified users only will reduce the risk for mistakes
    such as exposure of secrets or misconfiguration. Limiting access also reduces the number of accounts that are vulnerable
    to hijacking in order to potentially harm the build environment.
  impact: Reducing the number of users who have access to the build process means those users would lose their ability to
    make direct changes to that process.
  references: []
  page_start: 130
  audit_raw: Verify each build environment is accessible only to known and authorized users.
  remediation: Restrict access to the build environment to trusted and qualified users.
  checks:
  - type: manual_review
    info: Verify each build environment is accessible only to known and authorized users.
    severity: medium
- id: 2.1.6
  title: Ensure users must authenticate to access the build environment
  scoring: manual
  profile:
  - Level 1
  description: Require users to login in to access the build environment - where the orchestrator, the pipeline executer,
    where the build workers are running, etc.
  rationale: Requiring users to authenticate and disabling anonymous access to the build environment allows organization to
    track every action on that environment, good or bad, to its actor. This will help recognizing attack and its attacker
    because the authentication is required.
  impact: Anonymous users won't be able to access the build environment.
  references: []
  page_start: 132
  audit_raw: Ensure authentication is required to access the build environment.
  remediation: Require authentication to access the build environment and disable anonymous access.
  checks:
  - type: manual_review
    info: Ensure authentication is required to access the build environment.
    severity: medium
- id: 2.1.7
  title: Ensure build secrets are limited to the minimal necessary scope
  scoring: manual
  profile:
  - Level 2
  description: Build tools providers offer a secure way to store secrets that should be used during the build process. These
    secrets will often be credentials used to access other tools, for example for pulling code or for uploading artifacts.
    Access to these secrets can be defined on various scopes, for example in github it could be on an organization level or
    a repository level and there is also control on whether these secrets are passed to forked pull request. To protect these
    critical assets it is important to choose the most restrictive scope necessary.
  rationale: Allowing over permissive access to these secrets may affect on their exposure. For example if a secret is defined
    in an organization level, and users can create new repositories, there is a scenario where a user can create a new repo
    and run a controlled build just to exfiltrate these secrets.
  impact: Increased risk of exposure of build related secrets.
  references: []
  page_start: 133
  audit_raw: 'For each build tool in use, review the secrets defined and the permission scopes they

    are assigned.'
  remediation: 'For each build tool, review the secrets defined and their permissions scope and change

    over permissive scopes to more restrictive ones based on the required access.'
  checks:
  - type: manual_review
    info: 'For each build tool in use, review the secrets defined and the permission scopes they

      are assigned.'
    severity: medium
- id: 2.1.8
  title: Ensure the build infrastructure is automatically scanned for vulnerabilities
  scoring: manual
  profile:
  - Level 1
  description: Scan the build infrastructure and its dependencies for vulnerabilities. It is recommended that this be done
    automatically.
  rationale: Automatic scanning for vulnerabilities detects known vulnerabilities in the tooling used by the build infrastructure
    and its dependencies. These vulnerabilities can lead to a potentially massive breach if not handled as fast as possible,
    as attackers might also be aware of such vulnerabilities.
  impact: ''
  references: []
  page_start: 135
  audit_raw: Verify that your build infrastructure is automatically scanned for vulnerabilities.
  remediation: Set an automated vulnerability scanning for your build infrastructure.
  checks:
  - type: manual_review
    info: Verify that your build infrastructure is automatically scanned for vulnerabilities.
    severity: medium
- id: 2.1.9
  title: Ensure default passwords are not used
  scoring: manual
  profile:
  - Level 1
  description: Do not use default passwords of build tools and components.
  rationale: Sometimes build tools and components are provided with default passwords for the first login. This password is
    intended to be used only on the first login and should be changed immediately after. Using the default password substantially
    increases the attack risk. It is especially important to ensure that default passwords are not used in build tools and
    components.
  impact: ''
  references: []
  page_start: 136
  audit_raw: For each build tool, ensure the password used is not the default one.
  remediation: For each build tool, change the default password.
  checks:
  - type: manual_review
    info: For each build tool, ensure the password used is not the default one.
    severity: medium
- id: 2.1.10
  title: Ensure webhooks of the build environment are secured
  scoring: manual
  profile:
  - Level 1
  description: Use secured webhooks of the build environment.
  rationale: Webhooks are used for triggering an HTTP request based on an action made in the platform. Typically, build environment
    feature webhooks for a pipeline trigger based on source code event. Since webhooks are an HTTP POST request, they can
    be malformed if not secured over SSL. To prevent a potential hack and compromise of the webhook or to the environment
    or web server excepting the request, use only secured webhooks.
  impact: ''
  references: []
  page_start: 137
  audit_raw: For each webhook in use, ensure it is secured (HTTPS).
  remediation: For each webhook in use, change it to secured (over HTTPS).
  checks:
  - type: manual_review
    info: For each webhook in use, ensure it is secured (HTTPS).
    severity: medium
- id: 2.1.11
  title: Ensure minimum number of administrators are set for the build environment
  scoring: manual
  profile:
  - Level 1
  description: Ensure the build environment has a minimum number of administrators.
  rationale: Build environment administrators have the highest level of permissions, including the ability to add/remove users,
    create or delete pipelines, control build workers, change build trigger permissions and more. Due to the permissive access
    granted to a build environment administrator, it is highly recommended to keep the number of administrator accounts as
    minimal as possible.
  impact: ''
  references: []
  page_start: 138
  audit_raw: Verify that the build environment has only the minimum number of administrators.
  remediation: Set the minimum number of administrators in the build environment.
  checks:
  - type: manual_review
    info: Verify that the build environment has only the minimum number of administrators.
    severity: medium
- id: 2.2.1
  title: Ensure build workers are single-used
  scoring: manual
  profile:
  - Level 1
  description: Use a clean instance of build worker for every pipeline run.
  rationale: Using a clean instance of build worker for every pipeline run eliminates the risks of data theft, data integrity
    breaches, and unavailability. It limits the pipeline's access to data stored on the file system from previous runs, and
    the cache is volatile. This prevents malicious changes from affecting other pipelines or the Continuous Integration/Continuous
    Delivery system itself.
  impact: Data and cache will not be saved in different pipeline runs.
  references: []
  page_start: 140
  audit_raw: Ensure that every pipeline that is being run has its own clean, new runner.
  remediation: Create a clean build worker for every pipeline that is being run, or use build platformhosted runners, as they
    typically offer a clean instance for every run.
  checks:
  - type: manual_review
    info: Ensure that every pipeline that is being run has its own clean, new runner.
    severity: medium
- id: 2.2.2
  title: Ensure build worker environments and commands are passed and not pulled
  scoring: manual
  profile:
  - Level 1
  description: A worker’s environment can be passed (for example, a pod in a Kubernetes cluster in which an environment variable
    is passed to it). It also can be pulled, like a virtual machine that is installing a package. Ensure that the environment
    and commands are passed to the workers and not pulled from it.
  rationale: Passing an environment means additional configuration happens in the build time phase and not in run time. It
    will also pass locally and not remotely. Passing a worker environment, instead of pulling it from an outer source, reduces
    the possibility for an attacker to gain access and potentially pull malicious code into it. By passing locally and not
    pulling from remote, there is also less chance of an attack based on the remote connection, such as a man-in-the-middle
    or malicious scripts that can run from remote. This therefore prevents possible infection of the build worker.
  impact: ''
  references: []
  page_start: 141
  audit_raw: 'For each build worker, ensure its environment and commands are passed and not

    pulled.'
  remediation: For each build worker, pass its environment and commands to it instead of pulling it.
  checks:
  - type: manual_review
    info: 'For each build worker, ensure its environment and commands are passed and not

      pulled.'
    severity: medium
- id: 2.2.3
  title: Ensure the duties of each build worker are segregated
  scoring: manual
  profile:
  - Level 1
  description: Separate responsibilities in the build workflow, such as testing, compiling, pushing artifacts, etc., to different
    build workers so that each worker will have a single duty.
  rationale: Separating duties and allocating them to many workers makes it easier to verify each step in the build process
    and ensure there is no corruption. It also limits the effect of an attack on a build worker, as such an attack would be
    less critical if the worker has less access and duties that are subject to harm.
  impact: ''
  references: []
  page_start: 142
  audit_raw: 'For each build worker, ensure it has the least responsibility possible, preferably only

    one duty.'
  remediation: For each build worker, limit its responsibility to one duty.
  checks:
  - type: manual_review
    info: 'For each build worker, ensure it has the least responsibility possible, preferably only

      one duty.'
    severity: medium
- id: 2.2.4
  title: Ensure build workers have minimal network connectivity
  scoring: manual
  profile:
  - Level 1
  description: Ensure that build workers have minimal network connectivity.
  rationale: Restricting the network connectivity of build workers decreases the possibility that an attacker would be capable
    of entering the organization from the outside. If the build workers are connected to the public internet without any restriction,
    it is far simpler for attackers to compromise them. Limiting network connectivity between build workers also protects
    the organization in case an attacker was successful and subsequently attempts to spread the attack to other components
    of the environment.
  impact: Developers will not have connectivity to every resource they might need from the outside. Workers will also only
    be able to exchange data through shareable storage.
  references: []
  page_start: 143
  audit_raw: 'Verify that build workers, environment, and any other components have only the

    required minimum of network connectivity.'
  remediation: 'Limit the network connectivity of build workers, environment, and any other components

    to the necessary minimum.'
  checks:
  - type: manual_review
    info: 'Verify that build workers, environment, and any other components have only the

      required minimum of network connectivity.'
    severity: medium
- id: 2.2.5
  title: Ensure run-time security is enforced for build workers
  scoring: manual
  profile:
  - Level 1
  description: Add traces to build workers' operating systems and installed applications so that in run time, collected events
    can be analyzed to detect suspicious behavior patterns and malware.
  rationale: Build workers are exposed to data exfiltration attacks, code injection attacks, and more while running. It is
    important to secure them from such attacks by enforcing run-time security on the build worker itself. This will identify
    attempted attacks in real time and prevent them.
  impact: ''
  references: []
  page_start: 145
  audit_raw: Verify that a run-time security solution is enforced on every active build worker.
  remediation: Deploy and enforce a run-time security solution on build workers.
  checks:
  - type: manual_review
    info: Verify that a run-time security solution is enforced on every active build worker.
    severity: medium
- id: 2.2.6
  title: Ensure build workers are automatically scanned for vulnerabilities
  scoring: manual
  profile:
  - Level 1
  description: Scan build workers for vulnerabilities. It is recommended that this be done automatically.
  rationale: Automatic scanning for vulnerabilities detects known weaknesses in environmental sources in use, such as docker
    images or kernel versions. Such vulnerabilities can lead to a massive breach if these environments are not replaced as
    fast as possible, since attackers also know about these vulnerabilities and often try to take advantage of them. Setting
    automatic scanning which scans environmental sources ensures that if any new vulnerability is revealed, it can be replaced
    quickly and easily. This protects the worker from being exposed to attacks.
  impact: ''
  references: []
  page_start: 146
  audit_raw: 'For each build worker, ensure the environmental sources it uses are scanned for

    vulnerabilities.'
  remediation: 'For each build worker, automatically scan its environmental sources, such as docker

    image, for vulnerabilities.'
  checks:
  - type: manual_review
    info: 'For each build worker, ensure the environmental sources it uses are scanned for

      vulnerabilities.'
    severity: medium
- id: 2.2.7
  title: Ensure build workers' deployment configuration is stored in a version control platform
  scoring: manual
  profile:
  - Level 1
  description: Store the deployment configuration of build workers in a version control platform, such as Github.
  rationale: Build workers are a sensitive part of the build phase. They generally have access to the code repository, the
    Continuous Integration platform, the deployment platform, etc. This means that an attacker gaining access to a build worker
    may compromise other platforms in the organization and cause a major incident. One thing that can protect workers is to
    ensure that their deployment configuration is safe and well-configured. Storing the deployment configuration in version
    control enables more observability of these configurations because everything is catalogued in a single place. It adds
    another layer of security, as every change will be reviewed and noticed, and thus malicious changes will theoretically
    occur less. In the case of a mistake, bug, or security incident, it also offers an easier way to "revert" back to a safe
    version or add a "hot fix" quickly.
  impact: Changes in deployment configuration may only be applied by declaration in the version control platform. This could
    potentially slow down the development process.
  references: []
  page_start: 147
  audit_raw: 'Verify that the deployment configuration of build workers is stored in a version control

    platform.'
  remediation: 'Document and store every deployment configuration of build workers in a version

    control platform.'
  checks:
  - type: manual_review
    info: 'Verify that the deployment configuration of build workers is stored in a version control

      platform.'
    severity: medium
- id: 2.2.8
  title: Ensure resource consumption of build workers is monitored
  scoring: manual
  profile:
  - Level 1
  description: Monitor the resource consumption of build workers and set alerts for high consumption that can lead to resource
    exhaustion.
  rationale: Resource exhaustion is when machine resources or services are highly consumed until exhausted. Resource exhaustion
    may lead to DOS (Denial of Service). When such a situation happens to build workers, it slows down and even stops the
    build process, which harms the production of artifacts and the organization's ability to deliver software on schedule.
    To prevent that, it is recommended to monitor resources consumption in the build workers and set alerts to notify when
    they are highly consumed. That way resource exhaustion can be acknowledged and prevented at an early stage.
  impact: ''
  references: []
  page_start: 149
  audit_raw: Verify that there is monitoring of resources consumption for each build worker.
  remediation: Set reources consumption monitoring for each build worker.
  checks:
  - type: manual_review
    info: Verify that there is monitoring of resources consumption for each build worker.
    severity: medium
- id: 2.3.1
  title: Ensure all build steps are defined as code
  scoring: manual
  profile:
  - Level 1
  description: Use pipeline as code for build pipelines and their defined steps.
  rationale: Storing pipeline instructions as code in a version control system means automation of the build steps and less
    room for human error, which could potentially lead to a security breach. Additionally, It creates the ability to revert
    back to a previous pipeline configuration in order to pinpoint the affected change should a malicious incident occur.
  impact: ''
  references: []
  page_start: 151
  audit_raw: Verify that all build steps are defined as code and stored in a version control system.
  remediation: 'Convert pipeline instructions into code-based syntax and upload them to the

    organization''s version control platform.'
  checks:
  - type: manual_review
    info: Verify that all build steps are defined as code and stored in a version control system.
    severity: medium
- id: 2.3.2
  title: Ensure steps have clearly defined build stage input and output
  scoring: manual
  profile:
  - Level 1
  description: Define clear expected input and output for each build stage.
  rationale: In order to have more control over data flow in the build pipeline, clearly define the input and output of the
    pipeline steps. If anything malicious happens during the build stage, it will be recognized more easily and stand out
    as an anomaly.
  impact: ''
  references: []
  page_start: 152
  audit_raw: For each build stage, verify that the expected input and output are clearly defined.
  remediation: For each build stage, clearly define what is expected for input and output.
  checks:
  - type: manual_review
    info: For each build stage, verify that the expected input and output are clearly defined.
    severity: medium
- id: 2.3.3
  title: Ensure output is written to a separate, secured storage repository
  scoring: manual
  profile:
  - Level 1
  description: Write pipeline output artifacts to a secured storage repository.
  rationale: To maintain output artifacts securely and reduce the potential surface for attack, store such artifacts separately
    in secure storage. This separation enforces the Single Responsibility Principle by ensuring the orchestration platform
    will not be the same as the artifact storage, which reduces the potential harm of an attack. Using the same security considerations
    as the input (for example, the source code) will protect artifacts stored and will make it harder for a malicious actor
    to successfully execute an attack.
  impact: ''
  references: []
  page_start: 153
  audit_raw: 'For each pipeline that produces output artifacts, ensure that they''re written to a secured

    storage repository.'
  remediation: 'For each pipeline that produces output artifacts, write them to a secured storage

    repository.'
  checks:
  - type: manual_review
    info: 'For each pipeline that produces output artifacts, ensure that they''re written to a secured

      storage repository.'
    severity: medium
- id: 2.3.4
  title: Ensure changes to pipeline files are tracked and reviewed
  scoring: manual
  profile:
  - Level 1
  description: Track and review changes to pipeline files.
  rationale: Pipeline files are sensitive files. They have the ability to access sensitive data and control the build process,
    thus it is just as important to review changes to pipeline files as it is to verify source code. Malicious actors can
    potentially add harmful code to these files, which may lead to sensitive data exposure and hijacking of the build environment
    or artifacts.
  impact: ''
  references: []
  page_start: 154
  audit_raw: For each pipeline file, ensure changes to it are being tracked and reviewed.
  remediation: For each pipeline file, track changes to it and review them.
  checks:
  - type: manual_review
    info: For each pipeline file, ensure changes to it are being tracked and reviewed.
    severity: medium
- id: 2.3.5
  title: Ensure access to build process triggering is minimized
  scoring: manual
  profile:
  - Level 1
  description: Restrict access to pipeline triggers.
  rationale: Build pipelines are used for multiple reasons. Some are very sensitive, such as pipelines which deploy to production.
    In order to protect the environment from malicious acts or human mistakes, such as a developer deploying a bug to production,
    it is important to apply the Least Privilege principle to pipeline triggering. This principle requires restrictions placed
    on which users can run which pipeline. It allows for sensitive pipelines to only be run by administrators, who are generally
    the most trusted and skilled members of the organization.
  impact: ''
  references: []
  page_start: 155
  audit_raw: For every pipeline in use, verify only the necessary users have permission to trigger it.
  remediation: For every pipeline in use, grant only the necessary users permission to trigger it.
  checks:
  - type: manual_review
    info: For every pipeline in use, verify only the necessary users have permission to trigger it.
    severity: medium
- id: 2.3.6
  title: Ensure pipelines are automatically scanned for misconfigurations
  scoring: manual
  profile:
  - Level 1
  description: Scan the pipeline for misconfigurations. It is recommended that this be performed automatically.
  rationale: Automatic scans for misconfigurations detect human mistakes and misconfigured tasks. This protects the environment
    from backdoors caused by such mistakes, which create easier access for attackers. For example, a task that mistakenly
    configures credentials to persist on the disk makes it easier for an attacker to steal them. This type of incident can
    be prevented by auto-scanning.
  impact: ''
  references: []
  page_start: 156
  audit_raw: For each pipeline, verify that it is automatically scanned for misconfigurations.
  remediation: For each pipeline, set automated misconfiguration scanning.
  checks:
  - type: manual_review
    info: For each pipeline, verify that it is automatically scanned for misconfigurations.
    severity: medium
- id: 2.3.7
  title: Ensure pipelines are automatically scanned for vulnerabilities
  scoring: manual
  profile:
  - Level 1
  description: Scan pipelines for vulnerabilities. It is recommended that this be implemented automatically.
  rationale: Automatic scanning for vulnerabilities detects known vulnerabilities in pipeline instructions and components,
    allowing faster patching in case one is found. These vulnerabilities can lead to a potentially massive breach if not handled
    as fast as possible, as attackers might also be aware of such vulnerabilities.
  impact: ''
  references: []
  page_start: 157
  audit_raw: For each pipeline, verify that it is automatically scanned for vulnerabilities.
  remediation: For each pipeline, set automated vulnerability scanning.
  checks:
  - type: manual_review
    info: For each pipeline, verify that it is automatically scanned for vulnerabilities.
    severity: medium
- id: 2.3.8
  title: Ensure scanners are in place to identify and prevent sensitive data in pipeline files
  scoring: scored
  profile:
  - Level 2
  description: Detect and prevent sensitive data, such as confidential ID numbers, passwords, etc., in pipelines.
  rationale: Sensitive data in pipeline configuration, such as cloud provider credentials or repository credentials, create
    vulnerabilities with which malicious actors could steal such information if they gain access to a pipeline. In order to
    mitigate this, set scanners that will identify and prevent the existence of sensitive data in the pipeline.
  impact: ''
  references: []
  page_start: 158
  audit_raw: 'For every pipeline that is in use, verify that scanners are set to identify and prevent the

    existence of sensitive data within it.'
  remediation: 'For every pipeline that is in use, set scanners that will identify and prevent sensitive

    data within it.'
  checks:
  - type: manual_review
    info: 'For every pipeline that is in use, verify that scanners are set to identify and prevent the

      existence of sensitive data within it.'
    severity: medium
- id: 2.4.1
  title: Ensure all artifacts on all releases are signed
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Sign all artifacts in all releases with user or organization keys.
  rationale: Signing artifacts is used to validate both their integrity and security. Organizations signal that artifacts
    may be trusted and they themselves produced them by ensuring that every artifact is properly signed. The presence of this
    signature also makes potentially malicious activity far more difficult.
  impact: ''
  references: []
  page_start: 160
  audit_raw: Ensure every artifact in every release is signed.
  remediation: For every artifact in every release, verify that all are properly signed.
  checks:
  - type: manual_review
    info: Ensure every artifact in every release is signed.
    severity: medium
- id: 2.4.2
  title: Ensure all external dependencies used in the build process are locked
  scoring: manual
  profile:
  - Level 1
  description: External dependencies may be public packages needed in the pipeline, or perhaps the public image being used
    for the build worker. Lock these external dependencies in every build pipeline.
  rationale: External dependencies are sources of code that aren't under organizational control. They might be intentionally
    or unintentionally infected with malicious code or have known vulnerabilities, which could result in sensitive data exposure,
    data harvesting, or the erosion of trust in an organization. Locking each external dependency to a specific, safe version
    gives more control and less chance for risk.
  impact: ''
  references:
  - 1. https://argon.io/blog/pipeline-composition-analysis-how-your-ci-pipeline-presentsnew-opportunities-for-attackers/
  page_start: 161
  audit_raw: Ensure every external dependency being used in pipelines is locked.
  remediation: For all external dependencies being used in pipelines, verify they are locked.
  checks:
  - type: manual_review
    info: Ensure every external dependency being used in pipelines is locked.
    severity: medium
- id: 2.4.3
  title: Ensure dependencies are validated before being used
  scoring: manual
  profile:
  - Level 1
  description: Validate every dependency of the pipeline before use.
  rationale: To ensure that a dependency used in a pipeline is trusted and has not been infected by malicious actor (for example,
    the codecov incident), validate dependencies before using them. This can be accomplished by comparing the checksum of
    the dependency to its checksum in a trusted source. If a difference arises, this is a sign that an unknown actor has interfered
    and may have added malevolent code. If this dependency is used, it will infect the environment, which could end in a massive
    breach and leave the organization exposed to data leaks, etc.
  impact: ''
  references: []
  page_start: 163
  audit_raw: For every dependency used in every pipeline, ensure it has been validated.
  remediation: For every dependency used in every pipeline, validate each one.
  checks:
  - type: manual_review
    info: For every dependency used in every pipeline, ensure it has been validated.
    severity: medium
- id: 2.4.4
  title: Ensure the build pipeline creates reproducible artifacts
  scoring: manual
  profile:
  - Level 1
  description: Verify that the build pipeline creates reproducible artifacts, meaning that an artifact of the build pipeline
    is the same in every run when given the same input.
  rationale: A reproducible build is a build that produces the same artifact when given the same input data. Ensuring that
    the build pipeline produces the same artifact when given the same input helps verify that no change has been made to the
    artifact. This action allows an organization to trust that its artifacts are built only from safe code that has been reviewed
    and tested and has not been tainted or changed abruptly.
  impact: ''
  references: []
  page_start: 165
  audit_raw: Ensure that build pipelines create reproducible artifacts.
  remediation: 'Create build pipelines that produce the same artifact given the same input (for example,

    artifacts that do not rely on timestamps).'
  checks:
  - type: manual_review
    info: Ensure that build pipelines create reproducible artifacts.
    severity: medium
- id: 2.4.5
