- id: 1.2.7
  title: Ensure inactive repositories are reviewed and archived periodically
  scoring: manual
  profile:
  - Level 1
  description: Track inactive repositories and remove them periodically.
  rationale: Inactive repositories (i.e., no new changes introduced for a long period of time) can enlarge the surface of
    a potential attack or data leak. These repositories are more likely to be improperly managed, and thus could possibly
    be accessed by a large number of users in an organization.
  impact: Bug fixes and deployment of necessary changes could prove complicated for archived repositories.
  references: []
