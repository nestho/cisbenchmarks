    info: For every artifact supplied, ensure it has a validated, signed Software Bill of Materials.
    severity: medium
- id: 3.1.7
  title: Ensure dependencies are pinned to a specific, verified version
  scoring: manual
  profile:
  - Level 1
  description: Pin dependencies to a specific version. Avoid using the "latest" tag or broad version.
  rationale: When using a wildcard version of a package, or the "latest" tag, the risk of encountering a new, potentially
    malicious package increases. The "latest" tag pulls the last package pushed to the registry. This means that if an attacker
    pushes a new, malicious package successfully to the registry, the next user who pulls the "latest" will pull it and risk
    attack. This same rule applies to a wildcard version - assuming one is using version v1.*, it will install the latest
    version of the major version 1, meaning that if an attacker can push a malicious package with that same version, those
    using it will be subject to possible attack. By using a secure, verified version, use is restricted to this version only
    and no other may be pulled, decreasing the risk for any malicious package.
  impact: ''
  references: []
  page_start: 181
  audit_raw: For every dependency in use, ensure it is pinned to a specific version.
  remediation: For every dependency in use, pin to a specific version.
  checks:
  - type: manual_review
    info: For every dependency in use, ensure it is pinned to a specific version.
    severity: medium
- id: 3.1.8
  title: Ensure all packages used are more than 60 days old
  scoring: manual
  profile:
  - Level 2
  description: Use packages that are more than 60 days old.
  rationale: Third-party packages are a major risk since an organization cannot control their source code, and there is always
    the possibility these packages could be malicious. It is therefore good practice to remain cautious with any third-party
    or open-source package, especially new ones, until they can be verified that they are safe to use. Avoiding a new package
    allows the organization to fully examine it, its maintainer, and its behavior, and gives enough time to determine whether
    or not to use it.
  impact: Developers may not use packages that are less than 60 days old.
  references: []
  page_start: 183
  audit_raw: For every package used, ensure it is more than 60 days old.
  remediation: If a package used is less than 60 days old, stop using it and find another solution.
