- id: 1.4.4
  title: Ensure only secured webhooks are used
  scoring: manual
  profile:
  - Level 1
  description: Use only secured webhooks in the source code management platform.
  rationale: A webhook is an event listener, attached to critical and sensitive parts of the software delivery process. It
    is triggered by a list of events (such as a new code being committed), and when triggered, the webhook sends out a notification
    with some payload to specific internet endpoints. Since the payload of the webhook contains sensitive organization data,
    it's important all webhooks are directed to an endpoint (URL) protected by SSL verification (HTTPS). This helps ensure
    that the data sent is delivered to securely without any man-in-the-middle, who could easily access and even alter the
    payload of the request.
  impact: 'Perform the following to ensure all webhooks used are secured (HTTPS): 1. Navigate to your organization or repository
    and select Settings. 2. Select Webhooks on the side menu. 3. Verify that each webhook URL starts with ''https''.'
  references: []
  page_start: 108
  audit_raw: 'Perform the following to secure all webhooks used(over HTTPS):

    1. Navigate to your organization or repository and select Settings.

    2. Select Webhooks on the side menu.

    3. Ensure all webhooks starts with ''https''.'
  remediation: 'Perform the following to secure all webhooks used(over HTTPS):

    1. Navigate to your organization or repository and select Settings.

    2. Select Webhooks on the side menu.

    3. Find the webhooks that starts with ''http'' and not ''https''.

    4. Ensure the endpoint (URL) of the webhook listens to secured port (443) and uses

    certificate.

    5. Click Edit.

    6. Change the payload URL to https and ensure Enable SSL verification is

    checked.

    7. Click Update webhook.'
  checks:
  - type: manual_review
    info: 'Perform the following to secure all webhooks used(over HTTPS):

      1. Navigate to your organization or repository and select Settings.

      2. Select Webhooks on the side menu.

      3. Ensure all webhooks starts with ''https''.'
    severity: medium
