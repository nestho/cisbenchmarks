- id: 3.2.3
  title: Ensure packages are automatically scanned for license implications
  scoring: manual
  profile:
  - Level 1
  description: A software license is a document that provides legal conditions and guidelines for the use and distribution
    of software, usually defined by the author. It is recommended to scan for any legal implications automatically.
  rationale: When using packages with software licenses, especially commercial ones which tend to be the strictest, it is
    important to verify that the use of the package meets the conditions of the license. If the use of the package violates
    the licensing agreement, it exposes the organization to possible lawsuits. Scanning used packages for such license implications
    leads to faster detection and quicker fixes of such violations, and also reduces the risk for a lawsuit.
