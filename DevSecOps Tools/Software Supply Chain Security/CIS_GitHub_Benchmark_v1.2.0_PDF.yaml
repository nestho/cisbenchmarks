  rationale: Build artifacts might contain sensitive data such as production configurations. In order to protect them and
    decrease the risk for breach, it is recommended to encrypt them before delivery. Encryption makes data unreadable, so
    even if attackers gain access to these artifacts, they won't be able to harvest sensitive data from them without the decryption
    key.
