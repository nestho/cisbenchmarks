- id: 1.3.11
  title: Ensure an organization provides SSH certificates
  scoring: manual
  profile:
  - Level 2
  description: As an organization, become an SSH Certificate Authority and provide SSH keys for accessing repositories.
  rationale: 'There are two ways for remotely working with Source Code Management: via HTTPS, which requires authentication
    by user/password, or via SSH, which requires the use of SSH keys. SSH authentication is better in terms of security; key
    creation and distribution, however, must be done in a secure manner. This can be accomplished by implementing SSH certificates,
    which are used to validate the server''s identity. A developer will not be able to connect to a Git server if its key
    cannot be verified by the SSH Certificate Authority (CA) server. As an organization, one can verify the SSH certificate
    signature used to authenticate if a CA is defined and used. This ensures that only verified developers can access organization
    repositories, as their SSH key will be the only one signed by the CA certificate. This reduces the risk of misuse and
    malicious code commits.'
  impact: Members with unverified keys will not be able to clone organization repositories. Signing, certification, and verification
    might also slow down the development process.
  references: []
  page_start: 96
  audit_raw: 'Only if you have an enterprise account, verify that the enterprise organization has an

    SSH Certificate Authority server and provides an SSH certificate with which to sign keys

    by performing the following:

    1. In the top right corner of GitHub.com, click your profile photo, then click Your

    organizations.

    2. Next to the organization, click Settings.

    3. In the "Security" section of the sidebar, click Authentication security.

    4. Verify that there''s an SSH certificate authority listed there.'
  remediation: 'Only if you have an enterprise account, deploy an SSH Certificate Authority server and

    configure it to provide an SSH certificate with which to sign keys by performing the

    following:

    1. In the top right corner of GitHub.com, click your profile photo, then click Your

    organizations.

    2. Next to the organization, click Settings.

    3. In the "Security" section of the sidebar, click Authentication security.

    4. To the right of "SSH Certificate Authorities", click New CA.

    5. Under "Key," paste your public SSH key.

    6. Click Add CA.

    7. Click Save.'
  checks:
  - type: manual_review
    info: 'Only if you have an enterprise account, verify that the enterprise organization has an

      SSH Certificate Authority server and provides an SSH certificate with which to sign keys

      by performing the following:

      1. In the top right corner of GitHub.com, click your profile photo, then click Your

      organizations.

      2. Next to the organization, click Settings.

      3. In the "Security" section of the sidebar, click Authentication security.

      4. Verify that there''s an SSH certificate authority listed there.'
    severity: medium
