- id: 1.3.8
  title: Ensure strict base permissions are set for repositories
  scoring: manual
  profile:
  - Level 1
  description: Base permissions define the permission level automatically granted to all organization members. Define strict
    base access permissions for all of the repositories in the organization, including new ones.
  rationale: Defining strict base permissions is the best practice in every role-based access control (RBAC) system. If the
    base permission is high — for example, "write" permission — every member of the organization will have "write" permission
    to every repository in the organization. This will apply regardless of the specific permissions a user might need, which
    generally differ between organization repositories. The higher the permission, the higher the risk for incidents such
    as bad code commit or data breach. It is therefore recommended to set the base permissions to the strictest level possible.
  impact: Users might not be able to access organization repositories or perform some acts as commits. These specific permissions
    should be granted individually for each user or team, as needed.
  references: []
  page_start: 90
  audit_raw: 'Verify that strict base permissions are set for the organization repositories by doing the

    following:

    1. In the top right corner of GitHub.com, click your profile photo, then click Your

    organizations.

    2. Next to the organization, click Settings.

    3. In the "Access" section of the sidebar, click Member privileges.

    4. Under "Base permissions", verify that it is set to "Read" or "None". If it does, you

    are compliant.'
  remediation: 'Set strict base permissions for the organization repositories with the next steps:

