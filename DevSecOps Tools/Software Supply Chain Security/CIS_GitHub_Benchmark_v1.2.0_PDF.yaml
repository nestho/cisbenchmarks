- id: 1.2.5
  title: Ensure all copies (forks) of code are tracked and accounted for
  scoring: manual
  profile:
  - Level 1
  description: Track every fork of code and ensure it is accounted for.
  rationale: A fork is a copy of a repository. On top of being a plain copy, any updates to the original repository itself
    can be pulled and reflected by the fork under certain conditions. A large number of repository copies (forks) become difficult
    to manage and properly secure. New and sensitive changes can often be pushed into a critical repository without developer
    knowledge of an updated copy of the very same repository. If there is no limit on doing this, then it is recommended to
    track and delete copies of organization repositories as needed.
  impact: Disabling forks completely may slow down the development process as more actions will be necessary to take in order
    to fork a repository.
  references: []
  page_start: 69
  audit_raw: 'Verify that the following steps are done regularly to track and examine forks:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Insights.

    3. In the left sidebar, click Forks.

    4. Examine the forks listed there.'
  remediation: 'Track forks and examine them by performing the following on a regular basis:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Insights.

    3. In the left sidebar, click Forks.

    4. Examine the forks listed there.'
  checks:
