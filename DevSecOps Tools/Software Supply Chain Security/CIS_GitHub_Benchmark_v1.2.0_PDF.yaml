  scoring: manual
  profile:
  - Level 2
  description: Detect and prevent known open source vulnerabilities in the code.
  rationale: Open source code blocks are used a lot in developed software. This has its own advantages, but it also has risks.
    Because the code is open for everyone, it means that attackers can publish or add malicious code to these open-source
    code blocks, or use their knowledge to find vulnerabilities in an existing code. Detecting and fixing such code vulnerabilities,
    by SCA (Software Composition Analysis) prevents insecure flaws from reaching production. It gives another opportunity
    for developers to secure the source code before it is deployed in production, where it is far more exposed and vulnerable
    to attacks.
