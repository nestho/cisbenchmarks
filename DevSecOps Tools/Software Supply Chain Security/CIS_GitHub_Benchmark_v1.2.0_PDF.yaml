benchmark:
  id: cis-github-benchmark
  title: CIS GitHub Benchmark
  version: 1.2.0
  technology: Software Supply Chain Security
  category: DevSecOps Tools
  os: Software Supply Chain Security
  source_pdf: CIS_GitHub_Benchmark_v1.2.0_PDF.pdf
  total_pages: 271
  controls_count: 120
controls:
- id: 1.1.1
  title: Ensure any changes to code are tracked in a version control platform
  scoring: manual
  profile:
  - Level 1
  description: Manage all code projects in a version control platform.
  rationale: Version control platforms keep track of every modification to code. They represent the cornerstone of code security,
    as well as allowing for better code collaboration within engineering teams. With granular access management, change tracking,
    and key signing of code edits, version control platforms are the first step in securing the software supply chain.
  impact: ''
  references: []
  page_start: 20
  audit_raw: Ensure that all code activity is managed through Github repository for every microservice or application developed
    by an organization.
  remediation: 'Upload existing code projects to a dedicated Github organization and repositories and

    create an identity for each active team member who might contribute or need access to

    it.'
  checks:
  - type: manual_review
    info: Ensure that all code activity is managed through Github repository for every microservice or application developed
      by an organization.
    severity: medium
- id: 1.1.2
  title: Ensure any change to code can be traced back to its associated task
  scoring: manual
  profile:
  - Level 1
  description: Use a task management system to trace any code back to its associated task.
  rationale: The ability to trace each piece of code back to its associated task simplifies the Agile and DevOps process by
    enabling transparency of any code changes. This allows faster remediation of bugs and security issues, while also making
    it harder to push unauthorized code changes to sensitive projects. Additionally, using a task management system simplifies
    achieving compliance, as it is easier to track each regulation.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Ensure every code change can be traced back to its origin task in a task management

    system.'
  remediation: 'Use a task management system to manage tasks as the starting point for each code

    change. Whether it is a new feature, bug fix, or security fix - all should originate from a

    dedicated task (ticket) in your organization''s task management system. These tasks

    should also be linked to the code changes themselves in a way that is easy to follow:

    from code to task, and from task back to code.'
  checks:
  - type: manual_review
    info: 'Ensure every code change can be traced back to its origin task in a task management

      system.'
    severity: medium
- id: 1.1.3
  title: Ensure any change to code receives approval of two strongly authenticated users
  scoring: scored
  profile:
  - Level 1
  description: Ensure that every code change is reviewed and approved by two authorized contributors who are both strongly
    authenticated - using Multi-Factor Authentication (MFA), from the team relevant to the code change.
  rationale: To prevent malicious or unauthorized code changes, the first layer of protection is the process of code review.
    This process involves engineer teammates reviewing each other's code for errors, optimizations, and general knowledge-sharing.
    With proper peer reviews in place, an organization can detect unwanted code changes very early in the process of release.
    In order to help facilitate code review, companies should employ automation to verify that every code change has been
    reviewed and approved by at least two team members before it is pushed into the code base. These team members should be
    from the team that is related to the code change, so it will be a meaningful review.
  impact: To enforce a code review requirement, verification for a minimum of two reviewers must be put into place. This will
    ensure new code will not be able to be pushed to the code base before it has received two independent approvals.
  references: []
  page_start: 23
  audit_raw: 'For every code repository in use, perform the next steps to verify that two approvals

    from the specific code repository team are required to push new code to the code base:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require a pull request before merging and Require approvals

    are checked, and verify that Required number of approvals before merging is

    set to 2.'
  remediation: 'For every code repository in use, perform the next steps to require two approvals from

    the specific code repository team in order to push new code to the code base:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you added the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Check Require a pull request before merging and Require approvals, and set

    Required number of approvals before merging to 2.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For every code repository in use, perform the next steps to verify that two approvals

      from the specific code repository team are required to push new code to the code base:

      1. On GitHub, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn'
    severity: medium
- id: 1.1.4
  title: Ensure previous approvals are dismissed when updates are introduced to a code change proposal
  scoring: manual
  profile:
  - Level 1
  description: Ensure that when a proposed code change is updated, previous approvals are declined, and new approvals are
    required.
  rationale: An approval process is necessary when code changes are suggested. Through this approval process, however, changes
    can still be made to the original proposal even after some approvals have already been given. This means malicious code
    can find its way into the code base even if the organization has enforced a review policy. To ensure this is not possible,
    outdated approvals must be declined when changes to the suggestion are introduced.
  impact: If new code changes are pushed to a specific proposal, all previously accepted code change proposals must be declined.
  references: []
  page_start: 25
  audit_raw: 'For each code repository in use, perform the next steps to verify that each updated

    code suggestion declines the previously received approvals:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require a pull request before merging is checked, and verify that

    Dismiss stale pull request approvals when new commits are pushed is

    checked.'
  remediation: 'For each code repository in use, perform the next steps to enforce dismissal of given

    approvals to code change suggestions if those suggestions were updated:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you added the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require pull request reviews before merging and then Dismiss stale

    pull request approvals when new commits are pushed.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For each code repository in use, perform the next steps to verify that each updated

      code suggestion declines the previously received approvals:

      1. On GitHub, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

      5.'
    severity: medium
- id: 1.1.5
  title: Ensure there are restrictions on who can dismiss code change reviews
  scoring: manual
  profile:
  - Level 1
  description: Only trusted users should be allowed to dismiss code change reviews.
  rationale: Dismissing a code change review permits users to merge new suggested code changes without going through the standard
    process of approvals. Controlling who can perform this action will prevent malicious actors from simply dismissing the
    required reviews to code changes and merging malicious or dysfunctional code into the code base.
  impact: In cases where a code change proposal has been updated since it was last reviewed and the person who reviewed it
    isn't available for approval, a general collaborator would not be able to merge their code changes until a user with "dismiss
    review" abilities could dismiss the open review. Users who are not allowed to dismiss code change reviews will not be
    permitted to do so, and thus are unable to waive the standard flow of approvals.
  references: []
  page_start: 27
  audit_raw: 'For each code repository in use, perform the next steps to verify that only trusted users

    are allowed to dismiss code change reviews:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Verify that Require a pull request before merging and Restrict who can

    dismiss pull request reviews is checked.

    6. Verify that no users and teams are specified except for organization and

    repository admins. If it is obligatory, verify that the users or teams specified were

    carefully selected to be trusted with the ability to dismiss code change reviews.'
  remediation: 'For each code repository in use, perform the next steps to restrict dismissal of code

    changes reviews unless it is necessary:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you added the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require pull request reviews before merging and Restrict who can

    dismiss pull request reviews.

    7. Do not add any user or team unless it is obligatory. If it is obligatory, carefully

    select the users or teams whom you trust with the ability to dismiss code change

    reviews.

    8. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For each code repository in use, perform the next steps to verify that only trusted users

      are allowed to dismiss code change reviews:

      1. On GitHub, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

      5. Verify th'
    severity: medium
- id: 1.1.6
  title: Ensure code owners are set for extra sensitive code or configuration
  scoring: manual
  profile:
  - Level 1
  description: Code owners are trusted users that are responsible for reviewing and managing an important piece of code or
    configuration. An organization is advised to set code owners for every extremely sensitive code or configuration.
  rationale: Configuring code owners protects data by verifying that trusted users will notice and review every edit, thus
    preventing unwanted or malicious changes from potentially compromising sensitive code or configurations.
  impact: Code owner users will receive notifications for every change that occurs to the code and subsequently added as reviewers
    of pull requests automatically.
  references:
  - 1. https://docs.github.com/en/repositories/managing-your-repositorys-settings-andfeatures/customizing-your-repository/about-code-owners
  page_start: 29
  audit_raw: 'In every code repository, verify that a file named CODEOWNERS exists in the root,

    docs/, or .github/ directory of the repository. In the CODEOWNERS file, verify that the

    users specified are users you trust.'
  remediation: 'In every code repository create a CODEOWNERS file in the root, docs/, or .github/

    directory of the repository. In the file, specify codeowners for the .github/workflows/

    directory atleast. Specify organization members you trust. For example:

    .github/workflows/ @user1 @user2'
  checks:
  - type: manual_review
    info: 'In every code repository, verify that a file named CODEOWNERS exists in the root,

      docs/, or .github/ directory of the repository. In the CODEOWNERS file, verify that the

      users specified are users you trust.'
    severity: medium
- id: 1.1.7
  title: Ensure code owner's review is required when a change affects owned code
  scoring: manual
  profile:
  - Level 1
  description: Ensure trusted code owners are required to review and approve any code change proposal made to their respective
    owned areas in the code base.
  rationale: Configuring code owners ensures that no code, especially code which could prove malicious, will slip into the
    source code or configuration files of a repository. This allows an organization to mark areas in the code base that are
    especially sensitive or more prone to an attack. It can also enforce review by specific individuals who are designated
    as owners to those areas so that they may filter out unauthorized or unwanted changes beforehand.
  impact: If an organization enforces code owner-based reviews, some code change proposals would not be able to be merged
    to the codebase before specific, trusted individuals approve them.
  references: []
  page_start: 31
  audit_raw: 'For every code repository in use, perform the following steps to verify that code owners

    are required to review all code change proposals relevant to areas they own before

    code merge:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require a pull request before merging and Require review from

    Code Owners are checked.'
  remediation: 'For every code repository in use, perform the following steps to require code owners''

    approvals for each change proposal related to code they own:

    1. On GitHub, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you add the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require pull request reviews before merging and Require review

    from Code Owners.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For every code repository in use, perform the following steps to verify that code owners

      are required to review all code change proposals relevant to areas they own before

      code merge:

      1. On GitHub, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. I'
    severity: medium
- id: 1.1.8
  title: Ensure inactive branches are periodically reviewed and removed
  scoring: manual
  profile:
  - Level 1
  description: Keep track of code branches that are inactive for a lengthy period of time and periodically remove them.
  rationale: Git branches that have been inactive (i.e., no new changes introduced) for a long period of time are enlarging
    the surface of attack for malicious code injection, sensitive data leaks, and CI pipeline exploitation. They potentially
    contain outdated dependencies which may leave them highly vulnerable. They are more likely to be improperly managed, and
    could possibly be accessed by a large number of members of the organization.
  impact: Removing inactive Git branches means that any code changes they contain would be removed along with them, thus work
    done in the past might not be accessible after auditing for inactivity.
  references: []
  page_start: 33
  audit_raw: 'For each code repository in use, verify that all existing Git branches are active or have

    yet to be checked for inactivity by performing the next steps:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Above the list of files, click Branches.

    3. Use the navigation at the top of the page to view the Stale branches. The Stale

    view shows all branches that no one has committed to in the last three months,

    ordered by the branches with the oldest commits first.

    4. If the list is empty, you are compliant. If the list is not empty, but there is a valid

    reason the branches listed are not deleted, you are compliant.'
  remediation: 'For each code repository in use, review existing Git branches and remove those which

    have not been active for a period of time by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Above the list of files, click Branches.

    3. Use the navigation at the top of the page to view the Stale branches. The Stale

    view shows all branches that no one has committed to in the last three months,

    ordered by the branches with the oldest commits first.

    4. For each branch listed, either delete it by clicking the trash bin icon, or find the

    valid reason it still exists.

    You can perform the next steps to prevent pull request branches from becoming stale

    branches:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. Under "Pull Requests", select Automatically delete head branches.'
  checks:
  - type: manual_review
    info: 'For each code repository in use, verify that all existing Git branches are active or have

      yet to be checked for inactivity by performing the next steps:

      1. On GitHub.com, navigate to the main page of the repository.

      2. Above the list of files, click Branches.

      3. Use the navigation at the top of the page to view the Stale branches. The Stale

      view shows all branches that no one has committed to in the last three months,

      ordered by the branches with the oldest commits first.

      4. If the list is empty'
    severity: medium
- id: 1.1.9
  title: Ensure all checks have passed before merging new code
  scoring: manual
  profile:
  - Level 1
  description: Before a code change request can be merged to the code base, all predefined checks must successfully pass.
  rationale: On top of manual reviews of code changes, a code protect should contain a set of prescriptive checks which validate
    each change. Organizations should enforce those status checks so that changes can only be introduced if all checks have
    successfully passed. This set of checks should serve as the absolute quality, stability, and security conditions which
    must be met in order to merge new code to a project.
  impact: Code changes in which all checks do not pass successfully would not be able to be pushed into the code base of the
    specific code repository.
  references: []
  page_start: 35
  audit_raw: 'For each code repository in use, verify that status checks are required to pass before

    allowing any code change proposal merge by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require status checks to pass before merging is checked.'
  remediation: 'For each code repository in use, require all status checks to pass before permitting a

    merge of new code by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", check if there is a rule for your main branch. If

    there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you add the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require status checks to pass before merging.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For each code repository in use, verify that status checks are required to pass before

      allowing any code change proposal merge by performing the following:

      1. On GitHub.com, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn''t, you are n'
    severity: medium
- id: 1.1.10
  title: Ensure open Git branches are up to date before they can be merged into code base
  scoring: manual
  profile:
  - Level 1
  description: Organizations should make sure each suggested code change is in full sync with the existing state of its origin
    code repository before allowing merging.
  rationale: Git branches can easily become outdated since the origin code repository is constantly being edited. This means
    engineers working on separate code branches can accidentally include outdated code with potential security issues which
    might have already been fixed, overriding the potential solutions for those security issues when merging their own changes.
  impact: If enforced, outdated branches would not be able to be merged into their origin repository without first being updated
    to contain any recent changes.
  references:
  - 1. https://github.blog/changelog/2022-02-03-more-ways-to-keep-your-pull-requestbranch-up-to-date/
  page_start: 37
  audit_raw: 'For each code repository in use, verify that open branches must be updated before

    merging is permitted by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require status checks to pass before merging and Require

    branches to be up to date before merging are checked.'
  remediation: 'For each code repository in use, enforce a policy to only allow merging open branches if

    they are current with the latest change from their original repository by performing the

    following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you add the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require status checks to pass before merging and Require branches

    to be up to date before merging.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For each code repository in use, verify that open branches must be updated before

      merging is permitted by performing the following:

      1. On GitHub.com, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

      5. Ensure '
    severity: medium
- id: 1.1.11
  title: Ensure all open comments are resolved before allowing code change merging
  scoring: manual
  profile:
  - Level 2
  description: Organizations should enforce a "no open comments" policy before allowing code change merging.
  rationale: In an open code change proposal, reviewers can leave comments containing their questions and suggestions. These
    comments can also include potential bugs and security issues. Requiring all comments on a code change proposal to be resolved
    before it can be merged ensures that every concern is properly addressed or acknowledged before the new code changes are
    introduced to the code base.
  impact: Code change proposals containing open comments would not be able to be merged into the code base.
  references: []
  page_start: 39
  audit_raw: 'For every code repository in use, verify that each merged code change does not contain

    open, unattended comments by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require conversation resolution before merging is checked.'
  remediation: 'For each code repository in use, require open comments to be resolved before the

    relevant code change can be merged by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you add the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require conversation resolution before merging.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'For every code repository in use, verify that each merged code change does not contain

      open, unattended comments by performing the following:

      1. On GitHub.com, navigate to the main page of the repository.

      2. Under your repository name, click Settings.

      3. In the "Code and automation" section of the sidebar, click Branches.

      4. Next to "Branch protection rules", verify that there is at least one rule for your

      main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

      '
    severity: medium
- id: 1.1.12
  title: Ensure verification of signed commits for new changes before merging
  scoring: manual
  profile:
  - Level 2
  description: Ensure every commit in a pull request is signed and verified before merging.
  rationale: Signing commits, or requiring to sign commits, gives other users confidence about the origin of a specific code
    change. It ensures that the author of the change is not hidden and is verified by the version control system, thus the
    change comes from a trusted source.
  impact: Pull requests with unsigned commits cannot be merged.
  references:
  - 1. https://docs.github.com/en/authentication/managing-commit-signatureverification/signing-commits
  page_start: 41
  audit_raw: 'Ensure only signed commits can be merged for every branch, especially the main

    branch, via branch protection rules by performing the following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, you are not compliant.

    5. Ensure that Require signed commits is checked.'
  remediation: 'For each repository in use, enforce the branch protection rule of requiring signed

    commits, and make sure only signed commits are capable of merging by performing the

    following:

    1. On GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings.

    3. In the "Code and automation" section of the sidebar, click Branches.

    4. Next to "Branch protection rules", verify that there is at least one rule for your

    main branch. If there is, click Edit to its right. If there isn''t, click Add rule.

    5. If you add the rule, under "Branch name pattern", type the branch name or

    pattern you want to protect.

    6. Select Require signed commits.

    7. Click Create or Save changes.'
  checks:
  - type: manual_review
    info: 'Ensure only signed commits can be merged for every branch, especially the main

      branch, via branch protection rules by performing the following:

      1. On GitHub.com, navigate to the main page of the repository.

