- id: 4.2.4
  title: Ensure user management of the package registry is not local
  scoring: manual
  profile:
  - Level 1
  description: Manage users and their access to the package registry with an external authentication server and not with the
    package registry itself.
  rationale: Some package registries offer a tool for user management, aside from the main Lightweight Directory Access Protocol
    (LDAP) or Active Directory (AD) server of the organization. That tool usually offers simple authentication and role-based
