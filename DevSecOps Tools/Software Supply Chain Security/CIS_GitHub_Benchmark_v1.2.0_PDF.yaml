- id: 4.1.1
  title: Ensure all artifacts are signed by the build pipeline itself
  scoring: manual
  profile:
  - Level 2
  description: Configure the build pipeline to sign every artifact it produces and verify that each artifact has the appropriate
    signature.
  rationale: A cryptographic signature can be used to verify artifact authenticity. The signature created with a certain key
    is unique and not reversible, thus making it unique to the author. This means that an attacker tampering with a signed
    artifact will be noticed immediately using a simple verification step because the signature will change. Signing artifacts
    by the build pipeline that produces them ensures the integrity of those artifacts.
  impact: ''
  references:
  - 1. https://docs.github.com/en/code-security/supply-chain-security/end-to-endsupply-chain/securing-builds
  - 2. https://gist.github.com/sualeh/ae78dc16123899d7942bc38baba5203c
  page_start: 193
  audit_raw: 'Verify that the build pipeline signs every new artifact it produces and all artifacts are

    signed.

    There are many different signing tools or options each have there own method or

    commands to verify that the code or package created is signed.'
  remediation: "Sign every artifact produced with the build pipeline that created it. Configure the build\npipeline to sign\
    \ each artifact.\nSteps from GitHub Documentation:\nYou can follow the steps below to sign artifacts in GitHub actions.\
    \ The trick involves\nloading in your private key into GitHub Actions using the gpg command-line commands.\nExport your\
    \ gpg private key from the system that you have created it. Find your key-id\n(using gpg --list-secret-keys --keyid-format=long)\
    \ Export the gpg secret key to an ASCII\nfile using gpg --export-secret-keys -a > secret.txt Edit secret.txt using a plain\
    \ text editor,\nand replace all newlines with a literal \"\\n\" until everything is on a single line Set up\nGitHub Actions\
    \ secrets Create a secret called OSSRH_GPG_SECRET_KEY using the\ntext from your edited secret.txt file (the whole text\
    \ should be in a single line) Create a\nsecret called OSSRH_GPG_SECRET_KEY_PASSWORD containing the password for\nyour\
    \ gpg secret key Create a GitHub Actions step to install the gpg secret key Add an\naction similar to:\n- id: install-secret-key\n\
    \ name: Install gpg secret key\n run: |\n cat <(echo -e \"${{ secrets.OSSRH_GPG_SECRET_KEY }}\") | gpg --batch --\nimport\n\
    \ gpg --list-secret-keys --keyid-format LONG\nVerify that the secret key is shown in the GitHub Actions logs You can remove\
    \ the\noutput from list secret keys if you are confident that this action will work, but it is better\nto leave it in\
    \ there Bring it all together, and create a GitHub Actions step to publish Add\nan action similar to:\n- id: publish-to-central\n\
    \ name: Publish to Central Repository\n env:\n MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}\n MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN\
    \ }}\n run: |\n mvn \\\n --no-transfer-progress \\\n --batch-mode \\\n -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD\
    \ }} \\\n clean deploy\nAfter a couple of hours, verify that the artifact got published to The Central Repository"
  checks:
  - type: manual_review
    info: 'Verify that the build pipeline signs every new artifact it produces and all artifacts are

      signed.

      There are many different signing tools or options each have there own method or

      commands to verify that the code or package created is signed.'
    severity: medium
