    developer and a user in order to allow the use of software. Software licenses have the potential to create code dependencies.
    Not following the conditions in the software license can also lead to lawsuits. When using packages with a software license,
    especially commercial ones (which are the most permissive), it is important to verify what is allowed by that license
    in order to be protected against lawsuits.
