  title: Ensure new members are required to be invited using company-approved email
  scoring: manual
  profile:
  - Level 2
  description: Existing members of an organization can invite new members to join, however new members must only be invited
    with their company-approved email.
  rationale: Ensuring new members of an organization have company-approved email prevents existing members of the organization
    from inviting arbitrary new users to join. Without this verification, they can invite anyone who is using the organization's
    version control system or has an active email account, thus allowing outside users (and potential threat actors) to easily
    gain access to company private code and resources. This practice will subsequently reduce the chance of human error or
    typos when inviting a new member.
  impact: Existing members would not be able to invite new users who do not have a companyapproved email address.
  references: []
  page_start: 86
