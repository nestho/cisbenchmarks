- id: 1.3.4
  title: Ensure Multi-Factor Authentication (MFA) is required for contributors of new code
  scoring: manual
  profile:
  - Level 2
  description: Require collaborators from outside the organization to use Multi-Factor Authentication (MFA) in addition to
    a standard user name and password when authenticating to the source code management platform.
  rationale: By default every user authenticates within the system by password only. If the password of a user is compromised,
    however, the user account and every repository to which they have access are in danger of data loss, malicious code commits,
    and data theft. It is therefore recommended that each user has Multi-Factor Authentication enabled. This adds an additional
    layer of protection to ensure the account remains secure even if the user's password is compromised.
  impact: A member without enabled Multi-Factor Authentication cannot contribute to the project. They must enable Multi-Factor
    Authentication a before they can contribute any code.
  references: []
  page_start: 82
