- id: 3.1.2
  title: Ensure Software Bill of Materials (SBOM) is required from all third-party suppliers
  scoring: manual
  profile:
  - Level 1
  description: A Software Bill Of Materials (SBOM) is a file that specifies each component of software or a build process.
    Require an SBOM from every third-party provider.
  rationale: A Software Bill of Materials (SBOM) for every third-party artifact helps to ensure an artifact is safe to use
    and fully compliant. This file lists all important metadata, especially all the dependencies of an artifact, and allows
    for verification of each dependency. If one of the dependencies/artifacts are attacked or has a new vulnerability (for
    example, the "SolarWinds" or even "log4j" attacks), it is easier to detect what has been affected by this incident because
    dependencies in use are listed in the SBOM file.
  impact: ''
  references: []
  page_start: 172
