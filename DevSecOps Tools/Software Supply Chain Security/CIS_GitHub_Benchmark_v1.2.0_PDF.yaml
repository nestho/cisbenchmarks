- id: 2.1.1
  title: Ensure each pipeline has a single responsibility
  scoring: manual
  profile:
  - Level 2
  description: Ensure each pipeline has a single responsibility in the build process.
  rationale: Build pipelines generally have access to multiple secrets depending on their purposes. There are, for example,
    secrets of the test environment for the test phase, repository and artifact credentials for the build phase, etc. Limiting
    access to these credentials/secrets is therefore recommended by dividing pipeline responsibilities, as well as having
    a dedicated pipeline for each phase with the lowest privilege instead of a single pipeline for all. This will ensure that
    any potential damage caused by attacks on a workflow will be limited.
  impact: ''
  references:
  - 1. https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
  page_start: 124
  audit_raw: For each pipeline, ensure it has only one responsibility in the build process.
  remediation: 'Divide each multi-responsibility pipeline into multiple pipelines, each having a single

    responsibility with the least privilege. Additionally, create all new pipelines with a sole

    purpose going forward.'
  checks:
  - type: manual_review
    info: For each pipeline, ensure it has only one responsibility in the build process.
    severity: medium
- id: 2.1.2
  title: Ensure all aspects of the pipeline infrastructure and configuration are immutable
  scoring: manual
  profile:
  - Level 1
  description: Ensure the pipeline orchestrator and its configuration are immutable.
  rationale: An immutable infrastructure is one that cannot be changed during execution of the pipeline. This can be done,
    for example, by using Infrastructure as Code for configuring the pipeline and the pipeline environment. Utilizing such
    infrastructure creates a more predictable environment because updates will require re-deployment to prevent any previous
    configuration from interfering. Because it is dependent on automation, it is easier to revert changes. Testing code is
    also simpler because it is based on virtualization. Most importantly, an immutable pipeline infrastructure ensures that
    a potential attacker seeking to compromise the build environment itself would not be able to do so if the orchestrator,
    its configuration, and any other component cannot be changed. Verifying that all aspects of the pipeline infrastructure
    and configuration are immutable therefore keeps them safe from malicious tampering attempts.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'Verify that the pipeline orchestrator, its configuration, and all other aspects of the build

    environment are immutable.'
  remediation: 'Use an immutable pipeline orchestrator and ensure that its configuration and all other

    aspects of the built environment are immutable, as well.'
  checks:
  - type: manual_review
    info: 'Verify that the pipeline orchestrator, its configuration, and all other aspects of the build

      environment are immutable.'
    severity: medium
