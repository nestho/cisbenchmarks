- id: 1.3.9
  title: Ensure an organization’s identity is confirmed with a “Verified” badge
  scoring: manual
  profile:
  - Level 2
  description: Confirm the domains an organization owns with a "Verified" badge.
  rationale: Verifying the organization's domain gives developers assurance that a given domain is truly the official home
    for a public organization. Attackers can pretend to be an organization and steal information via a faked/spoof domain,
    therefore the use of a "Verified" badge instills more confidence and trust between developers and the opensource community.
  impact: ''
  references:
  - 1. https://docs.github.com/en/organizations/managing-organizationsettings/verifying-or-approving-a-domain-for-your-organization
  page_start: 92
  audit_raw: 'Only if you have an enterprise account, view the enterprise organization profile page

    and ensure it has a "Verified" badge in it.'
  remediation: 'Only if you have an enterprise account, verify the organization''s domains and secure a

    "Verified" badge next to its name by performing the following:

    1. In the top-right corner of GitHub.com, click your profile photo, then click Your

    enterprises.

    2. In the list of enterprises, click the enterprise you want to view. Then in the

    enterprise account sidebar, click Settings.

    3. Under "Settings", click Verified & approved domains.

    4. Click Add a domain.

    5. In the domain field, type the domain you''d like to verify, then click Add domain.

    6. Follow the instructions under Add a DNS TXT record to create a DNS TXT

    record with your domain hosting service. Wait for your DNS configuration to

    change, which may take up to 72 hours. You can confirm your DNS configuration

    has changed by running the dig command on the command line, replacing

    ENTERPRISE-ACCOUNT with the name of your enterprise account, and

    example.com with the domain you''d like to verify. You should see your new TXT

    record listed in the command output.

    dig _github-challenge-ENTERPRISE-ACCOUNT.DOMAIN-NAME +nostats +nocomments

    +nocmd TXT

    7. After confirming your TXT record is added to your DNS, follow steps one through

    three above to navigate to your enterprise account''s approved and verified

    domains.

    8. To the right of the domain that''s pending verification, click the 3-dots, then click

    Continue verifying. Click Verify.

    9. Optionally, after the "Verified" badge is visible on your organizations'' profiles,

    delete the TXT entry from the DNS record at your domain hosting service.'
  checks:
  - type: manual_review
    info: 'Only if you have an enterprise account, view the enterprise organization profile page

      and ensure it has a "Verified" badge in it.'
    severity: medium
