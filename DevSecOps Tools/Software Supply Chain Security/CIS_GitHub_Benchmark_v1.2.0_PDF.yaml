    3. In the "Security" section of the sidebar, click Authentication security.

    4. Under "Authentication", check if Require two-factor authentication for

    everyone in your organization is checked. If so, you are compliant.'
  remediation: 'For each repository in use, enforce Multi-Factor Authentication is the only way to

