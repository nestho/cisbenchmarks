    In any case, only members with administrator or organization owner privileges can

    delete issues, regardless of your setting.'
  remediation: 'Restrict issue deletion to a few trusted and responsible users only by performing either

    of the following steps:

    If Your organizations > Settings > Access > Member privileges > Allow members to

    delete issues for this organization is selected, allow only trusted members to have

    admin privileges:

    1. In every repository, on GitHub.com, navigate to the main page of the repository.

    2. Under your repository name, click Settings and then in the "Access" section of

    the sidebar, click Collaborators & teams.

    3. Under "Manage access" use the dropdown Role menu to filter and search for

    admin members. Change their role by clicking the Role dropdown next to the

    username until there are only two trusted and qualified users with admin

    privileges.

    If it is not selected, allow only trusted users to become an organization owner:

    1. In the top right corner of GitHub.com, click your profile photo, then click Your

    organizations.

    2. Click the name of your organization and under your organization name, click

    People.

    3. You will see a list of the people in your organization. Click Role and select

    Owners. Check every member you want to change permissions to. Above the list

    of members, use the drop-down menu and click Change role and choose

    Member > change role. Do that until there are only a few trusted and qualified

    users with organization owner privileges.

    In any case, only members with administrator or organization owner privileges can

    delete issues, regardless of your setting.'
