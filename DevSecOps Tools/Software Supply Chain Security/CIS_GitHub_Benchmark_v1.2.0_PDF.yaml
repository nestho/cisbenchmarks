      repository.

      2. Under your repository name, click Settings

      3. Under "Danger Zone", to the right of to "Change repository visibility", click

      Change visibility.

      Review the current selection.'
    severity: medium
- id: 4.2.6
  title: Ensure minimum number of administrators are set for the package registry
  scoring: manual
  profile:
  - Level 1
  description: Ensure the package registry has a minimum number of administrators.
  rationale: Package registry admins have the ability to add/remove users, repositories, packages. Due to the permissive access
    granted to an admin, it is highly recommended to keep the number of administrator accounts as minimal as possible.
  impact: Administrator privileges are required to provide and maintain a secure and stable platform but allowing extraneous
    administrator accounts can create a vulnerability.
  references:
  - 1. https://docs.github.com/en/repositories/managing-your-repositorys-settings-andfeatures/managing-repository-settings/managing-teams-and-people-with-accessto-your-repository
  page_start: 206
  audit_raw: 'Verify that your package registry has only the minimum number of administrators.

    For each repository that you administer on GitHub, you can see an overview of every

    team or person with access to the repository. From the overview, you can also invite

    new teams or people, change each team or person''s role for the repository, or remove

    access to the repository.'
  remediation: 'Set the minimum number of administrators in your package registry.

    To accomplish this:

    For each repository that you administer on GitHub, you can see an overview of every

    team or person with access to the repository. From the overview, choose Manage

    access and provide access to the appropriate people or teams.'
  checks:
  - type: manual_review
    info: 'Verify that your package registry has only the minimum number of administrators.

      For each repository that you administer on GitHub, you can see an overview of every

      team or person with access to the repository. From the overview, you can also invite

      new teams or people, change each team or person''s role for the repository, or remove

      access to the repository.'
    severity: medium
- id: 4.3.1
  title: Ensure all signed artifacts are validated upon uploading the package registry
  scoring: manual
  profile:
  - Level 1
  description: Validate artifact signatures before uploading to the package registry.
  rationale: Cryptographic signature is a tool to verify artifact authenticity. Every artifact is supposed to be signed by
    its creator in order to confirm that it was not compromised before reaching the client. Validating an artifact signature
    before delivering it is another level of protection which ensures the signature has not been changed, meaning no one tried
    or succeeded in tampering with the artifact. This creates trust between the supplier and the client.
  impact: ''
  references:
  - 1. https://docs.github.com/en/authentication/managing-commit-signatureverification/about-commit-signature-verification
  - 2. https://docs.github.com/en/authentication/managing-commit-signatureverification/signing-commits
  page_start: 209
  audit_raw: 'Ensure every artifact in the package registry has been validated with its signature.

    1. On GitHub, navigate to a pull request

    2. On the pull request, click <> Commits and view the detailed information

    regarding the signature.'
  remediation: 'Validate every artifact with its signature before uploading it to the package registry. It is

    recommended to do so automatically.'
  checks:
  - type: manual_review
    info: 'Ensure every artifact in the package registry has been validated with its signature.

      1. On GitHub, navigate to a pull request

      2. On the pull request, click <> Commits and view the detailed information

      regarding the signature.'
    severity: medium
- id: 4.3.2
  title: Ensure all versions of an existing artifact have their signatures validated
  scoring: manual
  profile:
  - Level 1
  description: Validate the signature of all versions of an existing artifact.
  rationale: In order to be certain a version of an existing and trusted artifact is not malicious or delivered by someone
    looking to interfere with the supply chain, it is a good practice to validate the signatures of each version. Doing so
    decreases the risk of using a compromised artifact, which might lead to a breach.
  impact: ''
  references: []
  page_start: 211
  audit_raw: 'For each artifact, ensure that all of its versions are signed and validated before it is

    uploaded or used.

    Ensure every artifact in the package registry has been validated with its signature.

    On GitHub, navigate to a pull request On the pull request, click <> Commits and view

    the detailed information regarding the signature.'
  remediation: For each artifact, sign and validate each version before uploading or using the artifact.
  checks:
  - type: manual_review
    info: 'For each artifact, ensure that all of its versions are signed and validated before it is

      uploaded or used.

      Ensure every artifact in the package registry has been validated with its signature.

      On GitHub, navigate to a pull request On the pull request, click <> Commits and view

      the detailed information regarding the signature.'
    severity: medium
- id: 4.3.3
  title: Ensure changes in package registry configuration are audited
  scoring: manual
  profile:
  - Level 1
  description: Audit changes of the package registry configuration.
  rationale: The package registry is a crucial component in the software supply chain. It stores artifacts with potentially
    sensitive data that will eventually be deployed and used in production. Every change made to the package registry configuration
    must be examined carefully to ensure no exposure of the registry's sensitive data. This examination also ensures no malicious
    actors have performed modifications to a stored artifact. Auditing the configuration and its changes helps in decreasing
    such risks.
  impact: ''
  references:
  - 1. https://docs.github.com/en/organizations/keeping-your-organizationsecure/managing-security-settings-for-your-organization/reviewing-the-audit-logfor-your-organization
  page_start: 213
  audit_raw: 'Verify that all changes to the packages registry configuration are audited.

    Search the audit log with

    repo category actions'
  remediation: Audit the changes to the package registry configuration.
  checks:
  - type: manual_review
    info: 'Verify that all changes to the packages registry configuration are audited.

      Search the audit log with

      repo category actions'
    severity: medium
- id: 4.3.4
  title: Ensure webhooks of the repository are secured
  scoring: manual
  profile:
  - Level 1
  description: Use secured webhooks to reduce the possibility of malicious payloads.
  rationale: Webhooks are used for triggering an HTTP request based on an action made in the platform. Typically, package
    registries feature webhooks when a package receives an update. Since webhooks are an HTTP POST request, they can be malformed
    if not secured over SSL. To prevent a potential hack and compromise of the webhook or to the registry or web server excepting
    the request, use only secured webhooks.
  impact: Reduces the payloads that the web hook can listen for and receive.
  references: []
  page_start: 215
  audit_raw: ''
  remediation: For each webhook in use, change it to secured (over HTTPS).
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 4.4.1
  title: Ensure artifacts contain information about their origin
  scoring: manual
  profile:
  - Level 1
  description: When delivering artifacts, ensure they have information about their origin. This may be done by providing a
    Software Bill of Manufacture (SBOM) or some metadata files.
  rationale: Information about artifact origin can be used for verification purposes. Having this kind of information allows
    the user to decide if the organization supplying the artifact is trusted. In a case of potential vulnerability or version
    update, this can be used to verify that the organization issuing it is the actual origin and not someone else. If users
    need to report problems with the artifact, they will have an address to contact as well.
  impact: ''
  references: []
  page_start: 217
  audit_raw: For each artifact, ensure it has information about its origin.
  remediation: 'For each artifact supplied, supply information about its origin. For each artifact in use,

    ask for information about its origin.'
  checks:
  - type: manual_review
    info: For each artifact, ensure it has information about its origin.
    severity: medium
- id: 5.1.1
  title: Ensure deployment configuration files are separated from source code
  scoring: manual
  profile:
  - Level 2
  description: Deployment configurations are often stored in a version control system. Separate deployment configuration files
    from source code repositories.
  rationale: Deployment configuration manifests are often stored in version control systems. Storing them in dedicated repositories,
    separately from source code repositories, has several benefits. First, it adds order to both maintenance and version control
    history. This makes it easier to track code or manifest changes, as well as spot any malicious code or misconfigurations.
    Second, it helps achieve the Least Privilege principle. Because access can be configured differently for each repository,
    fewer users will have access to this configuration, which is typically sensitive.
  impact: ''
  references: []
  page_start: 220
  audit_raw: Ensure each deployment configuration file is stored separately from source code.
  remediation: 'Store each deployment configuration file in a dedicated repository separately from

    source code.'
  checks:
  - type: manual_review
    info: Ensure each deployment configuration file is stored separately from source code.
    severity: medium
- id: 5.1.2
  title: Ensure changes in deployment configuration are audited
  scoring: manual
  profile:
  - Level 1
  description: Audit and track changes made in deployment configuration.
  rationale: Deployment configuration is sensitive in nature. The tiniest mistake can lead to downtime or bugs in production,
    which consequently may have a direct effect on both product integrity and customer trust. Misconfigurations might also
    be used by malicious actors to attack the production platform. Because of this, every change in the configuration needs
    a review and possible "revert" in case of a mistake or malicious change. Auditing every change and tracking them helps
    detect and fix such incidents more quickly.
  impact: ''
  references: []
  page_start: 221
  audit_raw: For each deployment configuration, ensure changes made to it are audited and tracked.
  remediation: For each deployment configuration, track and audit changes made to it.
  checks:
  - type: manual_review
    info: For each deployment configuration, ensure changes made to it are audited and tracked.
    severity: medium
- id: 5.1.3
  title: Ensure scanners are in place to identify and prevent sensitive data in deployment configuration
  scoring: manual
  profile:
  - Level 1
  description: Detect and prevent sensitive data – such as confidential ID numbers, passwords, etc. – in deployment configurations.
  rationale: Sensitive data in deployment configurations might create a major incident if an attacker gains access to it,
    as this can cause data loss and theft. It is important to keep sensitive data safe and to not expose it in the configuration.
    In order to prevent a possible exposure, set scanners that will identify and prevent such data in deployment configurations.
  impact: ''
  references: []
  page_start: 222
  audit_raw: 'For each deployment configuration file, verify that scanners are set to identify and

    prevent the existence of sensitive data within it.'
  remediation: 'For each deployment configuration file, set scanners to identify and prevent sensitive

    data within it.'
  checks:
  - type: manual_review
    info: 'For each deployment configuration file, verify that scanners are set to identify and

      prevent the existence of sensitive data within it.'
    severity: medium
- id: 5.1.4
  title: Limit access to deployment configurations
  scoring: manual
  profile:
  - Level 1
  description: Restrict access to the deployment configuration to trusted and qualified users only.
  rationale: Deployment configurations are sensitive in nature. The tiniest mistake can lead to downtime or bugs in production,
    which can have a direct effect on the product's integrity and customer trust. Misconfigurations might also be used by
    malicious actors to attack the production platform. To avoid such harm as much as possible, ensure only trusted and qualified
    users have access to such configurations. This will also reduce the number of accounts that might affect the environment
    in case of an attack.
  impact: Reducing the number of users who have access to the deployment configuration means those users would lose their
    ability to make direct changes to that configuration.
  references: []
  page_start: 223
  audit_raw: Verify each deployment configuration is accessible only to known and authorized users.
  remediation: Restrict access to the deployment configuration to trusted and qualified users.
  checks:
  - type: manual_review
    info: Verify each deployment configuration is accessible only to known and authorized users.
    severity: medium
- id: 5.1.5
  title: Scan Infrastructure as Code (IaC)
  scoring: manual
  profile:
  - Level 2
  description: Detect and prevent misconfigurations or insecure instructions in Infrastructure as Code (IaC) files, such as
    Terraform files.
  rationale: Infrastructure as Code (IaC) files are used for production environment and application deployment. These are
    sensitive parts of the software supply chain because they are always in touch with customers, and thus might affect their
    opinion of or trust in the product. Attackers often target these environments. Detecting and fixing misconfigurations
    and/or insecure instructions in IaC files decreases the risk for data leak or data theft. It is important to secure IaC
    instructions in order to prevent further problems of deployment, exposed assets, or improper configurations, which might
    ultimately lead to easier ways to attack and steal organization data.
  impact: ''
  references: []
  page_start: 225
  audit_raw: 'For every Infrastructure as Code (IaC) instructions file, verify that scanners are set to

    identify and prevent misconfigurations and insecure instructions.'
  remediation: 'For every Infrastructure as Code (IaC) instructions file, set scanners to identify and

    prevent misconfigurations and insecure instructions.'
  checks:
  - type: manual_review
    info: 'For every Infrastructure as Code (IaC) instructions file, verify that scanners are set to

      identify and prevent misconfigurations and insecure instructions.'
    severity: medium
- id: 5.1.6
  title: Ensure deployment configuration manifests are verified
  scoring: manual
  profile:
  - Level 1
  description: Verify the deployment configuration manifests.
  rationale: To ensure that the configuration manifests used are trusted and have not been infected by malicious actors before
    arriving at the platform, it is important to verify the manifests. This may be done by comparing the checksum of the manifest
    file to its checksum in a trusted source. If a difference arises, this is a sign that an unknown actor has interfered
    and may have added malicious instructions. If this manifest is used, it might harm the environment and application deployment,
    which could end in a massive breach and leave the organization exposed to data leaks, etc.
  impact: ''
  references: []
  page_start: 226
  audit_raw: For each deployment configuration manifest in use, ensure it has been verified.
  remediation: Verify each deployment configuration manifest in use.
  checks:
  - type: manual_review
    info: For each deployment configuration manifest in use, ensure it has been verified.
    severity: medium
- id: 5.1.7
  title: Ensure deployment configuration manifests are pinned to a specific, verified version
  scoring: manual
  profile:
  - Level 1
  description: Deployment configuration is often stored in a version control system and is pulled from there. Pin the configuration
    used to a specific, verified version or commit Secure Hash Algorithm (SHA). Avoid referring configuration without its
    version tag specified.
  rationale: Deployment configuration manifests are often stored in version control systems and pulled from there either by
    automation platforms, for example Ansible, or GitOps platforms, such as ArgoCD. When a manifest is pulled from a version
    control system without tag or commit Secure Hash Algorithm (SHA) specified, it is pulled from the HEAD revision, which
    is equal to the 'latest' tag, and pulls the last change made. This increases the risk of encountering a new, potentially
    malicious configuration. If an attacker pushes malicious configuration to the version control system, the next user who
    pulls the HEAD revision will pull it and risk attack. To avoid that risk, use a version tag of verified version or a commit
    SHA of a trusted commit, which will ensure this is the only version pulled.
  impact: Changes in deployment configuration will not be pulled unless their version tag or commit Secure Hash Algorithm
    (SHA) is specified. This might slow down the deployment process.
  references: []
  page_start: 227
  audit_raw: 'For every deployment configuration manifest in use, ensure it is pinned to a specific

    version or commit Secure Hash Algorithm (SHA).'
  remediation: 'For every deployment configuration manifest in use, pin to a specific version or commit

    Secure Hash Algorithm (SHA).'
  checks:
  - type: manual_review
    info: 'For every deployment configuration manifest in use, ensure it is pinned to a specific

      version or commit Secure Hash Algorithm (SHA).'
    severity: medium
- id: 5.2.1
  title: Ensure deployments are automated
  scoring: manual
  profile:
  - Level 1
  description: Automate deployments of production environment and application.
  rationale: Automating the deployments of both production environment and applications reduces the risk for human mistakes
    — such as a wrong configuration or exposure of sensitive data — because it requires less human interaction or intervention.
    It also eases redeployment of the environment. It is best to automate with Infrastructure as Code (IaC) because it offers
    more control over changes made to the environment creation configuration and stores to a version control platform.
  impact: ''
  references: []
  page_start: 230
  audit_raw: For each deployment process, ensure it is automated.
  remediation: Automate each deployment process of the production environment and application.
  checks:
  - type: manual_review
    info: For each deployment process, ensure it is automated.
    severity: medium
- id: 5.2.2
  title: Ensure the deployment environment is reproducible
  scoring: manual
  profile:
  - Level 1
  description: Verify that the deployment environment – the orchestrator and the production environment where the application
    is deployed – is reproducible. This means that the environment stays the same in each deployment if the configuration
    has not changed.
  rationale: A reproducible build is a build that produces the same artifact when given the same input data, and in this case
    the same environment. Ensuring that the same environment is produced when given the same input helps verify that no change
    has been made to it. This action allows an organization to trust that its deployment environment is built only from safe
    code and configuration that has been reviewed and tested and has not been tainted or changed abruptly.
  impact: ''
  references: []
  page_start: 231
  audit_raw: Verify that the deployment/production environment is reproducible.
  remediation: 'Adjust the process that deploys the deployment/production environment to build the

    same environment each time when the configuration has not changed.'
  checks:
  - type: manual_review
    info: Verify that the deployment/production environment is reproducible.
    severity: medium
- id: 5.2.3
  title: Ensure access to production environment is limited
  scoring: manual
  profile:
  - Level 1
  description: Restrict access to the production environment to a few trusted and qualified users only.
  rationale: The production environment is an extremely sensitive one. It directly affects the customer experience and trust
    in a product, which has serious effects on the organization itself. Because of this sensitive nature, it is important
    to restrict access to the production environment to only a few trusted and qualified users. This will reduce the risk
    of mistakes such as exposure of secrets or misconfiguration. This restriction also reduces the number of accounts that
    are vulnerable to hijacking in order to potentially harm the production environment.
  impact: Reducing the number of users who have access to the production environment means those users would lose their ability
    to make direct changes to that environment.
  references: []
  page_start: 232
  audit_raw: Verify that the production environment is accessible only to trusted and qualified users.
  remediation: Restrict access to the production environment to trusted and qualified users.
  checks:
  - type: manual_review
    info: Verify that the production environment is accessible only to trusted and qualified users.
    severity: medium
- id: 5.2.4
  title: Ensure default passwords are not used
  scoring: manual
  profile:
  - Level 1
  description: Do not use default passwords of deployment tools and components.
  rationale: Many deployment tools and components are provided with default passwords for the first login. This password is
    intended to be used only on the first login and should be changed immediately after. Using the default password substantially
    increases the attack risk. It is very important to ensure that default passwords are not used in deployment tools and
    components.
  impact: ''
  references: []
  page_start: 233
  audit_raw: For each deployment tool, ensure the password is not the default one.
  remediation: For each deployment tool, change the password.
  checks:
  - type: manual_review
    info: For each deployment tool, ensure the password is not the default one.
    severity: medium
