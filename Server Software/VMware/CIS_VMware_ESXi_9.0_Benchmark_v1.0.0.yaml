  audit_raw: 'Review /etc/ssh/sshd_config and verify PermitUserEnvironment no .

    The following PowerCLI command may be used:

    (Get-VM -Name $VM).ExtensionData.Config.BootOptions.EfiSecureBootEnabled

    The following PowerCLI command may be used:

    (Get-VM -Name $VM).ExtensionData.Config.MigrateEncryption

    The following PowerCLI command may be used:

    (Get-VM -Name $VM).ExtensionData.Config.FtEncryptionMode

    The following PowerCLI command may be used:

    Get-VM -Name $VM | Get-AdvancedSetting mks.enable3d

    The following PowerCLI command may be used:

    Get-VM -Name $VM | Get-AdvancedSetting tools.guest.desktop.autolock

    To verify that only one remote console session is permitted at a time, confirm that

    RemoteDisplay.maxConnections is set to 1.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that RemoteDisplay.maxConnections is set to 1.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select Entity,

    Name, Value

    The following PowerCLI command can be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "pciPassthru*.present" | Select Entity, Name,

    Value

    ``

    A return value other than "false" needs to be remediated.

    To verify unauthorized device modifications and disconnections are prevented, access

    the virtual machine configuration file and verify that

    isolation.device.edit.disable is set to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.edit.disable" | Select

    Entity, Name, Value

    To verify unauthorized device connections are prevented, access the virtual machine

    configuration file and verify that isolation.device.connectable.disable is set

    to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.connectable.disable" | Select

    Entity, Name, Value

    From an administrative PowerCLI session

    1. Execute Get-VM | Get-SoundCard  where supported, or inspect each VM''s

    Edit Settings > Virtual Hardware. Verify that audio devices are absent unless

    specifically required.

    Inspect VM hardware for unnecessary SATA/AHCI controllers. With PowerCLI/Get-View,

    review virtual devices and identify VirtualAHCIController devices that do not back

    a required virtual disk or CD/DVD device.

    To verify USB devices are not connected, confirm that the following parameter is either

    NOT present or is set to FALSE: usb.present

    Alternately, the following PowerCLI command may be used:

    # Check for USB Devices attached to VMs

    Get-VM | Get-USBDevice

    To verify serial ports are not connected, confirm that the following parameter is either

    NOT present or is set to FALSE: serialX.present

    The following PowerCLI command may be used:

    # In this Example you will need to add the functions from this post:

    http://blogs.vmware.com/vipowershell/2012/05/working-with-vm-devices-inpowercli.html

    # Check for Serial ports attached to VMs

    Get-VM | Get-SerialPort

    To verify parallel ports are not connected, confirm that the following parameter is either

    NOT present or is set to FALSE: parallelX.present

    Alternately, the following PowerCLI command may be used:

    # In this Example you will need to add the functions from this post:

    http://blogs.vmware.com/vipowershell/2012/05/working-with-vm-devices-inpowercli.html

    # Check for Parallel ports attached to VMs

    Get-VM | Get-ParallelPort

    To verify CD/DVD drives are not connected, confirm that the following parameter is

    either NOT present or is set to FALSE: ideX:Y.present

    Alternately, the following PowerCLI command may be used:

    # Check for CD/DVD Drives attached to VMs

    Get-VM | Get-CDDrive

    To verify floppy drives are not connected, confirm that the following parameter is either

    NOT present or is set to FALSE: floppyX.present

    Alternately, the following PowerCLI command may be used:

    # Check for Floppy Devices attached to VMs

    Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState

    To verify that VM console drag and drop operations are disabled, verify that

    isolation.tools.dnd.disable is missing or set to TRUE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that isolation.tools.dnd.disable is set to TRUE or missing.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM -Name $VM | Get-AdvancedSetting isolation.tools.dnd.disable

    To verify that VM console copy operations are disabled, verify that the

    isolation.tools.copy.disable option is missing or set to TRUE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that isolation.tools.copy.disable is set to TRUE or missing.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.copy.disable" | Select Entity,

    Name, Value

    To verify that VM console paste operations are disabled, verify that

    isolation.tools.paste.disable is missing or set to TRUE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that isolation.tools.paste.disable is set to TRUE or missing.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.paste.disable"| Select Entity,

    Name, Value

    To verify this information utilize the vSphere interface as follows:

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that ethernet0.filter1.name = dv-filter 1 where ethernet0 is

    the network adapter interface of the virtual machine that is to be protected,

    filter1 is the number of the filter that is being used, and dv-filter1 is the

    name of the particular data path kernel module that is protecting the VM.

    If dvfilter access should not be permitted: Verify that the following is NOT

    listed ethernet0.filter1.name = dv-filter .

    5. Ensure that the name of the data path kernel is set correctly.

    You may also perform the following to determine if dvfilter access should be permitted

    via the VMX file:

    1. Verify that the following is in the VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter
    interface of the virtual

    machine that is to be protected, filter1 is the number of the filter that is being

    used, and dv-filter1 is the name of the particular data path kernel module

    that is protecting the VM.

    If dvfilter access should not be permitted: Verify that the following is not in the

    VMX file: ethernet0.filter1.name = dv-filter1 .

    2. Ensure that the name of the data path kernel is set correctly.

    Verify that isolation.tools.diskShrink.disable is set to TRUE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that isolation.tools.diskShrink.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskShrink.disable"| Select

    Entity, Name, Value

    To verify that virtual disk wiping is disabled, verify that

    isolation.tools.diskWiper.disable is set to TRUE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that isolation.tools.diskWiper.disable is set to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskWiper.disable"| Select

    Entity, Name, Value

    From an administrative PowerCLI session

    1. Execute Get-VM | Get-AdvancedSetting -Name

    sched.mem.pshare.salt

    2. Verify that any explicitly configured salt does not intentionally enable cross-VM

    sharing; review cluster/host TPS policy and confirm inter-VM transparent page

    sharing is restricted.

    To verify host information is not sent to guests, verify that

    tools.guestlib.enableHostInfo is set to FALSE.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that tools.guestlib.enableHostInfo is set to FALSE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "tools.guestlib.enableHostInfo"| Select

    Entity, Name, Value

    From an administrative PowerCLI session:

    1. Execute Get-VM | Get-AdvancedSetting -Name logging

    2. Verify that VM diagnostic logging is enabled (TRUE) or that the setting is absent

    and the platform default provides logging. Confirm each VM has current

    vmware.log files in its datastore directory.

    To verify that log files will be created more frequently, verify that log.keepOld is set to

    10.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that log.keepOld is set to 10.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "log.keepOld"| Select Entity, Name, Value

    To verify the maximum log file size is limited properly, verify that log.rotateSize is

    set to 1024000.

    1. Select the VM then select Actions followed by Edit Settings .

    2. Click on the VM Options  tab then expand Advanced.

    3. Click on EDIT CONFIGURATION .

    4. Verify that log.rotateSize is set to 1024000.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "log.rotateSize"| Select Entity, Name, Value

    From an administrative PowerCLI session:

    1. Execute Get-VM | Get-AdvancedSetting -Name

    tools.setInfo.sizeLimit

    2. Verify that a finite approved limit is configured for information written by VMware

    Tools to the VMX file.

    From an administrative PowerCLI session:

    1. Execute Get-VM | Select Name,Version

    2. Verify that virtual machine hardware compatibility is version 19 (vmx-19) or

    newer for VMs in scope.

    Within each applicable guest operating system, execute VMwareToolboxCmd.exe -

    v. Compare the installed VMware Tools version to Broadcom lifecycle/support

    information and verify it has not reached End of General Support.

    Determine the installed VMware Tools version in each guest and compare it with the

    current approved security/update baseline. Review Broadcom security advisories for

    fixes applicable to that Tools release.

    Review each VM''s VMware Tools upgrade policy in vSphere (Edit Settings > VM

    Options > VMware Tools ) and the guest''s package-management policy. Verify that

    automatic upgrade behavior matches the organization''s approved change-management

    model.

    Review VMware Tools guest customization settings on deployed VMs and verify

    deployed systems cannot be unexpectedly recustomized. Do not apply this control to

    templates where customization is intentionally required.

    Review VMware Tools configuration for automatic feature installation. Verify that

    automatic addition of optional Tools features is disabled or restricted unless explicitly

    required by the guest''s management design.

    Review VMware Tools configuration for automatic feature removal. Verify that features

    are not automatically removed unless the behavior is explicitly approved.

    Within the guest operating system

    1. Execute `VMwareToolboxCmd.exe config get globalconf enabled```. Unless

    required, verify the value is false.

    Within the guest operating system, execute vmware-toolbox-cmd config get

    containerinfo poll-interval (or the Windows executable where applicable). Unless

    required, verify the polling interval is 0.

    Within the guest operating system, execute vmware-toolbox-cmd config get

    appinfo disabled  (or the Windows executable). Unless application discovery is

    required, verify the value is true.

    Within the guest operating system, execute vmware-toolbox-cmd config get

    gueststoreupgrade policy  (or VMwareToolboxCmd.exe). Unless required, verify

    the value is off.

    Within the guest operating system, execute vmware-toolbox-cmd config get

    servicediscovery disabled (or VMwareToolboxCmd.exe). Unless Service Discovery is

    required, verify the value is true.

    On applicable Windows guests, execute VMwareToolboxCmd.exe config get

    autoupgrade allow-msi-transforms . Verify that the value is false. Treat this

    control as not applicable to non-Windows guests that do not use MSI.

    Review VMware Tools logging configuration inside the guest using vmware-toolbox-cmd

    config get logging log / the applicable tools.conf settings. Verify that Tools logging is

    enabled and produces expected log records.

    Review VMware Tools logging destination and verify Tools messages are sent to the

    guest operating system''s system logging facility (syslog/journald on Linux or the

    approved Windows logging mechanism) rather than only to an unmanaged local file.

    Within the guest operating system, execute vmware-toolbox-cmd config get

    guestoperations disabled (or VMwareToolboxCmd.exe). Unless Guest Operations is

    required, verify the value is true. Do not treat templates requiring guest customization as

    automatically noncompliant without reviewing the operational need.'
  remediation: 'To remediate this recommendation, set PermitUserEnvironment no , restart SSH if

    authorized, and verify users cannot alter the SSH environment through per-user

    environment settings.

    The following PowerCLI command may be used:

    $VMobj = (Get-VM -Name $VM)

    $ConfigSpec = New-Object VMware.Vim.VirtualMachineConfigSpec

    $bootOptions = New-Object VMware.Vim.VirtualMachineBootOptions

    $bootOptions.EfiSecureBootEnabled = $true

    $ConfigSpec.BootOptions = $bootOptions

    $task = $VMobj.ExtensionData.ReconfigVM_Task($ConfigSpec)

    The following PowerCLI command may be used:

    $VMview = Get-VM -Name $VM | Get-View

    $ConfigSpec = New-Object VMware.Vim.VirtualMachineConfigSpec

    $ConfigSpec.MigrateEncryption = New-Object

    VMware.Vim.VirtualMachineConfigSpecEncryptedVMotionModes

    $ConfigSpec.MigrateEncryption = "required"

    $VMview.ReconfigVM_Task($ConfigSpec)

    The following PowerCLI command may be used:

    $VMview = Get-VM -Name $VM | Get-View

    $ConfigSpec = New-Object VMware.Vim.VirtualMachineConfigSpec

    $ConfigSpec.FtEncryptionMode = New-object

    VMware.Vim.VirtualMachineConfigSpecEncryptedFtModes

    $ConfigSpec.FtEncryptionMode = "ftEncryptionRequired"

    $VMview.ReconfigVM_Task($ConfigSpec)

