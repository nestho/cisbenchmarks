- id: 6.5.10
  title: Host SSH daemon, if enabled, must disable TCP forwarding
  scoring: manual
  profile:
  - Level 1
  description: Disabling TCP forwarding in the SSH daemon is a measure to prevent potential unauthorized tunneling and forwarding
    activities that could lead to data leaks or unauthorized data access. This measure adds a layer of security to the SSH
    service when enabled, making the system more resilient against certain types of network attacks.
  rationale: Preventing TCP forwarding aids in ensuring that the SSH daemon is not misused for unauthorized tunneling. This
    measure assists in maintaining a more secure and controlled network environment.
  impact: No functional impact has been reported. This indicates that disabling TCP forwarding is a precautionary measure
    that does not interfere with the normal operation of the host.
  references:
  - 1. https://developer.broadcom.com/xapis/esxcli-commandreference/latest/namespace/esxcli_system.html
  - 2. https://developer.broadcom.com/tools/esxcli/latest/
  page_start: 208
  audit_raw: 'Review /etc/ssh/sshd_config

    1. Verify AllowTcpForwarding no  unless an approved administrative use case

    requires it.'
  remediation: 'To remediate this recommendation, set AllowTcpForwarding no , restart SSH if

    authorized, and test that TCP forwarding is blocked. Document any approved exception.'
  checks:
  - type: manual_review
    info: 'Review /etc/ssh/sshd_config

      1. Verify AllowTcpForwarding no  unless an approved administrative use case

      requires it.'
    severity: medium
- id: 6.5.11
  title: Host SSH daemon, if enabled, must not permit tunnels
  scoring: manual
  profile:
  - Level 1
  description: Preventing tunnel creation in the SSH daemon is a security measure aimed at thwarting unauthorized network
    tunneling through the host. This control, when enforced, helps mitigate the risks associated with potential data exfiltration
    or unauthorized network access that could occur via SSH tunnels.
  rationale: By disallowing tunnel creation, organizations can ensure that the SSH daemon is not exploited for unauthorized
    tunneling activities, thus contributing to a more secure network posture.
  impact: There is no reported functional impact associated with this security control, indicating that the prevention of
    SSH tunneling does not adversely affect the host's normal operational behavior.
  references:
  - 1. https://developer.broadcom.com/xapis/esxcli-commandreference/latest/namespace/esxcli_system.html
  - 2. https://developer.broadcom.com/tools/esxcli/latest/
  page_start: 210
  audit_raw: Review /etc/ssh/sshd_config and verify PermitTunnel no .
  remediation: 'To remediate this recommendation, set PermitTunnel no , restart SSH if authorized,

    and verify SSH tunnel devices cannot be created.'
  checks:
  - type: manual_review
    info: Review /etc/ssh/sshd_config and verify PermitTunnel no .
    severity: medium
