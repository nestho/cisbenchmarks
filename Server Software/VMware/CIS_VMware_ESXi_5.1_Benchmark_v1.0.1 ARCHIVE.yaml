- id: 8.4.27
  title: Disable VM Console and Paste GUI Options
  scoring: scored
  profile:
  - Level 1
  description: Disable VM Console and Paste GUI Options.
  rationale: By default, the ability to copy and paste text, graphics, and files is disabled, as is the ability to drag and
    drop files. When this feature is enabled, you can copy and paste rich text and, depending on the VMware product, graphics
    and files from your clipboard to the guest operating system in a virtual machine. That is, as soon as the console window
    of a virtual machine gains focus, nonprivileged users and processes running in the virtual machine can access the clipboard
    on the computer where the console window is running.
  impact: This is the default setting so functionality remains the same.
  references:
