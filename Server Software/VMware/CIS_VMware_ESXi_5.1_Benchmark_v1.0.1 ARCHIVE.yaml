- id: 8.1.3
  title: Limit sharing of console connections
  scoring: scored
  profile:
  - Level 1
  description: Limit the max number of console connections to prevent non-administrators from observing the VMs screen.
  rationale: By default, remote console sessions can be connected to by more than one user at a time. When multiple sessions
    are activated, each terminal window gets a notification about the new session. If an administrator in the VM logs in using
    a VMware remote console during their session, a non-administrator in the VM might connect to the console and observe the
    administrator's actions. Also, this could result in an administrator losing console access to a virtual machine. For example
    if a jump box is being used for an open console session, and the admin loses connection to that box, then the console
    session remains open. Allowing two console sessions permits debugging via a shared session. For highest security, only
    one remote console session at a time should be allowed.
  impact: Only one remote console connection to the VM will be permitted. Other attempts will be rejected until the first
    session disconnects.
  references:
  - 1. http://kb.vmware.com/kb/2015407
  page_start: 72
  audit_raw: 'Check virtual machine configuration file and verify that RemoteDisplay.maxConnections is

    set to 1.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select Entity,

    Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "RemoteDisplay.maxConnections" -value 1'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that RemoteDisplay.maxConnections is

      set to 1.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select Entity,

      Name, Value'
    severity: medium
- id: 8.2.1
  title: Disconnect unauthorized devices - Floppy Devices
  scoring: scored
  profile:
  - Level 1
  description: Any enabled or connected device represents a potential attack channel. Users and processes without privileges
    on a virtual machine can connect or disconnect hardware devices, such as network adapters and CD-ROM drives. Attackers
    can use this capability to breach virtual machine security. Removing unnecessary hardware devices can help prevent attacks.
  rationale: 'Besides disabling unnecessary virtual devices from within the virtual machine, you should ensure that no device
    is connected to a virtual machine if it is not required to be there. For example, serial and parallel ports are rarely
    used for virtual machines in a datacenter environment, and CD/DVD drives are usually connected only temporarily during
    software installation. For less commonly used devices that are not required, either the parameter should not be present
    or its value must be FALSE. NOTE: The parameters listed are not sufficient to ensure that a device is usable; other parameters
    are required to indicate specifically how each device is instantiated. Any enabled or connected device represents another
    potential attack channel.'
  impact: Virtual machine will need to be powered off to reverse change if any of these devices are needed at a later time.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.security.doc/GUID-822B2ED3-D8D2-4F57-8335CA46E915A729.html
  page_start: 74
  audit_raw: 'The following parameters should either NOT be present or should be set to FALSE, unless

    Floppy drives are required: floppyX.present

    Additionally, the following PowerCLI command may be used:

    # Check for Floppy Devices attached to VMs

    Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Remove all Floppy drives attached to VMs

    Get-VM | Get-FloppyDrive | Remove-FloppyDrive'
  checks:
  - type: manual_review
    info: 'The following parameters should either NOT be present or should be set to FALSE, unless

      Floppy drives are required: floppyX.present

      Additionally, the following PowerCLI command may be used:

