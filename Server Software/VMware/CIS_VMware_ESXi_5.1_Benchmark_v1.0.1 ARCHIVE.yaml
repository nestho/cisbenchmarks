- id: 8.4.5
  title: Disable Autologon
  scoring: scored
  profile:
  - Level 2
  description: Disable unneeded autologon to reduce the potential for vulnerabilities.
  rationale: Because VMware virtual machines are designed to work on both vSphere as well as hosted virtualization platforms
    such as Workstation and Fusion, there are some VMX parameters that don't apply when running on vSphere. Although the functionality
    governed by these parameters is not exposed on ESX, explicitly disabling them will reduce the potential for vulnerabilities.
    Disabling these features reduces the number of vectors through which a guest can attempt to influence the host, and thus
    may help prevent successful exploits.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.security.doc/GUID-60E83710-8295-41A2-9C9D83DEBB6872C2.html
  page_start: 93
  audit_raw: 'Check virtual machine configuration file and verify that

    isolation.tools.ghi.autologon.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable"| Select

    Entity, Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable" -value

    $true'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that

      isolation.tools.ghi.autologon.disable is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

