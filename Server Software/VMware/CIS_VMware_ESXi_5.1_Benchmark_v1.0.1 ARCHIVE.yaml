- id: 8.6.1
  title: Avoid using nonpersistent disks
  scoring: scored
  profile:
  - Level 1
  description: Virtual Machine Disks are created as Dependent by default and are affected by snapshots. To ensure a virtual
    machine disk is not affected by snapshots the disk mode can be set to Independent. Disks set to Independent mode can be
    Independent Persistent or Independent Nonpersistent. Disks with Independent persistent mode have their data written permanently
    to the disk. Independent Nonpersistent disks lose any changes made to the disk when the system is rebooted and can mask
    any trace of an attack on the system.
  rationale: 'The security issue with nonpersistent disk mode is that successful attackers, with a simple shutdown or reboot,
    might undo or remove any traces that they were ever on the machine. To safeguard against this risk production virtual
    machines should be configured as follows: 1. Independent setting not enabled 2. Independent persistent 3. Independent
    nonpersistent with remote logging Without a persistent record of activity on a VM, administrators might never know whether
    they have been attacked or hacked.'
  impact: Won't be able to make use of nonpersistent mode, which allows rollback to a known state when rebooting the VM.
  references:
  - 1. https://pubs.vmware.com/vsphere51/topic/com.vmware.wssdk.apiref.doc/vim.vm.device.VirtualDiskOption.DiskMod
  - 2. https://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.vm_admin.doc/GUID-81629CAB-72FA-42F0-9F86F8FD0DE39E57.html
  page_start: 122
  audit_raw: 'If remote logging of events and activity is not configured for the guest, scsiX:Y.mode should

    be either:

    1. Not present. This is the default.

    2. Not set to independent nonpersistent

    Additionally, the following PowerCLI command may be used:

    #List the VM''s and their disk types

    Get-VM | Get-HardDisk | Select Parent, Name, Filename, DiskType, Persistence'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    #Alter the parameters for the following cmdlet to set the VM Disk Type:

    Get-VM | Get-HardDisk | Set-HardDisk'
  checks:
  - type: manual_review
    info: 'If remote logging of events and activity is not configured for the guest, scsiX:Y.mode should

      be either:

      1. Not present. This is the default.

      2. Not set to independent nonpersistent

      Additionally, the following PowerCLI command may be used:

      #List the VM''s and their disk types

      Get-VM | Get-HardDisk | Select Parent, Name, Filename, DiskType, Persistence'
    severity: medium
- id: 8.6.2
  title: Disable virtual disk shrinking
  scoring: scored
  profile:
  - Level 2
  description: If Virtual disk shrinking is done repeatedly it will cause the virtual disk to become unavailable resulting
    in a denial of service. You can prevent virtual disk shrinking by disabling it.
  rationale: Shrinking a virtual disk reclaims unused space in it. If there is empty space in the disk, this process reduces
    the amount of space the virtual disk occupies on the host drive. Normal users and processes—that is, users and processes
    without root or administrator privileges—within virtual machines have the capability to invoke this procedure. However,
    if this is done repeatedly, the virtual disk can become unavailable while this shrinking is being performed, effectively
    causing a denial of service. In most datacenter environments, disk shrinking is not done, so you should disable this feature.
    Repeated disk shrinking can make a virtual disk unavailable. This capability is available to nonadministrative users in
    the guest.
  impact: Inability to shrink virtual machine disks in the event that a datastore runs out of space.
  references:
  - 1. https://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.security.doc/GUID-C7D50832-CDBF-4E64-B5C057DF4A94B892.html
  page_start: 123
  audit_raw: 'Check virtual machine configuration file and verify that

    isolation.tools.diskShrink.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.diskShrink.disable"| Select

    Entity, Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.diskShrink.disable" -value $true'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that

      isolation.tools.diskShrink.disable is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "isolation.tools.diskShrink.disable"| Select

      Entity, Name, Value'
    severity: medium
