- id: 8.1.1
  title: Disable VM communication through VMCI
  scoring: scored
  profile:
  - Level 1
  description: Configure the Virtual Machine Communication Interface (VMCI) to restrict VM communication.
  rationale: If the interface is not restricted, a VM can detect and be detected by all other VMs with the same option enabled
    within the same host. This might be the intended behavior, but custom-built software can have unexpected vulnerabilities
    that might potentially lead to an exploit. Additionally, it is possible for a VM to detect how many other VMs are within
    the same ESXI system by simply registering the VM. This information might also be used for a potentially malicious objective.
    By default, the setting is FALSE. The VM can be exposed to other VMs within the same system as long as there is at least
    one program connected to the VMCI socket interface. Guest-to-guest communications (virtual machine to virtual machine)
    are deprecated in the vSphere 5.1 release. This functionality will be removed in the next major release. VMware will continue
    support for host to guest communications.
  impact: Virtual machines will be unable to communicate using VMCI technology.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.ICbase/PDF/ws8x_esx51_vmci_sockets.pdf
  page_start: 70
  audit_raw: 'Check virtual machine configuration file and verify that vmci0.unrestricted is set to FALSE

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "vmci0.unrestricted" | Select Entity, Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "vmci0.unrestricted" -value $false'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that vmci0.unrestricted is set to FALSE

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "vmci0.unrestricted" | Select Entity, Name, Value'
    severity: medium
- id: 8.1.2
  title: Limit informational messages from the VM to the VMX file
  scoring: scored
  profile:
  - Level 1
  description: Limit informational messages from the virtual machine to the VMX file to avoid filling the datastore and causing
    a Denial of Service (DoS).
  rationale: The configuration file containing these name-value pairs is limited to a size of 1MB. This 1MB capacity should
    be sufficient for most cases, but you can change this value if necessary. You might increase this value if large amounts
    of custom information are being stored in the configuration file. The default limit is 1MB; this limit is applied even
    when the sizeLimit parameter is not listed in the .vmx file. Uncontrolled size for the VMX file can lead to denial of
    service if the datastore is filled.
