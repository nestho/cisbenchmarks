- id: 8.2.6
  title: Prevent unauthorized removal, connection, and modification of devices
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Prevent unauthorized removal, connection, and modification of devices. Reduce the number of potential attack
    vectors by disabling unnecessary system components that are not needed to support the application or service running on
    the virtual machine.
  rationale: 'Normal users and processes - that is, users and processes without root or administrator privileges  within virtual
    machines have the capability to connect or disconnect devices, such as network adaptors and CD-ROM drives, as well as
    the ability to modify device settings. In general, you should use the virtual machine settings editor or configuration
    editor to remove any unneeded or unused hardware devices. However, you might want to use the device again, so removing
    it is not always a good solution. In that case, you can prevent a user or running process in the virtual machine from
    connecting or disconnecting a device from within the guest operating system, as well as modifying devices, by adding the
    following parameters. By default, a rogue user with non-administrator privileges in a virtual machine can:  Connect a
    disconnected CD-ROM drive and access sensitive information on the media left in the drive.  Disconnect a network adapter
    to isolate the virtual machine from its network, which is a denial of service.  Modify settings on a device. By disabling
    unnecessary system components that are not needed to support the application or service running on the system, you reduce
    the number of parts that can be attacked. VMs often don''t require as many services or functions as ordinary physical
    servers; so when virtualizing, you should evaluate whether a particular service or function is truly needed. Any service
    running in a VM provides a potential avenue of attack.'
  impact: Device interaction is blocked inside the guest OS using VMware tools.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.security.doc/GUID-C5898E50-2182-4B71-BADCC9BFA409FB6C.html
  - 2. http://pubs.vmware.com/vsphere51/topic/com.vmware.vmtools.install.doc/GUID-685722FA-9009-439C-914218A9E7C592EA.html
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.security.doc/GUID-6BFA8CA7-610F-4E6B-9FC6D656917B7E7A.html
  page_start: 80
  audit_raw: 'Check virtual machine configuration file and verify that isolation.device.edit.disable

    is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.edit.disable" | Select Entity,

    Name, Value

    Verify the following are disabled:

    1. Unused services in the operating system. For example, if the system runs a file

    server, make sure to turn off any Web services.

    2. Unused physical devices, such as CD/DVD drives, floppy drives, and USB adaptors.

    This is described in the Removing Unnecessary Hardware Devices section in the

    ESXI Configuration Guide.

    3. Screen savers. X-Windows if using a Linux, BSD, or Solaris guest operating system.'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.device.edit.disable" -value $true

    Some of these steps include:

    1. Disable unused services in the operating system. For example, if the system runs a

    file server, make sure to turn off any Web services.

    2. Disconnect unused physical devices, such as CD/DVD drives, floppy drives, and USB

    adaptors. This is described in the Removing Unnecessary Hardware Devices section

    in the ESXI Configuration Guide.

    3. Turn off any screen savers. If using a Linux, BSD, or Solaris guest operating system,

    do not run the X Window system unless it is necessary.'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that isolation.device.edit.disable

      is set to TRUE.

