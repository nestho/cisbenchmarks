- id: 8.4.21
  title: Disable Host Guest File System Server
  scoring: scored
  profile:
  - Level 2
  description: Disable unexposed Host Guest File System Server feature.
  rationale: Certain automated operations such as automated tools upgrades use a component into the hypervisor called Host
    Guest File System (HGFS) and an attacker could potentially use this to transfer files inside the guest OS.
  impact: Setting isolation.tools.hgfsServerSet.disable to true disables registration of the guest's HGFS server with the
    host. APIs that use HGFS to transfer files to and from the guest operating system, such as some VIX commands or the VMware
    Tools auto-upgrade utility, will not function.
  references:
