controls:
- id: 7.1.1
  title: Disable VDS network healthcheck if not used
  scoring: scored
  profile:
  - Level 1
  description: Disable VDS network healthcheck if not used.
  rationale: Network Healthcheck is disabled by default. Once enabled, the healthcheck packets contain information on host#,
    vds# port#, which an attacker would find useful. It is recommended that network healthcheck be used for troubleshooting,
    and turned off when troubleshooting is finished.
  impact: Limit the use of this feature only to when actively troubleshooting VLAN or MTU issues on a VDS.
  references: []
  page_start: 54
  audit_raw: '1. Using the vSphere Web Client, select each VDS.

    2. Go to Manage > Settings > Health check".

    3. Verify that VLAN and MTU Check and Teaming and Failover Check are both

    disabled.'
  remediation: '1. Using the vSphere Web Client.

    2. Select each VDS.

    3. Go to Manage > Settings > Health check".

    4. Disable the VLAN and MTU Check and Teaming and Failover Check settings.'
  checks:
  - type: manual_review
    info: '1. Using the vSphere Web Client, select each VDS.

      2. Go to Manage > Settings > Health check".

      3. Verify that VLAN and MTU Check and Teaming and Failover Check are both

      disabled.'
    severity: medium
- id: 7.1.2
  title: Ensure that the MAC Address Change policy is set to reject
  scoring: scored
  profile:
  - Level 1
  description: Ensure that the MAC Address Change policy is set to reject.
  rationale: If the virtual machine operating system changes the MAC address, it can send frames with an impersonated source
    MAC address at any time. This allows it to stage malicious attacks on the devices in a network by impersonating a network
    adaptor authorized by the receiving network. This will prevent VMs from changing their effective MAC address. It will
    affect applications that require this functionality. An example of an application like this is Microsoft Clustering, which
    requires systems to effectively share a MAC address. This will also affect how a layer 2 bridge will operate. This will
    also affect applications that require a specific MAC address for licensing. An exception should be made for the dvPortgroups
    that these applications are connected to.
  impact: This will prevent VMs from changing their effective MAC address. It will affect applications that require this functionality.
    An example of an application like this is Microsoft Clustering, which requires systems to effectively share a MAC address.
    This will also affect how a layer 2 bridge will operate. This will also affect applications that require a specific MAC
    address for licensing. An exception should be made for the dvPortgroups that these applications are connected to.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.wssdk.apiref.doc/vim.host.NetworkPolicy.SecurityPolicy.ht
  page_start: 55
  audit_raw: '1. Verify by using the vSphere Client to connect to the vCenter Server and logging in as

    an administrator.

    2. Go to "Home > Inventory > Networking".

    3. Select each dvPortgroup connected to active VMs requiring securing.

    4. Go to tab "Summary > Edit Settings > Policies > Security".

    5. "Mac Address Changes" = "Reject"

    Additionally, the following PowerCLI command may be used:

    # List all dvPortGroups and their Security Settings

    Get-VirtualPortGroup -Distributed | Select Name, `

    @{N="MacChanges";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.MacChanges.Value) { "Accept"

    } Else { "Reject"} }}, `

    @{N="PromiscuousMode";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.AllowPromiscuous.Value) {

    "Accept" } Else { "Reject"} }}, `

    @{N="ForgedTransmits";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.ForgedTransmits.Value) {

    "Accept" } Else { "Reject"} }}'
  remediation: '1. Configure by using the vSphere Client to connect to the vCenter Server and logging

    in as an administrator.

    2. Go to "Home > Inventory > Networking".

    3. Select each dvPortgroup connected to active VMs requiring securing.

    4. Go to tab "Summary > Edit Settings > Policies > Security".

    5. Set "Mac Address Changes" = "Reject"'
  checks:
  - type: manual_review
    info: '1. Verify by using the vSphere Client to connect to the vCenter Server and logging in as

      an administrator.

      2. Go to "Home > Inventory > Networking".

      3. Select each dvPortgroup connected to active VMs requiring securing.

      4. Go to tab "Summary > Edit Settings > Policies > Security".

      5. "Mac Address Changes" = "Reject"

      Additionally, the following PowerCLI command may be used:

      # List all dvPortGroups and their Security Settings

      Get-VirtualPortGroup -Distributed | Select Name, `

      @{N="MacChanges";E={i'
    severity: medium
- id: 7.1.3
  title: Ensure that the Promiscuous Mode policy is set to reject
  scoring: scored
  profile:
  - Level 1
  description: Configure the vDS Promiscuous Mode setting to reject.
  rationale: When promiscuous mode is enabled for a dvPortgroup, all virtual machines connected to the dvPortgroup have the
    potential of reading all packets across that network, meaning only the virtual machines connected to that dvPortgroup.
    Promiscuous mode is disabled by default on the ESXi host, and this is the recommended setting. However, there might be
    a legitimate reason to enable it for debugging, monitoring or troubleshooting reasons. Security devices might require
    the ability to see all packets on a vSwitch. An exception should be made for the dvPortgroups that these applications
    are connected to, in order to allow for full-time visibility to the traffic on that dvPortgroup.
  impact: Security devices that require the ability to see all packets on a vSwitch will not operate properly if the Promiscuous
    Mode parameter is set to Reject.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.wssdk.apiref.doc/vim.host.NetworkPolicy.SecurityPolicy.ht
  page_start: 56
  audit_raw: '1. Verify by using the vSphere Client to connect to the vCenter Server and logging in as

    an administrator.

    2. Go to "Home > Inventory > Networking".

    3. Select each dvPortgroup connected to active VM''s requiring securing.

    4. Go to tab "Summary > Edit Settings > Policies > Security".

    5. Configure "Promiscuous Mode" = "Reject"

    Additionally, the following PowerCLI command may be used:

    # List all dvPortGroups and their Security Settings

    Get-VirtualPortGroup -Distributed | Select Name, `

    @{N="MacChanges";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.MacChanges.Value) { "Accept"

    } Else { "Reject"} }}, `

    @{N="PromiscuousMode";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.AllowPromiscuous.Value) {

    "Accept" } Else { "Reject"} }}, `

    @{N="ForgedTransmits";E={if

    ($_.ExtensionData.Config.DefaultPortConfig.SecurityPolicy.ForgedTransmits.Value) {

    "Accept" } Else { "Reject"} }}'
  remediation: '1. Verify by using the vSphere Client to connect to the vCenter Server and logging in as

    an administrator.

    2. Go to "Home > Inventory > Networking".

    3. Select each dvPortgroup connected to active VMs requiring securing.

    4. Go to tab "Summary > Edit Settings > Policies > Security".

    5. Configure "Promiscuous Mode" = "Reject"'
  checks:
  - type: manual_review
    info: '1. Verify by using the vSphere Client to connect to the vCenter Server and logging in as

      an administrator.

      2. Go to "Home > Inventory > Networking".

      3. Select each dvPortgroup connected to active VM''s requiring securing.

      4. Go to tab "Summary > Edit Settings > Policies > Security".

      5. Configure "Promiscuous Mode" = "Reject"

