- id: 7.1.4
  title: Ensure that there are no unused ports on a distributed virtual port group
  scoring: scored
  profile:
  - Level 1
  description: Ensure that there are no unused ports on a distributed virtual port group.
  rationale: The number of ports available on a vdSwitch distributed port group can be adjusted to exactly match the number
    of virtual machine vNICs that need to be assigned to that dvPortgroup. Limiting the number of ports to just what is needed
    limits the potential for an administrator, either accidentally or maliciously, to move a virtual machine to an unauthorized
    network. This is especially relevant if the management network is on a dvPortgroup, because it could help prevent someone
    from putting a rogue virtual machine on this network.
  impact: The VDS or dvPortgroup on the VDS will not have any extra available port capacity.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.wssdk.apiref.doc/vim.dvs.DistributedVirtualPortgroup.html
  page_start: 58
  audit_raw: '1. Connect to the vCenter Server with vSphere Client.

    2. Navigate to Home > Inventory > Networking.

    3. Find all dvSwitches.

    4. Verify that the number of ports available total is only the amount required for

    legitimate virtual machine connections to that dvPortgroup.

    Additionally, the following PowerCLI command may be used:

    # Check for the number of free ports on all VDS PortGroups

    Function Get-FreeVDSPort {

    Param (

    [parameter(Mandatory=$true,ValueFromPipeline=$true)]

    $VDSPG

    )

    Process {

    $nicTypes =

    "VirtualE1000","VirtualE1000e","VirtualPCNet32","VirtualVmxnet","VirtualVmxnet2","Virt

    ualVmxnet3"

    $ports = @{}

    $VDSPG.ExtensionData.PortKeys | Foreach {

    $ports.Add($_,$VDSPG.Name)

    }

    $VDSPG.ExtensionData.Vm | Foreach {

    $VMView = Get-View $_

    $nic = $VMView.Config.Hardware.Device | where {$nicTypes -contains $_.GetType().Name -

    and $_.Backing.GetType().Name -match "Distributed"}

    $nic | where {$_.Backing.Port.PortKey} | Foreach

    {$ports.Remove($_.Backing.Port.PortKey)}

    }

    ($ports.Keys).Count

    }

    }

    Get-VirtualPortGroup -Distributed | Select Name, @{N="NumFreePorts";E={Get-FreeVDSPort

    -VDSPG $_}}'
  remediation: '1. Connect to the vCenter Server with vSphere Client ( Home > Inventory >

    Networking view, find all dvSwitches) or the Web Client (Networking > vDS name >

    dvPortgroup name > Manage > Edit Settings > General)

    2. Configure the number of ports available to be only the amount required for

    legitimate virtual machine connections to that dvPortgroup.'
  checks:
  - type: manual_review
    info: '1. Connect to the vCenter Server with vSphere Client.

      2. Navigate to Home > Inventory > Networking.

      3. Find all dvSwitches.

      4. Verify that the number of ports available total is only the amount required for

      legitimate virtual machine connections to that dvPortgroup.

      Additionally, the following PowerCLI command may be used:

      # Check for the number of free ports on all VDS PortGroups

      Function Get-FreeVDSPort {

      Param (

      [parameter(Mandatory=$true,ValueFromPipeline=$true)]

      $VDSPG

      )

      Process {

      $nicTypes'
    severity: medium
- id: 7.1.5
  title: Ensure that VDS Port Mirror traffic is only being sent to authorized collector ports or VLANs
  scoring: scored
  profile:
  - Level 1
  description: Ensure that VDS Port Mirror traffic is only being sent to authorized collectors.
  rationale: The vSphere VDS can mirror traffic from one port to another in order to allow for packet capture devices to collect
    specific traffic flows. Port mirroring will send a copy of all traffic specified in un-encrypted format. This mirrored
    traffic contains the full data in the packets captured and can result in total compromise of that data if misdirected.
    If Port Mirroring is required, verify that all Port Mirror Destination VLAN, Port and Uplink ID's are correct.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.networking.doc/GUID-CFFD9157-FC17-440DBDB4-E16FD447A1BA.html
  page_start: 59
  audit_raw: '1. From the Web or vSphere Clients.

    2. Verify that Port Mirror destination interfaces are correct.

    3. Edit the VDS properties and in the Port Mirror tab.

    4. Verify the Destination VLAN, Port, and Uplink ID''s.'
  remediation: '1. From the Web or vSphere Clients.

    2. Configure the Port Mirror destination interfaces to be correct.

    3. Edit the VDS properties.

    4. In the Port Mirror tab, configure the Destination VLAN, Port, and Uplink ID''s.'
  checks:
  - type: manual_review
    info: '1. From the Web or vSphere Clients.

      2. Verify that Port Mirror destination interfaces are correct.

      3. Edit the VDS properties and in the Port Mirror tab.

      4. Verify the Destination VLAN, Port, and Uplink ID''s.'
    severity: medium
- id: 7.1.6
  title: Verify that the autoexpand option for VDS dvPortgroups is disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable the autoexpand option for vDS dvPortgroups.
  rationale: If the "no-unused-dvports" guideline is followed, there should be only the exact number of ports on a vDS that
    are actually needed. The Autoexpand feature on vDS dvPortgroups can override that limit. The feature allows dvPortgroups
    to automatically add 10 virtual distributed switch ports to a dvPortgroup that has run out of available ports. The risk
    is that maliciously or inadvertently, a virtual machine that is not supposed to be part of that portgroup is able to affect
    confidentiality, integrity or authenticity of data of other virtual machines on that portgroup. To reduce the risk of
    inappropriate dvPortgroup access, the autoexpand option on VDS should be disabled. By default the option is disabled,
    but regular monitoring should be implemented to verify this has not been changed.
  impact: ''
  references:
  - 1. http://kb.vmware.com/kb/1022312
  page_start: 60
  audit_raw: '1. Connect to the vCenter Server using the Web Client.

    2. Open the settings for Networking > (vDS name) > (dvPortgroup name) > Manage >

    Edit Settings > General

    3. Verify that "Port allocation" is set to "Fixed".

    4. Verify that the "Number of Ports" is set to the exact amount required for legitimate

    virtual machine connections to that dvPortgroup.

    Additionally, the following PowerCLI command may be used:

    # Check if auto expand is enabled on vDS

    Get-VirtualPortGroup -Distributed | Select Name,

    @{N="AutoExpand";E={$_.ExtensionData.Config.AutoExpand}}'
  remediation: '1. Connect to the vCenter Server using the Web Client.

    2. Open the settings for Networking > (vDS name) > (dvPortgroup name) > Manage >

    Edit Settings > General

    3. Configure "Port allocation" to "Fixed".

    4. Configure the "Number of Ports" to the exact amount required for legitimate virtual

    machine connections to that dvPortgroup.'
  checks:
  - type: manual_review
    info: '1. Connect to the vCenter Server using the Web Client.

      2. Open the settings for Networking > (vDS name) > (dvPortgroup name) > Manage >

      Edit Settings > General

      3. Verify that "Port allocation" is set to "Fixed".

      4. Verify that the "Number of Ports" is set to the exact amount required for legitimate

      virtual machine connections to that dvPortgroup.

      Additionally, the following PowerCLI command may be used:

      # Check if auto expand is enabled on vDS

      Get-VirtualPortGroup -Distributed | Select Name,

      @{N'
    severity: medium
- id: 7.2.1
  title: Ensure that port groups are not configured to the value of the native VLAN
  scoring: scored
  profile:
  - Level 1
  description: Do not use Native VLAN ID 1.
  rationale: ESXi does not use the concept of native VLAN. Frames with VLAN specified in the port group will have a tag, but
    frames with VLAN not specified in the port group are not tagged and therefore will end up as belonging to native VLAN
    of the physical switch. For example, frames on VLAN 1 from a Cisco physical switch will be untagged, because this is considered
    as the native VLAN. However, frames from ESXi specified as VLAN 1 will be tagged with a 1; therefore, traffic from ESXi
    that is destined for the native VLAN will not be correctly routed (because it is tagged with a 1 instead of being untagged),
    and traffic from the physical switch coming from the native VLAN will not be visible (because it is not tagged). If the
    ESXi virtual switch port group uses the native VLAN ID, traffic from those VMs will not be visible to the native VLAN
    on the switch, because the switch is expecting untagged traffic.
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'If the default value of 1 for the native VLAN is being used, the ESXi Server virtual switch

    port groups should be configured with any value between 2 and 4094. Otherwise, ensure

    that the port group is not configured to use whatever value is set for the native VLAN.

    Additionally, the following PowerCLI command may be used:

    # List all vSwitches, their Portgroups and VLAN Ids

    Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
  remediation: 'If the default value of 1 for the native VLAN is being used, the ESXi Server virtual switch

    port groups should be configured with any value between 2 and 4094. Otherwise, ensure

    that the port group is not configured to use whatever value is set for the native VLAN.'
  checks:
  - type: manual_review
    info: 'If the default value of 1 for the native VLAN is being used, the ESXi Server virtual switch

      port groups should be configured with any value between 2 and 4094. Otherwise, ensure

      that the port group is not configured to use whatever value is set for the native VLAN.

      Additionally, the following PowerCLI command may be used:

      # List all vSwitches, their Portgroups and VLAN Ids

      Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
    severity: medium
- id: 7.2.2
  title: Ensure that port groups are not configured to VLAN 4095 except for Virtual Guest Tagging (VGT)
  scoring: scored
  profile:
  - Level 1
  description: Don't use VLAN 4095 except for Virtual Guest Tagging (VGT).
  rationale: When a port group is set to VLAN 4095, this activates VGT mode. In this mode, the vSwitch passes all network
    frames to the guest VM without modifying the VLAN tags, leaving it up to the guest to deal with them. VLAN 4095 should
    be used only if the guest has been specifically configured to manage VLAN tags itself. If VGT is enabled inappropriately,
    it might cause denial of service or allow a guest VM to interact with traffic on an unauthorized VLAN.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'VLAN ID setting on all port groups should not be set to 4095 unless VGT is required.

    Additionally, the following PowerCLI command may be used:

    # List all vSwitches, their Portgroups and VLAN Ids

    Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
  remediation: VLAN ID setting on all port groups should not be set to 4095 unless VGT is required.
  checks:
  - type: manual_review
    info: 'VLAN ID setting on all port groups should not be set to 4095 unless VGT is required.

      Additionally, the following PowerCLI command may be used:

      # List all vSwitches, their Portgroups and VLAN Ids

      Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
    severity: medium
- id: 7.2.3
  title: Ensure that port groups are not configured to VLAN values reserved by upstream physical switches
  scoring: scored
  profile:
  - Level 1
  description: Ensure that port groups are not configured to VLAN values reserved by upstream physical switches
  rationale: Certain physical switches reserve certain VLAN IDs for internal purposes and often disallow traffic configured
    to these values. For example, Cisco Catalyst switches typically reserve VLANs 1001 through 1024 and 4094, while Nexus
    switches typically reserve 3968 through 4047 and 4094. Check with the documentation for your specific switch. Using a
    reserved VLAN might result in a denial of service on the network.
  impact: ''
  references:
  - 1. http://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/122/20ew/configuration/guide/config/vlans.html#wp1038758
  - 2. http://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus5500/sw/laye
  page_start: 63
  audit_raw: 'VLAN ID setting on all port groups should not be set to reserved values of the physical

    switch.

    Additionally, the following PowerCLI command may be used:

    # List all vSwitches, their Portgroups and VLAN Ids

    Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
  remediation: 'VLAN ID setting on all port groups should not be set to reserved values of the physical

    switch.

    Additionally, the following PowerCLI command may be used:

    # List all vSwitches, their Portgroups and VLAN Ids

    Get-VirtualPortGroup -Standard | Select virtualSwitch, Name, VlanID'
  checks:
  - type: manual_review
    info: 'VLAN ID setting on all port groups should not be set to reserved values of the physical

