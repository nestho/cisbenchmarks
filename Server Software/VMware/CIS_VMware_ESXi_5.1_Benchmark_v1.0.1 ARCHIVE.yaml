- id: 8.7.2
  title: Disable VIX messages from the VM
  scoring: scored
  profile:
  - Level 1
  description: If you do not make use of custom VIX programming in your environment then you should disable this feature to
    reduce the potential for vulnerabilities.
  rationale: 'The VIX API is a library for writing scripts and programs to manipulate virtual machines. If you do not make
    use of custom VIX programming in your environment, then you should disable certain features to reduce the potential for
    vulnerabilities. The ability to send messages from the VM to the host is one of these features. Note: Disabling this feature
    does NOT adversely affect the functioning of VIX operations that originate outside the guest, so certain VMware and 3rd
    party solutions that rely upon this capability should continue to work. This is a deprecated interface. Ensure that any
    deprecated interface is turned off for audit purposes.'
  impact: Guest will no longer be able to send messages via VIX API.
  references:
  - 1. https://pubs.vmware.com/vsphere51/topic/com.vmware.vddk.pg.doc/vddkTasks.8.7.html
