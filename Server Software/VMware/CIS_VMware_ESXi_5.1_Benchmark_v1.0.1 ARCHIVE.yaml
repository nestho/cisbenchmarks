- id: 8.3.3
  title: Use secure protocols for virtual serial port access
  scoring: scored
  profile:
  - Level 1
  description: Virtual serial ports allow virtual machines to communicate over the network. Doing so allows you to redirect
    the virtual serial port connection to a TCP/IP connection on the ESXi host. If virtual serial ports are needed be sure
    they are configured to use secure protocols.
  rationale: Serial ports are interfaces for connecting peripherals to the virtual machine. They are often used on physical
    systems to provide a direct, low-level connection to the console of a server. Serial ports allow for debug level access,
    which often does not have strong controls like logging or privileges.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.wssdk.apiref.doc/vim.vm.device.VirtualSerialPort.URIBackin
  - 2. http://kb.vmware.com/kb/2004954
  page_start: 85
  audit_raw: 'Check that no clear text protocols are configured:

     tcp - an unencrypted TCP connection (IPv4 or IPv6)

     tcp4 - an unencrypted TCP connection (IPv4 only)

     tcp6 - an unencrypted TCP connection (IPv6 only)

     telnet telnet over TCP without SSL. The virtual machine and remote system can

    negotiate and use SSL if the remote system supports the telnet authentication

    option. If not, the connection uses unencrypted text (plain text)

    Only these secure protocols should be configured:

     ssl - the equivalent of TCP+SSL

     tcp+ssl - SSL over TCP over IPv4 or IPv6

     tcp4+ssl - SSL over TCP over IPv4

     tcp6+ssl - SSL over TCP over IPv6

     telnet over TCP with SSL. The virtual machine and remote system can negotiate and

    use SSL if the remote system supports the telnet authentication option. If not, the

    connection uses unencrypted text (plain text)

     telnets - telnet over SSL over TCP. In this case, SSL negotiation begins immediately

    and you cannot use the telnet authentication option.'
  remediation: 'Configuring Virtual Serial Port Communications with Secure Network Protocols:

     ssl - the equivalent of TCP+SSL

     tcp+ssl - SSL over TCP over IPv4 or IPv6

     tcp4+ssl - SSL over TCP over IPv4

     tcp6+ssl - SSL over TCP over IPv6

     telnet over TCP with SSL. The virtual machine and remote system can negotiate and

    use SSL if the remote system supports the telnet authentication option. If not, the

    connection uses unencrypted text (plain text)

     telnets - telnet over SSL over TCP. In this case, SSL negotiation begins immediately

    and you cannot use the telnet authentication option.'
  checks:
  - type: manual_review
    info: 'Check that no clear text protocols are configured:

