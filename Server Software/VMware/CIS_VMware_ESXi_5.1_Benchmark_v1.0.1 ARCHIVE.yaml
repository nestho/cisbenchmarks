- id: 8.4.24
  title: Disable VM Monitor Control
  scoring: scored
  profile:
  - Level 2
  description: Disable VM Monitor Control.
  rationale: When Virtual Machines are running on a hypervisor they are "aware" that they are running in a virtual environment
    and this and this information is available to tools inside the guest OS. This can give attackers information about the
    platform that they are running on that they may not get from a normal physical server. This option completely disables
    all hooks for a virtual machine and the guest OS will not be aware that it is running in a virtual environment at all.
  impact: This configuration option may cause unexpected results, the virtual machine will be completely unaware that it is
    running in a virtualized setting. VMware tools will not install or function.
  references:
  - 1. http://www.vmware.com/files/xls/hardeningguide-vsphere5-1-ga-releasepublic.xlsx
