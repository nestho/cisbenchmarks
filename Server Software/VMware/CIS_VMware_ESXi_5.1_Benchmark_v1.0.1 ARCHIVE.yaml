  description: When installing VMware tools, it can sometimes require a reboot to finalize the installation. If you choose
    the auto install option it will reboot the system without notice if one is required.
  rationale: VMware Tools auto install can initiate an automatic reboot, disabling this option will prevent tools from being
    installed automatically and prevent automatic machine reboots.
