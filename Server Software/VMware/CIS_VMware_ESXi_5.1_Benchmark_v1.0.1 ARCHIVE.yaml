- id: 7.3.3
  title: Ensure that the vSwitch Promiscuous Mode policy is set to reject
  scoring: scored
  profile:
  - Level 1
  description: Ensure that the Promiscuous Mode Policy within the vSwitch is set to reject.
  rationale: When promiscuous mode is enabled for a virtual switch all virtual machines connected to the dvPortgroup have
    the potential of reading all packets crossing that network. Promiscuous mode is disabled by default on the ESXi Server,
    and this is the recommended setting. However, there might be a legitimate reason to enable it for debugging, monitoring
    or troubleshooting reasons. Security devices might require the ability to see all packets on a vSwitch. An exception should
    be made for the dvPortgroups that these applications are connected to, in order to allow for full-time visibility to the
    traffic on that dvPortgroup.
  impact: Security devices that require the ability to see all packets on a vSwitch will not operate properly if the Promiscuous
    Mode parameter is set to Reject.
  references:
  - 1. http://kb.vmware.com/kb/1004099
  page_start: 68
  audit_raw: "Verify by using the vSphere Client to connect to the vCenter Server and as administrator:\n1. Go to \"Home >\
    \ Inventory > Hosts and clusters\".\n2. Select each ESXi host with active virtual switches connected to active VM's requiring\n\
    securing.\n3. Go to tab \"Configuration > Network > vSwitch name > Properties > Ports > vSwitch >\nDefault Policies >\
    \ Security\"\n4. Ensure \"Promiscuous Mode\" is set to \"Reject\"\n Additionally, the following PowerCLI command may be\
    \ used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select VMHost, Name, `\n@{N=\"\
    MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) { \"Accept\" }\nElse { \"Reject\"} }}, `\n@{N=\"\
    PromiscuousMode\";E={if ($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) {\n\"Accept\" } Else { \"Reject\"} }},\
    \ `\n@{N=\"ForgedTransmits\";E={if ($_.ExtensionData.Spec.Policy.Security.ForgedTransmits) {\n\"Accept\" } Else { \"Reject\"\
    } }}"
  remediation: 'Using the vSphere Client, connect to the vCenter Server and as administrator:

    1. Go to "Home > Inventory > Hosts and clusters".

    2. Select each ESXi host with active virtual switches connected to active VM''s requiring

    securing.

    3. Go to tab "Configuration > Network > vSwitch name > Properties > Ports > vSwitch >

    Default Policies > Security"

    4. Set "Promiscuous Mode" = "Reject"

    Additionally, perform the following to implement the recommended configuration state via

    the ESXi shell:

    # esxcli network vswitch standard policy security set -v vSwitch2 -p false'
