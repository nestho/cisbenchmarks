- id: 8.5.1
  title: Prevent virtual machines from taking over resources
  scoring: scored
  profile:
  - Level 2
  description: Use limits, shares, and reservations to prevent virtual machines from taking over resources.
  rationale: By default, all virtual machines on an ESXi host share the resources equally. By using the resource management
    capabilities of ESXi, such as shares and limits, you can control the server resources that a virtual machine consumes.
    You can use this mechanism to prevent a denial of service that causes one virtual machine to consume so much of the host's
    resources that other virtual machines on the same host cannot perform their intended functions.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere-50/topic/com.vmware.ICbase/PDF/vsphereesxi-vcenter-server-50-resource-management-guide.pdf
  page_start: 121
  audit_raw: 'Use shares or reservations to guarantee resources to critical VMs. Use limits to constrain

    resource consumption by virtual machines that have a greater risk of being exploited or

    attacked, or that run applications that are known to have the potential to greatly consume

    resources.

    Additionally, the following PowerCLI command may be used:

    # List all Resource shares on all VMs

    Get-VM | Get-VMResourceConfiguration'
  remediation: ' Use shares or reservations to guarantee resources to critical VMs.

     Use limits to constrain resource consumption by virtual machines that have a

    greater risk of being exploited or attacked, or that run applications that are known

    to have the potential to greatly consume resources.'
  checks:
  - type: manual_review
    info: 'Use shares or reservations to guarantee resources to critical VMs. Use limits to constrain

      resource consumption by virtual machines that have a greater risk of being exploited or

