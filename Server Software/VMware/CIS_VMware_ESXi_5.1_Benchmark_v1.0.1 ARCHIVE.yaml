- id: 7.3.1
  title: Ensure that the vSwitch Forged Transmits policy is set to reject
  scoring: scored
  profile:
  - Level 1
  description: Set the vSwitch Forged Transmits policy is set to reject for each vSwitch.
  rationale: If the virtual machine operating system changes the MAC address, the operating system can send frames with an
    impersonated source MAC address at any time. This allows an operating system to stage malicious attacks on the devices
    in a network by impersonating a network adaptor authorized by the receiving network. Forged transmissions should be set
    to accept by default. This means the virtual switch does not compare the source and effective MAC addresses. To protect
    against MAC address impersonation, all virtual switches should have forged transmissions set to reject.
  impact: This will prevent VMs from changing their effective MAC address. This will affect applications that require this
    functionality. An example of an application like this is Microsoft Clustering, which requires systems to effectively share
    a MAC address. This will also affect how a layer 2 bridge will operate. This will also affect applications that require
    a specific MAC address for licensing. An exception should be made for the port groups that these applications are connected
    to.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.networking.doc/GUID-74E2059A-CC5E-4B06-81B53881C80E46CE.html
  page_start: 65
  audit_raw: 'Verify by using the vSphere Client to connect to the vCenter Server and as administrator:

    1. Go to "Home > Inventory > Hosts and clusters".

    2. Select each ESXi host with active virtual switches connected to active VM''s requiring

    securing.

    3. Go to tab "Configuration > Network > vSwitch(?) > Properties > Ports > vSwitch >

    Default Policies > Security"

    4. Ensure "Forged Transmits" is set to "Reject"

    Additionally, the following PowerCLI command may be used:

    # List all vSwitches and their Security Settings

    Get-VirtualSwitch -Standard | Select VMHost, Name, `

    @{N="MacChanges";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) { "Accept" }

    Else { "Reject"} }}, `

    @{N="PromiscuousMode";E={if ($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) {

    "Accept" } Else { "Reject"} }}, `

    @{N="ForgedTransmits";E={if ($_.ExtensionData.Spec.Policy.Security.ForgedTransmits) {

    "Accept" } Else { "Reject"} }}'
  remediation: 'Verify by using the vSphere Client to connect to the vCenter Server and as administrator:

    1. Go to "Home > Inventory > Hosts and clusters".

    2. Select each ESXi host with active virtual switches connected to active VM''s requiring

    securing.

    3. Go to tab "Configuration > Network > vSwitch(?) > Properties > Ports > vSwitch >

    Default Policies > Security"

    4. Set "Forged Transmits" to "Reject"

    Additionally, the following ESXi shell command may be used:

    # esxcli network vswitch standard policy security set -v vSwitch2 -f false'
  checks:
  - type: manual_review
    info: 'Verify by using the vSphere Client to connect to the vCenter Server and as administrator:

