- id: 8.4.2
  title: Control VMsafe Agent Address
  scoring: scored
  profile:
  - Level 1
  description: Configure the vmsafe.agentAddress option in the virtual machine configuration file correctly.
  rationale: 'The VMsafe CPU/memory API allows a security virtual machine to inspect and modify the contents of the memory
    and CPU registers on other VMs, for the purpose of detecting and preventing malware attacks. However, an attacker might
    compromise the VM by making use of this introspection channel; therefore you should monitor for unauthorized usage of
    this API. A VM must be configured explicitly to accept access by the VMsafe CPU/memory API. This involves three parameters
    to perform the following: 1. Enable the API 2. Set the IP address used by the security virtual appliance on the introspection
    vSwitch 3. Set the port number for that IP address. If the VM is being protected by such a product, then make sure the
    latter two parameters are set correctly. This should be done only for specific VMs for which you want this protection.'
  impact: Incorrectly configuring this option can negatively impact functionality of tools that use VMsafe API.
  references:
  - 1. http://kb.vmware.com/kb/1714
  - 2. http://www.vmware.com/files/xls/hardeningguide-vsphere5-1-ga-releasepublic.xlsx
  page_start: 89
  audit_raw: 'If the VM is not being protected by a VMsafe CPU/memory product, then check virtual

    machine configuration file and verify that vmsafe.agentAddress is not present.

    If it is being protected by a VMsafe CPU/Memory product then make sure the

    vmsafe.agentAddress is set to the correct value.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "vmsafe.agentAddress" | Select Entity, Name, Value'
  remediation: 'If the VM is not being protected by a VMsafe CPU/memory product, then check virtual

    machine configuration file and verify that vmsafe.agentAddress is not present.

    If it is being protected by a VMsafe CPU/Memory product then make sure this is set to the

    correct value'
  checks:
  - type: manual_review
    info: 'If the VM is not being protected by a VMsafe CPU/memory product, then check virtual

      machine configuration file and verify that vmsafe.agentAddress is not present.

      If it is being protected by a VMsafe CPU/Memory product then make sure the

      vmsafe.agentAddress is set to the correct value.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "vmsafe.agentAddress" | Select Entity, Name, Value'
    severity: medium
