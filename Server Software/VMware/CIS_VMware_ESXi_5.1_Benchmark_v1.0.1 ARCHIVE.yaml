- id: 8.3.4
  title: Use templates to deploy VMs whenever possible
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Use a hardened base operating system template image to create other, application-specific templates and use
    the application-specific templates to deploy virtual machines. Configure VMs protected by dvfilter network APIs correctly.
  rationale: By capturing a hardened base operating system image (with no applications installed) in a template, you can ensure
    that all your virtual machines are created with a known baseline level of security. You can then use this template to
    create other, application-specific templates, or you can use the application template to deploy virtual machines. Manual
    installation of the OS and applications into a VM introduces the risk of misconfiguration due to human or process error.
    A VM must be configured explicitly to accept access by the dvfilter network API. This should be done only for VMs for
    which you want this to be done. An attacker might compromise the VM by making use of this introspection channel.
  impact: Incorrectly configuring this option can negatively impact functionality of tools that use vmsafe API. Incorrectly
    configuring this option can prevent VMs from connecting to the network.
  references:
  - 1. http://pubs.vmware.com/vsphere51/topic/com.vmware.vsphere.vm_admin.doc/GUID-9062F225-E01B-42BA-8AFB8EA4069068FE.html
  - 1. http://kb.vmware.com/kb/1714
  - 2. http://kb.vmware.com/kb/1028151
  page_start: 86
  audit_raw: 'Verify that new virtual machine deployments are completed using hardened, patched, and

    properly configured OS  templates.

    If a VM is supposed to be protected:

     Verify that the following in its VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter
    interface of the virtual machine

    that is to be protected, filter1 is the number of the filter that is being used, and dvfilter1 is the name of the particular
    data path kernel module that is protecting the

    VM.

     Ensure that the name of the data path kernel is set correctly.

    If a VM is not supposed to be protected:

     Verify that the following is not in its VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network
    adapter interface of the virtual machine

    that is to be protected, filter1 is the number of the filter that is being used, and dvfilter1 is the name of the particular
    data path kernel module that is protecting the

    VM.'
  remediation: 'Provide templates for VM creation that contain hardened, patched, and properly configured

    OS deployments. If possible, pre-deploy applications in templates as well, although care

    should be taken that the application doesn''t depend upon VM-specific information to be

    deployed. In vSphere, you can convert a template to a virtual machine and back again

    quickly, which makes updating templates quite easy.

    If a VM is supposed to be protected:

     Configure the following in its VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter interface
    of the virtual machine

    that is to be protected, filter1 is the number of the filter that is being used, and dvfilter1 is the name of the particular
    data path kernel module that is protecting the

    VM.

     Ensure that the name of the data path kernel is set correctly.

    If a VM is not supposed to be protected:

     Remove the following from its VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter interface
    of the virtual machine

    that is to be protected, filter1 is the number of the filter that is being used, and dvfilter1 is the name of the particular
    data path kernel module that is protecting the

    VM.'
  checks:
  - type: manual_review
    info: 'Verify that new virtual machine deployments are completed using hardened, patched, and

