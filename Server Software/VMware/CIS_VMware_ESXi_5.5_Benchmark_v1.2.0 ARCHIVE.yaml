controls:
- id: 8.1.1
  title: Limit informational messages from the VM to the VMX file
  scoring: scored
  profile:
  - Level 1
  description: Limit informational messages from the virtual machine to the VMX file to avoid filling the datastore and causing
    a Denial of Service (DoS).
  rationale: The configuration file containing these name-value pairs is limited to a size of 1MB. This 1MB capacity should
    be sufficient for most cases, but you can change this value if necessary. You might increase this value if large amounts
    of custom information are being stored in the configuration file. The default limit is 1MB; this limit is applied even
    when the sizeLimit parameter is not listed in the .vmx file. Uncontrolled size for the VMX file can lead to denial of
    service if the datastore is filled.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.vm_admin.doc/GUID-685722FA-9009-439C-914218A9E7C592EA.html
  page_start: 67
  audit_raw: 'Check virtual machine configuration file and verify that tools.setInfo.sizeLimit is set to

    1048576.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "tools.setInfo.sizeLimit" | Select Entity, Name,

    Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "tools.setInfo.sizeLimit" -value 1048576

    Page | 67'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that tools.setInfo.sizeLimit is set to

      1048576.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "tools.setInfo.sizeLimit" | Select Entity, Name,

      Value'
    severity: medium
- id: 8.1.2
  title: Limit sharing of console connections
  scoring: scored
  profile:
  - Level 2
  description: Limit the max number of console connections to prevent non-administrators from observing the VMs screen.
  rationale: By default, remote console sessions can be connected to by more than one user at a time. When multiple sessions
    are activated, each terminal window gets a notification about the new session. If an administrator in the VM logs in using
    a VMware remote console during their session, a non-administrator in the VM can connect to the console and observe the
    administrator's actions. Also, this could result in an administrator losing console access to a virtual machine. For example,
    if a jump box is being used for an open console session, and the admin loses connection to that box, then the console
    session remains open. Allowing two console sessions permits debugging via a shared session. For highest security, only
    one remote console session at a time should be allowed.
  impact: Only one remote console connection to the VM will be permitted. Other attempts will be rejected until the first
    session disconnects.
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vcli.examples.doc/cli_manage_vms.10.4.html
  - 2. http://www.ibenit.com/post/85227299008/security-benchmark-hardening-guidepolicies-and-profile
  page_start: 68
  audit_raw: 'Check virtual machine configuration file and verify that RemoteDisplay.maxConnections is

    set to 1.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select Entity,

    Name, Value'
  remediation: 'Page | 68

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "RemoteDisplay.maxConnections" -value 1'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that RemoteDisplay.maxConnections is

      set to 1.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select Entity,

      Name, Value'
    severity: medium
- id: 8.2.1
  title: Disconnect unauthorized devices - Floppy Devices
  scoring: scored
  profile:
  - Level 2
  description: Any enabled or connected device represents a potential attack channel. Users and processes without privileges
    on a virtual machine can connect or disconnect hardware devices, such as network adapters and CD-ROM drives. Attackers
    can use this capability to breach virtual machine security. Removing unnecessary hardware devices can help prevent attacks.
  rationale: 'Ensure that no device is connected to a virtual machine if it is not required. For example, serial and parallel
    ports are rarely used for virtual machines in a datacenter environment, and CD/DVD drives are usually connected only temporarily
    during software installation. For less commonly used devices that are not required, either the parameter should not be
    present or its value must be FALSE. NOTE: The parameters listed are not sufficient to ensure that a device is usable;
    other parameters are required to indicate specifically how each device is instantiated. Any enabled or connected device
    represents another potential attack channel.'
  impact: Virtual machine will need to be powered off to reverse change if any of these devices are needed at a later time.
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-822B2ED3-D8D2-4F57-8335CA46E915A729.html
  page_start: 70
  audit_raw: 'The following parameters should either NOT be present or should be set to FALSE, unless

    Floppy drives are required: floppyX.present

    Additionally, the following PowerCLI command may be used:

    # Check for Floppy Devices attached to VMs

    Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState'
  remediation: 'Page | 70

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # Remove all Floppy drives attached to VMs

    Get-VM | Get-FloppyDrive | Remove-FloppyDrive'
  checks:
  - type: manual_review
    info: 'The following parameters should either NOT be present or should be set to FALSE, unless

      Floppy drives are required: floppyX.present

      Additionally, the following PowerCLI command may be used:

      # Check for Floppy Devices attached to VMs

      Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState'
    severity: medium
