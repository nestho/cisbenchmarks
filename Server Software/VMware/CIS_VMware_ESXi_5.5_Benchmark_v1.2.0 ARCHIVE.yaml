- id: 8.7.4
  title: Limit VM log file size
  scoring: scored
  profile:
  - Level 1
  description: Configure VM settings to prevent uncontrolled logging. Virtual machines write troubleshooting information into
    a virtual machine log file stored on the VMFS volume. Virtual machine users and processes can abuse logging either on
    purpose or inadvertently so that large amounts of data flood the log file. Over time, the log file can consume enough
    file system space to cause a denial of service.
  rationale: You can use log settings to limit the total size and number of log files. Normally a new log file is created
    only when a host is rebooted, so the file can grow to be quite large. You can ensure that new log files are created more
    frequently by limiting the maximum size of the log files. If you want to restrict the total size of logging data, VMware
    recommends saving 10 log files, each one limited to 1,000KB (1,024,000 bytes). Datastores are likely to be formatted with
    a block size of 2MB or 4MB, so a size limit too far below this size would result in unnecessary storage utilization. Each
    time an entry is written to the log, the size of the log is checked; if it is over the limit, the next entry is written
    to a new log. If the maximum number of log files already exists, when a new one is created, the oldest log file is deleted.
    A denial-of-service attack that avoids these limits might be attempted by writing an enormous log entry. But each log
    entry is limited to 4KB, so no log files are ever more than 4KB larger than the configured limit. A second option is to
    disable logging for the virtual machine. Disabling logging for a virtual machine makes troubleshooting challenging and
    support difficult. You should not consider disabling logging unless the log file rotation Page | 130 approach proves insufficient.
    Uncontrolled logging can lead to denial of service due to the datastores being filled.
  impact: A more extreme strategy is to disable logging altogether for the virtual machine. Disabling logging makes troubleshooting
    challenging and support difficult. Do not consider disabling logging unless the log file rotation approach proves insufficient.
  references:
  - 1. http://kb.vmware.com/kb/8182749
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-F465D340-6556-49E8-B137C0B4A060E83B.html
