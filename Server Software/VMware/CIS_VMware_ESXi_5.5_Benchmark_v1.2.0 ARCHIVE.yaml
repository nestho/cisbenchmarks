- id: 8.4.21
  title: Disable Host Guest File System Server
  scoring: scored
  profile:
  - Level 2
  description: Disable unexposed Host Guest File System Server.
  rationale: Certain automated operations such as automated tools upgrades use a component into the hypervisor called Host
    Guest File System (HGFS) and an attacker could potentially use this to transfer files inside the guest OS. These VMX parameters
    don't apply on vSphere because VMware virtual machines work on vSphere and hosted virtualization platforms such as Workstation
    and Fusion. The code paths for these features are not implemented in ESXi. Explicitly disabling these features reduces
    the potential for vulnerabilities because it reduces the number of ways in which a guest can affect the host. Note that
    these are referenced for organizations that insist any documented setting, regardless of whether it is implemented in
    code or not, must have a value.
  impact: This will cause the VMX process to not respond to commands from the tools process. It may also have a negative impact
    on operations such as automated tools upgrades. Setting isolation.tools.hgfsServerSet.disable to TRUE disables the registration
    of the guest's HGFS server with the host. APIs that use HGFS to transfer files to and from the guest operating system,
    such as some VIX commands or the VMware Tools auto-upgrade utility, will not function.
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-60E83710-8295-41A2-9C9D83DEBB6872C2.html
