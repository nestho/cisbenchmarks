- id: 8.2.6
  title: Prevent unauthorized removal and modification of devices.
  scoring: scored
  profile:
  - Level 1
  description: Prevent unauthorized removal and modification of devices.
  rationale: 'In a virtual machine, users and processes without root or administrator privileges can connect or disconnect
    devices, such as network adaptors and CD-ROM drives, and can modify device settings. Use the virtual machine settings
    editor or configuration editor to remove unneeded or unused hardware devices. If you want to use the device again, you
    can prevent a user or running process in the virtual machine from connecting, disconnecting, or modifying a device from
    within the guest operating system. By default, a rogue user with nonadministrator privileges in a virtual machine can:
    • - Connect a disconnected CD-ROM drive and access sensitive information on the media left in the drive - Disconnect a
    network adaptor to isolate the virtual machine from its network, which is a denial of service - Modify settings on a device'
  impact: Device interaction is blocked inside the guest OS using VMware tools.
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.vm_admin.doc/GUID-685722FA-9009-439C-914218A9E7C592EA.html
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-F88A5FED-552B-44F9-A168C62D9306DBD6.html
  page_start: 77
  audit_raw: 'Check virtual machine configuration file and verify that isolation.device.edit.disable

    is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.edit.disable" | Select Entity,

    Name, Value'
  remediation: 'Page | 77

    To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.device.edit.disable" -value $true'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that isolation.device.edit.disable

      is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "isolation.device.edit.disable" | Select Entity,

      Name, Value'
    severity: medium
- id: 8.2.7
  title: Prevent unauthorized connection of devices.
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Prevent unauthorized connection of devices. Reduce the number of potential attack vectors by disabling unnecessary
    system components that are not needed to support the application or service running on the virtual machine.
  rationale: 'In a virtual machine, users and processes without root or administrator privileges can connect or disconnect
    devices, such as network adaptors and CD-ROM drives, and can modify device settings. Use the virtual machine settings
    editor or configuration editor to remove unneeded or unused hardware devices. If you want to use the device again, you
    can prevent a user or running process in the virtual machine from connecting, disconnecting, or modifying a device from
    within the guest operating system. By default, a rogue user with non-administrator privileges in a virtual machine can:
    •  Connect a disconnected CD-ROM drive and access sensitive information on the media left in the drive Page | 78  Disconnect
    a network adaptor to isolate the virtual machine from its network, which is a denial of service  Modify settings on a
    device By disabling unnecessary system components that are not needed to support the application or service running on
    the system, you reduce the number of parts that can be attacked. VMs often don''t require as many services or functions
    as ordinary physical servers; so when virtualizing, you should evaluate whether a particular service or function is truly
    needed. Any service running in a VM provides a potential avenue of attack.'
  impact: Device interaction is blocked inside the guest OS using VMware tools
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.vm_admin.doc/GUID-685722FA-9009-439C-914218A9E7C592EA.html
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-F88A5FED-552B-44F9-A168C62D9306DBD6.html
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-6BFA8CA7-610F-4E6B-9FC6D656917B7E7A.html
  page_start: 78
  audit_raw: 'Check virtual machine configuration file and verify

    that isolation.device.connectable.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.connectable.disable" | Select

    Entity, Name, Value

    Verify the following are disabled:

    1. Unused services in the operating system. For example, if the system runs a file

    server, make sure to turn off any Web services.

    2. Unused physical devices, such as CD/DVD drives, floppy drives, and USB adaptors.

    This is described in the Removing Unnecessary Hardware Devices section in the

    ESXI Configuration Guide.

    3. Screen savers. X-Windows if using a Linux, BSD, or Solaris guest operating system.'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.device.connectable.disable" -value $true

    Some of these steps include:

    1. Disable unused services in the operating system. For example, if the system runs a

    file server, make sure to turn off any Web services.

    2. Disconnect unused physical devices, such as CD/DVD drives, floppy drives, and USB

    adaptors. This is described in the Removing Unnecessary Hardware Devices section

    in the ESXI Configuration Guide.

    Page | 80

    3. Turn off any screen savers. If using a Linux, BSD, or Solaris guest operating system,

    do not run the X Window system unless it is necessary.'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify

      that isolation.device.connectable.disable is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "isolation.device.connectable.disable" | Select

      Entity, Name, Value

      Verify the following are disabled:

      1. Unused services in the operating system. For example, if the system runs a file

      server, make sure to turn off any Web services.

      2. Unused physical de'
    severity: medium
- id: 8.3.2
  title: Minimize use of the VM console
  scoring: scored
  profile:
  - Level 1
  description: Grant access to the Virtual Machine console only when needed. Use custom roles to provide fine grained permissions.
  rationale: The VM console enables you to connect to the console of a virtual machine, in effect seeing what a monitor on
    a physical server would show. The VM console also provides power management and removable device connectivity controls,
    which might potentially allow a malicious user to bring down a virtual machine. In addition, it also has a performance
    impact on the service console, especially if many VM console sessions are open simultaneously.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-41E5E52E-A95B-4E81-97246AD6800BEF78.html
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-3D47149A-947D-4608-88B3E5811129EFA8.html
  page_start: 81
  audit_raw: 'Instead of VM console, use native remote management services, such as terminal services

    and ssh, to interact with virtual machines. Grant VM console access only when necessary.

    1. From the vSphere Client, select an object in the inventory.

    2. Click the Permissions tab to view the user and role pair assignments for that object.

    3. Next, navigate to Administration\Roles section of vCenter.

    4. Select the role in question and choose edit to see which effective privileges are

    enabled.

    5. Only Authorized users should have a role which allows them a privilege under the

    Virtual Machine\Interaction section of the role editor.'
  remediation: 'Page | 81

    By default the vCenter roles "Virtual Machine Power User" and "Virtual Machine

    Administrator" have the "Virtual Machine.Interaction.Console Interaction" privilege. Do not

    allow unauthorized individuals to have these roles on a virtual machine or folder of virtual

    machines.

    1. From the vSphere Client, navigate to Administration\Roles section of vCenter.

    2. Create a custom role and choose edit to enable only the minimum needed effective

    privileges.

    3. Next, select an object in the inventory.

    4. Click the Permissions tab to view the user and role pair assignments for that object.

    5. Remove any default "Admin" or "Power User" roles and assign the new custom role

    as needed.'
  checks:
  - type: manual_review
    info: 'Instead of VM console, use native remote management services, such as terminal services

      and ssh, to interact with virtual machines. Grant VM console access only when necessary.

      1. From the vSphere Client, select an object in the inventory.

      2. Click the Permissions tab to view the user and role pair assignments for that object.

      3. Next, navigate to Administration\Roles section of vCenter.

      4. Select the role in question and choose edit to see which effective privileges are

      enabled.

      5. Only Authori'
    severity: medium
- id: 8.3.3
  title: Use secure protocols for virtual serial port access
  scoring: scored
  profile:
  - Level 1
  description: Virtual serial ports allow virtual machines to communicate over the network. Doing so allows you to redirect
    the virtual serial port connection to a TCP/IP connection on the ESXi host. If virtual serial ports are needed be sure
    they are configured to use secure protocols.
  rationale: Serial ports are interfaces for connecting peripherals to the virtual machine. They are often used on physical
    systems to provide a direct, low-level connection to the console of a server. Serial ports allow for debug level access,
    which often does not have strong controls like logging or privileges. Page | 82
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.wssdk.apiref.doc/vim.vm.device.VirtualSerialPort.URIBackin
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.wssdk.vsp.doc/virtual_serial_port_using_proxy_Chapter1.3.2.
  page_start: 82
  audit_raw: 'Check that no clear text protocols are configured:

     tcp - an unencrypted TCP connection (IPv4 or IPv6)

     tcp4 - an unencrypted TCP connection (IPv4 only)

     tcp6 - an unencrypted TCP connection (IPv6 only)

     telnet telnet over TCP without SSL. The virtual machine and remote system can

    negotiate and use SSL if the remote system supports the telnet authentication

    option. If not, the connection uses unencrypted text (plain text)

    Only these secure protocols should be configured:

     ssl - the equivalent of TCP+SSL

     tcp+ssl - SSL over TCP over IPv4 or IPv6

     tcp4+ssl - SSL over TCP over IPv4

     tcp6+ssl - SSL over TCP over IPv6

     telnet over TCP with SSL. The virtual machine and remote system can negotiate and

    use SSL if the remote system supports the telnet authentication option. If not, the

    connection uses unencrypted text (plain text)

     telnets - telnet over SSL over TCP. In this case, SSL negotiation begins immediately

    and you cannot use the telnet authentication option.'
  remediation: 'Configuring Virtual Serial Port Communications with Secure Network Protocols:

     ssl - the equivalent of TCP+SSL

     tcp+ssl - SSL over TCP over IPv4 or IPv6

     tcp4+ssl - SSL over TCP over IPv4

     tcp6+ssl - SSL over TCP over IPv6

     telnet over TCP with SSL. The virtual machine and remote system can negotiate and

    use SSL if the remote system supports the telnet authentication option. If not, the

    connection uses unencrypted text (plain text)

     telnets - telnet over SSL over TCP. In this case, SSL negotiation begins immediately

    and you cannot use the telnet authentication option.'
  checks:
  - type: manual_review
    info: 'Check that no clear text protocols are configured:

       tcp - an unencrypted TCP connection (IPv4 or IPv6)

