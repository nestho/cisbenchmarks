- id: 8.7.2
  title: Limit number of VM log files
  scoring: scored
  profile:
  - Level 1
  description: Configure VM settings to prevent uncontrolled logging.
  rationale: You can use log settings to limit the total size and number of log files. Normally a new log file is created
    only when a host is rebooted, so the file can grow to be quite large. You can ensure that new log files are created more
    frequently by limiting the maximum size of the Page | 127 log files. If you want to restrict the total size of logging
    data, VMware recommends saving 10 log files, each one limited to 1,000KB. Datastores are likely to be formatted with a
    block size of 2MB or 4MB, so a size limit too far below this size would result in unnecessary storage utilization. Each
    time an entry is written to the log, the size of the log is checked; if it is over the limit, the next entry is written
    to a new log. If the maximum number of log files already exists, when a new one is created, the oldest log file is deleted.
    A denial-of-service attack that avoids these limits might be attempted by writing an enormous log entry. But each log
    entry is limited to 4KB, so no log files are ever more than 4KB larger than the configured limit. A second option is to
    disable logging for the virtual machine. Disabling logging for a virtual machine makes troubleshooting challenging and
    support difficult. You should not consider disabling logging unless the log file rotation approach proves insufficient.
    Uncontrolled logging can lead to denial of service due to the datastore's being filled.
  impact: A more extreme strategy is to disable logging altogether for the virtual machine. Disabling logging makes troubleshooting
    challenging and support difficult. Do not consider disabling logging unless the log file rotation approach proves insufficient.
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.vm_admin.doc/GUID-685722FA-9009-439C-914218A9E7C592EA.html
  - 2. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-D8ABEF05-D304-40CA-8B59D62510BE63C9.html
  page_start: 127
