- id: 8.4.5
  title: Disable Autologon
  scoring: scored
  profile:
  - Level 2
  description: Disable unneeded autologon to reduce the potential for vulnerabilities.
  rationale: Some VMX parameters don't apply on vSphere because VMware virtual machines work on vSphere and hosted virtualization
    platforms such as Workstation and Fusion. The code paths for these features are not implemented in ESXi. Explicitly disabling
    these features reduces the potential for vulnerabilities because it reduces the number of ways in which a guest can affect
    the host. Note that these are referenced for organizations that insist any documented setting, regardless of whether it
    is implemented in code or not, must have a value.
  impact: ''
  references:
  - 1. http://pubs.vmware.com/vsphere55/topic/com.vmware.vsphere.security.doc/GUID-60E83710-8295-41A2-9C9D83DEBB6872C2.html
  page_start: 91
  audit_raw: 'Check virtual machine configuration file and verify that

    isolation.tools.ghi.autologon.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable"| Select

    Entity, Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    Page | 91

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable" -value

    $true'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that

