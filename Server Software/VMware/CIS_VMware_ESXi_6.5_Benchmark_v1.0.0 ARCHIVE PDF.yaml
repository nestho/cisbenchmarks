- id: 8.4.5
  title: (L2) Ensure Autologon is disabled
  scoring: scored
  profile:
  - Level 2
  description: Autologon should be disabled if it is not needed.
  rationale: Some VMX parameters don't apply on vSphere because VMware virtual machines work on vSphere and hosted virtualization
    platforms such as Workstation and Fusion. The code paths for these features are not implemented in ESXi. Explicitly disabling
    these features, such as autologon, reduces the potential for vulnerabilities because it reduces the number of ways in
    which a guest can affect the host. Note that these are referenced for organizations that insist any documented setting,
    regardless of whether it is implemented in code or not, must have a value.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.5/com.vmware.vsphere.security.doc/GUID-60E83710-8295-41A2-9C9D83DEBB6872C2.html
  page_start: 127
  audit_raw: 'To verify that autologon is disabled if not needed, check the virtual machine configuration

    file and verify that isolation.tools.ghi.autologon.disable is set to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable"|

    Select Entity, Name, Value'
  remediation: 'To disable autologon, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable" -

    value $true'
  checks:
  - type: manual_review
    info: 'To verify that autologon is disabled if not needed, check the virtual machine configuration

      file and verify that isolation.tools.ghi.autologon.disable is set to TRUE.

