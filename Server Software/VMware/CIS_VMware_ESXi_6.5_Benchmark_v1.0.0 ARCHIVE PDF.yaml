      Select Entity, Name, Value'
    severity: medium
- id: 8.6.3
  title: (L1) Ensure virtual disk wiping is disabled
  scoring: scored
  profile:
  - Level 1
  description: Wiping a virtual disk reclaims all unused space in it. If there is empty space in the disk, this process reduces
    the amount of space the virtual disk occupies on the host drive. If virtual disk wiping is done repeatedly, it can cause
    the virtual disk to become unavailable while wiping occurs. In most datacenter environments, disk wiping is not needed,
