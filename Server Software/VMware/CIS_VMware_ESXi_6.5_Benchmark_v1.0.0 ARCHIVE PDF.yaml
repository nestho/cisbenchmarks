- id: 8.7.1
  title: (L2) Ensure VIX messages from the VM are disabled
  scoring: scored
  profile:
  - Level 2
  description: The VIX API is a library for writing scripts and programs to manipulate virtual machines. If you do not make
    use of custom VIX programming in your environment, then you should disable certain features, such as the ability to send
    messages from the VM to the host. Disabling that feature does not adversely affect the functioning of VIX operations that
    originate outside the guest, so certain VMware and third-party solutions that rely upon this capability should continue
    to work. This is a deprecated interface.
  rationale: Disabling unneeded features reduces the potential for vulnerabilities.
  impact: ''
  references:
