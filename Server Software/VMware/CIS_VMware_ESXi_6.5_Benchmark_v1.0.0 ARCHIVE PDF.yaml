- id: 8.2.6
  title: (L1) Ensure unauthorized modification and disconnection of devices is disabled
  scoring: scored
  profile:
  - Level 1
  description: In a virtual machine, users and processes without root or administrator privileges can disconnect devices,
    such as network adapters and CD-ROM drives, and modify device settings within the guest operating system. These actions
    should be prevented.
  rationale: Disabling unauthorized modification and disconnection of devices helps prevents unauthorized changes within the
    guest operating system, which could be used to gain unauthorized access, cause denial of service conditions, and otherwise
    negatively affect the security of the guest operating system.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.5/com.vmware.vsphere.security.doc/GUID-F88A5FED-552B-44F9A168-C62D9306DBD6.html
  page_start: 107
  audit_raw: 'To verify unauthorized device modifications and disconnections are prevented, access the

    virtual machine configuration file and verify that isolation.device.edit.disable is set to

    TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.device.edit.disable" | Select

    Entity, Name, Value'
  remediation: 'To prevent unauthorized device modifications and disconnections, run the following

    PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.device.edit.disable" -value

    $true'
  checks:
  - type: manual_review
    info: 'To verify unauthorized device modifications and disconnections are prevented, access the

