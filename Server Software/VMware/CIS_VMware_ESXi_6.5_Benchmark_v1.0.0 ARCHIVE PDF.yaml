controls:
- id: 8.4.29
  title: (L2) Ensure all but VGA mode on virtual machines is disabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  - Level 1
  description: 'VMware Update Manager is a tool used to automate patch management for vSphere hosts and virtual machines.
    Creating a baseline for patches is a good way to ensure all hosts are at the same patch level. VMware also publishes advisories
    on security patches and offers a way to subscribe to email alerts for them. A VIB (vSphere Installation Bundle) is a collection
    of files that are packaged into an archive. The VIB contains a signature file that is used to verify the level of trust.
    The ESXi Image Profile supports four VIB acceptance levels: 1. VMware Certified - VIBs created, tested, and signed by
    VMware 2. VMware Accepted - VIBs created by a VMware partner but tested and signed by VMware 3. Partner Supported - VIBs
    created, tested, and signed by a certified VMware partner 4. Community Supported - VIBs that have not been tested by VMware
    or a VMware partner ESXi hosts by default do not permit the loading of kernel modules that lack valid digital signatures.
    This feature can be overridden, which would allow unauthorized kernel modules to be loaded. Network Time Protocol (NTP)
    synchronization should be configured correctly and enabled on each VMware ESXi host to ensure accurate time for system
    event logs. The time sources used by the ESXi hosts should be in sync with an agreed-upon time standard such as Coordinated
    Universal Time (UTC). There should be at minimum two NTP sources in place, and they should sync whenever possible. The
    ESXi firewall is enabled by default and allows ping (ICMP) and communication with DHCP/DNS clients. Access to services
    should only be allowed by authorized IP addresses/networks. The Managed Object Browser (MOB) is a web-based server application
    that lets you examine objects that exist on the server side, explore the object model used by the VM kernel to manage
    the host, and change configurations. It is installed and started automatically when vCenter is installed. The default
    certificate is self-signed, not signed by a trusted certificate authority (CA). It should be replaced with a valid certificate
    issued by a trusted CA. Simple Network Management Protocol (SNMP) can be used to help manage hosts. Many organizations
    have other means in place of managing hosts and do not need SNMP enabled. If SNMP is needed, it should be configured properly
    to reduce the risk of misuse or compromise. For example, ESXi supports SNMPv3, which provides stronger security than SNMPv1
    or SNMPv2, including key authentication and encryption. It is also important to configure the destination for SNMP traps.
    The dvfilter network API is used by some products (e.g., VMSafe). If it is not in use, it should not be configured to
    send network information to a VM. By default, ESXi hosts do not have Certificate Revocation List (CRL) checking available,
    so expired and revoked SSL certificates must be checked and removed manually. The VMware vSphere Network Dump Collector
    service allows for collecting diagnostic information from a host that experiences a critical fault. This service provides
    a centralized location for collecting ESXi host core dumps. ESXi can be configured to store log files on an in-memory
    file system. This occurs when the host''s Syslog.global.LogDir property is set to a non-persistent location, such as /scratch.
    When this is done, only a single day''s worth of logs are stored at any time. Additionally, log files will be reinitialized
    upon each reboot. By default, ESXI logs are stored on a local scratch volume or ramdisk. To preserve logs, also configure
    remote logging to a central log host for the ESXI hosts. By default, each ESXi host has a single "root" admin account
    that is used for local administration and to connect the host to vCenter Server. Use of this shared account should be
    limited, and named (non-root) user accounts with admin privileges should be used instead. ESXi uses the pam_passwdqc.so
    plug-in to set password strength and complexity. Options include setting minimum password length, requiring password characters
    to come from particular character sets, and restricting the number of consecutive failed logon attempts permitted. The
    settings should enforce the organization''s password policies. Note that an uppercase character that begins a password
    does not count toward the number of character classes used, and neither does a number that ends a password. ESXi can be
    configured to use a directory service such as Active Directory to manage users and groups. It is recommended that a directory
    service be used. Note: If the AD group "ESX Admins" (default) is created, all users and groups that are members of this
    group will have full administrative access to all ESXi hosts in the domain. The AD group used by vSphere is defined by
    the esxAdminsGroup attribute. By default, this attribute is set to "ESX Admins". All members of the group are granted
    full administrative access to all ESXi hosts in the domain. Monitor AD for the creation of this group, and limit membership
    to highly trusted users and groups. Users who are added to the "Exception Users" list do not lose their permissions when
    the host enters lockdown mode. Usually you may want to add some service accounts, such as a backup agent, to the Exception
    Users list. Authentication should be configured so there is a maximum number of consecutive failed login attempts for
    each account, at which point the account at risk will be locked out. An account is automatically locked after the maximum
    number of failed consecutive login attempts is reached. The account should be automatically unlocked after 15 minutes,
    otherwise administrators will need to manually unlock accounts on request by authorized users. The Direct Console User
    Interface (DCUI) is used for directly logging into an ESXi host and carrying out host management tasks. This setting terminates
    an idle DCUI session after the specified number of seconds has elapsed. The Direct Console User Interface (DCUI) allows
    for low-level host configuration such as configuring IP address, hostname, and root password as well as diagnostic capabilities
    such as enabling the ESXi shell, viewing log files, restarting agents, and resetting configurations. The DCUI can be disabled
    to prevent any local administration from the host. Once the DCUI is disabled, any administration of the ESXi host must
    be done through vCenter. The ESXi shell is an interactive command line environment available from the Direct Console User
    Interface (DCUI) or remotely via SSH. The ESXi shell should only be enabled on a host when running diagnostics or troubleshooting.
    The ESXi shell, when enabled, can be accessed directly from the host console through the DCUI or remotely using SSH. Disable
    Secure Shell (SSH) for each ESXi host to prevent remote access to the ESXi shell, and only enable SSH when needed for
    troubleshooting or diagnostics. The Common Information Model (CIM) system provides an interface that enables hardware-level
    management from remote applications using a set of standard APIs. Provide only the minimum access necessary to applications.
    Do not provision CIM-based hardware monitoring tools and other third-party applications to run as root or as another administrator
    account. Instead, create a dedicated service account specific to each CIM application with the minimal access and privileges
    needed for that application. Enabling lockdown mode disables direct local access to an ESXi host, requiring the host be
    managed remotely from vCenter Server. There are some operations, such as backup and troubleshooting, that require direct
    access to the host. In these cases, lockdown mode can be disabled on a temporary basis for specific hosts as needed, and
    then re-enabled when the task is completed. Note: Lockdown mode does not apply to users who log in using authorized keys.
    Also, users in the DCUI.Access list for each host are allowed to override lockdown mode and log in to the DCUI. By default,
    the "root" user is the only user listed in the DCUI.Access list. ESXi hosts come with Secure Shell (SSH), which can be
    configured to authenticate remote users using public key authentication. For day-to-day operations, the ESXi host should
    be in lockdown mode with the SSH service disabled. Lockdown mode does not prevent root users from logging in using keys.
    The presence of a remote user''s public key in the /etc/ssh/keys-root/authorized_keys file on an ESXi host identifies
    the user as trusted, meaning the user is granted access to the host without providing a password. Disabling authorized_keys
    access may limit your ability to run unattended remote scripts. The ESXiShellInteractiveTimeOut allows you to automatically
    terminate idle ESXi shell and SSH sessions. The permitted idle time should be 300 seconds or less. When the ESXi shell
    or SSH services are enabled on a host, they will run indefinitely. To avoid this, set the ESXiShellTimeOut, which defines
    a window of time after which the ESXi shell and SSH services will automatically be terminated. It is recommended to set
    the ESXiShellInteractiveTimeOut together with ESXiShellTimeOut. Lockdown mode disables direct host access, requiring admins
    to manage hosts from vCenter. Set DCUI.Access to a list of highly trusted users who would be able to override lockdown
    mode and access the DCUI in the event an ESXi host became isolated from vCenter. NOTE: If you disable lockdown mode using
    the DCUI, all users with the DCUI.Access privilege will be granted the Administrator role on the host. Although most configurations
    on ESXi are controlled via an API, there are a limited set of configuration files that are used directly to govern host
    behavior. These files are exposed via the vSphere HTTPS-based file transfer API. These files should be monitored for modifications.
    WARNING: Do not attempt to monitor files that are NOT exposed via this file transfer API, since this can result in a destabilized
    system. vSphere allows for the use of bidirectional authentication of both the iSCSI target and host. Bidirectional Challenge-Handshake
    Authentication Protocol (CHAP), also known as Mutual CHAP, should be enabled to provide bidirectional authentication.
    Challenge-Handshake Authentication Protocol (CHAP) requires both client and host to know the secret (password) to establish
    a connection. Each mutual authentication secret should be unique. Use zoning and logical unit number (LUN) masking to
    segregate storage area network (SAN) activity. Zoning provides access control in the SAN topology. Zoning defines which
    host bus adapters (HBAs) can connect to which targets. The devices outside a zone are not visible to the devices inside
    the zone when SAN zoning is configured. For example, zones defined for testing should be managed independently within
    the SAN so they do not interfere with activity in the production zones. Similarly, you can set up different zones for
    different departments. Zoning must take into account any host groups that have been set up on the SAN device. LUN masking
    is a process that makes a LUN available to some hosts and unavailable to other hosts. The CLI command ''vmkfstools --writezeroes''
    can be used to write zeros to the entire contents of a virtual machine disk (VMDK) file prior to its deletion. Set the
    vSwitch Forged Transmits policy to reject for each vSwitch. Reject Forged Transmit can be set at the vSwitch and/or the
    Portgroup level. You can override switch-level settings at the Portgroup level. Ensure the MAC Address Change policy within
    the vSwitch is set to reject. Reject MAC Changes can be set at the vSwitch and/or the Portgroup level. You can override
    switchlevel settings at the Portgroup level. Ensure the Promiscuous Mode Policy within the vSwitch is set to reject. Promiscuous
    mode can be set at the vSwitch and/or the Portgroup level. You can override switch-level settings at the Portgroup level.
    ESXi does not use the concept of native VLAN, so do not configure port groups to use the native VLAN ID. If the default
    value of 1 for the native VLAN is being used, the ESXi Server virtual switch port groups should be configured with any
    value between 2 and 4094. Otherwise, ensure that the port group is not configured to use whatever value is set for the
    native VLAN. Ensure that port groups are not configured to VLAN values reserved by upstream physical switches. Certain
    physical switches reserve certain VLAN IDs for internal purposes and often disallow traffic configured to these values.
    For example, Cisco Catalyst switches typically reserve VLANs 1001 through 1024 and 4094, while Nexus switches typically
    reserve 3968 through 4047 and 4094. Check the documentation for your specific switch. Port groups should not be configured
    to VLAN 4095 except for Virtual Guest Tagging (VGT). When a port group is set to VLAN 4095, this activates VGT mode. In
    this mode, the vSwitch passes all network frames to the guest virtual machine without modifying the VLAN tags, leaving
    it up to the guest to deal with them. VLAN 4095 should be used only if the guest has been specifically configured to manage
    VLAN tags itself.'
  rationale: 'By staying up to date on ESXi patches, vulnerabilities in the hypervisor can be mitigated. An educated attacker
    can exploit known vulnerabilities when attempting to attain access or elevate privileges on an ESXi host. The ESXi Image
    Profile should only allow signed VIBs because an unsigned VIB represents untested code installed on an ESXi host. Also,
    use of unsigned VIBs will cause hypervisor Secure Boot to fail to configure. Community Supported VIBs do not have digital
    signatures. To protect the security and integrity of your ESXi hosts, do not allow unsigned (CommunitySupported) VIBs
    to be installed on your hosts. VMware provides digital signatures for kernel modules. Untested or malicious kernel modules
    loaded on the ESXi host can put the host at risk for instability and/or exploitation. By ensuring that all systems use
    the same relative time source (including the relevant localization offset), and that the relative time source can be correlated
    to an agreed-upon time standard, it is simpler to track and correlate an intruder''s actions when reviewing the relevant
    log files. Incorrect time settings can also make auditing inaccurate. Unrestricted access to services running on an ESXi
    host can expose a host to outside attacks and unauthorized access. Reduce the risk by configuring the ESXi firewall to
    only allow access from authorized IP addresses and networks. The MOB is meant to be used primarily for debugging the vSphere
    SDK. Because there are no access controls, the MOB could also be used as a method to obtain information about a host being
    targeted for unauthorized access. Using the default self-signed certificate may increase risk related to man-in-the-middle
    (MITM) attacks. If SNMP is not properly configured, monitoring data containing sensitive information can be sent to a
    malicious host and used to help exploit the host. If the dvfilter network API is enabled in the future and it is already
    configured, an attacker might attempt to connect a VM to it, thereby potentially providing access to the network of other
    VMs on the host. Leaving expired and revoked certificates on your vCenter Server system can compromise your environment.
    Replacing certificates will avoid having users get used to clicking through browser warnings. The warning might be an
    indication of a man-in-the-middle attack, and only inspection of the certificate and thumbprint can guard against such
    attacks. When a host crashes, an analysis of the resultant core dump is essential to being able to identify the cause
    of the crash and determine a resolution. Installing a centralized dump collector helps ensure that core files are successfully
    saved and made available in the event an ESXi host should ever panic. Non-persistent logging presents a security risk
    because user activity logged on the host is only stored temporarily and will not be preserved across reboots. This can
    also complicate auditing and make it harder to monitor events and diagnose issues. ESXi host logging should always be
    configured to a persistent datastore. Remote logging to a central log host provides a secure, centralized store for ESXi
    logs. You can more easily monitor all hosts with a single tool. You can also do aggregate analysis and searching to look
    for such things as coordinated attacks on multiple hosts. Logging to a secure, centralized log server helps prevent log
    tampering and provides a long-term audit record. To avoid sharing a common root account, it is recommended on each host
    to create at least one named user account and assign it full admin privileges, and to use this account in lieu of a shared
    "root" account. Limit the use of "root", including setting a highly complex password for the account, but do not remove
    the "root" account. All passwords for ESXi hosts should be hard to guess to reduce the risk of unauthorized access. Note:
    ESXi imposes no restrictions on the root password. Password strength and complexity rules only apply to non-root users.
    Joining ESXi hosts to an Active Directory (AD) domain eliminates the need to create and maintain multiple local user accounts.
    Using AD for user authentication simplifies the ESXi host configuration, ensures password complexity and reuse policies
    are enforced, and reduces the risk of security breaches and unauthorized access. An unauthorized user or group having
    membership in the esxAdminsGroup group will have full administrative access to all ESXi hosts. Such users may compromise
    the confidentiality, availability, and integrity of the all ESXi hosts and the respective data and processes they influence.
    Users who do not require special permissions should not be exempted from lockdown mode because this increases the risk
    of unauthorized actions being performed, especially if a user account is compromised. Multiple account login failures
    for the same account could possibly be an attacker trying to brute force guess the password. This setting reduces the
    inconvenience for benign users and the overhead on administrators, while also severely slowing down any brute force password
    guessing attacks. Terminating idle DCUI sessions helps avoid unauthorized usage of the DCUI originating from leftover
    login sessions. Actions performed from the DCUI are not tracked by vCenter Server. Even if Lockdown Mode is enabled, users
    who are members of the DCUI.Access list can perform administrative tasks in the DCUI, bypassing role-based access control
    and auditing controls provided through vCenter. Disabling DCUI prevents all local activity, and thus forces actions to
    be performed in vCenter Server, where they can be centrally audited and monitored. Activities performed from the ESXi
    shell bypass vCenter RBAC and audit controls, so the ESXi shell should only be enabled when needed to troubleshoot/resolve
    problems that cannot be fixed through the vSphere web client or vCLI/PowerCLI. Remote access to the host should be limited
    to the vSphere Client, remote command-line tools (vCLI/PowerCLI), and through the published APIs. Under normal circumstances,
    remote access to the host using SSH should be disabled. If CIM-based hardware monitoring tools or other third-party applications
    are granted unneeded administrator level access, they could potentially be used to compromise the security of the host.
    Lockdown mode limits ESXi host access to the vCenter server to ensure the roles and access controls implemented in vCenter
    are always enforced and users cannot bypass them by logging into a host directly. By forcing all interaction to occur
    through vCenter Server, the risk of someone inadvertently attaining elevated privileges or performing tasks that are not
    properly audited is greatly reduced. Keeping the authorized_keys file empty prevents users from circumventing the intended
    restrictions of lockdown mode. If a user forgets to log out of an ESXi shell or SSH session, the idle session will exist
    indefinitely, increasing the potential for someone to gain unauthorized privileged access to the host, unless a timeout
    is set. This reduces the risk of an inactive ESXi shell or SSH service being misused by an unauthorized party to compromise
    a host. The list prevents all admins from becoming locked out and no longer being able to manage the host. Any changes
    to these files should be correlated with an approved administrative action, such as an authorized configuration change.
    Tampering with these files could enable unauthorized access to the host configuration and virtual machines. By not authenticating
    both the iSCSI target and host, there is a potential for a man-in-themiddle attack in which an attacker might impersonate
    either side of the connection to steal data. Bidirectional authentication can mitigate this risk. Note: Choosing not to
    enforce bidirectional authentication can make sense if you create a dedicated network or VLAN to service all your iSCSI
    devices. If the iSCSI facility is isolated from general network traffic, it is less vulnerable to exploitation. If all
    mutual authentication secrets are unique, compromise of one secret does not allow an attacker to authenticate to other
    hosts or clients using that same secret. Segregating SAN activity can reduce the attack surface for the SAN, prevent non-ESXi
    systems from accessing SANs, and separate environments, for example, test and production environments. Zeroing out a VMDK
    file before deleting the file can help prevent users from reconstructing the original contents of the file from the physical
    storage media. If the virtual machine operating system changes the MAC address, the operating system can send frames with
    an impersonated source MAC address at any time. This allows an operating system to stage malicious attacks on the devices
    in a network by impersonating a network adaptor authorized by the receiving network. Setting forged transmissions to accept
    means the virtual switch does not compare the source and effective MAC addresses. To protect against MAC address impersonation,
    all virtual switches should have forged transmissions set to reject. If the virtual machine operating system changes the
    MAC address, it can send frames with an impersonated source MAC address at any time. This allows it to stage malicious
    attacks on the devices in a network by impersonating a network adaptor authorized by the receiving network. When promiscuous
    mode is enabled for a virtual switch, all virtual machines connected to the dvPortgroup have the potential of reading
    all packets crossing that network. This could enable unauthorized access to the contents of those packets. Frames with
    VLAN specified in the port group will have a tag, but frames without a VLAN specified in the port group are not tagged
    and therefore will end up as belonging to the native VLAN of the physical switch. For example, frames on VLAN 1 from a
    Cisco physical switch will be untagged, because this is considered as the native VLAN. However, frames from ESXi specified
    as VLAN 1 will be tagged with a “1”; therefore, traffic from ESXi that is destined for the native VLAN will not be correctly
    routed (because it is tagged with a “1” instead of being untagged), and traffic from the physical switch coming from the
    native VLAN will not be visible (because it is not tagged). If the ESXi virtual switch port group uses the native VLAN
    ID, traffic from those VMs will not be visible to the native VLAN on the switch, because the switch is expecting untagged
    traffic. Using a reserved VLAN might result in a denial of service on the network. If VGT is enabled inappropriately,
    it might cause a denial of service or allow a guest virtual machine to interact with traffic on an unauthorized VLAN.'
  impact: ESXi servers must be in Maintenance Mode to apply patches. This implies all VMs must be moved or powered off on
    the ESXi server, so the patching process may necessitate having brief outages. Replacing the default certificate might
    cause vCenter Server to stop managing the host. Disconnect and reconnect the host if vCenter Server cannot verify the
    new certificate. This will prevent a dvfilter-based network security appliance such as a firewall from functioning if
    not configured correctly. Disabling the DCUI can create a potential "lockout" situation, should the host become isolated
    from vCenter Server. Recovering from a "lockout" scenario requires reinstalling ESXi. Consider leaving DCUI enabled, and
    instead enable lockdown mode and limit the users allowed to access the DCUI using the DCUI.Access list. When you use this
    command, you lose any existing data on the virtual disk.
