  audit_raw: "Verify that the patches are up to date. The following PowerCLI snippet will provide a list of\nall installed\
    \ patches:\nForeach ($VMHost in Get-VMHost ) {\n    $ESXCli = Get-EsxCli -VMHost $VMHost;\n    (Get-ESXCli).software.vib.list()\
    \ | Select-Object\n@{N=\"VMHost\";E={$VMHost}}, Name, AcceptanceLevel, CreationDate, ID,\nInstallDate, Status, Vendor,\
    \ Version;\n}\nPerform the following to verify unsigned VIBs are not allowed:\n1. Connect to each ESX/ESXi host using\
    \ the ESXi Shell or vCLI, and execute the\ncommand \"esxcli software acceptance get\" to verify the acceptance level is\
    \ at either\n\"VMware Certified\", \"VMware Accepted\", or \"Partner Supported\".\n2. Connect to each ESX/ESXi host using\
    \ the vCLI, and execute the command \"esxcli\nsoftware vib list\" to verify the acceptance level for each VIB is either\
    \ \"VMware\nCertified\", \"VMware Accepted\", or \"Partner Supported\".\nAdditionally, the following PowerCLI command\
    \ may be used:\n# List the Software AcceptanceLevel for each host\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli\
    \ -VMHost $VMHost\n $VMHost | Select Name,\n14 | P a g e\n@{N=\"AcceptanceLevel\";E={$ESXCli.software.acceptance.get()}}\n\
    }\n# List only the vibs which are not at \"VMwareCertified\" or \"VMwareAccepted\"\nor \"PartnerSupported\" acceptance\
    \ level\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.software.vib.list() | Where\
    \ { ($_.AcceptanceLevel -ne\n\"VMwareCertified\") -and ($_.AcceptanceLevel -ne \"VMwareAccepted\") -and\n($_.AcceptanceLevel\
    \ -ne \"PartnerSupported\") }\n}\nTo list all the loaded kernel modules from the ESXi Shell or vCLI, run: \"esxcli system\n\
    module list\". For each module, verify the signature by running: esxcli system module get\n-m <module>.\nAdditionally,\
    \ the following PowerCLI command may be used:\n# List the system modules and Signature Info for each host\nForeach ($VMHost\
    \ in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.system.module.list() | Foreach {\n  $ESXCli.system.module.get($_.Name)\
    \ | Select @{N=\"VMHost\";E={$VMHost}},\nModule, License,      Modulefile, Version, SignedStatus, SignatureDigest,\nSignatureFingerPrint\n\
    \ }\n}\nTo confirm NTP synchronization is enabled and properly configured, perform the following\nfrom the vSphere web\
    \ client:\n1. Select the host.\n2. Click \"Configure\" -> \"System\" -> \"Time Configuration\".\n3. Click the \"Edit...\"\
    \ button.\n4. Verify that the names/IP addresses of the NTP servers are correct.\n5. Verify that the NTP service startup\
    \ policy is \"Start and stop with host\".\nAdditionally, the following PowerCLI command may be used:\n# List the NTP Settings\
    \ for all hosts\nGet-VMHost | Select Name, @{N=\"NTPSetting\";E={$_ | Get-VMHostNtpServer}}\n18 | P a g e\nTo confirm\
    \ access to services running on an ESXi host is properly restricted, perform the\nfollowing from the vSphere web client:\n\
    1. Select the host.\n2. Go to \"Configure\" -> \"System\" -> \"Security Profile\".\n3. In the \"Firewall\" section, select\
    \ \"Edit...\".\n4. For each enabled service, (e.g., ssh, vSphere Web Access, http client) check to see if\nthe specified\
    \ allowed IP addresses are correct.\nAdditionally, the following PowerCLI command may be used:\n# List all services for\
    \ a host\nGet-VMHost HOST1 | Get-VMHostService\n# List the services which are enabled and have rules defined for specific\
    \ IP\nranges to access the service\nGet-VMHost HOST1 | Get-VMHostFirewallException | Where {$_.Enabled -and (-not\n$_.ExtensionData.AllowedHosts.AllIP)}\n\
    # List the services which are enabled and do not have rules defined for\nspecific IP ranges to access the service\nGet-VMHost\
    \ HOST1 | Get-VMHostFirewallException | Where {$_.Enabled -and\n($_.ExtensionData.AllowedHosts.AllIP)}\n20 | P a g e\n\
    To determine if the MOB is enabled, run the following command from the ESXi shell:\nvim-cmd proxysvc/service_list\nAdditionally,\
    \ the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting -Name\nConfig.HostAgent.plugins.solo.enableMob\n\
    View the details of the SSL certificate presented by the ESXi host and determine if it is\nissued by a trusted CA:\n1.\
    \ Log in to the ESXi Shell, either directly from the DCUI or from an SSH client, as a user\nwith administrator privileges.\n\
    2. In the directory /etc/vmware/ssl, rename the existing certificates using the\nfollowing commands:\nmv rui.crt orig.rui.crt\n\
    mv rui.key orig.rui.key\n3. Copy the certificates you want to use to /etc/vmware/ssl.\n4. Rename the new certificate and\
    \ key to rui.crt and rui.key.\n5. Restart the host after you install the new certificate.\nAlternatively, you can put\
    \ the host into maintenance mode, install the new certificate, use\nthe Direct Console User Interface (DCUI) to restart\
    \ the management agents, and set the\nhost to exit maintenance mode.\nTo confirm the proper configuration of SNMP, perform\
    \ the following from the ESXi Shell or\nvCLI:\n1. Run the following to determine if SNMP is being used:\nesxcli system\
    \ snmp get\n2. If SNMP is being used, refer to the vSphere Monitoring and Performance guide,\nchapter 8 for steps to verify\
    \ the parameters.\nAdditionally, the following PowerCLI command may be used to view the SNMP\nconfiguration:\n# List the\
    \ SNMP Configuration of a host (single host connection required)\nGet-VMHostSnmp\nIf the dvfilter network API is not being\
    \ used on the host, ensure that the following kernel\nparameter has a blank value: Net.DVFilterBindIpAddress.\n1. From\
    \ the vSphere web client, select the host and click \"Configure\" -> \"System\" ->\n\"Advanced System Settings\".\n2.\
    \ Enter Net.DVFilterBindIpAddress in the filter.\n3. Verify Net.DVFilterBindIpAddress has an empty value.\n4. If an appliance\
    \ is being used, then make sure the value of this parameter is set to the\nproper IP address.\nAdditionally, the following\
    \ PowerCLI command may be used to verify the setting:\n# List Net.DVFilterBindIpAddress for each host\nGet-VMHost | Select\
    \ Name, @{N=\"Net.DVFilterBindIpAddress\";E={$_ | GetAdvancedSetting Net.DVFilterBindIpAddress | Select -ExpandProperty\
    \ Values}}\nTo assess if there are expired or revoked SSL certificates on your ESXi server, use the\nPowerCLI script called\
    \ out in \"verify-ssl-certificates\".\nRun the following ESXi shell command to determine if the host is configured as\
    \ prescribed:\nesxcli system coredump network get\nTo verify persistent logging is configured properly, perform the following\
    \ from the vSphere\nweb client:\n1. Select the host and go to \"Configure\" -> \"System\" -> \"Advanced System Settings\"\
    .\n2. Enter Syslog.global.LogDir in the filter.\n3. Ensure Syslog.global.LogDir is not set to /scratch or any other non-persistent\n\
    datastore.\nAlternatively, the following PowerCLI command may be used:\n# List Syslog.global.logDir for each host\nGet-VMHost\
    \ | Select Name, @{N=\"Syslog.global.logDir\";E={$_ | GetAdvancedConfiguration Syslog.global.logDir | Select -ExpandProperty\
    \ Values}}\nTo ensure remote logging is configured properly, perform the following from the vSphere\nweb client:\n1. Select\
    \ the host and click \"Configure\" -> \"System\" -> \"Advanced System Settings\".\n2. Enter Syslog.global.logHost in the\
    \ filter.\n3. Verify the Syslog.global.logHost is set to the hostname of the central log server.\nAlternately, the following\
    \ PowerCLI command may be used:\n# List Syslog.global.logHost for each host\nGet-VMHost | Select Name, @{N=\"Syslog.global.logHost\"\
    ;E={$_ | GetAdvancedSetting Syslog.global.logHost}}\nTo confirm one or more named user accounts have been established,\
    \ perform the following\nfor each ESXi host:\n1. Connect directly to the ESXi host using the vSphere Client.\n2. Login\
    \ as root or another authorized user.\n3. Select Manage, then select the Security & Users tab.\n4. Select User and view\
    \ the local users.\n5. Ensure at least one user exists that possesses the following:\n6. The use has been granted shell\
    \ access.\n7. Select the \"Permissions\" tab and verify the \"Administrator\" role has been granted to\nthe user.\nTo\
    \ confirm password complexity requirements are set, perform the following:\n1. Login to the ESXi shell as a user with\
    \ administrator privileges.\n2. Open /etc/pam.d/passwd.\n3. Locate the following line:\n  password requisite /lib/security/$ISA/pam_passwdqc.so\
    \ retry=N\nmin=N0,N1,N2,N3,N4\n4. Confirm N is less than or equal to 5.\n5. Confirm N0 is set to disabled.\n6. Confirm\
    \ N1 is set to disabled.\n7. Confirm N2 is set to disabled.\n8. Confirm N3 is set to disabled.\n9. Confirm N4 is set to\
    \ 14 or greater.\nThe above requires all passwords to be 14 or more characters long and comprised of at\nleast one character\
    \ from four distinct character sets. Additionally, a maximum of 5\nconsecutive failed login attempts are permitted.\n\
    40 | P a g e\nTo confirm AD is used for local user authentication, perform the following from the\nvSphere Web Client:\n\
    1. Select the host and go to \"Manage\" -> \"Security & Users\" -> \"Authentication\".\n2. Ensure the domain settings\
    \ are in accordance with the user credentials for an AD\nuser that has the rights to join computers to the domain.\nAlternately,\
    \ execute the following PowerCLI command:\n# Check each host and their domain membership status\nGet-VMHost | Get-VMHostAuthentication\
    \ | Select VmHost, Domain,\nDomainMembershipStatus\nTo verify only authorized users and groups belong to esxAdminsGroup,\
    \ go to Active\nDirectory and review the membership of the group name that is defined by the advanced\nhost setting: Config.HostAgent.plugins.hostsvc.esxAdminsGroup.\n\
    To verify the membership of the \"Exception Users\" list, perform the following:\n1. From the vSphere web client, select\
    \ the host.\n2. Click on \"Configure\" -> \"Settings\" -> \"System\" -> \"Security Profile\".\n3. Scroll down to \"Lockdown\
    \ Mode\".\n4. Verify that the list of \"Exception Users\" is correct.\nTo verify the maximum failed login attempts is\
    \ set properly, perform the following steps:\n1. From the vSphere Web Client, select the host.\n2. Click \"Configure\"\
    \ -> \"Settings\" -> \"System\" -> \"Advanced System Settings\".\n3. Enter \"Security.AccountLockFailures\" in the filter.\n\
    4. Verify that the value for this parameter is 3.\nAlternately, the following PowerCLI command may be used:\nGet-VMHost\
    \ | Get-AdvancedSetting -Name Security.AccountLockFailures\nTo verify the account lockout is set to 15 minutes, perform\
    \ the following:\n1. From the vSphere Web Client, select the host.\n2. Click \"Configure\" -> \"Settings\" -> \"System\"\
    \ -> \"Advanced System Settings\".\n3. Enter \"Security.AccountUnlockTime\" in the filter.\n4. Verify that the value for\
    \ this parameter is set to 900.\nAlternately, the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting\
    \ -Name Security.AccountUnlockTime\nTo verify the DCUI timeout setting, perform the following steps:\n1. From the vSphere\
    \ Web Client, select the host.\n2. Click \"Configure\" -> \"Settings\" -> \"System\" -> \"Advanced System Settings\".\n\
    3. Enter \"UserVars.DcuiTimeOut\" in the filter.\n4. Verify that the value for this parameter is 600 seconds or less.\n\
    Alternately, the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting -Name UserVars.DcuiTimeOut\n\
    To verify DCUI is disabled, perform the following:\n1. From the vSphere web client, select the host.\n2. Select \"Configure\"\
    \ -> \"System\" -> \"Security Profile\".\n3. Scroll down to \"Services\".\n4. Click \"Edit...\".\n5. Select \"Direct Console\
    \ UI\".\n6. Verify the Startup Policy is set to \"Start and Stop Manually\".\nAlternately, the following PowerCLI command\
    \ may be used:\n# List DCUI settings for all hosts\nGet-VMHost | Get-VMHostService | Where { $_.key -eq \"DCUI\" }\nTo\
    \ verify the ESXi shell is disabled, perform the following:\n1. From the vSphere web client, select the host.\n2. Select\
    \ \"Configure\" -> \"System\" -> \"Security Profile\".\n3. Scroll down to \"Services\".\n4. Click \"Edit...\".\n5. Select\
    \ \"ESXi Shell\".\n6. Verify the Startup Policy is set to \"Start and Stop Manually\".\nAlternately, the following PowerCLI\
    \ command may be used:\n# Check if the ESXi shell is running and set to start\nGet-VMHost | Get-VMHostService | Where\
    \ { $_.key -eq \"TSM\" } | Select VMHost,\nKey, Label, Policy, Running, Required\nNote: A host warning is displayed in\
    \ the web client whenever the ESXi shell is enabled on a\nhost.\nTo verify SSH is disabled, perform the following:\n1.\
    \ From the vSphere web client, select the host.\n2. Select \"Configure\" -> \"System\" -> \"Security Profile\".\n3. Scroll\
    \ down to \"Services\".\n4. Click \"Edit...\".\n5. Select \"SSH\".\n6. Verify the Startup Policy is set to \"Start and\
    \ Stop Manually\".\nAlternately, the following PowerCLI command may be used:\n# Check if SSH is running and set to start\n\
    Get-VMHost | Get-VMHostService | Where { $_.key -eq \"TSM-SSH\" } | Select\nVMHost, Key, Label, Policy, Running, Required\n\
    Note: A host warning is displayed in the web client whenever SSH is enabled on a host.\nTo verify CIM access is limited,\
    \ check for a limited-privileged service account with the\nfollowing CIM roles applied:\nHost.Config.SystemManagement\
    \ Host.CIM.CIMInteraction\nAlternately, the following PowerCLI command may be used:\n# List all user accounts on the Host\
    \ -Host Local connection requiredGet-VMHostAccount\nTo verify lockdown mode is enabled, perform the following from the\
    \ vSphere web client:\n1. Select the host.\n2. Select \"Configure\" -> \"System\" -> \"Security Profile\".\n3. Scroll\
    \ down to \"Lockdown Mode\".\n4. Click \"Edit...\".\n5. Ensure the \"Enable Lockdown Mode\" checkbox is checked.\nAlternately,\
    \ the following PowerCLI command may be used:\n# To check if Lockdown mode is enabled\nGet-VMHost | Select\nName,@{N=\"\
    Lockdown\";E={$_.Extensiondata.Config.adminDisabled}}\n62 | P a g e\nTo verify the authorized_keys file does not contain\
    \ any keys, perform the following:\n1. Logon to the ESXi shell as root or another admin user.\n2. Verify the /etc/ssh/keys-root/authorized_keys\
    \ file is empty.\nTo verify the timeout is set correctly, perform the following from the vSphere web client:\n1. Select\
    \ the host.\n2. Click \"Configure\" -> \"System\" -> \"Advanced System Settings\".\n3. Type ESXiShellInteractiveTimeOut\
    \ in the filter.\n4. Verify that the attribute is set to 300 seconds or less.\nNote: A value of 0 disables the ESXiShellInteractiveTimeOut.\n\
    Alternately, the following PowerCLI command may be used:\n# List UserVars.ESXiShellInteractiveTimeOut for each host\n\
    Get-VMHost | Select Name, @{N=\"UserVars.ESXiShellInteractiveTimeOut\";E={$_ |\nGet-AdvancedSetting UserVars.ESXiShellInteractiveTimeOut\
    \ | Select -\nExpandProperty Values}}\nTo verify the timeout is set to one hour or less, perform the following from the\
    \ vSphere\nweb client:\n1. Select the host and click \"Configure\" -> \"System\" -> \"Advanced System Settings\".\n2.\
    \ Type ESXiShellTimeOut in the filter.\n3. Ensure the attribute is set to 3600 seconds (1 hour) or less.\nAlternately,\
    \ the following PowerCLI command may be used:\n# List UserVars.ESXiShellTimeOut in minutes for each host\nGet-VMHost |\
    \ Select Name, @{N=\"UserVars.ESXiShellTimeOut\";E={$_ | GetAdvancedSettings UserVars.ESXiShellTimeOut | Select -ExpandProperty\
    \ Values}}\nTo verify a proper trusted users list is set for DCUI, perform the following from the vSphere\nweb client:\n\
    1. Select the host.\n2. Select \"Configure\" -> \"System\" -> \"Advanced System Settings\".\n3. Type DCUI.Access in the\
    \ filter.\n4. Ensure the DCUI.Access attribute is set to a comma-separated list of the users who\nare allowed to override\
    \ lockdown mode.\nAlternately, the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting -Name DCUI.Access\n\
    To verify the exposed configuration files have not been modified, perform the following:\n1. Open a web browser.\n2. Find\
    \ the ESXi configuration files by browsing to https:///host (not available if MOB\nis disabled).\n3. Review the contents\
    \ of those files to confirm no unauthorized modifications have\nbeen made.\nNOTE: Not all the files listed are modifiable.\n\
    Alternately, the configuration files can also be retrieved using the vCLI or PowerCLI.\nTo verify that bidirectional CHAP\
    \ authentication is enabled for iSCSI traffic, perform the\nfollowing:\n1. From the vSphere Web Client, navigate to \"\
    Hosts and Clusters\".\n2. Click on a host.\n3. Click on \"Configure\" -> \"Storage\" -> \"Storage Adapters\".\n4. Select\
    \ the iSCSI adapter.\n5. Under Adapter Details, click the Properties tab.\n6. Verify that the authentication method is\
    \ \"Use bidirectional CHAP\".\nAlternately, the following PowerCLI command may be used:\n74 | P a g e\n# List Iscsi Initiator\
    \ and CHAP Name if defined\nGet-VMHost | Get-VMHostHba | Where {$_.Type -eq \"Iscsi\"} | Select VMHost,\nDevice, ChapType,\
    \ @{N=\"CHAPName\";E={$_.AuthenticationProperties.ChapName}}\nTo verify the CHAP secrets are unique, run the following\
    \ to list all iSCSI adapters and their\ncorresponding CHAP configuration:\n# List Iscsi Initiator and CHAP Name if defined\n\
    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq \"Iscsi\"} | Select VMHost,\nDevice, ChapType, @{N=\"CHAPName\";E={$_.AuthenticationProperties.ChapName}}\n\
    The audit procedures to verify SAN activity is properly segregated are SAN vendor or\nproduct-specific.\nNot applicable\n\
    To verify the policy is set to reject forged transmissions, perform the following:\n1. In the vSphere Web Client, navigate\
    \ to the host.\n2. Go to \"Hosts and Clusters\" -> \"vCenter\" -> host.\n3. On the Configure tab, click Networking, and\
    \ select Virtual switches.\n4. Select a standard switch from the list and click the pencil icon to edit settings.\n5.\
    \ Select Security.\n6. Verify Forged transmits is set to \"Reject\".\nAlternately, the following PowerCLI command may\
    \ be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select VMHost, Name, `\n @{N=\"\
    MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\" } Else { \"Reject\"} }}, `\n81 | P\
    \ a g e\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) { \"Accept\" } Else {\n\
    \"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits) { \"Accept\"\
    \ } Else {\n\"Reject\"} }}\nTo verify the policy is set to reject, perform the following:\n1. In the vSphere Web Client,\
    \ navigate to the host.\n2. Go to \"Hosts and Clusters\" -> \"vCenter\" -> host.\n3. On the Configure tab, click Networking,\
    \ and select Virtual switches.\n4. Select a standard switch from the list and click the pencil icon to edit settings.\n\
    5. Select Security.\n6. Verify MAC Address Changes is set to \"Reject\".\n7. Click \"OK\".\nAlternately, the following\
    \ PowerCLI command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select\
    \ VMHost, Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\" } Else {\
    \ \"Reject\"} }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) { \"Accept\"\
    \ } Else {\n\"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}\n83 | P a g e\nTo verify the policy is set to reject, perform the following:\n\
    1. In the vSphere Web Client, navigate to the host.\n2. Go to \"Hosts and Clusters\" -> \"vCenter\" -> host.\n3. On the\
    \ Configure tab, click Networking, and select Virtual switches.\n4. Select a standard switch from the list and click the\
    \ pencil icon to edit settings.\n5. Select Security.\n6. Verify Promiscuous Mode is set to \"Reject\".\n7. Click \"OK\"\
    .\nAlternately, the following PowerCLI command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch\
    \ -Standard | Select VMHost, Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\
    \"Accept\" } Else { \"Reject\"} }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}\n85 | P a g e\nTo verify the native VLAN ID is not being used for port groups,\
    \ perform the following:\n1. From the vSphere web client, select the host.\n2. On the Configure tab, click Networking,\
    \ and select Virtual switches.\n3. Select a standard switch from the list.\n4. View the topology diagram of the switch,\
    \ which shows the various port groups\nassociated with that switch.\n5. For each port group on the vSwitch, verify and\
    \ record the VLAN IDs used.\nAlternately, the following PowerCLI command may be used:\n# List all vSwitches, their Portgroups\
