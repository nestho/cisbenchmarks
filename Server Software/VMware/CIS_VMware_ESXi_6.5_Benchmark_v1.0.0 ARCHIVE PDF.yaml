- id: 8.5.1
  title: (L2) Ensure VM limits are configured correctly
  scoring: scored
  profile:
  - Level 2
  description: By default, all virtual machines on an ESXi host share the resources equally. By using the resource management
    capabilities of ESXi, such as limits with reservations, shares, and/or resource pools, you can control the server resources
    a virtual machine consumes.
  rationale: Without resource management, one virtual machine could consume so much of the host's resources that other virtual
    machines on the same host could not perform their intended functions.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.5/com.vmware.vsphere.security.doc/GUID-E6262360-9300-4E10ADE0-D4BED08DB5CA.html
  page_start: 176
  audit_raw: 'To verify VM limits are configured correctly, confirm that limits with reservations, shares,

    and/or resource pools are in place to guarantee resources to critical VMs and to constrain

    resource consumption by VMs that have a greater risk of being exploited or attacked, or

    that run applications that are known to have the potential to greatly consume resources.

    The following PowerCLI command may be used to list resource configurations:

    # List all Resource shares on all VMs

    Get-VM | Get-VMResourceConfiguration'
  remediation: 'To configure VM limits correctly, do all of the following that are applicable:

    1. Use shares or reservations to guarantee resources to critical VMs.

    2. Use limits to constrain resource consumption by VMs that have a greater risk of

    being exploited or attacked, or that run applications that are known to have the

    potential to greatly consume resources.

    3. Use resource pools to guarantee resources to a common group of critical VMs.

    176 | P a g e'
  checks:
  - type: manual_review
    info: 'To verify VM limits are configured correctly, confirm that limits with reservations, shares,

      and/or resource pools are in place to guarantee resources to critical VMs and to constrain

      resource consumption by VMs that have a greater risk of being exploited or attacked, or

      that run applications that are known to have the potential to greatly consume resources.

      The following PowerCLI command may be used to list resource configurations:

      # List all Resource shares on all VMs

      Get-VM | Get-VMResourceCo'
    severity: medium
- id: 8.5.2
  title: (L2) Ensure hardware-based 3D acceleration is disabled
  scoring: scored
  profile:
  - Level 2
  description: Due to performance reasons, modern graphic rendering is done within a dedicated graphic processing unit (GPU).
    Virtual machines can use the host-based GPU for such operations as well. Such dedicated hardware is typically accessed
    by using complex APIs like OpenGL and DirectX. This hardware-based 3D acceleration should be disabled if it is not needed.
  rationale: Security flaws within APIs can lead to serious security breaches like memory corruption, denial of service, and
    remote code execution.
  impact: ''
  references:
