- id: 8.4.1
  title: (L1) Ensure access to VMs through the dvfilter network APIs is configured correctly
  scoring: scored
  profile:
  - Level 1
  description: 'A VM must be configured explicitly to accept access by the dvfilter network API. Only VMs that need to be
    accessed by that API should be configured to accept such access. The VMsafe CPU/memory API allows a security virtual machine
    to inspect and modify the contents of the memory and CPU registers on other VMs, for the purpose of detecting and preventing
    malware attacks. A VM must be configured explicitly to accept access by the VMsafe CPU/memory API. This involves three
    parameters to perform the following: 1. Enable the API. 2. Set the IP address used by the security virtual appliance on
    the introspection vSwitch. 3. Set the port number for that IP address. The second parameter must be set correctly in the
    vmsafe.agentAddress option in the virtual machine configuration file for any VMs that should be protected by the API.'
  rationale: An attacker might compromise a VM by making use of the dvfilter API. An attacker might compromise the VMs by
    making unauthorized use of the introspection channel provided by the API.
  impact: ''
  references:
  - 1. http://kb.vmware.com/kb/1714
