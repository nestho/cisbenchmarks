- id: 8.4.28
  title: (L1) Ensure access to VM console via VNC protocol is limited
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Minimize access to the Virtual Machine via VNC protocol. Enable VGA Only mode for the Virtual Machine video
    card. Note:this setting should only be applied to those virtual machines for which a video card is not needed such as
    Windows Server Core and UNIX / Linux servers.
  rationale: The VM console enables you to connect to the console of a virtual machine, in effect seeing what a monitor on
    a physical server would show. This console is also available via the VNC protocol. Setting up this access also involves
    setting up firewall rules on each ESXi server the virtual machine will run on. Many Server-class virtual machines need
    only a standard VGA console (typically a Unix/Linux server or Windows Server Core system). Enabling this setting removes
    additional unnecessary graphics functionality beyond disabling 3D. This reduces the potential attack surface available
    for malicious attacks.
  impact: 'Configuring VM settings and opening up the firewall means multiple steps to be configured and monitored. 172 |
    P a g e Configuring this setting to True will not allow any advanced graphics functions to work. Only character-cell console
    mode will be available. Use of this setting renders mks.enable3d moot. The mks.enable3d has no effect. Note: this setting
    should only be applied to those virtual machines for which a video card is not needed such as Windows Server Core and
    UNIX / Linux servers.'
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.5/com.vmware.vsphere.vm_admin.doc/GUID-BB1F20D3-339F-46F3B020-D19C9322C001.html
  - 1. http://pubs.vmware.com/vsphere60/topic/com.vmware.wssdk.apiref.doc/vim.option.OptionValue.html
  page_start: 172
  audit_raw: 'Check virtual machine configuration and verify that RemoteDisplay.vnc.enabled is

    missing or set to FALSE.

