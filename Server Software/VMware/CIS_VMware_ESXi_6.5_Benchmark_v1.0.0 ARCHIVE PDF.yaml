  - 1. http://kb.vmware.com/kb/1714
  - 2. https://www.vmware.com/security/hardening-guides.html
  page_start: 119
  audit_raw: 'To verify the configuration, perform the following if dvfilter access should be permitted:

    1. Verify that the following is in the VMX file: ethernet0.filter1.name = dv-filter1

    where ethernet0 is the network adapter interface of the virtual machine that is to

    be protected, filter1 is the number of the filter that is being used, and dv-filter1

    is the name of the particular data path kernel module that is protecting the VM.

    2. Ensure that the name of the data path kernel is set correctly.

    Perform the following to verify the configuration if dvfilter access should not be permitted:

    1. Verify that the following is not in the VMX file: ethernet0.filter1.name = dvfilter1.

    To verify the VMsafe Agent Address is configured correctly, perform the following steps:

    1. If the VM is not being protected by a VMsafe CPU/memory product, verify that

    vmsafe.agentAddress is not present in the virtual machine configuration file.

    2. If the VM is being protected by a VMsafe CPU/Memory product, make sure that

    vmsafe.agentAddress in the virtual machine configuration file is set to the correct

    value.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "vmsafe.agentAddress" | Select Entity,

    Name, Value

    121 | P a g e'
  remediation: 'To configure a VM to allow dvfilter access, perform the following steps:

