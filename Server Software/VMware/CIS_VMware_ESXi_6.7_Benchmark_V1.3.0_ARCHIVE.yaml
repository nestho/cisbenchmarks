- id: 8.7.2
  title: (L1) Ensure the number of VM log files is configured properly
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Normally a new log file is created only when a host is rebooted, so the file can grow to be quite large. You
    can ensure that new log files are created more frequently by limiting the maximum size of the log files. If you want to
    restrict the total size of logging data, VMware recommends saving 10 log files, each one limited to 1 MB. Each time an
    entry is written to the log, the size of the log is checked; if it is over the limit, the next entry is written to a new
    log. If the maximum number of log files already exists, when a new one is created, the oldest log file is deleted.
  rationale: Log files should be rotated to preserve log data in case of corruption or destruction of the current log file,
    and to avoid the likelihood of logging issues caused by an overly large log file.
  impact: A more extreme strategy is to disable logging altogether for the virtual machine. Disabling logging makes troubleshooting
    challenging and support difficult. Do not consider disabling logging unless the log file rotation approach proves insufficient.
  references:
  - 1. https://docs.vmware.com/en/VMwareTools/10.3.0/com.vmware.vsphere.vmwaretools.doc/GUID-685722FA-9009439C-9142-18A9E7C592EA.html
  page_start: 216
  audit_raw: 'To verify that log files will be created more frequently, check the virtual machine

    configuration file and verify that log.keepOld is set to 10.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "log.keepOld"| Select Entity, Name, Value'
  remediation: 'To set the number of log files to be used to 10, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "log.keepOld" -value "10"'
  checks:
  - type: manual_review
    info: 'To verify that log files will be created more frequently, check the virtual machine

      configuration file and verify that log.keepOld is set to 10.

      Alternately, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "log.keepOld"| Select Entity, Name, Value'
    severity: medium
