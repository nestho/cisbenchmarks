- id: 8.2.8
  title: (L1) Ensure PCI and PCIe device passthrough is disabled
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Using the VMware DirectPath I/O feature to pass through a PCI or PCIe device to a virtual machine can result
    in a potential security vulnerability.
  rationale: The vulnerability can be triggered by buggy or malicious code running in privileged mode in the guest OS, such
    as a device driver.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-E5CFB1FB-9216-4C1DB49A-81AAAC414025.html
  page_start: 137
  audit_raw: 'Using the vSphere Web Client:

    1. Select each applicable VM

    2. Click "Configure" -> "Settings" -> "VM Options".

    3. Expand "Advanced Settings".

    4. Scroll the list of "Configuration Parameters"

    5. Ensure that the desired configuration parameter is present with the desired

    value.

    Additionally, the following PowerCLI command can be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "pciPassthru*.present" | Select Entity,

    Name, Value

    ``'
  remediation: 'Using the vSphere Web Client:

    1. Select each VM

    2. Click "Configure" -> "Settings" -> "Virtual Hardware" ->

    3. Remove the PCI/PCIe passthrough device.

    Additionally, the following PowerCLI command can be used:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "pciPassthru*.present" -value ""'
  checks:
  - type: manual_review
    info: 'Using the vSphere Web Client:

      1. Select each applicable VM

      2. Click "Configure" -> "Settings" -> "VM Options".

      3. Expand "Advanced Settings".

      4. Scroll the list of "Configuration Parameters"

      5. Ensure that the desired configuration parameter is present with the desired

      value.

      Additionally, the following PowerCLI command can be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "pciPassthru*.present" | Select Entity,

      Name, Value

      ``'
    severity: medium
- id: 8.3.1
  title: (L1) Ensure unnecessary or superfluous functions inside VMs are disabled
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Disable all system components that are not needed to support the application or service running on the VM.
    VMs often don't require as many functions as ordinary physical servers, so when virtualizing, you should evaluate whether
    a particular function is truly needed.
  rationale: By disabling unnecessary system components, you reduce the number of potential attack vectors, which reduces
    the likelihood of compromise.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-6BFA8CA7-610F-4E6B9FC6-D656917B7E7A.html
  page_start: 140
  audit_raw: 'To verify unneeded functions are disabled, check that the following are disabled:

    1. Unused services in the operating system. For example, if the system runs a file

    server, Web services should not be running.

    2. Unused physical devices, such as CD/DVD drives, floppy drives, and USB

    adaptors.

    3. Screen savers.

    4. X Windows if using a Linux, BSD, or Solaris guest operating system.'
  remediation: 'To disable unneeded functions, perform whichever of the following steps are applicable:

    1. Disable unused services in the operating system.

    2. Disconnect unused physical devices, such as CD/DVD drives, floppy drives, and

    USB adaptors.

    3. Turn off any screen savers.

    4. If using a Linux, BSD, or Solaris guest operating system, do not run the X

    Windows system unless it is necessary.'
  checks:
  - type: manual_review
    info: 'To verify unneeded functions are disabled, check that the following are disabled:

      1. Unused services in the operating system. For example, if the system runs a file

      server, Web services should not be running.

      2. Unused physical devices, such as CD/DVD drives, floppy drives, and USB

      adaptors.

      3. Screen savers.

      4. X Windows if using a Linux, BSD, or Solaris guest operating system.'
    severity: medium
- id: 8.3.2
  title: (L1) Ensure use of the VM console is limited
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: The VM console enables you to connect to the console of a VM, in effect seeing what a monitor on a physical
    server would show. The VM console also provides power management and removable device connectivity controls. Instead of
    the VM console, use native remote management services, such as terminal services and ssh, to interact with VMs. Grant
    access to the VM console only when needed, and use custom roles to provide fine-grained permissions for those people who
    do need access. By default, the vCenter roles "Virtual Machine Power User" and "Virtual Machine Administrator" have the
    "Virtual Machine.Interaction.Console Interaction" privilege.
  rationale: The VM console could be misused to eavesdrop on VM activity, cause VM outages, and negatively affect the performance
    of the console, especially if many VM console sessions are open simultaneously.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-41E5E52E-A95B-4E819724-6AD6800BEF78.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-3D47149A-947D-460888B3-E5811129EFA8.html
  page_start: 142
  audit_raw: 'To verify use of the VM console is properly limited, perform the following steps:

    1. From the vSphere Client, select an object in the inventory.

    2. Click the Permissions tab to view the user and role pair assignments for that

    object.

    3. Next, navigate to vCenter --> Administration --> Roles.

    4. Select the role in question and choose Edit to see which effective privileges are

    enabled.

    5. Verify that only authorized users have a role which allows them a privilege under

    the Virtual Machine section of the role editor.'
  remediation: 'To properly limit use of the VM console, perform the following steps:

    1. From the vSphere Client, navigate to vCenter --> Administration --> Roles.

    2. Create a custom role and choose Edit to enable only the minimum needed

    effective privileges.

    3. Next, select an object in the inventory.

    4. Click the Permissions tab to view the user and role pair assignments for that

    object.

    5. Remove any default "Admin" or "Power User" roles, and assign the new custom

    role as needed.'
  checks:
  - type: manual_review
    info: 'To verify use of the VM console is properly limited, perform the following steps:

      1. From the vSphere Client, select an object in the inventory.

      2. Click the Permissions tab to view the user and role pair assignments for that

      object.

      3. Next, navigate to vCenter --> Administration --> Roles.

      4. Select the role in question and choose Edit to see which effective privileges are

      enabled.

      5. Verify that only authorized users have a role which allows them a privilege under

      the Virtual Machine section '
    severity: medium
- id: 8.3.3
  title: (L1) Ensure secure protocols are used for virtual serial port access
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Serial ports are interfaces for connecting peripherals to the VM. They are often used on physical systems to
    provide a direct, low-level connection to the console of a server. Virtual serial ports allow VMs to communicate with
    serial ports over networks. If virtual serial ports are needed, they should be configured to use secure protocols.
  rationale: If virtual serial ports do not use secure protocols, the communications with those ports could be eavesdropped
    on, manipulated, or otherwise compromised, giving attackers sensitive information or control to unauthorized parties.
  impact: ''
  references:
  - 1. https://code.vmware.com/apis/196/vsphere#/doc/vim.vm.device.VirtualSerialPort.
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.vm_admin.doc/GUID-462B8B04-29DF-406B9585-12D2588A6A48.html
  page_start: 144
  audit_raw: 'To verify that all virtual serial ports use secure protocols, check that all configured

    protocols are from this list:

    • ssl - the equivalent of TCP+SSL

    • tcp+ssl - SSL over TCP over IPv4 or IPv6

    • tcp4+ssl - SSL over TCP over IPv4

    • tcp6+ssl - SSL over TCP over IPv6

    • telnets - telnet over SSL over TCP'
  remediation: 'To configure all virtual serial ports to use secure protocols, change any protocols that

    are not secure to one of the following:

    • ssl - the equivalent of TCP+SSL

    • tcp+ssl - SSL over TCP over IPv4 or IPv6

    • tcp4+ssl - SSL over TCP over IPv4

    • tcp6+ssl - SSL over TCP over IPv6

    • telnets - telnet over SSL over TCP'
  checks:
  - type: manual_review
    info: 'To verify that all virtual serial ports use secure protocols, check that all configured

      protocols are from this list:

      • ssl - the equivalent of TCP+SSL

      • tcp+ssl - SSL over TCP over IPv4 or IPv6

      • tcp4+ssl - SSL over TCP over IPv4

      • tcp6+ssl - SSL over TCP over IPv6

      • telnets - telnet over SSL over TCP'
    severity: medium
- id: 8.3.4
  title: (L1) Ensure standard processes are used for VM deployment
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Have a standard process for VM deployment whether this is a VMware template or another means to ensure Operating
    Systems have the appropriate security controls. Refer to CIS Benchmarks for information in regards to specific Operating
    System hardening.
  rationale: By utilizing a standard deployment process and having hardened templates you can ensure that all your virtual
    machines are created with a known baseline level of security.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.vm_admin.doc/GUID-8254CD05-CC06-491DBA56-A773A32A8130.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-3399BC47-45E8-494B9B57-E498DD294A47.html
  page_start: 146
  audit_raw: 'Verify documentation for the method of standardization for VM deployment. If utilizing

    templates in VMware confirm they exist, are configured, and documented appropriately.'
  remediation: 'Create documentation and a standard process for the method for VM deployment. If

    utilizing templates in VMware create the templates, document the process for using

