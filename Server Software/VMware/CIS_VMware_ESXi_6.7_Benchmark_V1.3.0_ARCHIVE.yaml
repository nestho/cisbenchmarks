    severity: medium
- id: 8.6.1
  title: (L2) Ensure nonpersistent disks are limited
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: By default, VM disks use dependent mode, which means they are affected by snapshots. To avoid this, VM disks
    can use independent mode instead. Independent mode can be configured as persistent (data is written permanently to the
    disk) or nonpersistent (all changes made to disk are lost when the system is rebooted). Use of nonpersistent mode should
    be avoided unless the data is not needed (e.g., already duplicated elsewhere).
  rationale: From a security standpoint, nonpersistent mode allows successful attackers to remove evidence of their actions
    or even their presence within a VM by performing a simple shutdown or reboot.
  impact: ''
  references:
  - 1. https://code.vmware.com/apis/196/vsphere#/doc/vim.vm.device.VirtualDiskOptio
  page_start: 207
  audit_raw: 'To verify nonpersistent mode use is limited, review VM disk types to confirm that

    nonpersistent mode is only used when the loss of all stored data is not a concern. For

    all disks where nonpersistent mode is not to be used, scsiX:Y.mode should either be

    absent or be set to a value other than independent nonpersistent.

    Alternately, the following PowerCLI command may be used to review the disk types:

    #List the VM''s and their disk types

    Get-VM | Get-HardDisk | Select Parent, Name, Filename, DiskType, Persistence'
  remediation: 'To limit the use of nonpersistent mode, run the following PowerCLI command:

    #Add the parameters for the following cmdlet to set the VM Disk Type:

    Get-VM  | Get-HardDisk | Set-HardDisk'
  checks:
  - type: manual_review
    info: 'To verify nonpersistent mode use is limited, review VM disk types to confirm that

      nonpersistent mode is only used when the loss of all stored data is not a concern. For

      all disks where nonpersistent mode is not to be used, scsiX:Y.mode should either be

      absent or be set to a value other than independent nonpersistent.

      Alternately, the following PowerCLI command may be used to review the disk types:

      #List the VM''s and their disk types

      Get-VM | Get-HardDisk | Select Parent, Name, Filename, DiskType'
    severity: medium
- id: 8.6.2
  title: (L1) Ensure virtual disk shrinking is disabled
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: If Virtual disk shrinking is done repeatedly it will cause the virtual disk to become unavailable resulting
    in a denial of service. You can prevent virtual disk shrinking by disabling it.
  rationale: Shrinking a virtual disk reclaims unused space in it. If there is empty space in the disk, this process reduces
    the amount of space the virtual disk occupies on the host drive. Normal users and processes—that is, users and processes
    without root or administrator privileges—within virtual machines have the capability to invoke this procedure. However,
    if this is done repeatedly, the virtual disk can become unavailable while this shrinking is being performed, effectively
    causing a denial of service. In most datacenter environments, disk shrinking is not done, so you should disable this feature.
    Repeated disk shrinking can make a virtual disk unavailable. This capability is available to nonadministrative users in
    the guest.
  impact: Inability to shrink virtual machine disks in the event that a datastore runs out of space.
  references:
  - 1. https://docs.vmware.com/en/VMwareTools/10.3.0/com.vmware.vsphere.vmwaretools.doc/GUID-685722FA-9009439C-914218A9E7C592EA.html?hWord=N4IghgNiBcIMoFMDGBXATgSwC4E8AEAwgPYB
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-9610FE65-3A78-49828C28-5B34FEB264B6.html
  page_start: 209
  audit_raw: 'Check virtual machine configuration file and verify that

    isolation.tools.diskShrink.disable is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskShrink.disable"|

    Select Entity, Name, Value'
  remediation: 'To implement the recommended configuration state, run the following PowerCLI

    command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.diskShrink.disable" -

    value $true'
  checks:
  - type: manual_review
    info: 'Check virtual machine configuration file and verify that

      isolation.tools.diskShrink.disable is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskShrink.disable"|

      Select Entity, Name, Value'
    severity: medium
- id: 8.6.3
  title: (L1) Ensure virtual disk wiping is disabled
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Wiping a virtual disk reclaims all unused space in it. If there is empty space in the disk, this process reduces
    the amount of space the virtual disk occupies on the host drive. If virtual disk wiping is done repeatedly, it can cause
    the virtual disk to become unavailable while wiping occurs. In most datacenter environments, disk wiping is not needed,
    but normal users and processes--without administrative privileges--can issue disk wipes unless the feature is disabled.
  rationale: Virtual disk wiping can effectively cause a denial of service.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-9610FE65-3A78-49828C28-5B34FEB264B6.html
  - 2. https://docs.vmware.com/en/VMwareTools/10.3.0/com.vmware.vsphere.vmwaretools.doc/GUID-685722FA-9009439C-9142-18A9E7C592EA.html
  page_start: 211
  audit_raw: 'To verify that virtual disk wiping is disabled, check the virtual machine configuration file

    and verify that isolation.tools.diskWiper.disable is set to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskWiper.disable"|

    Select Entity, Name, Value'
  remediation: 'To disable virtual disk wiping, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.diskWiper.disable" -value

    $true'
  checks:
  - type: manual_review
    info: 'To verify that virtual disk wiping is disabled, check the virtual machine configuration file

      and verify that isolation.tools.diskWiper.disable is set to TRUE.

      Alternately, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name  "isolation.tools.diskWiper.disable"|

      Select Entity, Name, Value'
    severity: medium
- id: 8.7.1
