- id: 8.4.26
  title: (L2) Ensure all but VGA mode on virtual machines is disabled
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Enable VGA Only mode for the Virtual Machine video card. Note:this setting should only be applied to those
    virtual machines for which a video card is not needed such as Windows Server Core and UNIX / Linux servers.
  rationale: Many Server-class virtual machines need only a standard VGA console (typically a Unix/Linux server or Windows
    Server Core system). Enabling this setting removes additional unnecessary graphics functionality beyond disabling 3D.
    This reduces the potential attack surface available for malicious attacks.
  impact: 'Configuring this setting to True will not allow any advanced graphics functions to work. Only character-cell console
    mode will be available. Use of this setting renders mks.enable3d moot. The mks.enable3d has no effect. Note: this setting
    should only be applied to those virtual machines for which a video card is not needed such as Windows Server Core and
    UNIX / Linux servers.'
  references: []
  page_start: 199
  audit_raw: 'Check that the virtual machine advanced setting of "svga.vgaonly" is set to TRUE.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "svga.vgaOnly" | Select Entity, Name,

    Value'
  remediation: 'Check that the virtual machine advanced setting of "svga.vgaonly" is set to TRUE.

    To modify the advanced settings of a virtual machine using the vSphere Client:

    1. Ensure that the virtual machine has been shutdown and is powered off.

    2. Right-click on the virtual machine.

    3. Click Edit Settings... to open the Virtual Machine Properties window.

    4. Click the VM Options tab.

    5. From the list on the left, click Advanced.

    6. On the Configuration Parameters frame on the right, click Edit Configuration ...

    7. Click Add Parameter.

    8. On the new row, click under the Key column and specify the configuration option

    name.

    9. On the new row, click under the Value column and specify the configuration

    value.

    10. Start the virtual machine for the settings take effect.

    Additionally, the following PowerCLI command may be used:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "svga.vgaOnly" -value $true'
  checks:
  - type: manual_review
    info: 'Check that the virtual machine advanced setting of "svga.vgaonly" is set to TRUE.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "svga.vgaOnly" | Select Entity, Name,

      Value'
    severity: medium
- id: 8.5.1
  title: (L2) Ensure VM limits are configured correctly
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: By default, all virtual machines on an ESXi host share the resources equally. By using the resource management
    capabilities of ESXi, such as limits with reservations, shares, and/or resource pools, you can control the server resources
    a virtual machine consumes.
  rationale: Without resource management, one virtual machine could consume so much of the host's resources that other virtual
    machines on the same host could not perform their intended functions.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-E6262360-9300-4E10ADE0-D4BED08DB5CA.html
  page_start: 202
  audit_raw: 'To verify VM limits are configured correctly, confirm that limits with reservations, shares,

    and/or resource pools are in place to guarantee resources to critical VMs and to

    constrain resource consumption by VMs that have a greater risk of being exploited or

    attacked, or that run applications that are known to have the potential to greatly

    consume resources.

    The following PowerCLI command may be used to list resource configurations:

    # List all Resource shares on all VMs

    Get-VM | Get-VMResourceConfiguration'
  remediation: 'To configure VM limits correctly, do all of the following that are applicable:

    1. Use shares or reservations to guarantee resources to critical VMs.

    2. Use limits to constrain resource consumption by VMs that have a greater risk of

    being exploited or attacked, or that run applications that are known to have the

    potential to greatly consume resources.

    3. Use resource pools to guarantee resources to a common group of critical VMs.'
  checks:
  - type: manual_review
    info: 'To verify VM limits are configured correctly, confirm that limits with reservations, shares,

      and/or resource pools are in place to guarantee resources to critical VMs and to

      constrain resource consumption by VMs that have a greater risk of being exploited or

      attacked, or that run applications that are known to have the potential to greatly

      consume resources.

      The following PowerCLI command may be used to list resource configurations:

      # List all Resource shares on all VMs

      Get-VM | Get-VMResourceCo'
    severity: medium
- id: 8.5.2
  title: (L2) Ensure hardware-based 3D acceleration is disabled
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Due to performance reasons, modern graphic rendering is done within a dedicated graphic processing unit (GPU).
    Virtual machines can use the host-based GPU for such operations as well. Such dedicated hardware is typically accessed
    by using complex APIs like OpenGL and DirectX. This hardware-based 3D acceleration should be disabled if it is not needed.
  rationale: Security flaws within APIs can lead to serious security breaches like memory corruption, denial of service, and
    remote code execution.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-15D965F3-05E3-4E599F08-B305FDE672DD.html
  page_start: 204
  audit_raw: 'To verify that hardware-based 3D acceleration is disabled, check the virtual machine

    configuration file and verify that mks.enable3d is set to FALSE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "mks.enable3d"| Select Entity, Name, Value'
  remediation: 'To disable hardware-based 3D acceleration, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "mks.enable3d" -value $false'
  checks:
  - type: manual_review
    info: 'To verify that hardware-based 3D acceleration is disabled, check the virtual machine

      configuration file and verify that mks.enable3d is set to FALSE.

      Alternately, the following PowerCLI command may be used:

