controls:
- id: 8.1.1
  title: (L1) Ensure informational messages from the VM to the VMX file are limited
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Limit informational messages from the virtual machine (VM) to the virtual machine extensions (VMX) file to
    avoid filling the datastore. The configuration file containing these name-value pairs is limited to a size of 1 MB by
    default. This should be sufficient for most cases, but you can change this value if necessary, such as if large amounts
    of custom information are being stored in the configuration file.
  rationale: Filling the datastore with informational messages from the VM to the VMX file could cause a denial of service.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-91BF834E-CB92-40148CF7-29CE40F3E8A3.html
  page_start: 118
  audit_raw: 'To verify informational messages are limited to 1 MB, view the virtual machine

    configuration file and verify that tools.setInfo.sizeLimit is set to 1048576.

    Additionally, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "tools.setInfo.sizeLimit" | Select Entity,

    Name, Value'
  remediation: 'To limit informational messages to 1 MB, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "tools.setInfo.sizeLimit" -value 1048576'
  checks:
  - type: manual_review
    info: 'To verify informational messages are limited to 1 MB, view the virtual machine

      configuration file and verify that tools.setInfo.sizeLimit is set to 1048576.

      Additionally, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "tools.setInfo.sizeLimit" | Select Entity,

      Name, Value'
    severity: medium
- id: 8.1.2
  title: (L2) Ensure only one remote console connection is permitted to a VM at any time
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: By default, remote console sessions can be connected to by more than one user at a time. Permit only one remote
    console connection to a VM at a time. Other attempts will be rejected until the first connection disconnects.
  rationale: When multiple sessions are activated, each terminal window gets a notification about the new session. If an administrator
    in the VM logs in using a VMware remote console during their session, a non-administrator in the VM can connect to the
    console and observe the administrator's actions. Also, this could result in an administrator losing console access to
    a VM. For example, if a jump box is being used for an open console session, and the admin loses a connection to that box,
    the console session remains open. Allowing two console sessions permits debugging via a shared session. For highest security,
    only one remote console session at a time should be allowed.
  impact: ''
  references:
  - 1. http://www.ibenit.com/post/85227299008/security-benchmark-hardening-guidepolicies-and-profile
  page_start: 120
  audit_raw: 'To verify that only one remote console session is permitted at a time, view the virtual

    machine configuration file and confirm that RemoteDisplay.maxConnections is set to 1.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select

    Entity, Name, Value'
  remediation: 'To permit only one remote console session at a time, run the following PowerCLI

    command for VMs that do not specify the setting:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "RemoteDisplay.maxConnections" -value 1

    Run the following PowerCLI command for VMs that specify the setting but have the

    wrong value for it:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "RemoteDisplay.maxConnections" -value 1 -

    Force'
  checks:
  - type: manual_review
    info: 'To verify that only one remote console session is permitted at a time, view the virtual

      machine configuration file and confirm that RemoteDisplay.maxConnections is set to 1.

      Alternately, the following PowerCLI command may be used:

      # List the VMs and their current settings

      Get-VM | Get-AdvancedSetting -Name "RemoteDisplay.maxConnections" | Select

      Entity, Name, Value'
    severity: medium
- id: 8.2.1
  title: (L1) Ensure unnecessary floppy devices are disconnected
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Ensure that no floppy device is connected to a virtual machine unless required. For a floppy device to be disconnected,
    the floppyX.present parameter should either not be present or have a value of FALSE.
  rationale: Removing unnecessary hardware devices can reduce the number of potential attack channels and help prevent attacks.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'To verify floppy drives are not connected, confirm that the following parameter is either

    NOT present or is set to FALSE: floppyX.present

    Alternately, the following PowerCLI command may be used:

    # Check for Floppy Devices attached to VMs

    Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState'
  remediation: 'To disconnect all floppy drives from VMs, run the following PowerCLI command:

    # Remove all Floppy drives attached to VMs

    Get-VM | Get-FloppyDrive | Remove-FloppyDrive

    The VM will need to be powered off for this change to take effect.'
  checks:
  - type: manual_review
    info: 'To verify floppy drives are not connected, confirm that the following parameter is either

      NOT present or is set to FALSE: floppyX.present

      Alternately, the following PowerCLI command may be used:

      # Check for Floppy Devices attached to VMs

      Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState'
    severity: medium
