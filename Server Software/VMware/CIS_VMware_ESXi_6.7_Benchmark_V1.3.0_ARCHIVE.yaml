- id: 8.4.1
  title: (L1) Ensure access to VMs through the dvfilter network APIs is configured correctly
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: A VM must be configured explicitly to accept access by the dvfilter network API. Only VMs that need to be accessed
    by that API should be configured to accept such access.
  rationale: An attacker might compromise a VM by making use of the dvfilter API.
  impact: ''
  references:
  - 1. http://kb.vmware.com/kb/1714
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-CD0783C9-1734-4B9AB821-ED17A77B0206.html
  page_start: 149
  audit_raw: 'To verify the configuration, perform the following if dvfilter access should be permitted:

    1. Verify that the following is in the VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter
    interface of the virtual machine

    that is to be protected, filter1 is the number of the filter that is being used, and

    dv-filter1 is the name of the particular data path kernel module that is

    protecting the VM.

    2. Ensure that the name of the data path kernel is set correctly.

    Perform the following to verify the configuration if dvfilter access should not be

    permitted:

    1. Verify that the following is not in the VMX file: ethernet0.filter1.name = dvfilter1.'
  remediation: 'To configure a VM to allow dvfilter access, perform the following steps:

    1. Configure the following in the VMX file: ethernet0.filter1.name = dv-filter1

    where ethernet0 is the network adapter interface of the virtual machine that is to

    be protected, filter1 is the number of the filter that is being used, and dv-filter1

    is the name of the particular data path kernel module that is protecting the VM.

    2. Set the name of the data path kernel correctly.

    To configure a VM to not allow dvfilter access, perform the following steps:

    1. Remove the following from its VMX file: ethernet0.filter1.name = dv-filter1.'
  checks:
  - type: manual_review
    info: 'To verify the configuration, perform the following if dvfilter access should be permitted:

      1. Verify that the following is in the VMX file: ethernet0.filter1.name = dvfilter1 where ethernet0 is the network adapter
      interface of the virtual machine

      that is to be protected, filter1 is the number of the filter that is being used, and

      dv-filter1 is the name of the particular data path kernel module that is

      protecting the VM.

      2. Ensure that the name of the data path kernel is set correctly.

      Perform th'
    severity: medium
- id: 8.4.2
  title: (L2) Ensure Autologon is disabled
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Autologon should be disabled if it is not needed.
  rationale: Some VMX parameters don't apply on vSphere because VMware virtual machines work on vSphere and hosted virtualization
    platforms such as Workstation and Fusion. The code paths for these features are not implemented in ESXi. Explicitly disabling
    these features, such as autologon, reduces the potential for vulnerabilities because it reduces the number of ways in
    which a guest can affect the host. Note that these are referenced for organizations that insist any documented setting,
    regardless of whether it is implemented in code or not, must have a value.
  impact: ''
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-60E83710-8295-41A29C9D-83DEBB6872C2.html
  page_start: 151
  audit_raw: 'To verify that autologon is disabled if not needed, check the virtual machine

    configuration file and verify that isolation.tools.ghi.autologon.disable is set to TRUE.

    Alternately, the following PowerCLI command may be used:

    # List the VMs and their current settings

    Get-VM | Get-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable"|

    Select Entity, Name, Value'
  remediation: 'To disable autologon, run the following PowerCLI command:

    # Add the setting to all VMs

    Get-VM | New-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable" -

    value $true'
  checks:
  - type: manual_review
    info: 'To verify that autologon is disabled if not needed, check the virtual machine

      configuration file and verify that isolation.tools.ghi.autologon.disable is set to TRUE.

      Alternately, the following PowerCLI command may be used:

      # List the VMs and their current settings

