  description: Minimize access to the Virtual Machine via VNC protocol.
  rationale: The VM console enables you to connect to the console of a virtual machine, in effect seeing what a monitor on
    a physical server would show. This console is also available via the VNC protocol. Setting up this access also involves
    setting up firewall rules on each ESXi server the virtual machine will run on.
  impact: Configuring VM settings and opening up the firewall means multiple steps to be configured and monitored.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.vm_admin.doc/GUID-BB1F20D3-339F-46F3B020-D19C9322C001.html
