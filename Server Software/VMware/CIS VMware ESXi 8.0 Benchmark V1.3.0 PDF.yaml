  description: 'Hardware firmware is not immune to serious issues affecting confidentiality, integrity, or availability. Vulnerable
    system management controllers & management engines can provide places for attackers to establish persistence, in order
    to re-infect and recompromise hosts after reboots and updates. Ensure that the latest firmware updates are applied to
    all components of your systems and that the firmware is authentic and supplied by your hardware manufacturer. UEFI Secure
    Boot is a security feature of the Unified Extensible Firmware Interface (UEFI) specification. Its primary purpose is to
    ensure that only signed and trusted boot loaders and operating system kernels are allowed to execute during the system
    startup. This helps protect systems from malware and unauthorized software that might try to run before the operating
    system loads. By verifying the digital signatures of bootable applications and drivers, Secure Boot prevents potentially
    harmful code from compromising the boot process. Intel Xeon Scalable Processor platforms have Trusted Execution Technology,
    or TXT, that help harden systems against malware, rootkits, BIOS & firmware attacks, and more. When enabled, ESXi will
    take advantage of security benefits offered by this technology. ESXi can use Trusted Platform Modules (TPM) 2.0 to enable
    advanced security features that prevent malware, remove dependencies, and secure hardware lifecycle operations. Many servers
    have integrated hardware management controllers that can be extremely helpful when monitoring and updating hardware, settings,
    and firmware. These controllers should be checked to ensure that ALL unused functionality is disabled, ALL unused access
    methods are disabled, passwords and password controls are set, and firewalling and access control is in place so that
    the only access is from authorized access workstations for the virtualization administration team. All "first boot" configuration
    options should be disabled, especially ones that reconfigure the system from USB devices that are inserted. Disable or
    protect USB ports attached to the management controllers. Where possible, USB ports should be set to only permit keyboards.
    Default passwords for accounts should be changed. External information displays should be secured to prevent information
    leakage. Power and information buttons should be secured against unauthorized use. Many hardware management controllers
    provide mechanisms for alerting when hardware faults & configuration changes occur. You should consider those if you are
    not using another method for hardware monitoring. Cryptography, audit logging, cluster operations, and incident response/forensics
    depend deeply on synchronized time. This recommendation extends to all devices in infrastructure. The recommendation for
    NTP is to have at least four sources. The host''s integrated hardware management controller provides critical out-of-band
    server oversight. For enhanced security, it is essential to configure this controller to log events remotely. This practice
    ensures that hardware-related logs are sent to an off-site location, protecting them from potential tampering and offering
    a centralized record of server health and activities. Connections to centralized authentication sources, like Active Directory,
    should be disabled or carefully considered as attack vectors and dependency loops (for authentication, authorization,
    DNS, DHCP, and time). Consider managing local accounts on these devices through the APIs and CLI interfaces provided.
    If Active Directory must be used for authentication do authorization locally so that an attacker with access to Active
    Directory cannot promote themselves through group membership. AMD EPYC platforms support SEV-ES, a technology to encrypt
    memory and CPU register state, and limit visibility to the hypervisor, in order to increase workload security and decrease
    exposure to certain types of attacks. When configured properly, vSphere supports the use of SEV-ES inside guest virtual
    machines and containers under vSphere and vSphere with Tanzu. Enabling SEV-ES in system firmware eases future enablement
    inside virtual machines, containers, and guest OSes. Intel Xeon Scalable Processor platforms have Software Guard Extensions,
    or SGX, a technology that helps applications protect data in system memory. When configured properly, vSphere supports
    the use of SGX inside guest virtual machines. Enabling SGX in system firmware eases future enablement inside virtual machines
    and guest OSes. Unused ports, especially USB, can be used by attackers to attach storage, networking, and keyboards. Take
    reasonable steps to control access to these ports through disablement, access control, and/or with other means such as
    solid rack doors, rack side panels, and flooring that makes the ports inaccessible from outside the rack when the rack
    door is closed. Cables fit easily through many gaps in and around racks and rack doors, and stiff wires can be used to
    push them into sockets from outside the rack, as well as to dislodge cables to create a service disruption. Where possible,
    USB ports should also be set to only permit keyboards. When disabling functionality like this please consider that you
    may need to access the server using a USB keyboard during an outage or as part of lifecycle operations, and plan accordingly.
    Many servers have integrated hardware management controllers with the ability to present virtual network interfaces to
    ESXi as a management interface. These approaches create potential backdoors for access and are used by adversaries to
    circumvent network-based/perimeter firewalls, in either direction, and avoid observation by IDS/IPS/threat analysis tools.
    In many cases this functionality is not strictly necessary to manage hosts. The "End of General Support" (EOGS) status
    indicates that the software version has exceeded its primary support lifecycle, during which VMware provides new security
    patches, bug fixes, and technical assistance. When a product reaches this status, VMware no longer releases security updates
    for that version for customers outside of an extended support contract. Thus, systems still running software past its
    EOGS are potentially exposed to unpatched vulnerabilities and other security risks. Applying updates in a timely manner
    according to the severity of issues contributes greatly to the resilience of an environment. When applying updates, it
    is recommended to update vCenter Server first, if an update is available, and then proceed with updating ESXi. This sequence
    ensures that the management layer is updated before updating the ESXi hosts. VMware publishes advisories on security vulnerabilities;
    for proactive notifications please subscribe to the mailing list at https://www.vmware.com/security/advisories.html Enabling
    Secure Boot enforcement ensures that the host only loads UEFI drivers and applications with valid digital signatures,
    as part of the UEFI firmware standard. It requires support from the server''s BIOS and hypervisor boot loader, and mandates
    that all ESXi kernel modules, drivers, and VIBs be signed by VMware or a trusted partner subordinate. The acceptance level
    on ESXi regulates the type of software that can be installed on the system, with four distinct levels: VMwareCertified,
    VMwareAccepted, PartnerSupported, and CommunitySupported. It''s advised to set the acceptance level to PartnerSupported
    or higher to ensure that only tested and digitally signed vSphere Installation Bundles (VIBs) are allowed for installation.
    The ESXi host is configured to only execute binaries originating from a valid, signed vSphere Installable Bundle (VIB)
    to enhance the integrity of the system. This measure thwarts attackers'' attempts to use prebuilt toolkits on the host.
    The parameter governing this behavior is VMkernel.Boot.execInstalledOnly with a recommended setting of True. Ensuring
    reliable time synchronization is crucial as various functions like cryptography, audit logging, cluster operations, and
    incident response/forensics are heavily dependent on synchronized time. Utilizing at least four NTP sources is recommended
    for achieving reliable time synchronization. Alternatively, PTP can be employed for sub-millisecond time accuracy, with
    NTP configured as a backup to maintain time synchronization resilience in case of primary server failure. Ensure the host
    has time synchronization services enabled and operational as many functions such as cryptography, audit logging, cluster
    operations, and incident response/forensics depend on synchronized time. Services like NTP or PTP should be configured
    to start with the host and remain running to maintain time synchronization. The host should enforce TPM-based configuration
    encryption to secure its configuration files, notably within the /etc/ directory or other namespaces. From vSphere 7.0
    Update 2 onwards, configuration files archived are encrypted, leveraging a Trusted Platform Module (TPM) to "seal" the
    configuration to the host, thereby enhancing security against offline attacks. This encryption, once enabled, is irreversible
    and utilizes the physical TPM present during installation or upgrade. It is imperative to retain hyperthreading security
    warnings as they indicate unmitigated CPU vulnerabilities. The parameter governing this behavior is UserVars.SuppressHyperthreadWarning,
    with a recommended setting of 0. Transparent Page Sharing (TPS) aids in optimizing memory usage among virtual machines
    but under certain circumstances can be exploited to access data on adjacent virtual machines unauthorizedly. By configuring
    the Mem.ShareForceSalting parameter, inter-VM TPS is restricted, enhancing isolation and security. The parameter governing
    this behavior is Mem.ShareForceSalting with a recommended setting of 2. Starting with vSphere 8.0, ESXi has enhanced its
    entropy implementation to align with FIPS 140-3 and EAL4 certifications, ensuring a robust foundation for cryptographic
    operations. Kernel boot options dictate the activation of entropy sources on an ESXi host. The parameter governing this
    behavior is disableHwrng = FALSE and entropySources = 0. By default, ESXi ensures that pages allocated for virtual machines
    (VMs), userspace applications, and kernel threads are zeroed out at the time of allocation, to prevent the exposure of
    sensitive data like cryptographic keys to other clients. However, these keys can remain in host memory for an extended
    period if the memory is not reused. The Mem.MemEagerZero parameter can be configured to enforce the zeroing out of userworld
    and guest memory pages when a userworld process or guest exits, and for kernel threads, memory spaces holding keys are
    zeroed out as soon as the secret is no longer needed. This practice adheres to the NIAP Virtualization Protection Profile
    and Server Virtualization Extended Package requirements of zeroing memory that may contain cryptographic keys upon process
    exit. The parameter governing this behavior is Mem.MemEagerZero with a recommended setting of 1. Secure Shell (SSH) provides
    remote access to the ESXi shell, enabling direct host console access or remote connectivity. Deactivating SSH is a security
    measure aimed at minimizing remote access channels to the ESXi host, restricting it to essential connections only through
    vSphere Client, vCLI/PowerCLI, or published APIs. The service status should be set to "Stopped", allowing manual start
    and stop for troubleshooting or diagnostic activities when necessary. The ESXi shell is an interactive command line environment
    available from the Direct Console User Interface (DCUI) or remotely via SSH. Activities performed from the ESXi Shell
    bypass all access controls, but are logged. The recommended setting for the ESXi shell is to be stopped and only started
    manually when needed, such as when running diagnostics or troubleshooting. The Managed Object Browser (MOB) is a web-based
    server application that lets you examine and change system objects and configurations. It is a prudent security measure
    to deactivate the MOB unless it''s essential for operations. The parameter governing this behavior is Config.HostAgent.plugins.solo.enableMob
    with a recommended setting of False. The Service Location Protocol (SLP) is used for the discovery and selection of network
    services in local area networks, which simplifies configuration by allowing computers to find necessary services automatically.
    The practice of deactivating SLP when not in use aligns with the principle of minimizing the attack surface by shutting
    down non-essential services. The recommended setting is to have the SLP service stopped, with the ability to start and
    stop it manually as required. Deactivating the Common Information Model (CIM) service, when not in use, aligns with the
    principle of minimizing the attack surface by disabling non-essential services. This action helps in reducing the potential
    vectors of attack, thus bolstering the host''s security posture. Simple Network Management Protocol (SNMP) facilitates
    the management of networked devices. Minimize attack surface by disabling non-essential services. The recommended setting
    is to have the SNMP service stopped unless required and configured securely. By configuring a session timeout, unattended
    console sessions are automatically terminated, thereby reducing the potential security risks associated with lingering
    active sessions. The parameter governing this behavior is UserVars.DcuiTimeOut, with a recommended setting of 600 (10
    minutes). The host should be configured to automatically terminate idle shell sessions to prevent potential unauthorized
    access due to forgotten logouts. Setting a timeout for idle SSH connections ensures that any unattended sessions are closed,
    thereby reducing the security risk. The parameter governing this behavior is UserVars. Enabling the automatic deactivation
    of shell services minimizes the attack surface on the host. The time window for the ESXi Shell and SSH services'' availability
    is defined by UserVars.ESXiShellTimeOut, after which these services are terminated. The recommended setting for this parameter
    is 3600. Having warnings for enabled SSH or ESXi Shell provides insight into potential security risks. Disabling such
    warnings can mask ongoing attacks. The parameter governing this behavior is UserVars.SuppressShellWarning with a recommended
    value of 0. The enforcement of password complexity is managed through the Security.PasswordQualityControl parameter, allowing
    configuration of password length, character set requirements, and failed logon attempt restrictions. The recommended setting
    is "retry=3 min=disabled,15,15,15,15 max=64 similar=deny passphrase=3". The security control involves restricting account
    access following a specified number of failed login attempts, acting as a deterrent against brute-force attacks. This
    control is applicable for SSH and vSphere Web Services SDK access, though not for the Direct Console Interface (DCUI)
    and the ESXi Shell. A default setting allows five failed attempts before account lockout, with automatic unlock after
    15 minutes. The parameter governing this behavior is Security.AccountLockFailures with a recommended setting of 5. Ensuring
    that user accounts on the ESXi host are automatically unlocked after a specified period contributes to a balance between
    security and operational usability. This mechanism reactivates idle accounts promptly while mitigating potential unauthorized
    access risks. It''s configured through a specific parameter which, when adjusted, defines the duration of the lockout
    period. The parameter governing this behavior is Security.AccountUnlockTime with a recommended setting of 900 seconds.
    The goal is to inhibit the reuse of past passwords, acting as a deterrent against potential security breaches stemming
    from the exploitation of old, compromised credentials. This is achieved by configuring the Security.PasswordHistory parameter,
    which specifies the number of unique passwords a user must cycle through before a previous password can be reused. The
    recommended setting for this parameter is 5. Implementing a maximum password age, as determined by the Security.PasswordMaxDays
    parameter, is aligned with modern password policies outlined in NIST 800-63B Section 5.1.1.2, which argue against forced
    periodic password changes provided that passwords have sufficient complexity. The parameter governing this behavior is
    Security.PasswordMaxDays with a recommended setting of 99999. A designated timeout ensures that sessions are not left
    open indefinitely, thereby reducing the exposure window for potential security threats. The parameter governing this behavior
    is Config.HostAgent.vmacore.soap.sessionTimeout with a recommended setting of 30 seconds. Configuring the host to automatically
    terminate idle host client sessions helps mitigate security risks associated with unattended sessions, which could potentially
    be exploited. The recommended setting for this control is a timeout value of 900. The parameter governing this behavior
    is UserVars.HostClientSessionTimeout. The DCUI.Access parameter in VMware ESXi is used to specify a list of users who
    are permitted to access the Direct Console User Interface (DCUI) of the ESXi host, especially when Lockdown Mode is enabled.
    This parameter helps in controlling and securing access to the ESXi host by allowing only authorized users to override
    Lockdown Mode and access the DCUI, particularly in scenarios where the host becomes isolated from vCenter. The parameter
    governing this behavior is DCUI.Access. Establishing an accurate Exception Users list is essential for managing user privileges
    during lockdown mode. Users on this list retain their privileges, making it imperative to include only those necessary
    for direct host access like service accounts for third-party solutions. Ensuring a well-maintained list mitigates the
    risk associated with unauthorized actions, especially during host isolation scenarios in lockdown mode. Implementing lockdown
    mode restricts direct access to ESXi hosts, mandating management via vCenter Server to uphold defined roles and access
    controls, mitigating risks associated with unauthorized or insufficiently audited activities. Exception Users list serves
    as an override mechanism, permitting specified users direct access even in lockdown mode. This mode offers a balanced
    approach between security and operational flexibility compared to the stricter lockdown mode which, if connectivity to
    vCenter Server is lost, necessitates host rebuilding. Enabling lockdown mode disables direct local access to an ESXi host,
    requiring the host be managed remotely from vCenter Server. There are some operations, such as backup and troubleshooting,
    that require direct access to the host. In these cases, lockdown mode can be disabled on a temporary basis for specific
    hosts as needed, and then re-enabled when the task is completed. Note: Lockdown mode does not apply to users who log in
    using authorized keys. Also, users in the DCUI.Access list for each host are allowed to override lockdown mode and log
    in to the DCUI. By default, the "root" user is the only user listed in the DCUI.Access list. The dcui account, utilized
    for process isolation for the Direct Console User Interface (DCUI), possesses shell access which, when deactivated, minimizes
    the attack surface. This action is a proactive measure to enhance system security. Deactivating shell access for the vpxuser
    account enhances security by enforcing an "API only" stance for predefined non-root ESXi users such as vpxuser and dcui.
    Enabling a login banner on the Direct Console User Interface (DCUI) and the Host Client interfaces provides a mechanism
    to display legal notices or organizational announcements at login. The parameter governing this behavior is Annotations.WelcomeMessage,
    with the recommended value being a text string aligned with organizational or legal advisories. ESXi facilitates the display
    of a login message, primarily aimed to deter unauthorized access and inform legitimate users regarding system usage obligations,
    particularly during SSH connections. The text for this display is defined by a specific parameter, which is advisable
    to be configured, especially when SSH is active, albeit it''s recommended to keep SSH in a stopped state barring troubleshooting
    scenarios. The parameter governing this behavior is Config.Etc.Issue. The host should be configured to operate using the
    highest version of TLS supported to ensure secure communications. ESXi 8, by default, comes with TLS 1.2 enabled, although
    re-enabling other protocols is possible if required. Employing the highest version of TLS aids in protecting against known
    vulnerabilities present in older versions. The parameter governing this behavior is UserVars.ESXiVPsDisabledProtocols
    with the recommended setting of "sslv3,tlsv1,tlsv1.1". Configure the Syslog.global.logDir parameter to specify a persistent
    directory for system logs, ensuring they are retained across reboots. This can be set to a directory on mounted NFS or
    VMFS volumes, other than the default which is an in-memory filesystem that retains only a single day''s worth of logs.
    Transmitting system logs to a remote log collector ensures that ESXi logs are stored in a secure and centralized manner.
    This centralization not only allows for the streamlined monitoring of all hosts through a single tool but also facilitates
    aggregate analysis and searching capabilities. Set the Syslog.global.logLevel parameter to "info" to ensure that audit
    logs capture sufficient information for diagnosing issues and investigating security events. This setting strikes a balance
    between log verbosity and storage utilization. The parameter governing this behavior is Syslog.global.logLevel with a
    recommended setting of info. Set the logging informational level to "info" via the Config.HostAgent.log.level parameter
    to ensure audit logs contain adequate data for diagnostics and forensics. This level provides a balanced amount of detail,
    suitable for routine analysis and investigation. The parameter governing this behavior is Config.HostAgent.log.level with
    a recommended setting of info. Log filtering can be employed to diminish the frequency of repetitive log entries and to
    preclude specific log events entirely. By employing the Syslog.global.logFilters configuration parameter, one can stipulate
    filtering criteria, which when met, will cause the designated log events to be excluded from the system logs. The control
    aids in maintaining a clean, informative logging environment by filtering out unwanted or redundant log entries. The parameter
    governing this behavior is Syslog.global.logFiltersEnable with a recommended setting of FALSE. Enabling audit record logging
    on ESXi hosts ensures the local storage of audit records, providing a trail of activities performed on the host. This
    measure is pivotal for accountability, troubleshooting, and security investigations. The parameter governing this behavior
    is Syslog.global.auditRecord.storageEnable with a recommended setting of TRUE. Configuring a persistent log location for
    locally stored audit records on ESXi hosts is critical to ensure audit continuity. When the "/scratch" directory is linked
    to "/tmp/scratch", only a day''s worth of records are retained, and they are reinitialized upon each reboot, creating
    a security risk. A persistent datastore, except a vSAN datastore, should be designated for audit record logging to preserve
    records across reboots. The parameter governing this behavior is Syslog.global.auditRecord.storageDirectory. Ensuring
    a local storage capacity for a week''s worth of audit records is imperative, especially when a remote audit record storage
    facility is used. This provision is critical during anticipated interruptions in record delivery to the remote facility,
    preventing loss or overwriting of audit records. The parameter governing this behavior is Syslog.global.auditRecord.storageCapacity
    with a recommended setting of 100. This control enables the forwarding of audit records from the ESXi host to a designated
    log collector, aiding in real-time monitoring and analysis. The parameter governing this behavior is Syslog.global.auditRecord.remoteEnable
    with a recommended setting of TRUE. When engaging in remote logging activities, it is of utmost importance to ensure that
    the logging endpoint is genuine and secure. To achieve this, hosts should verify the TLS certificates of these endpoints.
    This verification provides assurance that the endpoint is both authentic and trustworthy, mitigating the risk of transmitting
    logs to potentially malicious or untrusted entities. The parameter governing this behavior is Syslog.global.certificate.checkSSLCerts
    with a recommended setting of TRUE. When employing remote logging with TLS-enabled endpoints, it is essential to ensure
    the utmost integrity and authenticity of the certificates in use. The "x509-strict" option provides a higher level of
    security by performing additional validity checks on CA root certificates during the verification process. This increased
    scrutiny ensures that only genuinely authenticated and trusted certificates are accepted, minimizing potential vulnerabilities.
    The parameter governing this behavior is Syslog.global.certificate.strictX509Compliance with a recommended setting of
    TRUE. The host''s firewall is designed to block all incoming and outgoing network traffic by default, unless exceptions
    are explicitly made, thus minimizing the attack surface and barring unauthorized access. The firewall settings, while
    simplistic, are akin to router ACLs, and might require reflexive rules to be configured for certain network scenarios.
    Through the VMware Host Client, restrictions can be placed on a per-IP basis to only allow traffic from authorized networks,
    aligning with the security control''s recommended value of permitting connections solely from authorized infrastructure
    and administration workstations. By default, the host is configured to block all incoming and outgoing network traffic,
    except for the traffic pertaining to services enabled in the host security profile. This configuration is pivotal in reducing
    the attack surface and averting unauthorized access to the host. Even though there isn''t a specific configuration parameter
    provided, the firewall settings are manageable through the VMware Host Client, wherein rules can be specified to allow
    or deny traffic for each service on a per-IP basis, ensuring only authorized networks have access. The Net.DVFilterBindIpAddress
    parameter controls the use of the dvFilter network API, allowing network information to be sent to a specified IP address.
    If enabled with a compromised IP address, unauthorized network access to other virtual machines on the host could occur.
    It''s essential to keep this parameter unconfigured, unless required by a product like VMware NSX. The parameter governing
    this behavior is Net.DVFilterBindIpAddress with a recommended setting of "". To prevent cascading lockout of uplink interfaces
    from the ESXi host, the Net.BlockGuestBPDU parameter can be set to 1, enabling BPDU Filter to drop BPDU packets sent from
    virtual machines to the physical switch. This is crucial as ESXi''s Standard and Distributed Virtual Switches do not support
    STP, making them prone to network loops if BPDUs are unfiltered. The parameter governing this behavior is Net.BlockGuestBPDU
    with a recommended setting of 1. Hardware management controllers may present virtual or USB NICs to the host, potentially
    serving as backdoors if left active. It''s recommended to deactivate these interfaces both in the hardware configuration
    and within ESXi to prevent unauthorized access. The parameter governing this behavior is Net.BMCNetworkEnable with a recommended
    value of 0. Setting the "Forged transmits" option to "Reject" helps prevent MAC impersonation by comparing the source
    MAC address from the guest operating system with the effective MAC address of its virtual machine adapter. If there''s
    a mismatch, the packet is dropped, preventing potential malicious activities through impersonated MAC addresses. Enforcing
    MAC address stability on standard virtual switches and port groups prevents MAC impersonation by disallowing changes to
    the MAC address by virtual machines. This mitigates the risk of malicious activities initiated by impersonating authorized
    network adapters. Enabling promiscuous mode allows all virtual machines in a port group to read all packets transmitted
    across it, regardless of the intended recipient. Rejecting promiscuous mode requests on standard virtual switches and
    port groups prevents unauthorized packet inspection, enhancing network isolation and data privacy. ESXi does not use the
    concept of native VLAN, so do not configure port groups to use the native VLAN ID. If the default value of 1 for the native
    VLAN is being used, the ESXi Server virtual switch port groups should be configured with any value between 2 and 4094.
    Otherwise, ensure that the port group is not configured to use whatever value is set for the native VLAN. When a port
    group is set to VLAN 4095 on standard virtual switches, it enables Virtual Guest Tagging (VGT), letting all network frames
    pass to the attached virtual machines (VMs) without altering the VLAN tags. This requires VMs to process VLAN information
    themselves via an 802.1Q driver. Only authorized and capable VMs should be allowed to use VGT to prevent potential network
    issues like denial of service or unauthorized VLAN traffic interaction. Ensure that only vmk interfaces designated for
    management purposes have management services enabled to uphold network isolation and security. Incorrect configuration
    may undermine security efforts by breaching network isolation principles.'
  rationale: To ensure the integrity, security, and optimal performance of server hardware, it is essential to maintain system
    and device firmware that is verifiable, genuine, and current. Enabling UEFI Secure Boot on the ESXi host hardware helps
    prevent malware and untrusted configurations. Enabling Intel TXT (Trusted Execution Technology) on host hardware, when
    available, provides a hardware-based foundation for security. Enabling and configuring TPM 2.0 on host hardware ensures
    enhanced security by providing hardware-level cryptographic operations and secure storage for sensitive data and keys.
    Ensuring the host integrated hardware management controller enables time synchronization provides a consistent and accurate
    timestamp for logs and events, which is crucial for auditing, troubleshooting, and identifying security incidents. Enabling
    remote logging of events on the integrated hardware management controller ensures that all hardware-level activities are
    securely recorded off-site, providing traceability, mitigating data tampering risks, and facilitating incident response.
    To prevent unauthorized access and potential malicious control of server hardware functions, it's essential to ensure
    that the integrated hardware management controller utilizes secure authentication mechanisms. Enabling AMD SEV-ES (Secure
    Encrypted Virtualization-Encrypted State) on host hardware enhances the security of virtual machines by encrypting their
    memory and CPU state, reducing the risk of unauthorized data access and tampering from compromised hypervisors or malicious
    actors. Intel SGX (Software Guard Extensions) provides hardware-based memory encryption that protects sensitive data from
    unauthorized access or modification by malicious software running at higher privilege levels, enhancing server security.
    Unused external hardware ports can be exploited as potential entry points for unauthorized devices and malicious activity,
    thereby compromising server security. Using integrated hardware management controllers to present virtual network interfaces
    to ESXi can inadvertently create backdoors, allowing adversaries to bypass firewalls and evade detection by security tools;
    often, this functionality isn't essential for host management. Running software beyond its EOGS can compromise the integrity,
    availability, and confidentiality of virtual environments. Keeping VMware ESXi software versions within the support period
    ensures that organizations have access to the latest security patches, critical updates, and vendor support. Issues in
    software that impact confidentiality, integrity, and/or availability can only be removed through patching to a version
    that resolves the issue. Threat actors exploit known vulnerabilities when attempting to gain unauthorized access or elevate
    privileges on an ESXi host. Organizations should enable Secure Boot enforcement to enhance the security of their virtual
    environments. Requiring valid digital signatures for UEFI drivers and apps mitigates the risk of offline attacks, where
    an attacker could transfer the ESXi install drive to a non-Secure Boot host and boot it without detection. This control
    establishes a trusted boot process, reducing the risk of unauthorized access and maintaining the integrity of the ESXi
    host. The ESXi Image Profile should only allow signed VIBs because an unsigned VIB represents untested code installed
    on an ESXi host. Also, use of unsigned VIBs will cause hypervisor Secure Boot to fail to configure. Community Supported
    VIBs do not have digital signatures. To protect the security and integrity of your ESXi hosts, do not allow unsigned (CommunitySupported)
    VIBs to be installed on your hosts. Ensuring the execution of only signed binaries significantly mitigates the risk of
    running malicious or unverified code, thus enhancing the host’s security posture. Reliable time synchronization supports
    accurate auditing, cryptographic integrity, cluster operations, and effective incident response/forensics. Having multiple
    time sources enhances the reliability and accuracy of time synchronization, which is fundamental for secure and efficient
    system operations. Having accurate time synchronization is crucial for the correct operation and auditing of the system.
    This will assist in incident response, forensics, and ensure that cryptographic functions operate correctly. Implementing
    TPM-based configuration encryption significantly bolsters security by protecting configuration files from unauthorized
    access and alterations. This measure is crucial for safeguarding the integrity of host configurations and preventing potential
    offline attacks. Retaining these warnings ensures that potential CPU vulnerabilities are not overlooked, promoting a proactive
    approach towards addressing hardware-related security concerns. Restricting inter-VM TPS is crucial to prevent potential
    unauthorized access to data, ensuring an extra layer of isolation and security between virtual machines which is indispensable
    especially in a multi-tenant environment. Employing adequate entropy is crucial for ensuring the strength of cryptographic
    operations. Enabling volatile key destruction through the Mem.MemEagerZero parameter enhances the security posture by
    ensuring that sensitive information such as cryptographic keys are not left residually in the system memory, which could
    be exploited by malicious entities. This configuration aligns with the guidelines provided by the NIAP Virtualization
    Protection Profile and Server Virtualization Extended Package, indicating its criticality in maintaining a secure virtualized
    environment. Limiting remote access by deactivating SSH reduces potential attack vectors, promoting a secure operating
    environment. Enabling SSH only for diagnostics or troubleshooting ensures controlled access, aligning with security best
    practices. Ensuring non-essential services like the ESXi Shell are deactivated enhances the security posture. Deactivating
    non-essential services like MOB adheres to the principle of least functionality, reducing potential attack vectors. Deactivating
    non-essential services like SLP minimizes potential vectors of attack, thereby enhancing the host's security posture.
