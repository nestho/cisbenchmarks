  audit_raw: "Verify that the patches are up to date. The following PowerCLI snippet will provide a list\nof all installed\
    \ patches:\nForeach ($VMHost in Get-VMHost ) {\n    $EsxCli = Get-EsxCli -VMHost $VMHost -V2\n    $EsxCli.software.vib.list.invoke()\
    \ | Select-Object\n@{N=\"VMHost\";E={$VMHost}},*\n}\nYou may also manage updates via VMware Lifecycle Manager located\
    \ under Menu,\nLifecycle Manager.\nTo verify the host image profile acceptance level perform the following:\n1. From the\
    \ vSphere Web Client, select the host.\n2. Click Configure, then under System select Security Profile.\n3. Under Host\
    \ Image Profile Acceptance Level ensure it is set to one of the\nfollowing - \"VMware Certified\", \"VMware Accepted\"\
    , or \"Partner Supported\".\nThis may also be performed as follows:\n1. Connect to each ESX/ESXi host using the ESXi Shell\
    \ or vCLI, and execute the\ncommand esxcli software acceptance get to verify the acceptance level is\nat either \"VMware\
    \ Certified\", \"VMware Accepted\", or \"Partner Supported\".\n2. Connect to each ESX/ESXi host using the vCLI, and execute\
    \ the command\nesxcli software vib list to verify the acceptance level for each VIB is either\n\"VMware Certified\", \"\
    VMware Accepted\", or \"Partner Supported\".\nAdditionally, the following PowerCLI command may be used:\n# List the Software\
    \ AcceptanceLevel for each host\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $VMHost |\
    \ Select Name,\n@{N=\"AcceptanceLevel\";E={$ESXCli.software.acceptance.get()}}\n}\n# List only the vibs which are not\
    \ at \"VMwareCertified\" or \"VMwareAccepted\"\nor \"PartnerSupported\" acceptance level\nForeach ($VMHost in Get-VMHost\
    \ ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.software.vib.list() | Where { ($_.AcceptanceLevel -ne\n\"VMwareCertified\"\
    ) -and ($_.AcceptanceLevel -ne \"VMwareAccepted\") -and\n($_.AcceptanceLevel -ne \"PartnerSupported\") }\n}\nTo confirm\
    \ NTP synchronization is enabled and properly configured, perform the\nfollowing from the vSphere Web Client:\n1. Select\
    \ a host\n2. Click Configure then expand System then select Time Configuration.\n3. Verify that Time Synchronization is\
    \ set to Automatic\n4. Verify that the NTP Client is set to Enabled\n5. Verify that the NTP Service Status is Running\n\
    6. Verify that appropriate NTP servers are set.\nAdditionally, the following PowerCLI command may be used:\n# List the\
    \ NTP Settings for all hosts\nGet-VMHost | Select Name, @{N=\"NTPSetting\";E={$_ | Get-VMHostNtpServer}}\nFrom the vSphere\
    \ Web Client:\n1. Select a host\n2. Click Configure then expand System then select Advanced System settings.\n3. Click\
    \ Edit then Filter for Mem.ShareForceSalting.\n4. Verify that it is set to 2.\nAdditionally the following PowerCLI command\
    \ can be used:\nGet-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting\nTo verify SSH is disabled, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Select Configure then expand System and select Services.\n3. Click\
    \ on SSH then click Edit Startup Policy.\n4. Verify the Startup Policy is set to Start and Stop Manually.\nAlternately,\
    \ the following PowerCLI command may be used:\n# Check if SSH is running and set to start\nGet-VMHost | Get-VMHostService\
    \ | Where { $_.key -eq \"TSM-SSH\" } | Select\nVMHost, Key, Label, Policy, Running, Required\nNote: A host warning is\
    \ displayed in the web client whenever SSH is enabled on a host.\nTo verify the ESXi shell is disabled, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Select Configure then expand System and select Services.\n3. Click\
    \ on ESXi Shell then click Edit Startup Policy.\n4. Verify the Startup Policy is set to Start and Stop Manually.\nAlternately,\
    \ the following PowerCLI command may be used:\n# Check if the ESXi shell is running and set to start\nGet-VMHost | Get-VMHostService\
    \ | Where { $_.key -eq \"TSM\" } | Select VMHost,\nKey, Label, Policy, Running, Required\nNote: A host warning is displayed\
    \ in the web client whenever the ESXi shell is enabled\non a host.\nTo confirm whether MOB is enabled, perform the following\
    \ from the vSphere Web\nClient:\n1. Select a host\n2. Click Configure then expand System then select Advanced System Settings.\n\
    3. Click Edit then search for Config.HostAgent.plugins.solo.enableMob\n4. Verify the value is set to false.\nTo determine\
    \ if the MOB is enabled, run the following command from the ESXi shell:\nvim-cmd proxysvc/service_list\nAdditionally,\
    \ the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting -Name\nConfig.HostAgent.plugins.solo.enableMob\n\
    To verify the DCUI timeout setting, perform the following steps:\n1. From the vSphere Web Client, select the host.\n2.\
    \ Click Configure, then under System select Advanced System Settings.\n3. Select Edit then enter UserVars.DcuiTimeOut\
    \ in the filter.\n4. Verify that the value for this parameter is 600 seconds or less.\nAlternately, the following PowerCLI\
    \ command may be used:\nGet-VMHost | Get-AdvancedSetting -Name UserVars.DcuiTimeOut\nTo verify the timeout is set correctly,\
    \ perform the following from the vSphere web client:\n1. From the vSphere Web Client, select the host.\n2. Click Configure\
    \ then expand System.\n3. Select Advanced System Settings then click Edit.\n4. Enter ESXiShellInteractiveTimeOut in the\
    \ filter.\n5. Verify that the value for this parameter is set to 300 or less.\nNote: A value of 0 disables the ESXiShellInteractiveTimeOut.\n\
    Alternately, the following PowerCLI command may be used:\n# List UserVars.ESXiShellInteractiveTimeOut for each host\n\
    Get-VMHost | Select Name, @{N=\"UserVars.ESXiShellInteractiveTimeOut\";E={$_ |\nGet-AdvancedSetting UserVars.ESXiShellInteractiveTimeOut\
    \ | Select -\nExpandProperty Values}}\nTo verify the timeout is set to one hour or less, perform the following from the\
    \ vSphere\nweb client:\n1. From the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n3. Select\
    \ Advanced System Settings then click Edit.\n4. Enter ESXiShellTimeOut in the filter.\n5. Verify that the value for this\
    \ parameter is set to 3600 (1 hour) or less.\nAlternately, the following PowerCLI command may be used:\n# List UserVars.ESXiShellTimeOut\
    \ in minutes for each host\nGet-VMHost | Select Name, @{N=\"UserVars.ESXiShellTimeOut\";E={$_ | GetAdvancedSettings UserVars.ESXiShellTimeOut\
    \ | Select -ExpandProperty Values}}\nTo confirm password complexity requirements are set run the following PowerCLI\n\
    command:\nGet-VMHOST | Get-AdvancedSetting -Name “Security.PasswordQualityControl\" |\nSet-AdvancedSetting -Value \"retry=3\n\
    min=disabled,disabled,disabled,disabled,20\"\n• Confirm N0 is set to disabled.\n• Confirm N1 is set to disabled.\n• Confirm\
    \ N2 is set to disabled.\n• Confirm N3 is set to disabled.\n• Confirm N4 is set to 15 or greater.\nThe above requires\
    \ all passwords to be 15 or more characters long and comprised of at\nleast one character from four distinct character\
    \ sets.\nTo verify the maximum failed login attempts is set properly, perform the following steps:\n1. From the vSphere\
    \ Web Client, select the host.\n2. Click Configure then expand System.\n3. Select Advanced System Settings then click\
    \ Edit.\n4. Enter Security.AccountLockFailures in the filter.\n5. Verify that the value for this parameter is set to 5.\n\
    Alternately, the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting -Name Security.AccountLockFailures\n\
    To verify the account lockout is set to 15 minutes, perform the following:\n1. From the vSphere Web Client, select the\
    \ host.\n2. Click Configure then expand System.\n3. Select Advanced System Settings then click Edit.\n4. Enter Security.AccountUnlockTime\
    \ in the filter.\n5. Verify that the value for this parameter is set to 900.\nAlternately, the following PowerCLI command\
    \ may be used:\nGet-VMHost | Get-AdvancedSetting -Name Security.AccountUnlockTime\nTo verify the password history is set\
    \ to 5, perform the following:\n1. From the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n\
    3. Select Advanced System Settings then click Edit.\n4. Enter Security.PasswordHistory in the filter.\n5. Verify that\
    \ the value for this parameter is set to 5.\nAlternately, the following PowerCLI command may be used:\nGet-VMHost | Get-AdvancedSetting\
    \ Security.PasswordHistory\nTo verify a proper trusted users list is set for DCUI, perform the following from the\nvSphere\
    \ web client:\n1. From the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n3. Select Advanced\
    \ System Settings then click Edit.\n4. Enter DCUI.Access in the filter.\n5. Verify that the DCUI.Access attribute is set\
    \ to a comma-separated list of the\nusers who are allowed to override lockdown mode.\nAlternately, the following PowerCLI\
    \ command may be used:\nGet-VMHost | Get-AdvancedSetting -Name DCUI.Access\nTo verify the membership of the \"Exception\
    \ Users\" list, perform the following in the\nvSphere Web Client:\n1. Select the host.\n2. Click on Configure then expand\
    \ System and select Security Profile.\n3. Under Lockdown Mode view and verify the list of Exception Users for accuracy.\n\
    To verify lockdown mode is enabled, perform the following from the vSphere web client:\n1. From the vSphere Web Client,\
    \ select the host.\n2. Select Configure then expand System and select Security Profile.\n3. Verify that Lockdown Mode\
    \ is set to Normal or 'Strict'.\nAlternately, the following PowerCLI command may be used:\n# To check if Lockdown mode\
    \ is enabled\nGet-VMHost | Select\nName,@{N=\"Lockdown\";E={$_.Extensiondata.Config.adminDisabled}}\nTo verify lockdown\
    \ mode is enabled, perform the following from the vSphere web client:\n1. From the vSphere Web Client, select the host.\n\
    2. Select Configure then expand System and select Security Profile.\n3. Verify that Lockdown Mode is set to Strict.\n\
    Alternately, the following PowerCLI command may be used:\n# To check if Lockdown mode is enabled\nGet-VMHost | Select\n\
    Name,@{N=\"Lockdown\";E={$_.Extensiondata.Config.adminDisabled}}\nTo verify persistent logging is configured properly,\
    \ perform the following from the\nvSphere web client:\n1. Select the host\n2. Click Configure then expand System then\
    \ select Advanced System Settings.\n3. Select Edit then enter Syslog.global.LogDir in the filter.\n4. Ensure Syslog.global.logDir\
    \ field is not empty (null value) or is not set\nexplicitly to a non-persistent datastore or a scratch partition.\nIf\
    \ the Syslog.global.logDir parameter is pointing to 'Scratch' location (i.e. empty (null\nvalue) or is not set explicitly\
    \ to a non-persistent datastore or a scratch partition), then\nensure that the 'ScratchConfig.CurrentScratchLocation'\
    \ parameter is also pointing to\npersistent storage.\nAlternatively, the following PowerCLI command may be used:\n# List\
    \ Syslog.global.logDir for each host\nGet-VMHost | Select Name, @{N=\"Syslog.global.logDir\";E={$_ | GetAdvancedConfiguration\
    \ Syslog.global.logDir | Select -ExpandProperty Values}}\nTo ensure remote logging is configured properly, perform the\
    \ following from the\nvSphere web client:\n1. Select the host\n2. Click Configure then expand System then select Advanced\
    \ System Settings.\n3. Select Edit then enter Syslog.global.logHost in the filter.\n4. Verify the Syslog.global.logHost\
    \ is set to the hostname of the central log\nserver.\nAlternately, the following PowerCLI command may be used:\n# List\
    \ Syslog.global.logHost for each host\nGet-VMHost | Select Name, @{N=\"Syslog.global.logHost\";E={$_ | GetAdvancedSetting\
    \ Syslog.global.logHost}}\nTo confirm access to services running on an ESXi host is properly restricted, perform\nthe\
    \ following from the vSphere web client:\n1. Select a host\n2. Click Configure then expand System then select Firewall.\n\
    3. Click Edit to view services which are enabled (indicated by a check).\n4. For each enabled service, (e.g., ssh, vSphere\
    \ Web Access, http client) check to\nensure that the list of allowed IP addresses specified is correct.\nAdditionally,\
    \ the following PowerCLI command may be used:\n# List all services for a host\nGet-VMHost HOST1 | Get-VMHostService\n\
    # List the services which are enabled and have rules defined for specific IP\nranges to access the service\nGet-VMHost\
    \ HOST1 | Get-VMHostFirewallException | Where {$_.Enabled -and (-not\n$_.ExtensionData.AllowedHosts.AllIP)}\n# List the\
    \ services which are enabled and do not have rules defined for\nspecific IP ranges to access the service\nGet-VMHost HOST1\
    \ | Get-VMHostFirewallException | Where {$_.Enabled -and\n($_.ExtensionData.AllowedHosts.AllIP)}\nIf the dvfilter network\
    \ API is not being used on the host, ensure that the following kernel\nparameter has a blank value: Net.DVFilterBindIpAddress.\n\
    1. From the vSphere web client, select the host and click Configure then expand\nSystem\n2. Click on Advanced System Settings\
    \ then Edit.\n3. Search for Net.DVFilterBindIpAddress in the filter.\n4. Verify Net.DVFilterBindIpAddress has an empty\
    \ value.\n5. If an appliance is being used, then ensure the value of this parameter is set to\nthe proper IP address.\n\
    Additionally, the following PowerCLI command may be used to verify the setting:\n# List Net.DVFilterBindIpAddress for\
    \ each host\nGet-VMHost | Select Name, @{N=\"Net.DVFilterBindIpAddress\";E={$_ | GetAdvancedSetting Net.DVFilterBindIpAddress\
    \ | Select -ExpandProperty Values}}\nTo verify the policy is set to reject forged transmissions, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches\
    \ then click Edit.\n4. Click on Security.\n5. Verify that Forged transmits is set to Reject in the dropdown.\nAlternately,\
    \ the following PowerCLI command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard\
    \ | Select VMHost, Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\"\
    \ } Else { \"Reject\"} }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}\nTo verify the policy is set to reject, perform the following:\n1. From the vSphere\
    \ Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches then click Edit.\n\
    4. Click on Security.\n5. Verify that MAC address changes is set to Reject in the dropdown.\nAlternately, the following\
    \ PowerCLI command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select\
    \ VMHost, Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\" } Else {\
    \ \"Reject\"} }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) { \"Accept\"\
    \ } Else {\n\"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits)\
    \ { \"Accept\" } Else {\n\"Reject\"} }}\nTo verify the policy is set to reject, perform the following:\n1. From the vSphere\
    \ Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches then click Edit.\n\
    4. Click on Security.\n5. Verify that Promiscuous mode is set to Reject in the dropdown.\nAlternately, the following PowerCLI\
    \ command may be used:\n# List all vSwitches and their Security Settings\nGet-VirtualSwitch -Standard | Select VMHost,\
    \ Name, `\n @{N=\"MacChanges\";E={if ($_.ExtensionData.Spec.Policy.Security.MacChanges) {\n\"Accept\" } Else { \"Reject\"\
    } }}, `\n @{N=\"PromiscuousMode\";E={if\n($_.ExtensionData.Spec.Policy.Security.PromiscuousMode) { \"Accept\" } Else {\n\
    \"Reject\"} }}, `\n @{N=\"ForgedTransmits\";E={if\n($_.ExtensionData.Spec.Policy.Security.ForgedTransmits) { \"Accept\"\
    \ } Else {\n\"Reject\"} }}\nTo verify the native VLAN ID is not being used for port groups, perform the following:\n1.\
    \ From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches.\n\
    4. Expand the Standard vSwitch.\n5. View the topology diagram of the switch, which shows the various port groups\nassociated\
    \ with that switch.\n6. For each port group on the vSwitch, verify and record the VLAN IDs used.\nAlternately, the following\
    \ PowerCLI command may be used:\n# List all vSwitches, their Portgroups and VLAN IDs\nGet-VirtualPortGroup -Standard |\
    \ Select virtualSwitch, Name, VlanID\nTo verify port groups are not set to 4095 unless VGT is required, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches.\n\
    4. Expand the Standard vSwitch.\n5. View the topology diagram of the switch, which shows the various port groups\nassociated\
    \ with that switch.\n6. For each port group on the vSwitch, verify and record the VLAN IDs used.\nAdditionally, the following\
    \ PowerCLI command may be used:\n# List all vSwitches, their Portgroups and VLAN IDs\nGet-VirtualPortGroup -Standard |\
    \ Select virtualSwitch, Name, VlanID"
  remediation: "Use VMware Lifecycle Manager to update and upgrade hosts when ESXi is managed\nthrough VMware vCenter. For\
    \ standalone hosts use esxcli or API-driven methods for\napplying updates.\nEmploy a process to keep ESXi hosts up to\
    \ date with patches in accordance with\nindustry standards and internal guidelines. Leverage the VMware Lifecycle Manager\
    \ to\ntest and apply patches as they become available.\nTo verify the host image profile acceptance level perform the\
    \ following:\n1. From the vSphere Web Client, select the host.\n2. Click Configure, then under System select Security\
    \ Profile.\n3. Under Host Image Profile Acceptance Level select Edit\n4. In the dropdown select one of the following -\
    \ VMware Certified, VMware\nAccepted, or Partner Supported.\nTo implement the recommended configuration state, run the\
    \ following PowerCLI\ncommand (in the example code, the level is Partner Supported):\n# Set the Software AcceptanceLevel\
    \ for each host<span>\nForeach ($VMHost in Get-VMHost ) {\n $ESXCli = Get-EsxCli -VMHost $VMHost\n $ESXCli.software.acceptance.Set(\"\
    PartnerSupported\")\n}\nTo enable and properly configure NTP synchronization, perform the following from the\nvSphere\
    \ web client:\n1. Select a host\n2. Click Configure then expand System then select Time Configuration.\n3. Select Edit\
    \ next to Network Time Protocol\n4. Select the Enable box, then fill in the appropriate NTP Servers.\n5. in the NTP Service\
    \ Startup Policy drop down select Start and stop with\nhost.\n6. Click OK.\nTo implement the recommended configuration\
    \ state, run the following PowerCLI\ncommand:\n# Set the NTP Settings for all hosts\n# If an internal NTP server is used,\
    \ replace pool.ntp.org with\n# the IP address or the Fully Qualified Domain Name (FQDN) of the internal\nNTP server\n\
    $NTPServers = \"pool.ntp.org\", \"pool2.ntp.org\"\nGet-VMHost | Add-VmHostNtpServer $NTPServers\nFrom the vSphere Web\
    \ Client:\n1. Select a host\n2. Click Configure then expand System then select Advanced System settings.\n3. Click Edit\
    \ then Filter for Mem.ShareForceSalting.\n4. Set the value to 2.\n5. Click OK.\nAdditionally, the following PowerCLI command\
    \ can be used:\nGet-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting | SetAdvancedSetting -Value 2\nTo disable\
    \ SSH, perform the following:\n1. From the vSphere Web Client, select the host.\n2. Select Configure then expand System\
    \ and select Services.\n3. Click on SSH then click Edit Startup Policy.\n4. Set the Startup Policy is set to Start and\
    \ Stop Manually.\n5. Click OK.\n6. While ESXi Shell is still selected click Stop.\nAlternately, use the following PowerCLI\
    \ command:\n# Set SSH to start manually rather than automatically for all hosts\nGet-VMHost | Get-VMHostService | Where\
    \ { $_.key -eq \"TSM-SSH\" } | SetVMHostService -Policy Off\nTo disable the ESXi shell, perform the following:\n1. From\
    \ the vSphere Web Client, select the host.\n2. Select Configure then expand System and select Services.\n3. Click on ESXi\
    \ Shell then click Edit Startup Policy.\n4. Set the Startup Policy is set to Start and Stop Manually.\n5. Click on OK.\n\
    Alternately, use the following PowerCLI command:\n# Set the ESXi shell to start manually rather than automatically for\
    \ all\nhosts\nGet-VMHost | Get-VMHostService | Where { $_.key -eq \"TSM\" } | SetVMHostService -Policy Off\nTo disabled\
    \ MOB, perform the following from the vSphere Web Client:\n1. Select a host\n2. Click Configure then expand System then\
    \ select Advanced System Settings.\n3. Click Edit then search for Config.HostAgent.plugins.solo.enableMob\n4. Set the\
    \ value to false.\n5. Click OK.\nNote: You cannot disable the MOB while a host is in lockdown mode.\nNote 2: You must\
    \ disable MOB from the vSphere interface not via the vim-cmd\ncommand.\nTo correct the DCUI timeout setting, perform the\
    \ following steps:\n1. From the vSphere Web Client, select the host.\n2. Click Configure, then under System select Advanced\
    \ System Settings.\n3. Select Edit then enter UserVars.DcuiTimeOut in the filter.\n4. Click in the box for the current\
    \ value, then set the value to 600 seconds or less.\nAlternately, use the following PowerCLI command:\nGet-VMHost | Get-AdvancedSetting\
    \ -Name UserVars.DcuiTimeOut | SetAdvancedSetting -Value 600\nTo set the timeout to the desired value, perform the following\
    \ from the vSphere web\nclient:\n1. From the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n\
    3. Select Advanced System Settings then click Edit.\n4. Enter ESXiShellInteractiveTimeOut in the filter.\n5. Set the value\
    \ for this parameter is set to the appropriate value (300 seconds or\nless).\n6. Click OK.\nNote: A value of 0 disables\
    \ the ESXi ShellInteractiveTimeOut.\nAlternately, use the following PowerCLI command:\n# Set Remove UserVars.ESXiShellInteractiveTimeOut\
    \ to 300 on all hosts\nGet-VMHost | Get-AdvancedSetting -Name 'UserVars.ESXiShellInteractiveTimeOut'\n| Set-AdvancedSetting\
    \ -Value \"300\"\nTo set the timeout to the desired value, perform the following from the vSphere web\nclient:\n1. From\
    \ the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n3. Select Advanced System Settings\
    \ then click Edit.\n4. Enter ESXiShellTimeOut in the filter.\n5. Set the value for this parameter is set to 3600 (1 hour)\
    \ or less\n6. Click OK.\nNote: A value of 0 disables the ESXiShellTimeOut.\nAlternately, run the following PowerCLI command:\n\
    # Set UserVars.ESXiShellTimeOut to 3600 on all hosts\nGet-VMHost | Get-AdvancedSetting -Name 'UserVars.ESXiShellTimeOut'\
    \ | SetAdvancedSetting -Value \"3600\"\nTo set the password complexity requirements, perform the following PowerCLI\n\
    command:\nGet-VMHOST | Get-AdvancedSetting -Name “Security.PasswordQualityControl\" |\nSet-AdvancedSetting -Value \"retry=3\n\
    min=disabled,disabled,disabled,disabled,15\"\nThe above requires all passwords to be 15 or more characters long and comprised\
    \ of at\nleast one character from four distinct character sets.\nTo set the maximum failed login attempts correctly, perform\
    \ the following steps:\n1. From the vSphere Web Client, select the host.\n2. Click Configure then expand System.\n3. Select\
    \ Advanced System Settings then click Edit.\n4. Enter Security.AccountLockFailures in the filter.\n5. Set the value for\
    \ this parameter to 5.\nAlternately, use the following PowerCLI command:\nGet-VMHost | Get-AdvancedSetting -Name Security.AccountLockFailures\
    \ | SetAdvancedSetting -Value 5\nTo set the account lockout to 15 minutes, perform the following:\n1. From the vSphere\
    \ Web Client, select the host.\n2. Click Configure then expand System.\n3. Select Advanced System Settings then click\
    \ Edit.\n4. Enter Security.AccountUnlockTime in the filter.\n5. Set the value for this parameter to 900.\nAlternately,\
    \ use the following PowerCLI command:\nGet-VMHost | Get-AdvancedSetting -Name Security.AccountUnlockTime | SetAdvancedSetting\
    \ -Value 900\nTo set the password history 5, perform the following:\n1. From the vSphere Web Client, select the host.\n\
    2. Click Configure then expand System.\n3. Select Advanced System Settings then click Edit.\n4. Enter Security.PasswordHistory\
    \ in the filter.\n5. Set the value for this parameter is set to 5.\nAlternately, the following PowerCLI command may be\
    \ used:\nGet-VMHost | Get-AdvancedSetting Security.PasswordHistory | SetAdvancedSetting -Value 5\nTo set a trusted users\
    \ list for DCUI, perform the following from the vSphere web client:\n1. From the vSphere Web Client, select the host.\n\
    2. Click Configure then expand System.\n3. Select Advanced System Settings then click Edit.\n4. Enter DCUI.Access in the\
    \ filter.\n5. Set the DCUI.Access attribute is set to a comma-separated list of the users who\nare allowed to override\
    \ lockdown mode.\nTo correct the membership of the Exception Users list, perform the following in the\nvSphere Web Client:\n\
    1. Select the host.\n2. Click on Configure then expand System and select Security Profile.\n3. Select Edit next to Lockdown\
    \ Mode.\n4. Click on Exception Users.\n5. Add or delete users as appropriate.\n6. Click OK.\nTo enable lockdown mode,\
    \ perform the following from the vSphere web client:\n1. From the vSphere Web Client, select the host.\n2. Select Configure\
    \ then expand System and select Security Profile.\n3. Across from Lockdown Mode click on Edit.\n4. Click the radio button\
    \ for Normal or 'Strict'.\n5. Click OK.\nAlternately, run the following PowerCLI command:\n# Enable lockdown mode for\
    \ each host\nGet-VMHost | Foreach { $_.EnterLockdownMode() }\nTo enable lockdown mode, perform the following from the\
    \ vSphere web client:\n1. From the vSphere Web Client, select the host.\n2. Select Configure then expand System and select\
    \ Security Profile.\n3. Across from Lockdown Mode click on Edit.\n4. Click the radio button for Strict.\n5. Click OK.\n\
    Alternately, run the following PowerCLI command:\n# Enable lockdown mode for each host\nGet-VMHost | Foreach { $_.EnterLockdownMode()\
    \ }\nTo configure persistent logging properly, perform the following from the vSphere web\nclient:\n1. Select the host\n\
    2. Click Configure then expand System then select Advanced System Settings.\n3. Select Edit then enter Syslog.global.LogDir\
    \ in the filter.\n4. Set Syslog.global.logDir to a persistent location specified as\n[datastorename] path_to_file where\
    \ the path is relative to the datastore. For\nexample, [datastore1] /systemlogs.\n5. Click OK.\nAlternatively, run the\
    \ following PowerCLI command:\n# Set Syslog.global.logDir for each host\nGet-VMHost | Foreach { Set-AdvancedConfiguration\
    \ -VMHost $_ -Name\nSyslog.global.logDir -Value \"<NewLocation>\" }\nTo configure remote logging properly, perform the\
    \ following from the vSphere web\nclient:\n1. Select the host\n2. Click Configure then expand System then select Advanced\
    \ System Settings.\n3. Select Edit then enter Syslog.global.logHost in the filter.\n4. Set the Syslog.global.logHost to\
    \ the hostname or IP address of the central\nlog server.\n5. Click OK.\nAlternately, run the following PowerCLI command:\n\
    # Set Syslog.global.logHost for each host\nGet-VMHost | Foreach { Set-AdvancedSetting -VMHost $_ -Name\nSyslog.global.logHost\
    \ -Value \"<NewLocation>\" }\nNote: When setting a remote log host, it is also recommended to set the\n\"Syslog.global.logDirUnique\"\
    \ to true. You must configure the syslog settings for each\nhost.\nTo properly restrict access to services running on\
    \ an ESXi host, perform the following\nfrom the vSphere web client:\n1. Select a host\n2. Click Configure then expand\
    \ System then select Firewall.\n3. Click Edit to view services which are enabled (indicated by a check).\n4. For each\
    \ enabled service, (e.g., ssh, vSphere Web Access, http client) provide a\nlist of allowed IP addresses.\n5. Click OK.\n\
    To remove the configuration for the dvfilter network API, perform the following from the\nvSphere web client:\n1. From\
    \ the vSphere web client, select the host and click Configure then expand\nSystem\n2. Click on Advanced System Settings\
    \ then Edit.\n3. Search for Net.DVFilterBindIpAddress in the filter.\n4. Set Net.DVFilterBindIpAddress has an empty value.\n\
    5. If an appliance is being used, make sure the value of this parameter is set to the\nproper IP address.\n6. Enter the\
    \ proper IP address.\n7. Click OK.\nTo implement the recommended configuration state, run the following PowerCLI\ncommand:\n\
    # Set Net.DVFilterBindIpAddress to null on all hosts\nGet-VMHost HOST1 | Foreach { Set-AdvancedSetting -VMHost $_ -Name\n\
    Net.DVFilterBindIpAddress -IPValue \"\" }\nTo set the policy to reject forged transmissions, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches\
    \ then click Edit.\n4. Click on Security.\n5. Set Forged transmits to Reject in the dropdown.\n6. Click on OK.\nAlternately,\
    \ the following ESXi shell command may be used:\n# esxcli network vswitch standard policy security set -v vSwitch2 -f\
    \ false\nTo set the policy to reject, perform the following:\n1. From the vSphere Web Client, select the host.\n2. Click\
    \ Configure then expand Networking.\n3. Select Virtual switches then click Edit.\n4. Click on Security.\n5. Set MAC address\
    \ changes to Reject in the dropdown.\n6. Click on OK.\nAlternately, perform the following using the ESXi shell:\n# esxcli\
    \ network vswitch standard policy security set -v vSwitch2 -m false\nTo set the policy to reject, perform the following:\n\
    1. From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches\
    \ then click Edit.\n4. Click on Security.\n5. Set Promiscuous mode to Reject in the dropdown.\n6. Click on OK.\nAlternately,\
    \ perform the following via the ESXi shell:\n# esxcli network vswitch standard policy security set -v vSwitch2 -p false\n\
    To stop using the native VLAN ID for port groups, perform the following:\n1. From the vSphere Web Client, select the host.\n\
    2. Click Configure then expand Networking.\n3. Select Virtual switches.\n4. Expand the Standard vSwitch.\n5. View the\
    \ topology diagram of the switch, which shows the various port groups\nassociated with that switch.\n6. For each port\
    \ group on the vSwitch, verify and record the VLAN IDs used.\n7. If a VLAN ID change is needed, click the name of the\
    \ port group in the topology\ndiagram of the virtual switch.\n8. Click the Edit settings option.\n9. In the Properties\
    \ section, enter an appropriate name in the Network label field.\n10. In the VLAN ID dropdown select or type a new VLAN.\n\
    11. Click OK.\nTo set port groups to values other than 4095 and 0 unless VGT is required, perform the\nfollowing:\n1.\
    \ From the vSphere Web Client, select the host.\n2. Click Configure then expand Networking.\n3. Select Virtual switches.\n\
    4. Expand the Standard vSwitch.\n5. View the topology diagram of the switch, which shows the various port groups\nassociated\
    \ with that switch.\n6. For each port group on the vSwitch, verify and record the VLAN IDs used.\n7. If a VLAN ID change\
    \ is needed, click the name of the port group in the topology\ndiagram of the virtual switch.\n8. Click the Edit settings\
    \ option.\n9. In the Properties section, enter an appropriate name in the Network label field.\n10. In the VLAN ID dropdown\
    \ select or type a new VLAN.\n11. Click OK."
