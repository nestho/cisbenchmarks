- id: 6.1.1
  title: (L1) Host CIM services, if enabled, must limit access
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: The Common Information Model (CIM) system allows for hardware-level management from remote applications through
    standard APIs. Ensuring only minimal access necessary to these applications is imperative to prevent potential security
    compromises. A dedicated service account, specific to each CIM application, should be created to limit access and privileges.
  rationale: Restricting access to CIM services is essential to prevent unauthorized or overprivileged access, which could
    lead to potential security vulnerabilities. This practice adheres to the principle of least privilege, promoting a more
    secure environment.
  impact: If improper access is granted to CIM-based hardware monitoring tools or other thirdparty applications, they may
    not function as expected or could be exploited to compromise the host's security.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-645EBD81-CF86-44D7BE77-224EF963D145.html
  page_start: 151
  audit_raw: 'To verify CIM access is limited, check for a limited-privileged service account with the

    following CIM roles applied:

    Host.Config.SystemManagement Host.CIM.CIMInteraction

    Alternately, the following PowerCLI command may be used:

    # List all user accounts on the Host -Host Local connection requiredGet-VMHostAccount'
  remediation: 'To limit CIM access, perform the following:

    1. Create a limited-privileged service account for CIM and other third-party

    applications.

    2. This account should access the system via vCenter.

    3. Give the account the CIM Interaction privilege only. This will enable the

    account to obtain a CIM ticket, which can then be used to perform both read and

    write CIM operations on the target host. If an account must connect to the host

    directly, this account must be granted the full "Administrator" role on the host.

    This is not recommended unless required by the monitoring software being used.

    Alternately, run the following PowerCLI command:

    # Create a new host user account -Host Local connection requiredNew-VMHostAccount -ID ServiceUser -Password <password>
    -UserAccount'
  checks:
  - type: manual_review
    info: 'To verify CIM access is limited, check for a limited-privileged service account with the

      following CIM roles applied:

      Host.Config.SystemManagement Host.CIM.CIMInteraction

      Alternately, the following PowerCLI command may be used:

      # List all user accounts on the Host -Host Local connection requiredGet-VMHostAccount'
    severity: medium
- id: 6.2.1
  title: (L1) Host must isolate storage communications
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Isolating storage communications through zoning and Logical Unit Number (LUN) masking is instrumental in segregating
    Storage Area Network (SAN) activity. Zoning defines the connections between host bus adapters (HBAs) and targets, ensuring
    devices outside a zone remain invisible to the devices within, thus facilitating the independent management of zones such
    as testing and production. On the other hand, LUN masking controls the visibility and accessibility of LUNs to different
    hosts, further enhancing the granularity of access control within the storage network. By implementing these measures,
    the attack surface of the SAN is reduced, non-ESXi systems are prevented from accessing the SAN, and separation of environments
    like test and production is achieved.
  rationale: Employing zoning and LUN masking to isolate storage communications is vital to reduce the risk of unauthorized
    access and potential cross-contamination between different operational environments. It allows for a more structured and
    secure management of storage resources, ensuring that unauthorized or incompatible systems are prevented from interacting
    with or accessing the SAN, thus contributing to the overall security and operational integrity of the environment.
  impact: Failing to isolate storage communications can lead to an increased risk of unauthorized access to storage resources,
    potential data leakage, or interference between different operational zones. The lack of segregation might also pose challenges
    in managing and troubleshooting storage network activities, leading to operational inefficiencies and potential security
    risks.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.storage.doc/GUID-6029358F-8EE8-41439BB0-16ABB3CA0FE3.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/6.7/com.vmware.vsphere.security.doc/GUID-BFE9046A-2278-4026809A-ED8F9D8FDACE.html
  page_start: 154
  audit_raw: 'The audit procedures to verify SAN activity is properly segregated are SAN vendor or

    product-specific.'
  remediation: 'The remediation procedures to properly segregate SAN activity are SAN vendor or

    product-specific.

    In general, with ESXi hosts, use a single-initiator zoning or a single-initiator-single-target

    zoning. The latter is a preferred zoning practice. Using the more restrictive zoning

    prevents problems and misconfigurations that can occur on the SAN.'
  checks:
  - type: manual_review
    info: 'The audit procedures to verify SAN activity is properly segregated are SAN vendor or

      product-specific.'
    severity: medium
- id: 6.2.2
  title: (L1) Host must ensure all datastores have unique names
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Ensuring unique naming for datastores is crucial to avoid potential errors that could affect the integrity
    and availability of data. A descriptive and unique name for each datastore facilitates better identification and management.
    Although there's no specific parameter to enforce this, manual or automated naming conventions should be adhered to.
  rationale: Unique and descriptive naming for datastores minimizes the risk of errors, improves manageability, and aids in
    quicker identification, especially in environments with numerous datastores. It's a proactive measure to maintain order
    and avoid issues that arise from the default names given to VMFS and vSAN datastores.
  impact: Not adhering to a unique naming convention can lead to confusion, misconfiguration, or incorrect data access. While
    renaming datastores could have downstream effects on systems like automation, monitoring, and backup, the benefits of
    unique naming conventions outweigh the potential negatives.
  references: []
  page_start: 156
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 6.3.1
  title: (L1) Host iSCSI client, if enabled, must employ bidirectional/mutual CHAP authentication
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Implementing bidirectional CHAP authentication for iSCSI connections elevates security by necessitating mutual
    verification between the initiator (client) and target (server), ensuring data integrity during transmission. Configuration
    involves setting the iSCSI storage adapter authentication to "Use bidirectional CHAP" and providing the requisite credentials.
    This setup ensures that all communication between the client and server remains secure and unaltered, significantly reducing
    the risk of data interception by unauthorized entities. The parameter governing this behavior is set iSCSI storage adapter
    authentication to "Use bidirectional CHAP" with a recommended setting of Enabled.
  rationale: Employing bidirectional CHAP authentication significantly minimizes risks associated with data interception or
    alteration by unauthorized entities during transmissions between the initiator and target. This additional layer of security
    is crucial in maintaining data integrity and confidentiality in iSCSI connections.
  impact: No functional impact is anticipated upon the implementation of this control. However, it's imperative to ensure
    correct configuration to avoid potential communication disruptions between the iSCSI client and server.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-AC65D747-728F-410996DD-49B433E2F266.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-2F1E64DB-20BB-4D18A083-8E65FE380899.html
  page_start: 158
  audit_raw: 'To verify that bidirectional CHAP authentication is enabled for iSCSI traffic, perform the

    following:

    1. From the vSphere Web Client, select the host.

    2. Click Configure then expand Storage.

    3. Select Storage Adapters then select the iSCSI Adapter.

    4. Under Properties verify that the Authentication method is set to Use

    bidirectional CHAP.

    Alternately, the following PowerCLI command may be used:

    # List Iscsi Initiator and CHAP Name if defined

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi"} | Select VMHost,

    Device, ChapType, @{N="CHAPName";E={$_.AuthenticationProperties.ChapName}}'
  remediation: 'To enable bidirectional CHAP authentication for iSCSI traffic, perform the following:

    1. From the vSphere Web Client, select the host.

    2. Click Configure then expand Storage.

    3. Select Storage Adapters then select the iSCSI Adapter.

    4. Under Properties click on Edit next to Authentication.

    5. Next to Authentication Method select Use bidirectional CHAP from the

    dropdown.

    6. Specify the outgoing CHAP name.

    • Make sure that the name you specify matches the name configured on the

    storage side.

    o To set the CHAP name to the iSCSI adapter name, select "Use initiator

    name".

    o To set the CHAP name to anything other than the iSCSI initiator name,

    deselect "Use initiator name" and type a name in the Name text box.

    8. Enter an outgoing CHAP secret to be used as part of authentication. Use the

    same secret as your storage side secret.

    9. Specify incoming CHAP credentials. Make sure your outgoing and incoming

    secrets do not match.

    10. Click OK.

    11. Click the second to last symbol labeled Rescan Adapter.

    Alternately, run the following PowerCLI command:

    # Set the Chap settings for the Iscsi Adapter

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi"} | Set-VMHostHba #

    Use desired parameters here'
  checks:
  - type: manual_review
    info: 'To verify that bidirectional CHAP authentication is enabled for iSCSI traffic, perform the

      following:

      1. From the vSphere Web Client, select the host.

      2. Click Configure then expand Storage.

      3. Select Storage Adapters then select the iSCSI Adapter.

      4. Under Properties verify that the Authentication method is set to Use

      bidirectional CHAP.

      Alternately, the following PowerCLI command may be used:

      # List Iscsi Initiator and CHAP Name if defined

      Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi'
    severity: medium
- id: 6.3.2
  title: (L1) Host iSCSI client, if enabled, must employ unique CHAP authentication secrets
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Challenge-Handshake Authentication Protocol (CHAP) requires both client and host to know a secret to establish
    a connection. It is essential to employ unique CHAP authentication secrets for each iSCSI session to ensure secure communications.
    The parameter governing this behavior is outlined in the iSCSI or iSER storage adapter configuration under CHAP settings.
  rationale: Utilizing unique CHAP authentication secrets for each iSCSI session promotes secure data transmission and mitigates
    the risk of unauthorized access.
  impact: While enhancing security, misconfiguration or sharing of CHAP secrets across sessions could potentially lead to
    connectivity issues or unauthorized access.
  references:
  - 1. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-AC65D747-728F-410996DD-49B433E2F266.html
  - 2. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.storage.doc/GUID-2F1E64DB-20BB-4D18A083-8E65FE380899.html
  page_start: 161
  audit_raw: 'To verify the CHAP secrets are unique, run the following to list all iSCSI adapters and

    their corresponding CHAP configuration:

    # List Iscsi Initiator and CHAP Name if defined

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi"} | Select VMHost,

    Device, ChapType, @{N="CHAPName";E={$_.AuthenticationProperties.ChapName}}'
  remediation: 'To change the values of CHAP secrets so they are unique, perform the following:

    1. From the vSphere Web Client, select the host.

    2. Click Configure then expand Storage.

    3. Select Storage Adapters then select the iSCSI Adapter.

    4. Under Properties click on Edit next to Authentication.

    5. Next to Authentication Method specify the authentication method from the

    dropdown.

    o None

    o Use unidirectional CHAP if required by target

    o Use unidirectional CHAP unless prohibited by target

    o Use unidirectional CHAP

    o Use bidirectional CHAP

    6. Specify the outgoing CHAP name.

    • Make sure that the name you specify matches the name configured on the

    storage side.

    o To set the CHAP name to the iSCSI adapter name, select "Use initiator

    name".

    o To set the CHAP name to anything other than the iSCSI initiator name,

    deselect "Use initiator name" and type a name in the Name text box.

    8. Enter an outgoing CHAP secret to be used as part of authentication. Use the

    same secret as your storage side secret.

    9. If configuring with bidirectional CHAP, specify incoming CHAP credentials.

    • Make sure your outgoing and incoming secrets do not match.

    10. If configuring with bidirectional CHAP, specify incoming CHAP credentials.

    • Make sure your outgoing and incoming secrets do not match.

    11. Click OK.

    12. Click the second to last symbol labeled Rescan Adapter'
  checks:
  - type: manual_review
    info: 'To verify the CHAP secrets are unique, run the following to list all iSCSI adapters and

      their corresponding CHAP configuration:

      # List Iscsi Initiator and CHAP Name if defined

      Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "Iscsi"} | Select VMHost,

      Device, ChapType, @{N="CHAPName";E={$_.AuthenticationProperties.ChapName}}'
    severity: medium
- id: 6.4.1
  title: (L1) Host SNMP services, if enabled, must limit access
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: To manage hosts securely, if SNMP is enabled, access must be restricted. Preferably, SNMPv3 should be employed
    as it offers superior security through key authentication and encryption compared to SNMPv1 or SNMPv2. Configuring the
    destination for SNMP traps is essential for ensuring monitoring data is directed to a legitimate and secure host.
  rationale: Proper SNMP configuration is crucial to reduce the risk of misuse or compromise, especially if other management
    means are in place. SNMPv3’s enhanced security features are pivotal for secure management and monitoring.
  impact: Improper SNMP configuration can redirect sensitive monitoring data to malicious hosts, risking exploitation and
    compromising host security.
  references:
  - 1. https://docs.vmware.com/en/VMware-vSphere/8.0/vsphere-monitoringperformance/GUID-8EF36D7D-59B6-4C74-B1AA-4A9D18AB6250.html
  page_start: 165
  audit_raw: 'To confirm the proper configuration of SNMP, perform the following from the ESXi Shell

    or vCLI:

    1. Run the following to determine if SNMP is being used:

    esxcli system snmp get

    2. If SNMP is being used, refer to the vSphere Monitoring and Performance guide,

    chapter 8 for steps to verify the parameters.

    Additionally, the following PowerCLI command may be used to view the SNMP

    configuration:

    # List the SNMP Configuration of a host (single host connection required)

    Get-VMHostSnmp'
  remediation: 'To correct the SNMP configuration, perform the following from the ESXi Shell or vCLI:

    1. If SNMP is not needed, disable it by running:

    esxcli system snmp set --enable false

    2. If SNMP is needed, refer to the vSphere Monitoring and Performance guide,

    chapter 8 for steps to configure it.

    Additionally, the following PowerCLI command may be used to implement the

    configuration:

    # Update the host SNMP Configuration (single host connection required)

    Get-VmHostSNMP | Set-VMHostSNMP -Enabled:$true -ReadOnlyCommunity ''<secret>''

    Notes:

    • SNMP must be configured on each ESXi host

    • SNMP settings can be configured using Host Profiles'
  checks:
  - type: manual_review
    info: 'To confirm the proper configuration of SNMP, perform the following from the ESXi Shell

      or vCLI:

      1. Run the following to determine if SNMP is being used:

      esxcli system snmp get

      2. If SNMP is being used, refer to the vSphere Monitoring and Performance guide,

      chapter 8 for steps to verify the parameters.

      Additionally, the following PowerCLI command may be used to view the SNMP

      configuration:

      # List the SNMP Configuration of a host (single host connection required)

      Get-VMHostSnmp'
    severity: medium
- id: 6.5.1
  title: (L1) Host SSH daemon, if enabled, must use FIPS 1402/140-3 validated ciphers
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: For enhanced security, if the SSH daemon is enabled on the host, it must utilize FIPS 140-2/140-3 validated
    ciphers. This requirement ensures the encryption standards are robust and compliant with regulatory mandates.
  rationale: Employing FIPS validated ciphers is vital for maintaining a high level of security and integrity in communications.
    It aligns with industry best practices and regulatory compliance requirements, ensuring secure SSH connections.
  impact: There is no functional impact noted for this control; however, it significantly improves the security posture by
    enforcing the use of strong, validated encryption ciphers for SSH communications.
  references: []
  page_start: 168
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
