- id: 8.4.18
  title: (L2) Ensure Host Guest File System Server is disabled
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: The Host Guest File System Server should be disabled if it is not needed.
  rationale: Certain automated operations such as automated tool upgrades use a component in the hypervisor called Host Guest
    File System (HGFS), and an attacker could potentially use this to transfer files inside the guest OS. These VMX parameters
    don't apply on vSphere because VMware virtual machines work on vSphere and hosted virtualization platforms such as Workstation
    and Fusion. The code paths for these features, such as the Host Guest File System Server, are not implemented in ESXi.
    Explicitly disabling these features reduces the potential for vulnerabilities because it reduces the number of ways in
    which a guest can affect the host. Note that these are referenced for organizations that insist any documented setting,
    regardless of whether it is implemented in code or not, must have a value.
  impact: This will cause the VMX process to not respond to commands from the tools process. Setting isolation.tools.hgfsServerSet.disable
    to TRUE disables the registration of the guest's HGFS server with the host. APIs that use HGFS to transfer files to and
    from the guest operating system, such as some VIX commands or the VMware Tools autoupgrade utility, will not function.
  references:
  - 1. https://docs.vmware.com/en/VMwareTools/10.3.0/com.vmware.vsphere.vmwaretools.doc/GUID-685722FA-9009439C-914218A9E7C592EA.html?hWord=N4IghgNiBcIMoFMDGBXATgSwC4E8AEAwgPYB
  - 2. https://docs.vmware.com/en/VMwarevSphere/7.0/com.vmware.vsphere.security.doc/GUID-52188148-C579-4F6A8335-CFBCE0DD2167.html
