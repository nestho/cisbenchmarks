- id: 4.4.17
  title: Ensure uncovered http methods are denied
  scoring: scored
  profile:
  - Level 1
  description: Servlets are secured by URL and each URL that is to be secured must be specified in the web.xml file describing
    the application.
  rationale: A servlet can have multiple aliases and an application can have many servlets, making it easy to accidentally
    forget to secure an alias or URL for a servlet. If just one servlet URL is insecure, an intruder might be able to bypass
    security. Use wildcards to secure servlets wherever possible instead of specific URLs and configure the application to
    deny access to uncovered http methods.
  impact: Open Liberty secures URLs and not the underlying classes, if just one servlet URL is insecure, an intruder might
    be able to bypass security.
  references:
  - 1. https://www.ibm.com/docs/en/was-liberty/base?topic=applications-gettingstarted-security-in-liberty
  - 2. https://openliberty.io/docs/latest/application-configuration-hardening.html
  page_start: 125
  audit_raw: 'Review all of your web applications to ensure that each servlet has an alias associated

    with security constraints.

    Review each application’s web.xml file located in the application''s

    ${wlp.user.dir}/shared/apps/<app_name>/WEB-INF/ directory and determine if a denyuncovered-http-methods element is set.
    Applications may also be in the

    ${server.config.dir}/dropins directory or a custom location.

    grep -w -R -i ''deny-uncovered-http-methods''

    ${wlp.user.dir}/shared/apps/<app_name>/WEB-INF/

    Note: The security-constraints can also be set in the code using annotations like

    @ServletSecurity.'
  remediation: "Create aliases for each servlet. Assign a security constraint for each URL defined in\nalias. Add additional\
    \ security by adding <deny-uncovered-http-methods /> to WEBINF/web.xml to block all undeclared methods.\n<servlet-mapping\
    \ id=\"ServletMapping_1\">\n  <servlet-name>MyServlet</servlet-name>\n  <url-pattern>/MyURLPattern</url-pattern>\n</servlet-mapping>\n\
    <deny-uncovered-http-methods />\n<!-- SECURITY CONSTRAINTS -->\n<security-constraint id=\"SecurityConstraint_1\">\n  <web-resource-collection\
    \ id=\"WebResourceCollection_1\">\n   <web-resource-name>Protected with Employee or Manager\nroles</web-resource-name>\n\
    \   <url-pattern>/MyURLPattern</url-pattern>\n   <http-method>GET</http-method>\n   <http-method>POST</http-method>\n\
    \  </web-resource-collection>\n  <auth-constraint id=\"AuthConstraint_1\">\n   <role-name>Employee</role-name>\n   <role-name>Manager</role-name>\n\
    \  </auth-constraint>\n</security-constraint>\nNote: The security constraints can also be set in the code using annotations\
    \ like\n@ServletSecurity"
  checks:
  - type: command
    command: grep -w -R -i 'deny-uncovered-http-methods'
    expected: ''
    severity: medium
    info: 'Review all of your web applications to ensure that each servlet has an alias associated

