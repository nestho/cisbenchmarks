controls:
- id: 5.1.2
  title: Ensure 'establishTrustInClient' is set to 'required' within the CSIv2 Authentication Layer
  scoring: scored
  profile:
  - Monitoring the base operating system for vulnerabilities and quickly updating with
  - Monitoring applications and libraries for vulnerabilities and quickly updating with
  - Level 1
  - Level 2
  - Level 1
  description: Preventing the root user from owning files in the ${wlp.install.dir} directory prevents unauthorized commands
    or files from being run. The installation might provide example applications, documentation, and other directories which
    may not serve a production use. In Linux systems, there is a category of permission as others. These users are the ones
    who are not neither owner nor in a group associated with the file/folder. Since these users are anyone else than users
    defined, they should not have any access at all on Websphere Liberty file system. Ensure that only one user ID has write
    access to the WebSphere Liberty configuration files. If there are multiple administrators, they can use sudo and the /etc/sudoers
    file to elevate their privilege when write access is required. The user ID that the WebSphere Liberty server process runs
    under should not have write access to its own configuration files. The WebSphere Liberty server process requires write
    access to certain runtime files such as temporary caches and logs, but those files can be written to a different location
    than the configuration files, and permissions can be set separately for those two locations. WebSphere Liberty provides
    the ability to automatically update the server runtime when the configuration changes, without requiring a server restart.
    Ensure that all WebSphere Liberty binaries were installed successfully and that you are running the latest fix pack version.
    The permissions of files and directories underneath ${wlp.install.dir} should follow the principle of least privilege.
    WebSphere Liberty allows additional configuration files to be included in the main configuration file. Using included
    files in the main configuration file provides organization, separation, update controls and file access restriction. Configuring
    displayAuthenticationRealm will ensure that the registry information is not displayed in the login prompt. This will restrict
    the potential leak of security realm information. The Basic Registry and Quick Start Security user registries are indented
    for developing and testing environments. TLS (Transport Layer Security) provides secure communication over a network.
    Automatic application updates will dynamically update the runtime behavior of the applications of any changes to the application.
    The JDK's security manager allows applications to implement a security policy. It allows an application to permit or deny
    operations defined by the security policy.
  rationale: 'When directories or files are owned by the root user, administration of those files requires a user to log in
    as root or elevate their existing login to have root privileges. Performing operations as the root user could result in
    unauthorized commands that could alter files beyond the scope of WebSphere Liberty itself. Removing non-production resources
    is a defense in depth measure that reduces potential exposures introduced by these resources. WebSphere Liberty server
    administrators sometimes need the ability to write to server configuration files, but following the principle of least
    privilege they should not operate with write access unless absolutely necessary. Administrators can use sudo and the /etc/sudoers
    to file to elevate their privilege when write access is needed, while operating with read access the rest of the time.
    Administrators should never share user IDs and passwords. Removing write access to a server''s configuration files limits
    the damage that can be done by a theoretical attacker that is able to inject code to be run inside the WebSphere Liberty
    server process. Automatic updates during runtime are very useful during development and test phases. Configuration updates
    must be carefully controlled in production environments to reduce the possibility that unknown changes or vulnerabilities
    are deployed to users. Ensuring that all WebSphere Liberty binaries are installed successfully and that the latest fix
    pack version is applied provides the most up-to-date protection against vulnerabilities. If the permissions of files and
    directories underneath ${wlp.install.dir} are too broad, unintended users may be able to modify or read those files. Write
    permission should be limited to a single administrator, read permission should be limited to a specificallydefined group
    containing users that require that access, and all other users should have their access entirely removed. Use additional
    configuration files to hold sensitive configuration information. Restrict access to files with sensitive information.
    This avoids unauthorized access to information such as passwords. Use additional configuration files to organization configuration
    information by type. This helps users only update their portion of the server configuration and not accidentally or intentionally
    change configuration information in other areas. Included files should also be ignored if there is a merge conflict with
    the main file. This prevents a user from accidentally or intentionally overriding information in the main configuration
    file. To protect important configuration settings from merges or changes, information can be set in the ${server.config.dir}/configDropins/overrides/.
    Do not display the user registry information when prompting the user for credentials to avoid showing sensitive information
    like the LDAP host and port. The Basic and Quick Start Security user registries are not robust enough for production to
    be used. Registries like LDAP, Database or a custom user registry should be used for production. Secure the data sent
    to the LDAP server which can include user authentication and search requests. Automatic updates during runtime are very
    useful during development and test phases. Application updates must be carefully controlled in production environments
    to reduce the possibility that unknown changes or vulnerabilities are deployed to users. In some situations there is a
    need to restrict applications from performing certain operations like read and writing to files, opening network connections
    etc. JDK''s security manager provides a way to configure a security policy that can be applied to restrict the applications
    operations. Note: The security manager is proposed to be deprecated and removed in future releases of JDK.'
  impact: If the file permissions are too broad, a security vulnerability exists where unintended users will have the ability
    to modify and read WebSphere Liberty files. Generally enabling the security manager can impact the performance because
    of the additional checks needed to restrict operations by applications. Applications can also fail to run with these additional
    checks in which case appropriate permissions have to configured for the application either in the server configuration
    files or the application specific permissions.xml file.
  references:
  - 1. https://openliberty.io/docs/latest/reference/config/server-configurationoverview.html#_dynamic_updates
  - 2. https://www.ibm.com/docs/en/wasliberty/base?topic=SSEQTP_liberty/com.ibm.websphere.wlp.zseries.doc/ae/twlp_
  - 1. https://openliberty.io/docs/latest/reference/config/include.html
  - 1. https://www.ibm.com/docs/en/was-liberty/base?topic=applications-configuringweb-security-related-properties-in-liberty
  - 2.2 Ensure Basic Registry and Quick Start security Registry are
  - 1. https://openliberty.io/docs/latest/reference/feature/appSecurity-2.0.html
  - 1. https://openliberty.io/docs/latest/reference/config/ldapRegistry.html
  - 2. https://openliberty.io/docs/latest/reference/config/ssl.html
  - 1. https://openliberty.io/docs/latest/reference/config/applicationMonitor.html
  - 2. https://www.ibm.com/docs/en/wasliberty/base?topic=SSEQTP_liberty/com.ibm.websphere.wlp.zseries.doc/ae/twlp_
  - 1. https://www.ibm.com/docs/en/was-liberty/base?topic=security-java-2
  - 2. https://openjdk.java.net/jeps/411
  page_start: 5
  audit_raw: "Check to ensure that no files or directories underneath ${wlp.install.dir} are owned\nby the root user or root\
    \ group:\nls -l -R ${wlp.install.dir} | awk '{print $3, $4}'\nExpected result: You should not see the root user or root\
    \ group referenced in the\noutput.\nCheck for the existence of extraneous resources:\n$ ls -l ${wlp.user.dir}/extension\
    \ \\\n   ${wlp.user.dir}/shared \\\n   ${wlp.user.dir}/server \\\n   ${wlp.user.dir}/client\nThere should be no non-production\
    \ client extension/shared resource(s)/server/client in\nthese folders\nEnsure that no one falling into other category\
    \ have access to the Websphere Liberty file\nsystem. You should expect to see ---.\n ls -l -R ${wlp.install.dir} | awk\
    \ '{print substr($1,length($1)-3,3)}'\nVerify that all WebSphere administrators have been added to the group that owns\
    \ the\nserver's configuration directory, which will grant them read but not write access. Ensure\nthat the user that owns\
    \ the server's configuration directory is a non-login user. Use sudo\nand the /etc/sudoers file to grant the administrators\
    \ the ability to elevate their privilege\nto the user that owns the server's configuration directory when write access\
    \ is required.\nEnsure the existence of the WLP_OUTPUT_DIR variable in the server.env file. This\nenvironment variable\
    \ is used to specify an alternative location for server generated\noutput such as logs, the workarea directory, and other\
    \ generated files. The variable\nshould point to an output directory that is different from the server's configuration\n\
    directory. The user ID of the WebSphere Liberty server process should have write\naccess to the output directory but only\
    \ read access to the configuration directory. For\nmore information about server.env please see here.\nWLP_OUTPUT_DIR=/<server-writeable\
    \ directory>/\nConfirm that the output directory exists and has write access granted to the WebSphere\nLiberty server\
    \ process user ID:\nls -l $WLP_OUTPUT_DIR | awk '{print $1, $3}'\nConfirm that the WebSphere Liberty server process user\
    \ ID has read access to its\nconfiguration files:\nls -l ${server.config.dir} | awk '{print $1, $3}'\nEnsure the updateTrigger\
    \ attribute on the config element controls in the Liberty\nconfiguration is set to a value other than polled.\ngrep -w\
    \ -R -i 'updateTrigger' ${server.config.dir}\nValidate your WebSphere Liberty installation by running the command below:\n\
    ${wlp_install_dir}/bin/productInfo validate\nExpected result:\nStart product validation...\nProduct validation completed\
    \ successfully.\nValidate that you are running with the latest fixpack.\n${wlp_install_dir}/bin/productInfo version\n\
    Expected result:\nProduct version: YY.0.0.FP\nIn the output, YY is the last two digits of the year that the fixpack was\
    \ released, and FP\nrepresents the fixpack number for that year. Ensure that this matches that latest fixpack\navailable\
    \ from IBM.\nCheck the permissions of ${wlp.install.dir}:\nls -l -R ${wlp.install.dir} | awk '{print $1}'\nExpected result:\
    \ All files should show permissions of the form (d)rw(x)r-(x)---. The\nd(directory) and x(executable) flags may or may\
    \ not exist depending on the file type,\nhowever the r(read) and w(write) flags should always appear in the same position\
    \ as the\nabove output.\nEnsure that the onConflict attribute on all the location elements and is set to IGNORE in\nthe\
    \ Liberty configuration.\ngrep -w -R -i 'include location' ${server.config.dir}\nReview the file permissions on included\
    \ files.\nls -al <includedFileName.xml>\nReview the main Liberty configuration file for any sensitive or grouped elements\
    \ that\ncan be moved to an included file.\nEnsure the displayAuthenticationRealm attribute for first webAppSecurity element\
    \ is\nset to false in the Liberty configuration.\ngrep -w -R -i 'displayAuthenticationRealm' ${server.config.dir}\nEnsure\
    \ there are no uses of basicRegistry or quickStartSecurity elements in the\nLiberty configuration.\ngrep -w -i -R 'basicRegistry'\
    \ ${server.config.dir}\ngrep -w -i -R 'quickStartSecurity' ${server.config.dir}\nEnsure that the sslEnabled attribute\
    \ of all ldapRegistry elements is to true. The sslRef\nof all ldapRegistry elements must match the id attribute of an\
    \ ssl element. Both\nconfigurations are set on the Liberty configuration.\ngrep -w -R -i 'sslEnabled' ${server.config.dir}\n\
    The sslEnabled attribute may match to elements in addition to the ldapRegistry\nelement.\nReview the updateTrigger attribute\
    \ and dropinsEnabled attributes in the\napplicationMonitor element in the Liberty configuration.\nEnsure the updateTrigger\
    \ attribute is set to a value other than polled.\nEnsure the dropinsEnabled attritubute is set to false.\ngrep -w -R -i\
    \ 'updateTrigger' ${server.config.dir}\ngrep -w -R -i 'dropinsEnabled' ${server.config.dir}\nEnsure that the websphere.java.security\
    \ property is configured in\n${server.config.dir}/bootstrap.properties file\nwebsphere.java.security\nand also confirm\
    \ that the appropriate permissions are granted in the application's\npermission.xml file and/or in the javaPermission\
    \ element in Liberty configuration\n<javaPermission ... />"
  remediation: "Set the ownership and group of ${wlp.install.dir} to something other than root:\nchown -R <non-root user>:<non-root\
    \ group> ${wlp.install.dir}\nRemove extraneous resources for each:\nExtension:\n$ rm -rf ${wlp.user.dir}/extension/<non-production\
    \ extension>\nShared resource(s):\n$ rm -rf ${wlp.user.dir}/shared/<non-production shared resource(s)>\nServer:\n$ rm\
    \ -rf ${wlp.user.dir}/server/<non-production server>\nClient:\n$ rm -rf ${wlp.user.dir}/client/<non-production client>\n\
    Ensure that other has no access to the system.\nchmod -R o-rwx ${wlp.install.dir}\nCreate a single, non-login, user ID\
    \ that owns the server's configuration directory. Add\nany WebSphere administrators to the group that owns the server's\
    \ configuration\ndirectory, which will automatically give them read access to the server's configuration,\nbut not write\
    \ access. Use sudo and the /etc/sudoers file to allow these administrators to\nelevate their privilege to the user ID\
    \ that owns the server's configuration directory when\nwrite access is required.\nCreate the server.env file if it does\
    \ not exist. For more information about server.env\nplease see here.\nDefine WLP_OUTPUT_DIR in the server.env file:\n\
    WLP_OUTPUT_DIR=/<server-writeable directory>/\nEnsure that the WebSphere Liberty server process user ID has write access\
    \ to the\nWLP_OUTPUT_DIR directory.\nEnsure that the WebSphere Liberty server process user ID does not have write access\n\
    to the ${server.config.dir} directory.\nAdd the updateTrigger attribute to the config element in\n${server.config.dir}/configDropins/overrides/*.xmland\
    \ set to mbean or disabled.\n<config updateTrigger=\"mbean\" />\nIf the audit procedure fails, remove your current installation\
    \ and install from a more\nsecure location, ensuring that you are installing the latest fixpack from a trusted source.\n\
    Change WebSphere Liberty file system access to 750 (owner has read/write/execute,\ngroup has read/execute, other has no\
    \ access):\nchmod –R 750 ${wlp.install.dir}\nSet the onConflict attribute to the IGNORE value in all include elements\
    \ in the Liberty\nconfiguration.\n<include ... onConflict=\"IGNORE\" />\nReduce file permission on all included files\
    \ to essential users only.\nSet the displayAuthenticationRealm attribute in the webAppSecurity element to false\nin ${server.config.dir}/configDropins/overrides/<any\
    \ file name>.xml.\n<webAppSecurity ... displayAuthenticationRealm=\"false\" />\nUse robust user registries, such as an\
    \ LDAP registry or a Custom registry for\nproduction.\nSet the sslEnabled attribute on all ldapRegistry elements in\n\
    ${server.config.dir}/configDropins/overrides/<any file name>.xml. Also set the\nsslRef attribute to a value that contains\
    \ the correct keystore and truststore configuration\nfor LDAPS communication.\n<ldapRegistry\n sslEnabled=\"true\" sslRef=\"\
    LDAPSSLSettings\" >\n</ldapRegistry>\n<ssl id=\"LDAPSSLSettings\" keyStoreRef=\"LDAPKeyStore\"\ntrustStoreRef=\"LDAPTrustStore\"\
    \ />\nAdd the dropinsEnabled attribute and the updateTrigger attributes to the\napplicationMonitor element to\n${server.config.dir}/configDropins/overrides/*.xml.\
    \ Set the dropinsEnabled to\nfalse to stop usage of dropins folder. Set the updateTrigger to mbean or disabled.\n<applicationMonitor\
    \ updateTrigger=\"mbean\" dropinsEnabled=\"false\" />\nEnable the websphere.java.security property in\n${server.config.dir}/bootstrap.properties\
    \ file\nwebsphere.java.security\nand also confirm that the appropriate permissions are granted in the application's\n\
    permission.xml file and/or in the javaPermission element specified in\n${server.config.dir}/configDropins/overrides/*.xml.\n\
    For example,\n<javaPermission className=\"java.security.PropertyPermission\" name=\"os.name\"\nactions=\"read\" restriction=\"\
    true\" />"
  checks:
  - type: command
    command: ls -l -R ${wlp.install.dir} | awk '{print $3, $4}' && ls -l -R ${wlp.install.dir} | awk '{print substr($1,length($1)-3,3)}'
      && ls -l $WLP_OUTPUT_DIR | awk '{print $1, $3}' && ls -l ${server.config.dir} | awk '{print $1, $3}' && grep -w -R -i
      'updateTrigger' ${server.config.dir} && ls -l -R ${wlp.install.dir} | awk '{print $1}' && grep -w -R -i 'include location'
      ${server.config.dir} && ls -al <includedFileName.xml> && grep -w -R -i 'displayAuthenticationRealm' ${server.config.dir}
      && grep -w -i -R 'basicRegistry' ${server.config.dir} && grep -w -i -R 'quickStartSecurity' ${server.config.dir} &&
      grep -w -R -i 'sslEnabled' ${server.config.dir} && grep -w -R -i 'updateTrigger' ${server.config.dir} && grep -w -R
      -i 'dropinsEnabled' ${server.config.dir}
    expected: Verify that all WebSphere administrators have been added to the group that owns the
    severity: medium
    info: "Check to ensure that no files or directories underneath ${wlp.install.dir} are owned\nby the root user or root\
      \ group:\nls -l -R ${wlp.install.dir} | awk '{print $3, $4}'\nExpected result: You should not see the root user or root\
      \ group referenced in the\noutput.\nCheck for the existence of extraneous resources:\n$ ls -l ${wlp.user.dir}/extension\
      \ \\\n   ${wlp.user.dir}/shared \\\n   ${wlp.user.dir}/server \\\n "
- id: 4.1.1.1
  title: Ensure 'cookieSameSite' SameSite attribute is set to 'Strict' for session cookies
  scoring: scored
  profile:
  - Level 1
  description: The SameSite attribute is used by web browsers to determine if a particular cookie should be sent with a request.
    Setting this attribute can help protect against Cross Site Request Forgery (CSRF) attacks. It is recommended to set the
    SameSite attribute to Strict. A Strict value for the SameSite attribute ensures the cookie is only sent by the web browser
    if the site for the cookie matches the site in the address bar, for example.
  rationale: Some browsers treat cookies without a SameSite attribute as if they have the SameSite attribute value of Lax.
  impact: ''
  references:
  - 1. https://openliberty.io/blog/2020/03/25/set-samesite-attribute-cookies-liberty.html
  page_start: 46
  audit_raw: 'Ensure the cookieSameSite attribute is set to Strict in the httpSession element in the

    Liberty configuration

    grep -w -R -i ''cookieSameSite'' ${server.config.dir}'
  remediation: 'Add the cookieSameSite attribute to the httpSession element in

    ${server.config.dir}/configDropins/overrides/<any file name>.xml. Set the

    cookieSameSite value to Strict.

    <httpSession cookieSameSite="Strict"/>'
  checks:
  - type: command
    command: grep -w -R -i 'cookieSameSite' ${server.config.dir}
    expected: ''
    severity: medium
    info: 'Ensure the cookieSameSite attribute is set to Strict in the httpSession element in the

      Liberty configuration

      grep -w -R -i ''cookieSameSite'' ${server.config.dir}'
