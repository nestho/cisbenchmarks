- id: 4.2.11
  title: Ensure that strong algorithms are used for TLS certificates.
  scoring: manual
  profile:
  - Level 1
  description: Certificates created with stronger algorithms use stronger hashes which is more secure. Also, some browsers
    warn when using weak certificates.
  rationale: With increased CPU speeds and computing power of computers, some algorithms are not secure to use in production
    systems anymore such as SHA1 or MD5. On top of that, even for accepted algorithms such as SHA256 or higher, key sizes
    need to be higher than 2048 bits. Weak algorithms and small key sizes are not secure.
  impact: ''
  references: []
  page_start: 81
  audit_raw: 'Ensure that Signature algorithm name is SHA256 or higher and Subject Public Key

    Algorithm is equal or higher than 2048 bit.

    keytool -list -v -keystore <keystore file name> -storepass <store password> -

    storetype <store type> | grep ''Signature algorithm name\|Subject Public Key

    Algorithm''

    ...

    Signature algorithm name: SHA256withRSA

    Subject Public Key Algorithm: 2048-bit RSA key

    ...'
  remediation: Create certificates with SHA256 or higher algorithm and 2048 or higher key bit size.
  checks:
  - type: command
    command: storetype <store type> | grep 'Signature algorithm name\|Subject Public Key
    expected: ''
    severity: medium
    info: 'Ensure that Signature algorithm name is SHA256 or higher and Subject Public Key

      Algorithm is equal or higher than 2048 bit.

      keytool -list -v -keystore <keystore file name> -storepass <store password> -

      storetype <store type> | grep ''Signature algorithm name\|Subject Public Key

      Algorithm''

      ...

      Signature algorithm name: SHA256withRSA

      Subject Public Key Algorithm: 2048-bit RSA key

      ...'
