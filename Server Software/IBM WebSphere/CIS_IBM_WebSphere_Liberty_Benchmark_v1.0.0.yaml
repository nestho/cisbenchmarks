    the @ServletSecurity annotation.'
  remediation: "Set <security-constraint> elements in the web.xml deployment descriptor file of each\napplication or use annotations\
    \ in the code.\nExample using security-constraint:\n<security-constraint>\n    <web-resource-collection>\n      <url-pattern>/*</url-pattern>\n\
    \    </web-resource-collection>\n    <auth-constraint>\n      <role-name>testing</role-name>\n    </auth-constraint>\n\
