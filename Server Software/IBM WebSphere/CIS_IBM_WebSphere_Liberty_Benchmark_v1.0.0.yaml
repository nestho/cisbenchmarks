- id: 4.2.7
  title: Ensure Hostname verification for TLS communication is enabled
  scoring: scored
  profile:
  - Level 1
  description: Hostname verification is a server identity check that is used to ensure that a client is talking to the correct
    server. The check is performed on the client side of an SSL communication and involves looking at the server’s certificate
    Subject Alternative Name (or the SubjectDN) to see if it matches the host part of the URL that was used to make the outbound
    request.
  rationale: Hostname verification mitigates man-in-the-middle security vulnerability attacks.
  impact: ''
  references:
  - 1. https://openliberty.io/blog/2019/06/21/microprofile-rest-client-19006.html
  - 2. https://openliberty.io/docs/latest/reference/config/ssl.html
  page_start: 75
  audit_raw: 'Ensure the verifyHostname attribute is set to true in the SSL configuration in the

    Liberty configuration.

    grep -w -R ''verifyHostname'' ${server.config.dir}

    For JAX-RS client applications ensure the disableCNCheck attribute is set to false in the

    webTarget element.

    grep -w -R ''disableCNCheck'' ${server.config.dir}'
  remediation: 'Enable hostname verification in the SSL configuration by adding the verifyHostname

    attribute to the ssl configuration element in

    ${server.config.dir}/configDropins/overrides/<any file name>.xml

    <ssl ... verifyHostname="true" />

    For JAX-RS client, enable hostname verification in the webTarget element by adding the

    disableCNCheck attribute in ${server.config.dir}/configDropins/overrides/<any

    file name>.xml

    <webTarget ... disableCNCheck="false" />'
  checks:
  - type: command
    command: grep -w -R 'verifyHostname' ${server.config.dir} && grep -w -R 'disableCNCheck' ${server.config.dir}
    expected: ''
    severity: medium
    info: 'Ensure the verifyHostname attribute is set to true in the SSL configuration in the

      Liberty configuration.

      grep -w -R ''verifyHostname'' ${server.config.dir}

      For JAX-RS client applications ensure the disableCNCheck attribute is set to false in the

      webTarget element.

      grep -w -R ''disableCNCheck'' ${server.config.dir}'
