- id: 4.2.13
  title: Ensure that hardware crypto cards/modules (HSM) are used to store SSL/TLS certificates
  scoring: manual
  profile:
  - Level 2
  description: Hardware security modules (HSMs) are hardened, tamper-resistant hardware devices that secure cryptographic
    processes by generating, protecting, and managing keys used for encrypting and decrypting data and creating digital signatures
    and certificates.
  rationale: Using hardware security modules (HSM) to store and use certificates for the SSL/TLS communication provides greater
    security.
  impact: Hardware crypto cards/modules are external devices that can store certificates that can be used for the SSL/TLS
    communications. They store and protect the cryptographic keys throughout their lifecycles. The use of these devices have
    to be weighed against the security requirements and the additional expenses this would entail. The specific configuration
    needed to support depends on the crypto card and JDK. The following applies when using the IBM JDK and when the keyStore
    type is PKCS11.
  references:
  - 1. https://www.ibm.com/docs/en/was-liberty/base?topic=liberty-keystores
  page_start: 83
  audit_raw: 'Ensure that the location attribute is set to the specific hardware crypto configuration

    file. In addition ensure that type attribute is set to PKCS11. Both these are under the

    keyStore element of the SSL configuration in the Liberty configuration.

    grep -w -R -i ''location'' ${server.config.dir}

    grep -w -R -i ''type'' ${server.config.dir}'
  remediation: "Configure the location attribute to the specific hardware crypto card configuration file.\nIn addition configure\
    \ the type attribute to PKCS11. Both these attributes are in the\nkeyStore element used by the SSL configuration in\n\
    ${server.config.dir}/configDropins/overrides/*.xml.\nIn this example, the HWCryto.cfg contains the hardware crypto configuration\n\
    information.\n<keyStore id=\"hwKeyStore\"\n          location=\"${server.config.dir}/HWCrypto.cfg\"\n          type=\"\
    PKCS11\"\n          fileBased=\"false\"\n          provider=\"IBMPKCS11Impl\"\n   ...\n/>"
  checks:
  - type: command
    command: grep -w -R -i 'location' ${server.config.dir} && grep -w -R -i 'type' ${server.config.dir}
    expected: ''
    severity: medium
    info: 'Ensure that the location attribute is set to the specific hardware crypto configuration

      file. In addition ensure that type attribute is set to PKCS11. Both these are under the

      keyStore element of the SSL configuration in the Liberty configuration.

      grep -w -R -i ''location'' ${server.config.dir}

      grep -w -R -i ''type'' ${server.config.dir}'
