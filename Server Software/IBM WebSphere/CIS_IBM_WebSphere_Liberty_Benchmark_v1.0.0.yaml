    expected: ''
    severity: medium
    info: 'Ensure the existence of the hostNameVerificationEnabled attribute set to true in the

      openidConnectClient element in the Liberty configuration:

      grep -w -R -i ''hostNameVerificationEnabled'' ${server.config.dir}'
