- id: 5.4.1
  title: Ensure that all appropriate EJB methods are protected
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Access to the EJB methods should be protected appropriately using roles in deployment descriptor or annotations.
    Protect JAX-WS Web services applications by enabling HTTPS secure transport in WSSecurity policy. Enabling HTTPS secure
    transport in WS-Security policy protects JAXWS web services. Enable HTTPS for secure communications. Hashing passwords
    in the Username token of WS-Security policy obfuscates the password which is more secure. Use CallbackHandler to retrieve
    user password and for accessing private keys in keystore files. Using the CallbackHandler method to retrieve a user's
    password and access private keys in keystore files ___ (state benefit). Do not use plain text passwords in user and keystore
    fields for WebServices security. Signing and encrypting SOAP messages protects JAX-WS web services. Using keys with at
    least 2048 bits in length when signing and encrypting SOAP messages using WS-Security policy is more secure. Using strong
    signature and encryption algorithms when signing and encrypting SOAP messages using WS-Security policy increases security.
    Using strong signature and encryption algorithms when signing and encrypting SOAP messages using WS-Security policy is
    more secure. Enable hostname verification in JAX-WS applications by setting the http.conduit.tlsClientParameters.diableCNCheck
    HTTP conduit property to false. or Do not disable hostname verification in JAX-WS applications by setting the http.conduit.tlsClientParameters.diableCNCheck
    HTTP conduit property to true. or Enable hostname verification in JAX-WS applications. or Do not disable hostname verification
    in JAX-WS applications. Disabling hostname verification in JAX-WS applications by setting the http.conduit.tlsClientParameters.diableCNCheck
    HTTP conduit property to false. Disable hostname verification in JAX-WS applications by setting the http conduit property
    http.conduit.tlsClientParameters.disableCNCheck to false. Host names can be allowed or blocked from creating inbound TCP
    connections to different HTTP endpoints. Host names can be allowed or blocked from creating inbound TCP connections to
    different HTTP endpoints. IP addresses can be allowed or blocked from creating inbound TCP connections to different HTTP
    endpoints. IP addresses can be allowed or blocked from creating inbound TCP connections to different HTTP endpoints. Configuring
    TLS provides secure communication for JmsOutbound connections. Protect access to the metrics end point in the MicroProfile
    feature so that only valid users are allowed to access it. The SAF role mapper should be used to perform SAF authorization
    checks when accessing applications. The SAF Keyrings is a z/OS facility to hold the certificates that are used during
    the SSL/TLS communication. Use hardware crypto card to store to store cryptographic keys and certificates. The SAF user
    registry in the z/OS Operating System is robust and secure. The Websphere Liberty architecture provides developers with
    the option to tune their server to only the features that they need. For example, the JDBC feature only needs to be added
    if database access is required. If you did not want any remote administrative access to the REST interface, you would
    remove the REST feature. Sensitive information is stored in the Liberty configuration and can be in clear text unless
    encrypted or hashed. The WebSphere Liberty welcome page is enabled by default and is displayed when the root context “/”
    is accessed. The LTPA keys are generated using a password, if a password is not provided, then a default password is used.
    Configuring authorization for your application is to verify whether a user or group belongs to a specified role, and whether
    this role has the privilege to access a resource.
  rationale: Protecting the appropriate EJB methods will ensure that users have to provide the correct credentials to access
    them. Using TLS to protect the JAX-WS Web services applications will provide additional protection which may not be provided
    by SOAP message level security. Using one-way hash of password in username token instead of plaintext password prevents
    password leaks. Using CallbackHandler to retrieve user and keystore passwords is more secure than specifying plaintext
    passwords in Liberty configuration. Signing and encrypting SOAP messages protects against message tampering and information
    disclosure. Using 2048 bit keys for signing and encrypting is more secure than using 1024 bit keys. Using strong signature
    and encryption algorithms is more secure. Hostname verification enables the client to trust the server it is communicating
    with during the SSL/TLS handshake. Hostname verification mitigates the man-in-the-middle attackers which can spoof SSL/TLS
    servers via an arbitrary valid certificate by ensuring that SSL server hostname matches a domain name in the subject's
    Common Name (CN) of the X.509 certificate. Defining an IP address exclude list protects against unwanted inbound connections.
    Defining an IP address include list allows only wanted inbound connections. Defining an IP address exclude list protects
    against unwanted inbound connections. Defining an IP address include list allows only wanted inbound connections. TLS
    provides secure communication channel. Enabling authentication for the metrics end point will ensure that only authenticated
    users can access it. On the z/OS platform using the native z/OS facilities like the SAF authorization is recommended for
    application access checks. On z/OS using the native z/OS facilities like the SAF Keyrings to manage the SSL/TLS certificates
    is recommended. Using hardware crypto card to store and load cryptographic keys and certificates. Using hardware crypto
    cards can provide additional security guards against theft. The keys and certificates are used during cryptographic functions
    like encryption/decryption and also during the SSL/TLS communication. On z/OS using the native z/OS facilities like the
    SAF registry for authentication is recommended. Enabling only the necessary Liberty features minimizes the disk and memory
    footprint of the server as well as a faster start time. Having unused features could increase the chance of having a vulnerability
    due to the default settings of some features. Passwords should be encrypted or hashed to avoid inappropriate access to
    user accounts or using the passwords for unauthorized logins to remote systems such as databases or LDAP servers. Password
    information should also be kept in separate files with limited access to avoid unauthorized access or changes to configurations.
    The password encryption key also needs to be customized or a default key is used to encrypt passwords. For production,
    the Liberty welcome page should be disabled to avoid sharing unnecessary information about the server runtime. The LTPA
    password should be customized to avoid using the default password. Defining authorization roles ensures users cannot access
    resources they are not authorized to use.
