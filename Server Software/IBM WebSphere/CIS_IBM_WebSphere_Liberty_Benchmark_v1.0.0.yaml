- id: 4.1.1.3
  title: Ensure 'cookieDomain' cookie domain name attribute is set for the session cookies.
  scoring: scored
  profile:
  - Level 1
  description: The domain name attribute in a cookie specifies which hosts can receive the cookie.
  rationale: Ensure the JSESSIONID cookie is sent to the correct domain by configuring the domain name. This will prevent
    the cookie to be sent to servers in other domains.
  impact: ''
  references:
  - 1. https://openliberty.io/docs/latest/reference/config/httpSession.html
  page_start: 48
  audit_raw: 'Ensure the cookieDomain attribute in the httpSession element is set to the appropriate

    domain in the Liberty configuration

    grep -w -R -i ''cookieDomain'' ${server.config.dir}'
  remediation: 'Set the cookieDomain attribute in the httpSession element to the appropriate domain

    name in the ${server.config.dir}/configDropins/overrides/<any file name>.xml

    For Example, "mySubDomain.myCompany.com"

    <httpSession cookieDomain="mySubDomain.myCompany.com" />'
  checks:
  - type: command
    command: grep -w -R -i 'cookieDomain' ${server.config.dir}
    expected: ''
    severity: medium
    info: 'Ensure the cookieDomain attribute in the httpSession element is set to the appropriate

      domain in the Liberty configuration

      grep -w -R -i ''cookieDomain'' ${server.config.dir}'
- id: 4.1.1.4
