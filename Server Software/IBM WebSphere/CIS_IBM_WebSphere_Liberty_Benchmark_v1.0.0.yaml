- id: 4.2.5
  title: Ensure that secure ciphers suites are configured
  scoring: scored
  profile:
  - Level 1
  description: A cipher suite includes a set of algorithms used when making secure TLS connections. Strong cipher suites contain
    more secure algorithms.
  rationale: WebSphere Liberty provides groups of different strength cipher suites to use for the TLS handshake. The highest
    cipher group or a custom cipher list should be used for secure communication.
  impact: ''
  references:
  - 1. https://openliberty.io/docs/latest/reference/config/ssl.html
  - 2. https://www.ibm.com/docs/en/sdk-java-technology/8?topic=suites-cipher
  page_start: 71
  audit_raw: 'Ensure the securityLevel attribute is set to HIGH in all ssl elements in the Liberty

    configuration.

    grep -w -R -i ''securityLevel'' ${server.config.dir}

    Or ensure the enabledCiphers attribute is set to a customized list of ciphers in all ssl

    elements. The enabledCiphers attribute overrides the securityLevel attribute.

    grep -w -R -i ''enabledCiphers'' ${server.config.dir}

    For either configuration above, ensure the enforceCipherOrder attribute is set to true.

    grep -w -R -i ''enforceCipherOrder'' ${server.config.dir}'
  remediation: "Add the securityLevel attribute to all ssl elements to\n${server.config.dir}/configDropins/overrides/*.xml\
    \ and set the value to HIGH. Also\nadd the enforceCipherOrder attribute and set the value to true.\n<ssl ...\n    securityLevel=\"\
    HIGH\" enforceCipherOrder=\"true\" />\nOr add the enabledCiphers attribute to all ssl elements to\n${server.config.dir}/configDropins/overrides/*.xml\
    \ and set the value to space\nseparated list of appropriate strong ciphers in the preferred order. For example,\n<ssl\
    \ ...\n    enabledCiphers=\"TLS_AES_256_GCM_SHA384\nSSL_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384\nSSL_ECDHE_RSA_WITH_AES_256_GCM_SHA384\"\
    \ enforceCipherOrder=\"true\" />"
  checks:
  - type: command
    command: grep -w -R -i 'securityLevel' ${server.config.dir} && grep -w -R -i 'enabledCiphers' ${server.config.dir} &&
      grep -w -R -i 'enforceCipherOrder' ${server.config.dir}
