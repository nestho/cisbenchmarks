- id: 4.2.15
  title: Ensure that the Federal Information Processing Standards (FIPS) are used for the cryptographic modules
  scoring: manual
  profile:
  - Level 2
  description: The National Institute of Standards and Technology (NIST) issues the FIPS 140 Publication Series to coordinate
    the requirements and standards for cryptography modules that include both hardware and software components. Protection
    of a cryptographic module within a security system is necessary to maintain the confidentiality and integrity of the information
    protected by the module. This standard specifies the security requirements that will be satisfied by a cryptographic module.
  rationale: Federal Information Processing Standards (FIPS) are standards and guidelines that are issued by the National
    Institute of Standards and Technology (NIST) for federal government computer systems. You can set up Liberty to comply
    with FIPS requirements by setting system properties and specifying a FIPS-validated security provider.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/was-liberty/base?topic=liberty-setting-up-fipscompliance
