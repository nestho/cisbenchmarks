    $JAVA_HOME/jre/lib/security/java.security file.

    grep -w -R -i ''com.ibm.crypto.plus.provider.IBMJCEPlusFIPS'' ${JAVA_HOME}'
  remediation: 'Configure the system property -Dcom.ibm.jsse2.usefipsprovider to true and -

    Dcom.ibm.jsse2.usefipsProviderName to IBMJCEPlusFIPS in the jvm.options file. The

    link in reference section provides more information on how to customize the Liberty

    environment with system properties.

    -Dcom.ibm.jsse2.usefipsprovider=true

    -Dcom.ibm.jsse2.usefipsProviderName=`IBMJCEPlusFIPS`

    ...

    In addition, configure the IBMJCEPlusFIPS provider in the

    $JAVA_HOME/jre/lib/security/java.security file.

    security.provider.1=com.ibm.crypto.plus.provider.IBMJCEPlusFIPS

    ...'
  checks:
  - type: command
    command: grep -w -R -i '-Dcom.ibm.jsse2.usefipsprovider=true' ${server.config.dir} && grep -w -R -i '-Dcom.ibm.jsse2.usefipsProviderName=IBMJCEPlusFIPS'
      && grep -w -R -i 'com.ibm.crypto.plus.provider.IBMJCEPlusFIPS' ${JAVA_HOME}
    expected: ''
    severity: medium
    info: 'The FIPS standard can be enforced by setting the system properties -

      Dcom.ibm.jsse2.usefipsprovider=true and -

      Dcom.ibm.jsse2.usefipsProviderName=IBMJCEPlusFIPS when using IBM JDK. For other

      JDKs, follow their specific instructions.

