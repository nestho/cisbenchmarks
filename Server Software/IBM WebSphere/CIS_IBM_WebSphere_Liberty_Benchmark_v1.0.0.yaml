      ${server.config.dir}

      In ad'
- id: 4.3.1
  title: Ensure 'signatureAlgorithm' asymmetric key algorithm is set for encrypting the JSON Web Tokens
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The signatureAlgorithm is used to sign the JWT and can be configured to use different algorithms like HS256
    (symmetric), RS256 (asymmetric). SPNEGO authentication supports both constrained and unconstrained delegation. Constrained
    delegation provides the ability to specify and enforce application trust boundaries on a user's behalf by limiting the
    flow of the SPENGO tokens only to trusted servers.
  rationale: The OpenID Connect server provider should use an asymmetric algorithm to sign JSON Web Tokens (JWT) for better
    security since different keys are used for signing and verifying the token. Constrained delegation gives service administrators
    the ability to specify and enforce application trust boundaries by limiting the scope where application services can act
    on behalf of a user.
  impact: Enabling constrained delegation requires additional configuration at the external KDC (Kerberos Distribution Center)
    server that is creating the SPNEGO token. The additional configuration depends on the KDC.
  references:
  - 1. https://openliberty.io/docs/latest/reference/config/openidConnectProvider.html
  - 1. https://openliberty.io/docs/latest/reference/feature/constrainedDelegation1.0.html
  - 2. https://www.ibm.com/docs/en/wasliberty/nd?topic=SSAW57_liberty/com.ibm.websphere.wlp.doc/ae/twlp_config_ke
  page_start: 89
  audit_raw: 'Ensure the signatureAlgorithm attribute is set to a stronger algorithm like RS256 in the

    openidConnectProvider element for the OIDC provider and openidConnectClient for the

    OIDC client in the Liberty configuration

    grep -w -R -i ''signatureAlgorithm'' ${server.config.dir}

    If SPNEGO authentication is configured in the Liberty server make sure that the

    constrained delegation feature is also enabled in the Liberty configuration.

    grep -w -R -i ''spnego'' ${server.config.dir}

    grep -w -R -i ''constrainedDelegation'' ${server.config.dir}'
  remediation: 'Add the signatureAlgorithm attribute to the openidConnectProvider element and set it

    to a strong algorithm, such as RS256 in

    ${server.config.dir}/configDropins/overrides/*.xml.

    <openidConnectProvider signatureAlgorithm="RS256" />

    <openidConnectClient signatureAlgorithm="RS256" />

    In ${server.config.dir}/configDropins/overrides/<any file name>.xml, add the

    constrainedDelegation-1.0 feature to the featureManager element:

    <feature>constrainedDelegation-1.0</feature>'
  checks:
  - type: command
    command: grep -w -R -i 'signatureAlgorithm' ${server.config.dir} && grep -w -R -i 'spnego' ${server.config.dir} && grep
      -w -R -i 'constrainedDelegation' ${server.config.dir}
    expected: ''
    severity: medium
    info: 'Ensure the signatureAlgorithm attribute is set to a stronger algorithm like RS256 in the

      openidConnectProvider element for the OIDC provider and openidConnectClient for the

      OIDC client in the Liberty configuration

      grep -w -R -i ''signatureAlgorithm'' ${server.config.dir}

      If SPNEGO authentication is configured in the Liberty server make sure that the

      constrained delegation feature is also enabled in '
