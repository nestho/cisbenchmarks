controls:
- id: 3.1.2
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: PostgreSQL supports several methods for logging server messages, including stderr, csvlog, syslog, and jsonlog.
    On Windows, eventlog is also supported. One or more of these destinations should be set for server log output.
  rationale: If log_destination is not set, then any log messages generated by the core PostgreSQL processes will be lost.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 26
  audit_raw: "Execute the following SQL statement to view the currently active log destinations:\npostgres=# show log_destination;\n\
    \ log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's policies\
    \ on logging. If all the\nexpected log destinations are not set, this is a fail."
  remediation: "Execute the following SQL statements to remediate this setting (in this example, setting\nthe log destination\
    \ to csvlog):\npostgres=# alter system set log_destination = 'csvlog';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\nNote: If more than one log destination is to be used, set this parameter\
    \ to a list of\ndesired log destinations separated by commas (e.g. 'csvlog, stderr')."
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute the following SQL statement to view the currently active log destinations:\npostgres=# show log_destination;\n\
      \ log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's\
      \ policies on logging. If all the\nexpected log destinations are not set, this is a fail."
- id: 3.1.3
  title: Ensure the logging collector is enabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The logging collector is a background process that captures log messages sent to stderr and redirects them
    into log files. The logging_collector setting must be enabled in order for this process to run. It can only be set at
    the server start.
  rationale: 'The logging collector approach is often more useful than logging to syslog, since some types of messages might
    not appear in syslog output. One common example is dynamic-linker failure message; another may be error messages produced
    by scripts such as archive_command. Note: This setting must be enabled when log_destination is either stderr or csvlog
    or logs will be lost. Certain other logging parameters require it as well.'
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 28
  audit_raw: "Execute the following SQL statement and confirm that the logging_collector is\nenabled (on):\npostgres=# show\
    \ logging_collector;\n logging_collector\n-------------------\n on\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set logging_collector\
    \ = 'on';\nALTER SYSTEM\nUnfortunately, this setting can only be changed at the server (re)start. As root, restart\nthe\
    \ PostgreSQL service for this change to take effect:\n# whoami\nroot\n# systemctl restart postgresql-15\n# systemctl status\
    \ postgresql-15|grep 'ago$'\n   Active: active (running) since <date>; <count>s ago"
  checks:
  - type: sql
    command: show logging_collector;
    severity: medium
    info: "Execute the following SQL statement and confirm that the logging_collector is\nenabled (on):\npostgres=# show logging_collector;\n\
      \ logging_collector\n-------------------\n on\n(1 row)"
- id: 3.1.4
  title: Ensure the log file destination directory is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_directory setting specifies the destination directory for log files when log_destination is stderr
    or csvlog. It can be specified as relative to the cluster data directory ($PGDATA) or as an absolute path. log_directory
    should be set according to your organization's logging policy.
  rationale: If log_directory is not set, it is interpreted as the absolute path '/' and PostgreSQL will attempt to write
    its logs there (and typically fail due to a lack of permissions to that directory). This parameter should be set to direct
    the logs into the appropriate directory location as defined by your organization's logging policy.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 30
  audit_raw: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=#\
    \ show log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote: This shows a path relative to the cluster's\
    \ data directory. An absolute path would\nstart with a / like the following: /var/log/pg_log"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_directory='/var/log/postgres';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show log_directory;\n\
    \ log_directory\n---------------\n /var/log/postgres\n(1 row)\nNote: The use of /var/log/postgres, above, is an example.\
    \ This should be set to an\nappropriate path as defined by your organization's logging requirements. Having said\nthat,\
    \ it is a good idea to have the logs outside of your PGDATA directory so that they are\nnot included by things like pg_basebackup\
    \ or pgBackRest."
  checks:
  - type: sql
    command: show log_directory;
    severity: medium
    info: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=# show\
      \ log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote: This shows a path relative to the cluster's\
      \ data directory. An absolute path would\nstart with a / like the following: /var/log/pg_log"
- id: 3.1.5
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_filename setting specifies the filename pattern for log files. The value for log_filename should match
    your organization's logging policy. The value is treated as a strftime pattern, so %-escapes can be used to specify timevarying
    file names. The supported %-escapes are similar to those listed in the Open Group's strftime specification. If you specify
    a file name without escapes, you should plan to use a log rotation utility to avoid eventually filling the partition that
    contains log_directory. If there are any time-zone-dependent %-escapes, the computation is done in the zone specified
    by log_timezone. Also, the system's strftime is not used directly, so platform-specific (nonstandard) extensions do not
    work. If CSV-format output is enabled in log_destination, .csv will be appended to the log filename. (If log_filename
    ends in .log, the suffix is replaced instead.)
  rationale: If log_filename is not set, then the value of log_directory is appended to an empty string and PostgreSQL will
    fail to start as it will try to write to a directory instead of a file.
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man3/strftime.3.html
  - 2. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 32
  audit_raw: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
    \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote: This example shows the use of the strftime %a\
    \ escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log, postgresql-Tue.log, et\n\
    al)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_filename='postgresql-%Y%m%d.log';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show log_filename;\n\
    \   log_filename\n-------------------\n postgresql-%Y%m%d.log\n(1 row)\nNote: In this example, a new log file will be\
    \ created for each day (e.g. postgresql20200804.log)"
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
      \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote: This example shows the use of the strftime\
      \ %a escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log, postgresql-Tue.log,\
      \ et\nal)"
- id: 3.1.6
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_file_mode setting determines the file permissions for log files when logging_collector is enabled.
    The parameter value is expected to be a numeric mode specification in the form accepted by the chmod and umask system
    calls. (To use the customary octal format, the number must start with a 0 (zero).) The permissions should be set to allow
    only the necessary access to authorized personnel. In most cases, the best setting is 0600, so that only the server owner
    can read or write the log files. The other commonly useful setting is 0640, allowing members of the owner's group to read
    the files, although to make use of that, you will need to either alter the log_directory setting to store the log files
    outside the cluster data directory or use PGSETUP_INITDB_OPTIONS="-k -g" when initializing the cluster.
  rationale: Log files often contain sensitive data. Allowing unnecessary access to log files may inadvertently expose sensitive
    data to unauthorized personnel.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 34
  audit_raw: "Execute the following SQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
    postgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (with the example\nassuming the desired value\
    \ of 0600):\npostgres=# alter system set log_file_mode = '0600';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n\
    (1 row)"
  checks:
  - type: sql
    command: show log_file_mode;
    severity: medium
    info: "Execute the following SQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
      postgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
- id: 3.1.7
  title: Ensure 'log_truncate_on_rotation' is enabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'Enabling the log_truncate_on_rotation setting when logging_collector is enabled causes PostgreSQL to truncate
    (overwrite) existing log files with the same name during log rotation instead of appending to them. For example, using
    this setting in combination with a log_filename setting value like postgresql-%H.log would result in generating 24 hourly
    log files and then cyclically overwriting them: postgresql-00.log postgresql-01.log [...] postgresql-23.log Note: Truncation
    will occur only when a new file is being opened due to time-based rotation, not during server startup or size-based rotation
    (see later in this benchmark for size-based rotation details).'
  rationale: 'If this setting is disabled, pre-existing log files will be appended to if log_filename is configured in such
    a way that static or recurring names are generated. Enabling or disabling the truncation should only be decided when also
    considering the value of log_filename and log_rotation_age/log_rotation_size. Some examples to illustrate the interaction
    between these settings: # truncation is moot, as each rotation gets a unique filename (postgresql20180605.log) log_truncate_on_rotation
    = on log_filename = ''postgresql-%Y%m%d.log'' log_rotation_age = ''1d'' log_rotation_size = 0 # truncation every hour,
    losing log data every hour until the date changes log_truncate_on_rotation = on log_filename = ''postgresql-%Y%m%d.log''
    log_rotation_age = ''1h'' log_rotation_size = 0 # no truncation if the date changed before generating 100M of log data,
    truncation otherwise log_truncate_on_rotation = on log_filename = ''postgresql-%Y%m%d.log'' log_rotation_age = ''0'' log_rotation_size
    = ''100M'''
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 36
  audit_raw: "Execute the following SQL statement to verify how log_truncate_on_rotation is set:\npostgres=# show log_truncate_on_rotation;\n\
    \ log_truncate_on_rotation\n--------------------------\n on\n(1 row)\nIf it is not set to on, this is a fail (depending\
    \ on your organization's logging policy)."
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_truncate_on_rotation\
    \ = 'on';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=#\
    \ show log_truncate_on_rotation;\n log_truncate_on_rotation\n--------------------------\n on\n(1 row)"
  checks:
  - type: sql
    command: show log_truncate_on_rotation;
    severity: medium
    info: "Execute the following SQL statement to verify how log_truncate_on_rotation is set:\npostgres=# show log_truncate_on_rotation;\n\
      \ log_truncate_on_rotation\n--------------------------\n on\n(1 row)\nIf it is not set to on, this is a fail (depending\
      \ on your organization's logging policy)."
- id: 3.1.8
  title: Ensure the maximum log file lifetime is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: When logging_collector is enabled, the log_rotation_age parameter determines the maximum lifetime of an individual
    log file (depending on the value of log_filename). After this many minutes have elapsed, a new log file will be created
    via automatic log file rotation. Current best practices advise log rotation at least daily, but your organization's logging
    policy should dictate your rotation schedule.
  rationale: Log rotation is a standard best practice for log management.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 39
  audit_raw: "Execute the following SQL statement to verify the log rotation age is set to an\nacceptable value:\npostgres=#\
    \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example,\nsetting it to one hour):\n\
    postgres=# alter system set log_rotation_age='1h';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_rotation_age;
    severity: medium
    info: "Execute the following SQL statement to verify the log rotation age is set to an\nacceptable value:\npostgres=#\
      \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d"
- id: 3.1.9
  title: Ensure the maximum log file size is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_rotation_size setting determines the maximum size of an individual log file. Once the maximum size
    is reached, automatic log file rotation will occur.
  rationale: If this is set to zero, the size-triggered creation of new log files is disabled. This will prevent automatic
    log file rotation when files become too large, which could put log data at increased risk of loss (unless age-based rotation
    is configured).
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 41
  audit_raw: "Execute the following SQL statement to verify that log_rotation_size is set in\ncompliance with the organization's\
    \ logging policy:\npostgres=# show log_rotation_size;\n log_rotation_size\n-------------------\n 0\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example,\nsetting it to 1GB):\n\
    postgres=# alter system set log_rotation_size = '1GB';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_rotation_size;
    severity: medium
    info: "Execute the following SQL statement to verify that log_rotation_size is set in\ncompliance with the organization's\
      \ logging policy:\npostgres=# show log_rotation_size;\n log_rotation_size\n-------------------\n 0\n(1 row)"
- id: 3.1.10
  title: Ensure the correct syslog facility is selected
  scoring: manual
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The syslog_facility setting specifies the syslog "facility" to be used when logging to syslog is enabled.
    You can choose from any of the ''local'' facilities: • LOCAL0 • LOCAL1 • LOCAL2 • LOCAL3 • LOCAL4 • LOCAL5 • LOCAL6 •
    LOCAL7 Your organization''s logging policy should dictate which facility to use based on the syslog daemon in use.'
  rationale: If not set to the appropriate facility, the PostgreSQL log messages may be intermingled with other applications'
    log messages, incorrectly routed, or potentially dropped (depending on your syslog configuration).
  impact: ''
  references:
  - 1. https://tools.ietf.org/html/rfc3164#section-4.1.1
  - 2. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 43
  audit_raw: "Execute the following SQL statement and verify that the correct facility is selected:\npostgres=# show syslog_facility;\n\
    \ syslog_facility\n-----------------\n local0\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example,\nsetting it to the LOCAL1\
    \ facility):\npostgres=# alter system set syslog_facility = 'LOCAL1';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show syslog_facility;
    severity: medium
    info: "Execute the following SQL statement and verify that the correct facility is selected:\npostgres=# show syslog_facility;\n\
      \ syslog_facility\n-----------------\n local0\n(1 row)"
- id: 3.1.11
  title: Ensure syslog messages are not suppressed
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: When logging to Syslog and syslog_sequence_numbers is on, then each message will be prefixed by an increasing
    sequence number (such as [2]).
  rationale: Many modern Syslog implementations perform a log optimization and suppress repeated log entries while emitting
    “--- last message repeated N times ---”. In more modern Syslog implementations, repeated message suppression can be configured
    (for example, $RepeatedMsgReduction in rsyslog).
  impact: If disabled, messages sent to Syslog could be suppressed and not logged. While a message is emitted stating that
    a given message was repeated and suppressed, the timestamp associated with these suppressed messages is lost, potentially
    damaging the recreation of an incident timeline.
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 45
  audit_raw: "Execute the following SQL statement and confirm that the syslog_sequence_numbers is\nenabled (on):\npostgres=#\
    \ show syslog_sequence_numbers;\n syslog_sequence_numbers\n-------------------------\n on\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set syslog_sequence_numbers\
    \ = 'on';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show syslog_sequence_numbers;
    severity: medium
    info: "Execute the following SQL statement and confirm that the syslog_sequence_numbers is\nenabled (on):\npostgres=#\
      \ show syslog_sequence_numbers;\n syslog_sequence_numbers\n-------------------------\n on\n(1 row)"
- id: 3.1.12
  title: Ensure syslog messages are not lost due to size
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: PostgreSQL log messages can exceed 1024 bytes, which is a typical size limit for traditional Syslog implementations.
    When syslog_split_messages is off, PostgreSQL server log messages are delivered to the Syslog service as is, and it is
    up to the Syslog service to cope with the potentially bulky messages. When syslog_split_messages is on, messages are split
    by lines, and long lines are split so that they will fit into 1024 bytes. If syslog is ultimately logging to a text file,
    then the effect will be the same either way, and it is best to leave the setting on, since most syslog implementations
    either cannot handle large messages or would need to be specially configured to handle them. But if syslog is ultimately
    writing into some other medium, it might be necessary or more useful to keep messages logically together.
  rationale: ''
  impact: Depending on the Syslog server in use, log messages exceeding 1024 bytes may be lost or, potentially, cause the
    Syslog server processes to abort.
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 47
  audit_raw: "Execute the following SQL statement to confirm that long log messages are split when\nlogging to Syslog:\npostgres=#\
    \ show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set syslog_split_messages\
    \ = 'on';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show syslog_split_messages;
    severity: medium
    info: "Execute the following SQL statement to confirm that long log messages are split when\nlogging to Syslog:\npostgres=#\
      \ show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
- id: 3.1.13
  title: Ensure the program name for PostgreSQL syslog messages is correct
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The syslog_ident setting specifies the program name used to identify PostgreSQL messages in syslog logs. An
    example of a possible program name is postgres.
  rationale: If this is not set correctly, it may be difficult or impossible to distinguish PostgreSQL messages from other
    messages in Syslog logs.
  impact: ''
  references:
  - 1. https://tools.ietf.org/html/rfc3164#section-4.1.3
  - 2. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 49
  audit_raw: "Execute the following SQL statement to verify the program name is set correctly:\npostgres=# show syslog_ident;\n\
    \ syslog_ident\n--------------\n postgres\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example,\nassuming a program name\
    \ of proddb):\npostgres=# alter system set syslog_ident = 'proddb';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show syslog_ident;\n syslog_ident\n--------------\n proddb\n\
    (1 row)"
  checks:
  - type: sql
    command: show syslog_ident;
    severity: medium
    info: "Execute the following SQL statement to verify the program name is set correctly:\npostgres=# show syslog_ident;\n\
      \ syslog_ident\n--------------\n postgres\n(1 row)"
- id: 3.1.14
  title: Ensure the correct messages are written to the server log
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The log_min_messages setting specifies the message levels that are written to the server log. Each level includes
    all the levels that follow it. The lower the level (vertically, below), the fewer messages are logged. Valid values are:
    • DEBUG5 <-- exceedingly chatty • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING <-- default • ERROR • LOG
    • FATAL • PANIC <-- practically mute WARNING is considered the best practice unless indicated otherwise by your organization''s
    logging policy.'
  rationale: If this is not set to the correct value, too many or too few messages may be written to the server log.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 51
  audit_raw: "Execute the following SQL statement to confirm the setting is correct:\npostgres=# show log_min_messages;\n\
    \ log_min_messages\n------------------\n warning\n(1 row)\nIf logging is not configured to at least warning, this is a\
    \ fail."
  remediation: "Execute the following SQL statement(s) as superuser to remediate this setting (in this\nexample, to set it\
    \ to warning):\npostgres=# alter system set log_min_messages = 'warning';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_min_messages;
    severity: medium
    info: "Execute the following SQL statement to confirm the setting is correct:\npostgres=# show log_min_messages;\n log_min_messages\n\
      ------------------\n warning\n(1 row)\nIf logging is not configured to at least warning, this is a fail."
- id: 3.1.15
  title: Ensure the correct SQL statements generating errors are recorded
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The log_min_error_statement setting causes all SQL statements generating errors at or above the specified
    severity level to be recorded in the server log. Each level includes all the levels that follow it. The lower the level
    (vertically, below), the fewer messages are recorded. Valid values are: • DEBUG5 <-- exceedingly chatty • DEBUG4 • DEBUG3
    • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING • ERROR <-- default • LOG • FATAL • PANIC <-- practically mute ERROR is considered
    the best practice setting. Changes should only be made in accordance with your organization''s logging policy. Note: To
    effectively turn off logging of failing statements, set this parameter to PANIC.'
  rationale: If this is not set to the correct value, too many erring or too few erring SQL statements may be written to the
    server log.
  impact: ''
