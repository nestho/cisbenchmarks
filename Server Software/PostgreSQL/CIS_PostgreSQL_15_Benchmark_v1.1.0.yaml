  audit_raw: "Execute the following SQL statement:\npostgres=# show log_timezone;\n log_timezone\n--------------\n US/Eastern\n\
    (1 row)\nIf log_timezone is not set to GMT, UTC, or as defined by your organization's logging policy\nthis is a fail.\n\
    First, as the database administrator (shown here as \"postgres\"), verify pgAudit is\nenabled by running the following\
    \ commands:\npostgres=# show shared_preload_libraries;\n shared_preload_libraries\n--------------------------\n(1 row)\n\
    If the output does not contain \"pgaudit\", this is a fail.\nNext, verify that desired auditing components are enabled:\n\
    postgres=# show pgaudit.log;\nERROR:  unrecognized configuration parameter \"pgaudit.log\"\nIf the output does not contain\
    \ the desired auditing components, this is a fail.\nThe list below summarizes pgAudit.log components:\n• READ: SELECT\
    \ and COPY when the source is a relation or a query.\n• WRITE: INSERT, UPDATE, DELETE, TRUNCATE, and COPY when the destination\
    \ is a\nrelation.\n• FUNCTION: Function calls and DO blocks.\n• ROLE: Statements related to roles and privileges: GRANT,\
    \ REVOKE,\nCREATE/ALTER/DROP ROLE.\n• DDL: All DDL that is not included in the ROLE class.\n• MISC: Miscellaneous commands,\
    \ e.g. DISCARD, FETCH, CHECKPOINT, VACUUM.\nLog in as an Operating System user authorized to escalate privileges and test\
    \ the sudo\ninvocation by executing the following:\n# whoami\nuser1\n# groups\nuser1\n# sudo -iu postgres\n[sudo] password\
    \ for user1:\nuser1 is not in the sudoers file. This incident will be reported.\nAs shown above, user1 has not been added\
    \ to the /etc/sudoers file or made a member\nof any group listed in the /etc/sudoers file. Whereas:\n# whoami\nuser2\n\
    # groups\nuser2 dba\n# sudo -iu postgres\n[sudo] password for user2:\n# whoami\npostgres\nThis shows that the user2 user\
    \ is configured properly for sudo access by being a\nmember of the dba group.\nFirst, inspect the privileges granted to\
    \ the database superuser (identified here as\npostgres) using the display command psql -c \"\\du postgres\" to establish\
    \ a baseline\nfor granted administrative privileges. Based on the output below, the postgres\nsuperuser can create roles,\
    \ create databases, manage replication, and bypass rowlevel security (RLS):\n# whoami\npostgres\n# psql -c \"\\du postgres\"\
    \n                              List of roles\nRole name |                    Attributes                   | Member of\n\
    ----------+-------------------------------------------------+-----------\npostgres  | Superuser, Create role, Create DB,\
    \ Replication, | {}\n          | Bypass RLS                                      |\nNow, let's inspect the same information\
    \ for a mock regular user called appuser using the\ndisplay command psql -c \"\\du appuser\". The output confirms that\
    \ regular user\nappuser has the same elevated privileges as system administrator user postgres. This\nis a fail.\n# whoami\n\
    postgres\n# psql -c \"\\du appuser\"\n                              List of roles\nRole name |                    Attributes\
    \                   | Member of\n----------+-------------------------------------------------+-----------\nappuser   |\
    \ Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                                      |\n\
    While this example demonstrated excessive administrative privileges granted to a single\nuser, a comprehensive audit should\
    \ be conducted to inspect all database users for\nexcessive administrative privileges. This can be accomplished via either\
    \ of the\ncommands below.\n# whoami\npostgres\n# psql -c \"\\du *\"\n# psql -c \"select * from pg_user order by usename\"\
    \nNote: Using \\du * will show all the default PostgreSQL roles (e.g. pg_monitor) as well\nas any 'normal' roles. This\
    \ is expected, and should not be cause for alarm.\nFunctions in PostgreSQL can be created with the SECURITY DEFINER option.\
    \ When\nSECURITY DEFINER functions are executed by a user, said function is run with the\nprivileges of the user who created\
    \ it, not the user who is running it.\nTo list all functions that have SECURITY DEFINER, run the following SQL:\n# whoami\n\
    root\n# sudo -iu postgres\n# psql -c \"SELECT nspname, proname, proargtypes, prosecdef, rolname,\nproconfig FROM pg_proc\
    \ p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid a ON a.oid = p.proowner WHERE proname NOT LIKE 'pgaudit%'\
    \ AND\n(prosecdef OR NOT proconfig IS NULL);\"\nIn the query results, a prosecdef value of 't' on a row indicates that\
    \ that function uses\nprivilege elevation.\nIf elevation privileges are utilized which are not required or are expressly\
    \ forbidden by\norganizational guidance, this is a fail.\nTo audit excessive DML privileges, take an inventory of all\
    \ users defined in the cluster\nusing the \\du+ * SQL command, as well as all tables defined in the database using the\n\
    \\dt *.* SQL command. Furthermore, the intersection matrix of tables and user grants\ncan be obtained by querying system\
    \ catalogs pg_tables and pg_user. Note that in\nPostgreSQL, users can be defined cluster-wide across all databases or\
    \ for a specific\ndatabase, while schemas and tables are specific to a particular database. Therefore,\nthe commands below\
    \ should be executed for each defined database in the cluster. With\nthis information, inspect database table grants and\
    \ determine if any are excessive for\ndefined database users.\npostgres=# -- display all users defined in the cluster\n\
    postgres=# \\x\nExpanded display is on.\npostgres=# \\du+ *\nList of roles\n-[ RECORD 1 ]-------------------------------------------------------------\n\
    Role name   | pg_checkpoint\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 2 ]-------------------------------------------------------------\n\
    Role name   | pg_database_owner\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 3 ]-------------------------------------------------------------\n\
    Role name   | pg_execute_server_program\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 4 ]-------------------------------------------------------------\n\
    Role name   | pg_monitor\nAttributes  | Cannot login\nMember of   | {pg_read_all_settings,pg_read_all_stats,pg_stat_scan_tables}\n\
    Description |\n-[ RECORD 5 ]-------------------------------------------------------------\nRole name   | pg_read_all_data\n\
    Attributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 6 ]-------------------------------------------------------------\n\
    Role name   | pg_read_all_settings\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 7 ]-------------------------------------------------------------\n\
    Role name   | pg_read_all_stats\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 8 ]-------------------------------------------------------------\n\
    Role name   | pg_read_server_files\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 9 ]-------------------------------------------------------------\n\
    Role name   | pg_signal_backend\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 10 ]------------------------------------------------------------\n\
    Role name   | pg_stat_scan_tables\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 11 ]------------------------------------------------------------\n\
