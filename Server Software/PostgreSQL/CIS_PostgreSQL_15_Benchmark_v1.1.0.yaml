- id: 3.1.26
  title: Ensure 'log_timezone' is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The log_timezone setting specifies the time zone to use in timestamps within log messages. This value is cluster-wide,
    so that all sessions will report timestamps consistently. Unless directed otherwise by your organization''s logging policy,
    set this to either GMT or UTC. The PostgreSQL Audit Extension (pgAudit) provides detailed session and/or object audit
    logging via the standard PostgreSQL logging facility. The goal of pgAudit is to provide PostgreSQL users with the capability
    to produce audit logs often required to comply with government, financial, or ISO certifications. It is common to have
    more than one authorized individual administering the PostgreSQL service at the Operating System level. It is also quite
    common to permit login privileges to individuals on a PostgreSQL host who otherwise are not authorized to access the server''s
    data cluster and files. Administering the PostgreSQL data cluster, as opposed to its data, is to be accomplished via a
    localhost login of a regular UNIX user account. Access to the postgres superuser account is restricted in such a manner
    as to interdict unauthorized access. sudo satisfies the requirements by escalating ordinary user account privileges as
    the PostgreSQL RDBMS superuser. With respect to PostgreSQL administrative SQL commands, only superusers should have elevated
    privileges. PostgreSQL regular, or application, users should not possess the ability to create roles, create new databases,
    manage replication, or perform any other action deemed privileged. Typically, regular users should only be granted the
    minimal set of privileges commensurate with managing the application: • DDL (create table, create view, create index,
    etc.) • DML (select, insert, update, delete) Further, it has become best practice to create separate roles for DDL and
    DML. Given an application called ''payroll'', one would create the following users: • payroll_owner • payroll_user Any
    DDL privileges would be granted to the payroll_owner account only, while DML privileges would be given to the payroll_user
    account only. This prevents accidental creation/altering/dropping of database objects by application code that runs as
    the payroll_user account. In certain situations, to provide the required functionality, PostgreSQL needs to execute internal
    logic (stored procedures, functions, triggers, etc.) and/or external code modules with elevated privileges. However, if
    the privileges required for execution are at a higher level than the privileges assigned to organizational users invoking
    the functionality applications/programs, those users are indirectly provided with greater privileges than assigned by
    their organization. This is known as privilege elevation. Privilege elevation must be utilized only where necessary. Execute
    privileges for application functions should be restricted to authorized users only. DML (insert, update, delete) operations
    at the table level should be restricted to only authorized users. PostgreSQL manages table-level DML permissions via the
    GRANT statement. In addition to the SQL-standard privilege system available through GRANT, tables can have row security
    policies that restrict, on a per-user basis, which individual rows can be returned by normal queries or inserted, updated,
    or deleted by data modification commands. This feature is also known as Row Level Security (RLS). By default, tables do
    not have any policies, so if a user has access privileges to a table according to the SQL privilege system, all rows within
    it are equally available for querying or updating. Row security policies can be specific to commands, to roles, or to
    both. A policy can be specified to apply to ALL commands, or to any combination of SELECT, INSERT, UPDATE, or DELETE.
    Multiple roles can be assigned to a given policy, and normal role membership and inheritance rules apply. If you use RLS
    and apply restrictive policies to certain users, it is important that the Bypass RLS privilege not be granted to any unauthorized
    users. This privilege overrides RLS-enabled tables and associated policies. Generally, only superusers and elevated users
    should possess this privilege. PostgreSQL access to the superuser database role must be controlled and audited to prevent
    unauthorized access. Note: Prior to performing this audit you must create a roletree view. Here are the procedures to
    create this view: postgres=# DROP VIEW IF EXISTS roletree; CREATE OR REPLACE VIEW roletree AS WITH RECURSIVE roltree AS
    ( SELECT u.rolname AS rolname, u.oid AS roloid, u.rolcanlogin, u.rolsuper, ''{}''::name[] AS rolparents, NULL::oid AS
    parent_roloid, NULL::name AS parent_rolname FROM pg_catalog.pg_authid u LEFT JOIN pg_catalog.pg_auth_members m on u.oid
    = m.member LEFT JOIN pg_catalog.pg_authid g on m.roleid = g.oid WHERE g.oid IS NULL UNION ALL SELECT u.rolname AS rolname,
    u.oid AS roloid, u.rolcanlogin, u.rolsuper, t.rolparents || g.rolname AS rolparents, g.oid AS parent_roloid, g.rolname
    AS parent_rolname FROM pg_catalog.pg_authid u JOIN pg_catalog.pg_auth_members m on u.oid = m.member JOIN pg_catalog.pg_authid
    g on m.roleid = g.oid JOIN roltree t on t.roloid = g.oid ) SELECT r.rolname, r.roloid, r.rolcanlogin, r.rolsuper, r.rolparents
    FROM roltree r ORDER BY 1; PostgreSQL provides a set of predefined roles that provide access to certain commonly needed
    privileged capabilities and information. Administrators can GRANT these roles to users and/or other roles in their environment,
    providing those users with access to the specified capabilities and information. A remote host login, via SSH, is arguably
    the most secure means of remotely accessing and administering the PostgreSQL server. Once connected to the PostgreSQL
    server, using the psql client, via UNIX DOMAIN SOCKETS, while using the peer authentication method is the most secure
    mechanism available for local database connections. Provided a database user account of the same name of the UNIX account
    has already been defined in the database, even ordinary user accounts can access the cluster in a similarly highly secure
    manner. A large number of authentication METHODs are available for hosts connecting using TCP/IP sockets, including: •
    trust • reject • md5 • scram-sha-256 • password • gss • sspi • ident • pam • ldap • radius • cert METHODs trust, password,
    and ident are not to be used for remote logins. METHOD md5 is the most popular and can be used in both encrypted and unencrypted
    sessions, however, it is vulnerable to packet replay attacks. It is recommended that scram-sha-256 be used instead of
    md5. Use of the gss, sspi, pam, ldap, radius, and cert METHODs are dependent upon the availability of external authenticating
    processes/services and thus are not covered in this benchmark. Password complexity configuration is crucial to restrict
    unauthorized access to data. By default, PostgreSQL doesn’t provide for password complexity. Moreover, many compliance
    frameworks such as PCI DSS, and HIPPA require both password complexity and length. It is worth stating that the NIST 800-63B
    Password Guidelines publication is a good reference of authentication management. Understanding the vulnerability of PostgreSQL
    runtime parameters by the particular delivery method, or attack vector. In order to serve multiple clients efficiently,
    the PostgreSQL server launches a new "backend" process for each client. The runtime parameters in this benchmark section
    are controlled by the backend process. The server''s performance, in the form of slow queries causing a denial of service,
    and the RDBM''s auditing abilities for determining root cause analysis can be potentially compromised via these parameters.
    PostgreSQL runtime parameters that are executed by the postmaster process. PostgreSQL runtime parameters that are executed
    by the SIGHUP signal. PostgreSQL runtime parameters that can only be executed by the server''s superuser, postgres. These
    PostgreSQL runtime parameters are managed at the user account (ROLE) level. Install, configure, and use OpenSSL on a platform
    that has a NIST certified FIPS 140-2 installation of OpenSSL. This provides PostgreSQL instances the ability to generate
    and validate cryptographic hashes to protect unclassified information requiring confidentiality and cryptographic protection,
    in accordance with the data owner''s requirements. TLS on a PostgreSQL server should be enabled and configured to encrypt
    TCP traffic to and from the server. PostgreSQL must implement cryptographic mechanisms to prevent unauthorized disclosure
    or modification of organization-defined information at rest (to include, at a minimum, PII and classified information)
    on organization-defined information system components. Create a new user specifically for use by streaming replication
    instead of using the superuser account. Enabling the log_replication_commands setting causes each attempted replication
    from the server to be logged. A ''base backup'' is a copy of the PRIMARY host''s data cluster ($PGDATA) and is used to
    create STANDBY hosts and for Point In Time Recovery (PITR) mechanisms. Base backups should be copied across networks in
    a secure manner using an encrypted transport mechanism. The PostgreSQL CLI pg_basebackup can be used, however, TLS encryption
    should be enabled on the server as per section 6.8 of this benchmark. The pgBackRest tool detailed in section 8.3 of this
    benchmark can also be used to create a ''base backup''. Write Ahead Log (WAL) Archiving, or Log Shipping, is the process
    of sending transaction log files from the PRIMARY host either to one or more STANDBY hosts or to be archived on a remote
    storage device for later use, e.g. PITR. There are several utilities that can copy WALs including, but not limited to,
    cp, scp, sftp, and rynsc. Basically, the server follows a set of runtime parameters which define when the WAL should be
    copied using one of the aforementioned utilities. Streaming replication from a PRIMARY host transmits DDL, DML, passwords,
    and other potentially sensitive activities and data. These connections should be protected with Secure Sockets Layer (SSL).
    The PostgreSQL cluster is organized to carry out specific tasks in subdirectories. For the purposes of performance, reliability,
    and security some of these subdirectories should be relocated outside the data cluster. pgBackRest aims to be a simple,
    reliable backup and restore system that can seamlessly scale up to the largest databases and workloads. Instead of relying
    on traditional backup tools like tar and rsync, pgBackRest implements all backup features internally and uses a custom
    protocol for communicating with remote systems. Removing reliance on tar and rsync allows for better solutions to database-specific
    backup challenges. The custom remote protocol allows for more flexibility and limits the types of connections that are
    required to perform a backup which increases security. This recommendation covers non-regular, special files, and dynamic
    libraries. PostgreSQL permits local logins via the UNIX DOMAIN SOCKET and, for the most part, anyone with a legitimate
    Unix login account can make the attempt. Limiting PostgreSQL login attempts can be made by relocating the UNIX DOMAIN
    SOCKET to a subdirectory with restricted permissions. The creation and implementation of user-defined dynamic libraries
    is an extraordinary powerful capability. In the hands of an experienced DBA/programmer, it can significantly enhance the
    power and flexibility of the RDBMS; but new and unexpected behavior can also be assigned to the RDBMS, resulting in a
    very dangerous environment in what should otherwise be trusted.'
  rationale: 'Log entry timestamps should be configured for an appropriate time zone as defined by your organization''s logging
    policy to ensure a lack of confusion around when a logged event occurred. Note that this setting affects only the timestamps
    present in the logs. It does not affect the time zone in use by the database itself (for example, select now()), nor does
    it affect the host''s time zone. Basic statement logging can be provided by the standard logging facility with log_statement
    = all. This is acceptable for monitoring and other uses but does not provide the level of detail generally required for
    an audit. It is not enough to have a list of all the operations performed against the database, it must also be possible
    to find particular statements that are of interest to an auditor. The standard logging facility shows what the user requested,
    while pgAudit focuses on the details of what happened while the database was satisfying the request. When logging SELECT
    and DML statements, pgAudit can be configured to log a separate entry for each relation referenced in a statement. No
    parsing is required to find all statements that touch a particular table. In fact, the goal is that the statement text
    is provided primarily for deep forensics and should not be required for an audit. Without sudo, there would be no capabilities
    to strictly control access to the superuser account nor to securely and authoritatively audit its use. By not restricting
    global administrative commands to superusers only, regular users granted excessive privileges may execute administrative
    commands with unintended and undesirable results. Ideally, all application source code should be vetted to validate interactions
    between the application and the logic in the database, but this is usually not possible or feasible with available resources
    even if the source code is available. The DBA should attempt to obtain assurances from the development organization that
    this issue has been addressed and should document what has been discovered. The DBA should also inspect all application
    logic stored in the database (in the form of functions, rules, and triggers) for excessive privileges. Excessive DML grants
    can lead to unprivileged users changing or deleting information without proper authorization. If RLS policies and privileges
    are not configured correctly, users could perform actions on tables that they are not authorized to perform, such as inserting,
    updating, or deleting rows. Even when reducing and limiting the access to the superuser role as described earlier in this
    benchmark, it is still difficult to determine who accessed the superuser role and what actions were taken using that role.
    As such, it is ideal to prevent anyone from logging in as the superuser and forcing them to escalate their role. This
    model is used at the OS level by the use of sudo and should be emulated in the database. The set_user extension allows
    for this setup. In keeping with the principle of least privilege, judicious use of the PostgreSQL predefined roles can
    greatly limit the access to privileged, or superuser, access. Having strong password management for your locally-authenticated
    PostgreSQL accounts will protect against attackers'' brute force techniques. This is important especially if external
    authentication is not possible to implement due to application requirements or restrictions. There are as many ways of
    compromising a server as there are runtime parameters. A combination of any one or more of them executed at the right
    time under the right conditions has the potential to compromise the RDBMS. Mitigating risk is dependent upon one''s understanding
    of the attack vectors and includes: 1. Via user session: includes those runtime parameters that can be set by a ROLE that
    persists for the life of a server-client session. 2. Via attribute: includes those runtime parameters that can be set
    by a ROLE during a server-client session that can be assigned as an attribute for an entity such as a table, index, database,
    or role. 3. Via server reload: includes those runtime parameters that can be set by the superuser using a SIGHUP or configuration
    file reload command and affects the entire cluster. 4. Via server restart: includes those runtime parameters that can
    be set and effected by restarting the server process and affects the entire cluster. A denial of service is possible by
    denying the use of indexes and by slowing down client access to an unreasonable level. Unsanctioned behavior can be introduced
    by introducing rogue libraries which can then be called in a database session. Logging can be altered and obfuscated inhibiting
    root cause analysis. The postmaster process is the supervisory process that assigns a backend process to an incoming client
    connection. The postmaster manages key runtime parameters that are either shared by all backend connections or needed
    by the postmaster process itself to run. In order to define server behavior and optimize server performance, the server''s
    superuser has the privilege of setting these parameters which are found in the configuration files postgresql.conf and
    pg_hba.conf. Alternatively, those parameters found in postgresql.conf can also be changed using a server login session
    and executing the SQL command ALTER SYSTEM which writes its changes in the configuration file postgresql.auto.conf. In
    order to improve and optimize server performance, the server''s superuser has the privilege of setting these parameters
    which are found in the configuration file postgresql.conf. Alternatively, they can be changed in a PostgreSQL login session
    via the SQL command ALTER SYSTEM which writes its changes in the configuration file postgresql.auto.conf. In order to
    improve performance and optimize features, a ROLE has the privilege of setting numerous parameters in a transaction, session,
    or entity attribute. Any ROLE can alter any of these parameters. Federal Information Processing Standard (FIPS) Publication
    140-2 is a computer security standard developed by a U.S. Government and industry working group for validating the quality
    of cryptographic modules. Use of weak, or untested, encryption algorithms undermines the purposes of utilizing encryption
    to protect data. PostgreSQL uses OpenSSL for the underlying encryption layer. The database and application must implement
    cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance
    they have been tested and validated. It is the responsibility of the data owner to assess the cryptography requirements
    in light of applicable federal laws, Executive Orders, directives, policies, regulations, and standards. For detailed
    information, refer to NIST FIPS Publication 140-2, Security Requirements for Cryptographic Modules. Note that the product''s
    cryptographic modules must be validated and certified by NIST as FIPS-compliant. The security functions validated as part
    of FIPS 140-2 for cryptographic modules are described in FIPS 140-2 Annex A. Currently, only Red Hat Enterprise Linux
    is certified as a FIPS 140-2 distribution of OpenSSL. For other operating systems, users must obtain or build their own
    FIPS 1402 OpenSSL libraries. If TLS is not enabled and configured correctly, this increases the risk of data being compromised
    in transit. PostgreSQL instances handling data that requires "data at rest" protections must employ cryptographic mechanisms
    to prevent unauthorized disclosure and modification of the information at rest. These cryptographic mechanisms may be
    native to PostgreSQL or implemented via additional software or operating system/file system settings, as appropriate to
    the situation. Information at rest refers to the state of information when it is located on a secondary storage device
    (e.g. disk drive, tape drive) within an organizational information system. The selection of a cryptographic mechanism
    is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate
    with the security category and/or classification of the information. Organizations have the flexibility to either encrypt
    all information on storage devices (i.e. full disk encryption) or encrypt specific data structures (e.g. files, records,
    or fields). Organizations may also optionally choose to implement both to implement layered security. The decision of
    whether, and what, to encrypt rests with the data owner and is also influenced by the physical measures taken to secure
    the equipment and media on which the information resides. Organizations may choose to employ different mechanisms to achieve
    confidentiality and integrity protection, as appropriate. If the confidentiality and integrity of application data are
    not protected, the data will be open to compromise and unauthorized modification. The PostgreSQL pgcrypto extension provides
    cryptographic functions for PostgreSQL and is intended to address the confidentiality and integrity of user and system
    information at rest in non-mobile devices. As it is not necessary to be a superuser to initiate a replication connection,
    it is proper to create an account specifically for replication. This allows further ''locking down'' the uses of the superuser
    account and follows the general principle of using the least privileges necessary. A successful replication connection
    allows for a complete copy of the data stored within the data cluster to be offloaded to another, potentially insecure,
    host. As such, it is advisable to log all replication commands that are executed in your database cluster to ensure the
    data is not off-loaded to an unexpected/undesired location. Unless the server has been correctly configured, one runs
    the risk of sending WALs in an unsecured, unencrypted fashion. Unencrypted transmissions could reveal sensitive information
    to unauthorized parties. Unauthenticated connections could enable man-in-the-middle attacks. Some subdirectories contain
    information, such as logs, which can be of value to others such as developers. Other subdirectories can gain a performance
    benefit when placed on fast storage devices. Other subdirectories contain temporary files created and used during processing.
    Finally, relocating a subdirectory to a separate and distinct partition mitigates denial of service and involuntary server
    shutdown when excessive writes fill the data cluster''s partition, e.g. pg_wal, pg_log, and temp_tablespaces. The native
    PostgreSQL backup facility pg_dump provides adequate logical backup operations but does not provide for Point In Time
    Recovery (PITR). The PostgreSQL facility pg_basebackup performs a physical backup of the database files and does provide
    for PITR, but it is constrained by single threading. Both of these methodologies are standard in the PostgreSQL ecosystem
    and appropriate for particular backup/recovery needs. pgBackRest offers another option with much more robust features
    and flexibility. pgBackRest is open-source software developed to perform efficient backups on PostgreSQL databases that
    measure in tens of terabytes and greater. It supports perfile checksums, compression, partial/failed backup resume, high-performance
    parallel transfer, asynchronous archiving, tablespaces, expiration, full/differential/incremental backups, local/remote
    operation via SSH or TLS, hard-linking, restore, backup encryption, and more. pgBackRest is written in C and does not
    depend on rsync or tar but instead performs its own deltas which give it maximum flexibility. Finally, pgBackRest provides
    an easy-to-use internal repository listing backup details accessible via the pgbackrest info command, as illustrated below.
    $ pgbackrest info stanza: proddb01 status: ok db (current) wal archive min/max (15.0-1): 000000010000000000000012 / 000000010000000000000017
    full backup: 20231012-153106F timestamp start/stop: 2023-10-12 15:31:06 / 2023-10-12 15:31:49 wal start/stop: 000000010000000000000012
    / 000000010000000000000012 database size: 29.4MB, backup size: 29.4MB repository size: 3.4MB, repository backup size:
    3.4MB diff backup: 20231012-153106F_20231012-173109D timestamp start/stop: 2023-10-12 17:31:09 / 2023-10-12 17:31:19 wal
    start/stop: 000000010000000000000015 / 000000010000000000000015 database size: 29.4MB, backup size: 2.6MB repository size:
    3.4MB, repository backup size: 346.8KB backup reference list: 20231012-153106F incr backup: 20231012-153106F_20231012-183114I
    timestamp start/stop: 2023-10-12 18:31:14 / 2023-10-12 18:31:22 wal start/stop: 000000010000000000000017 / 000000010000000000000017
    database size: 29.4MB, backup size: 8.2KB repository size: 3.4MB, repository backup size: 519B backup reference list:
    20231012-153106F, 20231012-153106F_20231012173109D'
  impact: 'Depending on settings, it is possible for pgAudit to generate an enormous volume of logging. Be careful to determine
    exactly what needs to be audit logged in your environment to avoid logging too much. Much like the venerable sudo does
    for the OS, set_user manages superuser access for PostgreSQL. The complete configuration of set_user is documented at
    the extension''s website and should be reviewed to ensure the logging entries that your organization cares about are properly
    configured. Note that some external tools assume they can connect as the postgres user by default and this is no longer
    true when set_user is deployed. You may find some tools need different options, reconfigured, or even abandoned to compensate
    for this. It can be difficult to totally eliminate risk. Once changed, detecting a miscreant parameter can become problematic.
    All changes made on this level will affect the overall behavior of the server. These changes can only be affected by a
    server restart after the parameters have been altered in the configuration files. All changes made on this level will
    affect the overall behavior of the server. These changes can be effected by editing the PostgreSQL configuration files
    and by either executing a server SIGHUP from the command line or, as superuser postgres, executing the SQL command select
    pg_reload_conf(). A denial of service is possible by the over-allocating of limited resources, such as RAM. Data can be
    corrupted by allowing damaged pages to load or by changing parameters to reinterpret values in an unexpected fashion,
    e.g. changing the time zone. Client messages can be altered in such a way as to interfere with the application logic.
    Logging can be altered and obfuscated inhibiting root cause analysis. All changes made on this level will affect the overall
    behavior of the server. These changes can be effected by editing the PostgreSQL configuration files and by either executing
    a server SIGHUP from the command line or, as superuser postgres, executing the SQL command select pg_reload_conf(). A
    denial of service is possible by the over-allocating of limited resources, such as RAM. Data can be corrupted by allowing
    damaged pages to load or by changing parameters to reinterpret values in an unexpected fashion, e.g. changing the time
    zone. Client messages can be altered in such a way as to interfere with the application logic. Logging can be altered
    and obfuscated inhibiting root cause analysis. All changes made on this level will affect the overall behavior of the
    server. These changes can only be affected by a server restart after the parameters have been altered in the configuration
    files. A denial of service is possible by the over-allocating of limited resources, such as RAM. Data can be corrupted
    by allowing damaged pages to load or by changing parameters to reinterpret values in an unexpected fashion, e.g. changing
    the time zone. Client messages can be altered in such a way as to interfere with the application logic. Logging can be
    altered and obfuscated inhibiting root cause analysis. A denial of service is possible by the over-allocating of limited
    resources, such as RAM. Changing VACUUM parameters can force a server shutdown which is standard procedure preventing
    data corruption from transaction ID wraparound. Data can be corrupted by changing parameters to reinterpret values in
    an unexpected fashion, e.g. changing the time zone. Logging can be altered and obfuscated to inhibit root cause analysis.
    A self-signed certificate can be used for testing, but a certificate signed by a certificate authority (CA) (either one
    of the global CAs or a local one) should be used in production so that clients can verify the server''s identity. If all
    the database clients are local to the organization, using a local CA is recommended. To ultimately enable and enforce
    TLS authentication for the server, appropriate hostssl records must be added to the pg_hba.conf file. Be sure to reload
    PostgreSQL after any changes (restart not required). Note: The hostssl record matches connection attempts made using TCP/IP,
    but only when the connection is made with TLS encryption. The host record matches attempts made using TCP/IP, but allows
    both TLS and non-TLS connections. The hostnossl record matches attempts made using TCP/IP, but only those without TLS.
    Care should be taken to enforce TLS as appropriate. When considering or undertaking any form of encryption, it is critical
    to understand the state of the encrypted data at all stages of the data lifecycle. The use of pgcrypto ensures that the
    data at rest in the tables (and therefore on disk) is encrypted, but for the data to be accessed by any users or applications,
    said users/applications will, by necessity, have access to the encrypt and decrypt keys and the data in question will
    be encrypted/decrypted in memory and then transferred to/from the user/application in that form.'
