- id: 3.1.25
  title: Ensure 'log_statement' is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The log_statement setting specifies the types of SQL statements that are logged. Valid values are: • none
    (off) • ddl • mod • all (all statements) It is recommended this be set to ddl unless otherwise directed by your organization''s
    logging policy. ddl logs all data definition statements: • CREATE • ALTER • DROP mod logs all ddl statements, plus data-modifying
    statements: • INSERT • UPDATE • DELETE • TRUNCATE • COPY FROM (PREPARE, EXECUTE, and EXPLAIN ANALYZE statements are also
    logged if their contained command is of an appropriate type.) For clients using extended query protocol, logging occurs
    when an Execute message is received, and values of the Bind parameters are included (with any embedded singlequote marks
    doubled).'
  rationale: Setting log_statement to align with your organization's security and logging policies facilitates later auditing
