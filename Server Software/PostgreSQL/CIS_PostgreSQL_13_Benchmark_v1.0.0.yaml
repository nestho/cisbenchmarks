  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement:\npostgres=# show log_timezone ;\n log_timezone\n--------------\n US/Eastern\n\
    (1 row)\nIf\tlog_timezone\tis\tnot\tset\tto\tGMT,\tUTC,\tor\tas\tdefined\tby\tyour\torganization's\tlogging\tpolicy\n\
    this\tis\ta\tfail.\nFirst,\tas\tthe\tdatabase\tadministrator\t(shown\there\tas\t\"postgres\"),\tverify\tpgaudit\tis\t\
    enabled\nby\trunning\tthe\tfollowing\tcommands:\n74\t|\tPage\npostgres=# show shared_preload_libraries ;\n shared_preload_libraries\n\
    --------------------------\npgaudit\n(1 row)\nIf\tthe\toutput\tdoes\tnot\tcontain\t\"pgaudit\",\tthis\tis\ta\tfail.\n\
    Next,\tverify\tthat\tdesired\tauditing\tcomponents\tare\tenabled:\npostgres=# show pgaudit.log;\nERROR:  unrecognized\
    \ configuration parameter \"pgaudit.log\"\nIf\tthe\toutput\tdoes\tnot\tcontain\tthe\tdesired\tauditing\tcomponents,\t\
    this\tis\ta\tfail.\nThe\tlist\tbelow\tsummarizes\tpgAudit.log\tcomponents:\n• READ:\tSELECT\tand\tCOPY\twhen\tthe\tsource\t\
    is\ta\trelation\tor\ta\tquery.\n• WRITE:\tINSERT,\tUPDATE,\tDELETE,\tTRUNCATE,\tand\tCOPY\twhen\tthe\tdestination\tis\t\
    a\nrelation.\n• FUNCTION:\tFunction\tcalls\tand\tDO\tblocks.\n• ROLE:\tStatements\trelated\tto\troles\tand\tprivileges:\t\
    GRANT,\tREVOKE,\tCREATE/ALTER/DROP\nROLE.\n• DDL:\tAll\tDDL\tthat\tis\tnot\tincluded\tin\tthe\tROLE\tclass.\n• MISC:\t\
    Miscellaneous\tcommands,\te.g.\tDISCARD,\tFETCH,\tCHECKPOINT,\tVACUUM.\nLog\tin\tas\tan\tOperating\tSystem\tuser\tauthorized\t\
    to\tescalate\tprivileges\tand\ttest\tthe\tsudo\ninvocation\tby\texecuting\tthe\tfollowing:\n$ whoami\nuser1\n$ groups\n\
    user1\n$ sudo su - postgres\n[sudo] password for user1:\nuser1 is not in the sudoers file. This incident will be reported.\n\
    As\tshown\tabove,\tuser1\thas\tnot\tbeen\tadded\tto\tthe\t/etc/sudoers\tfile\tor\tmade\ta\tmember\tof\nany\tgroup\tlisted\t\
    in\tthe\t/etc/sudoers\tfile.\tWhereas:\n78\t|\tPage\n$ whoami\nuser2\n$ groups\nuser2 pg_wheel\n$ sudo su - postgres\n\
    [sudo] password for user2:\n$ whoami\npostgres\nThis\tshows\tthat\tthe\tuser2\tuser\tis\tconfigured\tproperly\tfor\tsudo\t\
    access.\nFirst,\tinspect\tthe\tprivileges\tgranted\tto\tthe\tdatabase\tsuperuser\t(identified\there\tas\tpostgres)\nusing\t\
    the\tdisplay\tcommand\tpsql -c \"\\du postgres\"\tto\testablish\ta\tbaseline\tfor\tgranted\nadministrative\tprivileges.\t\
    Based\ton\tthe\toutput\tbelow,\tthe\tpostgres\tsuperuser\tcan\tcreate\nroles,\tcreate\tdatabases,\tmanage\treplication,\t\
    and\tbypass\trow\tlevel\tsecurity\t(RLS):\n$ whoami\npostgres\n$ psql -c \"\\du postgres\"\n80\t|\tPage\n            \
    \                  List of roles\nRole name |                    Attributes                   | Member of\n----------+-------------------------------------------------+-----------\n\
    postgres  | Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                             \
    \         |\nNow,\tlet's\tinspect\tthe\tsame\tinformation\tfor\ta\tmock\tregular\tuser\tcalled\tappuser\tusing\tthe\n\
    display\tcommand\tpsql -c \"\\du appuser\".\tThe\toutput\tconfirms\tthat\tregular\tuser\tappuser\nhas\tthe\tsame\televated\t\
    privileges\tas\tsystem\tadministrator\tuser\tpostgres.\tThis\tis\ta\tfail.\n$ whoami\npostgres\n$ psql -c \"\\du appuser\"\
    \n                              List of roles\nRole name |                    Attributes                   | Member of\n\
    ----------+-------------------------------------------------+-----------\nappuser   | Superuser, Create role, Create DB,\
    \ Replication, | {}\n          | Bypass RLS                                      |\nWhile\tthis\texample\tdemonstrated\t\
    excessive\tadministrative\tprivileges\tgranted\tto\ta\tsingle\nuser,\ta\tcomprehensive\taudit\tshould\tbe\tconducted\t\
    to\tinspect\tall\tdatabase\tusers\tfor\texcessive\nadministrative\tprivileges.\tThis\tcan\tbe\taccomplished\tvia\teither\t\
    of\tthe\tcommands\tbelow.\n$ whoami\npostgres\n$ psql -c \"\\du *\"\n$ psql -c \"select * from pg_user order by usename\"\
    \nNOTE\tUsing\t\\du *\twill\tshow\tall\tthe\tdefault\tPostgreSQL\troles\t(e.g.\tpg_monitor)\tas\twell\tas\nany\t'normal'\t\
    roles.\tThis\tis\texpected,\tand\tshould\tnot\tbe\tcause\tfor\talarm.\nFunctions\tin\tPostgreSQL\tcan\tbe\tcreated\twith\t\
    the\tSECURITY DEFINER\toption.\tWhen\nSECURITY DEFINER\tfunctions\tare\texecuted\tby\ta\tuser,\tsaid\tfunction\tis\trun\t\
    with\tthe\tprivileges\nof\tthe\tuser\twho\tcreated\tit,\tnot\tthe\tuser\twho\tis\trunning\tit.\nTo\tlist\tall\tfunctions\t\
    that\thave\tSECURITY DEFINER,\trun\tthe\tfollowing\tSQL:\n$ whoami\nroot\n$ sudo su - postgres\n$ psql -c \"SELECT nspname,\
    \ proname, proargtypes, prosecdef, rolname,\nproconfig FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\n\
    pg_authid a ON a.oid = p.proowner WHERE prosecdef OR NOT proconfig IS NULL;\"\nIn\tthe\tquery\tresults,\ta\tprosecdef\t\
    value\tof\t't'\ton\ta\trow\tindicates\tthat\tthat\tfunction\tuses\nprivilege\televation.\n83\t|\tPage\nIf\televation\t\
    privileges\tare\tutilized\twhich\tare\tnot\trequired\tor\tare\texpressly\tforbidden\tby\norganizational\tguidance,\tthis\t\
    is\ta\tfail.\nTo\taudit\texcessive\tDML\tprivileges,\ttake\tan\tinventory\tof\tall\tusers\tdefined\tin\tthe\tcluster\n\
    using\tthe\t\\du+ *\tSQL\tcommand,\tas\twell\tas\tall\ttables\tdefined\tin\tthe\tdatabase\tusing\tthe\t\\dt\n*.*\tSQL\t\
    command.\tFurthermore,\tthe\tintersection\tmatrix\tof\ttables\tand\tuser\tgrants\tcan\tbe\nobtained\tby\tquerying\tsystem\t\
    catalogs\tpg_tables\tand\tpg_user.\tNote\tthat\tin\tPostgreSQL,\nusers\tare\tdefined\tcluster-wide\tacross\tall\tdatabases,\t\
    while\tschemas\tand\ttables\tare\tspecific\nto\ta\tparticular\tdatabase.\tTherefore,\tthe\tcommands\tbelow\tshould\tbe\t\
    executed\tfor\teach\ndefined\tdatabase\tin\tthe\tcluster.\tWith\tthis\tinformation,\tinspect\tdatabase\ttable\tgrants\t\
    and\ndetermine\tif\tany\tare\texcessive\tfor\tdefined\tdatabase\tusers.\npostgres=# -- display all users defined in the\
    \ cluster\npostgres=# \\x\nExpanded display is on.\npostgres=# \\du+ *\nList of roles\n-[ RECORD 1 ]-------------------------------------------------------------\n\
    Role name   | pg_execute_server_program\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 2 ]-------------------------------------------------------------\n\
    Role name   | pg_monitor\nAttributes  | Cannot login\nMember of   | {pg_read_all_settings,pg_read_all_stats,pg_stat_scan_tables}\n\
    Description |\n-[ RECORD 3 ]-------------------------------------------------------------\nRole name   | pg_read_all_settings\n\
    Attributes  | Cannot login\nMember of   | {}\n86\t|\tPage\nDescription |\n-[ RECORD 4 ]-------------------------------------------------------------\n\
    Role name   | pg_read_all_stats\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 5 ]-------------------------------------------------------------\n\
    Role name   | pg_read_server_files\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 6 ]-------------------------------------------------------------\n\
    Role name   | pg_signal_backend\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 7 ]-------------------------------------------------------------\n\
    Role name   | pg_stat_scan_tables\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 8 ]-------------------------------------------------------------\n\
    Role name   | pg_write_server_files\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 9 ]-------------------------------------------------------------\n\
    Role name   | postgres\nAttributes  | Superuser, Create role, Create DB, Replication, Bypass RLS\nMember of   | {}\nDescription\
    \ |\npostgres=# -- display all schema.tables created in current database\npostgres=# \\x\nExpanded display is off.\npostgres=#\
    \ \\dt+ *.*\n                                            List of relations\n       Schema       |          Name      \
    \     | Type  |  Owner   |\nPersistence |    Size    | Descrip\ntion\n--------------------+-------------------------+-------+----------+-----------\n\
    --+------------+--------\n-----\n information_schema | sql_features            | table | postgres | permanent\n| 104 kB\
    \     |\n information_schema | sql_implementation_info | table | postgres | permanent\n| 48 kB      |\n information_schema\
    \ | sql_parts               | table | postgres | permanent\n| 48 kB      |\n information_schema | sql_sizing         \
    \     | table | postgres | permanent\n| 48 kB      |\n(snip)\npostgres=# -- query all tables and user grants in current\
    \ database\npostgres=# -- the system catalogs 'information_schema' and 'pg_catalog' are\nexcluded\npostgres=# select t.schemaname,\
    \ t.tablename, u.usename,\n     has_table_privilege(u.usename, t.tablename, 'select') as select,\n87\t|\tPage\n     has_table_privilege(u.usename,\
    \ t.tablename, 'insert') as insert,\n     has_table_privilege(u.usename, t.tablename, 'update') as update,\n     has_table_privilege(u.usename,\
    \ t.tablename, 'delete') as delete\nfrom  pg_tables t, pg_user u\nwhere t.schemaname not in ('information_schema','pg_catalog');\n\
    \ schemaname | tablename | usename | select | insert | update | delete\n------------+-----------+---------+--------+--------+--------+--------\n\
    (0 rows)\nFor\tthe\texample\tbelow,\twe\tillustrate\tusing\ta\tsingle\ttable\tcustomer\tand\ttwo\tapplication\nusers\t\
    appwriter\tand\tappreader.\tThe\tintention\tis\tfor\tappwriter\tto\thave\tfull\tselect,\tinsert,\nupdate,\tand\tdelete\t\
    rights\tand\tfor\tappreader\tto\tonly\thave\tselect\trights.\tWe\tcan\tquery\tthese\nprivileges\twith\tthe\texample\t\
    below\tusing\tthe\thas_table_privilege\tfunction\tand\tfiltering\nfor\tjust\tthe\ttable\tand\troles\tin\tquestion.\npostgres=#\
    \ select t.tablename, u.usename,\n       has_table_privilege(u.usename, t.tablename, 'select') as select,\n       has_table_privilege(u.usename,\
    \ t.tablename, 'insert') as insert,\n       has_table_privilege(u.usename, t.tablename, 'update') as update,\n       has_table_privilege(u.usename,\
    \ t.tablename, 'delete') as delete\nfrom   pg_tables t, pg_user u\nwhere  t.tablename = 'customer'\nand    u.usename in\
    \ ('appwriter','appreader');\ntablename |  usename  | select | insert | update | delete\n----------+-----------+--------+--------+--------+--------\n\
    customer  | appwriter | t      | t      | t      | t\ncustomer  | appreader | t      | t      | t      | t\n(2 rows)\n\
    As\tdepicted,\tboth\tusers\thave\tfull\tprivileges\tfor\tthe\tcustomer\ttable.\tThis\tis\ta\tfail.\nWhen\tinspecting\t\
    database-wide\tresults\tfor\tall\tusers\tand\tall\ttable\tgrants,\temploy\ta\ncomprehensive\tapproach.\tCollaboration\t\
    with\tapplication\tdevelopers\tis\tparamount\tto\ncollectively\tdetermine\tonly\tthose\tdatabase\tusers\tthat\trequire\t\
    specific\tDML\tprivileges\tand\non\twhich\ttables.\nSee\tif\tthe\tpg_permissions\textension\tis\tavailable\tfor\tuse:\n\
    postgres=# select * from pg_available_extensions where name =\n'pg_permissions';\n name | default_version | installed_version\
    \ | comment\n------+-----------------+-------------------+---------\n(0 rows)\nIf\tthe\textension\tisn't\tfound,\tthis\t\
    is\ta\tfail.\nThe\tfirst\tstep\tfor\tan\torganization\tis\tto\tdetermine\twhich,\tif\tany,\tdatabase\ttables\trequire\t\
    RLS.\nThis\tdecision\tis\ta\tmatter\tof\tbusiness\tprocesses\tand\tis\tunique\tto\teach\torganization.\tTo\ndiscover\t\
    which,\tif\tany,\tdatabase\ttables\thave\tRLS\tenabled,\texecute\tthe\tfollowing\tquery.\tIf\nany\ttable(s)\tshould\t\
    have\tRLS\tpolicies\tapplied,\tbut\tdo\tnot\tappear\tin\tquery\tresults,\tthen\tthis\nis\ta\tfail.\npostgres=# SELECT\
