    to\tthe\tpayroll_user\taccount\tonly.\tThis\tprevents\taccidental creation/altering/dropping\tof\tdatabase\tobjects\t\
    by\tapplication\tcode\tthat\trun\tas\tthe payroll_user\taccount. In\tcertain\tsituations,\tto\tprovide\trequired\tfunctionality,\t\
    PostgreSQL\tneeds\tto\texecute internal\tlogic\t(stored\tprocedures,\tfunctions,\ttriggers,\tetc.)\tand/or\texternal\t\
    code\tmodules with\televated\tprivileges.\tHowever,\tif\tthe\tprivileges\trequired\tfor\texecution\tare\tat\ta\thigher\
    \ level\tthan\tthe\tprivileges\tassigned\tto\torganizational\tusers\tinvoking\tthe\tfunctionality applications/programs,\t\
    those\tusers\tare\tindirectly\tprovided\twith\tgreater\tprivileges\tthan assigned\tby\ttheir\torganization.\tThis\tis\t\
    known\tas\tprivilege\televation.\tPrivilege\televation must\tbe\tutilized\tonly\twhere\tnecessary.\tExecute\tprivileges\t\
    for\tapplication\tfunctions\tshould be\trestricted\tto\tauthorized\tusers\tonly. DML\t(insert,\tupdate,\tdelete)\toperations\t\
    at\tthe\ttable\tlevel\tshould\tbe\trestricted\tto\tonly authorized\tusers.\tPostgreSQL\tmanages\ttable\tlevel\tDML\tpermissions\t\
    via\tthe\tGRANT statement. Using\ta\tPostgreSQL\textension\tcalled\tpg_permissions\tit\tis\tpossible\tto\tdeclare\twhich\t\
