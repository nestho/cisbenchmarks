  audit_raw: "Execute the following SQL statement:\npostgres=# show log_timezone ;\n log_timezone\n--------------\n US/Eastern\n\
    (1 row)\nIf log_timezone is not set to GMT, UTC, or as defined by your organization's logging policy\nthis is a fail.\n\
    First, as the database administrator (shown here as \"postgres\"), verify pgaudit is enabled\nby running the following\
    \ commands:\npostgres=# show shared_preload_libraries ;\n shared_preload_libraries\n--------------------------\npgaudit\n\
    (1 row)\nIf the output does not contain \"pgaudit\", this is a fail.\nNext, verify that desired auditing components are\
    \ enabled:\npostgres=# show pgaudit.log;\nERROR:  unrecognized configuration parameter \"pgaudit.log\"\n82 | P a g e\n\
    If the output does not contain the desired auditing components, this is a fail.\nThe list below summarizes pgAudit.log\
    \ components:\n• READ: SELECT and COPY when the source is a relation or a query.\n• WRITE: INSERT, UPDATE, DELETE, TRUNCATE,\
    \ and COPY when the destination is a\nrelation.\n• FUNCTION: Function calls and DO blocks.\n• ROLE: Statements related\
    \ to roles and privileges: GRANT, REVOKE, CREATE/ALTER/DROP\nROLE.\n• DDL: All DDL that is not included in the ROLE class.\n\
    • MISC: Miscellaneous commands, e.g. DISCARD, FETCH, CHECKPOINT, VACUUM.\nLog in as an Operating System user authorized\
    \ to escalate privileges and test the sudo\ninvocation by executing the following:\n$ whoami\nuser1\n$ groups\nuser1\n\
    $ sudo su - postgres\n[sudo] password for user1:\nuser1 is not in the sudoers file. This incident will be reported.\n\
    As shown above, user1 has not been added to the /etc/sudoers file or made a member of\nany group listed in the /etc/sudoers\
    \ file. Whereas:\n86 | P a g e\n$ whoami\nuser2\n$ groups\nuser2 pg_wheel\n$ sudo su - postgres\n[sudo] password for user2:\n\
    $ whoami\npostgres\nshows the user2 user is configured properly for sudo access.\nFirst, inspect the privileges granted\
    \ to the database superuser (identified here as postgres)\nusing the display command psql -c \"\\du postgres\" to establish\
    \ a baseline for granted\nadministrative privileges. Based on the output below, the postgres superuser can create\nroles,\
    \ create databases, manage replication, and bypass row level security (RLS):\n88 | P a g e\n$ whoami\npostgres\n$ psql\
    \ -c \"\\du postgres\"\n                              List of roles\nRole name |                    Attributes       \
    \            | Member of\n----------+-------------------------------------------------+-----------\npostgres  | Superuser,\
    \ Create role, Create DB, Replication, | {}\n          | Bypass RLS                                      |\nNow, let's\
    \ inspect the same information for a mock regular user called appuser using the\ndisplay command psql -c \"\\du appuser\"\
    . The output confirms that regular user appuser\nhas the same elevated privileges as system administrator user postgres.\
    \ This is a fail.\n$ whoami\npostgres\n$ psql -c \"\\du appuser\"\n                              List of roles\nRole name\
    \ |                    Attributes                   | Member of\n----------+-------------------------------------------------+-----------\n\
    appuser   | Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                             \
    \         |\nWhile this example demonstrated excessive administrative privileges granted to a single\nuser, a comprehensive\
    \ audit should be conducted to inspect all database users for excessive\nadministrative privileges. This can be accomplished\
    \ via either of the commands below.\n$ whoami\npostgres\n$ psql -c \"\\du *\"\n$ psql -c \"select * from pg_user order\
    \ by usename\"\nNOTE Using \"\\du *\" will show all the default PostgreSQL roles (e.g. pg_monitor) as well as\nany 'normal'\
    \ roles. This is expected, and should not be cause for alarm.\nFunctions in PostgreSQL can be created with the SECURITY\
    \ DEFINER option. When\nSECURITY DEFINER functions are executed by a user, said function is run with the privileges\n\
    of the user who created it, not the user who is running it.\nTo list all functions that have SECURITY DEFINER, run the\
    \ following SQL:\n$ whoami\nroot\n$ sudo su - postgres\n$ psql -c \"SELECT nspname, proname, proargtypes, prosecdef, rolname,\n\
    proconfig FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid a ON a.oid = p.proowner WHERE prosecdef\
    \ OR NOT proconfig IS NULL;\"\nIn the query results, a prosecdef value of 't' on a row indicates that that function uses\n\
    privilege elevation.\nIf elevation of PostgreSQL privileges is utilized but not documented, this is a fail.\n91 | P a\
    \ g e\nIf elevation of PostgreSQL privileges is documented, but not implemented as described in\nthe documentation, this\
    \ is a fail.\nIf the privilege-elevation logic can be invoked in ways other than intended, or in contexts\nother than\
    \ intended, or by subjects/principals other than intended, this is a fail.\nTo audit excessive DML privileges, take an\
    \ inventory of all users defined in the cluster\nusing the \\du+ * SQL command, as well as all tables defined in the database\
    \ using the \\dt\n*.* SQL command. Furthermore, the intersection matrix of tables and user grants can be\nobtained by\
    \ querying system catalogs pg_tables and pg_user. Note that in PostgreSQL,\nusers are defined cluster-wide across all\
    \ databases, while schemas and tables are specific\nto a particular database. Therefore, the commands below should be\
    \ executed for each\ndefined database in the cluster. With this information, inspect database table grants and\ndetermine\
    \ if any are excessive for defined database users.\npostgres=# -- display all users defined in the cluster\npostgres=#\
    \ \\x\nExpanded display is on.\npostgres=# \\du+ *\nList of roles\n-[ RECORD 1 ]-----------------------------------------------------------\n\
    Role name   | pg_signal_backend\nAttributes  | Cannot login\nMember of   | {}\nDescription |\n-[ RECORD 2 ]-----------------------------------------------------------\n\
    Role name   | postgres\nAttributes  | Superuser, Create role, Create DB, Replication, Bypass RLS\nMember of   | {}\nDescription\
    \ |\npostgres=# -- display all schema.tables created in current database\n94 | P a g e\npostgres=# \\x\nExpanded display\
    \ is off.\npostgres=# \\dt+ *.*\n                                    List of relations\n      Schema       |         \
    \ Name           | Type  |  Owner   |    Size   |\n-------------------+-------------------------+-------+----------+-----------+\n\
    information_schema | sql_features            | table | postgres | 96 kB     |\ninformation_schema | sql_implementation_info\
    \ | table | postgres | 48 kB     |\ninformation_schema | sql_languages           | table | postgres | 48 kB     |\ninformation_schema\
    \ | sql_packages            | table | postgres | 48 kB     |\ninformation_schema | sql_parts               | table | postgres\
    \ | 48 kB     |\ninformation_schema | sql_sizing              | table | postgres | 48 kB     |\ninformation_schema | sql_sizing_profiles\
    \     | table | postgres | 8192 bytes|\n(snip)\npostgres=# -- query all tables and user grants in current database\npostgres=#\
    \ -- the system catalogs 'information_schema' and 'pg_catalog' are\nexcluded\npostgres=# select t.schemaname, t.tablename,\
    \ u.usename,\n     has_table_privilege(u.usename, t.tablename, 'select') as select,\n     has_table_privilege(u.usename,\
    \ t.tablename, 'insert') as insert,\n     has_table_privilege(u.usename, t.tablename, 'update') as update,\n     has_table_privilege(u.usename,\
    \ t.tablename, 'delete') as delete\nfrom  pg_tables t, pg_user u\nwhere t.schemaname not in ('information_schema','pg_catalog');\n\
    \ schemaname | tablename | usename | select | insert | update | delete\n------------+-----------+---------+--------+--------+--------+--------\n\
    (0 rows)\nFor the example below, we illustrate using a single table customer and two application\nusers appwriter and\
    \ appreader. The intention is for appwriter to have full select, insert,\nupdate, and delete rights and for appreader\
    \ to only have select rights. We can query these\nprivileges with the example below using the has_table_privilege function\
    \ and filtering\nfor just the table and roles in question.\npostgres=# select t.tablename, u.usename,\n       has_table_privilege(u.usename,\
    \ t.tablename, 'select') as select,\n       has_table_privilege(u.usename, t.tablename, 'insert') as insert,\n       has_table_privilege(u.usename,\
    \ t.tablename, 'update') as update,\n       has_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom   pg_tables\
    \ t, pg_user u\nwhere  t.tablename = 'customer'\nand    u.usename in ('appwriter','appreader');\ntablename |  usename\
    \  | select | insert | update | delete\n----------+-----------+--------+--------+--------+--------\ncustomer  | appwriter\
    \ | t      | t      | t      | t\ncustomer  | appreader | t      | t      | t      | t\n(2 rows)\nAs depicted, both users\
    \ have full privileges for the customer table. This is a fail.\nWhen inspecting database-wide results for all users and\
    \ all table grants, employ a\n95 | P a g e\ncomprehensive approach. Collaboration with application developers is paramount\
    \ to\ncollectively determine only those database users that require specific DML privileges and\non which tables.\nSee\
    \ if the pg_permissions extension is available for use:\npostgres=# select * from pg_available_extensions where name='pg_permission';\n\
    \ name | default_version | installed_version | comment\n------+-----------------+-------------------+---------\n(0 rows)\n\
    If the extension isn't found, this is a fail.\nThe first step for an organization is to determine which, if any, database\
    \ tables require RLS.\nThis decision is a matter of business processes and is unique to each organization. To\ndiscover\
    \ which, if any, database tables have RLS enabled, execute the following query. If\nany table(s) should have RLS policies\
    \ applied, but do not appear in query results, then this\nis a finding.\npostgres=# SELECT oid, relname, relrowsecurity\
    \ FROM pg_class WHERE\nrelrowsecurity IS TRUE;\n103 | P a g e\nFor the purpose of this illustration, we will demonstrate\
    \ the standard example from the\nPostgreSQL documentation using the passwd table and policy example. As of PostgreSQL\n\
    9.5, the catalog table pg_class provides column relrowsecurity to query and determine\nwhether a relation has RLS enabled.\
    \ Based on results below we can see RLS is not enabled.\nAssuming this table should be RLS enabled but is not, this is\
    \ a finding.\npostgres=# SELECT oid, relname, relrowsecurity FROM pg_class WHERE relname =\n'passwd';\n  oid  | relname\
    \ | relrowsecurity\n-------+---------+----------------\n 24679 | passwd  | f\n(1 row)\nFurther inspection of RLS policies\
    \ are provided via the system catalog pg_policy, which\nrecords policy details including table OID, policy name, applicable\
    \ commands, the roles\nassigned a policy, and the USING and WITH CHECK clauses. Finally, RLS and associated\npolicies\
    \ (if implemented) may also be viewed using the standard psql display command\n\\d+ schema.table which lists RLS information\
    \ as part of the table description.\nShould you implement Row Level Security and apply restrictive policies to certain\
    \ users,\nit's imperative that you check each user's role definition via the psql display command \\du\nand ensure unauthorized\
    \ users have not been granted Bypass RLS privilege as this would\noverride any RLS enabled tables and associated policies.\
    \ If unauthorized users do have\nBypass RLS granted then resolve this using the ALTER ROLE user NOBYPASSRLS; command.\n\
    Check if the extension is available by querying the pg_available_extensions table:\npostgres=# select * from pg_available_extensions\
    \ where name = 'set_user';\n name | default_version | installed_version | comment\n------+-----------------+-------------------+---------\n\
    (0 rows)\nIf the extension is not listed this is a fail.\nReview the list of all database roles that have superuser access\
    \ and determine if one or\nmore the default roles would suffice for the needs of that role:\n$ whoami\npostgres\n$ psql\n\
    psql (11.3)\nType \"help\" for help.\npostgres=# select rolname from pg_roles where rolsuper is true;\n rolname\n----------\n\
    \ postgres\n doug\n(2 rows)\nNewly created data clusters are empty of data and have only one user account, the\nsuperuser\
    \ (postgres). By default, the data cluster superuser is named after the UNIX\naccount. Login authentication is tested\
    \ via UNIX DOMAIN SOCKETS by the UNIX user\naccount postgres, the default account, and set_user has not yet been configured:\n\
    $ whoami\npostgres\n$ psql postgres\npsql (11.3)\nType \"help\" for help.\npostgres=#\nLogin attempts by another UNIX\
    \ user account as the superuser should be denied:\n$ su - user1\n$ whoami\nuser1\n$ psql -U postgres -d postgres\npsql:\
    \ FATAL:  Peer authentication failed for user \"postgres\"\n$ exit\nThis test demonstrates that not only is logging in\
