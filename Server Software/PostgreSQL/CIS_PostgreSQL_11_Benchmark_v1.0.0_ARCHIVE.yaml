  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/11/static/runtime-config-logging.html
  page_start: 61
  audit_raw: "Execute the following SQL statement to confirm the setting is disabled:\npostgres=# show debug_print_rewritten;\n\
    \ debug_print_rewritten\n-----------------------\n off\n(1 row)"
  remediation: "Execute the following SQL statement(s) to disable this setting:\npostgres=# alter system set debug_print_rewritten\
    \ = 'off';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show debug_print_rewritten;
    severity: medium
    info: "Execute the following SQL statement to confirm the setting is disabled:\npostgres=# show debug_print_rewritten;\n\
      \ debug_print_rewritten\n-----------------------\n off\n(1 row)"
- id: 3.1.16
  title: Ensure 'debug_print_plan' is disabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The debug_print_plan setting enables printing the execution plan for each executed query. These messages are
    emitted at the LOG message level. Unless directed otherwise by your organization's logging policy, it is recommended this
