    can\tbe\tspecified\tto\tapply\tto\tALL\tcommands,\tor\tto\tany\tcombination\tof\tSELECT,\tINSERT, UPDATE,\tor\tDELETE.\t\
    Multiple\troles\tcan\tbe\tassigned\tto\ta\tgiven\tpolicy,\tand\tnormal\trole membership\tand\tinheritance\trules\tapply.\
