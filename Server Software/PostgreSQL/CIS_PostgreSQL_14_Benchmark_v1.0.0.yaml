- id: 3.1.2
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "PostgreSQL\tsupports\tseveral\tmethods\tfor\tlogging\tserver\tmessages,\tincluding\tstderr, csvlog\tand\t\
    syslog.\tOn\tWindows,\teventlog\tis\talso\tsupported.\tOne\tor\tmore\tof\tthese destinations\tshould\tbe\tset\tfor\tserver\t\
    log\toutput."
  rationale: "If\tlog_destination\tis\tnot\tset,\tthen\tany\tlog\tmessages\tgenerated\tby\tthe\tcore\tPostgreSQL processes\t\
    will\tbe\tlost."
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 20
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tview\tthe\tcurrently\tactive\tlog\tdestinations:\npostgres=# show\
    \ log_destination;\n log_destination\n-----------------\n20\t|\tPage\n stderr\n(1 row)\nThe\tlog\tdestinations\tshould\t\
    comply\twith\tyour\torganization's\tpolicies\ton\tlogging.\tIf\tall\tthe\nexpected\tlog\tdestinations\tare\tnot\tset,\t\
    this\tis\ta\tfail."
  remediation: "Execute\tthe\tfollowing\tSQL\tstatements\tto\tremediate\tthis\tsetting\t(in\tthis\texample,\tsetting\tthe\n\
    log\tdestination\tto\tcsvlog):\npostgres=# alter system set log_destination = 'csvlog';\nALTER SYSTEM\npostgres=# select\
    \ pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\nNote:\tIf\tmore\tthan\tone\tlog\tdestination\tis\t\
    to\tbe\tused,\tset\tthis\tparameter\tto\ta\tlist\tof\tdesired\nlog\tdestinations\tseparated\tby\tcommas\t(e.g.\t'csvlog,\
    \ stderr').\nDefault\tValue:\nstderr"
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tview\tthe\tcurrently\tactive\tlog\tdestinations:\npostgres=# show\
      \ log_destination;\n log_destination\n-----------------\n20\t|\tPage\n stderr\n(1 row)\nThe\tlog\tdestinations\tshould\t\
      comply\twith\tyour\torganization's\tpolicies\ton\tlogging.\tIf\tall\tthe\nexpected\tlog\tdestinations\tare\tnot\tset,\t\
      this\tis\ta\tfail."
- id: 3.1.3
  title: Ensure the logging collector is enabled
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "The\tlogging\tcollector\tis\ta\tbackground\tprocess\tthat\tcaptures\tlog\tmessages\tsent\tto\tstderr and\t\
    redirects\tthem\tinto\tlog\tfiles.\tThe\tlogging_collector\tsetting\tmust\tbe\tenabled\tin\torder for\tthis\tprocess\t\
    to\trun.\tIt\tcan\tonly\tbe\tset\tat\tthe\tserver\tstart."
  rationale: "The\tlogging\tcollector\tapproach\tis\toften\tmore\tuseful\tthan\tlogging\tto\tsyslog,\tsince\tsome types\t\
    of\tmessages\tmight\tnot\tappear\tin\tsyslog\toutput.\tOne\tcommon\texample\tis\tdynamiclinker\tfailure\tmessage;\tanother\t\
    may\tbe\terror\tmessages\tproduced\tby\tscripts\tsuch\tas archive_command. Note:\tThis\tsetting\tmust\tbe\tenabled\twhen\t\
    log_destination\tis\teither\tstderr\tor\tcsvlog\tand for\tcertain\tother\tlogging\tparameters\tto\ttake\teffect."
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 23
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tand\tconfirm\tthat\tthe\tlogging_collector\tis\tenabled\n(on):\npostgres=#\
    \ show logging_collector;\n logging_collector\n-------------------\n on\n(1 row)"
  remediation: "Execute\tthe\tfollowing\tSQL\tstatement(s)\tto\tremediate\tthis\tsetting:\npostgres=# alter system set logging_collector\
    \ = 'on';\nALTER SYSTEM\nUnfortunately,\tthis\tsetting\tcan\tonly\tbe\tchanged\tat\tthe\tserver\t(re)start.\tAs\troot,\t\
    restart\tthe\nPostgreSQL\tservice\tfor\tthis\tchange\tto\ttake\teffect:\n23\t|\tPage\n# whoami\nroot\n# systemctl restart\
    \ postgresql-14\n# systemctl status postgresql-14|grep 'ago$'\n   Active: active (running) since <date>; <count>s ago\n\
    Default\tValue:\non"
  checks:
  - type: sql
    command: show logging_collector;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tand\tconfirm\tthat\tthe\tlogging_collector\tis\tenabled\n(on):\npostgres=#\
      \ show logging_collector;\n logging_collector\n-------------------\n on\n(1 row)"
- id: 3.1.4
  title: Ensure the log file destination directory is set correctly
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "The\tlog_directory\tsetting\tspecifies\tthe\tdestination\tdirectory\tfor\tlog\tfiles\twhen log_destination\t\
    is\tstderr\tor\tcsvlog.\tIt\tcan\tbe\tspecified\tas\trelative\tto\tthe\tcluster\tdata directory\t($PGDATA)\tor\tas\tan\t\
    absolute\tpath.\tlog_directory\tshould\tbe\tset\taccording\tto\tyour organization's\tlogging\tpolicy."
  rationale: "If\tlog_directory\tis\tnot\tset,\tit\tis\tinterpreted\tas\tthe\tabsolute\tpath\t'/'\tand\tPostgreSQL\twill attempt\t\
    to\twrite\tits\tlogs\tthere\t(and\ttypically\tfail\tdue\tto\ta\tlack\tof\tpermissions\tto\tthat directory).\tThis\tparameter\t\
    should\tbe\tset\tto\tdirect\tthe\tlogs\tinto\tthe\tappropriate\tdirectory location\tas\tdefined\tby\tyour\torganization's\t\
    logging\tpolicy."
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 25
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tconfirm\tthat\tthe\texpected\tlogging\tdirectory\tis\nspecified:\n\
    postgres=# show log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote:\tThis\tshows\ta\tpath\trelative\t\
    to\tthe\tcluster's\tdata\tdirectory.\tAn\tabsolute\tpath\twould\nstart\twith\ta\t/\tlike\tthe\tfollowing:\t/var/log/pg_log"
  remediation: "Execute\tthe\tfollowing\tSQL\tstatement(s)\tto\tremediate\tthis\tsetting:\npostgres=# alter system set log_directory='/var/log/postgres';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n25\t|\tPage\n t\n(1 row)\npostgres=#\
    \ show log_directory;\n log_directory\n---------------\n /var/log/postgres\n(1 row)\nNote:\tThe\tuse\tof\t/var/log/postgres,\t\
    above,\tis\tan\texample.\tThis\tshould\tbe\tset\tto\tan\nappropriate\tpath\tas\tdefined\tby\tyour\torganization's\tlogging\t\
    requirements.\tHaving\tsaid\tthat,\nit\tis\ta\tgood\tidea\tto\thave\tthe\tlogs\toutside\tof\tyour\tPGDATA\tdirectory\t\
    so\tthat\tthey\tare\tnot\nincluded\tby\tthings\tlike\tpg_basebackup\tor\tpgBackRest.\nDefault\tValue:\nlog\twhich\tis\t\
    relative\tto\tthe\tcluster's\tdata\tdirectory\t(e.g.\n/var/lib/pgsql/<pgmajorversion>/data/log)"
  checks:
  - type: sql
    command: show log_directory;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tconfirm\tthat\tthe\texpected\tlogging\tdirectory\tis\nspecified:\n\
      postgres=# show log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote:\tThis\tshows\ta\tpath\trelative\t\
      to\tthe\tcluster's\tdata\tdirectory.\tAn\tabsolute\tpath\twould\nstart\twith\ta\t/\tlike\tthe\tfollowing:\t/var/log/pg_log"
- id: 3.1.5
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "The\tlog_filename\tsetting\tspecifies\tthe\tfilename\tpattern\tfor\tlog\tfiles.\tThe\tvalue\tfor log_filename\t\
    should\tmatch\tyour\torganization's\tlogging\tpolicy. The\tvalue\tis\ttreated\tas\ta\tstrftime\tpattern,\tso\t%-escapes\t\
    can\tbe\tused\tto\tspecify\ttimevarying\tfile\tnames.\tThe\tsupported\t%-escapes\tare\tsimilar\tto\tthose\tlisted\tin\t\
    the\tOpen\tGroup's strftime\tspecification.\tIf\tyou\tspecify\ta\tfile\tname\twithout\tescapes,\tyou\tshould\tplan\tto\t\
    use\ta log\trotation\tutility\tto\tavoid\teventually\tfilling\tthe\tpartition\tthat\tcontains\tlog_directory.\tIf there\t\
    are\tany\ttime-zone-dependent\t%-escapes,\tthe\tcomputation\tis\tdone\tin\tthe\tzone specified\tby\tlog_timezone.\tAlso,\t\
    the\tsystem's\tstrftime\tis\tnot\tused\tdirectly,\tso\tplatformspecific\t(nonstandard)\textensions\tdo\tnot\twork. If\t\
    CSV-format\toutput\tis\tenabled\tin\tlog_destination,\t.csv\twill\tbe\tappended\tto\tthe\tlog filename.\t(If\tlog_filename\t\
    ends\tin\t.log,\tthe\tsuffix\tis\treplaced\tinstead.)"
  rationale: "If\tlog_filename\tis\tnot\tset,\tthen\tthe\tvalue\tof\tlog_directory\tis\tappended\tto\tan\tempty\tstring and\t\
    PostgreSQL\twill\tfail\tto\tstart\tas\tit\twill\ttry\tto\twrite\tto\ta\tdirectory\tinstead\tof\ta\tfile."
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man3/strftime.3.html
  - 2. https://www.postgresql.org/docs/current/runtime-config-logging.html
  page_start: 27
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tconfirm\tthat\tthe\tdesired\tpattern\tis\tset:\npostgres=# show\
    \ log_filename;\n   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote:\tThis\texample\tshows\tthe\t\
    use\tof\tthe\tstrftime\t%a\tescape.\tThis\tcreates\tseven\tlog\tfiles,\none\tfor\teach\tday\tof\tthe\tweek\t(e.g.\tpostgresql-Mon.log,\t\
    postgresql-Tue.log,\tet\tal)\n27\t|\tPage"
  remediation: "Execute\tthe\tfollowing\tSQL\tstatement(s)\tto\tremediate\tthis\tsetting:\npostgres=# alter system set log_filename='postgresql-%Y%m%d.log';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show log_filename;\n\
    \   log_filename\n-------------------\n postgresql-%Y%m%d.log\n(1 row)\nNote:\tIn\tthis\texample,\ta\tnew\tlog\tfile\t\
    will\tbe\tcreated\tfor\teach\tday\t(e.g.\tpostgresql20200804.log)\nDefault\tValue:\nThe\tdefault\tis\tpostgresql-%a.log,\t\
    which\tcreates\ta\tnew\tlog\tfile\tfor\teach\tday\tof\tthe\tweek\n(e.g.\tpostgresql-Mon.log,\tpostgresql-Tue.log)."
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tconfirm\tthat\tthe\tdesired\tpattern\tis\tset:\npostgres=# show log_filename;\n\
      \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote:\tThis\texample\tshows\tthe\tuse\tof\tthe\t\
      strftime\t%a\tescape.\tThis\tcreates\tseven\tlog\tfiles,\none\tfor\teach\tday\tof\tthe\tweek\t(e.g.\tpostgresql-Mon.log,\t\
      postgresql-Tue.log,\tet\tal)\n27\t|\tPage"
- id: 3.1.6
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "The\tlog_file_mode\tsetting\tdetermines\tthe\tfile\tpermissions\tfor\tlog\tfiles\twhen logging_collector\t\
    is\tenabled.\tThe\tparameter\tvalue\tis\texpected\tto\tbe\ta\tnumeric\tmode specification\tin\tthe\tform\taccepted\tby\t\
    the\tchmod\tand\tumask\tsystem\tcalls.\t(To\tuse\tthe customary\toctal\tformat,\tthe\tnumber\tmust\tstart\twith\ta\t0\t\
    (zero).) The\tpermissions\tshould\tbe\tset\tto\tallow\tonly\tthe\tnecessary\taccess\tto\tauthorized\tpersonnel. In\tmost\t\
    cases,\tthe\tbest\tsetting\tis\t0600,\tso\tthat\tonly\tthe\tserver\towner\tcan\tread\tor\twrite\tthe log\tfiles.\tThe\t\
    other\tcommonly\tuseful\tsetting\tis\t0640,\tallowing\tmembers\tof\tthe\towner's group\tto\tread\tthe\tfiles,\talthough\t\
    to\tmake\tuse\tof\tthat,\tyou\twill\tneed\tto\talter\tthe log_directory\tsetting\tto\tstore\tthe\tlog\tfiles\toutside\t\
    the\tcluster\tdata\tdirectory."
  rationale: "Log\tfiles\toften\tcontain\tsensitive\tdata.\tAllowing\tunnecessary\taccess\tto\tlog\tfiles\tmay inadvertently\t\
    expose\tsensitive\tdata\tto\tunauthorized\tpersonnel."
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 30
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tverify\tthat\tthe\tsetting\tis\tconsistent\twith\norganizational\t\
    logging\tpolicy:\npostgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: "Execute\tthe\tfollowing\tSQL\tstatement(s)\tto\tremediate\tthis\tsetting\t(with\tthe\texample\nassuming\t\
    the\tdesired\tvalue\tof\t0600):\npostgres=# alter system set log_file_mode = '0600';\nALTER SYSTEM\npostgres=# select\
    \ pg_reload_conf();\n pg_reload_conf\n30\t|\tPage\n----------------\n t\n(1 row)\npostgres=# show log_file_mode;\n log_file_mode\n\
    ---------------\n 0600\n(1 row)\nDefault\tValue:\n0600"
  checks:
  - type: sql
    command: show log_file_mode;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tverify\tthat\tthe\tsetting\tis\tconsistent\twith\norganizational\t\
      logging\tpolicy:\npostgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
- id: 3.1.7
  title: Ensure 'log_truncate_on_rotation' is enabled
  scoring: scored
  profile:
  - "Level\t1\t-\tPostgreSQL"
  - "Level\t1\t-\tPostgreSQL\ton\tLinux"
  description: "Enabling\tthe\tlog_truncate_on_rotation\tsetting\twhen\tlogging_collector\tis\tenabled causes\tPostgreSQL\t\
    to\ttruncate\t(overwrite)\texisting\tlog\tfiles\twith\tthe\tsame\tname\tduring\tlog rotation\tinstead\tof\tappending\t\
    to\tthem.\tFor\texample,\tusing\tthis\tsetting\tin\tcombination\twith a\tlog_filename\tsetting\tvalue\tlike\tpostgresql-%H.log\t\
    would\tresult\tin\tgenerating\t24\thourly log\tfiles\tand\tthen\tcyclically\toverwriting\tthem: postgresql-00.log postgresql-01.log\
    \ [...] postgresql-23.log Note:\tTruncation\twill\toccur\tonly\twhen\ta\tnew\tfile\tis\tbeing\topened\tdue\tto\ttime-based\
    \ rotation,\tnot\tduring\tserver\tstartup\tor\tsize-based\trotation\t(see\tlater\tin\tthis\tbenchmark\tfor size-based\t\
    rotation\tdetails)."
  rationale: "If\tthis\tsetting\tis\tdisabled,\tpre-existing\tlog\tfiles\twill\tbe\tappended\tto\tif\tlog_filename\tis configured\t\
    in\tsuch\ta\tway\tthat\tstatic\tnames\tare\tgenerated. Enabling\tor\tdisabling\tthe\ttruncation\tshould\tonly\tbe\tdecided\t\
    when\talso\tconsidering\tthe value\tof\tlog_filename\tand\tlog_rotation_age/log_rotation_size.\tSome\texamples\tto illustrate\t\
    the\tinteraction\tbetween\tthese\tsettings: # truncation is moot, as each rotation gets a unique filename (postgresql20180605.log)\
    \ log_truncate_on_rotation = on log_filename = 'postgresql-%Y%m%d.log' log_rotation_age = '1d' log_rotation_size = 0 #\
    \ truncation every hour, losing log data every hour until the date changes log_truncate_on_rotation = on log_filename\
    \ = 'postgresql-%Y%m%d.log' log_rotation_age = '1h' log_rotation_size = 0 # no truncation if the date changed before generating\
    \ 100M of log data, truncation otherwise log_truncate_on_rotation = on 32\t|\tPage log_filename = 'postgresql-%Y%m%d.log'\
    \ log_rotation_age = '0' log_rotation_size = '100M'"
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/current/static/runtime-config-logging.html
  page_start: 32
  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tverify\thow\tlog_truncate_on_rotation\tis\tset:\npostgres=# show\
    \ log_truncate_on_rotation;\n log_truncate_on_rotation\n--------------------------\n on\n(1 row)\nIf\tit\tis\tnot\tset\t\
    to\ton,\tthis\tis\ta\tfail\t(depending\ton\tyour\torganization's\tlogging\tpolicy)."
  remediation: "Execute\tthe\tfollowing\tSQL\tstatement(s)\tto\tremediate\tthis\tsetting:\npostgres=# alter system set log_truncate_on_rotation\
    \ = 'on';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=#\
    \ show log_truncate_on_rotation;\n log_truncate_on_rotation\n--------------------------\n on\n(1 row)\nDefault\tValue:\n\
    on"
  checks:
  - type: sql
    command: show log_truncate_on_rotation;
    severity: medium
    info: "Execute\tthe\tfollowing\tSQL\tstatement\tto\tverify\thow\tlog_truncate_on_rotation\tis\tset:\npostgres=# show log_truncate_on_rotation;\n\
      \ log_truncate_on_rotation\n--------------------------\n on\n(1 row)\nIf\tit\tis\tnot\tset\tto\ton,\tthis\tis\ta\tfail\t\
      (depending\ton\tyour\torganization's\tlogging\tpolicy)."
