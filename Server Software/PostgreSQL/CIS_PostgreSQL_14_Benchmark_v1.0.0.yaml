    prevent automatic\tlog\tfile\trotation\twhen\tfiles\tbecome\ttoo\tlarge,\twhich\tcould\tput\tlog\tdata\tat increased\t\
    risk\tof\tloss\t(unless\tage-based\trotation\tis\tconfigured)."
