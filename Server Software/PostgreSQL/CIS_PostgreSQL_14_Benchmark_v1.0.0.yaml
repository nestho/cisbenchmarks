  audit_raw: "Execute\tthe\tfollowing\tSQL\tstatement:\npostgres=# show log_timezone ;\n log_timezone\n--------------\n US/Eastern\n\
    (1 row)\nIf\tlog_timezone\tis\tnot\tset\tto\tGMT,\tUTC,\tor\tas\tdefined\tby\tyour\torganization's\tlogging\tpolicy\n\
    this\tis\ta\tfail.\nFirst,\tas\tthe\tdatabase\tadministrator\t(shown\there\tas\t\"postgres\"),\tverify\tpgAudit\tis\t\
    enabled\nby\trunning\tthe\tfollowing\tcommands:\npostgres=# show shared_preload_libraries ;\n shared_preload_libraries\n\
    75\t|\tPage\n--------------------------\npgaudit\n(1 row)\nIf\tthe\toutput\tdoes\tnot\tcontain\t\"pgaudit\",\tthis\tis\t\
    a\tfail.\nNext,\tverify\tthat\tdesired\tauditing\tcomponents\tare\tenabled:\npostgres=# show pgaudit.log;\nERROR:  unrecognized\
    \ configuration parameter \"pgaudit.log\"\nIf\tthe\toutput\tdoes\tnot\tcontain\tthe\tdesired\tauditing\tcomponents,\t\
    this\tis\ta\tfail.\nThe\tlist\tbelow\tsummarizes\tpgAudit.log\tcomponents:\n• READ:\tSELECT\tand\tCOPY\twhen\tthe\tsource\t\
    is\ta\trelation\tor\ta\tquery.\n• WRITE:\tINSERT,\tUPDATE,\tDELETE,\tTRUNCATE,\tand\tCOPY\twhen\tthe\tdestination\tis\t\
    a\nrelation.\n• FUNCTION:\tFunction\tcalls\tand\tDO\tblocks.\n• ROLE:\tStatements\trelated\tto\troles\tand\tprivileges:\t\
    GRANT,\tREVOKE,\tCREATE/ALTER/DROP\nROLE.\n• DDL:\tAll\tDDL\tthat\tis\tnot\tincluded\tin\tthe\tROLE\tclass.\n• MISC:\t\
    Miscellaneous\tcommands,\te.g.\tDISCARD,\tFETCH,\tCHECKPOINT,\tVACUUM.\nLog\tin\tas\tan\tOperating\tSystem\tuser\tauthorized\t\
    to\tescalate\tprivileges\tand\ttest\tthe\tsudo\ninvocation\tby\texecuting\tthe\tfollowing:\n# whoami\nuser1\n# groups\n\
    user1\n# sudo su - postgres\n[sudo] password for user1:\nuser1 is not in the sudoers file. This incident will be reported.\n\
    As\tshown\tabove,\tuser1\thas\tnot\tbeen\tadded\tto\tthe\t/etc/sudoers\tfile\tor\tmade\ta\tmember\tof\nany\tgroup\tlisted\t\
    in\tthe\t/etc/sudoers\tfile.\tWhereas:\n78\t|\tPage\n# whoami\nuser2\n# groups\nuser2 dba\n# sudo su - postgres\n[sudo]\
    \ password for user2:\n# whoami\npostgres\nThis\tshows\tthat\tthe\tuser2\tuser\tis\tconfigured\tproperly\tfor\tsudo\t\
    access\tby\tbeing\ta\tmember\tof\nthe\tdba\tgroup.\nFirst,\tinspect\tthe\tprivileges\tgranted\tto\tthe\tdatabase\tsuperuser\t\
    (identified\there\tas\tpostgres)\nusing\tthe\tdisplay\tcommand\tpsql -c \"\\du postgres\"\tto\testablish\ta\tbaseline\t\
    for\tgranted\nadministrative\tprivileges.\tBased\ton\tthe\toutput\tbelow,\tthe\tpostgres\tsuperuser\tcan\tcreate\nroles,\t\
    create\tdatabases,\tmanage\treplication,\tand\tbypass\trow-level\tsecurity\t(RLS):\n# whoami\npostgres\n# psql -c \"\\\
    du postgres\"\n80\t|\tPage\n                              List of roles\nRole name |                    Attributes   \
    \                | Member of\n----------+-------------------------------------------------+-----------\npostgres  | Superuser,\
    \ Create role, Create DB, Replication, | {}\n          | Bypass RLS                                      |\nNow,\tlet's\t\
    inspect\tthe\tsame\tinformation\tfor\ta\tmock\tregular\tuser\tcalled\tappuser\tusing\tthe\ndisplay\tcommand\tpsql -c \"\
    \\du appuser\".\tThe\toutput\tconfirms\tthat\tregular\tuser\tappuser\nhas\tthe\tsame\televated\tprivileges\tas\tsystem\t\
    administrator\tuser\tpostgres.\tThis\tis\ta\tfail.\n# whoami\npostgres\n# psql -c \"\\du appuser\"\n                 \
    \             List of roles\nRole name |                    Attributes                   | Member of\n----------+-------------------------------------------------+-----------\n\
    appuser   | Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                             \
    \         |\nWhile\tthis\texample\tdemonstrated\texcessive\tadministrative\tprivileges\tgranted\tto\ta\tsingle\nuser,\t\
    a\tcomprehensive\taudit\tshould\tbe\tconducted\tto\tinspect\tall\tdatabase\tusers\tfor\texcessive\nadministrative\tprivileges.\t\
    This\tcan\tbe\taccomplished\tvia\teither\tof\tthe\tcommands\tbelow.\n# whoami\npostgres\n# psql -c \"\\du *\"\n# psql\
    \ -c \"select * from pg_user order by usename\"\nNOTE\tUsing\t\\du *\twill\tshow\tall\tthe\tdefault\tPostgreSQL\troles\t\
    (e.g.\tpg_monitor)\tas\twell\tas\nany\t'normal'\troles.\tThis\tis\texpected,\tand\tshould\tnot\tbe\tcause\tfor\talarm.\n\
    Functions\tin\tPostgreSQL\tcan\tbe\tcreated\twith\tthe\tSECURITY DEFINER\toption.\tWhen\nSECURITY DEFINER\tfunctions\t\
    are\texecuted\tby\ta\tuser,\tsaid\tfunction\tis\trun\twith\tthe\tprivileges\nof\tthe\tuser\twho\tcreated\tit,\tnot\tthe\t\
    user\twho\tis\trunning\tit.\nTo\tlist\tall\tfunctions\tthat\thave\tSECURITY DEFINER,\trun\tthe\tfollowing\tSQL:\n# whoami\n\
    root\n# sudo su - postgres\n# psql -c \"SELECT nspname, proname, proargtypes, prosecdef, rolname,\nproconfig FROM pg_proc\
    \ p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid a ON a.oid = p.proowner WHERE prosecdef OR NOT proconfig\
    \ IS NULL;\"\nIn\tthe\tquery\tresults,\ta\tprosecdef\tvalue\tof\t't'\ton\ta\trow\tindicates\tthat\tthat\tfunction\tuses\n\
    privilege\televation.\n83\t|\tPage\nIf\televation\tprivileges\tare\tutilized\twhich\tare\tnot\trequired\tor\tare\texpressly\t\
    forbidden\tby\norganizational\tguidance,\tthis\tis\ta\tfail.\nTo\taudit\texcessive\tDML\tprivileges,\ttake\tan\tinventory\t\
    of\tall\tusers\tdefined\tin\tthe\tcluster\nusing\tthe\t\\du+ *\tSQL\tcommand,\tas\twell\tas\tall\ttables\tdefined\tin\t\
    the\tdatabase\tusing\tthe\t\\dt\n*.*\tSQL\tcommand.\tFurthermore,\tthe\tintersection\tmatrix\tof\ttables\tand\tuser\t\
    grants\tcan\tbe\nobtained\tby\tquerying\tsystem\tcatalogs\tpg_tables\tand\tpg_user.\tNote\tthat\tin\tPostgreSQL,\nusers\t\
    are\tdefined\tcluster-wide\tacross\tall\tdatabases,\twhile\tschemas\tand\ttables\tare\tspecific\nto\ta\tparticular\tdatabase.\t\
    Therefore,\tthe\tcommands\tbelow\tshould\tbe\texecuted\tfor\teach\ndefined\tdatabase\tin\tthe\tcluster.\tWith\tthis\t\
    information,\tinspect\tdatabase\ttable\tgrants\tand\ndetermine\tif\tany\tare\texcessive\tfor\tdefined\tdatabase\tusers.\n\
    postgres=# -- display all users defined in the cluster\npostgres=# \\x\nExpanded display is on.\npostgres=# \\du+ *\n\
    List of roles\n-[ RECORD 1 ]-------------------------------------------------------------\nRole name   | pg_database_owner\n\
