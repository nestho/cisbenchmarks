  description: "The\tlog_timezone\tsetting\tspecifies\tthe\ttime\tzone\tto\tuse\tin\ttimestamps\twithin\tlog\tmessages. This\t\
    value\tis\tcluster-wide,\tso\tthat\tall\tsessions\twill\treport\ttimestamps\tconsistently.\tUnless directed\totherwise\t\
    by\tyour\torganization's\tlogging\tpolicy,\tset\tthis\tto\teither\tGMT\tor\tUTC. The\tPostgreSQL\tAudit\tExtension\t(pgAudit)\t\
    provides\tdetailed\tsession\tand/or\tobject\taudit logging\tvia\tthe\tstandard\tPostgreSQL\tlogging\tfacility.\tThe\t\
    goal\tof\tpgAudit\tis\tto\tprovide PostgreSQL\tusers\twith\tthe\tcapability\tto\tproduce\taudit\tlogs\toften\trequired\t\
    to\tcomply\twith government,\tfinancial,\tor\tISO\tcertifications. It\tis\tcommon\tto\thave\tmore\tthan\tone\tauthorized\t\
    individual\tadministering\tthe\tPostgreSQL service\tat\tthe\tOperating\tSystem\tlevel.\tIt\tis\talso\tquite\tcommon\t\
    to\tpermit\tlogin\tprivileges\tto individuals\ton\ta\tPostgreSQL\thost\twho\totherwise\tare\tnot\tauthorized\tto\taccess\t\
    the\tserver's data\tcluster\tand\tfiles.\tAdministering\tthe\tPostgreSQL\tdata\tcluster,\tas\topposed\tto\tits\tdata,\t\
    is to\tbe\taccomplished\tvia\ta\tlocalhost\tlogin\tof\ta\tregular\tUNIX\tuser\taccount.\tAccess\tto\tthe postgres\tsuperuser\t\
    account\tis\trestricted\tin\tsuch\ta\tmanner\tas\tto\tinterdict\tunauthorized access.\tsudo\tsatisfies\tthe\trequirements\t\
    by\tescalating\tordinary\tuser\taccount\tprivileges\tas the\tPostgreSQL\tRDBMS\tsuperuser. With\trespect\tto\tPostgreSQL\t\
    administrative\tSQL\tcommands,\tonly\tsuperusers\tshould\thave elevated\tprivileges.\tPostgreSQL\tregular,\tor\tapplication,\t\
    users\tshould\tnot\tpossess\tthe\tability to\tcreate\troles,\tcreate\tnew\tdatabases,\tmanage\treplication,\tor\tperform\t\
    any\tother\taction deemed\tprivileged.\tTypically,\tregular\tusers\tshould\tonly\tbe\tgranted\tthe\tminimal\tset\tof privileges\t\
    commensurate\twith\tmanaging\tthe\tapplication: • DDL\t(create table,\tcreate view,\tcreate index,\tetc.) • DML\t(select,\t\
    insert,\tupdate,\tdelete) Further,\tit\thas\tbecome\tbest\tpractice\tto\tcreate\tseparate\troles\tfor\tDDL\tand\tDML.\t\
    Given\tan application\tcalled\t'payroll',\tone\twould\tcreate\tthe\tfollowing\tusers: • payroll_owner • payroll_user Any\t\
    DDL\tprivileges\twould\tbe\tgranted\tto\tthe\tpayroll_owner\taccount\tonly,\twhile\tDML privileges\twould\tbe\tgiven\t\
    to\tthe\tpayroll_user\taccount\tonly.\tThis\tprevents\taccidental creation/altering/dropping\tof\tdatabase\tobjects\t\
    by\tapplication\tcode\tthat\truns\tas\tthe payroll_user\taccount. In\tcertain\tsituations,\tto\tprovide\tthe\trequired\t\
    functionality,\tPostgreSQL\tneeds\tto\texecute internal\tlogic\t(stored\tprocedures,\tfunctions,\ttriggers,\tetc.)\tand/or\t\
    external\tcode\tmodules with\televated\tprivileges.\tHowever,\tif\tthe\tprivileges\trequired\tfor\texecution\tare\tat\t\
    a\thigher level\tthan\tthe\tprivileges\tassigned\tto\torganizational\tusers\tinvoking\tthe\tfunctionality applications/programs,\t\
    those\tusers\tare\tindirectly\tprovided\twith\tgreater\tprivileges\tthan assigned\tby\ttheir\torganization.\tThis\tis\t\
    known\tas\tprivilege\televation.\tPrivilege\televation must\tbe\tutilized\tonly\twhere\tnecessary.\tExecute\tprivileges\t\
    for\tapplication\tfunctions\tshould be\trestricted\tto\tauthorized\tusers\tonly. DML\t(insert,\tupdate,\tdelete)\toperations\t\
    at\tthe\ttable\tlevel\tshould\tbe\trestricted\tto\tonly authorized\tusers.\tPostgreSQL\tmanages\ttable-level\tDML\tpermissions\t\
    via\tthe\tGRANT statement. In\taddition\tto\tthe\tSQL-standard\tprivilege\tsystem\tavailable\tthrough\tGRANT,\ttables\t\
    can\thave row\tsecurity\tpolicies\tthat\trestrict,\ton\ta\tper-user\tbasis,\twhich\tindividual\trows\tcan\tbe returned\t\
    by\tnormal\tqueries\tor\tinserted,\tupdated,\tor\tdeleted\tby\tdata\tmodification commands.\tThis\tfeature\tis\talso\t\
