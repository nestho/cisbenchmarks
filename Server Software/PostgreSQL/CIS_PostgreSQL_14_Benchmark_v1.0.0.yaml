    policies.\tGenerally,\tonly\tsuperusers\tand\televated\tusers should\tpossess\tthis\tprivilege. PostgreSQL\taccess\tto\t\
    the\tsuperuser\tdatabase\trole\tmust\tbe\tcontrolled\tand\taudited\tto prevent\tunauthorized\taccess. PostgreSQL\tprovides\t\
    a\tset\tof\tpredefined\troles\tthat\tprovide\taccess\tto\tcertain,\tcommonly needed,\tprivileged\tcapabilities\tand\t\
    information.\tAdministrators\tcan\tGRANT\tthese\troles\tto users\tand/or\tother\troles\tin\ttheir\tenvironment,\tproviding\t\
    those\tusers\twith\taccess\tto\tthe specified\tcapabilities\tand\tinformation. A\tremote\thost\tlogin,\tvia\tSSH,\tis\t\
    arguably\tthe\tmost\tsecure\tmeans\tof\tremotely\taccessing\tand administering\tthe\tPostgreSQL\tserver.\tOnce\tconnected\t\
    to\tthe\tPostgreSQL\tserver,\tusing\tthe psql\tclient,\tvia\tUNIX\tDOMAIN\tSOCKETS,\twhile\tusing\tthe\tpeer\tauthentication\t\
    method\tis\tthe most\tsecure\tmechanism\tavailable\tfor\tlocal\tdatabase\tconnections.\tProvided\ta\tdatabase\tuser account\t\
    of\tthe\tsame\tname\tof\tthe\tUNIX\taccount\thas\talready\tbeen\tdefined\tin\tthe\tdatabase, even\tordinary\tuser\taccounts\t\
    can\taccess\tthe\tcluster\tin\ta\tsimilarly\thighly\tsecure\tmanner. A\tlarge\tnumber\tof\tauthentication\tMETHODs\tare\t\
