  description: Temporary files are created for sorts, hashes, and temporary query results when these operations exceed work_mem.
    A log entry is made for each temporary file when it is deleted. Setting log_temp_files to 0 causes all temporary file
    information to be logged, while positive values log only files whose size is greater than or equal to the specified number
    of kilobytes. A value of -1 disables temporary file information logging. Unless directed otherwise by your organization's
    logging policy, you should set this to 0.
