  audit_raw: "Execute the following SQL statement to verify the setting is correct:\npostgres=# show log_statement_stats ;\n\
    \ log_statement_stats\n---------------------\n off\n(1 row)\nFirst, as the database administrator (shown here as \"postgres\"\
    ), verify pgaudit is enabled\nby running the following commands:\npostgres=# show shared_preload_libraries ;\n shared_preload_libraries\n\
    --------------------------\npgaudit\n(1 row)\nIf the output does not contain \"pgaudit\", this is a finding.\nNext, verify\
    \ that desired auditing components are enabled:\npostgres=# show audit.log;\nERROR:  unrecognized configuration parameter\
    \ \"audit.log\"\n85 | P a g e\nIf the output does not contain desired auditing components, this is a finding.\nThe list\
    \ below summarizes pgAudit.log components:\n• READ: SELECT and COPY when the source is a relation or a query.\n• WRITE:\
    \ INSERT, UPDATE, DELETE, TRUNCATE, and COPY when the destination is a\nrelation.\n• FUNCTION: Function calls and DO blocks.\n\
    • ROLE: Statements related to roles and privileges: GRANT, REVOKE, CREATE/ALTER/DROP\nROLE.\n• DDL: All DDL that is not\
    \ included in the ROLE class.\n• MISC: Miscellaneous commands, e.g. DISCARD, FETCH, CHECKPOINT, VACUUM.\nLog in as a user\
    \ authorized to escalate privileges and test the sudo invocation by executing\nthe following:\nsudo su - postgres\n[sudo]\
    \ password for user1:\nuser1 is not in the sudoers file. This incident will be reported.\nAs shown above, 'user1' has\
    \ not been added to the/etc/sudoers file or made a member of\nany group listed in the /etc/sudoers file. Whereas:\nsudo\
    \ su - postgres\n[sudo] password for user1:\npostgres@localhost:~$\n88 | P a g e\nshows the 'user1' user is configured\
    \ properly for sudo access.\nAssuming one has previously created an SSH key pair, you must confirm that the public key\n\
    is already installed in the remote host's $HOME/.ssh/authorized_keys file.\n It is understood that the SSH server on the\
    \ remote host has been installed and configured\nto accept connections for the postgres UNIX account.\nA successful login\
    \ to the remote host's postgres UNIX account via SSH keys should return a\nshell prompt without prompting for a password.\
    \ Here is an example login attempt using the\nSSH cli in a terminal executed from your workstation:\n$ hostname -s\ndbmaster\n\
    $ ssh postgres@<remote host> hostname -s\ndbslave\nFailure to login (as indicated by Permission denied (publickey,gssapi-keyex,gssapiwith-mic,password),\
    \ ssh: connect to host <host> port 22: Connection refused, or\nsimilar messages) may be explained by issues other than\
    \ one's public key not being present\non the remote host. Suffice to say that it is beyond the scope of this documentation\
    \ to debug\nFailures. There is further, comprehensive documentation available online.\nFirst, inspect the privileges granted\
    \ to the database superuser (identified here as postgres)\nusing the display command psql -c \"\\du postgres\" to establish\
    \ a baseline for granted\nadministrative privileges. Based on the output below, the postgres superuser can create\nroles,\
    \ create databases, manage replication, and bypass row level security:\n$ psql -c \"\\du postgres\"\n                \
    \              List of roles\nRole name |                    Attributes                   | Member of\n----------+-------------------------------------------------+-----------\n\
    postgres  | Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                             \
    \         |\nNow, let's inspect the same information for a mock regular user calledappuser using the\ndisplay command\
    \ psql -c \"\\du appuser\". The output confirms that regular user appuser\nhas the same elevated privileges as system\
    \ administrator user postgres. This is a finding.\n93 | P a g e\n$ psql -c \"\\du appuser\"\n                        \
    \      List of roles\nRole name |                    Attributes                   | Member of\n----------+-------------------------------------------------+-----------\n\
    appuser   | Superuser, Create role, Create DB, Replication, | {}\n          | Bypass RLS                             \
    \         |\nWhile this example demonstrated excessive administrative privileges granted to a single\nuser, a comprehensive\
    \ audit should be conducted to inspect all database users for excessive\nadministrative privileges. This can be accomplished\
    \ via either of the commands below.\n$ psql -c \"\\du *\"\n$ psql -c \"select * from pg_user order by usename\"\nFunctions\
    \ in PostgreSQL can be created with the SECURITY DEFINER option. When\nSECURITY DEFINER functions are executed by a user,\
    \ said function is run with the privileges\nof the user who created it, not the user who is running it.\nTo list all functions\
    \ that have 'SECURITY DEFINER', run the following SQL:\n$ sudo su - postgres\n$ psql -c \"SELECT nspname, proname, proargtypes,\
    \ prosecdef, rolname,\nproconfig FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid a ON a.oid\
    \ = p.proowner WHERE prosecdef OR NOT proconfig IS NULL;\"\nIn the query results, a prosecdef value of `t` on a row indicates\
    \ that that function uses\nprivilege elevation.\nIf elevation of PostgreSQL privileges is utilized but not documented,\
    \ this is a finding.\n96 | P a g e\nIf elevation of PostgreSQL privileges is documented, but not implemented as described\
    \ in\nthe documentation, this is a finding.\nIf the privilege-elevation logic can be invoked in ways other than intended,\
    \ or in contexts\nother than intended, or by subjects/principals other than intended, this is a finding.\nTo audit excessive\
    \ DML privileges, take an inventory of all users define in the cluster using\nthe \\du+ * SQL command, as well as all\
    \ tables defined in the database using the \\dt *.*\nSQL command. Furthermore, the intersection matrix of tables and user\
    \ grants can be\nobtained by querying system catalogs pg_tables and pg_user. Note that in PostgreSQL,\nusers are defined\
    \ cluster-wide across all databases, while schemas and tables are specific\nto a particular database in a multi-tenant\
    \ instance. Therefore, the commands below should\nbe executed for each defined database in the cluster. With this information,\
    \ inspect\ndatabase table grants and determine if any are excessive for defined database users.\npostgres=# -- display\
    \ all users defined in the cluster\npostgres=# \\du+ *\npostgres=# -- display all schema.tables created in current database\n\
    postgres=# \\dt+ *.*\npostgres=# -- query all tables and user grants in current database\npostgres=# -- system catalogs\
    \ information_schema and pg_catalog excluded\npostgres=# select t.schemaname, t.tablename, u.usename,\n     has_table_privilege(u.usename,\
    \ t.tablename, 'select') as select,\n     has_table_privilege(u.usename, t.tablename, 'insert') as insert,\n     has_table_privilege(u.usename,\
    \ t.tablename, 'update') as update,\n     has_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom  pg_tables\
    \ t, pg_user u\nwhere t.schemaname not in ('information_schema','pg_catalog');\nFor the example below, we illustrate using\
    \ a single tablecustomer and two application\nusers appwriter and appreader. The intention is for appwriter to have full\
    \ select, insert,\nupdate, delete rights and for appreader to only have select rights. We can query these\n98 | P a g\
    \ e\nprivileges with the example below using the has_table_privilege function and filtering\nfor just the table and roles\
    \ in question.\npostgres=# select t.tablename, u.usename,\n       has_table_privilege(u.usename, t.tablename, 'select')\
    \ as select,\n       has_table_privilege(u.usename, t.tablename, 'insert') as insert,\n       has_table_privilege(u.usename,\
    \ t.tablename, 'update') as update,\n       has_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom   pg_tables\
    \ t, pg_user u\nwhere  t.tablename = 'customer'\nand    u.usename in ('appwriter','appreader');\ntablename |  usename\
    \  | select | insert | update | delete\n----------+-----------+--------+--------+--------+--------\ncustomer  | appwriter\
    \ | t      | t      | t      | t\ncustomer  | appreader | t      | t      | t      | t\n(2 rows)\nAs depicted, both users\
    \ have full privileges for the customer table. This is a finding.\nWhen inspecting database-wide results for all users\
    \ and all table grants, employ a\ncomprehensive approach. Collaboration with application developers is paramount to\n\
    collectively determine only those database users that require specific DML privileges on\nwhich tables.\nThe first step\
    \ for an organization is to determine which, if any, database tables require RLS.\nThis decision is a matter of business\
    \ processes and is unique to each organization. To\ndiscover which, if any, database tables have RLS enabled, execute\
    \ the following query. If\nany table(s) should have RLS policies applied, but do not appear in query results, then this\n\
    is a finding.\npostgres=# SELECT oid, relname, relrowsecurity FROM pg_class WHERE\nrelrowsecurity;\nFor the purpose of\
    \ this illustration, we will demonstrate the standard example from the\nPostgreSQL documentation using thepasswd table\
    \ and policy example. As of PostgreSQL\n101 | P a g e\n9.5, the catalog table pg_class provides column relrowsecurity\
    \ to query and determine\nwhether a relation has RLS enabled. Based on results below we can see RLS is not enabled.\n\
    Assuming this table should be RLS enabled but is not, this is a finding.\npostgres=# SELECT oid, relname, relrowsecurity\
    \ FROM pg_class WHERE relname =\n'passwd';\n  oid  | relname | relrowsecurity\n-------+---------+----------------\n 24679\
    \ | passwd  | f\n(1 row)\nFurther inspection of RLS policies are provided via the system catalogpg_policy, which\nrecords\
    \ policy details including table oid, policy name, applicable commands, the roles\nassigned a policy, and the USING and\
    \ WITH CHECK clauses. Finally, RLS and associated\npolicies (if implemented) may also be viewed using the standard psql\
    \ display command\n\\d+ <schema>.<table> which lists RLS information as part of the table description.\nShould you implement\
    \ Row Level Security and apply restrictive policies to certain users,\nit's imperative that you check each user's role\
    \ definition via the psql display command \\du\nand ensure unauthorized users have not been granted Bypass RLS privilege\
    \ as this would\noverride any RLS enabled tables and associated policies. If unauthorized users do have\nBypass RLS granted\
    \ then resolve this using the ALTER ROLE<user>NOBYPASSRLS; command.\nNewly created data clusters are empty of data and\
    \ have only one user account, the\nsuperuser (postgres). By default, the data cluster superuser is named after the UNIX\n\
    105 | P a g e\naccount. Login authentication is tested via UNIX DOMAIN SOCKETS by the UNIX user\naccount postgres, the\
    \ default account:\n$ whoami\npostgres\n$ psql postgres\npsql (9.5.10)\nType \"help\" for help.\npostgres=#\nLogin attempts\
    \ by another UNIX user account as the superuser should be denied:\n$ su - <user1>\n$ whoami\nuser1\n$ psql -U postgres\
    \ postgres\npsql: FATAL:  Peer authentication failed for user \"postgres\"\n$ exit\n$ su - <user2>\n$ whoami\nuser2\n\
    $ psql -U postgres postgres\npsql: FATAL: Peer authentication failed for user \"postgres\"\n$ psql -U user1 postgres\n\
    psql: FATAL: Peer authentication failed for user \"user1\"\nThis test demonstrates the rule permitting connections when\
    \ the database ROLE matches\nthe UNIX account.\nNewly created data clusters are empty of data and has one only one user\
    \ account, the\nsuperuser. By default, the data cluster superuser is named after the UNIX account\npostgres. Login authentication\
    \ can be tested via TCP/IP SOCKETS by any UNIX user\naccount from the localhost. A password must be assigned to each login\
    \ ROLE:\npostgres=# alter role postgres with password <my password>;\nALTER ROLE\nTest an unencrypted session:\n$ psql\
    \ 'host=localhost user=postgres sslmode=disable'\nPassword:\n109 | P a g e\nTest an encrypted session:\n$ psql 'host=localhost\
    \ user=postgres sslmode=require'\nPassword:\nRemote logins repeat the previous invocations but, of course, from the remote\
    \ host:\nTest unencrypted session:\n$ psql 'host=<my host> user=postgres sslmode=disable'\nPassword:\nTest encrypted sessions:\n\
    $ psql 'host=<my host> user=postgres sslmode=require'\nPassword:\nReview all configuration settings. Configure postgres\
    \ logging to record all modifications\nand changes to the RDBMS.\nIssue the following command to verify the backend runtime\
    \ parameters are configured\ncorrectly:\npostgres=# select name, setting, unit from pg_settings where context like\n'%backend%'\
    \ order by 1;\n         name          | setting | unit\n-----------------------+---------+------\n ignore_system_indexes\
    \ | off     |\n log_connections       | on      |\n log_disconnections    | on      |\n post_auth_delay       | 0    \
    \   | s\n(4 rows)\nNote: Effecting changes to these parameters can only be made at server start. Therefore, a\nsuccessful\
    \ exploit may not be detected until after a server restart, i.e., during a maintenance\nwindow.\n114 | P a g e\nThe following\
    \ parameters can only be set at server start by the owner of the PostgreSQL\nserver process and cluster i.e. typically\
    \ UNIX user account postgres. Therefore, all exploits\nrequire the successful compromise of either the UNIX account or\
    \ the postgres superuser\naccount itself.\npostgres=# select name, setting from pg_settings\nwhere context = 'postmaster'\
    \ order by 1;\n                name                 |                 setting\n-------------------------------------+--------------------------------------\n\
    ---\n allow_system_table_mods             | off\n archive_mode                        | off\n autovacuum_freeze_max_age\
    \           | 200000000\n autovacuum_max_workers              | 3\n autovacuum_multixact_freeze_max_age | 400000000\n\
    \ bonjour                             | off\n bonjour_name                        |\n cluster_name                   \
    \     |\n config_file                         |\n/var/lib/pgsql/9.6/data/postgresql.conf\n data_directory            \
    \          | /var/lib/pgsql/9.6/data\n dynamic_shared_memory_type          | posix\n event_source                    \
    \    | PostgreSQL\n external_pid_file                   |\n hba_file                            | /var/lib/pgsql/9.6/data/pg_hba.conf\n\
    \ hot_standby                         | off\n huge_pages                          | try\n ident_file                 \
    \         | /var/lib/pgsql/9.6/data/pg_ident.conf\n listen_addresses                    | localhost\n116 | P a g e\n logging_collector\
    \                   | on\n max_connections                     | 100\n max_files_per_process               | 1000\n max_locks_per_transaction\
    \           | 64\n max_pred_locks_per_transaction      | 64\n max_prepared_transactions           | 0\n max_replication_slots\
    \               | 0\n max_wal_senders                     | 0\n max_worker_processes                | 8\n old_snapshot_threshold\
    \              | -1\n port                                | 5432\n shared_buffers                      | 16384\n shared_preload_libraries\
    \            |\n ssl                                 | off\n ssl_ca_file                         |\n ssl_cert_file   \
    \                    | server.crt\n ssl_ciphers                         | HIGH:MEDIUM:+3DES:!aNULL\n ssl_crl_file    \
    \                    |\n ssl_ecdh_curve                      | prime256v1\n ssl_key_file                        | server.key\n\
    \ ssl_prefer_server_ciphers           | on\n superuser_reserved_connections      | 3\n track_activity_query_size     \
    \      | 1024\n track_commit_timestamp              | off\n unix_socket_directories             | /var/run/postgresql,\
    \ /tmp\n unix_socket_group                   |\n unix_socket_permissions             | 0777\n wal_buffers            \
    \             | 512\n wal_level                           | minimal\n wal_log_hints                       | off\n(48 rows)\n\
    The following parameters can be set at any time, without interrupting the server, by the\nowner of the postgres server\
