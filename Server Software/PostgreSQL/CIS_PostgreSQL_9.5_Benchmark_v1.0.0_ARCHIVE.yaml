- id: 3.1.11
  title: Ensure the program name for PostgreSQL syslog messages is correct
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: 'The syslog_ident setting specifies the program name used to identify PostgreSQL messages in syslog logs. An
    example of a possible program name is "postgres". The client_min_messages setting specifies the message levels that are
    sent to the database client (not the logs). Each level includes all the levels that follow it. The later the level, the
    fewer messages are sent. NOTICE is generally accepted as the best practice for this setting. Valid values are: • DEBUG5
    • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • LOG • NOTICE • WARNING • ERROR • FATAL • PANIC Note: LOG has a different rank here
    than in log_min_messages. The log_min_messages setting specifies the message levels that are written to the server log.
    Each level includes all the levels that follow it. The later the level, the fewer messages are sent. Valid values are:
    • DEBUG5 • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING • ERROR • LOG • FATAL • PANIC Note: LOG has a different
    rank here than in client_min_messages. WARNING is considered the best practice unless indicated otherwise by your organization''s
    logging policy.'
  rationale: If this is not set correctly, it may be difficult or impossible to distinguish PostgreSQL messages from other
    messages in syslog logs. If this is not set correctly, the database client may receive too many messages or too few messages.
    If this is not set to the correct value, too many messages or too few messages may be written to the server log. 49 |
    P a g e
