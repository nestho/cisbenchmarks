controls:
- id: 3.1.11
  title: Ensure the program name for PostgreSQL syslog messages is correct
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: When obtaining and installing software packages (typically via yum), it's imperative that packages are sourced
    only from valid and authorized repositories. For PostgreSQL, a short list of valid repositories would include CentOS (www.centos.org)
    and the official PostgreSQL website (yum.postgresql.org). Adding, and installing, the PostgreSQL community packages to
    the host's package repository. The PostgreSQL package(s) are installed on the Operating System from valid source. Confirm,
    and set if necessary, the PostgreSQL runlevel on system-V operating systems. Create a new PostgreSQL database cluster.
    First time installs of PostgreSQL requires the instantiation of the database cluster. A database cluster is a collection
    of databases that are managed by a single server instance. Files are always created using a default set of permissions.
    File permissions can be restricted by applying a permissions mask called the umask. The postgres user account should use
    a umask of 077 to deny file access to all user accounts except the owner. The group pg_wheel is explicitly created on
    a host where the Postgres server is installed. Membership in this group enables an ordinary user account to gain superuser
    access to a machine by using the su command. Only user accounts authorized to have superuser access should be members
    of the pg_wheel group.
  rationale: 'Being open source, PostgreSQL packages are widely available across the internet through RPM aggregators and
    providers. However, using invalid or unauthorized sources for packages can lead to implementing untested, defective or
    malicious software. Many organizations choose to implement a local yum repository within their organization. Care must
    be taken to ensure that only valid and authorized packages are downloaded and installed into such local repositories.
    It''s an unfortunate reality that Linux Distributions do not always have the most up-to-date versions of PostgreSQL. Disadvantages
    of older releases include: missing bug patches, no access to highly desirable contribution modules, no access to 3rd party
    projects that are complimentary to Postgres, and no upgrade path migrating from one version of Postgres to the next. The
    worst set of circumstances is to be limited to a version of the DBMS that has reached its end-of-life. From a security
    perspective, it''s imperative that Postgres Community Packages are only obtained from the official website https://www.postgresql.org/.
    Being open source, the Postgres packages are widely available over the internet via myriad package aggregators and providers.
    Obtaining software from these unofficial sites risks installing defective, corrupt, or downright malicious versions of
    Postgres. Standard Linux distributions, although possessing the requisite packages, often do not have PostgreSQL pre-installed.
    The installation process includes installing the binaries and the means to generate a data cluster too. Package installation
    should include the server and client packages. Contribution modules are optional depending upon one''s architectural requirements.
    From a security perspective, it''s imperative to verify PostgreSQL binary packages are sourced from a valid Linux yum
    repository. The most common Linux repositories include RHEL base, CentOS base and PGDG base; however, it''s up to the
    organization to validate. For a complete listing of all PostgreSQL binaries available via configured repositories inspect
    the output from yum provides postgres*. Setting the runlevel on a System V OS ensures the database service is active especially
    when a change of state occurs as in the case of a system startup, reboot or an explicit change of runlevel by the sys-admin.
    For the purposes of security, PostgreSQL enforces ownership and permissions of the datacluster such that: • An initialized
    data-cluster is owned by the UNIX account that created it. • The data-cluster cannot be accessed by other UNIX user-accounts.
    • The data-cluster cannot be created or owned by root • The Postgres process cannot be invoked by root nor any UNIX user
    account other than the owner of the data cluster. Incorrectly instantiating the data-cluster will result in a failed installation.
    The Linux OS defaults the umask to 002, which means the owner and primary group can read and write the file, and other
    accounts are permitted to read the file. Not explicitly setting the umask to a value as restrictive as 077 allows other
    users to read, write, or even execute files and scripts created by the postgres user account. The alternative to using
    a umask is explicitly updating file permissions after file creation using the command line utility chmod. Users with unauthorized
    membership in the pg_wheel group can assume the privileges of the owner of the Postgres RDBMS and administer the database,
    as well as accessing scripts, files, and other executables they should not be able to access.'
  impact: If the PostgreSQL version shipped as part of the default binary installation associated with your Linux distribution
    satisfies your requirements, this may be adequate for development and testing purposes. However, for production instances
    it's generally recommended to install the latest stable release of PostgreSQL.
  references:
  - 1. http://wiki.centos.org/PackageManagement/Yum/
  - 2. https://www.centos.org/docs/5/html/5.2/Deployment_Guide/s1-yum-yumconfrepository.html
  - 1. https://www.postgresql.org/
  - 2. https://www.postgresql.org/support/versioning/
  - 1. http://linuxcommand.org/man_pages/runlevel8.html
  - 2. http://linuxcommand.org/man_pages/chkconfig8.html
  - 1. http://man7.org/linux/man-pages/man1/groups.1.html
  - 2. http://man7.org/linux/man-pages/man8/getent.1.html
  page_start: 4
  audit_raw: 'Identify and inspect configured repositories to ensure they are all valid and authorized

    sources of packages. The following is an example of a simple CENTOS 6 install illustrating

    the use of the yum repolist all command.

    11 | P a g e

    $ yum repolist all | grep enabled:

    base                    CentOS-6 - Base                 enabled: 6,696

    extras                  CentOS-6 - Extras               enabled:    62

    updates                 CentOS-6 - Updates              enabled:   581

    Ensure the list of configured repositories only includes organization-approved repositories.

    If any unapproved repositories are listed, this is a fail.

    First determine whether or not the PostgreSQL Community Packages are installed. For this

    example, we are using a host that does not have any PostgreSQL packages installed and

    offer resolution in the Remediation Procedure below. We will illustrate two methods rpm

    and yum. In both cases nothing is returned.

    $ rpm -qa | grep postgres

    $

    $ yum list installed postgres*

    Checksum type ''md5'' disabled

    Loaded plugins: fastestmirror

    Loading mirror speeds from cached hostfile

    * base: mirrors.gigenet.com

    * epel: mirror.compevo.com

    * extras: mirror.us-midwest-1.nexcess.net

    * updates: pubmirrors.dal.corespace.com

    Error: No matching Packages to list

    13 | P a g e

    If the expected community packages are not installed or not the expected versions, this is a

    fail.

    To inspect what versions of PostgreSQL packages are installed we can query using the rpm

    command. As illustrated below, PostgreSQL 8.4 packages are installed:

    # rpm -qa|grep postgres

    postgresql-8.4.20-8.el6_9.x86_64

    postgresql-server-8.4.20-8.el6_9.x86_64

    postgresql-libs-8.4.20-8.el6_9.x86_64

    postgresql-contrib-8.4.20-8.el6_9.x86_64

    If the expected binary packages are not installed or not the expected versions, this is a fail.

    The default run-level on RedHat/CentOS operating systems is typically "3". One confirms

    the default run-level and those run-levels desirous of running PostgreSQL by executing the

    following;

    $ grep initdefault: /etc/inittab

    id:3:initdefault:

    $ chkconfig --list | grep postgres

    postgresql-9.5  0:off 1:off 2:off 3:off 4:off 5:off 6:off

    If the intended PostgreSQL service is not registered (no output for thechkconfig

    command) or is not configured to appropriate runlevel (3:off above), this is a fail.

    Assuming installing the Postgres binary package from either the CENTOS 6, or Community

    repository (rpm) installation; the standard method, as root, is to instantiate the cluster

    thusly:

    $ service postgresql-9.5 initdb

    Initializing database:                                     [  OK  ]

    A correctly installed data-cluster "data" possesses directory permissions similarly to the

    following example. Otherwise, the service will fail to start:

    ls -al ~postgres/9.5

    total 20

    drwxr-xr-x  4 postgres postgres 4096 Nov  5 16:46 .

    drwx------  3 postgres postgres 4096 Nov  5 15:45 ..

    drwx------ 19 postgres postgres 4096 Nov  5 16:46 data

    -rw-------  1 postgres postgres 1380 Nov  5 16:46 pgstartup.log

    21 | P a g e

    To view the mask''s current setting, as the postgres user, execute the command:

    # umask

    077

    The umask must be077 or more restrictive for the postgres user, otherwise this is a fail.

    Execute the command groups to confirm that a pg_wheel group exists. If no such group

    exists, this is a fail. If such a group does exist, view its membership and confirm that each

    user is authorized to act as an administrator.'
  remediation: "Alter the configured repositories so they only include valid and authorized sources of\npackages.\nHere is\
    \ an example of adding an authorized repository:\n1. Install the PGDG repository RPM from yum.postgresql.org\n$ rpm -ivh\n\
    https://download.postgresql.org/pub/repos/yum/9.5/redhat/rhel-6x86_64/pgdg-centos95-9.5-3.noarch.rpm\nRetrieving\nhttps://download.postgresql.org/pub/repos/yum/9.5/redhat/rhel-6x86_64/pgdg-centos95-9.5-3.noarch.rpm\n\
    warning: /var/tmp/rpm-tmp.DAPqyf: Header V4 DSA/SHA1 Signature, key ID\n442df0f8: NOKEY\nPreparing...                ###########################################\n\
    [100%]\n   1:pgdg-centos95          ###########################################\n[100%]\n2. Verify the repository has\
    \ been added and is enabled.\n$ yum repolist all | grep enabled:\nbase                    CentOS-6 - Base            \
    \     enabled: 6,696\nextras                  CentOS-6 - Extras               enabled:    62\nupdates                \
    \ CentOS-6 - Updates              enabled:   581\npgdg                    PostgreSQL 9.5 6 - x86_64       enabled:   406\n\
    Using a web browser, go to http://yum.postgresql.org and navigate to the repo download\nlink for your OS and version.\
    \ The following example blocks the outdated distro packages,\nadds the PGDG repository RPM for PostgreSQL version 9.5,\
    \ and installs the client-servercontributions rpms to the host where you want to install the RDBMS:\n$ vi /etc/yum.repos.d/CentOS-Base.repo\n\
    [base]\nname=CentOS-$releasever - Base\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=$basearch&\n\
    repo\n=os&infra=$infra\n#baseurl=http://mirror.centos.org/centos/$releasever/os/$basearch/\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-6\n\
    exclude=postgresql*  <-- add this line\n#released updates\n[updates]\nname=CentOS-$releasever - Updates\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=$basearch&\n\
    repo\n=updates&infra=$infra\n#baseurl=http://mirror.centos.org/centos/$releasever/updates/$basearch/\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-6\n\
    exclude=postgresql*  <-- add this line\n$ yum -y install https://yum.postgresql.org/9.5/redhat/rhel-6-x86_64/pgdgredhat95-9.5-3.noarch.rpm\n\
    $ yum -y groupinstall \"PostgreSQL Database Server 9.5 PGDG\"\nLoaded plugins: fastestmirror\nSetting up Group Process\n\
    Loading mirror speeds from cached hostfile\n * base: ftp.osuosl.org\n * extras: repo.us.bigstepcloud.com\n * updates:\
    \ repo1.dal.innoscale.net\nResolving Dependencies\n--> Running transaction check\n---> Package postgresql95.x86_64 0:9.5.6-5PGDG.rhel6\
    \ will be installed\n---> Package postgresql95-contrib.x86_64 0:9.5.6-5PGDG.rhel6 will be\ninstalled\n---> Package postgresql95-libs.x86_64\
    \ 0:9.5.6-5PGDG.rhel6 will be installed\n---> Package postgresql95-server.x86_64 0:9.5.6-5PGDG.rhel6 will be\ninstalled\n\
    --> Finished Dependency Resolution\nDependencies Resolved\n14 | P a g e\n============================================================================\n\
    ====\n Package                   Arch        Version                Repository\nSize\n============================================================================\n\
    ====\nInstalling:\n postgresql95              x86_64      9.5.6-5PGDG.rhel6      pgdg95\n1.4 M\n postgresql95-contrib\
    \      x86_64      9.5.6-5PGDG.rhel6      pgdg95\n491 k\n postgresql95-libs         x86_64      9.5.6-5PGDG.rhel6    \
    \  pgdg95\n285 k\n postgresql95-server       x86_64      9.5.6-5PGDG.rhel6      pgdg95\n4.8 M\nTransaction Summary\n============================================================================\n\
    ====\nInstall       4 Package(s)\nTotal download size: 6.9 M\nInstalled size: 27 M\nDownloading Packages:\n(1/4): postgresql95-9.5.6-5PGDG.rhel6.x86_64.rpm\
    \         | 1.4 MB     00:00\n(2/4): postgresql95-contrib-9.5.6-5PGDG.rhel6.x86_64.rpm | 491 kB     00:00\n(3/4): postgresql95-libs-9.5.6-5PGDG.rhel6.x86_64.rpm\
    \    | 285 kB     00:00\n(4/4): postgresql95-server-9.5.6-5PGDG.rhel6.x86_64.rpm  | 4.8 MB     00:00\n----------------------------------------------------------------------------\n\
    ----\nTotal                                           2.1 MB/s | 6.9 MB     00:03\nRunning rpm_check_debug\nRunning Transaction\
    \ Test\nTransaction Test Succeeded\nRunning Transaction\n  Installing : postgresql95-libs-9.5.6-5PGDG.rhel6.x86_64\n1/4\n\
    \  Installing : postgresql95-9.5.6-5PGDG.rhel6.x86_64\n2/4\n  Installing : postgresql95-server-9.5.6-5PGDG.rhel6.x86_64\n\
    3/4\n  Installing : postgresql95-contrib-9.5.6-5PGDG.rhel6.x86_64\n4/4\n  Verifying  : postgresql95-libs-9.5.6-5PGDG.rhel6.x86_64\n\
    1/4\n  Verifying  : postgresql95-server-9.5.6-5PGDG.rhel6.x86_64\n2/4\n  Verifying  : postgresql95-contrib-9.5.6-5PGDG.rhel6.x86_64\n\
    3/4\n  Verifying  : postgresql95-9.5.6-5PGDG.rhel6.x86_64\n4/4\nInstalled:\n  postgresql95.x86_64 0:9.5.6-5PGDG.rhel6\n\
    \  postgresql95-contrib.x86_64 0:9.5.6-5PGDG.rhel6\n  postgresql95-libs.x86_64 0:9.5.6-5PGDG.rhel6\n  postgresql95-server.x86_64\
    \ 0:9.5.6-5PGDG.rhel6\n15 | P a g e\nComplete!\nNote: The above-mentioned example is referenced as an illustration only.\
    \ The distro, and\nversion, varies according to one's requirements. Visit the Postgres community web portal\nfor more\
    \ information.\nIf the version of PostgreSQL installed is not 9.5.x, the packages may be uninstalled using\nthis command:\n\
    yum remove $(rpm -qa|grep postgres)\n17 | P a g e\nThe next recommendation \"1.3 Ensure Installation of Community Packages\"\
    \ describes how\nto explicitly choose which version of PostgreSQL to install, regardless of Linux distribution\nassociation.\n\
    Irrespective of package source, PostgreSQL services can be identified because it typically\nincludes the text string \"\
    postgresql\". Correct installs automatically register the service\nalthough it may still be off. Multiple instance of\
    \ postgres services often distinguish\nthemselves using a version number. Unregistered services must be added before its\n\
    runlevel can be administrated.\n$ chkconfig --add postgresql-9.5\n$ chkconfig --level 3 postgresql-9.5 on\n$ chkconfig\
    \ --list | grep postgres\npostgresql-9.5  0:off 1:off 2:off 3:on 4:off 5:off 6:off\n19 | P a g e\nAttempting to instantiate\
    \ a data cluster to an existing non-empty directory will fail:\n$ service postgresql-9.5 initdb\nData directory is not\
    \ empty!\n[root@pg1_centos ~]#                                       [FAILED]\nIn the case of a cluster instantiation\
    \ failure, one must delete/remove the entire data cluster\ndirectory and repeat the initdb command:\n$ rm -rf ~postgres/9.5\n\
    $ service postgresql-9.5 initdb\n22 | P a g e\n2 Directory and File Permissions\nThis section provides guidance on securing\
    \ all operating system specific objects for\nPostgreSQL.\n2.1 Ensure the file permissions mask is correct (Scored)\nDepending\
    \ upon the postgres user's environment, the umask is typically set in the\ninitialization file .bash_profile, but may\
    \ also be set in .profile or .bashrc. To set the\numask, add the following to the appropriate profile file:\numask 077\n\
    23 | P a g e\nIf the pg_wheel group does not exist, use the following command to create it:\n$ getent group pg_wheel ||\
    \ groupadd pg_wheel && getent group pg_wheel\npg_wheel:x:502:\nNote: that your system's group number may not be 502. That's\
    \ OK.\nAdding the postgres user to the newly created group is done by issuing:\n$ gpasswd -a postgres pg_wheel\nAdding\
    \ user postgres to group pg_wheel\n25 | P a g e\nRemoving a user account from the pg_wheel group is achieved by executing\
    \ the following\ncommand:\n$ gpasswd -d pg_wheel user1\nRemoving user user1 from group pg_wheel\n$ groups user1\nuser1\
    \ : user1"
  checks:
  - type: command
    command: '$ yum repolist all | grep enabled: && $ rpm -qa | grep postgres && $ chkconfig --list | grep postgres && ls
      -al ~postgres/9.5'
    expected: ''
    severity: medium
