- id: 3.1.34
  title: Ensure 'log_statement_stats' is disabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: 'Enabling the log_statement_stats setting causes cumulative performance statistics to be written to the server
    log for each query. This is a crude profiling instrument, similar to the Unix getrusage() operating system facility. This
    reports total statement statistics. Cumulative performance statistics logging is disabled (off) by default and should
    only be enabled if directed to do so by your organization''s logging policy. Note: log_statement_stats cannot be enabled
    together with any of the per-module options. The PostgreSQL Audit Extension (pgAudit) provides detailed session and/or
    object audit logging via the standard PostgreSQL logging facility. The goal of pgAudit is to provide PostgreSQL users
    with the capability to produce audit logs often required to comply with government, financial, or ISO certifications.
    It is common having more than one authorized individual administrating the PostgreSQL service. It is also quite common
    to permit login privileges to individuals on a PostgreSQL host who otherwise are not authorized to access the server''s
    data cluster and files. Administrating the PostgreSQL data cluster, as opposed to its data, is to be accomplished via
    a localhost login of a regular UNIX user account. Access to the postgres superuser account is restricted in such a manner
    as to interdict unauthorized access. sudo satisfies the requirements by escalating ordinary user account privileges as
    the PostgreSQL RDBMS superuser. Valid SSH public/private key pairs should be installed. With respect to PostgreSQL administrative
    SQL commands, only superusers should have elevated privileges. PostgreSQL regular or application users should not possess
    the ability to create roles, create new databases, manage replication, or perform any other action deemed privileged for
    a superuser account. Typically, regular users should only be granted the minimal set of privileges commensurate with managing
    the application: • DDL (create table, create view, create index, etc.) • DML (select, insert, update, delete) In certain
    situations, to provide required functionality, PostgreSQL needs to execute internal logic (stored procedures, functions,
    triggers, etc.) and/or external code modules with elevated privileges. However, if the privileges required for execution
    are at a higher level than the privileges assigned to organizational users invoking the functionality applications/programs,
    those users are indirectly provided with greater privileges than assigned by their organization. This is known as privilege
    elevation. Privilege elevation must be utilized only where necessary. Execute privileges for application functions should
    be restricted to authorized users only. DML (insert, update, delete) operations at the table level should be restricted
    to only authorized users. PostgreSQL manages table level DML permissions via the GRANT statement. In addition to the SQL-standard
    privilege system available through GRANT, tables can have row security policies that restrict, on a per-user basis, which
    individual rows can be returned by normal queries or inserted, updated, or deleted by data modification commands. This
    feature is also known as Row Level Security (RLS). By default, tables do not have any policies, so if a user has access
    privileges to a table according to the SQL privilege system, all rows within it are equally available for querying or
    updating. Row security policies can be specific to commands, to roles, or to both. A policy can be specified to apply
    to ALL commands, or to any combination of SELECT, INSERT, UPDATE, or DELETE. Multiple roles can be assigned to a given
    policy, and normal role membership and inheritance rules apply. If you use RLS and apply restrictive policies to certain
    users, it is important that the Bypass RLS privilege not be granted to any unauthorized users. This privilege overrides
    RLSenabled tables and associated policies. Generally, only superusers and elevated users should possess this privilege.
    A remote host login, via ssh, is arguably the most secure means of remotely accessing and administrating the Postgres
    server. Connecting with the psql CLI, via UNIX DOMAIN SOCKETS, using the peer METHOD is the most secure mechanism available
    for local connections. Provided a database user account of the same name of the UNIX account has already been defined
    in the database, even ordinary user accounts can access the cluster in a similarly highly secure manner. A large number
    of authentication METHODs are available for hosts connecting using TCP/IP sockets, including: • trust • reject • md5 •
    password • gss • sspi • ident • pam • ldap • radius • cert METHODs trust, password, and ident are not to be used for remote
    logins. METHOD md5 is the most popular and can be used either in both encrypted and unencrypted sessions. Use of the gss,
    sspi, pam, ldap, radius, and cert METHODs are dependent upon the availability of external authenticating processes/services.
    Understanding the vulnerability of postgres runtime parameters by the particular delivery method, or attack vector. In
    order to serve multiple clients efficiently, the PostgreSQL server launches a new "backend" process for each client. A
    new child process is created immediately after an incoming connection is detected. The runtime parameters in this benchmark
    are controlled by the backend process. The server''s performance, in the form of slow queries causing a denial of service,
    and the RDBM''s auditing abilities for determining root cause analysis can be compromised. PostgreSQL runtime parameters
    that are executed by the postmaster process. PostgreSQL runtime parameters that are executed by the SIGHUP signal. PostgreSQL
    runtime parameters that can only be executed by the server''s superuser, which is traditionally postgres. These PostgreSQL
    runtime parameters are managed by the user account (ROLE). SSL on a PostgreSQL server should be enabled (set to on) and
    configured to encrypt TCP traffic to and from the server. Install, configure and use OpenSSL on a platform that has a
    NIST certified FIPS 140-2 installation of OpenSSL. This provides PostgreSQL instances the ability to generate and validate
    cryptographic hashes to protect unclassified information requiring confidentiality and cryptographic protection, in accordance
    with the data owner''s requirements. PostgreSQL must implement cryptographic mechanisms to prevent unauthorized disclosure
    or modification of organization-defined information at rest (to include, at a minimum, PII and classified information)
    on organization-defined information system components. Creating and managing SSL certificates on the PRIMARY and STANDBY
    host(s). A base backup is a copy of the PRIMARY host''s data cluster and is used to create STANDBY hosts and Point In
    Time Recovery mechanisms. Base backups should be copied across networks in a secure manner using an encrypted transport
    mechanism. CLI examples includes scp, sftp and rsync -e ssh. Alternatively, the CLI cp can be used with an SSLenabled
    implementation of an NFS mount point, or the PostgreSQL CLI pg_basebackup can be used. However, SSL encryption should
    be enabled on the server. Beware it is possible to use this utility without SSL encryption enabled. Write Ahead Log (WAL)
    Archiving, or Log Shipping, is the process of sending transaction log files from the PRIMARY host either to one or more
    STANDBY hosts or to be archived on a remote storage device for later use, i.e. PITR. There are several utilities that
    can copy WALs including, but not limited to, cp, scp, sftp, and rynsc. Basically, the server follows a set of runtime
    parameters which defines when the WAL should be copied using one of the aforementioned utilities. Streaming replication
    from a PRIMARY host transmits sensitive passwords, DDL, and DML activities as well as other sensitive data. These connections
    should be protected with Secure Sockets Layer (SSL). PostgreSQL configuration files within the data cluster''s directory
    tree can be changed by anyone logging into the data cluster as the superuser, i.e. postgres. As a matter of default policy,
    configuration files such as postgresql.conf, pg_hba.conf, and pg_ident, are placed in the data cluster''s directory, $PGDATA.
    PostgreSQL can be configured to relocate these files to locations outside the data cluster which cannot then be accessed
    by an ordinary superuser login session. Consideration should also be given to "include directives"; these are cluster
    subdirectories where one can locate files containing additional configuration parameters. Include directives are meant
    to add more flexibility for unique installs in a much large network environment while maintaining order and consistent
    architectural design. The PostgreSQL cluster is organized to carry out specific tasks in subdirectories. For the purposes
    of performance, reliability, and security, these subdirectories should be relocated outside the data cluster. pgBackRest
    aims to be a simple, reliable backup and restore system that can seamlessly scale up to the largest databases and workloads.
    Instead of relying on traditional backup tools like tar and rsync, pgBackRest implements all backup features internally
    and uses a custom protocol for communicating with remote systems. Removing reliance on tar and rsync allows for better
    solutions to database-specific backup challenges. The custom remote protocol allows for more flexibility and limits the
    types of connections that are required to perform a backup which increases security. This recommendation covers non-regular,
    special files, and dynamic libraries. PostgreSQL permits local logins via the UNIX DOMAIN SOCKET and, for the most part,
    anyone with a legitimate Unix login account can make the attempt. Limiting PostgreSQL login attempts can be made by relocating
    the UNIX DOMAIN SOCKET to a subdirectory with restricted permissions. The creation and implementation of user-defined
    dynamic libraries is an extraordinary powerful capability. In the hands of an experienced DBA/programmer, it can significantly
    enhance the power and flexibility of the RDBMS. But new and unexpected behavior can also be assigned to the RDBMS, resulting
    in a very dangerous environment in what should otherwise be trusted.'
  rationale: 'The logging of these additional statistics when not mandated by your organization''s logging policy greatly
    reduces the signal-to-noise ratio of the PostgreSQL logs. Basic statement logging can be provided by the standard logging
    facility with log_statement = all. This is acceptable for monitoring and other uses but does not provide the level of
    detail generally required for an audit. It is not enough to have a list of all the operations performed against the database,
    it must also be possible to find particular statements that are of interest to an auditor. The standard logging facility
    shows what the user requested, while pgAudit focuses on the details of what happened while the database was satisfying
    the request. When logging SELECT and DML statements, pgAudit can be configured to log a separate entry for each relation
    referenced in a statement. No parsing is required to find all statements that touch a particular table. In fact, the goal
    is that the statement text is provided primarily for deep forensics and should not be required for an audit. Without sudo,
    there would not be capabilities to strictly control access to the superuser account and to securely and authoritatively
    audit its use. The most secure mechanism for management is to log in locally into the UNIX account that controls and maintains
    the server''s environment with an SSH key and use the Command Line Interface (CLI) psql. SSH keys have other advantages
    too; it is simple to add and remove user authorization, it eliminates the redundant typing of passwords, and it enables
    administrating large number of servers from a centralized host using simple CLI scripts. By not restricting global administrative
    commands to superusers only, regular users granted excessive privileges may execute administrative commands with unintended
    and undesirable results. Ideally, all application source code should be vetted to validate interactions between the application
    and the logic in the database, but this is usually not possible or feasible with available resources even if the source
    code is available. The DBA should attempt to obtain assurances from the development organization that this issue has been
    addressed and should document what has been discovered. The DBA should also inspect all application logic stored in the
    database (in the form of functions, rules, and triggers) for excessive privileges. Excessive DML grants can lead to unprivileged
    users changing or deleting information without proper authorization. If RLS policies and privileges are not configured
    correctly, users could perform actions on tables that they are not authorized to perform, such as inserting, updating,
    or deleting rows. There are as many ways of compromising a server as there are runtime parameters. A combination of any
    one or more of them executed at the right time under the right conditions has the potential to compromise the RDBMS. Mitigating
    risk is dependent upon one''s understanding of the attack vectors and includes: 1. Via user session: includes those runtime
    parameters that can be set by a ROLE that persists for the life of a server-client session. 2. Via attribute: includes
    those runtime parameters that can be set by a ROLE during a server-client session that can be assigned as an attribute
    for an entity such as table, index, database, or role. 3. Via server reload: includes those runtime parameters that can
    be set by the superuser using a SIGHUP or configuration file reload command and affects the entire cluster. 112 | P a
    g e 4. Via server restart: includes those runtime parameters that can be set and effected by restarting the server process
    and affects the entire cluster. A denial of service is possible by denying the use of indexes and by slowing down client
    access to an unreasonable level. Unsanctioned behavior can be introduced by introducing rogue libraries which can then
    be called in a database session. Logging can be altered and obfuscated inhibiting root cause analysis. The postmaster,
    or postgres, process, is the supervisory process that assigns a backend process to an incoming client connection. The
    postmaster manages key runtime parameters that are either shared by all backend connections or needed by the postmaster
    process itself to run. In order to define server behavior and optimize server performance, the server''s superuser has
    the privilege of setting these parameters which are found in the configuration files postgresql.conf and pg_hba.conf.
    Alternatively, those parameters found in postgresql.conf can also be changed using server login session and executing
    the SQL command ALTER SYSTEM which writes its changes in the configuration file postgresql.auto.conf. In order to improve
    and optimize server performance, the server''s superuser has the privilege of setting these parameters which are found
    in the configuration file postgresql.conf. Alternatively, they can be changed in a PostgreSQL login session via the SQL
    command ALTER SYSTEM which writes its changes in the configuration file postgresql.auto.conf. In order to improve performance
    and optimize features, a ROLE has the privilege of setting numerous parameters either in a transaction, session or as
    an entity attribute. Any ROLE can alter any of these parameters If SSL is not enabled and configured correctly, this increases
    the risk of data being compromised in transit. Federal Information Processing Standard (FIPS) Publication 140-2 is a computer
    security standard developed by a U.S. Government and industry working group for validating the quality of cryptographic
    modules. Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    Postgres uses OpenSSL for the underlying encryption layer. The database and application must implement cryptographic modules
    adhering to the higher standards approved by the federal government since this provides assurance they have been tested
    and validated. It is the responsibility of the data owner to assess the cryptography requirements in light of applicable
    federal laws, Executive Orders, directives, policies, regulations, and standards. For detailed information, refer to NIST
    FIPS Publication 140-2, Security Requirements for Cryptographic Modules. Note that the product''s cryptographic modules
    must be validated and certified by NIST as FIPS-compliant. The security functions validated as part of FIPS 140-2 for
    cryptographic modules are described in FIPS 140-2 Annex A. Currently only Red Hat Enterprise Linux is certified as a FIPS
    140-2 distribution of OpenSSL. For other operating systems, users must obtain or build their own FIPS 140-2 OpenSSL libraries.
    PostgreSQL handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized
    disclosure and modification of the information at rest. These cryptographic mechanisms may be native to PostgreSQL or
    implemented via additional software or operating system/file system settings, as appropriate to the situation. Information
    at rest refers to the state of information when it is located on a secondary storage device (e.g. disk drive, tape drive)
    within an organizational information system. Selection of a cryptographic mechanism is based on the need to protect the
    integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or
    classification of the information. Organizations have the flexibility to either encrypt all information on storage devices
    (i.e. full disk encryption) or encrypt specific data structures (e.g. files, records, or fields). The decision whether,
    and what, to encrypt rests with the data owner and is also influenced by the physical measures taken to secure the equipment
    and media on which the information resides. Organizations may choose to employ different mechanisms to achieve confidentiality
    and integrity protections, as appropriate. If the confidentiality and integrity of application data is not protected,
    the data will be open to compromise and unauthorized modification. The PostgreSQL pgcrypto extension provides cryptographic
    functions for PostgreSQL and is intended to address the confidentiality and integrity of user and system information at
    rest in non-mobile devices. 135 | P a g e Secure Sockets Layer (SSL) certificates enable encrypted communications between
    the PRIMARY and STANDBY hosts. SSL certificates can also be used to authenticate the identity of the host. The use of
    SSL certificates mitigates against sniffing of what would otherwise be sensitive information that''s being transmitted
    in the clear. Unless the server has been correctly configured, one runs the risk of sending WALs in an unsecured, unencrypted
    fashion. Unencrypted transmissions could reveal sensitive information to unauthorized parties. Unauthenticated connections
    could enable man-in-the-middle attacks. Leaving PostgreSQL configuration files within the data cluster''s directory tree
    increases the changes that they will be inadvertently or intentionally altered. Some subdirectories contain information,
    such as logs, which can be of value to others such as developers. Other subdirectories can gain a performance benefit
    when placed on fast storage devices. Finally, relocating a subdirectory to a separate and distinct partition mitigates
    denial of service and involuntary server shutdown when excessive writes fill the data cluster''s partition, e.g., pg_xlog
    and pg_log. The native PostgreSQL backup facility pg_dump provides adequate logical backup operations but does not provide
    for Point In Time Recovery (PITR). The PostgreSQL facility pg_basebackup performs physical backup of the database files
    and does provide for PITR, but it is constrained by single threading. Both of these methodologies are standard in the
    PostgreSQL ecosystem and appropriate for particular backup/recovery needs. pgBackRest offers another option with much
    more robust features and flexibility. pgBackRest is open source software developed to perform efficient backup on PostgreSQL
    databases that measure in tens of terabytes and greater. It supports per file checksums, compression, partial/failed backup
    resume, high-performance parallel transfer, asynchronous archiving, tablespaces, expiration, full/differential/incremental,
    local/remote operation via SSH, hard-linking, restore, and more. pgBackRest is written in Perl and does not depend on
    rsync or tar but instead performs its own deltas which gives it maximum flexibility. Finally, pgBackRest provides an easy
    to use internal repository listing backup details accessible via the pgbackrest info command, as illustrated below. $
    pgbackrest info stanza: proddb01 status: ok db (current) wal archive min/max (9.5-1): 00000008000098E000000036 / 0000000800009953000000BB
    full backup: 20171028-080001F 152 | P a g e timestamp start/stop: 2017-10-28 08:00:01 / 2017-10-28 12:04:21 wal start/stop:
    00000008000098E000000036 / 00000008000098E100000076 database size: 2218.1GB, backup size: 2218.1GB repository size: 417.3GB,
    repository backup size: 417.3GB full backup: 20171104-080001F timestamp start/stop: 2017-11-04 08:00:01 / 2017-11-04 12:20:00
    wal start/stop: 0000000800009934000000B9 / 000000080000993600000008 database size: 2225.6GB, backup size: 2225.6GB repository
    size: 418.8GB, repository backup size: 418.8GB'
