      11 | P a g e

      $ yum repolist all | grep enabled:

      base                    CentOS-6 - Base                 enabled: 6,696

      extras                  CentOS-6 - Extras               enab'
- id: 3.1.2
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: PostgreSQL supports several methods for logging server messages, including stderr, csvlog and syslog. On Windows,
    eventlog is also supported. One or more of these destinations should be set for server log output.
  rationale: If log_destination is not set, then any log messages generated by the core PostgreSQL processes will be lost.
    27 | P a g e
  impact: ''
  references: []
  page_start: 27
  audit_raw: "Execute the following SQL statement to view the log destinations:\npostgres=# show log_destination;\n log_destination\n\
    -----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's policies on logging.\
    \ If all the\nexpected log destinations are not set, this is a finding."
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example, setting\nthe log destination\
    \ to csvlog):\npostgres=# alter system set log_destination = 'csvlog';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\nNote: If more than one log destination is to be used, set this parameter\
    \ to a list of desired\nlog destinations separated by commas."
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute the following SQL statement to view the log destinations:\npostgres=# show log_destination;\n log_destination\n\
      -----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's policies on logging.\
      \ If all the\nexpected log destinations are not set, this is a finding."
- id: 3.1.3
  title: Ensure the logging collector is enabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: The logging collector is a background process that captures log messages sent to stderr and redirects them
    into log files. The logging_collector setting must be enabled in order for this process to run. It can only be set at
    server start.
  rationale: 'The logging collector approach is often more useful than logging to syslog, since some types of messages might
    not appear in syslog output. One common example is dynamic-linker failure message; another may be error messages produced
    by scripts such as archive_command. Note: This setting must be enabled for certain other logging parameters to take effect.'
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Execute the following SQL statement and confirm that the logging_collector is enabled (on):\npostgres=# show\
    \ logging_collector;\n logging_collector\n-------------------\n on\n(1 row)"
  remediation: 'Execute the following SQL statement(s) to remediate this setting:

    postgres=# alter system set logging_collector = ''on'';

    ALTER SYSTEM

    As root, restart the PostgreSQL service for this change to take effect:

    $ # service postgresql-9.5 restart

    Stopping postgresql-9.5 service:                           [  OK  ]

    Starting postgresql-9.5 service:                           [  OK  ]'
  checks:
  - type: sql
    command: show logging_collector;
    severity: medium
    info: "Execute the following SQL statement and confirm that the logging_collector is enabled (on):\npostgres=# show logging_collector;\n\
      \ logging_collector\n-------------------\n on\n(1 row)"
- id: 3.1.4
  title: Ensure the log file destination directory is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: The log_directory setting specifies the destination directory for log files. It can be specified as relative
    to the cluster data directory or as an absolute path. log_directory should be set according to your organization's logging
    policy.
  rationale: If log_directory is not set, it is interpreted as the absolute path '/' and PostgreSQL will attempt to write
    its logs there (and typically fail due to a lack of permissions to that directory).
  impact: ''
  references: []
  page_start: 31
  audit_raw: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=#\
    \ show log_directory;\n log_directory\n---------------\n pg_log\n(1 row)\nNote: This shows a path relative to cluster's\
    \ data directory. An absolute path would start\nwith a / like the following: /var/log/pg_log"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_directory='logs';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_directory;
    severity: medium
    info: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=# show\
      \ log_directory;\n log_directory\n---------------\n pg_log\n(1 row)\nNote: This shows a path relative to cluster's data\
      \ directory. An absolute path would start\nwith a / like the following: /var/log/pg_log"
- id: 3.1.5
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: The log_filename setting specifies the filename pattern for log files. The value for log_filename should match
    your organization's logging policy. The value is treated as a strftime pattern, so %-escapes can be used to specify timevarying
    filenames. The supported %-escapes are similar to those listed in the Open Group's strftime specification. If you specify
    a filename without escapes, you should plan to use a log rotation utility to avoid eventually filling the partition that
    contains log_directory. If there are any time-zone-dependent %-escapes, the computation is done in the zone specified
    by log_timezone. Also, the system's strftime is not used directly, so platformspecific (nonstandard) extensions do not
    work. If CSV-format output is enabled in log_destination, .csv will be appended to the log filename. (If log_filename
    ends in .log, the suffix is replaced instead.)
  rationale: If log_filename is not set, then the value of log_directory is appended to an empty string and PostgreSQL will
    fail to start as it will try to write to a directory instead of a file.
  impact: ''
  references:
  - 1. http://man7.org/linux/man-pages/man3/strftime.3.html
  page_start: 33
  audit_raw: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
    \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\n33 | P a g e"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_filename='postgresql-%Y%m%d.log';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
      \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\n33 | P a g e"
- id: 3.1.6
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL on Linux
  description: The log_file_mode setting determines the file permissions for log files when logging_collector is enabled.
    The parameter value is expected to be a numeric mode specification in the form accepted by the chmod and umask system
    calls. (To use the customary octal format, the number must start with a 0 (zero).) The permissions should be set to allow
    only the necessary access to authorized personnel. In most cases the best setting is 0600, so that only the server owner
    can read or write the log files. The other commonly useful setting is 0640, allowing members of the owner's group to read
    the files, although to make use of that, you will need to alter the log_directory setting to store the log files outside
    the cluster data directory.
  rationale: Log files often contain sensitive data. Allowing unnecessary access to log files may inadvertently expose sensitive
    data to unauthorized personnel.
  impact: ''
  references: []
  page_start: 35
  audit_raw: "Execute the following SQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
    postgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (with the example\nassuming a desired value\
    \ of 0600):\npostgres=# alter system set log_file_mode = '0600';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
