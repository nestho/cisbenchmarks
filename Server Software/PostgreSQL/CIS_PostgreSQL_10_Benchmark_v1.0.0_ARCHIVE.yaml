    of limited resources, such as RAM. Changing VACUUM parameters can force a server shutdown which is standard procedure
    preventing data corruption from transaction ID wraparound. Data can be corrupted by changing parameters to reinterpret
    values in an unexpected fashion, e.g. changing the time zone. Logging can be altered and obfuscated to inhibit root cause
    analysis. A self-signed certificate can be used for testing, but a certificate signed by a certificate authority (CA)
    (either one of the global CAs or a local one) should be used in production so that clients can verify the server''s identity.
    If all the database clients are local to the organization, using a local CA is recommended. To ultimately enable and enforce
    ssl authentication for the server, appropriate hostssl records must be added to the pg_hba.conf file. Be sure to reload
    PostgreSQL after any changes (restart not required). Note: The hostssl record matches connection attempts made using TCP/IP,
    but only when the connection is made with SSL encryption. The host record matches attempts made using TCP/IP, but allows
    both SSL and non-SSL connections. The hostnossl record matches attempts made using TCP/IP, but only those without SSL.
    Care should be taken to enforce SSL as appropriate. When considering or undertaking any form of encryption, it is critical
    to understand the state of the encrypted data at all stages of the data lifecycle. The use of pgcrypto ensures that the
    data at rest in the tables (and therefore on disk) is encrypted, but for the data to be accessed by any users or applications,
    said users/applications will, by necessity, have access to the encrypt and decrypt keys and the data in question will
    be encrypted/decrypted in memory and then transferred to/from the user/application in that form. 147 | P a g e'
