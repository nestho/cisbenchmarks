controls:
- id: 3.1.2
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - Level 1 – PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: PostgreSQL supports several methods for logging server messages, including stderr, csvlog and syslog. On Windows,
    eventlog is also supported. One or more of these destinations should be set for server log output.
  rationale: If log_destination is not set, then any log messages generated by the core PostgreSQL processes will be lost.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 30
  audit_raw: "Execute the following SQL statement to view the currently active log destinations:\npostgres=# show log_destination;\n\
    \ log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's policies\
    \ on logging. If all the\nexpected log destinations are not set, this is a fail."
  remediation: "Execute the following SQL statements to remediate this setting (in this example, setting the\nlog destination\
    \ to csvlog):\npostgres=# alter system set log_destination = 'csvlog';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\nNote: If more than one log destination is to be used, set this parameter\
    \ to a list of desired\nlog destinations separated by commas (e.g. 'csvlog, stderr').\n30 | P a g e\n31 | P a g e"
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute the following SQL statement to view the currently active log destinations:\npostgres=# show log_destination;\n\
      \ log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with your organization's\
      \ policies on logging. If all the\nexpected log destinations are not set, this is a fail."
- id: 3.1.3
  title: Ensure the logging collector is enabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The logging collector is a background process that captures log messages sent to stderr and redirects them
    into log files. The logging_collector setting must be enabled in order for this process to run. It can only be set at
    server start.
  rationale: 'The logging collector approach is often more useful than logging to syslog, since some types of messages might
    not appear in syslog output. One common example is dynamiclinker failure message; another may be error messages produced
    by scripts such as archive_command. Note: This setting must be enabled when log_destination is either ''stderr'' or ''csvlog''
    and for certain other logging parameters to take effect.'
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 33
  audit_raw: "Execute the following SQL statement and confirm that the logging_collector is enabled\n(on):\npostgres=# show\
    \ logging_collector;\n logging_collector\n-------------------\n on\n(1 row)"
  remediation: 'Execute the following SQL statement(s) to remediate this setting:

    postgres=# alter system set logging_collector = ''on'';

    ALTER SYSTEM

    Unfortunately, this setting can only be changed at server (re)start. As root, restart the

    PostgreSQL service for this change to take effect:

    33 | P a g e

    $ service postgresql-9.6 restart

    Stopping postgresql-9.6 service:                           [  OK  ]

    Starting postgresql-9.6 service:                           [  OK  ]'
  checks:
  - type: sql
    command: show logging_collector;
    severity: medium
    info: "Execute the following SQL statement and confirm that the logging_collector is enabled\n(on):\npostgres=# show logging_collector;\n\
      \ logging_collector\n-------------------\n on\n(1 row)"
- id: 3.1.4
  title: Ensure the log file destination directory is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_directory setting specifies the destination directory for log files when log_destination is stderr
    or csvlog. It can be specified as relative to the cluster data directory ($PGDATA) or as an absolute path. log_directory
    should be set according to your organization's logging policy.
  rationale: If log_directory is not set, it is interpreted as the absolute path '/' and PostgreSQL will attempt to write
    its logs there (and typically fail due to a lack of permissions to that directory). This parameter should be set to direct
    the logs into the appropriate directory location as defined by your organization's logging policy.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 35
  audit_raw: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=#\
    \ show log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote: This shows a path relative to cluster's data\
    \ directory. An absolute path would start\nwith a / like the following: /var/log/pg_log"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_directory='logs';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show log_directory;\n\
    35 | P a g e\n log_directory\n---------------\n logs\n(1 row)\nNote: The use of logs, above, is an example. This should\
    \ be set to an appropriate path as\ndefined by your organization's logging requirements."
  checks:
  - type: sql
    command: show log_directory;
    severity: medium
    info: "Execute the following SQL statement to confirm that the expected logging directory is\nspecified:\npostgres=# show\
      \ log_directory;\n log_directory\n---------------\n log\n(1 row)\nNote: This shows a path relative to cluster's data\
      \ directory. An absolute path would start\nwith a / like the following: /var/log/pg_log"
- id: 3.1.5
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_filename setting specifies the filename pattern for log files. The value for log_filename should match
    your organization's logging policy. The value is treated as a strftime pattern, so %-escapes can be used to specify timevarying
    filenames. The supported %-escapes are similar to those listed in the Open Group's strftime specification. If you specify
    a filename without escapes, you should plan to use a log rotation utility to avoid eventually filling the partition that
    contains log_directory. If there are any time-zone-dependent %-escapes, the computation is done in the zone specified
    by log_timezone. Also, the system's strftime is not used directly, so platformspecific (nonstandard) extensions do not
    work. If CSV-format output is enabled in log_destination, .csv will be appended to the log filename. (If log_filename
    ends in .log, the suffix is replaced instead.)
  rationale: If log_filename is not set, then the value of log_directory is appended to an empty string and PostgreSQL will
    fail to start as it will try to write to a directory instead of a file.
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man3/strftime.3.html
  - 2. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 37
  audit_raw: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
    \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote: This example shows the use of the strftime %a\
    \ escape. This creates seven logfiles,\none for each day of the week (e.g. postgresql-Mon.log, postgresql-Tue.log, et\
    \ al)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\n37 | P a g e\npostgres=# alter system set\
    \ log_filename='postgresql-%Y%m%d.log';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n\
    \ t\n(1 row)\npostgres=# show log_filename;\n   log_filename\n-------------------\n postgresql-%Y%m%d.log\n(1 row)\nNote:\
    \ In this example, a new logfile will be created for each day (e.g. postgresql20180901.log)"
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute the following SQL statement to confirm that the desired pattern is set:\npostgres=# show log_filename;\n\
      \   log_filename\n-------------------\n postgresql-%a.log\n(1 row)\nNote: This example shows the use of the strftime\
      \ %a escape. This creates seven logfiles,\none for each day of the week (e.g. postgresql-Mon.log, postgresql-Tue.log,\
      \ et al)"
- id: 3.1.6
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_file_mode setting determines the file permissions for log files when logging_collector is enabled.
    The parameter value is expected to be a numeric mode specification in the form accepted by the chmod and umask system
    calls. (To use the customary octal format, the number must start with a 0 (zero).) The permissions should be set to allow
    only the necessary access to authorized personnel. In most cases the best setting is 0600, so that only the server owner
    can read or write the log files. The other commonly useful setting is 0640, allowing members of the owner's group to read
    the files, although to make use of that, you will need to alter the log_directory setting to store the log files outside
    the cluster data directory.
  rationale: Log files often contain sensitive data. Allowing unnecessary access to log files may inadvertently expose sensitive
    data to unauthorized personnel.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 39
  audit_raw: "Execute the following SQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
    postgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (with the example\nassuming a desired value\
    \ of 0600):\npostgres=# alter system set log_file_mode = '0600';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n39 | P a g e\n t\n(1 row)\npostgres=# show log_file_mode;\n log_file_mode\n---------------\n\
    \ 0600\n(1 row)"
  checks:
  - type: sql
    command: show log_file_mode;
    severity: medium
    info: "Execute the following SQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
      postgres=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
- id: 3.1.7
  title: Ensure 'log_truncate_on_rotation' is enabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'Enabling the log_truncate_on_rotation setting when logging_collector is enabled causes PostgreSQL to truncate
    (overwrite) existing log files with the same name during log rotation instead of appending to them. For example, using
    this setting in combination with a log_filename setting value like postgresql-%H.log would result in generating 24 hourly
    log files and then cyclically overwriting them: postgresql-00.log postgresql-01.log [...] postgresql-23.log Note: Truncation
    will occur only when a new file is being opened due to time-based rotation, not during server startup or size-based rotation
    (see later in this benchmark for size-based rotation details).'
  rationale: 'If this setting is disabled, pre-existing log files will be appended to if log_filename is configured in such
    a way that static names are generated. Enabling or disabling the truncation should only be decided when also considering
    the value of log_filename and log_rotation_age/log_rotation_size. Some examples to illustrate the interaction between
    these settings: # truncation is moot, as each rotation gets a unique filename (postgresql20180605.log) log_truncate_on_rotation
    = on log_filename = ''postgresql-%Y%m%d.log'' log_rotation_age = ''1d'' log_rotation_size = 0 # truncation every hour,
    losing log data every hour until the date changes log_truncate_on_rotation = on log_filename = ''postgresql-%Y%m%d.log''
    log_rotation_age = ''1h'' log_rotation_size = 0 41 | P a g e # no truncation if the date changed while generating 100M
    of log data, truncation otherwise log_truncate_on_rotation = on log_filename = ''postgresql-%Y%m%d.log'' log_rotation_age
    = ''0'' log_rotation_size = ''100M'''
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 41
  audit_raw: "Execute the following SQL statement to verify how log_truncate_on_rotation is set:\npostgres=# show log_truncate_on_rotation;\n\
    \ log_truncate_on_rotation\n--------------------------\n off\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set log_truncate_on_rotation\
    \ = 'on';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)\npostgres=#\
    \ show log_truncate_on_rotation;\n log_truncate_on_rotation\n--------------------------\n on\n(1 row)"
  checks:
  - type: sql
    command: show log_truncate_on_rotation;
    severity: medium
    info: "Execute the following SQL statement to verify how log_truncate_on_rotation is set:\npostgres=# show log_truncate_on_rotation;\n\
      \ log_truncate_on_rotation\n--------------------------\n off\n(1 row)"
- id: 3.1.8
  title: Ensure the maximum log file lifetime is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: When logging_collector is enabled, the log_rotation_age parameter determines the maximum lifetime of an individual
    log file (depending on the value of log_filename). After this many minutes have elapsed, a new log file will be created
    via automatic log file rotation. Current best practices advise log rotation at least daily, but your organization's logging
    policy should dictate your rotation schedule.
  rationale: Log rotation is a standard best practice for log management.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 44
  audit_raw: "Execute the following SQL statement to verify the log rotation age is set to an acceptable\nvalue:\npostgres=#\
    \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example, setting it\nto one hour):\n\
    postgres=# alter system set log_rotation_age='1h';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_rotation_age;
    severity: medium
    info: "Execute the following SQL statement to verify the log rotation age is set to an acceptable\nvalue:\npostgres=#\
      \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d"
- id: 3.1.9
  title: Ensure the maximum log file size is set correctly
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The log_rotation_size setting determines the maximum size of an individual log file. Once the maximum size
    is reached, automatic log file rotation will occur.
  rationale: If this is set to zero, size-triggered creation of new log files is disabled. This will prevent automatic log
    file rotation when files become too large, which could put log data at increased risk of loss (unless age-based rotation
    is configured).
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 46
  audit_raw: "Execute the following SQL statement to verify that log_rotation_size is set in compliance\nwith the organization's\
    \ logging policy:\npostgres=# show log_rotation_size;\n log_rotation_size\n-------------------\n 1GB\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example, setting it\nto 1GB):\n\
    postgres=# alter system set log_rotation_size = '1GB';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_rotation_size;
    severity: medium
    info: "Execute the following SQL statement to verify that log_rotation_size is set in compliance\nwith the organization's\
      \ logging policy:\npostgres=# show log_rotation_size;\n log_rotation_size\n-------------------\n 1GB\n(1 row)"
- id: 3.1.10
  title: Ensure the correct syslog facility is selected
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The syslog_facility setting specifies the syslog "facility" to be used when logging to syslog is enabled.
    You can choose from any of the ''local'' facilities: • LOCAL0 • LOCAL1 • LOCAL2 • LOCAL3 • LOCAL4 • LOCAL5 • LOCAL6 •
    LOCAL7 Your organization''s logging policy should dictate which facility to use based on the syslog daemon in use.'
  rationale: If not set to the appropriate facility, the PostgreSQL log messages may be intermingled with other applications'
    log messages, incorrectly routed, or potentially dropped (depending on your syslog configuration).
  impact: ''
  references:
  - 1. https://tools.ietf.org/html/rfc3164#section-4.1.1
  - 2. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 48
  audit_raw: "Execute the following SQL statement and verify that the correct facility is selected:\npostgres=# show syslog_facility;\n\
    \ syslog_facility\n-----------------\n local0\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example, setting it\nto the LOCAL1\
    \ facility):\n48 | P a g e\npostgres=# alter system set syslog_facility = 'LOCAL1';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show syslog_facility;
    severity: medium
    info: "Execute the following SQL statement and verify that the correct facility is selected:\npostgres=# show syslog_facility;\n\
      \ syslog_facility\n-----------------\n local0\n(1 row)"
- id: 3.1.11
  title: Ensure the program name for PostgreSQL syslog messages is correct
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The syslog_ident setting specifies the program name used to identify PostgreSQL messages in syslog logs. An
    example of a possible program name is "postgres". The log_min_messages setting specifies the message levels that are written
    to the server log. Each level includes all the levels that follow it. The later the level, the fewer messages are sent.
    Valid values are: • DEBUG5 • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING • ERROR • LOG • FATAL • PANIC
    WARNING is considered the best practice unless indicated otherwise by your organization''s logging policy.'
  rationale: If this is not set correctly, it may be difficult or impossible to distinguish PostgreSQL messages from other
    messages in syslog logs. If this is not set to the correct value, too many messages or too few messages may be written
    to the server log.
  impact: ''
  references:
  - 1. https://tools.ietf.org/html/rfc3164#section-4.1.3
  - 2. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 50
  audit_raw: "Execute the following SQL statement to verify the program name is set correctly:\npostgres=# show syslog_ident;\n\
    \ syslog_ident\n--------------\n postgres\n(1 row)\nExecute the following SQL statement to confirm the setting is correct:\n\
    postgres=# show log_min_messages;\n log_min_messages\n------------------\n warning\n(1 row)\n52 | P a g e"
  remediation: "Execute the following SQL statement(s) to remediate this setting (in this example,\nassuming a program name\
    \ of \"pg96\"):\npostgres=# alter system set syslog_ident = 'pg96';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)\npostgres=# show syslog_ident;\n syslog_ident\n--------------\n pg96\n\
    (1 row)\nExecute the following SQL statement(s) as superuser to remediate this setting (in this\nexample, to set it to\
    \ warning):\npostgres=# alter system set log_min_messages = 'warning';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n\
    \ pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show syslog_ident;
    severity: medium
    info: "Execute the following SQL statement to verify the program name is set correctly:\npostgres=# show syslog_ident;\n\
      \ syslog_ident\n--------------\n postgres\n(1 row)\nExecute the following SQL statement to confirm the setting is correct:\n\
      postgres=# show log_min_messages;\n log_min_messages\n------------------\n warning\n(1 row)\n52 | P a g e"
- id: 3.1.13
  title: Ensure the correct SQL statements generating errors are recorded
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: 'The log_min_error_statement setting causes all SQL statements generating errors at or above the specified
    severity level to be recorded in the server log. Each level includes all the levels that follow it. The later the level,
    the fewer messages are recorded. Valid values are: • DEBUG5 • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING
    • ERROR • LOG • FATAL • PANIC Note: To effectively turn off logging of failing statements, set this parameter to PANIC.
    ERROR is considered the best practice setting. Changes should only be made in accordance with your organization''s logging
    policy.'
  rationale: If this is not set to the correct value, too many erring SQL statements or too few erring SQL statements may
    be written to the server log.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/10/static/runtime-config-logging.html
  page_start: 54
  audit_raw: "Execute the following SQL statement to verify the setting is correct:\n54 | P a g e\npostgres=# show log_min_error_statement;\n\
    \ log_min_error_statement\n-------------------------\n error\n(1 row)"
  remediation: "Execute the following SQL statement(s) as superuser to remediate this setting (in the\nexample, to error):\n\
    postgres=# alter system set log_min_error_statement = 'error';\nALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show log_min_error_statement;
    severity: medium
    info: "Execute the following SQL statement to verify the setting is correct:\n54 | P a g e\npostgres=# show log_min_error_statement;\n\
      \ log_min_error_statement\n-------------------------\n error\n(1 row)"
- id: 3.1.14
  title: Ensure 'debug_print_parse' is disabled
  scoring: scored
  profile:
  - Level 1 - PostgreSQL
  - Level 1 - PostgreSQL on Linux
  description: The debug_print_parse setting enables printing the resulting parse tree for each executed query. These messages
    are emitted at the LOG message level. Unless directed otherwise by your organization's logging policy, it is recommended
    this setting be disabled by setting it to off.
  rationale: Enabling any of the DEBUG printing variables may cause the logging of sensitive information that would otherwise
    be omitted based on the configuration of the other logging settings.
  impact: ''
  references:
  - 1. https://www.postgresql.org/docs/9.6/static/runtime-config-logging.html
  page_start: 56
  audit_raw: "Execute the following SQL statement to confirm the setting is correct:\npostgres=# show debug_print_parse;\n\
    \ debug_print_parse\n-------------------\n off\n(1 row)"
  remediation: "Execute the following SQL statement(s) to remediate this setting:\npostgres=# alter system set debug_print_parse='off';\n\
    ALTER SYSTEM\npostgres=# select pg_reload_conf();\n pg_reload_conf\n----------------\n t\n(1 row)"
  checks:
  - type: sql
    command: show debug_print_parse;
    severity: medium
    info: "Execute the following SQL statement to confirm the setting is correct:\npostgres=# show debug_print_parse;\n debug_print_parse\n\
      -------------------\n off\n(1 row)"
