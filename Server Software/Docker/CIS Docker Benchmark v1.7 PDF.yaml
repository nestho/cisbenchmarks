    For example, you could execute the command below:

    auditctl -l | grep /etc/docker

    This should display a rule for the /etc/docker directory.'
  remediation: 'You should add a rule for the /etc/docker directory.

    For example:

    Add the line below to the /etc/audit/rules.d/audit.rules file:

    -w /etc/docker -k docker

    Then restart the audit daemon. For example:

    systemctl restart auditd'
  checks:
  - type: command
    command: auditctl -l | grep /etc/docker
    expected: You should verify that there is an audit rule applied to the /etc/docker directory.
    severity: medium
    info: 'You should verify that there is an audit rule applied to the /etc/docker directory.

      For example, you could execute the command below:

      auditctl -l | grep /etc/docker

      This should display a rule for the /etc/docker directory.'
- id: 1.1.7
  title: Ensure auditing is configured for Docker files and directories - docker.service
  scoring: scored
  profile:
  - Level 2 - Docker - Linux
  description: Audit the docker.service if applicable.
  rationale: As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files
    and directories. The Docker daemon runs with root privileges and its behavior depends on some key files and directories
    with docker.service being one such file. The docker.service file might be present if the daemon parameters have been changed
    by an administrator. If so, it holds various parameters for the Docker daemon and should be audited.
  impact: Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate
    partition should also be created for audit logs to avoid filling up any other critical partition.
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/8/html/system_design_guide/auditing-thesystem_system-design-guide
  page_start: 28
  audit_raw: 'Step 1: Find out the file location:

    systemctl show -p FragmentPath docker.service

    Step 2: If the file does not exist, this recommendation does not apply. If the file does

    exist, verify that there is an audit rule corresponding to the file:

    For example, you could execute the command below:

    auditctl -l | grep docker.service

    This should display a rule for docker.service.'
  remediation: 'If the file exists, a rule for it should be added.

    For example:

    Add the line as below in /etc/audit/rules.d/audit.rules file:

    -w /usr/lib/systemd/system/docker.service -k docker

    Then restart the audit daemon.

    For example:

    systemctl restart auditd'
  checks:
  - type: command
    command: systemctl show -p FragmentPath docker.service && auditctl -l | grep docker.service
    expected: 'exist, verify that there is an audit rule corresponding to the file:'
    severity: medium
    info: 'Step 1: Find out the file location:

      systemctl show -p FragmentPath docker.service

      Step 2: If the file does not exist, this recommendation does not apply. If the file does

      exist, verify that there is an audit rule corresponding to the file:

      For example, you could execute the command below:

      auditctl -l | grep docker.service

      This should display a rule for docker.service.'
