    /tmp • Use Docker shared data volumes for persistent data writes None. If this option is set, a container will only attempt
    to restart itself 5 times. Container processes cannot see processes on the host system. In certain circumstances, you
    may want your container to share the host''s process namespace. For example, you could build a container containing debugging
    tools such as strace or gdb, and want to use these tools when debugging processes on the host. If this is desired, then
    share specific host processes using the -p switch. For example: docker run --pid=host rhel7 strace -p 1234 Shared memory
    segments are used in order to accelerate interprocess communications, commonly in high-performance applications. If this
    type of application is containerized into multiple containers, you might need to share the IPC namespace of the containers
    in order to achieve high performance. Under these circumstances, you should still only share container specific IPC namespaces
    and not the host IPC namespace. A container''s IPC namespace can be shared with another container as shown below: docker
    run --interactive --tty --ipc=container:e3a7a1a97c58 centos /bin/bash You would not be able to use host devices directly
    within containers. If ulimits are not set correctly, overutilization by individual containers could make the host system
    unusable. None. None. With Docker 1.10 and greater, the default seccomp profile blocks syscalls, regardless of --cap-add
    passed to the container. You should create your own custom seccomp profile in such cases. You may also disable the default
    seccomp profile by passing -- security-opt=seccomp:unconfined on docker run. If you need enhanced capabilities within
    a container, then run it with all the permissions it requires. These should be specified individually. None. None. The
    no_new_priv option prevents LSMs like SELinux from allowing processes to acquire new privileges None. None Set the PIDs
    limit value as appropriate. Incorrect values might leave containers unusable. User-defined networks need to be configured
    and managed in line with organizational security policy. None None docker system prune -a removes all exited containers
    as well as all images and volumes that are not referenced by running containers. If any images are removed, this would
    result in needing to reload the images to the host. You should retain containers that are actively in use, and delete
    ones which are no longer needed. None None None None A swarm in auto-lock mode will not recover from a restart without
    manual intervention from an administrator to enter the unlock key. This may not always be desirable, and should be reviewed
    at a policy level. None None None This requires two network interfaces per node.'
