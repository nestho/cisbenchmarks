- id: 1.2.2
  title: Ensure that the version of Docker is up to date
  scoring: manual
  profile:
  - Level 1 - Docker - Linux
  - Level 2 - Docker - Linux
  - Level 1 - Docker Swarm
  description: 'Frequent releases for Docker are issued which address security vulnerabilities, resolve product bugs and bring
    in new functionality. You should keep a tab on these product updates and upgrade as frequently as possible in line with
    the general IT security policy of your organization. Rootless mode executes the Docker daemon and containers inside a
    user namespace, with both the daemon and the container are running without root privileges. By default, all network traffic
    is allowed between containers on the same host on the default network bridge. If not desired, restrict all inter-container
    communication. Link specific containers together that require communication. Alternatively, you can create custom network
    and only join containers that need to communicate to that custom network. Set Docker daemon log level to info. The iptables
    firewall is used to set up, maintain, and inspect the tables of IP packet filter rules within the Linux kernel. The Docker
    daemon should be allowed to make changes to the iptables ruleset. Docker considers a private registry either secure or
    insecure. By default, registries are considered secure. Do not use aufs as the storage driver for your Docker instance.
    It is possible to make the Docker daemon available remotely over a TCP port. If this is required, you should ensure that
    TLS authentication is configured in order to restrict access to the Docker daemon via IP address and port. Set the default
    ulimit options as appropriate in your environment. You should enable user namespace support in Docker daemon to utilize
    container user to host user re-mapping. This recommendation is beneficial where the containers you are using do not have
    an explicit container user defined in the container image. If the container images that you are using have a pre-defined
    non-root user, this recommendation may be skipped as this feature is still in its infancy, and might result in unpredictable
    issues or difficulty in configuration. The --cgroup-parent option allows you to set the default cgroup parent to use for
    all containers. If there is no specific usage requirement for this, the setting should be left at its default. Under certain
    circumstances, you might need containers larger than 10G. Where this applies you should carefully choose the base device
    size. You should use native Docker authorization plugins or a third party authorization mechanism with the Docker daemon
    to manage access to Docker client commands. Docker supports various logging mechanisms. A preferable method for storing
    logs is one that supports centralized and remote management. By default you should restrict containers from acquiring
    additional privileges via suid or sgid. The --live-restore option enables full support of daemon-less containers within
    Docker. It ensures that Docker does not stop containers on shutdown or restore and that it properly reconnects to the
    container when restarted. The Docker daemon starts a userland proxy service for port forwarding whenever a port is exposed.
    Where hairpin NAT is available, this service is generally superfluous to requirements and can be disabled. You can choose
    to apply a custom seccomp profile at a daemon-wide level if needed with this overriding Docker''s default seccomp profile.
    Experimental features should not be enabled in production. You should verify that the docker.service file ownership and
    group ownership are correctly set to root. You should verify that the docker.service file permissions are either set to
    644 or to a more restrictive value. You should verify that the docker.socket file ownership and group ownership are correctly
    set to root. You should verify that the file permissions on the docker.socket file are correctly set to 644 or more restrictively.
    You should verify that the /etc/docker directory ownership and group ownership is correctly set to root. You should verify
    that the /etc/docker directory permissions are correctly set to 755 or more restrictively. You should verify that all
    the registry certificate files (usually found under /etc/docker/certs.d/<registry-name> directory) are individually owned
    and group owned by root. You should verify that all the registry certificate files (usually found under /etc/docker/certs.d/<registry-name>
    directory) have permissions of 444 or are set more restrictively. Note that, by default, this directory might not exist
    if no registry certificate files are in place. You should verify that the TLS CA certificate file (the file that is passed
    along with the - -tlscacert parameter) is individually owned and group owned by root. You should verify that the TLS CA
    certificate file (the file that is passed along with the - -tlscacert parameter) has permissions of 444 or is set more
    restrictively. You should verify that the Docker server certificate file (the file that is passed along with the --tlscert
    parameter) is individual owned and group owned by root. You should verify that the Docker server certificate file (the
    file that is passed along with the --tlscert parameter) has permissions of 444 or more restrictive permissions. You should
    verify that the Docker server certificate key file (the file that is passed along with the --tlskey parameter) is individually
    owned and group owned by root. You should verify that the Docker server certificate key file (the file that is passed
    along with the --tlskey parameter) has permissions of 400. You should verify that the Docker socket file is owned by root
    and group owned by docker. You should verify that the Docker socket file has permissions of 660 or are configured more
    restrictively. You should verify that the daemon.json file individual ownership and group ownership is correctly set to
    root, if it is in use. You should verify that if the daemon.json is present its file permissions are correctly set to
    644 or more restrictively. You should verify that the /etc/default/docker file ownership and group-ownership is correctly
    set to root. You should verify that the /etc/default/docker file permissions are correctly set to 644 or more restrictively.
    You should verify that the /etc/sysconfig/docker file permissions are correctly set to 644 or more restrictively. You
    should verify that the /etc/sysconfig/docker file individual ownership and group ownership is correctly set to root. You
    should verify that the Containerd socket file is owned by root and group owned by root. You should verify that the Containerd
    socket file has permissions of 660 or are configured more restrictively. Containers should run as a non-root user. You
    should ensure that container images you use are either written from scratch or are based on another established and trusted
    base image downloaded over a secure channel. Containers should have as small a footprint as possible, and should not contain
    unnecessary software packages which could increase their attack surface. Images should be scanned frequently for any vulnerabilities.
    You should rebuild all images to include these patches and then instantiate new containers from them. Content trust is
    disabled by default and should be enabled in line with organizational security policy. You should add the HEALTHCHECK
    instruction to your Docker container images in order to ensure that health checks are executed against running containers.
    You should not use OS package manager update instructions such as apt-get update or yum update either alone or in a single
    line in any Dockerfiles used to generate images under review. Removing setuid and setgid permissions in the images can
    prevent privilege escalation attacks within containers. You should use the COPY instruction instead of the ADD instruction
    in the Dockerfile. Do not store any secrets in Dockerfiles. You should verify the authenticity of packages before installing
    them into images. Validate artifacts signatures before uploading to the package registry. Do not enable swarm mode on
    a Docker engine instance unless this is needed. AppArmor is an effective and easy-to-use Linux application security system.
    It is available on some Linux distributions by default, for example, on Debian and Ubuntu. SELinux is an effective and
    easy-to-use Linux application security system. It is available by default on some distributions such as Red Hat and Fedora.
    By default, Docker starts containers with a restricted set of Linux kernel capabilities. This means that any process can
    be granted the required capabilities instead of giving it root access. Using Linux kernel capabilities, processes in general
    do not need to run as the root user. Using the --privileged flag provides all Linux kernel capabilities to the container
    to which it is applied and therefore overwrites the --cap-add and --cap-drop flags. For this reason you should ensure
    that it is not used. You should not allow sensitive host system directories such as those listed below to be mounted as
    container volumes, especially in read-write mode. / /boot /dev /etc /lib /lib64 /proc /sys /usr The SSH daemon should
    not be running within the container. You should SSH into the Docker host, and use docker exec to enter a container. The
    TCP/IP port numbers below 1024 are considered privileged ports. Normal users and processes are not allowed to use them
    for various security reasons. Docker does, however allow a container port to be mapped to a privileged port. The dockerfile
    for a container image defines the ports which are opened by default on a container instance. The list of ports are relevant
    to the application you are running within the container and should only be open if they are needed. When the networking
    mode on a container is set to --net=host, the container is not placed inside a separate network stack. Effectively, applying
    this option instructs Docker to not containerize the container''s networking. The consequence of this is that the container
    lives "outside" in the main Docker host and has full access to its network interfaces. By default, all containers on a
    Docker host share resources equally. By using the resource management capabilities of the Docker host, you can control
    the amount of memory that a container is able to use. By default, all containers on a Docker host share resources equally.
    By using the resource management capabilities of the Docker host you can control the host CPU resources that a container
    may consume. The container''s root filesystem should be treated as a ''golden image'' by using Docker run''s --read-only
    option. This prevents any writes to the container''s root filesystem at container runtime and enforces the principle of
    immutable infrastructure. By default, Docker containers can make connections to the outside world, but the outside world
    cannot connect to containers and each outgoing connection will appear to originate from one of the host machine''s own
    IP addresses. You should only allow container services to be contacted through a specific external interface on the host
    machine. By using the --restart flag in the docker run command you can specify a restart policy for how a container should
    or should not be restarted on exit. You should choose the on-failure restart policy and limit the restart attempts to
    5. The Process ID (PID) namespace isolates the process ID space, meaning that processes in different PID namespaces can
    have the same PID. This creates process level isolation between the containers and the host. IPC (POSIX/SysV IPC) namespace
    provides separation of named shared memory segments, semaphores and message queues. The IPC namespace on the host should
    therefore not be shared with containers and should remain isolated. Host devices can be directly exposed to containers
    at runtime. Do not directly expose host devices to containers, especially to containers that are not trusted. The default
    ulimit is set at the Docker daemon level. However, if you need to, you may override the default ulimit setting during
    container runtime. Mount propagation mode allows mounting volumes in shared, slave or private mode on a container. Do
    not use shared mount propagation mode unless explicitly needed. UTS namespaces provide isolation between two system identifiers:
    the hostname and the NIS domain name. It is used to set the hostname and the domain which are visible to running processes
    in that namespace. Processes running within containers do not typically require to know either the hostname or the domain
    name. The UTS namespace should therefore not be shared with the host. Seccomp filtering provides a means for a process
    to specify a filter for incoming system calls. The default Docker seccomp profile works on a whitelist basis and allows
    for a large number of common system calls, whilst blocking all others. This filtering should not be disabled unless it
    causes a problem with your container application usage. You should not use docker exec with the --privileged option. You
    should not use docker exec with the --user=root option. It is possible to attach to a particular cgroup when a container
    is instantiated. Confirming cgroup usage would ensure that containers are running in defined cgroups. You should restrict
    the container from acquiring additional privileges via suid or sgid bits. If the container image does not have an HEALTHCHECK
    instruction defined, you should use the --health-cmd parameter at container runtime to check container health. You should
    always ensure that you are using the latest version of the images within your repository and not cached older versions.
    You should use the --pids-limit flag at container runtime. You should not use Docker''s default bridge docker0. Instead
    you should use Docker''s user-defined networks for container networking. You should not share the host''s user namespaces
    with containers running on it. The Docker socket docker.sock should not be mounted inside a container. You should not
    keep a large number of container images on the same host. Use only tagged images as appropriate. You should not keep a
    large number of containers on the same host. You should ensure that the minimum number of required manager nodes is created
    in a swarm. By default, Docker swarm services will listen on all interfaces on the host. This may not be necessary for
    the operation of the swarm where the host has multiple network interfaces. Ensure that all Docker swarm overlay networks
    are encrypted. You should use Docker''s in-built secret management command for control of secrets. You should review whether
    you wish to run Docker swarm manager in auto-lock mode. You should rotate the swarm manager auto-lock key periodically.
    You should rotate swarm node certificates in line with your organizational security policy. You should rotate root CA
    certificates as appropriate. You should separate management plane traffic from data plane traffic.'
  rationale: 'By staying up to date on Docker updates, vulnerabilities in the software can be mitigated. An experienced attacker
    may be able to exploit known vulnerabilities resulting in them being able to attain inappropriate access or to elevate
    their privileges. If you do not ensure that Docker is running at the most current release consistent with the requirements
    of of your application, you may introduce unwanted behaviour and it is therefore important to ensure that you monitor
    software versions and upgrade in a timely fashion. Rootless mode allows running the Docker daemon and containers as a
    non-root user to mitigate potential vulnerabilities in the daemon and the container runtime. By default, unrestricted
    network traffic is enabled between all containers on the same host on the default network bridge. Thus, each container
    has the potential of reading all packets across the container network on the same host. This might lead to an unintended
    and unwanted disclosure of information to other containers. Hence, restrict inter-container communication on the default
    network bridge. Setting up an appropriate log level, configures the Docker daemon to log events that you would want to
    review later. A base log level of info and above would capture all logs except debug logs. Until and unless required,
    you should not run Docker daemon at debug log level. Docker will never make changes to your system iptables rules unless
    you allow it to do so. If you do allow this, Docker server will automatically make any required changes. We recommended
    letting Docker make changes to iptables automatically in order to avoid networking misconfigurations that could affect
    the communication between containers and with the outside world. Additionally, this reduces the administrative overhead
    of updating iptables every time you add containers or modify networking options. A secure registry uses TLS. A copy of
    registry''s CA certificate is placed on the Docker host at /etc/docker/certs.d/<registry-name>/ directory. An insecure
    registry is one which does not have a valid registry certificate, or one not using TLS. Insecure registries should not
    be used as they present a risk of traffic interception and modification. Additionally, once a registry has been marked
    as insecure commands such as docker pull, docker push, and docker search will not result in an error message and users
    may indefinitely be working with this type of insecure registry without ever being notified of the risk of potential compromise.
    The aufs storage driver is the oldest storage driver used on Linux systems. It is based on a Linux kernel patch-set that
    is unlikely in future to be merged into the main OS kernel. The aufs driver is also known to cause some serious kernel
    crashes. aufs only has legacy support within systems using Docker. Most importantly, aufs is not a supported driver in
    many Linux distributions using latest Linux kernels and has also been deprecated with Docker Engine release 20.10. By
    default, the Docker daemon binds to a non-networked Unix socket and runs with root privileges. If you change the default
    Docker daemon binding to a TCP port or any other Unix socket, anyone with access to that port or socket could have full
    access to the Docker daemon and therefore in turn to the host system. For this reason, you should not bind the Docker
    daemon to another IP/port or a Unix socket. If you must expose the Docker daemon via a network socket, you should configure
    TLS authentication for the daemon and for any Docker Swarm APIs (if they are in use). This type of configuration restricts
    the connections to your Docker daemon over the network to a limited number of clients who have access to the TLS client
    credentials. ulimit provides control over the resources available to the shell and to processes which it starts. Setting
    system resource limits judiciously can save you from disasters such as a fork bomb. On occasion, even friendly users and
    legitimate processes can overuse system resources and can make the system unusable. Setting the default ulimit for the
    Docker daemon enforces the ulimit for all container instances. In this case you would not need to setup ulimit for each
    container instance. However, the default ulimit can be overridden during container runtime, if needed. Therefore, in order
    to have proper control over system resources, define a default ulimit as is needed in your environment. The Linux kernel
    "user namespace" support within the Docker daemon provides additional security for the Docker host system. It allows a
    container to have a unique range of user and group IDs which are outside the traditional user and group range utilized
    by the host system. For example, the root user can have the expected administrative privileges inside the container but
    can effectively be mapped to an unprivileged UID on the host system. System administrators typically define cgroups under
    which containers are supposed to run. Even if cgroups are not explicitly defined by the system administrators, containers
    run under docker cgroup by default. It is possible to attach to a different cgroup other than the one which is the default,
    however this type of usage should be monitored and confirmed because attaching to a different cgroup other than the one
    that is a default, it could be possible to share resources unevenly causing resource utilization problems on the host.
    The base device size can be increased on daemon restart. Increasing the base device size allows all future images and
    containers to be of the new base device size. A user can use this option to expand the base device size, however shrinking
    is not permitted. This value affects the system wide “base” empty filesystem that may already be initialized and therefore
    inherited by pulled images. Although the file system does not allocate the increased size as long as it is empty, more
    space will be allocated for extra images. This may cause a denial of service condition if the allocated partition becomes
    full. Docker’s out-of-the-box authorization model is currently "all or nothing". This means that any user with permission
    to access the Docker daemon can run any Docker client command. The same is true for remote users accessing Docker’s API
    to contact the daemon. If you require greater access control, you can create authorization plugins and add them to your
    Docker daemon configuration. Using an authorization plugin, a Docker administrator can configure granular access policies
    for managing access to the Docker daemon. Third party integrations of Docker may implement their own authorization models
    to require authorization with the Docker daemon outside of docker''s native authorization plugin (i.e. Kubernetes, Cloud
    Foundry, Openshift). Centralized and remote logging ensures that all important log records are safe even in the event
    of a major data availability issue . Docker supports various logging methods and you should use the one that best corresponds
    to your IT security policy. A process can set the no_new_priv bit in the kernel and this persists across forks, clones
    and execve. The no_new_priv bit ensures that the process and its child processes do not gain any additional privileges
    via suid or sgid bits. This reduces the security risks associated with many dangerous operations because there is a much
    reduced ability to subvert privileged binaries. Setting this at the daemon level ensures that by default all new containers
    are restricted from acquiring new privileges. One of the important security triads is availability. Setting the --live-restore
    flag within the Docker daemon ensures that container execution is not interrupted when it is not available. This also
    makes it easier to update and patch the Docker daemon without application downtime. The Docker engine provides two mechanisms
    for forwarding ports from the host to containers, hairpin NAT, and the use of a userland proxy. In most circumstances,
    the hairpin NAT mode is preferred as it improves performance and makes use of native Linux iptables functionality instead
    of using an additional component. Where hairpin NAT is available, the userland proxy should be disabled on startup to
    reduce the attack surface of the installation. A large number of system calls are exposed to every userland process with
    many of them not utilized during the entire lifetime of the process. Many applications do not need all these system calls
    and therefore benefit by having each system call currently in use reviewed in line with organizational security policy.
    A reduced set of system calls reduces the total kernel surface exposed to the application and therefore improves application
    security. A custom seccomp profile can be applied instead of Docker''s default seccomp profile. Alternatively, if Docker''s
    default profile is adequate for your environment, you can choose to ignore this recommendation. "Experimental" is currently
    a runtime Docker daemon flag rather than being a feature of a separate build. Passing --experimental as a runtime flag
    to the docker daemon activates experimental features. Whilst "Experimental" is considered a stable release, it has a number
    of features which may not have been fully tested and do not guarantee API stability. The docker.service file contains
    sensitive parameters that may alter the behavior of the Docker daemon. It should therefore be individually and group owned
    by the root user in order to ensure that it is not modified or corrupted by a less privileged user. The docker.service
    file contains sensitive parameters that may alter the behavior of the Docker daemon. It should therefore not be writable
    by any other user other than root in order to ensure that it can not be modified by less privileged users. The docker.socket
    file contains sensitive parameters that may alter the behavior of the Docker remote API. For this reason, it should be
    owned and group owned by root in order to ensure that it is not modified by less privileged users. The docker.socket file
    contains sensitive parameters that may alter the behavior of the Docker remote API. It should therefore be writeable only
    by root in order to ensure that it is not modified by less privileged users. The /etc/docker directory contains certificates
    and keys in addition to various other sensitive files. It should therefore be individual owned and group owned by root
    in order to ensure that it can not be modified by less privileged users. The /etc/docker directory contains certificates
    and keys in addition to various sensitive files. It should therefore only be writeable by root to ensure that it can not
    be modified by a less privileged user. The /etc/docker/certs.d/<registry-name> directory contains Docker registry certificates.
    These certificate files must be individually owned and group owned by root to ensure that less privileged users are unable
    to modify the contents of the directory. The /etc/docker/certs.d/<registry-name> directory contains Docker registry certificates.
    These certificate files must have permissions of 444or more restrictive permissions in order to ensure that unprivileged
    users do not have full access to them.. The TLS CA certificate file should be protected from any tampering. It is used
    to authenticate the Docker server based on a given CA certificate. It must be therefore be individually owned and group
    owned by root to ensure that it cannot be modified by less privileged users. The TLS CA certificate file should be protected
    from any tampering. It is used to authenticate the Docker server based on a given CA certificate. It must therefore have
    permissions of 444, or more restrictive permissions to ensure that the file cannot be modified by a less privileged user.
    The Docker server certificate file should be protected from any tampering. It is used to authenticate the Docker server
    based on the given server certificate. It must therefore be individually owned and group owned by root to prevent modification
    by less privileged users. The Docker server certificate file should be protected from any tampering. It is used to authenticate
    the Docker server based on the given server certificate. It should therefore have permissions of 444 to prevent its modification.
    The Docker server certificate key file should be protected from any tampering or unneeded reads/writes. As it holds the
    private key for the Docker server certificate, it must be individually owned and group owned by root to ensure that it
    cannot be accessed by less privileged users. The Docker server certificate key file should be protected from any tampering
    or unneeded reads. It holds the private key for the Docker server certificate. It must therefore have permissions of 400
    to ensure that the certificate key file is not modified. The Docker daemon runs as root. The default Unix socket therefore
    must be owned by root. If any other user or process owns this socket, it might be possible for that nonprivileged user
    or process to interact with the Docker daemon. Additionally, in this case a non-privileged user or process might be able
    to interact with containers which is neither a secure nor desired behavior. Additionally, the Docker installer creates
    a Unix group called docker. You can add users to this group, and in this case, those users would be able to read and write
    to the default Docker Unix socket. The membership of the docker group is tightly controlled by the system administrator.
    However, ff any other group owns this socket, then it might be possible for members of that group to interact with the
    Docker daemon. Such a group might not be as tightly controlled as the docker group. Again, this is not in line with good
    security practice. For these reason, the default Docker Unix socket file should be owned by root and group owned by docker
    to maintain the integrity of the socket file. Only root and the members of the docker group should be allowed to read
    and write to the default Docker Unix socket. The Docker socket file should therefore have permissions of 660 or more restrictive
    permissions. The daemon.json file contains sensitive parameters that could alter the behavior of the docker daemon. It
    should therefore be owned and group owned by root to ensure it can not be modified by less privileged users. The daemon.json
    file contains sensitive parameters that may alter the behavior of the docker daemon. Therefore it should be writeable
    only by root to ensure it is not modified by less privileged users. The /etc/default/docker file contains sensitive parameters
    that may alter the behavior of the Docker daemon. It should therefore be individually owned and group owned by root to
    ensure that it cannot be modified by less privileged users. The /etc/default/docker file contains sensitive parameters
    that may alter the behavior of the Docker daemon. It should therefore be writeable only by root in order to ensure that
    it is not modified by less privileged users. The /etc/sysconfig/docker file contains sensitive parameters that may alter
    the behavior of the Docker daemon. It should therefore be writeable only by root in order to ensure that it is not modified
    by less privileged users. The /etc/sysconfig/docker file contains sensitive parameters that may alter the behavior of
    the Docker daemon. It should therefore be individually owned and group owned by root to ensure that it is not modified
    by less privileged users. Containerd is an underlying component used by Docker to create and manage containers. It provides
    a socket file similar to the Docker socket, which must be protected from unauthorized access. If any other user or process
    owns this socket, it might be possible for that non-privileged user or process to interact with the Containerd daemon.
    Additionally, in this case a non-privileged user or process might be able to interact with containers which is neither
    a secure nor desired behavior. Unlike the Docker socket, there is usually no requirement for non-privileged users to connect
    to the socket, so the ownership should be root:root. Only root and the members of the root group should be allowed to
    read and write to the default Containerd Unix socket. The Containerd socket file should therefore have permissions of
    660 or more restrictive permissions. It is good practice to run the container as a non-root user, where possible. This
    can be done either via the USER directive in the Dockerfile or through gosu or similar where used as part of the CMD or
    ENTRYPOINT directives. Official repositories contain Docker images curated and optimized by the Docker community or by
    their vendor. There is no guarantee that these images are safe and do not contain security vulnerabilities or malicious
    code. Caution should therefore be exercised when obtaining container images from Docker and third parties and running
    these images should be reviewed in line with organizational security policy. Unnecessary software should not be installed
    into containers, as doing so increases their attack surface. Only packages strictly necessary for the correct operation
    of the application being deployed should be installed. Vulnerabilities are loopholes or bugs that can be exploited by
    hackers or malicious users, and security patches are updates to resolve these vulnerabilities. Image vulnerability scanning
    tools can be use to find vulnerabilities in images and then check for available patches to mitigate these. Patches update
    the system to a more recent code base which does not contain these problems, and being on a supported version of the code
    base is very important, as vendors do not tend to supply patches for older versions which have gone out of support. Security
    patches should be evaluated before applying and patching should be implemented in line with the organization''s IT Security
    Policy. Care should be taken with the results returned by vulnerability assessment tools, as some will simply return results
    based on software banners, and these may not be entirely accurate. Content trust provides the ability to use digital signatures
    for data sent to and received from remote Docker registries. These signatures allow client-side verification of the identity
    and the publisher of specific image tags and ensures the provenance of container images. An important security control
    is that of availability. Adding the HEALTHCHECK instruction to your container image ensures that the Docker engine periodically
    checks the running container instances against that instruction to ensure that containers are still operational. Based
    on the results of the health check, the Docker engine could terminate containers which are not responding correctly, and
    instantiate new ones. Adding update instructions in a single line on the Dockerfile will cause the update layer to be
    cached. When you then build any image later using the same instruction, this will cause the previously cached update layer
    to be used, potentially preventing any fresh updates from being applied to later builds. setuid and setgid permissions
    can be used for privilege escalation. Whilst these permissions can on occasion be legitimately needed, you should consider
    removing them from packages which do not need them. This should be reviewed for each image. The COPY instruction simply
    copies files from the local host machine to the container file system. The ADD instruction could potentially retrieve
    files from remote URLs and perform operations such as unpacking them. The ADD instruction therefore introduces security
    risks. For example, malicious files may be directly accessed from URLs without scanning, or there may be vulnerabilities
    associated with decompressing them. Docker images are not opaque and contain information about the commands used to build
    them. As such secrets should not be included in Dockerfiles used to build images as they will be visible to any users
    of the image. Verifying authenticity of software packages is essential for building a secure container image. Packages
    with no known provenance could potentially be malicious or have vulnerabilities that could be exploited. Cryptographic
    signature is a tool to verify artifact authenticity. Every artifact is supposed to be signed by its creator in order to
    verify that it wasn''t compromised until it got to the client. Validating artifact signature before delivering it is another
    level of protection, which checks that the signature hasn''t been changed, which means that no one tried or succeeded
    in tampering with the artifact. That sets trust between the supplier and the client. By default, a Docker engine instance
    will not listen on any network ports, with all communications with the client coming over the Unix socket. When Docker
    swarm mode is enabled on a Docker engine instance, multiple network ports are opened on the system and made available
    to other systems on the network for the purposes of cluster management and node communications. Opening network ports
    on a system increases its attack surface and this should be avoided unless required. It should be noted that swarm mode
    is required for the operation of Docker Enterprise components. AppArmor protects the Linux OS and applications from various
    threats by enforcing a security policy which is also known as an AppArmor profile. You can create your own AppArmor profile
    for containers or use Docker''s default profile. Enabling this feature enforces security policies on containers as defined
    in the profile. SELinux provides a Mandatory Access Control (MAC) system that greatly augments the default Discretionary
    Access Control (DAC) model. You can therefore add an extra layer of safety to your containers by enabling SELinux on your
    Linux host. Docker supports the addition and removal of capabilities. You should remove all capabilities not required
    for the correct function of the container. Specifically, in the default capability set provided by Docker, the NET_RAW
    capability should be removed if not explicitly required, as it can give an attacker with access to a container the ability
    to create spoofed network traffic. The --privileged flag provides all capabilities to the container to which it is applied,
    and also lifts all the limitations enforced by the device cgroup controller. As a consequence this the container has most
    of the rights of the underlying host. This flag only exists to allow for specific use cases (for example running Docker
    within Docker) and should not generally be used. If sensitive directories are mounted in read-write mode, it could be
    possible to make changes to files within them. This has obvious security implications and should be avoided. Running SSH
    within the container increases the complexity of security management by making it • Difficult to manage access policies
    and security compliance for SSH server • Difficult to manage keys and passwords across various containers • Difficult
    to manage security upgrades for SSH server It is possible to have shell access to a container without using SSH, the needlessly
    increasing the complexity of security management should be avoided. By default, if the user does not specifically declare
    a container port to host port mapping, Docker automatically and correctly maps the container port to one available in
    the 49153-65535 range on the host. Docker does, however, allow a container port to be mapped to a privileged port on the
    host if the user explicitly declares it. This is because containers are executed with NET_BIND_SERVICE Linux kernel capability
    which does not restrict privileged port mapping. The privileged ports receive and transmit various pieces of data which
    are security sensitive and allowing containers to use them is not in line with good security practice. A container can
    be run with only the ports defined in the Dockerfile for its image or can alternatively be arbitrarily passed run time
    parameters to open a list of ports. Additionally, in the course of time, the Dockerfile may undergo various changes and
    the list of exposed ports may or may not still be relevant to the application you are running within the container. Opening
    unneeded ports increases the attack surface of the container and the associated containerized application. Good security
    practice is to only open ports that are needed for the correct operation of the application. Selecting this option is
    potentially dangerous. It allows the container process to open reserved low numbered ports in the way that any other root
    process can. It also allows the container to access network services such as D-bus on the Docker host. A container process
    could potentially carry out undesired actions, such as shutting down the Docker host. This option should not be used unless
    there is a very specific reason for enabling it. By default a container can use all of the memory on the host. You can
    use memory limit mechanisms to prevent a denial of service occurring where one container consumes all of the host’s resources
    and other containers on the same host are therefore not able to function. Having no limit on memory usage can lead to
    issues where one container can easily make the whole system unstable and as a result unusable. By default, CPU time is
    divided between containers equally. If you wish to control available CPU resources amongst container instances, you can
    use the CPU sharing feature. CPU sharing allows you to prioritize one container over others and prevents lower priority
    containers from absorbing CPU resources which may be required by other processes. This ensures that high priority containers
    are able to claim the CPU runtime they require. Enabling this option forces containers at runtime to explicitly define
    their data writing strategy to persist or not persist their data. This also reduces security attack vectors since the
    container instance''s filesystem cannot be tampered with or written to unless it has explicit read-write permissions on
    its filesystem folder and directories. If you have multiple network interfaces on your host machine, the container can
    accept connections on exposed ports on any network interface. This might not be desirable and may not be secured. In many
    cases a specific, desired interface is exposed externally and services such as intrusion detection, intrusion prevention,
    firewall, load balancing, etc. are all run by intention there to screen incoming public traffic. You should therefore
    not accept incoming connections on any random interface, but only the one designated for this type of traffic. If you
    indefinitely keep trying to start the container, it could possibly lead to a denial of service on the host. It could be
    an easy way to do a distributed denial of service attack especially if you have many containers on the same host. Additionally,
    ignoring the exit status of the container and always attempting to restart the container, leads to noninvestigation of
    the root cause behind containers getting terminated. If a container gets terminated, you should investigate on the reason
    behind it instead of just attempting to restart it indefinitely. You should use the on-failure restart policy to limit
    the number of container restarts to a maximum of 5 attempts. PID namespace provides separation between processes. It prevents
    system processes from being visible, and allows process ids to be reused including PID 1. If the host''s PID namespace
    is shared with containers, it would basically allow these to see all of the processes on the host system. This reduces
    the benefit of process level isolation between the host and the containers. Under these circumstances a malicious user
    who has access to a container could get access to processes on the host itself, manipulate them, and even be able to kill
    them. This could allow for the host itself being shut down, which could be extremely serious, particularly in a multi-tenanted
    environment. You should not share the host''s process namespace with the containers running on it. The IPC namespace provides
    separation of IPC between the host and containers. If the host''s IPC namespace is shared with the container, it would
    allow processes within the container to see all of IPC communications on the host system. This would remove the benefit
    of IPC level isolation between host and containers. An attacker with access to a container could get access to the host
    at this level with major consequences. The IPC namespace should therefore not be shared between the host and its containers.
    The --device option exposes host devices to containers and as a result of this, containers can directly access these devices.
    The the container would not need to run in privileged mode to access and manipulate them, as by default, the container
    is granted this type of access. Additionally, it would possible for containers to remove block devices from the host.
    You therefore should not expose host devices to containers directly. If for some reason you wish to expose the host device
    to a container you should consider which sharing permissions you wish to use on a case by case base as appropriate to
    your organization: • r - read only • w - writable • m - mknod allowed ulimit provides control over the resources available
    to the shell and to processes started by it. Setting system resource limits in a prudent fashion, protects against denial
    of service conditions. On occasion, legitimate users and processes can accidentally overuse system resources and cause
    systems be degraded or even unresponsive. The default ulimit set at the Docker daemon level should be honored. If the
    default ulimit settings are not appropriate for a particular container instance, you may override them as an exception,
    but this should not be done routinely. If many of your container instances are exceeding your ulimit settings, you should
    consider changing the default settings to something that is more appropriate for your needs. A shared mount is replicated
    at all mounts and changes made at any mount point are propagated to all other mount points. Mounting a volume in shared
    mode does not restrict any other container from mounting and making changes to that volume. As this is likely not a desirable
    option from a security standpoint, this feature should not be used unless explicitly required. Sharing the UTS namespace
    with the host provides full permission for each container to change the hostname of the host. This is not in line with
    good security practice and should not be permitted. A large number of system calls are exposed to every userland process
    with many of them going unused for the entire lifetime of the process. Most of applications do not need all these system
    calls and would therefore benefit from having a reduced set of available system calls. Having a reduced set of system
    calls reduces the total kernel surface exposed to the application and thus improvises application security. Using the
    --privileged option in docker exec commands gives extended Linux capabilities to the command. This could potentially be
    an insecure practice, particularly when you are running containers with reduced capabilities or with enhanced restrictions.
    Using the --user=root option in a docker exec command, executes it within the container as the root user. This could potentially
    be insecure, particularly when you are running containers with reduced capabilities or enhanced restrictions. For example,
    if your container is running as a tomcat user (or any other non-root user), it would be possible to run a command through
    docker exec as root with the -- user=root option. This could potentially be dangerous. System administrators typically
    define cgroups in which containers are supposed to run. If cgroups are not explicitly defined by the system administrator,
    containers run in the docker cgroup by default. At run time, it is possible to attach a container to a different cgroup
    other than the one originally defined. This usage should be monitored and confirmed, as by attaching to a different cgroup,
    excess permissions and resources might be granted to the container and this can therefore prove to be a security risk.
    A process can set the no_new_priv bit in the kernel and this persists across forks, clones and execve. The no_new_priv
    bit ensures that the process and its child processes do not gain any additional privileges via suid or sgid bits. This
    reduces the danger associated with many operations because the possibility of subverting privileged binaries is lessened.
    If the container image you are using does not have a pre-defined HEALTHCHECK instruction, use the --health-cmd parameter
    to check container health at runtime. Based on the reported health status, remedial actions can be taken if necessary.
    Multiple Docker commands such as docker pull, docker run etc. are known to have an issue where by default, they extract
    the local copy of the image, if present, even though there is an updated version of the image with the same tag in the
    upstream repository. This could lead to using older images containing known vulnerabilites. Attackers could launch a fork
    bomb with a single command inside the container. This fork bomb could crash the entire system and would require a restart
    of the host to make the system functional again. Using the PIDs cgroup parameter --pids-limit would prevent this kind
    of attack by restricting the number of forks that can happen inside a container within a specified time frame. Docker
    connects virtual interfaces created in bridge mode to a common bridge called docker0. This default networking model is
    vulnerable to ARP spoofing and MAC flooding attacks as there is no filtering applied to it. User namespaces ensure that
    a root process inside the container will be mapped to a non-root process outside the container. Sharing the user namespaces
    of the host with the container does not therefore isolate users on the host from users in the containers. If the Docker
    socket is mounted inside a container it could allow processes running within the container to execute Docker commands
    which would effectively allow for full control of the host. Tagged images are useful if you need to fall back from the
    "latest" version to a specific version of an image in production. Images with unused or old tags may contain vulnerabilities
    that might be exploited if instantiated. The flexibility of containers makes it easy to run multiple instances of applications
    and therefore indirectly leads to Docker images that can exist at varying security patch levels. It also means that you
    are consuming host resources that otherwise could have been used for running ''useful'' containers. Having more than just
    an essential number of containers on a particular host makes the system vulnerable to mishandling, misconfiguration and
    fragmentation. You should therefore keep the number of containers on a given host to the minimum number commensurate with
    serving production applications. Manager nodes within a swarm have control over the swarm and can change its configuration,
    including modifying security parameters. Having excessive manager nodes could render the swarm more susceptible to compromise.
    If fault tolerance is not required in the manager nodes, a single node should be elected as a manger. If fault tolerance
    is required then the smallest odd number to achieve the appropriate level of tolerance should be configured. This should
    always be an odd number in order to ensure that a quorum is reached. When a swarm is initialized the default value for
    the --listen-addr flag is 0.0.0.0:2377 which means that swarm services will listen on all interfaces on the host. If a
    host has multiple network interfaces this may be undesirable as it could expose swarm services to networks which are not
    involved with the operation of the swarm. By passing a specific IP address to the --listen-addr, a specific network interface
    can be specified, limiting this exposure. By default, data exchanged between containers on nodes on the overlay network
    is not encrypted. This could potentially expose traffic between containers. Docker has various commands for managing secrets
    in a swarm cluster. When Docker restarts, both the TLS key used to encrypt communication among swarm nodes, and the key
    used to encrypt and decrypt Raft logs on disk, are loaded into each manager node''s memory. You could protect the mutual
    TLS encryption key and the key used to encrypt and decrypt Raft logs at rest. This protection could be enabled by initializing
    the swarm with the --autolock flag. With --autolock enabled, when Docker restarts, you must unlock the swarm first, using
    a key encryption key generated by Docker when the swarm was initialized. This has benefits in a high security environment,
    however these should be balanced against the support issues caused by the swarm not starting automatically if, for example
    the host were to experience an outage. The swarm manager auto-lock key is not automatically rotated. Good security practice
    is to rotate keys. Docker Swarm uses TLS for clustering operations between its nodes. Certificate rotation ensures that
    in an event such as a compromised node or key, it is difficult to impersonate a node. By default, node certificates are
    rotated every 90 days, but you should rotate them more often or as appropriate in your environment. Docker Swarm uses
    TLS for clustering operations between its nodes. Certificate rotation ensures that in an event such as a compromised node
    or key, it is difficult to impersonate a node. Node certificates depend upon root CA certificates. For operational security,
    it is important to rotate these frequently. Currently, root CA certificates are not rotated automatically and you should
    therefore establish a process for rotating them in line with your organizational security policy. Separating management
    plane traffic from data plane traffic ensures that these types of traffic are segregated from each other. These traffic
    flows can then be individually monitored and tied to different traffic control policies and monitoring. This also ensures
    that the management plane is always reachable even if there is a great deal of traffic on the data plane.'
  impact: 'You should perform a risk assessment regarding Docker version updates and review how they may impact your operations.
    You should be aware that third-party products that use Docker may require older major versions of Docker to be supported,
    and this should be reviewed in line with the general IT security policy of your organization, particularly where security
    vulnerabilities in older versions have been publicly disclosed. There are multiple prerequisites depending on which distribution
    that is in use, and also known limitations regarding networking and resource limitation. Running in rootless mode also
    changes the location of any configuration files in use, including all containers using the daemon. Inter-container communication
    would be disabled on the default network bridge. If any communication between containers on the same host is desired,
    then it needs to be explicitly defined using container linking or alternatively custom networks have to be defined. None.
    The Docker daemon service requires iptables rules to be enabled before it starts. Any restarts of iptables during Docker
    daemon operation may result in losing Docker created rules. Adding iptables-persistent to your iptables install can assist
    with mitigation of this impact. None. aufs is the only storage driver that allows containers to share executable and shared
    library memory. It might be useful if you are running thousands of containers with the same program or libraries, however
    its use should be reviewed in line with your organization''s security policy. You would need to manage and guard certificates
    and keys for the Docker daemon and Docker clients. If ulimits are set incorrectly this could cause issues with system
    resources, possibly causing a denial of service condition. User namespace remapping is incompatible with a number of Docker
    features and also currently breaks some of its functionalities. Reference the Docker documentation and included links
    for details. None. None. Each Docker command needs to pass through the authorization plugin mechanism. This may have a
    performance impact. It may be possible to use alternative mechanisms that do not have this performance hit. None. no_new_priv
    prevents LSMs such as SELinux from escalating the privileges of individual containers. None. Some systems with older Linux
