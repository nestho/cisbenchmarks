    \ \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --enable-private-nodes \\\n  --enable-ip-alias\nEnable\
    \ private nodes on an existing node pool:\ngcloud container node-pools update $POOL_NAME \\\n  --cluster $CLUSTER_NAME\
    \ \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --enable-private-nodes \\\n  --enable-ip-alias\n• Note:\
    \ After remediation, rerun the audit commands and confirm that the cluster\nlevel default and each applicable node pool\
    \ return true. Validate that private\nnodes still have required outbound access through approved paths such as\nCloud\
    \ NAT, Private Google Access, or private connectivity for image pulls,\npackage downloads, Google APIs, and third party\
    \ services."
  checks:
  - type: manual_review
    info: "Review the GKE cluster and node pools to verify that private nodes are configured\nwithout external IP addresses.\
