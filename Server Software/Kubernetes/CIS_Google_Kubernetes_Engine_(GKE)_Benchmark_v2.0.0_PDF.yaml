- id: 5.8.1
  title: Disable legacy client certificate authentication for the GKE API server
  scoring: scored
  profile:
  - Level 1
  description: Disable legacy client certificate authentication for the GKE API server by ensuring GKE does not issue a pre
    provisioned client certificate for cluster access. Use supported identity based authentication methods, such as OAuth
    tokens through gcloud, service account bearer tokens, or approved external identity provider authentication instead of
    long lived static client certificates.
  rationale: Legacy client certificates are harder to govern than identity based authentication because they are long lived
    credentials and are not managed through normal IAM user lifecycle controls. If a client certificate is exposed, access
    can persist until the certificate expires or the cluster certificate authority is rotated, which makes containment and
    revocation more operationally disruptive than disabling a user, group, or service account permission. GKE supports multiple
    Kubernetes API server authentication methods, including OAuth tokens, service account bearer tokens, and X.509 client
    certificates. For administrator access, the gcloud CLI uses OAuth tokens, which reduces the need for legacy static credentials.
    Disabling GKE client certificate issuance prevents GKE from providing the legacy client certificate, but it does not disable
    the Kubernetes certificates API, which is used by the cluster and cannot be disabled.
  impact: Users or automation that still rely on the pre provisioned x509 client certificate will no longer be able to authenticate
    with that credential and must be updated to use approved authentication methods. Existing access workflows, kubeconfig
    files, CI/CD integrations, and break glass procedures should be reviewed before enforcement to avoid disrupting legitimate
    cluster administration.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/api-serverauthentication
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/control-planesecurity
