- id: 5.6.2
  title: Use VPC native GKE clusters with alias IP address ranges
  scoring: scored
  profile:
  - Level 1
  description: Use VPC native GKE clusters with alias IP address ranges so Pod and Service IP addresses are allocated from
    subnet secondary IP address ranges in the cluster’s VPC network. This provides native VPC routing for GKE workloads and
    avoids relying on custom static routes for Pod routing.
  rationale: VPC native clusters improve network planning and control because Pod IP addresses are reserved in the VPC network
    before Pods are created, which helps prevent IP conflicts with other VPC resources. Pod IP ranges also do not depend on
    custom static routes, reducing route scale concerns and allowing automatically generated subnet routes to handle cluster
    routing. Using alias IP address ranges also allows firewall rules to target Pod IP address ranges separately from node
    IP addresses. This improves network segmentation options and supports better visibility and control for GKE workload traffic
    across the VPC network and connected networks.
  impact: VPC native is the default and recommended network mode for new GKE clusters. Existing routes based clusters should
    be evaluated carefully because this network mode is chosen at cluster creation, and the practical remediation is typically
    to create a new VPC native cluster and migrate workloads.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/alias-ips
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/alias-ips
