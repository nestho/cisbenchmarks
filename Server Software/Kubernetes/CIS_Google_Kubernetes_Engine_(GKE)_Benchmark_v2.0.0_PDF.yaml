- id: 5.8.2
  title: Use Google Groups to centrally manage Kubernetes RBAC access for GKE clusters
  scoring: manual
  profile:
  - Level 2
  description: Use Google Groups for RBAC to centrally manage Kubernetes RBAC access for GKE clusters. Cluster administrators
    should assign Kubernetes RoleBinding and ClusterRoleBinding permissions to approved Google Groups rather than directly
    binding access to individual user email addresses.
  rationale: Group based RBAC improves access governance by allowing user onboarding, role changes, and offboarding to be
    managed through centralized group membership instead of editing Kubernetes RBAC bindings for each individual user. This
    reduces inconsistent one off permissions, simplifies access reviews, and helps ensure that access is removed when a user
    leaves the organization or changes responsibilities. For GKE, the required gke-security-groups group acts as the security
    group used to evaluate Google Group membership for Kubernetes RBAC. Approved access groups should be nested under that
    security group and then referenced in Kubernetes RoleBinding or ClusterRoleBinding subjects.
  impact: Migrating to Google Groups for RBAC requires reviewing existing RoleBinding and ClusterRoleBinding subjects to replace
    direct individual user bindings with approved group based bindings. Group membership changes can take time to propagate
    because group information and user credentials are cached, so access changes might not take effect immediately. Avoid
    deleting the required security group or member groups without a migration plan because RBAC bindings that depend on those
    groups can fail and users can lose access.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/google-groupsrbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
