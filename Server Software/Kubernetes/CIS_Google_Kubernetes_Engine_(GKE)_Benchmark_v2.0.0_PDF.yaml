- id: 4.6.2
  title: Require RuntimeDefault seccomp or approved custom profiles for workload pods
  scoring: manual
  profile:
  - Level 2
  description: Require GKE workload pods to use the RuntimeDefault seccomp profile unless an approved custom Localhost profile
    is required. Seccomp should be configured in the pod or container security context to reduce the system calls available
    to containers.
  rationale: Seccomp limits the Linux system calls that a container can make, reducing the kernel attack surface available
    to a compromised workload. In GKE clusters, seccomp profiles must be applied manually because GKE does not apply a profile
    for you. Using RuntimeDefault applies the container runtime’s default seccomp profile, while approved Localhost profiles
    can be used when workloads require more specific syscall controls.
  impact: Workloads that require blocked system calls might fail or behave differently when RuntimeDefault is enforced. If
    RuntimeDefault is too restrictive or not restrictive enough, teams must test and manage approved custom Localhost profiles
    for Standard clusters, including distributing profile files to the appropriate nodes and validating workload compatibility
    before production rollout.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/seccomp-in-gke
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/howto/podsecurityadmission
  page_start: 87
  audit_raw: "Review running Pods across all namespaces and identify containers that do not\nexplicitly use RuntimeDefault\
    \ or an approved Localhost seccomp profile. In GKE\nStandard clusters, seccomp must be applied manually because GKE does\
    \ not apply a\nprofile for you.\necho -e \"NAMESPACE\\tPOD\\tCONTAINER\\tEFFECTIVE_SECCOMP\"\nkubectl get pods -A -o json\
    \ | jq -r '\n  .items[] as $p\n  | ($p.spec.securityContext.seccompProfile.type // \"unset\") as $podProfile\n  | (($p.spec.containers\
    \ // []) + ($p.spec.initContainers // []))[]\n  | (.securityContext.seccompProfile.type // $podProfile) as $effective\n\
    \  | select($effective != \"RuntimeDefault\" and $effective != \"Localhost\")\n  | [$p.metadata.namespace, $p.metadata.name,\
    \ .name, $effective]\n  | @tsv\n'\nAny returned result should be reviewed.\n• unset means neither the Pod nor the container\
    \ explicitly sets a seccomp profile.\n• Unconfined means seccomp is explicitly disabled.\n• Localhost is treated as compliant\
    \ by the command, but should still be approved,\ndocumented, and available on the nodes where the workload runs.\n• No\
    \ returned rows means all checked containers use either RuntimeDefault or\nLocalhost."
  remediation: 'Update the workload controller templates for any Pods returned by the audit so

    seccomp is defined in the source manifest, not patched directly on running Pods. Apply

