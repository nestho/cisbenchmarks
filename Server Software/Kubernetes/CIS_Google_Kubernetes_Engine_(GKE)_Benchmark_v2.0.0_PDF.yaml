- id: 5.10.1
  title: Do not use GKE alpha clusters for production workloads
  scoring: scored
  profile:
  - Level 1
  description: Do not use GKE alpha clusters for production workloads. Alpha clusters are intended only for short lived testing
    of Kubernetes alpha APIs and features, and they are not covered by the GKE SLA.
  rationale: Alpha clusters enable Kubernetes alpha APIs and feature gates so teams can experiment with functionality that
    is not production ready. They are not appropriate for production because they cannot be upgraded, cannot be enrolled in
    a release channel, do not receive security updates, and are automatically deleted after 30 days. GKE also does not automatically
    save data stored on alpha clusters before deletion.
  impact: Production workloads must use supported GKE clusters instead of alpha clusters. Teams that need alpha capabilities
    should isolate testing in nonproduction environments, avoid storing durable data there, plan for the 30 day deletion window,
    and migrate any test artifacts or findings before the alpha cluster expires.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/alpha-clusters
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/creating-an-alphacluster
  page_start: 194
