      \ managed or self managed\nplugin is configured, NetworkPolicy objects are not enforced.\ngcloud container clusters\
      \ describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format=\"table(\n    name,\n\
      \    networkConfig.datapathProvider,\n    networkPolicy.e"
