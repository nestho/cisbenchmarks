- id: 4.4.2
  title: Use Secret Manager for external workload secret storage
  scoring: manual
  profile:
  - Level 2
  description: Use Secret Manager as the preferred external storage and management service for workload secrets used by GKE
    Standard clusters. Workloads should access secrets through Secret Manager API calls using Workload Identity Federation
    for GKE, or through mounted volumes using the Secret Manager add-on when file based access is required.
  rationale: Kubernetes Secrets are supported, but they require careful control through Kubernetes RBAC, namespace boundaries,
    encryption, and workload configuration. Storing sensitive values in Secret Manager centralizes secret lifecycle management
    outside the cluster and supports IAM based access control, auditability, rotation, and version management. Workload Identity
    Federation for GKE lets workloads access Secret Manager without static service account keys and allows access to be granted
    to specific Kubernetes ServiceAccounts.
  impact: Applications might require code, deployment, or configuration changes to retrieve secrets from Secret Manager or
    mounted files instead of relying directly on Kubernetes Secrets. Admins must configure Workload Identity Federation for
    GKE, bind the correct IAM permissions to the workload identity, validate secret access during startup and rotation, and
    update operational procedures for versioning, access review, and troubleshooting.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/workloadidentity-secrets
  - 2. https://docs.cloud.google.com/secret-manager/docs/secret-manager-managedcsi-component
