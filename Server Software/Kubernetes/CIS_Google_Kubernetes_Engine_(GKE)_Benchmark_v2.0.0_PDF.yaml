- id: 5.9.2
  title: Use CMEK protected boot disks for GKE node pools
  scoring: scored
  profile:
  - Level 2
  description: Use CMEK protected boot disks for GKE node pools so node boot disks are encrypted with approved Cloud KMS keys
    managed by the organization. This applies when creating a new cluster or creating a new node pool with the --boot-disk-kms-key
    setting.
  rationale: GKE node boot disks are encrypted at rest by default using Google managed encryption. CMEK provides additional
    control by allowing the organization to manage the Cloud KMS key used for node boot disk encryption, including key access
    control, rotation, separation of duties, and the ability to disable key use when required by security or compliance processes.
    Using CMEK protected boot disks helps align node infrastructure encryption with enterprise key management requirements.
    The Cloud KMS key must be created before use, and the node boot disk key should be specified when creating the cluster
    or node pool.
  impact: CMEK for node boot disks cannot be enabled, changed, or disabled in place for an existing cluster or existing node
    pool. To remediate an existing noncompliant node pool, create a new node pool with the approved --boot-disk-kms-key, migrate
    workloads to the new node pool, validate workload health, and delete the old node pool. For GKE, CMEK protected node boot
    disks are supported only with pd-standard or pd-ssd boot disk types.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/using-cmek
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-controlplane-authority
