- id: 5.5.4
  title: Enroll GKE clusters in release channels for automated version management
  scoring: scored
  profile:
  - Level 1
  description: Enroll GKE clusters in an appropriate release channel to automate version management and align cluster upgrades
    with the organization’s required balance of feature availability, upgrade predictability, and production stability. Release
    channels let teams choose how quickly clusters receive supported Kubernetes versions, patches, security fixes, and GKE
    updates without manually selecting every version.
  rationale: Release channels provide a managed approach for keeping GKE clusters on supported versions. The selected channel
    determines which GKE versions the cluster can run and how quickly the cluster receives new Kubernetes versions, patches,
    security fixes, and GKE platform updates. This reduces version management complexity and helps avoid clusters remaining
    on outdated or unsupported versions. The Regular channel is the default and is appropriate for many production clusters
    that need a balance of stability and timely feature availability. The Stable channel prioritizes production stability
    with slower version adoption, while the Rapid channel provides faster access to newer GKE features. The Extended channel
    can be used when longer support for a minor version is required. Critical security patches are delivered to all release
    channels.
  impact: Enrolling a cluster in a release channel affects how control plane and node upgrades are scheduled. GKE does not
    necessarily upgrade the cluster immediately after enrollment, but the cluster becomes eligible for automatic upgrades
    based on the selected channel, maintenance policies, and upgrade rollout behavior. Maintenance windows and maintenance
    exclusions should be configured to reduce disruption during planned business or application freeze periods.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/releasechannels
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/release-channels
