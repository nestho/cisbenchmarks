- id: 5.10.2
  title: Use GKE Sandbox for untrusted or high risk workloads
  scoring: scored
  profile:
  - Level 2
  description: Use GKE Sandbox for untrusted, third party, multi tenant, or high risk workloads that need stronger isolation
    from the node host. GKE Sandbox uses gVisor to add an isolation layer between the container and the host kernel, reducing
    the risk that untrusted code can affect the node.
  rationale: GKE Sandbox helps protect the host kernel when Pods run unknown or untrusted code. gVisor provides a user space
    kernel that handles most system calls on behalf of the host kernel, which limits direct access to the host kernel and
    helps reduce the impact of container escape vulnerabilities. This control is especially useful for multi-tenant clusters,
    SaaS platforms, web hosting environments, services that process untrusted user input, workloads that run third party code,
    and high value workloads that need additional security. In GKE Standard, sandboxed workloads should use the gvisor RuntimeClass
    and run on node pools enabled for GKE Sandbox.
  impact: GKE Sandbox requires cos_containerd for the sandbox enabled node pool and should be validated for workload compatibility
    before production use. It can affect workloads that need privileged containers, direct host kernel access, direct hardware
    access, kernel level virtualization features, host path behavior, or unsupported low level Linux features. Some accelerator
    workloads are supported only on specific GKE versions and supported GPU or TPU types. GKE Sandbox cannot be disabled on
    an existing Standard node pool, so removing it requires deleting the node pool and migrating workloads.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/sandbox-pods
