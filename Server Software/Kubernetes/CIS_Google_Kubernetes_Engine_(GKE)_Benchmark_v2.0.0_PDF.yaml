    CURRENT_STATE_ALL_OBJECTS_ENCRYPTION_ENABLED, and

    databaseEncryption.keyName references the approved Cloud KMS CryptoKey.

    Updating an existing cluster can restart the control plane and re-encrypt existing data,

    so apply the change during an approved maintenance window, especially for zonal

    clusters.'
