    profile is documented, tested, and available on every node where the workload

    can run.

    • Redeploy the workload and rerun the audit to confirm no unset or Unconfined

    findings remain.

    After remediation, update workload deployment standards so new manifests explicitly

    define RuntimeDefault or an approved custom seccomp profile before release.'
