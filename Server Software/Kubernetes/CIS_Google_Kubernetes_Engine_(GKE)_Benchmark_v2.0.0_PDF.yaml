- id: 5.6.4
  title: Use DNS based access or private GKE control plane endpoints
  scoring: scored
  profile:
  - Level 2
  description: Use DNS based access or private GKE control plane endpoints to reduce Kubernetes API server exposure. Prefer
    DNS based control plane access where possible, and if IP based access is required, disable the external IP based endpoint
    or restrict it to trusted networks only.
  rationale: The GKE control plane supports DNS based endpoints and IP based endpoints. The DNS based endpoint provides a
    stable fully qualified domain name for the control plane and can be protected using IAM, authentication tokens, and VPC
    Service Controls. This approach avoids exposing the control plane through a public IP address and provides a more flexible
    access model for administrators, automation, and private clients. When IP based endpoints are required, disabling the
    external IP based endpoint or using authorized networks limits who can reach the Kubernetes API server. This reduces the
    control plane attack surface and helps protect the cluster if credentials, certificates, or automation tokens are exposed.
    If an external IP based endpoint must remain enabled, access should be restricted to approved CIDR ranges only.
  impact: Restricting GKE control plane access can affect administrators, CI/CD systems, bastion hosts, monitoring tools,
    and automation that currently use the external IP based endpoint. Before disabling the external endpoint or moving to
    DNS based access, confirm that approved users and systems can still connect through the selected access path, such as
    DNS based access, private connectivity, Private Google Access, Cloud NAT, Private Service Connect, VPN, or Cloud Interconnect.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/networkisolation
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/networkisolation
  page_start: 156
  audit_raw: "Review the GKE cluster and verify that control plane access is configured through either\nDNS based access or\
    \ private IP based access with the external endpoint disabled. The\npreferred current approach is to use DNS based access\
    \ where possible. If IP based\naccess is required, the public endpoint should be disabled or tightly restricted.\ngcloud\
    \ container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json\
    \ | jq '.controlPlaneEndpointsConfig'\nReview the command line output for the following:\n• For DNS based access, allowExternalTraffic\
    \ should be true,\nenableK8sTokensViaDns should be true, enableK8sCertsViaDns should be\ntrue, and dnsEndpointConfig.endpoint\
    \ should be populated.\n• For private IP based access, ipEndpointsConfig.enabled should be true,\nipEndpointsConfig.enablePublicEndpoint\
    \ should be false, and\nipEndpointsConfig.privateEndpoint should be populated.\n• If the external IP based endpoint remains\
    \ enabled, authorized networks should\nrestrict access to approved CIDR ranges only.\n• If neither DNS based access nor\
    \ private IP based access is configured, or if the\npublic IP based endpoint is broadly reachable, the cluster should\
    \ be remediated."
  remediation: "Remediate existing GKE clusters by updating the control plane access configuration.\nRecreating the cluster\
    \ is not required for this control. Choose the access model that\nmatches the organization’s approved management path.\n\
    Method 1: Use DNS based control plane access and disable IP based endpoint access\nwhere appropriate:\ngcloud container\
    \ clusters update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --enable-dns-access \\\n\
    \  --no-enable-ip-access\nMethod 2: Use IP based access with the external endpoint disabled and the private\nendpoint\
    \ enabled:\ngcloud container clusters update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n\
    \  --enable-ip-access \\\n  --enable-private-endpoint\nIf the public IP based endpoint must remain enabled, restrict it\
    \ with authorized networks\nand use only approved CIDR ranges. Rerun the audit command and confirm that the\nselected\
    \ access model is reflected in controlPlaneEndpointsConfig. If using DNS\nbased access, update kubeconfig to use the DNS\
    \ endpoint as needed."
  checks:
  - type: manual_review
    info: "Review the GKE cluster and verify that control plane access is configured through either\nDNS based access or private\
