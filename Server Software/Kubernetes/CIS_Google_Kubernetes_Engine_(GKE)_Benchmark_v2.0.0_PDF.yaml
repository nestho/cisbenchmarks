- id: 5.1.2
  title: Grant least privilege IAM access to Artifact Registry repositories
  scoring: manual
  profile:
  - Level 2
  description: Restrict access to Artifact Registry repositories that store GKE Standard workload images. Grant users, groups,
    CI/CD identities, and GKE node service accounts only the IAM roles needed to pull, push, administer, or manage container
    images.
  rationale: Weak IAM access to Artifact Registry can allow unauthorized users to pull sensitive images, push unapproved images,
    overwrite trusted image tags, or delete repository content. Artifact Registry supports repository level IAM, so access
    should be limited to the minimum required role, such as Artifact Registry Reader for image pulls, Artifact Registry Writer
    for image publishing, and repository administrator roles only for approved platform owners. GKE nodes require pull access
    to repositories that host workload images, especially when images are stored in a different project or when using user
    provided node service accounts.
  impact: Tightening Artifact Registry IAM may break GKE image pulls, CI/CD publishing, cross project deployments, or automation
    that depends on broader repository permissions. Validate required service accounts before removing access, especially
    GKE node service accounts, build service accounts, and deployment pipeline identities.
  references:
  - 1. https://docs.cloud.google.com/artifact-registry/docs/access-control
  - 2. https://docs.cloud.google.com/artifact-registry/docs/integrate-gke
  page_start: 99
  audit_raw: "Review IAM access for Artifact Registry Docker repositories that store images deployed\nto GKE Standard clusters.\
    \ Verify that repository permissions are limited to approved\nusers, groups, service accounts, CI/CD identities, and GKE\
    \ node service accounts\nbased on their required function. Artifact Registry access can be granted at the project\nlevel\
    \ or repository level, but repository level IAM should be used when access needs to\ndiffer by application, team, environment,\
    \ or repository.\nList Artifact Registry Docker repositories used by GKE workloads:\ngcloud artifacts repositories list\
    \ \\\n  --project=$PROJECT_ID \\\n  --location=$LOCATION \\\n  --format='table(name,format,mode)'\n• Review each Artifact\
    \ Registry repository IAM policy and verify that only approved\nprincipals have access, with roles limited to the minimum\
    \ required level such as\nReader for image pulls, Writer for image publishing, and repository administrator\nroles only\
    \ for approved platform or repository administrators.\nAnalyze project level IAM bindings that may grant access across\
    \ Artifact Registry\nrepositories in the project. Verify that Artifact Registry roles, Owner, Editor, and Viewer\nare\
    \ granted only to principals that require the same level of access across all\nrepositories. Use repository level IAM\
    \ where access should be limited by application,\nteam, environment, or repository.\nExamine the GKE node service account\
    \ assigned to each node pool and verify that it\nhas only the Artifact Registry permissions required to pull approved\
    \ workload images,\ntypically read only access to the required repositories."
  remediation: 'Apply least privilege IAM access to Artifact Registry Docker repositories that store

    images deployed to GKE Standard clusters. Repository access should be limited to

    approved users, groups, service accounts, CI/CD identities, and GKE node service

    accounts based on their required function. Use repository level IAM where access

    should differ by application, team, environment, or repository, and avoid broad project

    level grants unless the same access is intentionally required across all repositories.

    • Grant GKE node service accounts read only access to the specific Artifact

    Registry repositories they need to pull workload images from by assigning

    roles/artifactregistry.reader at the repository level.

    • Grant CI/CD publishing identities access only to repositories where they need to

    publish images by assigning roles/artifactregistry.writer at the

    repository level.

    • Remove excessive repository level access from unauthorized users, groups,

    service accounts, or public principals, including unnecessary

    roles/artifactregistry.admin, roles/artifactregistry.repoAdmin,

    roles/artifactregistry.writer, or public

    roles/artifactregistry.reader grants.

    • Remove unnecessary project level Artifact Registry roles or broad basic roles

    such as Owner, Editor, and Viewer when repository level access is sufficient for

    the user, group, service account, or automation identity.

    Confirm that GKE node service accounts can still pull approved images and that CI/CD

    identities can only publish to the repositories they are authorized to manage.'
  checks:
  - type: manual_review
    info: 'Review IAM access for Artifact Registry Docker repositories that store images deployed

      to GKE Standard clusters. Verify that repository permissions are limited to approved

      users, groups, service accounts, CI/CD identities, and GKE node service accounts

      based on their required function. Artifact Registry access can be granted at the project

      level or repository level, but repository level IAM should be used when access needs to

      differ by application, team, environment, or repository.

      List Artifact'
