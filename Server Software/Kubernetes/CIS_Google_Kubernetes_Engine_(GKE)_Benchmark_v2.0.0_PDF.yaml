- id: 5.6.7
  title: Use Google managed SSL certificates for GKE Ingress TLS
  scoring: manual
  profile:
  - Level 2
  description: Use Google managed SSL certificates for GKE Ingress TLS to encrypt client traffic between external users and
    the Google Cloud load balancer. Google provisions and renews these certificates for the configured domains, reducing manual
    certificate lifecycle management for supported GKE Ingress use cases.
  rationale: TLS encryption for GKE Ingress helps protect application traffic between clients and the load balancer by preventing
    plaintext exposure over external networks. Google managed SSL certificates reduce operational risk by having Google provision,
    manage, and automatically renew domain validated certificates for supported load balancer and Ingress configurations.
    This control is most appropriate for HTTPS traffic exposed through GKE Ingress. It does not apply to TCP or UDP load balancers
    created through a Service of type LoadBalancer, and GKE Ingress does not support certificates managed by Certificate Manager.
    Use Gateway API if Certificate Manager managed certificates are required.
  impact: Google managed SSL certificates are less flexible than self managed certificates. They support up to 100 non wildcard
    domains, do not support wildcard domains, and cannot be updated in place to add or remove domains. DNS records must point
    to the load balancer for validation and renewal, and provisioning can remain pending until domain ownership and load balancer
    association are confirmed.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/secure-trafficmanagement
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/managed-certs
  page_start: 165
  audit_raw: "Review public application exposure and identify workloads using Service objects of\ntype LoadBalancer. Google\
    \ managed SSL certificates for GKE Ingress apply to HTTPS\nload balancers created through Ingress, not TCP or UDP load\
    \ balancers created directly\nfrom Service objects. Public HTTP or HTTPS workloads exposed through\nLoadBalancer services\
    \ should be reviewed to determine whether GKE Ingress is the\nbetter TLS termination pattern.\nkubectl get svc -A -o json\
    \ | jq '.items[] |\nselect(.spec.type==\"LoadBalancer\")'\n• Expected output: Check for GKE Ingress resources and confirm\
    \ that HTTPS\nIngresses reference one or more Google managed certificates through the\nnetworking.gke.io/managed-certificates\
    \ annotation.\nkubectl get ingress -A -o json | jq '.items[] | {\n  namespace: .metadata.namespace,\n  name: .metadata.name,\n\
    \  managedCertificates: .metadata.annotations.\"networking.gke.io/managedcertificates\",\n  status: .status\n}'\n• Expected\
    \ output: Each applicable HTTPS Ingress should include the\nnetworking.gke.io/managed-certificates annotation with one\
    \ or more\nManagedCertificate resource names. The annotation value is a comma\nseparated list of ManagedCertificate objects\
    \ that must exist in the same\nnamespace as the Ingress.\n{\n  \"networking.gke.io/managed-certificates\": \"example-certificate\"\
    \n}\nVerify that the referenced ManagedCertificate objects exist and are active.\nkubectl get managedcertificates -A\n\
    • Expected output: Each certificate referenced by an Ingress should exist in the\nsame namespace as that Ingress, cover\
    \ the expected domain names, and show\nan active or successfully provisioned status. If the certificate is missing, pending,\n\
    failed, or not referenced by the Ingress annotation, Google managed SSL\ncertificates are not correctly configured for\
    \ that Ingress."
  remediation: 'Remediate public HTTPS workloads by using GKE Ingress with Google managed SSL

    certificates where this pattern is appropriate. This applies to HTTPS traffic terminated by

    the external Application Load Balancer through GKE Ingress and does not apply to TCP

    or UDP workloads exposed through Service objects of type LoadBalancer.

    • For public HTTP or HTTPS workloads exposed directly through Service objects

    of type LoadBalancer, evaluate whether they should be exposed through GKE

    Ingress so Google managed SSL certificates can be used.

    • Create a ManagedCertificate object in the same namespace as the Ingress

    and define the approved non wildcard domain names for the certificate.

    • Update the Ingress metadata to include the networking.gke.io/managedcertificates annotation with the ManagedCertificate
    resource name.

    Multiple managed certificates can be listed as comma separated values when

    needed.

    • Confirm that DNS records for the certificate domains point to the load balancer IP

    address, because Google must validate domain ownership before the certificate

    becomes active.

    • After the certificate is active, verify that the Ingress serves HTTPS traffic using

    the Google managed certificate and remove any obsolete self managed

    certificate references that are no longer required.'
