- id: 3.1.3
  title: Ensure that the kubelet configuration file has permissions set to 644
  scoring: scored
  profile:
  - Level 1
  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file exists, you should restrict its file permissions to maintain the integrity of the file. The file
    should be writable by only the administrators on the system.
  impact: Overly permissive file access increases the security risk to the platform.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 25
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate config file:\nps -efww | grep kubelet | grep -- '--config'\nThe command line output should show a path for\
    \ config similar to --config\n/etc/kubernetes/kubelet-config.yaml which is the location of the config file.\nRun this\
    \ command to obtain the config file permissions:\nstat -c %a /etc/kubernetes/kubelet-config.yaml (or stat -c %a\n/host/etc/kubernetes/kubelet-config.yaml\
    \ if in debub mode)\nThe output of the above command is the Kubelet config file's permissions. Verify that\nthe permissions\
    \ are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged\
    \ enough to access the host's file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount\
    \ the\nnode's file system into the pod.\nHere's an example of a simple pod definition that mounts the root of the host\
    \ to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n\
    \    hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command:\
    \ [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n    \
    \  privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\n\
    Once the pod is running, you can exec into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\n\
    Now you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check\
    \ the permission level of the file:\nls -l /host/etc/kubernetes/kubelet-config.yaml\nVerify that if a file is specified\
    \ and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the following command (using the kubelet config file location):

    chmod 644 <kubelet_config_file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--config' && stat -c %a /etc/kubernetes/kubelet-config.yaml (or stat -c %a
      && ls -l /host/etc/kubernetes/kubelet-config.yaml
    expected: The output of the above command is the Kubelet config file's permissions. Verify that
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate config file:

      ps -efww | grep kubelet | grep -- ''--config''

