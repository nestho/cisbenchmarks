- id: 4.6.3
  title: Require hardened security contexts for all workload Pods and containers
  scoring: manual
  profile:
  - Level 2
  description: Require hardened security contexts for GKE workload Pods and containers. Security contexts should define workload
    level and container level controls that reduce privilege, limit host exposure, and enforce safer runtime behavior.
  rationale: Security contexts control important runtime security settings for Pods and containers, including user and group
    identity, privilege escalation, Linux capabilities, privileged mode, seccomp profile, and related container isolation
    settings. GKE settings help reduce the workload attack surface and should be explicitly defined in workload manifests
    rather than relying on broad runtime defaults. A hardened configuration should normally include settings such as runAsNonRoot=true,
    allowPrivilegeEscalation=false, privileged=false, dropped Linux capabilities, and seccompProfile.type=RuntimeDefault or
    an approved custom profile. These align with restricted Pod security expectations and can also be enforced or audited
    with admission controls such as Pod Security Admission and Policy Controller.
  impact: Incorrectly configured security contexts can cause workloads to fail at startup or lose required runtime behavior,
    especially applications that expect root privileges, writable root filesystems, elevated capabilities, host access, or
    unrestricted system calls. Teams should test hardened settings in lower environments, document approved exceptions, and
    apply container level overrides only where a specific workload requirement exists.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/securityoverview
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/howto/podsecurityadmission
  page_start: 90
  audit_raw: 'Review workload Pods and controller templates to confirm hardened security contexts

    are explicitly defined at the Pod and container level. Focus the audit on workload

    namespaces and verify settings such as runAsNonRoot=true,

    allowPrivilegeEscalation=false, privileged=false, dropped Linux capabilities

    where practical, and seccompProfile.type=RuntimeDefault or an approved custom

    profile. GKE Standard supports using Pod Security Admission, Policy Controller, and

    security posture scanning to identify and enforce workload configuration risks.

    Review any workload that has no security context, runs as root, allows privilege

    escalation, runs privileged, uses broad Linux capabilities, or lacks an approved

    seccomp profile. These findings should be documented as remediation items or

    approved exceptions based on workload requirements.'
  remediation: 'Update workload manifests, Helm charts, overlays, or GitOps sources so hardened

    security contexts are defined before deployment. Apply settings at the Pod level when

    they apply to all containers, and use container level settings where a specific container

    requires a different configuration.

    • Set workloads to run as non root where compatible.

    • Set allowPrivilegeEscalation=false for workload containers.

    • Set privileged=false and remove host level access unless explicitly required.

    • Drop unnecessary Linux capabilities, and use drop: ["ALL"] where the

    application supports it.

    • Set seccompProfile.type=RuntimeDefault or use an approved custom

    Localhost profile.

    Redeploy the workload and validate application behavior in a lower environment before

    broad rollout. Use admission controls such as Pod Security Admission or Policy

    Controller to prevent future workloads from being admitted without the required security

    context settings.'
  checks:
