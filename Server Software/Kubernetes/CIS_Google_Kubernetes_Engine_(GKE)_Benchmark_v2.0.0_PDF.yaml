      additive, so unnec'
    severity: medium
- id: 4.1.8
  title: Avoid binding RBAC roles to unauthenticated users and groups
  scoring: scored
  profile:
  - Level 2
  description: Avoid RoleBinding or ClusterRoleBinding objects that grant permissions to the system:anonymous user or the
    related system:unauthenticated group. These subjects represent unauthenticated Kubernetes API requests and should not
    receive RBAC access to cluster resources.
  rationale: Kubernetes uses system:anonymous for requests that do not provide authentication credentials, and unauthenticated
    requests can also be associated with the system:unauthenticated group. Binding RBAC roles to either subject can grant
    unauthenticated callers access to Kubernetes API resources. This is especially risky if the binding includes broad roles,
    wildcard permissions, Secret access, workload access, or namespace wide permissions. GKE can limit anonymous authentication
    so unauthenticated requests are rejected for non health check endpoints before RBAC evaluation. Even with that protection
    available, RBAC bindings to system:anonymous or system:unauthenticated should be avoided because they create unnecessary
    exposure and undermine least privilege access.
  impact: Removing bindings to system:anonymous or system:unauthenticated can affect workloads, scripts, or integrations that
    incorrectly rely on unauthenticated Kubernetes API access. Before removal, validate that required access uses an authenticated
    user, group, or service account with least privilege RBAC permissions.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster
