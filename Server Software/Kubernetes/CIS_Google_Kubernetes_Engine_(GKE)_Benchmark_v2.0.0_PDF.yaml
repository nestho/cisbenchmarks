    \ networkPolicy.enabled\nis True, networkPolicy.provider is CALICO, and\naddonsConfig.networkPolicyConfig.disabled is\
    \ False. Both the NetworkPolicy\nadd-on and node enforcement are required for NetworkPolicies to function.\nNAME     \
    \  DATAPATH_PROVIDER  ENABLED  PROVIDER  DISABLED\ncluster-1  LEGACY_DATAPATH    True     CALICO    False\n• Any other\
    \ combination should be reviewed as noncompliant or incomplete,\nespecially legacy datapath clusters with missing or false\
