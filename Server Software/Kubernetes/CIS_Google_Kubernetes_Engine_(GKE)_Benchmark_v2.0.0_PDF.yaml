controls:
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is configured by a kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: Ensuring that the kubeconfig file permissions are set to 644 or more restrictive significantly strengthens the security
    posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to the kubeconfig
    file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk of malicious alterations
    that could compromise the cluster's integrity. However, this configuration may slightly impact usability, as it limits
    the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators will need to
    balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing kubelet
    configurations.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 19
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the kubeconfig\n\
    file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %a /var/lib/kubelet/kubeconfig (or stat -c\
    \ %a\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig file's\
    \ permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more restrictive.\nMethod\
    \ 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's file\
    \ system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system into\
    \ the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n    \
    \  path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"\
    ]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n      privileged: true\nSave\
    \ this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is\
    \ running, you can exec into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are\
    \ in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check the permission\
    \ level of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nVerify that if a file is specified and it exists, the permissions\
    \ are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %a /var/lib/kubelet/kubeconfig (or stat -c %a &&
      ls -l /host/var/lib/kubelet/kubeconfig
    expected: Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/var/li'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kubelet controls various parameters for the kubelet service in the worker node. You should
    set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: Overly permissive file access increases the security risk to the platform.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 22
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
