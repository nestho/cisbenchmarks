    \ node-pools update $POOL_NAME \\\n  --cluster=$CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID \\\
    \n  --enable-autorepair\nAfter remediation, rerun the audit command and confirm that management.autoRepair\nreturns true.\
