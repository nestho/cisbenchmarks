      \ possible. If IP based\naccess is required, the public endpoint should be disabled or tightly restricted.\ngcloud container\
      \ clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json | jq '.controlPlaneEndpointsConfig'\n\
      Review t"
