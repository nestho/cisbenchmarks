- id: 5.5.2
  title: Verify node auto-repair is enabled for GKE node pools
  scoring: scored
  profile:
  - Level 2
  description: Verify node auto-repair is enabled for GKE node pools so unhealthy nodes are automatically repaired and returned
    to a healthy running state. Node auto-repair is enabled by default for new node pools, but for older node pools should
    still be reviewed for compliance.
  rationale: Node auto-repair helps maintain cluster reliability by periodically checking node health and initiating repair
    when a node remains unhealthy for an extended period. When repair is triggered, GKE drains and re-creates the affected
    node, helping reduce the risk of workloads remaining scheduled on degraded or nonfunctional infrastructure. Keeping auto-repair
    enabled reduces the need for manual node recovery and helps ensure that node level failures are remediated consistently
    across node pools. This is especially important for production clusters where unhealthy nodes can affect workload availability,
    scheduling capacity, and operational response time.
  impact: If node auto-repair is triggered, workloads on the affected node can be disrupted while GKE drains and re-creates
    the node. If multiple nodes require repair, GKE might repair nodes in parallel, with repair concurrency based on cluster
    size and the number of unhealthy nodes. Workloads should use appropriate replica counts, disruption budgets, and scheduling
    practices to tolerate node replacement events.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-repair
  - 2. https://docs.cloud.google.com/kubernetesengine/docs/reference/rest/v1/NodeManagement
  page_start: 127
