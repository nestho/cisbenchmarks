- id: 5.6.5
  title: Ensure private GKE nodes are configured without external IP addresses
  scoring: scored
  profile:
  - Level 1
  description: Configure GKE nodes without external IP addresses so worker nodes are reachable only through internal network
    paths. Private nodes reduce direct exposure of the node network interface to external clients while still allowing the
    cluster to run workloads and communicate with the control plane through internal connectivity.
  rationale: Nodes with external IP addresses increase the externally reachable surface of the cluster infrastructure. Configuring
    private nodes limits direct inbound access to the node VMs from the internet and helps ensure node administration, workload
    traffic, and supporting services use approved private connectivity patterns, firewall rules, and controlled egress paths.
    Private nodes also support stronger network isolation because workloads run on nodes with only internal IP addresses.
    If internet or Google API access is required, it should be provided through controlled paths such as Cloud NAT, Private
    Google Access, or approved private connectivity rather than direct external IP assignment on the nodes.
  impact: Enabling private nodes can affect workloads, node startup, image pulls, package downloads, and integrations that
    require outbound access beyond the cluster network. Cloud NAT or an approved NAT solution is required for internet egress,
    and Private Google Access might be required for private nodes to reach Google APIs and services, especially in Shared
    VPC environments. In GKE, private node settings can be changed, but cluster level changes apply only to new node pools,
    while existing node pools must be updated separately.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/networkisolation
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/networkisolation
  page_start: 159
  audit_raw: "Review the GKE cluster and node pools to verify that private nodes are configured\nwithout external IP addresses.\
    \ Private nodes can be configured at the cluster level as\nthe default for new node pools, or directly at the node pool\
    \ level. For this control, each\nnode pool should be reviewed because node pool level settings can override the cluster\n\
    level default.\nCheck the cluster level private node default:\ngcloud container clusters describe $CLUSTER_NAME \\\n \
    \ --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json | jq '.privateClusterConfig.enablePrivateNodes'\n\
    • Expected output: true. If the result is false, blank, or missing, the cluster level\ndefault does not require new node\
    \ pools to use private nodes.\nCheck each node pool for private node configuration:\ngcloud container node-pools describe\
    \ $POOL_NAME \\\n  --cluster $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json\
    \ | jq '.networkConfig.enablePrivateNodes'\n• Expected output: true. If the result is false, blank, or missing, the node\
    \ pool\nshould be reviewed and remediated because it might provision nodes with\nexternal IP addresses."
  remediation: "Remediate by enabling private nodes at the cluster level for new node pools and at the\nnode pool level for\
    \ existing node pools. Private nodes provision GKE nodes with internal\nIP addresses only. GKE does not automatically\
    \ modify existing node pools when the\ncluster level setting is changed, so existing node pools must be updated separately.\n\
