- id: 4.2.1
  title: Enforce baseline or restricted Pod Security Standards on workload namespaces
  scoring: manual
  profile:
  - Level 1
  description: Pod Security Standards provide predefined pod security profiles that can be applied to GKE Standard workload
    namespaces through the built in PodSecurity admission controller. At minimum, workload namespaces should enforce the baseline
    profile, with restricted used where stronger pod hardening is required.
  rationale: Without enforce mode applied to workload namespaces, GKE can allow pods that violate the intended Pod Security
    Standard to be admitted. The baseline profile helps prevent known privilege escalation patterns, while the restricted
    profile adds stronger controls such as requiring allowPrivilegeEscalation=false, dropping all Linux capabilities, running
    as non root, and using an allowed seccomp profile. warn and audit are useful for rollout and visibility, but they do not
    block noncompliant pods.
  impact: Enforcing baseline or restricted can block workloads that require privileged containers, unsafe security context
    settings, or other pod configurations that violate the selected profile. Existing running pods are not terminated by PodSecurity,
    so it's important to test with warn and audit before moving workload namespaces to enforce.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/howto/podsecurityadmission
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/migratepodsecuritypolicy
  page_start: 61
  audit_raw: "Run the following command to list workload namespaces that do not enforce either the\nbaseline or restricted\
    \ Pod Security Standard. The restricted profile satisfies this control\nbecause it is more restrictive than baseline.\
    \ PodSecurity is applied to namespaces with\nlabels, and enforce mode rejects violating pod creation while audit and warn\
    \ do not\nblock pods.\nkubectl get namespace -o json | jq -r\nOr to filter run:\nkubectl get namespace -o json | jq -r\
    \ '\n  [\"NAMESPACE\",\"ENFORCE\"],\n  (\n    .items[]\n    | select(.metadata.name | test(\"^(kube-system|kube-public|kube-nodelease)$\"\
    ) | not)\n    | [\n        .metadata.name,\n        (.metadata.labels[\"pod-security.kubernetes.io/enforce\"] // \"missing\"\
    )\n      ]\n    | select(.[1] != \"baseline\" and .[1] != \"restricted\")\n  )\n  | @tsv\n'\nReview any namespace returned\
    \ by the command and confirm whether it contains user\nworkloads. For GKE versions where policies applied to kube-system\
    \ are ignored, do\nnot use kube-system as the enforcement target for this control."
  remediation: "Update workload namespaces so Pod Security enforcement is applied consistently\nthrough namespace labels.\
    \ Use restricted where workloads can support it, and use\nbaseline where compatibility requires a less restrictive profile.\n\
    • Identify all namespaces that host user workloads and confirm each one uses\npod-security.kubernetes.io/enforce=baseline\
    \ or podsecurity.kubernetes.io/enforce=restricted.\n• Test the selected profile before enforcement using server side dry\
    \ run, especially\nwhen moving from no enforcement to restricted.\n• Remediate violating workload specs by updating security\
    \ contexts, privilege\nsettings, host namespace usage, volume types, and Linux capability settings.\nkubectl edit deployment/<deployment-name>\
    \ -n $NAMESPACE\nkubectl rollout restart deployment/<deployment-name> -n $NAMESPACE\n• Apply the enforcement label only\
    \ after violations are resolved or formally\napproved as exceptions.\nkubectl label --overwrite namespace $NAMESPACE \\\
    \n  pod-security.kubernetes.io/enforce=baseline\nOr, for stricter enforcement:\nkubectl label --overwrite namespace $NAMESPACE\
    \ \\\n  pod-security.kubernetes.io/enforce=restricted\n• Do not rely on warn or audit labels alone because they report\
    \ violations but do\nnot block noncompliant pod creation.\nAfter remediation, update namespace provisioning standards\
    \ so new workload\nnamespaces receive the appropriate Pod Security enforcement label at creation.\nPeriodically recheck\
    \ namespace labels to confirm that enforcement remains in place as\nteams, applications, and environments change."
  checks:
  - type: manual_review
    info: "Run the following command to list workload namespaces that do not enforce either the\nbaseline or restricted Pod\
      \ Security Standard. The restricted profile satisfies this control\nbecause it is more restrictive than baseline. PodSecurity\
      \ is applied to namespaces with\nlabels, and enforce mode rejects violating pod creation while audit and warn do not\n\
      block pods.\nkubectl get namespace -o json | jq -r\nOr to filter run:\nkubectl get namespace -o json | jq -r '\n  [\"\
      NAMESPACE\",\"ENFORCE\"],\n  (\n    .items[]"
    severity: medium
- id: 4.3.1
  title: Enable NetworkPolicy enforcement with GKE Dataplane V2 or Calico
  scoring: manual
  profile:
  - Level 1
  description: NetworkPolicy enforcement should be enabled for GKE clusters by using a supported enforcement mechanism, either
    GKE Dataplane V2 or the Calico network policy plugin. Without a supported enforcement mechanism, Kubernetes NetworkPolicy
    objects cannot reliably restrict pod to pod, pod to service, ingress, or egress traffic.
  rationale: NetworkPolicies define pod level traffic rules, but enforcement depends on the networking implementation used
    by the cluster. In GKE, the GKE Dataplane V2 is the recommended network plugin and uses Cilium and eBPF for routing, load
    balancing, and NetworkPolicy enforcement. Calico is also available for Standard clusters and enforces NetworkPolicy through
    the cluster network plugin. By default, pods in a cluster can communicate freely. Enabling NetworkPolicy enforcement allows
    teams to implement defense in depth, namespace based segmentation, tenant isolation, and explicit ingress and egress controls
    for approved workload communication paths.
  impact: Enabling NetworkPolicy enforcement can change workload connectivity because traffic not explicitly allowed by policy
    might be denied. For clusters that do not use GKE Dataplane V2, enabling NetworkPolicy enforcement can recreate node pools
    and may disrupt manually deployed pods. For clusters using GKE Dataplane V2, NetworkPolicy enforcement is built in and
    should not be separately enabled or disabled.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/network-policy
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dataplane-v2
  page_start: 65
  audit_raw: "Review the GKE Standard cluster configuration and verify that NetworkPolicy\nenforcement is available through\
    \ GKE Dataplane V2 or Calico. NetworkPolicy requires\na network plugin to implement enforcement. GKE Dataplane V2 is the\
    \ recommended\noption, and Calico is available for Standard clusters. If no managed or self managed\nplugin is configured,\
    \ NetworkPolicy objects are not enforced.\ngcloud container clusters describe $CLUSTER_NAME\\\n  --location $LOCATION\
    \ \\\n  --project \"$PROJECT_ID\" \\\n  --format=\"table(\n    name,\n    networkConfig.datapathProvider,\n    networkPolicy.enabled,\n\
    \    networkPolicy.provider,\n    addonsConfig.networkPolicyConfig.disabled\n  )\"\n• Expected output: The cluster satisfies\
    \ this control if\nnetworkConfig.datapathProvider is ADVANCED_DATAPATH, because\nKubernetes NetworkPolicy is always on\
    \ for clusters that use GKE Dataplane V2.\nNAME       DATAPATH_PROVIDER  ENABLED  PROVIDER  DISABLED\ncluster-1  ADVANCED_DATAPATH\
    \                     True\nIf the cluster uses the legacy datapath, verify that networkPolicy.enabled is true,\nnetworkPolicy.provider\
    \ is CALICO, and\naddonsConfig.networkPolicyConfig.disabled is false. Both the NetworkPolicy\nadd-on and node enforcement\
    \ are required for policies to function."
  remediation: "For noncompliant GKE Standard clusters, update the cluster build standard so a\nsupported NetworkPolicy enforcement\
    \ option is selected during cluster creation. Use\nGKE Dataplane V2 where possible, or Calico based NetworkPolicy enforcement\
    \ where\nDataplane V2 is not used. GKE Dataplane V2 is selected only during cluster creation,\nand existing clusters cannot\
    \ be upgraded to use it.\n• Select GKE Dataplane V2 when creating new or replacement GKE Standard\nclusters, because NetworkPolicy\
    \ enforcement is built into Dataplane V2.\nFor existing legacy datapath clusters that cannot be recreated immediately,\
    \ enable\nCalico based NetworkPolicy enforcement as an interim remediation path by enabling\nboth the NetworkPolicy add-on\
    \ and node enforcement. Enabling only the add-on does\nnot enforce policies, and enabling node enforcement recreates node\
    \ pools, so plan the\nchange during an approved maintenance window.\ngcloud container clusters update $CLUSTER_NAME \\\
    \n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --update-addons=NetworkPolicy=ENABLED\ngcloud container clusters\
    \ update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --enable-network-policy\nAfter remediation,\
    \ validate that the cluster either reports ADVANCED_DATAPATH or reports\nnetworkPolicy.enabled=True, networkPolicy.provider=CALICO,\
    \ and\naddonsConfig.networkPolicyConfig.disabled=False."
  checks:
  - type: manual_review
    info: "Review the GKE Standard cluster configuration and verify that NetworkPolicy\nenforcement is available through GKE\
      \ Dataplane V2 or Calico. NetworkPolicy requires\na network plugin to implement enforcement. GKE Dataplane V2 is the\
      \ recommended\noption, and Calico is available for Standard clusters. If no managed or self managed\nplugin is configured,\
      \ NetworkPolicy objects are not enforced.\ngcloud container clusters describe $CLUSTER_NAME\\\n  --location $LOCATION\
      \ \\\n  --project \"$PROJECT_ID\" \\\n  --format="
    severity: medium
- id: 4.3.2
  title: Define default deny NetworkPolicies for each workload namespace
  scoring: scored
  profile:
  - Level 2
  description: Use NetworkPolicy objects to define default deny traffic controls for each GKE workload namespace, then add
    explicit allow rules for approved pod, service, namespace, ingress, and egress communication paths. GKE uses NetworkPolicy
    enforcement to create pod level firewall rules that control which Pods and Services can communicate inside the cluster.
  rationale: Pods in a GKE cluster can communicate freely with each other, which increases the risk that a compromised workload
    can reach unrelated applications or services in the same cluster. Default deny NetworkPolicies help establish namespace
    level segmentation by denying traffic unless a policy explicitly allows it. This supports defense in depth, multitenancy,
    and stronger separation between applications, environments, and teams. NetworkPolicy enforcement must also be enabled
    through a supported GKE mechanism, such as GKE Dataplane V2 or Calico for Standard clusters. If no enforcing network plugin
    is configured, NetworkPolicy objects are not enforced, which means defined policies might not restrict traffic.
  impact: Default deny policies can immediately block workload communication that is not explicitly allowed, including application
    to application traffic, DNS, metadata server access, and required egress paths. Admins should identify required flows,
    define explicit ingress and egress allow rules, and validate connectivity before broad rollout. If Workload Identity Federation
    for GKE is used, egress to the metadata server must be allowed where required.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/network-policy
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/network-policy
