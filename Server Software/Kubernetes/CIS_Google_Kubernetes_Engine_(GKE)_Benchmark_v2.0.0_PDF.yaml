- id: 5.9.1
  title: Use CMEK protected StorageClasses for GKE Persistent Disk volumes
  scoring: manual
  profile:
  - Level 2
  description: Use CMEK protected StorageClass objects for GKE Persistent Disk volumes so newly provisioned Persistent Disks
    are encrypted with an approved Cloud KMS key. This applies to dynamically provisioned Persistent Disk volumes that use
    the Compute Engine Persistent Disk CSI driver and the disk-encryption-kms-key parameter.
  rationale: Persistent Disks are encrypted at rest by default, but CMEK gives the organization direct control over the Cloud
    KMS key used to protect the disk encryption keys. This supports stronger key governance, including key access control,
    rotation, separation of duties, and the ability to disable key use when required by security or compliance processes.
    Using a CMEK protected StorageClass helps ensure that new Persistent Disk volumes created by Kubernetes are encrypted
    consistently with approved key material. The disk-encryption-kms-key value must reference the fully qualified Cloud KMS
    key resource, and the key ring location must align with the cluster location requirements.
  impact: CMEK protection applies to new Persistent Disks created through the CMEK enabled StorageClass, it does not retroactively
    change existing disks. The disk-encryptionkms-key parameter cannot be added to an existing StorageClass, so the StorageClass
    must be recreated or replaced if CMEK was not included. The Compute Engine service agent for the cluster project must
    have roles/cloudkms.cryptoKeyEncrypterDecrypter on the key, and CMEK protection cannot be removed from an existing Persistent
    Disk except by creating a new disk from a snapshot with different encryption settings.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/using-cmek
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/persistentvolumes
  page_start: 186
  audit_raw: "Review GKE StorageClass objects and verify that Persistent Disk classes use the\nCompute Engine Persistent Disk\
    \ CSI driver with an approved Cloud KMS key. The\ndisk-encryption-kms-key parameter should contain the fully qualified\
    \ Cloud KMS\nkey resource path used to encrypt newly provisioned Persistent Disk volumes.\nkubectl get storageclass -o\
    \ json | jq '.items[] |\nselect(.provisioner==\"pd.csi.storage.gke.io\") | {\n  name: .metadata.name,\n  provisioner:\
    \ .provisioner,\n  kmsKey: .parameters.\"disk-encryption-kms-key\"\n}'\n• Expected output: Each approved Persistent Disk\
    \ StorageClass used for\nsensitive workloads should show pd.csi.storage.gke.io as the provisioner\nand a non null kmsKey\
    \ value that matches an approved Cloud KMS key. If\nkmsKey is null, blank, missing, or does not reference an approved\
    \ key, newly\nprovisioned Persistent Disk volumes using that StorageClass are not configured\nfor CMEK.\nIdentify existing\
    \ PersistentVolumes and review the associated StorageClass and\nunderlying disk reference.\nkubectl get pv -o json | jq\
    \ -r '.items[] | [.metadata.name,\n.spec.storageClassName, .spec.csi.volumeHandle] | @tsv'\n• Expected output: PersistentVolumes\
    \ backed by GKE Persistent Disk should\nreference an approved CMEK protected StorageClass. The volumeHandle\nvalue should\
    \ identify the underlying Compute Engine disk used for the\nPersistentVolume.\nFor each Persistent Disk identified, verify\
    \ that the disk is encrypted with the approved\nCloud KMS key.\ngcloud compute disks describe $DISK_NAME \\\n  --zone\
    \ $ZONE \\\n  --project $PROJECT_ID \\\n  --format='value(diskEncryptionKey.kmsKeyName)'\n• Expected output: the command\
    \ should return the approved Cloud KMS key\nname. If the result is empty or null, the Persistent Disk is not encrypted\
    \ with\nCMEK."
  remediation: 'Remediate any StorageClass or Persistent Disk that does not use an approved Cloud

    KMS key. CMEK for GKE Persistent Disk volumes is applied through a CMEK protected

    StorageClass for new dynamically provisioned volumes. Existing Persistent Disks

    cannot be converted to CMEK in place, so noncompliant volumes must be replaced or

    migrated.

    • Grant the Compute Engine service agent for the cluster project

    roles/cloudkms.cryptoKeyEncrypterDecrypter on the approved Cloud KMS

    key.

    • Create a new CMEK protected StorageClass using the Persistent Disk CSI

    driver, pd.csi.storage.gke.io, and the approved disk-encryption-kms-key

    value.

    • Update new PersistentVolumeClaims to use the CMEK protected

    StorageClass. If this should be the default storage option, mark the CMEK

    protected StorageClass as the default only after validating the key, location, and

    access permissions.

    • For existing PersistentVolumes that do not return an approved

    diskEncryptionKey.kmsKeyName, provision a new CMEK protected Persistent

    Disk through the approved StorageClass, migrate the data, update the workload

    to use the new PersistentVolumeClaim, and retire the old volume after

    validation.

    • Rerun the audit commands and confirm that the StorageClass includes the

    approved disk-encryption-kms-key, the PersistentVolumes reference the

    expected StorageClass, and the underlying Compute Engine disks return the

    approved Cloud KMS key.'
