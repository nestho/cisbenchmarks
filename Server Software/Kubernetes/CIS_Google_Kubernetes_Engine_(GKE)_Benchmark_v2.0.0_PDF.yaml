    \ for this path.\nNAME       DATAPATH_PROVIDER  ENABLED  PROVIDER  DISABLED\ncluster-1  ADVANCED_DATAPATH            \
    \         True\nCalico audit path:\nIf the cluster uses the legacy datapath, confirm that Calico based NetworkPolicy\n\
