    \ for the cluster:\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID\
    \ \\\n  --format='json(databaseEncryption)'\n• Expected result: databaseEncryption.state should return\nALL_OBJECTS_ENCRYPTION_ENABLED,\
    \ databaseEncryption.currentState\nshould return CURRENT_STATE_ALL_OBJECTS_ENCRYPTION_ENABLED, and\ndatabaseEncryption.keyName\
    \ should reference the approved Cloud KMS\nCryptoKey. If state or currentState shows a disabled, decrypted, or\ntransitional\
    \ value, or if keyName does not match the approved Cloud KMS key,\napplication layer encryption is not correctly configured."
  remediation: 'Enable application layer encryption on the GKE Standard cluster when the audit shows

    that databaseEncryption.state is not ALL_OBJECTS_ENCRYPTION_ENABLED,

