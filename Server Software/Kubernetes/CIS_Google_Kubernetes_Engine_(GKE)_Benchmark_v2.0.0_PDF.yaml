- id: 5.5.7
  title: Ensure Secure Boot is enabled for Shielded GKE node pools
  scoring: scored
  profile:
  - Level 2
  description: Enable Secure Boot for Shielded GKE node pools to verify the digital signature of node VM boot components,
    including the kernel and bootloader, during the boot process. Secure Boot helps ensure that only trusted boot components
    are allowed to run when the node starts.
  rationale: Secure Boot helps reduce the risk of boot level compromise by verifying the authenticity of node boot components
    before the operating system starts. If signature verification fails, the boot process is halted, which helps prevent nodes
    from starting with tampered bootloaders, kernels, or other unauthorized low level components. This control complements
    Shielded GKE Nodes and integrity monitoring by strengthening node startup integrity. Shielded GKE Nodes, Secure Boot,
    and integrity monitoring are independent features, so Secure Boot should be explicitly reviewed for each applicable node
    pool rather than assumed from the cluster level Shielded GKE Nodes setting.
  impact: Secure Boot is disabled by default for GKE node pools and should be tested before enablement. On Ubuntu nodes, Secure
    Boot blocks unsigned third party kernel modules from loading, which can affect workloads or agents that depend on custom
    drivers or kernel extensions.
  references:
