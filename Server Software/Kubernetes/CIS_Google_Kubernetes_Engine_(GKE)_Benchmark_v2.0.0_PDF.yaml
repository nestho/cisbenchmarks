- id: 4.4.1
  title: Prefer using secrets as files over secrets as environment variables
  scoring: scored
  profile:
  - Level 2
  description: GKE workloads should avoid consuming secrets as environment variables. Prefer accessing secrets directly from
    Secret Manager by using Workload Identity Federation for GKE and client libraries, or mount secrets as files by using
    the Secret Manager addon when file based access is required.
  rationale: Secrets exposed as environment variables can be unintentionally disclosed through application logs, debug output,
    crash reports, process inspection, or overly broad troubleshooting access. Direct Secret Manager API access reduces secret
    exposure inside the cluster and avoids long lived service account keys when paired with Workload Identity Federation for
    GKE. Mounted files are still preferable to environment variables when the application cannot call the Secret Manager API
    directly, but file permissions, pod access, and IAM bindings must be tightly controlled.
  impact: Applications that currently read secrets from environment variables might need code, configuration, or deployment
    changes to read secrets from the Secret Manager API or from mounted files. Workloads must use an appropriate Kubernetes
    ServiceAccount, IAM permissions must allow access to the required Secret Manager secrets, and teams should validate startup
    behavior, secret rotation handling, and file path configuration before deployment.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/workloadidentity-secrets
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  page_start: 73
  audit_raw: "Review workload manifests and running Pods to identify containers that consume\nKubernetes Secrets through environment\
    \ variables. The audit should check both\nenv.valueFrom.secretKeyRef and envFrom.secretRef, including regular containers\n\
    and init containers. Secrets should be accessed through Secret Manager API with\nWorkload Identity Federation for GKE\
    \ where possible, or through mounted files using\nthe Secret Manager add-on when file based access is required.\necho\
    \ -e \"KIND\\tNAMESPACE\\tNAME\\tCONTAINER\\tSECRET_ENV_TYPE\"\nkubectl get deploy,sts,ds,job,cronjob,pod -A -o json |\
    \ jq -r '\n  .items[] as $i\n  | ($i.spec.template.spec // $i.spec.jobTemplate.spec.template.spec //\n$i.spec) as $s\n\
    \  | (($s.containers // []) + ($s.initContainers // []))[]\n  | select(any(.env[]?; .valueFrom.secretKeyRef) or any(.envFrom[]?;\n\
    .secretRef))\n  | [\n      $i.kind,\n      $i.metadata.namespace,\n      $i.metadata.name,\n      .name,\n      if any(.env[]?;\
    \ .valueFrom.secretKeyRef) then \"secretKeyRef\" else\n\"secretRef\" end\n    ]\n  | @tsv\n'\nSample output would look\
    \ like this:\nKIND        NAMESPACE     NAME                    CONTAINER\nSECRET_ENV_TYPE\nDeployment default       my-app\
    \                  my-app-container\nsecretKeyRef\nPod         default       my-app-f5966f8b4-p2h    my-app-container\n\
    secretKeyRef\nStatefulSet database      postgres                postgres\nsecretKeyRef\nDaemonSet   monitoring    log-agent\
    \               fluent-bit\nsecretRef\nJob         batch         nightly-import          importer\nsecretKeyRef\nCronJob\
    \     reporting     report-generator        generator\nsecretRef\nPod         default       test-secret-env         app\n\
    secretKeyRef\nInterpretation:\n• secretKeyRef indicates the workload references a specific key from a Secret in\nan environment\
    \ variable.\n• secretRef indicates the workload imports all keys from a Secret into\nenvironment variables using envFrom.\n\
    Any result indicates a workload that should be reviewed for remediation. Prioritize\nworkloads that expose high value\
    \ credentials, run in shared namespaces, have broad\nlog access, or can be changed to use Secret Manager API access through\
    \ a\nKubernetes ServiceAccount and IAM permissions."
  remediation: 'Update workloads to avoid passing secrets through environment variables. Prefer direct

    Secret Manager API access through Workload Identity Federation for GKE and Google

    Cloud client libraries. This keeps sensitive data outside cluster storage, avoids long

    lived service account keys, and uses IAM rather than in cluster RBAC for Secret

    Manager access.

    • Modify application code to read secrets from Secret Manager API where

    possible.

    • Use a dedicated Kubernetes ServiceAccount for each workload identity that

    needs Secret Manager access.

    • Grant only the required Secret Manager IAM permissions to that workload

    identity.

    • When code cannot call the API directly, use the Secret Manager add-on to mount

    secrets as files in the Pod file system.

    • Remove secretKeyRef and secretRef environment variable usage from

    workload manifests after the new access pattern is validated.

    For mounted file access, enable the Secret Manager add-on and define a

    SecretProviderClass that maps specific Secret Manager secrets to Pod volumes.

    The add-on lets applications access Secret Manager secrets as mounted volumes and

    supports centralized Secret Manager capabilities such as fine grained access control,

    rotation, lifecycle management, and audit logs.'
  checks:
  - type: manual_review
    info: 'Review workload manifests and running Pods to identify containers that consume

      Kubernetes Secrets through environment variables. The audit should check both

      env.valueFrom.secretKeyRef and envFrom.secretRef, including regular containers

      and init containers. Secrets should be accessed through Secret Manager API with

      Workload Identity Federation for GKE where possible, or through mounted files using

      the Secret Manager add-on when file based access is required.

      echo -e "KIND\tNAMESPACE\tNAME\tCONTAI'
