- id: 5.5.3
  title: Verify node auto-upgrade is enabled for GKE node pools
  scoring: scored
  profile:
  - Level 2
  description: Verify node auto-upgrade is enabled for GKE node pools so nodes receive supported Kubernetes versions, node
    image updates, and security fixes through the managed upgrade process. Node auto-upgrade is enabled by default for new
    GKE node pools, but it should still be reviewed for older node pools.
  rationale: Node auto-upgrade helps keep node pools aligned with supported GKE versions and current node image updates without
    requiring manual upgrade coordination for every patch or security release. When enabled, GKE automatically schedules eligible
    node pools for upgrade as new auto-upgrade targets become available, while considering release channel behavior, maintenance
    policies, and other upgrade constraints. From a security and reliability perspective, keeping node auto-upgrade enabled
    reduces the risk of running outdated node software, unsupported Kubernetes versions, or node images that are missing important
    fixes. It also helps keep nodes compatible with the upgraded control plane, because GKE nodes must run the same or an
    earlier version than the control plane.
  impact: Enabling node auto-upgrade does not immediately upgrade nodes. Automatic upgrades are scheduled by GKE and can be
