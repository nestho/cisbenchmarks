    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the kubeconfig\n\
    file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %U:%G /var/lib/kubelet/kubeconfig (or stat\
    \ -c %U:%G\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig\
    \ file's ownership. Verify that\nthe ownership is set to root:root.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will\
    \ need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying a pod\
    \ that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a simple pod definition\
    \ that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\n\
    spec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name:\
    \ nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath:\
    \ /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the\
    \ pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file ownership on\
    \ the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access the node's file\
    \ system through\nthe /host directory and check the ownership of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nThe\
    \ output of the above command gives you the kubeconfig file's ownership. Verify that\nthe ownership is set to root:root."
  remediation: 'Run the below command (based on the file location on your system) on each worker

    node.

    For example,

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %U:%G /var/lib/kubelet/kubeconfig (or stat -c %U:%G
      && ls -l /host/var/lib/kubelet/kubeconfig
    expected: The output of the above command gives you the kubeconfig file's ownership. Verify that
    severity: medium
    info: 'Method 1

