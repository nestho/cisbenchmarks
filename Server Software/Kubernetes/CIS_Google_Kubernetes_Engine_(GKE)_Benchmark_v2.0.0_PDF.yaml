- id: 5.6.3
  title: Restrict GKE control plane access with authorized networks
  scoring: scored
  profile:
  - Level 2
  description: Restrict GKE control plane access by enabling authorized networks for IP based control plane endpoints and
    allowing only approved CIDR ranges. This reduces exposure of the Kubernetes API server by limiting which source IP ranges
    can reach the control plane over the configured IP endpoint.
  rationale: GKE control plane access can use DNS based endpoints and IP based endpoints. When IP based endpoints are enabled,
    authorized networks provide an IP based access control layer that limits control plane reachability to approved CIDR ranges.
    Without authorized networks, the control plane IP endpoint can be reachable from any external IP address, including public
    internet addresses and Google Cloud external IP addresses, subject to authentication and authorization. Restricting access
    to approved CIDR ranges reduces the control plane attack surface and helps protect the Kubernetes API server if credentials,
    certificates, or automation tokens are exposed. For stronger control plane isolation, authorized networks should be combined
    with private endpoint configuration where appropriate, denial of broad Google Cloud external IP access, and IAM based
    authentication controls.
  impact: Misconfigured authorized networks can block administrators, CI/CD systems, bastion hosts, VPN ranges, or node related
    network paths from reaching the control plane. Before enabling or tightening authorized networks, confirm all approved
    administrative and automation source CIDR ranges are included, and update the allowed ranges when trusted network paths
    change. If subnet primary IP ranges are expanded, the authorized networks configuration may also need to be updated so
    new nodes can continue to register with the control plane.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/networkisolation
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/networkisolation
  page_start: 152
  audit_raw: "Review the GKE cluster and verify that control plane authorized networks are\nconfigured to restrict access\
    \ to approved CIDR ranges.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project\
