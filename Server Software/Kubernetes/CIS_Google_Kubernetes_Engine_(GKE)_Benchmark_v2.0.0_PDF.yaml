    \ update command for each Docker repository that stores\nimages deployed to GKE Standard workloads. Repository level scanning\
    \ controls are\nsupported in Artifact Registry, and --allow-vulnerability-scanning permits\nautomatic vulnerability scanning\
    \ for the repository."
