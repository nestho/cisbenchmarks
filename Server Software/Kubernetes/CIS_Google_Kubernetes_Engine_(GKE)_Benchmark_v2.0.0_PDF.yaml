- id: 5.6.6
  title: Apply least privilege firewall rules to GKE worker nodes
  scoring: manual
  profile:
  - Level 2
  description: Apply least privilege VPC firewall rules and firewall policies to GKE worker nodes to restrict ingress and
    egress traffic to approved sources, destinations, ports, and protocols. Firewall rules should target only the intended
    GKE nodes by using appropriate network tags, service accounts, or other approved targeting methods.
  rationale: GKE worker nodes are Compute Engine VMs in a VPC network, so VPC firewall rules and firewall policies apply at
    the node level. Limiting node ingress reduces exposure to unnecessary management ports, NodePort ranges, workload ports,
    and unapproved source networks. Limiting egress helps reduce the ability of a compromised workload or node to reach unauthorized
    internal systems, internet destinations, or unmanaged services. GKE creates default firewall rules for required cluster
    functionality, and additional rules can be created for Services such as load balancers. Custom firewall rules should not
    be overly permissive or override required GKE rules in a way that increases exposure or breaks cluster operations. Node
    level firewalling should also be used with Kubernetes Network Policies where Pod level traffic control is required.
  impact: Restrictive firewall rules can affect node registration, control plane to node communication, health checks, load
    balancer Services, DNS, image pulls, logging, monitoring, and required Google API access. Rules should be tested before
    enforcement and targeted carefully so they do not unintentionally affect other instances that share the same network tag,
    service account, subnet, or firewall policy target.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/firewall-rules
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/user-managedfirewall-rules
  page_start: 162
  audit_raw: "Review the GKE cluster and identify the VPC network, subnet, node pool network tags,\nand node service accounts\
    \ used by the cluster. These values are used to determine\nwhich VPC firewall rules or firewall policies apply to the\
    \ GKE worker nodes.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID\
    \ \\\n  --format json | jq '{\n    network: .network,\n    subnetwork: .subnetwork,\n    nodePools: [\n      .nodePools[]\
    \ | {\n        name: .name,\n        tags: (.config.tags // []),\n        serviceAccount: .config.serviceAccount\n   \
    \   }\n    ]\n  }'\n• Expected output: Firewall rules that apply to the cluster VPC network and verify\nthat ingress and\
    \ egress access is limited to approved sources, destinations,\nports, and protocols.\ngcloud compute firewall-rules list\
    \ \\\n  --project $PROJECT_ID \\\n  --format=\"table(\n    name,\n    network,\n    direction,\n    priority,\n    sourceRanges.list():label=SRC_RANGES,\n\
    \    destinationRanges.list():label=DEST_RANGES,\n    allowed[].map().firewall_rule().list():label=ALLOW,\n    denied[].map().firewall_rule().list():label=DENY,\n\
    \    targetTags.list():label=TARGET_TAGS,\n    targetServiceAccounts.list():label=TARGET_SVC_ACCT,\n    disabled\n  )\"\
    \n• Expected output: Firewall rules that apply to GKE worker nodes should be least\nprivilege and should not expose unnecessary\
    \ management ports, broad\nNodePort ranges, workload ports, or unrestricted egress. Rules should not allow\nbroad ranges\
    \ such as 0.0.0.0/0 unless there is a documented requirement, and\nrules without target tags or target service accounts\
    \ should be reviewed because\nthey can apply broadly across the VPC network."
  remediation: 'Apply least privilege firewall controls to GKE worker nodes by reducing broad ingress

    and egress access while preserving required cluster functionality. Firewall rules should

    be targeted carefully so they protect the intended node pools without unintentionally

    affecting unrelated VM instances in the same VPC.

    • Update GKE worker node firewall rules so only approved sources, destinations,

    ports, and protocols are allowed.

    • Target firewall rules to the specific GKE node tags or node service accounts

    used by the cluster. Avoid rules that apply broadly to the entire VPC unless there

    is a documented requirement.

    • Remove or replace overly permissive rules, especially rules that allow broad

    ingress from 0.0.0.0/0, unnecessary management ports, broad NodePort

    ranges, or unrestricted egress.

    • Create or update firewall rules to allow only required traffic, using approved

    source ranges, destination ranges, ports, protocols, node tags, or node service

    accounts.

    • Preserve required GKE created firewall rules for cluster operations, load

    balancers, health checks, control plane to node communication, DNS, logging,

    monitoring, and image pulls unless replacement rules have been fully tested.'
