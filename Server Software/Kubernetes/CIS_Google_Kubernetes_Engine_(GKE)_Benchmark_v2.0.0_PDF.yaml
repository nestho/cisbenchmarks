- id: 5.4.1
  title: Enable GKE metadata server on Standard node pools
  scoring: scored
  profile:
  - Level 2
  description: Enable the GKE metadata server on GKE node pools to support Workload Identity Federation for GKE and reduce
    workload access to the full Compute Engine metadata server. This setting helps workloads use Kubernetes based identity
    federation instead of relying on broad node service account credentials.
  rationale: The Compute Engine metadata server exposes VM metadata and credentials associated with the node service account.
    If workloads can access those endpoints directly, they might obtain credentials or metadata that were intended for the
    node rather than the workload. This is especially risky in shared or multi-tenant clusters where different workloads run
    on the same node. When the GKE metadata server is enabled on a node pool, it provides the subset of metadata endpoints
    required by Kubernetes workloads and intercepts requests to the metadata endpoint for normal pods. This supports Workload
    Identity Federation for GKE by allowing workloads to receive federated credentials based on their Kubernetes service account
    identity instead of using node level IAM permissions.
  impact: 'Enabling the GKE metadata server can affect workloads that previously depended on direct access to the Compute
    Engine metadata server or node service account credentials. Those workloads should be updated to use dedicated Kubernetes
    service accounts with Workload Identity Federation for GKE and appropriate IAM allow policies. Pods that run with hostNetwork:
    true do not use Workload Identity Federation for GKE in the normal path and are routed to the Compute Engine metadata
    server, so those workloads should be reviewed separately.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workloadidentity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
