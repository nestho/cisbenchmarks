      \    monitoringService: .monitoringSe"
    severity: medium
- id: 5.7.2
  title: Enable Linux auditd logging for Container Optimized OS GKE nodes
  scoring: manual
  profile:
  - Level 2
  description: Enable Linux auditd logging for GKE nodes running Container Optimized OS to collect detailed operating system
    audit events from the node. These logs provide host level visibility into activity such as login attempts, error messages,
    and binary executions, and can be forwarded to Cloud Logging using the supported logging agent configuration.
  rationale: Linux auditd logging improves node level security visibility by capturing operating system events that are not
    fully represented by Kubernetes workload logs, Cloud Audit Logs, or standard cluster telemetry. This information can help
    support troubleshooting, incident investigation, and detection of suspicious host level activity on GKE nodes running
    Container Optimized OS. Because GKE nodes run workloads that may interact with the underlying host, detailed operating
    system audit logs can provide additional evidence during a security investigation, including process execution, authentication
    activity, and other node level events. This control is especially useful when host level visibility is required beyond
    normal GKE logging and monitoring.
  impact: Enabling Linux auditd logging can increase node resource usage and Cloud Logging ingestion volume, which may increase
    cost and affect log retention planning. Teams should tune audit rules, logging agent configuration, retention, exclusions,
    and alerting so the collected events support security monitoring.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/linux-auditdlogging
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-logs
  page_start: 172
  audit_raw: 'Review the cluster and verify that Linux auditd logging is deployed for Container

    Optimized OS nodes using an approved DaemonSet.

    Search for an audit logging DaemonSet across all namespaces:

    kubectl get daemonsets -A | grep -Ei ''auditd|cos-auditd''

    • Expected output: An approved audit logging DaemonSet, such as cos-auditdlogging, should be present and show the desired
    Pods as available. If no

    matching DaemonSet is returned, Linux auditd logging is not deployed.

    Verify that the audit logging Pods are running:

    kubectl get pods -A | grep -Ei ''auditd|cos-auditd''

    • Expected output: Sudit logging Pods should be in a Running state on eligible

    Container Optimized OS nodes. If no matching Pods are returned, or if Pods are

    missing, pending, failed, or not scheduled to eligible nodes, Linux auditd logging

    is not operating as expected.'
