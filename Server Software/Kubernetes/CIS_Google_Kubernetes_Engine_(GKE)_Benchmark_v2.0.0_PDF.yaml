    system:authenticated group.

    • Review each non-default RoleBinding or ClusterRoleBinding returned by the

    audit and identify the referenced Role or ClusterRole

    • Determine the specific API groups, resources, verbs, and namespace scope

    required for the affected users, tools, or automation

    • Create or update a least privilege Role or ClusterRole that grants only the

    required access

    • Bind the replacement role to a specific user, Google Group, IAM service account,

    or Kubernetes service account

    • Delete the unsafe non-default binding to system:authenticated only after

    replacement access is validated

    kubectl delete clusterrolebinding <clusterrolebinding-name>

    kubectl delete rolebinding <rolebinding-name> -n $NAMESPACE'
