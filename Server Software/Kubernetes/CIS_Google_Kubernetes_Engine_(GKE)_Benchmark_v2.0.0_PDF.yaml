    \ ADVANCED_DATAPATH or\nnetworkPolicy.enabled=True, networkPolicy.provider=CALICO, and\naddonsConfig.networkPolicyConfig.disabled=False.\n\
    For legacy datapath clusters that use Calico, enable both required components:\ngcloud container clusters update $CLUSTER_NAME\
    \ \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --update-addons=NetworkPolicy=ENABLED\ngcloud container\
    \ clusters update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --enable-network-policy\n\
    Both the NetworkPolicy add-on and node enforcement are required for Calico based\nNetworkPolicy enforcement to function.\
    \ For clusters already using ADVANCED_DATAPATH,\ndo not run the Calico enablement commands because NetworkPolicy enforcement\
    \ is\nbuilt into GKE Dataplane V2."
