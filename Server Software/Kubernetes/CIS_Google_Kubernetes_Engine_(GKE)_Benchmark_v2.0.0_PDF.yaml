- id: 5.2.2
  title: Use dedicated Kubernetes service accounts with Workload Identity Federation for GKE
  scoring: manual
  profile:
  - Level 2
  description: Use Workload Identity Federation for GKE to give GKE workloads distinct, least privilege identities when they
    need access to Google Cloud APIs. Workloads should use dedicated Kubernetes service accounts and IAM allow policies instead
    of relying on node service account permissions or long lived IAM service account keys.
  rationale: Workloads that authenticate through node service account permissions or static IAM service account keys create
    unnecessary risk. Node service account permissions are shared across workloads running on the node, which weakens least
    privilege, while static keys introduce credential storage, rotation, and leakage concerns. Workload Identity Federation
    for GKE lets IAM trust Kubernetes identities and issue federated tokens without distributing Google Cloud credentials
    to workloads. For GKE clusters, this federation model must be enabled at the cluster level and on the node pools that
    run the workloads. IAM access is then granted on the target Google Cloud resource to a principal identifier that represents
    the workload, namespace, or Kubernetes service account. When a target API does not support direct federated access, a
    Kubernetes service account can be configured to impersonate a dedicated IAM service account.
  impact: Enabling Workload Identity Federation for GKE can require updates to clusters, node pools, Kubernetes service accounts,
    workload manifests, and IAM allow policies. Existing workloads that depended on node service account permissions or mounted
    key files might lose access until permissions are explicitly granted through the federated identity model. For Standard
    clusters, workloads must run on node pools using the GKE metadata server, and restrictive egress policies should allow
    required access to the metadata server.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workloadidentity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  page_start: 111
  audit_raw: "Review the GKE Standard cluster and verify that Workload Identity Federation for GKE\nis enabled at the cluster\
