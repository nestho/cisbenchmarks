      from Service objects. Public HTTP or HTTPS workloads exposed through

      LoadBalancer services should be reviewed to determine whether GKE Ingress is th'
- id: 5.7.1
  title: Enable Cloud Logging and Cloud Monitoring for GKE clusters
  scoring: scored
  profile:
  - Level 1
  description: Enable Cloud Logging and Cloud Monitoring for GKE clusters so cluster, system, and workload telemetry is sent
    to centralized Google Cloud observability services. This helps preserve logs and metrics outside the cluster for troubleshooting,
    security, performance analysis, and alerts.
  rationale: GKE logs stored only on nodes or within the cluster are not durable because local container logs, system logs,
    and cluster events can be removed as Pods are deleted, disks fill, or logs age out. Cloud Logging provides a dedicated
    persistent datastore where events can be searched, analyzed, retained, routed, and correlated after a security event.
    Cloud Monitoring collects GKE metrics that can be used for dashboards, alerting, trend analysis, and integration with
    other monitoring workflows. Enabling both services improves visibility across clusters and helps detect failures, capacity,
    workload changes, and security.
  impact: Enabling Cloud Logging and Cloud Monitoring can increase telemetry volume and cost, especially for high volume workload
    logs or expanded metrics collection. Configure log retention, exclusions, sinks, alerting policies, dashboards, and access
    controls to align with security and compliance requirements.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/observability
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-logs
  page_start: 169
  audit_raw: "Review the GKE cluster and verify that Cloud Logging and Cloud Monitoring are\nenabled for required cluster\
    \ components. GKE component based configuration shows\nwhich log and metric sources are collected, while empty component\
    \ lists can indicate\nthat logging or monitoring collection has been disabled.\ngcloud container clusters describe $CLUSTER_NAME\
    \ \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json | jq '{\n    loggingService: .loggingService,\n\
    \    monitoringService: .monitoringService,\n    loggingComponents: .loggingConfig.componentConfig.enableComponents,\n\
    \    monitoringComponents: .monitoringConfig.componentConfig.enableComponents,\n    managedPrometheus: .monitoringConfig.managedPrometheusConfig.enabled\n\
