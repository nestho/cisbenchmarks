- id: 5.3.1
  title: Enable application-layer Secrets encryption with Cloud KMS keys
  scoring: scored
  profile:
  - Level 2
  description: Enable application layer Secrets encryption for GKE Standard clusters using a Cloud KMS key. This control adds
    customer managed encryption for Kubernetes Secret resources stored in the cluster state database, providing an additional
    protection layer beyond Google managed encryption at rest.
  rationale: By default, GKE encrypts customer content at rest, including Kubernetes Secrets, using encryption that Google
    manages automatically. Application layer Secrets encryption adds another layer by encrypting Secret data before it is
    written to the cluster state database, using a key that is managed in Cloud KMS. This improves protection for sensitive
    Kubernetes Secret data by allowing the organization to manage the encryption key lifecycle, including key access control,
    rotation, and disablement. It is important for clusters that store sensitive application credentials, tokens, certificates,
    or other Secret values that require stronger key management controls.
  impact: To use application layer Secrets encryption, the Kubernetes Engine Service Agent must have the Cloud KMS CryptoKey
    Encrypter/Decrypter role on the selected key. Enabling this feature on an existing cluster restarts the control plane
    and re-encrypts existing Secrets, which can result in a long running operation and temporary control plane unavailability
    for zonal clusters. Key availability, Cloud KMS permissions, rotation procedures, and Cloud KMS quota should be validated
    before enabling this control.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets
  - 2. https://docs.cloud.google.com/kubernetesengine/docs/troubleshooting/troubleshoot-secrets
  page_start: 116
  audit_raw: "Review the GKE Standard cluster and verify that application layer encryption is enabled\nwith an approved Cloud\
    \ KMS key. This confirms that all Kubernetes API objects in the\ncluster state database are encrypted using a customer\
