- id: 4.1.1
  title: Ensure the cluster-admin ClusterRole is only used when required
  scoring: manual
  profile:
  - Level 1
  description: The RBAC cluster-admin ClusterRole grants full administrative authority across cluster resources and should
    be assigned only to approved users, groups, or service accounts with a documented operational need. GKE RBAC is intended
    to provide fine grained control over what users and workloads can do in the cluster.
  rationale: In RBAC, GKE uses Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings to grant permissions to authenticated
    subjects, including users, groups, and Kubernetes service accounts. RBAC permissions are additive, so there are no deny
    rules to offset excessive access once a broad role is bound. GKE guidance emphasizes least privilege and recommends granting
    only the minimum permissions required for a task. The cluster-admin ClusterRole grants permission to do anything on any
    resource in the cluster. When assigned through a ClusterRoleBinding, it provides cluster wide administrative access across
    all namespaces. When assigned through a RoleBinding, the ClusterRole is limited to that namespace, but it still grants
    the broad permissions of cluster-admin within that namespace. Where broad access is not explicitly required, create a
    narrower Role or ClusterRole that grants only the required API groups, resources, and verbs.
  impact: 'Removing or modifying cluster-admin bindings without review can disrupt legitimate administrative, platform, or
    automation workflows. Before changing any binding, identify the subject and replace broad access with least privilege
    RBAC where possible. Do not delete or modify RBAC resources with the system: prefix, because GKE identifies these as required
    for correct cluster functionality and warns that changing them can cause cluster instability or make the cluster inaccessible.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
  page_start: 32
  audit_raw: "Review all Kubernetes RBAC bindings that assign the cluster-admin ClusterRole.\nThis should include ClusterRoleBinding\
    \ objects, which grant access across the cluster,\nand RoleBinding objects, which can bind the cluster-admin ClusterRole\
    \ within a\nspecific namespace. GKE RBAC supports both binding types, and cluster-admin grants\npermission to do anything\
    \ on any resource in the cluster.\nList all ClusterRoleBinding subjects bound to cluster-admin:\nkubectl get clusterrolebindings\
    \ -o json \\\n| jq -r '.items[]\n  | select(.roleRef.kind==\"ClusterRole\" and .roleRef.name==\"cluster-admin\")\n  |\
    \ .metadata.name as $binding\n  | .subjects[]?\n  | [$binding, .kind, .name, (.namespace // \"-\")]\n  | @tsv'\nList all\
    \ namespaced RoleBinding subjects that bind the cluster-admin ClusterRole:\nkubectl get rolebindings -A -o json \\\n|\
    \ jq -r '.items[]\n  | select(.roleRef.kind==\"ClusterRole\" and .roleRef.name==\"cluster-admin\")\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $binding\n  | .subjects[]?\n  | [$ns, $binding, .kind, .name, (.namespace // \"-\")]\n\
    \  | @tsv'\nReview each listed user, group, service account, and namespace to confirm that\ncluster-admin access is explicitly\
    \ required."
  remediation: 'For each cluster-admin binding, replace the broad access with a least privilege Role

    or ClusterRole that grants only the required API groups, resources, and verbs. Bind the

    replacement role to the approved user, group, or service account first, validate access,

    and then remove the cluster-admin binding and use least privilege and avoiding

    direct bindings to cluster-admin where a specific role can meet the requirement.

    • Identify all ClusterRoleBinding and RoleBinding objects that assign the clusteradmin ClusterRole, including both cluster
    wide and namespace level bindings

    • Review each bound user, group, or service account to confirm whether full

    administrative access is still required and documented

    • Replace cluster-admin access where needed with a least privilege Role or

    ClusterRole that grants only the required API groups, resources, and verbs

    • Bind and validate the replacement permissions before removing the existing

    cluster-admin binding to avoid disrupting administrative, platform, or

    automation workflows

    • Remove only confirmed bindings, and avoid modifying RBAC resources with the

    system: prefix unless explicitly required and validated because they support

    cluster functionality'
  checks:
  - type: manual_review
    info: 'Review all Kubernetes RBAC bindings that assign the cluster-admin ClusterRole.

      This should include ClusterRoleBinding objects, which grant access across the cluster,

      and RoleBinding objects, which can bind the cluster-admin ClusterRole within a

      specific namespace. GKE RBAC supports both binding types, and cluster-admin grants

      permission to do anything on any resource in the cluster.

      List all ClusterRoleBinding subjects bound to cluster-admin:

      kubectl get clusterrolebindings -o json \

      | jq -r ''.i'
    severity: medium
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Secrets can contain sensitive application credentials, configuration values, certificates, and legacy
    service account tokens. Access to these secrets should be restricted to the smallest practical set of users, groups, service
    accounts, and workloads to reduce the risk of credential exposure, privilege escalation, and unauthorized access to cluster
    or external resources. GKE RBAC supports fine grained permissions over Kubernetes resources, and Google’s RBAC guidance
    emphasizes least privilege for users and workloads.
  rationale: Inappropriate access to Secrets stored in the cluster can allow an attacker to retrieve credentials used by applications,
    automation, or workloads, and then use those credentials to access Kubernetes resources or external systems. RBAC permissions
    for Secrets should be granted only through explicit Roles or ClusterRoles that define the required API group, resource,
    and verbs, such as get, list, watch, create, update, or delete. Wildcards should be avoided because they can unintentionally
    grant broader Secret access than intended. Where possible, workloads should use dedicated Kubernetes service accounts
    and least privilege bindings rather than shared or default service accounts. For access to Google Cloud Secret Manager
    or other Google Cloud APIs, Workload Identity Federation for GKE is preferred over storing long lived service account
    keys as Kubernetes Secrets, because it reduces reliance on static credentials stored inside the cluster.
  impact: 'Do not to remove Secret access from GKE managed components, system workloads, controllers, operators, or application
    service accounts that require it for normal operation. Before making changes validate access and replace broad Secret
    permissions with least privilege RBAC, and avoid modifying required system: RBAC roles or bindings.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
  page_start: 35
  audit_raw: 'Review RBAC permissions that grant read access to Secrets in GKE Standard clusters.

    Audit should identify where get, list, or watch permissions on the core API secrets

    resource are defined, how those permissions are assigned through bindings, and which

    users, groups, or service accounts receive the access. The review should also account

    for broad default roles, wildcard rules, default groups, and shared or default service

    accounts, because these can unintentionally expose Secrets beyond the intended

    operational need. GKE RBAC emphasizes least privilege, avoiding wildcards, limiting

    permissions to the namespace level where possible, and regularly reviewing RBAC

    access.

    • Review Role and ClusterRole objects that grant get, list, or watch access to the

    core API secrets resource

    • Include wildcard rules such as resources: ["*"] or verbs: ["*"], because

    they can unintentionally grant Secret access

    • Map Secret permissions to RoleBinding and ClusterRoleBinding objects to

    identify the actual users, groups, and service accounts with access

    • Validate that each subject has a documented need for Secret access and that

    access is limited to the required namespace, resource, and verb

    • Review broad roles such as cluster-admin, admin, and edit, default groups

    such as system:authenticated, and shared or default service accounts, but

    avoid modifying required system: RBAC resources unless explicitly validated'
  remediation: 'Remediate Secret access by replacing broad or unnecessary RBAC permissions with

    narrowly defined access that supports only the required workload, user, or operational

    function. The remediation process should focus on reducing get, list, and watch

    permissions on the core API secrets resource, especially where access is inherited

    through broad roles, wildcard rules, shared service accounts, or default service

    accounts. Changes should be validated before removal to avoid disrupting applications,

    controllers, operators, or required platform services.

    • Remove unnecessary Secret access by updating or replacing RBAC roles that

    grant get, list, or watch on secrets, especially where the access is inherited

    through wildcard resources or wildcard verbs

    • Replace broad Secret permissions with least privilege Roles or ClusterRoles

    that grant only the required API group, resource, and verb. Avoid list and watch

    when a subject only needs to read a specific Secret

    • Bind Secret access only to approved users, groups, or dedicated Kubernetes

    service accounts. Avoid binding Secret access to the default service account

    because Pods that do not explicitly specify a service account can inherit that

    access

    • Move sensitive external credentials out of Kubernetes Secrets and use Secret

    Manager with Workload Identity Federation for GKE

    • Validate application, controller, operator, and platform workflows before removing

    access, and avoid modifying required system: RBAC resources because they

    support normal cluster functionality'
  checks:
  - type: manual_review
    info: 'Review RBAC permissions that grant read access to Secrets in GKE Standard clusters.

      Audit should identify where get, list, or watch permissions on the core API secrets

      resource are defined, how those permissions are assigned through bindings, and which

      users, groups, or service accounts receive the access. The review should also account

      for broad default roles, wildcard rules, default groups, and shared or default service

      accounts, because these can unintentionally expose Secrets beyond the inte'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Roles and ClusterRoles define what actions users, groups, and service accounts can perform against
    Kubernetes API resources. Wildcard permissions should be minimized because the * character applies broadly across API
    groups, resources, or verbs and can grant more access than intended. Roles should explicitly define only the API groups,
    resources, and verbs required for the subject’s function. GKE RBAC specifically advises avoiding wildcards and using least
    privilege role design.
  rationale: The principle of least privilege requires granting only the permissions needed to perform a specific task. Using
    * in RBAC rules can unintentionally grant broad access across current and future Kubernetes API capabilities, including
    new API groups, resources, verbs, or custom resources introduced into the cluster. For example, using * in the verbs field
    grants all actions, including patch, update, delete, and deletecollection, instead of only the specific actions required.
    In GKE Standard clusters, RBAC rules should be written with explicit API groups, resources, and verbs, and split into
    separate rules when different resources require different permissions. This prevents subjects from inheriting access to
    resources or actions they do not need and supports namespace level access control where possible.
  impact: Reducing wildcard use may require updates to existing RBAC roles and validation of affected users, workloads, controllers,
    and automation. Workflows that depend on broad permissions may fail until the required API groups, resources, and verbs
    are explicitly defined. This improves least privilege enforcement and reduces the risk of unintended access as APIs, resources,
    or CRDs are added.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
  page_start: 38
