- id: 5.5.6
  title: Verify Shielded GKE Node integrity monitoring is enabled
  scoring: scored
  profile:
  - Level 1
  description: Verify Shielded GKE Node integrity monitoring is enabled for GKE node pools. Integrity monitoring validates
    each Shielded VM boot sequence against a known good baseline and records pass or fail results so administrators can detect
    potential boot level or kernel level integrity issues on worker nodes.
  rationale: Integrity monitoring strengthens node security by measuring the Shielded VM boot sequence and comparing it to
    an expected baseline. This helps identify unexpected changes in boot components, firmware, kernel, or other early boot
    measurements that could indicate tampering, rootkit activity, or unauthorized low level modification. This control complements
    Shielded GKE Nodes by improving visibility into node integrity events. Integrity monitoring does not replace workload
    security, image controls, or runtime detection, but it provides an important signal in Cloud Logging that can be reviewed,
    monitored, or used for alerting when boot integrity checks fail.
  impact: Integrity monitoring is enabled by default for GKE node pools, and Google recommends not disabling it. Keeping it
    enabled has minimal impact, but should ensure Cloud Logging retention, monitoring, and alerting processes are configured
    so failed integrity validation events are reviewed and investigated. Disabling integrity monitoring reduces visibility
    into node boot integrity and weakens Shielded GKE Node protections.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/shielded-gkenodes
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/verify-controlplane-vm-integrity
