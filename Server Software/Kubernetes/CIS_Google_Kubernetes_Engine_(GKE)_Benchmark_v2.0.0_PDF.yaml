    weakens ownership, access separation, and resource governance. Dedicated namespaces make it easier to apply namespace
    based RBAC, ResourceQuotas, NetworkPolicies, Pod Security labels, observability controls, and cost attribution.
  impact: Teams must specify the correct namespace in manifests, deployment pipelines, and operational commands. Existing
