  audit_raw: "Review the GKE Standard cluster configuration from both supported enforcement paths,\nGKE Dataplane V2 and Calico\
    \ on legacy datapath. NetworkPolicy objects are enforced\nonly when the cluster has a supported network plugin. If no\
    \ managed or self managed\nplugin is configured, NetworkPolicy objects are not enforced.\ngcloud container clusters describe\
    \ $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format=\"table(\n    name,\n    networkConfig.datapathProvider,\n\
    \    networkPolicy.enabled,\n    networkPolicy.provider,\n    addonsConfig.networkPolicyConfig.disabled\n  )\"\nDataplane\
