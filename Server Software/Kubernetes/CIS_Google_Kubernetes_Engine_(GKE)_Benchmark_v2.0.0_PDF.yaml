- id: 5.8.3
  title: Ensure Legacy Authorization (ABAC) is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Keep legacy ABAC authorization disabled for GKE clusters. ABAC is a legacy Kubernetes authorization method
    that has been superseded by Kubernetes RBAC, which provides fine grained authorization through Role, ClusterRole, RoleBinding,
    and ClusterRoleBinding resources.
  rationale: ABAC uses broad, static authorization policies that are less flexible and harder to manage than Kubernetes RBAC.
    RBAC supports more precise permissions at the namespace and cluster level, allowing administrators to grant only the actions
    required for users, groups, service accounts, workloads, and automation. Leaving ABAC disabled reduces the risk of overly
    broad legacy permissions bypassing the intended RBAC model. GKE hardening guidance recommends using IAM and RBAC for access
    control and not enabling ABAC which is disabled by default in all GKE clusters.
  impact: Clusters that previously depended on ABAC rules must be migrated to Kubernetes RBAC before ABAC is disabled. Administrators
    should review existing access requirements, create the required Role, ClusterRole, RoleBinding, and ClusterRoleBinding
    resources, and validate access with representative users, groups, service accounts, and automation before enforcement.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
  page_start: 183
