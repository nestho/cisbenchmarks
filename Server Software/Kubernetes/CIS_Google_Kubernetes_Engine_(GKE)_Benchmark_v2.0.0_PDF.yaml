- id: 5.10.3
  title: Enable the GKE security posture dashboard for cluster security insights
  scoring: scored
  profile:
  - Level 2
  description: Enable the GKE security posture dashboard to surface cluster and workload security insights, including workload
    configuration auditing, actionable security concerns, and security bulletin related findings. The dashboard provides a
    centralized view of security posture findings so teams can identify, prioritize, and remediate issues across eligible
    GKE clusters and workloads.
  rationale: The GKE security posture dashboard helps identify workload and cluster configuration risks during runtime by
    scanning Kubernetes workloads for security concerns and presenting actionable findings in the Google Cloud console. This
    improves visibility into misconfigurations, risky workload settings, and security concerns that might otherwise require
    manual review across namespaces, manifests, and clusters. Security posture findings can support operational review, remediation
    tracking, and security governance across individual clusters or fleets.
  impact: Enabling the GKE security posture dashboard is an observability and assessment control, so it does not directly
    block workload deployment or change running workloads. Findings still require review, prioritization, and remediation
    by the platform or application teams. Large clusters can also hit finding limits for workload configuration auditing,
    so teams should monitor dashboard coverage and use Cloud Logging when additional investigation is required.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-securityposture-dashboard
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/aboutconfiguration-scanning
  page_start: 199
  audit_raw: "Define three variables for Cluster Name, Location, and Project, then review the cluster\nsecurity posture configuration.\n\
    gcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format\
    \ json | jq '.securityPostureConfig'\n• Expected output: mode should return BASIC. The vulnerabilityMode value\nmight\
    \ return VULNERABILITY_DISABLED, which is acceptable for this control\nbecause the control is focused on the GKE security\
    \ posture dashboard and\nworkload configuration auditing, not deprecated workload vulnerability scanning.\n{\n  \"mode\"\
    : \"BASIC\",\n  \"vulnerabilityMode\": \"VULNERABILITY_DISABLED\"\n}\nIf mode is DISABLED, MODE_UNSPECIFIED, null, blank,\
    \ or missing, the GKE security\nposture dashboard is not enabled for workload configuration auditing and should be\nremediated."
  remediation: "Enable the GKE security posture dashboard for workload configuration auditing when\nthe audit shows that securityPostureConfig.mode\
    \ is not BASIC. GKE supports\nenabling configuration auditing on existing clusters by setting the security posture mode\n\
    to standard, which maps to BASIC in the cluster configuration.\ngcloud container clusters update $CLUSTER_NAME \\\n  --location\
    \ $LOCATION \\\n  --project $PROJECT_ID \\\n  --security-posture=standard\nFor new clusters, include --security-posture=standard\
    \ during cluster creation\nwhen this setting must be explicitly enforced. Rerun the audit command and confirm\nthat securityPostureConfig.mode\
    \ returns BASIC. Initial configuration audit results\ncan take several minutes to appear in the security posture dashboard\
    \ and related logs."
