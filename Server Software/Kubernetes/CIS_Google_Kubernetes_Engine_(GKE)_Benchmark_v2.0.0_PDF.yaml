    • Expected ouput: $PROJECT_ID.svc.id.goog\nReview each node pool and verify that it is configured to use the GKE metadata\
    \ server.\nFor Standard clusters, Workload Identity Federation for GKE must be enabled on the\ncluster before it can be\
    \ used by node pools. Existing node pools are not automatically\nupdated when the cluster setting is enabled.\ngcloud\
    \ container node-pools list \\\n  --cluster=$CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID \\\n\
    \  --format='table(name,config.workloadMetadataConfig.mode)'\n• Expected result: node pools that run workloads requiring\
    \ Google Cloud API\naccess should show GKE_METADATA. A node pool using GCE_METADATA is not\nusing the GKE metadata server\
    \ for this authentication model.\nReview workloads that require Google Cloud API access and verify that they use\ndedicated\
    \ Kubernetes service accounts instead of the namespace default service\naccount.\nkubectl get pods -A \\\n  -o customcolumns='NAMESPACE:.metadata.namespace,POD:.metadata.name,SERVICE_ACCOUNT:.sp\n\
    ec.serviceAccountName'\n• Expected result: workloads that require Google Cloud API access should use\nan application specific\
    \ Kubernetes service account. They should not rely on the\nnode service account, mounted IAM service account keys, or\
    \ the namespace\ndefault service account.\nReview IAM allow policies for the target Google Cloud resources and verify\
    \ that access\nis granted to the specific Kubernetes principal identifier for the namespace and\nKubernetes service account."
  remediation: "This remediation is important when GKE Standard workloads rely on node service\naccount permissions, mounted\
    \ IAM service account keys, or shared Kubernetes service\naccounts to access Google Cloud APIs. Enabling Workload Identity\
    \ Federation for GKE\nand using dedicated Kubernetes service accounts allows each workload to receive only\nthe Google\
    \ Cloud permissions it needs, reducing reliance on broad node level\npermissions and improving workload level identity\
    \ separation.\nEnable Workload Identity Federation for GKE on the GKE Standard cluster if the\nworkload pool is not configured.\n\
    gcloud container clusters update $CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID \\\n  --workload-pool=$PROJECT_ID.svc.id.goog\n\
    Enable the GKE metadata server on existing node pools that run workloads requiring\nGoogle Cloud API access. Existing\
    \ node pools are not automatically updated when the\ncluster setting is enabled, so they must be updated or replaced.\n\
    gcloud container node-pools update $NODE_POOL \\\n  --cluster=$CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID\
    \ \\\n  --workload-metadata=GKE_METADATA\nCreate a dedicated Kubernetes service account for each workload or application\
    \ that\nrequires Google Cloud API access instead of using the namespace default service\naccount.\n• Grant the required\
    \ IAM role on the target Google Cloud resource to the specific\nKubernetes principal identifier for the namespace and\
    \ Kubernetes service\naccount. Grant only the permissions required by the workload.\n• Update the workload manifest so\
    \ the Pod runs as the dedicated Kubernetes\nservice account. For GKE Standard clusters, ensure the workload is scheduled\n\
    onto a node pool that uses the GKE metadata server.\nRedeploy the workload and test Google Cloud API access to confirm\
    \ the federated\nidentity configuration works as expected. Update any workloads that previously\ndepended on node service\
    \ account permissions or mounted IAM service account keys\nto use the dedicated Kubernetes service account and IAM allow\
    \ policy model."
