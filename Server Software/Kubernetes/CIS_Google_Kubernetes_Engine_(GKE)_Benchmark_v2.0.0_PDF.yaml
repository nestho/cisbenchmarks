- id: 5.1.1
  title: Enable Artifact Analysis scanning for Artifact Registry container images
  scoring: scored
  profile:
  - Level 2
  description: Enable Artifact Analysis vulnerability scanning for container images stored in Artifact Registry and used by
    GKE Standard workloads. This verifies that container images are scanned at the registry layer before deployment to identify
    known vulnerabilities in image packages, dependencies, and software components. For GKE clusters, this should be treated
    as an Artifact Registry and Artifact Analysis, not as a cluster level workload vulnerability scanning setting, because
    GKE security posture dashboard vulnerability scanning capabilities are being removed.
  rationale: Container images can include vulnerable operating system packages, language packages, dependencies, or other
    software components that increase the risk of compromise when deployed to GKE workloads. Artifact Analysis scans container
    images in Artifact Registry through the Container Scanning API and records vulnerability metadata through the Container
    Analysis API, giving platform and application teams visibility into known vulnerabilities before images are promoted or
    deployed. Automatic scanning evaluates new images when they are pushed to Artifact Registry and continuously monitors
    scanned image metadata for newly disclosed vulnerabilities. Scans are based on image digest, so retagging an image does
    not trigger a new scan, and findings are limited to packages that are publicly monitored for security vulnerabilities.
  impact: Although enabling Artifact Analysis scanning can increase project costs and may add additional vulnerability findings
    that require remediation, it improves software supply chain visibility by identifying vulnerable images earlier and supports
    stronger deployment controls when combined with image promotion, policy checks, or Binary Authorization.
  references:
  - 1. https://docs.cloud.google.com/artifact-analysis/docs/container-scanning-overview
  - 2. https://docs.cloud.google.com/artifact-analysis/docs/enable-automatic-scanning
  page_start: 96
  audit_raw: "Review the Google Cloud project that hosts container images for GKE Standard\nworkloads and verify that Artifact\
