- id: 4.3.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: manual
  profile:
  - Level 1
  description: Use network policies to isolate traffic in your cluster network.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. Network Policies are namespace scoped. When a network policy is introduced to a given
    namespace, all traffic not allowed by the policy is denied. However, if there are no network policies in a namespace all
    traffic will be allowed into and out of the pods in that namespace.
  impact: Once network policies are in use within a given namespace, traffic not explicitly allowed by a network policy will
    be denied. As such it is important to ensure that, when introducing network policies, legitimate traffic is not blocked.
  references:
  - 1. https://kubernetes.io/docs/concepts/services-networking/networkpolicies/
  - 2. https://octetz.com/posts/k8s-network-policy-apis
  page_start: 106
  audit_raw: "Run the below command and review the NetworkPolicy objects created in the cluster.\nThis command will list all\
    \ namespaces in your OKE cluster that have one or more\nNetworkPolicy objects defined:\necho -e \"NAMESPACE\\tNETWORKPOLICY_COUNT\"\
    \ && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do\n  count=$(kubectl get networkpolicy\
    \ -n \"$ns\" --no-headers 2>/dev/null | wc -l\n| tr -d ' ')\n  if [ \"$count\" -gt 0 ]; then\n    echo -e \"${ns}\\t${count}\"\
    \n  fi\ndone\nOR show namespaces that do not have Network Policies defined\necho -e \"NAMESPACES_WITHOUT_NETWORKPOLICIES\"\
    \ && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do\n  if ! kubectl get networkpolicy -n\
    \ \"$ns\" --no-headers 2>/dev/null | grep -q\n.; then\n    echo \"$ns\"\n  fi\ndone\nEnsure that each namespace defined\
    \ in the cluster has at least one Network Policy."
  remediation: 'Follow the documentation and create NetworkPolicy objects as you need them.

    Clusters you create with Container Engine for Kubernetes have flannel installed as the

    default CNI network provider. flannel is a simple overlay virtual network that satisfies the

    requirements of the Kubernetes networking model by attaching IP addresses to

    containers.

    Although flannel satisfies the requirements of the Kubernetes networking model, it does

    not support NetworkPolicy resources. If you want to enhance the security of clusters

    you create with Container Engine for Kubernetes by implementing network policies, you

    have to install and configure a network provider that does support NetworkPolicy

    resources. One such provider is Calico (refer to the Kubernetes documentation for a list

    of other network providers). Calico is an open source networking and network security

    solution for containers, virtual machines, and native host-based workloads.

    Use the Calico open-source software in conjunction with flannel. The Calico Enterprise

    does not support flannel.'
  checks:
  - type: command
    command: if ! kubectl get networkpolicy -n "$ns" --no-headers 2>/dev/null | grep -q
    expected: ''
    severity: medium
