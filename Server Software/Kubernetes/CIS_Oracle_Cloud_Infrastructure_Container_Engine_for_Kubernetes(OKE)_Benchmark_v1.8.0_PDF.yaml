controls:
- id: 2.1.1
  title: Client certificate authentication should not be used for users
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes provides the option to use client certificates for user authentication. However as there is no way
    to revoke these certificates when a user leaves an organization or loses their credential, they are not suitable for this
    purpose. It is not possible to fully disable client certificate use within a cluster as it is used for component to component
    authentication.
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. Kubernetes client certificate authentication does not allow for this due to a lack of support for certificate
    revocation.
  impact: External mechanisms for authentication generally require additional software to be deployed.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 20
  audit_raw: 'Review user access to the cluster and ensure that users are not making use of

    Kubernetes client certificate authentication.

    You can verify the availability of client certificates in your OKE cluster.

    Run the following command to verify the availability of client certificates in your OKE

    cluster:

    kubectl get secrets --namespace kube-system

    This command lists all the secrets in the kube-system namespace, which includes the

    client certificates used for authentication.

    Look for secrets with names starting with oci- or oke-. These secrets contain the client

    certificates. If the command returns secrets with such names, it indicates that client

    certificates are available in your OKE cluster.'
  remediation: 'Alternative mechanisms provided by Kubernetes such as the use of OIDC should be

    implemented in place of client certificates.

    You can remediate the availability of client certificates in your OKE cluster.'
  checks:
  - type: manual_review
    info: 'Review user access to the cluster and ensure that users are not making use of

      Kubernetes client certificate authentication.

      You can verify the availability of client certificates in your OKE cluster.

      Run the following command to verify the availability of client certificates in your OKE

      cluster:

      kubectl get secrets --namespace kube-system

      This command lists all the secrets in the kube-system namespace, which includes the

      client certificates used for authentication.

      Look for secrets with names st'
    severity: medium
- id: 2.2.1
  title: Ensure access to OCI Audit service Log for OKE
  scoring: manual
  profile:
  - Level 1
  description: The audit logs are part of the OKE managed Kubernetes control plane logs managed by OKE. OKE integrates with
    Oracle Cloud Infrastructure Audit Service. All operations performed by the Kubernetes API server are visible as log events
    on the Oracle Cloud Infrastructure Audit service.
  rationale: Logging is a crucial detective control for all systems to detect potential unauthorized access.
  impact: The Control plane audit logs are managed by OKE. OKE Control plane logs are written to the Oracle Cloud Infrastructure
    Audit Service. The Oracle Cloud Infrastructure Audit service automatically records calls to all supported Oracle Cloud
    Infrastructure public application programming interface (API) endpoints as log events.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Tasks/contengmonitoringoke.htm
  page_start: 23
  audit_raw: 'Using Oracle Cloud Infrastructure Console

    To monitor and manage operations performed by Container Engine for Kubernetes on a

    particular cluster:

    1. In the Console, open the navigation menu. Under Solutions and Platform, go to

    Developer Services and click Kubernetes Clusters.

    2. Choose a Compartment you have permission to work in.

    3. On the Cluster List page, click the cluster''s name for which you want to monitor

    and manage operations.

    4. The Cluster page shows information about the cluster.

    5. Display the Work Requests tab, showing the recent operations performed on the

    cluster.

    To view operations performed by Container Engine for Kubernetes and the Kubernetes

    API server as log events in the Oracle Cloud Infrastructure Audit service:

    1. In the Console, open the navigation menu. Under Governance and

    Administration, go to Governance and click Audit.

    2. Choose a Compartment you have permission to work in.

    3. Search and filter to show the operations you''re interested in:

    • To view operations performed by Container Engine for Kubernetes, enter

    ClustersAPI in the Keywords field and click Search.

    • To view operations performed by the Kubernetes API server, enter OKE API

    Server Admin Access in the Keywords field and click Search.'
  remediation: No remediation is necessary for this control.
  checks:
  - type: sql
    command: 'show the operations you''re interested in:'
    severity: medium
    info: 'Using Oracle Cloud Infrastructure Console

      To monitor and manage operations performed by Container Engine for Kubernetes on a

      particular cluster:

      1. In the Console, open the navigation menu. Under Solutions and Platform, go to

      Developer Services and click Kubernetes Clusters.

      2. Choose a Compartment you have permission to work in.

      3. On the Cluster List page, click the cluster''s name for which you '
- id: 3.1.1
  title: Ensure that the kubelet-config.json file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is using a file-based kubelet-config.json file, ensure that the proxy kubelet-config.json
    file has permissions of 644 or more restrictive.
  rationale: The kubelet kubelet-config.json file controls various parameters of the kubelet service in the worker node. You
    should restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeletconfig.json file.
  impact: Ensuring that the kubelet-config file permissions are set to 644 or more restrictive significantly strengthens the
    security posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to
    the kubeletconfig file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk
    of malicious alterations that could compromise the cluster's integrity. However, this configuration may slightly impact
    usability, as it limits the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators
    will need to balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing
    kubelet configurations.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 27
  audit_raw: "Method 1\nSSH to the worker nodes\nTo check to see if the Kubelet Service is running:\nsudo systemctl status\
    \ kubelet\nThe output should return Active: active (running) since..\nRun the following command on each node to find the\
    \ appropriate kubelet-config.json\nfile:\nps -ef | grep kubelet\nThe output of the above command should return something\
    \ similar to --kubeconfig\n/etc/kubernetes/kubelet-config.json which is the location of the kubeletconfig.json file.\n\
    Run this command to obtain the kubelet-config.json file permissions:\nstat -c %a /etc/kubernetes/kubelet-config.json\n\
    The output of the above command gives you the kubelet-config.json file's permissions.\nVerify that if a file is specified\
    \ and it exists, the permissions are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need\
    \ to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying a pod that\
    \ uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a simple pod definition\
    \ that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\n\
    spec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name:\
    \ nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath:\
    \ /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the\
    \ pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file permissions\
    \ on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access the node's\
    \ file system through\nthe /host directory and check the permission level of the file:\nls -l /host/etc/kubernetes/kubelet-config.json\n\
    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubelet-config.json file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet-config.json && ls -l /host/etc/kubernetes/kubelet-config.json
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubelet-config.json

      file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /etc/kubernetes/kubelet-config.json w'
- id: 3.1.2
  title: Ensure that the kubelet-config.json file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubelet-config.json file is set to root:root.
  rationale: The kubelet-config.json file for kubelet controls various parameters for the kubelet service in the worker node.
    You should set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 30
  audit_raw: "Method 1\nSSH to the worker nodes\nTo check to see if the Kubelet Service is running:\nsudo systemctl status\
    \ kubelet\nThe output should return Active: active (running) since..\nRun the following command on each node to find the\
    \ appropriate kubelet-config.json\nfile:\nps -ef | grep kubelet\nThe output of the above command should return something\
    \ similar to --kubeconfig\n/etc/kubernetes/kubelet-config.json which is the location of the kubeletconfig.json file.\n\
    Run this command to obtain the kubelet-config.json file ownership:\nstat -c %U:%G /etc/kubernetes/kubelet-config.json\n\
    The output of the above command gives you the kubelet-config.json file's ownership.\nVerify that the ownership is set\
    \ to root:root.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access\
    \ the host's file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's\
    \ file system into the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\n\
    within the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n  \
    \  hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command:\
    \ [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n    \
    \  privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\n\
    Once the pod is running, you can exec into it to check file ownership on the node:\nkubectl exec -it file-check -- sh\n\
    Now you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check\
    \ the ownership of the file:\nls -l /host/etc/kubernetes/kubelet-config.json\nThe output of the above command gives you\
    \ the kubelet-config.json file's ownership.\nVerify that the ownership is set to root:root."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chown root:root <kubelet-config.json file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %U:%G /etc/kubernetes/kubelet-config.json && ls -l /host/etc/kubernetes/kubelet-config.json
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubelet-config.json

      file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /etc/kubernetes/kubelet-config.json w'
