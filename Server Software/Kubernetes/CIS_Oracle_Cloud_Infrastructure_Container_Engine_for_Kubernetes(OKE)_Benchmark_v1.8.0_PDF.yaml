    tcontainer=\\($c.name)\\tallowPrivilegeEscalation=true\"\n'\nWhen creating a Pod Security Policy, [\"kube-system\"] namespaces\
    \ are excluded by\ndefault.\nThis command uses jq, a command-line JSON processor, to parse the JSON output\nfrom kubectl\
    \ get pods and filter out pods where any container has the\nsecurityContext.privileged flag set to true. Please note that\
    \ you might need to adjust the\ncommand depending on your specific requirements and the structure of your pod\nspecifications."
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of containers with .spec.allowPrivilegeEscalation set to true.'
