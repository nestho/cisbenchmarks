- id: 5.4.2
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: scored
  profile:
  - Level 1
  description: Creating Oracle Kubernetes Engine (OKE) clusters with Private Endpoint Enabled and Public Access Disabled ensures
    that the Kubernetes control plane (API server) is accessible only within the Oracle Cloud Infrastructure (OCI) Virtual
    Cloud Network (VCN). This configuration isolates cluster management traffic from the public internet, eliminating exposure
    to unauthorized external access. By keeping the API endpoint private, administrators and automation systems must connect
    securely through approved internal networks, VPNs, or bastion hosts. This practice aligns with Oracle and CIS Kubernetes
    security benchmarks, reducing attack surface and strengthening the overall security posture of the OKE environment.
  rationale: Enabling a private endpoint and disabling public access for OKE clusters ensures that the Kubernetes control
    plane is accessible only from within trusted Oracle Cloud Infrastructure (OCI) networks. This prevents unauthorized internet-based
    access to the cluster’s API server, reducing exposure to external threats such as brute-force attacks or exploitation
    of API vulnerabilities. Restricting control-plane communication to private networks enforces network segmentation, aligns
    with Zero Trust and CIS Kubernetes Benchmark best practices, and significantly enhances the security and integrity of
    the cluster’s management plane.
  impact: 'Failure to configure OKE clusters with Private Endpoint Enabled and Public Access Disabled exposes the Kubernetes
    control plane to the public internet, increasing the risk of unauthorized access, data breaches, and control-plane compromise.
    Restricting control-plane access to private networks is critical to maintaining a secure, compliant, and resilient Kubernetes
    environment. 1. Unauthorized Access Risk: Publicly exposed API endpoints can be discovered and targeted by attackers attempting
    to exploit misconfigurations or weak credentials. 2. Expanded Attack Surface: Allowing internet access to the control
    plane increases vulnerability to brute-force, denial-of-service, and reconnaissance attacks. 3. Regulatory Noncompliance:
    Public exposure of administrative interfaces can violate security and compliance frameworks such as ISO 27001. 4. Data
    and Service Disruption: A compromised control plane can lead to unauthorized cluster modifications, service outages, or
    data loss.'
  references: []
  page_start: 145
  audit_raw: "Below is a command that lists both Private Endpoint = Enabled and Public Access =\nDisabled for all OKE clusters\
    \ in a given compartment.\necho -e \"NAME\\tPRIVATE_ENDPOINT_ENABLED\\tPUBLIC_ACCESS_DISABLED\" && \\\noci ce cluster\
    \ list --compartment-id \"${COMPARTMENT_ID}\" --all --output json\n\\\n| jq -r '\n  .data[] |\n  . as $c |\n  ($c.endpointConfig.isPublicIpEnabled\
    \ // false) as $public |\n  ($public | not) as $private |\n  [\n    $c.name,\n    ($private | tostring),\n    (( $public\
    \ | not ) | tostring)\n  ] | @tsv\n'\nor check for the following:\noci ce cluster get --cluster-id \"${CLUSTER_ID}\" --query\
    \ 'data.\"endpointconfig\".\"is-public-ip-enabled\"' --output json\nOutput shows either:\n• false - Private endpoint enabled\
    \ (no public access).\n• true - Public access enabled (private endpoint disabled)."
  remediation: "If an OKE cluster is configured with a public control plane endpoint, it should be\ndisabled to reduce exposure\
    \ and prevent unauthorized access from the internet.\nConfiguring the cluster with a private endpoint ensures that the\
    \ Kubernetes API server\nis accessible only within the Oracle Cloud Infrastructure (OCI) Virtual Cloud Network\n(VCN).\n\
    Update statement to disable the public control plane endpoint:\noci ce cluster update-endpoint-config \\\n  --cluster-id\
    \ \"${CLUSTER_ID}\" \\\n  --is-public-ip-enabled false \\\n  --force\nThe OKE control plane endpoint is now private and\
    \ no longer reachable from the public\ninternet, ensuring that administrative traffic stays within trusted network boundaries."
  checks:
  - type: manual_review
    info: "Below is a command that lists both Private Endpoint = Enabled and Public Access =\nDisabled for all OKE clusters\
      \ in a given compartment.\necho -e \"NAME\\tPRIVATE_ENDPOINT_ENABLED\\tPUBLIC_ACCESS_DISABLED\" && \\\noci ce cluster\
      \ list --compartment-id \"${COMPARTMENT_ID}\" --all --output json\n\\\n| jq -r '\n  .data[] |\n  . as $c |\n  ($c.endpointConfig.isPublicIpEnabled\
      \ // false) as $public |\n  ($public | not) as $private |\n  [\n    $c.name,\n    ($private | tostring),\n    (( $public\
      \ | not ) | tostring)\n  ] | @t"
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: scored
  profile:
  - Level 1
  description: Creating Oracle Kubernetes Engine (OKE) clusters with Private Nodes ensures that worker nodes do not have public
    IP addresses and communicate only within the Oracle Cloud Infrastructure (OCI) Virtual Cloud Network (VCN). This configuration
    isolates all node-level traffic from the public internet, significantly reducing the risk of external attacks and unauthorized
    access. Private nodes enhance security by enforcing internalonly communication between workloads, control plane, and OCI
    services—while still allowing secure outbound access through NAT gateways when needed. Disable public IP addresses for
    cluster nodes, so that they only have private IP addresses. Private Nodes are nodes with no public IP addresses.
  rationale: Disabling public IP addresses on cluster nodes restricts access to only internal networks, forcing attackers
    to obtain local network access before attempting to compromise the underlying Kubernetes hosts.
  impact: To enable Private Nodes, the cluster has to also be configured with a private master IP range and IP Aliasing enabled.
    Private Nodes do not have outbound access to the public internet. If you want to provide outbound Internet access for
    your private nodes, you can use Cloud NAT or you can manage your own NAT gateway.
  references: []
  page_start: 148
  audit_raw: "Below is a command line statement to list OKE clusters whose node pools that use\nprivate nodes (i.e., nodes\
    \ without public IPs):\necho -e \"CLUSTER_ID\\tNODE_POOL_NAME\\tPRIVATE_NODES_ENABLED\" && \\\noci ce node-pool list --compartment-id\
