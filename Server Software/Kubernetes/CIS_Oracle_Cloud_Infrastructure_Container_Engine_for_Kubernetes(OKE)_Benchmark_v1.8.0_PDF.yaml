    \ systemctl status kubelet\nThe output should return Active: active (running) since..\nRun the following command on each\
    \ node to find the appropriate Kubelet config file:\nps -ef | grep kubelet\nThe output of the above command should return\
    \ something similar to --config\n/etc/kubernetes/kubelet.conf which is the location of the Kubelet config file.\nRun the\
    \ following command:\nstat -c %a /etc/kubernetes/kubelet.conf\nThe output of the above command is the Kubelet config file's\
    \ permissions. Verify that\nthe permissions are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\n\
    You will need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying\
    \ a pod that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a simple pod\
    \ definition that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
    \ file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type: Directory\n  containers:\n\
    \  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n\
    \      mountPath: /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g., file-check-pod.yaml)\
    \ and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file\
    \ permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access\
    \ the node's file system through\nthe /host directory and check the permission level of the file:\nls -l /host/etc/kubernetes/kubelet.conf\n\
    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the following command (using the config file location identied in the Audit step)

    chmod 644 etc/kubernetes/kubelet.conf'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet.conf && ls -l /host/etc/kubernetes/kubelet.conf
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      First, SSH to the relevant worker node:

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet.conf w'
