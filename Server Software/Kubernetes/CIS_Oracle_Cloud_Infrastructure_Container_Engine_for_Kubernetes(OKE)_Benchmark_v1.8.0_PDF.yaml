- id: 4.3.1
  title: Ensure latest CNI version is used
  scoring: scored
  profile:
  - Level 1
  description: There are a variety of CNI plugins available for Kubernetes. If the CNI in use does not support Network Policies
    it may not be possible to effectively restrict traffic in the cluster.
  rationale: Kubernetes network policies are enforced by the CNI plugin in use. As such it is important to ensure that the
    CNI plugin supports both Ingress and Egress network policies.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storagenet/network-plugins/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 104
  audit_raw: "Review the documentation of CNI plugin in use by the cluster, and confirm that it\nsupports network policies.\n\
    Check the DaemonSets in the kube-system namespace: Many CNI plugins operate as\nDaemonSets within the kube-system namespace.\
    \ To see what's running:\nkubectl get daemonsets -n kube-system\nLook for known CNI providers like Calico, Flannel, Cilium,\
    \ etc.\nYou can further inspect the configuration of these DaemonSets to understand more\nabout the CNI setup:\nkubectl\
    \ get daemonsets -n kube-system -o json \\\n| jq -r '\n  .items[]\n  | select(\n      (.metadata.name | test(\"cni|calico|flannel|weave|cilium|canal|multus\"\
