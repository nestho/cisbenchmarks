- id: 3.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: Enable Kubelet authentication using certificates.
  rationale: The connections from the apiserver to the kubelet are used for fetching logs for pods, attaching (through kubectl)
    to running pods, and using the kubelet’s port-forwarding functionality. These connections terminate at the kubelet’s HTTPS
    endpoint. By default, the apiserver does not verify the kubelet’s serving certificate, which makes the connection subject
    to man-in-the-middle attacks, and unsafe to run over untrusted and/or public networks. Enabling Kubelet certificate authentication
    ensures that the apiserver could authenticate the Kubelet before submitting any requests.
  impact: You require TLS to be configured on apiserver as well as kubelets.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubeletauthentication-authorization/
