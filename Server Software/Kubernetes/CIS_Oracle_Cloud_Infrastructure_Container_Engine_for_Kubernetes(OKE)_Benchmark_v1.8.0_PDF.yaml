      \ && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do\n  count=$(kubectl get networkpolicy\
      \ -n \"$ns\" --no-headers 2>/dev/null | wc -l\n| tr -d ' "
- id: 4.4.1
  title: Prefer using secrets as files over secrets as environment variables
  scoring: scored
  profile:
  - Level 1
  description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment
    variable secrets.
  rationale: It is reasonably common for application code to log out its environment (particularly in the event of an error).
    This will include any secret values passed in as environment variables, so secrets can easily be exposed to any user or
    entity who has access to the logs.
  impact: Application code which expects to read secrets in the form of environment variables would need modification
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets
  page_start: 110
  audit_raw: "Run the following command to find references to objects which use environment\nvariables defined from secrets.\n\
    kubectl get all -o jsonpath='{range .items[?(@..secretKeyRef)]} {.kind}\n{.metadata.name} {\"\\n\"}{end}' -A\nOR to specifically\
    \ detect any Pods, Deployments, DaemonSets, etc., that reference\nenvironment variables loaded from Kubernetes Secrets\
    \ (via\nenv[].valueFrom.secretKeyRef):\necho -e \"NAMESPACE\\tKIND\\tNAME\\tCONTAINER\\tSECRET_REF\" && \\\nkubectl get\
    \ deploy,ds,sts,job,cronjob,pod -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .kind as $kind\n\
    \  | .metadata.name as $name\n  | (.spec.template.spec.containers[]?, .spec.containers[]?) as $c\n  | ($c.env[]? | select(.valueFrom.secretKeyRef?))\
    \ as $env\n  | [$ns, $kind, $name, $c.name, $env.valueFrom.secretKeyRef.name] | @tsv\n'\n• -A → searches all namespaces.\n\
    • Scans Deployment, DaemonSet, StatefulSet, Job, CronJob, and Pod kinds.\n• Looks inside each container’s environment\
    \ variables (env[]) for\nvalueFrom.secretKeyRef.\n• Outputs: NAMESPACE | KIND | NAME | CONTAINER | SECRET_REF.\n• Works\
    \ seamlessly in OKE or any standard Kubernetes cluster."
  remediation: 'If possible, rewrite application code to read secrets from mounted secret files, rather

    than from environment variables.'
  checks:
  - type: manual_review
    info: 'Run the following command to find references to objects which use environment

      variables defined from secrets.

      kubectl get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

      {.metadata.name} {"\n"}{end}'' -A

      OR to specifically detect any Pods, Deployments, DaemonSets, etc., that reference

      environment variables loaded from Kubernetes Secrets (via

      env[].valueFrom.secretKeyRef):

      echo -e "NAMESPACE\tKIND\tNAME\tCONTAINER\tSECRET_REF" && \

      kubectl get deploy,ds,sts,job,cronjob,pod -A -o json \'
    severity: medium
- id: 4.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 1
  description: Consider the use of an external secrets storage and management system, instead of using Kubernetes Secrets
    directly, if you have more complex secret management needs. Ensure the solution requires authentication to access secrets,
    has auditing of access to and use of secrets, and encrypts secrets. Some solutions also make it easier to rotate secrets.
  rationale: Kubernetes supports secrets as first-class objects, but care needs to be taken to ensure that access to secrets
    is carefully limited. Using an external secrets provider can ease the management of access to secrets, especially where
    secrests are used across both Kubernetes and non-Kubernetes environments.
  impact: None
  references:
  - 1. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 112
  audit_raw: Review your secrets management implementation.
  remediation: 'Refer to the secrets management options offered by your cloud provider or a third-party

    secrets management solution.

    The master nodes in a Kubernetes cluster store sensitive configuration data (such as

    authentication tokens, passwords, and SSH keys) as Kubernetes secret objects in etcd.

    Etcd is an open source distributed key-value store that Kubernetes uses for cluster

    coordination and state management. In the Kubernetes clusters created by Container

    Engine for Kubernetes, etcd writes and reads data to and from block storage volumes in

    the Oracle Cloud Infrastructure Block Volume service. Although the data in block

    storage volumes is encrypted, Kubernetes secrets at rest in etcd itself are not encrypted

    by default.

    For additional security, when you create a new cluster you can specify that Kubernetes

    secrets at rest in etcd are to be encrypted using the Oracle Cloud Infrastructure Vault

    service.'
  checks:
  - type: manual_review
    info: Review your secrets management implementation.
    severity: medium
- id: 4.5.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Use namespaces to isolate your Kubernetes objects.
  rationale: Limiting the scope of user permissions can reduce the impact of mistakes or malicious activities. A Kubernetes
    namespace allows you to partition created resources into logically named groups. Resources created in one namespace can
    be hidden from other namespaces. By default, each resource created by a user in Kubernetes cluster runs in a default namespace,
    called default. You can create additional namespaces and attach resources and users to them. You can use Kubernetes Authorization
    plugins to create policies that segregate access to namespace resources between different users.
  impact: You need to switch between namespaces for administration.
  references:
  - 1. https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  - 2. http://blog.kubernetes.io/2016/08/security-best-practices-kubernetesdeployment.html
  page_start: 115
  audit_raw: 'Run the below command and review the namespaces created in the cluster.

    kubectl get namespaces

    Ensure that these namespaces are the ones you need and are adequately administered

    as per your requirements.'
  remediation: 'Follow the documentation and create namespaces for objects in your deployment as

    you need them.'
  checks:
  - type: manual_review
    info: 'Run the below command and review the namespaces created in the cluster.

      kubectl get namespaces

      Ensure that these namespaces are the ones you need and are adequately administered

      as per your requirements.'
    severity: medium
- id: 4.5.2
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 1
  description: Apply Security Context to Your Pods and Containers
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing your containers and pods, make sure that you configure the security context for
    your pods, containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security
    parameters that will be assigned to the pod/container/volume. There are two levels of security context: pod level security
    context, and container level security context.'
  impact: If you incorrectly apply security contexts, you may have trouble running the pods.
  references:
  - 1. https://kubernetes.io/docs/concepts/policy/security-context/
  - 2. https://learn.cisecurity.org/benchmarks
  page_start: 117
  audit_raw: "Review the pod definitions in your cluster and verify that you have security contexts\ndefined as appropriate.\n\
    Here is a key compliance check in OKE (Oracle Kubernetes Engine) to ensure all Pods\ndefine a securityContext at either\
    \ the pod or container level:\necho -e\n\"NAMESPACE\\tPOD\\tHAS_POD_SECURITY_CONTEXT\\tHAS_CONTAINER_SECURITY_CONTEXT\"\
    \ &&\n\\\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name as\
    \ $pod\n  | (.spec.securityContext != null) as $hasPodSC\n  | ([(.spec.containers[]?.securityContext != null)] | any)\
    \ as\n$hasContainerSC\n  | [$ns, $pod, $hasPodSC, $hasContainerSC] | @tsv\n'\n• HAS_POD_SECURITY_CONTEXT → checks for\
    \ a pod-level\n.spec.securityContext.\n• HAS_CONTAINER_SECURITY_CONTEXT → verifies if any container in the pod\ndefines\
    \ .securityContext.\n• jq any — returns true if at least one container has a security context.\n• Works across all namespaces\
    \ (-A).\nSample Ouput:\nNAMESPACE POD                              HAS_POD_SECURITY_CONTEXT\n HAS_CONTAINER_SECURITY_CONTEXT\n\
    default         file-check                      true\ntrue\nkube-system coredns-bc868476b-g8285              true\ntrue\n\
    kube-system csi-oci-node-hsr28              true\ntrue\nkube-system kube-dns-autoscaler-8b86f9c9f-fzqsv  true\ntrue\n\
    kube-system kube-proxy-g949b              true\ntrue\nkube-system proxymux-client-5p85m              true\ntrue\nkube-system\
    \ vcn-native-ip-cni-jwxtl              true\ntrue\ndev             api-service-7dd55b8f65               false\nfalse"
  remediation: "As a best practice we recommend that you scope the binding for privileged pods to\nservice accounts within\
    \ a particular namespace, e.g. kube-system, and limiting access\nto that namespace. For all other serviceaccounts/namespaces,\
    \ we recommend\nimplementing a more restrictive policy such as this:\napiVersion: policy/v1beta1\nkind: PodSecurityPolicy\n\
    metadata:\n    name: restricted\n    annotations:\n    seccomp.security.alpha.kubernetes.io/allowedProfileNames:\n'docker/default,runtime/default'\n\
    \    apparmor.security.beta.kubernetes.io/allowedProfileNames:\n'runtime/default'\n    seccomp.security.alpha.kubernetes.io/defaultProfileName:\n\
    'runtime/default'\n    apparmor.security.beta.kubernetes.io/defaultProfileName:\n'runtime/default'\nspec:\n    privileged:\
    \ false\n    # Required to prevent escalations to root.\n    allowPrivilegeEscalation: false\n    # This is redundant\
    \ with non-root + disallow privilege escalation,\n    # but we can provide it for defense in depth.\n    requiredDropCapabilities:\n\
    \    - ALL\n    # Allow core volume types.\n    volumes:\n    - 'configMap'\n    - 'emptyDir'\n    - 'projected'\n   \
    \ - 'secret'\n    - 'downwardAPI'\n    # Assume that persistentVolumes set up by the cluster admin are safe to\nuse.\n\
    \    - 'persistentVolumeClaim'\n    hostNetwork: false\n    hostIPC: false\n    hostPID: false\n    runAsUser:\n    #\
    \ Require the container to run without root privileges.\n    rule: 'MustRunAsNonRoot'\n    seLinux:\n    # This policy\
    \ assumes the nodes are using AppArmor rather than SELinux.\n    rule: 'RunAsAny'\n    supplementalGroups:\n    rule:\
    \ 'MustRunAs'\n    ranges:\n        # Forbid adding the root group.\n        - min: 1\n        max: 65535\n    fsGroup:\n\
    \    rule: 'MustRunAs'\n    ranges:\n        # Forbid adding the root group.\n        - min: 1\n        max: 65535\n \
    \   readOnlyRootFilesystem: false\nThis policy prevents pods from running as privileged or escalating privileges. It also\n\
    restricts the types of volumes that can be mounted and the root supplemental groups\nthat can be added.\nAnother, albeit\
    \ similar, approach is to start with policy that locks everything down and\nincrementally add exceptions for applications\
    \ that need looser restrictions such as\nlogging agents which need the ability to mount a host path."
  checks:
  - type: manual_review
    info: "Review the pod definitions in your cluster and verify that you have security contexts\ndefined as appropriate.\n\
      Here is a key compliance check in OKE (Oracle Kubernetes Engine) to ensure all Pods\ndefine a securityContext at either\
      \ the pod or container level:\necho -e\n\"NAMESPACE\\tPOD\\tHAS_POD_SECURITY_CONTEXT\\tHAS_CONTAINER_SECURITY_CONTEXT\"\
      \ &&\n\\\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name\
      \ as $pod\n  | (.spec.securityContext != null) as $hasPod"
    severity: medium
- id: 4.5.3
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 1
  description: Kubernetes provides a default namespace, where objects are placed if no namespace is specified for them. Placing
    objects in this namespace makes application of RBAC and other controls more difficult.
  rationale: Resources in a Kubernetes cluster should be segregated by namespace, to allow for security controls to be applied
    at that level and to make it easier to manage resources.
  impact: None
  references:
