- id: 4.2.5
  title: Minimize the admission of containers with allowPrivilegeEscalation
  scoring: scored
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the allowPrivilegeEscalation flag set to true. Allowing this
    right can lead to a process running a container getting more rights than it started with. It's important to note that
    these rights are still constrained by the overall container sandbox, and this setting does not relate to the use of privileged
    containers.
  rationale: A container running with the allowPrivilegeEscalation flag set to true may have processes that can gain more
    privileges than their parent. There should be at least one admission control policy defined which does not permit containers
    to allow privilege escalation. The option exists (and is defaulted to true) to permit setuid binaries to run. If you have
    need to run containers which use setuid binaries or require privilege escalation, this should be defined in a separate
    policy and you should carefully check to ensure that only limited service accounts and users are given permission to use
    that policy.
  impact: 'Pods defined with spec.allowPrivilegeEscalation: true will not be permitted unless they are run under a specific
    policy.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Concepts/contengoverview.htm
  page_start: 100
  audit_raw: "List the policies in use for each namespace in the cluster, ensure that each policy\ndisallows the admission\
    \ of containers which allow privilege escalation.\nThis command gets all pods across all namespaces, outputs their details\
    \ in JSON\nformat, and uses jq to parse and filter the output for containers with\nallowPrivilegeEscalation set to true.\
    \ Here is a command to list all pods (across all\nnamespaces) where any container has\nsecurityContext.allowPrivilegeEscalation:\
    \ true:\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name as\
    \ $pod\n  | (.spec.initContainers[]?, .spec.containers[]?) as $c\n  | ($c.securityContext.allowPrivilegeEscalation //\
    \ false) as $ape\n  | select($ape == true)\n  | \"\\($ns)/\\($pod)\\tcontainer=\\($c.name)\\tallowPrivilegeEscalation=true\"\
    \n'\n• -A — checks all namespaces.\n• (.spec.initContainers[]?, .spec.containers[]?) — inspects both regular and init\n\
    containers.\n• .securityContext.allowPrivilegeEscalation — the field that controls privilege\nescalation.\n• // false\
    \ — safely defaults to false if the field is missing.\nOR to filter out system namespaces in OKE:\nEXCLUDE_NS='[\"kube-system\"\
    ,\"kube-public\",\"oci-system\",\"oci-service-operatorsystem\",\"gatekeeper-system\"]'\nkubectl get pods -A -o json \\\
