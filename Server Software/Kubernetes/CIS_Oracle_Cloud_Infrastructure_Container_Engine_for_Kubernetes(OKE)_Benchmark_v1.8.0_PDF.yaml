- id: 3.2.10
  title: Ensure that the --rotate-server-certificates argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: Enable kubelet server certificate rotation.
  rationale: '--rotate-server-certificates causes the kubelet to both request a serving certificate after bootstrapping its
    client credentials and rotate the certificate as its existing credentials expire. This automated periodic rotation ensures
    that the there are no downtimes due to expired certificates and thus addressing availability in the CIA security triad.
    Note: This recommendation only applies if you let kubelets get their certificates from the API server. In case your kubelet
    certificates come from an outside authority/tool (e.g. Vault) then you need to take care of rotation yourself.'
  impact: None
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/45059
  - 2. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#kubelet-configuration
  page_start: 66
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for --rotate-servercertificates is set to true.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    find / -name kubelet.service

    The output of the above command should return the file and location

    /etc/systemd/system/kublet.service which is the location of the Kubelet service

    config file.

    Open the Kubelet service config file:

