- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: manual
  profile:
  - Level 1
  description: Implementing Kubernetes Network Policies in an Oracle Kubernetes Engine (OKE) cluster is a critical security
    measure for controlling and segregating pod-to-pod communication. By default, all pods in a Kubernetes cluster can freely
    communicate with each other, which increases the risk of lateral movement if a single workload is compromised. Enforcing
    network policies allows administrators to explicitly define which pods or namespaces can communicate, ensuring that workloads
    are properly isolated based on function, sensitivity, or compliance requirements. This segregation helps contain potential
    security breaches, limits unauthorized data access between applications, and supports the principle of least privilege
    in network communication— strengthening the overall security posture and reducing the attack surface within the OKE environment.
    Configure a Network Policy to restrict pod-to-pod traffic within a cluster and segregate workloads.
  rationale: By default, all pod to pod traffic within a cluster is allowed. Network Policy creates a pod-level firewall that
    can be used to restrict traffic between sources. Pod traffic is restricted by having a Network Policy that selects it
    (through the use of labels). Once there is any Network Policy in a namespace selecting a particular pod, that pod will
    reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected by
    any Network Policy will continue to accept all traffic. Network Policies are managed via the Kubernetes Network Policy
    API and enforced by a network plugin, simply creating the resource without a compatible network plugin to implement it
    will have no effect. OKE supports Network Policy enforcement through the use of Calico.
  impact: Network Policy requires the Network Policy add-on. This add-on is included automatically when a cluster with Network
    Policy is created, but for an existing cluster, needs to be added prior to enabling Network Policy. Enabling/Disabling
    Network Policy causes a rolling update of all cluster nodes, similar to performing a cluster upgrade. This operation is
    long-running and will block other operations on the cluster (including delete) until it has run to completion. If Network
    Policy is used, a cluster must have at least 2 nodes of type n1-standard-1 or higher. The recommended minimum size cluster
    to run Network Policy enforcement is 3 n1-standard-1 instances. Enabling Network Policy enforcement consumes additional
    resources in nodes. Specifically, it increases the memory footprint of the kube-system process by approximately 128MB,
    and requires approximately 300 millicores of CPU.
  references: []
  page_start: 150
  audit_raw: "Below is a command line statement to check whether Network Policies are configured in\nyour Oracle Kubernetes\
    \ Engine (OKE) cluster:\necho -e \"NAMESPACE\\tNETWORK_POLICY_COUNT\" && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}');\
    \ do\n  count=$(kubectl get networkpolicy -n \"$ns\" --no-headers 2>/dev/null | wc -l\n| tr -d ' ')\n  echo -e \"${ns}\\\
    t${count}\"\ndone\nSample Output\nNAMESPACE              NETWORK_POLICY_COUNT\ndefault                2\nkube-node-lease\
    \        3\nkube-public        5\nkube-system        0\n• A count of 0 means no NetworkPolicy objects exist in that namespace\
    \ and podto-pod communication is unrestricted.\n• A count greater than 0 means network policies are defined and applied,\
    \ helping\nisolate and protect workloads."
  remediation: "When creating a new OKE cluster enable network policies by setting the following flag:\nFor a New OKE Cluster\
    \ enable Network Policy on Cluster Creation:\noci ce cluster create \\\n  --compartment-id \"${COMPARTMENT_ID}\" \\\n\
    \  --name \"secure-cluster\" \\\n  --vcn-id \"${VCN_OCID}\" \\\n  --kubernetes-version \"v1.30.1\" \\\n  --is-kubernetes-dashboard-enabled\
    \ false \\\n  --options '{\"serviceLbSubnetIds\":[\"<subnet_ocid>\"],\n\"isNetworkPolicyEnabled\": true}'\n• Define Namespace-Level\
    \ Network Policies after cluster creation, apply a\nrestrictive default policy to each namespace\n• Add Allow Rules for\
    \ Required Traffic and create specific NetworkPolicy\nresources to allow communication only between approved pods or namespaces.\n\
    For an Existing OKE Cluster, enable Network Policy on the Existing Cluster:\noci ce cluster update \\\n  --cluster-id\
    \ \"${CLUSTER_ID}\" \\\n  --options '{\"isNetworkPolicyEnabled\": true}' \\\n  --force\n• Apply a Default Deny-All Policy\n\
    • Add Fine-Grained Policies for Authorized Communication by defining\nNetworkPolicy manifests that explicitly allow required\
    \ traffic between trusted\nworkloads, services, or namespaces."
  checks:
  - type: manual_review
    info: "Below is a command line statement to check whether Network Policies are configured in\nyour Oracle Kubernetes Engine\
      \ (OKE) cluster:\necho -e \"NAMESPACE\\tNETWORK_POLICY_COUNT\" && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}');\
      \ do\n  count=$(kubectl get networkpolicy -n \"$ns\" --no-headers 2>/dev/null | wc -l\n| tr -d ' ')\n  echo -e \"${ns}\\\
      t${count}\"\ndone\nSample Output\nNAMESPACE              NETWORK_POLICY_COUNT\ndefault                2\nkube-node-lease\
      \        3\nkube-public       "
    severity: medium
