    ; \"i\"))\n    )\n  | \"\\(.metadata.name)\\timage=\\(.spec.template.spec.containers[].image)\"\n'\nCheck the CNI Configuration\
    \ Files: If you have access to the nodes (via SSH), you can\ncheck the CNI configuration directly in /etc/cni/net.d/.\
    \ This often requires node-level\naccess, which might not be available depending on your permissions and the security\n\
    setup of your environment."
  remediation: 'As with RBAC policies, network policies should adhere to the policy of least privileged

    access. Start by creating a deny all policy that restricts all inbound and outbound traffic

    from a namespace or create a global policy using Calico.'
  checks:
