- id: 5.1.2
  title: Minimize user access control to Container Engine for Kubernetes
  scoring: manual
  profile:
  - Level 1
  description: Restrict user access to OKE, limiting interaction with build images to only authorized personnel and service
    accounts.
  rationale: Weak access control to OKE may allow malicious users to replace built images with vulnerable or backdoored containers.
  impact: Care should be taken not to remove access to Oracle Cloud Infrastructure Registry (OCR) for accounts that require
    this for their operation. Any account granted the Storage Object Viewer role at the project level can view all objects
    stored in OCS for the project.
  references: []
  page_start: 127
  audit_raw: 'For most operations on Kubernetes clusters created and managed by Container Engine

    for Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM)

    provides access control. A user''s permissions to access clusters comes from the groups

    to which they belong. The permissions for a group are defined by policies. Policies

    define what actions members of a group can perform, and in which compartments.

    Users can then access clusters and perform operations based on the policies set for the

    groups they are members of.

    IAM provides control over:

    • whether a user can create or delete clusters

    • whether a user can add, remove, or modify node pools

    • which Kubernetes object create/delete/view operations a user can perform on all

    clusters within a compartment or tenancy

    See Policy Configuration for Cluster Creation and Deployment.

    In addition to IAM, the Kubernetes RBAC Authorizer can enforce additional fine-grained

    access control for users on specific clusters via Kubernetes RBAC roles and

    clusterroles. A Kubernetes RBAC role is a collection of permissions. For example, a role

    might include read permission on pods and list permission for pods. A Kubernetes

    RBAC clusterrole is just like a role, but can be used anywhere in the cluster. A

    Kubernetes RBAC rolebinding maps a role to a user or set of users, granting that role''s

    permissions to those users for resources in that namespace. Similarly, a Kubernetes

    RBAC clusterrolebinding maps a clusterrole to a user or set of users, granting that

    clusterrole''s permissions to those users across the entire cluster.'
  remediation: 'By default, users are not assigned any Kubernetes RBAC roles (or clusterroles) by

    default. So before attempting to create a new role (or clusterrole), you must be assigned

    an appropriately privileged role (or clusterrole). A number of such roles and clusterroles

    are always created by default, including the cluster-admin clusterrole (for a full list, see

    Default Roles and Role Bindings in the Kubernetes documentation). The cluster-admin

    clusterrole essentially confers super-user privileges. A user granted the cluster-admin

    clusterrole can perform any operation across all namespaces in a given cluster.

    Note that Oracle Cloud Infrastructure tenancy administrators already have sufficient

    privileges, and do not require the cluster-admin clusterrole.

    See: Granting the Kubernetes RBAC cluster-admin clusterrole'
  checks:
  - type: manual_review
    info: 'For most operations on Kubernetes clusters created and managed by Container Engine

      for Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM)

      provides access control. A user''s permissions to access clusters comes from the groups

      to which they belong. The permissions for a group are defined by policies. Policies

      define what actions members of a group can perform, and in which compartments.

      Users can then access clusters and perform operations based on the policies set for th'
    severity: medium
- id: 5.1.3
  title: Minimize cluster access to read-only
  scoring: manual
  profile:
  - Level 1
  description: Configure the Cluster Service Account to only allow read-only access to OKE.
  rationale: The Cluster Service Account does not require administrative access to OCR, only requiring pull access to containers
    to deploy onto OKE. Restricting permissions follows the principles of least privilege and prevents credentials from being
    abused beyond the required role.
  impact: A separate dedicated service account may be required for use by build servers and other robot users pushing or managing
    container images.
  references: []
  page_start: 130
  audit_raw: 'Review Oracle OCS worker node IAM role IAM Policy Permissions to verify that they

    are set and the minimum required level.

    If utilizing a 3rd party tool to scan images utilize the minimum required permission level

    required to interact with the cluster - generally this should be read-only.'
  remediation: 'To access a cluster using kubectl, you have to set up a Kubernetes configuration file

    (commonly known as a ''kubeconfig'' file) for the cluster. The kubeconfig file (by default

    named config and stored in the $HOME/.kube directory) provides the necessary details

    to access the cluster. Having set up the kubeconfig file, you can start using kubectl to

    manage the cluster.

    The steps to follow when setting up the kubeconfig file depend on how you want to

    access the cluster:

    • To access the cluster using kubectl in Cloud Shell, run an Oracle Cloud

    Infrastructure CLI command in the Cloud Shell window to set up the kubeconfig

    file.

    • To access the cluster using a local installation of kubectl:

    1. Generate an API signing key pair (if you don''t already have one).

    2. Upload the public key of the API signing key pair.

    3. Install and configure the Oracle Cloud Infrastructure CLI.

    4. Set up the kubeconfig file.

    See Setting Up Local Access to Clusters'
  checks:
  - type: manual_review
    info: 'Review Oracle OCS worker node IAM role IAM Policy Permissions to verify that they

      are set and the minimum required level.

      If utilizing a 3rd party tool to scan images utilize the minimum required permission level

      required to interact with the cluster - generally this should be read-only.'
    severity: medium
- id: 5.1.4
  title: Minimize Container Registries to only those approved
  scoring: manual
  profile:
  - Level 1
  description: Limiting OKE clusters to pull images only from approved container registries is a key security control that
    prevents the deployment of unverified or malicious container images. By explicitly allowing access to trusted registries—such
    as Oracle Cloud Infrastructure (OCI) Registry (OCIR) or other vetted enterprise repositories—you ensure that all deployed
    containers come from sources that meet your organization’s security, compliance, and provenance standards.
  rationale: Allowing unrestricted access to external container registries provides the opportunity for malicious or unapproved
    containers to be deployed into the cluster. Allow listing only approved container registries reduces this risk.
  impact: All container images to be deployed to the cluster must be hosted within an approved container image registry.
  references: []
  page_start: 132
  audit_raw: 'Practice Recommendations:

    1. Use Only Trusted Registries - Configure workloads to pull images exclusively

    from approved registries (e.g., iad.ocir.io, phx.ocir.io, or your enterprise

    repository).

    2. Restrict Outbound Egress - Use Kubernetes Network Policies, OCI Network

    Security Groups (NSGs), or Security Lists to block access to public internet

    registries (e.g., Docker Hub) unless explicitly required.

    3. Implement Image Pull Policies - Enforce imagePullPolicy: Always and deploy

    Admission Controllers (e.g., OPA Gatekeeper or Kyverno) to validate image

    sources before pods are admitted to the cluster.

    4. Use Image Signing and Scanning - Enable OCIR Vulnerability Scanning or

    integrate third-party tools to ensure only signed and scanned images are

    allowed.

    Audit Deployed Images regularly and periodically check for images from unapproved

    registries:

    echo -e "NAMESPACE\tPOD_NAME\tIMAGE" && \

    kubectl get pods -A -o jsonpath=''{range

    .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{.spec.containers[

    *].image}{"\n"}{end}'' \

    | grep -vE ''(iad\.ocir\.io|phx\.ocir\.io|your-approved-registry\.com)'''
  remediation: 'Minimize Container Registries to Only Approved Sources

    • Define Approved Registries - Establish a list of trusted registries (for example,

    iad.ocir.io//, phx.ocir.io//, or a private enterprise registry).

    • Restrict Pod Image Sources via Admission Controls

    • Restrict Egress to Non-Approved Registries - Use Kubernetes NetworkPolicies,

    OCI Network Security Groups (NSGs), or Security Lists to block egress traffic to

    public registries

    • Enforce Image Scanning and Signing - Enable OCI Vulnerability Scanning

    Service (VSS) for your OCIR repositories and allow only scanned and signed

    images to be deployed.'
  checks:
  - type: command
    command: '| grep -vE ''(iad\.ocir\.io|phx\.ocir\.io|your-approved-registry\.com)'''
    expected: ''
    severity: medium
    info: 'Practice Recommendations:

      1. Use Only Trusted Registries - Configure workloads to pull images exclusively

      from approved registries (e.g., iad.ocir.io, phx.ocir.io, or your enterprise

      repository).

      2. Restrict Outbound Egress - Use Kubernetes Network Policies, OCI Network

      Security Groups (NSGs), or Security Lists to block access to public internet

      registries (e.g., Docker Hub) unless explicitly requ'
- id: 5.2.1
  title: Prefer using dedicated Service Accounts
  scoring: scored
  profile:
  - Level 1
  description: Kubernetes workloads should not use cluster node service accounts to authenticate to Oracle Cloud APIs. Each
    Kubernetes Workload that needs to authenticate to other Oracle services using Cloud IAM should be provisioned a dedicated
    Service account.
  rationale: 'Manual approaches for authenticating Kubernetes workloads running on OKE against Oracle Cloud APIs are: storing
    service account keys as a Kubernetes secret (which introduces manual key rotation and potential for key compromise); or
    use of the underlying nodes'' IAM Service account, which violates the principle of least privilege on a multitenanted
    node, when one pod needs to have access to a service, but every other pod on the node that uses the Service account does
    not.'
  impact: ''
  references: []
  page_start: 135
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service

    account and ensure that it has no roles or cluster roles bound to it apart from the

    defaults.

    kubectl get serviceaccounts/default -o yaml

    Additionally ensure that the automountServiceAccountToken: false setting is in

    place for each default service account.'
  remediation: 'When you create a pod, if you do not specify a service account, it is automatically

    assigned the default service account in the same namespace. If you get the raw json or

    yaml for a pod you have created (for example, kubectl get pods/<podname> -o

    yaml), you can see the spec.serviceAccountName field has been automatically set.

    See Configure Service Accounts for Pods'
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service

      account and ensure that it has no roles or cluster roles bound to it apart from the

      defaults.

      kubectl get serviceaccounts/default -o yaml

      Additionally ensure that the automountServiceAccountToken: false setting is in

      place for each default service account.'
    severity: medium
- id: 5.3.1
  title: Encrypting Kubernetes Secrets at Rest in Etcd
  scoring: manual
  profile:
  - Level 1
  description: Encrypt Kubernetes secrets, stored in etcd, at the application-layer using a customermanaged key.
  rationale: The master nodes in a Kubernetes cluster store sensitive configuration data (such as authentication tokens, passwords,
    and SSH keys) as Kubernetes secret objects in etcd. Etcd is an open source distributed key-value store that Kubernetes
    uses for cluster coordination and state management. In the Kubernetes clusters created by Container Engine for Kubernetes,
    etcd writes and reads data to and from block storage volumes in the Oracle Cloud Infrastructure Block Volume service.
    Although the data in block storage volumes is encrypted, Kubernetes secrets at rest in etcd itself are not encrypted by
    default.
  impact: ''
  references:
  - 1. https://docs.cloud.oracle.com/enus/iaas/Content/ContEng/Tasks/contengencryptingdata.htm
  page_start: 138
  audit_raw: 'Before you can create a cluster where Kubernetes secrets are encrypted in the etcd

    key-value store, you have to:

    • know the name and OCID of a suitable master encryption key in Vault

    • create a dynamic group that includes all clusters in the compartment in which you

    are going to create the new cluster

    • create a policy authorizing the dynamic group to use the master encryption key'
  remediation: 'You can create a cluster in one tenancy that uses a master encryption key in a different

    tenancy. In this case, you have to write cross-tenancy policies to enable the cluster in its

    tenancy to access the master encryption key in the Vault service''s tenancy. Note that if

    you want to create a cluster and specify a master encryption key that''s in a different

    tenancy, you cannot use the Console to create the cluster.

    For example, assume the cluster is in the ClusterTenancy, and the master encryption

    key is in the KeyTenancy. Users belonging to a group (OKEAdminGroup) in the

    ClusterTenancy have permissions to create clusters. A dynamic group

    (OKEAdminDynGroup) has been created in the cluster, with the rule ALL

    {resource.type = ''cluster'', resource.compartment.id =

    ''ocid1.compartment.oc1..<unique_ID>''}, so all clusters created in the

    ClusterTenancy belong to the dynamic group.

    In the root compartment of the KeyTenancy, the following policies:

    • use the ClusterTenancy''s OCID to map ClusterTenancy to the alias

    OKE_Tenancy

    • use the OCIDs of OKEAdminGroup and OKEAdminDynGroup to map them to

    the aliases RemoteOKEAdminGroup and RemoteOKEClusterDynGroup

    respectively

    • give RemoteOKEAdminGroup and RemoteOKEClusterDynGroup the ability to

    list, view, and perform cryptographic operations with a particular master key in

    the KeyTenancy

    Define tenancy OKE_Tenancy as ocid1.tenancy.oc1..<unique_ID>

    Define dynamic-group RemoteOKEClusterDynGroup as

    ocid1.dynamicgroup.oc1..<unique_ID>

    Define group RemoteOKEAdminGroup as ocid1.group.oc1..<unique_ID>

    Admit dynamic-group RemoteOKEClusterDynGroup of tenancy ClusterTenancy to use

    keys in tenancy where target.key.id = ''ocid1.key.oc1..<unique_ID>''

    Admit group RemoteOKEAdminGroup of tenancy ClusterTenancy to use keys in

    tenancy where target.key.id = ''ocid1.key.oc1..<unique_ID>''

    In the root compartment of the ClusterTenancy, the following policies:

    • use the KeyTenancy''s OCID to map KeyTenancy to the alias KMS_Tenancy

    • give OKEAdminGroup and OKEAdminDynGroup the ability to use master keys in

    the KeyTenancy

    • allow OKEAdminDynGroup to use a specific master key obtained from the

    KeyTenancy in the ClusterTenancy

    Define tenancy KMS_Tenancy as ocid1.tenancy.oc1..<unique_ID>

    Endorse group OKEAdminGroup to use keys in tenancy KMS_Tenancy

    Endorse dynamic-group OKEAdminDynGroup to use keys in tenancy KMS_Tenancy

    Allow dynamic-group OKEAdminDynGroup to use keys in tenancy where

    target.key.id = ''ocid1.key.oc1..<unique_ID>''

    See Accessing Object Storage Resources Across Tenancies for more examples of

    writing cross-tenancy policies.

    Having entered the policies, you can now run a command similar to the following to

    create a cluster in the ClusterTenancy that uses the master key obtained from the

    KeyTenancy:

    oci ce cluster create --name oke-with-cross-kms --kubernetes-version v1.16.8

    --vcn-id ocid1.vcn.oc1.iad.<unique_ID> --service-lb-subnet-ids

    ''["ocid1.subnet.oc1.iad.<unique_ID>"]'' --compartment-id

    ocid1.compartment.oc1..<unique_ID> --kms-key-id ocid1.key.oc1.iad.<unique_ID>'
  checks:
  - type: manual_review
    info: 'Before you can create a cluster where Kubernetes secrets are encrypted in the etcd

      key-value store, you have to:

      • know the name and OCID of a suitable master encryption key in Vault

      • create a dynamic group that includes all clusters in the compartment in which you

      are going to create the new cluster

      • create a policy authorizing the dynamic group to use the master encryption key'
    severity: medium
- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: scored
  profile:
  - Level 1
  description: Enable Authorized IP CIDRs endpointConfig.authorizedIpCidrs, used together with isPublicIpEnabled to restrict
    or disable control-plane access. These settings define which IP CIDRs can reach the Kubernetes API server (control plane
    endpoint).
  rationale: Restricting access to the Oracle Kubernetes Engine (OKE) cluster control plane through the Authorized IP CIDRs
    list (endpointConfig.authorizedIpCidrs), in combination with the isPublicIpEnabled setting, is a critical security control
    that ensures only trusted administrative networks or systems can reach the Kubernetes API server. By default, enabling
    a public control plane endpoint without restrictions exposes the cluster’s management interface to the internet, increasing
    the risk of unauthorized access, brute-force attacks, or exploitation of exposed API vulnerabilities. The Authorized IP
    CIDRs list acts as a network-level allowlist, explicitly defining which external IP address ranges are permitted to communicate
    with the cluster’s API server. When used together with isPublicIpEnabled=false, this configuration can completely isolate
    the control plane within the Virtual Cloud Network (VCN), allowing only internal traffic or secure connections via bastion
    hosts or VPNs. In cases where isPublicIpEnabled=true is required for operational purposes, defining a precise Authorized
    IP CIDR range ensures that only approved administrators or automation systems can manage the cluster remotely.
  impact: Failure to implement the Authorized IP CIDRs list in conjunction with isPublicIpEnabled exposes the OKE cluster
    control plane to unauthorized network access. This increases the risk of external attacks, including credential theft,
    denial-ofservice attempts, or exploitation of API vulnerabilities. Conversely, enforcing these settings significantly
    reduces the cluster’s attack surface, ensuring that only trusted networks and administrators can interact with the Kubernetes
    API, thereby maintaining the integrity and confidentiality of the cluster’s management plane.
  references: []
  page_start: 142
  audit_raw: "Below is a command-line audit procedure to verify that each OKE cluster control plane\n(master endpoint) is\
    \ properly restricted using the Authorized IP CIDRs list\n(endpointConfig.authorizedIpCidrs) and the isPublicIpEnabled\
    \ setting.\necho -e \"NAME\\tPUBLIC\\tAUTHORIZED_CIDRS\" && \\\noci ce cluster list --compartment-id \"${COMPARTMENT_ID}\"\
    \ --all --output json\n\\\n| jq -r '\n  .data[] |\n  . as $c |\n  ($c.endpointConfig.isPublicIpEnabled // false) as $pub\
    \ |\n  ($c.endpointConfig.authorizedIpCidrs // []) as $cidrs |\n  [$c.name, $pub, ($cidrs | join(\",\"))] | @tsv\n'\n\
    Or check the following:\nexport CLUSTER_ID=<oke cluster id>\noci ce cluster get --cluster-id $CLUSTER_ID\nCheck for endpoint\
    \ URL of the Kubernetes API Server in output"
  remediation: "If the OKE cluster control plane is publicly accessible without an authorized IP allowlist,\nupdate the endpoint\
    \ configuration to either disable public access or restrict it to specific\ntrusted IP ranges. This ensures only approved\
    \ administrative networks can reach the\nKubernetes API server, reducing exposure to unauthorized access.\nRestrict to\
    \ Authorized IPs:\noci ce cluster update-endpoint-config \\\n  --cluster-id \"${CLUSTER_ID}\" \\\n  --is-public-ip-enabled\
    \ true \\\n  --authorized-ip-cidrs '[\"203.0.113.10/32\",\"198.51.100.0/24\"]' \\\n  --force\nor make endpoint private\
    \ only:\noci ce cluster update-endpoint-config \\\n  --cluster-id \"${CLUSTER_ID}\" \\\n  --is-public-ip-enabled false\
    \ \\\n  --force"
  checks:
  - type: manual_review
    info: "Below is a command-line audit procedure to verify that each OKE cluster control plane\n(master endpoint) is properly\
      \ restricted using the Authorized IP CIDRs list\n(endpointConfig.authorizedIpCidrs) and the isPublicIpEnabled setting.\n\
