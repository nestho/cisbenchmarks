- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly
    needs to communicate with the API server
  rationale: Mounting service account tokens inside pods can provide an avenue for privilege escalation attacks where an attacker
    is able to compromise a single pod in the cluster. Avoiding mounting these tokens removes this attack avenue.
  impact: Pods mounted without service account tokens will not be able to communicate with the API server, except where the
    resource is available to unauthenticated principals.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 85
  audit_raw: 'Review pod and service account objects in the cluster and ensure that the option below

    is set, unless the resource explicitly requires this access.

    automountServiceAccountToken: false

    echo "=== ServiceAccounts with automountServiceAccountToken=false ==="

    printf "%-25s %-40s\n" "NAMESPACE" "SERVICEACCOUNT"

    echo "------------------------- ----------------------------------------"

    kubectl get sa -A -o jsonpath=''{range

    .items[?(@.automountServiceAccountToken==false)]}{.metadata.namespace}{"\t"}{

    .metadata.name}{"\n"}{end}'' \

    | sort | awk -F''\t'' ''{printf "%-25s %-40s\n", $1, $2}''

    echo ""

    echo "=== Pods with automountServiceAccountToken=false ==="

    printf "%-25s %-40s\n" "NAMESPACE" "POD"

    echo "------------------------- ----------------------------------------"

    kubectl get pods -A -o jsonpath=''{range

    .items[?(@.spec.automountServiceAccountToken==false)]}{.metadata.namespace}{"

    \t"}{.metadata.name}{"\n"}{end}'' \

    | sort | awk -F''\t'' ''{printf "%-25s %-40s\n", $1, $2}''

    Note:

    • kubectl get ... -A scans all namespaces.

    • jsonpath filters for automountServiceAccountToken == false.

