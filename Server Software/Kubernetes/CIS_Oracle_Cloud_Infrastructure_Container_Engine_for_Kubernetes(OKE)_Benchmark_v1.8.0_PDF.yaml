    \       dev-pool-01          false"
  remediation: "If a node pool in your OKE cluster is configured with public IP addresses, update it to\nuse private nodes\
    \ to prevent direct internet exposure and ensure all traffic stays within\nthe OCI Virtual Cloud Network (VCN).\noci ce\
    \ node-pool update \\\n  --node-pool-id \"${NODEPOOL_ID}\" \\\n  --is-node-public-ip-enabled false \\\n  --force"
