    that operate in the node’s network namespace instead of the pod’s normal isolated network context. In AKS, that increases
    the blast radius of a compromised workload and can preserve access to node-adjacent services such as IMDS even when IMDS
    restriction is enabled for non-host-network pods. Microsoft also notes that running noncompliant workloads places the
    cluster at risk, so broad use of hostNetwork weakens both security posture and operational assurance. Pods defined with
    spec.hostNetwork: true will not be permitted unless they are run under a specific policy.'
