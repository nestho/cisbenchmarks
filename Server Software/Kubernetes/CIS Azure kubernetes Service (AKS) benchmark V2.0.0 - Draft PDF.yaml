- id: 5.4.5
  title: Use HTTPS with valid TLS certificates for externally exposed workloads
  scoring: manual
  profile:
  - Level 2
  description: This helps protect externally exposed AKS applications by ensuring client connections use HTTPS instead of
    plaintext HTTP at the cluster entry point. In AKS, that protection is typically applied at the ingress or gateway layer,
    where external web traffic is accepted and routed to backend services. Using TLS at that layer reduces the risk of exposing
    application traffic, credentials, session data, or other sensitive content in transit.
  rationale: In AKS, external HTTP-like traffic is normally terminated by an Ingress controller or Gateway implementation,
    not by the layer-4 Standard Load Balancer itself. That means the relevant enforcement point for this control is the layer-7
    listener that accepts requests for the application hostname. When that listener is configured for HTTPS, the client performs
    a TLS handshake with the endpoint, validates the server certificate for the requested DNS name, and establishes an encrypted
    session before any HTTP payload is exchanged. AKS supports this model through ingress configurations that bind a certificate
    to the tls section of an Ingress resource, including certificate material sourced from Azure Key Vault and referenced
    through the generated Kubernetes TLS secret. The ingress path can then perform TLS termination and forward traffic to
    backend services according to the configured routing rules.
  impact: Enforcing this control adds certificate management to the AKS ingress path, including hostname-to-certificate matching,
    secret or Key Vault integration, and certificate rotation for the exposed listener.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-network-ingress
  - 2. https://learn.microsoft.com/en-us/azure/aks/app-routing-dns-ssl
  page_start: 171
  audit_raw: 'Its important to review this at the Ingress or Gateway layer, since in AKS those

    components are the primary enforcement points for external HTTP and TLS termination.

    The purpose of the review is to confirm that public application entry points are not

    exposing client traffic over plaintext HTTP and that every externally published hostname

    is protected by a certificate-backed HTTPS or TLS listener. In AKS, ingress can provide

    SSL termination, and the application routing add-on supports certificate-based HTTPS

    using Azure Key Vault–integrated patterns.

    • Review all externally exposed Ingress and Gateway resources and identify every

    public hostname, listener, and route used to publish HTTP-like application traffic.

    In AKS, these are the resources where external traffic handling is defined.

    • For each exposed hostname, verify the listener is configured for HTTPS or TLS

    rather than HTTP-only exposure, and confirm the configuration includes a valid

    certificate reference for termination. AKS Gateway and ingress configurations are

    the enforcement points for this control.

    • Confirm the certificate source is valid and intentional, such as a Kubernetes TLS

    secret or a certificate synchronized from Azure Key Vault, and verify the

    certificate is bound to the correct hostname. AKS application routing supports

    SSL/TLS certificate use through these patterns.

    • Treat externally exposed HTTP-only listeners, missing TLS secret references, or

    public hostnames without certificate-backed listener configuration as findings,

    because those conditions indicate traffic can reach the workload entry point

    without HTTPS protection.

    • If the cluster uses the application routing add-on, also verify the intended

    certificate-management path is in place, since managed NGINX ingress supports

    secure HTTPS exposure and Key Vault-backed certificate integration for AKShosted applications.'
  remediation: 'Remediate by ensuring every externally exposed AKS web entry point is published

    through an Ingress or Gateway listener configured for HTTPS/TLS, with a valid

    certificate bound to the public hostname. In AKS, HTTPS protection is typically

    implemented at the layer 7 ingress or gateway layer, where client traffic is accepted and

    TLS is terminated before traffic is forwarded to backend services. The remediation

    objective is to eliminate plaintext HTTP exposure for public application endpoints and

    standardize certificate-backed TLS for all external web traffic.

    1. Update each public Ingress or Gateway that currently exposes HTTP-only traffic

    so the listener uses HTTPS or TLS for the published hostname. In AKS, ingress

    is the supported control point for external HTTP-like traffic and SSL/TLS

    termination.

    2. Bind a valid certificate and private key to each exposed hostname, either through

    a Kubernetes kubernetes.io/tls secret or through an AKS-supported

    certificate integration such as Azure Key Vault.

    3. Ensure the certificate subject or SAN matches the DNS name being published so

    the listener can complete TLS negotiation correctly for the requested host. AKS

    application routing guidance is based on configuring certificates for the custom

    domain used by the ingress endpoint.

    4. Where the cluster uses the application routing add-on, standardize certificate

    management through the supported Key Vault-backed pattern so TLS material is

    centrally managed and available to the ingress path.

    5. After remediation, verify that public endpoints redirect or serve over HTTPS only,

    that the listener presents the expected certificate, and that backend routing still

    functions after TLS termination. AKS ingress supports SSL/TLS termination as

    part of the application entry configuration.'
  checks:
  - type: manual_review
    info: 'Its important to review this at the Ingress or Gateway layer, since in AKS those

      components are the primary enforcement points for external HTTP and TLS termination.

      The purpose of the review is to confirm that public application entry points are not

