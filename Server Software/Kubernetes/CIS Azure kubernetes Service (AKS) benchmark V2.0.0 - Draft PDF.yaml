- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: In AKS, the cluster should have a supported network policy engine enabled and the resulting policy model should
    be configured to enforce the intended pod-level traffic restrictions. Network policies in AKS are used to allow or deny
    traffic between pods based on selectors such as namespace, labels, and ports. AKS documentation lists Cilium, Azure Network
    Policy Manager (NPM), and Calico as AKS network policy options, while also documenting that Azure CNI Powered by Cilium
    can enforce network policies without installing a separate policy engine and is the recommended path for new Linux deployments.
  rationale: In AKS, pod traffic is permitted by default unless network policy enforcement is enabled, so workloads can communicate
    laterally across namespaces and application tiers without pod-level restriction. Enabling network policy adds a Kubernetes-native
    enforcement layer that filters ingress and egress traffic between pods by using label, namespace, and port-based rules,
    which is the technical mechanism AKS uses for eastwest micro segmentation. This allows the cluster to restrict traffic
    paths to only those required by the application design, instead of relying on unrestricted pod-to-pod communication.
  impact: Network policy in AKS introduces engine-specific operational and compatibility considerations. On existing clusters,
    Microsoft states that installing Azure NPM or Calico triggers a simultaneous node-pool reimage, and the selected engine
    must be validated against platform constraints such as Cilium being Linux-only and documented policy-behavior differences.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-network-policies
  - 2. https://learn.microsoft.com/en-us/azure/aks/azure-cni-powered-by-cilium
  page_start: 167
  audit_raw: "Review the AKS cluster networkProfile to verify that a supported network policy\ncapability is enabled and that\
    \ the configured policy model matches the cluster’s\nnetworking design. In current AKS, networkProfile.networkPolicy can\
    \ be azure,\ncalico, cilium, or none, and networkProfile.networkDataplane can be azure or\ncilium. Because modern AKS\
    \ Cilium-based deployments use the Cilium dataplane, the\naudit should evaluate both fields together instead of checking\
    \ networkPolicy alone.\nRun this command:\nexport CLUSTER_NAME=<your cluster name>\nexport RESOURCE_GROUP=<your resource\
    \ group name>\naz aks show \\\n  --name \"${CLUSTER_NAME}\" \\\n  --resource-group \"${RESOURCE_GROUP}\" \\\n  --query\n\
    \"{networkPolicy:networkProfile.networkPolicy,networkDataplane:networkProfile.\nnetworkDataplane,networkPlugin:networkProfile.networkPlugin,networkPluginMode\n\
    :networkProfile.networkPluginMode}\" \\\n  --output json\nThe results should show networkPolicy set to an approved value\
    \ rather than null or\nnone If your standard prefers or requires Cilium, the expected result should also show\nnetworkDataplane:\
    \ \"cilium\". Microsoft’s current AKS documentation also states\nthat pods can communicate without limitation by default,\
    \ so a result showing no active\nnetwork policy capability should be treated as noncompliant unless there is a\ndocumented\
    \ exception.\nOutput results would show:\n• networkPolicy: \"none\" or null indicates that AKS network policy\nenforcement\
    \ is not enabled. In that state, pod-to-pod traffic is not being controlled\nby a network policy engine.\n• networkPolicy:\
    \ \"azure\" indicates Azure Network Policy Manager is\nconfigured. This is still a valid setting today, but Microsoft\
    \ has published a\nretirement date of September 30, 2028 for Azure NPM on Linux nodes, so this\nshould usually be treated\
    \ as a transitional state rather than the preferred longterm target.\n• networkPolicy: \"calico\" indicates Calico is\
    \ configured as the policy engine.\nThis is a supported AKS option and should be assessed against your approvedengine\
    \ standard.\n• networkPolicy: \"cilium\" together with networkDataplane: \"cilium\"\nindicates a Cilium-based AKS configuration,\
    \ which aligns with Microsoft’s current\nAzure CNI Powered by Cilium model. Microsoft recommends Cilium for new\nLinux\
    \ deployments because of its eBPF-based enforcement and broader feature\nset.\n• networkPlugin and networkPluginMode should\
    \ also be reviewed because\nengine support depends on the broader AKS networking model. For example,\nMicrosoft documents\
    \ Azure CNI Powered by Cilium using Azure CNI with\nnetworkDataplane: cilium, and the managed cluster schema shows these\n\
    fields are part of the same evaluated network profile."
  remediation: 'Align each AKS cluster to an approved network policy baseline based on the

