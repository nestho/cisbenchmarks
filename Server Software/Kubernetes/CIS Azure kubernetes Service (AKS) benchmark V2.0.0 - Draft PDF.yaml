    ClusterRole\"\n        and (.metadata.labels[\"kubernetes.io/bootstrapping\"] != \"rbacdefaults\")\n        and (.metadata.name\
    \ | startswith(\"system:\") | not)\n      )\n    )\n  | [\n      .kind,\n      (.metadata.namespace // \"-\"),\n     \
    \ .metadata.name,\n      (\n        [.rules[]?\n         | select(any(.resources[]?; .==\"nodes/proxy\"))\n         |\
    \ \"verbs=\" + ((.verbs // []) | join(\",\"))\n        ] | join(\"; \")\n      )\n    ]\n  | @tsv\n'"
  remediation: 'Reduce custom RBAC access to the nodes/proxy API path so it is limited to approved

    administrative identities that require node-level access. In AKS, node access is treated

    as privileged, and service accounts continue to use Kubernetes RBAC for in-cluster

    authorization.

    • Remove nodes/proxy from any custom Role or ClusterRole where node-level

    proxying is not explicitly required for support, troubleshooting, or platform

    operations.

    • Where some node-related access is still needed, replace nodes/proxy with

    narrower permissions on only the specific resources and verbs required, and

    reduce scope from ClusterRole to namespace-scoped Role where the function

    allows it. AKS guidance favors minimum required permissions and separation of

    access boundaries.

    • Remove any RoleBinding or ClusterRoleBinding that grants nodes/proxy to

    workload service accounts, CI/CD identities, or broad operator groups unless

    there is an approved exception tied to a defined operational function.

    • For approved administrative use cases, keep nodes/proxy assigned only to

    dedicated support or platform-admin identities, and document the purpose,

    scope, and owner of each remaining assignment.

    • Revalidate the updated roles and bindings after the change to confirm that

    required node-support tasks still work and that no unnecessary custom RBAC

    objects retain nodes/proxy access.'
  checks:
  - type: manual_review
    info: 'Review AKS RBAC to identify custom Role and ClusterRole objects that grant access

      to the nodes/proxy subresource, and validate that each permission is required for an

      approved troubleshooting, maintenance, or platform-administration function. This review

      should focus on customer-managed RBAC because AKS uses Kubernetes RBAC to

      grant in-cluster permissions, and service accounts continue to rely on Kubernetes

      RBAC authorization when the identity is outside Microsoft Entra ID. The command

      below ret'
    severity: medium
- id: 4.1.10
  title: Minimize access to the approval sub-resource of CertificateSigningRequests objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to the approval sub-resource of CertificateSigningRequests objects so that only tightly controlled
    administrative identities can approve certificate requests in AKS. AKS uses certificates for component authentication,
    and each kubelet creates a CSR for communication to the API server that is signed by the cluster CA at the same time,
    AKS authorization is intentionally granular and is meant to give users, groups, and service accounts access only to the
    resources they require. In practice, this means CSR approval authority should not be broadly included in general-purpose
    cluster roles, namespace admin roles, or workload identities. Users with access to the update the approval sub-resource
    of CertificateSigningRequests objects can approve new client certificates for the Kubernetes API effectively allowing
    them to create new high-privileged user accounts. This can allow for privilege escalation to full cluster administrator,
    depending on users configured in the cluster
  rationale: it is important to preserve the integrity of the AKS trust chain and keep certificate issuance under strict administrative
    control. Microsoft recommends securing API server access with the lowest possible permission levels, and AKS RBAC is designed
    to scope permissions precisely across cluster and namespace boundaries. Because AKS continues to use service accounts
    and projected service account tokens as part of its identity model, any unnecessary expansion of privileged API permissions
    increases the chance that a compromised user, pod, or service account could participate in highertrust authentication
    flows than intended. Limiting CSR approval helps keep certificatebased trust separate from ordinary workload and namespace
    operations.
  impact: If access is not minimized, the blast radius of an RBAC mistake in AKS grows significantly. Microsoft’s AKS role
    guidance already warns that some permissions can become privilege-escalation paths because access to Secrets or the ability
    to run pods as any service account can lead to API access as that service account adding unnecessary CSR-approval capability
    would extend that risk into certificate approval territory. Operationally, restricting this access improves separation
    of duties, reduces the number of identities that can affect cluster authentication state, and makes audit review of highly
    privileged RBAC assignments more defensible in AKS.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-clustersecurity
  - 2. https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-identity
  page_start: 84
  audit_raw: 'Audit this control by reviewing how privileged access is actually granted across the AKS

    authorization model and then verifying that CSR approval authority is limited to a very

    small set of approved administrative identities. In AKS, this is not a discrete platform

    setting it is a least-privilege review across Microsoft Entra-integrated access,

    Kubernetes RBAC, and, where enabled, Azure RBAC for Kubernetes Authorization. The

    review should confirm whether any role can approve the

    CertificateSigningRequests approval subresource, whether that privilege is

    inherited by users, groups, or service accounts that do not require it, and whether

    observed CSR activity matches normal AKS certificate workflows such as kubelet TLS

    bootstrapping and certificate rotation.

    • Determine whether access is governed by Kubernetes RBAC, Azure RBAC for

    Kubernetes Authorization, or both.

    • Review Role and ClusterRole rules for the

    certificatesigningrequests/approval subresource.

    • Trace any matching rules through RoleBinding and ClusterRoleBinding

    assignments to the exact users, groups, and service accounts that receive them.

    • Confirm the permission is restricted to tightly controlled cluster-admin identities

    and not exposed through broad custom roles or workload identities.'
  remediation: 'Remediate this control by removing certificatesigningrequests/approval access

    from any Role or ClusterRole that is not explicitly required for cluster-level certificate

    administration, then rebind that capability only to tightly controlled AKS administrative

    identities. In AKS, the preferred model is to use Microsoft Entra integration with leastprivilege Kubernetes RBAC and,
    where enabled, Azure RBAC for Kubernetes

    Authorization, while keeping cluster-wide permissions narrowly scoped.

    The remediation should also account for service-account exposure, because Microsoft

    documents that access to Secrets or the ability to run pods as any service account can

    become a privilege-escalation path to Kubernetes API access. Finally, validate that only

    expected AKS certificate workflows, such as kubelet TLS bootstrapping and rotation,

    continue to generate approved CSRs after permissions are tightened.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing how privileged access is actually granted across the AKS

      authorization model and then verifying that CSR approval authority is limited to a very

      small set of approved administrative identities. In AKS, this is not a discrete platform

      setting it is a least-privilege review across Microsoft Entra-integrated access,

      Kubernetes RBAC, and, where enabled, Azure RBAC for Kubernetes Authorization. The

      review should confirm whether any role can approve the

      CertificateSigni'
    severity: medium
- id: 4.1.11
  title: Minimize access to webhook configuration objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to webhook configuration objects so that only tightly controlled clusteradministrative identities
    can create, update, or delete ValidatingWebhookConfiguration and MutatingWebhookConfiguration resources in AKS. Admission
    controllers run after authentication and authorization but before an object is persisted, and Microsoft’s AKS documentation
    shows that webhook configurations define the webhook service endpoint and related trust material used by the API server.
    In AKS, these objects can govern validation and mutation behavior used by components such as Azure Policy / Gatekeeper,
    service-mesh injectors, and other admission integrations, so they should not be broadly writable by general users, namespace
    operators, or workload service accounts. Users with rights to create/modify/delete validatingwebhookconfigurations or
    mutatingwebhookconfigurations can control webhooks that can read any object admitted to the cluster, and in the case of
    mutating webhooks, also mutate admitted objects. This could allow for privilege escalation or disruption of the operation
    of the cluster.
  rationale: 'Preserve the integrity of the AKS admission path and prevent non-administrative identities from changing how
    the API server evaluates or mutates requests. Microsoft’s AKS identity guidance states that Kubernetes RBAC should grant
    users, groups, and service accounts only the resources they need, and that service accounts continue to rely on normal
    Kubernetes RBAC even when Azure RBAC for Kubernetes Authorization is enabled for Microsoft Entra identities. Because webhook
    configuration objects determine which requests are intercepted and which in-cluster service receives those admission callbacks,
    broad write access creates a privilege boundary issue: a compromised user or service account with webhookconfiguration
    permissions could alter policy-enforcement behavior or redirect admission processing in ways that exceed its intended
    operational role.'
  impact: If access is not minimized, the impact in AKS is both security and operational. Microsoft documents that unhealthy
    admission controllers can block API server requests, and AKS specifically warns that overly broad webhook rules or webhook
    configurations that apply to AKS-managed cluster-scoped resources such as nodes, leases, or clusterroles can cause operations
    like cluster stop to fail with ValidationError. In practice, overprivileged access to webhook configuration objects can
    therefore lead to rejected or unexpectedly modified resource admissions, disruption of policy enforcement or sidecar-injection
    workflows, and instability in cluster lifecycle or platform operations that depend on predictable admission behavior.
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#controladmission-webhooks
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 87
  audit_raw: 'Audit this control by identifying who can modify cluster-scoped webhook configuration

    resources and confirming that webhook definitions are limited to approved admission

    use cases in AKS. The review should verify that ValidatingWebhookConfiguration

    and MutatingWebhookConfiguration objects are present only where operationally

    required, that their scope is not broader than necessary, and that access to manage

    them is restricted through least-privilege RBAC. Microsoft’s AKS guidance also warns

    that misconfigured admission webhooks can disrupt cluster operations, especially when

    they apply too broadly or affect AKS-managed resources.

    • Identify whether cluster access is governed through Kubernetes RBAC alone or

    also through Azure RBAC for Kubernetes Authorization.

    • Review cluster-scoped roles for permissions on

    validatingwebhookconfigurations and mutatingwebhookconfigurations.

    • Trace those permissions through bindings to the exact users, groups, and

    service accounts that receive them.

    • Review existing webhook configurations to confirm their rules, selectors, and

    scope are narrowly defined and do not target AKS-managed namespaces or

    resources.

    kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o

    wide

    This command retrieves all validating and mutating admission webhook configuration

    objects in the cluster and displays them in an expanded view so they can be reviewed

    for presence, scope, and expected use.'
  remediation: 'Remediate this control by removing permission to create, update, patch, or delete

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects

    from broad ClusterRole and Role assignments, and then rebinding that access only to

    tightly controlled cluster-administrative identities. In AKS, this should be implemented

    through least-privilege Kubernetes RBAC and, where used, Azure RBAC for

    Kubernetes Authorization, with access granted through centrally managed identity

    groups rather than widely distributed individual assignments.

    Service-account permissions should be reviewed as part of the same effort so workload

    identities do not inherit cluster-scoped webhook-management capability. Review each

    webhook configuration and narrow its match criteria to only the required namespaces,

    resources, and operations. In AKS, Microsoft recommends avoiding broad webhook

    scope, excluding AKS internal namespaces and managed resources, and ensuring

    webhook backends remain healthy so admission processing does not disrupt APIserver requests or normal cluster lifecycle
    operations.'
  checks:
  - type: manual_review
    info: 'Audit this control by identifying who can modify cluster-scoped webhook configuration

      resources and confirming that webhook definitions are limited to approved admission

      use cases in AKS. The review should verify that ValidatingWebhookConfiguration

      and MutatingWebhookConfiguration objects are present only where operationally

      required, that their scope is not broader than necessary, and that access to manage

      them is restricted through least-privilege RBAC. Microsoft’s AKS guidance also warns

      that'
    severity: medium
- id: 4.1.12
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to service account token creation so that only tightly controlled administrative or platform
    identities can request tokens for Kubernetes service accounts in AKS. AKS uses service accounts as a core Kubernetes identity
    type and documents that workloads can use Service Account Token Volume Projection to obtain a Kubernetes token, and AKS
    OIDC guidance states that projected service account tokens are required for Kubernetes 1.30+ clusters, with a maximum
    token lifetime of 24 hours. In practice, permission to create or issue these tokens should not be broadly granted to namespace
    operators, CI/CD identities, or general workload service accounts. Users with rights to create new service account tokens
    at a cluster level, can create long-lived privileged credentials in the cluster. This could allow for privilege escalation
    and persistent access to the cluster, even if the users account has been revoked.
  rationale: Microsoft’s AKS guidance states that Kubernetes RBAC should grant users, groups, and service accounts only the
    resources they need, and Microsoft also notes that Azure RBAC for Kubernetes Authorization and Kubernetes RBAC must still
    be managed separately. In addition, AKS built-in role guidance warns that access patterns involving Secrets or the ability
    to run pods as any service account can be used to gain that service account’s API access. By extension, granting token-creation
    capability would provide an even more direct path to usable service-account credentials. The last sentence is an inference
    from Microsoft’s documented credential model and privilegeescalation guidance.
  impact: If access is not minimized, a compromised user, group, or automation identity could mint time-bounded but valid
    service-account tokens and use them to authenticate to the Kubernetes API with the effective rights of the targeted service
    account. In clusters that use Microsoft Entra Workload ID, Microsoft documents that the AKS cluster acts as the token
    issuer and that the projected service account token can be exchanged through OIDC federation for a Microsoft Entra token
    to access Azure resources, which expands the blast radius beyond Kubernetes-only operations
  references:
  - 1. https://kubernetes.io/docs/concepts/security/rbac-good-practices/#token-request
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 90
  audit_raw: 'Confirm that the ability to create service account tokens is restricted to only the

    identities that explicitly require it for approved platform or workload operations. In AKS,

    service accounts remain Kubernetes identities governed by Kubernetes RBAC, while

    Microsoft Entra Workload ID relies on projected service account tokens and OIDC

    federation to obtain Azure access tokens, so unnecessary token-creation rights should

    be treated as a credential-issuance risk rather than a routine namespace permission.

    Where Azure RBAC for Kubernetes Authorization is enabled, review it alongside

    Kubernetes RBAC because the two authorization models are managed separately in

    AKS.

    • Determine whether the cluster uses Kubernetes RBAC only or Azure RBAC for

    Kubernetes Authorization in addition to Kubernetes RBAC.

    • Review cluster and namespace roles for permission to create the

    serviceaccounts/token subresource or other paths that can issue service account

    credentials.

    • Trace those permissions through bindings to the exact users, groups, and

    service accounts that inherit them.

    • Confirm each assignee has a documented need for token issuance and that the

    permission is not exposed through broad custom roles, CI/CD identities, or

    workload service accounts.

    • Validate that current service-account token use aligns with expected AKS

    workload identity or platform behavior and not ad hoc credential minting.

    Review the users who have access to create the token sub-resource of

    serviceaccount objects in the Kubernetes API.'
  remediation: 'Review all Role and ClusterRole definitions for access to the

    serviceaccounts/token subresource, removing that permission from any user, group,

    CI/CD identity, or workload service account that does not have a documented

    operational requirement. In AKS, service accounts are still governed through

    Kubernetes RBAC, and Microsoft’s guidance is to grant users, groups, and service

    accounts only the permissions they need. This review should also account for Azure

    RBAC for Kubernetes Authorization where it is enabled, because Microsoft documents

    that Microsoft Entra identities and Kubernetes service accounts follow different

    authorization paths in AKS.

    1. Review Role and ClusterRole objects for serviceaccounts/token access.

    2. Remove that permission from broad operational roles, CI/CD identities, and

    workload service accounts.

    3. Reassign it only to approved administrative or platform identities with a

    documented need.

    4. Validate that required workload identity and projected-token flows still function

    correctly.

    5. Recheck bindings to confirm no unintended subject still inherits token-creation

    rights'
  checks:
  - type: manual_review
    info: 'Confirm that the ability to create service account tokens is restricted to only the

      identities that explicitly require it for approved platform or workload operations. In AKS,

      service accounts remain Kubernetes identities governed by Kubernetes RBAC, while

      Microsoft Entra Workload ID relies on projected service account tokens and OIDC

      federation to obtain Azure access tokens, so unnecessary token-creation rights should

      be treated as a credential-issuance risk rather than a routine namespace perm'
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of privileged containers by restricting the ability to create pods whose containers,
    init containers, or ephemeral containers run with securityContext.privileged=true, and reserve that capability for narrowly
    approved platform scenarios only. In AKS, this remains applicable because privileged workload admission can be governed
    at namespace scope with Pod Security Admission and at cluster scope with Azure Policy or Deployment Safeguards, which
    Microsoft documents as supported enforcement paths for secure workload admission. Do not generally permit containers to
    be run with the securityContext.privileged flag set to true.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A container running with full
    privileges can do almost everything that the host can do. This flag exists to allow special use-cases, like manipulating
    the network stack and accessing devices. There should be at least one admission control policy defined which does not
    permit privileged containers. If you need to run privileged containers, this should be defined in a separate policy and
    you should carefully check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true and spec.ephemeralContainers[].securityContext.privileged: true will not be permitted.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-forkubernetes
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
  page_start: 94
  audit_raw: "List the policies in use for each namespace in the cluster, ensure that each policy\ndisallows the admission\
    \ of privileged containers.\nSince manually searching through each pod's configuration might be tedious, especially\n\
    in environments with many pods, you can use a more automated approach with grep or\nother command-line tools.\nHere's\
    \ an example of how you might approach this with a combination of kubectl, grep,\nand shell scripting for a more automated\
    \ solution:\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name\
    \ as $pod\n  | .spec.containers[]? as $c\n  | select(($c.securityContext.privileged // false) == true)\n  | \"\\($ns)/\\\
    ($pod)\\tcontainer=\\($c.name)\\tprivileged=true\"\n'\nSample Output:\nkube-system/csi-azuredisk-node-2brwf  container=azuredisk\
    \ privileged=true\nkube-system/csi-azurefile-node-4l8qk  container=azfilesrefresh\nprivileged=true\nkube-system/csi-azurefile-node-4l8qk\
    \  container=azurefile privileged=true\nkube-system/kube-proxy-l8vzl  container=kube-proxy  privileged=true\nOR\nkubectl\
    \ get pods --all-namespaces -o json | jq '.items[] |\nselect(.metadata.namespace != \"kube-system\" and\n.spec.containers[]?.securityContext?.privileged\
    \ == true) | {pod:\n.metadata.name, namespace: .metadata.namespace, container:\n.spec.containers[].name}'\nWhen creating\
    \ a Pod Security Policy, [\"kube-system\"] namespaces are excluded by\ndefault.\nThis command uses jq, a command-line\
    \ JSON processor, to parse the JSON output\nfrom kubectl get pods and filter out pods where any container has the\nsecurityContext.privileged\
    \ flag set to true. Please note that you might need to adjust the\ncommand depending on your specific requirements and\
    \ the structure of your pod\nspecifications."
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of privileged containers.

    To enable PSA for a namespace in your cluster, set the podsecurity.kubernetes.io/enforce label with the policy value you
    want to enforce.

