- id: 4.4.1
  title: Ensure latest Azure CNI Overlay is used
  scoring: manual
  profile:
  - Level 1
  description: Ensure the AKS cluster uses Azure CNI Overlay as the supported overlay networking model and remains on current
    AKS-managed networking components through cluster and node image upgrades. Azure CNI Overlay is the recommended CNI plugin
    for most overlay scenarios and the general recommendation for pod networking, while AKS delivers related component, feature,
    and security updates through its managed upgrade model rather than through a separately administered CNI package lifecycle.
  rationale: It is important to maintain a supported and current networking architecture that aligns with Microsoft’s recommended
    AKS design. Azure CNI Overlay uses a separate pod CIDR, simplifies IP address management, and is identified by Microsoft
    as the preferred general networking choice for many AKS deployments. Microsoft also states that clusters need updates
    to newer IPAM modes and data-plane technologies to access the latest features and supportability, which makes staying
    current on the supported overlay model operationally important even in a managed service.
  impact: If this control is not maintained, the cluster can remain on older or legacy networking approaches that carry higher
    support and operational risk. Microsoft documents that older node images can contain unpatched vulnerabilities, may not
    work properly with newer features, and can place the cluster outside support scope until upgraded; Microsoft also documents
    supported forward migration paths from Kubenet and Azure CNI Node Subnet to Azure CNI Overlay, which reinforces that Overlay
    is the current direction of travel for supported overlay networking in AKS.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-network-cni-overview
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay
  page_start: 111
  audit_raw: "Verify that the AKS cluster is using Azure CNI Overlay as its networking model and that\na supported network\
    \ policy engine is configured as part of the cluster network profile. In\ncurrent AKS guidance, Azure CNI Overlay is the\
    \ recommended plugin for most overlay\nscenarios, and AKS exposes the relevant audit fields through networkProfile,\n\
    including the network plugin, overlay mode, network policy, and network data plane.\nBecause network-policy capability\
    \ depends on the configured policy engine and not only\non the presence of Azure CNI Overlay, the review should confirm\
    \ both the overlay\nconfiguration and the policy implementation in use.\n• Confirm the cluster networkProfile shows networkPlugin\
    \ set to Azure and\nnetworkPluginMode set to Overlay.\n• Review the networkPolicy setting to verify a supported policy\
    \ engine is\nconfigured rather than none.\n• Review the networkDataplane value to determine whether the cluster is using\n\
    the Azure data plane or Cilium, since Microsoft recommends Cilium for new\nnetwork-policy deployments.\n• Verify the configured\
    \ network architecture aligns with current AKS guidance,\nwhich recommends Azure CNI Overlay for most overlay scenarios.\n\
    • Record the returned values as audit evidence and treat the control as not fully\nsatisfied if Overlay is not enabled\
    \ or if no supported network policy engine is\nconfigured.\naz aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME}\
    \ --query\n\"{networkPlugin:networkProfile.networkPlugin,\nnetworkPluginMode:networkProfile.networkPluginMode,\nnetworkPolicy:networkProfile.networkPolicy,\n\
    networkDataplane:networkProfile.networkDataplane}\" -o json\nSample Output:\n{\n  \"networkDataplane\": \"azure\",\n \
    \ \"networkPlugin\": \"azure\",\n  \"networkPluginMode\": \"overlay\",\n  \"networkPolicy\": \"azure\"\n}\nThis command\
    \ returns the key AKS network profile fields needed to determine whether\nthe cluster is using Azure CNI Overlay and whether\
    \ a supported network policy\nimplementation is enabled."
  remediation: 'Migrate the cluster to Azure CNI Overlay if it is still using Kubenet or Azure CNI Node

    Subnet, and complete the change through supported AKS upgrade paths. Microsoft

    documents a single forward-only migration path to Azure CNI Overlay for existing

    clusters, and if Azure CNI Powered by Cilium is also required, the IPAM-mode update to

    Overlay and the data-plane update to Cilium must be performed as separate operations.

    Configure a supported network policy engine and validate that the cluster network

    profile to reflect the intended steady state. Microsoft documents Azure CNI Overlay as

    compatible with supported AKS network policy options, and the remediation should end

    with confirmation that networkPlugin is Azure, networkPluginMode is Overlay, and

    the selected policy and data-plane settings match the approved design.

    • Review the current networkProfile to identify the active network plugin, plugin

    mode, policy engine, and data plane.

    • If the cluster is not using Azure CNI Overlay, migrate it using the supported AKS

    update path for IPAM-mode changes.

    • If required, perform the data-plane migration to Azure CNI Powered by Cilium as

    a separate follow-on change.

    • Enable or align a supported network policy engine with the approved AKS

    networking design.'
  checks:
  - type: manual_review
    info: 'Verify that the AKS cluster is using Azure CNI Overlay as its networking model and that

      a supported network policy engine is configured as part of the cluster network profile. In

      current AKS guidance, Azure CNI Overlay is the recommended plugin for most overlay

      scenarios, and AKS exposes the relevant audit fields through networkProfile,

      including the network plugin, overlay mode, network policy, and network data plane.

      Because network-policy capability depends on the configured policy engine and'
    severity: medium
- id: 4.4.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: scored
  profile:
  - Level 2
  description: Ensure each namespace that hosts workloads has explicit NetworkPolicy resources defined so pod ingress and
    egress behavior is intentionally governed instead of left to the default state. In AKS, Azure CNI Overlay provides direct
    pod-to-pod communication on an overlay CIDR, and Microsoft documents that pods in an AKS cluster can send and receive
    traffic without limitations unless network policies are created. Azure CNI Overlay supports Azure network policies, Calico,
    and Cilium, so this control remains applicable on the current supported overlay model.
  rationale: The rationale is to enforce namespace-level segmentation and least-privilege pod-topod traffic control in AKS,
    where workload communication is unrestricted by default. Microsoft recommends network policies to explicitly define allowed
    communication paths and reduce unauthorized lateral movement between applications. In Azure CNI Overlay, this is particularly
    important because the overlay network preserves pod connectivity, but it does not itself enforce workload-level traffic
    restrictions.
  impact: If namespaces do not have network policies defined, workloads remain on AKS’s default allow model, which means pods
    can communicate broadly across the cluster unless another control intervenes. In an Azure CNI Overlay deployment, pod
    traffic inside the cluster remains direct, while external access is handled separately through services and NAT, so the
    main exposure is uncontrolled internal traffic rather than direct external pod reachability. Operationally, this weakens
    tenant, namespace, and service isolation and increases the blast radius of a compromised pod or misconfigured workload.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-network-azure-cni-overlay
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-network-policies
  page_start: 114
  audit_raw: 'Confirm that the AKS cluster uses a supported network policy engine and that each

    workload namespace has explicit NetworkPolicy objects to restrict pod traffic. In AKS,

    pod traffic is allowed by default unless network policies are defined, and Azure CNI

    Overlay preserves pod-to-pod connectivity rather than enforcing segmentation by itself.

    • Check the cluster network profile to confirm Azure CNI Overlay and the

    configured network policy engine.

    • List all NetworkPolicy objects across namespaces.

    • Verify each workload namespace has policies that define the intended ingress

    and egress boundaries.

    • Treat namespaces without required policies, or with overly broad policies, as

    findings.

    Use these simple checks:

    az aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query

    "{networkPlugin:networkProfile.networkPlugin,

    networkPluginMode:networkProfile.networkPluginMode,

    networkPolicy:networkProfile.networkPolicy}" -o json

    kubectl get networkpolicy --all-namespaces'
  remediation: 'Ensure the AKS cluster is using a supported network policy engine with Azure CNI

    Overlay, then defining explicit NetworkPolicy objects for every workload-hosting

    namespace. In AKS, pod traffic is unrestricted by default until policies are applied,

    Azure CNI Overlay supports Azure network policies, Calico, and Cilium, and Microsoft

    currently recommends Cilium for new policy deployments because of its scalability,

    security, and eBPF-based enforcement.

    1. Enable or migrate to a supported network policy engine for the cluster if

    networkPolicy is unset or still using a legacy design.

    2. Create a baseline deny-all policy in each workload namespace so traffic is

    blocked until explicitly allowed.

    3. Add targeted ingress and egress allow rules for required application, platform,

    DNS, logging, and external service flows.

    4. Verify that policy podSelector, namespace selectors, ports, and policyTypes

    cover all intended workloads so pods are not left outside policy scope.

    5. Restrict who can create or modify NetworkPolicy resources so namespace

    segmentation remains controlled and consistent over time.

    After the policies are deployed, validate that each workload namespace has the

    required deny and allow rules and confirm application traffic still functions as intended'
  checks:
  - type: manual_review
    info: 'Confirm that the AKS cluster uses a supported network policy engine and that each

      workload namespace has explicit NetworkPolicy objects to restrict pod traffic. In AKS,

      pod traffic is allowed by default unless network policies are defined, and Azure CNI

      Overlay preserves pod-to-pod connectivity rather than enforcing segmentation by itself.

      • Check the cluster network profile to confirm Azure CNI Overlay and the

      configured network policy engine.

      • List all NetworkPolicy objects across namespaces.'
    severity: medium
- id: 4.5.1
  title: Prefer exposing secrets as mounted files rather than environment variables
  scoring: scored
  profile:
  - Level 2
  description: Prefer exposing secrets to AKS workloads as mounted files rather than as environment variables, particularly
    when secrets are sourced from Azure Key Vault through the Secrets Store CSI Driver. In current AKS guidance, the Key Vault
    integration model is volume-based, with secrets made available at a mounted path inside the container, and Microsoft documents
    that mounted content can be synchronized and rotated through the CSI provider. Environment-variable consumption is still
    supported when secrets are synced into a Kubernetes Secret, but it is a secondary consumption pattern rather than the
    native CSI delivery path.
  rationale: It is important to align secret delivery with AKS’s supported rotation and identity model. Microsoft documents
    that, with autorotation enabled, the CSI provider can update the pod mount and synced Kubernetes Secret, and applications
    that read secrets from the filesystem can react to file changes without requiring a full pod restart. By contrast, when
    a secret is consumed as an environment variable, Microsoft states that the pod must be restarted to receive the latest
    value. In AKS, that makes file-based delivery the stronger pattern for secrets that rotate regularly or are backed by
    Azure Key Vault.
  impact: If secrets are primarily exposed as environment variables, rotated values can remain stale in running AKS workloads
    until a restart or rolling redeployment occurs. That increases operational friction during credential rotation, slows
    response to secret changes, and can leave applications using expired or superseded credentials longer than intended. Microsoft
    also notes a related Kubernetes limitation for subPath secret mounts, where automated updates are not received, so the
    safest AKS pattern is a standard mounted secret path that the application can watch and reload.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
  - 2. https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-configurationoptions
  page_start: 118
  audit_raw: "Identify workloads that consume secrets through environment variables and treat those\ncases as exceptions that\
    \ require justification. In AKS, mounted secrets are the preferred\nsteady-state pattern because they can be updated through\
    \ the Secrets Store CSI Driver\nand autorotation process, whereas secrets exposed through environment variables\nrequire\
    \ a pod restart before updated values are available. This is especially important\nwhen secrets are sourced from Azure\
    \ Key Vault through the managed Secrets Store\nCSI Driver.\n• Identify workloads that use secret-backed environment variables,\
    \ including\nsecretKeyRef and envFrom.secretRef.\n• Review whether those workloads use mounted secret files instead of\n\
    environment-variable injection.\n• Treat environment-variable usage as an exception and confirm it is documented\nand\
    \ justified.\n• Verify a restart process exists where environment-variable secrets are still\nrequired.\n• Confirm file-based\
    \ secret delivery is used where rotation is expected.\nA quick cluster-side verification:\nkubectl get deploy,statefulset,daemonset,job,cronjob,pod\
    \ -A -o json | jq -r '\n.items[]\n| .metadata.namespace as $ns\n| .kind as $kind\n| .metadata.name as $name\n| (\n   \
    \ if .kind==\"CronJob\" then .spec.jobTemplate.spec.template.spec\n    elif .kind==\"Pod\" then .spec\n    else .spec.template.spec\n\
    \    end\n  ) as $spec\n| [\n    ($spec.containers[]?.env[]? | select(.valueFrom.secretKeyRef) |\n\"env.secretKeyRef\"\
    ),\n    ($spec.initContainers[]?.env[]? | select(.valueFrom.secretKeyRef) |\n\"init.env.secretKeyRef\"),\n    ($spec.containers[]?.envFrom[]?\
    \ | select(.secretRef) |\n\"envFrom.secretRef\"),\n    ($spec.initContainers[]?.envFrom[]? | select(.secretRef) |\n\"\
    init.envFrom.secretRef\")\n  ] | unique | select(length>0)\n| \"\\($ns)\\t\\($kind)/\\($name)\\t\" + join(\",\")\n'\n\
    NOTE: If the command returns rows, those workloads use secret-backed environment\nvariables and should be reviewed. If\
    \ it returns no rows, no such references were found\nin the inspected workloads, but mounted secret volumes or SecretProviderClass\n\
    usage should still be checked to confirm file-based secret delivery."
  remediation: 'Move workloads away from secret-backed environment variables and toward file-based

    secret delivery through mounted volumes, preferably using the Azure Key Vault provider

    for Secrets Store CSI Driver. In AKS, mounted secrets support sync and autorotation,

    while secrets exposed through environment variables do not update in running pods

    until those pods are restarted.

    1. Identify workloads that use secretKeyRef or envFrom.secretRef and classify

    them for migration.

    2. Replace environment-variable injection with mounted secret files, ideally through

    SecretProviderClass and the Secrets Store CSI Driver.

    3. Enable secret autorotation where supported so mounted content and synced

    Kubernetes Secrets are refreshed automatically.

    4. Update the application to read secrets from the mounted path and reload them

    from file when values change. This last point is an implementation step inferred

    from Microsoft’s documented mount-update behavior.

    5. Keep environment-variable usage only for approved exceptions, and pair those

    cases with a controlled pod-restart process during secret rotation.'
  checks:
  - type: manual_review
    info: 'Identify workloads that consume secrets through environment variables and treat those

      cases as exceptions that require justification. In AKS, mounted secrets are the preferred

      steady-state pattern because they can be updated through the Secrets Store CSI Driver

      and autorotation process, whereas secrets exposed through environment variables

      require a pod restart before updated values are available. This is especially important

      when secrets are sourced from Azure Key Vault through the managed Secr'
    severity: medium
- id: 4.5.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider external secret storage for AKS workloads by storing sensitive values in Azure Key Vault and retrieving
    them at runtime through the Azure Key Vault provider for Secrets Store CSI Driver instead of treating in-cluster Kubernetes
    Secret objects as the primary secret system. Microsoft documents this as a supported AKS integration in which secrets,
    keys, and certificates are mounted into pods through a CSI volume, with access mediated by a managed identity or Microsoft
    Entra Workload ID.
  rationale: It is important to align secret handling with AKS’s supported identity, rotation, and operational model. Microsoft
    documents that the CSI-based Key Vault integration supports mounted secret delivery, managed identity–based access, autorotation
    of mounted contents and synced Kubernetes Secrets, and runtime retrieval of the latest secret values from Key Vault. Microsoft’s
    AKS Well-Architected guidance also states that this pattern helps protect and rotate secrets by using strong encryption,
    provides an access audit log, and keeps core secrets out of the deployment pipeline.
  impact: If external secret storage is not used where appropriate, sensitive application credentials are more likely to remain
    embedded in cluster-native objects, deployment artifacts, or operational workflows that are harder to rotate and govern
    consistently. In AKS, using Azure Key Vault with the Secrets Store CSI Driver improves secret freshness through rotation
    support and limits secret delivery to the requesting pod, while the Well-Architected guidance highlights the additional
    benefits of centralized protection. As a result, not adopting external secret storage can increase operational overhead
    during rotation and reduce assurance around how critical secrets are stored, accessed, and tracked.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
  - 2. https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-configurationoptions
  page_start: 122
  audit_raw: 'Audit secrets management by confirming that sensitive values are stored externally,

    delivered to pods through the AKS-supported secret path, and rotated without relying on

    manual redeployments. Microsoft’s current AKS guidance centers on Azure Key Vault,

    the Azure Key Vault provider for Secrets Store CSI Driver, and mounted secret delivery

    with autorotation support.

    • Verify secrets are primarily stored in Azure Key Vault, not embedded in code,

    manifests, or pipelines.

    • Confirm the Secrets Store CSI Driver is enabled and SecretProviderClass is

    used where external secrets are required.

    • Review workload access to Key Vault and ensure it uses managed identity or

    Microsoft Entra Workload ID with least-privilege access.

    • Flag secret-backed environment variables as exceptions, since mounted secrets

    support rotation more cleanly.

    • Verify autorotation is enabled where needed and that applications can reload

    updated mounted secrets.'
  remediation: 'Move application secrets out of Kubernetes-native storage and deployment artifacts and

    into Azure Key Vault and then to pods at runtime through the Azure Key Vault provider

    for Secrets Store CSI Driver. In AKS, pair the CSI driver with Microsoft Entra Workload

    ID or the add-on managed identity, use mounted secret files as the primary

    consumption path, and enable autorotation where secret freshness matters.

    • Inventory secrets currently stored in code, manifests, pipelines, or standalone

    Kubernetes Secret objects and classify them for migration to Key Vault.

    • Enable the Azure Key Vault provider for Secrets Store CSI Driver on the cluster if

    it is not already enabled.

    • Configure workload access through Workload ID or the AKS-managed identity,

    with least-privilege Key Vault permissions scoped to only the required secret

    objects.

    • Replace secret-backed environment variables with mounted secret files delivered

    through SecretProviderClass where practical.

    • Enable secret autorotation for rotatable values and confirm applications can

    reload updated mounted content without manual secret redistribution.'
  checks:
  - type: manual_review
    info: 'Audit secrets management by confirming that sensitive values are stored externally,

      delivered to pods through the AKS-supported secret path, and rotated without relying on

      manual redeployments. Microsoft’s current AKS guidance centers on Azure Key Vault,

      the Azure Key Vault provider for Secrets Store CSI Driver, and mounted secret delivery

      with autorotation support.

      • Verify secrets are primarily stored in Azure Key Vault, not embedded in code,

      manifests, or pipelines.

      • Confirm the Secrets Stor'
    severity: medium
- id: 4.6.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Create administrative boundaries between resources by organizing AKS workloads into separate namespaces and
    scoping access to those namespaces with Kubernetes RBAC or Azure RBAC for Kubernetes Authorization. Namespaces form the
    logical isolation boundary for workloads and resources, and Kubernetes RBAC can scope permissions to a single namespace
    or across the entire cluster. In AKS, this is the standard way to separate teams, applications, and environments inside
    a shared cluster while applying per-namespace controls such as access, quotas, and network policy.
  rationale: It is important to reduce administrative sprawl and enforce least-privilege operations within a shared AKS cluster.
    Microsoft recommends logical isolation first because it lets multiple workloads or teams share one cluster while still
    applying scoped permissions and other namespace-level controls, which improves density and reduces excess capacity compared
    with creating separate clusters for every team or application. Namespace scoping also fits Microsoft’s identity guidance,
    which emphasizes granting users, groups, and service accounts only the resources they need. Limiting the scope of user
    permissions reduces the impact of mistakes or malicious activity by keeping administrative access aligned to a defined
    namespace boundary. In AKS, namespaces provide logical separation for workloads and resources, and access to those namespaces
    can be controlled through Kubernetes RBAC or Azure RBAC for Kubernetes Authorization. While resources are created in the
    default namespace unless another namespace is specified, Microsoft’s current guidance is to organize workloads into separate
    namespaces and apply scoped access, quotas, and network policies to support controlled multi-team or multi-application
    operations within a shared cluster.
  impact: If namespaces are not used to establish administrative boundaries, AKS access and operational controls tend to become
    broader and harder to govern, increasing the chance that users or workloads can affect resources outside their intended
    scope. At the same time, Microsoft cautions that namespaces do not provide sufficient isolation for hostile multitenant
    workloads because the security domain is effectively the cluster, so relying on namespaces alone for strong tenant isolation
    can create false assurance. In those cases, Microsoft recommends dedicated clusters or stronger isolation models instead
    of namespace-only separation.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-clusterisolation
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-managed-namespaces
  page_start: 126
  audit_raw: 'Verify that namespaces are not only present, but are being used as intentional

    administrative boundaries for teams, applications, or environments within the AKS

    cluster. Namespaces are the logical isolation boundary for workloads and resources in a

    shared cluster, and they should be paired with scoped access controls and other

    namespace-level governance such as quotas and network policies. Namespaces alone

    are not sufficient for hostile multitenancy, so the audit should focus on whether they are

    being used consistently to separate administration and operations as intended.

    • List all namespaces in the cluster and confirm each one has a defined

    administrative or workload purpose.

    • Verify that user and service-account access is scoped to the appropriate

    namespaces rather than granted broadly at cluster scope.

    • Review whether namespace-level controls such as quotas and network policies

    are applied where required.

    Quick inventory checks:

    kubectl get namespaces

    kubectl get rolebindings,roles -A

    kubectl get clusterrolebindings,clusterroles

    kubectl get resourcequota,networkpolicy -A

    A namespace should be considered adequately administered only when it has a clear

    purpose, appropriately scoped RBAC, and the namespace-level controls needed for

    that workload or team.'
  remediation: 'Microsoft recommends namespaces as the logical isolation boundary for workloads and

    resources in shared clusters, combined with namespace-level governance such as

    quotas and network policies; where stronger tenant isolation is required, Microsoft

    recommends separate clusters rather than relying on namespaces alone.

    1. Create separate namespaces for each team, application, or environment that

    requires its own administrative scope.

    2. Move workloads out of the default namespace and into the appropriate managed

    namespace structure.

    3. Rebind access using namespace-scoped Role and RoleBinding objects, or

    namespace-scoped Azure RBAC assignments where applicable.

    4. Apply namespace-level controls such as resource quotas and network policies to

    reinforce the administrative boundary.

    5. Remove unused namespaces and reduce cluster-wide permissions that bypass

    intended namespace separation.'
  checks:
  - type: manual_review
    info: 'Verify that namespaces are not only present, but are being used as intentional

      administrative boundaries for teams, applications, or environments within the AKS

      cluster. Namespaces are the logical isolation boundary for workloads and resources in a

      shared cluster, and they should be paired with scoped access controls and other

      namespace-level governance such as quotas and network policies. Namespaces alone

      are not sufficient for hostile multitenancy, so the audit should focus on whether they are'
    severity: medium
- id: 4.6.2
  title: Apply Security Context to Your Pods and Containers
  scoring: manual
  profile:
  - Level 2
  description: Apply securityContext settings to pods and containers so workload runtime behavior is explicitly constrained
    instead of relying on image defaults or permissive cluster admission. In AKS, Microsoft’s current pod-security guidance
    calls out settings such as runAsNonRoot, runAsUser, runAsGroup, fsGroup, allowPrivilegeEscalation, capabilities, and seccompProfile,
    and AKS supports enforcing or validating these expectations through Pod Security Admission and Deployment Safeguards.
  rationale: Applying securityContext reduces container runtime privilege and strengthens isolation between the application
    and the host. It helps enforce least-privilege execution by avoiding root access, limiting unnecessary privilege escalation,
    and supporting Linux security controls such as user namespaces, AppArmor, and seccomp. In AKS, these restrictions are
    defined in the workload manifest and carried consistently into deployment.
  impact: If security context is not explicitly applied, AKS workloads can run with broader privileges than intended, weakening
    runtime security and workload isolation. Microsoft’s AKS controls also treat several unsafe or missing pod security settings
    as warn-or-deny conditions, which can increase both compliance and operational risk.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/developer-best-practices-podsecurity
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-psa
  page_start: 129
  audit_raw: 'Audit this control by reviewing workload manifests to confirm pod- and container-level

    securityContext settings are explicitly defined and aligned to the AKS security

    baseline. In current AKS guidance, securityContext is the primary manifest-level

    mechanism for enforcing least-privilege runtime behavior, and AKS supports validating

    or enforcing these settings through Pod Security Admission and Deployment

    Safeguards.

    • Review pod specs for explicit securityContext settings at the pod and

    container level. Focus on runAsNonRoot, runAsUser, runAsGroup, fsGroup,

    allowPrivilegeEscalation, capabilities, and seccompProfile.

    • Flag workloads that run as root, allow privilege escalation, or omit required

    security context controls as findings unless formally approved. Microsoft

    specifically recommends setting allowPrivilegeEscalation to false and

    running as a defined non-root user or group.

    • Verify the cluster is using namespace-level Pod Security Admission labels where

    applicable, since AKS supports enforce, audit, and warn modes for Pod Security

    Standards.

    • Confirm whether Deployment Safeguards is enabled to warn on or deny

    noncompliant workload settings at create or update time.'
  remediation: 'Remediate by defining and enforcing a hardened pod/container security baseline for all

    application namespaces in AKS, then requiring workloads to declare the necessary

    securityContext fields in their manifests. In AKS, Pod Security Admission (PSA) is

    enabled by default and is applied with namespace labels, while Microsoft’s pod-security

    guidance recommends explicit settings such as non-root execution,

    allowPrivilegeEscalation: false, limited capabilities, and seccompProfile. For

    broader cluster-wide governance, AKS also supports Deployment Safeguards to warn

    on or deny noncompliant workload definitions at create or update time.

    • Apply PSA restricted or baseline labels to general application namespaces, using

    warn and audit first where rollout needs to be staged.

    • Update workload manifests to define pod- and container-level securityContext

    values such as runAsNonRoot, explicit user/group IDs where required,

    allowPrivilegeEscalation: false, dropped capabilities, and

    seccompProfile.type: RuntimeDefault.

    • Restrict exception workloads to tightly controlled namespaces and service

    accounts, and limit who can deploy there through namespace-scoped RBAC.

    This follows AKS’s logical-isolation and least-privilege model.

    • Use Deployment Safeguards where centralized warn-or-deny enforcement is

    needed for pod security settings.

    • Revalidate workloads after rollout to confirm required applications still function

    without broad privilege, root execution, or unnecessary host access. This

    implementation step follows from Microsoft’s guidance to limit containers to only

    the actions and permissions they need.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing workload manifests to confirm pod- and container-level

      securityContext settings are explicitly defined and aligned to the AKS security

      baseline. In current AKS guidance, securityContext is the primary manifest-level

      mechanism for enforcing least-privilege runtime behavior, and AKS supports validating

      or enforcing these settings through Pod Security Admission and Deployment

      Safeguards.

      • Review pod specs for explicit securityContext settings at the pod and

      containe'
    severity: medium
- id: 4.6.3
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 2
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended team, application, or environment boundary. In AKS, namespaces are the built-in way to logically
    divide cluster resources and scope access, while the default namespace exists mainly so a cluster can be used immediately
    without first creating a new namespace. Microsoft’s current AKS namespace guidance also ties namespace design to per-namespace
    controls such as RBAC, quotas, and network policies.
  rationale: It is important to preserve least-privilege administration and make namespace-scoped governance actually usable.
    Namespaces form the logical isolation boundary in shared clusters, and AKS RBAC can scope permissions to a single namespace
    instead of the whole cluster. When workloads stay in default, it becomes harder to apply clean administrative separation,
    delegated access, resource quotas, and namespace-level network segmentation in the way AKS is designed to support.
  impact: Using the default namespace for application workloads weakens administrative separation and increases the blast
    radius of namespace-scoped mistakes or misuse. Microsoft also flags default-namespace usage as an AKS security recommendation
    because it can expose common resource types such as Pods, Secrets, Services, ServiceAccounts, and ConfigMaps to broader-than-intended
    access.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendationsreference-container
  - 2. https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-clusterisolation
  page_start: 132
  audit_raw: 'Verify that the default namespace is not being used as a landing zone for usermanaged applications, supporting
    resources, or namespace-scoped identities. In AKS,

    namespaces are the logical administrative boundary for workloads, and Microsoft flags

    use of the default namespace as a security recommendation because it can expose

    common namespace-scoped resource types to broader-than-intended access. A

    namespace should pass this control only when application resources have been moved

    into dedicated namespaces and default is not being used for normal workload

    administration.

    • List resources in the default namespace and identify any user-managed

    workloads or supporting objects.

    • Review whether application resources, service accounts, ConfigMaps, and

    Secrets are being created in default instead of dedicated namespaces.

    • Treat any non-exempt application use of default as a finding, even if the

    namespace also contains expected cluster-created objects.

    • Confirm user and service-account access is scoped to purpose-built namespaces

    rather than relying on default for routine operations.

    kubectl get

    pod,svc,configmap,secret,serviceaccount,deploy,statefulset,daemonset,job,cron

    job,ingress -n default'
  remediation: 'Create purpose-specific namespaces for teams, applications, and environments, then

    require all new resources to be deployed into those namespaces instead of default. In

    AKS, namespaces are the logical boundary for workload administration, so remediation

    should include migrating existing resources into managed namespaces, applying

    namespace-scoped RBAC and other controls, and reserving cluster-wide access for

    true platform administrators only.'
  checks:
  - type: manual_review
    info: 'Verify that the default namespace is not being used as a landing zone for usermanaged applications, supporting
      resources, or namespace-scoped identities. In AKS,

      namespaces are the logical administrative boundary for workloads, and Microsoft flags

      use of the default namespace as a security recommendation because it can expose

      common namespace-scoped resource types to broader-than-intended access. A

      namespace should pass this control only when application resources have been moved

      into dedicated '
    severity: medium
- id: 5.1.1
  title: Ensure container image vulnerability scanning with Defender for Containers or a third-party provider
  scoring: manual
  profile:
  - Level 1
  description: Ensure vulnerability scanning is enabled for container images that are stored in registries and intended for
    deployment to AKS, using Microsoft Defender for Containers in Defender for Cloud or an equivalent third-party scanner.
    This control applies both to registry images and, where enabled and supported, to running containers in AKS. For Defender-based
    coverage, registry image assessment requires Registry access to be enabled, and Microsoft documents support for scanning
    images in ACR and other supported registries; scans occur for newly pushed or imported images and are continuously re-run
    for recent or currently running images so findings remain current as new CVEs are published.
  rationale: It is important to reduce software supply chain risk before vulnerable images are deployed or continue running
    in AKS. Container images should be scanned for vulnerabilities and only validated images should be deployed. Defender
    for Containers adds technical depth by performing agentless vulnerability assessment across supported container images,
    including OS packages and supported language packages, and then surfacing CVE findings and remediation guidance through
    Defender for Cloud recommendations. This makes image scanning a preventive control for AKS rather than only a post-deployment
    detection mechanism.
  impact: Implementing this control may require additional registry integration, scan result review, and remediation work
    before images are promoted to AKS. Vulnerable images may need to be rebuilt, patched, replaced, or blocked from deployment,
    which can add operational overhead but improves the security of the container supply chain.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-containerimage-management
  - 2. https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-forcontainers-azure-overview
  page_start: 136
  audit_raw: 'Review whether Microsoft Defender for Containers is enabled for the subscription and

    whether registry image vulnerability assessment is enabled under that plan. For AKS,

    also verify the cluster Defender profile when cluster-side monitoring is in scope, and

    confirm Defender for Cloud is generating vulnerability findings for relevant images.

    • Confirm Microsoft.Security/pricings/Containers uses pricingTier:

    Standard.

    • Confirm the ContainerRegistriesVulnerabilityAssessments extension is

    enabled.

    • For AKS, verify securityProfile.defender.securityMonitoring.enabled

    is true when required.

    • Confirm the environment supports the intended scan scope, such as registry

    images and, where applicable, running containers.

    To verify the cluster side directly, use:

    az aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query

    "securityProfile.defender" -o json

    The expected result should include securityMonitoring.enabled set to true.

    To verify the subscription plan more broadly use:

    az security pricing show --name Containers -o json

    That should show the plan on Standard when Defender for Containers is enabled.'
  remediation: 'Enable Microsoft Defender for Containers for the subscription, enable the registry

    vulnerability assessment capability used for container image scanning, and then verify

    that Defender for Cloud is producing vulnerability findings for the registries and AKS

    workloads in scope. If the control is intended to cover only registry image scanning, the

    subscription plan and registry access settings are the key fixes; if it also includes AKS

    runtime protection, deploy the Defender sensor or AKS built-in integration and confirm

    the cluster Defender profile is enabled.

    1. In the Defender for Cloud Environment settings turn Containers from Free to

    Standard.

    2. Enable the registry image assessment capability by turning on the registryrelated extension, including ContainerRegistriesVulnerabilityAssessments
    and

    required Registry access for supported registries.a

    3. For AKS cluster-side coverage, deploy the Defender sensor by using the AKS

    built-in option or Helm, based on your deployment model.

    4. Recheck the cluster and confirm

    securityProfile.defender.securityMonitoring.enabled is true where

    AKS runtime monitoring is required.

    5. Review Defender for Cloud recommendations, then rebuild, patch, or replace

    vulnerable images and revalidate until findings reflect the intended state.

    Verification commands:

    az security pricing show --name Containers -o json

    az aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query

    "securityProfile.defender" -o json'
  checks:
  - type: sql
    command: show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query
    severity: medium
    info: 'Review whether Microsoft Defender for Containers is enabled for the subscription and

      whether registry image vulnerability assessment is enabled under that plan. For AKS,

      also verify the cluster Defender profile when cluster-side monitoring is in scope, and

      confirm Defender for Cloud is generating vulnerability findings for relevant images.

      • Confirm Microsoft.Security/pricings/Containers uses pric'
- id: 5.1.2
  title: Minimize and scope access to Azure Container Registry (ACR)
  scoring: manual
  profile:
  - Level 1
  description: Limit ACR access for AKS and related users to only the permissions required for their function. AKS-to-ACR
    integration grants the cluster’s kubelet managed identity the AcrPull role so nodes can pull images without broader registry
    rights for ABAC-enabled registries using the Container Registry Repository Reader role instead. Human users, CI/CD identities,
    and applications should be assigned only the minimum pull, push, or repository-scoped rights they need through Microsoft
    Entra RBAC or ABAC, and the ACR admin account should remain disabled unless there is a specific operational need for it.
  rationale: Restricting ACR access reduces the chance that a user or workload can push unapproved images, overwrite trusted
    tags, read images from repositories outside its scope, or rely on long-lived shared credentials. Managed identities over
    service principals in AKS because Azure manages the credentials and rotation, which removes secret-handling overhead and
    lowers credential exposure. ACR also supports repository-level scoping with Microsoft Entra ABAC, which helps enforce
    least privilege more precisely than broad registry-wide assignments.
  impact: This control replaces broad ACR access with role-scoped access, typically leaving AKS with pull-only rights through
    the kubelet managed identity and assigning push access separately where needed. It can require additional role management
    and may cause image pull failures if permissions are too restrictive, but it produces a cleaner leastprivilege model for
    AKS and ACR.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
  - 2. https://learn.microsoft.com/en-us/azure/container-registry/container-registryauthentication
