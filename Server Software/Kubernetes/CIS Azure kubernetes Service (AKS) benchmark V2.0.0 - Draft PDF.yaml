  remediation: 'Remove bind, escalate, and impersonation permissions from any custom Role or

    ClusterRole that does not require them for an approved administrative function.

    Where these permissions are required, keep them limited to the smallest practical

    scope and avoid assigning them to workload service accounts, since AKS recommends

    minimum required permissions and service accounts continue to rely on Kubernetes

    RBAC.

