- id: 5.1.3
  title: Minimize AKS cluster access to pull-only access for Azure Container Registry (ACR)
  scoring: manual
  profile:
  - Level 1
  description: Configure AKS with read-only access to ACR so the cluster can pull the images it needs to run workloads without
    being able to modify registry content. This is implemented by granting the kubelet managed identity only the required
    pull permission—typically AcrPull for non-ABAC registries, or Container Registry Repository Reader for ABACenabled registries—so
    cluster access is limited to image retrieval rather than push, delete, or registry administration actions.
  rationale: Restricting AKS to read-only registry access enforces least privilege and reduces the blast radius of a compromised
    node identity or misused cluster credential. Using managed identities instead of service principals allows Azure to manage
    credential issuance and rotation, which avoids stored secrets and reduces operational exposure. Limiting the kubelet identity
    to pull-only access also prevents the cluster from modifying repository content, overwriting tags, or using broader registry
    permissions than required for normal image retrieval.
  impact: AKS is limited to pulling images from ACR and cannot push, delete, or modify registry content. Separate identities
    and roles are required for image publishing or registry administration, and incorrect pull-role assignment can cause image
    pull failures.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
  - 2. https://learn.microsoft.com/en-us/azure/container-registry/container-registryauthentication
  page_start: 142
