- id: 3.2.3
  title: Ensure that the --client-ca-file argument is set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: This worker-node kubelet setting ensures that the --client-ca-file argument is configured with a trusted certificate
    authority file so the kubelet can validate client certificates presented to its HTTPS endpoint. This helps ensure that
    certificate-based access to the kubelet is restricted to clients signed by an approved CA.
  rationale: The kubelet HTTPS endpoint exposes node and workload information and supports operations that can affect running
    pods and the worker node itself. Configuring the kubelet --client-ca-file argument causes the kubelet to trust only client
    certificates that can be validated against the certificate authority bundle in that file. When a client presents an X.509
    certificate, the kubelet uses the CA bundle to verify that the certificate chains back to a trusted issuer before treating
    the request as authenticated. This helps prevent unauthorized clients from using certificate-based authentication to access
    kubelet functions. In practice, this strengthens node access control by ensuring that certificate-based requests to the
    kubelet are limited to identities issued by an approved CA rather than any arbitrary certificate source. Without an appropriate
    --client-ca-file value, the kubelet cannot properly validate client certificates for this authentication path, which weakens
    trust enforcement at the node boundary. In AKS, this remains a relevant worker-node hardening control and is reflected
    in Microsoft’s AKS CIS guidance for kubelet configuration.
  impact: If the kubelet --client-ca-file setting is not configured appropriately, the kubelet cannot properly validate client
    certificates presented to its HTTPS endpoint, which weakens certificate-based trust enforcement on the worker node. In
    AKS, this can increase the risk of unauthorized access to kubelet functions and node-level information by reducing assurance
    that connecting clients were issued certificates by a trusted certificate authority.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubeletauthentication-authorization/
