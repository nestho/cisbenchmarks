- id: 3.2.1
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: This setting applies to the worker node kubelet and ensures that --anonymous-auth is set to false, meaning
    the kubelet does not accept unauthenticated anonymous requests to its HTTPS endpoint. This helps reduce the risk of unauthorized
    access to node-level information and operations.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the Kubelet server. You should rely on authentication to authorize access
    and disallow anonymous requests. Requiring the AKS worker node kubelet --anonymous-auth setting to be false helps prevent
    unauthenticated access to the kubelet endpoint, reducing the risk of unauthorized disclosure of node information or misuse
    of kubelet functions.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 34
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    Run the following command on each node to find the appropriate kubeconfig file:

    ps -efww | grep ''[k]ubelet'' | grep -- ''--anonymous-auth''

    The command line output should show a path similar to --anonymous-auth=false is

    the parameter is set to false.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of

    authentication... "anonymous":{"enabled":false} by extracting the live

    configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of "kubectl get

    nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'If the --anonymous-auth parameter is not set to false and manual modification is

    required, review the following file, which contains the KUBELET_FLAGS values used to

    build the kubelet command-line parameters.

    /etc/default/kubelet

    Before editing anything, enter debug mode and run chroot to verify what your node is

    actually using:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    chroot /host

    systemctl cat kubelet

    If the service shows an EnvironmentFile=/etc/default/kubelet or references

    KUBELET_FLAGS, that is the file you would edit. If it does not, then the next place to

    check is the kubelet systemd unit or drop-in, such as:

    /etc/systemd/system/kubelet.service

    /etc/systemd/system/kubelet.service.d/*.conf

    After a changing the kubelet config file, restart the kubelet service and check status.

    The usual recheck sequence would be:

    systemctl daemon-reload

    systemctl restart kubelet

    systemctl status kubelet -l

    ps -efww | grep ''[k]ubelet'' | grep -- ''--anonymous-auth''

    Important: Microsoft does not recommend managing this control by manually editing

    node-local kubelet files and restarting kubelet. In AKS, anonymous-auth is not typically

    exposed through the supported kubelet customization options, and manual changes at

    the node level are not considered a supported or persistent method of configuration.'
  checks:
  - type: command
    command: ps -efww | grep '[k]ubelet' | grep -- '--anonymous-auth'
    expected: ''
    severity: medium
    info: 'Audit Method 1:

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep ''[k]ubelet'' | grep -- ''--anonymous-auth''

      The command line output should show a path similar to --anonymous-auth=fals'
- id: 3.2.2
  title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  scoring: scored
  profile:
  - Level 1
  description: This worker-node kubelet setting ensures the --authorization-mode argument is not set to AlwaysAllow, which
    would permit requests to the kubelet without proper authorization checks. Using a secure mode such as Webhook helps require
    authorization for access to the kubelet endpoint and reduces the risk of unauthorized node-level access.
  rationale: Setting the kubelet --authorization-mode argument to a value other than AlwaysAllow helps ensure that requests
    to the kubelet endpoint are subject to authorization checks before access is granted. This reduces the risk of unauthorized
    access to node-level information and kubelet operations and supports a stronger security posture for AKS worker nodes.
    Using Webhook is recommended because it causes the kubelet to delegate authorization decisions to the Kubernetes API server,
    where access can be evaluated through centralized Kubernetes authorization controls. This provides a stronger security
    model than AlwaysAllow, because requests are not automatically approved and only appropriately authorized users and service
    accounts are permitted to access kubelet functions.
  impact: Unauthorized requests will be denied.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 37
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

