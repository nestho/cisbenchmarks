  - type: sql
    command: show each binding name and the associated user, group, or
    severity: medium
    info: 'This audit statement identifies the principals that are granted the Kubernetes clusteradmin role by reviewing ClusterRoleBinding
      assignments in the AKS cluster. It filters

      the binding output to show each binding name and the associated user, group, or

      service account, allowing the reviewer to determine which identities have unrestricted

      cluster-wide administrative access.

      kubectl get clusterrolebi'
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in AKS are granted to only identities with a defined purpose.
    The review should include Azure RBAC for Kubernetes Authorization assignments, Kubernetes RBAC roles and bindings, and
    service account permissions, with particular attention to permissions that allow get, list, or watch access to secrets,
    because those permissions expose sensitive namespace-scoped data. In AKS, access should be limited to the minimum scope
    and privilege necessary for the workload or administrator function being performed. The Kubernetes API stores secrets,
    which may be service account tokens for the Kubernetes API or credentials used by workloads in the cluster. Access to
    these secrets should be restricted to the smallest possible group of users to reduce the risk of privilege escalation.
  rationale: This requirement is necessary because unnecessary access to Secrets in AKS increases the risk of credential exposure
    and privilege escalation. Microsoft’s AKS guidance notes that access to secret contents can expose service account credentials,
    and that combining secret access with the ability to run pods as service accounts can enable a principal to gain that
    service account’s API access level. Kubernetes also treats get, list, and watch access to Secret objects as sensitive
    because those permissions can reveal secret contents directly or indirectly. Minimizing secret access in AKS therefore
    helps reduce the likelihood that a user, workload, or service account can expose sensitive data or expand its effective
    privileges beyond what is required.
  impact: If access to Secrets is granted too broadly in AKS, a compromised user, group, service principal, managed identity,
    or service account can retrieve sensitive application data, credentials, certificates, or tokens from one or more namespaces.
    That access can then be used to impersonate workloads, obtain additional API access, or expose confidential configuration
    information, increasing the risk of lateral movement and a broader cluster security incident.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  page_start: 62
  audit_raw: 'Review the users who have get, list or watch access to secrets objects in the

    Kubernetes API.'
  remediation: Where possible, remove get, list and watch access to secret objects in the cluster.
  checks:
  - type: manual_review
    info: 'Review the users who have get, list or watch access to secrets objects in the

      Kubernetes API.'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole definitions in AKS do not use wildcard entries such as * for verbs,
    resources, or apiGroups unless a documented administrative need exists. The audit should include any RoleBinding or ClusterRoleBinding
    that assigns those roles to users, groups, or service accounts, because in Kubernetes RBAC a role defines additive permissions
    and bindings determine which principals receive them. In AKS, this is particularly relevant for service accounts because
    their authorization continues to rely on Kubernetes RBAC.
  rationale: This recommendation is necessary because wildcard permissions make RBAC scope harder to predict and harder to
    constrain. Kubernetes guidance explicitly recommends avoiding wildcard permissions where possible, especially across all
    resources, because Kubernetes is extensible and wildcard access applies not only to resource types that exist today but
    also to resource types introduced later. Since RBAC permissions are purely additive, a wildcard can silently expand what
    a bound principal is allowed to do without any corresponding narrowing control in the role itself. In AKS, that risk remains
    material even when Azure RBAC for Kubernetes Authorization is enabled, because AKS states that identities outside Microsoft
    Entra ID, including Kubernetes service accounts, fall back to normal Kubernetes RBAC authorization. As a result, wildcard
    rules in Role and ClusterRole objects can still overprivilege workloads and controllers that run under service accounts,
    even in clusters where human user access is otherwise managed through Azure RBAC.
  impact: If wildcard permissions are used broadly in AKS, a user or service account can receive access beyond the intended
    set of API resources or actions, including newly introduced resources such as CRDs or additional subresources covered
    by the wildcard rule. When those roles are bound cluster-wide or attached to workload service accounts, a compromised
    pod, controller, or user session can perform actions outside its expected boundary, increasing the risk of unauthorized
    changes, privilege escalation, and wider cluster impact.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  page_start: 64
  audit_raw: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

    use in verbs, resources, or apiGroups, and identify any RoleBinding or

    ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

    This is especially important in AKS because service accounts continue to rely on

    Kubernetes RBAC, and Kubernetes guidance warns that wildcard rules can

    automatically grant access to current and future resource types.

    Retrieve the roles defined across each namespaces in the cluster and review for

    wildcards

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Replace wildcard entries in Role and ClusterRole objects with only the specific verbs,

    resources, and apiGroups required for the workload or administrator function, and

    prefer namespace-scoped Role and RoleBinding objects instead of cluster-wide

    permissions wherever possible. In AKS, this is particularly important for service

    accounts and controllers because overbroad Kubernetes RBAC rules can still

    overprivilege workloads even when user access is managed with Microsoft Entra ID and

    Azure RBAC.'
  checks:
  - type: manual_review
    info: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

      use in verbs, resources, or apiGroups, and identify any RoleBinding or

      ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

      This is especially important in AKS because service accounts continue to rely on

      Kubernetes RBAC, and Kubernetes guidance warns that wildcard rules can

      automatically grant access to current and future resource types.

      Retrieve the roles defined across each namespa'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create pods in a namespace can provide a number of opportunities for privilege escalation, such
    as assigning privileged service accounts to these pods or mounting hostPaths with access to sensitive data (unless Pod
    Security Policies are implemented to restrict this access) This verifies that permission to create or run pods in AKS
    is granted only to identities with a documented operational need. The review should include RBAC assignments to users,
    groups, and service accounts that allow pod creation or the ability to run pods under service accounts, because AKS treats
    pod execution as a security-relevant action rather than a routine read/write permission. As such, access to create new
    pods should be restricted to the smallest possible group of users.
  rationale: This requirement is necessary because pod creation in AKS can translate into API access through service accounts.
    Microsoft’s AKS identity guidance states that service account credentials are stored as Kubernetes secrets and used by
    authorized pods to communicate with the API server, and AKS RBAC guidance notes that the ability to run pods as any service
    account in a namespace can be used to gain that service account’s API access level. The ability to create pods in a cluster
    opens up possibilities for privilege escalation and should be restricted, where possible.
  impact: If pod creation is granted too broadly in AKS, a compromised or misused identity can deploy workloads under available
    service accounts, inherit the permissions available to those pods, and reach resources or API actions beyond its intended
    role. This increases the risk of privilege escalation, sensitive data exposure, and wider namespace or cluster impact
    from a single overprivileged account or workload.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  page_start: 67
  audit_raw: 'Review AKS authorization to determine whether access is controlled through Azure

    RBAC for Kubernetes Authorization, Kubernetes RBAC, or both, then identify the users,

    groups, and service accounts that can create pods. Validate whether each assignment

    is required for each role, with particular attention to service accounts and namespace

    write access, because Microsoft notes that the ability to run pods as a service account

    can be used to gain that service account’s API access level. Any excessive podcreation rights should be flagged for remediation
    and reduced to a lower-privilege role

    or narrower scope.'
  remediation: 'The following steps help reduce pod-creation access to the minimum required in AKS

    • Identify all Azure RBAC assignments and Kubernetes RBAC bindings that allow

    pod creation in AKS, including namespace-scoped and cluster-scoped access.

    • Remove pod-creation rights from any user, group, or service account that does

    not have a documented operational need.

    • Replace broad permissions with the lowest-privilege role and narrowest scope

    necessary, preferably at the namespace level rather than cluster-wide.

    • Ensure workloads use dedicated service accounts with only the permissions

    required for that application or controller.

    • Revalidate access after changes to confirm required workloads still run and that

    unnecessary pod-creation rights have been removed.'
  checks:
  - type: manual_review
    info: 'Review AKS authorization to determine whether access is controlled through Azure

      RBAC for Kubernetes Authorization, Kubernetes RBAC, or both, then identify the users,

      groups, and service accounts that can create pods. Validate whether each assignment

      is required for each role, with particular attention to service accounts and namespace

      write access, because Microsoft notes that the ability to run pods as a service account

      can be used to gain that service account’s API access level. Any excessive'
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: Ensure that default service accounts are not actively used by verifying that application and automation pods
    in AKS do not rely on the namespace default service account when a dedicated service account should be used instead. Confirm
    that workloads explicitly specify the intended serviceAccountName, the default service account is not bound to unnecessary
    Kubernetes RBAC permissions, and it is not being used as the identity boundary for workloads that need distinct API permissions
    or Microsoft Entra Workload ID behavior.
  rationale: 'This is recommended because AKS service accounts are operational identities, not just deployment defaults. Microsoft
    states that service account credentials are stored as Kubernetes secrets and are used by authorized pods to communicate
    with the Kubernetes API server. AKS also documents that when Azure RBAC integration is used, identities outside Microsoft
    Entra ID, including Kubernetes service accounts, still fall back to normal Kubernetes RBAC. Using the default service
    account therefore makes it harder to apply least privilege cleanly, because multiple workloads can end up sharing the
    same Kubernetes identity and API authorization path within a namespace. AKS documentation also shows that service-account
    token handling is security-relevant: Microsoft publishes an AKS Azure Policy built-in that sets automountServiceAccountToken
    to false because avoiding default token automounting increases security, and AKS Workload ID uses explicit pod labels
    plus service-account configuration to project and exchange service-account tokens for Microsoft Entra access tokens. Together,
    that guidance supports using dedicated, intentional service accounts rather than actively relying on the default account
    for ordinary workloads.'
  impact: If the default service account is actively used in AKS, multiple workloads in the same namespace can inherit the
    same Kubernetes identity and any RBAC permissions associated with it, which increases the blast radius of a pod compromise
    or workload misconfiguration. It also weakens separation of duties, makes it harder to assign workload-specific permissions,
    and reduces audit clarity because API access is attributed to a shared namespace-level service account rather than a dedicated
    workload identity. In clusters using Microsoft Entra Workload ID, loose service-account use can also complicate token
    projection and workload-to-identity mapping that AKS expects to be explicit.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  page_start: 70
  audit_raw: 'Review pods in all AKS namespaces to identify workloads that do not explicitly set

    serviceAccountName and therefore use the namespace default service account. Then

    review RoleBinding and ClusterRoleBinding assignments for each default service

    account to confirm it is not granted unnecessary permissions, since AKS states that

    service account credentials are used by authorized pods to communicate with the API

    server and that service accounts continue to rely on Kubernetes RBAC.

    In addition, verify whether service account tokens are being mounted unnecessarily by

    checking the automountServiceAccountToken setting at the pod and service account

    level. Microsoft’s AKS policy guidance states that setting

    automountServiceAccountToken to false increases security by avoiding default

    token auto-mounting, so any workload using the default service account or automounting a token without a documented need
    should be flagged for remediation.

    Review the automountServiceAccountToken setting on both the Pod and its

    associated ServiceAccount, and treat the Pod setting as authoritative where both are

    defined.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml'
  remediation: 'Apply the following steps to replace default service-account usage with dedicated, leastprivileged workload
    identities in AKS:

    • Update workloads to explicitly set a dedicated serviceAccountName instead of

    inheriting the namespace default service account.

    • Remove unnecessary RoleBinding and ClusterRoleBinding assignments from the

    default service account, and keep any remaining access minimal and

    namespace-scoped.

    • Set automountServiceAccountToken to false where Kubernetes API access is

    not required to prevent default token auto-mounting.

    • Review both the ServiceAccount and Pod settings for

    automountServiceAccountToken, and treat the Pod value as authoritative

    when both are defined.

    • For workloads that need Azure resource access, use Microsoft Entra Workload

    ID with explicit workload configuration instead of the namespace default service

    account.'
  checks:
  - type: manual_review
    info: 'Review pods in all AKS namespaces to identify workloads that do not explicitly set

      serviceAccountName and therefore use the namespace default service account. Then

      review RoleBinding and ClusterRoleBinding assignments for each default service

      account to confirm it is not granted unnecessary permissions, since AKS states that

      service account credentials are used by authorized pods to communicate with the API

      server and that service accounts continue to rely on Kubernetes RBAC.

      In addition, verify'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Review that service account tokens in AKS are mounted only for pods that require Kubernetes API access or an
    explicitly configured workload identity flow. Confirm that pods and service accounts are not broadly relying on default
    token mounting, and that token projection is limited to workloads with a defined operational need. AKS reflects this through
    a built-in policy that sets automountServiceAccountToken to false, and through workload identity guidance that requires
    explicit pod labeling for token projection.
  rationale: 'Limiting service account token mounts is important because a mounted token is an authentication credential.
    AKS states that service account credentials are stored as Kubernetes secrets and are used by authorized pods to communicate
    with the Kubernetes API server, and AKS policy guidance states that setting automountServiceAccountToken to false increases
    security by avoiding default token auto-mounting. AKS workload identity guidance reinforces the same principle by making
    projected service-account tokens explicit rather than automatic. Microsoft documents that pods must be labeled azure.workload.identity/use:
    "true" for AKS workload identity behavior, which supports treating token mounting as an intentional workload requirement
    rather than a default behavior.'
  impact: When service account tokens are mounted more broadly than necessary in AKS, more pods than required receive credentials
    that can authenticate to the Kubernetes API. That increases the number of workloads from which API access could be exercised
    if a pod is compromised or misconfigured, and it weakens workload separation by exposing credentials to pods that do not
    need them.
