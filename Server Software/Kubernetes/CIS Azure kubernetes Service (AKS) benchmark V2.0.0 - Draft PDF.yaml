- id: 5.1.4
  title: Restrict AKS workloads to approved container registries only
  scoring: manual
  profile:
  - Level 2
  description: Configure AKS so workloads pull images only from registries that have been explicitly approved by the organization,
    such as selected ACR instances or other trusted registries. In AKS, this is typically enforced with Azure Policy by auditing
    or denying deployments that reference images outside the approved registry list, while AKS-toACR integration provides
    the managed identity and pull-role pattern needed for authorized image retrieval from those registries.
  rationale: Limiting AKS to approved registries reduces the chance that pods will run images from unknown, unvetted, or malicious
    sources. In AKS image-management only validates images that should be deployed, and the AKS built-in policy for allowed
    images is specifically intended to reduce exposure to unknown vulnerabilities, security issues, and malicious images from
    untrusted registries.
  impact: Enforcement may block deployments that reference nonapproved registries until those images are moved to, or mirrored
    into, an approved source. It also requires policy maintenance and valid pull permissions for each approved registry, but
    it strengthens image provenance and deployment consistency in AKS.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/policy-reference
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
  page_start: 145
  audit_raw: 'Review AKS image source controls to confirm workloads are limited to approved

    container registries. The audit should verify that an Azure Policy definition or initiative is

    assigned to the cluster to audit or deny unapproved image sources, that the approved

    registry list is explicitly defined, and that AKS has valid pull access only to those

    approved registries. In addition, deploy only validated images which supports restricting

    image sources to trusted registries.

