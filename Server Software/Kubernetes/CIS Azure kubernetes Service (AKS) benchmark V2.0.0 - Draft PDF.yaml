- id: 4.2.2
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of pods that request spec.hostPID=true so that only tightly controlled, explicitly approved
    platform workloads can share the host process ID namespace in AKS. In practice, this means users, groups, and service
    accounts with deployment rights should not broadly be able to create or update workloads that use host PID sharing, because
    Microsoft’s AKS identity guidance is to grant identities only the Kubernetes resources they need, and AKS provides Azure
    Policy and Deployment Safeguards as supported control points for admission governance. Do not generally permit containers
    to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
    also has access to ptrace capabilities this can be used to escalate privileges outside of the container. There should
    be at least one admission control policy defined which does not permit containers to share the host PID namespace. If
    you need to run containers which require hostPID, this should be defined in a separate policy and you should carefully
    check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'If admission of host PID sharing is not minimized, an identity with pod or workload deployment rights can introduce
    workloads that weaken node-level workload isolation and expand the blast radius of a container compromise. In AKS, Microsoft
    emphasizes securing workload access especially in logically isolated or multi-tenant clusters, and the built-in AKS policy
    specifically treats host namespace sharing as a condition that should be blocked. Operationally, broad use of hostPID
    can make containment, troubleshooting, and assurance of workload boundaries more difficult because the pod is no longer
    operating within the default process-isolation boundary. Pods defined with spec.hostPID: true will not be permitted unless
    they are run under a specific policy.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-forkubernetes
  - 2. https://kubernetes.io/docs/concepts/security/pod-security-admission/
