- id: 3.2.5
  title: Ensure that the --make-iptables-util-chains argument is set to true
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The --make-iptables-util-chains setting ensures the kubelet creates the iptables utility hint chain used by
    other components to identify the node’s iptables configuration. This is important because it helps maintain predictable
    networking behavior on the worker node and supports components that rely on that hint to determine how iptables is configured
    on the host. In practice, AKS nodes often rely on the kubelet default value of true, so the setting may not always appear
    explicitly in a node-local file even though the intended behavior is still in effect. In AKS, eventRecordQPS is the worker-node
    kubelet setting that controls the maximum rate at which the kubelet can create Kubernetes events. These events provide
    operational visibility into node and pod activity, and the setting helps determine whether the kubelet records that activity
    at a rate that matches the workload running on the node. An appropriate value is one that supports expected event volume
    without excessive throttling; the current kubelet configuration API defines a default of 50, and a value of 0 means no
    rate limit is enforced. AKS continues to treat this as a worker-node setting that should be configured to support appropriate
    event capture.
  rationale: 'In AKS, setting --make-iptables-util-chains to true ensures the worker-node kubelet creates the KUBE-IPTABLES-HINT
    chain on the host. Kubernetes documents this setting with a default of true, and the purpose of the hint chain is to let
    other components detect the node’s iptables configuration and behave consistently. In AKS, that matters because worker-node
    networking depends on predictable host networking behavior, and this setting helps preserve the kubelet’s expected iptables
    utility-chain behavior on the node. If this value were set to false, the kubelet would stop creating that hint chain.
    In AKS, that could make node-level networking behavior less predictable for components or tooling that rely on the presence
    of KUBE-IPTABLES-HINT to understand the host’s iptables environment. AKS guidance still treats this as a current worker-node
    setting, so keeping it at true aligns with both the kubelet’s intended default behavior and AKS’s expected node hardening
    posture. In AKS, eventRecordQPS matters because it controls how quickly the worker-node kubelet can create Kubernetes
    events, which are a key source of operational visibility for node and pod activity. If the value is set too low, the kubelet
    can throttle event creation during bursts of activity, which can reduce visibility into restarts, health changes, image
    pull failures, and other important state transitions. The current kubelet configuration API defines a default of 50, and
    0 means no rate limit is enforced. eventBurst works with this setting to allow short bursts above the steady-state rate,
    with a default of 100. As technical background, --event-qps is the older command-line alternative to eventRecordQPS and
    may still be used in the latest AKS configuration. Kubernetes still documents -event-qps, but marks it as deprecated in
    favor of the kubelet configuration file. It is also important not to treat the two forms identically: eventRecordQPS:
    0 means unlimited event creation, while --event-qps=0 falls back to a default QPS of 5. For current AKS-focused documentation,
    eventRecordQPS should be treated as the primary setting, with --event-qps referenced only as a legacy equivalent.'
  impact: Kubelet would manage the iptables on the system and keep it in sync. If you are using any other iptables management
    solution, then there might be some conflicts. Setting this parameter to 0 could result in a denial of service condition
    due to excessive events being created. The cluster's event processing and storage systems should be scaled to handle expected
    event loads.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/tasks/administer-cluster/reconfigure-kubelet/
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://github.com/kubernetes/kubernetes/blob/master/pkg/kubelet/apis/kubeletco
