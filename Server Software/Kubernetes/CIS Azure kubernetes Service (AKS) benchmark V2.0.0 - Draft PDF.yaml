- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: scored
  profile:
  - Level 1
  description: In AKS, node pools should use private IP addressing only and should not assign instance-level public IPs to
    individual nodes unless a specific workload requires that design. Keeping nodes private reduces direct internet reachability
    of the worker node plane and helps ensure node access occurs through approved internal network paths, load-balanced services,
    or controlled management methods rather than through pernode public exposure.
  rationale: In AKS, assigning an instance-level public IP to each node pool VM makes the worker node plane directly internet-routable,
    which increases exposure beyond the standard AKS networking model. AKS nodes do not require their own public IP addresses
    for normal cluster communication, so enabling enableNodePublicIP is a deliberate exception rather than a default requirement.
    Keeping nodes on private IPs preserves the intended separation between node infrastructure, workload ingress, and cluster
    egress, where external access is normally handled through Kubernetes Services, load balancers, ingress, or other controlled
    network paths instead of direct per-node addressing.
  impact: Disabling node public IPs removes direct internet reachability to individual AKS nodes and shifts node access and
    troubleshooting to approved internal paths such as kubectl debug or the node’s private IP from within the cluster VNet
    or a connected network.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/use-node-public-ips
  - 2. https://learn.microsoft.com/en-us/azure/aks/node-access
  page_start: 164
  audit_raw: "Review each AKS node pool to determine whether node public IPs are enabled. In AKS,\nthis control is a node-pool\
    \ setting, not a control-plane setting, and node public IP as an\noptional feature for special scenarios rather than a\
    \ normal requirement the default value\nfor enableNodePublicIP is false.\nUse this command to audit all node pools in\
    \ the cluster:\nexport CLUSTER_NAME=<your cluster name>\nexport RESOURCE_GROUP=<your resource group name>\naz aks show\
    \ \\\n  --name \"${CLUSTER_NAME}\" \\\n  --resource-group \"${RESOURCE_GROUP}\" \\\n  --query\n\"agentPoolProfiles[].{nodePool:name,mode:mode,enableNodePublicIP:enableNodePu\n\
    blicIP}\" \\\n  --output json\nThe result should show enableNodePublicIP: false for every node pool unless there\nis a\
    \ documented exception for a specific workload. In AKS, nodes do not require their\nown public IP addresses for normal\
    \ communication, and the Azure AKS resource model\ndocuments enableNodePublicIP with a default of false.\n• Verify every\
    \ system and user node pool returned by the command, because a\nsingle node pool with enableNodePublicIP: true means that\
    \ pool’s nodes are\nconfigured with instance-level public IPs.\n• Treat enableNodePublicIP: false as the expected value\
    \ for compliant node\npools.\n• Treat any node pool with enableNodePublicIP: true as an exception requiring\ndocumented\
    \ justification, since Microsoft describes node public IPs as an\noptional feature for specific scenarios.\n• Do not use\
    \ apiServerAccessProfile.enablePrivateCluster to audit this\ncontrol, because that checks private control plane access,\
    \ not whether worker\nnodes have public IPs. This control is audited from the node pool configuration."
  remediation: 'Where AKS node pools are configured with node public IPs, the preferred remediation

    is to return them to the standard AKS networking model unless there is a clear workload

    requirement for direct per-node public reachability. In AKS, node public IPs are an

    optional feature rather than the normal operating model, so remediation should focus on

    removing unnecessary node-level internet exposure and shifting any needed inbound or

    outbound connectivity to supported service and egress patterns.

    1. Identify each node pool where enableNodePublicIP is enabled and confirm

    whether the setting is actually required for the workload, since AKS documents

    node public IPs as a special-case feature.

    2. For node pools that do not require direct node-level public reachability, update

    the node pool configuration to disable node public IPs by removing the --

    enable-node-public-ip setting from the intended state and applying the

    supported AKS node-pool update path.

    3. If the workload needs inbound exposure, replace direct node addressing with

    supported Kubernetes or Azure exposure methods such as Services, ingress, or

    load balancer front ends instead of keeping public IPs on individual nodes.

    4. If the workload needs stable outbound source addresses, use an AKS-supported

    egress design such as configured outbound IPs on the Standard Load Balancer

    rather than assigning public IPs to each node.

    5. After remediation, rerun the node-pool audit and confirm each in-scope pool

    reports enableNodePublicIP: false.'
