controls:
- id: 2.1.1
  title: Enable Diagnostic Platform Logs and Metrics
  scoring: manual
  profile:
  - Level 1
  description: With Azure Kubernetes Service (AKS), control plane components such as the Kubernetes API server and Kubernetes
    controller manager are provided as part of a managed service. You create and manage the worker nodes that run the kubelet
    and container runtime, and you deploy your applications through the managed Kubernetes API. To troubleshoot cluster operations
    and application behavior, you may need to review logs generated by these control plane components and related cluster
    services. To collect and analyze data from multiple sources, Azure Monitor provides a centralized monitoring platform
    for logs and metrics. AKS control plane logs are enabled through diagnostic settings and can be sent to a Log Analytics
    workspace, where they can be queried and analyzed. The workspace serves as a central repository for monitoring data and
    can be used alongside other Azure services such as Application Insights and Microsoft Defender for Cloud
  rationale: Exporting logs and metrics to a dedicated, persistent datastore ensures that audit data remains available in
    the event of a cluster security incident and provides a centralized location for analyzing log and metric data aggregated
    from multiple sources.
  impact: Enabling AKS diagnostic settings significantly expands operational visibility beyond what Azure provides by default.
    By default, Azure automatically collects the subscription-level Activity Log and AKS platform metrics, which provide insight
    into Azure resource operations and basic performance signals, but AKS resource logs are not collected unless diagnostic
    settings are explicitly configured. When diagnostic settings are enabled for recommended categories such as Kubernetes
    API Server, Kubernetes Controller Manager, Kubernetes Scheduler, Kubernetes Cluster Autoscaler, Kubernetes Cloud Controller
    Manager, Guard, and Kubernetes Audit Admin Logs, the organization gains the detailed control plane and administrative
    logging needed to strengthen security monitoring, operational troubleshooting, root cause analysis, and audit and compliance
    reporting. This results in a more complete record of cluster activity while keeping log volume and cost more manageable
    than enabling full Kubernetes Audit Logs by default.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://docs.microsoft.com/en-us/azure/aks/view-master-logs
  page_start: 17
  audit_raw: 'AKS audit logs are not fully enabled by default when you create a cluster. What is on by

    default is the Azure Activity Log for Azure resource operations and AKS platform

    metrics. But the Kubernetes control plane/resource logs such as kube-audit, kube-auditadmin, kube-apiserver, kube-controller-manager,
    and similar logs are not collected or

    stored until you create a diagnostic setting and route them to a destination such as Log

    Analytics.

    • If you only care about Azure-side changes like cluster creation, scaling, or

    configuration updates, you already have some visibility from the Activity Log by

    default.

    • If you need actual Kubernetes API audit events such as get, list, create, update,

    delete, patch, or post inside the cluster, you must enable diagnostic settings for

    AKS.'
  remediation: 'To enable log collection for the Kubernetes master components in your AKS cluster,

    open the Azure portal in a web browser and complete the following steps:

    1. Create or identify a Log Analytics workspace in the same subscription as the

    AKS cluster.

    2. In the Azure portal, open your AKS cluster.

    3. In the left menu, go to Monitoring, then select Diagnostic settings.

    4. Select + Add diagnostic setting.

    5. Enter a name such as Collect Control Plane Logs.

    6. Under destination, choose Send to Log Analytics workspace and select the

    workspace you want to use.

    7. Select the AKS log categories you want to collect. Common control plane and

    resource log categories include:

    o Kubernetes API Server

    o Kubernetes Audit Admin Logs

    o Kubernetes Controller Manager

    o Kubernetes Scheduler

    o Kubernetes Cluster Autoscaler

    o Kubernetes Cloud Controller Manager

    o guard

    o optional: Kubernetes Audit if you need full read and write audit events

    o optional: CSI controller categories if they apply to your storage

    configuration

    8. Save the diagnostic setting.

    9. Wait a few minutes for logs to begin flowing into Log Analytics.

    10. Verify that data is being collected by checking the workspace tables such as:

    o AKSControlPlane, AKSAudit, AKSAuditAdmin

    Recommended minimum set for most production clusters:

    • Kubernetes API Server

    • Kubernetes Controller Manager

    • Kubernetes Scheduler

    • Kubernetes Cluster Autoscale

    • Kubernetes Cloud Controller Manager

    • guard

    • Kubernetes Audit Admin Logs

    NOTE: Use Kubernetes Audit only if you need a full Kubernetes API audit trail, since it

    can generate a much higher volume of log data.'
  checks:
  - type: manual_review
    info: 'AKS audit logs are not fully enabled by default when you create a cluster. What is on by

      default is the Azure Activity Log for Azure resource operations and AKS platform

      metrics. But the Kubernetes control plane/resource logs such as kube-audit, kube-auditadmin, kube-apiserver, kube-controller-manager,
      and similar logs are not collected or

      stored until you create a diagnostic setting and route them to a destination such as Log

      Analytics.

      • If you only care about Azure-side changes like cluster c'
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If the kubelet is configured to use a kubeconfig file, ensure that the kubelet kubeconfig file permissions
    are set to 644 or more restrictive.
  rationale: The kubelet kubeconfig file contains the connection and authentication settings the kubelet uses to communicate
    with the Kubernetes API server. File permissions should be restricted to prevent unauthorized modification and to help
    maintain the integrity of node-to-control-plane communication. The file should be writable only by authorized administrators
    or system processes. The /var/lib/kubelet/kubeconfig is the kubelet client configuration file used by the worker node
    to authenticate and communicate with the Kubernetes API server.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 21
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the kubeconfig\n\
    file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %a /var/lib/kubelet/kubeconfig (or stat -c\
    \ %a\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig file's\
    \ permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more restrictive.\nMethod\
    \ 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's file\
    \ system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system into\
    \ the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n    \
    \  path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"\
    ]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n      privileged: true\nSave\
    \ this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is\
    \ running, you can exec into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are\
    \ in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check the permission\
    \ level of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nVerify that if a file is specified and it exists, the permissions\
    \ are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %a /var/lib/kubelet/kubeconfig (or stat -c %a &&
      ls -l /host/var/lib/kubelet/kubeconfig
    expected: Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/var/li'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, ensure that the ownership of the kubelet kubeconfig file is set to root:root.
  rationale: The kubelet kubeconfig file contains the connection and authentication settings used by the kubelet to communicate
    with the Kubernetes API server. Setting file ownership to root:root helps preserve file integrity and restrict unauthorized
    changes. The /var/lib/kubelet/kubeconfig is the kubelet client configuration file used by the worker node to authenticate
    and communicate with the Kubernetes API server.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  - 2. https://docs.microsoft.com/security/benchmark/azure/security-controls-v2posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  page_start: 24
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
