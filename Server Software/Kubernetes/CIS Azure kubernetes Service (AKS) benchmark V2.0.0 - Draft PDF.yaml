- id: 5.3.1
  title: Encrypt Kubernetes Secrets at rest with AKS KMS protection
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Secret data stored by AKS in etcd must be protected with encryption at rest, and, when mapped to
    Key Management Service, that protection should be implemented through the AKS KMS provider integrated with Azure Key Vault.
    In AKS, Azure platform encryption remains the baseline storage-layer protection, while KMS adds envelope encryption of
    Kubernetes secrets before they are committed to etcd. In addition, AKS KMS supports either platform-managed keys for simpler
    operation or customermanaged keys in Azure Key Vault when you need direct control over the encryption key lifecycle.
  rationale: AKS stores Kubernetes Secret objects in etcd, so encrypting them adds protection beyond the baseline Azure storage-layer
    encryption. When AKS KMS is used, secrets are encrypted before being written to etcd, with Azure Key Vault protecting
    the encryption key material through envelope encryption.
  impact: Using AKS KMS strengthens secret-at-rest protection, but it also adds dependency on the configured Key Vault, key,
    and supported AKS configuration. Microsoft notes that deleting the key or Key Vault can make cluster secrets unrecoverable,
    and the newer KMS experience has specific platform requirements such as managed identity support and Kubernetes version
    prerequisites.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/kms-data-encryption-concepts
  - 2. https://learn.microsoft.com/en-us/azure/aks/kms-data-encryption
  page_start: 153
  audit_raw: "Review each AKS cluster in scope to determine whether Key Management Service\n(KMS) encryption for Kubernetes\
    \ Secrets is enabled and correctly configured. Note the\nAzure platform encryption is always enabled for data at rest,\
    \ but AKS KMS adds a\nseparate encryption layer that encrypts Kubernetes Secret data before it is written to\netcd by\
    \ using Azure Key Vault–backed keys.\nAs part of the audit, verify that the cluster security profile shows AKS KMS enabled,\n\
    confirm the configured key identifier and Key Vault settings are present and valid, and\nensure the referenced Key Vault\
    \ and key have not been deleted or expired. Where\nprivate Key Vault mode is used, also verify the cluster identity still\
    \ has the required\naccess because Microsoft notes AKS cannot automatically validate those permissions\nfor private vault\
    \ scenarios.\nUse the following command to inspect the KMS configuration for a specific cluster:\naz aks show \\\n  --name\
    \ $CLUSTER_NAME \\\n  --resource-group $RESOURCE_GROUP \\\n  --query\n\"{KmsEnabled:securityProfile.azureKeyVaultKms.enabled,KeyId:securityProfile.a\n\
    zureKeyVaultKms.keyId,KeyVaultNetworkAccess:securityProfile.azureKeyVaultKms.\nkeyVaultNetworkAccess,KeyVaultResourceId:securityProfile.azureKeyVaultKms.key\n\
    VaultResourceId}\" \\\n  -o json\nThe cluster should show KmsEnabled as true, and the output should include the\nexpected\
    \ Azure Key Vault key reference in KeyId. If the cluster uses a private Key\nVault, the audit should also confirm the\
    \ expected private vault resource ID and network\naccess mode are populated."
  remediation: 'For AKS clusters that do not use KMS for Kubernetes Secret encryption, enable AKS

    KMS so Secret data is encrypted before it is written to etcd. AKS distinguishes this from

    the baseline Azure platform encryption that is always on at the storage layer, and

    documents AKS KMS as the added Azure Key Vault–backed encryption layer for

    Kubernetes secrets. For newer supported clusters, use the current KMS data-encryption

    model; where customer-managed keys are required, configure the Azure Key Vault key,

    assign the required managed identity and permissions, enable KMS on the cluster, and

    then verify the cluster security profile reflects the expected KMS settings.

    1. Identify AKS clusters where KMS is not enabled for Kubernetes Secret

    encryption, using cluster configuration review or Azure Policy.

    2. Decide whether to use platform-managed keys or customer-managed keys in

    Azure Key Vault based on the organization’s key ownership and compliance

    requirements.

    3. For customer-managed key deployments, create or select the Azure Key Vault

    key, assign a user-managed identity, and grant the identity the required key

    permissions before enabling KMS.

    4. If a private Key Vault is used, also configure the required private-access settings

    and confirm the cluster identity can reach and use the vault, because AKS does

    not automatically validate those permissions in that scenario.

    5. After remediation, validate that the AKS securityProfile shows KMS enabled

    and the expected Key Vault key configuration, and confirm the referenced vault

    and key remain available to avoid loss of access to encrypted secrets.'
