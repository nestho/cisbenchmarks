- id: 4.2.5
  title: Minimize the admission of containers with allowPrivilegeEscalation
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of containers with allowPrivilegeEscalation=true so that users, groups, and service
    accounts with deployment rights cannot broadly create pods, init containers, or other workload objects that permit a process
    to gain more privileges than its parent. In AKS, this remains applicable because Microsoft documents allowPrivilegeEscalation
    as a pod security context setting that should be designed to stay false, Pod Security Admission is enabled by default,
    and Azure Policy for AKS includes built-in controls that can set privilege escalation to false at admission time. It's
    important to note that these rights are still constrained by the overall container sandbox, and this setting does not
    relate to the use of privileged containers.
  rationale: A container running with the allowPrivilegeEscalation flag set to true may have processes that can gain more
    privileges than their parent. There should be at least one admission control policy defined which does not permit containers
    to allow privilege escalation. The option exists (and is defaulted to true) to permit setuid binaries to run. If you have
    need to run containers which use setuid binaries or require privilege escalation, this should be defined in a separate
    policy and you should carefully check to ensure that only limited service accounts and users are given permission to use
    that policy.
  impact: 'If admission of containers with allowPrivilegeEscalation=true is not minimized, an identity with workload deployment
    or update rights can introduce pods that run outside Microsoft’s recommended AKS security baseline. Microsoft notes that
    noncompliant workloads place the cluster at risk, and its current guidance treats privilege escalation as a condition
    that should be avoided or automatically corrected. Operationally, broad admission of such containers weakens workload
    isolation, increases the blast radius of a container compromise, and makes policy enforcement less reliable across namespaces
    and teams. Pods defined with spec.allowPrivilegeEscalation: true will not be permitted unless they are run under a specific
    policy.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-forkubernetes
  - 2. https://learn.microsoft.com/en-us/azure/aks/use-azure-policy
