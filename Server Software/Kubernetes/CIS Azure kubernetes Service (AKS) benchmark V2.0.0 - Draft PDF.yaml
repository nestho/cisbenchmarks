    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the kubeconfig\n\
    file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %U:%G /var/lib/kubelet/kubeconfig (or stat\
    \ -c %U:%G\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig\
    \ file's ownership. Verify that\nthe ownership is set to root:root.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will\
    \ need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying a pod\
