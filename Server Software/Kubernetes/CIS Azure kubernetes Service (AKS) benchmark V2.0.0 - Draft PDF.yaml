      whether the cluster is deployed as a private cluster, whether a public FQDN remains

      enabled for that private cluster, and whether authorized IP ranges are configured on any

      public API server endpoint. In AKS, authorized IP ranges ap'
- id: 5.4.2
  title: Use private AKS clusters and disable public control plane DNS
  scoring: scored
  profile:
  - Level 2
  description: Provisioning AKS in private cluster mode limits control plane exposure by placing the Kubernetes API server
    on private addressing and requiring connectivity through Azure Private Link and a private endpoint rather than broad public
    network access. In this design, AKS creates the private endpoint and supporting private DNS integration needed for internal
    name resolution, and the public FQDN can also be disabled when the security requirement is to prevent the control plane
    from publishing any public DNS name. This reduces the external attack surface of the cluster management plane and aligns
    API server access to approved private network paths only.
  rationale: Because the AKS API server is public by default, provisioning the cluster in private cluster mode materially
    reduces control plane exposure by shifting API server access from internet-routable paths to Azure Private Link, private
    endpoint connectivity, and private DNS resolution. This constrains administrative access to approved internal network
    paths and reduces dependence on public endpoint protections alone. Disabling the public FQDN provides additional hardening
    because private AKS clusters otherwise publish both private and public DNS names by default.
  impact: Private AKS clusters require all administrative access, automation, and API integrations to use approved private
    network paths and private DNS resolution to reach the Kubernetes API server. This can require updates to network routing,
    DNS forwarding, jump-host or VPN design, CI/CD runner placement, and access methods for dependent services that manage
    or interact with the cluster control plane.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/private-clusters
  - 2. https://learn.microsoft.com/en-us/azure/aks/api-server-vnet-integration
  page_start: 161
  audit_raw: "Review the AKS cluster apiServerAccessProfile to confirm the control plane is\ndeployed as a private AKS cluster\
    \ and that the public FQDN is disabled when the\nsecurity standard requires no public DNS name for the Kubernetes API\
    \ server. In AKS,\na private cluster uses internal IP addressing for the API server and private connectivity\nthrough\
    \ Azure Private Link and a private endpoint. In addition, private AKS clusters\ncreate both private and public FQDNs by\
    \ default unless the public FQDN is explicitly\ndisabled.\nexport CLUSTER_NAME=<your cluster name>\nexport RESOURCE_GROUP=<your\
    \ resource group name>\naz aks show \\\n  --name \"${CLUSTER_NAME}\" \\\n  --resource-group \"${RESOURCE_GROUP}\" \\\n\
