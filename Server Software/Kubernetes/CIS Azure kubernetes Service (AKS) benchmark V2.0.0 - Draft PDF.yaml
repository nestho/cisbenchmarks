- id: 4.1.8
  title: Minimize access to create persistent volumes
  scoring: manual
  profile:
  - Level 1
  description: Permission to create persistent storage in AKS is granted only where it is required. In AKS, this includes
    direct creation of PersistentVolume objects and, more commonly, the ability to trigger dynamic provisioning through PersistentVolumeClaim
    and StorageClass use, because AKS storage classes and CSI drivers can create the underlying Azure Disk, Azure File share,
    or other backed storage on demand. For service accounts, this remains an RBAC concern because AKS uses Kubernetes RBAC
    to grant access to Kubernetes resources, and requests from identities outside Microsoft Entra ID, including Kubernetes
    service accounts, continue to defer to normal Kubernetes RBAC.
  rationale: 'Minimizing this access is important because persistent volumes in AKS are durable resources that can outlive
    individual pods, and dynamic provisioning can automatically create backing Azure storage when a claim is submitted. Microsoft’s
    AKS storage guidance states that a PV can exist beyond the lifetime of a pod, that dynamic provisioning uses a storage
    class to determine what resource to create, and that the Azure Disk and Azure Files CSI drivers manage the lifecycle of
    those Azure storage resources. As a result, storage-creation rights are more sensitive than ordinary workload write access:
    they can allocate long-lived storage, influence performance tier and storage type, and establish new data persistence
    paths inside the cluster.'
  impact: If access to create persistent storage is granted too broadly in AKS, a user or service account can provision durable
    storage resources that remain beyond pod termination and can consume Azure storage capacity and related resources without
    a justified need. In clusters using dynamic provisioning, that can result in automatic creation of Azure disks or file
    shares, expansion of the data footprint of a workload, and additional opportunities for unintended data retention, data
    exposure, or cost growth. Where those permissions are held by service accounts, a compromised workload can use them to
    establish new persistent storage for data staging, log retention, or other unauthorized cluster activity.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-storage
  - 2. https://learn.microsoft.com/en-us/azure/aks/csi-storage-drivers
  page_start: 79
  audit_raw: 'Review AKS RBAC to identify any users, groups, or service accounts that can create

    PersistentVolume, PersistentVolumeClaim, or StorageClass resources. In AKS,

    this review should include PersistentVolumeClaim and StorageClass permissions

    because persistent storage is commonly provisioned dynamically through CSI drivers

    rather than by manually creating PersistentVolume objects.'
  remediation: 'Remove persistent-storage creation rights from any user, group, or service account that

    does not require them, and replace broad assignments with the lowest-privilege role

    and narrowest scope possible. Limit direct PersistentVolume and StorageClass

    administration to approved administrators, and allow workloads to use only the

    PersistentVolumeClaim access they need for approved storage classes. After

    changes are made, verify that required applications can still provision storage through

    the intended AKS CSI driver path.

    Where possible, remove create access to PersistentVolume objects in the cluster.'
  checks:
  - type: manual_review
    info: 'Review AKS RBAC to identify any users, groups, or service accounts that can create

      PersistentVolume, PersistentVolumeClaim, or StorageClass resources. In AKS,

      this review should include PersistentVolumeClaim and StorageClass permissions

      because persistent storage is commonly provisioned dynamically through CSI drivers

      rather than by manually creating PersistentVolume objects.'
    severity: medium
- id: 4.1.9
  title: Minimize access to the proxy sub-resource of nodes
  scoring: manual
  profile:
  - Level 1
  description: Review AKS RBAC to ensure access to the nodes/proxy subresource is granted only to identities with a documented
    operational need. This review should include Role and ClusterRole rules, RoleBinding and ClusterRoleBinding assignments,
    and any service accounts that receive node-proxy access, because AKS uses Kubernetes RBAC to grant in-cluster permissions
    and service accounts continue to rely on Kubernetes RBAC authorization. Microsoft’s AKS guidance also indicates that nodes/proxy
    is a privileged access path by explicitly denying workloads that grant nodes/proxy permissions on managed system node
    pools except for approved system users and groups. Users with access to the Proxy sub-resource of Node objects automatically
    have permissions to use the kubelet API, which may allow for privilege escalation or bypass cluster security controls
    such as audit logs. Direct access to the kubelet API bypasses controls like audit logging (there is no audit log of kubelet
    API access) and admission control.
  rationale: Limiting nodes/proxy access is important because AKS treats node access as a privileged operation rather than
    ordinary workload access. Microsoft’s node-access guidance says direct access to AKS nodes is used for maintenance, log
    collection, or troubleshooting, and that nodes aren’t exposed to the internet; instead, access is expected through controlled
    methods such as kubectl debug or the node’s private IP. AKS Automatic reinforces the same principle by blocking workloads
    that grant nodes/proxy permissions on managed system node pools unless they are approved system identities.
  impact: If nodes/proxy access is granted too broadly in AKS, a user or service account can be given an unnecessary path
    toward node-level access or node-adjacent operations that Microsoft otherwise treats as privileged and tightly controlled.
    In practice, that can weaken separation between ordinary namespace-scoped workload access and node administration, expand
    the blast radius of a compromised service account, and expose troubleshooting or maintenance pathways to identities that
    do not require them. This is especially relevant in AKS because service accounts outside Microsoft Entra ID continue to
    be authorized through Kubernetes RBAC.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/node-access
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 81
  audit_raw: "Review AKS RBAC to identify custom Role and ClusterRole objects that grant access\nto the nodes/proxy subresource,\
    \ and validate that each permission is required for an\napproved troubleshooting, maintenance, or platform-administration\
    \ function. This review\nshould focus on customer-managed RBAC because AKS uses Kubernetes RBAC to\ngrant in-cluster permissions,\
    \ and service accounts continue to rely on Kubernetes\nRBAC authorization when the identity is outside Microsoft Entra\
    \ ID. The command\nbelow returns only roles whose actual RBAC rules include nodes/proxy, and it filters\nout Kubernetes\
    \ default bootstrapped roles plus system:-prefixed roles so the output is\nmore focused on custom RBAC rather than delivered\
    \ platform roles.\nThis command returns each custom Role or ClusterRole whose RBAC rules include\nnodes/proxy, along with\
    \ the namespace, role name, and allowed verbs. It is intended\nto give a cleaner view of customer-managed node-proxy access\
