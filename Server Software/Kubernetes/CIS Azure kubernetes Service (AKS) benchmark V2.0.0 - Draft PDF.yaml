  description: Minimize the admission of pods that request spec.hostNetwork=true so that only tightly controlled, explicitly
    approved platform workloads can share the host network namespace in AKS. As it relates to RBAC and service accounts, this
    means users, groups, and service accounts with pod or controller deployment rights should not broadly be able to create
    or update workloads that use host networking, because AKS relies on Kubernetes RBAC to scope who can create and modify
    workload resources, and AKS provides supported admission controls to restrict host-network usage. Do not generally permit
    containers to be run with the hostNetwork flag set to true.
  rationale: A container running in the host's network namespace could access the local loopback device, and could access
    network traffic to and from other pods. There should be at least one admission control policy defined which does not permit
    containers to share the host network namespace. If you need to run containers which require access to the host's network
    namespaces, this should be defined in a separate policy and you should carefully check to ensure that only limited service
    accounts and users are given permission to use that policy.
