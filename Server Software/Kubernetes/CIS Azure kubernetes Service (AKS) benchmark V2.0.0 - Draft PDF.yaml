- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: scored
  profile:
  - Level 1
  description: The AKS control plane endpoint should be exposed only through approved network paths rather than being broadly
    reachable. In AKS, the control plane is the Kubernetes API server. For public clusters, API server authorized IP ranges
    can be used to limit access to specific public IP addresses or CIDR blocks and deny all other sources. For more restrictive
    deployments, AKS also supports private clusters, where the API server is exposed through a private endpoint with private
    DNS resolution, and API Server VNet Integration, which keeps API server connectivity on private network paths within the
    virtual network.
  rationale: In AKS, the Kubernetes API server is assigned a public IP address by default, so restricting access to approved
    source IP addresses reduces exposure of the control plane to unsolicited network traffic. API server authorized IP ranges
    allow only specified public IP addresses or CIDR blocks to reach the public API server endpoint, while requests from other
    source IPs are blocked. For environments that do not permit internet-reachable management endpoints, Microsoft recommends
    using a private cluster so API server access stays on private network paths instead of relying on public endpoint filtering
    alone.
  impact: Restricting the AKS control plane endpoint changes how administrators and automation reach the Kubernetes API server.
    If API server authorized IP ranges are used, all required administrator or egress public IP ranges must be explicitly
    allowed or legitimate access can be blocked; authorized IP ranges apply only to the public API server endpoint. If a private
    cluster is used, management access must come from the cluster VNet, a peered network, or another approved private access
    path, and proper private DNS resolution is required. Microsoft also notes that private clusters do not support Azure DevOps
    Microsoft-hosted agents, and any dependent private services such as Azure Container Registry must be reachable through
    an appropriate private network and DNS design.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
  - 2. https://learn.microsoft.com/en-us/azure/aks/private-clusters
  page_start: 157
  audit_raw: "Review each AKS cluster to determine how the Kubernetes API server is exposed and\nwhether network-based restrictions\
    \ are configured appropriately. Specifically, verify\nwhether the cluster is deployed as a private cluster, whether a\
    \ public FQDN remains\nenabled for that private cluster, and whether authorized IP ranges are configured on any\npublic\
    \ API server endpoint. In AKS, authorized IP ranges apply to the public API server\nendpoint, while private-cluster access\
    \ is controlled through private networking and DNS\ndesign rather than public IP allowlisting.\nexport CLUSTER_NAME=<your\
    \ cluster name>\nexport RESOURCE_GROUP=<your resource group name>\naz aks show \\\n  --name \"${CLUSTER_NAME}\" \\\n \
    \ --resource-group \"${RESOURCE_GROUP}\" \\\n  --query \"{enablePrivateCluster:apiServerAccessProfile.enablePrivateCluster,\n\
    enablePublicFqdn:apiServerAccessProfile.enablePublicFqdn,\nauthorizedIpRanges:apiServerAccessProfile.authorizedIpRanges}\"\
    \ \\\n  --output json\nInterpretation:\n• enablePrivateCluster: true means the cluster is configured as a private\nAKS\
    \ cluster and the API server is intended to be reached through private\nnetwork connectivity.\n• enablePublicFqdn: true\
    \ means a public DNS name exists for the API server\nin that cluster configuration; for private clusters, Microsoft documents\
    \ that both\nprivate and public FQDNs are created by default unless the public FQDN is\ndisabled. This setting should\
    \ not be described as “endpointPublicAccess.”\n• authorizedIpRanges lists the allowed source CIDR ranges for access to\
    \ the\npublic API server endpoint. If the list is empty or null on a public cluster, there is\nno IP-based restriction\
    \ on that public endpoint. On a private cluster, these ranges\ndo not secure the private API endpoint itself.\nThe result\
    \ for a private cluster should show enablePrivateCluster as true.\nenablePublicFqdn should be evaluated against your security\
    \ standard, and\nauthorizedIpRanges should only be treated as relevant where a public API server\nendpoint is in play.\
    \ For a public cluster, the key networking control is whether\nauthorizedIpRanges is populated with only approved administrator\
    \ or egress CIDR\nblocks."
  remediation: 'If the cluster is intended to expose the Kubernetes API server only over private network

    paths, use a private AKS cluster; if the cluster is already private but a public DNS name

    is still published, disable the public FQDN. If the cluster must keep a public API server

    endpoint, configure authorized IP ranges so only approved administrator and egress

    CIDR ranges can reach it. Microsoft notes that authorized IP ranges apply only to the

    public API server endpoint, recommends including both the cluster egress IP and the

    networks used to administer the cluster, and states that rule updates can take up to two

    minutes to propagate.

    1. If enablePrivateCluster is false and the cluster should be managed only

    over private connectivity, move to private cluster mode using the Microsoftsupported private-cluster workflow for that
    cluster type; Microsoft documents

    enablement on supported existing clusters with API Server VNet integration and

    private-cluster deployment for new clusters.

    2. If enablePrivateCluster is true but enablePublicFqdn is also true and your

    standard does not allow a public DNS name, disable the public FQDN for the

    private cluster.

    3. If the cluster keeps a public API server endpoint and authorizedIpRanges is

    empty or null, add approved CIDR ranges so the API server is not broadly

    reachable from the internet.

    4. If authorizedIpRanges is present but incomplete, update it to include only the

    required administrator, VPN, firewall, NAT gateway, and other approved egress

    ranges including the cluster egress IP and the networks from which the cluster is

    administered.

    5. After remediation, rerun the same az aks show audit query and test access from

    both approved and nonapproved network paths, allowing for the documented

    propagation delay before confirming results.'
