      is protected by a certificate-backed HTTPS or TLS listener. In AKS, ingress can provide

      SSL termination, and the application routing add-on supports certificate'
    severity: medium
- id: 5.5.1
  title: Manage Kubernetes RBAC users and groups with Microsoft Entra ID
  scoring: manual
  profile:
  - Level 2
  description: Using Microsoft Entra ID for AKS user access helps ensure that Kubernetes permissions are tied to centrally
    managed enterprise identities and groups instead of disconnected, cluster-local user handling. At a high level, this improves
    control over who can authenticate to the cluster and lets access decisions follow the organization’s normal identity lifecycle,
    such as user onboarding, group membership changes, and access removal.
  rationale: In AKS, Microsoft Entra integration supplies the authentication layer for Kubernetes access through an OpenID
    Connect-based flow, and AKS-managed integration now handles the application plumbing that older legacy integrations required
    administrators to register manually. After the user authenticates, Kubernetes RBAC evaluates that Entra user or group
    identity through RoleBinding and ClusterRoleBinding objects inside the cluster. For user access, newer AKS clusters use
    the exec credential format with kubelogin, which acts as the client-go credential plugin for Microsoft Entra authentication.
    This lets AKS use enterprise identities for Kubernetes authorization decisions without maintaining separate Kubernetes
    user accounts in the cluster itself.
  impact: This model shifts AKS user access to an Entra sign-in and group-based authorization flow, and it is commonly paired
    with disabling local accounts so static --admin credentials do not remain available as an alternate access path.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/azure-ad-rbac
  - 2. https://learn.microsoft.com/en-us/azure/aks/enable-authentication-microsoftentra-id
  page_start: 175
  audit_raw: 'Review the AKS cluster configuration to confirm user authentication is integrated with

    Microsoft Entra ID and that cluster authorization is being managed through Kubernetes

    RBAC bindings for Entra users or groups, rather than relying on local cluster

    credentials. A brief audit should verify that AKS-managed Entra integration is enabled,

    that appropriate Entra admin group object IDs are configured, and that local accounts

    are disabled where the security standard requires removal of the alternate --admin

    access path. AKS documents Entra-integrated Kubernetes RBAC as a supported

    model, and separately documents disabling local accounts to prevent non-auditable

    admin credential use.'
  remediation: 'If the cluster isn’t using AKS-managed Microsoft Entra integration with Kubernetes

    RBAC, enable that identity model and assign access through approved Entra groups

    that are then mapped to Kubernetes Roles and ClusterRoles by RoleBinding or

    ClusterRoleBinding. Where the goal is to ensure all human access is Entragoverned, also disable local accounts so static
    local admin credentials don’t remain

    available as a parallel access method; AKS guidance notes that if local accounts are

    disabled on an existing cluster, cluster certificates should be rotated to revoke

    previously issued local-account credentials.'
  checks:
  - type: manual_review
    info: 'Review the AKS cluster configuration to confirm user authentication is integrated with

      Microsoft Entra ID and that cluster authorization is being managed through Kubernetes

      RBAC bindings for Entra users or groups, rather than relying on local cluster

      credentials. A brief audit should verify that AKS-managed Entra integration is enabled,

      that appropriate Entra admin group object IDs are configured, and that local accounts

      are disabled where the security standard requires removal of the alternate '
    severity: medium
- id: 5.5.2
  title: Use Azure RBAC for Kubernetes Authorization
  scoring: manual
  profile:
  - Level 2
  description: Using Azure RBAC for Kubernetes Authorization helps centralize AKS access control in the same Azure IAM model
    used for other Azure resources, instead of managing human-user permissions only through in-cluster Kubernetes bindings.
    At a high level, this improves consistency, makes access assignment easier to govern across subscriptions and clusters,
    and supports least-privilege access by assigning only the Azure roles needed for Kubernetes API use.
  rationale: In AKS, Azure RBAC for Kubernetes Authorization uses a Kubernetes authorization webhook after the user is authenticated
    through Microsoft Entra ID. Requests to the Kubernetes API follow the Entra-integrated authentication flow, and once the
    calling identity is validated, AKS uses Azure RBAC role assignments to determine what Kubernetes resources that identity
    can access. AKS supports this model with built-in Azure roles such as Azure Kubernetes Service RBAC Reader, Writer, Admin,
    and Cluster Admin, and it also allows the use of custom Azure roles where needed. This authorization model depends on
    managed Microsoft Entra integration being enabled on the cluster first. It also requires the Microsoft Entra tenant used
    for authentication to be the same tenant associated with the subscription that contains the AKS cluster. Identities that
    do not authenticate through Entra, such as Kubernetes service accounts, are not evaluated through Azure RBAC for Kubernetes
    Authorization and continue to use standard Kubernetes RBAC instead. When custom Azure RBAC roles are used, permission
    design should account for the difference between custom resource definitions (CRDs) and standard Kubernetes resources.
    CRD read access is typically handled with a broader managed cluster read permission, while standard Kubernetes objects
    can usually be authorized with more granular API-group-specific actions. This helps keep custom roles functional while
    still applying least-privilege scoping where finer control is supported.
  impact: This model shifts AKS authorization for Entra-backed users and groups into Azure role assignment management, which
    reduces the need to maintain Kubernetes RoleBinding and ClusterRoleBinding objects for those human identities. Operationally,
    access changes are subject to Azure role-assignment propagation, and Microsoft notes new assignments can take up to five
    minutes to take effect.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 177
  audit_raw: 'Review the AKS cluster to confirm AKS-managed Microsoft Entra integration is enabled

    and Azure RBAC for Kubernetes Authorization is turned on, because Azure RBAC for

    Kubernetes depends on managed Entra integration first. Then verify that access for

    human users and groups is being granted through Azure role assignments for

    Kubernetes authorization rather than primarily through in-cluster RoleBinding and

    ClusterRoleBinding objects for those Entra identities. As part of the review, confirm

    the cluster is using the same Entra tenant as the subscription that contains the AKS

    cluster, since that is a requirement for this authorization model.'
  remediation: 'If the cluster is not using Azure RBAC for Kubernetes Authorization, enable AKSmanaged Microsoft Entra integration
    first, then enable Azure RBAC on the cluster and

    move user access management to Azure role assignments using the built-in AKS

    Kubernetes RBAC roles or approved custom roles. For stronger control, pair this with

    disabling local accounts so static --admin access does not remain available as an

    alternate path; if local accounts are disabled on an existing cluster, rotate cluster

    certificates to revoke previously issued local-account credentials. Also review any

    custom role design for CRD coverage, because CRD reads require broader managedcluster read scope than standard Kubernetes
    objects.'
  checks:
