- id: 4.1.7
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: Cluster roles and roles with the impersonate, bind or escalate permissions should not be granted unless strictly
    required. Each of these permissions allow a particular subject to escalate their privileges beyond those explicitly granted
    by cluster administrators Review AKS authorization assignments to ensure bind, escalate, and impersonation permissions
    are granted only to identities with a documented administrative need. This review should cover Kubernetes Role and ClusterRole
    design, RoleBinding and ClusterRoleBinding assignments, and any Azure RBAC for Kubernetes Authorization custom roles that
    include AKS managed-cluster actions such as .../roles/bind/action, .../clusterroles/escalate/action, or .../serviceaccounts/impersonate/action.
  rationale: These permissions are high risk because they affect the authorization model itself, not just routine resource
    access. In AKS, Microsoft defines actions to bind roles, escalate roles, and impersonate users, groups, and service accounts.
    It is AKS best-practice to assign the least amount of permission required to those capabilities so they remain tightly
    restricted. The impersonate privilege allows a subject to impersonate other users gaining their rights to the cluster.
    The bind privilege allows the subject to add a binding to a cluster role or role which escalates their effective permissions
    in the cluster. The escalate privilege allows a subject to modify cluster roles to which they are bound, increasing their
    rights to that level. Each of these permissions has the potential to allow for privilege escalation to cluster-admin level.
  impact: If bind, escalate, or impersonation permissions are granted too broadly in AKS, a user or service account can obtain
    or assign authority beyond its intended role and act through a different security principal. That can weaken namespace
    boundaries, reduce separation of duties, and increase the blast radius of a compromised identity or workload by turning
    a limited access path into broader administrative control.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 76
  audit_raw: "Review AKS RBAC to identify any users, groups, or service accounts granted bind,\nescalate, or impersonation\
