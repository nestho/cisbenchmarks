- id: 3.2.7
  title: Ensure that rotateCertificates is set to true
  scoring: scored
  profile:
  - Level 2
  description: The value of rotateCertificates (-rotate-certificates argument) should be set to true because it allows the
    kubelet to automatically generate a new key and request a replacement client certificate from the Kubernetes API as the
    current certificate approaches expiration. That client certificate is what the kubelet uses to authenticate to the API
    server, so keeping rotation enabled helps prevent the node from relying on an aging certificate that could eventually
    become stale or expire. In practical terms, the expected secure state is that certificate rotation is on, which in AKS
    aligns with the CIS control that the --rotate-certificates argument must not be set to false.
  rationale: This setting should be true because it verifies that kubelet identity is being refreshed through Kubernetes’
    normal PKI renewal process rather than depending on a long-lived credential. From a security and operational control standpoint,
    that matters because static node credentials are harder to govern over time and provide less assurance that node authentication
    is being actively maintained through the platform’s intended certificate workflow. The related RotateKubeletServerCertificate
    setting should be evaluated separately because it covers a different certificate role. rotateCertificates governs the
    kubelet’s outbound client identity to the control plane, while RotateKubeletServerCertificate is tied to kubelet serving
    certificate rotation, used when the kubelet presents a TLS certificate as a server endpoint. Kubernetes documents serving
    certificate rotation through TLS bootstrapping and notes that serverTLSBootstrap depends on the RotateKubeletServerCertificate
    feature, and AKS lists the two controls separately in its CIS mapping. Together, they show whether both sides of kubelet
    certificate trust are being managed correctly, not just one.
  impact: If rotateCertificates is disabled, AKS nodes can continue relying on aging kubelet client certificates instead of
    renewing them through Kubernetes’ certificate rotation process, increasing the risk of certificate expiration, node authentication
    failures, and avoidable operational disruption. Keeping the setting enabled supports a more reliable node trust lifecycle
    and strengthens the cluster’s overall authentication posture.
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/41912
  - 2. https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet-tlsbootstrapping/#kubelet-configuration
  page_start: 52
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    Run the following command on each node to find the appropriate kubeconfig value:

    ps -efww | grep ''[k]ubelet'' | grep -- ''--rotate-certificates''

    The command line output should show the --rotate-certificates=true

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of

    rotateCertificates by extracting the live configuration from the nodes running

    kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of "kubectl get

    nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'If an audit shows rotateCertificates set to false or blank, the preferred remediation

    is to replace the affected node pool with a new pool and let the kubelet come up through

    the normal AKS node-pool configuration path, rather than trying to force a one-off

    manual change onto existing nodes. This is the preferred approach because the setting

    affects kubelet client certificate rotation, which is part of how each node maintains

    authenticated trust with the Kubernetes API server over time. Rebuilding the pool allows

    new nodes to be provisioned, bootstrapped, and joined through the same managed

    configuration path, which helps ensure consistent kubelet behavior across the pool and

    avoids carrying forward nodes whose certificate lifecycle or startup arguments may

    already have drifted from the intended state.

    The rebuilding the node pool supports durability and consistency:

    • AKS applies kubelet tuning through node-pool configuration rather than through

    ad hoc per-node changes.

    • A manual edit to /etc/default/kubelet does not work well because it changes

    only the local VM, can be overwritten during reprovisioning or image refresh, and

    can leave nodes in the same pool running with different kubelet behavior.

    • Because rotateCertificates is not handled as a normal AKS-exposed nodepool setting, az aks nodepool update is not a
    dependable way to remediate this

    finding.

    • Replacing the node pool helps ensure the kubelet starts through a repeatable,

    pool-level configuration path instead of relying on one-off node changes that may

    not remain consistent across the environment.

    Important: Editing /etc/default/kubelet is not recommended, even if it appears to

    work, because that file feeds KUBELET_EXTRA_ARGS, which acts as a last-resort

    override with higher priority than conflicting kubelet configuration. That makes the

    change node-local hard to govern, can mask the intended kubelet config, and can

    create configuration drift between nodes in the same pool. In AKS, that risk is even

    greater because normal lifecycle events such as scale-out, upgrade, or reimage can

    replace the VM and remove reliance on the original hand-edited state.'
