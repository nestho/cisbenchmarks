- id: 5.2.1
  title: Prefer using dedicated AKS Service Accounts
  scoring: manual
  profile:
  - Level 1
  description: It is important to use dedicated Kubernetes service accounts in AKS so identity, permissions, and token use
    are isolated to the specific workload that requires them, rather than shared across unrelated pods. In AKS, service accounts
    remain a core Kubernetes identity construct and also serve as the anchor for Microsoft Entra Workload ID, which allows
    access to Kubernetes and Azure resources to be scoped per workload.
  rationale: Using dedicated service accounts supports least privilege by allowing each AKS workload to receive only the Kubernetes
    RBAC permissions and Azure access it actually requires, instead of sharing identity and permissions through a common account.
    It also helps limit token exposure and lateral movement, because access to Secrets can expose service account credentials,
    and unnecessary token mounting increases the number of workloads that carry usable credentials.
  impact: This approach adds per-workload identity configuration, because each application may need its own service account,
    RBAC binding, and, if it accesses Azure resources, workload identity configuration such as OIDC and pod labeling. If those
    settings are incomplete, workloads can fail to authenticate or access required resources.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  page_start: 149
  audit_raw: 'For each namespace, verify that workloads do not use the default service account

    unless required, and confirm that the default service account has no custom role

    bindings beyond baseline defaults. Review workload-specific service accounts to

    ensure permissions are scoped with least privilege, and confirm

    automountServiceAccountToken is disabled where token access is not needed.

    • Review each namespace for pods and workload controllers that use the default

    service account, and flag any use that is not explicitly required, because

    dedicated service accounts are the workload identity boundary in AKS.

    • Review RoleBinding and ClusterRoleBinding assignments for the default

    service account and confirm it has no custom permissions beyond baseline

    defaults; then verify workload-specific service accounts are bound only to the

    minimum required RBAC roles.

    • Check service accounts and pod specs for unnecessary token exposure, and

    confirm automountServiceAccountToken is set to false where a workload

    does not need a service account token.

    • For workloads that access Azure resources, verify they use a dedicated

    Kubernetes service account with the expected workload identity configuration,

    including service account annotation and federated identity mapping, rather than

    a shared or default account.'
  remediation: 'Use a dedicated Kubernetes service account for each AKS workload that requires

    identity, and replace use of the namespace default service account wherever it is not

    explicitly required. Scope each service account to only the Kubernetes permissions and

    Azure resource access needed by that workload, and prevent service account tokens

    from being mounted into pods unless token-based access is required.

    1. Create a separate Kubernetes service account for each workload or application

    boundary that requires distinct access.

    2. Bind each service account only to the minimum required Kubernetes Role or

    ClusterRole, and avoid granting custom permissions to the namespace

    default service account.

    3. Set automountServiceAccountToken: false for pods that do not need a

    service account token.

    4. If a workload needs access to Azure resources, enable the AKS OIDC issuer and

    Microsoft Entra Workload ID, create the federated identity credential, and

    annotate the dedicated service account for that workload.

    5. Update Deployments, StatefulSets, CronJobs, and other controllers so they

    reference the intended dedicated service account.'
