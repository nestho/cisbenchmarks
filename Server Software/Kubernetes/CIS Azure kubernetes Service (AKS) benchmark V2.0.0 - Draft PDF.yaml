- id: 3.2.8
  title: Ensure that the RotateKubeletServerCertificate argument is set to true
  scoring: scored
  profile:
  - Level 1
  description: The RotateKubeletServerCertificate argument is a control that corresponds to kubelet serving certificate rotation.
    In practical terms, it means the kubelet uses server TLS bootstrapping to obtain and rotate a serving certificate signed
    by the cluster CA for the kubelet’s own HTTPS endpoint, rather than relying on a locally self-signed serving certificate.
    AKS treats this as a valid CIS-aligned control and documents kubelet serving certificate rotation separately from other
    certificate features.
  rationale: 'This setting covers a different trust boundary than rotateCertificates. The rotateCertificates setting governs
    the kubelet’s client certificate, which the node uses to authenticate to the API server, while RotateKubeletServerCertificate
    governs the kubelet’s server-side TLS identity, which is what other components see when they connect to the kubelet’s
    HTTPS endpoint. Reviewing only the client-side control can leave a gap: node authentication to the control plane may be
    healthy while the kubelet’s serving endpoint is still operating with a weaker or less-governed certificate model.'
  impact: If RotateKubeletServerCertificate is not enabled, the kubelet may continue using a self-signed serving certificate
    instead of a serving certificate bootstrapped and rotated through the cluster CA workflow. That can make certificate validation
    for direct kubelet TLS consumers more difficult, reduce confidence in the kubelet endpoint’s server identity, and create
    avoidable friction for tooling or controls that expect a CA-signed serving certificate. It also does not mean rotateCertificates
    is necessarily wrong, because client-certificate rotation and serving-certificate rotation are separate mechanisms.
  references:
  - 1. https://github.com/kubernetes/kubernetes/pull/45059
  - 2. https://kubernetes.io/docs/admin/kubelet-tls-bootstrapping/#kubelet-configuration
  page_start: 55
  audit_raw: 'Audit Method 1:

    Optional: Run the following command to enter debug mode where NODE_NAME and

    IMAGE are defined variables:

    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

    Run the following command on each node to find the appropriate kubeconfig value:

    ps -efww | grep ''[k]ubelet'' | grep -- ''--rotate-server-certificates''

    The command line output should show the --rotate-server-certificates=true

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of

    "RotateKubeletServerCertificate":true by extracting the live configuration from

    the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of "kubectl get

    nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192.168.31.226.aks.internal (example node name from

    "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'If an audit shows RotateKubeletServerCertificate set to false or blank, the

    preferred remediation method is to replace the affected node pool with a new pool and

    let the kubelet come up through the normal AKS-managed bootstrap path, rather than

    trying to update the setting manually into existing nodes. This is preferred because the

    kubelet serving certificate rotation in Kubernetes is tied to serverTLSBootstrap, which

    moves the kubelet away from a self-signed serving certificate and into the CSR-based

    certificate workflow, while AKS treats kubelet serving certificate rotation as a managed

    platform capability on supported node pools. In addition, replacing the node pool gives

    you a consistent, repeatable way to bring every node up through the same managed

    certificate path.

    The rebuilding the node pool supports durability and consistency:

    • AKS applies kubelet and OS tuning through node-pool provisioning and a

    documented subset of supported node configuration, rather than through ad hoc

    manual changes.

    • A manual edit to /etc/default/kubelet is not recommended because that file

    feeds KUBELET_EXTRA_ARGS, which Kubernetes describes as a last-resort

    override that is applied last and therefore has the highest priority over conflicting

    with kubelet settings.

    • Running az aks nodepool update is not a reliable fix for this control because

    kubelet serving certificate rotation is handled by AKS as a managed capability,

    not as a normal kubelet setting you manually toggle.

    • Replacing the node pool is more reliable method because all new nodes are

    rebuilt through the same managed bootstrap path, which keeps servingcertificate behavior consistent across the pool.

    Important: Directly editing /etc/default/kubelet may appear to work temporarily, but

    it is a poor solution because it bypasses the normal managed lifecycle and relies on a

    high-priority local override. For RotateKubeletServerCertificate specifically, that is

    especially problematic because the setting relates to the kubelet’s serving-side TLS

    identity and CSR flow, so a one-off manual edit can leave one node behaving differently

    from the rest of the pool while future replacement nodes come up using the managed

    AKS behavior instead.'
  checks:
  - type: command
    command: ps -efww | grep '[k]ubelet' | grep -- '--rotate-server-certificates'
    expected: ''
    severity: medium
    info: 'Audit Method 1:

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig value:

      ps -efww | grep ''[k]ubelet'' | grep -- ''--rotate-server-certificates''

      The command line output should show the --rotate-server-certif'
- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that cluster-admin access in AKS is granted only to identities with a documented need for full cluster-wide
    administration. In AKS, this review should cover both Kubernetes-native privilege paths, such as ClusterRoleBinding assignments
    to the cluster-admin ClusterRole, and Azure RBAC for Kubernetes Authorization assignments, such as Azure Kubernetes Service
    RBAC Cluster Admin, because AKS supports authorization through both models depending on the identity and access path.
    Where administrative needs are limited to a namespace, application, or team boundary, lower-privilege roles and namespace-scoped
    bindings should be used instead of cluster-wide administrative access.
  rationale: This control supports least privilege in the highest-risk portion of the AKS authorization model. Microsoft’s
    AKS guidance emphasizes granular role assignment for Kubernetes API access, and AKS provides built-in Reader, Writer,
    Admin, and Cluster Admin roles specifically so permissions can be scoped to operational need rather than defaulting to
    full-cluster authority. Kubernetes guidance reinforces the same principle by recommending minimal RBAC rights for users
    and service accounts, favoring namespace-level permissions where possible and warning against unrestricted privilege constructs.
    Excessive RBAC privileges in Kubernetes can create direct or indirect escalation paths. AKS documentation explicitly notes,
    for example, that even read access to Secrets can expose service account credentials and enable API access as that service
    account within the namespace, while Kubernetes documents broader escalation risks around powerful permissions and cluster-scoped
    bindings. Because AKS may authorize Microsoft Entra identities through Azure RBAC while service accounts continue to rely
    on Kubernetes RBAC, controlling cluster-admin use is necessary to keep privileged access exceptional, auditable, and bounded.
  impact: If cluster-admin is assigned too broadly in AKS, a compromised user, group, service principal, or service account
    can move from limited operational access to effective control over the entire cluster. That can allow unauthorized changes
    to RBAC policy, workloads, secrets, and other cluster resources across namespaces, increasing the likelihood that a single
    credential exposure, misconfiguration, or automation error becomes a cluster-wide security or availability incident.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 59
  audit_raw: "This audit statement identifies the principals that are granted the Kubernetes clusteradmin role by reviewing\
    \ ClusterRoleBinding assignments in the AKS cluster. It filters\nthe binding output to show each binding name and the\
    \ associated user, group, or\nservice account, allowing the reviewer to determine which identities have unrestricted\n\
    cluster-wide administrative access.\nkubectl get clusterrolebindings -o json | jq -r '\n  ([\"BINDING\",\"KIND\",\"NAMESPACE\"\
    ,\"NAME\"] | join(\" | \")),\n  (\n    .items[]\n    | select(.roleRef.name==\"cluster-admin\")\n    | .metadata.name\
    \ as $binding\n    | (.subjects // [])[]\n    | [$binding, .kind, (.namespace // \"-\"), .name]\n    | join(\" | \")\n\
    \  )\n'\nExample output with headers and piped separation of values. Review each principal\nlisted and ensure that cluster-admin\
    \ privilege is required for it.\nBINDING | KIND | NAMESPACE | NAME\naks-cluster-admin-binding | User | - | clusterAdmin\n\
    aks-cluster-admin-binding | User | - | clusterUser\ncluster-admin | Group | - | system:masters\ncustom-cluster-admin |\
    \ ServiceAccount | kube-system | admin-sa"
  remediation: 'Review all ClusterRoleBinding objects that grant access to the Kubernetes clusteradmin role and identify the
    users, groups, or service accounts associated with each

    binding. Validate whether each principal still requires full cluster-wide administrative

    access or whether its responsibilities can be met through a lower-privileged role,

    preferably a namespace-scoped Role/RoleBinding or a more limited ClusterRole, in

    accordance with AKS and Kubernetes least-privilege guidance.

    Where full administrative access is not required, first assign the principal to an approved

    lower-privilege role and confirm that required operational tasks continue to function as

    expected. After the replacement access has been validated, remove the unnecessary

    cluster-admin binding to reduce the risk of privilege escalation and cluster-wide

    misuse.

    kubectl delete clusterrolebinding [name]'
