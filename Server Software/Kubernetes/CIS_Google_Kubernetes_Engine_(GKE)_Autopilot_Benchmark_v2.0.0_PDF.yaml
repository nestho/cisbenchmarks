    • Expected output: Each certificate referenced by an Ingress should exist in the\nsame namespace as that Ingress, cover\
    \ the expected domain names, and show\nan active or successfully provisioned status. If the certificate is missing, pending,\n\
    failed, or not referenced by the Ingress annotation, Google managed SSL\ncertificates are not correctly configured for\
    \ that Ingress."
  remediation: 'Remediate public HTTPS workloads by using GKE Ingress with Google managed SSL

    certificates where this pattern is appropriate. This applies to HTTPS traffic terminated by

    the external Application Load Balancer through GKE Ingress and does not apply to TCP

    or UDP workloads exposed through Service objects of type LoadBalancer.

    • For public HTTP or HTTPS workloads exposed directly through Service objects

    of type LoadBalancer, evaluate whether they should be exposed through GKE

    Ingress so Google managed SSL certificates can be used.

    • Create a ManagedCertificate object in the same namespace as the Ingress

    and define the approved non wildcard domain names for the certificate.

    • Update the Ingress metadata to include the networking.gke.io/managedcertificates annotation with the ManagedCertificate
    resource name.

    Multiple managed certificates can be listed as comma separated values when

    needed.

    • Confirm that DNS records for the certificate domains point to the load balancer IP

    address, because Google must validate domain ownership before the certificate

    becomes active.

    • After the certificate is active, verify that the Ingress serves HTTPS traffic using

    the Google managed certificate and remove any obsolete self managed

    certificate references that are no longer required.'
