      determine the exact permissions granted. Kub'
    severity: medium
- id: 4.1.9
  title: Avoid binding RBAC roles to all authenticated users
  scoring: scored
  profile:
  - Level 1
  description: Avoid non-default RoleBinding and ClusterRoleBinding objects that grant RBAC permissions to the system:authenticated
    group. This group represents all authenticated Kubernetes API requests from users signed in with a Google Account, including
    Gmail accounts, so it should not be used for custom access grants. The default system ClusterRoleBindings system:basic-user,
    system:discovery, and system:public-info-viewer are expected and should not be treated as findings by themselves.
  rationale: Binding a Role or ClusterRole to system:authenticated grants the referenced permissions to a very broad set of
    authenticated identities instead of a specific user, group, or service account. This can unintentionally expose cluster
    resources to any authenticated Google Account, depending on the role being bound. RBAC permissions are additive, and access
    should be granted through specific subjects with only the API groups, resources, and verbs required for the task. Non-default
    bindings to system:authenticated are especially risky when they include broad roles, wildcard permissions, Secret access,
    workload access, or namespace wide access. Where access is required, bind permissions to a defined Google Group, IAM service
    account, Kubernetes service account, or named user instead of the global system:authenticated group.
  impact: Removing non-default bindings to system:authenticated can affect users, tools, or automation that implicitly relied
    on broad authenticated access. Before removal, review the referenced Role or ClusterRole, identify the required API groups,
    resources, and verbs, and replace the binding with least privilege access for specific authenticated subjects. Do not
    delete the default system ClusterRoleBindings system:basic-user, system:discovery, or system:public-info-viewer, because
    required system RBAC resources support normal cluster functionality.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
