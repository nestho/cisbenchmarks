    • Review the referenced Role or ClusterRole to identify the API groups,

    resources, and verbs granted.

    • Confirm that no broad roles, wildcard permissions, Secret access, workload

    access, or namespace wide permissions are assigned to unauthenticated

    subjects.

    • Validate that required cluster operations use authenticated users, groups, or

    service accounts instead of unauthenticated access.'
  remediation: 'Remediate any non-default RoleBinding or ClusterRoleBinding returned by the

    audit by removing unauthenticated access and replacing it with authenticated, least

    privilege RBAC access. Bindings to system:anonymous or system:unauthenticated

    should not be used for normal cluster operations because they can grant Kubernetes

    API permissions to unauthenticated requests.

    • Review each returned binding and identify the referenced Role or ClusterRole,

    including the API groups, resources, and verbs granted.

    • Delete unnecessary non-default bindings to system:anonymous or

    system:unauthenticated after confirming they are not required for cluster

    operation.

    kubectl delete clusterrolebinding <clusterrolebinding-name>

    kubectl delete rolebinding <rolebinding-name> -n $NAMESPACE

    • Replace any required access with authenticated users, groups, or dedicated

    Kubernetes service accounts using least privilege Role or ClusterRole

    permissions.

    • Do not replace unauthenticated access with broad roles, wildcard permissions,

    Secret access, or namespace wide permissions unless explicitly required and

    documented.'
  checks:
  - type: manual_review
    info: 'Review all RoleBinding and ClusterRoleBinding objects to confirm that RBAC

      permissions are not assigned to the system:anonymous user and

      system:unauthenticated group through non-default bindings. These subjects

      represent unauthenticated Kubernetes API requests, and any non-default binding to

      them can expose cluster resources without authenticated access. Include both cluster

