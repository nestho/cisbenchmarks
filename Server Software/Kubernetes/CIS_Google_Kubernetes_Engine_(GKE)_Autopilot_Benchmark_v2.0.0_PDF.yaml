    \ Kubernetes API\nrequests, so custom bindings can grant access to a broader audience than intended.\nRBAC permissions\
    \ should be assigned to specific users, groups, or service accounts\nusing least privilege.\nCheck for bindings to system:authenticated:\n\
    kubectl get rolebindings,clusterrolebindings -A -o json \\\n| jq -r '\n[\"KIND\",\"NAMESPACE\",\"BINDING\",\"ROLE\"],\n\
