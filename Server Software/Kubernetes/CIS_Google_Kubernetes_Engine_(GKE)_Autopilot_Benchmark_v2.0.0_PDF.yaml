- id: 5.5.1
  title: Use Google Groups to centrally manage Kubernetes RBAC access for GKE clusters
  scoring: manual
  profile:
  - Level 2
  description: Use Google Groups for RBAC to centrally manage Kubernetes RBAC access for GKE Autopilot clusters. Cluster administrators
    should assign Kubernetes RoleBinding and ClusterRoleBinding permissions to approved Google Groups rather than directly
    binding access to individual user email addresses.
  rationale: Group based RBAC improves access governance by allowing user onboarding, role changes, and offboarding to be
    managed through centralized group membership instead of editing Kubernetes RBAC bindings for each individual user. This
    reduces inconsistent one off permissions, simplifies access reviews, and helps ensure that access is removed when a user
    leaves the organization or changes responsibilities. For GKE, the required gke-security-groups group acts as the security
    group used to evaluate Google Group membership for Kubernetes RBAC. Approved access groups should be nested under that
    security group and then referenced in Kubernetes RoleBinding or ClusterRoleBinding subjects.
  impact: Migrating to Google Groups for RBAC requires reviewing existing RoleBinding and ClusterRoleBinding subjects to replace
    direct individual user bindings with approved group based bindings. Group membership changes can take time to propagate
    because group information and user credentials are cached, so access changes might not take effect immediately. Avoid
    deleting the required security group or member groups without a migration plan because RBAC bindings that depend on those
    groups can fail and users can lose access.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/google-groupsrbac
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/role-basedaccess-control
  page_start: 106
  audit_raw: "Review the GKE Autopilot cluster and verify that Google Groups for RBAC is enabled\nand configured with the\
    \ required security group. Google Groups for RBAC lets\nKubernetes RBAC permissions be assigned to Google Groups managed\
    \ in Google\nWorkspace or Cloud Identity, rather than binding access directly to individual user email\naddresses.\ngcloud\
    \ container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json\
    \ | jq '{\n    enabled: .authenticatorGroupsConfig.enabled,\n    securityGroup: .authenticatorGroupsConfig.securityGroup\n\
    \  }'\n• Expected output: enabled should return true, and securityGroup should be\nset to gke-security-groups@DOMAIN.\
    \ The local part must be gke-securitygroups, and the domain should match the Google Workspace or Cloud Identity\ndomain\
    \ used for group management.\nReview Kubernetes RBAC bindings and verify that access is assigned to approved\nGoogle Groups\
    \ instead of individual users where practical.\nkubectl get rolebindings,clusterrolebindings -A -o json | jq -r '\n[\"\
    BINDING_KIND\",\"NAMESPACE\",\"BINDING_NAME\",\"SUBJECT_KIND\",\"SUBJECT_NAME\",\"ROL\nE_KIND\",\"ROLE_NAME\"],\n(.items[]\
    \ as $b |\n  $b.subjects[]? |\n  select(.kind==\"User\" or .kind==\"Group\") |\n  [$b.kind, ($b.metadata.namespace //\
    \ \"cluster-wide\"), $b.metadata.name,\n.kind, .name, $b.roleRef.kind, $b.roleRef.name]\n)\n| @tsv' | column -t -s $'\\\
    t'\n• Expected output: RBAC subjects should primarily use SUBJECT_KIND of Group\nwith approved Google Group email addresses\
    \ that are nested under gkesecurity-groups@DOMAIN. Direct User bindings should be reviewed and\nremoved unless there is\
    \ a documented exception. Google Group names used in\nRBAC bindings are case sensitive and must match exactly."
  remediation: "Enable Google Groups for RBAC when the audit shows that\nauthenticatorGroupsConfig.enabled is not true, or\
    \ when securityGroup is\nmissing or incorrect. The required security group must be named gke-securitygroups@DOMAIN, and\
    \ approved access groups should be nested under that security\ngroup before they are referenced in Kubernetes RBAC bindings.\n\
    gcloud container clusters update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --security-group=gke-security-groups@$DOMAIN\n\
    After Google Groups for RBAC is enabled, update Kubernetes RoleBinding and\nClusterRoleBinding objects to reference approved\
    \ Google Groups as kind: Group\nsubjects. Replace direct User bindings with group based bindings where practical, while\n\
    preserving required ServiceAccount bindings for workloads, controllers, and\nautomation.\nReview the RBAC table from the\
    \ audit and remediate findings as follows:\n• Replace unnecessary SUBJECT_KIND values of User with approved Group\nsubjects.\n\
    • Confirm each Google Group referenced in RBAC is nested under gkesecurity-groups@DOMAIN.\n• Confirm group names match\
    \ exactly because Google Group references in RBAC\nare case sensitive.\n• Remove direct user bindings only after validating\
    \ that equivalent group based\naccess is working.\n• Test access for representative users with kubectl auth can-i before\
    \ removing\nexisting access paths.\nRerun the audit commands and confirm that Google Groups for RBAC is enabled, the\n\
    configured security group is correct, and Kubernetes RBAC bindings use approved\nGoogle Groups instead of direct individual\
    \ user binding."
  checks:
  - type: manual_review
    info: "Review the GKE Autopilot cluster and verify that Google Groups for RBAC is enabled\nand configured with the required\
      \ security group. Google Groups for RBAC lets\nKubernetes RBAC permissions be assigned to Google Groups managed in Google\n\
      Workspace or Cloud Identity, rather than binding access directly to individual user email\naddresses.\ngcloud container\
      \ clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format json | jq '{\n\
      \    enabled: .authenticatorGroupsConfi"
    severity: medium
- id: 5.6.1
  title: Use CMEK protected StorageClasses for GKE Persistent Disk volumes
  scoring: manual
  profile:
  - Level 2
  description: Use CMEK protected StorageClass objects for GKE Autopilot Persistent Disk volumes so newly provisioned Persistent
    Disks are encrypted with an approved Cloud KMS key. This applies to dynamically provisioned Persistent Disk volumes that
    use the Compute Engine Persistent Disk CSI driver and the disk-encryption-kms-key parameter.
  rationale: Persistent Disks are encrypted at rest by default, but CMEK gives the organization direct control over the Cloud
    KMS key used to protect the disk encryption keys. This supports stronger key governance, including key access control,
    rotation, separation of duties, and the ability to disable key use when required by security or compliance processes.
    Using a CMEK protected StorageClass helps ensure that new Persistent Disk volumes created by Kubernetes are encrypted
    consistently with approved key material. The disk-encryption-kms-key value must reference the fully qualified Cloud KMS
    key resource, and the key ring location must align with the cluster location requirements.
  impact: CMEK protection applies to new Persistent Disks created through the CMEK enabled StorageClass, it does not retroactively
    change existing disks. The disk-encryptionkms-key parameter cannot be added to an existing StorageClass, so the StorageClass
    must be recreated or replaced if CMEK was not included. The Compute Engine service agent for the cluster project must
    have roles/cloudkms.cryptoKeyEncrypterDecrypter on the key, and CMEK protection cannot be removed from an existing Persistent
    Disk except by creating a new disk from a snapshot with different encryption settings.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/using-cmek
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/persistentvolumes/gce-pd-csi-driver
  page_start: 110
  audit_raw: "Review GKE Autopilot StorageClass objects and verify that Persistent Disk classes\nuse the Compute Engine Persistent\
    \ Disk CSI driver with an approved Cloud KMS key.\nThe disk-encryption-kms-key parameter should contain the fully qualified\
    \ Cloud\nKMS key resource path used to encrypt newly provisioned Persistent Disk volumes.\nkubectl get storageclass -o\
    \ json | jq '.items[] |\nselect(.provisioner==\"pd.csi.storage.gke.io\") | {\n  name: .metadata.name,\n  provisioner:\
    \ .provisioner,\n  kmsKey: .parameters.\"disk-encryption-kms-key\"\n}'\n• Expected output: Each approved Persistent Disk\
    \ StorageClass used for\nsensitive workloads should show pd.csi.storage.gke.io as the provisioner\nand a non null kmsKey\
    \ value that matches an approved Cloud KMS key. If\nkmsKey is null, blank, missing, or does not reference an approved\
    \ key, newly\nprovisioned Persistent Disk volumes using that StorageClass are not configured\nfor CMEK.\nIdentify existing\
    \ PersistentVolumes and review the associated StorageClass and\nunderlying disk reference.\nkubectl get pv -o json | jq\
    \ -r '.items[] | [.metadata.name,\n.spec.storageClassName, .spec.csi.volumeHandle] | @tsv'\n• Expected output: PersistentVolumes\
    \ backed by GKE Persistent Disk should\nreference an approved CMEK protected StorageClass. The volumeHandle\nvalue should\
    \ identify the underlying Compute Engine disk used for the\nPersistentVolume.\nFor each Persistent Disk identified, verify\
    \ that the disk is encrypted with the approved\nCloud KMS key.\ngcloud compute disks describe $DISK_NAME \\\n  --zone\
    \ $ZONE \\\n  --project $PROJECT_ID \\\n  --format='value(diskEncryptionKey.kmsKeyName)'\n• Expected output: the command\
    \ should return the approved Cloud KMS key\nname. If the result is empty or null, the Persistent Disk is not encrypted\
    \ with\nCMEK."
  remediation: 'Remediate any StorageClass or Persistent Disk that does not use an approved Cloud

    KMS key. CMEK for GKE Autopilot Persistent Disk volumes is applied through a CMEK

    protected StorageClass for new dynamically provisioned volumes. Existing Persistent

    Disks cannot be converted to CMEK in place, so noncompliant volumes must be

    replaced or migrated.

    • Grant the Compute Engine service agent for the cluster project

    roles/cloudkms.cryptoKeyEncrypterDecrypter on the approved Cloud KMS

    key.

    • Create a new CMEK protected StorageClass using the Persistent Disk CSI

    driver, pd.csi.storage.gke.io, and the approved disk-encryption-kms-key

    value.

    • Update new PersistentVolumeClaims to use the CMEK protected

    StorageClass. If this should be the default storage option, mark the CMEK

    protected StorageClass as the default only after validating the key, location, and

    access permissions.

    • For existing PersistentVolumes that do not return an approved

    diskEncryptionKey.kmsKeyName, provision a new CMEK protected Persistent

    Disk through the approved StorageClass, migrate the data, update the workload

    to use the new PersistentVolumeClaim, and retire the old volume after

    validation.

    • Rerun the audit commands and confirm that the StorageClass includes the

    approved disk-encryption-kms-key, the PersistentVolumes reference the

    expected StorageClass, and the underlying Compute Engine disks return the

    approved Cloud KMS key.'
  checks:
  - type: sql
    command: show pd.csi.storage.gke.io as the provisioner
    severity: medium
    info: 'Review GKE Autopilot StorageClass objects and verify that Persistent Disk classes

      use the Compute Engine Persistent Disk CSI driver with an approved Cloud KMS key.

      The disk-encryption-kms-key parameter should contain the fully qualified Cloud

      KMS key resource path used to encrypt newly provisioned Persistent Disk volumes.

      kubectl get storageclass -o json | jq ''.items[] |

      select(.provisioner=="pd.c'
- id: 5.7.1
  title: Enable the GKE security posture dashboard for cluster security insights
  scoring: scored
  profile:
  - Level 2
  description: Enable the GKE security posture dashboard to surface cluster and workload security insights, including workload
    configuration auditing, actionable security concerns, and security bulletin related findings. The dashboard provides a
    centralized view of security posture findings so teams can identify, prioritize, and remediate issues across eligible
    GKE clusters and workloads.
  rationale: The GKE security posture dashboard helps identify workload and cluster configuration risks during runtime by
    scanning Kubernetes workloads for security concerns and presenting actionable findings in the Google Cloud console. This
    improves visibility into misconfigurations, risky workload settings, and security concerns that might otherwise require
    manual review across namespaces, manifests, and clusters. Security posture findings can support operational review, remediation
    tracking, and security governance across individual clusters or fleets.
  impact: Enabling the GKE security posture dashboard is an observability and assessment control, so it does not directly
    block workload deployment or change running workloads. Findings still require review, prioritization, and remediation
    by the platform or application teams. Large clusters can also hit finding limits for workload configuration auditing,
    so teams should monitor dashboard coverage and use Cloud Logging when additional investigation is required.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-securityposture-dashboard
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/aboutconfiguration-scanning
  page_start: 115
  audit_raw: "Define three variables for Cluster Name, Location, and Project, then review the cluster\nsecurity posture configuration.\n\
    gcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format\
    \ json | jq '.securityPostureConfig'\n• Expected output: mode should return BASIC. The vulnerabilityMode value\nmight\
    \ return VULNERABILITY_DISABLED, which is acceptable for this control\nbecause the control is focused on the GKE security\
    \ posture dashboard and\nworkload configuration auditing, not deprecated workload vulnerability scanning.\n{\n  \"mode\"\
    : \"BASIC\",\n  \"vulnerabilityMode\": \"VULNERABILITY_DISABLED\"\n}\nIf mode is DISABLED, MODE_UNSPECIFIED, null, blank,\
    \ or missing, the GKE security\nposture dashboard is not enabled for workload configuration auditing and should be\nremediated."
  remediation: "Enable the GKE security posture dashboard for workload configuration auditing when\nthe audit shows that securityPostureConfig.mode\
    \ is not BASIC. GKE supports\nenabling configuration auditing on existing clusters by setting the security posture mode\n\
    to standard, which maps to BASIC in the cluster configuration.\ngcloud container clusters update $CLUSTER_NAME \\\n  --location\
    \ $LOCATION \\\n  --project $PROJECT_ID \\\n  --security-posture=standard\nFor new clusters, include --security-posture=standard\
    \ during cluster creation when\nthis setting must be explicitly enforced. Rerun the audit command and confirm that\nsecurityPostureConfig.mode\
    \ returns BASIC. Initial configuration audit results can\ntake up to 30 minutes to appear in the security posture dashboard\
    \ and related logs."
  checks:
  - type: manual_review
    info: "Define three variables for Cluster Name, Location, and Project, then review the cluster\nsecurity posture configuration.\n\
      gcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format\
      \ json | jq '.securityPostureConfig'\n• Expected output: mode should return BASIC. The vulnerabilityMode value\nmight\
      \ return VULNERABILITY_DISABLED, which is acceptable for this control\nbecause the control is focused on the GKE security\
      \ posture dashboard and\nworkload con"
    severity: medium
