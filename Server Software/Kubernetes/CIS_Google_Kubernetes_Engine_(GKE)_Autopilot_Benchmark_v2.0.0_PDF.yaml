  remediation: 'Remove any non-default binding tosystem:authenticate identified in the audit and

    replace it with explicit, least privilege access for specific authenticated subjects. Do not

    remove the expected default ClusterRoleBindings system:basic-user,

    system:discovery, or system:public-info-viewer. RBAC permissions should be

    granted through defined users, groups, or service accounts rather than the broad

    system:authenticated group.

    • Review each non-default RoleBinding or ClusterRoleBinding returned by the

    audit and identify the referenced Role or ClusterRole.

    • Determine the specific API groups, resources, verbs, and namespace scope

    required for the affected users, tools, or automation.

    • Create or update a least privilege Role or ClusterRole that grants only the

    required access.

    • Bind the replacement role to a specific user, Google Group, IAM service account,

    or Kubernetes service account.

    • Delete the unsafe non-default binding to system:authenticated only after

    replacement access is validated.

    kubectl delete clusterrolebinding <clusterrolebinding-name>

    kubectl delete rolebinding <rolebinding-name> -n $NAMESPACE'
  checks:
  - type: manual_review
    info: 'Review all RoleBinding and ClusterRoleBinding objects to confirm that RBAC

      permissions are not assigned to the system:authenticated group outside of expected

      default system bindings. This group represents all authenticated Kubernetes API

      requests, so custom bindings can grant access to a broader audience than intended.

      RBAC permissions should be assigned to specific users, groups, or service accounts

      using least privilege.

      Check for bindings to system:authenticated:

      kubectl get rolebindings,clus'
