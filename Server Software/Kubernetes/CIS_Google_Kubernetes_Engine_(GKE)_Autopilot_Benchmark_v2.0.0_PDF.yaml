- id: 5.4.2
  title: Restrict GKE control plane access with authorized networks
  scoring: scored
  profile:
  - Level 2
  description: Restrict GKE Autopilot control plane access by enabling authorized networks for IP based control plane endpoints
    and allowing only approved CIDR ranges. This reduces exposure of the Kubernetes API server by limiting which source IP
    ranges can reach the control plane over the configured IP endpoint.
  rationale: GKE control plane access can use DNS based endpoints and IP based endpoints. When IP based endpoints are enabled,
    authorized networks provide an IP based access control layer that limits control plane reachability to approved CIDR ranges.
    Without authorized networks, the control plane IP endpoint can be reachable from any external IP address, including public
    internet addresses and Google Cloud external IP addresses, subject to authentication and authorization. Restricting access
    to approved CIDR ranges reduces the control plane attack surface and helps protect the Kubernetes API server if credentials,
    certificates, or automation tokens are exposed. For stronger control plane isolation, authorized networks should be combined
    with private endpoint configuration where appropriate, denial of broad Google Cloud external IP access, and IAM based
    authentication controls.
  impact: Misconfigured authorized networks can block administrators, CI/CD systems, bastion hosts, VPN ranges, or node related
    network paths from reaching the control plane. Before enabling or tightening authorized networks, confirm all approved
    administrative and automation source CIDR ranges are included, and update the allowed ranges when trusted network paths
    change. If subnet primary IP ranges are expanded, the authorized networks configuration may also need to be updated so
    new nodes can continue to register with the control plane.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/networkisolation
  page_start: 92
  audit_raw: "Review the GKE Autopilot cluster and verify that control plane authorized networks are\nconfigured to restrict\
    \ access to approved CIDR ranges.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project\
    \ $PROJECT_ID \\\n  --format json | jq '.masterAuthorizedNetworksConfig'\nExpected output should show the following:\n\
    {\n  \"enabled\": true,\n  \"cidrBlocks\": [\n    {\n      \"cidrBlock\": \"203.0.113.0/24\",\n      \"displayName\":\
    \ \"approved-admin-range\"\n    }\n  ],\n  \"gcpPublicCidrsAccessEnabled\": false\n}\nReview the command line statement\
    \ for the following:\n• enabled should be true, indicating authorized networks are enabled for the\ncontrol plane.\n•\
    \ cidrBlocks should list only approved trusted source ranges, such as\nadministrative, bastion, VPN, CI/CD, or automation\
    \ networks.\n• gcpPublicCidrsAccessEnabled should be false unless access from Google\nCloud external IP ranges is explicitly\
    \ approved.\n• If the output only shows gcpPublicCidrsAccessEnabled: false, authorized\nnetworks are not fully configured\
    \ for this control because no approved CIDR\nranges are listed.\n• If the output is null, {}, missing enabled: true, missing\
