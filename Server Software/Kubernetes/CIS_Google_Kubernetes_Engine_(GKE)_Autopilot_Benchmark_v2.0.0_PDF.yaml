- id: 5.4.1
  title: Enable VPC Flow Logs and Intranode Visibility
  scoring: scored
  profile:
  - Level 1
  description: Enable VPC Flow Logs on the subnet used by GKE Autopilot nodes and enable intranode visibility on the GKE cluster
    to improve visibility into Pod traffic. This combination allows network flow logging to include traffic between Pods,
    including traffic between Pods running on the same worker node.
  rationale: VPC Flow Logs capture network flow records for subnet traffic, but Pod to Pod traffic on the same node requires
    GKE intranode visibility so that the traffic is visible to the VPC network. Enabling both controls improves traffic observability
    for security monitoring, network troubleshooting, forensics, and validation of expected workload communication patterns.
    Without intranode visibility, traffic between Pods on the same node can bypass VPC level visibility, reducing the usefulness
    of VPC Flow Logs for Kubernetes east west traffic analysis. Intranode visibility sends Pod to Pod traffic on the same
    node through the VPC networking path, allowing VPC Flow Logs and other VPC features to observe that traffic.
  impact: Enabling intranode visibility on an existing GKE cluster restarts components in both the control plane and worker
    nodes, which can cause temporary disruption and should be planned during a maintenance window.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/intranode-visibility
  - 2. https://docs.cloud.google.com/vpc/docs/flow-logs
  page_start: 89
  audit_raw: "Review the GKE Autopilot cluster and verify that intranode visibility is enabled.\nIntranode visibility is enabled\
    \ at the cluster level and makes Pod to Pod traffic on the\nsame node visible to the VPC network path so VPC Flow Logs\
    \ can capture that traffic.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project\
    \ $PROJECT_ID \\\n  --format json | jq '.networkConfig.enableIntraNodeVisibility'\n• Expected output: true. If the result\
    \ is false, blank, or missing, intranode\nvisibility is not enabled for the cluster and should be remediated.\nIdentify\
    \ the subnet used by the GKE Autopilot cluster so the VPC Flow Logs\nconfiguration can be reviewed for the correct network\
    \ path. GKE clusters use a VPC\nsubnet for node and Pod networking, and VPC Flow Logs must apply to that subnet to\nprovide\
    \ network flow visibility for the cluster.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION\
    \ \\\n  --project $PROJECT_ID \\\n  --format='value(subnetwork)'\nUse the subnet returned by the command as $SUBNET_NAME,\
    \ and confirm the subnet\nregion is set as $REGION.\nReview the subnet used by the GKE Autopilot cluster and verify that\
    \ VPC Flow Logs are\nenabled.\ngcloud compute networks subnets describe $SUBNET_NAME \\\n  --region $REGION \\\n  --project\
    \ $PROJECT_ID \\\n  --format='value(enableFlowLogs)'\n• Expected output: true. If the result is false, blank, or missing,\
    \ VPC Flow Logs\nare not enabled for the subnet and should be remediated."
  remediation: "Enable intranode visibility on the GKE Autopilot cluster when the audit shows that\nnetworkConfig.enableIntraNodeVisibility\
    \ is not true. Enabling intranode\nvisibility makes Pod to Pod traffic on the same node visible to the VPC network path\
    \ so\nit can be captured by VPC Flow Logs and other VPC features. Plan the change during\nan approved maintenance window\
    \ because enabling intranode visibility on an existing\ncluster can restart components in the control plane and worker\
    \ nodes.\ngcloud container clusters update $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n \
    \ --enable-intra-node-visibility\nAfter intranode visibility is enabled, review the subnet used by the GKE Autopilot cluster\n\
    and confirm that VPC Flow Logs are enabled for that subnet. VPC Flow Logs are\nconfigured at the subnet level, while intranode\
    \ visibility is configured at the cluster level,\nso both settings must be in place for complete network flow visibility.\n\
