    severity: medium
- id: 4.4.1
  title: Use Secret Manager for external workload secret storage
  scoring: manual
  profile:
  - Level 2
  description: Use Secret Manager as the preferred external storage and management service for workload secrets used by GKE
    Autopilot clusters. Workloads should access secrets through Secret Manager API calls using Workload Identity Federation
    for GKE, or through mounted volumes using the Secret Manager add-on when file based access is required.
  rationale: Kubernetes Secrets are supported, but they require careful control through Kubernetes RBAC, namespace boundaries,
    encryption, and workload configuration. Storing sensitive values in Secret Manager centralizes secret lifecycle management
    outside the cluster and supports IAM based access control, auditability, rotation, and version management. Workload Identity
    Federation for GKE lets workloads access Secret Manager without static service account keys and allows access to be granted
    to specific Kubernetes ServiceAccounts.
  impact: Applications might require code, deployment, or configuration changes to retrieve secrets from Secret Manager or
    mounted files instead of relying directly on Kubernetes Secrets. Admins must configure applications to use Workload Identity
    Federation for GKE, grant the correct IAM permissions to the workload identity, validate secret access during startup
    and rotation, and update operational procedures for versioning, access review, and troubleshooting.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/workloadidentity-secrets
  page_start: 51
  audit_raw: "Review the GKE Autopilot secrets implementation and verify that sensitive workload\nsecrets are stored in Secret\
    \ Manager where external secret storage is required, rather\nthan relying only on native Kubernetes Secrets. Confirm whether\
    \ workloads access\nSecret Manager through direct API calls with Workload Identity Federation for GKE, or\nthrough mounted\
    \ files using the Secret Manager add-on and SecretProviderClass\nresources.\nSecret Manager access from GKE workloads\
    \ can use Workload Identity Federation for\nGKE without static service account keys, and the Secret Manager add-on supports\n\
    mounting Secret Manager secrets into Pods as files.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location\
    \ $LOCATION \\\n  --project $PROJECT_ID \\\n  --format=\"yaml(workloadIdentityConfig.workloadPool,secretManagerConfig)\"\
    \nSample output should look like this:\n• Workload Identity Federation for GKE for Secret Manager API access\n• Secret\
    \ Manager add-on with rotation enabled for mounted file access\nsecretManagerConfig:\n  enabled: true\n  rotationConfig:\n\
    \    enabled: true\nworkloadIdentityConfig:\n  workloadPool: gke-for-cis.svc.id.goog\nInterpretation:\n• workloadIdentityConfig.workloadPool\
    \ populated means Workload Identity\nFederation for GKE is enabled.\n• secretManagerConfig.enabled: true means the Secret\
    \ Manager add-on is\nenabled for mounting Secret Manager secrets as files.\n• rotationConfig.enabled: true means mounted\
    \ secrets can be refreshed\nthrough the add-on rotation configuration.\nFor any workload still using Kubernetes Secrets\
    \ for sensitive values, confirm whether\nthere is a documented reason, whether RBAC access is limited, and whether migration\n\
    to Secret Manager is planned. Also validate that Secret Manager IAM permissions are\ngranted only to the required workload\
    \ identities, because Workload Identity Federation\nfor GKE does not grant Google Cloud API permissions by itself."
  remediation: 'Move externally managed workload secrets to Secret Manager and update GKE

    workloads to access them through Workload Identity Federation for GKE. Prefer direct

    Secret Manager API access through Google Cloud client libraries where the application

    supports it. For applications that require file based secret access, enable the Secret

    Manager add-on and mount secrets into Pods using SecretProviderClass and CSI

    volumes.

    • Configure applications to use Workload Identity Federation for GKE for Secret

    Manager access.

    • Use dedicated Kubernetes ServiceAccounts for workloads that need Secret

    Manager access.

    • Grant least privilege Secret Manager IAM permissions only to the required

    workload identities.

    • Enable the Secret Manager add-on when workloads need secrets mounted as

    files.

    • Migrate sensitive values out of Kubernetes Secrets where practical, then remove

    unused in-cluster Secret objects.

    Secret Manager provides centralized secret management features such as fine grained

    access control, managed rotation, lifecycle management, and audit logs.'
  checks:
  - type: manual_review
    info: 'Review the GKE Autopilot secrets implementation and verify that sensitive workload

      secrets are stored in Secret Manager where external secret storage is required, rather

      than relying only on native Kubernetes Secrets. Confirm whether workloads access

      Secret Manager through direct API calls with Workload Identity Federation for GKE, or

      through mounted files using the Secret Manager add-on and SecretProviderClass

      resources.

      Secret Manager access from GKE workloads can use Workload Identity Federat'
    severity: medium
- id: 4.5.1
  title: Enforce image provenance using Binary Authorization for GKE
  scoring: manual
  profile:
  - Level 2
  description: Use Binary Authorization for GKE to enforce image provenance and deploy time trust policies before container
    images are admitted to the GKE Autopilot cluster. Policies should allow only approved images, trusted registries, or images
    with required attestations from approved build, security, or release processes.
  rationale: Binary Authorization provides centralized policy enforcement for GKE deployments by evaluating container images
    at deploy time. When attestation based rules are used, the policy verifies that an image digest has been signed by a trusted
    attestor before the workload is allowed to run. This helps prevent unapproved, unsigned, unverified, or noncompliant images
    from being deployed, even if a user or pipeline has permission to create Kubernetes workloads.
  impact: Enforcing Binary Authorization can block deployments that do not match the configured policy, including images missing
    required attestations or images from unapproved sources.
  references:
  - 1. https://docs.cloud.google.com/binary-authorization/docs/creating-cluster
  - 2. https://docs.cloud.google.com/binary-authorization/docs/configure-policy-gke
  page_start: 55
  audit_raw: 'Review the GKE Autopilot cluster and confirm that Binary Authorization enforcement is

    enabled and confirm it does not simply allow all images and that it requires approved

    images, trusted registries, or attestations from trusted attestors where appropriate.

    Binary Authorization works with GKE clusters, including Autopilot clusters, and

    evaluates the configured policy at deploy time.'
  remediation: 'Enable Binary Authorization enforcement for the GKE Autopilot cluster and configure

    the policy to block unapproved images at deploy time. Use approved image rules,

    trusted registries, or attestation based requirements aligned to the build, security scan,

    and release approval process. Validate the policy in dry run or a lower environment

    before enforcing broadly in production.'
  checks:
  - type: manual_review
    info: 'Review the GKE Autopilot cluster and confirm that Binary Authorization enforcement is

      enabled and confirm it does not simply allow all images and that it requires approved

      images, trusted registries, or attestations from trusted attestors where appropriate.

      Binary Authorization works with GKE clusters, including Autopilot clusters, and

      evaluates the configured policy at deploy time.'
    severity: medium
- id: 4.6.1
  title: Use namespaces to separate workload administration and resource governance
  scoring: manual
  profile:
  - Level 1
  description: Use dedicated namespaces to separate GKE Autopilot workloads by application, team, environment, or tenant.
    Namespaces provide a logical boundary for organizing resources and applying namespace level governance, but they should
    be paired with access, quota, network, and pod security controls.
  rationale: Namespaces help reduce administrative risk by limiting where users and workloads operate inside the cluster.
    GKE supports namespace restricted access patterns where IAM and Kubernetes RBAC work together, and RBAC should grant permissions
    in as few namespaces as possible using Roles and RoleBindings where practical. This reduces the blast radius of mistakes,
    unauthorized changes, and overly broad operational access. Dedicated namespaces also make it easier to apply workload
    governance consistently, including ResourceQuotas, NetworkPolicies, Pod Security labels, ownership labels, and environment
    specific deployment rules. Workloads should not be placed in the default namespace for production because shared use can
    increase naming collisions, resource contention, weak access separation, and cleanup complexity.
  impact: Admins must specify the correct namespace when deploying, troubleshooting, and granting access to workloads. Namespace
    based administration can require additional RBAC bindings, quotas, labels, NetworkPolicies, and operational standards,
    but it improves ownership, access control, and resource governance across shared GKE Autopilot clusters.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/isolate-workloadsdedicated-namespaces
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/multitenancyoverview
  page_start: 58
  audit_raw: 'Run the following command and review the namespaces created in the cluster:

    kubectl get namespaces --show-labels

    Verify that user workloads are placed in dedicated namespaces based on application,

    environment, or tenant, rather than being deployed into the default namespace. In

    addition, confirm that each workload namespace has both ownership and appropriate

    namespace level controls, such as RBAC RoleBindings, ResourceQuotas,

    NetworkPolicies, and Pod Security labels where required.

    Review namespace access to confirm that users and groups are granted only the

    namespace level permissions they need. Prefer namespace level Roles and

    RoleBindings, rather than broad cluster wide access.'
  remediation: 'Create dedicated namespaces for GKE Autopilot workloads based on application,

    environment, or tenant boundaries. Move production workloads out of the default

    namespace and apply consistent namespace level governance so administration,

    access, and resource controls are easier to manage.

    • Create a dedicated namespace before deploying new application resources.

    • Move production workloads out of the default namespace where applicable.

    • Apply namespace labels for owner, application, environment, tenant, and cost

    allocation.

    • Configure least privilege RBAC using namespace level Roles and RoleBindings

    where possible.

    • Apply ResourceQuotas, NetworkPolicies, and Pod Security labels based on

    workload risk and governance requirements.

    Review namespaces, owners, workload placement, and access bindings to confirm that

    the namespace model still matches current application and environment boundaries.'
  checks:
  - type: manual_review
    info: 'Run the following command and review the namespaces created in the cluster:

      kubectl get namespaces --show-labels

      Verify that user workloads are placed in dedicated namespaces based on application,

      environment, or tenant, rather than being deployed into the default namespace. In

      addition, confirm that each workload namespace has both ownership and appropriate

      namespace level controls, such as RBAC RoleBindings, ResourceQuotas,

      NetworkPolicies, and Pod Security labels where required.

      Review namesp'
    severity: medium
- id: 4.6.2
  title: Rely on Autopilot RuntimeDefault seccomp; custom profiles are unsupported
  scoring: manual
  profile:
  - Level 2
  description: GKE Autopilot automatically applies the RuntimeDefault seccomp profile to workload Pods, so custom seccomp
    profile configuration is not required for normal workloads. Custom Localhost seccomp profiles are not supported in Autopilot
    because GKE manages the nodes, and GKE Sandbox Pods use sandbox isolation as the security boundary instead of Pod specified
    seccomp rules.
  rationale: Seccomp reduces container risk by limiting the Linux system calls that container processes can make to the node
    kernel. In Autopilot, GKE applies the containerd default seccomp profile automatically, which provides baseline hardening
    while maintaining compatibility with most workloads. The default profile blocks selected syscalls that can be used to
    bypass container isolation or gain privileged access to the node. Because Autopilot nodes are managed by GKE, custom node
    level seccomp profiles are not a supported hardening path. Workloads should rely on the Autopilot applied RuntimeDefault
    profile unless there is a documented exception, such as a workload that explicitly requires Unconfined or a GKE Sandbox
    workload where seccomp rules in the Pod manifest are ignored.
  impact: Applications that attempt restricted syscalls might fail to start or might experience runtime errors when the Autopilot
    applied seccomp profile blocks those syscalls. Workloads that require custom Localhost profiles must be redesigned for
    Autopilot or run in a platform that supports custom seccomp profile management. Using Unconfined reduces syscall filtering
    and should be limited to documented exceptions.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/seccomp-in-gke
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
