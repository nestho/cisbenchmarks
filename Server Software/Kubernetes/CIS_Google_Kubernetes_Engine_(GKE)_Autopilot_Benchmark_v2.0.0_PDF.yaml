    namespace level governance, including RBAC RoleBindings, ResourceQuotas,

    NetworkPolicies, and Pod Security labels where required.'
  remediation: 'Create dedicated namespaces for GKE Autopilot workloads based on application,

    environment, or tenant boundaries, then migrate application resources out of the

    default namespace. Make updates so all workload resources explicitly specify the new

    target namespace. After migration, apply appropriate namespace level governance,

    including RBAC, ResourceQuotas, NetworkPolicies, Pod Security labels, and ownership

    labels.'
