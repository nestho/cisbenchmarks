- id: 4.1.8
  title: Avoid binding RBAC roles to unauthenticated users and groups
  scoring: scored
  profile:
  - Level 2
  description: Avoid non-default RoleBinding or ClusterRoleBinding objects that grant permissions to the system:anonymous
    user or the related system:unauthenticated group. These subjects represent unauthenticated Kubernetes API requests and
    should not receive additional RBAC access to cluster resources.
  rationale: Kubernetes uses system:anonymous for requests that do not provide authentication credentials, and unauthenticated
    requests can also be associated with the system:unauthenticated group. Binding RBAC roles to either subject can grant
    unauthenticated callers access to Kubernetes API resources. This is especially risky if the binding includes broad roles,
    wildcard permissions, Secret access, workload access, or namespace wide permissions. GKE can limit anonymous authentication
    so unauthenticated requests are rejected for non health check endpoints before RBAC evaluation. In supported GKE versions,
    this control can restrict anonymous requests to Kubernetes API server health check endpoints such as /healthz, /livez,
    and /readyz. Even with that protection available, RBAC bindings to system:anonymous or system:unauthenticated should be
    avoided because they create unnecessary exposure and undermine least privilege access.
  impact: Removing non-default bindings to system:anonymous or system:unauthenticated can affect workloads, scripts, or integrations
    that incorrectly rely on unauthenticated Kubernetes API access. Before removal, validate that required access uses an
    authenticated user, group, or service account with least privilege RBAC permissions.
  references:
  - 1. https://kubernetes.io/docs/reference/access-authn-authz/rbac/#discovery-roles
  page_start: 39
  audit_raw: 'Review all RoleBinding and ClusterRoleBinding objects to confirm that RBAC

    permissions are not assigned to the system:anonymous user and

    system:unauthenticated group through non-default bindings. These subjects

    represent unauthenticated Kubernetes API requests, and any non-default binding to

    them can expose cluster resources without authenticated access. Include both cluster

    wide and namespace level bindings, then review any matching role reference to

    determine the exact permissions granted. Kubernetes RBAC is enabled by default in

    GKE and controls access through Role, ClusterRole, RoleBinding, and

    ClusterRoleBinding objects.

    Check for bindings to system:anonymous:

