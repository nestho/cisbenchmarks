- id: 5.1.3
  title: Enforce Binary Authorization for trusted GKE container image deployments
  scoring: scored
  profile:
  - Level 2
  description: Use Binary Authorization to enforce trusted image deployment policies for GKE Autopilot clusters. The policy
    should allow only approved container images to be deployed, based on defined admission rules such as approved image locations,
    trusted build or promotion processes, and required signed approvals where appropriate. Binary Authorization works with
    both Autopilot and Standard clusters.
  rationale: Unrestricted image deployment can allow users or automation pipelines to run unapproved, vulnerable, tampered,
    or externally sourced images in the cluster. Binary Authorization integrates with GKE admission control to evaluate container
    images before deployment and enforce centrally managed policy decisions, such as requiring an image to come from an approved
    registry path or requiring a signed approval that verifies the image passed required build, scan, approval, or release
    controls.
  impact: Enforcing Binary Authorization can block workloads that do not meet the defined image trust policy, including images
    from unapproved registry locations or images that are missing required signed approvals.
  references:
  - 1. https://docs.cloud.google.com/binary-authorization/docs/configure-policy-gke
  - 2. https://docs.cloud.google.com/binary-authorization/docs/creating-cluster
  page_start: 77
  audit_raw: "Review the GKE Autopilot cluster configuration and verify that Binary Authorization\nenforcement is enabled\
    \ for trusted container image deployments. Define the cluster\nname, location, and project, then check the cluster Binary\
    \ Authorization evaluation\nmode.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID\
    \ \\\n  --format='value(binaryAuthorization.evaluationMode)'\n• Expected output: The output should be PROJECT_SINGLETON_POLICY_ENFORCE\n\
    or POLICY_BINDINGS_AND_PROJECT_SINGLETON_POLICY_ENFORCE. A monitoring\nonly mode does not enforce trusted image deployment\
    \ and should not be\nconsidered compliant for this control.\nExport the Binary Authorization policy and review the default\
    \ admission rule and any\ncluster specific admission rules that apply to the GKE cluster.\ngcloud container binauthz policy\
    \ export \\\n  --project=$PROJECT_ID > current-policy.yaml\nReview the policy file and verify that the default rule is\
    \ not configured to allow all\nimages. The default Binary Authorization policy allows all images, so\ndefaultAdmissionRule.evaluationMode:\
    \ ALWAYS_ALLOW should be changed for\nproduction enforcement.\ndefaultAdmissionRule:\n  evaluationMode: ALWAYS_ALLOW\n\
    • Expected output: Production policies should use an enforcing rule such as\nREQUIRE_ATTESTATION with required signed\
    \ approvals, or another approved\nrule design that blocks untrusted images. The policy should use\nENFORCED_BLOCK_AND_AUDIT_LOG\
    \ for enforcement rather than\nDRYRUN_AUDIT_LOG_ONLY, which allows noncompliant images to deploy while\nlogging violations."
  remediation: "Enable Binary Authorization enforcement on the GKE Autopilot cluster when the audit\nshows that the cluster\
    \ is not using an enforcing evaluation mode. Use\nPROJECT_SINGLETON_POLICY_ENFORCE to enforce the project Binary Authorization\n\
    policy. If the cluster also uses continuous validation with policy bindings, use\nPOLICY_BINDINGS_AND_PROJECT_SINGLETON_POLICY_ENFORCE\
    \ instead. Monitoring\nonly modes should not be used as the remediation target for this control.\ngcloud container clusters\
    \ update $CLUSTER_NAME \\\n  --location=$LOCATION \\\n  --project=$PROJECT_ID \\\n  --binauthz-evaluation-mode=PROJECT_SINGLETON_POLICY_ENFORCE\n\
    Export the current Binary Authorization policy to a local YAML file. The trusted image\ndeployment rules are edited in\
    \ this policy file, not directly in the GKE cluster\nconfiguration.\ngcloud container binauthz policy export \\\n  --project=$PROJECT_ID\
    \ > policy.yaml\n• Edit policy.yaml and update the defaultAdmissionRule or the applicable rule\nunder clusterAdmissionRules\
    \ so that trusted image controls are enforced. For\nsigned approval based enforcement, set evaluationMode to\nREQUIRE_ATTESTATION\
    \ set enforcementMode to\nENFORCED_BLOCK_AND_AUDIT_LOG, and set requireAttestationsBy to the\napproved attestor resource.\n\
    defaultAdmissionRule:\n  evaluationMode: REQUIRE_ATTESTATION\n  enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG\n  requireAttestationsBy:\n\
    \  - projects/$PROJECT_ID/attestors/$ATTESTOR_NAME\nglobalPolicyEvaluationMode: ENABLE\n• Import the updated Binary Authorization\
    \ policy after review and approval.\ngcloud container binauthz policy import policy.yaml \\\n  --project=$PROJECT_ID\n\
    After remediation, test deployment behavior with both an approved image and an\nunapproved image. Approved images should\
    \ be admitted, while images that do not\nmeet the Binary Authorization policy should be blocked and logged."
  checks:
  - type: manual_review
    info: "Review the GKE Autopilot cluster configuration and verify that Binary Authorization\nenforcement is enabled for\
      \ trusted container image deployments. Define the cluster\nname, location, and project, then check the cluster Binary\
      \ Authorization evaluation\nmode.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location=$LOCATION \\\n\
      \  --project=$PROJECT_ID \\\n  --format='value(binaryAuthorization.evaluationMode)'\n• Expected output: The output should\
      \ be PROJECT_SINGLETON_POLICY_ENFORCE\nor POLICY_BIN"
    severity: medium
- id: 5.2.1
  title: Use a custom least privilege node service account for GKE Autopilot
  scoring: scored
  profile:
  - Level 2
  description: Use a custom least privilege IAM service account for GKE Autopilot nodes instead of the Compute Engine default
    service account. The node service account should have only the IAM permissions required for GKE system tasks, logging,
    monitoring, and approved image pulls. GKE recommends using a custom node service account because the Compute Engine default
    service account might have broader permissions than GKE requires.
  rationale: GKE uses IAM service accounts attached to nodes to perform system tasks such as logging and monitoring. At minimum,
    the node service account must have the Kubernetes Engine Default Node Service Account role, roles/container.defaultNodeServiceAccount,
    on the project. If the Compute Engine default service account is reused for other functions, it might accumulate broad
    IAM permissions that increase the risk of excessive access from the node identity. For GKE Autopilot, the node service
    account is configured at the cluster level instead of through user managed node pools. A custom node service account can
    be specified when the Autopilot cluster is created, but it cannot be changed on an existing Autopilot cluster after creation.
  impact: Using a custom least privilege node service account reduces the risk of excessive IAM access from GKE nodes, but
    missing required permissions can affect node registration, logging, monitoring, or image pulls. Existing Autopilot clusters
    that use the wrong node service account cannot be updated in place, so remediation may require creating a replacement
    cluster with the correct custom service account and migrating workloads.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/security/configure-nodeservice-accounts
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/creating-anautopilot-cluster
  page_start: 81
  audit_raw: "Review the GKE Autopilot cluster and verify that the cluster uses a custom node service\naccount instead of\
    \ the Compute Engine default service account.\ngcloud container clusters describe $CLUSTER_NAME \\\n  --location $LOCATION\
    \ \\\n  --project $PROJECT_ID \\\n  --format='table(name,nodeConfig.serviceAccount)'\n• Expected output: nodeConfig.serviceAccount\
    \ should show a custom IAM\nservice account, not the Compute Engine default service account. If the field is\nempty or\
    \ shows the project’s Compute Engine default service account, the\ncluster does not meet this control.\nReview the IAM\
    \ roles assigned to the node service account and verify that they are\nlimited to the permissions required for GKE node\
    \ operation and approved image pulls.\ngcloud projects get-iam-policy $PROJECT_ID \\\n  --flatten='bindings[].members'\
    \ \\\n  --filter='bindings.members:serviceAccount:$NODE_SERVICE_ACCOUNT' \\\n  --format='table(bindings.role)'\n• Expected\
