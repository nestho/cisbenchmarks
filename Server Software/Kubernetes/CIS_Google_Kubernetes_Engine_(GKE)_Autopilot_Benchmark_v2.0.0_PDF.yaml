controls:
- id: 4.1.1
  title: Ensure the cluster-admin ClusterRole is only used when required
  scoring: manual
  profile:
  - Level 1
  description: The RBAC cluster-admin ClusterRole grants full administrative authority across cluster resources and should
    be assigned only to approved users, groups, or service accounts with a documented operational need. For GKE Autopilot
    clusters, the control should focus on limiting RoleBinding and ClusterRoleBinding assignments to clusteradmin, not on
    removing or modifying the built in ClusterRole itself. GKE RBAC provides fine grained control over what users, groups,
    IAM service accounts, and Kubernetes ServiceAccounts can do inside the cluster.
  rationale: In GKE, Kubernetes RBAC uses Role, ClusterRole, RoleBinding, and ClusterRoleBinding objects to grant permissions
    to authenticated subjects, including users, groups, IAM service accounts, and Kubernetes ServiceAccounts. RBAC works alongside
    IAM in GKE, but Kubernetes RBAC is the appropriate mechanism for fine grained permissions on Kubernetes objects within
    a cluster or namespace. RBAC permissions are additive, so there are no deny rules to offset excessive access once a broad
    role is bound. The cluster-admin ClusterRole grants permission to do anything on any resource in the cluster. When assigned
    through a ClusterRoleBinding, it provides cluster wide administrative access across all namespaces. When assigned through
    a RoleBinding, the ClusterRole is limited to the namespace specified in the binding, but it still grants the broad permissions
    of cluster-admin within that namespace. Where full administrative access is not explicitly required, define a narrower
    Role or ClusterRole that grants only the required API groups, resources, and verbs.
  impact: 'Removing or modifying cluster-admin bindings without review can disrupt legitimate administrative, platform, or
    automation workflows. Before changing any binding, identify the subject, determine whether the access is still required,
    and replace broad access with least privilege RBAC where possible. Do not delete or modify RBAC resources with the system:
    prefix, because those resources support correct cluster functionality and improper changes can cause cluster instability
    or make the cluster inaccessible.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 18
  audit_raw: "Review all Kubernetes RBAC bindings that assign the cluster-admin ClusterRole.\nThis review should include ClusterRoleBinding\
    \ objects, which grant access across\nthe cluster, and namespaced RoleBinding objects, which can bind the cluster-admin\n\
    ClusterRole within a specific namespace.\nList all ClusterRoleBinding subjects bound to cluster-admin:\nkubectl get clusterrolebindings\
    \ -o json \\\n| jq -r '\n  [\"BINDING\", \"SUBJECT_KIND\", \"SUBJECT_NAME\", \"SUBJECT_NAMESPACE\"],\n  (\n    .items[]\n\
    \    | select(.roleRef.kind==\"ClusterRole\" and .roleRef.name==\"cluster-admin\")\n    | .metadata.name as $binding\n\
    \    | .subjects[]?\n    | [$binding, .kind, .name, (.namespace // \"-\")]\n  )\n  | @tsv\n' \\\n| column -t -s $'\\t'\n\
    List all namespaced RoleBinding subjects that bind the cluster-admin ClusterRole:\nkubectl get rolebindings -A -o json\
    \ \\\n| jq -r '\n  [\"NAMESPACE\", \"BINDING\", \"SUBJECT_KIND\", \"SUBJECT_NAME\",\n\"SUBJECT_NAMESPACE\"],\n  (\n  \
    \  .items[]\n    | select(.roleRef.kind==\"ClusterRole\" and .roleRef.name==\"cluster-admin\")\n    | .metadata.namespace\
    \ as $ns\n    | .metadata.name as $binding\n    | .subjects[]?\n    | [$ns, $binding, .kind, .name, (.namespace // \"\
    -\")]\n  )\n  | @tsv\n' \\\n| column -t -s $'\\t'\nReview each listed user, group, IAM service account, Kubernetes ServiceAccount,\
    \ and\nnamespace to confirm that cluster-admin access is explicitly required and documented."
  remediation: 'For each cluster-admin binding, replace broad access with a least privilege Role or

    ClusterRole that grants only the required API groups, resources, and verbs. Bind the

    replacement role to the approved user, group, IAM service account, or Kubernetes

    ServiceAccount first, validate access, and then remove the unnecessary clusteradmin binding.

    • Identify all ClusterRoleBinding and RoleBinding objects that assign the

    cluster-admin ClusterRole, including both cluster wide and namespace level

    bindings.

    • Review each bound user, group, IAM service account, or Kubernetes

    ServiceAccount to confirm whether full administrative access is still required and

    documented.

    • Replace cluster-admin access where possible with a least privilege Role or

    ClusterRole that grants only the required API groups, resources, and verbs.

    • Bind and validate the replacement permissions before removing the existing

    cluster-admin binding to avoid disrupting administrative, platform, or

    automation workflows.

    • Remove only confirmed unnecessary bindings, and avoid modifying RBAC

    resources with the system: prefix unless explicitly required and validated

    because they support cluster functionality.'
  checks:
  - type: manual_review
    info: "Review all Kubernetes RBAC bindings that assign the cluster-admin ClusterRole.\nThis review should include ClusterRoleBinding\
      \ objects, which grant access across\nthe cluster, and namespaced RoleBinding objects, which can bind the cluster-admin\n\
      ClusterRole within a specific namespace.\nList all ClusterRoleBinding subjects bound to cluster-admin:\nkubectl get\
      \ clusterrolebindings -o json \\\n| jq -r '\n  [\"BINDING\", \"SUBJECT_KIND\", \"SUBJECT_NAME\", \"SUBJECT_NAMESPACE\"\
      ],\n  (\n    .items[]\n    | select(.roleR"
    severity: medium
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Secrets can contain sensitive application credentials, configuration values, certificates, and legacy
    service account tokens. Access to these Secrets should be restricted to the smallest practical set of users, groups, service
    accounts, and workloads to reduce the risk of credential exposure, privilege escalation, and unauthorized access to cluster
    or external resources. GKE RBAC supports fine grained permissions over Kubernetes resources, and GKE Autopilot clusters
    still rely on Kubernetes RBAC to authorize access to Kubernetes API resources such as Secrets.
  rationale: Inappropriate access to Secrets stored in the cluster can allow an attacker to retrieve credentials used by applications,
    automation, or workloads, and then use those credentials to access Kubernetes resources or external systems. RBAC permissions
    for Secrets should be granted only through explicit Roles or ClusterRoles that define the required API group, resource,
    and verbs, such as get, list, watch, create, update, or delete. Wildcards should be avoided because they can unintentionally
    grant broader Secret access than intended. Where possible, workloads should use dedicated Kubernetes ServiceAccounts and
    least privilege bindings rather than shared or default service accounts. For access to Secret Manager or other Google
    Cloud APIs, Workload Identity Federation for GKE is preferred over storing long lived service account keys as Kubernetes
    Secrets, because it gives workloads fine grained access to Google Cloud APIs without relying on static credentials stored
    inside the cluster.
  impact: 'Removing Secret access without review can disrupt applications, controllers, operators, or platform workflows that
    legitimately require Secret read or management permissions. Before making changes, validate the subject, namespace, resource,
    and verb requirements, then replace broad access with least privilege RBAC where possible. Avoid modifying required system:
    RBAC roles or bindings because they support normal cluster functionality.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 21
  audit_raw: 'Review RBAC permissions that grant read access to Secrets in GKE Autopilot clusters.

    The audit should identify where get, list, or watch permissions on the core API

    secrets resource are defined, how those permissions are assigned through bindings,

    and which users, groups, or service accounts receive the access. The review should

    also account for broad default roles, wildcard rules, default groups, and shared or

    default service accounts, because these can unintentionally expose Secrets beyond the

    intended operational need. GKE Autopilot supports Kubernetes RBAC for cluster

    resource authorization, so Secret access should be reviewed through Role,

    ClusterRole, RoleBinding, and ClusterRoleBinding objects.

    • Review Role and ClusterRole objects that grant get, list, or watch access to the

    core API secrets resource.

    • Include wildcard rules such as resources: ["*"] or verbs: ["*"], because

    they can unintentionally grant Secret access.

    • Map Secret permissions to RoleBinding and ClusterRoleBinding objects to

    identify the actual users, groups, and service accounts with access.

    • Validate that each subject has a documented need for Secret access and that

    access is limited to the required namespace, resource, and verb.

    • Review broad roles such as cluster-admin, admin, and edit, default groups

    such as system:authenticated, and shared or default service accounts, but

    avoid modifying required system: RBAC resources unless explicitly validated.'
  remediation: 'Remediate Secret access by replacing broad or unnecessary RBAC permissions with

    narrowly defined access that supports only the required workload, user, or operational

    function. The remediation process should focus on reducing get, list, and watch

    permissions on the core API secrets resource, especially where access is inherited

    through broad roles, wildcard rules, shared service accounts, or default service

    accounts. Changes should be validated before removal to avoid disrupting applications,

    controllers, operators, or required platform services.

    • Remove unnecessary Secret access by updating or replacing RBAC roles that

    grant get, list, orwatch on secrets, especially where the access is inherited

    through wildcard resources or wildcard verbs.

    • Replace broad Secret permissions with least privilege Roles or ClusterRoles

    that grant only the required API group, resource, and verb. Avoid list and watch

    when a subject only needs to read a specific Secret.

    • Bind Secret access only to approved users, groups, or dedicated Kubernetes

    ServiceAccounts. Avoid binding Secret access to the default service account

    because Pods that do not explicitly specify a service account can inherit that

    access.

    • Move sensitive external credentials out of Kubernetes Secrets and use Secret

    Manager with Workload Identity Federation for GKE where the workload needs

    access to Google Cloud secrets or APIs.

    • Validate application, controller, operator, and platform workflows before removing

    access, and avoid modifying required ystem: RBAC resources because they

    support normal cluster functionality.'
  checks:
  - type: manual_review
    info: 'Review RBAC permissions that grant read access to Secrets in GKE Autopilot clusters.

      The audit should identify where get, list, or watch permissions on the core API

      secrets resource are defined, how those permissions are assigned through bindings,

      and which users, groups, or service accounts receive the access. The review should

      also account for broad default roles, wildcard rules, default groups, and shared or

      default service accounts, because these can unintentionally expose Secrets beyond the'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Roles and ClusterRoles define what actions users, groups, and Kubernetes service accounts can perform
    against Kubernetes API resources in GKE Autopilot clusters. Wildcard permissions should be minimized because the * character
    applies broadly across API groups, resources, or verbs and can grant more access than intended. Roles should explicitly
    define only the API groups, resources, and verbs required for the subject’s function. RBAC best practices advise avoiding
    wildcards and using least privilege role design.
  rationale: The principle of least privilege requires granting only the permissions needed to perform a specific task. Using
    * in RBAC rules can unintentionally grant broad access across current and future Kubernetes API capabilities, including
    new API groups, resources, verbs, or custom resources introduced into the cluster. For example, using * in the verbs field
    grants all actions, including patch, update, delete, and deletecollection, instead of only the specific actions required.
    In GKE Autopilot clusters, RBAC rules should be written with explicit API groups, resources, and verbs, and split into
    separate rules when different resources require different permissions. This prevents subjects from inheriting access to
    resources or actions they do not need and supports namespace level access control where possible.
  impact: 'Reducing wildcard use may require updates to existing RBAC roles and validation of affected users, workloads, controllers,
    and automation. Workflows that depend on broad permissions may fail until the required API groups, resources, and verbs
    are explicitly defined. This improves least privilege enforcement and reduces the risk of unintended access as APIs, resources,
    or CRDs are added. Avoid modifying required system: RBAC roles or bindings unless explicitly validated because they support
    correct cluster functionality.'
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 24
  audit_raw: "Review Kubernetes RBAC roles in GKE Autopilot clusters to identify wildcard\npermissions in Roles and ClusterRoles.\
    \ The audit should check for * in apiGroups,\nresources, or verbs, because wildcard permissions can unintentionally grant\
    \ access to\ncurrent or future Kubernetes APIs, resources, custom resources, or actions. After\nidentifying wildcard rules,\
    \ review the related RoleBinding and ClusterRoleBinding\nobjects to determine which users, groups, or Kubernetes service\
    \ accounts receive the\npermissions. RBAC access should be reviewed regularly and aligned to least privilege.\nRetrieve\
    \ Roles and ClusterRoles across all namespaces and review them for\nwildcard use:\nkubectl get roles,clusterroles -A -o\
    \ json \\\n| jq -r '\n  [\"KIND\", \"NAMESPACE\", \"NAME\"],\n  (\n    .items[]\n    | select(any(.rules[]?;\n       \
    \ ((.apiGroups // []) | index(\"*\")) or\n        ((.resources // []) | index(\"*\")) or\n        ((.verbs // []) | index(\"\
    *\"))\n      ))\n    | [.kind, (.metadata.namespace // \"cluster-wide\"), .metadata.name]\n  )\n  | @tsv\n' \\\n| column\
    \ -t -s $'\\t'\nDetermine whether each wildcard permission is required and documented.\n• Review verbs: [\"*\"], resources:\
    \ [\"*\"], and apiGroups: [\"*\"] because\neach can grant broad or unintended access.\n• Pay special attention to broad\
    \ roles such as cluster-admin, admin, and edit.\n• Review bindings to default groups, shared service accounts, and default\
    \ service\naccounts that may inherit wildcard access.\n• Avoid modifying required system: RBAC resources unless explicitly\
    \ required and\nvalidated.\nNote: If Policy Controller is enabled, K8sProhibitRoleWildcardAccess can help audit\nor enforce\
    \ restrictions on wildcard access in Roles and ClusterRoles."
  remediation: 'Replace wildcard permissions with explicit RBAC rules that define only the required API

    groups, resources, and verbs. Remediation should focus on preserving required access

    while removing broad * grants that could expand privileges as APIs, resources, or CRDs

    are added. Validate affected users, workloads, controllers, and automation before

    removing wildcard access. For GKE Autopilot clusters, remediation remains focused on

    Kubernetes RBAC objects, including Roles, ClusterRoles, RoleBindings, and

    ClusterRoleBindings.

    • Replace verbs: ["*"] with only the required actions, such as get, list,

    watch, create, update, patch, or delete.

    • Replace resources: ["*"] with only the required Kubernetes resources or

    custom resources.

    • Replace apiGroups: ["*"] with the specific API groups required by the

    subject’s function.

    • Review related RoleBinding and ClusterRoleBinding objects to confirm the

    revised role is assigned only to approved users, groups, or Kubernetes service

    accounts.

    • Avoid modifying required system: RBAC resources unless explicitly required and

    tested.

    Where centralized enforcement is required, use Policy Controller with

    K8sProhibitRoleWildcardAccess to audit or enforce restrictions on wildcard access

    in Roles and ClusterRoles.'
  checks:
  - type: manual_review
    info: 'Review Kubernetes RBAC roles in GKE Autopilot clusters to identify wildcard

      permissions in Roles and ClusterRoles. The audit should check for * in apiGroups,

      resources, or verbs, because wildcard permissions can unintentionally grant access to

      current or future Kubernetes APIs, resources, custom resources, or actions. After

      identifying wildcard rules, review the related RoleBinding and ClusterRoleBinding

      objects to determine which users, groups, or Kubernetes service accounts receive the

      permiss'
    severity: medium
- id: 4.1.4
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: The Kubernetes default service account should not be actively used by application workloads. Instead, each
    workload should use a dedicated Kubernetes service account so permissions can be explicitly assigned, audited, and reviewed.
    Create a dedicated Kubernetes service account for each workload that requires Kubernetes API access, and avoid relying
    on the namespace default service account.
  rationale: Kubernetes creates a default service account in each namespace, and Pods that do not specify serviceAccountName
    are automatically assigned that default service account. If RBAC permissions are bound to the default service account,
    any Pod in that namespace that omits an explicit service account can unintentionally inherit those permissions. Where
    Kubernetes API access is required, create a dedicated Kubernetes service account for the workload and grant only the required
    RBAC permissions through a Role or ClusterRole binding. If the Pod does not need Kubernetes API access, set automountServiceAccountToken=false
    so a service account token is not automatically mounted into the Pod. The automountServiceAccountToken field defaults
    to true, and should be disabled when Pods do not need to communicate with the Kubernetes API server.
  impact: Workloads that require Kubernetes API access must be updated to specify an explicit Kubernetes service account and
    receive only the required RBAC permissions. Disabling automatic token mounting or removing default service account permissions
    can break workloads, controllers, or automation that implicitly depend on the default service account, so changes should
    be tested before enforcement.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 27
  audit_raw: 'Review each namespace in the GKE Autopilot cluster to confirm that the Kubernetes

    default service account is not actively used by application workloads and does not have

    explicit RBAC permissions assigned to it. The audit process should identify workloads

    that omit serviceAccountName, workloads that explicitly use serviceAccountName:

    default, and any RoleBinding or ClusterRoleBinding objects that bind permissions

    to the default service account. In addition, verify whether service account token

    mounting is disabled where Pods do not need Kubernetes API access, because

    automountServiceAccountToken defaults to true.

    kubectl get serviceaccounts/default -o yaml

    Review the output and confirm the following:

    • The default service account in each namespace has no explicit RoleBinding

    or ClusterRoleBinding assignments unless there is a documented exception.

    • Application workloads specify a dedicated serviceAccountName instead of

    omitting the field or using serviceAccountName: default.

    • Pods that do not need Kubernetes API access set

    automountServiceAccountToken=false in the Pod spec.

    • The default service account is configured with

    automountServiceAccountToken: false where necessary to reduce

    accidental token mounting.'
  remediation: 'Each workload that requires Kubernetes API access should have its own service

    account with narrowly defined permissions. Workloads that do not need Kubernetes API

    access should disable automatic token mounting to reduce unnecessary credential

    exposure. For Google Cloud API access, use Workload Identity Federation for GKE

    instead of relying on static credentials in Pods.

    • Create dedicated Kubernetes service accounts for workloads that require

    Kubernetes API access

    • Update workload manifests to specify serviceAccountName instead of relying on

    the namespace default service account

    • Remove RoleBinding and ClusterRoleBinding assignments from the default

    service account that are not needed

    • Set automountServiceAccountToken=false for Pods that do not need to

    communicate with the Kubernetes API server

    • Configure the namespace default service account with

    automountServiceAccountToken: false and validate affected workloads'
  checks:
  - type: manual_review
    info: 'Review each namespace in the GKE Autopilot cluster to confirm that the Kubernetes

      default service account is not actively used by application workloads and does not have

      explicit RBAC permissions assigned to it. The audit process should identify workloads

      that omit serviceAccountName, workloads that explicitly use serviceAccountName:

      default, and any RoleBinding or ClusterRoleBinding objects that bind permissions

      to the default service account. In addition, verify whether service account token

      m'
    severity: medium
- id: 4.1.5
  title: Ensure service account tokens are mounted only when Pods require Kubernetes API access
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes service account tokens should be mounted in Pods only when the workload explicitly requires authenticated
    access to the Kubernetes API server. For workloads that do not need API server access, disable token mounting to reduce
    unnecessary credential exposure inside the Pod. automountServiceAccountToken controls whether Kubernetes injects a service
    account credential token into the Pod, and its default value is true.
  rationale: Mounting service account tokens into Pods increases the impact of a Pod compromise because the token can be used
    to make authenticated requests to the Kubernetes API server using the permissions assigned to the Pod’s Kubernetes service
    account. This risk is higher when workloads use shared service accounts, the namespace default service account, or service
    accounts with broad RBAC permissions. Disabling automatic token mounting for Pods that do not need Kubernetes API access
    removes an unnecessary credential from the workload runtime environment and supports least privilege. Workloads that do
    need API access should use a dedicated Kubernetes service account with narrowly assigned RBAC permissions.
  impact: Pods without mounted service account tokens cannot make authenticated requests to the Kubernetes API server unless
    another approved authentication mechanism is provided. Applications, controllers, jobs, or automation that rely on Kubernetes
    API clients may fail until they are updated to use an explicit Kubernetes service account with the required RBAC permissions.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 30
  audit_raw: 'Review Kubernetes service accounts and Pods in each namespace in the GKE

    Autopilot cluster to confirm that service account tokens are mounted only where the

    workload requires authenticated access to the Kubernetes API server. The audit should

    verify both the service account configuration and the Pod specification, because token

    mounting can be controlled at either level. The automountServiceAccountToken field

    defaults to true, so workloads that do not need Kubernetes API access should explicitly

    set it to false.

    Review the service account configuration:

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    Review the Pod configuration:

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml

    Expected output: automountServiceAccountToken: false

    • Confirm that Pods without Kubernetes API access requirements have

    automountServiceAccountToken: false.

    • Confirm that workloads requiring API access use a dedicated Kubernetes service

    account with least privilege RBAC permissions.

    • Review Pods using the namespace default service account, especially where

    automountServiceAccountToken is unset or true.

    • Validate exceptions for controllers, operators, jobs, or applications that require

    Kubernetes API server access.'
  remediation: 'Remediate by disabling service account token mounting and assigning API access only

    to workloads that require it. Pods that do not need to communicate with the Kubernetes

    API server should set automountServiceAccountToken=false, and workloads that do

    need API access should use a dedicated Kubernetes service account with narrowly

    assigned RBAC permissions. In addition, avoiding the default service account and using

    separate Kubernetes service accounts per workload is recommended.

    • Set automountServiceAccountToken=false in Pod or workload specifications

    that do not require Kubernetes API access.

    • Create dedicated Kubernetes service accounts for workloads that require API

    access instead of relying on the namespace default service account.

    • Grant only the required RBAC permissions to those service accounts through

    least privilege Roles, ClusterRoles, RoleBindings, or ClusterRoleBindings.

    • Set automountServiceAccountToken=false on service accounts where token

    mounting should be disabled by default.'
  checks:
  - type: manual_review
    info: 'Review Kubernetes service accounts and Pods in each namespace in the GKE

      Autopilot cluster to confirm that service account tokens are mounted only where the

      workload requires authenticated access to the Kubernetes API server. The audit should

      verify both the service account configuration and the Pod specification, because token

      mounting can be controlled at either level. The automountServiceAccountToken field

      defaults to true, so workloads that do not need Kubernetes API access should explicitly'
    severity: medium
- id: 4.1.6
  title: Avoid granting cluster admin level access through the system:masters group
  scoring: scored
  profile:
  - Level 1
  description: The special Kubernetes group system:masters should not be used to grant clusteradmin level access to users,
    groups, or service accounts. In GKE Autopilot, administrative access should be granted through explicit RBAC bindings
    and limited to the minimum permissions required. The system:masters group is a default Kubernetes group, and adding custom
    subjects to it gives those subjects access to do anything to any resource in the cluster.
  rationale: The system:masters group is bound to the cluster-admin ClusterRole by default to support system functionality.
    Adding users, groups, or service accounts to this group grants unrestricted cluster administrator access across all namespaces
    and resources. This bypasses normal least privilege role design and can make access harder to review, reduce, or replace
    with narrower RBAC controls. Do not use system:masters for routine administrative access. Where full administrative access
    is truly required, use an explicit ClusterRoleBinding to the built in clusteradmin ClusterRole and document the operational
    need. For most use cases, create a narrower Role or ClusterRole that defines only the required API groups, resources,
    and verbs. Google also recommends avoiding default roles and groups, avoiding broad cluster-admin bindings, and applying
    least privilege.
  impact: Avoiding system:masters may require replacing legacy or bootstrap access patterns with explicit RBAC bindings. Users
    or automation that previously relied on system:masters might lose unrestricted access until the required Role, ClusterRole,
    RoleBinding, or ClusterRoleBinding is created and validated. This reduces the risk of uncontrolled cluster-admin access.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/rbac
  page_start: 33
  audit_raw: "Review RBAC bindings and identity sources to confirm that system:masters is not\nused to grant cluster-admin\
    \ level access to custom users, groups, service accounts, or\nclient certificates. The default cluster-admin ClusterRoleBinding\
    \ to system:masters is\nexpected and should not be treated as a failure by itself. Any additional or custom use\nof system:masters\
    \ should be reviewed because Kubernetes assigns the cluster-admin\nClusterRole to this group by default, and adding subjects\
    \ to it grants full access to every\nresource in the cluster.\nReview ClusterRoleBindings that reference system:masters:\n\
    kubectl get clusterrolebinding -o json \\\n| jq -r '.items[]\n  | select(.subjects[]? | .kind==\"Group\" and .name==\"\
    system:masters\")\n  | \"\\(.metadata.name)\\t\\(.roleRef.kind)/\\(.roleRef.name)\"'\nExpected output: cluster-admin ClusterRole/cluster-admin\n\
    • Confirm that the only expected ClusterRoleBinding involving system:masters\nis the default cluster-admin binding.\n\
    • Review RoleBindings and ClusterRoleBindings for any custom references to\nsystem:masters.\n• Review certificate, identity\
    \ provider, and group mapping processes to confirm no\ncustom user or workload identity is issued with system:masters\
    \ group\nmembership.\n• Confirm administrative access is granted through explicit RBAC bindings, not by\nplacing subjects\
    \ in system:masters.\nNote: Do not delete or modify required system: RBAC resources unless explicitly\nvalidated, because\
    \ they support cluster functionality."
  remediation: 'Remediate custom system:masters usage by replacing it with explicit, auditable RBAC

    assignments. Do not remove the default cluster-admin ClusterRoleBinding to

    system:masters, because it supports Kubernetes system functionality. Instead, remove

    custom paths that add users, groups, service accounts, or client certificates to

    system:masters, and grant required access through least privilege Roles,

    ClusterRoles, RoleBindings, or ClusterRoleBindings.

    • Remove any custom RoleBinding or ClusterRoleBinding that references

    system:masters, after confirming it is not a required system binding.

    • Remove system:masters from identity provider mappings, certificate subject

    groups, or other external authentication sources used for cluster access.

    • Replace required administrative access with explicit RBAC bindings to clusteradmin only where full cluster access is
    justified.

    • For most users, groups, service accounts, and automation, create narrower roles

    that define only the required API groups, resources, and verbs.'
  checks:
  - type: manual_review
    info: 'Review RBAC bindings and identity sources to confirm that system:masters is not

      used to grant cluster-admin level access to custom users, groups, service accounts, or

      client certificates. The default cluster-admin ClusterRoleBinding to system:masters is

      expected and should not be treated as a failure by itself. Any additional or custom use

      of system:masters should be reviewed because Kubernetes assigns the cluster-admin

      ClusterRole to this group by default, and adding subjects to it grants full '
    severity: medium
- id: 4.1.7
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: Roles and ClusterRoles with bind, escalate, or impersonate permissions should be granted only to tightly controlled
    administrative or platform identities with a documented need. These permissions can allow a subject to expand effective
    access beyond normal RBAC assignments and should not be included in general user, workload, or automation roles. RBAC
    permissions are defined in Role and ClusterRole rules and assigned through RoleBinding and ClusterRoleBinding objects.
  rationale: The bind and escalate permissions are high risk because they can allow a subject to create or update RBAC objects
    in ways that grant permissions they would not otherwise hold. escalate allows creation or update of roles with permissions
    beyond the caller’s current access, while bind allows creation or update of role bindings that reference roles with permissions
    beyond the caller’s current access. These permissions can allow a subject to grant any permission to any role and should
    be avoided unless explicitly required. The impersonate permission is also sensitive because it can allow a subject to
    act as another user, group, or service account for Kubernetes API requests. When combined with broad target identities
    or privileged RBAC bindings, impersonation can provide an escalation path to cluster admin level access. These verbs should
    be limited to controlled administrative workflows, troubleshooting use cases, or approved automation with narrow scope.
    In GKE Autopilot clusters, user impersonation is supported for userdefined users and groups, but system users and groups
    such as system:masters cannot be impersonated. RBAC role design should follow least privilege and account for escalation
    risks such as bind and escalate.
  impact: 'Restricting bind, escalate, and impersonate may affect administrators, controllers, operators, CI/CD tooling, or
    automation that legitimately creates roles, assigns bindings, or validates access by impersonating another subject. Before
    removing these permissions, identify the exact workflow, replace broad permissions with narrowly defined access, and validate
    system and application behavior. Avoid modifying required system: RBAC resources unless the change is explicitly required
    and tested, because those resources support cluster functionality.'
