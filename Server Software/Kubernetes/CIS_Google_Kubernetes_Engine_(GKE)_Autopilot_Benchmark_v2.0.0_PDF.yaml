- id: 4.6.3
  title: Require hardened security contexts for all workload Pods and containers
  scoring: manual
  profile:
  - Level 2
  description: Require hardened security contexts for GKE Autopilot workload Pods and containers. Security contexts should
    define workload level and container level controls that reduce privilege, limit host exposure, and enforce safer runtime
    behavior.
  rationale: Security contexts control important runtime security settings for Pods and containers, including user and group
    identity, privilege escalation, Linux capabilities, privileged mode, seccomp profile, and related container isolation
    settings. GKE Autopilot applies multiple Pod security constraints by default, but workload manifests should still define
    applicable security context settings for controls that remain workload configurable. A hardened configuration should normally
    include settings such as runAsNonRoot=true, allowPrivilegeEscalation=false, privileged=false, dropped Linux capabilities,
    and the RuntimeDefault seccomp profile where explicitly specified. Custom Localhost seccomp profiles are not supported
    in GKE Autopilot, and Unconfined should be limited to documented exceptions. These align with restricted Pod security
    expectations and can also be enforced or audited with admission controls such as Pod Security Admission and Policy Controller.
  impact: Incorrectly configured security contexts can cause workloads to fail at startup or lose required runtime behavior,
    especially applications that expect root privileges, writable root filesystems, elevated capabilities, host access, or
    unrestricted system calls. Teams should test hardened settings in lower environments, document approved exceptions, and
    apply container level overrides only where a specific workload requirement exists.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilotsecurity
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/seccomp-in-gke
  page_start: 64
  audit_raw: 'Review workload Pods and controller templates to confirm hardened security contexts

    are explicitly defined at the Pod and container level. Focus the audit on workload

    namespaces and verify settings such as runAsNonRoot=true,

    allowPrivilegeEscalation=false, privileged=false, dropped Linux capabilities

    where practical, and no explicit seccompProfile.type=Unconfined unless

    documented as an approved exception. Missing seccompProfile fields are not a

    finding in GKE Autopilot because Autopilot applies the RuntimeDefault seccomp

    profile to workload Pods by default. GKE Autopilot supports using Pod Security

    Admission, Policy Controller, and security posture scanning to identify and enforce

    workload configuration risks.

    Review any workload that has no security context, runs as root, allows privilege

    escalation, runs privileged, uses broad Linux capabilities, or explicitly uses

    seccompProfile.type=Unconfined without an approved exception. These findings

    should be documented as remediation items or approved exceptions based on workload

    requirements.'
  remediation: 'Update workload manifests, Helm charts, overlays, or GitOps sources so hardened

    security contexts are defined before deployment. Apply settings at the Pod level when

    they apply to all containers, and use container level settings where a specific container

    requires a different configuration.

    • Set workloads to run as non root where compatible.

    • Set allowPrivilegeEscalation=false for workload containers.

    • Set privileged=false and remove host level access unless explicitly required.

    • Drop unnecessary Linux capabilities, and use drop: ["ALL"] where the

    application supports it.

    • Set seccompProfile.type=RuntimeDefault where seccomp is explicitly

    defined, and remove unsupported custom Localhost seccomp profiles from GKE

    Autopilot workloads.

    Redeploy the workload and validate application behavior in a lower environment before

    broad rollout. Use admission controls such as Pod Security Admission or Policy

    Controller to prevent future workloads from being admitted without the required security

    context settings.'
  checks:
  - type: manual_review
    info: 'Review workload Pods and controller templates to confirm hardened security contexts

      are explicitly defined at the Pod and container level. Focus the audit on workload

      namespaces and verify settings such as runAsNonRoot=true,

      allowPrivilegeEscalation=false, privileged=false, dropped Linux capabilities

      where practical, and no explicit seccompProfile.type=Unconfined unless

      documented as an approved exception. Missing seccompProfile fields are not a

      finding in GKE Autopilot because Autopilot applies'
    severity: medium
- id: 4.6.4
  title: Avoid deploying workloads in the default namespace
  scoring: manual
  profile:
  - Level 2
  description: Avoid deploying GKE Autopilot workloads in the default namespace. Use dedicated namespaces to separate applications,
    environments, or tenants so namespace level controls can be applied consistently.
  rationale: The default namespace exists for objects created without an explicit namespace, but using it for normal workloads
    weakens ownership, access separation, and resource governance. Dedicated namespaces make it easier to apply namespace
    based RBAC, ResourceQuotas, NetworkPolicies, Pod Security labels, observability controls, and cost attribution.
  impact: Teams must specify the correct namespace in manifests, deployment pipelines, and operational commands. Existing
    workloads in the default namespace may need to be migrated to dedicated namespaces, with related updates to service discovery,
    RBAC bindings, quotas, NetworkPolicies, Pod Security labels, monitoring, and CI/CD configuration.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/isolate-workloadsdedicated-namespaces
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/best-practices/enterprisemultitenancy
