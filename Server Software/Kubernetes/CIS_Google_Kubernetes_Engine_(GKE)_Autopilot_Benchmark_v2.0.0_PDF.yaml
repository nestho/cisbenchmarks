- id: 4.3.1
  title: Use NetworkPolicy with built in GKE Dataplane V2 enforcement
  scoring: manual
  profile:
  - Level 2
  description: NetworkPolicy enforcement is built in for GKE Autopilot clusters through GKE Dataplane V2. Kubernetes NetworkPolicy
    objects can restrict Pod to Pod, Pod to Service, ingress, and egress traffic without enabling Calico or a separate NetworkPolicy
    add-on.
  rationale: NetworkPolicies define pod level traffic rules, but enforcement depends on the networking implementation used
    by the cluster. In GKE Autopilot, GKE Dataplane V2 is enabled by default and provides built in Kubernetes NetworkPolicy
    enforcement. GKE Dataplane V2 uses Cilium and eBPF for routing, load balancing, and NetworkPolicy enforcement. By default,
    pods in a cluster can communicate freely. Using NetworkPolicy in GKE Autopilot allows teams to implement defense in depth,
    namespace based segmentation, tenant isolation, and explicit ingress and egress controls for approved workload communication
    paths.
  impact: Applying NetworkPolicy resources can change workload connectivity because traffic not explicitly allowed by policy
    might be denied. In GKE Autopilot, NetworkPolicy enforcement is built in through GKE Dataplane V2 and should not be separately
    enabled or disabled.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dataplane-v2
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/network-policy
  page_start: 47
  audit_raw: "Review the GKE Autopilot cluster configuration and verify that the cluster uses GKE\nDataplane V2 for built\
    \ in NetworkPolicy enforcement. NetworkPolicy requires a\nnetwork plugin to implement enforcement. In Autopilot clusters,\
    \ GKE Dataplane V2 is\nenabled by default and Kubernetes NetworkPolicy is always on.\ngcloud container clusters describe\
    \ $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format=\"table(\n    name,\n    networkConfig.datapathProvider\n\
