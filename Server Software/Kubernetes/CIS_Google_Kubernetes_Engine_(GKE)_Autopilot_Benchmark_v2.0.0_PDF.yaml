- id: 5.4.5
  title: Use Google managed SSL certificates for GKE Ingress TLS
  scoring: manual
  profile:
  - Level 2
  description: Use Google managed SSL certificates for GKE Ingress TLS to encrypt client traffic between external users and
    the Google Cloud load balancer. Google provisions and renews these certificates for the configured domains, reducing manual
    certificate lifecycle management for supported GKE Ingress use cases.
  rationale: TLS encryption for GKE Ingress helps protect application traffic between clients and the load balancer by preventing
    plaintext exposure over external networks. Google managed SSL certificates reduce operational risk by having Google provision,
    manage, and automatically renew domain validated certificates for supported load balancer and Ingress configurations.
    This control is most appropriate for HTTPS traffic exposed through GKE Ingress. It does not apply to TCP or UDP load balancers
    created through a Service of type LoadBalancer, and GKE Ingress does not support certificates managed by Certificate Manager.
    Use Gateway API if Certificate Manager managed certificates are required.
  impact: Google managed SSL certificates are less flexible than self managed certificates. They support up to 100 non wildcard
    domains, do not support wildcard domains, and cannot be updated in place to add or remove domains. DNS records must point
    to the load balancer for validation and renewal, and provisioning can remain pending until domain ownership and load balancer
    association are confirmed.
  references:
  - 1. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/managed-certs
  - 2. https://docs.cloud.google.com/kubernetes-engine/docs/how-to/secure-trafficmanagement
  page_start: 102
  audit_raw: "Review public application exposure and identify workloads using Service objects of\ntype LoadBalancer. Google\
    \ managed SSL certificates for GKE Ingress apply to HTTPS\nload balancers created through Ingress, not TCP or UDP load\
    \ balancers created directly\nfrom Service objects. Public HTTP or HTTPS workloads exposed through LoadBalancer\nservices\
    \ should be reviewed to determine whether GKE Ingress is the better TLS\ntermination pattern.\nkubectl get svc -A -o json\
    \ | jq '.items[] |\nselect(.spec.type==\"LoadBalancer\")'\n• Expected output: Check for GKE Ingress resources and confirm\
    \ that HTTPS\nIngresses reference one or more Google managed certificates through the\nnetworking.gke.io/managed-certificates\
    \ annotation.\nkubectl get ingress -A -o json | jq '.items[] | {\n  namespace: .metadata.namespace,\n  name: .metadata.name,\n\
    \  managedCertificates: .metadata.annotations.\"networking.gke.io/managedcertificates\",\n  status: .status\n}'\n• Expected\
    \ output: Each applicable HTTPS Ingress should include the\networking.gke.io/managed-certificates annotation with one\
    \ or more\nManagedCertificate resource names. The annotation value is a comma\nseparated list of ManagedCertificate objects\
