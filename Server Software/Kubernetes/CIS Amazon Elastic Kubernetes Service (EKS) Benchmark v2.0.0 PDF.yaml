      teams, applications, and environments are instead using dedicated namespaces that

      align with namespace-scoped access control, quotas, limits, service accounts, and

      network policies. Namespaces are a soft multi-tenancy boundary in EKS, so the go'
    severity: medium
- id: 5.1.1
  title: Ensure Image Vulnerability Scanning using Amazon ECR image scanning or a third party provider
  scoring: scored
  profile:
  - Level 1
  description: Container image vulnerability scanning helps strengthen the security of EKS workloads by identifying known
    software weaknesses in the images those workloads run. This supports a more secure software supply chain and helps reduce
    the chance that vulnerable images are promoted into Kubernetes environments.
  rationale: EKS best practices recommend scanning images in Amazon ECR and rebuilding or deleting images with High or Critical
    findings. In AWS, this can be implemented with ECR Basic Scanning or with ECR Enhanced Scanning, where Enhanced Scanning
    integrates with Amazon Inspector for continuous scanning and expanded coverage that includes operating system and programming
    language package vulnerabilities. AWS also documents that enhanced scanning can show how images are used in EKS, which
    helps teams identify affected clusters and prioritize remediation for images that are actually running in production.
    Vulnerabilities in container image software packages can be exploited to compromise workloads and potentially gain unauthorized
    access to cluster, node, or connected cloud resources. Amazon ECR and approved third-party tools can scan container images
    for known vulnerabilities.
  impact: This control improves detection and prioritization of vulnerable container images, but it also adds operational
    overhead to review findings, rebuild images, and manage registry scan configuration. In Enhanced Scanning, coverage depends
    on registry scanning rules and monitoring windows, so repositories outside the configured filters or images outside the
    active rescan scope may not continue to receive scans.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/image-security.html
  - 2. https://docs.aws.amazon.com/AmazonECR/latest/userguide/imagescanning.html
  page_start: 153
  audit_raw: "Verify that Amazon ECR vulnerability scanning is enabled for repositories that store\nimages used by EKS workloads\
    \ by reviewing the registry scanning configuration and,\nwhere needed, the repository scanning configuration. Confirm\
    \ whether the registry is\nusing Basic or Enhanced Scanning and that the applicable repositories are included in\nthe\
    \ scanning scope. If a third-party scanner is used instead, obtain equivalent evidence\nthat EKS-bound images are scanned\
    \ and that findings are available for review.\n• Checks the registry-wide scanning setting for the Region. Use it to confirm\
    \ the\nscan type and any registry scan rules:\naws ecr get-registry-scanning-configuration \\\n  --region $REGION_CODE\n\
    Expected output: JSON showing the registryId and scanningConfiguration. In\nthat object, look for scanType such as BASIC\
    \ or ENHANCED, and if rules are present,\nreview rules, repositoryFilters, and scanFrequency to see which repositories\
    \ are\ncovered and how they are scanned.\n• Checks the scanning configuration for the specific repository. Use it to confirm\n\
    that the repository used by EKS is actually covered:\naws ecr batch-get-repository-scanning-configuration \\\n  --repository-names\
    \ $REPO_NAME \\\n  --region $REGION_CODE\nExpected output: JSON with scanningConfigurations for the requested repository\n\
    and possibly failures if a repository name is invalid or not found. In\nscanningConfigurations, look for repositoryName,\
    \ repositoryArn, scanOnPush,\nscanFrequency, and appliedScanFilters to confirm the effective scan behavior for\nthat repository."
  remediation: "Enable image vulnerability scanning in ECR for the repositories that supply container\nimages to EKS workloads.\
    \ Configure scanning at the private registry level in each\nRegion, because ECR manages scan behavior through registry\
    \ settings. Prefer\nEnhanced Scanning so Amazon Inspector can continuously scan container images for\noperating system\
    \ and programming language package vulnerabilities. If Basic Scanning\nis used instead, ensure the repositories that store\
    \ EKS images are covered by scan on\npush rules or are manually scanned before image promotion and deployment. EKS\nguidance\
    \ recommends regularly scanning images in ECR or with a commercial\nscanner, and AWS notes that the older repository-level\
    \ put-image-scanningconfiguration path is being deprecated in favor of registry-level configuration.\n• Identify the ECR\
    \ repositories and Regions that provide images to EKS\nworkloads. This establishes which private registries must be included\
    \ in the\nscanning scope.\n• Configure the private registry scanning setting in each Region to use Enhanced\nor Basic\
    \ scanning. Registry scanning settings are regional, so this must be set in\neach Region that stores images for EKS.\n\
    aws ecr put-registry-scanning-configuration \\\n  --scan-type ENHANCED \\\n  --region $REGION_CODE\n• Prefer Enhanced\
    \ Scanning and configure repository filters or rules so all\nrepositories used by EKS are included. Enhanced Scanning\
    \ integrates with\nAmazon Inspector, and the registry rules determine which repositories are\nscanned and at what frequency.\n\
    aws ecr put-registry-scanning-configuration \\\n  --scan-type ENHANCED \\\n  --rules\n'[{\"repositoryFilters\":[{\"filter\"\
    :\"prod\",\"filterType\":\"WILDCARD\"}],\"scanFrequ\nency\":\"CONTINUOUS_SCAN\"}]' \\\n  --region $REGION_CODE\n• If Basic\
    \ Scanning is used, configure scan on push for the required repositories.\nECR supports Basic and Enhanced scanning, and\
    \ scan-on-push behavior can be\ncontrolled through the registry scanning configuration.\n• Review vulnerability findings\
    \ and rebuild, replace, or prevent deployment of\nimages with unacceptable risk before they are used by EKS workloads.\
    \ This\nmakes the control operational rather than leaving findings unaddressed."
  checks:
  - type: manual_review
    info: 'Verify that Amazon ECR vulnerability scanning is enabled for repositories that store

      images used by EKS workloads by reviewing the registry scanning configuration and,

      where needed, the repository scanning configuration. Confirm whether the registry is

      using Basic or Enhanced Scanning and that the applicable repositories are included in

      the scanning scope. If a third-party scanner is used instead, obtain equivalent evidence

      that EKS-bound images are scanned and that findings are available for re'
    severity: medium
- id: 5.1.2
  title: Ensure least-privilege access is enforced for Amazon ECR repositories used by EKS workloads
  scoring: manual
  profile:
  - Level 1
  description: Least-privilege access for Amazon ECR repositories helps limit who can pull, push, delete, or administer container
    images used by EKS workloads. This reduces unnecessary exposure of the image registry and helps ensure that only the identities
    required to support cluster operation, image delivery, and approved build or release processes can access the repositories.
  rationale: Amazon ECR access is enforced through a combination of IAM identity-based policies and ECR repository policies,
    and AWS recommends moving toward permissions that are specific to the use case rather than broad managed access. For EKS
    image pulls, worker node roles or Fargate pod execution roles only need the ECR actions required to authenticate and retrieve
    images, such as ecr:GetAuthorizationToken, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, and ecr:BatchCheckLayerAvailability.
    For image push, administration, or crossaccount access, permissions should be scoped to the specific repository ARN and
    only the required actions should be granted.
  impact: Enforcing this control usually requires separate IAM roles or policies for node image pulls, Fargate image pulls,
    CI/CD image publishing, and repository administration. If permissions are scoped too narrowly, EKS nodes, Fargate pods,
    or operational users may be unable to authenticate to ECR, pull images, or use repository functions as intended. When
    scoped correctly, the control reduces the risk of unauthorized image access or modification without disrupting required
    image delivery to EKS workloads.
  references:
  - 1. https://docs.aws.amazon.com/AmazonECR/latest/userguide/repositorypolicies.html
  - 2. https://docs.aws.amazon.com/AmazonECR/latest/userguide/ECR_on_EKS.html
  page_start: 157
  audit_raw: "Review the IAM permissions and ECR repository policies that apply to repositories used\nby EKS workloads, and\
    \ verify that access is limited to approved node roles, Fargate pod\nexecution roles, CI/CD identities, and administrative\
    \ roles. Confirm that pull access is\nlimited to the minimum ECR actions required for image retrieval, that push or\n\
    administrative access is scoped only to the repositories and actions required, and that\nno unnecessary wildcard or broad\
    \ cross-account access is present. ECR access\ndecisions can be affected by both IAM policies and repository policies,\
    \ and EKS image\npulls rely on the node role or Fargate pod execution role having the required ECR\npermissions.\n• Identify\
    \ the ECR repositories used by EKS workloads. Review only the\nrepositories that actually supply images to the cluster.\n\
    • Review each repository policy for unnecessary principals or broad actions. Look\nfor cross-account access, wildcard\
    \ principals, or actions beyond the repository’s\nintended use.\naws ecr get-repository-policy \\\n  --repository-name\
    \ $REPO_NAME \\\n  --region $REGION_CODE\nExpected output: JSON containing the repository policy text. Review the Principal,\n\
    Action, and Resource entries to confirm access is limited to approved identities and\nrequired actions only.\n• Review\
    \ the IAM role used to pull images. For node-based workloads, review the\nnode IAM role. For Fargate workloads, review\
    \ the pod execution role. Confirm\nthe role has only the pull permissions required for ECR access. AWS documents\npull-related\
    \ permissions such as ecr:GetAuthorizationToken,\necr:BatchCheckLayerAvailability, ecr:BatchGetImage, and\necr:GetDownloadUrlForLayer.\n\
    aws iam list-attached-role-policies \\\n  --role-name $ROLE_NAME\nExpected output: JSON listing the managed policies attached\
    \ to the role. Review the\nattached policy names and flag overly broad access such as full ECR administration\nwhere pull-only\
    \ access would be sufficient.\n• Flag broad access patterns. Examples include ecr:*, wildcard repository scope\nwhere\
    \ it is not required, or broad managed policies where a narrower customermanaged policy would satisfy the use case. AWS\
    \ recommends least-privilege\nidentity-based policies tailored to the access requirement."
  remediation: "Enforce least-privilege access for ECR repositories used by EKS workloads by\nseparating image pull, image\
    \ push, and repository administration into different IAM roles\nand policy scopes. Grant node roles and Fargate pod execution\
    \ roles only the ECR\npermissions needed to authenticate and pull images, such as\necr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,\n\
    ecr:BatchGetImage, and ecr:GetDownloadUrlForLayer. Scope CI/CD and\nadministrator access to the specific repositories\
    \ and actions they require, and review\nboth IAM identity-based policies and ECR repository policies because ECR\nauthorization\
    \ can be affected by both. AWS also provides the\nAmazonEC2ContainerRegistryPullOnly managed policy for pull-only use\
    \ cases.\n• Separate ECR access by role. Use different roles for node pulls, Fargate pulls,\nCI/CD pushes, and repository\
    \ administration.\n• Replace broad pull access with pull-only permissions where possible. Attach a\nnarrower pull-only\
    \ policy to runtime pull roles instead of broader ECR access.\naws iam attach-role-policy \\\n  --role-name $ROLE_NAME\
    \ \\\n  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly\n• Scope push and admin access to specific\
    \ repositories. Limit CI/CD and admin\nidentities to the repository ARNs and ECR actions they actually need.\n• Tighten\
    \ repository policies only where needed. Use repository policies to restrict\nrepository-level access, including approved\
    \ cross-account access, but remember\nthat ecr:GetAuthorizationToken must still come from IAM.\naws ecr set-repository-policy\
    \ \\\n  --repository-name $REPO_NAME \\\n  --policy-text file://repo-policy.json \\\n  --region $REGION_CODE\n• Keep runtime\
    \ pull roles limited to pull actions only. Do not give node or Fargate\npull roles push, delete, or policy-management\
    \ rights unless there is a specific\noperational requirement.\n• Retest image delivery after policy changes. Confirm workloads\
    \ can still pull\nrequired images and that unauthorized identities can no longer modify or\nadminister repositories outside\
    \ their scope."
  checks:
  - type: manual_review
    info: 'Review the IAM permissions and ECR repository policies that apply to repositories used

      by EKS workloads, and verify that access is limited to approved node roles, Fargate pod

      execution roles, CI/CD identities, and administrative roles. Confirm that pull access is

      limited to the minimum ECR actions required for image retrieval, that push or

      administrative access is scoped only to the repositories and actions required, and that

      no unnecessary wildcard or broad cross-account access is present. ECR '
    severity: medium
- id: 5.1.3
  title: Restrict ECR access for EKS runtime identities to pull-only permissions
  scoring: manual
  profile:
  - Level 1
  description: Restricting ECR access for EKS runtime identities to pull-only permissions helps ensure that the identities
    used to run workloads can retrieve required container images without also receiving broader registry visibility or administrative
    access. In EKS, this applies to worker node IAM roles and, for Fargate workloads, the pod execution role that pulls images
    from private ECR repositories.
  rationale: The EKS runtime image-pull path requires only a small subset of ECR permissions, so granting broader registry
    visibility is unnecessary for node roles and Fargate pod execution roles. For node-based workloads, the required permissions
    are ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, and ecr:GetDownloadUrlForLayer. For
    Fargate, the pod execution role is used to pull images from private ECR repositories. A pull-only policy is therefore
    a closer least-privilege match for runtime identities because it supports registry authentication and layer retrieval
    without also granting repository inspection and inventory actions. A read-only ECR policy is broader than the runtime
    pull path because it also allows actions such as ecr:GetRepositoryPolicy, ecr:DescribeRepositories, ecr:ListImages, ecr:DescribeImages,
    ecr:GetLifecyclePolicy, ecr:ListTagsForResource, and ecr:DescribeImageScanFindings. Those actions expose repository metadata,
    image inventory, lifecycle configuration, and scan-result visibility that are typically useful for administrators, auditors,
    or tooling, but are not required just to start workloads from private ECR images. Restricting runtime identities to pull-only
    permissions therefore reduces unnecessary registry exposure while still preserving the permissions required for image
    retrieval.
  impact: This control reduces unnecessary exposure of ECR metadata and administrative surfaces to runtime identities, but
    the assigned role must still retain the permissions required to authenticate and pull images. If those pull permissions
    are removed or scoped incorrectly, nodes or Fargate-hosted pods will not be able to retrieve private ECR images, which
    can prevent workloads from starting successfully.
  references:
  - 1. https://docs.aws.amazon.com/AmazonECR/latest/userguide/ECR_on_EKS.html
  - 2. https://docs.aws.amazon.com/aws-managedpolicy/latest/reference/AmazonEC2ContainerRegistryPullOnly.html
  page_start: 161
  audit_raw: "Review the IAM role permissions and any ECR repository policies that apply to the\nruntime identities used by\
    \ EKS to pull images, and verify that those identities are limited\nto pull-only access. Focus on the worker node IAM\
    \ role for node-based workloads and\nthe pod execution role for Fargate workloads. The expected pull path requires only\n\
    ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,\necr:BatchGetImage, and ecr:GetDownloadUrlForLayer, while\
    \ the broader\nAmazonEC2ContainerRegistryReadOnly policy also includes repository and image\ndiscovery actions that are\
    \ not required just to pull images. Repository policies can also\naffect access, but ecr:GetAuthorizationToken must still\
    \ come from IAM.\n• Identify the runtime role in scope. Review the IAM role used by EKS worker\nnodes, or the Fargate\
    \ pod execution role if the workload runs on Fargate. That is\nthe identity that should be restricted to pull-only access.\n\
    • Review the managed policies attached to that role. Flag broad policies such as\nAmazonEC2ContainerRegistryReadOnly or\n\
    AmazonEC2ContainerRegistryFullAccess when the role only needs to pull\nimages. AmazonEC2ContainerRegistryPullOnly is the\
    \ tighter managed-policy\nfit for runtime image pulls.\naws iam list-attached-role-policies \\\n  --role-name $ROLE_NAME\n\
    • Review inline policies on the same role if managed policies are not the whole\nstory. Confirm they do not add broader\
    \ ECR actions such as repository listing,\nrepository-policy reads, scan-finding reads, push actions, delete actions,\
    \ or\nwildcard ecr:* access. Least-privilege ECR policies should be tailored to the\nactual use case.\n• Check for repository-level\
    \ exceptions. If a repository policy is used, verify that it\ndoes not grant unnecessary principals or broader access\
    \ than intended. A\nmissing repository policy is not automatically a finding, because ECR access can\nbe granted through\
    \ IAM alone.\naws ecr get-repository-policy \\\n  --repository-name $REPO_NAME \\\n  --region $REGION_CODE\n• Confirm\
    \ the effective permission set is pull-only. The runtime role should be\nlimited to registry authentication and image\
    \ retrieval, not broader read, push, or\nadministrative access. If broader permissions are present, mark the role for\n\
    remediation."
  remediation: "Enforce pull-only ECR access for EKS runtime identities by limiting the worker node\nIAM role, and where applicable\
    \ the Fargate pod execution role, to only the permissions\nrequired to authenticate to ECR and retrieve container image\
    \ layers. The runtime pull\npath only needs ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,\necr:BatchGetImage,\
    \ and ecr:GetDownloadUrlForLayer. Broader policies such as\nAmazonEC2ContainerRegistryReadOnly or\nAmazonEC2ContainerRegistryFullAccess\
    \ expose additional repository visibility or\nadministration capabilities that are not required just to start workloads.\n\
    • Identify the runtime roles in scope. Review the node IAM role for node-based\nworkloads and the pod execution role for\
    \ Fargate workloads, because those are\nthe identities used to pull private ECR images.\n• Remove broader ECR managed\
    \ policies from runtime roles. Detach\nAmazonEC2ContainerRegistryReadOnly,\nAmazonEC2ContainerRegistryFullAccess, or similar\
    \ broad policies from roles\nthat only need image-pull access.\naws iam detach-role-policy \\\n  --role-name $ROLE_NAME\
    \ \\\n  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly\n• Attach the pull-only managed policy\
    \ to the runtime role.\nAmazonEC2ContainerRegistryPullOnly is the tighter managed-policy fit for\nruntime image pulls.\n\
    aws iam attach-role-policy \\\n  --role-name $ROLE_NAME \\\n  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly\n\
    • Remove or replace inline policies that add extra ECR permissions. Keep runtime\nroles limited to the pull path and remove\
    \ repository listing, repository-policy\nreads, scan-finding reads, push actions, delete actions, and wildcard ecr:*\n\
    access unless there is a documented operational need.\n• Check repository policies for unnecessary grants. Repository\
    \ policies should not\nreintroduce broader access for runtime principals, and\necr:GetAuthorizationToken must still be\
    \ granted through IAM even when a\nrepository policy is used.\n• Retest image pulls after the change. Confirm that nodes\
    \ and Fargate workloads\ncan still pull required private ECR images and that the runtime role no longer has\nbroader repository\
    \ visibility or administrative access than needed."
  checks:
  - type: manual_review
    info: 'Review the IAM role permissions and any ECR repository policies that apply to the

      runtime identities used by EKS to pull images, and verify that those identities are limited

      to pull-only access. Focus on the worker node IAM role for node-based workloads and

      the pod execution role for Fargate workloads. The expected pull path requires only

      ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,

      ecr:BatchGetImage, and ecr:GetDownloadUrlForLayer, while the broader

      AmazonEC2ContainerRegistryRead'
    severity: medium
- id: 5.1.4
  title: Allow only approved container registries for images used by EKS workloads
  scoring: manual
  profile:
  - Level 1
  description: Allowing only approved container registries for images used by EKS workloads helps reduce supply chain risk
    by limiting where workloads can source their images. This creates a controlled image origin model in which clusters admit
    workloads only from trusted registries and can pair that control with image-signature verification before containers are
    allowed to run.
  rationale: A practical way to enforce this control in EKS is through policy-as-code admission controls such as Kyverno or
    Gatekeeper, which evaluate Kubernetes API requests before the requested change is persisted. Those policies can validate
    image-source rules, verify signatures and attested artifacts, and reject deployments that do not meet the required trust
    conditions. Signature verification workflows for EKS also require a Notation trust store and trust policy for the selected
    admission controller, which makes the registry restriction more than a naming convention and turns it into an admissiontime
    enforcement point tied to trusted publishers and approved image sources.
  impact: This control reduces the chance that workloads pull images from unapproved or untrusted registries, but it adds
    administrative overhead because the approved-registry policy must be maintained for platform add-ons, vendor components,
    and operational exceptions. If the allowlist is too narrow, admission can deny valid deployments until the required registry
    is explicitly added, as shown in GuardDuty troubleshooting for clusters using an allowed-container-registries admission
    policy.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/image-security.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/pod-security.html
  page_start: 165
  audit_raw: 'Review the image sources currently used by the cluster and the admission controls that

    govern new deployments, then verify that workloads are limited to approved registries

    only. The strongest implementation for this control is an admission-time policy, because

    policy-as-code solutions such as Kyverno and OPA Gatekeeper can intercept

    Kubernetes API requests before the change is persisted, and image-security guidance

    for EKS describes using admission controllers to verify image trust conditions before

    deployment. Include required AWS-managed image sources for platform components

    and add-ons in the approved list, because EKS add-ons and core components such as

    kube-proxy, coredns, and aws-node are pulled from region-specific ECR registries.

    • Compare every running workload image registry hostname to the approved

    registry allowlist. Any image sourced from an unapproved registry is a finding.

    kubectl get pods -A -o jsonpath=''{range

    .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range

    .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}''

    • Confirm the cluster uses an admission control path that evaluates image source

    before deployment is accepted, rather than relying only on CI/CD checks or

    documented standards.

    • Check the approved-registry allowlist. Verify it includes internal ECR repositories,

    approved third-party registries if any, and the region-specific ECR registries

    required for EKS add-ons and platform components.

    • Confirm an approved image is accepted and a test image from an unapproved

    registry is rejected at admission time.

    • Verify any additional allowed registries are documented and intentionally

    approved, and where image signing or attestation is used, confirm the admission

    controller also validates those trust conditions for approved image sources.'
  remediation: 'Restrict EKS workloads to approved container registries by enforcing image-source

    controls at admission time, rather than relying only on CI/CD checks or written

    standards. Enforcement is typically implemented with a policy-as-code admission

    controller such as Kyverno or Gatekeeper so image references are checked before the

    deployment is persisted. The allowlist must also include the Region-specific ECR

    registries required for EKS platform components and add-ons, because EKS add-on

    images are pulled from Amazon ECR private repositories replicated per Region.

    • Include internal ECR repositories, explicitly approved third-party registries, and

    the Region-specific ECR registries required for EKS add-ons and platform

    components in the approved registry allowlist.

    • Configure Kyverno, Gatekeeper, or another validating admission path so image

    registry source is checked before the workload is admitted.

    • Apply the policy to workload namespaces while accounting for system

    namespaces and approved operational exceptions so required platform

    components are not blocked.

    • Configure the admission controller to verify signed images and attested artifacts

    when stronger supply chain controls are required, using a Notation trust store

    and trust policy.

    • Confirm approved registries are allowed, unapproved registries are denied, and

    update the allowlist when new add-ons, vendor components, or trusted registries

    are introduced.'
  checks:
  - type: manual_review
    info: 'Review the image sources currently used by the cluster and the admission controls that

      govern new deployments, then verify that workloads are limited to approved registries

      only. The strongest implementation for this control is an admission-time policy, because

      policy-as-code solutions such as Kyverno and OPA Gatekeeper can intercept

      Kubernetes API requests before the change is persisted, and image-security guidance

      for EKS describes using admission controllers to verify image trust conditions b'
    severity: medium
- id: 5.2.1
  title: Prefer using dedicated EKS Service Accounts
  scoring: scored
  profile:
  - Level 1
  description: Using dedicated Kubernetes service accounts for EKS workloads helps isolate AWS permissions by application,
    job, or trust boundary instead of sharing a single identity across multiple workloads. This supports more controlled access
    to AWS services and reduces the blast radius if one workload is compromised or misconfigured.
  rationale: A workload that needs AWS access should run with a Kubernetes service account that is associated to an IAM role
    through EKS Pod Identity or IRSA, and that association should be created for each unique permission set an application
    needs. With EKS Pod Identity, the IAM role trust policy is limited to the pods.eks.amazonaws.com service principal and
    can be further restricted with conditions tied to cluster, namespace, and service account context. With IRSA, the service
    account is associated to an IAM role through the cluster OIDC provider, and pods use the default AWS credential chain
    to obtain temporary credentials for that role. Using a dedicated service account per workload or per permission boundary
    prevents unrelated pods in the same namespace from inheriting the same AWS access and aligns permissions more closely
    to the actual application function.
  impact: This control improves permission isolation and usually makes auditing easier, but it increases the number of service
    accounts, IAM roles, and role associations that must be created and maintained. If a pod is left on the namespace default
    service account, or if the wrong service account is referenced in the workload spec, the pod may fail to access required
    AWS resources or may run with a broader identity than intended.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
