    the control because kubelet settings are applied through managed node configuration

    and bootstrap behavior, rather than being reliably visible only as process flags.

    Using the api configz endpoint search for the status of readOnlyPort by extracting the

    live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

