- id: 3.2.6
  title: Ensure the kubelet event recording QPS is set to an appropriate value
  scoring: scored
  profile:
  - Level 1
  description: In EKS, this control is about tuning how quickly the kubelet records events so worker nodes capture useful
    operational data without generating unnecessary event volume. AWS documents the kubelet as a customer-configurable component
    in EKS and supports kubelet tuning through managed node configuration paths such as launch templates, while the Kubernetes
    kubelet configuration defines eventRecordQPS with a default value of 50 events per second.
  rationale: The setting eventRecordQPS is the kubelet rate limit for event creation. Kubernetes defines 50 as the default
    and states that 0 removes the limit entirely. AWS’s EKS scaling guidance explains that Kubernetes components use QPS-based
    controls to avoid overwhelming downstream services and warns that removing a kubelet-side bottleneck can shift pressure
    to the next link in the service chain. In practice, that means a value that is too low can suppress event creation during
    burst conditions such as node instability, container restart loops, or rapid scheduling churn, while a value of 0 can
    allow unrestricted event generation and increase load on the API path and related control plane components. This setting
    should therefore be tuned through supported node configuration rather than treated as an arbitrary host-level change.
  impact: Setting eventRecordQPS too low can throttle or suppress relevant kubelet events during burst conditions, which reduces
    diagnostic visibility. Leaving it at an appropriate bounded value, such as the default of 50, helps preserve event capture
    while limiting event traffic. Setting it to 0 removes the rate limit entirely, which can allow unbounded event generation
    from the node in EKS. AWS warns that removing a kubelet-side QPS bottleneck can overwhelm downstream components above
    a certain rate, so this can contribute to denial-of-service conditions caused by load on the API path or related services
    rather than simply improving event capture.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/bestpractices/kubernetes_scaling_theory.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
  page_start: 56
  audit_raw: 'To audit whether the kubelet event recording QPS is appropriately set on an Amazon

    EKS worker node, query the live effective kubelet configuration through the Kubernetes

    API server proxy and inspect the kubelet configz output for eventRecordQPS.

    Kubernetes identifies configz as the view of the kubelet’s final actuated configuration,

    and AWS notes that kubelet QPS settings are part of the customer-configurable side of

    EKS and can affect downstream components if changed carelessly.

    Using the api configz endpoint search for the status of eventRecordQPS by extracting

    the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to eventRecordQPS":50 in the output

    To interpret the result:

    • 50 = Using the kubelet schema default unless it has been explicitly overridden.

    Kubernetes defines 50 as the default value for eventRecordQPS.

    • 0 = No rate limit is enforced. This should be reviewed carefully because

    Kubernetes defines 0 as unlimited event creation, and AWS warns that removing

    a kubelet-side QPS bottleneck can overwhelm downstream components above a

    certain rate.

    • Value greater than 50 = Event creation is rate-limited to that configured value

    and should be evaluated against the cluster’s event volume and diagnostic

    needs.

    • null or missing = Investigate further by reviewing the raw configz response

    and the node bootstrap path, because configz is the authoritative view of the

    kubelet’s final actuated configuration.'
  remediation: 'If the audit shows eventRecordQPS is set too low, the worker node may throttle useful

    event creation during burst conditions and should be adjusted. If the value is 0,

    Kubernetes defines that as no limit enforced, so it should be used only when the

    additional event volume is intentional and downstream capacity has been considered. If

    the field is missing or null, first confirm the configz response is complete, because

    Kubernetes identifies configz as the view of the kubelet’s final actuated configuration.

    In EKS, remediation should be made through the supported node provisioning or node

    update workflow, not by directly editing the kubelet config file on the host, because AWS

    applies deeper node customization through launch templates and merged bootstrap

    user data.

    Remediation of new cluster

    When creating a new EKS cluster or node group, set eventRecordQPS so worker nodes

    capture useful events without creating unnecessary downstream load. Kubernetes

    defines the default as 50 and 0 as unlimited, so the starting point is usually the default

    unless observed event loss justifies a different value. In EKS, apply this through

    supported node configuration such as launch-template-based bootstrap customization.

    • Define eventRecordQPS in the node bootstrap configuration so the intended rate

    limit is applied when nodes join the cluster.

    • Start from the default of 50 unless measured event loss or burst conditions justify

    a change.

    • Avoid 0 unless unlimited event creation is intentional and monitored, because it

    removes the kubelet-side rate limit entirely.

    • Use a custom launch template or equivalent supported node customization path

    when this setting must be enforced as part of node build or bootstrap behavior.

    • Validate after deployment that the live kubelet configuration reflects the intended

    eventRecordQPS value.

    Remediation of existing running cluster

    For an existing EKS cluster, update the node launch configuration so replacement

    nodes start with the corrected eventRecordQPS value, then roll or replace the current

    nodes so the change is applied consistently across the node group. AWS documents

    that when a managed node group uses your custom launch template, updating to a new

    version of that template recycles all nodes in the group to match the new configuration.

    • Update the custom launch template or equivalent bootstrap configuration so the

    effective kubelet setting resolves to the intended eventRecordQPS value.

    • Raise the value when relevant events are being throttled lower it when event

    volume is excessive avoid 0 unless unlimited event creation is justified and

    downstream impact is understood.

    • Apply the new launch template version to the managed node group so EKS

    replaces nodes with the corrected configuration.

    • If the existing node group was not created with a custom launch template, build a

    new node group with the required configuration and migrate workloads to it,

    because AWS says those existing groups cannot be updated directly to use a

    custom launch template.

    • Re-audit the replacement nodes against the live kubelet configuration and

    confirm the new value provides the intended balance between event capture and

    downstream load.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because the effective kubelet configuration can come

    from multiple sources, and AWS applies node behavior through bootstrap user data and

    launch configuration. A host-level edit can therefore be overridden and lost when the

    node is recycled or replaced.'
  checks:
  - type: sql
    command: show something similar to eventRecordQPS":50 in the output
    severity: medium
    info: 'To audit whether the kubelet event recording QPS is appropriately set on an Amazon

      EKS worker node, query the live effective kubelet configuration through the Kubernetes

      API server proxy and inspect the kubelet configz output for eventRecordQPS.

      Kubernetes identifies configz as the view of the kubelet’s final actuated configuration,

      and AWS notes that kubelet QPS settings are part of the customer-'
- id: 3.2.7
  title: Ensure the kubelet client certificate rotation is enabled
  scoring: scored
  profile:
  - Level 1
  description: In EKS, the setting rotateCertificates is about whether the kubelet renews its client certificate before that
    certificate expires. The EKS default is that certificate rotation is not enabled by default for self-managed EKS nodes,
    and AWS warns that a node running longer than one year can stop authenticating to the Kubernetes API if rotation stays
    disabled. In practice, that means true is the recommended operational state for long-lived nodes, while false or a not
    present setting should be treated as rotation not enabled. In addition, rotateCertificates should be not be confused with
    a similar setting 'RotateKubeletServerCertificate'. Client certificate rotation affects the certificate the kubelet uses
    when it authenticates to the Kubernetes API server. By contrast, RotateKubeletServerCertificate refers to the kubelet’s
    serving certificate, which is the certificate the kubelet presents from its own HTTPS endpoint when another component
    connects to it. AWS’s certificate-signing guidance reflects that distinction by noting that Amazon EKS does not support
    client certificate signing with the Amazon EKS CA signer, while AWS also shows certificate-signing workflows for server-auth
    use cases, and AWS Auto Mode separately highlights automated certificate management and rotation as part of the node security
    model.
  rationale: Enabling kubelet client certificate rotation allows the kubelet to automatically generate a new key and submit
    a new certificate signing request through the Kubernetes API before its current client certificate expires. AWS documents
    that kubelet certificates on self-managed EKS nodes have a one-year lifetime and that certificate rotation is not enabled
    by default, so a long-lived node can lose the ability to authenticate to the Kubernetes API unless the node is regularly
    recreated or client certificate rotation is enabled. In practical terms, a setting of true means the kubelet is configured
    to renew its client certificate, while false or not present should be interpreted conservatively as rotation not enabled
    unless the platform is explicitly managing certificate renewal for you. AWS also shows that some environments, such as
    EKS Auto Mode, can handle certificate management and rotation automatically. This setting is distinct from RotateKubeletServerCertificate.
    Client certificate rotation protects the certificate the node uses to authenticate to the API server, while server certificate
    rotation separately governs the certificate the kubelet presents from its HTTPS endpoint to callers.
  impact: When kubelet client certificate rotation is enabled, long-lived EKS worker nodes are less likely to lose access
    to the Kubernetes API because the kubelet can renew its client certificate before it expires. When the setting is false
    or not present, the node depends on replacement or another renewal process to avoid certificate expiry, and AWS explicitly
    warns that self-managed EKS nodes running longer than one year can stop authenticating to the API if rotation is not enabled.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/eks-outposts-self-managednodes.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/autosecure.html
  page_start: 60
  audit_raw: 'To audit whether the kubelet client certificate rotation is enabled on an Amazon EKS

    worker node, query the live effective kubelet configuration through the Kubernetes API

    server proxy and inspect the kubelet configz output for rotateCertificates.

    Kubernetes identifies configz as the view of the kubelet’s final actuated configuration,

    and AWS documents that EKS nodes can rely on certificate rotation or regular node

    replacement to avoid kubelet client certificate expiry. For self-managed EKS nodes,

    AWS explicitly states that certificate rotation is not enabled by default and that nodes

    running longer than one year can lose the ability to authenticate to the Kubernetes API if

    rotation is not enabled.

    Using the api configz endpoint search for the status of rotateCertificates by

    extracting the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to "rotateCertificates":true in the output

    To interpret the result:

    • true = Pass. Client certificate rotation is enabled, so the kubelet is configured to

    renew its client certificate through the Kubernetes certificate lifecycle before

    expiry.

    • false = Fail. Client certificate rotation is disabled. AWS warns that for selfmanaged EKS nodes on Outposts, nodes can
    lose Kubernetes API

    authentication after certificate expiry if rotation is not enabled and nodes are not

    recreated.

    • null or missing = Investigate further, but treat it conservatively as not enabled

    unless your platform explicitly manages certificate rotation for you. Kubernetes

    documents rotateCertificates with a default of false, and AWS documents

    automated certificate management and rotation for EKS Auto Mode as a

    separate managed behavior.'
  remediation: 'If the audit returns false, the worker node is not configured to rotate its kubelet client

    certificate and should be treated as noncompliant. If the field is not present, interpret

    that conservatively as rotation not enabled unless your EKS platform explicitly manages

    certificate rotation for you. AWS’s self-managed EKS node guidance states that kubelet

    certificates have a one-year expiration, that certificate rotation is not enabled by default,

    and that nodes can lose the ability to authenticate to the Kubernetes API if they remain

    in service beyond that period without renewal. Kubernetes also defines

    rotateCertificates as the kubelet setting that enables client certificate rotation and

    gives it a default of false.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure worker nodes

    start with kubelet client certificate rotation enabled if the nodes may remain in service

    long enough for certificate expiry to matter. In EKS, this should be applied through the

    supported node bootstrap and launch configuration path rather than as a host-level edit,

    because AWS documents launch templates as the mechanism for deeper managed

    node customization.

    • Set rotateCertificates: true in the worker node’s kubelet configuration.

    • Use a custom launch template when this setting must be enforced at node

    creation.

    • Apply the setting through the supported bootstrap path, not by editing the host

    after deployment.

    • Verify the live kubelet configuration shows rotation enabled.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to update the node launch configuration so

    replacement nodes start with kubelet client certificate rotation enabled, then replace the

    current nodes so the corrected state is applied consistently across the node group.

    AWS documents that when a managed node group was created with your own launch

    template, you can update it to a new version of that same template, and all nodes in the

    group are recycled to match the new configuration.

    • Update the launch template or bootstrap configuration so rotateCertificates:

    true is applied.

    • Roll the managed node group so replacement nodes launch with the corrected

    setting.

    • If the node group was not created from your own launch template, create a new

    node group with the required configuration and migrate workloads.

    • Re-audit replacement nodes to confirm client certificate rotation is enabled.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because AWS applies durable node behavior through

    launch templates and node replacement workflows. A host-level change can be

    bypassed by the node’s launch configuration and lost when the node is recycled or

    replaced.'
  checks:
  - type: sql
    command: show something similar to "rotateCertificates":true in the output
    severity: medium
    info: 'To audit whether the kubelet client certificate rotation is enabled on an Amazon EKS

      worker node, query the live effective kubelet configuration through the Kubernetes API

      server proxy and inspect the kubelet configz output for rotateCertificates.

      Kubernetes identifies configz as the view of the kubelet’s final actuated configuration,

      and AWS documents that EKS nodes can rely on certificate rotati'
- id: 3.2.8
  title: Ensure serverTLSBootstrap and RotateKubeletServerCertificate are enabled
  scoring: scored
  profile:
  - Level 1
  description: In EKS, these settings are about the kubelet’s serving certificate, which is the certificate the kubelet presents
    from its HTTPS endpoint to callers. serverTLSBootstrap controls whether the kubelet uses the Kubernetes certificates API
    to bootstrap that serving certificate, while RotateKubeletServerCertificate keeps the related rotation support enabled
    when feature gates are managed. In EKS, these settings should remain enabled together so the kubelet can participate in
    an automated servingcertificate lifecycle instead of relying on a static or separately managed certificate path. AWS documents
    serverTLSBootstrap as a managed kubelet field in eksctl, and also warns that if custom feature gates are supplied, featureGates.RotateKubeletServerCertificate=true
    should still be included unless you intentionally disable it.
  rationale: These two settings are tightly coupled, but they perform different functions. serverTLSBootstrap=true puts the
    kubelet on the Kubernetes certificate-signing workflow for its serving certificate, rather than leaving that HTTPS endpoint
    on a selfsigned or separately managed certificate path. RotateKubeletServerCertificate=true keeps the related rotation
    support enabled, which matters because AWS documents that if custom feature gates are supplied in eksctl, featureGates.RotateKubeletServerCertificate=true
    should still be included unless you intentionally disable it. The Kubernetes Certificates API automates X.509 provisioning
    through CSRs, supports server auth certificates, and uses a one-year default and maximum certificate lifetime for that
    signer profile. In addition, client certificate signing is not supported, which helps distinguish this control from kubelet
    client certificate rotation. When both settings are true, the kubelet is configured to bootstrap into a CSR-based serving-certificate
    lifecycle and to keep the server-certificate rotation feature available for that lifecycle. If serverTLSBootstrap is false,
    the kubelet does not enter that bootstrap flow. If RotateKubeletServerCertificate is not enabled when custom feature gates
    are managed, the intended serving-certificate automation can be weakened or disabled.
  impact: Enabling both settings helps keep the kubelet HTTPS endpoint on an automated serving-certificate lifecycle instead
    of depending on a static or self-managed certificate path. In practical terms, that improves continuity for long-lived
    nodes because the certificate workflow is bootstrapped and rotation support remains available. If either setting is not
    enabled, the intended serving-certificate automation is incomplete, which can leave the kubelet endpoint relying on a
    less durable certificate management approach.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/eksctl/customizing-the-kubelet.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/hybrid-nodesbottlerocket.html
  page_start: 64
  audit_raw: 'To audit whether kubelet serving certificate bootstrap and server certificate rotation are

    enabled on an Amazon EKS worker node, query the live effective kubelet configuration

    through the Kubernetes API server proxy and inspect the kubelet configz output for

    both serverTLSBootstrap and featureGates.RotateKubeletServerCertificate.

    Kubernetes identifies configz as the view of the kubelet’s final actuated configuration.

    AWS documents that serverTLSBootstrap is a managed kubelet field in eksctl, and

    also warns that when custom featureGates are supplied,

    RotateKubeletServerCertificate can be unset unless you include it explicitly.

    Using the api configz endpoint search for the status of serverTLSBootstrap and

    RotateKubeletServerCertificate by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to "serverTLSBootstrap":true and

    "RotateKubeletServerCertificate":true in the output

    To interpret the result:

    • serverTLSBootstrap=true and RotateKubeletServerCertificate=true =

    Pass. The kubelet is configured to bootstrap its serving certificate through the

    Kubernetes certificates API, and the related rotation support is enabled.

    • serverTLSBootstrap=true and RotateKubeletServerCertificate=false =

    Fail. Kubernetes says the feature must be enabled when serverTLSBootstrap

    is set, and AWS warns this gate can become unset when custom feature gates

    are provided.

    • serverTLSBootstrap=false and RotateKubeletServerCertificate=true =

    Fail. Rotation support is available, but the kubelet is not configured to enter the

    serving-certificate bootstrap workflow. Kubernetes lists the default for

    serverTLSBootstrap as false.

    • serverTLSBootstrap=false and RotateKubeletServerCertificate=false

    = Fail. Neither the bootstrap setting nor the related rotation support is enabled.

    • serverTLSBootstrap is null or missing = Treat as not enabled unless you

    have another authoritative source showing it is being set outside the visible

    kubelet config. Kubernetes lists the default as false.

    • RotateKubeletServerCertificate is null or missing = Investigate further. In

    current Kubernetes, the feature may be enabled by default, but AWS specifically

    says that if you provide custom featureGates in eksctl, you should explicitly

    include RotateKubeletServerCertificate=true or it will be unset.'
  remediation: 'If the audit shows serverTLSBootstrap is false, the kubelet is not entering the

    Kubernetes certificates API workflow for its serving certificate and the node should be

    treated as noncompliant. If RotateKubeletServerCertificate is false, or becomes

    unset because custom feature gates were supplied without re-including it, the related

    server certificate rotation support is not being preserved. If either field is missing, first

    confirm the configz response is complete, because Kubernetes identifies that endpoint

    as the view of the kubelet’s final actuated configuration. In EKS, remediation should be

    performed through the supported node provisioning or node update workflow, not by

    directly editing the kubelet config file on the host, because AWS applies durable node

    behavior through launch templates, merged user data, and managed node replacement

    workflows. AWS also documents that serverTLSBootstrap is a managed kubelet field

    in eksctl, and warns that when custom featureGates are provided you should

    explicitly include RotateKubeletServerCertificate=true or it will be unset.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure the kubelet starts

    with serving certificate bootstrap enabled and the related rotation support preserved. As

    the two settings work together, serverTLSBootstrap=true places the kubelet on the

    CSR-based serving-certificate workflow, while

    RotateKubeletServerCertificate=true keeps the required rotation feature enabled

    when feature gates are managed. AWS documents launch templates as the supported

    path for deeper managed node customization.

    • Set serverTLSBootstrap: true in the worker node kubelet configuration.

    • Ensure featureGates.RotateKubeletServerCertificate: true is included,

    especially if custom feature gates are supplied.

    • Apply both settings through the supported bootstrap path, such as your launchtemplate-based node configuration, rather
    than by changing the host after

    deployment.

    • Verify the live kubelet configuration shows both settings enabled.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to update the node launch configuration so

    replacement nodes start with both serving certificate bootstrap and rotation support

    enabled, then replace the current nodes so the corrected state is applied consistently

    across the node group. AWS documents that when a managed node group uses your

    own launch template, updating to a new version of that same launch template recycles

    all nodes to match the new configuration.

    • Update the launch template or equivalent bootstrap configuration so

    serverTLSBootstrap: true is applied.

    • Add or preserve featureGates.RotateKubeletServerCertificate: true if

    custom feature gates are present.

    • Roll the managed node group so replacement nodes launch with the corrected

    settings.

    • If the node group was not created from your own launch template, create a new

    node group with the required configuration and migrate workloads, because AWS

    says existing node groups without a custom launch template cannot be updated

    directly that way.

    • Re-audit replacement nodes to confirm both settings are enabled in the live

    kubelet configuration.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because Amazon EKS merges required user data for

    managed nodes, says not to include commands that start or modify kubelet in that

    merged user data path, and applies durable configuration changes through launchtemplate updates and node replacement.
    A host-level change can therefore be

    overridden and lost when the node is recycled or replaced.'
  checks:
  - type: sql
    command: show something similar to "serverTLSBootstrap":true and
    severity: medium
    info: 'To audit whether kubelet serving certificate bootstrap and server certificate rotation are

      enabled on an Amazon EKS worker node, query the live effective kubelet configuration

      through the Kubernetes API server proxy and inspect the kubelet configz output for

      both serverTLSBootstrap and featureGates.RotateKubeletServerCertificate.

      Kubernetes identifies configz as the view of the kubelet’s final act'
- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that cluster-wide administrative access in Amazon EKS is granted only to identities with a documented
    need for full cluster administration. In EKS, this review should cover access entries associated with AmazonEKSClusterAdminPolicy,
    legacy aws-auth and Kubernetes group mappings that lead to ClusterRoleBinding assignments, and any service accounts bound
    to cluster-wide administrative permissions. Where administration is limited to a team, application, or namespace boundary,
    use a narrower authorization model instead of cluster-wide admin access.
  rationale: This setting enforces least privilege across the most sensitive EKS authorization paths. AWS states that access
    entries are the best way to grant users access to the Kubernetes API and that they support granular permission assignment,
    including modifying or revoking cluster-admin access from the original cluster creator. AWS also distinguishes cluster-wide
    administration through AmazonEKSClusterAdminPolicy from the more limited AmazonEKSAdminPolicy, which is typically scoped
    to one or more namespaces. In parallel, AWS notes that the IAM principal that creates the cluster is automatically granted
    system:masters permissions, and its RBAC hardening guidance warns that DaemonSet and CSI driver service account permissions
    can be effectively exposed from every node in the cluster. Together, these EKS behaviors make it important to keep cluster-admin
    use exceptional, tightly bounded, and reviewable.
  impact: If cluster-admin is assigned too broadly in EKS, a compromised IAM principal or overprivileged service account can
    gain effective control over resources across all namespaces, increasing the chance that a single credential exposure or
    node-level compromise becomes a cluster-wide security or availability incident. The risk is greater when the affected
    workload also has AWS IAM permissions through IRSA or Pod Identity, because exposure can extend beyond Kubernetes RBAC
    into AWS API access.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 70
  audit_raw: "This audit reviews Kubernetes ClusterRoleBinding objects in the Amazon EKS\ncluster to identify principals that\
    \ are directly granted the cluster-admin ClusterRole.\nIt lists each matching binding and its associated users, groups,\
    \ or service accounts so\nthe reviewer can verify whether full cluster-wide administrative access is justified.\nBecause\
    \ EKS can also grant Kubernetes API access through access entries, access\npolicies, and legacy IAM-to-Kubernetes group\
    \ mappings, this check should be used as\na partial review of administrative privilege rather than the sole test of cluster-admin\n\
    exposure.\nkubectl get clusterrolebindings -o json | jq -r '\n  ([\"BINDING\",\"KIND\",\"NAMESPACE\",\"NAME\"] | join(\"\
    \ | \")),\n  (\n    .items[]\n    | select(.roleRef.name==\"cluster-admin\")\n    | .metadata.name as $binding\n    |\
    \ (.subjects // [])[]\n    | [$binding, .kind, (.namespace // \"-\"), .name]\n    | join(\" | \")\n  )\n'\nExample output\
    \ with headers and piped separation of values. Review each principal\nlisted and ensure that cluster-admin privilege is\
    \ required for it.\nBINDING | KIND | NAMESPACE | NAME\ncluster-admin | Group | - | system:masters\nmy-admin-binding |\
    \ User | - | admin-user\nci-cluster-admin | ServiceAccount | cicd | deploy-bot\neks:addon-cluster-admin | User | - | eks:addon-manager"
  remediation: 'Review each ClusterRoleBinding identified by the audit that grants the Kubernetes

    cluster-admin ClusterRole, and determine whether the listed user, group, or service

    account still requires full cluster-wide administrative access. In Amazon EKS, this

    review should also account for access granted through EKS access entries and access

    policies, because AWS recommends access entries as the preferred way to grant

    Kubernetes API access. Where responsibilities are limited to a namespace, workload,

    or operational function, replace cluster-wide administration with a narrower authorization

    model.

    • Review each principal returned by the audit and confirm whether full cluster-wide

    administrative access is still justified for that identity.

    • For IAM principals managed through EKS access entries, remove or downgrade

    any association to AmazonEKSClusterAdminPolicy and use a narrower access

    policy where possible, such as AmazonEKSAdminPolicy with namespace scope.

    • For principals granted access through Kubernetes RBAC, replace unnecessary

    cluster-admin bindings with a lower-privilege Role, ClusterRole, or namespacescoped RoleBinding that matches the approved
    operational need.

    • Validate that the replacement access allows the user, group, or service account

    to perform its approved tasks before removing the original cluster-admin

    binding.

    • Remove the unneeded ClusterRoleBinding only after the reduced-privilege

    access has been confirmed to work as intended.

    • Do not remove EKS-managed bindings such as eks:addon-cluster-admin

    unless you intentionally want Amazon EKS to stop managing add-ons in the

    cluster.

    • Review the original cluster creator separately, because AWS notes that this

    principal is automatically granted elevated cluster access and should not remain

    the default path for routine administration.

    Where possible, first assign a lower-privilege role, validate required access, and then

    remove the ClusterRoleBinding that grants cluster-admin:

    kubectl delete clusterrolebinding [name]'
  checks:
  - type: manual_review
    info: 'This audit reviews Kubernetes ClusterRoleBinding objects in the Amazon EKS

      cluster to identify principals that are directly granted the cluster-admin ClusterRole.

      It lists each matching binding and its associated users, groups, or service accounts so

      the reviewer can verify whether full cluster-wide administrative access is justified.

      Because EKS can also grant Kubernetes API access through access entries, access

      policies, and legacy IAM-to-Kubernetes group mappings, this check should be used as'
    severity: medium
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in EKS is granted only to IAM principals, Kubernetes users
    or groups, and service accounts with a defined operational or workload need. The review should cover EKS access entries
    and associated access policies, Kubernetes RBAC roles and bindings, and service account permissions, with particular attention
    to permissions that allow get, list, or watch access to Secrets. Where access is needed, scope it as narrowly as possible,
    because EKS access policies can be limited to specific namespaces instead of the entire cluster.
  rationale: This requirement reduces unnecessary exposure to one of the most sensitive resource types in an EKS cluster.
    AmazonEKSAdminViewPolicy allows an IAM principal to list and view all cluster resources, and explicitly notes that this
    includes Kubernetes Secrets. Access policies attached to EKS access entries can be scoped to all resources in the cluster
    or to specific namespaces, and that when an access entry also uses Kubernetes group names, the principal receives the
    combined permissions from both the associated access policies and any Kubernetes RBAC objects bound to those groups. Minimizing
    Secrets access therefore helps prevent broad read access from being granted through overlapping EKS and Kubernetes authorization
    paths. For workloads, least-privilege access should be applied to both Kubernetes service accounts and AWS IAM roles.
    IAM roles for service accounts help isolate credentials and scope AWS access, but unauthorized node access can expose
    projected service account tokens and, when Pod Identity or IRSA is used, may also allow retrieval of AWS IAM credentials.
    Excessive Secrets access combined with overprivileged workload identities can then expand a pod or node compromise beyond
    Kubernetes RBAC into AWS API access.
  impact: If access to Secrets is granted too broadly in EKS, a compromised IAM principal, Kubernetes subject, or service
    account can retrieve sensitive cluster data and use it to expand the scope of an incident across namespaces or into AWS
    services when workload IAM credentials are also available. That increases the likelihood that a single credential exposure,
    pod compromise, or node-level breach becomes a wider security event.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/access-policypermissions.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 73
  audit_raw: 'Start by reviewing every path that can grant access to Kubernetes Secret objects in the

    EKS cluster. Start with EKS access entries and associated access policies, because

    EKS policies can grant Kubernetes permissions without native RBAC objects, and

    AmazonEKSAdminViewPolicy includes permission to view Kubernetes Secrets. Then

    review Kubernetes RBAC, service account permissions, and any remaining legacy awsauth mappings, because EKS can authorize
    access through multiple overlapping

    models and policy scope can be either cluster-wide or namespace-scoped.

    • Review EKS access entries and associated access policies for IAM principals

    that can access the Kubernetes API, and identify any policy scope broad enough

    to expose Secrets. Check whether access is cluster-wide or limited to specific

    namespaces.

    • Review Kubernetes RBAC roles and bindings that grant get, list, or watch on

    secrets, and determine which users, groups, and service accounts actually

    receive that access. Give extra scrutiny to cluster-scoped roles and broadly

    shared bindings.

    • Review workload service accounts that can access Secrets and confirm that

    each one has a defined workload need. Pay particular attention to DaemonSets,

    CSI drivers, and other broadly deployed components because node compromise

    can expose projected service account tokens and related permissions.

    • Review any remaining legacy aws-auth mappings, because they can still place

    IAM principals into Kubernetes groups that later receive Secrets access through

    RBAC bindings.

    • Confirm that each access path is tied to a documented requirement, scoped to

    the smallest practical namespace or function, and no broader than necessary.

    Flag any unnecessary Secrets access through access policies, RBAC, or service

    accounts for remediation.

    Summary: Review EKS access entries, access policies, RBAC, and service accounts

    to verify that Secrets access is approved, minimally scoped, and granted only where

    required.'
  remediation: 'Start by reducing every access path that allows reading Kubernetes Secret objects in

    the EKS cluster. Start with EKS access entries and associated access policies, because

    EKS policies can grant Secrets access without native RBAC objects, and policies such

    as AmazonEKSAdminViewPolicy, AmazonEKSSecretReaderPolicy, and broader

    administrative policies can expose Secrets depending on scope. Then reduce

    unnecessary access in Kubernetes RBAC, service accounts, and any remaining legacy

    aws-auth mappings, and replace broad permissions with the narrowest namespace or

    workload scope that still supports the required function.

    • Remove or narrow EKS access policy associations that expose Secrets, and

    prefer namespace-scoped access over cluster-wide scope wherever possible.

    • Replace broad RBAC permissions on secrets with the smallest practical Role

    or ClusterRole, and remove unnecessary get, list, or watch access from

    users, groups, and service accounts.

    • Reduce service account access to Secrets to only the workloads that require it,

    and tighten any related IRSA or Pod Identity IAM permissions to least privilege.

    • Review DaemonSet and CSI driver service accounts first, because their tokens

    and permissions can be exposed from any node where those pods run.

    • Migrate remaining legacy aws-auth mappings to access entries where

    appropriate, and remove stale mappings that still place IAM principals into

    Kubernetes groups with Secrets access.

    • Validate that each remaining Secrets access path is tied to a documented

    operational or workload requirement, and flag any unnecessary access for

    removal.'
  checks:
  - type: manual_review
    info: 'Start by reviewing every path that can grant access to Kubernetes Secret objects in the

      EKS cluster. Start with EKS access entries and associated access policies, because

      EKS policies can grant Kubernetes permissions without native RBAC objects, and

      AmazonEKSAdminViewPolicy includes permission to view Kubernetes Secrets. Then

      review Kubernetes RBAC, service account permissions, and any remaining legacy awsauth mappings, because EKS can authorize
      access through multiple overlapping

      models and pol'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole objects in EKS do not use wildcard entries such as * for verbs,
    resources, or apiGroups unless a documented administrative or platform requirement exists. The review should also include
    the RoleBinding and ClusterRoleBinding objects that assign those roles to users, groups, or service accounts, because
    EKS can authorize access through both access entries and native Kubernetes RBAC, and principals can receive the combined
    permissions of associated access policies and RBAC bindings.
  rationale: This recommendation supports least-privilege authorization in the parts of EKS that still rely on Kubernetes
    RBAC. EKS guidance recommends access entries as the best way to grant users access to the Kubernetes API and highlights
    fine-grained permissions management, but it also makes clear that when predefined access policies do not meet a requirement,
    you should use Kubernetes groups and create your own Role and ClusterRole objects. EKS further notes that if an access
    entry has both associated access policies and Kubernetes group mappings, the IAM principal receives all permissions from
    both paths. In that model, wildcard rules make the effective privilege set harder to predict, harder to review, and easier
    to overextend across current and future resources. The risk is higher for service accounts used by DaemonSets and CSI
    drivers, because EKS RBAC hardening guidance treats those Kubernetes RBAC permissions as effectively reachable from every
    node where those pods run.
  impact: If wildcard permissions are used broadly in EKS, a user or service account can receive more access than intended
    across namespaces, resource types, or API actions, and that excess access can combine with other policy associations or
    workload credentials to widen the scope of compromise. When the affected identity is a broadly deployed service account
    or one linked to IRSA or Pod Identity, an overbroad RBAC rule can turn a single pod or node issue into unauthorized cluster
    changes or access to AWS APIs beyond the workload’s intended boundary.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/rbac-hardening.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 76
  audit_raw: "Begin by reviewing custom Kubernetes Role and ClusterRole objects in EKS to\nidentify any use of wildcard entries\
    \ such as * for verbs, resources, or apiGroups. In\nEKS, this review should cover native RBAC objects, access entries\
    \ that reference\nKubernetes groups, service accounts, and any remaining aws-auth mappings, because\nEKS supports access\
    \ through both access entries and Kubernetes RBAC, and it also\ncreates its own platform RBAC objects that should be distinguished\
    \ from customerdefined permissions.\n• Review custom Role and ClusterRole definitions for wildcard use in verbs,\nresources,\
    \ or apiGroups, and prioritize cluster-scoped roles because\nClusterRoles apply across the cluster.\nkubectl get roles,clusterroles\
    \ -A -o json | jq -r '\n  ([\"KIND\",\"NAMESPACE\",\"NAME\",\"WILDCARD_FIELDS\"] | join(\" | \")),\n  (\n    .items[]\n\
    \    | . as $r\n    | [\n        (if any(.rules[]?; any(.verbs[]?; .==\"*\")) then \"verbs\" else empty\nend),\n     \
    \   (if any(.rules[]?; any(.resources[]?; .==\"*\")) then \"resources\" else\nempty end),\n        (if any(.rules[]?;\
    \ any(.apiGroups[]?; .==\"*\")) then \"apiGroups\" else\nempty end)\n      ] as $wild\n    | select(($wild | length) >\
    \ 0)\n    | [\n        $r.kind,\n        ($r.metadata.namespace // \"-\"),\n        $r.metadata.name,\n        ($wild\
    \ | join(\",\"))\n      ]\n    | join(\" | \")\n  )\n'\nSample Output:\nKIND | NAMESPACE | NAME | WILDCARD_FIELDS\nClusterRole\
    \ | - | cluster-admin | verbs,resources,apiGroups\nClusterRole | - | eks:addon-manager | resources\nClusterRole | - |\
    \ eks:service-operations | resources\nClusterRole | - | system:controller:disruption-controller | apiGroups\nClusterRole\
    \ | - | system:controller:generic-garbage-collector |\nresources,apiGroups\nClusterRole | - | system:controller:horizontal-pod-autoscaler\
    \ |\nresources,apiGroups\nClusterRole | - | system:controller:namespace-controller |\nresources,apiGroups\nClusterRole\
    \ | - | system:controller:resourcequota-controller |\nresources,apiGroups\nClusterRole | - | system:kube-controller-manager\
    \ | resources,apiGroups\nClusterRole | - | system:kubelet-api-admin | verbs\n• Review the RoleBinding and ClusterRoleBinding\
    \ assignments for those roles\nto identify which users, groups, and service accounts actually receive the\nwildcard permissions,\
    \ and separate EKS-created bindings from customermanaged ones during the review.\n• Review access entries that reference\
    \ Kubernetes groups, because EKS allows\npermissions to be attached through access policies or through Kubernetes\ngroups\
    \ backed by RBAC objects, which means wildcard roles can still be granted\nthrough group-based authorization paths.\n\
    • Review service accounts for DaemonSets, CSI drivers, and other broadly\ndeployed controllers first, because EKS RBAC\
    \ hardening guidance specifically\ncalls for reviewing the ClusterRoles bound to those service accounts and\nremoving\
    \ permissions that are not required.\n• Review any remaining legacy aws-auth mappings, because IAM principals can\nstill\
    \ be mapped into Kubernetes groups that may be bound to wildcard roles.\n• Confirm that each wildcard rule has a documented\
    \ operational or platform need.\nWhere it does not, flag it for remediation and replace it with enumerated\nresources,\
    \ verbs, API groups, or narrower namespace-scoped roles. EKS\nguidance favors fine-grained permissions and least-privilege\
    \ review of RBAC\nassignments.\nSummary: Review custom RBAC roles, bindings, group mappings, and service\naccounts to\
    \ verify that wildcard permissions are rare, justified, and no broader than\nrequired."
  remediation: 'Start by replacing wildcard permissions in custom Role and ClusterRole objects with

    explicitly enumerated verbs, resources, and apiGroups that match the approved

    operational need. In EKS, this remediation should focus on customer-managed RBAC

    objects, the bindings that assign them, access entries that reference Kubernetes

    groups, and service accounts used by workloads or cluster components. EKS guidance

    favors fine-grained access through access entries and least-privilege review of RBAC

    permissions, especially for service accounts used by add-ons, DaemonSets, and CSI

    drivers.

    • Replace wildcard values in custom Role and ClusterRole rules with the specific

    verbs, resources, and apiGroups the function actually requires.

    • Reduce or remove any RoleBinding and ClusterRoleBinding that assign those

    wildcard roles more broadly than necessary, and prefer namespace-scoped

    bindings where possible.

    • Review access entries that use Kubernetes groups, because those groups can

    still receive wildcard permissions through native RBAC even when IAM

    authentication is managed through EKS.

    • Review service accounts for DaemonSets, CSI drivers, and other broadly

    deployed controllers first, and remove wildcard permissions that are not required

    for their runtime behavior.

    • Distinguish customer-managed roles from EKS-created platform roles before

    making changes, and avoid modifying EKS-managed RBAC objects unless you

    intentionally want to change how a platform component operates.

    • After narrowing the role definition, validate that the user, group, or service

    account can still perform its approved tasks, then remove the superseded

    wildcard role or binding.'
  checks:
  - type: manual_review
    info: 'Begin by reviewing custom Kubernetes Role and ClusterRole objects in EKS to

      identify any use of wildcard entries such as * for verbs, resources, or apiGroups. In

      EKS, this review should cover native RBAC objects, access entries that reference

      Kubernetes groups, service accounts, and any remaining aws-auth mappings, because

      EKS supports access through both access entries and Kubernetes RBAC, and it also

      creates its own platform RBAC objects that should be distinguished from customerdefined permis'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create Pods in EKS is a high-risk permission that should be limited to approved deployment and
    operational functions. In EKS, Pod creation can be granted through associated access policies or native Kubernetes RBAC,
    and policies such as AmazonEKSAdminPolicy and AmazonEKSEditPolicy include create access on pods. Because Pods run within
    a namespace, use a service account, and can carry workloadlevel permissions, Pod creation should be scoped to the smallest
    practical namespace and workload boundary.
  rationale: Creating a Pod can allow a principal to run code with the permissions of the service account assigned to that
    Pod. EKS Pods use Kubernetes service accounts, that dedicated service accounts should be used for applications, and that
    token automounting should be disabled when Kubernetes API access is not needed. Those behaviors make Pod creation more
    than a routine write permission, because it can become a path to exercise Kubernetes API permissions indirectly through
    workload identity. The risk can extend beyond Kubernetes RBAC into AWS access. With IRSA or EKS Pod Identity, a Kubernetes
    service account can be associated with an IAM role, allowing Pods to obtain AWS credentials for API calls. EKS pod security
    guidance also identifies higher-risk Pod behaviors such as privileged execution and hostPath usage, which means the ability
    to create Pods can also expose host-level or node-adjacent attack paths if security controls do not constrain the Pod
    spec.
  impact: If Pod creation is granted too broadly in EKS, a user or workload can launch Pods under available service accounts
    and gain unintended Kubernetes or AWS access, increasing the risk of privilege escalation and wider cluster impact.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/access-policypermissions.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 81
  audit_raw: 'Begin by reviewing every path that can grant the ability to create Pods in EKS. Start

    with access entries and associated access policies, because AmazonEKSAdminPolicy

    and AmazonEKSEditPolicy include create access for pods. Then review Kubernetes

    RBAC, service accounts, and Pod security controls, because Pod creation can allow an

    identity to launch workloads under available service accounts and potentially exercise

    both Kubernetes and AWS permissions.

    • Review access entries and associated access policies for principals that can

    access the Kubernetes API, and identify any policy scope that allows create on

    pods. Check whether the scope is cluster-wide or namespace-scoped.

    • Review Role and ClusterRole assignments that allow create on pods, and also

    review deployments, daemonsets, statefulsets, jobs, and cronjobs,

    because those resources can launch Pods through controllers. Map each role to

    the principals that receive it.

    • Review service accounts used by workloads that can create or run Pods. Check

    for use of the default service account, and confirm whether token auto-mounting

    is disabled where Kubernetes API access is not needed.

    • Review workloads that use IRSA or EKS Pod Identity, because a Pod created

    under a linked service account can obtain AWS credentials in addition to

    Kubernetes API access. Confirm the IAM role is limited to the intended workload

    scope.

    • Review whether Pod creation can be paired with privileged execution, hostPath,

    or hostNetwork, and confirm that Pod Security Admission or policy-as-code

    controls restrict those settings where required.

    • Review any remaining legacy aws-auth usage if the cluster still uses

    CONFIG_MAP or API_AND_CONFIG_MAP, because IAM principals can still reach

    Kubernetes authorization through older mappings.

    Summary: Review access policies, RBAC, service accounts, and Pod controls to verify

    that Pod creation is tightly scoped and granted only where required.'
  remediation: 'Start by reducing every access path that allows Pod creation in EKS. Start with access

    entries and associated access policies, because AmazonEKSAdminPolicy and

    AmazonEKSEditPolicy include create access for pods, and access policies can be

    scoped to the cluster or to specific namespaces. Then reduce unnecessary permissions

    in Kubernetes RBAC, service accounts, and Pod security controls so Pod creation is

    limited to approved deployment paths and the smallest practical workload boundary.

    • Remove or narrow access policy associations that allow Pod creation, and prefer

    namespace-scoped access over cluster-wide scope wherever possible.

    • Replace broad RBAC permissions on pods, deployments, daemonsets,

    statefulsets, jobs, and cronjobs with the smallest Role or ClusterRole that

    supports the approved function.

    • Move workloads off the default service account, use dedicated service accounts,

    and disable automountServiceAccountToken where Kubernetes API access is

    not needed.

    • Tighten IRSA or EKS Pod Identity permissions for any service account that can

    run Pods so the linked IAM role is least privilege and workload-specific.

    • Restrict Pod specs that can increase the blast radius of Pod creation, including

    privileged mode, hostPath, and similar settings, by using Pod Security

    Admission or policy-as-code controls.

    • Review DaemonSet and other broadly deployed workloads first, because a

    service account used across many nodes can widen the impact of an

    overprivileged Pod creator.

    • Remove stale legacy aws-auth mappings where applicable so Pod creation is

    not still reachable through older group mappings in parallel with access entries.'
  checks:
  - type: manual_review
    info: 'Begin by reviewing every path that can grant the ability to create Pods in EKS. Start

      with access entries and associated access policies, because AmazonEKSAdminPolicy

      and AmazonEKSEditPolicy include create access for pods. Then review Kubernetes

      RBAC, service accounts, and Pod security controls, because Pod creation can allow an

      identity to launch workloads under available service accounts and potentially exercise

      both Kubernetes and AWS permissions.

      • Review access entries and associated access'
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used.
  scoring: scored
  profile:
  - Level 1
  description: Default service accounts in EKS should not be used as the active identity for ordinary application or automation
    workloads. If a Pod does not specify a service account, Kubernetes automatically assigns the namespace default service
    account, and that account can authenticate to the Kubernetes API through its mounted token. Workloads that need Kubernetes
    or AWS access should instead use an explicitly assigned, dedicated service account that matches the intended namespace,
    application, and permission boundary.
  rationale: This supports least privilege at the workload identity layer by using a dedicated service account for each application,
    including workloads that need Kubernetes API access, IRSA, or EKS Pod Identity. This allows RBAC and workload identity
    to be scoped to the specific resources and actions required by each application, instead of sharing one namespace-level
    identity across unrelated Pods. The default service account is especially risky when Pods inherit it implicitly. In EKS,
    workloads are automatically assigned a service account if one is not specified, and service account tokens are automatically
    mounted unless token auto-mounting is disabled. For workloads that need AWS access, EKS Pod Identity and IRSA both bind
    AWS permissions to a Kubernetes service account, so relying on the default account makes it harder to isolate AWS permissions
    cleanly and increases the chance that multiple workloads share the same Kubernetes and AWS identity path.
  impact: If the default service account is actively used in EKS, multiple Pods in the same namespace can inherit the same
    Kubernetes identity and any linked AWS permissions, which increases blast radius, weakens workload isolation, and reduces
    audit clarity when a Pod is compromised or misconfigured.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/service-accounts.html
  page_start: 84
  audit_raw: "Begin by identifying workloads in EKS that implicitly or explicitly use the namespace\ndefault service account.\
    \ This matters because Pods that do not specify\nserviceAccountName are assigned the default service account, workloads\
    \ that need\nAWS access should use a dedicated service account for IRSA or EKS Pod Identity, and\nworkloads that do not\
    \ need Kubernetes API access can disable token auto-mounting\nwith automountServiceAccountToken: false.\n• Review Deployments,\
    \ StatefulSets, DaemonSets, Jobs, CronJobs, and\nstandalone Pods for omitted serviceAccountName values or explicit use\
    \ of\ndefault.\nkubectl get deploy,sts,ds,job,cronjob,pod -A -o json | jq -r '\n  ([\"NAMESPACE\",\"KIND\",\"NAME\",\"\
    SERVICEACCOUNT\"] | @tsv),\n  (\n    .items[]\n    | if .kind==\"CronJob\" then\n        [.metadata.namespace, .kind,\
    \ .metadata.name,\n(.spec.jobTemplate.spec.template.spec.serviceAccountName // \"default\")]\n      elif .kind==\"Pod\"\
    \ then\n        [.metadata.namespace, .kind, .metadata.name,\n(.spec.serviceAccountName // \"default\")]\n      else\n\
    \        [.metadata.namespace, .kind, .metadata.name,\n(.spec.template.spec.serviceAccountName // \"default\")]\n    \
    \  end\n    | select(.[3]==\"default\")\n    | @tsv\n  )\n' | column -ts $'\\t'\nSample output:\nNAMESPACE    KIND   \
    \      NAME             SERVICEACCOUNT\nkube-public  Pod          file-check       default\ndefault      Deployment  \
    \ web-app          default\napps         StatefulSet  orders-db        default\nlogging      DaemonSet    fluentd    \
    \      default\nbatch        Job          nightly-report   default\n• Review the default service account in each namespace\
    \ and confirm it is not\nbound to unnecessary RoleBinding or ClusterRoleBinding permissions.\n• Review workload specs\
    \ for automountServiceAccountToken: false and\nconfirm it is set wherever the workload does not need Kubernetes API access.\n\
    Use the command below to find the automountServiceAccountToken\nsetting:\nkubectl get serviceaccount $SERVICE_ACCOUNT\
    \ -n $NAMESPACE -o yaml\n• Review workloads that use IRSA or EKS Pod Identity and confirm they use a\ndedicated service\
    \ account rather than the namespace default service account.\n• Flag any workload that still uses the default service\
    \ account or still auto-mounts\ntokens without a documented need for remediation."
  remediation: 'Create dedicated service accounts for workloads that need Kubernetes API access,

    IRSA, or EKS Pod Identity, and update those workloads to explicitly set

    serviceAccountNam rather than relying on the namespace default service account.

    For workloads that do not need Kubernetes API access, disable service account token

    auto-mounting and avoid using the default service account as the active workload

    identity. Also review the default service account in each namespace and ensure it is

    not bound to unnecessary RBAC permissions.

    Modify the default service account in each application namespace to set:

    automountServiceAccountToken: false

    Then validate workload manifests, because a Pod-level

    automountServiceAccountToken setting can override the service account setting, and

    workloads that actually need Kubernetes API access must use an explicitly assigned

    service account instead of inheriting default.

    Automatic remediation for one namespace:

    kubectl patch serviceaccount default -n <namespace> -p

    ''{"automountServiceAccountToken": false}'''
  checks:
  - type: manual_review
    info: 'Begin by identifying workloads in EKS that implicitly or explicitly use the namespace

      default service account. This matters because Pods that do not specify

      serviceAccountName are assigned the default service account, workloads that need

      AWS access should use a dedicated service account for IRSA or EKS Pod Identity, and

      workloads that do not need Kubernetes API access can disable token auto-mounting

      with automountServiceAccountToken: false.

      • Review Deployments, StatefulSets, DaemonSets, Jobs, C'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Service account tokens in EKS should be mounted only for Pods that require Kubernetes API access or an explicitly
    configured workload identity flow. EKS supports disabling automatic token mounting at the Pod or ServiceAccount level,
    and workloads that need AWS access through IRSA or EKS Pod Identity should use a dedicated service account rather than
    relying on broad default token mounting.
  rationale: 'This setting is important because a mounted service account token is an authentication credential. EKS documentation
    notes that Pods can authenticate to the Kubernetes API server with an auto-mounted token, and AWS recommends setting automountServiceAccountToken:
    false for applications that do not need access to Kubernetes resources. EKS also allows this behavior to be controlled
    either on the Pod spec or on the ServiceAccount, which supports making token mounting an intentional workload decision
    instead of a default behavior. The risk is higher when workload identity is involved. With IRSA, a Pod uses a web identity
    token associated with a Kubernetes service account to obtain AWS credentials, and with EKS Pod Identity, an IAM role is
    associated to a Kubernetes service account and credentials are then made available to the workload. AWS also documents
    that projected service account tokens can be exposed from node compromise scenarios, and if the service account is associated
    with an IAM role through IRSA or EKS Pod Identity, an exposed token can be used to obtain AWS IAM credentials.'
  impact: If service account tokens are mounted more broadly than necessary in EKS, more Pods than required receive credentials
    that can be used for Kubernetes API access and, in some cases, AWS IAM access, increasing the blast radius of a compromised
    or misconfigured workload.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-serviceaccounts.html
  page_start: 88
  audit_raw: 'Begin by reviewing where service account tokens are mounted in EKS and whether

    each mounted token supports a defined Kubernetes API or workload identity

    requirement. In EKS, Pods can receive a service account token automatically,

    automountServiceAccountToken can be disabled at the Pod or ServiceAccount

    level, and workloads that need AWS access through IRSA or EKS Pod Identity should

    use a dedicated service account instead of broad default token mounting.

    • Review Deployments, StatefulSets, DaemonSets, Jobs, CronJobs, and

    standalone Pods for serviceAccountName and

    automountServiceAccountToken, and identify workloads that still rely on

    default token mounting.

    • Review the automountServiceAccountToken setting on both the Pod and its

    associated ServiceAccount, and treat the Pod setting as authoritative where

    both are defined.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml

    Expected Output:

    automountServiceAccountToken: false

    • Review workloads that use IRSA or EKS Pod Identity and confirm they use a

    dedicated service account tied to the intended application and permission

    boundary.

    • Review RoleBindings and ClusterRoleBindings for service accounts that still

    mount tokens, and confirm the bound RBAC permissions are limited to the API

    resources and actions the workload actually needs.

    • Review DaemonSets, CSI drivers, and other broadly deployed Pods first,

    because service account permissions and projected tokens associated with

    those workloads can become reachable from any node where they run.

    • Review Pods that do not need Kubernetes API access and confirm token

    mounting is disabled, then flag any unnecessary token mount for remediation.'
  remediation: 'Apply the following steps to reduce unnecessary service account token mounting in

    EKS:

    • Set automountServiceAccountToken to false for Pods and ServiceAccounts

    that do not require Kubernetes API access. This reduces unnecessary default

    token auto-mounting.

    • Update workloads to use a dedicated serviceAccountName only where a

    service account token is operationally required, instead of inheriting token

    behavior from the namespace default service account. Each application should

    use its own dedicated service account.

    • For workloads that need AWS access, use IRSA or EKS Pod Identity with a

    dedicated service account rather than broad default token mounting. Both

    models associate AWS permissions to a Kubernetes service account for a

    specific workload boundary.

    • Revalidate workloads after the change to confirm that only Pods with a

    documented Kubernetes API or workload identity need continue to receive

    service account tokens.'
  checks:
  - type: command
    command: mount tokens, and confirm the bound RBAC permissions are limited to the API
    expected: ''
    severity: medium
    info: 'Begin by reviewing where service account tokens are mounted in EKS and whether

      each mounted token supports a defined Kubernetes API or workload identity

      requirement. In EKS, Pods can receive a service account token automatically,

      automountServiceAccountToken can be disabled at the Pod or ServiceAccount

      level, and workloads that need AWS access through IRSA or EKS Pod Identity should

      use a dedicate'
- id: 4.1.7
  title: Standardize EKS cluster access by using access entries, policies, and scoped permissions
  scoring: scored
  profile:
  - Level 1
  description: EKS provides the Cluster Access Management API, access entries, and associated access policies as the recommended
    way to manage IAM principal access to the Kubernetes API. This model is preferred over the deprecated aws-auth ConfigMap
    for cluster access management, supports cluster-wide or namespace-scoped permissions, and can also reference Kubernetes
    groups when native Role, ClusterRole, RoleBinding, or ClusterRoleBinding objects are needed for custom authorization.
    This access model applies to IAM users and roles that reach the cluster API, while Pod workload identity remains a separate
    service-account-based mechanism such as IRSA or EKS Pod Identity.
  rationale: 'This approach improves access control consistency because EKS access entries are managed through the EKS API
    rather than through manual aws-auth ConfigMap edits, and AWS identifies access entries as the best way to grant IAM principals
    access to the Kubernetes API. An access entry associates an IAM user or role with Kubernetes permissions in one of two
    ways: by attaching one or more associated access policies, or by specifying Kubernetes group names that are then authorized
    through native Kubernetes RBAC objects. The AWS-managed access policies contain Kubernetes permissions, not IAM permissions,
    and each policy association can be scoped either to the entire cluster or to one or more Kubernetes namespaces, including
    wildcard namespace patterns. This model also makes effective permissions easier to reason about in mixed authorization
    paths. A single access entry can have multiple associated access policies, and if Kubernetes groups are also specified,
    the IAM principal receives the union of all permissions granted by those policies plus any permissions granted through
    Role, ClusterRole, RoleBinding, or ClusterRoleBinding objects bound to those groups. AWS also notes that permissions granted
    by associated access policies are not shown by kubectl auth can-i --list, which means standardizing on access entries,
    explicit policy associations, and namespace-scoped assignments helps reduce hidden overpermissioning, authorization drift,
    and dependence on deprecated aws-auth mappings.'
  impact: If cluster access is not standardized in EKS, organizations can accumulate a mix of deprecated aws-auth mappings,
    uneven access-entry adoption, and overly broad cluster-scoped permissions that are harder to review, audit, and narrow
    to namespace scope. That increases the chance that an IAM principal receives duplicated or broader Kubernetes access than
    intended, and it makes access changes more error-prone over time.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 91
  audit_raw: "Review the cluster authentication mode to confirm EKS access entries are enabled,\nthen review access entries\
    \ and associated access policies to verify that cluster access\nis being managed through the Cluster Access Management\
    \ API with cluster-wide or\nnamespace-scoped permissions as appropriate. Treat API and API_AND_CONFIG_MAP\nas evidence\
    \ that access entries are available, but treat CONFIG_MAP as legacy-only\nauthentication. If the cluster is in API_AND_CONFIG_MAP\
    \ mode, also review whether\nlegacy aws-auth mappings are still present and whether access has been migrated to\naccess\
    \ entries and scoped policy associations.\nTo check if the Cluster Access Manager API is active on your Amazon EKS cluster,\
    \ you\ncan use the following AWS CLI command:\naws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --query \"cluster.accessConfig\"\
    \ \\\n  --output json\nThe command queries the cluster.accessConfig property, which indicates the\nauthentication mode\
    \ of the cluster.\nExpected output for authenticationMode:\n• API = access entries enabled, ConfigMap auth removed\n•\
    \ API_AND_CONFIG_MAP = access entries enabled, legacy ConfigMap auth still\nalso available\n• CONFIG_MAP = legacy aws-auth\
    \ only, no access-entry-based access\nmanagement\nAdditional checks:\nLists the IAM principal ARNs that currently have\
    \ EKS access entries on the cluster. Use\nit to identify which users or roles are being managed through the EKS access\
    \ entry\nmodel.\naws eks list-access-entries --cluster-name $CLUSTER_NAME\nLists the EKS access policies associated with\
    \ one specific access entry and shows the\naccess scope, such as cluster-wide or namespace-scoped. Use it to identify\
    \ what level\nof Kubernetes access that principal has been granted.\nCommand line statement to extract arn for $PRINCIPAL_ARN\
    \ variable:\naws sts get-caller-identity --query Arn --output text\naws eks list-associated-access-policies \\\n  --cluster-name\
    \ $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN"
  remediation: 'Log in to the AWS Management Console, navigate Amazon Elastic Kubernetes Service

    > Clusters and click on your EKS cluster.

    Go to the Access tab and click on Manage in the Access Configuration section.

    Under Cluster Authentication Mode for Cluster Access settings choose one of the

    following.

    • EKS API The cluster will source authenticated IAM principals only from EKS

    access entry APIs

    • EKS API and ConfigMap The cluster will source authenticated IAM principals

    from both EKS access entry APIs and the aws-auth ConfigMap'
  checks:
  - type: manual_review
    info: 'Review the cluster authentication mode to confirm EKS access entries are enabled,

      then review access entries and associated access policies to verify that cluster access

      is being managed through the Cluster Access Management API with cluster-wide or

      namespace-scoped permissions as appropriate. Treat API and API_AND_CONFIG_MAP

      as evidence that access entries are available, but treat CONFIG_MAP as legacy-only

      authentication. If the cluster is in API_AND_CONFIG_MAP mode, also review whether

      legacy '
    severity: medium
- id: 4.1.8
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: In EKS, bind, impersonate, and escalate should be limited to identities with a documented administrative need,
    because these permissions belong to native Kubernetes RBAC and affect who can obtain or act with Kubernetes permissions.
    This review should cover custom Role and ClusterRole definitions, RoleBinding and ClusterRoleBinding assignments, and
    any service accounts that receive those permissions, especially for broadly deployed components such as DaemonSets or
    CSI drivers. AWS recommends using access entries and associated access policies for most cluster access and using native
    Kubernetes RBAC only when the predefined access policies do not meet the requirement.
  rationale: 'This setting is important because EKS supports two authorization paths for IAM principals that reach the Kubernetes
    API: associated access policies and native Kubernetes RBAC through Kubernetes groups specified on an access entry. Access
    policies are AWS-managed Kubernetes permission sets, cannot be modified, and should be used for most common access patterns.
    When they do not meet a requirement, administrators must fall back to custom Kubernetes RBAC objects, which is where powerful
    verbs such as bind, impersonate, and escalate can appear and where least-privilege review becomes especially important.
    The risk is higher because these permissions operate on the authorization model itself rather than on routine resource
    access. If a user impersonates a Kubernetes user or group, EKS access-policy permissions do not apply and authorization
    is evaluated through Kubernetes RBAC only. AWS also recommends reviewing and scoping RBAC for service accounts, especially
    for DaemonSets and CSI drivers, because those tokens and permissions are effectively present on every node where those
    Pods run. In that model, assigning bind, impersonate, or escalate to a broadly used service account or administrative
    role can make effective access harder to reason about and easier to expand beyond the intended boundary.'
  impact: If bind, impersonate, or escalate are granted too broadly in EKS, a user or service account can turn limited access
    into broader Kubernetes authority, weaken namespace and role boundaries, and increase the blast radius of a compromised
    identity or workload. The risk is greater when the affected identity is tied to broadly deployed service accounts, because
    the resulting permissions can become reachable from many nodes and can also combine with workload IAM access where IRSA
    or EKS Pod Identity is in use.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/rbac-hardening.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 95
  audit_raw: "Review EKS RBAC to identify any users, groups, or service accounts granted bind,\nescalate, or impersonate through\
    \ custom Kubernetes Role or ClusterRole objects.\nDetermine which subjects receive those permissions through RoleBinding\
    \ or\nClusterRoleBinding assignments, and validate that each assignment is required for a\ndefined administrative function.\
    \ If the cluster uses access entries with Kubernetes\ngroups, review those group mappings as well, because EKS access\
    \ entries are the\nrecommended way to grant IAM principals access to the Kubernetes API and can\nreference Kubernetes\
    \ groups for native RBAC authorization. Flag any cluster-scoped or\nservice-account assignment that lacks a documented\
    \ need, especially for broadly\ndeployed service accounts such as DaemonSets or CSI drivers.\nIdentify custom Role and\
    \ ClusterRole objects that include bind, escalate, or\nimpersonate:\nkubectl get roles,clusterroles -A -o json | jq -r\
    \ '\n  .items[]\n  | select(.metadata.labels[\"kubernetes.io/bootstrapping\"] != \"rbacdefaults\")\n  | select(any(.rules[]?;\
    \ any(.verbs[]?; .==\"bind\" or .==\"escalate\" or\n.==\"impersonate\")))\n  | [.kind, (.metadata.namespace // \"-\"),\
    \ .metadata.name]\n  | @tsv\n'\nMap those roles to the subjects that receive them through bindings:\n(echo -e\n\"BINDING_KIND\\\
    tBINDING_NS\\tBINDING_NAME\\tROLE_KIND\\tROLE_NAME\\tSUBJECT_KIND\\t\nSUBJECT_NS\\tSUBJECT_NAME\"; \\\nkubectl get rolebindings,clusterrolebindings\
    \ -A -o json | jq -r '\n  .items[] as $b\n  | ($b.subjects // [])[]\n  | [\n      $b.kind,\n      ($b.metadata.namespace\
    \ // \"-\"),\n      $b.metadata.name,\n      $b.roleRef.kind,\n      $b.roleRef.name,\n      .kind,\n      (.namespace\
    \ // \"-\"),\n      .name\n    ]\n  | @tsv\n') | column -ts $'\\t'"
  remediation: 'Remove bind, escalate, and impersonate permissions from any custom Role or

    ClusterRole that does not require them for an approved administrative function. In

    EKS, use access entries and associated access policies for standard cluster access

    wherever possible, and reserve custom Kubernetes RBAC for cases where the

    predefined access policies do not meet the requirement. Where these permissions are

    still necessary, keep them scoped as narrowly as possible and avoid assigning them to

    workload service accounts.

    • Update each affected custom Role to remove unnecessary bind, escalate, or

    impersonate permissions.

    • Update each affected custom ClusterRole so it retains only the specific

    elevated permission that is explicitly required.

    • Replace broad assignments with lower-privilege roles, and reduce scope from

    cluster-wide to namespace-scoped where possible. EKS access policies support

    scoped assignments, and custom RBAC should be used only when those

    policies do not meet the requirement.

    • Review access entries that specify Kubernetes groups, and remove or narrow

    any group mapping that reaches RBAC roles with these permissions. When you

    use Kubernetes groups on an access entry, you must create and manage the

    related native RBAC objects yourself.

    • Do not assign these permissions to workload service accounts unless there is a

    documented and approved need. Review DaemonSet and CSI driver service

    accounts first, because their RBAC permissions can be reachable from every

    node where those Pods run.

    • Revalidate access after the change to confirm that only approved administrative

    identities retain these permissions.'
  checks:
  - type: manual_review
    info: 'Review EKS RBAC to identify any users, groups, or service accounts granted bind,

      escalate, or impersonate through custom Kubernetes Role or ClusterRole objects.

      Determine which subjects receive those permissions through RoleBinding or

      ClusterRoleBinding assignments, and validate that each assignment is required for a

      defined administrative function. If the cluster uses access entries with Kubernetes

      groups, review those group mappings as well, because EKS access entries are the

      recommended way t'
    severity: medium
- id: 4.1.9
  title: Minimize access to create persistent volumes
  scoring: manual
  profile:
  - Level 1
  description: Permission to create persistent storage in EKS should be granted only where it is required. In EKS, this includes
    direct creation of PersistentVolume objects and, more commonly, the ability to trigger dynamic provisioning through PersistentVolumeClaim
    and StorageClass use, because EKS storage integrations such as the Amazon EBS CSI driver and EKS Auto Mode can automatically
    provision backing storage when applications request it. For service accounts, this remains an RBAC concern because CSI
    drivers and other storage components operate through Kubernetes identities and permissions inside the cluster.
  rationale: Minimizing this access is important because persistent storage in EKS is not just a short-lived workload resource.
    The Amazon EBS CSI driver manages the lifecycle of Amazon EBS volumes for Kubernetes volumes, and EKS Auto Mode uses StorageClass
    definitions to automatically provision EBS volumes when applications request persistent storage. StorageClass settings
    can also influence technical characteristics such as volume type, encryption, IOPS, and KMS key usage, so the ability
    to create storage can affect durability, performance, encryption, and cost rather than only enabling routine application
    writes. This access is also sensitive because storage creation commonly depends on CSI driver service accounts and related
    RBAC. CSI drivers often require broad RBAC permissions because they interact with nodes, persistent volumes, and storage
    APIs, and that DaemonSet service account tokens and permissions are effectively present on every node where those Pods
    run. In EKS Auto Mode, AWS-managed block storage policies include permissions to create and manage persistent volumes,
    update persistent volume claims, and read storage classes, which shows that storage provisioning rights are part of a
    broader control plane and service-account permission path that should be tightly scoped.
  impact: If persistent volume creation is granted too broadly in EKS, a user or service account can provision durable storage
    that outlives Pod execution, expands the cluster data footprint, and triggers creation of backing AWS storage resources
    without a justified need. When those permissions are tied to broadly deployed CSI components or overprivileged service
    accounts, a compromised workload can create long-lived storage paths that increase persistence, cost, and the scope of
    unauthorized activity.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/ebs-csi.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/efs-csi.html
  page_start: 99
  audit_raw: 'Review EKS RBAC to identify any users, groups, or service accounts that can create

    PersistentVolume, PersistentVolumeClaim, or StorageClass resources. In EKS,

    this review should give particular attention to PersistentVolumeClaim and

    StorageClass permissions because persistent storage is commonly provisioned

    dynamically through CSI drivers and EKS storage integrations rather than by manually

    creating PersistentVolume objects. Also review the service accounts and bindings

    used by storage components, because CSI drivers commonly hold broad RBAC

    permissions related to nodes, persistent volumes, and storage APIs.'
  remediation: 'Remove persistent-storage creation rights from any user, group, or service account that

    does not require them, and replace broad assignments with the lowest-privilege role

    and narrowest scope possible. In EKS, prioritize PersistentVolumeClaim and

    StorageClass permissions because persistent storage is commonly provisioned

    dynamically through CSI drivers rather than by manually creating PersistentVolume

    objects. Limit direct PersistentVolume and StorageClass administration to approved

    administrators, and allow workloads to use only the PersistentVolumeClaim access

    required for approved storage classes. After changes are made, verify that required

    applications can still provision storage through the intended CSI driver path.

    • Remove unnecessary create access to PersistentVolume objects wherever

    possible, because direct PV creation is less common than PVC-driven dynamic

    provisioning in EKS.

    • Reduce PersistentVolumeClaim and StorageClass creation rights to the

    smallest set of approved users, groups, and service accounts. StorageClass

    settings can affect how backing storage is provisioned and managed, so broad

    access creates more than routine workload write capability.

    • Review CSI driver service accounts and bound RBAC first, especially for storage

    components such as the EBS CSI driver and EFS CSI driver, because CSI

    drivers commonly hold broad RBAC permissions related to nodes, persistent

    volumes, and storage APIs.

    • Revalidate application storage provisioning after the change to confirm that only

    approved workloads can create claims and obtain persistent storage through the

    approved storage classes.'
  checks:
  - type: manual_review
    info: 'Review EKS RBAC to identify any users, groups, or service accounts that can create

      PersistentVolume, PersistentVolumeClaim, or StorageClass resources. In EKS,

      this review should give particular attention to PersistentVolumeClaim and

      StorageClass permissions because persistent storage is commonly provisioned

      dynamically through CSI drivers and EKS storage integrations rather than by manually

      creating PersistentVolume objects. Also review the service accounts and bindings

      used by storage component'
    severity: medium
- id: 4.1.10
  title: Minimize access to the proxy sub-resource of nodes
  scoring: manual
  profile:
  - Level 1
  description: Access to the nodes/proxy subresource in EKS should be limited to identities with a documented node-administration
    or troubleshooting need. This review should cover custom Role and ClusterRole rules, RoleBinding and ClusterRoleBinding
    assignments, and any service accounts that receive node subresource access. In EKS, access entries are the preferred way
    to grant IAM principals access to the Kubernetes API, while custom native RBAC remains the path for permissions that aren’t
    covered by the predefined access policies, which is where sensitive node subresource access is typically introduced.
  rationale: This control is important because nodes/proxy is a node-facing permission, not an ordinary namespace-scoped workload
    permission. In EKS, nodes run operational components such as the kubelet daemon and the kube-proxy add-on, and cluster
    components and add-ons can rely on RBAC to function. Since predefined EKS access policies don’t cover every custom permission
    need, organizations that use Kubernetes groups on access entries or bind service accounts to custom RBAC objects can still
    introduce sensitive node subresource permissions through native Kubernetes authorization. The risk is higher when these
    permissions are assigned to broadly deployed service accounts. DaemonSet Pods run on every node in the cluster, and their
    service account tokens and RBAC permissions are present on every node. An unauthorized process on a node may be able to
    access service account tokens from other Pods on that node, including DaemonSet Pods. EKS control plane logging records
    API server, audit, and authenticator activity from the control plane, so keeping node-proxy access tightly scoped helps
    preserve a clearer boundary between routine cluster API access and privileged node-adjacent operations.
  impact: If nodes/proxy access is granted too broadly in EKS, a user or service account can gain an unnecessary node-adjacent
    access path that weakens separation between namespace-level operations and node administration. When those permissions
    are tied to broadly deployed service accounts, the blast radius can extend across many nodes and make unintended access
    harder to review, contain, and recover from.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/rbac-hardening.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 102
  audit_raw: "Review EKS RBAC to identify custom Role and ClusterRole objects that grant access\nto the nodes/proxy subresource,\
    \ and validate that each permission is required for an\napproved troubleshooting, maintenance, or platform-administration\
    \ function. Focus this\nreview on customer-managed RBAC because EKS creates its own default RBAC\nidentities for cluster\
    \ components, while customer-defined node-proxy access is usually\nintroduced through native Kubernetes RBAC. If the cluster\
    \ uses access entries with\nKubernetes groups, review those mappings as well, because access entries are the\npreferred\
    \ way to grant IAM principals access to the Kubernetes API and Kubernetes\ngroups on an access entry still rely on manually\
    \ managed RBAC objects.\nThis command returns each custom Role or ClusterRole whose RBAC rules include\nnodes/proxy, along\
    \ with the namespace, role name, and allowed verbs. It excludes\nKubernetes bootstrapped default roles and system:-prefixed\
    \ ClusterRole objects\nso the output stays focused on customer-managed RBAC that may require review.\nkubectl get roles,clusterroles\
    \ -A -o json | jq -r '\n  .items[]\n  | select(any(.rules[]?; any(.resources[]?; .==\"nodes/proxy\")))\n  | select(\n\
    \      (.kind==\"Role\")\n      or\n      (\n        .kind==\"ClusterRole\"\n        and (.metadata.labels[\"kubernetes.io/bootstrapping\"\
    ] != \"rbacdefaults\")\n        and (.metadata.name | startswith(\"system:\") | not)\n      )\n    )\n  | [\n      .kind,\n\
    \      (.metadata.namespace // \"-\"),\n      .metadata.name,\n      (\n        [.rules[]?\n         | select(any(.resources[]?;\
    \ .==\"nodes/proxy\"))\n         | \"verbs=\" + ((.verbs // []) | join(\",\"))\n        ] | join(\"; \")\n      )\n  \
    \  ]\n  | @tsv\n'"
  remediation: 'Reduce custom RBAC access to the nodes/proxy API path so it is limited to approved

    administrative identities that require node-level access. In EKS, use access entries and

    associated access policies for standard cluster access wherever possible, and reserve

    custom Kubernetes RBAC for cases where the predefined access policies do not meet

    the requirement. Keep nodes/proxy limited to tightly controlled troubleshooting,

    maintenance, or platform-administration use cases, and avoid assigning it to workload

    service accounts.

    • Remove nodes/proxy from any custom Role or ClusterRole where node-level

    proxying is not explicitly required.

    • Where some node-related access is still needed, replace nodes/proxy with

    narrower permissions on only the specific resources and verbs required, and

    reduce scope from ClusterRole to namespace-scoped Role where the function

    allows it.

    • Remove any RoleBinding or ClusterRoleBinding that grants nodes/proxy to

    workload service accounts, CI/CD identities, or broad operator groups unless

    there is an approved exception tied to a defined operational function.

    • Review access entries that use Kubernetes groups, and remove or narrow any

    group mapping that reaches RBAC roles with nodes/proxy access.

    • Keep any remaining nodes/proxy assignment only on dedicated support or

    platform-admin identities, and document the purpose, scope, and owner of each

    assignment.

    • Revalidate the updated roles and bindings after the change to confirm that

    required node-support tasks still work and that no unnecessary custom RBAC

    objects retain nodes/proxy access.'
  checks:
  - type: manual_review
    info: 'Review EKS RBAC to identify custom Role and ClusterRole objects that grant access

      to the nodes/proxy subresource, and validate that each permission is required for an

      approved troubleshooting, maintenance, or platform-administration function. Focus this

      review on customer-managed RBAC because EKS creates its own default RBAC

      identities for cluster components, while customer-defined node-proxy access is usually

      introduced through native Kubernetes RBAC. If the cluster uses access entries with

      Kub'
    severity: medium
- id: 4.1.11
  title: Minimize access to webhook configuration objects
  scoring: manual
  profile:
  - Level 1
  description: Access to ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects in EKS should be limited
    to tightly controlled cluster-administrative identities. These objects define admission webhooks that intercept Kubernetes
    API requests before they are accepted, and they apply at cluster scope rather than namespace scope. Write access to them
    should not be broadly granted to general users, namespace operators, CI/CD identities, or workload service accounts.
  rationale: This setting matters because admission webhooks sit directly in the API request path. The EKS control plane page
    explains that validating and mutating webhooks can inspect or change objects before they are accepted, and it also states
    that poor webhook configuration can destabilize the control plane by blocking cluster-critical operations. The workloads
    page adds that dynamic admission webhooks are invoked in sequence for API requests, each webhook has a default timeout
    of 10 seconds, and multiple or slow webhooks can increase request latency. The risk is amplified because these configuration
    objects control where admission callbacks are sent and how broadly they apply. The control plane page calls out catchall
    webhook patterns that match all API groups, versions, operations, resources, and scopes as something to avoid, and it
    recommends a fail-open policy with a timeout shorter than 30 seconds when availability risk must be reduced. The access
    policy permissions page also shows that when predefined access policies do not meet a requirement, authorization falls
    back to native Kubernetes RBAC through group mappings, which is where broad write access to webhook configuration objects
    can be introduced for users or service accounts.
  impact: If access to webhook configuration objects is granted too broadly in EKS, a user or service account can change how
    cluster-wide API requests are validated or mutated, which can reject requests, alter admitted resources, increase API
    latency, and in poorly designed cases interfere with cluster-critical operations. Mutating webhooks can also increase
    etcd churn by creating additional stored resource versions during repeated mutations, which raises the operational impact
    of overprivileged access.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/control-plane.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 106
  audit_raw: 'Audit this control by identifying who can manage cluster-scoped

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration

    resources, and confirm that webhook definitions are limited to approved admission use

    cases in EKS. Review whether cluster access is managed through access entries and

    associated access policies or through Kubernetes groups and native RBAC, because

    EKS access entries are the primary cluster access model and Kubernetes-group

    authorization still depends on manually managed Role, ClusterRole, RoleBinding,

    and ClusterRoleBinding objects. Confirm that webhook configurations exist only

    where operationally required, that their rules and scope are narrowly defined, and that

    write access to manage them is restricted to tightly controlled administrative identities.

    Admission webhooks sit directly in the API request path, and broad or unhealthy

    webhook configurations can increase API latency or interfere with cluster operations.

    • Identify whether cluster access is governed through access entries and

    associated access policies, through Kubernetes groups and native RBAC, or

    through a mixed model.

    • Review cluster-scoped roles for permissions on

    validatingwebhookconfigurations and mutatingwebhookconfigurations,

    and trace those permissions through bindings to the exact users, groups, and

    service accounts that receive them.

    • Review existing webhook configurations to confirm their rules, selectors, and

    scope are narrowly defined and not written as broad catch-all configurations that

    match all resources or operations.

    • Review any service accounts that can modify webhook configuration objects,

    especially broadly deployed components, because node-wide or widely deployed

    service account permissions increase the reach of a compromised workload.

    This command lists all validating and mutating webhook configuration objects in the

    cluster so they can be reviewed for presence and expected use:

    kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o

    wide'
  remediation: 'Remove permission to create, update, patch, or delete

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects

    from broad ClusterRole and Role assignments, and rebind that access only to tightly

    controlled cluster-administrative identities. In EKS, use access entries and associated

    access policies for standard cluster access wherever possible, and reserve native

    Kubernetes RBAC for cases where the predefined access policies do not meet the

    requirement. Keep webhook-configuration management limited to a small set of

    approved administrative identities, because these objects sit directly in the admission

    path and operate at cluster scope.

    • Remove create, update, patch, and delete permissions on

    validatingwebhookconfigurations and mutatingwebhookconfigurations

    from broad custom ClusterRole and Role assignments.

    • Rebind any remaining webhook-management access only to dedicated platformadmin identities, and keep the scope and ownership
    of each assignment

    documented.

    • Review access entries that use Kubernetes groups, and remove or narrow any

    group mapping that reaches RBAC roles with webhook-configuration write

    access.

    • Remove webhook-configuration management rights from workload service

    accounts, CI/CD identities, and broadly deployed components unless there is a

    defined and approved operational need.

    • Review each existing webhook configuration and narrow its rules,

    namespaceSelector, objectSelector, and failure behavior so it applies only to

    the required namespaces, resources, and operations. Avoid broad catch-all

    patterns, and where availability risk must be reduced, use a fail-open policy with

    a timeout shorter than 30 seconds.

    • Revalidate admission behavior after the change to confirm required controllers

    still function and that webhook scope is not broad enough to increase API latency

    or interfere with cluster operations.'
  checks:
  - type: manual_review
    info: 'Audit this control by identifying who can manage cluster-scoped

      ValidatingWebhookConfiguration and MutatingWebhookConfiguration

      resources, and confirm that webhook definitions are limited to approved admission use

      cases in EKS. Review whether cluster access is managed through access entries and

      associated access policies or through Kubernetes groups and native RBAC, because

      EKS access entries are the primary cluster access model and Kubernetes-group

      authorization still depends on manually manage'
    severity: medium
- id: 4.1.12
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1
  description: Access to service account token creation in EKS should be limited to tightly controlled administrative or platform
    identities. Service accounts are a core Kubernetes identity type in EKS, projected service account tokens are used by
    workloads to authenticate, and Pods that do not need Kubernetes API access can avoid unnecessary token exposure by disabling
    automatic token mounting. Permission to request or create service account tokens should not be broadly granted to namespace
    operators, CI/CD identities, or general workload service accounts.
  rationale: This setting is important because a service account token is an authentication credential. In EKS, the BoundServiceAccountTokenVolume
    feature is enabled by default, which allows workloads to request JSON web tokens that are audience-bound, time-bound,
    and key-bound, with a one-hour expiration. EKS also supports projected service account tokens for authentication flows
    such as IRSA, where a Pod uses a web identity token associated with a Kubernetes service account to obtain AWS credentials
    through AssumeRoleWithWebIdentity. The risk increases when token creation is available to identities that do not need
    it. A Pod can authenticate to the Kubernetes API with an auto-mounted token, exposed tokens on a node can be accessed
    by unauthorized processes, and for workloads tied to IRSA or EKS Pod Identity, token exposure can extend beyond Kubernetes
    RBAC into AWS IAM credentials. Keeping token creation tightly scoped reduces the number of identities that can mint usable
    service account credentials and strengthens the service account as a deliberate workload boundary instead of a broadly
    reusable access path.
  impact: If service account token creation is granted too broadly in EKS, a compromised user or service account can mint
    valid tokens for targeted service accounts and authenticate with the Kubernetes permissions of those identities. When
    the targeted service account is also tied to IRSA or EKS Pod Identity, that token path can also lead to AWS credentials,
    increasing the blast radius beyond the cluster.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/service-accounts.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-serviceaccounts.html
  page_start: 110
  audit_raw: 'Begin by confirming that service account token creation in EKS is limited to identities

    with an approved administrative or workload identity need. Review token issuance

    through native Kubernetes RBAC, not through access entries, because access entries

    govern IAM principal access to the Kubernetes API while service account tokens remain

    Kubernetes credentials used by workloads and service accounts. Also confirm that

    token use aligns with expected Kubernetes API access, IRSA, or EKS Pod Identity

    behavior rather than ad hoc credential minting.

    • Review Role and ClusterRole objects for permission to create the

    serviceaccounts/token subresource or any equivalent token-issuance path.

    • Trace those permissions through RoleBinding and ClusterRoleBinding

    assignments to the exact users, groups, and service accounts that inherit them.

    • Give extra scrutiny to DaemonSet and other broadly deployed service accounts,

    because their tokens and RBAC permissions are present on every node where

    those Pods run.

    • Confirm each assignee has a documented need for token issuance, and that the

    permission is not exposed through broad custom roles, CI/CD identities, default

    service accounts, or general workload service accounts.

    • Validate that current token use matches expected workload identity behavior

    such as Kubernetes API access, IRSA, or EKS Pod Identity. For IRSA, the

    projected service account token is the web identity token used for

    AssumeRoleWithWebIdentity.

    • Flag any unnecessary token-creation path for remediation, especially where

    Pods could mount tokens by default without a defined operational need.'
  remediation: 'Review all Role and ClusterRole definitions for access to the

    serviceaccounts/token subresource, and remove that permission from any user,

    group, CI/CD identity, or workload service account that does not have a documented

    operational requirement. In EKS, service account token issuance remains a Kubernetes

    RBAC concern, while IAM principal access to the Kubernetes API is managed

    separately through access entries and associated access policies. Token-creation rights

    should remain limited to tightly controlled administrative or platform identities, because

    projected service account tokens are usable Kubernetes credentials and can also

    participate in workload identity flows such as IRSA.

    • Review Role and ClusterRole objects for access to serviceaccounts/token,

    and remove that permission from broad operational roles, CI/CD identities,

    default service accounts, and general workload service accounts.

    • Reassign token-creation rights only to approved administrative or platform

    identities with a documented need to issue service account tokens.

    • Validate that required workload identity flows still function correctly for Pods that

    use projected service account tokens, including IRSA and service-account-based

    AWS access patterns.

    • Recheck RoleBinding and ClusterRoleBinding assignments to confirm no

    unintended user, group, or service account still inherits token-creation rights.

    Give extra scrutiny to broadly deployed service accounts such as DaemonSets

    because their tokens and permissions are present on every node where those

    Pods run.'
