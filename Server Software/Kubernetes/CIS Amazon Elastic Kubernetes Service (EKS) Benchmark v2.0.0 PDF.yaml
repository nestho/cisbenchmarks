    goal is to prevent a process running in a container from escaping container runtime isolation and gaining access to the
    underlying host. AWS also explains that privileged escalation allows a process to change the security context under which
    it runs, such as through sudo or binaries with the SUID or SGID bit. In EKS, this can be controlled at admission time
    by setting securityContext.allowPrivilegeEscalation=false in the pod spec or by using Pod Security Standards or policy-as-code
    so noncompliant API requests can be mutated or rejected before they are persisted.
  impact: 'In namespaces enforcing the restricted Pod Security Standard, containers that do not set securityContext.allowPrivilegeEscalation=false
    can be denied at admission, so workloads that rely on privilege-changing behavior will need manifest updates or a tightly
    scoped exception path. AWS also notes that warn and audit modes only report violations, while enforce is the mode that
    blocks pod creation. Pods defined with spec.allowPrivilegeEscalation: true will not be permitted unless they are run under
    a specific policy.'
  references:
