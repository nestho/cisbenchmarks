- id: 4.3.1
  title: Ensure VPC CNI network policy support is enabled
  scoring: scored
  profile:
  - Level 1
  description: The Amazon VPC CNI plugin for Kubernetes can provide native Kubernetes NetworkPolicy enforcement in EKS when
    network policy support is enabled on a supported VPC CNI add-on version. This capability lets EKS apply Pod-to-Pod traffic
    restrictions through the VPC CNI data path instead of leaving Pod network communication broadly open by default.
  rationale: Kubernetes NetworkPolicy objects do not provide traffic isolation in EKS unless the Amazon VPC CNI network policy
    feature is enabled and the cluster is running a supported VPC CNI add-on version. Policy enforcement is implemented on
    the node through the aws-node DaemonSet, with startup behavior controlled by NETWORK_POLICY_ENFORCING_MODE. In standard
    mode, newly started Pods come up with default-allow traffic until their active policies are attached. In strict mode,
    Pods start with default-deny behavior and only gain connectivity allowed by policy, which means required dependencies
    such as CoreDNS must already be permitted. Enforcement uses eBPF on the node, which improves the efficiency and visibility
    of policy processing compared with relying only on sequential packet filtering rules.
  impact: If VPC CNI network policy support is not enabled, Pod-to-Pod traffic remains unrestricted by this feature, so namespace
    segmentation and least-privilege traffic controls are not enforced through the Amazon VPC CNI plugin. Even when enabled,
    the feature applies to Amazon EC2 Linux nodes, not Fargate or Windows nodes, and policies are applied only to the Pod’s
    primary interface.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policyconfigure.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/network-security.html
  page_start: 132
  audit_raw: "Review the current Amazon VPC CNI configuration for the cluster and verify that\nnetwork policy support is enabled.\
    \ In EKS, this feature is not enabled by default, and a\nvalid audit must confirm both that the cluster is running a supported\
    \ VPC CNI version\nand that the VPC CNI configuration has network policy turned on. For Amazon EKS\nadd-ons, the key setting\
    \ is enableNetworkPolicy=true on the vpc-cni add-on. For\nself-managed installs, review the aws-node DaemonSet and confirm\
    \ the network policy\nagent is enabled in the manifest.\nUse this command for an Amazon EKS managed add-on audit:\naws\
    \ eks describe-addon \\\n  --cluster-name $CLUSTER_NAME \\\n  --addon-name vpc-cni \\\n  --query\n'addon.{status:status,version:addonVersion,configurationValues:configurationV\n\
    alues}' \\\n  --output json\nConfirm the add-on is ACTIVE, the version is supported for network policy use, and\nconfigurationValues\
    \ includes enableNetworkPolicy set to true. The EKS CLI\nreturns the add-on version and the configuration values you supplied,\
    \ which makes this\nthe most direct audit for managed vpc-cni.\nIf the cluster uses a self-managed VPC CNI, use these\
    \ checks:\nkubectl describe daemonset aws-node -n kube-system | grep amazon-k8s-cni:\nkubectl get daemonset aws-node -n\
    \ kube-system -o yaml | grep -- '--enablenetwork-policy='\nThe first command verifies the installed VPC CNI version. The\
    \ second checks whether\nthe network policy agent is enabled in the aws-node DaemonSet manifest. AWS’s\ncurrent setup\
    \ guidance requires both a supported VPC CNI version and network policy\nenabled in the VPC CNI configuration."
  remediation: "Enable network policy support in the Amazon VPC CNI plugin for Kubernetes so EKS\ncan enforce Kubernetes NetworkPolicy\
    \ objects for Pod traffic. This feature is not\nenabled by default on newly provisioned clusters, and remediation requires\
    \ a supported\nVPC CNI version plus network policy enabled in the VPC CNI configuration. For\nmanaged add-ons, set enableNetworkPolicy\
    \ to true on the vpc-cni add-on. For\nself-managed installations, enable the network policy controller in the amazon-vpc-cni\n\
    ConfigMap and set the aws-node DaemonSet argument --enable-networkpolicy=true.\nAWS CLI, managed add-on: Update the managed\
    \ vpc-cni add-on and enable the\nfeature. AWS’s current guide shows v1.14.0-eksbuild.3 or later in the example.\naws eks\
    \ update-addon \\\n  --cluster-name $CLUSTER_NAME \\\n  --addon-name vpc-cni \\\n  --addon-version v1.14.0-eksbuild.3\
    \ \\\n  --resolve-conflicts PRESERVE \\\n  --configuration-values '{\"enableNetworkPolicy\":\"true\"}'\nCommand line,\
    \ self-managed VPC CNI: Edit the amazon-vpc-cni ConfigMap and add:\nenable-network-policy-controller: \"true\"\nThen edit\
    \ the aws-node DaemonSet and set:\n--enable-network-policy=true\nApply the required Kubernetes NetworkPolicy objects.\
    \ Standard mode starts Pods as\ndefault-allow, while strict mode starts them as default-deny and requires necessary\n\
    traffic such as DNS to be explicitly permitted."
