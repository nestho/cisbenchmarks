- id: 4.3.2
  title: Ensure required workloads are covered by Kubernetes network policies
  scoring: manual
  profile:
  - Level 1
  description: The Amazon VPC CNI plugin for Kubernetes can enforce Kubernetes network policies in EKS, but workload isolation
    depends on the relevant workloads actually being covered by NetworkPolicy or ClusterNetworkPolicy rules. NetworkPolicy
    provides namespace-scoped pod traffic segmentation, while ClusterNetworkPolicy can apply a common security posture across
    all or a selected subset of workloads in the cluster.
  rationale: Turning on VPC CNI network policy support only provides the enforcement mechanism. Traffic restrictions are not
    realized unless policies are defined for the workloads that need them. Pod-to-Pod communication is allowed by default,
    and AWS recommends a least-privilege approach that starts with a default deny policy and then adds explicit ingress and
    egress allow rules. Namespace-scoped policies control traffic within a namespace, while cluster-level policies centralize
    controls across multiple namespaces or workload groups. When no matching policies allow the traffic, the evaluation model
    ends in deny-by-default.
  impact: If required workloads are not covered by Kubernetes network policies, their traffic remains effectively unsegmented
    even when Amazon VPC CNI network policy support is enabled, which leaves unnecessary communication paths open. Coverage
    also has practical limits because policies apply to Amazon EC2 Linux nodes, not Fargate or Windows nodes, and they apply
    only to a Pod’s primary network interface.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/network-security.html
  page_start: 135
  audit_raw: 'Review the Kubernetes network policy model in the EKS cluster and verify that every

    required workload is selected by either a namespace-scoped NetworkPolicy or a

    cluster-scoped ClusterNetworkPolicy. A separate policy in every namespace is not

    required, because cluster-scoped policies can apply a shared posture across all

    workloads or a selected subset. Workloads that are not matched by policy remain

    effectively unsegmented because Pod traffic is allowed by default until policy restricts it.

    • Identify all NetworkPolicy and ClusterNetworkPolicy objects intended to

    govern workload traffic. ClusterNetworkPolicy can cover all workloads or

    selected workloads across namespaces.

    • Map each required workload to the policy or policies that select it, and confirm no

    required workload falls outside policy coverage. Unmatched workloads remain

    default-allow.

    • Review selectors and ingress and egress rules to confirm least-privilege design.

    A strong pattern is default deny first, then explicit allow rules for only necessary

    flows such as DNS and approved service-to-service traffic.

    • Confirm the workloads are in supported enforcement scope. Native VPC CNI

    network policies apply to Amazon EC2 Linux nodes, not Fargate or Windows

    nodes, and they apply only to a Pod’s primary interface.

    • Check for workload types that may not be covered as expected, including

    standalone Pods, because this feature applies policies only to Pods created by

    Kubernetes Deployments.

    Review policy objects, map them to required workloads, and confirm no required

    workload is left outside enforceable network policy coverage.'
  remediation: 'Create and apply Kubernetes NetworkPolicy or ClusterNetworkPolicy objects so

    every required workload is explicitly covered by policy. Start with a default deny posture

    and then add only the ingress and egress rules needed for approved traffic such as

    DNS and required service-to-service flows. Use namespace-scopedNetworkPolicy

    where application-level segmentation is sufficient, and use ClusterNetworkPolicy

    where a shared security posture must apply across multiple namespaces or workload

    groups. Keep in mind that coverage depends on the Amazon VPC CNI network policy

    feature being enabled, applies to Amazon EC2 Linux nodes, and is limited to a Pod’s

    primary interface.'
  checks:
  - type: manual_review
    info: 'Review the Kubernetes network policy model in the EKS cluster and verify that every

      required workload is selected by either a namespace-scoped NetworkPolicy or a

      cluster-scoped ClusterNetworkPolicy. A separate policy in every namespace is not

      required, because cluster-scoped policies can apply a shared posture across all

      workloads or a selected subset. Workloads that are not matched by policy remain

      effectively unsegmented because Pod traffic is allowed by default until policy restricts it.

      • Id'
    severity: medium
- id: 4.4.1
  title: Prefer exposing secrets as mounted files rather than environment variables
  scoring: scored
  profile:
  - Level 1
  description: Secrets for EKS workloads are better exposed as mounted files than as environment variables. Kubernetes secrets
    can be consumed either way, and AWS supports filebased delivery from AWS Secrets Manager and Parameter Store through the
    AWS Secrets and Configuration Provider with the Secrets Store CSI Driver.
  rationale: Environment variable values can unintentionally appear in logs, while secrets mounted as volumes are instantiated
    as tmpfs volumes and are automatically removed from the node when the Pod is deleted. File-based delivery also aligns
    with the AWS Secrets and Configuration Provider model, which mounts Secrets Manager and Parameter Store values into EKS
    Pods as files and can work with secret rotation through the CSI Driver rotation reconciler.
  impact: Workloads that currently read secrets from environment variables may need manifest and application changes to consume
    secrets from mounted file paths instead, using Kubernetes secret volumes or the Secrets Store CSI Driver integration with
    AWS secrets stores.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/data-encryption-andsecrets-management.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/manage-secrets.html
  page_start: 139
  audit_raw: "Review workload manifests and identify any Pod, Deployment, DaemonSet, StatefulSet,\nJob, or CronJob that exposes\
    \ secrets through environment variables instead of\nmounted files. Check for both direct secret references through\nenv[].valueFrom.secretKeyRef\
    \ and bulk secret imports through\nenvFrom[].secretRef, because either pattern exposes secret data as environment\nvariables.\
    \ Prefer workloads that consume secrets through mounted Secret volumes or\nfile-based delivery from AWS secrets integrations\
    \ instead.\nRun this command to list workloads that reference secrets through either environmentvariable pattern:\nkubectl\
    \ get deploy,ds,sts,job,cronjob,pod -A -o json | jq -r '\n  .items[]\n  | .kind as $kind\n  | .metadata.namespace as $ns\n\
    \  | .metadata.name as $name\n  | (if $kind == \"Pod\" then .spec else .spec.template.spec end) as $spec\n  | select([\
    \ $spec.containers[]?, $spec.initContainers[]? ] |\nany(.env[]?.valueFrom.secretKeyRef? or .envFrom[]?.secretRef?))\n\
    \  | \"\\($ns)\\t\\($kind)/\\($name)\"\n'"
  remediation: 'Update workloads to consume secrets as mounted files instead of environment

    variables. Replace env[].valueFrom.secretKeyRef and envFrom[].secretRef

    usage with Kubernetes Secret volumes or the AWS Secrets and Configuration Provider

    with the Secrets Store CSI Driver, then update the application to read the secret from

    the mounted file path. This reduces the chance of secret values appearing in logs and

    aligns with the AWS-recommended file-based delivery pattern for EKS workloads.

    Replace secret environment variables with mounted secret files and update the

    application to read from the mounted path.'
  checks:
  - type: manual_review
    info: 'Review workload manifests and identify any Pod, Deployment, DaemonSet, StatefulSet,

      Job, or CronJob that exposes secrets through environment variables instead of

      mounted files. Check for both direct secret references through

