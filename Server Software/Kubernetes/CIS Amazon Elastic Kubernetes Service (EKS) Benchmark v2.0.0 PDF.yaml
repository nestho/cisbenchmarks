- id: 3.2.2
  title: Ensure kubelet authorization mode is set to Webhook
  scoring: scored
  profile:
  - Level 1
  description: In EKS, the available kubelet authorization modes are AlwaysAllow and Webhook. For worker nodes, the recommended
    setting is Webhook, which uses the Kubernetes authorization flow to evaluate access to the kubelet API. in contrast, AlwaysAllow
    is not optimal because it bypasses that authorization decision and permits kubelet requests without a webhook-based access
    check. This is also consistent with AWS guidance for EKS-related kubelet behavior, including AWS documentation that treats
    kubelet authorization as managed node configuration and AWS monitoring guidance that expects kubelet Webhook authorization
    for supported integrations such as Container Insights.
  rationale: AWS documents that kubelet authorization is a managed field in EKS node configuration and not one that eksctl
    normally lets you overwrite, which reflects that authorization behavior is part of the node’s baseline configuration.
    AWS also documents that EKS node customization should be delivered through launch templates and bootstrap configuration,
    and that managed node group user data is merged with Amazon EKS user data. In that model, the technically correct target
    is the effective kubelet configuration on the node, with authorization.mode set to Webhook instead of an unrestricted
    mode such as AlwaysAllow.
  impact: Setting kubelet authorization mode to Webhook keeps kubelet access aligned with AWSsupported EKS authorization behavior.
    AlwaysAllow is not recommended because it bypasses that authorization check and can also affect supported observability
    scenarios, since AWS documents kubelet Webhook authorization as a prerequisite for Container Insights.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/eksctl/customizing-the-kubelet.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
  page_start: 40
  audit_raw: 'To audit whether kubelet authentication is set to Webhook on an Amazon EKS worker

    node, query the live effective kubelet configuration through the Kubernetes API server

    proxy and inspect the kubelet configz output for authorization.mode. Kubernetes

    identifies configz as the view of the kubelet’s final actuated configuration, and the

    kubelet config schema defines the valid authorization modes as AlwaysAllow and

    Webhook. In EKS, this is the right place to verify the control because kubelet settings are

    applied through managed node configuration and bootstrap behavior rather than only

    through visible process flags.

    Using the api configz endpoint search for the status of

    authentication.."webhook".."enabled":true by extracting the live configuration

    from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to

    authentication.."webhook".."enabled":true in the output

    To interpret the result:

    • Webhook = Pass. This is the compliant result. Kubernetes documents that

    Webhook mode uses the SubjectAccessReview API to determine authorization.

    • AlwaysAllow = Fail. This is noncompliant because requests are allowed without

    webhook-based authorization. AWS also documents kubelet Webhook

    authorization as a prerequisite for Container Insights.

    • null or missing = Investigate further. Recheck the raw configz output and

    confirm the proxy path and node name are correct, because configz is the

    authoritative view of the final kubelet configuration.'
  remediation: 'If the audit returns AlwaysAllow, the worker node is permitting kubelet requests without

    webhook-based authorization and should be treated as noncompliant. If the result is

    null or the field is missing, first confirm the configz response is complete, because

    Kubernetes identifies that endpoint as the view of the kubelet’s final actuated

    configuration. Once the result is validated, remediation in EKS should be performed

    through the supported node provisioning or node update workflow, not by directly

    editing the kubelet config file on the host. AWS documents that EKS merges managed

    node bootstrap user data, treats kubelet authorization as a managed field in EKS

    tooling, and applies launch template updates to running managed node groups by

    recycling nodes.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure worker nodes

    join the cluster with kubelet authorization already set to Webhook. This is done by

    defining the setting in the bootstrap configuration that EKS applies during node creation.

    • Define authorization.mode: Webhook in the worker node bootstrap

    configuration so the setting is present when nodes first join the cluster.

    • Use a custom launch template when kubelet customization is required at cluster

    or node group creation time. AWS documents launch templates as the supported

    path for deeper managed node customization.

    • Place the setting in the supported bootstrap path, such as launch template user

    data or NodeConfig, so it becomes part of the node’s durable build configuration.

    • Validate the live effective kubelet configuration after deployment to confirm the

    setting resolves to Webhook.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to change the node launch configuration

    and then replace the current nodes so the corrected kubelet setting is applied

    consistently across the node group. This ensures the fix is durable and survives restart,

    scale-out, and node replacement events.

    • Update the custom launch template or equivalent node bootstrap configuration

    so the effective kubelet setting becomes authorization.mode: Webhook.

    • Apply the updated launch template to the managed node group so EKS launches

    replacement nodes with the corrected configuration.

    • Replace or roll the existing nodes so the running fleet is rebuilt from the updated

    launch configuration. AWS states that when a node group is updated to a newer

    launch template version, every node is recycled to match that version.

    • Re-audit the replacement nodes using the live kubelet configuration to confirm

    the effective value is Webhook.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because EKS applies kubelet settings through bootstrap

    user data and launch configuration, while Kubernetes allows effective values to be

    influenced by multiple configuration sources. As a result, a host-level edit may be

    overridden, may not match the live actuated configuration, and can be lost when the

    node is recycled or replaced.'
