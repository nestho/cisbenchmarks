- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: 'Minimize the admission of privileged containers in EKS by enforcing Pod Security Standards through Pod Security
    Admission or an equivalent policy engine, and restrict privileged workloads to only the limited system or platform namespaces
    that truly require them. AWS recommends enforcing at least the baseline profile cluster-wide and the restricted profile
    for workload namespaces because this reduces the ability to create privileged containers outside approved areas of the
    cluster. Do not generally permit containers to run with securityContext.privileged: true in EKS clusters, except for narrowly
    approved system or platform workloads.'
  rationale: In EKS, a privileged container inherits all Linux capabilities associated with root on the host, which significantly
    weakens container isolation and increases the chance that a compromised workload can interact with the underlying node
    in unsafe ways. AWS notes that containers rarely need this level of access and that Pod Security Standards are the built-in
    Kubernetes mechanism for replacing older PodSecurityPolicy controls and validating pod specifications before they are
    persisted. Using baseline or restricted enforcement helps block privilege escalation patterns during admission rather
    than relying only on runtime detection after the pod has started. If you need to run privileged containers, this should
    be defined in a separate policy and you should carefully check to ensure that only limited service accounts and users
    are given permission to use that policy.
  impact: 'Workloads that depend on privileged mode may be denied admission in namespaces enforcing Pod Security Standards,
    so certain node-level agents, device-access workloads, or other specialized platform pods may need redesign, tighter scoping,
    or isolated placement. On EKS Fargate, privileged containers are not supported at all, which further limits these deployment
    patterns. Pods with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true, or spec.ephemeralContainers[].securityContext.privileged: true will not be permitted in namespaces enforcing the
    baseline or restricted Pod Security Standard.'
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/pod-security.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/rbac-hardening.html
  page_start: 114
  audit_raw: "Review the effective Pod Security Admission configuration for every namespace in the\nEKS cluster and verify\
    \ that workload namespaces are set to a policy level that disallows\nprivileged containers. In current EKS guidance, AWS\
    \ recommends enforcing at least\nthe baseline profile cluster-wide and the restricted profile for workload namespaces\n\
    to limit creation of privileged containers outside system namespaces.\nAs part of the audit, confirm that workload namespaces\
    \ are not unlabeled, not set to\nprivileged, and not relying only on warn or audit where blocking is required.\nKubernetes\
    \ documents that enforce rejects violating pods, while warn and audit\nreport violations without preventing admission.\n\
    Then inspect existing pods for admitted use of\nspec.containers[].securityContext.privileged,\nspec.initContainers[].securityContext.privileged,\
    \ and\nspec.ephemeralContainers[].securityContext.privileged. Under the Pod\nSecurity Standards, those fields must be\
    \ unset or false for the relevant non-privileged\nprofiles.\nkubectl get pods -A -o json | jq -r '\n  .items[]\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $pod\n  | def scan($type; $list):\n      $list[]?\n      | select(.securityContext.privileged\
    \ == true)\n      | \"\\($ns)/\\($pod)\\t\\($type)=\\(.name)\\tprivileged=true\";\n    scan(\"container\"; .spec.containers),\n\
    \    scan(\"initContainer\"; .spec.initContainers),\n    scan(\"ephemeralContainer\"; .spec.ephemeralContainers)\n'\n\
    Expected Output:\nkube-system/aws-node-9vxcs    container=aws-eks-nodeagent\nprivileged=true\nkube-system/aws-node-9vxcs\
    \    initContainer=aws-vpc-cni-init\n privileged=true\nkube-system/aws-node-dgzj8    container=aws-eks-nodeagent\nprivileged=true\n\
    kube-system/aws-node-dgzj8    initContainer=aws-vpc-cni-init\n privileged=true\nkube-system/kube-proxy-dn9w5   container=kube-proxy\n\
    privileged=true\nkube-system/kube-proxy-wdm9m   container=kube-proxy\nprivileged=true\nOR\nkubectl get pods --all-namespaces\
    \ -o json | jq '.items[] |\nselect(.metadata.namespace != \"kube-system\" and\n.spec.containers[]?.securityContext?.privileged\
    \ == true) | {pod:\n.metadata.name, namespace: .metadata.namespace, container:\n.spec.containers[].name}'\nWhen creating\
    \ a Pod Security Policy, [\"kube-system\"] namespaces are excluded by\ndefault.\nThis command uses jq, a command-line\
    \ JSON processor, to parse the JSON output\nfrom kubectl get pods and filter out pods where any container has the\nsecurityContext.privileged\
    \ flag set to true. Please note that you might need to\nadjust the command depending on your specific requirements and\
    \ the structure of your\npod specifications."
  remediation: 'Configure Pod Security Admission on workload namespaces so privileged containers

    are denied when new pods are created. In EKS, Pod Security Standards are applied

    through namespace labels, and current AWS guidance is to enforce at least baseline

    cluster-wide and restricted for workload namespaces. For this control, both

    baseline and restricted disallow privileged containers, but restricted is typically the

    stronger choice for user workloads. Only enforce blocks noncompliant pods. warn and

    audit are useful during rollout, but they do not remediate the issue by themselves.

    • Label each workload namespace to enforce restricted.

    kubectl label ns NAMESPACE pod-security.kubernetes.io/enforce=restricted --

    overwrite

    • Add warn and audit labels during transition so violations are surfaced before or

    alongside enforcement.

    kubectl label ns NAMESPACE pod-security.kubernetes.io/warn=restricted --

    overwrite

    kubectl label ns NAMESPACE pod-security.kubernetes.io/audit=restricted --

    overwrite

    • Update workload manifests so no regular container, init container, or ephemeral

    container uses securityContext.privileged: true. Under the Pod Security

    Standards, those fields must be unset or false for non-privileged profiles.

    • Redeploy or restart affected workloads after the manifest changes so

    replacement pods are evaluated under the enforced namespace policy. Pod

    Security Admission evaluates pods when they are created.

    • Review system namespaces separately and do not apply the same labels

    everywhere without checking platform requirements. AWS frames this control

    around limiting privileged containers outside system namespaces.'
  checks:
  - type: manual_review
    info: 'Review the effective Pod Security Admission configuration for every namespace in the

      EKS cluster and verify that workload namespaces are set to a policy level that disallows

      privileged containers. In current EKS guidance, AWS recommends enforcing at least

      the baseline profile cluster-wide and the restricted profile for workload namespaces

      to limit creation of privileged containers outside system namespaces.

      As part of the audit, confirm that workload namespaces are not unlabeled, not set to

      priv'
    severity: medium
