- id: 4.5.2
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 1
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended team, application, or environment boundary. In EKS, namespaces are the primary logical partition
    for organizing workloads and supporting soft multi-tenancy in a shared cluster.
  rationale: Least-privilege administration in EKS depends on using namespaces as intentional operational boundaries. Kubernetes
    Role and RoleBinding objects apply at namespace scope, and EKS access policies can be scoped to one or more specific namespaces
    instead of the whole cluster. When workloads remain in default, access delegation, ownership boundaries, and namespace-scoped
    governance become harder to separate cleanly.
  impact: Using the default namespace for application workloads weakens administrative separation and makes namespace-scoped
    access control, resource governance, and network segmentation harder to apply consistently.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/tenant-isolation.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 149
  audit_raw: 'Review the EKS cluster and verify that the default namespace is not being used for

    normal application administration or routine workload placement. Objects that do not

    explicitly specify a namespace are created in default, so the audit should confirm that

    teams, applications, and environments are instead using dedicated namespaces that

    align with namespace-scoped access control, quotas, limits, service accounts, and

    network policies. Namespaces are a soft multi-tenancy boundary in EKS, so the goal is

    to confirm that user workloads are intentionally placed outside default and governed

    through namespace-specific controls.

    • Inventory the default namespace and identify any user-managed Pods,

    Services, ConfigMaps, Secrets, ServiceAccounts, Deployments, StatefulSets,

    DaemonSets, Jobs, CronJobs, Ingresses, Roles, RoleBindings,

    ResourceQuotas, LimitRanges, or NetworkPolicies that still exist there.

    kubectl get

    pod,svc,configmap,secret,serviceaccount,deploy,statefulset,daemonset,job,cron

    job,ingress,role,rolebinding,resourcequota,limitrange,networkpolicy -n

    default

    • Verify that access is not effectively centered on default. Review Kubernetes

    Role and RoleBinding assignments for that namespace and, where EKS

    access entries are used, confirm that access policies are scoped to the intended

    namespaces rather than broadly applied cluster-wide. EKS access policies

    support namespace-scoped access.

    • Confirm that user workloads have been placed into dedicated namespaces that

    reflect team, application, or environment boundaries, and that namespace-level

    controls such as quotas, limits, service accounts, and network policies are

    applied where required. Those controls are what make a namespace an actual

    administrative boundary instead of just a label.

    • Check whether the namespace design reduces shared administrative scope and

    naming sprawl. AWS recommends using namespaces as the logical separation

    mechanism for soft multi-tenancy, while Kubernetes namespaces also provide

    the uniqueness boundary for namespaced resources.

    Inventory the default namespace, identify user workloads still running there, and confirm

    access and governance are instead aligned to dedicated namespaces.'
  remediation: 'Move user workloads out of the default namespace and place them in dedicated

    namespaces that reflect the intended team, application, or environment boundary. In

    EKS, namespaces are the core logical partition for soft multi-tenancy, but they only

    become meaningful administrative boundaries when they are paired with namespacescoped access, service accounts, quotas,
    limits, and network policies. Because

    namespaced objects are created in default when no namespace is specified,

    remediation should address both existing workloads and the deployment process that

    created them there.

    • Create dedicated namespaces for each team, application, or environment that

    needs its own administrative scope, then redeploy or migrate user workloads

    from default into those namespaces.

    • Update manifests, Helm values, GitOps definitions, and pipeline defaults so

    namespaced resources explicitly set metadata.namespace and are not created

    in default by omission.

    • Re-scope access with namespace-scoped Kubernetes Role and RoleBinding

    objects and, where EKS access entries are used, associate EKS access policies

    to specific namespaces instead of the whole cluster.

    • Apply namespace-level governance such as ResourceQuota, LimitRange,

    dedicated service accounts, and network policies so the namespace boundary

    supports resource control, identity separation, and east-west traffic isolation.

    • Remove unnecessary user workloads and broad operational access from

    default, and use separate clusters rather than namespaces alone when

    stronger isolation is required for less-trusted workloads.

    Move workloads out of default, enforce explicit namespaces in deployment workflows,

    and bind access and governance controls to the target namespaces.'
