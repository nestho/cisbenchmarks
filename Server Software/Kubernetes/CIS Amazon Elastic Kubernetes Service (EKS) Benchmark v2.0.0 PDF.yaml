- id: 3.2.1
  title: Ensure kubelet anonymous authentication is disabled
  scoring: scored
  profile:
  - Level 1
  description: 'In Amazon EKS, this control means the worker node kubelet must not accept unauthenticated requests. In current
    EKS node bootstrapping, kubelet settings are applied through the node’s effective KubeletConfiguration, so this requirement
    is represented as authentication.anonymous.enabled: false in the live kubelet configuration rather than depending on a
    legacy command-line flag being visible in the process list.'
  rationale: The kubelet exposes an HTTPS API on each worker node, and Kubernetes documents that requests not rejected by
    other configured authentication methods are otherwise treated as system:anonymous in the system:unauthenticated group.
    The KubeletConfiguration schema defines authentication.anonymous.enabled as the setting that controls this behavior, while
    EKS nodeadm merges kubelet configuration with defaults, so the technically correct review point in EKS is the effective
    kubelet config on the node.
  impact: Disabling kubelet anonymous authentication causes unauthenticated requests to be rejected with 401 Unauthorized
    instead of being processed as anonymous access, which reduces exposure of sensitive node-local kubelet endpoints and forces
    callers to use authenticated access paths.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/update-managed-nodegroup.html
  page_start: 36
  audit_raw: 'To audit whether kubelet anonymous authentication is disabled on an Amazon EKS

    worker node, query the live actuated kubelet configuration through the Kubernetes API

    server proxy and inspect the configz output. This is the preferred method over

    grepping the kubelet process because Kubernetes documents that kubelet settings can

    come from a config file, drop-in files, and command-line flags, and that configz shows

    the final effective configuration.

    Using the api configz endpoint search for the status of authentication...

    "anonymous":{"enabled":false} by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to

    "authentication"..."anonymous":{"enabled":false} in the output

    To interpret the result:

    • false = Pass. Anonymous requests to the kubelet are disabled. Kubernetes

    states that disabling anonymous access causes unauthenticated requests to

    receive 401 Unauthorized.

    • true = Fail. Requests not rejected by another authentication method can be

    treated as system:anonymous in the system:unauthenticated group.

    • null or missing = Investigate further. That would be unexpected for a normal

    kubelet config response because authentication.anonymous is part of the kubelet

    configuration structure; verify that the request reached the kubelet successfully

    and that you are querying the intended node.'
  remediation: 'If the audit returns true, the worker node is allowing anonymous requests to the kubelet

    and should be treated as noncompliant. If the result is null or the field is missing,

    first confirm the configz response is complete, because Kubernetes identifies that

    endpoint as the view of the kubelet’s final actuated configuration. Once the result is

    validated, remediation in EKS should be performed through the supported node

    provisioning or node update workflow, not by directly editing the kubelet config file on

    the host.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure worker nodes

    join the cluster with kubelet anonymous authentication already disabled. This is done by

    defining the setting in the bootstrap configuration that EKS applies during node creation.

    • Define authentication.anonymous.enabled: false in the worker node

    bootstrap configuration so the setting is present when nodes first join the cluster.

    • Use a custom launch template when kubelet customization is required at cluster

    or node group creation time.

    • Place the setting in the supported bootstrap path, such as launch template user

    data or NodeConfig, so it becomes part of the node’s durable build configuration.

    • Validate the live effective kubelet configuration after deployment to confirm the

    setting resolves to false.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to change the node launch configuration

    and then replace the current nodes so the corrected kubelet setting is applied

    consistently across the node group. This ensures the fix is durable and survives restart,

    scale-out, and node replacement events.

    • Update the custom launch template or equivalent node bootstrap configuration

    so the effective kubelet setting becomes

    authentication.anonymous.enabled: false.

    • Apply the updated launch template to the managed node group so EKS launches

    replacement nodes with the corrected configuration.

    • Replace or roll the existing nodes so the running fleet is rebuilt from the updated

    launch configuration.

    • Re-audit the replacement nodes using the live kubelet configuration to confirm

    the effective value is false.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because EKS applies kubelet settings through bootstrap

    user data and launch configuration, and the effective kubelet values can be influenced

    by multiple configuration sources. As a result, a host-level edit may be overridden, may

    not match the live actuated configuration, and can be lost when the node is recycled or

    replaced.'
