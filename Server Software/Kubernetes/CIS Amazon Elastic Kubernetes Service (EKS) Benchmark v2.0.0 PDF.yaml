- id: 4.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 1
  description: External secret storage for EKS means keeping application secrets outside native Kubernetes Secret objects
    and retrieving them from a managed service such as AWS Secrets Manager when workloads need them. This approach lets EKS
    workloads consume secrets through integrations such as the AWS Secrets and Configuration Provider with the Secrets Store
    CSI Driver, instead of relying only on Kubernetes to store and distribute sensitive values.
  rationale: Storing high-value credentials outside Kubernetes reduces dependence on clusterresident secret objects and shifts
    lifecycle functions such as encryption, access control, rotation, and auditability to a dedicated secrets service. In
    EKS, Pods can retrieve secrets from Secrets Manager by using IAM-scoped access through EKS Pod Identity or IRSA, and the
    AWS Secrets and Configuration Provider can mount those values into Pods as files through the Secrets Store CSI Driver.
    This model supports automatic rotation workflows and tighter secret-to-workload scoping than broadly distributing static
    values through Kubernetes manifests.
  impact: Moving to external secret storage usually requires manifest and application changes so workloads fetch or mount
    secrets from Secrets Manager instead of reading only native Kubernetes Secret objects, and it may require Pod Identity
    or IRSA permissions plus CSI-based integration components. In return, secret rotation and access management can be handled
    centrally in AWS rather than separately inside each cluster.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/data-encryption-andsecrets-management.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/manage-secrets.html
  page_start: 142
  audit_raw: 'Review the EKS cluster’s secrets architecture and verify that required workloads use an

    external secrets store such as AWS Secrets Manager instead of relying only on native

    Kubernetes Secret objects. The audit should confirm both the integration path and the

    workload-level access model, because external secret storage in EKS typically depends

    on the AWS Secrets and Configuration Provider, the Secrets Store CSI Driver, and Podscoped IAM through EKS Pod Identity
    or IRSA.

    • Identify workloads that still consume high-value credentials from native

    Kubernetes Secrets and determine which of those should be moved to AWS

    Secrets Manager or Parameter Store.

    • Confirm the external secret integration components are in use, including the

    AWS Secrets and Configuration Provider and Secrets Store CSI Driver, and

    verify that workloads reference a SecretProviderClass where external secrets

    are mounted as files.

    • Verify Pod-level access is scoped through EKS Pod Identity or IRSA so each

    workload can retrieve only the secrets it is authorized to read.

    • Check whether rotation, access control, and audit requirements are being

    handled in the external store rather than duplicated through static secret values

    embedded in Kubernetes manifests or long-lived native Secret objects.'
  remediation: 'Move high-value application secrets out of native Kubernetes Secret objects and into an

    external store such as AWS Secrets Manager. Then update EKS workloads to retrieve

    those secrets through the AWS Secrets and Configuration Provider with the Secrets

    Store CSI Driver, using Pod-scoped IAM through EKS Pod Identity or IRSA. This shifts

    encryption, access control, rotation, and auditing to AWS instead of leaving those

    functions primarily in cluster-resident Secret objects.

    • Create the required secrets in AWS Secrets Manager and define workload

    access with least-privilege IAM policies.

    • Install and configure the AWS Secrets and Configuration Provider and the

    Secrets Store CSI Driver for EKS.

    • Update workload manifests to mount external secrets through a

    SecretProviderClass instead of reading only native Kubernetes Secret

    objects.

    • Enable rotation and update the application to read secrets from the mounted path

    so secret lifecycle management is handled centrally in AWS.

    Move secrets to AWS Secrets Manager, mount them into Pods, and scope access with

    Pod Identity or IRSA.'
  checks:
  - type: manual_review
    info: 'Review the EKS cluster’s secrets architecture and verify that required workloads use an

