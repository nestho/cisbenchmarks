    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to readOnlyPort: 0 in the output

    To interpret the result:

    • 0 = Pass. Kubernetes defines 0 as disabled, which is the expected state for this

    control.

    • A nonzero integer such as 10255 = Fail. That means the kubelet read-only

    service is enabled and is serving without authentication or authorization.

    • null or a missing field = If readOnlyPort is absent from configz, it commonly

    indicates the effective value is 0, which disables the unauthenticated read-only

    kubelet service.'
  remediation: 'If the audit returns a nonzero readOnlyPort, the worker node is exposing the kubelet

    read-only service and should be treated as noncompliant. If the field is missing from

    configz, first confirm whether it is simply omitted because the effective value is 0, since

    the kubelet configuration schema defines readOnlyPort as the unauthenticated readonly service and states that 0 disables
    it. Once a noncompliant state is confirmed,

    remediation in EKS should be performed through the supported node provisioning or

    node update workflow, not by directly editing the kubelet config file on the host. AWS

    documents that managed node customization is applied through launch templates and

    bootstrap logic, and that updating a managed node group to a new launch template

    version replaces the nodes to match that configuration.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure worker nodes

    start with the kubelet read-only service disabled in the effective kubelet configuration. In

    practice, that means setting the node bootstrap configuration so readOnlyPort resolves

    to 0 from the time the node joins the cluster.

    • Define the kubelet configuration so readOnlyPort: 0, which disables the

    unauthenticated read-only kubelet service.

    • Use a custom launch template when kubelet customization is required at cluster

    or node group creation time, because AWS uses launch templates for deeper

    managed node customization.

    • Place the setting in the supported bootstrap path, such as launch template user

    data, NodeConfig, or a custom AMI workflow when needed, so it becomes part

    of the node’s durable build configuration.

    • Validate after deployment that the live kubelet configuration reflects the intended

    state and that the read-only service is not enabled on the node.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to update the node launch configuration so

    replacement nodes start with the kubelet read-only service disabled, then roll or replace

    the current nodes so the corrected state is applied consistently across the node group.

    This makes the fix durable across restart, scale-out, and node replacement events.

    • Update the custom launch template or equivalent node bootstrap configuration

