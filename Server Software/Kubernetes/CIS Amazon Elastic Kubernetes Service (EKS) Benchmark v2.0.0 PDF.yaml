controls:
- id: 2.1.1
  title: Enable EKS control plane logging
  scoring: scored
  profile:
  - Level 1
  description: Enable control plane logging in Amazon EKS to provide visibility into the operation of the managed Kubernetes
    control plane and activity processed through its core components. Control plane logs create a persistent record of administrative
    activity, authentication events, scheduling behavior, and other platform operations to support monitoring, troubleshooting,
    investigation, and accountability. In EKS, control plane log types are enabled on a per-cluster basis and exported to
    Amazon CloudWatch Logs for retention, search, and analysis.
  rationale: In Amazon EKS, control plane logging must be explicitly enabled for each cluster and for each desired log type.
    EKS provides separate control plane log types for the Kubernetes API server api, audit activity audit, EKS authenticator
    events authenticator, controller manager operations controllerManager, and scheduler activity scheduler, allowing organizations
    to capture visibility across the managed control plane rather than relying on a single source of diagnostic data. When
    enabled, these logs are exported to Amazon CloudWatch Logs, where they support investigation of authentication events,
    administrative actions, control plane errors, scheduling behavior, and other operational conditions that may indicate
    misuse, misconfiguration, or service issues. Collecting these log streams improves the ability to monitor cluster activity,
    investigate abnormal behavior, validate administrative actions, and perform more targeted remediation using a centralized
    and retained record of control plane events.
  impact: Without EKS control plane logging, visibility into API activity, authentication events, scheduler actions, and other
    managed control plane operations is reduced, which can hinder troubleshooting, delay incident investigation, and weaken
    accountability for administrative activity. Enabling these logs improves detection and response capabilities, but it also
    increases Amazon CloudWatch Logs ingestion and storage costs.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
  - 2. https://docs.aws.amazon.com/cli/latest/reference/eks/update-cluster-config.html
  page_start: 19
  audit_raw: "From Console:\n1. For each EKS Cluster in each region;\n2. Go to Amazon Elastic Kubernetes Service > Clusters\
    \ > CLUSTER_NAME >\nObservability > Control plane logs\n3. This will show the control plane logging configuration:\no\
    \ API server (Logs pertaining to API requests to the cluster)\no Audit (Logs pertaining to cluster access via the Kubernetes\
    \ API.)\no Authenticator (Logs pertaining to authentication requests into the cluster.)\no Controller Manager (Logs pertaining\
    \ to state of cluster controllers.)\no Scheduler (Logs pertaining to scheduling decisions.)\n4. Ensure that all options\
    \ are set to 'Enabled' for logging you want to capture\nFrom AWS CLI:\n1. For each EKS Cluster in each region:\naws eks\
    \ describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query 'cluster.logging.clusterLogging'\n\
    Authenticator: Disabled\nController manager: Disabled\nScheduler: Disabled"
  remediation: "From Console:\n1. For each EKS Cluster in each region;\n2. Go to Amazon Elastic Kubernetes Service > Clusters\
    \ > CLUSTER_NAME >\nObservability > Control plane logs\n3. Click Manage to enable or disable logging.\n4. Ensure that\
    \ one or more options are toggled to Enabled and Save Changes.\no API server: Enabled\no Audit: Enabled\no Authenticator:\
    \ Enabled\no Controller manager: Enabled\no Scheduler: Enabled\n5. Click 'Save Changes'.\nFrom the AWS CLI:\n1. For each\
    \ EKS Cluster in each region:\naws eks update-cluster-config \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\
    \n  --logging\n'{\"clusterLogging\":[{\"types\":[\"api\",\"audit\",\"authenticator\",\"controllerManage\nr\",\"scheduler\"\
    ],\"enabled\":true}]}'"
  checks:
  - type: sql
    command: 'show the control plane logging configuration:'
    severity: medium
    info: 'From Console:

      1. For each EKS Cluster in each region;

      2. Go to Amazon Elastic Kubernetes Service > Clusters > CLUSTER_NAME >

      Observability > Control plane logs

      3. This will show the control plane logging configuration:

      o API server (Logs pertaining to API requests to the cluster)

      o Audit (Logs pertaining to cluster access via the Kubernetes API.)

      o Authenticator (Logs pertaining to authentication '
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is configured by a kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: Ensuring that the kubeconfig file permissions are set to 644 or more restrictive significantly strengthens the security
    posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to the kubeconfig
    file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk of malicious alterations
    that could compromise the cluster's integrity. However, this configuration may slightly impact usability, as it limits
    the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators will need to
    balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing kubelet
    configurations.
  references:
  - 1. https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/
  page_start: 23
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/var/lib/kubelet/kubeconfig which is the location of the kubeconfig\n\
    file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %a /var/lib/kubelet/kubeconfig (or stat -c\
    \ %a\n/host/var/lib/kubelet/kubeconfig if in debub mode)\nThe output of the above command gives you the kubeconfig file's\
    \ permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more restrictive.\nMethod\
    \ 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's file\
    \ system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system into\
    \ the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n    \
    \  path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"\
    ]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n      privileged: true\nSave\
    \ this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is\
    \ running, you can exec into it to check file permissions on the node:\nkubectl exec -it -n kube-public file-check --\
    \ sh\nNow you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and\
    \ check the permission level of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nVerify that if a file is specified\
    \ and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %a /var/lib/kubelet/kubeconfig (or stat -c %a &&
      ls -l /host/var/lib/kubelet/kubeconfig
    expected: Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/var/li'
