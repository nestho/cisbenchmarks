- id: 3.2.4
  title: Ensure the kubelet read-only port is disabled
  scoring: scored
  profile:
  - Level 1
  description: In EKS, this setting is intended to keep kubelet access limited to the standard secured management path used
    for node operations, instead of exposing an additional legacy interface on the worker node. In practice, it should be
    assessed in the node’s effective kubelet configuration because AWS applies node behavior through bootstrap configuration,
    launch templates, and managed node initialization rather than relying only on visible runtime flags.
  rationale: 'Kubernetes defines readOnlyPort as a read-only kubelet service with no authentication or authorization, and
    specifies that setting readOnlyPort: 0 disables that service. A nonzero value creates an extra listener that is separate
    from the main kubelet serving port. In EKS, AWS documents that normal control plane to node operations such as logs, exec,
    and port-forward use TCP port 10250, so the preferred design is to keep kubelet access consolidated on that standard endpoint
    and leave the unauthenticated read-only service disabled. Because AWS uses launch templates and bootstrap configuration
    for deeper node customization, this state should be enforced through the node’s managed configuration path.'
  impact: Disabling the kubelet readOnlyPort removes an unnecessary unauthenticated kubelet service while preserving the standard
    kubelet access path EKS uses on port 10250
