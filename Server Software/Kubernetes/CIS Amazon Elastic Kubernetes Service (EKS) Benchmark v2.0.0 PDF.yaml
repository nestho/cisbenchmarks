- id: 5.3.1
  title: Use customer managed KMS keys for EKS envelope encryption of Kubernetes secrets
  scoring: manual
  profile:
  - Level 1
  description: Using customer managed KMS keys for EKS envelope encryption adds a customercontrolled protection layer for
    Kubernetes secrets stored through the Kubernetes API. This strengthens data-at-rest protection while allowing organizations
    to manage key ownership, rotation, policy, and audit visibility for the key used to protect secret data.
  rationale: Envelope encryption adds a second encryption layer to Kubernetes secrets stored through the EKS control plane.
    Secret data is encrypted with a unique data encryption key, and that data encryption key is then encrypted with a key
    encryption key in AWS KMS before the object is persisted in etcd. This means the secret is stored in ciphertext in the
    backing datastore and is decrypted only through the Kubernetes API server path, which strengthens protection beyond the
    underlying storage encryption used for etcd. In the current EKS model, envelope encryption protects Kubernetes API data
    by using KMS-backed key encryption and derived data encryption keys within the control plane encryption flow. A customer
    managed KMS key gives the customer direct control over key policy, rotation, audit visibility, and key lifecycle for the
    key that protects those data encryption keys. Where a customer managed key is associated for Kubernetes secrets, that
    same key can also serve as the key encryption key for Kubernetes API data protected by envelope encryption.
  impact: Using a customer managed KMS key increases customer control, but it also adds KMS cost, key-policy administration,
    and lifecycle responsibility. If you use your own key, standard KMS charges apply, and deleting the KMS key used for EKS
    encryption can leave the cluster in a permanently degraded and unrecoverable state.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/enable-kms.html
  page_start: 173
  audit_raw: "Review the EKS cluster configuration and verify that Kubernetes secrets are protected\nwith a customer managed\
    \ KMS key, not only the default AWS-owned envelopeencryption key. For this control, the important check is whether the\
    \ cluster is associated\nwith a customer managed key for EKS envelope encryption. Also verify that the key is\nusable\
    \ by the cluster, is in the same Region, and has not been disabled, deleted, or\nstripped of required grants or permissions.\
    \ A customer managed key association should\nappear on the cluster, while current EKS clusters that rely only on the default\
    \ AWSowned key do not expose a customer key ARN for this purpose.\n• Review the cluster encryption configuration and confirm\
    \ a customer managed\nKMS key ARN is associated to the cluster for Kubernetes secrets protection. If no\ncustomer key\
    \ ARN is associated, the cluster does not meet this control.\naws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n\
    \  --region $REGION_CODE \\\n  --query 'cluster.encryptionConfig'\n• In the command output, verify that the encryption\
    \ configuration includes\nresources with secrets and a provider.keyArn value for the customer\nmanaged KMS key. If the\
    \ response is empty or no customer key ARN is present,\nthis control is not satisfied.\n• Review the selected KMS key\
    \ and confirm it is symmetric, supports encrypt and\ndecrypt operations, and exists in the same Region as the cluster.\
    \ If the key is in\nanother account, confirm the required principal still has access to use it.\n• Verify the key is still\
    \ enabled and that grants or key-policy permissions required\nby EKS have not been revoked. A disabled key, revoked grant,\
    \ or deleted key\ncan place the cluster into a degraded or unrecoverable state.\n• Where continuous compliance monitoring\
    \ is used, confirm the cluster would pass\nthe EKS_SECRETS_ENCRYPTED AWS Config rule with the expected customer\nmanaged\
    \ key ARN configured as a parameter."
  remediation: "Configure the EKS cluster to use a customer managed KMS key for envelope\nencryption of Kubernetes secrets\
    \ so secret data stored through the Kubernetes API is\nprotected with a customer-controlled key encryption key in AWS\
    \ KMS. This requires an\nexisting symmetric KMS key in the same Region as the cluster, with key policy and\ngrant permissions\
    \ that allow EKS to use the key.\nThe associate-encryption-config operation does not create a KMS key and does\nnot encrypt\
    \ arbitrary data directly. It associates an existing customer managed KMS key\nto the cluster so EKS can use it for envelope\
    \ encryption of Kubernetes secrets.\nAfter the association is made, the cluster update must complete successfully and\
    \ the\nkey must remain enabled and accessible. Disabling, deleting, or breaking access to the\nassociated key can place\
    \ the cluster in a degraded or unrecoverable state.\n• Create or identify a customer managed symmetric KMS key that already\
    \ exists in\nthe same Region as the EKS cluster and is allowed for EKS use.\n• Associate that existing KMS key to the\
    \ cluster for secrets encryption. Replace\nthe variables with real values before running the command. In this command,\n\
    CLUSTER_NAME is the EKS cluster name, REGION_CODE is the cluster Region, and\nKEY_ARN is the full ARN of the existing\
    \ KMS key.\naws eks associate-encryption-config \\\n  --cluster-name \"$CLUSTER_NAME\" \\\n  --region \"$REGION_CODE\"\
    \ \\\n  --encryption-config\n\"[{\\\"resources\\\":[\\\"secrets\\\"],\\\"provider\\\":{\\\"keyArn\\\":\\\"${KEY_ARN}\\\
    \"}}]\"\n• Wait for the cluster update to complete, because this operation runs as an\nasynchronous EKS update.\n• Recheck\
    \ the cluster configuration and confirm that cluster.encryptionConfig\ncontains resources set to secrets and the expected\
    \ provider.keyArn.\n• Keep the associated KMS key enabled and do not delete it while the cluster\ndepends on it."
  checks:
  - type: manual_review
    info: 'Review the EKS cluster configuration and verify that Kubernetes secrets are protected

      with a customer managed KMS key, not only the default AWS-owned envelopeencryption key. For this control, the important
      check is whether the cluster is associated

      with a customer managed key for EKS envelope encryption. Also verify that the key is

      usable by the cluster, is in the same Region, and has not been disabled, deleted, or

      stripped of required grants or permissions. A customer managed key association sh'
    severity: medium
- id: 5.4.1
  title: Restrict EKS control plane endpoint access with private access and public CIDR allowlists
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is about reducing exposure of the Kubernetes API server without necessarily making it private-only.
    The intended end state is that private endpoint access is enabled, and if the public endpoint remains enabled, it is narrowed
    to a small set of trusted source CIDR ranges instead of remaining open to all internet addresses. This keeps the control
    plane reachable for approved administration paths while lowering unnecessary internet exposure.
  rationale: 'EKS exposes separate settings for the API server through endpointPrivateAccess, endpointPublicAccess, and publicAccessCidrs.
    When private access is enabled, API requests that originate inside the cluster VPC use the private VPC endpoint, and access
    to that private endpoint is governed by the cluster security group. When public access is enabled, the public endpoint
    remains internet reachable, but publicAccessCidrs can restrict it to explicit source ranges. If private access is not
    enabled, the CIDR allowlist must also account for the outbound source addresses used by nodes or Fargate pods, such as
    NAT gateway egress addresses, or those components can lose access to the API server. The CIDR allowlist affects the public
    endpoint only and does not control the private endpoint. Restricting access to an authorized network can provide additional
    security benefits for your container cluster, including: • Better protection from outsider attacks: Authorized networks
    provide an additional layer of security by limiting external access to a specific set of addresses you designate, such
    as those that originate from your premises. This helps protect access to your cluster in the case of a vulnerability in
    the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized networks
    help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked certificates
    used from outside Cloud Services and outside the authorized IP ranges (for example, from addresses outside your company)
    are still denied access.'
  impact: This recommendation gives you a balanced hardening option because it reduces public exposure while preserving approved
    remote administration paths. The tradeoff is operational maintenance of the CIDR allowlist and the risk of accidental
    lockout if trusted administrator IPs, NAT egress addresses, or other required source ranges are omitted. It is stricter
    than the default public endpoint model, but less restrictive than a private-only API design.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/config-cluster-endpoint.html
  page_start: 177
  audit_raw: "Check for the following endpointPrivateAccess and endpointPublicAccess to be\n'true'\naws eks describe-cluster\
    \ \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query\n\"cluster.resourcesVpcConfig.{endpointPrivateAccess:endpointPrivateAccess,endp\n\
    ointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}\" \\\n  --output json\nExpected Output:\n{\n\
    \    \"endpointPrivateAccess\": true,\n    \"endpointPublicAccess\": true,\n    \"publicAccessCidrs\": [\n        \"203.0.113.5/32\"\
    \n    ]\n}\nNote: Check for publicAccessCidrs is set to a valid IP address not set to 0.0.0.0/0"
  remediation: "By enabling private endpoint access to the Kubernetes API server, all communication\nbetween your nodes and\
    \ the API server stays within your VPC. You can also limit the IP\naddresses that can access your API server from the\
    \ internet, or completely disable\ninternet access to the API server.\nWith this in mind, you can update your cluster\
    \ accordingly using the AWS CLI to ensure\nthat Private Endpoint Access is enabled.\nIf you choose to also enable Public\
    \ Endpoint Access then you should also configure a\nlist of allowable CIDR blocks, resulting in restricted access from\
    \ the internet. If you\nspecify no CIDR blocks, then the public API server endpoint is able to receive and\nprocess requests\
    \ from all IP addresses by defaulting to ['0.0.0.0/0'].\nFor example, the following command would enable private access\
    \ to the Kubernetes\nAPI as well as limited public access over the internet from a single IP address (noting\nthe /32\
    \ CIDR suffix):\naws eks update-cluster-config \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --resources-vpc-config\
    \ endpointPrivateAccess=true,\nendpointPublicAccess=true, publicAccessCidrs=\"203.0.113.5/32\"\nNote:\nThe CIDR blocks\
    \ specified cannot include reserved addresses. There is a maximum\nnumber of CIDR blocks that you can specify. For more\
    \ information, see the EKS\nService Quotas link in the references section. For more detailed information, see the\nEKS\
    \ Cluster Endpoint documentation link in the references section."
  checks:
  - type: manual_review
    info: "Check for the following endpointPrivateAccess and endpointPublicAccess to be\n'true'\naws eks describe-cluster\
      \ \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query\n\"cluster.resourcesVpcConfig.{endpointPrivateAccess:endpointPrivateAccess,endp\n\
      ointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}\" \\\n  --output json\nExpected Output:\n\
      {\n    \"endpointPrivateAccess\": true,\n    \"endpointPublicAccess\": true,\n    \"publicAccessCidrs\": [\n       \
      \ \"203.0.113.5/32\"\n    ]\n}\nNote: Ch"
    severity: medium
- id: 5.4.2
  title: Enable private-only EKS control plane access and disable the public endpoint
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is the strict private-only version of API endpoint hardening. The intended end state is
    that the Kubernetes API server is reachable only from inside the cluster VPC or from a connected private network, and
    there is no internet-reachable public API endpoint at all. This is a pure control-plane exposure decision.
  rationale: In EKS, disabling public access requires private access to be enabled. In that configuration, all traffic to
    the Kubernetes API server must come from within the cluster VPC or from a connected network path, and kubectl access from
    the internet is not available. The private endpoint is controlled by the cluster security group, while publicAccessCidrs
    becomes irrelevant because there is no public endpoint to filter. The cluster endpoint is resolved through DNS to a private
    IP address for private-only access, and administration from outside the VPC must come through connectivity such as VPN,
    Transit Gateway, or Direct Connect rather than through an internet path. In a private cluster, the master node has two
    endpoints, a private and public endpoint. The private endpoint is the internal IP address of the master, behind an internal
    load balancer in the master's VPC network. Nodes communicate with the master using the private endpoint. The public endpoint
    enables the Kubernetes API to be accessed from outside the master's VPC network. Although Kubernetes API requires an authorized
    token to perform sensitive actions, a vulnerability could potentially expose the Kubernetes publicly with unrestricted
    access. Additionally, an attacker may be able to identify the current cluster and Kubernetes API version and determine
    whether it is vulnerable to an attack. Unless required, disabling public endpoint will help prevent such threats, and
    require the attacker to be on the master's VPC network to perform any attack on the Kubernetes API.
  impact: This recommendation controls for reducing direct exposure of the EKS control plane, but it requires deliberate private
    connectivity for administrators, automation, and any external systems that need Kubernetes API access. If that private
    access path is missing or incomplete, cluster operations, troubleshooting, and deployment tooling can be blocked even
    though the cluster itself is healthy.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/config-cluster-endpoint.html
  page_start: 180
  audit_raw: "Check for private endpoint access to the Kubernetes API server\naws eks describe-cluster \\\n  --name $CLUSTER_NAME\
    \ \\\n  --region $REGION_CODE \\\n  --query\n\"cluster.resourcesVpcConfig.{endpointPublicAccess:endpointPublicAccess,\n\
    endpointPrivateAccess:endpointPrivateAccess}\" \\\n  --output json\nExpected Output:\n{\n    \"endpointPublicAccess\"\
    : false,\n    \"endpointPrivateAccess\": true\n}"
  remediation: "By enabling private endpoint access to the Kubernetes API server, all communication\nbetween your nodes and\
    \ the API server stays within your VPC.\nWith this in mind, you can update your cluster accordingly using the AWS CLI\
    \ to ensure\nthat Private Endpoint Access is enabled.\nFor example, the following command would enable private access\
    \ to the Kubernetes\nAPI and ensure that no public access is permitted:\naws eks update-cluster-config \\\n  --name $CLUSTER_NAME\
    \ \\\n  --region $REGION_CODE \\\n  --resources-vpc-config\nendpointPrivateAccess=true,endpointPublicAccess=false\nNote:\
    \ For more detailed information, see the EKS Cluster Endpoint documentation link\nin the references section."
  checks:
  - type: manual_review
    info: "Check for private endpoint access to the Kubernetes API server\naws eks describe-cluster \\\n  --name $CLUSTER_NAME\
      \ \\\n  --region $REGION_CODE \\\n  --query\n\"cluster.resourcesVpcConfig.{endpointPublicAccess:endpointPublicAccess,\n\
      endpointPrivateAccess:endpointPrivateAccess}\" \\\n  --output json\nExpected Output:\n{\n    \"endpointPublicAccess\"\
      : false,\n    \"endpointPrivateAccess\": true\n}"
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: manual
  profile:
  - Level 1
  description: This recommendation is about the data plane, not the control plane. It means worker nodes are placed in private
    subnets and are not intended to have direct public internet exposure. In the common pattern, nodes run in private subnets
    while internet-facing ingress resources are placed in public subnets. This changes where compute runs and how node traffic
    exits the VPC, but it does not by itself determine whether the Kubernetes API endpoint is public, private, or both.
  rationale: EKS managed node groups can be launched in either public or private subnets, so private nodes are a deliberate
    architecture choice rather than a built-in default. Placing nodes in private subnets reduces direct reachability of the
    worker instances and gives tighter control over egress paths. At the same time, those nodes still need access to required
    services such as ECR for image pulls, and that access must be provided through a NAT gateway or the necessary VPC endpoints.
    In a fully private cluster design with no outbound internet access, endpoint private access is required so nodes can register
    with the cluster, and additional VPC endpoints are needed for supporting services such as ECR, S3, STS, EKS Auth, and
    others depending on workload needs.
  impact: This reduces direct internet exposure of the worker nodes and usually improves traffic control around the data plane,
    but it increases dependency on NAT design, VPC endpoints, subnet routing, and private management methods such as SSM or
    internal jump-host patterns. It also does not automatically make the control plane private. A cluster can have private
    nodes and still expose a public API endpoint unless the endpoint settings are hardened separately.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/subnets.html
  page_start: 183
  audit_raw: "Review the subnets used by each EKS node group and verify that worker nodes are\ndeployed in private subnets,\
    \ not public subnets. For this control, the deciding evidence\nis node subnet placement, public IP behavior, and subnet\
    \ routing, not the control plane\nendpoint settings. A compliant private-node design places nodes in subnets that do not\n\
    auto-assign public IP addresses and do not have a default route to an Internet Gateway.\nIf outbound access is required,\
    \ the design should use a NAT gateway or the necessary\nVPC endpoints instead.\nReview each node group and identify the\
    \ subnet IDs used by the worker nodes. If the\nnode group is placed in public subnets, this control is not satisfied.\n\
    aws ec2 describe-subnets \\\n  --subnet-ids $(aws eks describe-cluster \\\n    --name $CLUSTER_NAME \\\n    --region $REGION_CODE\
    \ \\\n    --query 'cluster.resourcesVpcConfig.subnetIds' \\\n    --output text) \\\n  --region $REGION_CODE \\\n  --query\n\
    'Subnets[].{SubnetId:SubnetId,MapPublicIpOnLaunch:MapPublicIpOnLaunch}' \\\n  --output table\nExpected output: a table\
    \ containing MapPublicIpOnLaunch values of True or False\nand the corresponding SubnetId. These are the subnets you must\
    \ inspect next.\nPrivate-node compliance is not determined by the node group alone, but by whether\nthese subnets are\
    \ actually private.\n• Verify the node subnets do not auto-assign public IPv4 addresses. Managed\nnode groups in public\
    \ subnets require automatic public IP assignment, so a true\nvalue here indicates a public-subnet design rather than private\
    \ nodes.\n• Verify the route table associated with each node subnet does not contain a\ndefault route such as 0.0.0.0/0\
    \ to an Internet Gateway. Private subnets can still\nhave outbound access through a NAT gateway, but they should not route\
    \ directly\nto an Internet Gateway.\n• Verify the subnets identified for the node group are intended private subnets in\n\
    the cluster VPC design and that nodes do not require direct public IP reachability\nfor administration or workload traffic.\n\
    • Verify outbound dependencies for private nodes are satisfied through NAT or\nrequired VPC endpoints so nodes can still\
    \ pull images and reach supporting\nservices without direct public exposure."
  remediation: 'For existing worker nodes that run in public subnets, remediate the nodes by replacing

    them with a new node group that uses only private subnets, then migrating workloads

    and retiring the original node group. Managed node group subnet placement is defined

    when the node group is created, so moving existing nodes to private subnets is handled

    as a replacement and migration activity rather than an in-place subnet change. The

    target private subnets should not auto-assign public IPv4 addresses and should not

    have a default route to an Internet Gateway. If outbound access is required for image

    pulls or AWS API calls, provide it through a NAT gateway or the required VPC

    endpoints instead.

    • Create a new node group that uses only private subnet IDs. Do not reuse public

    subnets for the replacement worker nodes.

    • Ensure the replacement subnets do not auto-assign public IPv4 addresses, so

    new worker instances are launched without public IPs.

    • Ensure the route tables for those subnets do not send 0.0.0.0/0 directly to an

    Internet Gateway. If internet egress is needed, route it through a NAT gateway or

    use the necessary VPC endpoints. ECR image pulls for private-subnet nodes

    require NAT or the ECR API, ECR DKR, and S3 endpoints.

    • If a launch template is used, confirm its network interface settings do not assign

    public IP addresses or otherwise override the private-subnet design.

    • Cordon and drain workloads from the existing public-subnet nodes, move

    scheduling to the new private-subnet node group, then delete the old node group

    after workloads are stable. Managed node groups support adding new node

    groups to an existing cluster and handle node lifecycle through replacement

    rather than manual node re-registration.'
  checks:
  - type: manual_review
    info: 'Review the subnets used by each EKS node group and verify that worker nodes are

      deployed in private subnets, not public subnets. For this control, the deciding evidence

      is node subnet placement, public IP behavior, and subnet routing, not the control plane

      endpoint settings. A compliant private-node design places nodes in subnets that do not

      auto-assign public IP addresses and do not have a default route to an Internet Gateway.

      If outbound access is required, the design should use a NAT gateway '
    severity: medium
- id: 5.4.4
  title: Use TLS certificates on EKS load balancer listeners for encrypted client connections
  scoring: manual
  profile:
  - Level 1
  description: Using TLS certificates on EKS load balancer listeners protects client-to-load-balancer traffic in transit by
    presenting a trusted server certificate and negotiating encrypted HTTPS or TLS connections at the listener. In EKS, this
    commonly means configuring TLS on an NLB listener for Service resources or specifying certificate ARNs for ALBbased ingress
    so externally exposed application entry points do not rely on unencrypted HTTP.
  rationale: EKS supports TLS configuration on both major load balancer paths. For NLB, EKS Auto Mode supports listener-level
    TLS through service annotations such as aws-loadbalancer-ssl-cert, which specifies the ACM certificate ARN, and aws-loadbalancer-ssl-ports,
    which identifies the listener ports that should use TLS. For ALB, EKS Auto Mode uses IngressClassParams, where certificate
    ARNs are part of the load balancer configuration for HTTP and HTTPS traffic. This matters because the listener is the
    point where the client session is negotiated, the certificate is presented, and encrypted traffic is established before
    requests are forwarded to targets. The network security guidance for EKS also makes clear that TLS can terminate at the
    load balancer, at ingress, or continue end to end to the pod depending on the security model, so requiring certificates
    on load balancer listeners is the baseline control for securing the external client connection path.
  impact: This control improves protection against eavesdropping and tampering on client-facing connections, but it introduces
    certificate lifecycle and listener configuration requirements. The certificate ARN must match the intended domain names,
    the correct listener ports must be configured for TLS, and expired or missing certificates can break client access even
    when the workload itself is healthy. It also does not by itself guarantee end-to-end encryption beyond the load balancer,
    because traffic from the load balancer to the backend may still be unencrypted unless a separate backend TLS design is
    implemented.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-nlb.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-alb.html
  page_start: 186
  audit_raw: 'Review all EKS Service resources of type LoadBalancer and all Ingress resources that

    expose client traffic, and verify that client-facing listeners use HTTPS or TLS with a valid

    certificate. For NLB-backed Service resources, listener encryption is configured with

    annotations such as aws-load-balancer-ssl-cert and aws-load-balancer-sslports. For ALB-backed ingress, HTTPS listeners
    require certificate configuration on the

    ALB path. A TCP listener on port 443 is a different design because it passes encrypted

    traffic through instead of terminating TLS at the load balancer.

    • Identify all internet-facing or client-facing LoadBalancer Services and Ingress

    resources.

    • Verify NLB services use aws-load-balancer-ssl-cert and aws-loadbalancer-ssl-ports for listener encryption.

    • Verify ALB listeners are configured for HTTPS and have the required certificate

    ARN association.

    • Verify the certificate is valid for the intended hostname and that the listener

    design matches the intended TLS termination point.'
  remediation: 'Configure every client-facing EKS load balancer listener to use HTTPS or TLS with a

    valid certificate so client-to-load-balancer traffic is encrypted in transit. For NLB-backed

    Service resources, add the certificate ARN and encrypted listener ports in the service

    annotations. For ALB-backed ingress, configure HTTPS listeners and associate the

    required certificate ARN. If the design requires encryption beyond the load balancer,

    implement backend TLS separately because listener TLS alone protects only the clientfacing connection.

    • Add a valid certificate to each client-facing NLB or ALB listener that should serve

    encrypted traffic.

    • For NLB services, set aws-load-balancer-ssl-cert to the certificate ARN and

    aws-load-balancer-ssl-ports to the required listener ports.

    • For ALB ingress, configure HTTPS listeners and associate the required

    certificate ARN with the listener configuration.

    • Replace or renew invalid certificates and implement backend TLS separately

    where end-to-end encryption is required.'
