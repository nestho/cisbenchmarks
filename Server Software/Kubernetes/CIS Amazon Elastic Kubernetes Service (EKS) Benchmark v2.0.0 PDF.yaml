- id: 4.5.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Namespaces create administrative boundaries in EKS by dividing a cluster into logical partitions for teams,
    applications, or tenants. They are a core building block for soft multi-tenancy, and several controls used to separate
    workloads, including quotas, network policies, and service accounts, are scoped to the namespace.
  rationale: Namespaces matter operationally because many access and governance controls in Kubernetes and EKS can be applied
    at that scope. Kubernetes Role and RoleBinding objects are used to delegate permissions within a namespace, and EKS access
    policies can be scoped to one or more specific namespaces instead of the entire cluster. That allows platform teams to
    grant administrative access to only the namespaces a team or workload should manage, rather than granting cluster-wide
    permissions. The namespace boundary becomes stronger when it is combined with namespacescoped resource and traffic controls.
    ResourceQuota and LimitRange can constrain CPU, memory, and object consumption within a namespace, while network policies
    can restrict Pod-to-Pod communication and support a least-privilege model between tenant or application namespaces. A
    namespace alone is still only a logical grouping construct, so effective administrative separation depends on pairing
    it with RBAC, access scoping, quotas, service accounts, and network isolation.
  impact: Creating administrative boundaries with namespaces usually requires teams to move workloads out of the default namespace
    and implement namespace-specific RBAC, access scopes, quotas, and network policies. This improves delegation and organization,
    but namespaces by themselves do not provide full isolation.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/tenant-isolation.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 146
  audit_raw: 'Verify that namespaces are present and are being used as intentional administrative

    boundaries for teams, applications, or environments in the EKS cluster. Namespaces

    are the core logical partition for soft multi-tenancy, and they should be paired with

    scoped access controls and namespace-level governance such as quotas, limits, and

    network policies. A namespace should be considered adequately administered only

    when it has a clear workload or team purpose, appropriately scoped access, and the

    namespace-level controls required for that use case.

    • List all namespaces and confirm each has a defined administrative, application,

    or environment purpose. Namespaces are the base partitioning construct for soft

    multi-tenancy in EKS.

    • Verify that user and workload access is scoped to the intended namespaces

    through Kubernetes Role and RoleBinding objects and, where used, EKS

    access entries and access policies rather than broad cluster-wide grants. EKS

    access policies can be scoped to specific namespaces.

    • Review whether namespace-level controls such as ResourceQuota,

    LimitRange, service accounts, and network policies are applied where required

    to support separation, resource governance, and east-west traffic restrictions.

    • Confirm that cluster-wide access is limited to identities that truly require it,

    because namespace boundaries alone do not prevent cross-tenant or crossworkload access.

    Inventory checks for EKS Clusters:

    kubectl get namespaces

    kubectl get rolebindings,roles -A

    kubectl get clusterrolebindings,clusterroles

    kubectl get resourcequota,limitrange,networkpolicy -A

    aws eks list-access-entries --cluster-name $CLUSTER_NAME

    aws eks list-associated-access-policies --cluster-name $CLUSTER_NAME --

    principal-arn $PRINCIPAL_ARN

    Note: Command line statement to extract arn for $PRINCIPAL_ARN varriable:

    aws sts get-caller-identity --query Arn --output text'
  remediation: 'Create separate namespaces for teams, applications, or environments that require their

    own administrative scope, and move workloads out of the default namespace into that

    managed namespace structure. Make the namespace boundary meaningful by scoping

    access to the intended namespaces, applying namespace-level governance such as

    quotas, limits, service accounts, and network policies, and reducing cluster-wide

    permissions that bypass the intended separation model. When stronger isolation is

    required for mutually untrusted workloads, use separate clusters rather than relying on

    namespaces alone.

    1. Create dedicated namespaces for each team, application, or environment that

    needs its own administrative boundary.

    2. Move user workloads out of the default namespace and into the appropriate

    managed namespaces.

    3. Rebind access with namespace-scoped Role and RoleBinding objects and,

    where used, scope EKS access policies to one or more specific namespaces

    instead of the whole cluster.

    4. Apply ResourceQuota, LimitRange, service accounts, and network policies to

    reinforce namespace-level governance and traffic separation.

    5. Remove unused namespaces and reduce unnecessary cluster-wide permissions

    or access entries that bypass the intended namespace boundary.

    Create dedicated namespaces, move workloads out of default, scope access by

    namespace, and apply quotas, limits, service accounts, and network policies to enforce

    the administrative boundary.'
