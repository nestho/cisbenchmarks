  description: 'Minimize the admission of containers with securityContext.allowPrivilegeEscalation: true in EKS so that general
    workload namespaces do not permit processes to gain more privileges than their parent process. In current EKS guidance,
    AWS recommends applying Pod Security Standards through Pod Security Admission or a policy engine, using at least the baseline
    profile cluster-wide and the restricted profile for workload namespaces. AWS’s Pod Security guidance shows that workloads
    violating restricted are rejected unless the container explicitly sets securityContext.allowPrivilegeEscalation=false.
