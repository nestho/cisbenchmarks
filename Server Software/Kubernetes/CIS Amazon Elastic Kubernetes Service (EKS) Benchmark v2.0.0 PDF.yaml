- id: 5.5.1
  title: Use EKS access entries to manage IAM principal access to Kubernetes
  scoring: scored
  profile:
  - Level 1
  description: Using EKS access entries centralizes how IAM principals are granted access to the Kubernetes API and lets cluster
    access be managed through Amazon EKS instead of relying on manual aws-auth ConfigMap updates. This gives a cleaner accessmanagement
    model for users and roles that need to work with Kubernetes resources in the cluster.
  rationale: 'An access entry binds an IAM principal, such as an IAM role or IAM user, to Kubernetes authorization in the
    cluster. To use access entries, the cluster authentication mode must be set to API or API_AND_CONFIG_MAP. Permissions
    can then be granted in two main ways: by associating EKS access policies to the access entry, or by mapping the principal
    to Kubernetes groups and continuing authorization through Kubernetes RBAC objects such as Roles, ClusterRoles, RoleBindings,
    and ClusterRoleBindings. Access policies can be scoped cluster-wide or to specific namespaces, while the Kubernetesgroups
    approach is better when highly customized RBAC is required. This model also avoids continued dependence on the deprecated
    aws-auth ConfigMap path for routine IAM principal access management.'
  impact: This control improves consistency and makes access easier to review, grant, and revoke, but it usually requires
    an authentication-mode update and a planned migration of any existing aws-auth ConfigMap entries. It can also require
    reworking current RBAC design if existing permissions are broad, inconsistent, or split between legacy ConfigMap mappings
    and Kubernetes RBAC.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/setting-up-access-entries.html
  page_start: 190
  audit_raw: "Review the cluster access model and verify IAM principal access to Kubernetes is\nmanaged through EKS access\
    \ entries rather than relying only on legacy aws-auth\nConfigMap mappings. Access entries are available only when the\
    \ cluster authentication\nmode is set to API or API_AND_CONFIG_MAP, and permissions can then be granted\nthrough EKS access\
    \ policies, Kubernetes groups for RBAC, or both.\nVerify the cluster authentication mode is API or API_AND_CONFIG_MAP.\n\
    aws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query 'cluster.accessConfig.authenticationMode'\
    \ \\\n  --output text\nExpected output: API or API_AND_CONFIG_MAP\nIf the output is CONFIG_MAP, the cluster does not satisfy\
    \ this audit step\n• Review the cluster’s access entries and confirm each required IAM role or user\nhas an access entry,\
    \ with no duplicate or unnecessary principals.\n• Review the permissions attached to each access entry and confirm they\
    \ are\ngranted through the intended EKS access policies, Kubernetes groups, or both,\nwith scope limited to the required\
    \ namespaces or cluster-wide access level.\n• Review any remaining aws-auth ConfigMap usage and flag legacy mappings\n\
    that should be migrated or removed if access entries are now the intended\nmanagement path."
  remediation: "Configure the cluster to use EKS access entries for IAM principal access management,\nthen create and scope\
    \ access entries for each required IAM role or user. This\nremediation typically starts by enabling the access-entry API\
    \ through the cluster\nauthentication mode, then moving existing access management from legacy aws-auth\nConfigMap mappings\
    \ to access entries with EKS access policies, Kubernetes RBAC\ngroup mappings, or both. Access entries require the cluster\
    \ authentication mode to\ninclude the EKS API, and moving from CONFIG_MAP to API_AND_CONFIG_MAP is the\nrecommended transition\
    \ path.\nUpdate the cluster authentication mode to API_AND_CONFIG_MAP\naws eks update-cluster-config \\\n  --name $CLUSTER_NAME\
    \ \\\n  --region $REGION_CODE \\\n  --access-config authenticationMode=API_AND_CONFIG_MAP\n• Create an access entry for\
    \ each IAM principal that needs Kubernetes access.\nEach access entry maps one existing IAM role or IAM user to cluster\
    \ access.\n• Associate the required EKS access policies to the access entry, or map the\nprincipal to Kubernetes groups\
    \ and authorize it through RBAC objects such as\nRoles, ClusterRoles, RoleBindings, and ClusterRoleBindings. Scope access\
    \ to\nspecific namespaces where possible.\n• After validating access through the new model, remove or reduce legacy awsauth\
    \ ConfigMap mappings that are no longer needed so cluster access is\nmanaged consistently through access entries."
  checks:
  - type: manual_review
    info: "Review the cluster access model and verify IAM principal access to Kubernetes is\nmanaged through EKS access entries\
      \ rather than relying only on legacy aws-auth\nConfigMap mappings. Access entries are available only when the cluster\
      \ authentication\nmode is set to API or API_AND_CONFIG_MAP, and permissions can then be granted\nthrough EKS access\
      \ policies, Kubernetes groups for RBAC, or both.\nVerify the cluster authentication mode is API or API_AND_CONFIG_MAP.\n\
      aws eks describe-cluster \\\n  --name $CLUS"
    severity: medium
