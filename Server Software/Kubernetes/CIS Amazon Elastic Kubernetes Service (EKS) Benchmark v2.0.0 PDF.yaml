- id: 3.2.3
  title: Ensure the kubelet X.509 client CA file is configured
  scoring: scored
  profile:
  - Level 1
  description: This setting in EKS is about configuring the kubelet with a trusted X.509 client CA source so the kubelet can
    validate client certificates presented to its HTTPS endpoint. It is not the same as validating the kubelet’s own serving
    certificate from the API server side. In EKS, kubelet authentication settings are part of the node’s managed configuration
    baseline and should be evaluated in the effective kubelet configuration applied during bootstrap.
  rationale: This setting establishes the trust anchor the kubelet uses for certificate-based client authentication at the
    node level. For EKS, that trust source is not something you should assume the control plane will generate automatically,
    because AWS states that client certificate signing is not supported by the Amazon EKS CA signer. AWS also documents that
    kubelet authentication is a managed field in EKS tooling, and that deeper node customization is delivered through launch
    templates, bootstrap arguments, merged user data, or a custom AMI when needed. As a result, if your EKS worker node design
    depends on X.509 client authentication to the kubelet, the client CA file must be intentionally provisioned through the
    supported node bootstrap and launch path so the node starts with a consistent trust source rather than relying on manual
    host edits or an unsupported EKS CA workflow.
  impact: If the kubelet X.509 client CA file is not configured, certificate-based clients cannot be validated against a trusted
    CA when connecting to the kubelet, which can break intended X.509-based access patterns or leave that authentication path
    unavailable. In EKS, remediation should be made through bootstrap or launch configuration and then applied through node
    replacement, because AWS documents that node configuration is delivered through merged bootstrap behavior and updated
    launch template versions are rolled out by recycling nodes.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/eksctl/customizing-the-kubelet.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
  page_start: 44
  audit_raw: 'To audit whether kubelet authentication X.509 client CA file is configured on an Amazon

    EKS worker node, query the live effective kubelet configuration through the Kubernetes

    API server proxy and inspect the kubelet configz output for

    authentication.x509.clientCAFile. Kubernetes identifies configz as the view of

    the kubelet’s final actuated configuration, and the kubelet config schema defines

    authentication.x509.clientCAFile as the setting used for X.509 client certificate

    authentication. In EKS, this is the right place to verify the control because kubelet

    authentication settings are part of managed node configuration and node bootstrap

    behavior rather than only visible as process flags.

    Using the api configz endpoint search for the status of

    authentication...clientCAFile by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=ip-192-168-20-214.us-west-2.compute.internal (example node

    name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to

    authentication":{"x509":{"clientCAFile":"/etc/kubernetes/pki/ca.crt"} in

    the output

    To interpret the result:

    • A non-empty path, such as /etc/kubernetes/pki/ca.crt or another valid file

    path, means the setting is configured. This is the expected result for this control

    because the kubelet has a CA bundle path defined for validating client

    certificates.

    • An empty string means the field is present but not configured. Treat this as

    noncompliant for this control because the kubelet does not have a CA bundle

    path configured for X.509 client certificate validation.

    • null or a missing field should be treated as investigate further. Recheck the raw

    configz response and confirm the proxy path and node name are correct,

    because configz is the authoritative view of the final kubelet configuration. In

    EKS, if the value still cannot be verified, review the node bootstrap and launch

    customization path because authentication settings are managed there.'
  remediation: 'If the audit shows that the kubelet X.509 client CA file is not configured, the worker node

    should be treated as noncompliant. If the result is empty, null, or missing, first confirm

    the inspection reflects the effective node configuration. In Amazon EKS, remediation

    should be performed through the supported node provisioning or node update workflow,

    because AWS documents that kubelet authentication is a managed field in eksctl,

    launch templates are the supported path for deeper managed node customization, and

    client certificate signing is not supported by the Amazon EKS CA signer.

    Remediation of new cluster

    When creating a new EKS cluster or node group, the goal is to ensure each worker

    node starts with a trusted client CA bundle already present and with the kubelet

    configured to use it for certificate-based client authentication.

    • Select and manage the CA that will anchor trust for kubelet client certificates,

    because Amazon EKS does not support client certificate signing through the

    Amazon EKS CA signer.

    • Use a custom launch template for this kubelet authentication customization,

    since AWS uses launch templates for deeper managed node configuration.

    • Use a custom AMI or equivalent bootstrap customization, when needed, to place

    the CA bundle on the node and point kubelet to that file path. AWS notes that

    with a custom AMI, you are responsible for the required bootstrap logic.

    • Validate after deployment that the node has the CA file at the expected path and

    that the kubelet is using the intended authentication configuration.

    Remediation of existing running cluster

    For an existing EKS cluster, the objective is to update the node launch configuration so

    future nodes include the required client CA bundle and kubelet reference, then replace

    the current nodes so the change is applied consistently across the node group.

    • Prepare an updated custom launch template, and a new custom AMI if required,

    that places the CA bundle on the node and configures kubelet to use it.

    • If the managed node group already uses a custom launch template, update it to a

    new version so EKS can roll the node group to that configuration.

    • If the managed node group was not created with a launch template, build a new

    node group with the required launch template or custom AMI path and migrate

    workloads to it.

    • Re-audit the replacement nodes to confirm the client CA file is now configured

    through the intended node build path.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on EKS

    worker nodes are discouraged because node behavior is applied through bootstrap,

    launch configuration, and managed node replacement workflows, so host-level edits

    can be lost when nodes are recycled or replaced.'
