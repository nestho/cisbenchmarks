  remediation: 'For EKS Auto Mode nodes placed in public subnets, remediate by updating the

    NodeClass and NodePool design so Auto Mode provisions nodes only in private

    subnets. In EKS Auto Mode, subnet placement is controlled through NodeClass

    subnetSelectorTerms, and NodePools reference the NodeClass that defines the

    infrastructure configuration. If existing nodes were created from a NodeClass that

    selects public subnets, create or update a NodeClass that selects only private subnets,

