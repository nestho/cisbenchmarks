    \ apply only to the public endpoint and do not control the\nprivate endpoint.\naws eks describe-cluster \\\n  --name $CLUSTER_NAME\
    \ \\\n  --region $REGION_CODE \\\n  --query\n\"cluster.resourcesVpcConfig.{endpointPrivateAccess:endpointPrivateAccess,endp\n\
    ointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}\" \\\n  --output json\nExpected output:\n{\n\
    \  \"endpointPrivateAccess\": true,\n  \"endpointPublicAccess\": true,\n  \"publicAccessCidrs\": [\n    \"203.0.113.5/32\"\
    \n  ]\n}\nLook for the following in the output:\n• Confirm endpointPrivateAccess is set to true.\n• Confirm endpointPublicAccess\
    \ is set to true only when public API access is\nrequired.\n• Confirm publicAccessCidrs includes only approved administrator,\
    \ VPN,\nautomation, or network egress CIDR ranges.\n• Flag 0.0.0.0/0 as a finding.\n• For dual stack clusters, also flag\
    \ ::/0 as a finding.\n• Keep private access enabled when public access is restricted by CIDR, so VPC\noriginated traffic\
    \ can reach the Kubernetes API server without depending on\npublic endpoint egress paths."
  remediation: "Enable private endpoint access for the EKS Kubernetes API server and restrict public\nendpoint access to approved\
    \ CIDR ranges. Private access allows Kubernetes API\nrequests from within the cluster VPC to use the private endpoint.\
    \ If public access\nremains enabled, public access CIDRs should be limited to trusted source ranges\ninstead of allowing\
    \ all internet addresses. If no CIDR blocks are specified, the public\nendpoint can receive requests from all IP addresses,\
    \ including 0.0.0.0/0 and, for dual\nstack clusters, ::/0.\nUse the following command to enable private access and restrict\
    \ public access to an\napproved CIDR. Do not include spaces after the commas in --resources-vpc-config.\naws eks update-cluster-config\
    \ \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --resources-vpc-config\nendpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=\"\
    203.0\n.113.5/32\"\nUse the following checks to validate the endpoint access configuration after\n• Replace 203.0.113.5/32\
    \ with the approved administrator, VPN, automation, or\negress CIDR range.\n• Add only the CIDR ranges required for approved\
    \ access paths.\n• After the update completes, rerun the audit command.\n• Confirm private access is enabled.\n• Confirm\
    \ public access is enabled only as intended.\n• Confirm the public CIDR list does not include unrestricted ranges such\
    \ as\n0.0.0.0/0 or ::/0.\n• Remember that EKS API endpoint access remains a cluster endpoint\nconfiguration setting, even\
    \ when EKS Auto Mode automates other cluster\nnetworking functions."
  checks:
  - type: manual_review
    info: "Check that private EKS API endpoint access is enabled, public EKS API endpoint\naccess is enabled only for approved\
      \ administration paths, and public access CIDRs are\nrestricted to approved source ranges. EKS supports separate settings\
      \ for private\naccess, public access, and public access CIDRs for the Kubernetes API server\nendpoint. Public access\
      \ CIDRs apply only to the public endpoint and do not control the\nprivate endpoint.\naws eks describe-cluster \\\n \
      \ --name $CLUSTER_NAME \\\n  --region $REGION_C"
