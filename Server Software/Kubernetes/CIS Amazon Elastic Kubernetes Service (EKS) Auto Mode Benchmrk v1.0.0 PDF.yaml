      requirement. In EKS, Pods can receive a service account token automatically,

      automountServiceAccountToken can be disabled at the Pod or ServiceAccount

      level, and workloads that need AWS access through EKS Pod Identity, and any

      remaining '
- id: 4.1.7
  title: Standardize EKS cluster access by using access entries, policies, and permissions
  scoring: scored
  profile:
  - Level 1
  description: EKS Auto Mode provides the Cluster Access Management API, access entries, and associated access policies as
    the recommended way to manage IAM principal access to the Kubernetes API. This model is preferred over the deprecated
    aws-auth ConfigMap for cluster access management, supports cluster or namespace permissions, and can also reference Kubernetes
    groups when native Role, ClusterRole, RoleBinding, or ClusterRoleBinding objects are needed for custom authorization.
    This access model applies to IAM users and roles that reach the cluster API, while Pod workload identity remains a separate
    service account mechanism such as EKS Pod Identity, or any remaining IRSA configuration already in use.
  rationale: 'This approach improves access control consistency because EKS access entries are managed through the EKS API
    rather than through manual aws-auth ConfigMap edits, and AWS identifies access entries as the best way to grant IAM principals
    access to the Kubernetes API. An access entry associates an IAM user or role with Kubernetes permissions in one of two
    ways: by attaching one or more associated access policies, or by specifying Kubernetes group names that are then authorized
    through native Kubernetes RBAC objects. The AWS managed access policies contain Kubernetes permissions, not IAM permissions,
    and each policy association can be either to the entire cluster or to one or more Kubernetes namespaces, including wildcard
    namespace patterns. This model also makes effective permissions easier to reason about in mixed authorization paths. A
    single access entry can have multiple associated access policies, and if Kubernetes groups are also specified, the IAM
    principal receives the union of all permissions granted by those policies plus any permissions granted through Role, ClusterRole,
    RoleBinding, or ClusterRoleBinding objects bound to those groups. AWS also notes that permissions granted by associated
    access policies are not shown by kubectl auth can-i --list, which means standardizing on access entries, explicit policy
    associations, and namespace assignments helps reduce excessive authorization, and dependence on deprecated aws-auth mappings.
    In EKS Auto Mode, this is especially useful because access entries and EKS Pod Identity are part of the standard access
    model for clusters and workloads.'
  impact: If cluster access is not standardized in EKS Auto Mode, organizations can accumulate a mix of deprecated aws-auth
    mappings, uneven access entry adoption, and overly broad cluster permissions that are harder to review, audit, and narrow
    to namespace scope. That increases the chance that an IAM principal receives duplicated or broader Kubernetes access than
    intended, and it makes access changes more error prone over time. It also makes it harder to distinguish IAM principal
    access to the cluster API from workload identity paths such as EKS Pod Identity, which weakens access governance and complicates
    troubleshooting.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/create-cluster-auto.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/cluster-auth.html
  page_start: 45
  audit_raw: "Review the cluster authentication mode to confirm EKS access entries are enabled,\nthen review access entries\
    \ and associated access policies to verify that cluster access\nis being managed through the Cluster Access Management\
    \ API with cluster or\nnamespace permissions as appropriate. Treat API and API_AND_CONFIG_MAP as\nevidence that access\
    \ entries are available, and for EKS Auto Mode treat API as the\npreferred steady state mode and API_AND_CONFIG_MAP as\
    \ transitional or legacy\ncompatible mode. If the cluster is in API_AND_CONFIG_MAP mode, also review whether\nlegacy aws-auth\
    \ mappings are still present and whether access has been migrated to\naccess entries and scoped policy associations.\n\
    To check if the Cluster Access Manager API is active on your Amazon EKS cluster, you\ncan use the following AWS CLI command:\n\
    aws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --query \"cluster.accessConfig\" \\\n  --output json\nThe command\
    \ queries the cluster.accessConfig property, which indicates the\nauthentication mode of the cluster.\nExpected output\
    \ for authenticationMode:\n• API = access entries enabled, ConfigMap auth removed\n• API_AND_CONFIG_MAP = access entries\
    \ enabled, legacy ConfigMap auth still\nalso available\n• CONFIG_MAP = legacy aws-auth only, and not an expected operating\
    \ mode for\nan EKS Auto Mode cluster\nAdditional checks:\nLists the IAM principal ARNs that currently have EKS access\
    \ entries on the cluster. Use\nit to identify which users or roles are being managed through the EKS access entry\nmodel.\n\
    aws eks list-access-entries --cluster-name $CLUSTER_NAME\nLists the EKS access policies associated with one specific access\
    \ entry and shows the\naccess scope, such as cluster or namespace. Use it to identify what level of Kubernetes\naccess\
    \ that principal has been granted. Review the returned accessScope carefully to\nconfirm namespace scoping is used where\
    \ full cluster scope is not required.\nCommand line statement to extract arn for $PRINCIPAL_ARN variable:\naws sts get-caller-identity\
    \ --query Arn --output text\naws eks list-associated-access-policies \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn\
    \ $PRINCIPAL_ARN\nFinally, review any remaining aws-auth ConfigMap entries when the cluster is in\nAPI_AND_CONFIG_MAP\
    \ mode, because access can still be granted through both paths\nuntil migration is complete."
  remediation: 'Log in to the AWS Management Console, navigate Amazon Elastic Kubernetes Service

    > Clusters and click on your EKS cluster.

    Go to the Access tab and click on Manage in the Access Configuration section.

    Under Cluster Authentication Mode for Cluster Access settings choose one of the

    following.

    • EKS API Use this as the target mode for EKS Auto Mode clusters after access

    has been migrated to access entries and associated access policies. The cluster

    will source authenticated IAM principals only from EKS access entry APIs

    • EKS API and ConfigMap Use this only when legacy aws-auth ConfigMap

    access must still coexist during migration or for an approved compatibility need.

    The cluster will source authenticated IAM principals from both EKS access entry

    APIs and the aws-auth ConfigMap

    o After selecting the authentication mode, create or review Standard access

    entries for required IAM principals, associate the appropriate EKS access

    policies, and prefer namespace access where full cluster access is not

    required.

    o If the cluster is currently using API_AND_CONFIG_MAP, migrate remaining

    valid aws-auth mappings to access entries, remove stale ConfigMap

    access, and move to API when legacy ConfigMap authentication is no

    longer needed.'
  checks:
  - type: manual_review
    info: 'Review the cluster authentication mode to confirm EKS access entries are enabled,

      then review access entries and associated access policies to verify that cluster access

      is being managed through the Cluster Access Management API with cluster or

      namespace permissions as appropriate. Treat API and API_AND_CONFIG_MAP as

      evidence that access entries are available, and for EKS Auto Mode treat API as the

      preferred steady state mode and API_AND_CONFIG_MAP as transitional or legacy

      compatible mode. If t'
    severity: medium
- id: 4.1.8
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: In EKS Auto Mode, bind, impersonate, and escalate should be limited to identities with a documented administrative
    need, because these permissions belong to native Kubernetes RBAC and affect who can obtain or act with Kubernetes permissions.
    This review should cover custom Role and ClusterRole definitions, RoleBinding and ClusterRoleBinding assignments, and
    any service accounts that receive those permissions, especially for broadly deployed components such as DaemonSets or
    CSI drivers. AWS recommends using access entries and associated access policies for most cluster access and using native
    Kubernetes RBAC only when the predefined access policies do not meet the requirement. Permission to create persistent
    storage in EKS Auto Mode should be granted only where it is required. In EKS, this includes direct creation of PersistentVolume
    objects and, more commonly in Auto Mode, the ability to trigger dynamic provisioning through PersistentVolumeClaim and
    StorageClass use, because EKS storage integrations such as the Amazon EBS CSI driver and EKS Auto Mode can automatically
    provision backing storage when applications request it. For customer workloads, this remains primarily an authorization
    concern around who can create or use StorageClasses, PersistentVolumeClaims, and related RBAC paths
  rationale: 'This setting is important because EKS supports two authorization paths for IAM principals that reach the Kubernetes
    API: associated access policies and native Kubernetes RBAC through Kubernetes groups specified on an access entry. Access
    policies are AWS managed Kubernetes permission sets, cannot be modified, and should be used for most common access patterns.
    When they do not meet a requirement, administrators must fall back to custom Kubernetes RBAC objects, which is where powerful
    verbs such as bind, impersonate, and escalate can appear and where least privilege review becomes especially important.
    The risk is higher because these permissions operate on the authorization model itself rather than on routine resource
    access. If a user impersonates a Kubernetes user or group, EKS access policy permissions do not apply and authorization
    is evaluated through Kubernetes RBAC only. AWS also recommends reviewing and scoping RBAC for service accounts, especially
    for DaemonSets and CSI drivers, because those tokens and permissions are effectively present on every node where those
    Pods run. In that model, assigning bind, impersonate, or escalate to a broadly used service account or administrative
    role can make effective access harder to reason about and easier to expand beyond the intended boundary. Minimizing this
    access is important because persistent storage in EKS is not just a short lived workload resource. The Amazon EBS CSI
    driver manages the lifecycle of Amazon EBS volumes for Kubernetes volumes, and EKS Auto Mode uses StorageClass definitions
    to automatically provision EBS volumes when applications request persistent storage. StorageClass settings can also influence
    technical characteristics such as volume type, encryption, IOPS, and KMS key usage, so the ability to create storage can
    affect durability, performance, encryption, and cost rather than only enabling routine application writes. In EKS Auto
    Mode, it is also important to distinguish customer RBAC from the platform managed storage path. Auto Mode does not create
    a StorageClass for you, so customer principals still control whether a workload can request storage through StorageClass
    and PersistentVolumeClaim objects. At the same time, AWS automatically creates an access entry with AmazonEKSBlockStorageClusterPolicy
    for the cluster IAM role so the block storage capability can function. That means storage provisioning rights exist across
    both customer authorization paths and AWS managed platform permissions, and customer access to StorageClasses and PersistentVolumeClaims
    should still be tightly defined.'
  impact: If bind, impersonate, or escalate are granted too broadly in EKS Auto Mode, a user or service account can turn limited
    access into broader Kubernetes authority, weaken namespace and role boundaries, and increase the blast radius of a compromised
    identity or workload. The risk is greater when the affected identity is tied to broadly deployed service accounts, because
    the resulting permissions can become reachable from many nodes and can also combine with workload IAM access where EKS
    Pod Identity, or any remaining IRSA configuration already in use, is present. If persistent storage creation is granted
    too broadly in EKS Auto Mode, a user or service account can provision durable storage that outlives Pod execution, expands
    the cluster data footprint, and triggers creation of backing AWS storage resources without a justified need. Because these
    volumes can outlive the Pods that created them, excessive access can increase persistence, cost exposure, and the scope
    of unauthorized activity even after the workload is removed.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/create-k8s-group-accessentry.html
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/sample-storageworkload.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/create-storage-class.html
  page_start: 49
  audit_raw: "Review EKS Auto Mode custom Kubernetes RBAC to identify any users, groups, or\nservice accounts granted bind,\
    \ escalate, or impersonate through custom Kubernetes\nRole or ClusterRole objects. Determine which subjects receive those\
    \ permissions\nthrough RoleBinding or ClusterRoleBinding assignments, and validate that each\nassignment is required for\
    \ a defined administrative function. If the cluster uses access\nentries with Kubernetes groups, review those group mappings\
    \ as well, because EKS\naccess entries are the recommended way to grant IAM principals access to the\nKubernetes API and\
    \ can reference Kubernetes groups for native RBAC authorization.\nFlag any cluster or service account assignment that\
    \ lacks a documented need,\nespecially for broadly deployed service accounts such as DaemonSets or CSI drivers.\nIdentify\
    \ custom Role and ClusterRole objects that include bind, escalate, or\nimpersonate:\nkubectl get roles,clusterroles -A\
    \ -o json | jq -r '\n  .items[]\n  | select(.metadata.labels[\"kubernetes.io/bootstrapping\"] != \"rbacdefaults\")\n \
    \ | select(any(.rules[]?; any(.verbs[]?; .==\"bind\" or .==\"escalate\" or\n.==\"impersonate\")))\n  | [.kind, (.metadata.namespace\
    \ // \"-\"), .metadata.name]\n  | @tsv\n'\nMap those roles to the subjects that receive them through bindings:\n(echo\
    \ -e\n\"BINDING_KIND\\tBINDING_NS\\tBINDING_NAME\\tROLE_KIND\\tROLE_NAME\\tSUBJECT_KIND\\t\nSUBJECT_NS\\tSUBJECT_NAME\"\
    ; \\\nkubectl get rolebindings,clusterrolebindings -A -o json | jq -r '\n  .items[] as $b\n  | ($b.subjects // [])[]\n\
    \  | [\n      $b.kind,\n      ($b.metadata.namespace // \"-\"),\n      $b.metadata.name,\n      $b.roleRef.kind,\n   \
    \   $b.roleRef.name,\n      .kind,\n      (.namespace // \"-\"),\n      .name\n    ]\n  | @tsv\n') | column -ts $'\\t'\n\
    Review any access entries that use Kubernetes groups and confirm those groups are\nnot bound to roles with bind, escalate,\
    \ or impersonate unless there is an approved\nadministrative requirement.\nReview EKS RBAC to identify any users, groups,\
    \ or service accounts that can create\nPersistentVolume, PersistentVolumeClaim, or StorageClass resources. In EKS,\nthis\
    \ review should give particular attention to PersistentVolumeClaim and\nStorageClass permissions because persistent storage\
    \ is commonly provisioned\ndynamically through StorageClass and PersistentVolumeClaim objects in EKS Auto\nMode rather\
    \ than by manually creating PersistentVolume objects. Also distinguish\ncustomer-managed RBAC from the AWS managed block\
    \ storage capability, because\nEKS Auto Mode can create and delete EBS volumes when block storage is enabled, but\ncustomer\
    \ principals still control whether workloads can request storage through\nStorageClasses and PersistentVolumeClaims.\n\
    Review who can create or use StorageClass and PersistentVolumeClaim resources\nfirst, because those are the primary customer\
    \ controlled paths that trigger storage\nprovisioning in EKS Auto Mode. Review direct PersistentVolume creation separately,\n\
    because it is less central than PVC-driven dynamic provisioning in Auto Mode.\nIf the cluster also uses self managed storage\
    \ components outside the Auto Mode block\nstorage path, review the related service accounts and bindings separately, because\n\
    those components can still rely on Kubernetes identities and RBAC inside the cluster."
  remediation: 'Remove bind, escalate, and impersonate permissions from any custom Role or

    ClusterRole that does not require them for an approved administrative function. In

    EKS, use access entries and associated access policies for standard cluster access

    wherever possible, and reserve custom Kubernetes RBAC for cases where the

    predefined access policies do not meet the requirement. Where these permissions are

    still necessary, keep them as narrowly as possible and avoid assigning them to

    workload service accounts or broadly shared Kubernetes groups.

    • Update each affected custom Role to remove unnecessary bind, escalate, or

    impersonate permissions.

    • Update each affected custom ClusterRole so it retains only the specific

    elevated permission that is explicitly required.

    • Replace broad assignments with lower privilege roles, and reduce scope from

    cluster to namespace where possible. EKS access policies support assignments,

    and custom RBAC should be used only when those policies do not meet the

    requirement.

    • Review access entries that specify Kubernetes groups, and remove or narrow

    any group mapping that reaches RBAC roles with these permissions. When you

    use Kubernetes groups on an access entry, you must create and manage the

    related native RBAC objects yourself.

    • Do not assign these permissions to workload service accounts unless there is a

    documented and approved need. Review DaemonSet and CSI driver service

    accounts first, because their RBAC permissions can be reachable from every

    node where those Pods run.

    • If the cluster still uses API_AND_CONFIG_MAP, remove any remaining aws-auth

    mappings that place IAM principals into Kubernetes groups bound to roles with

    these permissions.

    • Revalidate access after the change to confirm that only approved administrative

    identities retain these permissions. Recheck access entries, Kubernetes group

    mappings, RBAC bindings, and service account assignments so the permissions

    are not still reachable through another authorization path.

    Remove persistent storage creation rights from any user, group, or service account that

    does not require them, and replace broad assignments with the lowest privilege role and

    narrowest scope possible. In EKS, prioritize PersistentVolumeClaim and

    StorageClass permissions because persistent storage is commonly provisioned

    dynamically through the EKS Auto Mode block storage path rather than by manually

    creating PersistentVolume objects. Limit direct PersistentVolume and

    StorageClass administration to approved administrators, and allow workloads to use

    only the PersistentVolumeClaim access required for approved storage classes. After

    changes are made, verify that required applications can still provision storage through

    the intended EKS Auto Mode storage class and PVC path.

    • Remove unnecessary create access to PersistentVolume objects wherever

    possible, because direct PV creation is less common than PVC dynamic

    provisioning in EKS.

    • Reduce PersistentVolumeClaim and StorageClass creation rights to the

    smallest set of approved users, groups, and service accounts. StorageClass

    settings can affect how backing storage is provisioned and managed, so broad

    access creates more than routine workload write capability.

    • Focus first on customer roles that can create StorageClasses and

    PersistentVolumeClaims. If the cluster also uses self managed storage

    controllers outside the Auto Mode block storage capability, review those service

    accounts and bound RBAC separately.

    • Revalidate application storage provisioning after the change to confirm that only

    approved workloads can create claims and obtain persistent storage through the

    approved storage classes. Also confirm that the approved StorageClass uses

    the intended Auto Mode provisioner rather than a legacy provisioner.'
  checks:
  - type: manual_review
    info: 'Review EKS Auto Mode custom Kubernetes RBAC to identify any users, groups, or

      service accounts granted bind, escalate, or impersonate through custom Kubernetes

      Role or ClusterRole objects. Determine which subjects receive those permissions

