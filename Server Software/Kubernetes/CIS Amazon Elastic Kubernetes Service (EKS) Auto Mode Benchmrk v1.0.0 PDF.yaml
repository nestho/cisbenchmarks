    network stack instead of using the normal pod network namespace. This is especially important in EKS Auto Mode because
    AWS manages the underlying EC2 managed instances, operating system, container runtime, and node lifecycle, while customers
    remain responsible for the security of application containers and pods deployed on those instances. Pods configured with
    hostNetwork: true always have access to the EC2 Instance Metadata Service, even when Pod Identity or IAM roles for service
    accounts are used. This can increase exposure to node metadata paths and weakens the intended separation between workload
    identity and node identity. Enforcing baseline or restricted Pod Security Standards blocks pod specs that request host
    network sharing before the pod is created, while warn and audit only report violations.'
