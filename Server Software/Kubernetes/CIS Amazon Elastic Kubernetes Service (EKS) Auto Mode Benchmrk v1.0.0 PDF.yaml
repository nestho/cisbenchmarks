- id: 4.2.3
  title: Require workload pods to run with hostIPC set to false
  scoring: scored
  profile:
  - Level 1
  description: 'Require workload pods to run with hostIPC set to false or leave it unset by restricting spec.hostIPC: true
    in EKS Auto Mode workload namespaces. In the EKS Pod Security Standards model, this is done through Pod Security Admission
    or an equivalent policy engine, and baseline or restricted enforcement should be applied to workload namespaces where
    host IPC namespace sharing is not approved. Because baseline prohibits hostIPC and restricted inherits the baseline restrictions,
    general workload namespaces should not permit host IPC sharing. Do not permit workload pods to run with spec.hostIPC:
    true, except for approved system or platform workloads.'
  rationale: 'Pod specification settings can strengthen or weaken the cluster security posture, and the primary concern is
    preventing containerized processes from escaping container runtime isolation and gaining access to the underlying host.
    Host IPC namespace sharing weakens that isolation by allowing a pod to share the node’s IPC namespace, which can expose
    host inter-process communication resources such as shared memory and semaphores to a workload that does not require them.
    In EKS Auto Mode, AWS manages key infrastructure components such as the managed instances, operating system, container
    runtime, and lifecycle patching, but customers remain responsible for the security of pods and containers they deploy.
    Pod Security Admission evaluates pod specifications at the namespace using enforce, audit, and warn modes. Using enforce
    with baseline or restricted blocks pod specs that request spec.hostIPC: true before the pod is created, while warn and
    audit provide visibility without blocking admission.'
  impact: 'Pods with spec.hostIPC: true will be denied in namespaces that enforce the EKS baseline or restricted Pod Security
    Standard, so specialized workloads that depend on host IPC sharing may need redesign, isolated namespace placement, or
    a documented exception path. Also, if a namespace is moved to a more restrictive profile, existing noncompliant pods are
    not automatically deleted, so only newly created or restarted pods are blocked by the updated enforced policy. Pods should
    run with spec.hostIPC: false or leave the field unset unless they are covered by a specific approved exception. In EKS
    Auto Mode, direct access to managed instances is restricted, so operational workflows should use approved Kubernetes APIs,
    EKS APIs, or platform tooling instead of relying on broad host namespace access.'
