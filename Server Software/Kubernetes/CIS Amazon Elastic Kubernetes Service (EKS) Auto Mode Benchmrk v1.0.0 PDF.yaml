  remediation: 'Use dedicated Kubernetes service accounts for EKS Auto Mode workloads and map

    AWS access to those accounts through EKS Pod Identity, or IRSA where required.

    Create one least privilege IAM role per application or permission boundary, update

    workloads to reference the intended serviceAccountName, disable token

    automounting where Kubernetes API access is not needed, and restrict node instance

    profile access so pods cannot inherit broader node credentials.

    • Create a dedicated Kubernetes service account for each application or distinct

    AWS permission boundary instead of sharing the namespace default service

    account.

    • Associate that service account with a least privilege IAM role by using EKS Pod

    Identity where supported, or IRSA where Pod Identity is not supported or not

    selected. For EKS Pod Identity, create an association between the Kubernetes

    namespace, service account, and IAM role. The workload manifest must

    reference that service account for the pod to receive the intended credentials.

    • Update workload manifests to set spec.serviceAccountName explicitly so the

    intended service account is always used.

    • Set automountServiceAccountToken: false for pods or service accounts that

    do not need Kubernetes API access.

    • For EKS Pod Identity roles, restrict the trust relationship where appropriate using

    Pod Identity session tags for cluster, namespace, and service account context.

    EKS Pod Identity uses the pods.eks.amazonaws.com service principal and

    supports conditions based on request tags such as Kubernetes namespace and

    service account.'
