    such as quotas, limits, service accounts, and network policies are applied where

    required. These controls make the namespace an administrative boundary

    instead of only a naming container.

    Check whether the namespace design reduces shared administration and naming

    sprawl. AWS describes namespaces as logical partitions for soft multi-tenancy, while

    also noting that the cluster is the only strong security boundary.'
  remediation: 'Move user workloads out of the default namespace and place them in dedicated

    namespaces that reflect the intended group, application, or environment boundary. In

    EKS, namespaces are the core logical partition for soft multi-tenancy, but they only

    become meaningful administrative boundaries when paired with access controls,

    service accounts, quotas, limits, and network policies. EKS Auto Mode manages

    infrastructure components such as compute, pod and service networking, load

    balancing, DNS, and storage, but workload placement and namespace governance

    remain customer responsibilities.

    • Create dedicated namespaces for each group, application, or environment that

    needs its own administrative boundary.

    • Redeploy or migrate user workloads from default into the appropriate dedicated

    namespace.

    • Update manifests, Helm values, GitOps definitions, and pipeline defaults so

    namespaced resources explicitly set metadata.namespace and are not created in

    default by omission.

    • Rework access with namespace based Kubernetes Role and RoleBinding

    objects and, where EKS access entries are used, associate EKS access policies

    to specific namespaces instead of the whole cluster.

    • Apply namespace governance such as ResourceQuota, LimitRange, dedicated

    service accounts, and network policies so the namespace boundary supports

    resource control, identity separation, and east west traffic isolation.

    • Remove unnecessary user workloads and broad operational access from default,

    and use separate clusters rather than namespaces alone when stronger isolation

    is required for less trusted workloads.'
