    \ should not\nreintroduce broader access for the EKS Auto Mode Node IAM role, and\necr:GetAuthorizationToken must still\
    \ be granted through IAM even when a\nrepository policy is used.\naws ecr set-repository-policy \\\n  --repository-name\
    \ $REPO_NAME \\\n  --policy-text file://repo-policy.json \\\n  --region $REGION_CODE\n• Retest image pulls after the change.\
    \ Confirm that EKS Auto Mode workloads can\nstill pull required private ECR images and that the Node IAM role no longer\
    \ has\nbroader repository visibility, push, delete, or administrative access than required."
