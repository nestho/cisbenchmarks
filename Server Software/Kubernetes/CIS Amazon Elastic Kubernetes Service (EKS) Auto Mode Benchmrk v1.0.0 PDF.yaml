- id: 5.4.4
  title: Use TLS certificates for EKS Auto Mode load balancer listeners
  scoring: manual
  profile:
  - Level 1
  description: Using TLS certificates on EKS Auto Mode load balancer listeners protects client traffic by presenting a trusted
    server certificate and negotiating encrypted HTTPS or TLS connections at the listener. In EKS Auto Mode, this commonly
    means configuring TLS on a Network Load Balancer created from a Kubernetes Service or specifying certificate ARNs for
    an Application Load Balancer created from IngressClassParams and Ingress resources so externally exposed application entry
    points do not rely on unencrypted HTTP or TCP traffic. EKS Auto Mode supports load balancing for Kubernetes Services and
    Ingress resources.
  rationale: EKS Auto Mode supports TLS configuration on both primary load balancer paths. For Network Load Balancers, EKS
    Auto Mode supports Service annotations such as awsload-balancer-ssl-cert, which specifies the ACM certificate ARN for
    HTTPS or TLS, and aws-load-balancer-ssl-ports, which identifies the listener ports that should use SSL or TLS. For Application
    Load Balancers, EKS Auto Mode uses IngressClassParams, where the certificate to use for SSL or TLS is part of the load
    balancer configuration. This is important because the listener is the point where the client connection is negotiated,
    the certificate is presented, and encrypted traffic is established before requests are forwarded to targets. TLS can terminate
    at the load balancer, at the ingress layer, or continue to the pod depending on the required security model. Requiring
    certificates on load balancer listeners establishes encrypted external client access, while backend encryption must be
    handled separately if end to end encryption is required.
  impact: This control improves protection against eavesdropping and tampering on external client connections, but it introduces
    certificate lifecycle and listener configuration requirements. The ACM certificate must cover the intended domain names,
    the correct listener ports must be configured for TLS, and the Service, IngressClassParams, or Ingress configuration must
    reference the intended certificate. Expired, missing, or mismatched certificates can break client access even when the
    workload itself is healthy. This control also does not by itself guarantee encryption from the load balancer to the backend
    target unless a separate backend TLS design is implemented.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-nlb.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-alb.html
  page_start: 154
  audit_raw: 'Review all client facing EKS Auto Mode load balancers and verify that listeners use

    HTTPS or TLS with a valid certificate. For NLB backed Service resources, listener TLS

    is configured with annotations such as aws-load-balancer-ssl-cert for the ACM

    certificate ARN and aws-load-balancer-ssl-ports for the encrypted listener ports.

    For ALB backed Ingress resources, the certificate is configured through

    IngressClassParams using certificateARNs. A TCP listener on port 443 may pass

    encrypted traffic through, but it should be documented separately because it does not

    terminate TLS at the load balancer.

    • Identify all internet facing or client facing Service resources of type LoadBalancer

    and all Ingress resources.

    • Verify NLB backed Services use aws-load-balancer-ssl-cert and awsload-balancer-ssl-ports when TLS is intended to terminate
    at the NLB.

    • Verify ALB backed Ingress configurations use IngressClassParams with

    certificateARNs for HTTPS listeners.

    • Verify the ACM certificate covers the intended hostname and is valid for the

    listener configuration.

    • Verify the listener design matches the intended TLS termination point. TLS may

    terminate at the load balancer, ingress layer, or continue to the pod depending

    on the required security model.'
  remediation: 'Configure every client facing EKS Auto Mode load balancer listener to use HTTPS or

    TLS with a valid certificate so client to load balancer traffic is encrypted in transit. For

    NLB backed Service resources, add the ACM certificate ARN and encrypted listener

    ports in the Service annotations. For ALB backed Ingress resources, configure HTTPS

    listener behavior through IngressClassParams and associate the required ACM

    certificate ARN using certificateARNs. If encryption is required beyond the load

    balancer, implement backend TLS separately because listener TLS alone protects only

    the client facing connection.

    • Add a valid ACM certificate to each client facing NLB or ALB listener that should

    serve encrypted traffic.

    • For NLB Services, set aws-load-balancer-ssl-cert to the ACM certificate

    ARN and aws-load-balancer-ssl-ports to the required listener ports.

    • For ALB Ingress, configure the associated IngressClassParams with

    certificateARNs for the required HTTPS listener configuration.

    • Replace, renew, or reassign expired, missing, or mismatched certificates before

    they affect client access.

    • Implement backend TLS separately where encryption is required from the load

    balancer to the backend target.'
  checks:
  - type: manual_review
    info: 'Review all client facing EKS Auto Mode load balancers and verify that listeners use

      HTTPS or TLS with a valid certificate. For NLB backed Service resources, listener TLS

      is configured with annotations such as aws-load-balancer-ssl-cert for the ACM

      certificate ARN and aws-load-balancer-ssl-ports for the encrypted listener ports.

      For ALB backed Ingress resources, the certificate is configured through

      IngressClassParams using certificateARNs. A TCP listener on port 443 may pass

      encrypted traffic th'
    severity: medium
- id: 5.5.1
  title: Use EKS access entries for IAM principal Kubernetes access
  scoring: scored
  profile:
  - Level 1
  description: Using EKS access entries centralizes how IAM principals are granted access to the Kubernetes API and lets cluster
    access be managed through Amazon EKS instead of relying on manual aws-auth ConfigMap updates. This gives a cleaner access
    management model for users and roles that need to work with Kubernetes resources in the cluster. For EKS Auto Mode, access
    entries are especially important because Kubernetes API access is secured through EKS access entries integrated with IAM
    identities, and access entries cannot be disabled on an EKS Auto Mode cluster.
  rationale: An access entry associates an IAM principal, such as an IAM role or IAM user, with Kubernetes permissions in
    the cluster. For EKS Auto Mode, the cluster authentication mode must include the EKS API because Auto Mode requires EKS
    access entries. The aws-auth ConfigMap can be enabled as an optional compatibility path, but it should not remain the
    primary model for routine IAM principal access. Permissions can be granted by associating EKS access policies to the access
    entry, or by mapping the principal to Kubernetes groups and continuing authorization through Kubernetes RBAC objects such
    as Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings. EKS access policies can be applied cluster or limited to
    specific namespaces, while Kubernetes group mappings are better suited when highly customized RBAC is required. This allows
    standard access to be managed through EKS APIs while preserving Kubernetes RBAC for more specialized permission models.
  impact: This control improves consistency and makes access easier to review, grant, and revoke, but it usually requires
    a planned migration of any existing aws-auth ConfigMap mappings and a review of current RBAC design. For EKS Auto Mode,
    access entries are not optional, so the main impact is ensuring IAM principals, EKS access policies, Kubernetes groups,
    and namespace limits that are periodically reviewed. Poorly planned migrations or broad access policies can preserve excessive
    permissions, while missing access entries can block administrators, automation, or platform teams from required Kubernetes
    API access.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-auth.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 158
  audit_raw: "Review the cluster access model and verify IAM principal access to Kubernetes is\nmanaged through EKS access\
    \ entries rather than relying only on legacy aws-auth\nConfigMap mappings. For EKS Auto Mode, access entries are required\
    \ and cannot be\ndisabled, although the aws-auth ConfigMap can optionally remain enabled for\ncompatibility. Access entries\
    \ are available only when the cluster authentication mode is\nset to API or API_AND_CONFIG_MAP, and permissions can be\
    \ granted through EKS\naccess policies, Kubernetes groups for RBAC, or both.\nVerify the cluster authentication mode is\
    \ API or API_AND_CONFIG_MAP.\naws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query\
    \ 'cluster.accessConfig.authenticationMode' \\\n  --output text\n• Expected output: API or API_AND_CONFIG_MAP\nNote: If\
    \ the output is CONFIG_MAP, the cluster does not satisfy this audit step.\nReview the cluster’s access entries and confirm\
    \ each required IAM role or user has an\naccess entry, with no duplicate, unused, or unnecessary principals.\naws eks\
    \ list-access-entries \\\n  --cluster-name $CLUSTER_NAME \\\n  --region $REGION_CODE\nReview each access entry and confirm\
    \ the principal ARN, Kubernetes groups, and entry\ntype match the intended access model.\naws eks describe-access-entry\
    \ \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --region $REGION_CODE\nReview the permissions\
    \ attached to each access entry and confirm they are granted\nthrough the intended EKS access policies, Kubernetes groups,\
    \ or both, with access\nlimited to the required namespace or cluster level.\naws eks list-associated-access-policies \\\
    \n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --region $REGION_CODE\n• Expected output:\
    \ Associated access policies for the selected IAM principal.\nReview the policy ARN and access scope to confirm permissions\
    \ are limited to\nthe intended cluster or namespaces. EKS access policies can be associated with\naccess entries, while\
    \ Kubernetes group mappings can continue to use\nKubernetes RBAC for custom permission models.\nReview any remaining aws-auth\
    \ ConfigMap usage and flag legacy mappings that\nshould be migrated or removed if access entries are now the intended\
    \ management\npath. After access entries are created for existing aws-auth mappings, the old\nConfigMap entries can be\
    \ removed where they are no longer needed."
  remediation: "Configure the cluster to use EKS access entries for IAM principal access management,\nthen create and scope\
    \ access entries for each required IAM role or user. For EKS Auto\nMode, access entries should be the primary access model\
    \ because Auto Mode uses\naccess entries and they cannot be disabled. This remediation typically starts by\nenabling the\
    \ access entry API through the cluster authentication mode, then moving\nexisting access management from legacy aws-auth\
    \ ConfigMap mappings to access\nentries with EKS access policies, Kubernetes RBAC group mappings, or both. Moving\nfrom\
    \ CONFIG_MAP to API_AND_CONFIG_MAP is the recommended transition path when\nlegacy mappings still need to be preserved\
    \ during migration.\nUpdate the cluster authentication mode to API_AND_CONFIG_MAP.\naws eks update-cluster-config \\\n\
    \  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --access-config authenticationMode=API_AND_CONFIG_MAP\nCreate\
    \ an access entry for each IAM principal that needs Kubernetes access. Each\naccess entry maps one existing IAM role or\
    \ IAM user to cluster access.\naws eks create-access-entry \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN\
    \ \\\n  --region $REGION_CODE\nAssociate the required EKS access policies to the access entry, or map the principal to\n\
    Kubernetes groups and authorize it through RBAC objects such as Roles,\nClusterRoles, RoleBindings, and ClusterRoleBindings.\
    \ Scope access to specific\nnamespaces where possible.\naws eks associate-access-policy \\\n  --cluster-name $CLUSTER_NAME\
    \ \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --policy-arn $ACCESS_POLICY_ARN \\\n  --access-scope type=namespace,namespaces=$NAMESPACE\
    \ \\\n  --region $REGION_CODE\n• Use cluster access only where it is required. For application teams or namespace\nlimited\
    \ operators, prefer namespace access scopes or Kubernetes RBAC group\nmappings instead of broad cluster permissions."
  checks:
  - type: manual_review
    info: 'Review the cluster access model and verify IAM principal access to Kubernetes is

      managed through EKS access entries rather than relying only on legacy aws-auth

      ConfigMap mappings. For EKS Auto Mode, access entries are required and cannot be

      disabled, although the aws-auth ConfigMap can optionally remain enabled for

      compatibility. Access entries are available only when the cluster authentication mode is

      set to API or API_AND_CONFIG_MAP, and permissions can be granted through EKS

      access policies, '
    severity: medium
