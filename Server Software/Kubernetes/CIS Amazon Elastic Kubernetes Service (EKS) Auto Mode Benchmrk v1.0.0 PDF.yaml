    command: show the key ARN,
    severity: medium
    info: 'Review the EKS cluster configuration and verify that EKS API data is protected with a

      customer managed KMS key, not only the default AWS owned envelope encryption key.

      For this control, the important check is whether the cluster is associated with a customer

      managed key for EKS envelope encryption. EKS Auto Mode supports envelope

      encryption for Kubernetes API data using AWS KMS, with options for A'
- id: 5.4.1
  title: Enable private EKS API access and restrict public access to approved CIDRs
  scoring: scored
  profile:
  - Level 1
  description: This recommendation reduces exposure of the EKS Kubernetes API server endpoint without requiring a private
    only design. The intended end state is that private endpoint access is enabled, and if the public endpoint remains enabled,
    public access is restricted to approved CIDR ranges instead of being open to all internet addresses. This preserves approved
    administration paths while reducing unnecessary internet exposure. EKS supports configuring private access, public access,
    and public access CIDRs for the Kubernetes API server endpoint.
  rationale: EKS exposes separate endpoint access settings through endpointPrivateAccess, endpointPublicAccess, and publicAccessCidrs.
    When private access is enabled, Kubernetes API requests from within the cluster VPC use the private VPC endpoint, and
    access to that private endpoint is controlled by the cluster security group. When public access is enabled, the API server
    endpoint remains reachable from the internet, but publicAccessCidrs restricts which source ranges can reach the public
    endpoint. The CIDR allowlist applies only to the public endpoint and does not control the private endpoint. If public
    access remains enabled, the allowlist should include only trusted administrator, automation, VPN, or network egress CIDR
    ranges. If private access is not enabled, the public CIDR allowlist must also include the outbound source addresses used
    by nodes or Fargate pods, such as NAT gateway egress addresses, or those components can lose access to the API server.
    Enabling private access avoids that dependency for VPC Kubernetes API traffic.
  impact: This recommendation provides a balanced hardening option because it reduces public exposure while preserving approved
    remote administration paths. The tradeoff is operational maintenance of the CIDR allowlist and the risk of accidental
    lockout if trusted administrator IPs, VPN ranges, automation runners, NAT egress addresses, or other required source ranges
    are omitted. It is stricter than the default public endpoint model, but less restrictive than a private only API design.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/config-cluster-endpoint.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  page_start: 143
  audit_raw: "Check that private EKS API endpoint access is enabled, public EKS API endpoint\naccess is enabled only for approved\
    \ administration paths, and public access CIDRs are\nrestricted to approved source ranges. EKS supports separate settings\
