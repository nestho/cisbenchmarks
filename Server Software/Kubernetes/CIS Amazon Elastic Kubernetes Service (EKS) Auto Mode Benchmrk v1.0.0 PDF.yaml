    severity: medium
- id: 5.1.4
  title: Restrict EKS Auto Mode workload images to approved registries
  scoring: manual
  profile:
  - Level 1
  description: Restricting EKS Auto Mode workload images to approved registries helps reduce software supply chain risk by
    ensuring workloads are sourced only from trusted image locations. Approved registry controls provide a workload guardrail
    that complements image scanning, image signing, and deployment governance.
  rationale: A practical way to enforce this control in EKS Auto Mode is through policy as code admission controls such as
    Kyverno or OPA Gatekeeper, which evaluate Kubernetes workload requests before they are admitted. EKS Auto Mode nodes remain
    Kubernetes conformant, so standard Kubernetes policy enforcement tools can be used to limit workload configuration, including
    container image source rules. Approved registry policies can reject pods or workload controllers that reference images
    from untrusted registries, while optional signature verification can add a stronger trust check for signed images. For
    signature verification, EKS supports admission based approaches such as Gatekeeper with Ratify or Kyverno, and requires
    a Notation trust store and trust policy for the selected admission controller. This turns image origin and publisher trust
    into an admission time control instead of relying only on naming standards or manual review.
  impact: This control reduces the chance that EKS Auto Mode workloads pull images from unapproved or untrusted registries,
    but it adds administrative overhead because the approved registry list must be maintained for platform add-ons, vendor
    components, monitoring agents, and operational exceptions. If the allowlist is too narrow, valid deployments can be blocked
    until the required registry is added. A practical example is GuardDuty Runtime Monitoring, where clusters using an allowed-containerregistries
    admission policy may need the GuardDuty image registry added before the security agent can be deployed or updated successfully.
  references:
