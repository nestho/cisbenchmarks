- id: 5.3.1
  title: Encrypt EKS API data with customer managed KMS keys
  scoring: manual
  profile:
  - Level 1
  description: Using customer managed KMS keys for EKS envelope encryption adds a customer controlled protection layer for
    Kubernetes API data stored through the EKS control plane, not only Kubernetes Secrets. This strengthens data at rest protection
    while allowing organizations to manage key ownership, rotation, policy, and audit visibility for the key used to protect
    EKS API data. EKS Auto Mode documentation identifies envelope encryption for all Kubernetes API data and AWS KMS integration
    with either AWS owned keys or customer managed keys.
  rationale: Envelope encryption protects Kubernetes API data stored through the EKS control plane. Plaintext Kubernetes resources
    are encrypted with data encryption keys before being persisted in etcd, and the data encryption key material is protected
    with a key encryption key in AWS KMS. This adds a KMS backed encryption layer above the underlying control plane storage
    encryption and limits plaintext exposure to the Kubernetes API server processing path. In the current EKS model, envelope
    encryption is enabled by default with an AWS owned key, but a customer managed KMS key can be used when stronger key control,
    key policy governance, CloudTrail visibility, rotation management, or separation of duties is required. If a customer
    managed key was previously used for Kubernetes Secrets encryption, that key is also used as the key encryption key for
    all Kubernetes API data protected by envelope encryption.
  impact: Using a customer managed KMS key increases key control and audit visibility, but it also adds KMS cost, key policy
    administration, access governance, and lifecycle risk. If the key becomes unavailable, the EKS API server may be unable
    to encrypt new Kubernetes objects or decrypt existing objects stored in etcd, which can place the cluster in a degraded
    state. If the key associated with the cluster is deleted, the cluster can become unrecoverable, so key deletion and disablement
    should be tightly controlled.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/autosecure.html
  - 2. https://docs.aws.amazon.com/whitepapers/latest/security-overview-amazon-eksauto-mode/amazon-eks-control-plane.html
  page_start: 138
  audit_raw: "Review the EKS cluster configuration and verify that EKS API data is protected with a\ncustomer managed KMS\
    \ key, not only the default AWS owned envelope encryption key.\nFor this control, the important check is whether the cluster\
    \ is associated with a customer\nmanaged key for EKS envelope encryption. EKS Auto Mode supports envelope\nencryption\
    \ for Kubernetes API data using AWS KMS, with options for AWS owned keys\nor customer managed keys.\nReview the cluster\
    \ encryption configuration and confirm a customer managed KMS key\nARN is associated with the cluster. If no customer\
    \ key ARN is associated, the cluster\nstill has default envelope encryption, but it does not meet this customer managed\
    \ key\ncontrol. EKS indicates that clusters using a customer managed key show the key ARN,\nwhile AWS owned key usage\
    \ does not expose the key ARN.\naws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n \
    \ --query 'cluster.encryptionConfig'\n• In the command output, verify that the encryption configuration includes\nresources\
    \ with secrets and a provider.keyArn value for the customer managed\nKMS key. Although the API field references secrets,\
    \ the current EKS envelope\nencryption model uses the associated customer managed key as the key\nencryption key for Kubernetes\
    \ API data protected by envelope encryption.\nReview the selected KMS key and confirm it is symmetric, supports encrypt\
    \ and decrypt\noperations, exists in the same Region as the cluster, and remains enabled. If the key is\nin another account,\
    \ confirm the required principal still has access to use it.\naws kms describe-key \\\n  --key-id $KEY_ARN \\\n  --region\
    \ $REGION_CODE\n• Verify the key policy and grants still allow EKS to use the key. A disabled key,\nrevoked grant, broken\
    \ key policy, or deleted key can place the cluster into a\ndegraded or unrecoverable state.\nWhere continuous compliance\
    \ monitoring is used, confirm the cluster would pass the\nEKS_SECRETS_ENCRYPTED AWS Config rule with the expected customer\
    \ managed key\nARN configured as a parameter. Treat this as a supporting compliance check, while the\nprimary audit evidence\
    \ remains the EKS cluster encryption configuration and KMS key\nstate."
  remediation: "Configure the EKS Auto Mode cluster to use a customer managed KMS key for EKS\nenvelope encryption so Kubernetes\
    \ API data is protected with a customer controlled key\nencryption key. The key must already exist, be symmetric, support\
    \ encrypt and decrypt\noperations, be in the same Region as the cluster, and have permissions that allow EKS\nto use it.\n\
    The associate-encryption-config operation does not create a KMS key and does\nnot encrypt arbitrary data directly. It\
    \ associates an existing customer managed KMS key\nto the cluster for envelope encryption. In the EKS API, the association\
    \ is still expressed\nwith resources:[\"secrets\"], but for current EKS envelope encryption, a customer\nmanaged key associated\
    \ for Secrets is used as the key encryption key for Kubernetes\nAPI data protected by envelope encryption.\nCreate or\
    \ identify a customer managed symmetric KMS key that already exists in the\nsame Region as the EKS cluster and is allowed\
    \ for EKS use. Associate that existing\nKMS key to the cluster. Replace the variables with real values before running\
    \ the\ncommand.\naws eks associate-encryption-config \\\n  --cluster-name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\
    \n  --encryption-config\n\"[{\\\"resources\\\":[\\\"secrets\\\"],\\\"provider\\\":{\\\"keyArn\\\":\\\"${KEY_ARN}\\\"}}]\"\
    \n• Wait for the cluster update to complete, then recheck the cluster configuration\nand confirm that cluster.encryptionConfig\
    \ contains resources set to secrets\nand the expected provider.keyArn. The update runs asynchronously and\nshould be verified\
    \ before the remediation is considered complete.\nKeep the associated KMS key enabled and protected from accidental deletion.\
    \ Do not\ndelete or disable the key while the cluster depends on it, because the cluster can\nbecome degraded or unrecoverable\
    \ if the key is no longer available."
  checks:
