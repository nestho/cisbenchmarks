controls:
- id: 4.1.1
  title: Grant AmazonEKSClusterAdminPolicy only where full cluster administration is required
  scoring: manual
  profile:
  - Level 1
  description: Grant AmazonEKSClusterAdminPolicy only to IAM principals that require unrestricted, cluster administrative
    control. In EKS Auto Mode, cluster access is built on EKS access entries and the EKS API authentication mode, and the
    initial bootstrap administrator access for the cluster creator can be disabled, so full administrator rights should be
    assigned deliberately rather than used as the default operating model.
  rationale: AmazonEKSClusterAdminPolicy grants administrator access at cluster scope and includes * for Kubernetes API groups,
    non-resource URLs, resources, and verbs, which effectively gives the principal unrestricted control over Kubernetes objects
    and cluster operations. A more limited administrative scope can be provided with AmazonEKSAdminPolicy, which is typically
    associated to one or more Kubernetes namespaces instead of the full cluster. Permissions can also accumulate, because
    a single access entry can have multiple associated access policies and can also receive additional Kubernetes permissions
    through bound groups, Roles, or ClusterRoles. For workload identities, EKS Pod Identity is the cleaner service account
    pattern in Auto Mode because permissions are tied to a specific Kubernetes service account and only Pods using that service
    account receive the associated IAM role, which supports least privilege without using cluster administrator access for
    applications.
  impact: Restricting use of AmazonEKSClusterAdminPolicy usually requires replacing broad cluster assignments with namespace
    access policies, custom RBAC bindings, and service account specific Pod Identity associations. Some platform operations
    and recovery scenarios may still need a tightly controlled cluster administrator path, but reducing routine use lowers
    the blast radius of a compromised IAM principal or overly privileged service account.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 21
  audit_raw: "For EKS Auto Mode, this setting should be audited through EKS access entries and\nassociated access policies,\
    \ because Auto Mode uses the EKS API access model and\nyou cannot disable access entries on an Auto Mode cluster.\nAmazonEKSClusterAdminPolicy\
    \ is the AWS managed policy that grants cluster\nadministrator access, so the audit should confirm that it is present\
    \ only on principals\nwith a documented need for full cluster administration.\nIdentify the IAM principal you want to\
    \ review and confirm its principal ARN and target\ncluster name. An access entry maps one IAM principal to cluster access,\
    \ and the policy\nreview is performed against that access entry.\nRun the following command to list the access policies\
    \ associated with that principal\nARN for a specific cluster:\naws eks list-associated-access-policies \\\n  --cluster-name\
    \ $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --output json\nThis command is the AWS supported way to list\
    \ the access policies attached to an\naccess entry.\n• Review the JSON output for the presence of arn:aws:eks::aws:clusteraccess-policy/AmazonEKSClusterAdminPolicy.\
    \ If that policy appears, the\nprincipal has cluster administrator access through the EKS access entry model.\n• Validate\
    \ whether that level of access is required and documented for the\nprincipal’s operational role. For most users, AWS provides\
    \ narrower alternatives\nsuch as AmazonEKSAdminPolicy and namespace access, which should be\npreferred when full cluster\
    \ administration is not necessary.\n• Record a finding if AmazonEKSClusterAdminPolicy is associated with any\nprincipal\
    \ that does not have a justified platform administration requirement.\nBecause access policies are managed through EKS\
    \ access entries, this AWS\nCLI check is more reliable for this control in Auto Mode than a Kubernetes only\nRBAC query.\n\
    Note: Pass if AmazonEKSClusterAdminPolicy is associated only with approved cluster\nadministrators. Fail if it is associated\
    \ with any other principal."
  remediation: "In EKS Auto Mode, this setting should be updated through EKS access entries and\nassociated access policies\
    \ rather than older cluster access methods. Auto Mode relies\non the EKS access entry model to authorize IAM principals\
    \ for Kubernetes access, and\nSTANDARD access entries support adding or removing AWS-managed EKS access\npolicies with\
    \ either cluster or namespace permissions. Where those predefined policies\ndo not provide the required level of restriction,\
    \ administrators can use access entries\nwith Kubernetes group assignments and apply custom Kubernetes RBAC for fine\n\
    grained control.\nIdentify principals that do not need full cluster administration. Review each IAM user or\nrole that\
    \ currently has AmazonEKSClusterAdminPolicy and confirm whether its duties\ntruly require unrestricted access across all\
    \ Kubernetes API groups, resources, verbs,\nand non-resource URLs. Narrower alternatives should be used for routine\n\
    administration.\nRemove AmazonEKSClusterAdminPolicy from unnecessary principals. For an existing\nSTANDARD access entry,\
    \ disassociate the policy with the AWS CLI (This removes the\ncluster administrator policy from that principal’s access\
    \ entry.):\naws eks disassociate-access-policy \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN\
    \ \\\n  --policy-arn arn:aws:eks::aws:cluster-accesspolicy/AmazonEKSClusterAdminPolicy\nIf administrative access is still\
    \ needed, add AmazonEKSAdminPolicy in the console with\nnamespace scope where possible. In the AWS Management Console:\n\
    1. Open EKS and select the Cluster > Access tab > the IAM principal ARN in IAM\naccess entries > select Add Access Policy\
    \ in Access Policies > select\nAmazonEKSAdminPolicy and set the access scope to either the required\nnamespace or Cluster\
    \ > Add Access Policy.\n2. Use custom RBAC when AWS managed access policies are still too broad. AWS\nnotes that EKS access\
    \ policies are predefined and cannot be modified. If they do\nnot fit the required permission set, use access entries\
    \ with Kubernetes group\nnames and bind those groups to custom Role or ClusterRole objects that grant\nonly the required\
    \ permissions.\n3. Use Pod Identity for workloads instead of broad administrator access. For\napplication access to AWS\
    \ services, assign IAM permissions through EKS Pod\nIdentity tied to the specific Kubernetes service account rather than\
    \ leaving broad\nuser, role, or service account access in place.\n4. Verify the result after remediation. Re-run the access-policy\
    \ review for the\nprincipal and confirm that AmazonEKSClusterAdminPolicy is no longer\nassociated unless there is an approved\
    \ cluster admin requirement. Because\nassociated access policies and Kubernetes RBAC permissions can both\ncontribute\
    \ to effective access, document any remaining broad assignments\nexplicitly."
  checks:
  - type: manual_review
    info: 'For EKS Auto Mode, this setting should be audited through EKS access entries and

      associated access policies, because Auto Mode uses the EKS API access model and

      you cannot disable access entries on an Auto Mode cluster.

      AmazonEKSClusterAdminPolicy is the AWS managed policy that grants cluster

      administrator access, so the audit should confirm that it is present only on principals

      with a documented need for full cluster administration.

      Identify the IAM principal you want to review and confirm its '
    severity: medium
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in EKS Auto Mode is granted only to IAM principals, Kubernetes
    users or groups, and workload identities with a defined operational or application need. The review should cover EKS access
    entries and associated access policies, Kubernetes RBAC roles and bindings, and workload access paths tied to Kubernetes
    service accounts and EKS Pod Identity. Particular attention should be given to permissions that allow get, list, or watch
    access to Secrets, and any approved access should be as narrowly as possible, including to specific namespaces where supported.
  rationale: This requirement limits unnecessary exposure to one of the most sensitive resource types in the cluster. In the
    current EKS authorization model, access can be granted through AWS managed EKS access policies associated with access
    entries, through Kubernetes RBAC bound to groups referenced by those access entries, or through workload identity patterns.
    AWS documents that AmazonEKSAdminViewPolicy includes Kubernetes Secrets in its cluster view scope, and AmazonEKSSecretReaderPolicy
    grants get, list, and watch permissions on Secrets, so Secret access can be introduced through more than one approved
    authorization path. Because EKS access policies can be namespace and access entry permissions can combine with Kubernetes
    RBAC permissions, Secrets access should be minimized to prevent broad read access from accumulating across overlapping
    EKS and Kubernetes authorization layers. For workloads that need access to external secret stores or AWS services, EKS
    Pod Identity is the better Auto Mode aligned pattern because it scopes IAM permissions to the service account used by
    the Pod, rather than relying on unnecessary Kubernetes Secret access.
  impact: If access to Secrets is granted too broadly in EKS Auto Mode, a compromised IAM principal, Kubernetes subject, or
    workload identity can retrieve sensitive cluster data and potentially expand the scope of an incident across namespaces
    or into AWS resources when additional workload permissions are also available. Tightening Secret access may require more
    targeted namespace scoping, custom RBAC, or Pod Identity configuration, but it reduces the blast radius of credential
    exposure, pod compromise, and excessive read access to sensitive data.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policypermissions.html
  page_start: 25
  audit_raw: "Review every path that can grant access to Kubernetes Secrets in an EKS Auto Mode\ncluster. Start with EKS access\
    \ entries and associated access policies, because Auto\nMode uses the EKS API access-entry model. Then review Kubernetes\
    \ RBAC, service\naccounts, Pod Identity associations for workloads that access AWS secret stores, and\nlegacy aws-auth\
    \ mappings only if the cluster uses API_AND_CONFIG_MAP. Effective\naccess can come from overlapping EKS access policies,\
    \ Kubernetes groups, and\nRBAC bindings, and access policy scope can be either cluster or namespace.\n• Check the cluster\
    \ authentication mode first. Confirm whether the cluster uses API\nor API_AND_CONFIG_MAP. Review legacy aws-auth mappings\
    \ only if\nAPI_AND_CONFIG_MAP is enabled or the cluster still retains ConfigMap based\naccess paths.\no List access entries\
    \ and review associated access policies for each\nrelevant principal.\no For each access entry, identify principals whose\
    \ associated policies could\nexpose Secrets, especially AmazonEKSSecretReaderPolicy and\nAmazonEKSAdminViewPolicy, and\
    \ confirm whether scope is limited to the\nrequired namespace instead of the full cluster.\nExample commands:\naws eks\
    \ list-access-entries \\\n  --cluster-name $CLUSTER_NAME \\\n  --output json\naws eks list-associated-access-policies\
    \ \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --output json\n• Review Kubernetes RBAC\
    \ roles and bindings that grant Secret read access. First\nidentify Role and ClusterRole objects that grant get, list,\
    \ or watch on\nsecrets. Then review the RoleBinding and ClusterRoleBinding objects that\nattach those permissions to users,\
    \ groups, and service accounts. Give extra\nscrutiny to ClusterRoles, ClusterRoleBindings, and broadly shared Group\n\
    bindings, because bindings determine who actually receives the permissions.\nExample command to find Secret reading Roles\
    \ and ClusterRoles:\nkubectl get roles,clusterroles -A -o json | jq -r '\n  .items[]\n  | select(any(.rules[]?; any(.resources[]?;\
    \ .==\"secrets\") and any(.verbs[]?;\n.==\"get\" or .==\"list\" or .==\"watch\")))\n  | [.kind, (.metadata.namespace //\
    \ \"-\"), .metadata.name]\n  | @tsv\n'\n• Review service accounts bound to Secret reading roles. Confirm that each\nservice\
    \ account with Secret read access has a defined workload need. Pay\nparticular attention to DaemonSets, CSI drivers, and\
    \ other broadly deployed\ncomponents, because widely reused identities can widen exposure if they are\noverprivileged.\n\
    • Review Pod Identity associations for workloads that use AWS secret stores. For\nworkloads that access Secrets Manager,\
    \ SSM Parameter Store, or other AWS\nservices, confirm that IAM permissions are tied to the specific Kubernetes service\n\
    account used by the Pod. In EKS Auto Mode, the Pod Identity Agent is built in, so\nthis should be part of the standard\
    \ workload identity review.\n• Review legacy aws-auth mappings only where applicable. If the cluster still uses\nConfigMap\
    \ based access alongside the API model, inspect those mappings\nbecause they can still place IAM principals into Kubernetes\
    \ groups that later\nreceive Secret access through RBAC. AWS treats ConfigMap based access as\ndeprecated in favor of\
    \ access entries."
  remediation: 'Start with EKS access entries and associated access policies, because EKS policies

    can grant Secrets access without native RBAC objects, and policies such as

    AmazonEKSAdminViewPolicy, AmazonEKSSecretReaderPolicy, and broader

    administrative policies can expose Secrets depending on scope. Then reduce

    unnecessary access in Kubernetes RBAC, service accounts, and any remaining legacy

    aws-auth mappings, and replace broad permissions with the narrowest namespace or

    workload scope that still supports the required function.

    • Remove or narrow EKS access policy associations that expose Secrets, and

    prefer namespace access within the cluster wherever possible. If AWS managed

    access policies are still broader than required, use access entries with

    Kubernetes group assignments and custom Kubernetes RBAC to grant the exact

    permissions needed.

    • Replace broad RBAC permissions on secrets with the smallest practical Role

    or ClusterRole, and remove unnecessary get, list, or watch access from

    users, groups, and service accounts.

    • Reduce service account access to Secrets to only the workloads that require it,

    and tighten any related Pod Identity IAM permissions to least privilege.

    • Review DaemonSet and CSI driver service accounts first, because their tokens

    and permissions can be exposed from any node where those pods run.

    • If the cluster still uses API_AND_CONFIG_MAP or retains legacy ConfigMap based

    access, migrate remaining legacy aws-auth mappings to access entries where

    appropriate, and remove stale mappings that still place IAM principals into

    Kubernetes groups with Secrets access.

    • Validate that each remaining Secrets access path is tied to a documented

    operational or workload requirement, and flag any unnecessary access for

    removal.

    After changes are made, recheck access entries, associated access policies, RBAC

    bindings, service accounts, and Pod Identity associations to confirm Secrets access is

    no broader than necessary.'
  checks:
  - type: manual_review
    info: 'Review every path that can grant access to Kubernetes Secrets in an EKS Auto Mode

      cluster. Start with EKS access entries and associated access policies, because Auto

      Mode uses the EKS API access-entry model. Then review Kubernetes RBAC, service

      accounts, Pod Identity associations for workloads that access AWS secret stores, and

      legacy aws-auth mappings only if the cluster uses API_AND_CONFIG_MAP. Effective

      access can come from overlapping EKS access policies, Kubernetes groups, and

      RBAC bindings'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole objects in EKS Auto Mode do not use wildcard entries such as *
    for verbs, resources, or apiGroups unless a documented administrative or platform requirement exists. The review should
    also include the RoleBinding and ClusterRoleBinding objects that assign those roles to users, groups, or service accounts,
    because EKS Auto Mode uses access entries for IAM principal access, but still supports native Kubernetes RBAC for custom
    authorization needs, and principals can receive the combined permissions of associated access policies and RBAC bindings.
  rationale: This recommendation supports least privilege authorization in the parts of EKS Auto Mode that still rely on Kubernetes
    RBAC. For most use cases, AWS recommends EKS access policies, but when those predefined policies do not meet a requirement,
    AWS directs you to use Kubernetes groups and create your own Role, ClusterRole, RoleBinding, and ClusterRoleBinding objects.
    EKS further notes that if an access entry has both associated access policies and Kubernetes group mappings, the IAM principal
    receives all permissions from both paths. In that model, wildcard rules make the effective privilege set harder to predict,
    harder to review, and easier to overextend across current and future resources. The risk is higher for broadly deployed
    service accounts, such as those used by DaemonSets or storage related components, because those identities can affect
    many nodes or workloads if their RBAC grants are too broad.
  impact: If wildcard permissions are used broadly in EKS Auto Mode, a user or service account can receive more access than
    intended across namespaces, resource types, or API actions, and that excess access can combine with other policy associations
    or workload credentials to widen the scope of compromise. When the affected identity is a broadly deployed service account
    or one linked to Pod Identity, an overbroad RBAC rule can turn a single pod or node issue into unauthorized cluster changes
    or access to AWS APIs beyond the workload’s intended boundary.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/create-k8s-group-accessentry.html
  page_start: 29
  audit_raw: "Begin by reviewing custom Kubernetes Role and ClusterRole objects in EKS Auto Mode\nto identify any use of wildcard\
    \ entries such as * for verbs, resources, or apiGroups. In\nEKS, this review should cover native RBAC objects, access\
    \ entries that reference\nKubernetes groups, service accounts, and any remaining aws-auth mappings only\nwhere ConfigMap\
    \ based access still applies, because EKS supports access through\nboth access entries and Kubernetes RBAC, and it also\
    \ creates its own platform RBAC\nobjects that should be distinguished from customer defined permissions.\n• Review custom\
    \ Role and ClusterRole definitions for wildcard use in verbs,\nresources, or apiGroups, and prioritize cluster roles because\
    \ ClusterRoles\napply across the cluster.\nkubectl get roles,clusterroles -A -o json | jq -r '\n  ([\"KIND\",\"NAMESPACE\"\
    ,\"NAME\",\"WILDCARD_FIELDS\"] | join(\" | \")),\n  (\n    .items[]\n    | . as $r\n    | [\n        (if any(.rules[]?;\
    \ any(.verbs[]?; .==\"*\")) then \"verbs\" else empty\nend),\n        (if any(.rules[]?; any(.resources[]?; .==\"*\"))\
    \ then \"resources\" else\nempty end),\n        (if any(.rules[]?; any(.apiGroups[]?; .==\"*\")) then \"apiGroups\" else\n\
    empty end)\n      ] as $wild\n    | select(($wild | length) > 0)\n    | [\n        $r.kind,\n        ($r.metadata.namespace\
    \ // \"-\"),\n        $r.metadata.name,\n        ($wild | join(\",\"))\n      ]\n    | join(\" | \")\n  )\n'\nSample Output:\n\
    KIND | NAMESPACE | NAME | WILDCARD_FIELDS\nClusterRole | - | cluster-admin | verbs,resources,apiGroups\nClusterRole |\
    \ - | eks:addon-manager | resources\nClusterRole | - | eks:service-operations | resources\nClusterRole | - | system:controller:disruption-controller\
    \ | apiGroups\nClusterRole | - | system:controller:generic-garbage-collector |\nresources,apiGroups\nClusterRole | - |\
    \ system:controller:horizontal-pod-autoscaler |\nresources,apiGroups\nClusterRole | - | system:controller:namespace-controller\
    \ |\nresources,apiGroups\nClusterRole | - | system:controller:resourcequota-controller |\nresources,apiGroups\nClusterRole\
    \ | - | system:kube-controller-manager | resources,apiGroups\nClusterRole | - | system:kubelet-api-admin | verbs\n• Review\
    \ the RoleBinding and ClusterRoleBinding assignments for those roles\nto identify which users, groups, and service accounts\
    \ actually receive the\nwildcard permissions, and separate EKS created bindings from customer\nmanaged ones during the\
    \ review.\n• Review access entries that reference Kubernetes groups, because EKS allows\npermissions to be attached through\
    \ access policies or through Kubernetes\ngroups backed by RBAC objects, which means wildcard roles can still be granted\n\
    through group based authorization paths.\n• Review service accounts for DaemonSets, CSI drivers, and other broadly\ndeployed\
    \ controllers first, because EKS RBAC hardening guidance now explicitly\nrecommends reviewing the ClusterRoles bound to\
    \ CSI driver and DaemonSet\nservice accounts and removing permissions that are not required.\n• Review any remaining legacy\
    \ aws-auth mappings, but only if the cluster uses\nAPI_AND_CONFIG_MAP or still retains ConfigMap based access, because\
    \ IAM\nprincipals can still be mapped into Kubernetes groups that may be bound to\nwildcard roles.\n• Confirm that each\
    \ wildcard rule has a documented operational or platform need.\nWhere it does not, flag it for remediation and replace\
    \ it with enumerated\nresources, verbs, API groups, or narrower namespace roles. EKS guidance\nfavors fine grained permissions\
    \ through access policies where they fit, and\ncustom RBAC only when finer control is required.\nSummary: Review custom\
    \ RBAC roles, bindings, group mappings, and service\naccounts to verify that wildcard permissions are rare, justified,\
    \ and no broader than\nrequired."
  remediation: 'Begin by replacing wildcard permissions in custom Role and ClusterRole objects with

    explicitly enumerated verbs, resources, and apiGroups that match the approved

    operational need. In EKS, this remediation should focus on customer managed RBAC

    objects, the bindings that assign them, access entries that reference Kubernetes

    groups, and service accounts used by workloads or cluster components. EKS guidance

    favors specific access through access entries and using custom RBAC only when

    predefined access policies do not meet the requirement, especially for service accounts

    used by add-ons, DaemonSets, and CSI drivers.

    • Replace wildcard values in custom Role and ClusterRole rules with the specific

    verbs, resources, and apiGroups the function actually requires.

    • Reduce or remove any RoleBinding and ClusterRoleBinding that assign

    those wildcard roles more broadly than necessary, and prefer namespace

    bindings where possible.

    • Review access entries that use Kubernetes groups, because those groups can

    still receive wildcard permissions through native RBAC even when IAM

    authentication is managed through EKS.

    • Review service accounts for DaemonSets, CSI drivers, and other broadly

    deployed controllers first, and remove wildcard permissions that are not required

    for their runtime behavior.

    • Distinguish customer managed roles from EKS created platform roles before

    making changes, and avoid modifying EKS managed RBAC objects unless you

    intentionally want to change how a platform component operates.

    • If the cluster still uses API_AND_CONFIG_MAP or retains legacy ConfigMap based

    access, remove any remaining aws-auth mappings that place IAM principals into

    Kubernetes groups bound to wildcard roles.

    Note: After narrowing the role definition, validate that the user, group, or service

    account can still perform its approved tasks, then remove the superseded wildcard role

    or binding. Recheck access entries, group mappings, RBAC bindings, and service

    accounts to confirm wildcard permissions are no longer granted through another path.'
  checks:
  - type: manual_review
    info: 'Begin by reviewing custom Kubernetes Role and ClusterRole objects in EKS Auto Mode

      to identify any use of wildcard entries such as * for verbs, resources, or apiGroups. In

      EKS, this review should cover native RBAC objects, access entries that reference

      Kubernetes groups, service accounts, and any remaining aws-auth mappings only

      where ConfigMap based access still applies, because EKS supports access through

      both access entries and Kubernetes RBAC, and it also creates its own platform RBAC

      object'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create Pods in EKS Auto Mode is a high risk permission that should be limited to approved deployment
    and operational functions. In EKS, Pod creation can be granted through associated access policies or native Kubernetes
    RBAC, and policies such as AmazonEKSAdminPolicy and AmazonEKSEditPolicy include create access on pods. Because Pods run
    within a namespace, use a service account, and can carry workload permissions, Pod creation should be set to the smallest
    practical namespace and service account context required by the workload.
  rationale: Creating a Pod can allow a principal to run code with the permissions of the service account assigned to that
    Pod. EKS Pods use Kubernetes service accounts, AWS recommends using dedicated service accounts for applications, and service
    account token auto mounting should be disabled when Kubernetes API access is not needed. Those behaviors make Pod creation
    more than a routine write permission, because it can become a path to exercise Kubernetes API permissions indirectly through
    workload identity. The risk can extend beyond Kubernetes RBAC into AWS access. With EKS Pod Identity, a Kubernetes service
    account can be associated with an IAM role, allowing Pods to obtain AWS credentials for API calls. EKS pod security guidance
    also identifies higher risk Pod behaviors such as privileged execution, which means the ability to create Pods can also
    expose host or node adjacent attack paths if security controls do not constrain the Pod spec.
  impact: If Pod creation is granted too broadly in EKS Auto Mode, a user or workload can launch Pods under available service
    accounts and gain unintended Kubernetes or AWS access, increasing the risk of privilege escalation and wider cluster impact.
    If those Pods are also allowed to run with high risk security settings, the resulting access can extend beyond the intended
    workload boundary and increase the scope of compromise.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policypermissions.html
  page_start: 34
  audit_raw: 'Begin by reviewing every path that can grant the ability to create Pods in EKS Auto

    Mode. Start with access entries and associated access policies, because Auto Mode

    uses the EKS API access-entry model, and AmazonEKSAdminPolicy and

    AmazonEKSEditPolicy include create access for pods. Then review Kubernetes RBAC,

    service accounts, and Pod security controls, because Pod creation can allow an identity

    to launch workloads under available service accounts and potentially exercise both

    Kubernetes and AWS permissions.

    • Review access entries and associated access policies for principals that can

    access the Kubernetes API, and identify any policy scope that allows create on

    pods. Check whether the scope is cluster or namespace.

    • Review Role and ClusterRole assignments that allow create on pods, and also

    review deployments, daemonsets, statefulsets, jobs, and cronjobs,

    because those resources can launch Pods through controllers. Map each role to

    the principals that receive it.

    • Review service accounts used by workloads that can create or run Pods. Check

    for use of the default service account, prefer dedicated service accounts where

    possible, and confirm whether token auto mounting is disabled where

    Kubernetes API access is not needed.

    • Review workloads that use EKS Pod Identity, and any remaining IRSA

    configurations where already in use, because a Pod created under a linked

    service account can obtain AWS credentials in addition to Kubernetes API

    access. Confirm the IAM role is limited to the intended workload scope.

    • Review whether Pod creation can be paired with privileged execution, hostPath,

    or hostNetwork, and confirm that Pod Security Admission or policy controls

    restrict those settings where required.

    • Review any remaining legacy aws-auth usage only if the cluster uses

    API_AND_CONFIG_MAP, because IAM principals can still reach Kubernetes

    authorization through older mappings.

    Note: Review access policies, RBAC, service accounts, workload IAM associations,

    and Pod controls to verify that Pod creation is tightly scoped and granted only where

    required.'
  remediation: 'Begin with access entries and associated access policies, because

    AmazonEKSAdminPolicy and AmazonEKSEditPolicy include create access for pods,

    and access policies can be to the cluster or to specific namespaces. Then reduce

    unnecessary permissions in Kubernetes RBAC, service accounts, and Pod security

    controls so Pod creation is limited to approved deployment paths and the smallest

    practical workload boundary.

    • Remove or narrow access policy associations that allow Pod creation, and prefer

    namespace access over cluster scope wherever possible. If predefined access

    policies are still broader than required, use access entries with Kubernetes group

    assignments and custom RBAC to grant the exact permissions needed.

    • Replace broad RBAC permissions on pods, deployments, daemonsets,

    statefulsets, jobs, and cronjobs with the smallest Role or ClusterRole that

    supports the approved function.

    • Move workloads off the default service account, use dedicated service accounts,

    and disable automountServiceAccountToken where Kubernetes API access is

    not needed.

    • Tighten EKS Pod Identity permissions for any service account that can run Pods

    so the linked IAM role is least privilege and workload specific.

    • Restrict Pod specs that can increase the blast radius of Pod creation, including

    privileged mode, hostPath, and similar settings, by using Pod Security

    Admission or policy controls.

    • Review DaemonSet and other broadly deployed workloads first, because a

    service account used across many nodes can widen the impact of an over

    privileged Pod creator.

    • Remove stale legacy aws-auth mappings only where the cluster still uses

    API_AND_CONFIG_MAP so Pod creation is not still reachable through older group

    mappings in parallel with access entries.'
  checks:
  - type: manual_review
    info: 'Begin by reviewing every path that can grant the ability to create Pods in EKS Auto

      Mode. Start with access entries and associated access policies, because Auto Mode

      uses the EKS API access-entry model, and AmazonEKSAdminPolicy and

      AmazonEKSEditPolicy include create access for pods. Then review Kubernetes RBAC,

      service accounts, and Pod security controls, because Pod creation can allow an identity

      to launch workloads under available service accounts and potentially exercise both

      Kubernetes and A'
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: Default service accounts in EKS Auto Mode should not be used as the active identity for ordinary application
    or automation workloads. If a Pod does not specify a service account, Kubernetes automatically assigns the namespace default
    service account, and that account can authenticate to the Kubernetes API through its mounted token. Workloads that need
    Kubernetes or AWS access should instead use an explicitly assigned, dedicated service account that matches the intended
    namespace, application, and permission boundary.
  rationale: This supports least privilege at the workload identity layer by using a dedicated service account for each application,
    including workloads that need Kubernetes API access, or EKS Pod Identity. This allows RBAC and workload identity to be
    to the specific resources and actions required by each application, instead of sharing one namespace identity across unrelated
    Pods. The default service account is especially risky when Pods inherit it implicitly. In EKS, workloads are automatically
    assigned a service account if one is not specified, and service account tokens are automatically mounted unless token
    auto mounting is disabled. For workloads that need AWS access, EKS Pod Identity associates AWS permissions to a Kubernetes
    service account, so relying on the default account makes it harder to isolate AWS permissions cleanly and increases the
    chance that multiple workloads share the same Kubernetes and AWS identity path.
  impact: If the default service account is actively used in EKS Auto Mode, multiple Pods in the same namespace can inherit
    the same Kubernetes identity and any linked AWS permissions, which increases blast radius, weakens workload isolation,
    and reduces audit clarity when a Pod is compromised or misconfigured.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/cluster-auth.html
  page_start: 38
  audit_raw: "Begin by identifying workloads in EKS Auto Mode that implicitly or explicitly use the\nnamespace default service\
    \ account. This matters because Pods that do not specify\nserviceAccountName are assigned the default service account,\
    \ workloads that need\nAWS access should use a dedicated service account for EKS Pod Identity, and\nworkloads that do\
    \ not need Kubernetes API access can disable token auto mounting\nwith automountServiceAccountToken: false.\n• Review\
    \ Deployments, StatefulSets, DaemonSets, Jobs, CronJobs, and\nstandalone Pods for omitted serviceAccountName values or\
    \ explicit use of\ndefault.\nkubectl get deploy,sts,ds,job,cronjob,pod -A -o json | jq -r '\n  ([\"NAMESPACE\",\"KIND\"\
    ,\"NAME\",\"SERVICEACCOUNT\"] | @tsv),\n  (\n    .items[]\n    | if .kind==\"CronJob\" then\n        [.metadata.namespace,\
    \ .kind, .metadata.name,\n(.spec.jobTemplate.spec.template.spec.serviceAccountName // \"default\")]\n      elif .kind==\"\
    Pod\" then\n        [.metadata.namespace, .kind, .metadata.name,\n(.spec.serviceAccountName // \"default\")]\n      else\n\
    \        [.metadata.namespace, .kind, .metadata.name,\n(.spec.template.spec.serviceAccountName // \"default\")]\n    \
    \  end\n    | select(.[3]==\"default\")\n    | @tsv\n  )\n' | column -ts $'\\t'\nSample output:\nNAMESPACE    KIND   \
    \      NAME             SERVICEACCOUNT\nkube-public  Pod          file-check       default\ndefault      Deployment  \
    \ web-app          default\napps         StatefulSet  orders-db        default\nlogging      DaemonSet    fluentd    \
    \      default\nbatch        Job          nightly-report   default\n• Review the default service account in each namespace\
    \ and confirm it is not\nbound to unnecessary RoleBinding or ClusterRoleBinding permissions.\n• Review workload specs\
    \ and the referenced service accounts for\nautomountServiceAccountToken: false and confirm it is set wherever the\nworkload\
    \ does not need Kubernetes API access. Use the command below to find\nthe automountServiceAccountToken setting:\nkubectl\
    \ get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml\n• Review workloads that use EKS Pod Identity, and any remaining\
    \ IRSA\nconfigurations where already in use, and confirm they use a dedicated service\naccount rather than the namespace\
    \ default service account.\n• Flag any workload that still uses the default service account or still auto-mounts\ntokens\
    \ without a documented need for remediation."
  remediation: 'Create dedicated service accounts for workloads that need Kubernetes API access, or

    EKS Pod Identity, and update those workloads to explicitly set serviceAccountName

    rather than relying on the namespace default service account. For workloads that do

    not need Kubernetes API access, disable service account token auto mounting and

    avoid using the default service account as the active workload identity. Also review the

    default service account in each namespace and ensure it is not bound to unnecessary

    RBAC permissions.

    Modify the default service account in each application namespace to set:

    automountServiceAccountToken: false

    Then validate workload manifests, because a Pod automountServiceAccountToken

    setting can override the service account setting, and workloads that actually need

    Kubernetes API access must use an explicitly assigned service account instead of

    inheriting default. For workloads that need AWS access in EKS Auto Mode, use a

    dedicated service account with EKS Pod Identity rather than the namespace default

    service account.

    Automatic remediation for one namespace:

    kubectl patch `serviceaccount` default -n $NAMESPACE -p

    ''{"automountServiceAccountToken": false}'''
  checks:
  - type: manual_review
    info: 'Begin by identifying workloads in EKS Auto Mode that implicitly or explicitly use the

      namespace default service account. This matters because Pods that do not specify

      serviceAccountName are assigned the default service account, workloads that need

      AWS access should use a dedicated service account for EKS Pod Identity, and

      workloads that do not need Kubernetes API access can disable token auto mounting

      with automountServiceAccountToken: false.

      • Review Deployments, StatefulSets, DaemonSets, Jobs,'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Service account tokens in EKS Auto Mode should be mounted only for Pods that require Kubernetes API access
    or an explicitly configured workload identity flow. EKS supports disabling automatic token mounting at the Pod or ServiceAccount
    level, and workloads that need AWS access through EKS Pod Identity, or any remaining IRSA configuration, should use a
    dedicated service account rather than relying on broad default token mounting.
  rationale: 'This setting is important because a mounted service account token is an authentication credential. EKS documentation
    notes that Pods can authenticate to the Kubernetes API server with an auto mounted token, and AWS recommends setting automountServiceAccountToken:
    false for applications that do not need access to Kubernetes resources. EKS also allows this behavior to be controlled
    either on the Pod spec or on the ServiceAccount, which supports making token mounting an intentional workload decision
    instead of a default behavior. The risk is higher when workload identity is involved. With IRSA, a Pod uses a web identity
    token associated with a Kubernetes service account to obtain AWS credentials, and with EKS Pod Identity, an IAM role is
    associated to a Kubernetes service account and credentials are then made available to the workload. AWS also documents
    that projected service account tokens can be exposed from node compromise scenarios, and if the service account is associated
    with an IAM role through IRSA or EKS Pod Identity, an exposed token can be used to obtain AWS IAM credentials. In EKS
    Auto Mode, Pod Identity is the more current AWS workload identity pattern, but the underlying risk remains the same; unnecessary
    token mounts increase the number of Pods that can use Kubernetes credentials and, in some designs, become a path to AWS
    credentials as well.'
  impact: If service account tokens are mounted more broadly than necessary in EKS Auto Mode, more Pods than required receive
    credentials that can be used for Kubernetes API access and, in some cases, AWS IAM access, increasing the blast radius
    of a compromised or misconfigured workload. This weakens workload isolation and makes it harder to contain the effect
    of a Pod compromise to the intended service account boundary.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  page_start: 42
  audit_raw: 'Begin by reviewing where service account tokens are mounted in EKS Auto Mode and

    whether each mounted token supports a defined Kubernetes API or workload identity

    requirement. In EKS, Pods can receive a service account token automatically,

    automountServiceAccountToken can be disabled at the Pod or ServiceAccount

    level, and workloads that need AWS access through EKS Pod Identity, and any

    remaining IRSA configuration where already in use, should use a dedicated service

    account instead of broad default token mounting.

    • Review Deployments, StatefulSets, DaemonSets, Jobs, CronJobs, and

    standalone Pods for serviceAccountName and

    automountServiceAccountToken, and identify workloads that still rely on

    default token mounting.

    • Review the automountServiceAccountToken setting on both the Pod and its

    associated ServiceAccount, and treat the Pod setting as authoritative where

    both are defined.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml

    Expected Output:

    automountServiceAccountToken: false

    • Review workloads that use EKS Pod Identity, and any remaining IRSA

    configurations where already in use, and confirm they use a dedicated service

    account tied to the intended application and permission boundary.

    • Review RoleBindings and ClusterRoleBindings for service accounts that still

    mount tokens, and confirm the bound RBAC permissions are limited to the API

    resources and actions the workload actually needs.

    • Review DaemonSets, CSI drivers, and other broadly deployed Pods first,

    because service account permissions and projected tokens associated with

    those workloads can become reachable from any node where they run.

    • Review Pods that do not need Kubernetes API access and confirm token

    mounting is disabled, then flag any unnecessary token mount for remediation.'
  remediation: 'Apply the following steps to reduce unnecessary service account token mounting in

    EKS Auto Mode:

    • Set automountServiceAccountToken to false for Pods and ServiceAccounts

    that do not require Kubernetes API access. This reduces unnecessary default

    token auto mounting.

    • Update workloads to use a dedicated serviceAccountName only where a

    service account token is operationally required, instead of inheriting token

    behavior from the namespace default service account. Each application should

    use its own dedicated service account.

    • For workloads that need AWS access, use EKS Pod Identity, or any remaining

    IRSA configuration already approved for the cluster, with a dedicated service

    account rather than broad default token mounting. Both models associate AWS

    permissions to a Kubernetes service account for a specific workload boundary.

    • Revalidate workloads after the change to confirm that only Pods with a

    documented Kubernetes API or workload identity need continue to receive

    service account tokens. In EKS Auto Mode, you do not need to install the Pod

    Identity Agent separately because this capability is built in.'
  checks:
