    by applying the amazon-vpc-cni ConfigMap with enable-network-policy-controller: true in the kube-system namespace. This
    allows Kubernetes NetworkPolicy resources and supported EKS network policy capabilities to restrict pod traffic instead
    of leaving pod communication broadly open by default.'
  rationale: Kubernetes does not restrict pod IP addresses, ports, or connections by default, so workload-to-workload traffic
    remains broadly open unless network policies are configured and enforced. Standard Kubernetes NetworkPolicy resources
    can segment pod-to-pod traffic at Network and Transport layers, while EKS network policy capabilities can also support
    broader cluster controls. In EKS Auto Mode, customers should not frame this as managing the Amazon VPC CNI add-on version,
    aws-node DaemonSet, or traditional VPC CNI environment variables. Auto Mode manages the VPC CNI configuration, and networking
    behavior is customized through supported Auto Mode mechanisms such as the amazon-vpc-cni ConfigMap and NodeClass resources.
    After the Network Policy Controller is enabled, NodeClass can also be used to adjust network policy behavior, including
    default allow or default deny behavior and network policy event logging.
  impact: If the EKS Auto Mode Network Policy Controller is not enabled, Kubernetes NetworkPolicy resources will not provide
    the expected enforcement for pod traffic in Auto Mode, and workload segmentation may remain ineffective even if policy
    objects exist. This weakens namespace isolation, least privilege ingress and egress controls, and pod-to-pod traffic governance.
    Once enabled, network policy behavior should be validated with actual workload policies, because enabling the controller
    only provides enforcement capability. You still need NetworkPolicy or supported EKS network policy resources that select
    the intended pods and define allowed ingress or egress traffic. In Auto Mode, review related NodeClass settings because
    they can influence network policy behavior, including default allow or default deny posture and event logging.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-networking.html
