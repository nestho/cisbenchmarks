- id: 5.4.3
  title: Deploy EKS Auto Mode nodes only in private subnets
  scoring: manual
  profile:
  - Level 1
  description: This recommendation is about the EKS Auto Mode data plane, not the control plane. It means EKS Auto Mode nodes
    are placed only in private subnets and are not intended to have direct public internet exposure. In the common pattern,
    nodes run in private subnets while internet facing ingress resources are placed in public subnets. This changes where
    compute runs and how node traffic exits the VPC, but it does not by itself determine whether the Kubernetes API endpoint
    is public, private, or both. EKS supports public and private subnets, and private subnets are recommended where possible.
  rationale: EKS Auto Mode supports nodes and pods in public or private subnets, so private subnet placement is a deliberate
    architecture choice that should be enforced through subnet selection. EKS Auto Mode networking can be customized with
    a NodeClass, including subnetSelectorTerms, which control how nodes are placed across VPC subnets. A NodeClass can select
    private subnets by tag or subnet ID, and EKS Auto Mode creates nodes across the matching subnets. Placing EKS Auto Mode
    nodes in private subnets reduces direct internet reachability of the worker instances and gives tighter control over egress
    paths. Nodes still need access to required AWS services such as ECR for image pulls, CloudWatch, STS, S3, Elastic Load
    Balancing, and other services based on workload needs. That access should be provided through NAT gateways, egress only
    gateways for IPv6, or VPC endpoints where appropriate. In a fully private cluster design with no outbound internet path,
    private endpoint access and the required VPC endpoints must be planned so nodes and workloads can reach the services they
    depend on.
  impact: This reduces direct internet exposure of EKS Auto Mode nodes and usually improves traffic control around the data
    plane, but it increases dependency on subnet selection, route tables, NAT gateways, VPC endpoints, security groups, and
    private management paths such as SSM or internal administration hosts. It also does not automatically make the control
    plane private. A cluster can have private nodes and still expose a public Kubernetes API endpoint unless the endpoint
    settings are hardened separately. EKS Auto Mode also lets pod subnets differ from node subnets through podSubnetSelectorTerms,
    so node placement and pod traffic design should be reviewed together where separate pod networking is used.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-networking.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/create-node-class.html
  page_start: 150
  audit_raw: "Review the EKS Auto Mode NodePool and NodeClass configuration to confirm nodes\nare placed only in private subnets.\
