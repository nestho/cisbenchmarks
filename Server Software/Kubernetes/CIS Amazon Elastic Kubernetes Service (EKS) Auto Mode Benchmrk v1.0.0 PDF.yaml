    \ managed add-on\nversion checks, the aws-node DaemonSet, or legacy VPC CNI environment variables.\nThe Auto Mode specific\
    \ audit is to verify that the amazon-vpc-cni ConfigMap exists in\nthe kube-system namespace and that enable-network-policy-controller\
    \ is set to\ntrue.\nUse this command to check whether the Network Policy Controller is enabled:\nkubectl get configmap\
    \ amazon-vpc-cni -n kube-system \\\n  -o jsonpath='{.data.enable-network-policy-controller}' 2>/dev/null\n• The expected\
    \ value is true. If the command returns not-set or the ConfigMap\nis not found, Network Policy enforcement has not been\
    \ enabled for EKS Auto\nMode.\nIn addition, review the NodeClass network policy settings because EKS Auto Mode can\nuse\
    \ NodeClass to configure network policy behavior, including default allow, default\ndeny, and network policy event logging.\n\
    kubectl get nodeclass -o customcolumns=NAME:.metadata.name,NETWORK_POLICY:.spec.networkPolicy,EVENT_LOGS:.sp\nec.networkPolicyEventLogs\n\
    • This confirms whether any Auto Mode NodeClass resources define network\npolicy behavior that affects the nodes using\
    \ that class."
  remediation: "Enable Network Policy enforcement for EKS Auto Mode by applying or updating the\namazon-vpc-cni ConfigMap\
    \ in the kube-system namespace with enable-networkpolicy-controller: true. There is no separate EKS cluster update command\
    \ for\nthis setting in Auto Mode.\nCreate a file named enable-network-policy.yaml:\napiVersion: v1\nkind: ConfigMap\n\
    metadata:\n  name: amazon-vpc-cni\n  namespace: kube-system\ndata:\n  enable-network-policy-controller: \"true\"\nApply\
    \ the ConfigMap:\nkubectl apply -f enable-network-policy.yaml\nValidate the setting:\nkubectl get configmap amazon-vpc-cni\
    \ -n kube-system -o\njsonpath='{.data.enable-network-policy-controller}{\"\\n\"}'\n• After the controller is enabled,\
    \ apply the required Kubernetes NetworkPolicy\nresources or supported EKS network policy resources for the workloads that\n\
    need traffic restrictions. Enabling the controller provides enforcement capability,\nbut it does not create workload ingress\
    \ or egress policy rules by itself.\nIf required, configure NodeClass network policy behavior separately to set default\
    \ allow\nor default deny behavior and enable network policy event logging. EKS Auto Mode\nsupports these settings through\
    \ NodeClass, while CloudWatch export for network event\nlogs is not supported"
  checks:
  - type: manual_review
    info: 'Review the EKS Auto Mode Network Policy Controller configuration and verify that

      Network Policy enforcement is enabled for the cluster. In EKS Auto Mode, AWS

      manages the VPC CNI configuration, so the audit should not rely on managed add-on

      version checks, the aws-node DaemonSet, or legacy VPC CNI environment variables.

      The Auto Mode specific audit is to verify that the amazon-vpc-cni ConfigMap exists in

      the kube-system namespace and that enable-network-policy-controller is set to

      true.

      Use this '
    severity: medium
- id: 4.3.2
  title: Restrict workload traffic with Kubernetes Network Policies
  scoring: scored
  profile:
  - Level 1
  description: EKS Auto Mode supports Kubernetes NetworkPolicy resources for namespace Layer 3 and Layer 4 pod traffic isolation,
    and also supports broader EKS network policy capabilities such as ClusterNetworkPolicy and ApplicationNetworkPolicy where
    applicable. Workload isolation depends on the relevant workloads actually being covered by NetworkPolicy, ClusterNetworkPolicy,
    or other supported EKS network policy resources. NetworkPolicy provides namespace pod traffic segmentation, while ClusterNetworkPolicy
    can apply a common security posture across all or a selected subset of workloads in the cluster.
  rationale: Enabling the EKS Auto Mode Network Policy Controller only provides the enforcement capability. Traffic restrictions
    are not realized unless policies are defined for the workloads, namespaces, or cluster scopes that need them. Standard
    Kubernetes NetworkPolicy resources control traffic at Network and Transport layers, while ClusterNetworkPolicy can centralize
    controls across the cluster or selected namespaces. A least privilege approach should start with restrictive policies,
    such as deny by default controls, and then add explicit ingress and egress allow rules for required application flows.
    EKS evaluates Admin tier ClusterNetworkPolicy rules first, then namespace policies such as NetworkPolicy and ApplicationNetworkPolicy,
    then baseline policies, and finally deny by default behavior when no policies match.
  impact: If required workloads are not covered by Kubernetes network policies, their traffic remains effectively unsegmented
    even when Network Policy enforcement is enabled for EKS Auto Mode, which leaves unnecessary communication paths open.
    This can weaken namespace isolation, tenant separation, and least privilege ingress and egress controls.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-networking.html
  page_start: 94
  audit_raw: "Review the Kubernetes network policy in the EKS Auto Mode cluster and verify that\nevery required workload is\
    \ selected by either namespace NetworkPolicy,\nApplicationNetworkPolicy, or a cluster ClusterNetworkPolicy. A separate\
    \ policy\nin every namespace is not always required because ClusterNetworkPolicy can apply\nshared controls across all\
    \ workloads or selected namespaces, while namespace\npolicies can provide application segmentation. EKS Auto Mode supports\
    \ different\nnetwork policy types, including standard Kubernetes NetworkPolicy, DNS-based\npolicies, and cluster rules.\n\
    Confirm that Network Policy enforcement is set to true before reviewing policy\ncoverage.\nkubectl get configmap amazon-vpc-cni\
    \ -n kube-system \\\n  -o jsonpath='{.data.enable-network-policy-controller}{\"\\n\"}' 2>/dev/null\nIdentify all policy\
    \ objects intended to govern workload traffic:\nkubectl get networkpolicy -A\nkubectl get applicationnetworkpolicy -A\n\
    kubectl get clusternetworkpolicy\n• Map each required workload to the policy or policies that select it, and confirm no\n\
    required workload falls outside policy coverage. Review podSelector,\nnamespaceSelector, policy tiers, and ingress and\
    \ egress rules to confirm that\npolicies match the intended pods, namespaces, ports, protocols, and approved\ndestinations.\
    \ EKS evaluates Admin tier ClusterNetworkPolicy first, then\nnamespace ApplicationNetworkPolicy and NetworkPolicy, then\
    \ baseline\npolicies, and finally default deny behavior when no policies match.\n• Review selectors and ingress and egress\
    \ rules to confirm least privilege design.\nA strong pattern is to start with restrictive or deny by default policies,\
    \ then add\nexplicit allow rules for required flows such as DNS, approved service-to-service\ntraffic, and authorized\
    \ external endpoints.\n• Confirm that DNS-based policy rules are only used for workloads running on EKS\nAuto Mode-launched\
    \ EC2 instances. In mixed-mode clusters, verify that\nworkloads requiring DNS enforcement are scheduled onto Auto Mode\
    \ nodes.\n• Review standalone or unmanaged pods separately because AWS documents\nnetwork policy coverage considerations\
    \ for pods that are not part of a\nDeployment. Do not assume that the existence of policy objects means every\nworkload\
    \ is governed."
  remediation: 'Create and apply Kubernetes NetworkPolicy, ApplicationNetworkPolicy, or

    ClusterNetworkPolicy objects so every required workload is explicitly covered by

    policy. Use namespace NetworkPolicy for workload Network and Transport layer

    segmentation, use ApplicationNetworkPolicy when DNS egress filtering is required,

    and use ClusterNetworkPolicy when a shared security posture must apply across

    multiple namespaces or workload groups. EKS Auto Mode supports these network

    policy patterns for pod traffic isolation and centralized network access controls.

    • Set default deny and then add only the ingress and egress rules needed for

    approved traffic such as DNS, required service-to-service flows, and authorized

    external destinations. Use specific selectors and destinations rather than broad

    namespace, pod, IP, or domain patterns whenever possible.

    • If the policy uses DNS rules through ApplicationNetworkPolicy, schedule the

    affected workloads on EKS Auto Mode EC2 instances and validate that required

    DNS resolution and egress traffic still function as expected. DNS rules in

    ApplicationNetworkPolicy apply only to workloads running on EKS Auto

    Mode EC2 instances.

    • For shared cluster controls, define ClusterNetworkPolicy with the appropriate

    tier, priority, subject selectors, and action. Use Admin tier deny rules for controls

    that namespace teams should not be able to override, and use Pass or

    namespace policies where teams should manage lower level application traffic.

    After applying or updating policies, validate allowed and denied traffic paths with

    representative workloads.'
  checks:
  - type: manual_review
    info: 'Review the Kubernetes network policy in the EKS Auto Mode cluster and verify that

      every required workload is selected by either namespace NetworkPolicy,

      ApplicationNetworkPolicy, or a cluster ClusterNetworkPolicy. A separate policy

      in every namespace is not always required because ClusterNetworkPolicy can apply

      shared controls across all workloads or selected namespaces, while namespace

      policies can provide application segmentation. EKS Auto Mode supports different

      network policy types, includin'
    severity: medium
- id: 4.4.1
  title: Mount secrets as files instead of environment variables
  scoring: manual
  profile:
  - Level 1
  description: Secrets for EKS workloads are better exposed as mounted files than as environment variables. Kubernetes Secrets
    can be consumed either way, and AWS supports file delivery from AWS Secrets Manager and Parameter Store through the AWS
    Secrets and Configuration Provider with the Secrets Store CSI Driver. In EKS Auto Mode, AWS manages more of the underlying
    cluster infrastructure, but customers remain responsible for the security of the application containers and pods that
    consume secrets.
  rationale: Environment variable values can unintentionally appear in logs, while secrets mounted as volumes are instantiated
    as tmpfs volumes and are automatically removed from the node when the pod is deleted. Mounting secrets as files reduces
    accidental exposure through application logs, process inspection patterns, and configuration dumps that commonly include
    environment variables. File delivery also aligns with the AWS Secrets and Configuration Provider (ASCP) best practice,
    which mounts Secrets Manager and Parameter Store values into EKS Pods as files. With ASCP, access is controlled through
    pod identity or IAM roles for service accounts, and the SecretProviderClass defines which secrets are mounted and the
    file names used inside the pod.
  impact: Workloads that currently read secrets from environment variables may need manifest and application changes to consume
    secrets from mounted file paths instead, using Kubernetes secret volumes or the Secrets Store CSI Driver integration with
    AWS secrets stores. Applications may also need configuration changes for file permissions, mount paths, reload behavior,
    and secret rotation handling, especially when moving from static environment variables to mounted files.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/data-encryption-andsecrets-management.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/manage-secrets.html
  page_start: 99
  audit_raw: "Review workload manifests and identify any Pod, Deployment, DaemonSet, StatefulSet,\nJob, or CronJob that exposes\
    \ secrets through environment variables instead of\nmounted files. Check for both direct secret references through\nenv[].valueFrom.secretKeyRef\
    \ and bulk secret imports through\nenvFrom[].secretRef, because either pattern exposes secret data as environment\nvariables.\
    \ Prefer workloads that consume secrets through mounted Secret volumes or\nfile delivery from AWS secrets integrations\
    \ instead.\nEKS Auto Mode manages more of the underlying infrastructure, but customers remain\nresponsible for how application\
    \ pods consume secrets. EKS secret management\nguidance recommends volume mounts instead of environment variables because\n\
    environment variable values can unintentionally appear in logs, while mounted secret\nvolumes use tmpfs and are removed\
    \ when the pod is deleted.\nRun this command to list workloads that reference secrets through either environment\nvariable\
    \ pattern:\nkubectl get pod,deploy,ds,sts,job,cronjob -A -o json | jq -r '\n  .items[]\n  | select([.. | objects | (.env[]?.valueFrom.secretKeyRef?,\n\
    .envFrom[]?.secretRef?)] | any)\n  | \"\\(.metadata.namespace)\\t\\(.kind)/\\(.metadata.name)\"\n'\n• This command checks\
    \ pod specs and controller pod templates for secret values\nexposed through secretKeyRef or secretRef. Any output should\
    \ be reviewed\nas a finding unless there is a documented exception. No output means the\nreviewed workloads are not referencing\
    \ Kubernetes Secrets through environment\nvariables.\nWhere external secrets are used, also review SecretProviderClass\
    \ resources to\nconfirm secrets are mounted as files through the Secrets Store CSI Driver and AWS\nSecrets and Configuration\
    \ Provider. ASCP can mount Secrets Manager secrets and\nParameter Store parameters as files in EKS pods, and the SecretProviderClass\n\
    defines which secrets are mounted and the file names used inside the pod.\nkubectl get secretproviderclass -A\n• Note:\
    \ If this command returns the server doesn't have a resource type\n\"secretproviderclass\", the Secrets Store CSI Driver\
    \ CRD is not installed in\nthe cluster. In that case, the audit should focus on Kubernetes Secret volume\nmounts unless\
    \ the cluster is expected to use AWS Secrets Manager or\nParameter Store through ASCP."
  remediation: "Update workloads to consume secrets as mounted files instead of environment\nvariables. Replace env[].valueFrom.secretKeyRef\
    \ and envFrom[].secretRef\nusage with Kubernetes Secret volumes or the AWS Secrets and Configuration Provider\nwith the\
    \ Secrets Store CSI Driver, and then update the application to read the secret\nfrom the mounted file path. This reduces\
    \ the chance of secret values appearing in logs\nand aligns with the recommended file delivery pattern for EKS workloads.\n\
    For Kubernetes Secrets, mount the Secret as a volume and update the application\nconfiguration to read from the mounted\
    \ path rather than from environment variables.\nvolumes:\n  - name: app-secret\n    secret:\n      secretName: app-secret\n\
    containers:\n  - name: app\n    volumeMounts:\n      - name: app-secret\n        mountPath: /etc/secrets\n        readOnly:\
    \ true\n• For secrets stored in AWS Secrets Manager or Parameter Store, use the Secrets\nStore CSI Driver with ASCP to\
    \ mount the values as files in the pod. Use EKS\nPod Identity or IRSA to scope access to only the secrets required by\
    \ that\nworkload, and define the mounted objects and file names in a namespace\nSecretProviderClass.\nAfter the change,\
    \ redeploy the affected workloads and verify the application reads\nsecrets from the mounted file path. Include file permissions,\
    \ mount paths, application\nreload behavior, and rotation handling in validation because mounted files and\nenvironment\
    \ variables behave differently at runtime."
  checks:
  - type: manual_review
    info: 'Review workload manifests and identify any Pod, Deployment, DaemonSet, StatefulSet,

      Job, or CronJob that exposes secrets through environment variables instead of

      mounted files. Check for both direct secret references through

      env[].valueFrom.secretKeyRef and bulk secret imports through

      envFrom[].secretRef, because either pattern exposes secret data as environment

      variables. Prefer workloads that consume secrets through mounted Secret volumes or

      file delivery from AWS secrets integrations instead.'
    severity: medium
- id: 4.4.2
  title: Use external secret storage for sensitive values
  scoring: manual
  profile:
  - Level 1
  description: Use external secret storage to manage sensitive application values in AWS Secrets Manager or Systems Manager
    Parameter Store instead of relying only on native Kubernetes Secret objects. This approach lets EKS workloads consume
    secrets through integrations such as the AWS Secrets and Configuration Provider with the Secrets Store CSI Driver, while
    keeping secret lifecycle functions outside the cluster.
  rationale: Storing high value credentials outside Kubernetes reduces dependence on cluster Secret objects and shifts lifecycle
    functions such as encryption, access control, rotation, and audit to a dedicated secrets service. In EKS, Pods can retrieve
    secrets from Secrets Manager by using IAM access through EKS Pod Identity or IRSA, and the AWS Secrets and Configuration
    Provider can mount those values into Pods as files through the Secrets Store CSI Driver. This supports more granular secret
    to workload access control and reduces the need to distribute static secret values through Kubernetes manifests. This
    is also better aligned to rotation and centralized governance because Kubernetes does not automatically rotate secrets.
    External secret stores such as AWS Secrets Manager provide dedicated secret lifecycle management, while EKS workloads
    can retrieve only the values authorized for their workload identity.
  impact: Moving to external secret storage usually requires manifest and application changes so workloads fetch or mount
    secrets from Secrets Manager or Parameter Store instead of reading only Kubernetes Secret objects. It may also require
    EKS Pod Identity or IRSA permissions, Secrets Store CSI Driver components, ASCP configuration, and namespace-local SecretProviderClass
    resources.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/manage-secrets.html
  - 2. https://docs.aws.amazon.com/secretsmanager/latest/userguide/ascp-podidentity-integration.html
  page_start: 103
  audit_raw: "Audit the EKS Auto Mode cluster’s secrets architecture and verify that required\nworkloads use an external secrets\
    \ store such as AWS Secrets Manager or Systems\nManager Parameter Store instead of relying only on Kubernetes Secret objects.\
    \ The\naudit should confirm both the integration path and the workload access model, because\nexternal secret storage\
    \ in EKS commonly uses the AWS Secrets and Configuration\nProvider with the Secrets Store CSI Driver, plus pod IAM through\
    \ EKS Pod Identity or\nIRSA. EKS Auto Mode integrates with EKS Pod Identity, while ASCP can retrieve\nSecrets Manager\
    \ secrets or Parameter Store parameters for authorized workloads.\nIdentify Kubernetes Secrets that may need to move to\
    \ an external store.\nkubectl get secrets -A\n• Identify workloads that consume Kubernetes Secrets through environment\n\
    variables or mounted Kubernetes Secret volumes. These workloads should be\nreviewed to determine whether the secret should\
    \ remain as a Kubernetes Secret\nor be moved to Secrets Manager or Parameter Store.\nkubectl get pod,deploy,ds,sts,job,cronjob\
    \ -A -o json | jq -r '\n  .items[]\n  | select([.. | objects | (.env[]?.valueFrom.secretKeyRef?,\n.envFrom[]?.secretRef?,\
    \ .volumes[]?.secret?)] | any)\n  | \"\\(.metadata.namespace)\\t\\(.kind)/\\(.metadata.name)\"\n'\n• Confirm whether the\
    \ Secrets Store CSI Driver integration is present by checking\nfor SecretProviderClass resources. If the resource type\
    \ does not exist, the\ncluster is not currently using the Secrets Store CSI Driver pattern for external\nsecret mounts.\n\
    kubectl get secretproviderclass -A 2>/dev/null\n• Where SecretProviderClass resources exist, review them to confirm they\n\
    reference the intended Secrets Manager secrets or Parameter Store parameters,\nmount values as files, and use workload\
    \ specific access.\nkubectl get secretproviderclass -A -o yaml\n• Verify pod access is scoped through EKS Pod Identity\
    \ or IRSA so each workload\ncan retrieve only the secrets it is authorized to read. ASCP assumes the pod’s\nauthorized\
    \ IAM role and retrieves only the secrets permitted for that role.\n• Note: If SecretProviderClass is not recognized and\
    \ returns error: the\nserver doesn't have a resource type \"secretproviderclass\", then the\nSecrets Store CSI Driver\
    \ CRD is not installed, and the cluster is not using the\nSecretProviderClass pattern to mount external secrets from AWS\
    \ Secrets\nManager or Parameter Store."
  remediation: 'Use AWS Secrets Manager or Systems Manager Parameter Store as the primary store

    for application secrets. Update EKS workloads to retrieve those values through the

    AWS Secrets and Configuration Provider with the Secrets Store CSI Driver, using IAM

    through EKS Pod Identity or IRSA. This shifts encryption, access control, rotation, and

    auditing to AWS rather than leaving those functions primarily in cluster Secret objects.

    • Create the required secrets in AWS Secrets Manager or Parameter Store, and

    define least privilege IAM permissions so each workload identity can read only

    the specific secrets it requires.

    • Install and configure the Secrets Store CSI Driver and AWS Secrets and

    Configuration Provider if they are not already present.

    • Update workloads to mount external secrets through a namespace

    SecretProviderClass, and configure the application to read secrets from the

    mounted file path.

    • Use EKS Pod Identity where possible for Auto Mode workloads, or IRSA where

    that is the established access model.

    • Enable rotation, mount paths, file permissions, application reload behavior, and

    any CSI sync behavior that may create Kubernetes Secret objects.'
  checks:
  - type: command
    command: mount values as files, and use workload specific access.
    expected: Audit the EKS Auto Mode cluster’s secrets architecture and verify that required
    severity: medium
    info: 'Audit the EKS Auto Mode cluster’s secrets architecture and verify that required

      workloads use an external secrets store such as AWS Secrets Manager or Systems

      Manager Parameter Store instead of relying only on Kubernetes Secret objects. The

      audit should confirm both the integration path and the workload access model, because

      external secret storage in EKS commonly uses the AWS Secrets and Configur'
- id: 4.5.1
  title: Use dedicated namespaces to separate workload boundaries
  scoring: manual
  profile:
  - Level 1
  description: Namespaces create administrative boundaries in EKS by dividing a cluster into logical partitions for teams,
    applications, environments, or tenants. They are a core building block for soft multitenancy, and several controls used
    to separate workloads, including quotas, network policies, and service accounts, are defined to the namespace. In EKS
    Auto Mode, namespaces remain the primary Kubernetes boundary for organizing workload governance even though AWS manages
    more of the underlying compute, networking, and storage infrastructure.
  rationale: Namespaces matter because many access and governance controls in Kubernetes and EKS can be applied at that level.
    Kubernetes Roles and RoleBindings delegate permissions within a namespace, and EKS access policies can be one or more
    specific namespaces instead of the entire cluster. This allows platform administrators to grant access only to the namespaces
    that a group or workload owner is responsible for, rather than granting cluster permissions. In EKS Auto Mode, this remains
    important because customers are still responsible for application containers, workload access, and namespace governance.
    The namespace boundary becomes stronger when paired with additional controls. ResourceQuota and LimitRange can constrain
    CPU, memory, and object consumption, while NetworkPolicy resources can restrict pod-to-pod communication and support least
    privilege traffic controls between tenant or application namespaces. A namespace alone is only a logical grouping, so
    effective separation depends on pairing it with RBAC, access scoping, quotas, service accounts, and network isolation.
  impact: Creating administrative boundaries with namespaces usually requires teams to move workloads out of the default namespace
    and implement namespace specific RBAC, access scopes, quotas, and network policies. This improves delegation and organization,
    but namespaces by themselves do not provide full isolation. You may also need to update scripts, service accounts, access
    entries, NetworkPolicy resources, ResourceQuota objects, LimitRange defaults, and deployment automation so each workload
    is consistently placed in the correct namespace.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/tenant-isolation.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 107
  audit_raw: "Verify that namespaces are being used as intentional administrative boundaries for\ngroups, applications, or\
    \ environments in the EKS Auto Mode cluster. Namespaces\nshould be paired with scoped access controls and namespace governance\
    \ such as\nquotas, limits, service accounts, and network policies. In EKS Auto Mode, customers\nremain responsible for\
    \ application containers, workload access, and namespace\ngovernance even though AWS manages more of the underlying infrastructure.\n\
    • Confirm that namespaces have a defined administrative, application, or\nenvironment purpose, and verify that access\
    \ is scoped through namespace Role\nand RoleBinding objects instead of unnecessary cluster ClusterRole or\nClusterRoleBinding.\n\
    • Review EKS access entries and associated access policies to confirm IAM\nprincipals are scoped to specific namespaces\
    \ where appropriate. EKS access\npolicies can be scoped to specific Kubernetes namespaces or to the entire\ncluster.\n\
    aws eks list-access-entries \\\n  --cluster-name $CLUSTER_NAME \\\n  --output json\naws eks list-associated-access-policies\
    \ \\\n  --cluster-name $CLUSTER_NAME \\\n  --principal-arn $PRINCIPAL_ARN \\\n  --query 'associatedAccessPolicies[].{Policy:policyArn,Scope:accessScope}'\
    \ \\\n  --output json\n• Review whether namespace controls such as ResourceQuota, LimitRange,\nservice accounts, and network\
    \ policies are applied where required to support\nseparation, resource governance, and east/west traffic restrictions.\n\
    kubectl get resourcequota,limitrange,networkpolicy -A\nkubectl get serviceaccounts -A\n• Confirm that cluster access is\
    \ limited to identities that truly require it, because\nnamespaces provide logical separation but do not create a strong\
    \ security\nboundary by themselves. Use separate clusters or stronger isolation patterns\nwhen workloads are mutually\
    \ untrusted."
  remediation: 'Create dedicated namespaces for groups, applications, or environments that need

    separate administrative scope, and move workloads out of the default namespace.

    Strengthen each namespace boundary with targeted access, quotas, limits, service

    accounts, and network policies, and reduce cluster permissions that bypass the

    intended separation model. EKS Auto Mode manages more of the data plane

    infrastructure, but namespace design, workload placement, access control, and

    application governance remain customer responsibilities.

    Create dedicated namespaces for each group, application, or environment that needs

    its own administrative boundary.

    kubectl create namespace $NAMESPACE

    • Move user workloads out of the default namespace and into the appropriate

    managed namespace.

    • Rebind access with namespace Role and RoleBinding objects and, where

    used, scope EKS access policies to one or more specific namespaces instead of

    the whole cluster. AmazonEKSAdminPolicy is typically one or more namespaces,

    while AmazonEKSClusterAdminPolicy grants administrator access to the

    cluster.

    • Apply ResourceQuota, LimitRange, dedicated service accounts, and network

    policies to reinforce namespace governance and traffic separation.

    • Remove unused namespaces and reduce unnecessary ClusterRoleBinding,

    cluster access policy, or access entry assignments that bypass the intended

    namespace boundary.

    When stronger isolation is required for mutually untrusted workloads, use separate

    clusters or stronger isolation patterns rather than relying on namespaces alone. AWS

    states that namespace based soft multitenancy provides logical separation, while the

    cluster is the stronger security boundary.'
  checks:
  - type: manual_review
    info: 'Verify that namespaces are being used as intentional administrative boundaries for

      groups, applications, or environments in the EKS Auto Mode cluster. Namespaces

      should be paired with scoped access controls and namespace governance such as

      quotas, limits, service accounts, and network policies. In EKS Auto Mode, customers

      remain responsible for application containers, workload access, and namespace

      governance even though AWS manages more of the underlying infrastructure.

      • Confirm that namespace'
    severity: medium
- id: 4.5.2
  title: Avoid deploying workloads in the default namespace
  scoring: scored
  profile:
  - Level 1
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended group, application, environment, or tenant boundary. In EKS, namespaces are the primary logical
    partition for organizing workloads and supporting soft multitenancy in a shared cluster. In EKS Auto Mode, this remains
    important because AWS manages more of the underlying infrastructure, but customers still manage workload placement, access
    control, and application governance.
  rationale: Least privilege administration in EKS depends on using namespaces as intentional boundaries. Kubernetes Role
    and RoleBinding objects apply within namespaces, and EKS access policies can be limited to one or more specific namespaces
    instead of the whole cluster. When workloads remain in default, access delegation, ownership boundaries, and namespace
    based governance become harder to separate cleanly. Dedicated namespaces also make it easier to apply supporting controls
    such as ResourceQuota, LimitRange, service accounts, and network policies to the correct workloads. EKS tenant isolation
    guidance describes namespaces, RBAC, quotas, limit ranges, and network policies used to create logical separation, while
    EKS Auto Mode network policy capabilities can isolate tenants at the namespace.
  impact: Using the default namespace for application workloads weakens administrative separation and makes namespace based
    access control, resource governance, and network segmentation harder to apply consistently. Remediation may require moving
    manifests, updating service account references, revising EKS access policy associations, applying namespace specific quotas
    and limits, and validating network policies after workloads are redeployed into dedicated namespaces.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/best-practices/tenant-isolation.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  page_start: 111
  audit_raw: 'Review the EKS Auto Mode cluster and verify that the default namespace is not being

    used for routine application workload placement. Objects that do not explicitly specify a

    namespace are created in default, so the audit should confirm that groups, applications,

    and environments use dedicated namespaces aligned to access control, quotas, limits,

    service accounts, and network policies. AWS identifies namespaces as a fundamental

    construct for soft multi-tenancy, with quotas, network policies, service accounts, and

    related objects used to support logical separation.

    Inventory the default namespace and identify user managed Pods, Services,

    ConfigMaps, Secrets, ServiceAccounts, Deployments, StatefulSets, DaemonSets, Jobs,

    CronJobs, Ingresses, Roles, RoleBindings, ResourceQuotas, LimitRanges, or

    NetworkPolicies that still exist there.

    kubectl get

    pod,svc,configmap,secret,serviceaccount,deploy,statefulset,daemonset,job,cron

    job,ingress,role,rolebinding,resourcequota,limitrange,networkpolicy -n

    default

    • Review whether any application workloads, application secrets, application

    ConfigMaps, custom service accounts, or workload access bindings remain in

    default. System generated or temporary objects should be reviewed separately

    from normal application resources.

    • Verify that access is not centered on default. Review Kubernetes Role and

    RoleBinding assignments for that namespace and, where EKS access entries

    are used, confirm that access policies are limited to the intended namespaces

    rather than applied across the entire cluster. EKS access policies support both

