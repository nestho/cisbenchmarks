- id: 5.4.2
  title: Enable private only EKS API access and disable public endpoint access
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is the strict private only version of API endpoint hardening. The intended end state is
    that the EKS Kubernetes API server endpoint is reachable only from inside the cluster VPC or from a connected private
    network, and there is no internet reachable public API endpoint. This is a Kubernetes API exposure decision, not an EKS
    Auto Mode workload networking setting. EKS supports enabling private endpoint access and completely disabling public endpoint
    access for the Kubernetes API server.
  rationale: In EKS, disabling public access requires private access to be enabled. In that configuration, all traffic to
    the Kubernetes API server must come from within the cluster VPC or from a connected private network path, and kubectl
    access from the internet is not available. The private endpoint is controlled by the cluster security group, while publicAccessCidrs
    becomes irrelevant because there is no public endpoint to filter. The cluster endpoint resolves to private IP addresses
    for private only access, and administration from outside the VPC must use private connectivity such as VPN, Transit Gateway,
    Direct Connect, or a managed host inside the VPC.
  impact: This recommendation reduces direct internet exposure of the EKS Kubernetes API server endpoint, but it requires
    deliberate private connectivity for administrators, automation, and external systems that need Kubernetes API access.
    If that private access path is missing or incomplete, cluster operations, troubleshooting, and deployment tooling can
    be blocked even though the cluster itself is healthy. EKS Auto Mode automates several data plane functions for compute,
    storage, and networking, but API endpoint access remains a cluster endpoint configuration setting.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/config-cluster-endpoint.html
  page_start: 147
  audit_raw: "Verify that the EKS Kubernetes API server endpoint is configured for private only\naccess. Private endpoint\
