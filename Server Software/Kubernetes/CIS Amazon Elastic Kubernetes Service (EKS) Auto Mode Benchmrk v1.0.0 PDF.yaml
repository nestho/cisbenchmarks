- id: 5.2.1
  title: Use dedicated service accounts for EKS Auto Mode workload identities
  scoring: scored
  profile:
  - Level 1
  description: Using dedicated Kubernetes service accounts for EKS Auto Mode workload identities helps isolate AWS permissions
    by application, job, or trust boundary instead of sharing a single identity across multiple workloads. This supports more
    controlled access to AWS services and reduces the blast radius if one workload is compromised or misconfigured. EKS Auto
    Mode includes the EKS Pod Identity Agent, so workload identities can be managed through service account to IAM role associations
    without separately installing the agent.
  rationale: A workload that needs AWS access should run with a dedicated Kubernetes service account associated with an IAM
    role through EKS Pod Identity, or through IRSA where that model is already in use. With EKS Pod Identity, each Kubernetes
    service account can be associated with one IAM role in the same AWS account as the cluster, and pods using that service
    account receive temporary credentials through the EKS Pod Identity Agent and EKS Auth API. The IAM role trust policy uses
    the pods.eks.amazonaws.com service principal and can be restricted with conditions based on cluster, namespace, and service
    account context. Using a dedicated service account per workload or permission boundary prevents unrelated pods in the
    same namespace from sharing the same AWS access. This is stronger than relying on the namespace default service account
    or reusing one service account across unrelated applications, because only pods explicitly configured to use the associated
    service account receive the IAM permissions assigned to that role. For IRSA, the same isolation concept applies through
    an IAM role associated with a Kubernetes service account and the pod’s AWS credential provider chain.
  impact: This improves permission isolation and auditing, but it increases the number of Kubernetes service accounts, IAM
    roles, trust relationships, and Pod Identity or IRSA associations that must be created and maintained. If a pod is left
    on the namespace default service account, references the wrong service account, or uses credentials earlier in the AWS
    credential provider chain, it may fail to access required AWS resources or run with a broader identity than intended.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/automode.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
  page_start: 133
  audit_raw: "Review workloads to confirm applications use dedicated Kubernetes service accounts\ninstead of the namespace\
    \ default service account. Verify the default service account\nhas no workload specific RoleBindings or ClusterRoleBindings,\
    \ disable token\nautomounting where Kubernetes API access is not needed, and confirm workloads\nthat need AWS access use\
    \ the intended IAM role through EKS Pod Identity or IRSA.\nEKS Auto Mode includes the EKS Pod Identity Agent by default.\n\
    Review namespace default service accounts and workload manifests to confirm\napplications use dedicated serviceAccountName\
    \ values where Kubernetes API or\nAWS access is required. Confirm the default service account has no workload specific\n\
    RoleBindings or ClusterRoleBindings, and set automountServiceAccountToken:\nfalse only where the workload does not need\
    \ Kubernetes API access.\nCheck pods for an explicit service account setting:\nkubectl get pods -A \\\n  -o customcolumns='NAMESPACE:.metadata.namespace,POD:.metadata.name,SERVICEACCOUNT:.spe\n\
    c.serviceAccountName,AUTOMOUNT:.spec.automountServiceAccountToken'\nCheck the default service account in each namespace:\n\
    kubectl get sa -A \\\n  -o customcolumns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,AUTOMOUNT:.automou\nntServiceAccountToken'\
    \ | grep ' default '\nFor any service account that needs closer review, inspect the service account directly\nand confirm\
    \ automountServiceAccountToken is set appropriately. For the namespace\ndefault service account, a value of false is preferred\
    \ when workloads do not need\nKubernetes API access.\nkubectl get serviceaccounts/$SERVICE_ACCOUNT \\\n  -n $NAMESPACE\
    \ \\\n  -o json\n• Expected output: JSON showing the service account name, namespace, and\nautomountServiceAccountToken\
    \ settings. Confirm the service account is\ndedicated to the intended workload and does not automatically mount tokens\n\
    unless Kubernetes API access is required\nFor workloads that access AWS services, verify the dedicated service account\
    \ is\nassociated with the intended IAM role through EKS Pod Identity. Where IRSA is still\nused, confirm the service account\
    \ annotation and IAM trust policy match the intended\nnamespace, service account, and OIDC provider.\naws eks list-pod-identity-associations\
    \ \\\n  --cluster-name $CLUSTER_NAME \\\n  --region $REGION_CODE\n• Expected output: a list of Pod Identity associations\
    \ for the cluster. Review the\nreturned namespace and service account values to confirm expected\nassociations exist.\
