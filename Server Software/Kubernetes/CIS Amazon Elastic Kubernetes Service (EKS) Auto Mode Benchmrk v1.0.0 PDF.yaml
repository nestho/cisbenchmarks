- id: 4.1.10
  title: Grant nodes/proxy access only to approved identities that require node-level access
  scoring: manual
  profile:
  - Level 1
  description: Access to the nodes/proxy subresource in EKS Auto Mode should be limited to identities with a documented node
    administration or troubleshooting need. This review should cover custom Role and ClusterRole rules, RoleBinding and ClusterRoleBinding
    assignments, and any service accounts that receive node subresource access. In EKS, access entries are the preferred way
    to grant IAM principals access to the Kubernetes API, while custom native RBAC remains the path for permissions that require
    Kubernetes groups and RBAC objects because they are not covered by predefined EKS access policies, which is where sensitive
    node subresource access is typically introduced.
  rationale: This control is important because nodes/proxy is a node permission, not an ordinary namespace workload permission.
    In EKS, nodes run operational components such as the kubelet daemon and the kube-proxy add-on, and cluster components
    and add-ons can rely on RBAC to function. Since predefined EKS access policies don’t cover every custom permission need,
    organizations that use Kubernetes groups on access entries or bind service accounts to custom RBAC objects can still introduce
    sensitive node subresource permissions through native Kubernetes authorization. That makes nodes/proxy access a custom
    RBAC permission path that should be reviewed separately from standard access-policy assignments. The risk is higher when
    these permissions are assigned to broadly deployed service accounts. DaemonSet Pods run on every node in the cluster,
    and their service account tokens and RBAC permissions are present on every node. An unauthorized process on a node may
    be able to access service account tokens from other Pods on that node, including DaemonSet Pods. EKS control plane logging
    records API server, audit, and authenticator activity from the control plane, so keeping node-proxy access tightly defined
    helps preserve a clearer boundary between routine cluster API access and privileged node operations.
  impact: If nodes/proxy access is granted too broadly in EKS Auto Mode, a user or service account can gain an unnecessary
    node access path that weakens separation between namespace operations and node administration. When those permissions
    are tied to broadly deployed service accounts, the blast radius can extend across many nodes and make unintended access
    harder to review, contain, and recover from. This also makes node activity harder to distinguish from routine cluster
    access during investigation and response.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/create-k8s-group-accessentry.html
  page_start: 56
  audit_raw: "Review EKS Auto Mode custom Kubernetes RBAC to identify custom Role and\nClusterRole objects that grant access\
