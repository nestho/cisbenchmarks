  description: 'Require workload containers to set securityContext.allowPrivilegeEscalation: false in EKS Auto Mode workload
    namespaces so container processes cannot gain more privileges than their parent process. In EKS, Pod Security Standards
    can be applied through Pod Security Admission or a policy engine, and the restricted profile is the relevant profile for
    this control because it requires containers to set securityContext.allowPrivilegeEscalation=false. EKS Auto Mode now manages
    more of the underlying infrastructure, but customers remain responsible for the security of application containers and
    pods deployed on Auto Mode managed instances. This setting complements privileged container restrictions, but privileged
    containers require separate enforcement because they receive broad host Linux capabilities.'
  rationale: 'Pod specification settings can strengthen or weaken the cluster security posture, and a primary concern is preventing
    a process running in a container from escaping container runtime isolation and gaining access to the underlying host.
    Privilege escalation allows a process to change the security context under which it runs, including patterns such as sudo
    or binaries with the SUID or SGID bit. Setting securityContext.allowPrivilegeEscalation: false reduces the ability of
    a compromised container process to gain additional privileges inside the container execution context. Enforcing the restricted
    Pod Security Standard helps reject pod specifications that do not explicitly set allowPrivilegeEscalation=false before
    those pods are created.'
  impact: 'In namespaces enforcing the restricted Pod Security Standard, containers that do not set securityContext.allowPrivilegeEscalation:
    false can be denied at admission, so workloads that rely on privilege changing behavior may need manifest updates, image
    changes, or a defined exception path. Warn and audit modes can identify violations during rollout, but only enforce mode
    blocks noncompliant pod creation. Pods with regular containers, init containers, or ephemeral containers that set securityContext.allowPrivilegeEscalation:
    true, or omit the required false value under the restricted profile, will not be permitted unless they are handled through
    an approved policy exception.'
