  remediation: "Enable private endpoint access and disable public endpoint access for the EKS\nKubernetes API server. This\
    \ removes direct internet reachability to the public API\nendpoint and requires cluster administration through the cluster\
    \ VPC or a connected\nprivate network such as VPN, Transit Gateway, Direct Connect, or an approved\nmanagement host inside\
    \ the VPC. EKS allows public and private endpoint access to be\nconfigured separately, and the default for new clusters\
    \ is public access enabled with\nprivate access disabled.\nBefore applying this change, confirm that administrators, CI/CD\
    \ runners, and\noperational tooling can reach the Kubernetes API through the private access path.\naws eks update-cluster-config\
    \ \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --resources-vpc-config\nendpointPrivateAccess=true,endpointPublicAccess=false\n\
    • After the update completes, rerun the audit command and confirm\nendpointPrivateAccess is true and endpointPublicAccess\
    \ is false. EKS\nAuto Mode automates several pod and service networking functions, but\nKubernetes API endpoint access\
    \ remains a cluster endpoint configuration\nsetting."
