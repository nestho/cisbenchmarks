- id: 4.1.11
  title: Restrict webhook configuration access to approved identities
  scoring: manual
  profile:
  - Level 1
  description: Access to ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects in EKS Auto Mode should be
    limited to tightly controlled cluster administrative identities. These objects define admission webhooks that intercept
    Kubernetes API requests before they are accepted, and they apply at cluster scope rather than namespace scope. Write access
    to them should not be broadly granted to general users, namespace operators, CI/CD identities, or workload service accounts.
  rationale: This setting matters because admission webhooks sit directly in the API request path. The EKS control plane page
    explains that validating and mutating webhooks can inspect or change objects before they are accepted, and it also states
    that poor webhook configuration can destabilize the control plane by blocking cluster operations. The workloads page adds
    that dynamic admission webhooks are invoked in sequence for API requests, each webhook has a default timeout of 10 seconds,
    and multiple or slow webhooks can increase request latency. In EKS Auto Mode, this access should be treated as a tightly
    controlled cluster permission because it affects cluster admission behavior rather than namespace workload administration.
    The risk is amplified because these configuration objects control where admission callbacks are sent and how broadly they
    apply. The control plane page calls out catchall webhook patterns that match all API groups, versions, operations, resources,
    and scopes as something to avoid, and it recommends a fail open policy with a timeout shorter than 30 seconds when availability
    risk must be reduced. The access policy permissions page also shows that when predefined access policies do not meet a
    requirement, authorization falls back to native Kubernetes RBAC through group mappings, which is where broad write access
    to webhook configuration objects can be introduced for users or service accounts.
  impact: If access to webhook configuration objects is granted too broadly in EKS Auto Mode, a user or service account can
    change how cluster API requests are validated or mutated, which can reject requests, alter admitted resources, increase
    API latency, and in poorly designed cases interfere with cluster operations. Mutating webhooks can also increase etcd
    churn by creating additional stored resource versions during repeated mutations, which raises the operational impact of
    overprivileged access. This also makes admission behavior harder to review and troubleshoot because cluster request handling
    can change outside the expected administrative path.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-auth.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  page_start: 61
  audit_raw: 'Audit this control by identifying who can manage cluster

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration

    resources, and confirm that webhook definitions are limited to approved admission use

    cases in EKS Auto Mode. Review whether cluster access is managed through access

    entries and associated access policies or through Kubernetes groups and native RBAC,

    because EKS access entries are the primary cluster access model and Kubernetes

    group authorization still depends on manually managed Role, ClusterRole,

    RoleBinding, and ClusterRoleBinding objects. Confirm that webhook configurations

    exist only where operationally required, that their rules and scope are narrowly defined,

    and that write access to manage them is restricted to tightly controlled administrative

    identities. Admission webhooks sit directly in the API request path, and broad or

    unhealthy webhook configurations can increase API latency or interfere with cluster

    operations.

    • Identify whether cluster access is governed through access entries and

    associated access policies, through Kubernetes groups and native RBAC, or

    through a mixed model.

    • Review cluster roles for permissions on validatingwebhookconfigurations

    and mutatingwebhookconfigurations, and trace those permissions through

    bindings to the exact users, groups, and service accounts that receive them.

    • Review existing webhook configurations to confirm their rules, selectors, and

    scope are narrowly defined and not written as broad catch all configurations that

    match all resources or operations.

    • Review any service accounts that can modify webhook configuration objects,

    especially broadly deployed components, because node or widely deployed

    service account permissions increase the reach of a compromised workload. If

    the cluster still uses API_AND_CONFIG_MAP, also review any remaining aws-auth

    mappings, because legacy group mappings can still provide access through

    native RBAC until migration is complete.

    This command lists all validating and mutating webhook configuration objects in the

    cluster so they can be reviewed for presence and expected use:

    kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o

    wide

    Also review the RBAC path that grants write access to these resources, because

    access entries can use Kubernetes groups and those groups rely on manually managed

    RBAC objects.'
  remediation: 'Remove permission to create, update, patch, or delete

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects

    from broad ClusterRole and Role assignments, and rebind that access only to tightly

    controlled cluster identities. In EKS, use access entries and associated access policies

    for standard cluster access wherever possible, and reserve native Kubernetes RBAC for

    cases where the predefined access policies do not meet the requirement. Keep

    webhook configuration management limited to a small set of approved administrative

    identities, because these objects sit directly in the admission path and operate at cluster

    scope. For EKS Auto Mode, treat this as a cluster administrative permission and do not

    leave it reachable through broad Kubernetes group mappings or legacy ConfigMap

    access paths.

    • Remove create, update, patch, and delete permissions on

    validatingwebhookconfigurations and mutatingwebhookconfigurations

    from broad custom ClusterRole and Role assignments.

    • Rebind any remaining webhook management access only to dedicated platform

    admin identities, and keep the scope and ownership of each assignment

    documented.

    • Review access entries that use Kubernetes groups, and remove or narrow any

    group mapping that reaches RBAC roles with webhook configuration write

    access.

    • Remove webhook configuration management rights from workload service

    accounts, CI/CD identities, and broadly deployed components unless there is a

    defined and approved operational need.

    • Review each existing webhook configuration and narrow its rules,

    namespaceSelector, objectSelector, and failure behavior so it applies only to

    the required namespaces, resources, and operations. Avoid broad patterns, and

    where availability risk must be reduced, use a fail to open policy with a timeout

    shorter than 30 seconds.

    • If the cluster still uses API_AND_CONFIG_MAP, remove any remaining aws-auth

    mappings that place IAM principals into Kubernetes groups bound to webhook

    configuration write access.

    • Revalidate admission behavior after the change to confirm required controllers

    still function and that webhook scope is not broad enough to increase API latency

    or interfere with cluster operations.'
  checks:
  - type: manual_review
    info: 'Audit this control by identifying who can manage cluster

      ValidatingWebhookConfiguration and MutatingWebhookConfiguration

      resources, and confirm that webhook definitions are limited to approved admission use

      cases in EKS Auto Mode. Review whether cluster access is managed through access

      entries and associated access policies or through Kubernetes groups and native RBAC,

      because EKS access entries are the primary cluster access model and Kubernetes

      group authorization still depends on manually man'
    severity: medium
- id: 4.1.12
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1
  description: Access to service account token creation in EKS Auto Mode should be limited to tightly controlled administrative
    or platform identities. Service accounts are a core Kubernetes identity type in EKS, projected service account tokens
    are used by workloads to authenticate, and Pods that do not need Kubernetes API access can avoid unnecessary token exposure
    by disabling automatic token mounting. Permission to request or create service account tokens should not be broadly granted
    to namespace operators, CI/CD identities, or general workload service accounts.
  rationale: This setting is important because a service account token is an authentication credential. In EKS, the BoundServiceAccountTokenVolume
    feature is enabled by default, which allows workloads to request JSON web tokens that are audience, time, and key, with
    a one hour expiration. EKS also supports projected service account tokens for authentication flows such as IRSA, where
    a Pod uses a web identity token associated with a Kubernetes service account to obtain AWS credentials through AssumeRoleWithWebIdentity.
    The risk increases when token creation is available to identities that do not need it. A Pod can authenticate to the Kubernetes
    API with an auto-mounted token, exposed tokens on a node can be accessed by unauthorized processes, and for workloads
    tied to EKS Pod Identity, or any remaining IRSA configuration already in use, token exposure can extend beyond Kubernetes
    RBAC into AWS IAM credentials. Keeping token creation tightly scoped reduces the number of identities that can mint usable
    service account credentials and strengthens the service account as a deliberate workload boundary instead of a broadly
    reusable access path.
  impact: If service account token creation is granted too broadly in EKS Auto Mode, a compromised user or service account
    can mint valid tokens for targeted service accounts and authenticate with the Kubernetes permissions of those identities.
    When the targeted service account is also tied to EKS Pod Identity, or any remaining IRSA configuration already in use,
    that token path can also lead to AWS credentials, increasing the blast radius beyond the cluster.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-accessmanagement.html
  page_start: 65
  audit_raw: 'Begin by confirming that service account token creation in EKS Auto Mode is limited to

    identities with an approved administrative or workload identity need. Review token

    issuance through native Kubernetes RBAC, not through access entries, because

    access entries govern IAM principal access to the Kubernetes API while service

    account tokens remain Kubernetes credentials used by workloads and service

    accounts. Also confirm that token use aligns with expected Kubernetes API access,

    EKS Pod Identity, and any remaining IRSA configuration already in use, rather than ad

    hoc credential minting.

    • Review Role and ClusterRole objects for permission to create the

    serviceaccounts/token subresource or any equivalent token issuance path.

    • Trace those permissions through RoleBinding and ClusterRoleBinding

    assignments to the exact users, groups, and service accounts that inherit them.

    • Give extra scrutiny to DaemonSet and other broadly deployed service accounts,

    because their tokens and RBAC permissions are present on every node where

    those Pods run.

    • Confirm each assignee has a documented need for token issuance, and that the

    permission is not exposed through broad custom roles, CI/CD identities, default

    service accounts, or general workload service accounts.

    • Validate that current token use matches expected workload identity behavior

    such as Kubernetes API access, EKS Pod Identity, or any remaining IRSA use

    on the cluster. For IRSA, the projected service account token is the web identity

    token used for AssumeRoleWithWebIdentity.

    • Flag any unnecessary token creation path for remediation, especially where

    Pods could mount tokens by default without a defined operational need. Also

    review workloads and service accounts with automountServiceAccountToken

    enabled, because unnecessary default token mounting can widen the impact of

    any token creation permission that remains.'
  remediation: 'Review all Role and ClusterRole definitions for access to the

    serviceaccounts/token subresource, and remove that permission from any user,

    group, CI/CD identity, or workload service account that does not have a documented

    operational requirement. In EKS, service account token issuance remains a Kubernetes

    RBAC concern, while IAM principal access to the Kubernetes API is managed

    separately through access entries and associated access policies. Token creation rights

    should remain limited to tightly controlled administrative or platform identities, because

    projected service account tokens are usable Kubernetes credentials and can also

    participate in workload identity flows such as EKS Pod Identity, or any remaining IRSA

    configuration already in use.

    • Review Role and ClusterRole objects for access to serviceaccounts/token,

    and remove that permission from broad operational roles, CI/CD identities,

    default service accounts, and general workload service accounts.

    • Reassign token creation rights only to approved administrative or platform

    identities with a documented need to issue service account tokens.

    • Validate that required workload identity flows still function correctly for Pods that

    use projected service account tokens, including EKS Pod Identity and any

    approved IRSA configuration still present on the cluster.

    • Recheck RoleBinding and ClusterRoleBinding assignments to confirm no

    unintended user, group, or service account still inherits token creation rights.

    Give extra scrutiny to broadly deployed service accounts such as DaemonSets

    because their tokens and permissions are present on every node where those

    Pods run.

    • Where workloads do not need Kubernetes API access, disable

    automountServiceAccountToken at the Pod or ServiceAccount so remaining

    token creation rights cannot be combined with unnecessary default token

    exposure.'
  checks:
  - type: manual_review
    info: 'Begin by confirming that service account token creation in EKS Auto Mode is limited to

      identities with an approved administrative or workload identity need. Review token

      issuance through native Kubernetes RBAC, not through access entries, because

      access entries govern IAM principal access to the Kubernetes API while service

      account tokens remain Kubernetes credentials used by workloads and service

      accounts. Also confirm that token use aligns with expected Kubernetes API access,

      EKS Pod Identity,'
    severity: medium
- id: 4.2.1
  title: Prevent workloads from running privileged containers
  scoring: scored
  profile:
  - Level 1
  description: 'Prevent application workloads from running privileged containers in EKS Auto Mode by enforcing Pod Security
    Standards through Pod Security Admission or an equivalent admission policy engine. Restrict privileged workloads to only
    approved system or platform namespaces with a documented operational requirement. EKS Auto Mode automates node lifecycle,
    patching, and several infrastructure controls, but workload pod security still needs to be enforced through Kubernetes
    admission controls and namespace policy. Configure containers to run with securityContext.privileged: false in EKS clusters,
    with exceptions limited to narrowly approved system or platform workloads.'
  rationale: In EKS, a privileged container inherits all Linux capabilities associated with root on the host, which significantly
    weakens container isolation and increases the chance that a compromised workload can interact with the underlying node
    in unsafe ways. This is especially important in EKS Auto Mode because customers still retain responsibility for securing
    workloads, even though Auto Mode manages the node operating system, container runtime, patching, and certain controllers.
    Pod Security Standards and Pod Security Admission provide a built-in Kubernetes approach for validating pod specifications
    before they are persisted. Enforcing the baseline or restricted profile helps reject pods that request privileged execution,
    including privileged settings in regular containers, init containers, and ephemeral containers. This prevents high risk
    pod configurations from being admitted instead of relying only on runtime detection after the pod starts. If privileged
    containers are required, handle them as a formal exception through a separate namespace or admission policy, limit who
    can deploy them through Kubernetes RBAC and EKS access controls, and periodically verify that only approved platform identities
    can create those workloads.
  impact: 'Workloads that depend on privileged mode may be denied admission in namespaces enforcing Pod Security Standards,
    so certain node agents, device access workloads, or other specialized platform pods may need redesign, tighter scoping,
    or isolated placement. In EKS Auto Mode, this may also affect troubleshooting or platform operations that attempt host
    access, since Auto Mode nodes restrict direct instance access and operational access is performed through AWS and Kubernetes
    APIs. Pods in namespaces enforcing the baseline or restricted Pod Security Standard should set securityContext.privileged:
    false for regular containers, init containers, and ephemeral containers. Existing pods are not automatically updated when
    a namespace is relabeled, so remediation should include redeploying or replacing any previously admitted workloads that
    do not explicitly run with privileged mode disabled.'
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-security.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/automode.html
  page_start: 69
  audit_raw: "Review the Pod Security Admission labels for every namespace in the EKS Auto Mode\ncluster and verify that workload\
    \ namespaces are set to a profile that prevents privileged\ncontainers from being admitted. EKS Auto Mode manages more\
    \ of the underlying\ncompute infrastructure, but customers remain responsible for the security of application\ncontainers\
    \ and pods, so namespace pod security controls still need to be validated.\nCheck namespace Pod Security Admission labels.\
    \ Workload namespaces should not\nbe unlabeled, should not enforce the privileged profile, and should not rely only on\n\
    warn or audit where blocking is required. The EKS pod security documentation\ndescribes enforce as the mode that prevents\
    \ violating pods from being created, while\nwarn and audit only surface violations without blocking admission.\nkubectl\
    \ get ns -o json | jq -r '\n  [\"NAMESPACE\",\"ENFORCE\",\"WARN\",\"AUDIT\"],\n  (.items[]\n  | [\n      .metadata.name,\n\
    \      (.metadata.labels[\"pod-security.kubernetes.io/enforce\"] // \"not-set\"),\n      (.metadata.labels[\"pod-security.kubernetes.io/warn\"\
    ] // \"not-set\"),\n      (.metadata.labels[\"pod-security.kubernetes.io/audit\"] // \"not-set\")\n    ])\n  | @tsv\n\
    ' | column -t\n• Note: This command lists each namespace’s Pod Security Admission labels, and\nthe not-set values make\
    \ missing enforce, warn, or audit labels easy to\nidentify during the audit.\nNext inspect existing pods for any admitted\
    \ use of privileged mode across regular\ncontainers, init containers, and ephemeral containers. Both the baseline and\
    \ restricted\nPod Security Standards disallow privileged containers, and the allowed value for\nsecurityContext.privileged\
    \ is unset or false.\nkubectl get pods -A -o json | jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name\
    \ as $pod\n  | def scan($type; $list):\n      $list[]?\n      | select(.securityContext.privileged == true)\n      | \"\
    \\($ns)/\\($pod)\\t\\($type)=\\(.name)\\tprivileged=true\";\n    scan(\"container\"; .spec.containers),\n    scan(\"initContainer\"\
    ; .spec.initContainers),\n    scan(\"ephemeralContainer\"; .spec.ephemeralContainers)\n'\n• Note: No output from the pod\
    \ scan indicates that no currently admitted pods are\nexplicitly running with securityContext.privileged: true. Any output\
    \ should\nbe reviewed as a security concern unless it belongs to an approved system or\nplatform exception.\nReview system\
    \ and platform namespaces separately before applying restrictive Pod\nSecurity Admission labels, because some EKS managed\
    \ or platform workloads may\nrequire elevated permissions."
  remediation: 'Configure Pod Security Admission on workload namespaces so privileged containers

    are denied when new pods are created. For this control, baseline is sufficient to block

    privileged containers, but restricted is the stronger setting for workload namespaces

    when the applications can meet the additional pod hardening requirements. EKS pod

    security documentation shows these controls being applied through namespace labels

    and explains that multiple modes can be used together for enforcement, warning, and

    audit visibility.

    Label each workload namespace to enforce restricted, or use baseline where restricted

    would break valid workloads. Add warn and audit labels during rollout so violations are

    visible to users and audit logs while enforcement blocks new noncompliant pods.

    Set the variable $NAMESPACE to the namespace name being updated.

    kubectl label ns $NAMESPACE pod-security.kubernetes.io/enforce=restricted --

    overwrite

    kubectl label ns $NAMESPACE pod-security.kubernetes.io/warn=restricted --

    overwrite

    kubectl label ns $NAMESPACE pod-security.kubernetes.io/audit=restricted --

    overwrite

    • Update workload manifests so regular containers, init containers, and ephemeral

    containers either omit securityContext.privileged or explicitly set to

    false. Under the Pod Security Standards, privileged containers are disallowed

    for the non-privileged profiles, and the accepted values are unset or false.

    • Redeploy or restart affected workloads after the manifest changes so

    replacement pods are evaluated under the enforced namespace policy.

    Changing a namespace to a more restrictive profile does not delete existing

    pods, so remediation must include replacing any already admitted pods that were

    created before enforcement was applied.

    Review system and platform namespaces separately before applying restrictive labels

    broadly. Some platform components may require elevated permissions, but exceptions

    should be isolated, documented, and limited to approved identities and namespaces.'
  checks:
  - type: manual_review
    info: 'Review the Pod Security Admission labels for every namespace in the EKS Auto Mode

      cluster and verify that workload namespaces are set to a profile that prevents privileged

      containers from being admitted. EKS Auto Mode manages more of the underlying

      compute infrastructure, but customers remain responsible for the security of application

      containers and pods, so namespace pod security controls still need to be validated.

      Check namespace Pod Security Admission labels. Workload namespaces should not

      '
    severity: medium
- id: 4.2.2
  title: Prevent pods from sharing the host process ID namespace
  scoring: scored
  profile:
  - Level 1
  description: 'Prevent pods from sharing the host process ID namespace by restricting spec.hostPID: true in EKS Auto Mode
    workload namespaces. In the EKS Pod Security Standards model, this is enforced through Pod Security Admission or an equivalent
    policy engine, and baseline or restricted enforcement should be used for workload namespaces where host process namespace
    sharing is not approved. Because the baseline profile prohibits hostPID and restricted inherits that restriction, general
    user workloads should not be permitted to use host PID sharing. Require workload pods to run with spec.hostPID: false
    or leave the field unset, except for narrowly approved system or platform workloads.'
  rationale: Linux namespaces are a key part of container isolation, and sharing the host process ID namespace allows a pod
    to see processes running on the node. In EKS Auto Mode, the underlying nodes, operating system, container runtime, and
    several infrastructure components are managed by AWS, but customers remain responsible for the pods and containers they
    deploy. Restricting hostPID helps preserve workload isolation on Auto Mode managed instances and reduces the ability of
    a compromised pod to inspect or interact with node processes. Pod Security Standards provide the Kubernetes control model
    for evaluating pod specifications at admission time. The EKS baseline profile prohibits hostPID, and the restricted profile
    inherits that control while adding stronger pod hardening requirements. Enforcing either profile causes new pods that
    request host PID sharing to be rejected before they are created, rather than relying only on detection after deployment.
  impact: Linux namespaces are a key part of container isolation, and sharing the host process ID namespace allows a pod to
    see processes running on the node. In EKS Auto Mode, the underlying nodes, operating system, container runtime, and several
    infrastructure components are managed by AWS, but customers remain responsible for the pods and containers they deploy.
    Restricting hostPID helps preserve workload isolation on Auto Mode managed instances and reduces the ability of a compromised
