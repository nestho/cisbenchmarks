- id: 5.1.2
  title: Enforce least privilege for ECR repositories storing EKS Auto Mode workload images
  scoring: manual
  profile:
  - Level 1
  description: Least privilege access for Amazon ECR repositories helps limit who can pull, push, delete, or administer container
    images used by EKS Auto Mode workloads. This reduces unnecessary exposure of the image registry and helps ensure that
    only the identities required to support image pulls, image publishing, release promotion, and repository administration
    can access the repositories. EKS Auto Mode shifts more infrastructure management to AWS.
  rationale: Amazon ECR access is enforced through a combination of IAM identity based policies and ECR repository policies.
    IAM policies can grant ECR permissions across the service or to specific resources, while repository policies are applied
    directly to individual repositories. For EKS Auto Mode workload image pulls, runtime identities should be limited to pull
    only actions needed to authenticate to ECR and retrieve image layers, such as ecr:GetAuthorizationToken, ecr:BatchGetImage,
    ecr:GetDownloadUrlForLayer, and ecr:BatchCheckLayerAvailability. For image push, repository administration, deletion,
    replication, or cross account access, permissions should be separated by role and limited to the specific repository ARNs,
    actions, principals, and conditions required for the use case. This aligns with AWS IAM least privilege practices and
    reduces the risk that a node role, workload identity, CI/CD role, or operator account can modify, overwrite, delete, or
    access images beyond its operational need.
  impact: Enforcing this control usually requires separate IAM roles or policies for EKS Auto Mode image pulls, CI/CD image
    publishing, cross account repository access, and repository administration. If permissions are too restrictive, workloads
    may fail to pull images or release pipelines may fail to publish approved images. When permissions are correctly limited,
    the control reduces the risk of unauthorized image access, image tampering, accidental deletion, or excessive registry
    administration rights without disrupting required image delivery to EKS Auto Mode workloads.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-create-node-role.html
  page_start: 120
  audit_raw: "Review the IAM permissions and ECR repository policies that apply to repositories used\nby EKS Auto Mode workload\
    \ images, and verify that access is limited to approved EKS\nAuto Mode Node IAM roles, CI/CD identities, cross-account\
    \ principals, and repository\nadministration roles. Confirm that runtime pull access is limited to the minimum ECR\nactions\
    \ required for image retrieval, that push or administrative access is limited to the\nrepositories and actions required,\
    \ and that no unnecessary wildcard or broad crossaccount access is present. ECR access decisions can be affected by both\
    \ IAM policies\nand repository policies, and EKS Auto Mode uses a Node IAM role whose key\npermissions include pulling\
    \ images from ECR.\nReview each repository policy for unnecessary principals or broad actions. Look for\ncross-account\
    \ access, wildcard principals, or actions beyond the repository’s intended\nuse. ECR repository policies are used to control\
    \ access to individual private\nrepositories, but ecr:GetAuthorizationToken must still be granted through IAM\nbefore\
    \ a principal can authenticate to push or pull images.\naws ecr get-repository-policy \\\n  --repository-name $REPO_NAME\
    \ \\\n  --region $REGION_CODE\n• Expected output: JSON containing the repository policy text. Review the\nPrincipal, Action,\
    \ and Resource entries to confirm access is limited to\napproved identities and required actions only. Flag wildcard principals,\
    \ broad\ncross account access, unrestricted push access, delete permissions, or policy\npermissions that are not required\
    \ for the repository’s intended use.\nReview the IAM role used to pull images. For EKS Auto Mode workloads, review the\n\
    EKS Auto Mode Node IAM role, commonly named AmazonEKSAutoNodeRole. If the\ncluster also uses Fargate profiles, review\
    \ the Fargate pod execution role separately.\nConfirm the role has only the pull permissions required for ECR access.\
    \ Pull related\npermissions include ecr:GetAuthorizationToken,\necr:BatchCheckLayerAvailability, ecr:BatchGetImage, and\n\
    ecr:GetDownloadUrlForLayer.\naws iam list-attached-role-policies \\\n  --role-name $ROLE_NAME\n• Expected output: JSON\
    \ listing the managed policies attached to the role.\nReview the attached policy names and flag overly broad access such\
    \ as full ECR\nadministration where pull-only access would be sufficient. For EKS Auto Mode\nnode roles, confirm that\
    \ pull access is satisfied through\nAmazonEC2ContainerRegistryPullOnly or an equivalent customer policy with\nonly the\
    \ required pull actions.\nAlso review inline policies attached directly to the role, because broad ECR permissions\nmay\
    \ be granted outside managed policies.\naws iam list-role-policies \\\n  --role-name $ROLE_NAME\n• Expected output: JSON\
    \ listing inline policy names attached to the role. If inline\npolicies are present, retrieve and review them for broad\
    \ permissions such as\necr:*, wildcard repository resources, push actions, delete actions, or repository\npolicy actions\
    \ assigned to runtime pull roles.\nFlag broad access patterns. Examples include ecr:*, wildcard repository scope where\n\
    it is not required, broad managed policies where a narrower customer policy would\nsatisfy the use case, or repository\
    \ policies that allow unapproved principals. IAM best\npractices for ECR call for moving from broad managed permissions\
    \ toward least\nprivilege customer policies that grant only the actions, resources, and conditions\nrequired for the use\
    \ case."
  remediation: "Enforce least privilege access for ECR repositories used by EKS Auto Mode workload\nimages by separating image\
    \ pull, image push, account access, and repository\nadministration into different IAM roles and policy scopes. Grant the\
    \ EKS Auto Mode\nNode IAM role only the ECR permissions needed to authenticate and pull images, such\nas ecr:GetAuthorizationToken,\
    \ ecr:BatchCheckLayerAvailability,\necr:BatchGetImage, and ecr:GetDownloadUrlForLayer. Scope CI/CD and\nadministrator\
    \ access to the specific repositories and actions they require, and review\nboth IAM identity based policies and ECR repository\
    \ policies because ECR\nauthorization can be affected by both.\nSeparate ECR access by role. Use different roles for EKS\
    \ Auto Mode runtime image\npulls, CI/CD image pushes, account repository access, and repository administration.\n• Replace\
    \ broad pull access with pull-only permissions where possible. Attach a\nnarrower pull-only policy to runtime pull roles\
    \ instead of broader ECR access. For\nEKS Auto Mode node roles, AmazonEC2ContainerRegistryPullOnly is the\nmanaged policy\
    \ AWS identifies for ECR image pull access.\naws iam attach-role-policy \\\n  --role-name $ROLE_NAME \\\n  --policy-arn\
    \ arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly\n• Scope push and admin access to specific repositories.\
    \ Limit CI/CD and admin\nidentities to the repository ARNs and ECR actions they actually need. Use\ncustomer policies\
    \ where the managed policy grants more access than the\nspecific build, release, or administration function requires.\n\
    • Tighten repository policies only where needed. Use repository policies to restrict\nrepository access, including approved\
    \ account access, but remember that\necr:GetAuthorizationToken must still come from IAM.\naws ecr set-repository-policy\
    \ \\\n  --repository-name $REPO_NAME \\\n  --policy-text file://repo-policy.json \\\n  --region $REGION_CODE\n• Keep runtime\
    \ pull roles limited to pull actions only. Do not give EKS Auto Mode\nNode IAM roles push, delete, replication, lifecycle,\
    \ or policy-management rights\nunless there is a documented operational requirement. Remove broad ECR\nmanaged policies\
    \ such as full access or power user from runtime pull roles when\npull-only access is sufficient.\nRetest image delivery\
    \ after policy changes. Confirm EKS Auto Mode workloads can still\npull required images and that unauthorized identities\
    \ can no longer push, delete, or\nadminister repositories outside their approved role."
  checks:
  - type: manual_review
    info: 'Review the IAM permissions and ECR repository policies that apply to repositories used

      by EKS Auto Mode workload images, and verify that access is limited to approved EKS

      Auto Mode Node IAM roles, CI/CD identities, cross-account principals, and repository

      administration roles. Confirm that runtime pull access is limited to the minimum ECR

      actions required for image retrieval, that push or administrative access is limited to the

      repositories and actions required, and that no unnecessary wildcard '
    severity: medium
- id: 5.1.3
  title: Restrict EKS Auto Mode Node IAM role to ECR pull-only permissions
  scoring: manual
  profile:
  - Level 1
  description: Restricting ECR access for the EKS Auto Mode Node IAM role to pull only permissions helps ensure that nodes
    can retrieve required container images without receiving broader registry visibility, image publishing, deletion, or administrative
    access. In EKS Auto Mode, the Node IAM role is assigned to nodes created for pending workloads and should be used for
    node operations such as image pulls, not as a broad workload or registry administration identity.
  rationale: The EKS Auto Mode Node IAM role should only have the ECR permissions required to authenticate to ECR and retrieve
    container image layers. EKS Auto Mode node role setup includes AmazonEC2ContainerRegistryPullOnly, or equivalent permissions,
    along with the required EKS node permissions. This keeps node image pull access aligned to the runtime need without granting
    image push, delete, repository policy, or registry administration permissions. A pull only policy is narrower than ECR
    read only or broader ECR managed policies. AmazonEC2ContainerRegistryPullOnly grants permission to pull container images
    from ECR, while AmazonEC2ContainerRegistryReadOnly also includes the ability to list repositories and images. Those additional
    visibility permissions may be useful for administrators, auditors, or tooling, but they are not required for the EKS Auto
    Mode Node IAM role to pull private ECR images.
  impact: This control reduces unnecessary exposure of ECR metadata and registry administration capabilities from the EKS
    Auto Mode Node IAM role, while preserving the permissions needed for image retrieval. If pull permissions such as ecr:GetAuthorizationToken,
    ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, or ecr:GetDownloadUrlForLayer are removed or incorrectly limited,
    EKS Auto Mode nodes may be unable to pull private ECR images, causing pods to fail image pull and preventing workloads
    from starting successfully.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/auto-learn-iam.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-create-node-role.html
  page_start: 125
  audit_raw: "Review the IAM permissions and any ECR repository policies that apply to the EKS\nAuto Mode Node IAM role, and\
    \ verify that the role is limited to pull-only ECR access.\nFor this control, focus on the Node IAM role assigned to EKS\
    \ Auto Mode nodes. If the\ncluster also uses Fargate, review the Fargate pod execution role under a separate\nFargate\
    \ specific check. The EKS Auto Mode Node IAM role has key permissions that\ninclude pulling images from ECR, and the suggested\
    \ node role policies include\nAmazonEKSWorkerNodeMinimalPolicy and AmazonEC2ContainerRegistryPullOnly.\nIdentify the EKS\
    \ Auto Mode Node IAM role in scope. Review the role configured for\nAuto Mode compute, commonly named AmazonEKSAutoNodeRole.\n\
    aws eks describe-cluster \\\n  --name $CLUSTER_NAME \\\n  --region $REGION_CODE \\\n  --query 'cluster.computeConfig.nodeRoleArn'\
    \ \\\n  --output text\n• Expected output: the ARN of the EKS Auto Mode Node IAM role. Use the role\nname from this ARN\
    \ for the remaining IAM checks.\nReview the managed policies attached to that role. Flag broad policies such as\nAmazonEC2ContainerRegistryReadOnly,\
    \ AmazonEC2ContainerRegistryPowerUser,\nor AmazonEC2ContainerRegistryFullAccess when the role only needs to pull\nimages.\
    \ AmazonEC2ContainerRegistryPullOnly is the tighter policy fit for runtime\nimage pulls because it grants permission to\
    \ pull container images from ECR, while\nAmazonEC2ContainerRegistryReadOnly also allows repository and image listing.\n\
    aws iam list-attached-role-policies \\\n  --role-name $ROLE_NAME\n• Expected output: JSON listing managed policies attached\
    \ to the role. Confirm\nthat ECR access is provided by AmazonEC2ContainerRegistryPullOnly or an\nequivalent customer pull-only\
    \ policy, and flag broader ECR policies unless there\nis a documented operational requirement.\no Review any inline policies\
    \ attached to the EKS Auto Mode Node IAM role\nand confirm they do not add broader ECR permissions, such as repository\n\
    listing, scan finding reads, push, delete, lifecycle, policy management, or\nwildcard ecr:* access.\nCheck for repository\
    \ exceptions. If a repository policy is used, verify that it does not\ngrant the EKS Auto Mode Node IAM role unnecessary\
    \ push, delete, policy, or\nadministrative access. A missing repository policy is not automatically a finding,\nbecause\
    \ ECR access can be granted through IAM alone.\necr:GetAuthorizationToken must still be granted through IAM before a principal\
    \ can\nauthenticate to a registry and push or pull images.\naws ecr get-repository-policy \\\n  --repository-name $REPO_NAME\
    \ \\\n  --region $REGION_CODE\n• Expected output: JSON containing the repository policy text. Review Principal,\nAction,\
    \ and Resource entries to confirm the EKS Auto Mode Node IAM role is not\ngranted broader access than image retrieval\
    \ requires."
  remediation: "Enforce pull-only ECR access for the EKS Auto Mode Node IAM role by limiting the role\nto the permissions\
    \ required to authenticate to ECR and retrieve container image layers.\nThe EKS Auto Mode Node IAM role should use\nAmazonEC2ContainerRegistryPullOnly\
    \ or equivalent permissions, together with the\nrequired EKS node permissions. Identify the EKS Auto Mode Node IAM role\
    \ in scope.\nUse the role configured in the cluster’s Auto Mode compute configuration or the\nexpected role name, such\
    \ as AmazonEKSAutoNodeRole.\nRemove broader ECR managed policies from the Node IAM role. Detach\nAmazonEC2ContainerRegistryReadOnly,\
    \ AmazonEC2ContainerRegistryPowerUser,\nAmazonEC2ContainerRegistryFullAccess, or similar broad policies from the role\n\
    when it only needs image-pull access. ECR managed policies are general purpose, and\ncustomer-managed policies can further\
    \ reduce permissions for specific use cases.\naws iam detach-role-policy \\\n  --role-name $ROLE_NAME \\\n  --policy-arn\
    \ arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly\n• Attach the pull-only managed policy to the EKS Auto Mode\
    \ Node IAM role.\nAmazonEC2ContainerRegistryPullOnly is the managed-policy fit for ECR\nimage pulls and is one of the\
    \ suggested policies for the EKS Auto Mode Node\nIAM role.\naws iam attach-role-policy \\\n  --role-name $ROLE_NAME \\\
    \n  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly\n• Remove or replace inline policies that\
    \ add extra ECR permissions. Keep the EKS\nAuto Mode Node IAM role limited to the pull path and remove repository listing,\n\
    repository policy reads, scan finding reads, push actions, delete actions, lifecycle\nactions, and wildcard ecr:* access\
