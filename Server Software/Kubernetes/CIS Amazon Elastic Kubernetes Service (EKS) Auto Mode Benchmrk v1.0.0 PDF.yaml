- id: 5.1.1
  title: Enable ECR enhanced scanning for EKS Auto Mode workload images
  scoring: scored
  profile:
  - Level 1
  description: Container image vulnerability scanning helps strengthen the security of EKS Auto Mode workload images by identifying
    known software weaknesses before or after images are deployed. Because EKS Auto Mode manages more of the cluster infrastructure
    while customers remain responsible for application containers and pods, image scanning remains a customer controlled workload
    security requirement.
  rationale: ECR enhanced scanning integrates with Amazon Inspector to provide automated and continuous vulnerability scanning
    for container images stored in Amazon ECR. Unlike basic scanning, enhanced scanning includes both operating system and
    programming language package vulnerabilities, updates findings as new CVEs are identified, and can emit events through
    EventBridge when findings are created, updated, or closed. This is especially important for EKS Auto Mode because customer
    responsibility remains focused on the workloads they deploy, even though the underlying managed instances and several
    cluster infrastructure capabilities are handled by EKS Auto Mode. ECR enhanced scanning can also show image usage in EKS,
    including when images were last used and how many clusters use each image, which helps prioritize remediation for vulnerable
    images that are actually running. Images with High or Critical findings should be rebuilt, replaced, or removed based
    on risk and operational requirements.
  impact: This control improves visibility into vulnerable EKS Auto Mode workload images and helps teams prioritize remediation
    based on severity and runtime use, but it adds operational work to configure registry scanning rules, review Inspector
    findings, rebuild images, and manage exceptions. Coverage depends on the ECR enhanced scanning configuration, repository
    filters, image activity, and rescan duration settings, so repositories or images outside the configured scan criteria
    may not continue to receive active vulnerability monitoring.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/automode.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/auto-security.html
  page_start: 116
  audit_raw: "Verify that ECR enhanced scanning is enabled for repositories that store images used\nby EKS Auto Mode workloads.\
    \ EKS Auto Mode manages more of the cluster\ninfrastructure, but customers remain responsible for the security, availability,\
    \ and\nmonitoring of the containers and pods they deploy.\nReview the ECR registry scanning configuration in each Region\
    \ that stores images for\nthe cluster. Confirm that scanType is ENHANCED and that the configured rules include\nthe repositories\
    \ used by EKS Auto Mode workloads. The registry scanning configuration\ndefines the registry scan type, repository filters,\
    \ and scan frequency.\naws ecr get-registry-scanning-configuration \\\n  --region $REGION_CODE\nExpected output: JSON\
    \ showing registryId and scanningConfiguration. In\nscanningConfiguration, look for scanType: ENHANCED and review rules,\n\
    repositoryFilters, and scanFrequency. For this control, repositories used by EKS\nAuto Mode workloads should be covered\
    \ by CONTINUOUS_SCAN unless there is a\ndocumented reason to use SCAN_ON_PUSH.\nCheck the effective scanning configuration\
    \ for each repository used by EKS Auto Mode\nworkload images. This confirms whether the repository is actually covered\
    \ by the\nregistry scanning rules and which filters apply.\naws ecr batch-get-repository-scanning-configuration \\\n \
    \ --repository-names $REPO_NAME \\\n  --region $REGION_CODE\nExpected output: JSON with scanningConfigurations for the\
    \ requested repository.\nReview repositoryName, repositoryArn, scanFrequency, and\nappliedScanFilters. A repository covered\
    \ by enhanced continuous scanning should\nshow scanFrequency as CONTINUOUS_SCAN. Repositories that do not match enhanced\n\
    scanning filters may not be scanned, so they should be treated as audit findings for this\ncontrol.\nReview ECR or Amazon\
    \ Inspector findings for repositories that supply EKS Auto Mode\nworkload images. Confirm that High and Critical findings\
    \ are reviewed, tracked, and\nremediated through image rebuild, replacement, or removal before the affected images\nare\
    \ promoted or continue running in production."
  remediation: "Enable ECR enhanced scanning for the private registry in each Region that stores\nimages used by EKS Auto\
    \ Mode workloads. Use registry scanning configuration rather\nthan repository scan on push configuration, because the\
    \ repository\nPutImageScanningConfiguration API is being deprecated in favor of registry\nconfiguration. Enhanced scanning\
    \ integrates ECR with Amazon Inspector to provide\nautomated and continuous scanning for operating system and programming\
    \ language\npackage vulnerabilities.\nIdentify the ECR repositories and Regions that provide images to EKS Auto Mode\n\
    workloads. Use the image references from Kubernetes workloads to determine which\nECR repositories must be covered by\
    \ enhanced scanning. Enable enhanced scanning\nfor the private registry in each applicable Region. When no rules are specified,\
    \ ECR\nsets enhanced scanning to continuous scanning for all repositories by default.\naws ecr put-registry-scanning-configuration\
    \ \\\n  --scan-type ENHANCED \\\n  --region $REGION_CODE\n• If your organization uses repository filters, configure rules\
    \ so all repositories that\nsupply EKS Auto Mode workload images are included. The following example\ncontinuously scans\
    \ repositories with prod in the repository name.\naws ecr put-registry-scanning-configuration \\\n  --scan-type ENHANCED\
    \ \\\n  --rules\n'[{\"repositoryFilters\":[{\"filter\":\"prod\",\"filterType\":\"WILDCARD\"}],\"scanFrequ\nency\":\"CONTINUOUS_SCAN\"\
    }]' \\\n  --region $REGION_CODE\n• For broader coverage, use a wildcard rule to continuously scan all repositories\nthat\
    \ may supply EKS Auto Mode workloads.\naws ecr put-registry-scanning-configuration \\\n  --scan-type ENHANCED \\\n  --rules\n\
    '[{\"repositoryFilters\":[{\"filter\":\"*\",\"filterType\":\"WILDCARD\"}],\"scanFrequenc\ny\":\"CONTINUOUS_SCAN\"}]' \\\
    \n  --region $REGION_CODE\n• After enabling enhanced scanning, review Amazon Inspector findings, prioritize\nHigh and\
    \ Critical vulnerabilities, rebuild or replace affected images, and redeploy\nupdated workload images to the EKS Auto\
    \ Mode cluster. This makes scanning\npart of the operational deployment control path rather than only a reporting\nactivity.\
    \ ECR enhanced scanning also sends EventBridge events when findings\nare created, updated, or closed, which can support\
    \ alerting and remediation\nworkflows."
