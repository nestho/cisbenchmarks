    Admission controller or an equivalent policy engine, using at least the baseline profile where host network sharing is
    not approved and restricted for stronger workload namespace hardening. The baseline profile prohibits hostNetwork, and
    restricted inherits the baseline restrictions, so general workload namespaces should not permit host network sharing.
