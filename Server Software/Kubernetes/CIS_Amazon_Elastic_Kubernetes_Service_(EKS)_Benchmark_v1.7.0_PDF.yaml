    distributions. Amazon ECR does not support scanning images built from the Docker scratch image. An UNDEFINED severity
    level is returned You may receive a scan finding that has a severity level of UNDEFINED. The following are the common
    causes for this: The vulnerability was not assigned a priority by the CVE source. The vulnerability was assigned a priority
