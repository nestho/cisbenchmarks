  remediation: "To disable public IP addresses for EKS nodegroup nodes using the AWS CLI, you must\nensure the following when\
    \ running create-nodegroup:\n• Use private subnets (that don't auto-assign public IPs).\n• Set associatePublicIpAddress\
    \ to false.\n\"NetworkInterfaces\": [{\n  \"AssociatePublicIpAddress\": false\n}]\nYou can restrict access to the control\
    \ plane endpoint using:\naws eks update-cluster-config \\\n  --name <cluster-name> \\\n  --region <region> \\\n  --resources-vpc-config\
    \ endpointPublicAccess=false,\nendpointPrivateAccess=true\nThis makes the API server private, but does not affect node\
    \ IPs.\nTo ensure nodes use only private IPs:\n• Use aws eks create-nodegroup with only private subnets, or\n• Use a launch\
    \ template with AssociatePublicIpAddress=false."
  checks:
  - type: manual_review
    info: 'Check for the following to be ''enabled: true''

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.endpointPrivateAccess"

      Check for the following is not null:

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.publicAccessCidrs"

      Note: In addition include the check if the nodes are deployed in private subnets and no

      public IP is assigned. The private subn'
    severity: medium
- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: scored
  profile:
  - Level 1
  description: 'Amazon EKS provides two ways to implement network policy. You choose a network policy option when you create
    an EKS cluster. The policy option can''t be changed after the cluster is created: Calico Network Policies, an open-source
    network and network security solution founded by Tigera. Both implementations use Linux iptables to enforce the specified
    policies. Policies are translated into sets of allowed and disallowed IP pairs. These pairs are then programmed as IPTable
    filter rules.'
  rationale: By default, all pod to pod traffic within a cluster is allowed. Network Policy creates a pod-level firewall that
    can be used to restrict traffic between sources. Pod traffic is restricted by having a Network Policy that selects it
    (through the use of labels). Once there is any Network Policy in a namespace selecting a particular pod, that pod will
    reject any connections that are not allowed by any Network Policy. Other pods in the namespace that are not selected by
    any Network Policy will continue to accept all traffic. Network Policies are managed via the Kubernetes Network Policy
    API and enforced by a network plugin, simply creating the resource without a compatible network plugin to implement it
    will have no effect.
  impact: Network Policy requires the Network Policy add-on. This add-on is included automatically when a cluster with Network
    Policy is created, but for an existing cluster, needs to be added prior to enabling Network Policy. Enabling/Disabling
    Network Policy causes a rolling update of all cluster nodes, similar to performing a cluster upgrade. This operation is
    long-running and will block other operations on the cluster (including delete) until it has run to completion. Enabling
    Network Policy enforcement consumes additional resources in nodes. Specifically, it increases the memory footprint of
    the kube-system process by approximately 128MB, and requires approximately 300 millicores of CPU.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/eks-networking-add-ons.html
  page_start: 137
  audit_raw: 'Check for the following is not null and set with appropriate group id:

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.clusterSecurityGroupId"

    Check for the following is True:

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-addon --cluster-name ${CLUSTER_NAME} --addon-name vpc-cni --

    query addon.configurationValues'
  remediation: Utilize Calico or other network policy engine to segment and isolate your traffic.
  checks:
  - type: manual_review
    info: 'Check for the following is not null and set with appropriate group id:

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.clusterSecurityGroupId"

      Check for the following is True:

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-addon --cluster-name ${CLUSTER_NAME} --addon-name vpc-cni --

      query addon.configurationValues'
    severity: medium
- id: 5.4.5
  title: Encrypt traffic to HTTPS load balancers with TLS certificates
  scoring: manual
  profile:
  - Level 1
  description: Encrypt traffic to HTTPS load balancers using TLS certificates. Amazon EKS uses IAM to provide authentication
    to your Kubernetes cluster through the AWS IAM Authenticator for Kubernetes. You can configure the stock kubectl client
    to work with Amazon EKS by installing the AWS IAM Authenticator for Kubernetes and modifying your kubectl configuration
    file to use it for authentication.
  rationale: Encrypting traffic between users and your Kubernetes workload is fundamental to protecting data sent over the
    web. On- and off-boarding users is often difficult to automate and prone to error. Using a single source of truth for
    user permissions reduces the number of locations that an individual must be off-boarded from, and prevents users gaining
    unique permissions sets that increase the cost of audit.
  impact: Users must now be assigned to the IAM group created to use this namespace and deploy applications. If they are not
    they will not be able to access the namespace or deploy.
  references:
  - 1. https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/dataprotection.html
  - 2. https://docs.aws.amazon.com/elasticloadbalancing/latest/application/createhttps-listener.html
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/add-user-role.html
  page_start: 139
  audit_raw: 'Your load balancer vendor can provide details on auditing the certificates and policies

    required to utilize TLS.

    To Audit access to the namespace $NAMESPACE, assume the IAM role

    yourIAMRoleName for a user that you created, and then run the following command:

    $ kubectl get role -n $NAMESPACE

    The response lists the RBAC role that has access to this namespace.'
  remediation: 'Your load balancer vendor can provide details on configuring HTTPS with TLS.

    Refer to the ''Managing users or IAM roles for your cluster'' in Amazon EKS

    documentation.

    Note: If using AWS CLI version 1.16.156 or later there is no need to install the AWS

    IAM Authenticator anymore.

    The relevant AWS CLI commands, depending on the use case, are:

    aws eks update-kubeconfig

    aws eks get-token'
  checks:
