  audit_raw: ''
  remediation: 'To minimize AWS ECR container registries to only those approved, you can follow

    these steps:

    1. Define your approval criteria: Determine the criteria that containers must meet to

    be considered approved. This can include factors such as security, compliance,

    compatibility, and other requirements.

    2. Identify all existing ECR registries: Identify all ECR registries that are currently

    being used in your organization.

    3. Evaluate ECR registries against approval criteria: Evaluate each ECR registry

    against your approval criteria to determine whether it should be approved or not.

    This can be done by reviewing the registry settings and configuration, as well as

    conducting security assessments and vulnerability scans.

    4. Establish policies and procedures: Establish policies and procedures that outline

    how ECR registries will be approved, maintained, and monitored. This should

    include guidelines for developers to follow when selecting a registry for their

    container images.

    5. Implement access controls: Implement access controls to ensure that only

    approved ECR registries are used to store and distribute container images. This

    can be done by setting up IAM policies and roles that restrict access to

    unapproved registries or create a whitelist of approved registries.

    6. Monitor and review: Continuously monitor and review the use of ECR registries

    to ensure that they continue to meet your approval criteria. This can include

    regularly reviewing access logs, scanning for vulnerabilities, and conducting

    periodic audits.

    By following these steps, you can minimize AWS ECR container registries to only those

    approved, which can help to improve security, reduce complexity, and streamline

    container management in your organization. Additionally, AWS provides several tools

    and services that can help you manage your ECR registries, such as AWS Config, AWS

    CloudFormation, and AWS Identity and Access Management (IAM).'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 5.2.1
  title: Prefer using dedicated EKS Service Accounts
  scoring: scored
  profile:
  - Level 1
  description: Kubernetes workloads should not use cluster node service accounts to authenticate to Amazon EKS APIs. Each
    Kubernetes workload that needs to authenticate to other AWS services using AWS IAM should be provisioned with a dedicated
    Service account.
  rationale: 'Manual approaches for authenticating Kubernetes workloads running on Amazon EKS against AWS APIs are: storing
    service account keys as a Kubernetes secret (which introduces manual key rotation and potential for key compromise); or
    use of the underlying nodes'' IAM Service account, which violates the principle of least privilege on a multi-tenanted
    node, when one pod needs to have access to a service, but every other pod on the node that uses the Service account does
    not.'
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-serviceaccounts.html
  - 2. https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-serviceaccounts-cni-walkthrough.html
  page_start: 124
  audit_raw: 'For each namespace in the cluster, review the rights assigned to the default service

    account and ensure that it has no roles or cluster roles bound to it apart from the

    defaults.

    Additionally ensure that the automountServiceAccountToken: false setting is in place for

    each default service account.'
  remediation: 'With IAM roles for service accounts on Amazon EKS clusters, you can associate an

    IAM role with a Kubernetes service account. This service account can then provide

    AWS permissions to the containers in any pod that uses that service account. With this

    feature, you no longer need to provide extended permissions to the worker node IAM

    role so that pods on that node can call AWS APIs.

    Applications must sign their AWS API requests with AWS credentials. This feature

    provides a strategy for managing credentials for your applications, similar to the way

    that Amazon EC2 instance profiles provide credentials to Amazon EC2 instances.

    Instead of creating and distributing your AWS credentials to the containers or using the

    Amazon EC2 instance’s role, you can associate an IAM role with a Kubernetes service

    account. The applications in the pod’s containers can then use an AWS SDK or the

    AWS CLI to make API requests to authorized AWS services.

    The IAM roles for service accounts feature provides the following benefits:

    • Least privilege — By using the IAM roles for service accounts feature, you no

    longer need to provide extended permissions to the worker node IAM role so that

    pods on that node can call AWS APIs. You can scope IAM permissions to a

    service account, and only pods that use that service account have access to

    those permissions. This feature also eliminates the need for third-party solutions

    such as kiam or kube2iam.

    • Credential isolation — A container can only retrieve credentials for the IAM role

    that is associated with the service account to which it belongs. A container never

    has access to credentials that are intended for another container that belongs to

    another pod.

    • Audit-ability — Access and event logging is available through CloudTrail to help

    ensure retrospective auditing.

    To get started, see list text hereEnabling IAM roles for service accounts on your cluster.

    For an end-to-end walkthrough using eksctl, see Walkthrough: Updating a DaemonSet

    to use IAM for service accounts.'
  checks:
  - type: manual_review
    info: 'For each namespace in the cluster, review the rights assigned to the default service

      account and ensure that it has no roles or cluster roles bound to it apart from the

      defaults.

      Additionally ensure that the automountServiceAccountToken: false setting is in place for

      each default service account.'
    severity: medium
- id: 5.3.1
  title: Ensure Kubernetes Secrets are encrypted using Customer Master Keys (CMKs) managed in AWS KMS
  scoring: manual
  profile:
  - Level 1
  description: Encrypt Kubernetes secrets, stored in etcd, using secrets encryption feature during Amazon EKS cluster creation.
  rationale: Kubernetes can store secrets that pods can access via a mounted volume. Today, Kubernetes secrets are stored
    with Base64 encoding, but encrypting is the recommended approach. Amazon EKS clusters version 1.13 and higher support
    the capability of encrypting your Kubernetes secrets using AWS Key Management Service (KMS) Customer Managed Keys (CMK).
    The only requirement is to enable the encryption provider support during EKS cluster creation. Use AWS Key Management
    Service (KMS) keys to provide envelope encryption of Kubernetes secrets stored in Amazon EKS. Implementing envelope encryption
    is considered a security best practice for applications that store sensitive data and is part of a defense in depth security
    strategy. Application-layer Secrets Encryption provides an additional layer of security for sensitive data, such as user
    defined Secrets and Secrets required for the operation of the cluster, such as service account keys, which are all stored
    in etcd. Using this functionality, you can use a key, that you manage in AWS KMS, to encrypt data at the application layer.
    This protects against attackers in the event that they manage to gain access to etcd.
  impact: ''
  references:
  - 1. https://aws.amazon.com/about-aws/whats-new/2020/03/amazon-eks-addsenvelope-encryption-for-secrets-with-aws-kms/
  - 2. https://docs.aws.amazon.com/eks/latest/APIReference/API_DescribeCluster.html
  page_start: 127
  audit_raw: "For Amazon EKS clusters with Secrets Encryption enabled, run the AWS CLI\ncommand:\naws eks describe-cluster\
    \ --name=<cluster-name>\nFrom the output of the command, search if the following configuration exist with valid\nAWS keyArn\
    \ :\n\"encryptionConfig\": [\n         {\n            \"provider\": {\n               \"keyArn\": \"string\"\n       \
    \     },\n            \"resources\": [ \"string\" ]\n         }\n      ],"
  remediation: 'This process can only be performed during Cluster Creation.

    Enable ''Secrets Encryption'' during Amazon EKS cluster creation as described in the

    links within the ''References'' section.'
  checks:
  - type: manual_review
    info: "For Amazon EKS clusters with Secrets Encryption enabled, run the AWS CLI\ncommand:\naws eks describe-cluster --name=<cluster-name>\n\
      From the output of the command, search if the following configuration exist with valid\nAWS keyArn :\n\"encryptionConfig\"\
      : [\n         {\n            \"provider\": {\n               \"keyArn\": \"string\"\n            },\n            \"\
      resources\": [ \"string\" ]\n         }\n      ],"
    severity: medium
- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: scored
  profile:
  - Level 1
  description: Enable Endpoint Private Access to restrict access to the cluster's control plane to only an allowlist of authorized
    IPs.
  rationale: 'Authorized networks are a way of specifying a restricted range of IP addresses that are permitted to access
    your cluster''s control plane. Kubernetes Engine uses both Transport Layer Security (TLS) and authentication to provide
    secure access to your cluster''s control plane from the public internet. This provides you the flexibility to administer
    your cluster from anywhere; however, you might want to further restrict access to a set of IP addresses that you control.
    You can set this restriction by specifying an authorized network. Restricting access to an authorized network can provide
    additional security benefits for your container cluster, including: • Better protection from outsider attacks: Authorized
    networks provide an additional layer of security by limiting external access to a specific set of addresses you designate,
    such as those that originate from your premises. This helps protect access to your cluster in the case of a vulnerability
    in the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized networks
    help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked certificates
    used from outside Cloud Services and outside the authorized IP ranges (for example, from addresses outside your company)
    are still denied access.'
  impact: When implementing Endpoint Private Access, be careful to ensure all desired networks are on the allowlist (whitelist)
    to prevent inadvertently blocking external access to your cluster's control plane.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  page_start: 130
  audit_raw: 'Check for the following to be ''enabled: true''

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.endpointPublicAccess"

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.endpointPrivateAccess"

    Check for the following is not null:

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.publicAccessCidrs"'
  remediation: 'By enabling private endpoint access to the Kubernetes API server, all communication

    between your nodes and the API server stays within your VPC. You can also limit the IP

    addresses that can access your API server from the internet, or completely disable

    internet access to the API server.

    With this in mind, you can update your cluster accordingly using the AWS CLI to ensure

    that Private Endpoint Access is enabled.

    If you choose to also enable Public Endpoint Access then you should also configure a

    list of allowable CIDR blocks, resulting in restricted access from the internet. If you

    specify no CIDR blocks, then the public API server endpoint is able to receive and

    process requests from all IP addresses by defaulting to [''0.0.0.0/0''].

    For example, the following command would enable private access to the Kubernetes

    API as well as limited public access over the internet from a single IP address (noting

    the /32 CIDR suffix):

    aws eks update-cluster-config --region $AWS_REGION --name

    $CLUSTER_NAME --resources-vpc-config endpointPrivateAccess=true,

    endpointPublicAccess=true, publicAccessCidrs="203.0.113.5/32"

    Note:

    The CIDR blocks specified cannot include reserved addresses.

    There is a maximum number of CIDR blocks that you can specify. For more information,

    see the EKS Service Quotas link in the references section.

    For more detailed information, see the EKS Cluster Endpoint documentation link in the

    references section.'
  checks:
  - type: manual_review
    info: 'Check for the following to be ''enabled: true''

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.endpointPublicAccess"

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.endpointPrivateAccess"

      Check for the following is not null:

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.publicAccessCidrs"'
    severity: medium
- id: 5.4.2
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable access to the Kubernetes API from outside the node network if it is not required.
  rationale: In a private cluster, the master node has two endpoints, a private and public endpoint. The private endpoint
    is the internal IP address of the master, behind an internal load balancer in the master's VPC network. Nodes communicate
    with the master using the private endpoint. The public endpoint enables the Kubernetes API to be accessed from outside
    the master's VPC network. Although Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability
    could potentially expose the Kubernetes publicly with unrestricted access. Additionally, an attacker may be able to identify
    the current cluster and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required, disabling
    public endpoint will help prevent such threats, and require the attacker to be on the master's VPC network to perform
    any attack on the Kubernetes API.
  impact: Configure the EKS cluster endpoint to be private. 1. Leave the cluster endpoint public and specify which CIDR blocks
    can communicate with the cluster endpoint. The blocks are effectively a whitelisted set of public IP addresses that are
    allowed to access the cluster endpoint. 2. Configure public access with a set of whitelisted CIDR blocks and set private
    endpoint access to enabled. This will allow public access from a specific range of public IPs while forcing all network
    traffic between the kubelets (workers) and the Kubernetes API through the cross-account ENIs that get provisioned into
    the cluster VPC when the control plane is provisioned.
  references:
  - 1. https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  page_start: 133
  audit_raw: 'Check for private endpoint access to the Kubernetes API server

    Check for the following to be ''enabled: false''

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.endpointPublicAccess"

    Check for the following to be ''enabled: true''

    export CLUSTER_NAME=<your cluster name>

    aws eks describe-cluster --name ${CLUSTER_NAME} --query

    "cluster.resourcesVpcConfig.endpointPrivateAccess"'
  remediation: 'By enabling private endpoint access to the Kubernetes API server, all communication

    between your nodes and the API server stays within your VPC.

    With this in mind, you can update your cluster accordingly using the AWS CLI to ensure

    that Private Endpoint Access is enabled.

    For example, the following command would enable private access to the Kubernetes

    API and ensure that no public access is permitted:

    aws eks update-cluster-config --region $AWS_REGION --name

    $CLUSTER_NAME --resources-vpc-config

    endpointPrivateAccess=true,endpointPublicAccess=false

    Note: For more detailed information, see the EKS Cluster Endpoint documentation link

    in the references section.'
  checks:
  - type: manual_review
    info: 'Check for private endpoint access to the Kubernetes API server

      Check for the following to be ''enabled: false''

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.endpointPublicAccess"

      Check for the following to be ''enabled: true''

      export CLUSTER_NAME=<your cluster name>

      aws eks describe-cluster --name ${CLUSTER_NAME} --query

      "cluster.resourcesVpcConfig.endpointPrivateAccess"'
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: scored
  profile:
  - Level 1
  description: Disable public IP addresses for cluster nodes, so that they only have private IP addresses. Private Nodes are
    nodes with no public IP addresses.
  rationale: Disabling public IP addresses on cluster nodes restricts access to only internal networks, forcing attackers
    to obtain local network access before attempting to compromise the underlying Kubernetes hosts.
  impact: To enable Private Nodes, the cluster has to also be configured with a private master IP range and IP Aliasing enabled.
    Private Nodes do not have outbound access to the public internet. If you want to provide outbound Internet access for
