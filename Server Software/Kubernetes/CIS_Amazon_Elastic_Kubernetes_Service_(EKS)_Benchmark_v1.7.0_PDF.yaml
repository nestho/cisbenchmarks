      authentication mode of the cluster.

      Possible Outputs:

      If the output shows "authenticationmode": "API" or "authenticationmode":

      "API_AND_CONFIG_MAP", it m'
    severity: medium
- id: 4.1.8
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: Cluster roles and roles with the impersonate, bind or escalate permissions should not be granted unless strictly
    required. Each of these permissions allow a particular subject to escalate their privileges beyond those explicitly granted
    by cluster administrators
  rationale: The impersonate privilege allows a subject to impersonate other users gaining their rights to the cluster. The
    bind privilege allows the subject to add a binding to a cluster role or role which escalates their effective permissions
    in the cluster. The escalate privilege allows a subject to modify cluster roles to which they are bound, increasing their
    rights to that level. Each of these permissions has the potential to allow for privilege escalation to clusteradmin level.
  impact: There are some cases where these permissions are required for cluster service operation, and care should be taken
    before removing these permissions from system service accounts.
  references:
  - 1. https://www.impidio.com/blog/kubernetes-rbac-security-pitfalls
  - 2. https://raesene.github.io/blog/2020/12/12/Escalating_Away/
  page_start: 83
  audit_raw: 'Review the users who have access to cluster roles or roles which provide the

    impersonate, bind or escalate privileges.'
  remediation: Where possible, remove the impersonate, bind and escalate rights from subjects.
  checks:
  - type: manual_review
    info: 'Review the users who have access to cluster roles or roles which provide the

      impersonate, bind or escalate privileges.'
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: Do not generally permit containers to be run with the securityContext.privileged flag set to true.
  rationale: Privileged containers have access to all Linux Kernel capabilities and devices. A container running with full
    privileges can do almost everything that the host can do. This flag exists to allow special use-cases, like manipulating
    the network stack and accessing devices. There should be at least one admission control policy defined which does not
    permit privileged containers. If you need to run privileged containers, this should be defined in a separate policy and
    you should carefully check to ensure that only limited service accounts and users are given permission to use that policy.
  impact: 'Pods defined with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true and spec.ephemeralContainers[].securityContext.privileged: true will not be permitted.'
  references:
  - 1. https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - 2. https://aws.github.io/aws-eks-best-practices/pods/#restrict-the-containers-thatcan-run-as-privileged
  page_start: 86
  audit_raw: 'List the policies in use for each namespace in the cluster, ensure that each policy

    disallows the admission of privileged containers.

    Since manually searching through each pod''s configuration might be tedious, especially

    in environments with many pods, you can use a more automated approach with grep or

    other command-line tools.

    Here''s an example of how you might approach this with a combination of kubectl, grep,

    and shell scripting for a more automated solution:

    kubectl get pods --all-namespaces -o json | jq -r ''.items[] |

    select(.spec.containers[].securityContext.privileged == true) |

    .metadata.name''

    OR

    kubectl get pods --all-namespaces -o json | jq ''.items[] |

    select(.metadata.namespace != "kube-system" and

    .spec.containers[]?.securityContext?.privileged == true) | {pod:

    .metadata.name, namespace: .metadata.namespace, container:

    .spec.containers[].name}''

    When creating a Pod Security Policy, ["kube-system"] namespaces are excluded by

    default.

    This command uses jq, a command-line JSON processor, to parse the JSON output

    from kubectl get pods and filter out pods where any container has the

    securityContext.privileged flag set to true. Please note that you might need to adjust the

    command depending on your specific requirements and the structure of your pod

    specifications.'
  remediation: 'Add policies to each namespace in the cluster which has user workloads to restrict the

    admission of privileged containers.

    To enable PSA for a namespace in your cluster, set the podsecurity.kubernetes.io/enforce label with the policy value you
    want to enforce.

    kubectl label --overwrite ns NAMESPACE podsecurity.kubernetes.io/enforce=restricted

    The above command enforces the restricted policy for the NAMESPACE namespace.

    You can also enable Pod Security Admission for all your namespaces. For example:

    kubectl label --overwrite ns --all pod-security.kubernetes.io/warn=baseline'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster, ensure that each policy

      disallows the admission of privileged containers.

      Since manually searching through each pod''s configuration might be tedious, especially

      in environments with many pods, you can use a more automated approach with grep or

