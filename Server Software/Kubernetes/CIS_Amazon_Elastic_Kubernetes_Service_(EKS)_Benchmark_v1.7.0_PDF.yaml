controls:
- id: 2.1.1
  title: Enable audit Logs
  scoring: scored
  profile:
  - Level 1
  description: Control plane logs provide visibility into operation of the EKS Control plane component systems. The API server
    audit logs record all accepted and rejected requests in the cluster. When enabled via EKS configuration the control plane
    logs for a cluster are exported to a CloudWatch Log Group for persistence.
  rationale: Audit logs enable visibility into all API server requests from authentic and anonymous sources. Stored log data
    can be analyzed manually or with tools to identify and understand anomalous or negative activity and lead to intelligent
    remediations.
  impact: Enabling control plane logs, including API server audit logs for Amazon EKS clusters, significantly strengthens
    our security posture by providing detailed visibility into all API requests, thereby reducing our attack surface. By exporting
    these logs to a CloudWatch Log Group, we ensure persistent storage and facilitate both manual and automated analysis to
    quickly identify and remediate anomalous activities. While this configuration might slightly impact usability or performance
    due to the overhead of logging, the enhanced security and compliance benefits far outweigh these drawbacks, making it
    a critical component of our security strategy.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://aws.github.io/aws-eks-best-practices/detective/
  page_start: 19
  audit_raw: "From Console:\n1. For each EKS Cluster in each region;\n2. Go to 'Amazon EKS' > 'Clusters' > 'CLUSTER_NAME'\
    \ > 'Configuration' >\n'Logging'.\n3. This will show the control plane logging configuration:\nAPI server: Enabled / Disabled\n\
    Authenticator: Enabled / Disabled\nController manager: Enabled / Disabled\nScheduler: Enabled / Disabled\n4. Ensure that\
    \ all options are set to 'Enabled'.\nFrom CLI:\n# For each EKS Cluster in each region;\nexport CLUSTER_NAME=<your cluster\
    \ name>\nexport REGION_CODE=<your region_code>\naws eks describe-cluster --name ${CLUSTER_NAME} --region ${REGION_CODE}\
    \ --\nquery 'cluster.logging.clusterLogging'\nAuthenticator: Enabled\nController manager: Enabled\nScheduler: Enabled\n\
    5. Click 'Save Changes'.\nFrom CLI:\n# For each EKS Cluster in each region;\naws eks update-cluster-config \\\n    --region\
    \ '${REGION_CODE}' \\\n    --name '${CLUSTER_NAME}' \\\n    --logging\n'{\"clusterLogging\":[{\"types\":[\"api\",\"audit\"\
    ,\"authenticator\",\"controllerManage\nr\",\"scheduler\"],\"enabled\":true}]}'\nAuthenticator: Disabled\nController manager:\
    \ Disabled\nScheduler: Disabled"
  remediation: 'From Console:

    1. For each EKS Cluster in each region;

    2. Go to ''Amazon EKS'' > ''Clusters'' > '''' > ''Configuration'' > ''Logging''.

    3. Click ''Manage logging''.

    4. Ensure that all options are toggled to ''Enabled''.

    API server: Enabled'
  checks:
  - type: sql
    command: 'show the control plane logging configuration:'
    severity: medium
    info: 'From Console:

      1. For each EKS Cluster in each region;

      2. Go to ''Amazon EKS'' > ''Clusters'' > ''CLUSTER_NAME'' > ''Configuration'' >

      ''Logging''.

      3. This will show the control plane logging configuration:

      API server: Enabled / Disabled

      Authenticator: Enabled / Disabled

      Controller manager: Enabled / Disabled

      Scheduler: Enabled / Disabled

      4. Ensure that all options are set to ''Enabled''.

      From CLI:

      # For each '
- id: 2.1.2
  title: Ensure audit logs are collected and managed
  scoring: manual
  profile:
  - Level 1
  description: Ensure that audit logs are collected and managed in accordance with the enterprise’s audit log management process
    across all Kubernetes components.
  rationale: Audit logs provide visibility into the activities occurring within a Kubernetes cluster, enabling the detection
    and investigation of security incidents and policy violations. Proper collection and management of audit logs are essential
    for maintaining an audit trail and ensuring compliance with security policies.
  impact: Implementing comprehensive audit logging may require additional storage and processing resources. Care must be taken
    to ensure that logs are properly secured and managed to avoid any potential security risks associated with log data.
  references:
  - 1. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  - 2. https://kubernetes.io/docs/tasks/debug-application-cluster/audit/#audit-policy
  page_start: 22
  audit_raw: '1. Verify audit logging is enabled for Kubernetes components:

    kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz | jq

    ''.kubeletConfig.auditPolicy''

    2. Ensure the audit logs are being collected and sent to a centralized logging

    system:

    kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/stats/summary | jq

    ''.auditLogs''

    3. Verify that the audit logs are being monitored and managed according to the

    enterprise’s audit log management process.'
  remediation: "1. Create or update the audit-policy.yaml to specify the audit logging configuration:\napiVersion: audit.k8s.io/v1\n\
    kind: Policy\nrules:\n  - level: Metadata\n    resources:\n      - group: \"\"\n        resources: [\"pods\"]\n2. Apply\
    \ the audit policy configuration to the cluster:\nkubectl apply -f <path-to-audit-policy>.yaml\n3. Ensure audit logs are\
    \ forwarded to a centralized logging system like CloudWatch,\nElasticsearch, or another log management solution:\nkubectl\
    \ create configmap cluster-audit-policy --from-file=audit-policy.yaml -\nn kube-system\nkubectl apply -f - <<EOF\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: audit-logging\n  namespace: kube-system\nspec:\n  containers:\n  - name: audit-log-forwarder\n\
    \    image: my-log-forwarder-image\n    volumeMounts:\n    - mountPath: /etc/kubernetes/audit\n      name: audit-config\n\
    \  volumes:\n  - name: audit-config\n    configMap:\n      name: cluster-audit-policy\nEOF"
  checks:
  - type: manual_review
    info: '1. Verify audit logging is enabled for Kubernetes components:

      kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz | jq

      ''.kubeletConfig.auditPolicy''

      2. Ensure the audit logs are being collected and sent to a centralized logging

      system:

      kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/stats/summary | jq

      ''.auditLogs''

      3. Verify that the audit logs are being monitored and managed according to the

      enterprise’s audit log management process.'
    severity: medium
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is configured by a kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: Ensuring that the kubeconfig file permissions are set to 644 or more restrictive significantly strengthens the security
    posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to the kubeconfig
    file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk of malicious alterations
    that could compromise the cluster's integrity. However, this configuration may slightly impact usability, as it limits
    the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators will need to
    balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing kubelet
    configurations.
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  page_start: 26
  audit_raw: "Method 1\nSSH to the worker nodes\nTo check to see if the Kubelet Service is running:\nsudo systemctl status\
    \ kubelet\nThe output should return Active: active (running) since..\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -ef | grep kubelet\nThe output of the above command should return something similar\
    \ to --kubeconfig\n/var/lib/kubelet/kubeconfig which is the location of the kubeconfig file.\nRun this command to obtain\
    \ the kubeconfig file permissions:\nstat -c %a /var/lib/kubelet/kubeconfig\nThe output of the above command gives you\
    \ the kubeconfig file's permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more\
    \ restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access\
    \ the host's file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's\
    \ file system into the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\n\
    within the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n  \
    \  hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command:\
    \ [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n    \
    \  privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\n\
    Once the pod is running, you can exec into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\n\
    Now you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check\
    \ the permission level of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nVerify that if a file is specified and it\
    \ exists, the permissions are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /var/lib/kubelet/kubeconfig && ls -l /host/var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /var/lib/kubelet/kubeconfig which is the locat'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kubelet controls various parameters for the kubelet service in the worker node. You should
    set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/admin/kube-proxy/
  page_start: 29
  audit_raw: "Method 1\nSSH to the worker nodes\nTo check to see if the Kubelet Service is running:\nsudo systemctl status\
    \ kubelet\nThe output should return Active: active (running) since..\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -ef | grep kubelet\nThe output of the above command should return something similar\
    \ to --kubeconfig\n/var/lib/kubelet/kubeconfig which is the location of the kubeconfig file.\nRun this command to obtain\
    \ the kubeconfig file ownership:\nstat -c %U:%G /var/lib/kubelet/kubeconfig\nThe output of the above command gives you\
    \ the kubeconfig file's ownership. Verify that\nthe ownership is set to root:root.\nMethod 2\nCreate and Run a Privileged\
    \ Pod.\nYou will need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by\
    \ deploying a pod that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a\
    \ simple pod definition that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type: Directory\n  containers:\n\
    \  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n\
    \      mountPath: /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g., file-check-pod.yaml)\
    \ and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file\
    \ ownership on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access\
    \ the node's file system through\nthe /host directory and check the ownership of the file:\nls -l /host/var/lib/kubelet/kubeconfig\n\
    The output of the above command gives you the kubeconfig file's ownership. Verify that\nthe ownership is set to root:root."
  remediation: 'Run the below command (based on the file location on your system) on each worker

    node.

    For example,

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %U:%G /var/lib/kubelet/kubeconfig && ls -l /host/var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      SSH to the worker nodes

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --kubeconfig

      /var/lib/kubelet/kubeconfig which is the locat'
- id: 3.1.3
  title: Ensure that the kubelet configuration file has permissions set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: Ensure that if the kubelet refers to a configuration file with the --config argument, that file has permissions
    of 644 or more restrictive.
  rationale: The kubelet reads various parameters, including security settings, from a config file specified by the --config
    argument. If this file is specified you should restrict its file permissions to maintain the integrity of the file. The
    file should be writable by only the administrators on the system.
  impact: None.
  references:
  - 1. https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
  page_start: 32
  audit_raw: "Method 1\nFirst, SSH to the relevant worker node:\nTo check to see if the Kubelet Service is running:\nsudo\
    \ systemctl status kubelet\nThe output should return Active: active (running) since..\nRun the following command on each\
    \ node to find the appropriate Kubelet config file:\nps -ef | grep kubelet\nThe output of the above command should return\
    \ something similar to --config\n/etc/kubernetes/kubelet/config.json which is the location of the Kubelet config\nfile.\n\
    Run the following command:\nstat -c %a /etc/kubernetes/kubelet/config.json\nThe output of the above command is the Kubelet\
    \ config file's permissions. Verify that\nthe permissions are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged\
    \ Pod.\nYou will need to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by\
    \ deploying a pod that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a\
    \ simple pod definition that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type: Directory\n  containers:\n\
    \  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n\
    \      mountPath: /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g., file-check-pod.yaml)\
    \ and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec into it to check file\
    \ permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the pod, but you can access\
    \ the node's file system through\nthe /host directory and check the permission level of the file:\nls -l /host/etc/kubernetes/kubelet/config.json\n\
    Verify that if a file is specified and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the following command (using the config file location identified in the Audit step)

    chmod 644 /etc/kubernetes/kubelet/config.json'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet/config.json && ls -l /host/etc/kubernetes/kubelet/config.json
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Method 1

      First, SSH to the relevant worker node:

      To check to see if the Kubelet Service is running:

      sudo systemctl status kubelet

      The output should return Active: active (running) since..

      Run the following command on each node to find the appropriate Kubelet config file:

      ps -ef | grep kubelet

      The output of the above command should return something similar to --config

      /etc/kubernetes/kubelet/config'
