- id: 3.2.7
  title: Ensure that the --eventRecordQPS argument is set to 0 or a level which ensures appropriate event capture
  scoring: scored
  profile:
  - Level 1
  description: Security relevant information should be captured. The eventRecordQPS on the Kubelet configuration can be used
    to limit the rate at which events are gathered and sets the maximum event creations per second. Setting this too low could
    result in relevant events not being logged, however the unlimited setting of 0 could result in a denial of service on
    the kubelet.
  rationale: It is important to capture all events and not restrict event creation. Events are an important source of security
    information and analytics that ensure that your environment is consistently monitored using the event data.
  impact: Setting this parameter to 0 could result in a denial of service condition due to excessive events being created.
    The cluster's event processing and storage systems should be scaled to handle expected event loads.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://github.com/kubernetes/kubernetes/blob/master/pkg/kubelet/apis/kubeletco
  page_start: 58
  audit_raw: 'Run the following command on each node:

    sudo grep "eventRecordQPS" /etc/systemd/system/kubelet.service.d/10kubeadm.conf

    Review the value set for the argument and determine whether this has been set to an

    appropriate level for the cluster.

    If the argument does not exist, check that there is a Kubelet config file specified by --

    config and review the value in this location.'
  remediation: 'If using a Kubelet config file, edit the file to set eventRecordQPS: to an appropriate

    level.

    If using command line arguments, edit the kubelet service file

    /etc/systemd/system/kubelet.service.d/10-kubeadm.conf on each worker node

    and set the below parameter in KUBELET_SYSTEM_PODS_ARGS variable.

    Based on your system, restart the kubelet service. For example:

    systemctl daemon-reload

    systemctl restart kubelet.service'
