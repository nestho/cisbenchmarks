- id: 5.3.1
  title: Use customer managed KMS keys for OKE envelope encryption of Kubernetes secrets
  scoring: manual
  profile:
  - Level 1
  description: Using customer managed OCI Vault keys for OKE Kubernetes secrets encryption adds a customer managed protection
    layer for Kubernetes secrets stored through the Kubernetes API. This strengthens data at rest protection while allowing
    organizations to manage key ownership, rotation, policy, and audit visibility for the key used to protect secret data.
  rationale: Envelope encryption adds a second encryption layer to Kubernetes secrets stored through the OKE control plane.
    Secret data is encrypted with a unique data encryption key, and that data encryption key is then encrypted with a master
    encryption key stored in OCI Vault before the object is persisted in etcd. This means the secret is stored in ciphertext
    in the backing datastore and is decrypted only through the Kubernetes API server path, which strengthens protection beyond
    the underlying storage encryption used for etcd. In the current OKE model, envelope encryption protects Kubernetes secrets
    in etcd by using a data encryption key and a master encryption key. A customer managed OCI Vault key gives the customer
    direct control over key selection, rotation, audit visibility, and key lifecycle for the key that protects those data
    encryption keys.
  impact: Using a customer managed OCI Vault key increases customer control, but it also adds Vault key cost, key policy administration,
    and lifecycle responsibility. If you use your own key, do not delete the Vault key used for OKE Kubernetes secrets encryption.
    Oracle documents that deleting the key makes the Kubernetes secrets stored in etcd permanently inaccessible and can require
    deleting and recreating the cluster.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengencryptingdata.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/KeyManagement/Concepts/keyoverview.htm
  page_start: 163
  audit_raw: "Review the OKE cluster configuration and verify that Kubernetes secrets are protected\nwith a customer managed\
    \ OCI Vault key, not only the default Oracle managed\nencryption for the block volumes used by etcd. For this control,\
    \ the important check is\nwhether the cluster is associated with a customer managed key for Kubernetes secrets\nencryption.\
    \ Also verify that the key is usable by the cluster and has not been disabled,\ndeleted, or stripped of required permissions.\
    \ A customer managed key association\nshould appear on the cluster, while clusters using the default Oracle managed\n\
    encryption do not expose a customer key OCID for this purpose.\nReview the cluster encryption configuration and confirm\
    \ a customer managed OCI Vault\nkey OCID is associated to the cluster for Kubernetes secrets protection. If no customer\n\
    key OCID is associated, the cluster does not meet this control.\noci ce cluster get \\\n  --cluster-id $CLUSTER_ID \\\n\
    \  --query 'data.\"kms-key-id\"' \\\n  --raw-output\nIn the command output, verify that the encryption configuration includes\
    \ a nonempty\nkms-key-id value for the customer managed OCI Vault key. If the response is empty,\nnull, or no customer\
    \ key OCID is present, this control is not satisfied.\nReview the selected OCI Vault key and confirm it exists and remains\
    \ enabled.\noci kms management key get \\\n  --key-id $KEY_ID \\\n  --endpoint $MANAGEMENT_ENDPOINT\nVerify the key is\
    \ still enabled and that the IAM policy allowing the OKE cluster to use the\nkey has not been revoked. A disabled key,\
    \ revoked policy, or deleted key can place the\ncluster into a degraded or unrecoverable state.\nWhere continuous compliance\
    \ monitoring is used, confirm the cluster has the expected\ncustomer managed OCI Vault key OCID configured and that the\
    \ key remains enabled\nand accessible to the OKE cluster."
  remediation: "Configure the OKE cluster to use a customer managed OCI Vault key for envelope\nencryption of Kubernetes secrets\
    \ so secret data stored through the Kubernetes API is\nprotected with a customer managed master encryption key. This requires\
    \ an existing\nmaster encryption key in OCI Vault, with policy permissions that allow OKE clusters to\nuse the key.\n\
    OKE does not allow you to enable customer managed Kubernetes secrets encryption\non an existing cluster after creation.\
    \ Oracle documents that this option is selected when\ncreating a new cluster through the Custom Create workflow or with\
    \ the OCI CLI by\nspecifying the Vault key OCID.\n• After the new cluster is created, the key must remain enabled and\
    \ accessible.\nDisabling, deleting, or breaking access to the associated key can place the\ncluster in a degraded or unrecoverable\
    \ state.\n• Create or identify a customer managed OCI Vault master encryption key that\nalready exists and is allowed\
    \ for OKE use.\n• Create the required IAM policy so the OKE cluster can use the key. Oracle\ndocuments either an any-user\
    \ policy with request.principal.type =\n'cluster' and the target key OCID, or a dynamic group policy for clusters that\n\
    need access to the key.\n• Create a new OKE cluster with the existing OCI Vault key OCID for Kubernetes\nsecrets encryption.\
    \ Replace the variables with real values before running the\ncommand. In this command, CLUSTER_NAME is the OKE cluster\
    \ name,\nCOMPARTMENT_ID is the target compartment, VCN_OCID is the VCN,\nKUBERNETES_VERSION is the selected Kubernetes\
    \ version, and KEY_OCID is the\nexisting OCI Vault key OCID.\noci ce cluster create \\\n  --name $CLUSTER_NAME \\\n  --compartment-id\
    \ $COMPARTMENT_ID \\\n  --vcn-id $VCN_OCID \\\n  --kubernetes-version $KUBERNETES_VERSION \\\n  --kms-key-id $KEY_OCID\n\
    • Recheck the cluster configuration and confirm that data.\"kms-key-id\" contains\nthe expected customer managed OCI Vault\
    \ key OCID.\n• Keep the associated OCI Vault key enabled and do not delete it while the cluster\ndepends on it.\nFor an\
    \ existing OKE cluster that was not created with a customer managed key, create\na replacement cluster with the required\
    \ key configuration and migrate workloads to the\nnew cluster."
