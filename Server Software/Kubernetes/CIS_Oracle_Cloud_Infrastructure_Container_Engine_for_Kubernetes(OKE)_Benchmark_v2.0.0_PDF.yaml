  remediation: 'For OKE, do not use an isNetworkPolicyEnabled cluster flag. Configure

    NetworkPolicy enforcement by using a supported enforcement solution and then

    create the required Kubernetes NetworkPolicy resources.

    If the cluster uses the OCI CNI plugin, install and configure the Calico network policy

    engine using Oracle’s documented process, then apply NetworkPolicy resources to

    workload namespaces.

    If the cluster uses flannel and NetworkPolicy enforcement is required, follow Oracle’s

    documented approach to replace flannel with Calico for new nodes, or create a

    replacement cluster design that supports the required policy enforcement. Do not install

