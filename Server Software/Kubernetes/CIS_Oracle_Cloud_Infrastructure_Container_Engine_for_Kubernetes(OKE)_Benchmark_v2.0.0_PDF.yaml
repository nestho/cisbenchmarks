- id: 3.2.6
  title: Ensure the kubelet event recording QPS is set to an appropriate value
  scoring: scored
  profile:
  - Level 1
  description: In OKE, this control is about tuning how quickly the kubelet records events so worker nodes capture useful
    operational data without generating unnecessary event volume. Oracle supports kubelet tuning for managed nodes through
    custom cloud-init initialization scripts and kubelet extra args, while worker node property changes are applied through
    node pool updates and replacement worker nodes.
  rationale: The setting eventRecordQPS is the kubelet rate limit for event creation. Kubernetes defines 50 as the default
    and states that 0 removes the limit entirely. In OKE, this value should be managed through the supported node initialization
    path when customization is required, because Oracle supports custom cloud-init scripts and kubelet extra args for managed
    nodes. In practice, that means a value that is too low can suppress event creation during burst conditions such as node
    instability, container restart loops, or rapid scheduling churn, while a value of 0 can allow unrestricted event generation
    and increase load on the API path and related control plane components. This setting should therefore be tuned through
    supported node configuration rather than treated as an arbitrary host-level change.
  impact: Setting eventRecordQPS too low can throttle or suppress relevant kubelet events during burst conditions, which reduces
    diagnostic visibility. Leaving it at an appropriate bounded value, such as the default of 50, helps preserve event capture
    while limiting event traffic. Setting it to 0 removes the rate limit entirely, which can allow unbounded event generation
    from the node in OKE. This can contribute to excessive event volume on the API path or related services rather than simply
    improving event capture.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingcustomcloudinitscripts.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengmodifyingnodepool.htm
  page_start: 60
  audit_raw: 'To audit whether the kubelet event recording QPS is appropriately set on an OKE

    worker node, query the live effective kubelet configuration through the Kubernetes API

    server proxy and inspect the kubelet configz output for eventRecordQPS. Kubernetes

    identifies configz as the view of the kubelet’s final actuated configuration, and OKE

    managed node customization should be validated from the effective node configuration

    when kubelet settings are changed through cloud-init or kubelet extra args.

    Using the api configz endpoint search for the status of eventRecordQPS by extracting

    the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 # example host and port number

    export NODE_NAME=10.0.10.25 # example node name from kubectl get nodes

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq # for a more readable output

    Output should show something similar to eventRecordQPS":50

    To interpret the result:

    50 = Using the kubelet schema default unless it has been explicitly overridden.

    Kubernetes defines 50 as the default value for eventRecordQPS.

    0 = No rate limit is enforced. This should be reviewed carefully because Kubernetes

    defines 0 as unlimited event creation, which can increase event volume from the worker

    node to the API path and related services.

    Value greater than 50 = Event creation is rate-limited to that configured value and

    should be evaluated against the cluster’s event volume and diagnostic needs.

    null or missing = Investigate further by reviewing the raw configz response and the

    node initialization path, because configz is the authoritative view of the kubelet’s final

    actuated configuration.'
  remediation: 'If the audit shows eventRecordQPS is set too low, the worker node may throttle useful

    event creation during burst conditions and should be adjusted. If the value is 0,

    Kubernetes defines that as no limit enforced, so it should be used only when the

    additional event volume is intentional and downstream capacity has been considered. If

    the field is missing or null, first confirm the configz response is complete, because

    Kubernetes identifies configz as the view of the kubelet’s final actuated configuration. In

    OKE, remediation should be made through the supported managed node initialization,

    node pool update, or node replacement workflow, not by directly editing the kubelet

    config file on the host, because Oracle supports custom cloud-init initialization scripts for

    managed nodes and applies updated worker node properties through new or

    replacement worker nodes.

    Remediation of new cluster

    When creating a new OKE cluster or node pool, set eventRecordQPS so worker nodes

    capture useful events without creating unnecessary downstream load. Kubernetes

    defines the default as 50 and 0 as unlimited, so the starting point is usually the default

    unless observed event loss justifies a different value. In OKE, apply this through

    supported managed node initialization customization such as cloud-init and kubelet

    extra args.

    • Define eventRecordQPS in the node initialization configuration so the intended

    rate limit is applied when nodes join the cluster.

    • Start from the default of 50 unless measured event loss or burst conditions justify

    a change.

    • Avoid 0 unless unlimited event creation is intentional and monitored, because it

    removes the kubelet-side rate limit entirely.

    • Use a custom cloud-init initialization script or equivalent supported managed

    node customization path when this setting must be enforced as part of node build

    or bootstrap behavior.

    • Validate after deployment that the live kubelet configuration reflects the intended

    eventRecordQPS value.

    Remediation of existing running cluster

    For an existing OKE cluster, update the node initialization or node pool configuration so

    replacement nodes start with the corrected eventRecordQPS value, then roll or replace

    the current nodes so the change is applied consistently across the node group. Oracle

    documents that worker node property changes apply to new worker nodes and can be

    applied by cycling, replacing, or rebuilding managed nodes.

    • Update the custom cloud-init initialization script or equivalent managed node

    configuration so the effective kubelet setting resolves to the intended

    eventRecordQPS value.

    • Raise the value when relevant events are being throttled, lower it when event

    volume is excessive, and avoid 0 unless unlimited event creation is justified and

    downstream impact is understood.

    • Apply the new managed node configuration to the node pool so OKE launches

    replacement nodes with the corrected configuration.

    • If the existing node group was not created with the required managed node

    customization, update the existing node pool or build a new node pool with the

    required configuration and migrate workloads to it.

    • Re-audit the replacement nodes against the live kubelet configuration and

    confirm the new value provides the intended balance between event capture and

    downstream load.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

    worker nodes are discouraged because the effective kubelet configuration can come

    from multiple sources, and OKE applies node behavior through managed node

    initialization, node pool configuration, and node replacement workflows. A host-level edit

    can therefore be overridden and lost when the node is recycled or replaced.'
  checks:
  - type: sql
    command: show something similar to eventRecordQPS":50
    severity: medium
    info: 'To audit whether the kubelet event recording QPS is appropriately set on an OKE

      worker node, query the live effective kubelet configuration through the Kubernetes API

      server proxy and inspect the kubelet configz output for eventRecordQPS. Kubernetes

      identifies configz as the view of the kubelet’s final actuated configuration, and OKE

      managed node customization should be validated from the effectiv'
- id: 3.2.7
  title: Ensure kubelet tlsCertFile and tlsPrivateKeyFile are configured appropriately
  scoring: scored
  profile:
  - Level 1
  description: Setup TLS connection on the Kubelets. For OKE worker nodes, this control validates that the kubelet HTTPS serving
    endpoint uses an appropriate TLS certificate and private key configuration rather than relying on an unintended or unmanaged
    serving identity.
  rationale: Kubelet communication contains sensitive parameters that should remain encrypted in transit. Configure the Kubelets
    to serve only HTTPS traffic. In OKE, the Kubernetes API endpoint communicates with worker nodes over the kubelet path,
    and Oracle also documents certificate based access patterns for worker node metrics. The kubelet serving certificate and
    private key should therefore be validated from the effective node configuration and managed through the supported OKE
    node initialization path when customization is required.
  impact: TLS and client certificate authentication must be configured for your Kubernetes cluster deployment. If the kubelet
    serving certificate or private key is not configured appropriately, node level HTTPS communication can rely on an unintended
    serving identity, which can weaken trust validation and complicate secure operational access to the kubelet endpoint.
  references:
