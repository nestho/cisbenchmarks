    keeps kubelet iptables utility chain creation enabled.

    • Use a custom cloud-init initialization script when kubelet customization is

    required at cluster or node pool creation time, because OKE uses cloud-init to

    initialize managed nodes and supports custom initialization logic.

    • Place the setting in the supported bootstrap path, such as the OKE cloud-init

    initialization script using kubelet extra arguments or equivalent managed node

    initialization customization, so it becomes part of the node’s durable build

    configuration.

    • Validate after deployment that the live kubelet configuration reflects the intended

    state.

    Remediation of existing running cluster

    For an existing OKE cluster, the objective is to update the node initialization or node

    pool configuration so replacement nodes start with kubelet iptables utility chains

    enabled, then roll or replace the current nodes so the corrected state is applied

    consistently across the node group. This makes the fix durable across restart, scale-out,

    and node replacement events. Oracle documents that worker node property changes

    apply to new worker nodes and can be applied by cycling, replacing, or rebuilding

    managed nodes.

    • Update the custom cloud-init initialization script or equivalent managed node

    configuration so the effective kubelet setting resolves to

    makeIPTablesUtilChains: true.

    • Apply the updated managed node configuration to the node pool so OKE

    launches replacement nodes with the corrected configuration.

    • Replace or roll the existing nodes so the running fleet is rebuilt from the updated

    node pool configuration.

    • Re-audit the replacement nodes using the live kubelet configuration to confirm

    the effective value is true.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

    worker nodes are discouraged because OKE applies node behavior through managed

    node initialization, node pool configuration, and node replacement workflows. A hostlevel edit can therefore be overridden,
