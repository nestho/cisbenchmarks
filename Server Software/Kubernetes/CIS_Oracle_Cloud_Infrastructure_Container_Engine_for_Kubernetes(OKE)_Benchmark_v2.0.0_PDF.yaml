- id: 3.2.8
  title: Ensure the kubelet client certificate rotation is enabled
  scoring: scored
  profile:
  - Level 1
  description: In OKE, the setting rotateCertificates is about whether the kubelet renews its client certificate before that
    certificate expires. Oracle OKE documentation shows worker nodes using the kubelet client certificate at /var/lib/kubelet/pki/kubelet-clientcurrent.pem,
    which is trusted by the cluster CA, but Oracle does not publish a fixed OKE default for rotateCertificates. In practice,
    that means true is the recommended operational state for long-lived nodes, while false or a not present setting should
    be treated as rotation not enabled unless OKE is explicitly managing the certificate lifecycle for that worker node configuration.
    In addition, rotateCertificates should be not be confused with a similar setting 'RotateKubeletServerCertificate'. Client
    certificate rotation affects the certificate the kubelet uses when it authenticates to the Kubernetes API server. By contrast,
    RotateKubeletServerCertificate refers to the kubelet’s serving certificate, which is the certificate the kubelet presents
    from its own HTTPS endpoint when another component connects to it. Oracle OKE documentation also distinguishes client
    certificate usage from CA validation by showing the kubelet client certificate and key used to authenticate to a worker
    node metrics endpoint, and the cluster root CA used to verify the server certificate presented by that endpoint.
  rationale: Enabling kubelet client certificate rotation allows the kubelet to automatically generate a new key and submit
    a new certificate signing request through the Kubernetes API before its current client certificate expires. Oracle OKE
    documentation shows that required certificates are available on worker nodes after provisioning and identifies /var/lib/kubelet/pki/kubelet-client-current.pem
    as the kubelet client certificate trusted by the cluster CA. Oracle does not document a fixed rotateCertificates default
    for OKE, so the effective kubelet configuration should be verified directly. In practical terms, a setting of true means
    the kubelet is configured to renew its client certificate, while false or not present should be interpreted conservatively
    as rotation not enabled unless the platform is explicitly managing certificate renewal for you. This setting is distinct
    from RotateKubeletServerCertificate. Client certificate rotation protects the certificate the node uses to authenticate
    to the API server, while server certificate rotation separately governs the certificate the kubelet presents from its
    HTTPS endpoint to callers.
  impact: When kubelet client certificate rotation is enabled, long-lived OKE worker nodes are less likely to lose access
    to the Kubernetes API because the kubelet can renew its client certificate before it expires. When the setting is false
    or not present, the node depends on replacement or another renewal process to avoid certificate expiry, so the effective
    OKE worker node configuration should be validated rather than assumed.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengobservingworkernodeaddonhealth.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengrotatingcredentials.htm
  page_start: 68
  audit_raw: 'To audit whether the kubelet client certificate rotation is enabled on an OKE worker

    node, query the live effective kubelet configuration through the Kubernetes API server

    proxy and inspect the kubelet configz output for rotateCertificates. Kubernetes

    identifies configz as the view of the kubelet’s final actuated configuration, and Oracle

    OKE documentation shows that worker nodes use kubelet client certificates trusted by

    the cluster CA. Oracle does not publish a fixed OKE default for this setting, so the

    effective kubelet configuration should be verified from the node.

    Using the API configz endpoint search for the status of rotateCertificates by

    extracting the live configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 # example host and port number

    export NODE_NAME=10.0.10.25 # example node name from kubectl get nodes

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq # for a more readable output

    Output should show something similar to "rotateCertificates":true in the output

    To interpret the result:

    • true = Pass. Client certificate rotation is enabled, so the kubelet is configured to

    renew its client certificate through the Kubernetes certificate lifecycle before

    expiry.

    • false = Fail. Client certificate rotation is disabled. Treat this as noncompliant for

    long-lived OKE worker nodes unless another documented node replacement or

    certificate lifecycle process is in place.

    • null or missing = Investigate further, but treat it conservatively as not enabled

    unless your platform explicitly manages certificate rotation for you. Oracle OKE

    documentation does not publish a fixed default value for rotateCertificates, so

    validate the raw configz response and the node initialization path before

    accepting the result.'
  remediation: 'If the audit returns false, the worker node is not configured to rotate its kubelet client

    certificate and should be treated as noncompliant. If the field is not present, interpret

    that conservatively as rotation not enabled unless your OKE platform explicitly manages

    certificate rotation for you. Oracle OKE documentation shows worker nodes using

    kubelet client certificates trusted by the cluster CA and supports managed node

    customization through cloud-init initialization scripts and kubelet extra args. Oracle also

    documents that worker node property changes can be applied through new or

    replacement managed nodes.

    Remediation of new cluster

    When creating a new OKE cluster or node pool, the goal is to ensure worker nodes start

    with kubelet client certificate rotation enabled if the nodes may remain in service long

    enough for certificate expiry to matter. In OKE, this should be applied through the

    supported managed node initialization path rather than as a host-level edit, because

    Oracle supports custom cloud-init initialization scripts and kubelet extra args for

    managed nodes.

    • Set rotateCertificates: true in the worker node’s kubelet configuration.

    • Use a custom cloud-init initialization script when this setting must be enforced at

    node creation.

    • Apply the setting through the supported managed node initialization path, not by

    editing the host after deployment.

    • Verify the live kubelet configuration shows rotation enabled.

    Remediation of existing running cluster

    For an existing OKE cluster, the objective is to update the node initialization or node

    pool configuration so replacement nodes start with kubelet client certificate rotation

    enabled, then replace the current nodes so the corrected state is applied consistently

    across the node pool. Oracle documents that managed nodes can be cycled,

    terminated, and replaced, and that updated node pool properties apply to replacement

    worker nodes.

    • Update the cloud-init initialization script or equivalent managed node

    configuration so rotateCertificates: true is applied.

    • Roll the managed node pool so replacement nodes launch with the corrected

    setting.

    • If the node pool does not use the required managed node customization, update

    the existing node pool or create a new node pool with the required configuration

    and migrate workloads.

    • Re-audit replacement nodes to confirm client certificate rotation is enabled.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

    worker nodes are discouraged because OKE applies durable node behavior through

    managed node initialization, node pool configuration, and node replacement workflows.

    A host-level change can be bypassed by the node’s initialization configuration and lost

    when the node is recycled or replaced.'
  checks:
  - type: sql
    command: show something similar to "rotateCertificates":true in the output
    severity: medium
    info: 'To audit whether the kubelet client certificate rotation is enabled on an OKE worker

      node, query the live effective kubelet configuration through the Kubernetes API server

      proxy and inspect the kubelet configz output for rotateCertificates. Kubernetes

      identifies configz as the view of the kubelet’s final actuated configuration, and Oracle

      OKE documentation shows that worker nodes use kubelet clien'
- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that cluster administrative access in Oracle OKE is granted only to identities with a documented need
    for full cluster administration. In OKE, this review should cover Kubernetes ClusterRoleBinding assignments to the cluster-admin
    ClusterRole, OCI IAM users or groups mapped through Kubernetes RBAC, and any service accounts bound to cluster administrative
    permissions. Where administration is limited to a team, application, or namespace boundary, use a narrower authorization
    model instead of cluster admin access.
  rationale: This setting enforces least privilege across the most sensitive OKE authorization paths. Oracle documents that
    OCI IAM controls who can use OKE to manage clusters and obtain access to the cluster control plane, while Kubernetes RBAC
    controls what authenticated users and service accounts can do with the Kubernetes API inside the cluster. Oracle also
    documents that Kubernetes RBAC rolebindings and clusterrolebindings can map roles and clusterroles to users or groups,
    including OCI IAM users and groups by OCID. Together, these OKE behaviors make it important to keep cluster-admin use
    exceptional, tightly bounded, and reviewable.
  impact: If cluster-admin is assigned too broadly in OKE, a compromised OCI IAM user, group mapping, or overprivileged service
    account can gain effective control over resources across all namespaces, increasing the chance that a single credential
    exposure or node level compromise becomes a cluster security or availability incident. The risk is greater when the affected
    workload also has OCI permissions through workload identity, because exposure can extend beyond Kubernetes RBAC into OCI
    API access.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  page_start: 74
  audit_raw: "This audit reviews Kubernetes ClusterRoleBinding objects in the Oracle OKE cluster\nto identify principals that\
    \ are directly granted the cluster-admin ClusterRole. It lists\neach matching binding and its associated users, groups,\
    \ or service accounts so the\nreviewer can verify whether full cluster administrative access is justified. Because OKE\n\
    uses OCI IAM for access to OKE and the cluster control plane, and Kubernetes RBAC\nfor cluster authorization, this check\
    \ should be used as a partial review of administrative\nprivilege rather than the sole test of cluster-admin exposure.\n\
    kubectl get clusterrolebindings -o json | jq -r '\n  ([\"BINDING\",\"KIND\",\"NAMESPACE\",\"NAME\"] | join(\" | \")),\n\
    \  (\n    .items[]\n    | select(.roleRef.name==\"cluster-admin\")\n    | .metadata.name as $binding\n    | (.subjects\
    \ // [])[]\n    | [$binding, .kind, (.namespace // \"-\"), .name]\n    | join(\" | \")\n  )\n'\nExample output with headers\
    \ and piped separation of values. Review each principal\nlisted and ensure that cluster-admin privilege is required for\
    \ it.\nBINDING | KIND | NAMESPACE | NAME\ncluster-admin | Group | - | system:masters\nmy-admin-binding | User | - | admin-user\n\
    ci-cluster-admin | ServiceAccount | cicd | deploy-bot\noke-admin | ServiceAccount | kube-system | oke-admin"
  remediation: 'Review each ClusterRoleBinding identified by the audit that grants the Kubernetes

    cluster-admin ClusterRole, and determine whether the listed user, group, or service

    account still requires full cluster administrative access. In Oracle OKE, this review

    should also account for access granted through OCI IAM policies and Kubernetes

    RBAC mappings, because Oracle documents that IAM and the Kubernetes RBAC

    Authorizer work together to authorize Kubernetes operations. Where responsibilities are

    limited to a namespace, workload, or operational function, replace cluster administration

    with a narrower authorization model.

    • Review each principal returned by the audit and confirm whether full cluster

    administrative access is still justified for that identity.

    • For OCI IAM users or groups mapped through Kubernetes RBAC, remove

    unnecessary cluster-admin bindings and replace them with narrower

    Kubernetes RBAC permissions or an OCI IAM and RBAC model aligned to the

    approved operational need.

    • For principals granted access through Kubernetes RBAC, replace unnecessary

    cluster-admin bindings with a lower-privilege Role, ClusterRole, or

    namespace RoleBinding that matches the approved operational need.

    • Validate that the replacement access allows the user, group, or service account

    to perform its approved tasks before removing the original cluster-admin

    binding.

    • Remove the unneeded ClusterRoleBinding only after the reduced privilege

    access has been confirmed to work as intended.

    • Do not remove ClusterRoleBindings required for OKE cluster operations,

    Oracle managed add-ons, or approved administrative service accounts unless

    you have validated the operational impact.

    • Review privilege OCI IAM groups separately, because OCI IAM controls access

    to manage OKE clusters and obtain access to the cluster control plane.

    Where possible, first assign a lower privilege role, validate required access, and then

    remove the ClusterRoleBinding that grants cluster-admin:

    kubectl delete clusterrolebinding [name]'
