  description: There are a variety of CNI plugins available for Kubernetes. In OKE, the CNI plugin used for pod networking
    is an essential cluster add-on and should run an Oracle supported version that is compatible with the cluster’s Kubernetes
    version.
  rationale: OKE uses a CNI plugin to implement pod networking for worker nodes. Oracle documents the OCI VCN-Native Pod Networking
    CNI plugin and the flannel CNI plugin as CNI plugin add-ons, and states that supported add-on versions depend on the Kubernetes
    version running on the cluster. Running an Oracle supported CNI add-on version helps preserve pod network connectivity,
    IP address management, and compatibility with OKE managed add-on behavior.
  impact: Updating the CNI add-on can restart or recreate CNI pods and may affect pod networking during the update window.
    For the OCI VCN-Native Pod Networking CNI plugin, Oracle documents version specific update behavior, including cases where
    updates are applied when worker nodes are rebooted or when CNI pods are explicitly recreated.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengpodnetworking.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengintroducingclusteraddons.htm
