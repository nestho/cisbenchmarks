controls:
- id: 2.1.1
  title: Use OCI IAM or OIDC tokens instead of user client certificates
  scoring: manual
  profile:
  - Level 1
  description: OKE authenticates cluster users through OCI IAM by default, and enhanced clusters can also be configured to
    use an external OIDC identity provider for user authentication. User access should rely on OCI IAM or OIDC tokens rather
    than Kubernetes client certificates, because these mechanisms align user access to managed identity, policy, and RBAC
    controls. OKE provides a managed Kubernetes control plane, and control plane authentication settings are modified only
    through supported OKE APIs and configuration options. Client certificates used by Kubernetes components are not a customer-managed
    user authentication method
  rationale: With any authentication mechanism the ability to revoke credentials if they are compromised or no longer required,
    is a key control. OKE kubeconfig version 2.0.0 uses an OCI CLI command to dynamically generate short lived user-specific
    authentication tokens. These tokens are not intended to be shared between users, and OIDC can be used when the organization
    wants users to authenticate through an external identity provider.
  impact: Using OCI IAM or OIDC for user authentication requires users to have the required OCI CLI, kubeconfig, IAM policy,
    OIDC identity provider, and Kubernetes RBAC configuration in place. OIDC also requires the organization to maintain the
    external identity provider configuration and token retrieval process.
  references:
  - 1. https://docs.oracle.com/iaas/Content/ContEng/Tasks/contengdownloadkubeconfi
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengOpenIDConnect-Authentication.htm
  page_start: 19
  audit_raw: "Review user access to the cluster and ensure that users are not making use of\nKubernetes client certificate\
    \ authentication.\nReview approved user kubeconfig files and confirm that user entries use OCI IAM\ngenerated tokens or\
    \ OIDC tokens instead of client certificate fields.\nRun the following command to verify the authentication method configured\
    \ for users in\nthe current kubeconfig file:\nkubectl config view --raw -o json | jq -r '\n  .users[]\n  | [\n      .name,\n\
    \      (\n        if .user.exec then \"exec_token\"\n        elif .user[\"auth-provider\"]?.name == \"oidc\" then \"oidc_token\"\
    \n        elif .user.token then \"static_token\"\n        elif (\n          .user[\"client-certificate\"]? or\n      \
    \    .user[\"client-certificate-data\"]? or\n          .user[\"client-key\"]? or\n          .user[\"client-key-data\"\
    ]?\n        ) then \"client_certificate\"\n        else \"unknown\"\n        end\n      )\n    ]\n  | @tsv\n'\nThe expected\
    \ result is that user entries use exec_token for OCI IAM based OKE access\nor oidc_token for OIDC based access. Any user\
    \ entry showing client_certificate\nshould be reviewed and replaced with a supported OCI IAM or OIDC token based\naccess\
    \ method."
  remediation: 'Replace user kubeconfig entries that use client certificates with OCI IAM generated

    tokens or OIDC token based authentication. For OKE clusters, user authentication

    should align to the supported OKE access model, where OCI IAM is used by default

    and OIDC can be configured for external identity provider based authentication. This

    allows user access to be managed through identity, policy, and Kubernetes RBAC

    controls rather than long lived certificate material stored in kubeconfig files.

    • For OCI IAM based access, regenerate the user kubeconfig file from OKE using

    kubeconfig token version 2.0.0 so the user entry uses the OCI CLI exec plugin to

    generate authentication tokens.

    • For OIDC based access, configure the OKE cluster for OIDC authentication and

    update the user kubeconfig entry to use the approved OIDC identity provider

    token flow.

    • Remove or replace any user kubeconfig entries that contain clientcertificate, client-certificate-data, client-key, or
    client-key-data,

    then validate that required users can still authenticate with only their approved

    RBAC permissions.'
  checks:
  - type: manual_review
    info: "Review user access to the cluster and ensure that users are not making use of\nKubernetes client certificate authentication.\n\
      Review approved user kubeconfig files and confirm that user entries use OCI IAM\ngenerated tokens or OIDC tokens instead\
      \ of client certificate fields.\nRun the following command to verify the authentication method configured for users\
      \ in\nthe current kubeconfig file:\nkubectl config view --raw -o json | jq -r '\n  .users[]\n  | [\n      .name,\n \
      \     (\n        if .user.exec then \"e"
    severity: medium
- id: 2.2.1
  title: Ensure authorized access to OCI Audit logs for OKE activity
  scoring: manual
  profile:
  - Level 1
  description: OCI Audit logs are separate from OKE managed Kubernetes control plane service logs. OKE integrates with the
    Oracle Cloud Infrastructure Audit service to record operations performed by Kubernetes Engine and the Kubernetes API server
    as Audit log events. Operations performed by Kubernetes Engine and the Kubernetes API server are visible as log events
    in the Oracle Cloud Infrastructure Audit service.
  rationale: Logging is a crucial detective control for all systems to detect potential unauthorized access. Authorized access
    to OCI Audit logs helps security and operations teams review OKE activity, identify security anomalies, support compliance
    checks, and troubleshoot errors by identifying who did what and when.
  impact: OKE audit events are available through the Oracle Cloud Infrastructure Audit service, while Kubernetes control plane
    process logs are available separately as OKE service logs in Oracle Cloud Infrastructure Logging. Access to Audit events
    requires IAM authorization to read audit-events, and access should be limited to approved users or groups.
  references:
  - 1. https://docs.oracle.com/iaas/Content/ContEng/Tasks/contengmonitoringoke.htm
  - 2. https://docs.oracle.com/iaas/Content/ContEng/Tasks/contengobservingclusters_t
  page_start: 23
  audit_raw: 'To monitor and manage operations performed by Container Engine for Kubernetes on a

    particular cluster:

    Review IAM policies and confirm that only authorized groups are granted access to read

    OCI Audit events for the tenancy or approved compartment. The read audit-events

    permission allows access to Audit log events.

    To view operations performed by Container Engine for Kubernetes and the Kubernetes

    API server as log events in the Oracle Cloud Infrastructure Audit service:

    Open the navigation menu, select Identity & Security, and then select Audit. Choose

    the compartment you have permission to work in, then search and filter for the

    operations of interest. Use ClustersAPI to view operations performed by Kubernetes

    Engine, and use OKE API Server Admin Access to view operations performed by the

    Kubernetes API server.'
  remediation: 'Update OCI IAM policies so only approved security, operations, or audit groups can

    read OCI Audit events for the required tenancy or compartment. Remove broad or

    unnecessary Audit access from users or groups that do not require it, and validate that

    authorized users can view OKE related events in the Audit service using the appropriate

    compartment and filters.'
  checks:
  - type: manual_review
    info: 'To monitor and manage operations performed by Container Engine for Kubernetes on a

      particular cluster:

      Review IAM policies and confirm that only authorized groups are granted access to read

      OCI Audit events for the tenancy or approved compartment. The read audit-events

      permission allows access to Audit log events.

      To view operations performed by Container Engine for Kubernetes and the Kubernetes

      API server as log events in the Oracle Cloud Infrastructure Audit service:

      Open the navigation menu, '
    severity: medium
- id: 3.1.1
  title: Ensure that the kubelet.conf file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is using a file-based kubelet.conf file, ensure that the proxy kubelet.conf
    file has permissions of 644 or more restrictive.
  rationale: The kubelet kubelet.conf file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubelet.conf file.
  impact: Ensuring that the kubelet.conf file permissions are set to 644 or more restrictive significantly strengthens the
    security posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to
    the kubelet.conf file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk
    of malicious alterations that could compromise the cluster's integrity. However, this configuration may slightly impact
    usability, as it limits the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators
    will need to balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing
    kubelet configurations.
  references:
  - 1. https://docs.oracle.com/iaas/Content/ContEng/Concepts/contengclustersnodes.ht
  - 2. https://docs.oracle.com/iaas/Content/ContEng/Tasks/conteng-kpo.htm
  page_start: 27
  audit_raw: "Method 1\nOptional: Run the following command to enter debug mode where NODE_NAME and\nIMAGE are defined variables:\n\
    kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general\nRun the following command on each node to find the\
    \ appropriate kubeconfig file:\nps -efww | grep kubelet | grep -- '--kubeconfig'\nThe command line output should show\
    \ a path for kubeconfig similar to --\nkubeconfig=/etc/kubernetes/kubelet.conf which is the location of the kubeconfig\
    \ file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c %a /etc/kubernetes/kubelet.conf (or stat\
    \ -c %a\n/host/etc/kubernetes/kubelet.conf if in debub mode)\nThe output of the above command gives you the kubeconfig\
    \ file's permissions.\nVerify that if a file is specified and it exists, the permissions are 644 or more restrictive.\n\
    Method 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's\
    \ file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system\
    \ into the pod.\nHere's an example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n    \
    \  path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"\
    ]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n      privileged: true\nSave\
    \ this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is\
    \ running, you can exec into it to check file permissions on the node:\nkubectl exec -it -n kube-public file-check --\
    \ sh\nNow you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and\
    \ check the permission level of the file:\nls -l /host/etc/kubernetes/kubelet.conf\nVerify that if a file is specified\
    \ and it exists, the permissions are 644 or more restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubelet.conf file>'
  checks:
  - type: command
    command: ps -efww | grep kubelet | grep -- '--kubeconfig' && stat -c %a /etc/kubernetes/kubelet.conf (or stat -c %a &&
      ls -l /host/etc/kubernetes/kubelet.conf
    expected: Verify that if a file is specified and it exists, the permissions are 644 or more restrictive.
    severity: medium
    info: 'Method 1

      Optional: Run the following command to enter debug mode where NODE_NAME and

      IMAGE are defined variables:

      kubectl debug node/$NODE_NAME -it --image=$IMAGE --profile=general

      Run the following command on each node to find the appropriate kubeconfig file:

      ps -efww | grep kubelet | grep -- ''--kubeconfig''

      The command line output should show a path for kubeconfig similar to --

      kubeconfig=/etc/ku'
