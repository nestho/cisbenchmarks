- id: 4.4.1
  title: Prefer exposing secrets as mounted files rather than environment variables
  scoring: scored
  profile:
  - Level 1
  description: Secrets for OKE workloads are better exposed as mounted files than as environment variables. Kubernetes secrets
    can be consumed either way, and Oracle supports mounting secrets from OCI Vault into Kubernetes Pods through the OCI Secrets
    Store CSI Driver Provider with the Secrets Store CSI Driver.
  rationale: Environment variable values can unintentionally appear in logs, while secrets mounted as volumes are instantiated
    as tmpfs volumes and are automatically removed from the node when the Pod is deleted. File based delivery also aligns
    with the OCI Secrets Store CSI Driver Provider model, which enables Kubernetes clusters to access secrets stored in OCI
    Vault and mount them into Pods through the Secrets Store CSI Driver.
  impact: Workloads that currently read secrets from environment variables may need manifest and application changes to consume
    secrets from mounted file paths instead, using Kubernetes secret volumes or the OCI Secrets Store CSI Driver Provider
    integration with OCI Vault.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengmanagingsecrets.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengencryptingdata.htm
  page_start: 124
  audit_raw: "Review workload manifests and identify any Pod, Deployment, DaemonSet,\nStatefulSet, Job, or CronJob that exposes\
    \ secrets through environment variables\ninstead of mounted files. Check for both direct secret references through\nenv[].valueFrom.secretKeyRef\
    \ and bulk secret imports through\nenvFrom[].secretRef, because either pattern exposes secret data as environment\nvariables.\
    \ Prefer workloads that consume secrets through mounted Secret volumes or\nfile based delivery from OCI secrets integrations\
    \ instead.\nRun this command to list workloads that reference secrets through either\nenvironment-variable pattern:\n\
    kubectl get deploy,ds,sts,job,cronjob,pod -A -o json | jq -r '\n  .items[]\n  | .kind as $kind\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $name\n  | (if $kind == \"Pod\" then .spec else .spec.template.spec end) as $spec\n  |\
    \ select([ $spec.containers[]?, $spec.initContainers[]? ] |\nany(.env[]?.valueFrom.secretKeyRef? or .envFrom[]?.secretRef?))\n\
    \  | \"\\($ns)\\t\\($kind)/\\($name)\"\n'\n• The command returns one line for each workload that exposes a Kubernetes\n\
    Secret through an environment variable pattern.\nSample output:\ndefault        Deployment/web-app\napps           StatefulSet/orders-api\n\
    logging        DaemonSet/log-agent\nbatch          Job/nightly-report\nreports        CronJob/monthly-export\nNote: For\
    \ this audit, no output is the preferred result, because it means no matching\nworkloads were found exposing Secrets as\
    \ environment variables"
  remediation: 'Update workloads to consume secrets as mounted files instead of environment

    variables. Replace env[].valueFrom.secretKeyRef and envFrom[].secretRef

    usage with Kubernetes Secret volumes or the OCI Secrets Store CSI Driver Provider

    with the Secrets Store CSI Driver, then update the application to read the secret from

    the mounted file path. This reduces the chance of secret values appearing in logs and

    aligns with the OCI Vault based file delivery pattern for OKE workloads.

    Replace secret environment variables with mounted secret files and update the

    application to read from the mounted path.'
  checks:
  - type: manual_review
    info: 'Review workload manifests and identify any Pod, Deployment, DaemonSet,

      StatefulSet, Job, or CronJob that exposes secrets through environment variables

      instead of mounted files. Check for both direct secret references through

      env[].valueFrom.secretKeyRef and bulk secret imports through

      envFrom[].secretRef, because either pattern exposes secret data as environment

      variables. Prefer workloads that consume secrets through mounted Secret volumes or

      file based delivery from OCI secrets integrations in'
    severity: medium
- id: 4.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 1
  description: External secret storage for OKE means keeping application secrets outside native Kubernetes Secret objects
    and retrieving them from a managed service such as OCI Vault when workloads need them. This approach lets OKE workloads
    consume secrets through integrations such as the OCI Secrets Store CSI Driver Provider with the Secrets Store CSI Driver,
    instead of relying only on Kubernetes to store and distribute sensitive values.
  rationale: Storing sensitive credentials outside Kubernetes reduces dependence on Secret objects stored inside the cluster
    and shifts lifecycle functions such as encryption, access control, rotation, and audit to a dedicated secrets service.
    In OKE, Pods can retrieve secrets from OCI Vault by using OCI IAM access through OKE workload identity, and the OCI Secrets
    Store CSI Driver Provider can mount those values into Pods as files through the Secrets Store CSI Driver. This model supports
    centralized secret lifecycle management and tighter secret to workload access control than broadly distributing static
    values through Kubernetes manifests.
  impact: Moving to external secret storage usually requires manifest and application changes so workloads fetch or mount
    secrets from OCI Vault instead of reading only native Kubernetes Secret objects, and it may require OKE workload identity
    permissions plus CSI integration components. In return, secret rotation and access management can be handled centrally
    in OCI rather than separately inside each cluster.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengmanagingsecrets.htm
  - 2. https://docs.oracle.com/en-us/iaas/Content/secretmanagement/Concepts/manage-secrets.htm
  page_start: 127
  audit_raw: 'Review the OKE cluster’s secrets architecture and verify that required workloads use an

    external secrets store such as OCI Vault instead of relying only on native Kubernetes

    Secret objects. The audit should confirm both the integration path and the workload

    access model, because external secret storage in OKE typically depends on the OCI

    Secrets Store CSI Driver Provider, the Secrets Store CSI Driver, and OCI IAM access

    through OKE workload identity.

    • Identify workloads that still consume sensitive credentials from native Kubernetes

    Secrets and determine which of those should be moved to OCI Vault.

    • Confirm the external secret integration components are in use, including the OCI

    Secrets Store CSI Driver Provider and Secrets Store CSI Driver, and verify that

    workloads reference a SecretProviderClass where external secrets are

    mounted as files.

    • Verify workload access is limited through OKE workload identity so each

    workload can retrieve only the secrets it is authorized to read.

    • Check whether rotation, access control, and audit requirements are being

    handled in the external store rather than duplicated through static secret values

    embedded in Kubernetes manifests or long lived native Secret objects.'
  remediation: 'Move sensitive application secrets out of native Kubernetes Secret objects and into an

    external store such as OCI Vault. Then update OKE workloads to retrieve those secrets

    through the OCI Secrets Store CSI Driver Provider with the Secrets Store CSI Driver,

    using OCI IAM access through OKE workload identity. This shifts encryption, access

    control, rotation, and auditing to OCI instead of leaving those functions primarily in

    Secret objects stored inside the cluster.

    • Create the required secrets in OCI Vault and define workload access with least

    privilege OCI IAM policies.

    • Install and configure the OCI Secrets Store CSI Driver Provider and the Secrets

    Store CSI Driver for OKE.

    • Update workload manifests to mount external secrets through a

    SecretProviderClass instead of reading only native Kubernetes Secret

    objects.

    • Enable rotation and update the application to read secrets from the mounted path

    so secret lifecycle management is handled centrally in OCI.

    • Move secrets to OCI Vault, mount them into Pods, and limit access with OKE

    workload identity.'
  checks:
  - type: manual_review
    info: 'Review the OKE cluster’s secrets architecture and verify that required workloads use an

      external secrets store such as OCI Vault instead of relying only on native Kubernetes

      Secret objects. The audit should confirm both the integration path and the workload

      access model, because external secret storage in OKE typically depends on the OCI

      Secrets Store CSI Driver Provider, the Secrets Store CSI Driver, and OCI IAM access

      through OKE workload identity.

      • Identify workloads that still consume sensi'
    severity: medium
- id: 4.5.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Namespaces create administrative boundaries in OKE by dividing a cluster into logical partitions for teams,
    applications, or tenants. They are a core building block for multi tenancy, and several controls used to separate workloads,
    including quotas, network policies, and service accounts, apply to namespaces.
  rationale: Namespaces matter operationally because many access and governance controls in Kubernetes and OKE can be applied
    by namespace. Kubernetes Role and RoleBinding objects are used to delegate permissions within a namespace, and OKE uses
    OCI IAM to control access to OKE and the cluster control plane, while Kubernetes RBAC controls what authenticated users
    and service accounts can do inside the cluster. That allows platform teams to grant administrative access to only the
    namespaces a team or workload should manage, rather than granting broad cluster permissions. The namespace boundary becomes
    stronger when it is combined with namespace specific resource and traffic controls. ResourceQuota and LimitRange can constrain
    CPU, memory, and object consumption within a namespace, while network policies can restrict Pod to Pod communication and
    support a least privilege model between tenant or application namespaces. A namespace alone is still only a logical grouping
    construct, so effective administrative separation depends on pairing it with RBAC, OCI IAM access design, quotas, service
    accounts, and network isolation.
  impact: Creating administrative boundaries with namespaces usually requires teams to move workloads out of the default namespace
    and implement namespace specific RBAC, OCI IAM access design, quotas, and network policies. This improves delegation and
    organization, but namespaces by themselves do not provide full isolation.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  page_start: 131
  audit_raw: 'Verify that namespaces are present and are being used as intentional administrative

    boundaries for teams, applications, or environments in the OKE cluster. Namespaces

    are the core logical partition for multi tenancy, and they should be paired with

    namespace specific access controls and namespace level governance such as quotas,

    limits, and network policies. A namespace should be considered adequately

    administered only when it has a clear workload or team purpose, appropriately limited

    access, and the namespace level controls required for that use case.

    • List all namespaces and confirm each has a defined administrative, application,

    or environment purpose. Namespaces are the base partitioning construct for

    multi tenancy in OKE.

    • Verify that user and workload access is limited to the intended namespaces

    through Kubernetes Role and RoleBinding objects and, where used, OCI IAM

    groups mapped through Kubernetes RBAC, rather than broad cluster grants.

    OKE uses OCI IAM to control access to OKE and the cluster control plane, and

    Kubernetes RBAC to control authorization inside the cluster.

    • Review whether namespace level controls such as ResourceQuota,

    LimitRange, service accounts, and network policies are applied where required

    to support separation, resource governance, and Pod to Pod traffic restrictions.

    • Confirm that broad cluster access is limited to identities that truly require it,

    because namespace boundaries alone do not prevent cross tenant or cross

    workload access.

    Inventory checks for OKE Clusters:

    kubectl get namespaces

    kubectl get rolebindings,roles -A

    kubectl get clusterrolebindings,clusterroles

    kubectl get resourcequota,limitrange,networkpolicy -A

    oci iam policy list --compartment-id $COMPARTMENT_ID

    Note: Review OCI IAM policies and group membership for access to OKE and the

    cluster control plane, then review Kubernetes RBAC objects to confirm what those

    authenticated users and service accounts can do inside the cluster.'
  remediation: 'Create separate namespaces for teams, applications, or environments that require their

    own administrative boundary, and move workloads out of the default namespace into

    that managed namespace structure. Make the namespace boundary meaningful by

    limiting access to the intended namespaces, applying namespace level governance

    such as quotas, limits, service accounts, and network policies, and reducing broad

    cluster permissions that bypass the intended separation model. When stronger isolation

    is required for mutually untrusted workloads, use separate clusters rather than relying

    on namespaces alone.

    • Create dedicated namespaces for each team, application, or environment that

    needs its own administrative boundary.

    • Move user workloads out of the default namespace and into the appropriate

    managed namespaces.

    • Rebind access with namespace specific Role and RoleBinding objects and,

    where used, map OCI IAM users or groups to Kubernetes RBAC permissions

    that are limited to the intended namespaces.

    • Apply ResourceQuota, LimitRange, service accounts, and network policies to

    reinforce namespace level governance and traffic separation.

    • Remove unused namespaces and reduce unnecessary broad cluster

    permissions or OCI IAM access that bypass the intended namespace boundary.

    Create dedicated namespaces, move workloads out of default, limit access by

    namespace, and apply quotas, limits, service accounts, and network policies to enforce

    the administrative boundary.'
  checks:
  - type: manual_review
    info: 'Verify that namespaces are present and are being used as intentional administrative

      boundaries for teams, applications, or environments in the OKE cluster. Namespaces

      are the core logical partition for multi tenancy, and they should be paired with

      namespace specific access controls and namespace level governance such as quotas,

      limits, and network policies. A namespace should be considered adequately

      administered only when it has a clear workload or team purpose, appropriately limited

      access, an'
    severity: medium
- id: 4.5.2
  title: Apply securityContext controls to pods and containers
  scoring: manual
  profile:
  - Level 1
  description: Apply Security Context to Your Pods and Containers. For OKE workloads, securityContext controls should be used
    with Pod Security Admission or an equivalent admission policy so pods and containers run with only the operating system
    privileges they require.
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing your containers and pods, make sure that you configure the security context for
    your pods, containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security
    parameters that will be assigned to the pod/container/volume. There are two levels of security context: pod level security
    context, and container level security context. In OKE, PodSecurity is a supported admission controller, and Oracle guidance
    points to Pod Security Standards and the PodSecurity admission controller for enforcing pod security behavior at admission
    time.'
  impact: If you incorrectly apply security contexts, you may have trouble running the pods. Workloads may need manifest updates
    to run as non root, drop unnecessary capabilities, prevent privilege escalation, or satisfy the Pod Security Standard
    enforced in the namespace.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Reference/contengadmissioncontrollers.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingadmissioncontrollers_topic.htm
  page_start: 135
  audit_raw: "Review the pod definitions in your cluster and verify that you have security contexts\ndefined as appropriate.\n\
    Here is a key compliance check in OKE (Oracle Kubernetes Engine) to ensure all Pods\ndefine a securityContext at either\
    \ the pod or container level:\necho -e\n\"NAMESPACE\\tPOD\\tHAS_POD_SECURITY_CONTEXT\\tHAS_CONTAINER_SECURITY_CONTEXT\"\
    \ &&\n\\\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name as\
    \ $pod\n  | (.spec.securityContext != null) as $hasPodSC\n  | ([(.spec.containers[]?.securityContext != null)] | any)\
    \ as\n$hasContainerSC\n  | [$ns, $pod, $hasPodSC, $hasContainerSC] | @tsv\n'\n• HAS_POD_SECURITY_CONTEXT: checks for a\
    \ pod level\n.spec.securityContext\n• HAS_CONTAINER_SECURITY_CONTEXT: verifies if any container in the pod\ndefines .securityContext\n\
    • jq any: returns true if at least one container has a security context\n• -A: Works across all namespaces\nSample Output:\n\
    NAMESPACE     POD\nHAS_POD_SECURITY_CONTEXT    HAS_CONTAINER_SECURITY_CONTEXT\ndefault       file-check              \
    \                 true\ntrue\nkube-system   coredns-bc868476b-g8285                  true\ntrue\nkube-system   csi-oci-node-hsr28\
    \                       true\ntrue\nkube-system   kube-dns-autoscaler-8b86f9c9f-fzqsv       true\ntrue\nkube-system  \
    \ kube-proxy-g949b                         true\ntrue\nkube-system   proxymux-client-5p85m                    true\ntrue\n\
    kube-system   vcn-native-ip-cni-jwxtl                  true\ntrue\ndev           api-service-7dd55b8f65              \
    \     false\nfalse\nAlso review namespace Pod Security Admission labels to confirm workload\nnamespaces enforce the required\
    \ Pod Security Standard.\nkubectl get ns -o json | jq -r '\n  ([\"NAMESPACE\",\"ENFORCE\",\"WARN\",\"AUDIT\"] | @tsv),\n\
    \  (\n    .items[]\n    | [\n        .metadata.name,\n        (.metadata.labels[\"pod-security.kubernetes.io/enforce\"\
    ] // \"-\"),\n        (.metadata.labels[\"pod-security.kubernetes.io/warn\"] // \"-\"),\n        (.metadata.labels[\"\
    pod-security.kubernetes.io/audit\"] // \"-\")\n      ]\n    | @tsv\n  )\n' | column -ts $'\\t'"
  remediation: "Use securityContext settings in workload manifests and enforce the required Pod\nSecurity Standard with Pod\
    \ Security Admission or an equivalent admission policy. Avoid\nusing legacy PodSecurityPolicy manifests for current OKE\
    \ clusters.\nFor normal application workloads, configure pod and container securityContext\nsettings that align to the\
    \ intended security level. Common settings include running as a\nnon root user, disabling privilege escalation, dropping\
    \ unnecessary Linux capabilities,\nrestricting host namespace use, and setting read only root filesystems where the\n\
    application supports it.\nsecurityContext:\n  runAsNonRoot: true\n  allowPrivilegeEscalation: false\n  capabilities:\n\
    \    drop:\n      - ALL\n• Label workload namespaces to enforce the required Pod Security Standard.\nkubectl label ns\
    \ NAMESPACE pod-security.kubernetes.io/enforce=restricted --\noverwrite\n• Add warn and audit labels during rollout if\
    \ you want visibility into violations before\nor alongside enforcement.\nkubectl label ns NAMESPACE pod-security.kubernetes.io/warn=restricted\
    \ --\noverwrite\nkubectl label ns NAMESPACE pod-security.kubernetes.io/audit=restricted --\noverwrite\n• Redeploy affected\
    \ workloads after manifest changes so replacement pods are\nevaluated under the enforced namespace policy. Review system\
    \ namespaces\nseparately because platform components can require different security settings."
  checks:
  - type: manual_review
    info: "Review the pod definitions in your cluster and verify that you have security contexts\ndefined as appropriate.\n\
      Here is a key compliance check in OKE (Oracle Kubernetes Engine) to ensure all Pods\ndefine a securityContext at either\
      \ the pod or container level:\necho -e\n\"NAMESPACE\\tPOD\\tHAS_POD_SECURITY_CONTEXT\\tHAS_CONTAINER_SECURITY_CONTEXT\"\
      \ &&\n\\\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name\
      \ as $pod\n  | (.spec.securityContext != null) as $hasPod"
    severity: medium
- id: 4.5.3
  title: The default namespace should not be used
  scoring: manual
  profile:
  - Level 1
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended team, application, or environment boundary. In OKE, namespaces are a primary logical partition
    for organizing workloads and supporting multi tenancy in a shared cluster.
  rationale: Least privilege administration in OKE depends on using namespaces as intentional operational boundaries. Kubernetes
    Role and RoleBinding objects apply within a namespace, and OKE uses OCI IAM to control access to OKE and the cluster control
    plane, while Kubernetes RBAC controls what authenticated users and service accounts can do inside the cluster. When workloads
    remain in default, access delegation, ownership boundaries, and namespace level governance become harder to separate cleanly.
  impact: Using the default namespace for application workloads weakens administrative separation and makes namespace level
    access control, resource governance, and network segmentation harder to apply consistently.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengbestpractices_topic-Multi-Tenancy-bestpractices.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  page_start: 139
  audit_raw: 'Review the OKE cluster and verify that the default namespace is not being used for

    normal application administration or routine workload placement. Objects that do not

    explicitly specify a namespace are created in default, so the audit should confirm that

    teams, applications, and environments are instead using dedicated namespaces that

    align with namespace level access control, quotas, limits, service accounts, and

    network policies. Namespaces are a logical administrative boundary in OKE, so the goal

    is to confirm that user workloads are intentionally placed outside default and governed

    through namespace level controls.

    • Inventory the default namespace and identify any user-managed Pods,

    Services, ConfigMaps, Secrets, ServiceAccounts, Deployments,

    StatefulSets, DaemonSets, Jobs, CronJobs, Ingresses, Roles,

    RoleBindings, ResourceQuotas, LimitRanges, or NetworkPolicies that still

    exist there.

    kubectl get

    pod,svc,configmap,secret,serviceaccount,deploy,statefulset,daemonset,job,cron

    job,ingress,role,rolebinding,resourcequota,limitrange,networkpolicy -n

    default

    • Verify that access is not effectively centered on default. Review Kubernetes

    Role and RoleBinding assignments for that namespace and review OCI IAM

    policies and group membership for access to OKE and the cluster control plane.

    OKE uses OCI IAM for cluster access and Kubernetes RBAC for authorization

    inside the cluster.

    • Confirm that user workloads have been placed into dedicated namespaces that

    reflect team, application, or environment boundaries, and that namespace level

    controls such as quotas, limits, service accounts, and network policies are

    applied where required. Those controls are what make a namespace an actual

    administrative boundary instead of just a label.

    • Check whether the namespace design reduces shared administrative access and

    naming sprawl. OKE supports namespace based organization with Kubernetes

    RBAC, service accounts, quotas, and network policies used to govern resources

    inside the cluster.

    • Inventory the default namespace, identify user workloads still running there,

    and confirm access and governance are instead aligned to dedicated

    namespaces.'
  remediation: 'Move user workloads out of the default namespace and place them in dedicated

    namespaces that reflect the intended team, application, or environment boundary. In

    OKE, namespaces are the core logical partition for multi tenancy, but they only become

    meaningful administrative boundaries when they are paired with namespace level

    access, service accounts, quotas, limits, and network policies. Because namespaced

    objects are created in default when no namespace is specified, remediation should

    address both existing workloads and the deployment process that created them there.

    • Create dedicated namespaces for each team, application, or environment that

    needs its own administrative boundary.

    • Move user workloads out of the default namespace and into the appropriate

    managed namespaces.

    • Update manifests, Helm values, GitOps definitions, and pipeline defaults so

    namespaced resources explicitly set metadata.namespace and are not created

    in default by omission.

    • Rebind access with namespace level Kubernetes Role and RoleBinding objects

    and, where OCI IAM users or groups are mapped to Kubernetes RBAC, limit the

    resulting Kubernetes permissions to the intended namespaces.

    • Apply namespace level governance such as ResourceQuota, LimitRange,

    dedicated service accounts, and network policies so the namespace boundary

    supports resource control, identity separation, and Pod to Pod traffic isolation.

    • Remove unnecessary user workloads and broad operational access from default,

    and use separate clusters rather than namespaces alone when stronger isolation

    is required for less trusted workloads.

    Move workloads out of default, enforce explicit namespaces in deployment workflows,

    and bind access and governance controls to the target namespaces.'
  checks:
  - type: manual_review
    info: 'Review the OKE cluster and verify that the default namespace is not being used for

      normal application administration or routine workload placement. Objects that do not

      explicitly specify a namespace are created in default, so the audit should confirm that

      teams, applications, and environments are instead using dedicated namespaces that

      align with namespace level access control, quotas, limits, service accounts, and

      network policies. Namespaces are a logical administrative boundary in OKE, so the'
    severity: medium
- id: 5.1.1
  title: Ensure image vulnerability scanning uses OCIR or a third party provider
  scoring: manual
  profile:
  - Level 1
  description: Container image vulnerability scanning helps strengthen the security of OKE workloads by identifying known
    software weaknesses in the images those workloads run. This supports a more secure software supply chain and helps reduce
    the chance that vulnerable images are promoted into Kubernetes environments.
  rationale: Oracle Container Registry can scan images in a repository for security vulnerabilities published in the Common
    Vulnerabilities and Exposures database, using the OCI Vulnerability Scanning service. When image scanning is enabled for
    a repository, newly pushed images are scanned, existing images are scanned based on the configured scan target behavior,
    and images are automatically rescanned when new vulnerabilities are added to the CVE database. Vulnerabilities in container
    image software packages can be exploited to compromise workloads and potentially gain unauthorized access to cluster,
    node, or connected cloud resources. OCIR and approved third party tools can scan container images for known vulnerabilities.
  impact: This control improves detection and prioritization of vulnerable container images, but it also adds operational
    overhead to review findings, rebuild images, and manage registry scan configuration. For OCIR scanning, coverage depends
    on the repositories included in the Vulnerability Scanning configuration, the container scan target, and whether images
    used by OKE workloads are stored in repositories covered by the configured scanner.
  references:
  - 1. https://docs.oracle.com/iaas/Content/Registry/Tasks/registryscanningimagesforv
  - 2. https://docs.oracle.com/en-us/iaas/scanning/using/overview.htm
  page_start: 144
  audit_raw: 'Verify that image vulnerability scanning is enabled for repositories that store images

    used by OKE workloads. For images stored in OCIR, review the Container Registry

    image scanner or OCI Vulnerability Scanning container scan targets and scan results. If

    a third party scanner is used instead, obtain equivalent evidence that images deployed

    to OKE are scanned and that findings are available for review.

    Checks the container scan targets in the compartment. Use it to confirm that OCIR

    repositories used by OKE workloads are included in a Vulnerability Scanning target:

    oci vulnerability-scanning container scan target list --compartment-id

    $COMPARTMENT_ID --all

    • Expected output: JSON showing container scan targets. In that object, look for

    display-name, lifecycle-state, compartment-id, container-scanrecipe-id, and target-registry to confirm which OCIR repositories
    are

    covered.

    Checks the container scan recipes in the compartment. Use it to confirm the scan

    settings applied by the scan target:

    oci vulnerability-scanning container scan recipe list --compartment-id

    $COMPARTMENT_ID --all

    • Expected output: JSON showing container scan recipes. In that object, look for

    display-name, lifecycle-state, scan-settings, and id to confirm the

    recipe used by the scan target.

    Checks the container image scan results. Use it to confirm scan findings exist for

    images in covered OCIR repositories:

    oci vulnerability-scanning container scan result list --compartment-id

    $COMPARTMENT_ID --all

    • Expected output: JSON showing scan reports for container images. Review the

    image path, risk level, lifecycle state, and scan timing to confirm that images

    used by OKE workloads are being scanned and findings are available for review.'
  remediation: 'Enable image vulnerability scanning for OCIR repositories that supply container images

    to OKE workloads, or use an approved third party image scanning provider that

    produces equivalent vulnerability findings before image promotion and deployment. For

    OCIR, configure OCI Vulnerability Scanning with a container scan recipe and target for

    the repositories that store OKE images.

    Identify the OCIR repositories and compartments that provide images to OKE

    workloads. This establishes which repositories must be included in the scanning

    coverage.

    Configure OCI Vulnerability Scanning for the required repositories. Create a container

    image scan recipe in the compartment that will manage the scan configuration.

    oci vulnerability-scanning container scan recipe create --display-name

    $SCAN_RECIPE_NAME --compartment-id $COMPARTMENT_ID --scan-settings

    ''{"scanLevel":"STANDARD"}''

    Generate the target registry JSON template and update it for the OCIR repositories that

    must be scanned.

    oci vulnerability-scanning container scan target create --generate-paramjson-input target-registry > target-registry.json

    Create a container scan target that applies the scan recipe to the selected OCIR

    repositories.

    oci vulnerability-scanning container scan target create --compartment-id

    $COMPARTMENT_ID --container-scan-recipe-id $CONTAINER_SCAN_RECIPE_OCID --

    target-registry file://target-registry.json

    Review vulnerability findings and rebuild, replace, or prevent deployment of images with

    unacceptable risk before they are used by OKE workloads. This makes the control

    operational rather than leaving findings unaddressed.'
  checks:
  - type: manual_review
    info: 'Verify that image vulnerability scanning is enabled for repositories that store images

      used by OKE workloads. For images stored in OCIR, review the Container Registry

      image scanner or OCI Vulnerability Scanning container scan targets and scan results. If

      a third party scanner is used instead, obtain equivalent evidence that images deployed

      to OKE are scanned and that findings are available for review.

      Checks the container scan targets in the compartment. Use it to confirm that OCIR

      repositories '
    severity: medium
- id: 5.1.2
  title: Restrict OKE and Kubernetes API access to required users
  scoring: manual
  profile:
  - Level 1
  description: Restrict access to OKE and Kubernetes API operations to only authorized OCI IAM users, groups, and Kubernetes
    service accounts. Access should be limited based on the user’s required administrative, operational, or workload function.
  rationale: Excessive access to OKE or the Kubernetes API can allow unauthorized users or service accounts to create, modify,
    or delete clusters, node pools, workloads, secrets, and other Kubernetes resources. Oracle documents that OCI IAM controls
    who can manage OKE resources and access the cluster control plane, while Kubernetes RBAC controls what authenticated users
    and service accounts can do inside the cluster.
  impact: Restricting access reduces the chance that a compromised or overprivileged identity can modify cluster configuration,
    deploy unauthorized workloads, access secrets, or disrupt running applications. Care should be taken not to remove access
    from required administrators, automation identities, platform service accounts, or approved operational users.
  references: []
  page_start: 148
  audit_raw: 'For most operations on Kubernetes clusters created and managed by Container Engine

    for Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM)

    provides access control. A user''s permissions to access clusters comes from the groups

    to which they belong. The permissions for a group are defined by policies. Policies

    define what actions members of a group can perform, and in which compartments.

    Users can then access clusters and perform operations based on the policies set for the

    groups they are members of.

    IAM provides control over:

    • whether a user can create or delete clusters

    • whether a user can add, remove, or modify node pools

    • which Kubernetes object create/delete/view operations a user can perform on all

    clusters within a compartment or tenancy

    • See Policy Configuration for Cluster Creation and Deployment.

    In addition to IAM, the Kubernetes RBAC Authorizer can enforce additional access

    control for users on specific clusters via Kubernetes RBAC roles and clusterroles. A

    Kubernetes RBAC role is a collection of permissions. For example, a role might include

    read permission on pods and list permission for pods. A Kubernetes RBAC clusterrole is

    just like a role, but can be used anywhere in the cluster. A Kubernetes RBAC

    rolebinding maps a role to a user or set of users, granting that role''s permissions to

    those users for resources in that namespace. Similarly, a Kubernetes RBAC

    clusterrolebinding maps a clusterrole to a user or set of users, granting that clusterrole''s

    permissions to those users for cluster resources.

    Review OCI IAM policies that grant access to OKE resources.

    oci iam policy list --compartment-id $COMPARTMENT_ID --all

    Review Kubernetes RBAC roles and bindings that grant access inside the cluster.

    kubectl get rolebindings,roles -A

    kubectl get clusterrolebindings,clusterroles

    Confirm that each OCI IAM policy, RoleBinding, and ClusterRoleBinding is tied to a

    documented administrative, operational, or workload requirement.'
  remediation: 'By default, users are not assigned any Kubernetes RBAC roles (or clusterroles) by

    default. So before attempting to create a new role (or clusterrole), you must be assigned

    an appropriately privileged role (or clusterrole). A number of such roles and clusterroles

    are always created by default, including the cluster-admin clusterrole (for a full list,

    see Default Roles and Role Bindings in the Kubernetes documentation). The clusteradmin clusterrole essentially confers
    super-user privileges. A user granted the clusteradmin clusterrole can perform any operation across all namespaces in
    a given cluster.

    Remove or reduce OCI IAM policies that grant unnecessary OKE permissions, and use

    Kubernetes RBAC roles and rolebindings to grant only the required Kubernetes API

    permissions inside the cluster. Avoid granting cluster-admin unless full cluster

    administration is required. Review high privilege service accounts and automation

    identities separately before making changes to avoid disrupting required platform

    operations.'
  checks:
  - type: manual_review
    info: 'For most operations on Kubernetes clusters created and managed by Container Engine

      for Kubernetes, Oracle Cloud Infrastructure Identity and Access Management (IAM)

      provides access control. A user''s permissions to access clusters comes from the groups

      to which they belong. The permissions for a group are defined by policies. Policies

      define what actions members of a group can perform, and in which compartments.

      Users can then access clusters and perform operations based on the policies set for th'
    severity: medium
- id: 5.1.3
  title: Restrict OCIR access for OKE workloads to required image pulls
  scoring: manual
  profile:
  - Level 1
  description: Restricting OCIR access for OKE workload image pulls helps ensure that the identities used to retrieve workload
    images can pull required container images without also receiving broader registry visibility, push, delete, or repository
    management access. In OKE, this applies to the OCI IAM users, groups, cluster policies, and Kubernetes imagePullSecrets
    used to pull images from private OCIR repositories.
  rationale: The OKE runtime image pull path for private OCIR images requires registry credentials and repository access sufficient
    to pull image layers and manifests. Oracle documents that images pulled from OCIR during Kubernetes deployment require
    a Docker registry secret containing OCI credentials, and the workload manifest must reference that secret through imagePullSecrets.
    A pull-only policy is therefore a closer least privilege match for runtime image pulls because it supports image retrieval
    without also granting repository push, delete, visibility, or management actions. A broader OCIR policy is unnecessary
    for workload image pulls because Oracle documents separate policy levels for inspecting repositories, pulling images,
    pushing images, and managing repositories. For image pull access, Oracle documents the read repos permission as the policy
    level that allows pulling images from Container Registry. Broader policies such as manage repos can allow push, repository
    deletion, or repository metadata changes, which are useful for administrators or CI/CD publishers but are not required
    just to start OKE workloads from private OCIR images. Restricting runtime identities to pull-only permissions therefore
    reduces unnecessary registry exposure while still preserving the permissions required for image retrieval.
  impact: This control reduces unnecessary exposure of OCIR repository metadata and administrative actions to runtime identities,
    but the assigned identity must still retain the permissions required to authenticate and pull images. If those pull permissions
    are removed or limited incorrectly, OKE workloads will not be able to retrieve private OCIR images, which can prevent
    pods from starting successfully.
  references:
  - 1. https://docs.oracle.com/iaas/Content/Registry/Concepts/registrypolicyrepoaccess
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengpullingimagesfromocir.htm
  page_start: 151
  audit_raw: "Review the OCI IAM policies, OCIR repository access, and Kubernetes\nimagePullSecrets that apply to the identities\
    \ used by OKE to pull images, and verify that\nthose identities are limited to required image pull access. Focus on the\
    \ OCI identity\nrepresented in the Docker registry secret, any OCI IAM policy that grants the cluster\naccess to OCIR,\
    \ and any repository policy or compartment policy that grants access to\nprivate OCIR repositories. The expected pull\
    \ path requires read repos for image layers\nand manifests, while broader access such as manage repos can allow push,\
    \ delete, and\nrepository management actions that are not required just to pull images.\nIdentify the OCIR repositories\
    \ used by OKE workloads. Review image references in\nworkload manifests and confirm which private repositories are used.\n\
    kubectl get deploy,ds,sts,job,cronjob,pod -A -o json | jq -r '\n  .items[]\n  | .kind as $kind\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $name\n  | (if $kind == \"Pod\" then .spec else .spec.template.spec end) as $spec\n  |\
    \ $spec.containers[]?\n  | select(.image | test(\"ocir|oraclecloud.com\"; \"i\"))\n  | \"\\($ns)\\t\\($kind)/\\($name)\\\
    timage=\\(.image)\"\n'\nIdentify the imagePullSecrets referenced by workloads that pull from private OCIR\nrepositories.\n\
    kubectl get deploy,ds,sts,job,cronjob,pod -A -o json | jq -r '\n  .items[]\n  | .kind as $kind\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $name\n  | (if $kind == \"Pod\" then .spec else .spec.template.spec end) as $spec\n  |\
    \ ($spec.imagePullSecrets // [])[]\n  | \"\\($ns)\\t\\($kind)/\\($name)\\timagePullSecret=\\(.name)\"\n'\nReview the OCI\
    \ IAM policies attached to the compartment or tenancy. Flag policies that\ngrant more OCIR access than required for runtime\
    \ image pulls, such as manage repos,\nbroad repository update permissions, or broad repository delete permissions.\noci\
    \ iam policy list --compartment-id $COMPARTMENT_ID --all\nReview OCIR repositories in the compartment and confirm that\
    \ workload pull identities\nare limited to only the repositories they require.\noci artifacts container repository list\
    \ --compartment-id $COMPARTMENT_ID --\nall\nConfirm the effective permission set is pull-only. Runtime image pull identities\
    \ should be\nlimited to repository authentication and image retrieval, not push, delete, or repository\nmanagement access.\
    \ If broader permissions are present, mark the identity or policy for\nremediation."
  remediation: 'Enforce pull-only OCIR access for OKE workload image pull identities by limiting the

    OCI IAM users, groups, cluster policies, and imagePullSecrets used to retrieve

    private images. The runtime pull path should allow only the repository access required

    to pull image layers and manifests. Broader permissions that allow pushing images,

    deleting repositories, changing repository visibility, or managing repository metadata are

    not required just to start workloads.

    • Identify the OCI identities, groups, policies, and imagePullSecrets used by

    OKE workloads to pull private OCIR images.

    • Remove broader OCIR policies from runtime image pull identities. Avoid granting

    manage repos to identities that only need image pull access.

    • Replace broad repository access with read repos for the required repositories or

    compartments. Oracle documents read repos as the policy level that allows

    pulling images from Container Registry.

    • Allow group <image-puller-group> to read repos in compartment

    <compartment-name>

    • Where possible, limit access to the required repositories by repository name

    condition.

    • Allow group <image-puller-group> to read repos in compartment

    <compartment-name> where all { target.repo.name=/app-prefix*/ }

    • Remove or replace policies that add push, delete, or repository management

    access unless there is a documented operational need.

    • Check workload manifests and Kubernetes imagePullSecrets so only approved

    secrets are used for pulling private OCIR images.

    Retest image pulls after the change. Confirm that OKE workloads can still pull required

    private OCIR images and that the runtime identity no longer has broader repository

    access than needed.'
  checks:
  - type: manual_review
    info: 'Review the OCI IAM policies, OCIR repository access, and Kubernetes

      imagePullSecrets that apply to the identities used by OKE to pull images, and verify that

      those identities are limited to required image pull access. Focus on the OCI identity

      represented in the Docker registry secret, any OCI IAM policy that grants the cluster

      access to OCIR, and any repository policy or compartment policy that grants access to

      private OCIR repositories. The expected pull path requires read repos for image laye'
    severity: medium
- id: 5.1.4
  title: Allow only approved container registries for images used by OKE workloads
  scoring: manual
  profile:
  - Level 1
  description: Allowing only approved container registries for images used by OKE workloads helps reduce supply chain risk
    by limiting where workloads can source their images. This creates a controlled image origin model in which clusters admit
    workloads only from trusted registries and can pair that control with OCIR image signature verification before containers
    are allowed to run.
  rationale: A practical way to enforce this control in OKE is through admission controls that evaluate Kubernetes API requests
    before the requested change is persisted. Those policies can validate image source rules, verify signatures, and reject
    deployments that do not meet the required trust conditions. For images stored in OCIR, OKE supports image verification
    policies that allow deployment only when images are signed with specified master encryption keys from OCI Vault. This
    makes the registry restriction more than a naming convention and turns it into an admission control point tied to trusted
    publishers and approved image sources.
  impact: This control reduces the chance that workloads pull images from unapproved or untrusted registries, but it adds
    administrative overhead because the approved registry policy must be maintained for platform add ons, vendor components,
    and operational exceptions. If the approved registry list is too narrow, admission can deny valid deployments until the
    required registry is explicitly added. When OCIR image verification is enabled, unsigned images or images signed with
    an unapproved key can also be denied.
  references:
  - 1. https://docs.oracle.com/iaas/Content/ContEng/Tasks/contengenforcingsignedima
  - 2. https://docs.oracle.com/iaas/Content/Registry/Tasks/registrysigningimages_topic.
  page_start: 155
  audit_raw: 'Review the image sources currently used by the cluster and the admission controls that

    govern new deployments, then verify that workloads are limited to approved registries

    only. The strongest implementation for this control is an admission policy, because

    admission controllers can reject Kubernetes API requests before objects are persisted.

    For OCIR images, also review OKE image verification policy configuration where signed

    image enforcement is used. Include required Oracle managed image sources for

    platform components and add ons in the approved list.

    Compare every running workload image registry hostname to the approved registry list.

    Any image sourced from an unapproved registry is a finding.

    kubectl get pods -A -o jsonpath=''{range

    .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range

    .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}''

    • Confirm the cluster uses an admission control path that evaluates image source

    before deployment is accepted, rather than relying only on CI/CD checks or

    documented standards.

    • Check the approved registry list. Verify it includes approved OCIR repositories,

    Oracle managed registries required for platform components, and approved third

    party registries if any.

    • Confirm an approved image is accepted and a test image from an unapproved

    registry is rejected at admission time.

    • Verify any additional allowed registries are documented and intentionally

    approved, and where image signing is used, confirm the admission controller

    also validates those trust conditions for approved image sources.'
  remediation: 'Restrict OKE workloads to approved container registries by enforcing image source

    controls at admission time, rather than relying only on CI/CD checks or written

    standards. Enforcement can be implemented with an admission controller so image

    references are checked before the deployment is persisted. For OCIR images, use OKE

    image verification policies when signed image enforcement is required, so only images

    signed with approved OCI Vault keys are admitted. The approved registry list must also

    include the Oracle managed image sources required for platform components and add

    ons.

    • Include approved OCIR repositories, explicitly approved third party registries, and

    Oracle managed registries required for OKE platform components and add ons in

    the approved registry list.

    • Configure an admission control path so image registry source is checked before

    the workload is admitted.

    • Apply the policy to workload namespaces while accounting for system

    namespaces and approved operational exceptions so required platform

    components are not blocked.

    • Configure OKE image verification policies for OCIR images when stronger supply

    chain controls are required, using approved OCI Vault keys.

    • Confirm approved registries are allowed, unapproved registries are denied, and

    update the approved registry list when new add ons, vendor components, or

    trusted registries are introduced.'
  checks:
  - type: manual_review
    info: 'Review the image sources currently used by the cluster and the admission controls that

      govern new deployments, then verify that workloads are limited to approved registries

      only. The strongest implementation for this control is an admission policy, because

      admission controllers can reject Kubernetes API requests before objects are persisted.

      For OCIR images, also review OKE image verification policy configuration where signed

      image enforcement is used. Include required Oracle managed image sourc'
    severity: medium
- id: 5.2.1
  title: Use dedicated Kubernetes service accounts for OKE workloads
  scoring: scored
  profile:
  - Level 1
  description: Using dedicated Kubernetes service accounts for OKE workloads helps isolate OCI permissions by application,
    job, or trust boundary instead of sharing a single identity across multiple workloads. This supports more controlled access
    to OCI services and reduces the security impact if one workload is compromised or misconfigured.
  rationale: A workload that needs OCI access should run with a Kubernetes service account that is used with OKE workload
    identity, and that identity model should be created for each unique permission set an application needs. OKE workload
    identity uses the unique combination of cluster, namespace, and service account to authorize workload access to OCI resources
    through OCI IAM policies. Using a dedicated service account per workload or per permission boundary prevents unrelated
    pods in the same namespace from inheriting the same OCI access and aligns permissions more closely to the actual application
    function.
  impact: This control improves permission isolation and usually makes auditing easier, but it increases the number of service
    accounts, OCI IAM policies, and workload identity configurations that must be created and maintained. If a pod is left
    on the namespace default service account, or if the wrong service account is referenced in the workload spec, the pod
    may fail to access required OCI resources or may run with a broader identity than intended.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contenggrantingworkloadaccesstoresources.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  page_start: 159
  audit_raw: "Review all workloads in the cluster and verify that applications use dedicated\nKubernetes service accounts\
    \ rather than relying on the namespace default service\naccount. Confirm that the namespace default service account has\
    \ only the safe default\ndiscovery access unless additional rights are explicitly required, and verify that pods\nwhich\
    \ do not need Kubernetes API access are not automatically mounting service\naccount tokens. For workloads that need OCI\
    \ access, verify that the referenced service\naccount is configured for OKE workload identity and that the permission\
    \ set matches\nthe application’s actual OCI access requirements. Also confirm that pods cannot bypass\nthe dedicated service\
    \ account model by inheriting broader node or instance principal\nbased credentials where those are used.\nReview each\
    \ namespace default service account and confirm it has no extra\nRoleBindings or ClusterRoleBindings beyond the safe default\
    \ discovery access\nunless explicitly required.\nReview workload manifests and confirm pods explicitly set serviceAccountName\
    \ when\nthey need Kubernetes API or OCI access, rather than falling back to the namespace\ndefault service account.\n\
    Verify automountServiceAccountToken: false is set for pods or default service\naccounts where the application does not\
    \ need Kubernetes API access. Do not treat this\nas a blanket requirement for every workload.\nCheck pods for an explicit\
    \ setting:\nkubectl get pods -A \\\n  -o customcolumns='NAMESPACE:.metadata.namespace,POD:.metadata.name,SERVICEACCOUNT:.spe\n\
    c.serviceAccountName,AUTOMOUNT:.spec.automountServiceAccountToken'\nCheck the default service account in each namespace:\n\
    kubectl get sa -A \\\n  -o customcolumns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,AUTOMOUNT:.automou\nntServiceAccountToken'\
    \ | grep ' default '\n• For workloads that access OCI services, verify the dedicated service account is\nused with the\
    \ intended OKE workload identity configuration and that each unique\npermission set uses its own service account boundary.\n\
    • Verify node or instance principal access is restricted where applicable so pods\ncannot still obtain broader node based\
    \ OCI access after a service account\nidentity model is configured."
  remediation: 'Use dedicated Kubernetes service accounts for OKE workloads and associate OCI

