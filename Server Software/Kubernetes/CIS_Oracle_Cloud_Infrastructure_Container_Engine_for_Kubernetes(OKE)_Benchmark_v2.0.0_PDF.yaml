  remediation: 'Start by reducing every access path that allows reading Kubernetes Secret objects in

    the OKE cluster. Start with OCI IAM access and Kubernetes RBAC permissions,

    because OCI IAM controls access to OKE and the cluster control plane, while

    Kubernetes RBAC controls access to Kubernetes resources such as Secrets. Then

    reduce unnecessary access in Kubernetes RBAC, service accounts, and workload

    identity policies, and replace broad permissions with the narrowest namespace or

    workload scope that still supports the required function.

    • Remove or narrow OCI IAM and Kubernetes RBAC permissions that expose

    Secrets, and prefer namespace access over cluster scope wherever possible.

    • Replace broad RBAC permissions on secrets with the smallest practical Role or

    ClusterRole, and remove unnecessary get, list, or watch access from users,

    groups, and service accounts.

    • Reduce service account access to Secrets to only the workloads that require it,

    and tighten any related workload identity OCI IAM permissions to least privilege.

    • Review broadly deployed workloads and privileged operational service accounts

    first, because their tokens and permissions can increase exposure if the

    workload or node is compromised.

    • Remove stale OCI IAM group mappings or Kubernetes RBAC bindings that still

    place principals into groups with Secrets access.

    • Validate that each remaining Secrets access path is tied to a documented

    operational or workload requirement, and flag any unnecessary access for

    removal.'
