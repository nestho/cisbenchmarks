    • Apply the updated configuration to the managed node pool or self managed node

    build process.

    • Replace, cycle, or rebuild the existing worker nodes, then re-audit the

    replacement nodes using the live kubelet configuration to confirm the effective

    value is false.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

