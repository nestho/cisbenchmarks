      level, and workloads that need OCI access through OKE workload identity should use a

      dedicated s'
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: 'Minimize the admission of privileged containers in OKE by enforcing Pod Security Standards through Pod Security
    Admission or an equivalent policy engine, and restrict privileged workloads to only the limited system or platform namespaces
    that truly require them. Do not generally permit containers to run with securityContext.privileged: true in OKE clusters,
    except for narrowly approved system or platform workloads.'
  rationale: In OKE, a privileged container inherits all Linux capabilities associated with root on the host, which significantly
    weakens container isolation and increases the chance that a compromised workload can interact with the underlying node
    in unsafe ways. Oracle documents that pod security controls can prevent pods from running in privileged mode, and that
    current OKE clusters should use Kubernetes Pod Security Standards and the PodSecurity admission controller where Pod Security
    Policy functionality is required. Using baseline or restricted enforcement helps block privilege escalation patterns during
    admission rather than relying only on runtime detection after the pod has started. If you need to run privileged containers,
    this should be defined in a separate policy and you should carefully check to ensure that only limited service accounts
    and users are given permission to use that policy.
  impact: 'Workloads that depend on privileged mode may be denied admission in namespaces enforcing Pod Security Standards,
    so certain node level agents, device access workloads, or other specialized platform pods may need redesign, tighter access,
    or isolated placement. Pods with spec.containers[].securityContext.privileged: true, spec.initContainers[].securityContext.privileged:
    true, or spec.ephemeralContainers[].securityContext.privileged: true will not be permitted in namespaces enforcing the
    baseline or restricted Pod Security Standard.'
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingpspswithoke.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutk8sversions.htm
  page_start: 97
  audit_raw: "Review the effective Pod Security Admission configuration for every namespace in the\nOKE cluster and verify\
    \ that workload namespaces are set to a policy level that disallows\nprivileged containers. For this control, confirm\
    \ that workload namespaces are not\nunlabeled, not set to privileged, and not relying only on warn or audit where blocking\
    \ is\nrequired. The enforce label should be used where admission blocking is required.\nThen inspect existing pods for\
    \ admitted use of\nspec.containers[].securityContext.privileged,\nspec.initContainers[].securityContext.privileged, and\n\
    spec.ephemeralContainers[].securityContext.privileged. Under the Pod\nSecurity Standards, those fields must be unset or\
    \ false for the baseline and restricted\nprofiles.\nkubectl get pods -A -o json | jq -r '\n  .items[]\n  | .metadata.namespace\
    \ as $ns\n  | .metadata.name as $pod\n  | def scan($type; $list):\n      $list[]?\n      | select(.securityContext.privileged\
    \ == true)\n      | \"\\($ns)/\\($pod)\\t\\($type)=\\(.name)\\tprivileged=true\";\n    scan(\"container\"; .spec.containers),\n\
    \    scan(\"initContainer\"; .spec.initContainers),\n    scan(\"ephemeralContainer\"; .spec.ephemeralContainers)\n'\n\
    Expected Output:\nkube-system/oci-csi-node-9vxcs      container=oci-csi-node-driver\nprivileged=true\nkube-system/oci-csi-node-dgzj8\
    \      container=oci-csi-node-driver\nprivileged=true\nkube-system/kube-proxy-dn9w5        container=kube-proxy\nprivileged=true\n\
    kube-system/kube-proxy-wdm9m        container=kube-proxy\nprivileged=true\nOR\nkubectl get pods --all-namespaces -o json\
    \ | jq '\n  .items[]\n  | select(\n      .metadata.namespace != \"kube-system\"\n      and .spec.containers[]?.securityContext?.privileged\
    \ == true\n    )\n  | {\n      pod: .metadata.name,\n      namespace: .metadata.namespace,\n      container: .spec.containers[].name\n\
    \    }\n'\nReview kube-system separately, because system and platform components may\nrequire elevated settings that should\
    \ not be applied to normal workload namespaces.\nThis command uses jq, a command line JSON processor, to parse the JSON\
    \ output\nfrom kubectl get pods and filter out pods where any container has the\nsecurityContext.privileged flag set to\
    \ true. Please note that you might need to\nadjust the command depending on your specific requirements and the structure\
    \ of your\npod specifications."
  remediation: 'Configure Pod Security Admission on workload namespaces so privileged containers

    are denied when new pods are created. For this control, both baseline and restricted

    disallow privileged containers, but restricted is typically the stronger choice for user

    workloads. Only enforce blocks noncompliant pods. warn and audit are useful during

    rollout, but they do not remediate the issue by themselves.

    Label each workload namespace to enforce restricted.

    kubectl label ns NAMESPACE pod-security.kubernetes.io/enforce=restricted --

    overwrite

    Add warn and audit labels during transition so violations are surfaced before or

    alongside enforcement.

    kubectl label ns NAMESPACE pod-security.kubernetes.io/warn=restricted --

    overwrite

    kubectl label ns NAMESPACE pod-security.kubernetes.io/audit=restricted --

    overwrite

    • Update workload manifests so no regular container, init container, or ephemeral

    container uses securityContext.privileged: true. Under the Pod Security

    Standards, those fields must be unset or false for baseline and restricted profiles.

    • Redeploy or restart affected workloads after the manifest changes so

    replacement pods are evaluated under the enforced namespace policy. Pod

    Security Admission evaluates pods when they are created.

    • Review system namespaces separately and do not apply the same labels

    everywhere without checking platform requirements. System and platform

    components may require elevated settings that should be reviewed and

    approved separately from normal workload namespaces.'
  checks:
  - type: manual_review
    info: 'Review the effective Pod Security Admission configuration for every namespace in the

      OKE cluster and verify that workload namespaces are set to a policy level that disallows

      privileged containers. For this control, confirm that workload namespaces are not

      unlabeled, not set to privileged, and not relying only on warn or audit where blocking is

      required. The enforce label should be used where admission blocking is required.

      Then inspect existing pods for admitted use of

      spec.containers[].security'
    severity: medium
