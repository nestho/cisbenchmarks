      whether the cluster is associated with a customer managed key for Kubernetes secrets

      encryption. Also verify that the key is usable by the cluster and has not been disabled,

      deleted, or stripped of required permissions. A customer managed key associat'
    severity: medium
- id: 5.4.1
  title: Restrict OKE control plane endpoint access using private endpoints or approved CIDRs
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is about reducing exposure of the Kubernetes API server without necessarily making it private
    only. The intended end state is that the OKE Kubernetes API endpoint is placed behind a private endpoint where possible,
    or if a public IP address is assigned, access is limited to approved source CIDRs through OCI network security rules.
    This keeps the control plane reachable for approved administration paths while lowering unnecessary internet exposure.
  rationale: 'OKE exposes the Kubernetes API through an endpoint hosted in a subnet of the cluster VCN. The Kubernetes API
    endpoint subnet can be private or public, and if a public subnet is used, the endpoint can optionally be assigned a public
    IP address. Access to the Kubernetes API endpoint subnet is controlled with network security groups or security lists.
    If the endpoint is private, access is limited to networks that can reach the VCN, such as connected subnets, peered VCNs,
    FastConnect, VPN, or bastion based administration paths. If the endpoint has a public IP address, the endpoint can be
    reached from the internet unless the endpoint subnet’s security rules restrict TCP/6443 to approved source CIDRs. Restricting
    access to an authorized network can provide additional security benefits for your container cluster, including: • Better
    protection from outsider attacks: Restricting the Kubernetes API endpoint to approved CIDRs or private network paths provides
    an additional layer of security by limiting external access to a specific set of addresses you designate, such as those
    that originate from your premises. This helps protect access to your cluster in the case of a vulnerability in the cluster''s
    authentication or authorization mechanism. • Better protection from insider attacks: Restricting endpoint access helps
    protect your cluster from accidental leaks of cluster access credentials from your company''s premises. Leaked credentials
    used from outside approved network paths or approved CIDR ranges are still denied network access.'
  impact: This recommendation gives you a balanced hardening option because it reduces public exposure while preserving approved
    remote administration paths. The tradeoff is operational maintenance of network security rules and the risk of accidental
    lockout if trusted administrator IPs, bastion paths, VPN ranges, FastConnect ranges, or other required source ranges are
    omitted. It is stricter than a public endpoint model open to the internet, but less restrictive than a private only API
    design.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
  page_start: 168
  audit_raw: "Check the OKE Kubernetes API endpoint configuration and determine whether the\nendpoint has a public IP address\
    \ assigned. Also identify the endpoint subnet and any\nnetwork security groups attached to the endpoint.\noci ce cluster\
    \ get \\\n  --cluster-id $CLUSTER_ID \\\n  --query 'data.{endpointConfig:\"endpoint-config\",endpoints:endpoints}' \\\n\
    \  --output json\nExpected Output:\n{\n  \"endpointConfig\": {\n    \"is-public-ip-enabled\": false,\n    \"nsg-ids\"\
    : [\n      \"ocid1.networksecuritygroup.oc1...\"\n    ],\n    \"subnet-id\": \"ocid1.subnet.oc1...\"\n  },\n  \"endpoints\"\
    : {\n    \"private-endpoint\": \"10.0.0.10:6443\",\n    \"public-endpoint\": null\n  }\n}\nOR\n{\n  \"endpointConfig\"\
    : {\n    \"is-public-ip-enabled\": true,\n    \"nsg-ids\": [],\n    \"subnet-id\": \"ocid1.subnet.oc1...\"\n  },\n  \"\
    endpoints\": {\n    \"ipv6-endpoint\": null,\n    \"kubernetes\": null,\n    \"private-endpoint\": \"10.0.0.7:6443\",\n\
    \    \"public-endpoint\": \"132.226.xxx.xxx:6443\",\n    \"vcn-hostname-endpoint\": \"dfd6airtddg...com:6443\"\n  }\n\
    }\n• Note: Check that is-public-ip-enabled is false when the Kubernetes API\nendpoint should be private. If is-public-ip-enabled\
    \ is true, review the\nendpoint subnet security rules and any endpoint network security groups to\nconfirm TCP/6443 is\
    \ limited to approved CIDRs and is not open to 0.0.0.0/0.\nIf the endpoint subnet is returned, review the subnet configuration\
    \ and associated\nsecurity lists.\noci network subnet get \\\n  --subnet-id $ENDPOINT_SUBNET_OCID \\\n  --query 'data.{cidrBlock:\"\
    cidr-block\",prohibitPublicIpOnVnic:\"prohibitpublic-ip-on-vnic\",securityListIds:\"security-list-ids\"}' \\\n  --output\
    \ json\nIf endpoint network security groups are returned, review their ingress rules and confirm\nKubernetes API access\
    \ on TCP/6443 is limited to approved source CIDRs.\noci network nsg rules list \\\n  --nsg-id $NSG_OCID \\\n  --direction\
    \ INGRESS \\\n  --all"
  remediation: "Restrict access to the OKE Kubernetes API endpoint by using a private endpoint where\npossible, or by limiting\
    \ public endpoint access through OCI network security groups or\nsecurity lists. The Kubernetes API endpoint is hosted\
    \ in a VCN subnet, and Oracle\nrecommends using network security groups or security lists to control access to that\n\
    subnet.\nFor new clusters, place the Kubernetes API endpoint in a private subnet when internet\naccess to the API endpoint\
    \ is not required.\noci ce cluster create \\\n  --name $CLUSTER_NAME \\\n  --compartment-id $COMPARTMENT_ID \\\n  --vcn-id\
    \ $VCN_OCID \\\n  --kubernetes-version $KUBERNETES_VERSION \\\n  --endpoint-subnet-id $PRIVATE_ENDPOINT_SUBNET_OCID \\\
    \n  --endpoint-public-ip-enabled false\nIf the Kubernetes API endpoint must have a public IP address, update the endpoint\n\
    subnet security list or endpoint network security group so TCP/6443 is allowed only\nfrom approved administrator, bastion,\
    \ VPN, FastConnect, or automation CIDRs. Do not\nleave Kubernetes API endpoint access open to 0.0.0.0/0 unless there is\
    \ a\ndocumented and approved requirement.\nIf an existing cluster uses a public Kubernetes API endpoint and a private\
    \ endpoint is\nrequired, create or move to an OKE cluster design that places the API endpoint in a\nprivate subnet, then\
    \ update kubeconfig access paths to use the private endpoint\nthrough approved network connectivity such as bastion, VPN,\
    \ FastConnect, or peered\nVCN access."
  checks:
  - type: manual_review
    info: "Check the OKE Kubernetes API endpoint configuration and determine whether the\nendpoint has a public IP address\
      \ assigned. Also identify the endpoint subnet and any\nnetwork security groups attached to the endpoint.\noci ce cluster\
      \ get \\\n  --cluster-id $CLUSTER_ID \\\n  --query 'data.{endpointConfig:\"endpoint-config\",endpoints:endpoints}' \\\
      \n  --output json\nExpected Output:\n{\n  \"endpointConfig\": {\n    \"is-public-ip-enabled\": false,\n    \"nsg-ids\"\
      : [\n      \"ocid1.networksecuritygroup.oc1...\"\n    ],\n    \""
    severity: medium
- id: 5.4.2
  title: Enable private OKE control plane access and disable public IP access
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is the strict private access version of API endpoint hardening. The intended end state
    is that the Kubernetes API server is reachable only from inside the cluster VCN or from a connected private network, and
    there is no internet-reachable public API endpoint at all. This is a pure control plane exposure decision.
  rationale: In OKE, the Kubernetes API endpoint is hosted in a subnet of the cluster VCN. The endpoint is always assigned
    a private IP address, and if the endpoint is placed in a public subnet, it can optionally be assigned a public IP address.
    For private control plane access, place the Kubernetes API endpoint in a private subnet and do not assign a public IP
    address. Administration from outside the VCN must use a private connectivity path, such as peered VCN access, VPN, FastConnect,
    or a bastion. If the Kubernetes API endpoint has no public IP address, internet based kubectl access is not available.
    Access is governed by the endpoint subnet route rules, security lists, and network security groups. If public IP access
    is disabled, approved administrators and automation must reach the private endpoint through an allowed network path. Although
    Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability could potentially expose the
    Kubernetes API publicly with unrestricted access. Additionally, an attacker may be able to identify the current cluster
    and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required, disabling public IP access
    will help prevent such threats, and require the attacker to be on the VCN or an approved connected network to perform
    any attack on the Kubernetes API.
  impact: This recommendation controls for reducing direct exposure of the OKE control plane, but it requires deliberate private
    connectivity for administrators, automation, and any external systems that need Kubernetes API access. If that private
    access path is missing or incomplete, cluster operations, troubleshooting, and deployment tooling can be blocked even
    though the cluster itself is healthy.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
  page_start: 172
  audit_raw: "Check for private endpoint access to the Kubernetes API server\noci ce cluster get \\\n  --cluster-id $CLUSTER_ID\
    \ \\\n  --query 'data.{endpointConfig:\"endpoint-config\",endpoints:endpoints}' \\\n  --output json\nExpected Output:\n\
    {\n  \"endpointConfig\": {\n    \"is-public-ip-enabled\": false,\n    \"nsg-ids\": [\n      \"ocid1.networksecuritygroup.oc1...\"\
    \n    ],\n    \"subnet-id\": \"ocid1.subnet.oc1...\"\n  },\n  \"endpoints\": {\n    \"private-endpoint\": \"10.0.0.10:6443\"\
    ,\n    \"public-endpoint\": null\n  }\n}\nConfirm that is-public-ip-enabled is false, private-endpoint is populated, and\n\
    public-endpoint is null. If is-public-ip-enabled is true or public-endpoint\ncontains a value, public IP access is enabled\
    \ and the cluster does not meet this control."
  remediation: "Use private OKE control plane access by placing the Kubernetes API endpoint in a\nprivate subnet and disabling\
    \ public IP assignment. This keeps Kubernetes API access\non the VCN or an approved private network path.\nFor a new cluster,\
    \ create the Kubernetes API endpoint in a private subnet and do not\nassign a public IP address.\noci ce cluster create\
    \ \\\n  --name $CLUSTER_NAME \\\n  --compartment-id $COMPARTMENT_ID \\\n  --vcn-id $VCN_OCID \\\n  --kubernetes-version\
    \ $KUBERNETES_VERSION \\\n  --endpoint-subnet-id $PRIVATE_ENDPOINT_SUBNET_OCID \\\n  --endpoint-public-ip-enabled false\n\
    For an existing cluster, update the endpoint configuration so the Kubernetes API\nendpoint is not assigned a public IP\
    \ address.\noci ce cluster update-endpoint-config \\\n  --cluster-id $CLUSTER_ID \\\n  --is-public-ip-enabled false\n\
    Note: After changing whether a public IP address is assigned to the Kubernetes API\nendpoint, update route rules and security\
    \ rules appropriately. Validate administrator,\nautomation, and node access through the private endpoint before removing\
    \ any\ntemporary access path."
  checks:
  - type: manual_review
    info: "Check for private endpoint access to the Kubernetes API server\noci ce cluster get \\\n  --cluster-id $CLUSTER_ID\
      \ \\\n  --query 'data.{endpointConfig:\"endpoint-config\",endpoints:endpoints}' \\\n  --output json\nExpected Output:\n\
      {\n  \"endpointConfig\": {\n    \"is-public-ip-enabled\": false,\n    \"nsg-ids\": [\n      \"ocid1.networksecuritygroup.oc1...\"\
      \n    ],\n    \"subnet-id\": \"ocid1.subnet.oc1...\"\n  },\n  \"endpoints\": {\n    \"private-endpoint\": \"10.0.0.10:6443\"\
      ,\n    \"public-endpoint\": null\n  }\n}\nConfirm that is-pu"
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Nodes
  scoring: manual
  profile:
  - Level 1
  description: This recommendation is about the data plane, not the control plane. It means worker nodes are placed in private
    subnets and are not intended to have direct public internet exposure. In the common pattern, nodes run in private subnets
    while internet-facing ingress resources are placed in public subnets. This changes where compute runs and how node traffic
    exits the VCN, but it does not by itself determine whether the Kubernetes API endpoint is public, private, or both.
  rationale: OKE worker nodes are created with public or private IP addresses according to whether public or private subnets
    are specified when defining node pools. Placing nodes in private subnets reduces direct reachability of the worker instances
    and gives tighter control over egress paths. At the same time, those nodes still need access to required services such
    as OCIR for image pulls, and that access must be provided through a NAT gateway, service gateway, or other required private
    network path. In a fully private cluster design with no outbound internet access, the Kubernetes API endpoint and supporting
    OCI services must remain reachable through private connectivity, route rules, and security rules that support node registration,
    image pulls, and required workload operations.
  impact: This reduces direct internet exposure of the worker nodes and usually improves traffic control around the data plane,
    but it increases dependency on NAT design, service gateway access, route tables, security lists, network security groups,
    and private management methods such as bastion or private administrative access patterns. It also does not automatically
    make the control plane private. A cluster can have private nodes and still expose a public API endpoint unless the endpoint
    settings are hardened separately.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengaddingnodepools_topic.htm
  page_start: 175
  audit_raw: "Review the subnets used by each OKE node pool and verify that worker nodes are\ndeployed in private subnets,\
    \ not public subnets. For this control, the deciding evidence\nis node subnet placement, public IP behavior, and subnet\
    \ routing, not the control plane\nendpoint settings. A compliant private-node design places nodes in subnets that prohibit\n\
    public IP assignment on VNICs and do not have a default route to an Internet Gateway.\nIf outbound access is required,\
    \ the design should use a NAT gateway, service gateway,\nor other required private network path instead.\nReview each\
    \ node pool and identify the subnet IDs used by the worker nodes. If the\nnode pool is placed in public subnets, this\
    \ control is not satisfied.\noci ce node-pool list \\\n  --compartment-id $COMPARTMENT_ID \\\n  --cluster-id $CLUSTER_ID\
    \ \\\n  --query 'data[*].{name:name,id:id}' \\\n  --output table\nReview the subnet IDs used by a node pool.\noci ce node-pool\
    \ get \\\n  --node-pool-id $NODE_POOL_ID \\\n  --query 'data.{name:name,subnetId:\"subnet-id\",placementSubnets:\"nodeconfig-details\"\
    .\"placement-configs\"[*].\"subnet-id\"}' \\\n  --output json\n• Expected output: JSON containing the node pool name and\
    \ the subnet ID or\nplacement subnet IDs used by worker nodes. These are the subnets you must\ninspect next. Private node\
    \ compliance is not determined by the node pool alone,\nbut by whether these subnets are actually private.\nReview each\
    \ worker node subnet and verify that public IP assignment is prohibited.\noci network subnet get \\\n  --subnet-id $NODE_SUBNET_OCID\
    \ \\\n  --query 'data.{displayName:\"display-name\",prohibitPublicIpOnVnic:\"prohibitpublic-ip-on-vnic\",routeTableId:\"\
    route-table-id\"}' \\\n  --output json\n• Expected output: prohibitPublicIpOnVnic should be true for worker node\nsubnets\
    \ used by private nodes.\n• Verify the node subnets do not allow public IP assignment. A false value for\nprohibit-public-ip-on-vnic\
    \ indicates that VNICs in the subnet can receive\npublic IP addresses, which is not the intended private node design.\n\
    Verify the route table associated with each node subnet does not contain a default route\nsuch as 0.0.0.0/0 to an Internet\
    \ Gateway. Private subnets can still have outbound\naccess through a NAT gateway or access to OCI services through a service\
    \ gateway,\nbut they should not route directly to an Internet Gateway.\noci network route-table get \\\n  --rt-id $ROUTE_TABLE_OCID\
    \ \\\n  --query 'data.\"route-rules\"' \\\n  --output json\n• Verify the subnets identified for the node pool are intended\
    \ private subnets in the\ncluster VCN design and that nodes do not require direct public IP reachability for\nadministration\
    \ or workload traffic.\nVerify outbound dependencies for private nodes are satisfied through NAT, service\ngateway, or\
    \ required private network paths so nodes can still pull images and reach\nsupporting services without direct public exposure."
  remediation: 'For existing worker nodes that run in public subnets, remediate the nodes by replacing

    them with a new node pool that uses only private subnets, then migrating workloads

    and retiring the original node pool. The target private subnets should prohibit public IP

    assignment on VNICs and should not have a default route to an Internet Gateway. If

    outbound access is required for image pulls or OCI API calls, provide it through a NAT

    gateway, service gateway, or the required private network path instead.

    • Create a new node pool that uses only private subnet IDs. Do not reuse public

    subnets for the replacement worker nodes.

    • Ensure the replacement subnets prohibit public IP assignment on VNICs, so new

    worker instances are launched without public IPs.

    • Ensure the route tables for those subnets do not send 0.0.0.0/0 directly to an

    Internet Gateway. If internet egress is needed, route it through a NAT gateway or

    use a service gateway for supported OCI service access. OCIR image pulls and

    other required service access must remain available through the approved

    private egress design.

    • If custom node pool configuration or instance settings are used, confirm the

    network configuration does not assign public IP addresses or otherwise override

    the private subnet design.'
  checks:
  - type: manual_review
    info: 'Review the subnets used by each OKE node pool and verify that worker nodes are

      deployed in private subnets, not public subnets. For this control, the deciding evidence

      is node subnet placement, public IP behavior, and subnet routing, not the control plane

      endpoint settings. A compliant private-node design places nodes in subnets that prohibit

      public IP assignment on VNICs and do not have a default route to an Internet Gateway.

      If outbound access is required, the design should use a NAT gateway, '
    severity: medium
- id: 5.4.4
  title: Ensure Network Policy is Enabled and set as appropriate
  scoring: manual
  profile:
  - Level 1
  description: Implementing Kubernetes NetworkPolicies in an Oracle Kubernetes Engine (OKE) cluster is a critical security
    measure for controlling and segregating Pod to Pod communication. By default, all pods in a Kubernetes cluster can freely
    communicate with each other, which increases the risk of lateral movement if a single workload is compromised. Enforcing
    network policies allows administrators to explicitly define which pods or namespaces can communicate, ensuring that workloads
    are properly isolated based on function, sensitivity, or compliance requirements. This segregation helps contain potential
    security breaches, limits unauthorized data access between applications, and supports the principle of least privilege
    in network communication, strengthening the overall security posture and reducing the attack surface within the OKE environment.
    Configure NetworkPolicy enforcement and define NetworkPolicy resources to restrict Pod to Pod traffic within a cluster
    and segregate workloads.
  rationale: By default, all pod to pod traffic within a cluster is allowed. NetworkPolicy creates a pod level firewall that
    can be used to restrict traffic between sources. Pod traffic is restricted by having a NetworkPolicy that selects it through
    the use of labels. Once there is any NetworkPolicy in a namespace selecting a particular pod, that pod will reject any
    connections that are not allowed by any NetworkPolicy. Other pods in the namespace that are not selected by any NetworkPolicy
    will continue to accept all traffic. NetworkPolicies are managed via the Kubernetes NetworkPolicy API and enforced by
    a network plugin, so simply creating the resource without a compatible network plugin to implement it will have no effect.
    OKE supports NetworkPolicy enforcement through integration with the Calico network policy engine when using the OCI CNI
    plugin. OKE does not support using the Calico network policy engine with the flannel CNI plugin.
  impact: NetworkPolicy enforcement requires a supported enforcement solution, such as Calico with the OCI CNI plugin, and
    NetworkPolicy resources must be designed carefully so required application, DNS, monitoring, ingress, and egress traffic
    is not blocked. If the cluster uses flannel and NetworkPolicy enforcement is required, Oracle documents that Calico should
    not be installed alongside flannel because that configuration is not supported and can cause network issues. Enabling
    enforcement or changing network policies can affect application connectivity. Test policies in lower environments and
    validate required traffic before applying restrictive policies to production namespaces.
  references:
