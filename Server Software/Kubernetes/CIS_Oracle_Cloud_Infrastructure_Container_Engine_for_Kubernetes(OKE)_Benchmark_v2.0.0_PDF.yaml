  remediation: 'Start by replacing wildcard permissions in custom Role and ClusterRole objects with

    explicitly enumerated verbs, resources, and apiGroups that match the approved

    operational need. In OKE, this remediation should focus on customer managed RBAC

    objects, the bindings that assign them, OCI IAM users and groups mapped through

    Kubernetes RBAC, workload identities, and service accounts used by workloads or

    cluster components. OKE uses OCI IAM for access to OKE and the cluster control

    plane, and Kubernetes RBAC for authorization inside the cluster, so both access paths

    should be reviewed when excessive permissions are found.

    • Replace wildcard values in custom Role and ClusterRole rules with the specific

    verbs, resources, and apiGroups the function actually requires.

    • Reduce or remove any RoleBinding and ClusterRoleBinding that assign

    those wildcard roles more broadly than necessary, and prefer bindings limited to

    the required namespace where possible.

    • Review OCI IAM users and groups mapped through Kubernetes RBAC, because

    those users and groups can receive wildcard permissions through rolebindings

    or clusterrolebindings.

    • Review service accounts for broadly deployed controllers, storage drivers,

    ingress controllers, and other platform components first, and remove wildcard

    permissions that are not required for their runtime behavior.

    • Distinguish customer managed roles from Oracle managed and Kubernetes

    system roles before making changes, and avoid modifying Oracle managed or

    Kubernetes system RBAC objects unless you intentionally want to change how a

    platform component operates.

    • After narrowing the role definition, validate that the user, group, or service

    account can still perform its approved tasks, then remove the superseded

    wildcard role or binding.'
