- id: 3.2.2
  title: Ensure kubelet authorization mode is set to Webhook
  scoring: scored
  profile:
  - Level 1
  description: In OKE, the available kubelet authorization modes are AlwaysAllow and Webhook. For worker nodes, the recommended
    setting is Webhook, which uses the Kubernetes authorization flow to evaluate access to the kubelet API. In contrast, AlwaysAllow
    is not optimal because it bypasses that authorization decision and permits kubelet requests without a webhook-based access
    check. For OKE managed nodes, kubelet configuration should be validated from the effective node configuration and maintained
    through the supported worker node initialization and node pool update process.
  rationale: Oracle documents that OKE managed nodes can use custom cloud-init initialization scripts and that the OKE default
    initialization logic should not be modified. Custom logic, including supported kubelet extra arguments, should be added
    before or after that default logic so worker nodes are built consistently when they join the cluster. In that model, the
    technically correct target is the effective kubelet configuration on the node, with authorization.mode set to Webhook
    instead of an unrestricted mode such as AlwaysAllow.
  impact: Setting kubelet authorization mode to Webhook keeps kubelet access aligned with Kubernetes authorization controls
    on OKE worker nodes. AlwaysAllow is not recommended because it bypasses that authorization check and permits kubelet requests
    without webhook-based access evaluation.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingcustomcloudinitscripts.htm
  - 2. https://docs.oracle.com/iaas/Content/ContEng/Tasks/replace-worker-nodetop.htm
  page_start: 44
  audit_raw: 'To audit whether kubelet authorization is set to Webhook on an OKE worker node,

    query the live effective kubelet configuration through the Kubernetes API server proxy

    and inspect the kubelet configz output for authorization.mode. Kubernetes identifies

    configz as the view of the kubelet’s final actuated configuration, and the kubelet config

    schema defines the valid authorization modes as AlwaysAllow and Webhook. In OKE,

    this is the right place to verify the control because kubelet settings should be validated

    from the effective worker node configuration rather than relying only on visible process

    flags.

    Using the API configz endpoint search for the status of

    authorization.*"mode":"Webhook" by extracting the live configuration from the

    nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 # example host and port number

    export NODE_NAME=10.0.10.25 # example node name from kubectl get nodes

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq # for a more readable output

    Output should show something similar to authorization.*"mode":"Webhook" in the

    output

    To interpret the result:

    • Webhook = Pass. This is the compliant result. Kubernetes documents that

    Webhook mode uses the SubjectAccessReview API to determine authorization.

    • AlwaysAllow = Fail. This is noncompliant because requests are allowed without

    webhook-based authorization.

    • null or missing = Investigate further. Recheck the raw configz output and

    confirm the proxy path and node name are correct, because configz is the

    authoritative view of the final kubelet configuration.'
  remediation: 'If the audit returns AlwaysAllow, the worker node is permitting kubelet requests without

    webhook-based authorization and should be treated as noncompliant. If the result is null

    or the field is missing, first confirm the configz response is complete, because

    Kubernetes identifies that endpoint as the view of the kubelet’s final actuated

    configuration. Once the result is validated, remediation in OKE should be performed

    through the supported worker node initialization, node pool update, or node

    replacement workflow, not by directly editing the kubelet config file on the host. Oracle

    documents that OKE managed nodes can use custom cloud-init initialization scripts,

    that the OKE default logic should not be modified, and that worker node property

    changes apply to new worker nodes.

    Remediation of new cluster

    When creating a new OKE cluster or node group, the goal is to ensure worker nodes

    join the cluster with kubelet authorization already set to Webhook. This is done by

