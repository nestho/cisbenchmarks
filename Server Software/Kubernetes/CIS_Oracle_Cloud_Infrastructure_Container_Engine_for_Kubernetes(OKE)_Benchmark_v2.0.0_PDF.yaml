      accounts, and Pod security controls, because Pod creation can allow an identity to

      launch workloads under available service accounts and potentially exercise both

      Kubernetes '
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used.
  scoring: scored
  profile:
  - Level 1
  description: Default service accounts in OKE should not be used as the active identity for ordinary application or automation
    workloads. If a Pod does not specify a service account, Kubernetes automatically assigns the namespace default service
    account, and that account can authenticate to the Kubernetes API through its mounted token. Workloads that need Kubernetes
    or OCI access should instead use an explicitly assigned, dedicated service account that matches the intended namespace,
    application, and permission boundary.
  rationale: This supports least privilege at the workload identity layer by using a dedicated service account for each application,
    including workloads that need Kubernetes API access or OKE workload identity. This allows RBAC and workload identity to
    be limited to the specific resources and actions required by each application, instead of sharing one namespace identity
    across unrelated Pods. The default service account is especially risky when Pods inherit it implicitly. In OKE, workloads
    are automatically assigned a service account if one is not specified, and service account tokens are automatically mounted
    unless token auto mounting is disabled. For workloads that need OCI access, OKE workload identity uses the unique combination
    of cluster, namespace, and service account to grant access to OCI resources, so relying on the default account makes it
    harder to isolate OCI permissions cleanly and increases the chance that multiple workloads share the same Kubernetes and
    OCI identity path.
  impact: If the default service account is actively used in OKE, multiple Pods in the same namespace can inherit the same
    Kubernetes identity and any linked OCI permissions, which increases security impact, weakens workload isolation, and reduces
    audit clarity when a Pod is compromised or misconfigured.
  references:
  - 1. https://docs.oracle.com/iaas/Content/Security/Reference/oke_security.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  page_start: 89
  audit_raw: "Begin by identifying workloads in OKE that implicitly or explicitly use the namespace\ndefault service account.\
    \ This matters because Pods that do not specify\nserviceAccountName are assigned the default service account, workloads\
    \ that need\nOCI access should use a dedicated service account for OKE workload identity, and\nworkloads that do not need\
    \ Kubernetes API access can disable token auto mounting\nwith automountServiceAccountToken: false.\nReview Deployments,\
    \ StatefulSets, DaemonSets, Jobs, CronJobs, and standalone\nPods for omitted serviceAccountName values or explicit use\
    \ of default.\nkubectl get deploy,sts,ds,job,cronjob,pod -A -o json | jq -r '\n  ([\"NAMESPACE\",\"KIND\",\"NAME\",\"\
    SERVICEACCOUNT\"] | @tsv),\n  (\n    .items[]\n    | if .kind==\"CronJob\" then\n        [.metadata.namespace, .kind,\
    \ .metadata.name,\n(.spec.jobTemplate.spec.template.spec.serviceAccountName // \"default\")]\n      elif .kind==\"Pod\"\
    \ then\n        [.metadata.namespace, .kind, .metadata.name,\n(.spec.serviceAccountName // \"default\")]\n      else\n\
    \        [.metadata.namespace, .kind, .metadata.name,\n(.spec.template.spec.serviceAccountName // \"default\")]\n    \
    \  end\n    | select(.[3]==\"default\")\n    | @tsv\n  )\n' | column -ts $'\\t'\nSample output:\nNAMESPACE   KIND    \
    \      NAME             SERVICEACCOUNT\nkube-public Pod           file-check       default\ndefault     Deployment   \
    \ web-app          default\napps        StatefulSet   orders-db        default\nlogging     DaemonSet     fluentd    \
    \      default\nbatch       Job           nightly-report   default\nReview the default service account in each namespace\
    \ and confirm it is not bound to\nunnecessary RoleBinding or ClusterRoleBinding permissions.\nReview workload specs for\
    \ automountServiceAccountToken: false and confirm it is\nset wherever the workload does not need Kubernetes API access.\
    \ Use the command\nbelow to find the automountServiceAccountToken setting:\nkubectl get serviceaccount $SERVICE_ACCOUNT\
    \ -n $NAMESPACE -o yaml\nReview workloads that use OKE workload identity and confirm they use a dedicated\nservice account\
    \ rather than the namespace default service account.\nFlag any workload that still uses the default service account or\
    \ still auto mounts tokens\nwithout a documented need for remediation."
  remediation: 'Create dedicated service accounts for workloads that need Kubernetes API access or

    OKE workload identity, and update those workloads to explicitly set

    serviceAccountName rather than relying on the namespace default service account.

    For workloads that do not need Kubernetes API access, disable service account token

    auto mounting and avoid using the default service account as the active workload

    identity. Also review the default service account in each namespace and ensure it is not

    bound to unnecessary RBAC permissions.

    Modify the default service account in each application namespace to set:

    automountServiceAccountToken: false

    Then validate workload manifests, because a Pod automountServiceAccountToken

    setting can override the service account setting, and workloads that actually need

    Kubernetes API access must use an explicitly assigned service account instead of

    inheriting default.

    Automatic remediation for one namespace:

    kubectl patch serviceaccount default -n -p ''{"automountServiceAccountToken":

    false}'''
  checks:
  - type: manual_review
    info: 'Begin by identifying workloads in OKE that implicitly or explicitly use the namespace

      default service account. This matters because Pods that do not specify

      serviceAccountName are assigned the default service account, workloads that need

      OCI access should use a dedicated service account for OKE workload identity, and

      workloads that do not need Kubernetes API access can disable token auto mounting

      with automountServiceAccountToken: false.

      Review Deployments, StatefulSets, DaemonSets, Jobs, CronJo'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Service account tokens in OKE should be mounted only for Pods that require Kubernetes API access or an explicitly
    configured workload identity flow. Kubernetes supports disabling automatic token mounting at the Pod or ServiceAccount
    level, and workloads that need OCI access through OKE workload identity should use a dedicated service account rather
    than relying on broad default token mounting.
  rationale: This setting is important because a mounted service account token is an authentication credential. Oracle documents
    that Kubernetes RBAC controls what authenticated users and service accounts can do inside the cluster, and that a service
    account binds pods in a workload to Kubernetes role permissions and grants access to Kubernetes resources. OKE also allows
    this behavior to be controlled either on the Pod spec or on the ServiceAccount, which supports making token mounting an
    intentional workload decision instead of a default behavior. The risk is higher when workload identity is involved. With
    OKE workload identity, a workload is identified by the unique combination of cluster, namespace, and service account,
    and IAM policies can grant that workload access to OCI resources. Oracle workload identity examples also require the workload
    deployment to specify the serviceAccountName and set automountServiceAccountToken to true. If service account tokens are
    mounted more broadly than needed, unnecessary workloads can receive credentials for Kubernetes API access or an approved
    OCI workload identity path.
  impact: If service account tokens are mounted more broadly than necessary in OKE, more Pods than required receive credentials
    that can be used for Kubernetes API access and, in some cases, OCI API access, increasing the security impact of a compromised
    or misconfigured workload.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  - 2. https://docs.oracle.com/iaas/Content/Security/Reference/oke_security.htm
  page_start: 93
  audit_raw: 'Begin by reviewing where service account tokens are mounted in OKE and whether

    each mounted token supports a defined Kubernetes API or workload identity

    requirement. In OKE, Pods can receive a service account token automatically,

    automountServiceAccountToken can be disabled at the Pod or ServiceAccount

    level, and workloads that need OCI access through OKE workload identity should use a

    dedicated service account instead of broad default token mounting.

    • Review Deployments, StatefulSets, DaemonSets, Jobs, CronJobs, and

    standalone Pods for serviceAccountName and

    automountServiceAccountToken, and identify workloads that still rely on

    default token mounting.

    • Review the automountServiceAccountToken setting on both the Pod and its

    associated ServiceAccount, and treat the Pod setting as authoritative where

    both are defined.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml

    Expected Output:

    automountServiceAccountToken: false

    • Review workloads that use OKE workload identity and confirm they use a

    dedicated service account tied to the intended application and permission

    boundary.

    • Review RoleBindings and ClusterRoleBindings for service accounts that still

    mount tokens, and confirm the bound RBAC permissions are limited to the API

    resources and actions the workload actually needs.

    • Review DaemonSets, storage drivers, ingress controllers, and other broadly

    deployed Pods first, because service account permissions and projected tokens

    associated with those workloads can become reachable from any node where

    they run.

    • Review Pods that do not need Kubernetes API access and confirm token

    mounting is disabled, then flag any unnecessary token mount for remediation.'
  remediation: 'Apply the following steps to reduce unnecessary service account token mounting in

    OKE:

    • Set automountServiceAccountToken to false for Pods and ServiceAccounts

    that do not require Kubernetes API access. This reduces unnecessary default

    token auto mounting.

    • Update workloads to use a dedicated serviceAccountName only where a

    service account token is operationally required, instead of inheriting token

    behavior from the namespace default service account. Each application should

    use its own dedicated service account.

    • For workloads that need OCI access, use OKE workload identity with a dedicated

    service account rather than broad default token mounting. OKE workload identity

    uses the combination of cluster, namespace, and service account to grant

    access to OCI resources for the intended workload.

    • Revalidate workloads after the change to confirm that only Pods with a

    documented Kubernetes API or workload identity need continue to receive

    service account tokens.'
