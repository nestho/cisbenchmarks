- id: 3.2.1
  title: Ensure kubelet anonymous authentication is disabled
  scoring: scored
  profile:
  - Level 1
  description: In Oracle OKE, this control means the kubelet on managed or self managed worker nodes must not accept unauthenticated
    requests. OKE worker nodes run kubelet to communicate with the cluster control plane, and kubelet behavior can be configured
    through supported worker node startup or provisioning configuration. This requirement is represented by disabling kubelet
    anonymous authentication rather than relying only on a process list check for --anonymous-auth=false.
  rationale: The kubelet exposes node local functionality on each applicable worker node, and Kubernetes documents that requests
    not rejected by other configured authentication methods are otherwise treated as system:anonymous in the system:unauthenticated
    group. The KubeletConfiguration schema defines authentication.anonymous.enabled as the setting that controls this behavior,
    so the technically correct review point in OKE is the effective kubelet configuration on each applicable managed or self
    managed worker node.
  impact: Disabling kubelet anonymous authentication causes unauthenticated requests to be rejected with 401 Unauthorized
    instead of being processed as anonymous access, which reduces exposure of sensitive node local kubelet endpoints and forces
    callers to use authenticated access paths.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingcustomcloudinitscripts.htm
  - 2. https://docs.oracle.com/iaas/Content/ContEng/Concepts/contengclustersnodes.ht
  page_start: 40
  audit_raw: 'To audit whether kubelet anonymous authentication is disabled on an Oracle OKE

    worker node, query the live kubelet configuration through the Kubernetes API server

    proxy and inspect the configz output. This is preferred over relying only on the kubelet

    process list because kubelet settings can be applied through startup configuration,

    configuration files, or command line arguments.

    Using the API configz endpoint search for the status of authentication...

    "anonymous":{"enabled":false} by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=10.0.10.180 (example node name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq (for a more readable output)

    Output should show something similar to

    "authentication"..."anonymous":{"enabled":false} in the output.

    To interpret the result:

    • false = Pass. Anonymous requests to the kubelet are disabled. Kubernetes

    states that disabling anonymous access causes unauthenticated requests to

    receive 401 Unauthorized.

    • true = Fail. Requests not rejected by another authentication method can be

    treated as system:anonymous in the system:unauthenticated group.

    • null or missing = Investigate further. That would be unexpected for a normal

    kubelet config response because authentication.anonymous is part of the

    kubelet configuration structure; verify that the request reached the kubelet

    successfully and that you are querying the intended node.'
  remediation: 'If the audit returns true, the worker node is allowing anonymous requests to the kubelet

