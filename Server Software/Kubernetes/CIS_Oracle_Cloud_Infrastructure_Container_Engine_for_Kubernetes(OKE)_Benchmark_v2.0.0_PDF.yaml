    \ setup of your environment."
  remediation: 'Update the OKE CNI add on to an Oracle supported version that is compatible with the

    cluster’s Kubernetes version. If automatic add on updates are enabled, confirm the

    cluster is running a supported Kubernetes version so compatible CNI updates can be

    applied. If a specific add on version is selected, verify that the selected version is

    supported for the cluster’s Kubernetes version and update it when Oracle publishes a

    newer supported version.

    For the OCI CNI plugin, apply updates using Oracle’s documented approach. The

    recommended approach is to provision new nodes so they receive CNI plugin pods

    running the latest supported CNI plugin version, then drain and remove nodes running

    older CNI plugin pods when appropriate.

    For existing nodes that must be updated in place, follow Oracle’s documented CNI pod

    recreation process, including any required admission policy changes before deleting

    and recreating the CNI pods.'
