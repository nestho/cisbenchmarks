    provisioning or node update workflow, not by directly editing the kubelet config file on

    the host. OKE supports custom cloud-init scripts for managed nodes, and the corrected

    setting should be applied by creating, cycling, or replacing worker nodes.

    Remediation of new cluster

    When creating a new OKE cluster or node pool, the goal is to ensure worker nodes join

