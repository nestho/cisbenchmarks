- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole objects in Oracle OKE do not use wildcard entries such as * for
    verbs, resources, or apiGroups unless a documented administrative or platform requirement exists. The review should also
    include the RoleBinding and ClusterRoleBinding objects that assign those roles to users, groups, or service accounts,
    because OKE uses OCI IAM to control access to OKE and the cluster control plane, while Kubernetes RBAC controls what authenticated
    users and service accounts can do through the Kubernetes API inside the cluster.
  rationale: This recommendation supports least privilege authorization in OKE Kubernetes RBAC. Oracle documents that OCI
    IAM controls who can use OKE to manage clusters and obtain access to the cluster control plane, while Kubernetes RBAC
    controls what authenticated users and service accounts can do inside the cluster. Oracle also documents that Kubernetes
    RBAC roles, clusterroles, rolebindings, and clusterrolebindings can be used to grant specific permissions to users and
    groups, including OCI IAM users and groups by OCID. In that model, wildcard rules make the effective privilege set harder
    to predict, harder to review, and easier to overextend across current and future resources. The risk is higher for service
    accounts used by broadly deployed controllers or platform components, because those Kubernetes RBAC permissions can be
    exposed if the workload, pod, or node is compromised.
  impact: If wildcard permissions are used broadly in OKE, a user or service account can receive more access than intended
    across namespaces, resource types, or API actions, and that excess access can combine with other OCI IAM permissions or
    workload identity access to widen the impact of compromise. When the affected identity is a broadly deployed service account
    or one linked to OKE workload identity, an excessive RBAC rule can turn a single pod or node issue into unauthorized cluster
    changes or access to OCI APIs beyond the workload’s intended boundary.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  page_start: 81
