- id: 5.4.5
  title: Use TLS certificates on OKE load balancer listeners for encrypted client connections
  scoring: manual
  profile:
  - Level 1
  description: Using TLS certificates on OKE load balancer listeners protects client to load balancer traffic in transit by
    presenting a trusted server certificate and negotiating encrypted HTTPS or TLS connections at the listener. In OKE, this
    commonly means configuring TLS on an OCI Load Balancer created for Kubernetes Service resources, or configuring HTTPS/TLS
    on OCI native ingress controller listeners so externally exposed application entry points do not rely on unencrypted HTTP.
  rationale: OKE supports TLS configuration on the primary load balancer paths used for exposed workloads. For Kubernetes
    Services of type LoadBalancer, OCI Load Balancer listeners can terminate SSL/TLS using Kubernetes secrets or OCI Certificates
    service based certificate configuration. For OCI native ingress controller resources, HTTPS/TLS listeners can be configured
    using either a Kubernetes secret that allows the ingress controller to obtain a certificate from OCI Certificates, or
    a certificate OCID that references a certificate already created in OCI Certificates. This matters because the listener
    is the point where the client session is negotiated, the certificate is presented, and encrypted traffic is established
    before requests are forwarded to targets. OKE also supports backend TLS where the design requires encryption between the
    load balancer and worker nodes or pods, so requiring certificates on client facing load balancer listeners is the baseline
    control for securing the external client connection path.
  impact: This control improves protection against eavesdropping and tampering on client facing connections, but it introduces
    certificate lifecycle and listener configuration requirements. The certificate must match the intended domain names, the
    correct listener ports must be configured for TLS, and expired or missing certificates can break client access even when
    the workload itself is healthy. It also does not by itself guarantee backend encryption beyond the load balancer, because
    traffic from the load balancer to the backend may still be unencrypted unless a separate backend TLS design is implemented.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengcreatingloadbalancers-subtopic.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengcreatingloadbalancer_topicSummaryofannotations.htm
  page_start: 183
  audit_raw: 'Review all OKE Service resources of type LoadBalancer and all Ingress resources that

    expose client traffic, and verify that client facing listeners use HTTPS or TLS with a valid

    certificate. For OCI Load Balancer backed Service resources, listener encryption is

    configured with annotations such as service.beta.kubernetes.io/oci-loadbalancer-ssl-ports and service.beta.kubernetes.io/oci-load-balancertls-secret,
    or with OCI Certificates based configuration where used. For OCI native

    ingress controller resources, HTTPS/TLS listeners require a Kubernetes TLS secret or

    the oci-native-ingress.oraclecloud.com/certificate-ocid annotation. A TCP

    listener on port 443 is a different design because it passes encrypted traffic through

    instead of terminating TLS at the load balancer.

    • Identify all internet facing or client facing LoadBalancer Services and Ingress

    resources.

    • Verify OCI Load Balancer services use service.beta.kubernetes.io/ociload-balancer-ssl-ports and a valid TLS certificate
    source for listener

    encryption.

    • Verify OCI native ingress controller listeners are configured for HTTPS/TLS and

    have the required Kubernetes secret or certificate OCID association.

    • Verify the certificate is valid for the intended hostname and that the listener

    design matches the intended TLS termination point.'
  remediation: 'Configure every client facing OKE load balancer listener to use HTTPS or TLS with a

    valid certificate so client to load balancer traffic is encrypted in transit. For OCI Load

    Balancer backed Service resources, configure SSL/TLS listener ports and associate a

    TLS certificate using Kubernetes secrets or OCI Certificates based configuration. For

    OCI native ingress controller resources, configure HTTPS/TLS listeners and associate

    the required Kubernetes secret or certificate OCID. If the design requires encryption

    beyond the load balancer, implement backend TLS separately because listener TLS

    alone protects only the client facing connection.

    • Add a valid certificate to each client facing OCI Load Balancer or OCI native

    ingress controller listener that should serve encrypted traffic.

    • For OCI Load Balancer services, set service.beta.kubernetes.io/ociload-balancer-ssl-ports to the required listener ports
    and configure the

    appropriate TLS certificate source.

    • For OCI native ingress controller resources, configure HTTPS listeners and

    associate the required certificate source with the listener configuration.

    • Replace or renew invalid certificates and implement backend TLS separately

    where backend encryption is required.'
  checks:
  - type: manual_review
    info: 'Review all OKE Service resources of type LoadBalancer and all Ingress resources that

      expose client traffic, and verify that client facing listeners use HTTPS or TLS with a valid

      certificate. For OCI Load Balancer backed Service resources, listener encryption is

      configured with annotations such as service.beta.kubernetes.io/oci-loadbalancer-ssl-ports and service.beta.kubernetes.io/oci-load-balancertls-secret,
      or with OCI Certificates based configuration where used. For OCI native

      ingress controll'
    severity: medium
