- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create Pods in OKE is a sensitive permission that should be limited to approved deployment and
    operational functions. In OKE, Pod creation is controlled through Kubernetes RBAC after OCI IAM allows access to the cluster
    control plane. Because Pods run within a namespace, use a service account, and can carry workload permissions, Pod creation
    should be limited to the smallest practical namespace and workload boundary.
  rationale: Creating a Pod can allow a principal to run code with the permissions of the service account assigned to that
    Pod. OKE uses Kubernetes service accounts for workloads, and Kubernetes RBAC controls what authenticated users and service
    accounts can do with the Kubernetes API inside the cluster. Those behaviors make Pod creation more than a routine write
    permission, because it can become a path to exercise Kubernetes API permissions indirectly through workload identity.
    The risk can extend beyond Kubernetes RBAC into OCI access. With OKE workload identity, a workload is identified by the
    unique combination of cluster, namespace, and service account, allowing IAM policies to grant that workload access to
    OCI resources. OKE pod security guidance also identifies higher risk Pod behaviors such as privileged execution and hostPath
    usage, which means the ability to create Pods can also expose host or node attack paths if security controls do not constrain
    the Pod spec.
  impact: If Pod creation is granted too broadly in OKE, a user or workload can launch Pods under available service accounts
    and gain unintended Kubernetes or OCI access, increasing the risk of privilege escalation and wider cluster impact.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengclustersnodes.htm
  page_start: 85
  audit_raw: 'Begin by reviewing every path that can grant the ability to create Pods in OKE. Start

    with OCI IAM access to the cluster and Kubernetes RBAC permissions, because OCI

    IAM controls access to OKE and the cluster control plane, while Kubernetes RBAC

    controls authorization inside the cluster. Then review Kubernetes RBAC, service

    accounts, and Pod security controls, because Pod creation can allow an identity to

    launch workloads under available service accounts and potentially exercise both

    Kubernetes and OCI permissions.

    • Review OCI IAM policies and group membership for principals that can access or

    manage the OKE cluster, then confirm whether those principals receive

    Kubernetes RBAC permissions that allow create on pods. Check whether access

    is limited to the required namespace or function.

    • Review Role and ClusterRole assignments that allow create on pods, and also

    review deployments, daemonsets, statefulsets, jobs, and cronjobs,

    because those resources can launch Pods through controllers. Map each role to

    the principals that receive it.

    • Review service accounts used by workloads that can create or run Pods. Check

    for use of the default service account, and confirm whether token auto mounting

    is disabled where Kubernetes API access is not needed.

    • Review workloads that use OKE workload identity, because a Pod created under

    a linked service account can obtain OCI access in addition to Kubernetes API

    access. Confirm the OCI IAM policy is limited to the intended workload.

    • Review whether Pod creation can be paired with privileged execution, hostPath,

    or hostNetwork, and confirm that Pod Security Admission or policy as code

    controls restrict those settings where required.

    • Review OCI IAM group mappings and Kubernetes RBAC bindings, because OKE

    supports mapping OCI IAM users and groups to Kubernetes RBAC

    rolebindings and clusterrolebindings by OCID.

    Summary: Review OCI IAM access, Kubernetes RBAC, service accounts, workload

    identity, and Pod controls to verify that Pod creation is limited and granted only where

    required.'
  remediation: 'Start by reducing every access path that allows Pod creation in OKE. Start with OCI

    IAM access and Kubernetes RBAC permissions, because OCI IAM controls access to

    OKE and the cluster control plane, while Kubernetes RBAC controls access to

    Kubernetes resources such as Pods. Then reduce unnecessary permissions in

    Kubernetes RBAC, service accounts, and Pod security controls so Pod creation is

    limited to approved deployment paths and the smallest practical workload boundary.

    • Remove or narrow OCI IAM and Kubernetes RBAC permissions that allow Pod

    creation, and prefer namespace limited access wherever possible.

    • Replace broad RBAC permissions on pods, deployments, daemonsets,

    statefulsets, jobs, and cronjobs with the smallest Role or ClusterRole that

    supports the approved function.

    • Move workloads off the default service account, use dedicated service accounts,

    and disable automountServiceAccountToken where Kubernetes API access is

    not needed.

    • Tighten OKE workload identity OCI IAM permissions for any service account that

    can run Pods so the linked OCI access is least privilege and specific to the

    workload.

    • Restrict Pod specs that can increase the impact of Pod creation, including

    privileged mode, hostPath, and similar settings, by using Pod Security

    Admission or policy as code controls.

    • Review DaemonSet and other broadly deployed workloads first, because a

    service account used across many nodes can widen the impact of an

    overprivileged Pod creator.

    • Remove stale OCI IAM group mappings or Kubernetes RBAC bindings where

    applicable so Pod creation is not still reachable through unneeded group

    mappings.'
