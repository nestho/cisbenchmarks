- id: 3.2.3
  title: Ensure the kubelet X.509 client CA file is configured
  scoring: scored
  profile:
  - Level 1
  description: This setting in OKE is about configuring the kubelet with a trusted X.509 client CA source so the kubelet can
    validate client certificates presented to its HTTPS endpoint. It is not the same as validating the kubelet’s own serving
    certificate from the API server side. In OKE, kubelet authentication settings should be evaluated in the effective kubelet
    configuration applied during managed node initialization.
  rationale: This setting establishes the trust anchor the kubelet uses for certificate-based client authentication at the
    node level. For OKE, that trust source should not be assumed from the control plane configuration alone. OKE clusters
    have PKI root CAs and cluster credentials, but the kubelet client CA file used for node-level X.509 client authentication
    should still be verified from the live kubelet configuration. Oracle supports managed node customization through cloud-init
    initialization scripts, including supported kubelet extra arguments, while preserving the default OKE initialization logic.
    As a result, if your OKE worker node design depends on X.509 client authentication to the kubelet, the client CA file
    must be intentionally provisioned through the supported node initialization and node pool update path so the node starts
    with a consistent trust source rather than relying on manual host edits or an unsupported configuration workflow.
  impact: If the kubelet X.509 client CA file is not configured, certificate-based clients cannot be validated against a trusted
    CA when connecting to the kubelet, which can break intended X.509-based access patterns or leave that authentication path
    unavailable. In OKE, remediation should be made through managed node initialization or node pool configuration and then
    applied through node replacement, because updated worker node properties are applied when new managed nodes are started
    or existing managed nodes are cycled and replaced.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengusingcustomcloudinitscripts.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Tasks/contengmodifyingnodepool.htm
  page_start: 48
  audit_raw: 'To audit whether kubelet authentication X.509 client CA file is configured on an OKE

    worker node, query the live effective kubelet configuration through the Kubernetes API

    server proxy and inspect the kubelet configz output for

    authentication.x509.clientCAFile. Kubernetes identifies configz as the view of the

    kubelet’s final actuated configuration, and the kubelet config schema defines

    authentication.x509.clientCAFile as the setting used for X.509 client certificate

    authentication. In OKE, this is the right place to verify the control because kubelet

    authentication settings should be validated from the effective node configuration rather

    than only visible process flags.

    Using the api configz endpoint search for the status of

    authentication...clientCAFile by extracting the live configuration from the nodes

    running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name; HOSTNAME_PORT="localhost-and-port-number" NODE_NAME="TheName-Of-Node-To-Extract-Configuration" from the output
    of kubectl get nodes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 # example host and port number

    export NODE_NAME=10.0.10.25 # example node name from kubectl get nodes

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    or

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz" |

    jq # for a more readable output

    Output should show something similar to

    authentication":{"x509":{"clientCAFile":"/etc/kubernetes/ca.crt"}

    To interpret the result:

    • A non-empty path, such as /etc/kubernetes/ca.crt or another valid file path,

    means the setting is configured. This is the expected result for this control

    because the kubelet has a CA bundle path defined for validating client

    certificates.

    • An empty string means the field is present but not configured. Treat this as

    noncompliant for this control because the kubelet does not have a CA bundle

    path configured for X.509 client certificate validation.

    • null or a missing field should be treated as investigate further. Recheck the raw

    configz response and confirm the proxy path and node name are correct,

    because configz is the authoritative view of the final kubelet configuration. In

    OKE, if the value still cannot be verified, review the managed node initialization

    and node pool configuration path because kubelet authentication settings should

    be applied there.'
  remediation: 'If the audit shows that the kubelet X.509 client CA file is not configured, the worker

    node should be treated as noncompliant. If the result is empty, null, or missing, first

    confirm the inspection reflects the effective node configuration. In OKE, remediation

    should be performed through the supported managed node initialization, node pool

    update, or node replacement workflow, because Oracle supports custom cloud-init

    initialization scripts for managed nodes and updated node pool properties are applied

    when replacement managed nodes are started.

    Remediation of new cluster

    When creating a new OKE cluster or node group, the goal is to ensure each worker

    node starts with a trusted client CA bundle already present and with the kubelet

    configured to use it for certificate-based client authentication.

    • Select and manage the CA that will anchor trust for kubelet client certificates,

    consistent with the cluster credential model and the node access design.

    • Use a custom cloud-init initialization script for this kubelet authentication

    customization, since OKE uses cloud-init to initialize managed nodes and

    supports custom initialization logic.

    • Use cloud-init or equivalent managed node initialization customization, when

    needed, to place the CA bundle on the node and point kubelet to that file path.

    Oracle documents that custom logic can be added before or after the default

    OKE initialization logic, but the default logic should not be modified.

    • Validate after deployment that the node has the CA file at the expected path and

    that the kubelet is using the intended authentication configuration.

    Remediation of existing running cluster

    For an existing OKE cluster, the objective is to update the node initialization or node

    pool configuration so future nodes include the required client CA bundle and kubelet

    reference, then replace the current nodes so the change is applied consistently across

    the node group.

    • Prepare an updated custom cloud-init initialization script or equivalent managed

    node configuration that places the CA bundle on the node and configures kubelet

    to use it.

    • If the managed node group already uses a custom cloud-init initialization script,

    update the node pool with the revised initialization script so OKE can apply the

    change to replacement nodes.

    • If the managed node group was not created with a custom initialization script,

    update the existing node pool or create a new node pool with the required cloudinit customization and migrate workloads
    to it.

    • Re-audit the replacement nodes to confirm the client CA file is now configured

    through the intended node build path.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

    worker nodes are discouraged because node behavior is applied through managed

    node initialization, node pool configuration, and node replacement workflows, so hostlevel edits can be lost when nodes
    are recycled or replaced.'
