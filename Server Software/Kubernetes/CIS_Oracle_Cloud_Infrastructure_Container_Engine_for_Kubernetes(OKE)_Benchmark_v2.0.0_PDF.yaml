    or provisioning configuration before nodes join the cluster

    • For managed nodes, update the custom cloud-init script so the OKE initialization

    script passes --anonymous-auth=false through --kubelet-extra-args, then

    replace or cycle the worker nodes so the setting is applied at node startup.

    • Validate the live effective kubelet configuration after deployment to confirm the

