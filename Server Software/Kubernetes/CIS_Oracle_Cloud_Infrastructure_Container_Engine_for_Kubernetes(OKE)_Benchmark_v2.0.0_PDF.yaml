  - type: manual_review
    info: 'This audit reviews Kubernetes ClusterRoleBinding objects in the Oracle OKE cluster

      to identify principals that are directly granted the cluster-admin ClusterRole. It lists

      each matching binding and its associated users, groups, or service accounts so the

      reviewer can verify whether full cluster administrative access is justified. Because OKE

      uses OCI IAM for access to OKE and the cluster control plane, and Kubernetes RBAC

      for cluster authorization, this check should be used as a partial review o'
    severity: medium
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in Oracle OKE is granted only to OCI IAM users or groups, Kubernetes
    users or groups, and service accounts with a defined operational or workload need. The review should cover OCI IAM access
    to the cluster, Kubernetes RBAC roles and bindings, OCI IAM groups mapped through Kubernetes RBAC, workload identities,
    and service account permissions, with particular attention to permissions that allow get, list, or watch access to Secrets.
    Where access is needed, scope it as narrowly as possible, because OKE uses OCI IAM for cluster access and Kubernetes RBAC
    for fine grained cluster authorization.
  rationale: This requirement reduces unnecessary exposure to one of the most sensitive resource types in an OKE cluster.
    Oracle documents that OCI IAM controls who can use OKE to manage clusters and access the cluster control plane, while
    Kubernetes RBAC controls what authenticated users and service accounts can do inside the cluster. Oracle also documents
    that Kubernetes RBAC roles, clusterroles, rolebindings, and clusterrolebindings can be used to grant fine grained permissions
    to users and groups, including OCI IAM users and groups by OCID. Minimizing Secrets access therefore helps prevent broad
    read access from being granted through overlapping OCI IAM, Kubernetes RBAC, and service account authorization paths.
    For workloads, least privilege access should be applied to both Kubernetes service accounts and OCI IAM policies. OKE
    workload identity identifies a workload by the unique combination of cluster, namespace, and service account, and can
    be used to grant fine grained access to OCI resources. Excessive Secrets access combined with overprivileged workload
    identities can then expand a pod or node compromise beyond Kubernetes RBAC into OCI API access.
  impact: If access to Secrets is granted too broadly in OKE, a compromised OCI IAM principal, Kubernetes subject, or service
    account can retrieve sensitive cluster data and use it to expand the scope of an incident across namespaces or into OCI
    services when workload OCI permissions are also available. That increases the likelihood that a single credential exposure,
    pod compromise, or node level breach becomes a wider security event.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengaboutaccesscontrol.htm
  - 2. https://docs.oracle.com/iaas/Content/ContEng/Concepts/contengpolicyconfig.htm
  page_start: 77
  audit_raw: 'Start by reviewing every path that can grant access to Kubernetes Secret objects in the

    OKE cluster. Start with OCI IAM access to the cluster and Kubernetes RBAC

    permissions, because OKE uses OCI IAM to control access to OKE and the cluster

    control plane, while Kubernetes RBAC controls cluster authorization. Then review

