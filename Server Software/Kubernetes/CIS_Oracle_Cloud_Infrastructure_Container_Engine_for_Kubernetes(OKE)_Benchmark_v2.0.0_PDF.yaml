- id: 3.2.4
  title: Ensure the kubelet read-only port is disabled
  scoring: manual
  profile:
  - Level 1
  description: In OKE, this setting is intended to keep kubelet access limited to the standard secured management path used
    for node operations, instead of exposing an additional legacy interface on the worker node. In practice, it should be
    assessed in the node’s effective kubelet configuration because OKE applies managed node behavior through cloud-init initialization,
    node pool configuration, and worker node replacement workflows rather than relying only on visible runtime flags.
  rationale: 'Kubernetes defines readOnlyPort as a read-only kubelet service with no authentication or authorization, and
    specifies that setting readOnlyPort: 0 disables that service. A nonzero value creates an extra listener that is separate
    from the main kubelet serving port. In OKE, Oracle network configuration examples identify TCP port 10250 as the path
    used by the Kubernetes API endpoint to communicate with worker nodes, so the preferred design is to keep kubelet access
    consolidated on that standard endpoint and leave the unauthenticated read-only service disabled. Because OKE uses cloud-init
    initialization scripts and node pool configuration for managed node customization, this state should be enforced through
    the node’s managed configuration path.'
  impact: Disabling the kubelet readOnlyPort removes an unnecessary unauthenticated kubelet service while preserving the standard
    kubelet access path OKE uses on port 10250.
