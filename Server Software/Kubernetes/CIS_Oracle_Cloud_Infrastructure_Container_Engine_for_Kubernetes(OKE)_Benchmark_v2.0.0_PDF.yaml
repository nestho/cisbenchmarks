    Remediation of existing running cluster

    For an existing OKE cluster, the objective is to change the node initialization or node

    pool configuration and then replace the current nodes so the corrected kubelet setting is

    applied consistently across the node group. This ensures the fix is durable and survives

    restart, scale-out, and node replacement events.

    • Update the custom cloud-init initialization script or equivalent worker node

    initialization configuration so the effective kubelet setting becomes

    authorization.mode: Webhook.

    • Apply the updated worker node configuration to the managed node pool so OKE

    launches replacement nodes with the corrected configuration.

    • Replace or roll the existing nodes so the running fleet is rebuilt from the updated

    node pool configuration. Oracle documents that worker node property changes

    apply to new worker nodes and that managed nodes can be cycled or replaced

    so updated node pool properties are applied.

    • Re-audit the replacement nodes using the live kubelet configuration to confirm

    the effective value is Webhook.

    Note: Even though it is tempting to do so, direct edits to the kubelet config file on OKE

    worker nodes are discouraged because OKE applies worker node initialization through

    cloud-init and node pool configuration, while Kubernetes allows effective values to be

    influenced by multiple configuration sources. As a result, a host-level edit may be

