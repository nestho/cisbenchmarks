- id: 4.3.2
  title: Ensure workload namespaces have required NetworkPolicies defined
  scoring: manual
  profile:
  - Level 1
  description: Use network policies to isolate traffic in your cluster network. For OKE, ensure workload namespaces have required
    NetworkPolicies defined and that the selected networking configuration supports NetworkPolicy enforcement.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. NetworkPolicies apply to namespaces. When a network policy is introduced to a given
    namespace, all traffic not allowed by the policy is denied. However, if there are no network policies in a namespace all
    traffic will be allowed into and out of the pods in that namespace. In OKE, NetworkPolicy enforcement requires a supported
    network policy solution. Oracle supports NetworkPolicy enforcement with Calico when using the OCI CNI plugin, and does
    not support using the Calico network policy engine with the flannel CNI plugin.
  impact: Once network policies are in use within a given namespace, traffic not explicitly allowed by a network policy will
    be denied. As such it is important to ensure that, when introducing network policies, legitimate traffic is not blocked.
    NetworkPolicies that are defined without a supported enforcement mechanism will not provide the intended traffic isolation.
  references:
  - 1. https://docs.oracle.com/iaas/Content/ContEng/Tasks/contengsettingupcalico.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/ContEng/Concepts/contengpodnetworking.htm
  page_start: 120
  audit_raw: "Run the below command and review the NetworkPolicy objects created in the cluster.\nThis command will list all\
    \ namespaces in your OKE cluster that have one or more\nNetworkPolicy objects defined:\necho -e \"NAMESPACE\\tNETWORKPOLICY_COUNT\"\
    \ && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do\n  count=$(kubectl get networkpolicy\
    \ -n \"$ns\" --no-headers 2>/dev/null | wc -l\n| tr -d ' ')\n  if [ \"$count\" -gt 0 ]; then\n    echo -e \"${ns}\\t${count}\"\
    \n  fi\ndone\nOR show namespaces that do not have Network Policies defined\necho -e \"NAMESPACES_WITHOUT_NETWORKPOLICIES\"\
    \ && \\\nfor ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do\n  if ! kubectl get networkpolicy -n\
    \ \"$ns\" --no-headers 2>/dev/null | grep -q\n.; then\n    echo \"$ns\"\n  fi\ndone\nEnsure that each workload namespace\
    \ defined in the cluster has at least one Network\nPolicy. Review system and platform namespaces separately, because they\
    \ may require\ndifferent network rules. Also confirm that NetworkPolicy enforcement is supported by\nthe cluster networking\
    \ configuration."
  remediation: 'Follow the documentation and create NetworkPolicy objects as you need them. For

    OKE, define NetworkPolicies for workload namespaces based on the required

    allowed ingress and egress traffic, and confirm that the cluster uses a supported

    NetworkPolicy enforcement model.

    Clusters created with OKE use either the OCI CNI plugin or the flannel CNI plugin for

    pod networking, depending on the cluster network type and creation path. Oracle

    supports NetworkPolicy enforcement through Calico when using the OCI CNI plugin.

    Oracle does not support using the Calico network policy engine with the flannel CNI

    plugin.

    If the cluster uses the OCI CNI plugin, install and configure Calico network policy

    enforcement using Oracle’s documented process, then create the required namespace

    NetworkPolicies.

    If the cluster uses flannel and NetworkPolicy enforcement is required, follow Oracle’s

    documented migration or replacement approach rather than installing Calico alongside

    flannel. Oracle notes that installing the Calico network policy engine alongside flannel

    can cause network issues and is not supported.'
  checks:
  - type: command
    command: if ! kubectl get networkpolicy -n "$ns" --no-headers 2>/dev/null | grep -q
    expected: ''
    severity: medium
