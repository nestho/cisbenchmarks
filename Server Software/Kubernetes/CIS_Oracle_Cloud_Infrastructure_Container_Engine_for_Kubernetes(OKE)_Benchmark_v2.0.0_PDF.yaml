    For an existing OKE cluster, the objective is to change the node pool or provisioning

    configuration and then replace the current nodes so the corrected kubelet setting is

    applied consistently across the node pool. This ensures the fix is durable and survives

    restart, scale out, and node replacement events.

    • Update the custom cloud-init script or equivalent node provisioning configuration

