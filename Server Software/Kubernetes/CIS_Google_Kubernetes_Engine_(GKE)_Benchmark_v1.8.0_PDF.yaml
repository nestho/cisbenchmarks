- id: 5.5.3
  title: Ensure Node Auto-Upgrade is Enabled for GKE Nodes
  scoring: scored
  profile:
  - Level 2
  description: Node auto-upgrade keeps nodes at the current Kubernetes and OS security patch level to mitigate known vulnerabilities.
  rationale: Node auto-upgrade helps you keep the nodes in the cluster or node pool up to date with the latest stable patch
    version of Kubernetes as well as the underlying node operating system. Node auto-upgrade uses the same update mechanism
    as manual node upgrades. Node pools with node auto-upgrade enabled are automatically scheduled for upgrades when a new
    stable Kubernetes version becomes available. When the upgrade is performed, the Node pool is upgraded to match the current
    cluster master version. From a security perspective, this has the benefit of applying security updates automatically to
    the Kubernetes Engine when security fixes are released.
  impact: 'Enabling node auto-upgrade does not cause the nodes to upgrade immediately. Automatic upgrades occur at regular
    intervals at the discretion of the Kubernetes Engine team. To prevent upgrades occurring during a peak period for the
    cluster, a maintenance window should be defined. A maintenance window is a four-hour timeframe that can be chosen, during
    which automatic upgrades should occur. Upgrades can occur on any day of the week, and at any time within the timeframe.
    To prevent upgrades from occurring during certain dates, a maintenance exclusion should be defined. A maintenance exclusion
    can span multiple days. Note: As part of the GKE node Auto-Upgrade process, the node is recreated. When a node is created,
    it automatically receives the latest version of the node image. For COS images, this is the primary OS upgrade mechanism.'
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/node-auto-upgrades
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/maintenance-windowsand-exclusions
