- id: 5.1.2
  title: Minimize user access to Container Image repositories
  scoring: manual
  profile:
  - Level 2
  description: 'Note: GCR is now deprecated, see the references for more details. Restrict user access to GCR or AR, limiting
    interaction with build images to only authorized personnel and service accounts.'
  rationale: Weak access control to GCR or AR may allow malicious users to replace built images with vulnerable or back-doored
    containers.
  impact: Care should be taken not to remove access to GCR or AR for accounts that require this for their operation. Any account
    granted the Storage Object Viewer role at the project level can view all objects stored in GCS for the project.
  references:
  - 1. https://cloud.google.com/container-registry/docs/
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/service-accounts
  page_start: 87
  audit_raw: 'For Images Hosted in AR:

    1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

    2. From the list of artifacts select each repository with format Docker

    3. Under the Permissions tab, review the roles for each member and ensure only

    authorized users have the Artifact Registry Administrator, Artifact Registry

    Reader, Artifact Registry Repository Administrator and Artifact Registry Writer

    roles.

    Users may have permissions to use Service Accounts and thus Users could inherit

    privileges on the AR repositories. To check the accounts that could do this:

    1. Go to IAM by visiting https://console.cloud.google.com/iam-admin/iam

    2. Apply the filter Role: Service Account User.

    Note that other privileged project level roles will have the ability to write and modify AR

    repositories. Consult the GCP CIS benchmark and IAM documentation for further

    reference.

    Using Command Line:

    gcloud artifacts repositories get-iam-policy <repository-name> --location

    <repository-location>

    The output of the command will return roles associated with the AR repository and

    which members have those roles.

    For Images Hosted in GCR:

    Using Google Cloud Console:

    GCR bucket permissions

    1. Go to Storage Browser by visiting

    https://console.cloud.google.com/storage/browser

    2. From the list of storage buckets, select

    artifacts.<project_id>.appspot.com for the GCR bucket

    3. Under the Permissions tab, review the roles for each member and ensure only

    authorized users have the Storage Admin, Storage Object Admin, Storage Object

    Creator, Storage Legacy Bucket Owner, Storage Legacy Bucket Writer and

    Storage Legacy Object Owner roles.

    Users may have permissions to use Service Accounts and thus Users could inherit

    privileges on the GCR Bucket. To check the accounts that could do this:

    1. Go to IAM by visiting https://console.cloud.google.com/iam-admin/iam

    2. Apply the filter Role: Service Account User.

    Note that other privileged project level roles will have the ability to write and modify

    objects and the GCR bucket. Consult the GCP CIS benchmark and IAM documentation

    for further reference.

    Using Command Line:

    To check GCR bucket specific permissions

    gsutil iam get gs://artifacts.<project_id>.appspot.com

    The output of the command will return roles associated with the GCR bucket and which

    members have those roles.

    Additionally, run the following to identify users and service accounts that hold privileged

    roles at the project level, and thus inherit these privileges within the GCR bucket:

    gcloud projects get-iam-policy <project_id> \

    --flatten="bindings[].members" \

    --format=''table(bindings.members,bindings.role)'' \

    --filter="bindings.role:roles/storage.admin OR

    bindings.role:roles/storage.objectAdmin OR

    bindings.role:roles/storage.objectCreator OR

    bindings.role:roles/storage.legacyBucketOwner OR

    bindings.role:roles/storage.legacyBucketWriter OR

    bindings.role:roles/storage.legacyObjectOwner"

    The output from the command lists the service accounts that have create/modify

    permissions.

    Users may have permissions to use Service Accounts and thus Users could inherit

    privileges on the GCR Bucket. To check the accounts that could do this:

    gcloud projects get-iam-policy <project_id>  \

    --flatten="bindings[].members" \

    --format=''table(bindings.members)'' \

    --filter="bindings.role:roles/iam.serviceAccountUser"

    Note that other privileged project level roles will have the ability to write and modify

    objects and the GCR bucket. Consult the GCP CIS benchmark and IAM documentation

    for further reference.'
  remediation: 'For Images Hosted in AR:

    Using Google Cloud Console:

    1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

    2. From the list of artifacts select each repository with format Docker

    3. Under the Permissions tab, modify the roles for each member and ensure only

    authorized users have the Artifact Registry Administrator, Artifact Registry

    Reader, Artifact Registry Repository Administrator and Artifact Registry Writer

    roles.

    Using Command Line:

    gcloud artifacts repositories set-iam-policy <repository-name> <path-topolicy-file> --location <repository-location>

    To learn how to configure policy files see: https://cloud.google.com/artifactregistry/docs/access-control#grant

    For Images Hosted in GCR:

    Using Google Cloud Console:

    To modify roles granted at the GCR bucket level:

    1. Go to Storage Browser by visiting:

    https://console.cloud.google.com/storage/browser.

    2. From the list of storage buckets, select

    artifacts.<project_id>.appspot.com for the GCR bucket

    3. Under the Permissions tab, modify permissions of the identified member via the

    drop-down role menu and change the Role to Storage Object Viewer for readonly access.

    For a User or Service account with Project level permissions inherited by the GCR

    bucket, or the Service Account User Role:

    1. Go to IAM by visiting: https://console.cloud.google.com/iam-admin/iam

    2. Find the User or Service account to be modified and click on the corresponding

    pencil icon.

    3. Remove the create/modify role (Storage Admin / Storage Object Admin /

    Storage Object Creator / Service Account User) on the user or service

    account.

    4. If required add the Storage Object Viewer role - note with caution that this

    permits the account to view all objects stored in GCS for the project.

    Using Command Line:

    To change roles at the GCR bucket level:

    Firstly, run the following if read permissions are required:

    gsutil iam ch <type>:<email_address>:objectViewer

    gs://artifacts.<project_id>.appspot.com

    Then remove the excessively privileged role (Storage Admin / Storage Object

    Admin / Storage Object Creator) using:

    gsutil iam ch -d <type>:<email_address>:<role>

    gs://artifacts.<project_id>.appspot.com

    where:

    • <type> can be one of the following:

    o user, if the <email_address> is a Google account.

    o serviceAccount, if <email_address> specifies a Service account.

    o <email_address> can be one of the following:

    § a Google account (for example, someone@example.com).

    § a Cloud IAM service account.

    To modify roles defined at the project level and subsequently inherited within the GCR

    bucket, or the Service Account User role, extract the IAM policy file, modify it

    accordingly and apply it using:

    gcloud projects set-iam-policy <project_id> <policy_file>'
  checks:
  - type: manual_review
    info: 'For Images Hosted in AR:

      1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

      2. From the list of artifacts select each repository with format Docker

      3. Under the Permissions tab, review the roles for each member and ensure only

      authorized users have the Artifact Registry Administrator, Artifact Registry

      Reader, Artifact Registry Repository Administrator and Artifact Registry Writer

      roles.

      Users may have permissions to use Service Accounts and thus Users could inheri'
    severity: medium
- id: 5.1.3
  title: Minimize cluster access to read-only for Container Image repositories
  scoring: manual
  profile:
  - Level 2
  description: 'Note: GCR is now deprecated, see the references for more details. Configure the Cluster Service Account with
    Artifact Registry Viewer Role to only allow read-only access to AR repositories. Configure the Cluster Service Account
    with Storage Object Viewer Role to only allow read-only access to GCR.'
  rationale: The Cluster Service Account does not require administrative access to GCR or AR, only requiring pull access to
    containers to deploy onto GKE. Restricting permissions follows the principles of least privilege and prevents credentials
    from being abused beyond the required role.
  impact: A separate dedicated service account may be required for use by build servers and other robot users pushing or managing
    container images. Any account granted the Storage Object Viewer role at the project level can view all objects stored
    in GCS for the project.
  references:
  - 1. https://cloud.google.com/container-registry/docs/
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/service-accounts
  page_start: 92
  audit_raw: 'For Images Hosted in AR:

    Using Google Cloud Console

    1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

    2. From the list of repositories, for each repository with Format Docker

    3. Under the Permissions tab, review the role for GKE Service account and ensure

    that only the Artifact Registry Viewer role is set.

    Using Command Line:

    gcloud artifacts repositories get-iam-policy <repository-name> --location

    <repository-location>

    The output of the command will return roles associated with the AR repository. If listed,

    ensure the GKE Service account is set to "role":

    "roles/artifactregistry.reader".

    For Images Hosted in GCR:

    Using Google Cloud Console

    1. Go to Storage Browser by visiting

    https://console.cloud.google.com/storage/browser

    2. From the list of storage buckets, select

    artifacts.<project_id>.appspot.com for the GCR bucket

    3. Under the Permissions tab, review the role for GKE Service account and ensure

    that only the Storage Object Viewer role is set.

    Using Command Line

    GCR bucket permissions

    gsutil iam get gs://artifacts.<project_id>.appspot.com

    The output of the command will return roles associated with the GCR bucket. If listed,

    ensure the GKE Service account is set to "role": "roles/storage.objectViewer".

    If the GKE Service Account has project level permissions that are inherited within the

    bucket, ensure that these are not privileged:

    gcloud projects get-iam-policy <project_id> \

    --flatten="bindings[].members" \

    --format=''table(bindings.members,bindings.role)'' \

    --filter="bindings.role:roles/storage.admin OR

    bindings.role:roles/storage.objectAdmin OR

    bindings.role:roles/storage.objectCreator OR

    bindings.role:roles/storage.legacyBucketOwner OR

    bindings.role:roles/storage.legacyBucketWriter OR

    bindings.role:roles/storage.legacyObjectOwner"

    Your GKE Service Account should not be output when this command is run.'
  remediation: 'For Images Hosted in AR:

    Using Google Cloud Console:

    1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

    2. From the list of repositories, for each repository with Format Docker

    3. Under the Permissions tab, modify the permissions for GKE Service account and

    ensure that only the Artifact Registry Viewer role is set.

    Using Command Line:

    Add artifactregistry.reader role

    gcloud artifacts repositories add-iam-policy-binding <repository> \

    --location=<repository-location> \

    --member=''serviceAccount:<email-address>'' \

    --role=''roles/artifactregistry.reader''

    Remove any roles other than artifactregistry.reader

    gcloud artifacts repositories remove-iam-policy-binding <repository> \

    --location <repository-location> \

    --member=''serviceAccount:<email-address>'' \

    --role=''<role-name>''

    For Images Hosted in GCR:

    Using Google Cloud Console:

    For an account explicitly granted access to the bucket:

    1. Go to Storage Browser by visiting:

    https://console.cloud.google.com/storage/browser.

    2. From the list of storage buckets, select

    artifacts.<project_id>.appspot.com for the GCR bucket.

    3. Under the Permissions tab, modify permissions of the identified GKE Service

    Account via the drop-down role menu and change to the Role to Storage

    Object Viewer for read-only access.

    For an account that inherits access to the bucket through Project level permissions:

    1. Go to IAM console by visiting: https://console.cloud.google.com/iam-admin.

    2. From the list of accounts, identify the required service account and select the

    corresponding pencil icon.

    3. Remove the Storage Admin / Storage Object Admin / Storage Object

    Creator roles.

    4. Add the Storage Object Viewer role - note with caution that this permits the

    account to view all objects stored in GCS for the project.

    5. Click SAVE.

    Using Command Line:

    For an account explicitly granted to the bucket:

    Firstly add read access to the Kubernetes Service Account:

    gsutil iam ch <type>:<email_address>:objectViewer

    gs://artifacts.<project_id>.appspot.com

    where:

    • <type> can be one of the following:

    o user, if the <email_address> is a Google account.

    o serviceAccount, if <email_address> specifies a Service account.

    o <email_address> can be one of the following:

    § a Google account (for example, someone@example.com).

    § a Cloud IAM service account.

    Then remove the excessively privileged role (Storage Admin / Storage Object

    Admin / Storage Object Creator) using:

    gsutil iam ch -d <type>:<email_address>:<role>

    gs://artifacts.<project_id>.appspot.com

    For an account that inherits access to the GCR Bucket through Project level

    permissions, modify the Projects IAM policy file accordingly, then upload it using:

    gcloud projects set-iam-policy <project_id> <policy_file>'
  checks:
  - type: manual_review
    info: 'For Images Hosted in AR:

      Using Google Cloud Console

      1. Go to Artifacts Browser by visiting https://console.cloud.google.com/artifacts

      2. From the list of repositories, for each repository with Format Docker

      3. Under the Permissions tab, review the role for GKE Service account and ensure

      that only the Artifact Registry Viewer role is set.

      Using Command Line:

      gcloud artifacts repositories get-iam-policy <repository-name> --location

      <repository-location>

      The output of the command will return roles '
    severity: medium
- id: 5.1.4
  title: Ensure only trusted container images are used
  scoring: manual
  profile:
  - Level 2
  description: Use Binary Authorization to allowlist (whitelist) only approved container registries.
  rationale: Allowing unrestricted access to external container registries provides the opportunity for malicious or unapproved
    containers to be deployed into the cluster. Ensuring only trusted container images are used reduces this risk.
  impact: All container images to be deployed to the cluster must be hosted within an approved container image registry. If
    public registries are not on the allowlist, a process for bringing commonly used container images into an approved private
    registry and keeping them up to date will be required.
  references:
  - 1. https://cloud.google.com/binary-authorization/docs/policy-yaml-reference
  - 2. https://cloud.google.com/binary-authorization/docs/setting-up
  page_start: 96
  audit_raw: "Using Google Cloud Console: To check that Binary Authorization is enabled for the\nGKE cluster:\n1. Go to the\
    \ Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list\n2. Select the cluster for which Binary\
    \ Authorization is disabled.\n3. Under the details pane, within the Security section, ensure that 'Binary\nAuthorization'\
    \ is set to 'Enabled'. Then, assess the contents of the policy:\n4. Go to Binary Authorization by visiting:\nhttps://console.cloud.google.com/security/binary-authorization\n\
    5. Ensure a policy is defined and the project default rule is not configured to 'Allow\nall images'.\nUsing Command Line:\n\
    Check that Binary Authorization is enabled for the GKE cluster, first define 2 variables\nfor Cluster Name and Zone, and\
    \ then run the command below:\ngcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --\nformat json |\
    \ jq .binaryAuthorization\nThis will return one of 2 possible responses if Binary Authorization is enabled:\n{\n  \"evaluationMode\"\
    : \"PROJECT_SINGLETON_POLICY_ENFORCE\"\n}\nOR\n{\n  \"evaluationMode\": \"PROJECT_SINGLETON_POLICY_AUDIT_AND_WARN\"\n\
    }\nThen, assess the contents of the policy:\ngcloud container binauthz policy export > current-policy.yaml\nEnsure that\
    \ the current policy is not configured to allow all images (evaluationMode:\nALWAYS_ALLOW):\ncat current-policy.yaml\n\
    ...\ndefaultAdmissionRule:\n  evaluationMode: ALWAYS_ALLOW"
  remediation: 'Using Google Cloud Console

    1. Go to Binary Authorization by visiting:

    https://console.cloud.google.com/security/binary-authorization.

    2. Enable the Binary Authorization API (if disabled).

    3. Create an appropriate policy for use with the cluster. See

    https://cloud.google.com/binary-authorization/docs/policy-yaml-reference for

    guidance.

    4. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    5. Select the cluster for which Binary Authorization is disabled.

    6. Under the details pane, within the Security section, click on the pencil icon

    named Edit Binary Authorization.

    7. Check the box next to Enable Binary Authorization.

    8. Choose Enforce policy and provide a directory for the policy to be used.

    9. Click SAVE CHANGES.

    Using Command Line:

    Update the cluster to enable Binary Authorization:

    gcloud container cluster update <cluster_name> --zone <compute_zone> --

    binauthz-evaluation-mode=<evaluation_mode>

    Example:

    gcloud container clusters update $CLUSTER_NAME --zone $COMPUTE_ZONE --

    binauthz-evaluation-mode=PROJECT_SINGLETON_POLICY_ENFORCE

    See: https://cloud.google.com/sdk/gcloud/reference/container/clusters/update#--

    binauthz-evaluation-mode for more details around the evaluation modes available.

    Create a Binary Authorization Policy using the Binary Authorization Policy Reference:

    https://cloud.google.com/binary-authorization/docs/policy-yaml-reference for guidance.

    Import the policy file into Binary Authorization:

    gcloud container binauthz policy import <yaml_policy>'
  checks:
  - type: command
    command: cat current-policy.yaml
    expected: ''
    severity: medium
