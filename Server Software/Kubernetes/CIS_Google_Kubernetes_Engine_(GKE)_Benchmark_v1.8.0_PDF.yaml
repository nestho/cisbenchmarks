    Persistent Disks (PDs) using keys managed within Cloud Key Management Service (Cloud KMS).
  rationale: GCE persistent disks are encrypted at rest by default using envelope encryption with keys managed by Google.
    For additional protection, users can manage the Key Encryption Keys using Cloud KMS.
  impact: Encryption of dynamically-provisioned attached disks requires the use of the selfprovisioned Compute Engine Persistent
    Disk CSI Driver v0.5.1 or higher. If CMEK is being configured with a regional cluster, the cluster must run GKE 1.14 or
    higher.
