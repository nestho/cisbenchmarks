  remediation: 'Run the following command (using the kubelet config file location):

    chmod 644 <kubelet_config_file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /etc/kubernetes/kubelet-config.yaml && ls -l /host/etc/kubernetes/kubelet-config.yaml
    expected: 'The output should return Active: active (running) since..'
    severity: medium
