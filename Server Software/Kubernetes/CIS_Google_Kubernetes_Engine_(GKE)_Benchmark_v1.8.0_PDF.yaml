    \                destinationRanges.list():label=DEST_RANGES,\n                allowed[].map().firewall_rule().list():label=ALLOW,\n\
    \                denied[].map().firewall_rule().list():label=DENY,\n                sourceTags.list():label=SRC_TAGS,\n\
