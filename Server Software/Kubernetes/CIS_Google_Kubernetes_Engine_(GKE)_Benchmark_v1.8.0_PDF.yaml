- id: 5.6.2
  title: Ensure use of VPC-native clusters
  scoring: scored
  profile:
  - Level 1
  description: Create Alias IPs for the node network CIDR range in order to subsequently configure IP-based policies and firewalling
    for pods. A cluster that uses Alias IPs is called a VPCnative cluster.
  rationale: 'Using Alias IPs has several benefits: • Pod IPs are reserved within the network ahead of time, which prevents
    conflict with other compute resources. • The networking layer can perform anti-spoofing checks to ensure that egress traffic
    is not sent with arbitrary source IPs. • Firewall controls for Pods can be applied separately from their nodes. • Alias
    IPs allow Pods to directly access hosted services without using a NAT gateway.'
  impact: You cannot currently migrate an existing cluster that uses routes for Pod routing to a cluster that uses Alias IPs.
    Cluster IPs for internal services remain only available from within the cluster. If you want to access a Kubernetes Service
    from within the VPC, but from outside of the cluster, use an internal load balancer.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/alias-ips
  page_start: 141
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list.\n\
    2. From the list of clusters, click on the desired cluster to open the Details page.\nUnder the 'Networking' section,\
    \ make sure 'VPC-native traffic routing' is set to\n'Enabled'.\nUsing Command Line:\nTo check Alias IP is enabled for\
    \ an existing cluster, first define 2 variables Cluster Name\nand Zone and then run the following command:\ngcloud container\
    \ clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --\nformat json | jq '.ipAllocationPolicy.useIpAliases'\nThe output\
