- id: 4.3.2
  title: Ensure that all Namespaces have Network Policies defined
  scoring: scored
  profile:
  - Level 2
  description: Use network policies to isolate traffic in the cluster network.
  rationale: Running different applications on the same Kubernetes cluster creates a risk of one compromised application attacking
    a neighboring application. Network segmentation is important to ensure that containers can communicate only with those
    they are supposed to. A network policy is a specification of how selections of pods are allowed to communicate with each
    other and other network endpoints. Network Policies are namespace scoped. When a network policy is introduced to a given
    namespace, all traffic not allowed by the policy is denied. However, if there are no network policies in a namespace all
    traffic will be allowed into and out of the pods in that namespace.
  impact: Once network policies are in use within a given namespace, traffic not explicitly allowed by a network policy will
    be denied. As such it is important to ensure that, when introducing network policies, legitimate traffic is not blocked.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/networkpolicy#creating_a_network_policy
  - 2. https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  page_start: 63
  audit_raw: 'Run the below command and review the NetworkPolicy objects created in the cluster.

    kubectl get networkpolicy --all-namespaces

    ensure that each namespace defined in the cluster has at least one Network

    Policy.'
  remediation: 'Follow the documentation and create NetworkPolicy objects as needed.

    See: https://cloud.google.com/kubernetes-engine/docs/how-to/networkpolicy#creating_a_network_policy for more information.'
  checks:
  - type: manual_review
    info: 'Run the below command and review the NetworkPolicy objects created in the cluster.

      kubectl get networkpolicy --all-namespaces

      ensure that each namespace defined in the cluster has at least one Network

      Policy.'
    severity: medium
- id: 4.4.1
  title: Prefer using secrets as files over secrets as environment variables
  scoring: scored
  profile:
  - Level 2
  description: Kubernetes supports mounting secrets as data volumes or as environment variables. Minimize the use of environment
    variable secrets.
  rationale: It is reasonably common for application code to log out its environment (particularly in the event of an error).
    This will include any secret values passed in as environment variables, so secrets can easily be exposed to any user or
    entity who has access to the logs.
  impact: Application code which expects to read secrets in the form of environment variables would need modification
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets
  page_start: 66
  audit_raw: 'Run the following command to find references to objects which use environment

    variables defined from secrets.

    kubectl get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

    {.metadata.name} {"\n"}{end}'' -A'
  remediation: 'If possible, rewrite application code to read secrets from mounted secret files, rather

    than from environment variables.'
  checks:
  - type: manual_review
    info: 'Run the following command to find references to objects which use environment

      variables defined from secrets.

      kubectl get all -o jsonpath=''{range .items[?(@..secretKeyRef)]} {.kind}

      {.metadata.name} {"\n"}{end}'' -A'
    severity: medium
- id: 4.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider the use of an external secrets storage and management system instead of using Kubernetes Secrets directly,
    if more complex secret management is required. Ensure the solution requires authentication to access secrets, has auditing
    of access to and use of secrets, and encrypts secrets. Some solutions also make it easier to rotate secrets.
  rationale: Kubernetes supports secrets as first-class objects, but care needs to be taken to ensure that access to secrets
    is carefully limited. Using an external secrets provider can ease the management of access to secrets, especially where
    secrests are used across both Kubernetes and non-Kubernetes environments.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/
  - 2. https://cloud.google.com/secret-manager/docs/overview
  page_start: 68
  audit_raw: Review your secrets management implementation.
  remediation: 'Refer to the secrets management options offered by the cloud service provider or a

    third-party secrets management solution.'
  checks:
  - type: manual_review
    info: Review your secrets management implementation.
    severity: medium
