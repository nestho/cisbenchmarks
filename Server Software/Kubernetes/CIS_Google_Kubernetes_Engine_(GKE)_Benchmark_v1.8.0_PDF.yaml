    3. If there are multiple network interfaces attached to the instance, select the\nnetwork interface to view in the 'Network\
    \ interface' details section and see all the\nrules that apply to the network interface, within the 'Firewall rules' tab.\
    \ Make sure\nthe firewall rules are appropriate for your environment.\nUsing Command Line:\nFor the instance being evaluated,\
    \ first define 2 variables Instance Name and Zone and\nthen run the following command:\ngcloud compute instances describe\
    \ $INSTANCE_NAME --zone $COMPUTE_ZONE --\nformat json | jq '{tags: .tags.items[],\nserviceaccount:.serviceAccounts[].email,\
    \ network:\n.networkInterfaces[].network}'\nThis will return:\n{\n  \"tags\": \"<tag>\",\n  \"serviceaccount\": \"<service_account>\"\
    \n  \"network\":\n\"https://www.googleapis.com/compute/v1/projects/<project_id>/global/networks/\n<network>\"\n}\nThen,\
