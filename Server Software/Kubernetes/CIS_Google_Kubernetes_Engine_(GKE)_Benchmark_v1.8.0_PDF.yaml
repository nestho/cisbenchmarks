- id: 5.2.2
  title: Prefer using dedicated GCP Service Accounts and Workload Identity
  scoring: manual
  profile:
  - Level 2
  description: Kubernetes workloads should not use cluster node service accounts to authenticate to Google Cloud APIs. Each
    Kubernetes Workload that needs to authenticate to other Google services using Cloud IAM should be provisioned a dedicated
    Service account. Enabling Workload Identity manages the distribution and rotation of Service account keys for the workloads
    to use.
  rationale: 'Manual approaches for authenticating Kubernetes workloads running on GKE against Google Cloud APIs are: storing
    service account keys as a Kubernetes secret (which introduces manual key rotation and potential for key compromise); or
    use of the underlying nodes'' IAM Service account, which violates the principle of least privilege on a multitenanted
    node, when one pod needs to have access to a service, but every other pod on the node that uses the Service account does
    not. Once a relationship between a Kubernetes Service account and a GCP Service account has been configured, any workload
    running as the Kubernetes Service account automatically authenticates as the mapped GCP Service account when accessing
    Google Cloud APIs on a cluster with Workload Identity enabled.'
  impact: 'Workload Identity replaces the need to use Metadata Concealment and as such, the two approaches are incompatible.
    The sensitive metadata protected by Metadata Concealment is also protected by Workload Identity. When Workload Identity
    is enabled, the Compute Engine default Service account can not be used. Correspondingly, Workload Identity can''t be used
    with Pods running in the host network. Workloads may also need to be modified in order for them to use Workload Identity,
    as described within: https://cloud.google.com/kubernetesengine/docs/how-to/workload-identity GKE infrastructure pods such
    as Stackdriver will continue to use the Node''s Service account.'
  references:
