- id: 5.6.6
  title: Consider firewalling GKE worker nodes
  scoring: manual
  profile:
  - Level 2
  description: Reduce the network attack surface of GKE nodes by using Firewalls to restrict ingress and egress traffic.
  rationale: Utilizing stringent ingress and egress firewall rules minimizes the ports and services exposed to an network-based
    attacker, whilst also restricting egress routes within or out of the cluster in the event that a compromised component
    attempts to form an outbound connection.
  impact: All instances targeted by a firewall rule, either using a tag or a service account will be affected. Ensure there
    are no adverse effects on other instances using the target tag or service account before implementing the firewall rule.
  references:
