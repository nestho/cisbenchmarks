- id: 5.5.1
  title: Ensure Container-Optimized OS (cos_containerd) is used for GKE Node images
  scoring: scored
  profile:
  - Level 1
  description: Use Container-Optimized OS (cos_containerd) as a managed, optimized and hardened base OS that limits the host's
    attack surface.
  rationale: 'COS is an operating system image for Compute Engine VMs optimized for running containers. With COS, the containers
    can be brought up on Google Cloud Platform quickly, efficiently, and securely. Using COS as the node image provides the
    following benefits: • Run containers out of the box: COS instances come pre-installed with the container runtime and cloud-init.
    With a COS instance, the container can be brought up at the same time as the VM is created, with no on-host setup required.
    • Smaller attack surface: COS has a smaller footprint, reducing the instance''s potential attack surface. • Locked-down
    by default: COS instances include a locked-down firewall and other security settings by default.'
  impact: If modifying an existing cluster's Node pool to run COS, the upgrade operation used is long-running and will block
    other operations on the cluster (including delete) until it has run to completion. COS nodes also provide an option with
    containerd as the main container runtime directly integrated with Kubernetes instead of docker. Thus, on these nodes,
    Docker cannot view or access containers or images managed by Kubernetes. Applications should not interact with Docker
    directly. For general troubleshooting or debugging, use crictl instead.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/using-containerd
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
