    /etc/kubernetes/kubelet-config.yaml which is the location of the Kubelet config\nfile.\nRun the following command:\nstat\
    \ -c %a /etc/kubernetes/kubelet-config.yaml\nThe output of the above command is the kubelet config file's permissions.\
    \ Verify that the\npermissions are 644 or more restrictive.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need\
    \ to run a pod that is privileged enough to access the host's file system.\nThis can be achieved by deploying a pod that\
    \ uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an example of a simple pod definition\
