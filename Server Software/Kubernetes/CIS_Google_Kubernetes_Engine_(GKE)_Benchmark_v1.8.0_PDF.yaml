- id: 5.7.2
  title: Enable Linux auditd logging
  scoring: manual
  profile:
  - Level 2
  description: Run the auditd logging daemon to obtain verbose operating system logs from GKE nodes running Container-Optimized
    OS (COS).
  rationale: Auditd logs provide valuable information about the state of the cluster and workloads, such as error messages,
    login attempts, and binary executions. This information can be used to debug issues or to investigate security incidents.
  impact: Increased logging activity on a node increases resource usage on that node, which may affect the performance of
    the workload and may incur additional resource costs. Audit logs sent to Stackdriver consume log quota from the project.
    The log quota may require increasing and storage to accommodate the additional logs. Note that the provided logging daemonset
    only works on nodes running ContainerOptimized OS (COS).
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/linux-auditd-logging
  - 2. https://cloud.google.com/container-optimized-os/docs
  page_start: 162
  audit_raw: "Using Google Cloud Console\n1. Navigate to the Kubernetes Engine workloads by visiting:\nhttps://console.cloud.google.com/kubernetes/workload\n\
    2. Observe the workloads and ensure that all filters are removed.\n3. If the unmodified example auditd logging daemonset:\n\
    https://raw.githubusercontent.com/GoogleCloudPlatform/k8s-nodetools/master/os-audit/cos-auditd-logging.yaml is being used,\
    \ ensure that the cosauditd-logging daemonset is being run in the cos-auditd namespace with\nthe number of running pods\
    \ reporting as expected.\nUsing Command Line:\nIf using the unmodified example auditd logging daemonset, run:\nkubectl\
    \ get daemonsets -n cos-audit\nand observe that the cos-auditd-logging daemonset is running as expected.\nIf the name\
    \ or namespace of the daemonset has been modified and is unknown, search\nfor the container being used by the daemonset:\n\
    kubectl get daemonsets -A -o json | jq '.items[] | select\n(.spec.template.spec.containers[].image | contains (\"gcr.io/stackdriveragents/stackdriver-logging-agent\"\
    ))'| jq '{name: .metadata.name, annotations:\n.metadata.annotations.\"kubernetes.io/description\", namespace:\n.metadata.namespace,\
    \ status: .status}'\nThe above command returns the name, namespace and status of the daemonsets that\nuse the Stackdriver\
    \ logging agent. The example auditd logging daemonset has a\ndescription within the annotation as output by the command\
    \ above:\n{\n  \"name\": \"cos-auditd-logging\",\n  \"annotations\": \"DaemonSet that enables Linux auditd logging on\
    \ COS nodes.\",\n  \"namespace\": \"cos-auditd\",\n  \"status\": {...\n  }\n}\nEnsure that the status fields return that\
    \ the daemonset is running as expected."
  remediation: 'Using Command Line:

    Download the example manifests:

    curl https://raw.githubusercontent.com/GoogleCloudPlatform/k8s-nodetools/master/os-audit/cos-auditd-logging.yaml > cos-auditd-logging.yaml

    Edit the example manifests if needed. Then, deploy them:

    kubectl apply -f cos-auditd-logging.yaml

    Verify that the logging Pods have started. If a different Namespace was defined in the

    manifests, replace cos-auditd with the name of the namespace being used:

    kubectl get pods --namespace=cos-auditd'
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console

      1. Navigate to the Kubernetes Engine workloads by visiting:

      https://console.cloud.google.com/kubernetes/workload

      2. Observe the workloads and ensure that all filters are removed.

      3. If the unmodified example auditd logging daemonset:

      https://raw.githubusercontent.com/GoogleCloudPlatform/k8s-nodetools/master/os-audit/cos-auditd-logging.yaml is being
      used, ensure that the cosauditd-logging daemonset is being run in the cos-auditd namespace with

      the number of running pods'
    severity: medium
- id: 5.8.1
  title: Ensure authentication using Client Certificates is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Do not make use of client certificate authentication in GKE, as the credentials cannot be revoked. Instead,
    use another authentication method like OpenID Connect.
  rationale: With Client Certificate authentication, a client presents a certificate that the API server verifies with the
    specified Certificate Authority. In GKE, Client Certificates are signed by the cluster root Certificate Authority. When
    retrieved, the Client Certificate is only base64 encoded and not encrypted. GKE manages authentication via gcloud for
    you using the OpenID Connect token method, setting up the Kubernetes configuration, getting an access token, and keeping
    it up to date. This means Basic Authentication using static passwords and Client Certificate authentication, which both
    require additional management overhead of key management and rotation, are not necessary and should not be used where
    possible. When Client Certificate creation is disabled GKE will not provide a client certificate on cluster creation,
    however users will still be able to use the Certificate Signing Request (CSR) API to create new client certificates, if
    they have access to it.
  impact: Users will no longer be able to authenticate with the pre-provisioned x509 certificate. You should configure and
    use alternate authentication mechanisms, such as OpenID Connect tokens.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster#restrict_authn_methods
  page_start: 166
  audit_raw: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. From the list of clusters, click on the desired cluster. On the Details pane, make

    sure ''Client certificate'' is set to ''Disabled''.

    Using Command line

    To check that the client certificate has not been issued, first define 2 variables for

    Cluster Name and Zone and then run the following command:

    gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --

    format json | jq ''.masterAuth.clientKey''

    The output of the above command returns

    null

    if the client certificate has not been issued for the cluster (Client Certificate

    authentication is disabled).

    Note. Depreciated as of v1.19. For Basic Authentication, Legacy authorization can be

    edited for standard clusters but cannot be edited in Autopilot clusters.'
  remediation: "Currently, there is no way to remove a client certificate from an existing cluster. Thus a\nnew cluster must\
    \ be created.\nUsing Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click CREATE CLUSTER\n3. Configure as required and the click on 'Availability, networking, security, and\nadditional\
    \ features' section\n4. Ensure that the 'Issue a client certificate' checkbox is not ticked\n5. Click CREATE.\nUsing Command\
    \ Line\nCreate a new cluster without a Client Certificate:\ngcloud container clusters create [CLUSTER_NAME] \\\n --no-issue-client-certificate\n\
    In addition it's important to restrict access to the CSR API in Kubernetes to prevent\nusers from using it to issue new\
    \ client certificate credentials."
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. From the list of clusters, click on the desired cluster. On the Details pane, make

      sure ''Client certificate'' is set to ''Disabled''.

      Using Command line

      To check that the client certificate has not been issued, first define 2 variables for

      Cluster Name and Zone and then run the following command:

      gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --

      format json | '
    severity: medium
- id: 5.8.2
  title: Manage Kubernetes RBAC users with Google Groups for GKE
  scoring: manual
  profile:
  - Level 2
  description: Cluster Administrators should leverage G Suite Groups and Cloud IAM to assign Kubernetes user roles to a collection
    of users, instead of to individual emails using only Cloud IAM.
  rationale: On- and off-boarding users is often difficult to automate and prone to error. Using a single source of truth
    for user permissions via G Suite Groups reduces the number of locations that an individual must be off-boarded from, and
    prevents users gaining unique permissions sets that increase the cost of audit.
  impact: When migrating to using security groups, an audit of RoleBindings and ClusterRoleBindings is required to ensure
    all users of the cluster are managed using the new groups and not individually. When managing RoleBindings and ClusterRoleBindings,
    be wary of inadvertently removing bindings required by service accounts.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/google-groups-rbac
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/role-based-accesscontrol
