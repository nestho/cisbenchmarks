- id: 5.10.1
  title: Ensure Kubernetes Web UI is Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'Note: The Kubernetes web UI (Dashboard) does not have admin access by default in GKE 1.7 and higher. The Kubernetes
    web UI is disabled by default in GKE 1.10 and higher. In GKE 1.15 and higher, the Kubernetes web UI add-on KubernetesDashboard
    is no longer supported as a managed add-on. The Kubernetes Web UI (Dashboard) has been a historical source of vulnerability
    and should only be deployed when necessary.'
  rationale: You should disable the Kubernetes Web UI (Dashboard) when running on Kubernetes Engine. The Kubernetes Web UI
    is backed by a highly privileged Kubernetes Service Account. The Google Cloud Console provides all the required functionality
    of the Kubernetes Web UI and leverages Cloud IAM to restrict user access to sensitive cluster controls and settings.
  impact: Users will be required to manage cluster resources using the Google Cloud Console or the command line. These require
    appropriate permissions. To use the command line, this requires the installation of the command line client, kubectl,
    on the user's device (this is already included in Cloud Shell) and knowledge of command line operations.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster#disable_kubernetes_dashboard
  page_start: 181
  audit_raw: "Using Google Cloud Console:\nCurrently not possible, due to the add-on having been removed. Must use the command\n\
    line.\nUsing Command Line:\nFirst define 2 variables for Cluster Name and Zone and then run the following\ncommand:\n\
    gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE  --\nformat json | jq '.addonsConfig.kubernetesDashboard'\n\
    Ensure the output of the above command has JSON key attribute disabled set to true:\n{\n    \"disabled\": true\n}"
  remediation: 'Using Google Cloud Console:

    Currently not possible, due to the add-on having been removed. Must use the command

    line.

    Using Command Line:

    To disable the Kubernetes Dashboard on an existing cluster, run the following

    command:

    gcloud container clusters update <cluster_name> --zone <zone> --updateaddons=KubernetesDashboard=DISABLED'
  checks:
  - type: manual_review
    info: "Using Google Cloud Console:\nCurrently not possible, due to the add-on having been removed. Must use the command\n\
      line.\nUsing Command Line:\nFirst define 2 variables for Cluster Name and Zone and then run the following\ncommand:\n\
      gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE  --\nformat json | jq '.addonsConfig.kubernetesDashboard'\n\
