- id: 5.4.1
  title: Ensure the GKE Metadata Server is Enabled
  scoring: scored
  profile:
  - Level 2
  description: Running the GKE Metadata Server prevents workloads from accessing sensitive instance metadata and facilitates
    Workload Identity.
  rationale: Every node stores its metadata on a metadata server. Some of this metadata, such as kubelet credentials and the
    VM instance identity token, is sensitive and should not be exposed to a Kubernetes workload. Enabling the GKE Metadata
    server prevents pods (that are not running on the host network) from accessing this metadata and facilitates Workload
    Identity. When unspecified, the default setting allows running pods to have full access to the node's underlying metadata
    server.
  impact: 'The GKE Metadata Server must be run when using Workload Identity. Because Workload Identity replaces the need to
    use Metadata Concealment, the two approaches are incompatible. When the GKE Metadata Server and Workload Identity are
    enabled, unless the Pod is running on the host network, Pods cannot use the the Compute Engine default service account.
    Workloads may need modification in order for them to use Workload Identity as described within: https://cloud.google.com/kubernetes-engine/docs/how-to/workloadidentity.'
