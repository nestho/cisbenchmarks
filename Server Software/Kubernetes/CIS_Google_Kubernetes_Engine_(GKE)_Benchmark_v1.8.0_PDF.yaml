- id: 5.8.3
  title: Ensure Legacy Authorization (ABAC) is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Legacy Authorization, also known as Attribute-Based Access Control (ABAC) has been superseded by Role-Based
    Access Control (RBAC) and is not under active development. RBAC is the recommended way to manage permissions in Kubernetes.
  rationale: In Kubernetes, RBAC is used to grant permissions to resources at the cluster and namespace level. RBAC allows
    the definition of roles with rules containing a set of permissions, whilst the legacy authorizer (ABAC) in Kubernetes
    Engine grants broad, statically defined permissions. As RBAC provides significant security advantages over ABAC, it is
    recommended option for access control. Where possible, legacy authorization must be disabled for GKE clusters.
  impact: Once the cluster has the legacy authorizer disabled, the user must be granted the ability to create authorization
    roles using RBAC to ensure that the role-based access control permissions take effect.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/role-based-accesscontrol
  - 2. https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-yourcluster#leave_abac_disabled_default_for_110
  page_start: 171
  audit_raw: 'Using Google Cloud Console:

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. From the list of clusters, click on each cluster to open the Details pane, and make

    sure ''Legacy Authorization'' is set to ''Disabled''.

    Using Command Line:

    To check Legacy Authorization status for an existing cluster, first define 2 variables for

    Cluster Name and Zone and then run the following command:

    gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --

    format json | jq ''.legacyAbac''

    The output should return null

    null

    if Legacy Authorization is Disabled. If Legacy Authorization is Enabled, the above

    command will return true value.'
  remediation: 'Using Google Cloud Console:

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. Select Kubernetes clusters for which Legacy Authorization is enabled.

