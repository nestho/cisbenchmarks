- id: 5.10.2
  title: Ensure that Alpha clusters are not used for production workloads
  scoring: scored
  profile:
  - Level 1
  description: Alpha clusters are not covered by an SLA and are not production-ready.
  rationale: Alpha clusters are designed for early adopters to experiment with workloads that take advantage of new features
    before those features are production-ready. They have all Kubernetes API features enabled, but are not covered by the
    GKE SLA, do not receive security updates, have node auto-upgrade and node auto-repair disabled, and cannot be upgraded.
    They are also automatically deleted after 30 days.
  impact: Users and workloads will not be able to take advantage of features included within Alpha clusters.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/alpha-clusters
  page_start: 183
  audit_raw: 'Using Google Cloud Console

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. If a cluster appears under the ''Kubernetes alpha clusters'' heading, it is an Alpha

    cluster.

    Using Command Line

    First define 2 variables for Cluster Name and Zone and then run the command:

    gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --

    format json | jq ''.enableKubernetesAlpha''

    The output of the above command will return true if it is an Alpha cluster.'
  remediation: "Alpha features cannot be disabled. To remediate, a new cluster must be created.\nUsing Google Cloud Console\n\
    1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/\n2. Click CREATE CLUSTER, and choose\
    \ \"SWITCH TO STANDARD CLUSTER\" in\nthe upper right corner of the screen.\n3. Under Features in the the CLUSTER section,\
    \ \"Enable Kubernetes alpha features\nin this cluster\" will not be available by default and to use Kubernetes alpha\n\
    features in this cluster, first disable release channels.\nNote: It will only be available if the cluster is created with\
    \ a Static version for the\nControl plane version, along with both Automatically upgrade nodes to the next\navailable\
    \ version and Enable auto-repair being checked under the Node pool\ndetails for each node.\n4. Configure the other settings\
    \ as required and click CREATE.\nUsing Command Line:\nUpon creating a new cluster\ngcloud container clusters create [CLUSTER_NAME]\
    \ \\\n  --zone [COMPUTE_ZONE]\nDo not use the --enable-kubernetes-alpha argument."
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. If a cluster appears under the ''Kubernetes alpha clusters'' heading, it is an Alpha

      cluster.

      Using Command Line

      First define 2 variables for Cluster Name and Zone and then run the command:

      gcloud container clusters describe $CLUSTER_NAME --zone $COMPUTE_ZONE --

      format json | jq ''.enableKubernetesAlpha''

      The output of the above command will return true if it is an Alpha cluster.'
    severity: medium
- id: 5.10.3
  title: Consider GKE Sandbox for running untrusted workloads
  scoring: scored
  profile:
  - Level 2
  description: Use GKE Sandbox to restrict untrusted workloads as an additional layer of protection when running in a multi-tenant
    environment.
  rationale: GKE Sandbox provides an extra layer of security to prevent untrusted code from affecting the host kernel on your
    cluster nodes. When you enable GKE Sandbox on a Node pool, a sandbox is created for each Pod running on a node in that
    Node pool. In addition, nodes running sandboxed Pods are prevented from accessing other GCP services or cluster metadata.
    Each sandbox uses its own userspace kernel. Multi-tenant clusters and clusters whose containers run untrusted workloads
    are more exposed to security vulnerabilities than other clusters. Examples include SaaS providers, web-hosting providers,
    or other organizations that allow their users to upload and run code. A flaw in the container runtime or in the host kernel
    could allow a process running within a container to 'escape' the container and affect the node's kernel, potentially bringing
    down the node. The potential also exists for a malicious tenant to gain access to and exfiltrate another tenant's data
    in memory or on disk, by exploiting such a defect.
  impact: 'Using GKE Sandbox requires the node image to be set to Container-Optimized OS with containerd (cos_containerd).
    It is not currently possible to use GKE Sandbox along with the following Kubernetes features: • Accelerators such as GPUs
    or TPUs • Istio • Monitoring statistics at the level of the Pod or container • Hostpath storage • Per-container PID namespace
    • CPU and memory limits are only applied for Guaranteed Pods and Burstable Pods, and only when CPU and memory limits are
    specified for all containers running in the Pod • Pods using PodSecurityPolicies that specify host namespaces, such as
    hostNetwork, hostPID, or hostIPC • Pods using PodSecurityPolicy settings such as privileged mode • VolumeDevices • Portforward
    • Linux kernel security modules such as Seccomp, Apparmor, or Selinux Sysctl, NoNewPrivileges, bidirectional MountPropagation,
    FSGroup, or ProcMount'
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/node-pools
  page_start: 185
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list.\n\
    2. Click on each cluster, and click on any Node pools that are not provisioned by\ndefault.\n3. On the Node pool Details\
    \ page, under the Security heading on the Node pool\ndetails page, check that Sandbox with gVisor is set to 'Enabled'.\n\
    The default node pool cannot use GKE Sandbox.\nUsing Command Line:\nFirst define 3 variable for Node Pool, Cluster Name\
    \ and Zone and then run this\ncommand:\ngcloud container node-pools describe $NODE_POOL --cluster $CLUSTER_NAME --\nzone\
    \ $COMPUTE_ZONE --format json | jq '.config.sandboxConfig'\nThe output of the above command will return the following\
    \ if the Node pool is running a\nsandbox:\n{\n  \"sandboxType\":\"gvisor\"\n}\nIf there is no sandbox, the above command\
    \ output will be null ({ }).\nThe default node pool cannot use GKE Sandbox."
  remediation: "Once a node pool is created, GKE Sandbox cannot be enabled, rather a new node pool\nis required. The default\
    \ node pool (the first node pool in your cluster, created when the\ncluster is created) cannot use GKE Sandbox.\nUsing\
    \ Google Cloud Console:\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/.\n2. Select\
    \ a cluster and click ADD NODE POOL.\n3. Configure the Node pool with following settings:\no For the node version, select\
    \ v1.12.6-gke.8 or higher.\no For the node image, select Container-Optimized OS with\nContainerd (cos_containerd) (default).\n\
    o Under Security, select Enable sandbox with gVisor.\n4. Configure other Node pool settings as required.\n5. Click SAVE.\n\
    Using Command Line:\nTo enable GKE Sandbox on an existing cluster, a new Node pool must be created,\nwhich can be done\
    \ using:\n  gcloud container node-pools create <node_pool_name> --zone <compute-zone> -\n-cluster <cluster_name> --image-type=cos_containerd\
    \ --sandbox=\"type=gvisor\""
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      1. Go to Kubernetes Engine by visiting:

      https://console.cloud.google.com/kubernetes/list.

      2. Click on each cluster, and click on any Node pools that are not provisioned by

      default.

      3. On the Node pool Details page, under the Security heading on the Node pool

      details page, check that Sandbox with gVisor is set to ''Enabled''.

      The default node pool cannot use GKE Sandbox.

      Using Command Line:

      First define 3 variable for Node Pool, Cluster Name and Zone and then run this

      co'
    severity: medium
