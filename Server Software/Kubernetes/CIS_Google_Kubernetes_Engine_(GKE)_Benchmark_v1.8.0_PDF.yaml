      GKE cluster:

      1. Go to the Kubernetes Engine by visiting:

      https://console.cloud.google.com/kubernetes/list

      2. Select the cluster for which Binary Authorization is disabled.

      3. Under the details pane, within the Security section, ensure that ''Binary

      Authorization'' is set to ''Enabled''. Then, assess the contents of the p'
- id: 5.2.1
  title: Ensure GKE clusters are not running using the Compute Engine default service account
  scoring: scored
  profile:
  - Level 1
  description: Create and use minimally privileged Service accounts to run GKE cluster nodes instead of using the Compute
    Engine default Service account. Unnecessary permissions could be abused in the case of a node compromise.
  rationale: A GCP service account (as distinct from a Kubernetes ServiceAccount) is an identity that an instance or an application
    can be used to run GCP API requests. This identity is used to identify virtual machine instances to other Google Cloud
    Platform services. By default, Kubernetes Engine nodes use the Compute Engine default service account. This account has
    broad access by default, as defined by access scopes, making it useful to a wide variety of applications on the VM, but
    it has more permissions than are required to run your Kubernetes Engine cluster. A minimally privileged service account
    should be created and used to run the Kubernetes Engine cluster instead of using the Compute Engine default service account,
    and create separate service accounts for each Kubernetes Workload (See recommendation 5.2.2). Kubernetes Engine requires,
    at a minimum, the node service account to have the monitoring.viewer, monitoring.metricWriter, and logging.logWriter roles.
    Additional roles may need to be added for the nodes to pull images from GCR.
  impact: Instances are automatically granted the https://www.googleapis.com/auth/cloudplatform scope to allow full access
    to all Google Cloud APIs. This is so that the IAM permissions of the instance are completely determined by the IAM roles
    of the Service account. Thus if Kubernetes workloads were using cluster access scopes to perform actions using Google
    APIs, they may no longer be able to, if not permitted by the permissions of the Service account. To remediate, follow
    recommendation 5.2.2. The Service account roles listed here are the minimum required to run the cluster. Additional roles
    may be required to pull from a private instance of Google Container Registry (GCR).
  references:
  - 1. https://cloud.google.com/compute/docs/access/serviceaccounts#compute_engine_default_service_account
  page_start: 100
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the cluster under test and click on each Node pool to bring up the Node\npool details page. Ensure that for\
    \ each Node pool the Service account is not set\nto default under the Security heading.\nTo check the permissions allocated\
    \ to the service account are the minimum required for\ncluster operation:\n1. Go to IAM by visiting https://console.cloud.google.com/iam-admin/iam\n\
    2. From the list of Service accounts, ensure each cluster Service account has only\nthe following roles:\n• Logs Writer\n\
    • Monitoring Metric Writer\n• Monitoring Viewer\nUsing Command line:\nTo check an existing cluster, first define 3 variables\
    \ for Node Pool, Cluster Name and\nZone, and then run the following command:\ngcloud container node-pools describe $NODE_POOL\
    \ --cluster $CLUSTER_NAME --\nzone $COMPUTE_ZONE --format json | jq '.config.serviceAccount'\nThe output of the above\
    \ command will return default if default Service account is used\nor the specific account being used for Project access.\n\
    To check that the permissions allocated to the service account are the minimum\nrequired for cluster operation:\ngcloud\
    \ projects get-iam-policy <project_id> \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)' \\\
    \n  --filter=\"bindings.members:<service_account>\"\nReview the output to ensure that the service account only has the\
    \ roles required to run\nthe cluster:\n• roles/logging.logWriter\n• roles/monitoring.metricWriter\n• roles/monitoring.viewer"
  remediation: 'Using Google Cloud Console:

    To create a minimally privileged service account:

    1. Go to Service Accounts by visiting: https://console.cloud.google.com/iamadmin/serviceaccounts.

    2. Click on CREATE SERVICE ACCOUNT.

    3. Enter Service Account Details.

    4. Click CREATE AND CONTINUE.

    5. Within Service Account permissions add the following roles:

    o Logs Writer.

    o Monitoring Metric Writer.

    o `Monitoring Viewer.

    6. Click CONTINUE.

    7. Grant users access to this service account and create keys as required.

    8. Click DONE.

    To create a Node pool to use the Service account:

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. Click on the cluster name within which the Node pool will be launched.

    3. Click on ADD NODE POOL.

    4. Within the Node Pool details, select the Security subheading, and under

    `Identity defaults, select the minimally privileged service account from the Service

    Account drop-down.

    5. Click `CREATE to launch the Node pool.

    Note: The workloads will need to be migrated to the new Node pool, and the old node

    pools that use the default service account should be deleted to complete the

    remediation.

    Using Command Line:

    To create a minimally privileged service account:

    gcloud iam service-accounts create <node_sa_name> --display-name "GKE Node

    Service Account"

    export NODE_SA_EMAIL=gcloud iam service-accounts list --format=''value(email)''

    --filter=''displayName:GKE Node Service Account''

    Grant the following roles to the service account:

    export PROJECT_ID=gcloud config get-value project

    gcloud projects add-iam-policy-binding <project_id> --member

    serviceAccount:<node_sa_email> --role roles/monitoring.metricWriter

    gcloud projects add-iam-policy-binding <project_id> --member

    serviceAccount:<node_sa_email> --role roles/monitoring.viewer

