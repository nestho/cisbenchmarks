  audit_raw: "Using Command Line:\nIdentify if there are any workloads exposed publicly using Services of\ntype:LoadBalancer:\n\
    kubectl get svc -A -o json | jq '.items[] |\nselect(.spec.type==\"LoadBalancer\")'\nConsider using ingresses instead of\
    \ these services in order to use Google managed\nSSL certificates.\nFor the ingresses within the cluster, run the following\
    \ command:\nkubectl get ingress -A -o json | jq .items[] | jq '{name: .metadata.name,\nannotations: .metadata.annotations,\
    \ namespace: .metadata.namespace, status:\n.status}'\nThe above command should return the name of the ingress, namespace,\
    \ annotations\nand status. Check that the following annotation is present to ensure managed\ncertificates are referenced.\n\
    \"annotations\": {\n    ...\n    \"networking.gke.io/managed-certificates\": \"<example_certificate>\"\n  },\nFor completeness,\
    \ run the following command to ensure that the managed certificate\nresource exists:\nkubectl get managedcertificates\
    \ -A\nThe above command returns a list of managed certificates for which\n<example_certificate> should exist within the\
    \ same namespace as the ingress."
  remediation: 'If services of type:LoadBalancer are discovered, consider replacing the Service with

    an Ingress.

    To configure the Ingress and use Google-managed SSL certificates, follow the

    instructions as listed at: https://cloud.google.com/kubernetes-engine/docs/howto/managed-certs.'
