- id: 5.3.1
  title: Ensure Kubernetes Secrets are encrypted using keys managed in Cloud KMS
  scoring: scored
  profile:
  - Level 2
  description: Encrypt Kubernetes secrets, stored in etcd, at the application-layer using a customermanaged key in Cloud KMS.
  rationale: By default, GKE encrypts customer content stored at rest, including Secrets. GKE handles and manages this default
    encryption for you without any additional action on your part. Application-layer Secrets Encryption provides an additional
    layer of security for sensitive data, such as user defined Secrets and Secrets required for the operation of the cluster,
    such as service account keys, which are all stored in etcd. Using this functionality, you can use a key, that you manage
    in Cloud KMS, to encrypt data at the application layer. This protects against attackers in the event that they manage
    to gain access to etcd.
  impact: To use the Cloud KMS CryptoKey to protect etcd in the cluster, the 'Kubernetes Engine Service Agent' Service account
    must hold the 'Cloud KMS CryptoKey Encrypter/Decrypter' role.
