controls:
- id: 3.1.1
  title: Ensure that the kubeconfig file permissions are set to 644 or more restrictive
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, and if it is configured by a kubeconfig file, ensure that the proxy kubeconfig file
    has permissions of 644 or more restrictive.
  rationale: The kubelet kubeconfig file controls various parameters of the kubelet service in the worker node. You should
    restrict its file permissions to maintain the integrity of the file. The file should be writable by only the administrators
    on the system. It is possible to run kubelet with the kubeconfig parameters configured as a Kubernetes ConfigMap instead
    of a file. In this case, there is no proxy kubeconfig file.
  impact: Ensuring that the kubeconfig file permissions are set to 644 or more restrictive significantly strengthens the security
    posture of the Kubernetes environment by preventing unauthorized modifications. This restricts write access to the kubeconfig
    file, ensuring only administrators can alter crucial kubelet configurations, thereby reducing the risk of malicious alterations
    that could compromise the cluster's integrity. However, this configuration may slightly impact usability, as it limits
    the ability for nonadministrative users to make quick adjustments to the kubelet settings. Administrators will need to
    balance security needs with operational flexibility, potentially requiring adjustments to workflows for managing kubelet
    configurations.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 20
  audit_raw: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click on the desired cluster to open the Details page, then click on the desired\nNode pool to open the Node pool Details\
    \ page\n3. Note the name of the desired node\n4. Go to VM Instances by visiting\nhttps://console.cloud.google.com/compute/instances\n\
    5. Find the desired node and click on 'SSH' to open an SSH connection to the node.\nUsing Command Line\nMethod 1\nSSH\
    \ to the worker nodes\nTo check to see if the kubelet service is running:\nsudo systemctl status kubelet\nThe output should\
    \ return Active: active (running) since..\nRun the following command on each node to find the appropriate kubeconfig file:\n\
    ps -ef | grep kubelet\nThe output of the above command should return something similar to --kubeconfig\n/var/lib/kubelet/kubeconfig\
    \ which is the location of the kubeconfig file.\nRun this command to obtain the kubeconfig file permissions:\nstat -c\
    \ %a /var/lib/kubelet/kubeconfig\nThe output of the above command gives you the kubeconfig file's permissions.\nVerify\
    \ that if a file is specified and it exists, the permissions are 644 or more restrictive.\nMethod 2\nCreate and Run a\
    \ Privileged Pod.\nYou will need to run a pod that is privileged enough to access the host's file system.\nThis can be\
    \ achieved by deploying a pod that uses the hostPath volume to mount the\nnode's file system into the pod.\nHere's an\
    \ example of a simple pod definition that mounts the root of the host to /host\nwithin the pod:\napiVersion: v1\nkind:\
    \ Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n    hostPath:\n      path: /\n      type:\
    \ Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n    volumeMounts:\n\
    \    - name: host-root\n      mountPath: /host\n    securityContext:\n      privileged: true\nSave this to a file (e.g.,\
    \ file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\nOnce the pod is running, you can exec\
    \ into it to check file permissions on the node:\nkubectl exec -it file-check -- sh\nNow you are in a shell inside the\
    \ pod, but you can access the node's file system through\nthe /host directory and check the permission level of the file:\n\
    ls -l /host/var/lib/kubelet/kubeconfig\nVerify that if a file is specified and it exists, the permissions are 644 or more\
    \ restrictive."
  remediation: 'Run the below command (based on the file location on your system) on the each worker

    node. For example,

    chmod 644 <kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %a /var/lib/kubelet/kubeconfig && ls -l /host/var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired

      Node pool to open the Node pool Details page

      3. Note the name of the desired node

      4. Go to VM Instances by visiting

      https://console.cloud.google.com/compute/instances

      5. Find the desired node and click'
- id: 3.1.2
  title: Ensure that the kubelet kubeconfig file ownership is set to root:root
  scoring: scored
  profile:
  - Level 1
  description: If kubelet is running, ensure that the file ownership of its kubeconfig file is set to root:root.
  rationale: The kubeconfig file for kubelet controls various parameters for the kubelet service in the worker node. You should
    set its file ownership to maintain the integrity of the file. The file should be owned by root:root.
  impact: Overly permissive file access increases the security risk to the platform.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
  page_start: 23
  audit_raw: "Using Google Cloud Console\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Click on the desired cluster to open the Details page, then click on the desired\nNode pool to open the Node pool Details\
    \ page\n3. Note the name of the desired node\n4. Go to VM Instances by visiting\nhttps://console.cloud.google.com/compute/instances\n\
    5. Find the desired node and click on 'SSH' to open an SSH connection to the node.\nUsing Command Line\nMethod 1\nSSH\
    \ to the worker nodes\nTo check to see if the kubelet service is running:\nsudo systemctl status kubelet\nThe output should\
    \ return Active: active (running) since..\nRun the following command on each node to find the appropriate kubeconfig file:\n\
    ps -ef | grep kubelet\nThe output of the above command should return something similar to --kubeconfig\n/var/lib/kubelet/kubeconfig\
    \ which is the location of the kubeconfig file.\nRun this command to obtain the kubeconfig file ownership:\nstat -c %U:%G\
    \ /var/lib/kubelet/kubeconfig\nThe output of the above command gives you the kubeconfig file's ownership. Verify that\n\
    the ownership is set to root:root.\nMethod 2\nCreate and Run a Privileged Pod.\nYou will need to run a pod that is privileged\
    \ enough to access the host's file system.\nThis can be achieved by deploying a pod that uses the hostPath volume to mount\
    \ the\nnode's file system into the pod.\nHere's an example of a simple pod definition that mounts the root of the host\
    \ to /host\nwithin the pod:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: file-check\nspec:\n  volumes:\n  - name: host-root\n\
    \    hostPath:\n      path: /\n      type: Directory\n  containers:\n  - name: nsenter\n    image: busybox\n    command:\
    \ [\"sleep\", \"3600\"]\n    volumeMounts:\n    - name: host-root\n      mountPath: /host\n    securityContext:\n    \
    \  privileged: true\nSave this to a file (e.g., file-check-pod.yaml) and create the pod:\nkubectl apply -f file-check-pod.yaml\n\
    Once the pod is running, you can exec into it to check file ownership on the node:\nkubectl exec -it file-check -- sh\n\
    Now you are in a shell inside the pod, but you can access the node's file system through\nthe /host directory and check\
    \ the ownership of the file:\nls -l /host/var/lib/kubelet/kubeconfig\nThe output of the above command gives you the kubeconfig\
    \ file's ownership. Verify that\nthe ownership is set to root:root."
  remediation: 'Run the below command (based on the file location on your system) on each worker

    node.

    For example,

    chown root:root <proxy kubeconfig file>'
  checks:
  - type: command
    command: ps -ef | grep kubelet && stat -c %U:%G /var/lib/kubelet/kubeconfig && ls -l /host/var/lib/kubelet/kubeconfig
    expected: 'The output should return Active: active (running) since..'
    severity: medium
    info: 'Using Google Cloud Console

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Click on the desired cluster to open the Details page, then click on the desired

      Node pool to open the Node pool Details page

      3. Note the name of the desired node

      4. Go to VM Instances by visiting

      https://console.cloud.google.com/compute/instances

      5. Find the desired node and click'
