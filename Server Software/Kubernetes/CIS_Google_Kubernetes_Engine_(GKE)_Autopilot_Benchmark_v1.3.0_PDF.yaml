      \ or apiGroups—and tells you which\nfield(s) use the wildcard:\nExternal - General\nkubectl get clusterrole,role -A\
      \ -o json | jq -r '\n  def has_star(a): (a // []) | any(. == \"*\");\n  .items[]\n  | . as $r\n  | ( any($r.rules[]?;\
      \ has_star(.verbs)) )      as $wv\n  | ( any($r.rules["
    severity: medium
- id: 4.1.4
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: The default service account should not be used to ensure that rights granted to applications can be more easily
    audited and reviewed.
  rationale: Kubernetes provides a default service account which is used by cluster workloads where no specific service account
    is assigned to the pod. Where access to the Kubernetes API from a pod is required, a specific service account should be
    created for that pod, and rights granted to that service account. The default service account should be configured such
    that it does not provide a service account token and does not have any explicit rights assignments.
  impact: All workloads which require access to the Kubernetes API will require an explicit service account to be created.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 31
  audit_raw: "For each namespace in the cluster, review the rights assigned to the default service\naccount and ensure that\
    \ it has no roles or cluster roles bound to it apart from the\ndefaults.\nAdditionally ensure that the automountServiceAccountToken:\
    \ false setting is in\nplace for each default service account.\nkubectl get serviceaccounts/default -o yaml\nSample Output:\n\
    External - General\napiVersion: v1\nautomountServiceAccountToken: false\nkind: ServiceAccount\nmetadata:\n  creationTimestamp:\
    \ \"2025-10-18T16:11:09Z\"\n  name: default\n  namespace: default\n..."
  remediation: 'Create explicit service accounts wherever a Kubernetes workload requires specific

    access to the Kubernetes API server.

    Modify the configuration of each default service account to include this value

    automountServiceAccountToken: false'
  checks:
  - type: manual_review
    info: "For each namespace in the cluster, review the rights assigned to the default service\naccount and ensure that it\
      \ has no roles or cluster roles bound to it apart from the\ndefaults.\nAdditionally ensure that the automountServiceAccountToken:\
      \ false setting is in\nplace for each default service account.\nkubectl get serviceaccounts/default -o yaml\nSample\
      \ Output:\nExternal - General\napiVersion: v1\nautomountServiceAccountToken: false\nkind: ServiceAccount\nmetadata:\n\
      \  creationTimestamp: \"2025-10-18T16:11:09Z"
    severity: medium
- id: 4.1.5
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: manual
  profile:
  - Level 1
  description: Service accounts tokens should not be mounted in pods except where the workload running in the pod explicitly
    needs to communicate with the API server
  rationale: Mounting service account tokens inside pods can provide an avenue for privilege escalation attacks where an attacker
    is able to compromise a single pod in the cluster. Avoiding mounting these tokens removes this attack avenue.
  impact: Pods mounted without service account tokens will not be able to communicate with the API server, except where the
    resource is available to unauthenticated principals.
  references:
  - 1. https://kubernetes.io/docs/tasks/configure-pod-container/configure-serviceaccount/
  page_start: 33
  audit_raw: 'Review pod and service account objects in the cluster and ensure that the option below

    is set, unless the resource explicitly requires this access.

    automountServiceAccountToken: false

    echo "=== ServiceAccounts with automountServiceAccountToken=false ==="

    printf "%-25s %-40s\n" "NAMESPACE" "SERVICEACCOUNT"

    echo "------------------------- ----------------------------------------"

    kubectl get sa -A -o jsonpath=''{range

    .items[?(@.automountServiceAccountToken==false)]}{.metadata.namespace}{"\t"}{

    .metadata.name}{"\n"}{end}'' \

    | sort | awk -F''\t'' ''{printf "%-25s %-40s\n", $1, $2}''

    echo ""

    echo "=== Pods with automountServiceAccountToken=false ==="

    printf "%-25s %-40s\n" "NAMESPACE" "POD"

    echo "------------------------- ----------------------------------------"

    kubectl get pods -A -o jsonpath=''{range

    .items[?(@.spec.automountServiceAccountToken==false)]}{.metadata.namespace}{"

    \t"}{.metadata.name}{"\n"}{end}'' \

    | sort | awk -F''\t'' ''{printf "%-25s %-40s\n", $1, $2}''

    Note:

    • kubectl get ... -A scans all namespaces.

    • jsonpath filters for automountServiceAccountToken == false.

    • awk formats the output into aligned columns.

    External - General

    • If a section is empty, no objects explicitly set automountServiceAccountToken:

    false — meaning they still auto-mount tokens by default, and may need

    remediation.

    Sample Output:

    === ServiceAccounts with automountServiceAccountToken=false ===

    NAMESPACE                 SERVICEACCOUNT

    ------------------------- ----------------------------------------

    default                   default

    kube-system               metrics-reader

    === Pods with automountServiceAccountToken=false ===

    NAMESPACE                 POD

    ------------------------- ----------------------------------------

    dev                       api-service

    prod                      nginx-test'
  remediation: 'Modify the definition of pods and service accounts which do not need to mount service

    account tokens to disable it.'
  checks:
  - type: manual_review
    info: 'Review pod and service account objects in the cluster and ensure that the option below

      is set, unless the resource explicitly requires this access.

      automountServiceAccountToken: false

      echo "=== ServiceAccounts with automountServiceAccountToken=false ==="

      printf "%-25s %-40s\n" "NAMESPACE" "SERVICEACCOUNT"

      echo "------------------------- ----------------------------------------"

      kubectl get sa -A -o jsonpath=''{range

      .items[?(@.automountServiceAccountToken==false)]}{.metadata.namespace}{"\t"}{

      .me'
    severity: medium
- id: 4.1.6
  title: Avoid use of system:masters group
  scoring: scored
  profile:
  - Level 1
  description: The special group system:masters should not be used to grant permissions to any user or service account, except
    where strictly necessary (e.g. bootstrapping access prior to RBAC being fully available)
  rationale: The system:masters group has unrestricted access to the Kubernetes API hard-coded into the API server source
    code. An authenticated user who is a member of this group cannot have their access reduced, even if all bindings and cluster
    role bindings which mention it, are removed. When combined with client certificate authentication, use of this group can
    allow for irrevocable cluster-admin level credentials to exist for a cluster. GKE includes the CertificateSubjectRestriction
    admission controller which rejects requests for the system:masters group. CertificateSubjectRestriction "This admission
    controller observes creation of CertificateSigningRequest resources that have a spec.signerName of kubernetes.io/kube-apiserver-client.
    It rejects any request that specifies a 'group' (or 'organization attribute') of system:masters." https://kubernetes.io/docs/reference/accessauthn-authz/admission-controllers/#certificatesubjectrestriction
  impact: Once the RBAC system is operational in a cluster system:masters should not be specifically required, as ordinary
    bindings from principals to the cluster-admin cluster role can be made where unrestricted access is required.
  references:
  - 1. https://github.com/kubernetes/kubernetes/blob/master/pkg/registry/rbac/escalatio
  page_start: 35
  audit_raw: "Review a list of all credentials which have access to the cluster and ensure that the\ngroup system:masters\
    \ is not used.\nkubectl get clusterrolebinding -o json | jq -r '\n  .items[] as $b\n  | select([ $b.subjects[]? | select(.kind==\"\
    Group\" and\n.name==\"system:masters\") ] | length > 0)\n  | ($b.subjects[]? | select(.kind==\"Group\" and .name==\"system:masters\"\
    ))\n  | \"\\(.kind)\\t\\(.name)\\t(bound in: \\($b.metadata.name))\"\n'\nSample Output:\nExternal - General\nGroup system:masters\
    \ (bound in: cluster-admin)"
  remediation: Remove the system:masters group from all users in the cluster.
  checks:
  - type: manual_review
    info: "Review a list of all credentials which have access to the cluster and ensure that the\ngroup system:masters is\
      \ not used.\nkubectl get clusterrolebinding -o json | jq -r '\n  .items[] as $b\n  | select([ $b.subjects[]? | select(.kind==\"\
      Group\" and\n.name==\"system:masters\") ] | length > 0)\n  | ($b.subjects[]? | select(.kind==\"Group\" and .name==\"\
      system:masters\"))\n  | \"\\(.kind)\\t\\(.name)\\t(bound in: \\($b.metadata.name))\"\n'\nSample Output:\nExternal -\
      \ General\nGroup system:masters (bound in: cluster-admin)"
    severity: medium
- id: 4.1.7
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: Cluster roles and roles with the impersonate, bind or escalate permissions should not be granted unless strictly
    required. Each of these permissions allow a particular subject to escalate their privileges beyond those explicitly granted
    by cluster administrators
  rationale: The impersonate privilege allows a subject to impersonate other users gaining their rights to the cluster. The
    bind privilege allows the subject to add a binding to a cluster role or role which escalates their effective permissions
    in the cluster. The escalate privilege allows a subject to modify cluster roles to which they are bound, increasing their
    rights to that level. Each of these permissions has the potential to allow for privilege escalation to clusteradmin level.
  impact: There are some cases where these permissions are required for cluster service operation, and care should be taken
    before removing these permissions from system service accounts.
  references:
  - 1. https://www.impidio.com/blog/kubernetes-rbac-security-pitfalls
  - 2. https://raesene.github.io/blog/2020/12/12/Escalating_Away/
  page_start: 37
  audit_raw: "Review the users who have access to cluster roles or roles which provide the\nimpersonate, bind or escalate\
    \ privileges.\nExternal - General\nkubectl get clusterrole,role -A -o json | jq -r '\n  def risky_verbs: [\"bind\",\"\
    impersonate\",\"escalate\"];\n  .items[]\n  | . as $r\n  | [ $r.rules[]?\n      | select(\n          (.verbs // [] | any(.\
    \ as $v | $v == \"bind\" or $v == \"impersonate\"\nor $v == \"escalate\"))\n        )\n      | {\n          resources:\
    \ ((.resources // [\"*\"]) | join(\",\")),\n          verbs: ((.verbs // []) |\nmap(select(IN(\"bind\",\"impersonate\"\
    ,\"escalate\"))) | join(\",\"))\n        }\n    ] as $matches\n  | select($matches | length > 0)\n  | [\n      $r.kind,\n\
    \      $r.metadata.name,\n      ($r.metadata.namespace // \"cluster-wide\"),\n      ($matches | map(.resources) | unique\
    \ | join(\",\")),\n      ($matches | map(.verbs) | unique | join(\",\"))\n    ] | @tsv\n' | awk -F'\\t' 'BEGIN{\n  printf\
    \ \"%-15s %-40s %-20s %-40s %-\n30s\\n\",\"KIND\",\"NAME\",\"NAMESPACE\",\"RESOURCES\",\"VERBS\"\n  print  \"---------------\
    \ ---------------------------------------- ----------\n---------- ---------------------------------------- -------------------------\n\
    -----\"\n}{\n  printf \"%-15s %-40s %-20s %-40s %-30s\\n\",$1,$2,$3,$4,$5\n}'\nSample Output:\nKIND            NAME  \
    \                                   NAMESPACE\nRESOURCES                                VERBS\n--------------- ----------------------------------------\
    \ --------------------\n---------------------------------------- ------------------------------\nClusterRole     admin\
    \                                    cluster-wide\nserviceaccounts                          impersonate\nClusterRole \
    \    edit                                     cluster-wide\nserviceaccounts                          impersonate\nClusterRole\
    \     cluster-admin                            cluster-wide\nroles,clusterroles,users                 bind,impersonate,escalate\n\
    ClusterRole     custom-admin                             cluster-wide\nrolebindings,clusterrolebindings         bind\n\
    Role            tenant-admin                             dev\nrolebindings                             bind"
  remediation: 'Where possible, remove the impersonate, bind and escalate rights from subjects.

    External - General'
  checks:
  - type: manual_review
    info: "Review the users who have access to cluster roles or roles which provide the\nimpersonate, bind or escalate privileges.\n\
      External - General\nkubectl get clusterrole,role -A -o json | jq -r '\n  def risky_verbs: [\"bind\",\"impersonate\"\
      ,\"escalate\"];\n  .items[]\n  | . as $r\n  | [ $r.rules[]?\n      | select(\n          (.verbs // [] | any(. as $v\
      \ | $v == \"bind\" or $v == \"impersonate\"\nor $v == \"escalate\"))\n        )\n      | {\n          resources: ((.resources\
      \ // [\"*\"]) | join(\",\")),\n          verbs: ((.verbs"
    severity: medium
- id: 4.1.8
  title: Avoid bindings to system:anonymous
  scoring: scored
  profile:
  - Level 2
  description: Avoid ClusterRoleBindings or RoleBindings with the user system:anonymous.
  rationale: Kubernetes assigns user system:anonymous to API server requests that have no authentication information provided.
    Binding a role to user system:anonymous gives any unauthenticated user the permissions granted by that role and is strongly
    discouraged.
  impact: Unauthenticated users will have privileges and permissions associated with roles associated with the configured
    bindings. Care should be taken before removing any clusterrolebindings or rolebindings from the environment to ensure
    they were not required for operation of the cluster. Use a more specific and authenticated user for cluster operations.
  references:
  - 1. https://kubernetes.io/docs/reference/access-authn-authz/rbac/#discovery-roles
  page_start: 40
  audit_raw: "Both CusterRoleBindings and RoleBindings should be audited. Use the following\ncommand to confirm there are\
    \ no ClusterRoleBindings to system:anonymous:\n$ kubectl get clusterrolebindings -o json   | jq -r '[\"Name\"], [\"-----\"\
    ],\n(.items[] | select((.subjects | length) > 0) | select(any(.subjects[]; .name\n== \"system:anonymous\")) | [.metadata.namespace,\
    \ .metadata.name]) | @tsv'\nThere should be no ClusterRoleBindings listed. If any bindings exist, review their\npermissions\
    \ with the following command and reassess their privilege.\n$ kubectl get clusterrolebinding [CLUSTER_ROLE_BINDING_NAME]\
    \ -o json \\\n    | jq ' .roleRef.name +\" \" + .roleRef.kind' \\\n    | sed -e 's/\"//g' \\\n    | xargs -l bash -c 'kubectl\
    \ get $1 $0 -o yaml'\nConfirm that there are no RoleBindings including the system:anonymous user:\n$ kubectl get rolebindings\
    \ -A -o json | jq -r '[\"Namespace\", \"Name\"], [\"-----\n----\", \"-----\"], (.items[] | select((.subjects | length)\
