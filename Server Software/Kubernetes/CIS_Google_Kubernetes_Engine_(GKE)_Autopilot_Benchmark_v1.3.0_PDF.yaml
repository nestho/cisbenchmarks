  - type: manual_review
    info: 'Review the pod definitions in the cluster and verify that image provenance is configured

      as appropriate.'
    severity: medium
- id: 4.6.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Use namespaces to isolate your Kubernetes objects.
  rationale: Limiting the scope of user permissions can reduce the impact of mistakes or malicious activities. A Kubernetes
    namespace allows you to partition created resources into logically named groups. Resources created in one namespace can
    be hidden from other namespaces. By default, each resource created by a user in Kubernetes cluster runs in a default namespace,
    called default. You can create additional namespaces and attach resources and users to them. You can use Kubernetes Authorization
    plugins to create policies that segregate access to namespace resources between different users.
  impact: You need to switch between namespaces for administration.
  references:
  - 1. https://kubernetes.io/docs/concepts/overview/working-withobjects/namespaces/#viewing-namespaces
  - 2. http://blog.kubernetes.io/2016/08/security-best-practices-kubernetesdeployment.html
  page_start: 59
  audit_raw: 'Run the below command and review the namespaces created in the cluster.

    kubectl get namespaces

    Ensure that these namespaces are the ones you need and are adequately administered

    as per your requirements.'
  remediation: 'Follow the documentation and create namespaces for objects in your deployment as

    you need them.'
  checks:
  - type: manual_review
    info: 'Run the below command and review the namespaces created in the cluster.

      kubectl get namespaces

      Ensure that these namespaces are the ones you need and are adequately administered

      as per your requirements.'
    severity: medium
- id: 4.6.2
  title: Ensure that the seccomp profile is set to RuntimeDefault in the pod definitions
  scoring: scored
  profile:
  - Level 2
  description: Enable RuntimeDefault seccomp profile in the pod definitions.
  rationale: Seccomp (secure computing mode) is used to restrict the set of system calls applications can make, allowing cluster
    administrators greater control over the security of workloads running in the cluster. Kubernetes disables seccomp profiles
    by default for historical reasons. It should be enabled to ensure that the workloads have restricted actions available
    within the container.
  impact: If the RuntimeDefault seccomp profile is too restrictive for you, you would have to create/manage your own Localhost
    seccomp profiles.
  references:
  - 1. https://kubernetes.io/docs/tutorials/security/seccomp/
  - 2. https://cloud.google.com/kubernetes-engine/docs/concepts/seccomp-in-gke
  page_start: 61
  audit_raw: 'Review the pod definitions output for all namespaces in the cluster with the command

    below.

    kubectl get pods --all-namespaces -o json | jq -r ''.items[] |

    select(.metadata.annotations."seccomp.security.alpha.kubernetes.io/pod" ==

    "runtime/default" or .spec.securityContext.seccompProfile.type ==

    "RuntimeDefault") | {namespace: .metadata.namespace, name: .metadata.name,

    seccompProfile: .spec.securityContext.seccompProfile.type}'''
  remediation: "Use security context to enable the RuntimeDefault seccomp profile in your pod\ndefinitions. An example is\
    \ as below:\n{\n  \"namespace\": \"kube-system\",\n  \"name\": \"metrics-server-v0.7.0-dbcc8ddf6-gz7d4\",\n  \"seccompProfile\"\
    : \"RuntimeDefault\"\n}"
  checks:
  - type: manual_review
    info: 'Review the pod definitions output for all namespaces in the cluster with the command

      below.

      kubectl get pods --all-namespaces -o json | jq -r ''.items[] |

      select(.metadata.annotations."seccomp.security.alpha.kubernetes.io/pod" ==

      "runtime/default" or .spec.securityContext.seccompProfile.type ==

      "RuntimeDefault") | {namespace: .metadata.namespace, name: .metadata.name,

      seccompProfile: .spec.securityContext.seccompProfile.type}'''
    severity: medium
- id: 4.6.3
  title: Apply Security Context to Pods and Containers
  scoring: manual
  profile:
  - Level 2
  description: Apply Security Context to Pods and Containers
  rationale: 'A security context defines the operating system security settings (uid, gid, capabilities, SELinux role, etc..)
    applied to a container. When designing containers and pods, make sure that the security context is configured for pods,
    containers, and volumes. A security context is a property defined in the deployment yaml. It controls the security parameters
    that will be assigned to the pod/container/volume. There are two levels of security context: pod level security context,
    and container level security context.'
  impact: If you incorrectly apply security contexts, there may be issues running the pods.
  references:
  - 1. https://kubernetes.io/docs/concepts/workloads/pods/
  - 2. https://kubernetes.io/docs/concepts/containers/
  page_start: 63
  audit_raw: 'Review the pod definitions in the cluster and verify that the security contexts have been

    defined as appropriate.'
  remediation: 'Follow the Kubernetes documentation and apply security contexts to your pods. For a

    suggested list of security contexts, you may refer to the CIS Google ContainerOptimized OS Benchmark.'
  checks:
  - type: manual_review
    info: 'Review the pod definitions in the cluster and verify that the security contexts have been

      defined as appropriate.'
    severity: medium
- id: 4.6.4
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 2
  description: Kubernetes provides a default namespace, where objects are placed if no namespace is specified for them. Placing
    objects in this namespace makes application of RBAC and other controls more difficult.
  rationale: Resources in a Kubernetes cluster should be segregated by namespace, to allow for security controls to be applied
    at that level and to make it easier to manage resources.
  impact: None
  references: []
  page_start: 65
  audit_raw: 'To list all Kubernetes objects in the default namespace of your GKE cluster, use:

    kubectl get all -n default

    or

    kubectl get all -n default -o wide

    If you want a complete inventory of all resource types in the default namespace:

    kubectl get

    all,configmaps,secrets,pvc,ingress,serviceaccounts,networkpolicies -n default'
  remediation: 'Ensure that namespaces are created to allow for appropriate segregation of Kubernetes

    resources and that all new resources are created in a specific namespace.'
  checks:
  - type: manual_review
    info: 'To list all Kubernetes objects in the default namespace of your GKE cluster, use:

