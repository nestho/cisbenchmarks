- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: The RBAC role cluster-admin provides wide-ranging powers over the environment and should be used only where
    and when needed.
  rationale: Kubernetes provides a set of default roles where RBAC is used. Some of these roles such as cluster-admin provide
    wide-ranging privileges which should only be applied where absolutely necessary. Roles such as cluster-admin allow super-user
    access to perform any action on any resource. When used in a ClusterRoleBinding, it gives full control over every resource
    in the cluster and in all namespaces. When used in a RoleBinding, it gives full control over every resource in the rolebinding's
    namespace, including the namespace itself.
  impact: 'Care should be taken before removing any clusterrolebindings from the environment to ensure they were not required
    for operation of the cluster. Specifically, modifications should not be made to clusterrolebindings with the system: prefix
    as they are required for the operation of system components.'
  references:
  - 1. https://kubernetes.io/docs/concepts/cluster-administration/
  - 2. https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  page_start: 22
  audit_raw: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

    the clusterrolebinding output for each role binding that has access to the clusteradmin role.

    Here’s a concise and effective CLI statement to list all principals (users, groups, or

    service accounts) bound to the cluster-admin role:

    kubectl get clusterrolebinding -o jsonpath=''{range

    .items[?(@.roleRef.name=="cluster-admin")]}{.metadata.name}{"\n"}{range

    .subjects[*]}{.kind}{"\t"}{.name}{"\n"}{end}{"\n"}{end}''

    Review each principal listed and ensure that cluster-admin privilege is required for it.'
  remediation: 'Identify all clusterrolebindings to the cluster-admin role. Check if they are used and if

    they need this role or if they could use a role with fewer privileges.

    External - General

    Where possible, first bind users to a lower-privileged role and then remove the

    clusterrolebinding to the cluster-admin role :

    kubectl delete clusterrolebinding [name]'
  checks:
  - type: manual_review
    info: 'Obtain a list of the principals who have access to the cluster-admin role by reviewing

      the clusterrolebinding output for each role binding that has access to the clusteradmin role.

      Here’s a concise and effective CLI statement to list all principals (users, groups, or

      service accounts) bound to the cluster-admin role:

      kubectl get clusterrolebinding -o jsonpath=''{range

      .items[?(@.roleRef.name=="cluster-admin")]}{.metadata.name}{"\n"}{range

      .subjects[*]}{.kind}{"\t"}{.name}{"\n"}{end}{"\n"}{end}''

      R'
    severity: medium
- id: 4.1.2
  title: Minimize access to secrets
  scoring: manual
  profile:
  - Level 1
  description: The Kubernetes API stores secrets, which may be service account tokens for the Kubernetes API or credentials
    used by workloads in the cluster. Access to these secrets should be restricted to the smallest possible group of users
    to reduce the risk of privilege escalation.
  rationale: Inappropriate access to secrets stored within the Kubernetes cluster can allow for an attacker to gain additional
    access to the Kubernetes cluster or external resources whose credentials are stored as secrets.
  impact: Care should be taken not to remove access to secrets to system components which require this for their operation
  references: []
  page_start: 24
  audit_raw: "Review the users who have get, list or watch access to secrets objects in the\nKubernetes API.\nBelow is a command\
    \ to print which objects have get, list or watch granted for each\nmatching role including roles that grant access via\
    \ wildcards like resources:\n[\"\",\"secrets/\"] or verbs: [\"*\"]:\nkubectl get clusterrole,role -A -o json | jq -r '\n\
    \  def wanted: [\"get\",\"list\",\"watch\"];\n  .items[] as $r\n  | [ $r.rules[]?\n      | select(\n          ((.apiGroups?\
    \ // [\"\"]) | any(.==\"\" or .==\"*\"))\n          and ((.resources? // []) | any(.==\"secrets\" or .==\"secrets/*\"\
    \ or\n.==\"*\"))\n          and ((.verbs? // []) | any(.==\"*\" or .==\"get\" or .==\"list\" or\n.==\"watch\"))\n    \
    \    )\n      | if ((.verbs? // []) | any(.==\"*\"))\n        then wanted[] else (.verbs[]? | select(IN(\"get\",\"list\"\
    ,\"watch\"))) end\n    ] as $verbs\n  | select($verbs | length > 0)\n  | \"\\($r.kind): \\($r.metadata.name) (namespace:\
    \ \\($r.metadata.namespace //\n\"cluster-wide\")) | verbs: \\($verbs | unique | join(\",\"))\"\n'\nSample output:\nExternal\
    \ - General\nClusterRole: admin (namespace: cluster-wide) | verbs: get,list,watch\nClusterRole: cluster-admin (namespace:\
    \ cluster-wide) | verbs: get,list,watch\nClusterRole: edit (namespace: cluster-wide) | verbs: get,list,watch\nClusterRole:\
    \ system:aggregate-to-edit (namespace: cluster-wide) | verbs:\nget,list,watch\nClusterRole: system:cloud-controller-manager\
    \ (namespace: cluster-wide) |\nverbs: get,list,watch\nClusterRole: system:controller:generic-garbage-collector (namespace:\
    \ clusterwide) | verbs: get,list,watch\nClusterRole: system:controller:namespace-controller (namespace: cluster-wide)\n\
    | verbs: get,list,watch\nClusterRole: system:controller:resourcequota-controller (namespace: clusterwide) | verbs: list,watch\n\
    ClusterRole: system:gcp-controller-manager (namespace: cluster-wide) | verbs:\nget,list,watch\nClusterRole: system:gke-common-webhooks\
