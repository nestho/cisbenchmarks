      \\n\"}{end}' |\nwhile read ns; do\n  count=$(kubectl get networkpolicy -n \"$ns\" --no-headers 2>/dev/null | wc -l\n\
      | tr -d ' ')\n  if [ \"$count\" -gt 0 ]; then\n    echo -e \"${ns}\\t${"
- id: 4.4.1
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider the use of an external secrets storage and management system instead of using Kubernetes Secrets directly,
    if more complex secret management is required. Ensure the solution requires authentication to access secrets, has auditing
    of access to and use of secrets, and encrypts secrets. Some solutions also make it easier to rotate secrets.
  rationale: Kubernetes supports secrets as first-class objects, but care needs to be taken to ensure that access to secrets
    is carefully limited. Using an external secrets provider can ease the management of access to secrets, especially where
    secrests are used across both Kubernetes and non-Kubernetes environments.
  impact: None
  references:
  - 1. https://kubernetes.io/docs/concepts/configuration/secret/
  - 2. https://cloud.google.com/secret-manager/docs/overview
  page_start: 53
  audit_raw: Review your secrets management implementation.
  remediation: 'Refer to the secrets management options offered by the cloud service provider or a

    third-party secrets management solution.'
  checks:
  - type: manual_review
    info: Review your secrets management implementation.
    severity: medium
- id: 4.5.1
  title: Configure Image Provenance using ImagePolicyWebhook admission controller
  scoring: manual
  profile:
  - Level 2
  description: Configure Image Provenance for the deployment.
  rationale: Kubernetes supports plugging in provenance rules to accept or reject the images in deployments. Rules can be
    configured to ensure that only approved images are deployed in the cluster.
  impact: Regular maintenance for the provenance configuration should be carried out, based on container image updates.
  references:
