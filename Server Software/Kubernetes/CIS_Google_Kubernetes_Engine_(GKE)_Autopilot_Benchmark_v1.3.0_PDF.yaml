- id: 5.4.2
  title: Ensure Control Plane Authorized Networks is Enabled
  scoring: manual
  profile:
  - Level 2
  description: Enable Control Plane Authorized Networks to restrict access to the cluster's control plane to only an allowlist
    of authorized IPs.
  rationale: 'Authorized networks are a way of specifying a restricted range of IP addresses that are permitted to access
    your cluster''s control plane. Kubernetes Engine uses both Transport Layer Security (TLS) and authentication to provide
    secure access to your cluster''s control plane from the public internet. This provides you the flexibility to administer
    your cluster from anywhere; however, you might want to further restrict access to a set of IP addresses that you control.
    You can set this restriction by specifying an authorized network. Control Plane Authorized Networks blocks untrusted IP
    addresses. Google Cloud Platform IPs (such as traffic from Compute Engine VMs) can reach your master through HTTPS provided
    that they have the necessary Kubernetes credentials. Restricting access to an authorized network can provide additional
    security benefits for your container cluster, including: • Better protection from outsider attacks: Authorized networks
    provide an additional layer of security by limiting external, non-GCP access to a specific set of addresses you designate,
    such as those that originate from your premises. This helps protect access to your cluster in the case of a vulnerability
    in the cluster''s authentication or authorization mechanism. • Better protection from insider attacks: Authorized networks
    help protect your cluster from accidental leaks of master certificates from your company''s premises. Leaked certificates
    used from outside GCP and outside the authorized IP ranges (for example, from addresses outside your company) are still
    denied access.'
  impact: When implementing Control Plane Authorized Networks, be careful to ensure all desired networks are on the allowlist
    to prevent inadvertently blocking external access to your cluster's control plane.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/authorized-networks
  page_start: 98
  audit_raw: "Using Google Cloud Console:\nExternal - General\n1. Go to Kubernetes Engine by visiting:\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, click on the cluster to open the Details page and make\nsure 'Master authorized networks'\
    \ is set to 'Enabled'.\nUsing Command Line:\nTo check Master Authorized Networks status for an existing cluster, first\
    \ define 3\nvariables Cluster Name, Location and Project and then run the following command:\ngcloud container clusters\
    \ describe $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --project $PROJECT_ID \\\n  --format=\"table(masterAuthorizedNetworksConfig.enabled,\n\
    masterAuthorizedNetworksConfig.cidrBlocks.list())\"\nThe output should return\nENABLED  CIDR_BLOCKS\nTrue     203.0.113.0/24;198.51.100.10/32\n\
    if Control Plane Authorized Networks is enabled. If Master Authorized Networks is\ndisabled, the above command will return\
    \ null ({ })."
  remediation: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select Kubernetes clusters for which Control Plane Authorized Networks is\ndisabled\n3. Within the Details pane, under\
    \ the Networking heading, click on the pencil icon\nnamed Edit control plane authorised networks.\n4. Check the box next\
    \ to Enable control plane authorised networks.\n5. Click SAVE CHANGES.\nUsing Command Line:\nTo enable Control Plane Authorized\
    \ Networks for an existing cluster, run the following\ncommand (define own IP range):\ngcloud container clusters update\
    \ $CLUSTER_NAME \\\n  --location $LOCATION \\\n  --enable-master-authorized-networks \\\n  --master-authorized-networks\
    \ \"203.0.113.0/24,198.51.100.10/32\" \\\n  --project $PROJECT_ID\nAlong with this, you can list authorized networks using\
    \ the --master-authorizednetworks flag which contains a list of up to 20 external networks that are allowed to\nconnect\
    \ to your cluster's control plane through HTTPS. You provide these networks as\na comma-separated list of addresses in\
    \ CIDR notation (such as 90.90.100.0/24).\nExternal - General"
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      External - General

      1. Go to Kubernetes Engine by visiting:

      https://console.cloud.google.com/kubernetes/list

      2. From the list of clusters, click on the cluster to open the Details page and make

      sure ''Master authorized networks'' is set to ''Enabled''.

      Using Command Line:

      To check Master Authorized Networks status for an existing cluster, first define 3

      variables Cluster Name, Location and Project and then run the following command:

      gcloud container clusters describe $CLUS'
    severity: medium
- id: 5.4.3
  title: Ensure clusters are created with Private Endpoint Enabled and Public Access Disabled
  scoring: scored
  profile:
  - Level 2
  description: Disable access to the Kubernetes API from outside the node network if it is not required.
  rationale: In a private cluster, the master node has two endpoints, a private and public endpoint. The private endpoint
    is the internal IP address of the master, behind an internal load balancer in the master's VPC network. Nodes communicate
    with the master using the private endpoint. The public endpoint enables the Kubernetes API to be accessed from outside
    the master's VPC network. Although Kubernetes API requires an authorized token to perform sensitive actions, a vulnerability
    could potentially expose the Kubernetes publically with unrestricted access. Additionally, an attacker may be able to
    identify the current cluster and Kubernetes API version and determine whether it is vulnerable to an attack. Unless required,
    disabling public endpoint will help prevent such threats, and require the attacker to be on the master's VPC network to
    perform any attack on the Kubernetes API.
  impact: To enable a Private Endpoint, the cluster has to also be configured with private nodes, a private master IP range
    and IP aliasing enabled. If the Private Endpoint flag --enable-private-endpoint is passed to the gcloud CLI, or the external
    IP address undefined in the Google Cloud Console during cluster creation, then all access from a public IP address is
    prohibited.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/private-clusters
  page_start: 101
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the required cluster, and within the Details pane, make sure the 'Endpoint'\ndoes not have a public IP address.\n\
    Using Command Line:\nTo check Private Endpoint status for an existing cluster, first define 3 variables Cluster\nName,\
    \ Location and Project and then run the following command:\nExternal - General\ngcloud container clusters describe $CLUSTER_NAME\
    \ --location $LOCATION --\nproject $PROJECT_ID --format json | jq\n'.privateClusterConfig.enablePrivateEndpoint'\nThe\
    \ output of the above command returns\n{\n      \"enablePrivateEndpoint\": true\n}\nif a Private Endpoint is enabled with\
    \ Public Access disabled.\nFor an additional check, the endpoint parameter can be queried with the following\ncommand:\n\
    gcloud container clusters describe <cluster_name> --format json | jq\n'.endpoint'\nThe output of the above command returns\
    \ a private IP address if Private Endpoint is\nenabled with Public Access disabled."
  remediation: 'Once a cluster is created without enabling Private Endpoint only, it cannot be

    remediated. Rather, the cluster must be recreated.

    Using Google Cloud Console:

    1. Go to Kubernetes Engine by visiting

    https://console.cloud.google.com/kubernetes/list

    2. Click CREATE CLUSTER, and choose CONFIGURE for the Standard mode

    cluster.

    3. Configure the cluster as required then click Networking under CLUSTER in the

    navigation pane.

    4. Under IPv4 network access, click the Private cluster radio button.

    5. Uncheck the Access control plane using its external IP address checkbox.

    6. In the Control plane IP range textbox, provide an IP range for the control plane.

    7. Configure the other settings as required, and click CREATE.

    Using Command Line:

    Create a cluster with a Private Endpoint enabled and Public Access disabled by

    including the --enable-private-endpoint flag within the cluster create command:

    gcloud container clusters create-auto <cluster_name> --location $LOCATION --

    enable-private-endpoint

    Setting this flag also requires the setting of --enable-private-nodes and --enablemaster-authorized-networks.'
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Select the required cluster, and within the Details pane, make sure the ''Endpoint''

      does not have a public IP address.

      Using Command Line:

      To check Private Endpoint status for an existing cluster, first define 3 variables Cluster

      Name, Location and Project and then run the following command:

      External - General

      gcloud container clusters describe $CLUSTER_NAME --location $LOCATION '
    severity: medium
