    severity: medium
- id: 5.1.1
  title: Ensure Image Vulnerability Scanning is enabled
  scoring: scored
  profile:
  - Level 2
  description: 'Note: GCR is now deprecated, being superseded by Artifact Registry starting 15th May 2024. Runtime Vulnerability
    scanning is available via GKE Security Posture Scan images stored in Google Container Registry (GCR) or Artifact Registry
    (AR) for vulnerabilities.'
  rationale: Vulnerabilities in software packages can be exploited by malicious users to obtain unauthorized access to local
    cloud resources. GCR Container Analysis API or Artifact Registry Container Scanning API allow images stored in GCR or
    AR respectively to be scanned for known vulnerabilities.
  impact: None.
  references:
  - 1. https://cloud.google.com/artifact-registry/docs/analysis
  - 2. https://cloud.google.com/artifact-analysis/docs/os-overview
  page_start: 69
  audit_raw: 'For Images Hosted in GCR:

    Using Google Cloud Console:

    1. Go to GCR by visiting https://console.cloud.google.com/gcr

    2. Select Settings and check if Vulnerability scanning is Enabled.

    Using Command Line:

    gcloud services list --enabled

    Ensure that the Container Registry API and Container Analysis API are listed in

    the output.

    For Images Hosted in AR:

    Using Google Cloud Console:

    1. Go to AR by visiting https://console.cloud.google.com/artifacts

    2. Select Settings and check if Vulnerability scanning is Enabled.

    Using Command Line:

    External - General

    gcloud services list --enabled

    Ensure that Container Scanning API and Artifact Registry API are listed in the

    output.'
  remediation: 'For Images Hosted in GCR:

    Using Google Cloud Console

    1. Go to GCR by visiting: https://console.cloud.google.com/gcr

    2. Select Settings and, under the Vulnerability Scanning heading, click the TURN

    ON button.

    Using Command Line

    gcloud services enable containeranalysis.googleapis.com

    For Images Hosted in AR:

    Using Google Cloud Console

    1. Go to GCR by visiting: https://console.cloud.google.com/artifacts

    2. Select Settings and, under the Vulnerability Scanning heading, click the ENABLE

    button.

    Using Command Line

    gcloud services enable containerscanning.googleapis.com'
