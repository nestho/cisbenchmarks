- id: 5.2.1
  title: Ensure GKE clusters are not running using the Compute Engine default service account
  scoring: scored
  profile:
  - Level 2
  description: Create and use minimally privileged Service accounts to run GKE clusters instead of using the Compute Engine
    default Service account. Unnecessary permissions could be abused in the case of a node compromise.
  rationale: A GCP service account (as distinct from a Kubernetes ServiceAccount) is an identity that an instance or an application
    can be used to run GCP API requests. This identity is used to identify virtual machine instances to other Google Cloud
    Platform services. By default, Kubernetes Engine nodes use the Compute Engine default service account. This account has
    broad access by default, as defined by access scopes, making it useful to a wide variety of applications on the VM, but
    it has more permissions than are required to run your Kubernetes Engine cluster. A minimally privileged service account
    should be created and used to run the Kubernetes Engine cluster instead of using the Compute Engine default service account,
    and create separate service accounts for each Kubernetes Workload (See recommendation 5.2.2). Kubernetes Engine requires,
    at a minimum, the node service account to have the monitoring.viewer, monitoring.metricWriter, and logging.logWriter roles.
    Additional roles may need to be added for the nodes to pull images from GCR.
  impact: Instances are automatically granted the https://www.googleapis.com/auth/cloudplatform scope to allow full access
    to all Google Cloud APIs. This is so that the IAM permissions of the instance are completely determined by the IAM roles
    of the Service account. Thus if Kubernetes workloads were using cluster access scopes to perform actions using Google
    APIs, they may no longer be able to, if not permitted by the permissions of the Service account. To remediate, follow
    recommendation 5.2.2. The Service account roles listed here are the minimum required to run the cluster. Additional roles
    may be required to pull from a private instance of Google Container Registry (GCR).
  references:
  - 1. https://cloud.google.com/compute/docs/access/serviceaccounts#compute_engine_default_service_account
  page_start: 85
  audit_raw: "Using Google Cloud Console:\nExternal - General\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. Select the cluster under test and click on each Node pool to bring up the Node\npool details page. Ensure that for\
    \ each Node pool the Service account is not set\nto default under the Security heading.\nTo check the permissions allocated\
    \ to the service account are the minimum required for\ncluster operation:\n1. Go to IAM by visiting https://console.cloud.google.com/iam-admin/iam\n\
    2. From the list of Service accounts, ensure each cluster Service account has only\nthe following roles:\n• Logs Writer\n\
    • Monitoring Metric Writer\n• Monitoring Viewer\nUsing Command line:\nTo check an existing cluster, first define 4 variables\
    \ for Node Pool, Cluster Name,\nLocation and Project, and then run the following command:\ngcloud container node-pools\
    \ describe $NODE_POOL --cluster $CLUSTER_NAME --\nlocation $LOCATION --project $PROJECT_ID --format json | jq\n'.config.serviceAccount'\n\
    The output of the above command will return the specific Service account being used\nfor Project access.\nTo check that\
    \ the permissions allocated to the service account are the minimum\nrequired for cluster operation:\ngcloud projects get-iam-policy\
    \ <project_id> \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)' \\\n  --filter=\"bindings.members:<service_account>\"\
    \nReview the output to ensure that the service account only has the roles required to run\nthe cluster:\n• roles/logging.logWriter\n\
    • roles/monitoring.metricWriter\n• roles/monitoring.viewer"
  remediation: 'Using Google Cloud Console:

    To create a minimally privileged service account:

    External - General

    1. Go to Service Accounts by visiting: https://console.cloud.google.com/iamadmin/serviceaccounts.

    2. Click on CREATE SERVICE ACCOUNT.

    3. Enter Service Account Details.

    4. Click CREATE AND CONTINUE.

    5. Within Service Account permissions add the following roles:

    o Logs Writer.

    o Monitoring Metric Writer.

    o `Monitoring Viewer.

    6. Click CONTINUE.

    7. Grant users access to this service account and create keys as required.

    8. Click DONE.

    To create a Node pool to use the Service account:

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. Click on the cluster name within which the Node pool will be launched.

    3. Click on ADD NODE POOL.

    4. Within the Node Pool details, select the Security subheading, and under

    `Identity defaults, select the minimally privileged service account from the Service

    Account drop-down.

    5. Click `CREATE to launch the Node pool.

    Note: The workloads will need to be migrated to the new Node pool, and the old node

    pools that use the default service account should be deleted to complete the

    remediation.

    Using Command Line:

    To create a minimally privileged service account:

    gcloud iam service-accounts create <node_sa_name> --display-name "GKE Node

    Service Account"

    export NODE_SA_EMAIL=gcloud iam service-accounts list --format=''value(email)''

    --filter=''displayName:GKE Node Service Account''

    Grant the following roles to the service account:

    export PROJECT_ID=gcloud config get-value project

    gcloud projects add-iam-policy-binding <project_id> --member

    serviceAccount:<node_sa_email> --role roles/monitoring.metricWriter

    gcloud projects add-iam-policy-binding <project_id> --member

    serviceAccount:<node_sa_email> --role roles/monitoring.viewer

    gcloud projects add-iam-policy-binding <project_id> --member

    serviceAccount:<node_sa_email> --role roles/logging.logWriter

    To create a new Node pool using the Service account, run the following command:

    External - General

    gcloud container node-pools create <node_pool> --serviceaccount=<sa_name>@<project_id>.iam.gserviceaccount.com--

    cluster=<cluster_name> --zone <compute_zone>

    Note: The workloads will need to be migrated to the new Node pool, and the old node

    pools that use the default service account should be deleted to complete the

    remediation.'
  checks:
  - type: manual_review
    info: 'Using Google Cloud Console:

      External - General

      1. Go to Kubernetes Engine by visiting

      https://console.cloud.google.com/kubernetes/list

      2. Select the cluster under test and click on each Node pool to bring up the Node

      pool details page. Ensure that for each Node pool the Service account is not set

      to default under the Security heading.

      To check the permissions allocated to the service account are the minimum required for

      cluster operation:

      1. Go to IAM by visiting https://console.cloud.google.com'
    severity: medium
- id: 5.3.1
  title: Ensure Kubernetes Secrets are encrypted using keys managed in Cloud KMS
  scoring: scored
  profile:
  - Level 2
  description: Encrypt Kubernetes secrets, stored in etcd, at the application-layer using a customermanaged key in Cloud KMS.
  rationale: By default, GKE encrypts customer content stored at rest, including Secrets. GKE handles and manages this default
    encryption for you without any additional action on your part. Application-layer Secrets Encryption provides an additional
    layer of security for sensitive data, such as user defined Secrets and Secrets required for the operation of the cluster,
    such as service account keys, which are all stored in etcd. Using this functionality, you can use a key, that you manage
    in Cloud KMS, to encrypt data at the application layer. This protects against attackers in the event that they manage
    to gain access to etcd.
  impact: To use the Cloud KMS CryptoKey to protect etcd in the cluster, the 'Kubernetes Engine Service Agent' Service account
    must hold the 'Cloud KMS CryptoKey Encrypter/Decrypter' role.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets
  page_start: 90
  audit_raw: "Using Google Cloud Console:\n1. Go to Kubernetes Engine by visiting\nhttps://console.cloud.google.com/kubernetes/list\n\
    2. From the list of clusters, click on each cluster to bring up the Details pane, and\nensure Application-layer Secrets\
    \ Encryption is set to 'Enabled'.\nTo check an existing cluster, first define 3 variables for Cluster Name, Location and\n\
    Project and then run the following command:\ngcloud container clusters describe $CLUSTER_NAME --location $LOCATION --\n\
    project $PROJECT_ID --format json | jq '.databaseEncryption'\nIf configured correctly, the output from the command returns\
    \ a response containing the\nfollowing detail:\nExternal - General\n{\n  \"currentState\": \"CURRENT_STATE_ENCRYPTED\"\
    ,\n  \"state\": \"ENCRYPTED\"\n}"
  remediation: 'To enable Application-layer Secrets Encryption, several configuration items are

    required. These include:

    • A key ring

    • A key

    • A GKE service account with Cloud KMS CryptoKey Encrypter/Decrypter

    role

    Once these are created, Application-layer Secrets Encryption can be enabled on an

    existing or new cluster.

    Using Google Cloud Console:

    To create a key

    1. Go to Cloud KMS by visiting https://console.cloud.google.com/security/kms.

    2. Select CREATE KEY RING.

    3. Enter a Key ring name and the region where the keys will be stored.

    4. Click CREATE.

    5. Enter a Key name and appropriate rotation period within the Create key pane.

    6. Click CREATE.

    To enable on a new cluster

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. Click CREATE CLUSTER, and choose the required cluster mode.

    3. Within the Security heading, under CLUSTER, check Encrypt secrets at the

    application layer checkbox.

    4. Select the kms key as the customer-managed key and, if prompted, grant

    permissions to the GKE Service account.

    5. Click CREATE.

    To enable on an existing cluster

    1. Go to Kubernetes Engine by visiting:

    https://console.cloud.google.com/kubernetes/list.

    2. Select the cluster to be updated.

    3. Under the Details pane, within the Security heading, click on the pencil named

    Application-layer secrets encryption.

    4. Enable Encrypt secrets at the application layer and choose a kms key.

    External - General

    5. Click SAVE CHANGES.

    Using Command Line:

    To create a key: Create a key ring:

    gcloud kms keyrings create <ring_name> --location <location> --project

    <key_project_id>

    Create a key:

    gcloud kms keys create <key_name> --location <location> --keyring <ring_name>

    --purpose encryption --project <key_project_id>

    Grant the Kubernetes Engine Service Agent service account the Cloud KMS

    CryptoKey Encrypter/Decrypter role:

    gcloud kms keys add-iam-policy-binding <key_name> --location <location> --

    keyring <ring_name> --member serviceAccount:<service_account_name> --role

    roles/cloudkms.cryptoKeyEncrypterDecrypter --project <key_project_id>

    To create a new cluster with Application-layer Secrets Encryption:

    gcloud container clusters create <cluster_name> --cluster-version=latest --

    zone <zone> --database-encryption-key

    projects/<key_project_id>/locations/<location>/keyRings/<ring_name>/cryptoKey

    s/<key_name> --project <cluster_project_id>

    To enable on an existing cluster:

    gcloud container clusters update <cluster_name> --zone <zone> --databaseencryption-key

