- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Roles and ClusterRoles provide access to resources based on sets of objects and actions that can
    be taken on those objects. It is possible to set either of these to be the wildcard "*", which matches all items. Use
    of wildcards is not optimal from a security perspective as it may allow for inadvertent access to be granted when new
    resources are added to the Kubernetes API either as CRDs or in later versions of the product.
  rationale: The principle of least privilege recommends that users are provided only the access required for their role and
    nothing more. The use of wildcard rights grants is likely to provide excessive rights to the Kubernetes API.
  impact: ''
  references:
  - 1. https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  page_start: 27
  audit_raw: "Retrieve the roles defined across each namespaces in the cluster and review for\nwildcards\nHere’s a null-safe,\
    \ column-formatted command that shows only Roles and ClusterRoles\nthat use a wildcard (*) anywhere in verbs, resources,\
    \ or apiGroups—and tells you which\nfield(s) use the wildcard:\nExternal - General\nkubectl get clusterrole,role -A -o\
    \ json | jq -r '\n  def has_star(a): (a // []) | any(. == \"*\");\n  .items[]\n  | . as $r\n  | ( any($r.rules[]?; has_star(.verbs))\
    \ )      as $wv\n  | ( any($r.rules[]?; has_star(.resources)) )  as $wr\n  | ( any($r.rules[]?; has_star(.apiGroups))\
    \ )  as $wg\n  | select($wv or $wr or $wg)\n  | [\n      $r.kind,\n      $r.metadata.name,\n      ($r.metadata.namespace\
    \ // \"cluster-wide\"),\n      ([ if $wv then \"verbs\" else empty end,\n         if $wr then \"resources\" else empty\
    \ end,\n         if $wg then \"apiGroups\" else empty end ] | join(\",\"))\n    ]\n  | @tsv\n' | awk -F'\\t' 'BEGIN {\n\
    \  OFS=\"\\t\";\n  printf \"%-15s %-40s %-20s %-20s\\n\", \"KIND\", \"NAME\", \"NAMESPACE\",\n\"WILDCARD_IN\"\n  print\
    \  \"--------------- ---------------------------------------- ----------\n---------- --------------------\"\n} {\n  printf\
    \ \"%-15s %-40s %-20s %-20s\\n\", $1, $2, $3, $4\n}'\nSample Output from command:\nExternal - General\nKIND          \
    \  NAME                                     NAMESPACE\nWILDCARD_IN\n--------------- ----------------------------------------\
    \ --------------------\n--------------------\nClusterRole     cluster-admin                            cluster-wide\n\
    verbs,resources,apiGroups\nClusterRole     external-metrics-reader                  cluster-wide\nresources\nClusterRole\
    \     kubelet-api-admin                        cluster-wide\nverbs\nClusterRole     system:cloud-controller-manager  \
    \        cluster-wide\nresources,apiGroups\nClusterRole     system:controller:disruption-controller  cluster-wide\napiGroups\n\
    ClusterRole     system:controller:generic-garbage-collector cluster-wide\nresources,apiGroups\nClusterRole     system:controller:horizontal-pod-autoscaler\
    \ cluster-wide\nresources,apiGroups\nClusterRole     system:controller:namespace-controller   cluster-wide\nresources,apiGroups\n\
    ClusterRole     system:controller:resourcequota-controller cluster-wide\nresources,apiGroups\nClusterRole     system:gcp-controller-manager\
    \            cluster-wide\nverbs\nClusterRole     system:gke-common-webhooks               cluster-wide\nverbs,resources,apiGroups\n\
    ClusterRole     system:gke-hpa-actor                     cluster-wide\nresources,apiGroups\nClusterRole     system:glbc-status\
    \                       cluster-wide\nverbs\nClusterRole     system:kube-controller-manager           cluster-wide\nresources,apiGroups\n\
    ClusterRole     system:kubelet-api-admin                 cluster-wide\nverbs\nClusterRole     system:kubestore-collector\
    \               cluster-wide\nverbs,resources,apiGroups\nClusterRole     system:managed-certificate-controller    cluster-wide\n\
    verbs\nClusterRole     system:metrics-server-nanny              cluster-wide\nverbs\nRole            gke-spiffe-leaderelection\
    \                kube-system\nverbs"
  remediation: 'Where possible replace any use of wildcards in clusterroles and roles with specific

    objects or actions.'
  checks:
  - type: manual_review
    info: "Retrieve the roles defined across each namespaces in the cluster and review for\nwildcards\nHere’s a null-safe,\
