- id: 3.2.1
  title: Ensure that the --anonymous-auth argument is set to false
  scoring: scored
  profile:
  - Level 1
  description: Disable anonymous requests to the Kubelet server.
  rationale: When enabled, requests that are not rejected by other configured authentication methods are treated as anonymous
    requests. These requests are then served by the Kubelet server. You should rely on authentication to authorize access
    and disallow anonymous requests.
  impact: Anonymous requests will be rejected.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 39
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for authentication:

    anonymous: enabled set to false.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    find / -name kubelet.service

    The output of the above command should return the file and location

    /etc/systemd/system/kublet.service which is the location of the Kubelet service

    config file.

    Open the Kubelet service config file:

    sudo more etc/systemd/system/kublet.service

    Verify that the --anonymous-auth=false.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of

    authentication... "anonymous":{"enabled":false} by extracting the live

    configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output

    of "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=10.0.10.4 (example node name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If modifying the Kubelet service config file, edit the kubelet.service file

    /etc/systemd/system/kubelet.service and set the below parameter

    --anonymous-auth=false

    Remediation Method 2:

    If using the api configz endpoint consider searching for the status of

    "authentication.*anonymous":{"enabled":false}" by extracting the live

    configuration from the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a

    Live Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=10.0.10.4 (example node name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: find / -name kubelet.service
    expected: The output of the above command should return the file and location
    severity: medium
    info: 'Audit Method 1:

      If using a Kubelet configuration file, check that there is an entry for authentication:

      anonymous: enabled set to false.

      First, SSH to the relevant node:

      Run the following command on each node to find the appropriate Kubelet config file:

      find / -name kubelet.service

      The output of the above command should return the file and location

      /etc/systemd/system/kublet.service which is the l'
- id: 3.2.2
  title: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  scoring: scored
  profile:
  - Level 1
  description: Do not allow all requests. Enable explicit authorization.
  rationale: Kubelets, by default, allow all authenticated requests (even anonymous ones) without needing explicit authorization
    checks from the apiserver. You should restrict this behavior and only allow explicitly authorized requests.
  impact: Unauthorized requests will be denied.
  references:
  - 1. https://kubernetes.io/docs/admin/kubelet/
  - 2. https://kubernetes.io/docs/admin/kubelet-authentication-authorization/#kubeletauthentication
  page_start: 42
  audit_raw: 'Audit Method 1:

    If using a Kubelet configuration file, check that there is an entry for --authenticationmode.

    First, SSH to the relevant node:

    Run the following command on each node to find the appropriate Kubelet config file:

    find / -name kubelet.service

    The output of the above command should return the file and location

    /etc/systemd/system/kublet.service which is the location of the Kubelet service

    config file.

    Open the Kubelet service config file:

    sudo more etc/systemd/system/kublet.service

    Verify that the --authentication-mode=Webhook.

    Audit Method 2:

    If using the api configz endpoint consider searching for the status of

    authentication... "webhook":{"enabled":true} by extracting the live

    configuration from the nodes running kubelet.

    Set the local proxy port and the following variables and provide proxy port number and

    node name;

    HOSTNAME_PORT="localhost-and-port-number"

    NODE_NAME="The-Name-Of-Node-To-Extract-Configuration" from the output

    of "kubectl get nodes"

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=10.0.10.4 (example node name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"'
  remediation: 'Remediation Method 1:

    If modifying the Kubelet service config file, edit the kubelet.service file

    /etc/systemd/system/kubelet.service and set the below parameter

    --authorization-mode=Webhook

    Remediation Method 2:

    If using the api configz endpoint consider searching for the status of

    "authentication.*webhook":{"enabled":true}" by extracting the live

    configuration from the nodes running kubelet.

    **See detailed step-by-step configmap procedures in Reconfigure a Node''s Kubelet in a

    Live Cluster, and then rerun the curl statement from audit process to check for kubelet

    configuration changes

    kubectl proxy --port=8001 &

    export HOSTNAME_PORT=localhost:8001 (example host and port number)

    export NODE_NAME=10.0.10.4 (example node name from "kubectl get nodes")

    curl -sSL "http://${HOSTNAME_PORT}/api/v1/nodes/${NODE_NAME}/proxy/configz"

    For all remediations:

    Based on your system, restart the kubelet service and check status

    systemctl daemon-reload

    systemctl restart kubelet.service

    systemctl status kubelet -l'
  checks:
  - type: command
    command: find / -name kubelet.service
    expected: The output of the above command should return the file and location
