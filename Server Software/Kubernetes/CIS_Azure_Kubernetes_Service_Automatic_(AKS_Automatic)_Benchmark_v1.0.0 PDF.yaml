    \ to the cluster and each namespace.\n• Review whether controls within each namespace such as quotas and network\npolicies\
    \ are applied where required.\nQuick inventory checks:\nkubectl get namespaces\nkubectl get rolebindings,roles -A\nkubectl\
    \ get clusterrolebindings,clusterroles\nkubectl get resourcequota,networkpolicy -A\nA namespace should be considered adequately\
    \ administered only when it has a clear\npurpose, RBAC limited to the required namespace, and the controls needed for\
    \ that\nworkload or team.\n Page 85"
  remediation: "Microsoft recommends namespaces as the logical isolation boundary for workloads and\nresources in shared clusters,\
