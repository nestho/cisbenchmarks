      export CLUSTER_NAME=<your clus'
- id: 5.4.4
  title: Use HTTPS with valid TLS certificates for externally exposed workloads
  scoring: manual
  profile:
  - Level 2
  description: Protect externally exposed AKS applications by ensuring client connections use HTTPS with a valid TLS certificate
    instead of plaintext HTTP at the cluster entry point. That protection is typically applied at the ingress or gateway layer,
    where external web traffic is accepted and routed to backend services. Using TLS at that layer reduces the risk of exposing
    application traffic, credentials, session data, or other sensitive content in transit. AKS Automatic supplies a managed
    application routing path, while the workload owner remains responsible for configuring the HTTPS listener, hostname, and
    certificate.
  rationale: External HTTP traffic is commonly handled by an Ingress controller or Gateway implementation, not by the Layer
    4 Standard Load Balancer itself. That means the relevant enforcement point for this control is the Layer 7 listener that
    accepts requests for the application hostname. When that listener is configured for HTTPS, the client performs a TLS handshake
    with the endpoint, validates the server certificate for the requested DNS name, and establishes an encrypted session before
    any HTTP payload is exchanged. A valid public certificate must be within its validity period, contain the requested hostname
    in its subject alternative name, and chain to a certificate authority trusted by the client. AKS supports this model through
    ingress configurations that bind a certificate to the tls section of an Ingress resource, including certificate material
    sourced from Azure Key Vault and referenced through the generated Kubernetes TLS secret. The Application Routing Gateway
    API integration can also reconcile the SecretProviderClass, Kubernetes TLS Secret, and Gateway listener certificate reference
    for a certificate stored in Azure Key Vault. The ingress path can then perform TLS termination and forward traffic to
    backend services according to the configured routing rules. For AKS Automatic, the managed Application Routing Gateway
    API implementation is the current default ingress direction, so each Gateway listener must still declare HTTPS and an
    approved certificate source. Page 135
  impact: Enforcing this control adds certificate management to the AKS ingress path, including hostname and certificate matching,
    secret or Key Vault integration, and certificate rotation for the exposed listener. Expired, untrusted, or mismatched
    certificates can cause client warnings or connection failures, and disabling plaintext HTTP can affect clients that do
    not support HTTPS or follow redirects. TLS termination protects traffic between the client and the entry point only. Encryption
    from the entry point to the backend must be configured separately when the security design requires end to end TLS. When
    the managed Azure Key Vault integration is used, incorrect Workload ID, Key Vault permissions, certificate URI, or listener
    options can prevent certificate synchronization or Gateway programming and interrupt external access. Page 136
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-network-ingress
  page_start: 135
  audit_raw: "It is important to review this at the Ingress or Gateway layer, and at any public\nLoadBalancer Service that\
    \ exposes web traffic directly, since those components are the\nprimary enforcement points for external HTTP and TLS termination.\
    \ The purpose of the\nreview is to confirm that public application entry points are not exposing client traffic\nover\
    \ plaintext HTTP and that every externally published hostname is protected by a\ncertificate based HTTPS or TLS listener.\n\
    Ingress can provide SSL termination, and the Application Routing add on supports\ncertificate based HTTPS using Azure\
    \ Key Vault integration. For AKS Automatic clusters\nusing the managed Gateway API path, review the Gateway listener protocol,\
    \ hostname,\nTLS mode, and certificate configuration together.\n• Review all externally exposed Ingress and Gateway resources,\
    \ plus public\nLoadBalancer Services that carry web traffic, and identify every public hostname,\nlistener, and route\
    \ used to publish HTTP application traffic.\n• For each exposed hostname, verify the listener is configured for HTTPS\
    \ or TLS\nrather than HTTP only exposure, and confirm the configuration includes a valid\ncertificate reference for termination.\
    \ Confirm plaintext HTTP is disabled or\nredirects to HTTPS. AKS Gateway and ingress configurations are the\nenforcement\
    \ points for this control.\n• Confirm the certificate source is valid and intentional, such as a Kubernetes TLS\nsecret\
    \ or a certificate synchronized from Azure Key Vault, and verify the\ncertificate is bound to the correct hostname. Validate\
    \ that the certificate has not\nexpired, its subject alternative name matches the published hostname, and its\nchain is\
    \ trusted by expected clients. AKS application routing supports SSL/TLS\ncertificate use through these patterns.\n• Treat\
    \ externally exposed HTTP only listeners, missing TLS secret references,\ninvalid or expired certificates, or public hostnames\
    \ without certificate based\nlistener configuration as findings, because those conditions indicate traffic can\nreach\
    \ the workload entry point without effective HTTPS protection.\n• If the cluster uses the Application Routing add on,\
    \ also verify the intended\ncertificate management path is in place, since managed Ingress and Gateway\nimplementations\
    \ support TLS termination and Azure Key Vault certificate\nintegration. For the automated Gateway integration, confirm\
    \ the listener contains\nthe required Azure Key Vault certificate URI and service account TLS options,\nand confirm the\
    \ resulting Gateway is programmed successfully.\n Page 137"
  remediation: 'Remediate by ensuring every externally exposed AKS web entry point is published

    through an Ingress or Gateway listener configured for HTTPS/TLS, with a valid

    certificate bound to the public hostname. If a public LoadBalancer Service exposes a

    web application directly, configure TLS in the application or place the service behind an

    approved TLS terminating entry point.

    HTTPS protection is typically implemented at the Layer 7 ingress or gateway layer,

    where client traffic is accepted and TLS is terminated before traffic is forwarded to

    backend services. The remediation objective is to eliminate plaintext HTTP exposure for

    public application endpoints and standardize certificate based TLS for all external web

    traffic. Use the managed Application Routing Gateway API path provided by AKS

    Automatic unless the approved architecture requires another supported ingress

    implementation.

    1. Update each public Ingress or Gateway that currently exposes HTTP only traffic

    so the listener uses HTTPS or TLS for the published hostname. Disable the

    HTTP listener or configure it to redirect to HTTPS.

    2. Bind a valid certificate and private key to each exposed hostname, either through

    a Kubernetes kubernetes.io/tls secret or through an AKS supported

    certificate integration such as Azure Key Vault. For the managed Gateway

    integration, configure the Azure Key Vault certificate URI and service account

    TLS options on the HTTPS listener.

    3. Ensure the certificate subject or SAN matches the DNS name being published,

    the certificate chains to a trusted authority, and renewal occurs before expiration

    so the listener can complete TLS negotiation correctly for the requested host.

    AKS application routing guidance is based on configuring certificates for the

    custom domain used by the ingress endpoint.

    4. Where the cluster uses the Application Routing add on and Azure Key Vault,

    configure the supported certificate integration and automatic rotation so TLS

    material is centrally managed and available to the ingress path.

    5. Configure encryption from the ingress or gateway to the backend when the

    approved design requires end to end TLS.

    6. After remediation, verify that public endpoints redirect or serve over HTTPS only,

    that the listener presents the expected certificate, and that backend routing still

    functions after TLS termination. AKS ingress supports SSL/TLS termination as

    part of the application entry configuration.'
  checks:
  - type: manual_review
    info: 'It is important to review this at the Ingress or Gateway layer, and at any public

      LoadBalancer Service that exposes web traffic directly, since those components are the

      primary enforcement points for external HTTP and TLS termination. The purpose of the

      review is to confirm that public application entry points are not exposing client traffic

      over plaintext HTTP and that every externally published hostname is protected by a

      certificate based HTTPS or TLS listener.

      Ingress can provide SSL terminat'
    severity: medium
- id: 5.5.1
  title: Use Microsoft Entra ID authorization for the Kubernetes API
  scoring: manual
  profile:
  - Level 2
  description: Using Microsoft Entra ID authorization for the Kubernetes API helps centralize AKS access control in the same
    Azure IAM model used for other Azure resources, instead of managing human user permissions only through Kubernetes bindings.
    At a high level, this improves consistency, makes access assignment easier to govern across subscriptions and clusters,
    and supports least privilege access by assigning only the Azure roles needed for Kubernetes API use. AKS Automatic provides
    this authorization model as part of its preconfigured identity and security baseline.
  rationale: Microsoft Entra ID authorization for the Kubernetes API uses a Kubernetes authorization webhook after the user
    is authenticated through Microsoft Entra ID. Requests to the Kubernetes API follow the Entra integrated authentication
    flow, and once the calling identity is validated, AKS uses Azure RBAC role assignments to determine what Kubernetes resources
    that identity can access. AKS supports this model with built in Azure roles such as Azure Kubernetes Service RBAC Reader,
    Writer, Admin, and Cluster Admin, and it also allows the use of custom Azure roles where needed. Role assignments can
    be limited to a namespace or cluster, or inherited from the resource group, subscription, or management group that contains
    the cluster. This authorization model depends on managed Microsoft Entra integration being enabled on the cluster first.
    It also requires the Microsoft Entra tenant used for authentication to be the same tenant associated with the subscription
    that contains the AKS cluster. Identities that do not authenticate through Entra, such as Kubernetes service accounts,
    are not evaluated through Microsoft Entra ID authorization and continue to use standard Kubernetes RBAC instead. AKS Automatic
    preconfigures the required Microsoft Entra integration and Azure RBAC authorization settings, so operators primarily manage
    the resulting role assignments rather than enable the authorization model. When custom Azure RBAC roles are used, permission
    design should account for the difference between custom resource definitions (CRDs) and standard Kubernetes resources.
    Standard Kubernetes resources use the supported AKS data actions defined in the custom role. For custom resources, current
    AKS authorization supports custom roles with Azure ABAC conditions that can limit access to required CRD groups and kinds.
    This avoids granting access to every custom resource when only specific CRDs are required. Page 141
  impact: This model shifts AKS authorization for Entra users, groups, and service principals into Azure role assignment management,
    which reduces the need to maintain Kubernetes RoleBinding and ClusterRoleBinding objects for those human identities. Operationally,
    access changes are subject to Azure role assignment propagation, and Microsoft notes new assignments can take up to five
    minutes to take effect. Assignments made above the cluster can apply to multiple current and future clusters, so an incorrect
    assignment level can grant more access than intended. Users can also be denied access if they have permission to retrieve
    cluster credentials but lack an AKS RBAC role that authorizes Kubernetes API operations.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 141
  audit_raw: "Review the AKS cluster to confirm AKS managed Microsoft Entra integration is enabled\nand Microsoft Entra ID\
    \ authorization for the Kubernetes API is turned on as expected for\nAKS Automatic. Then verify that access for users,\
    \ groups, and service principals is\nbeing granted through Azure role assignments for Kubernetes authorization rather\
    \ than\nprimarily through Kubernetes RoleBinding and ClusterRoleBinding objects for\nthose Entra identities. As part of\
    \ the review, confirm the cluster is using the same Entra\ntenant as the subscription that contains the AKS cluster, since\
    \ that is a requirement for\nthis authorization model. Also review role assignments inherited from Azure resource\nlevels\
    \ above the cluster.\nUse the following command to review the cluster configuration:\naz aks show --resource-group ${RESOURCE_GROUP}\
    \ --name ${CLUSTER_NAME} --query\n\"{managedEntra:aadProfile.managed,azureRbac:aadProfile.enableAzureRbac,tenantId:aad\n\
    Profile.tenantId,localAccountsDisabled:disableLocalAccounts}\" -o json\n1. Confirm managedEntra and azureRbac are true.\
    \ A false value is not\nexpected for the AKS Automatic authorization baseline and should be\ninvestigated.\n2. Confirm\
    \ tenantId matches the Microsoft Entra tenant associated with the Azure\nsubscription.\n3. Review direct and inherited\
    \ Azure role assignments and confirm each user,\ngroup, or service principal has only the required AKS RBAC role.\n4.\
    \ Review custom roles and Azure ABAC conditions for custom resource access\nand confirm they identify only the required\
    \ CRD groups and kinds.\n5. Confirm localAccountsDisabled is true when all human access must use\nMicrosoft Entra ID.\n\
    \ Page 142"
  remediation: 'AKS Automatic already provides Microsoft Entra integration and Azure RBAC for

    Kubernetes authorization, so remediation normally consists of correcting Azure role

    assignments rather than enabling the authorization model. For stronger control, pair this

    with disabling local accounts so static --admin access does not remain available as an

    alternate path. If local accounts are disabled on an existing cluster, rotate cluster

    certificates to revoke previously issued local account credentials. For custom resource

    access, use an approved custom role and Azure ABAC conditions to limit access to the

    required CRD groups and kinds where supported.

    1. Confirm the preconfigured Microsoft Entra integration and Azure RBAC

    authorization settings remain enabled. Investigate any cluster that does not

    report the expected AKS Automatic values.

    2. Assign approved Microsoft Entra groups the minimum required Azure Kubernetes

    Service RBAC role at the required namespace or cluster. Use a higher Azure

    resource level only when access must apply to every cluster below that resource.

    3. Remove obsolete or duplicate Azure role assignments and retire Kubernetes

    bindings for human Entra identities after replacement access has been validated.

    4. Create approved custom roles and Azure ABAC conditions for required custom

    resource access.

    5. Disable local accounts after the Microsoft Entra access path is verified. For an

    existing cluster, rotate cluster certificates to revoke previously issued local

    credentials.'
