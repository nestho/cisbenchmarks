- id: 4.4.1
  title: Prefer exposing secrets as mounted files rather than environment variables
  scoring: scored
  profile:
  - Level 2
  description: Prefer exposing secrets to AKS workloads as mounted files rather than as environment variables, particularly
    when secrets are sourced from Azure Key Vault through the Secrets Store CSI Driver. In current AKS guidance, the Key Vault
    integration model is volume based, with secrets made available at a mounted path inside the container, and Microsoft documents
    that mounted content can be synchronized and rotated through the CSI provider. Environment variable consumption is still
    supported when secrets are synced into a Kubernetes Secret, but it is a secondary consumption pattern rather than the
    native CSI delivery path. AKS Automatic preconfigures Workload Identity and the OIDC issuer, but the workload still determines
    how a secret is consumed.
  rationale: It is important to align secret delivery with AKS’s supported rotation and identity model. Microsoft documents
    that, with autorotation enabled, the CSI provider can update the pod mount and synced Kubernetes Secret, and applications
    that read secrets from the filesystem can react to file changes without requiring a full pod restart when they watch and
    reload the changed file. By contrast, when a secret is consumed as an environment variable, the pod must be restarted
    to receive the latest value. For AKS workloads, this makes file based delivery the stronger pattern for secrets that rotate
    regularly or are backed by Azure Key Vault.
  impact: If secrets are primarily exposed as environment variables, rotated values can remain stale in running AKS workloads
    until a restart or rolling redeployment occurs. That increases operational friction during credential rotation, slows
    response to secret changes, and can leave applications using expired or superseded credentials longer than intended. Microsoft
    also notes a related Kubernetes limitation for subPath secret mounts, where automated updates are not received, so the
    safest AKS pattern is a standard mounted secret path that the application can watch and reload. Page 76
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 76
  audit_raw: "Identify workloads that consume secrets through environment variables and treat those\ncases as exceptions that\
    \ require justification. Mounted secrets are the preferred steady\nstate pattern because they can be updated through the\
    \ Secrets Store CSI Driver and\nautorotation process, whereas secrets exposed through environment variables require a\n\
    pod restart before updated values are available. This is especially important when\nsecrets are sourced from Azure Key\
    \ Vault through the managed Secrets Store CSI\nDriver.\n• Identify workloads that use secret backed environment variables,\
    \ including\nsecretKeyRef and envFrom.secretRef.\n• Review whether those workloads use mounted secret files instead of\n\
    environment variable injection.\n• Treat environment variable usage as an exception and confirm it is documented\nand\
    \ justified.\n• Verify a restart process exists where environment variable secrets are still\nrequired.\n• Confirm file\
    \ based secret delivery is used where rotation is expected.\nA quick cluster verification:\nkubectl get deploy,statefulset,daemonset,job,cronjob,pod\
    \ -A -o json | jq -r '\n.items[]\n| .metadata.namespace as $ns\n| .kind as $kind\n| .metadata.name as $name\n| (\n   \
    \ if .kind==\"CronJob\" then .spec.jobTemplate.spec.template.spec\n    elif .kind==\"Pod\" then .spec\n    else .spec.template.spec\n\
    \    end\n  ) as $spec\n| [\n    ($spec.containers[]?.env[]? | select(.valueFrom.secretKeyRef) |\n\"env.secretKeyRef\"\
    ),\n    ($spec.initContainers[]?.env[]? | select(.valueFrom.secretKeyRef) |\n\"init.env.secretKeyRef\"),\n    ($spec.containers[]?.envFrom[]?\
    \ | select(.secretRef) | \"envFrom.secretRef\"),\n    ($spec.initContainers[]?.envFrom[]? | select(.secretRef) |\n\"init.envFrom.secretRef\"\
    )\n  ] | unique | select(length>0)\n| \"\\($ns)\\t\\($kind)/\\($name)\\t\" + join(\",\")\n'\nNOTE: If the command returns\
    \ rows, those workloads use secret backed environment\nvariables and should be reviewed. If it returns no rows, no such\
    \ references were found\nin the inspected workloads, but mounted secret volumes or SecretProviderClass\nusage should still\
    \ be checked to confirm file based secret delivery.\n Page 77"
  remediation: 'Move workloads away from secret backed environment variables and toward file based

    secret delivery through mounted volumes, preferably using the Azure Key Vault provider

    for Secrets Store CSI Driver. Mounted secrets support sync and autorotation, while

    secrets exposed through environment variables do not update in running pods until

    those pods are restarted.

    1. Identify workloads that use secretKeyRef or envFrom.secretRef and

    classify them for migration.

    2. Replace environment variable injection with mounted secret files, ideally through

    SecretProviderClass and the Secrets Store CSI Driver using the Workload

    Identity capability preconfigured by AKS Automatic.

    3. Enable secret autorotation where supported so mounted content and synced

    Kubernetes Secrets are refreshed automatically.

    4. Update the application to read secrets from the mounted path and reload them

    from file when values change. Microsoft documents that the application must

    watch for file changes to use updated mounted content without a restart.

    5. Keep environment variable usage only for approved exceptions, and pair those

    cases with a controlled pod restart process during secret rotation.'
  checks:
  - type: manual_review
    info: 'Identify workloads that consume secrets through environment variables and treat those

      cases as exceptions that require justification. Mounted secrets are the preferred steady

      state pattern because they can be updated through the Secrets Store CSI Driver and

      autorotation process, whereas secrets exposed through environment variables require a

      pod restart before updated values are available. This is especially important when

      secrets are sourced from Azure Key Vault through the managed Secrets Stor'
    severity: medium
- id: 4.4.2
  title: Consider external secret storage
  scoring: manual
  profile:
  - Level 2
  description: Consider external secret storage for AKS workloads by storing sensitive values in Azure Key Vault and retrieving
    them at runtime through the Azure Key Vault provider for Secrets Store CSI Driver instead of treating Kubernetes Secret
    objects in the cluster as the primary secret system. Microsoft documents this as a supported AKS integration in which
    secrets, keys, and certificates are mounted into pods through a CSI volume, with access mediated by a managed identity
    or Microsoft Entra Workload ID. AKS Automatic preconfigures Workload Identity and the OIDC issuer, but the Key Vault provider
    and workload secret configuration still require setup.
  rationale: It is important to align secret handling with AKS’s supported identity, rotation, and operational model. Microsoft
    documents that the CSI based Key Vault integration supports mounted secret delivery, managed identity based access, autorotation
    of mounted contents and synced Kubernetes Secrets, and runtime retrieval of the latest secret values from Key Vault. Microsoft’s
    AKS Well-Architected guidance also states that this pattern helps protect and rotate secrets by using strong encryption,
    provides an access audit log, and keeps core secrets out of the deployment pipeline.
  impact: If external secret storage is not used where appropriate, sensitive application credentials are more likely to remain
    embedded in cluster native objects, deployment artifacts, or operational workflows that are harder to rotate and govern
    consistently. Using Azure Key Vault with the Secrets Store CSI Driver improves secret freshness through rotation support
    and limits secret delivery to the requesting pod, while the WellArchitected guidance highlights the additional benefits
    of centralized protection. As a result, not adopting external secret storage can increase operational overhead during
    rotation and reduce assurance around how critical secrets are stored, accessed, and tracked. Page 80
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 80
  audit_raw: 'Audit secrets management by confirming that sensitive values are stored externally,

    delivered to pods through the AKS supported secret path, and rotated without relying on

    manual redeployments. Microsoft’s current AKS guidance centers on Azure Key Vault,

    the Azure Key Vault provider for Secrets Store CSI Driver, and mounted secret delivery

    with autorotation support.

    • Verify secrets are primarily stored in Azure Key Vault, not embedded in code,

    manifests, or pipelines.

    • Confirm the Secrets Store CSI Driver is enabled and SecretProviderClass is

    used where external secrets are required.

    • Review workload access to Key Vault and ensure it uses managed identity or

    Microsoft Entra Workload ID with least privilege access.

    • Flag secret backed environment variables as exceptions, since mounted secrets

    support rotation more cleanly.

    • Verify autorotation is enabled where needed and that applications can reload

    updated mounted secrets.'
  remediation: "Move sensitive application secrets that are appropriate for external storage out of\nKubernetes native storage\
    \ and deployment artifacts and into Azure Key Vault. Deliver\nthose secrets to pods at runtime through the Azure Key Vault\
    \ provider for Secrets Store\nCSI Driver. Pair the CSI driver with Microsoft Entra Workload ID using the Workload\nIdentity\
    \ and OIDC issuer capabilities preconfigured by AKS Automatic. The add on\nmanaged identity may be used when appropriate.\
    \ Use mounted secret files as the\nprimary consumption path and enable autorotation where secret freshness matters.\n\
    Retain Kubernetes Secret objects only where required for Kubernetes functions or an\napproved synchronization pattern.\n\
    • Inventory secrets currently stored in code, manifests, pipelines, or standalone\nKubernetes Secret objects and identify\
    \ sensitive application secrets appropriate\nfor migration to Key Vault.\n• Enable the Azure Key Vault provider for Secrets\
    \ Store CSI Driver on the cluster if\nit is not already enabled.\n• Configure workload access through Workload ID or the\
    \ AKS managed identity,\nwith least privilege Key Vault permissions limited to the required vault and object\ntypes.\n\
    • Replace secret backed environment variables with mounted secret files delivered\nthrough SecretProviderClass where practical.\n\
    • Enable secret autorotation for rotatable values and confirm applications can\nreload updated mounted content without\
    \ manual secret redistribution.\n Page 81"
  checks:
  - type: manual_review
    info: 'Audit secrets management by confirming that sensitive values are stored externally,

      delivered to pods through the AKS supported secret path, and rotated without relying on

      manual redeployments. Microsoft’s current AKS guidance centers on Azure Key Vault,

      the Azure Key Vault provider for Secrets Store CSI Driver, and mounted secret delivery

      with autorotation support.

      • Verify secrets are primarily stored in Azure Key Vault, not embedded in code,

      manifests, or pipelines.

      • Confirm the Secrets Stor'
    severity: medium
- id: 4.5.1
  title: Create administrative boundaries between resources using namespaces
  scoring: manual
  profile:
  - Level 1
  description: Create administrative boundaries between resources by organizing AKS workloads into separate namespaces and
    scoping access to those namespaces with Kubernetes RBAC or Azure RBAC for Kubernetes Authorization. Azure RBAC for Kubernetes
    Authorization is preconfigured in AKS Automatic, while Kubernetes RBAC remains applicable to service accounts and any
    additional Kubernetes RBAC bindings. Namespaces form the logical isolation boundary for workloads and resources, and Kubernetes
    RBAC can limit permissions to a single namespace or apply them across the entire cluster. This is the standard way to
    separate teams, applications, and environments inside a shared cluster while applying controls within each namespace such
    as access, quotas, and network policy. Managed namespaces are optional and can simplify the application of these controls.
  rationale: It is important to reduce administrative sprawl and enforce least privilege operations within a shared AKS cluster.
    Microsoft recommends logical isolation for trusted teams and workloads because it lets multiple workloads or teams share
    one cluster while still applying permissions limited to each namespace and other controls within each namespace. This
    improves density and reduces excess capacity compared with creating separate clusters for every team or application. Limiting
    access by namespace also fits Microsoft’s identity guidance, which emphasizes granting users, groups, and service accounts
    only the resources they need. Limiting the scope of user permissions reduces the impact of mistakes or malicious activity
    by keeping administrative access aligned to a defined namespace boundary. Namespaces provide logical separation for workloads
    and resources, and access to those namespaces can be controlled through Kubernetes RBAC or Azure RBAC for Kubernetes Authorization.
    While resources are created in the default namespace unless another namespace is specified, Microsoft’s current guidance
    is to organize workloads into separate namespaces and apply access limited to each namespace, quotas, and network policies
    to support controlled operations across multiple teams or applications within a shared cluster. Preconfigured Azure RBAC
    provides the authorization mechanism, but it does not create customer workload namespaces or assign access to them. Page
    84
  impact: If namespaces are not used to establish administrative boundaries, AKS access and operational controls tend to become
    broader and harder to govern, increasing the chance that users or workloads can affect resources outside their intended
    scope. Namespaces do not isolate nodes, other cluster resources, or pod network traffic by themselves, so RBAC, quotas,
    and network policies remain necessary. Microsoft cautions that namespaces do not provide sufficient isolation for hostile
    multitenant workloads because the security domain is effectively the cluster. Relying on namespaces alone for strong tenant
    isolation can create false assurance. In those cases, Microsoft recommends dedicated clusters or stronger isolation models
    instead of namespace separation.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-managed-namespaces
  page_start: 84
  audit_raw: "Verify that namespaces are not only present, but are being used as intentional\nadministrative boundaries for\
    \ teams, applications, or environments within the AKS\ncluster. Namespaces are the logical isolation boundary for workloads\
    \ and resources in a\nshared cluster, and they should be paired with access controls and other governance\nwithin each\
    \ namespace such as quotas and network policies. Namespaces alone are\nnot sufficient for hostile multitenancy, so the\
    \ audit should focus on whether they are\nbeing used consistently to separate administration and operations as intended.\n\
    • List all namespaces in the cluster and confirm each one has a defined\nadministrative or workload purpose.\n• Verify\
