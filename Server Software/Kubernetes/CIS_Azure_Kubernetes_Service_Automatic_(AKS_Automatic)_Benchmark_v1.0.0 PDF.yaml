    host namespace sharing as a condition that should be blocked. Broad use of hostPID can make containment, troubleshooting,
    and assurance of workload boundaries more difficult because the Pod is no longer operating within the default process
    isolation boundary. AKS Automatic enforces baseline Pod Security Standards by default, so Pods defined with spec.hostPID:
    true are denied unless an approved namespace exclusion applies. Page 62'
