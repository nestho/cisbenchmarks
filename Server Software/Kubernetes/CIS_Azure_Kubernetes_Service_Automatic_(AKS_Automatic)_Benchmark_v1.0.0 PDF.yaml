    \ through Pod Security Admission and Deployment Safeguards.\n• Review pod specs for explicit securityContext settings\
    \ at the pod and\ncontainer level, including regular, init, and ephemeral containers. Focus on\nrunAsNonRoot, runAsUser,\
    \ runAsGroup, fsGroup,\nallowPrivilegeEscalation, capabilities, and seccompProfile.\n• Flag workloads that run as root,\
    \ allow privilege escalation, or omit required\nsecurity context controls as findings unless formally approved. Microsoft\n\
    specifically recommends setting allowPrivilegeEscalation to false and\nrunning as a defined user or group instead of root.\n\
    • Verify whether applicable namespaces use the Restricted Pod Security Standard\nwhen this control requires settings beyond\
    \ the AKS Automatic Baseline standard.\nAKS supports enforce, audit, and warn modes for Pod Security Standards.\n• Confirm\
    \ Deployment Safeguards remains in Enforce mode and review any\nexcluded namespaces.\n Page 89"
  remediation: 'Remediate by defining and enforcing a hardened pod and container security baseline

    for all application namespaces in AKS, then requiring workloads to declare the

    necessary securityContext fields in their manifests. Pod Security Admission is

    enabled by default and is applied with namespace labels. Microsoft’s pod security

    guidance recommends explicit settings such as execution without root access,

    allowPrivilegeEscalation: false, limited capabilities, and seccompProfile.

    AKS Automatic already uses Deployment Safeguards with the Baseline Pod Security

    Standard in Enforce mode at create or update time.

    • Apply PSA restricted labels to general application namespaces that can meet the

    Restricted Pod Security Standard, using warn and audit first where rollout

    needs to be staged. The Baseline Pod Security Standard alone does not enforce

    the full set of security context restrictions covered by this control.

    • Update workload manifests to define pod and container securityContext

    values for regular, init, and ephemeral containers, such as runAsNonRoot,

    explicit user and group IDs where required, allowPrivilegeEscalation:

    false, dropped capabilities, and seccompProfile.type:

    RuntimeDefault.

    • Restrict exception workloads to tightly controlled namespaces and service

    accounts, and limit who can deploy there through RBAC limited to that

    namespace.

    • Keep Deployment Safeguards in Enforce mode and limit namespace exclusions

    to approved exceptions.

    • Revalidate workloads after rollout to confirm required applications still function

    without unnecessary privileges, root execution, or unnecessary host access.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing workload manifests to confirm pod and container

      securityContext settings are explicitly defined and aligned to the AKS security

      baseline. In current AKS guidance, securityContext is the primary manifest

      mechanism for enforcing least privilege runtime behavior. AKS supports validating or

      enforcing these settings through Pod Security Admission and Deployment Safeguards.

      • Review pod specs for explicit securityContext settings at the pod and

      container level, includin'
    severity: medium
- id: 4.5.3
  title: The default namespace should not be used
  scoring: scored
  profile:
  - Level 2
  description: Avoid placing application workloads in the default namespace, and instead deploy them into dedicated namespaces
    that reflect the intended team, application, or environment boundary. Namespaces are the built in way to logically divide
    cluster resources and limit access, while the default namespace exists mainly so a cluster can be used immediately without
    first creating a new namespace. Microsoft’s current AKS namespace guidance also ties namespace design to controls within
    each namespace such as RBAC, quotas, and network policies.
  rationale: It is important to preserve least privilege administration and make governance within each namespace actually
    usable. Namespaces form the logical isolation boundary in shared clusters, and Azure RBAC for Kubernetes Authorization,
    which is preconfigured for AKS Automatic, and Kubernetes RBAC for service accounts can limit permissions to a single namespace
    instead of the whole cluster. When workloads stay in default, it becomes harder to apply clean administrative separation,
    delegated access, resource quotas, and network segmentation by namespace in the way AKS is designed to support.
  impact: Using the default namespace for application workloads weakens administrative separation and increases the blast
    radius of mistakes or misuse within that namespace. Microsoft also flags default namespace usage as an AKS security recommendation
    because it can expose common resource types such as Pods, Secrets, Services, ServiceAccounts, and ConfigMaps to access
    granted within the default namespace. When the Azure built in policy uses the Deny effect, creation of these targeted
    resource types in the default namespace can be blocked, so existing applications should be migrated before enforcement.
    Page 92
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/core-aks-concepts
  page_start: 92
  audit_raw: 'Verify that the default namespace is not being used as a landing zone for user

    managed applications, supporting resources, or service accounts used by applications.

    Namespaces are the logical administrative boundary for workloads, and Microsoft flags

    use of the default namespace as a security recommendation because it can expose

    common namespace resource types to access granted within the default namespace.

    The cluster should pass this control only when application resources have been moved

    into dedicated namespaces and default is not being used for normal workload

    administration.

    • List resources in the default namespace and identify any user managed

    workloads or supporting objects.

    • Review whether application resources, service accounts, ConfigMaps, and

    Secrets are being created in default instead of dedicated namespaces.

    • Treat any unapproved application use of default as a finding, even if the

    namespace also contains expected objects created by Kubernetes or AKS.

    • Confirm Microsoft Entra user access through Azure RBAC for Kubernetes

    Authorization and service account access through Kubernetes RBAC are limited

    to dedicated namespaces rather than relying on default for routine operations.

    If the Azure built in policy is assigned, review its compliance results and configured

    effect.

    kubectl get

    pod,svc,configmap,secret,serviceaccount,deploy,statefulset,daemonset,job,cronjob,in

    gress -n default'
  remediation: "Create dedicated namespaces for teams, applications, and environments, then require\nall new resources to\
    \ be deployed into those namespaces instead of default.\nNamespaces are the logical boundary for workload administration,\
    \ so remediation\nshould include recreating existing resources in dedicated namespaces or AKS managed\nnamespaces where\
    \ used, applying RBAC and other controls within the required\nnamespace, and reserving access throughout the cluster for\
    \ true platform\nadministrators only. Because the namespace field cannot be changed for most existing\nKubernetes objects,\
    \ recreate the resources in the destination namespace, validate the\napplication, and then remove the original resources\
    \ from default. Assign the Azure built\nin policy with Audit first, then use Deny after application resources have been\
    \ migrated\nand approved exceptions have been addressed.\n Page 93"
  checks:
  - type: manual_review
    info: 'Verify that the default namespace is not being used as a landing zone for user

      managed applications, supporting resources, or service accounts used by applications.

      Namespaces are the logical administrative boundary for workloads, and Microsoft flags

      use of the default namespace as a security recommendation because it can expose

      common namespace resource types to access granted within the default namespace.

      The cluster should pass this control only when application resources have been moved

      into'
    severity: medium
- id: 5.1.1
  title: Ensure container image vulnerability scanning with Defender for Containers or a third-party provider
  scoring: manual
  profile:
  - Level 1
  description: Ensure vulnerability scanning is enabled for container images that are stored in registries and intended for
    deployment to AKS, using Microsoft Defender for Containers, Defender CSPM where supported, or an equivalent third party
    scanner. This control applies both to registry images and, where enabled and supported, to running containers in AKS.
    AKS Automatic includes Image Cleaner by default, but it does not replace container image vulnerability assessment. For
    Defender based coverage, registry image assessment requires Registry access to be enabled, and Microsoft documents support
    for scanning images in ACR and other supported registries. Scans occur for newly pushed or imported images, and daily
    rescans update findings for images pushed or pulled within the previous 30 days and images currently running in monitored
    clusters so findings remain current as new CVEs are published.
  rationale: It is important to reduce software supply chain risk before vulnerable images are deployed or continue running
    in AKS. Container images should be scanned for vulnerabilities and only validated images should be deployed. Defender
    for Containers adds technical depth by performing agentless vulnerability assessment across supported container images,
    including OS packages and supported language packages, and then surfacing CVE findings and remediation guidance through
    Defender for Cloud recommendations. These findings support a preventive control when image promotion or admission processes
    block images that do not meet approved vulnerability criteria. Without that enforcement, scanning remains a detection
    and prioritization control.
  impact: Implementing this control may require additional registry integration, scan result review, and remediation work
    before images are promoted to AKS. Defender plans or third party scanning services can also introduce additional cost.
    Vulnerable images may need to be rebuilt, patched, replaced, or blocked from deployment, which can add operational overhead
    but improves the security of the container supply chain. If the Defender sensor is installed through Helm, the customer
    is responsible for Helm based sensor upgrades. Page 96
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-vulnerability-management
  - 2. https://learn.microsoft.com/en-us/azure/defender-for-cloud/agentlessvulnerability-assessment-azure
  page_start: 96
  audit_raw: "Review whether Microsoft Defender for Containers or Defender CSPM is enabled for\nthe subscription and whether\
    \ registry image vulnerability assessment is enabled under\nthat plan. For AKS, also verify the cluster Defender profile\
    \ when cluster side monitoring\nis in scope, and confirm Defender for Cloud is generating vulnerability findings for\n\
    relevant images. For an AKS Automatic cluster using a Helm based Defender sensor,\nverify the Helm release in the kube-system\
    \ namespace instead of relying only on the\nAKS Defender profile.\n• Confirm Microsoft.Security/pricings/Containers uses\n\
    pricingTier: Standard when Defender for Containers provides the\nscanning coverage.\n• Confirm the ContainerRegistriesVulnerabilityAssessments\
    \ extension\nis enabled for the selected Defender plan.\n• Verify securityProfile.defender.securityMonitoring.enabled\
    \ is\ntrue when required and the AKS built in Defender option is used.\n• Confirm the environment supports the intended\
    \ scan scope, such as registry\nimages and, where applicable, running containers.\nIf a third party provider is used,\
    \ confirm supported registries are connected, scans run\nwhen images are pushed and periodically afterward, current findings\
    \ are reviewed, and\npromotion criteria are enforced.\nTo verify the cluster side directly, use:\naz aks show --resource-group\
    \ ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query\n\"securityProfile.defender\" -o json\nThe expected result should include\
    \ securityMonitoring.enabled set to true\nwhen the AKS built in Defender option is used.\nTo verify the subscription plan\
    \ more broadly, use:\naz security pricing show --name Containers -o json\nThe result should show the plan on Standard\
    \ when Defender for Containers is enabled\nand the registry vulnerability assessment extension as enabled.\n Page 97"
  remediation: 'Enable Microsoft Defender for Containers for the subscription, enable the registry

    vulnerability assessment capability used for container image scanning, and then verify

    that Defender for Cloud is producing vulnerability findings for the registries and AKS

    workloads in scope. If the control is intended to cover only registry image scanning, the

    subscription plan and Registry access settings are the key fixes. If it also includes AKS

    runtime protection, deploy the Defender sensor or AKS built in integration and confirm

    the cluster Defender profile is enabled.

    1. In the Defender for Cloud Environment settings, turn Containers from Free to

    Standard.

    2. Enable the registry image assessment capability by turning on the registry related

    extension, including ContainerRegistriesVulnerabilityAssessments

    and required Registry access for supported registries.

    3. For AKS cluster coverage, deploy the Defender sensor by using the AKS built in

    option or Helm, based on your deployment model. Install a Helm based sensor

    for AKS Automatic in the kube-system namespace.

    4. Recheck the cluster and confirm

    securityProfile.defender.securityMonitoring.enabled is true

    where AKS runtime monitoring is required and the AKS built in option is used.

    For a Helm based sensor, verify that the release is deployed in kube-system.

    5. Review Defender for Cloud recommendations, then rebuild, patch, or replace

    vulnerable images and revalidate until findings reflect the intended state.

    If an approved third party scanner is used, connect the applicable registries, enable

    scanning when images are pushed and periodic rescanning, send findings to the

    responsible teams, and prevent images that exceed approved vulnerability thresholds

    from being promoted.

    Verification commands:

    az security pricing show --name Containers -o json

    az aks show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query

    "securityProfile.defender" -o json'
  checks:
  - type: sql
    command: show --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query
    severity: medium
    info: 'Review whether Microsoft Defender for Containers or Defender CSPM is enabled for

      the subscription and whether registry image vulnerability assessment is enabled under

      that plan. For AKS, also verify the cluster Defender profile when cluster side monitoring

      is in scope, and confirm Defender for Cloud is generating vulnerability findings for

      relevant images. For an AKS Automatic cluster using a Helm'
- id: 5.1.2
  title: Minimize and scope access to Azure Container Registry (ACR)
  scoring: manual
  profile:
  - Level 1
  description: Limit ACR access for AKS Automatic and related users to only the permissions required for their function. AKS
    to ACR integration grants the cluster’s kubelet managed identity the AcrPull role so nodes can pull images without broader
    registry rights. For ABAC enabled registries, --attach-acr is not supported, and the Container Registry Repository Reader
    role must be assigned manually instead. Human users, CI/CD identities, and applications should be assigned only the minimum
    pull, push, or repository permissions they need through Azure RBAC and Azure ABAC conditions where enabled, and the ACR
    admin account should remain disabled unless there is a specific operational need for it.
  rationale: Restricting ACR access reduces the chance that a user or workload can push unapproved images, overwrite trusted
    tags, read images from repositories outside its scope, or rely on long lived shared credentials. Managed identities are
    preferred over service principals for AKS because Azure manages the credentials and rotation, which removes secret handling
    overhead and lowers credential exposure. ACR also supports repository level access with Azure ABAC, which helps enforce
    least privilege more precisely than broad registry assignments. Microsoft Entra Workload ID is enabled by default for
    AKS Automatic, but it does not replace the kubelet managed identity used by nodes to authenticate to ACR and pull images.
  impact: This control replaces broad ACR access with role based access, typically leaving AKS Automatic with pull access
    only through the kubelet managed identity and assigning push access separately where needed. It can require additional
    role management and may cause image pull failures if permissions are too restrictive, but it produces a cleaner least
    privilege model for AKS and ACR. Page 100
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-from-code
  page_start: 100
  audit_raw: "Review ACR access for AKS Automatic to confirm the registry uses least privilege,\nidentity based access. Verify\
    \ the ACR admin account is disabled, determine whether\nthe registry is using RBAC only or RBAC + ABAC, confirm the AKS\
    \ kubelet identity has\nonly image pull rights, and review other principals for unnecessary push, delete, or\nbroader\
    \ registry permissions.\n• Confirm that adminUserEnabled is false, since the local admin account\nprovides broad registry\
    \ access and is not the preferred authentication method for\nintegrated AKS and ACR use.\naz acr show --name ${ACR_NAME}\
    \ --resource-group ${RESOURCE_GROUP} --query\n\"adminUserEnabled\" -o tsv\n• Review roleAssignmentMode to determine whether\
    \ the registry uses rbac or\nrbac-abac, because ABAC enabled registries use repository authorization and\ndifferent expected\
    \ pull role assignments.\naz acr show --name ${ACR_NAME} --resource-group ${RESOURCE_GROUP} --query\n\"roleAssignmentMode\"\
    \ -o tsv\n• Identify the AKS Automatic kubelet managed identity before reviewing its ACR\nrole assignments.\naz aks show\
    \ --resource-group ${RESOURCE_GROUP} --name ${CLUSTER_NAME} --query\n\"identityProfile.kubeletidentity\" -o json\n• Verify\
    \ that the AKS kubelet managed identity has only the minimum pull role\nrequired: AcrPull for registries using RBAC only,\
    \ or Container Registry\nRepository Reader for ABAC enabled registries.\n• Review ACR role assignments for users, groups,\
    \ service principals, and\nmanaged identities, and identify any principals with unnecessary push, delete,\ncatalog, or\
    \ registry administration permissions.\n• For ABAC enabled registries, review repository conditions and scope restrictions\n\
    to confirm access is limited to the required repositories or repository paths.\n Page 101"
  remediation: 'Disable the ACR local admin account and use identity based, least privilege access for

    registry authentication and authorization. For AKS Automatic, use the kubelet managed

    identity for required image pull access, and assign only the minimum registry role

    required by the registry authorization model: AcrPull for registries using RBAC only or

    Container Registry Repository Reader for ABAC enabled registries.

    Do not use --attach-acr with an ABAC enabled registry. Assign Container Registry

    Repository Reader manually to the kubelet managed identity and add repository

    conditions where required.

    Human users should use Microsoft Entra identities, while pipelines and workloads

    should use managed identities or service principals with only the required registry roles

    and repository conditions, rather than shared local registry credentials.

    • Identify any scripts, pipelines, or workloads that still depend on the ACR admin

    username and password.

    • Assign the AKS kubelet identity only the required pull role.

    • Remove unnecessary push, delete, catalog, or admin permissions from other

    principals.

    • Disable the ACR local admin account.

    • Retest image pull and push operations after the change.

    • Recheck the registry and confirm adminUserEnabled returns false.

    Verify the current setting:

    az acr show --name ${ACR_NAME} --resource-group ${RESOURCE_GROUP} --query

    "adminUserEnabled" -o tsv

    Disable the ACR admin account:

    az acr update --name ${ACR_NAME} --resource-group ${RESOURCE_GROUP} --admin-enabled

    false

    Expected result after remediation: adminUserEnabled should return false.'
  checks:
  - type: manual_review
    info: 'Review ACR access for AKS Automatic to confirm the registry uses least privilege,

      identity based access. Verify the ACR admin account is disabled, determine whether

      the registry is using RBAC only or RBAC + ABAC, confirm the AKS kubelet identity has

      only image pull rights, and review other principals for unnecessary push, delete, or

      broader registry permissions.

      • Confirm that adminUserEnabled is false, since the local admin account

      provides broad registry access and is not the preferred authent'
    severity: medium
- id: 5.1.3
  title: Limit AKS access to pull images from Azure Container Registry (ACR)
  scoring: manual
  profile:
  - Level 1
  description: Configure AKS Automatic with pull only access to ACR so the cluster can pull the images it needs to run workloads
    without being able to modify registry content. This is implemented by granting the kubelet managed identity only the required
    pull permission, typically AcrPull for registries using RBAC only, or Container Registry Repository Reader for ABAC enabled
    registries, so cluster access is limited to image retrieval rather than push, delete, or registry administration actions.
  rationale: Restricting AKS Automatic to pull only registry access enforces least privilege and reduces the blast radius
    of a compromised node identity or misused cluster credential. Using managed identities instead of service principals allows
    Azure to manage credential issuance and rotation, which avoids stored secrets and reduces operational exposure. Limiting
    the kubelet identity to pull only access also prevents the cluster from modifying repository content, overwriting tags,
    or using broader registry permissions than required for normal image retrieval. Microsoft Entra Workload ID is enabled
    by default for AKS Automatic, but it does not replace the kubelet managed identity used by nodes to authenticate to ACR
    and pull images.
  impact: AKS Automatic is limited to pulling images from ACR and cannot push, delete, or modify registry content. Separate
    identities and roles are required for image publishing or registry administration, and an incorrect pull role assignment
    can cause image pull failures. Page 104
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-from-code
  page_start: 104
  audit_raw: "Review AKS Automatic access to ACR to confirm the cluster is limited to image pull\naccess and does not have\
    \ broader registry permissions. Identify the registry\nauthorization mode, confirm the kubelet managed identity is used\
    \ for ACR access, and\nverify that the cluster has only the minimum read role required for image pulls.\n• Determine whether\
    \ the registry uses RBAC Registry Permissions or RBAC\nRegistry + ABAC Repository Permissions, because this affects the\
    \ expected pull\nrole and access model.\nUse the following command to verify the registry authorization mode:\naz acr\
    \ show --name ${ACR_NAME} --resource-group ${RESOURCE_GROUP} --query\n\"roleAssignmentMode\" -o tsv\n• Verify that AKS\
    \ Automatic authenticates to ACR with the kubelet managed\nidentity rather than stored registry credentials or broad shared\
    \ access.\nUse the following command to identify the kubelet managed identity:\naz aks show --resource-group ${RESOURCE_GROUP}\
    \ --name ${CLUSTER_NAME} --query\n\"identityProfile.kubeletidentity\" -o json\n• Confirm that the kubelet identity has\
    \ only the required read role: AcrPull for\nregistries using RBAC only, or Container Registry Repository Reader for ABAC\n\
    enabled registries.\n• Review ACR role assignments for the kubelet identity and confirm no additional\npush, delete, or\
    \ registry administration permissions are assigned at the registry\nor repository level.\n Page 105"
  remediation: 'Restrict AKS Automatic access to ACR so the cluster can only pull images needed for

    workload startup and cannot push, delete, or administer registry content. Use the

    kubelet managed identity for registry authentication and assign only the minimum pull

    role required by the registry authorization mode: AcrPull for registries using RBAC

    only or Container Registry Repository Reader for ABAC enabled registries.

    Do not use --attach-acr with an ABAC enabled registry. Assign Container Registry

    Repository Reader manually to the kubelet managed identity.

    1. Configure AKS Automatic to use the kubelet managed identity for ACR access

    rather than shared registry credentials.

    2. Assign only the required pull role to the kubelet identity: AcrPull for registries

    using RBAC only, or Container Registry Repository Reader for ABAC enabled

    registries.

    3. Remove any additional ACR permissions granted to the kubelet identity,

    especially write, delete, or broader registry management roles.

    4. For ABAC enabled registries, limit Repository Reader access to only the required

    repositories or repository paths where possible.'
  checks:
  - type: manual_review
    info: 'Review AKS Automatic access to ACR to confirm the cluster is limited to image pull

      access and does not have broader registry permissions. Identify the registry

      authorization mode, confirm the kubelet managed identity is used for ACR access, and

      verify that the cluster has only the minimum read role required for image pulls.

      • Determine whether the registry uses RBAC Registry Permissions or RBAC

      Registry + ABAC Repository Permissions, because this affects the expected pull

      role and access model.

      '
    severity: medium
- id: 5.1.4
  title: Restrict AKS workloads to approved container registries only
  scoring: manual
  profile:
  - Level 2
  description: Configure AKS Automatic so workloads pull images only from registries that have been explicitly approved by
    the organization, such as selected ACR instances or other trusted registries. This is typically enforced with Azure Policy
    by auditing or denying deployments whose image references do not match approved image source patterns, while AKS to ACR
    integration provides the managed identity and pull role pattern needed for authorized image retrieval from those registries.
  rationale: Limiting AKS Automatic to approved registries reduces the chance that pods will run images from unknown, unvetted,
    or malicious sources. Microsoft recommends deploying only validated images, and the built in policy for allowed images
    is intended to reduce exposure to unknown vulnerabilities, security issues, and malicious images from untrusted registries.
    The policy evaluates the complete image reference against configured patterns, allowing approved registry and repository
    paths to be enforced consistently.
  impact: Enforcement may block deployments that reference nonapproved registries until those images are moved to, or mirrored
    into, an approved source. It also requires policy maintenance and valid pull permissions for each approved registry, but
    it strengthens image provenance and deployment consistency in AKS Automatic. A deny policy blocks new or updated noncompliant
    workloads but does not remove existing running pods, so existing image references must also be reviewed. Page 108
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
