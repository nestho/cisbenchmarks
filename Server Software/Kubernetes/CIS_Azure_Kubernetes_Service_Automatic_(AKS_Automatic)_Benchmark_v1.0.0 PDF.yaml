  - type: manual_review
    info: 'Review the AKS cluster to confirm AKS managed Microsoft Entra integration is enabled

      and Microsoft Entra ID authorization for the Kubernetes API is turned on as expected for

      AKS Automatic. Then verify that access for users, groups, and service principals is

      being granted through Azure role assignments for Kubernetes authorization rather than

      primarily through Kubernetes RoleBinding and ClusterRoleBinding objects for

      those Entra identities. As part of the review, confirm the cluster is using the '
    severity: medium
