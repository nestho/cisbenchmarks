controls:
- id: 4.1.1
  title: Ensure that the cluster-admin role is only used where required
  scoring: manual
  profile:
  - Level 1
  description: This control is valid for AKS Automatic clusters, not only AKS Standard clusters. Azure RBAC for Kubernetes
    authorization is preconfigured in AKS Automatic, and cluster creation through the Azure CLI automatically assigns the
    creator the Azure Kubernetes Service RBAC Cluster Admin role. Kubernetes RBAC remains relevant for service accounts and
    any Kubernetes RBAC bindings created in the cluster, so both authorization paths must be reviewed. Verify that cluster-admin
    access in AKS Automatic is granted only to identities with a documented need for full cluster administration. The review
    should cover Kubernetes RBAC privilege paths, such as ClusterRoleBinding assignments to the clusteradmin ClusterRole,
    and Azure RBAC for Kubernetes authorization assignments, such as Azure Kubernetes Service RBAC Cluster Admin. Where administrative
    needs are limited to a namespace, application, or team, lower privilege roles and namespace bindings should be used instead
    of full cluster administrative access. Page 17
  rationale: This control supports least privilege in the highest risk portion of the AKS authorization model. AKS provides
    built in Reader, Writer, Admin, and Cluster Admin roles so permissions can be limited to operational need rather than
    defaulting to full cluster authority. Kubernetes guidance reinforces the same principle by recommending minimal RBAC permissions
    for users and service accounts and favoring namespace permissions where possible. Azure RBAC for Kubernetes authorization
    is preconfigured in AKS Automatic, and the Azure CLI assigns the cluster creator the Azure Kubernetes Service RBAC Cluster
    Admin role. This initial assignment and any assignments inherited from a resource group, subscription, or management group
    should be reviewed regularly because they can grant full authority over multiple current and future clusters. Excessive
    RBAC privileges can create direct or indirect escalation paths. The Azure Kubernetes Service RBAC Writer role can access
    Secrets and run Pods as any service account in a namespace, allowing the assignee to obtain that service account’s API
    permissions. Because AKS Automatic uses Azure RBAC for Kubernetes authorization for Microsoft Entra identities while service
    accounts are authorized through Kubernetes RBAC, controlling cluster-admin use is necessary to keep privileged access
    exceptional, auditable, and limited. Kubernetes RBAC permissions are additive and do not include deny rules, so a restrictive
    binding does not offset a separate clusteradmin grant.
  impact: If cluster-admin is assigned too broadly in AKS Automatic, a compromised user, group, service principal, or service
    account can move from limited operational access to effective control over the entire cluster. This can allow unauthorized
    changes to RBAC policy, workloads, Secrets, admission controls, and other cluster resources across namespaces, increasing
    the likelihood that a single credential exposure, misconfiguration, or automation error becomes a security or availability
    incident affecting the cluster. AKS Automatic deployment safeguards and baseline Pod Security Standards continue to enforce
    configured policies, but they do not replace least privilege or eliminate the effect of unauthorized actions that remain
    permitted. Removing broad administrator access without first assigning the required replacement permissions can interrupt
    administrative commands, deployment automation, controllers, or support procedures. New Azure role assignments can take
    up to five minutes to propagate. Page 18
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-managednetwork
  page_start: 17
  audit_raw: "This audit statement identifies the principals that are granted the Kubernetes clusteradmin role by reviewing\
    \ ClusterRoleBinding assignments in the AKS cluster. It\nfilters the binding output to show each binding name and the\
    \ associated user, group, or\nservice account, allowing the reviewer to determine which identities have unrestricted\n\
    cluster administrative access.\nkubectl get clusterrolebindings -o json | jq -r '\n  ([\"BINDING\",\"KIND\",\"NAMESPACE\"\
    ,\"NAME\"] | join(\" | \")),\n  (\n    .items[]\n    | select(.roleRef.name==\"cluster-admin\")\n    | .metadata.name\
    \ as $binding\n    | (.subjects // [])[]\n    | [$binding, .kind, (.namespace // \"-\"), .name]\n    | join(\" | \")\n\
    \  )\n'\nExample output with headers and piped separation of values. Review each principal\nlisted and ensure that cluster-admin\
    \ privilege is required for it.\nBINDING | KIND | NAMESPACE | NAME\naks-cluster-admin-binding | User | - | clusterAdmin\n\
    aks-cluster-admin-binding | User | - | clusterUser\ncluster-admin | Group | - | system:masters\ncustom-cluster-admin |\
    \ ServiceAccount | kube-system | admin-sa"
  remediation: "Review all ClusterRoleBinding objects that grant access to the Kubernetes\ncluster-admin role and identify\
    \ the users, groups, or service accounts associated\nwith each binding. Validate whether each principal still requires\
    \ full cluster\nadministrative access or whether its responsibilities can be met through a lower\nprivileged role, preferably\
    \ a namespace Role/RoleBinding or a more limited\nClusterRole, in accordance with AKS and Kubernetes least privilege guidance.\n\
    Where full administrative access is not required, first assign the principal to an approved\nlower privilege role and\
    \ confirm that required operational tasks continue to function as\nexpected. After the replacement access has been validated,\
    \ remove the unnecessary\ncluster-admin binding to reduce the risk of privilege escalation and cluster misuse.\nkubectl\
    \ delete clusterrolebinding [name]\n Page 19"
  checks:
  - type: sql
    command: show each binding name and the associated user, group, or
    severity: medium
    info: 'This audit statement identifies the principals that are granted the Kubernetes clusteradmin role by reviewing ClusterRoleBinding
      assignments in the AKS cluster. It

      filters the binding output to show each binding name and the associated user, group, or

      service account, allowing the reviewer to determine which identities have unrestricted

      cluster administrative access.

      kubectl get clusterrolebinding'
- id: 4.1.2
  title: Ensure access to Secrets is minimized and granted only where required
  scoring: manual
  profile:
  - Level 1
  description: Verify that access to Kubernetes Secret objects in AKS is granted only to identities with a defined purpose.
    The review should include Azure role assignments used by Microsoft Entra ID authorization for the Kubernetes API, Kubernetes
    RBAC roles and bindings, and service account permissions, with particular attention to permissions that allow get, list,
    or watch access to secrets, because those permissions expose sensitive namespace data. In AKS, access should be limited
    to the minimum scope and privilege necessary for the workload or administrator function being performed. The Kubernetes
    API stores secrets, which may be service account tokens for the Kubernetes API or credentials used by workloads in the
    cluster. Access to these secrets should be restricted to the smallest possible group of users to reduce the risk of privilege
    escalation.
  rationale: This requirement is necessary because unnecessary access to Secrets in AKS increases the risk of credential exposure
    and privilege escalation. Microsoft’s AKS guidance notes that access to secret contents can expose service account credentials,
    and that combining secret access with the ability to run pods as service accounts can enable a principal to gain that
    service account’s API access level. Kubernetes also treats get, list, and watch access to Secret objects as sensitive
    because the API responses can include Secret data rather than metadata alone. Minimizing secret access in AKS therefore
    helps reduce the likelihood that a user, workload, or service account can expose sensitive data or expand its effective
    privileges beyond what is required.
  impact: If access to Secrets is granted too broadly in AKS, a compromised user, group, service principal, managed identity,
    or service account can retrieve sensitive application data, credentials, certificates, or tokens from one or more namespaces.
    That access can then be used to impersonate workloads, obtain additional API access, or expose confidential configuration
    information, increasing the risk of lateral movement and a broader cluster security incident. Page 21
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. hhttps://learn.microsoft.com/en-us/azure/aks/automatic/quick-automaticmanaged-network
  page_start: 21
  audit_raw: 'Review the users, groups, and service accounts that have get, list, or watch access

    to Secret objects in the Kubernetes API. Identify these permissions in Kubernetes Role

    and ClusterRole rules, then trace the associated RoleBinding and

    ClusterRoleBinding objects to the affected identities.

    Because Microsoft Entra ID authorization for the Kubernetes API is preconfigured in

    AKS Automatic, also review Azure role assignments to users, groups, service principals,

    and managed identities that allow access to Secrets. This includes Azure Kubernetes

    Service RBAC Writer, Admin, Cluster Admin, and applicable custom roles. Confirm that

    each assignment is required and limited to the necessary namespace or cluster

    resources.'
  remediation: "Where access is not required, remove get, list, and watch access to Secret objects\nin the cluster. For Kubernetes\
    \ RBAC, remove the unnecessary verbs from the\napplicable Role or ClusterRole, or remove the binding that grants the role\
    \ to the\nidentity. For Microsoft Entra ID authorization, replace broad assignments with a role that\ndoes not permit\
    \ Secret access, such as Azure Kubernetes Service RBAC Reader when\nread access to other resources is sufficient.\nConfirm\
    \ that workloads, controllers, and administrative processes continue to function\nwith the replacement permissions before\
    \ removing the existing access.\n Page 22"
  checks:
  - type: manual_review
    info: 'Review the users, groups, and service accounts that have get, list, or watch access

      to Secret objects in the Kubernetes API. Identify these permissions in Kubernetes Role

      and ClusterRole rules, then trace the associated RoleBinding and

      ClusterRoleBinding objects to the affected identities.

      Because Microsoft Entra ID authorization for the Kubernetes API is preconfigured in

      AKS Automatic, also review Azure role assignments to users, groups, service principals,

      and managed identities that allow acc'
    severity: medium
- id: 4.1.3
  title: Minimize wildcard use in Roles and ClusterRoles
  scoring: manual
  profile:
  - Level 1
  description: Verify that Kubernetes Role and ClusterRole definitions in AKS do not use wildcard entries such as * for verbs,
    resources, or apiGroups unless a documented administrative need exists. This is particularly relevant for service accounts
    because their authorization continues to rely on Kubernetes RBAC.
  rationale: This recommendation is necessary because wildcard permissions make RBAC scope harder to predict and harder to
    constrain. Kubernetes guidance explicitly recommends avoiding wildcard permissions where possible, especially across all
    resources, because Kubernetes is extensible and wildcard access applies not only to resource types that exist today but
    also to resource types introduced later. Since RBAC permissions are purely additive, a wildcard can silently expand what
    a bound principal is allowed to do without any corresponding narrowing control in the role itself. The risk remains material
    in AKS Automatic because Microsoft Entra ID authorization for the Kubernetes API is preconfigured while Kubernetes RBAC
    remains responsible for permissions granted to service accounts through Role, ClusterRole, and binding objects. As a result,
    wildcard rules in Role and ClusterRole objects can still grant excessive permissions to workloads and controllers that
    run under service accounts, even in clusters where human user access is otherwise managed through Microsoft Entra ID authorization.
  impact: If wildcard permissions are used broadly in AKS, a user or service account can receive access beyond the intended
    set of API resources or actions, including newly introduced resources such as CRDs or additional subresources covered
    by the wildcard rule. When those roles are bound throughout the cluster or attached to workload service accounts, a compromised
    pod, controller, or user session can perform actions outside its expected boundary, increasing the risk of unauthorized
    changes, privilege escalation, and wider cluster impact. Page 24
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-managednetwork
  page_start: 24
  audit_raw: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

    use in verbs, resources, or apiGroups, and identify any RoleBinding or

    ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

    Retrieve the roles defined across all namespaces in the cluster and review for

    wildcards.

    kubectl get roles --all-namespaces -o yaml

    Retrieve the cluster roles defined in the cluster and review for wildcards

    kubectl get clusterroles -o yaml'
  remediation: 'Replace wildcard entries in Role and ClusterRole objects with only the specific

    verbs, resources, and apiGroups required for the workload or administrator function.

    Prefer Role and RoleBinding objects within the required namespace instead of

    permissions throughout the cluster wherever possible.

    This is particularly important for service accounts and controllers because wildcard

    Kubernetes RBAC rules can still grant excessive permissions to workloads even when

    human user access is managed through Microsoft Entra ID authorization for the

    Kubernetes API.'
  checks:
  - type: manual_review
    info: 'Review Kubernetes Role and ClusterRole definitions in the AKS cluster for wildcard

      use in verbs, resources, or apiGroups, and identify any RoleBinding or

      ClusterRoleBinding that assigns those roles to users, groups, or service accounts.

      Retrieve the roles defined across all namespaces in the cluster and review for

      wildcards.

      kubectl get roles --all-namespaces -o yaml

      Retrieve the cluster roles defined in the cluster and review for wildcards

      kubectl get clusterroles -o yaml'
    severity: medium
- id: 4.1.4
  title: Minimize access to create pods
  scoring: manual
  profile:
  - Level 1
  description: The ability to create pods in a namespace can provide opportunities for privilege escalation, such as assigning
    privileged service accounts to these pods or mounting hostPath volumes with access to sensitive data. Pod Security Policies
    are no longer supported. AKS Automatic includes Deployment Safeguards and baseline Pod Security Standards in enforce mode
    to restrict risky pod configurations, but these controls do not replace least privilege for pod creation. This verifies
    that permission to create or run pods in AKS Automatic is granted only to identities with a documented operational need.
    The review should include RBAC assignments to users, groups, and service accounts that allow pod creation or the ability
    to run pods under service accounts, because AKS treats pod execution as a security relevant action rather than a routine
    read or write permission.
  rationale: This requirement is necessary because pod creation in AKS Automatic can translate into API access through service
    accounts. Pods can receive a projected service account token and use it to authenticate to the API server as the selected
    service account. The Azure Kubernetes Service RBAC Writer role allows a principal to run Pods as any service account in
    a namespace, which can provide that service account’s API access level. A principal that can create a Pod controls fields
    such as serviceAccountName, container images, volumes, and security context. AKS Automatic Deployment Safeguards and enforced
    Pod Security Standards can restrict some pod specifications, but they do not replace RBAC restrictions on who can create
    Pods.
  impact: If pod creation is granted too broadly in AKS Automatic, a compromised or misused identity can create Pods that
    use available service accounts, exercise the Kubernetes API permissions granted to those accounts, and reach resources
    or API actions beyond its intended role. This increases the risk of privilege escalation, sensitive data exposure, and
    wider namespace or cluster impact from a single account or workload with excessive permissions. Page 27
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-security
  page_start: 27
  audit_raw: 'Review Azure role assignments used by Microsoft Entra ID authorization for the

    Kubernetes API and Kubernetes RBAC permissions granted to service accounts.

    Identify the users, groups, and service accounts that can create Pods. Confirm that

    each assignment is required for the principal’s function, with particular attention to

    service accounts and namespace write access. Flag unnecessary pod creation rights

    for remediation.'
  remediation: 'The following steps help reduce pod creation access to the minimum required in AKS

    Automatic:

    • Identify all Azure role assignments used by Microsoft Entra ID authorization for

    the Kubernetes API and Kubernetes RBAC bindings that allow pod creation,

    including access within a namespace and access throughout the cluster.

    • Remove pod creation rights from any user, group, or service account that does

    not have a documented operational need.

    • Replace broad permissions with a role that has only the required permissions,

    preferably limited to the required namespace rather than throughout the cluster.

    • Ensure workloads use dedicated service accounts with only the permissions

    required for the application or controller.

    • Revalidate access after changes to confirm required workloads still run and

    unnecessary pod creation rights have been removed.'
  checks:
  - type: manual_review
    info: 'Review Azure role assignments used by Microsoft Entra ID authorization for the

      Kubernetes API and Kubernetes RBAC permissions granted to service accounts.

      Identify the users, groups, and service accounts that can create Pods. Confirm that

      each assignment is required for the principal’s function, with particular attention to

      service accounts and namespace write access. Flag unnecessary pod creation rights

      for remediation.'
    severity: medium
- id: 4.1.5
  title: Ensure that default service accounts are not actively used
  scoring: scored
  profile:
  - Level 1
  description: Ensure that default service accounts are not actively used by verifying that application and automation pods
    in AKS Automatic do not rely on the namespace default service account when a dedicated service account should be used
    instead. Confirm that workloads explicitly specify the intended serviceAccountName, the default service account is not
    bound to unnecessary Kubernetes RBAC permissions, and it is not being used as the identity boundary for workloads that
    need distinct API permissions or Microsoft Entra Workload ID behavior.
  rationale: This is recommended because AKS service accounts are operational identities, not just deployment defaults. Unless
    token mounting is disabled, Kubernetes can project a short lived service account token into a Pod for authentication to
    the Kubernetes API server. Azure RBAC for Kubernetes authorization is preconfigured in AKS Automatic, but Kubernetes service
    accounts continue to rely on Kubernetes RBAC. Using the default service account therefore makes it harder to apply least
    privilege cleanly because multiple workloads can share the same Kubernetes identity and API authorization path within
    a namespace. Service account token handling is also security relevant. Microsoft publishes an AKS Azure Policy definition
    that sets automountServiceAccountToken to false because avoiding automatic token mounting increases security. AKS Automatic
    preconfigures Workload ID and the OIDC issuer, but each workload still requires an explicit pod label, service account
    configuration, and federated identity mapping to exchange a projected service account token for a Microsoft Entra access
    token. This supports using dedicated service accounts instead of relying on the default account for ordinary workloads.
    Page 30
  impact: If the default service account is actively used in AKS Automatic, multiple workloads in the same namespace can inherit
    the same Kubernetes identity and any RBAC permissions associated with it, which increases the blast radius of a pod compromise
    or workload misconfiguration. It also weakens separation of duties, makes workload specific permissions harder to assign,
    and reduces audit clarity because API access is attributed to a shared namespace service account rather than a dedicated
    workload identity. For workloads using Microsoft Entra Workload ID, sharing a service account can also complicate token
    projection and the mapping between the workload and identity.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-security
  page_start: 30
  audit_raw: 'Review customer managed pods in all AKS Automatic namespaces to identify

    workloads that do not explicitly set serviceAccountName or set it to default and

    therefore use the namespace default service account. Then review RoleBinding and

    ClusterRoleBinding assignments for each default service account to confirm it is

    not granted unnecessary permissions.

    Review the automountServiceAccountToken setting on both the Pod and its

    associated ServiceAccount, and treat the Pod setting as authoritative where both are

    defined. Flag use of the default service account or token mounting without a

    documented need for remediation.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml'
  remediation: "Apply the following steps to replace default service account usage with dedicated\nworkload identities in\
    \ AKS Automatic:\n• Update workloads to explicitly set a dedicated serviceAccountName instead of\ninheriting the namespace\
    \ default service account.\n• Remove unnecessary RoleBinding and ClusterRoleBinding assignments\nfrom the default service\
    \ account, and keep any remaining access minimal and\nlimited to the required namespace.\n• Set automountServiceAccountToken\
    \ to false where Kubernetes API\naccess is not required to prevent automatic token mounting.\n• Review both the ServiceAccount\
    \ and Pod settings for\nautomountServiceAccountToken, and treat the Pod value as authoritative\nwhen both are defined.\n\
    • For workloads that need Azure resource access, use Microsoft Entra Workload\nID with a dedicated service account and\
    \ explicit workload configuration instead of\nthe namespace default service account.\n Page 31"
  checks:
  - type: manual_review
    info: 'Review customer managed pods in all AKS Automatic namespaces to identify

      workloads that do not explicitly set serviceAccountName or set it to default and

      therefore use the namespace default service account. Then review RoleBinding and

      ClusterRoleBinding assignments for each default service account to confirm it is

      not granted unnecessary permissions.

      Review the automountServiceAccountToken setting on both the Pod and its

      associated ServiceAccount, and treat the Pod setting as authoritative where'
    severity: medium
- id: 4.1.6
  title: Ensure that Service Account Tokens are only mounted where necessary
  scoring: scored
  profile:
  - Level 1
  description: Verify that service account tokens in AKS Automatic are mounted only for pods that require Kubernetes API access
    or an explicitly configured workload identity flow. Confirm that pods and service accounts are not broadly relying on
    default token mounting, and that token projection is limited to workloads with a defined operational need. Azure Policy
    includes an AKS definition that can set automountServiceAccountToken to false, while Workload ID requires explicit pod
    labeling and service account configuration for token projection.
  rationale: 'Limiting service account token mounts is important because a mounted token is an authentication credential.
    Unless mounting is disabled, Kubernetes can project a short lived token into a Pod that authenticates to the Kubernetes
    API server as the associated service account. Setting automountServiceAccountToken to false increases security by avoiding
    automatic token mounting where API access is not required. Microsoft Entra Workload ID makes its projected service account
    token explicit rather than automatic. Pods must be labeled azure.workload.identity/use: "true" for the workload identity
    webhook to inject the projected token volume and Azure specific environment variables. This supports treating token mounting
    as an intentional workload requirement rather than default behavior.'
  impact: When service account tokens are mounted more broadly than necessary in AKS Automatic, more pods than required receive
    credentials that can authenticate to the Kubernetes API with the permissions granted to the associated service account.
    This increases the number of workloads from which API access could be exercised if a pod is compromised or misconfigured,
    and it weakens workload separation by exposing credentials to pods that do not need them. Projected tokens are short lived,
    but a compromised pod can use a mounted token while it remains valid. Page 33
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-security
  page_start: 33
  audit_raw: 'Review customer managed pods and service accounts in each AKS Automatic

    namespace to confirm service account tokens are mounted only where Kubernetes API

    access or workload identity is required. Check automountServiceAccountToken at

    both the Pod and ServiceAccount level, and flag workloads that receive tokens without

    a documented need. The Pod value takes precedence when both resources define the

    setting. If neither resource sets it to false, Kubernetes mounts the service account

    token by default.

    For pods using Microsoft Entra Workload ID, confirm that the required pod label, service

    account configuration, and token projection are intentional.

    kubectl get serviceaccount $SERVICE_ACCOUNT -n $NAMESPACE -o yaml

    kubectl get pod $POD_NAME -n $NAMESPACE -o yaml'
  remediation: 'Apply the following steps to reduce unnecessary service account token mounting in

    AKS Automatic:

    • Set automountServiceAccountToken to false for pods and service

    accounts that do not require Kubernetes API access.

    • Update workloads to use a dedicated serviceAccountName only where a

    service account token is operationally required, instead of inheriting token

    behavior from the namespace default service account.

    • For workloads that need Azure resource access, use the preconfigured Microsoft

    Entra Workload ID with a dedicated service account, the required pod label, and

    explicit workload configuration rather than broad default token mounting.

    • Revalidate workloads after the change to confirm that only pods with a

    documented need continue to receive service account tokens.'
  checks:
  - type: manual_review
    info: 'Review customer managed pods and service accounts in each AKS Automatic

      namespace to confirm service account tokens are mounted only where Kubernetes API

      access or workload identity is required. Check automountServiceAccountToken at

      both the Pod and ServiceAccount level, and flag workloads that receive tokens without

      a documented need. The Pod value takes precedence when both resources define the

      setting. If neither resource sets it to false, Kubernetes mounts the service account

      token by defaul'
    severity: medium
- id: 4.1.7
  title: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster
  scoring: manual
  profile:
  - Level 1
  description: Roles and ClusterRoles that grant bind, impersonate, or escalate should be assigned only when strictly required.
    These permissions can bypass normal RBAC safeguards and allow a principal to acquire or grant authority beyond its current
    permissions. Review AKS Automatic authorization assignments to ensure bind, escalate, and impersonate permissions are
    granted only to identities with a documented administrative need. This review should cover Kubernetes Role and ClusterRole
    design, RoleBinding and ClusterRoleBinding assignments, and any Azure custom roles used by Microsoft Entra ID authorization
    for the Kubernetes API that contain corresponding bind, escalate, or impersonate DataActions.
  rationale: These permissions are high risk because they affect the authorization model itself, not just routine resource
    access. Azure defines AKS DataActions for binding Roles and ClusterRoles, escalating Roles and ClusterRoles, and impersonating
    users, groups, service accounts, and user extras. These capabilities should remain limited to approved administrative
    identities. The impersonate privilege allows a subject to submit API requests as another user, group, or service account
    and exercise that identity’s effective permissions for those requests. The bind privilege allows the subject to create
    or update a binding to a specific Role or ClusterRole without already holding every permission contained in that role.
    The escalate privilege allows a subject to create or update a Role or ClusterRole containing permissions the subject does
    not already hold. Each permission can lead to cluster-admin or equivalent authority when it is exercised against a highly
    privileged identity or role.
  impact: If bind, escalate, or impersonate permissions are granted too broadly in AKS Automatic, a user or service account
    can obtain or assign authority beyond its intended role and act through a different security principal. This can weaken
    namespace boundaries, reduce separation of duties, and increase the blast radius of a compromised identity or workload
    by turning a limited access path into broader administrative control. Page 36
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-managednetwork
  page_start: 36
  audit_raw: "Review AKS Automatic RBAC to identify any users, groups, or service accounts granted\nbind, escalate, or impersonate\
    \ permissions through Kubernetes RBAC or\nMicrosoft Entra ID authorization for the Kubernetes API.\n• Identify Roles and\
    \ ClusterRoles that include bind, escalate, or\nimpersonate, then trace the RoleBindings and ClusterRoleBindings\nthat\
    \ assign them.\n• Determine which users, groups, or service accounts receive those permissions.\n• Validate that each\
    \ assignment is required for a defined administrative function.\n• Flag any assignment that applies throughout the cluster\
    \ or grants these\npermissions to a service account without a documented need.\nUse the following commands to identify\
    \ Kubernetes RBAC roles in the AKS Automatic\ncluster that include bind, escalate, or impersonate. The first command reviews\
    \ all\nnamespace Role objects for these permissions. The second command reviews custom\nClusterRole objects and excludes\
    \ default Kubernetes roles, helping focus the audit on\nnon-default RBAC definitions that may introduce elevated privilege\
    \ paths.\nkubectl get roles -A -o yaml | grep -nE 'bind|escalate|impersonate'\nkubectl get clusterroles -o json | jq -r\
    \ '\n  .items[]\n  | select(.metadata.labels[\"kubernetes.io/bootstrapping\"] != \"rbac-defaults\")\n  | select(any(.rules[]?;\
    \ any(.verbs[]?; .==\"bind\" or .==\"escalate\"\nor .==\"impersonate\")))\n  | .metadata.name\n'"
  remediation: "Remove bind, escalate, and impersonate permissions from any custom Role,\nClusterRole, or Azure custom role\
    \ that does not require them for an approved\nadministrative function. Where these permissions are required, keep them\
    \ limited to the\nrequired resources and namespace and avoid assigning them to workload service\naccounts.\n• Update each\
    \ affected custom Role to remove unnecessary bind, escalate, or\nimpersonate rules.\n• Update each affected custom ClusterRole\
    \ to retain only the specific elevated\npermission that is explicitly required.\n• Remove unnecessary corresponding DataActions\
    \ from Azure custom roles used\nto authorize access to the Kubernetes API.\n• Replace broad assignments with roles that\
    \ have fewer permissions, and limit\naccess to the required namespace rather than the entire cluster where possible.\n\
    \ Page 37\n• Do not assign these permissions to workload service accounts unless there is a\ndocumented and approved need.\n\
    • Revalidate access after the change to confirm that only approved administrative\nidentities retain these permissions."
  checks:
  - type: command
    command: kubectl get roles -A -o yaml | grep -nE 'bind|escalate|impersonate'
    expected: ''
    severity: medium
    info: 'Review AKS Automatic RBAC to identify any users, groups, or service accounts granted

      bind, escalate, or impersonate permissions through Kubernetes RBAC or

      Microsoft Entra ID authorization for the Kubernetes API.

      • Identify Roles and ClusterRoles that include bind, escalate, or

      impersonate, then trace the RoleBindings and ClusterRoleBindings

      that assign them.

      • Determine which users, groups, or ser'
- id: 4.1.8
  title: Minimize access to create persistent storage
  scoring: manual
  profile:
  - Level 1
  description: Permission to create persistent storage in AKS Automatic is granted only where it is required. This includes
    direct creation of PersistentVolume objects and, more commonly, creation of PersistentVolumeClaim objects that reference
    an existing StorageClass and cause a CSI driver to provision an Azure Disk, Azure Files share, or other supported storage
    resource. Creating a StorageClass is a separate administrative action that defines provisioning options. AKS Automatic
    preconfigures Microsoft Entra ID authorization for Kubernetes API access and manages the CSI drivers and default StorageClass
    objects. Kubernetes service accounts continue to rely on Kubernetes RBAC.
  rationale: Minimizing this access is important because persistent volumes are durable resources that can outlive individual
    pods, and dynamic provisioning can automatically create backing Azure storage when a claim is submitted. Because AKS Automatic
    provides managed CSI drivers and default StorageClass objects, an authorized PersistentVolumeClaim can provision storage
    without an administrator first creating a storage class. A PV can exist beyond the lifetime of a pod, while dynamic provisioning
    uses a storage class to determine what resource to create. The Azure Disk and Azure Files CSI drivers manage the lifecycle
    of those Azure storage resources. The reclaim policy determines whether backing storage is deleted or retained after the
    claim is released, so storage creation permissions can also affect data retention. These permissions can allocate durable
    storage, influence performance tier and storage type, and establish new data persistence paths inside the cluster.
  impact: If access to create persistent storage is granted too broadly in AKS Automatic, a user or service account can provision
    durable storage resources that remain beyond pod termination and consume Azure storage capacity without a justified need.
    Dynamic provisioning can result in automatic creation of Azure disks or file shares, expansion of a workload’s data footprint,
    and additional opportunities for unintended data retention, data exposure, or cost growth. A Retain reclaim policy can
    preserve the backing storage and its data after a claim is deleted, requiring separate administrative cleanup. Where these
    permissions are held by service accounts, a compromised workload can use them to establish new persistent storage for
    data staging, log retention, or other unauthorized cluster activity. Page 39
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization
  page_start: 39
  audit_raw: 'Review AKS Automatic authorization to identify any users, groups, or service accounts

    that can create PersistentVolume, PersistentVolumeClaim, or StorageClass

    resources. Review the applicable Kubernetes Role, ClusterRole, RoleBinding,

    and ClusterRoleBinding objects.

    Microsoft Entra ID authorization for the Kubernetes API is preconfigured in AKS

    Automatic, so also review direct and inherited Azure role assignments and custom roles

    that grant these permissions. Treat PersistentVolumeClaim creation as a storage

    provisioning path because a claim can trigger dynamic provisioning through an existing

    StorageClass. Review PersistentVolume and StorageClass creation

    separately because they are cluster administrative permissions.'
  remediation: 'Remove persistent storage creation rights from any user, group, or service account that

    does not require them. Replace unnecessary Azure role assignments or Kubernetes

    RBAC bindings with roles that provide only the required permissions. Limit direct

    PersistentVolume and StorageClass administration to approved administrators,

    and allow workloads to create PersistentVolumeClaim objects only in the required

    namespace.

    Kubernetes RBAC does not restrict which existing StorageClass a principal can

    name in a claim. If workloads must be limited to approved storage classes, enforce that

    requirement through an admission policy, such as Azure Policy for Kubernetes, which is

    enabled on AKS Automatic. After making changes, verify that required applications can

    still provision storage through the intended AKS CSI driver path.'
  checks:
  - type: manual_review
    info: 'Review AKS Automatic authorization to identify any users, groups, or service accounts

      that can create PersistentVolume, PersistentVolumeClaim, or StorageClass

      resources. Review the applicable Kubernetes Role, ClusterRole, RoleBinding,

      and ClusterRoleBinding objects.

      Microsoft Entra ID authorization for the Kubernetes API is preconfigured in AKS

      Automatic, so also review direct and inherited Azure role assignments and custom roles

      that grant these permissions. Treat PersistentVolumeClaim creation'
    severity: medium
- id: 4.1.9
  title: Minimize access to the nodes/proxy subresource
  scoring: manual
  profile:
  - Level 1
  description: Review AKS authorization to ensure access to the nodes/proxy subresource is granted only to identities with
    a documented operational need. Review Kubernetes ClusterRole and ClusterRoleBinding objects, service accounts that receive
    this access, and applicable Azure role assignments because Azure RBAC for Kubernetes authorization is preconfigured in
    AKS Automatic. Managed system node pool safeguards also restrict grants to sensitive node proxy permissions. A namespace
    Role or RoleBinding cannot grant effective access to nodes/proxy because Node objects are cluster resources.
  rationale: Limiting nodes/proxy access is important because the Kubernetes API server proxies an authorized request to the
    kubelet API. Microsoft has documented that GET access to nodes/proxy can be used over WebSockets to execute commands in
    pods on a reachable node because the kubelet authorizes the initial GET request without a second authorization check for
    the CREATE verb normally associated with /exec, /run, /attach, and /portforward. The API server can record the initial
    proxy request, but it does not provide a separate Kubernetes API audit event for each operation performed through the
    proxied kubelet connection. Admission controls also do not reevaluate each kubelet operation. Current AKS releases use
    narrower node permissions for the managed Container Insights component, but customer managed nodes/proxy access must still
    be restricted. AKS Automatic further protects its managed system node pools through admission controls that prevent grants
    to sensitive node proxy permissions for unapproved identities. Page 42
  impact: If nodes/proxy access is granted too broadly in AKS Automatic, a user or service account can reach kubelet API functions
    beyond its intended responsibilities. This can include command execution in pods on a reachable node through /exec, /run,
    /attach, or /portforward. A compromised identity could access workload data, alter running processes, disrupt applications,
    or move beyond its intended namespace. Because only the initial proxy request is visible to Kubernetes API auditing, an
    investigation might not have a separate audit event for every action performed through the connection. AKS Automatic safeguards
    reduce exposure to managed system nodes, but they do not replace review of privileged Azure assignments, Kubernetes RBAC,
    or access affecting customer workloads. Page 43
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/automatic/aks-automatic-managedsystem-node-pools-about
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-security
  page_start: 42
  audit_raw: "Review custom Kubernetes ClusterRole and ClusterRoleBinding objects\nthat grant access to the nodes/proxysubresource.\
    \ Include rules\nthat grant nodes/proxy directly or through resource wildcards\nsuch asnodes/or`. Confirm that each assignment\
    \ is required for an approved\ntroubleshooting, maintenance, or platform administration function.\nAlso review direct\
    \ and inherited Azure role assignments and custom roles that permit\nthis resource or all Kubernetes resources because\
    \ Azure RBAC for Kubernetes\nauthorization is preconfigured in AKS Automatic.\nThe following command returns the name,\
    \ resource type, and allowed verbs for custom\nClusterRole objects that grant this access. It excludes default bootstrapped\
    \ roles and\nnames beginning with system:. Review the ClusterRoleBinding objects that\nreference each returned role to\
    \ identify the users, groups, or service accounts that\nreceive it.\nkubectl get clusterroles -o json | jq -r '\n  .items[]\n\
    \  | select(.metadata.labels[\"kubernetes.io/bootstrapping\"] != \"rbac-defaults\")\n  | select(.metadata.name | startswith(\"\
    system:\") | not)\n  | select(any(.rules[]?; any(.resources[]?; .==\"nodes/proxy\" or .==\"nodes/*\"\nor .==\"*\")))\n\
    \  | [\n      \"ClusterRole\",\n      \"-\",\n      .metadata.name,\n      \"verbs=\" + (\n        [.rules[]?\n      \
    \   | select(any(.resources[]?; .==\"nodes/proxy\" or .==\"nodes/*\" or .==\"*\"))\n         | .verbs[]?\n        ] |\
    \ unique | join(\",\")\n      )\n    ]\n  | @tsv\n'\nExample output:\nClusterRole     -       aks-service\nverbs=create,delete,get,list,patch,update,watch\n\
    \ Page 44"
  remediation: 'Reduce custom RBAC access to the nodes/proxy API path so it is limited to

    approved administrative identities that require kubelet access.

    • Remove nodes/proxy, nodes/*, or applicable wildcard rules from any custom

    ClusterRole that does not require kubelet proxy access.

    • Where node data is still required, use the narrower node subresource and verbs

    supported by the current AKS release instead of nodes/proxy.

    • Remove any ClusterRoleBinding that grants this access to a workload

    service account, CI/CD identity, or operator group without an approved

    requirement.

    • Remove equivalent Azure role assignments or custom role permissions that are

    not required. Azure RBAC for Kubernetes authorization is preconfigured in AKS

    Automatic.

    • Keep the cluster on a supported AKS release so managed components use

    current node permissions, and do not modify AKS managed RBAC objects or

    managed system node pool safeguards.

    • Document the purpose and owner of each approved exception, then verify that

    required support tasks still work and no unnecessary assignment retains

    nodes/proxy access.'
  checks:
  - type: manual_review
    info: 'Review custom Kubernetes ClusterRole and ClusterRoleBinding objects

      that grant access to the nodes/proxysubresource. Include rules

      that grant nodes/proxy directly or through resource wildcards

      such asnodes/or`. Confirm that each assignment is required for an approved

      troubleshooting, maintenance, or platform administration function.

      Also review direct and inherited Azure role assignments and custom roles that permit

      this resource or all Kubernetes resources because Azure RBAC for Kubernetes

      auth'
    severity: medium
- id: 4.1.10
  title: Minimize access to the approval subresource of CertificateSigningRequests objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to the approval subresource of CertificateSigningRequests objects so that only tightly controlled
    administrative identities can approve certificate requests in AKS. AKS uses certificates for component authentication.
    Kubelets use CSRs as part of client certificate bootstrap and rotation. AKS authorization is intentionally granular and
    is meant to give users, groups, and service accounts access only to the resources they require. CSR approval authority
    should not be broadly included in general purpose cluster roles, namespace admin roles, or workload identities. AKS Automatic
    preconfigures Azure RBAC for Kubernetes Authorization, while service accounts can continue to receive permissions through
    Kubernetes RBAC.
  rationale: It is important to preserve the integrity of the AKS trust chain and keep certificate issuance under strict administrative
    control. Microsoft recommends securing API server access with the lowest possible permission levels, and AKS RBAC is designed
    to scope permissions precisely across cluster and namespace boundaries. The update on the certificatesigningrequests/approval
    subresource permits an identity to approve or deny a CSR. Approval alone does not issue a certificate. A signer must issue
    the certificate, and Kubernetes RBAC determines the permissions of the resulting identity. Limiting CSR approval therefore
    keeps certificate trust separate from ordinary workload and namespace operations. AKS manages the kubelet certificate
    workflow, so customer users and workload service accounts normally do not require CSR approval access.
  impact: If access is not minimized, the blast radius of an RBAC mistake in AKS grows significantly. A compromised identity
    could approve a malicious CSR. If an authorized signer issues the requested client certificate, it could be used to authenticate
    to the Kubernetes API with the permissions assigned to the resulting identity. Operationally, restricting this access
    improves separation of duties, reduces the number of identities that can affect cluster authentication state, and makes
    audit review of highly privileged RBAC assignments more defensible in AKS. Removing access required by an approved certificate
    workflow can interrupt kubelet bootstrap, certificate rotation, or a custom certificate process. Page 47
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-managednetwork
  page_start: 47
  audit_raw: 'Audit this control by reviewing how privileged access is granted across the AKS

    authorization model and verifying that CSR approval authority is limited to approved

    administrative identities. This is not a discrete platform setting. It is a least privilege

    review across Microsoft Entra integration, Kubernetes RBAC, and Azure RBAC for

    Kubernetes Authorization, which is preconfigured in AKS Automatic. Confirm whether

    any ClusterRole can approve the CertificateSigningRequests approval subresource and

    whether that privilege is granted to users, groups, or service accounts that do not

    require it.

    • Review both Azure RBAC for Kubernetes Authorization and any Kubernetes

    RBAC assignments that grant this access.

    • Review ClusterRole rules for the certificatesigningrequests/approval

    subresource, including rules that use resource or verb wildcards.

    • Trace matching rules through ClusterRoleBinding assignments to the users,

    groups, and service accounts that receive them.

    • Confirm the permission is restricted to approved administrative identities and is

    not exposed through broad custom roles or workload identities.

    • Review Azure role assignments and custom roles that permit CSR write

    operations.'
  remediation: 'Remove certificatesigningrequests/approval access from any ClusterRole

    that is not explicitly required for cluster certificate administration, then bind that

    capability only to approved AKS administrative identities. Use Microsoft Entra

    integration with least privilege Kubernetes RBAC and the preconfigured Azure RBAC for

    Kubernetes Authorization while limiting cluster permissions to approved identities.

    Remove unnecessary Azure role assignments or CSR write permissions from custom

    roles. Validate that expected AKS certificate workflows, such as kubelet TLS

    bootstrapping and rotation, continue to generate approved CSRs after permissions are

    tightened. Do not modify AKS managed system roles or bindings.'
  checks:
  - type: manual_review
    info: 'Audit this control by reviewing how privileged access is granted across the AKS

      authorization model and verifying that CSR approval authority is limited to approved

      administrative identities. This is not a discrete platform setting. It is a least privilege

      review across Microsoft Entra integration, Kubernetes RBAC, and Azure RBAC for

      Kubernetes Authorization, which is preconfigured in AKS Automatic. Confirm whether

      any ClusterRole can approve the CertificateSigningRequests approval subresource a'
    severity: medium
- id: 4.1.11
  title: Minimize access to webhook configuration objects
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to webhook configuration objects so that only tightly controlled cluster administrative identities
    can create, update, or delete ValidatingWebhookConfiguration and MutatingWebhookConfiguration resources in AKS. Admission
    controllers run after authentication and authorization but before an object is persisted, and Microsoft’s AKS documentation
    shows that webhook configurations define the webhook service endpoint and related trust material used by the API server.
    These objects can govern validation and mutation behavior used by components such as Azure Policy / Gatekeeper, service
    mesh injectors, and other admission integrations, so they should not be broadly writable by general users, namespace operators,
    or workload service accounts. AKS Automatic preconfigures Azure RBAC for Kubernetes Authorization and deployment safeguards,
    but access to customer managed webhook configuration objects must still be limited. Users with rights to create, update,
    patch, or delete validatingwebhookconfigurations or mutatingwebhookconfigurations can control webhooks that receive matching
    admission requests. Mutating webhooks can also modify matching objects before they are persisted. This could allow for
    privilege escalation or disruption of cluster operations.
  rationale: Preserve the integrity of the AKS admission path and prevent nonadministrative identities from changing how the
    API server evaluates or mutates requests. Microsoft’s AKS identity guidance states that Kubernetes RBAC should grant users,
    groups, and service accounts only the resources they need, and that service accounts continue to rely on normal Kubernetes
    RBAC even when Azure RBAC for Kubernetes Authorization is enabled for Microsoft Entra identities. Webhook configuration
    objects determine which requests are intercepted and which service in the cluster receives those admission callbacks.
    Broad write access creates a privilege boundary issue because a compromised user or service account with webhook configuration
    permissions could alter policy enforcement behavior or redirect admission processing beyond its intended operational role.
    Write access can change webhook rules, selectors, clientConfig, caBundle, and failurePolicy, which control request matching,
    endpoint trust, and API server behavior when the webhook is unavailable. AKS Automatic deployment safeguards do not replace
    least privilege controls for webhook configuration access. Page 50
  impact: If access is not minimized, the impact in AKS is both security and operational. Microsoft documents that unhealthy
    admission controllers can block API server requests. AKS Automatic relies on managed system resources and preconfigured
    node auto provisioning, so webhooks that apply broadly to nodes, leases, ClusterRoles, AKS managed namespaces, or other
    platform resources can interfere with service managed operations. Unnecessary access to webhook configuration objects
    can lead to rejected or unexpectedly modified resource admissions, disruption of policy enforcement or sidecar injection
    workflows, and instability in cluster lifecycle or platform operations that depend on predictable admission behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-security
  page_start: 50
  audit_raw: "Audit this control by identifying who can modify cluster webhook configuration resources\nand confirming that\
    \ webhook definitions are limited to approved admission use cases in\nAKS. Verify that ValidatingWebhookConfiguration\
    \ and\nMutatingWebhookConfiguration objects are present only where operationally\nrequired, that their coverage is not\
    \ broader than necessary, and that access to manage\nthem is restricted through least privilege RBAC. Misconfigured admission\
    \ webhooks can\ndisrupt cluster operations, especially when they apply too broadly or affect AKS\nmanaged resources.\n\
    • Review Azure RBAC for Kubernetes Authorization, which is preconfigured in AKS\nAutomatic, and any Kubernetes RBAC assignments\
    \ that grant this access.\n• Review ClusterRole rules for permissions on\nvalidatingwebhookconfigurations and\nmutatingwebhookconfigurations.\n\
    • Trace those permissions through ClusterRoleBinding objects to the users,\ngroups, and service accounts that receive\
    \ them.\n• Review Azure role assignments and custom roles that permit webhook\nconfiguration write or delete operations.\n\
    • Review existing webhook configurations to confirm their rules, selectors, and\nresource coverage are narrowly defined\
    \ and do not target AKS managed\nnamespaces or resources.\nkubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations\
    \ -o wide\nThis command retrieves all validating and mutating admission webhook configuration\nobjects in the cluster\
    \ and provides an inventory of the configured webhooks. Review an\nindividual object in YAML to evaluate its rules, selectors,\
    \ endpoint, trust material, and\nfailure behavior.\n Page 51"
  remediation: 'Remove permission to create, update, patch, or delete

    ValidatingWebhookConfiguration and MutatingWebhookConfiguration

    objects from broad ClusterRole assignments, then bind that access only to tightly

    controlled cluster administrative identities. Use least privilege Kubernetes RBAC and

    Azure RBAC for Kubernetes Authorization, which is preconfigured in AKS Automatic,

    with access granted through centrally managed identity groups rather than widely

    distributed individual assignments.

    Review service account permissions so workload identities do not inherit cluster

    webhook management capability. Remove unnecessary Azure role assignments or

    webhook configuration permissions from custom roles. Review each webhook

    configuration and narrow its match criteria to only the required namespaces, resources,

    and operations. Avoid broad webhook rules, exclude AKS internal namespaces and

    managed resources, and keep webhook backends healthy so admission processing

    does not disrupt API server requests or normal cluster lifecycle operations. Do not

    directly modify AKS managed webhook configurations.'
  checks:
  - type: manual_review
    info: 'Audit this control by identifying who can modify cluster webhook configuration resources

      and confirming that webhook definitions are limited to approved admission use cases in

      AKS. Verify that ValidatingWebhookConfiguration and

      MutatingWebhookConfiguration objects are present only where operationally

      required, that their coverage is not broader than necessary, and that access to manage

      them is restricted through least privilege RBAC. Misconfigured admission webhooks can

      disrupt cluster operation'
    severity: medium
- id: 4.1.12
  title: Minimize access to the service account token creation
  scoring: manual
  profile:
  - Level 1
  description: Minimize access to service account token creation so that only tightly controlled administrative or platform
    identities can request tokens for Kubernetes service accounts in AKS. AKS uses service accounts as a core Kubernetes identity
    type and documents that workloads can use Service Account Token Volume Projection to obtain a Kubernetes token. AKS OIDC
    guidance states that projected service account tokens are required for Kubernetes 1.30 or later clusters, with a maximum
    token lifetime of 24 hours. Permission to create or issue these tokens should not be broadly granted to namespace operators,
    CI/CD identities, or general workload service accounts. The relevant Kubernetes RBAC permission is create on the serviceaccounts/token
    subresource. It permits a token request for a named service account within the authorized namespace. These tokens are
    time limited rather than long lived Secret tokens.
  rationale: Microsoft’s AKS guidance states that Kubernetes RBAC should grant users, groups, and service accounts only the
    resources they need. Microsoft also notes that Azure RBAC for Kubernetes Authorization and Kubernetes RBAC must still
    be managed separately. AKS built in role guidance warns that access patterns involving Secrets or the ability to run pods
    as any service account can be used to gain that service account’s API access. Granting create on serviceaccounts/token
    provides a direct path to a usable service account credential. The token can authenticate with the Kubernetes permissions
    of the targeted service account until it expires, subject to its configured audience and other token restrictions. Page
    54
  impact: If access is not minimized, a compromised user, group, or automation identity could mint time limited but valid
    service account tokens and use them to authenticate to the Kubernetes API with the effective rights of the targeted service
    account. Removing the requester’s access does not by itself immediately invalidate a token that was already issued. For
    clusters using Microsoft Entra Workload ID, the AKS cluster acts as the token issuer. A projected service account token
    can be exchanged through OIDC federation for a Microsoft Entra token when the service account, token audience, and federated
    identity credential are configured for that exchange. This can extend the impact to Azure resources accessible through
    the associated workload identity.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  page_start: 54
  audit_raw: "Confirm that the ability to create service account tokens is limited to identities that\nrequire it for approved\
    \ platform or workload operations. Service accounts remain\nKubernetes identities governed by Kubernetes RBAC. AKS Automatic\
    \ preconfigures\nAzure RBAC for Kubernetes Authorization, so review its Azure role assignments\nalongside Kubernetes RBAC\
    \ bindings.\n• Review both Kubernetes RBAC and the preconfigured Azure RBAC for\nKubernetes Authorization.\n• Review Role\
    \ and ClusterRole rules for create access to serviceaccounts/token,\nincluding wildcard verbs or resources.\n• Trace those\
    \ permissions through bindings to the exact users, groups, and service\naccounts that receive them.\n• Review direct and\
    \ inherited Azure role assignments and custom roles that grant\nwrite access to service accounts or wildcard access to\
    \ Kubernetes resources.\n• Confirm each assignee has a documented need for token issuance and that the\npermission is\
    \ not exposed through broad custom roles, CI/CD identities, or\nworkload service accounts.\n• Validate that current service\
    \ account token use aligns with expected AKS\nworkload identity or platform behavior and not ad hoc credential minting.\n\
    \ Page 55"
  remediation: 'Review all Role and ClusterRole definitions for access to the

    serviceaccounts/token subresource. Remove that permission from any user,

    group, CI/CD identity, or workload service account that does not have a documented

    operational requirement. Also review the preconfigured Azure RBAC for Kubernetes

    Authorization because Microsoft Entra identities and Kubernetes service accounts

    follow different authorization paths.

    1. Review Role and ClusterRole objects for serviceaccounts/token access.

    2. Remove that permission from broad operational roles, CI/CD identities, and

    workload service accounts.

    3. Reassign it only to approved administrative or platform identities with a

    documented need.

    4. Remove unnecessary Azure role assignments or custom role permissions that

    provide equivalent access.

    5. Validate that required workload identity and projected token flows still function

    correctly.

    6. Recheck bindings to confirm no unintended subject still receives token creation

    rights.

    7. Do not modify AKS or Kubernetes managed system roles or bindings.'
  checks:
  - type: manual_review
    info: 'Confirm that the ability to create service account tokens is limited to identities that

      require it for approved platform or workload operations. Service accounts remain

      Kubernetes identities governed by Kubernetes RBAC. AKS Automatic preconfigures

      Azure RBAC for Kubernetes Authorization, so review its Azure role assignments

      alongside Kubernetes RBAC bindings.

      • Review both Kubernetes RBAC and the preconfigured Azure RBAC for

      Kubernetes Authorization.

      • Review Role and ClusterRole rules for creat'
    severity: medium
- id: 4.2.1
  title: Minimize the admission of privileged containers
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of privileged containers by restricting the ability to create Pods whose containers,
    init containers, or ephemeral containers run with securityContext.privileged=true, and reserve that capability for narrowly
    approved platform scenarios only. AKS Automatic enables Deployment Safeguards and baseline Pod Security Standards in Enforce
    mode by default, providing built in admission controls for privileged workloads.
  rationale: Privileged containers have access to all Linux kernel capabilities and devices. A privileged container can perform
    many host level operations, including manipulating network settings, accessing devices, and mounting file systems. This
    flag exists to allow special use cases, such as manipulating the network stack and accessing devices. There should be
    at least one enforcing admission control policy that does not permit privileged containers. If privileged containers are
    required, use an approved namespace exclusion and limit permission to manage that exclusion. AKS Automatic does not allow
    the cluster safeguard level to be changed from Enforce to Warn.
  impact: 'AKS Automatic enforces baseline Pod Security Standards by default, so Pods defined with spec.containers[].securityContext.privileged:
    true, spec.initContainers[].securityContext.privileged: true, or spec.ephemeralContainers[].securityContext.privileged:
    true are not permitted unless an approved namespace exclusion applies. Pod Security Admission does not remove existing
    running Pods when an enforcing namespace label is added. Page 59'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/deployment-safeguards
  page_start: 59
  audit_raw: "List the policies in use for each namespace in the cluster and ensure that each policy\ndisallows the admission\
    \ of privileged containers. Also review any namespace\nexclusions configured for Deployment Safeguards and confirm that\
    \ each exclusion has\nan approved requirement.\nSince manually searching each Pod configuration might be difficult in\
    \ environments with\nmany Pods, use the following command to identify privileged containers, init containers,\nand ephemeral\
    \ containers:\nkubectl get pods -A -o json \\\n| jq -r '\n  .items[]\n  | .metadata.namespace as $ns\n  | .metadata.name\
    \ as $pod\n  | [\n      .spec.containers[]?,\n      .spec.initContainers[]?,\n      .spec.ephemeralContainers[]?\n   \
    \ ][]\n  | select((.securityContext.privileged // false) == true)\n  | \"\\($ns)/\\($pod)\\tcontainer=\\(.name)\\tprivileged=true\"\
    \n'\nSample output:\nkube-system/csi-azuredisk-node-h5m77    container=azuredisk\nprivileged=true\nkube-system/csi-azurefile-node-sn9sq\
    \    container=azfilesrefresh\nprivileged=true\nkube-system/csi-azurefile-node-sn9sq    container=azurefile\nprivileged=true\n\
    kube-system/csi-azurefile-node-sn9sq    container=install-azurefile-proxy\nprivileged=true\nkube-system/kube-proxy-rg5tt\
    \            container=kube-proxy\nprivileged=true\nkube-system/kube-proxy-rg5tt            container=kube-proxy-bootstrap\n\
    privileged=true\nReview AKS managed system Pods separately from user workloads. Do not modify\nAKS managed components.\n\
    \ Page 60"
  remediation: 'AKS Automatic already enforces baseline Pod Security Standards and Deployment

    Safeguards. Remove privileged mode from user workloads rather than adding another

    admission policy.

    To enforce the restricted Pod Security Standard for a namespace, set the podsecurity.kubernetes.io/enforce label:

    kubectl label --overwrite ns NAMESPACE podsecurity.kubernetes.io/enforce=restricted

    The command enforces the restricted policy for the specified namespace.

    Where an exception is required, use an approved namespace exclusion and limit who

    can manage it. Deployment Safeguards are already enabled in Enforce mode. Use

    Azure Policy only when additional centralized policy requirements are needed.'
  checks:
  - type: manual_review
    info: 'List the policies in use for each namespace in the cluster and ensure that each policy

      disallows the admission of privileged containers. Also review any namespace

      exclusions configured for Deployment Safeguards and confirm that each exclusion has

      an approved requirement.

      Since manually searching each Pod configuration might be difficult in environments with

      many Pods, use the following command to identify privileged containers, init containers,

      and ephemeral containers:

      kubectl get pods -A -o js'
    severity: medium
- id: 4.2.2
  title: Minimize the admission of containers wishing to share the host process ID namespace
  scoring: scored
  profile:
  - Level 1
  description: Minimize the admission of Pods that request spec.hostPID=true so that only tightly controlled, explicitly approved
    platform workloads can share the host process ID namespace in AKS. Users, groups, and service accounts with deployment
    rights should not be able to create or update workloads that use host PID sharing without an approved exception. AKS Automatic
    enables Deployment Safeguards and baseline Pod Security Standards in Enforce mode by default. Do not generally permit
    containers to be run with the hostPID flag set to true.
  rationale: A container running in the host's PID namespace can inspect processes running outside the container. If the container
