- id: 5.2.1
  title: Use dedicated Kubernetes service accounts for AKS workloads
  scoring: manual
  profile:
  - Level 1
  description: It is important to use dedicated Kubernetes service accounts in AKS so identity, permissions, and token use
    are isolated to the specific workload that requires them, rather than shared across unrelated pods. Kubernetes service
    accounts remain a core Kubernetes identity construct and also serve as the anchor for Microsoft Entra Workload ID, which
    allows access to Kubernetes and Azure resources to be assigned per workload.
  rationale: Using dedicated service accounts supports least privilege by allowing each AKS workload to receive only the Kubernetes
    RBAC permissions and Azure access it actually requires, instead of sharing identity and permissions through a common account.
    Azure RBAC for Kubernetes authorization is preconfigured for Microsoft Entra identities in AKS Automatic, while Kubernetes
    service accounts continue to receive Kubernetes API permissions through Kubernetes RBAC. Dedicated accounts also help
    limit token exposure and lateral movement because a pod can use its mounted service account token with the permissions
    assigned to that service account. Kubernetes normally uses projected, time limited service account tokens for pods, and
    unnecessary token mounting increases the number of workloads that carry usable credentials.
  impact: This approach adds per workload identity configuration because each application may need its own service account
    and RBAC binding. Workloads that access Azure resources may also require a service account annotation, the required pod
    label, and a federated identity credential. AKS Automatic preconfigures the OIDC issuer and Microsoft Entra Workload ID
    at the cluster level, so those cluster features do not require separate enablement. If the workload settings are incomplete,
    workloads can fail to authenticate or access required resources. Page 112
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/concepts-identity
  page_start: 112
  audit_raw: "For each namespace, verify that workloads do not use the default service account\nunless required, and confirm\
    \ that the default service account has no custom role\nbindings beyond baseline defaults. Review service accounts used\
    \ by individual\nworkloads to ensure permissions follow least privilege, and confirm\nautomountServiceAccountToken is\
    \ disabled where token access is not needed.\n• Review each namespace for pods and workload controllers that use the\n\
    default service account, and flag any use that is not explicitly required.\n• Review RoleBinding and ClusterRoleBinding\
    \ assignments for the default\nservice account and confirm it has no custom permissions beyond baseline\ndefaults.\n•\
    \ Verify that dedicated service accounts are bound only to the minimum required\nKubernetes RBAC roles.\n• Check service\
    \ accounts and pod specifications for unnecessary token exposure,\nand confirm automountServiceAccountToken is set to\
    \ false where a\nworkload does not need a service account token.\n• For workloads that access Azure resources, verify\
    \ they use a dedicated\nKubernetes service account with the required pod label, service account\nannotation, and federated\
    \ identity mapping rather than a shared or default\naccount.\nUse this simple inventory command to identify the service\
    \ account used by each\nrunning pod:\nkubectl get pods -A -o customcolumns=\"NAMESPACE:.metadata.namespace,POD:.metadata.name,SERVICEACCOUNT:.spec.serv\n\
    iceAccountName\"\n Page 113"
  remediation: 'Use a dedicated Kubernetes service account for each AKS workload that requires

    identity, and replace use of the namespace default service account wherever it is not

    explicitly required. Limit each service account to only the Kubernetes permissions and

    Azure resource access needed by that workload, and prevent service account tokens

    from being mounted into pods unless token access is required.

    1. Create a separate Kubernetes service account for each workload or application

    boundary that requires distinct access.

    2. Bind each service account only to the minimum required Kubernetes Role or

    ClusterRole, and avoid granting custom permissions to the namespace default

    service account. Prefer a RoleBinding in the required namespace when

    permissions do not need to apply throughout the cluster.

    3. Set automountServiceAccountToken: false for pods that do not need a

    service account token.

    4. If a workload needs access to Azure resources, create the federated identity

    credential and annotate the dedicated service account for that workload. Apply

    the azure.workload.identity/use: "true" label to the pod template.

    5. Update Deployments, StatefulSets, CronJobs, and other controllers so they

    reference the intended dedicated service account through

    spec.serviceAccountName.'
  checks:
  - type: manual_review
    info: 'For each namespace, verify that workloads do not use the default service account

      unless required, and confirm that the default service account has no custom role

      bindings beyond baseline defaults. Review service accounts used by individual

      workloads to ensure permissions follow least privilege, and confirm

      automountServiceAccountToken is disabled where token access is not needed.

      • Review each namespace for pods and workload controllers that use the

      default service account, and flag any use that'
    severity: medium
- id: 5.3.1
  title: Encrypt Kubernetes Secrets at rest with AKS KMS protection
  scoring: manual
  profile:
  - Level 1
  description: Kubernetes Secret data stored by AKS in etcd must be protected with encryption at rest. When additional KMS
    protection is required, use the AKS KMS provider integrated with Azure Key Vault. Azure platform encryption provides baseline
    storage layer protection, while AKS KMS adds envelope encryption before Secret data is committed to etcd. AKS KMS supports
    platform managed keys for simpler operation or customer managed keys in Azure Key Vault when direct control over the encryption
    key lifecycle is required.
  rationale: AKS stores Kubernetes Secret objects in etcd, so AKS KMS provides protection beyond baseline Azure storage layer
    encryption. The Kubernetes API server encrypts Secret data with a data encryption key and protects that key with a key
    encryption key in Azure Key Vault before the encrypted data is written to etcd. This keeps the key encryption key separate
    from the encrypted Secret data.
  impact: Using AKS KMS strengthens Secret data at rest. Customer managed keys add a direct dependency on the configured Key
    Vault, key, managed identity, and access configuration. Deleting the key or Key Vault can make cluster Secrets unrecoverable.
    After the current KMS data encryption experience is enabled, it cannot be disabled or downgraded. The current experience
    is in Preview and requires managed identity and a supported cluster configuration. Private Key Vault access uses the trusted
    services firewall exception rather than a private endpoint. These requirements also apply to AKS Automatic clusters. Page
    117
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/kms-data-encryption
  page_start: 117
  audit_raw: "Review each AKS Automatic cluster to determine whether KMS encryption for\nKubernetes Secrets is enabled and\
    \ correctly configured. Azure platform encryption is\nalways enabled for data at rest, but AKS KMS adds a separate encryption\
    \ layer before\nSecret data is written to etcd.\nVerify that\nsecurityProfile.kubernetesResourceObjectEncryptionProfile.infras\n\
    tructureEncryption is set to Enabled for the current KMS data encryption\nexperience. If securityProfile.azureKeyVaultKms.enabled\
    \ is true, review\nthe key identifier and Key Vault fields to determine whether customer managed keys are\nconfigured.\n\
    For customer managed keys, confirm that the referenced key is enabled, has not\nexpired, and remains available. For a\
    \ private Key Vault, confirm that the trusted\nservices firewall exception and managed identity access are configured.\n\
    Use the following command:\naz aks show \\\n  --name $CLUSTER_NAME \\\n  --resource-group $RESOURCE_GROUP \\\n  --query\n\
    \"{InfrastructureEncryption:securityProfile.kubernetesResourceObjectEncryptionProfil\ne.infrastructureEncryption, \\\n\
    \  CustomerManagedKeyEnabled:securityProfile.azureKeyVaultKms.enabled,\nKeyId:securityProfile.azureKeyVaultKms.keyId,\
    \ \\\n  KeyVaultNetworkAccess:securityProfile.azureKeyVaultKms.keyVaultNetworkAccess, \\\n  KeyVaultResourceId:securityProfile.azureKeyVaultKms.keyVaultResourceId}\"\
    \ -o json\nFor the current KMS experience, KMS.infrastructureEncryption should be\nEnabled. With platform managed keys,\
    \ the customer managed key fields can be\nempty. With customer managed keys, CMK.enabled should be true, and the\nexpected\
    \ key identifier and Key Vault values should be present. If the applicable KMS\nindicators are absent or disabled, the\
    \ control is not satisfied.\n Page 118"
  remediation: 'Enable AKS KMS on AKS Automatic clusters that require additional Kubernetes Secret

    encryption. Confirm that the selected KMS experience is supported for the cluster and

    that Preview use is approved where applicable.

    1. Identify clusters where AKS KMS is not enabled.

    2. Decide whether to use platform managed keys or customer managed keys based

    on key ownership and compliance requirements.

    3. For customer managed keys, create or select the Azure Key Vault key, assign a

    user assigned managed identity, and grant the required key permissions before

    enabling KMS.

    4. For a private Key Vault, configure the firewall to allow trusted Azure services and

    confirm that the managed identity can access the vault.

    5. Verify that the AKS security profile shows infrastructure encryption enabled and,

    for customer managed keys, the expected Key Vault configuration.

    6. Ensure that the referenced Key Vault and key remain available to prevent loss of

    access to encrypted Secrets.'
  checks:
  - type: manual_review
    info: 'Review each AKS Automatic cluster to determine whether KMS encryption for

      Kubernetes Secrets is enabled and correctly configured. Azure platform encryption is

      always enabled for data at rest, but AKS KMS adds a separate encryption layer before

      Secret data is written to etcd.

      Verify that

      securityProfile.kubernetesResourceObjectEncryptionProfile.infras

      tructureEncryption is set to Enabled for the current KMS data encryption

      experience. If securityProfile.azureKeyVaultKms.enabled is true, review

      th'
    severity: medium
- id: 5.4.1
  title: Restrict Access to the Control Plane Endpoint
  scoring: scored
  profile:
  - Level 1
  description: The AKS control plane endpoint should be exposed only through approved network paths rather than being broadly
    reachable. For AKS, the control plane is the Kubernetes API server. For public clusters, API server authorized IP ranges
    can be used to limit access to specific public IP addresses or CIDR blocks and deny all other sources. For more restrictive
    deployments, AKS also supports private clusters, where the API server is exposed through a private endpoint with private
    DNS resolution. AKS Automatic preconfigures API Server VNet Integration, which keeps node to API server traffic on private
    networking. API Server VNet Integration supports both public and private clusters and does not by itself restrict external
    access to a public API server.
  rationale: The Kubernetes API server is assigned a public IP address by default, so restricting access to approved source
    IP addresses reduces exposure of the control plane to unsolicited network traffic. API server authorized IP ranges allow
    only specified public IP addresses or CIDR blocks to reach the public API server endpoint, while requests from other source
    IPs are blocked. For environments that do not permit internet reachable management endpoints, Microsoft recommends using
    a private cluster so API server access stays on private network paths instead of relying on public endpoint filtering
    alone. The private node connection supplied by API Server VNet Integration does not replace these controls because clients
    outside the cluster can still use the public endpoint when public access remains enabled. Page 122
  impact: Restricting the AKS control plane endpoint changes how administrators and automation reach the Kubernetes API server.
    If API server authorized IP ranges are used, all required administrator or egress public IP ranges must be explicitly
    allowed or legitimate access can be blocked; authorized IP ranges apply only to the public API server endpoint and cannot
    be used with private clusters. If a private cluster is used, management access must come from the cluster VNet, a peered
    network, or another approved private access path, and proper private DNS resolution is required. A public FQDN on a private
    cluster is only a publicly resolvable DNS name and does not create a public API endpoint. Microsoft also notes that private
    clusters do not support Azure DevOps Microsoft hosted agents, and any dependent private services such as Azure Container
    Registry must be reachable through an appropriate private network and DNS design. AKS Automatic already includes API Server
    VNet Integration, so that conversion and its restart are not required. Enabling private cluster mode still requires administrators,
    automation, and dependent services to use approved private connectivity. Page 123
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/api-server-vnet-integration
  page_start: 122
  audit_raw: "Review each AKS Automatic cluster to determine how the Kubernetes API server is\nexposed and whether network\
    \ restrictions are configured appropriately. Specifically,\nverify whether the cluster is deployed as a private cluster,\
    \ whether a public FQDN\nremains enabled for that private cluster, and whether authorized IP ranges are\nconfigured on\
    \ any public API server endpoint. For AKS, authorized IP ranges apply to\nthe public API server endpoint, while private\
    \ cluster access is controlled through private\nnetworking and DNS design rather than public IP allowlisting. Do not treat\
    \ the\npreconfigured API Server VNet Integration as evidence that public API server access is\nrestricted.\naz aks show\
    \ \\\n  --name \"${CLUSTER_NAME}\" \\\n  --resource-group \"${RESOURCE_GROUP}\" \\\n  --query \"{enablePrivateCluster:apiServerAccessProfile.enablePrivateCluster,\n\
    enablePublicFqdn:apiServerAccessProfile.enablePublicFqdn,\nauthorizedIpRanges:apiServerAccessProfile.authorizedIpRanges}\"\
    \ \\\n  --output json\nInterpretation:\n• enablePrivateCluster: true means the cluster is configured as a private\nAKS\
    \ cluster and the API server is intended to be reached through private network\nconnectivity.\n• enablePublicFqdn: true\
    \ means a public DNS name exists for the API\nserver. For a private cluster, this does not indicate that a public API\
    \ endpoint\nexists. The public FQDN can be disabled when the security standard prohibits a\npublicly resolvable API server\
    \ name. This setting should not be described as\nendpointPublicAccess.\n• authorizedIpRanges lists the allowed source\
    \ CIDR ranges for access to the\npublic API server endpoint. If the list is empty or null on a public cluster, there is\n\
    no IP address restriction on that public endpoint. Authorized IP ranges are not\nsupported with private clusters.\nThe\
    \ result for a private cluster should show enablePrivateCluster as true.\nenablePublicFqdn should be evaluated against\
    \ your security standard, and\nauthorizedIpRanges should only be treated as relevant where a public API server\nendpoint\
    \ is in play. For a public cluster, the key networking control is whether\nauthorizedIpRanges is populated with only approved\
    \ administrator or egress CIDR\nblocks.\n Page 124"
  remediation: 'If the cluster is intended to expose the Kubernetes API server only over private network

    paths, use a private AKS cluster; if the cluster is already private but a public DNS name

    is still published, disable the public FQDN when required by the security standard. If the

    cluster must keep a public API server endpoint, configure authorized IP ranges so only

    approved administrator and egress CIDR ranges can reach it. Microsoft notes that

    authorized IP ranges apply only to the public API server endpoint, recommends

    including both the cluster egress IP and the networks used to administer the cluster,

    and states that rule updates can take up to two minutes to propagate.

    1. If enablePrivateCluster is false and the cluster should be managed only

    over private connectivity, enable private cluster mode. API Server VNet

    Integration is already preconfigured for AKS Automatic, so a separate conversion

    is not required.

    2. If enablePrivateCluster is true but enablePublicFqdn is also true and

    your standard does not allow a public DNS name, disable the public FQDN for

    the private cluster.

    3. If the cluster keeps a public API server endpoint and authorizedIpRanges is

    empty or null, add approved CIDR ranges so the API server is not broadly

    reachable from the internet.

    4. If authorizedIpRanges is present but incomplete, update it to include only the

    required administrator, VPN, firewall, NAT gateway, and other approved egress

    ranges, including the cluster egress IP and the networks from which the cluster is

    administered.

    5. After remediation, rerun the same az aks show audit query and test access

    from both approved and nonapproved network paths, allowing for the

    documented propagation delay before confirming results.'
  checks:
  - type: sql
    command: show \
    severity: medium
    info: 'Review each AKS Automatic cluster to determine how the Kubernetes API server is

      exposed and whether network restrictions are configured appropriately. Specifically,

      verify whether the cluster is deployed as a private cluster, whether a public FQDN

      remains enabled for that private cluster, and whether authorized IP ranges are

      configured on any public API server endpoint. For AKS, authorized IP rang'
- id: 5.4.2
  title: Use private AKS clusters and disable the public API server FQDN
  scoring: scored
  profile:
  - Level 2
  description: Provisioning AKS in private cluster mode limits control plane exposure by placing the Kubernetes API server
    on private addressing and requiring connectivity through approved private network paths rather than broad public network
    access. AKS Automatic preconfigures API Server VNet Integration, which places the API server behind an internal load balancer
    address in a delegated subnet. In this design, AKS creates the required private connectivity and DNS configuration needed
    for internal name resolution, and the public FQDN can also be disabled when the security requirement is to prevent the
    control plane from publishing any public DNS name. This reduces the external attack surface of the cluster management
    plane and aligns API server access to approved private network paths only.
  rationale: Because the AKS API server is public by default, provisioning the cluster in private cluster mode materially
    reduces control plane exposure by shifting API server access from internet routable paths to private addressing and private
    DNS resolution. AKS Automatic uses its preconfigured API Server VNet Integration to provide an internal load balancer
    address in the delegated API server subnet. Private cluster mode removes public client access to the API server. This
    constrains administrative access to approved internal network paths and reduces dependence on public endpoint protections
    alone. Disabling the public FQDN provides additional hardening because private AKS clusters otherwise publish both private
    and public DNS names by default. A public FQDN on a private cluster is only a publicly resolvable name and does not create
    a public API endpoint.
  impact: Private AKS clusters require all administrative access, automation, and API integrations to use approved private
    network paths and private DNS resolution to reach the Kubernetes API server. This can require updates to network routing,
    DNS forwarding, jump host or VPN design, CI/CD runner placement, and access methods for dependent services that manage
    or interact with the cluster control plane. Azure DevOps Microsoft hosted agents are not supported for private clusters,
    so pipelines require self hosted agents on a connected network or another supported private access method. AKS Automatic
    already includes API Server VNet Integration, so enabling private cluster mode does not require the Standard cluster conversion
    and restart process. Page 127
  references:
  - 1. https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - 2. https://learn.microsoft.com/en-us/azure/aks/automatic/quick-automatic-privatecustom-network
  page_start: 127
  audit_raw: "Review the AKS Automatic cluster apiServerAccessProfile to confirm the control\nplane is deployed as a private\
    \ AKS cluster and that the public FQDN is disabled when\nthe security standard requires no public DNS name for the Kubernetes\
    \ API server. A\nprivate AKS cluster uses internal IP addressing for the API server. The preconfigured\nAPI Server VNet\
    \ Integration places the API server behind an internal load balancer\naddress in a delegated subnet. In addition, private\
    \ AKS clusters create both private and\npublic FQDNs by default unless the public FQDN is explicitly disabled. Do not\
    \ treat API\nServer VNet Integration alone as evidence that private cluster mode is enabled.\nexport CLUSTER_NAME=<your\
    \ cluster name>\nexport RESOURCE_GROUP=<your resource group name>\naz aks show \\\n  --name \"${CLUSTER_NAME}\" \\\n \
    \ --resource-group \"${RESOURCE_GROUP}\" \\\n  --query \"{enablePrivateCluster:apiServerAccessProfile.enablePrivateCluster,\n\
    enablePublicFqdn:apiServerAccessProfile.enablePublicFqdn,\nauthorizedIpRanges:apiServerAccessProfile.authorizedIpRanges}\"\
    \ \\\n  --output json\nOutput should be similar to:\n{\n  \"enablePrivateCluster\": true,\n  \"enablePublicFqdn\": false,\n\
    \  \"authorizedIpRanges\": null\n}\n• enablePrivateCluster should be true to show the cluster is deployed in\nprivate\
    \ cluster mode. Microsoft states that a private cluster API server uses\ninternal IP addresses. AKS Automatic uses its\
    \ preconfigured API Server VNet\nIntegration for the private API server connection.\n• enablePublicFqdn should be false\
    \ when the requirement is to prevent the\nAPI server from publishing a public DNS name. Microsoft documents that private\n\
    AKS clusters create both private and public FQDNs by default unless the public\nFQDN is disabled.\n• authorizedIpRanges\
    \ is not the primary compliance check for this control.\nMicrosoft states that authorized IP ranges apply only to the\
    \ public API server\nendpoint and cannot be used with private clusters.\n• If enablePrivateCluster is false, the cluster\
    \ does not meet this control\nbecause the API server is not restricted to private cluster connectivity.\n• If enablePrivateCluster\
    \ is true but enablePublicFqdn is also true, the\ncluster is private but still publishes a public DNS name, so it would\
    \ not meet a\nstricter requirement that public control plane naming be disabled. This does not\nmean the private cluster\
    \ has a public API endpoint.\n Page 128"
  remediation: 'Use the apiServerAccessProfile results to determine whether the cluster must be

    moved to private cluster mode and whether the public FQDN must be disabled.

    Remediation should bring the cluster to enablePrivateCluster: true and, where

    required by policy, enablePublicFqdn: false; the detailed action depends on

    whether the cluster is new or existing. API Server VNet Integration is already

    preconfigured for AKS Automatic.

    1. If enablePrivateCluster is false on a new deployment, create the cluster

    as private by using az aks create --sku automatic --enable-privatecluster --disable-public-fqdn when the requirement is
    to prevent

    publication of a public DNS name for the API server.

    2. If enablePrivateCluster is false on an existing AKS Automatic cluster,

    enable private cluster mode through the supported AKS update path. A separate

    API Server VNet Integration conversion is not required.

    3. If enablePrivateCluster is true but enablePublicFqdn is true, disable

    the public FQDN by running az aks update --disable-public-fqdn against

    the private cluster.

    4. After remediation, rerun the audit command and confirm

    enablePrivateCluster is true and enablePublicFqdn is false, then

    validate that private DNS resolution and approved private network paths can still

    reach the API server.'
