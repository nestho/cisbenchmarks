- id: 5.1.5
  title: Ensure 'PASSWORD_VERIFY_FUNCTION' Is Set for All Profiles
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: The PASSWORD_VERIFY_FUNCTION determines password settings requirements when a user password is changed at the
    SQL command prompt. It should be set for all profiles.
  rationale: Through database profiles, password complexity rules (mixed cases with digits and special characters), blocking
    of simple combinations, and enforcing change/history settings can potentially thwart unauthorized logins by an unauthorized
    user.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001888307
  page_start: 100
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT PROFILE,RESOURCE_NAME,LIMIT FROM SYS.DBA_PROFILES where

    RESOURCE_NAME=''PASSWORD_VERIFY_FUNCTION'';

    The query result should not show NULL. Instead, it should return a valid password

    verification function name.'
  remediation: "Create a custom password verification function which fulfills the password requirements\nof the organization.\n\
    ALTER PROFILE &lt;profile_name&gt; LIMIT PASSWORD_VERIFY_FUNCTION\n&lt;password_verify_func&gt;;\nIt is recommended that\
    \ the password verification feature implement the following\nrequirements to meet security standards:\n• Passwords must\
    \ be at least 14 characters long.\n• Passwords must contain at least one uppercase letter, one lowercase letter, and\n\
    one special character (e.g., !@#$%^&*).\n• Passwords must not be the same as the username, the reverse of the username,\n\
    or the database server name.\nNOTE: Please review the reference below for an example\nPASSWORD_VERIFY_FUNCTION.\ndelimiter\
    \ //\nCREATE OR REPLACE FUNCTION complexity_check\n(password varchar2,\n    chars integer := NULL,\n    letter integer\
    \ := NULL,\n    upper_c integer := NULL,\n    lower_c integer := NULL,\n    digit integer := NULL,\n    special integer\
    \ := NULL)\nRETURN boolean IS\n    digit_array varchar2(10) := '0123456789';\n    alpha_array varchar2(26) := 'abcdefghijklmnopqrstuvwxyz';\n\
    \    cnt_letter integer := 0;\n    cnt_upper integer := 0;\n    cnt_lower integer := 0;\n    cnt_digit integer := 0;\n\
    \    cnt_special integer := 0;\n    flag boolean := FALSE;\n    len INTEGER := NVL(length(password), 0);\n    i integer\
    \ ;\n    ch CHAR(1);\nBEGIN\n    -- Check that the password length does not exceed 2 * (max DB pwd len)\n    -- The maximum\
    \ length of any DB User password is 128 bytes.\n    -- This limit improves the performance of the Edit Distance calculation\n\
    \    -- between old and new passwords.\nIF len > 256 THEN\n    raise_application_error(-20020, 'Password length more than\
    \ 256');\nEND IF;\n    -- Classify each character in the password.\n    FOR i in 1..len LOOP\n        ch := substr(password,\
    \ i, 1);\n        IF ch = '\"' THEN\n            flag := TRUE;\n        ELSIF instr(digit_array, ch) > 0 THEN\n      \
    \      cnt_digit := cnt_digit + 1;\n        ELSIF instr(alpha_array, LOWER(ch)) > 0 THEN\n            cnt_letter := cnt_letter\
    \ + 1;\n            IF ch = LOWER(ch) THEN\n                cnt_lower := cnt_lower + 1;\n            ELSE\n          \
    \      cnt_upper := cnt_upper + 1;\n            END IF;\n        ELSE\n            cnt_special := cnt_special + 1;\n \
    \       END IF;\n    END LOOP;\n    IF flag = 1 THEN\n        raise_application_error(-20012, 'password must NOT contain\
    \ a '\n                                                            || 'double-quote\ncharacter, which is '\n         \
    \                                                   || 'reserved as a\npassword delimiter');\n    END IF;\n    IF chars\
    \ IS NOT NULL AND len < chars THEN\n        raise_application_error(-20001, 'Password length less than ' ||\n        \
    \                                                    chars);\n    END IF;\n    IF letter IS NOT NULL AND cnt_letter <\
    \ letter THEN\n        raise_application_error(-20022, 'Password must contain at least ' ||\n                        \
    \                                    letter || '\nletter(s)');\n    END IF;\n    IF upper_c IS NOT NULL AND cnt_upper\
    \ < upper_c THEN\n        raise_application_error(-20023, 'Password must contain at least ' ||\n                     \
    \                                       upper_c || '\nuppercase character(s)');\n    END IF;\n    IF lower_c IS NOT NULL\
    \ AND cnt_lower < lower_c THEN\n        raise_application_error(-20024, 'Password must contain at least ' ||\n       \
    \                                                         lower_c || '\nlowercase character(s)');\n    END IF;\n    IF\
    \ digit IS NOT NULL AND cnt_digit < digit THEN\n        raise_application_error(-20025, 'Password must contain at least\
    \ ' ||\n                                                                digit || '\ndigit(s)');\n    END IF;\n    IF special\
    \ IS NOT NULL AND cnt_special < special THEN\n        raise_application_error(-20026, 'Password must contain at least\
    \ ' ||\n                                                                special || '\nspecial character(s)');\n    END\
    \ IF;\n    RETURN(TRUE);\n    END;\n//\nCREATE OR REPLACE FUNCTION verify_function\n(username varchar2,\n    password\
    \ varchar2,\n    old_password varchar2)\n    -- In this example, three function parameters are defined: username, new\n\
    password, and old password.\nRETURN boolean IS\n    differ integer;\n    pw_lower varchar2(256);\n    db_name varchar2(40);\n\
    \    i integer;\n    simple_password varchar2(10);\n    reverse_user varchar2(32);\nBEGIN\n    IF NOT complexity_check(password,\
    \ 14, NULL, 1, 1, NULL, 1) THEN\n        RETURN(FALSE);\n    END IF;\n    -- Check if the password contains the username\n\
    \    pw_lower := LOWER(password);\n    IF instr(pw_lower, LOWER(username)) > 0 THEN\n        raise_application_error(-20002,\
    \ 'Password contains the username');\n    END IF;\n    -- Check if the password contains the username reversed\n    reverse_user\
    \ := '';\n    FOR i in REVERSE 1..length(username) LOOP\n        reverse_user := reverse_user || substr(username, i, 1);\n\
    \    END LOOP;\n    IF instr(pw_lower, LOWER(reverse_user)) > 0 THEN\n        raise_application_error(-20003, 'Password\
    \ contains the username ' ||\n'reversed');\n    END IF;\n    -- Check if the password contains the server name\n    db_name\
    \ := 'oceanbase';\n    IF instr(pw_lower, LOWER(db_name)) > 0 THEN\n        raise_application_error(-20004, 'Password\
    \ contains the server name');\n    END IF;\n    -- Check if the password contains 'oracle'\n    IF instr(pw_lower, 'oracle')\
    \ > 0 THEN\n        raise_application_error(-20006, 'Password too simple');\n    END IF;\n    RETURN(TRUE);\nEND;\n//\n\
    delimiter ;\nobclient> GRANT EXECUTE ON verify_function TO PUBLIC;\nobclient> CREATE PUBLIC SYNONYM verify_function FOR\
    \ sys.verify_function;"
  checks:
  - type: sql
    command: SELECT PROFILE,RESOURCE_NAME,LIMIT FROM SYS.DBA_PROFILES where
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT PROFILE,RESOURCE_NAME,LIMIT FROM SYS.DBA_PROFILES where

      RESOURCE_NAME=''PASSWORD_VERIFY_FUNCTION'';

      The query result should not show NULL. Instead, it should return a valid password

      verification function name.'
