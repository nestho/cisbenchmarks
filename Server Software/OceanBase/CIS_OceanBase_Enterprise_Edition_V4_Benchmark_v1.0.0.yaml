- id: 3.2.2
  title: Only Approved Servers can Access
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: Specify an allowlist of approved servers that can access to the cluster.
  rationale: When using cluster by specifying the allowlist explicitly, it can increase the security of the cluster as only
    servers in the allowlist are allowed to connect to the cluster.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001885736
  page_start: 46
  audit_raw: 'Execute the following SQL query to inspect the current SSL client allowlist configuration:

    SELECT svr_ip,name,value

    FROM oceanbase.GV$OB_PARAMETERS

    WHERE name=''_ob_ssl_invited_nodes'';

    • The configuration is compliant if the value is explicitly set to a non-empty list of

    trusted IP addresses or hostnames (e.g., 192.168.1.10,192.168.1.11).

    • The configuration is non-compliant if the value is set to 0.0.0.0/0, ALL, None, or

    effectively permits unrestricted access.

    This recommendation is satisfied only when _ob_ssl_invited_nodes is configured to

    a specific, limited set of authorized client or application server IPs.'
  remediation: 'Configure a restrictive allowlist of approved clients:

    1. Identify all legitimate hosts that require SSL/TLS connectivity to the OceanBase

    cluster (e.g., application servers, OCP nodes, backup servers).

    2. Set the parameter using the following SQL statement, replacing

    <approved_ips> with a comma-separated list of trusted IPs:

    ALTER SYSTEM SET _ob_ssl_invited_nodes=''<ips_list_in_cluster>'';

    3. Verify the change by re-running the audit query and confirming that only intended

    IPs are listed.

    4. Test connectivity from approved and unapproved hosts to validate enforcement.'
  checks:
  - type: sql
    command: SELECT svr_ip,name,value
    severity: medium
    info: 'Execute the following SQL query to inspect the current SSL client allowlist configuration:

