- id: 4.3.1
  title: Use TDE for At-Rest Data Encryption
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: OceanBase supports table-granularity transparent encryption to achieve secure data storage.
  rationale: Static data is one of the key protection targets for database security. In scenarios where physical storage is
    at risk—such as when hard drives are discarded without proper destruction, backup media is leaked, or shared storage in
    cloud environments is accessed without authorization—unencrypted data can be directly read, leading to severe data breaches.
    Enabling TDE (Transparent Data Encryption) ensures that even if attackers obtain the underlying data files, they cannot
    decipher their contents.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001885732
  page_start: 80
  audit_raw: 'For OceanBase MySQL tenants, use the following statement:

    SHOW PARAMETERS LIKE ''tde_method'';

    If no rows are returned, this recommendation is not satisfied.

    This recommendation is satisfied if the returned value for tde_method is not none (for

    example, internal or bkmi) on all OBServer nodes.

    This recommendation is not satisfied if the returned value for tde_method is none on

    any OBServer node.'
  remediation: 'Execute the following statement to enable transparent encryption using the internal

    method:

    ALTER SYSTEM SET tde_method=''internal'';

    Execute the following statement to confirm that the parameter tde_method is set to

    internal on all OBServer nodes in the tenant:

    SHOW PARAMETERS LIKE ''tde_method'';

    After confirmation, execute the following statement to generate the master key:

    ALTER INSTANCE ROTATE INNODB MASTER KEY;

    Create a tablespace and specify the encryption algorithm.

    Supported encryption algorithms include: aes-256, aes-128, aes-192, sm4-cbc, aes128-gcm, aes-192-gcm, aes-256-gcm, sm4-gcm.
    Use ''y'' to specify the default algorithm

    aes-256.

    CREATE TABLESPACE sectest_ts1 encryption = ''y'';

    When creating a new table, specify the encrypted tablespace to enable encryption. For

    example, create a new table t1:

    CREATE TABLE t1 (id1 int, id2 int) TABLESPACE sectest_ts1;'
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'tde_method';
    severity: medium
    info: 'For OceanBase MySQL tenants, use the following statement:

      SHOW PARAMETERS LIKE ''tde_method'';

      If no rows are returned, this recommendation is not satisfied.

      This recommendation is satisfied if the returned value for tde_method is not none (for

      example, internal or bkmi) on all OBServer nodes.

      This recommendation is not satisfied if the returned value for tde_method is none on

      any OBServer node.'
- id: 4.3.2
  title: Ensure AES Encryption Mode is Configured Correctly
  scoring: manual
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: When using AES_ENCRYPT() and AES_DECRYPT() functions for encryption, it is recommended to use block cipher
    encryption in Cipher Block Chaining (CBC) mode with a 256-bit key length.
  rationale: ''
  impact: Changing block_encryption_mode can cause application compatibility issues for any data previously encrypted using
    a different mode. Applications may be unable to decrypt existing ciphertext unless they continue using the original mode
    and parameters. Coordinate changes with application owners and plan for re-encryption of stored values where necessary.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001889249
  page_start: 83
  audit_raw: 'Use the following command to check whether the current configuration parameter

    block_encryption_mode is set to the default value aes-128-ecb:

    SELECT @@GLOBAL.block_encryption_mode;

    This recommendation is satisfied if the returned value is aes-256-cbc (or another

    organizationally approved strong mode).

    This recommendation is not satisfied if the returned value is a weak/unapproved mode

    (for example, aes-128-ecb) or does not meet the approved standard.'
  remediation: 'To change the instance-level default encryption mode, use:

    SET GLOBAL block_encryption_mode = ''aes-256-cbc'';

    Note:

    • This change applies to new sessions. Existing sessions may continue to use their

    current session value until they reconnect or explicitly set the session variable.

    • Before making this change, verify application compatibility and ensure that any

    required initialization vector (IV) handling is implemented correctly for CBC

    mode.

    Example:

    SET SESSION block_encryption_mode = ''aes-256-cbc'';

    SET @crypt_str = AES_ENCRYPT(''text'', @key_str, @init_vector);

    SELECT AES_DECRYPT(@crypt_str, @key_str, @init_vector);'
  checks:
