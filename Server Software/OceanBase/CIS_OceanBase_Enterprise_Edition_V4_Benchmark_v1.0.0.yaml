controls:
- id: 3.1.1
  title: Backup Strategy in Place
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: A backup strategy should be in place.
  rationale: Backing up OceanBase tenants will help to ensure the availability of data in the event of an incident. Without
    backups, it might be hard to recover from an incident.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-ocp-10000000002169958
  page_start: 33
  audit_raw: 'Verify that a backup strategy exists and is actively configured for OceanBase tenants:

    • If OceanBase Cloud Platform (OCP) is used, review the backup policies and

    schedules configured in OCP for each production tenant. Confirm that backups

    are scheduled at an appropriate frequency (e.g., daily) and that recent successful

    backup jobs are recorded in the OCP job history.

    • If OCP is not deployed, examine organizational documentation (e.g., operations

    runbooks, disaster recovery plans) or database logs to confirm that manual or

    script-based backups (e.g., using obd tools) are performed regularly and verified.

    This recommendation is satisfied if the organization can demonstrate—through OCP

    configuration, backup logs, or documented procedures—that a consistent and

    recoverable backup process is in place for all critical OceanBase tenants.'
  remediation: 'Establish a formal backup strategy aligned with business continuity requirements:

    • Define backup scope (which tenants/databases), frequency, retention period, and

    storage location.

    • If using OCP, configure automated backup policies through the platform’s backup

    management interface.

    • If not using OCP, implement and document a repeatable backup procedure using

    supported OceanBase tools, and schedule it via cron or orchestration systems.

    • Regularly test backup restoration in a non-production environment to validate

    recoverability.

    Note: Backups should be stored securely, preferably on separate storage systems or

    offsite, to protect against site-wide failures.'
  checks:
  - type: manual_review
    info: 'Verify that a backup strategy exists and is actively configured for OceanBase tenants:

      • If OceanBase Cloud Platform (OCP) is used, review the backup policies and

      schedules configured in OCP for each production tenant. Confirm that backups

      are scheduled at an appropriate frequency (e.g., daily) and that recent successful

      backup jobs are recorded in the OCP job history.

      • If OCP is not deployed, examine organizational documentation (e.g., operations

      runbooks, disaster recovery plans) or database '
    severity: medium
- id: 3.1.2
  title: Enable Automatic Major Compaction before Backup
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: Automatic major compaction should be enabled before the backup is scheduled.
  rationale: If automatic major compaction is enabled, a major compaction will be automatically triggered during backup scheduling
    when the backup depends on a major compaction.If automatic major compaction is disabled, automatic major compaction will
    not be triggered during backup scheduling, and this may cause a backup scheduling failure.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-ocp-10000000002169959
  page_start: 35
  audit_raw: 'Review the backup configuration for each OceanBase tenant to confirm that automatic

    major compaction is enabled as part of the backup policy:

    • If the OceanBase Cloud Platform (OCP) is used, examine the tenant-level

    backup settings within OCP and verify that the option to enable automatic major

    compaction (or equivalent setting related to compaction triggering during backup)

    is activated.

    • If OCP is not used, consult the organization’s deployment documentation,

    change records, or operational runbooks to confirm that automatic major

    compaction has been explicitly enabled for all tenants included in backup

    schedules.

    This recommendation is satisfied if there is documented evidence—through OCP

    configuration, operational procedures, or change management records—that automatic

    major compaction is enabled for all tenants subject to scheduled backups.'
  remediation: 'Ensure that automatic major compaction is enabled for all tenants that are configured

    for backup:

    • When using OceanBase Cloud Platform (OCP), update the tenant’s backup

    policy to include automatic major compaction as a prerequisite step.

    • In environments managed without OCP, work with database administrators to

    configure the system to trigger major compaction automatically prior to backup

    execution, in accordance with OceanBase best practices.

    • Document this configuration in the organization’s operational procedures and

    validate that subsequent backup jobs complete successfully.'
  checks:
  - type: manual_review
    info: 'Review the backup configuration for each OceanBase tenant to confirm that automatic

      major compaction is enabled as part of the backup policy:

      • If the OceanBase Cloud Platform (OCP) is used, examine the tenant-level

      backup settings within OCP and verify that the option to enable automatic major

      compaction (or equivalent setting related to compaction triggering during backup)

      is activated.

      • If OCP is not used, consult the organization’s deployment documentation,

      change records, or operational ru'
    severity: medium
- id: 3.1.3
  title: Configure Alert Threshold for Unexpected Backup Events
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: An alert should be triggered when the unexpected backup events occur such as data backup timeout, log backup
    delay or no successful data backup in many days.
  rationale: Alerts for unexpected events can enable timely detection of potential failure events, preventing data loss of
    backup data due to undetected errors.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-ocp-10000000002169959
  page_start: 37
  audit_raw: 'Review the backup alert configuration for each OceanBase tenant to confirm that

    meaningful thresholds are defined and aligned with organizational requirements:

    • If OceanBase Cloud Platform (OCP) is used, examine the tenant-level backup

    policy settings and verify that alert thresholds are configured for the following

    conditions:

    o Data backup timeout

    o Log backup delay

    o Consecutive days without a successful data backup

    • Confirm that the configured thresholds reflect the organization’s operational

    needs—for example, the “days without backup” threshold should not exceed the

    backup frequency, and timeout thresholds should account for typical backup

    durations under normal load.

    This recommendation is satisfied if OCP (or equivalent operational documentation)

    demonstrates that alert thresholds for backup anomalies are explicitly configured, nondefault where necessary, and consistent
    with the organization’s data protection and

    incident response policies.'
  remediation: 'Configure or adjust backup alert thresholds to ensure timely notification of failures:

    • In OceanBase Cloud Platform (OCP), update the tenant’s backup strategy to

    define appropriate alert thresholds based on observed backup behavior and

    business requirements.

    o For Data Backup Timeout, set the threshold to a value greater than the

    typical completion time of recent successful backups (e.g., 1.5× average

    duration).

    o For Log Backup Delay, consider log generation rate and network/storage

    performance when setting the threshold.

    o For Consecutive Days Without Successful Backup, ensure the alert period

    is no longer than the backup scheduling interval (e.g., if backups run daily,

    the alert should trigger within 1–2 days of failure).

    • Document the rationale for selected thresholds in operational runbooks or

    change records.

    • Validate that alerts are delivered to the appropriate monitoring or incident

    management system.'
  checks:
  - type: manual_review
    info: 'Review the backup alert configuration for each OceanBase tenant to confirm that

      meaningful thresholds are defined and aligned with organizational requirements:

      • If OceanBase Cloud Platform (OCP) is used, examine the tenant-level backup

      policy settings and verify that alert thresholds are configured for the following

      conditions:

      o Data backup timeout

      o Log backup delay

      o Consecutive days without a successful data backup

      • Confirm that the configured thresholds reflect the organization’s operatio'
    severity: medium
- id: 3.1.4
  title: Point-in-Time Recovery
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: With clogs it is possible to implement point-in-time recovery. This makes it possible to restore the changes
    between the last full backup and the point-in-time. The clogs need to be backed up with data backup. The restore procedure
    should be created and tested.
  rationale: Using clogs can reduce the amount of information lost when recovering from a backup.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-ocp-10000000002169959
  page_start: 39
  audit_raw: 'Verify that clog (log) backup is enabled and that a restore procedure exists:

    • If OceanBase Cloud Platform (OCP) is used, review the tenant-level backup

    configuration and confirm that log backup is explicitly enabled as part of the

    backup strategy.

    • Additionally, examine operational documentation or disaster recovery plans to

    confirm that a point-in-time recovery procedure has been defined and tested

    within the past 12 months (or per organizational policy).

    This recommendation is satisfied if log backup is enabled for all critical tenants and

    there is documented evidence of a tested restore procedure that demonstrates

    successful point-in-time recovery using clog backups.'
  remediation: 'Enable clog backup and establish a recovery validation process:

    • In OceanBase Cloud Platform (OCP), modify the tenant’s backup policy to

    enable the Log Backup feature. Ensure the log backup destination is reliable and

    monitored.

    • Develop a formal point-in-time recovery procedure that outlines how to restore

    from a full backup and replay clogs to a specified timestamp.

    • Conduct periodic recovery drills (e.g., quarterly or annually) to validate that PITR

    works as expected and meets business continuity requirements.

    • Document the procedure, test results, and any lessons learned in the

    organization’s operational knowledge base.'
  checks:
  - type: manual_review
    info: 'Verify that clog (log) backup is enabled and that a restore procedure exists:

      • If OceanBase Cloud Platform (OCP) is used, review the tenant-level backup

      configuration and confirm that log backup is explicitly enabled as part of the

      backup strategy.

      • Additionally, examine operational documentation or disaster recovery plans to

      confirm that a point-in-time recovery procedure has been defined and tested

      within the past 12 months (or per organizational policy).

      This recommendation is satisfied if '
    severity: medium
- id: 3.1.5
  title: Verify Backups are Good
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: Backups should be validated on a regular basis.
  rationale: Verifying that backups are occurring appropriately will help ensure data availability in the event of an incident.
    Without a well-tested backup, it might be hard to recover from an incident if the backup procedure contains errors or
    doesn't include all required data.
  impact: ''
  references:
  - 1. https://en.oceanbase.com/docs/common-ocp-10000000001554238
  page_start: 41
  audit_raw: 'Review evidence that backup validation is performed systematically:

    • Examine backup validation or recovery test reports from the past 12 months (or

    per organizational policy). These may include:

    o Test plans and execution records from OceanBase Control Platform

    (OCP) recovery sampling tasks;

    o Screenshots, logs, or audit trails showing successful restore operations;

    o Post-test summaries confirming data consistency and application

    functionality.

    • If OCP is used, confirm that recovery sampling tasks are configured and have

    executed successfully within the review period.

    This recommendation is satisfied if the organization maintains documented evidence of

    regular backup validation activities that demonstrate successful restoration of

    OceanBase tenant data using current backup sets.'
  remediation: 'Establish a formal backup validation program:

    • Implement regular recovery sampling tasks via OceanBase Cloud Platform

    (OCP), scheduled at intervals aligned with business risk (e.g., quarterly for critical

    systems).

    • Ensure each test includes:

    o Restoration of a representative tenant or dataset;

    o Verification of data completeness and consistency;

    o Validation that applications can operate correctly on the restored data.

    • Document test results, including success/failure status, issues encountered, and

    remediation actions.

    • Retain validation records for audit and continuous improvement purposes.'
  checks:
  - type: manual_review
    info: 'Review evidence that backup validation is performed systematically:

      • Examine backup validation or recovery test reports from the past 12 months (or

      per organizational policy). These may include:

      o Test plans and execution records from OceanBase Control Platform

      (OCP) recovery sampling tasks;

      o Screenshots, logs, or audit trails showing successful restore operations;

      o Post-test summaries confirming data consistency and application

      functionality.

      • If OCP is used, confirm that recovery sampling '
    severity: medium
- id: 3.2.1
  title: Limit Accepted Transport Layer Security (TLS) Versions
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: OceanBase supports multiple protocols of TLS. The higher the version the stronger the security and/or better
    the performance.
  rationale: Requiring clients attempting to connect to OceanBase to use higher versions of TLS to better protect data in
    transit.
  impact: Connections attempting to use an unsupported version of TLS or Cipher will fail.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001887759
  page_start: 44
  audit_raw: 'Determine the minimum TLS version enforced by the OceanBase server:

    1. Execute the following SQL query as a user with system view access:

    SELECT svr_ip,name,value

    FROM oceanbase.GV$OB_PARAMETERS

    WHERE name=''sql_protocol_min_tls_version'';

    2. Review the returned value of the sql_protocol_min_tls_version parameter:

    • The configuration is compliant if the value is explicitly set to TLSv1.2, TLSv1.3,

    or a higher TLS version supported by the system.

    • The configuration is non-compliant if the value is TLSv1, TLSv1.1, or if the

    parameter is not configured (in which case the system permits connections using

    insecure legacy TLS versions by default).

    This recommendation is satisfied only if sql_protocol_min_tls_version is explicitly

    set to TLSv1.2 or higher on all observer nodes.'
  remediation: 'Set the system parameter to require TLSv1.2 or higher:

    ALTER SYSTEM SET sql_protocol_min_tls_version = ''TLSv1.2'';'
  checks:
  - type: sql
    command: SELECT svr_ip,name,value
    severity: medium
    info: 'Determine the minimum TLS version enforced by the OceanBase server:

      1. Execute the following SQL query as a user with system view access:

