- id: 5.3.1
  title: Use TDE for At-Rest Data Encryption
  scoring: manual
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: Transparent Data Encryption (TDE) at-rest encryption protects your critical data by enabling data-at-rest encryption
    in the database. It protects the privacy of your information, prevents data breaches and helps meet regulatory requirements.
  rationale: File system based encryption does a good job of protecting against data theft on devices unable to limit physical
    access. It does not, however, protect against users who have or gain access to the operating system, backups, over the
    network copies, etc. Encrypting data from database adds an additional layer of data protection.
  impact: ''
  references: []
  page_start: 114
  audit_raw: 'Check for the tables of at-rest encryption enabled.

    SELECT TABLE_NAME, ENCRYPTED FROM V$OB_ENCRYPTED_TABLES;

    If no line returned or return ''NO'', it indicate at-rest encryption is not enabled.'
  remediation: 'Remediate this setting by executing the following SQL statements to enable TDE for

    tables according to the organization requirements:

    1. Create a tablespace and specify the encryption algorithm.

    CREATE TABLESPACE &lt;tablespace_name&gt; ENCRYPTION USING ''&lt;encryption

    algorithm&gt;''

    2. Move the unencrypted table to the tablespace.

    ALTER TALBE &lt;table_name&gt; TABLESPACE &lt;tablespace_name&gt;;

    3. Perform a full compaction on the table.

    ALTER TABLE &lt;table_name&gt; set progressive_merge_num=1;

    ALTER SYSTEM MAJOR FREEZE;

    NOTE: OceanBase supports the following encryption algorithms: aes-256, aes-128,

    aes-192, sm4-cbc, aes-128-gcm, aes-192-gcm, aes-256-gcm, and sm4-gcm.'
  checks:
  - type: sql
    command: SELECT TABLE_NAME, ENCRYPTED FROM V$OB_ENCRYPTED_TABLES;
    severity: medium
    info: 'Check for the tables of at-rest encryption enabled.

      SELECT TABLE_NAME, ENCRYPTED FROM V$OB_ENCRYPTED_TABLES;

      If no line returned or return ''NO'', it indicate at-rest encryption is not enabled.'
