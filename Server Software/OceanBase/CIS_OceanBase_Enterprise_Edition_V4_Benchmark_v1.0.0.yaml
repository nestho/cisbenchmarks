- id: 4.1.2
  title: Disable creating accounts via the GRANT statement
  scoring: scored
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: When using the GRANT statement, if the target user does not exist, the system will attempt to create the user.
    This may lead to unintentional creation of a user with an empty password when the GRANT statement contains errors, introducing
    account management risks. Enabling the NO_AUTO_CREATE_USER setting in the sql_mode configuration option can prevent the
    GRANT statement from creating users.
  rationale: Allowing the GRANT statement to automatically create users is an implicit behavior that poses significant security
    risks in production environments. For example, if an administrator misspells a username during privilege assignment, the
    system will automatically create a new user—potentially with no password or using default settings—resulting in unintended
    privilege grants that could be exploited maliciously. Additionally, auto-created users may bypass organizational account
    provisioning processes and audit mechanisms, violating compliance requirements. Enabling the NO_AUTO_CREATE_USER mode
    enforces explicit user creation beforehand, improving control and security in user account management.
  impact: After enabling NO_AUTO_CREATE_USER, any attempt to create a non-existent user via the GRANT statement will fail
    and return an error message. Therefore, all authorization operations must ensure the target user already exists. This
    directly impacts operational processes that rely on automated scripts for user authorization, requiring scripts to first
    call CREATE USER to explicitly create the user before executing GRANT to assign privileges. It is recommended to conduct
    a comprehensive review and adaptation of existing scripts prior to this change.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001887483
  page_start: 57
  audit_raw: 'Execute the following SQL statements to evaluate whether the configuration is correct:

    SELECT @@global.sql_mode;

    SELECT @@session.sql_mode;

    Ensure that the result of each query contains the NO_AUTO_CREATE_USER option'
  remediation: 'Use an administrator account with SUPER privilege to execute the following SQL:

    SET @@global.sql_mode=CONCAT(@@global.sql_mode, '',NO_AUTO_CREATE_USER'');'
  checks:
  - type: manual_review
    info: 'Execute the following SQL statements to evaluate whether the configuration is correct:

      SELECT @@global.sql_mode;

      SELECT @@session.sql_mode;

      Ensure that the result of each query contains the NO_AUTO_CREATE_USER option'
    severity: medium
- id: 4.1.3
  title: Ensure Password Complexity Policies are in Place
  scoring: scored
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: 'OceanBase MySQL tenants support configuring password complexity policies through tenant-level system variables.
    Enabling password complexity policies helps prevent weak password usage and raises the bar for password cracking. Variable
    Name Function validate_password_check_user_name Checks whether a user''s password can be the same as the username.<br>-
    on: Password cannot be the same as the username.<br>- off: Password can be the same as the username. validate_password_length
    Sets the minimum length for user passwords. validate_password_mixed_case_count Sets the minimum number of uppercase and
    lowercase letters that the password must contain. validate_password_number_count Sets the minimum number of digits that
    the password must contain. validate_password_policy Sets the password complexity policy.<br>- low: Only checks password
    length.<br>- medium: Checks password length, uppercase letters, lowercase letters, digits, special characters, and whether
    the password is the same as the username. validate_password_special_char_count Sets the minimum number of special characters
    that the password must contain.'
  rationale: Complex passwords help defend against dictionary attacks, brute-force cracking, and other types of password-based
    attacks. This recommendation prevents users from choosing weak, easily guessable passwords, significantly enhancing account
    security. By enforcing a strong password policy that requires a combination of character types (uppercase, lowercase,
    digits, and special characters), the risk of unauthorized access is effectively reduced.
  impact: Enabling and enforcing password complexity policies may cause existing operational workflows to fail when they attempt
    to set or reset passwords that do not meet the configured requirements. This can impact user provisioning, password rotation
    processes, and automation scripts (for example, CI/CD jobs or application deployment scripts) that create database accounts
    or change passwords. Administrators may need to update procedures and tooling to generate compliant passwords, and helpdesk/support
    processes may see an increase in password-related change requests after enforcement.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001888309
  page_start: 59
  audit_raw: 'Use the following SQL statements to view the current password complexity

    configuration for the tenant:

    SHOW VARIABLES LIKE "validate_password%";

    The result set should show settings that meet or exceed the following recommended

    baseline:

    • validate_password_length is 14 or more

