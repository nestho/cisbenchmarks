- id: 4.1.4
  title: Do Not Reuse Usernames
  scoring: manual
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: Each database user account should be assigned a unique purpose (e.g., dedicated to a specific individual or
    application) and should not be shared among multiple different applications or users.
  rationale: Sharing accounts expands the scope of security risks. Once a shared account is compromised, all applications
    and services using that account will be exposed to threats.
  impact: Enforcing non-shared, purpose-specific accounts may require changes to application configuration, connection strings,
    secrets management, and operational runbooks. Rotating from a shared account to dedicated accounts can increase the number
    of database users to manage and may require updating privilege grants, auditing rules, and deployment automation. If shared
    accounts are disabled before all dependencies are updated, applications or jobs that still rely on the shared credentials
    may fail to connect.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001889160
  - 2. https://en.oceanbase.com/docs/common-oceanbase-database10000000001889159
  page_start: 63
  audit_raw: 'This recommendation requires a manual review to map database accounts to real-world

    owners (applications or individuals) and to confirm that accounts are not shared.

    1. Obtain a list of non-reserved (non-system) users:

    SELECT User, Host

    FROM mysql.user

    WHERE User NOT IN (''root'',''ORAAUDITOR'',''proxyro'');

    2. For each returned account, review with the DBA team, system architects, and

    application owners to determine:

    • the account owner (application/service name or individual),

    • the business purpose of the account,

    • whether the same username is used by more than one application or person.

    The recommendation is satisfied if each non-reserved account has a single documented

    owner and purpose and is not used by multiple applications or users.'
  remediation: '1. List text hereCreate dedicated accounts for each application/user:

    CREATE USER ''app1_user''@''10.%'' IDENTIFIED BY ''Strong_Password_Here'';

    CREATE USER ''app2_user''@''10.%'' IDENTIFIED BY ''Strong_Password_Here'';

    2. List text hereGrant only the required privileges (examples; adjust to your schema

    and least-privilege requirements):

    GRANT SELECT, INSERT, UPDATE, DELETE ON app1_db.* TO ''app1_user''@''10.%'';

    GRANT SELECT ON app2_db.* TO ''app2_user''@''10.%'';

    3. Migrate applications to the new dedicated accounts, then disable or remove the

    shared account.

    • Disable (lock) the shared account (preferred first step if supported):

    ALTER USER ''shared_user''@''%'' ACCOUNT LOCK;

    • Optionally expire credentials to force reset (if supported):

    ALTER USER ''shared_user''@''%'' PASSWORD EXPIRE;

    • After confirming it is no longer used, drop the shared account:

    DROP USER ''shared_user''@''%'';

    4. Verify:

    SELECT User, Host

    FROM mysql.user

    WHERE User IN (''shared_user'',''app1_user'',''app2_user'');'
  checks:
  - type: sql
    command: SELECT User, Host
    severity: medium
    info: 'This recommendation requires a manual review to map database accounts to real-world

      owners (applications or individuals) and to confirm that accounts are not shared.

      1. Obtain a list of non-reserved (non-system) users:

      SELECT User, Host

      FROM mysql.user

      WHERE User NOT IN (''root'',''ORAAUDITOR'',''proxyro'');

      2. For each returned account, review with the DBA team, system architects, and

      application owner'
- id: 4.1.5
  title: Configure account locking after consecutive authentication failures
  scoring: manual
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: OceanBase MySQL tenants support using the tenant-level configuration parameter connection_control_failed_connections_threshold
    to specify the threshold for failed login attempts. Accounts exceeding this threshold will be locked, and the lock duration
    can be set via the parameters connection_control_min_connection_delay and connection_control_max_connection_delay. This
    helps prevent brute-force attacks on account passwords and enhances database security.
  rationale: Brute-force attacks and automated password guessing are common database intrusion methods, where attackers use
    scripts to repeatedly attempt common password combinations to gain access to legitimate accounts. Enabling a login failure
    attempt limit significantly increases the difficulty and time cost of such attacks, disrupting automated attack processes.
    By setting appropriate failure thresholds and connection delay strategies, password brute-force attempts can be effectively
    prevented without impacting normal user operations.
  impact: Enabling login failure controls can introduce connection delays or temporary lockout-like behavior for users/applications
    that repeatedly authenticate with incorrect credentials (for example, outdated passwords in configuration files, connection
    pools, or secret stores). This may cause increased authentication latency and can disrupt automated jobs until credentials
    are corrected. Care should be taken to tune the threshold and delay values to avoid unintended denial-of-service conditions
    for legitimate users.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001888311
  page_start: 66
  audit_raw: 'Execute the following statement to review the current tenant parameter configuration:

    SHOW PARAMETERS LIKE ''connection_control%'';

    This recommendation is satisfied if the result set shows that

    connection_control_failed_connections_threshold is not 0 and the configured

    values for connection_control_min_connection_delay and

    connection_control_max_connection_delay meet organizational policy.

    This recommendation is not satisfied if

    connection_control_failed_connections_threshold is 0, or if the threshold and

    delay values do not meet organizational policy.'
  remediation: '1. Configure login failure controls by setting the threshold to 5 (or fewer) failed

    attempts and appropriate delays (delay units are milliseconds, adjust values to

    organizational policy):

    ALTER SYSTEM SET connection_control_failed_connections_threshold = 5;

    ALTER SYSTEM SET connection_control_min_connection_delay = 86400000;

    ALTER SYSTEM SET connection_control_max_connection_delay = 86400001;

    2. Verify:

    SHOW PARAMETERS LIKE ''connection_control%'';'
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'connection_control%';
    severity: medium
    info: 'Execute the following statement to review the current tenant parameter configuration:

      SHOW PARAMETERS LIKE ''connection_control%'';

      This recommendation is satisfied if the result set shows that

      connection_control_failed_connections_threshold is not 0 and the configured

      values for connection_control_min_connection_delay and

      connection_control_max_connection_delay meet organizational policy.

      This reco'
- id: 4.1.6
  title: Set 'default_password_lifetime' to Require a Yearly Password Change
  scoring: manual
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: The system parameter default_password_lifetime can be used to configure the global password expiration period
    for OceanBase tenant users. After a password expires, it must be reset before any further operations can be performed.
    Configuring a password expiration period enhances operational security and system compliance, reducing the risks associated
    with password leakage.
  rationale: The default_password_lifetime global variable prevents passwords from being set to never expire. Overly frequent
    password expiration imposes more harm than benefit, as it encourages users to choose predictable passwords, such as sequential
    words or numbers that are easily guessed. More importantly, when a security incident occurs that may compromise passwords,
    account passwords should be expired immediately. It is recommended to set the password expiration period to 365 days.
  impact: Enabling password expiration requires users and applications to update credentials periodically. This may impact
    unattended scripts, batch jobs, application connection pools, and any services that store database passwords, and can
    result in authentication failures if password rotation processes are not in place. Operational procedures should include
    coordinated password rotation and an emergency password reset process for compromised accounts.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001887412
  page_start: 68
  audit_raw: 'Execute the following SQL statement to determine the configured password expiration

    period:

    SELECT @@default_password_lifetime;

    This recommendation is satisfied if the returned value is set to the approved standard

    (for example, 365) and is not 0.

    This recommendation is not satisfied if the returned value is 0 (passwords never expire)

    or does not match the approved standard.'
  remediation: '1. Set the password expiration period to the approved standard:

    SET GLOBAL default_password_lifetime = 365;

    2. Verify:

    SELECT @@default_password_lifetime;'
  checks:
  - type: manual_review
    info: 'Execute the following SQL statement to determine the configured password expiration

      period:

      SELECT @@default_password_lifetime;

      This recommendation is satisfied if the returned value is set to the approved standard

      (for example, 365) and is not 0.

      This recommendation is not satisfied if the returned value is 0 (passwords never expire)

      or does not match the approved standard.'
    severity: medium
- id: 4.1.7
  title: Ensure No Users Have Wildcard Hostnames
  scoring: scored
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  description: All user accounts in the database should be strictly restricted to connect only from specific hosts or IP addresses
    explicitly required for their business operations.
  rationale: 'The core rationale for this recommendation is the principle of least privilege and defense in depth at the network
    level. 1. Limit attack sources: If a user''s credentials (password) are compromised, but the account is restricted to
    connect only from a specific application server IP, an attacker who obtains the password still cannot access the database
    from unauthorized locations. 2. Reduce attack surface: If a user is configured as ''user''@''%'', attackers can attempt
    connections to the database from any location. Restricting the host/IP range significantly reduces the potential avenues
    for attack.'
  impact: Restricting accounts that currently use wildcard hosts (for example, 'user'@'%') may require application and operational
    changes, such as updating connection configurations, DNS records, or adding new host-specific accounts. If an application
    connects from multiple servers (for example, a pool of app nodes or CI runners), restricting the host too narrowly can
    cause authentication failures. Plan and validate all legitimate source hosts before applying changes.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001889545
  page_start: 70
  audit_raw: 'Execute the following SQL query to identify accounts that are allowed to connect from

    any host:

    SELECT user, host

    FROM mysql.user

    WHERE host = ''%'';

    No rows will be returned if no accounts are configured with a wildcard host (''%'').

    If one or more rows are returned, at least one account allows connections from any

    host, and this recommendation is not satisfied.'
  remediation: 'For each user found in the audit step using the ''%'' host, immediate remediation should

    be performed. Use the RENAME USER command (or ALTER USER, depending on the

    specific operation) to change the user''s host from ''%'' to the specific IP or hostname

    identified in the previous step.

    RENAME USER ''app_user''@''%'' TO ''app_user''@''10.1.2.3'';'
  checks:
  - type: sql
    command: SELECT user, host
    severity: medium
    info: 'Execute the following SQL query to identify accounts that are allowed to connect from

      any host:

      SELECT user, host

      FROM mysql.user

      WHERE host = ''%'';

      No rows will be returned if no accounts are configured with a wildcard host (''%'').

      If one or more rows are returned, at least one account allows connections from any

      host, and this recommendation is not satisfied.'
