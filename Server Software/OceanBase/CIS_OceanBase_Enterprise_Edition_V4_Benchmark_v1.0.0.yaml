      • The configuration is non-compliant if the value is set to '
- id: 3.2.3
  title: Limit Accepted TLS Versions
  scoring: scored
  profile:
  - Level 2 -OceanBase RDBMS on Linux
  - Level 1 - OceanBase RDBMS on Linux
  description: OceanBase supports communication encryption to ensure that traffic between nodes cannot be eavesdropped or
    tampered with. The replication traffic between servers in OceanBase cluster should be secured. Security measures should
    include ensuring the confidentiality and integrity of the traffic, and performing mutual authentication between the servers
    before performing replication.
  rationale: Require clients attempting to connect to MySQL to use a higher version of TLS, to better protect data in transit.
    Disabling older versions known to have security vulnerabilities (such as TLS 1.0 and TLS 1.1) can effectively prevent
    downgrade attacks and man-in-the-middle attacks, ensuring the confidentiality and integrity of communications. The replication
    traffic should be secured as it gives access to all transferred information and might leak passwords.
  impact: Restricting the minimum accepted TLS version can break connectivity for legacy clients, drivers, middleware, or
    monitoring tools that only support TLS 1.0/1.1. After enforcement, such clients may fail to connect until they are upgraded
    or reconfigured to use TLS 1.2 or higher. Validate client compatibility and coordinate changes across application teams
    before applying this setting. When the replication traffic is not secured someone might be able to capture the sensitive
    information when sent to the replica.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001885736
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001971490
  page_start: 48
  audit_raw: 'Execute the following command to view the current specified TLS version:

    SHOW PARAMETERS LIKE ''sql_protocol_min_tls_version'';

    This recommendation is satisfied if the returned value for

    sql_protocol_min_tls_version is set to TLSv1.2 or TLSv1.3 on all OBServer

    nodes.

    This recommendation is not satisfied if the returned value is none, any, TLSv1, or

    TLSv1.1, or if the value differs across OBServer nodes.

    Verify that mutual authentication and TLS are enforced for inter-node communication:

    1. Confirm that mutual SSL authentication is required for clients (including other

    observer nodes):

    SELECT svr_ip,name,value  FROM oceanbase.GV$OB_PARAMETERS  WHERE

    name=''ssl_client_authentication'';

    • Compliant if value = ''True''.

    • Non-compliant if value = ''False'' or not set.

    2. Confirm that the RPC authentication method enforces SSL-based identity

    verification:

    SELECT svr_ip,name,value  FROM oceanbase.GV$OB_PARAMETERS  WHERE

    name=''rpc_server_authentication_method'';

    • Compliant if value = ''SSL_NO_ENCRYPT'' and SSL certificates are properly

    deployed on all observer nodes.

    • Non-compliant if value = ''ALL'' or any setting that permits unauthenticated or

    non-SSL connections.

    This recommendation is satisfied only when both parameters are correctly configured

    AND valid SSL certificates are installed on all observer nodes, enabling encrypted,

    mutually authenticated replication traffic.'
  remediation: 'Currently, OceanBase supports TLSv1.2 and TLSv1.3. After specifying the TLS version,

    if a connection uses SSL encryption, it will use the specified version or a higher

    supported version. Example setting the minimum version to TLSv1.2:

    ALTER SYSTEM SET sql_protocol_min_tls_version = ''TLSv1.2'';

    Secure the replication traffic by enabling TLS-based confidentiality, integrity, and mutual

    authentication between servers.

    Perform the following steps to remediate this setting:

    1. Specify the minimum SSL/TLS protocol version to ensure strong encryption:

    ALTER SYSTEM SET sql_protocol_min_tls_version = ''TLSv1.2'';

    2. Enable SSL client authentication to require cryptographic verification of

    connecting nodes:

    ALTER SYSTEM SET ssl_client_authentication = True;

    3. Set the server authentication method to enforce SSL-based identity validation:

    ALTER SYSTEM SET rpc_server_authentication_method = ''SSL_NO_ENCRYPT'';

    Note: Although setting the server authentication method to ALL (e.g., ALTER SYSTEM

    SET rpc_server_authentication_method = ''ALL'';) permits multiple authentication

    mechanisms, it allows unauthenticated plaintext connections, which introduces

    significant security risks. This configuration is not recommended in production

    environments.'
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'sql_protocol_min_tls_version';
    severity: medium
    info: 'Execute the following command to view the current specified TLS version:

      SHOW PARAMETERS LIKE ''sql_protocol_min_tls_version'';

      This recommendation is satisfied if the returned value for

      sql_protocol_min_tls_version is set to TLSv1.2 or TLSv1.3 on all OBServer

      nodes.

      This recommendation is not satisfied if the returned value is none, any, TLSv1, or

      TLSv1.1, or if the value differs across OBServer no'
- id: 4.1.1
  title: Ensure Passwords are Set for All OceanBase Accounts
  scoring: scored
  profile:
  - Level 1 - OceanBase RDBMS on Linux
  description: If any account exists without a password (i.e., a null-password account), it reduces the attack cost—attackers
    only need to guess the username correctly to gain access without requiring a password. Therefore, it is essential to ensure
    that all OceanBase accounts are configured with passwords to prevent unauthorized malicious users from accessing the database.
  rationale: Password is one of the core elements of authentication. If an account has no password, authentication is reduced
    to an authorization check based solely on "who you are (username)" and "where you are connecting from (host)". This removes
    the most critical security barrier, allowing any attacker with network access to gain entry to the database simply by
    guessing or knowing the username.
  impact: After enabling this setting, accounts that previously allowed passwordless login will require password authentication.
    This directly impacts operational processes that rely on automated scripts for user login, necessitating the addition
    of password-based login logic within the scripts.
  references:
  - 1. https://en.oceanbase.com/docs/common-oceanbase-database10000000001888551
  page_start: 55
  audit_raw: 'Use the following statements to query internal OB Server system tables to check for

    accounts with empty passwords:

    SELECT user, password FROM mysql.user WHERE LENGTH(password)=0;

    SELECT user_id, user_name, passwd FROM oceanbase.__all_user WHERE

    LENGTH(passwd)=0;

    No rows will be returned if all OceanBase accounts have a password set.

    If either query returns one or more rows, at least one account has an empty password.'
  remediation: 'Database administrators can use the following statement to set a password for a

    password-less account:

    SET PASSWORD FOR u0 = PASSWORD(''auth_string'');'
  checks:
  - type: sql
    command: SELECT user, password FROM mysql.user WHERE LENGTH(password)=0;
    severity: medium
    info: 'Use the following statements to query internal OB Server system tables to check for

      accounts with empty passwords:

