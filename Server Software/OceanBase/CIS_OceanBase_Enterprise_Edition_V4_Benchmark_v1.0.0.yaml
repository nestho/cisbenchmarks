  description: The unnecessary privileges should be revoked from default public role to minimize security risks and adhere
    to the principle of least privilege.
  rationale: The privileges must be structured to block unauthorized use and/or corruption of vital data and services by setting
    restrictions on user capabilities, particularly those of the role PUBLIC. Such security measures help to ensure successful
    logins cannot be easily redirected.
