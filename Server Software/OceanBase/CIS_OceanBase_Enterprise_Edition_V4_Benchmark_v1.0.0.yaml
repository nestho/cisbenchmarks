  impact: Enabling database auditing can increase disk usage and I/O due to audit record generation and retention. It may
    also introduce additional CPU overhead for highthroughput workloads. Audit data must be protected (access control), monitored,
    and retained according to compliance requirements to avoid excessive growth or leakage of sensitive information contained
