  audit_raw: "Execute the following YSQL statement:\nyugabyte=# show log_timezone;\n log_timezone\n--------------\n UTC\n\
    (1 row)\nIf log_timezone is not set to GMT, UTC, or as defined by your organization's logging policy\nthis is a fail.\n\
    Execute the following YSQL statement to verify pgAudit is enabled:\nyugabyte=# show shared_preload_libraries ;\n     \
    \          shared_preload_libraries\n-------------------------------------------------------\n pg_stat_statements,yb_pg_metrics,pgaudit,pg_hint_plan\n\
    (1 row)\nIf the output does not contain pgaudit, this is a fail.\nNext, verify that desired auditing components are enabled:\n\
    yugabyte=# show pgaudit.log;\n pgaudit.log\n-------------\n none\n(1 row)\nIf the output does not contain the desired\
    \ auditing components, this is a fail.\nThe list below summarizes pgAudit.log components:\nREAD: SELECT and COPY when\
    \ the source is a relation or a query.\nWRITE: INSERT, UPDATE, DELETE, TRUNCATE, and COPY when the destination is a relation.\n\
    FUNCTION: Function calls and DO blocks.\nROLE: Statements related to roles and privileges: GRANT, REVOKE, CREATE/ALTER/DROP\n\
    ROLE.\nDDL: All DDL that is not included in the ROLE class.\nMISC: Miscellaneous commands, e.g. DISCARD, FETCH, CHECKPOINT,\
    \ VACUUM.\nRun the following command to verify whether auditing is enabled on the YCQL interface\nof the YugabyteDB server.\n\
    cat ts.config | grep ycql_enable_audit_log\nIf not configured to true, this is a fail.\nLog in as an Operating System\
    \ user authorized to escalate privileges and test the sudo\ninvocation by executing the following:\nwhoami user1\n# groups\
    \ user1\n# sudo su - yugabyte\n[sudo] password for user1:\nuser1 is not in the sudoers file. This incident will be reported.\n\
    As shown above, user1 has not been added to the /etc/sudoers file or made a member\nof any group listed in the /etc/sudoers\
    \ file. Whereas:\n# whoami user2\n# groups user2 dba\n# sudo su - yugabyte [sudo] password for user2:\n# whoami\nyugabyte\n\
    This shows that the user2 user is configured properly for sudo access by being a\nmember of the dba group.\nFirst, inspect\
    \ the privileges granted to the database superuser (identified here as\nyugabyte) using the display command ysqlsh -c\
    \ \"\\du yugabyte\" to establish a baseline\nfor granted administrative privileges. Based on the output below, the yugabyte\n\
    superuser can create roles, create databases, manage replication, and bypass rowlevel security (RLS):\n# whoami\nyugabyte\n\
    # ysqlsh -c \"\\du yugabyte\"\nNow, let's inspect the same information for a mock regular user called appuser using\n\
    the display command ysqlsh -c \"\\du appuser\". The output confirms that regular user\nappuser has the same elevated privileges\
    \ as system administrator user yugabyte. This\nis a fail.\nWhile this example demonstrated excessive administrative privileges\
    \ granted to a single\nuser, a comprehensive audit should be conducted to inspect all database users for\nexcessive administrative\
    \ privileges. This can be accomplished via either of the\ncommands below.\n# whoami\nyugabyte\n# ysqlsh -c \"\\du *\"\n\
    # ysqlsh -c \"select * from pg_user order by usename\"\nNOTE Using \\du * will show all the default YugabyteDB roles (e.g.\
    \ pg_monitor) as well\nas any 'normal' roles. This is expected, and should not be cause for alarm.\nFunctions in YugabyteDB\
    \ can be created with the SECURITY DEFINER option. When\nSECURITY DEFINER functions are executed by a user, said function\
    \ is run with the\nprivileges of the user who created it, not the user who is running it.\nTo list all functions that\
    \ have SECURITY DEFINER, run the following YSQL:\n# whoami root\n# sudo su - yugabyte\n# ysqlsh -c \"SELECT nspname, proname,\
    \ proargtypes, prosecdef, rolname,\nproconfig FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid\
    \ a ON a.oid = p.proowner WHERE prosecdef OR NOT proconfig IS NULL;\"\nIn the query results, a prosecdef value of 't'\
    \ on a row indicates that that function uses\nprivilege elevation.\nIf elevation privileges are utilized which are not\
    \ required or are expressly forbidden by\norganizational guidance, this is a fail.\nTo audit excessive DML privileges,\
    \ take an inventory of all users defined in the cluster\nusing the \\du+ * YSQL command, as well as all tables defined\
    \ in the database using\nthe \\dt *.* YSQL command. Furthermore, the intersection matrix of tables and user\ngrants can\
    \ be obtained by querying system catalogs pg_tables and pg_user. Note that\nin YugabyteDB, users are defined cluster-wide\
    \ across all databases, while schemas\nand tables are specific to a particular database. Therefore, the commands below\
    \ should\nbe executed for each defined database in the cluster. With this information, inspect\ndatabase table grants\
    \ and determine if any are excessive for defined database users.\nyugabyte=# -- display all users defined in the cluster\n\
    yugabyte=# \\x Expanded display is on.\nyugabyte=# \\du+ *\nList of roles\n-[ RECORD 1 ]\nRole name | pg_database_owner\
    \ Attributes | Cannot login Member of |\n{}\nDescription |\n-[ RECORD 2 ]\nRole name | pg_execute_server_program Attributes\
    \ | Cannot login\nMember of | {} Description |\n-[ RECORD 3 ]\nRole name | pg_monitor Attributes | Cannot login\nMember\
    \ of | {pg_read_all_settings,pg_read_all_stats,pg_stat_scan_tables}\nDescription |\n-[ RECORD 4 ]\nRole name | pg_read_all_data\
    \ Attributes | Cannot login Member of |\n{}\nDescription |\n-[ RECORD 5 ]\nRole name | pg_read_all_settings Attributes\
    \ | Cannot login\nMember of | {} Description |\n-[ RECORD 6 ]\nRole name | pg_read_all_stats Attributes | Cannot login\
    \ Member of |\n{}\nDescription |\n-[ RECORD 7 ]\nRole name | pg_read_server_files Attributes | Cannot login\nMember of\
    \ | {} Description |\n-[ RECORD 8 ]\nRole name | pg_signal_backend Attributes | Cannot login Member of |\n{}\nDescription\
    \ |\n-[ RECORD 9 ]\nRole name | pg_stat_scan_tables Attributes | Cannot login\nMember of | {} Description |\n-[ RECORD\
    \ 10 ]\nRole name | pg_write_all_data Attributes | Cannot login Member of |\n{}\nDescription |\n-[ RECORD 11 ]\nRole name\
    \ | pg_write_server_files Attributes | Cannot login\nMember of | {} Description |\n-[ RECORD 12 ]\nRole name | postgres\n\
    Attributes | Superuser, Create role, Create DB, Replication, Bypass RLS\nMember of | {}\nDescription |\nyugabyte=# --\
    \ display all schema.tables created in current database\nyugabyte=# \\x\nExpanded display is off. postgres=# \\dt+ *.*\n\
    List of relations\n|  | | | | |Descr- Schema | Name\n |Type | Owner |Persistence| Size |iption\n  + + + + + +\ninformation_schema|sql_features\
    \ |table|postgres| permanent |104 kB|\ninformation_schema|sql_ |table|postgres| permanent |48 kB |\nyugabyte=# -- query\
    \ all tables and user grants in current database yugabyte=#\n-- the system catalogs 'information_schema' and 'pg_catalog'\
    \ are excluded\nyugabyte=# select t.schemaname, t.tablename, u.usename,\nhas_table_privilege(u.usename, t.tablename, 'select')\
    \ as select,\nhas_table_privilege(u.usename, t.tablename, 'insert') as insert,\nhas_table_privilege(u.usename, t.tablename,\
    \ 'update') as update,\nhas_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom pg_tables t, pg_user u\n\
    where t.schemaname not in ('information_schema','pg_catalog');\nschemaname | tablename | usename | select | insert | update\
    \ | delete\n  + + + + + +  (0 rows)\nFor the example below, we illustrate using a single table customer and two application\n\
    users appwriter and appreader. The intention is for appwriter to have full select, insert,\nupdate, and delete rights\
    \ and for appreader to only have select rights. We can query\nthese privileges with the example below using the has_table_privilege\
    \ function and\nfiltering for just the table and roles in question.\nyugabyte=# select t.tablename, u.usename, has_table_privilege(u.usename,\n\
    t.tablename, 'select') as select, has_table_privilege(u.usename, t.tablename,\n'insert') as insert, has_table_privilege(u.usename,\
    \ t.tablename, 'update') as\nupdate, has_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom pg_tables t,\
    \ pg_user u where t.tablename = 'customer'\nand u.usename in ('appwriter','appreader');\ntablename | usename | select\
    \ | insert | update | delete\n  + + + + +\nAs depicted, both users have full privileges for the customer table. This is\
    \ a fail. When\ninspecting database-wide results for all users and all table grants, employ a\ncomprehensive approach.\
    \ Collaboration with application developers is paramount to\ncollectively determine only those database users that require\
    \ specific DML privileges\nand on which tables.\nThe first step for an organization is to determine which, if any, database\
    \ tables require\nRLS. This decision is a matter of business processes and is unique to each\norganization. To discover\
    \ which, if any, database tables have RLS enabled, execute the\nfollowing query. If any table(s) should have RLS policies\
    \ applied, but do not appear in\nquery results, then this is a fail.\nyugabyte=# SELECT oid, relname, relrowsecurity FROM\
    \ pg_class WHERE\nrelrowsecurity IS TRUE;\nBased on the results below we can see RLS is not enabled. Assuming this table\
    \ should\nbe RLS enabled but is not, this is a fail.\nyugabyte=# SELECT oid, relname, relrowsecurity FROM pg_class WHERE\
    \ relname =\n'passwd';\noid | relname | relrowsecurity\n  + +  24679 | passwd | f\n(1 row)\nFurther inspection of RLS\
    \ policies is provided via the system catalog pg_policy, which\nrecords policy details including table OID, policy name,\
    \ applicable commands, the roles\nassigned a policy, and the USING and WITH CHECK clauses. Finally, RLS and associated\n\
    policies (if implemented) may also be viewed using the standard ysqlsh display\ncommand\n\\d+ schema.table which lists\
    \ RLS information as part of the table description.\nShould you implement Row Level Security and apply restrictive policies\
    \ to certain users,\nit's imperative that you check each user's role definition via the ysqlsh display command\n\\du and\
    \ ensure unauthorized users have not been granted Bypass RLS privilege as this\nwould override any RLS enabled tables\
    \ and associated policies. If unauthorized users\ndo have Bypass RLS granted then resolve this using the ALTER ROLE <user>\n\
    NOBYPASSRLS; command.\nReview the list of all database roles that have superuser access and determine if one or\nmore\
    \ of the predefined roles would suffice for the needs of that role:\nyugabyte=# select rolname from pg_roles where rolsuper\
    \ is true;\n rolname\n----------\n postgres\n yugabyte\n(2 rows)\nRun the following command to verify whether authentication\
    \ is enabled on the YCQL\ninterface of the YugabyteDB server.\nThe YugabyteDB configuration files can be found in the\
    \ conf directory of tarballs. For\npackages, the configuration files will be located in /home/user/var/conf.\ncat ts.config\
    \ | grep use_cassandra_authentication\nIf use_cassandra_authentication is set to false, then this is a finding.\nConnect\
    \ to YugabyteDB database via YCQL to verify whether the cassandra role has\ndefault password.\n./bin/ycqlsh -u cassandra\
    \ -p cassandra\nIf the connection is successful this is a finding.\nTo verify the configuration, run the following query:\n\
    cassandra@ycqlsh> SELECT role FROM system_auth.roles WHERE is_superuser =\nTrue;\n role\n-----------\n cassandra\n(1 rows)\n\
    If cassandara or any unapproved role is returned, this is a finding.\nAs a superuser, retrieve all roles:\ncassandra@ycqlsh>\
    \ SELECT * FROM system_auth.roles;\n role      | can_login | is_superuser | member_of | salted_hash\n-----------+-----------+--------------+-----------+--------------------------\n\
    ----------------------------------------------------\n cassandra |      True |         True |          [] |\n$2a$12$vRLGwscF9sTH4MBbwhw22.VAVHtfTo/n327eNfB7VBcZVomNOIcQu\\\
    x00\\x7f\\x00\\x00\n(1 rows)\nRetrieve all permissions for all roles\ncassandra@ycqlsh> select * from system_auth.role_permissions;\n\
    \ role | resource | permissions\n------+----------+-------------\n(0 rows)\nIf there are any unnecessary roles or roles\
    \ with excessive privileges this is a finding.\nCheck the value of cql_proxy_bind_address in the ts.config. If\ncql_proxy_bind_address\
    \ is set to a non-authorized IP address or port, this is a finding.\ncat ts.config | grep cql_proxy_bind_address\nNewly\
    \ created data clusters are empty of data and have two user accounts, the\nsuperusers yugabyte and postgres. By default,\
    \ the data cluster superuser is named\nafter the UNIX account yugabyte. Login authentication is tested via UNIX DOMAIN\n\
    SOCKETS by the UNIX user account yugabyte, the default account, and set_user has\nnot yet been configured:\n# ./bin/yugabyte\n\
    yugabyte=#\nLogin attempts by another UNIX user account as the superuser should be denied:\n# su - user1 # whoami user1\n\
    # ./bin/ysqlsh -U yugabyte -d yugabyte\nysqlsh: FATAL: Peer authentication failed for user \"yugabyte\"\n# exit\nThis\
    \ test demonstrates that not only is logging in as the superuser blocked, but so is\nlogging in as another user:\n# su\
    \ - user2 # whoami user2\n# ./bin/ysqlsh -U yugabyte -d yugabyte\nysqlsh: FATAL: Peer authentication failed for user \"\
    yugabyte\"\n# ./bin/ysqlsh -U user1 -d yugabyte\nysqlsh: FATAL: Peer authentication failed for user \"user1\"\n# ./bin/ysqlsh\
    \ -U user2 -d yugabyte\nyugabyte=#\nNewly created data clusters are empty of data and have two user accounts, the\nsuperusers\
    \ yugabyte and postgres. By default, the data cluster superuser is named\nafter the UNIX account yugabyte. Login authentication\
    \ can be tested via TCP/IP\nSOCKETS by any UNIX user account from the local host. A password must be\nassigned to each\
    \ login ROLE:\nyugabyte=# ALTER ROLE yugabyte WITH PASSWORD 'secret_password'; ALTER ROLE\nTest an unencrypted session:\n\
    # ./bin/ysqlsh 'host=localhost user=yugabyte sslmode=disable' Password:\nTest an encrypted session:\n# ./bin/ysqlsh 'host=localhost\
    \ user=yugabyte sslmode=require' Password:\nRemote logins repeat the previous invocations but, of course, from the remote\
    \ host:\nTest unencrypted session:\nTest encrypted sessions:\n# ./bin/ysqlsh 'host=server-name-or-IP user=yugabyte sslmode=disable'\n\
    Password:\nTest encrypted sessions:\n# ./bin/ysqlsh 'host=server-name-or-IP user=yugabyte sslmode=require'\nPassword:\n\
    Review all configuration settings. Configure YugabyteDB logging to record all\nmodifications and changes to the RDBMS.\n\
    Issue the following command to verify the backend runtime parameters are configured\ncorrectly:\nyugabyte=# SELECT name,\
    \ setting FROM pg_settings WHERE context IN\n('backend','superuser-backend') ORDER BY 1;\n         name          | setting\n\
    -----------------------+---------\n ignore_system_indexes | off\n jit_debugging_support | off\n jit_profiling_support\
    \ | off\n log_connections       | off\n log_disconnections    | off\n post_auth_delay       | 0\n(6 rows)\nNote: Effecting\
    \ changes to these parameters can only be made at server start.\nTherefore, a successful exploit may not be detected until\
    \ after a server restart, e.g.,\nduring a maintenance window.\nThe following parameters can only be set at server start\
    \ by the owner of the\nYugabyteDB server process and cluster, typically the UNIX user account yugabyte.\nTherefore, all\
    \ exploits require the successful compromise of either that UNIX account or\nthe postgres superuser account itself.\n\
    yugabyte=# SELECT name, setting FROM pg_settings WHERE context = 'postmaster'\nORDER BY 1;\n                name     \
    \            |                         setting\n-------------------------------------+---------------------------------------\n\
