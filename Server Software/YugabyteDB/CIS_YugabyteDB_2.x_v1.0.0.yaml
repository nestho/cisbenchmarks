controls:
- id: 3.1.1
  title: Logging Rationale
  scoring: manual
  profile:
  - Level 1 - Yugabyte
  description: Having an audit trail is an important feature of any relational database system. You want enough detail to
    describe when an event of interest has started and stopped, what the event is/was, the event's cause, and what the event
    did/is doing to the system. Ideally, the logged information is in a format permitting further analysis giving us new perspectives
    and insight. The YugabyteSQL configuration file ysql_pg.conf is where all adjustable parameters can be set. A configuration
    file is created as part of the data cluster's creation i.e. initdb. The configuration file enumerates all tunable parameters
    and even though most of them are commented out it is understood that they are in fact active and at those very same documented
    values. The reason that they are commented out is to signify their default values. Uncommenting them will force the server
    to read these values instead of using the default values.
  rationale: ''
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/yb-tserver/#ysql-pgco
  page_start: 36
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 3.1.2
  title: Ensure the log destinations are set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: YugabyteDB by default supports logging server messages to stderr.
  rationale: If log_destination is not set, then any log messages generated by the core YugabyteSQL processes will be lost.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/reference/configuration/yb-tserver/#ysql
  page_start: 38
  audit_raw: "Execute the following YSQL statement to confirm that the expected logging directory is\nspecified:\nyugabyte=#\
    \ show log_destination;\n log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with\
    \ your organization's policies on logging. If all the\nexpected log destinations are not set, this is a fail."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_destination=''stderr''”'
  checks:
  - type: sql
    command: show log_destination;
    severity: medium
    info: "Execute the following YSQL statement to confirm that the expected logging directory is\nspecified:\nyugabyte=#\
      \ show log_destination;\n log_destination\n-----------------\n stderr\n(1 row)\nThe log destinations should comply with\
      \ your organization's policies on logging. If all the\nexpected log destinations are not set, this is a fail."
- id: 3.1.3
  title: Ensure the filename pattern for log files is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: The log_filename setting specifies the filename pattern for log files. The value for log_filename should match
    your organization's logging policy. The value is treated as a strftime pattern, so %-escapes can be used to specify timevarying
    file names. The supported %-escapes are similar to those listed in the Open Group's strftime specification. If you specify
    a file name without escapes, you should plan to use a log rotation utility to avoid eventually filling the partition that
    contains log_directory. If there are any time-zone-dependent %-escapes, the computation is done in the zone specified
    by log_timezone. Also, the system's strftime is not used directly, so platform- specific (nonstandard) extensions do not
    work.
  rationale: If log_filename is not set, then the value of log_directory is set to the default.
  impact: ''
  references:
  - 1. https://man7.org/linux/man-pages/man3/strftime.3.html
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 40
  audit_raw: "Execute the following YSQL statement to confirm that the desired pattern is set:\nyugabyte=# show log_filename;\n\
    \          log_filename\n--------------------------------\n postgresql-%Y-%m-%d_%H%M%S.log\n(1 row)\nNote: This example\
    \ shows the use of the strftime %a escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log,\
    \ postgresql-Tue.log, et al)."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_filename=''postgresql-%a.log''”'
  checks:
  - type: sql
    command: show log_filename;
    severity: medium
    info: "Execute the following YSQL statement to confirm that the desired pattern is set:\nyugabyte=# show log_filename;\n\
      \          log_filename\n--------------------------------\n postgresql-%Y-%m-%d_%H%M%S.log\n(1 row)\nNote: This example\
      \ shows the use of the strftime %a escape. This creates seven log\nfiles, one for each day of the week (e.g. postgresql-Mon.log,\
      \ postgresql-Tue.log, et al)."
- id: 3.1.4
  title: Ensure the log file permissions are set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: The log_file_mode setting determines the file permissions for log files when logging_collector is enabled.
    The parameter value is expected to be a numeric mode specification in the form accepted by the chmod and umask system
    calls. (To use the customary octal format, the number must start with a 0) The permissions should be set to allow only
    the necessary access to authorized personnel. In most cases, the best setting is 0600, so that only the server owner can
    read or write the log files. The other commonly useful setting is 0640, allowing members of the owner's group to read
    the files, although to make use of that, you will need to alter the log_directory setting to store the log files outside
    the cluster data directory.
  rationale: Log files often contain sensitive data. Allowing unnecessary access to log files may inadvertently expose sensitive
    data to unauthorized personnel.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 42
  audit_raw: "Execute the following YSQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
    yugabyte=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, setting it to 0660). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_file_mode=''0660''”'
  checks:
  - type: sql
    command: show log_file_mode;
    severity: medium
    info: "Execute the following YSQL statement to verify that the setting is consistent with\norganizational logging policy:\n\
      yugabyte=# show log_file_mode;\n log_file_mode\n---------------\n 0600\n(1 row)"
- id: 3.1.5
  title: Ensure 'log_truncate_on_rotation' is enabled
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: 'Enabling the log_truncate_on_rotation setting when logging_collector is enabled causes YugabyteDB to truncate
    (overwrite) existing log files with the same name during log rotation instead of appending to them. Note: Truncation will
    occur only when a new file is being opened due to time-based rotation, not during server startup or size-based rotation
    (see later in this benchmark for size-based rotation details).'
  rationale: If this setting is disabled, pre-existing log files will be appended to if log_filename is configured in such
    a way that static names are generated. Enabling or disabling the truncation should only be decided when also considering
    the value of log_filename and log_rotation_age/log_rotation_size.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 44
  audit_raw: "Execute the following YSQL statement to verify how log_truncate_on_rotation is set:\nyugabyte=# show log_truncate_on_rotation;\n\
    \ log_truncate_on_rotation\n--------------------------\n off\n(1 row)\nIf it is not set to on, this is a fail (depending\
    \ on your organization's logging policy)."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_truncate_on_rotation=''on''”'
  checks:
  - type: sql
    command: show log_truncate_on_rotation;
    severity: medium
    info: "Execute the following YSQL statement to verify how log_truncate_on_rotation is set:\nyugabyte=# show log_truncate_on_rotation;\n\
      \ log_truncate_on_rotation\n--------------------------\n off\n(1 row)\nIf it is not set to on, this is a fail (depending\
      \ on your organization's logging policy)."
- id: 3.1.6
  title: Ensure the maximum log file lifetime is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: When logging_collector is enabled, the log_rotation_age parameter determines the maximum lifetime of an individual
    log file (depending on the value of log_filename). After this many minutes have elapsed, a new log file will be created
    via automatic log file rotation. Current best practices advise log rotation at least daily, but your organization's logging
    policy should dictate your rotation schedule.
  rationale: Log rotation is a standard best practice for log management.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 46
  audit_raw: "Execute the following YSQL statement to verify the log rotation age is set to an\nacceptable value:\nyugabyte=#\
    \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, setting it to 10d). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_rotation_age=''10d''”'
  checks:
  - type: sql
    command: show log_rotation_age;
    severity: medium
    info: "Execute the following YSQL statement to verify the log rotation age is set to an\nacceptable value:\nyugabyte=#\
      \ show log_rotation_age;\n log_rotation_age\n------------------\n 1d\n(1 row)"
- id: 3.1.7
  title: Ensure the maximum log file size is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: The log_rotation_size setting determines the maximum size of an individual log file. Once the maximum size
    is reached, automatic log file rotation will occur.
  rationale: If this is set to zero, the size-triggered creation of new log files is disabled. This will prevent automatic
    log file rotation when files become too large, which could put log data at increased risk of loss (unless age-based rotation
    is configured).
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 48
  audit_raw: "Execute the following YSQL statement to verify that log_rotation_size is set in\ncompliance with the organization's\
    \ logging policy:\nyugabyte=# show log_rotation_size;\n log_rotation_size\n-------------------\n 10MB\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, setting it to 1GB). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“log_rotation_size=''1GB''”'
  checks:
  - type: sql
    command: show log_rotation_size;
    severity: medium
    info: "Execute the following YSQL statement to verify that log_rotation_size is set in\ncompliance with the organization's\
      \ logging policy:\nyugabyte=# show log_rotation_size;\n log_rotation_size\n-------------------\n 10MB\n(1 row)"
- id: 3.1.8
  title: Ensure the correct syslog facility is selected
  scoring: manual
  profile:
  - Level 1 - Yugabyte
  description: 'The syslog_facility setting specifies the syslog "facility" to be used when logging to syslog is enabled.
    You can choose from any of the ''local'' facilities: • LOCAL0 • LOCAL1 • LOCAL2 • LOCAL3 • LOCAL4 • LOCAL5 • LOCAL6 •
    LOCAL7 Your organization''s logging policy should dictate which facility to use based on the syslog daemon in use.'
  rationale: If not set to the appropriate facility, the YugabyteDB log messages may be intermingled with other applications'
    log messages, incorrectly routed, or potentially dropped (depending on your syslog configuration).
  impact: ''
  references: []
  page_start: 50
  audit_raw: "Execute the following YSQL statement and verify that the correct facility is selected:\nyugabyte=# show syslog_facility;\n\
    \ syslog_facility\n-----------------\n local0\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, setting it to the LOCAL1 facility). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“syslog_facility=''local1''”'
  checks:
  - type: sql
    command: show syslog_facility;
    severity: medium
    info: "Execute the following YSQL statement and verify that the correct facility is selected:\nyugabyte=# show syslog_facility;\n\
      \ syslog_facility\n-----------------\n local0\n(1 row)"
- id: 3.1.9
  title: Ensure syslog messages are not suppressed
  scoring: manual
  profile:
  - Level 1 - Yugabyte
  description: When logging to Syslog and this is on, then each message will be prefixed by an increasing sequence number.
  rationale: Many modern Syslog implementations perform a log optimization and suppress repeated log entries while emitting
    “--- last message repeated N times ---”. In more modern Syslog implementations, repeated message suppression can be configured
    (for example, $RepeatedMsgReduction in rsyslog).
  impact: If disabled, messages sent to Syslog could be suppressed and not logged. While a message is emitted stating that
    a given message was repeated and suppressed, the timestamp associated with these suppressed messages are lost, potentially
    damaging the recreation of an incident timeline.
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 52
  audit_raw: "Execute the following YSQL statement and confirm that the syslog_sequence_numbers\nis enabled (on):\nyugabyte=#\
    \ show syslog_sequence_numbers;\n syslog_sequence_numbers\n-------------------------\n on\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“syslog_sequence_numbers=''off''”'
  checks:
  - type: sql
    command: show syslog_sequence_numbers;
    severity: medium
    info: "Execute the following YSQL statement and confirm that the syslog_sequence_numbers\nis enabled (on):\nyugabyte=#\
      \ show syslog_sequence_numbers;\n syslog_sequence_numbers\n-------------------------\n on\n(1 row)"
- id: 3.1.10
  title: Ensure syslog messages are not lost due to size
  scoring: manual
  profile:
  - Level 1 - Yugabyte
  description: YugabyteDB log messages can exceed 1024 bytes, which is a typical size limit for traditional Syslog implementations.
    When syslog_split_messages is off, YugabyteDB server log messages are delivered to the Syslog service as is, and it is
    up to the Syslog service to cope with the potentially bulky messages. When syslog_split_messages is on, messages are split
    by lines, and long lines are split so that they will fit into 1024 bytes. If syslog is ultimately logging to a text file,
    then the effect will be the same either way, and it is best to leave the setting on, since most syslog implementations
    either cannot handle large messages or would need to be specially configured to handle them. But if syslog is ultimately
    writing into some other medium, it might be necessary or more useful to keep messages logically together.
  rationale: ''
  impact: Depending on the Syslog server in use, log messages exceeding 1024 bytes may be lost or, potentially, cause the
    Syslog server processes to abort.
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 54
  audit_raw: "Execute the following YSQL statement to confirm that long log messages are split when\nlogging to Syslog:\n\
    yugabyte=# show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv=“syslog_split_messages=''off''”'
  checks:
  - type: sql
    command: show syslog_split_messages;
    severity: medium
    info: "Execute the following YSQL statement to confirm that long log messages are split when\nlogging to Syslog:\nyugabyte=#\
      \ show syslog_split_messages;\n syslog_split_messages\n-----------------------\n on\n(1 row)"
- id: 3.1.11
  title: Ensure the program name for YugabyteDB syslog messages is correct
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: The syslog_ident setting specifies the program name used to identify YugabyteDB messages in syslog logs. An
    example of a possible program name is yugabyte.
  rationale: If this is not set correctly, it may be difficult or impossible to distinguish YugabyteDB messages from other
    messages in Syslog logs.
  impact: ''
  references:
  - 1. https://tools.ietf.org/html/rfc3164#section-4.1.3
  - 2. https://docs.yugabyte.com/preview/reference/configuration/
  page_start: 56
  audit_raw: "Execute the following YSQL statement to verify the program name is set correctly:\nyugabyte=# show syslog_ident;\n\
    \ syslog_ident\n--------------\n postgres\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, assuming a program name of yugabyte). Add the following GFLAG to YBTServer:

    ./bin/yb-tserver --ysql_pg_conf_csv="syslog_ident=''yugabyte''"'
  checks:
  - type: sql
    command: show syslog_ident;
    severity: medium
    info: "Execute the following YSQL statement to verify the program name is set correctly:\nyugabyte=# show syslog_ident;\n\
      \ syslog_ident\n--------------\n postgres\n(1 row)"
- id: 3.1.12
  title: Ensure the correct messages are written to the server log
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: 'The log_min_messages setting specifies the message levels that are written to the server log. Each level includes
    all the levels that follow it. The lower the level (vertically, below), the fewer messages are sent. Valid values are:
    • DEBUG5 • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 • INFO • NOTICE • WARNING • ERROR • LOG • FATAL • PANIC WARNING is considered
    the best practice unless indicated otherwise by your organization''s logging policy.'
  rationale: If this is not set to the correct value, too many messages or too few messages may be written to the server log.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 58
  audit_raw: "Execute the following YSQL statement to confirm the setting is correct:\nyugabyte=# show log_min_messages;\n\
    \ log_min_messages\n------------------\n warning\n(1 row)"
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in this

    example, to set it to warning). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv="log_min_messages=''warning''"'
  checks:
  - type: sql
    command: show log_min_messages;
    severity: medium
    info: "Execute the following YSQL statement to confirm the setting is correct:\nyugabyte=# show log_min_messages;\n log_min_messages\n\
      ------------------\n warning\n(1 row)"
- id: 3.1.13
  title: Ensure the correct YSQL statements generating errors are recorded
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: 'The log_min_error_statement setting causes all YSQL statements generating errors at or above the specified
    severity level to be recorded in the server log. Each level includes all the levels that follow it. The lower the level
    (vertically, below), the fewer messages are recorded. Valid values are: • DEBUG5 • DEBUG4 • DEBUG3 • DEBUG2 • DEBUG1 •
    INFO • NOTICE • WARNING • ERROR • LOG • FATAL • PANIC ERROR is considered the best practice setting. Changes should only
    be made in accordance with your organization''s logging policy. Note: To effectively turn off logging of failing statements,
    set this parameter to PANIC.'
  rationale: If this is not set to the correct value, too many erring YSQL statements or too few erring YSQL statements may
    be written to the server log.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 60
  audit_raw: "Execute the following YSQL statement to verify the setting is correct:\nyugabyte=# show log_min_error_statement;\n\
    \ log_min_error_statement\n-------------------------\n error\n(1 row)\nIf not configured to at least ERROR, this is a\
    \ fail."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server (in the

    example, to warning). Add the following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv="log_min_error_statement=''warning''"'
  checks:
  - type: sql
    command: show log_min_error_statement;
    severity: medium
    info: "Execute the following YSQL statement to verify the setting is correct:\nyugabyte=# show log_min_error_statement;\n\
      \ log_min_error_statement\n-------------------------\n error\n(1 row)\nIf not configured to at least ERROR, this is\
      \ a fail."
- id: 3.1.14
  title: Ensure 'debug_print_parse' is disabled
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: The debug_print_parse setting enables printing the resulting parse tree for each executed query. These messages
    are emitted at the LOG message level. Unless directed otherwise by your organization's logging policy, it is recommended
    this setting be disabled by setting it to off.
  rationale: Enabling any of the DEBUG printing variables may cause the logging of sensitive information that would otherwise
    be omitted based on the configuration of the other logging settings.
  impact: ''
  references:
  - 1. https://docs.yugabyte.com/preview/reference/configuration/
  - 2. https://docs.yugabyte.com/preview/secure/audit-logging/
  page_start: 62
  audit_raw: "Execute the following YSQL statement to confirm the setting is correct:\nyugabyte=# show debug_print_parse;\n\
    \ debug_print_parse\n-------------------\n off\n(1 row)\nIf not configured to off, this is a fail."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv="debug_print_parse=''off''"'
  checks:
  - type: sql
    command: show debug_print_parse;
    severity: medium
