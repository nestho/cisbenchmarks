    records must be added to the pg_hba.conf file. Be sure to reload YugabyteDB after any changes (restart not required).
    Note: The hostssl record matches connection attempts made using TCP/IP, but only when the connection is made with TLS
    encryption. The host record matches attempts made using TCP/IP, but allows both TLS and non-TLS connections. The hostnossl
    record matches attempts made using TCP/IP, but only those without TLS. Care should be taken to enforce TLS as appropriate.
    A self-signed certificate can be used for testing, but a certificate signed by a certificate authority (CA) (either one
    of the global CAs or a local one) should be used in production so that clients can verify the server''s identity. If all
    the database clients are local to the organization, using a local CA is recommended. To ultimately enable and enforce
    TLS authentication for the server, appropriate hostssl records must be added to the ysql_hba.conf file. Be sure to restart
    YB-TServer after any changes. Note: The hostssl record matches connection attempts made using TCP/IP, but only when the
    connection is made with TLS encryption. The host record matches attempts made using TCP/IP, but allows both TLS and non-TLS
    connections. The hostnossl record matches attempts made using TCP/IP, but only those without TLS. _Care should be taken
    to enforce TLS as appropriate. When considering or undertaking any form of encryption, it is critical to understand the
    state of the encrypted data at all stages of the data lifecycle. The use of pgcrypto ensures that the data at rest in
    the tables (and therefore on disk) is encrypted, but for the data to be accessed by any users or applications, said users/applications
    will, by necessity, have access to the encrypt and decrypt keys and the data in question will be encrypted/decrypted in
    memory and then transferred to/from the user/application in that form.'
