- id: 3.1.24
  title: Ensure 'log_timezone' is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  - Level 2 - Yugabyte
  description: 'The log_timezone setting specifies the time zone to use in timestamps within log messages. This value is cluster-wide,
    so that all sessions will report timestamps consistently. Unless directed otherwise by your organization''s logging policy,
    set this to either GMT or UTC. The YugabyteDB Audit Extension (pgAudit) provides detailed session and/or object audit
    logging via the standard YugabyteDB logging facility. The goal of pgAudit is to provide YugabyteDB users with the capability
    to produce audit logs often required to comply with government, financial, or ISO certifications. Audit logging can be
    used to record information about YCQL statements or events (such as login events) and log the records on a per-node basis
    into the YB-Tserver logs. Audit logging can be enabled on YugabyteDB cluster by setting the ycql_enable_audit_log TServer
    flag to true. By default, each TServer records all login events and YCQL commands issued to the server. Audit record is
    logged before an operation attempts to be executed, and failures are audited as well. If an operation fails to execute,
    both operation execution and failure are logged. However, an error that happens during parsing or analysis of YCQL statement
    results only in an error audit record to be logged. YCQL audit logging can be further customized using additional YB-TServer
    flags. It is common to have more than one authorized individual administering the YugabyteDB service at the Operating
    System level. It is also quite common to permit login privileges to individuals on a YugabyteDB host who otherwise are
    not authorized to access the server''s data cluster and files. Administering the YugabyteDB data cluster, as opposed to
    its data, is to be accomplished via a localhost login of a regular UNIX user account. Access to the yugabyte superuser
    account is restricted in such a manner as to interdict unauthorized access. sudo satisfies the requirements by escalating
    ordinary user account privileges as the YugabyteDB RDBMS superuser. With respect to YugabyteDB administrative YSQL commands,
    only superusers should have elevated privileges. YugabyteDB regular, or application, users should not possess the ability
    to create roles, create new databases, manage replication, or perform any other action deemed privileged. Typically, regular
    users should only be granted the minimal set of privileges commensurate with managing the application: • DDL (create table,
    create view, create index, etc.) • DML (select, insert, update, delete) Further, it has become best practice to create
    separate roles for DDL and DML. Given an application called ''payroll'', one would create the following users: • payroll_owner
    • payroll_user Any DDL privileges would be granted to the payroll_owner account only, while DML privileges would be given
    to the payroll_user account only. This prevents accidental creation/altering/dropping of database objects by application
    code that runs as the payroll_user account. In certain situations, to provide the required functionality, YugabyteDB needs
    to execute internal logic (stored procedures, functions, triggers, etc.) and/or external code modules with elevated privileges.
    However, if the privileges required for execution are at a higher level than the privileges assigned to organizational
    users invoking the functionality applications/programs, those users are indirectly provided with greater privileges than
    assigned by their organization. This is known as privilege elevation. Privilege elevation must be utilized only where
    necessary. Execute privileges for application functions should be restricted to authorized users only. DML (insert, update,
    delete) operations at the table level should be restricted to only authorized users. YugabyteDB manages table-level DML
    permissions via the GRANT statement. In addition to the YSQL-standard privilege system available through GRANT, tables
    can have row security policies that restrict, on a per-user basis, which individual rows can be returned by normal queries
    or inserted, updated, or deleted by data modification commands. This feature is also known as Row Level Security (RLS).
    By default, tables do not have any policies, so if a user has access privileges to a table according to the YSQL privilege
    system, all rows within it are equally available for querying or updating. Row security policies can be specific to commands,
    to roles, or to both. A policy can be specified to apply to ALL commands, or to any combination of SELECT, INSERT, UPDATE,
    or DELETE. Multiple roles can be assigned to a given policy, and normal role membership and inheritance rules apply. If
    you use RLS and apply restrictive policies to certain users, it is important that the Bypass RLS privilege not be granted
    to any unauthorized users. This privilege overrides RLS- enabled tables and associated policies. Generally, only superusers
    and elevated users should possess this privilege. YugabyteDB provides a set of predefined roles that provide access to
    certain, commonly needed, privileged capabilities and information. Administrators can GRANT these roles to users and/or
    other roles in their environment, providing those users with access to the specified capabilities and information. YCQL
    authentication is based on roles. Roles can be created with superuser, nonsuperuser, and login privileges. New roles can
    be created, and existing ones altered or dropped by administrators using YCQL commands. The cassandra role has a default
    password which must be changed. The default installation of YugabyteDB includes a superuser role named cassandra. This
    necessitates the creation of a separate role to be the superuser role. Verify each role is required and has only the privileges
    needed to do its job. The cql_proxy_bind_address GFLAG setting specifies the IP address and port for YCQL interface. cql_proxy_bind_address
    should be set according to your organization''s approved IP address and ports policy. A remote host login, via SSH, is
    arguably the most secure means of remotely accessing and administering the YugabyteDB server. Once connected to the YugabyteDB
    server, using the ysqlsh client, via UNIX DOMAIN SOCKETS, while using the peer authentication method is the most secure
    mechanism available for local database connections. Provided a database user account of the same name of the UNIX account
    has already been defined in the database, even ordinary user accounts can access the cluster in a similarly highly secure
    manner. A large number of authentication METHODs are available for hosts connecting using TCP/IP sockets, including: •
    trust • reject • md5 • scram-sha-256 • password • gss • sspi • ident • pam • ldap • radius • cert METHODs trust, password,
    and ident are not to be used for remote logins. METHOD md5 is the most popular and can be used in both encrypted and unencrypted
    sessions, however, it is vulnerable to packet replay attacks. It is recommended that scram- sha-256 be used instead of
    md5. Use of the gss, sspi, pam, ldap, radius, and cert METHODs are dependent upon the availability of external authenticating
    processes/services and thus are not covered in this benchmark. Understanding the vulnerability of YugabyteDB runtime parameters
    by the particular delivery method, or attack vector. In order to serve multiple clients efficiently, the YugabyteDB server
    server launches a new "backend" process for each client. The runtime parameters in this benchmark section are controlled
    by the backend process. The server''s performance, in the form of slow queries causing a denial of service, and the RDBM''s
    auditing abilities for determining root cause analysis can be compromised via these parameters. YugabyteDB runtime parameters
    that are executed by the postmaster process. YugabyteDB runtime parameters that are executed by the SIGHUP signal. YugabyteDB
    runtime parameters that can only be executed by the server''s superuser,yugabyte. These YugabyteDB runtime parameters
    are managed at the user account (ROLE) level. YugabyteDB clusters can be configured to use server-to-server encryption
    to protect data in transit between YugabyteDB servers. When enabled, Transport Layer Security (TLS), the successor to
    the deprecated Secure Sockets Layer (SSL), is used to ensure data protection for YSQL and YCQL only. Note that there is
    no planned support for YEDIS. YugabyteDB clusters can be configured to use client-to-server encryption to protect data
    in transit between YugabyteDB servers and clients, tools, and APIs. When enabled, Transport Layer Security (TLS), the
    successor to the deprecated Secure Sockets Layer (SSL), is used to ensure data protection for YSQL and YCQL only. Note
    that there is no planned support for YEDIS. Before you can enable client-to-server encryption, you first must enable server-to-server
    encryption. YugabyteDB must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of organization-defined
    information at rest (to include, at a minimum, PII and classified information) on organization-defined information system
    components. Backup and restoration is the process of creating and storing copies of your data for protection against data
    loss. With a proper backup strategy, you can always restore your data to a most-recent known working state and minimize
    application downtime. This in turn guarantees business and application continuity. YugabyteDB configuration files within
    the data cluster''s directory tree can be changed by anyone logging into the data cluster as the superuser, i.e. yugabyte.
    As a matter of default policy, configuration files such as ysql_pg.conf, ysql_hba.conf, and pg_ident, are placed in the
    data cluster''s directory, $PGDATA. YugabyteDB can be configured to relocate these files to locations outside the data
    cluster which cannot then be altered by an ordinary superuser login session. Consideration should also be given to "include
    directives"; these are cluster subdirectories where one can locate files containing additional configuration parameters.
    Include directives are meant to add more flexibility for unique installs or large network environments while maintaining
    order and consistent architectural design. The YugbayteDB cluster is organized to carry out specific tasks in subdirectories.
    For the purposes of performance, reliability, and security some of these subdirectories should be relocated outside the
    data cluster. This recommendation covers non-regular, special files, and dynamic libraries. YugabyteDB permits local logins
    via the UNIX DOMAIN SOCKET and, for the most part, anyone with a legitimate Unix login account can make the attempt. Limiting
    YugabyteDB login attempts can be made by relocating the UNIX DOMAIN SOCKET to a subdirectory with restricted permissions.
    The creation and implementation of user-defined dynamic libraries is an extraordinary powerful capability. In the hands
    of an experienced DBA/programmer, it can significantly enhance the power and flexibility of the RDBMS; but new and unexpected
    behavior can also be assigned to the RDBMS, resulting in a very dangerous environment in what should otherwise be trusted.'
  rationale: 'Log entry timestamps should be configured for an appropriate time zone as defined by your organization''s logging
    policy to ensure a lack of confusion around when a logged event occurred. Note that this setting affects only the timestamps
    present in the logs. It does not affect the time zone in use by the database itself (for example, select now()), nor does
    it affect the host''s time zone. Basic statement logging can be provided by the standard logging facility with log_statement
    = all. This is acceptable for monitoring and other uses but does not provide the level of detail generally required for
    an audit. It is not enough to have a list of all the operations performed against the database, it must also be possible
    to find particular statements that are of interest to an auditor. The standard logging facility shows what the user requested,
    while pgAudit focuses on the details of what happened while the database was satisfying the request. When logging SELECT
    and DML statements, pgAudit can be configured to log a separate entry for each relation referenced in a statement. No
    parsing is required to find all statements that touch a particular table. In fact, the goal is that the statement text
    is provided primarily for deep forensics and should not be required for an audit. Unauthorized attempts to create, drop
    or alter users or data should be a concern. Without sudo, there would be no capabilities to strictly control access to
    the superuser account nor to securely and authoritatively audit its use. By not restricting global administrative commands
    to superusers only, regular users granted excessive privileges may execute administrative commands with unintended and
    undesirable results. Ideally, all application source code should be vetted to validate interactions between the application
    and the logic in the database, but this is usually not possible or feasible with available resources even if the source
    code is available. The DBA should attempt to obtain assurances from the development organization that this issue has been
    addressed and should document what has been discovered. The DBA should also inspect all application logic stored in the
    database (in the form of functions, rules, and triggers) for excessive privileges. Excessive DML grants can lead to unprivileged
    users changing or deleting information without proper authorization. If RLS policies and privileges are not configured
    correctly, users could perform actions on tables that they are not authorized to perform, such as inserting, updating,
    or deleting rows. In keeping with the principle of least privilege, judicious use of the YugabyteDB predefined roles can
    greatly limit the access to privileged, or superuser, access. Authentication is a necessary condition of YugabyteDB’s
    permissions subsystem, so if authentication is disabled then so are permissions. Failure to authenticate clients, users,
    and/or servers can allow unauthorized access to the YugabyteDB database and can prevent tracing actions back to their
    sources. The authentication mechanism should be implemented before anyone accesses the YCQL interface of the YugabyteDB
    server. Failure to change the default password for the cassandra role may pose a risk to the database in the form of unauthorized
    access. Superuser permissions allow for the creation, deletion, and permission management of other users. Considering
    the Cassandra role is well known it should not be a superuser or one which is used for any administrative tasks. Roles
    which are unneeded, have super user or other potentially excessive privileges may be an avenue for a hacker to gain access
    to or modify data in the database. Setting the address or interface to bind to will tell other YCQL applications (e.g.
    ''ycqlsh'' tool) to which address or interface to connect. There are as many ways of compromising a server as there are
    runtime parameters. A combination of any one or more of them executed at the right time under the right conditions has
    the potential to compromise the RDBMS. Mitigating risk is dependent upon one''s understanding of the attack vectors and
    includes: 1. Via user session: includes those runtime parameters that can be set by a ROLE that persists for the life
    of a server-client session. 2. Via attribute: includes those runtime parameters that can be set by a ROLE during a server-client
    session that can be assigned as an attribute for an entity such as a table, index, database, or role. 3. Via server reload:
    includes those runtime parameters that can be set by the superuser using runtime GFLAGs affects the entire cluster. 4.
    Via server restart: includes those runtime parameters that can be set and effected by restarting the server process and
    affects the entire cluster. A denial of service is possible by denying the use of indexes and by slowing down client access
    to an unreasonable level. Unsanctioned behavior can be introduced by introducing rogue libraries which can then be called
    in a database session. Logging can be altered and obfuscated inhibiting root cause analysis. The postmaster process is
    the supervisory process that assigns a backend process to an incoming client connection. The postmaster manages key runtime
    parameters that are either shared by all backend connections or needed by the postmaster process itself to run. In order
    to define server behavior and optimize server performance, the server''s superuser has the privilege of setting these
    parameters which are found in the configuration files ysql_pg.conf and ysql_hba.conf. In order to improve and optimize
    server performance, the server''s superuser has the privilege of setting these parameters which are found in the configuration
    file ysql_pg_conf_csv. In order to improve performance and optimize features, a ROLE has the privilege of setting numerous
    parameters in a transaction, session, or entity attribute. Any ROLE can alter any of these parameters. If TLS is not enabled
    and configured correctly, this increases the risk of data being compromised in transit. If TLS is not enabled and configured
    correctly, this increases the risk of data being compromised in transit. YugabyteDB instances handling data that requires
    "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of
    the information at rest. These cryptographic mechanisms may be native to YugabyteDB or implemented via additional software
    or operating system/file system settings, as appropriate to the situation. Information at rest refers to the state of
    information when it is located on a secondary storage device (e.g. disk drive, tape drive) within an organizational information
    system. The selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information.
    The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations
    have the flexibility to either encrypt all information on storage devices (i.e. full disk encryption) or encrypt specific
    data structures (e.g. files, records, or fields). Organizations may also optionally choose to implement both to implement
    layered security. The decision of whether, and what, to encrypt rests with the data owner and is also influenced by the
    physical measures taken to secure the equipment and media on which the information resides. Organizations may choose to
    employ different mechanisms to achieve confidentiality and integrity protection, as appropriate. If the confidentiality
    and integrity of application data are not protected, the data will be open to compromise and unauthorized modification.
    The YugabyteDB pgcrypto extension provides cryptographic functions for YugabyteDB and is intended to address the confidentiality
    and integrity of user and system information at rest in non-mobile devices. Unlike traditional single-instance databases,
    YugabyteDB is designed for fault tolerance. By maintaining at least three copies of your data across multiple data regions
    or multiple clouds, it makes sure no losses occur if a single node or single data region becomes unavailable. Thus, with
    YugabyteDB, you would mainly use backups to: • Recover from a user or software error, such as accidental table removal.
    • Recover from a disaster scenario, like a full cluster failure or a simultaneous outage of multiple data regions. Even
    though such scenarios are extremely unlikely, it''s still a best practice to maintain a way to recover from them. • Maintain
    a remote copy of data, as required by data protection regulations. Leaving YugabyteDB configuration files within the data
    cluster''s directory tree increases the chances that they will be inadvertently or intentionally altered. Some subdirectories
    contain information, such as logs, which can be of value to others such as developers. Other subdirectories can gain a
    performance benefit when placed on fast storage devices. Finally, relocating a subdirectory to a separate and distinct
    partition mitigates denial of service and involuntary server shutdown when excessive writes fill the data cluster''s partition,
    e.g. fs_data_dir, fs_wal_dir and log_dir.'
