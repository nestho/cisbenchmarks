  remediation: "Use the yb-tserver binary and its flags to configure the YB-TServer server (in this\nexample, setting it to\
    \ UTC). Add the following GFLAG to YB-TServer:\n./bin/yb-tserver --ysql_pg_conf_csv=“log_timezone='UTC'”\nAfter configuring\
    \ the YB-TServer and starting the cluster, create the pgAudit extension\nby executing the following YSQL statement:\n\
    yugabyte=# CREATE EXTENSION IF NOT EXISTS pgaudit;\nCREATE EXTENSION\nYou only need to run this statement on a single\
    \ node, and it will apply across your\ncluster.\nUse the following steps to configure audit logging in a YugabyteDB cluster\
    \ with bare\nminimum configurations.\nUse the yb-tserver binary and its flags to configure the YB-TServer server. Add\
    \ the\nfollowing GFLAG to YB-TServer:\n./bin/yb-tserver --\nysql_pg_conf_csv=\"pgaudit.log='DDL',pgaudit.log_level=notice,pgaudit.log_clie\n\
    nt=ON\"\nUse the yb-tserver binary and its flags to configure the YB-TServer server. Add the\nfollowing GFLAG to YB-TServer:\n\
    ./bin/yb-tserver <options> --ycql_enable_audit_log=true\nAs superuser root, execute the following commands:\n# echo '%dba\
    \ ALL= /bin/su - yugabyte' > /etc/sudoers.d/yugabyte\n# chmod 600 /etc/sudoers.d/yugabyte\nThis grants any Operating System\
    \ user that is a member of the dba group to use sudo\nsu - yugabyte to become the yugabyte user.\nEnsure that all Operating\
    \ System user's that need such access are members of the\ngroup.\nIf any regular or application users have been granted\
    \ excessive administrative rights,\nthose privileges should be removed immediately via the Yugabyte ALTER ROLE YSQL\n\
    command. Using the same example above, the following YSQL statements revoke all\nunnecessary elevated administrative privileges\
    \ from the regular user appuser:\n# whoami\nyugabyte\n# ysqlsh -c \"ALTER ROLE appuser NOSUPERUSER;\" ALTER ROLE\n# ysqlsh\
    \ -c \"ALTER ROLE appuser NOCREATEROLE;\" ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOCREATEDB;\" ALTER ROLE\n# ysqlsh\
    \ -c \"ALTER ROLE appuser NOREPLICATION;\" ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOBYPASSRLS;\" ALTER ROLE\n# ysqlsh\
    \ -c \"ALTER ROLE appuser NOINHERIT;\" ALTER ROLE\nVerify the appuser now passes your check by having no defined Attributes:\n\
    # whoami\nyugabyte\n# ysqlsh -c \"\\du appuser\"\nList of roles\nRole name | Attributes | Member of\n  + +  appuser |\
    \ | {}\nWhere possible, revoke SECURITY DEFINER on YugabyteDB functions. To change a\nSECURITY DEFINER function to SECURITY\
    \ INVOKER, run the following YSQL:\n# whoami root\n# sudo su - yugabyte\n# ysqlsh -c \"ALTER FUNCTION [functionname] SECURITY\
    \ INVOKER;\"\nIf it is not possible to revoke SECURITY DEFINER, ensure the function can be executed by\nonly the accounts\
    \ that absolutely need such functionality:\nyugabyte=# SELECT proname, proacl FROM pg_proc WHERE proname =\n'delete_customer';\n\
    proname | proacl\n  +  delete_customer |\n{=X/postgres,postgres=X/postgres,appwriter=X/postgres}\n(1 row)\nyugabyte=#\
    \ REVOKE EXECUTE ON FUNCTION delete_customer(integer,boolean) FROM\nappreader;\nREVOKE\nyugabyte=# SELECT proname, proacl\
    \ FROM pg_proc WHERE proname =\n'delete_customer';\nproname | proacl\n  +  delete_customer | {=X/postgres,postgres=X/postgres}\n\
    (1 row)\nBased on the output above, appreader=X/postgres no longer exists in the proacl\ncolumn results returned from\
    \ the query and confirms appreader is no longer granted\nexecute privilege on the function.\nIf a given database user\
    \ has been granted excessive DML privileges for a given\ndatabase table, those privileges should be revoked immediately\
    \ using the REVOKE\nYSQL command.\nContinuing with the example above, remove unauthorized grants for appreader user\n\
