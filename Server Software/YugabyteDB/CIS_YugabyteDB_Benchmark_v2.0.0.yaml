    \ ON passwd TO admin; GRANT\nGrant only select access on non-sensitive columns to everyone:\nyugabyte=# GRANT SELECT\n\
    (user_name, uid, gid, real_name, home_phone, extra_info, home_dir, shell) ON\npasswd TO public;\nGRANT\nGrant update to\
    \ only the sensitive columns:\nyugabyte=# GRANT UPDATE\n(pwhash, real_name, home_phone, extra_info, shell) ON passwd TO\
    \ public;\nGRANT\nEnsure that no one has been granted Bypass RLS inadvertently, by running the psql\ndisplay command \\\
    du+. If unauthorized users do have Bypass RLS granted then\nresolve this using the ALTER ROLE <user> NOBYPASSRLS; command.\
    \ You can now\nverify that 'admin', 'bob', and 'alice' are properly restricted by querying the passwd table\nas each of\
    \ these roles.\nUse the yb-tserver binary and its flags to configure the YB-TServer server. Add the\nfollowing GFLAG to\
    \ YB-TServer:\n./bin/yb-tserver --use_cassandra_authentication=true\nChange the password for the cassandra role by issuing\
    \ the following command:\ncassandra@ycqlsh> ALTER ROLE cassandra WITH PASSWORD = 'new_password';\nWhere 'new_password'\
    \ is replaced with the password of your choosing.\nVerify the default password no longer works:\n./bin/ycqlsh -u cassandra\
    \ -p cassandra\nConnection error:\n  ... Provided username 'cassandra' and/or password are incorrect ...\nYou can now\
    \ connect to the cluster using the new password:\n./bin/ycqlsh -u cassandra -p new_password\nTo remediate a misconfiguration,\
    \ perform the following steps:\n1. Execute the following command:\ncreate role '<NEW_ROLE_HERE>' with password='<NEW_PASSWORD_HERE>'\
    \ and\nlogin=TRUE and superuser=TRUE ;\ngrant all permissions on all keyspaces to <NEW_ROLE_HERE>;\nNote: Replace <NEW_ROLE_HERE>\
    \ with the desired role and <NEW_PASSWORD_HERE> with\na password.\n1. Verify the new role is working.\n2. Remove the superuser\
    \ role from the cassandra account by executing the\nfollowing command:\nALTER ROLE cassandra WITH SUPERUSER=FALSE;\nTo\
    \ enhance security further, disable login ability for this role by issuing the following\ncommand:\nALTER ROLE cassandra\
    \ WITH LOGIN=FALSE;\nRemove any unnecessary roles and/or permissions in accordance with organizational\nneeds.\nDrop unnecessary\
    \ roles by issuing the following command:\ncassandra@ycqlsh> DROP ROLE IF EXISTS developer\nAlternatively, you can revoke\
    \ permissions. For example, you can revoke the\nengineering role from the user john as follows:\ncassandra@ycqlsh> REVOKE\
    \ engineering FROM john;\nUse the yb-tserver binary and its flags to configure the YB-TServer server. Add the\nfollowing\
    \ GFLAG to YB-TServer:\n./bin/yb-tserver --cql_proxy_bind_address <ip address>:<port>\nAdd the --ysql_enable_auth=true\
    \ GFlag to each YB-TServer service startup\nconfiguration:\n./bin/yb-tserver --ysql_enable_auth=true [other flags...]\n\
    Restart the YB-TServer process for the change to take effect. Verify using the audit\nprocedure above.\nNote: On YugabyteDB\
    \ 2024.2 and 2025.1 (and clusters upgraded from those releases),\nenabling ysql_enable_auth auto-generates md5-based HBA\
    \ rules. Configure explicit\nHBA rules per Recommendation 5.8 and set password_encryption per\nRecommendation 5.9 to enforce\
    \ SCRAM-SHA-256 end to end.\nChange the default password for the yugabyte superuser:\nyugabyte=# ALTER ROLE yugabyte WITH\
