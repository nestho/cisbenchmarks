- id: 3.1.21
  title: Ensure 'log_line_prefix' is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: 'The log_line_prefix setting specifies a printf-style string that is prefixed to each logline. If blank, no
    prefix is used. You should configure this as recommended by the pgBadger development team unless directed otherwise by
    your organization''s logging policy. % characters begin "escape sequences" that are replaced with status information as
    outlined below. Unrecognized escapes are ignored. Other characters are copied straight to the logline. Some escapes are
    only recognized by session processes and will be treated as empty by background processes such as the main server process.
    Status information may be aligned either left or right by specifying a numeric literal after the % and before the option.
    A negative value will cause the status information to be padded on the right with spaces to give it a minimum width, whereas
    a positive value will pad on the left. Padding can be useful to aid human readability in log files. Any of the following
    escape sequences can be used: %a = application name %u = user name %d = database name %r = remote host and port %h = remote
    host %b = backend type %p = process ID %t = timestamp without milliseconds %m = timestamp with milliseconds %n = timestamp
    with milliseconds (as a Unix epoch) %Q = query ID (0 if none or not computed) %i = command tag %e = SQL state %c = session
    ID %l = session line number %s = session start timestamp %v = virtual transaction ID %x = transaction ID (0 if none) %q
    = stop here in non-session processes %% = ''%'''
  rationale: Properly setting log_line_prefix allows for adding additional information to each log entry (such as the user,
    or the database). Said information may then be of use in auditing or security reviews.
  impact: ''
  references:
  - 1. https://pgbadger.darold.net/
  - 2. https://docs.yugabyte.com/preview/reference/configuration/
  page_start: 76
  audit_raw: "Execute the following YSQL statement to verify the setting is correct:\nyugabyte=# show log_line_prefix;\n log_line_prefix\n\
    -----------------\n %m [%p]\n(1 row)\nIf the prefix does not at a minimum include %m [%p]: [%l-1]\ndb=%d,user=%u,app=%a,client=%h,\
    \ this is a fail."
  remediation: 'Use the yb-tserver binary and its flags to configure the YB-TServer server. Add the

    following GFLAG to YB-TServer:

    ./bin/yb-tserver --ysql_pg_conf_csv="\"log_line_prefix=''%m [%p]: [%l-1]

    db=%d,user=%u,app=%a,client=%h ''\""'
  checks:
