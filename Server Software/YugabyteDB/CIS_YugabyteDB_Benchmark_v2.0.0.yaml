  audit_raw: "Execute the following YSQL statement:\nyugabyte=# show log_timezone;\n log_timezone\n--------------\n UTC\n\
    (1 row)\nIf log_timezone is not set to GMT, UTC, or as defined by your organization's logging\npolicy this is a fail.\n\
    Execute the following YSQL statement to verify pgAudit is enabled:\nyugabyte=# show shared_preload_libraries ;\n     \
    \          shared_preload_libraries\n-------------------------------------------------------\n pg_stat_statements,yb_pg_metrics,pgaudit,pg_hint_plan\n\
    (1 row)\nIf the output does not contain pgaudit, this is a FAIL.\nNext, verify that the required audit scope is configured:\n\
    yugabyte=# show pgaudit.log;\n pgaudit.log\n-------------\n none\n(1 row)\nIf pgaudit.log does not include at minimum\
    \ WRITE, DDL, ROLE, and MISC, this is a\nFAIL.\nPass criteria: pgaudit appears in shared_preload_libraries AND pgaudit.log\
    \ is\nset to include at minimum WRITE, DDL, ROLE, MISC.\nRun the following command to verify whether auditing is enabled\
    \ on the YCQL interface\nof the YugabyteDB server.\ncat ts.config | grep ycql_enable_audit_log\nIf not configured to true,\
    \ this is a fail.\nLog in as an Operating System user authorized to escalate privileges and test the sudo\ninvocation\
    \ by executing the following:\nwhoami user1\n# groups user1\n# sudo su - yugabyte\n[sudo] password for user1:\nuser1 is\
    \ not in the sudoers file. This incident will be reported.\nAs shown above, user1 has not been added to the /etc/sudoers\
    \ file or made a\nmember of any group listed in the /etc/sudoers file. Whereas:\n# whoami user2\n# groups user2 dba\n\
    # sudo su - yugabyte [sudo] password for user2:\n# whoami\nyugabyte\nThis shows that the user2 user is configured properly\
    \ for sudo access by being a\nmember of the dba group.\nFirst, inspect the privileges granted to the database superuser\
    \ (identified here as\nyugabyte) using the display command ysqlsh -c \"\\du yugabyte\" to establish a baseline\nfor granted\
    \ administrative privileges. Based on the output below, the yugabyte\nsuperuser can create roles, create databases, manage\
    \ replication, and bypass rowlevel security (RLS):\n# whoami\nyugabyte\n# ysqlsh -c \"\\du yugabyte\"\nNow, let's inspect\
    \ the same information for a mock regular user called appuser using\nthe display command ysqlsh -c \"\\du appuser\". The\
    \ output confirms that regular user\nappuser has the same elevated privileges as system administrator user yugabyte. This\n\
    is a fail.\nWhile this example demonstrated excessive administrative privileges granted to a single\nuser, a comprehensive\
    \ audit should be conducted to inspect all database users for\nexcessive administrative privileges. This can be accomplished\
    \ via either of the\ncommands below.\n# whoami\nyugabyte\n# ysqlsh -c \"\\du *\"\n# ysqlsh -c \"select * from pg_user\
    \ order by usename\"\nNOTE Using \\du * will show all the default YugabyteDB roles (e.g. pg_monitor) as\nwell as any 'normal'\
    \ roles. This is expected, and should not be cause for alarm.\nFunctions in YugabyteDB can be created with the SECURITY\
    \ DEFINER option. When\nSECURITY DEFINER functions are executed by a user, said function is run with the\nprivileges of\
    \ the user who created it, not the user who is running it. To list all functions\nthat have SECURITY DEFINER, run the\
    \ following YSQL:\n# whoami root\n# sudo su - yugabyte\n# ysqlsh -c \"SELECT nspname, proname, proargtypes, prosecdef,\
    \ rolname,\nproconfig FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid JOIN\npg_authid a ON a.oid = p.proowner\
    \ WHERE prosecdef OR NOT proconfig IS NULL;\"\nIn the query results, a prosecdef value of 't' on a row indicates that\
    \ that function uses\nprivilege elevation.\nIf elevation privileges are utilized which are not required or are expressly\
    \ forbidden by\norganizational guidance, this is a fail.\nTo audit excessive DML privileges, take an inventory of all\
    \ users defined in the cluster\nusing the \\du+ * YSQL command, as well as all tables defined in the database using\n\
    the \\dt *.* YSQL command. Furthermore, the intersection matrix of tables and user\ngrants can be obtained by querying\
    \ system catalogs pg_tables and pg_user. Note that\nin YugabyteDB, users are defined cluster-wide across all databases,\
    \ while schemas\nand tables are specific to a particular database. Therefore, the commands below should\nbe executed for\
    \ each defined database in the cluster. With this information, inspect\ndatabase table grants and determine if any are\
    \ excessive for defined database users.\nyugabyte=# -- display all users defined in the cluster\nyugabyte=# \\x Expanded\
    \ display is on.\nyugabyte=# \\du+ *\nList of roles\n-[ RECORD 1 ]\nRole name | pg_database_owner Attributes | Cannot\
    \ login Member of |\n{}\nDescription |\n-[ RECORD 2 ]\nRole name | pg_execute_server_program Attributes | Cannot login\n\
    Member of | {} Description |\n-[ RECORD 3 ]\nRole name | pg_monitor Attributes | Cannot login\nMember of | {pg_read_all_settings,pg_read_all_stats,pg_stat_scan_tables}\n\
    Description |\n-[ RECORD 4 ]\nRole name | pg_read_all_data Attributes | Cannot login Member of |\n{}\nDescription |\n\
    -[ RECORD 5 ]\nRole name | pg_read_all_settings Attributes | Cannot login\nMember of | {} Description |\n-[ RECORD 6 ]\n\
    Role name | pg_read_all_stats Attributes | Cannot login Member of |\n{}\nDescription |\n-[ RECORD 7 ]\nRole name | pg_read_server_files\
    \ Attributes | Cannot login\nMember of | {} Description |\n-[ RECORD 8 ]\nRole name | pg_signal_backend Attributes | Cannot\
    \ login Member of |\n{}\nDescription |\n-[ RECORD 9 ]\nRole name | pg_stat_scan_tables Attributes | Cannot login\nMember\
    \ of | {} Description |\n-[ RECORD 10 ]\nRole name | pg_write_all_data Attributes | Cannot login Member of |\n{}\nDescription\
    \ |\n-[ RECORD 11 ]\nRole name | pg_write_server_files Attributes | Cannot login\nMember of | {} Description |\n-[ RECORD\
    \ 12 ]\nRole name | postgres\nAttributes | Superuser, Create role, Create DB, Replication, Bypass RLS\nMember of | {}\n\
    Description |\nyugabyte=# -- display all schema.tables created in current database\nyugabyte=# \\x\nExpanded display is\
    \ off. postgres=# \\dt+ *.*\nList of relations\n|  | | | | |Descr- Schema | Name\n |Type | Owner |Persistence| Size |iption\n\
    \  + + + + + +\ninformation_schema|sql_features |table|postgres| permanent |104 kB|\ninformation_schema|sql_ |table|postgres|\
    \ permanent |48 kB |\nyugabyte=# -- query all tables and user grants in current database yugabyte=#\n-- the system catalogs\
    \ 'information_schema' and 'pg_catalog' are excluded\nyugabyte=# select t.schemaname, t.tablename, u.usename,\nhas_table_privilege(u.usename,\
    \ t.tablename, 'select') as select,\nhas_table_privilege(u.usename, t.tablename, 'insert') as insert,\nhas_table_privilege(u.usename,\
    \ t.tablename, 'update') as update,\nhas_table_privilege(u.usename, t.tablename, 'delete') as delete\nfrom pg_tables t,\
    \ pg_user u\nwhere t.schemaname not in ('information_schema','pg_catalog');\nschemaname | tablename | usename | select\
    \ | insert | update | delete\n  + + + + + +  (0 rows)\nFor the example below, we illustrate using a single table customer\
    \ and two\napplication users appwriter and appreader. The intention is for appwriter to have\nfull select, insert, update,\
    \ and delete rights and for appreader to only have select rights.\nWe can query these privileges with the example below\
    \ using the\nhas_table_privilege function and filtering for just the table and roles in question.\nyugabyte=# select t.tablename,\
    \ u.usename, has_table_privilege(u.usename,\nt.tablename, 'select') as select, has_table_privilege(u.usename, t.tablename,\n\
    'insert') as insert, has_table_privilege(u.usename, t.tablename, 'update') as\nupdate, has_table_privilege(u.usename,\
    \ t.tablename, 'delete') as delete\nfrom pg_tables t, pg_user u where t.tablename = 'customer'\nand u.usename in ('appwriter','appreader');\n\
    tablename | usename | select | insert | update | delete\n  + + + + +\nAs depicted, both users have full privileges for\
    \ the customer table. This is a fail. When\ninspecting database-wide results for all users and all table grants, employ\
    \ a\ncomprehensive approach. Collaboration with application developers is paramount to\ncollectively determine only those\
    \ database users that require specific DML privileges\nand on which tables.\nThe first step for an organization is to\
    \ determine which, if any, database tables require\nRLS. This decision is a matter of business processes and is unique\
    \ to each\norganization. To discover which, if any, database tables have RLS enabled, execute the\nfollowing query. If\
    \ any table(s) should have RLS policies applied, but do not appear in\nquery results, then this is a fail.\nyugabyte=#\
    \ SELECT oid, relname, relrowsecurity FROM pg_class WHERE\nrelrowsecurity IS TRUE;\nBased on the results below we can\
    \ see RLS is not enabled. Assuming this table should\nbe RLS enabled but is not, this is a fail.\nyugabyte=# SELECT oid,\
    \ relname, relrowsecurity FROM pg_class WHERE relname =\n'passwd';\noid | relname | relrowsecurity\n  + +  24679 | passwd\
    \ | f\n(1 row)\nFurther inspection of RLS policies is provided via the system catalog pg_policy, which\nrecords policy\
    \ details including table OID, policy name, applicable commands, the roles\nassigned a policy, and the USING and WITH\
    \ CHECK clauses. Finally, RLS and associated\npolicies (if implemented) may also be viewed using the standard ysqlsh display\n\
    command \\d+ schema.table which lists RLS information as part of the table\ndescription. Should you implement Row Level\
    \ Security and apply restrictive policies to\ncertain users, it's imperative that you check each user's role definition\
    \ via the ysqlsh\ndisplay command \\du and ensure unauthorized users have not been granted Bypass\nRLS privilege as this\
    \ would override any RLS enabled tables and associated policies. If\nunauthorized users do have Bypass RLS granted then\
    \ resolve this using the ALTER\nROLE <user> NOBYPASSRLS; command.\nRun the following command to verify whether authentication\
    \ is enabled on the YCQL\ninterface of the YugabyteDB server. The YugabyteDB configuration files can be found in\nthe\
    \ conf directory of tarballs. For packages, the configuration files will be located in\n/home/user/var/conf.\ncat ts.config\
    \ | grep use_cassandra_authentication\nIf use_cassandra_authentication is set to false, then this is a finding.\nConnect\
    \ to YugabyteDB database via YCQL to verify whether the cassandra role has\ndefault password.\n./bin/ycqlsh -u cassandra\
    \ -p cassandra\nIf the connection is successful this is a finding.\nTo verify the configuration, run the following query:\n\
    cassandra@ycqlsh> SELECT role FROM system_auth.roles WHERE is_superuser =\nTrue;\n role\n-----------\n cassandra\n(1 rows)\n\
    If cassandara or any unapproved role is returned, this is a finding.\nAs a superuser, retrieve all roles:\ncassandra@ycqlsh>\
    \ SELECT * FROM system_auth.roles;\n role      | can_login | is_superuser | member_of | salted_hash\n-----------+-----------+--------------+-----------+--------------------------\n\
    ----------------------------------------------------\n cassandra |      True |         True |          [] |\n$2a$12$vRLGwscF9sTH4MBbwhw22.VAVHtfTo/n327eNfB7VBcZVomNOIcQu\\\
    x00\\x7f\\x00\\x00\n(1 rows)\nRetrieve all permissions for all roles\ncassandra@ycqlsh> select * from system_auth.role_permissions;\n\
    \ role | resource | permissions\n------+----------+-------------\n(0 rows)\nIf there are any unnecessary roles or roles\
    \ with excessive privileges this is a finding.\nCheck the value of cql_proxy_bind_address in the ts.config. If\ncql_proxy_bind_address\
    \ is set to a non-authorized IP address or port, this is a\nfinding.\ncat ts.config | grep cql_proxy_bind_address\nCheck\
    \ the ysql_enable_auth GFlag value on each YB-TServer node:\ncurl -s http://<tserver-ip>:9000/varz | grep ysql_enable_auth\n\
    Expected output (PASS):\nysql_enable_auth    true\nIf ysql_enable_auth is false or absent, this is a FAIL.\nPass criteria:\
    \ ysql_enable_auth = true on all YB-TServer nodes.\nAttempt to connect to YSQL using the known default credentials:\n\
    psql -h <host> -p 5433 -U yugabyte -W\nWhen prompted, enter the default password (yugabyte).\nPASS: Login fails with an\
    \ authentication error. FAIL: Login succeeds with the default\npassword.\nAlternatively, verify by querying the password\
    \ hash from within a privileged session:\nyugabyte=# SELECT rolname, rolpassword FROM pg_authid WHERE rolname =\n'yugabyte';\n\
    If the password hash matches the default (yugabyte), this is a FAIL. Note: An empty or\nNULL rolpassword when auth is\
    \ enabled is also a FAIL.\nReview the current HBA configuration by querying the pg_hba_file_rules view:\nyugabyte=# SELECT\
    \ line_number, type, database, user_name, address,\nauth_method\nFROM pg_hba_file_rules\nORDER BY line_number;\nExamine\
    \ each row's auth_method column.\nFAIL conditions:\n• Any reachable row with auth_method = 'trust' where type != 'local'\
    \ or\nuser_name != '{yugabyte}'\n• Any reachable row with auth_method = 'md5' or auth_method = 'password'\nA row is reachable\
    \ if no earlier row matches the same connection type, database, user,\nand address scope. Auto-generated trailing rules\
    \ that are fully shadowed by earlier\ncatch-all scram-sha-256 and reject rules (see Remediation) are not reachable and\n\
    may be disregarded.\nAcceptable exception:\n• One row with type = 'local', user_name = '{yugabyte}', auth_method =\n'trust'\
    \ is permitted for local administrative access.\nPass criteria: No reachable HBA entry uses trust (except local yugabyte),\
    \ md5, or\npassword. All reachable entries use scram-sha-256, cert, ldap, radius, or pam.\nNote: On YugabyteDB 2024.2\
    \ and 2025.1, and on clusters upgraded from those\nreleases, enabling ysql_enable_auth auto-generates a trailing host\
    \ all all all\nmd5 rule that cannot be removed from ysql_hba.conf. Because custom\nysql_hba_conf_csv rules are inserted\
    \ above the auto-generated rules, the\nconfiguration shown in the Remediation section shadows the md5 rule and is compliant.\n\
    Beginning with 2025.2, newly created clusters auto-generate scram-sha-256 instead.\nExecute the following YSQL statement:\n\
    yugabyte=# SHOW password_encryption;\n password_encryption\n---------------------\n scram-sha-256\n(1 row)\nIf password_encryption\
    \ is not scram-sha-256, this is a FAIL.\nPass criteria: password_encryption = scram-sha-256.\nNewly created data clusters\
    \ are empty of data and have two user accounts, the\nsuperusers yugabyte and postgres. By default, the data cluster superuser\
    \ is named\nafter the UNIX account yugabyte. Login authentication is tested via UNIX DOMAIN\nSOCKETS by the UNIX user\
    \ account yugabyte, the default account, and set_user has\nnot yet been configured:\n$ whoami\nyugabyte\n$ ./bin/ysqlsh\
    \ -U yugabyte -d yugabyte\nyugabyte=#\nLogin attempts by another UNIX user account as the superuser should be denied:\n\
    $ su - user1\n$ whoami\nuser1\n$ ./bin/ysqlsh -U yugabyte -d yugabyte\nysqlsh: FATAL: Peer authentication failed for user\
    \ \"yugabyte\"\n$ exit\nThis test demonstrates that peer authentication permits each UNIX account to connect\nonly as\
    \ the database role matching its own account name:\n$ su - user2\n$ whoami\nuser2\n$ ./bin/ysqlsh -U yugabyte -d yugabyte\n\
    ysqlsh: FATAL: Peer authentication failed for user \"yugabyte\"\n$ ./bin/ysqlsh -U user1 -d yugabyte\nysqlsh: FATAL: Peer\
    \ authentication failed for user \"user1\"\n$ ./bin/ysqlsh -U user2 -d yugabyte\nyugabyte=#\nNewly created data clusters\
    \ are empty of data and have two user accounts, the\nsuperusers yugabyte and postgres. By default, the data cluster superuser\
    \ is named\nafter the UNIX account yugabyte. Login authentication can be tested via TCP/IP\nSOCKETS by any UNIX user account\
    \ from the local host. A password must be\nassigned to each login ROLE:\nyugabyte=# ALTER ROLE yugabyte WITH PASSWORD\
    \ 'secret_password'; ALTER ROLE\nTest an unencrypted session:\n# ./bin/ysqlsh 'host=localhost user=yugabyte sslmode=disable'\
    \ Password:\nTest an encrypted session:\n# ./bin/ysqlsh 'host=localhost user=yugabyte sslmode=require' Password:\nRemote\
    \ logins repeat the previous invocations but, of course, from the remote host:\nTest unencrypted session:\nTest encrypted\
    \ sessions:\n# ./bin/ysqlsh 'host=server-name-or-IP user=yugabyte sslmode=disable'\nPassword:\nTest encrypted sessions:\n\
    # ./bin/ysqlsh 'host=server-name-or-IP user=yugabyte sslmode=require'\nPassword:\nExecute the following YSQL statement\
    \ to retrieve all security-relevant runtime\nparameters listed in the table below:\nyugabyte=# SELECT name, setting, context\n\
    FROM pg_settings\nWHERE name IN (\n  'ignore_system_indexes',\n  'jit_debugging_support',\n  'jit_profiling_support',\n\
    \  'log_connections',\n  'log_disconnections',\n  'allow_system_table_mods',\n  'logging_collector',\n  'shared_preload_libraries',\n\
    \  'password_encryption',\n  'ssl',\n  'log_hostname',\n  'log_line_prefix',\n  'log_statement',\n  'log_error_verbosity',\n\
    \  'session_preload_libraries',\n  'local_preload_libraries'\n)\nORDER BY name;\nCompare the output against the reference\
    \ table below. A FAIL is recorded for any row\nwhere the actual setting value does not match the Required Value.\nParameter\
    \ Required Value Rationale\nignore_system_indexes off\nPrevents\nbypassing\nsystem index\nchecks\njit_debugging_support\
    \ off\nDisables JIT\ndebug hooks\nthat could be\nexploited\njit_profiling_support off\nDisables JIT\nprofiling hooks\n\
    that could be\nexploited\nlog_connections on\nEnsures\nconnection\nevents are\nlogged\nParameter Required Value Rationale\n\
    log_disconnections on\nEnsures\ndisconnection\nevents are\nlogged\nallow_system_table_mods off\nPrevents\nunauthorized\n\
    modification of\nsystem\ncatalogs\nlogging_collector on\nEnsures log\ncollection is\nactive\nshared_preload_libraries\
    \ Must include pgaudit\nEnsures audit\nextension is\nloaded\npassword_encryption scram-sha-256\nRequires\nstrong\npassword\n\
    hashing\nssl on Ensures TLS\nis enabled\nlog_hostname off\nPrevents DNS\nlookups that\ncould cause\nlog delays or\nspoofing\n\
    log_line_prefix Must include %m [%p]; [%l-1]\ndb=%d,user=%u,app=%a,client=%h\nEnsures audit\ntrail includes\nrequired\n\
    context fields\nlog_statement ddl or stricter (mod or all)\nEnsures DDL\nchanges are\nlogged\nParameter Required Value\
    \ Rationale\nlog_error_verbosity default or verbose\nEnsures\nsufficient error\ndetail for\nauditing\nsession_preload_libraries\
    \ Empty (not set)\nPrevents\nunauthorized\nlibrary loading\nper session\nlocal_preload_libraries Empty (not set)\nPrevents\n\
    unauthorized\nlibrary loading\nby users\nPass criteria: All parameters match their required values in the table above.\n\
    To determine whether TLS is enabled, simply query the parameter value while logged\ninto the database using either the\
    \ SHOW ssl command or SELECT from system catalog\nview pg_settings as illustrated below. If the returned value is off,\
    \ this is a fail (as in\nthe example output below).\nyugabyte=# SHOW ssl;\n ssl\n-----\n off\n(1 row)\nTo determine whether\
    \ TLS is enabled, simply query the parameter value while logged\ninto the database using either the SHOW ssl command or\
    \ SELECT from system catalog\nview pg_settings as illustrated below. In both cases, ssl is off; this is a fail.\nyugabyte=#\
    \ SHOW ssl;\n ssl\n-----\n off\n(1 row)\nIf ssl is off, this is a FAIL for YSQL.\nYCQL TLS Verification:\nTo verify TLS\
    \ is enabled for YCQL connections, check the YB-TServer GFlag values on\neach node:\ncurl -s http://<tserver-ip>:9000/varz\
    \ | grep -E\n\"use_client_to_server_encryption|allow_insecure_connections\"\nExpected output (PASS):\nuse_client_to_server_encryption\
    \    true\nallow_insecure_connections         false\nIf use_client_to_server_encryption is false or allow_insecure_connections\
    \ is\ntrue, this is a FAIL for YCQL.\nPass criteria: ssl = on for YSQL AND use_client_to_server_encryption = true\nAND\
    \ allow_insecure_connections = false for YCQL.\nOne possible way to encrypt data within YugabyeDB is to use the pgcrypto\
    \ extension.\nTo check if pgcrypto is installed on YugabyteDB, as a database administrator run the\nfollowing commands:\n\
    yugabyte=# SELECT * FROM pg_available_extensions WHERE name='pgcrypto';\n   name   | default_version | installed_version\
    \ |         comment\n----------+-----------------+-------------------+-------------------------\n pgcrypto | 1.3     \
    \        |                   | cryptographic functions\n(1 row)\nIf data in the database requires encryption and pgcrypto\
    \ is not available, this is a fail. If\ndisk or filesystem requires encryption, ask the system owner, DBA, and SA to\n\
    demonstrate the use of disk-level encryption. If this is required and is not found, this is a\nfail. If controls do not\
    \ exist or are not enabled, this is also a fail.\n1. Verify that at least one snapshot schedule exists by executing the\n\
    list_snapshot_schedules command:\n./bin/yb-admin -master_addresses <ip1:7100,ip2:7100,ip3:7100>\nlist_snapshot_schedules\n\
    The output should list one or more active snapshot schedules. If no schedules are\nlisted, this is a FAIL.\n2. Verify\
    \ that the most recent snapshot in the schedule has a state of COMPLETE:\n./bin/yb-admin -master_addresses <ip1:7100,ip2:7100,ip3:7100>\
    \ list_snapshots\nReview the State column in the output. If no snapshot has a state of COMPLETE, or if the\nmost recent\
    \ snapshot has a state of FAILED or CREATING, this is a FAIL.\nPass criteria: At least one active snapshot schedule exists\
    \ AND at least one snapshot\nhas state = COMPLETE."
  remediation: "Use the yb-tserver binary and its flags to configure the YB-TServer server (in this\nexample, setting it to\
    \ UTC). Add the following GFLAG to YB-TServer:\n./bin/yb-tserver --ysql_pg_conf_csv=“log_timezone='UTC'”\nAfter configuring\
    \ the YB-TServer and starting the cluster, create the pgAudit extension\nby executing the following YSQL statement:\n\
    yugabyte=# CREATE EXTENSION IF NOT EXISTS pgaudit;\nCREATE EXTENSION\nYou only need to run this statement on a single\
    \ node, and it will apply across your\ncluster.\nUse the yb-tserver binary to configure the required audit scope. Add\
    \ the following\nGFlag to YB-TServer:\n./bin/yb-tserver --ysql_pg_conf_csv=\"pgaudit.log='WRITE, DDL, ROLE,\nMISC',pgaudit.log_level=notice,pgaudit.log_client=ON\"\
    \nThis sets the minimum recommended audit scope: WRITE\n(INSERT/UPDATE/DELETE/TRUNCATE), DDL (CREATE/ALTER/DROP), ROLE\n\
    (GRANT/REVOKE), and MISC (DISCARD/FETCH/CHECKPOINT/VACUUM).\nUse the yb-tserver binary and its flags to configure the\
    \ YB-TServer server. Add the\nfollowing GFLAG to YB-TServer:\n./bin/yb-tserver <options> --ycql_enable_audit_log=true\n\
    As superuser root, execute the following commands:\n# echo '%dba ALL= /bin/su - yugabyte' > /etc/sudoers.d/yugabyte\n\
    # chmod 600 /etc/sudoers.d/yugabyte\nThis grants any Operating System user that is a member of the dba group to use sudo\n\
    su - yugabyte to become the yugabyte user. Ensure that all Operating System user's\nthat need such access are members\
    \ of the group.\nIf any regular or application users have been granted excessive administrative rights,\nthose privileges\
    \ should be removed immediately via the Yugabyte ALTER ROLE YSQL\ncommand. Using the same example above, the following\
    \ YSQL statements revoke all\nunnecessary elevated administrative privileges from the regular user appuser:\n# whoami\n\
    yugabyte\n# ysqlsh -c \"ALTER ROLE appuser NOSUPERUSER;\" ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOCREATEROLE;\"\
    \ ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOCREATEDB;\" ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOREPLICATION;\"\
    \ ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOBYPASSRLS;\" ALTER ROLE\n# ysqlsh -c \"ALTER ROLE appuser NOINHERIT;\"\
    \ ALTER ROLE\nVerify the appuser now passes your check by having no defined Attributes:\n# whoami\nyugabyte\n# ysqlsh\
    \ -c \"\\du appuser\"\nList of roles\nRole name | Attributes | Member of\n  + +  appuser | | {}\nWhere possible, revoke\
    \ SECURITY DEFINER on YugabyteDB functions. To change a\nSECURITY DEFINER function to SECURITY INVOKER, run the following\
    \ YSQL:\n# whoami root\n# sudo su - yugabyte\n# ysqlsh -c \"ALTER FUNCTION [functionname] SECURITY INVOKER;\"\nIf it is\
    \ not possible to revoke SECURITY DEFINER, ensure the function can be executed\nby only the accounts that absolutely need\
    \ such functionality:\nyugabyte=# SELECT proname, proacl FROM pg_proc WHERE proname =\n'delete_customer';\nproname | proacl\n\
    \  +  delete_customer |\n{=X/postgres,postgres=X/postgres,appwriter=X/postgres}\n(1 row)\nyugabyte=# REVOKE EXECUTE ON\
    \ FUNCTION delete_customer(integer,boolean) FROM\nappreader;\nREVOKE\nyugabyte=# SELECT proname, proacl FROM pg_proc WHERE\
    \ proname =\n'delete_customer';\nproname | proacl\n  +  delete_customer | {=X/postgres,postgres=X/postgres}\n(1 row)\n\
    Based on the output above, appreader=X/postgres no longer exists in the proacl\ncolumn results returned from the query\
    \ and confirms appreader is no longer granted\nexecute privilege on the function.\nIf a given database user has been granted\
    \ excessive DML privileges for a given\ndatabase table, those privileges should be revoked immediately using the REVOKE\n\
    YSQL command.\nContinuing with the example above, remove unauthorized grants for appreader user\nusing the REVOKE statement\
    \ and verify the Boolean values are now false.\nyugabyte=# REVOKE INSERT, UPDATE, DELETE ON TABLE customer FROM appreader;\n\
    REVOKE\nyugabyte=# select t.tablename, u.usename, has_table_privilege(u.usename,\nt.tablename, 'select') as select, has_table_privilege(u.usename,\
    \ t.tablename,\n'insert') as insert, has_table_privilege(u.usename, t.tablename, 'update') as\nupdate, has_table_privilege(u.usename,\
    \ t.tablename, 'delete') as delete\nfrom pg_tables t, pg_user u where t.tablename = 'customer'\nand u.usename in ('appwriter','appreader');\n\
    tablename | usename | select | insert | update | delete\n  + + + + +\nIn this example, we are using the using the example\
    \ passwd table. We will create three\ndatabase roles to illustrate the workings of RLS:\nyugabyte=# CREATE ROLE admin;\
    \ CREATE ROLE\nyugabyte=# CREATE ROLE bob; CREATE ROLE\nyugabyte=# CREATE ROLE alice; CREATE ROLE\nNow, we will insert\
    \ known data into the passwd table:\nyugabyte=# INSERT INTO passwd VALUES\n('admin','xxx',0,0,'Admin','111-222-3333',null,'/root','/bin/dash');\n\
    INSERT 0 1\nyugabyte=# INSERT INTO passwd VALUES\n('bob','xxx',1,1,'Bob','123-456-7890',null,'/home/bob','/bin/zsh');\n\
    INSERT 0 1\nyugabyte=# INSERT INTO passwd VALUES\n('alice','xxx',2,1,'Alice','098-765-4321',null,'/home/alice','/bin/zsh');\n\
    INSERT 0 1\nAnd we will enable RLS on the table:\nyugabyte=# ALTER TABLE passwd ENABLE ROW LEVEL SECURITY; ALTER TABLE\n\
    Now that RLS is enabled, we need to define one or more policies. Create the\nadministrator policy and allow it access\
    \ to all rows:\nyugabyte=# CREATE POLICY admin_all ON passwd TO admin USING (true) WITH CHECK\n(true);\nCREATE POLICY\n\
    Create a policy for normal users to view all rows:\nyugabyte=# CREATE POLICY all_view ON passwd FOR SELECT USING (true);\
    \ CREATE\nPOLICY\nCreate a policy for normal users that allows them to update only their own rows and to\nlimit what values\
    \ can be set for their login shell:\nyugabyte=# CREATE POLICY user_mod ON passwd FOR UPDATE USING (current_user =\nuser_name)\n\
