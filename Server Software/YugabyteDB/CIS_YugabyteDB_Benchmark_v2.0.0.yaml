    \ reachable entries use strong\nauthentication, and terminate the list with a reject catch-all to neutralize any autogenerated\
    \ rules:\n./bin/yb-tserver \\\n  --ysql_hba_conf_csv='local all yugabyte trust,host all all 0.0.0.0/0 scramsha-256,host\
    \ all all ::0/0 scram-sha-256,host all all all reject'\nAdjust based on your network topology. If using LDAP, replace\
