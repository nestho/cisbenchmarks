- id: 3.1.23
  title: Ensure 'log_timezone' is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  - Level 2 - Yugabyte
  description: 'The log_timezone setting specifies the time zone to use in timestamps within log messages. This value is cluster-wide,
    so that all sessions will report timestamps consistently. Unless directed otherwise by your organization''s logging policy,
    set this to either GMT or UTC. The YugabyteDB Audit Extension (pgAudit) provides detailed session and/or object audit
    logging via the standard YugabyteDB logging facility. The goal of pgAudit is to provide YugabyteDB users with the capability
    to produce audit logs often required to comply with government, financial, or ISO certifications. Audit logging can be
    used to record information about YCQL statements or events (such as login events) and log the records on a per-node basis
    into the YB-Tserver logs. Audit logging can be enabled on YugabyteDB cluster by setting the ycql_enable_audit_log TServer
    flag to true. By default, each TServer records all login events and YCQL commands issued to the server. Audit record is
    logged before an operation attempts to be executed, and failures are audited as well. If an operation fails to execute,
    both operation execution and failure are logged. However, an error that happens during parsing or analysis of YCQL statement
    results only in an error audit record to be logged. YCQL audit logging can be further customized using additional YB-TServer
    flags. It is common to have more than one authorized individual administering the YugabyteDB service at the Operating
    System level. It is also quite common to permit login privileges to individuals on a YugabyteDB host who otherwise are
    not authorized to access the server''s data cluster and files. Administering the YugabyteDB data cluster, as opposed to
    its data, is to be accomplished via a localhost login of a regular UNIX user account. Access to the yugabyte superuser
    account is restricted in such a manner as to interdict unauthorized access. sudo satisfies the requirements by escalating
    ordinary user account privileges as the YugabyteDB RDBMS superuser. With respect to YugabyteDB administrative YSQL commands,
    only superusers should have elevated privileges. YugabyteDB regular, or application, users should not possess the ability
    to create roles, create new databases, manage replication, or perform any other action deemed privileged. Typically, regular
    users should only be granted the minimal set of privileges commensurate with managing the application: • DDL (create table,
    create view, create index, etc.) • DML (select, insert, update, delete) Further, it has become best practice to create
    separate roles for DDL and DML. Given an application called ''payroll'', one would create the following users: • payroll_owner
    • payroll_user Any DDL privileges would be granted to the payroll_owner account only, while DML privileges would be given
    to the payroll_user account only. This prevents accidental creation/altering/dropping of database objects by application
    code that runs as the payroll_user account. In certain situations, to provide the required functionality, YugabyteDB needs
    to execute internal logic (stored procedures, functions, triggers, etc.) and/or external code modules with elevated privileges.
    However, if the privileges required for execution are at a higher level than the privileges assigned to organizational
    users invoking the functionality applications/programs, those users are indirectly provided with greater privileges than
    assigned by their organization. This is known as privilege elevation. Privilege elevation must be utilized only where
    necessary. Execute privileges for application functions should be restricted to authorized users only. DML (insert, update,
    delete) operations at the table level should be restricted to only authorized users. YugabyteDB manages table-level DML
    permissions via the GRANT statement. In addition to the YSQL-standard privilege system available through GRANT, tables
    can have row security policies that restrict, on a per-user basis, which individual rows can be returned by normal queries
    or inserted, updated, or deleted by data modification commands. This feature is also known as Row Level Security (RLS).
    By default, tables do not have any policies, so if a user has access privileges to a table according to the YSQL privilege
    system, all rows within it are equally available for querying or updating. Row security policies can be specific to commands,
    to roles, or to both. A policy can be specified to apply to ALL commands, or to any combination of SELECT, INSERT, UPDATE,
    or DELETE. Multiple roles can be assigned to a given policy, and normal role membership and inheritance rules apply. If
    you use RLS and apply restrictive policies to certain users, it is important that the Bypass RLS privilege not be granted
    to any unauthorized users. This privilege overrides RLS- enabled tables and associated policies. Generally, only superusers
    and elevated users should possess this privilege. YCQL authentication is based on roles. Roles can be created with superuser,
    nonsuperuser, and login privileges. New roles can be created, and existing ones altered or dropped by administrators using
    YCQL commands. The cassandra role has a default password which must be changed. The default installation of YugabyteDB
    includes a superuser role named cassandra. This necessitates the creation of a separate role to be the superuser role.
    Verify each role is required and has only the privileges needed to do its job. The cql_proxy_bind_address GFLAG setting
    specifies the IP address and port for YCQL interface. cql_proxy_bind_address should be set according to your organization''s
    approved IP address and ports policy. The ysql_enable_auth GFlag controls whether password authentication is required
    for YSQL connections. When set to false (the default), connections are accepted without authentication, which is only
    appropriate for isolated development environments. In all other environments, this flag must be enabled to enforce password-based
    access control for the YSQL interface. The yugabyte role is the built-in YSQL superuser in YugabyteDB. By default, it
    has a well-known password. This default password must be changed before the cluster is deployed to a non-development environment.
    Leaving the default password in place allows anyone with knowledge of the default to gain full superuser access to all
    databases in the cluster. The ysql_hba_conf_csv GFlag controls the Host-Based Authentication (HBA) rules for YSQL connections.
    The authentication methods trust (no password required), md5 (MD5-hashed passwords), and password (cleartext passwords
    over the wire) are considered weak and should not be used in production environments. The only permissible exception is
    trust for the local yugabyte superuser on the Unix socket for administrative access from the database node itself. The
    password_encryption parameter controls the algorithm used to hash passwords set by CREATE ROLE and ALTER ROLE statements.
    When set to md5 or on (which maps to md5), passwords are stored using MD5 which is cryptographically weak. Setting this
    to scram-sha-256 ensures passwords are stored using SCRAM-SHA-256, which provides strong security against offline password
    cracking attacks. A remote host login, via SSH, is arguably the most secure means of remotely accessing and administering
    the YugabyteDB server. Once connected to the YugabyteDB server, using the ysqlsh client, via UNIX DOMAIN SOCKETS, while
    using the peer authentication method is the most secure mechanism available for local database connections. Provided a
    database user account of the same name of the UNIX account has already been defined in the database, even ordinary user
    accounts can access the cluster in a similarly highly secure manner. A large number of authentication METHODs are available
    for hosts connecting using TCP/IP sockets, including: • trust • reject • md5 • scram-sha-256 • password • gss • sspi •
    ident • pam • ldap • radius • cert METHODs trust, password, and ident are not to be used for remote logins. METHOD md5
    is the most popular and can be used in both encrypted and unencrypted sessions, however, it is vulnerable to packet replay
    attacks. It is recommended that scram- sha-256 be used instead of md5. Use of the gss, sspi, pam, ldap, radius, and cert
    METHODs are dependent upon the availability of external authenticating processes/services and thus are not covered in
    this benchmark. YugabyteDB exposes runtime parameters across five context levels: backend, postmaster, sighup, superuser,
    and user. Unauthorized or misconfigured settings at these levels can enable denial of service, information disclosure,
    audit evasion, or privilege escalation. This control consolidates the security review of all five runtime parameter contexts
    into a single reference, replacing the prior separate controls 7.2–7.6. Only security-relevant parameters with a prescribed
    pass/fail value are listed; operational parameters (e.g., memory tuning, connection limits) are out of scope. YugabyteDB
    clusters can be configured to use server-to-server encryption to protect data in transit between YugabyteDB servers. When
    enabled, Transport Layer Security (TLS), the successor to the deprecated Secure Sockets Layer (SSL), is used to ensure
    data protection for YSQL and YCQL only. Note that there is no planned support for YEDIS. YugabyteDB clusters can be configured
    to use client-to-server encryption to protect data in transit between YugabyteDB servers and clients, tools, and APIs.
    When enabled, Transport Layer Security (TLS), the successor to the deprecated Secure Sockets Layer (SSL), is used to ensure
    data protection for YSQL and YCQL only. Note that there is no planned support for YEDIS. Before you can enable client-to-server
    encryption, you first must enable server-to-server encryption. YugabyteDB must implement cryptographic mechanisms to prevent
    unauthorized disclosure or modification of organization-defined information at rest (to include, at a minimum, PII and
    classified information) on organization-defined information system components. Backup and restoration is the process of
    creating and storing copies of your data for protection against data loss. With a proper backup strategy, you can always
    restore your data to a most-recent known working state and minimize application downtime. This in turn guarantees business
    and application continuity.'
  rationale: 'Log entry timestamps should be configured for an appropriate time zone as defined by your organization''s logging
    policy to ensure a lack of confusion around when a logged event occurred. Note that this setting affects only the timestamps
    present in the logs. It does not affect the time zone in use by the database itself (for example, select now()), nor does
    it affect the host''s time zone. Basic statement logging can be provided by the standard logging facility with log_statement
    = all. This is acceptable for monitoring and other uses but does not provide the level of detail generally required for
    an audit. It is not enough to have a list of all the operations performed against the database, it must also be possible
    to find particular statements that are of interest to an auditor. The standard logging facility shows what the user requested,
    while pgAudit focuses on the details of what happened while the database was satisfying the request. When logging SELECT
    and DML statements, pgAudit can be configured to log a separate entry for each relation referenced in a statement. No
    parsing is required to find all statements that touch a particular table. In fact, the goal is that the statement text
    is provided primarily for deep forensics and should not be required for an audit. Unauthorized attempts to create, drop
    or alter users or data should be a concern. Without sudo, there would be no capabilities to strictly control access to
    the superuser account nor to securely and authoritatively audit its use. By not restricting global administrative commands
    to superusers only, regular users granted excessive privileges may execute administrative commands with unintended and
    undesirable results. Ideally, all application source code should be vetted to validate interactions between the application
    and the logic in the database, but this is usually not possible or feasible with available resources even if the source
    code is available. The DBA should attempt to obtain assurances from the development organization that this issue has been
    addressed and should document what has been discovered. The DBA should also inspect all application logic stored in the
    database (in the form of functions, rules, and triggers) for excessive privileges. Excessive DML grants can lead to unprivileged
    users changing or deleting information without proper authorization. If RLS policies and privileges are not configured
    correctly, users could perform actions on tables that they are not authorized to perform, such as inserting, updating,
    or deleting rows. Authentication is a necessary condition of YugabyteDB’s permissions subsystem, so if authentication
    is disabled then so are permissions. Failure to authenticate clients, users, and/or servers can allow unauthorized access
    to the YugabyteDB database and can prevent tracing actions back to their sources. The authentication mechanism should
    be implemented before anyone accesses the YCQL interface of the YugabyteDB server. Failure to change the default password
    for the cassandra role may pose a risk to the database in the form of unauthorized access. Superuser permissions allow
    for the creation, deletion, and permission management of other users. Considering the Cassandra role is well known it
    should not be a superuser or one which is used for any administrative tasks. Roles which are unneeded, have super user
    or other potentially excessive privileges may be an avenue for a hacker to gain access to or modify data in the database.
    Setting the address or interface to bind to will tell other YCQL applications (e.g. ''ycqlsh'' tool) to which address
    or interface to connect. Without authentication enabled on the YSQL interface, any user with network access to port 5433
    can connect to the database without credentials. This completely undermines all other access control measures and violates
    the principle of least privilege. Default credentials represent a well-known attack vector documented by OWASP and CIS.
    The default yugabyte password grants superuser privileges across all databases, making its exposure a critical vulnerability
    with no compensating controls. The trust method bypasses authentication entirely, allowing any user to connect without
    a password. The md5 method uses weak MD5 hashing and sends password challenge-response over the wire using MD5. The password
    method sends the cleartext password, exposing it to interception. Using scram-sha-256 or certificatebased authentication
    provides strong authentication without these weaknesses. MD5 is cryptographically broken. If an attacker accesses the
    pg_authid catalog, MD5hashed passwords can be cracked rapidly with modern hardware. SCRAM-SHA-256 provides significantly
    stronger protection for stored credential hashes. Peer authentication over UNIX domain sockets ties local database access
    to the operating-system identity of the connecting user, eliminating password exposure for node-local administration.
    A misconfigured local rule (for example, trust for all users) allows any operating-system account on the node to obtain
    database access, including superuser access. TCP/IP connections are the primary remote attack surface of a YugabyteDB
    cluster: any network peer that can reach the YSQL port may attempt to authenticate. Restricting host entries to the narrowest
    practical address ranges, requiring TLS for remote connections, and enforcing strong authentication methods limits both
    unauthorized access attempts and credential interception in transit. A denial of service is possible by denying the use
    of indexes and by slowing down client access to an unreasonable level. Unsanctioned behavior can be introduced by introducing
    rogue libraries which can then be called in a database session. Logging can be altered and obfuscated inhibiting root
    cause analysis. If TLS is not enabled and configured correctly, this increases the risk of data being compromised in transit.
    If TLS is not enabled and configured correctly, this increases the risk of data being compromised in transit. YugabyteDB
    instances handling data that requires "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized
    disclosure and modification of the information at rest. These cryptographic mechanisms may be native to YugabyteDB or
    implemented via additional software or operating system/file system settings, as appropriate to the situation. Information
    at rest refers to the state of information when it is located on a secondary storage device (e.g. disk drive, tape drive)
    within an organizational information system. The selection of a cryptographic mechanism is based on the need to protect
    the integrity of organizational information. The strength of the mechanism is commensurate with the security category
    and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage
    devices (i.e. full disk encryption) or encrypt specific data structures (e.g. files, records, or fields). Organizations
    may also optionally choose to implement both to implement layered security. The decision of whether, and what, to encrypt
    rests with the data owner and is also influenced by the physical measures taken to secure the equipment and media on which
    the information resides. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity
    protection, as appropriate. If the confidentiality and integrity of application data are not protected, the data will
    be open to compromise and unauthorized modification. The YugabyteDB pgcrypto extension provides cryptographic functions
    for YugabyteDB and is intended to address the confidentiality and integrity of user and system information at rest in
    non-mobile devices. Unlike traditional single-instance databases, YugabyteDB is designed for fault tolerance. By maintaining
    at least three copies of your data across multiple data regions or multiple clouds, it makes sure no losses occur if a
    single node or single data region becomes unavailable. Thus, with YugabyteDB, you would mainly use backups to: • Recover
    from a user or software error, such as accidental table removal. • Recover from a disaster scenario, like a full cluster
    failure or a simultaneous outage of multiple data regions. Even though such scenarios are extremely unlikely, it''s still
    a best practice to maintain a way to recover from them. • Maintain a remote copy of data, as required by data protection
    regulations.'
  impact: 'Depending on settings, it is possible for pgAudit to generate an enormous volume of logging. Be careful to determine
    exactly what needs to be audit logged in your environment to avoid logging too much. The separate account must be created,
    assigned the superuser role, and tested for correct functionality prior to removing the superuser role from the cassandra
    account. All changes made on this level will affect the overall behavior of the server. These changes can only be affected
    by a server restart after the parameters have been altered in the configuration files. A self-signed certificate can be
    used for testing, but a certificate signed by a certificate authority (CA) (either one of the global CAs or a local one)
    should be used in production so that clients can verify the server''s identity. If all the database clients are local
    to the organization, using a local CA is recommended. To ultimately enable and enforce TLS authentication for the server,
    appropriate hostssl records must be added to the pg_hba.conf file. Be sure to reload YugabyteDB after any changes (restart
    not required). Note: The hostssl record matches connection attempts made using TCP/IP, but only when the connection is
    made with TLS encryption. The host record matches attempts made using TCP/IP, but allows both TLS and non-TLS connections.
    The hostnossl record matches attempts made using TCP/IP, but only those without TLS. Care should be taken to enforce TLS
    as appropriate. A self-signed certificate can be used for testing, but a certificate signed by a certificate authority
    (CA) (either one of the global CAs or a local one) should be used in production so that clients can verify the server''s
    identity. If all the database clients are local to the organization, using a local CA is recommended. To ultimately enable
    and enforce TLS authentication for the server, appropriate hostssl records must be added to the ysql_hba.conf file. Be
    sure to restart YBTServer after any changes. Note: The hostssl record matches connection attempts made using TCP/IP, but
    only when the connection is made with TLS encryption. The host record matches attempts made using TCP/IP, but allows both
    TLS and non-TLS connections. The hostnossl record matches attempts made using TCP/IP, but only those without TLS. _Care
    should be taken to enforce TLS as appropriate. When considering or undertaking any form of encryption, it is critical
    to understand the state of the encrypted data at all stages of the data lifecycle. The use of pgcrypto ensures that the
    data at rest in the tables (and therefore on disk) is encrypted, but for the data to be accessed by any users or applications,
    said users/applications will, by necessity, have access to the encrypt and decrypt keys and the data in question will
    be encrypted/decrypted in memory and then transferred to/from the user/application in that form.'
