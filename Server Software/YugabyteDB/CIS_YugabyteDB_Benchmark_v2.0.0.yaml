    command: show log_line_prefix;
    severity: medium
    info: "Execute the following YSQL statement to verify the setting is correct:\nyugabyte=# show log_line_prefix;\n log_line_prefix\n\
      -----------------\n %m [%p]\n(1 row)\nIf the prefix does not at a minimum include %m [%p]: [%l-1]\ndb=%d,user=%u,app=%a,client=%h,\
      \ this is a fail."
- id: 3.1.22
  title: Ensure 'log_statement' is set correctly
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: 'The log_statement setting specifies the types of YSQL statements that are logged. Valid values are: • none
    • ddl • mod • all It is recommended this be set to ddl unless otherwise directed by your organization''s logging policy.
    ddl logs all data definition statements: • CREATE • ALTER • DROP mod logs all ddl statements, plus data-modifying statements:
    • INSERT • UPDATE • DELETE • TRUNCATE • COPY FROM (PREPARE, EXECUTE, and EXPLAIN ANALYZE statements are also logged if
    their contained command is of an appropriate type.) For clients using extended query protocol, logging occurs when an
    Execute message is received, and values of the Bind parameters are included (with any embedded singlequote marks doubled).'
  rationale: Setting log_statement to align with your organization's security and logging policies facilitates later auditing
    and review of database activities.
