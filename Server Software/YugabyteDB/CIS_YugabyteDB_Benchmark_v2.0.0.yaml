- id: 3.1.17
  title: Ensure 'log_connections' is enabled
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: Enabling the log_connections setting causes each attempted connection to the server to be logged, as well as
    successful completion of client authentication. This parameter cannot be changed after the session start.
