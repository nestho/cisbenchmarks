    \ 5.9 before creating or altering\nrole passwords. Restart YB-TServer after changes.\nAdd the following GFlag to the YB-TServer\
    \ startup configuration:\n./bin/yb-tserver --ysql_pg_conf_csv=\"password_encryption=scram-sha-256\"\n[other flags...]\n\
    Restart YB-TServer for the change to take effect. Note: Existing MD5-hashed\npasswords must be re-set using ALTER ROLE\
    \ to take advantage of the new hashing\nalgorithm.\nCreation of a database account that matches the local account allows\
    \ PEER\nauthentication:\n# ./bin/ysqlsh -c \"CREATE ROLE user1 WITH LOGIN;\" CREATE ROLE\nExecute the following as the\
    \ UNIX user account, the default authentication rules should\nnow permit the login:\n# su - user1\n# whoami user1\n# ./bin/ysqlsh\
    \ -d yugabyte\nyugabyte=#\nAs per the host-based authentication rules in $PGDATA/pg_hba.conf, all login attempts\nvia\
    \ UNIX DOMAIN SOCKETS are processed on the line beginning with local.\nOnce edited, the server process must reload the\
    \ authentication file before it can take\neffect. Improperly configured rules cannot update i.e. the old rules remain\
    \ in place. The\nYugabyteDB logs will report the outcome of the SIGHUP:\nyugabyte=# select pg_reload_conf();\n pg_reload_conf\n\
    ----------------\n t\n(1 row)\nUse the yb-tserver binary and its flags to configure the YB-TServer server. Add the\nfollowing\
    \ GFLAG to YB-TServer:\n./bin/yb-tserver --ysql_hba_conf_csv\nConfirm a login attempt has been made by looking for a logged\
    \ error message detailing\nthe nature of the authenticating failure. In the case of failed login attempts, whether\nencrypted\
    \ or unencrypted, check the following:\n• The server should be sitting on a port exposed to the remote connecting host\
    \ i.e.\nNOT ip address 127.0.0.1\nlisten_addresses = '*'\n• An authenticating rule must exist in the file ysql_hba.conf\n\
    This example permits only encrypted sessions for the yugabyte role and denies all\nunencrypted sessions for the yugabyte\
    \ role:\n# TYPE DATABASE\nUSER\nADDRESS\nMETHOD\nhostssl all\nyugabyte\n0.0.0.0/0\nscram-sha-256\nhostnossl all\nyugabyte\n\
    0.0.0.0/0\nreject\nThe following examples illustrate other possible configurations. The resultant \"rule\" of\nsuccess/failure\
    \ depends upon the first matching line.\n# allow 'yugabyte' user only from 'localhost/loopback' connections # and only\n\
    if you know the password\n# (accepts both SSL and non-SSL connections)\n# TYPE DATABASE USER ADDRESS METHOD\nhost all\
    \ yugabyte 127.0.0.1/32 scram-sha- 256\n# allow users to connect remotely only to the database named after them, #\nwith\
    \ the correct user password:\n# (accepts both SSL and non-SSL connections)\n# TYPE DATABASE USER ADDRESS METHOD\nhost\
    \ samerole all 0.0.0.0/0 scram-sha- 256\n# allow only those users who are a member of the 'rw' role to connect\n# only\
    \ to the database named after them, with the correct user password:\n# (accepts both SSL and non-SSL connections)\n# TYPE\n\
    DATABASE\nUSER\nADDRESS\nMETHOD\nhost\nsamerole\n+rw\n0.0.0.0/0\nscram-sha256\nSet all required parameters in a single\
    \ --ysql_pg_conf_csv GFlag on every YB-TServer.\nThe flag may be specified only once per process; if it is repeated, only\
    \ the last\noccurrence takes effect. Entries whose values contain commas (such as\nlog_line_prefix) must be enclosed in\
    \ double quotes per the flag's CSV format.\n./bin/yb-tserver \\\n  --\nysql_pg_conf_csv=\"log_connections=on,log_disconnections=on,password_encryptio\n\
    n=scram-sha-256,log_statement=ddl,log_hostname=off,\\\"log_line_prefix='%m\n[%p]; [%l-1] db=%d,user=%u,app=%a,client=%h\
    \ '\\\"\"\nThe remaining parameters in the audit table normally require no remediation:\n• ignore_system_indexes, jit_debugging_support,\
    \ jit_profiling_support,\nallow_system_table_mods, and log_error_verbosity already default to compliant\nvalues; if they\
    \ have been explicitly overridden, remove the overriding entries from\nysql_pg_conf_csv.\n• session_preload_libraries\
    \ and local_preload_libraries are empty by default; if set,\nremove them.\n• shared_preload_libraries includes pgaudit\
    \ by default in YugabyteDB; if it has\nbeen overridden, restore pgaudit to the list rather than constructing a new value\n\
    (see Recommendation 3.2).\n• logging_collector is enabled by default by the YB-TServer.\n• ssl is governed by the use_client_to_server_encryption\
    \ flag; see\nRecommendations 7.2 and 7.3.\nAfter modifying GFlags, restart the YB-TServer process for the changes to take\
    \ effect.\nVerify with:\nSELECT name, setting FROM pg_settings WHERE name = '<parameter_name>';\nBefore you can enable\
    \ and use server-to-server encryption, you need to create and\nconfigure server certificates for each node of your YugabyteDB\
    \ cluster. For information,\nsee: https://docs.yugabyte.com/preview/secure/tls-encryption/server-certificates/\nTo enable\
    \ server-to-server encryption using TLS, start your YB-Master and YB-TServer\nnodes using the following flags.\n• --use_node_to_node_encryption\
    \ Set to true to enable encryption between\nYugabyteDB nodes. Default value is false.\n• --allow_insecure_connections\
    \ Set to false to disallow any service with\nunencrypted communication from joining this cluster. Default value is true.\
    \ Note\nthat this flag requires --use_node_to_node_encryption to be enabled.\n• --certs_for_client_dir Optional. Directory\
    \ containing the certificates created\nfor this node to perform encrypted communication with the other nodes. Default\n\
    for YB-Masters is <data drive>/yb-data/master/data/certs and for YBTServers is <data drive>/yb-data/tserver/data/certs\n\
    You can enable access control by starting the yb-master services with the --\nuse_node_to_node_encryption=true flag as\
    \ described above.\nYour command should look similar to this:\n./bin/yb-master                               \\\n    --fs_data_dirs=<data\
    \ directories>       \\\n    --master_addresses=<master addresses>   \\\n    --certs_dir=/home/centos/tls/$NODE_IP   \\\
    \n    --allow_insecure_connections=false      \\\n    --use_node_to_node_encryption=true\nNext, you can enable access\
    \ control by starting the yb-tserver services using the --\nuse_node_to_node_encryption=true flag described above.\nYour\
    \ command should look similar to this:\n./bin/yb-tserver                                  \\\n    --fs_data_dirs=<data\
    \ directories>           \\\n    --tserver_master_addrs=<master addresses>   \\\n    --certs_dir /home/centos/tls/$NODE_IP\
    \       \\\n    --use_node_to_node_encryption=true &\nFinally, restart YugabyteDB and confirm ssl using commands outlined\
    \ in Audit\nProcedures:\nyugabyte=# SHOW ssl;\n ssl\n-----\n on\n(1 row)\nTo enable client-to-server encryption for YSQL\
    \ and YCQL, start your YB-TServer\nservices with the required flags described below. Your YB-Master services do not\n\
    require additional configuration.\n• --use_client_to_server_encryption Set to true to enable encryption\nbetween the various\
    \ YugabyteDB clients and the database cluster. Default value\nis false.\n• --allow_insecure_connections Set to false to\
    \ disallow any client with\nunencrypted communication from joining this cluster. Default value is true. Note\nthat this\
    \ flag requires --use_client_to_server_encryption to be enabled.\n• --certs_for_client_dir Optional. Defaults to the same\
    \ directory as the\nserver-to-server encryption. This directory should contain the configuration for\nthe client to perform\
    \ TLS communication with the cluster. Default value for YBTServer is\n<data drive>/yb-data/tserver/data/certs.\nTo enable\
    \ access control, follow these steps, start the yb-tserver services with the\nfollowing flag (described above):\n--use_client_to_server_encryption=true\n\
    This flag enables both encrypted and unencrypted clients to connect to the cluster. To\nprevent clients without the appropriate\
    \ encryption from connecting, you must add the\nfollowing flag:\n--allow_insecure_connections=false\nYour command should\
    \ look similar to this:\n./bin/yb-tserver                                       \\\n    --fs_data_dirs=<data directories>\
    \                \\\n    --tserver_master_addrs=<master addresses>        \\\n    --certs_for_client_dir /home/centos/tls/$NODE_IP\
    \ \\\n    --allow_insecure_connections=false               \\\n    --use_client_to_server_encryption=true &\nThe pgcrypto\
    \ extension is included with the YugabyteDB 'contrib' package. Although\nincluded, it needs to be created in the database.\n\
    As the database administrator, run the following:\nyugabyte=# CREATE EXTENSION pgcrypto;\nVerify pgcrypto is installed:\n\
    yugabyte=# SELECT * FROM pg_available_extensions WHERE name='pgcrypto';\n   name   | default_version | installed_version\
    \ |         comment\n----------+-----------------+-------------------+-------------------------\n pgcrypto | 1.3     \
    \        | 1.3               | cryptographic functions\n(1 row)\nUsing distributed snapshots allows you to back up a database\
    \ and then restore it in\ncase of a software or operational error, with minimal recovery time objectives (RTO) and\noverhead.\n\
    To back up a database, create a snapshot using the create_database_snapshot\ncommand, as follows:\n./bin/yb-admin -master_addresses\
    \ <ip1:7100,ip2:7100,ip3:7100>\ncreate_database_snapshot ysql.<database_name>\nA unique ID for the snapshot is returned,\
    \ as shown in the following sample output:\nStarted snapshot creation: 0d4b4935-2c95-4523-95ab-9ead1e95e794\nYou can then\
    \ use this ID to check the status of the snapshot, delete it, or use it to\nrestore the database.\nThe create_database_snapshot\
    \ command exits immediately, but the snapshot may\ntake some time to complete. Before using the snapshot, verify its status\
    \ by executing\nthe list_snapshots command, as follows:\n./bin/yb-admin -master_addresses <ip1:7100,ip2:7100,ip3:7100>\
    \ list_snapshots\nAll the snapshots in the cluster are listed, along with their statuses. You can find the ID\nof the\
    \ new snapshot and make sure it has been completed, as shown in the following\nsample output:\nSnapshot UUID         \
    \                  State       Creation Time\n0d4b4935-2c95-4523-95ab-9ead1e95e794    COMPLETE    2023-04-20\n00:20:38.214201"
