- id: 3.1.16
  title: Ensure 'debug_pretty_print' is enabled
  scoring: scored
  profile:
  - Level 1 - Yugabyte
  description: Enabling debug_pretty_print indents the messages produced by debug_print_parse, debug_print_rewritten, or debug_print_plan
    making them significantly easier to read.
  rationale: If this setting is disabled, the "compact" format is used instead, significantly reducing the readability of
    the DEBUG statement log messages.
  impact: Be advised that the aforementioned DEBUG printing options are disabled, but if your organizational logging policy
    requires them to be on then this option comes into play.
  references:
