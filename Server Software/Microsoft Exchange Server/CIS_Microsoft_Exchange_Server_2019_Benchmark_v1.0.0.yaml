controls:
- id: 2.2.9
  title: '(L1) Ensure ''External send connector authentication: IgnoreStartTLS'' is set to ''False'' (Automated) . 70 2.2.10
    (L1) Ensure ''External send connector authentication: Domain security'' is set to ''True'''
  scoring: scored
  profile:
  - Monitoring the base operating system for vulnerabilities and quickly updating with
  - Monitoring applications and libraries for vulnerabilities and quickly updating with
  - Level 1
  - Level 1 - Edge Services Security
  - Level 1 - Mailbox Services Security
  - Level 1 - MDM Services Security
  - Level 2 - Mailbox Services Security
  - Level 1
  description: 'The Sender ID agent is an antispam agent enabled on Exchange servers that perform the Edge Transport server
    role. Sender ID tries to verify that every e-mail message originates from the Internet domain from which it claims to
    have been sent. Sender ID checks the address of the server that sends the message against a registered list of servers
    that the domain owner has authorized to send e-mail. Sender filtering compares a list of blocked senders that''s maintained
    by the Exchange administrator. Note: For more information on how to create the list for blocked senders, please visit:
    Use the Exchange Management Shell to configure blocked senders and domains for sender filtering Note #2: Sender filtering
    is enabled (by default) on a system performing the Edge Transport server role. Sender reputation filters all messages
    from all receive connectors on that system and only messages from external sources are filtered. External sources are
    defined as nonauthenticated sources, which are considered anonymous internet sources. This recommendation configures several
    parameters: • Enabled parameter enables or disables sender reputation on the Exchange server. • SenderBlockingEnabled
    parameter specifies whether sender reputation blocks senders whose sending system fails an open proxy test. • OpenProxyDetectionEnabled
    parameter specifies whether sender reputation tries to determine whether the sender''s address is an open proxy by connecting
    to the originating IP address. • SrlBlockThreshold specifies the SRL rating that must be met or exceeded for sender reputation
    to block a sender. When the Sender Filter Agent takes on messages from blocked senders or domains, the Action parameter
    is what is used when deciding what to do with these messages. This parameter is used to specify an SMTP address to be
    used as a spam quarantine mailbox. Note: All messages that are equal to or greater than the value set in the SCLQuarantineEnabled
    parameter are sent to the SMTP address set in the QuarantineMailbox parameter. Spam Confidence Level (SCL) is a rating
    assigned to incoming email messages by the Content Filter agent in Exchange Server. It is a measure of the likelihood
    that an email is spam based on various content analysis techniques and spam detection algorithms. The SCL value ranges
    from 0 to 9, with 9 being the highest level of confidence that the email is spam. Ensure SCLQuarantineEnabled is set to
    True This parameter is used to decide if messages whose recipient doesn''t exist in the organization are blocked. When
    this parameter is set to $true, the Recipient Filter Agent blocks these messages. Note: The Set-RecipientFilterConfig
    cmdlet must be enabled The attachment filtering on Edge Transport servers restricts attachments that users receive in
    email messages. Attachment filtering is performed by the Attachment Filtering agent, which is available only on Edge Transport
    servers, and is unchanged from Exchange Server 2010. Ensure the Attachment Filtering Agent is Enabled, and the extension
    filtering list is configured to the desired state. This setting limits the size of a message a user can receive. Receive
    size includes the header This includes the message header, the message body, and any attachments. For internal message
    flow, Exchange Server uses the custom X-MS-ExchangeOrganization-OriginalSize message header to record the original message
    size of the message as it enters the Exchange Server organization. Whenever the message is checked against the specified
    message size limits, the lower value of the current message size or the original message size header is used. The size
    of the message can change because of content conversion, encoding, and agent processing. The Pickup directory is used
    by the Transport service on Mailbox servers and Edge Transport servers to insert message files directly into the transport
    pipeline. When properly formatted email message files are copied to the Pickup directory, they are submitted for delivery
    automatically. It is a legacy feature that can be used by administrators for mail flow testing, or by applications that
    must create and submit their own messages. Ensure PickupDirectoryPath is set to $null This policy setting specifies whether
    the Recipient Filter agent is enabled on the system. The recipient filter uses a recipient block list to identify messages
    that aren''t allowed to enter the organization. The recipient filter also uses the local recipient directory to reject
    messages sent to invalid recipients. This policy setting configures the advertised and accepted authentication mechanisms
    for the receive connector. The primary function of receive connectors in the transport service is to accept authenticated
    and encrypted Simple Mail Transfer Protocol (SMTP) connections from other transport services on the local Mailbox server
    or remote Mailbox servers in the organization. Note: Some available values have dependencies and exclusions: • None is
    not compatible with other values. • BasicAuthRequireTLS requires BasicAuth and Tls. • ExternalAuthoritative can only be
    combined with Tls. • Tls is required when RequireTLS parameter is $true. • ExternalAuthoritative, requires PermissionGroups
    parameter to be ExchangeServers.'
  rationale: Spam consumes a large amount of network bandwidth and server capacity. In addition, it is often the source of
    malicious software. Rejecting messages that have evidence of spoofing will reduce the possibility of users falling victim
    to phishing attacks. Spam consumes a large amount of network bandwidth and server capacity. In addition, it is often the
    source of malicious software. Sender reputation is part of the Microsoft Exchange anti-spam functionality that can help
    with the filtering and blocking of spam messages. Malicious actors can exploit open proxy servers to send spam, launch
    attacks, or engage in other attacks while masking their identity. When Exchange checks if the sender is an OpenProxy this
    can help mitigate attacks from those types of senders. Anonymous emails (messages with blank sender fields) cannot be
    replied to. Emails that are sent with blank sender fields could be trying to hide their true origin and allows them to
    avoid responses and possibly spam receivers of the message. It is less risky and more resource-efficient to filter these
    messages upon receipt rather than forwarding them to be evaluated and risking possible infection. A spam quarantine mailbox
    is necessary to temporarily host filtered messages for evaluation by administrators or users. Having an archive such as
    this can be useful to recover messages that have been wrongfully filtered, prevent data loss, and can be helpful in providing
    a base of analysis so that refinements can be made to the filter in the future. E-mails with a high Spam Confidence Level
    (SCL) will be quarantined. This involves moving it to a designated quarantine e-mail address, separating it from the regular
    inbox of the recipient in order to prevent users interacting with malicious e-mails. Spam originators may use a technique
    that involves first creating fabricated names, and then monitors for rejected emails due to non-existent recipients. Emails
    with names who are not rejected are then used for future spam mailings. To deprive the spam originator of valuable information,
    it is recommended to receive all messages, then evaluate and dispose of them as deemed necessary. Attachment filtering
    will allow the blocking of file extensions that are regularly abused by bad actors for nefarious purposes, including phishing,
    malware distribution, and macros. The list of extensions in the audit and remediation sections includes a collection found
    in the CIS Microsoft 365 Benchmark, Microsoft Office Benchmark, DISA STIG, and the Exchange Server defaults. This setting
    somewhat limits the impact a malicious user or a computer with malware can have on the Exchange infrastructure by restricting
    the size of incoming messages. Disabling the Pickup directory is recommended to prevent potential abuse by attackers or
    insiders seeking to exploit side channel attacks. Dropping a file in the Pickup folder bypasses the normal authentication
    process of Exchange, creating a risk of sensitive data leakage or malicious email distribution through this unauthenticated
    side channel. Spam consumes a large amount of network bandwidth and server capacity. In addition, it is often the source
    of malicious software. Rejecting messages that have evidence of spoofing will reduce the possibility of users falling
    victim to phishing attacks. Configuring this setting enables the encryption of email between servers. This reduces the
    risk of eavesdropping, interception, and alteration of the email.
  impact: 'Some legitimate messages may be blocked. Some legitimate messages may be blocked. Some legitimate messages may
    be blocked if the threshold is set too high. Warning: If a proxy server for outbound Internet access is used, the properties
    of the proxy server must be defined by using the ProxyServerName, ProxyServerPort, and ProxyServerType parameters. Note:
    The values of OpenProxyDetectionEnabled and SenderBlockingEnabled can both be set to $true, but they both can''t be set
    to $false. If one value is $true and the other is $false, and the $true value is changed to $false, the parameter that
    was previously $false will automatically change to $true. Note #2: Open proxy server detection requires the following
    open outbound TCP ports: 23, 80, 1080, 1081, 3128, and 6588. Anonymous emails are automatically rejected This mailbox
    should be monitored by an administrator for potential of blocking sender. False positives may occur when setting SCLQuarantineThreshold
    to lower values. Some legitimate messages might be blocked. Attachments on emails that match the filtering list will be
    removed and replaced with a text file. The original message will be sent to the recipient along with the replaced attachment.
    This is the default behavior. Users will not be able to receive messages larger than the limit. The directory will be
    unavailable for testing purposes unless an administrator explicitly enables it and then later disables it. If an application
    requires access to this directory, then additional controls should be enabled such as restricting NTFS permissions on
    the folder. Legitimate email could be blocked by the agent. Note: The recipient Filter agent is available on Mailbox servers,
    but it shouldn''t be configured. When recipient filtering on a Mailbox server detects one invalid or blocked recipient
    in a message that contains other valid recipients, the message is rejected. There should be no impact to mail flow. If
    TLS connection is not established, BasicAuth will be used.'
