- id: 2.1.6
  title: (L1) Ensure 'Do not permanently delete items until the database has been backed up' is set to 'True'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can prohibit items from being permanently deleted until the database has been backed up.
  rationale: To ensure that accidentally deleted items can be recovered, they should not be permanently deleted until the
    database is backed up.
  impact: Additional storage space will be required until any pending items are permanently deleted. If using a 3rd party
    backup solution that does not set the backup parameters on the Mailbox database as it is backed up then this setting should
    be skipped. Native backup solutions will update the database bits properly, allowing for the RetainDeletedItemsUntilBackup
    parameter work as intended. Failure to evaluate the organization's backup solution in conjunction with this setting will
    result in increased database growth. To see the backup parameters mentioned above run Get-MailboxDatabase | fl *backup*
  references: []
  page_start: 52
  audit_raw: 'Execute the following cmdlet and ensure RetainDeletedItemsUntilBackup is set to

    True:

    Get-MailboxDatabase "Mailbox Database" | fl -property

    RetainDeletedItemsUntilBackup'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -RetainDeletedItemsUntilBackup $true

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Ensure the Don''t permanently delete items until the database is backed

    up box is checked and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure RetainDeletedItemsUntilBackup is set to

      True:

      Get-MailboxDatabase "Mailbox Database" | fl -property

      RetainDeletedItemsUntilBackup'
    severity: medium
- id: 2.2.1
  title: (L1) Ensure 'Transport Pickup Directory Path' is not set
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: The Pickup directory is used by the Transport service on Mailbox servers and Edge Transport servers to insert
    message files directly into the transport pipeline. When properly formatted email message files are copied to the Pickup
    directory, they are submitted for delivery automatically. It is a legacy feature that can be used by administrators for
    mail flow testing, or by applications that must create and submit their own messages. Ensure PickupDirectoryPath is set
    to $null
  rationale: Disabling the Pickup directory is recommended to prevent potential abuse by attackers or insiders seeking to
    exploit side channel attacks. Dropping a file in the Pickup folder bypasses the normal authentication process of Exchange,
    creating a risk of sensitive data leakage or malicious email distribution through this unauthenticated side channel.
  impact: The directory will be unavailable for testing purposes unless an administrator explicitly enables it and then later
    disables it. If an application requires access to this directory, then additional controls should be enabled such as restricting
    NTFS permissions on the folder.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/pickup-directory-and-replaydirectory-exchange-2013-help
  - 2. https://learn.microsoft.com/en-us/exchange/mail-flow/mail-flow?view=exchserver2019
  page_start: 55
  audit_raw: 'Execute the following cmdlet and ensure PickupDirectoryPath is set to $null or is

    blank:

    Get-TransportService | fl Identity,PickupDirectoryPath'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet to

    disable the Pickup Directory on all servers with the Mailbox role

    Get-TransportService | Set-TransportService -PickupDirectoryPath $null

    NOTE: Edge Transport Servers must be configured directly.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure PickupDirectoryPath is set to $null or is

      blank:

      Get-TransportService | fl Identity,PickupDirectoryPath'
    severity: medium
- id: 2.2.2
  title: '(L1) Ensure ''Maximum send size: Organization level'' is set to ''25'''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting limits the size of a message a user can send. Send size includes the header, the message
    body, and any attachments. For internal message flow, Exchange Server uses the custom X-MS-ExchangeOrganization-OriginalSize
    message header to record the original message size of the message as it enters the Exchange Server organization. Whenever
    the message is checked against the specified message size limits, the lower value of the current message size or the original
    message size header is used. The size of the message can change because of content conversion, encoding, and agent processing.
  rationale: This setting limits the impact that a malicious user or a system with malware can have on the Exchange infrastructure
    by restricting the size of outgoing messages.
  impact: Users will not be able to send a message larger than the limit.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/mail-flow/message-sizelimits?view=exchserver-2019
  page_start: 57
  audit_raw: 'Execute the following cmdlet and ensure MaxSendSize is set to 25:

    Get-TransportConfig | fl -property MaxSendSize'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-TransportConfig -MaxSendSize 25MB

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Mail Flow" on the left and click on the "Send Connectors" tab.

    3. Click on "..." and select "Organization Transport Settings".

    4. Change the Maximum send message size (MB): to 25 and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure MaxSendSize is set to 25:

      Get-TransportConfig | fl -property MaxSendSize'
    severity: medium
