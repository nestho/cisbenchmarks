- id: 2.2.8
  title: '(L1) Ensure ''External send connector authentication: DNS routing'' is set to ''True'''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting determines if DNS is used to route outbound mail via the send connector.
  rationale: In order to enable mutual Transport Layer Security (TLS) authentication for the domains serviced by this send
    connector, multiple parameters must be configured. Configuring these parameters enables the use of TLS instead of basic
    authentication where credentials are sent across the network in plaintext. The following parameters are addressed in separate
    recommendations in this benchmark. • DomainSecureEnabled to $true • IgnoreStartTLS to $false
  impact: 'The organization''s servers will only be able to send e-mail to remote servers that are located through DNS routing.
    This is the default value. Warning: If a SmartHosts parameter is specified, the DNSRoutingEnabled parameter must be set
    to $false.'
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setsendconnector?view=exchange-ps#-dnsroutingenabled
  page_start: 69
  audit_raw: 'Execute the following cmdlet and ensure DNSRoutingEnabled is set to True:

    Get-SendConnector "Connection to Contoso.com" | fl -property

    DNSRoutingEnabled'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-SendConnector "Connection to Contoso.com" -DNSRoutingEnabled $true'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure DNSRoutingEnabled is set to True:

      Get-SendConnector "Connection to Contoso.com" | fl -property

      DNSRoutingEnabled'
    severity: medium
- id: 2.2.9
  title: '(L1) Ensure ''External send connector authentication: IgnoreStartTLS'' is set to ''False'''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting specifies whether to ignore the StartTLS option offered by a remote sending server. StartTLS
    is a protocol command used to inform the email server that the email client wants to upgrade from an insecure connection
    to a secure one using TLS or SSL.
  rationale: In order to enable mutual Transport Layer Security (TLS) authentication for the domains serviced by this send
    connector, multiple parameters must be configured (see below). Configuring these parameters enables the use of TLS instead
    of basic authentication where credentials are sent across the network in plaintext. The following parameters are addressed
    in separate recommendations in this benchmark. • DomainSecureEnabled to$true • DNSRoutingEnabled to $true
  impact: The organization's servers will only be able to send e-mail to remote servers that support Domain Security (Mutual
    Auth TLS).
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setsendconnector?view=exchange-ps#-ignorestarttls
  page_start: 71
  audit_raw: 'Execute the following cmdlet and ensure IgnoreSTARTTLS is set to False:

    Get-SendConnector "Connector Name" | fl -property IgnoreSTARTTLS'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-SendConnector "Connector Name" -IgnoreSTARTTLS $false'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure IgnoreSTARTTLS is set to False:

      Get-SendConnector "Connector Name" | fl -property IgnoreSTARTTLS'
    severity: medium
