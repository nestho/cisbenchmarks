  audit_raw: "Execute the below cmdlet:\nGet-SenderIdConfig | fl Name,Enabled,SpoofedDomainAction\n• Ensure Enabled is set\
    \ to True\n• Ensure SpoofedDomainAction is set to Reject\nExecute the following cmdlet and ensure Enabled is set to True:\n\
    Get-SenderFilterConfig | fl -property Enabled\nExecute the following cmdlet and ensure SenderBlockingEnabled and\nOpenProxyDetectionEnabled\
    \ are set to True and SrlBlockThreshold is set to 6:\nGet-SenderReputationConfig | fl\nSenderBlockingEnabled,OpenProxyDetectionEnabled,SrlBlockThreshold\n\
    Execute the following cmdlet and ensure Action is set to Reject and\nBlankSenderBlockingEnabled is set to True :\nGet-SenderFilterConfig\
    \ | fl Name, Action, BlankSenderBlockingEnabled\nExecute the following cmdlet and ensure QuarantineMailbox is set to a\
    \ valid working email address.\nGet-ContentFilterConfig | Select Name, QuarantineMailbox\nExecute the following cmdlet\
    \ and ensure SCLQuarantineEnabled is set to True and\nSCLQuarantineThreshold is set to 6 or lower.\nGet-ContentFilterConfig\
    \ | fl Name,QuarantineMailbox,SCL*\nExecute the following cmdlet and ensure RecipientValidationEnabled is set to True:\n\
    Get-RecipientFilterConfig | Select Name, RecipientValidationEnabled\nTo ensure the Attachment Filtering Agent is enabled\
    \ execute the below cmdlet:\nGet-TransportAgent \"Attachment Filtering Agent\"\nTo ensure the list of blocked extensions\
    \ matches the recommended state execute GetAttachmentFilterEntry and compare it against the list below or run the following\
    \ script:\n$attachmentExtensions = @(\n    \"*.ace\", \"*.ade\", \"*.adp\", \"*.ani\", \"*.app\", \"*.appx\", \"*.arj\"\
    , \"*.asx\",\n\"*.bas\", \"*.bat\", \"*.cab\", \"*.chm\",\n    \"*.cmd\", \"*.com\", \"*.cpl\", \"*.crt\", \"*.csh\",\
    \ \"*.dbf\", \"*.dcr\", \"*.deb\",\n\"*.dex\", \"*.dif\", \"*.dir\", \"*.dll\",\n    \"*.doc\", \"*.dot\", \"*.docm\"\
    , \"*.elf\", \"*.exe\", \"*.fxp\", \"*.hlp\", \"*.hta\",\n\"*.htc\", \"*.htm\", \"*.html\", \"*.img\",\n    \"*.inf\"\
    , \"*.ins\", \"*.iso\", \"*.isp\", \"*.jar\", \"*.jnlp\", \"*.js\", \"*.jse\",\n\"*.kext\", \"*.ksh\", \"*.lha\", \"*.lib\"\
    ,\n    \"*.lnk\", \"*.lzh\", \"*.macho\", \"*.mda\", \"*.mdb\", \"*.mde\", \"*.mdt\", \"*.mdw\",\n\"*.mdz\", \"*.mht\"\
    , \"*.mhtml\", \"*.msc\",\n    \"*.msi\", \"*.msix\", \"*.msp\", \"*.mst\", \"*.ops\", \"*.pcd\", \"*.pif\", \"*.plg\"\
    ,\n\"*.ppa\", \"*.ppt\", \"*.ppam\", \"*.prf\",\n    \"*.prg\", \"*.ps1\", \"*.ps11\", \"*.ps11xml\", \"*.ps1xml\", \"\
    *.ps2\", \"*.ps2xml\",\n\"*.psc1\", \"*.psc2\", \"*.reg\", \"*.rev\",\n    \"*.scf\", \"*.scr\", \"*.sct\", \"*.shb\"\
    , \"*.shs\", \"*.shtm\", \"*.shtml\",\n\"*.slk\", \"*.spl\", \"*.stm\", \"*.swf\", \"*.sys\",\n    \"*.uif\", \"*.url\"\
    , \"*.vb\", \"*.vbe\", \"*.vbs\", \"*.vxd\", \"*.wsc\", \"*.wsf\",\n\"*.wsh\", \"*.xlam\", \"*.xla\", \"*.xlc\",\n   \
    \ \"*.xll\", \"*.xls\", \"*.xlsm\", \"*.xlt\", \"*.xlw\", \"*.xml\", \"*.xnk\", \"*.xz\",\n\"*.z\"\n)\n# Get the existing\
    \ attachment filter entries\n$existingEntries = Get-AttachmentFilterEntry\n$missingCount = 0\n# Iterate over the master\
    \ list and check if each extension is present in the\nattachment filter\nforeach ($extension in $attachmentExtensions)\
    \ {\n    $found = $existingEntries | Where-Object { $_.Name -eq $extension }\n    if (!$found) {\n        $missingCount++\n\
    \        Write-Host \"Extension $extension is missing from the attachment\nfilter list.\" -ForegroundColor Yellow\n  \
    \  }\n}\nif ($missingCount -eq 0) {\n    Write-Host \"All extensions from the reference list are present.\" -\nForegroundColor\
    \ Green\n}\nNOTE: This list has been collected from various CIS Benchmarks and includes the\nExchange Defaults. It is\
    \ not exhaustive. This and the remediation script can be modified\nfor the organization's needs or exceptions.\nExecute\
    \ the following cmdlet and ensure MaxMessageSize is set to 25:\nGet-ReceiveConnector \"Connection from Contoso.com\" |\
    \ fl -property\nMaxMessageSize\nExecute the following cmdlet and ensure PickupDirectoryPath is set to $null or is\nblank:\n\
    Get-TransportService | fl Identity,PickupDirectoryPath\nExecute the following cmdlet and ensure Enabled is set to $true:\n\
    Get-RecipientFilterConfig | Select Name, Enabled\nExecute the following cmdlet and ensure AuthMechanism is set to Tls,\
    \ BasicAuth,\nBasicAuthRequireTLS:\nGet-ReceiveConnector | Select Name, Identity, AuthMechanism"
  remediation: "To implement the recommended state, execute the below cmdlet:\nSet-SenderIDConfig -Enabled $true -SpoofedDomainAction\
    \ Reject\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-SenderFilterConfig -Enabled\
    \ $true\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-SenderReputationConfig -Enabled\
    \ $true -SenderBlockingEnabled $true -\nOpenProxyDetectionEnabled $true -SrlBlockThreshold 6\nTo implement the recommended\
    \ state, execute the following PowerShell cmdlet:\nSet-SenderFilterConfig -Action Reject -BlankSenderBlockingEnabled $true\n\
    To implement the recommended state, execute the following PowerShell cmdlet:\nSet-ContentFilterConfig -QuarantineMailbox\
    \ <'QuarantineMailbox SmtpAddress'>\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-ContentFilterConfig\
    \ -SCLQuarantineEnabled $true -SCLRejectThreshold 8 -\nSCLQuarantineThreshold 6\nNOTE: The SCLRejectThreshold must be\
    \ greater than the SCLQuarantineThreshold\nwhen enabling the Quarantine and is why it is changed in this instance.\nTo\
    \ implement the recommended state, execute the following PowerShell cmdlet:\nSet-RecipientFilterConfig -RecipientValidationEnabled\
    \ $true\nExecute the following cmdlet to enable the Filtering Agent:\nEnable-TransportAgent \"Attachment Filtering Agent\"\
    \nExecute the bellow script to create the desired attachment filtering state:\n$attachmentExtensions = @(\n    \"*.ace\"\
    , \"*.ade\", \"*.adp\", \"*.ani\", \"*.app\", \"*.appx\", \"*.arj\", \"*.asx\",\n\"*.bas\", \"*.bat\", \"*.cab\", \"*.chm\"\
    ,\n    \"*.cmd\", \"*.com\", \"*.cpl\", \"*.crt\", \"*.csh\", \"*.dbf\", \"*.dcr\", \"*.deb\",\n\"*.dex\", \"*.dif\",\
    \ \"*.dir\", \"*.dll\",\n    \"*.doc\", \"*.dot\", \"*.docm\", \"*.elf\", \"*.exe\", \"*.fxp\", \"*.hlp\", \"*.hta\",\n\
    \"*.htc\", \"*.htm\", \"*.html\", \"*.img\",\n    \"*.inf\", \"*.ins\", \"*.iso\", \"*.isp\", \"*.jar\", \"*.jnlp\", \"\
    *.js\", \"*.jse\",\n\"*.kext\", \"*.ksh\", \"*.lha\", \"*.lib\",\n    \"*.lnk\", \"*.lzh\", \"*.macho\", \"*.mda\", \"\
    *.mdb\", \"*.mde\", \"*.mdt\", \"*.mdw\",\n\"*.mdz\", \"*.mht\", \"*.mhtml\", \"*.msc\",\n    \"*.msi\", \"*.msix\", \"\
    *.msp\", \"*.mst\", \"*.ops\", \"*.pcd\", \"*.pif\", \"*.plg\",\n\"*.ppa\", \"*.ppt\", \"*.ppam\", \"*.prf\",\n    \"\
    *.prg\", \"*.ps1\", \"*.ps11\", \"*.ps11xml\", \"*.ps1xml\", \"*.ps2\", \"*.ps2xml\",\n\"*.psc1\", \"*.psc2\", \"*.reg\"\
    , \"*.rev\",\n    \"*.scf\", \"*.scr\", \"*.sct\", \"*.shb\", \"*.shs\", \"*.shtm\", \"*.shtml\",\n\"*.slk\", \"*.spl\"\
    , \"*.stm\", \"*.swf\", \"*.sys\",\n    \"*.uif\", \"*.url\", \"*.vb\", \"*.vbe\", \"*.vbs\", \"*.vxd\", \"*.wsc\", \"\
    *.wsf\",\n\"*.wsh\", \"*.xlam\", \"*.xla\", \"*.xlc\",\n    \"*.xll\", \"*.xls\", \"*.xlsm\", \"*.xlt\", \"*.xlw\", \"\
    *.xml\", \"*.xnk\", \"*.xz\",\n\"*.z\"\n)\nforeach ($extension in $attachmentExtensions) {\n    $result = Add-AttachmentFilterEntry\
    \ -Name $extension -Type FileName -\nErrorAction SilentlyContinue\n    if ($result) {\n        Write-Host \"Successfully\
    \ added attachment $extension\" -\nForegroundColor Green\n    } else {\n        Write-Host \"Attachment $extension already\
    \ exists in the list.\" -\nForegroundColor Red\n    }\n}\nTo implement the recommended state, execute the following PowerShell\
    \ cmdlet:\nSet-ReceiveConnector \"Connection from Contoso.com\" -MaxMessageSize 25MB\nOR\nPerform the following actions:\n\
    1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mail Flow\" on the left and click on the \"Receive Connectors\"\
    \ tab.\n3. Double-click on the receive connector to be modified.\n4. Change the Maximum receive message size (MB): to25and\
    \ click Save.\nTo implement the recommended state, execute the following PowerShell cmdlet to\ndisable the Pickup Directory\
    \ on the Edge Transport server:\nGet-TransportService | Set-TransportService -PickupDirectoryPath $null\nTo implement\
    \ the recommended state, execute the following PowerShell cmdlet:\nSet-RecipientFilterConfig -Enabled $true\nTo implement\
    \ the recommended state, execute the following PowerShell cmdlet:\nSet-ReceiveConnector -Identity <'IdentityName'> -AuthMechanism\
    \ 'Tls,\nBasicAuth, BasicAuthRequireTLS'\nNote: If more than one receive connector exists on the Edge Transport server,\
    \ run this\ncommand to update all receive connectors.\nGet-ReceiveConnector | Set-ReceiveConnector -AuthMechanism 'Tls,\
    \ BasicAuth,\nBasicAuthRequireTLS'"
  checks:
  - type: manual_review
    info: 'Execute the below cmdlet:

      Get-SenderIdConfig | fl Name,Enabled,SpoofedDomainAction

      • Ensure Enabled is set to True

      • Ensure SpoofedDomainAction is set to Reject

      Execute the following cmdlet and ensure Enabled is set to True:

      Get-SenderFilterConfig | fl -property Enabled

      Execute the following cmdlet and ensure SenderBlockingEnabled and

      OpenProxyDetectionEnabled are set to True and SrlBlockThreshold is set to 6:

      Get-SenderReputationConfig | fl

      SenderBlockingEnabled,OpenProxyDetectionEnabled,SrlBlo'
    severity: medium
- id: 2.1.1
  title: '(L1) Ensure ''Mailbox quotas: Issue warning at'' is set to '''''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can automatically warn mailbox users that their mailbox is approaching its storage limit.
    It's suggested that this warning be set up when 90% of the mailbox size has been reached. For example, if the mailbox
    size is 100GB, set the warning to 90GB or 94,371,840 KB. A value between 0 and 2,147,483,647 KB (2.1 terabytes) can be
    set depending on the user's mailbox size.
  rationale: Unlimited mailbox sizes can cause the Exchange database to grow uncontrollably and consume all available disk
    space, potentially preventing the database from mounting properly. This can disrupt not only email services, but also
    other security measures that depend on timely communication.
  impact: Users will receive a warning when their mailboxes reach the specified value.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-issuewarningquota
  page_start: 42
  audit_raw: 'Execute the following cmdlet and ensure IssueWarningQuota is set to <value>KB:

    Get-MailboxDatabase "Mailbox Database" | fl -property IssueWarningQuota'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -IssueWarningQuota <value>KB

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Issue a warning at (GB): to <value> and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure IssueWarningQuota is set to <value>KB:

      Get-MailboxDatabase "Mailbox Database" | fl -property IssueWarningQuota'
    severity: medium
- id: 2.1.2
  title: (L1) Ensure 'Retain deleted items for the specified number of days' is set to '14'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting specifies how long deleted messages are retained before they are permanently removed from
    the database.
  rationale: Defining a reasonable retention period facilitates recovering accidentally deleted messages while controlling
    the volume of storage that retained messages require.
  impact: None - This is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-deleteditemretention
  page_start: 44
  audit_raw: 'Execute the following PowerShell cmdlet and ensure DeletedItemRetention is set to 14:

    Get-MailboxDatabase "Mailbox Database" | fl -property DeletedItemRetention'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -DeletedItemRetention 14

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Keep deleted items for (days): to 14 and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following PowerShell cmdlet and ensure DeletedItemRetention is set to 14:

      Get-MailboxDatabase "Mailbox Database" | fl -property DeletedItemRetention'
    severity: medium
- id: 2.1.3
  title: '(L1) Ensure ''Mailbox quotas: Prohibit send and receive at'' is set to '''''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can automatically prevent users from sending and receiving e-mail messages after their
    mailbox size reaches the specified limit. It's suggested that this warning be set up when 98% of the mailbox size has
    been reached. For example, if the mailbox size is 100 GB, set the warning to 98 GB or 102,760,448 KB. A value between
    0 and 2,147,483,647 KB (2.1 terabytes) can be set depending on the user's mailbox size.
  rationale: Unlimited mailbox sizes can cause the Exchange database to grow uncontrollably and consume all available disk
    space, potentially preventing the database from mounting properly. This can disrupt not only email services but also other
    security measures that depend on timely communication.
  impact: Users will be unable to send or receive messages when their mailboxes reach the specified value.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-prohibitsendreceivequota
  page_start: 46
  audit_raw: 'Execute the following cmdlet and ensure ProhibitSendReceiveQuota is set to <value>:

    Get-MailboxDatabase "Mailbox Database" | fl -property

    ProhibitSendReceiveQuota'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -ProhibitSendReceiveQuota <value>GB

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Prohibit send and receive at (GB): to <value>and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure ProhibitSendReceiveQuota is set to <value>:

      Get-MailboxDatabase "Mailbox Database" | fl -property

      ProhibitSendReceiveQuota'
    severity: medium
- id: 2.1.4
  title: '(L1) Ensure ''Mailbox quotas: Prohibit send at'' is set to '''''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can automatically prevent users from sending new e-mail messages after their mailboxes
    reach a specified limit. It's suggested that this warning be set up when 95% of the mailbox size has been reached. For
    example, if the mailbox size is 100 GB, set the warning to 95 GB or 99,614,720 KB. A value between 0 and 2,147,483,647
    KB (2.1 terabytes) can be set depending on the user's mailbox size.
  rationale: Unlimited mailbox sizes can cause the Exchange database to grow uncontrollably and consume all available disk
    space, potentially preventing the database from mounting properly. This can disrupt not only email services but also other
    security measures that depend on timely communication.
  impact: Users will be unable to send messages when their mailboxes reach the specified value.
  references: []
  page_start: 48
  audit_raw: 'Execute the following cmdlet and ensure ProhibitSendQuota is set to <value>:

    Get-MailboxDatabase "Mailbox Database" | fl -property ProhibitSendQuota'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database"  -ProhibitSendQuota <value>

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Prohibit send at (GB): to <value> and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure ProhibitSendQuota is set to <value>:

      Get-MailboxDatabase "Mailbox Database" | fl -property ProhibitSendQuota'
    severity: medium
