- id: 2.4.1
  title: (L1) Ensure 'POP3' Windows services are 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: Post Office Protocol 3 (POP3) is an email protocol for receiving email messages from a server and transferring
    to a client device. On Exchange Server 2019 with the Mailbox role installed, it is set to manual startup by default.
  rationale: POP3 is an outdated protocol that has a number of weaknesses versus MAPI and Exchange ActiveSync. POP3 can send
    credentials in the clear if not configured properly, has limited authentication capabilities, and a lack of proper message
    handling can result in misplaced or lost e-mails and folders when moving between devices. This may result in data loss
    for the end user. ActiveSync and MAPI, in contrast, offer superior security by default, provide an enhanced user experience,
    and are Microsoft's primary focus for support and improvement.
  impact: Devices that require POP3 to function will be unable to receive e-mail from the Exchange Server. This should not
    be a problem for most client applications as Outlook 2013 and newer support modern authentication methods (OAuth) and
    protocols. If an organization is required to use POP3 then care must be taken to only enable POP3, the PopEnabled parameter,
    for the mailbox in question.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients/pop3-and-imap4/configurepop3?view=exchserver-2019
  - 2. NIST SP 800-53:rev5:CM-7 b
  page_start: 91
  audit_raw: 'Execute the following PowerShell cmdlet and ensure the StartType of both

    MSExchangePop3 and MSExchangePOP3BE are set to Disabled

    Get-Service MSExchangePOP3* | ft Name,DisplayName,Status,StartType'
  remediation: 'To implement the recommended state, execute the following PowerShell commands:

    Stop-Service MSExchangePop3,MSExchangePop3BE

    Get-Service MSExchangePOP3,MSExchangePOP3BE | Set-Service -StartupType Disabled'
  checks:
  - type: powershell
    command: Get-Service MSExchangePOP3* | ft Name,DisplayName,Status,StartType
    expected: ''
    severity: medium
    info: 'Execute the following PowerShell cmdlet and ensure the StartType of both

      MSExchangePop3 and MSExchangePOP3BE are set to Disabled

      Get-Service MSExchangePOP3* | ft Name,DisplayName,Status,StartType'
- id: 2.4.2
  title: (L1) Ensure 'IMAP4' Windows services are 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: Internet Message Access Protocol version 4 (IMAP4) is an email protocol for sending and receiving email between
    a client and server. Unlike POP3 it can synchronize email and folders between the client and server. On Exchange Server
    2019 with the Mailbox role installed, it is set to manual startup by default.
  rationale: IMAP4 by default is configured to use basic authentication, which can potentially expose credentials in plain
    text. While it can be configured to use SSL/TLS for encryption, it is important to disable unnecessary services that duplicate
    the functionality of more widely used and supported protocols. ActiveSync and MAPI, in contrast, offer superior security
    by default, provide an enhanced user experience, and are Microsoft's primary focus for support and improvement. By disabling
    IMAP4, organizations can reduce their attack surface and prioritize the use of more secure and feature-rich protocols.
  impact: Devices that require IMAP4 to function will be unable to send or receive email from the Exchange Server. This should
    not be a problem for most client applications as Outlook 2013 and newer support modern authentication methods (OAuth)
    and protocols. If an organization is required to use IMAP4 then care must be taken to only enable IMAP4, the ImapEnabled
    parameter, for the mailbox in question.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients/pop3-and-imap4/configureimap4?view=exchserver-2019
  - 2. NIST SP 800-53:rev5:CM-7 b
  page_start: 93
  audit_raw: "Execute the following PowerShell cmdlet and ensure the StartType of both\nMSExchangeImap4 and MSExchangeIMAP4BE\
    \ are set to Disabled\nGet-Service MSExchangeImap4* | ft Name,DisplayName,Status,Starttype\n Page 93"
  remediation: 'To implement the recommended state, execute the following PowerShell commands:

    Stop-Service MSExchangeImap4,MSExchangeIMAP4BE

    Get-Service MSExchangeImap4,MSExchangeIMAP4BE | Set-Service -StartupType Disabled'
  checks:
  - type: powershell
