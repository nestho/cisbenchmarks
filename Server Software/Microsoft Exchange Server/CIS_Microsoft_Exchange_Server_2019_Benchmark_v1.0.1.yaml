- id: 2.2.6
  title: (L1) Ensure ‘Send connector timeout’ is set to '10'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: 'This parameter controls the number of idle minutes before the connection to the Send connector is dropped,
    even if data is being actively transmitted. Note: The ConnectionTimeout parameter must be higher than the ConnectionInactivityTimeout
    parameter.'
  rationale: Connections may suffer from delays in message transfer once established. In order to allow new connections to
    be established, the timeout period should be reduced so that connections are not maintained for unnecessary periods of
    time.
  impact: Valid connections could be dropped.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setsendconnector?view=exchange-ps
  - 2. NIST SP 800-53:rev5:SC-10
  page_start: 67
  audit_raw: 'Execute the following cmdlet and ensure ConnectionInactivityTimeOut is set to

    00:10:00:

    Get-SendConnector | Select Name, Identity, ConnectionInactivityTimeOut'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-SendConnector -Identity <''IdentityName''> -ConnectionInactivityTimeOut 00:10:00'
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure ConnectionInactivityTimeOut is set to

      00:10:00:

      Get-SendConnector | Select Name, Identity, ConnectionInactivityTimeOut'
    severity: medium
