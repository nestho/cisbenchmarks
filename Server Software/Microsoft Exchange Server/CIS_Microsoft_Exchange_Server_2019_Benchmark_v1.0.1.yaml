  remediation: "To implement the recommended state, execute the following PowerShell cmdlet:\nSet-ReceiveConnector -Identity\
    \ <'IdentityName'> -Banner '220 SMTP Server Ready'\nTo implement the recommended state, execute the following PowerShell\
    \ cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -AllowSimplePassword $false\nOR\nPerform the following actions:\n\
    1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device\
    \ mailbox policies\" tab.\n3. Double-click the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure\
    \ the Allow simple passwords box is not checked and click Save.\nTo implement the recommended state, execute the following\
    \ PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -AllowNonProvisionableDevices $false\nOR\nPerform the\
    \ following actions:\n1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on\
    \ the \"Mobile device mailbox policies\" tab.\n3. Double-click the policy you wish to modify and go to the \"General\"\
    \ settings.\n4. Ensure the Allow mobile devices that don't fully support these\npolicies to synchronize box is not checked\
    \ and click Save.\n Page 104\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy\
    \ \"Profile\" -PasswordHistory 4\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative Center).\n\
    2. Go to \"Mobile\" on the left and click on the \"Mobile device mailbox policies\" tab.\n3. Double-click the policy you\
    \ wish to modify and go to the \"Security\" settings.\n4. Change the Password recycle count to 4 and click Save.\nTo implement\
    \ the recommended state, execute the following PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -MinPasswordLength\
    \ 4\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the\
    \ left and click on the \"Mobile device mailbox policies\" tab.\n3. Double-click the policy you wish to modify and go\
    \ to the \"Security\" settings.\n4. Ensure the Minimum password length box is checked and change the\nvalue to 4 and click\
    \ Save\n Page 108\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy\
    \ \"Profile\" -MaxPasswordFailedAttempts 10\nTo implement the recommended state, execute the following PowerShell cmdlet:\n\
    Set-MobileDeviceMailboxPolicy \"Profile\" -PasswordExpiration 90\nOR\nPerform the following actions:\n1. Launch the EAC\
    \ (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device mailbox policies\"\
    \ tab.\n3. Double-click the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure the Enforce password\
    \ lifetime (days) box is checked change\nthe value to 365 and click Save\nTo implement the recommended state, execute\
    \ the following PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -DevicePolicyRefreshInterval '1:00:00'\n\
    To implement the recommended state, execute the following PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\"\
    \ -AlphanumericPasswordRequired $true\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative\
    \ Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device mailbox policies\" tab.\n3. Double-click\
    \ the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure the Require an alphanumeric password box\
    \ is checked and click\nSave.\n Page 116\nTo implement the recommended state, execute the following PowerShell cmdlet:\n\
    Set-MobileDeviceMailboxPolicy \"Profile\" -RequireDeviceEncryption $true\nOR\nPerform the following actions:\n1. Launch\
    \ the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device mailbox\
    \ policies\" tab.\n3. Double-click the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure the Require\
    \ encryption on device box is checked and click Save\n Page 118\nTo implement the recommended state, execute the following\
    \ PowerShell cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -PasswordEnabled $true\nOR\nPerform the following actions:\n\
    1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device\
    \ mailbox policies\" tab.\n3. Double-click the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure\
    \ the Require a password box is checked and click Save.\nTo implement the recommended state, execute the following PowerShell\
    \ cmdlet:\nSet-MobileDeviceMailboxPolicy \"Profile\" -MaxInactivityTimeLock 00:15:00\nOR\nPerform the following actions:\n\
    1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Mobile\" on the left and click on the \"Mobile device\
    \ mailbox policies\" tab.\n3. Double-click the policy you wish to modify and go to the \"Security\" settings.\n4. Ensure\
    \ the Require sign-in after the device has been inactive\nfor (minutes) box is checked and change the value to 15 and\
    \ click Save.\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-ReceiveConnector \"IDENTITY\"\
    \ -ProtocolLoggingLevel Verbose\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative Center).\n\
    2. Go to \"Mail Flow\" on the left and click on the \"Receive Connectors\" tab.\n3. Double-click on the receive connector\
    \ to be modified.\n4. Change the Protocol logging level to Verbose and click Save.\nTo implement the recommended state,\
    \ execute the following PowerShell script:\n$params = @{\n    AdminAuditLogEnabled = $True\n    AdminAuditLogCmdlets =\
    \ '*'\n    AdminAuditLogParameters = '*'\n    AdminAuditLogExcludedCmdlets = $null\n    AdminAuditLogAgeLimit = '90.00:00:00'\n\
    \    LogLevel = 'Verbose'\n}\nSet-AdminAuditLogConfig @params\nTo implement the recommended state, execute the following\
    \ PowerShell cmdlet:\nSet-TransportService \"EXCHANGE1\" -ConnectivityLogEnabled $true\nOR\nPerform the following actions:\n\
    1. Launch the EAC (Exchange Administrative Center).\n2. Go to \"Servers\" on the left and click on the \"Servers\" tab.\n\
    3. Double-click the server and go to the \"Transport logs\" settings.\n4. Ensure the Enable connectivity log box is checked\
    \ and click Save.\nTo implement the recommended state, execute the following PowerShell cmdlet:\nSet-SendConnector \"\
    IDENTITY\" -ProtocolLoggingLevel Verbose\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative\
    \ Center).\n2. Go to \"Mail Flow\" on the left and click on the \"Send Connectors\" tab.\n3. Double-click on the send\
    \ connector to be modified.\n4. Change the Protocol logging level to Verbose and click Save.\nTo implement the recommended\
    \ state, execute the following PowerShell cmdlet:\nSet-TransportService \"EXCHANGE1\" -MessageTrackingLogEnabled $true"
