controls:
- id: 2.1.1
  title: '(L1) Ensure ''Mailbox quotas: Issue warning at'' is set to ''<value>'''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can automatically warn mailbox users that their mailbox is approaching its storage limit.
    It's suggested that this warning be set up when 90% of the mailbox size has been reached. For example, if the mailbox
    size is 100GB, set the warning to 90GB or 94,371,840 KB. A value between 0 and 2,147,483,647 KB (2.1 terabytes) can be
    set depending on the user's mailbox size.
  rationale: Unlimited mailbox sizes can cause the Exchange database to grow uncontrollably and consume all available disk
    space, potentially preventing the database from mounting properly. This can disrupt not only email services, but also
    other security measures that depend on timely communication.
  impact: Users will receive a warning when their mailboxes reach the specified value.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-issuewarningquota
  - 2. NIST SP 800-53:rev5:SC-6
  page_start: 44
  audit_raw: 'Execute the following cmdlet and ensure IssueWarningQuota is set to <value>KB:

    Get-MailboxDatabase "Mailbox Database" | fl -property IssueWarningQuota'
  remediation: "To implement the recommended state, execute the following PowerShell cmdlet:\nSet-MailboxDatabase \"Mailbox\
    \ Database\" -IssueWarningQuota <value>KB\nOR\nPerform the following actions:\n1. Launch the EAC (Exchange Administrative\
    \ Center).\n2. Go to \"Servers\" on the left and click on the \"Databases\" tab.\n3. Double-click the database and go\
    \ to the \"Limits\" settings.\n4. Change Issue a warning at (GB): to <value> and click Save.\n Page 44"
  checks:
  - type: manual_review
    info: 'Execute the following cmdlet and ensure IssueWarningQuota is set to <value>KB:

      Get-MailboxDatabase "Mailbox Database" | fl -property IssueWarningQuota'
    severity: medium
- id: 2.1.2
  title: (L1) Ensure 'Retain deleted items for the specified number of days' is set to '14'
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting specifies how long deleted messages are retained before they are permanently removed from
    the database.
  rationale: Defining a reasonable retention period facilitates recovering accidentally deleted messages while controlling
    the volume of storage that retained messages require.
  impact: None - This is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-deleteditemretention
  - 2. NIST SP 800-53:rev5:SI-12
  page_start: 46
  audit_raw: 'Execute the following PowerShell cmdlet and ensure DeletedItemRetention is set

    to 14:

    Get-MailboxDatabase "Mailbox Database" | fl -property DeletedItemRetention'
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -DeletedItemRetention 14

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Keep deleted items for (days): to 14 and click Save.'
  checks:
  - type: manual_review
    info: 'Execute the following PowerShell cmdlet and ensure DeletedItemRetention is set

      to 14:

      Get-MailboxDatabase "Mailbox Database" | fl -property DeletedItemRetention'
    severity: medium
- id: 2.1.3
  title: '(L1) Ensure ''Mailbox quotas: Prohibit send and receive at'' is set to ''<value>'''
  scoring: scored
  profile:
  - Level 1 - Mailbox Services Security
  description: This policy setting can automatically prevent users from sending and receiving e-mail messages after their
    mailbox size reaches the specified limit. It's suggested that this warning be set up when 98% of the mailbox size has
    been reached. For example, if the mailbox size is 100 GB, set the warning to 98 GB or 102,760,448 KB. A value between
    0 and 2,147,483,647 KB (2.1 terabytes) can be set depending on the user's mailbox size.
  rationale: Unlimited mailbox sizes can cause the Exchange database to grow uncontrollably and consume all available disk
    space, potentially preventing the database from mounting properly. This can disrupt not only email services but also other
    security measures that depend on timely communication.
  impact: Users will be unable to send or receive messages when their mailboxes reach the specified value.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setmailboxdatabase?view=exchange-ps#-prohibitsendreceivequota
  - 2. NIST SP 800-53:rev5:SC-6
  page_start: 48
  audit_raw: "Execute the following cmdlet and ensure ProhibitSendReceiveQuota is set to\n<value>:\nGet-MailboxDatabase \"\
    Mailbox Database\" | fl -property ProhibitSendReceiveQuota\n Page 48"
  remediation: 'To implement the recommended state, execute the following PowerShell cmdlet:

    Set-MailboxDatabase "Mailbox Database" -ProhibitSendReceiveQuota <value>GB

    OR

    Perform the following actions:

    1. Launch the EAC (Exchange Administrative Center).

    2. Go to "Servers" on the left and click on the "Databases" tab.

    3. Double-click the database and go to the "Limits" settings.

    4. Change Prohibit send and receive at (GB): to <value>and click

    Save.'
  checks:
  - type: manual_review
    info: "Execute the following cmdlet and ensure ProhibitSendReceiveQuota is set to\n<value>:\nGet-MailboxDatabase \"Mailbox\
      \ Database\" | fl -property ProhibitSendReceiveQuota\n Page 48"
    severity: medium
