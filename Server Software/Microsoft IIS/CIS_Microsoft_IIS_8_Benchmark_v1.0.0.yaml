controls:
- id: 1.1.1
  title: Ensure Web Content Is on Non-System Partition
  scoring: scored
  profile:
  - Level 1
  description: Web resources published through IIS are mapped, via Virtual Directories, to physical locations on disk.  It
    is recommended to map all Virtual Directories to a non-system disk volume.
  rationale: 'Isolating web content from system files may reduce the probability of:  Web sites/applications exhausting system
    disk space  File IO vulnerability in the web site/application from affecting the confidentiality and/or integrity of
    system files'
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc179961.aspx
  - 2. http://blogs.iis.net/thomad/archive/2008/02/10/moving-the-iis7-inetpubdirectory-to-a-different-drive.aspx
  page_start: 10
  audit_raw: 'Execute the following command to ensure no virtual directories are mapped to the system

    drive:

    %systemroot%\system32\inetsrv\appcmd list vdir'
  remediation: '1. Browse to web content in C:\inetpub\wwwroot\

    2. Copy or cut content onto a dedicated and restricted web folder on a non-system

    drive such as D:\webroot\

    3. Change mappings for any applications or Virtual Directories to reflect the new

    location

    10 | P a g e

    To change the mapping for the application named app1 which resides under the Default

    Web Site, open IIS Manager:

    1. Expand the server node

    2. Expand Sites

    3. Expand Default Web Site

    4. Click on app1

    5. In the Actions pane, select Basic Settings

    6. In the Physical path text box, put the new location of the application,

    D:\wwwroot\app1 in the example above'
  checks:
  - type: manual_review
    info: 'Execute the following command to ensure no virtual directories are mapped to the system

      drive:

      %systemroot%\system32\inetsrv\appcmd list vdir'
    severity: medium
- id: 1.1.2
  title: Require Host Headers on all Sites
  scoring: scored
  profile:
  - Level 2
  description: Host headers provide the ability to host multiple websites on the same IP address and port. It is recommended
    that host headers be configured for all sites.
  rationale: 'Requiring a Host header for all sites may reduce the probability of:  DNS rebinding attacks successfully compromising
    or abusing site data or functionality [2]  IP-based scans successfully identifying or interacting with a target application
    hosted on IIS'
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc753195%28WS.10%29.aspx
  - 2. http://crypto.stanford.edu/dns/dns-rebinding.pdf
  page_start: 11
  audit_raw: 'Execute the following command to identify sites that are not configured to require host

    headers:

    %systemroot%\system32\inetsrv\appcmd list sites

    11 | P a g e

    All sites will be listed as such:

    SITE "Default Web Site" (id:1,bindings:http/*:80:test.com,state:Started)

    SITE "badsite" (id:3,bindings:http/*:80:,state:Started)

    For all non-SSL sites, ensure that the IP:port:host binding triplet contains a host name.  In

    the example above, the first site is configured as recommended given the Default Web

    Site has a host header of test.com.  badsite, however, does not have a host header

    configured - it shows *:80: which means all IPs over port 80, with no host header.'
  remediation: 'Obtain a listing of all sites by using the following appcmd.exe command:

    %systemroot%\system32\inetsrv\appcmd list sites

    Perform the following in IIS Manager to configure host headers for the Default Web Site:

    1. Open IIS Manager

    2. In the Connections pane expand the Sites node and select Default Web Site

    3. In the Actions pane click Bindings

    4. In the Site Bindings dialog box, select the binding for which host headers are going

    to be configured, Port 80 in this example

    5. Click Edit

    6. Under host name, enter the sites FQDN, such as <www.examplesite.com>

    7. Click OK, then Close

    Note: Requiring a host header may impair site functionality for HTTP/1.0 clients.'
  checks:
  - type: manual_review
    info: 'Execute the following command to identify sites that are not configured to require host

      headers:

      %systemroot%\system32\inetsrv\appcmd list sites

      11 | P a g e

      All sites will be listed as such:

      SITE "Default Web Site" (id:1,bindings:http/*:80:test.com,state:Started)

      SITE "badsite" (id:3,bindings:http/*:80:,state:Started)

      For all non-SSL sites, ensure that the IP:port:host binding triplet contains a host name.  In

      the example above, the first site is configured as recommended given the Default Web

      '
    severity: medium
- id: 1.1.3
  title: Disable Directory Browsing
  scoring: scored
  profile:
  - Level 1
  description: 'Directory browsing allows the contents of a directory to be displayed upon request from a web client.  If
    directory browsing is enabled for a directory in Internet Information 12 | P a g e Services, users receive a page that
    lists the contents of the directory when the following two conditions are met: 1. No specific file is requested in the
    URL 2. The Default Documents feature is disabled in IIS, or if it is enabled, IIS is unable to locate a file in the directory
    that matches a name specified in the IIS default document list It is recommended that directory browsing be disabled.'
  rationale: Ensuring that directory browsing is disabled may reduce the probability of disclosing sensitive content that
    is inadvertently accessible via IIS.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc725840%28WS.10%29.aspx
  - 2. http://technet.microsoft.com/en-us/library/cc731109%28WS.10%29.aspx
  page_start: 12
  audit_raw: "Perform the following to verify that Directory Browsing has been disabled at the server\nlevel:\n%systemroot%\\\
    system32\\inetsrv\\appcmd list config /section:directoryBrowse\nIf the server is configured as recommended, the following\
    \ will be displayed:\n<system.webServer>\n  <directoryBrowse enabled=\"false\" />\n<system.webServer>"
  remediation: 'Directory Browsing can be set by using the UI, running appcmd.exe commands, by editing

    configuration files directly, or by writing WMI scripts.  To disable directory browsing at the

    server level using an appcmd.exe command:

    %systemroot%\system32\inetsrv\appcmd set config /section:directoryBrowse

    /enabled:false'
  checks:
  - type: manual_review
    info: "Perform the following to verify that Directory Browsing has been disabled at the server\nlevel:\n%systemroot%\\\
      system32\\inetsrv\\appcmd list config /section:directoryBrowse\nIf the server is configured as recommended, the following\
      \ will be displayed:\n<system.webServer>\n  <directoryBrowse enabled=\"false\" />\n<system.webServer>"
    severity: medium
- id: 1.1.4
  title: Set Default Application Pool Identity to Least Privilege Principal
  scoring: scored
  profile:
  - Level 1
  description: Application Pool Identities are the actual users/authorities that will run the worker process - w3wp.exe.  Assigning
    the correct principal will help ensure that applications can function properly, while not giving overly permissive permissions
    on the system.  These identities can further be used in ACLs to protect system content. IIS 8.0 has additional built-in
    least privilege identities intended for use by Application Pools.  It is recommended that the default Application Pool
    Identity be changed to a least privilege principle other than Network Service. Furthermore, it is recommended that all
    application pool identities be assigned a unique least privilege principal.
  rationale: Setting Application Pools to use least privilege identities reduces the potential harm the identity could cause
    if the application becomes compromised.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc771170%28WS.10%29.aspx
  - 2. http://learn.iis.net/page.aspx/140/understanding-built-in-user-and-groupaccounts-in-iis-7/
  page_start: 14
  audit_raw: 'Execute the following command to determine if the DefaultAppPool identity has been

    changed to ApplicationPoolIdentity:

    %systemroot%\system32\inetsrv\appcmd list config /section:applicationPools'
  remediation: 'The default Application Pool identity may be set for an application using the IIS Manager

    GUI, using AppCmd.exe commands in a command-line window, directly editing the

    configuration files, or by writing WMI scripts. Perform the following to change the default

    identity to the built-in ApplicationPoolIdentity in the IIS Manager GUI:

    1. Open the IIS Manager GUI

    2. In the connections pane, expand the server node and click Application Pools

    3. On the Application Pools page, select the DefaultAppPool, and then click Advanced

    Settings in the Actions pane

    14 | P a g e

    4. For the Identity property, click the ''...'' button to open the Application Pool

    Identity dialog box

    5. Select the Built-in account option choose ApplicationPoolIdentity from the list, or

    input a unique application user created for this purpose

    6. Restart IIS

    To change the DefaultAppPool identity to the built-in ApplicationPoolIdentity using

    AppCmd.exe, run the following from a command prompt:

    %systemroot%\system32\inetsrv\appcmd set config /section:applicationPools

    /[name=''DefaultAppPool''].processModel.identityType:ApplicationPoolIdentity

    If using a custom defined Windows user such as a dedicated service account, that user will

    need to be a member of the IIS_IUSRS group. The IIS_IUSRS group has access to all the

    necessary file and system resources so that an account, when added to this group, can

    seamlessly act as an application pool identity.'
  checks:
  - type: manual_review
    info: 'Execute the following command to determine if the DefaultAppPool identity has been

      changed to ApplicationPoolIdentity:

      %systemroot%\system32\inetsrv\appcmd list config /section:applicationPools'
    severity: medium
- id: 1.1.5
  title: Ensure Application Pools Run Under Unique Identities
  scoring: scored
  profile:
  - Level 1
  description: Application Pool Identities are the actual users/authorities that will run the worker process - w3wp.exe.  Assigning
    the correct user authority will help ensure that applications can function properly, while not giving overly permissive
    permissions on the system.  These identities can further be used in ACLs to protect system content.  It is recommended
    that each Application Pool run under a unique identity.
  rationale: Setting Application Pools to use unique identities reduces the potential harm the identity could cause should
    the application become compromised. 15 | P a g e
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc753449%28WS.10%29.aspx
  - 2. http://blogs.iis.net/tomwoolums/archive/2008/12/17/iis-7-0-applicationpools.aspx
  page_start: 15
  audit_raw: 'To verify the Application Pools have been set to run under the ApplicationPoolIdentity

    using IIS Manager:

    1. Open IIS Manager

    2. Open the Application Pools node underneath the machine node; select Application

    Pool to be verified

    3. Right click the Application Pool and select Advanced Settings…

    4. Under the Process Model section, locate the Identity option and ensure that

    ApplicationPoolIdentity is set'
  remediation: 'Setting the Application Pools to run under the ApplicationPoolIdentity will ensure that

    each pool runs under a unique authority.  To configure the identity for the Application Pool,

    run the following appcmd.exe command from a command prompt:

    %systemroot%\system32\inetsrv\appcmd set config /section:applicationPools

    /[name=''DefaultAppPool''].processModel.identityType:ApplicationPoolIdentity

    The example code above will set just the DefaultAppPool.  Run this command for each

    configured Application Pool.  Additionally, ApplicationPoolIdentity can be made the

    default for all Application Pools by using the Set Application Pool Defaults action on the

    Application Pools node.'
  checks:
  - type: manual_review
    info: 'To verify the Application Pools have been set to run under the ApplicationPoolIdentity

      using IIS Manager:

      1. Open IIS Manager

      2. Open the Application Pools node underneath the machine node; select Application

      Pool to be verified

      3. Right click the Application Pool and select Advanced Settings…

      4. Under the Process Model section, locate the Identity option and ensure that

      ApplicationPoolIdentity is set'
    severity: medium
- id: 1.1.6
  title: Ensure Unique Application Pools for Sites
  scoring: scored
  profile:
  - Level 1
  description: IIS 8.0 introduced a new security feature called Application Pool Identities that allows Application Pools
    to be run under unique accounts without the need to create and manage local or domain accounts.  It is recommended that
    all Sites run under unique, dedicated Application Pools. 16 | P a g e
  rationale: 'By setting sites to run under unique Application Pools, resource-intensive applications can be assigned to their
    own application pools which could improve server and application performance.  In addition, it can help maintain application
    availability: if an application in one pool fails, applications in other pools are not affected.  Last, isolating applications
    helps mitigate the potential risk of one application being allowed access to the resources of another application. It
    is also recommended to stop any application pool that is not in use or was created by an installation such as .Net 4.0.'
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc753449%28WS.10%29.aspx
  - 2. http://blogs.iis.net/tomwoolums/archive/2008/12/17/iis-7-0-applicationpools.aspx
  page_start: 16
  audit_raw: 'The following appcmd.exe command will give a listing of all applications configured, which

    site they are in, which application pool is serving them and which application pool identity

    they are running under:

    %systemroot%\system32\inetsrv\appcmd list app

    The output of this command will be similar to the following:

    APP "Default Web Site/" (applicationPool:DefaultAppPool)

    1. Run the above command and ensure a unique application pool is assigned for each

    site listed'
  remediation: '1. Open IIS Manager

    2. Open the Sites node underneath the machine node

    3. Select the Site to be changed

    4. In the Actions pane, select Basic Settings

    5. Click the Select… box next to the Application Pool text box

    6. Select the desired Application Pool

    7. Once selected, click OK'
  checks:
  - type: manual_review
    info: 'The following appcmd.exe command will give a listing of all applications configured, which

      site they are in, which application pool is serving them and which application pool identity

      they are running under:

      %systemroot%\system32\inetsrv\appcmd list app

      The output of this command will be similar to the following:

      APP "Default Web Site/" (applicationPool:DefaultAppPool)

      1. Run the above command and ensure a unique application pool is assigned for each

      site listed'
    severity: medium
- id: 1.1.7
  title: Configure Anonymous User Identity to Use Application Pool Identity
  scoring: scored
  profile:
  - Level 1
  description: To achieve isolation in IIS 8, application pools can be run as separate identities.  IIS can be configured
    to automatically use the application pool identity if no anonymous user account is configured for a Web site.  This can
    greatly reduce the number of accounts needed for Web sites and make management of the accounts easier.  It is recommended
    the Application Pool Identity be set as the Anonymous User Identity.
  rationale: Configuring the anonymous user identity to use the application pool identity will help ensure site isolation
    - provided sites are set to use the application pool identity.  Since a unique principal will run each application pool,
    it will ensure the identity is least privilege.  Additionally, it will simplify Site management.
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/202/application-pool-identity-as-anonymous-user/
  - 2. http://learn.iis.net/page.aspx/624/application-pool-identities/
  page_start: 18
  audit_raw: "Find and open the applicationHost.config file and verify that the userName attribute of\nthe anonymousAuthentication\
    \ tag is set to a blank string:\n<system.webServer>\n  <security>\n    <authentication>\n      <anonymousAuthentication\
    \ userName=\"\" />\n    </authentication>\n  </security>\n</system.webServer>\nThis configuration is stored in the same\
    \ applicationHost.config file for web sites and\napplication/virtual directories, at the bottom of the file, surrounded\
    \ by <location\npath=\"path/to/resource\"> tags."
  remediation: 'The Anonymous User Identity can be set to Application Pool Identity by using the IIS

    Manager GUI, using AppCmd.exe commands in a command-line window, directly editing the

    18 | P a g e

    configuration files, or by writing WMI scripts.  Perform the following to set the username

    attribute of the anonymousAuthentication node in the IIS Manager GUI:

    1. Open the IIS Manager GUI and navigate to the desired server, site, or application

    2. In Features View, find and double-click the Authentication icon

    3. Select the Anonymous Authentication option and in the Actions pane select Edit...

    4. Choose Application pool identity in the modal window and then press the OK button

    To use AppCmd.exe to configure anonymousAuthentication at the server level, the

    command would look like this:

    %windir%\system32\inetsrv\appcmd set config -section:anonymousAuthentication

    /username:"" --password'
  checks:
  - type: manual_review
    info: "Find and open the applicationHost.config file and verify that the userName attribute of\nthe anonymousAuthentication\
      \ tag is set to a blank string:\n<system.webServer>\n  <security>\n    <authentication>\n      <anonymousAuthentication\
      \ userName=\"\" />\n    </authentication>\n  </security>\n</system.webServer>\nThis configuration is stored in the same\
      \ applicationHost.config file for web sites and\napplication/virtual directories, at the bottom of the file, surrounded\
      \ by <location\npath=\"path/to/resource\"> tag"
    severity: medium
- id: 1.1.8
  title: Configure Application Pools to Run As Application Pool Identity
  scoring: scored
  profile:
  - Level 1
  description: 'Application Pool Identities allow Application Pools to be run under a unique account without having to create
    and manage domain or local accounts.  The name of the Application Pool account corresponds to the name of the Application
    Pool. Application Pool Identities were introduced in Windows Server 2008 SP2.  It is recommended that Application Pools
    be set to run as ApplicationPoolIdentity.  Note on applicable profiles: IIS 8.0 and IIS 8.5 only.'
  rationale: Setting Application Pools to use least privilege identities such as ApplicationPoolIdentity reduces the potential
    harm the identity could cause should the application become ever become compromised.
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/624/application-pool-identities/
  page_start: 19
  audit_raw: 'Execute the following command to determine if the DefaultAppPool identity has been

    changed to ApplicationPoolIdentity:

    19 | P a g e

    %systemroot%\system32\inetsrv\appcmd list config /section:applicationPools'
  remediation: 'The default Application Pool identity may be set for an application using the IIS Manager

    GUI, using AppCmd.exe commands in a command-line window, directly editing the

    configuration files, or by writing WMI scripts.  Perform the following to change the default

    identity to the built-in ApplicationPoolIdentity in the IIS Manager GUI:

    1. Open the IIS Manager GUI

    2. In the connections pane, expand the server node and click Application Pools

    3. On the Application Pools page, select the DefaultAppPool, and then click Advanced

    Settings in the Actions pane

    4. For the Identity property, click the ''...'' button to open the Application Pool

    Identity dialog box

    5. Select the Built-in account option choose ApplicationPoolIdentity from the list

    6. Restart IIS

    To change the DefaultAppPool identity to the built-in ApplicationPoolIdentity using

    AppCmd.exe, run the following from a command prompt:

    %systemroot%\system32\inetsrv\appcmd set config /section:applicationPools

    /[name=''<Your AppPool>''].processModel.identityType:ApplicationPoolIdentity'
  checks:
  - type: manual_review
    info: 'Execute the following command to determine if the DefaultAppPool identity has been

      changed to ApplicationPoolIdentity:

      19 | P a g e

      %systemroot%\system32\inetsrv\appcmd list config /section:applicationPools'
    severity: medium
- id: 1.1.9
  title: Use Only Strong Encryption Protocols
  scoring: scored
  profile:
  - Level 1
  description: New and legacy web servers are often able and configured to handle weak cryptographic options due to historic
    export restriction of high grade cryptography.  Even if high grade ciphers are normally used and installed, some server
    misconfiguration could be leveraged to force the use of a weaker protocol or cipher to gain access to the otherwise secure
    communication channel.  It is recommended that the weak encryption protocols SSL 2.0 and PCT 1.0 be disabled, and that
    SSL 3.0 and TLS 1.x be enabled. It is recommended that you implement the Diffie-Hellman Ephemeral, or DHE for short, protocol
    for PFS. 20 | P a g e
  rationale: SSL-based services should not offer the possibility to utilize weak encryption protocols or ciphers.  By disabling
    these weaker protocols, data confidentiality and integrity is further assured.
  impact: ''
  references:
  - 1. http://support.microsoft.com/kb/187498/en-us
  - 2. http://support.microsoft.com/default.aspx?scid=kb;EN-US;245030
  page_start: 20
  audit_raw: 'To verify the PCT 1.0 protocol is disabled on SP2, ensure the following key does not exist.  If

    the key does exist, ensure it is set to 0.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT

    1.0\Server\Enabled

    To verify the PCT 1.0 protocol is disabled on R2, ensure the following key does not exist.  If

    the key does exist, ensure it is set to 0.  PCT 1.0 is disabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT

    1.0\Server\DisabledByDefault

    To verify the SSL 2.0 protocol is disabled on SP2 and R2, ensure the following key is set to

    0. SSL 2.0 is enabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL

    2.0\Server\Enabled

    To verify the SSL 3.0 protocol is enabled on R2 and SP2, ensure the following key does not

    exist.  If the key does exist, ensure it is set to ffffffff.  SSL 3.0 is enabled by default on R2

    and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL

    3.0\Server\Enabled

    To verify the TLS 1.0 protocol is enabled on R2 and SP2, ensure the following key does not

    exist.  If the key does exist, ensure it is set to ffffffff.  TLS 1.0 is enabled by default on R2

    and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.0\Server\Enabled

    To verify the TLS 1.1 protocol is enabled on R2, ensure the following key is set to 0.  At the

    time of this writing, TLS 1.1 is only supported on Windows Server 2008 R2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.1\Server\DisabledByDefault

    21 | P a g e

    To verify the TLS 1.2 protocol has been enabled on R2, ensure the following key is set to

    0. At the time of this writing, TLS 1.2 is only supported on Windows Server 2008 R2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.2\Server\DisabledByDefault'
  remediation: 'To disable the PCT 1.0 protocol on R2 and SP2, ensure the following key does not exist.  If

    the key does exist, ensure it is set to 0.  PCT 1.0 is disabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT

    1.0\Server\Enabled

    To disable the SSL 2.0 protocol on SP2 and R2, ensure the following key is set to 0.  SSL 2.0

    is enabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL

    2.0\Server\Enabled

    To enable the SSL 3.0 protocol on R2 and SP2, ensure the following key does not exist.  If

    the key does exist, ensure it is set to ffffffff.  SSL 3.0 is enabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL

    3.0\Server\Enabled

    To enable the TLS 1.0 protocol on R2 and SP2, ensure the following key does not exist.  If

    the key does exist, ensure it is set to ffffffff.  TLS 1.0 is enabled by default on R2 and SP2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.0\Server\Enabled

    To enable the TLS 1.1 protocol on R2, ensure the following key is set to 0.  At the time of

    this writing, TLS 1.1 is only supported on Windows Server 2008 R2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.1\Server\DisabledByDefault

    To enable the TLS 1.2 protocol on R2, ensure the following key is set to 0.  At the time of

    this writing, TLS 1.2 is only supported on Windows Server 2008 R2.

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS

    1.2\Server\DisabledByDefault'
  checks:
  - type: manual_review
    info: 'To verify the PCT 1.0 protocol is disabled on SP2, ensure the following key does not exist.  If

      the key does exist, ensure it is set to 0.

      HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT

      1.0\Server\Enabled

      To verify the PCT 1.0 protocol is disabled on R2, ensure the following key does not exist.  If

      the key does exist, ensure it is set to 0.  PCT 1.0 is disabled by default on R2 and SP2.

      HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT'
    severity: medium
- id: 1.1.10
  title: Disable Weak Cipher Suites
  scoring: scored
  profile:
  - Level 1
  description: Both SSL 3.0 and TLS 1.0 provide options to use different cipher suites.  Each cipher suite determines the
    key exchange, authentication, encryption, and MAC algorithms used within a SSL/TLS session.  It is recommended that weak
    ciphers be disabled.
  rationale: SSL-based services should not offer the possibility to utilize weak protocols or ciphers.  By disabling these
    weak ciphers, there is a better chance of maintaining data confidentiality and integrity.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29
  - 2. http://support.microsoft.com/kb/245030/en-us
  page_start: 23
  audit_raw: 'To verify the DES 56/56 cipher has been disabled, ensure the following key does not exist

    or is set to 0:

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\DES 56/56

    To verify the NULL cipher has been disabled, ensure the following key does not exist or is

    set to 0:

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\NULL\Enabled

    To verify the RC2 40/128 cipher has been disabled, ensure the following key does not exist

    or is set to 0:

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\RC2

    40/128\Enabled

    To verify the RC2 56/128 cipher has been disabled, ensure the following key does not exist

    or is set to 0:

    23 | P a g e

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\RC2

    56/128\Enabled

    To verify the RC4 40/128 cipher has been disabled, ensure the following key does not exist

    or is set to 0:

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\RC4

    40/128\Enabled

    To verify the RC4 56/128 cipher has been disabled, ensure the following key does not exist

    or is set to 0:

    HKLM\System\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Ciphers\RC4

    56/128\Enabled

