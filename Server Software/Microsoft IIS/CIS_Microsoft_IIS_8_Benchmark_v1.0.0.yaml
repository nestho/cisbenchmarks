- id: 1.2.1
  title: Configure Global Authorization Rule to Restrict Access
  scoring: scored
  profile:
  - Level 1
  description: IIS 7 introduced URL Authorization, which allows the addition of Authorization rules to the actual URL, instead
    of the underlying file system resource, as a way to protect it.  Authorization rules can be configured at the server,
    web site, folder (including Virtual Directories), or file level.  The native URL Authorization module applies to all requests,
    whether they are .NET managed or other types of files (e.g. static files or ASP files).  It is recommended that URL Authorization
    be configured to only grant access to the necessary security principals. 28 | P a g e
  rationale: Configuring a global Authorization rule that restricts access will ensure inheritance of the settings down through
    the hierarchy of web directories; if that content is copied elsewhere, the authorization rules flow with it.  This will
    ensure access to current and future content is only granted to the appropriate principals, mitigating risk of accidental
    or unauthorized access.
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/142/understanding-iis-70-url-authorization/
  - 2. http://learn.iis.net/page.aspx/110/changes-between-iis6-and-iis7-security/
  page_start: 28
  audit_raw: "At the web site or application level, verify that the authorization rule configured has been\napplied:\n1. Connect\
    \ to Internet Information Services (IIS Manager)\n2. Select the site or application where Authorization was configured\n\
    3. Select Authorization Rules and verify the configured rules were added\nTo verify an authorization rule specifying no\
    \ access to all users except the Administrators\ngroup, browse to and open the web.config file for the configured site/application/content:\n\
    <configuration>\n  <system.webServer>\n    <security>\n      <authorization>\n        <remove users=\"*\" roles=\"\" verbs=\"\
    \" />\n        <add accessType=\"Allow\" roles=\"administrators\" />\n      </authorization>\n    </security>\n  </system.webServer>\n\
    </configuration>"
  remediation: 'To configure URL Authorization at the server level using IIS Manager:

    1. Connect to Internet Information Services (IIS Manager)

    2. Select the server

    3. Select Authorization Rules

    4. Remove the "Allow All Users" rule

    5. Click Add Allow Rule…

    6. Allow access to the user(s), user groups, or roles that are authorized across all of the

    web sites and applications (e.g. the Administratorsgroup)'
