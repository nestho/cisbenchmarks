    \ Custom:\n50 | P a g e\n<system.web>\n  <system.webServer>\n    <httpErrors errorMode=\"DetailedLocalOnly\">\n    </httpErrors>\n\
    \  </system.webServer>\n</system.web>"
  remediation: 'The following describes how to change the errorMode attribute to DetailedLocalOnly or

