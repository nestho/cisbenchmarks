- id: 1.4.1
  title: Configure maxAllowedContentLength Request Filter
  scoring: scored
  profile:
  - Level 2
  description: The maxAllowedContentLength Request Filter is the maximum size of the http request, measured in bytes, which
    can be sent from a client to the server.  Configuring this value enables the total request size to be restricted to a
    configured value.  It is recommended that the overall size of requests be restricted to a maximum value appropriate for
    the server, site, or application.
  rationale: Setting an appropriate value that has been tested for the maxAllowedContentLength filter will lower the impact
    an abnormally large request would otherwise have on IIS and/or web applications.  This helps to ensure availability of
    web content and services, and may also help mitigate the risk of buffer overflow type attacks in unmanaged components.
  impact: ''
  references:
  - 1. http://www.iis.net/ConfigReference/system.webServer/security/requestFiltering/
  - 2. http://learn.iis.net/page.aspx/143/use-request-filtering/
  page_start: 52
  audit_raw: "Upon exceeding the configured value set for the Request Filter, IIS will throw a Status Code\n404.13.\nTo manually\
    \ verify the change, locate and open the web.config for the web site or\napplication in which the request filter was set.\
    \  Ensure the value defined for\nmaxAllowedContentLength is what was set.  The 28.6MB max example would show:\n<configuration>\n\
