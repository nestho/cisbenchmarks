- id: 1.5.3
  title: ETW Logging
  scoring: scored
  profile:
  - Level 1
  description: IIS 8.5 introduces a new logging method. Administrators can now send logging information to Event Tracing for
    Windows (ETW)
  rationale: IIS flushes log information to disk, therefore prior to IIS 8.5, administrators do not have access to real-time
    logging information. Text-based log files can also be difficult and time consuming to process. By enabling ETW, administrators
    have access to use standard query tools for viewing real-time logging information.
  impact: ''
  references:
