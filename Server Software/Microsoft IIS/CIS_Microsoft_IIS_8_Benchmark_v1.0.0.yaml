- id: 1.3.5
  title: Configure Use Cookies Mode for Session State
  scoring: scored
  profile:
  - Level 2
  description: A session cookie associates session information with client information for that session, which can be the
    duration of a user's connection to a site.  The cookie is passed in a HTTP header together with all requests between the
    client and server. 44 | P a g e Session information can also be stored in the URL.  However, storing session information
    in this manner has security implications that can open attack vectors such as session hijacking.  An effective method
    used to prevent session hijacking attacks is to force web applications to use cookies to store the session token.  This
    is accomplished by setting the cookieless attribute of the sessionState node to UseCookies or False which will in turn
    keep session state data out of URI.  It is recommended that session state be configured to UseCookies.
  rationale: Cookies that have been properly configured help mitigate the risk of attacks such as session hi-jacking attempts
    by preventing ASP.NET from having to move session information to the URL; moving session information in URI causes session
    IDs to show up in proxy logs, and is accessible to client scripting via document.location.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc770672%28WS.10%29.aspx
  - 2. http://msdn.microsoft.com/en-us/library/h6bb9cz9%28VS.71%29.aspx
  page_start: 44
  audit_raw: "Find and open the web.config file for the application/site and verify that the sessionState\ntag is set to use\
    \ cookies:\n<system.web>\n  <sessionState cookieless=\"UseCookies\" />\n</system.web>"
  remediation: 'SessionState can be set to UseCookies by using the IIS Manager GUI, using AppCmd.exe

    commands in a command-line window, directly editing the configuration files, or by writing

    WMI scripts.  Perform the following to set the cookieless attribute of the sessionState

    node to UseCookies in the IIS Manager GUI:

    1. Open the IIS Manager GUI and navigate desired server, site, or application

    2. In Features View, find and double-click the Session State icon

    3. In the Cookie Settings section, choose Use Cookies from the Mode dropdown

    4. In the Actions Pane, click Apply

    To use AppCmd.exe to configure sessionState at the server level, the command would look

    like this:

    %windir%\system32\inetsrv\appcmd set config /commit:WEBROOT /section:sessionState

    /cookieless:UseCookies /cookieName:ASP.NET_SessionID /timeout:20

    Note: When Appcmd.exe is used to configure the <sessionstate> element at the global

    level in IIS 8.0, the /commit:WEBROOT switch must be included so that configuration changes

    are made to the root web.config file instead of ApplicationHost.config.

    45 | P a g e'
  checks:
  - type: manual_review
    info: "Find and open the web.config file for the application/site and verify that the sessionState\ntag is set to use\
      \ cookies:\n<system.web>\n  <sessionState cookieless=\"UseCookies\" />\n</system.web>"
    severity: medium
- id: 1.3.6
  title: Ensure Cookies Are Set With HttpOnly Attribute
  scoring: scored
  profile:
  - Level 2
  description: The httpOnlyCookies attribute of the httpCookies node determines if IIS will set the HttpOnly flag on HTTP
    cookies it sets.  The HttpOnly flag indicates to the user agent that the cookie must not be accessible by client-side
    script (i.e document.cookie).  It is recommended that the httpOnlyCookies attribute be set to true.
  rationale: When cookies are set with the HttpOnly flag, they cannot be accessed by client side scripting running in the
    user's browser.  Preventing client-side scripting from accessing cookie content may reduce the probability of a cross
    site scripting attack materializing into a successful session hijack.
  impact: ''
  references:
