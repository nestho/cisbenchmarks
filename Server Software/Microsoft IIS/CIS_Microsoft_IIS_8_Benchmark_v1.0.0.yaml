- id: 1.4.10
  title: Disable HTTP Trace Method
  scoring: scored
  profile:
  - Level 1
  description: The HTTP TRACE method returns the contents of client HTTP requests in the entity-body of the TRACE response.  Attackers
    could leverage this behavior to access sensitive information, such as authentication data or cookies, contained in the
    HTTP headers of the request.  One such way to mitigate this is by using the <verbs> element of the <requestFiltering>
    collection, which was introduced in IIS 7.0.  The <verbs> element replaces the [AllowVerbs] and [DenyVerbs] features in
    IIS 6.0 UrlScan.  It is recommended the HTTP TRACE method be denied.
  rationale: Attackers may abuse HTTP TRACE functionality to gain access to information in HTTP headers such as cookies and
    authentication data.  This risk can be mitigated by not allowing the TRACE verb. 63 | P a g e
  impact: ''
  references:
  - 1. http://www.kb.cert.org/vuls/id/867593
  - 2. http://www.iis.net/ConfigReference/system.webServer/security/requestFiltering/
  - 1.5 IIS Logging Recommendations
