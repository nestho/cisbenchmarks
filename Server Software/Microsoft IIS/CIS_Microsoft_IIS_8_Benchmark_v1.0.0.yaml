    info: "To verify that the authentication module is enabled for a specific site, application, or\ncontent, browse to and\
      \ open the web.config file pertaining to the content.  Verify the\nconfiguration file now has a mode defined within\
      \ the <authentication>tags.  The example\nbelow shows that Forms Authentication is configured, cookies will always be\
      \ used, and SSL\nis required:\n<system.web>\n  <authentication>\n    <forms cookieless=\"UseCookies\" requireSSL=\"\
      true\" />\n  </authentication>\n</system.web>"
