- id: 1.2.4
  title: Configure Forms Authentication to Use Cookies
  scoring: scored
  profile:
  - Level 2 - IIS 7.0
  description: Forms Authentication can be configured to maintain the site visitor's session identifier in either a URI or
    cookie. It is recommended that Forms Authentication be set to use cookies.
  rationale: Using cookies to manage session state may help mitigate the risk of session hi-jacking attempts by preventing
    ASP.NET from having to move session information to the URL. Moving session information identifiers into the URL may cause
    session IDs to show up in proxy logs, browsing history, and be accessible to client scripting via document.location.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc732830%28WS.10%29.aspx
