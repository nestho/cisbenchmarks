- id: 1.4.6
  title: Disallow Unlisted File Extensions
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: The FileExtensions Request Filter allows administrators to define specific extensions their web server(s) will
    allow and disallow. The property allowUnlisted will cover all other file extensions not explicitly allowed or denied.
