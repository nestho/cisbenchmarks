    \ verify the below\nconfiguration:\n<configuration>\n  <system.webServer>\n    <security>\n       <requestFiltering>\n\
    \          <verbs>\n            <add verb=\"TRACE\" allowed=\"false\" />\n          </verbs>\n        </requestFiltering>\n\
