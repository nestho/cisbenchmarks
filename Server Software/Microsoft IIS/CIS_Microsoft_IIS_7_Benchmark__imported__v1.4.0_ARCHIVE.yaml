- id: 1.1.13
  title: Enable Dynamic IP Address Restrictions
  scoring: manual
  profile:
  - Level 1 - IIS 7.0
  - Level 1 - IIS 7.5
  description: An add-on module for IIS 7.0 introduced the concept of Dynamic IP Address Restrictions which can be used to
    thwart DDos attacks. This is different than the IP Address Restrictions that can be manually maintained within IIS. The
    default action Deny action for restrictions is to return a Forbidden response to the client
  rationale: Dynamic IP address filtering allows administrators to configure the server to block access for IPs that exceed
    the specified number of requests. Ensure that you receive the Forbidden page once the block has been enforced.
  impact: ''
  references:
