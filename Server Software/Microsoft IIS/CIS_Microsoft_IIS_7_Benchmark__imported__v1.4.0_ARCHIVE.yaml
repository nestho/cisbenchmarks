- id: 1.5.1
  title: Move Default IIS Web Log Location
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: IIS will log relatively detailed information on every request. These logs are usually the first item looked
    at in a security response, and can be the most valuable. Malicious users are aware of this, and will often try to remove
    evidence of their activities. It is therefore recommended that the default location for IIS log files be changed to a
    restricted, non-system drive.
  rationale: Moving IIS logging to a restricted, non-system drive will help mitigate the risk of logs being maliciously altered,
    removed, or lost in the event of system drive failure(s).
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/579/advanced-logging-for-iis-70---customlogging%23open
  - 2. http://jefferytay.wordpress.com/2010/03/02/iis-6-and-iis-7-http-error/
  page_start: 100
  audit_raw: 'To verify web logs are being logged to the new location, open Windows Explorer and

    browse to the path that was defined. Depending on how the logging was configured,

    there will be either:

    1. A folder containing .log files or

    2. .log files in the root of the specified directory'
  remediation: 'Moving the default log location can be easily accomplished using the Logging feature in

    the IIS Management UI or AppCmd.exe. To change to D:\LogFiles using AppCmd.exe:

    %windir%\system32\inetsrv\appcmd set config -section:sites -

    siteDefaults.logfile.directory:"D:\LogFiles"

    Moving log file stores to a non-system drive or partition separate from where web

    applications run and/or content is served is preferred. Additionally, folder-level NTFS

    permissions should be set as restrictive as possible; Administrators and SYSTEM are

    typically the only principals requiring access.

    Note: While standard IIS logs can be moved and edited using IIS Manager, additional

    management tool add-ons are required in order to manage logs generated by other IIS

    features, such as Request Filtering and IIS Advanced Logging. These add-ons can be

    obtained using the Web Platform Installer or from Microsoft''s site. The HTTPErr logging

    location can be changed by adding a registry key'
  checks:
  - type: manual_review
    info: 'To verify web logs are being logged to the new location, open Windows Explorer and

      browse to the path that was defined. Depending on how the logging was configured,

      there will be either:

      1. A folder containing .log files or

      2. .log files in the root of the specified directory'
    severity: medium
- id: 1.5.2
  title: Enable Advanced IIS Logging
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: IIS Advanced Logging is a module which provides flexibility in logging requests and client data. It provides
    controls that allow businesses to specify what fields are important, easily add additional fields, and provide policies
    pertaining to log file rollover and Request Filtering. HTTP request/response headers, server variables, and clientside
    fields can be easily logged with minor configuration in the IIS management console. It is recommended that Advanced Logging
    be enabled, and the fields which could be of value to the type of business or application in the event of a security incident,
    be identified and logged.
  rationale: Many of the fields available in Advanced Logging many can provide extensive, real-time data and details not otherwise
    obtainable. Developers and security professionals can use this information to identify and remediate application vulnerabilities/attack
    patterns.
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/579/advanced-logging-for-iis-70---customlogging#open
  - 2. http://technet.microsoft.com/en-us/library/cc732826%28WS.10%29.aspx
  page_start: 102
  audit_raw: 'Browse to the location of the Advanced Logs and verify .log files are being generated.

    Note that logs will be written to disk after a non-determined period of time. They can be

    written into their specified directory immediately if, in the Log Definition, the Publish realtime events and Write to
    disk options are selected.'
  remediation: 'IIS Advanced Logging can be configured for servers, Web sites, and directories in IIS

    Manager. To enable Advanced Logging using the UI:

    1. Open Internet Information Services (IIS) Manager

    2. Click the server in the Connections pane

    3. Double-click the Advanced Logging icon on the Home page

    4. Click Enable Advanced Logging in the Actions pane

    The fields that will be logged need to be configured using the Edit Logging Fields action.

    As with IIS''s standard log files, their location should be changed.

    Note: There may be performance considerations depending on the extent of the

    configuration.'
  checks:
  - type: manual_review
    info: 'Browse to the location of the Advanced Logs and verify .log files are being generated.

      Note that logs will be written to disk after a non-determined period of time. They can be

      written into their specified directory immediately if, in the Log Definition, the Publish realtime events and Write
      to disk options are selected.'
    severity: medium
- id: 1.6.1
  title: Encrypt FTP Requests
  scoring: manual
  profile:
  - Level 1 - IIS 7.0
  description: The new FTP Publishing Service for IIS 7.0 supports adding an SSL certificate to an FTP site. Using an SSL
    certificate with an FTP site is also known as FTP-S or FTP over Secure Socket Layers (SSL). FTP-S is an RFC standard (RFC
    4217) where an SSL certificate is added to an FTP site and thereby making it possible to perform secure file transfers.
  rationale: By using SSL, the FTP transmission is encrypted and secured from point to point and all FTP traffic as well as
    credentials are thereby guarded against interception.
  impact: ''
  references:
  - 1. http://www.windowsnetworking.com/articles_tutorials/IIS-FTP-Publishing-ServicePart3.html
  - 2. http://learn.iis.net/page.aspx/304/using-ftp-over-ssl/#03
  page_start: 105
  audit_raw: 'The FTP site will now require the use of FTP-S; test this by attempting to use an FTP

    client which either does not support FTP-S or is not configured to use FTP-S. If setup

    was successful, the request will fail. Conversely, open a command prompt from the

    server and type ftp localhost. After entering credentials the server should return and

    Access is denied message.'
  remediation: 'To secure an existing FTP site using a SSL Certificate, a certificate must first be

    installed on the system. Production systems should always use a third party certificate

    from a trusted root, such as VeriSign. Once that certificate is installed for use in IIS,

    follow the steps below to configure the FTP site for SSL:

    1. Open IIS Manager, select the FTP server and choose FTP SSL Settings in the

    Features View pane

    2. Under the SSL Certificate dropdown, choose the SSL certificate to be configured

    for use

    3. In the SSL Policy section, click the radio button next to Require SSL connections;

    it is important to require SSL, because allow SSL still permits non-SSL FTP

    4. Click Apply in the Actions pane

    The new FTP service for IIS 7.0 is not installed by default nor is it available for enabling.

    FTP 7.5 for IIS 7 is available from Microsoft''s web site.'
  checks:
  - type: manual_review
    info: 'The FTP site will now require the use of FTP-S; test this by attempting to use an FTP

      client which either does not support FTP-S or is not configured to use FTP-S. If setup

      was successful, the request will fail. Conversely, open a command prompt from the

      server and type ftp localhost. After entering credentials the server should return and

      Access is denied message.'
    severity: medium
