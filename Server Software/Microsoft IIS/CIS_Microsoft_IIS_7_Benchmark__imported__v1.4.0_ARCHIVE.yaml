    for IIS Manager User accounts within the configuration file. IIS Manager Users can use the administration interface to
    connect to sites and applications in which they've been granted authorization. Note that the <credentials> element only
    applies when the default provider, ConfigurationAuthenticationProvider, is configured as the authentication provider.
