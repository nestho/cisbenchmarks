    info: "To verify that the authentication module is enabled for a specific site, application, or\ncontent, browse to and\
      \ open the web.config file pertaining to the content. Verify the\nconfiguration file now has a mode defined within the\
      \ <authentication>tags. The\nexample below shows that Forms Authentication is configured, cookies will always be\nused,\
      \ and SSL is required:\n<system.web>\n  <authentication>\n    <forms cookieless=\"UseCookies\" requireSSL=\"true\" />\n\
      \  </authentication>\n</system.web>"
    severity: medium
- id: 1.2.3
  title: Require SSL in Forms Authentication
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: Forms-based authentication can pass credentials across the network in clear text. It is therefore imperative
    that the traffic between client and server be encrypted using SSL, especially in cases where the site is publicly accessible.
    It is recommended that communications with any portion of a site using Forms Authentication be encrypted using SSL.
  rationale: Requiring SSL for Forms Authentication will protect the confidentiality of credentials during the login process,
    helping mitigate the risk of stolen user information.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc771077(WS.10).aspx
  page_start: 49
  audit_raw: "To verify that SSL is required for forms authentication for a specific site, application, or\ncontent, browse\
    \ to and open the web.config file for the level in which forms\nauthentication was enabled. Verify the tag <forms requireSSL=\"\
    true\" />:\n<system.web>\n  <authentication>\n    <forms requireSSL=\"true\" />\n  </authentication>\n</system.web>"
  remediation: '1. Open IIS Manager and navigate to the appropriate tier

