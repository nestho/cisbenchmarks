      \ like:\n<configuration>\n  <system.web>\n  ...\n    <trace enabled=\"true\">\n  ...\n  </system.web>\n</configuration>\n\
      Note that tracing is configurable at numerous levels: 1. Machine.config 2. Root-level\nweb.config 3. Application-level\
      \ web.config 4. Virtual or physical directory-le"
