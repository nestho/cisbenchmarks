    info: 'To verify the permissions have been removed:

      1. Obtain the machine GUID at the Registry Value "MachineGuid" in the Registry

      Key: HKEY\_LOCAL\_MACHINE\\SOFTWARE\\Microsoft\\Cryptography

      2. Next, open a command prompt and run the following icacls command, ensuring

      that BUILTIN\\IIS\_IUSRS(R) has been removed:

      icacls

      %ALLUSERSPROFILE%\Microsoft\Crypto\RSA\MachineKeys\76944fb33636aeddb9590521c2

      e8815a_<em><MachineGUID></em>'
    severity: medium
- id: 1.2.8
  title: Configure SSL for Basic Authentication
  scoring: manual
  profile:
  - Level 1 - IIS 7.0
  description: Basic Authentication can pass credentials across the network in clear text. It is therefore imperative that
    the traffic between client and server be encrypted using SSL, especially in cases where the site is publicly accessible
    and is recommended that SSL be configured and required for any Site or Application using Basic Authentication.
  rationale: Credentials sent in clear text can be easily intercepted by malicious code or persons. Enforcing the use of Secure
    Sockets Layer will help mitigate the chances of hijacked credentials.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/dd378853%28WS.10%29.aspx
  page_start: 58
  audit_raw: 'Once SSL has been configured and required for a Site or application, only the https://

    address will be available. Attempt loading the Site or application for which Basic

    Authentication is configured using http://, the requests will fail and IIS will throw a 403.4

    - Forbidden error.'
  remediation: 'To Use Basic Authentication with SSL:

    1. Open IIS Manager

    2. In the Connections pane on the left, select the server to be configured

    3. In the Connections pane, expand the server, then expand Sites and select the

    site to be configured

    4. In the Actions pane, click Bindings; the Site Bindings dialog appears

    5. If an HTTPS binding is available, click Close and see below "To require SSL"

    6. If no HTTPS binding is visible, perform the following steps

    To add an HTTPS binding:

    1. In the Site Bindings dialog, click Add; the Add Site Binding dialog appears

    2. Under Type, select https

    3. Under SSL certificate, select an SSL certificate

    4. Click OK, then close

    To require SSL:

    1. In Features View, double-click SSL Settings

    2. On the SSL Settings page, select Require SSL, and Require 128-bit SSL

    3. In the Actions pane, click Apply'
  checks:
  - type: manual_review
    info: 'Once SSL has been configured and required for a Site or application, only the https://

      address will be available. Attempt loading the Site or application for which Basic

      Authentication is configured using http://, the requests will fail and IIS will throw a 403.4

      - Forbidden error.'
    severity: medium
- id: 1.3.1
  title: Set Deployment Method to Retail
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: The <deployment retail> switch is intended for use by production IIS 7.0 servers. This switch is used to help
    applications run with the best possible performance and least possible security information leakages by disabling the
    application's ability to generate trace output on a page, disabling the ability to display detailed error messages to
    end users, and disabling the debug switch. Often times, switches and options that are developer-focused, such as failed
    request tracing and debugging, are enabled during active development. It is recommended that the deployment method on
    any production server be set to retail.
  rationale: Utilizing the switch specifically intended for production IIS servers will eliminate the risk of vital application
    and system information leakages that would otherwise occur if tracing or debug were to be left enabled, or customErrors
    were to be left off.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-US/library/ms228298%28VS.80%29.aspx
  page_start: 61
  audit_raw: "After the next time IIS is restarted, open the machine.config file and verify that\n<deployment retail=\"true\"\
    \ /> remains set to true.\n<system.web>\n  <deployment retail=\"true\" />\n</system.web>"
  remediation: '1. Open the machine.config file located in:

    %windir%\\Microsoft.NET\\Framework\\_<framework\_version>_\\CONFIG

    2. Add the line <deployment retail="true" /> within the <system.web> section

    3. If systems are 64-bit, do the same for the machine.config located:

    %windir%\\Microsoft.NET\\Framework64\\_<framework\_version>_\\CONFIG'
  checks:
  - type: manual_review
    info: "After the next time IIS is restarted, open the machine.config file and verify that\n<deployment retail=\"true\"\
      \ /> remains set to true.\n<system.web>\n  <deployment retail=\"true\" />\n</system.web>"
    severity: medium
- id: 1.3.2
  title: Turn Debug Off
  scoring: scored
  profile:
  - Level 2 - IIS 7.0
  description: Developers often enable the debug mode during active ASP.NET development so that they do not have to continually
    clear their browsers cache every time they make a change to a resource handler. The problem would arise from this being
    left "on" or set to "true". Compilation debug output is displayed to the end user, allowing malicious persons to obtain
    detailed information about applications. This is a defense in depth recommendation due to the <deployment retail="true"
    /> in the machine.config configuration file overriding any debug settings. It is recommended that debugging still be turned
    off.
  rationale: Setting <compilation debug> to false ensures that detailed error information does not inadvertently display during
    live application usage, mitigating the risk of application information leakage falling into unscrupulous hands.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc725812%28WS.10%29.aspx
  page_start: 62
  audit_raw: "Browse to and open the web.config file pertaining to the server or specific application\nthat has been configured.\
    \ Locate the <compilation debug>switch and verify it is set to\nfalse.\n<configuration>\n  <system.web>\n    <compilation\
    \ debug=\"false\" />\n  </system.web>\n</configuration>"
  remediation: 'To use the UI to make this change:

    1. Open IIS Manager and navigate desired server, site, or application

    2. In Features View, double-click .NET Compilation

    3. On the .NET Compilation page, in the Behavior section, ensure the Debug field is

    set to False

    4. When finished, click Apply in the Actions pane

    Note: The <compilation debug> switch will not be present in the web.config file unless

    it has been added manually, or has previously been configured using the IIS Manager

    GUI.'
  checks:
  - type: manual_review
    info: "Browse to and open the web.config file pertaining to the server or specific application\nthat has been configured.\
      \ Locate the <compilation debug>switch and verify it is set to\nfalse.\n<configuration>\n  <system.web>\n    <compilation\
      \ debug=\"false\" />\n  </system.web>\n</configuration>"
    severity: medium
- id: 1.3.3
  title: Ensure Custom Error Messages are not Off
  scoring: scored
  profile:
  - Level 2 - IIS 7.0
  description: 'When an ASP.NET application fails and causes an HTTP/1.x 500 Internal Server Error, or a feature configuration
    (such as Request Filtering) prevents a page from being displayed, an error message will be generated. Administrators can
    choose whether or not the application should display a friendly message to the client, detailed error message to the client,
    or detailed error message to localhost only. The <customErrors> tag in the web.config has three modes: • On: Specifies
    that custom errors are enabled. If no defaultRedirect attribute is specified, users see a generic error. The custom errors
    are shown to the remote clients and to the local host • Off: Specifies that custom errors are disabled. The detailed ASP.NET
    errors are shown to the remote clients and to the local host • RemoteOnly: Specifies that custom errors are shown only
    to the remote clients, and that ASP.NET errors are shown to the local host. This is the default value This is a defense
    in depth recommendation due to the <deployment retail="true" /> in the machine.config file overriding any settings for
    customErrors to be turned Off. It is recommended that customErrors still be turned to On or RemoteOnly.'
  rationale: customErrors can be set to On or RemoteOnly without leaking detailed application information to the client. Ensuring
    that customErrors is not set to Off will help mitigate the risk of malicious persons learning detailed application error
    and server configuration information.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/h0hfz6fc.aspx
  - 2. http://technet.microsoft.com/en-us/library/dd569096%28WS.10%29.aspx
  page_start: 64
  audit_raw: 'Find and open the web.config file for the application/site and verify that the tag has

    either <customErrors mode="RemoteOnly" /> or <customErrors mode="On" /> defined.'
  remediation: 'customErrors may be set for a server, site, or application using the IIS Manager GUI,

    using AppCmd.exe commands in a command-line window, directly editing the

    configuration files, or by writing WMI scripts. Perform the following to set the

    customErrors mode to RemoteOnly or On for a Web Site in the IIS Manager GUI:

    1. Open the IIS Manager GUI and navigate to the site to be configured

    2. In Features View, find and double-click .NET Error Pages icon

    3. In the Actions Pane, click Edit Feature Settings

    4. In modal dialog, choose On or Remote Only for Mode settings

    5. Click OK'
  checks:
  - type: manual_review
    info: 'Find and open the web.config file for the application/site and verify that the tag has

      either <customErrors mode="RemoteOnly" /> or <customErrors mode="On" /> defined.'
    severity: medium
- id: 1.3.4
  title: ASP.NET stack tracing is Not Enabled
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: The trace element configures the ASP.NET code tracing service that controls how trace results are gathered,
    stored, and displayed. When tracing is enabled, each page request generates trace messages that can be appended to the
    page output or stored in an application trace log. This is a defense in depth recommendation due to the <deployment retail="true"
    /> in the machine.config file overriding any settings for ASP.NET stack tracing that are left on. It is recommended that
    ASP.NET stack tracing still be turned off.
  rationale: In an active Web Site, tracing should not be enabled because it can display sensitive configuration and detailed
    stack trace information to anyone who views the pages in the site. If necessary, the localOnly attribute can be set to
    true to have trace information displayed only for localhost requests. Ensuring that ASP.NET stack tracing is not on will
    help mitigate the risk of malicious persons learning detailed stack trace information.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-us/library/94c55d08%28v=vs.100%29.aspx
  - 2. http://msdn.microsoft.com/en-us/library/0x5wc973%28v=vs.100%29.aspx
