- id: 1.3.5
  title: Configure Use Cookies Mode for Session State
  scoring: scored
  profile:
  - Level 2 - IIS 7.0
  description: A session cookie associates session information with client information for that session, which can be the
    duration of a user's connection to a site. The cookie is passed in a HTTP header together with all requests between the
    client and server. Session information can also be stored in the URL. However, storing session information in this manner
    has security implications that can open attack vectors such as session hijacking. An effective method used to prevent
    session hijacking attacks is to force web applications to use cookies to store the session token. This is accomplished
    by setting the cookieless attribute of the sessionState node to UseCookies or False which will in turn keep session state
    data out of URI. It is recommended that session state be configured to UseCookies.
  rationale: Cookies that have been properly configured help mitigate the risk of attacks such as session hi-jacking attempts
    by preventing ASP.NET from having to move session information to the URL; moving session information in URI causes session
    IDs to show up in proxy logs, and is accessible to client scripting via document.location.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc770672%28WS.10%29.aspx
  - 2. http://msdn.microsoft.com/en-us/library/h6bb9cz9%28VS.71%29.aspx
  page_start: 68
  audit_raw: "Find and open the web.config file for the application/site and verify that the\nsessionState tag is set to use\
    \ cookies:\n<system.web>\n  <sessionState cookieless=\"UseCookies\" />\n</system.web>"
  remediation: 'SessionState can be set to UseCookies by using the IIS Manager GUI, using

    AppCmd.exe commands in a command-line window, directly editing the configuration

    files, or by writing WMI scripts. Perform the following to set the cookieless attribute of

    the sessionState node to UseCookies in the IIS Manager GUI:

    1. Open the IIS Manager GUI and navigate desired server, site, or application

    2. In Features View, find and double-click the Session State icon

    3. In the Cookie Settings section, choose Use Cookies from the Mode dropdown

    4. In the Actions Pane, click Apply

    To use AppCmd.exe to configure sessionState at the server level, the command would

    look like this:

    %windir%\system32\inetsrv\appcmd set config /commit:WEBROOT

    /section:sessionState /cookieless:UseCookies /cookieName:ASP.NET_SessionID

    /timeout:20

    Note: When Appcmd.exe is used to configure the <sessionstate> element at the global

    level in IIS 7.0, the /commit:WEBROOT switch must be included so that configuration

    changes are made to the root web.config file instead of ApplicationHost.config.'
  checks:
  - type: manual_review
    info: "Find and open the web.config file for the application/site and verify that the\nsessionState tag is set to use\
      \ cookies:\n<system.web>\n  <sessionState cookieless=\"UseCookies\" />\n</system.web>"
    severity: medium
- id: 1.3.6
  title: Ensure Cookies Are Set With HttpOnly Attribute
  scoring: scored
  profile:
  - Level 2 - IIS 7.0
  description: The httpOnlyCookies attribute of the httpCookies node determines if IIS will set the HttpOnly flag on HTTP
    cookies it sets. The HttpOnly flag indicates to the user agent that the cookie must not be accessible by client-side script
    (i.e document.cookie). It is recommended that the httpOnlyCookies attribute be set to true.
  rationale: When cookies are set with the HttpOnly flag, they cannot be accessed by client side scripting running in the
    user's browser. Preventing client-side scripting from accessing cookie content may reduce the probability of a cross site
    scripting attack materializing into a successful session hijack.
  impact: ''
  references:
  - 1. http://authors.aspalliance.com/aspxtreme/aspnet/syntax/httpCookies.aspx
  - 2. http://www.asp101.com/tips/index.asp?id=160
  page_start: 70
  audit_raw: 'After the next time IIS is restarted, browse to and open the web.config for the

    application in which httpOnly cookies have been turned on. Confirm the

    httpOnlyCookies attribute is set to true: <httpCookies httpOnlyCookies="true" />.'
  remediation: "1. Locate and open the application's web.config file\n2. Add the <httpCookies httpOnlyCookies=\"true\" />\
    \ tag within <system.web>:\n<configuration>\n  <system.web>\n    <httpCookies httpOnlyCookies=\"true\" />\n  </system.web>\n\
    </configuration>\nNote: Setting the value of the httpOnlyCookies attribute of the httpCookies element to\ntrue will add\
    \ the HttpOnly flag to all the cookies set by the application. This attribute,\nHttpOnly, is currently only recognized\
    \ by modern versions of Internet Explorer; older\nversions will either treat them as normal cookies or simply ignore them\
    \ altogether."
  checks:
  - type: manual_review
    info: 'After the next time IIS is restarted, browse to and open the web.config for the

      application in which httpOnly cookies have been turned on. Confirm the

      httpOnlyCookies attribute is set to true: <httpCookies httpOnlyCookies="true" />.'
    severity: medium
- id: 1.3.7
  title: Configure MachineKey Validation Method
  scoring: manual
  profile:
  - Level 1 - IIS 7.0
  description: 'The machineKey element of the ASP.NET web.config specifies the algorithm and keys that ASP.NET will use for
    encryption. The Machine Key feature can be managed to specify hashing and encryption settings for application services
    such as view state, Forms authentication, membership and roles, and anonymous identification. The following encryption
    methods are available: • Advanced Encryption Standard (AES) is relatively easy to implement and requires little memory.
    AES has a key size of 128, 192, or 256 bits. This method uses the same private key to encrypt and decrypt data, whereas
    a public-key method must use a pair of keys • Message Digest 5 (MD5) is used for digital signing of applications. This
    method produces a 128-bit message digest, which is a compressed form of the original data • Secure Hash Algorithm (SHA1)
    is considered more secure than MD5 because it produces a 160-bit message digest • Triple Data Encryption Standard (TripleDES)
    is a minor variation of Data Encryption Standard (DES). It is three times slower than regular DES but can be more secure
    because it has a key size of 192 bits. If performance is not a primary consideration, consider using TripleDES It is recommended
    that AES or SHA1 methods be configured for use at the global level.'
  rationale: Setting the validation property to AES will provide confidentiality and integrity protection to the viewstate.
    AES is the strongest encryption algorithm supported by the validation property. Setting the validation property to SHA1
    will provide integrity protection to the viewstate. SHA1 is the strongest hashing algorithm supported by the validation
    property.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc772271%28WS.10%29.aspx
  - 2. http://technet.microsoft.com/en-us/library/cc772287%28WS.10%29.aspx
  page_start: 72
  audit_raw: 'To verify the Machine Key encryption method using IIS Manager:

    1. Open IIS Manager and navigate to the level that was configured, the WEBROOT,

    or server in this case

    2. In the features view, double click Machine Key

    3. On the Machine Key page, verify that SHA1 is selected in the Encryption method

    dropdown'
  remediation: 'Machine key encryption can be set by using the UI, running appcmd.exe commands, by

    editing configuration files directly, or by writing WMI scripts. To set the Machine Key

    encryption at the global level using an appcmd.exe command:

    %systemroot%\system32\inetsrv\appcmd set config /commit:WEBROOT

    /section:machineKey /validation:SHA1

    Note: When Appcmd.exe is used to configure the <machineKey> element at the global

    level in IIS 7.0, the /commit:WEBROOT switch must be included so that configuration

    changes are made to the root web.config file instead of ApplicationHost.config.'
  checks:
  - type: manual_review
    info: 'To verify the Machine Key encryption method using IIS Manager:

      1. Open IIS Manager and navigate to the level that was configured, the WEBROOT,

      or server in this case

      2. In the features view, double click Machine Key

      3. On the Machine Key page, verify that SHA1 is selected in the Encryption method

      dropdown'
    severity: medium
- id: 1.3.8
  title: Configure Global .NET Trust Level
  scoring: manual
  profile:
  - Level 1 - IIS 7.0
  description: 'This only applies to .Net 2.0. Future versions have stopped supporting this feature. An application''s trust
    level determines the permissions that are granted by the ASP.NET code access security (CAS) policy. CAS defines two trust
    categories: full trust and partial trust. An application that has full trust permissions may access all resource types
    on a server and perform privileged operations, while applications that run with partial trust have varying levels of operating
    permissions and access to resources. The possible values for the Level property of the TrustSection class are: • Full:
    Specifies unrestricted permissions and grants the ASP.NET application permissions to access any resource that is subject
    to operating system security; all privileged operations are supported • High: specifies a high level of code access security
    which limits the application from doing the following: o Call unmanaged code o Call serviced components o Write to the
    event log o Access Microsoft Windows Message Queuing queues o Access ODBC, OLD DB, or Oracle data sources • Medium: specifies
    a medium level of code access security, which means that in addition to the restrictions for High, the ASP.NET application
    cannot do any of the following things: o Access files outside the application directory o Access the registry • Low: specifies
    a low level of code access security, which means that in addition to the restrictions for Medium, the application is prevented
    from performing any of the following actions: o Write to the file system o Call the System.Security.CodeAccessPermission.Assert
    method to expand permissions to resources o Minimal: specifies a minimal level of code access security, which means that
    the application has only execute permission It is recommended that the global .NET Trust Level be set to Medium or lower.'
  rationale: The CAS determines the permissions that are granted to the application on the server. Setting a minimal level
    of trust that is compatible with the applications will limit the potential harm that a compromised application could cause
    to a system.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc772237(WS.10).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms691448%28VS.90%29.aspx
  page_start: 74
  audit_raw: 'To verify the global .NET Trust Level using IIS Manager:

    1. Open IIS Manager and navigate to the level that was configured, the server in

    this example

    2. In the features view, double click .NET Trust Levels

    3. On the .NET Trust Levels page, verify that Medium (web\_mediumtrust.config) is

    selected in the Trust Level dropdown'
  remediation: 'Trust level can be set by using the UI, running appcmd.exe commands, by editing

    configuration files directly, or by writing WMI scripts. To set the .Net Trust Level to

    Medium at the server level using an appcmd.exe command:

    %systemroot%\system32\inetsrv\appcmd set config /commit:WEBROOT

    /section:trust /level:Medium

    Note: When Appcmd.exe is used to configure the element at the global level in IIS 7.0,

    the /commit:WEBROOT switch must be included so that configuration changes are made

    to the root web.config file instead of ApplicationHost.config.

    The machine.config file can contain a location tag to override allowing this to be set at

    the web.config level. If this is done, web.config files that specify a trust level will cause

    the site to break.

    To implement this configuration, add the following to the machine.config file.'
  checks:
  - type: manual_review
    info: 'To verify the global .NET Trust Level using IIS Manager:

      1. Open IIS Manager and navigate to the level that was configured, the server in

      this example

      2. In the features view, double click .NET Trust Levels

      3. On the .NET Trust Levels page, verify that Medium (web\_mediumtrust.config) is

      selected in the Trust Level dropdown'
    severity: medium
- id: 1.3.9
  title: Hide IIS HTTP Detailed Errors from Displaying Remotely
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: A Web site's error pages are often set to show detailed error information for troubleshooting purposes during
    testing or initial deployment. To prevent unauthorized users from viewing this privileged information, detailed error
    pages must not be seen by remote users. This setting can be modified in the errorMode attribute setting for a Web site's
    error pages. By default, the errorMode attribute is set in the Web.config file for the Web site or application and is
    located in the <httpErrors> element of the <system.webServer> section. It is recommended that custom errors be prevented
    from displaying remotely.
  rationale: The information contained in custom error messages can provide clues as to how applications function, opening
    up unnecessary attack vectors. Ensuring custom errors are never displayed remotely can help mitigate the risk of malicious
    persons obtaining information as to how the application works.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/dd391900%28WS.10%29.aspx
  - 2. http://www.iis.net/configreference/system.webserver/httperrors
  page_start: 76
  audit_raw: "The errorMode attribute is set in the Web.config file for the Web site or application in\nthe <httpErrors> element\
    \ of the <system.webServer> section. Browse to the web.config\nand verify the errorMode is set to DetailedLocalOnly or\
    \ Custom:\n<system.web>\n  <system.webServer>\n    <httpErrors errorMode=\"DetailedLocalOnly\">\n    </httpErrors>\n \
    \ </system.webServer>\n</system.web>"
  remediation: 'The following describes how to change the errorMode attribute to DetailedLocalOnly

    or Custom for a Web site by using IIS Manager:

    1. Open IIS Manager with Administrative privileges

    2. In the Connections pane on the left, expand the server, then expand the Sites

    folder

    3. Select the Web site or application to be configured

