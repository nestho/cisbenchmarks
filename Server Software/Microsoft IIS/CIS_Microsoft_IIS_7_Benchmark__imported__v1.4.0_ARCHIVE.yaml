- id: 1.2.5
  title: Configure Cookie Protection Mode for Forms Authentication
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: 'The cookie protection mode defines the protection Forms Authentication cookies will be given within a configured
    application. The four cookie protection modes that can be defined are: • Encryption and validation - Specifies that the
    application use both data validation and encryption to help protect the cookie; this option uses the configured data validation
    algorithm (based on the machine key) and triple-DES (3DES) for encryption, if available and if the key is long enough
    (48 bytes or more) • None - Specifies that both encryption and validation are disabled for sites that are using cookies
    only for personalization and have weaker security requirements • Encryption - Specifies that the cookie is encrypted by
    using Triple-DES or DES, but data validation is not performed on the cookie; cookies used in this manner might be subject
    to plain text attacks • Validation - Specifies that a validation scheme verifies that the contents of an encrypted cookie
    have not been changed in transit It is recommended that cookie protection mode always encrypt and validate Forms Authentication
    cookies.'
  rationale: By encrypting and validating the cookie, the confidentiality and integrity of data within the cookie is assured.
    This helps mitigate the risk of attacks such as session hijacking and impersonation.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc731804%28WS.10%29.aspx
  page_start: 52
  audit_raw: "Locate and open the web.config for the configured application. Verify the presence of\n<forms protection=\"\
    All\" />.\n<system.web>\n  <authentication>\n    <forms cookieless=\"UseCookies\" protection=\"All\" />\n  </authentication>\n\
    </system.web>\nNote: The protection=\"All\" property will only show up if cookie protection mode was\nset to something\
    \ different, and then changed to Encryption and validation. To truly verify\nthe protection=\"All\" property in the web.config,\
    \ the protection mode can be changed,\nand then changed back. Conversely, the protection=\"All\" line can be added to\
    \ the\nweb.config manually."
  remediation: 'Cookie protection mode can be configured by using the user interface (UI), by running

    Appcmd.exe commands in a command-line window, by editing configuration files directly,

    or by writing WMI scripts. Using IIS Manager:

    1. Open IIS Manager and navigate to the level where Forms Authentication is

