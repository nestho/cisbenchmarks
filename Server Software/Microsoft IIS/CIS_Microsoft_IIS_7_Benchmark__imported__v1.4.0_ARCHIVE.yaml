- id: 1.4.5
  title: Ensure Double-Encoded Requests will be Rejected
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: This Request Filter feature prevents attacks that rely on double-encoded requests and applies if an attacker
    submits a double-encoded request to IIS. When the doubleencoded requests filter is enabled, IIS 7 will go through a two
    iteration process of normalizing the request. If the first normalization differs from the second, the request is rejected
    and the error code is logged as a 404.11. The double-encoded requests filter was the VerifyNormalization option in UrlScan.
    It is recommended that doubleencoded requests be rejected.
  rationale: This feature will help prevent attacks that rely on URLs that have been crafted to contain double-encoded request(s).
  impact: ''
