- id: 1.4.7
  title: Ensure Handler is not granted Write and Script/Execute
  scoring: scored
  profile:
  - Level 1 - IIS 7.0
  description: Handler mappings can be configured to give permissions to Read, Write, Script, or Execute depending on what
    the use is for - reading static content, uploading files, executing scripts, etc. It is recommended to grant a handler
    either Execute/Script or Write permissions, but not both.
  rationale: By allowing both Execute/Script and Write permissions, a handler can run malicious code on the target server.
    Ensuring these two permissions are never together will help lower the risk of malicious code being executed on the server.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/dd391910%28WS.10%29.aspx
  - 2. http://blogs.iis.net/thomad/archive/2006/11/05/quo-vadis-accessflags.aspx
  page_start: 91
  audit_raw: "Open the AdministrationHost.config file in %windir%\\\\system32\\\\inetsrv\\\\config.\nFind the <handlers> section\
    \ and verify that the accessPolicy attribute does not contain\nWrite when Script or Execute are present. The following\
    \ is an acceptable example:\n<system.webserver>\n  <handlers accessPolicy=\"Read, Script\">\n  </handlers>\n</system.webserver>"
  remediation: 'The accessPolicy attribute in the <handlers> section of either the

    ApplicationHost.config (server-wide) or web.config (site or application) must not have

    Write present when Script or Execute are present. To resolve this issue for a Web

    server, the attribute in the <handlers> section of the ApplicationHost.config file for the

    server must manually be edited. To edit the AdministrationHost.config file by using

    Notepad, perform the following steps:

    1. Open Notepad as Administrator

    2. Open the AdministrationHost.config file in

    %windir%\\system32\\inetsrv\\config

    3. Edit the <handlers> section accessPolicy attribute so that Write is not present

    when Script or Execute are present

    Note: This configuration change cannot be made by using IIS Manager.'
