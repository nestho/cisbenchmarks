- id: 1.6.1
  title: Encrypt FTP Requests
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The new FTP Publishing Service for IIS 7.0 supports adding an SSL certificate to an FTP site.  Using an SSL
    certificate with an FTP site is also known as FTP-S or FTP over Secure Socket Layers (SSL).  FTP-S is an RFC standard
    (RFC 4217) where an SSL certificate is added to an FTP site and thereby making it possible to perform secure file transfers.
  rationale: By using SSL, the FTP transmission is encrypted and secured from point to point and all FTP traffic as well as
    credentials are thereby guarded against interception.
  impact: ''
  references:
  - 1. http://www.windowsnetworking.com/articles_tutorials/IIS-FTP-PublishingService-Part3.html
  - 2. http://learn.iis.net/page.aspx/304/using-ftp-over-ssl/#03
  - 1.7 Transport Encryption
  page_start: 65
  audit_raw: 'The FTP site will now require the use of FTP-S; test this by attempting to use an FTP client

    which either does not support FTP-S or is not configured to use FTP-S.  If setup was

    successful, the request will fail.  Conversely, open a command prompt from the server and

    type ftp localhost.  After entering credentials, the server should return an Access is

    Denied message.'
  remediation: 'To secure an existing FTP site using a SSL Certificate, a certificate must first be installed on

    the system.  Production systems should always use a third party certificate from a trusted

    root, such as VeriSign.  Once that certificate is installed for use in IIS, follow the steps below

    to configure the FTP site for SSL:

    1. Open IIS Manager, select the FTP server and choose FTP SSL Settings in the Features

    View pane

    2. Under the SSL Certificate dropdown, choose the SSL certificate to be configured for

    use

    65 | P a g e

    3. In the SSL Policy section, click the radio button next to Require SSL connections; it is

    important to require SSL, because allow SSL still permits non-SSL FTP

    4. Click Apply in the Actions pane'
