- id: 1.3.1
  title: Set Deployment Method to Retail
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The <deployment retail> switch is intended for use by production IIS servers.  This switch is used to help
    applications run with the best possible performance and least possible security information leakages by disabling the
    application's ability to generate trace output on a page, disabling the ability to display detailed error messages to
    end users, and disabling the debug switch.  Often times, switches and options that are developerfocused, such as failed
    request tracing and debugging, are enabled during active development.  It is recommended that the deployment method on
    any production server be set to retail.
  rationale: Utilizing the switch specifically intended for production IIS servers will eliminate the risk of vital application
    and system information leakages that would otherwise occur if tracing or debug were to be left enabled, or customErrors
    were to be left off.
  impact: ''
  references:
  - 1. http://msdn.microsoft.com/en-US/library/ms228298%28VS.80%29.aspx
  page_start: 34
  audit_raw: "After the next time IIS is restarted, open the machine.config file and verify that\n<deployment retail=\"true\"\
    \ /> remains set to true.\n<system.web>\n  <deployment retail=\"true\" />\n</system.web>"
  remediation: '1. Open the machine.config file located

    in:  %windir%\Microsoft.NET\Framework\<framework_version>\CONFIG

    2. Add the line <deployment retail="true" /> within the <system.web> section

    3. If systems are 64-bit, do the same for the machine.config located in:

    %windir%\Microsoft.NET\Framework64\<framework_version>\CONFIG

    34 | P a g e'
  checks:
