- id: 1.3.8
  title: Configure Global .NET Trust Level
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This only applies to .Net 2.0. Future versions have stopped supporting this feature. An application''s trust
    level determines the permissions that are granted by the ASP.NET code access security (CAS) policy. CAS defines two trust
    categories: full trust and partial trust.  An application that has full trust permissions may access all resource types
    on a server and perform privileged operations, while applications that run with partial trust have varying levels of operating
    permissions and access to resources. The possible values for the Level property of the TrustSection class are:  Full:
    Specifies unrestricted permissions and grants the ASP.NET application permissions to access any resource that is subject
    to operating system security; all privileged operations are supported  High: specifies a high level of code access security
    which limits the application from doing the following: o Call unmanaged code o Call serviced components o Write to the
    event log o Access Microsoft Windows Message Queuing queues o Access ODBC, OLD DB, or Oracle data sources  Medium: specifies
    a medium level of code access security, which means that in addition to the restrictions for High, the ASP.NET application
    cannot do any of the following things: o Access files outside the application directory o Access the registry  Low: specifies
    a low level of code access security, which means that in addition to the restrictions for Medium, the application is prevented
    from performing any of the following actions: o Write to the file system o Call the System.Security.CodeAccessPermission.Assert
    method to expand permissions to resources 43 | P a g e o Minimal: specifies a minimal level of code access security, which
    means that the application has only execute permission It is recommended that the global .NET Trust Level be set to Medium
    or lower.'
  rationale: The CAS determines the permissions that are granted to the application on the server.  Setting a minimal level
    of trust that is compatible with the applications will limit the potential harm that a compromised application could cause
    to a system.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/cc772237(WS.10).aspx
  - 2. http://msdn.microsoft.com/en-us/library/ms691448%28VS.90%29.aspx
  page_start: 43
  audit_raw: 'To verify the global .NET Trust Level using IIS Manager:

    1. Open IIS Manager and navigate to the level that was configured, the server in this

    example

    2. In the features view, double click .NET Trust Levels

    3. On the .NET Trust Levels page, verify that Medium (web_mediumtrust.config) is

    selected in the Trust Level dropdown'
  remediation: 'Trust level can be set by using the UI, running appcmd.exe commands, by editing

    configuration files directly, or by writing WMI scripts.  To set the .Net Trust Level to

    Medium at the server level using an appcmd.exe command:

    %systemroot%\system32\inetsrv\appcmd set config /commit:WEBROOT /section:trust

    /level:Medium

    Note: When Appcmd.exe is used to configure the element at the global level in IIS 7.0, the

    /commit:WEBROOT switch must be included so that configuration changes are made to the

    root web.config file instead of ApplicationHost.config.'
  checks:
  - type: manual_review
    info: 'To verify the global .NET Trust Level using IIS Manager:

      1. Open IIS Manager and navigate to the level that was configured, the server in this

      example

      2. In the features view, double click .NET Trust Levels

      3. On the .NET Trust Levels page, verify that Medium (web_mediumtrust.config) is

      selected in the Trust Level dropdown'
    severity: medium
- id: 1.3.9
  title: Hide IIS HTTP Detailed Errors from Displaying Remotely
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: A Web site's error pages are often set to show detailed error information for troubleshooting purposes during
    testing or initial deployment.  To prevent unauthorized users from viewing this privileged information, detailed error
    pages must not be seen by remote users.  This setting can be modified in the errorMode attribute setting for a Web site's
    error pages.  By default, the errorMode attribute is set in the Web.config file for the Web site or application and is
    located in the <httpErrors> element of the <system.webServer> section.  It is recommended that custom errors be prevented
    from displaying remotely.
  rationale: The information contained in custom error messages can provide clues as to how applications function, opening
    up unnecessary attack vectors.  Ensuring custom errors are never displayed remotely can help mitigate the risk of malicious
    persons obtaining information as to how the application works.
  impact: ''
  references:
  - 1. http://technet.microsoft.com/en-us/library/dd391900%28WS.10%29.aspx
  - 2. http://www.iis.net/configreference/system.webserver/httperrors
