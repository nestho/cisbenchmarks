- id: 1.5.1
  title: Move Default IIS Web Log Location
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: IIS will log relatively detailed information on every request.  These logs are usually the first item looked
    at in a security response, and can be the most valuable.  Malicious users are aware of this, and will often try to remove
    evidence of their activities.  It is therefore recommended that the default location for IIS log files be changed to a
    restricted, nonsystem drive.
  rationale: Moving IIS logging to a restricted, non-system drive will help mitigate the risk of logs being maliciously altered,
    removed, or lost in the event of system drive failure(s).
  impact: ''
  references:
  - 1. http://www.iis.net/learn/extensions/advanced-logging-module/advanced-loggingfor-iis-custom-logging
  - 2. http://support.microsoft.com/kb/820729#1
  page_start: 61
  audit_raw: 'To verify web logs are being logged to the new location, open Windows Explorer and

    browse to the path that was defined.  Depending on how the logging was configured, there

    will be either:

    1. A folder containing .log files or

    2. .log files in the root of the specified directory'
  remediation: 'Moving the default log location can be easily accomplished using the Logging feature in the

    IIS Management UI or AppCmd.exe.  To change to D:\LogFiles using AppCmd.exe:

    %windir%\system32\inetsrv\appcmd set config -section:sites -

    siteDefaults.logfile.directory:"D:\LogFiles"

    Moving log file stores to a non-system drive or partition separate from where web

    applications run and/or content is served is preferred.  Additionally, folder-level NTFS

    61 | P a g e

    permissions should be set as restrictive as possible; Administrators and SYSTEM are

    typically the only principals requiring access.

    Note: While standard IIS logs can be moved and edited using IIS Manager, additional

    management tool add-ons are required in order to manage logs generated by other IIS

    features, such as Request Filtering and IIS Advanced Logging.  These add-ons can be

    obtained using the Web Platform Installer or from Microsoft''s site. The HTTPErr logging

    location can be changed by adding a registry key'
  checks:
  - type: manual_review
    info: 'To verify web logs are being logged to the new location, open Windows Explorer and

      browse to the path that was defined.  Depending on how the logging was configured, there

      will be either:

      1. A folder containing .log files or

      2. .log files in the root of the specified directory'
    severity: medium
