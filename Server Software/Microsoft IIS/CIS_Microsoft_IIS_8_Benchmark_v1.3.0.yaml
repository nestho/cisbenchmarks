- id: 1.2.7
  title: Lock down Encryption Providers
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: By default, whenever a property is encrypted, IIS 8.0 uses the defaultProvider for encryption defined in machine.config.  The
    IIS 8.0 local system process (WAS) runs under the context of LOCALSYSTEM and needs access to the application pool passwords.  However,
    by default the IIS_IUSRS security group is granted read access.  It is recommended that the IIS_IUSRS group have access
    to the iisWasKey revoked.
  rationale: The iisWasKey is intended for access only by Administrators and SYSTEM.  Since the IIS_IUSRS group is granted
    read access, an attacker compromising an application set to use a principal in the IIS_IUSRS group could potentially gain
    access to the encryption key(s).  Revoking this unnecessary privilege will reduce attack surface and help maintain confidentiality
    and system/application integrity.
  impact: ''
  references:
  - 1. http://learn.iis.net/page.aspx/141/using-encryption-to-protect-passwords/
  - 2. http://support.microsoft.com/kb/977754
  page_start: 30
  audit_raw: 'To verify the permissions have been removed:

    30 | P a g e

    1. Obtain the machine GUID at the Registry Value "MachineGuid" in the Registry Key:

    HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography

    2. Next, open a command prompt and run the following icacls command, ensuring

    that BUILTIN\IIS_IUSRS(R) has been removed:

    icacls

    %ALLUSERSPROFILE%\Microsoft\Crypto\RSA\MachineKeys\76944fb33636aeddb9590521c2e8815a_<M

    achineGUID>'
  remediation: 'Removing access to the iisWasKey can be done by using an aspnet_regiis.exe

    command.  The syntax is as follows, and is dependent on the version of .NET being used:

    %systemroot%\Microsoft.NET\Framework\\aspnet_regiis.exe -pr iisWasKey IIS_IUSRS

    To remove read access to the IIS_IUSRS security group on a system using .NET Framework

    v2.0:

    1. Open an elevated command prompt

    2. Run the following aspnet_regiis.exe command:

    %systemroot%\Microsoft.NET\Framework\v2.0.50727\aspnet_regiis.exe -pr iisWasKey

    IIS_IUSRS

    If running a 64-bit system, also run the following:

    %systemroot%\Microsoft.NET\Framework64\v2.0.50727\aspnet_regiis.exe -pr iisWasKey

    IIS_IUSRS

    Note: A unique version of aspnet_regiis.exe is included with each version of the .NET

    Framework.  Since each version of the tool applies only to its associated version of the .NET

    Framework, be sure to use the appropriate version of the tool.'
