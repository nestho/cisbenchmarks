- id: 1.4.10
  title: Disable HTTP Trace Method
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The HTTP TRACE method returns the contents of client HTTP requests in the entity-body of the TRACE response.  Attackers
    could leverage this behavior to access sensitive information, such as authentication data or cookies, contained in the
    HTTP headers of the request.  One such way to mitigate this is by using the <verbs> element of the <requestFiltering>
    collection, which was introduced in IIS 7.0.  The <verbs> element replaces the [AllowVerbs] and [DenyVerbs] features in
    IIS 6.0 UrlScan.  It is recommended the HTTP TRACE method be denied.
  rationale: Attackers may abuse HTTP TRACE functionality to gain access to information in HTTP headers such as cookies and
    authentication data.  This risk can be mitigated by not allowing the TRACE verb.
  impact: ''
  references:
  - 1. http://www.kb.cert.org/vuls/id/867593
  - 2. http://www.iis.net/ConfigReference/system.webServer/security/requestFiltering/
  - 1.5 IIS Logging Recommendations
  page_start: 59
  audit_raw: "IIS 8 will return an HTTP 404.6 error to the client when Request Filtering blocks an HTTP\nrequest because of\
    \ a denied HTTP verb.  To manually verify the change, browse to the\nweb.config file for which the change was made and\
    \ verify the below configuration:\n<configuration>\n  <system.webServer>\n<security>\n       <requestFiltering>\n    \
    \      <verbs>\n            <add verb=\"TRACE\" allowed=\"false\" />\n          </verbs>\n        </requestFiltering>\n\
    \     </security>\n  </system.webServer>\n</configuration>"
  remediation: '59 | P a g e

    1. Open Internet Information Services (IIS) Manager

    2. In the Connections pane, select the site, application, or directory to be configured

    3. In the Home pane, double-click Request Filtering

    4. In the Request Filtering pane, click the HTTP verbs tab, and then click Deny Verb... in

    the Actions pane

    5. In the Deny Verb dialog box, enter the TRACE, and then click OK'
  checks:
