  - Level 1
  description: IIS Advanced Logging is a module which provides flexibility in logging requests and client data.  It provides
    controls that allow businesses to specify what fields are important, easily add additional fields, and provide policies
    pertaining to log file rollover and Request Filtering.  HTTP request/response headers, server variables, and client-side
    fields can be easily logged with minor configuration in the IIS management console.  It is recommended that Advanced Logging
    be enabled, and the fields which could be of value to the type of business or application in the event of a security incident,
