    severity: medium
- id: 1.6.3
  title: Configure the Access Log
  scoring: scored
  profile:
  - Level 1
  description: The LogFormat directive defines the format and information to be included in the access log entries. The CustomLog
    directive specifies the log file, syslog facility or piped logging utility.
  rationale: The server access logs are also invaluable for a variety of reasons. They can be used to determine what resources
    are being used most. Most importantly, they can be used to investigate anomalous behavior that may be an indication that
    an attack is pending or has occurred. If the server only logs errors, and does not log successful access, then it is very
    difficult to investigate incidents. You may see that the errors stop, and wonder if the attacker gave up, or was the attack
    successful.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_log_config.html#customlog
  - 2. http://httpd.apache.org/docs/2.4/mod/mod_log_config.html#formats
  page_start: 92
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify the LogFormat directive in the Apache server configuration has the

    recommended information parameters.

    2. Verify the CustomLog directive is configured to an appropriate log file, syslog facility,

    or piped logging utility and uses the combined format.

    3. Verify there is a similar CustomLog directives for each virtual host configured if the

    virtual host will have different people responsible for the web site.'
  remediation: 'Perform the following to implement the recommended state:

    1. Add or modify the LogFormat directives in the Apache configuration to use the

    standard and recommended combined format show as shown below.

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\""

    combined

    2. Add or modify the CustomLogdirectives in the Apache configuration to use the

    combined format with an appropriate log file, syslog facility or piped logging utility.

    CustomLog log/access_log combined

    92 | P a g e

    3. Add a similar CustomLog directives for each virtual host configured if the virtual host

    will have different people responsible for the web site. Each responsible individual

    or organization needs access to their own web logs, and needs the

    skills/training/tools for monitor the logs.

    The format string tokens provide the following information:

    • %h = Remote hostname or IP address if HostnameLookups is set to Off, which is the

    default.

    • %l =Remote logname / identity.

    • %u =Remote user, if the request was authenticated.

    • %t = Time the request was received,

    • %r = First line of request.

    • %>s = Final status.

    • %b = Size of response in bytes.

    • %{Referer}i = Variable value for Referer header.

    • %{User-agent}i = Variable value for User Agent header.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify the LogFormat directive in the Apache server configuration has the

      recommended information parameters.

      2. Verify the CustomLog directive is configured to an appropriate log file, syslog facility,

      or piped logging utility and uses the combined format.

      3. Verify there is a similar CustomLog directives for each virtual host configured if the

