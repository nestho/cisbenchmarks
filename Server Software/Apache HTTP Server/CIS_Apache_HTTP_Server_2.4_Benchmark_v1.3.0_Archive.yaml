- id: 1.7.9
  title: Enable OCSP Stapling
  scoring: scored
  profile:
  - Level 2
  description: The OCSP (Online Certificate Status Protocol) provides the current revocation status of an X.509 certificate
    and allows for a certificate authority to revoke the validity of a signed certificate before it's expiration date. The
    URI for the OCSP server is included in the certificate and verified by the browser. The Apache SSLUseStapling directive
    along with the SSLStaplingCache directive are recommended to enable OCSP Stapling by the web server. If the client requests
    OCSP stapling, then the web server can include the OCSP server response along with the web server's X.509 certificate.
  rationale: The OCSP protocol is a big improvement over CRLs (certificate revocation lists) for checking if a certificate
    has been revoked. There are however some minor privacy and efficiency concerns with OCSP. The fact that the browser has
    to check a third party CA discloses that the browser is configured for OCSP checking. Also the already high overhead of
    making an SSL connection is increased by the need for the OCSP requests and responses. The OCSP stapling improves the
    situation by having the SSL server "staple" an OCSP response, signed by the OCSP server, to the certificate it presents
    to the client. This obviates the need for the client to ask the OCSP server for status information on the server certificate.
    However, the client will still need to make OCSP requests on any intermediate CA certificates that are typically used
    to sign the server's certificate.
  impact: ''
  references:
  - 1. http://en.wikipedia.org/wiki/OCSP_stapling - OCSP Stapling
  - 2. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html- Apache SSL Directives
  page_start: 120
