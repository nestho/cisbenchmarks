- id: 1.5.7
  title: Limit HTTP Request Methods
  scoring: scored
  profile:
  - Level 1
  description: Use the Apache <LimitExcept> directive to restrict unnecessary HTTP request methods of the web server to only
    accept and process the GET, HEAD, POST and OPTIONS HTTP request methods.
  rationale: The HTTP 1.1 protocol supports several request methods which are rarely used and potentially high risk. For example,
    methods such as PUT and DELETE are rarely used and should be disabled in keeping with the primary security principal of
    minimize features and options. Also since the usage of these methods is typically to modify resources on the web server,
    they should be explicitly disallowed. For normal web server operation, you will typically need to allow only the GET,
    HEAD and POST request methods. This will allow for downloading of web pages and submitting information to web forms. The
    OPTIONS request method will also be allowed as it used to request which HTTP request methods are allowed. Unfortunately
    the Apache <LimitExcept> directive does not deny the TRACE request method. The TRACE request method will be disallowed
    in another benchmark recommendation with the TraceEnable directive.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/core.html#limitexcept
  - 2. http://www.ietf.org/rfc/rfc2616.txt
