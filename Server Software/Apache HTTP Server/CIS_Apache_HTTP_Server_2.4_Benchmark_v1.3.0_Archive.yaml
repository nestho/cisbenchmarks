- id: 1.11.1
  title: Enable SELinux in Enforcing Mode
  scoring: scored
  profile:
  - Level 2
  description: SELinux (Security-Enhanced Linux) is a Linux kernel security module that provides mandatory access control
    security policies with type enforcement that are checked after the traditional discretionary access controls. It was created
    by the US National Security Agency and can enforce rules on files and processes in a Linux system, and restrict actions,
    based on defined policies.
  rationale: Web applications and services continue to be one of the leading attack vectors for black-hat criminals to gain
    access to information and servers. The threat is high because web servers are often externally accessible and typically
    have the greatest share of server-side vulnerabilities. The SELinux mandatory access controls provide a much stronger
    security model which can be used to implement a deny-by-default model which only allows what is explicitly permitted.
  impact: ''
  references:
  - 1. https://en.wikipedia.org/wiki/Security-Enhanced_Linux
  page_start: 146
  audit_raw: '146 | P a g e

    Perform the following steps to determine if the recommended state is implemented:

    Use the sestatus command to check that SELinux is enabled and that both the current

    mode and the configured mode are set to enforcing.

    $ sestatus | grep -i mode

    Current mode: enforcing

    Mode from config file: enforcing'
  remediation: 'Perform the following to implement the recommended state:

    If SELinux is not enabled in the configuration file, edit the file /etc/selinux/config and set

    the value of SELINUX as enforcing and reboot the system for the new configuration to be

    effective.

    SELINUX=enforcing

    If the current mode is not enforcing, and an immediate reboot is not possible, the current

    mode can be set to enforcing with the setenable command shown below.

    # setenforce 1'
  checks:
  - type: command
    command: $ sestatus | grep -i mode
    expected: ''
    severity: medium
    info: '146 | P a g e

      Perform the following steps to determine if the recommended state is implemented:

      Use the sestatus command to check that SELinux is enabled and that both the current

      mode and the configured mode are set to enforcing.

      $ sestatus | grep -i mode

      Current mode: enforcing

      Mode from config file: enforcing'
- id: 1.11.2
  title: Run Apache Processes in the httpd_t Confined Context
  scoring: scored
  profile:
  - Level 2
  description: 'SELinux includes customizable targeted policies that may be used to confine the Apache httpd server to enforce
    least privileges so that the httpd server has only the minimal access to specified directories, files and network ports.
    Access is controlled by process types (domains) defined for the httpd process. There are over a hundred individual httpd
    related types defined in a default Apache SELinux policy which includes many of the common Apache add-ons and applications
    such as php, nagios, smokeping and many others. The default SELinux policies work well for a default Apache installation,
    but implementation of SELinux targeted polices on a complex or highly customized web server requires a rather significant
    development and testing effort which comprehends both the workings of SELinux and the detailed operations and requirements
    of the web application. All directories and files to be accessed by the web server process must have security labels with
    appropriate types. The following types are a sample of the most commonly used: • http_port_t - Network ports allowed for
    listening • httpd_sys_content_t - Read access to directories and files with web content • httpd_log_t - Directories and
    files to be used for writable log data • httpd_sys_script_exec_t - Directories and files for executable content.'
  rationale: With the proper implementation of SELinux, vulnerabilities in the web application may be prevented from being
    exploited due to the additional restrictions. For example a vulnerability that allows an attacker to read to inappropriate
    system files may be prevented from execution by SELinux because the inappropriate files are not labeled as httpd_sys_content_t.
    Likewise writing to an unexpected directory or execution of unexpected content can be prevented by similar mandatory security
    labels enforced by SELinux.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security-Enhanced_Linux/chap-SecurityEnhanced_Linux-Targeted_Policy.html
  page_start: 148
  audit_raw: "148 | P a g e\nCheck that all of the Apache httpd processes are confined to the httpd_t SELinux context.\nThe\
    \ type (the third colon separated field) for each process should be httpd_t. Note that on\nsome platforms such as Ubuntu\
    \ the Apache executable is named apache2 instead of httpd.\n$ ps -eZ | grep httpd\nunconfined_u:system_r:httpd_t:s0 1366\
    \ ? 00:00:00 httpd\nunconfined_u:system_r:httpd_t:s0 1368 ? 00:00:00 httpd\n . . ."
  remediation: 'If the running httpd processes are not confined to the httpd_t SELinux context. Then check

    the context for the httpd binary and the apachectl binary, and set the httpd binary to have

    a context of httpd_exec_t and the apachectl executable should have a context of

    initrc_exec_t as shown below.  Also note that on some platforms such as Ubuntu, the

    Apache executable is named apache2 instead of httpd. Also note that on some platforms

    such as Ubuntu, the Apache executable is named apache2 instead of httpd.

    # ls -alZ /usr/sbin/httpd /usr/sbin/httpd.* /usr/sbin/apachectl

    -rwxr-xr-x. root root system_u:object_r:initrc_exec_t:s0 /usr/sbin/apachectl

    -rwxr-xr-x. root root system_u:object_r:httpd_exec_t:s0 /usr/sbin/httpd

    -rwxr-xr-x. root root system_u:object_r:httpd_exec_t:s0 /usr/sbin/httpd.worker

    -rwxr-xr-x. root root system_u:object_r:httpd_exec_t:s0 /usr/sbin/httpd.event

    If the executable files are not labeled correctly, they may be relabeled with the chcon

    command, as shown, however the file system labeling is based on the SELinux file context

    polices and the file systems will on some occasions be relabeled according to the policy.

    # chcon -t initrc_exec_t /usr/sbin/apachectl

    # chcon -t httpd_exec_t /usr/sbin/httpd /usr/sbin/httpd.*

    Since the file system may be relabeled based on SELinux policy, it''s best to check the

    SELinux policy with semanage fcontext "-l" option. If the policy is not present, then add

    the pattern to the policy using the "-a" option. The restorecon command shown below will

    restore the file context label according to the current policy, and is required if a pattern

    was added.

    # ### Check the Policy

    # semanage fcontext -l | fgrep ''apachectl''

    /usr/sbin/apachectl regular file system_u:object_r:initrc_exec_t:s0

    # semanage fcontext -l | fgrep ''/usr/sbin/httpd''

    /usr/sbin/httpd regular file system_u:object_r:httpd_exec_t:s0

    /usr/sbin/httpd.worker regular file system_u:object_r:httpd_exec_t:s0

    /usr/sbin/httpd.event regular file system_u:object_r:httpd_exec_t:s0

    # ### Add to the policy, if not present

    # semanage fcontext -f -- -a -t httpd_exec_t ''/usr/sbin/httpd''

    # semanage fcontext -f -- -a -t httpd_exec_t ''/usr/sbin/httpd.worker''

    # semanage fcontext -f -- -a -t httpd_exec_t ''/usr/sbin/httpd.event''

    # semanage fcontext -f -- -a -t initrc_exec_t /usr/sbin/apachectl

    149 | P a g e

    # ### Restore the file labeling accord to the SELinux policy

    # restorecon -v /usr/sbin/httpd /usr/sbin/httpd.* /usr/sbin/apachectl'
  checks:
  - type: command
    command: $ ps -eZ | grep httpd
    expected: ''
    severity: medium
    info: '148 | P a g e

      Check that all of the Apache httpd processes are confined to the httpd_t SELinux context.

      The type (the third colon separated field) for each process should be httpd_t. Note that on

      some platforms such as Ubuntu the Apache executable is named apache2 instead of httpd.

      $ ps -eZ | grep httpd

      unconfined_u:system_r:httpd_t:s0 1366 ? 00:00:00 httpd

      unconfined_u:system_r:httpd_t:s0 1368 ? '
- id: 1.11.3
  title: Ensure the httpd_t Type is Not in Permissive Mode
  scoring: scored
  profile:
  - Level 2
  description: In addition to setting the entire SELinux configuration in permissive mode, it is possible to set individual
    process types (domains) such as httpd_t into a permissive mode as well. The permissive mode will not prevent any access
    or actions, instead, any actions that would have been denied are simply logged. SELinux booleans allow or disallow behavior
    specific to the Apache web server. Common examples include whether CGI execution is allowed, or if the httpd server is
    allowed to communicate with the current terminal (tty). Communication with the terminal, may be necessary for entering
    a passphrase during start up to decrypt a private key.
  rationale: Usage of the permissive mode is helpful for testing and ensuring that SELinux will not prevent access that is
    necessary for the proper function of a web application. However all access is allowed in permissive mode by SELinux. Enabling
    only the necessary httpd related booleans provides a defense in depth approach, that will deny actions that are not in
    use or expected.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security-Enhanced_Linux/sect-SecurityEnhanced_Linux-Fixing_Problems-Permissive_Domains.html
  - 1.11.4 Ensure Only the Necessary SELinux Booleans are Enabled (Not
  - 1. https://access.redhat.com/documentation/enUS/Red_Hat_Enterprise_Linux/6/html/Security-Enhanced_Linux/sect-SecurityEnhanced_Linux-Working_with_SELinux-Booleans.html
  - 1.12 Enable AppArmor to Restrict Apache Processes
  page_start: 151
  audit_raw: 'Check that the httpd_t process type (domain) is not in permissive mode with the semodule

    command. There should be no output if the type is not set to permissive.

    # semodule -l | grep permissive_httpd_t

    Review the SELinux httpd booleans that are enabled to ensure only the necessary booleans

    are enabled for the current and the configured state. Due to the variety and complexity of

    web server usages and organizational needs, a preset recommendation of enabled booleans

    is not practical. Run either of the two commands below to show only the enabled httpd

    related booleans. The getsebool command is installed with the core SELinux, while the

    semanage command is an optional package, however the semanage output includes

    descriptive text.

    # getsebool -a | grep httpd_ | grep ''> on''

    httpd_builtin_scripting --> on

    httpd_dbus_avahi --> on

    httpd_tty_comm --> on

    httpd_unified --> on

    Alternative using the semanage command.

    # semanage boolean -l | grep httpd_ | grep -v ''(off , off)''

    httpd_enable_cgi (on , on) Allow httpd cgi support

    httpd_dbus_avahi (on , on) Allow Apache to communicate with avahi service via dbus

    httpd_unified (on , on) Unify HTTPD handling of all content files.

    httpd_builtin_scripting (on , on) Allow httpd to use built in scripting (usually php)

    httpd_tty_comm (on , on) Unify HTTPD to communicate with the terminal...'
  remediation: 'Perform the following to implement the recommended state:

    If the http_t type is in permissive mode, the customized permissive mode should be deleted

    with the following semanage command.

    # semanage permissive -d httpd_t

    152 | P a g e

    To disable the SELinux httpd booleans that are determined to be unnecessary, use the

    setsebool command as shown below with the "-P" option to make the change persistent.

    # setsebool -P httpd_enable_cgi off

    # getsebool httpd_enable_cgi

    httpd_enable_cgi --> off'
  checks:
