- id: 1.6.6
  title: Install and Enable ModSecurity
  scoring: scored
  profile:
  - Level 2
  description: 'ModSecurity is a open source web application firewall (WAF) for real-time web application monitoring, logging,
    and access control. It enables but does not include a powerful customizable rule set, which may be used to detect and
    block common web application attacks. Installation of ModSecurity without a rule set does not provide additional security
    for the protected web applications. Refer to the benchmark recommendation "Install and Enable OWASP ModSecurity Core Rule
    Set" for details on a recommended rule set. NOTE: Like other application security/application firewall systems, Mod_Security
    requires a significant commitment of staff resources for initial tuning of the rules and handling alerts. In some cases,
    this may require additional time working with application developers/maintainers to modify applications based on analysis
    of the results of tuning and monitoring logs. After setup, an ongoing commitment of staff is required for monitoring logs
    and ongoing tuning, especially after upgrades/patches. Without this commitment to tuning and monitoring, installing Mod_Security
    may NOT be effective and may provide a false sense of security.'
  rationale: Installation of the ModSecurity Apache module enables a customizable web application firewall rule set which
    may be configured to detect and block common attack patterns as well as block outbound data leakage.
  impact: ''
  references:
  - 1. https://www.modsecurity.org/
  page_start: 99
  audit_raw: 'Perform the following to determine if the security2_module has been loaded:

