    Last-Modified: Mon, 19 Jun 2006 14:47:16 GMT

    ETag: "152-41694d7a92500"

    Accept-Ranges: bytes

    Content-Length: 438

    Connection: close

    Content-Type: text/html'
  remediation: 'Perform the following to implement the recommended state:

    Add a Header directive as shown below in the Apache server level configuration and every

    virtual host that is SSL enabled.

    Header always set Strict-Transport-Security "max-age=600"'
  checks:
  - type: manual_review
    info: 'Perform either of the following steps to determine if the recommended state is

      implemented.

      At the Apache server level configuration and for every virtual host that is SSL enabled,

