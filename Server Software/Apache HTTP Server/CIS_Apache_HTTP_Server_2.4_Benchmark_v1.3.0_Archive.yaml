    for production use. The primary function for these sample programs is to demonstrate the capabilities of the web server.
    One common default CGI content for Apache installations is the script printenv. This script will print back to the requester
    all of the CGI environment variables which includes many server configuration details and system paths.
  rationale: CGI programs have a long history of security bugs and problems associated with improperly accepting user-input.
    Since these programs are often targets of attackers, we need to make sure that there are no unnecessary CGI programs that
    could potentially be used for malicious purposes. Usually these programs are not written for production use and consequently
