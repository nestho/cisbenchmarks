- id: 1.7.1
  title: Install mod_ssl and/or mod_nss
  scoring: scored
  profile:
  - Level 1
  description: Secure Sockets Layer (SSL) was developed by Netscape and turned into an open standard, and was renamed Transport
    Layer Security (TLS) as part of the process. TLS is important for protecting communication and can provide authentication
    of the server and even the client. However contrary to vendor claims, implementing SSL does NOT directly make your web
    server more secure! SSL is used to encrypt traffic and therefore does provide confidentiality of private information and
    users credentials. Keep in mind, however that just because you have encrypted the data in transit does not mean that the
    data provided by the client is secure while it is on the server. Also SSL does not protect the web server, as attackers
    will easily target SSL-Enabled web servers, and the attack will be hidden in the encrypted channel. The mod_ssl module
    is the standard, most used module that implements SSL/TLS for Apache. A newer module found on Red Hat systems can be a
    compliment or replacement for mod_ssl, and provides the same functionality plus additional security services. The mod_nss
    is an Apache module implementation of the Network Security Services (NSS) software from Mozilla, which implements a wide
    range of cryptographic functions in addition to TLS.
  rationale: 'It is best to plan for SSL/TLS implementation from the beginning of any new web server. As most web servers
    have some need for SSL/TLS due to: • Non-public information submitted that should be protected as it''s transmitted to
    the web server. • Non-public information that is downloaded from the web server. • Users are going to be authenticated
    to some portion of the web server • There is a need to authenticate the web server to ensure users that they have reached
    the real web server, and have not been phished or redirected to a bogus site.'
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html
  - 2. http://directory.fedoraproject.org/wiki/Mod_nss
  page_start: 104
  audit_raw: '104 | P a g e

    Perform the following steps to determine if the recommended state is implemented:

    1. Ensure the mod_ssl and/or mod_nssis loaded in the Apache configuration:

    # httpd -M | egrep ''ssl_module|nss_module''

    Results should show either or both of the modules.'
  remediation: 'Perform either of the following to implement the recommended state:

    1. For Apache installations built from the source, use the option --with-ssl= to

    specify the openssl path, and the --enable-ssl configure option to add the SSL

    modules to the build. The --with-included-apr configure option may be necessary

    if there are conflicts with the platform version. If a new version of Openssl is needed

    it may be downloaded from http://www.openssl.org/  See the Apache

    documentation on building from

    source http://httpd.apache.org/docs/2.4/install.htmlfor details.

    # ./configure --with-included-apr --with-ssl=$OPENSSL_DIR --enable-ssl

    2. For installations using OS packages, it is typically just a matter of ensuring the

    mod_ssl package is installed. The mod_nsspackage might also be installed. The

    following yum commands are suitable for Red Hat Linux.

    # yum install mod_ssl'
  checks:
  - type: sql
    command: show either or both of the modules.
    severity: medium
    info: '104 | P a g e

      Perform the following steps to determine if the recommended state is implemented:

      1. Ensure the mod_ssl and/or mod_nssis loaded in the Apache configuration:

      # httpd -M | egrep ''ssl_module|nss_module''

      Results should show either or both of the modules.'
- id: 1.7.2
  title: Install a Valid Trusted Certificate
  scoring: scored
  profile:
  - Level 1
  description: 'The default SSL certificate is self-signed and is not trusted. Install a valid certificate signed by a commonly
    trusted certificate authority. To be valid, the certificate must be: • Signed by a trusted certificate authority • Not
    be expired, and • Have a common name that matches the host name of the web server, such as www.example.com.'
  rationale: A digital certificate on your server automatically communicates your site's authenticity to visitors' web browsers.
    If a trusted authority signs your certificate, it confirms for the visitor they are actually communicating with you, and
    not with a fraudulent site stealing credit card numbers or personal information.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29
  - 2. http://httpd.apache.org/docs/2.4/ssl/ssl_faq.html#realcert
  page_start: 106
  audit_raw: 'Perform either or both of the following steps to determine if the recommended state is

    implemented:

    1. OpenSSL can also be used to validate a certificate as a valid trusted certificate, using

    a trusted bundle of CA certificate. It is important that the CA bundle of certificates be

    an already validated and trusted file in order for the test to be valid.

    $ openssl verify -CAfile /etc/pki/tls/certs/ca-bundle.crt -purpose sslserver

    /etc/pki/tls/certs/example.com.crt

    /etc/pki/tls/certs/example.com.crt: OK

    A specific error message and code will be reported in addition to the OK if the

    certificate is not valid, For example:

    error 10 at 0 depth lookup:certificate has expired

    OK

    2. Testing can also be done by connecting to a running web server. This may be done

    with your favorite browser, a command line web client or with openssl s_client.

    106 | P a g e

    Of course it is important here as well to be sure of the integrity of the trusted

    certificate authorities used by the web client. Visit the OWASP testing SSL web page

    for additional suggestions:

    https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29'
  remediation: 'Perform the following to implement the recommended state:

    1. Decide on the host name to be used for the certificate. It is important to remember

    that the browser will compare the host name in the URL to the common name in the

    certificate, so that it is important that all https: URL''s match the correct host name.

    Specifically the host name www.example.com is not the same as example.com nor the

    same as ssl.example.com.

    2. Generate a private key using openssl. Although certificate key lengths of 1024 have

    been common in the past, a key length of 2048 is now recommended for strong

    authentication. The key must be kept confidential and will be encrypted with a

    passphrase by default. Follow the steps below and respond to the prompts for a

    passphrase. See the Apache or OpenSSL documentation for details:

    http://httpd.apache.org/docs/2.4/ssl/ssl_faq.html#realcert

    http://www.openssl.org/docs/HOWTO/certificates.txt

    # cd /etc/pki/tls/certs

    # umask 077

    # openssl genrsa -aes128 2048 > example.com.key

    Generating RSA private key, 2048 bit long modulus

    ...+++

    e is 65537 (0x10001)

    Enter pass phrase:

    Verifying - Enter pass phrase:

    3. Generate the certificate signing request (CSR) to be signed by a certificate authority.

    It is important that common name exactly make the web host name.

    # openssl req -utf8 -new -key www.example.com.key -out www.example.com.csr

    Enter pass phrase for example.com.key:

    You are about to be asked to enter information that will be incorporated

    into your certificate request.

    What you are about to enter is what is called a Distinguished Name or a DN.

    There are quite a few fields but you can leave some blank

    For some fields there will be a default value,

    If you enter ''.'', the field will be left blank.

    -----

    Country Name (2 letter code) [GB]:US

    State or Province Name (full name) [Berkshire]:New York

    Locality Name (eg, city) [Newbury]:Lima

    Organization Name (eg, company) [My Company Ltd]:Durkee Consulting

    Organizational Unit Name (eg, section) []:

    Common Name (eg, your name or your server''s hostname) []:www.example.com

    Email Address []:ralph@example.com

    Please enter the following ''extra'' attributes

    to be sent with your certificate request

    107 | P a g e

    A challenge password []:

    An optional company name []:

    # mv www.example.com.key /etc/pki/tls/private/

    4. Send the certificate signing request (CSR) to a certificate signing authority to be

    signed, and follow their instructions for submission and validation. The CSR and the

    final signed certificate are just encoded text, and need to be protected for integrity,

    but not confidentiality. This certificate will be given out for every SSL connection

    made.

    5. The resulting signed certificate may be named www.example.com.crt and placed in

    /etc/pki/tls/certs/ as readable by all (mode 0444). Please note that the

    certificate authority does not need the private key (example.com.key) and this file

    must be carefully protected. With a decrypted copy of the private key, it would be

    possible to decrypt all conversations with the server.

    6. Do not forget the passphrase used to encrypt the private key. It will be required

    every time the server is started in https mode. If it is necessary to avoid requiring an

    administrator having to type the passphrase every time the httpdservice is started,

    the private key may be stored in clear text. Storing the private key in clear text

    increases the convenience while increasing the risk of disclosure of the key, but may

    be appropriate for the sake of being able to restart, if the risks are well managed. Be

    sure that the key file is only readable by root. To decrypt the private key and store it

    in clear text file the following openssl command may be used. You can tell by the

    private key headers whether it is encrypted or clear text.

    # cd /etc/pki/tls/private/

    # umask 077

    # openssl rsa -in www.example.com.key -out www.example.com.key.clear

    7. Locate the Apache configuration file for mod_ssl and add or modify the

    SSLCertificateFile and SSLCertificateKeyFiledirectives to have the correct

    path for the private key and signed certificate files. If a clear text key is referenced

    then a passphrase will not be required. You can use the CA''s certificate that signed

    your certificate instead of the CA bundle, to speed up the initial SSL connection as

    fewer certificates will need to be transmitted.

    SSLCertificateFile /etc/pki/tls/certs/example.com.crt

    SSLCertificateKeyFile /etc/pki/tls/private/example.com.key

    # Default CA file, can be replaced with your CA''s certificate.

    SSLCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

    8. Lastly, start or restart the httpd service and verify correct functioning with your

    favorite browser.'
  checks:
  - type: manual_review
    info: 'Perform either or both of the following steps to determine if the recommended state is

      implemented:

      1. OpenSSL can also be used to validate a certificate as a valid trusted certificate, using

      a trusted bundle of CA certificate. It is important that the CA bundle of certificates be

      an already validated and trusted file in order for the test to be valid.

      $ openssl verify -CAfile /etc/pki/tls/certs/ca-bundle.crt -purpose sslserver

      /etc/pki/tls/certs/example.com.crt

      /etc/pki/tls/certs/example.com.cr'
    severity: medium
- id: 1.7.3
  title: Protect the Server's Private Key
  scoring: scored
  profile:
  - Level 1
  description: 'It is critical to protect the server''s private key. The server''s private key is encrypted by default as
    a means of protecting it. However, having it encrypted means that the passphrase is required each time the server is started
    up, and now it is necessary to protect the passphrase as well. The passphrase may be typed in when it is manually started
    up, or provided by an automated program. To summarize, the options are: 1. Use SSLPassPhraseDialog builtin, - requires
    a passphrase to be manually entered. 2. Use SSLPassPhraseDialog |/path/to/program to provide the passphrase. 3. Use SSLPassPhraseDialog
    exec:/path/to/program to provide the passphrase, 4. Store the private key in clear text so that a passphrase is not required.
    Any of the above options 1-4 are acceptable as long as the key and passphrase are protected as described below. Option
    1 has the additional security benefit of not storing the passphrase, but is not generally acceptable for most production
    web servers, since it requires the web server to be manually started. Options 2 and 3 can provide additional security
    if the programs providing them are secure. Option 4 is the simplest, is widely used and is acceptable as long as the private
    key is appropriately protected.'
  rationale: If the private key were to be disclosed, it could be used to decrypt all of the SSL communications with the web
    server, and could also be used to impersonate the web server.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html
  - 2. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslpassphrasedialog
  page_start: 109
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. For each certificate file referenced in the Apache configuration files with the

    SSLCertificateFile directive, examine the file for a private key, clearly identified

    by the string "PRIVATE KEY—--"

    2. For each file referenced in the Apache configuration files with the

    SSLCertificateKeyFile directive, verify the ownership is root:root and the

    permission 0400.

    109 | P a g e'
  remediation: 'Perform the following to implement the recommended state:

    1. All private keys must be stored separately from the public certificates. Find all

    SSLCertificateFile directives in the Apache configuration files. For any

    SSLCertificateFile directives that do not have a corresponding separate

    SSLCertificateKeyFile directive, move the key to a separate file from the

    certificate, and add the SSLCertificateKeyFile directive for the key file.

    2. For each of the SSLCertificateKeyFile directives, change the ownership and

    permissions on the server private key to be owned by root:root with permission

    0400.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. For each certificate file referenced in the Apache configuration files with the

      SSLCertificateFile directive, examine the file for a private key, clearly identified

      by the string "PRIVATE KEY—--"

      2. For each file referenced in the Apache configuration files with the

      SSLCertificateKeyFile directive, verify the ownership is root:root and the

      permission 0400.

      109 | P a g e'
    severity: medium
- id: 1.7.4
  title: Disable the SSL v3.0 Protocol
  scoring: scored
  profile:
  - Level 1
  description: The Apache SSLProtocol directive specifies the SSL and TLS protocols allowed. The SSLv3 protocol should be
    disabled in this directive as it is out-dated and vulnerable to information disclosure. Only TLS protocols should be enabled.
  rationale: The SSLv3 protocol was discovered to be vulnerable to the POODLE attack (Padding Oracle On Downgraded Legacy
    Encryption) in October 2014. The attack allows decryption and extraction of information from the server's memory. Due
    to this vulnerability disabling the SSLv3 protocol is highly recommended.
  impact: ''
  references:
  - 1. https://www.us-cert.gov/ncas/alerts/TA14-290A
  - 2. https://www.openssl.org/~bodo/ssl-poodle.pdf
  page_start: 111
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    Search the Apache configuration files for the SSLProtocol directive.

    Verify that the directive exists and has either:

    • a minus "-SSLv3" value included

    • an explicit list of only TLS protocols without any plus (+) or minus (-) symbols'
  remediation: 'Perform the following to implement the recommended state:

    Search the Apache configuration files for the SSLProtocol directive; add the directive if not

    present, or change the value to match one of the following values. The first setting "TLSv1.1

    TLS1.2" is preferred when it it acceptable to also disable the TLSv1.0 protocol. See the level

    2 recommendation "Disable the TLS v1.0 Protocol" for details.

    SSLProtocol TLSv1.1 TLS1.2

    SSLProtocol TLSv1'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      Search the Apache configuration files for the SSLProtocol directive.

      Verify that the directive exists and has either:

      • a minus "-SSLv3" value included

      • an explicit list of only TLS protocols without any plus (+) or minus (-) symbols'
    severity: medium
- id: 1.7.5
  title: Restrict Weak SSL Ciphers
  scoring: scored
  profile:
  - Level 1
  description: Disable weak SSL ciphers using the SSLCipherSuite, and SSLHonorCipherOrder directives. The SSLCipherSuite directive
    specifies which ciphers are allowed in the negotiation with the client. While the SSLHonorCipherOrder causes the servers
    preferred ciphers to be used instead of the clients specified preferences.
  rationale: The SSL/TLS protocols support a large number of encryption ciphers including many weak ciphers that are subject
    to man-in-the middle attacks and information disclosure. Some implementations even support the NULL cipher which allows
    a TLS connection without any encryption! Therefore it is critical to ensure the configuration only allows strong ciphers
    greater than or equal to 128 bit to be negotiated with the client. Stronger 256-bit ciphers should be allowed and preferred.
    In addition enabling the SSLHonorCipherOrder further protects the client from man-in-the-middle downgrade attacks by ensuring
    the servers preferred ciphers will be used rather than the clients preferences.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslprotocol
  - 2. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslciphersuite
  page_start: 113
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Verify the SSLCipherSuite directive disables weak ciphers in the Apache server

    level configuration and every virtual host that is SSL enabled.

    2. Alternately the SSL protocols and ciphers supported can be easily tested by

    connecting to a running web server with openssl s_client such as shown

    in https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM001%29'
  remediation: 'Perform the following to implement the recommended state:

    Add or modify the following line in the Apache server level configuration and every virtual

    host that is SSL enabled:

    SSLHonorCipherOrder On

    SSLCipherSuite ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!MD5:!RC4

    113 | P a g e

    FIPS Compliance:The above cipher suite specification may be used for servers that fall

    under FIPS 140-2 compliance requirements, SP800-52 provides guidelines for the TLS

    ciphers, because it eliminates the usage of the RC4 cipher and MD5 hash which are not

    deemed FIPS compliant.

    Disable SSLv3 Ciphers: If the SSLv3 protocol has also been disabled, then the SSLv3

    related ciphers will not be used, and could be removed from the cipher suite specification.

    SSLCipherSuite ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Verify the SSLCipherSuite directive disables weak ciphers in the Apache server

      level configuration and every virtual host that is SSL enabled.

      2. Alternately the SSL protocols and ciphers supported can be easily tested by

      connecting to a running web server with openssl s_client such as shown

      in https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM001%29'
    severity: medium
- id: 1.7.6
  title: Disable SSL Insecure Renegotiation
  scoring: scored
  profile:
  - Level 1
  description: 'A man-in-the-middle renegotiation attack was discovered in SSLv3 and TLSv1 in November, 2009 (CVE-2009-3555).
    First, a work around and then a fix was approved as an Internet Standard as RFC 574, Feb 2010. The work around, which
    removes the renegotiation, is available from OpenSSL as of version 0.9.8l and newer versions. For details: http://www.openssl.org/news/secadv_20091111.txt
    The SSLInsecureRenegotiation directive was added in Apache 2.2.15, for web servers linked with OpenSSL version 0.9.8m
    or later, to provide backward compatibility to clients with the older, unpatched SSL implementations.'
  rationale: Enabling the SSLInsecureRenegotiation directive leaves the server vulnerable to man-inthe-middle renegotiation
    attack. Therefore, the SSLInsecureRenegotiation directive should not be enabled.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.2/mod/mod_ssl.html#sslinsecurerenegotiation
  - 2. http://cve.mitre.org/cgi-bin/cvename.cgi?name=CAN-2009-3555
  page_start: 115
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Search the Apache configuration files for the SSLInsecureRenegotiation directive

    and verify that the directive is either not present or has a value of off.'
  remediation: 'Perform the following to implement the recommended state:

    1. Search the Apache configuration files for the SSLInsecureRenegotiation directive. If

    the directive is present modify the value to be off. If the directive is not present then

    no action is required.

    SSLInsecureRenegotiation off'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Search the Apache configuration files for the SSLInsecureRenegotiation directive

      and verify that the directive is either not present or has a value of off.'
    severity: medium
- id: 1.7.7
  title: Ensure SSL Compression is not Enabled
  scoring: scored
  profile:
  - Level 1
  description: The SSLCompression directive controls whether SSL compression is used by Apache when serving content over HTTPS.
    It is recommended that the SSLCompression directive be set to off.
  rationale: If SSL compression is enabled, HTTPS communication between the client and the server may be at increased risk
    to the CRIME attack. The CRIME attack increases a malicious actor's ability to derive the value of a session cookie, which
    commonly contains an authenticator. If the authenticator in a session cookie is derived, it can be used to impersonate
    the account associated with the authenticator.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslcompression
  - 2. http://en.wikipedia.org/wiki/CRIME_(security_exploit)
  page_start: 117
  audit_raw: 'Perform the following steps to determine if the recommended state is implemented:

    1. Search the Apache configuration files for the SSLCompression directive.

    2. Verify that the directive either does not exist or exists and is set to off.'
  remediation: 'Perform the following to implement the recommended state:

    1. Search the Apache configuration files for the SSLCompression directive.

    2. If the directive is present, set it to off.'
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if the recommended state is implemented:

      1. Search the Apache configuration files for the SSLCompression directive.

      2. Verify that the directive either does not exist or exists and is set to off.'
    severity: medium
- id: 1.7.8
  title: Disable the TLS v1.0 Protocol
  scoring: scored
  profile:
  - Level 2
  description: The TLSv1.0 protocol should be disabled via the SSLProtocol directive, if possible, as it has been shown to
    be vulnerable to information disclosure.
  rationale: The TLSv1.0 protocol is vulnerable to the BEAST attack when used in CBC mode (October 2011). Unfortunately the
    TLSv1.0 uses CBC modes for all of the block mode ciphers, which only leaves the RC4 streaming cipher. The RC4 cipher is
    not vulnerable to the BEAST attack; however there is research that indicates it is also weak and is not recommended. Therefore
    it is recommended that the TLSv1.0 protocol be disabled if all TLS clients support the newer TLS protocols. All major
    up-to-date browsers support TLSv1.1 and TLSv1.2; however, some older IE browsers (8,9,10) may still have TLSv1.1 and TLSv1.2
    disabled for some strange reason. While Safari 6 does not support the newer TLS protocols. Review the Wikipedia reference
    for browser support details. Ensuring that all user's browsers are configured to allow TLSv1.1 and TLSv1.2 is necessary
    before disabling TLSv1.0 on the Apache web server; therefore this recommendation is a level 2 rather than a level 1. Disabling
    TLSv1.0 on internal only websites is more easily accomplished when access is limited to clients with browsers controlled
    by the organization policies and procedures to allow and prefer TLSv1.1 and higher. The NIST SP 800-52r1 guidelines for
    TLS configuration state that servers that support government-only applications shall not support TLSv1.0 or any of the
    SSL protocols. While Servers that support citizen or business-facing applications may be configured to support TLS version
    1.0 in order to enable interaction with citizens and businesses. Also it is important to note that Microsoft support for
    all older versions of IE ends January 12, 2016, and Apple ends support for Safari 6 with the fall release if OS X 10.11.
    So it is wise to plan for usage of TLSv1.0 to be eliminated in 2016. Some organizations may find it helpful to implement
    a phased transitional plan where TLSv1.0 is not disabled, but the web server will detect browsers which do not have TLSv1.1
    or newer enabled and redirect them to a web site that explains how to enabled the newer 118 | P a g e TLS protocols. The
    redirect can be implemented using the mod_rewrite which can detect the protocol used, and rewrite the URL to the helpful
    website.
  impact: ''
