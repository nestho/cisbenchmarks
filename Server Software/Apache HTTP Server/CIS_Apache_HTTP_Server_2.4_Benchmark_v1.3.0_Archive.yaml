- id: 1.1.1
  title: Pre-Installation Planning Checklist
  scoring: scored
  profile:
  - Level 1
  description: 'Review and implement the following items as appropriate: • Reviewed and implemented company''s security policies
    as they relate to web security. • Implemented a secure network infrastructure by controlling access to/from your web server
    by using firewalls, routers and switches. • Harden the underlying Operating System of the web server, by minimizing listening
    network services, applying proper patches and hardening the configurations as recommended in the appropriate Center for
    Internet Security benchmark for the platform. • Implement central log monitoring processes. • Implemented a disk space
    monitoring process and log rotation mechanism. • Educate developers, architects and testers about developing secure applications,
    and integrate security into the software development lifecycle.  https://www.owasp.org/   http://www.webappsec.org/ •
    Ensure the WHOIS Domain information registered for our web presence does not reveal sensitive personnel information, which
    may be leveraged for Social Engineering (Individual POC Names), War Dialing (Phone Numbers) and Brute Force Attacks (Email
    addresses matching actual system usernames). • Ensure your Domain Name Service (DNS) servers have been properly secured
    to prevent attacks, as recommended in the CIS BIND DNS Benchmark. • Implemented a Network Intrusion Detection System to
    monitor attacks against the web server.'
  rationale: N/A
  impact: ''
  references:
  - 1. Open Web Application Security Project - https://www.OWASP.org
  - 2. Web Application Security Consortium - http://www.webappsec.org/
  page_start: 13
  audit_raw: 'N/A

    13 | P a g e'
  remediation: N/A
  checks:
  - type: manual_review
    info: 'N/A

      13 | P a g e'
    severity: medium
- id: 1.1.2
  title: Do Not Install a Multi-use System
  scoring: scored
  profile:
  - Level 1
  description: Default server configurations often expose a wide variety of services unnecessarily increasing the risk to
    the system. Just because a server can perform many services doesn't mean it is wise to do so. The number of services and
    daemons executing on the Apache Web server should be limited to those necessary, with the Web server being the only primary
    function of the server.
  rationale: Maintaining a server for a single purpose increases the security of your application and system. The more services
    which are exposed to an attacker, the more potential vectors an attacker has to exploit the system and therefore the higher
    the risk for the server. A Web server should function as only a web server and if possible should not be mixed with other
    primary functions such as mail, DNS, database or middleware.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Leverage the package or services manager for your OS to list enabled services and review

    with documented business needs of the server. On Red Hat systems, the following will

    produce the list of current services enabled:

    chkconfig --list | grep '':on'''
  remediation: 'Leverage the package or services manager for your OS to uninstall or disable unneeded

    services. On Red Hat systems, the following will disable a given service:

    chkconfig <servicename> off

    15 | P a g e'
  checks:
  - type: command
    command: chkconfig --list | grep ':on'
    expected: ''
    severity: medium
    info: 'Leverage the package or services manager for your OS to list enabled services and review

      with documented business needs of the server. On Red Hat systems, the following will

      produce the list of current services enabled:

      chkconfig --list | grep '':on'''
- id: 1.1.3
  title: Installing Apache
  scoring: scored
  profile:
  - Level 1
  description: 'The CIS Apache Benchmark recommends using the Apache binary provided by your vendor for most situations in
    order to reduce the effort and increase the effectiveness of maintenance and security patches. However to keep the benchmark
    as generic and applicable to all Unix/Linux platforms as possible, a default source build has been used for this benchmark.
    Important Note: There is a major difference between source builds and most vendor packages that is very important to highlight.
    The default source build of Apache is fairly conservative and minimalist in the modules included and therefore starts
    off in a fairly strong security state, while most vendor binaries are typically very well loaded with most of the functionality
    that one may be looking for. Therefore it is important that you don''t assume the default value shown in the benchmark
    will match default values in your installation. You should always test any new installation in your environment before
    putting it into production. Also keep in mind you can install and run a new version alongside the old one by using a different
    Apache prefix and a different IP address or port number in the Listen directive.'
  rationale: 'The benefits of using the vendor supplied binaries include: • Ease of installation as it will just work, straight
    out of the box. • It is customized for your OS environment. • It will be tested and have gone through QA procedures. •
    Everything you need is likely to be included, probably including some third party modules. For example, many OS vendors
    ship Apache with mod_ssl and OpenSSL, PHP, mod_perl, and ModSecurity. • Your vendor will tell you about security issues
    so you have to look in fewer places. • Updates to fix security issues will be easy to apply. The vendor will have already
    verified the problem, checked the signature on the Apache download, worked out the impact and so on. • You may be able
    to get the updates automatically, reducing the window of risk.'
  impact: ''
  references:
  - 1. Apache Compiling and Installation http://httpd.apache.org/docs/2.4/install.html
  - 1.2 Minimize Apache Modules
  page_start: 16
  audit_raw: '16 | P a g e

    N/A'
  remediation: 'Installation depends on the operating system platform. For a source build, consult the

    Apache 2.4 documentation on compiling and installing

    http://httpd.apache.org/docs/2.4/install.html for a Red Hat Enterprise Linux 5 or 6, the

    following yum command could be used.

    # yum install httpd'
  checks:
  - type: manual_review
    info: '16 | P a g e

      N/A'
    severity: medium
- id: 1.2.1
  title: Enable only necessary Authentication and Authorization Modules
  scoring: scored
  profile:
  - Level 1
  description: The Apache 2.4 modules for authentication and authorization are grouped and named  to provide both granularity,
    and a consistent naming convention  to simplify configuration. The authn_* modules provide authentication, while the authz_*
    modules provide authorization. Apache provides two types of authentication - basic and digest. Review the Apache Authentication
    and Authorization how-to documentation http://httpd.apache.org/docs/2.4/howto/auth.html and enable only the modules that
    are required.
  rationale: Authentication and authorization are the front doors to the protected information in your web site. Most installations
    only need a small subset of the modules available. By minimizing the enabled modules to those that are actually used,
    we reduce the number of "doors" and have therefore reduce the attack surface of the web site. Likewise, having fewer modules
    means less software that could have vulnerabilities.
  impact: ''
  references:
  - 1. Apache AAA how-to http://httpd.apache.org/docs/2.4/howto/auth.html
  - 2. Apache Module Documentation http://httpd.apache.org/docs/2.4/mod/
  - http://httpd.apache.org/docs/2.4/programs/configure.html
  page_start: 18
  audit_raw: '1. Use the httpd -M option as root to check which auth*modules are loaded.

    # httpd -M | egrep ''auth._''

    2. Also use the httpd -M option as root to check for any LDAP modules which don''t

    follow the same naming convention.

    18 | P a g e

    # httpd -M | egrep ''ldap''

    The above commands should generate a list of modules installed to stdout.'
  remediation: 'Consult Apache module documentation for descriptions of each module in order to

    determine the necessary modules for the specific installation.

    http://httpd.apache.org/docs/2.4/mod/ The unnecessary static compiled modules are

    disabled through compile time configuration options as documented in

    http://httpd.apache.org/docs/2.4/programs/configure.html. The dynamically loaded

    modules are disabled by commenting out or removing the LoadModule directive from the

    Apache configuration files (typically httpd.conf). Some modules may be separate

    packages, and may be removed.'
  checks:
  - type: manual_review
    info: '1. Use the httpd -M option as root to check which auth*modules are loaded.

      # httpd -M | egrep ''auth._''

      2. Also use the httpd -M option as root to check for any LDAP modules which don''t

      follow the same naming convention.

      18 | P a g e

      # httpd -M | egrep ''ldap''

      The above commands should generate a list of modules installed to stdout.'
    severity: medium
- id: 1.2.2
  title: Enable the Log Config Module
  scoring: scored
  profile:
  - Level 1
  description: The log_config module provides for flexible logging of client requests, and provides for the configuration
    of the information in each log.
  rationale: Logging is critical for monitoring usage and potential abuse of your web server. This module is required to configure
    web server logging using the log_format directive.
  impact: ''
  references:
  - 1. Mod Log Config http://httpd.apache.org/docs/2.4/mod/mod_log_config.html
  page_start: 20
  audit_raw: 'Perform the following to determine if the log_config has been loaded:

    1. Use the httpd -M option as root to check that the module is loaded.

    # httpd -M | grep log_config

    Note: If the module is correctly enabled, the output will include the module name and

    whether it is loaded statically or as a shared module'
  remediation: 'Perform either one of the following:

    • For source builds with static modules, run the Apache ./configure script without

    including the --disable-log-config script options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure

    • For dynamically loaded modules, add or modify the LoadModule directive so that it is

    present in the apache configuration as below and not commented out :

    LoadModule log_config_module modules/mod_log_config.so'
  checks:
  - type: command
    command: '# httpd -M | grep log_config'
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the log_config has been loaded:

      1. Use the httpd -M option as root to check that the module is loaded.

      # httpd -M | grep log_config

      Note: If the module is correctly enabled, the output will include the module name and

      whether it is loaded statically or as a shared module'
- id: 1.2.3
  title: Disable WebDAV Modules
  scoring: scored
  profile:
  - Level 1
  description: The Apache mod_dav and mod_dav_fs modules support WebDAV ('Web-based Distributed Authoring and Versioning')
    functionality for Apache. WebDAV is an extension to the HTTP protocol which allows clients to create, move, and delete
    files and resources on the web server.
  rationale: Disabling WebDAV modules will improve the security posture of the web server by reducing the amount of potentially
    vulnerable code paths exposed to the network and reducing potential for unauthorized access to files via misconfigured
    WebDAV access controls.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_dav.html
  page_start: 22
  audit_raw: 'Perform the following to determine if the WebDAV modules are enabled.

    1. Run the httpd server with the -M option to list enabled modules:

    # httpd -M | grep '' dav_[[:print:]]+module''

    Note: If the WebDav modules are correctly disabled, there will be no output when

    executing the above command.'
  remediation: 'Perform either one of the following to disable WebDAV module:

    1. For source builds with static modules run the Apache ./configure script without

    including the mod_dav, and mod_dav_fs in the --enable-modules=configure script

    options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure

    2. For dynamically loaded modules comment out or remove the LoadModule directive

    for mod_dav, and mod_dav_fs modules the from the httpd.conf file.

    22 | P a g e

    ##LoadModule dav_module modules/mod_dav.so

    ##LoadModule dav_fs_module modules/mod_dav_fs.so'
  checks:
  - type: command
    command: '# httpd -M | grep '' dav_[[:print:]]+module'''
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the WebDAV modules are enabled.

      1. Run the httpd server with the -M option to list enabled modules:

      # httpd -M | grep '' dav_[[:print:]]+module''

      Note: If the WebDav modules are correctly disabled, there will be no output when

      executing the above command.'
- id: 1.2.4
  title: Disable Status Module
  scoring: scored
  profile:
  - Level 1
  description: The Apache mod_status module provides current server performance statistics.
  rationale: When mod_status is loaded into the server, its handler capability is available in all configuration files, including
    per-directory files (e.g., .htaccess).  The mod_status module may provide an adversary with information that can be used
    to refine exploits that depend on measuring server load.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_status.html
  page_start: 24
  audit_raw: 'Perform the following to determine if the Status module is enabled.

    1. Run the httpd server with the -M option to list enabled modules:

    # httpd -M | egrep ''status_module''

    Note: If the modules are correctly disabled, there will be no output when executing the

    above command.'
  remediation: 'Perform either one of the following to disable the mod_status module:

    1. For source builds with static modules, run the Apache ./configure script with the --

    disable-status configure script options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure --disable-status

    2. For dynamically loaded modules, comment out or remove the LoadModule directive

    for the mod_status module from the httpd.conf file.

    ##LoadModule status_module modules/mod_status.so'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the Status module is enabled.

      1. Run the httpd server with the -M option to list enabled modules:

      # httpd -M | egrep ''status_module''

      Note: If the modules are correctly disabled, there will be no output when executing the

      above command.'
    severity: medium
- id: 1.2.5
  title: Disable Autoindex Module
  scoring: scored
  profile:
  - Level 1
  description: The Apache autoindex module automatically generates web page listing the contents of directories on the server,
    typically used so that an index.html does not have to be generated.
  rationale: Automated directory listings should not be enabled as it will also reveal information helpful to an attacker
    such as naming conventions and directory paths. Directory listings may also reveal files that were not intended to be
    revealed.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_autoindex.html
  page_start: 26
  audit_raw: 'Perform the following to determine if the module is enabled.

    1. Run the httpd server with the -M option to list enabled modules:

    # httpd -M | grep autoindex_module

    Note: If the module is correctly disabled, there will be no output when executing the above

    command.'
  remediation: 'Perform either one of the following to disable the mod_autoindex module:

    1. For source builds with static modules, run the Apache ./configure script with the -

    -disable-autoindex configure script options

    $ cd $DOWNLOAD_HTTPD

    $ ./configure -disable-autoindex

    2. For dynamically loaded modules, comment out or remove the LoadModule directive

    for mod_autoindex from the httpd.conf file.

    ## LoadModule autoindex_module modules/mod_autoindex.so'
  checks:
  - type: command
    command: '# httpd -M | grep autoindex_module'
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the module is enabled.

      1. Run the httpd server with the -M option to list enabled modules:

      # httpd -M | grep autoindex_module

      Note: If the module is correctly disabled, there will be no output when executing the above

      command.'
- id: 1.2.6
  title: Disable Proxy Modules
  scoring: scored
  profile:
  - Level 1
  description: The Apache proxy modules allow the server to act as a proxy (either forward or reverse proxy) of HTTP and other
    protocols with additional proxy modules loaded. If the Apache installation is not intended to proxy requests to or from
    another network then the proxy module should not be loaded.
  rationale: Proxy servers can act as an important security control when properly configured, however a secure proxy server
    is not within the scope of this benchmark. A web server should be primarily a web server or a proxy server but not both,
    for the same reasons that other multi-use servers are not recommended. Scanning for web servers that will also proxy requests
    is a very common attack, as proxy servers are useful for anonymizing attacks on other servers, or possibly proxying requests
    into an otherwise protected network.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_proxy.html
  page_start: 28
  audit_raw: 'Perform the following to determine if the modules are enabled.

    1. Run the httpd server with the -Moption to list enabled modules:

    # httpd -M | grep proxy_

    Note: If the modules are correctly disabled, there will be no output when executing the

    above command.'
  remediation: 'Perform either one of the following to disable the proxy module:

    1. For source builds with static modules, run the Apache ./configure script without

    including the mod_proxy in the --enable-modules=configurescript options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure

    2. For dynamically loaded modules, comment out or remove the LoadModule directive

    for mod_proxy module and all other proxy modules from the httpd.conffile.

    28 | P a g e

    ##LoadModule proxy_module modules/mod_proxy.so

    ##LoadModule proxy_connect_module modules/mod_proxy_connect.so

    ##LoadModule proxy_ftp_module modules/mod_proxy_ftp.so

    ##LoadModule proxy_http_module modules/mod_proxy_http.so

    ##LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

    ##LoadModule proxy_scgi_module modules/mod_proxy_scgi.so

    ##LoadModule proxy_ajp_module modules/mod_proxy_ajp.so

    ##LoadModule proxy_balancer_module modules/mod_proxy_balancer.so

    ##LoadModule proxy_express_module modules/mod_proxy_express.so

    ##LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

    ##LoadModule proxy_fdpass_module modules/mod_proxy_fdpass.so'
  checks:
  - type: command
    command: '# httpd -M | grep proxy_'
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the modules are enabled.

      1. Run the httpd server with the -Moption to list enabled modules:

      # httpd -M | grep proxy_

      Note: If the modules are correctly disabled, there will be no output when executing the

      above command.'
- id: 1.2.7
  title: Disable User Directories Modules
  scoring: scored
  profile:
  - Level 1
  description: 'The UserDir directive must be disabled so that user home directories are not accessed via the web site with
    a tilde (~) preceding the username. The directive also sets the path name of the directory that will be accessed. For
    example: • http://example.com/~ralph/ might access a public_html sub-directory of ralph user''s home directory. • The
    directive UserDir ./ might map /~root to the root directory (/).'
  rationale: The user directories should not be globally enabled since it allows anonymous access to anything users may want
    to share with other users on the network. Also consider that every time a new account is created on the system, there
    is potentially new content available via the web site.
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_userdir.html
  page_start: 30
  audit_raw: 'Perform the following to determine if the modules are enabled.

    1. Run the httpd server with the -M option to list enabled modules:

    # httpd -M | grep userdir_

    Note: If the modules are correctly disabled, there will be no output when executing the

    above command.'
  remediation: 'Perform either one of the following to disable the user directories module:

    1. For source builds with static modules, run the Apache ./configure script with the -

    -disable-userdir configure script options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure --disable-userdir

    2. For dynamically loaded modules, comment out or remove the LoadModule directive

    for mod_userdir module from the httpd.conf file.

    30 | P a g e

    ##LoadModule userdir_module modules/mod_userdir.so'
  checks:
  - type: command
    command: '# httpd -M | grep userdir_'
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the modules are enabled.

      1. Run the httpd server with the -M option to list enabled modules:

      # httpd -M | grep userdir_

      Note: If the modules are correctly disabled, there will be no output when executing the

      above command.'
- id: 1.2.8
  title: Disable Info Module
  scoring: scored
  profile:
  - Level 1
  description: The Apache mod_info module provides information on the server configuration via access to a /server-info URL
    location.
  rationale: 'While having server configuration information available as a web page may be convenient it''s recommended that
    this module NOT be enabled: • Once mod_info is loaded into the server, its handler capability is available in perdirectory
    .htaccess files and can leak sensitive information from the configuration directives of other Apache modules such as system
    paths, usernames/passwords, database names, etc.'
  impact: ''
  references:
  - 1. http://httpd.apache.org/docs/2.4/mod/mod_info.html
  - 1.3 Principles, Permissions, and Ownership
  page_start: 32
  audit_raw: 'Perform the following to determine if the Info module is enabled.

    1. Run the httpd server with the -M option to list enabled modules:

    # httpd -M | egrep ''info_module''

    Note: If the module is correctly disabled, there will be no output when executing the above

    command.'
  remediation: 'Perform either one of the following to disable the mod_info module:

    1. For source builds with static modules, run the Apache ./configure script without

    including the mod_info in the --enable-modules= configure script options.

    $ cd $DOWNLOAD_HTTPD

    $ ./configure

    2. For dynamically loaded modules, comment out or remove the LoadModule directive

    for the mod_info module from the httpd.conf file.

    ##LoadModule info_module modules/mod_info.so

    32 | P a g e'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the Info module is enabled.

      1. Run the httpd server with the -M option to list enabled modules:

      # httpd -M | egrep ''info_module''

      Note: If the module is correctly disabled, there will be no output when executing the above

      command.'
    severity: medium
- id: 1.3.1
  title: Run the Apache Web Server as a non-root user
  scoring: scored
  profile:
  - Level 1
  description: Although Apache is typically started with root privileges in order to listen on port 80 and 443, it can and
    should run as another non-root user in order to perform the web services. The Apache User and Group directives are used
    to designate the user and group that the Apache worker processes will assume.
  rationale: One of the best ways to reduce your exposure to attack when running a web server is to create a unique, unprivileged
    user and group for the server application. The "nobody" or "daemon" user and group that comes default on Unix variants
    should NOT be used to run the web server, since the account is commonly used for other separate daemon services. Instead,
    an account used only by the apache software so as to not give unnecessary access to other services. Also the identifier
    used for the apache user should be a unique system account.   System user accounts UID numbers have lower values which
    are reserved for the special system accounts not used by regular users, such as discussed in User Accounts section of
    the CIS Red Hat benchmark.  Typically system accounts numbers ranges from 1999, or 1-499 and are defined in the /etc/login.defs
    file. As an even more secure alternative, if the Apache web server can be run on high unprivileged ports, then it is not
    necessary to start Apache as root, and all of the Apache processes may be run as the Apache specific user as described
    below.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Ensure the apache account is unique and has been created with a UID less than the

    minimum normal user account with the apache group and configured in the httpd.conf

    file.

    34 | P a g e

    1. Ensure the User and Group directives are present in the Apache configuration and

    not commented out:

    # grep -i ''^User'' $APACHE_PREFIX/conf/httpd.conf

    User apache

    # grep -i ''^Group'' $APACHE_PREFIX/conf/httpd.conf

    Group apache

    1. Ensure the apache account UID is correct:

    # grep ''^UID_MIN'' /etc/login.defs

    # id apache

    The uid must be less than the UID_MIN value in /etc/login.defs, and group of apache

    similar to the following entries:

    UID_MIN             1000

    uid=48(apache) gid=48(apache) groups=48(apache)

    1. While the web server is running, check the user id for the httpd processes. The user

    name should match the configuration file.

    # ps axu | grep httpd | grep -v ''^root'''
  remediation: 'Perform the following:

    1. If the apacheuser and group do not already exist, create the account and group as a

    unique system account:

    # groupadd -r apache

    # useradd apache -r -g apache -d /var/www -s /sbin/nologin

    2. Configure the Apache user and group in the Apache configuration file httpd.conf:

    User apache

    Group apache'
  checks:
  - type: command
    command: '# ps axu | grep httpd | grep -v ''^root'''
    expected: ''
    severity: medium
    info: 'Ensure the apache account is unique and has been created with a UID less than the

      minimum normal user account with the apache group and configured in the httpd.conf

      file.

      34 | P a g e

      1. Ensure the User and Group directives are present in the Apache configuration and

      not commented out:

      # grep -i ''^User'' $APACHE_PREFIX/conf/httpd.conf

      User apache

      # grep -i ''^Group'' $APACHE_PREFIX/conf/httpd.conf

      Gr'
- id: 1.3.2
  title: Give the Apache User Account an Invalid Shell
  scoring: scored
  profile:
  - Level 1
  description: The apache account must not be used as a regular login account, and should be assigned an invalid or nologin
    shell to ensure that the account cannot be used to login.
  rationale: Service accounts such as the apache account represent a risk if they can be used to get a login shell to the
    system.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Check the apache login shell in the /etc/passwd file:

    # grep apache /etc/passwd

    The apache account shell must be /sbin/nologin or /dev/null similar to the following:

    /etc/passwd:apache:x:48:48:Apache:/var/www:/sbin/nologin'
  remediation: 'Change the apache account to use the nologin shell or an invalid shell such as /dev/null:

    # chsh -s /sbin/nologin apache'
  checks:
  - type: manual_review
    info: 'Check the apache login shell in the /etc/passwd file:

      # grep apache /etc/passwd

      The apache account shell must be /sbin/nologin or /dev/null similar to the following:

      /etc/passwd:apache:x:48:48:Apache:/var/www:/sbin/nologin'
    severity: medium
- id: 1.3.3
  title: Lock the Apache User Account
  scoring: scored
  profile:
  - Level 1
  description: The user account under which Apache runs should not have a valid password, but should be locked.
  rationale: As a defense-in-depth measure the Apache user account should be locked to prevent logins, and to prevent a user
    from su-ing to apache using the password. In general there shouldn't be a need for anyone to have to su as apache, and
