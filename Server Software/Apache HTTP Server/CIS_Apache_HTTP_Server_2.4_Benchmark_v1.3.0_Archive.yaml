- id: 1.9.6
  title: Set Timeout Limits for the Request Body
  scoring: scored
  profile:
  - Level 1
  description: The RequestReadTimeout directive also allows setting timeout values for the body portion of a request.   The
    directive provides for an initial timeout value, and a maximum timeout and minimum rate. The minimum rate specifies that
    after the initial timeout, the server will wait an additional 1 second for each N bytes are received. The recommended
    setting is to have a maximum timeout of 20 seconds or less. The default value is body=20,MinRate=500.
  rationale: It is not sufficient to timeout only on the header portion of the request, as the server will still be vulnerable
    to attacks like the OWASP Slow POST attack, which provide the body of the request very slowly.  Therefore the body portion
    of the request must have a timeout as well. A timeout of 20 seconds or less is recommended.
