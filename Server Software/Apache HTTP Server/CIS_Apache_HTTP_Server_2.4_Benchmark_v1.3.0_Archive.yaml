  title: Set MaxKeepAliveRequests to 100 or greater
  scoring: scored
  profile:
  - Level 1
  description: The MaxKeepAliveRequests directive limits the number of requests allowed per connection when KeepAlive is on.
    If it is set to 0, unlimited requests will be allowed.
  rationale: The MaxKeepAliveRequests directive is  important to be used to mitigate the risk of Denial of Service (DoS) attack
    technique by reducing the overhead imposed on the server.  The KeepALive directive must be enabled before it is effective.  Enabling
    KeepAlives allows for multiple HTTP requests to be sent while keeping the same TCP connection alive. This reduces the
    overhead of having to setup and tear down TCP connections for each request. By making the server more efficient, it will
    be more resilient to DoS conditions.
