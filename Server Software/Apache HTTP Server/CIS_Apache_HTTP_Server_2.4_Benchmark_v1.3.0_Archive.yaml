- id: 1.9.5
  title: Set Timeout Limits for Request Headers
  scoring: scored
  profile:
  - Level 1
  description: The RequestReadTimeout directive allows configuration of timeout limits for client requests.  The header portion
    of the directive provides for an initial timeout value, a maximum timeout and a minimum rate.  The minimum rate specifies
    that after the initial timeout, the server will wait an additional 1 second for each N bytes received.  The recommended
    setting is to have a maximum timeout of 40 seconds or less. Keep in mind that for SSL/TLS virtual hosts the time for the
    TLS handshake must fit within the timeout.
  rationale: Setting a request header timeout is vital for mitigating Denial of Service attacks based on slow requests. The
    slow request attacks are particularly lethal and relative easy to perform, because they require very little bandwidth
    and can easily be done through anonymous proxies.    Starting in June 2009 with the Slow Loris DoS attack, which used
    a slow GET request, was published by Robert Hansen (RSnake) on his blog http://ha.ckers.org/slowloris/.  Later in November
    2010 at the OWASP App Sec DC conference Wong Onn Chee demonstrated a slow POST request attack which was even more effective.
    See http://code.google.com/p/owasp-dos-http-post/ for details.
  impact: ''
  references:
  - 1. http://ha.ckers.org/slowloris/
  - 2. http://code.google.com/p/owasp-dos-http-post/
  page_start: 135
  audit_raw: 'Perform the following to determine if the recommended state is implemented:

