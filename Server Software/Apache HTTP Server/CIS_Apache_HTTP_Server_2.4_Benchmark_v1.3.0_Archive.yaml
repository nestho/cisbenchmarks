  title: Set the KeepAlive directive to On
  scoring: scored
  profile:
  - Level 1
  description: The KeepAlive directive controls whether Apache will reuse the same TCP connection per client to process subsequent
    HTTP requests from that client.  It is recommended that the KeepAlive directive be set to On.
  rationale: Allowing per-client reuse of TCP sockets reduces the amount of system and network resources required to serve
    requests. This efficiency gain may improve a server's resiliency to DoS attacks.
  impact: ''
  references:
