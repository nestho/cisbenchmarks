- id: 1.6.7
  title: Install and Enable OWASP ModSecurity Core Rule Set
  scoring: scored
  profile:
  - Level 2
  description: 'The OWASP ModSecurity Core Rules Set (CRS) is a set of open source web application defensive rules for the
    ModSecurity web application firewall (WAF). The OWASP ModSecurity CRS provides baseline protections in the following attack/threat
    categories: • HTTP Protection - detecting violations of the HTTP protocol and a locally defined usage policy. • Real-time
    Blacklist Lookups - utilizes 3rd Party IP Reputation • HTTP Denial of Service Protections - defense against HTTP Flooding
    and Slow HTTP DoS Attacks. • Common Web Attacks Protection - detecting common web application security attack. • Automation
    Detection - Detecting bots, crawlers, scanners and other surface malicious activity. • Integration with AV Scanning for
    File Uploads - detects malicious files uploaded through the web application. • Tracking Sensitive Data - Tracks Credit
    Card usage and blocks leakages. • Trojan Protection - Detecting access to Trojans horses. • Identification of Application
    Defects - alerts on application misconfigurations. • Error Detection and Hiding - Disguising error messages sent by the
    server. NOTE: Like other application security/application firewall systems, Mod_Security requires a significant commitment
    of staff resources for initial tuning of the rules and handling alerts. In some cases, this may require additional time
    working with application developers/maintainers to modify applications based on analysis of the results of tuning and
    monitoring logs. After setup, an ongoing commitment of staff is required for monitoring logs and ongoing tuning, especially
    after upgrades/patches. Without this commitment to tuning and monitoring, installing Mod_Security may NOT be effective
    and may provide a false sense of security.'
  rationale: Installing, configuring and enabling of the OWASP ModSecurity Core Rule Set (CRS), provides additional baseline
    security defense, and provides a good starting point to customize the monitoring and blocking of common web application
