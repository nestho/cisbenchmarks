    value of 10 seconds or shorter.'
  remediation: 'Perform the following to implement the recommended state:

    130 | P a g e

    Add or modify the Timeout directive in the Apache configuration to have a value of 10

    seconds or shorter.

    Timeout 10'
  checks:
