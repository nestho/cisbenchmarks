  title: Secure the Lock File
  scoring: scored
  profile:
  - Level 1
  description: The Mutex directive sets the locking mechanism used to serialize access to resources. It may be used to specify
    that a lock file is to be used as a mutex mechanism and may provide the path to the lock file to be used with the  fcntl(2)
    or flock(2) system calls.  Most Linux systems will default to using semaphores instead, so the directive may not apply.
    However in the event a lock file is used, it is important for the lock file to be in a local directory that is not writable
    by other users.
  rationale: If the lock file to be used as a mutex is placed in a writable directory, other accounts could create a denial
    of service attack and prevent the server from starting by creating a lock file with the same name.
  impact: ''
  references:
