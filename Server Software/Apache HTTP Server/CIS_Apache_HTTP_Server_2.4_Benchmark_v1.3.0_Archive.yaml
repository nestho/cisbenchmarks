      with a max-age value of at least 480 seconds or more (8 minutes or more). For example:

      Header always set Strict-Transport-Security "max-age=600"

      As an alternative the configuration may be validated by connecting to the HTTPS serv'
    severity: medium
- id: 1.8.1
  title: Set ServerToken to 'Prod'
  scoring: scored
  profile:
  - Level 1
  description: Configure the Apache ServerTokens directive to provide minimal information. By setting the value to Prod or
    ProductOnly. The only version information given in the server HTTP response header will be "Apache" rather than providing
    detailed on modules and versions installed.
  rationale: Information is power, and identifying web server details greatly increases the efficiency of any attack, as security
    vulnerabilities are extremely dependent upon specific software versions and configurations. Excessive probing and requests
    may cause too much "noise" being generated and may tip off an administrator. If an attacker can accurately target their
    exploits, the chances of successful compromise prior to detection increase dramatically. Script Kiddies are constantly
    scanning the Internet and documenting the version information openly provided by web servers. The purpose of this scanning
    is to accumulate a database of software installed on those hosts, which can then be used when new vulnerabilities are
    released.
  impact: ''
  references:
