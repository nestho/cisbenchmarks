  description: The sched_enable parameter specifies whether the DB2 Task Center utility is allowed to schedule and execute
    tasks at the administration server. It is recommended that this parameter be set to OFF when the Task Scheduler is not
    in use. Ensure that the database has the label-based access controls (LBAC) component implemented to protect sensitive
    data. It is recommended that the policies and the components are properly enforced at the column and/or row level. LBAC
    rule exemptions provide very powerful access. Do not grant them without careful consideration. It is recommended that
    all security rule exemptions are reviewed against users and their required access. A security label component represents
    any criteria that you use to decide if a user should have access to a given set of data. It is recommended that all security
    label components are reviewed. A security policy defines the criteria in an organization based on the label components,
    rules, and rule exemptions. It is recommended that all policies are reviewed. A security label defines the criteria of
    access to the protected data. It is recommended that all security labels are reviewed. Backup redundancy ensures that
    multiple instances of database backups exist. Backups of your database should be stored securely in a location with full
    access for administrators, read and execute access for group, and no access for users. Enable automatic database maintenance
    on your DB2 instance. It is recommended that the DB2 Automatic Maintenance tool be used to ensure that the instance is
    performing optimally. runstat and reorg are two DB2 utilities that maintain the database data. It is recommended that
    these utilities be executed when possible. The SYSCAT.AUDITPOLICIES view contains all audit policies for a database. It
    is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.AUDITUSE view contains database
    audit policy for all non-database objects, such as authority, groups, roles, and users. It is recommended that the PUBLIC
    role be restricted from accessing this view. The SYSCAT.DBAUTH view contains information on authorities granted to users
    or groups of users. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.COLAUTH
    view contains the column privileges granted to the user or groups of users. It is recommended that the PUBLIC role be
    restricted from accessing this view. The SYSCAT.EVENTSview contains all events that the database is currently monitoring.
    It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.EVENTTABLES view contains the
    name of the destination table that will receive the monitoring events. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.ROUTINES view contains all user-defined routines, functions, and stored procedures
    in the database. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.INDEXAUTH view
    contains a list of users or groups that have CONTROL access on an index. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.PACKAGEAUTH view contains a list of users or groups that has EXECUTE privilege on
    a package. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.PACKAGES view contains
    all packages created in the database instance. It is recommended that the PUBLIC role be restricted from accessing this
    view. The SYSCAT.PASSTHRUAUTH view contains the names of user or group that have passthrough authorization to query the
    data source. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYLABELACCESS
    view contains all accounts in the database that have a security label privilege. It is recommended that the PUBLIC role
    be restricted from accessing this view. The SYSCAT.SECURITYLABELCOMPONENTELEMENTS view contains the element value for
    a security label component. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYLABELCOMPONENTS
    view contains the components of a security label. It is recommended that the PUBLIC role be restricted from accessing
    this view. The SYSCAT.SECURITYLABELS view contains all security labels within the database. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYPOLICIES view contains all database security policies.
    It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYPOLICYCOMPONENTRULES
    view contains the access rights for a security label component. It is recommended that the PUBLIC role be restricted from
    accessing this view. The SYSCAT.SECURITYPOLICYEXEMPTIONS contains the exemption on a security policy that was granted
    to a database account. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SURROGATEAUTHIDS
    contains all accounts that have been granted SETSESSIONUSER privilege on a user or to PUBLIC. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.ROLEAUTH contains information on all roles and their respective
    grantees. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROLES contains all
    roles available in the database. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROUTINEAUTH
    contains a list of all users that have EXECUTE privilege on a routine (function, method, or procedure). It is recommended
    that the PUBLIC role be restricted from accessing this view. The SYSCAT.SCHEMAAUTH contains a list of all users that have
    one or more privileges or access to a particular schema. It is recommended that the PUBLIC role be restricted from accessing
    this view. The SYSCAT.SCHEMATA contains all schema names in the database. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.SEQUENCEAUTH contains users and/or groups that have access to one or more privileges
    on a sequence. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.STATEMENTS contains
    all SQL statements of a compiled package. It is recommended that the PUBLIC role be restricted from accessing this view.
    The SYSCAT.PROCEDURES contains all stored procedures in the database. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.TABAUTH contains users or groups that have been granted one or more privileges on
    a table or view. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.TBSPACEAUTH
    contains users or groups that has been granted the USE privilege on a particular table space in the database. It is recommended
    that the PUBLIC role be restricted from accessing this view. A tablespace is where the data is physically stored. It is
    recommended that tablespace usage be restricted to authorized users. The SYSCAT.MODULEAUTH view contains all granted privileges
    on a module for users, groups, or roles and is read only. The SYSCAT.VARIABLEAUTH view contains the granted privileges
    on a global variable for users, groups, or roles and is read only. The SYSCAT.WORKLOADAUTH catalog represents the users,
    groups, or roles that have been granted the USAGE privilege on a workload. The SYSCAT.XSROBJECTAUTH view contains granted
    USAGE privileges on a particular XSR object for users, groups, or roles and is read only. The SYSIBMADM.OBJECTOWNERS administrative
    view shows the complete object ownership information for each authorization ID for USER owning a system catalog defined
    object from the connected database. The SYSIBMADM.PRIVILEGES administrative view displays all explicit privileges for
    all authorization IDs in the currently connected databases' system catalogs. PRIVILEGES schema is SYSIBMADM. The sysadm_group
    parameter defines the system administrator group with SYSADM authority for the DB2 instance. Accounts with this authority
    possess the highest level of authority within the database manager (i.e., stopping/starting services, backup/recovery,
    and maintenance) and control all database objects (i.e., data, system objects, and privileges). It is recommended that
    the sysadm_group group contains authorized users only. The sysctrl_group parameter defines the system administrator group
    with system control (SYSCTRL) authority. It is recommended that the sysctrl_group group contains authorized users only.
    The sysmaint_group parameter defines the system administrator group that possesses the system maintenance (SYSMAINT) authority.
    It is recommended that the sysmaint_group group contains authorized users only. The sysmon_group parameter defines the
    operating system groups with system monitor (SYSMON) authority. It is recommended that the sysmon_group group contains
    authorized users only. The SECADM (security administrator) role grants the authority to create, alter (where applicable),
    and drop roles, trusted contexts, audit policies, security label components, security policies, and security labels. It
    is also the authority required to grant and revoke roles, security labels and exemptions, and the SETSESSIONUSER privilege.
    SECADM authority has no inherent privilege to access data stored in tables. It is recommended that the SECADM role be
    granted to authorized users only. The DBADM (database administration) role grants the authority to a user to perform administrative
    tasks on a specific database. It is recommended that the dbadm role be granted to authorized users only. The CREATETAB
    (create table) role grants the authority to a user to create tables within a specific database. It is recommended that
    the createtab role be granted to authorized users only. The BINDADD (bind application) role grants the authority to a
    user to create packages on a specific database. It is recommended that the bindadd role be granted to authorized users
    only. The CONNECT role grants the authority to a user to connect to a specific database. It is recommended that the CONNECT
    role be granted to authorized users only. The NOFENCE role grants the authority to a user to create user-defined functions
    or procedures that are not fenced in the memory block of the database. It is recommended that the NOFENCE role be granted
    to authorized users only. The IMPLSCHEMA (implicit schema) role grants the authority to a user to create objects without
    specifying a schema that already exists. It is recommended that the IMPLSCHEMA role be granted to authorized users only.
    The LOAD role grants the authority to a user to load data into tables. It is recommended that the LOAD role be granted
    to authorized users only. The EXTERNALROUTINE role grants the authority to a user to create user-defined functions and
    procedures in a specific database. It is recommended that the EXTERNALROUTINE role be granted to authorized users only.
    The QUIESCECONNECT role grants the authority to a user to access a database even in the quiesced state. It is recommended
    that the QUIESCECONNECT role be granted to authorized users only. The SQLADM authority is required to monitor, tune, and
    alter SQL statements. The DATAACCESS authority grants the authority to access data. It allows the grantee to leverage
    DML level commands, i.e., SELECT, INSERT, UPDATE, DELETE, LOAD, and EXECUTE any package or routine. The ACCESSCTRL authority
    is the authority required to grant and revoke privileges on objects within a specific database. Some of these privileges
    include BINDADD, CONNECT, CREATETAB, CREATE\_EXTERNAL\_ROUTINE, LOAD, and QUIESCE\_CONNECT. It has no inherent privilege
    to access data stored in tables, except the catalog tables and views. The WLMADM authority manages workload objects for
    a database. Holders of DBADM authority implicitly also hold WLMADM authority. The DB2 instance manages the database environment
    and sets the configuration parameters. It is recommended that only administrators are allowed to start and stop the DB2
    instance. The DB2 administration server responds to remote requests from administration tools and client utilities. It
    is recommended that only administrators are allowed to start and stop the DB2 administration server. A schema is a logical
    grouping of database objects. It is recommended that unused schemas be removed from the database. System tablespaces store
    all system object data within that database. It is recommended that system tablespaces are used to store system data only
    and not user data. A DB2 Instance may come installed with default databases. It is recommended that the SAMPLE database
    be removed. The communication layer between a DB2 instance and the LDAP server should be encrypted. It is recommended
    that the ENABLE_SSL parameter in the IBMLDAPSecurity.ini file be set to TRUE. The IBMLDAPSecurity.ini file contains the
    IBM LDAP security plug-in configurations. The SSLconfig.ini file contains the SSL configuration parameters for the DB2
    instance, including the password for KeyStore. Roles provide several advantages that make it easier to manage privileges
    in a database system. Security administrators can control access to their databases in a way that mirrors the structure
    of their organizations (they can create roles in the database that map directly to the job functions in their organizations).
    The assignment of privileges is simplified. Instead of granting the same set of privileges to each individual user in
    a particular job function, the administrator can grant this set of privileges to a role representing that job function
    and then grant that role to each user in that job function. Having roles that have been granted specific privileges, then
    assigning users to the roles, is usually considered the best way to grant application access. Because granting privileges
    to individual users can be more difficult to track and maintain against unauthorized access, users should be assigned
    to organization-defined database roles according to the needs of the business. As users leave the organization or change
    responsibilities within the organization, the appropriate roles for them change as well, so role membership needs to be
    reviewed and verified periodically. The user-defined roles in DB2 can be nested in the same fashion as Windows security
    groups--a nested group has both its directly assigned permissions as well as the assigned group permissions. By nesting
    roles the database administrator is saving time by only having to assign a group of users versus assigning them individually.
    Nesting roles properly can often ease the application of the security model if it's kept fairly shallow, and if the roles
    are logically named. If these are all true, then nesting of roles is a good idea. Granting to PUBLIC increases the risk
    of unauthorized entry into the database. Because PUBLIC is accessible by any database user, it is important to understand
    the exposure it has on all database objects. It would make sense to grant role membership to PUBLIC if all users required
    all the privileges granted through that role. Using the WITH ADMIN OPTION clause of the GRANT (Role) SQL statement, the
    security administrator can delegate the management and control of membership in a role to someone else. The DB2 Control
    Center is a management tool that manages all registered DB2 instances and databases. It is recommended that access to
    the Control Center utility be granted to authorized users only. The DB2 Configuration Assistant is a management tool that
    manages all connectivity setup to the DB2 instances and databases. It is recommended that access to the Configuration
    Assistant utility be granted to authorized users only. The DB2 Health Monitor is a management tool that manages information
    about the database manager, database, tablespace and table space containers. It is recommended that access to the DB2
    Health Monitor utility be granted to authorized users only. The DB2 Activity Monitor is a management tool that monitors
    all application performance and concurrency, resource consumption, and SQL statement usage of a database. It is recommended
    that access to the DB2 Activity Monitor utility be granted to authorized users only.
  rationale: 'Enable this feature only when scheduling and executing tasks from the DB2 Task Center utility is necessary.
    This will ensure that malicious tasks are not executed unknowingly by the DB2 server. LBAC increases the control of your
    data by deciding exactly who has read and/or write access to individual rows and columns. LBAC rule exemptions allow a
    particular rule within a particular security policy to not be enforced when trying to access data protected by that security
    policy. A security label component should be implemented to provide different levels of access to different sensitive
    data. A security policy defines all access to the table and the columns based on the user’s login. A security label must
    be properly set up on tables with sensitive data. Maintaining redundant copies of database backups will increase business
    continuity capabilities should a DB2 service failure coincide with a corrupt backup. Backups may contain sensitive data
    that attackers can use to retrieve valuable information about the organization. A well-maintained DB2 instance will provide
    access to the data and reduce database outages. All statistics on tables and data should be monitored on a regular basis.
    A well-performing instance will require less system resources and provide better availability to users. This view contains
    sensitive information about the auditing security for this database. Access to the audit policies may aid in avoiding
    detection. This view contains sensitive information about on the types of objects are being audited. Access to the audit
    usage may aid in avoiding detection. This view contains all the grants in the database and may be used as an attack vector.
    This view contains all the grants in the database and may be used as an attack vector. The types of events that the database
    is monitoring should not be made readily available to the public. Public should not have access to see the target name
    of the event monitoring table. User-defined functions and routines should not be exposed to the public for exploits. The
    list of all users with access to an index should not be exposed to the public. The list of all users with access to a
    package should not be exposed to the public. The names of packages created in the database can be used as an entry point
    if a vulnerable package exists. The ability to see which accounts have the pass-through privilege could allow an attacker
    to exploit these accounts to access another data source. The ability to see which accounts have the pass-through privilege
    could allow an attacker to exploit these accounts to access another data source. PUBLIC should not be able to view all
    the elements of a security component and/or the database security policy. PUBLIC should not be able to view all the security
    components and/or the database security policy. PUBLIC should not be able to view all the security components and/or the
    database security policy. PUBLIC should not be able to view all the database security policies. PUBLIC should not be able
    to view all the access rules of the database security policies. PUBLIC should not be able to view all the exemption rules
    to the database security policies. PUBLIC should not be able to view all the surrogate accounts with SETSESSIONUSER privilege.
    PUBLIC should not have access to see the grants of the roles because this could be used as a point of exploit. PUBLIC
    should not have access to see all the roles because this could be used as a point of exploit. PUBLIC should not have access
    to see all the grants of routines to users or groups because this could be used as a point of exploit. PUBLIC should not
    have access to see all the grants of schemas to users or groups because this could be used as a point of exploit. PUBLIC
    should not have access to see all the created schemas in the database because this could be used as a point of exploit.
    PUBLIC should not have access to see all the granted access of a sequence in the database because this could be used as
    a point of exploit. PUBLIC should not have access to the source code or the SQL statements of a database package. This
    could lead to an exploit. PUBLIC should not have access to the source code or the SQL statements of a database package.
    This could lead to an exploit. PUBLIC should not have access to the grants of views and tables in a database. This could
    lead to an exploit. PUBLIC should not have access to the grants of the tablespaces in a database. This could lead to an
    exploit. Grant the USE of tablespace privilege to only authorized users. Restrict the privilege from PUBLIC, where applicable,
    as a malicious user can cause a denial of service at the tablespace level by overloading it with corrupted data. Any databases
    created without the RESTRICT option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it
    is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSCAT.MODULEAUTH view from PUBLIC to reduce
    risk to the organization''s data. Any databases created without the RESTRICT option automatically GRANT the SELECT privilege
    to PUBLIC for SYSCAT views. Therefore, it is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSCAT.VARIABLEAUTH
    view from PUBLIC to reduce risk to the organization''s data. Any databases created without the RESTRICT option automatically
    GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it is strongly recommended to explicitly REVOKE the
    SELECT privilege on the SYSCAT.WORKLOADAUTH from PUBLIC to reduce risk to the organization''s data. Any databases created
    without the RESTRICT option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it is strongly
    recommended to explicitly REVOKE the SELECT privilege on the SYSCAT.XSROBJECTAUTH view from PUBLIC to reduce risk to the
    organization''s data. Any databases created without the RESTRICT option automatically GRANT the SELECT privilege to PUBLIC
    for views. Therefore, it is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSIBMADM.OBJECTOWNERS
    view from PUBLIC to reduce risk to the organization''s data. Any databases created without the RESTRICT option automatically
    GRANT the SELECT privilege to PUBLIC for catalog views. Therefore, it is strongly recommended to explicitly REVOKE the
    SELECT privilege on SYSIBMADM.PRIVILEGES from PUBLIC to reduce risk to the organization''s data. If an account that possesses
    this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability of data
    in the DB2 instance will be at increased risk. If an account that possesses this authority is compromised or used in a
    malicious manner, the confidentiality, integrity, and availability of data in the DB2 instance will be at increased risk.
    If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality, integrity,
    and availability of data in the DB2 instance will be at increased risk. If an account that possesses this authority is
    compromised or used in a malicious manner, the confidentiality, integrity, and availability of data in the DB2 instance
    will be at increase risk. If an account that possesses this authority is compromised or used in a malicious manner, the
    confidentiality, integrity, and availability of data in the DB2 instance will be at increased risk. If an account that
    possesses this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability
    of data in the database will be at increased risk. Review all users that have access to this authority to avoid the addition
    of unnecessary and/or inappropriate users. If an account that possesses this authority is compromised or used in a malicious
    manner, the confidentiality, integrity, and availability of data in the database will be at increased risk. Review all
    users that have access to this authority. Review all users that have access to this authority. Review all users that have
    access to this authority. Review all users that have access to this authority. Review all users that have access to this
    authority. Review all users that have access to this authority. The SQLADM authority can CREATE, SET, FLUSH, DROP EVENT
    MONITORS and perform RUNSTATS and REORG INDEXES and TABLES. SQLADM can be granted to users, groups, or roles or PUBLIC.
    SQLADM authority is a subset of the DBADM authority and can be granted by the SECADM authority. The DATAACCESS authority
    gives the grantee read access and also control over manipulating the data. DATAACCESS can be granted to users, groups,
    or roles, but not PUBLIC. DATAACCESS authority is a subset of the DBADM authority and can be granted by the SECADM authority.
    The ACCESSCTRL authority gives the grantee access control to a specified database. With this authority, the grantee can
    grant/revoke privileges to other users. ACCESSCTRL can be granted to users, groups, or roles, but not PUBLIC. ACCESSCTRL
    authority can only be granted by the SECADM authority. The WLMADM authority enables creating, altering, dropping, commenting,
    granting, and revoking access to workload objects for a database. Only allowing privileged users to start and stop the
    DB2 instance will help ensure that the DB2 instance is controlled by authorized administrators. Allowing only privileged
    users to start and stop the DB2 administration server will help ensure that the DB2 administration server is controlled
    by authorized administrators. Unused schemas can be left unmonitored and may be subjected to abuse, so they should be
    removed. Do not install any user data in the following system tablespaces: SYSCATSPACE and SYSTOOLSPACE. Removing unused,
    well-known databases will reduce the attack surface of the system. Enabling SSL will help ensure the confidentiality of
    authentication credentials and other information that is sent to and from the DB2 instance and the LDAP server. Recommended
    value is read-only (RO) to Everyone/Other/Users/Domain Users. This will ensure that the parameter file is protected. Recommended
    value is read-only (RO) to Everyone/Other/Users/Domain Users. This will ensure that the parameter file is protected. Reviewing
    the roles within a database helps minimize the possibility of unwanted access. Users who have excessive privileges not
    needed to do their jobs pose an unnecessary risk to the organization as an insider threat. As tracking multiple levels
    of permissions can result in unauthorized access to data resources, this capability should be restricted according to
    the needs of the business. As any role granted to PUBLIC can potentially allow the compromise of database availability,
    confidentiality, or integrity, these roles should be restricted according to the needs of the business. The WITH ADMIN
    OPTION clause gives another user the authority to grant membership in the role to other users, to revoke membership in
    the role from other members of the role, and to comment on a role, but not to drop the role. Secure this application where
    applicable, since it has access to the DB2 instance name, the host it resides on, and the database name. Secure this application
    where applicable, since it has access to the DB2 instance name, the host it resides on, and the database name, and the
    port number. Secure this application where applicable, since it has sensitive information about the health of the database.
    Secure this application where applicable, since it has vital statistics about the database.'
