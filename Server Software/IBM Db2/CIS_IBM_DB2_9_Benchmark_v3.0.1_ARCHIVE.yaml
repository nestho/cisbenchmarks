- id: 3.2.2
  title: Set the database instance to auto-restart after abnormal termination
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  - Level 1
  - Level 1 - Windows Host OS
  - Level 2 - Windows Host OS
  - Level 1
  - Level 1 - Linux Host OS
  - Level 2 - Linux Host OS
  - Level 1
  description: Periodically, IBM releases fix packs to enhance features and resolve defects, including security defects. It
    is recommended that the DB2 instance remain current with all fix packs. Use an IP address rather than a hostname to connect
    to the host of the DB2 instance. The DB2 database instance will execute under the context of a given security principle.
    It is recommended that this service have the least privileges possible. Furthermore, it is advisable to have the DB2 service
    executed using the DB2 instance owner and monitor such accounts for unauthorized access to the sensitive data. The DB2
    service is installed with default accounts with well-known names such as db2admin, db2inst1, dasusr1, or db2fenc1. It
    is recommended that the use of these account names be avoided. The default accounts may be renamed and then used. A DB2
    software installation will place all executables under the default <DB2PATH>\sqllib directory. This directory needs to
    be secured so it grants only the necessary access to authorized users and administrators. A DB2 database container is
    the physical storage of the data. The DB2 Admin .profile file in Linux sets the environment variables and the settings
    for the user.
  rationale: Installing the latest DB2 fix pack will help protect the database from known vulnerabilities as well as reduce
    downtime that may otherwise result from functional defects. Using a hostname to connect to a DB2 instance can display
    useful information about the host to an attacker. For example, hostnames for DB2 instances often contain the DB2 version
    number, host type, or operating system type. Leveraging a least privilege account for the DB2 service will reduce an attacker's
    ability to compromise the host operating system should the DB2 service process become compromised. The use of default
    accounts may increase the DB2 service’s susceptibility to unauthorized access by an attacker. The DB2 runtime is comprised
    of files that are executed as part of the DB2 service. If these resources are not secured, an attacker may alter them
    to execute arbitrary code. The containers are needed in order for the database to operate properly. The loss of the containers
    can cause down time. Also, allowing excessive access to the containers may help an attacker to gain access to their contents.
    Therefore, secure the location(s) of the containers by restricting the access and ownership. Allow only the instance owner
    to have access to the tablespace containers. The umask value should be set to 022 for the owner of the DB2 software at
    all times, including before installing DB2.
  impact: ''
  references:
  - 1. http://www.ibm.com/products/finder/us/finders?Ne=5000000&finderN=100018
  - 1.2 Use IP address rather than hostname (Scored)
  page_start: 4
  audit_raw: "Perform the following DB2 commands to obtain the version:\nOpen the DB2 Command Window and type in db2level:\n\
    $ db2level\nDB21085I  Instance \"DB2\" uses \"32\" bits and DB2 code release \"SQL09050\" with\nlevel identifier \"03010107\"\
    .\nInformational tokens are \"DB2 v9.5.0.808\", \"s071001\", \"NT3295\", and Fix Pack\n\"3\".\nWindows:\n1. Run DB2 Command\
    \ Prompt - Administrator\n2. Type db2 list node directory show detail\n3. Verify that the HOSTNAME values for all nodes\
    \ listed are in IP address form and not\nhostnames\nLinux:\n1. Log into DB2 as DB2 Instance owner\n2. Type db2 list node\
    \ directory show detail\n3. Verify that the HOSTNAME values for all nodes listed are in IP address form and not\nhostnames\n\
    Sample:\nNode Directory\n Number of entries in the directory = 2\nNode 1 entry:\n Node name = SAMPLE\n Comment =\n Directory\
    \ entry type = LDAP\n Protocol = TCPIP\n Hostname = 192.168.145.10\n Service name = 50000\n14 | P a g e\nReview all accounts\
    \ that have access to the DB2 database service to ensure least privilege is\napplied.\nFor Windows:\n1. Right-click over\
    \ the %DB2PATH% and select Properties from the menu.\n2. Go to the Security tab and review all usernames that have access\
    \ to this directory.\nFor Linux:\n• Run ls –al $DB2PATH and review all usernames that have access to this directory.\n\
    Perform the following to obtain the value for this setting:\nFor Windows:\n1. Connect to the DB2 host\n2. Right-click\
    \ on the %DB2PATH%\\sqllib directory\n3. Choose Properties\n4. Select the Security tab\n5. Review the permissions for\
    \ all DB administrator accounts and all other accounts\nFor Linux:\n1. Connect to the DB2 host\n2. Change to the $DB2PATH/sqllib\
    \ directory\n3. Check the permission level of the directory\nOS => ls -al\n18 | P a g e\nReview all users that have access\
    \ to the directory of the containers to ensure only DB2\nadministrators have full access. All other users should have\
    \ read-only access.\nEnsure that the umask 022 setting exists in the .profile."
  remediation: 'Apply the latest fix pack as offered from IBM.

    To reconfigure the connection string, launch the DB2 Configuration Assistant and change

    the connection''s Hostname value from a text name to an IP address.

    15 | P a g e

    1.3 Leverage the least privilege principle (Not Scored)

    Ensure that all accounts have the absolute minimal privilege granted to perform their tasks.

    16 | P a g e

    1.4 Use non-default account names (Scored)

    For Windows:

    1. Right-click over the %DB2PATH% and select Properties from the menu.

    2. Go to the Security tab and re-assign all the user accounts with well-known default

    names to use non-default names.

    For Linux, perform the following command:

    chown –R <new user name>:<new group name> $DB2PATH

    Notes:

    Review the impact of changing the usernames before performing this global change.

    17 | P a g e

    2 DB2 Directory and File Permissions

    This section provides guidance on securing all operating system specific objects for DB2.

    2.1 Secure the DB2 Runtime Library (Scored)

    For Windows:

    1. Connect to the DB2 host

    2. Right-click on the %DB2PATH%\sqllib directory

    3. Choose Properties

    4. Select the Security tab

    5. Select all DB administrator accounts and grant them the Full Control authority

    6. Select all non-administrator accounts and revoke all privileges other than Read and

    Execute

    For Linux:

    1. Connect to the DB2 host

    2. Change to the $DB2PATH/sqllib directory

    3. Change the permission level of the directory to this recommended value:

    OS => chmod –R 750

    Set the privileges for the directory of the containers. The recommended values are that

    only DB2 administrators have full access, and all other users have read-only access.

    20 | P a g e

    2.3 Set umask value for DB2 admin user .profile file (Scored)

    Add umask 022 to the .profile profile.

    21 | P a g e

    3 DB2 Configurations

    3.1 DB2 Instance Parameter Settings

    This section provides guidance on how DB2 will control the data in the databases and the

    system resources that are allocated to the instance.'
  checks:
  - type: sql
    command: show detail
    severity: medium
    info: 'Perform the following DB2 commands to obtain the version:

      Open the DB2 Command Window and type in db2level:

      $ db2level

      DB21085I  Instance "DB2" uses "32" bits and DB2 code release "SQL09050" with

      level identifier "03010107".

      Informational tokens are "DB2 v9.5.0.808", "s071001", "NT3295", and Fix Pack

      "3".

      Windows:

      1. Run DB2 Command Prompt - Administrator

      2. Type db2 list node directory show detai'
- id: 3.1.1
  title: Enable audit buffer
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: DB2 can be configured to use an audit buffer. It is recommended that the audit buffer size be set to at least
    1000.
  rationale: Increasing the audit buffer size to greater than 0 will allocate space for the audit records generated by the
    audit facility. At scheduled intervals, or when the audit buffer is full, the db2auditd audit daemon empties the audit
    buffer to disk, writing the audit records asynchronously.
  impact: ''
  references:
  - 1. http://publib.boulder.ibm.com/infocenter/db2luw/v9/topic/com.ibm.db2.udb.adm
  page_start: 22
  audit_raw: "Perform the following to determine if the audit buffer is set as recommended:\n1. Attach to the DB2 instance:\n\
    db2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager\
    \ configuration\n22 | P a g e\n3. Locate AUDIT_BUF_SZ value in the output:\ndb2 => get database manager configuration\n\
    db2 => …\n       Audit buffer size (4KB)                    (AUDIT_BUF_SZ) = 1000\nEnsure AUDIT_BUF_SZ is greater than\
    \ or equal to 1000 in the above output."
  remediation: 'Perform the following to establish an audit buffer:

    1. Attach to the DB2 instance:

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using audit_buf_sz 1000'
  checks:
  - type: manual_review
    info: "Perform the following to determine if the audit buffer is set as recommended:\n1. Attach to the DB2 instance:\n\
      db2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager\
      \ configuration\n22 | P a g e\n3. Locate AUDIT_BUF_SZ value in the output:\ndb2 => get database manager configuration\n\
      db2 => …\n       Audit buffer size (4KB)                    (AUDIT_BUF_SZ) = 1000\nEnsure AUDIT_BUF_SZ is greater than\
      \ or equal to 1000 in the above output."
    severity: medium
- id: 3.1.2
  title: Encrypt user data across the network
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: DB2 supports a number of authentication mechanisms. It is recommended that the DATA_ENCRYPT authentication
    mechanism be used.
  rationale: The DATA_ENCRYPT authentication mechanism employs cryptographic algorithms to protect the confidentiality of
    authentication credentials and user data as they traverse the network between the DB2 client and server.
  impact: ''
  references:
  - 1. http://publib.boulder.ibm.com/infocenter/db2luw/v9/index.jsp?topic=%2Fcom.ib
  page_start: 24
  audit_raw: "Perform the following to determine if the authentication mechanism is set as\nrecommended:\n1. Attach to the\
    \ DB2 instance\ndb2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window\ndb2 => get database\
    \ manager configuration\n3. Locate the AUTHENTICATION value in the output:\ndb2 => get database manager configuration\n\
    db2 => …\n       Database manager authentication  (AUTHENTICATION) = DATA_ENCRYPT\nEnsure that AUTHENTICATION is set to\
    \ DATA_ENCRYPT in the output.\n24 | P a g e"
  remediation: 'The suggested value is DATA_ENCRYPT so that authentication occurs at the server. To set

    this:

    1. Attach to the DB2 instance:

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using authentication

    data_encrypt'
  checks:
  - type: manual_review
    info: "Perform the following to determine if the authentication mechanism is set as\nrecommended:\n1. Attach to the DB2\
      \ instance\ndb2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window\ndb2 => get database\
      \ manager configuration\n3. Locate the AUTHENTICATION value in the output:\ndb2 => get database manager configuration\n\
      db2 => …\n       Database manager authentication  (AUTHENTICATION) = DATA_ENCRYPT\nEnsure that AUTHENTICATION is set\
      \ to DATA_ENCRYPT in the output.\n24 | P a g e"
    severity: medium
- id: 3.1.3
  title: Require explicit authorization for cataloging
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: DB2 can be configured to allow users that do not possess the SYSADM authority to catalog and uncatalog databases
    and nodes. It is recommended that the catalog_noauth parameter be set to NO.
  rationale: Cataloging a database is the process of registering a database from a remote client to allow remote call and
    access. Setting catalog-noauth to YES bypasses all permission checks and allows anyone to catalog and uncatalog databases.
  impact: ''
  references:
  - 1. http://publib.boulder.ibm.com/infocenter/db2luw/v9/topic/com.ibm.db2.udb.adm
  - 2. http://publib.boulder.ibm.com/infocenter/db2luw/v9/index.jsp?topic=%2Fcom.ib
  page_start: 26
  audit_raw: "Perform the following to determine if authorization is explicitly required to catalog and\nuncatalog databases\
    \ and nodes:\n1. Attach to the DB2 instance:\ndb2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2\
    \ command window:\ndb2 => get database manager configuration\n3. Locate the value of CATALOG_NOAUTH in the output and\
    \ ensure that it is set to NO:\ndb2 => get database manager configuration\ndb2 => …\n       Cataloging allowed without\
    \ authority   (CATALOG_NOAUTH) = NO\n26 | P a g e"
  remediation: 'Perform the following to require explicit authorization to catalog and uncatalog databases

    and nodes.

    1. Attach to the DB2 instance:

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using catalog_noauth no'
  checks:
  - type: manual_review
    info: "Perform the following to determine if authorization is explicitly required to catalog and\nuncatalog databases\
      \ and nodes:\n1. Attach to the DB2 instance:\ndb2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2\
      \ command window:\ndb2 => get database manager configuration\n3. Locate the value of CATALOG_NOAUTH in the output and\
      \ ensure that it is set to NO:\ndb2 => get database manager configuration\ndb2 => …\n       Cataloging allowed without\
      \ authority   (CATALOG_NOAUTH) = NO\n26 | P a g e"
    severity: medium
- id: 3.1.4
  title: Disable data links support
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: Datalinks enables the database to support the Data Links Manager to manage unstructured data, such as images,
    large files, and other unstructured files on the host. It is recommended that data links support be disabled.
  rationale: Disable datalinks if there is no use for them because this will reduce the attack surface for the DB2 service.
  impact: ''
  references: []
  page_start: 28
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the value of datalinks value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Data\
    \ Links support (DATALINKS) = NO\nEnsure that DATALINKS is set to NO in the output.\n28 | P a g e"
  remediation: '1. Attach to the DB2 instance.

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using datalinks no'
  checks:
  - type: manual_review
    info: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 =>\
      \ attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
      3. Locate the value of datalinks value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Data\
      \ Links support (DATALINKS) = NO\nEnsure that DATALINKS is set to NO in the output.\n28 | P a g e"
    severity: medium
- id: 3.1.5
  title: Secure default database location
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The dftdbpath parameter contains the default file path used to create DB2 databases. It is recommended that
    this parameter is set to a directory owned by the DB2 Administrator.
  rationale: Securing the default database path will ensure that the confidentiality, integrity, and availability of data
    contained in the DB2 service is preserved.
  impact: ''
  references: []
  page_start: 30
  audit_raw: "Perform the following commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 =>\
    \ attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate this value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Default database path\
    \ (DFTDBPATH) = <valid directory>"
  remediation: '1. Attach to the DB2 instance.

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using dftdbpath

    30 | P a g e'
  checks:
  - type: manual_review
    info: "Perform the following commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 => attach\
      \ to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
      3. Locate this value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Default database path\
      \ (DFTDBPATH) = <valid directory>"
    severity: medium
- id: 3.1.6
  title: Secure permissions for default database file path
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  - Level 1 - Windows Host OS
  - Level 1 - Linux Host OS
  description: The dftdbpath parameter contains the default file path used to create DB2 databases. It is recommended that
    the permissions for this directory be set to full access for DB2 administrators and read and execute access only for all
    other accounts. It is also recommended that this directory be owned by the DB2 Administrator.
  rationale: Restricting access to the directory used as the default file path through permissions will help ensure that the
    confidentiality, integrity, and availability of the files there are protected.
  impact: ''
  references: []
  page_start: 31
  audit_raw: "For Windows and Linux:\n1. Attach to the DB2 instance.\ndb2 => attach to $DB2INSTANCE\n2. Run the following\
    \ command from the DB2 command window:\ndb2 => get database manager configuration\n4. Locate this value in the output\
    \ to find the default file path:\ndb2 => get database manager configuration\ndb2 => …\n       Default database path (DFTDBPATH)\
    \ = <valid directory>\n31 | P a g e\nAdditional steps for Windows:\n1. Connect to the DB2 host\n2. Right-click over the\
    \ directory used for the default file path\n3. Choose Properties\n4. Select the Security tab\n5. Review and verify the\
    \ privileges for all accounts.\n6. Review and verify that the DB2 Administrator is the owner of the directory.\nAdditional\
    \ steps for Linux:\n1. Connect to the DB2 host\n2. Change to the directory used as the default file path\n3. Review and\
    \ verify the permissions for the directory for all users; also ensure that\nthe DB2 Administrator is the owner.\nOS =>\
    \ ls -al"
  remediation: 'For Windows and Linux:

    1. Attach to the DB2 instance.

    2. Run the following command from the DB2 command window to change the default

    file path, if necessary:

    Additional steps for Windows:

    1. Connect to the DB2 host

    2. Right-click over the directory used as the default file path

    3. Choose Properties

    4. Select the Security tab

    5. Assign ownership of the directory to the DB2 Administrator

    6. Grant all DB administrator accounts the Full Control authority

    7. Grant only read and execute privileges to all other users (revoke all other privileges)

    32 | P a g e

    Additional steps for Linux:

    1. Connect to the DB2 host

    2. Change to the directory used as the default file path

    3. Assign the DB2 Administrator to be the owner of the directory using the chown

    command

    4. Change the permissions for the directory

    OS => chmod -R 755'
  checks:
  - type: manual_review
    info: "For Windows and Linux:\n1. Attach to the DB2 instance.\ndb2 => attach to $DB2INSTANCE\n2. Run the following command\
      \ from the DB2 command window:\ndb2 => get database manager configuration\n4. Locate this value in the output to find\
      \ the default file path:\ndb2 => get database manager configuration\ndb2 => …\n       Default database path (DFTDBPATH)\
      \ = <valid directory>\n31 | P a g e\nAdditional steps for Windows:\n1. Connect to the DB2 host\n2. Right-click over\
      \ the directory used for the default file path\n3. "
    severity: medium
- id: 3.1.7
  title: Set diagnostic logging to capture errors and warnings
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The diaglevel parameter specifies the type of diagnostic errors that will be recorded in the db2diag.log file.
    It is recommended that the diaglevel parameter be set to at least 3.
  rationale: The recommended diaglevel setting is 3, but any value greater than 3 is also acceptable. A value of at least
    3 will allow the DB2 instance to capture all errors and warnings that occur on the system.
  impact: ''
  references:
  - 1. http://publib.boulder.ibm.com/infocenter/db2luw/v9/index.jsp?topic=%2Fcom.ib
  page_start: 34
  audit_raw: "Perform the following commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 =>\
    \ attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the DIAGLEVEL value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Diagnostic error\
    \ capture level              (DIAGLEVEL) = 3\nEnsure that DIAGLEVEL is set to at least 3 in the output.\n34 | P a g e"
  remediation: '1. Attach to the DB2 instance.

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using diaglevel 3'
  checks:
  - type: manual_review
    info: "Perform the following commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 => attach\
      \ to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
      3. Locate the DIAGLEVEL value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Diagnostic\
      \ error capture level              (DIAGLEVEL) = 3\nEnsure that DIAGLEVEL is set to at least 3 in the output.\n34 |\
      \ P a g e"
    severity: medium
- id: 3.1.8
  title: Secure all diagnostic logs
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The diagpath parameter specifies the location of the diagnostic files for the DB2 instance. The directory at
    this location should be secured so that users have read and execute privileges only (no write privileges). All DB2 administrators
    should have full access to the directory.
  rationale: Securing the directory will ensure that the confidentiality, integrity, and availability of the diagnostic files
    contained in the directory are preserved.
  impact: ''
  references:
  - 1. http://publib.boulder.ibm.com/infocenter/db2luw/v9/topic/com.ibm.db2.udb.adm
  page_start: 36
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the DIAGPATH value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Diagnostic data\
    \ directory path    (DIAGPATH) = <valid directory>\nAdditional steps for Windows:\n1. Connect to the DB2 host\n2. Right-click\
    \ over the diagnostic log directory\n3. Choose Properties\n4. Select the Security tab\n5. Review the access for all accounts\n\
    36 | P a g e\nAdditional steps for Linux:\n1. Connect to the DB2 host\n2. Change to the diagnostic log directory\n3. Review\
    \ the permissions of the directory\nOS => ls -al"
  remediation: 'For Windows and Linux, to change the directory for the diagnostic logs:

    1. Attach to the DB2 instance.

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using diagpath

    Additional steps for Windows:

    1. Connect to the DB2 host

    2. Right-click over the diagnostic log directory

    3. Choose Properties

    4. Select the Security tab

    5. Grant the Full Control authority to all DB2 administrator accounts

    6. Grant only read and execute privileges to all other accounts (revoke any other

    privileges)

    Additional steps for Linux:

    1. Connect to the DB2 host

    2. Change to the diagnostic log directory

    3. Change the permissions of the directory

    OS => chmod -R 755'
  checks:
  - type: manual_review
    info: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 =>\
