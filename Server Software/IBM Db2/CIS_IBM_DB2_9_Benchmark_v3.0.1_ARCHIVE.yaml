  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get admin configuration\n\
    3. Locate the value in the output:\ndb2 => get admin configuration\ndb2 => …\n       Scheduler Mode                  \
    \         (SCHED_ENABLE) = OFF\nNote: SCHED_ENABLE is set to OFF in the above output.\n91 | P a g e\nReview all sensitive\
    \ tables and views in your organization to determine who should have\naccess to which columns and/or rows.\nReview and\
    \ justify all rule exemption grants.\nReview and justify all security label components.\nReview and justify all security\
    \ label policies.\nReview and justify all security labels.\nReview the replication of your backups based on organization\
    \ policy.\nReview the privileges applied to your backups.\nPerform the following DB2 commands to obtain the value for\
    \ this setting:\n1. Connect to the DB2 database.\ndb2 => connect to $DB2INSTANCE user $USERNAME using $PASSWORD\n2. Run\
    \ the following command from the DB2 command window:\ndb2 => get database configuration\n3. Locate this value in the output:\n\
    db2 => get database configuration\ndb2 => …\n         Automatic maintenance                      (AUTO_MAINT) = ON\nNote:\
    \ AUTO_MAINT is set to ON in the above output.\n100 | P a g e\nNot applicable\nPerform the following DB2 commands to obtain\
    \ the value for this setting:\n1. Connect to the DB2 database.\ndb2 => connect to $DB2INSTANCE user $USERNAME using $PASSWORD\n\
    2. Run the following command from the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator\
    \ = 'SYSCAT'\nand ttname = 'AUDITPOLICIES' and grantee = 'PUBLIC'\n103 | P a g e\nPerform the following DB2 commands to\
