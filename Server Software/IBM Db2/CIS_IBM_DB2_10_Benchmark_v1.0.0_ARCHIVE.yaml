    \ to find the primary archive log directory:\ndb2 => get database manager configuration\ndb2 => ...\n Default database\
    \ path (LOGARCHMETH1) = <valid directory>\nAdditional steps for Windows:\n40 | P a g e\n1. Connect to the DB2 host\n2.\
    \ Right-click on the primary archive log directory\n3. Choose Properties\n4. Select the Security tab\n5. Review and verify\
    \ the privileges for all accounts\nAdditional steps for Linux:\n1. Connect to the DB2 host\n2. Change to the primary archive\
    \ log directory\n3. Review and verify the permissions for the directory for all users.\nOS => ls -al"
  remediation: 'For Windows and Linux:

    1. Attach to the DB2 instance.

    2. Run the following command from the DB2 command window to change the primary

    archive log directory, if necessary:

    db2 => update database configuration using logarchmeth1 <valid directory>

    Additional steps for Windows (assuming that the logarchmeth1 parameter includes DISK):

    1. Connect to the DB2 host

    2. Right-click on the primary archive log directory

    3. Choose Properties

    4. Select the Security tab

    5. Grant all DB2 administrator accounts the Full Control authority

    6. Grant all other accounts read and execute privileges only (revoke all other

    privileges)

    Additional steps for Linux (assuming that the logarchmeth1 parameter includes DISK):

    1. Connect to the DB2 host

    2. Change to the primary archive log directory

    3. Change the permissions for the directory

    OS => chmod -R 755

    41 | P a g e'
  checks:
