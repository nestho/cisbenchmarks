- id: 3.2.3
  title: Authentication type for incoming connections at the server - srvcon_auth
  scoring: scored
  profile:
  - Level 2 - RDBMS
  - Level 1 - RDBMS
  - Level 1 - Windows Host OS
  - Level 1 - Linux Host OS
  - Level 2 - Windows Host OS
  - Level 2 - Linux Host OS
  description: The srvcon_auth parameter defines where and how user authentication is done for incoming connections at the
    server. If no value is used, DB2 uses the database manager configuration parameter authentication. DB2 Row and Column
    Access Control (RCAC) Policies control access to DB2 tables. They should match the organization's security and database
    access policies, and they should be regularly reviewed for gaps. The SECADM (security administrator) role grants the authority
    to create, alter (where applicable), and drop roles, trusted contexts, audit policies, security label components, security
    policies and security labels. It is also the authority required to grant and revoke roles, security labels and exemptions,
    and the SETSESSIONUSER privilege. SECADM authority has no inherent privilege to access data stored in tables. It is recommended
    that the SECADM role be granted to authorized users only. With row and column access control, individuals are permitted
    access to only the subset of data that is required to perform their job tasks.  Periodic review of these individuals is
    crucial when trying to keep data secure.  As business needs move forward, requirements behind accessing the data may change,
    leading to a revision in security policy.  By inspecting the list of users, groups, and roles, you are identifying excessive
    privileges that could pose possible security threats within your infrastructure. The logic behind instituting row permissions
    is crucial for a successful security policy.  Inspecting this logic and comparing it to the security policy will assure
    that all aspects of the data access controls are being adhered to. The logic behind instituting column masks is crucial
    for a successful security policy.  Inspecting this logic and comparing it to the security policy will assure that all
    aspects of the data access controls are being adhered to. Backup redundancy ensures that multiple instances of database
    backups exist. Backups of your database should be stored securely in a location with full access for administrators, read
    and execute access for group, and no access for users. Enable automatic database maintenance on your DB2 instance. It
    is recommended that the DB2 Automatic Maintenance tool be used to ensure that the instance is performing optimally. The
    SYSCAT.AUDITPOLICIES view contains all audit policies for a database. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.AUDITUSE view contains database audit policy for all non-database objects, such as
    authority, groups, roles, and users. It is recommended that the PUBLIC role be restricted from accessing this view. The
    SYSCAT.DBAUTH view contains information on authorities granted to users or groups of users. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.COLAUTH view contains the column privileges granted to
    the user, group, or role in the database. The SYSCAT.EVENTS view contains all types of events that the database is currently
    monitoring. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.EVENTTABLES view
    contains the name of the destination table that will receive the monitoring events. It is recommended that the PUBLIC
    role be restricted from accessing this view. The SYSCAT.ROUTINES view contains all user-defined routines, functions, and
    stored procedures in the database. It is recommended that the PUBLIC role be restricted from accessing this view. The
    SYSCAT.INDEXAUTH view contains a list of users or groups that have CONTROL access on an index. It is recommended that
    the PUBLIC role be restricted from accessing this view. The SYSCAT.PACKAGEAUTH view contains a list of users or groups
    that has EXECUTE privilege on a package. It is recommended that the PUBLIC role be restricted from accessing this view.
    The SYSCAT.PACKAGES view contains the names of all packages created in the database instance. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.PASSTHRUAUTH view contains the names of user or group that
    have passthrough authorization to query the data source. It is recommended that the PUBLIC role be restricted from accessing
    this view. The SYSCAT.SECURITYPOLICIES view contains all database security policies. It is recommended that the PUBLIC
    role be restricted from accessing this view. The SYSCAT.SECURITYPOLICYEXEMPTIONS contains the exemption to a security
    policy that was granted to a database account. It is recommended that the PUBLIC role be restricted from accessing this
    view. The SYSCAT.SURROGATEAUTHIDS contains the names of all accounts that have been granted SETSESSIONUSER privilege on
    a user or to PUBLIC. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROLEAUTH
    view contains information on all roles and their respective grantees. It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.ROLES view contains all roles available in the database. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.ROUTINEAUTH view contains a list of all users that have
    EXECUTE privilege on a routine (function, method, or procedure). It is recommended that the PUBLIC role be restricted
    from accessing this view. The SYSCAT.SCHEMAAUTH view contains a list of all users that have one or more privileges or
    access to a particular schema. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SCHEMATA
    view contains all schema names in the database. It is recommended that the PUBLIC role be restricted from accessing this
    view. The SYSCAT.SEQUENCEAUTH view contains users, groups, or roles granted privilege(s) on a sequence. It is recommended
    that the PUBLIC role be restricted from accessing this view. 82 | P a g e The SYSCAT.STATEMENTS view contains all SQL
    statements of a compiled package. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.TABAUTH
    view contains users or groups that have been granted one or more privileges on a table or view. It is recommended that
    the PUBLIC role be restricted from accessing this view. The SYSCAT.TBSPACEAUTH contains users or groups that have been
    granted the USE privilege on a particular tablespace in the database. It is recommended that the PUBLIC role be restricted
    from accessing this view. A tablespace is where the data is physically stored. It is recommended that tablespace usage
    be restricted to authorized users. The SYSCAT.MODULEAUTH view contains all granted privileges on a module for users, groups,
    or roles and is read only. The SYSCAT.VARIABLEAUTH view contains the granted privileges on a global variable for users,
    groups, or roles and is read only. The SYSCAT.WORKLOADAUTH catalog represents the users, groups, or roles that have been
    granted the USAGE privilege on a workload. The SYSCAT.XSROBJECTAUTH view contains granted USAGE privileges on a particular
    XSR object for users, groups, or roles and is read only. SYSCAT.AUTHORIZATIONIDS is an administrative view for the currently
    connected server. The SYSIBMADM.OBJECTOWNERS administrative view shows the complete object ownership information for each
    authorization ID for USER owning a system catalog defined object from the connected database. The SYSIBMADM.PRIVILEGES
    administrative view displays all explicit privileges for all authorization IDs in the currently connected databases' system
    catalogs. PRIVILEGES schema is SYSIBMADM. The sysadm_group parameter defines the system administrator group (SYSADM) authority.
    It is recommended that the sysadm_group group contains authorized users only. The sysctrl_group parameter defines the
    system administrator group with system control (SYSCTRL) authority. It is recommended that the sysctrl_group group contains
    authorized users only. The sysmaint_group parameter defines the system administrator group that possesses the system maintenance
    (SYSMAINT) authority. It is recommended that the sysmaint_group group contains authorized users only. 99 | P a g e The
    sysmon_group parameter defines the operating system groups with system monitor (SYSMON) authority. It is recommended that
    the sysmon_group group contain authorized users only. The SECADM (security administrator) role grants the authority to
    create, alter (where applicable), and drop roles, trusted contexts, audit policies, security label components, security
    policies and security labels. It is also the authority required to grant and revoke roles, security labels and exemptions,
    and the SETSESSIONUSER privilege. SECADM authority has no inherent privilege to access data stored in tables. It is recommended
    that the SECADM role be granted to authorized users only. The DBADM (database administration) role grants the authority
    to a user to perform administrative tasks on a specific database. It is recommended that the DBADM role be granted to
    authorized users only. The SQLADM authority is required to monitor, tune, and alter SQL statements. 104 | P a g e Grants
    the authority to access data. The DATAACCESS authority allows the grantee to leverage DML level commands i.e. SELECT,
    INSERT, UPDATE, DELETE, LOAD, and EXECUTE any package or routine. The DATAACCESS authority cannot be granted to PUBLIC.
    ACCESSCTRL authority is the authority required to grant and revoke privileges on objects within a specific database. Some
    of these privileges include BINDADD, CONNECT, CREATETAB, CREATE_EXTERNAL_ROUTINE, LOAD, and QUIESCE_CONNECT. It has no
    inherent privilege to access data stored in tables, except the catalog tables and views. The ACCESSCTRL authority cannot
    be granted to PUBLIC. The WLMADM authority manages workload objects for a database. Holders of DBADM authority implicitly
    also hold WLMADM authority. The CREATAB (create table) role grants the authority to a user to create tables within a specific
    database. It is recommended that the CREATAB role be granted to authorized users only. The BINDADD (bind application)
    role grants the authority to a user to create packages on a specific database. It is recommended that the BINDADD role
    be granted to authorized users only. The CONNECT role grants the authority to a user to connect to mainframe and midrange
    databases from Windows, Unix, and Linux operating systems. It is recommended that the CONNECT role be granted to authorized
    users only. The LOAD role grants the authority to a user to load data into tables. It is recommended that the LOAD role
    be granted to authorized users only. The EXTERNALROUTINE authority grants a user the privilege to create user-defined
    functions and procedures in a specific database. The QUIESCECONNECT role grants the authority to a user to access a database
    even in the quiesced state. 113 | P a g e Roles provide several advantages that make it easier to manage privileges in
    a database system.  Security administrators can control access to their databases in a way that mirrors the structure
    of their organizations (they can create roles in the database that map directly to the job functions in their organizations).  The
    assignment of privileges is simplified. Instead of granting the same set of privileges to each individual user in a particular
    job function, the administrator can grant this set of privileges to a role representing that job function and then grant
    that role to each user in that job function. Having roles that have been granted specific privileges, then assigning users
    to the roles, is usually considered the best way to grant application access. Because granting privileges to individual
    users can be more difficult to track and maintain against unauthorized access, users should be assigned to organization-defined
    database roles according to the needs of the business. As users leave the organization or change responsibilities within
    the organization, the appropriate roles for them change as well, so role membership needs to be reviewed and verified
    periodically. The user-defined roles in DB2 can be nested in the same fashion as Windows security groups--a nested group
    has both its directly assigned permissions as well as the assigned group  permissions. By nesting roles the database administrator
    is saving time by only having to assign a group of users versus assigning them individually. Nesting roles properly can
    often ease the application of the security model if it's kept fairly shallow, and if the roles are logically named. If
    these are all true, then nesting of roles is a good idea. Granting to PUBLIC increases the risk of unauthorized entry
    into the database. Because PUBLIC is accessible by any database user, it is important to understand the exposure it has
    on all database objects. It would make sense to grant role membership to PUBLIC if all users required all the privileges
    granted through that role. Using the WITH ADMIN OPTION clause of the GRANT (Role) SQL statement, the security administrator
    can delegate the management and control of membership in a role to someone else. The DB2 instance manages the database
    environment and sets the configuration parameters. It is recommended that only administrators are allowed to start and
    stop the DB2 instance. 120 | P a g e A schema is a logical grouping of database objects. It is recommended that unused
    schemas be removed from the database. System tablespaces store all system object data within that database. It is recommended
    that system tablespaces are used to stored system data only and not user data. A DB2 instance may come installed with
    default databases. It is recommended that the SAMPLE database be removed. The communication layer between a DB2 instance
    and the LDAP server should be encrypted. It is recommended that the ENABLE_SSL parameter in the IBMLDAPSecurity.ini file
    be set to TRUE. The IBMLDAPSecurity.ini file contains the IBM LDAP security plug-in configurations. The SSLconfig.ini
    file contains the SSL configuration parameters for the DB2 instance, including the password for KeyStore.
  rationale: 'Incoming connections to the DB2 server must follow an authentication protocol. The srvcon_auth server configuration
    parameter defines how and where user authentication is done. Missing, incomplete, or incorrect DB2 RCAC policies will
    increase the risks to the organization''s protected data and will prevent efforts to monitor, alert, and respond to these
    risks in the future. If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality,
    integrity, and availability of data in the DB2 instance will be at increased risk. If a user (either by himself or part
    of a group or role) is no longer required access to the data that is protected by row and column access controls, allowing
    that individual to maintain access allows that individual to compromise the confidentiality, integrity, and/or availability
    of the data in the DB2 instance. Missing or incomplete DB2 RCAC Security Policies will increase the risks to the organization''s
    protected data and will prevent efforts to monitor, alert, and respond to these risks in the future. Missing or incomplete
    DB2 RCAC security policies will increase the risks to the organization''s protected data and will prevent efforts to monitor,
    alert, and respond to these risks in the future. Maintaining redundant copies of database backups will increase business
    continuity capabilities should a DB2 service failure coincide with a corrupt backup. Backups may contain sensitive data
    thattackers can use to retrieve valuable information about the organization. A well-maintained DB2 instance will provide
    access to the data and reduce database outages. 60 | P a g e This view contains sensitive information about the auditing
    security for this database. Access to the audit policies may aid attackers in avoiding detection. This view contains sensitive
    information about the types of objects being audited. Access to the audit policy may aid attackers in avoiding detection.
    This view contains all the grants in the database and may be used as an attack vector. The SYSCAT.COLAUTH view contains
    the column privileges granted to the user or a group of users. It is recommended that the PUBLIC role be restricted from
    accessing this view. The types of events that the database is monitoring should not be made readily available to the public.
    PUBLIC should not have access to see the target name of the event monitoring table. User-defined functions and routines
    should not be exposed to the public for exploits. The list of all users with access to an index should not be exposed
    to the public. The list of all users with access to a package should not be exposed to the public. The names of packages
    created in the database can be used as an entry point if a vulnerable package exists. The ability to see which accounts
    have the pass-through privilege could allow an attacker to exploit these accounts to access another data source. PUBLIC
    should not be able to view all the database security policies. 73 | P a g e Public should not be able to view all the
    exemptions to the database security policies. Public should not be able to view the names of all the surrogate accounts
    with SETSESSIONUSER privilege. PUBLIC should not have access to see the grants of the roles because this could be used
    as a point of exploit. PUBLIC should not have access to see all the roles because this could be used as a point of exploit.
    PUBLIC should not have access to see all the users because this could be used as a point of exploit. PUBLIC should not
    have access to see all the users because this could be used as a point of exploit. 80 | P a g e PUBLIC should not have
    access to see all the schema names in the database because this could be used as a point of exploit. 81 | P a g e PUBLIC
    should not have access to see all the granted access of a sequence in the database because this could be used as a point
    of exploit. PUBLIC should not have access to the SQL statements of a database package. This could lead to an exploit.
    PUBLIC should not have access to the grants of views and tables in a database. This could lead to an exploit. PUBLIC should
    not have access to the grants of the tablespaces in a database. This could lead to an exploit. Grant the USE of tablespace
    privilege to only authorized users. Restrict the privilege from PUBLIC, where applicable, as a malicious user can cause
    a denial of service at the tablespace level by overloading it with corrupted data. Any databases created without the RESTRICT
    option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it is strongly recommended to explicitly
    REVOKE the SELECT privilege on the SYSCAT.MODULEAUTH view from PUBLIC to reduce risk to the organization''s data. Any
    databases created without the RESTRICT option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore,
    it is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSCAT.VARIABLEAUTH view from PUBLIC to reduce
    risk to the organization''s data. 89 | P a g e Any databases created without the RESTRICT option automatically GRANT the
    SELECT privilege to PUBLIC for SYSCAT views. Therefore, it is strongly recommended to explicitly REVOKE the SELECT privilege
    on the SYSCAT.WORKLOADAUTH from PUBLIC to reduce risk to the organization''s data. Any databases created without the RESTRICT
    option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it is strongly recommended to explicitly
    REVOKE the SELECT privilege on the SYSCAT.XSROBJECTAUTH view from PUBLIC to reduce risk to the organization''s data. Databases
    created without the RESTRICT option automatically GRANT the SELECT privilege to PUBLIC for SYSCAT views. Therefore, it
    is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSCAT.AUTHORIZATIONIDS view from PUBLIC to reduce
    risk to the organization''s data. Any databases created without the RESTRICT option automatically GRANT the SELECT privilege
    to PUBLIC for views. Therefore, it is strongly recommended to explicitly REVOKE the SELECT privilege on the SYSIBMADM.OBJECTOWNERS
    view from PUBLIC to reduce risk to the organization''s data. Any databases created without the RESTRICT option automatically
    GRANT the SELECT privilege to PUBLIC for catalog views. Therefore, it is strongly recommended to explicitly REVOKE the
    SELECT privilege on SYSIBMADM.PRIVILEGES from PUBLIC to reduce risk to the organization''s data. If an account that possesses
    this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability of data
    in the DB2 instance will be at increased risk. If an account that possesses this authority is compromised or used in a
    malicious manner, the confidentiality, integrity, and availability of data in the DB2 instance will be at increased risk.
    If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality, integrity,
    and availability of data in the DB2 instance will be at increased risk. If an account that possesses this authority is
    compromised or used in a malicious manner, the confidentiality, integrity, and availability of data in the DB2 instance
    will be at increased risk. If an account that possesses this authority is compromised or used in a malicious manner, the
    confidentiality, integrity, and availability of data in the DB2 instance will be at increased risk. If an account that
    possesses this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability
    of data in the database will be at increased risk. 103 | P a g e The SQLADM authority can CREATE, SET, FLUSH, DROP EVENT
    MONITORS and perform RUNSTATS and REORG INDEXES and TABLES. SQLADM can be granted to users, groups, or roles or PUBLIC.
    SQLADM authority is a subset of the DBADM authority and can be granted by the SECADM authority. The DATAACCESS authority
    gives the grantee read access and also control over manipulating the data. DATAACCESS can be granted to users, groups,
    or roles, but not 105 | P a g e PUBLIC. DATAACCESS authority is a subset of the DBADM authority and can be granted by
    the SECADM authority. The ACCESSCTRL authority gives the grantee access control to a specified database. With this authority,
    the grantee can grant/revoke privileges to other users. ACCESSCTRL can be granted to users, groups, or roles, but not
    PUBLIC. ACCESSCTRL authority can only be granted by the SECADM authority. 106 | P a g e The WLMADM authority enables creating,
    altering, dropping, commenting, granting, and revoking access to workload objects for a database. Review all users that
    have access to this authority to avoid the addition of unnecessary and/or inappropriate users. If an account that possesses
    this authority is compromised or used in a malicious manner, the confidentiality, integrity, and availability of data
    in the database will be at increased risk. All users that have access to this authority should be regularly reviewed.
    All users that have access to this authority should be regularly reviewed. All users with this authority should be regularly
    reviewed and approved. 112 | P a g e It is recommended that the QUIESCECONNECT role be granted to authorized users only.
    Reviewing the roles within a database helps minimize the possibility of unwanted access. Users who have excessive privileges
    not needed to do their jobs pose an unnecessary risk to the organization as an insider threat. As tracking multiple levels
    of permissions can result in unauthorized access to data resources, this capability should be restricted according to
    the needs of the business. As any role granted to PUBLIC can potentially allow the compromise of database availability,
    confidentiality, or integrity, these roles should be restricted according to the needs of the business. The WITH ADMIN
    OPTION clause gives another user the authority to grant membership in the role to other users, to revoke membership in
    the role from other members of the role, and to comment on a role, but not to drop the role. 119 | P a g e Only privileged
    users should have access to start and stop the DB2 instance. This will ensure that the DB2 instance is controlled by authorized
    administrators. Unused schemas can be left unmonitored and may be subjected to abuse and therefore should be removed.
    121 | P a g e Users should not have privileges to create user data objects within the system tablespaces. User data objects
    created within the system tablespaces should be removed. Removing unused, well-known databases will reduce the attack
    surface of the system. Enabling SSL will help ensure the confidentiality of authentication credentials and other information
    that is sent between the DB2 instance and the LDAP server. 124 | P a g e Note: The file is located under INSTANCE_HOME/sqllib/cfg/,
    for Linux; and %DB2PATH%\cfg\, for Windows. Recommended value is read and write access to DB2 administrators only and
    read-only to Everyone/Other/Users/Domain Users. This will ensure that the parameter file is protected. Note: the file
    is located under INSTANCE_HOME/sqllib/cfg/, for Linux; and %DB2PATH%\cfg\, for Windows. 125 | P a g e Recommended value
    is full access to DB2 administrators only, read and write access only to members of the SYSADM group, and no access to
    other users. This will ensure that the parameter file is protected. Note: the file is located under INSTANCE_HOME/sqllib/cfg/,
    for Linux; and %INSTHOME%\, for Windows.'
