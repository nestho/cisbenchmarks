- id: 3.1.11
  title: Authenticate federated users at the instance level
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The fed_noauth parameter determines whether federated authentication will be bypassed at the instance. It is
    recommended that this parameter be set to no.
  rationale: Setting fed_noauth to no will ensure that authentication is checked at the instance level. This will prevent
    any federated authentication from bypassing the client and the server.
  impact: ''
  references: []
  page_start: 31
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the FED_NOAUTH value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Bypass federated\
    \ authentication (FED_NOAUTH) = NO\nNote: FED_NOAUTH is set to NO in the above output."
  remediation: '1. Attach to the DB2 instance

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using fed_noauth no

    31 | P a g e'
  checks:
  - type: manual_review
    info: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2 =>\
      \ attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
      3. Locate the FED_NOAUTH value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Bypass federated\
      \ authentication (FED_NOAUTH) = NO\nNote: FED_NOAUTH is set to NO in the above output."
    severity: medium
- id: 3.1.12
  title: Set maximum connection limits
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: 'The max_connections parameter indicates the maximum number of client connections allowed per database partition.
    It is recommended that this parameter be set equal to the max_coordagents parameter. The max_coordagents parameter equals
    the maximum number of agents needed to perform connections to the database or attachments to the instance. NOTE: Ensure
    that dependent parameters, such as maxappls, are set less than the max_coordagents parameter. This would ensure that the
    lock limit isn''t reached, which would result in lock escalation issues.'
  rationale: By default, DB2 allows an unlimited number of users to access the DB2 instance. In addition to giving access
    to the DB2 instance to authorized users only, it is recommended to set a limit to the number of users allowed to access
    a DB2 instance. This helps prevent denial of service conditions should an authorized process malfunction and attempt a
    large number of simultaneous connections.
  impact: ''
  references: []
  page_start: 32
  audit_raw: "Perform the following DB2 commands to obtain the value(s) for these settings:\n1. Attach to the DB2 instance.\n\
    db2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager\
    \ configuration\n3. Locate the MAX_CONNECTIONS and MAX_COORDAGENTS values in the output:\ndb2 => get database manager\
    \ configuration\ndb2 => …\n32 | P a g e\n       Max number of client connections (MAX_CONNECTIONS) = 150\n       Max number\
    \ of existing agents (MAX_COORDAGENTS) = 150\nNote: MAX_CONNECTIONS is set to 150 and the MAX_COORDAGENTS is set to 150\
    \ in the\nabove output.\nPerform the following DB2 commands to obtain the value of the MAXAPPLS parameter:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => get database configuration\n3. Locate the MAXAPPLS value in the output:\ndb2 => get\
    \ database configuration\ndb2 => …\n       Max Number of Active Applications (MAXAPPLS) = [99]\nNote: MAXAPPLS is set\
    \ to 99 in the above output."
  remediation: "The default value for max_coordagents is set to AUTOMATIC. Allowable range is 1 to 64,000,\nor -1 for unlimited.\
    \ The recommended value is 100.  The following command will set the\nmax_coordagents to 100, as well as set the max_connections\
    \ to AUTOMATIC which is also\nrecommended.\n1. Attach to the DB2 instance\ndb2 => attach to $DB2INSTANCE\n2. Run the following\
    \ command from the DB2 command window:\ndb2 => update database manager configuration using max_coordagents 100\nAUTOMATIC\n\
    If maxappls is NOT less than the value for max_coordagents, then adjust the value of\nmaxappls accordingly:\n33 | P a\
    \ g e\n db2 => update database configuration using maxappls <a number less then\nmax_coordagents>"
  checks:
  - type: manual_review
    info: "Perform the following DB2 commands to obtain the value(s) for these settings:\n1. Attach to the DB2 instance.\n\
      db2 => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager\
      \ configuration\n3. Locate the MAX_CONNECTIONS and MAX_COORDAGENTS values in the output:\ndb2 => get database manager\
      \ configuration\ndb2 => …\n32 | P a g e\n       Max number of client connections (MAX_CONNECTIONS) = 150\n       Max\
      \ number of existing agents (MAX_COORDAGENTS) = 150\n"
    severity: medium
- id: 3.1.13
  title: Set administrative notification level
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The notifylevel parameter specifies the type of administration notification messages that are written to the
    administration notification log. It is recommended that this parameter be set greater than or equal to 3. A setting of
    3, which includes settings 1 & 2, will log all fatal errors, failing services, system integrity, as well as system health.
  rationale: The system should be monitoring all Health Monitor alarms, warnings, and attentions. This may give an indication
    of any malicious usage on the DB2 instance.
  impact: ''
  references: []
  page_start: 34
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the NOTIFYLEVEL value in the output:\n34 | P a g e\ndb2 => get database manager configuration\ndb2 => …\n  \
    \     Notify Level (NOTIFYLEVEL) = 3\nNote: NOTIFYLEVEL is set to 3 in the above output."
  remediation: '1. Attach to the DB2 instance

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using notifylevel 3'
