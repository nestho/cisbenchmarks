- id: 4.1.10
  title: Establish Retention Set Size for Backups (NUM_DB_BACKUPS)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The NUM_DB_BACKUPS parameter specifies the number of backups to retain for a database before marking the oldest
    backup as deleted. It is recommended that this parameter be set to at least 12. The NUMARCHRETRY parameter determines
    how many times a database will try to archive the log file to the primary or the secondary archive destination before
    trying the failover directory. It is recommended that this parameter be set to 5. The MAXAPPLS parameter specifies the
    maximum number of concurrent applications that can be connected (both local and remote) to a database. In an instance
    with a single database, it is recommended that this value be set to AUTOMATIC. While this indicates that any number of
    connections should be allowed, an upper limit of MAX_CONNECTIONS database manager configuration parameter is still enforced.
    If there are multiple databases within the instance, then the sum of MAXAPPLS for each database should be less than or
    equal to MAX_CONNECTIONS. When AUTOMATIC is used, MAXAPPLS can also have a parameter. The value is not used to determine
    the maximum number of connections, but rather for dependent parameters, such as PCKCACHESZ and CATALOG_CACHESZ that can
    derive their value from MAXAPPLS. In such a case the value specified with AUTOMATIC should represent the expected number
    of connections.
  rationale: Retain multiple copies of the database backup to ensure that the database can recover from an unexpected failure.
    This parameter should not be set to 0. Multiple backups should be kept ensuring that all logs and transactions can be
    used for auditing. Establishing a failover retry time limit will ensure that the database will always have a means to
    recover from an abnormal termination. This parameter should not be set to 0. By default, Db2 allows an unlimited number
    of users to access the Db2 instance. In addition to giving access to the Db2 instance to authorized users only, it is
    recommended to set a limit to the number of users allowed to access a Db2 instance. This helps prevent denial of service
    conditions should an authorized process malfunction and attempt many simultaneous connections.
  impact: Increasing the value of this parameter without lowering the MAXLOCKS parameter or increasing the LOCKLIST parameter
    could cause you to reach the database limit on locks (LOCKLIST) rather than the application limit and as a result cause
    pervasive lock escalation problems.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-maxappls-maximumnumber-active-applications
  page_start: 96
  audit_raw: 'Perform the following Db2 commands to obtain the value for this setting:

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the NUM_DB_BACKUPS value in the output:

    Number of database backups to retain (NUM_DB_BACKUPS) = 12

    Perform the following Db2 commands to obtain the value for this setting:

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the NUMARCHRETRY value in the output:

    Number of log archive retries on error (NUMARCHRETRY) = 5

    Perform the following Db2 commands to obtain the value of the MAXAPPLS parameter:

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the MAXAPPLS value in the output:

    Max Number of Active Applications (MAXAPPLS) = AUTOMATIC(40)'
  remediation: '1. Connect to the Db2 database

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => update database configuration using num_db_backups 12

    1. Connect to the Db2 database

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => update database configuration using numarchretry 5

    1. Connect to the Db2 database

    db2 => connect to <dbname>

    2. If a single database is used in the instance, run the following command:

    db2 => update database configuration using maxappls AUTOMATIC

    3. If multiple databases are used in the instance, determine appropriate values for

    each database such that the sum of MAXAPPLS values equals the MAX_CONNECTIONS

    database manager configuration parameter value (for example 100 for each of 2

    databases when MAX_CONNECTIONS is 200), and run the following command:

    db2 => update database configuration using maxappls 200'
  checks:
  - type: manual_review
    info: 'Perform the following Db2 commands to obtain the value for this setting:

      1. Connect to the Db2 database.

      db2 => connect to <dbname>

      2. Run the following command:

