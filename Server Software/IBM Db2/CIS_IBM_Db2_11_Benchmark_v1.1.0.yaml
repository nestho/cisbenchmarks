- id: 8.1.1
  title: Configure a Server-side Key Store for TLS (SSL_SVR_KEYDB)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: To enable TLS support in a Db2 server, it is necessary to configure a key store that will contain certificates
    to be used for secure TLS communication between a Db2 client and Db2 server.
  rationale: On the server side, Db2 requires a key store to be configured. Otherwise, TLS support cannot be enabled.
  impact: ''
  references: []
  page_start: 411
  audit_raw: 'Perform the following to determine if SSL_SVR_KEYDB is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of CATALOG_NOAUTH in the output:

    SSL server keydb file (SSL_SVR_KEYDB) =

    Ensure SSL_SVR_KEYDB is not blank.'
  remediation: 'Perform the following to set SSL_SVR_KEYDB:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command, where <path> is the fully qualified path to the

    keystore file:

    db2 => update dbm cfg using SSL_SVR_KEYDB <path>

    3. (Optional) To use the Microsoft certificate store on Windows, set SSL_SVR_KEYDB

    to GSK_MS_CERTIFICATE_STORE:

    db2 => update dbm cfg using SSL_SVR_KEYDB GSK_MS_CERTIFICATE_STORE

    If a keystore file is being used, ensure only the instance owner and administrators have

    access to the file. Do not grant world readable or world writable permissions on the

    keystore file.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if SSL_SVR_KEYDB is set.

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command:

      db2 => get database manager configuration

      3. Locate the value of CATALOG_NOAUTH in the output:

      SSL server keydb file (SSL_SVR_KEYDB) =

      Ensure SSL_SVR_KEYDB is not blank.'
    severity: medium
- id: 8.1.2
  title: Configure a Server-side Stash File for TLS (SSL_SVR_STASH)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: 'If a key store file is being used to configure TLS support in a Db2 instance, a stash file must also be configured
    to allow the Db2 server to be able to read certificates from the keystore. If the Microsoft certificate store is configured
    on a Windows platform, a stash file is not required. The SSL_SVR_LABEL database manager configuration parameter controls
    which certificate Db2 will serve to clients. This certificate must have its associated certificate chain present in the
    server-side key store and must be associated with a private key. The SSL_SVCENAME database manager configuration parameter
    controls which port Db2 will listen on for TLS encrypted connections. SSL_SVCENAME can consist of one of the following:
    • A port number • Service name defined in /etc/services (UNIX/Linux) or %WINDIR%\system32\drivers\etc\services (windows)
    The SSL_VERSIONS database manager configuration parameter controls which versions of the TLS protocol Db2 enables. In
    Db2 11.5 and earlier, TLS 1.0 and 1.1 are enabled by default if SSL_VERSIONS is not set. The SSL_CIPHERSPECS database
    manager configuration parameter controls which cipher suites are enabled by Db2. If it is unset, Db2 will enable a default
    list of ciphers.'
  rationale: Db2 does not have a method for an operator to enter a password for a server-side SSL key store, so a stash file
    must be used to provide the password to Db2. The Microsoft certificate store does not require a password, so a stash file
    is not required. It is highly recommended to set SSL_SVR_LABEL. Leaving this parameter blank and allowing Db2 to utilize
    a default certificate will only work with CMS(.KDB) format key stores, and the feature is deprecated. Db2 must have a
    port number or service name defined to enable TLS communication. Db2 does not choose a default port number if SSL_SVCENAME
    is unset. TLS 1.0 and 1.1 are considered insecure and have been deprecated as of Db2 11.5. It is recommended to use TLS
    1.2 The default list of ciphers includes SHA1 ciphers, which are considered weak. In addition, some cipher suites enabled
    by default do not support perfect forward secrecy. Depending on the security requirements of your organization, it may
    be necessary to restrict which ciphers are enabled by Db2.
  impact: ''
  references: []
  page_start: 413
  audit_raw: 'Perform the following to determine if SSL_SVR_STASH is required, and if it is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of SSL_SVR_KEYDB in the output:

    SSL server keydb file (SSL_SVR_KEYDB) =

    4. A stash file is not required on Windows if using GSK_MS_CERTIFICATE_STORE. If the

    value of SSL_SVR_KEYDB is not GSK_MS_CERTIFICATE_STORE, locate the value of

    SSL_SVR_STASH and ensure SSL_SVR_STASH is not blank.

    SSL server stash file (SSL_SVR_STASH) =

    Perform the following to determine if SSL_SVR_LABEL is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of SSL_SVR_LABEL in the output:

    SSL server certificate label (SSL_SVR_LABEL) =

    Perform the following to determine if SSL_SVCENAME is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of SSL_SVCENAME in the output:

    SSL service name (SSL_SVCENAME) =

    Perform the following to determine if SSL_VERSIONS is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of SSL_VERSIONS in the output:

    SSL versions (SSL_VERSIONS) =

    Perform the following to determine if SSL_CIPHERSPECS is set.

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of SSL_CIPHERSPECS in the output:

    SSL cipher specs (SSL_CIPHERSPECS) ='
  remediation: 'Perform the following to set SSL_SVR_STASH:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command, where <path> is the fully qualified path to the

    keystore file:

    db2 => update dbm cfg using SSL_SVR_STASH <path>

    If a stash file is being used, ensure only the instance owner and administrators have

    access to the file.

    Do not grant world readable or world writable permissions on the stash file.

    If the Microsoft certificate store is being used on Windows, it is not necessary to set

    SSL_SVR_STASH.

    Perform the following to set SSL_SVR_LABEL:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command, where <label> is the name of a certificate present

    in the server-side key store.

    db2 => update dbm cfg using SSL_SVR_LABEL <label>

    In Db2 11.5.4 and later, or Db2 11.1.4.5 and later with the DB2_DYNAMIC_SSL_LABEL

    registry variable set to ON, updating the value of SSL_SVR_LABEL while attached to the

    instance will cause the certificate served by Db2 to change while instance is running,

    with no effect on existing connections.

    Prior releases of Db2 require an instance recycle (db2stop/db2start) for the change to

    take effect.

    Perform the following to set SSL_SVCENAME:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command, where <service> is a port number or named

    service.

    db2 => update dbm cfg using SSL_SVCENAME <service>

    Db2 must be recycled (db2stop/db2start) for changes to SSL_SVCENAME to take effect.

    Perform the following to set SSL_VERSIONS:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command to enable TLS 1.2 within the Db2 server.

    db2 => update dbm cfg using SSL_VERSIONS TLSV12

    Db2 must be recycled (db2stop/db2start) for changes to SSL_VERSIONS to take effect.

    Perform the following to set SSL_CIPHERSPECS:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command to enable a specific set of ciphers within

    the Db2 server.

    db2 => update dbm cfg using SSL_CIPHERSPECS <LIST>

    Replace <LIST> with one or multiple of the following cipher suites. If multiple

    items are specified, separate them with a single comma and no spaces.

    o TLS_RSA_WITH_AES_256_GCM_SHA384

    o TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

    o TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

    o TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384

    o TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384

    o TLS_RSA_WITH_AES_256_CBC_SHA256

    o TLS_RSA_WITH_AES_128_GCM_SHA256

    o TLS_RSA_WITH_AES_128_CBC_SHA256

    o TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

    o TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

    o TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256

    o TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if SSL_SVR_STASH is required, and if it is set.

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command:

      db2 => get database manager configuration

      3. Locate the value of SSL_SVR_KEYDB in the output:

      SSL server keydb file (SSL_SVR_KEYDB) =

      4. A stash file is not required on Windows if using GSK_MS_CERTIFICATE_STORE. If the

      value of SSL_SVR_KEYDB is not GSK_MS_CERTIFICATE_STORE, locate the value of

      SSL_SVR_STASH and ensure SSL_S'
    severity: medium
