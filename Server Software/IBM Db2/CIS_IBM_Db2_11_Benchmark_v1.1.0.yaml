- id: 6.4.2
  title: Do Not Allow Trusted Context to Switch Users Without Authentication
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: A Trusted Context can provide a middle tier with the option of performing end user authentication, and then
    switching to that user within the database without further authentication. The middle tier is asserting the identity of
    the end user they have already authenticated. The organizations Standard Operating Procedures (SOP) will determine whether
    such trust has been placed with the middle tier establishing the trusted connection.
  rationale: Allowing an untrusted middle tier to establish a trusted context and switch users without authentication is a
    security risk. Only middle tier applications that have been validated and included in the SOP should have this functionality
    enabled. All other trusted contexts should not use with WITHOUT AUTHENTICATION clause during the CREATE TRUSTED CONTEXT
    statement.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=security-using-trusted-contextstrusted-connections
  - '2. CIS Controls:'
  page_start: 402
  audit_raw: '1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Issue Issue the following command to verify that no trusted context

    db2 => select * from syscat.surrogateauthids where trustedidtype=''C''

    and authenticate=''N'' and trustedID!=''SYSATSCONTEXT''

    3. Review any rows returned to ensure they are allowed by the SOP for performing

    a switch user without authentication.'
  remediation: '1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Disable any trusted context identified above until it can be determined why such

    trusted context where created with the following command

    db2 => alter trusted context <contextname> alter disable'
  checks:
  - type: sql
    command: select * from syscat.surrogateauthids where trustedidtype='C'
    severity: medium
    info: '1. Connect to the Db2 database.

      db2 => connect to <dbname>

      2. Issue Issue the following command to verify that no trusted context

      db2 => select * from syscat.surrogateauthids where trustedidtype=''C''

      and authenticate=''N'' and trustedID!=''SYSATSCONTEXT''

      3. Review any rows returned to ensure they are allowed by the SOP for performing

      a switch user without authentication.'
- id: 7.1.1
  title: Disable the Audit Buffer
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: Db2 can be configured to use an audit buffer where individual audit events are gathered into a large buffer
    to improve performance by reducing the number of writes to disk. It is recommended that the audit buffer be disabled by
    setting the size to 0.
  rationale: Increasing the audit buffer size to greater than 0 will allocate space for the audit records generated by the
    audit facility. At scheduled intervals, or when the audit buffer is full, the db2auditd audit daemon empties the audit
    buffer to disk, writing the audit records asynchronously. As the events are held in memory for some time before being
    written to disk, if the database server happened to crash those event would be lost. Setting the buffer size to 0 ensure
    events are written directly to disk.
  impact: Disabling the audit buffer may have noticeable impact on overall performance of the database server.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-audit-buf-sz-auditbuffer-size
  page_start: 404
  audit_raw: 'Perform the following to determine if the audit buffer is set as recommended:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate AUDIT_BUF_SZ value in the output:

    Audit buffer size (4KB) (AUDIT_BUF_SZ) = 0

    Ensure AUDIT_BUF_SZ is equal to 0.'
  remediation: 'Perform the following to disable the audit buffer:

    1. Attach to the Db2 instance

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => update database manager configuration using audit_buf_sz 0'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the audit buffer is set as recommended:

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command:

      db2 => get database manager configuration

      3. Locate AUDIT_BUF_SZ value in the output:

      Audit buffer size (4KB) (AUDIT_BUF_SZ) = 0

      Ensure AUDIT_BUF_SZ is equal to 0.'
    severity: medium
- id: 7.1.2
  title: Disable Limited Audit of Applications (DB2_LIMIT_AUDIT_APPS)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The DB2_LIMIT_AUDIT_APPS registry variable contains a list of application names that should not be audited.
    It is recommended that this variable should not be set and all applications should be audited. The DB2_LIMIT_AUDIT_APPS
    registry variable is not documented.
  rationale: The application name not to be audited is determined by the client and not validated by the server. It is possible
    for a malicious user to change their application name to avoid being audited.
  impact: ''
  references: []
  page_start: 406
  audit_raw: 'Perform the following to determine if the DB2_LIMIT_AUDIT_APPS registry variable is set:

    db2set -all | grep DB2_LIMIT_AUDIT_APPS

    The above command should not yield a value.'
  remediation: 'Perform the following command to remove any applications from the list:

    db2set DB2_LIMIT_AUDIT_APPS='
  checks:
  - type: command
    command: db2set -all | grep DB2_LIMIT_AUDIT_APPS
    expected: ''
    severity: medium
    info: 'Perform the following to determine if the DB2_LIMIT_AUDIT_APPS registry variable is set:

