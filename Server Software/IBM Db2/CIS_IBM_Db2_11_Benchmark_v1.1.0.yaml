  audit_raw: "1. Connect to the Db2 database.\ndb2 => connect to <dbname>\n2. Run the following command:\ndb2 => select tabschema,tabname,tbspace\
    \ from syscat.tables\n       where tabschema not in ('SYSIBM','SYSTOOLS')\n       and tbspace in ('SYSTOOLSPACE','SYSTOOLSTMPSPACE')\n\
    3. Review the list of system tablespaces. If the output is BLANK, that is considered a\nPass.\nPerform the following Db2\
    \ commands to obtain the value for this setting:\n1. Attach to the Db2 instance.\ndb2 => attach to <db2instance>\n2. Run\
    \ the following command:\ndb2 => get database manager configuration\n3. Locate the SRVCON_AUTH value in the output:\n\
    Server Connection Authentication (SRVCON_AUTH) = SERVER\nAny value other than CLIENT is acceptable.\nPerform the following\
    \ Db2 commands to obtain the value for this setting:\n1. Attach to the Db2 instance.\ndb2 => attach to <db2instance>\n\
    2. Run the following command:\ndb2 => get database manager configuration\n3. Locate the AUTHENTICATION value in the output:\n\
    Database manager authentication (AUTHENTICATION) = SERVER\nPerform the following Db2 commands to obtain the value for\
