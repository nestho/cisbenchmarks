    You can verify the permissions of the stash file via regular OS operations, such

    as ls -la on a Unix-type system.

    4. Check the OS permissions for the stash file.

    $ ls -la

    -rw------- 1 db2inst1 db2inst1 129 May 19 11:44 keystore.sth'
  remediation: 'Change the permissions for the file:

    $ chmod 600 keystore.sth'
  checks:
