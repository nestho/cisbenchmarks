- id: 6.4.1
  title: Ensure Trusted Contexts are Enabled
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: A Trusted Context object provides a means of enforcing encryption, assigning privileges based on roles, and
    ensuring that the actions performed on behalf of a user are performed in the context of the user’s ID and privileges.
  rationale: Creating Trusted Context objects to enforce encryption and assign roles will protect data in transit and limit
    access to information on a per user/role basis. Additionally, it ensures actions can be traced back to the user.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=connections-trusted-contextstrusted
  page_start: 401
  audit_raw: 'Issue the following command to verify that a Trusted Context object is enabled:

    db2 => select contextname, enabled from syscat.contexts where enabled = ''Y'''
  remediation: 'If there is no enabled Trusted Context object, create a Trusted Context object if needed

    and enable it.'
