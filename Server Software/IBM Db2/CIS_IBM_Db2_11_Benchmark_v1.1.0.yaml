- id: 4.5.3
  title: Review System Tablespaces
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: 'System tablespaces store all system object data within that database. It is recommended that system tablespaces
    are used to store system data only and not user data. Only certain table spaces can be used to hold user tables. This
    parameter can take on any of the following values: • NOT_SPECIFIED • CLIENT • SERVER • SERVER_ENCRYPT • KERBEROS • KRB_SERVER_ENCRYPT
    • GSSPLUGIN • GSS_SERVER_ENCRYPT • SERVER_ENCRYPT_TOKEN • KERBEROS_TOKEN • GSSPLUGIN_TOKEN • KRB_SVR_ENC_TOKEN • GSS_SVR_ENC_TOKEN
    If this parameter is set to NOT_SPECIFIED, then the type of authentication for connections is determined by the AUTHENTICATION
    parameter. Recommendations: 1. Do not use CLIENT authentication type. 2. SERVER_ENCRYPT instead of SERVER is recommended
    as a compensating configuration if TLS cannot be used to encrypted client server communications. The AUTHENTICATION database
    manager configuration parameter specifies how and where authentication takes place for incoming connections to the database
    as well as local authorization of commands run outside a connection or attachment, such as tools run from the command
    line. This parameter can be overridden by the SRVCON_AUTH parameter for incoming connections. This parameter can take
    on any of the following values: • CLIENT • SERVER • SERVER_ENCRYPT • DATA_ENCRYPT • DATA_ENCRYPT_CMP • KERBEROS • KRB_SERVER_ENCRYPT
    • GSSPLUGIN • GSS_SERVER_ENCRYPT Recommendations: 1. Do not use CLIENT, DATA_ENCRYPT or DATA_ENCRYPT_CMP authentication
    types. 2. SERVER_ENCRYPT instead of SERVER is recommended as a compensating configuration if TLS cannot be used to encrypted
    client server communications. The ALTERNATE_AUTH_ENC database manager configuration parameter specifies the encryption
    algorithm that is used to encrypt user ID and password that are sent from the client during a connect or attach. This
    parameter is in effect when the authentication method that is negotiated between the client and the server is SERVER_ENCRYPT.
    It is recommended to set this parameter to AES_ONLY. This database manager configuration parameter is only active when
    the authentication parameter is set to CLIENT which is not a recommended setting as discussed in the [authentication parameter
    section](#specify-a-secure-authentication-typeauthentication). If the parameter is set to YES, the server assumes that
    the client side is handling authentication to the database. If the parameter is set to NO, the client must provide authentication
    to the server on behalf of the user. The recommended value for this parameter is NO. This database manager configuration
    parameter is only active when the authentication parameter is set to CLIENT which is not a recommended setting as discussed
    in the [authentication parameter section](#specify-a-secure-authentication-typeauthentication). If the parameter is set
    to CLIENT, the user ID and password are not needed, but if they are provided, authentication will occur at the client.
    If the parameter is set to SERVER, the user ID and password are needed and will be authenticated at the server. The recommended
    value for this parameter is SERVER. The FED_NOAUTH database manager configuration parameter determines whether federated
    authentication will be bypassed at the instance. If this parameter is set to YES, the AUTHENTICATION parameter is set
    to SERVER or SERVER_ENCRYPT and the FEDERATED parameter is set to YES, then authentication at the instance is bypassed
    and is instead assumed to be performed at the data source. It is recommended to set this parameter to NO. The following
    database manager configuration parameters allow the use of custom plugins for authentication and group lookup purposes.
    • CLNT_PW_PLUGIN • CLNT_KRB_PLUGIN • GROUP_PLUGIN • LOCAL_GSSPLUGIN • SRVCON_GSSPLUGIN_LIST • SRVCON_PW_PLUGIN The permissions
    on the plugins specified by any of the above parameters should be secured so that users other than the instance owner
    don''t have write privileges. The DB2_GRP_LOOKUP registry variable specifies which Windows security mechanism is used
    to enumerate the groups that a user belongs to. Periodic review of this variable is required to ensure that the correct
    location is being used for group definitions during authentication. This registry variable is only active is the authentication
    parameter is set to CLIENT which is not a recommended setting as discussed in section 6.2. It is possible to have a user
    id be represented across multiple domains. Issues could arise when trying to authenticate such a user id. To prevent these
    issues, a listing of domains should be defined within the DB2DOMAINLIST registry variable. Periodic review of the domain
    list assigned to the DB2DOMAINLIST registry variable helps ensure that non-essential domains do not have unnecessary authorizations.
    The DB2AUTH registry variable is used to control various authentication related behaviors in Db2. The following settings
    are recommended for this registry variable: 1. Use DISABLE_CHGPASS which disables the ability to change a user''s password
    from the client. 2. Use JCC_ENFORCE_SECMEC which enforces that the Db2 server does not accept a clear text password security
    mechanism when using SERVER_ENCRYPT authentication type. 3. If CLIENT authentication is being used which is not recommended
    as discussed in section 6.2, it is also recommended to set this registry variable to TRUSTEDCLIENT_SRVENC and not TRUSTEDCLIENT_DATAENC.
    TRUSTEDCLIENT_SRVENC forces untrusted clients to use SERVER_ENCRYPT authentication type while TRUSTEDCLIENT_DATAENC forces
    them to use DATA_ENCRYPT. If DB2AUTH is not set to DISABLE_CHGPASS, refer to the DB2CHGPWD_EEE registry variable section
    which specifies whether users are able to change passwords through Db2 in a partitioned database environment. The DB2CHGPWD_EEE
    registry variable specifies whether users are able to change passwords through Db2 in a partitioned database environment.
    It is recommended to set this variable to NO.'
  rationale: Users should not have privileges to create user data objects within the system tablespaces. User data objects
    created within the system tablespaces should be removed. When using CLIENT authentication type, the server trusts the
    client to authenticate the connecting user. A malicious user can connect to the database as any user including a database
    administrator by simply creating that user on the client system. When using SERVER authentication type without SSL enabled,
    the user ID and password that are sent from the client to the server during a connect or an attach are in plaintext format.
    Therefore, these credentials are exposed when sent across an unsecure network and can be intercepted by a malicious user.
    When using CLIENT authentication type, the server trusts the client to authenticate the connecting user. A malicious user
    can connect to the database as any user including a database administrator by simply creating that user on the client
    system. DATA_ENCRYPT and DATA_ENCRYPT_CMP authentication types provide the ability to encrypt both user credentials and
    user data when sent from the client to the server. Since these authentication types use DES encryption algorithm which
    is cryptographically weak, they are deprecated in favor of SSL. When using SERVER authentication type without SSL enabled,
    the user ID and password that are sent from the client to the server during a connect or an attach are in plaintext format.
    Therefore, these credentials are exposed when sent across an insecure network and can be intercepted by a malicious user.
    If this parameter is set to a value other than AES_ONLY, the server can accept the DES encryption algorithm to encrypt
    the user credentials and DES is cryptographically weak in comparison to AES. If the server trusts the client to authenticate
    the connecting user, a malicious user can connect to the database as any user including a database administrator by simply
    creating that user on the client system. If the server trusts the client to authenticate the connecting user, a malicious
    user can connect to the database as any user including a database administrator by simply creating that user on the client
    system. Setting FED_NOAUTH to NO will ensure that authentication is not bypassed for any users that are connecting to
    the instance. If a malicious user has write access to a plugin, they can overwrite it with their own thereby manipulating
    the authentication and authorization behavior for connecting users. Incorrectly configured DB2_GRP_LOOKUP registry variable
    could result in unexpected authorization behavior where a low privileged user could potentially get access to sensitive
    data. Incorrectly configured DB2DOMAINLIST registry variable could result in unexpected authorization behavior where a
    low privileged user could potentially get access to sensitive data. 1. Allowing a client to change a user's password through
    Db2 commands is not recommended since Db2 may not enforce the expected password change rules. In addition, the password
    change requests going through Db2 may not be audited as expected. 2. Plain text passwords sent across an unsecure network
    are exposed and can be intercepted by a malicious user. 3. DATA_ENCRYPT is deprecated since it uses DES encryption algorithm
    which is cryptographically weak. Furthermore, enforcing SERVER_ENCRYPT ensures that the user ID and password are encrypted
    when sent from the client to the server. If password management in the partitioned database environment is not centralized,
    then it could result in a situation where one partition has the updated password for a given user while the rest have
    the old password which is a security risk.
  impact: It is important to be aware that the implementation of this recommendation results in a brief downtime. It is advisable
