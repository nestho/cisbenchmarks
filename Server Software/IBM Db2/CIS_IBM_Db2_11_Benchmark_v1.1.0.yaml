- id: 6.1.8
  title: Secure DATAACCESS Authority
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Grants the authority to access data. The DATAACCESS authority allows the grantee to leverage DML level commands
    i.e. SELECT, INSERT, UPDATE, DELETE, LOAD, and EXECUTE any package or routine. The DATAACCESS authority cannot be granted
    to PUBLIC.
  rationale: The DATAACCESS authority gives the grantee read access and also control over manipulating the data. DATAACCESS
    can be granted to users, groups, or roles, but not PUBLIC. DATAACCESS authority is a subset of the DBADM authority and
    can be granted by the SECADM authority.
