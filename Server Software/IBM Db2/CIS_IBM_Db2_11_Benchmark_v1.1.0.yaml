- id: 7.1.3
  title: Ensure Audit Policies are Enabled Within the Database
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Creating and applying audit policies is crucial for securing and discovering issues within your databases.
    Audit policies can help trigger events for changes to data objects, table DML, and user access.
  rationale: If audit policies are not enabled, issues may go undiscovered, and compromises and other incidents may occur
    without being quickly detected. It may also not be possible to provide evidence of compliance with security laws, regulations,
    and other requirements.
  impact: Auditing all categories within the database can have an impact on the peformance of the database server depending
    on the workload and number of transactions. If enabling audit as part of the remedation, analysis should be performed
    on which categories are required to meet business needs.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=statements-create-audit-policy
  - 2. https://www.ibm.com/docs/en/db2/11.5?topic=statements-audit
  page_start: 407
  audit_raw: '1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Issue the following command to ensure that at least one audit policy exists and

    has been associated with an object. The SYSCAT.AUDITUSE catalog view

    shows all of the audit policies that have been associated with auditing an object

    within the database.

    db2=> select * from syscat.audituse

    3. If there is at least 1 row then it is considered a Pass. If there are zero rows

    returned then nothing is being audited within the database and the remediation

    steps should be followed.'
  remediation: '1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Issue the following command to create an audit policy. This policy audits all

    categories. An analysis should be performed to determine which categories are

    required to meet business needs.

    db2 => create audit policy AUDITDB CATEGORIES ALL STATUS BOTH ERROR

    TYPE AUDIT

    3. Audit the database using the policy just created with the following command:

    db2 => audit database using policy AUDITDB'
  checks:
  - type: sql
    command: select * from syscat.audituse
    severity: medium
    info: '1. Connect to the Db2 database.

      db2 => connect to <dbname>

      2. Issue the following command to ensure that at least one audit policy exists and

      has been associated with an object. The SYSCAT.AUDITUSE catalog view

      shows all of the audit policies that have been associated with auditing an object

      within the database.

      db2=> select * from syscat.audituse

      3. If there is at least 1 row then it is considere'
