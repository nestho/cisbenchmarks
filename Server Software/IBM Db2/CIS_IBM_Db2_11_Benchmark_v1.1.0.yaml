- id: 3.3.2
  title: Secure the Database Container Directory
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: A Db2 database container is the physical storage of the data.
  rationale: The containers are needed for the database to operate properly. The loss of the containers can cause down time.
    Also, allowing excessive access to the containers may help an attacker to gain access to their contents. Therefore, secure
    the location(s) of the containers by restricting the access and ownership. Allow only the instance owner to have access
    to the tablespace containers.
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'Review all users that have access to the directory of the containers. On Linux and AIX

    ensure that only the instance owner has access to the directory of the containers and

    the container files themselves. On Windows only administrators, and if extended

    security is enabled, members of the DB2ADMINS group should have access to the

    directory of the containers and the container files. No other users should have access.'
  remediation: 'On Linux and AIX, set the privileges for the directory of the containers so that only the

    instance owner has full access, and all other users have no access.

    On Windows, set the privileges for the directory of the containers and the container files

    so that only administrators, and if extended security is enabled members of the

    DB2ADMINS group, have full access, and all other users have no access.'
  checks:
  - type: manual_review
    info: 'Review all users that have access to the directory of the containers. On Linux and AIX

      ensure that only the instance owner has access to the directory of the containers and

      the container files themselves. On Windows only administrators, and if extended

      security is enabled, members of the DB2ADMINS group should have access to the

      directory of the containers and the container files. No other users should have access.'
    severity: medium
