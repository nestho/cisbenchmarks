- id: 8.2.7
  title: Backup Your Keystore
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: The keystore stores encryption keys used to encrypt your database. Losing the key will make the data inaccessible.
    If the keystore with encryption keys is lost, there is no way to decrypt the data.
  rationale: The contents of your keystore are critical and it is important that you back up the keystore at regular intervals.
    Backups should be done whenever the contents of the keystore changes, such as when a key or certificate is added, a master
    key (MK) is rotated, or the password is changed. For local keystore files, the configuration file is not included as part
    of a Db2 database backup and must be backed up manually. For a centralized keystore, consult the documentation for your
    keystore product to understand their recommendations for keystore backups.
  impact: ''
  references: []
  page_start: 443
  audit_raw: 'Check that you are backing up your keystore regularly. Keep in mind that even if the

    encryption key has been rotated, logs may still need access to the old key. Do not

    delete keys.'
  remediation: Regularly backup your keystore and stash files, using mechanisms outside of Db2.
  checks:
  - type: manual_review
    info: 'Check that you are backing up your keystore regularly. Keep in mind that even if the

      encryption key has been rotated, logs may still need access to the old key. Do not

      delete keys.'
    severity: medium
- id: 8.2.8
  title: Backup Your Password In Case Stash File is Inaccessible or Corrupted
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: If the keystore is inaccessible, there is no way to decrypt the data in the database. Therefore, protecting
    and backing up the password to the keystore is important to avoid data loss.
  rationale: Ensure that you back up your passwords, in addition to using a stash file. This applies particularly to the password
    used for a local keystore file. Should your stash file ever become corrupted, you will need to manually supply the password.
    If you forget the password, and do not created a backup, access to your keys and data is lost.
  impact: ''
  references: []
  page_start: 444
  audit_raw: Store the password in a safe place, like other similar passwords.
  remediation: You may use a password manager to store the password in a secure manner.
  checks:
  - type: manual_review
    info: Store the password in a safe place, like other similar passwords.
    severity: medium
- id: 8.2.9
  title: Rotate the Master Key
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Key rotation refers to the process of changing encryption keys and is often required for compliance purposes.
    Similar to a password change, key rotation is done to reduce the risk that can come from exposure of the key, while it
    exists. Since the DEK used by Db2 for encryption is never outside of the encrypted database, backup, or transaction log,
    there is little risk of exposure. The same is not true for the MK, which lives outside of the database. The rotation of
    the MK does not affect the encryption of the DEK within existing backups or archived transaction logs. The master key
    (MK) should be rotated based on the frequency needed for compliance. Rotating MK requires decrypting any DEK encrypted
    with the old MK and then reencrypting it with the new MK. The data is encrypted with a DEK and does not get reencrypted.
    The ALLOW_KEY_INSERT_WITHOUT_KEYSTORE_BACKUP setting in ekeystore.cfg file for external key managers (KMIP or PKCS11)
    allows writing to the keystore. The setting is false by default. Check that the setting has not been turned on.
  rationale: Consider rotating the MK as being similar to changing passwords every X number of days. You may also have external
    requirements to rotate the MK after a certain period of time. Keeping the setting as false does not allow Db2 to create
    master keys. If you choose to turn the setting on, you acknowledge that Db2 does not backup changes to the keystore. Always
    backup your keystore before making changes.
  impact: ''
  references: []
  page_start: 445
  audit_raw: 'Check the current database is encryption settings:

    db2 => SELECT * FROM TABLE(SYSPROC.ADMIN_GET_ENCRYPTION_INFO())

    You must be connected to the database to run this command. The following information

    will be shown for the connected database:

    • OBJECT_NAME

    • OBJECT_TYPE

    • ALGORITHM

    • ALGORITHM_MODE

    • KEY_LENGTH

    • MASTER_KEY_LABEL KEYSTORE_NAME KEYSTORE_TYPE

    • KEYSTORE_HOST KEYSTORE_IP

    • KEYSTORE_IP_TYPE

    • PREVIOUS_MASTER_KEY_LABEL AUTH_ID

    • APPL_ID

    • ROTATION_TIME

    Check that ekeystore.cfg file that''s being used has the setting turned OFF.

    ALLOW_KEY_INSERT_WITHOUT_KEYSTORE_BACKUP=false'
  remediation: 'The SYSPROC.ADMIN_ROTATE_MASTER_KEY procedure can be used to change the database

    key to comply with key rotation requirement. You must be connected to the database to

    run this command.

    db2 => CALL SYSPROC.ADMIN_ROTATE_MASTER_KEY(''newMasterKeyLabel'')

    Db2 will automatically generate the new MK and label unless you provide a MK label for

    an existing MK. Key rotation is logged in the db2diag.log file:

    $ grep –A 3 "Key Rotation" ~/sqllib/db2dump/db2diag.log

    Key Rotation successful using label:

    DATA #2 : String, 46 bytes

    DB2_SYSGEN_db2inst1_SECRET_2021-04-29-11.22.01

    The DEK is not externalized and does not need to be rotated. However, if you wish to

    rotate the DEK you can take an offline backup and restore to a new encrypted

    database, thus generating a new DEK.

    $ cat ekeystore.cfg

    VERSION=1

    PRODUCT_NAME=Luna

    ALLOW_KEY_INSERT_WITHOUT_KEYSTORE_BACKUP=false

    LIBRARY=/usr/safenet/lunaclient/luna6.1/lib/libCryptoki2_64.so

    SLOT_LABEL=DB2Partition

    NEW_OBJECT_TYPE=PRIVATE

    KEYSTORE_STASH=/home/db2inst1/sqllib/security/pkcs11.sth

    For maximum security, turn the setting off and create the keys outside of Db2. This way

    you will also be able to manage the labeling scheme across the Db2 instances and

    prevent name collision between different databases.'
  checks:
  - type: sql
    command: SELECT * FROM TABLE(SYSPROC.ADMIN_GET_ENCRYPTION_INFO())
    severity: medium
    info: 'Check the current database is encryption settings:

      db2 => SELECT * FROM TABLE(SYSPROC.ADMIN_GET_ENCRYPTION_INFO())

      You must be connected to the database to run this command. The following information

      will be shown for the connected database:

      • OBJECT_NAME

      • OBJECT_TYPE

      • ALGORITHM

      • ALGORITHM_MODE

      • KEY_LENGTH

      • MASTER_KEY_LABEL KEYSTORE_NAME KEYSTORE_TYPE

      • KEYSTORE_HOST KEYSTORE_IP

      • KEYSTORE_IP'
- id: 8.2.11
  title: Keep Master Key Labels Unique
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Db2 uses the MK label to uniquely identify each MK, and stores the label value in each encrypted object, be
    it a database, transaction log, or backup file. This stored MK label value identifies the MK key material that is used
    to decrypt the data in the object. Creating MK labels is part of an organizations standard operating procedures (SOP).
  rationale: It is critical to use unique MK labels across the organization to avoid duplication. If unique labels are not
    used, access to encrypted data can be lost through human error. Access to encrypted data is lost when the key that is
    retrieved from the keystore for a label is different from the key that was used to encrypt the database using the same
    label. It may not be possible to migrate databases using a local keystore file to a centralized keystore file if multiple
    databases are using the same master key label, but different master keys associated with that label.
  impact: ''
  references: []
  page_start: 448
  audit_raw: 'Check the organization''s SOP for creating master key labels to ensure it includes

    specific guidance on creating unique master key labels.'
  remediation: Update the SOP to provide guidance found missing during the audit.
  checks:
  - type: manual_review
    info: 'Check the organization''s SOP for creating master key labels to ensure it includes

      specific guidance on creating unique master key labels.'
    severity: medium
- id: 8.2.12
  title: Retain All Master Keys
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Master keys are needed to access the DEKs that are stored in encrypted databases, transaction logs, and backup
    images. Since multiple MKs can exist over the life time of these objects, it is necessary to retain them all while the
    encrypted data is retained. If a MK is lost, the encrypted data in the object cannot be retrieved. An organizations standard
    operating procedures (SOP) should have a methodology for tracking what data is encrypted with a specific master key, and
    be consulted before any master keys are archived.
  rationale: Any failure or human error in tracking what data encrypted with a specific master key could result in loss of
    access to that data should the master key be deleted. Master keys should not be deleted. Instead they should be archived
    to a secure location for long term storage in case they are required at some point in the future.
  impact: ''
  references: []
  page_start: 449
  audit_raw: 'Check the organization''s SOP for specific instructions on tracking what data is

    encrypted with a particular master key, and that there are details on how to archive a

    master key for long term storage. Ensure the SOP clearly states master keys should

    never be deleted.'
  remediation: Update the SOP to provide guidance found missing during the audit.
  checks:
  - type: manual_review
    info: 'Check the organization''s SOP for specific instructions on tracking what data is

      encrypted with a particular master key, and that there are details on how to archive a

      master key for long term storage. Ensure the SOP clearly states master keys should

      never be deleted.'
    severity: medium
- id: 8.2.13
  title: Set CFG Values in a Single Command
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Db2 uses KEYSTORE_TYPE and KEYSTORE_LOCATION to access the keystore.
  rationale: Although the Db2 database manager configuration parameters KEYSTORE_TYPE and KEYSTORE_LOCATION are configurable
    online, you should set them in the a single DB2 UPDATE DBM CFG command. Otherwise, Db2 might attempt to access the keystore
    between the updates and report an access error.
  impact: ''
  references: []
  page_start: 450
  audit_raw: 'You can check what values you have set for these parameters as follows:

    $ db2 get dbm cfg | grep KEYSTORE

    Keystore type (KEYSTORE_TYPE) = PKCS12

    Keystore location (KEYSTORE_LOCATION) = /path/to/file.p12'
  remediation: "You can execute the following command to change the values in one line:\ndb2 => update dbm cfg using keystore_type\
    \ pkcs12\n       keystore_location /path/to/file.p12;\nDB20000I The UPDATE DATABASE MANAGER CONFIGURATION command completed\n\
    successfully."
  checks:
  - type: command
    command: $ db2 get dbm cfg | grep KEYSTORE
    expected: ''
    severity: medium
    info: 'You can check what values you have set for these parameters as follows:

      $ db2 get dbm cfg | grep KEYSTORE

      Keystore type (KEYSTORE_TYPE) = PKCS12

      Keystore location (KEYSTORE_LOCATION) = /path/to/file.p12'
- id: 8.2.14
  title: Key Rotation in HADR Environment
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  - Level 1 - RDBMS
  description: Some additional considerations are needed when working in an HADR environment. A key rotation on the primary
    database in an HADR environment drives a key rotation automatically on the standby. The change, however, does not occur
    until other log records are sent to the standby database. If you want to force the rotated key to the standby, the archive
    log command can be used to generate the log records that are needed to replay the rotation on the standby. The Db2 database
    instance will execute under the context of a given security principle. It is recommended that this service have the least
    privileges possible. Furthermore, it is advisable to have the Db2 service executed using the Db2 instance owner and monitor
    such accounts for unauthorized access to the sensitive data. Backup redundancy ensures that multiple instances of database
    backups exist. Backups of your database should be stored securely in a location with full access for administrators, read
    and execute access for group, and no access for users.
  rationale: 'When the MK is rotated, the database begins to use the new key immediately, but access to the old MK value is
    still needed in the following scenarios: • Transaction log files that have not been reused since the key rotation • Archived
    encrypted transaction log files that used the previous MK value • Encrypted backup images that used the previous MK value
    Do not delete an MK from the keystore unless you are certain it is no longer referenced by any encrypted object on any
    of the hosts of the HADR environment. When using a local keystore file, you need to provide an identical copy of the keystore
    at each Db2 member that is associated with the database. If you choose to use a shared file system, ensure that network
    access is maintained for that file system while Db2 is actively working with the encrypted database. In an HADR setup,
    you should copy the keystore containing the encryption keys between the hosts. Leveraging a least privilege account for
    the Db2 service will reduce an attacker''s ability to compromise the host operating system should the Db2 service process
    become compromised. Maintaining redundant copies of database backups will increase business continuity capabilities should
    a Db2 service failure coincide with a corrupt backup. Backups may contain sensitive data that attackers can use to retrieve
    valuable information about the organization.'
  impact: ''
  references: []
  page_start: 451
  audit_raw: 'You can check what values you have set for these parameters as follows on each

    HADR member:

    db2 => get dbm cfg | grep KEYSTORE

    Keystore type (KEYSTORE_TYPE) = PKCS12

    Keystore location (KEYSTORE_LOCATION) = /path/to/file.p12

    We recommend you use a centralized key manager for HADR environments.

    Review all accounts that have access to the Db2 database service to ensure least

    privilege is applied.

    Review the replication of your backups based on organization policy.

    Review the privileges applied to your backups.'
  remediation: 'Retain all Master Keys until you are certain they are not use on any of the hosts in an

    HADR environment.

    The same DEK and master key is used on all members in a DPF or pureScale

    deployment and each member requires access to the keystore to access master keys,

    which can be a shared file.

    9 Additional Considerations

    This section provides additional considerations on protecting and maintaining the

    database instance.

    9.1 Leverage the Least Privilege Principle (Manual)

    Ensure that all accounts have the absolute minimal privilege granted to perform their

    tasks.

    Define and implement a process to replicate your backups onto multiple locations.

    Define a security policy for all backups that specifies the privileges they should be

    assigned.'
