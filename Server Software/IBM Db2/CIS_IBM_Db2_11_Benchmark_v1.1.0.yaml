- id: 6.1.5
  title: Secure SECADM Authority
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The SECADM (security administrator) role grants the authority to create, alter (where applicable), and drop
    roles, trusted contexts, audit policies, security label components, security policies and security labels. It is also
    the authority required to grant and revoke roles, security labels and exemptions, and the SETSESSIONUSER privilege. SECADM
    authority has no inherent privilege to access data stored in tables. It is recommended that the SECADM role be granted
    to authorized users only.
  rationale: If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality,
    integrity, and availability of data in the Db2 instance will be at increased risk.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=authorities-security-administrationauthority-secadm
  page_start: 350
  audit_raw: "Perform the following Db2 commands to obtain the value for this setting:\n1. Connect to the Db2 database.\n\
    db2 => connect to <dbname>\n2. Run the following command:\ndb2 => select distinct grantee, granteetype from syscat.dbauth\n\
    \       where securityadmauth = 'Y'\n3. Review the list of users, groups, and roles in the above output to ensure only\n\
    approved users, groups, and roles are assigned."
  remediation: 'Revoke this permission from any unauthorized users.

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => REVOKE SECADM ON DATABASE FROM USER <username>'
  checks:
  - type: sql
    command: select distinct grantee, granteetype from syscat.dbauth
    severity: medium
    info: "Perform the following Db2 commands to obtain the value for this setting:\n1. Connect to the Db2 database.\ndb2\
      \ => connect to <dbname>\n2. Run the following command:\ndb2 => select distinct grantee, granteetype from syscat.dbauth\n\
      \       where securityadmauth = 'Y'\n3. Review the list of users, groups, and roles in the above output to ensure only\n\
      approved users, groups, and roles are assigned."
