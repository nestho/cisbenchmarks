- id: 6.1.9
  title: Secure ACCESSCTRL Authority
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: ACCESSCTRL authority is the authority required to grant and revoke privileges on objects within a specific
    database. Some of these privileges include BINDADD, CONNECT, CREATETAB, CREATE_EXTERNAL_ROUTINE, LOAD, and QUIESCE_CONNECT.
    It has no inherent privilege to access data stored in tables, except the catalog tables and views. The ACCESSCTRL authority
    cannot be granted to PUBLIC.
  rationale: The ACCESSCTRL authority gives the grantee access control to a specified database. With this authority, the grantee
    can grant/revoke privileges to other users. ACCESSCTRL can be granted to users, groups, or roles, but not PUBLIC. ACCESSCTRL
    authority can only be granted by the SECADM authority.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=authorities-access-controlauthority-accessctrl
  page_start: 358
