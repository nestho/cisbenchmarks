- id: 4.1.1
  title: Creating the Database Without PUBLIC Grants (RESTRICTIVE)
  scoring: scored
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  - Level 1 - RDBMS
  description: This parameter indicates whether the database was created with the RESTRICTIVE clause in the CREATE DATABASE
    statement. When creating a database, the use of the RESTRICTIVE clause will cause certain privileges to be revoked from
    PUBLIC. The ARCHRETRYDELAY parameter specifies the number of seconds the Db2 service will wait before it reattempts to
    archive log files after a failure. It is recommended that this parameter be set anywhere in the range of 10-30. You do
    not want the delay to be so short that the database ends up in a denial of service scenario, but you don't want the delay
    to be too long if an outside attack happens at the same time. The AUTORESTART parameter specifies if the database manager
    will start a crash recovery automatically when the first user tries to connect to a database which has previously terminated
    abnormally. If the parameter is set to OFF an explicit RESTART DATABASE command has to be issued to initiate a crash recovery.
    It is recommended that this parameter is set to ON (which is also the default).
  rationale: Ensure that the value is non-zero, otherwise archive logging will not retry after the first failure. A denial
    of service attack can render the database without an archive log if this setting is not set. An archive log will ensure
    that all transactions can safely be restored or logged for auditing. Setting the database to auto-restart will reduce
    the downtime of the database.
  impact: Allowing the default privileges granted to the group PUBLIC to remain in tack can have negative impacts on the database
    as well as undermine measures put in place to limit access to authorized users.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=commands-create-database
  - 2. https://www.ibm.com/docs/en/db2/11.5?topic=ownership-default-privilegesgranted-creating-database
  page_start: 72
  audit_raw: 'Perform the following Db2 commands to determine if the database was created with the

    RESTRICTIVE clause.

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => select value from sysibmadm.dbcfg where name = ''restrict_access''

    If the value is YES then this is a Pass. Otherwise the database was not created with the

    RESTRICTIVE clause.

    Perform the following Db2 commands to obtain the value for this setting:

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the ARCHRETRYDELAY value in the output:

    Log archive retry Delay (secs) (ARCHRETRYDELAY) = 20

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the AUTORESTART value in the output:

    Auto restart enabled (AUTORESTART) = ON'
  remediation: 'There is no remediation for this parameter due to the fact that the placement of the

    RESTRICTIVE clause happens within the CREATE DATABASE statement. Unless your

    backup strategies allow for a complete overhaul of your environment where you are

    able to recreate the database with the RESTRICTIVE clause, we do not recommend

    changing this parameter. However, if you would like to align your database configuration

    to that which the RESTRICTIVE clause would provide, please ensure the following:

    1. SYSCAT.DBAUTH – Ensure PUBLIC is NOT granted the following authorities:

    o CREATETAB

    o BINDADD

    o CONNECT

    o IMPLICIT_SCHEMA

