    \ groups, and roles are assigned."
  remediation: 'Revoke ACCESSCTRL authority from any unauthorized users.

    db2 => REVOKE ACCESSCTRL ON DATABASE FROM USER <username>'
  checks:
  - type: sql
    command: select distinct grantee, granteetype from syscat.dbauth
    severity: medium
    info: "1. Run the following command:\ndb2 => select distinct grantee, granteetype from syscat.dbauth\n       where accessctrlauth\
