  description: Auditing is crucial for securing and discovering issues within your databases. Auditing can help trigger events
    for changes to data objects, table DML, and user access.
  rationale: If instance auditing is not enabled, issues may go undiscovered, and compromises and other incidents may occur
    without being quickly detected. It may also not be possible to provide evidence of compliance with security laws, regulations,
    and other requirements.
  impact: ''
  references:
