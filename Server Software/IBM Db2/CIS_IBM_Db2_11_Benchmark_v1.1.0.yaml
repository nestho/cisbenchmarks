- id: 6.1.17
  title: Secure SETSESSIONUSER Privilege
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The SETSESSIONUSER privilege allows one user to switch the session authorization ID of the connection to another
    user. This allows one user to run SQL statements as another user. It is recommended that Trusted Context be used as a
    stronger assertion of user identity where such a feature is required.
  rationale: A user can switch their identity to another user for whom they have been authorized and run SQL statements as
    that user.
  impact: ''
  references:
