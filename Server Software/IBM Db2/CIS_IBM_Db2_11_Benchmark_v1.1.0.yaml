  title: Secure Permissions for the Primary Archive Log Location (LOGARCHMETH1)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The LOGARCHMETH1 parameter specifies the type of media and the location used as the primary destination of
    archived logs. It is recommended that the directory used for the archived logs be set to full access for Db2 administrator
    accounts and read and execute for all other accounts.
  rationale: Restricting access to the contents of the primary archive log directory will help ensure that the confidentiality,
    integrity, and availability of archive logs are protected. Although there are many ways to ensure that your primary logs
    will be archived, we recommend using the value of DISK as part of the LOGARCHMETH1 parameter. This will properly ensure
