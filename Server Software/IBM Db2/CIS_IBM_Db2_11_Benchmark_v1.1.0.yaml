      3. Locate the NUM_DB_BACKUPS value in the output:

      Number of database backups to retain (NUM_DB_BACKUPS) = 12

      Perform the following Db2 commands to obtain the value for this setting:

      1. Connect to the Db2 database.

      db2 => connect to <dbname>

      2. Run the following command:

      db2 => get database configuration'
    severity: medium
- id: 4.1.13
  title: Ensure a Secure Connect Procedure is Used (CONNECT_PROC)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The CONNECT_PROC stored procedure runs as part of every connection to the database and allows customization
    of the application environment, such as setting special registers. It could for example, set the CURRENT_PATH special
    register which controls the search path for finding functions and procedures to execute. Only an authorized procedure
    should be used.
  rationale: The CONNECT_PROC procedure could be used to modify the application environment within the connection causing
    unexpected behavior.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-connect-proc-connectprocedure-name-database
  - 2. https://www.ibm.com/docs/en/db2/11.5?topic=databases-customizingapplication-environment-using-connect-procedure
