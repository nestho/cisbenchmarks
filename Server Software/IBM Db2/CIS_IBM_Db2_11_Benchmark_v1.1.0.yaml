- id: 8.2.4
  title: Secure the Stash File
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: A stash file is an obfuscated file that contains the credentials that are needed to access the keystore. If
    a keystore password was not provided during db2start, the password will be retrieved from the stash file. A stash file
    is created when -stash command is used during the creation of the keystore.
  rationale: Set this file to be readable by only the Db2 instance owner. If this file is not secured, an attacker may delete
    it, causing potential interruption of operations.
  impact: ''
  references:
  - 1. https://www.ibm.com/support/pages/internal-format-gskit-stash-files-has-changed
  page_start: 439
