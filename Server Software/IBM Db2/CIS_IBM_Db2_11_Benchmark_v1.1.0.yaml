- id: 8.1.10
  title: Enable TLS Communication Between HADR Primary and Standby Instances (HADR_SSL_LABEL)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The HADR_SSL_LABEL database configuration parameter controls whether connections between HADR peers are encrypted,
    and which certificate is served to an HADR peer when establishing an HADR connection. The DB2COMM registry variable controls
    what types of remote connections Db2 will accept. It can be configured to enable plaintext communication, encrypted communication,
    or both.
  rationale: To protect database data and log records when they are sent from a primary database to a standby database, the
    HADR_SSL_LABEL database configuration should be set. For security, DB2COMM should be set to enable only TLS encrypted
    communications.
  impact: ''
  references: []
  page_start: 429
  audit_raw: 'Perform the following to determine if the HADR_SSL_LABEL is set. These steps should be

    performed on the primary database and any standby databases.

    1. As the instance owner, run the following command.

    db2 => get db cfg for <database>

    2. Locate the value of HADR_SSL_LABEL in the output:

    HADR SSL certificate label (HADR_SSL_LABEL) =

    Perform the following to determine if DB2COMM is set.

    1. As the instance owner, run the following command.

    db2set -all DB2COMM

    2. The value of DB2COMM will be returned in the output. If the DB2COMM registry

    variable is not set, the db2set command will not return any data.

    [i] TCPIP'
  remediation: 'Perform the following steps on both the primary and any standby databases to enable

    TLS encrypted HADR. A server side keystore and stash file

    (SSL_SVR_KEYDB/SSL_SVR_STASH) must be configured to enable TLS encrypted HADR

    communication:

    • Run the following command as the instance owner.

    db2 => update db cfg for <database> using HADR_SSL_LABEL <label>

    Replace <label> with the name of a certificate present in the server-side keystore

    (SSL_SVR_KEYDB).

    If it is active, HADR must be recycled for changes to the HADR_SSL_LABEL registry

    variable to take effect.

    Perform the following to set DB2COMM and enable TLS:

    1. Run the following command as the instance owner.

    db2set DB2COMM=SSL

    Db2 must be recycled (db2stop/db2start) for changes to the DB2COMM registry variable to

    take effect.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the HADR_SSL_LABEL is set. These steps should be

      performed on the primary database and any standby databases.

      1. As the instance owner, run the following command.

      db2 => get db cfg for <database>

      2. Locate the value of HADR_SSL_LABEL in the output:

      HADR SSL certificate label (HADR_SSL_LABEL) =

      Perform the following to determine if DB2COMM is set.

      1. As the instance owner, run the following command.

      db2set -all DB2COMM

      2. The value of DB2COMM will be returned'
    severity: medium
- id: 8.2.1
  title: Encrypt the Database
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Encrypting the database will protect your data and may be required for compliance with certain government regulations
    (e.g. NIST).
  rationale: A malicious user can steal physical media like the hard drive, and restore the database and browse the data.
    To prevent access to the data at rest, encrypt sensitive data in a database and use an encryption key that encrypt the
    data. This prevents anyone without the keys from using the data.
  impact: ''
  references: []
  page_start: 434
  audit_raw: Check that the database is encrypted via examining configuration settings.
  remediation: 'To determine if a database is encrypted you should check the Encrypted database

    database configuration parameter:

    db2 => get db cfg | grep -i encrypt

    Encryption Library for Backup (ENCRLIB) = libdb2encr.so

    Encryption Options for Backup (ENCROPTS) = CIPHER=AES:MODE=CBC:KEY LENGTH=256

    Encrypted database = YES

    You should see that the encrypted database is set to YES.

    You should check the type of key manger used by checking dbm configuration:

    db2 => get dbm cfg | grep -i keystore

    Keystore type (KEYSTORE_TYPE) = KMIP

    Keystore location (KEYSTORE_LOCATION) = /path/ekeystore.cfg

    You can also check the current database encryption settings:

    db2 => SELECT * FROM TABLE(SYSPROC.ADMIN_GET_ENCRYPTION_INFO())

    You must be connected to the database to run this command. The following information

    will be shown for the connected database:

    • OBJECT_NAME

    • OBJECT_TYPE

    • ALGORITHM

    • ALGORITHM_MODE

    • KEY_LENGTH

    • MASTER_KEY_LABEL KEYSTORE_NAME KEYSTORE_TYPE

    • KEYSTORE_HOST KEYSTORE_IP

    • KEYSTORE_IP_TYPE

    • PREVIOUS_MASTER_KEY_LABEL AUTH_ID

    • APPL_ID

    • ROTATION_TIME

    This information should be filled in for an encrypted database.'
  checks:
  - type: manual_review
    info: Check that the database is encrypted via examining configuration settings.
    severity: medium
- id: 8.2.2
  title: Do Not Use Encryption Algorithms that are Not Secure
  scoring: manual
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: Encryption can be performed with various algorithms, some of which are outdated and should no longer be used.
  rationale: Using an outdated algorithm can leave the data vulnerable. As new methods of attack are created and hardware
    processing speeds increase, the encryption algorithms can become vulnerable. Thus, only current encryption algorithms
    should be used. 3DES is an outdated encryption algorithm and should not be used.
  impact: ''
  references: []
  page_start: 436
  audit_raw: 'Check that you are not using an outdated algorithm (like 3DES) by looking at the

    configuration settings.'
  remediation: 'To determine what encryption options used to encrypt the database you can run the

    following command:

    db2 => get db cfg | grep -i encrypt

    Encryption Library for Backup (ENCRLIB) = libdb2encr.so

    Encryption Options for Backup (ENCROPTS) = CIPHER=AES:MODE=CBC:KEY LENGTH=256

    Encrypted database = YES

    ENCROPS should not contain CIPHER=3DES algorithm, because 3DES is not secure.

    CIPHER=AES is secure.

    You can also check the current database encryption settings:

    db2 => SELECT * FROM TABLE(SYSPROC.ADMIN_GET_ENCRYPTION_INFO())

    You must be connected to the database to run this command. From the information

    retrieved, the ALGORITHM should not be 3DES.'
  checks:
  - type: manual_review
    info: 'Check that you are not using an outdated algorithm (like 3DES) by looking at the

      configuration settings.'
    severity: medium
- id: 8.2.3
  title: Secure the Configuration File
  scoring: scored
  profile:
  - Level 2 - RDBMS (extends Level 1 - RDBMS)
  description: A configuration file, ekeystore.cfg, is created by the user in order to configure external keymanager functionality.
    This file should be secured against tampering via OS permissions.
  rationale: Set this file to be readable and writeable by only the Db2 instance owner. If this file is not secured, an attacker
