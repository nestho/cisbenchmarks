- id: 4.1.14
  title: Specify a Secure Location for External Tables (EXTBL_LOCATION)
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The EXTBL_LOCATION database configuration parameter provides an allow list of paths that external tables may
    access for local files, for both reading and writing. It is recommended that this value be set to appropriate paths with
    the understanding that confidential data may reside in this directory. Specifying appropriate paths is part of an organizations
    standard operating procedures (SOP). The DISCOVER_DB parameter specifies whether the database can be discovered in the
    network. It is recommended that databases not be discoverable.
  rationale: External tables can read and write data to the paths configured within the EXTBL_LOCATION configuration parameter.
    To avoid a loss of confidentiality of the data which may be reside in these paths, they should be examined to ensure they
    match the values specified by the SOP. Discovery capabilities may be used by a malicious entity to derive the names of
    and target Db2 databases.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-extbl-location-externaltable-location
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-discover-db-discoverdatabase
  page_start: 104
  audit_raw: 'Perform the following Db2 commands to determine if a EXTBL_LOCATION is specified:

    1. Connect to the Db2 database.

    db2 => connect to <dbname>

    2. Run the following command:

    db2 => get database configuration

    3. Locate the EXTBL_LOCATION value in the output:

    Allowed paths for external tables (EXTBL_LOCATION) = /home/db2inst1

