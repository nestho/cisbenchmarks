- id: 6.1.1
  title: Secure SYSADM Authority
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The sysadm_group parameter defines the system administrator group (SYSADM) authority. It is recommended that
    the sysadm_group group contains authorized users only.
  rationale: If an account that possesses this authority is compromised or used in a malicious manner, the confidentiality,
    integrity, and availability of data in the Db2 instance will be at increased risk.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=authorities-system-administrationauthority-sysadm
  page_start: 342
  audit_raw: 'Perform the following Db2 commands to obtain the value for this setting:

