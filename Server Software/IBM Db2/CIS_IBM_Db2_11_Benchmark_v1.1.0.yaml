- id: 6.2.2
  title: Review Roles
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Roles provide several advantages that make it easier to manage privileges in a database system. Security administrators
    can control access to their databases in a way that mirrors the structure of their organizations (they can create roles
    in the database that map directly to the job functions in their organizations). The assignment of privileges is simplified.
    Instead of granting the same set of privileges to each individual user in a particular job function, the administrator
    can grant this set of privileges to a role representing that job function and then grant that role to each user in that
    job function.
  rationale: Reviewing the roles within a database helps minimize the possibility of unwanted access.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=security-roles
  page_start: 385
  audit_raw: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following and review the results to determine\
    \ if each role name still has a\nbusiness requirement to access the data:\ndb2 => select rolename from syscat.roleauth\n\
    \       where grantortype <> 'S' group by rolename"
  remediation: 'To remove a role from the database:

    1. Connect to Db2 database:

    db2 => connect to <dbname>

    2. Run the following:

    db2 => drop role <role name>'
  checks:
  - type: sql
    command: select rolename from syscat.roleauth
    severity: medium
    info: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following and review the results to determine\
      \ if each role name still has a\nbusiness requirement to access the data:\ndb2 => select rolename from syscat.roleauth\n\
      \       where grantortype <> 'S' group by rolename"
- id: 6.2.3
  title: Review Role Members
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Having roles that have been granted specific privileges, then assigning users to the roles, is usually considered
    the best way to grant application access. Because granting privileges to individual users can be more difficult to track
    and maintain against unauthorized access, users should be assigned to organization-defined database roles according to
    the needs of the business. As users leave the organization or change responsibilities within the organization, the appropriate
    roles for them change as well, so role membership needs to be reviewed and verified periodically.
  rationale: Users who have excessive privileges not needed to do their jobs pose an unnecessary risk to the organization
    as an insider threat.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=security-roles
  page_start: 387
  audit_raw: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following to review and verify that the\
    \ role members are correct for each\nrole:\ndb2 => select rolename,grantee from syscat.roleauth\n       where grantortype\
    \ <> 'S' group by rolename, grantee"
  remediation: 'To remove a role member from a particular role:

    1. Connect to Db2 database:

    db2 => connect to <dbname>

    2. Run the following:

    db2 => revoke role <role name> from <role member>'
  checks:
  - type: sql
    command: select rolename,grantee from syscat.roleauth
    severity: medium
    info: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following to review and verify that the role\
      \ members are correct for each\nrole:\ndb2 => select rolename,grantee from syscat.roleauth\n       where grantortype\
      \ <> 'S' group by rolename, grantee"
- id: 6.2.4
  title: Nested Roles
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The user-defined roles in Db2 can be nested in the same fashion as Windows security groups, i.e. a nested group
    has both its directly assigned permissions as well as the assigned group permissions. By nesting roles, the database administrator
    is saving time by only having to assign a group of users versus assigning them individually. Nesting roles properly can
    often ease the application of the security model if it's kept fairly shallow, and if the roles are logically named. If
    these are all true, then nesting of roles is a good idea.
  rationale: As tracking multiple levels of permissions can result in unauthorized access to data resources, this capability
    should be restricted according to the needs of the business.
  impact: ''
  references: []
  page_start: 389
  audit_raw: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following to identify any nested roles:\n\
    db2 => select grantee, rolename from syscat.roleauth\n       where grantee in (select rolename from syscat.roles)\nIf\
    \ value is blank, this would be considered passing."
  remediation: 'To remove a nested role, perform the following:

    1. Connect to Db2 database:

    db2 => connect to <dbname>

    2. Run the following:

    db2 => revoke role <role name> from role <role>'
  checks:
  - type: sql
    command: select grantee, rolename from syscat.roleauth
    severity: medium
    info: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following to identify any nested roles:\ndb2\
      \ => select grantee, rolename from syscat.roleauth\n       where grantee in (select rolename from syscat.roles)\nIf\
      \ value is blank, this would be considered passing."
- id: 6.2.5
  title: Review Roles Granted to PUBLIC
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Granting to PUBLIC increases the risk of unauthorized entry into the database. Because PUBLIC is accessible
    by any database user, it is important to understand the exposure it has on all database objects. It would make sense to
    grant role membership to PUBLIC if all users required all the privileges granted through that role.
  rationale: As any role granted to PUBLIC can potentially allow the compromise of database availability, confidentiality,
    or integrity, these roles should be restricted according to the needs of the business.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=security-roles
  page_start: 391
  audit_raw: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following:\ndb2 => select grantee, rolename\
    \ from syscat.roleauth\n       where grantee = 'PUBLIC'\nIf the value returned is blank, that is considered a Pass."
  remediation: 'To remove a role member from a particular role:

    1. Connect to Db2 database:

    db2 => connect to <dbname>

    2. Run the following:

    db2 => revoke role <role name> from PUBLIC'
  checks:
  - type: sql
    command: select grantee, rolename from syscat.roleauth
    severity: medium
    info: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Run the following:\ndb2 => select grantee, rolename\
      \ from syscat.roleauth\n       where grantee = 'PUBLIC'\nIf the value returned is blank, that is considered a Pass."
- id: 6.2.6
  title: Review Role Grantees with WITH ADMIN OPTION
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Using the WITH ADMIN OPTION clause of the GRANT (Role) SQL statement, the security administrator can delegate
    the management and control of membership in a role to someone else.
  rationale: The WITH ADMIN OPTION clause gives another user the authority to grant membership in the role to other users,
    to revoke membership in the role from other members of the role, and to comment on a role, but not to drop the role.
  impact: ''
  references: []
  page_start: 393
  audit_raw: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Perform the following query:\ndb2 => select rolename,\
    \ grantee, admin from syscat.roleauth\n       where grantortype <> 'S' and admin = 'Y'\nIf the value returned is blank,\
    \ that is considered a Pass."
  remediation: '1. Connect to Db2 database:

    db2 => connect to <dbname>

    2. Perform the following query:

    db2 => revoke admin option for role <role name> from user <user name>'
  checks:
  - type: sql
    command: select rolename, grantee, admin from syscat.roleauth
    severity: medium
    info: "1. Connect to Db2 database:\ndb2 => connect to <dbname>\n2. Perform the following query:\ndb2 => select rolename,\
