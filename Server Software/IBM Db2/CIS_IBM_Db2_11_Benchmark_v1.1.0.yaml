- id: 3.2.3
  title: Disable Grants During Restore (DB2_RESTORE_GRANT_ADMIN_AUTHORITIES)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The DB2_RESTORE_GRANT_ADMIN_AUTHORITIES registry variable determines whether the authorization ID of the user
    performing a restore is granted administrative authorities (SECADM, DBADM, DATAACCESS, and ACCESSCTRL authorities) on
    the restored database. It is typically used when restoring a database on a server where the original database creator
    account does not exist. It is recommended that this variable not be set except when specifically performing a restore
    where you wish these privileges to be granted so they are not accidentally granted. The DB2_EXTSECURITY registry variable
    determines whether extended security is enabled on Windows. Extended security enables file permissions for all Db2 objects
    so they can be accessed by users in DB2ADMNS and DB2USERS groups. It is recommended that extended security be enabled.
    This registry variable only applies to Db2 Servers running on Windows.
  rationale: Use of this registry variable may grant administrative authorities accidentally if the value is left on during
    normal operations and a restore is run. Extended security provides file permission protection for Db2 objects when running
    in a multi-user environment.
  impact: Before enabling extended security for an existing installation, you should ensure you have added users to the DB2ADMNS
    and DB2USERS groups so that you are able to access Db2 once the permission have been applied. Once extended security is
    enabled, it is not recommended to be directly disabled, instead a full re-install should be used.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=variables-systemenvironment#r0005658_\_S_DB2_RESTORE_GRANT_ADMIN_AUTHORITIES
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=variablesmiscellaneous#r0005669__M_DB2_EXTSECURITY
  - 2. https://www.ibm.com/docs/en/db2/11.5?topic=security-extended-windows-usingdb2admns-db2users-groups
  page_start: 60
  audit_raw: 'Verify the value of the DB2_RESTORE_GRANT_ADMIN_AUTHORITIES registry variable by

    running the following command:

    db2set -all | grep DB2_RESTORE_GRANT_ADMIN_AUTHORITIES

    The above command should not yield a value or should yield a value of OFF.

    erify that extended security is enabled by running the following command:

    db2set -all | grep DB2_EXTSECURITY

    The above command should yield a value of ON.'
  remediation: 'Run the following command to set the DB2_RESTORE_GRANT_ADMIN_AUTHORITIES registry

    variable to OFF:

    db2set DB2_RESTORE_GRANT_ADMIN_AUTHORITIES=OFF

    Run the following command to enable extended security (consult documentation for

