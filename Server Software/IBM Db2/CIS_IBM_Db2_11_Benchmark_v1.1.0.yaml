      "DYN2011011400AMD64", and Fix Pack "0".

      RHEL 7 and RHEL 8

      Run the following commands as root:

      $ grep pam_access /etc/pam.d/system-auth

      If the command does not return a line from the file, this is a Fail, and the r'
    severity: medium
- id: 3.1.1
  title: Require Explicit Authorization for Cataloging (CATALOG_NOAUTH)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: Db2 can be configured to allow users that do not possess the SYSADM authority to catalog and uncatalog databases
    and nodes. It is recommended that the CATALOG_NOAUTH parameter be set to NO.
  rationale: Cataloging a database is the process of registering a database from a remote client to allow remote call and
    access. Setting CATALOG_NOAUTH to YES bypasses all permissions checks and allows anyone to catalog and uncatalog databases.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-catalog-noauthcataloging-allowed-without-authority
  page_start: 23
  audit_raw: 'Perform the following to determine if authorization is explicitly required to catalog and

    uncatalog databases and nodes:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the value of CATALOG_NOAUTH in the output:

    Cataloging allowed without authority (CATALOG_NOAUTH) = NO

    Ensure CATALOG_NOAUTH is NO.'
  remediation: 'Perform the following to require explicit authorization to catalog and uncatalog

    databases and nodes.

    1. Attach to the Db2 instance

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => update database manager configuration using catalog_noauth no'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if authorization is explicitly required to catalog and

      uncatalog databases and nodes:

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command:

      db2 => get database manager configuration

      3. Locate the value of CATALOG_NOAUTH in the output:

      Cataloging allowed without authority (CATALOG_NOAUTH) = NO

      Ensure CATALOG_NOAUTH is NO.'
    severity: medium
- id: 3.1.2
  title: Secure Permissions for Default Database File Path (DFTDBPATH)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The DFTDBPATH parameter contains the default file path used to create Db2 databases. It is recommended that
    the permissions for this directory be set to full access for Db2 administrators and read and execute access only for all
    other accounts. It is also recommended that this directory be owned by the Db2 Administrator.
  rationale: Restricting access to the directory used as the default file path through permissions will help ensure that the
    confidentiality, integrity, and availability of the files there are protected.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'For Windows and Linux:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command from the Db2 command window:

    db2 => get database manager configuration

    3. Locate this value in the output to find the default file path:

    Default database path (DFTDBPATH) = <valid directory>

    Additional steps for Windows:

    1. Connect to the Db2 host

    2. Right-click over the directory used for the default file path

    3. Choose Properties

    4. Select the Security tab

    5. Review and verify the privileges for all accounts.

    6. Review and verify that the Db2 Administrator is the owner of the directory.

    Additional steps for Linux:

    1. Connect to the Db2 host

    2. Change to the directory used as the default file path

    3. Review and verify the permissions for the directory for all users; also ensure that

    the Db2 Administrator is the owner.

    $ ls -al'
  remediation: 'For Windows and Linux:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command to change the default file path, if necessary:

    db2 => update database manager configuration using dftdbpath <valid

    directory>

    Additional steps for Windows:

    1. Connect to the Db2 host

    2. Right-click over the directory used as the default file path

    3. Choose Properties

    4. Select the Security tab

    5. Assign ownership of the directory to the Db2 Administrator

    6. Grant all Db2 administrator accounts the Full Control authority

    7. Grant only read and execute privileges to all other users (revoke all other

    privileges)

    Additional steps for Linux:

    1. Connect to the Db2 host

    2. Change to the directory used as the default file path

    3. Assign the Db2 Administrator to be the owner of the directory using the chown

    command

    4. Change the permissions for the directory

    $ chmod -R 755'
  checks:
  - type: manual_review
    info: 'For Windows and Linux:

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command from the Db2 command window:

      db2 => get database manager configuration

      3. Locate this value in the output to find the default file path:

      Default database path (DFTDBPATH) = <valid directory>

      Additional steps for Windows:

      1. Connect to the Db2 host

      2. Right-click over the directory used for the default file path

      3. Choose Properties

      4. Select the Security tab

      5. Review and verify the '
    severity: medium
- id: 3.1.3
  title: Set Diagnostic Logging to Capture Errors and Warnings (DIAGLEVEL)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The DIAGLEVEL parameter specifies the type of diagnostic errors that will be recorded in the db2diag.log file.
    It is recommended that the DIAGLEVEL parameter be set to at least 3. The DIAGPATH parameter specifies the location of
    the diagnostic files for the Db2 instance. The directory at this location should be secured so that users have read and
    execute privileges only (no write privileges). All Db2 administrators should have full access to the directory.
  rationale: The recommended DIAGLEVEL setting is 3, but any value greater than 3 is also acceptable. A value of at least
    3 will allow the Db2 instance to capture all errors and warnings that occur on the system. Securing the directory will
    ensure that the confidentiality, integrity, and availability of the diagnostic files contained in the directory are preserved.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Perform the following Db2 commands to obtain the value for this setting:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the DIAGLEVEL value in the output:

    Diagnostic error capture level (DIAGLEVEL) = 3

    Ensure DIAGLEVEL is greater than or equal to 3.

    For both Windows and Linux

    Perform the following Db2 commands to obtain the location of the directory:

    1. Attach to the Db2 instance.

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => get database manager configuration

    3. Locate the DIAGPATH value in the output:

    Diagnostic data directory path (DIAGPATH) = <valid directory>

    Additional steps for Windows:

    1. Connect to the Db2 host

    2. Right-click over the diagnostic log directory

    3. Choose Properties

    4. Select the Security tab

    5. Review the access for all accounts

    Additional steps for Linux:

    1. Connect to the Db2 host

    2. Change to the diagnostic log directory

    3. Review the permissions of the directory

    $ ls -al'
  remediation: '1. Attach to the Db2 instance

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => update database manager configuration using diaglevel 3

    For Windows and Linux

    To change the directory for the diagnostic logs:

    1. Attach to the Db2 instance

    db2 => attach to <db2instance>

    2. Run the following command:

    db2 => update database manager configuration using diagpath <valid

    directory>

    Additional steps for Windows:

    1. Connect to the Db2 host

    2. Right-click over the diagnostic log directory

    3. Choose Properties

    4. Select the Security tab

    5. Grant the Full Control authority to all Db2 administrator accounts

    6. Grant only read and execute privileges to all other accounts (revoke any other

    privileges)

    Additional steps for Linux:

    1. Connect to the Db2 host

    2. Change to the diagnostic log directory

    3. Change the permissions of the directory

    $ chmod -R 3777 .'
  checks:
  - type: manual_review
    info: 'Perform the following Db2 commands to obtain the value for this setting:

      1. Attach to the Db2 instance.

      db2 => attach to <db2instance>

      2. Run the following command:

      db2 => get database manager configuration

      3. Locate the DIAGLEVEL value in the output:

      Diagnostic error capture level (DIAGLEVEL) = 3

      Ensure DIAGLEVEL is greater than or equal to 3.

      For both Windows and Linux

      Perform the following Db2 commands to obtain the location of the directory:

      1. Attach to the Db2 instance.

      db2 => attach to <d'
    severity: medium
- id: 3.1.5
  title: Secure Permissions for Alternate Diagnostic Log Path (ALT_DIAGPATH)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The ALT_DIAGPATH parameter specifies an alternative location of the diagnostic files for the Db2 instance if
    the primary location specified by DIAGPATH is unavailable. The directory at this location should be secured so that users
    have read and execute privileges only (no write privileges). All Db2 administrators should have full access to the directory.
    The DISCOVER parameter determines what kind of discovery requests, if any, the Db2 client can make. It is recommended
    that this is disabled. The DISCOVER_INST parameter specifies whether the instance can be discovered in the network. It
    is recommended that instances not be discoverable.
  rationale: Securing the directory will ensure that the confidentiality, integrity, and availability of the diagnostic files
    contained in the directory are preserved. Discovery capabilities may be used by a malicious entity to derive the names
    of and target Db2 instances. In this configuration, the client can not issue discovery requests. Discovery capabilities
    may be used by a malicious entity to derive the names of and target Db2 instances.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-discover-discoverymode
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=parameters-discover-inst-discoverserver-instance
