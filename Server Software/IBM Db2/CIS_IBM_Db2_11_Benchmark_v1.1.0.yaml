- id: 6.2.1
  title: Review Users, Groups, and Roles
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: With row and column access control, individuals are permitted access to only the subset of data that is required
    to perform their job tasks. Periodic review of these individuals is crucial when trying to keep data secure. As business
    needs move forward, requirements behind accessing the data may change, leading to a revision in security policy. By inspecting
    the list of users, groups, and roles, you are identifying excessive privileges that could pose possible security threats
    within your infrastructure.
  rationale: If a user (either by himself or part of a group or role) is no longer required access to the data that is protected
    by row and column access controls, allowing that individual to maintain access allows that individual to compromise the
    confidentiality, integrity, and/or availability of the data in the Db2 instance.
  impact: ''
  references: []
  page_start: 382
  audit_raw: "1. Review the users within your database environment:\no Linux:\ncat /etc/passwd\no Windows:\n1. Run compmgmt.msc\n\
    2. Click 'Local Users and Groups'\n3. Double click 'Users'\n4. Review users\n2. Review the groups within your database\
    \ environment:\no Linux:\ncat /etc/group\no Windows:\n1. Run compmgmt.msc\n2. Click 'Local Users and Groups'\n3. Double\
    \ click 'Groups'\n4. Review groups\n3. Review the roles and role members within your database environment:\no Connect\
    \ to Db2 database:\ndb2 => connect to <dbname>\no Run the command:\ndb2 => select rolename, grantee from syscat.roleauth\n\
    \       where grantortype <> 'S'"
  remediation: '1. To remove users from your database environment:

    o Linux:

    userdel -r <user name>

    o Windows:

    ▪ Run compmgmt.msc

    ▪ Click ''Local Users and Groups''

    ▪ Double click ''Users''

    ▪ Right-click on

    ▪ Select ''Delete''

    2. To remove groups from your database environment:

    o Linux:

    groupdel -r <group name>

    o Windows:

    1. Run compmgmt.msc

    2. Click ''Local Users and Groups''

    3. Double click ''Groups''

    4. Right-click on

    5. Select ''Delete''

    3. To remove roles or role members from your database environment:

    o Connect to Db2 database:

    db2 => connect to <dbname>

    o To remove role members from roles:

    db2 => revoke role <role name> from <userroup/role member>

    o To remove roles:

    db2 => drop role <role name>'
  checks:
