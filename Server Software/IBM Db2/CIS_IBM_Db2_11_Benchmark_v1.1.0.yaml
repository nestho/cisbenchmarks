- id: 3.1.13
  title: Secure the Communication Buffer Exit Library (COMM_EXIT_LIST)
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: A communication exit library is a dynamically loaded library that vendor applications use to examine communication
    buffers. The COMM_EXIT_LIST parameter specifies the list of communication buffer exist libraries. The permissions on the
    libraries should be secured so that users other than the instance owner do not have write privileges. The DB2RSHCMD registry
    varible specifies the remote shell command to use when starting remote database partitions and with the db2_all script
    to run utilities and commands on all database partitions. It is recommended that a value be used which encrypts the data
    sent between partitions, such as ssh.
  rationale: If a malicious user has write access to a communication exit library, they can overwrite it with their own thereby
    receiving all of the communication buffers that Db2 receives over the network. Securing the libraries will prevent a loss
    of confidentiality of data. The traditional rsh command sends all its data, including passwords, in plaintext between
    partitions. An attacker who can read network traffic may have access to these passwords and other data. Specifying a remote
    shell command, such as ssh encrypts the data sent over the network.
  impact: Enabling this value without configuring public and private keys may result in an inability to start or stop Db2
    across all partitions without manually issuing db2start/db2stop individually on each partition.
  references:
  - 1. https://www.ibm.com/docs/en/db2/11.5?topic=variablescommunications#r0005660__C_DB2RSHCMD
  - 2. https://www.ibm.com/docs/en/db2/11.5?topic=installation-enabling-executionremote-commands
  page_start: 53
