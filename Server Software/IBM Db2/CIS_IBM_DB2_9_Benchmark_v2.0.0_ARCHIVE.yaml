  audit_raw: "1. Run the following command to identify the current value of the srvcon_auth database\nconfiguration parameter:\n\
    select name, value from sysibmadm.dbmcfg where name = 'srvcon_auth'\nReview the replication of your backups based on organization\
    \ policy.\nReview the privileges applied to your backups.\nPerform the following DB2 commands to obtain the value for\
    \ this setting:\n1. Connect to the DB2 database:\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run\
    \ the following command from the DB2 command window:\ndb2 => update database configuration\n3. Locate this value in the\
    \ output:\ndb2 => get database configuration\ndb2 => …\n       Automatic maintenance (AUTO_MAINT) = ON\nNote: AUTO_MAINT\
    \ is set to ON in the above output.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'AUDITPOLICIES'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
    is considered a successful finding.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'AUDITUSE'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
    is considered a successful finding.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'DBAUTH'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
    is considered a successful finding.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'COLAUTH'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
    is considered a successful finding.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'EVENTS'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
    is considered a successful finding.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect\
    \ to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from\
    \ the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname = 'EVENTTABLES'\
    \ and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is BLANK, then it\n\
