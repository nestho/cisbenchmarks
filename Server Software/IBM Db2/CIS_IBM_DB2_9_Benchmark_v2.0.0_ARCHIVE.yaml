- id: 3.1.12
  title: Enable server-based authentication
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  description: The srvcon_auth parameter specifies how and where authentication is to take place for incoming connections
    to the server. It is recommended that this parameter is not set to CLIENT.
  rationale: This parameter will take precedence over and override the authentication level. Authentication should be set
    on the server side.
  impact: It is important to be aware that the implementation of this recommendation results in a brief downtime. It is advisable
    to ensure that the setting is implemented during an approved maintenance window. 46 | P a g e
  references: []
  page_start: 45
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the SRVCON_AUTH value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Server Connection\
    \ Authentication (SRVCON_AUTH) = SERVER\nNote: SRVCON_AUTH is set to SERVER in the above output."
  remediation: 'The recommended value is SERVER. Note: this will require a DB2 restart.

    1. Attach to the DB2 instance

    db2 => attach to $DB2INSTANCE

    45 | P a g e

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using srvcon_auth server

    3. Restart the DB2 instance.

    db2 => db2stop

    db2 => db2start'
