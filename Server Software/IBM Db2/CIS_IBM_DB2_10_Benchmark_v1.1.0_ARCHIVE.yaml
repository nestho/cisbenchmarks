    perform RUNSTATS and REORG INDEXES and TABLES. SQLADM can be granted to users, groups, or roles or PUBLIC. SQLADM authority
    is a subset of the DBADM authority and can be granted by the SECADM authority. The DATAACCESS authority gives the grantee
    read access and also control over manipulating the data. DATAACCESS can be granted to users, groups, or roles, but not
    PUBLIC. DATAACCESS authority is a subset of the DBADM authority and can be granted by the SECADM authority. The ACCESSCTRL
