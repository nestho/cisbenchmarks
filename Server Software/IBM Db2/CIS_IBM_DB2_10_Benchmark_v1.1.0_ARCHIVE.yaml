  - Level 1 - Windows Host OS
  - Level 1 - Linux Host OS
  - Level 1 - RDBMS
  - Level 1 – RDBMS
  - Level 2 – RDBMS
  description: The srvcon_auth parameter defines where and how user authentication is done for incoming connections at the
    server. If no value is used, DB2 uses the database manager configuration parameter authentication. This parameter is used
    to determine where users are validated within the database environment (client-side authentication). If the parameter
    is set to 'YES', the server assumes that the client side is handling authentication to the database. If the parameter
    is set to 'NO', the client must provide authentication to the server on behalf of the user. This parameter is only active
    when the authentication parameter is set to CLIENT. This parameter specifies where a trusted client is authenticated (at
    the server or the client) if it provides a user ID and password. If the parameter is set to 'CLIENT', the user ID and
    password are not needed, but if they are provided, authentication will occur at the client. If the parameter is set to
    'SERVER', the user ID and password are needed and will be authenticated at the server. This parameter is only active if
    the authentication parameter is set to 'CLIENT'. DB2 Row and Column Access Control (RCAC) Policies control access to DB2
    tables. They should match the organization's security and database access policies, and they should be regularly reviewed
    for gaps. The SECADM (security administrator) role grants the authority to create, alter (where applicable), and drop
    roles, trusted contexts, audit policies, security label components, security policies and security labels. It is also
    the authority required to grant and revoke roles, security labels and exemptions, and the SETSESSIONUSER privilege. SECADM
    authority has no inherent privilege to access data stored in tables. It is recommended that the SECADM role be granted
    to authorized users only. With row and column access control, individuals are permitted access to only the subset of data
    that is required to perform their job tasks.  Periodic review of these individuals is crucial when trying to keep data
    secure.  As business needs move forward, requirements behind accessing the data may change, leading to a revision in security
    policy.  By inspecting the list of users, groups, and roles, you are identifying excessive privileges that could pose
    possible security threats within your infrastructure. The logic behind instituting row permissions is crucial for a successful
    security policy.  Inspecting this logic and comparing it to the security policy will assure that all aspects of the data
    access controls are being adhered to. The logic behind instituting column masks is crucial for a successful security policy.  Inspecting
    this logic and comparing it to the security policy will assure that all aspects of the data access controls are being
    adhered to. Backup redundancy ensures that multiple instances of database backups exist. Backups of your database should
    be stored securely in a location with full access for administrators, read and execute access for group, and no access
    for users. Enable automatic database maintenance on your DB2 instance. It is recommended that the DB2 Automatic Maintenance
    tool be used to ensure that the instance is performing optimally. The SYSCAT.AUDITPOLICIES view contains all audit policies
    for a database. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.AUDITUSE view
    contains database audit policy for all non-database objects, such as authority, groups, roles, and users. It is recommended
    that the PUBLIC role be restricted from accessing this view. The SYSCAT.DBAUTH view contains information on authorities
    granted to users or groups of users. It is recommended that the PUBLIC role be restricted from accessing this view. The
    SYSCAT.COLAUTH view contains the column privileges granted to the user, group, or role in the database. The SYSCAT.EVENTS
    view contains all types of events that the database is currently monitoring. It is recommended that the PUBLIC role be
    restricted from accessing this view. The SYSCAT.EVENTTABLES view contains the name of the destination table that will
    receive the monitoring events. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROUTINES
    view contains all user-defined routines, functions, and stored procedures in the database. It is recommended that the
    PUBLIC role be restricted from accessing this view. The SYSCAT.INDEXAUTH view contains a list of users or groups that
    have CONTROL access on an index. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.PACKAGEAUTH
    view contains a list of users or groups that has EXECUTE privilege on a package. It is recommended that the PUBLIC role
    be restricted from accessing this view. The SYSCAT.PACKAGES view contains the names of all packages created in the database
    instance. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.PASSTHRUAUTH view
    contains the names of user or group that have passthrough authorization to query the data source. It is recommended that
    the PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYPOLICIES view contains all database security
    policies. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.SECURITYPOLICYEXEMPTIONS
    contains the exemption to a security policy that was granted to a database account. It is recommended that the PUBLIC
    role be restricted from accessing this view. The SYSCAT.SURROGATEAUTHIDS contains the names of all accounts that have
    been granted SETSESSIONUSER privilege on a user or to PUBLIC. It is recommended that the PUBLIC role be restricted from
    accessing this view. The SYSCAT.ROLEAUTH view contains information on all roles and their respective grantees. It is recommended
    that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROLES view contains all roles available in the
    database. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.ROUTINEAUTH view contains
    a list of all users that have EXECUTE privilege on a routine (function, method, or procedure). It is recommended that
    the PUBLIC role be restricted from accessing this view. The SYSCAT.SCHEMAAUTH view contains a list of all users that have
    one or more privileges or access to a particular schema. It is recommended that the PUBLIC role be restricted from accessing
    this view. The SYSCAT.SCHEMATA view contains all schema names in the database. It is recommended that the PUBLIC role
    be restricted from accessing this view. The SYSCAT.SEQUENCEAUTH view contains users, groups, or roles granted privilege(s)
    on a sequence. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.STATEMENTS view
    contains all SQL statements of a compiled package. It is recommended that the PUBLIC role be restricted from accessing
    this view. The SYSCAT.TABAUTH view contains users or groups that have been granted one or more privileges on a table or
    view. It is recommended that the PUBLIC role be restricted from accessing this view. The SYSCAT.TBSPACEAUTH contains users
    or groups that have been granted the USE privilege on a particular tablespace in the database. It is recommended that
    the PUBLIC role be restricted from accessing this view. A tablespace is where the data is physically stored. It is recommended
    that tablespace usage be restricted to authorized users. The SYSCAT.MODULEAUTH view contains all granted privileges on
    a module for users, groups, or roles and is read only. The SYSCAT.VARIABLEAUTH view contains the granted privileges on
    a global variable for users, groups, or roles and is read only. The SYSCAT.WORKLOADAUTH catalog represents the users,
    groups, or roles that have been granted the USAGE privilege on a workload. The SYSCAT.XSROBJECTAUTH view contains granted
    USAGE privileges on a particular XSR object for users, groups, or roles and is read only. SYSCAT.AUTHORIZATIONIDS is an
    administrative view for the currently connected server. The SYSIBMADM.OBJECTOWNERS administrative view shows the complete
    object ownership information for each authorization ID for USER owning a system catalog defined object from the connected
    database. The SYSIBMADM.PRIVILEGES administrative view displays all explicit privileges for all authorization IDs in the
    currently connected databases' system catalogs. PRIVILEGES schema is SYSIBMADM. The sysadm_group parameter defines the
    system administrator group (SYSADM) authority. It is recommended that the sysadm_group group contains authorized users
    only. The sysctrl_group parameter defines the system administrator group with system control (SYSCTRL) authority. It is
    recommended that the sysctrl_group group contains authorized users only. The sysmaint_group parameter defines the system
    administrator group that possesses the system maintenance (SYSMAINT) authority. It is recommended that the sysmaint_group
    group contains authorized users only. The sysmon_group parameter defines the operating system groups with system monitor
    (SYSMON) authority. It is recommended that the sysmon_group group contain authorized users only. The SECADM (security
    administrator) role grants the authority to create, alter (where applicable), and drop roles, trusted contexts, audit
    policies, security label components, security policies and security labels. It is also the authority required to grant
    and revoke roles, security labels and exemptions, and the SETSESSIONUSER privilege. SECADM authority has no inherent privilege
    to access data stored in tables. It is recommended that the SECADM role be granted to authorized users only. The DBADM
    (database administration) role grants the authority to a user to perform administrative tasks on a specific database.
    It is recommended that the DBADM role be granted to authorized users only. The SQLADM authority is required to monitor,
    tune, and alter SQL statements. Grants the authority to access data. The DATAACCESS authority allows the grantee to leverage
    DML level commands i.e. SELECT, INSERT, UPDATE, DELETE, LOAD, and EXECUTE any package or routine. The DATAACCESS authority
    cannot be granted to PUBLIC. ACCESSCTRL authority is the authority required to grant and revoke privileges on objects
    within a specific database. Some of these privileges include BINDADD, CONNECT, CREATETAB, CREATE_EXTERNAL_ROUTINE, LOAD,
    and QUIESCE_CONNECT. It has no inherent privilege to access data stored in tables, except the catalog tables and views.
    The ACCESSCTRL authority cannot be granted to PUBLIC. The WLMADM authority manages workload objects for a database. Holders
    of DBADM authority implicitly also hold WLMADM authority. The CREATAB (create table) role grants the authority to a user
    to create tables within a specific database. It is recommended that the CREATAB role be granted to authorized users only.
    The BINDADD (bind application) role grants the authority to a user to create packages on a specific database. It is recommended
    that the BINDADD role be granted to authorized users only. The CONNECT role grants the authority to a user to connect
    to mainframe and midrange databases from Windows, Unix, and Linux operating systems. It is recommended that the CONNECT
    role be granted to authorized users only. The LOAD role grants the authority to a user to load data into tables. It is
    recommended that the LOAD role be granted to authorized users only. The EXTERNALROUTINE authority grants a user the privilege
    to create user-defined functions and procedures in a specific database. The QUIESCECONNECT role grants the authority to
    a user to access a database even in the quiesced state. Roles provide several advantages that make it easier to manage
    privileges in a database system.  Security administrators can control access to their databases in a way that mirrors
    the structure of their organizations (they can create roles in the database that map directly to the job functions in
    their organizations).  The assignment of privileges is simplified. Instead of granting the same set of privileges to each
    individual user in a particular job function, the administrator can grant this set of privileges to a role representing
    that job function and then grant that role to each user in that job function. Having roles that have been granted specific
    privileges, then assigning users to the roles, is usually considered the best way to grant application access. Because
    granting privileges to individual users can be more difficult to track and maintain against unauthorized access, users
    should be assigned to organization-defined database roles according to the needs of the business. As users leave the organization
    or change responsibilities within the organization, the appropriate roles for them change as well, so role membership
    needs to be reviewed and verified periodically. The user-defined roles in DB2 can be nested in the same fashion as Windows
    security groups--a nested group has both its directly assigned permissions as well as the assigned group permissions.
    By nesting roles, the database administrator is saving time by only having to assign a group of users versus assigning
    them individually. Nesting roles properly can often ease the application of the security model if it's kept fairly shallow,
    and if the roles are logically named. If these are all true, then nesting of roles is a good idea. Granting to PUBLIC
    increases the risk of unauthorized entry into the database. Because PUBLIC is accessible by any database user, it is important
    to understand the exposure it has on all database objects. It would make sense to grant role membership to PUBLIC if all
    users required all the privileges granted through that role. Using the WITH ADMIN OPTION clause of the GRANT (Role) SQL
    statement, the security administrator can delegate the management and control of membership in a role to someone else.
    The DB2 instance manages the database environment and sets the configuration parameters. It is recommended that only administrators
