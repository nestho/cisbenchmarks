    3. Locate the FED_NOAUTH value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Bypass federated\
    \ authentication (FED_NOAUTH) = NO\nNote: FED_NOAUTH is set to NO in the above output.\n48 | P a g e"
