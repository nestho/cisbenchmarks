- id: 3.1.17
  title: Secure permissions for the primary archive log location
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  - Level 1 - Windows Host OS
  - Level 2 - Windows Host OS
  - Level 1 - Linux Host OS
  - Level 2 - Linux Host OS
  description: The logarchmeth1 parameter specifies the type of media and the location used as the primary destination of
    archived logs. It is recommended that the directory used for the archived logs be set to full access for DB2 administrator
    accounts and read and execute for all other accounts.
  rationale: Restricting access to the contents of the primary archive log directory will help ensure that the confidentiality,
    integrity, and availability of archive logs are protected. Although there are many ways to ensure that your primary logs
    will be archived, we recommend using the value of DISK as part of the logarchmeth1 parameter. This will properly ensure
    that the primary logs are archived. A finding of OFF is not acceptable.
  impact: ''
  references: []
  page_start: 63
  audit_raw: "For Windows and Linux:\n1. Attach to the DB2 instance.\ndb2 => attach to $DB2INSTANCE\n2. Run the following\
    \ command from the DB2 command window:\ndb2 => get database manager configuration\n63 | P a g e\n3. Locate this value\
    \ in the output to find the primary archive log directory:\ndb2 => get database manager configuration\ndb2 => ...\n Default\
    \ database path (LOGARCHMETH1) = <valid directory>\nAdditional steps for Windows:\n1. Connect to the DB2 host\n2. Right-click\
    \ on the primary archive log directory\n3. Choose Properties\n4. Select the Security tab\n5. Review and verify the privileges\
    \ for all accounts\nAdditional steps for Linux:\n1. Connect to the DB2 host\n2. Change to the primary archive log directory\n\
    3. Review and verify the permissions for the directory for all users.\nOS => ls -al"
  remediation: 'For Windows and Linux:

    1. Attach to the DB2 instance.

    2. Run the following command from the DB2 command window to change the primary

    archive log directory, if necessary:

    db2 => update database configuration using logarchmeth1 <valid directory>

    Additional steps for Windows (assuming that the logarchmeth1 parameter includes DISK):

    1. Connect to the DB2 host

    2. Right-click on the primary archive log directory

    3. Choose Properties

    4. Select the Security tab

    5. Grant all DB2 administrator accounts the Full Control authority

    6. Grant all other accounts read and execute privileges only (revoke all other

    privileges)

    Additional steps for Linux (assuming that the logarchmeth1 parameter includes DISK):

    1. Connect to the DB2 host

    2. Change to the primary archive log directory

    3. Change the permissions for the directory

    OS => chmod -R 755

    64 | P a g e'
  checks:
  - type: manual_review
    info: "For Windows and Linux:\n1. Attach to the DB2 instance.\ndb2 => attach to $DB2INSTANCE\n2. Run the following command\
