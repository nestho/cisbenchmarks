- id: 3.1.14
  title: Set failed archive retry delay
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 2 - RDBMS
  - Level 1 - Windows Host OS
  - Level 2 - Windows Host OS
  - Level 1 - Linux Host OS
  - Level 2 - Linux Host OS
  description: The archretrydelay parameter specifies the number of seconds the DB2 service will wait before it reattempts
    to archive log files after a failure. It is recommended that this parameter be set anywhere in the range of 10-30. You
    do not want the delay to be so short that the database ends up in a denial of service scenario, but you don't want the
    delay to be too long if an outside attack happens at the same time.
  rationale: Ensure that the value is non-zero, otherwise archive logging will not retry after the first failure. A denial
    of service attack can render the database without an archive log if this setting is not set. An archive log will ensure
    that all transactions can safely be restored or logged for auditing.
  impact: ''
  references: []
  page_start: 57
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Connect to the DB2 database.\n\
    db2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from the DB2 command window:\n\
    db2 => get database configuration\n57 | P a g e\n3. Locate the ARCHRETRYDELAY value in the output:\ndb2 => get database\
    \ configuration\ndb2 => …\n       Log archive retry Delay (secs) (ARCHRETRYDELAY) = 20\nNote: ARCHRETRYDELAY is set to\
    \ 20 in the above output."
  remediation: '1. Connect to the DB2 database

    db2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD

    2. To successfully set the archretrydelay within the 10-30 range, run the following

    command from the DB2 command window:

    db2 => update database configuration using archretrydelay nn  (where nn is a

    range between 10-30)'
  checks:
  - type: manual_review
    info: "Perform the following DB2 commands to obtain the value for this setting:\n1. Connect to the DB2 database.\ndb2\
      \ => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from the DB2 command window:\n\
      db2 => get database configuration\n57 | P a g e\n3. Locate the ARCHRETRYDELAY value in the output:\ndb2 => get database\
      \ configuration\ndb2 => …\n       Log archive retry Delay (secs) (ARCHRETRYDELAY) = 20\nNote: ARCHRETRYDELAY is set\
      \ to 20 in the above output."
    severity: medium
