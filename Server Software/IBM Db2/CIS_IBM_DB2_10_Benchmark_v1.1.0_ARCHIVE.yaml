    not be made readily available to the public. PUBLIC should not have access to see the target name of the event monitoring
    table. User-defined functions and routines should not be exposed to the public for exploits. The list of all users with
    access to an index should not be exposed to the public. The list of all users with access to a package should not be exposed
    to the public. The names of packages created in the database can be used as an entry point if a vulnerable package exists.
    The ability to see which accounts have the pass-through privilege could allow an attacker to exploit these accounts to
    access another data source. PUBLIC should not be able to view all the database security policies. Public should not be
    able to view all the exemptions to the database security policies. Public should not be able to view the names of all
    the surrogate accounts with SETSESSIONUSER privilege. PUBLIC should not have access to see the grants of the roles because
