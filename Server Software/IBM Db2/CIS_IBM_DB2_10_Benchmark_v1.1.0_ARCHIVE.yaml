  audit_raw: "Run the following command to identify the current value of the srvcon_auth database\nconfiguration parameter:\n\
    select name, value from sysibmadm.dbmcfg where name = 'srvcon_auth'\n Issue the following command to check the value of\
    \ the parameter:\ndb2=> select name, value from sysibmadm.dbmcfg where name = 'trust_allclnts'\nThe value should be 'YES'\
    \ for client-side authentication and 'NO' for server-side\nauthentication.\n82 | P a g e\n  Issue the following command\
    \ to check the value of the parameter:\ndb2=> select name, value from sysibmadm.dbmcfg where name = 'trust_clntauth'\n\
    \ The value should be 'CLIENT' for client-side authentication and 'SERVER' for server-side\nauthentication.\nSchedule\
    \ and complete a regular review of all organization security and data access\ndatabase policies against the current DB2\
    \ policies to determine if gaps exist.\n1. Identify each written organization policy.\n2. Find the matching DB2 RCAC policy.\n\
    3. Determine if the RCAC policy applies and correctly supports the written policy.\n4. If no matching DB2 RCAC policy\
    \ is found, record a 'gap' for future remediation.\nIt is important to consider reviewing the members of the SECADM authority\
    \ when\nimplementing this recommendation. Such consideration of this review is addressed in\nSection 7.5 of this document.\n\
    1. Review the users within your database environment:\nLinux:\ncat /etc/passwd\nWindows:\n1. Run compmgmt.msc\n2. Click\
    \ 'Local Users and Groups'\n3. Double click 'Users'\n4. Review users\n90 | P a g e\n2. Review the groups within your database\
    \ environment:\nLinux:\ncat /etc/group\nWindows:\n1. Run compmgmt.msc\n2. Click 'Local Users and Groups'\n3. Double click\
    \ 'Groups'\n4. Review groups\n3. Review the roles and role members within your database environment:\na. Attach to DB2\
    \ Instance:\ndb2 => attach to $DB2INSTANCE\nb. Connect to DB2 database:\ndb2 => connect to $DBNAME\nc. Run the command:\n\
    db2 => select rolename, grantee from syscat.roleauth where grantortype <> 'S'\n1. Attach to the DB2 Instance:\ndb2 =>\
    \ attach to $DB2INSTANCE\n2. Connect to database environment:\ndb2 => connect to $DBNAME\n3. Run the following and review\
    \ the results to confirm that the row permissions are\ncorrect and that they comply with the existing security policy:\n\
    db2 => select role.rolename, control.ruletext from syscat.roles role inner join\nsyscat.controls control on locate(role.rolename,control.ruletext)\
    \ <> 0 where\nenable = 'Y' and enforced = 'A' and valid = 'Y' and controltype = 'R'\n1. Attach to the DB2 Instance:\n\
    db2 => attach to $DB2INSTANCE\n2. Connect to database environment:\ndb2 => connect to $DBNAME\n3. Run the following and\
    \ review the results to verify that the permissions are correct\nand that they comply with the organization's existing\
    \ security policy:\ndb2 => select role.rolename, control.colname, control.ruletext from\nsyscat.roles role inner join\
    \ syscat.controls control on\nlocate(role.rolename,control.ruletext) <> 0 where enable = 'Y' and enforced =\n'A' and valid\
    \ = 'Y' and controltype = 'C'\nReview the replication of your backups based on organization policy.\nReview the privileges\
    \ applied to your backups.\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect to the\
    \ DB2 database:\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from the\
    \ DB2 command window:\ndb2 => update database configuration\n3. Locate this value in the output:\ndb2 => get database\
    \ configuration\ndb2 => …\n       Automatic maintenance (AUTO_MAINT) = ON\nNote: AUTO_MAINT is set to ON in the above\
    \ output.\n99 | P a g e\nPerform the following DB2 commands to obtain the value for this setting:\n1. Connect to the DB2\
    \ database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the following command from the DB2\
    \ command window:\n101 | P a g e\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT' and\nttname =\
    \ 'AUDITPOLICIES' and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output is\
    \ BLANK, then it\nis considered a successful finding.\nPerform the following DB2 commands to obtain the value for this\
    \ setting:\n1. Connect to the DB2 database.\ndb2 => connect to $DB2DATABASE user $USERNAME using $PASSWORD\n2. Run the\
    \ following command from the DB2 command window:\ndb2 => select grantee from sysibm.systabauth where tcreator = 'SYSCAT'\
    \ and\nttname = 'AUDITUSE' and grantee = 'PUBLIC'\n3. Review privileges granted to users, groups, and roles.  If the output\
