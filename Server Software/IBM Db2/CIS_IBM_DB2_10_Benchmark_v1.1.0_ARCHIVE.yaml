    data and will prevent efforts to monitor, alert, and respond to these risks in the future. Maintaining redundant copies
    of database backups will increase business continuity capabilities should a DB2 service failure coincide with a corrupt
    backup. Backups may contain sensitive data that attackers can use to retrieve valuable information about the organization.
    A well-maintained DB2 instance will provide access to the data and reduce database outages. This view contains sensitive
    information about the auditing security for this database. Access to the audit policies may aid attackers in avoiding
    detection. This view contains sensitive information about the types of objects being audited. Access to the audit policy
    may aid attackers in avoiding detection. This view contains all the grants in the database and may be used as an attack
    vector. The SYSCAT.COLAUTH view contains the column privileges granted to the user or a group of users. It is recommended
