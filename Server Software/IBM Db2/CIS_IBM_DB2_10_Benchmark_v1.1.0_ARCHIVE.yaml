  description: The notifylevel parameter specifies the type of administration notification messages that are written to the
    administration notification log. It is recommended that this parameter be set greater than or equal to 3. A setting of
    3, which includes settings 1 & 2, will log all fatal errors, failing services, system integrity, as well as system health.
  rationale: The system should be monitoring all Health Monitor alarms, warnings, and attentions. This may give an indication
    of any malicious usage on the DB2 instance.
  impact: ''
  references: []
  page_start: 53
  audit_raw: "Perform the following DB2 commands to obtain the value for this setting:\n1. Attach to the DB2 instance.\ndb2\
    \ => attach to $DB2INSTANCE\n2. Run the following command from the DB2 command window:\ndb2 => get database manager configuration\n\
    3. Locate the NOTIFYLEVEL value in the output:\ndb2 => get database manager configuration\ndb2 => …\n       Notify Level\
    \ (NOTIFYLEVEL) = 3\n53 | P a g e\nNote: NOTIFYLEVEL is set to 3 in the above output."
  remediation: '1. Attach to the DB2 instance

    db2 => attach to $DB2INSTANCE

    2. Run the following command from the DB2 command window:

    db2 => update database manager configuration using notifylevel 3'
  checks:
