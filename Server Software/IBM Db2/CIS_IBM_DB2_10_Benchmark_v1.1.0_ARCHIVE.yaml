  rationale: 'Incoming connections to the DB2 server must follow an authentication protocol. The srvcon_auth server configuration
    parameter defines how and where user authentication is done. This parameter is relied upon to determine whether each user
    (client) needs to be authenticated by the server or if the server should assume that each user (client) has already been
    sufficiently authenticated. This parameter is relied upon to determine whether each trusted client needs to be authenticated
    by the server or the client after providing a user ID and password. Missing, incomplete, or incorrect DB2 RCAC policies
    will increase the risks to the organization''s protected data and will prevent efforts to monitor, alert, and respond
    to these risks in the future. If an account that possesses this authority is compromised or used in a malicious manner,
    the confidentiality, integrity, and availability of data in the DB2 instance will be at increased risk. If a user (either
    by himself or part of a group or role) is no longer required access to the data that is protected by row and column access
    controls, allowing that individual to maintain access allows that individual to compromise the confidentiality, integrity,
    and/or availability of the data in the DB2 instance. Missing or incomplete DB2 RCAC Security Policies will increase the
    risks to the organization''s protected data and will prevent efforts to monitor, alert, and respond to these risks in
