controls:
- id: 2.1.1
  title: Backup Policy in Place
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  description: A backup policy should be in place.
  rationale: Backing up MySQL databases, including mysql, will help ensure the availability of data in the event of an incident.
    Without backups it might be hard to recover from an incident.
  impact: ''
  references: []
  page_start: 29
  audit_raw: Check with crontab -l if there is a backup schedule.
  remediation: Create a backup policy and backup schedule.
  checks:
  - type: manual_review
    info: Check with crontab -l if there is a backup schedule.
    severity: medium
- id: 2.1.2
  title: Verify Backups are Good
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  description: Backups should be validated on a regular basis.
  rationale: Verifying that backups are occurring appropriately will help ensure the availability of data in the event of
    an incident. Without a well-tested backup, it might be hard to recover from an incident if the backup procedure contains
    errors or doesn't include all required data.
  impact: ''
  references: []
  page_start: 30
  audit_raw: Check reports of backup validation tests.
  remediation: Implement regular backup checks and document each check.
  checks:
  - type: manual_review
    info: Check reports of backup validation tests.
    severity: medium
- id: 2.1.3
  title: Secure Backup Credentials
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  description: A database user with the least amount of privileges required to perform backup is needed for backup. The credentials
    for this user should be protected. The password, certificate and any other credentials should be protected.
  rationale: When the backup credentials are not properly secured then they might be abused to gain access to the server.
    The backup user needs an account with many privileges, so the attacker can gain (almost) complete access to the server.
  impact: ''
  references: []
  page_start: 31
  audit_raw: Check permissions of files containing passwords and/or ssl keys.
  remediation: Change file permissions.
  checks:
  - type: manual_review
    info: Check permissions of files containing passwords and/or ssl keys.
    severity: medium
- id: 2.1.4
  title: The Backups Should be Properly Secured
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  description: The backup files will contain all data in the databases. Filesystem permissions and/or encryption should be
    used to prevent non authorized users from gaining access to the backups.
  rationale: Backups should be considered sensitive information. If an unauthorized user can access backups then they have
    access to all the data that is in the database. This is true for unencrypted backups and for encrypted backups if the
    encryption key is stored along with the backup.
  impact: ''
  references:
  - 1. https://dev.mysql.com/doc/refman/5.6/en/innodb-backup.html
  page_start: 32
  audit_raw: 'Check who has access to the backup files.

    • Are the files world-readable (e.g. rw-r--r-)

    o Are they stored in a world readable directory?

    • Is the group MySQL and/or backup specific?

    o If not: the file and directory must not be group readable

    • Are the backups stored offsite?

    o Who has access to the backups?

    • Are the backups encrypted?

    o Where is the encryption key stored?

    o Does the encryption key consists of a guessable password?'
  remediation: 'Implement encryption, properly restrict filesystem permissions, protect and backup

    encryption keys.'
  checks:
  - type: manual_review
    info: 'Check who has access to the backup files.

      • Are the files world-readable (e.g. rw-r--r-)

      o Are they stored in a world readable directory?

      • Is the group MySQL and/or backup specific?

      o If not: the file and directory must not be group readable

      • Are the backups stored offsite?

      o Who has access to the backups?

      • Are the backups encrypted?

      o Where is the encryption key stored?

      o Does the encryption key consists of a guessable password?'
    severity: medium
- id: 2.1.5
  title: Point-in-Time Recovery
  scoring: manual
  profile:
  - Level 2 - MySQL RDBMS on Linux
  - Level 2 - MySQL RDBMS
  description: With binlogs it is possible to implement point-in-time recovery. This makes it possible to restore the changes
    between the last full backup and the point-in-time. Enabling binlogs is not sufficient. The binlogs need to be backed
    up to separate media. The restore procedure should be created and tested. The data in the binlog files may contain sensitive
    information which needs be stored in the proper location with restrictive permissions and may require encryption.
  rationale: Using binlogs can reduce the amount of information lost when recovering from a backup.
  impact: Binlogs can grow quite large and take up a large amount of space so auto remove needs to be put into place.
  references: []
  page_start: 34
  audit_raw: Check if binlogs are enabled and if there is a restore procedure.
  remediation: Enable binlogs and create and test a restore procedure.
  checks:
  - type: manual_review
    info: Check if binlogs are enabled and if there is a restore procedure.
    severity: medium
- id: 2.1.6
  title: Disaster Recovery (DR) Plan
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  description: A disaster recovery plan should be created. MySQL Cluster, MySQL Replica Sets (asynchronous replication) or
    both may be used. A slave in a different data center and offsite backups may be used. There should be information regarding
    the Recovery Time Objective (RTO), i.e., how long recovery will take, and if the recovery site has the same capacity.
    Additionally, delayed replicas can be a valuable part of a DR plan. Network (default) and at rest encryption should be
    used to protect data.
  rationale: A disaster recovery strategy should be planned and formalized. Without a well tested disaster recovery plan it
    might not be possible to recover in time.
  impact: ''
  references: []
  page_start: 35
  audit_raw: Check if there is a disaster recovery plan.
  remediation: Create a disaster recovery plan.
  checks:
  - type: manual_review
    info: Check if there is a disaster recovery plan.
    severity: medium
- id: 2.1.7
  title: Backup of Configuration and Related Files
  scoring: manual
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  - Level 2 - MySQL RDBMS on Linux
  - Level 2 - MySQL RDBMS
  description: 'It is important to include configuration, log, key, certificates, and customized files in backups. It is recommended
    that MySQL Server software be installed on a dedicated server. This architectural consideration affords flexibility in
    that the database server can be placed on a separate zone allowing access only from particular hosts and over particular
    protocols. When a command is executed on the command line, for example mysql -u admin -p password, the password may be
    visible in the user''s shell/command history or in the process list. Database user accounts should not be reused for multiple
    applications or users. The cryptographic material used by MySQL, such as digital certificates and encryption keys, should
    be used only for MySQL and only for one instance. Default cryptographic material should not be used since it is not unique
    to the instance. Passwords that are too complex in nature make it harder for users to remember, leading to bad practices.
    In addition, composition requirements provide no defense against common attack types such as social engineering or insecure
    password storage. In keeping with the overall goal of having users create a password that is not overly weak, it''s best
    to have at least 14 characters for a password only account. A block encryption mode with a Cipher Block Chaining (CBC)
    mode value and key length of 256 is recommended when using the AES_ENCRYPT() and AES_DECRYPT() functions for encryption.
    The server-side auth_socket authentication plugin, authenticates clients that connect to the MySQL server from the local
    host through the Unix socket file. Users authenticated by the auth_socket need not specify a password when connecting
    to the server. However, users authenticated by the auth_socket plugin are restricted from connecting remotely; they can
    only connect from the local host through the Unix socket file. This method is only suitable in situations where the server
    administrator OS account access is restricted. By default, the MySQL server accepts TCP/IP connections from MySQL user
    accounts on all server host IPv6 and IPv4 interfaces. You can make this configuration more restrictive by setting the
    bind_address configuration option to a specific IPv4 or IPv6 address so that the server only accepts TCP/IP connections
    on that address. MySQL supports multiple encryption ciphers. Ciphers can vary in strength, speed and overhead. MySQL Server
    can enable administrators to introduce an increasing delay in server response to clients after a certain number of consecutive
    failed connection attempts. The data directory is the location of the MySQL databases. MySQL can operate using a variety
    of log files, each used for different purposes. These are the binary log, error log, slow query log, relay log, and general
    log. Because these are files on the host operating system, they are subject to the permissions and ownership structure
    provided by the host and may be accessible by users other than the MySQL user. MySQL can operate using a variety of log
    files, each used for different purposes. These are the binary log (which can be encrypted), error log, slow query log,
    relay log, general log, and in the enterprise edition, the audit log (which can be encrypted). Because these are files
    on the host operating system, they are subject to the permissions and ownership structure provided by the host and may
    be accessible by users other than the MySQL user. Additionally, using secure key management and at rest MySQL encryption
    can further protect data from OS users. Much of the information about the state of MySQL exists in MySQL, the MySQL performance_schema
    or informations_schema. In cases where the information you need is within a running MySQL, use these methods as they are
    more secure as they do not require OS login and access. MySQL can operate using a variety of log files, each used for
    different purposes. These are the binary log (which can be encrypted), error log, slow query log, relay log, general log,
    and in the enterprise edition, the audit log (which can be encrypted). Because these are files on the host operating system,
    they are subject to the permissions and ownership structure provided by the host and may be accessible by users other
    than the MySQL user. Additionally, using secure key management and at rest MySQL encryption can further protect data from
    OS users. Much of the information about the state of MySQL exists in MySQL, the MySQL performance_schema or informations_schema.
    If you can get the information you need from within MySQL that is more secure as it does not require OS access. If you
    are not going to use log files it is best to first disable (don’t enable) and remove any prior logs. MySQL can operate
    using a variety of log files, each used for different purposes. These are the binary log (which can be encrypted), error
    log, slow query log, relay log (which can be encrypted), general log, and in the enterprise edition, the audit log (which
    can be encrypted). Because these are files on the host operating system, they are subject to the permissions and ownership
    structure provided by the host and may be accessible by users other than the MySQL user. Additionally, using secure key
    management and at rest MySQL encryption can further protect data from OS users. MySQL can operate using a variety of log
    files, each used for different purposes. These are the binary log (which can be encrypted), error log, slow query log,
    relay log (which can be encrypted), general log, and in the enterprise edition, the audit log (which can be encrypted).
    Because these are files on the host operating system, they are subject to the permissions and ownership structure provided
    by the host and may be accessible by users other than the MySQL user. Additionally, using secure key management and at
    rest MySQL encryption can further protect data from OS users. Much of the information about the state of MySQL exists
    in MySQL, the MySQL performance_schema or informations_schema. If you can get the information you need from within MySQL
    that is more secure as it does not require OS access. If you are not going to use log files it is best to first disable
    (don’t enable) and remove any prior logs. When configured to use SSL/TLS, MySQL relies on Secure Sockets Layer (SSL) key
    files, which are stored on the host''s filesystem. These SSL key files are subject to the host''s permissions and ownership
    structure. The plugin directory is the location of the MySQL plugins. Plugins are storage engines or user defined functions
    (UDFs). Periodically, updates to MySQL server are released to resolve bugs, mitigate vulnerabilities, and provide new
    features. It is recommended that MySQL installations are up to date with the latest security updates. The default MySQL
    installation does not contain any example or test databases. However, it is a good idea to review for common example databases
    and ensure they have been removed from production systems. This option prevents attaching arbitrary shared library functions
    as user-defined functions by checking for at least one corresponding method named _init, _deinit, _reset, _clear, or _add.
    The local_infile parameter dictates whether files located on the MySQL client''s computer can be loaded or selected via
    LOAD DATA INFILE or SELECT local_file. This option causes mysqld to start without using the privilege system. The symbolic-links
    and skip-symbolic-links options for MySQL determine whether symbolic link support is available. When use of symbolic links
    are enabled, they have different effects depending on the host platform. When symbolic links are disabled, then symbolic
    links stored in files or entries in tables are not used by the database. The InnoDB memcached Plugin allows users to access
    data stored in InnoDB with the memcached protocol. The secure_file_priv option restricts to paths used by LOAD DATA INFILE
    or SELECT local_file. It is recommended that this option be set to a file system location that contains only resources
    expected to be loaded by MySQL. Even better, if data import/export using LOAD DATA INFILE or SELECT local_file is not
    used, the functionality should be disabled entirely by setting --secure-file-priv to NULL. When data changing statements
    are made (i.e., INSERT, UPDATE), MySQL can handle invalid or missing values differently depending on whether strict SQL
    mode is enabled. When strict SQL mode is enabled, data may not be truncated or otherwise "adjusted" to make the data changing
    statement work. The mysql.user, mysql.db, and other mysql tables ending in _priv list a variety of privileges that can
    be granted (or denied) to MySQL users. Some of the privileges of concern include: Select_priv, Insert_priv, Update_priv,
    Delete_priv, Drop_priv, and so on. Typically, these privileges should not be available to every MySQL user and often are
    reserved for administrative use only. The information_schema.user_privileges provides a consolidated view of all user
    privileges. The FILE privilege is used to allow or disallow a user from reading and writing files on the server host.
    Any user with the FILE right granted has the ability to: • Read files from the local file system that are readable by
    the MySQL server (this includes world-readable files). • Write files to the local file system where the MySQL server has
    write access. The PROCESS privilege found in the mysql.user table determines whether a given user can see statement execution
    information for all sessions. The SUPER privilege is a powerful and far-reaching privilege and should not be granted lightly.
    The SUPER privilege shown in the INFORMATION_SCHEMA.USER_PRIVILEGES table governs the use of a variety of MySQL features.
    These features include, CHANGE MASTER TO, KILL, mysqladmin kill option, PURGE BINARY LOGS, SET GLOBAL, mysqladmin debug
    option, logging control, and more. The SHUTDOWN privilege simply enables use of the shutdown option to the mysqladmin
    command, which allows a user with the SHUTDOWN privilege the ability to shut down the MySQL server. The CREATE USER privilege
    governs the right of a given user to add or remove users, change existing users'' names, or revoke existing users'' privileges.
    The GRANT OPTION privilege exists in different contexts (mysql.user, mysql.db) for the purpose of governing the ability
    of a privileged user to manipulate the privileges of other users. The REPLICATION SLAVE privilege governs whether a given
    user (in the context of the source server) can request updates that have been made on the source server. DML/DDL includes
    the set of privileges used to modify or create data structures. This includes INSERT, SELECT, UPDATE, DELETE, DROP, CREATE,
    and ALTER privileges. Stored procedure and stored function declarations include a definition of permissions which can
    be used to escalate permissions. It''s important to inspect these settings to ensure they do not unnecessarily escalate
    privileges. The error log contains information about events such as mysqld starting and stopping, when a table needs to
    be checked or repaired, and, depending on the host operating system, stack traces when mysqld fails. MySQL log files can
    be set in the MySQL configuration to exist anywhere on the filesystem. It is common practice to ensure that the system
    filesystem is left uncluttered by application logs. System filesystems include the root (/), /var, or /usr. The log_warnings
    system variable, enabled by default, provides additional information to the MySQL log. A value of 1 enables logging of
    warning messages, and higher integer values tend to enable more logging. The log-raw MySQL option determines whether passwords
    are rewritten by the server so as not to appear in log files as plain text. If log-raw is enabled, then passwords are
    written to the various log files (general query log, slow query log, and binary log) in plain text. Audit logging is not
    really included in the Community Edition of MySQL - only the general log. Using the general log is possible, but not practical,
    because it grows quickly and has an adverse impact on server performance. Nevertheless, enabling audit logging is an important
    consideration for a production environment, and third-party tools do exist to help with this. Enable audit logging for
    • Interactive user sessions • Application sessions (optional) This variable controls the password hashing method used
    by the PASSWORD() function and for the IDENTIFIED BY clause of the CREATE USER and GRANT statements. Before 5.6.6, the
    value can be 0, or 1. As of 5.6.6, the value can be one of the following: • 0 - authenticate with the mysql_native_password
    plugin • 1 - authenticate with the mysql_old_password plugin • 2 - authenticate with the sha256_password plugin This option
    dictates whether the server will deny connections by clients that attempt to use accounts that have their password stored
    in the mysql_old_password format. The [client] section of the MySQL configuration file allows setting a user and password
    to be used. Verify the password option is not used in the global configuration file (my.cnf). NO_AUTO_CREATE_USER is an
    option for sql_mode that prevents a GRANT statement from automatically creating a user when authentication information
    is not provided. Blank passwords allow a user to login without using a password. Password complexity includes password
    characteristics such as length, case, numerical, and character sets. MySQL can make use of host wildcards when granting
    permissions to users on specific databases. For example, you may grant a given privilege to ''<user>''@''%''. Anonymous
    accounts are users with empty usernames (''''). Anonymous accounts have no passwords, so anyone can use them to connect
    to the MySQL server. All network traffic must use SSL/TLS when traveling over untrusted networks. All network traffic
    must use SSL/TLS when traveling over untrusted networks. SSL/TLS should be enforced on a per-user basis for users which
    enter the system through the network. Limiting concurrent connections to a MySQL server can be used to reduce risk of
    Denial of Service (DoS) attacks performed by exhausting connection resources. The replication traffic between servers
    should be secured. Security measures should include ensuring the confidentiality and integrity of the traffic, and performing
    mutual authentication between the servers before performing replication. In the MySQL SLAVE context the setting MASTER_SSL_VERIFY_SERVER_CERT
    indicates whether the SLAVE should verify the MASTER''s certificate. This configuration item may be set to Yes or No,
    and unless SSL has been enabled on the SLAVE, the value will be ignored. The master_info_repository setting determines
    to where a SLAVE logs MASTER status and connection information. The options are FILE or TABLE. Note also that this setting
    is associated with the sync_master_info setting as well. The SUPER privilege found in the mysql.user table governs the
    use of a variety of MySQL features. These features include, CHANGE MASTER TO, KILL, mysqladmin kill option, PURGE BINARY
    LOGS, SET GLOBAL, mysqladmin debug option, logging control, and more. MySQL can make use of host wildcards when granting
    permissions to users on specific databases. For example, you may grant a given privilege to ''<user>''@''%''.'
  rationale: 'Including all configuration, log, key, certificates, and customized files in any backup will ensure the backup
    can fully restore an instance. The attack surface is reduced on a server with only the underlying operating system, MySQL
    server software, and any security or operational tooling that may be additionally installed. A smaller attack surface
    reduces the probability of the data within MySQL being compromised. If the password is visible in the process list or
    user''s shell/command history, an attacker will be able to access the MySQL database using the stolen credentials. Utilizing
    unique database accounts across applications will reduce the impact of a compromised MySQL account. If a user is reused,
    then a compromise of this user will compromise multiple parts of the system and/or application. If a cryptographic material
    is used on multiple MySQL instances and/or systems then a compromise of one may lead to the compromise of the network
    traffic of all servers which use the same cryptographic material. If an attacker gains access to shared cryptographic
    material, including default material, the attacker can reuse that material to impersonate the MySQL server or otherwise
    compromise its operations. Malicious actors regularly attempt to compromise databases by attacking or guessing passwords.
    Stolen credentials may be used to gain access to steal information, engage in financial fraud, and more. By enforcing
    practical and secure policies, end user cooperation grows. In general, longer passwords are better (harder to crack),
    but a forced password length requirement can cause user behavior that is predictable and undesirable. Having a reasonable
    minimum length with no maximum character limit increases the resulting average password length used and thus increases
    the security of that password. The default for backward compatibility on upgraded MySQL databases is aes-128-ecb. Using
    128-bit keys does not provide sufficient security. Regardless of whether breaking the lowest level is beyond existing
    technology, larger key sizes are needed to better protect data and satisfy regulations. This method may be desirable in
    specific cases, including: • The Linux system where MySQL is running is dedicated to the MySQL server and only the MySQL
    DBA and OS Admin have access. • When control over user authentication is centralized in the operating system. • It is
    desirable that audit trails in the database and operating system can use the same user names. • For certain other narrow
    installation use cases auth_socket may be desirable. • Only local connections for a user. Limiting the IP address provides
    additional controls and restrictions on how client applications can connect to MySQL. If not configured to a specific
    IP all IPs for this server can be used to connect to MySQL. Requiring clients attempting to connect to MySQL to use strong
    ciphers protects data in transit. Delaying connection attempts provides a deterrent that slows down brute force attacks
    that attempt to access MySQL user accounts. Limiting the accessibility of these objects will protect the confidentiality,
    integrity, and availability of the MySQL database. If someone other than the MySQL user is allowed to read files from
    the data directory, it may be possible to read data from the mysql.user table which contains passwords. Additionally,
    the ability to create files can lead to denial of service, or might otherwise allow someone to gain access to specific
    data by manually creating a file with a view definition. Limiting the accessibility of these objects will protect the
    confidentiality, integrity, and availability of the MySQL logs. Limiting the accessibility of these objects will protect
    the confidentiality, integrity, and availability of the MySQL logs. Limiting the accessibility of these objects will protect
    the confidentiality, integrity, and availability of the MySQL logs. Limiting the accessibility of these objects will protect
    the confidentiality, integrity, and availability of the MySQL logs. Limiting the accessibility, or existence, of these
    log files will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting the accessibility
    of these objects will protect the confidentiality, integrity, and availability of the MySQL database and the communication
    with the client. If the contents of the SSL key file are known to an attacker, he or she might impersonate the server.
    This can be used for a man-in-the-middle attack. Depending on the SSL cipher suite, the key might also be used to decipher
    previously captured network traffic. Limiting the accessibility of these objects will protect the confidentiality, integrity,
    and availability of the MySQL database. If someone can modify plugins then these plugins might be loaded when the server
    starts and the code will get executed. Maintaining currency with MySQL patches will help reduce risk associated with known
    vulnerabilities present in the MySQL server. Without the latest security patches MySQL might have known vulnerabilities
    which might be used by an attacker to gain access. Dropping example databases will reduce the attack surface of the MySQL
    server. Preventing shared libraries that do not contain user-defined functions from loading will reduce the attack surface
    of the server. Disabling local_infile reduces an attacker''s ability to read sensitive files off the affected server via
    an SQL injection vulnerability. If this option is used, all clients of the affected server will have unrestricted access
    to all databases. Prevents symbolic links being used for data base files. This is especially important when MySQL is executing
    as root as arbitrary files may be overwritten. The symbolic-links option might allow someone to direct actions by to MySQL
    server to other files and/or directories. By default the plugin doesn''t do authentication, which means that anyone with
    access to the TCP/IP port of the plugin can access and modify the data. However, not all data is exposed by default. Setting
    secure_file_priv reduces an attacker''s ability to read sensitive files off the affected server via a SQL injection vulnerability.
    Without strict mode the server tries to proceed with the action when an error might have been a more secure choice. For
    example, by default MySQL will truncate data if it does not fit in a field, which can lead to unknown behavior, or be
    leveraged by an attacker to circumvent data validation. Limiting the accessibility of the mysql database will protect
    the confidentiality, integrity, and availability of the data housed within MySQL. A user which has direct access to mysql.*
    might view password hashes, change permissions, or alter or destroy information intentionally or unintentionally. The
    FILE right allows MySQL users to read files from disk and to write files to disk. This may be leveraged by an attacker
    to further compromise MySQL. It should be noted that the MySQL server should not overwrite existing files. The PROCESS
    privilege allows principals to view currently executing MySQL statements beyond their own, including statements used to
    manage passwords. This may be leveraged by an attacker to compromise MySQL or to gain access to potentially sensitive
    data. The SUPER privilege allows principals to perform many actions, including view and terminate currently executing
    MySQL statements (including statements used to manage passwords). This privilege also provides the ability to configure
    MySQL, such as enable/disable logging, alter data, disable/enable features. Limiting the accounts that have the SUPER
    privilege reduces the chances that an attacker can exploit these capabilities. It is more secure to migrate administrative
    users off SUPER and instead assign the specific and minimal set of mysql Dynamic Privileges needed to perform their tasks.
    The SHUTDOWN privilege allows principals to shutdown MySQL. This may be leveraged by an attacker to negatively impact
    the availability of MySQL. Reducing the number of users granted the CREATE USER right minimizes the number of users able
    to add/drop users, alter existing users'' names, and manipulate existing users'' privileges. The GRANT OPTION privilege
    allows a principal to grant other principals additional privileges. This may be used by an attacker to compromise MySQL.
    The REPLICATION SLAVE privilege allows a principal to fetch binlog files containing all data changing statements and/or
    changes in table data from the master. This may be used by an attacker to read/fetch sensitive data from MySQL. INSERT,
    SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER are powerful privileges in any database. Such privileges should be limited
    only to those users requiring such rights. By limiting the users with these rights and ensuring that they are limited
    to specific databases, the attack surface of the database is reduced. A stored procedure or function that improperly escalates
    privileges may provide unintended access rights which can be improperly used. Enabling error logging can increase the
    ability to detect malicious attempts against MySQL, and other critical messages. For example, if the error log is not
    enabled then a connection error could go unnoticed. When empty, MySQL will send log data to the console. Logging to the
    console is useful, but remember it is ephemeral. This is not recommended due to the fact that logging to console does
    not provide a means to force restricted access via permissions strictly to MySQL and dedicated MySQL audit accounts. This
    may compromise the confidentiality of the MySQL log data. Furthermore use caution if co-mingling log data from multiple
    sources as that can complicate log inspection. Additionally from a security auditing perspective, it’s difficult and error
    prone to verify logging is correct. Moving the MySQL logs off the system partition will reduce the probability of denial
    of service via the exhaustion of available disk space to the operating system. This might help to detect malicious behavior
    by logging communication errors and aborted connections. With raw logging of passwords enabled someone with access to
    the log files might see plain text passwords. Audit logging helps to identify who changed what and when. The audit log
    might be used as evidence in investigations. It might also help to identify what an attacker was able to accomplish. When
    old_passwords is set to 1 the PASSWORD() function will create password hashes with a very weak hashing algorithm which
    might be easy to break if captured by an attacker. Enabling this option will prevent all use of passwords employing the
    old format (and hence insecure communication over the network). Using the password parameter may negatively impact the
    confidentiality of the user''s password. Blank passwords negate the benefits provided by authentication mechanisms. Without
    this setting an administrative user might accidentally create a user without a password. Without a password only knowing
    the username and the list of allowed hosts will allow someone to connect to the server and assume the identity of the
    user. This, in effect, bypasses authentication mechanisms. Complex passwords help mitigate dictionary, brute forcing,
    and other password attacks. This recommendation prevents users from choosing weak passwords which can easily be guessed.
    Avoiding the use of wildcards within hostnames helps control the specific locations from which a given user may connect
    to and interact with the database. Removing anonymous accounts will help ensure that only identified and trusted principals
    are capable of interacting with MySQL. Enabling Secure Sockets Layer (SSL) will allow clients to encrypt network traffic
    and verify the identity of the server. The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-in-the-middle
    attacks. The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-inthe-middle attacks. Limiting the
    number of concurrent sessions at the server and per user level helps to reduce the risk of DoS attacks. MySQL provides
    mechanisms to limit the number of simultaneous connections that can be made at the server level or by any given account.
    The replication traffic should be secured as it gives access to all transferred information and might leak passwords.
    When SSL is in use certificate verification is important to authenticate the party to which a connection is being made.
    In this case, the SLAVE (client) should verify the MASTER''s (server''s) certificate to authenticate the MASTER prior
    to continuing the connection. The password which the client uses is stored in the MASTER info repository, which by default
    is a plaintext file. The TABLE MASTER info repository is a bit safer, but with filesystem access it''s still possible
    to gain access to the password the SLAVE is using. The SUPER privilege allows principals to perform many actions, including
    view and terminate currently executing MySQL statements (including statements used to manage passwords). This privilege
    also provides the ability to configure MySQL, such as enable/disable logging, alter data, disable/enable features. Limiting
    the accounts that have the SUPER privilege reduces the chances that an attacker can exploit these capabilities. Avoiding
    the use of wildcards within hostnames helps control the specific locations from which a given user may connect to and
    interact with the database.'
  impact: 'Care must be taken that to ensure applications or services that are required for proper operation of the operating
    system are not removed. Custom applications may need to be modified to accommodate database connections over the network
    rather than on the use (e.g., using TCP/IP connections). Additional hardware and operating system licenses may be required
    to make the architectural change. Depending on the remediation chosen, additional steps may need to be undertaken like:
    • Entering a password when prompted. • Ensuring the file permissions on .my.cnf is restricted yet accessible by the user.
    • Using mysql_config_editor to encrypt the authentication credentials in .mylogin.cnf. Additionally, not all scripts/applications
    may be able to use .mylogin.cnf. Enforcing too much complexity or length may be difficult for users to memorize. This
    may cause users to use predictable patterns or other bad practices, resulting in weaker passwords. Configuring a key length
    of 256 may impact backwards compatibility. Things to consider when using the operating system to authenticate users: •
    The user must have an operating system account on the computer which must be accessed. • If a user has logged in using
    this method and steps away from the terminal, another user could easily log in because this user does not need any passwords
    or credentials. This could pose a serious security problem. • When an operating system is used to authenticate database
    users, managing distributed database environments and database links requires special care. Special care must also be
    taken not to leave such a terminal unlocked and unattended. Hence, we recommend that you carefully evaluate your requirements
    before opting for auth_socket. • This will not work where distributed connections are required. Connections attempting
    to use an unsupported cipher will fail. Changing the permissions and ownership of the relay logs and binary log files
    might have impact on external tools. If the permissions on the relay logs and binary log files are accidentally changed
    to exclude the user account which is used to run the MySQL service, then this might break replication. The binary log
    file can be used for point-in-time recovery so this can also affect backup, restore, and disaster recovery procedures.
    Changing the permissions of the error log files might have impact on monitoring tools which use an error log file adapter.
    Changing the permissions of the log files may impact monitoring tools which use a log file adapter. Also, the slow query
    log can be used for performance analysis by application developers. The information about the performance exists in MySQL
    performance_schema or sys schema views. In cases where the information you need is within a running MySQL, disable the
    slow query log and instead use these methods as they are more secure and do not require OS login and access. If the permissions
    on the relay logs and binary log files are accidentally changed to exclude the user account which is used to run the MySQL
    service, then this might break replication. The binary log file can be used for point in time recovery so this can also
    affect backup, restore and disaster recovery procedures. Changing the permissions of the general log files may impact
    monitoring tools which use a log file adapter. If the permissions or ownership for the SSL key file are configured incorrectly,
    this can cause SSL to be disabled when MySQL is restarted or can cause MySQL not to start at all. If other applications
    are using the same key pair, then changing the permissions or ownership of the SSL key file will affect this application.
    If this were to occur a new key pair must be generated for MySQL. Users other than the MySQL user will no longer be able
    to update and add/remove plugins unless they''re able to switch to the MySQL user. To update the MySQL server a restart
    is required. Disabling local_infile will impact the functionality of solutions that rely on it. Solutions that rely on
    loading data from various sub-directories may be negatively impacted by this change. Consider consolidating load directories
    under a common parent directory. The server checks the value of secure_file_priv at startup and writes a warning to the
    error log if the value is insecure. A non-NULL value is considered insecure if it is empty, or the value is the data directory
    or a subdirectory of it, or a directory that is accessible by all users. Applications relying on the MySQL database should
    be aware that STRICT_ALL_TABLES is in use, such that error conditions are handled appropriately. Users denied the PROCESS
    privilege may also be denied use of SHOW ENGINE. When the SUPER privilege is denied to a given user, that user will be
    unable to take advantage of certain capabilities, such as certain mysqladmin options. Users that are denied the CREATE
    USER privilege will not only be unable to create a user, but they may be unable to drop a user, rename a user, or otherwise
    revoke a given user''s privileges. Accounts having credentials stored using the old password format will be unable to
    login. Execute the following command to identify accounts that will be impacted by implementing this setting: SELECT User,Host
    FROM mysql.user WHERE plugin=''mysql_old_password''; Remediation for this recommendation requires a server restart. Any
    applications relying on anonymous database access will be adversely affected by this change. Enabling SSL will allow clients
    to encrypt network traffic and verify the identity of the server. This could have impact on network traffic inspection.
    When SSL/TLS is enforced then clients which do not use SSL will not be able to connect. If the server is not configured
    for SSL/TLS then accounts for which SSL/TLS is mandatory will not be able to connect. When the replication traffic is
    not secured someone might be able to capture passwords and other sensitive information when sent to the slave. When using
    CHANGE MASTER to, be aware of the following: • SLAVE processes need to be stopped prior to executing CHANGE MASTER to.
    • Use of CHANGE MASTER to starts new relay logs without keeping the old ones unless explicitly told to keep them. • When
    CHANGE MASTER to is invoked, some information is dumped to the error log (previous values for MASTER_HOST, MASTER_PORT,
    MASTER_LOG_FILE, and MASTER_LOG_POS). • Invoking CHANGE MASTER to will implicitly commit any ongoing transactions in the
    session where the CHANGE MASTER to was run, but not all ongoing transactions on the database. When the SUPER privilege
    is denied to a given user, that user will be unable to take advantage of certain capabilities, such as certain mysqladmin
    options.'
