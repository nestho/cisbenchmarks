  audit_raw: "Check if these files are in use and are saved in the backup.\n• Edited Configuration files (my.cnf and included\
    \ files)\n• Files related to Key Management and Keyring (KMIP, other Key Management\nServices)\n• Audit Log Files (if\
    \ not handled by other methods)\n• SSL files (certificates, keys)\n• User Defined Functions (UDFs)\n• Source code for\
    \ customizations\nVerify there are no other roles enabled for the underlying operating system and that no\nadditional\
    \ applications or services unrelated to the proper operation of the MySQL\nserver software are installed.\nCheck the process\
    \ or task list if the password is visible.\nCheck the shell or command history if the password is visible.\nEach user\
    \ should be linked to one of these:\n• system accounts\n• a person\n• an application\nTo list users (and exclude mysql\
    \ reserved users):\nSELECT host, user, plugin,\n  IF(plugin = 'mysql_native_password',\n 'WEAK SHA1', 'STRONG SHA2') AS\
    \ HASHTYPE\nFROM mysql.user WHERE user NOT IN\n  ('mysql.infoschema', 'mysql.session', 'mysql.sys') AND\n  plugin NOT\
    \ LIKE 'auth%' AND plugin <> 'mysql_no_login' AND\n  LENGTH(authentication_string) > 0\nORDER BY plugin;\nReview all cryptographic\
    \ material. If it is default, used for other MySQL instances and/or\nfor purposes other than MySQL then this is a finding.\n\
    Review the server certificate by running:\ncd <data_dir and/or ssl_cert>\nsudo openssl x509 -in server-cert.pem -subject\
    \ -noout | grep\nAuto_Generated_Server_Certificate\nThe output for the auto generated pem will look something like:\n\
    subject= /CN=MySQL_Server_5.6.51_Auto_Generated_Server_Certificate\nIf no rows return, the check is a pass since the certificate\
    \ is not MySQL auto-generated.\nInspect the password policy settings.\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM information_schema.global_variables\n\
    WHERE VARIABLE_NAME like 'valid%password%';\nCompare the results to the table below.\n+--------------------------------------+---------------------------------+\n\
    | Variable_name                        | Value                           |\n+--------------------------------------+---------------------------------+\n\
    | validate_password_dictionary_file    | '<FILENAME OF DICTIONARY FILE>' |\n| validate_password_length             | 14\
    \                              |\n| validate_password_mixed_case_count   | 1                               |\n| validate_password_number_count\
    \       | 1                               |\n| validate_password_policy             | STRONG                         \
    \ |\n| validate_password_special_char_count | 1                               |\n+--------------------------------------+---------------------------------+\n\
    Run the following statement:\nselect @@block_encryption_mode;\nA value other than aes-256-* is a fail.\nWhere * is one\
    \ of the following - ECB, CBC, CFB1, CFB8, CFB128, OFB\nTo assess this recommendation run the following:\nSELECT PLUGIN_NAME,\
    \ PLUGIN_STATUS\n       FROM INFORMATION_SCHEMA.PLUGINS\n       WHERE PLUGIN_NAME LIKE 'auth%';\nTo determine users who\
    \ can use auth socket:\nselect user, host, plugin from mysql.user where plugin = 'auth_socket';\nIf this is enabled and\
    \ the organization does not allow use of this feature, this is a fail.\nIf host is not the localhost or an unauthorized\
    \ user is listed, this is a fail.\nRun the following statement:\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM information_schema.global_variables\n\
    WHERE VARIABLE_NAME = 'bind_address';\nNo rows returned implies a fail.\nRun the following statement:\nSELECT VARIABLE_NAME,\
    \ VARIABLE_VALUE\nFROM information_schema.global_variables\nWHERE VARIABLE_NAME='ssl_cipher';\nIf ssl_cipher is not set\
    \ to ECDHE-ECDSA-AES128-GCM-SHA256, this is a fail.\nDetermine if the plugins for delaying connections are installed.\n\
    SELECT PLUGIN_NAME, PLUGIN_STATUS\n       FROM INFORMATION_SCHEMA.PLUGINS\n       WHERE PLUGIN_NAME LIKE 'connection%';\n\
    Two rows should be returned showing ACTIVE status.\nCONNECTION_CONTROL                       | ACTIVE\nCONNECTION_CONTROL_FAILED_LOGIN_ATTEMPTS\
    \ | ACTIVE\nIf both plugins are not active, this is a fail.\nNext assess the setting for the connection controls by running\n\
    SELECT VARIABLE_NAME, VARIABLE_VALUE\n       FROM information_schema.global_variables WHERE VARIABLE_NAME LIKE\n'connection_control%';\n\
    Time doubling throttling (in minutes) between each retry (0, 1, 2, 4, 8, etc.) with a\npermanent account lockout (IT reset\
    \ required) after 12 retries.\nIf connection_control_failed_connections_threshold is less than 5 (attempts), this is\n\
    a fail.\nIf connection_control_min_connection_delay is less than 60000 (ms - 1 minute), this is\na fail.\nMax delay connection_control_max_connection_delay\
    \ is 0 or less than 1920000 (ms, 32\nminutes) a, this is a fail.\nFinally, assess the failed login attempts.\nselect host,\
    \ user, JSON_EXTRACT(user_attributes,\n'$.Password_locking.failed_login_attempts') as failed_login_attempts from\nmysql.user;\n\
    If failed login attempts is less than 12 this is a fail.\nPerform the following steps to assess this recommendation:\n\
    • Execute the following SQL statement to determine the Value of datadir\nshow variables where variable_name = 'datadir';\n\
    Or\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM information_schema.global_variables\nWHERE VARIABLE_NAME LIKE 'datadir';\n\
    • Execute the following command at a terminal prompt\nsudo ls -ld <datadir> | grep \"drwxr-x---.*mysql.*mysql\"\nLack\
    \ of output implies a fail.\nPerform the following steps to assess this recommendation:\n1. Execute the following SQL\
    \ statement to determine the Value of\nlog_bin_basename\nshow variables like 'log_bin_basename';\n2. Execute the following\
    \ command at a terminal prompt to list all non-compliant\nlog_bin_basename.* file permissions\nls -l | egrep \"^-(?![r|w]{2}-[r|w]{2}----\n\
    .\\*mysql\\s\\*mysql).\\*<log_bin_basename>.\\*$\nLack of output implies compliance.\nPerform the following steps to assess\
    \ this recommendation:\n1. Execute the following SQL statement to determine the Value of log_error:\nshow variables like\
    \ 'log_error';\n2. Execute the following command at a terminal prompt to list all non-compliant\n<log_error>.* file permissions:\n\
    ls -l /usr/local/mysql/data/mysqld.local.err | grep '^-rw-------\n.*mysql.*mysql.*$'\nLack of output implies a fail.\n\
    Perform the following steps to assess this recommendation:\n1. Execute the following SQL statement to determine the Value\
    \ of slow_query_log:\nshow variables like 'slow_query_log';\nBest for the slow query log to be disabled indicated by OFF.\n\
    2. Execute the following SQL statement to determine the location of\nslow_query_log_file:\nshow variables like 'slow_query_log_file';\n\
    3. Execute the following command at a terminal prompt to list non-compliant\n<slow_query_log_file>.* file permissions:\n\
    ls -l | egrep \"^-(?![r|w]{2}-[r|w]{2}----\n.*mysql\\s*mysql).*<slow_query_log_file>.*$\nIf the slow query log is enabled,\
    \ lack of output implies compliance.\nIf the slow query log is disabled, remove any old slow query log files.\nPerform\
    \ the following steps to assess this recommendation:\n1. Execute the following SQL statement to determine the Value of\n\
    relay_log_basename:\nshow variables like 'relay_log_basename';\n2. Execute the following command at a terminal prompt\
    \ to list non-compliant\n<relay_log_basename>.* file permissions:\nls -l | egrep \"^-(?![r|w]{2}-[r|w]{2}----\n.*mysql\\\
    s*mysql).*<relay_log_basename>.*$\nLack of output implies compliance.\nPerform the following steps to assess this recommendation:\n\
    1. Execute the following SQL statement to determine the Values of general_log\nand general_log_file:\nselect @@general_log,\
    \ @@general_log_file;\nWith a general_log value of 0 or OFF, indicates the log is disabled. If 1 or ON it is\nenabled.\n\
    2. Whether the value is 0, OFF, 1 or ON execute the following command at a terminal\nprompt to list non-compliant <general_log_file>.*\
    \ file permissions:\nls -l <general_log_file>\nIf general_log is 0 or OFF (disabled) and the log file exists, remove the\
    \ old general log\nfile.\nIf general_log is 1 or ON (enabled) review the permissions\nls -l <general_log_file> grep '^-rw-------.*mysql.*mysql'\n\
    Lack of output implies compliance.\nPerform the following steps to assess this recommendation:\n1. Locate the SSL keys\
    \ and certs in use by executing the following SQL statement.\nTo show all ssl variables:\nSELECT VARIABLE_VALUE FROM information_schema.global_variables\n\
    WHERE VARIABLE_NAME RLIKE '^.*ssl_(ca|capath|cert|crl|crlpath|key)$'\nAND VARIABLE_VALUE <> '';\nNote: Any mysqlx_% values\
    \ that are null default to the classic protocols\nequivalent value.\n2. Execute the following commands at a terminal prompt\
    \ to list non-compliant\n<ssl_file> file permissions:\nls -l | egrep \"^-(?!r-{8}.*mysql\\s*mysql).*<ssl_file>.*$\"\n\
    Lack of output implies compliance\nTo assess this recommendation, execute the following SQL statement to discover the\n\
    Value of plugin_dir:\nshow variables where variable_name = 'plugin_dir';\nThen, execute the following command at a terminal\
    \ prompt (using the discovered\nplugin_dir Value) to determine the permissions and ownership.\nls -ld <plugin_dir Value>\
    \ | grep \"dr-xr-x---\\|dr-xr-xr--\" | grep \"plugin\"\nLack of output implies a fail.\nNote: Permissions are intended\
    \ to be either 550 or 554.\nExecute the following SQL statement to identify the MySQL server version:\nSHOW VARIABLES\
    \ WHERE Variable_name LIKE \"version\";\nNow compare the version with the security announcements from Oracle and/or the\
    \ OS if\nthe OS packages are used.\nExecute the following SQL statement to determine if the test database is present:\n\
    SELECT * FROM information_schema.SCHEMATA where SCHEMA_NAME not in\n('mysql','information_schema', 'sys', 'performance_schema');\n\
    If this is a production system, and a database name includes an example or test\ndatabase this is a finding.\nCommon example\
    \ database names are:\n• employees\n• world\n• world_x\n• sakila\n• airportdb\n• menagerie\nPerform the following to determine\
    \ if the recommended state is in place:\n• Ensure --allow-suspicious-udfs is not specified in the the mysqld start up\n\
    command line.\n• Ensure allow-suspicious-udfs is set to OFF in the MySQL configuration:\nmy_print_defaults mysqld | grep\
    \ allow-suspicious-udfs\nNo results returned would be a pass.\nExecute the following SQL statement:\nSHOW VARIABLES WHERE\
    \ Variable_name = 'local_infile';\nEnsure the value returned is OFF.\nPerform the following to determine if the recommended\
    \ state is in place:\n• Open the MySQL configuration (e.g. my.cnf) file and search for skip-granttables\n• Ensure skip-grant-tables\
    \ is set to FALSE\nExecute the following SQL statement to assess this recommendation:\nSHOW variables LIKE 'have_symlink';\n\
    Ensure the Value returned is DISABLED.\nExecute the following SQL statement to assess this recommendation:\nSHOW DATABASES\
    \ LIKE 'innodb_memcache';\nEnsure that no rows are returned.\nExecute the following SQL statement and ensure one row is\
    \ returned:\nSHOW GLOBAL VARIABLES WHERE Variable_name = 'secure_file_priv';\nThe Value should either contain NULL (thus\
    \ is disabled entirely) or a valid path. If set to\nan empty string this is a fail.\nTo audit for this recommendation,\
    \ execute the following query:\nSHOW VARIABLES LIKE 'sql_mode';\n+---------------+------------------------+\n| Variable_name\
    \ | Value                  |\n+---------------+------------------------+\n| sql_mode      | NO_ENGINE_SUBSTITUTION |\n\
    +---------------+------------------------+\nIf STRICT_ALL_TABLES is not in the list returned, this is a fail.\nExecute\
    \ the following SQL statement(s) to assess this recommendation:\nselect * from information_schema.user_privileges\nwhere\
    \ grantee not like ('\\'mysql.%localhost\\'');\nEnsure all users returned are administrative users with minimal privileges\
    \ required.\nNote: The above query ignores MySQL internal reserved accounts.\nExecute the following SQL statement to audit\
    \ this setting:\nSELECT GRANTEE FROM INFORMATION_SCHEMA.USER_PRIVILEGES\nWHERE PRIVILEGE_TYPE = 'FILE';\nEnsure only administrative\
    \ users are returned in the result set.\nExecute the following SQL statement to audit this setting:\nSELECT GRANTEE FROM\
    \ INFORMATION_SCHEMA.USER_PRIVILEGES\nWHERE PRIVILEGE_TYPE = 'PROCESS’;\nEnsure only administrative users are returned\
