    user-defined functions from loading will reduce the attack surface of the server. For MySQL client programs and connectors
    prior to 8.0.21, disabling local_infile reduces an attacker''s ability to read sensitive files off the affected server
    via an SQL injection vulnerability. If this option is used, all clients of the affected server will have unrestricted
    access to all databases. Prevents symbolic links from being used for database files. This is especially important when
    MySQL is executing as root as arbitrary files may be overwritten. The symboliclinks option might allow someone to direct
    actions by the MySQL server to other files and/or directories. Setting secure_file_priv reduces an attacker''s ability
    to read sensitive files off the affected server via a SQL injection vulnerability. Without strict mode the server tries
    to proceed with the action when an error might have been a more secure choice. For example, by default MySQL will truncate
    data if it does not fit in a field, which can lead to unknown behavior, or be leveraged by an attacker to circumvent data
    validation. File system based encryption does a good job of protecting against data theft on devices unable to limit physical
    access. It does not, however, protect against users who have or gain access to the operating system, backups, over the
    network copies, etc. Encrypting data from mysqld adds an additional layer of data protection. Limiting the accessibility
    of the mysql database will protect the confidentiality, integrity, and availability of the data housed within MySQL. A
    user which has direct access to mysql.* might view password hashes, change permissions, or alter or destroy information
    intentionally or unintentionally. The FILE right allows MySQL users to read files from disk and to write files to disk.
    This may be leveraged by an attacker to further compromise MySQL. It should be noted that the MySQL server should not
    overwrite existing files. The PROCESS privilege allows principals to view currently executing MySQL statements beyond
    their own, including statements used to manage passwords. This may be leveraged by an attacker to compromise MySQL or
    to gain access to potentially sensitive data. The SUPER privilege allows principals to perform many actions, including
    view and terminate currently executing MySQL statements (including statements used to manage passwords). This privilege
    also provides the ability to configure MySQL, such as enable/disable logging, alter data, disable/enable features. Limiting
    the accounts that have the SUPER privilege reduces the chances that an attacker can exploit these capabilities. It is
    more secure to migrate administrative users off SUPER and instead assign the specific and minimal set of mysql Dynamic
    Privileges needed to perform their tasks. The SHUTDOWN privilege allows principals to shutdown MySQL. This may be leveraged
    by an attacker to negatively impact the availability of MySQL. Reducing the number of users granted the CREATE USER right
    minimizes the number of users able to add/drop users, alter existing users'' names, and manipulate existing users'' privileges.
    The GRANT OPTION privilege allows a principal to grant other principals additional privileges. This may be used by an
    attacker to compromise MySQL. The REPLICATION SLAVE privilege allows a principal to fetch binlog files containing all
    data changing statements and/or changes to table data from the source. This may be used by an attacker to read/fetch sensitive
    data from MySQL. INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER are powerful privileges in any database. Such
    privileges should be limited only to those users requiring such rights. By limiting the users with these rights and ensuring
    that they are limited to specific databases, the attack surface of the database is reduced. A stored procedure or function
    that improperly escalates privileges may provide unintended access rights which can be improperly used. Enabling a user
    to create a view, stored procedure or function that improperly escalates privileges may provide unintended access rights
    which can be improperly used. Side Note: The previous versions of MySQL users required a grant to SET_USER_ID privilege
    to create procedures with DEFINER set. Enabling a user to create a view, stored procedure or function and later create
    a user that improperly escalates privileges may provide unintended access rights which can be improperly used. Enabling
    error logging can increase the ability to detect malicious attempts against MySQL, and other critical messages. For example,
    if the error log is not enabled then a connection error could go unnoticed. When configured to stderr MySQL will send
    log data to the console. Logging to the console is useful, but remember it is ephemeral. This is not recommended due to
    the fact that logging to console does not provide a means to force restricted access via permissions strictly to MySQL
    and dedicated MySQL audit accounts. This may compromise the confidentiality of the MySQL log data. Furthermore use caution
    if comingling log data from multiple sources as that can complicate log inspection. Additionally from a security auditing
    perspective, it’s difficult and error prone to verify logging is correct using stderr or redirected stderr. Moving the
    MySQL logs off the system partition will reduce the probability of denial of service via the exhaustion of available disk
    space to the operating system. This might help to detect malicious behavior by logging communication errors and aborted
    connections. With raw logging of passwords enabled someone with access to the log files might see plain text passwords.
    MySQL Native Authentication relies on the Secure Hash Algorithm 1 (SHA1) algorithm and the National Institute of Standards
    and Technology (NIST) has suggested to stop using it. The MySQL Native Authentication plugin leverages this weak hashing
    algorithm that can be quickly brute forced. Using the password parameter may negatively impact the confidentiality of
    the user''s password. Without a password only knowing the username and the list of allowed hosts will allow someone to
    connect to the server and assume the identity of the user. This, in effect, bypasses authentication mechanisms. The default_password_lifetime
    global variable prevents a password being set for an indefinite period. Excessive password expiration requirements do
    more harm than good, because these requirements make users select predictable passwords, composed of sequential words
    and numbers that are closely related to each other. More importantly, when events occur that could compromise password
    security account passwords should be expired immediately. Complex passwords help mitigate dictionary, brute forcing, and
    other password attacks. This recommendation prevents users from choosing weak passwords which can easily be guessed. Avoiding
    the use of wildcards within hostnames helps control the specific locations from which a given user may connect to and
    interact with the database. Removing anonymous accounts will help ensure that only identified and trusted principals are
    capable of interacting with MySQL. Enabling Secure Sockets Layer (SSL) will allow clients to encrypt network traffic and
    verify the identity of the server. The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-in-the-middle
    attacks. The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-inthe-middle attacks. Limiting the
    number of concurrent sessions at the server and per user level helps to reduce the risk of DoS attacks. MySQL provides
    mechanisms to limit the number of simultaneous connections that can be made at the server level or by any given account.
    The replication traffic should be secured as it gives access to all transferred information and might leak passwords.
    When SSL is in use certificate verification is important to authenticate the party to which a connection is being made.
    In this case, the REPLICA (client) should verify the SOURCE''s (server''s) certificate to authenticate the SOURCE prior
    to continuing the connection. The SUPER privilege allows principals to perform many actions, including view and terminate
    currently executing MySQL statements (including statements used to manage passwords). This privilege also provides the
    ability to configure MySQL, such as enable/disable logging, alter data, disable/enable features. Limiting the accounts
    that have the SUPER privilege reduces the chances that an attacker can exploit these capabilities. SSL encryption ensures
    data cannot be seen over the network for Group Replication. When using MySQL InnoDB Cluster by specifying the allowlist
    explicitly, you can increase the security of your cluster as only servers in the allowlist are allowed to connect to the
    cluster.'
  impact: 'Care must be taken that applications or services that are required for proper operation of the operating system
    are not removed. Custom applications may need to be modified to accommodate database connections over the network rather
    than on the use (e.g., using TCP/IP connections). Additional hardware and operating system licenses may be required to
    make the architectural change. Depending on the remediation chosen, additional steps may need to be undertaken like: •
    Entering a password when prompted. • Ensuring the file permissions on .my.cnf is restricted yet accessible by the user.
    • Using mysql_config_editor to encrypt the authentication credentials in .mylogin.cnf. • Use a pluggable secure password
    store, e.g., a keychain. • In the case of shell don''t authenticate until mysqlsh is started, then use \connect Additionally,
    not all scripts/applications may be able to use .mylogin.cnf. If the original password isn''t removed upon completion
    of the password rotation process, the potential risk for a compromise is increased. Configuring a key length of 256 may
    impact backwards compatibility. Things to consider when using the operating system to authenticate users: • The user must
    have an operating system account on the computer which must be accessed. • If a user has logged in using this method and
    steps away from the terminal, another user could easily log in because this user does not need any passwords or credentials.
    This could pose a serious security problem. • When an operating system is used to authenticate database users, managing
    distributed database environments and database links requires special care. Special care must also be taken not to leave
    such a terminal unlocked and unattended. Hence, we recommend that you carefully evaluate your requirements before opting
    for auth_socket. • This will not work where distributed connections are required. Connections attempting to use an unsupported
    version of TLS or Cipher will fail. Connections attempting to use an unsupported cipher will fail. Changing the permissions
    and ownership of the relay logs and binary log files might have impact on external tools. If the permissions on the relay
    logs and binary log files are accidentally changed to exclude the user account which is used to run the MySQL service,
    then this might break replication. The binary log file can be used for point-in-time recovery so this can also affect
    backup, restore, and disaster recovery procedures. Changing the permissions of the error log files might have impact on
    monitoring tools which use an error log file adapter. Changing the permissions of the log files may impact monitoring
    tools which use a log file adapter. Also, the slow query log can be used for performance analysis by application developers.
    The information about the performance exists in MySQL performance_schema or sys schema views. In cases where the information
    you need is within a running MySQL, disable the slow query log and instead use these methods as they are more secure and
    do not require OS login and access. If the permissions on the relay logs and binary log files are accidentally changed
    to exclude the user account which is used to run the MySQL service, then this might break replication. The binary log
    file can be used for point in time recovery so this can also affect backup, restore and disaster recovery procedures.
    Changing the permissions of the general log files may impact monitoring tools which use a log file adapter. If the permissions
    or ownership for the SSL key file are configured incorrectly, this can cause SSL to be disabled when MySQL is restarted
    or can cause MySQL not to start at all. If other applications are using the same key pair, then changing the permissions
    or ownership of the SSL key file will affect this application. If this were to occur a new key pair must be generated
    for MySQL. Users other than the MySQL user will no longer be able to update and add/remove plugins unless they''re able
    to switch to the MySQL user. To update the MySQL server a restart is required. Disabling local_infile will impact the
    functionality of solutions that rely on it. Solutions that rely on loading data from various sub-directories may be negatively
    impacted by this change. Consider consolidating load directories under a common parent directory. The server checks the
    value of secure_file_priv at startup and writes a warning to the error log if the value is insecure. A non-NULL value
    is considered insecure if it is empty, or the value is the data directory or a subdirectory of it, or a directory that
    is accessible by all users. Applications relying on the MySQL database should be aware that STRICT_ALL_TABLES is in use,
    such that error conditions are handled appropriately. Users denied the PROCESS privilege may also be denied use of SHOW
    ENGINE. When the SUPER privilege is denied to a given user, that user will be unable to take advantage of certain capabilities,
    such as certain mysqladmin options. Users that are denied the CREATE USER privilege will not only be unable to create
    a user, but they may be unable to drop a user, rename a user, or otherwise revoke a given user''s privileges. The global
    configuration is by default readable for all users on the system. This is needed for global defaults (prompt, port, socket,
    etc.). If a password is present in this file then all users on the system may be able to access it. Scripted clients or
    users dependent on automated login in a controlled environment will need to consider their authentication procedures.
    The server will accept the user but the user is placed in restricted mode. In restricted mode, operations performed within
    the session result in an error until the user establishes a new account password. Any applications relying on anonymous
    database access will be adversely affected by this change. Enabling SSL could have impact on network traffic inspection.
    When SSL/TLS is enforced then clients which do not use SSL will not be able to connect. If the server is not configured
    for SSL/TLS then accounts for which SSL/TLS is mandatory will not be able to connect. When the replication traffic is
    not secured someone might be able to capture passwords and other sensitive information when sent to the replica. When
    using CHANGE REPLICATION SOURCE TO, (CHANGE MASTER is deprecated as of 8.0.23) be aware of the following: • REPLICA processes
    need to be stopped prior to executing CHANGE SOURCE TO • Use of CHANGE REPLICATION SOURCE TO starts new relay logs without
    keeping the old ones unless explicitly told to keep them • When CHANGE REPLICATION SOURCE TO is invoked, some information
    is dumped to the error log (previous values for SOURCE_HOST, SOURCE_PORT, SOURCE_LOG_FILE, and SOURCE_LOG_POS) • Invoking
    CHANGE REPLICATION SOURCE TO will implicitly commit any ongoing transactions in the session where the CHANGE REPLICATION
    SOURCE was run, but not all ongoing transactions on the database. When the SUPER privilege is denied to a given user,
    that user will be unable to take advantage of certain capabilities, such as certain mysqladmin options.'
