  description: 'The binlog_encryption system variable may be used to configure encryption of the binary and relay logs. This
    may be configured to ON even if binary logging is not enabled in order to encrypt relay log files. It is recommended that
    MySQL Server software be installed on a dedicated server. This architectural consideration affords flexibility in that
    the database server can be placed on a separate zone allowing access only from particular hosts and over particular protocols.
    When a command is executed on the command line, for example mysql -u admin -p password or mysqlsh -u admin -p password,
    the password may be visible in the user''s shell/command history or in the process list. Database user accounts should
    not be reused for multiple applications or users. The cryptographic material used by MySQL, such as digital certificates
    and encryption keys, should be used only for MySQL and only for one instance. Default cryptographic material should not
    be used since it is not unique to the instance. Password expiration provides users with a unique time bounded password
    lifetime. Disabling password reuse, enforcing password strength, and denying reuse can be implemented to prevent successful
    usage of stolen or previously guessed passwords by malicious users. Restricted accounts using passwords on the basis of
    the number of password changes and length ensure a password cannot be chosen from a specified number of the most recent
    passwords. Require the current password for password reset. Dual passwords act as a tool to encourage password rotations
    in cases where a synchronized password change is not viable. By having a time delta to have old and new passwords in place,
    the process of replacing old passwords with new passwords within applications is simplified. If users with accounts will
    not be using their account for some time, to reduce the risk of attacks or inappropriate account usage or if suspicions
    exist that an account might be under attack, disabling the account will secure it and once it''s ready to resume use it
    can easily be re-enabled. A block encryption mode with a Cipher Block Chaining (CBC) mode value and key length of 256
    is recommended when using the AES_ENCRYPT() and AES_DECRYPT() functions for encryption. The server-side auth_socket authentication
    plugin, authenticates clients that connect to the MySQL server from the local host through the Unix socket file. Users
    authenticated by the auth_socket need not specify a password when connecting to the server. However, users authenticated
    by the auth_socket plugin are restricted from connecting remotely; they can only connect from the local host through the
    Unix socket file. This method is only suitable in situations where the server administrator OS account access is restricted.
    By default, the MySQL server accepts TCP/IP connections from MySQL user accounts on all server host IPv6 and IPv4 interfaces.
    You can make this configuration more restrictive by setting the bind_address configuration option to a specific IPv4 or
    IPv6 address so that the server only accepts TCP/IP connections on that address. MySQL supports multiple protocols of
    TLS. The higher the version the stronger the security and/or better the performance. Client-side certificates may be used
    as proof of identity as well as to encrypt data in transit. MySQL supports multiple encryption ciphers. Ciphers can vary
    in strength, speed and overhead. MySQL Server can enable administrators to introduce an increasing delay in server response
    to clients after a certain number of consecutive failed connection attempts. Install, configure, and use OpenSSL on a
    platform that has a NIST certified FIPS 140-2 installation of OpenSSL. This provides MySQL instances the ability to generate
    and validate cryptographic hashes to protect unclassified information requiring confidentiality and cryptographic protection,
    in accordance with the data owner''s requirements. The data directory is the location of the MySQL databases. MySQL can
