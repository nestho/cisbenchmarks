    \ as failed_login_attempts from\nmysql.user;\nIf failed login attempts is less than 12 this is a fail.\nFor MySQL to support\
    \ FIPS mode, these system requirements must be satisfied:\n1. MySQL must be compiled with an OpenSSL version that is certified\
