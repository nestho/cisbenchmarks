  audit_raw: "To audit this setting, run the following command:\nSELECT VARIABLE_NAME, VARIABLE_VALUE, 'BINLOG - At Rest Encryption'\
    \ as Note\nFROM performance_schema.global_variables where variable_name =\n'binlog_encryption';\nEnsure it is set to ON.\n\
    Verify there are no other roles enabled for the underlying operating system and that no\nadditional applications or services\
    \ unrelated to the proper operation of the MySQL\nserver software are installed.\nCheck the process or task list if the\
    \ password is visible.\nCheck the shell or command history if the password is visible.\nEach user (excluding mysql reserved\
    \ users) should be linked to one of these:\n• system accounts\n• a person\n• an application\nTo list users (and exclude\
    \ mysql reserved users):\nSELECT host, user, plugin,\n  IF(plugin = 'mysql_native_password',\n 'WEAK SHA1', 'STRONG SHA2')\
    \ AS HASHTYPE\nFROM mysql.user WHERE user NOT IN\n  ('mysql.infoschema', 'mysql.session', 'mysql.sys') AND\n  plugin NOT\
    \ LIKE 'auth%' AND plugin <> 'mysql_no_login' AND\n  LENGTH(authentication_string) > 0\nORDER BY plugin;\nReview all cryptographic\
    \ material. If it is default, used for other MySQL instances and/or\nfor purposes other than MySQL then this is a finding.\n\
    Review the server certificate by running:\ncd <data_dir and/or ssl_cert>\nsudo openssl x509 -in server-cert.pem -subject\
    \ -noout | grep\nAuto_Generated_Server_Certificate\nThe output for the auto generated pem will look something like:\n\
    subject= /CN=MySQL_Server_8.0.21_Auto_Generated_Server_Certificate\nIf no rows return, the check is a pass since the certificate\
    \ is not MySQL auto-generated.\nThe global password lifetime is set using default_password_lifetime. If the value of\n\
    default_password_lifetime is greater than 0, it indicates the permitted password\nlifetime.\nExecute the following command\
    \ to check the global password lifetime:\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM performance_schema.global_variables\
    \ where VARIABLE_NAME like\n'default_password_lifetime';\nA value greater than 365 implies a fail.\nWhen the global password\
    \ lifetime is less than or equal to 365, or not configured, each\nuser account shall be checked by executing the following\
    \ command:\nSELECT user, host, password_lifetime from mysql.user where password_lifetime\n= 0 OR password_lifetime > 365;\n\
    A lack of results implies compliance.\nNote: A value of 0 implies the password never expires.\nTo assess this recommendation\
    \ run the following statement:\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM performance_schema.global_variables where VARIABLE_NAME\
    \ in\n('password_history', 'password_reuse_interval');\nA value of 0 indicates that NO policy is defined for the associated\
    \ variable.\nThe password_history variable indicates the number of subsequent account\npassword changes that must occur\
    \ before the password can be reused. The\npassword_history should be greater than or equal to 5, thus attempts to use\
    \ any of\nthe prior five, or more, passwords for this account will be denied.\nThe password_reuse_interval defines the\
    \ global policy for controlling reuse of\nprevious passwords based on time elapsed. For an account password used previously,\n\
    this variable indicates the number of days that must pass before the password can be\nreused.\nPassword should not be\
    \ reused over the period of a year. The value of\npassword_reuse_interval should be greater than or equal to 365.\nRun\
    \ the following statement:\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM performance_schema.global_variables where VARIABLE_NAME\
    \ in\n('password_require_current');\nThe return value should be ON.\nTo determine which users currently have dual passwords,\
    \ run the following command:\nSELECT user, host FROM mysql.user WHERE length(user_attributes-\n>\"$.additional_password\"\
    )>0;\nIf an account has a dual password and the process of password rotation has completed,\nthis is a fail.\nReview the\
    \ locked status of accounts:\nselect user, host, account_locked from mysql.user;\nAccounts not in use and MySQL Reserved\
    \ accounts should show as locked (Y).\nRun the following statement:\nselect @@block_encryption_mode;\nA value other than\
    \ aes-256-* is a fail.\nWhere * is one of the following - ECB, CBC, CFB1, CFB8, CFB128, OFB\nTo assess this recommendation\
