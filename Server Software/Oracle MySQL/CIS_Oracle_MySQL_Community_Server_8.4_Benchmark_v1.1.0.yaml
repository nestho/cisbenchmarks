  rationale: 'The database, and thus the binary and relay logs, may contain sensitive information. Encrypting the binary and
    relay logs protects all data stored in these logs from internal and external threats. The attack surface is reduced on
    a server with only the underlying operating system, MySQL server software, and any security or operational tooling that
    may be additionally installed. A smaller attack surface reduces the probability of the data within MySQL being compromised.
    If the password is visible in the process list or user''s shell/command history, an attacker will be able to access the
    MySQL database using the stolen credentials. Utilizing unique database accounts across applications will reduce the impact
    of a compromised MySQL account. If a user is reused, then a compromise of this user will compromise multiple parts of
    the system and/or application. If a cryptographic material is used on multiple MySQL instances and/or systems, then a
    compromise of one may lead to the network traffic of all servers being compromised that use the same cryptographic material.
    If an attacker gains access to shared cryptographic material, including default material, the attacker can reuse that
    material to impersonate the MySQL server or otherwise compromise its operations. Allows additional security factors pertinent
    to a specific user to provide further password security; predetermined by varying security needs and usability requirements
    in a system or organization. Repeated use of old passwords can increase risk of a compromise. This may lead to access
    by malicious users who have discovered a user''s prior password(s). Requiring a prior password for password reset enables
    DBAs to prevent users from changing a password without proving that they know the current password. Such changes could
    otherwise occur, for example, if one user walks away from a terminal session temporarily without logging out, and a malicious
    user uses the session to change the original user''s MySQL password. This can have unfortunate consequences; the most
    problematic being the malicious user can access MySQL with the user''s changed credentials. Too often passwords used by
    applications are not changed regularly because of the difficulty in timing for propagating the new password, keeping the
    applications connected, and connection failures due to race conditions. If it is difficult to perform a synchronized change
    you can optionally use dual passwords to simplify the task of password rotation. Only have active accounts that will be
    used. The default for backward compatibility on upgraded MySQL databases is aes-128-ecb. Using 128-bit keys does not provide
    sufficient security. Regardless of whether breaking the lowest level is beyond existing technology, larger key sizes are
    needed to better protect data and satisfy regulations. This method may be desirable in specific cases, including: • The
    Linux system where MySQL is running is dedicated to the MySQL server and only the MySQL DBA and OS Admin have access.
    • When control over user authentication is centralized in the operating system. • It is desirable that audit trails in
    the database and operating system can use the same user names. • For certain other narrow installation use cases auth_socket
    may be desirable. • Only local connections for a user. Limiting the IP address provides additional controls and restrictions
    on how client applications can connect to MySQL. If not configured to a specific IP all IPs for this server can be used
    to connect to MySQL. Requiring clients attempting to connect to MySQL to use higher versions of TLS to better protect
    data in transit. Requiring client-side certificates provides additional validation of a user''s identity, thus increasing
    the level of security, while also providing strong encryption. Requiring clients attempting to connect to MySQL to use
    strong ciphers protects data in transit. Delaying connection attempts provides a deterrent that slows down brute force
    attacks that attempt to access MySQL user accounts. Federal Information Processing Standards 140-2 (FIPS 140-2) describes
    a security standard that can be required by Federal (US Government) agencies for cryptographic modules used to protect
    sensitive or valuable information. To be considered acceptable for such Federal use, a cryptographic module must be certified
    for FIPS 140-2. If a system intended to protect sensitive data lacks the proper FIPS 140-2 certificate, Federal agencies
    cannot purchase it. Products such as OpenSSL can be used in FIPS mode, although the OpenSSL library itself is not validated
    for FIPS. Instead, the OpenSSL library is used with the OpenSSL FIPS Object Module to enable OpenSSL-based applications
    to operate in FIPS mode. For general information about FIPS and its implementation in OpenSSL, these references may be
    helpful: • National Institute of Standards and Technology FIPS PUB 140-2 • OpenSSL FIPS 140-2 Security Policy • fips_module
    manual page Limiting the accessibility of these objects will protect the confidentiality, integrity, and availability
    of the MySQL database. If someone other than the MySQL user is allowed to read files from the data directory, it may be
    possible to read data from the mysql.user table which contains passwords. Additionally, the ability to create files can
    lead to denial of service, or might otherwise allow someone to gain access to specific data by manually creating a file
    with a view definition. Limiting the accessibility of these objects will protect the confidentiality, integrity, and availability
