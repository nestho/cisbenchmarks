    used, the functionality should be disabled entirely by setting --secure-file-priv to NULL. When data changing statements
    are made (i.e., INSERT, UPDATE), MySQL can handle invalid or missing values differently depending on whether strict SQL
    mode is enabled. When strict SQL mode is enabled, data may not be truncated or otherwise "adjusted" to make the data changing
    statement work. Transparent Data Encryption (TDE) at-rest encryption protects your critical data by enabling data-at-rest
    encryption in the database. It protects the privacy of your information, prevents data breaches and helps meet regulatory
    requirements. The mysql.user, mysql.db, and other mysql tables ending in _priv list a variety of privileges that can be
    granted (or denied) to MySQL users. Some of the privileges of concern include: Select_priv, Insert_priv, Update_priv,
    Delete_priv, Drop_priv, and so on. Typically, these privileges should not be available to every MySQL user and often are
    reserved for administrative use only. The information_schema.user_privileges provides a consolidated view of all user
    privileges. The FILE privilege is used to allow or disallow a user from reading and writing files on the server host.
    Any user with the FILE right granted has the ability to: • Read files from the local file system that are readable by
    the MySQL server (this includes world-readable files). • Write files to the local file system where the MySQL server has
    write access. The PROCESS privilege found in the mysql.user table determines whether a given user can see statement execution
    information for all sessions. The SUPER privilege is a powerful and far-reaching privilege and should not be granted lightly.
    In MySQL 8.0, SUPER is deprecated and will be removed in a future version of MySQL. The SUPER privilege shown in the INFORMATION_SCHEMA.USER_PRIVILEGES
    table governs the use of a variety of MySQL features. These features include, CHANGE MASTER TO, KILL, mysqladmin kill
    option, PURGE BINARY LOGS, SET GLOBAL, mysqladmin debug option, logging control, and more. In MySQL 8.0, SUPER is deprecated
    and will be removed in a future version of MySQL. Migrating Accounts from SUPER to Dynamic Privileges is recommended.
    The SHUTDOWN privilege simply enables use of the shutdown option to the mysqladmin command, which allows a user with the
    SHUTDOWN privilege the ability to shut down the MySQL server. The CREATE USER privilege governs the right of a given user
    to add or remove users, change existing users'' names, or revoke existing users'' privileges. The GRANT OPTION privilege
    exists in different contexts (mysql.user, mysql.db) for the purpose of governing the ability of a privileged user to manipulate
    the privileges of other users. The REPLICATION SLAVE privilege governs whether a given user (in the context of the source
    server) can request updates that have been made on the source server. DML/DDL includes the set of privileges used to modify
    or create data structures. This includes INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER privileges. Stored procedure
    and stored function declarations include a definition of permissions which can be used to escalate permissions. It''s
    important to inspect these settings to ensure they do not unnecessarily escalate privileges. Its critical to limit users
    ability to set and effective authorization ID that is used with executing a view or stored program. This grant provides
    a method to escalate privileges within MySQL views and procedures. A user with this privilege can specify any account
    as the DEFINER attribute for CREATE PROCEDURE, CREATE FUNCTION, CREATE TRIGGER, CREATE EVENT, ALTER EVENT, CREATE VIEW,
    and ALTER VIEW. Without this privilege, only the effective authentication ID can be specified. Its critical to limit users
    ability to set and effective authorization ID that is used with executing a view or stored program. This grant provides
    a method to escalate privileges within MySQL views and procedures. A user with this privilege can specify an nonexisting
    account as the DEFINER attribute for CREATE PROCEDURE, CREATE FUNCTION, CREATE TRIGGER, CREATE EVENT, ALTER EVENT, CREATE
    VIEW, and ALTER VIEW. Later a user with escalated privileges could be created, providing unintended access rights which
    can be improperly used. This permission is often needed temporarily when performing database migration. Once a migration
    is complete this permission is typically no longer necessary and should be removed. The error log contains information
    about events such as mysqld starting and stopping, when a table needs to be checked or repaired, and, depending on the
    host operating system, stack traces when mysqld fails. MySQL log files can be set in the MySQL configuration to exist
    anywhere on the filesystem. It is common practice to ensure that the system filesystem is left uncluttered by application
    logs. System filesystems include the root (/), /var, or /usr. The log_error_verbosity system variable, set to 2 by default,
    specifies the verbosity of events sent to the MySQL error log. A value of 2 enables logging of error and warning messages,
    a value of 3 also includes informational logging, a value of 1 logs only errors. The log-raw MySQL option determines whether
    passwords are rewritten by the server so as not to appear in log files as plain text. If log-raw is enabled, then passwords
    are written to the various log files (general query log, slow query log, and binary log) in plain text. Define your authentication
    policy by setting the mysql system variable authentication_policy. The default value of authentication_policy is ''*,,''.
    This means that factor 1 is required in account definitions and can use any authentication plugin (with caching_sha2_password
    being the default), and that factors 2 and 3 are optional and each can use any authentication plugin. Note the The default_authentication_plugin
    was deprecated in MySQL 8.0.27, and removed from 8.4. Use authentication_policy instead. The –default-authentication-plugin
    system variable governs two things: • Authentication plugin used by a new user account if a plugin is not specified explicitly
    through CREATE USER statement • Initial authentication data payload generated by server in case of a new connection. Caching
    SHA-2 Authentication is the default in MySQL 8.4. It provides stronger password protection than the prior Native Authentication
    and provides better performance than SHA2 Authentication. Alternatively, there are additional methods to securely connect
    using Lightweight Directory Access Protocol (LDAP) and Active Directory authentication. The [client] section of the MySQL
