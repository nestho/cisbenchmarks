  audit_raw: "Check if these files are in used and are saved in the backup.\nVerify there are no other roles enabled for the\
    \ underlying operating system and that no\nadditional applications or services unrelated to the proper operation of the\
    \ MySQL server\nsoftware are installed.\nCheck the process or task list if the password is visible.\nCheck the shell or\
    \ command history if the password is visible.\nEach user should be linked to one of these\n• system accounts\n• a person\n\
    • an application\nCheck if the certificate is bound to one instance of MySQL.\nPerform the following steps to assess this\
    \ recommendation:\n• Execute the following SQL statement to determine the Value of datadir\n show variables where variable_name\
    \ = 'datadir';\n• Execute the following command at a terminal prompt\n ls -l <datadir>/.. | egrep \"^d[r|w|x]{3}------\\\
    s*.\\s*mysql\\s*mysql\\s*\\d*.*mysql\"\nLack of output implies a finding.\nPerform the following steps to assess this\
    \ recommendation:\n• Identify the basename of binary log files (log_bin_basename) by executing the\nfollowing statement\n\
    show variables like 'log_bin_basename';\n• Verify permissions are 660 for mysql:mysql on each log file of the form\nlog_bin_basename.nnnnnn.\n\
    Perform the following steps to assess this recommendation:\n• Find the log_error value (<error_log_path>) by executing\
    \ the following statement\nshow variables like 'log_error';\n• Verify permissions are 660 for mysql:mysql for <error_log_path>\n\
    Perform the following steps to assess this recommendation:\n• Find the slow_query_log value (<slow_query_log_path>) by\
    \ executing the\nfollowing statement\nshow variables like 'slow_query_log_file';\n• Verify permissions are 660 for mysql:mysql\
    \ for <slow_query_log_path>\nPerform the following steps to assess this recommendation:\nFind the relay_log_basename value\
    \ by executing the following statement\nshow variables like 'relay_log_basename';\n• Verify permissions are 660 for mysql:mysql\
    \ for each file of the\nform <relay_log_basename>\nPerform the following steps to assess this recommendation:\n• Find\
    \ the general_log_file value by executing the following statement\nshow variables like 'general_log_file';\n• Verify permissions\
    \ are 660 for mysql:mysql for the indicated general_log_file.\nTo assess this recommendation, locate the SSL key in use\
    \ by executing the following SQL\nstatement to get the Value of ssl_key:\nshow variables where variable_name = 'ssl_key';\n\
    Then, execute the following command to assess the permissions of the Value:\n ls -l <ssl_key Value> | egrep \"^-r--------[\
    \ \\t]*.[ \\t]*mysql[ \\t]*mysql.*$\"\nLack of output from the above command implies a finding.\nTo assess this recommendation,\
    \ execute the following SQL statement to discover the Value\nof plugin_dir:\n show variables where variable_name = 'plugin_dir';\n\
    Then, execute the following command at a terminal prompt (using the discovered\nplugin_dir Value) to determine the permissions.\n\
    \ ls -l <plugin_dir Value>/.. | egrep \"^drwxr[-w]xr[-w]x[ \\t]*[0-9][ \\t]*mysql[\n\\t]*mysql.*plugin.*$\"\nLack of output\
    \ implies a finding.\nNOTE: Permissions are intended to be either 775 or 755.\nExecute the following SQL statement to\
    \ identify the MySQL server version:\nSHOW VARIABLES WHERE Variable_name LIKE \"version\";\nNow compare the version with\
    \ the security announcements from Oracle and/or the OS if\nthe OS packages are used.\nExecute the following SQL statement\
    \ to determine if the test database is present:\n SHOW DATABASES LIKE 'test';\nThe above SQL statement will return zero\
    \ rows\nPerform the following to determine if the recommended state is in place:\n• Ensure --allow-suspicious-udfs is\
    \ not specified in the the mysqld start\nup command line.\n• Ensure allow-suspicious-udfs is set to FALSE in the MySQL\
    \ configuration:\n• my_print_defaults mysqld | grep allow-suspicious-udfs\nNo results returned would be a pass.\nExecute\
    \ the following SQL statement and ensure the Value field is set to OFF:\nSHOW VARIABLES WHERE Variable_name = 'local_infile';\n\
    Perform the following to determine if the recommended state is in place:\n• Open the MySQL configuration (e.g. my.cnf)\
    \ file and search for skip-grant-tables\n• Ensure skip-grant-tables is set to FALSE\nExecute the following SQL statement\
    \ to assess this recommendation:\n SHOW variables LIKE 'have_symlink';\nEnsure the Value returned is DISABLED.\nExecute\
    \ the following SQL statement to assess this recommendation:\nSELECT * FROM information_schema.plugins WHERE PLUGIN_NAME='daemon_memcached'\n\
    Ensure that no rows are returned.\nExecute the following SQL statement and ensure one row is returned:\nSHOW GLOBAL VARIABLES\
    \ WHERE Variable_name = 'secure_file_priv' AND Value<>'';\nNote: The Value should contain a valid path.\nTo audit for\
    \ this recommendation execute the following query:\nSHOW VARIABLES LIKE 'sql_mode';\nEnsure that STRICT_ALL_TABLES is\
    \ in the list returned.\nExecute the following SQL statement(s) to assess this recommendation:\nSELECT user, host\nFROM\
    \ mysql.user\nWHERE (Select_priv = 'Y')\n OR (Insert_priv = 'Y')\n OR (Update_priv = 'Y')\n OR (Delete_priv = 'Y')\n OR\
    \ (Create_priv = 'Y')\n OR (Drop_priv = 'Y');\nSELECT user, host\nFROM mysql.db\nWHERE db = 'mysql'\n  AND ((Select_priv\
    \ = 'Y')\n    OR (Insert_priv = 'Y')\n    OR (Update_priv = 'Y')\n    OR (Delete_priv = 'Y')\n    OR (Create_priv = 'Y')\n\
    \ OR (Drop_priv = 'Y'));\nEnsure all users returned are administrative users.\n53 | P a g e\nExecute the following SQL\
    \ statement to audit this setting\nselect user, host from mysql.user where File_priv = 'Y';\nEnsure only administrative\
    \ users are returned in the result set.\nExecute the following SQL statement to audit this setting:\nselect user, host\
    \ from mysql.user where Process_priv = 'Y';\nEnsure only administrative users are returned in the result set.\nExecute\
    \ the following SQL statement to audit this setting:\nselect user, host from mysql.user where Super_priv = 'Y';\nEnsure\
    \ only administrative users are returned in the result set.\nExecute the following SQL statement to audit this setting:\n\
    \ SELECT user, host FROM mysql.user WHERE Shutdown_priv = 'Y';\nEnsure only administrative users are returned in the result\
    \ set.\nExecute the following SQL statement to audit this setting:\nSELECT user, host FROM mysql.user WHERE Create_user_priv\
    \ = 'Y';\nEnsure only administrative users are returned in the result set.\nExecute the following SQL statements to audit\
    \ this setting:\n SELECT user, host FROM mysql.user WHERE Grant_priv = 'Y';\n SELECT user, host FROM mysql.db WHERE Grant_priv\
    \ = 'Y';\nEnsure only administrative users are returned in the result set.\nExecute the following SQL statement to audit\
    \ this setting:\n SELECT user, host FROM mysql.user WHERE Repl_slave_priv = 'Y';\nEnsure only accounts designated for\
    \ slave users are granted this privilege.\n Execute the following SQL statement to audit this setting:\nSELECT User,Host,Db\n\
    FROM mysql.db\nWHERE Select_priv='Y'\n  OR Insert_priv='Y'\n  OR Update_priv='Y'\n  OR Delete_priv='Y'\n  OR Create_priv='Y'\n\
    \  OR Drop_priv='Y'\n OR Alter_priv='Y';\nEnsure all users returned should have these privileges on the indicated databases.\n\
    NOTE: Global grants are covered in Recommendation 4.1.\n63 | P a g e\nExecute the following SQL statement to audit this\
    \ setting:\n SHOW variables LIKE 'log_error';\nEnsure the Value returned is not empty.\nExecute the following SQL statement\
    \ to assess this recommendation:\n SELECT @@global.log_bin_basename;\nEnsure the value returned does not indicate root\
    \ ('/'), /var, or /usr.\nExecute the following SQL statement to assess this recommendation:\nSHOW GLOBAL VARIABLES LIKE\
    \ 'log_warnings';\nEnsure the Value returned equals 2.\nVerify that a third-party tool is installed and configured to\
    \ enable logging for interactive\nuser sessions and (optionally) applications sessions.\nPerform the following actions\
    \ to assess this recommendation:\n• Open the MySQL configuration file (my.cnf)\n• Ensure the log-raw entry is present\n\
    • Ensure the log-raw entry is set to OFF\nExecute the following SQL statement to assess this recommendation:\nSHOW VARIABLES\
    \ WHERE Variable_name = 'old_passwords';\nEnsure the Value field is not set to 1 or ON.\nExecute the following SQL statement\
    \ and ensure the Value field is not set to ON:\nSHOW VARIABLES WHERE Variable_name = 'secure_auth';\nTo assess this recommendation,\
    \ perform the following steps:\n• Open the MySQL configuration file (e.g. my.cnf)\n• Examine the [client] section of the\
    \ MySQL configuration file and ensure password\nis not employed.\nExecute the following SQL statements to assess this\
    \ recommendation:\n SELECT @@global.sql_mode;\n SELECT @@session.sql_mode;\nEnsure that each result contains NO_AUTO_CREATE_USER.\n\
    Execute the following SQL query to determine if any users have a blank password:\nSELECT User,host\nFROM mysql.user\n\
    WHERE (plugin IN('mysql_native_password', 'mysql_old_password','')\n AND (LENGTH(Password) = 0\n OR Password IS NULL))\n\
    OR (plugin='sha256_password' AND LENGTH(authentication_string) = 0);\nNo rows will be returned if all accounts have a\
    \ password set.\nExecute the following SQL statements to assess this recommendation:\n SHOW VARIABLES LIKE 'validate_password%';\n\
    The result set from the above statement should show:\n• validate_password_length should be 14 or more\n• validate_password_mixed_case_count\
    \ should be 1 or more\n• validate_password_number_count should be 1 or more\n• validate_password_special_char_count should\
    \ be 1 or more\n• validate_password_policy should be MEDIUM or STRONG\nThe following lines should be present in the global\
    \ configuration:\n plugin-load=validate_password.so\n validate-password=FORCE_PLUS_PERMANENT\nCheck if users have a password\
    \ which is identical to the username:\nSELECT User,Password,Host FROM mysql.user\nWHERE password=CONCAT('*', UPPER(SHA1(UNHEX(SHA1(user)))));\n\
    \ NOTE: This method is only capable of checking the post-4.1 password format which is also\nknown as mysql_native_password.\n\
    77 | P a g e\nExecute the following SQL statement to assess this recommendation:\n SELECT user, host FROM mysql.user WHERE\
    \ host = '%';\nEnsure no rows are returned.\nExecute the following SQL query to identify anonymous accounts:\nSELECT user,host\
    \ FROM mysql.user WHERE user = '';\nThe above query will return zero rows if no anonymous accounts are present.\nExecute\
    \ the following SQL statements to assess this recommendation:\nSHOW variables WHERE variable_name = 'have_ssl';\nEnsure\
    \ the Value returned is YES.\nNOTE: have_openssl is an alias for have_ssl as of MySQL 5.0.38.  MySQL can be build\nwith\
    \ OpenSSL or YaSSL.\nExecute the following SQL statements to assess this recommendation:\nSELECT user, host, ssl_type\
    \ FROM mysql.user\nWHERE NOT HOST IN ('::1', '127.0.0.1', 'localhost');\nEnsure the ssl_type for each user returned is\
    \ equal to ANY, X509, or SPECIFIED.\nNOTE: have_openssl is an alias for have_ssl as of MySQL 5.0.38.  MySQL can be built\
    \ with\nOpenSSL or YaSSL.\nCheck if the replication traffic is using\n• A private network\n• A VPN\n• SSL/TLS\n• A SSH\
    \ Tunnel\nExecute the following SQL statement to assess this recommendation:\nSHOW GLOBAL VARIABLES LIKE 'master_info_repository';\n\
    The result should be TABLE instead of FILE.\nNOTE: There also should not be a master.info file in the datadir.\nTo assess\
    \ this recommendation, issue the following statement:\n select ssl_verify_server_cert from mysql.slave_master_info;\n\
    Verify the value of ssl_verify_server_cert is 1.\nExecute the following SQL statement to audit this setting:\nselect user,\
    \ host from mysql.user where user='repl' and Super_priv = 'Y';\nNo rows should be returned.\nNOTE: Substitute your replication\
    \ user's name for repl in the above query.\nThe 'repl' user can be found in SHOW SLAVE STATUS by looking for:\nMaster_User:\n\
    Execute the following SQL statement to assess this recommendation:\n SELECT user, host FROM mysql.user WHERE user='repl'\
    \ AND host = '%';\nEnsure no rows are returned."
  remediation: "Add these files to the backup\nRemove excess applications or services and/or remove unnecessary roles from\
    \ the\nunderlying operating system.\nUse -p without password and then enter the password when prompted, use a properly\n\
    secured .my.cnf file, or store authentication information in encrypted format in\n.mylogin.cnf.\nAdd/Remove users so that\
    \ each user is only used for one specific purpose.\nGenerate a new certificate/key per MySQL instance.\nExecute the following\
    \ commands at a terminal prompt:\n chmod 700 <datadir>\n chown mysql:mysql <datadir>\n30 | P a g e\n3.2 Ensure 'log_bin_basename'\
    \ Files Have Appropriate Permissions\n(Scored)\nExecute the following command for each log file location requiring corrected\
    \ permissions:\n chmod 660 <log file>\n chown mysql:mysql <log file>\n31 | P a g e\nExecute the following command for\
    \ each log file location requiring corrected permissions:\n chmod 660 <log file>\n chown mysql:mysql <log file>\nExecute\
    \ the following command for each log file location requiring corrected permissions:\n chmod 660 <log file>\n chown mysql:mysql\
    \ <log file>\n34 | P a g e\nExecute the following command for each log file location requiring corrected permissions:\n\
    \ chmod 660 <log file>\n chown mysql:mysql <log file>\n36 | P a g e\nExecute the following command for each log file location\
    \ requiring corrected permissions:\n chmod 660 <log file>\n chown mysql:mysql <log file>\nExecute the following commands\
    \ at a terminal prompt to remediate this setting using the\nValue from the audit procedure:\n chown mysql:mysql <ssl_key\
    \ Value>\n chmod 400 <ssl_key Value>\n39 | P a g e\nTo remediate this setting, execute the following commands at a terminal\
    \ prompt using the\nplugin_dir Value from the audit procedure.\n chmod 775 <plugin_dir Value> (or use 755)\n chown mysql:mysql\
    \ <plugin_dir Value>\nInstall the latest patches for your version or upgrade to the latest version.\nExecute the following\
    \ SQL statement to drop the test database:\nDROP DATABASE \"test\";\nNote: mysql_secure_installation performs this operation\
    \ as well as other securityrelated activities.\nPerform the following to establish the recommended state:\n• Remove --allow-suspicious-udfs\
    \ from the mysqld start up command line.\n• Remove allow-suspicious-udfs from the MySQL option file.\nAdd the following\
    \ line to the [mysqld] section of the MySQL configuration file and restart\nthe MySQL service:\nlocal-infile=0\nPerform\
    \ the following to establish the recommended state:\n• Open the MySQL configuration (e.g. my.cnf) file and set:\n skip-grant-tables\
    \ = FALSE\nPerform the following actions to remediate this setting:\n• Open the MySQL configuration file (my.cnf)\n• Locate\
    \ skip_symbolic_links in the configuration\n• Set the skip_symbolic_links to YES\nNOTE: If skip_symbolic_links does not\
    \ exist, add it to the configuration file in the mysqld\nsection.\nTo remediate this setting, issue the following command\
    \ in the MySQL command-line client:\nuninstall plugin daemon_memcached;\nThis uninstalls the memcached plugin from the\
    \ MySQL server.\nAdd the following line to the [mysqld] section of the MySQL configuration file and restart\nthe MySQL\
    \ service:\nsecure_file_priv=<path_to_load_directory>\nPerform the following actions to remediate this setting:\n1. Add\
    \ STRICT_ALL_TABLES to the sql_mode in the server's configuration file\nPerform the following actions to remediate this\
    \ setting:\n1. Enumerate non-administrative users resulting from the audit procedure\n2. For each non-administrative user,\
    \ use the REVOKE statement to remove privileges as\nappropriate\nPerform the following steps to remediate this setting:\n\
    1. Enumerate the non-administrative users found in the result set of the audit\nprocedure\n2. For each user, issue the\
    \ following SQL statement (replace \"<user>\" with the nonadministrative user:\nREVOKE FILE ON *.* FROM '<user>';\nPerform\
    \ the following steps to remediate this setting:\n1. Enumerate the non-administrative users found in the result set of\
    \ the audit\nprocedure\n2. For each user, issue the following SQL statement (replace \"<user>\" with the nonadministrative\
    \ user:\nREVOKE PROCESS ON *.* FROM '<user>';\nPerform the following steps to remediate this setting:\n1. Enumerate the\
    \ non-administrative users found in the result set of the audit\nprocedure\n2. For each user, issue the following SQL\
    \ statement (replace \"<user>\" with the nonadministrative user:\nREVOKE SUPER ON *.* FROM '<user>';\nPerform the following\
    \ steps to remediate this setting:\n1. Enumerate the non-administrative users found in the result set of the audit\nprocedure\n\
    2. For each user, issue the following SQL statement (replace \"<user>\" with the nonadministrative user):\n REVOKE SHUTDOWN\
    \ ON *.* FROM '<user>';\nPerform the following steps to remediate this setting:\n1. Enumerate the non-administrative users\
    \ found in the result set of the audit\nprocedure\n2. For each user, issue the following SQL statement (replace \"<user>\"\
    \ with the nonadministrative user):\nREVOKE CREATE USER ON *.* FROM '<user>';\nPerform the following steps to remediate\
    \ this setting:\n1. Enumerate the non-administrative users found in the result sets of the audit\nprocedure\n2. For each\
    \ user, issue the following SQL statement (replace \"<user>\" with the nonadministrative user:\n REVOKE GRANT OPTION ON\
    \ *.* FROM <user>;\nPerform the following steps to remediate this setting:\n1. Enumerate the non-slave users found in\
    \ the result set of the audit procedure\n2. For each user, issue the following SQL statement (replace \"<user>\" with\
    \ the nonslave user):\n REVOKE REPLICATION SLAVE ON *.* FROM <user>;\nUse the REVOKE statement to remove the SUPER privilege\
    \ from users who shouldn't have\nit.\nPerform the following steps to remediate this setting:\n1. Enumerate the unauthorized\
    \ users, hosts, and databases returned in the result set of\nthe audit procedure\n2. For each user, issue the following\
    \ SQL statement (replace \"<user>\" with the\nunauthorized user, \"<host>\" with host name, and \"<database>\" with the\
    \ database\nname):\n REVOKE SELECT ON <host>.<database> FROM <user>;\n REVOKE INSERT ON <host>.<database> FROM <user>;\n\
    \ REVOKE UPDATE ON <host>.<database> FROM <user>;\n REVOKE DELETE ON <host>.<database> FROM <user>;\n REVOKE CREATE ON\
    \ <host>.<database> FROM <user>;\n REVOKE DROP ON <host>.<database> FROM <user>;\n REVOKE ALTER ON <host>.<database> FROM\
    \ <user>;\n64 | P a g e\n6 Auditing and Logging\nThis section provides guidance with respect to MySQL's logging behavior.\n\
    6.1 Ensure 'log_error' Is Not Empty (Scored)\nPerform the following actions to remediate this setting:\n1. Open the MySQL\
    \ configuration file (my.cnf or my.ini)\n2. Set the log-error option to the path for the error log\nPerform the following\
    \ actions to remediate this setting:\n1. Open the MySQL configuration file (my.cnf)\n2. Locate the log-bin entry and set\
    \ it to a file not on root ('/'), /var, or /usr\nPerform the following actions to remediate this setting:\n• Open the\
    \ MySQL configuration file (my.cnf)\n• Ensure the following line is found in the mysqld section\nlog-warnings = 2\nAcquire\
    \ a third-party MySQL logging solution as available from a variety of sources\nincluding, but not necessarily limited\
    \ to, the following:\n• The General Query Log\n• MySQL Enterprise Audit\n• MariaDB Audit Plugin for MySQL\n• McAfee MySQL\
    \ Audit\nPerform the following actions to remediate this setting:\n• Open the MySQL configuration file (my.cnf)\n• Find\
    \ the log-raw entry and set it as follows\n log-raw = OFF\nConfigure mysql to leverage the mysql_native_password or sha256_password\
    \ plugin. For\nmore information, see:\n• http://dev.mysql.com/doc/refman/5.6/en/password-hashing.html\n• http://dev.mysql.com/doc/refman/5.6/en/sha256-authentication-plugin.html\n\
    70 | P a g e\nAdd the following line to [mysqld] portions of the MySQL option file to establish the\nrecommended state:\n\
    secure_auth=ON\nUse the mysql_config_editor to store authentication credentials in .mylogin.cnf in\nencrypted form.\n\
    If not possible, use the user-specific options file, .my.cnf., and restricting file access\npermissions to the user identity.\n\
