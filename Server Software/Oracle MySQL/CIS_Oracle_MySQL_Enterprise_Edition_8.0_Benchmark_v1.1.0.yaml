  profile:
  - "Level\t2\t-\tMySQL\tRDBMS\ton\tLinux"
  - "Level\t2\t-\tMySQL\tRDBMS"
  description: "The\tbinlog_encryption\tsystem\tvariable\tmay\tbe\tused\tto\tconfigure\tencryption\tof\tthe\tbinary and\t\
    relay\tlogs.\tThis\tmay\tbe\tconfigured\tto\tON\teven\tif\tbinary\tlogging\tis\tnot\tenabled\tin\torder to\tencrypt\t\
    relay\tlog\tfiles. It\tis\trecommended\tthat\tMySQL\tServer\tsoftware\tbe\tinstalled\ton\ta\tdedicated\tserver.\tThis\
    \ architectural\tconsideration\taffords\tflexibility\tin\tthat\tthe\tdatabase\tserver\tcan\tbe\tplaced\ton\ta separate\t\
    zone\tallowing\taccess\tonly\tfrom\tparticular\thosts\tand\tover\tparticular\tprotocols. When\ta\tcommand\tis\texecuted\t\
    on\tthe\tcommand\tline,\tfor\texample\tmysql -u admin -p password\tor\tmysqlsh -u admin -p password,\tthe\tpassword\t\
    may\tbe\tvisible\tin\tthe\tuser's shell/command\thistory\tor\tin\tthe\tprocess\tlist. Database\tuser\taccounts\tshould\t\
    not\tbe\treused\tfor\tmultiple\tapplications\tor\tusers. The\tcryptographic\tmaterial\tused\tby\tMySQL,\tsuch\tas\tdigital\t\
    certificates\tand\tencryption\tkeys, should\tbe\tused\tonly\tfor\tMySQL\tand\tonly\tfor\tone\tinstance.\tDefault\tcryptographic\t\
    material should\tnot\tbe\tused\tsince\tit\tis\tnot\tunique\tto\tthe\tinstance. Password\texpiration\tprovides\tusers\t\
    with\ta\tunique\ttime\tbounded\tpassword\tlifetime. Passwords\tthat\tare\ttoo\tcomplex\tin\tnature\tmake\tit\tharder\t\
    for\tusers\tto\tremember,\tleading\tto bad\tpractices.\tIn\taddition,\tcomposition\trequirements\tprovide\tno\tdefense\t\
    against\tcommon attack\ttypes\tsuch\tas\tsocial\tengineering\tor\tinsecure\tpassword\tstorage.\tIn\tkeeping\twith\tthe\
    \ overall\tgoal\tof\thaving\tusers\tcreate\ta\tpassword\tthat\tis\tnot\toverly\tweak,\tit's\tbest\tto\thave\tat least\t\
    14\tcharacters\tfor\ta\tpassword\tonly\taccount. Disabling\tpassword\treuse,\tenforcing\tpassword\tstrength,\tand\tdenying\t\
    reuse\tcan\tbe implemented\tto\tprevent\tsuccessful\tusage\tof\tstolen\tor\tpreviously\tguessed\tpasswords\tby malicious\t\
    users. Restricted\taccounts\tusing\tpasswords\ton\tthe\tbasis\tof\tthe\tnumber\tof\tpassword\tchanges\tand length\tensure\t\
    a\tpassword\tcannot\tbe\tchosen\tfrom\ta\tspecified\tnumber\tof\tthe\tmost\trecent passwords. Require\tthe\tcurrent\t\
    password\tfor\tpassword\treset. Dual\tpasswords\tact\tas\ta\ttool\tto\tencourage\tpassword\trotations\tin\tcases\twhere\t\
    a synchronized\tpassword\tchange\tis\tnot\tviable.\tBy\thaving\ta\ttime\tdelta\tto\thave\told\tand\tnew passwords\tin\t\
    place,\tthe\tprocess\tof\treplacing\told\tpasswords\twith\tnew\tpasswords\twithin applications\tis\tsimplified. If\tusers\t\
    with\taccounts\twill\tnot\tbe\tusing\ttheir\taccount\tfor\tsome\ttime,\tto\treduce\tthe\trisk\tof attacks\tor\tinappropriate\t\
    account\tusage\tor\tif\tsuspicions\texist\tthat\tan\taccount\tmight\tbe under\tattack,\tdisabling\tthe\taccount\twill\t\
    secure\tit\tand\tonce\tit's\tready\tto\tresume\tuse\tit\tcan easily\tbe\tre-enabled. A\tblock\tencryption\tmode\twith\t\
    a\tCypher\tBlock\tChaining\t(CBC)\tmode\tvalue\tand\tkey\tlength\tof 256\tis\trecommended\twhen\tusing\tthe\tAES_ENCRYPT()\t\
    and\tAES_DECRYPT()\tfunctions\tfor encryption. The\tserver-side\tauth_socket\tauthentication\tplugin,\tauthenticates\t\
    clients\tthat\tconnect\tto the\tMySQL\tserver\tfrom\tthe\tlocal\thost\tthrough\tthe\tUnix\tsocket\tfile.\tUsers\tauthenticated\t\
    by the\tauth_socket\tneed\tnot\tspecify\ta\tpassword\twhen\tconnecting\tto\tthe\tserver.\tHowever, users\tauthenticated\t\
    by\tthe\tauth_socket\tplugin\tare\trestricted\tfrom\tconnecting\tremotely; they\tcan\tonly\tconnect\tfrom\tthe\tlocal\t\
