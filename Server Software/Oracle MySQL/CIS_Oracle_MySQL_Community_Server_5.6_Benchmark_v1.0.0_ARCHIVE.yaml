  audit_raw: "Check if these files are in used and are saved in the backup.\nVerify there are no other roles enabled for the\
    \ underlying operating system and that no\nadditional applications or services unrelated to the proper operation of the\
    \ MySQL server\nsoftware are installed.\nCheck the process or task list if the password is visible.\nCheck the shell or\
    \ command history if the password is visible.\n24 | P a g e\nEach user should be linked to one of these\n• system accounts\n\
    • a person\n• an application\n25 | P a g e\nCheck if the certificate is bound to one instance of MySQL.\nPerform the following\
    \ steps to assess this recommendation:\n• Execute the following SQL statement to determine the Value of datadir\nshow\
    \ variables where variable_name = 'datadir';\n• Execute the following command at a terminal prompt\nls -l <datadir>/..\
    \ | egrep \"^d[r|w|x]{3}------\\s*.\\s*mysql\\s*mysql\\s*\\d*.*mysql\"\nLack of output implies a finding.\nPerform the\
    \ following steps to assess this recommendation:\n• Identify the basename of binary log files (log_bin_basename)by executing\
    \ the\nfollowing statement\nshow variables like 'log_bin_basename';\n• Verify permissions are 660 for mysql:mysql on each\
    \ log file of the form\nlog_bin_basename.nnnnnn.\nPerform the following steps to assess this recommendation:\n• Find the\
    \ log_error value (<error_log_path>)by executing the following statement\nshow variables like 'log_error';\n• Verify permissions\
    \ are 660 for mysql:mysql for <error_log_path>\nPerform the following steps to assess this recommendation:\n• Find the\
    \ slow_query_log value (<slow_query_log_path>)by executing the following\nstatement\nshow variables like 'slow_query_log_file';\n\
    • Verify permissions are 660 for mysql:mysql for <slow_query_log_path>\nPerform the following steps to assess this recommendation:\n\
    Find the relay_log_basename value by executing the following statement\nshow variables like 'relay_log_basename';\n• Verify\
    \ permissions are 660 for mysql:mysql for each file of the\nform <relay_log_basename>\n31 | P a g e\nPerform the following\
    \ steps to assess this recommendation:\n• Find the general_log_file value by executing the following statement\nshow variables\
    \ like 'general_log_file';\n32 | P a g e\n• Verify permissions are 660 for mysql:mysql for the indicated general_log_file.\n\
    To assess this recommendation, locate the SSL key in use by executing the following SQL\nstatement to get the Value of\
    \ ssl_key:\nshow variables where variable_name = 'ssl_key';\nThen, execute the following command to assess the permissions\
    \ of the Value:\nls -l <ssl_key Value> | egrep \"^-r--------[ \\t]*.[ \\t]*mysql[ \\t]*mysql.*$\"\nLack of output from\
    \ the above command implies a finding.\nTo assess this recommendation, execute the following SQL statement to discover\
    \ the Value\nof plugin_dir:\nshow variables where variable_name = 'plugin_dir';\nThen, execute the following command at\
    \ a terminal prompt (using the discovered\nplugin_dir Value) to determine the permissions.\nls -l <plugin_dir Value>/..\
    \ | egrep \"^drwxr[-w]xr[-w]x[ \\t]*[0-9][ \\t]*mysql[\n\\t]*mysql.*plugin.*$\"\nLack of output implies a finding.\nNOTE:\
    \ Permissions are intended to be either 775 or 755.\nExecute the following SQL statement to identify the MySQL server\
    \ version:\nSHOW VARIABLES WHERE Variable_name LIKE \"version\";\nNow compare the version with the security announcements\
    \ from Oracle and/or the OS if\nthe OS packages are used.\nExecute the following SQL statement to determine if the test\
    \ database is present:\nSHOW DATABASES LIKE 'test';\nThe above SQL statement will return zero rows\nPerform the following\
    \ to determine if the recommended state is in place:\n• Ensure --allow-suspicious-udfs is not specified in the the mysqld\
    \ start\nup command line.\n• Ensure allow-suspicious-udfs is set to FALSE in the MySQL configuration.\nExecute the following\
    \ SQL statement and ensure the Value field is set to OFF:\nSHOW VARIABLES WHERE Variable_name = 'local_infile';\nPerform\
    \ the following to determine if the recommended state is in place:\n• Open the MySQL configuration (e.g. my.cnf) file\
    \ and search for skip-grant-tables\n• Ensure skip-grant-tables is set to FALSE\nExecute the following SQL statement to\
    \ assess this recommendation:\nSHOW variables LIKE 'have_symlink';\nEnsure the Value returned is DISABLED.\nExecute the\
    \ following SQL statement to assess this recommendation:\n41 | P a g e\nSELECT * FROM information_schema.plugins WHERE\
    \ PLUGIN_NAME='daemon_memcached'\nEnsure that no rows are returned.\nExecute the following SQL statement and ensure one\
    \ row is returned:\nSHOW GLOBAL VARIABLES WHERE Variable_name = 'secure_file_priv' AND Value<>'';\nNote: The Value should\
    \ contain a valid path.\n42 | P a g e\nTo audit for this recommendation execute the following query:\nSHOW VARIABLES LIKE\
    \ 'sql_mode';\nEnsure that STRICT_ALL_TABLES is in the list returned.\nExecute the following SQL statement(s) to assess\
    \ this recommendation:\nSELECT user, host\nFROM mysql.user\nWHERE (Select_priv = 'Y')\nOR (Insert_priv = 'Y')\nOR (Update_priv\
    \ = 'Y')\nOR (Delete_priv = 'Y')\nOR (Create_priv = 'Y')\nOR (Drop_priv = 'Y');\nSELECT user, host\nFROM mysql.db\nWHERE\
    \ db = 'mysql'\nAND ((Select_priv = 'Y')\nOR (Insert_priv = 'Y')\nOR (Update_priv = 'Y')\nOR (Delete_priv = 'Y')\nOR (Create_priv\
    \ = 'Y')\nOR (Drop_priv = 'Y'));\nEnsure all users returned are administrative users.\nExecute the following SQL statement\
    \ to audit this setting\nselect user, host from mysql.user where File_priv = 'Y';\nEnsure only administrative users are\
    \ returned in the result set.\nExecute the following SQL statement to audit this setting:\nselect user, host from mysql.user\
    \ where Process_priv = 'Y';\nEnsure only administrative users are returned in the result set.\nExecute the following SQL\
    \ statement to audit this setting:\nselect user, host from mysql.user where Super_priv = 'Y';\nEnsure only administrative\
    \ users are returned in the result set.\nExecute the following SQL statement to audit this setting:\nSELECT user, host\
    \ FROM mysql.user WHERE Shutdown_priv = 'Y';\nEnsure only administrative users are returned in the result set.\nExecute\
    \ the following SQL statement to audit this setting:\nSELECT user, host FROM mysql.user WHERE Create_user_priv = 'Y';\n\
    Ensure only administrative users are returned in the result set.\nExecute the following SQL statements to audit this setting:\n\
    SELECT user, host FROM mysql.user WHERE Grant_priv = 'Y';\n SELECT user, host FROM mysql.db WHERE Grant_priv = 'Y';\n\
    Ensure only administrative users are returned in the result set.\nExecute the following SQL statement to audit this setting:\n\
    SELECT user, host FROM mysql.user WHERE Repl_slave_priv = 'Y';\nEnsure only accounts designated for slave users are granted\
    \ this privilege.\n Execute the following SQL statement to audit this setting:\nSELECT User,Host,Db\nFROM mysql.db\nWHERE\
    \ Select_priv='Y'\nOR Insert_priv='Y'\nOR Update_priv='Y'\nOR Delete_priv='Y'\nOR Create_priv='Y'\nOR Drop_priv='Y'\n\
    OR Alter_priv='Y';\nEnsure all users returned should have these privileges on the indicated databases.\nNOTE: Global grants\
    \ are covered in Recommendation 4.1.\nExecute the following SQL statement to audit this setting:\nSHOW variables LIKE\
    \ 'log_error';\nEnsure the Value returned is not empty.\nExecute the following SQL statement to assess this recommendation:\n\
    SELECT @@global.log_bin_basename;\nEnsure the value returned does not indicate root ('/'), /var, or /usr.\nExecute the\
    \ following SQL statement to assess this recommendation:\nSHOW GLOBAL VARIABLES LIKE 'log_warnings';\nEnsure the Value\
    \ returned equals 2.\nVerify that a third-party tool is installed and configured to enable logging for interactive\nuser\
    \ sessions and (optionally) applications sessions.\nPerform the following actions to assess this recommendation:\n• Open\
    \ the MySQL configuration file (my.cnf)\n• Ensure the log-raw entry is present\n• Ensure the log-raw entry is set to OFF\n\
    Execute the following SQL statement to assess this recommendation:\nSHOW VARIABLES WHERE Variable_name = 'old_passwords';\n\
    Ensure the Value field is not set to 1 or ON.\nExecute the following SQL statement and ensure the Value field is not set\
    \ to ON:\nSHOW VARIABLES WHERE Variable_name = 'secure_auth';\nTo assess this recommendation, perform the following steps:\n\
    • Open the MySQL configuration file (e.g. my.cnf)\n• Examine the [client] section of the MySQL configuration file and\
    \ ensure password\nis not employed.\n61 | P a g e\nExecute the following SQL statements to assess this recommendation:\n\
    SELECT @@global.sql_mode;\nSELECT @@session.sql_mode;\n62 | P a g e\nEnsure that each result contains NO_AUTO_CREATE_USER.\n\
    Execute the following SQL query to determine if any users have a blank password:\nSELECT User,host\nFROM mysql.user\n\
    WHERE (plugin IN('mysql_native_password', 'mysql_old_password')\nAND (LENGTH(Password) = 0\nOR Password IS NULL))\nOR\
    \ (plugin='sha256_password' AND LENGTH(authentication_string) = 0);\nNo rows will be returned if all accounts have a password\
    \ set.\nExecute the following SQL statements to assess this recommendation:\nSHOW VARIABLES LIKE 'validate_password%';\n\
    The result set from the above statement should show:\n• validate_password_length should be 14 or more\n• validate_password_mixed_case_count\
    \ should be 1 or more\n• validate_password_number_count should be 1 or more\n• validate_password_special_char_count should\
    \ be 1 or more\n• validate_password_policy should be MEDIUM or STRONG\nThe following lines should be present in the global\
    \ configuration:\nplugin-load=validate_password.so\nvalidate-password=FORCE_PLUS_PERMANENT\nCheck if users have a password\
    \ which is identical to the username:\nSELECT User,Password,Host FROM mysql.user\nWHERE password=CONCAT('*', UPPER(SHA1(UNHEX(SHA1(user)))));\n\
    \ NOTE: This method is only capable of checking the post-4.1 password format which is also\nknown as mysql_native_password.\n\
    64 | P a g e\nExecute the following SQL statement to assess this recommendation:\nSELECT user, host FROM mysql.user WHERE\
    \ host = '%';\nEnsure no rows are returned.\n65 | P a g e\nExecute the following SQL query to identify anonymous accounts:\n\
    SELECT user,host FROM mysql.user WHERE user = '';\nThe above query will return zero rows if no anonymous accounts are\
    \ present.\nExecute the following SQL statements to assess this recommendation:\nSHOW variables WHERE variable_name =\
    \ 'have_ssl';\nEnsure the Value returned is YES.\nNOTE: have_openssl is an alias for have_ssl as of MySQL 5.0.38.  MySQL\
    \ can be build\nwith OpenSSL or YaSSL.\nExecute the following SQL statements to assess this recommendation:\nSELECT user,\
    \ host, ssl_type FROM mysql.user\nWHERE NOT HOST IN ('::1', '127.0.0.1', 'localhost');\nEnsure the ssl_type for each user\
    \ returned is equal to ANY, X509, or SPECIFIED.\nNOTE: have_openssl is an alias for have_ssl as of MySQL 5.0.38.  MySQL\
    \ can be build\nwith OpenSSL or YaSSL.\n68 | P a g e\nCheck if the replication traffic is using\n• A private network\n\
    • A VPN\n• SSL/TLS\n• A SSH Tunnel\nTo assess this recommendation, issue the following statement:\nselect ssl_verify_server_cert\
    \ from mysql.slave_master_info;\nVerify the value of ssl_verify_server_cert is 1.\n70 | P a g e\nExecute the following\
    \ SQL statement to assess this recommendation:\n71 | P a g e\nSHOW GLOBAL VARIABLES LIKE 'master_info_repository';\nThe\
    \ result should be TABLE instead of FILE.\nNOTE: There also should not be a master.info file in the datadir.\nExecute\
    \ the following SQL statement to audit this setting:\nselect user, host from mysql.user where user='repl' and Super_priv\
    \ = 'Y';\nNo rows should be returned.\nNOTE: Substitute your replication user's name for repl in the above query.\nExecute\
    \ the following SQL statement to assess this recommendation:\nSELECT user, host FROM mysql.user WHERE user='repl' AND\
    \ host = '%';\nEnsure no rows are returned."
