controls:
- id: 1.1.1
  title: Backup policy in place
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  description: A backup policy should be in place.
  rationale: Backing up MySQL databases, including 'mysql', will help ensure the availability of data in the event of an incident.
  impact: Without backups it might be hard to recover from an incident.
  references: []
  page_start: 18
  audit_raw: Check with "crontab -l" if there is a backup schedule.
  remediation: Create a backup policy and backup schedule.
  checks:
  - type: manual_review
    info: Check with "crontab -l" if there is a backup schedule.
    severity: medium
- id: 1.1.2
  title: Verify backups are good
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  description: Backups should be validated on a regular basis.
  rationale: Verifying that backups are occurring appropriately will help ensure the availability of data in the event of
    an incident.
  impact: Without a well tested backup it might be hard to recover from an incident if the backup procedure contains errors
    or doesn't include all required data.
  references: []
  page_start: 19
  audit_raw: Check reports of backup validation tests.
  remediation: 'Implement regular backup checks and document each check.

    19 | P a g e'
  checks:
  - type: manual_review
    info: Check reports of backup validation tests.
    severity: medium
- id: 1.1.3
  title: Secure backup credentials
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  description: The password, certificate and any other credentials should be protected.
  rationale: A user with full privileges is needed for backup. The credentials for this user should be protected
  impact: When the backup credentials are not properly secured then they might be abused to gain access to the server. The
    backup user needs an account with many privileges, so the attacker can gain (almost) complete access to the server.
  references: []
  page_start: 20
  audit_raw: Check permissions of files containing passwords and/or ssl keys.
  remediation: Change file permissions
  checks:
  - type: manual_review
    info: Check permissions of files containing passwords and/or ssl keys.
    severity: medium
- id: 1.1.4
  title: The backups should be properly secured
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  description: The backup files will contain all data in the databases. Filesystem permissions and/or encryption should be
    used to prevent non authorized users from gaining access to the backups. 20 | P a g e
  rationale: Backups should be considered sensitive information.
  impact: If an unauthorized user can access backups then they have access to all the data that is in the database. This is
    true for unencrypted backups and for encrypted backups if the encryption key is stored along with the backup.
  references: []
  page_start: 20
  audit_raw: 'Check who has access to the backup files.

    • Are the files world-readable (e.g. rw-r--r-)

    o Are they stored in a world readable directory?

    • Is the group MySQL and/or backup specific?

    o If not: the file and directory must not be group readable

    • Are the backups stored offsite?

    o Who has access to the backups?

    • Are the backups encrypted?

    o Where is the encryption key stored?

    o Does the encryption key consists of  a guessable password?'
  remediation: Implement encryption or use filesystem permissions.
  checks:
  - type: manual_review
    info: 'Check who has access to the backup files.

      • Are the files world-readable (e.g. rw-r--r-)

      o Are they stored in a world readable directory?

      • Is the group MySQL and/or backup specific?

      o If not: the file and directory must not be group readable

      • Are the backups stored offsite?

      o Who has access to the backups?

      • Are the backups encrypted?

      o Where is the encryption key stored?

      o Does the encryption key consists of  a guessable password?'
    severity: medium
- id: 1.1.5
  title: Point in time recovery
  scoring: scored
  profile:
  - Level 2 - MySQL RDBMS on Linux
  description: With binlogs it is possible to implement point-in-time recovery. This makes it possible to restore the changes
    between the last full backup and the point-in-time. Enabling binlogs is not sufficient, a restore procedure should be
    created and has to be tested.
  rationale: This can reduce the amount of information lost. 21 | P a g e
  impact: Without point-in-time recovery the data which was stored between the last backup and the time of disaster might
    not be recoverable.
  references: []
  page_start: 21
  audit_raw: Check if binlogs are enabled and if there is a restore procedure.
  remediation: Enable binlogs and create and test a restore procedure.
  checks:
  - type: manual_review
    info: Check if binlogs are enabled and if there is a restore procedure.
    severity: medium
- id: 1.1.6
  title: Disaster recovery plan
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  description: A disaster recovery plan should be created. A slave in a different datacenter can be used or offsite backups.
    There should be information about what time a recovery will take and if the recovery site has the same capacity.
  rationale: A disaster recovery should be planned.
  impact: Without a well tested disaster recovery plan it might not be possible to recover in time.
  references: []
  page_start: 22
  audit_raw: Check if there is a disaster recovery plan
  remediation: Create a disaster recovery plan
  checks:
  - type: manual_review
    info: Check if there is a disaster recovery plan
    severity: medium
- id: 1.1.7
  title: Backup of configuration and related files
  scoring: scored
  profile:
  - Level 1 - MySQL RDBMS on Linux
  - Level 2 - MySQL RDBMS on Linux
  - Level 1 - MySQL RDBMS
  - Level 2 - MySQL RDBMS
  description: 'The following files should be included in the backup: • Configuration files (my.cnf and included files) •
    SSL files (certificates, keys) • User Defined Functions (UDFs) • Source code for customizations It is recommended that
    MySQL Server software be installed on a dedicated server.  This architectural consideration affords flexibility in that
    the database server can be placed on a separate zone allowing access only from particular hosts and over particular protocols.
    When a command is executed on the command line, for example mysql -u admin - ppassword, the password may be visible in
    the user''s shell/command history or in the process list. Database user accounts should not be reused for multiple applications
    or users. The SSL certificate and key used by MySQL should be used only for MySQL and only for one instance. The data
    directory is the location of the MySQL databases. MySQL can operate using a variety of log files, each used for different
    purposes.  These are the binary log, error log, slow query log, relay log, and general log.  Because these are files on
    the host operating system, they are subject to the permissions structure provided by the host and may be accessible by
    users other than the MySQL user. MySQL can operate using a variety of log files, each used for different purposes.  These
    are the binary log, error log, slow query log, relay log, and general log.  Because these are files on the host operating
    system, they are subject to the permissions structure provided by the host and may be accessible by users other than the
    MySQL user. MySQL can operate using a variety of log files, each used for different purposes.  These are the binary log,
    error log, slow query log, relay log, and general log.  Because these are files on the host operating system, they are
    subject to the permissions structure provided by the host and may be accessible by users other than the MySQL user. MySQL
    can operate using a variety of log files, each used for different purposes.  These are the binary log, error log, slow
    query log, relay log, and general log.  Because these are files on the host operating system, they are subject to the
    permissions structure provided by the host and may be accessible by users other than the MySQL user. MySQL can operate
    using a variety of log files, each used for different purposes.  These are the binary log, error log, slow query log,
    relay log, and general log.  Because these are files on the host operating system, they are subject to the permissions
    structure provided by the host and may be accessible by users other than the MySQL user. When configured to use SSL/TLS,
    MySQL relies on key files, which are stored on the host''s filesystem.  These key files are subject to the host''s permissions
    structure. The plugin directory is the location of the MySQL plugins. Plugins are storage engines or user defined functions
    (UDFs). Periodically, updates to MySQL server are released to resolve bugs, mitigate vulnerabilities, and provide new
    features. It is recommended that MySQL installations are up to date with the latest security updates. The default MySQL
    installation comes with an unused database called test. It is recommended that the test database be dropped. This option
    prevents attaching arbitrary shared library functions as user-defined functions by checking for at least one corresponding
    method named _init, _deinit, _reset, _clear, or _add. The local_infile parameter dictates whether files located on the
    MySQL client''s computer can be loaded or selected via LOAD DATA INFILE or SELECT local_file. This option causes mysqld
    to start without using the privilege system. 39 | P a g e The symbolic-links and skip-symbolic-links options for MySQL
    determine whether symbolic link support is available.  When use of symbolic links are enabled, they have different effects
    depending on the host platform.  When symbolic links are disabled, then symbolic links stored in files or entries in tables
    are not used by the database. The InnoDB memcached Plugin allows users to access data stored in InnoDB with the memcached
    protocol. The secure_file_priv option restricts to paths used by LOAD DATA INFILE or SELECT local_file. It is recommended
    that this option be set to a file system location that contains only resources expected to be loaded by MySQL. When data
    changing statements are made (i.e. INSERT, UPDATE), MySQL can handle invalid or missing values differently depending on
    whether strict SQL mode is enabled.  When strict SQL mode is enabled, data may not be truncated or otherwise "adjusted"
    to make the data changing statement work. The mysql.user and mysql.db tables list a variety of privileges that can be
    granted (or denied) to MySQL users.   Some of the privileges of concern include:  Select_priv, Insert_priv, Update_priv,
    Delete_priv, Drop_priv, and so on.  Typically, these privileges should not be available to every MySQL user and often
    are reserved for administrative use only. The File_priv privilege found in the mysql.user table is used to allow or disallow
    a user from  reading and writing files on the server host.  Any user with the File_priv right granted has the ability
    to: • Read files from the local file system that are readable by the MySQL server (this includes world-readable files)
    • Write files to the local file system where the MySQL server has write access The PROCESS privilege found in the mysql.user
    table determines whether a given user can see statement execution information for all sessions. The SUPER privilege found
    in the mysql.user table governs the use of a variety of MySQL features.  These features include, CHANGE MASTER TO, KILL,
    mysqladmin kill option, PURGE BINARY LOGS, SET GLOBAL, mysqladmin debug option, logging control, and more. The SHUTDOWN
    privilege simply enables use of the shutdown option to the mysqladmin command, which allows a user with the SHUTDOWN privilege
    the ability to shut down the MySQL server. The CREATE USER privilege governs the right of a given user to add or remove
    users, change existing users'' names, or revoke existing users'' privileges. The GRANT OPTION privilege exists in different
    contexts (mysql.user, mysql.db) for the purpose of governing the ability of a privileged user to manipulate the privileges
    of other users. The REPLICATION SLAVE privilege governs whether a given user (in the context of the master server) can
    request updates that have been made on the master server. 51 | P a g e DML/DDL includes the set of privileges used to
    modify or create data structures.  This includes INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER privileges. 52
    | P a g e The error log contains information about events such as mysqld starting and stopping, when a table needs to
    be checked or repaired, and, depending on the host operating system, stack traces when mysqld fails. MySQL log files can
    be set in the MySQL configuration to exist anywhere on the filesystem.  It is common practice to ensure that the system
    filesystem is left uncluttered by application logs.  System filesystems include the root, /var, or /usr. The log_warnings
    system variable, enabled by default, provides additional information to the MySQL log.  A value of 1 enables logging of
    warning messages, and higher integer values tend to enable more logging. NOTE: The variable scope for 5.6.3 and earlier
    is global and session, but for 5.6.4 and greater its scope is global. Audit logging is not really included in the Community
    Edition of MySQL - only the general log.  Using the general log is possible, but not practical, because it grows quickly
    and has an adverse impact on server performance. Nevertheless, enabling audit logging is an important consideration for
    a production environment, and third-party tools do exist to help with this. Enable audit logging for • Interactive user
    sessions • Application sessions (optional) The log-raw MySQL option determines whether passwords are rewritten by the
    server so as not to appear in log files as plain text.  If log-raw is enabled, then passwords are written to the various
    log files (general query log, slow query log, and binary log) in plain text. This variable controls the password hashing
    method used by the PASSWORD() function and for the IDENTIFIED BY clause of the CREATE USER and GRANT statements. Before
    5.6.6, the value can be 0 (or OFF), or 1 (or ON). As of 5.6.6, the following value can be one of the following: • 0 -
    authenticate with the mysql_native_password plugin • 1 - authenticate with the mysql_old_password plugin • 2 - authenticate
    with the sha256_password plugin This option dictates whether the server will deny connections by clients that attempt
    to use accounts that have their password stored in the mysql_old_password format. The [client] section of the MySQL configuration
    file allows setting a user and password to be used. Verify the password option is not used in the global configuration
    file (my.cnf). NO_AUTO_CREATE_USER is an option for sql_mode that prevents a GRANT statement from automatically creating
    a user when authentication information is not provided. Blank passwords allow a user to login without using a password.
    Password complexity includes password characteristics such as length, case, length, and character sets. MySQL can make
    use of host wildcards when granting permissions to users on specific databases.  For example, you may grant a given privilege
    to ''<user>''@''%''. Anonymous accounts are users with empty usernames ('''').  Anonymous accounts have no passwords,
    so anyone can use them to connect to the MySQL server. All network traffic must use SSL/TLS when traveling over untrusted
    networks. All network traffic must use SSL/TLS when traveling over untrusted networks. SSL/TLS should be enforced on a
    per-user basis for users which enter the system through the network. The replication traffic between servers should be
    secured. In the MySQL slave context the setting MASTER_SSL_VERIFY_SERVER_CERT indicates whether the slave should verify
    the master''s certificate.  This configuration item may be set to Yes or No, and unless SSL has been enabled on the slave,
    the value will be ignored. The master_info_repository setting determines to where a slave logs master status and connection
    information.  The options are FILE or TABLE.  Note also that this setting is associated with the sync_master_info setting
    as well. The SUPER privilege found in the mysql.user table governs the use of a variety of MySQL features.  These features
    include, CHANGE MASTER TO, KILL, mysqladmin kill option, PURGE BINARY LOGS, SET GLOBAL, mysqladmin debug option, logging
    control, and more. MySQL can make use of host wildcards when granting permissions to users on specific databases.  For
    example, you may grant a given privilege to ''<user>''@''%''.'
  rationale: These files are required to be able to fully restore an instance. The attack surface is reduced on a server with
    only the underlying operating system, MySQL server software, and any security or operational tooling that may be additionally
    installed.  A smaller attack surface reduces the probability of the data within MySQL being compromised. 23 | P a g e
    If the password is visible in the process list or user's shell/command history, an attacker will be able to access the
    MySQL database using the stolen credentials. Utilizing unique database accounts across applications will reduce the impact
    of a compromised MySQL account. Use of default certificates can allow an attacker to impersonate the MySQL server. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL database.  If
    someone other than the MySQL user is allowed to read files from the data directory he or she might be able to read data
    from the mysql.user table which contains passwords.  Additionally, the ability to create files can lead to denial of service,
    or might otherwise allow someone to gain access to specific data by manually creating a file with a view definition. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MySQL database
    and the communication with the client. If the contents of the SSL key file is known to an attacker he or she might impersonate
    the server. This can be used for a man-in-the-middle attack. Depending on the SSL ciphersuite the key might also be used
    to decipher previously captured network traffic. 33 | P a g e Limiting the accessibility of these objects will protect
    the confidentiality, integrity, and availability of the MySQL database.  If someone can modify plugins then these plugins
    might be loaded when the server starts and the code will get executed. Maintaining currency with MySQL patches will help
    reduce risk associated with known vulnerabilities present in the MySQL server. Without the latest security patches MySQL
    might have known vulnerabilities which might be used by an attacker to gain access. The test database can be accessed
    by all users and can be used to consume system resources.  Dropping the test database will reduce the attack surface of
    the MySQL server. Preventing shared libraries that do not contain user-defined functions from loading will reduce the
    attack surface of the server. Disabling local_infile reduces an attacker's ability to read sensitive files off the affected
    server via a SQL injection vulnerability. If this option is used, all clients of the affected server will have unrestricted
    access to all databases. Prevents sym links being used for data base files. This is especially important when MySQL is
    executing as root as arbitrary files may be overwritten.  The symbolic-links option might allow someone to direct actions
    by to MySQL server to other files and/or directories. 40 | P a g e By default the plugin doesn't do authentication, which
    means that anyone with access to the TCP/IP port of the plugin can access and modify the data. However, not all data is
    exposed by default. Setting secure_file_priv reduces an attacker's ability to read sensitive files off the affected server
    via a SQL injection vulnerability. Without strict mode the server tries to do proceed with the action when an error might
    have been a more secure choice. For example, by default MySQL will truncate data if it does not fit in a field, which
    can lead to unknown behavior, or be leveraged by an attacker to circumvent data validation. 43 | P a g e Limiting the
    accessibility of the 'mysql' database will protect the confidentiality, integrity, and availability of the data housed
    within MySQL.  A user which has direct access to 44 | P a g e mysql.* might view password hashes, change permissions,
    or alter or destroy information intentionally or unintentionally. The File_priv right allows mysql users to read files
    from disk and to write files to disk. This may be leveraged by an attacker to further compromise MySQL.  It should be
    noted that the MySQL server should not overwrite existing files. The PROCESS privilege allows principals to view currently
    executing MySQL statements beyond their own, including statements used to manage passwords. This may be leveraged by an
    attacker to compromise MySQL or to gain access to potentially sensitive data. The SUPER privilege allows principals to
    perform many actions, including view and terminate currently executing MySQL statements (including statements used to
    manage passwords). This privilege also provides the ability to configure MySQL, such as enable/disable logging, alter
    data, disable/enable features.  Limiting the accounts that have the SUPER privilege reduces the chances that an attacker
    can exploit these capabilities. The SHUTDOWN privilege allows principals to shutdown MySQL. This may be leveraged by an
    attacker to negatively impact the availability of MySQL. Reducing the number of users granted the CREATE USER right minimizes
    the number of users able to add/drop users, alter existing users' names, and manipulate existing users' privileges. The
    GRANT privilege allows a principal to grant other principals additional privileges. This may be used by an attacker to
    compromise MySQL. The REPLICATION SLAVE privilege allows a principal to fetch binlog files containing all data changing
    statements and/or changes in table data from the master. This may be used by an attacker to read/fetch sensitive data
    from MySQL. INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER are powerful privileges in any database.  Such privileges
    should be limited only to those users requiring such rights.  By limiting the users with these rights and ensuring that
    they are limited to specific databases, the attack surface of the database is reduced. Enabling error logging may increase
    the ability to detect malicious attempts against MySQL, and other critical messages, such as if the error log is not enabled
    then connection error might go unnoticed. Moving the MySQL logs off the system partition will reduce the probability of
    denial of service via the exhaustion of available disk space to the operating system. This might help to detect malicious
    behavior by logging communication errors and aborted connections. Audit logging helps to identify who changed what and
    when. The audit log might be used as evidence in investigations. It might also help to identify what an attacker was able
    to accomplish. With raw logging of passwords enabled someone with access to the log files might see plain text passwords.
    The mysql_old_password plugin leverages an algorithm that can be quickly brute forced using an offline dictionary attack.
    See CVE-2003-1480 for additional details. Enabling this option will prevent all use of passwords employing the old format
    (and hence insecure communication over the network). The use of the password parameter may negatively impact the confidentiality
    of the user's password. Blank passwords negate the benefits provided by authentication mechanisms.  Without this setting
    an administrative user might accidentally create a user without a password. Without a password only knowing the username
    and the list of allowed hosts will allow someone to connect to the server and assume the identity of the user.  This,
    in effect, bypasses authentication mechanisms. Complex passwords help mitigate dictionary, brute forcing, and other password
    attacks.  This recommendation prevents users from choosing weak passwords which can easily be guessed. Avoiding the use
    of wildcards within hostnames helps control the specific locations from which a given user may connect to and interact
    with the database. Removing anonymous accounts will help ensure that only identified and trusted principals are capable
    of interacting with MySQL. The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-in-themiddle attacks.
    The SSL/TLS-protected MySQL protocol helps to prevent eavesdropping and man-in-themiddle attacks. The replication traffic
    should be secured as it gives access to all transferred information and might leak passwords. 69 | P a g e When SSL is
    in use certificate verification is important to authenticate the party to which a connection is being made.  In this case,
    the slave (client) should verify the master's (server's) certificate to authenticate the master prior to continuing the
    connection. The password which the client uses is stored in the master info repository, which by default is a plaintext
    file. The TABLE master info repository is a bit safer, but with filesystem access it's still possible to gain access to
    the password the slave is using. The SUPER privilege allows principals to perform many actions, including view and terminate
    currently executing MySQL statements (including statements used to manage passwords). This privilege also provides the
    ability to configure MySQL, such as enable/disable logging, alter data, disable/enable features.  Limiting the accounts
    that have the SUPER privilege reduces the chances that an attacker can exploit these capabilities. 72 | P a g e Avoiding
    the use of wildcards within hostnames helps control the specific locations from which a given user may connect to and
    interact with the database. 73 | P a g e
  impact: 'Without a complete backup it might not be possible to fully recover. 1.2 Dedicate Machine Running MySQL (Not Scored)
    Care must be taken that applications or services that are required for the proper operation of the operating system are
    not removed. Custom applications may need to be modified to accommodate database connections over the network rather than
    on the use (e.g., using TCP/IP connections). Additional hardware and operating system licenses may be required to make
    the architectural change. 1.3 Do Not Specify Passwords in Command Line (Not Scored) Depending on the remediation chosen,
    additional steps may need to be undertaken like: • Entering a password when prompted; • Ensuring the file permissions
    on .my.cnf is restricted yet accessible by the user; • Using mysql_config_editor to encrypt the authentication credentials
    in .mylogin.cnf. Additionally, not all scripts/applications may be able to use .mylogin.cnf. If a user is reused then
    a compromise of this user will compromise multiple parts of the system and/or application. 1.5 Do Not Use Default or Non-MySQL-specific
    Cryptographic Keys (Not Scored) If a the key is used on multiple system then a compromise of one system leads to compromise
    of the network traffic of all servers which use the same key. 2 File System Permissions The File System Permissions are
    critical for keeping the data and configuration of the MySQL server secure. 26 | P a g e 2.1 Ensure ''datadir'' Has Appropriate
    Permissions (Scored) Changing the permissions of the log files might have impact on monitoring tools which use a logfile
    adapter. Also the slow query log can be used for performance analysis by application developers. 28 | P a g e If the permissions
    on the relay logs and binary log files are accidentally changed to exclude the user account which is used to run the MySQL
    service then this might break replication. The binary log file can be used for point in time recovery so this can also
    affect backup, restore and disaster recovery procedures. 2.3 Ensure ''log_error'' Has Appropriate Permissions (Scored)
    Changing the permissions of the log files might have impact on monitoring tools which use a logfile adapter. Also the
    slow query log can be used for performance analysis by application developers. If the permissions on the relay logs and
    binary log files are accidentally changed to exclude the user account which is used to run the MySQL service then this
    might break replication. The binary log file can be used for point in time recovery so this can also affect backup, restore
    and disaster recovery procedures. 2.4 Ensure ''slow_query_log'' Has Appropriate Permissions (Scored) Changing the permissions
    of the log files might have impact on monitoring tools which use a logfile adapter. Also the slow query log can be used
    for performance analysis by application developers. If the permissions on the relay logs and binary log files are accidentally
    changed to exclude the user account which is used to run the MySQL service then this might break replication. The binary
    log file can be used for point in time recovery so this can also affect backup, restore and disaster recovery procedures.
    2.5 Ensure ''relay_log_basename'' Files Have Appropriate Permissions (Scored) Changing the permissions of the log files
    might have impact on monitoring tools which use a logfile adapter. Also the slow query log can be used for performance
    analysis by application developers. If the permissions on the relay logs and binary log files are accidentally changed
    to exclude the user account which is used to run the MySQL service then this might break replication. The binary log file
    can be used for point in time recovery so this can also affect backup, restore and disaster recovery procedures. 2.6 Ensure
    ''general_log_file'' Has Appropriate Permissions (Scored) Changing the permissions of the log files might have impact
    on monitoring tools which use a logfile adapter. Also the slow query log can be used for performance analysis by application
    developers. If the permissions on the relay logs and binary log files are accidentally changed to exclude the user account
    which is used to run the MySQL service then this might break replication. The binary log file can be used for point in
    time recovery so this can also affect backup, restore and disaster recovery procedures. 2.7 Ensure SSL Key Files Have
    Appropriate Permissions (Scored) If the permissions for the key file are changed incorrectly this can cause SSL to be
    disabled when MySQL is restarted or can cause MySQL not to start at all. If other applications are using the same keypair
    then changing the permissions of the key file will affect this application. If this is the case then a new keypair must
    be generated for MySQL. Users other than the mysql user will no longer be able to update and add/remove plugins unless
    they''re able to switch to the mysql user; To update the MySQL server a restart is required. Disabling local_infile will
    impact the functionality of solutions that rely on it. Solutions that rely on loading data from various sub-directories
    may be negatively impacted by this change. Consider consolidating load directories under a common parent directory. Applications
    relying on the MySQL database should be aware that STRICT_ALL_TABLES is in use, such that error conditions are handled
    appropriately. Consideration should be made for which privileges are required by each user requiring interactive database
    access. 4.2 Ensure ''file_priv'' Is Not Set to ''Y'' for Non-Administrative Users (Scored) Users denied the PROCESS privilege
    may also be denied use of SHOW ENGINE. When the SUPER privilege is denied to a given user, that user will be unable to
    take advantage of certain capabilities, such as certain mysqladmin options. Users that are denied the CREATE USER privilege
    will not only be unable to create a user, but they may be unable to drop a user, rename a user, or otherwise revoke a
    given user''s privileges. 4.7 Ensure ''grant_priv'' Is Not Set to ''Y'' for Non-Administrative Users (Scored) When old_passwords
    is set to 1 the PASSWORD() function will create password hashes with a very weak hashing algorithm which might be easy
    to break if captured by an attacker. Accounts having credentials stored using the old password format will be unable to
    login. Execute the following command to identify accounts that will be impacted by implementing this setting: SELECT User,Host
    FROM mysql.user WHERE plugin=''mysql_old_password''; The global configuration is by default readable for all users on
    the system. This is needed for global defaults (prompt, port, socket, etc). If a password is present in this file then
    all users on the system may be able to access it. Remediation for this recommendation requires a server restart. Any applications
    relying on anonymous database access will be adversely affected by this change. 66 | P a g e Enabling SSL will allow clients
    to encrypt network traffic and verify the identity of the server. This could have impact on network traffic inspection.
    When SSL/TLS is enforced then clients which do not use SSL will not be able to connect. If the server is not configured
    for SSL/TLS then accounts for which SSL/TLS is mandatory will not be able to connect When the replication traffic is not
    secured someone might be able to capture passwords and other sensitive information when sent to the slave. 8.2 Ensure
    ''MASTER_SSL_VERIFY_SERVER_CERT'' Is Set to ''YES'' or ''1'' (Scored) When using CHANGE MASTER TO, be aware of the following:
    • Slave processes need to be stopped prior to executing CHANGE MASTER TO • Use of CHANGE MASTER TO starts new relay logs
    without keeping the old ones unless explicitly told to keep them • When CHANGE MASTER TO is invoked, some information
    is dumped to the error log (previous values for MASTER_HOST, MASTER_PORT, MASTER_LOG_FILE, and MASTER_LOG_POS) • Invoking
    CHANGE MASTER TO will implicitly commit any ongoing transactions When the SUPER privilege is denied to a given user, that
    user will be unable to take advantage of certain capabilities, such as certain mysqladmin options.'
