  audit_raw: "Check if these files are in use and are saved in the backup.\n• Edited Configuration files (mariadb.cnf and\
    \ included files)\n• Files related to Key Management and Keyring (KMIP, other Key Management\nServices)\n• Audit Log Files\
    \ (if not handled by other methods)\n• SSL files (certificates, keys)\n• User Defined Functions (UDFs)\n• Source code\
    \ for customizations\nVerify there are no other roles enabled for the underlying operating system and that no\nadditional\
    \ applications or services unrelated to the proper operation of the MariaDB\nserver software are installed.\nCheck the\
    \ process or task list if the password is visible.\nCheck the shell or command history if the password is visible.\nEach\
    \ user (excluding mysql reserved users) should be linked to one of these:\n• system accounts\n• a person\n• an application\n\
    To list users (and exclude mysql reserved users):\nSELECT host, user, plugin,\n  IF(plugin = 'mysql_native_password',\n\
    \ 'WEAK SHA1', 'STRONG SHA2') AS HASHTYPE\nFROM mysql.user WHERE user NOT IN\n  ('mysql.infoschema', 'mysql.session',\
    \ 'mysql.sys') AND\n  plugin NOT LIKE 'auth%' AND plugin <> 'mysql_no_login' AND\n  LENGTH(authentication_string) > 0\n\
    ORDER BY plugin;\nReview all cryptographic material. If it is default, used for other MariaDB instances\nand/or for purposes\
    \ other than MariaDB then this is a finding.\nReview the server certificate by running:\ncd <data_dir and/or ssl_cert>\n\
    sudo openssl x509 -in server-cert.pem -subject -noout | grep\nAuto_Generated_Server_Certificate\nThe output for the auto\
    \ generated pem will look something like:\nsubject= /CN=MariaDB_Server_10.6.8_Auto_Generated_Server_Certificate\nIf no\
    \ rows return, the check is a pass since the certificate is not MariaDB autogenerated.\nThe global password lifetime is\
    \ set using default_password_lifetime. If the value of\ndefault_password_lifetime is greater than 0, it indicates the\
    \ permitted password\nlifetime.\nExecute the following command to check the global password lifetime:\nSELECT VARIABLE_NAME,\
    \ VARIABLE_VALUE\nFROM information_schema.global_variables where VARIABLE_NAME like\n'default_password_lifetime';\nA value\
    \ greater than 365 implies a fail.\nWhen the global password lifetime is less than or equal to 365, or not configured,\
    \ each\nuser account shall be checked by executing the following command:\nWITH password_expiration_info AS (\n   SELECT\
    \ User, Host,\n      IF(\n         IFNULL(JSON_EXTRACT(Priv, '$.password_lifetime'), -1) = -1,\n         @@global.default_password_lifetime,\n\
    \         JSON_EXTRACT(Priv, '$.password_lifetime')\n      ) AS password_lifetime,\n      JSON_EXTRACT(Priv, '$.password_last_changed')\
    \ AS password_last_changed\n   FROM mysql.global_priv\n)\nSELECT pei.User, pei.Host,\n   pei.password_lifetime,\n   FROM_UNIXTIME(pei.password_last_changed)\
    \ AS\npassword_last_changed_datetime,\n   FROM_UNIXTIME(\n      pei.password_last_changed +\n      (pei.password_lifetime\
    \ * 60 * 60 * 24)\n   ) AS password_expiration_datetime\nFROM password_expiration_info pei\nWHERE pei.password_lifetime\
    \ != 0\n   AND pei.password_last_changed IS NOT NULL\nUNION\nSELECT pei.User, pei.Host,\n   pei.password_lifetime,\n \
    \  FROM_UNIXTIME(pei.password_last_changed) AS\npassword_last_changed_datetime,\n   0 AS password_expiration_datetime\n\
    FROM password_expiration_info pei\nWHERE pei.password_lifetime = 0\n   OR pei.password_last_changed IS NULL;\nNote: A\
    \ value of 0 implies the password never expires.\nReview the locked status of accounts:\nSELECT CONCAT(user, '@', host,\
    \ ' => ', JSON_DETAILED(priv)) FROM\nmysql.global_priv ;\nAccounts not in use and MariaDB Reserved accounts should show\
    \ as\naccount_locked:true\nTo determine if the unix_socket plugin is enabled, run:\nSELECT PLUGIN_NAME, PLUGIN_STATUS\n\
    \       FROM INFORMATION_SCHEMA.PLUGINS\n       WHERE PLUGIN_NAME = 'unix_socket';\nIf PLUGIN_STATUS is ACTIVE and the\
    \ organization does not allow use of this feature, this is\na fail.\nTo determine users who can use unix_socket, run:\n\
    SELECT CONCAT(user, '@', host, ' => ', JSON_DETAILED(priv)) FROM\nmysql.global_priv where JSON_CONTAINS(priv, '{\"plugin\"\
    :\"unix_socket\"}',\n'$.auth_or');\nIf host is not the localhost or an unauthorized user is listed, this is a fail.\n\
    Run the following statement:\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM information_schema.global_variables\nWHERE VARIABLE_NAME\
    \ = 'bind_address';\nAny empty VARIABLE_VALUE implies a fail.\nTo list the versions of TLS the server accepts, run the\
    \ following statement:\nselect @@tls_version;\nIf the list includes TLSv1 and/or TLSv1.1, this is a fail.\nMariaDB negotiates\
    \ to the highest version of TLS. If connections are using older TLS\nversions, those clients will need to be upgraded\
    \ to newer MariaDB Connectors or\ncommunity drivers that support newer versions of TLS.\nRun the following statement\n\
    select user, host, ssl_type from mysql.user where user not in ('mysql',\n'root', 'mariadb.sys');\nIf ssl_type returns\
    \ X509, client-side certificate details must be provided to connect.\nRun the following statement:\nSELECT VARIABLE_NAME,\
    \ VARIABLE_VALUE\nFROM information_schema.global_variables\nWHERE VARIABLE_NAME = 'ssl_cipher';\nIf VARIABLE_VALUE is\
    \ empty, or includes unapproved ciphers, this is a fail.\nPerform the following steps to assess this recommendation:\n\
    • Execute the following SQL statement to determine the Value of datadir\nshow variables where variable_name = 'datadir';\n\
    Or\nSELECT VARIABLE_NAME, VARIABLE_VALUE\nFROM information_schema.global_variables\nWHERE VARIABLE_NAME LIKE 'datadir';\n\
    • Execute the following command at a terminal prompt\nsudo ls -ld <datadir> | grep \"drwxr-x---.*mysql.*mysql\"\nLack\
    \ of output implies a fail.\nPerform the following steps to assess this recommendation:\n1. Execute the following SQL\
    \ statement to determine the Value of\nlog_bin_basename:\nshow variables like 'log_bin_basename';\n2. Execute the following\
    \ command at a terminal prompt to list all non-compliant\nlog_bin_basename.* file permissions:\nls -l | egrep '^-(?![r|w]{2}-[r|w]{2}----\n\
    .*mysql\\s*mysql).*<log_bin_basename>.*$'\nLack of output implies compliance.\nPerform the following steps to assess this\
    \ recommendation:\n1. Execute the following SQL statement to determine the Value of log_error:\nshow variables like 'log_error';\n\
    2. Execute the following command at a terminal prompt to list all non-compliant\n<log_error>.* file permissions:\nls -l\
    \ /var/log/mysql/mariadb.err | grep '^-rw-------.*mysql.*mysql.*$'\nLack of output implies a fail.\nPerform the following\
    \ steps to assess this recommendation:\n1. Execute the following SQL statement to determine the Value of slow_query_log:\n\
    show variables like 'slow_query_log';\nBest for the slow query log to be disabled indicated by OFF.\n2. Execute the following\
    \ SQL statement to determine the location of\nslow_query_log_file:\nshow variables like 'slow_query_log_file';\n3. Execute\
    \ the following command at a terminal prompt to list non-compliant\n<slow_query_log_file>.* file permissions:\nls -l |\
    \ egrep '^-(?![r|w]{2}-[r|w]{2}----\n.*mysql\\s*mysql).*<slow_query_log_file>.*$'\nIf the slow query log is enabled, lack\
    \ of output implies compliance.\nIf the slow query log is disabled, remove any old slow query log files.\nPerform the\
    \ following steps to assess this recommendation:\n1. Execute the following SQL statement to determine the Value of\nrelay_log_basename:\n\
    show variables like 'relay_log_basename';\n2. Execute the following command at a terminal prompt to list non-compliant\n\
    <relay_log_basename>.* file permissions:\nls -l | egrep '^-(?![r|w]{2}-[r|w]{2}----\n.*mysql\\s*mysql).*<relay_log_basename>.*$'\n\
    Lack of output implies compliance.\nPerform the following steps to assess this recommendation:\n1. Execute the following\
