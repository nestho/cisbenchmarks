controls:
- id: 2.1.1
  title: Backup Policy in Place
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  description: A backup policy should be in place.
  rationale: Backing up MariaDB databases, including mysql, will help ensure the availability of data in the event of an incident.
    Without backups, it might be hard to recover from an incident.
  impact: ''
  references:
  - 1. https://mariadb.com/kb/en/backup-and-restore-overview/
  page_start: 34
  audit_raw: Check with crontab -l if there is a backup schedule.
  remediation: Create a backup policy and backup schedule.
  checks:
  - type: manual_review
    info: Check with crontab -l if there is a backup schedule.
    severity: medium
- id: 2.1.2
  title: Verify Backups are Good
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  description: Backups should be validated on a regular basis.
  rationale: Verifying that backups are occurring appropriately will help ensure data availability in the event of an incident.
    Without a well-tested backup, it might be hard to recover from an incident if the backup procedure contains errors or
    doesn't include all required data.
  impact: ''
  references:
  - 1. https://mariadb.com/kb/en/full-backup-and-restore-with-mariabackup/
  page_start: 35
  audit_raw: Check reports of backup validation tests.
  remediation: Implement regular backup checks and document each check.
  checks:
  - type: manual_review
    info: Check reports of backup validation tests.
    severity: medium
- id: 2.1.3
  title: Secure Backup Credentials
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  description: A database user with the least amount of privileges required to perform backup is needed. The credentials for
    this user should be protected. The password, certificate, and any other credentials should be protected.
  rationale: When the backup credentials are not properly secured, then they might be abused to gain access to the server.
    The backup user needs an account with many privileges, so an attacker might potentially gain (almost) complete access
    to the server.
  impact: ''
  references: []
  page_start: 36
  audit_raw: Check permissions of files containing passwords and/or SSL keys.
  remediation: Change file permissions.
  checks:
  - type: manual_review
    info: Check permissions of files containing passwords and/or SSL keys.
    severity: medium
- id: 2.1.4
  title: The Backups Should be Properly Secured
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  description: The backup files will contain all data in the databases. Filesystem permissions and/or encryption should be
    used to prevent unauthorized users from gaining access to the backups.
  rationale: Backups should be considered sensitive information. If an unauthorized user can access backups, then they have
    access to all data in the database. This is true for unencrypted backups and for encrypted backups if the encryption key
    is stored along with the backup.
  impact: ''
  references:
  - 1. https://mariadb.com/kb/en/using-encryption-and-compression-tools-withmariabackup/
  page_start: 37
  audit_raw: 'Check who has access to the backup files.

    • Are the files world-readable (e.g., rw-r--r-)

    o Are they stored in a world readable directory?

    • Is the group MySQL and/or backup specific?

    o If not: the file and directory must not be group readable

    • Are the backups stored offsite?

    o Who has access to the backups?

    • Are the backups encrypted?

    o Where is the encryption key stored?

    o Does the encryption key consist of a guessable password?'
  remediation: "Implement encryption, properly restrict filesystem permissions, protect and backup\nencryption keys.\n$ mariabackup\
    \ --defaults-file=/home/dbadmin/my.cnf --backup --stream=xbstream\n\\\n  | openssl  enc -aes-256-cbc -k mypass > backup.xb.enc\n\
    The example above creates an AES-encrypted backup, protected with the password\n\"mypass\" and stores it in a file \"\
    backup.xb.enc\":"
  checks:
  - type: manual_review
    info: 'Check who has access to the backup files.

      • Are the files world-readable (e.g., rw-r--r-)

      o Are they stored in a world readable directory?

      • Is the group MySQL and/or backup specific?

      o If not: the file and directory must not be group readable

      • Are the backups stored offsite?

      o Who has access to the backups?

      • Are the backups encrypted?

      o Where is the encryption key stored?

      o Does the encryption key consist of a guessable password?'
    severity: medium
- id: 2.1.5
  title: Point-in-Time Recovery
  scoring: scored
  profile:
  - Level 2 - MariaDB RDBMS on Linux
  - Level 2 - MariaDB RDBMS
  description: With binlogs it is possible to implement point-in-time recovery. This makes it possible to restore the changes
    between the last full backup and the point-in-time. Enabling binlogs is not sufficient. The binlogs need to be backed
    up to separate media. The restore procedure should be created and tested. The data in the binlog files may contain sensitive
    information which needs be stored in the proper location with restrictive permissions and may require encryption.
  rationale: Using binlogs can reduce the amount of information lost when recovering from a backup.
  impact: Binlogs can grow quite large and take up a large amount of space so auto remove needs to be put into place.
  references:
  - 1. https://mariadb.com/kb/en/replication-and-binary-log-system-variables/
  - 2. https://mariadb.com/kb/en/overview-of-the-binary-log/
  page_start: 39
  audit_raw: 'Check if binlogs are enabled and if there is a restore procedure. Check to see if --

    binlog-expire-logs-second is set.

    SELECT VARIABLE_NAME, VARIABLE_VALUE, ''BINLOG - Log Expiration'' as Note

    FROM information_schema.global_variables where variable_name =

    ''binlog_expire_logs_seconds'';

    Ensure this value is not set to 0.'
  remediation: Enable binlogs, then create and test a restore procedure.
  checks:
  - type: sql
    command: SELECT VARIABLE_NAME, VARIABLE_VALUE, 'BINLOG - Log Expiration' as Note
    severity: medium
    info: 'Check if binlogs are enabled and if there is a restore procedure. Check to see if --

      binlog-expire-logs-second is set.

      SELECT VARIABLE_NAME, VARIABLE_VALUE, ''BINLOG - Log Expiration'' as Note

      FROM information_schema.global_variables where variable_name =

      ''binlog_expire_logs_seconds'';

      Ensure this value is not set to 0.'
- id: 2.1.6
  title: Disaster Recovery (DR) Plan
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  description: A disaster recovery plan should be created. MariaDB Galera Cluster (group replication), MariaDB Replication
    (asynchronous replication) or both may be used. A replica in a different data center and offsite backups may be used.
    There should be information regarding the Recovery Time Objective (RTO), i.e., how long recovery will take, and if the
    recovery site has the same capacity. Additionally, delayed replicas can be a valuable part of a DR plan. Network (default)
    and at rest encryption should be used to protect data.
  rationale: A disaster recovery strategy should be planned and formalized. Without a well-tested disaster recovery plan,
    it might not be possible to recover in time.
  impact: ''
  references:
  - 1. https://mariadb.com/kb/en/setting-up-replication/
  - 2. https://mariadb.com/kb/en/getting-started-with-mariadb-galera-cluster/
  page_start: 41
  audit_raw: Check if there is a disaster recovery plan.
  remediation: Create a disaster recovery plan.
  checks:
  - type: manual_review
    info: Check if there is a disaster recovery plan.
    severity: medium
- id: 2.1.7
  title: Backup of Configuration and Related Files
  scoring: manual
  profile:
  - Level 1 - MariaDB RDBMS on Linux
  - Level 1 - MariaDB RDBMS
  - Level 2 - MariaDB RDBMS
  - Level 2 - MariaDB RDBMS on Linux
  description: 'It is important to include configuration, log, key, certificates, and customized files in backups. It is recommended
    that MariaDB Server software be installed on a dedicated server. This architectural consideration affords flexibility
    in that the database server can be placed on a separate zone allowing access only from particular hosts and over particular
    protocols. When a command is executed on the command line, for example mariadb -u admin -p password, the password may
    be visible in the user''s shell/command history or in the process list. Database user accounts should not be reused for
    multiple applications or users. The cryptographic material used by MariaDB, such as digital certificates and encryption
    keys, should be used only for MariaDB and only for one instance. Default cryptographic material should not be used since
    it is not unique to the instance. Password expiration provides users with a unique time bounded password lifetime. If
    users with accounts will not be using their account for some time, to reduce the risk of attacks or inappropriate account
    usage or if suspicions exist that an account might be under attack, disabling the account will secure it and once it''s
    ready to resume use it can easily be re-enabled. The server-side unix_socket authentication plugin authenticates clients
    that connect to the MariaDB server from the local host through the Unix socket file. Users authenticated using unix_socket
    need not specify a password when connecting to the server. However, users authenticated by the unix_socket plugin are
    restricted from connecting remotely; they can only connect from the local host through the Unix socket file. This method
    is only suitable in situations where the server administrator OS account access is restricted. By default, the MariaDB
    server accepts TCP/IP connections from MariaDB user accounts on all server host IPv6 and IPv4 interfaces. You can make
    this configuration more restrictive by setting the bind_address configuration option to a specific IPv4 or IPv6 address
    so that the server only accepts TCP/IP connections on that address. MariaDB supports multiple versions of TLS. The higher
    the version the stronger the security and/or better the performance. Client-side certificates may be used as proof of
    identity. MariaDB supports multiple encryption ciphers. Ciphers can vary in strength, speed and overhead. The data directory
    is the location of the MariaDB databases. MariaDB can operate using a variety of log files, each used for different purposes.
    These are the binary log (which can be encrypted), error log, slow query log, relay log, general log, and in the enterprise
    edition, the audit log (which can be encrypted). Because these are files on the host operating system, they are subject
    to the permissions and ownership structure provided by the host and may be accessible by users other than the MariaDB
    user. Additionally, using secure key management and at rest MariaDB encryption can further protect data from OS users.
    MariaDB can operate using a variety of log files, each used for different purposes. These are the binary log (which can
    be encrypted), error log, slow query log, relay log, general log, and in the enterprise edition, the audit log (which
    can be encrypted). Because these are files on the host operating system, they are subject to the permissions and ownership
    structure provided by the host and may be accessible by users other than the MariaDB user. Additionally, using secure
    key management and at rest MariaDB encryption can further protect data from OS users. Much of the information about the
    state of MariaDB exists in MariaDB, the MariaDB performance_schema or informations_schema. In cases where the information
    you need is within a running MariaDB, use these methods as they are more secure as they do not require OS login and access.
    MariaDB can operate using a variety of log files, each used for different purposes. These are the binary log (which can
    be encrypted), error log, slow query log, relay log, general log, and in the enterprise edition, the audit log (which
    can be encrypted). Because these are files on the host operating system, they are subject to the permissions and ownership
    structure provided by the host and may be accessible by users other than the MariaDB user. Additionally, using secure
    key management and at rest MariaDB encryption can further protect data from OS users. Much of the information about the
    state of MariaDB exists in MariaDB, the MariaDB performance_schema or informations_schema. If you can get the information
    you need from within MariaDB that is more secure as it does not require OS access. If you are not going to use log files
    it is best to first disable (don’t enable) and remove any prior logs. MariaDB can operate using a variety of log files,
    each used for different purposes. These are the binary log (which can be encrypted), error log, slow query log, relay
    log (which can be encrypted), general log, and in the enterprise edition, the audit log (which can be encrypted). Because
    these are files on the host operating system, they are subject to the permissions and ownership structure provided by
    the host and may be accessible by users other than the MariaDB user. Additionally, using secure key management and at
    rest MariaDB encryption can further protect data from OS users. MariaDB can operate using a variety of log files, each
    used for different purposes. These are the binary log (which can be encrypted), error log, slow query log, relay log (which
    can be encrypted), general log, and in the enterprise edition, the audit log (which can be encrypted). Because these are
    files on the host operating system, they are subject to the permissions and ownership structure provided by the host and
    may be accessible by users other than the MariaDB user. Additionally, using secure key management and at rest MariaDB
    encryption can further protect data from OS users. Much of the information about the state of MariaDB exists in MariaDB,
    the MariaDB performance_schema or informations_schema. If you can get the information you need from within MySQL that
    is more secure as it does not require OS access. If you are not going to use log files it is best to first disable (don’t
    enable) and remove any prior logs. When configured to use SSL/TLS, MariaDB relies on Secure Sockets Layer (SSL) key files,
    which are stored on the host''s filesystem. These SSL key files are subject to the host''s permissions and ownership structure.
    MariaDB provides ways to create the SSL certificate, SSL key files and RSA key-pair files required to support encrypted
    connections using SSL and secure password exchange using RSA over unencrypted connections, if those files are missing
    the server will attempt to autogenerate these files at startup if compiled with OpenSSL. The plugin directory is the location
    of the MariaDB plugins. Plugins are storage engines or user defined functions (UDFs). MariaDB can operate using a variety
    of log files, each used for different purposes. These are the binary log, error log, slow query log, relay log, audit
    log and general log. Because these are files on the host operating system, they are subject to the permissions and ownership
    structure provided by the host and may be accessible by users other than the mysql user. Certain Key Management Encryption
    plugins must store sensitive information in files for later retrieval. Such files should have proper permissions. Periodically,
    updates to MariaDB server are released to resolve bugs, mitigate vulnerabilities, and provide new features. It is recommended
    that MariaDB installations are up to date with the latest security updates. The default MariaDB installation does not
    contain any example or test databases. However, it is a good idea to review for common example databases and ensure they
    have been removed from production systems. This option prevents attaching arbitrary shared library functions as user-defined
    functions by checking for at least one corresponding method named _init, _deinit, _reset, _clear, or _add. The local_infile
    parameter dictates whether files located on the MariaDB client''s computer can be loaded or selected via LOAD DATA INFILE
    or SELECT local_file. This option causes mariadbd to start without using the privilege system. The symbolic-links and
    skip-symbolic-links options for MariaDB determine whether symbolic link support is available. When use of symbolic links
    is enabled, they have different effects depending on the host platform. When symbolic links are disabled, then symbolic
    links stored in files or entries in tables are not used by the database. The secure_file_priv option restricts to paths
    used by LOAD DATA INFILE or SELECT local_file. It is recommended that this option be set to a file system location that
    contains only resources expected to be loaded by MariaDB. Even better, if data import/export using LOAD DATA INFILE or
    SELECT local_file is not used, the functionality should be disabled entirely by setting --secure-file-priv to NULL. When
    data changing statements are made (i.e., INSERT, UPDATE), MariaDB can handle invalid or missing values differently depending
    on whether strict SQL mode is enabled. When strict SQL mode is enabled, data may not be truncated or otherwise "adjusted"
    to make the data changing statement work. Data-at-rest encryption protects the privacy of your information, prevents data
    breaches and helps meet regulatory requirements. The mysql.user, mysql.db, and other mysql tables ending in _priv list
    a variety of privileges that can be granted (or denied) to MariaDB users. Some of the privileges of concern include: Select_priv,
    Insert_priv, Update_priv, Delete_priv, Drop_priv, and so on. Typically, these privileges should not be available to every
    MySQL user and often are reserved for administrative use only. The information_schema.user_privileges provides a consolidated
    view of all user privileges. The FILE privilege is used to allow or disallow a user from reading and writing files on
    the server host. Any user with the FILE right granted has the ability to: • Read files from the local file system that
    are readable by the MariaDB server (this includes world-readable files). • Write files to the local file system where
    the MariaDB server has write access. The PROCESS privilege found in the mysql.user table determines whether a given user
    can see statement execution information for all sessions. The SUPER privilege is a powerful and far-reaching privilege
    and should not be granted lightly. In MariaDB, SUPER is deprecated and will be removed in a future version of MariaDB.
    The SUPER privilege shown in the INFORMATION_SCHEMA.USER_PRIVILEGES table governs the use of a variety of MariaDB features.
    These features include, CHANGE MASTER TO, KILL, mysqladmin kill option, PURGE BINARY LOGS, SET GLOBAL, mysqladmin debug
    option, logging control, and more. In MariaDB, SUPER is deprecated and will be removed in a future version of MariaDB.
    Migrating Accounts from SUPER to Dynamic Privileges is recommended. The SHUTDOWN privilege simply enables use of the shutdown
    option to the mysqladmin command, which allows a user with the SHUTDOWN privilege the ability to shut down the MariaDB
    server. The CREATE USER privilege governs the right of a given user to add or remove users, change existing users'' names,
    or revoke existing users'' privileges. The GRANT OPTION privilege exists in different contexts (mysql.user, mysql.db)
    for the purpose of governing the ability of a privileged user to manipulate the privileges of other users. The REPLICATION
    SLAVE privilege governs whether a given user (in the context of the source server) can request updates that have been
    made on the source server. DML/DDL includes the set of privileges used to modify or create data structures. This includes
    INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER privileges. Stored procedure and stored function declarations
    include a definition of permissions which can be used to escalate permissions. It''s important to inspect these settings
    to ensure they do not unnecessarily escalate privileges. The error log contains information about events such as mariadbd
    starting and stopping, when a table needs to be checked or repaired, and, depending on the host operating system, stack
    traces when mariadbd fails. MariaDB log files can be set in the MariaDB configuration to exist anywhere on the filesystem.
    It is common practice to ensure that the system filesystem is left uncluttered by application logs. System filesystems
    include the root (/), /var, or /usr. The log_warnings system variable, set to 2 by default, specifies the verbosity of
    events sent to the MariaDB error log. A value of 2 enables logging of error and warning messages, a value of 3 also includes
    informational logging, a value of 1 logs only errors. Enabling audit logging is an important consideration for a production
    environment, and MariaDB plugin exist to help with this. Enable audit logging for • Connect events • Query and Table events
    (optional) Set server_audit to FORCE_PLUS_PERMANENT The encrypt_binlog system variable may be used to configure encryption
    of the binary and relay logs. This may be configured to ON even if binary logging is not enabled in order to encrypt relay
    log files. The mysql_old_password plugin uses a cracked password routine with several flaws. It is present but not used
    by default in MariaDB. Steps should be taken to ensure that passwords will not be created with this plugin and that clients
    will not be able to authenticate to the MariaDB server using this plugin. The old_passwords system variable controls whether
    MariaDB server uses the mysql_old_password plugin (instead of the stronger mysql_native_password plugin) when creating
    passwords. The secure_auth system variable, when enabled, will block client connections that utilize the mysql_old_password
    plugin. The [client] section of the MariaDB configuration file allows setting a user and password to be used. Verify the
    password option is not used in the global configuration file (mariadb.cnf). The mysql_native_password and mysql_old_password
    plugins utilize weak cryptography and/or weak password routines. In particular, the mysql_old_password plugin utilizes
    cracked password routines and is subject to Pass-the-Hash attacks. The mysql_native_password plugin relies on the Secure
    Hash Algorithm 1 (SHA-1) algorithm. The National Institute of Standards and Technology (NIST) recommends against use of
    SHA-1. Additionally, these plugins allow users to set blank passwords, which allow authentication without providing a
    password. All users should be using alternative, stronger plugins or be configured with invalid passwords. See Default
    Value section and References for more details on specific account configurations. Passwords should be configured with
    a minimum length of 14 characters and should be checked against dictionaries of common, known, and expected passwords.
    MariaDB can make use of host wildcards when granting permissions to users on specific databases. For example, you may
    grant a given privilege to ''<user>''@''%''. Anonymous accounts are users with empty usernames (''''). Anonymous accounts
    have no passwords, so anyone can use them to connect to the MariaDB server. All network traffic must use SSL/TLS when
    traveling over untrusted networks. All network traffic must use SSL/TLS when traveling over untrusted networks. SSL/TLS
    should be enforced on a per-user basis for users which enter the system through the network. Limiting concurrent connections
    to a MariaDB server can be used to reduce risk of Denial of Service (DoS) attacks performed by exhausting connection resources.
    The replication traffic between servers should be secured. Security measures should include ensuring the confidentiality
    and integrity of the traffic and performing mutual authentication between the servers before performing replication. On
    the MariaDB REPLICA, the setting MASTER_SSL_VERIFY_SERVER_CERT indicates whether the REPLICA should perform server certificate
    verification of the PRIMARY''s certificate. The SUPER privilege found in the mysql.user table governs the use of a variety
    of MariaDB features. These features include, CHANGE MASTER TO, KILL, mysqladmin kill option, PURGE BINARY LOGS, SET GLOBAL,
    mysqladmin debug option, logging control, and more. MariaDB supports multiple encryption ciphers that can be used for
    TLS connections during replication. Ciphers can vary in strength, speed and overhead. Mutual TLS (a.k.a. Two-Way TLS)
    enhances TLS by requiring that both parties authenticate each other when establishing a connection. Mutual TLS adds a
    requirement (over TLS) that the client provide its certificate so the server can authenticate the client.'
  rationale: 'Including all configuration, log, key, certificates, and customized files in any backup will ensure the backup
    can fully restore an instance. The attack surface is reduced on a server with only the underlying operating system, MariaDB
    server software, and any security or operational tooling that may be additionally installed. A smaller attack surface
    reduces the probability of the data within MariaDB being compromised. If the password is visible in the process list or
    user''s shell/command history, an attacker will be able to access the MariaDB database using the stolen credentials. Utilizing
    unique database accounts across applications will reduce the impact of a compromised MySQL account. If a user is reused,
    then a compromise of this user will compromise multiple parts of the system and/or application. If a cryptographic material
    is used on multiple MariaDB instances and/or systems, then a compromise of one may lead to the network traffic of all
    servers being compromised that use the same cryptographic material. If an attacker gains access to shared cryptographic
    material, including default material, the attacker can reuse that material to impersonate the MariaDB server or otherwise
    compromise its operations. Allows additional security factors pertinent to a specific user to provide further password
    security; predetermined by varying security needs and usability requirements in a system or organization. Only have active
    accounts that will be used. This method may be desirable in specific cases, including: • The Linux system where MariaDB
    is running is dedicated to the MariaDB server and only the MariaDB DBA and OS Admin have access. • When control over user
    authentication is centralized in the operating system. • It is desirable that audit trails in the database and operating
    system can use the same user names. • For certain other narrow installation use cases unix_socket may be desirable. •
    Only local connections for a user. Limiting the IP address provides additional controls and restrictions on how client
    applications can connect to MariaDB. If not configured to a specific IP all IPs for this server can be used to connect
    to MariaDB. Requiring clients attempting to connect to MariaDB to use higher versions of TLS to better protect data in
    transit. Requiring client-side certificates provides additional validation of a user''s identity. Requiring clients attempting
    to connect to MariaDB to use strong ciphers protects data in transit. Limiting the accessibility of these objects will
    protect the confidentiality, integrity, and availability of the MariaDB database. If someone other than the MariaDB user
    is allowed to read files from the data directory, it may be possible to read data from the mysql.user table which contains
    passwords. Additionally, the ability to create files can lead to denial of service, or might otherwise allow someone to
    gain access to specific data by manually creating a file with a view definition. Limiting the accessibility of these objects
    will protect the confidentiality, integrity, and availability of the MariaDB logs. Limiting the accessibility of these
    objects will protect the confidentiality, integrity, and availability of the MariaDB logs. Limiting the accessibility
    of these objects will protect the confidentiality, integrity, and availability of the MariaDB logs. Limiting the accessibility
    of these objects will protect the confidentiality, integrity, and availability of the MariaDB logs. Limiting the accessibility,
    or existence, of these log files will protect the confidentiality, integrity, and availability of the MariaDB logs. Limiting
    the accessibility of these objects will protect the confidentiality, integrity, and availability of the MariaDB database
    and the communication with the client. If the contents of the SSL key file are known to an attacker, he or she might impersonate
    the server. This can be used for a man-in-the-middle attack. Depending on the SSL cipher suite, the key might also be
    used to decipher previously captured network traffic. Limiting the accessibility of these objects will protect the confidentiality,
    integrity, and availability of the MariaDB database. If someone can modify plugins then these plugins might be loaded
    when the server starts and the code will get executed. Limiting the accessibility of these objects will protect the confidentiality,
    integrity, and availability of the MariaDB logs. Limiting the accessibility of these files will protect the confidentiality,
    integrity, and availability of MariaDB plugin information and the data they protect. Maintaining currency with MariaDB
    patches will help reduce risk associated with known vulnerabilities present in the MariaDB server. Without the latest
    security patches MariaDB might have known vulnerabilities which could be used by an attacker to gain access. Dropping
    example databases will reduce the attack surface of the MariaDB server. Preventing shared libraries that do not contain
    user-defined functions from loading will reduce the attack surface of the server. For MariaDB client programs and connectors
    prior to 10.2.0, disabling local_infile reduces an attacker''s ability to read sensitive files off the affected server
    via an SQL injection vulnerability. If this option is used, all clients of the affected server will have unrestricted
    access to all databases. Prevents symbolic links from being used for database files. This is especially important when
    MariaDB is executing as root as arbitrary files may be overwritten. The symboliclinks option might allow someone to direct
    actions by the MariaDB server to other files and/or directories. Setting secure_file_priv reduces an attacker''s ability
    to read sensitive files off the affected server via a SQL injection vulnerability. Without strict mode the server tries
    to proceed with the action when an error might have been a more secure choice. For example, by default MariaDB will truncate
    data if it does not fit in a field, which can lead to unknown behavior, or be leveraged by an attacker to circumvent data
    validation. File system based encryption does a good job of protecting against data theft on devices unable to limit physical
    access. It does not, however, protect against users who have or gain access to the operating system, backups, over the
    network copies, etc. Encrypting data from MariaDB adds an additional layer of data protection. Limiting the accessibility
    of the mysql database will protect the confidentiality, integrity, and availability of the data housed within MariaDB.
    A user which has direct access to mysql.* might view password hashes, change permissions, or alter or destroy information
    intentionally or unintentionally. The FILE right allows MariaDB users to read files from disk and to write files to disk.
    This may be leveraged by an attacker to further compromise MariaDB. It should be noted that the MariaDB server should
    not overwrite existing files. The PROCESS privilege allows principals to view currently executing MariaDB statements beyond
    their own, including statements used to manage passwords. This may be leveraged by an attacker to compromise MariaDB or
    to gain access to potentially sensitive data. The SUPER privilege allows principals to perform many actions, including
    view and terminate currently executing MariaDB statements (including statements used to manage passwords). This privilege
    also provides the ability to configure MariaDB, such as enable/disable logging, alter data, disable/enable features. Limiting
    the accounts that have the SUPER privilege reduces the chances that an attacker can exploit these capabilities. It is
    more secure to migrate administrative users off SUPER and instead assign the specific and minimal set of mysql Dynamic
    Privileges needed to perform their tasks. The SHUTDOWN privilege allows principals to shutdown MariaDB. This may be leveraged
    by an attacker to negatively impact the availability of MariaDB. Reducing the number of users granted the CREATE USER
    right minimizes the number of users able to add/drop users, alter existing users'' names, and manipulate existing users''
    privileges. The GRANT OPTION privilege allows a principal to grant other principals additional privileges. This may be
    used by an attacker to compromise MariaDB. The REPLICATION SLAVE privilege allows a principal to fetch binlog files containing
    all data changing statements and/or changes to table data from the source. This may be used by an attacker to read/fetch
    sensitive data from MariaDB. INSERT, SELECT, UPDATE, DELETE, DROP, CREATE, and ALTER are powerful privileges in any database.
    Such privileges should be limited only to those users requiring such rights. By limiting the users with these rights and
    ensuring that they are limited to specific databases, the attack surface of the database is reduced. A stored procedure
    or function that improperly escalates privileges may provide unintended access rights which can be improperly used. Enabling
    error logging can increase the ability to detect malicious attempts against MariaDB, and other critical messages. For
    example, if the error log is not enabled then a connection error could go unnoticed. When configured to stderr MariaDB
    will send log data to the console. Logging to the console is useful, but remember it is ephemeral. This is not recommended
    due to the fact that logging to console does not provide a means to force restricted access via permissions strictly to
    MariaDB and dedicated MariaDB audit accounts. This may compromise the confidentiality of the MariaDB log data. Furthermore
    use caution if comingling log data from multiple sources as that can complicate log inspection. Additionally from a security
    auditing perspective, it’s difficult and error prone to verify logging is correct using stderr or redirected stderr. Moving
    the MariaDB logs off the system partition will reduce the probability of denial of service via the exhaustion of available
    disk space to the operating system. This might help to detect malicious behavior by logging communication errors and aborted
    connections. Audit logging helps to identify who changed what and when. The audit log might be used as evidence in investigations.
    It might also help to identify what an attacker was able to accomplish. This disables unloading on the plugin. The database,
    and thus the binary and relay logs, may contain sensitive information. Encrypting the binary and relay logs protects all
    data stored in these logs from internal and external threats. Use of the mysql_old_password plugin risks disclosure of
    users'' passwords and also permits Pass-the-Hash attacks. Using the password parameter may negatively impact the confidentiality
    of the user''s password. Without a password, only knowing the username and the list of allowed hosts will allow someone
    to connect to the server and assume the identity of the user. This, in effect, bypasses authentication mechanisms. Acquisition
    of user password hashes exposes users to password cracking and Passthe-Hash attacks. Setting a root password exposes password-based
    root access to remote users and to non-root linux users. Long passwords help mitigate dictionary, brute forcing, and other
    password attacks. Comparing passwords to password dictionaries prevents users from choosing known and easily guessable
    passwords. Avoiding the use of wildcards within hostnames helps control the specific locations from which a given user
    may connect to and interact with the database. Removing anonymous accounts will help ensure that only identified and trusted
    principals are capable of interacting with MariaDB. Enabling SSL/TLS will allow clients to encrypt network traffic and
    verify the identity of the server. SSL/TLS helps to prevent eavesdropping and man-in-the-middle attacks. SSL/TLS helps
    to prevent eavesdropping and man-in-the-middle attacks. Limiting the number of concurrent sessions at the server and per
    user level helps to reduce the risk of DoS attacks. MariaDB provides mechanisms to limit the number of simultaneous connections
    that can be made at the server level or by any given account. The replication traffic should be secured as it gives access
    to all transferred information and might leak passwords. When establishing TLS connections, clients use certificate verification
    to authenticate the server as their intended peer in the connection. In this case, the REPLICA (client) should verify
    the PRIMARY''s (server''s) certificate to authenticate the PRIMARY prior to continuing the connection. The SUPER privilege
    allows principals to perform many actions, including view and terminate currently executing MariaDB statements (including
    statements used to manage passwords). This privilege also provides the ability to configure MariaDB, such as enable/disable
    logging, alter data, disable/enable features. Limiting the accounts that have the SUPER privilege reduces the chances
    that an attacker can exploit these capabilities. Requiring REPLICA servers to utilize strong ciphers when connecting to
    a PRIMARY server protects data in transit. By requiring the client to authenticate to the server (in this case, the REPLICA
    to authenticate to the PRIMARY), the server (PRIMARY) prevents unauthorized clients (REPLICAs) from performing replication.'
  impact: 'Care must be taken that applications or services that are required for proper operation of the operating system
    are not removed. Custom applications may need to be modified to accommodate database connections over the network rather
    than on the use (e.g., using TCP/IP connections). Additional hardware and operating system licenses may be required to
    make the architectural change. Depending on the remediation chosen, additional steps may need to be undertaken like: •
    Entering a password when prompted. • Ensuring the file permissions on .mariadb.cnf is restricted yet accessible by the
    user. • Use a pluggable secure password store, e.g., a keychain. Additionally, not all scripts/applications may be able
    to use .mariadb.cnf. Things to consider when using the operating system to authenticate users: • The user must have an
    operating system account on the computer which must be accessed. • If a user has logged in using this method and steps
    away from the terminal, another user could easily log in because this user does not need any passwords or credentials.
    This could pose a serious security problem. • When an operating system is used to authenticate database users, managing
    distributed database environments and database links requires special care. Special care must also be taken not to leave
    such a terminal unlocked and unattended. Hence, we recommend that you carefully evaluate your requirements before opting
    for unix_socket. • This will not work where distributed connections are required. The root account in MariaDB utilizes
    the unix_socket plugin by default. Disabling the unix_socket plugin will make the root account inaccessible unless a valid
    password is first set for root. If a fully-privileged account is needed while also disabling the unix_socket plugin, see
    Remediation Procedure (Notes) in Recommendation 7.3 ("Ensure strong authentication is utilized for all accounts") for
    guidance and considerations. Connections attempting to use an unsupported version of TLS will fail. Connections attempting
    to use an unsupported cipher will fail. Changing the permissions and ownership of the relay logs and binary log files
    might have impact on external tools. If the permissions on the relay logs and binary log files are accidentally changed
    to exclude the user account which is used to run the MariaDB service, then this might break replication. The binary log
    file can be used for point-in-time recovery so this can also affect backup, restore, and disaster recovery procedures.
    Changing the permissions of the error log files might have impact on monitoring tools which use an error log file adapter.
    Changing the permissions of the log files may impact monitoring tools which use a log file adapter. Also, the slow query
    log can be used for performance analysis by application developers. The information about the performance exists in MariaDB
    performance_schema or sys schema views. In cases where the information you need is within a running MariaDB, disable the
    slow query log and instead use these methods as they are more secure and do not require OS login and access. If the permissions
    on the relay logs and binary log files are accidentally changed to exclude the user account which is used to run the MariaDB
    service, then this might break replication. The binary log file can be used for point in time recovery so this can also
    affect backup, restore and disaster recovery procedures. Changing the permissions of the general log files may impact
    monitoring tools which use a log file adapter. If the permissions or ownership for the SSL key file are configured incorrectly,
    this can cause SSL to be disabled when MariaDB is restarted or can cause MariaDB not to start at all. If other applications
    are using the same key pair, then changing the permissions or ownership of the SSL key file will affect this application.
    If this were to occur a new key pair must be generated for MariaDB. Users other than the MariaDB user will no longer be
    able to update and add/remove plugins unless they''re able to switch to the MariaDB user. Changing the permissions and
    ownership of the audit log file may have an impact on who can access and edit the audit log. Such changes can affect monitoring
    tools which maybe using a log file adapter or scripted alternatives. Also, the audit log may be used for alerting by infrastructure
    teams which can affect real-time audit capability. To update the MariaDB server a restart is required. Disabling local_infile
    will impact the functionality of solutions that rely on it. Solutions that rely on loading data from various sub-directories
    may be negatively impacted by this change. Consider consolidating load directories under a common parent directory. The
    server checks the value of secure_file_priv at startup and writes a warning to the error log if the value is insecure.
    A non-NULL value is considered insecure if it is empty, or the value is the data directory or a subdirectory of it, or
    a directory that is accessible by all users. Applications relying on the MariaDB database should be aware that STRICT_ALL_TABLES
    is in use, such that error conditions are handled appropriately. Users denied the PROCESS privilege may also be denied
    use of SHOW ENGINE. When the SUPER privilege is denied to a given user, that user will be unable to take advantage of
    certain capabilities, such as certain mysqladmin options. Users that are denied the CREATE USER privilege will not only
    be unable to create a user, but they may be unable to drop a user, rename a user, or otherwise revoke a given user''s
    privileges. If someone can unload the plugin it would be possible to perform actions on the database without audit events
    being logged to the audit log. If the audit log plugin can be unloaded the audit log can be temporarily or permanently
    disabled. The global configuration is by default readable for all users on the system. This is needed for global defaults
    (prompt, port, socket, etc.). If a password is present in this file then all users on the system may be able to access
    it. Using the ed25519 plugin will require installation of the plugin, and some clients may need to be configured to utilize
    the client_ed25519 plugin. Users will not be able to directly set password hashes directly (e.g. SET PASSWORD = '''')
    since this bypasses password validation. Any applications relying on anonymous database access will be adversely affected
    by this change. Enabling SSL/TLS could have impact on network traffic inspection. When SSL/TLS is enforced then clients
    which do not use SSL will not be able to connect. If the server is not configured for SSL/TLS then accounts for which
    SSL/TLS is mandatory will not be able to connect. When the replication traffic is not secured someone might be able to
    capture passwords and other sensitive information when sent to the replica. When using CHANGE MASTER TO, be aware of the
    following: • REPLICA processes need to be stopped by running STOP REPLICA prior to executing CHANGE MASTER TO • Use of
    CHANGE MASTER TO starts new relay logs without keeping the old ones unless explicitly told to keep them • When CHANGE
    MASTER TO is invoked, some information is dumped to the error log (previous values for MASTER_HOST, MASTER_PORT, MASTER_LOG_FILE,
    and MASTER_LOG_POS) • Invoking CHANGE MASTER TO will implicitly commit any ongoing transactions in the session where the
    CHANGE MASTER TO was run, but not all ongoing transactions on the database. When the SUPER privilege is denied to a given
    user, that user will be unable to take advantage of certain capabilities, such as certain mysqladmin options. If the PRIMARY
    and REPLICA servers don''t support common cipher suites, replication will fail. The REPLICA will need to have TLS enabled
    to support mutual TLS.'
