      years) being the recommended value.

      The includeSubDomains directive.

      The always p'
- id: 4.1.9
  title: Ensure upstream server traffic is authenticated with a client certificate
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: In a reverse proxy configuration, NGINX acts as a client when communicating with an upstream server. To secure
    this server-to-server connection based on a Zero Trust principle, mutual TLS (mTLS) must be used. This is achieved by
    configuring NGINX to present its own client certificate to the upstream server. The upstream server then authenticates
    NGINX based on this certificate, ensuring that only trusted proxies can access backend services.
  rationale: Authenticating the proxy's connection to the upstream server via a client certificate provides strong, cryptographic
    proof of identity. This is vastly superior to weaker authentication methods like IP whitelisting, which can be spoofed.
    In a modern microservices or cloud environment, mTLS is a cornerstone of network security, as it prevents unauthorized
    services from making requests to sensitive backends, thereby mitigating lateral movement attacks.
  impact: Implementing mTLS introduces operational overhead for certificate management. You must have a process (often an
    internal Public Key Infrastructure, or PKI) for issuing, renewing, and revoking these client certificates. If the client
    certificate used by NGINX expires, or if the CA certificate on the upstream server expires, the connection between NGINX
    and the upstream will fail, leading to a service outage.
  references:
  - 1. https://docs.nginx.com/nginx-instance-manager/system-configuration/securetraffic/
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_ssl_certificate
  page_start: 104
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration for the

    required directives:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (proxy_ssl_certificate|proxy_ssl_certificate_key)''

    Verify that the output includes both proxy_ssl_certificate and

    proxy_ssl_certificate_key directives with the correct paths within the relevant

    location block.

    Note: A complete audit is two-sided. You must also verify that the upstream server is

    configured to require and validate client certificates against a trusted CA. This part of

    the audit is outside the scope of the NGINX configuration itself.'
  remediation: "Implementing mTLS requires configuration on both the NGINX proxy (the client) and the\nupstream server (the\
    \ server). This example assumes you have a simple internal CA.\nPrerequisite: Create a CA\n# Create CA Key\nopenssl genrsa\
    \ -out my-ca.key 4096\n# Create CA Certificate\nopenssl req -x509 -new -nodes -key my-ca.key -sha256 -days 3650 -out my-ca.crt\n\
    Step 1: Configure the Upstream Server to Require Client Certificates\nThe upstream server must be configured to request\
    \ and verify client certificates against\nyour CA. (If your upstream is also NGINX, the config would look like this):\n\
    # On the Upstream Server's configuration\nserver {\n    listen 443 ssl;\n    # ... other ssl directives ...\n    ssl_client_certificate\
    \  /path/to/my-ca.crt; # The CA to verify against\n    ssl_verify_client on;                       # Require a valid client\
    \ cert\n}\nStep 2: Create and Sign a Client Certificate for NGINX\nOn your NGINX proxy, create a key and a Certificate\
    \ Signing Request (CSR).\n# Create a key for the NGINX proxy\nopenssl genrsa -out      nginx-client.key 4096\n# Create\
    \ CSR\nopenssl req    -new -key nginx-client.key -out nginx-client.csr\nSign this CSR with your CA to create the client\
    \ certificate:\nopenssl x509  -req -in nginx-client.csr -CA my-ca.crt -CAkey my-ca.key -\nCAcreateserial -out nginx-client.crt\
    \ -days 365\nStep 3: Configure NGINX to Present its Client Certificate\nIn your NGINX reverse proxy configuration, use\
    \ the generated client certificate and key.\n# In your reverse proxy's location block\nlocation /api/ {\n    proxy_pass\
    \                 https://your-upstream-server;\n    # Present this client cert to the upstream\n    proxy_ssl_certificate\
    \     /etc/nginx/ssl/nginx-client.crt;\n    proxy_ssl_certificate_key /etc/nginx/ssl/nginx-client.key;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: Verify that the output includes both proxy_ssl_certificate and
    severity: medium
    info: 'Run the following command to inspect the fully loaded NGINX configuration for the

