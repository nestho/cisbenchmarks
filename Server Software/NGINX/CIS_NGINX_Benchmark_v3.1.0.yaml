- id: 5.2.4
  title: Ensure the number of connections per IP address is limited
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: 'NGINX''s ngx_http_limit_conn_module provides a mechanism to limit the number of simultaneous connections from
    a single client IP address. This is achieved in two steps: limit_conn_zone: This directive, typically defined in the http
    block, creates a shared memory zone to store the state for each client IP address. limit_conn: This directive, applied
    in a server or location block, enforces a specific connection limit using the previously defined zone. When a client exceeds
    this limit, NGINX will reject new connections with a 503 Service Temporarily Unavailable  error.'
  rationale: The primary purpose of connection limiting is to mitigate resource exhaustion and certain types of Denial of
    Service (DoS) attacks where an attacker opens many connections and holds them open for as long as possible. It is a different
    tool than rate limiting (limit_req), which is designed to stop rapid-fire requests (like brute-force attacks). By enforcing
    a reasonable connection limit, the server can prevent a single malicious or misconfigured client from consuming an unfair
    share of worker connections.
  impact: This is a critical consideration. A single public IP address can represent thousands of individual users behind
    a large corporate NAT, a university campus, or a Carrier-Grade NAT (CG-NAT) from a mobile provider. Setting the connection
    limit too low will block legitimate users in these scenarios. The appropriate limit is a delicate balance and depends
    entirely on the target audience. A public-facing website requires a much higher limit than a restricted admin interface.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
  - 2. NIST SP 800-53:rev5:SC-6
  page_start: 131
  audit_raw: 'This is a manual check requiring context.

    1. Run the following command to inspect the loaded NGINX configuration for

    connection limiting rules:

    nginx -T 2>/dev/null | grep -E ''^\s*(limit_conn_zone|limit_conn)''

    2. Manually evaluate the findings:

    Is a limit_conn_zone defined in the http block?

    Is a limit_conn directive applied in the appropriate server or location

    blocks?

    Critically, assess the configured limit. Is a limit of 10 appropriate for a public website

    accessed by customers or large companies? Or is it a sensible value for a specific

    /login location? The value must be justifiable for its context.'
  remediation: "First, define a shared memory zone in the http block. Then, apply a carefully\nconsidered limit in the server\
    \ or location context.\nUnderstanding the zone size: The memory usage for the $binary_remote_addr\nkey is fixed (64 bytes\
    \  on a 64-bit system). Therefore, 1 megabyte  of zone memory\ncan store approximately 16,384 states. A 10m zone can store\
    \ over 160,000 states.\nExample Configuration:\nhttp {\n    # Define a 10MB zone named 'per_ip' to track connections by\
    \ IP.\n    # $binary_remote_addr is more memory-efficient than $remote_addr.\n    limit_conn_zone $binary_remote_addr\
    \ zone=per_ip:10m;\n    server {\n        # Apply a general limit of 20 connections per IP for this server.\n        #\
    \ This might be a reasonable starting point for a public site.\n        limit_conn per_ip 20;\n        # For a resource-intensive\
    \ download area, apply a stricter limit.\n        location /downloads/ {\n            limit_conn per_ip 5;\n        }\n\
    \    }\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(limit_conn_zone|limit_conn)'
    expected: ''
    severity: medium
    info: 'This is a manual check requiring context.

      1. Run the following command to inspect the loaded NGINX configuration for

      connection limiting rules:

      nginx -T 2>/dev/null | grep -E ''^\s*(limit_conn_zone|limit_conn)''

      2. Manually evaluate the findings:

      Is a limit_conn_zone defined in the http block?

      Is a limit_conn directive applied in the appropriate server or location

      blocks?

      Critically, assess the conf'
- id: 5.2.5
  title: Ensure rate limits by IP address are set
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: 'NGINX''s ngx_http_limit_req_module provides a mechanism to limit the rate of incoming requests from a single
    client IP address, based on the "leaky bucket" algorithm. This is configured in two steps: 1. limit_req_zone: This directive,
    defined in the http block, creates a shared memory zone that defines the bucket''s parameters, such as the average request
    rate. 2. limit_req: This directive, applied in a server or location block, enforces the rate limit using a specific zone
    and defines how "bursts" of traffic are handled. When a client exceeds the defined rate, NGINX will reject new requests
    with a 503 Service Temporarily Unavailable  error.'
  rationale: Rate limiting is the primary defense against application-level, high-frequency attacks. Its main purpose is to
    prevent brute-force password guessing on login endpoints, API abuse by automated scripts, and aggressive content scraping.
    Unlike connection limiting (limit_conn), which focuses on slow, simultaneous connections, rate limiting (limit_req) targets
    clients making an excessive number of requests in a short period.
  impact: Applying a global, aggressive rate limit is extremely dangerous and will almost certainly block legitimate users
    accessing your site from behind a shared NAT (e.g., corporate offices, datacenters, mobile networks). Rate limiting is
    a surgical tool that must be applied only to specific, sensitive locations (e.g., /login, /api/v1/authenticate) where
    abuse is likely. Incorrectly configured rate limits are a common source of user complaints and support tickets.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
  - 2. NIST SP 800-53:rev5:SC-5 b
  page_start: 134
  audit_raw: 'This is a manual check requiring context.

    1. Run the following command to find rate-limiting rules:

    nginx -T 2>/dev/null | grep -E ''^\s*(limit_req_zone|limit_req)''

    2. Manually evaluate the findings:

    Is a limit_req_zone defined in the http block?

    Important, where is limit_req applied? Is it applied globally (server Block

    or location / )? This is a high risk. Or is it applied to specific endpoints like

    /login? Which is best practice.

    Are the rate and burst values reasonable for the protected endpoint?'
  remediation: "First, define a shared memory zone in the http block. Then, apply a carefully tuned\nlimit only to the specific\
    \ location blocks that require protection.\nUnderstanding the \"Leaky Bucket\" Parameters:\nrate: The average rate at\
    \ which the bucket \"leaks\" (requests are processed).\n5r/s means 5 requests per second.\nburst: The size of the bucket.\
    \ It's the number of \"token\" requests a client can\nmake in excess of the defined rate. A burst=10 allows a client to\
    \ burst up to 10\nrequests instantly before the rate limit kicks in.\nnodelay: Without nodelay, excess requests in a burst\
    \ are queued and\nprocessed at the defined rate (slowing the client down). With nodelay, excess\nrequests are processed\
    \ immediately as long as they fit in the burst \"bucket\", and\nonly requests beyond the burst limit are rejected. For\
    \ APIs and login pages,\nnodelay is generally preferred for a better user experience.\nExample Configuration:\nhttp {\n\
    \    # Define a 10MB zone for login attempts.\n    # Rate: 1 request per second average.\n    limit_req_zone    $binary_remote_addr\
    \ zone=login_limit:10m rate=1r/s;\n    server {\n        # NO global rate limit here!\n        location / {\n        \
    \    # Normal traffic, no rate limit\n        }\n        # Apply a strict rate limit ONLY to the login endpoint\n    \
    \    location /login {\n            # Use the 'login_limit' zone.\n            # Allow a burst of 5 requests, then enforce\
    \ the 1r/s limit.\n            # 'nodelay' ensures a user can quickly resubmit a form without being\nartificially slowed\
    \ down.\n            limit_req    zone=login_limit burst=5 nodelay;\n            # ... other settings ...\n        }\n\
    \    }\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(limit_req_zone|limit_req)'
    expected: ''
    severity: medium
    info: 'This is a manual check requiring context.

      1. Run the following command to find rate-limiting rules:

      nginx -T 2>/dev/null | grep -E ''^\s*(limit_req_zone|limit_req)''

      2. Manually evaluate the findings:

      Is a limit_req_zone defined in the http block?

      Important, where is limit_req applied? Is it applied globally (server Block

      or location / )? This is a high risk. Or is it applied to specific endpoints l'
- id: 5.3.1
  title: Ensure X-Content-Type-Options header is configured and enabled
  scoring: manual
  profile:
  - Level 1
  description: The X-Content-Type-Options header instructs the browser to strictly follow the MIME types declared in the Content-Type
    headers and not to guess ("sniff") the content type based on the file's actual content.
  rationale: Implementing the X-Content-Type-Options header with the nosniff directive helps to prevent drive-by download
    attacks where a user agent is sniffing content types in responses. This header prevents "MIME type confusion" attacks.
    Without this header, browsers might interpret a file declared as text (e.g., snippet.txt) as executable if it contains
    script code. Setting the nosniff directive forces the browser to reject the file if the declared type doesn't match the
    context in which it's loaded (e.g., loading a text file as a script).
  impact: 'Low Risk: In rare cases, legacy applications or misconfigured servers might rely on the browser''s ability to correct
    wrong Content-Type headers (e.g., serving JavaScript with a text/plain header). Enabling nosniff will break these applications
    because the browser will refuse to execute the script. Ensuring correct MIME types in the NGINX configuration (mime.types)
    is a prerequisite.'
  references:
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/XContent-Type-Options
  - 2. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  page_start: 139
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration:

    nginx -T 2>/dev/null | grep -i ''X-Content-Type-Options''

    Verify the output:

    Verify that the configuration contains the line: add_header X-Content-TypeOptions "nosniff" always;

    Specifically check for the always parameter at the end of the directive. Without

    it, the header will be missing on error pages.'
  remediation: 'Open the NGINX configuration file that contains your server blocks. Add the below line

    into your server block to add X-Content-Type-Options  header and direct your

    user agent to not sniff content types.

    add_header X-Content-Type-Options "nosniff" always;'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i 'X-Content-Type-Options'
    expected: 'Verify that the configuration contains the line: add_header X-Content-TypeOptions "nosniff" always;'
    severity: medium
    info: 'Run the following command to inspect the fully loaded NGINX configuration:

      nginx -T 2>/dev/null | grep -i ''X-Content-Type-Options''

      Verify the output:

      Verify that the configuration contains the line: add_header X-Content-TypeOptions "nosniff" always;

      Specifically check for the always parameter at the end of the directive. Without

      it, the header will be missing on error pages.'
- id: 5.3.2
  title: Ensure that Content Security Policy (CSP) is enabled and configured properly
  scoring: manual
  profile:
  - Level 2
  description: Content Security Policy (CSP) is an HTTP response header that allows site administrators to declare approved
    sources of content that browsers are allowed to load on that page. It is a mechanism to detect and mitigate certain types
    of attacks, including Cross-Site Scripting (XSS) and data injection attacks. Furthermore, CSP's frameancestors directive
    is the modern replacement for the X-Frame-Options header to prevent Clickjacking.
  rationale: A robust CSP significantly reduces the attack surface of a web application. By restricting the domains from which
    scripts, styles, images, and other resources can be loaded, it effectively neutralizes many XSS vectors. Additionally,
    by using the frame-ancestors directive, it explicitly controls which parent pages are allowed to embed the application
    (e.g., via <iframe>), providing a more flexible protection against Clickjacking than the legacy X-Frame-Options header.
  impact: Implementing a strict CSP is complex and carries a high risk of breaking application functionality. If a legitimate
    resource (e.g., a CDN script, a font file, or an inline script) is not whitelisted, the browser will block it, potentially
    making the site unusable. CSP implementation should always start in "Report-Only" mode (Content-SecurityPolicy-Report-Only)
    to gather violation reports before enforcing the policy.
  references:
  - 1. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  - 2. https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sh
  page_start: 141
  audit_raw: '1. Run the following command to inspect the CSP configuration:

    nginx -T 2>/dev/null | grep -i ''Content-Security-Policy''

    2. Evaluate the policy:

    Is the header present?

    Does it include at least a restrictive default-src directive (e.g., ''self'' or

    ''none'')?

    Does it include the frame-ancestors directive to mitigate Clickjacking?

    Critically: Is unsafe-inline or unsafe-eval avoided in script-src?

    (Allowing these significantly weakens the protection).'
  remediation: 'CSP must be tailored to the specific application. There is no single "correct" policy.

    Step 1: The Baseline Policy (High Security)

    Start with a policy that denies everything by default and only allows resources from the

    same origin. It also prevents the site from being framed by anyone (Clickjacking

    protection).

    add_header Content-Security-Policy "default-src ''self''; frame-ancestors ''self'';

    form-action ''self'';" always;

    Step 2: Adaptation (Example)

    If your application loads images from a CDN and needs to be embeddable by a specific

    partner site:

    add_header Content-Security-Policy "default-src ''self''; img-src ''self''

    https://cdn.example.com; frame-ancestors ''self'' https://partner-site.com;" always;

    Note: Use Content-Security-Policy-Report-Only during the testing phase to

    debug your policy without breaking the site.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i 'Content-Security-Policy'
    expected: ''
    severity: medium
    info: '1. Run the following command to inspect the CSP configuration:

      nginx -T 2>/dev/null | grep -i ''Content-Security-Policy''

