- id: 5.3.3
  title: Ensure the Referrer Policy is enabled and configured properly
  scoring: manual
  profile:
  - Level 2
  description: The Referrer-Policy HTTP header controls how much referrer information (sent via the Referer header) should
    be included with requests. It allows site administrators to restrict the data sent to upstream servers when a user clicks
    a link or loads a resource. This is a privacy control to prevent leaking sensitive URL parameters or internal path structures
    to third parties.
  rationale: 'URLs often contain sensitive information such as session tokens, search queries, or Personally Identifiable
    Information (PII) in their query parameters. Without a strict Referrer Policy, this full URL is transmitted to any third-party
    site the user visits from your page, potentially logging sensitive data on external servers. Configuring this header ensures
    that only the necessary information (e.g., just the origin domain) is shared, protecting user privacy and preventing data
    leakage. Identity Providers (IdP) or the underlying Operating System for user authentication and authorization logic.
    For local user authentication controls (e.g., PAM, Shadow File permissions), refer to the CIS-Benchmark™ for your Operating
    System. For network-based access controls (IP Allow/Deny), refer to Section 5 (Network Security) of this benchmark. For
    application-level authentication (OIDC, LDAP, SAML), refer to the documentation of the specific application or Identity
    Provider. Appendix: Summary Table CIS Benchmark Recommendation Set Correctly Yes No 1 Initial Setup 1.1 Installation 1.1.1
    Ensure NGINX is installed (Manual) ☐ ☐ 1.2 Configure Software Updates 1.2.1 Ensure package manager repositories are properly
    configured (Manual) ☐ ☐ 1.2.2 Ensure the latest software package is installed (Manual) ☐ ☐ 2 Basic Configuration 2.1 Minimize
    NGINX Modules 2.1.1 Ensure only required dynamic modules are loaded (Manual) ☐ ☐ 2.2 Account Security 2.2.1 Ensure that
    NGINX is run using a non-privileged, dedicated service account (Manual) ☐ ☐ 2.2.2 Ensure the NGINX service account is
    locked (Manual) ☐ ☐ 2.2.3 Ensure the NGINX service account has an invalid shell (Manual) ☐ ☐ 2.3 Permissions and Ownership
    2.3.1 Ensure NGINX directories and files are owned by root (Manual) ☐ ☐ 2.3.2 Ensure access to NGINX directories and files
    is restricted (Manual) ☐ ☐ 2.3.3 Ensure the NGINX process ID (PID) file is secured (Manual) ☐ ☐ 2.4 Network Configuration
    CIS Benchmark Recommendation Set Correctly Yes No 2.4.1 Ensure NGINX only listens for network connections on authorized
    ports (Manual) ☐ ☐ 2.4.2 Ensure requests for unknown host names are rejected (Manual) ☐ ☐ 2.4.3 Ensure keepalive_timeout
    is 10 seconds or less, but not 0 (Manual) ☐ ☐ 2.4.4 Ensure send_timeout is set to 10 seconds or less, but not 0 (Manual)
