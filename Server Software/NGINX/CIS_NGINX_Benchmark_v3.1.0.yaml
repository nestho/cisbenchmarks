- id: 2.5.1
  title: Ensure server_tokens directive is set to `off`
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The server_tokens directive is responsible for displaying the NGINX version number and operating system version
    on error pages and in the Server HTTP response header field. This information should not be displayed.
  rationale: Attackers can conduct reconnaissance on a website using these response headers, then target attacks for specific
    known vulnerabilities associated with the underlying technologies. Hiding the version will slow down and deter some potential
    attackers.
  impact: None. Disabling server tokens does not affect functionality. It merely removes the version string from error pages
    and headers. Note that determined attackers can still fingerprint NGINX via other methods, but removing the banner raises
    the bar for opportunistic scanners.
  references:
  - 1. NIST SP 800-53:rev5:RA-5 (4)
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 59
  audit_raw: 'In the NGINX configuration file nginx.conf, verify the server_tokens directive is

    set to off. To do this, check the response headers for the server header by issuing this

    command:

    curl -I 127.0.0.1 | grep -i server

    The output should not contain the server header providing your server version, such as

    the below:

    Server: nginx/1.28.0'
  remediation: "Disable version disclosure globally by adding the directive to the http block in\n/etc/nginx/nginx.conf:\n\
    http {\n    ...\n    server_tokens        off;\n    ...\n}"
  checks:
  - type: command
    command: curl -I 127.0.0.1 | grep -i server
    expected: ''
    severity: medium
    info: 'In the NGINX configuration file nginx.conf, verify the server_tokens directive is

      set to off. To do this, check the response headers for the server header by issuing this

      command:

      curl -I 127.0.0.1 | grep -i server

      The output should not contain the server header providing your server version, such as

      the below:

      Server: nginx/1.28.0'
- id: 2.5.2
  title: Ensure default error and index.html pages do not reference NGINX
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Default error pages (e.g., 404, 500) and the default welcome page often contain NGINX branding or signatures.
    These pages should be removed or replaced with generic or custom-branded pages that do not disclose the underlying server
    technology.
  rationale: Standard NGINX error pages visually identify the server software, even if headers are suppressed. By gathering
    information about the underlying technology stack, attackers can tailor their exploits to known vulnerabilities of NGINX.
    Replacing default pages with generic or branded content removes this information leakage vector and increases the effort
    required for successful reconnaissance.
  impact: Creating and maintaining custom error pages requires additional administrative effort. Ensure that custom error
    pages are simple and do not themselves introduce vulnerabilities.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#error_page
  - 2. NIST SP 800-53:rev5:SI-11 a
  page_start: 61
  audit_raw: '1. Verify Config:

    Check if error_page directives are active:

    nginx -T 2>/dev/null | grep -i "error_page"

    2. Verify Content (Functional Test):

    Trigger an error (e.g., request a non-existent page) and inspect the body:

    curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"

    Evaluation:

    PASS: The output does not contain "nginx" (or grep returns nothing).

    FAIL: The HTML body contains "nginx".'
  remediation: "Instead of editing the default files (which may be overwritten by package updates),\nconfigure NGINX to use\
    \ custom error pages.\n1. Create Custom Error Pages:\nCreate a directory (e.g., /var/www/html/errors) and place generic\
    \ HTML files there\n(e.g., 404.html, 50x.html) without NGINX branding.\n2. Configure NGINX:\nAdd the error_page directive\
    \ to your http or server blocks:\nerror_page 404 /404.html;\nerror_page 500 502 503 504 /50x.html;\nlocation = /50x.html\
    \ {\n    root /var/www/html/errors;\n    internal;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "error_page" && curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"
    expected: ''
    severity: medium
    info: '1. Verify Config:

      Check if error_page directives are active:

      nginx -T 2>/dev/null | grep -i "error_page"

      2. Verify Content (Functional Test):

      Trigger an error (e.g., request a non-existent page) and inspect the body:

      curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"

      Evaluation:

      PASS: The output does not contain "nginx" (or grep returns nothing).

      FAIL: The HTML body contains "nginx".'
- id: 2.5.3
  title: Ensure hidden file serving is disabled
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Hidden files and directories (starting with a dot, e.g., .git, .env) often contain sensitive metadata, version
    control history, or environment configurations. Serving these files should be globally disabled.
  rationale: Version control systems (Git, SVN) and editors create hidden files that may unintentionally be deployed to the
    web root. If accessible, files like .git/config or .env can leak database credentials, source code, and infrastructure
    details, leading to full system compromise. Blocking requests to any path starting with a dot (.) neutralizes this risk.
  impact: Blocking all dot-files will break Let's Encrypt / Certbot validation (.well-known/acmechallenge) unless explicitly
    allowed. Ensure the exception rule is placed before the deny rule or is more specific.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#location
  - 2. https://nginx.org/en/docs/http/ngx_http_access_module.html#deny
  page_start: 63
  audit_raw: '1. Check Configuration:

    Search the loaded configuration for hidden file protection rules:

    nginx -T 2>/dev/null | grep "location.*\\\."

    Evaluation:

    Look for a block like location ~ /\. { deny all; ... } .

    2. Functional Test (Recommended):

    Try to access a dummy hidden file:

    curl -k -I https://127.0.0.1/.git/HEAD

    Evaluation:

    PASS: Returns 403 Forbidden  or 404 Not Found .

    FAIL: Returns 200 OK  (if file exists) or the content of the file.'
  remediation: "To restrict access to hidden files, add the configuration block below inside each server\nblock.\nOption A:\
    \ Direct Configuration\nPlace this block directly into your server contexts:\n# Allow Let's Encrypt validation (must be\
    \ before the deny rule)\nlocation ^~ /.well-known/acme-challenge/ {\n    allow all;\n    default_type \"text/plain\";\n\
    }\n# Deny access to all other hidden files\nlocation ~ /\\. {\n    deny all;\n    return 404;\n}\nOption B: Using a Shared\
    \ Snippet (Recommended)\nCreate a reusable snippet file (e.g., /etc/nginx/snippets/deny-hidden.conf)\ncontaining the rules\
    \ above, and include it in your server blocks:\n1. Create /etc/nginx/snippets/deny-hidden.conf with the content from\n\
    Option A.\n2. Security Check: Ensure the new file has restrictive permissions (Owner:\nroot:root, Mode: 640) as described\
    \ in Recommendation 2.3.2.\n3. Add the include directive to your server blocks:\nserver {\n    # Modern HTTP/3 (QUIC)\
    \ and HTTP/2 Setup\n    listen 443 ssl;            # TCP for HTTP/1.1 & HTTP/2\n    listen 443 quic reuseport; # UDP for\
    \ HTTP/3\n    http2 on;                  # Explicitly enable HTTP/2 (since NGINX 1.25.1)\n    server_name example.com;\n\
    \    include /etc/nginx/snippets/deny-hidden.conf;\n    # ... rest of configuration\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep "location.*\\\."
    expected: ''
    severity: medium
    info: '1. Check Configuration:

      Search the loaded configuration for hidden file protection rules:

      nginx -T 2>/dev/null | grep "location.*\\\."

      Evaluation:

      Look for a block like location ~ /\. { deny all; ... } .

      2. Functional Test (Recommended):

      Try to access a dummy hidden file:

      curl -k -I https://127.0.0.1/.git/HEAD

      Evaluation:

      PASS: Returns 403 Forbidden  or 404 Not Found .

      FAIL: Returns 200 OK  (if fi'
- id: 2.5.4
  title: Ensure the NGINX reverse proxy does not enable information disclosure
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'When NGINX acts as a reverse proxy, it forwards headers sent by the upstream application (e.g., "X-Powered-By:
    Custom_APP " or "Server: Apache/2.4 "). These headers should be stripped before the response reaches the client to prevent
    information disclosure about the backend infrastructure. System logging must be configured to meet organizational security
    and privacy policies. Detailed logs provide the necessary context (event source, timestamp, user, network data) for incident
    response and forensic analysis. Modern logging strategies favor structured formats (JSON) over unstructured text to facilitate
    parsing by SIEM solutions. Note: Sensitive information (e.g., session tokens, PII in query strings) should be excluded
    or masked in logs to prevent data leaks. The access_log directive enables the logging of client requests. While NGINX
    enables this by default, it allows granular control per server or location context. Based on enterprise requirements,
    the log should be enriched with relevant variables and converted to structured JSON format for modern SIEM integration.
    Refer to Recommendation 3.1 for detailed configuration of log formats and variables. Ensure that access logging is active
    for all critical services. The error_log directive configures logging for server errors and operational messages. Unlike
    access logs, error logs capture diagnostic information about failed requests, upstream connection issues, and configuration
    errors. The log level determines the verbosity of these messages and should be set to capture sufficient detail (typically
    notice or info) without overwhelming the storage system. When NGINX acts as a reverse proxy or load balancer, it terminates
    the client connection and opens a new connection to the upstream application server. By default, the upstream server sees
    the NGINX server''s internal IP address as the source, obscuring the original client IP. Standard HTTP headers like X-Forwarded-For
    and X-Real-IP must be explicitly configured to pass the original client''s IP address and protocol information to the
    backend application.'
  rationale: 'Attackers conduct reconnaissance by inspecting response headers to identify the technologies used in the backend
    (e.g., specific versions of PHP, Java/Tomcat, or Python frameworks). Knowing the exact version allows attackers to target
    specific CVEs associated with that software stack. Removing these headers reduces the information available for targeted
    attacks. Detailed logs are the foundation of effective incident response. CIS Control 8.5 ("Collect Detailed Audit Logs")
    recommends capturing event sources, dates, users, timestamps, and network addresses. Traditional text logs require complex,
    fragile Regex parsing that breaks easily when formats change. Structured logging (JSON) solves this by providing a self-describing
    format that is natively ingested by modern analysis tools (SIEM), ensuring that critical forensic data is always indexable
    and searchable. Access logs are the primary record of system usage, detailing who accessed what resources and when and
    general troubleshooting. Without active access logs, incident responders are blind to web-based attacks (such as SQL injection,
    XSS probing, or Brute Force attempts) and auditors cannot verify compliance or user activity. Disabling logs globally
    (access_log off; ) effectively destroys the forensic chain of custody for security events. While access logs capture incoming
    request patterns, error logs provide the internal system context required to diagnose why a request failed. They are essential
    for identifying: 1. Upstream Failures: Connection timeouts or refused connections to backend servers (e.g., application
    server is down). 2. Process Anomalies: Unexpected worker process terminations or restarts, which may indicate resource
    exhaustion or exploitation attempts. 3. Configuration Errors: Invalid request handling that NGINX rejects before logging
    to access logs (e.g., header size limits exceeded). Without error logs, an administrator sees a "500 Internal Server Error
    " in the access log but has no way to determine the root cause. Visibility of the true client IP address is essential
    for security auditing, incident response, and access control within the backend application. Without forwarding this information:
    1. Forensics: Application logs will show all traffic coming from the NGINX proxy IP, making it impossible to trace malicious
    activity to a specific attacker. 2. Access Control: Application-level IP allow/deny lists or rate limits will fail or
    mistakenly block the entire proxy. 3. Compliance: Accurate logging of the user origin is often a regulatory requirement.'
  impact: Enabling detailed JSON logging increases the volume of log data. Ensure that your log rotation policies (logrotate)
    and disk space monitoring are adjusted to handle the increased storage requirements. Enabling detailed access logging
    increases disk space usage significantly. Without proper log rotation (e.g., logrotate) and monitoring, log files can
    rapidly consume available disk space, potentially causing the server to stop processing requests or crash. Ensure sufficient
    storage capacity and retention policies are in place. Setting the log level to info (or even debug) can generate a significant
    volume of log data, especially on busy servers or during denial-of-service attacks. This increases disk I/O and storage
    requirements. Ensure that log rotation (e.g., via logrotate) is configured and storage usage is monitored to prevent disk
    exhaustion. Enabling these headers allows the backend application to see the original client IP. However, if NGINX simply
    appends to an existing X-Forwarded-For header sent by a malicious client, the backend might be tricked into trusting a
    spoofed IP at the beginning of the list.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_hide_header
  - 1. https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
  - 2. https://nginx.org/en/docs/varindex.html
  - 1. https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log
  - 2. https://nginx.org/en/docs/http/ngx_http_core_module.html#log_not_found
  - 1. https://nginx.org/en/docs/ngx_core_module.html#error_log
  - 2. https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/XForwarded-For
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header
  page_start: 66
  audit_raw: '1. Configuration Check:

    Search the loaded configuration for header hiding directives:

    nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header"

    Evaluation:

    Verify that directives exist to hide X-Powered-By and Server.

    2. Functional Check (Recommended):

    Send a request to a proxied endpoint and inspect the response headers:

    curl -k -I https://127.0.0.1 | grep -Ei "^(Server|X-Powered-By)"

    Evaluation:

    PASS: The output does not contain backend details (e.g., X-Powered-By:

    PHP/8.2). If Server is present, it should only be Server: nginx  (controlled by

    Control 2.5.1).

    FAIL: The output contains backend information or unmasked version numbers.

    1. Verify Log Format Configuration:

    Inspect the log_format directives in your configuration:

    nginx -T 2>/dev/null | grep -i "log_format"

    Evaluation:

    Confirm that a detailed format (preferably JSON) is defined.

    Verify that the format includes critical fields: $time_iso8601, $remote_addr,

    $remote_user, $request, $status, $http_user_agent.

    2. Verify Access Log Usage:

    Check that the defined format is actually used by the access_log directive:

    nginx -T 2>/dev/null | grep "access_log"

    Evaluation:

    The access_log directive should reference the detailed format name (e.g.,

    access_log /var/log/nginx/access.json main_access_json; ).

    1. Verify Configuration:

    Inspect the fully loaded configuration for log settings:

    nginx -T 2>/dev/null | grep -i "access_log"

    Evaluation:

    Destination Check: Verify that access_log directives point to a valid local file

    path (e.g., /var/log/nginx/access.json) for ingestion by log shippers.

    Status Check: Identify any instances of access_log off; .

    Pass: If access_log off;  is absent, or strictly limited to non-critical assets

    (e.g., location = /favicon.ico , static assets, or internal health checks).

    Fail: If access_log off;  is applied globally in the http block or to server

    blocks handling business logic.

    1. Verify Configuration:

    Check the fully loaded configuration for error log settings:

    nginx -T 2>/dev/null | grep -i "error_log"

    Evaluation:

    Presence: Verify that error_log is defined globally in the main context (or

    http block).

    Destination: Ensure it points to a valid local file (e.g.,

    /var/log/nginx/error.log) accessible for ingestion by log shippers.

    Level: Confirm the level is set according to your internal "Monitoring and

    Logging" policy.

    Fail: If error_log points to /dev/null or the level is set to crit, alert, or

    emerg (which suppresses too many relevant warnings).

    1. Verify Configuration:

    Check the active configuration for proxy header directives in proxied locations:

    nginx -T 2>/dev/null | grep -E "proxy_set_header (X-Real-IP|X-Forwarded-For)"

    Evaluation:

    Presence: Verify that proxy_set_header X-Forwarded-For  and

    proxy_set_header X-Real-IP  are present in location blocks that use

    proxy_pass (or grpc_pass, fastcgi_pass).

    Correctness:

    X-Forwarded-For should typically use

    $proxy_add_x_forwarded_for (to preserve the chain) or

    $remote_addr (if NGINX is the first trusted hop).

    X-Real-IP should use $remote_addr.

    Scope: Check that this is applied to all relevant proxied locations.'
  remediation: "Configure NGINX to strip the sensitive headers. The directive depends on the upstream\nprotocol (HTTP Proxy\
    \ vs. FastCGI).\nFor Standard Reverse Proxy (proxy_pass):\nAdd the following directives to your http, server, or location\
    \ block:\nproxy_hide_header X-Powered-By;\nproxy_hide_header Server;\nFor PHP/FastCGI (fastcgi_pass):\nIf you are using\
    \ FastCGI (e.g., for PHP-FPM), use the fastcgi_hide_header\ndirective instead:\nfastcgi_hide_header X-Powered-By;\nDefine\
    \ a detailed log format in the http block of /etc/nginx/nginx.conf. It is\nhighly recommended to use JSON format for compatibility\
    \ with modern SIEM tools.\nRecommended Configuration (JSON):\nhttp {\n    log_format main_access_json escape=json '{'\n\
    \      '\"timestamp\":         \"$time_iso8601\",'\n      '\"remote_addr\":       \"$remote_addr\",'\n      '\"remote_user\"\
    :       \"$remote_user\",'\n      '\"server_name\":       \"$server_name\",'\n      '\"request_method\":    \"$request_method\"\
    ,'\n      '\"request_uri\":       \"$request_uri\",'\n      '\"status\":            $status,'\n      '\"body_bytes_sent\"\
    :   $body_bytes_sent,'\n      '\"http_referer\":      \"$http_referer\",'\n      '\"http_user_agent\":   \"$http_user_agent\"\
    ,'\n      '\"x_forwarded_for\":   \"$http_x_forwarded_for\",'\n      '\"request_id\":        \"$request_id\"'\n    '}';\n\
    \    # Apply the format globally or per server\n    access_log /var/log/nginx/access.json main_access_json;\n}\nLegacy\
    \ Configuration (Text-based):\nIf JSON is not feasible, ensure the text format captures all necessary fields:\nlog_format\
    \ main_detailed '$remote_addr - $remote_user [$time_local] '\n                         '\"$request\" $status $body_bytes_sent\
    \ '\n                         '\"$http_referer\" \"$http_user_agent\" '\n                         '\"$http_x_forwarded_for\"\
    ';\nEnable access logging in the http block to set a secure global default, or configure it\nexplicitly within specific\
    \ server blocks. It is recommended to use the detailed log\nformat defined in Recommendation 3.1.\nConfiguration Example:\n\
    http {\n    # Enable global logging using the detailed JSON format from Rec 3.1\n    access_log /var/log/nginx/access.json\
    \ main_access_json;\n    server {\n        # Inherits the global log setting, or can be overridden:\n        access_log\
    \ /var/log/nginx/example.com.access.json main_access_json;\n        location / {\n            # ...\n        }\n     \
    \   # Exception: Disable logging for favicon to reduce noise (Optional)\n        location = /favicon.ico {\n         \
    \   access_log    off;\n            log_not_found off;\n        }\n    }\n}\nConfigure the error_log directive in the\
    \ main context (at the top of nginx.conf) to\ncapture operational events.\nConfiguration Example:\n# Log errors to a specific\
    \ file with the 'notice' level\nerror_log /var/log/nginx/error.log notice;\nhttp {\n    # ...\n}\nNote: The specific logging\
    \ level should be aligned with the organization's \"Monitoring\nand Logging\" Policy, balancing the need for forensic\
    \ detail against storage and\nprocessing costs. Typically, info or notice is recommended.\nConfigure NGINX to forward\
    \ client IP information in your server or location blocks\nwhere proxy_pass is used.\nConfiguration Example:\nlocation\
    \ / {\n    # Use 'https' for Zero Trust environments (requires proxy_ssl_verify\nconfiguration)\n    # Use 'http'  for\
    \ standard TLS offloading (upstream traffic is unencrypted)\n    proxy_pass <protocol>://example_backend_application;\n\
    \    # Standard header: Appends the client IP to the list of proxies\n    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n\
    \    # NGINX-specific header: Sets the direct client IP (useful for apps expecting\na single value)\n    proxy_set_header\
    \ X-Real-IP         $remote_addr;\n    # Recommended: Forward the protocol (http vs https)\n    proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header" && curl -k -I https://127.0.0.1 | grep -Ei "^(Server|X-Powered-By)"
      && nginx -T 2>/dev/null | grep -i "log_format" && nginx -T 2>/dev/null | grep "access_log" && nginx -T 2>/dev/null |
      grep -i "access_log" && nginx -T 2>/dev/null | grep -i "error_log" && nginx -T 2>/dev/null | grep -E "proxy_set_header
      (X-Real-IP|X-Forwarded-For)"
    expected: Verify that directives exist to hide X-Powered-By and Server.
    severity: medium
    info: '1. Configuration Check:

      Search the loaded configuration for header hiding directives:

      nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header"

      Evaluation:

      Verify that directives exist to hide X-Powered-By and Server.

      2. Functional Check (Recommended):

      Send a request to a proxied endpoint and inspect the response headers:

      curl -k -I https://127.0.0.1 | grep -Ei "^(Server|X-Powered-By)"

      Evaluat'
- id: 4.1.1
  title: Ensure HTTP is redirected to HTTPS
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Browsers and clients establish encrypted connections with servers by leveraging HTTPS. Requests leveraging
    HTTP are unencrypted. Unencrypted requests should be redirected so they are encrypted. Any listening HTTP port on your
    web server should redirect to a server profile that uses encryption. The default HTTP (unencrypted) port is 80.
  rationale: Redirecting user agent traffic to HTTPS helps to ensure all user traffic is encrypted. Modern browsers alert
    users that your website is insecure when HTTPS is not used. This can decrease user trust in your website and ultimately
    result in decreased use of your web services. Redirection from HTTP to HTTPS couples security with usability; users are
    able to access your website even if they lack the security awareness to use HTTPS over HTTP when requesting your website.
  impact: Use of HTTPS does result in a performance reduction in traffic to your website, however, due to the increased value
    of the security, many businesses consider this to be a cost of doing business.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html
  - 2. NIST SP 800-53:rev5:SC-8
  page_start: 83
  audit_raw: "To verify your server listening configuration, check your web server or proxy\nconfiguration file. The default\
    \ web server configuration file is\n/etc/nginx/conf.d/default.conf, and the default proxy configuration file is\n/etc/nginx/nginx.conf.\
    \ The configuration file should return a statement redirecting\nto HTTPS. This should be similar to the code below, where\
    \ cisecurity.org is used as an\nexample.\nserver {\n    listen 80;\n    server_name cisecurity.org;\n    return 301 https://$host$request_uri;\n\
    }"
  remediation: "Edit your web server or proxy configuration file to redirect all unencrypted listening\nports, such as port\
    \ 80, using a redirection through the return directive (cisecurity.org is\nused as an example server name).\nserver {\n\
    \    listen 80;\n    server_name cisecurity.org;\n    return 301 https://$host$request_uri;\n}"
  checks:
  - type: manual_review
    info: "To verify your server listening configuration, check your web server or proxy\nconfiguration file. The default\
      \ web server configuration file is\n/etc/nginx/conf.d/default.conf, and the default proxy configuration file is\n/etc/nginx/nginx.conf.\
      \ The configuration file should return a statement redirecting\nto HTTPS. This should be similar to the code below,\
      \ where cisecurity.org is used as an\nexample.\nserver {\n    listen 80;\n    server_name cisecurity.org;\n    return\
      \ 301 https://$host$request_uri;\n}"
    severity: medium
- id: 4.1.2
  title: Ensure a trusted certificate and trust chain is installed
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Certificates and their trust chains are needed to establish the identity of a web server as legitimate and
    trusted. Certificate authorities validate a web server's identity and that you are the owner of that web server domain
    name.
  rationale: Without a certificate and full trust chain installed on your web server, modern browsers will flag your web server
    as untrusted.
  impact: ''
  references:
  - 1. https://nginx.org/en/docs/http/configuring_https_servers.html#chains
  - 2. https://support.globalsign.com/customer/portal/articles/1290470-install-certificate-
  page_start: 85
  audit_raw: 'Run this command to find the file location of your certificate:

    grep -ir ssl_certificate /etc/nginx/

    The output of your command should look similar to the below output. If there is no

    output, you do not have a certificate installed.

    Web Server:

    /etc/nginx/nginx.conf:    ssl_certificate /etc/nginx/cert.pem;

    /etc/nginx/nginx.conf:    ssl_certificate_key /etc/nginx/nginx.key;

    Open the file to the right of the ssl_certificate directive using the following

    command:

    cat /etc/nginx/cert.pem

    The output of your command should look similar to the below. It should include the full

    certificate chain.

    -----BEGIN CERTIFICATE-----

    Insert Your Web Server Certificate

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Insert Your Certificate Authority Intermediate Certificate

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Insert Your Certificate Authority Root Certificate

    -----END CERTIFICATE-----'
  remediation: "Use the following procedure to install a certificate and its signing certificate chain onto\nyour web server,\
    \ load balancer, or proxy.\nStep 1: Create the server's private key and a certificate signing request.\nThe following\
    \ command will create your certificate's private key with 4096-bit key\nstrength. It will also output your certificate\
    \ signing request to the nginx.csr file in your\npresent working directory.\nopenssl req -new -newkey rsa:4096 -keyout\
    \ nginx.key -out nginx.csr\nEnter the below information about your private key:\nCountry Name (2 letter code) [XX]: Your\
    \ Country\nState or Province Name (full name) []: Your State\nLocality Name (eg, city) [Default City]: Your City\nOrganization\
    \ Name (eg, company) [Default Company Ltd]: Your City\nOrganizational Unit Name (eg, section) []: Your Organizational\
    \ Unit\nCommon Name (eg, your name or your server's hostname) []: Your server's DNS name\nEmail Address []: Your email\
    \ address\nStep 2: Obtain a signed certificate from your certificate authority.\nProvide your chosen certificate authority\
    \ with your certificate signing request. Follow\nyour certificate authority's signing procedures in order to obtain a\
    \ certificate and the\ncertificate's trust chain. A full trust chain is typically delivered in .pem format.\nStep 3: Install\
    \ certificate and signing certificate chain on your web server.\nPlace the .pem file from your certificate authority into\
    \ the directory of your choice.\nLocate your created key file from the command you used to generate your certificate\n\
    signing request. Open your website configuration file and edit your encrypted listener to\nleverage the ssl_certificate\
    \ and ssl_certificate_key directives for a web server as\nshown below. You should also inspect include files inside your\
    \ nginx.conf. This\nshould be part of the server block.\nserver {\n    listen              443 ssl http2;\n    listen\
    \              [::]:443 ssl http2;\n    ssl_certificate     /etc/nginx/cert.crt;\n    ssl_certificate_key /etc/nginx/nginx.key;\n\
    \    ...\n    }\nAfter editing this file, you must restart the nginx systemd service for these changes to\ntake effect.\
    \ This can be done with the following command:\nsudo systemctl restart nginx"
  checks:
  - type: command
    command: grep -ir ssl_certificate /etc/nginx/ && cat /etc/nginx/cert.pem
    expected: ''
    severity: medium
    info: 'Run this command to find the file location of your certificate:

      grep -ir ssl_certificate /etc/nginx/

      The output of your command should look similar to the below output. If there is no

      output, you do not have a certificate installed.

      Web Server:

      /etc/nginx/nginx.conf:    ssl_certificate /etc/nginx/cert.pem;

      /etc/nginx/nginx.conf:    ssl_certificate_key /etc/nginx/nginx.key;

      Open the file to the rig'
- id: 4.1.3
  title: Ensure private key permissions are restricted
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The server's and potentially its vhost's private keys should be protected from unauthorized access by limiting
    access based on the principle of least privilege.
  rationale: A server's private key file should be restricted to 400 permissions. This ensures only the owner of the private
    key file can access it. This is the minimum necessary permissions for the server to operate. If the private key file is
    not protected, an unauthorized user with access to the server may be able to find the private key file and use it to decrypt
    traffic sent to your server.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:IA-5 (2)
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 88
  audit_raw: 'Verify the permissions on the key file are 400. This can be found by running the

    following command. You should replace /etc/nginx/ with the directory containing

    your key files.

    find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

    The output should show mode 400.

    Example:

    /etc/nginx/nginx.key 400'
  remediation: 'Run the following command to remove excessive permissions on key files in the

    /etc/nginx/ directory .

    Note: You should replace /etc/nginx/ with the directory containing your key files.

    find /etc/nginx/ -name ''*.key'' -exec chmod u-wx,go-rwx {} +'
  checks:
  - type: command
    command: find /etc/nginx/ -name '*.key' -exec stat -Lc "%n %a" {} +
    expected: ''
    severity: medium
    info: 'Verify the permissions on the key file are 400. This can be found by running the

      following command. You should replace /etc/nginx/ with the directory containing

      your key files.

      find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

      The output should show mode 400.

      Example:

      /etc/nginx/nginx.key 400'
- id: 4.1.4
  title: Ensure only modern TLS protocols are used
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Only modern TLS protocols should be enabled in NGINX for all client connections and upstream connections. Removing
    legacy TLS and SSL protocols (SSL 3.0, TLS 1.0, 1.1 and 1.2), and enabling stable TLS protocols (TLS 1.3), ensures users
    are able to take advantage of strong security capabilities and protects them from insecure legacy protocols.
  rationale: 'Why disable SSL 3.0: The POODLE Vulnerability allowed attackers to exploit SSL 3.0 to obtain cleartext information
    by exploiting weaknesses in CBC in 2014. SSL 3.0 is also no longer FIPS 140-2 compliant. Why disable TLS 1.0: TLS 1.0
    was deprecated from use when PCI DSS Compliance mandated that it not be used for any applications processing credit card
    numbers in June 2018. TLS 1.0 does not make use of modern protections, and almost all user agents that do not support
    TLS 1.2 or higher are no longer supported by their vendor. Why disable TLS 1.1: Because of the increased security associated
    with higher versions of TLS, TLS 1.1 should be disabled. Modern browsers will begin to flag TLS 1.1 as deprecated in early
    2019. Why disable TLS 1.2: While robust for its time, TLS 1.2''s complexity allows for weak configurations, including
    cipher suites that lack Perfect Forward Secrecy. TLS 1.3 eliminates this risk by mandating PFS and removing outdated cryptographic
    primitives. Acknowledging this, NIST SP 800-52 Rev. 2 allows for TLS 1.2 to be disabled if it is not required for interoperability,
    positioning TLS 1.3 as the sole recommended protocol for modern, secure environments. Why enable TLS 1.3: TLS 1.3 improves
    security by removing several insecure cipher suites by default and adding several more secure algorithms. All public-key
    exchange mechanisms support perfect forward secrecy in this version of TLS. Additionally, TLS 1.3 makes drastic performance
    improvements by removing a full round trip in the TLS handshake.'
  impact: Disabling certain TLS may not allow legacy user agents to connect to your server. Disabling negotiation of specific
    protocols with your backend server may also limit your ability to connect with legacy servers. You should always consider
    if you need to support legacy user agents or servers when selecting your TLS protocols.
  references:
  - 1. https://webkit.org/blog/8462/deprecation-of-legacy-tls-1-0-and-1-1-versions/
  - 2. https://www.cloudflare.com/learning/ssl/why-use-tls-1.3/
  page_start: 90
  audit_raw: 'You can verify which SSL/TLS protocols your server uses by issuing the below

    command to inspect the configured SSL/TLS protocol directives. If anything older than

    TLS 1.3 is implemented or nothing appears, this recommendation is not implemented.

    grep -ir ssl_protocol /etc/nginx

    Note: Depending on your configuration, you may see different results. The directive

    ssl_protocols should always be part of your server block. If your NGINX server is

    also a proxy or load balancer, you should also check for the presence of the

    proxy_ssl_protocols directive as part of the location block of your nginx

    configuration. This ensures your proxy follows a specific set of negotiation rules for

    encrypting traffic with your upstream server.'
  remediation: "Run the following commands to change your ssl_protocols if they are already\nconfigured. This remediation\
    \ advice assumes your nginx configuration file does not\ninclude server configuration outside of /etc/nginx/nginx.conf.\
    \ You may have to\nalso inspect the include files in your nginx.conf to ensure this is properly\nimplemented.\nWeb Server:\n\
    sed -i \"s/ssl_protocols[^;]*;/ssl_protocols TLSv1.3;/\" /etc/nginx/nginx.conf\nProxy:\nsed -i \"s/proxy_ssl_protocols[^;]*;/proxy_ssl_protocols\
    \ TLSv1.3;/\"\n/etc/nginx/nginx.conf\nIf your ssl_protocols are not already configured, this can be accomplished manually\n\
    by opening your web server or proxy server configuration file and manually adding the\ndirectives.\nWeb Server:\nserver\
    \ {\n    ssl_protocols TLSv1.3;\n}\nProxy:\nlocation / {\n      proxy_pass          cisecurity.org;\n      proxy_ssl_protocols\
    \ TLSv1.3;\n    }"
  checks:
  - type: command
    command: grep -ir ssl_protocol /etc/nginx
    expected: ''
    severity: medium
    info: 'You can verify which SSL/TLS protocols your server uses by issuing the below

      command to inspect the configured SSL/TLS protocol directives. If anything older than

      TLS 1.3 is implemented or nothing appears, this recommendation is not implemented.

      grep -ir ssl_protocol /etc/nginx

      Note: Depending on your configuration, you may see different results. The directive

      ssl_protocols should always be part o'
- id: 4.1.5
  title: Disable weak ciphers
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The ssl_protocols directive must be used to disable weak protocols and exclusively enable TLS 1.3. In a TLS
    1.3-only configuration, the ssl_ciphers directive is no longer necessary, as the protocol itself mandates a small, non-negotiable
    set of highly secure AEAD ciphers (Authenticated Encryption with Associated Data). This approach simplifies configuration
    and eliminates the risk of choosing weak or insecure cipher suites. The ssl_prefer_server_ciphers directive should be
    set to off for TLS 1.3. Since all available ciphers are secure, allowing the client (user agent) to choose the most performant
    cipher for its hardware provides a performance benefit without compromising security. In a reverse proxy setup, it is
    critical to ensure that any upstream services also support TLS 1.3. If an upstream server requires an older protocol,
    the proxy_ssl_protocols and proxy_ssl_ciphers directives must be configured to match the upstream's requirements, but
    this should be treated as a temporary exception to be remediated.
  rationale: Weak cryptographic ciphers can lead to the compromise of sensitive data. In modern TLS configurations, the most
    effective way to disable all weak ciphers is to exclusively enable the TLS 1.3 protocol. The TLS 1.3 specification removes
    all previously known weak and legacy cipher suites, mandating the use of a small set of highly secure Authenticated Encryption
    (AEAD) ciphers. This approach is simpler and less error-prone than maintaining a complex denylist or allowlist of ciphers
    for older protocols.
  impact: 'Impact of Mandating TLS 1.3: Enforcing an exclusive TLS 1.3 configuration enhances security but will intentionally
    cause connection failures for legacy clients. This primarily affects: Unsupported User Agents: Clients on outdated operating
    systems (e.g., Android < 10, iOS < 12.2, Windows < 10 without updates) and very old browsers (e.g., Internet Explorer)
    that do not support TLS 1.3 will be unable to connect. These clients are typically outside their vendor''s security lifecycle
    and pose an independent risk. Legacy Upstream Services: In a reverse proxy scenario, if NGINX is configured for TLS 1.3
    exclusively, it will be unable to establish a connection to an upstream (backend) server that only supports TLS 1.2 or
    older. This will cause service disruptions. A thorough assessment of backend compatibility is required before enforcement.'
  references:
  - 1. https://mozilla.github.io/server-side-tls/ssl-config-generator/
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html
  page_start: 93
  audit_raw: "Use the following procedure to verify that only ssl_protocols TLSv1.3;  is used.\nnginx -T 2>/dev/null | grep\
    \ -E '^\\s*ssl_protocols'\nThe output must show ssl_protocols TLSv1.3;  exclusively for every relevant\nconfiguration\
    \ block (e.g., at the http or server level).\nExample output:\nnginx: the configuration file /etc/nginx/nginx.conf syntax\
    \ is ok\nnginx: configuration file /etc/nginx/nginx.conf test is successful\n# configuration file /etc/nginx/nginx.conf:\n\
    \        ssl_protocols TLSv1.3;\n# configuration file /etc/nginx/conf.d/default.conf:\n        ssl_protocols TLSv1.3;"
  remediation: 'Set ssl_protocols TLSv1.3; . The ssl_ciphers directive is not required for a

    TLS 1.3-only configuration, as the secure defaults of the underlying crypto library (e.g.,

    OpenSSL) will be used.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*ssl_protocols'
    expected: Use the following procedure to verify that only ssl_protocols TLSv1.3;  is used.
    severity: medium
    info: 'Use the following procedure to verify that only ssl_protocols TLSv1.3;  is used.

      nginx -T 2>/dev/null | grep -E ''^\s*ssl_protocols''

      The output must show ssl_protocols TLSv1.3;  exclusively for every relevant

      configuration block (e.g., at the http or server level).

      Example output:

      nginx: the configuration file /etc/nginx/nginx.conf syntax is ok

      nginx: configuration file /etc/nginx/nginx.conf test i'
- id: 4.1.6
  title: Ensure awareness of TLS 1.3 new Diffie-Hellman parameters
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: This control is not applicable to environments exclusively using TLS 1.3.
  rationale: The TLS 1.3 protocol (RFC 8446) deprecates the use of custom finite-field DiffieHellman (DHE) groups, which were
    configured via the ssl_dhparam directive in NGINX. Instead, TLS 1.3 exclusively uses a set of pre-defined, standardized,
    and secure elliptic curve (ECDHE) and finite-field (FFDHE) groups for its key exchange mechanism. This design eliminates
    the risk associated with weak or misconfigured custom DH parameters. As such, the ssl_dhparam directive has no effect
    in a TLS 1.3-only configuration.
  impact: None for a TLS 1.3-only configuration.
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc8446#page-95
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_dhparam
  page_start: 96
  audit_raw: 'Verify that the configuration does not rely on TLS 1.2 or older protocols that would

    require this setting. This control is implicitly passed if control 4.1.4 ("Ensure only modern

    TLS protocols are used") is configured for TLS 1.3 exclusively.'
  remediation: 'No remediation is necessary. Ensure ssl_protocols TLSv1.3;  is set. The

    ssl_dhparam directive should be removed as it is obsolete.'
  checks:
  - type: manual_review
    info: 'Verify that the configuration does not rely on TLS 1.2 or older protocols that would

      require this setting. This control is implicitly passed if control 4.1.4 ("Ensure only modern

      TLS protocols are used") is configured for TLS 1.3 exclusively.'
    severity: medium
- id: 4.1.7
  title: Ensure Online Certificate Status Protocol (OCSP) stapling is enabled
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: OCSP stapling allows a server to efficiently deliver certificate revocation information to the client, improving
    performance and privacy. The server caches the OCSP response from the Certificate Authority (CA), eliminating the need
    for the client to make a separate connection. For robust security, certificates should be issued with the OCSP Must-Staple
    extension, which transforms the traditional "soft-fail" behavior into a "hardfail," ensuring clients always receive and
    validate a current revocation status.
  rationale: OCSP stapling is a critical mechanism for distributing certificate revocation status. Without it, clients might
    not be aware that a server's certificate has been compromised, allowing for potential man-in-the-middle attacks. The OCSP
    Must-Staple extension is essential as it mitigates the inherent weakness of optional OCSP ("soft-fail"), where a browser
    might proceed with a connection if it doesn't receive a staple. By enforcing a "hard-fail", Must-Staple ensures that a
    compromised certificate can be reliably blocked.
  impact: If OCSP Must-Staple is used, a misconfiguration on the server (e.g., a firewall blocking outbound OCSP queries,
    an incorrect DNS resolver) will cause clients to reject the certificate and refuse to connect, leading to a service outage.
    This "hard-fail" behavior is intentional for security but requires diligent configuration and monitoring of the OCSP stapling
    mechanism.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_stapling
  - 2. https://datatracker.ietf.org/doc/html/rfc6066
  page_start: 98
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration for the four

    required directives:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (ssl_stapling|ssl_stapling_verify|ssl_trusted_certificate|resolver)''

    Verify that the output contains the following directives with appropriate values within the

    relevant http or server blocks:

    ssl_stapling on;

    ssl_stapling_verify on;

    ssl_trusted_certificate /path/to/your/chain.pem;

    resolver A.B.C.D;

    If any of these four directives are missing, this recommendation is not fully

    implemented.'
  remediation: "Follow this procedure to enable a robust OCSP stapling configuration:\n1. When issuing a certificate, request\
    \ that the OCSP Must-Staple extension be\nincluded.\n2. Edit your NGINX configuration to include all four necessary directives.\
