benchmark:
  id: cis-nginx-benchmark
  title: CIS NGINX Benchmark
  version: 3.1.0
  technology: NGINX
  category: Server Software
  os: NGINX
  source_pdf: CIS_NGINX_Benchmark_v3.1.0.pdf
  total_pages: 170
  controls_count: 40
controls:
- id: 1.1.1
  title: Ensure NGINX is installed
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: An NGINX installation must be present on the system. To ensure support for modern security standards (such
    as TLS 1.3 and HTTP/3) and to mitigate known vulnerabilities, the installed version must be 1.28.0 or later and compiled
    with the necessary modules.
  rationale: NGINX must be installed and operational to serve as the target for this benchmark's security controls. Enforcing
    a minimum version and feature set ensures the platform is capable of supporting the required security configurations.
  impact: Upgrading NGINX to a newer version may introduce configuration syntax changes or deprecated directives. Administrators
    should test the configuration syntax nginx -t before restarting the service.
  references:
  - 1. https://nginx.org/en/docs/install.html
  - 2. https://nginx.org/en/linux_packages.html
  page_start: 17
  audit_raw: '1. Verify Installation and Version: Run the following command to display the installed

    NGINX version:

    # Note: It''s an uppercase V

    nginx -V

    2. Evaluation:

    Verify Output: The command must return an installed version (e.g., nginx

    version: nginx/1.28.0 ). If the command is not found, NGINX is not

    installed.

    Check Version: Ensure the version number is 1.28.0 or higher.'
  remediation: 'Install or upgrade NGINX to version 1.28.0 or later.

    Note: Official packages from nginx.org (see recommendation 1.2.1) typically include

    these modules by default. Custom builds must explicitly enable them.'
  checks:
  - type: manual_review
    info: '1. Verify Installation and Version: Run the following command to display the installed

      NGINX version:

      # Note: It''s an uppercase V

      nginx -V

      2. Evaluation:

      Verify Output: The command must return an installed version (e.g., nginx

      version: nginx/1.28.0 ). If the command is not found, NGINX is not

      installed.

      Check Version: Ensure the version number is 1.28.0 or higher.'
    severity: medium
- id: 1.2.1
  title: Ensure package manager repositories are properly configured
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Package repositories must be trustworthy, properly configured, and maintained to ensure the system receives
    timely security patches, bug fixes, and support for modern protocols. While Operating System (OS) vendors provide NGINX
    packages, these versions are often frozen at older release points ("stable" but stale). Access to critical modern features
    like HTTP/3 (QUIC) and the latest TLS updates typically requires using the official repositories maintained by NGINX/F5.
  rationale: If a system's package manager repositories are misconfigured or outdated, critical security patches may not be
    applied in a timely manner. Furthermore, relying solely on default OS repositories often restricts the web server to legacy
    versions that lack support for modern security standards (e.g., HTTP/3). Using the official nginx.org repositories ensures
    access to the latest stable and mainline versions directly from the source, reducing the risk of running obsolete software.
    Conversely, adding untrusted third-party repositories can introduce compromised software or dependency conflicts.
  impact: Switching from OS-provided packages to upstream (nginx.org) packages alters the update lifecycle. Administrators
    become responsible for tracking upstream changes rather than relying on the OS vendor's backporting policy. However, this
    is often necessary to meet modern security and performance requirements.
  references:
  - 1. https://nginx.org/en/linux_packages.html
  - 2. NIST SP 800-53:rev5:SI-2 c
  page_start: 20
  audit_raw: 'To verify that package manager repositories are configured correctly and point to a

    trusted source (either the OS vendor or official NGINX), run the following commands:

    Red Hat / Rocky-Linux:

    dnf repolist -v | grep -i nginx

    Debian / Ubuntu:

    apt-cache policy nginx

    Evaluation:

    Verify that the repository URL points to a trusted domain (e.g., nginx.org, rhel...,

    ubuntu...).

    Ensure that the repository is enabled.

    Check that no unknown or untrusted third-party repositories are configured for

    NGINX.'
  remediation: 'Configure your package manager to use a trusted repository that meets your version

    requirements.

    To enable the official NGINX repository (Recommended for HTTP/3 support): Follow the

    instructions at nginx.org/en/linux_packages.html for your specific distribution. This

    typically involves adding the NGINX signing key and creating a repository configuration

    file.'
  checks:
  - type: command
    command: dnf repolist -v | grep -i nginx
    expected: To verify that package manager repositories are configured correctly and point to a
    severity: medium
    info: 'To verify that package manager repositories are configured correctly and point to a

      trusted source (either the OS vendor or official NGINX), run the following commands:

      Red Hat / Rocky-Linux:

      dnf repolist -v | grep -i nginx

      Debian / Ubuntu:

      apt-cache policy nginx

      Evaluation:

      Verify that the repository URL points to a trusted domain (e.g., nginx.org, rhel...,

      ubuntu...).

      Ensure that the repository '
- id: 1.2.2
  title: Ensure the latest software package is installed
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: As new security vulnerabilities are discovered, the corresponding fixes are implemented by your NGINX software
    package provider. Installing the latest software version ensures these fixes are available on your system.
  rationale: Up-to-date software provides the best possible protection against exploitation of security vulnerabilities, such
    as the execution of malicious code.
  impact: Updating the NGINX package requires a service reload or restart to apply the changes. This may cause a brief interruption
    or configuration errors if the new version deprecates existing syntax.
  references:
  - 1. https://nginx.org/en/linux_packages.html
  - 2. NIST SP 800-53:rev5:SI-2 c
  page_start: 23
  audit_raw: 'To verify your NGINX package is up to date, run the following command (example):

    Redhat:

    dnf info nginx'
  remediation: 'To install the latest NGINX package, run the following command (example):

    Redhat:

    dnf update nginx -y'
  checks:
  - type: manual_review
    info: 'To verify your NGINX package is up to date, run the following command (example):

      Redhat:

      dnf info nginx'
    severity: medium
- id: 2.1.1
  title: Ensure only required dynamic modules are loaded
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'NGINX functionality is provided by modules. These modules are either compiled statically into the NGINX binary
    or loaded dynamically at runtime via the load_module directive. Static Modules: These are fixed at compile time. When
    using official pre-built packages (e.g., from nginx.org or OS vendors), a standard set of modules is included and cannot
    be removed without recompiling NGINX. Dynamic Modules: These are separate .so files that can be loaded on demand. To reduce
    the attack surface and complexity, only strictly required dynamic modules should be loaded. Additionally, administrators
    should be aware of the active static modules to avoid configuring unused features unintentionally.'
  rationale: Minimizing the loaded code reduces the potential attack surface. While static modules in pre-built packages cannot
    be removed, ensuring that no unnecessary dynamic modules are loaded prevents the execution of unneeded code. Furthermore,
    understanding which static modules are present helps administrators avoid enabling risky features (like autoindex or stub_status)
    in the configuration if they are not needed.
  impact: Removing a required dynamic module or misinterpreting the availability of a static module can cause the NGINX service
    to fail on restart or break specific application features.
  references:
  - 1. https://nginx.org/en/docs/
  - 2. NIST SP 800-53:rev5:CM-7 a
  page_start: 26
  audit_raw: '1. Audit Dynamic Modules (Actionable):

    Run the following command to check for actively loaded dynamic modules:

    nginx -T 2>/dev/null | grep "load_module"

    Evaluation:

    If the output is empty, no dynamic modules are loaded (PASS).

    If output exists (e.g., load_module

    modules/ngx_http_geoip_module.so;), verify that each listed module is

    required for the application''s business logic.

    2. Audit Static Modules (Informational):

    Run the following command to list all modules compiled into the binary:

    nginx -V 2>&1 | grep -oEi ''\-\-(with|without)-[^ ]*''

    Evaluation:

    Review the --with-... flags to understand the server''s capabilities. Ensure that risky

    modules present in the build (e.g., http_stub_status_module) are not enabled in

    any server or location block unless authorized.'
  remediation: 'For Dynamic Modules:

    Open the main configuration file (/etc/nginx/nginx.conf) or the relevant include

    file (e.g., in /etc/nginx/modules-enabled/). Comment out or remove the

    load_module directive for any module that is not strictly necessary.

    For Static Modules:

    Since static modules cannot be removed from pre-built packages, ensure their

    directives are not used in your configuration. If a specific static module poses a critical

    risk to your environment, you must switch to a custom build or a different package flavor

    that excludes it.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep "load_module" && nginx -V 2>&1 | grep -oEi '\-\-(with|without)-[^ ]*'
    expected: modules/ngx_http_geoip_module.so;), verify that each listed module is
    severity: medium
    info: '1. Audit Dynamic Modules (Actionable):

      Run the following command to check for actively loaded dynamic modules:

      nginx -T 2>/dev/null | grep "load_module"

      Evaluation:

      If the output is empty, no dynamic modules are loaded (PASS).

      If output exists (e.g., load_module

      modules/ngx_http_geoip_module.so;), verify that each listed module is

      required for the application''s business logic.

      2. Audit Static Modu'
- id: 2.2.1
  title: Ensure that NGINX is run using a non-privileged, dedicated service account
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The NGINX master process typically runs as root to bind to privileged ports and manage resources, but it spawns
    worker processes to handle the actual client traffic. The user directive in the main configuration designates the operating
    system account under which these worker processes run. Running worker processes under a non-privileged, dedicated service
    account limits the damage an attacker can cause in the event the NGINX process is compromised. This account should be
    exclusively dedicated to NGINX, have no login capabilities, and possess no elevated system privileges.
  rationale: If an attacker successfully exploits a vulnerability in a worker process (e.g., via a buffer overflow or Remote
    Code Execution), they inherit the permissions of the user account running that process. Using a privileged account like
    root significantly increases the risk of lateral movement. A dedicated, locked-down service account ensures that an attacker
    cannot access other services, modify sensitive system files, or easily escalate privileges, effectively reducing the impact
    of the compromise.
  impact: Changing the NGINX user requires that ownership and permissions for all runtime directories (logs, caches, PID files)
    are updated to match the new account. Incorrect permissions will prevent NGINX from starting or writing necessary logs.
    Additionally, the dedicated user must remain strictly unprivileged; adding it to groups like sudo or wheel would negate
    the security benefit.
  references:
  - 1. https://nginx.org/en/docs/ngx_core_module.html#user
  - 2. NIST SP 800-53:rev5:AC-6
  page_start: 30
  audit_raw: '1. Identify Configured User:

    Inspect the running configuration to find the user directive:

    nginx -T 2>/dev/null | grep -i "^user"

    Evaluation: Verify that a specific user is defined (e.g., user nginx;  or user wwwdata;). If missing, NGINX might run
    as nobody or the user used at compile time.

    2. Verify User Privileges:

    Check the UID and group membership of the identified user (e.g., nginx):

    id nginx

    Evaluation:

    Ensure uid is not 0 (root).

    Ensure the user is not a member of privileged groups (like root, wheel, sudo).

    3. Check Sudo Access:

    Ensure the user cannot execute commands via sudo:

    sudo -l -U nginx

    Evaluation: Output should indicate "User nginx is not allowed to run

    sudo".'
  remediation: '1. Create/Harden User (if missing):

    If no user exists, create a system user with a no login shell:

    useradd -r -d /var/cache/nginx -s /sbin/nologin nginx

    2. Configure NGINX:

    Set the user directive in the main context of nginx.conf:

    user nginx;

    3. Lock User Account:

    Ensure the account cannot be used for login:

    usermod -s /sbin/nologin nginx

    usermod -L nginx'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: 'Evaluation: Verify that a specific user is defined (e.g., user nginx;  or user wwwdata;). If missing, NGINX
      might run as nobody or the user used at compile time.'
    severity: medium
    info: '1. Identify Configured User:

      Inspect the running configuration to find the user directive:

      nginx -T 2>/dev/null | grep -i "^user"

      Evaluation: Verify that a specific user is defined (e.g., user nginx;  or user wwwdata;). If missing, NGINX might run
      as nobody or the user used at compile time.

      2. Verify User Privileges:

      Check the UID and group membership of the identified user (e.g., nginx):

      id nginx'
- id: 2.2.2
  title: Ensure the NGINX service account is locked
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The NGINX service account must not have a usable password and should be explicitly locked in the system's shadow
    file to prevent direct login or password-based privilege escalation.
  rationale: As a defense-in-depth measure, the NGINX service account should be explicitly locked. This prevents password-based
    logins and blocks adversaries from using the account for lateral movement, even if they manage to change the account's
    shell configuration. In a properly hardened environment, there is no operational need for any user to log in as nginx.
    Administrative tasks requiring the NGINX identity should be performed using sudo (e.g., sudo -u nginx ), which utilizes
    the administrator's credentials rather than the service account's password.
  impact: Locking the service account has minimal operational impact. The account is not intended for human interaction, and
    all administrative tasks requiring the NGINX user context should already be performed using sudo -u nginx  rather than
    passwordbased authentication.
  references:
  - 1. NIST SP 800-53:rev5:AC-2 f
  - '2. NIST CSF 2.0: PR.AA-01'
  page_start: 33
  audit_raw: '1. Identify the User:

    nginx -T 2>/dev/null | grep -i "^user"

    (Note the user, e.g., nginx)

    2. Check Lock Status:

    Run the following command for the identified user:

    passwd -S nginx

    Evaluation:

    Verify that the output indicates a locked status:

    RHEL: Shows LK or Password locked .

    Debian/Ubuntu: Shows L.'
  remediation: 'Lock the account using the passwd command:

    passwd -l nginx

    (Replace nginx with the actual service user found in step 1)'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: 'Verify that the output indicates a locked status:'
    severity: medium
    info: '1. Identify the User:

      nginx -T 2>/dev/null | grep -i "^user"

      (Note the user, e.g., nginx)

      2. Check Lock Status:

      Run the following command for the identified user:

      passwd -S nginx

      Evaluation:

      Verify that the output indicates a locked status:

      RHEL: Shows LK or Password locked .

      Debian/Ubuntu: Shows L.'
- id: 2.2.3
  title: Ensure the NGINX service account has an invalid shell
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The NGINX service account must be configured with an invalid login shell to prevent interactive access.
  rationale: The NGINX service account is strictly for running daemon processes. Assigning it a valid login shell (like /bin/bash)
    unnecessarily expands the attack surface. If an attacker compromises the account credentials (or adds an SSH key), a valid
    shell facilitates interactive system access. Setting the shell to /sbin/nologin or /bin/false ensures that even with valid
    credentials, the system immediately rejects a login attempt.
  impact: None. Service accounts do not require interactive login capabilities for normal operation.
  references:
  - 1. NIST SP 800-53:rev5:CM-7 b
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 35
  audit_raw: '1. Identify the User:

    nginx -T 2>/dev/null | grep -i "^user"

    (Note the user, e.g., nginx)

    2. Verify Shell:

    Run the following command to inspect the configured shell for the identified user:

    getent passwd nginx

    (Replace nginx with the actual user found in step 1)

    Evaluation:

    Examine the last field of the output (the shell).

    PASS: The shell is set to /sbin/nologin, /bin/nologin, or /bin/false.

    FAIL: The shell is set to /bin/bash, /bin/sh, or any other interactive shell

    listed in /etc/shells.

    Example Output (PASS):

    nginx:x:999:988:nginx user:/nonexistent:/usr/sbin/nologin'
  remediation: 'Change the login shell for the identified user to /sbin/nologin:

    usermod -s /sbin/nologin nginx

    (Replace nginx with the actual user)'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: ''
    severity: medium
    info: '1. Identify the User:

      nginx -T 2>/dev/null | grep -i "^user"

      (Note the user, e.g., nginx)

      2. Verify Shell:

      Run the following command to inspect the configured shell for the identified user:

      getent passwd nginx

      (Replace nginx with the actual user found in step 1)

      Evaluation:

      Examine the last field of the output (the shell).

      PASS: The shell is set to /sbin/nologin, /bin/nologin, or /bin/false.

      FAIL:'
- id: 2.3.1
  title: Ensure NGINX directories and files are owned by root
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The NGINX configuration directory and all contained files must be owned by the root user and group to prevent
    unauthorized modification.
  rationale: The NGINX configuration controls the security posture of the web server. If a nonprivileged user (including the
    nginx worker user) can modify these files, they can trivially escalate privileges (e.g., by loading a malicious module
    or changing the user directive to root). Ensuring that only root owns these files guarantees that configuration changes
    require administrative privileges.
  impact: None. The NGINX master process runs as root and can read these files. The worker processes (running as nginx) do
    not need write access to the configuration.
  references:
  - 1. NIST SP 800-53:rev5:CM-5
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 39
  audit_raw: '1. Identify Configuration Directory:

    Run nginx -V  and look for --conf-path to find the main configuration file location

    (e.g., /etc/nginx/nginx.conf). The directory containing this file is the target.

    2. Verify Ownership:

    Run the following command to audit the ownership of the configuration directory and its

    contents:

    find /etc/nginx -name "*" \( -not -user root -o -not -group root \) -exec ls -ld

    {} \;

    (Replace /etc/nginx with the actual configuration path in case it is different)

    Evaluation:

    PASS: The command produces no output. All files are owned by root:root.

    FAIL: The command lists files owned by other users (e.g., nginx or a developer

    account).'
  remediation: 'Set the ownership of the NGINX configuration directory and files to root:

    chown -R root:root /etc/nginx

    (Replace /etc/nginx with the actual configuration path in case it is different)

    Note: Ensure that this does not break access to specific files if you have a custom

    setup where external processes need write access.'
  checks:
  - type: command
    command: find /etc/nginx -name "*" \( -not -user root -o -not -group root \) -exec ls -ld
    expected: ''
    severity: medium
    info: '1. Identify Configuration Directory:

      Run nginx -V  and look for --conf-path to find the main configuration file location

      (e.g., /etc/nginx/nginx.conf). The directory containing this file is the target.

      2. Verify Ownership:

      Run the following command to audit the ownership of the configuration directory and its

      contents:

      find /etc/nginx -name "*" \( -not -user root -o -not -group root \) -exec ls -l'
- id: 2.3.2
  title: Ensure access to NGINX directories and files is restricted
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The NGINX configuration directory (/etc/nginx or equivalent) and its contents should have restrictive permissions
    to enforce the principle of least privilege. Directories should be accessible only by the root user and the root group
    (and potentially read/execute by the group), but not by others. Files should be readable/writable by root and readable
    by the group, but inaccessible to others.
  rationale: Restrictive file permissions prevent unauthorized users on the system from viewing sensitive configuration details,
    such as backend IP addresses, routing logic, or loaded module paths. By removing "world" access (permissions for "other"),
    we ensure that only administrators (via sudo) can interact with the web server configuration. This is a fundamental defense
    against information disclosure.
  impact: Setting permissions to 640 (files) and 750 (directories) prevents non-privileged users from listing the configuration
    directory or reading configuration files.
  references:
  - 1. NIST SP 800-53:rev5:AC-3
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 41
  audit_raw: '1. Identify Configuration Directory:

    Run nginx -V  and identify the --conf-path to determine the configuration root (e.g.,

    /etc/nginx).

    2. Audit Directory Permissions:

    Run the following command to find directories with loose permissions:

    find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

    Evaluation:

    Verify that the output shows permissions of 750 (drwxr-x---) or more restrictive (e.g.,

    700).

    Standard: 755 (drwxr-xr-x) allows world read/execute.

    Hardened Target: 750 or 700.

    3. Audit File Permissions:

    Run the following command to find files with loose permissions:

    find /etc/nginx -type f -exec stat -Lc "%n %a" {} +

    Evaluation:

    Verify that the output shows permissions of 640 (-rw-r-----) or more restrictive (e.g.,

    600).

    Standard: 644 (-rw-r--r--) allows world read.

    Hardened Target: 640 or 600.'
  remediation: 'To restrict access to the NGINX configuration directory and files, execute the following

    commands:

    1. Restrict Directories (750):

    Allow owner (root) full access, group read/execute, deny others.

    find /etc/nginx -type d -exec chmod 750 {} +

    2. Restrict Files (640): Allow owner (root) read/write, group read, deny others.

    find /etc/nginx -type f -exec chmod 640 {} +

    Note: Private keys (e.g., .key files) require even stricter permissions (400 or 600) and

    should be addressed separately or manually verified here.'
  checks:
  - type: command
    command: find /etc/nginx -type d -exec stat -Lc "%n %a" {} + && find /etc/nginx -type f -exec stat -Lc "%n %a" {} +
    expected: Verify that the output shows permissions of 750 (drwxr-x---) or more restrictive (e.g.,
    severity: medium
    info: '1. Identify Configuration Directory:

      Run nginx -V  and identify the --conf-path to determine the configuration root (e.g.,

      /etc/nginx).

      2. Audit Directory Permissions:

      Run the following command to find directories with loose permissions:

      find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

      Evaluation:

      Verify that the output shows permissions of 750 (drwxr-x---) or more restrictive (e.g.,

      700).

      Stan'
- id: 2.3.3
  title: Ensure the NGINX process ID (PID) file is secured
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The PID file stores the main process ID of the nginx process. This file should be protected from unauthorized
    modification.
  rationale: The PID file should be owned by root and the group root. It should also be readable to everyone, but only writable
    by root (permissions 644). This will prevent unauthorized modification of the PID file, which could cause a denial of
    service.
  impact: None. The PID file is managed by the master process (root). Restricting write access prevents other users from tampering
    with the file, but read access is generally safe and required for monitoring.
  references:
  - 1. NIST SP 800-53:rev5:AC-3
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 44
  audit_raw: '1. Identify PID File Location:

    Run nginx -V  and look for the --pid-path argument to confirm the location (e.g.,

    /run/nginx.pid or /var/run/nginx.pid).

    2. Verify Ownership and Permissions:

    Run the following command (substituting the identified path):

    stat -Lc "%U:%G %a" /run/nginx.pid

    Evaluation:

    Ownership: Must be root:root.

    Permissions: Must be 644 (rw-r--r--) or more restrictive.'
  remediation: 'Set the correct ownership and permissions for the PID file (replace path as needed):

    chown root:root /run/nginx.pid

    chmod 644       /run/nginx.pid'
  checks:
  - type: command
    command: stat -Lc "%U:%G %a" /run/nginx.pid
    expected: ''
    severity: medium
    info: '1. Identify PID File Location:

      Run nginx -V  and look for the --pid-path argument to confirm the location (e.g.,

      /run/nginx.pid or /var/run/nginx.pid).

      2. Verify Ownership and Permissions:

      Run the following command (substituting the identified path):

      stat -Lc "%U:%G %a" /run/nginx.pid

      Evaluation:

      Ownership: Must be root:root.

      Permissions: Must be 644 (rw-r--r--) or more restrictive.'
- id: 2.4.1
  title: Ensure NGINX only listens for network connections on authorized ports
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: NGINX should be configured to listen only on authorized ports and protocols. While traditional HTTP/1.1 and
    HTTP/2 use TCP ports 80 and 443, modern HTTP/3 (QUIC) utilizes UDP port 443. Ensuring that NGINX binds only to approved
    interfaces and ports minimizes the attack surface.
  rationale: Limiting listening ports to authorized values ensures that no hidden or unintended services are exposed via NGINX.
    It also enforces strict control over which protocols (TCP vs. UDP) are accessible, which is particularly important with
    the introduction of UDP-based HTTP/3 traffic alongside traditional TCP traffic.
  impact: Disabling unused ports reduces the risk of unauthorized access. However, administrators must be aware that disabling
    UDP port 443 will break HTTP/3 connectivity, forcing clients to fall back to slower TCP-based HTTP/2 or HTTP/1.1.
  references:
  - 1. NIST SP 800-53:rev5:CM-7 b
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 47
  audit_raw: "1. Inspect Configuration:\nRun the following command to inspect all listen directives in the loaded configuration:\n\
    nginx -T 2>/dev/null | grep -r \"listen\"\nEvaluation:\nReview the output for unauthorized ports. A modern secure configuration\
    \ typically\nincludes:\nlisten 80;  (TCP) - Often used only for redirecting to HTTPS.\nlisten 443 ssl;  (TCP) - For HTTP/1.1\
    \ and HTTP/2.\nlisten 443 quic;  (UDP) - For HTTP/3 (QUIC).\nExample Output:\nserver {\n    listen  80;\n    listen 443\
    \ ssl;\n    listen 443 quic reuseport; # HTTP/3 (UDP)\n    ...\n}\nEnsure that no other ports (e.g., 8080, 8443) are open\
    \ unless explicitly authorized for\ninternal services or management interfaces.\n2. Verify System Listening Ports:\nOptionally,\
    \ verify what the process is actually binding to on the OS level:\nnetstat -tulpen | grep -i nginx\nLook for tcp lines\
    \ for standard traffic.\nLook for udp lines (e.g., *:443) if HTTP/3 is enabled."
  remediation: "Remove or comment out any listen directives that bind to unauthorized ports.\nFor HTTP/3 (QUIC) Support: Ensure\
    \ that you explicitly authorize and configure UDP\nport 443 in addition to TCP port 443.\nserver {\n    # Standard HTTPS\
    \ (TCP)\n    listen 443 ssl;\n    # HTTP/3 (UDP)\n    listen 443 quic reuseport;\n    # ... SSL/TLS configuration ...\n\
    }"
