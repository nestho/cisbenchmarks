- id: 5.2.2
  title: Ensure the maximum request body size is set correctly
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The client_max_body_size directive defines the maximum permissible size for a client request body, as indicated
    by the Content-Length header. If a request exceeds this size, NGINX will immediately reject it with a 413 Request Entity
    Too Large error, preventing the oversized request from being processed further or passed to a backend application.
  rationale: Limiting the request body size is a crucial defense against resource exhaustion DoS attacks and prevents oversized,
    potentially malicious payloads from reaching application backends. By setting a logical default limit and only increasing
    it for specific application endpoints that require it (e.g., file uploads), the principle of least functionality is enforced,
    significantly reducing the attack surface.
  impact: Setting this value too low is a common cause of application failure. Legitimate user actions, such as uploading
    files or submitting large forms, will be blocked with a 413 error if they exceed the configured limit. It is essential
    that this value is determined based on application requirements and not set to an arbitrary low number.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_max_body_size
  - 2. NIST SP 800-53:rev5:SC-5 a
  page_start: 125
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration for the

    client_max_body_size directive:

    nginx -T 2>/dev/null | grep -E ''^\s*(client_max_body_size)''

    Verify that a global client_max_body_size is set in the http block. For any location

    blocks that override this value (e.g., for uploads), manually verify that the increased

    limit is documented and aligns with the application''s functional requirements.'
  remediation: "Define a restrictive global limit in the http block. For specific application endpoints that\nneed to accept\
    \ larger request bodies, override this directive within the corresponding\nlocation block.\nExample Configuration:\nhttp\
    \ {\n    # Set a restrictive global default of 2 Megabytes. This prevents unexpected\nlarge requests on most endpoints.\n\
    \    client_max_body_size 2M;\n    server {\n        # ...\n        # This location handles API requests with potentially\
    \ large JSON payloads.\n        location /api/v1/data {\n            client_max_body_size 10M; # Allow up to 10MB\n  \
    \          # ...\n        }\n        # This location is for large file uploads.\n        location /uploads {\n       \
    \     client_max_body_size 50M; # Allow up to 50MB\n            # ...\n        }\n    }\n}"
