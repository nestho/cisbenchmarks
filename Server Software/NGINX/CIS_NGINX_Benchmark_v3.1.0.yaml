- id: 5.2.1
  title: Ensure timeout values for reading the client header and body are set correctly
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'To protect against slow clients holding connections open indefinitely, NGINX supports several timeout directives.
    The most important ones for client-facing connections are: client_header_timeout: Sets the maximum time the server will
    wait for a client to send the request header. client_body_timeout: Sets the maximum time allowed between sequential read
    operations when receiving the request body. This timer does not apply to the total time of the transfer. send_timeout:
    Sets the maximum time allowed between sequential write operations when sending a response to the client. If any of these
    timeouts are reached, the server closes the connection, freeing up resources.'
  rationale: Aggressively low timeout values are a primary defense against slow-read Denial of Service (DoS) attacks. These
    attacks attempt to exhaust server resources by opening many connections and keeping them alive for as long as possible
    by sending data extremely slowly. By setting low timeouts, NGINX efficiently closes these malicious connections, preserving
    resources for legitimate users.
  impact: Setting these values too low can terminate legitimate connections too early. For example, a user uploading a large
    file over a slow mobile connection could be cut off if client_body_timeout is too aggressive. The values must be carefully
    evaluated to achieve a balance between security (low values) and functionality (higher values for specific use cases such
    as file uploads).
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_header_timeout
  - 2. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_timeout
