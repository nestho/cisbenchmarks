      Verify that the configured IP addresses and CIDR ranges align with the documented list

      of trusted sources and that a deny all;  rule is present to enforce a default-d'
- id: 5.1.2
  title: Ensure only approved HTTP methods are allowed
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Following the principle of least functionality, an NGINX server should be configured to reject any HTTP methods
    that are not explicitly required by the application. While standard web browsing typically only needs GET, POST, and HEAD,
    modern RESTful APIs might require methods like PUT, PATCH, or DELETE. Any method not essential for the application's functionality
    should be blocked at the web server level.
  rationale: Disabling unused HTTP methods mitigates the risk of unintended server interaction and can prevent certain classes
    of web application attacks. For example, if an attacker finds a way to bypass application-layer authentication, an enabled
    but unused PUT or DELETE method on the web server could potentially lead to unauthorized file modification or deletion.
    By explicitly denying such methods, NGINX ensures that requests never even reach the backend application and therefore
    significantly reducing the attack surface.
  impact: An overly restrictive filter can block legitimate application functionality. Before implementing these restrictions,
    it is crucial to coordinate with application developers to get a definitive list of all required HTTP methods for every
    application endpoint. Incorrectly blocking a required method (e.g., PUT for a file upload feature) will cause parts of
    the application to fail.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#limit_except
  - 2. NIST SP 800-53:rev5:CM-7 b
  page_start: 117
  audit_raw: '1. Configuration Inspection:

    Run the following command to analyze the fully loaded NGINX configuration for any

    method-limiting directives:

    nginx -T 2>/dev/null | grep -E ''(\$request_method|limit_except)''

    Review the configuration to ensure that either a limit_except block or an if

    ($request_method) block is correctly implemented for the relevant location.

    2. Active Testing:

    Send a request with a non-approved method (e.g., OPTIONS or DELETE) using curl

    and verify that the server responds with the correct status code, not a 200 OK  or 404

    Not Found .

    # Send a disallowed OPTIONS request

    curl -X OPTIONS -I https://example.loc/api.html

    Expected Output: The server should return either HTTP/1.1 405 Not Allowed  or

    HTTP/1.1 444 Connection Closed Without Response . Any other 2xx or 4xx

    code indicates a potential misconfiguration.'
  remediation: "There are two recommended methods to restrict HTTP verbs.\nMethod 1 (Preferred): Using limit_except This directive\
    \ is designed for this\npurpose and is considered the cleanest approach. It restricts all methods except for the\nones\
    \ listed.\nlocation /api_login/ {\n    # Only allow GET, HEAD, and POST methods for this location.\n    limit_except GET\
    \ HEAD POST {\n        deny all;\n    }\n    # ... other directives ...\n}\nMethod 2 (Alternative): Using an if condition\
    \ This method offers more flexibility, such\nas returning a non-standard status code like 444, which simply closes the\n\
    connection without sending a response header.\nlocation / {\n    # If the request method is NOT one of GET, HEAD, or POST\n\
    \    if ($request_method !~ ^(GET|HEAD|POST)$) {\n        # --> close the connection immediately.\n        return 444;\n\
    \    }\n    # ... other directives ...\n}"
  checks:
