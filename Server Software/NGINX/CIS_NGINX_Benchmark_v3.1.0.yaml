      proxy_ssl_certificate_key directives with the correct paths within the relevant

      location block.

      Note: A complete audit is two-sided. You must also'
- id: 4.1.10
  title: Ensure the upstream traffic server certificate is trusted
  scoring: manual
  profile:
  - Level 2
  - Level 2
  description: When acting as a reverse proxy, NGINX must be configured to function as a secure TLS client. This requires
    validating the identity of the upstream server by verifying its certificate against a trusted Certificate Authority (CA).
    Furthermore, NGINX must ensure that the hostname of the upstream server matches the name (Subject Name / SAN) within the
    certificate itself.
  rationale: Without proper validation, NGINX blindly trusts the identity of the upstream server, making it vulnerable to
    man-in-the-middle (MitM) attacks within the internal network. An attacker could impersonate a legitimate backend service
    and intercept sensitive traffic. By enforcing certificate validation (proxy_ssl_verify) and hostname verification (proxy_ssl_name),
    NGINX guarantees that it is communicating with the intended, authentic upstream server.
  impact: Enabling strict upstream verification introduces a dependency on certificate lifecycle management. If the upstream
    server's certificate expires or is misconfigured, or if the CA certificate file on the NGINX server is outdated, NGINX
    will refuse to connect to the upstream, resulting in a service outage. This behavior is intentional and secures the connection
    at the cost of requiring careful certificate management.
  references:
  - 1. https://docs.nginx.com/nginx/admin-guide/security-controls/securing-http-trafficupstream/
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_ssl_trusted_ce
  page_start: 107
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration for the

    three required directives within the relevant proxy location block:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (proxy_ssl_verify|proxy_ssl_trusted_certificate|proxy_ssl_name)''

    Verify that the output contains the following directives:

    proxy_ssl_verify on;

    proxy_ssl_trusted_certificate /path/to/ca.crt;

    proxy_ssl_name your-upstream-hostname.com;

    If any of these three directives are missing, this recommendation is not fully

    implemented. Additionally, manually verify that the certificate referenced by

    proxy_ssl_trusted_certificate is the correct, valid CA certificate for your

    upstream services.'
  remediation: "To securely configure upstream validation, you must obtain the CA certificate that\nsigned your upstream server's\
    \ certificate.\n1. Place the CA certificate (e.g., upstream_ca.crt) in a secure directory on the\nNGINX server (e.g.,\
    \ /etc/nginx/ssl/).\n2. In the location block that proxies traffic, add the following three directives. The\nproxy_ssl_name\
    \ must match the hostname used in the proxy_pass directive.\nlocation /api/ {\n    proxy_pass                     https://your-upstream-hostname.com;\n\
    \    # 1. Enable verification\n    proxy_ssl_verify               on;\n    # 2. Specify the CA to trust for verification\n\
    \    proxy_ssl_trusted_certificate  /etc/nginx/ssl/upstream_ca.crt;\n    # 3. Verify the certificate's name matches the\
    \ server's hostname\n    proxy_ssl_name                 your-upstream-hostname.com;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: 'Verify that the output contains the following directives:'
    severity: medium
    info: 'Run the following command to inspect the fully loaded NGINX configuration for the

      three required directives within the relevant proxy location block:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (proxy_ssl_verify|proxy_ssl_trusted_certificate|proxy_ssl_name)''

