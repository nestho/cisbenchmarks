- id: 2.4.2
  title: Ensure requests for unknown host names are rejected
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: NGINX routes incoming requests to the appropriate virtual host by matching the Host header (HTTP/1.1) or :authority
    pseudo-header (HTTP/2, HTTP/3) against the server_name directives in your configuration. If no explicit match is found,
    NGINX falls back to the first defined server block or the one marked as default_server. Without a properly configured
    catch-all block that rejects unknown hostnames, your server will respond to arbitrary domain names that happen to point
    to your IP address, potentially exposing internal applications or enabling Host Header attacks.
  rationale: When NGINX receives a request, it selects the virtual host based on the Host header (or :authority in HTTP/2/3).
    If requests for unknown host names are not explicitly rejected, your applications may be served for arbitrary domains
    that simply point to your IP. This behavior can be abused in Host Header attacks and makes it harder to distinguish legitimate
    traffic from automated scans or misrouted requests in your logs.
  impact: Clients accessing the server directly via IP address or an unconfigured CNAME will be rejected. This is intended
    behavior but requires that all valid domains are explicitly defined in their own server blocks.
  references:
  - 1. https://nginx.org/en/docs/http/request_processing.html
  - 2. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host
  page_start: 50
  audit_raw: '1. Review Configuration:

    Check for the existence of a default server block that handles unknown hosts.

    nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"

    Evaluation:

    Ensure a server block exists with listen ... default_server .

    Verify it contains return 444;  (closes connection) or a 4xx error code.

    For HTTPS/TLS: Verify ssl_reject_handshake on;  is used to prevent

    certificate leakage.

    2. Functional Test:

    Send a request with an invalid Host header and verify the connection is rejected or

    returns an error.

    # Test HTTPS (expect connection reset or 4xx)

    curl -k -v https://127.0.0.1 -H ''Host: invalid.example.com'''
  remediation: "Configure a \"Catch-All\" default server block as the first block in your configuration (or\nexplicitly marked\
    \ with default_server).\nConfiguration Example (Modern Standard with TLS/HTTP3):\nserver {\n    # Listen on standard ports\
    \ for IPv4 and IPv6\n    listen      80  default_server;\n    listen [::]:80  default_server;\n    # Listen for HTTPS\
    \ (TCP) and QUIC (UDP)\n    listen      443 ssl  default_server;\n    listen [::]:443 ssl  default_server;\n    listen\
    \      443 quic default_server;\n    listen [::]:443 quic default_server;\n    # Reject SSL Handshake for unknown domains\
    \ (Prevents cert leakage)\n    ssl_reject_handshake on;\n    # Catch-all name\n    server_name _;\n    # Close connection\
    \ without response (Non-standard code 444)\n    return 444;\n}\nAfter adding this block, ensure all your valid applications\
    \ have their own server blocks\nwith explicit server_name directives."
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"
    expected: ''
    severity: medium
    info: '1. Review Configuration:

      Check for the existence of a default server block that handles unknown hosts.

      nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"

      Evaluation:

      Ensure a server block exists with listen ... default_server .

      Verify it contains return 444;  (closes connection) or a 4xx error code.

      For HTTPS/TLS: Verify ssl_reject_handshake on;  is used to prevent

      certi'
- id: 2.4.3
  title: Ensure keepalive_timeout is 10 seconds or less, but not 0
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Persistent connections are leveraged by all modern browsers to facilitate greater web performance. The keep-alive
    timeout limits the time a persistent connection may remain open. Setting the keep-alive timeout allows this timeout to
    be controlled on the server side.
  rationale: Setting a keep-alive timeout on the server side helps mitigate denial of service attacks that establish too many
    persistent connections, exhausting server resources.
  impact: ''
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
  - 2. NIST SP 800-53:rev5:SC-10
  page_start: 54
  audit_raw: 'To check the current setting for the keepalive_timeout directive, issue the below

    command. You should also manually check your nginx configuration for include

    statements that may be located outside the /etc/nginx directory. If none of these are

    present, the value is set at the default.

    grep -ir keepalive_timeout /etc/nginx

    The output of the command should contain something similar to the following:

    keepalive_timeout 10;'
  remediation: 'Find the HTTP or server block of your nginx configuration, and add the

    keepalive_timeout directive. Set it to 10 seconds or less, but not 0. This example

    command sets it to 10 seconds:

    keepalive_timeout 10;'
  checks:
  - type: command
    command: grep -ir keepalive_timeout /etc/nginx
    expected: ''
    severity: medium
    info: 'To check the current setting for the keepalive_timeout directive, issue the below

      command. You should also manually check your nginx configuration for include

      statements that may be located outside the /etc/nginx directory. If none of these are

      present, the value is set at the default.

      grep -ir keepalive_timeout /etc/nginx

      The output of the command should contain something similar to the following'
- id: 2.4.4
  title: Ensure send_timeout is set to 10 seconds or less, but not 0
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The send_timeout directive sets a timeout for transmitting a response to the client between two successive
    write operations.
  rationale: Setting the send_timeout directive on the server side helps mitigate slow HTTP denial of service attacks by ensuring
    write operations taking up large amounts of time are closed.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/SCG_WS_nginx
  - 2. https://nginx.org/en/docs/http/ngx_http_core_module.html#send_timeout
