- id: 4.1.11
  title: Ensure Secure Session Resumption is Enabled
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: TLS 1.3 introduces a secure session resumption mechanism using Pre-Shared Keys (PSKs) that significantly improves
    performance for returning clients by reducing the handshake latency. This modern mechanism should be enabled to enhance
    user experience without compromising security.
  rationale: Unlike older TLS versions, the TLS 1.3 resumption mechanism preserves Perfect Forward Secrecy (PFS). It accomplishes
    this by combining the PSK with a fresh Ephemeral Diffie-Hellman key exchange (ECDHE) for every resumed session. This ensures
    that a compromise of the resumption key does not compromise any past or future session keys. Disabling this feature provides
    no security benefit and negatively impacts performance.
  impact: Enabling session resumption has a positive performance impact. There are no significant negative security implications
    when using a TLS 1.3-only configuration.
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc8446
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_session_tickets
  page_start: 109
  audit_raw: 'Run the following command to verify that ssl_session_tickets is not explicitly

    turned off.

    # This command should produce NO output.

    grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"

    If the command produces any output containing ssl_session_tickets off; , this

    recommendation is not implemented.'
  remediation: 'Ensure that ssl_session_tickets is not set to off. The recommended approach is

    to remove the directive entirely, as the default value is on.

    If the directive is present, either remove it or set it to on:

    # REMOVE this line from your configuration:

    # ssl_session_tickets off;

    # OR, if you want to be explicit, ensure it is set to ON (optional):

    ssl_session_tickets  on;'
  checks:
  - type: command
    command: grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"
    expected: Run the following command to verify that ssl_session_tickets is not explicitly
    severity: medium
