      grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"

      If the command produces any output containing ssl_session_tickets off; , this

      recommendation is not implemented.'
- id: 4.1.12
  title: Ensure HTTP/3.0 is used
  scoring: manual
  profile:
  - Level 2
  description: HTTP/2 is the established standard for web communication, offering significant performance benefits over HTTP/1.1
    through multiplexing. For 2025 and beyond, HTTP/3 should also be enabled. HTTP/3 operates over the QUIC protocol, which
    is built on UDP, to solve head-of-line blocking, reduce connection setup time, and improve performance on unreliable networks.
    Both protocols require a secure TLS 1.3 environment to function.
  rationale: Enabling HTTP/2 provides a baseline of modern performance via stream multiplexing. Enabling HTTP/3 provides a
    further competitive advantage by mitigating TCP's head-ofline blocking and offering a faster, more reliable connection
    handshake, which is especially beneficial for mobile users. A server supporting both protocols can serve the vast majority
    of modern clients with the best possible performance and security. The strong encryption requirements of both protocols
    naturally align with a TLS 1.3-only policy.
  impact: 'HTTP/2 has no significant negative impact as it is universally supported by modern clients. Enabling HTTP/3 has
    operational considerations: 1. NGINX Build: Your NGINX binary must be compiled with HTTP/3 and QUIC support. Standard
    OS packages may not include this. The repository of NGINX itself has the http_v3 module since NGINX version 1.25.0 Run
    this command and check if the http_v3 module is present nginx -V 2>&1 | tr '' '' ''\n'' | grep --color=auto ''with-''
    2. Firewall Configuration: You must allow UDP traffic on port 443, as HTTP/3 uses the QUIC protocol over UDP. This is
    a common oversight that will cause HTTP/3 to fail.'
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc9114
  - 2. https://datatracker.ietf.org/doc/html/rfc9000
  page_start: 111
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (http2\s*on;|listen.*quic\s*reuseport|add_header.*Alt-Svc)''

    Verify the following in the output for your primary server block:

    1. The TCP directive http2 on;  is set.

    2. A UDP listen directive with the quic parameter exists: listen 443 quic

    reuseport;

    For clarity, http3 on;  can be set too, but is active by default.

    3. An Alt-Svc header is being sent to advertise HTTP/3 availability: add_header

    Alt-Svc ''h3=":443"; ma=63072000'';

    If any of these are missing, this recommendation is not fully implemented.'
  remediation: "Prerequisite: Ensure your NGINX version is compiled with the --withhttp_v3_module flag.\n1. Open your NGINX\
    \ server configuration file.\n2. In the main server block for your HTTPS site, add or modify the directives to\nenable\
    \ HTTP/2, HTTP/3, and advertise its availability.\n3. Ensure your firewall allows UDP traffic on port 443.\nserver {\n\
    \    # 1. Enable HTTP/2 on the standard TCP listener\n    listen         443      ssl;\n    listen         [::]:443 ssl;\n\
    \    http2          on;\n    # 2. Enable HTTP/3 on the UDP listener\n    listen         443      quic reuseport;\n   \
    \ listen         [::]:443 quic reuseport;\n    http3          on;\n    # ... other ssl directives like ssl_certificate\
    \ ...\n    # 3. Advertise HTTP/3 availability to browsers\n    # The max-age (ma) is in seconds (e.g., 2 years)\n    add_header\
    \      Alt-Svc 'h3=\":443\"; ma=63072000';\n    # Required for HTTP/3\n    ssl_early_data  on;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: ''
    severity: medium
    info: 'Run the following command to inspect the fully loaded NGINX configuration:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (http2\s*on;|listen.*quic\s*reuseport|add_header.*Alt-Svc)''

      Verify the following in the output for your primary server block:

      1. The TCP directive http2 on;  is set.

      2. A UDP listen directive with the quic parameter exists: listen 443 quic

      reuseport;

      For clarity, http3 on;  can be set to'
- id: 5.1.1
  title: Ensure allow and deny filters limit access to specific IP addresses
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: Access control based on IP addresses is a fundamental defense-in-depth mechanism. By using NGINX's allow and
    deny directives, access to the entire server or specific location blocks can be restricted to trusted network sources,
    such as internal subnets, specific hosts, or VPN ranges. This is particularly effective for protecting nonpublic administrative
    interfaces or internal APIs from the public internet.
  rationale: Applying the principle of least privilege at the network layer is a highly effective security measure. By explicitly
    defining which IP addresses or CIDR ranges are permitted to access sensitive resources and implicitly denying all others
    with deny all; , the attack surface is significantly reduced. This prevents unauthorized network segments from even attempting
    to exploit potential application-layer vulnerabilities.
  impact: A misconfigured IP filter list can lead to service denial for legitimate users or services. In dynamic environments
    where IP addresses can change (e.g., cloud instances without static IPs), this can be a particular challenge. Maintaining
    accurate and up-to-date IP allow-lists requires operational discipline.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_access_module.html
  - 2. NIST SP 800-53:rev5:SC-7 (11)
  page_start: 115
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration for allow

    and deny rules:

    nginx -T 2>/dev/null | grep -E ''^\s*(allow|deny)''

    Then, manually review the active rules within the http, server, or location blocks.

    Verify that the configured IP addresses and CIDR ranges align with the documented list

    of trusted sources and that a deny all;  rule is present to enforce a default-deny

    policy.'
  remediation: "Identify the specific location block you wish to protect (e.g., an admin login page or\ninternal stats). Compile\
    \ a list of trusted source IP addresses and network ranges. Add\nallow directives for each trusted source, followed by\
    \ a final deny all;  directive.\nNGINX processes rules in order, and stops at the first match.\nlocation /admin_login/\
    \ {\n    # Allow a specific monitoring server\n    allow 192.168.1.100;\n    # Allow the internal office network range\n\
    \    allow 10.20.30.0/24;\n    # Deny all other access to this location\n    deny all;\n    # ... other directives for\
    \ the admin location, e.g., proxy_pass ...\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(allow|deny)'
    expected: Verify that the configured IP addresses and CIDR ranges align with the documented list
    severity: medium
