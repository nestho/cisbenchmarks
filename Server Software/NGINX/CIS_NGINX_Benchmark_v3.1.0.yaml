  impact: Choosing an overly restrictive policy like no-referrer can break functionality that relies on knowing the source
    of traffic, such as web analytics, affiliate tracking, or multisite authentication flows. Conversely, a loose policy (unsafe-url)
    leaks private data. The recommended policy strict-origin-when-cross-origin is a balance by preserving full referrer data
    for internal navigation while stripping sensitive path and query data when navigating to external sites.
  references:
  - 1. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  - 2. https://developer.mozilla.org/enUS/docs/Web/HTTP/Reference/Headers/Referrer-Policy
  page_start: 144
  audit_raw: 'Run the following command to inspect the fully loaded NGINX configuration:

    nginx -T 2>/dev/null | grep -i ''Referrer-Policy''

    Evaluate the findings:

    Verify that the directive add_header Referrer-Policy "..." always;  is

    present.

    Check the configured value. While no-referrer is the most secure, strictorigin-when-cross-origin is the widely accepted
    standard for balancing

    security and functionality.

    Ensure the always parameter is present.'
  remediation: 'Add the following line to your server or http block. This example uses the robust

    default setting that protects privacy without breaking internal analytics.

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    If maximum privacy is required and no referrer data is needed even for internal links:

    add_header Referrer-Policy "no-referrer" always;'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i 'Referrer-Policy'
    expected: Verify that the directive add_header Referrer-Policy "..." always;  is
    severity: medium
    info: 'Run the following command to inspect the fully loaded NGINX configuration:

      nginx -T 2>/dev/null | grep -i ''Referrer-Policy''

      Evaluate the findings:

      Verify that the directive add_header Referrer-Policy "..." always;  is

      present.

      Check the configured value. While no-referrer is the most secure, strictorigin-when-cross-origin is the widely accepted
      standard for balancing

      security and functionality.

      En'
