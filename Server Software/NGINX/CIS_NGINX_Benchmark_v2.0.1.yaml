- id: 5.2.3
  title: Ensure the maximum buffer size for URIs is defined
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The large_client_header_buffers directive defines the number and size of buffers used within the URI. A request
    cannot exceed the size of this buffer when this directive is configured. The large_client_header_buffers directive should
    be set to restrict buffer usage. The number of buffers should generally set to two and the length be set to 1K; however,
    this may not be a good fit for your application and may need to be set differently.
  rationale: The large_client_header_buffers directive may assist in preventing buffer overflow attacks that leverage long
    URI query parameters.
  impact: ''
  references:
  - 1. https://www.cyberciti.biz/tips/linux-unix-bsd-nginx-webserver-security.html
  - 2. https://www.owasp.org/index.php/Denial_of_Service_Cheat_Sheet
