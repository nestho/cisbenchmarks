- id: 4.1.11
  title: Ensure your domain is preloaded
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: 'Preloading your domain hardcodes it as only being accessible through HTTPS by browsers. Note: Preloading should
    only be done with careful consideration! Your website and all its subdomains will be forced over HTTPS. If your website
    or any of its subdomains are not able to support preloading, you should not preload your site. Preloading should be opt-in
    only, and if done, may impact more sites than the nginx instance you are working on. Removing preloading can be slow and
    painful, and should only be done with careful consideration according to https://hstspreload.org.'
  rationale: Preloading your domain helps prevent HTTP downgrade attacks and increases trust.
  impact: ''
  references:
  - 1. https://hstspreload.org/
  page_start: 114
  audit_raw: 'Visit https://hstspreload.org/ and type in your top-level domain name to verify it is

    preloaded.'
  remediation: 'In order to successfully preload your website, you must meet the below criteria:

    1. Serve a valid certificate.

    This may be accomplished by following recommendation 4.1.2.

    2. Redirect from HTTP to HTTPS if using port 80.

    This may be accomplished by following recommendation 4.1.1.

    3. Configure all subdomains to support HTTPS only.

    This will require you to configure all subdomains for HTTPS only. For example, a

    subdomain of cissecurity.org is workbench.cissecurity.org and would need to be

    configured for HTTPS only.

    4. Configure an HSTS header on your base domain, as shown below for nginx.

    If your base domain is nginx, you may accomplish this with several modifications from

    the HSTS recommendation. Change your header to include the preload directive and

    the includesubdomains directive, and make your max-length one year or longer. The

    header should be modified similar to the below snippet.

    add_header Strict-Transport-Security "Strict-Transport-Security: maxage=31536000; includeSubDomains; preload";

    After you have met these requirements, add your site to the list by following the

    instructions at https://hstspreload.org/.'
  checks:
  - type: manual_review
    info: 'Visit https://hstspreload.org/ and type in your top-level domain name to verify it is

      preloaded.'
    severity: medium
- id: 4.1.12
  title: Ensure session resumption is disabled to enable perfect forward security
  scoring: scored
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: Session resumption for HTTPS sessions should be disabled so perfect forward secrecy can be achieved.
  rationale: Perfect forward secrecy is an encryption mechanism that enables past session keys to not be compromised even
    if the server's private key is compromised. If an attacker recorded all traffic to a server and stored it and then obtained
    the private key without perfect forward secrecy, all communications would be compromised. With perfect forward secrecy,
    session keys are generated using Diffie-Hellman for every session a user initiates, which isolates session compromise
    to only that communication session. Allowing session resumption breaks perfect forward secrecy; this expands the surface
    area for an attacker to compromise past sessions and communications with a server if they are able to compromise the session.
  impact: ''
  references:
  - 1. https://www.imperialviolet.org/2013/06/27/botchingpfs.html
  - 2. https://scotthelme.co.uk/perfect-forward-secrecy/
  page_start: 116
  audit_raw: 'Run the following command to verify the ssl_session_tickets directive is turned off. You

    should always investigate your nginx configuration file for included file locations outside

    of /etc/nginx to ensure you are properly investigating each server block for the presence

    of the ssl_session_tickets directive being turned off.

    grep -ir ssl_session_tickets /etc/nginx

    The output should contain the following:

    ssl_session_tickets off;'
  remediation: 'Turn off the ssl_session_tickets directive as part of any server block in your nginx

    configuration:

    ssl_session_tickets off;'
  checks:
  - type: command
    command: grep -ir ssl_session_tickets /etc/nginx
    expected: ''
    severity: medium
    info: 'Run the following command to verify the ssl_session_tickets directive is turned off. You

      should always investigate your nginx configuration file for included file locations outside

      of /etc/nginx to ensure you are properly investigating each server block for the presence

      of the ssl_session_tickets directive being turned off.

      grep -ir ssl_session_tickets /etc/nginx

      The output should contain the foll'
- id: 4.1.13
  title: Ensure HTTP/2.0 is used
  scoring: scored
  profile:
  - Level 2 - Webserver
  description: 'HTTP/2.0 is an optimized and more secure version of the HTTP protocol. It should be enabled so users can take
    advantage of it. Note: Legacy user agents may not be able to connect to a server using HTTP/2.0.'
  rationale: HTTP/2.0 introduces both performance benefits through full multiplexing and several security benefits. HTTP/2.0
    has improved cipher suite requirements and denylists. It also disables session renegotiation and TLS compression. This
    helps protect against vulnerabilities like CRIME and ensures we have stronger encryption.
  impact: ''
  references:
  - 1. https://mozilla.github.io/server-side-tls/ssl-config-generator/
  - 2. http://http2.github.io/http2-spec/
  page_start: 118
  audit_raw: 'Verify that listening ports on the web server leverage HTTP/2.0 by running this

    command:

    grep -ir http2 /etc/nginx

    If there is no output, the output does not cover all running ports on the server that are

    not redirecting to another port, or the output is commented out, this recommendation is

    not implemented.'
  remediation: "Open the nginx server configuration file and configure all listening ports with http2,\nsimilar to that of\
    \ this example:\nserver {\n    listen 443 ssl http2;\n}"
  checks:
  - type: command
    command: grep -ir http2 /etc/nginx
    expected: Verify that listening ports on the web server leverage HTTP/2.0 by running this
    severity: medium
    info: 'Verify that listening ports on the web server leverage HTTP/2.0 by running this

      command:

      grep -ir http2 /etc/nginx

      If there is no output, the output does not cover all running ports on the server that are

      not redirecting to another port, or the output is commented out, this recommendation is

      not implemented.'
- id: 4.1.14
  title: Ensure only Perfect Forward Secrecy Ciphers are Leveraged
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: Perfect forward secrecy protects users of your website by ensuring that even if your private key is compromised
    that your user's sessions are not able to be compromised. This improves upon other ciphers where if your private key was
    compromised all user sessions can also be compromised retroactively.
  rationale: Perfect Forward Secrecy (PFS) helps to reduce the impact of a private key compromise.
  impact: ''
  references:
  - 1. https://scotthelme.co.uk/perfect-forward-secrecy/
  page_start: 120
  audit_raw: 'To check that only PFS ciphers are used to ensure that only ciphers that are

    ECDHE/EECDH ciphers and DHE/EDH ciphers are enabled. To audit the ciphers setup

    on NGINX run the below two commands:

    grep -ir ssl_ciphers /etc/nginx/

    grep -ir proxy_ssl_ciphers /etc/nginx'
  remediation: 'Ensure that only ciphers that are compatible with perfect forward secrecy are used.

    ECDHE/EECDH ciphers and DHE/EDH ciphers support this capability. Its

    recommended to leverage ECDHE ciphers unless you need to support legacy clients

    because they are considered stronger and faster. An example configuration that may be

    used is: "EECDH:EDH:!NULL:!SSLv2:!RC4:!aNULL:!3DES:!IDEA".

    The below configuration will only enable ciphers compatible with perfect forward

    secrecy.

    Web Server:

    ssl_ciphers EECDH:EDH:!NULL:!SSLv2:!RC4:!aNULL:!3DES:!IDEA;

    Proxy:

    proxy_ssl_ciphers EECDH:EDH:!NULL:!SSLv2:!RC4:!aNULL:!3DES:!IDEA;'
  checks:
  - type: command
    command: grep -ir ssl_ciphers /etc/nginx/ && grep -ir proxy_ssl_ciphers /etc/nginx
    expected: ''
    severity: medium
    info: 'To check that only PFS ciphers are used to ensure that only ciphers that are

      ECDHE/EECDH ciphers and DHE/EDH ciphers are enabled. To audit the ciphers setup

      on NGINX run the below two commands:

      grep -ir ssl_ciphers /etc/nginx/

      grep -ir proxy_ssl_ciphers /etc/nginx'
- id: 5.1.1
  title: Ensure allow and deny filters limit access to specific IP addresses
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: IP-based restrictions act as a defense in depth mechanism. They allow you to allowlist legitimate paths to
    your applications and explicitly deny IP addresses you believe to be malicious.
  rationale: IP restrictions help you to only allow traffic based on the concept of least privilege. You may specify vlans,
    countries, or specific servers that may be allowed or denied on your site. It is recommended that you implicitly deny
    all traffic and only allow those with a legitimate use case to access your website if choosing to take this approach.
    This allows you to limit the surface area an attack may come from.
  impact: ''
  references:
  - 1. https://help.dreamhost.com/hc/en-us/articles/222784068-The-most-importantsteps-to-take-to-make-an-nginx-server-more-secure
  - 2. http://nginx.org/en/docs/http/ngx_http_access_module.html
  page_start: 124
  audit_raw: "To verify IP-based restrictions are limiting access correctly, perform the following steps:\nStep 1: Open your\
