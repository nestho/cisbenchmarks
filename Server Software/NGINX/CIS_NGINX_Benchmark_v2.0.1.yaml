    \ in\nCIDR notation or single addresses.\nlocation / {\n    allow 10.1.1.1;\n    deny all;\n}\nStep 3: Ensure the allowed\
    \ IP addresses are not too permissive for your use case. For\nexample, in the above snippet, 10.1.1.1 may be a load balancer\
    \ connecting to your\nproxy, and you only want user traffic to come from the load balancer."
  remediation: "Compile a list of network ranges or IP addresses you would want to access your web\nserver or proxy. Then\
    \ add these ranges with the allow directive. The deny directive\nshould be included with all IP addresses implicitly denied.\n\
    location / {\n    allow 10.1.1.1;\n    deny all;\n}"
  checks:
