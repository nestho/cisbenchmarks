      directory. If this is not present, the value is set at the default.

      grep -ir timeout /etc/nginx

      The output should contain the following:

      client_body_time'
- id: 5.2.2
  title: Ensure the maximum request body size is set correctly
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The client_max_body_size directive sets the size of the request body that is allowed to read a client request.
    This defines the number of bytes allowed in a request and is equivalent to the Content-Length request header field.
  rationale: Limiting the size of the request body helps prevent unexpectedly long or large client requests from being passed
    to an application to perform buffer overflow attacks. This value should be set low enough to protect the application but
    high enough not to interfere with functionality and block legitimate request bodies.
  impact: ''
  references:
  - 1. https://www.cyberciti.biz/tips/linux-unix-bsd-nginx-webserver-security.html
  - 2. http://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_temp_path
