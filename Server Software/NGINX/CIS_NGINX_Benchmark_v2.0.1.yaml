      Open the file to the rig'
- id: 4.1.3
  title: Ensure private key permissions are restricted
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The server's private key should be protected from unauthorized access by limiting access based on the principle
    of least privilege.
  rationale: A server's private key file should be restricted to 400 permissions. This ensures only the owner of the private
    key file can access it. This is the minimum necessary permissions for the server to operate. If the private key file is
    not protected, an unauthorized user with access to the server may be able to find the private key file and use it to decrypt
    traffic sent to your server.
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'Verify the permissions on the key file are 400. This can be found by running the

    following command. You should replace /etc/nginx/nginx.key with the location of your

    key file.

    find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

    The output should show mode 400 or more restrictive

    Example:

    /etc/nginx/nginx.key 400'
  remediation: 'Run the following command to remove excessive permissions on key files in the

    `/etc/nginx/ directory.

    Note: The directory /etc/nginx/ should be replaced with the location of your key file.

    find /etc/nginx/ -name ''*.key'' -exec chmod u-wx,go-rwx {} +'
  checks:
  - type: command
    command: find /etc/nginx/ -name '*.key' -exec stat -Lc "%n %a" {} +
    expected: ''
    severity: medium
    info: 'Verify the permissions on the key file are 400. This can be found by running the

      following command. You should replace /etc/nginx/nginx.key with the location of your

      key file.

      find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

      The output should show mode 400 or more restrictive

      Example:

      /etc/nginx/nginx.key 400'
- id: 4.1.4
  title: Ensure only modern TLS protocols are used
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Only modern TLS protocols should be enabled in NGINX for all client connections and upstream connections. Removing
    legacy TLS and SSL protocols (SSL 3.0, TLS 1.0 and 1.1), and enabling emerging and stable TLS protocols (TLS 1.2, and
    TLS 1.3), ensures users are able to take advantage of strong security capabilities and protects them from insecure legacy
    protocols.
  rationale: 'Why disable SSL 3.0: The POODLE Vulnerability allowed attackers to exploit SSL 3.0 to obtain cleartext information
    by exploiting weaknesses in CBC in 2014. SSL 3.0 is also no longer FIPS 140-2 compliant. Why disable TLS 1.0: TLS 1.0
    was deprecated from use when PCI DSS Compliance mandated that it not be used for any applications processing credit card
    numbers in June 2018. TLS 1.0 does not make use of modern protections, and almost all user agents that do not support
    TLS 1.2 or higher are no longer supported by their vendor. Why disable TLS 1.1: Because of the increased security associated
    with higher versions of TLS, TLS 1.0 should be disabled. Modern browsers will begin to flag TLS 1.1 as deprecated in early
    2019. Why enable TLS 1.2: TLS 1.2 takes advantage of several security features including modern cipher suites, perfect
    forward security, and authenticated encryption. Why enable TLS 1.3: TLS 1.3 improves security by removing several insecure
    cipher suites by default and adding several more secure algorithms. All public-key exchange mechanisms support perfect
    forward secrecy in this version of TLS. Additionally, TLS 1.3 makes drastic performance improvements by removing a full
    round trip in the TLS handshake.'
  impact: Disabling certain TLS may not allow legacy user agents to connect to your server. Disabling negotiation of specific
    protocols with your backend server may also limit your ability to connect with legacy servers. You should always consider
    if you need to support legacy user agents or servers when selecting your TLS protocols.
  references:
  - 1. https://webkit.org/blog/8462/deprecation-of-legacy-tls-1-0-and-1-1-versions/
  - 2. https://www.cloudflare.com/learning-resources/tls-1-3/
  page_start: 97
  audit_raw: 'You can verify which SSL/TLS protocols your server uses by issuing the below

    command to see the configured cipher suites on the server. If anything older than TLS

    1.2 is implemented or nothing appears, this recommendation is not implemented.

    grep -ir ssl_protocol /etc/nginx

    Note: Depending on your configuration, you may see different results. The directive

    ssl_protocols should always be part of your server block. If your NGINX server is also a

    proxy or load balancer, you should also check for the presence of the

    proxy_ssl_protocols directive as part of the location block of your nginx configuration.

    This ensures your proxy follows a specific set of negotiation rules for encrypting traffic

    with your upstream server.'
  remediation: "Run the following commands to change your ssl_protocols if they are already\nconfigured. This remediation\
    \ advice assumes your nginx configuration file does not\ninclude server configuration outside of /etc/nginx/nginx.conf.\
    \ You may have to also\ninspect the include files in your nginx.conf to ensure this is properly implemented.\nWeb Server:\n\
    sed -i \"s/ssl_protocols[^;]*;/ssl_protocols TLSv1.2 TLSv1.3;/\"\n/etc/nginx/nginx.conf\nProxy:\nsed -i \"s/proxy_ssl_protocols[^;]*;/proxy_ssl_protocols\
    \ TLSv1.2 TLSv1.3;/\"\n/etc/nginx/nginx.conf\nIf your ssl_protocols are not already configured, this can be accomplished\
    \ manually by\nopening your web server or proxy server configuration file and manually adding the\ndirectives.\nWeb Server:\n\
    server {\n    ssl_protocols TLSv1.2 TLSv1.3;\n}\nProxy:\nlocation / {\n      proxy_pass cisecurity.org;\n      proxy_ssl_protocols\
    \ TLSv1.2 TLSv1.3;\n    }"
  checks:
  - type: command
    command: grep -ir ssl_protocol /etc/nginx
    expected: ''
    severity: medium
    info: 'You can verify which SSL/TLS protocols your server uses by issuing the below

      command to see the configured cipher suites on the server. If anything older than TLS

      1.2 is implemented or nothing appears, this recommendation is not implemented.

      grep -ir ssl_protocol /etc/nginx

      Note: Depending on your configuration, you may see different results. The directive

      ssl_protocols should always be part of yo'
- id: 4.1.5
  title: Disable weak ciphers
  scoring: manual
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The ssl_ciphers directive should be used to configure the available ciphers on your web server, and the proxy_ssl_ciphers
    directive should be used to configure the available ciphers for your proxy. Weak ciphers should be disabled based on your
    company's policy or an industry best practice compliance profile. The ssl_prefer_server_ciphers should be used to ensure
    the user agent respects the server's preferred cipher order and does not set its own. If you are using a proxy or load
    balancer, you should use the proxy_ssl_ciphers directive to ensure your upstream connections are negotiated using secure
    ciphers.
  rationale: The use of strong ciphers is critical to maintaining strong encryption on your web server, load balancer, or
    proxy. Weak ciphers may compromise the security of your site or your users by allowing legacy user agents to connect to
    your site in a vulnerable way. You may also meet compliance concerns by ensuring that your upstream connections meet the
    same level of security if using a proxy or load balancer. The server should enforce the cipher preference on the server
    side to protect users from malicious actors on the client side.
  impact: Strong cipher configurations may not allow legacy user agents or user agents with weak configurations to connect
    to your site. If your server must also pass to a legacy upstream server, this may prevent it from being able to negotiate
    a cipher upstream.
  references:
  - 1. CIS Apache HTTP Server Benchmark
  - 2. https://ssllabs.com
  page_start: 100
  audit_raw: 'Use the following procedure to verify the ssl_cipher and proxy_ssl_cipher directives

    meet your company''s policy.

    grep -ir ssl_ciphers /etc/nginx/

    grep -ir proxy_ssl_ciphers /etc/nginx

    This output will show the server''s configured ciphers and cipher preference policy. If you

    have multiple server blocks or proxy passes, you should ensure the directive or

    directives appear for each.

    In your environment, you may have to check all include files in your nginx configuration

    or the nginx configuration itself manually. The server ciphers may be located as part of

    the server block, and the proxy ciphers may be located as part of the location block for

    your upstream traffic.

    OpenSSL may also be used to check compatible ciphers following the procedure found

    at OWASP:

    https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29'
  remediation: "The following procedures may be used to implement industry standard cipher profiles if\nyou have an existing\
    \ profile defined. These profiles may be modified to meet the\nrequirements defined in your company's policy. This procedure\
    \ assumes that all server\nblocks will be in /etc/nginx/nginx.conf and not inside any included files in the\nconfiguration.\n\
    Set the ssl_cipher directive as part of your server block, and set the proxy_ssl_ciphers\ndirective as part of the location\
    \ block for your upstream server.\nThis should look similar to the below examples:\nServer block configuration for client\
    \ connectivity to web server, proxy, or load\nbalancer:\nserver {\n  ssl_ciphers ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\n\
    }\nProxy or load balancer configuration for defined upstream negotiation:\nlocation / {\n  proxy_pass https://cisecurity.org;\n\
    \  proxy_ssl_ciphers ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\n}\nThe below procedure assumes the default configuration\
    \ profile. If you do not have\nssl_ciphers or proxy_ssl_ciphers defined, add the directives to your proxy or web server\n\
    configuration profile, then run the below commands to configure them to your selected\nprofile.\nNo weak ciphers SSLLABS\
    \ proxy configuration\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers ECDHE-ECDSA-AES128-GCMSHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSAAES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;/\"\
    \n/etc/nginx/nginx.conf\nNo weak ciphers SSLLABS web server configuration:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHERSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCMSHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSAAES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;/\"\
    \ /etc/nginx/nginx.conf\nFor changes to take effect, you must recycle nginx:\nsystemctl restart nginx"
  checks:
  - type: command
    command: grep -ir ssl_ciphers /etc/nginx/ && grep -ir proxy_ssl_ciphers /etc/nginx
    expected: ''
    severity: medium
    info: 'Use the following procedure to verify the ssl_cipher and proxy_ssl_cipher directives

      meet your company''s policy.

      grep -ir ssl_ciphers /etc/nginx/

      grep -ir proxy_ssl_ciphers /etc/nginx

      This output will show the server''s configured ciphers and cipher preference policy. If you

      have multiple server blocks or proxy passes, you should ensure the directive or

      directives appear for each.

      In your environme'
- id: 4.1.6
  title: Ensure custom Diffie-Hellman parameters are used
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Custom Diffie-Hellman (DH) key exchange parameters should be used. DH Ephemeral (DHE) parameters with at least
    2048 bits should be generated.
  rationale: Backward-compatible Perfect Forward Secrecy (PFS) ciphers (e.g. DHE-RSA-AES128SHA256) should use strong and unique
    parameters. By default, NGINX will generate 1024-bit RSA keys for PFS ciphers; stronger alternatives should be used instead
    to provide better protection for data protected by encryption.
  impact: ''
  references:
  - 1. https://weakdh.org/sysadmin.html
  page_start: 104
  audit_raw: 'Verify the option ssl_dhparam is explicitly provided:

    grep ssl_dhparam /etc/nginx/nginx.conf'
  remediation: "Generate strong DHE (Ephemeral Diffie-Hellman) parameters using the following\ncommands:\nmkdir /etc/nginx/ssl\n\
    openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048\nchmod 400 /etc/nginx/ssl/dhparam.pem\nAlter the server configuration\
    \ to use the new parameters:\nhttp {\n    server {\n        ssl_dhparam /etc/nginx/ssl/dhparam.pem;\n    }\n}"
  checks:
  - type: command
    command: grep ssl_dhparam /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Verify the option ssl_dhparam is explicitly provided:

      grep ssl_dhparam /etc/nginx/nginx.conf'
- id: 4.1.7
  title: Ensure Online Certificate Status Protocol (OCSP) stapling is enabled
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: OCSP allows a user's browser or another user agent to verify the certificate it is seeing is not revoked. OCSP
    stapling ensures your server presents this information to the user's browser in a way that best meets the performance
    and security needs of your website. It polls the Certificate Authority's (CA) OCSP server at regular intervals to ensure
    it is continuously kept up to date. OCSP stapling helps improve performance and security, so it should be enabled.
  rationale: 'OCSP stapling protects your users from accessing a website where a private key is believed to be compromised.
    If a private key is compromised, an attacker may be able to obtain unauthorized access to the encrypted data transmitted
    by a user. Note: OCSP stapling, while a step forward from the older certificate revocation list model, does share similar
    risks. Between the time a certificate is revoked and the point where a new signed OCSP profile is requested, if a server''s
    certificate has been revoked a user agent may not be informed.'
  impact: ''
  references:
  - 1. https://www.digicert.com/ssl-support/nginx-enable-ocsp-stapling-on-server.htm
  page_start: 106
  audit_raw: 'Run the following command to verify OCSP stapling is enabled:

    grep -ir ssl_stapling /etc/nginx

    If the output does not contain your proxy or web server configuration file with the below

    two directives, this recommendation is not implemented.

    ssl_stapling on;

    ssl_stapling_verify on;'
  remediation: "Follow this procedure to enable OCSP validation:\nStep 1: Ensure your NGINX server has access to your CA's\
    \ OCSP server.\nYour CA's OCSP server may be found on your CA's website and will vary depending on\nyour CA vendor. Issue\
    \ the following command in order to check your connectivity to\ntheir site:\ncurl -I \"insert certificate authority ocsp\
    \ server here\"\nIf you get a 200 code response, your server has access.\nStep 2: Enable OCSP on nginx.\nImplement the\
    \ ssl_stapling and ssl_stapling_verify directives. The directive ssl_stapling\nenables OCSP stapling, and the directive\
    \ ssl_stapling_verify enables verification of the\nOCSP responses on nginx.\nserver {\n  ssl_stapling on;\n  ssl_stapling_verify\
    \ on;\n}"
  checks:
  - type: command
    command: grep -ir ssl_stapling /etc/nginx
    expected: ''
    severity: medium
    info: 'Run the following command to verify OCSP stapling is enabled:

      grep -ir ssl_stapling /etc/nginx

      If the output does not contain your proxy or web server configuration file with the below

      two directives, this recommendation is not implemented.

      ssl_stapling on;

      ssl_stapling_verify on;'
- id: 4.1.8
  title: Ensure HTTP Strict Transport Security (HSTS) is enabled
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: HTTP Strict Transport Security (HSTS) headers instruct a user agent on how to communicate with a web server.
    HSTS headers ensure the strict transport security policies built into browsers and other user agents are informed only
    to communicate over HTTPS. HSTS with long validity periods should be used to most effectively secure your user population.
    Strict-Transport-Security should have a long max-age, which is recommended to be at least six months in length. This ensures
    the browser remembers your website should only be accessible via HTTPS for this amount of time.
  rationale: HSTS headers help protect a server's users from accessing the server over unencrypted protocols. This header
    helps to prevent HTTP downgrade attacks.
  impact: ''
  references:
  - 1. https://www.globalsign.com/en/blog/what-is-hsts-and-how-do-i-use-it/
  - 2. https://mozilla.github.io/server-side-tls/ssl-config-generator/
  page_start: 108
  audit_raw: 'Issue this command to check for HSTS headers on your website:

    grep -ir Strict-Transport-Security /etc/nginx

    If your output does not include the following directive associated with your server

    configuration file, this recommendation is not implemented. The header should also

    include the max-age directive with 15768000 seconds (six months) or longer configured.

    add_header Strict-Transport-Security "max-age=15768000;" always;'
  remediation: "Ensure the below snippet of code can be found in your server configuration for your\nproxy or web server.\
    \ This will ensure the HSTS header is set with a validity period of six\nmonths, or 15768000 seconds.\nserver {\n  add_header\
    \ Strict-Transport-Security \"max-age=15768000;\" always;\n}"
  checks:
  - type: command
    command: grep -ir Strict-Transport-Security /etc/nginx
    expected: ''
    severity: medium
    info: 'Issue this command to check for HSTS headers on your website:

      grep -ir Strict-Transport-Security /etc/nginx

      If your output does not include the following directive associated with your server

      configuration file, this recommendation is not implemented. The header should also

      include the max-age directive with 15768000 seconds (six months) or longer configured.

      add_header Strict-Transport-Security "'
- id: 4.1.9
  title: Ensure upstream server traffic is authenticated with a client certificate
  scoring: scored
  profile:
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Client certificate validation allows the upstream server to authenticate the identity of the client connecting
