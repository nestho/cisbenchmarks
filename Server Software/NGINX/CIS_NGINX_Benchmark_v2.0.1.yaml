- id: 5.2.4
  title: Ensure the number of connections per IP address is limited
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: The maximum number of simultaneous connections allowed from a single IP address to your server should be limited.
    It should be set to a value that meets your organizational policies.
  rationale: Limiting the number of simultaneous connections is an effective way to prevent slow denial of service attacks
    that try to use as many server resources as possible. This can also help prevent brute force attacks on a login page.
  impact: Users of your system that are behind a corporate web proxy using network address translation or a proxy service
    such as tor may have an increased chance of being blocked due to this configuration. This is because multiple users in
    these scenarios come from the same IP address. You should always consider your user base when setting a connection limit.
  references:
  - 1. https://www.nginx.com/resources/library/complete-nginx-cookbook/
  - 2. http://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
  page_start: 135
  audit_raw: "Verify the HTTP block and server block contain the below configuration. You may also\nneed to check files included\
    \ in include statements within your nginx config.\nhttp {\n  limit_conn_zone $binary_remote_addr zone=limitperip:10m;\n\
    \  server {\n    limit_conn limitperip 10;\n  }\n}"
  remediation: "Implement the below directives under the HTTP and server blocks of your nginx\nconfiguration or any include\
    \ files. The below configuration creates a memory zone of 10\nmegabytes called limitperip. It will limit the number of\
    \ connections per IP address to 10\nsimultaneous connections. The number of simultaneous connections to allow may be\n\
    different depending on your organization's policies and use cases.\nhttp {\n  limit_conn_zone $binary_remote_addr zone=limitperip:10m;\n\
    \  server {\n    limit_conn limitperip 10;\n  }\n}"
  checks:
  - type: manual_review
    info: "Verify the HTTP block and server block contain the below configuration. You may also\nneed to check files included\
      \ in include statements within your nginx config.\nhttp {\n  limit_conn_zone $binary_remote_addr zone=limitperip:10m;\n\
      \  server {\n    limit_conn limitperip 10;\n  }\n}"
    severity: medium
- id: 5.2.5
  title: Ensure rate limits by IP address are set
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: Rate limiting should be enabled to limit the number of requests an IP address may make to a server in a given
    period of time. The configuration values should be set based on your application's needs and your organizational policy.
  rationale: Rate limiting allows you to mitigate potential denial of service attacks as a defense in depth mechanism.
  impact: If you serve a high traffic API, this may prevent users from being able to call your website. You may also limit
    users behind a corporate web proxy or a proxy service such as tor if they use your website heavily.
  references:
  - 1. https://scotthelme.co.uk/mitigating-http-get-dos-attack/
  - 2. https://www.nginx.com/blog/rate-limiting-nginx/
