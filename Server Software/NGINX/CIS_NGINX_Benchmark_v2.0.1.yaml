- id: 5.1.2
  title: Ensure only approved HTTP methods are allowed
  scoring: manual
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: HTTP methods (also known as verbs) allow different actions to be requested from the web server at a specified
    path. Only the necessary methods should be enabled.
  rationale: Most websites only require the methods GET, POST and HEAD to function correctly. Web applications may also require
    other verbs (e.g. DELETE). In order to narrow vectors of attack, it is recommended to only enable the required verbs.
  impact: ''
  references:
  - 1. https://www.acunetix.com/blog/articles/nginx-server-security-hardeningconfiguration-1/
  page_start: 126
  audit_raw: 'To verify this, use a tool like curl to send a request with each method which should not

    be supported (e.g. DELETE) and compare the output to a supported method (e.g. GET).

    # curl -X DELETE http://localhost/index.html

    curl: (52) Empty reply from server

    # curl -X GET http://localhost/index.html'
  remediation: "To remove unneeded methods and only allow required methods, add the following into\na server or location block\
    \ in your nginx.conf. The below snippet assumes only the\nmethods GET, HEAD and POST are required for an application.\
    \ The reason for 444 as\na response is because it contains no information and can help mitigate automated\nattacks.\n\
    if ($request_method !~ ^(GET|HEAD|POST)$) {\n   return 444;\n}"
  checks:
  - type: manual_review
    info: 'To verify this, use a tool like curl to send a request with each method which should not

      be supported (e.g. DELETE) and compare the output to a supported method (e.g. GET).

      # curl -X DELETE http://localhost/index.html

      curl: (52) Empty reply from server

      # curl -X GET http://localhost/index.html'
    severity: medium
- id: 5.2.1
  title: Ensure timeout values for reading the client header and body are set correctly
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The client_header_timeout and client_body_timeout directives define the time the server will wait for the header
    or body to be sent from the client. If the client does not send the entire header in this predefined timeframe, the server
    will send back a 408 request timeout error.
  rationale: Setting the client header and body timeouts help your server mitigate possible denial of service attacks. By
    timing out a request, the server is able to free up resources that may be waiting for the body or header.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/SCG_WS_nginx
  - 2. https://blog.qualys.com/securitylabs/2011/11/02/how-to-protect-against-slow-httpattacks
  page_start: 129
  audit_raw: 'To verify the current settings for the client_body_timeout and client_header_timeout

    directives, issue the below command. You should also manually check your nginx

    configuration for include statements that may be located outside of the /etc/nginx

    directory. If this is not present, the value is set at the default.

    grep -ir timeout /etc/nginx

    The output should contain the following:

    client_body_timeout   10;

    client_header_timeout 10;'
  remediation: 'Find the HTTP or server block of your nginx configuration and add the

    client_header_timeout and client_body_timeout directives set to the configuration. The

    below example sets the timeouts to 10 seconds.

    client_body_timeout   10;

    client_header_timeout 10;'
  checks:
  - type: command
