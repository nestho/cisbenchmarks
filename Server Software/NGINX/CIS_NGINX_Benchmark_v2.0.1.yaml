      \ your server block for the allow and deny\ndirectives. The output should look similar to the below snippet and may\
      \ be expressed in\nCIDR notation or single addresses.\nlocation / {\n    allow 10.1.1.1;\n    deny all;\n}\nStep 3:\
      \ Ensure the allowed IP addresses are not too permissive f"
