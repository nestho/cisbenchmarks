    \ in include statements within your nginx config.\nhttp {\n  limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;\n\
    \  server {\n    location / {\n      limit_req zone=ratelimit burst=10 nodelay;\n    }\n  }\n}"
  remediation: "Implement the below directives under the HTTP and server blocks of your nginx\nconfiguration or any include\
    \ files. The below configuration creates a memory zone of 10\nmegabytes called \"ratelimit\" and sets the number of requests\
