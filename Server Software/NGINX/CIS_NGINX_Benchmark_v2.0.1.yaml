- id: 5.3.4
  title: Ensure the Referrer Policy is enabled and configured properly
  scoring: manual
  profile:
  - Level 2 - Webserver
  description: When an origin site directs a user to another site, a referrer is sent that identifies the URL the user came
    from. Depending on your site's specific use, this may present a privacy concern to your users. The Referrer Policy enables
    organizations to define what sites should see that a referral came from your site, which helps protect user privacy.
  rationale: A Referrer header may expose sensitive data in another web server's log if you use sensitive data in your URL
    parameters, such as personal information, username, and password or persistent sessions. Ultimately, depending on your
    application design, not using a properly configured Referrer Policy may allow session hijacking, credential gathering,
    or sensitive data exposure in a third party's logs.
