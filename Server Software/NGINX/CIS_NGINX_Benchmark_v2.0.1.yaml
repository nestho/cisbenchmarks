benchmark:
  id: cis-nginx-benchmark
  title: CIS NGINX Benchmark
  version: 2.0.1
  technology: NGINX
  category: Server Software
  os: NGINX
  source_pdf: CIS_NGINX_Benchmark_v2.0.1.pdf
  total_pages: 158
  controls_count: 48
controls:
- id: 1.1.1
  title: Ensure NGINX is installed
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The CIS NGINX Benchmark recommends using the NGINX binary provided by your vendor for most situations. As an
    alternative, packages from nginx.org are available for a variety of platforms, including Linux and FreeBSD.
  rationale: 'The main benefits of using NGINX packages from your vendor are: • Ease of installation • Dependency resolution
    • Increased effectiveness of maintenance and security patches • Q&A procedures carried out by your vendor'
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/install.html
  - 2. http://nginx.org/en/linux_packages.html
  page_start: 16
  audit_raw: 'To check if nginx is installed on your server, run the following command:

    nginx -v

    The command output should return the version of nginx that is installed on the server. If

    there is no output, nginx is not installed.'
  remediation: '1. Configure and setup Nginx

    sudo su

    dnf update -y && dnf install dnf-utils -y

    cat << EOF > /etc/yum.repos.d/nginx.repo

    [nginx-stable]

    name=nginx stable repo

    baseurl=http://nginx.org/packages/rhel/8/\$basearch/

    gpgcheck=1

    enabled=1

    gpgkey=https://nginx.org/keys/nginx_signing.key

    module_hotfixes=true

    EOF

    dnf install nginx -y'
  checks:
  - type: manual_review
    info: 'To check if nginx is installed on your server, run the following command:

      nginx -v

      The command output should return the version of nginx that is installed on the server. If

      there is no output, nginx is not installed.'
    severity: medium
- id: 1.1.2
  title: Ensure NGINX is installed from source
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: Installing NGINX directly from source allows you to install NGINX without the use of a package manager.
  rationale: Installing NGINX from source allows you to harden your instance of NGINX by minimizing modules. NGINX is unable
    to remove modules when installed using a package manager. By installing from source, you are able to minimize modules,
    however, some additional configuration will be required and updates will not be automated out of the box for you.
  impact: By installing NGINX from source, you will have to manually upgrade NGINX or automate upgrades yourself. The default
    values for NGINX may also vary from this guide using this method.
  references:
  - 1. https://docs.nginx.com/nginx/admin-guide/installing-nginx/installing-nginx-opensource/
  page_start: 18
  audit_raw: 'To check if nginx is installed on your server, run the following command:

    nginx -v

    The command output should return the version of nginx that is installed on the server. If

    there is no output, nginx is not installed.'
  remediation: 'Installation depends on the operating system platform. For a source build, consult the

    NGINX documentation "Building nginx from Sources".'
  checks:
  - type: manual_review
    info: 'To check if nginx is installed on your server, run the following command:

      nginx -v

      The command output should return the version of nginx that is installed on the server. If

      there is no output, nginx is not installed.'
    severity: medium
- id: 1.2.1
  title: Ensure package manager repositories are properly configured
  scoring: manual
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Systems need to have package manager repositories properly configured to ensure they receive the latest patches
    and updates.
  rationale: If a system's package manager repositories are misconfigured, important patches may not be identified, or a rogue
    repository could introduce compromised software.
  impact: ''
  references:
  - 1. http://nginx.org/en/linux_packages.html
  page_start: 21
  audit_raw: 'To verify package manager repositories are configured correctly, run the following

    commands:

    Redhat:

    dnf repolist -v nginx-stable'
  remediation: 'Configure your package manager repositories according to your vendor.

    As an alternative, package manager repositories from nginx.org are available for a

    variety of Linux platforms.'
  checks:
  - type: manual_review
    info: 'To verify package manager repositories are configured correctly, run the following

      commands:

      Redhat:

      dnf repolist -v nginx-stable'
    severity: medium
- id: 1.2.2
  title: Ensure the latest software package is installed
  scoring: manual
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: As new security vulnerabilities are discovered, the corresponding fixes are implemented by your NGINX software
    package provider. Installing the latest software version ensures these fixes are available on your system.
  rationale: Up-to-date software provides the best possible protection against exploitation of security vulnerabilities, such
    as the execution of malicious code.
  impact: ''
  references:
  - 1. http://nginx.org/en/linux_packages.html
  page_start: 23
  audit_raw: 'To verify your NGINX package is up to date, run the following command:

    Redhat:

    dnf info nginx'
  remediation: 'To install the latest NGINX package, run the following command:

    Redhat:

    dnf update nginx -y'
  checks:
  - type: manual_review
    info: 'To verify your NGINX package is up to date, run the following command:

      Redhat:

      dnf info nginx'
    severity: medium
- id: 2.1.1
  title: Ensure only required modules are installed
  scoring: manual
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: This NGINX installation comes with several modules out of the box. These modules are not all always needed.
    Installations of NGINX should be hardened to ensure only the necessary modules are installed.
  rationale: Minimizing features and functionality built into NGINX can help to reduce the number of vulnerabilities your
    server has, which reduces the likelihood of a successful compromise by attackers.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  page_start: 27
  audit_raw: 'Audit the modules used in your current NGINX build by using the nginx verification

    command:

    nginx -V'
  remediation: 'Consult the NGINX module documentation to determine which modules are needed for

    your specific installation.

    Modules may be removed using the configure command.'
  checks:
  - type: manual_review
    info: 'Audit the modules used in your current NGINX build by using the nginx verification

      command:

      nginx -V'
    severity: medium
- id: 2.1.2
  title: Ensure HTTP WebDAV module is not installed
  scoring: scored
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: The http_dav_module enables HTTP Extensions for Web Distributed Authoring and Versioning (WebDAV) as defined
    by RFC 4918. This enables file-based operations on your web server, such as the ability to create, delete, change and
    move files on your server. Most modern architectures have replaced this functionality with cloud-based object storage,
    in which case the module should not be installed.
  rationale: WebDAV functionality opens up an unnecessary path for exploiting your web server. Through misconfigurations of
    WebDAV operations, an attacker may be able to access and manipulate files on the server.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  - 2. https://tools.ietf.org/html/rfc4918
  page_start: 29
  audit_raw: 'Run the following command to ensure the http_dav_module is not installed:

    nginx -V 2>&1 | grep http_dav_module

    Ensure the output of the command is empty.'
  remediation: To remove the http_dav_module, recompile nginx from source without the --withhttp_dav_module flag.
  checks:
  - type: command
    command: nginx -V 2>&1 | grep http_dav_module
    expected: ''
    severity: medium
    info: 'Run the following command to ensure the http_dav_module is not installed:

      nginx -V 2>&1 | grep http_dav_module

      Ensure the output of the command is empty.'
- id: 2.1.3
  title: Ensure modules with gzip functionality are disabled
  scoring: scored
  profile:
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: gzip is used for compression. Compression functionality should be disabled to prevent certain types of attacks
    from being performed successfully.
  rationale: Compression has been linked with the Breach attack and others. While the Breach attack has been mitigated with
    modern usages of the HTTP protocol, disabling the use of compression is considered a defense-in-depth strategy to mitigate
    other attacks.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  - 2. http://nginx.org/en/docs/configure.html
  page_start: 31
  audit_raw: 'Run the following command to ensure gzip modules are not installed:

    nginx -V 2>&1 | grep -E ''(http_gzip_module|http_gzip_static_module)''

    Ensure the output of the command is empty.'
  remediation: 'In order to disable the http_gzip_module and the http_gzip_static_module, NGINX must

    be recompiled from source. This can be accomplished using the below command in the

    folder you used during your original compilation. This must be done without the --withhttp_gzip_static_module or --with-http_gzip_module
    configuration directives.

    ./configure --without-http_gzip_module --without-http_gzip_static_module'
  checks:
  - type: command
    command: nginx -V 2>&1 | grep -E '(http_gzip_module|http_gzip_static_module)'
    expected: ''
    severity: medium
    info: 'Run the following command to ensure gzip modules are not installed:

      nginx -V 2>&1 | grep -E ''(http_gzip_module|http_gzip_static_module)''

      Ensure the output of the command is empty.'
- id: 2.1.4
  title: Ensure the autoindex module is disabled
  scoring: scored
  profile:
  - Level 1 - Webserver
  description: The autoindex module processes requests ending with the slash character. This feature enables directory listing,
    which could be useful in attacker reconnaissance, so it should be disabled.
  rationale: Automated directory listings may reveal information helpful to an attacker, such as naming conventions and directory
    paths. Directory listings may also reveal files that were not intended to be revealed.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/http/ngx_http_autoindex_module.html
  page_start: 33
  audit_raw: "To determine if the autoindex module is disabled, search the NGINX configuration files\n(nginx.conf and any\
    \ included configuration files) for autoindex directives:\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n  egrep\
    \ -i '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\nEnsure there are no autoindex on directives present."
  remediation: "Perform the following to disable the autoindex module:\n1. Search the NGINX configuration files (nginx.conf\
    \ and any included configuration\nfiles) to find autoindex directives.\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n\
    \  egrep -i '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\n2. Set the value for all autoindex directives to off, or remove\
    \ those directives."
  checks:
  - type: manual_review
    info: "To determine if the autoindex module is disabled, search the NGINX configuration files\n(nginx.conf and any included\
      \ configuration files) for autoindex directives:\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n  egrep -i\
      \ '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\nEnsure there are no autoindex on directives present."
    severity: medium
- id: 2.2.1
  title: Ensure that NGINX is run using a non-privileged, dedicated service account
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The nginx user directive designates which user account nginx worker processes run under. Ensuring a non-privileged,
    dedicated service account is used is a defense in depth measure to limit what an attacker who compromises the account
    can do.
  rationale: Running a web server under a non-privileged, dedicated service account helps mitigate the risk of lateral movement
    to other services or processes in the event the user account running the web services is compromised. The default user
    nobody is typically used for several processes, and if this is compromised, it could allow an attacker to have access
    to all processes running as that user.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/ngx_core_module.html#user
  page_start: 36
  audit_raw: 'Run the following to verify nginx is being run by a dedicated non-privileged user

    account:

    Step 1: Verify nginx is being run as a dedicated user:

    grep -Pi -- ''^\h*user\h+[^;\n\r]+\h*;.*$'' /etc/nginx/nginx.conf

    If a user directive similar to the below is not found, this is not a dedicated user. If a user

    is found similar to the output shown below, continue to step 2. If the user does not exist,

    a user will need to be added.

    user  nginx;

    Step 2: Verify the nginx dedicated user is not privileged:

    Run the below command, replacing nginx with any designated user you may have

    assigned:

    sudo -l -U nginx

    The output should look similar to the below if this user is not privileged:

    User nginx is not allowed to run sudo

    Step 3: Verify the nginx dedicated user is not part of any unexpected groups:

    Run the below command, replacing nginx with any designated user you may have

    assigned:

    groups nginx

    The output should look similar to the below if this user is not part of any other groups

    than the primary group:

    nginx : nginx'
  remediation: 'Add a system account for the nginx user with a home directory of /var/cache/nginx and

    a shell of /sbin/nologin so it does not have the ability to log in, then add the nginx user to

    be used by nginx:

    useradd nginx -r -g nginx -d /var/cache/nginx -s /sbin/nologin

    Then add the nginx user to /etc/nginx/nginx.conf by adding the user directive as shown

    below:

    user nginx;'
  checks:
  - type: command
    command: grep -Pi -- '^\h*user\h+[^;\n\r]+\h*;.*$' /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Run the following to verify nginx is being run by a dedicated non-privileged user

      account:

      Step 1: Verify nginx is being run as a dedicated user:

      grep -Pi -- ''^\h*user\h+[^;\n\r]+\h*;.*$'' /etc/nginx/nginx.conf

      If a user directive similar to the below is not found, this is not a dedicated user. If a user

      is found similar to the output shown below, continue to step 2. If the user does not exist,

      a u'
- id: 2.2.2
  title: Ensure the NGINX service account is locked
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: 'The nginx user account should have a valid password, but the account should be locked. NOTE: If a different
    account is used to run nginx, that account''s name should be substituted for nginx in the audit and remediation procedures.'
  rationale: As a defense-in-depth measure, the nginx user account should be locked to prevent logins and to prevent someone
    from switching users to nginx using the password. In general, there shouldn't be a need for anyone to have to su as nginx,
    and when there is a need, sudo should be used instead, which would not require the nginx account password.
  impact: This ensures the nginx user account may not be used by a human user.
  references: []
  page_start: 39
  audit_raw: 'Verify the nginx service account is locked by running this command:

    passwd -S "$(awk ''$1~/^\s*user\s*$/ {print $2}'' /etc/nginx/nginx.conf | sed -

    r ''s/;.*//g'')"

    The result should be similar to the following:

    nginx LK 2022-09-06 -1 -1 -1 -1 (Password locked.)'
  remediation: 'Use the passwd command to lock the nginx service account:

    passwd -l "$(awk ''$1~/^\s*user\s*$/ {print $2}'' /etc/nginx/nginx.conf | sed -

    r ''s/;.*//g'')"'
  checks:
  - type: manual_review
    info: 'Verify the nginx service account is locked by running this command:

      passwd -S "$(awk ''$1~/^\s*user\s*$/ {print $2}'' /etc/nginx/nginx.conf | sed -

      r ''s/;.*//g'')"

      The result should be similar to the following:

      nginx LK 2022-09-06 -1 -1 -1 -1 (Password locked.)'
    severity: medium
- id: 2.2.3
  title: Ensure the NGINX service account has an invalid shell
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The nginx account should not have the ability to log in, so the /sbin/nologin shell should be set for the account.
  rationale: The account used for nginx should only be used for the nginx service and does not need to have the ability to
    log in. This prevents an attacker who compromises the account to log in with it.
  impact: ''
  references: []
  page_start: 41
  audit_raw: "Run the following script to verify the nginx service account has an invalid shell:\n#!/usr/bin/env bash\n{\n\
    \   l_output=\"\" l_output2=\"\" l_out=\"\"\n   if [ -f /etc/nginx/nginx.conf ]; then\n      l_user=\"$(awk '$1~/^\\s*user\\\
    s*$/ {print $2}' /etc/nginx/nginx.conf |\nsed -r 's/;.*//g')\"\n      l_valid_shells=\"^($( sed -rn '/^\\//{s,/,\\\\\\\
    \\/,g;p}' /etc/shells | paste\n-s -d '|' - ))$\"\n      l_out=\"$(awk -v pat=\"$l_valid_shells\" -v ngusr=\"$l_user\"\
    \ -F: '($(NF) ~\npat && $1==ngusr) { $(NF-1) }' /etc/passwd)\"\n      if [ -z \"$l_out\" ]; then\n         l_output=\"\
    \ - NGINX user account: \\\"$l_user\\\" has an invalid shell\"\n      else\n         l_output2=\" - NGINX user account:\
    \ \\\"$l_user\\\" has a valid shell:\n\\\"$l_out\\\"\"\n      fi\n   else\n      l_output2=\" - NGINX user account can\
    \ not be determined.\\n - file:\n\\\"/etc/nginx/nginx.conf\\\" is missing\"\n   fi\n   if [ -z \"$l_output2\" ]; then\n\
    \      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n   else\n      echo -e \"\\n- Audit Result:\\n  **\
    \ FAIL **\\n - Reason(s) for audit\nfailure:\\n$l_output2\\n\"\n   fi\n}"
  remediation: 'Change the login shell for the nginx account to /sbin/nologin by using the following

    command:

    usermod -s /sbin/nologin nginx'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n   l_output=\"\" l_output2=\"\" l_out=\"\"\n   if [ -f /etc/nginx/nginx.conf ]; then\n\
      \      l_user=\"$(awk '$1~/^\\s*user\\s*$/ {print $2}' /etc/nginx/nginx.conf |\nsed -r 's/;.*//g')\"\n      l_valid_shells=\"\
      ^($( sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' /etc/shells | paste\n-s -d '|' - ))$\"\n      l_out=\"$(awk -v pat=\"$l_valid_shells\"\
      \ -v ngusr=\"$l_user\" -F: '($(NF) ~\npat && $1==ngusr) { $(NF-1) }' /etc/passwd)\"\n      if [ -z \"$l_out\" ]; then\n\
      \         l_output=\" - NGINX user account: \\\"$l_user\\\" has an invalid shell\"\n      else\n         l_output2=\"\
      \ - NGINX user account: \\\"$l_user\\\" has a valid shell:\n\\\"$l_out\\\"\"\n      fi\n   else\n      l_output2=\"\
      \ - NGINX user account can not be determined.\\n - file:\n\\\"/etc/nginx/nginx.conf\\\" is missing\"\n   fi\n   if [\
      \ -z \"$l_output2\" ]; then\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\n\"\n   else\n      echo\
      \ -e \"\\n- Audit Result:\\n  ** FAIL **\\n - Reason(s) for audit\nfailure:\\n$l_output2\\n\"\n   fi\n}"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: 2.3.1
  title: Ensure NGINX directories and files are owned by root
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The owner and group of the /etc/nginx directory and its files should be root.
  rationale: Setting ownership to only those users in the root group and the root user will reduce the likelihood of unauthorized
    modifications to the nginx configuration files.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Run the following command to verify the ownership of the nginx configuration files:

    stat /etc/nginx

    The output should show the ownership and group as root, similar to the output below:

    Access: (0755/drwxr-xr-x)  Uid: (    0/    root)   Gid: (    0/    root)'
  remediation: 'Run the following command to ensure ownership and group ownership is set to root:

    chown -R root:root /etc/nginx'
  checks:
  - type: command
    command: stat /etc/nginx
    expected: ''
    severity: medium
    info: 'Run the following command to verify the ownership of the nginx configuration files:

      stat /etc/nginx

      The output should show the ownership and group as root, similar to the output below:

      Access: (0755/drwxr-xr-x)  Uid: (    0/    root)   Gid: (    0/    root)'
- id: 2.3.2
  title: Ensure access to NGINX directories and files is restricted
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Permissions on the /etc/nginx directory should enforce the principle of least privilege.
  rationale: This ensures that only users who need access to configuration files are able to view them, thus preventing unauthorized
    access. Other users will need to use sudo in order to access these files.
  impact: ''
  references:
  - 1. https://dev-sec.io/baselines/nginx/
  page_start: 47
  audit_raw: 'To verify the nginx directory has other write permissions revoked, look at the

    permissions by running the below command:

    find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

    Verify The output directories are mode 755 or more restrictive:

    Example

    /etc/nginx 755

    To verify the nginx configuration files have other read, write and execute permissions

    revoked, look at the permissions by running the below command:

    find /etc/nginx -type f -exec stat -Lc "%n %a" {} +

    Verify The output files are mode 660 or more restrictive:

    Example:

    /etc/nginx/nginx.conf 660'
  remediation: 'Permissions are set with the ability to read as other by default on all configuration files: -

    rw-r--r--

    Permissions are set with the ability to read and execute as other by default on all

    directories: drwxr-xr-x

    To set permissions to least privilege on the nginx configuration files, issue these

    commands:

    find /etc/nginx -type d -exec chmod go-w {} +

    find /etc/nginx -type f -exec chmod ug-x,o-rwx {} +'
  checks:
  - type: command
    command: find /etc/nginx -type d -exec stat -Lc "%n %a" {} + && find /etc/nginx -type f -exec stat -Lc "%n %a" {} +
    expected: ''
    severity: medium
    info: 'To verify the nginx directory has other write permissions revoked, look at the

      permissions by running the below command:

      find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

      Verify The output directories are mode 755 or more restrictive:

      Example

      /etc/nginx 755

      To verify the nginx configuration files have other read, write and execute permissions

      revoked, look at the permissions by running the below'
- id: 2.3.3
  title: Ensure the NGINX process ID (PID) file is secured
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The PID file stores the main process ID of the nginx process. This file should be protected from unauthorized
    modification.
  rationale: The PID file should be owned by root and the group root. It should also be readable to everyone, but only writable
    by root (permissions 644). This will prevent unauthorized modification of the PID file, which could cause a denial of
    service.
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Run this command to verify the ownership and permissions of the nginx PID file:

    stat -L -c "%U:%G"  /var/run/nginx.pid && stat -L -c "%a" /var/run/nginx.pid

    The output should show that the PID file is owned by root and has the group root and

    that the permissions are 644 as shown below:

    root:root

    644'
  remediation: 'If the PID file is not owned by root, issue this command:

    chown root:root /var/run/nginx.pid

    If the PID file has permissions greater than 644, issue this command:

    chmod u-x,go-wx /var/run/nginx.pid'
  checks:
  - type: command
    command: stat -L -c "%U:%G"  /var/run/nginx.pid && stat -L -c "%a" /var/run/nginx.pid
    expected: ''
    severity: medium
    info: 'Run this command to verify the ownership and permissions of the nginx PID file:

      stat -L -c "%U:%G"  /var/run/nginx.pid && stat -L -c "%a" /var/run/nginx.pid

      The output should show that the PID file is owned by root and has the group root and

      that the permissions are 644 as shown below:

      root:root

      644'
- id: 2.3.4
  title: Ensure the core dump directory is secured
  scoring: manual
  profile:
  - Level 1 - Webserver
  description: Core dumps are snapshots of memory. The working_directory directive is used to specify the directory NGINX
    attempts to create core dumps in. Core dumps will be disabled if the directory is not writable by the NGINX user. It is
    recommended that the working_directory directive be set to a directory that is owned by the root user and the group the
    NGINX process executes as, and is inaccessible to other users. Usually, production systems should not have this enabled.
  rationale: Core dumps may contain sensitive information that should not be accessible by other accounts on the system.
  impact: ''
  references:
  - 1. https://www.nginx.com/resources/wiki/start/topics/tutorials/debugging/#coredump
  page_start: 51
  audit_raw: 'Run the following procedure to verify the core dump configuration is secured:

    Step 1: Check to see if the working_directory directive is configured:

    grep working_directory /etc/nginx/nginx.conf

    Step 2: If the working_directory directive is enabled, it needs to meet the following

    requirements:

    1. It is not within the NGINX web document root.

    2. It is owned by root and has a group ownership of the NGINX group.

    3. It has no read-write-search access permission for other users (e.g. o=rwx).'
  remediation: 'Either remove the working_directory directive from the NGINX configuration files or

    ensure that the configured directory meets the following requirements:

    1. It is not within the NGINX web document root.

    2. It is owned by root and has a group ownership of the NGINX group:

    chown root:nginx /var/log/nginx

    3. It has no read-write-search access permission for other users:

    chmod o-rwx /var/log/nginx'
  checks:
  - type: command
    command: grep working_directory /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Run the following procedure to verify the core dump configuration is secured:

      Step 1: Check to see if the working_directory directive is configured:

      grep working_directory /etc/nginx/nginx.conf

      Step 2: If the working_directory directive is enabled, it needs to meet the following

      requirements:

      1. It is not within the NGINX web document root.

      2. It is owned by root and has a group ownership of the N'
- id: 2.4.1
  title: Ensure NGINX only listens for network connections on authorized ports
  scoring: manual
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: NGINX can be configured to listen on any port, but it should be configured to listen on authorized ports only.
  rationale: Limiting the listening ports to only those that are authorized helps to ensure no unauthorized services are running
    through the use of NGINX.
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'Use this command to audit all listening ports on the server:

    grep -ir "listen[^;]*;"  /etc/nginx

    The ports being used should immediately follow the listen directive in the output. Ensure

    all ports that are actively listening and not commented out are authorized for use on the

    server. The output should look similar to this example:

    /etc/nginx/nginx.conf.rpmsave:    listen       80;

    /etc/nginx/nginx.conf.rpmsave:    listen 443 ssl http2;

    /etc/nginx/conf.d/default.conf:    listen       80;

    Any files included in the include directive of the nginx configuration file or the nginx

    configuration file itself should be checked.

    To check which files are included in the nginx configuration file run the following

    command:

    grep include  /etc/nginx/nginx.conf

    The output below shows that any file matching the pattern /etc/nginx/conf.d/*.conf/

    in the above audit check should be considered an auditable port.'
  remediation: 'If any ports are listening that are not authorized, comment out or delete the associated

    configuration for that listener.'
  checks:
  - type: command
    command: grep -ir "listen[^;]*;"  /etc/nginx && grep include  /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Use this command to audit all listening ports on the server:

      grep -ir "listen[^;]*;"  /etc/nginx

      The ports being used should immediately follow the listen directive in the output. Ensure

      all ports that are actively listening and not commented out are authorized for use on the

      server. The output should look similar to this example:

      /etc/nginx/nginx.conf.rpmsave:    listen       80;

      /etc/nginx/nginx'
- id: 2.4.2
  title: Ensure requests for unknown host names are rejected
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Your host header should be part of a predefined allowlist of known good hosts, which enables blocking access
    to other hosts. You should treat the host header as another input to be validated, as it is defined by the user agent.
  rationale: Allowlisting specific hosts and blocking access to all other hosts, you help to mitigate host header injection
    attacks against your server. Such attacks could be used by an attacker to redirect you to a rogue host and execute scripts
    or get you to input credentials.
  impact: If you are in an environment such as the cloud, you should not put an IP address or default hostname as your server_name
    because these addresses are often ephemeral in nature. Additionally, you will be blocked from accessing your site if you
    use a means of access that does not directly reference names in the server_name directive. You should reserve a DNS name
    to use for implementing this recommendation.
  references:
  - 1. https://www.acunetix.com/blog/articles/automated-detection-of-host-headerattacks/
  - 2. https://hackerone.com/reports/94637
  page_start: 56
  audit_raw: 'Run the following comment to verify this is configured:

    curl -k -v https://127.0.0.1 -H ''Host: invalid.host.com''

    If you do not receive a 400 series response, this recommendation is not implemented.'
  remediation: "Ensure your first server block mirrors the below in your nginx configuration, either at\n/etc/nginx/nginx.conf\
    \ or any included file within your nginx config:\nserver {\n    return 404;\n}\nThen investigate each server block to\
    \ ensure the server_name directive is explicitly\ndefined. Each server block should look similar to the below with the\
    \ defined hostname\nof the associated server block in the server_name directive. For example, if your server\nis cisecurity.org,\
    \ the configuration should look like the below example:\nserver {\n    listen       443;\n    server_name  cisecurity.org;\n\
    }"
  checks:
  - type: manual_review
    info: 'Run the following comment to verify this is configured:

      curl -k -v https://127.0.0.1 -H ''Host: invalid.host.com''

      If you do not receive a 400 series response, this recommendation is not implemented.'
    severity: medium
- id: 2.4.3
  title: Ensure keepalive_timeout is 10 seconds or less, but not 0
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: Persistent connections are leveraged by all modern browsers to facilitate greater web performance. The keep-alive
    timeout limits the time a persistent connection may remain open. Setting the keep-alive timeout allows this timeout to
    be controlled on the server side.
  rationale: Setting a keep-alive timeout on the server side helps mitigate denial of service attacks that establish too many
    persistent connections, exhausting server resources.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
  page_start: 58
  audit_raw: 'To check the current setting for the keepalive_timeout directive, issue the below

    command. You should also manually check your nginx configuration for include

    statements that may be located outside the /etc/nginx directory. If none of these are

    present, the value is set at the default.

    grep -ir keepalive_timeout /etc/nginx

    The output of the command should contain something similar to the following:

    keepalive_timeout 10;'
  remediation: 'Find the HTTP or server block of your nginx configuration, and add the

    keepalive_timeout directive. Set it to 10 seconds or less, but not 0. This example

    command sets it to 10 seconds:

    keepalive_timeout 10;'
  checks:
  - type: command
    command: grep -ir keepalive_timeout /etc/nginx
    expected: ''
    severity: medium
    info: 'To check the current setting for the keepalive_timeout directive, issue the below

      command. You should also manually check your nginx configuration for include

      statements that may be located outside the /etc/nginx directory. If none of these are

      present, the value is set at the default.

      grep -ir keepalive_timeout /etc/nginx

      The output of the command should contain something similar to the following'
- id: 2.4.4
  title: Ensure send_timeout is set to 10 seconds or less, but not 0
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The send_timeout directive sets a timeout for transmitting a response to the client between two successive
    write operations.
  rationale: Setting the send_timeout directive on the server side helps mitigate slow HTTP denial of service attacks by ensuring
    write operations taking up large amounts of time are closed.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/SCG_WS_nginx
  - 2. http://nginx.org/en/docs/http/ngx_http_core_module.html#send_timeout
  page_start: 60
  audit_raw: 'To check the current setting for the send_timeout directive, issue the below command.

    You should also manually check your nginx configuration for include statements that

    may be located outside the /etc/nginx directory. If none of these are present, the value

    is set at the default.

    grep -ir send_timeout /etc/nginx

    The output of the command should be similar to the following:

    send_timeout  10;'
  remediation: 'Find the HTTP or server block of your nginx configuration, and add the send_timeout

    directive. Set it to 10 seconds or less, but not 0.

    send_timeout   10;'
  checks:
  - type: command
    command: grep -ir send_timeout /etc/nginx
    expected: ''
    severity: medium
    info: 'To check the current setting for the send_timeout directive, issue the below command.

      You should also manually check your nginx configuration for include statements that

      may be located outside the /etc/nginx directory. If none of these are present, the value

      is set at the default.

      grep -ir send_timeout /etc/nginx

      The output of the command should be similar to the following:

      send_timeout  10;'
- id: 2.5.1
  title: Ensure server_tokens directive is set to `off`
  scoring: scored
  profile:
  - Level 1 - Webserver
  description: The server_tokens directive is responsible for displaying the NGINX version number and operating system version
    on error pages and in the Server HTTP response header field. This information should not be displayed.
  rationale: Attackers can conduct reconnaissance on a website using these response headers, then target attacks for specific
    known vulnerabilities associated with the underlying technologies. Hiding the version will slow down and deter some potential
    attackers.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'In the NGINX configuration file nginx.conf, verify the server_tokens directive is set to

    off. To do this, check the response headers for the server header by issuing this

    command:

    curl -I 127.0.0.1 | grep -i server

    The output should not contain the server header providing your server version, such as

    the below:

    Server: nginx/1.22.0'
  remediation: "To disable the server_tokens directive, set it to off inside of every server block in your\nnginx.conf or\
    \ in the http block:\nserver {\n    ...\n    server_tokens        off;\n    ...\n}"
  checks:
  - type: command
    command: curl -I 127.0.0.1 | grep -i server
    expected: ''
    severity: medium
    info: 'In the NGINX configuration file nginx.conf, verify the server_tokens directive is set to

      off. To do this, check the response headers for the server header by issuing this

      command:

      curl -I 127.0.0.1 | grep -i server

      The output should not contain the server header providing your server version, such as

      the below:

      Server: nginx/1.22.0'
- id: 2.5.2
  title: Ensure default error and index.html pages do not reference NGINX
  scoring: scored
  profile:
  - Level 1 - Webserver
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  description: The default error and index.html pages for NGINX reveal that the server is NGINX. These default pages should
    be removed or modified so they do not advertise the underlying infrastructure of the server.
  rationale: By gathering information about the server, attackers can target attacks against its known vulnerabilities. Removing
    pages that disclose the server runs NGINX helps reduce targeted attacks on the server.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'Locate the error page and index directives in the location block of your server

    configuration. The default index and error pages in nginx are located at

    /usr/share/nginx/html/. Open these files and verify there are no references to NGINX.

    Issue the following commands to check the default pages and verify no results are

    returned:

    grep -i nginx /usr/share/nginx/html/index.html

    grep -i nginx /usr/share/nginx/html/50x.html'
  remediation: 'Edit /usr/share/nginx/html/index.html and usr/share/nginx/html/50x.html and

    remove any lines that reference NGINX.'
  checks:
  - type: command
    command: grep -i nginx /usr/share/nginx/html/index.html && grep -i nginx /usr/share/nginx/html/50x.html
    expected: ''
    severity: medium
    info: 'Locate the error page and index directives in the location block of your server

      configuration. The default index and error pages in nginx are located at

      /usr/share/nginx/html/. Open these files and verify there are no references to NGINX.

      Issue the following commands to check the default pages and verify no results are

      returned:

      grep -i nginx /usr/share/nginx/html/index.html

      grep -i nginx /usr/sha'
- id: 2.5.3
  title: Ensure hidden file serving is disabled
  scoring: manual
  profile:
  - Level 2 - Webserver
  description: Disabling hidden files is a defense-in-depth mechanism to help prevent accidentally exposing sensitive information.
  rationale: Disabling hidden files prevents an attacker from being able to reference a hidden file that may be put in your
    location and have sensitive information, like .git files.
  impact: 'This may break well-known hidden files that are needed for functionality. For example, it may prevent functionality
    used by LetsEncrypt. To enable, configure a location exception like that shown below: location ~ /\.well-known\/acme-challenge
    { allow all; }'
  references:
  - 1. https://programming-review.com/nginx-disable-access-to-htaccess-file/
  page_start: 67
  audit_raw: 'To verify hidden files are disabled, open your nginx configuration file and search for the

    below string or another regex pattern that denies access to files with a dot as the first

    character in the file path.

    Run the following command:

    grep location /etc/nginx/nginx.conf

    Verify the output is:

    location ~ /\.  { deny all; return 404; }'
  remediation: 'Edit the nginx.conf file and add the following line:

    location ~ /\.  { deny all; return 404; }'
  checks:
  - type: command
    command: grep location /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'To verify hidden files are disabled, open your nginx configuration file and search for the

      below string or another regex pattern that denies access to files with a dot as the first

      character in the file path.

      Run the following command:

      grep location /etc/nginx/nginx.conf

      Verify the output is:

      location ~ /\.  { deny all; return 404; }'
- id: 2.5.4
  title: Ensure the NGINX reverse proxy does not enable information disclosure
  scoring: scored
  profile:
  - Level 1 - Proxy
  - Level 1 - Loadbalancer
  - Level 1 - Webserver
  - Level 2 - Webserver
  - Level 2 - Proxy
  - Level 2 - Loadbalancer
  description: 'The server and x-powered-by header may specify the underlying technology used by an application. The NGINX
    reverse proxy may pass these headers if not explicitly directed to remove them. System logging should be configured to
    meet your organizational security and privacy policies. Enabling detailed logging to include information about events,
    event sources, timestamps, and users may assist in incident response activities. NOTE: Aim to keep sensitive information
    out of logs. For example, keep sensitive information out of query strings and URIs to avoid this. The access_log directive
    should be on for every core site. It is enabled by default. All errors for applications should be logged. Log rotation
    ensures log files do not consume excessive disk space, potentially causing a denial of service. Centralized log management
    helps ensure logs are forensically sound and are available at a central location for auditing and incident investigation.
    Centralized log management helps ensure logs are forensically sound and are available at a central location for auditing
    and incident investigation. The x-forwarded-for and remote address headers help identify and separate the originating
    client IP address of the user agent and the proxy IP address. The two types of addresses are the same, and one should
    always be present.'
  rationale: 'Attackers can conduct reconnaissance on a website using these response headers, then target attacks for specific
    known vulnerabilities associated with the underlying technologies. Removing these headers will reduce the likelihood of
    targeted attacks. Performing detailed logging ensures that incident responders, auditors, and others are able to clearly
    view the activity that has occurred on your server. CIS control 8.5: “Collect Detailed Audit Logs” recommends that you
    configure detailed audit logging for enterprise assets containing sensitive data. It further recommends you include event
    source, date, username, timestamp, source addresses, destination addresses, and other useful elements that could assist
    in a forensic investigation. Access logging allows incident responders and auditors to investigate access to a system
    in the event of an incident. Error logging can be useful in identifying an attacker attempting to exploit a system and
    recreating an attacker''s steps. Error logging also helps with identifying possible issues with an application. Log files
    are important to track activity that occurs on your server, but they take up significant amounts of space. Log rotation
    should be configured in order to ensure the logs do not consume so much disk space that logging becomes unavailable. A
    centralized logging solution aggregates logs from multiple systems to ensure logs can be referenced in the event systems
    are thought to be compromised. Centralized log servers are also often used to correlate logs for potential patterns of
    attack. If a centralized logging solution is not used and systems (and their logs) are believed to be compromised, then
    logs may not be permitted to be used as evidence. A centralized logging solution aggregates logs from multiple systems
    to ensure logs can be referenced in the event systems are thought to be compromised. Centralized log servers are also
    often used to correlate logs for potential patterns of attack. If a centralized logging solution is not used and systems
    (and their logs) are believed to be compromised, then logs may not be permitted to be used as evidence. Being able to
    identify the originating client IP address can help auditors or incident responders identify where the corresponding user
    came from. This may be useful in the event of an attack to analyze if the IP address is a good candidate for blocking.
    It may also be useful to correlate an attacker''s actions.'
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/http/ngx_http_proxy_module.html
  - 1. http://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
  - 2. http://nginx.org/en/docs/varindex.html
  - 1. http://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
  - 1. http://nginx.org/en/docs/syslog.html
  - 1. http://nginx.org/en/docs/syslog.html
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Forwarded-For
  - 2. http://nginx.org/en/docs/http/ngx_http_proxy_module.html
  page_start: 69
  audit_raw: "Confirm that the headers are denied as part of the location block of the nginx\nconfiguration. You may also\
    \ have to check included files as part of this configuration.\nRun this command:\ngrep proxy_hide_header /etc/nginx/nginx.conf\n\
    The output should read:\nproxy_hide_header X-Powered-By;\nproxy_hide_header Server;\nVerify your log format meets your\
    \ organizational security and privacy policies. All\nnecessary logging variables should contain descriptive definitions\
    \ at\n/etc/nginx/nginx.conf.\nEdit the log format directive in /etc/nginx/nginx.conf so it logs everything needed to meet\n\
    your organizational policies.\nThe final format should resemble something like the below example:\n   log_format  main\
    \   'Event Source Information - Server Name: \"$server_name\"\nServer Protocol: \"$server_protocol\" Hostname: \"$hostname\"\
    \ Host: \"$host\" '\n                      'Date and Timestamp Information - Local Time:\n\"$time_local\" ISO8601 Time:\
    \ \"$time_iso8601\" '\n                      'Username Information -  Basic Authentication User:\n\"$remote_user\" '\n\
    \                      'Source Address Information - Source Address:Port:\n\"$remote_addr:$remote_port\" '\n         \
    \             'Destination Address Information - Desination\nAddress:Port \"$server_addr:$server_port \" '\n         \
    \             'Request Information - Request: \"$request\" HTTP\nResponse Status: \"$status\" Referer: \"$http_referer\"\
    \ Content Type:\n\"$content_type\" Body Bytes Sent: \"$body_bytes_sent\" User Agent:\n\"$http_user_agent\" ';\nThe following\
    \ variables may be considered as useful examples to include in your\nlog_format with descriptive logging. You should consult\
    \ the NGINX documentation and\nyour organizational policy to ensure you are logging sufficient information and removing\n\
    sensitive information where needed. The NGINX documentation on supported log\nvariables may be found here: http://nginx.org/en/docs/varindex.html\n\
    Please review the NGINX documentation for log variables to include in your logs in\nalignment with your use case and logging\
    \ policy. Below are some relevant log variables\nto help focus your review:\nEvent Source Variables: The event source\
    \ is the name of the software that logs the\nevent. It may frequently be the name of the application or application component\
    \ that\nreceives the request.\n$server_name  - Logs the name of the server which accepted a request\n$server_protocol\
    \ - Logs the request protocol, usually “HTTP/1.0”, “HTTP/1.1”,\nor “HTTP/2.0”\n$hostname -  Logs the hostname\n$host -\
    \ Logs the host name from the request line, or host name from the\n“Host” request header field, or the server name matching\
    \ a request in that\norder of precedence.\nDate & Timestamp Variables: The date and timestamp of the HTTP request used\
    \ for\nforensic investigations.\n$time_local - Logs the local time in the Common Log Format.\n$time_iso8601 - Logs the\
    \ local time in the ISO 8601 standard format.\nUsername Variables:\n$remote_user - Logs the user name supplied with basic\
    \ authentication if basic\nauthentication is used by NGINX. Nothing will be logged if the request is not\npart of an application\
    \ using basic authentication with NGINX.\nSource Address Variables: Identify the source of the HTTP request\n$remote_addr\
    \ - Logs the client IP address of the HTTP request\n$remote_port - Logs the client port used in the HTTP requests\nDestination\
    \ Address Variables: Identify the destination of the HTTP request.\n$server_addr - Logs an address of the server which\
    \ accepted a request\n$server_port - Logs the port of the server which accepted a request\nOther useful elements that\
    \ could assist in a forensic investigation:\n$request - Logs an address of the server which accepted a request, which\
    \ may\nbe useful in forensic investigations\n$status - Logs the response status code of the HTTP request, which may be\n\
    useful in forensic investigations\n$http_referer - Logs the response status code of the HTTP request, which may\nbe useful\
    \ in forensic investigations\n$http_user_agent  - Logs the user agent of the client behind the request,\nwhich may be\
    \ useful in forensic investigations\n$pid - Logs the process ID of the worker process of NGINX.\nRun the following to\
    \ verify access logging is enabled:\ngrep -ir access_log /etc/nginx\nThe output should show an access log configured and\
    \ not disabled.\nIf the output is similar to the below, the nginx configuration file should be manually\ninspected to\
    \ ensure you are logging access to all core sites and proxies.\naccess_log off;\nRun the following to verify the error\
    \ logging configuration in /etc/nginx/nginx.conf:\ngrep error_log /etc/nginx/nginx.conf\nIf there is no output, the output\
    \ is commented out, or the logging level is set to anything\nother than info, this recommendation is not implemented.\n\
    Run the below commands to verify the log rotation configuration. They should show that\nlog compression occurs weekly\
    \ and log rotation occurs every 13 weeks.\ncat /etc/logrotate.d/nginx | grep weekly\ncat /etc/logrotate.d/nginx | grep\
    \ rotate\nUse this command to verify your server is configured for central logging:\ngrep -ir syslog /etc/nginx\nThe output\
    \ should show the error logs being sent to a central server, similar to the\noutput of the command below. 192.168.2.1\
    \ should be replaced with your central log\nserver, and the logging level should be set to info.\nerror_log syslog:server=192.168.2.1\
    \ info;\nUse this command to verify your server is configured for central logging:\ngrep -ir syslog /etc/nginx\nThe output\
    \ should show the access logs being sent to a central server, similar to the\noutput of the command below. 192.168.2.1\
    \ should be replaced with your central log\nserver. The local logging facility may be any unconfigured facility on your\
    \ server.\naccess_log syslog:server=192.168.2.1,facility=local7,tag=nginx,severity=info\ncombined;\nOpen the nginx configuration\
    \ file and the associated included files in that configuration.\nCheck all location blocks for the presence of the proxy_pass\
    \ directive. The proxy_pass\ndirective should be followed by one of the below two directives to ensure the client IP\n\
    address is passed to the endpoint the proxy is serving traffic to.\nproxy_set_header X-Real-IP $remote_addr;\nproxy_set_header\
    \ X-Forwarded-For $proxy_add_x_forwarded_for;"
  remediation: "Implement the below directives as part of your location block. Edit\n/etc/nginx/nginx.conf and add the following:\n\
    location /docs {\nproxy_hide_header X-Powered-By;\nproxy_hide_header Server;\n}\nEdit the log format directive in /etc/nginx/nginx.conf\
    \ so it logs everything needed to meet\nyour organizational policies.\nEnsure the access_log directive is configured for\
    \ every core site your organization\nrequires logging for.\nThis should look similar to the below configuration snippet.\
    \ You may use different log\nfile locations based on your needs.\naccess_log  /var/log/nginx/host.access.log  main;\n\
    Edit /etc/nginx/nginx.conf so the error_log directive is present and not commented out.\nThe error_log should be configured\
    \ to the logging location of your choice. The\nconfiguration should look similar to the below:\nerror_log  /var/log/nginx/error_log.log\
    \  info;\nFollow the below procedure to change the default configuration to the recommended log\nrotation configuration.\
    \ You may need to manually edit or change the below command if\nthe configuration is not the default.\nTo change log compression\
    \ from daily to weekly:\nsed -i \"s/daily/weekly/\" /etc/logrotate.d/nginx\nTo change log rotation from every year to\
    \ every 13 weeks:\nsed -i \"s/rotate 52/rotate 13/\" /etc/logrotate.d/nginx\nTo enable central logging for your error\
