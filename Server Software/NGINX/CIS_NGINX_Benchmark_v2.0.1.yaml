    \ that requests may come more frequently and sets no delay to ensure that the\nbursting may be all at once and not queued.\n\
    http {\n  limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;\n  server {\n    location / {\n      limit_req\
    \ zone=ratelimit burst=10 nodelay;\n    }\n  }\n}"
