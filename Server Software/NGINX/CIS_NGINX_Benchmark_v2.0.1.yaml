    \ about your private key:\nCountry Name (2 letter code) [XX]: Your Country\nState or Province Name (full name) []: Your\
    \ State\nLocality Name (eg, city) [Default City]: Your City\nOrganization Name (eg, company) [Default Company Ltd]: Your\
    \ City\nOrganizational Unit Name (eg, section) []: Your Organizational Unit\nCommon Name (eg, your name or your server's\
    \ hostname) []: Your server's DNS\nname\nEmail Address []: Your email address\nStep 2: Obtain a signed certificate from\
    \ your certificate authority.\nProvide your chosen certificate authority with your certificate signing request. Follow\n\
    your certificate authority's signing procedures in order to obtain a certificate and the\ncertificate's trust chain. A\
    \ full trust chain is typically delivered in .pem format.\nStep 3: Install certificate and signing certificate chain on\
    \ your web server.\nPlace the .pem file from your certificate authority into the directory of your choice.\nLocate your\
    \ created key file from the command you used to generate your certificate\nsigning request. Open your website configuration\
    \ file and edit your encrypted listener to\nleverage the ssl_certificate and ssl_certificate_key directives for a web\
    \ server as shown\nbelow. You should also inspect include files inside your nginx.conf. This should be part\nof the server\
    \ block.\nserver {\n    listen 443 ssl http2;\n    listen [::]:443 ssl http2;\n    ssl_certificate /etc/nginx/cert.crt;\n\
    \    ssl_certificate_key /etc/nginx/nginx.key;\n    ...\n    }\nAfter editing this file, you must recycle nginx services\
    \ for these changes to take effect.\nThis can be done with the following command:\nsudo systemctl restart nginx"
  checks:
