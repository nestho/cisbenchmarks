  - Level 1
  - Level 1
  description: Custom Diffie-Hellman (DH) key exchange parameters should be used. DH Ephemeral (DHE) parameters with at least
    2048 bits should be generated.
  rationale: Backward-compatible Perfect Forward Secrecy (PFS) ciphers (e.g. DHE-RSA-AES128SHA256) should use strong and unique
    parameters. By default, NGINX will generate 1024bit RSA keys for PFS ciphers; stronger alternatives should be used instead
