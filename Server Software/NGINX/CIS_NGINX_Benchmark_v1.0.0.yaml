- id: 4.1.4
  title: Ensure only modern TLS protocols are used
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Only modern TLS protocols should be enabled in NGINX for all client connections and upstream connections. Removing
    legacy TLS and SSL protocols (SSL 3.0, TLS 1.0 and 1.1), and enabling emerging and stable TLS protocols (TLS 1.2), ensures
    users are able to take advantage of strong security capabilities and protects them from insecure legacy protocols.
  rationale: 'Why disable SSL 3.0: The POODLE Vulnerability allowed attackers to exploit SSL 3.0 to obtain cleartext information
    by exploiting weaknesses in CBC in 2014. SSL 3.0 is also no longer FIPS 140-2 compliant. Why disable TLS 1.0: TLS 1.0
    was deprecated from use when PCI DSS Compliance mandated that it not be used for any applications processing credit card
    numbers in June 2018. TLS 1.0 does not make use of modern protections, and almost all user agents that do not support
    TLS 1.2 or higher are no longer supported by their vendor. Why disable TLS 1.1: Because of the increased security associated
    with higher versions of TLS, TLS 1.0 should be disabled. Modern browsers will begin to flag TLS 1.1 as deprecated in early
    2019. Why enable TLS 1.2: TLS 1.2 takes advantage of several security features including modern cipher suites, perfect
    forward security, and authenticated encryption.'
  impact: Disabling certain TLS may not allow legacy user agents to connect to your server. Disabling negotiation of specific
    protocols with your backend server may also limit your ability to connect with legacy servers. You should always consider
    if you need to support legacy user agents or servers when selecting your TLS protocols. 79 | P a g e
  references:
  - 1. https://webkit.org/blog/8462/deprecation-of-legacy-tls-1-0-and-1-1-versions/
  - 2. https://www.cloudflare.com/learning-resources/tls-1-3/
  page_start: 78
  audit_raw: 'You can verify which SSL/TLS protocols your server uses by issuing the below command to

    see the configured cipher suites on the server. If anything older than TLS 1.2 is

    implemented or nothing appears, this recommendation is not implemented.

    grep -ir ssl_protocol /etc/nginx

    78 | P a g e

    Note: Depending on your configuration, you may see different results. The directive

    ssl_protocols should always be part of your server block. If your NGINX server is also a

    proxy or load balancer, you should also check for the presence of the proxy_ssl_protocols

    directive as part of the location block of your nginx configuration. This ensures your proxy

    follows a specific set of negotiation rules for encrypting traffic with your upstream server.'
  remediation: "Run the following commands to change your ssl_protocols if they are already configured.\nThis remediation\
    \ advice assumes your nginx configuration file does not include server\nconfiguration outside of /etc/nginx/nginx.conf.\
    \ You may have to also inspect the include\nfiles in your nginx.conf to ensure this is properly implemented.\nWeb Server:\n\
    sed -i \"s/ssl_protocols[^;]*;/ssl_protocols TLSv1.2;/\" /etc/nginx/nginx.conf\nProxy:\nsed -i \"s/proxy_ssl_protocols[^;]*;/proxy_ssl_protocols\
    \ TLSv1.2;/\"\n/etc/nginx/nginx.conf\nIf your ssl_protocols are not already configured, this can be accomplished manually\
    \ by\nopening your web server or proxy server configuration file and manually adding the\ndirectives.\nWeb Server:\nserver\
    \ {\n    ssl_protocols TLSv1.2;\n}\nProxy:\nlocation / {\n      proxy_pass cisecurity.org;\n      proxy_ssl_protocols\
    \ TLSv1.2;\n    }"
  checks:
  - type: command
    command: grep -ir ssl_protocol /etc/nginx
    expected: ''
    severity: medium
    info: 'You can verify which SSL/TLS protocols your server uses by issuing the below command to

      see the configured cipher suites on the server. If anything older than TLS 1.2 is

      implemented or nothing appears, this recommendation is not implemented.

      grep -ir ssl_protocol /etc/nginx

      78 | P a g e

      Note: Depending on your configuration, you may see different results. The directive

      ssl_protocols should always '
- id: 4.1.5
  title: Disable weak ciphers
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The ssl_ciphers directive should be used to configure the available ciphers on your web server, and the proxy_ssl_ciphers
    directive should be used to configure the available ciphers for your proxy. Weak ciphers should be disabled based on your
    company's policy or an industry best practice compliance profile. The ssl_prefer_server_ciphers should be used to ensure
    the user agent respects the server's preferred cipher order and does not set its own. If you are using a proxy or load
    balancer, you should use the proxy_ssl_ciphers directive to ensure your upstream connections are negotiated using secure
    ciphers.
  rationale: The use of strong ciphers is critical to maintaining strong encryption on your web server, load balancer, or
    proxy. Weak ciphers may compromise the security of your site or your users by allowing legacy user agents to connect to
    your site in a vulnerable way. You may also meet compliance concerns by ensuring that your upstream connections meet the
    same level of security if using a proxy or load balancer. The server should enforce the cipher preference on the server
    side to protect users from malicious actors on the client side.
  impact: Strong cipher configurations may not allow legacy user agents or user agents with weak configurations to connect
    to your site. If your server must also pass to a legacy upstream server, this may prevent it from being able to negotiate
    a cipher upstream.
  references:
  - 1. CIS Apache HTTP Server Benchmark
  - 2. https://ssllabs.com
  page_start: 81
  audit_raw: 'Use the following procedure to verify the ssl_cipher and proxy_ssl_cipher directives meet

    your company''s policy.

    grep -ir ssl_ciphers /etc/nginx/

    grep -ir proxy_ssl_ciphers /etc/nginx

    This output will show the server''s configured ciphers and cipher preference policy. If you

    have multiple server blocks or proxy passes, you should ensure the directive or directives

    appear for each.

    The output should also contain the directive ssl_prefer_server_ciphers, as shown below:

    81 | P a g e

    ssl_prefer_server_ciphers on;

    In your environment, you may have to check all include files in your nginx configuration or

    the nginx configuration itself manually. The server ciphers may be located as part of the

    server block, and the proxy ciphers may be located as part of the location block for your

    upstream traffic.

    OpenSSL may also be used to check compatible ciphers following the procedure found at

    OWASP:

    https://www.owasp.org/index.php/Testing_for_SSL-TLS_%28OWASP-CM-001%29'
  remediation: "The following procedures may be used to implement industry standard cipher profiles if\nyou have an existing\
    \ profile defined. These profiles may be modified to meet the\nrequirements defined in your company's policy. This procedure\
    \ assumes that all server\nblocks will be in /etc/nginx/nginx.conf and not inside any included files in the\nconfiguration.\n\
    Set the ssl_cipher directive as part of your server block, and set the proxy_ssl_ciphers\ndirective as part of the location\
    \ block for your upstream server.\nThis should look similar to the below examples:\nServer block configuration for client\
    \ connectivity to web server, proxy, or load\nbalancer:\nserver {\n  ssl_ciphers ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\n\
    }\nProxy or load balancer configuration for defined upstream negotiation:\nlocation / {\n  proxy_pass https://cisecurity.org;\n\
    \  proxy_ssl_ciphers ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\n}\nThe below procedure assumes the default configuration\
    \ profile. If you do not have\nssl_ciphers or proxy_ssl_ciphers defined, add the directives to your proxy or web server\n\
    configuration profile, then run the below commands to configure them to your selected\nprofile.\nFIPS 140-2 compliant\
    \ proxy:\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\nALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;/\" /etc/nginx/nginx.conf\n\
    Or if ssl_prefer_server_ciphers is not already enabled:\n82 | P a g e\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\n\
    ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\\nssl_prefer_server_ciphers\non;/\" /etc/nginx/nginx.conf\nFIPS 140-2\
    \ compliant web server:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers\nALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;/\"\
    \ /etc/nginx/nginx.conf\nOr if ssl_prefer_server_ciphers is not already enabled:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers\n\
    ALL:!EXP:!NULL:!ADH:!LOW:!SSLv2:!SSLv3:!MD5:!RC4;\\nssl_prefer_server_ciphers\non;\n/\" /etc/nginx/nginx.conf\nNo weak\
    \ ciphers SSLLABS proxy configuration\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\nHIGH:!aNULL:!CAMELLIA:!SHA:!RSA;/\"\
    \ /etc/nginx/nginx.conf\nOr if ssl_prefer_server_ciphers is not already enabled:\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\n\
    HIGH:!aNULL:!CAMELLIA:!SHA:!RSA;\\nssl_prefer_server_ciphers on;/\"\n/etc/nginx/nginx.conf\nNo weak ciphers SSLLABS web\
    \ server configuration:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers HIGH:!aNULL:!CAMELLIA:!SHA:!RSA;/\"\n/etc/nginx/nginx.conf\n\
    Or if ssl_prefer_server_ciphers is not already enabled:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers\nHIGH:!aNULL:!CAMELLIA:!SHA:!RSA;\\\
    nssl_prefer_server_ciphers on;/\"\n/etc/nginx/nginx.conf\nMozilla modern profile proxy:\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\
    \ 'ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSACHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCMSHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128SHA256:ECDHE-RSA-AES128-SHA256';/\"\
    \ /etc/nginx/nginx.conf\nOr if ssl_prefer_server_ciphers is not already enabled:\nsed -i \"s/proxy_ssl_ciphers[^;]*;/proxy_ssl_ciphers\
    \ 'ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSACHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-\n\
    83 | P a g e\nSHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128SHA256:ECDHE-RSA-AES128-SHA256';\\\
    nssl_prefer_server_ciphers on;/\"\n/etc/nginx/nginx.conf\nMozilla modern profile web server:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers\
    \ 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHERSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHEECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHERSA-AES128-SHA256';/\"\
    \ /etc/nginx/nginx.conf\nOr if ssl_prefer_server_ciphers is not already enabled:\nsed -i \"s/ssl_ciphers[^;]*;/ssl_ciphers\
    \ 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHERSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHEECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHERSA-AES128-SHA256';\\\
    nssl_prefer_server_ciphers on;/\" /etc/nginx/nginx.conf\nFor changes to take effect, you must recycle nginx:\nservice\
    \ nginx restart"
  checks:
  - type: command
    command: grep -ir ssl_ciphers /etc/nginx/ && grep -ir proxy_ssl_ciphers /etc/nginx
    expected: ''
    severity: medium
    info: 'Use the following procedure to verify the ssl_cipher and proxy_ssl_cipher directives meet

