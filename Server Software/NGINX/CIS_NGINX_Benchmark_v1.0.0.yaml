  description: The X-Xss-Protection Header allows you to leverage browser-based protections against cross-site scripting.
    This should be implemented on your web servers to protect your users and increase user trust in your site. Your policy
    should be set in blocking mode when possible to ensure the browser blocks a page if cross-site scripting is detected.
  rationale: X-Xss-Protection allows you to protect users whose browsers do not support Content Security Policy (generally
    older browsers), or protect users if you do not have a Content Security Policy.
  impact: ''
  references:
  - 1. https://www.owasp.org/index.php/OWASP_Secure_Headers_Project
  - 2. https://scotthelme.co.uk/hardening-your-http-response-headers/
