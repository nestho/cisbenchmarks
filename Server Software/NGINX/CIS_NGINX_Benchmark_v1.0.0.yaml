- id: 4.1.1
  title: Ensure HTTP is redirected to HTTPS
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Browsers and clients establish encrypted connections with servers by leveraging HTTPS. Requests leveraging
    HTTP are unencrypted. Unencrypted requests should be redirected so they are encrypted. Any listening HTTP port on your
    web server should redirect to a server profile that uses encryption. The default HTTP (unencrypted) port is 80.
  rationale: Redirecting user agent traffic to HTTPS helps to ensure all user traffic is encrypted. Modern browsers alert
    users that your website is insecure when HTTPS is not used. This can decrease user trust in your website and ultimately
    result in decreased use of your web services. Redirection from HTTP to HTTPS couples security with usability; users are
    able to access your website even if they lack the security awareness to use HTTPS over HTTP when requesting your website.
  impact: Use of HTTPS does result in a performance reduction in traffic to your website, however, due to the increased value
    of the security, many businesses consider this to be a cost of doing business.
  references:
  - 1. https://serversforhackers.com/c/redirect-http-to-https-nginx
  page_start: 71
  audit_raw: "To verify your server listening configuration, check your web server or proxy configuration\nfile. The default\
    \ web server configuration file is /etc/nginx/conf.d/default.conf, and the\ndefault proxy configuration file is /etc/nginx/nginx.conf.\
    \ The configuration file should\nreturn a statement redirecting to HTTPS. This should be similar to the code below, where\n\
    cisecurity.org is used as an example.\nserver {\n    listen 80;\n    server_name cisecurity.org;\n71 | P a g e\n    return\
    \ 301 https://$host$request_uri;\n}"
  remediation: "Edit your web server or proxy configuration file to redirect all unencrypted listening ports,\nsuch as port\
    \ 80, using a redirection through the return directive (cisecurity.org is used as\nan example server name).\nserver {\n\
    \    listen 80;\n    server_name cisecurity.org;\n    return 301 https://$host$request_uri;\n}"
  checks:
  - type: manual_review
    info: "To verify your server listening configuration, check your web server or proxy configuration\nfile. The default\
      \ web server configuration file is /etc/nginx/conf.d/default.conf, and the\ndefault proxy configuration file is /etc/nginx/nginx.conf.\
      \ The configuration file should\nreturn a statement redirecting to HTTPS. This should be similar to the code below,\
      \ where\ncisecurity.org is used as an example.\nserver {\n    listen 80;\n    server_name cisecurity.org;\n71 | P a\
      \ g e\n    return 301 https://$host$req"
    severity: medium
