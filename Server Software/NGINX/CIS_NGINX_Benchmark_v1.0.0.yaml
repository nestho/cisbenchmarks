    expected: ''
    severity: medium
    info: 'Verify HTTP Public Key Pinning is enabled by running this command:

      grep -ir Public-Key-Pins /etc/nginx

      If the output does not return anything, the header is not implemented.'
- id: 4.1.10
  title: Ensure upstream server traffic is authenticated with a client certificate
