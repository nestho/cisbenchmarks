    severity: medium
    info: 'Issue this command to check for HSTS headers on your website:

      grep -ir Strict-Transport-Security /etc/nginx

      If your output does not include the following directive associated with your server

      configuration file, this recommendation is not implemented. The header should also

      include the max-age directive with 15768000 seconds (six months) or longer configured.

      add_header Strict-Transport-Security "'
- id: 4.1.9
  title: Ensure HTTP Public Key Pinning is enabled
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: HTTP Public Key Pinning, also known as certificate pinning, allows a site to specify exactly which certificates
    the browser or another user agent should accept. HTTP Public Key Pinning allows for the certificate rotation to be scheduled
    using backup fingerprints to ensure that user agent has both certificates stored. HTTP Public Key Pinning should be enabled.
  rationale: HTTP Public Key Pinning assists in preventing a user agent from falling victim to a forged certificate, such
    as man in the middle attacks.
  impact: ''
  references:
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Public_Key_Pinning
  page_start: 92
  audit_raw: 'Verify HTTP Public Key Pinning is enabled by running this command:

    grep -ir Public-Key-Pins /etc/nginx

    If the output does not return anything, the header is not implemented.'
  remediation: 'Find the fingerprint of your certificate by referencing the fingerprint section of your

    certificate details. Take down the SHA256 fingerprint in this section as well as that of a

    backup certificate or the next scheduled certificate for the website.

    Insert your SHA256 fingerprint along with the below header to your server configuration:

    add_header Public-Key-Pins ''pinsha256="base64+primary==InsertPrimaryCertificateSHA256FingerPrintHere"; pinsha256="base64+backup==InsertBackupCertificateSHA256FingerPrintHere";
    maxage=5184000;'
  checks:
  - type: command
