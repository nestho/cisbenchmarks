- id: 4.1.3
  title: Ensure private key permissions are restricted
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The server's private key should be protected from unauthorized access by limiting access based on the principle
    of least privilege.
  rationale: A server's private key file should be restricted to 400 permissions. This ensures only the owner of the private
    key file can access it. This is the minimum necessary permissions for the server to operate. If the private key file is
    not protected, an unauthorized user with access to the server may be able to find the private key file and use it to decrypt
    traffic sent to your server.
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'Verify the permissions on the key file are 400. This can be found by running the following

    command. You should replace /etc/nginx/nginx.key with the location of your key file.

    ls -l /etc/nginx/nginx.key

    The output should show the permissions as 400 or -r--------. If this is not the case, excessive

    permissions have been granted to this file.'
  remediation: 'Run the following command on your key file to ensure its permissions are set to 400. The

    file name /etc/nginx/nginx.key should be replaced with the location of your key file.

    sudo chmod 400 /etc/nginx/nginx.key'
  checks:
  - type: command
    command: ls -l /etc/nginx/nginx.key
    expected: ''
    severity: medium
    info: 'Verify the permissions on the key file are 400. This can be found by running the following

