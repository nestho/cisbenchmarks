benchmark:
  id: cis-nginx-benchmark
  title: CIS NGINX Benchmark
  version: 1.0.0
  technology: NGINX
  category: Server Software
  os: NGINX
  source_pdf: CIS_NGINX_Benchmark_v1.0.0.pdf
  total_pages: 132
  controls_count: 45
controls:
- id: 1.1.1
  title: Ensure NGINX is installed
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The CIS NGINX Benchmark recommends using the NGINX binary provided by your vendor for most situations. As an
    alternative, packages from nginx.org are available for a variety of platforms, including Linux and FreeBSD.
  rationale: 'The main benefits of using NGINX packages from your vendor are:  Ease of installation  Dependency resolution
     Increased effectiveness of maintenance and security patches  Q&A procedures carried out by your vendor'
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/install.html
  - 2. http://nginx.org/en/linux_packages.html
  page_start: 12
  audit_raw: 'To check if nginx is installed on your server, run the following command:

    nginx -v

    12 | P a g e

    The command output should return the version of nginx that is installed on the server. If

    there is no output, nginx is not installed.'
  remediation: 'Configure repo:

    Example:

    #Configure your repo

    cat << EOF > /etc/yum.repos.d/nginx.repo

    [nginx]

    name=nginx repo

    baseurl=http://nginx.org/packages/centos/7/\$basearch/

    gpgcheck=1

    enabled=1

    EOF

    Download signing key:

    Example:

    #Download Signing Key From The Internet

    curl -O https://nginx.org/keys/nginx_signing.key

    #import signing key so you do not get an error installing nginx

    rpm --import nginx_signing.key

    Install NGNIX:

    Example:

    yum install nginx -y'
  checks:
  - type: manual_review
    info: 'To check if nginx is installed on your server, run the following command:

      nginx -v

      12 | P a g e

      The command output should return the version of nginx that is installed on the server. If

      there is no output, nginx is not installed.'
    severity: medium
- id: 1.1.2
  title: Ensure NGINX is installed from source
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  - Level 1
  - Level 1
  - Level 1
  description: Installing NGINX directly from source allows you to install NGINX without the use of a package manager. Systems
    need to have package manager repositories properly configured to ensure they receive the latest patches and updates.
  rationale: Installing NGINX from source allows you to harden your instance of NGINX by minimizing modules. NGINX is unable
    to remove modules when installed using a package manager. By installing from source, you are able to minimize modules,
    however, some additional configuration will be required and updates will not be automated out of the box for you. If a
    system's package manager repositories are misconfigured, important patches may not be identified, or a rogue repository
    could introduce compromised software.
  impact: By installing NGINX from source, you will have to manually upgrade NGINX or automate upgrades yourself. The default
    values for NGINX may also vary from this guide using this method.
  references:
  - 1. https://docs.nginx.com/nginx/admin-guide/installing-nginx/installing-nginx-opensource/
  - 1. http://nginx.org/en/linux_packages.html
  page_start: 14
  audit_raw: "To check if nginx is installed on your server, run the following command:\nnginx -v\nThe command output should\
    \ return the version of nginx that is installed on the server. If\nthere is no output, nginx is not installed.\nTo verify\
    \ package manager repositories are configured correctly, run the following\ncommand:\n yum repolist -v nginx"
  remediation: 'Installation depends on the operating system platform. For a source build, consult the

    NGINX documentation "Building nginx from Sources".

    Configure your package manager repositories according to your vendor.

    As an alternative, package manager repositories from nginx.org are available for a variety

    of Linux platforms.'
  checks:
  - type: manual_review
    info: "To check if nginx is installed on your server, run the following command:\nnginx -v\nThe command output should\
      \ return the version of nginx that is installed on the server. If\nthere is no output, nginx is not installed.\nTo verify\
      \ package manager repositories are configured correctly, run the following\ncommand:\n yum repolist -v nginx"
    severity: medium
- id: 1.2.2
  title: Ensure the latest software package is installed
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: As new security vulnerabilities are discovered, the corresponding fixes are implemented by your NGINX software
    package provider. Installing the latest software version ensures these fixes are available on your system.
  rationale: Up-to-date software provides the best possible protection against exploitation of security vulnerabilities, such
    as the execution of malicious code.
  impact: ''
  references:
  - 1. http://nginx.org/en/linux_packages.html
  page_start: 18
  audit_raw: 'To verify your NGINX package is up to date, run the following command:

    yum info nginx'
  remediation: 'To install the latest NGINX package, run the following command:

    yum update nginx -y'
  checks:
  - type: manual_review
    info: 'To verify your NGINX package is up to date, run the following command:

      yum info nginx'
    severity: medium
- id: 2.1.1
  title: Ensure only required modules are installed
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: This NGINX installation comes with several modules out of the box. These modules are not all always needed.
    Installations of NGINX should be hardened to ensure only the necessary modules are installed.
  rationale: Minimizing features and functionality built into NGINX can help to reduce the number of vulnerabilities your
    server has, which reduces the likelihood of a successful compromise by attackers.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  page_start: 20
  audit_raw: 'Audit the modules used in your current NGINX build by using the nginx verification

    command:

    nginx -V'
  remediation: 'Consult the NGINX module documentation to determine which modules are needed for

    your specific installation.

    Modules may be removed using the configure command.'
  checks:
  - type: manual_review
    info: 'Audit the modules used in your current NGINX build by using the nginx verification

      command:

      nginx -V'
    severity: medium
- id: 2.1.2
  title: Ensure HTTP WebDAV module is not installed
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: The http_dav_module enables HTTP Extensions for Web Distributed Authoring and Versioning (WebDAV) as defined
    by RFC 4918. This enables file-based operations on your web server, such as the ability to create, delete, change and
    move files on your server. Most modern architectures have replaced this functionality with cloud-based object storage,
    in which case the module should not be installed.
  rationale: WebDAV functionality opens up an unnecessary path for exploiting your web server. Through misconfigurations of
    WebDAV operations, an attacker may be able to access and manipulate files on the server.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  - 2. https://tools.ietf.org/html/rfc4918
  page_start: 22
  audit_raw: 'Run the following command to ensure the http_dav_module is not installed:

    nginx -V 2>&1 | grep http_dav_module

    Ensure the output of the command is empty.'
  remediation: To remove the http_dav_module, recompile nginx from source without the --withhttp_dav_module flag.
  checks:
  - type: command
    command: nginx -V 2>&1 | grep http_dav_module
    expected: ''
    severity: medium
    info: 'Run the following command to ensure the http_dav_module is not installed:

      nginx -V 2>&1 | grep http_dav_module

      Ensure the output of the command is empty.'
- id: 2.1.3
  title: Ensure modules with gzip functionality are disabled
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: gzip is used for compression. Compression functionality should be disabled to prevent certain types of attacks
    from being performed successfully.
  rationale: Compression has been linked with the Breach attack and others. While the Breach attack has been mitigated with
    modern usages of the HTTP protocol, disabling the use of compression is considered a defense-in-depth strategy to mitigate
    other attacks.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/configure.html
  - 2. http://nginx.org/en/docs/configure.html
  page_start: 24
  audit_raw: 'Run the following command to ensure gzip modules are not installed:

    nginx -V | grep ''http_gzip_module\|http_gzip_static_module''

    Ensure the output of the command is empty.'
  remediation: 'In order to disable the http_gzip_module, nginx must be recompiled from source. This can

    be accomplished using the below command in the folder you used during your original

    compilation. This must be done without the --with-http_gzip_static_module configuration

    directive.

    ./configure --without-http_gzip_module'
  checks:
  - type: command
    command: nginx -V | grep 'http_gzip_module\|http_gzip_static_module'
    expected: ''
    severity: medium
    info: 'Run the following command to ensure gzip modules are not installed:

      nginx -V | grep ''http_gzip_module\|http_gzip_static_module''

      Ensure the output of the command is empty.'
- id: 2.1.4
  title: Ensure the autoindex module is disabled
  scoring: scored
  profile:
  - Level 1
  description: The autoindex module processes requests ending with the slash character. This feature enables directory listing,
    which could be useful in attacker reconnaissance, so it should be disabled.
  rationale: Automated directory listings may reveal information helpful to an attacker, such as naming conventions and directory
    paths. Directory listings may also reveal files that were not intended to be revealed.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/http/ngx_http_autoindex_module.html
  page_start: 26
  audit_raw: "To determine if the autoindex module is disabled, search the NGINX configuration files\n(nginx.conf and any\
    \ included configuration files) for autoindex directives:\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n  egrep\
    \ -i '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\nEnsure there are no autoindex on directives present."
  remediation: "Perform the following to disable the autoindex module:\n1. Search the NGINX configuration files (nginx.conf\
    \ and any included configuration\nfiles) to find autoindex directives.\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n\
    \  egrep -i '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\n2. Set the value for all autoindex directives to off, or remove\
    \ those directives."
  checks:
  - type: manual_review
    info: "To determine if the autoindex module is disabled, search the NGINX configuration files\n(nginx.conf and any included\
      \ configuration files) for autoindex directives:\n  egrep -i '^\\s*autoindex\\s+' /etc/nginx/nginx.conf\n  egrep -i\
      \ '^\\s*autoindex\\s+' /etc/nginx/conf.d/*\nEnsure there are no autoindex on directives present."
    severity: medium
- id: 2.2.1
  title: Ensure that NGINX is run using a non-privileged, dedicated service account
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The nginx user directive designates which user account nginx worker processes run under. Ensuring a non-privileged,
    dedicated service account is used is a defense in depth measure to limit what an attacker who compromises the account
    can do.
  rationale: Running a web server under a non-privileged, dedicated service account helps mitigate the risk of lateral movement
    to other services or processes in the event the user account running the web services is compromised. The default user
    nobody is typically used for several processes, and if this is compromised, it could allow an attacker to have access
    to all processes running as that user.
  impact: ''
  references:
  - 1. http://nginx.org/en/docs/ngx_core_module.html#user
  page_start: 28
  audit_raw: 'Run the following to verify nginx is being run by a dedicated non-privileged user account:

    Step 1: Verify nginx is being run as a dedicated user:

    grep "user[^;]*;" /etc/nginx/nginx.conf

    If a user directive similar to the below is not found, this is not a dedicated user. If a user is

    found similar to the output shown below, continue to step 2. If the user does not exist, a

    user will need to be added.

    user  nginx;

    Step 2: Verify the nginx dedicated user is not privileged:

    Run the below command, replacing nginx with any designated user you may have assigned:

    28 | P a g e

    sudo -l -U nginx

    The output should look similar to the below if this user is not privileged:

    sudo -l -U nginx

    User nginx is not allowed to run sudo

    Step 3: Verify the nginx dedicated user is not part of any unexpected groups:

    Run the below command, replacing nginx with any designated user you may have assigned:

    groups nginx

    The output should look similar to the below if this user is not part of any other groups than

    the primary group:

    nginx : nginx'
  remediation: 'Add a system account for the nginx user with a home directory of /var/cache/nginx and a

    shell of /sbin/nologin so it does not have the ability to log in, then add the nginx user to be

    used by nginx:

    user add nginx -r -g nginx -d /var/cache/nginx -s /sbin/nologin

    Then add the nginx user to /etc/nginx/nginx.conf by adding the user directive as shown

    below:

    user nginx;'
  checks:
  - type: command
    command: grep "user[^;]*;" /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Run the following to verify nginx is being run by a dedicated non-privileged user account:

      Step 1: Verify nginx is being run as a dedicated user:

      grep "user[^;]*;" /etc/nginx/nginx.conf

      If a user directive similar to the below is not found, this is not a dedicated user. If a user is

      found similar to the output shown below, continue to step 2. If the user does not exist, a

      user will need to be adde'
- id: 2.2.2
  title: Ensure the NGINX service account is locked
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'The nginx user account should have a valid password, but the account should be locked. NOTE: If a different
    account is used to run nginx, that account''s name should be substituted for nginx in the audit and remediation procedures.'
  rationale: As a defense-in-depth measure, the nginx user account should be locked to prevent logins and to prevent someone
    from switching users to nginx using the password. In general, there shouldn't be a need for anyone to have to su as nginx,
    and when there is a need, sudo should be used instead, which would not require the nginx account password.
  impact: This ensures the nginx user account may not be used by a human user.
  references: []
  page_start: 30
  audit_raw: 'Verify the nginx service account is locked by running this command:

    passwd -S nginx

    The results should be similar to one of the following:

    nginx LK 2010-01-28 0 99999 7 -1 (Password locked.)

    or

    nginx L 07/02/2012 -1 -1 -1 -1'
  remediation: 'Use the passwd command to lock the nginx service account:

    passwd -l nginx

    30 | P a g e'
  checks:
  - type: manual_review
    info: 'Verify the nginx service account is locked by running this command:

      passwd -S nginx

      The results should be similar to one of the following:

      nginx LK 2010-01-28 0 99999 7 -1 (Password locked.)

      or

      nginx L 07/02/2012 -1 -1 -1 -1'
    severity: medium
- id: 2.2.3
  title: Ensure the NGINX service account has an invalid shell
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The nginx account should not have the ability to log in, so the /sbin/nologin shell should be set for the account.
  rationale: The account used for nginx should only be used for the nginx service and does not need to have the ability to
    log in. This prevents an attacker who compromises the account to log in with it.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Verify the nginx login account shell in the /etc/passwd file using the following command:

    grep nginx /etc/passwd

    The shell must be /sbin/nologin, similar to the example output shown below:

    nginx:x:997:994:nginx user:/var/cache/nginx:/sbin/nologin'
  remediation: 'Change the login shell for the nginx account to /sbin/nologin by using the following

    command:

    chsh -s /sbin/nologin nginx'
  checks:
  - type: command
    command: grep nginx /etc/passwd
    expected: ''
    severity: medium
    info: 'Verify the nginx login account shell in the /etc/passwd file using the following command:

      grep nginx /etc/passwd

      The shell must be /sbin/nologin, similar to the example output shown below:

      nginx:x:997:994:nginx user:/var/cache/nginx:/sbin/nologin'
- id: 2.3.1
  title: Ensure NGINX directories and files are owned by root
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The owner and group of the /etc/nginx directory and its files should be root.
  rationale: Setting ownership to only those users in the root group and the root user will reduce the likelihood of unauthorized
    modifications to the nginx configuration files.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Run the following command to verify the ownership of the nginx configuration files:

    stat /etc/nginx

    The output should show the ownership and group as root, similar to the output below:

    Access: (0755/drwxr-xr-x)  Uid: (    0/    root)   Gid: (    0/    root)'
  remediation: 'Run the following command to ensure ownership and group ownership is set to root:

    chown -R root:root /etc/nginx'
  checks:
  - type: command
    command: stat /etc/nginx
    expected: ''
    severity: medium
    info: 'Run the following command to verify the ownership of the nginx configuration files:

      stat /etc/nginx

      The output should show the ownership and group as root, similar to the output below:

      Access: (0755/drwxr-xr-x)  Uid: (    0/    root)   Gid: (    0/    root)'
- id: 2.3.2
  title: Ensure access to NGINX directories and files is restricted
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Permissions on the /etc/nginx directory should enforce the principle of least privilege.
  rationale: This ensures that only users who need access to configuration files are able to view them, thus preventing unauthorized
    access. Other users will need to use sudo in order to access these files.
  impact: ''
  references:
  - 1. https://dev-sec.io/baselines/nginx/
  page_start: 36
  audit_raw: 'To verify the nginx directory has other read and execute permissions revoked, look at the

    permissions by running the below command:

    find /etc/nginx -type d | xargs ls -ld

    The output should show permissions similar to the output below:

    drwxr-x---. 4 root root 188 Nov 28 23:22 /etc/nginx

    To verify the nginx configuration files have other read and execute permissions revoked,

    look at the permissions by running the below command:

    find /etc/nginx -type f | xargs ls -l

    The output should show permissions similar to the output below:

    -rw-r-----. 1 root root 2192 Nov 11  2017 /etc/nginx/nginx.conf'
  remediation: 'To set permissions to least privilege on the nginx configuration files, issue these

    commands:

    36 | P a g e

    find /etc/nginx -type d | xargs chmod 750

    find /etc/nginx -type f | xargs chmod 640'
  checks:
  - type: command
    command: find /etc/nginx -type d | xargs ls -ld && find /etc/nginx -type f | xargs ls -l
    expected: ''
    severity: medium
    info: 'To verify the nginx directory has other read and execute permissions revoked, look at the

      permissions by running the below command:

      find /etc/nginx -type d | xargs ls -ld

      The output should show permissions similar to the output below:

      drwxr-x---. 4 root root 188 Nov 28 23:22 /etc/nginx

      To verify the nginx configuration files have other read and execute permissions revoked,

      look at the permissions '
- id: 2.3.3
  title: Ensure the NGINX process ID (PID) file is secured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: The PID file stores the main process ID of the nginx process. This file should be protected from unauthorized
    modification.
  rationale: The PID file should be owned by root and the group root. It should also be readable to everyone, but only writable
    by root (permissions 644). This will prevent unauthorized modification of the PID file, which could cause a denial of
    service.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Run this command to verify the ownership and permissions of the nginx PID file:

    ls -l /var/run/nginx.pid

    The output should show that the PID file is owned by root and has the group root, as shown

    below.

    -rw-r--r--. 1 root root 6 Nov 12 01:06 /var/run/nginx.pid

    If this is not the location of the PID file, the PID file location can be found using the output

    of the below command:

    nginx -V'
  remediation: 'If the PID file is not owned by root, issue this command:

    chown root:root /var/run/nginx.pid

    If the PID file has permissions greater than 644, issue this command:

    chown 644 /var/run/nginx.pid

    38 | P a g e'
  checks:
  - type: command
    command: ls -l /var/run/nginx.pid
    expected: ''
    severity: medium
    info: 'Run this command to verify the ownership and permissions of the nginx PID file:

      ls -l /var/run/nginx.pid

      The output should show that the PID file is owned by root and has the group root, as shown

      below.

      -rw-r--r--. 1 root root 6 Nov 12 01:06 /var/run/nginx.pid

      If this is not the location of the PID file, the PID file location can be found using the output

      of the below command:

      nginx -V'
- id: 2.3.4
  title: Ensure the core dump directory is secured
  scoring: scored
  profile:
  - Level 1
  description: Core dumps are snapshots of memory. The working_directory directive is used to specify the directory NGINX
    attempts to create core dumps in. Core dumps will be disabled if the directory is not writable by the NGINX user. It is
    recommended that the working_directory directive be set to a directory that is owned by the root user and the group the
    NGINX process executes as, and is inaccessible to other users. Usually, production systems should not have this enabled.
  rationale: Core dumps may contain sensitive information that should not be accessible by other accounts on the system.
  impact: ''
  references:
  - 1. https://www.nginx.com/resources/wiki/start/topics/tutorials/debugging/#coredump
  page_start: 40
  audit_raw: 'Run the following procedure to verify the core dump configuration is secured:

    Step 1: Check to see if the working_directory directive is configured:

    grep working_directory /etc/nginx/nginx.conf

    Step 2: If the working_directory directive is enabled, it needs to meet the following

    requirements:

    1. It is not within the NGINX web document root.

    2. It is owned by root and has a group ownership of the NGINX group.

    3. It has no read-write-search access permission for other users (e.g. o=rwx).'
  remediation: 'Either remove the working_directory directive from the NGINX configuration files or

    ensure that the configured directory meets the following requirements:

    1. It is not within the NGINX web document root.

    2. It is owned by root and has a group ownership of the NGINX group:

    chown root:nginx /var/log/nginx

    40 | P a g e

    3. It has no read-write-search access permission for other users:

    chmod o-rwx /var/log/nginx'
  checks:
  - type: command
    command: grep working_directory /etc/nginx/nginx.conf
    expected: ''
    severity: medium
    info: 'Run the following procedure to verify the core dump configuration is secured:

      Step 1: Check to see if the working_directory directive is configured:

      grep working_directory /etc/nginx/nginx.conf

      Step 2: If the working_directory directive is enabled, it needs to meet the following

      requirements:

      1. It is not within the NGINX web document root.

      2. It is owned by root and has a group ownership of the N'
- id: 2.4.1
  title: Ensure NGINX only listens for network connections on authorized ports
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: NGINX can be configured to listen on any port, but it should be configured to listen on authorized ports only.
  rationale: Limiting the listening ports to only those that are authorized helps to ensure no unauthorized services are running
    through the use of nginx.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Use this command to audit all listening ports on the server:

    grep -ir listen /etc/nginx

    The ports being used should immediately follow the listen directive in the output. Ensure

    all ports that are actively listening and not commented out are authorized for use on the

    server. The output should look similar to this example:

    /etc/nginx/conf.d/default.conf:    listen 80 default_server;

    /etc/nginx/conf.d/default.conf:    listen 443 ssl http2;

    /etc/nginx/conf.d/default.conf:    listen [::]:443 ssl http2;'
  remediation: 'If any ports are listening that are not authorized, comment out or delete the associated

    configuration for that listener.'
  checks:
  - type: command
    command: grep -ir listen /etc/nginx
    expected: ''
    severity: medium
    info: 'Use this command to audit all listening ports on the server:

      grep -ir listen /etc/nginx

      The ports being used should immediately follow the listen directive in the output. Ensure

      all ports that are actively listening and not commented out are authorized for use on the

      server. The output should look similar to this example:

      /etc/nginx/conf.d/default.conf:    listen 80 default_server;

      /etc/nginx/conf'
- id: 2.4.2
  title: Ensure requests for unknown host names are rejected
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Your host header should be part of a predefined whitelist of known good hosts, which enables blocking access
    to other hosts. You should treat the host header as another input to be validated, as it is defined by the user agent.
  rationale: Whitelisting specific hosts and blocking access to all other hosts, you help to mitigate host header injection
    attacks against your server. Such attacks could be used by an attacker to redirect you to a rogue host and execute scripts
    or get you to input credentials.
  impact: If you are in an environment such as the cloud, you should not put an IP address or default hostname as your server_name
    because these addresses are often ephemeral in nature. Additionally, you will be blocked from accessing your site if you
    use a means of access that does not directly reference names in the server_name directive. You should reserve a DNS name
    to use for implementing this recommendation.
  references:
  - 1. https://www.acunetix.com/blog/articles/automated-detection-of-host-headerattacks/
  - 2. https://hackerone.com/reports/94637
  page_start: 44
  audit_raw: 'Run the following comment to verify this is configured:

