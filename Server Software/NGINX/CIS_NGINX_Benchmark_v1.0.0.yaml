    openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048\nchmod 400 /etc/nginx/ssl/dhparam.pem\nAlter the server configuration\
    \ to use the new parameters:\nhttp {\n    server {\n        ssl_dhparam /etc/nginx/ssl/dhparam.pem;\n    }\n}\n86 | P\
    \ a g e"
