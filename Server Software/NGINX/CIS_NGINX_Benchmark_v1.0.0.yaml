  page_start: 73
  audit_raw: 'Run this command to find the file location of your certificate:

    grep -ir ssl_certificate /etc/nginx/

    The output of your command should look similar to the below output. If there is no output,

    you do not have a certificate installed.

    Web Server:

    /etc/nginx/nginx.conf:    ssl_certificate /etc/nginx/cert.pem;

    /etc/nginx/nginx.conf:    ssl_certificate_key /etc/nginx/nginx.key;

    Open the file to the right of the ssl_certificate directive using the following command:

    cat /etc/nginx/cert.pem

    The output of your command should look similar to the below. It should include the full

    certificate chain.

    -----BEGIN CERTIFICATE-----

    Insert Your Web Server Certificate

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Insert Your Certificate Authority Intermediate Certificate

    73 | P a g e

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Insert Your Certificate Authority Root Certificate

    -----END CERTIFICATE-----'
  remediation: "Use the following procedure to install a certificate and its signing certificate chain onto\nyour web server,\
    \ load balancer, or proxy.\nStep 1: Create the server's private key and a certificate signing request.\nThe following\
    \ command will create your certificate's private key with 2048-bit key\nstrength. Optionally, this parameter may be changed\
    \ to 4096 for greater security. It will\nalso output your certificate signing request to the nginx.csr file in your present\
