      die diesen Wert überschreiben (z. B. für

      Uploads), verifizieren Sie manuell, dass d'
- id: 5.2.3
  title: Sicherstellen, dass die maximale Puffergröße für URIs definiert ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Die large_client_header_buffers-Direktive weist die maximale Anzahl und Größe der Puffer für das Lesen des
    gesamten Client-Request-Headers zu. Dieser umfasst sowohl die Request-Zeile (z. B. GET /path HTTP/1.1 ) als auch alle
    nachfolgenden Header-Felder (z. B. Host:, Cookie:, Authorization:). Wenn der Request-Header eines Clients den insgesamt
    zugewiesenen Pufferbereich überschreitet, lehnt NGINX die Anfrage sofort mit einem 400 Bad Request -Fehler ab. Außerdem
    darf die Request-Zeile des Clients die Größe eines Puffers nicht überschreiten, andernfalls wird dem Client der Fehler
    414 Request-URI Too Large zurückgegeben.
  rationale: 'Obwohl NGINX selbst nicht anfällig für Buffer Overflows durch große Header ist, erfüllt diese Direktive zwei
    entscheidende Zwecke: 1. Denial-of-Service (DoS)-Minderung: Sie verhindert, dass bösartige Clients versuchen, den Server-Arbeitsspeicher
    durch das Senden extrem großer Header zu erschöpfen. 2. Schutz nachgelagerter Systeme (Downstream Protection): Sie fungiert
    als Gatekeeper und stellt sicher, dass fehlerhafte oder übergroße Header die BackendAnwendungen nicht erreichen, die möglicherweise
    fragiler sind oder bei deren Verarbeitung undefiniertes Verhalten zeigen könnten. Der Standardwert ist absichtlich großzügig
    bemessen, um legitimen modernen WebTraffic verarbeiten zu können. Eine grundlose Verringerung kann kontraproduktiv sein.'
  impact: Ein zu niedriger Wert ist eine häufige Ursache für schwer zu diagnostizierende Anwendungsfehler. Legitime Anfragen
    moderner Webanwendungen, insbesondere solche mit komplexer Authentifizierung (OAuth/SAML) oder Analysedaten, können leicht
    Header erzeugen, die größer als wenige Kilobyte sind. Ein zu restriktiver Wert führt dazu, dass diese legitimen Anfragen
    mit einem generischen 400 Bad Request -Fehler fehlschlagen, der häufig fälschlicherweise der Anwendung selbst und nicht
    der NGINXKonfiguration zugeschrieben wird.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#large_client_header_b
  - 2. NIST SP 800-53:rev5:SI-10
  page_start: 138
  audit_raw: 'Dies ist eine manuelle Überprüfung, die Kontext erfordert.

    1. Führen Sie den folgenden Befehl aus, um zu sehen, ob die Direktive explizit

    gesetzt ist:

    nginx -T 2>/dev/null | grep ''large_client_header_buffers''

    2. Bewerten Sie das Ergebnis:

    Keine Ausgabe: Der Server verwendet den Standardwert von 4 8k . Dies gilt als

    konform und sicher für den allgemeinen Gebrauch.

    Ausgabe zeigt large_client_header_buffers 4 8k; : Der Standardwert

    ist explizit gesetzt. Dies ist ebenfalls konform.

    Ausgabe zeigt einen abweichenden Wert (z. B. 2 1k; ): Dies ist eine

    Abweichung vom Standard. Überprüfen Sie manuell, ob dieser restriktive Wert

    dokumentiert, beabsichtigt und für die spezifische Anwendung erforderlich ist.

    Falls nicht, stellt dies ein potenzielles Verfügbarkeitsrisiko dar und sollte markiert

    werden.'
  remediation: 'Sofern keine spezifische, dokumentierte Anforderung besteht, Header-Größen weiter

    einzuschränken, besteht die empfohlene Maßnahme darin, sich auf den sicheren

    Standardwert zu verlassen. Wenn Ihre Konfiguration ohne klaren Grund einen zu

    restriktiven Wert setzt, entfernen Sie die large_client_header_buffers-Direktive

    aus Ihren http- oder server-Blöcken, damit NGINX auf seinen Standardwert

    zurückfallen kann.

    Remediation-Maßnahme:

    Entfernen Sie alle benutzerdefinierten, zu restriktiven

    large_client_header_buffers-Zeilen aus Ihren Konfigurationsdateien.

    # ENTFERNEN SIE DIESE ZEILE, falls sie ohne guten Grund vorhanden ist:

    large_client_header_buffers 2 1k;'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep 'large_client_header_buffers'
    expected: ''
    severity: medium
    info: 'Dies ist eine manuelle Überprüfung, die Kontext erfordert.

      1. Führen Sie den folgenden Befehl aus, um zu sehen, ob die Direktive explizit

      gesetzt ist:

      nginx -T 2>/dev/null | grep ''large_client_header_buffers''

      2. Bewerten Sie das Ergebnis:

      Keine Ausgabe: Der Server verwendet den Standardwert von 4 8k . Dies gilt als

      konform und sicher für den allgemeinen Gebrauch.

      Ausgabe zeigt large_client_header_'
- id: 5.2.4
  title: Sicherstellen, dass die Anzahl der Verbindungen pro IPAdresse begrenzt ist
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: 'Das NGINX-Modul ngx_http_limit_conn_module bietet einen Mechanismus, um die Anzahl gleichzeitiger Verbindungen
    von einer einzelnen Client-IP-Adresse zu begrenzen. Dies wird in zwei Schritten erreicht: limit_conn_zone: Diese Direktive,
    die typischerweise im http-Block definiert wird, erstellt eine Shared-Memory-Zone, um den Status für jede Client-IPAdresse
    zu speichern. limit_conn: Diese Direktive, die in einem server- oder location-Block angewendet wird, erzwingt ein spezifisches
    Verbindungslimit unter Verwendung der zuvor definierten Zone. Wenn ein Client dieses Limit überschreitet, lehnt NGINX
    neue Verbindungen mit einem 503 Service Temporarily Unavailable -Fehler ab.'
  rationale: Der primäre Zweck der Verbindungsbegrenzung besteht darin, Ressourcenerschöpfung und bestimmte Arten von Denial-of-Service-Angriffen
    (DoS) zu mindern, bei denen ein Angreifer viele Verbindungen öffnet und diese so lange wie möglich offen hält. Dies ist
    ein anderes Werkzeug als Rate Limiting (limit_req), das darauf ausgelegt ist, schnell aufeinanderfolgende Anfragen (wie
    bei Brute-Force-Angriffen) zu stoppen. Durch das Erzwingen eines angemessenen Verbindungslimits kann der Server verhindern,
    dass ein einzelner bösartiger oder falsch konfigurierter Client einen unfairen Anteil der Worker-Verbindungen beansprucht.
  impact: Dies ist eine kritische Überlegung. Eine einzelne öffentliche IP-Adresse kann tausende einzelne Benutzer hinter
    einem großen Unternehmens-NAT, einem Universitätscampus oder einem Carrier-Grade-NAT (CG-NAT) eines Mobilfunkanbieters
    repräsentieren. Wird das Verbindungslimit zu niedrig gesetzt, werden legitime Benutzer in diesen Szenarien blockiert.
    Das angemessene Limit ist eine sorgfältige Abwägung und hängt vollständig von der Zielgruppe ab. Eine öffentlich zugängliche
    Website erfordert ein deutlich höheres Limit als eine restriktive Admin-Oberfläche.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
  - 2. NIST SP 800-53:rev5:SC-6
  page_start: 141
  audit_raw: 'Dies ist eine manuelle Prüfung, die Kontext erfordert.

    1. Führen Sie den folgenden Befehl aus, um die geladene NGINX-Konfiguration

    auf Regeln zur Verbindungsbegrenzung zu prüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*(limit_conn_zone|limit_conn)''

    2. Bewerten Sie die Ergebnisse manuell:

    Ist eine limit_conn_zone im http-Block definiert?

    Wird eine limit_conn-Direktive in den passenden server- oder locationBlöcken angewendet?

    Bewerten Sie insbesondere das konfigurierte Limit kritisch. Ist ein Limit von 10 für eine

    öffentliche Website angemessen, auf die Kunden oder große Unternehmen zugreifen?

    Oder ist es ein sinnvoller Wert für eine spezifische /login-location? Der Wert muss

    für seinen Kontext begründbar sein.'
  remediation: "Definieren Sie zunächst eine Shared-Memory-Zone im http-Block. Wenden Sie\nanschließend ein sorgfältig abgewogenes\
    \ Limit im server- oder location-Kontext\nan.\nDie Zonengröße verstehen: Der Speicherbedarf für den Key $binary_remote_addr\n\
    ist fest (64 Byte  auf einem 64-Bit-System). Daher kann 1 Megabyte  Zonenspeicher\nungefähr 16.384 Zustände speichern.\
    \ Eine 10m-Zone kann mehr als 160.000\nZustände speichern.\nBeispielkonfiguration:\nhttp {\n    # Eine 10-MB-Zone namens\
    \ 'per_ip' definieren, um Verbindungen nach IP zu\nverfolgen.\n    # $binary_remote_addr ist speichereffizienter als $remote_addr.\n\
    \    limit_conn_zone $binary_remote_addr zone=per_ip:10m;\n    server {\n        # Wendet ein allgemeines Limit von 20\
    \ Verbindungen pro IP-Adresse für\ndiesen Server an.\n        # Dies kann ein sinnvoller Ausgangspunkt für eine öffentliche\
    \ Website\nsein.\n        limit_conn per_ip 20;\n        # Für einen ressourcenintensiven Download-Bereich kann ein strengeres\n\
    Limit angewendet werden.\n        location /downloads/ {\n            limit_conn per_ip 5;\n        }\n    }\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(limit_conn_zone|limit_conn)'
    expected: ''
    severity: medium
    info: 'Dies ist eine manuelle Prüfung, die Kontext erfordert.

      1. Führen Sie den folgenden Befehl aus, um die geladene NGINX-Konfiguration

      auf Regeln zur Verbindungsbegrenzung zu prüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*(limit_conn_zone|limit_conn)''

      2. Bewerten Sie die Ergebnisse manuell:

      Ist eine limit_conn_zone im http-Block definiert?

      Wird eine limit_conn-Direktive in den passenden server- oder loca'
- id: 5.2.5
  title: Sicherstellen, dass Rate-Limits pro IP-Adresse festgelegt sind
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: 'Das NGINX-Modul ngx_http_limit_req_module bietet einen Mechanismus, um die Rate eingehender Anfragen von einer
    einzelnen Client-IP-Adresse basierend auf dem "Leaky Bucket"-Algorithmus zu begrenzen. Dies wird in zwei Schritten konfiguriert:
    1. limit_req_zone: Diese Direktive, die im http-Block definiert wird, erstellt eine Shared-Memory-Zone, welche die Parameter
    des "Buckets" definiert, wie z. B. die durchschnittliche Anfragerate. 2. limit_req: Diese Direktive, die in einem server-
    oder location-Block angewendet wird, erzwingt das Rate-Limit unter Verwendung einer spezifischen Zone und definiert, wie
    mit Traffic-Spitzen ("Bursts") umgegangen wird. Wenn ein Client die definierte Rate überschreitet, lehnt NGINX neue Anfragen
    mit einem 503 Service Temporarily Unavailable -Fehler ab.'
  rationale: Rate-Limiting ist die primäre Verteidigungsmaßnahme gegen hochfrequente Angriffe auf Anwendungsebene. Sein Hauptzweck
    besteht in der Verhinderung von Angriffen wie das Erraten von Passwörtern per Brute-Force an Login-Endpunkten, API-Missbrauch
    durch automatisierte Skripte und aggressives Content Scraping. Im Gegensatz zur Verbindungsbegrenzung (limit_conn), die
    sich auf langsame, gleichzeitige Verbindungen konzentriert, zielt das Rate-Limiting (limit_req) auf Clients ab, die in
    kurzer Zeit eine übermäßige Anzahl von Anfragen stellen.
  impact: Das Anwenden eines globalen, aggressiven Rate-Limits ist extrem gefährlich und wird mit hoher Wahrscheinlichkeit
    legitime Benutzer blockieren, die über ein gemeinsam genutztes NAT auf Ihre Website zugreifen (z. B. Unternehmens-Büros,
    Rechenzentren, Mobilfunknetze). Rate-Limiting ist ein chirurgisches Werkzeug, das nur auf spezifische, sensible Locations
    angewendet werden darf (z. B. /login, /api/v1/authenticate), bei denen ein Missbrauch wahrscheinlich ist. Falsch konfigurierte
    Rate-Limits sind eine häufige Ursache für Benutzerbeschwerden und Support-Tickets.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
  - 2. NIST SP 800-53:rev5:SC-5
  page_start: 145
  audit_raw: 'Dies ist eine manuelle Prüfung, die Kontext erfordert.

    1. Führen Sie den folgenden Befehl aus, um Rate-Limiting-Regeln zu finden:

    nginx -T 2>/dev/null | grep -E ''^\s*(limit_req_zone|limit_req)''

    2. Bewerten Sie die Ergebnisse manuell:

    Ist eine limit_req_zone im http-Block definiert?

    Wichtig: Wo wird limit_req angewendet? Wird es global angewendet

    (server-Block oder location / )? Dies stellt ein hohes Risiko dar. Oder wird

    es auf spezifische Endpunkte wie /login angewendet? Das entspricht den Best

    Practices.

    Sind die Werte für rate und burst für den geschützten Endpunkt

    angemessen?'
  remediation: "Definieren Sie zunächst eine Shared-Memory-Zone im http-Block. Wenden Sie\nanschließend ein sorgfältig abgestimmtes\
    \ Limit nur auf die spezifischen locationBlöcke an, die Schutz benötigen.\nDie \"Leaky Bucket\"-Parameter verstehen:\n\
    rate: Die durchschnittliche Rate, mit der der Bucket \"ausläuft\" (Anfragen werden\nverarbeitet). 5r/s bedeutet 5 Anfragen\
    \ pro Sekunde.\nburst: Die Größe des Buckets. Dies ist die Anzahl von \"Token\"-Anfragen, die\nein Client über die definierte\
    \ Rate hinaus stellen kann. burst=10 erlaubt einem\nClient, bis zu 10 Anfragen sofort abzusenden, bevor das Rate Limit\
    \ greift.\nnodelay: Ohne nodelay werden überschüssige Anfragen innerhalb eines\nBursts in eine Warteschlange gestellt\
    \ und mit der definierten rate verarbeitet\n(was den Client ausbremst). Mit nodelay werden überschüssige Anfragen sofort\n\
    verarbeitet, solange sie in den Burst-\"Bucket\" passen, und nur Anfragen, die das\nBurst-Limit überschreiten, werden\
    \ abgelehnt. Für APIs und Login-Seiten wird\nnodelay im Allgemeinen für eine bessere User Experience bevorzugt.\nBeispielkonfiguration:\n\
    http {\n    # Definiert eine 10MB-Zone für Login-Versuche.\n    # Rate: durchschnittlich 1 Anfrage pro Sekunde.\n    limit_req_zone\
    \    $binary_remote_addr zone=login_limit:10m rate=1r/s;\n    server {\n        # KEIN globales Rate-Limit hier!\n   \
    \     location / {\n            # Normaler Traffic, kein Rate-Limit\n        }\n        # Ein striktes Rate-Limit NUR\
    \ auf den Login-Endpunkt anwenden\n        location /login {\n            # Verwendet die Zone 'login_limit'.\n      \
    \      # Erlaubt einen Burst von 5 Anfragen, erzwingt danach das 1r/s-Limit.\n            # 'nodelay' stellt sicher, dass\
    \ ein Benutzer ein Formular schnell\nerneut senden kann, ohne künstlich ausgebremst zu werden.\n            limit_req\
    \    zone=login_limit burst=5 nodelay;\n            # ... andere Einstellungen ...\n        }\n    }\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(limit_req_zone|limit_req)'
    expected: ''
    severity: medium
    info: 'Dies ist eine manuelle Prüfung, die Kontext erfordert.

      1. Führen Sie den folgenden Befehl aus, um Rate-Limiting-Regeln zu finden:

      nginx -T 2>/dev/null | grep -E ''^\s*(limit_req_zone|limit_req)''

      2. Bewerten Sie die Ergebnisse manuell:

      Ist eine limit_req_zone im http-Block definiert?

      Wichtig: Wo wird limit_req angewendet? Wird es global angewendet

      (server-Block oder location / )? Dies stellt ein hoh'
- id: 5.3.1
  title: Sicherstellen, dass der X-Content-Type-Options-Header konfiguriert und aktiviert ist
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Der X-Content-Type-Options-Header weist den Browser an, die in den ContentType-Headern deklarierten MIME-Typen
    strikt zu befolgen und den Inhaltstyp nicht basierend auf dem tatsächlichen Datei-Inhalt zu erraten ("sniffen"). Content
    Security Policy (CSP) ist ein HTTP-Response-Header, mit dem WebsiteAdministratoren zugelassene Content-Quellen deklarieren
    können, die Browser auf dieser Seite laden dürfen. Es handelt sich um einen Mechanismus zur Erkennung und Minderung bestimmter
    Angriffstypen, einschließlich Cross-Site Scripting (XSS) und Data-Injection-Angriffen. Darüber hinaus ist die CSP-Direktive
    frame-ancestors der moderne Ersatz für den X-Frame-Options-Header, um Clickjacking zu verhindern.
  rationale: Die Implementierung des X-Content-Type-Options-Headers mit der nosniffDirektive hilft, Drive-by-Download-Angriffe
    zu verhindern, bei denen ein User Agent den Inhaltstyp einer Response per Content Sniffing ermittelt. Dieser Header verhindert
    Angriffe durch "MIME-Type-Confusion". Ohne diesen Header könnten Browser eine als Text deklarierte Datei (z. B. snippet.txt)
    als ausführbar interpretieren, wenn sie Script-Code enthält. Das Setzen der nosniff-Direktive zwingt den Browser, die
    Datei abzulehnen, wenn der deklarierte Typ nicht mit dem Kontext übereinstimmt, in dem sie geladen wird (z. B. das Laden
    einer Textdatei als Script). Eine robuste CSP reduziert die Angriffsfläche einer Webanwendung erheblich. Durch die Einschränkung
    der Domains, von denen Scripts, Styles, Bilder und andere Ressourcen geladen werden können, neutralisiert sie wirksam
    viele XSS-Vektoren. Zusätzlich steuert die Direktive frame-ancestors explizit, welche übergeordneten Seiten die Anwendung
    einbetten dürfen (z. B. über <iframe>), und bietet damit einen flexibleren Schutz gegen Clickjacking als der veraltete
    X-Frame-OptionsHeader.
  impact: 'Geringes Risiko: In seltenen Fällen können Legacy-Anwendungen oder falsch konfigurierte Server darauf angewiesen
    sein, dass der Browser falsche Content-TypeHeader korrigiert (z. B. JavaScript, das mit einem text/plain-Header ausgeliefert
    wird). Die Aktivierung von nosniff führt bei diesen Anwendungen zu Fehlern, da der Browser die Ausführung des Skripts
    verweigert. Korrekte MIME-Typen in der NGINXKonfiguration (mime.types) sind eine Grundvoraussetzung. Die Implementierung
    einer strikten CSP ist komplex und birgt ein hohes Risiko, die Funktionalität der Anwendung zu beeinträchtigen. Wenn eine
    legitime Ressource (z. B. ein CDN-Skript, eine Schriftartendatei oder ein Inline-Skript) nicht auf der Whitelist steht,
    wird der Browser sie blockieren, was die Seite potenziell unbrauchbar macht. Die Implementierung der CSP sollte stets
    im „Report-Only“-Modus (ContentSecurity-Policy-Report-Only) beginnen, sodass vor der Durchsetzung der Richtlinie erst
    einmal Fehlermeldungen gesammelt werden können.'
  references:
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/XContent-Type-Options
  - 2. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  - 1. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  - 2. https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sh
  page_start: 150
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration zu prüfen:

    nginx -T 2>/dev/null | grep -i ''X-Content-Type-Options''

    Überprüfen Sie die Ausgabe:

    Vergewissern Sie sich, dass die Konfiguration folgende Zeile enthält:

    add_header X-Content-Type-Options "nosniff" always;

    Prüfen Sie insbesondere, ob der Parameter always am Ende der Direktive

    vorhanden ist. Ohne ihn fehlt der Header auf Fehlerseiten.

    1. Führen Sie den folgenden Befehl aus, um die CSP-Konfiguration zu

    überprüfen:

    nginx -T 2>/dev/null | grep -i ''Content-Security-Policy''

    2. Bewerten Sie die Richtlinie:

    Ist der Header vorhanden?

    Enthält sie mindestens eine restriktive default-src-Direktive (z. B. ''self'' oder

    ''none'')?

    Enthält sie die Direktive frame-ancestors zur Minderung von Clickjacking?

    Kritisch: Wird auf unsafe-inline oder unsafe-eval in script-src

    verzichtet? (Das Zulassen dieser Parameter schwächt den Schutz erheblich).'
  remediation: 'Öffnen Sie die NGINX-Konfigurationsdatei, die Ihre server-Blöcke enthält. Fügen Sie

    die unten stehende Zeile in Ihren server-Block ein, um den X-Content-TypeOptions-Header hinzuzufügen und Ihren User-Agent
    anzuweisen, Inhaltstypen nicht

    zu sniffen.

    add_header X-Content-Type-Options "nosniff" always;

    CSP muss auf die jeweilige Anwendung zugeschnitten werden. Es gibt keine einzelne

    "korrekte" Richtlinie.

    Schritt 1: Baseline-Richtlinie (hohe Sicherheit)

    Beginnen Sie mit einer Richtlinie, die standardmäßig alles verweigert und nur

    Ressourcen vom gleichen Ursprung erlaubt. Sie verhindert außerdem, dass die Website

    von beliebigen Seiten eingebettet wird (Clickjacking-Schutz).

    add_header Content-Security-Policy "default-src ''self''; frame-ancestors ''self'';

    form-action ''self'';" always;

    Schritt 2: Anpassung (Beispiel)

    Wenn Ihre Anwendung Bilder von einem CDN lädt und von einer bestimmten PartnerWebsite eingebettet werden können muss:

    add_header Content-Security-Policy "default-src ''self''; img-src ''self''

    https://cdn.example.com; frame-ancestors ''self'' https://partner-site.com;" always;

    Hinweis: Verwenden Sie während der Testphase Content-Security-PolicyReport-Only, um Ihre Richtlinie zu debuggen, ohne
    die Website zu beeinträchtigen.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i 'X-Content-Type-Options' && nginx -T 2>/dev/null | grep -i 'Content-Security-Policy'
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration zu prüfen:

      nginx -T 2>/dev/null | grep -i ''X-Content-Type-Options''

      Überprüfen Sie die Ausgabe:

      Vergewissern Sie sich, dass die Konfiguration folgende Zeile enthält:

      add_header X-Content-Type-Options "nosniff" always;

      Prüfen Sie insbesondere, ob der Parameter always am Ende der Direktive

      vorhanden ist. Ohne ihn fehl'
- id: 5.3.3
  title: Sicherstellen, dass die Referrer-Policy aktiviert und ordnungsgemäß konfiguriert ist
  scoring: manual
  profile:
  - Level 2
  description: Der HTTP-Header Referrer-Policy steuert, wie viele Referrer-Informationen (gesendet über den Referer-Header)
    in Anfragen enthalten sein sollen. Er ermöglicht es Website-Administratoren, die an Upstream-Server gesendeten Daten zu
    beschränken, wenn ein Benutzer auf einen Link klickt oder eine Ressource lädt. Dies ist eine Datenschutzkontrolle, um
    zu verhindern, dass sensible URL-Parameter oder interne Pfadstrukturen an Dritte weitergegeben (geleakt) werden.
  rationale: URLs enthalten häufig sensible Informationen wie Session-Tokens, Suchanfragen oder Personally Identifiable Information
    (PII) in ihren Query-Parametern. Ohne eine strikte Referrer-Policy wird diese vollständige URL an jede Drittanbieter-Website
    übertragen, die der Benutzer von Ihrer Seite aus besucht, wodurch sensible Daten potenziell auf externen Servern protokolliert
    werden. Die Konfiguration dieses Headers stellt sicher, dass nur die erforderlichen Informationen (z. B. nur die Origin-Domain)
    weitergegeben werden, wodurch die Privatsphäre der Benutzer geschützt und Datenlecks verhindert werden.
  impact: Die Wahl einer zu restriktiven Richtlinie wie no-referrer kann Funktionalitäten beeinträchtigen, die darauf angewiesen
    sind, die Herkunft des Traffics zu kennen, etwa Web-Analytics, Affiliate-Tracking oder Multi-Site-Authentifizierungsabläufe.
    Umgekehrt gibt eine lockere Richtlinie (unsafe-url) private Daten preis. Die empfohlene Richtlinie strict-origin-when-cross-origin
    stellt ein Gleichgewicht dar, indem sie vollständige Referrer-Daten für die interne Navigation beibehält, aber sensible
    Pfadund Query-Daten beim Navigieren zu externen Websites entfernt.
  references:
  - 1. https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.ht
  - 2. https://developer.mozilla.org/enUS/docs/Web/HTTP/Reference/Headers/Referrer-Policy
  page_start: 155
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration zu prüfen:

    nginx -T 2>/dev/null | grep -i ''Referrer-Policy''

    Ergebnisse bewerten:

    Stellen Sie sicher, dass die Direktive add_header Referrer-Policy "..."

    always; vorhanden ist.

    Überprüfen Sie den konfigurierten Wert. Während no-referrer am sichersten

    ist, ist strict-origin-when-cross-origin der weithin akzeptierte

    Standard für das Gleichgewicht zwischen Sicherheit und Funktionalität.

    Stellen Sie sicher, dass der Parameter always vorhanden ist.'
  remediation: 'Fügen Sie die folgende Zeile zu Ihrem server- oder http-Block hinzu. Dieses Beispiel

    verwendet die robuste Standardeinstellung, die den Datenschutz gewährleistet, ohne

    interne Analysen zu beeinträchtigen.

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    Wenn maximale Privatsphäre erforderlich ist und selbst für interne Links keine

    Referrer-Daten benötigt werden:

    add_header Referrer-Policy "no-referrer" always;'
