- id: 2.4.1
  title: Sicherstellen, dass NGINX für Netzwerkverbindungen nur auf autorisierten Ports lauscht
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: NGINX sollte so konfiguriert sein, dass es nur auf autorisierten Ports und Protokollen lauscht. Während traditionelles
    HTTP/1.1 und HTTP/2 die TCP-Ports 80 und 443 verwenden, nutzt modernes HTTP/3 (QUIC) den UDP-Port 443. Indem sichergestellt
    wird, dass NGINX nur an zugelassene Schnittstellen und Ports bindet, wird die Angriffsfläche minimiert.
  rationale: Das Begrenzen der Listening-Ports auf autorisierte Werte stellt sicher, dass keine versteckten oder unbeabsichtigten
    Dienste über NGINX exponiert werden. Es erzwingt außerdem eine strikte Kontrolle darüber, welche Protokolle (TCP vs. UDP)
    zugänglich sind. Dies ist besonders wichtig mit der Einführung von UDP-basiertem HTTP/3-Traffic neben traditionellem TCP-Traffic.
  impact: Das Deaktivieren ungenutzter Ports reduziert das Risiko unautorisierten Zugriffs. Administratoren müssen sich jedoch
    bewusst sein, dass das Deaktivieren von UDP-Port 443 die HTTP/3-Konnektivität unterbricht und Clients dazu zwingt, auf
    langsameres TCP-basiertes HTTP/2 oder HTTP/1.1 zurückzufallen.
  references:
  - 1. NIST SP 800-53:rev5:CM-7 b
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 51
  audit_raw: "1. Konfiguration prüfen:\nFühren Sie den folgenden Befehl aus, um alle listen-Direktiven in der geladenen\n\
    Konfiguration zu prüfen:\nnginx -T 2>/dev/null | grep -r \"listen\"\nPrüfung:\nPrüfen Sie die Ausgabe auf nicht zugelassene\
    \ Ports. Eine moderne sichere\nKonfiguration enthält typischerweise:\nlisten 80;  (TCP) - Häufig nur für die Weiterleitung\
    \ zu HTTPS verwendet.\nlisten 443 ssl;  (TCP) - Für HTTP/1.1 und HTTP/2.\nlisten 443 quic;  (UDP) - Für HTTP/3 (QUIC).\n\
    Beispielausgabe:\nserver {\n    listen  80;\n    listen 443 ssl;\n    listen 443 quic reuseport; # HTTP/3 (UDP)\n    ...\n\
    }\nStellen Sie sicher, dass keine anderen Ports (z. B. 8080, 8443) offen sind, es sei denn,\nsie sind ausdrücklich für\
    \ interne Dienste oder Management-Interfaces autorisiert.\n2. Lauschende Ports auf Betriebssystemebene verifizieren:\n\
    Optional können Sie auf Betriebssystemebene prüfen, an welche Adressen und Ports\nder Prozess tatsächlich gebunden ist.\n\
    netstat -tulpen | grep -i nginx\nSuchen Sie nach tcp-Zeilen für Standard-Traffic.\nSuchen Sie nach udp-Zeilen (z. B. *:443),\
    \ falls HTTP/3 aktiviert ist."
  remediation: "Entfernen oder kommentieren Sie alle listen-Direktiven aus, die an nicht zugelassene\nPorts binden.\nFür HTTP/3\
    \ (QUIC)-Support: Stellen Sie sicher, dass Sie UDP-Port 443 zusätzlich zu\nTCP-Port 443 ausdrücklich zulassen und konfigurieren.\n\
    server {\n    # Standard HTTPS (TCP)\n    listen 443 ssl;\n    # HTTP/3 (UDP)\n    listen 443 quic reuseport;\n    # ...\
    \ SSL/TLS-Konfiguration ...\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -r "listen" && netstat -tulpen | grep -i nginx
    expected: ''
    severity: medium
    info: '1. Konfiguration prüfen:

      Führen Sie den folgenden Befehl aus, um alle listen-Direktiven in der geladenen

      Konfiguration zu prüfen:

      nginx -T 2>/dev/null | grep -r "listen"

      Prüfung:

      Prüfen Sie die Ausgabe auf nicht zugelassene Ports. Eine moderne sichere

      Konfiguration enthält typischerweise:

      listen 80;  (TCP) - Häufig nur für die Weiterleitung zu HTTPS verwendet.

      listen 443 ssl;  (TCP) - Für HTTP/1.1'
- id: 2.4.2
  title: Sicherstellen, dass Anfragen für unbekannte Hostnamen abgelehnt werden
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: NGINX leitet eingehende Anfragen an den passenden virtuellen Host weiter, indem der Host-Header (HTTP/1.1)
    oder der :authority-Pseudo-Header (HTTP/2, HTTP/3) mit den server_name-Direktiven in Ihrer Konfiguration abgeglichen wird.
    Wenn keine explizite Übereinstimmung gefunden wird, fällt NGINX auf den zuerst definierten server-Block oder auf den als
    default_server markierten Block zurück. Ohne einen korrekt konfigurierten Catch-All-Block, der unbekannte Hostnamen ablehnt,
    antwortet Ihr Server auf beliebige Domainnamen, die zufällig auf Ihre IP-Adresse zeigen, wodurch potenziell interne Anwendungen
    exponiert oder Host-Header-Angriffe ermöglicht werden.
  rationale: Wenn NGINX eine Anfrage empfängt, wählt es den virtuellen Host basierend auf dem Host-Header (oder :authority
    in HTTP/2/3) aus. Wenn Anfragen für unbekannte Hostnamen nicht explizit abgelehnt werden, können Ihre Anwendungen für
    beliebige Domains ausgeliefert werden, die einfach auf Ihre IP zeigen. Dieses Verhalten kann bei Host-Header-Angriffen
    missbraucht werden und erschwert es, legitimen Traffic von automatisierten Scans oder fehlgeleiteten Anfragen in Ihren
    Logs zu unterscheiden.
  impact: Clients, die direkt über die IP-Adresse oder einen nicht konfigurierten CNAME-Eintrag auf den Server zugreifen,
    werden abgelehnt. Dies ist ein beabsichtigtes Verhalten, es erfordert jedoch, dass alle gültigen Domains explizit in ihren
    eigenen server-Blöcken definiert sind.
  references:
  - 1. https://nginx.org/en/docs/http/request_processing.html
  - 2. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host
  page_start: 54
  audit_raw: '1. Konfiguration prüfen:

    Prüfen Sie, ob ein standardmäßiger server-Block vorhanden ist, der unbekannte

    Hosts behandelt.

    nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"

    Prüfung:

    Vergewissern Sie sich, dass ein server-Block mit listen ...

    default_server existiert.

    Verifizieren Sie, dass er return 444;  (schließt die Verbindung) oder einen

    4xx-Fehlercode enthält.

    Für HTTPS/TLS: Verifizieren Sie, dass ssl_reject_handshake on;

    verwendet wird, um Certificate Leakage zu verhindern.

    2. Funktionaler Test:

    Senden Sie eine Anfrage mit einem ungültigen Host-Header und verifizieren Sie, dass

    die Verbindung abgelehnt wird oder einen Fehler zurückgibt.

    # HTTPS testen (Connection Reset oder 4xx erwartet)

    curl -k -v https://127.0.0.1 -H ''Host: invalid.example.com'''
  remediation: "Konfigurieren Sie einen \"Catch-All\" Standard server-Block als ersten Block in Ihrer\nKonfiguration (oder\
    \ markieren Sie ihn explizit mit default_server).\nKonfigurationsbeispiel (moderner Standard mit TLS/HTTP3):\nserver {\n\
    \    # Auf Standardports für IPv4 und IPv6 lauschen\n    listen      80  default_server;\n    listen [::]:80  default_server;\n\
    \    # Auf HTTPS (TCP) und QUIC (UDP) lauschen\n    listen      443 ssl  default_server;\n    listen [::]:443 ssl  default_server;\n\
    \    listen      443 quic default_server;\n    listen [::]:443 quic default_server;\n    # SSL-Handshake für unbekannte\
    \ Domains ablehnen (verhindert Cert Leakage)\n    ssl_reject_handshake on;\n    # Catch-All-Name\n    server_name _;\n\
    \    # Verbindung ohne Antwort schließen (nicht standardisierter Code 444)\n    return 444;\n}\nNachdem dieser Block hinzugefügt\
    \ wurde, stellen Sie sicher, dass alle Ihre gültigen\nAnwendungen eigene server-Blöcke mit expliziten server_name-Direktiven\n\
    aufweisen."
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"
    expected: ''
    severity: medium
    info: '1. Konfiguration prüfen:

      Prüfen Sie, ob ein standardmäßiger server-Block vorhanden ist, der unbekannte

      Hosts behandelt.

      nginx -T 2>/dev/null | grep -Ei "listen.*default_server|ssl_reject_handshake"

      Prüfung:

      Vergewissern Sie sich, dass ein server-Block mit listen ...

      default_server existiert.

      Verifizieren Sie, dass er return 444;  (schließt die Verbindung) oder einen

      4xx-Fehlercode enthält.

      Für HTT'
- id: 2.4.3
  title: Sicherstellen, dass `keepalive_timeout` auf 10 Sekunden oder weniger, aber nicht auf 0 gesetzt ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Persistente Verbindungen werden von allen modernen Browsern genutzt, um eine bessere Web-Performance zu ermöglichen.
    Der Keep-Alive-Timeout begrenzt die Zeit, die eine persistente Verbindung geöffnet bleiben darf. Das Setzen des Keep-AliveTimeouts
    ermöglicht es, diesen Timeout serverseitig zu steuern.
  rationale: Das Setzen eines Keep-Alive-Timeouts auf Serverseite hilft dabei, Denial-of-ServiceAngriffe abzumildern, die
    zu viele persistente Verbindungen aufbauen und dadurch Serverressourcen erschöpfen.
  impact: ''
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
  - 2. NIST SP 800-53:rev5:SC-10
  page_start: 58
  audit_raw: 'Um die aktuelle Einstellung der keepalive_timeout-Direktive zu prüfen, führen Sie

    den folgenden Befehl aus. Sie sollten außerdem Ihre NGINX-Konfiguration manuell auf

    Include-Statements prüfen, die sich möglicherweise außerhalb des Verzeichnisses

    /etc/nginx befinden. Wenn keine dieser Angaben vorhanden ist, ist der Wert auf den

    Standardwert gesetzt.

    grep -ir keepalive_timeout /etc/nginx

    Die Ausgabe des Befehls sollte etwas Ähnliches wie Folgendes enthalten:

    keepalive_timeout 10;'
  remediation: 'Suchen Sie den http- oder server-Block Ihrer NGINX-Konfiguration und fügen Sie

    die keepalive_timeout-Direktive hinzu. Setzen Sie sie auf 10 Sekunden oder

    weniger, aber nicht auf 0. Dieser Beispielbefehl setzt sie auf 10 Sekunden:

    keepalive_timeout 10;'
  checks:
  - type: command
    command: grep -ir keepalive_timeout /etc/nginx
    expected: ''
    severity: medium
    info: 'Um die aktuelle Einstellung der keepalive_timeout-Direktive zu prüfen, führen Sie

      den folgenden Befehl aus. Sie sollten außerdem Ihre NGINX-Konfiguration manuell auf

      Include-Statements prüfen, die sich möglicherweise außerhalb des Verzeichnisses

      /etc/nginx befinden. Wenn keine dieser Angaben vorhanden ist, ist der Wert auf den

      Standardwert gesetzt.

      grep -ir keepalive_timeout /etc/nginx

      Die Ausgabe'
