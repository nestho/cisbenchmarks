- id: 4.1.6
  title: Bewusstsein für neue Diffie-Hellman-Parameter in TLS 1.3 sicherstellen
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Diese Empfehlung ist nicht auf Umgebungen anwendbar, die ausschließlich TLS 1.3 verwenden.
  rationale: Das TLS-1.3-Protokoll (RFC 8446) stuft die Verwendung benutzerdefinierter FiniteField-Diffie-Hellman-Gruppen
    (DHE) als veraltet ein, die in NGINX über die Direktive ssl_dhparam konfiguriert wurden. Stattdessen verwendet TLS 1.3
    für seinen Schlüsselaustausch-Mechanismus ausschließlich eine Reihe vordefinierter, standardisierter und sicherer Elliptic-Curve-
    (ECDHE) und Finite-Field-Gruppen (FFDHE). Dieses Design eliminiert das Risiko schwacher oder falsch konfigurierter benutzerdefinierter
    DH-Parameter. Daher hat die Direktive ssl_dhparam in einer reinen TLS-1.3-Konfiguration keine Wirkung.
  impact: Keine bei einer reinen TLS-1.3-Konfiguration.
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc8446#page-95
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_dhparam
  page_start: 104
  audit_raw: 'Verifizieren Sie, dass die Konfiguration nicht auf TLS 1.2 oder ältere Protokolle

    angewiesen ist, die diese Einstellung erfordern würden. Diese Empfehlung gilt implizit

    als erfüllt, wenn Empfehlung 4.1.4 ("Sicherstellen, dass nur moderne TLS-Protokolle

    verwendet werden") ausschließlich für TLS 1.3 konfiguriert ist.'
  remediation: 'Es ist keine Remediation erforderlich. Stellen Sie sicher, dass ssl_protocols

    TLSv1.3; gesetzt ist. Die Direktive ssl_dhparam sollte entfernt werden, da sie

    obsolet ist.'
  checks:
  - type: manual_review
    info: 'Verifizieren Sie, dass die Konfiguration nicht auf TLS 1.2 oder ältere Protokolle

      angewiesen ist, die diese Einstellung erfordern würden. Diese Empfehlung gilt implizit

      als erfüllt, wenn Empfehlung 4.1.4 ("Sicherstellen, dass nur moderne TLS-Protokolle

      verwendet werden") ausschließlich für TLS 1.3 konfiguriert ist.'
    severity: medium
- id: 4.1.7
  title: Sicherstellen, dass Online Certificate Status Protocol (OCSP)-Stapling aktiviert ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: OCSP-Stapling ermöglicht es einem Server, dem Client effizient Informationen zum Zertifikatswiderruf bereitzustellen,
    was die Leistung und den Datenschutz verbessert. Der Server speichert die OCSP-Antwort der Zertifizierungsstelle (CA)
    zwischen, sodass der Client keine separate Verbindung herstellen muss. Für eine robuste Sicherheit sollten Zertifikate
    mit der Erweiterung OCSP-Must-Staple ausgestellt werden, welche das traditionelle "Soft-Fail"-Verhalten in ein "Hard-Fail"
    umwandelt und sicherstellt, dass Clients immer einen aktuellen Widerrufsstatus erhalten und validieren. HTTP Strict Transport
    Security (HSTS) ist ein kritischer Security-Header, der Browser anweist, mit einer Domain ausschließlich über HTTPS zu
    kommunizieren. Eine umfassende HSTS-Richtlinie muss die includeSubDomains-Direktive enthalten, um die Richtlinie auf alle
    aktuellen und zukünftigen Subdomains anzuwenden. Für maximalen Schutz sollte die Richtlinie außerdem die preload-Direktive
    enthalten, damit die Domain bei Browser-Preload-Listen eingereicht werden kann. Dadurch wird sichergestellt, dass selbst
    die allererste Verbindung zur Domain sicher hergestellt wird. max-age sollte auf eine lange Dauer gesetzt werden, typischerweise
    zwei Jahre (63072000 Sekunden), damit Browser diese Richtlinie dauerhaft erzwingen.
  rationale: OCSP-Stapling ist ein kritischer Mechanismus zur Verteilung des Zertifikatswiderrufsstatus. Ohne diesen Mechanismus
    sind sich Clients möglicherweise nicht bewusst, dass das Zertifikat eines Servers kompromittiert wurde, was potenzielle
    Man-in-the-Middle-Angriffe ermöglicht. Die Erweiterung OCSP-Must-Staple ist unerlässlich, da sie die inhärente Schwäche
    des optionalen OCSP ("Soft-Fail") mindert, bei dem ein Browser möglicherweise eine Verbindung fortsetzt, wenn er keine
    OCSPStaple-Antwort erhält. Durch die Durchsetzung eines "Hard-Fail" stellt Must-Staple sicher, dass ein kompromittiertes
    Zertifikat zuverlässig blockiert werden kann. HSTS ist der primäre Mechanismus zur Eindämmung von Protocol-DowngradeAngriffen
    und Cookie-Hijacking. Durch die Durchsetzung von HTTPS verhindert es, dass Angreifer Anfragen abfangen und manipulieren.
    Die Direktive includeSubDomains ist unerlässlich, da sie eine erhebliche Lücke schließt, über die ein Angreifer andernfalls
    eine unsichere Subdomain ins Visier nehmen könnte. Die Direktive preload bietet Schutz, indem sie das anfängliche Zeitfenster
    für einen Angriff beim ersten Besuch eines Benutzers schließt, da der Browser bereits vor dem Aufbau einer jeglichen Verbindung
    weiß, dass er HTTPS verwenden muss.
  impact: Wenn OCSP-Must-Staple verwendet wird, führt eine Fehlkonfiguration auf dem Server (z. B. eine Firewall, die ausgehende
    OCSP-Abfragen blockiert, oder ein falscher DNSResolver) dazu, dass Clients das Zertifikat ablehnen und die Verbindung
    verweigern, was zu einem Dienstausfall führt. Dieses "Hard-Fail"-Verhalten ist aus Sicherheitsgründen beabsichtigt, erfordert
    jedoch eine sorgfältige Konfiguration und Überwachung des OCSP-Stapling-Mechanismus. Sobald eine HSTS-Richtlinie mit langer
    max-age gesetzt ist, gibt es faktisch "kein Zurück" mehr. Wenn ein Teil Ihrer Website oder eine Subdomain nicht über HTTPS
    bereitgestellt werden kann, können Benutzer mit einer gecachten HSTS-Richtlinie nicht mehr darauf zugreifen. Das Aktivieren
    von includeSubDomains erfordert die verbindliche Zusage, dass alle Subdomains der Domain HTTPS unterstützen. Das Einreichen
    einer Domain in die HSTS-Preload-Liste ist eine langfristige Festlegung, und die Entfernung ist ein langsamer, manueller
    Prozess. Sorgfältige Planung und Tests mit kurzen max-age-Werten sind vor der vollständigen Bereitstellung somit unerlässlich.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_stapling
  - 2. https://datatracker.ietf.org/doc/html/rfc6066
  - 1. https://hstspreload.org
  - 2. https://tools.ietf.org/html/rfc6797
  page_start: 106
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die vier erforderlichen
    Direktiven zu prüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (ssl_stapling|ssl_stapling_verify|ssl_trusted_certificate|resolver)''

    Vergewissern Sie sich, dass die Ausgabe die folgenden Direktiven mit geeigneten

    Werten innerhalb der relevanten http- oder server-Blöcke enthält:

    ssl_stapling on;

    ssl_stapling_verify on;

    ssl_trusted_certificate /path/to/your/chain.pem;

    resolver A.B.C.D;

    Wenn eine dieser vier Direktiven fehlt, ist diese Empfehlung nicht vollständig umgesetzt.

    Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf den Strict-Transport-Security-Header
    zu prüfen:

    nginx -T 2>/dev/null | grep -i ''Strict-Transport-Security''

    Stellen Sie sicher, dass die Ausgabe einen Header mit den folgenden Komponenten

    enthält:

    Eine max-age-Direktive von mindestens 31536000 (ein Jahr), wobei 63072000

    (zwei Jahre) der empfohlene Wert ist.

    Die includeSubDomains-Direktive.

    Den Parameter always am Ende der add_header-Direktive.

    Beispielausgabe:

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;'
  remediation: "Befolgen Sie dieses Verfahren, um eine robuste OCSP-Stapling-Konfiguration zu\naktivieren:\n1. Fordern Sie\
    \ bei der Ausstellung eines Zertifikats an, dass die OCSP-MustStaple-Erweiterung enthalten ist.\n2. Bearbeiten Sie Ihre\
    \ NGINX-Konfiguration so, dass alle vier erforderlichen\nDirektiven enthalten sind. Die Direktive ssl_trusted_certificate\
    \ muss auf\neine Datei verweisen, die Ihre Root- und Intermediate-Zertifikate enthält. Der\nResolver muss auf einen oder\
    \ mehrere vertrauenswürdige DNS-Resolver gesetzt\nwerden.\n# Beispiel für einen server-Block\nserver {\n    # ... andere\
    \ Direktiven ...\n    # OCSP Stapling\n    ssl_stapling             on;\n    ssl_stapling_verify      on;\n    # Pfad\
    \ zur Zertifikatskette (Root CA + Intermediates) für die Verifizierung\n    ssl_trusted_certificate  /etc/nginx/ssl/full_chain.pem;\n\
    \    # DNS-Resolver, damit NGINX den OCSP-Server der CA abfragen kann\n    resolver                 8.8.8.8  1.1.1.1 \
    \ valid=300s;\n}\nEs ist von entscheidender Bedeutung, HSTS schrittweise bereitzustellen, um zu\nvermeiden, dass Benutzer\
    \ ausgesperrt werden.\nSchritt 1: Initialer Rollout (niedrige max-age)\nFügen Sie den HSTS-Header mit einem sehr kurzen\
    \ max-age hinzu, um zu testen, ob\netwaige Probleme auftreten. Stellen Sie sicher, dass alle Teile Ihrer Website,\neinschließlich\
    \ aller Subdomains, über HTTPS korrekt funktionieren.\n# Test mit 5 Minuten\nadd_header Strict-Transport-Security \"max-age=300;\
    \ includeSubDomains\" always;\nSchritt 2: max-age erhöhen\nSobald Sie sich sicher sind, erhöhen Sie schrittweise das max-age.\n\
    # Auf 1 Woche erhöhen\nadd_header Strict-Transport-Security \"max-age=604800; includeSubDomains\" always;\nSchritt 3:\
    \ Vollständige Bereitstellung (Langes max-age und Preload)\nNach gründlichen Tests (z. B. einen Monat) setzen Sie max-age\
    \ auf den empfohlenen\nfinalen Wert von zwei Jahren. Fügen Sie die preload-Direktive hinzu, wenn Sie\nbeabsichtigen, Ihre\
    \ Website bei der HSTS-Preload-Liste einzureichen.\n# Finale Konfiguration (2 Jahre)\nadd_header Strict-Transport-Security\
    \ \"max-age=63072000; includeSubDomains;\npreload\" always;\nWenn Preloading gewünscht ist, reichen Sie Ihre Domain unter\
    \ hstspreload.org ein."
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s* && nginx -T 2>/dev/null | grep -i 'Strict-Transport-Security'
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die vier erforderlichen
      Direktiven zu prüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (ssl_stapling|ssl_stapling_verify|ssl_trusted_certificate|resolver)''

      Vergewissern Sie sich, dass die Ausgabe die folgenden Direktiven mit geeigneten

      Werten innerhalb der relevanten http- oder server-Blöcke enthält:

      ssl_stapling o'
- id: 4.1.9
  title: Sicherstellen, dass Upstream-Server-Traffic mit einem Client-Zertifikat authentifiziert wird
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: In einer Reverse-Proxy-Konfiguration fungiert NGINX als Client, wenn er mit einem Upstream-Server kommuniziert.
    Um diese Server-zu-Server-Verbindung auf Basis eines Zero-Trust-Prinzips abzusichern, muss mutual TLS (mTLS) verwendet
    werden. Dies wird erreicht, indem NGINX so konfiguriert wird, dass er dem Upstream-Server sein eigenes Client-Zertifikat
    präsentiert. Der Upstream-Server authentifiziert NGINX dann anhand dieses Zertifikats und stellt so sicher, dass nur vertrauenswürdige
    Proxies auf Backend-Dienste zugreifen können.
  rationale: Die Authentifizierung der Proxy-Verbindung zum Upstream-Server über ein Clientzertifikat bietet einen starken,
    kryptografischen Identitätsnachweis. Dies ist schwächeren Authentifizierungsmethoden wie IP-Whitelisting, die gefälscht
    werden können, weit überlegen. In einer modernen Microservices- oder Cloud-Umgebung ist mTLS ein Eckpfeiler der Netzwerksicherheit,
    da es verhindert, dass unautorisierte Dienste Anfragen an sensible Backends stellen, und somit Lateral-Movement-Angriffe
    abschwächt.
  impact: Die Implementierung von mTLS führt zu betrieblichem Mehraufwand für die Zertifikatsverwaltung. Sie müssen über einen
    Prozess (oft eine interne Public Key Infrastructure, kurz PKI) für die Ausstellung, Erneuerung und den Widerruf dieser
    Clientzertifikate verfügen. Wenn das von NGINX verwendete Clientzertifikat abläuft oder wenn das CA-Zertifikat auf dem
    Upstream-Server abläuft, schlägt die Verbindung zwischen NGINX und dem Upstream fehl, was zu einem Dienstausfall führt.
  references:
  - 1. https://docs.nginx.com/nginx-instance-manager/system-configuration/securetraffic/
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_ssl_certificate
  page_start: 112
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die erforderlichen Direktiven
    zu prüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (proxy_ssl_certificate|proxy_ssl_certificate_key)''

    Vergewissern Sie sich, dass die Ausgabe sowohl die Direktive

    proxy_ssl_certificate als auch die Direktive proxy_ssl_certificate_key

    mit den korrekten Pfaden innerhalb des relevanten location-Blocks enthält.

    Hinweis: Ein vollständiges Audit ist zweiseitig. Sie müssen auch sicherstellen, dass der

    Upstream-Server so konfiguriert ist, dass er Clientzertifikate anfordert und gegen eine

    vertrauenswürdige CA validiert. Dieser Teil des Audits liegt außerhalb des

    Geltungsbereichs der NGINX-Konfiguration selbst.'
  remediation: "Die Implementierung von mTLS erfordert die Konfiguration sowohl auf dem NGINXProxy (dem Client) als auch auf\
    \ dem Upstream-Server (dem Server). Dieses Beispiel\ngeht davon aus, dass Sie über eine einfache interne CA verfügen.\n\
    Voraussetzung: Eine CA erstellen\n# CA-Schlüssel erstellen\nopenssl genrsa -out my-ca.key 4096\n# CA-Zertifikat erstellen\n\
    openssl req -x509 -new -nodes -key my-ca.key -sha256 -days 3650 -out my-ca.crt\nSchritt 1: Den Upstream-Server so konfigurieren,\
    \ dass Client-Zertifikate\nerforderlich sind\nDer Upstream-Server muss so konfiguriert werden, dass er Clientzertifikate\
    \ anfordert\nund gegen Ihre CA verifiziert. (Wenn Ihr Upstream ebenfalls NGINX ist, sähe die\nKonfiguration wie folgt\
    \ aus):\n# In der Konfiguration des Upstream-Servers\nserver {\n    listen 443 ssl;\n    # ... other ssl directives ...\n\
    \    ssl_client_certificate  /path/to/my-ca.crt; # Die CA für die Verifizierung\n    ssl_verify_client on;           \
    \            # Ein gültiges Clientzertifikat\nerfordern\n}\nSchritt 2: Ein Client-Zertifikat für NGINX erstellen und signieren\n\
    Erstellen Sie auf Ihrem NGINX-Proxy einen Schlüssel und eine\nZertifikatsignierungsanfrage (Certificate Signing Request,\
    \ CSR).\n# Einen Schlüssel für den NGINX-Proxy erstellen\nopenssl genrsa -out      nginx-client.key 4096\n# CSR erstellen\n\
    openssl req    -new -key nginx-client.key -out nginx-client.csr\nSignieren Sie diesen CSR mit Ihrer CA, um das Client-Zertifikat\
    \ zu erstellen:\nopenssl x509  -req -in nginx-client.csr -CA my-ca.crt -CAkey my-ca.key -\nCAcreateserial -out nginx-client.crt\
    \ -days 365\nSchritt 3: NGINX so konfigurieren, dass es sein Client-Zertifikat präsentiert\nVerwenden Sie in Ihrer NGINX-Reverse-Proxy-Konfiguration\
    \ das erzeugte ClientZertifikat und den zugehörigen Schlüssel.\n# In Ihrem Reverse-Proxy-Location-Block\nlocation /api/\
    \ {\n    proxy_pass                 https://your-upstream-server;\n    # Dieses Client-Zertifikat dem Upstream präsentieren\n\
    \    proxy_ssl_certificate     /etc/nginx/ssl/nginx-client.crt;\n    proxy_ssl_certificate_key /etc/nginx/ssl/nginx-client.key;\n\
    }"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die erforderlichen Direktiven
      zu prüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (proxy_ssl_certificate|proxy_ssl_certificate_key)''

      Vergewissern Sie sich, dass die Ausgabe sowohl die Direktive

      proxy_ssl_certificate als auch die Direktive proxy_ssl_certificate_key

      mit den korrekten Pfaden innerhalb des relevanten l'
- id: 4.1.10
  title: Sicherstellen, dass dem Zertifikat des Upstream-Servers vertraut wird
  scoring: manual
  profile:
  - Level 2
  - Level 2
  description: Wenn NGINX als Reverse Proxy fungiert, muss es so konfiguriert werden, dass es als sicherer TLS-Client arbeitet.
    Dies erfordert die Validierung der Identität des UpstreamServers, indem dessen Zertifikat gegen eine vertrauenswürdige
    Certificate Authority (CA) verifiziert wird. Darüber hinaus muss NGINX sicherstellen, dass der Hostname des Upstream-Servers
    mit dem Namen (Subject Name / SAN) im Zertifikat selbst übereinstimmt.
  rationale: Ohne ordnungsgemäße Validierung vertraut NGINX der Identität des Upstream-Servers blind, wodurch es anfällig
    für Man-in-the-Middle-Angriffe (MitM) innerhalb des internen Netzwerks wird. Ein Angreifer könnte sich als legitimer Backend-Dienst
    ausgeben und sensiblen Traffic abfangen. Durch das Erzwingen der Zertifikatsvalidierung (proxy_ssl_verify) und der Hostname-Verifizierung
    (proxy_ssl_name) stellt NGINX sicher, dass es mit dem beabsichtigten, authentischen Upstream-Server kommuniziert.
  impact: Die Aktivierung einer strikten Upstream-Verifizierung führt zu einer Abhängigkeit vom Zertifikats-Lebenszyklusmanagement.
    Wenn das Zertifikat des Upstream-Servers abläuft oder falsch konfiguriert ist oder wenn die CA-Zertifikatsdatei auf dem
    NGINXServer veraltet ist, weigert sich NGINX, eine Verbindung zum Upstream herzustellen, was zu einem Dienstausfall führt.
    Dieses Verhalten ist beabsichtigt und sichert die Verbindung ab, erfordert jedoch ein sorgfältiges Zertifikatsmanagement.
  references:
  - 1. https://docs.nginx.com/nginx/admin-guide/security-controls/securing-http-trafficupstream/
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_ssl_trusted_ce
  page_start: 116
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die drei erforderlichen
    Direktiven innerhalb des relevanten Proxylocation-Blocks zu überprüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (proxy_ssl_verify|proxy_ssl_trusted_certificate|proxy_ssl_name)''

    Stellen Sie sicher, dass die Ausgabe die folgenden Direktiven enthält:

    proxy_ssl_verify on;

    proxy_ssl_trusted_certificate /path/to/ca.crt;

    proxy_ssl_name your-upstream-hostname.com;

    Wenn eine dieser drei Direktiven fehlt, ist diese Empfehlung nicht vollständig

    umgesetzt. Stellen Sie außerdem manuell sicher, dass das von

    proxy_ssl_trusted_certificate referenzierte Zertifikat das korrekte, gültige CAZertifikat für Ihre Upstream-Dienste ist.'
  remediation: "Um die Upstream-Validierung sicher zu konfigurieren, müssen Sie das CA-Zertifikat\nbeziehen, mit dem das Zertifikat\
    \ Ihres Upstream-Servers signiert wurde.\n1. Platzieren Sie das CA-Zertifikat (z. B. upstream_ca.crt) in einem sicheren\n\
    Verzeichnis auf dem NGINX-Server (z. B. /etc/nginx/ssl/).\n2. Fügen Sie in dem location-Block, der den Datenverkehr weiterleitet,\
    \ die\nfolgenden drei Direktiven hinzu. Die Direktive proxy_ssl_name muss mit dem\nin der Direktive proxy_pass verwendeten\
    \ Hostnamen übereinstimmen.\nlocation /api/ {\n    proxy_pass                     https://your-upstream-hostname.com;\n\
    \    # 1. Verifizierung aktivieren\n    proxy_ssl_verify               on;\n    # 2. Die CA angeben, der für die Verifizierung\
    \ vertraut wird\n    proxy_ssl_trusted_certificate  /etc/nginx/ssl/upstream_ca.crt;\n    # 3. Verifizieren, dass der Name\
    \ des Zertifikats mit dem Hostnamen des Servers\nübereinstimmt\n    proxy_ssl_name                 your-upstream-hostname.com;\n\
    }"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die drei erforderlichen
      Direktiven innerhalb des relevanten Proxylocation-Blocks zu überprüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (proxy_ssl_verify|proxy_ssl_trusted_certificate|proxy_ssl_name)''

      Stellen Sie sicher, dass die Ausgabe die folgenden Direktiven enthält:

      proxy_ssl_verify on;

      proxy_ssl_trusted_cert'
- id: 4.1.11
  title: Sicherstellen, dass Secure Session Resumption aktiviert ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: TLS 1.3 führt einen sicheren Session-Resumption-Mechanismus unter Verwendung von Pre-Shared Keys (PSKs) ein,
    der die Performance für wiederkehrende Clients deutlich verbessert, indem die Handshake-Latenz reduziert wird. Dieser
    moderne Mechanismus sollte aktiviert werden, um die Benutzererfahrung zu verbessern, ohne die Sicherheit zu beeinträchtigen.
  rationale: Im Gegensatz zu älteren TLS-Versionen erhält der TLS-1.3-Resumption-Mechanismus Perfect Forward Secrecy (PFS)
    aufrecht. Dies wird erreicht, indem der PSK für jede wiederaufgenommene Session mit einem frischen Ephemeral-Diffie-HellmanSchlüsselaustausch
    (ECDHE) kombiniert wird. Dadurch wird sichergestellt, dass eine Kompromittierung des Resumption-Schlüssels keine vergangenen
    oder zukünftigen Session-Schlüssel kompromittiert. Das Deaktivieren dieser Funktion bietet keinen Sicherheitsvorteil und
    wirkt sich negativ auf die Performance aus.
  impact: Das Aktivieren von Session Resumption wirkt sich positiv auf die Performance aus. Bei Verwendung einer reinen TLS-1.3-Konfiguration
    bestehen keine wesentlichen negativen Auswirkungen auf die Sicherheit.
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc8446
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_session_tickets
  page_start: 119
  audit_raw: 'Führen Sie den folgenden Befehl aus, um zu verifizieren, dass

    ssl_session_tickets nicht explizit auf off gesetzt ist.

    # Dieser Befehl sollte KEINE Ausgabe erzeugen.

    grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"

    Wenn der Befehl eine Ausgabe erzeugt, die ssl_session_tickets off;  enthält, ist

    diese Empfehlung nicht umgesetzt.'
  remediation: 'Stellen Sie sicher, dass ssl_session_tickets nicht auf off gesetzt ist. Der

    empfohlene Ansatz besteht darin, die Direktive vollständig zu entfernen, da der

    Standardwert on ist.

    Wenn die Direktive vorhanden ist, entfernen Sie diese entweder oder setzen Sie sie auf

    on:

    # ENTFERNEN Sie diese Zeile aus Ihrer Konfiguration:

    # ssl_session_tickets off;

    # ODER, wenn Sie explizit sein möchten, stellen Sie sicher, dass sie auf ON

    gesetzt ist (optional):

    ssl_session_tickets  on;'
  checks:
  - type: command
    command: grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um zu verifizieren, dass

      ssl_session_tickets nicht explizit auf off gesetzt ist.

      # Dieser Befehl sollte KEINE Ausgabe erzeugen.

      grep -ir "ssl_session_tickets" /etc/nginx/ | grep -i "off"

      Wenn der Befehl eine Ausgabe erzeugt, die ssl_session_tickets off;  enthält, ist

      diese Empfehlung nicht umgesetzt.'
- id: 4.1.12
  title: Sicherstellen, dass HTTP/3.0 verwendet wird
  scoring: manual
  profile:
  - Level 2
  description: HTTP/2 ist der etablierte Standard für Webkommunikation und bietet durch Multiplexing erhebliche Performance-Vorteile
    gegenüber HTTP/1.1. Für 2025 und darüber hinaus sollte zusätzlich HTTP/3 aktiviert werden. HTTP/3 arbeitet über das QUIC-Protokoll,
    das auf UDP basiert, um Head-of-Line-Blocking zu lösen, die Verbindungsaufbauzeit zu reduzieren und die Performance in
    unzuverlässigen Netzwerken zu verbessern. Beide Protokolle benötigen eine sichere TLS 1.3 Umgebung, um zu funktionieren.
  rationale: Das Aktivieren von HTTP/2 stellt eine moderne Performance-Basis via StreamMultiplexing bereit. Die Aktivierung
    von HTTP/3 bietet einen weiteren Wettbewerbsvorteil, indem es das Head-of-Line-Blocking von TCP abschwächt und einen schnelleren,
    zuverlässigeren Verbindungs-Handshake bietet, was insbesondere für mobile Benutzer vorteilhaft ist. Ein Server, der beide
    Protokolle unterstützt, kann die überwiegende Mehrheit moderner Clients mit der bestmöglichen Leistung und Sicherheit
    bedienen. Die strengen Verschlüsselungsanforderungen beider Protokolle stehen natürlich im Einklang mit einer Richtlinie,
    die ausschließlich TLS 1.3 vorschreibt.
  impact: 'HTTP/2 hat keine wesentlichen negativen Auswirkungen, da es von modernen Clients universell unterstützt wird. Die
    Aktivierung von HTTP/3 bringt betriebliche Überlegungen mit sich: 1. NGINX Build: Ihr NGINX-Binary muss mit HTTP/3- und
    QUIC-Unterstützung kompiliert worden sein. Standard OS-Pakete enthalten dies möglicherweise nicht. Das Repository von
    NGINX selbst enthält seit NGINX-Version 1.25.0 das http_v3-Modul. Führen Sie diesen Befehl aus und prüfen Sie, ob das
    Modul http_v3 vorhanden ist: nginx -V 2>&1 | tr '' '' ''\n'' | grep --color=auto ''with-'' 2. Firewall-Konfiguration:
    Sie müssen UDP-Traffic auf Port 443 erlauben, da HTTP/3 das QUIC-Protokoll über UDP verwendet. Dies ist ein häufiger Fehler,
    der dazu führt, dass HTTP/3 nicht funktioniert.'
  references:
  - 1. https://datatracker.ietf.org/doc/html/rfc9114
  - 2. https://datatracker.ietf.org/doc/html/rfc9000
  page_start: 121
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration zu überprüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*(listen|add_header.*Alt-Svc)''

    Prüfen Sie die Ausgabe für Ihren primären server-Block auf die folgenden Punkte:

    1. Die TCP-Direktive http2 on;  ist gesetzt.

    2. Eine UDP-listen-Direktive mit dem Parameter quic ist vorhanden: listen

    443 quic reuseport; . Zur besseren Übersicht kann zusätzlich http3 on;

    gesetzt werden, dies ist jedoch standardmäßig aktiv.

    3. Ein Alt-Svc-Header wird gesendet, um die Verfügbarkeit von HTTP/3 zu

    signalisieren: add_header Alt-Svc ''h3=":443"; ma=63072000'';

    Wenn eine dieser Komponenten fehlt, ist diese Empfehlung nicht vollständig umgesetzt.'
  remediation: "1. Öffnen Sie die NGINX-server-Konfigurationsdatei.\n2. Fügen Sie im Haupt-server-Block Ihrer HTTPS-Site die\
    \ Direktiven hinzu oder\nändern Sie diese, um HTTP/2 und HTTP/3 zu aktivieren und dessen\nVerfügbarkeit bekanntzugeben.\n\
    3. Stellen Sie sicher, dass Ihre Firewall UDP-Traffic auf Port 443 erlaubt.\nserver {\n    # 1. HTTP/2 auf dem Standard-TCP-Listener\
    \ aktivieren\n    listen         443      ssl;\n    listen         [::]:443 ssl;\n    http2          on;\n    # 2. HTTP/3\
    \ auf dem UDP-Listener aktivieren\n    listen         443      quic reuseport;\n    listen         [::]:443 quic reuseport;\n\
    \    http3          on;\n    # ... weitere SSL-Direktiven wie ssl_certificate ...\n    # 3. Verfügbarkeit von HTTP/3 an\
    \ Browser signalisieren\n    # Das max-age (ma) wird in Sekunden angegeben (z. B. 2 Jahre)\n    add_header      Alt-Svc\
    \ 'h3=\":443\"; ma=63072000';\n    # Für HTTP/3 erforderlich\n    ssl_early_data  on;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(listen|add_header.*Alt-Svc)'
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration zu überprüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*(listen|add_header.*Alt-Svc)''

      Prüfen Sie die Ausgabe für Ihren primären server-Block auf die folgenden Punkte:

      1. Die TCP-Direktive http2 on;  ist gesetzt.

      2. Eine UDP-listen-Direktive mit dem Parameter quic ist vorhanden: listen

      443 quic reuseport; . Zur besseren '
- id: 5.1.1
  title: Sicherstellen, dass "allow"- und "deny"-Filter den Zugriff auf bestimmte IP-Adressen beschränken
  scoring: manual
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: Die auf IP-Adressen basierende Zugriffskontrolle ist ein grundlegender Defense-inDepth-Mechanismus. Durch die
    Verwendung der NGINX-Direktiven allow und deny kann der Zugriff auf den gesamten Server oder auf bestimmte location-Blöcke
    auf vertrauenswürdige Netzwerkquellen beschränkt werden, wie beispielsweise interne Subnetze, bestimmte Hosts oder VPN-Bereiche.
    Dies ist besonders effektiv, um nichtöffentliche administrative Schnittstellen oder interne APIs vor dem öffentlichen
    Internet zu schützen.
  rationale: Die Anwendung des Prinzips der geringsten Privilegien (Principle of Least Privilege) auf der Netzwerkschicht
    ist eine äußerst effektive Sicherheitsmaßnahme. Indem explizit definiert wird, welche IP-Adressen oder CIDR-Bereiche auf
    sensible Ressourcen zugreifen dürfen, und alle anderen mit deny all;  implizit blockiert werden, wird die Angriffsfläche
    erheblich reduziert. Dies verhindert, dass nicht autorisierte Netzwerksegmente überhaupt erst versuchen können, potenzielle
    Schwachstellen auf Anwendungsebene auszunutzen.
  impact: Eine falsch konfigurierte IP-Filterliste kann dazu führen, dass legitimen Benutzern oder Diensten der Zugriff verweigert
    wird. In dynamischen Umgebungen, in denen sich IPAdressen ändern können (z. B. Cloud-Instanzen ohne statische IPs), kann
    dies eine besondere Herausforderung darstellen. Das Pflegen korrekter und aktueller IP-AllowLists erfordert operative
    Disziplin.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_access_module.html
  - 2. NIST SP 800-53:rev5:SC-7 (5)
  page_start: 125
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf allow- und deny-Regeln
    zu überprüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*(allow|deny)''

    Prüfen Sie anschließend manuell die aktiven Regeln innerhalb der http-, serveroder location-Blöcke. Vergewissern Sie sich,
    dass die konfigurierten IP-Adressen

    und CIDR-Bereiche mit der dokumentierten Liste vertrauenswürdiger Quellen

    übereinstimmen und dass eine deny all; -Regel vorhanden ist, um eine DefaultDeny-Richtlinie durchzusetzen.'
  remediation: "Identifizieren Sie den spezifischen location-Block, den Sie schützen möchten (z. B.\neine Admin-Login-Seite\
    \ oder interne Statistiken). Erstellen Sie eine Liste\nvertrauenswürdiger Quell-IP-Adressen und Netzwerkbereiche. Fügen\
    \ Sie für jede\nvertrauenswürdige Quelle allow-Direktiven hinzu, gefolgt von einer abschließenden\ndeny all; -Direktive.\
    \ NGINX verarbeitet Regeln der Reihe nach und stoppt beim\nersten Treffer.\nlocation /admin_login/ {\n    # Erlaubt einen\
    \ spezifischen Monitoring-Server\n    allow 192.168.1.100;\n    # Erlaubt den internen Netzwerkbereich des Büros\n   \
    \ allow 10.20.30.0/24;\n    # Allen anderen Zugriff auf diese location verweigern\n    deny all;\n    # ... weitere Direktiven\
    \ für die Admin-Location, z. B. proxy_pass ...\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*(allow|deny)'
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf allow- und deny-Regeln
      zu überprüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*(allow|deny)''

      Prüfen Sie anschließend manuell die aktiven Regeln innerhalb der http-, serveroder location-Blöcke. Vergewissern Sie
      sich, dass die konfigurierten IP-Adressen

      und CIDR-Bereiche mit der dokumentierten Liste vertrauenswürdiger'
- id: 5.1.2
  title: Sicherstellen, dass nur zugelassene HTTP-Methoden erlaubt sind
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Gemäß dem Prinzip der geringsten Funktionalität sollte ein NGINX-Server so konfiguriert werden, dass er alle
    HTTP-Methoden ablehnt, die von der Anwendung nicht explizit benötigt werden. Während normales Webbrowsing typischerweise
    nur GET, POST und HEAD benötigt, können moderne RESTful APIs Methoden wie PUT, PATCH oder DELETE erfordern. Jede Methode,
    die für die Funktionalität der Anwendung nicht erforderlich ist, sollte auf Webserver-Ebene blockiert werden.
  rationale: Das Deaktivieren ungenutzter HTTP-Methoden mindert das Risiko unbeabsichtigter Serverinteraktionen und kann bestimmte
    Klassen von Web-App-Angriffen verhindern. Wenn ein Angreifer beispielsweise einen Weg findet, die Authentifizierung auf
    Anwendungsebene zu umgehen, könnte eine aktivierte, aber ungenutzte PUT- oder DELETE-Methode auf dem Webserver potenziell
    zu unbefugter Änderung oder Löschung von Dateien führen. Durch das explizite Verweigern solcher Methoden stellt NGINX
    sicher, dass Anfragen die Backend-Anwendung gar nicht erst erreichen, was die Angriffsfläche erheblich reduziert.
  impact: Ein zu restriktiver Filter kann legitime Anwendungsfunktionen blockieren. Vor der Implementierung dieser Einschränkungen
    ist es zwingend erforderlich, sich mit den Anwendungsentwicklern abzustimmen, um eine verbindliche Liste aller benötigten
    HTTP-Methoden für jeden Anwendungsendpunkt zu erhalten. Das fehlerhafte Blockieren einer erforderlichen Methode (z. B.
    PUT für eine Datei-Upload-Funktion) führt dazu, dass Teile der Anwendung nicht mehr funktionieren.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#limit_except
  - 2. NIST SP 800-53:rev5:CM-7 b
  page_start: 127
  audit_raw: '1. Überprüfung der Konfiguration:

    Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf Direktiven zur Methodenbeschränkung
    zu analysieren:

    nginx -T 2>/dev/null | grep -E ''(\$request_method|limit_except)''

    Überprüfen Sie die Konfiguration, um sicherzustellen, dass entweder ein

    limit_except-Block oder ein if ($request_method) -Block für die entsprechende

    Location korrekt implementiert ist.

    2. Aktives Testen:

    Senden Sie mit curl eine Anfrage mit einer nicht zugelassenen Methode (z. B.

    OPTIONS oder DELETE) und vergewissern Sie sich, dass der Server mit dem korrekten

    Statuscode antwortet und nicht mit 200 OK  oder 404 Not Found .

    # Eine nicht erlaubte OPTIONS-Anfrage senden

    curl -X OPTIONS -I https://example.loc/api.html

    Erwartete Ausgabe: Der Server sollte entweder HTTP/1.1 405 Not Allowed  oder

    HTTP/1.1 444 Connection Closed Without Response  zurückgeben. Jeder

    andere 2xx- oder 4xx-Code weist auf eine mögliche Fehlkonfiguration hin.'
  remediation: "Es gibt zwei empfohlene Methoden, um HTTP-Verben einzuschränken.\nMethode 1 (Bevorzugt): Verwendung von limit_except.\n\
    Diese Direktive wurde für diesen Zweck entwickelt und gilt als der sauberste Ansatz. Sie\nschränkt alle Methoden ein,\
    \ mit Ausnahme der aufgelisteten.\nlocation /api_login/ {\n    # Nur GET-, HEAD- und POST-Methoden für diese location\
    \ erlauben.\n    limit_except GET HEAD POST {\n        deny all;\n    }\n    # ... weitere Direktiven ...\n}\nMethode\
    \ 2 (Alternative): Verwendung einer if-Bedingung.\nDiese Methode bietet mehr Flexibilität, wie beispielsweise die Rückgabe\
    \ eines nicht\nstandardmäßigen Statuscodes wie 444, der die Verbindung einfach schließt, ohne\neinen Response-Header zu\
    \ senden.\nlocation / {\n    # Wenn die Request-Methode NICHT GET, HEAD oder POST ist\n    if ($request_method !~ ^(GET|HEAD|POST)$)\
    \ {\n        # --> Verbindung sofort schließen.\n        return 444;\n    }\n    # ... weitere Direktiven ...\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '(\$request_method|limit_except)'
    expected: ''
    severity: medium
    info: '1. Überprüfung der Konfiguration:

      Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf Direktiven zur Methodenbeschränkung
      zu analysieren:

      nginx -T 2>/dev/null | grep -E ''(\$request_method|limit_except)''

      Überprüfen Sie die Konfiguration, um sicherzustellen, dass entweder ein

      limit_except-Block oder ein if ($request_method) -Block für die entsprechende

      Location ko'
- id: 5.2.1
  title: Sicherstellen, dass die Timeout-Werte für das Lesen von Client-Header und -Body korrekt gesetzt sind
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'Um sich vor langsamen Clients zu schützen, die Verbindungen auf unbestimmte Zeit offenhalten, unterstützt
    NGINX mehrere Timeout-Direktiven. Die wichtigsten für clientseitige Verbindungen sind: client_header_timeout: Legt die
    maximale Zeit fest, die der Server darauf wartet, dass ein Client den Request-Header sendet. client_body_timeout: Legt
    die maximal zulässige Zeit zwischen aufeinanderfolgenden Leseoperationen beim Empfang des Request-Bodys fest. Dieser Timer
    gilt nicht für die Gesamtzeit der Übertragung. send_timeout: Legt die maximal zulässige Zeit zwischen aufeinanderfolgenden
    Schreiboperationen fest, wenn eine Antwort an den Client gesendet wird. Wenn eines dieser Timeouts erreicht wird, schließt
    der Server die Verbindung und gibt Ressourcen frei.'
  rationale: Aggressiv niedrige Timeout-Werte sind eine primäre Verteidigungsmaßnahme gegen Slow-Read Denial-of-Service (DoS)-Angriffe.
    Diese Angriffe zielen darauf ab, die Serverressourcen zu erschöpfen, indem viele Verbindungen geöffnet und durch extrem
    langsames Senden von Daten so lange wie möglich aufrechterhalten werden. Durch das Setzen niedriger Timeouts schließt
    NGINX diese bösartigen Verbindungen effizient und schont die Ressourcen für legitime Benutzer.
  impact: Werden diese Werte zu niedrig gesetzt, können legitime Verbindungen zu früh beendet werden. Beispielsweise könnte
    ein Benutzer, der eine große Datei über eine langsame mobile Verbindung hochlädt, unterbrochen werden, wenn der client_body_timeout
    zu aggressiv eingestellt ist. Die Werte müssen sorgfältig evaluiert werden, um ein Gleichgewicht zwischen Sicherheit (niedrige
    Werte) und Funktionalität (höhere Werte für spezifische Anwendungsfälle wie Datei-Uploads) zu erreichen.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_header_timeout
  - 2. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_timeout
  page_start: 132
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die relevanten Direktiven
    zu prüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*

    (client_header_timeout|client_body_timeout|send_timeout)''

    Vergewissern Sie sich, dass diese Werte explizit auf einen angemessen niedrigen, vom

    Standardwert abweichenden Wert gesetzt sind (z. B. 10–20 Sekunden), und zwar im

    http oder im server-Kontext. Wenn die Anwendung langlaufende Verbindungen

    erfordert, vergewissern Sie sich, dass client_body_timeout im spezifischen

    location-Block, der Uploads verarbeitet, auf einen höheren Wert überschrieben wird.'
  remediation: "Setzen Sie global angemessen niedrige Timeout-Werte in Ihrem http-Block. Wenn\nbestimmte location-Blöcke längere\
    \ Timeouts erfordern (z. B. für Datei-Uploads),\nüberschreiben Sie diese innerhalb des jeweiligen location-Blocks.\nBeispielkonfiguration:\n\
    http {\n    # Globalen Standardwert auf 15 Sekunden setzen, wodurch der Standardwert von\n60s überschrieben wird.\n  \
    \  client_header_timeout 15s;\n    client_body_timeout   15s;\n    send_timeout          15s;\n    server {\n        #\
    \ ... andere Einstellungen ...\n        # Diese location verarbeitet große Datei-Uploads und benötigt einen\nlängeren\
    \ Timeout.\n        location /upload {\n            client_body_timeout 300s; # Erlaubt 5 Minuten zwischen Leseoperationen\n\
    für Uploads\n            # ...\n        }\n    }\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*
    expected: ''
    severity: medium
    info: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die relevanten Direktiven
      zu prüfen:

      nginx -T 2>/dev/null | grep -E ''^\s*

      (client_header_timeout|client_body_timeout|send_timeout)''

      Vergewissern Sie sich, dass diese Werte explizit auf einen angemessen niedrigen, vom

      Standardwert abweichenden Wert gesetzt sind (z. B. 10–20 Sekunden), und zwar im

      http oder im se'
- id: 5.2.2
  title: Sicherstellen, dass die maximale Request-Body-Größe korrekt gesetzt ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Die client_max_body_size-Direktive definiert die maximal zulässige Größe für einen Client-Request-Body, wie
    er durch den Content-Length-Header angegeben wird. Wenn eine Anfrage diese Größe überschreitet, lehnt NGINX sie sofort
    mit einem 413 Request Entity Too Large -Fehler ab. Dadurch wird verhindert, dass die übergroße Anfrage weiterverarbeitet
    oder an eine Backend-Anwendung weitergereicht wird.
  rationale: Die Begrenzung der Request-Body-Größe ist eine entscheidende Abwehrmaßnahme gegen Ressourcenerschöpfungs-DoS-Angriffe
    und verhindert, dass übergroße, potenziell bösartige Payloads die Anwendungs-Backends erreichen. Indem ein logisches Standardlimit
    festgelegt und nur für spezifische Anwendungsendpunkte erhöht wird, die dies erfordern (z. B. Datei-Uploads), wird das
    Prinzip der geringsten Funktionalität (Principle of Least Functionality) durchgesetzt und die Angriffsfläche erheblich
    reduziert.
  impact: Ein zu niedriger Wert ist eine häufige Ursache für Anwendungsfehler. Legitime Benutzeraktionen, wie das Hochladen
    von Dateien oder das Absenden großer Formulare, werden mit einem 413-Fehler blockiert, wenn sie das konfigurierte Limit
    überschreiten. Es ist wesentlich, dass dieser Wert anhand der Anwendungsanforderungen bestimmt und nicht auf eine willkürlich
    niedrige Zahl gesetzt wird.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#client_max_body_size
  - 2. NIST SP 800-53:rev5:SI-10
  page_start: 135
  audit_raw: 'Führen Sie den folgenden Befehl aus, um die vollständig geladene NGINXKonfiguration auf die client_max_body_size-Direktive
    zu prüfen:

    nginx -T 2>/dev/null | grep -E ''^\s*(client_max_body_size)''

    Vergewissern Sie sich, dass ein globaler Wert für client_max_body_size im httpBlock gesetzt ist. Für alle location-Blöcke,
    die diesen Wert überschreiben (z. B. für

    Uploads), verifizieren Sie manuell, dass das erhöhte Limit dokumentiert ist und mit den

    funktionalen Anforderungen der Anwendung übereinstimmt.'
  remediation: "Definieren Sie ein restriktives globales Limit im http-Block. Für spezifische\nAnwendungsendpunkte, die größere\
    \ Request-Bodies akzeptieren müssen,\nüberschreiben Sie diese Direktive innerhalb des entsprechenden location-Blocks.\n\
    Beispielkonfiguration:\nhttp {\n    # Setzt einen restriktiven globalen Standardwert von 2 Megabyte. Dies\nverhindert\
    \ unerwartet große Anfragen an den meisten Endpunkten.\n    client_max_body_size 2M;\n    server {\n        # ...\n  \
    \      # Diese Location verarbeitet API-Anfragen mit potenziell großen JSONPayloads.\n        location /api/v1/data {\n\
    \            client_max_body_size 10M; # Bis zu 10 MB erlauben\n            # ...\n        }\n        # Diese location\
    \ ist für große Datei-Uploads vorgesehen.\n        location /uploads {\n            client_max_body_size 50M; # Bis zu\
    \ 50 MB erlauben\n            # ...\n        }\n    }\n}"
