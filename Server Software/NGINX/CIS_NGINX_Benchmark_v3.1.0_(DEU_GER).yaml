- id: 2.3.2
  title: Sicherstellen, dass der Zugriff auf NGINX-Verzeichnisse und -Dateien eingeschränkt ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: Das NGINX-Konfigurationsverzeichnis (/etc/nginx oder entsprechend) und dessen Inhalte sollten restriktive Berechtigungen
    aufweisen, um das Prinzip der geringsten Rechte durchzusetzen. Verzeichnisse sollten nur für den Benutzer root und die
    Eigentümergruppe root zugänglich sein (und gegebenenfalls für die Eigentümergruppe lesbar/ausführbar sein), jedoch nicht
    für andere. Dateien sollten für root lesbar/schreibbar und für die Eigentümergruppe lesbar, jedoch nicht für andere zugänglich
    sein. Die PID-Datei speichert die Hauptprozess-ID des nginx-Prozesses. Diese Datei sollte vor unautorisierten Änderungen
    geschützt werden.
  rationale: Restriktive Dateiberechtigungen verhindern, dass unautorisierte Benutzer auf dem System sensible Konfigurationsdetails
    einsehen können, wie Backend-IP-Adressen, Routing-Logik oder Pfade geladener Module. Durch das Entfernen des "world"-Zugriffs
    (Berechtigungen für "other") wird sichergestellt, dass nur Administratoren (über sudo) mit der Webserver-Konfiguration
    interagieren können. Dies ist eine grundlegende Verteidigung gegen Information Disclosure. Die PID-Datei sollte dem Benutzer
    root und der Gruppe root gehören. Sie sollte außerdem für jeden lesbar, aber nur für root schreibbar sein (Berechtigungen
    644). Dadurch wird eine unautorisierte Änderung der PID-Datei verhindert, die einen Denial of Service verursachen könnte.
  impact: Das Konfigurieren der Berechtigungen auf 640 (für Dateien) und 750 (für Verzeichnisse) verhindert, dass nicht privilegierte
    Benutzer das Konfigurationsverzeichnis auflisten oder Konfigurationsdateien lesen können. Keine. Die PID-Datei wird vom
    Master-Prozess (root) verwaltet. Das Einschränken des Schreibzugriffs verhindert, dass andere Benutzer die Datei manipulieren
    können, während der Lesezugriff im Allgemeinen als sicher gilt und für das Monitoring erforderlich ist.
  references:
  - 1. NIST SP 800-53:rev5:AC-3
  - '2. NIST CSF 2.0: PR.AA-05'
  - 1. NIST SP 800-53:rev5:AC-3
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 44
  audit_raw: '1. Konfigurationsverzeichnis identifizieren:

    Führen Sie nginx -V  aus und identifizieren Sie --conf-path, um die

    Konfigurationswurzel zu bestimmen (z. B. /etc/nginx).

    2. Verzeichnisberechtigungen prüfen:

    Führen Sie den folgenden Befehl aus, um Verzeichnisse mit zu weit gefassten

    Berechtigungen zu finden:

    find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

    Prüfung:

    Vergewissern Sie sich, dass die Ausgabe Berechtigungen von 750 (drwxr-x---) oder

    restriktiver anzeigt (z. B. 700).

    Standard: 755 (drwxr-xr-x) erlaubt "other" lesen/ausführen.

    Gehärtetes Ziel: 750 oder 700.

    3. Dateiberechtigungen prüfen:

    Führen Sie den folgenden Befehl aus, um Dateien mit zu weit gefassten

    Berechtigungen zu finden:

    find /etc/nginx -type f -exec stat -Lc "%n %a" {} +

    Prüfung:

    Vergewissern Sie sich, dass die Ausgabe Berechtigungen von 640 (-rw-r-----) oder

    restriktiver anzeigt (z. B. 600).

    Standard: 644 (-rw-r--r--) erlaubt "other" lesen.

    Gehärtetes Ziel: 640 oder 600.

    1. Speicherort der PID-Datei identifizieren:

    Führen Sie nginx -V  aus und suchen Sie nach dem Argument --pid-path, um den

    Speicherort zu bestätigen (z. B. /run/nginx.pid oder /var/run/nginx.pid).

    2. Eigentümerschaft und Berechtigungen prüfen:

    Führen Sie den folgenden Befehl aus (ersetzen Sie den Pfad durch den vorab

    identifizierten Pfad):

    stat -Lc "%U:%G %a" /run/nginx.pid

    Prüfung:

    Eigentümerschaft: Muss root:root sein.

    Berechtigungen: Müssen 644 (rw-r--r--) oder restriktiver sein.'
  remediation: 'Um den Zugriff auf das NGINX-Konfigurationsverzeichnis und dessen Dateien

    einzuschränken, führen Sie die folgenden Befehle aus:

    1. Verzeichnisse einschränken (750):

    Dem Eigentümer (root) vollen Zugriff erlauben, der Gruppe lesen/ausführen, anderen

    den Zugriff verweigern.

    find /etc/nginx -type d -exec chmod 750 {} +

    2. Dateien einschränken (640): Dem Eigentümer (root) lesen/schreiben erlauben,

    der Eigentümergruppe lesen, anderen den Zugriff verweigern.

    find /etc/nginx -type f -exec chmod 640 {} +

    Hinweis: Private Schlüssel (z. B. .key-Dateien) erfordern noch restriktivere

    Berechtigungen (400 oder 600) und sollten separat behandelt oder hier manuell

    verifiziert werden.

    Setzen Sie die korrekte Eigentümerschaft und die korrekten Berechtigungen für die

    PID-Datei (Pfad nach Bedarf ersetzen):

    chown root:root /run/nginx.pid

    chmod 644       /run/nginx.pid'
  checks:
  - type: command
    command: find /etc/nginx -type d -exec stat -Lc "%n %a" {} + && find /etc/nginx -type f -exec stat -Lc "%n %a" {} + &&
      stat -Lc "%U:%G %a" /run/nginx.pid
    expected: ''
    severity: medium
    info: '1. Konfigurationsverzeichnis identifizieren:

      Führen Sie nginx -V  aus und identifizieren Sie --conf-path, um die

      Konfigurationswurzel zu bestimmen (z. B. /etc/nginx).

      2. Verzeichnisberechtigungen prüfen:

      Führen Sie den folgenden Befehl aus, um Verzeichnisse mit zu weit gefassten

      Berechtigungen zu finden:

      find /etc/nginx -type d -exec stat -Lc "%n %a" {} +

