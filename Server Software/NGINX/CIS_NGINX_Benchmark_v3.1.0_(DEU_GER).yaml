benchmark:
  id: cis-nginx-benchmark
  title: CIS NGINX Benchmark
  version: 3.1.0
  technology: NGINX
  category: Server Software
  os: NGINX
  source_pdf: CIS_NGINX_Benchmark_v3.1.0_(DEU_GER).pdf
  total_pages: 177
  controls_count: 37
controls:
- id: 1.1.1
  title: Sicherstellen, dass NGINX installiert ist.
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Auf dem System muss eine NGINX-Installation vorhanden sein. Um die Unterstützung moderner Sicherheitsstandards
    (wie TLS 1.3 und HTTP/3) zu gewährleisten und bekannte Schwachstellen zu vermeiden, muss mindestens die Version 1.28.0
    installiert und mit den erforderlichen Modulen kompiliert worden sein.
  rationale: NGINX muss installiert und betriebsbereit sein, damit die Schutzmaßnahmen dieses Benchmarks angewendet werden
    können. Die Vorgabe einer Mindestversion und eines Funktionsumfangs stellt sicher, dass die Plattform die erforderlichen
    Sicherheitseinstellungen unterstützt.
  impact: Ein Update von NGINX auf eine neuere Version kann Änderungen an der Konfigurationssyntax oder veraltete Direktiven
    mit sich bringen. Administratoren sollten die Syntax der Konfiguration mit nginx -t  prüfen, bevor der Dienst neu gestartet
    wird.
  references:
  - 1. https://nginx.org/en/docs/install.html
  - 2. https://nginx.org/en/linux_packages.html
  page_start: 18
  audit_raw: '1. Installation und Version überprüfen: Führen Sie den folgenden Befehl aus, um die

    installierte NGINX-Version anzuzeigen:

    # Hinweis: Es handelt sich um ein großes V

    nginx -V

    2. Auswertung:

    Ausgabe prüfen: Der Befehl muss eine installierte Version zurückgeben (z. B.

    nginx version: nginx/1.28.0 ). Wenn der Befehl nicht gefunden wird, ist

    NGINX nicht installiert.

    Version prüfen: Stellen Sie sicher, dass die Versionsnummer 1.28.0 oder

    höher verwendet wird.'
  remediation: 'Installieren oder aktualisieren Sie NGINX auf die Version 1.28.0 oder höher.

    Hinweis: Offizielle Pakete von nginx.org (siehe Empfehlung 1.2.1) enthalten diese

    Module in der Regel standardmäßig. Bei selbst kompilierten Versionen (Custom Builds)

    müssen diese explizit aktiviert werden.'
  checks:
  - type: manual_review
    info: '1. Installation und Version überprüfen: Führen Sie den folgenden Befehl aus, um die

      installierte NGINX-Version anzuzeigen:

      # Hinweis: Es handelt sich um ein großes V

      nginx -V

      2. Auswertung:

      Ausgabe prüfen: Der Befehl muss eine installierte Version zurückgeben (z. B.

      nginx version: nginx/1.28.0 ). Wenn der Befehl nicht gefunden wird, ist

      NGINX nicht installiert.

      Version prüfen: Stellen Sie sicher, dass die Versionsnummer 1.28.0 oder

      höher verwendet wird.'
    severity: medium
- id: 1.2.1
  title: Sicherstellen, dass die Paketmanager-Repositories ordnungsgemäß konfiguriert sind.
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Paket-Repositories müssen vertrauenswürdig, ordnungsgemäß konfiguriert und gepflegt sein, um sicherzustellen,
    dass das System zeitnah Sicherheitspatches, Fehlerbehebungen und Unterstützung für moderne Protokolle erhält. Obwohl Betriebssystemhersteller
    NGINX-Pakete bereitstellen, werden diese Versionen oft auf einem älteren Release-Stand eingefroren (als "stabil" eingestuft,
    jedoch funktional veraltet). Der Zugriff auf kritische moderne Funktionen wie HTTP/3 (QUIC) und die neuesten TLS-Updates
    erfordert in der Regel die Nutzung der offiziellen Repositories von NGINX/F5.
  rationale: Wenn die Paketmanager-Repositories eines Systems fehlerhaft konfiguriert oder veraltet sind, können kritische
    Sicherheitspatches möglicherweise nicht zeitnah eingespielt werden. Zudem beschränkt die ausschließliche Nutzung von Standard-OSRepositories
    den Webserver oft auf veraltete Versionen, denen die Unterstützung für moderne Sicherheitsstandards (z. B. HTTP/3) fehlt.
    Die Nutzung der offiziellen nginx.org-Repositories gewährleistet den Zugriff auf die neuesten Stable- und Mainline-Versionen
    direkt von der Quelle, was das Risiko des Einsatzes veralteter Software verringert. Im Gegenzug kann das Hinzufügen nicht
    vertrauenswürdiger Drittanbieter-Repositories zu kompromittierter Software oder Abhängigkeitskonflikten führen.
  impact: Der Wechsel von OS-eigenen Paketen zu Upstream-Paketen (nginx.org) verändert den Update-Lebenszyklus. Administratoren
    sind fortan selbst dafür verantwortlich, Upstream-Änderungen zu verfolgen, anstatt sich auf die Backporting-Richtlinien
    des OS-Anbieters zu verlassen. Dies ist jedoch oft notwendig, um moderne Sicherheits- und Leistungsanforderungen zu erfüllen.
  references:
  - 1. https://nginx.org/en/linux_packages.html
  - 2. NIST SP 800-53:rev5:SI-2 c
  page_start: 21
  audit_raw: 'Um zu prüfen, ob die Paketmanager-Repositories korrekt konfiguriert sind und auf eine

    vertrauenswürdige Quelle verweisen (entweder auf ein Repository des OS-Anbieters

    oder auf ein offizielles NGINX-Repository), führen Sie die folgenden Befehle aus:

    Red Hat / Rocky-Linux:

    dnf repolist -v | grep -i nginx

    Debian / Ubuntu:

    apt-cache policy nginx

    Prüfung:

    Prüfen Sie, ob die Repository-URL auf eine vertrauenswürdige Domain verweist

    (z. B. nginx.org, rhel..., ubuntu...).

    Stellen Sie sicher, dass das Repository aktiviert ist.

    Vergewissern Sie sich, dass keine unbekannten oder nicht vertrauenswürdigen

    Drittanbieter-Repositories für NGINX konfiguriert sind.'
  remediation: 'Konfigurieren Sie Ihren Paketmanager so, dass ein vertrauenswürdiges Repository

    verwendet wird, welches Ihre Versionsanforderungen erfüllt.

    So aktivieren Sie das offizielle NGINX-Repository (empfohlen für HTTP/3Unterstützung): Befolgen Sie die Anweisungen unter
    nginx.org/en/linux_packages.html

    für Ihre spezifische Distribution. Dies umfasst in der Regel das Hinzufügen des NGINXSignaturschlüssels und das Erstellen
    einer Repository-Konfigurationsdatei.'
  checks:
  - type: command
    command: dnf repolist -v | grep -i nginx
    expected: ''
    severity: medium
    info: 'Um zu prüfen, ob die Paketmanager-Repositories korrekt konfiguriert sind und auf eine

      vertrauenswürdige Quelle verweisen (entweder auf ein Repository des OS-Anbieters

      oder auf ein offizielles NGINX-Repository), führen Sie die folgenden Befehle aus:

      Red Hat / Rocky-Linux:

      dnf repolist -v | grep -i nginx

      Debian / Ubuntu:

      apt-cache policy nginx

      Prüfung:

      Prüfen Sie, ob die Repository-URL auf eine vert'
- id: 1.2.2
  title: Sicherstellen, dass das neueste Softwarepaket installiert ist.
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Sobald neue Sicherheitslücken entdeckt werden, stellt der Anbieter Ihres NGINXSoftwarepakets entsprechende
    Fehlerbehebungen bereit. Durch die Installation der neuesten Softwareversion wird sichergestellt, dass diese Korrekturen
    auf Ihrem System verfügbar sind.
  rationale: Aktuelle Software bietet den bestmöglichen Schutz vor der Ausnutzung von Sicherheitslücken, wie beispielsweise
    der Ausführung von Schadcode.
  impact: Die Aktualisierung des NGINX-Pakets erfordert ein Neuladen oder einen Neustart des Dienstes, damit die Änderungen
    wirksam werden. Dies kann zu einer kurzen Unterbrechung führen oder Konfigurationsfehler verursachen, falls in der neuen
    Version bisherige Syntax-Elemente nicht mehr unterstützt werden.
  references:
  - 1. https://nginx.org/en/linux_packages.html
  - 2. NIST SP 800-53:rev5:SI-2 c
  page_start: 24
  audit_raw: 'Um zu prüfen, ob Ihr NGINX-Paket auf dem neuesten Stand ist, führen Sie den

    folgenden Befehl aus (Beispiel):

    Redhat:

    dnf info nginx'
  remediation: 'Um das neueste NGINX-Paket zu installieren, führen Sie den folgenden Befehl aus

    (Beispiel):

    Redhat:

    dnf update nginx -y'
  checks:
  - type: manual_review
    info: 'Um zu prüfen, ob Ihr NGINX-Paket auf dem neuesten Stand ist, führen Sie den

      folgenden Befehl aus (Beispiel):

      Redhat:

      dnf info nginx'
    severity: medium
- id: 2.1.1
  title: Sicherstellen, dass nur erforderliche dynamische Module geladen werden.
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'Die Funktionalität von NGINX wird durch Module bereitgestellt. Diese Module werden entweder statisch in das
    NGINX-Binary kompiliert oder dynamisch zur Laufzeit über die Direktive load_module geladen. Statische Module: Diese werden
    zur Kompilierzeit fest integriert. Bei der Verwendung offizieller vorkompilierter Pakete (z. B. von nginx.org oder den
    Betriebssystemherstellern) ist ein Standard-Set an Modulen enthalten, das nicht entfernt werden kann, ohne NGINX neu zu
    kompilieren. Dynamische Module: Dies sind separate .so-Dateien, die bei Bedarf geladen werden können. Um die Angriffsfläche
    und Komplexität zu reduzieren, sollten nur zwingend erforderliche dynamische Module geladen werden. Zudem sollten Administratoren
    sich der aktiven statischen Module bewusst sein, um zu vermeiden, dass ungenutzte Funktionen unbeabsichtigt konfiguriert
    werden.'
  rationale: Die Minimierung des geladenen Codes reduziert die potenzielle Angriffsfläche. Obwohl statische Module in vorkompilierten
    Paketen nicht entfernt werden können, verhindert der bewusste Verzicht auf unnötige dynamische Module die Ausführung von
    nicht benötigtem Code. Darüber hinaus hilft das Wissen darüber, welche statischen Module vorhanden sind, den Administratoren
    dabei, die Aktivierung riskanter Funktionen (wie autoindex oder stub_status) in der Konfiguration zu vermeiden, sofern
    diese nicht benötigt werden.
  impact: Wird ein benötigtes dynamisches Modul entfernt oder fälschlicherweise angenommen, dass ein bestimmtes statisches
    Modul vorhanden sei, kann dies dazu führen, dass der NGINX-Dienst beim Neustart fehlschlägt oder bestimmte Anwendungsfunktionen
    ausfallen.
  references:
  - 1. https://nginx.org/en/docs/
  - 2. NIST SP 800-53:rev5:CM-7 b
  page_start: 27
  audit_raw: '1. Dynamische Module prüfen (konkrete Maßnahme):

    Führen Sie den folgenden Befehl aus, um aktiv geladene dynamische Module zu

    ermitteln:

    nginx -T 2>/dev/null | grep "load_module"

    Prüfung:

    Wenn die Ausgabe leer ist, werden keine dynamischen Module geladen (PASS).

    Wenn eine Ausgabe vorhanden ist (z. B. load_module

    modules/ngx_http_geoip_module.so;), stellen Sie sicher, dass jedes

    aufgelistete Modul für die Geschäftslogik der Anwendung zwingend erforderlich

    ist.

    2. Statische Module prüfen (Informativ):

    Führen Sie den folgenden Befehl aus, um alle in das Binary kompilierten Module

    aufzulisten:

    nginx -V 2>&1 | grep -oEi ''\-\-(with|without)-[^ ]*''

    Prüfung:

    Prüfen Sie die --with-...-Flags, um die Fähigkeiten des Servers zu verstehen.

    Stellen Sie sicher, dass potenziell riskante Module, die im Build enthalten sind (z. B.

    http_stub_status_module), in keinem server- oder location-Block aktiviert

    sind, es sei denn, dies ist ausdrücklich autorisiert.'
  remediation: 'Für dynamische Module:

    Öffnen Sie die Hauptkonfigurationsdatei (/etc/nginx/nginx.conf) oder die

    entsprechende Include-Datei (z. B. unter /etc/nginx/modules-enabled/).

    Kommentieren oder entfernen Sie die Direktive load_module für jedes Modul, das

    nicht zwingend notwendig ist.

    Für statische Module:

    Da statische Module aus vorkompilierten Paketen nicht entfernt werden können, stellen

    Sie sicher, dass deren zugehörige Direktiven in Ihrer Konfiguration nicht verwendet

    werden. Wenn ein bestimmtes statisches Modul ein kritisches Risiko für Ihre Umgebung

    darstellt, müssen Sie auf eine selbst kompilierte Version oder eine andere Paketvariante

    ausweichen, die dieses Modul ausschließt.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep "load_module" && nginx -V 2>&1 | grep -oEi '\-\-(with|without)-[^ ]*'
    expected: ''
    severity: medium
    info: '1. Dynamische Module prüfen (konkrete Maßnahme):

      Führen Sie den folgenden Befehl aus, um aktiv geladene dynamische Module zu

      ermitteln:

      nginx -T 2>/dev/null | grep "load_module"

      Prüfung:

      Wenn die Ausgabe leer ist, werden keine dynamischen Module geladen (PASS).

      Wenn eine Ausgabe vorhanden ist (z. B. load_module

      modules/ngx_http_geoip_module.so;), stellen Sie sicher, dass jedes

      aufgelistete Modul f'
- id: 2.2.1
  title: Sicherstellen, dass NGINX unter einem unprivilegierten, dedizierten Systemkonto ausgeführt wird
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Der NGINX-Master-Prozess wird in der Regel als root ausgeführt, um sich an privilegierte Ports zu binden und
    Ressourcen zu verwalten. Er erzeugt jedoch WorkerProzesse, um den eigentlichen Client-Datenverkehr zu verarbeiten. Die
    Direktive user in der Hauptkonfiguration legt das Konto des Betriebssystems fest, unter dem diese Worker-Prozesse ausgeführt
    werden. Die Ausführung der Worker-Prozesse unter einem unprivilegierten, dedizierten Systemkonto begrenzt den Schaden,
    den ein Angreifer anrichten kann, falls der NGINXProzess kompromittiert wird. Dieses Konto sollte ausschließlich für NGINX
    vorgesehen sein, über keine Anmeldemöglichkeiten verfügen und keine erweiterten Systemrechte besitzen.
  rationale: Wenn ein Angreifer erfolgreich eine Schwachstelle in einem Worker-Prozess ausnutzt (z. B. durch einen Buffer
    Overflow oder Remote Code Execution), erbt er die Berechtigungen des Kontos, unter dem dieser Prozess ausgeführt wird.
    Die Verwendung eines privilegierten Kontos wie root erhöht das Risiko eines "Lateral Movements" erheblich. Ein dediziertes,
    stark eingeschränktes Systemkonto stellt sicher, dass ein Angreifer nicht auf andere Dienste zugreifen, sensible Systemdateien
    ändern oder Privilegien leicht ausweiten kann, wodurch die Auswirkungen einer Kompromittierung wirkungsvoll reduziert
    werden.
  impact: Das Ändern des NGINX-Benutzers erfordert, dass die Eigentümerschaft und die Berechtigungen für alle Laufzeitverzeichnisse
    (Logs, Caches, PID-Dateien) aktualisiert werden, damit sie dem neuen Konto entsprechen. Falsche Berechtigungen verhindern,
    dass NGINX startet oder notwendige Logs schreibt. Darüber hinaus muss der dedizierte Benutzer zwingend unprivilegiert
    bleiben; würde man ihn Gruppen wie sudo oder wheel hinzufügen, wäre der Sicherheitsvorteil hinfällig.
  references:
  - 1. https://nginx.org/en/docs/ngx_core_module.html#user
  - 2. NIST SP 800-53:rev5:AC-6
  page_start: 31
  audit_raw: '1. Konfigurierten Benutzer identifizieren:

    Prüfen Sie die aktive Konfiguration, um die user-Direktive zu finden:

    nginx -T 2>/dev/null | grep -i "^user"

    Prüfung: Stellen Sie sicher, dass ein spezifischer Benutzer definiert ist (z. B. user

    nginx; oder user www-data; ). Fehlt dieser Eintrag, wird NGINX möglicherweise als

    nobody oder unter dem bei der Kompilierung verwendeten Benutzer ausgeführt.

    2. Benutzerberechtigungen prüfen:

    Überprüfen Sie die UID und die Gruppenzugehörigkeit des identifizierten Benutzers (z.

    B. nginx):

    id nginx

    Prüfung:

    Stellen Sie sicher, dass die UID nicht 0 (root) ist.

    Stellen Sie sicher, dass der Benutzer kein Mitglied in privilegierten Gruppen (wie

    root, wheel, sudo) ist.

    3. Sudo-Zugriff prüfen:

    Stellen Sie sicher, dass der Benutzer keine Befehle über sudo ausführen darf:

    sudo -l -U nginx

    Prüfung: Die Ausgabe sollte darauf hinweisen, dass der Benutzer keine Berechtigung

    hat "User nginx is not allowed to run sudo ".'
  remediation: '1. Benutzer erstellen/härten (falls nicht vorhanden):

    Falls kein Benutzer existiert, erstellen Sie einen Systembenutzer ohne Login-Shell:

    useradd -r -d /var/cache/nginx -s /sbin/nologin nginx

    2. NGINX konfigurieren:

    Konfigurieren Sie die user-Direktive im Main-Kontext der Datei nginx.conf:

    user nginx;

    3. Benutzerkonto sperren:

    Stellen Sie sicher, dass das Konto nicht für Anmeldungen verwendet werden kann:

    usermod -s /sbin/nologin nginx

    usermod -L nginx'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: ''
    severity: medium
    info: '1. Konfigurierten Benutzer identifizieren:

      Prüfen Sie die aktive Konfiguration, um die user-Direktive zu finden:

      nginx -T 2>/dev/null | grep -i "^user"

      Prüfung: Stellen Sie sicher, dass ein spezifischer Benutzer definiert ist (z. B. user

      nginx; oder user www-data; ). Fehlt dieser Eintrag, wird NGINX möglicherweise als

      nobody oder unter dem bei der Kompilierung verwendeten Benutzer ausgeführt.

      2. B'
- id: 2.2.2
  title: Sicherstellen, dass das NGINX-Systemkonto gesperrt ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Das NGINX-Systemkonto darf kein nutzbares Passwort haben und sollte explizit in der shadow-Datei des Systems
    gesperrt sein, um direkte Logins oder passwortbasierte Rechteausweitung zu verhindern.
  rationale: Als Defense-in-Depth-Maßnahme sollte das NGINX-Systemkonto explizit gesperrt sein. Dadurch werden passwortbasierte
    Logins verhindert und Angreifer daran gehindert, das Konto für Lateral Movement zu verwenden, selbst wenn sie es schaffen,
    die ShellKonfiguration des Kontos zu ändern. In einer korrekt gehärteten Umgebung gibt es keinen operativen Bedarf, dass
    sich irgendein Benutzer als nginx anmeldet. Administrative Aufgaben, die die NGINXIdentität erfordern, sollten mit sudo
    ausgeführt werden (z. B. sudo -u nginx ), wodurch die Zugangsdaten des Administrators statt des Passworts des Systemkontos
    verwendet werden.
  impact: Das Sperren des Systemkontos hat minimale operative Auswirkungen. Das Konto ist nicht für menschliche Interaktion
    vorgesehen, und alle administrativen Aufgaben, die den NGINX-Benutzerkontext erfordern, sollten bereits mit sudo -u nginx  statt
    mit passwortbasierter Authentifizierung ausgeführt werden.
  references:
  - 1. NIST SP 800-53:rev5:AC-2 f
  - '2. NIST CSF 2.0: PR.AA-01'
  page_start: 34
  audit_raw: '1. Benutzer identifizieren:

    nginx -T 2>/dev/null | grep -i "^user"

    (Den Benutzer notieren, z. B. nginx)

    2. Sperrstatus prüfen:

    Führen Sie den folgenden Befehl für den angegebenen Benutzer aus:

    passwd -S nginx

    Prüfung:

    Vergewissern Sie sich, dass die Ausgabe den gesperrten Status anzeigt:

    RHEL: Zeigt LK oder Password locked .

    Debian/Ubuntu: Zeigt L.'
  remediation: 'Sperren Sie das Konto mit dem passwd-Befehl:

    passwd -l nginx

    (nginx durch das tatsächliche Systemkonto ersetzen, der in Schritt 1 gefunden wurde)'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: ''
    severity: medium
    info: '1. Benutzer identifizieren:

      nginx -T 2>/dev/null | grep -i "^user"

      (Den Benutzer notieren, z. B. nginx)

      2. Sperrstatus prüfen:

      Führen Sie den folgenden Befehl für den angegebenen Benutzer aus:

      passwd -S nginx

      Prüfung:

      Vergewissern Sie sich, dass die Ausgabe den gesperrten Status anzeigt:

      RHEL: Zeigt LK oder Password locked .

      Debian/Ubuntu: Zeigt L.'
- id: 2.2.3
  title: Sicherstellen, dass das NGINX-Systemkonto eine ungültige Shell aufweist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Das NGINX-Systemkonto muss mit einer ungültigen Login-Shell konfiguriert sein, um interaktiven Zugriff zu verhindern.
  rationale: Das NGINX-Systemkonto ist ausschließlich für das Ausführen von Daemon-Prozessen vorgesehen. Die Zuweisung einer
    gültigen Login-Shell (wie /bin/bash) erweitert unnötig die Angriffsfläche. Wenn ein Angreifer die Zugangsdaten des Kontos
    kompromittiert (oder einen SSH-Key hinzufügt), erleichtert eine gültige Shell den interaktiven Systemzugriff. Das Setzen
    der Shell auf /sbin/nologin oder /bin/false stellt sicher, dass das System einen Login-Versuch selbst mit gültigen Zugangsdaten
    sofort zurückweist.
  impact: Keine. Systemkonten benötigen für den normalen Betrieb keine interaktiven LoginFähigkeiten.
  references:
  - 1. NIST SP 800-53:rev5:AC-6
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 37
  audit_raw: '1. Benutzer identifizieren:

    nginx -T 2>/dev/null | grep -i "^user"

    (Den Benutzer notieren, z. B. nginx)

    2. Shell verifizieren:

    Führen Sie den folgenden Befehl aus, um die konfigurierte Shell für den identifizierten

    Benutzer zu prüfen:

    getent passwd nginx

    (nginx durch den tatsächlichen Benutzer ersetzen, der in Schritt 1 gefunden wurde)

    Prüfung:

    Das letzte Feld der Ausgabe prüfen (die Shell).

    PASS: Die Shell ist auf /sbin/nologin, /bin/nologin oder /bin/false

    gesetzt.

    FAIL: Die Shell ist auf /bin/bash, /bin/sh oder eine andere interaktive Shell

    gesetzt, die in /etc/shells aufgeführt ist.

    Beispielausgabe (PASS):

    nginx:x:999:988:nginx user:/nonexistent:/usr/sbin/nologin'
  remediation: 'Ändern Sie die Login-Shell für den identifizierten Benutzer auf /sbin/nologin:

    usermod -s /sbin/nologin nginx

    (nginx durch den tatsächlichen Benutzer ersetzen)'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "^user"
    expected: ''
    severity: medium
    info: '1. Benutzer identifizieren:

      nginx -T 2>/dev/null | grep -i "^user"

      (Den Benutzer notieren, z. B. nginx)

      2. Shell verifizieren:

      Führen Sie den folgenden Befehl aus, um die konfigurierte Shell für den identifizierten

      Benutzer zu prüfen:

      getent passwd nginx

      (nginx durch den tatsächlichen Benutzer ersetzen, der in Schritt 1 gefunden wurde)

      Prüfung:

      Das letzte Feld der Ausgabe prüfen (die Shell).

      PASS:'
- id: 2.3.1
  title: Sicherstellen, dass NGINX-Verzeichnisse und -Dateien root gehören
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Das NGINX-Konfigurationsverzeichnis und alle darin enthaltenen Dateien müssen dem Benutzer und der Gruppe root
    gehören, um unautorisierte Änderungen zu verhindern.
  rationale: Die NGINX-Konfiguration steuert die Sicherheitslage des Webservers. Wenn ein nicht privilegierter Benutzer (einschließlich
    des nginx-Worker-Benutzers) diese Dateien ändern kann, so kann dieser trivial Rechte ausweiten (z. B. durch Laden eines
    bösartigen Moduls oder durch das Ändern der user-Direktive auf root). Indem man sicherstellt, dass diese Dateien nur root
    gehören, wird garantiert, dass Konfigurationsänderungen administrative Rechte erfordern.
  impact: Keine. Der NGINX-Master-Prozess läuft als root und kann diese Dateien lesen. Die Worker-Prozesse (die als nginx
    laufen) benötigen keinen Schreibzugriff auf die Konfigurationsdateien.
  references:
  - 1. NIST SP 800-53:rev5:CM-5
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 41
  audit_raw: '1. Konfigurationsverzeichnis identifizieren:

    Führen Sie nginx -V  aus und suchen Sie nach --conf-path, um den Speicherort

    der Hauptkonfigurationsdatei zu ermitteln (z. B. /etc/nginx/nginx.conf). Das

    Verzeichnis, das diese Datei enthält, ist das Ziel.

    2. Eigentümerschaft prüfen:

    Führen Sie den folgenden Befehl aus, um die Eigentümerschaft des

    Konfigurationsverzeichnisses und seiner Inhalte zu prüfen:

    find /etc/nginx -name "*" \( -not -user root -o -not -group root \) -exec ls -ld

    {} \;

    (/etc/nginx durch den tatsächlichen Konfigurationspfad ersetzen, falls dieser

    abweicht)

    Prüfung:

    PASS: Der Befehl erzeugt keine Ausgabe. Alle Dateien gehören root:root.

    FAIL: Der Befehl listet Dateien auf, die anderen Benutzern gehören (z. B. nginx

    oder einem Entwicklerkonto).'
  remediation: 'Setzen Sie den Eigentümer des NGINX-Konfigurationsverzeichnisses und dessen

    Dateien auf root:

    chown -R root:root /etc/nginx

    (/etc/nginx durch den tatsächlichen Konfigurationspfad ersetzen, falls dieser

    abweicht)

    Hinweis: Stellen Sie sicher, dass dadurch der Zugriff auf bestimmte Dateien nicht

    unterbrochen wird, falls Sie ein benutzerdefiniertes Setup verwenden, bei dem externe

    Prozesse entsprechenden Schreibzugriff benötigen.'
  checks:
  - type: command
    command: find /etc/nginx -name "*" \( -not -user root -o -not -group root \) -exec ls -ld
    expected: ''
    severity: medium
    info: '1. Konfigurationsverzeichnis identifizieren:

