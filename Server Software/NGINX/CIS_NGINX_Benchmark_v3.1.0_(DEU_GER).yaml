    info: 'Verwenden Sie das folgende Verfahren, um zu verifizieren, dass ausschließlich

      ssl_protocols TLSv1.3;  verwendet wird.

      nginx -T 2>/dev/null | grep -E ''^\s*ssl_protocols''

