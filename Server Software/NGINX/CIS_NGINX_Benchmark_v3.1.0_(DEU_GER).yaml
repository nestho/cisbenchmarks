- id: 2.5.1
  title: Sicherstellen, dass die `server_tokens`-Direktive auf `off` gesetzt ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Die Anweisung server_tokens ist dafür zuständig, die NGINX-Versionsnummer und die Betriebssystemversion auf
    Fehlerseiten sowie im HTTP-Antwort-Header-Feld Server anzuzeigen. Diese Informationen sollten nicht angezeigt werden.
  rationale: Angreifer können mithilfe dieser Antwort-Header eine Website auskundschaften und ihre Angriffe dann gezielt auf
    bestimmte bekannte Schwachstellen der zugrunde liegenden Technologien ausrichten. Das Verbergen der Version verlangsamt
    einige potenzielle Angreifer und schreckt sie ab.
  impact: Keine. Das Deaktivieren der server_tokens hat keine Auswirkungen auf die Funktionalität. Es wird lediglich die Versionsangabe
    aus den Fehlerseiten und Headern entfernt. Beachten Sie, dass entschlossene Angreifer NGINX weiterhin über andere Methoden
    identifizieren können, doch das Entfernen des Banners erschwert opportunistischen Scannern die Arbeit.
  references:
  - 1. NIST SP 800-53:rev5:RA-5 (4)
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 63
  audit_raw: 'Vergewissern Sie sich, dass in der NGINX-Konfigurationsdatei nginx.conf die

    server_tokens-Direktive auf off gesetzt ist. Prüfen Sie dazu den Server-Header in

    der HTTP-Antwort, indem Sie diesen Befehl ausführen:

    curl -I 127.0.0.1 | grep -i server

    Die Ausgabe sollte keinen Server-Header enthalten, der Ihre Serverversion bereitstellt,

    wie unten gezeigt:

    Server: nginx/1.28.0'
  remediation: "Deaktivieren Sie die Versionsoffenlegung global, indem Sie diese Direktive zum httpBlock in /etc/nginx/nginx.conf\
    \ hinzufügen:\nhttp {\n    ...\n    server_tokens        off;\n    ...\n}"
  checks:
  - type: command
    command: curl -I 127.0.0.1 | grep -i server
    expected: ''
    severity: medium
    info: 'Vergewissern Sie sich, dass in der NGINX-Konfigurationsdatei nginx.conf die

      server_tokens-Direktive auf off gesetzt ist. Prüfen Sie dazu den Server-Header in

      der HTTP-Antwort, indem Sie diesen Befehl ausführen:

      curl -I 127.0.0.1 | grep -i server

      Die Ausgabe sollte keinen Server-Header enthalten, der Ihre Serverversion bereitstellt,

      wie unten gezeigt:

      Server: nginx/1.28.0'
- id: 2.5.2
  title: Stellen Sie sicher, dass Standard-Fehlerseiten und index.html-Seiten keine Verweise auf NGINX enthalten
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Standard-Fehlerseiten (z. B. 404, 500) und die Standard-Begrüßungsseite enthalten häufig NGINX-Branding oder
    -Signaturen. Diese Seiten sollten entfernt oder durch generische oder individuell gestaltete Seiten ersetzt werden, die
    keine Rückschlüsse auf die zugrunde liegende Servertechnologie zulassen.
  rationale: Standardmäßige NGINX-Fehlerseiten lassen die Server-Software visuell erkennen, selbst wenn die Header unterdrückt
    werden. Durch das Sammeln von Informationen über den zugrunde liegenden Technologie-Stack können Angreifer ihre Exploits
    gezielt auf bekannte Schwachstellen von NGINX abstimmen. Das Ersetzen der Standardseiten durch generische oder individuell
    gestaltete Inhalte beseitigt diesen InformationDisclosure-Vektor und erhöht den Aufwand, der für eine erfolgreiche Aufklärung
    erforderlich ist.
  impact: Das Erstellen und Pflegen individueller Fehlerseiten erfordert zusätzlichen administrativen Aufwand. Stellen Sie
    sicher, dass individuelle Fehlerseiten einfach gehalten sind und nicht selbst Schwachstellen einführen.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#error_page
  - 2. NIST SP 800-53:rev5:SI-11 a
  page_start: 65
  audit_raw: '1. Konfiguration verifizieren:

    Prüfen Sie, ob error_page-Direktiven aktiv sind:

    nginx -T 2>/dev/null | grep -i "error_page"

    2. Inhalt verifizieren (funktionaler Test):

    Lösen Sie einen Fehler aus (z. B. durch Anfordern einer nicht existierenden Seite) und

    prüfen Sie den Body:

    curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"

    Prüfung:

    PASS: Die Ausgabe enthält nicht "nginx" (oder grep gibt nichts zurück).

    FAIL: Der HTML-Body enthält "nginx".'
  remediation: "Anstatt die Standarddateien zu bearbeiten (die durch Paket-Updates überschrieben\nwerden können), konfigurieren\
    \ Sie NGINX so, dass individuelle Fehlerseiten verwendet\nwerden.\n1. Individuelle Fehlerseiten erstellen:\nErstellen\
    \ Sie ein Verzeichnis (z. B. /var/www/html/errors) und legen Sie dort\ngenerische HTML-Dateien ab (z. B. 404.html, 50x.html)\
    \ ohne NGINX-Branding.\n2. NGINX konfigurieren:\nFügen Sie die error_page-Direktive zu Ihren http- oder server-Blöcken\
    \ hinzu:\nerror_page 404 /404.html;\nerror_page 500 502 503 504 /50x.html;\nlocation = /50x.html {\n    root /var/www/html/errors;\n\
    \    internal;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -i "error_page" && curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"
    expected: ''
    severity: medium
    info: '1. Konfiguration verifizieren:

      Prüfen Sie, ob error_page-Direktiven aktiv sind:

      nginx -T 2>/dev/null | grep -i "error_page"

      2. Inhalt verifizieren (funktionaler Test):

      Lösen Sie einen Fehler aus (z. B. durch Anfordern einer nicht existierenden Seite) und

      prüfen Sie den Body:

      curl -k https://127.0.0.1/non-existent-page | grep -i "nginx"

      Prüfung:

      PASS: Die Ausgabe enthält nicht "nginx" (oder grep gi'
- id: 2.5.3
  title: Sicherstellen, dass das Bereitstellen versteckter Dateien deaktiviert ist
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Versteckte Dateien und Verzeichnisse (beginnend mit einem Punkt, z. B. .git, .env) enthalten häufig sensible
    Metadaten, Versionskontrollhistorien oder Umgebungskonfigurationen. Das Bereitstellen dieser Dateien sollte global deaktiviert
    werden.
  rationale: Versionskontrollsysteme (Git, SVN) und Editoren erzeugen versteckte Dateien, die unbeabsichtigt im Webroot bereitgestellt
    werden können. Sind Dateien wie .git/config oder .env zugänglich, können sie Datenbankzugangsdaten, Quellcode und Infrastrukturdetails
    preisgeben, was zu einer vollständigen Kompromittierung des Systems führen kann. Durch das Blockieren von Anfragen an
    alle Pfade, die mit einem Punkt (.) beginnen, wird dieses Risiko beseitigt.
  impact: Das Blockieren aller Dot-Files unterbricht die Let's-Encrypt-/Certbot-Validierung (.well-known/acme-challenge),
    sofern diese nicht explizit erlaubt wird. Stellen Sie sicher, dass die Ausnahmeregel vor der Deny-Regel platziert wird
    oder spezifischer ist.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html#location
  - 2. https://nginx.org/en/docs/http/ngx_http_access_module.html#deny
  page_start: 67
  audit_raw: '1. Konfiguration prüfen:

    Durchsuchen Sie die geladene Konfiguration nach Regeln zu versteckten Dateien:

    nginx -T 2>/dev/null | grep "location.*\\\."

    Prüfung:

    Suchen Sie nach einem Abschnitt wie location ~ /\. { deny all; ...

    }.

    2. Funktionaler Test (empfohlen):

    Versuchen Sie, auf eine versteckte Dummy-Datei zuzugreifen:

    curl -k -I https://127.0.0.1/.git/HEAD

    Prüfung:

    PASS: Gibt 403 Forbidden  oder 404 Not Found  zurück.

    FAIL: Gibt 200 OK  (falls die Datei existiert) oder den Inhalt der Datei zurück.'
  remediation: "Um den Zugriff auf versteckte Dateien einzuschränken, fügen Sie den folgenden\nKonfigurationsblock innerhalb\
    \ jedes server-Blocks hinzu.\nOption A: Direkte Konfiguration\nPlatzieren Sie diesen Block direkt im jeweiligen server-Abschnitt:\n\
    # Let's-Encrypt-Validierung erlauben (muss vor der Deny-Regel stehen)\nlocation ^~ /.well-known/acme-challenge/ {\n  \
    \  allow all;\n    default_type \"text/plain\";\n}\n# Zugriff auf alle anderen versteckten Dateien verweigern\nlocation\
    \ ~ /\\. {\n    deny all;\n    return 404;\n}\nOption B: Verwendung eines gemeinsamen Snippets (empfohlen)\nErstellen\
    \ Sie eine wiederverwendbare Snippet-Datei (z. B.\n/etc/nginx/snippets/deny-hidden.conf), die die oben genannten Regeln\n\
    enthält, und binden Sie diese im jeweiligen server-Abschnitt ein:\n1. Erstellen Sie /etc/nginx/snippets/deny-hidden.conf\
    \ mit dem Inhalt aus\nOption A.\n2. Sicherheitsprüfung: Stellen Sie sicher, dass die neue Datei restriktive\nBerechtigungen\
    \ hat (Eigentümer: root:root, Modus: 640), wie in Empfehlung\n2.3.2 beschrieben.\n3. Fügen Sie die Include-Direktive zum\
    \ jeweiligen server-Abschnitt hinzu:\nserver {\n    # Modernes Setup für HTTP/3 (QUIC) und HTTP/2\n    listen 443 ssl;\
    \            # TCP für HTTP/1.1 & HTTP/2\n    listen 443 quic reuseport; # UDP für HTTP/3\n    http2 on;             \
    \     # HTTP/2 explizit aktivieren (seit NGINX 1.25.1)\n    server_name example.com;\n    include /etc/nginx/snippets/deny-hidden.conf;\n\
    \    # ... restliche Konfiguration\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep "location.*\\\."
    expected: ''
    severity: medium
    info: '1. Konfiguration prüfen:

      Durchsuchen Sie die geladene Konfiguration nach Regeln zu versteckten Dateien:

      nginx -T 2>/dev/null | grep "location.*\\\."

      Prüfung:

      Suchen Sie nach einem Abschnitt wie location ~ /\. { deny all; ...

      }.

      2. Funktionaler Test (empfohlen):

      Versuchen Sie, auf eine versteckte Dummy-Datei zuzugreifen:

      curl -k -I https://127.0.0.1/.git/HEAD

      Prüfung:

      PASS: Gibt 403 Forbidden  oder'
- id: 2.5.4
  title: Sicherstellen, dass der NGINX-Reverse-Proxy keine Information Disclosure ermöglicht
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'Wenn NGINX als Reverse Proxy fungiert, leitet es die von der Upstream-Anwendung gesendeten Header weiter (z.
    B. "X-Powered-By: Custom_APP " oder "Server: Apache/2.4"). Diese Header sollten entfernt werden, bevor die Antwort den
    Client erreicht, um Information Disclosure über die Backend-Infrastruktur zu verhindern. System-Logging muss so konfiguriert
    sein, dass es die Sicherheits- und Datenschutzrichtlinien der Organisation erfüllt. Detaillierte Logs liefern den erforderlichen
    Kontext (Ereignisquelle, Zeitstempel, Benutzer, Netzwerkdaten) für Incident Response und forensische Analysen. Moderne
    Logging-Strategien bevorzugen strukturierte Formate (JSON) gegenüber unstrukturiertem Text, um die Verarbeitung durch
    SIEM-Lösungen zu erleichtern. Hinweis: Sensible Informationen (z. B. Session-Tokens, personenbezogene Daten in Query-Strings)
    sollten aus Logs ausgeschlossen oder maskiert werden, um Datenlecks zu verhindern. Die access_log-Direktive erlaubt die
    Protokollierung von Client-Anfragen. NGINX aktiviert diese Funktion zwar standardmäßig, bietet jedoch eine detaillierte
    Steuerung auf server- oder location-Ebene. Je nach den Anforderungen des Unternehmens sollte das Protokoll um relevante
    Variablen ergänzt und für eine moderne SIEMIntegration in ein strukturiertes JSON-Format konvertiert werden. Detaillierte
    Informationen zur Konfiguration von Protokollformaten und Variablen finden Sie in Empfehlung 3.1. Stellen Sie sicher,
    dass die Zugriffsprotokollierung für alle kritischen Dienste aktiviert ist. Die error_log-Direktive konfiguriert die Protokollierung
    von Serverfehlern und operativen Meldungen. Anders als Access-Logs erfassen Error-Logs Diagnoseinformationen zu fehlgeschlagenen
    Anfragen, Problemen mit UpstreamVerbindungen und Konfigurationsfehlern. Der Logging-Level bestimmt die Ausführlichkeit
    dieser Meldungen und sollte so gesetzt werden, dass ausreichend Details erfasst werden (typischerweise notice oder info),
    ohne das Speichersystem zu überlasten. Wenn NGINX als Reverse Proxy oder Load Balancer fungiert, terminiert NGINX die
    Client-Verbindung und öffnet eine neue Verbindung zum Upstream-Anwendungsserver. Standardmäßig sieht der Upstream-Server
    die interne IP-Adresse des NGINX-Servers als Quelle, wodurch die ursprüngliche Client-IP verschleiert wird. Standard-HTTPHeader
    wie X-Forwarded-For und X-Real-IP müssen explizit konfiguriert werden, um die ursprüngliche IP-Adresse und Protokollinformationen
    des Clients an die Backend-Anwendung weiterzuleiten.'
  rationale: 'Angreifer führen Aufklärungsmaßnahmen durch, indem sie Response-Header überprüfen, um die im Backend verwendeten
    Technologien zu identifizieren (z. B. bestimmte Versionen von PHP, Java/Tomcat oder Python-Frameworks). Durch die Kenntnis
    der genauen Version können Angreifer gezielt bestimmte CVEs adressieren, die mit diesem Software-Stack in Verbindung stehen.
    Das Entfernen dieser Header verringert die für gezielte Angriffe verfügbaren Informationen. Detaillierte Logs bilden die
    Grundlage für wirksames Incident Response. CISMaßnahme 8.5 ("Collect Detailed Audit Logs") empfiehlt die Erfassung von
    Ereignisquellen, Datumsangaben, Benutzern, Zeitstempeln und Netzwerkadressen. Traditionelle Text-Logs erfordern eine komplexe,
    anfällige Regex-Auswertung, die bei Formatänderungen leicht versagt. Strukturiertes Logging (JSON) löst dieses Problem
    durch ein selbstbeschreibendes Format, das von modernen Analysewerkzeugen (SIEM) nativ verarbeitet wird und sicherstellt,
    dass kritische forensische Daten stets indexierbar und durchsuchbar sind. Access-Logs sind die Primärprotokolle zur Systemnutzung
    und halten detailliert fest, wer wann auf welche Ressourcen zugegriffen hat; außerdem unterstützen sie die allgemeine
    Fehlerbehebung. Ohne aktive Access-Logs bleiben webbasierte Angriffe (wie SQL-Injection, XSS-Scans oder Brute-Force-Versuche)
    für Incident Responder unsichtbar, und Auditoren können weder die Einhaltung der Compliance noch Benutzeraktivitäten überprüfen.
    Die globale Deaktivierung der Protokolle (access_log off;) zerstört faktisch die forensische Nachweiskette für Sicherheitsereignisse.
    Während Access-Logs eingehende Request-Muster erfassen, liefern Error-Logs den internen Systemkontext, der erforderlich
    ist, um zu diagnostizieren, warum ein Request fehlgeschlagen ist. Sie sind unerlässlich für die Identifizierung von: 1.
    Upstream-Fehlern: Timeouts bei Verbindungen oder abgelehnte Verbindungen zu Backend-Servern (z. B. wenn der Anwendungsserver
    ausgefallen ist). 2. Prozessanomalien: Unerwartete Beendigungen oder Neustarts von WorkerProzessen, die auf eine Erschöpfung
    der Ressourcen oder Exploit-Versuche hindeuten können. 3. Konfigurationsfehler: Ungültige Anfragen, die NGINX ablehnt,
    bevor sie in den Access-Logs protokolliert werden (z. B. wenn Header-Größenlimits überschritten werden). Ohne Error-Logs
    sieht ein Administrator im Access-Log zwar einen „500 Internal Server Error “, hat aber keine Möglichkeit, die Ursache
    zu ermitteln. Die Sichtbarkeit der tatsächlichen Client-IP-Adresse ist für Sicherheitsaudits, Incident Response und die
    Zugriffskontrolle innerhalb der Backend-Anwendung unerlässlich. Ohne die Weiterleitung dieser Informationen: 1. Forensik:
    Anwendungsprotokolle zeigen, dass der gesamte Datenverkehr von der NGINX-Proxy-IP stammt, was es unmöglich macht, bösartige
    Aktivitäten zu einem bestimmten Angreifer zurückzuverfolgen. 2. Zugriffskontrolle: IP-basierte Allow-/Deny-Listen oder
    Ratenbegrenzungen auf Anwendungsebene schlagen fehl oder blockieren fälschlicherweise den gesamten Proxy. 3. Compliance:
    Die genaue Protokollierung der Herkunft des Benutzers ist oft eine regulatorische Anforderung.'
  impact: Die Aktivierung der detaillierten JSON-Protokollierung führt zu einem Anstieg des LogVolumens. Stellen Sie sicher,
    dass Ihre Log-Rotationsrichtlinien (logrotate) und die Überwachung des Speicherplatzes angepasst werden, um den erhöhten
    Speicherbedarf zu bewältigen. Das Aktivieren einer detaillierten Zugriffsprotokollierung führt zu einem erheblichen Anstieg
    des Speicherplatzbedarfs. Ohne geeignete Log-Rotation (z. B. logrotate) und Speicherplatz-Monitoring können Logdateien
    den verfügbaren Speicherplatz schnell verbrauchen, wodurch der Server möglicherweise keine Anfragen mehr verarbeitet oder
    abstürzt. Stellen Sie sicher, dass ausreichende Speicherkapazität und Aufbewahrungsrichtlinien vorhanden sind. Das Setzen
    des Logging-Levels auf info (oder sogar debug) kann ein erhebliches Volumen an Logdaten erzeugen, insbesondere auf stark
    ausgelasteten Servern oder während Denial-of-Service-Angriffen. Dies erhöht Disk-I/O und Speicheranforderungen. Stellen
    Sie sicher, dass Log-Rotation (z. B. über logrotate) konfiguriert ist und die Speichernutzung überwacht wird, um zu verhindern,
    dass der verfügbare Speicherplatz erschöpft wird. Das Aktivieren dieser Header ermöglicht es der Backend-Anwendung, die
    ursprüngliche Client-IP zu sehen. Wenn NGINX jedoch einfach einen bereits vorhandenen XForwarded-For-Header ergänzt, der
    von einem bösartigen Client gesendet wurde, könnte die Backend-Anwendung dazu verleitet werden, einer gespooften IP am
    Anfang der Liste zu vertrauen.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_hide_header
  - 1. https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
  - 2. https://nginx.org/en/docs/varindex.html
  - 1. https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log
  - 2. https://nginx.org/en/docs/http/ngx_http_core_module.html#log_not_found
  - 1. https://nginx.org/en/docs/ngx_core_module.html#error_log
  - 2. https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/XForwarded-For
  - 2. https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header
  page_start: 71
  audit_raw: '1. Konfiguration prüfen:

    Durchsuchen Sie die geladene Konfiguration nach Direktiven zum Ausblenden von

    Headern:

    nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header"

    Prüfung:

    Vergewissern Sie sich, dass Direktiven vorhanden sind, um X-Powered-By und

    Server auszublenden.

    2. Funktionale Prüfung (empfohlen):

    Senden Sie eine Anfrage an einen Proxy-Endpunkt und überprüfen Sie die ResponseHeader:

    curl -k -I https://127.0.0.1 | grep -Ei "^(Server|X-Powered-By)"

    Prüfung:

    PASS: Die Ausgabe enthält keine Backend-Details (z. B. X-Powered-By:

    PHP/8.2). Falls Server vorhanden ist, sollte es nur Server: nginx  sein

    (gesteuert durch Empfehlung 2.5.1).

    FAIL: Die Ausgabe enthält Backend-Informationen oder nicht maskierte

    Versionsnummern.

    1. Log-Format-Konfiguration prüfen:

    Prüfen Sie die log_format-Direktiven in Ihrer Konfiguration:

    nginx -T 2>/dev/null | grep -i "log_format"

    Prüfung:

    Stellen Sie sicher, dass ein detailliertes Format (vorzugsweise JSON) definiert

    ist.

    Vergewissern Sie sich, dass das Format kritische Felder enthält:

    $time_iso8601, $remote_addr, $remote_user, $request, $status,

    $http_user_agent.

    2. Nutzung des Access-Logs prüfen:

    Prüfen Sie, ob das definierte Format tatsächlich von der access_log-Direktive

    verwendet wird:

    nginx -T 2>/dev/null | grep "access_log"

    Prüfung:

    Die access_log-Direktive sollte auf den Namen des detaillierten Formats

    verweisen (z. B. access_log /var/log/nginx/access.json

    main_access_json;).

    1. Konfiguration prüfen:

    Überprüfen Sie die vollständig geladene Konfiguration hinsichtlich der

    Protokolleinstellungen:

    nginx -T 2>/dev/null | grep -i "access_log"

    Prüfung:

    Zielprüfung: Vergewissern Sie sich, dass die access_log-Direktiven auf einen

    gültigen lokalen Dateipfad verweisen (z. B. /var/log/nginx/access.json),

    damit ein Log-Shipper die Daten aufnehmen kann.

    Statusprüfung: Identifizieren Sie sämtliche Vorkommen von access_log

    off;.

    PASS: Wenn access_log off;  fehlt oder strikt auf nicht kritische Assets

    begrenzt ist (z. B. location = /favicon.ico , statische Assets oder interne

    Health Checks).

    FAIL: Wenn access_log off;  global im http-Block oder auf server-Blöcke

    angewendet wird, die die Geschäftslogik verarbeiten.

    1. Konfiguration prüfen:

    Prüfen Sie die vollständig geladene Konfiguration auf Error-Log-Einstellungen:

    nginx -T 2>/dev/null | grep -i "error_log"

    Prüfung:

    Vorhandensein: Vergewissern Sie sich, dass error_log global im mainKontext (oder im http-Block) definiert ist.

    Ziel: Stellen Sie sicher, dass es auf eine gültige lokale Datei verweist (z. B.

    /var/log/nginx/error.log), damit ein Log-Shipper die Daten aufnehmen

    kann.

    Level: Bestätigen Sie, dass der Level gemäß Ihrer internen "Monitoring and

    Logging"-Richtlinie gesetzt ist.

    FAIL: Wenn error_log auf /dev/null verweist oder der Level auf crit,

    alert oder emerg gesetzt ist, da dadurch zu viele relevante Warnungen

    unterdrückt werden.

    1. Konfiguration prüfen:

    Prüfen Sie die aktive Konfiguration auf Proxy-Header-Direktiven in Locations mit ProxyWeiterleitung:

    nginx -T 2>/dev/null | grep -E "proxy_set_header (X-Real-IP|X-Forwarded-For)"

    Prüfung:

    Vorhandensein: Vergewissern Sie sich, dass proxy_set_header XForwarded-For und proxy_set_header X-Real-IP  in location-Blöcken

    vorhanden sind, die proxy_pass verwenden (oder grpc_pass,

    fastcgi_pass).

    Korrektheit:

    X-Forwarded-For sollte typischerweise

    $proxy_add_x_forwarded_for verwenden (um die Chain zu erhalten)

    oder $remote_addr (wenn NGINX der erste vertrauenswürdige Hop ist).

    X-Real-IP sollte $remote_addr verwenden.

    Scope: Prüfen Sie, ob dies auf alle relevanten Locations mit Proxy-Weiterleitung

    angewendet wird.'
  remediation: "Konfigurieren Sie NGINX so, dass es die sensiblen Header entfernt. Die Direktive hängt\nvom Upstream-Protokoll\
    \ ab (HTTP-Proxy vs. FastCGI).\nFür Standard-Reverse-Proxy (proxy_pass):\nFügen Sie die folgenden Direktiven zu Ihrem\
    \ http-, server- oder location-Block\nhinzu:\nproxy_hide_header X-Powered-By;\nproxy_hide_header Server;\nFür PHP/FastCGI\
    \ (fastcgi_pass):\nWenn Sie FastCGI verwenden (z. B. für PHP-FPM), verwenden Sie stattdessen die\nDirektive fastcgi_hide_header:\n\
    fastcgi_hide_header X-Powered-By;\nDefinieren Sie ein detailliertes Log-Format im http-Block von\n/etc/nginx/nginx.conf.\
    \ Die Verwendung des JSON-Formats wird für die\nKompatibilität mit modernen SIEM-Werkzeugen ausdrücklich empfohlen.\n\
    Empfohlene Konfiguration (JSON):\nhttp {\n    log_format main_access_json escape=json '{'\n      '\"timestamp\":     \
    \    \"$time_iso8601\",'\n      '\"remote_addr\":       \"$remote_addr\",'\n      '\"remote_user\":       \"$remote_user\"\
    ,'\n      '\"server_name\":       \"$server_name\",'\n      '\"request_method\":    \"$request_method\",'\n      '\"request_uri\"\
    :       \"$request_uri\",'\n      '\"status\":            $status,'\n      '\"body_bytes_sent\":   $body_bytes_sent,'\n\
    \      '\"http_referer\":      \"$http_referer\",'\n      '\"http_user_agent\":   \"$http_user_agent\",'\n      '\"x_forwarded_for\"\
    :   \"$http_x_forwarded_for\",'\n      '\"request_id\":        \"$request_id\"'\n    '}';\n    # Format global oder pro\
    \ Server anwenden\n    access_log /var/log/nginx/access.json main_access_json;\n}\nLegacy-Konfiguration (textbasiert):\n\
    Wenn JSON nicht realisierbar ist, stellen Sie sicher, dass das Textformat alle\nerforderlichen Felder erfasst:\nlog_format\
    \ main_detailed '$remote_addr - $remote_user [$time_local] '\n                         '\"$request\" $status $body_bytes_sent\
    \ '\n                         '\"$http_referer\" \"$http_user_agent\" '\n                         '\"$http_x_forwarded_for\"\
    ';\nAktivieren Sie die Zugriffsprotokollierung im http-Block, um einen sicheren globalen\nStandard zu setzen, oder konfigurieren\
    \ Sie diese explizit innerhalb bestimmter serverBlöcke. Es wird empfohlen, das detaillierte Log-Format aus Empfehlung\
    \ 3.1 zu\nverwenden.\nKonfigurationsbeispiel:\nhttp {\n    # Globale Protokollierung mit dem detaillierten JSON-Format\
    \ aus Empfehlung 3.1\naktivieren\n    access_log /var/log/nginx/access.json main_access_json;\n    server {\n        #\
    \ Erbt die globale Log-Einstellung oder kann überschrieben werden:\n        access_log /var/log/nginx/example.com.access.json\
    \ main_access_json;\n        location / {\n            # ...\n        }\n        # Ausnahme: Protokollierung für favicon\
    \ deaktivieren, um Rauschen zu\nreduzieren (optional)\n        location = /favicon.ico {\n            access_log    off;\n\
    \            log_not_found off;\n        }\n    }\n}\nKonfigurieren Sie die error_log-Direktive im main-Kontext (am Anfang\
    \ der\nnginx.conf), um operative Ereignisse zu erfassen.\nKonfigurationsbeispiel:\n# Fehler mit dem Level 'notice' in\
    \ eine bestimmte Datei protokollieren\nerror_log /var/log/nginx/error.log notice;\nhttp {\n    # ...\n}\nHinweis: Der\
    \ spezifische Logging-Level sollte mit der \"Monitoring and Logging\"-\nRichtlinie des Unternehmens abgestimmt sein und\
    \ den Bedarf an forensischen Details\ngegenüber Speicher- und Verarbeitungskosten abwägen. Typischerweise wird info\n\
    oder notice empfohlen.\nKonfigurieren Sie NGINX so, dass Client-IP-Informationen in Ihren server- oder\nlocation-Blöcken\
    \ weitergegeben werden, in denen proxy_pass verwendet wird.\nlocation / {\n    # 'https' für Zero-Trust-Umgebungen verwenden\
    \ (erfordert proxy_ssl_verifyKonfiguration)\n    # 'http'  für standardmäßiges TLS-Offloading verwenden (Upstream-Traffic\
    \ ist\nunverschlüsselt)\n    proxy_pass <protocol>://example_backend_application;\n    # Standard-Header: Hängt die Client-IP\
    \ an die Liste der Proxys an\n    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n    # NGINX-spezifischer\
    \ Header: Setzt die direkte Client-IP (nützlich für Apps,\ndie einen einzelnen Wert erwarten)\n    proxy_set_header X-Real-IP\
    \         $remote_addr;\n    # Empfohlen: Protokoll weitergeben (http vs. https)\n    proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n}"
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header" && curl -k -I https://127.0.0.1 | grep -Ei "^(Server|X-Powered-By)"
      && nginx -T 2>/dev/null | grep -i "log_format" && nginx -T 2>/dev/null | grep "access_log" && nginx -T 2>/dev/null |
      grep -i "access_log" && nginx -T 2>/dev/null | grep -i "error_log" && nginx -T 2>/dev/null | grep -E "proxy_set_header
      (X-Real-IP|X-Forwarded-For)"
    expected: ''
    severity: medium
    info: '1. Konfiguration prüfen:

      Durchsuchen Sie die geladene Konfiguration nach Direktiven zum Ausblenden von

      Headern:

      nginx -T 2>/dev/null | grep -Ei "(proxy|fastcgi)_hide_header"

      Prüfung:

      Vergewissern Sie sich, dass Direktiven vorhanden sind, um X-Powered-By und

      Server auszublenden.

      2. Funktionale Prüfung (empfohlen):

      Senden Sie eine Anfrage an einen Proxy-Endpunkt und überprüfen Sie die ResponseHeader'
- id: 4.1.1
  title: Sicherstellen, dass HTTP auf HTTPS umgeleitet wird
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Browser und Clients stellen durch die Nutzung von HTTPS verschlüsselte Verbindungen zu Servern her. Anfragen,
    die HTTP verwenden, sind unverschlüsselt. Unverschlüsselte Anfragen sollten so umgeleitet werden, dass sie verschlüsselt
    werden. Jeder auf Ihrem Webserver lauschende HTTP-Port sollte auf ein Server-Profil umleiten, das Verschlüsselung verwendet.
    Der Standard-Port für HTTP (unverschlüsselt) ist 80.
  rationale: Die Umleitung des User-Agent-Datenverkehrs auf HTTPS trägt dazu bei, sicherzustellen, dass der gesamte Benutzerdatenverkehr
    verschlüsselt ist. Moderne Browser warnen Benutzer davor, dass Ihre Website unsicher ist, wenn HTTPS nicht verwendet wird.
    Dies kann das Vertrauen der Benutzer in Ihre Website mindern und letztendlich zu einer geringeren Nutzung Ihrer Webservices
    führen. Die Umleitung von HTTP auf HTTPS verbindet Sicherheit mit Benutzerfreundlichkeit; Benutzer können auf Ihre Website
    zugreifen, selbst wenn ihnen das Sicherheitsbewusstsein fehlt, HTTPS anstelle von HTTP zu verwenden, wenn sie Ihre Website
    aufrufen.
  impact: Die Verwendung von HTTPS führt zwar zu einer Leistungseinbuße beim Datenverkehr zu Ihrer Website, jedoch betrachten
    viele Unternehmen dies aufgrund des erhöhten Sicherheitswerts als Kosten des Geschäftsbetriebs.
  references:
  - 1. https://nginx.org/en/docs/http/ngx_http_core_module.html
  - 2. NIST SP 800-53:rev5:SC-8
  page_start: 89
  audit_raw: 'Um zu prüfen, auf welchen Ports Ihr Server lauscht, überprüfen Sie die

    Konfigurationsdatei Ihres Webservers oder Proxys. Die Standardkonfigurationsdatei für

    Webserver ist /etc/nginx/conf.d/default.conf und die

    Standardkonfigurationsdatei für Proxys ist /etc/nginx/nginx.conf. Die

    Konfigurationsdatei sollte eine Anweisung enthalten, die auf HTTPS umleitet. Dies sollte

    dem unten stehenden Code ähneln, bei dem cisecurity.org als Beispiel verwendet wird.

    server {

    listen 80;

    server_name cisecurity.org;

    return 301 https://$host$request_uri;

    }'
  remediation: 'Bearbeiten Sie die Konfigurationsdatei Ihres Webservers oder Proxys, um alle

    unverschlüsselten lauschenden Ports, wie etwa Port 80, mittels return-Direktive auf

    HTTPS umzuleiten (cisecurity.org wird als beispielhafter Servername verwendet).

    server {

    listen 80;

    server_name cisecurity.org;

    return 301 https://$host$request_uri;

    }'
  checks:
  - type: manual_review
    info: 'Um zu prüfen, auf welchen Ports Ihr Server lauscht, überprüfen Sie die

      Konfigurationsdatei Ihres Webservers oder Proxys. Die Standardkonfigurationsdatei für

      Webserver ist /etc/nginx/conf.d/default.conf und die

      Standardkonfigurationsdatei für Proxys ist /etc/nginx/nginx.conf. Die

      Konfigurationsdatei sollte eine Anweisung enthalten, die auf HTTPS umleitet. Dies sollte

      dem unten stehenden Code ähneln, bei dem cisecurity.org als Beispiel verwendet wird.

      server {

      listen 80;

      server_name cisecurity.org'
    severity: medium
- id: 4.1.2
  title: Sicherstellen, dass ein vertrauenswürdiges Zertifikat und eine Vertrauenskette installiert sind
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Zertifikate und deren Vertrauensketten (Trust Chains) werden benötigt, um die Identität eines Webservers als
    legitim und vertrauenswürdig nachzuweisen. Zertifizierungsstellen überprüfen die Identität eines Webservers und bestätigen,
    dass Sie der Inhaber des Domainnamens dieses Webservers sind.
  rationale: Ohne ein auf Ihrem Webserver installiertes Zertifikat und eine vollständige Vertrauenskette werden moderne Browser
    Ihren Webserver als nicht vertrauenswürdig kennzeichnen.
  impact: ''
  references:
  - 1. https://nginx.org/en/docs/http/configuring_https_servers.html#chains
  - 2. https://support.globalsign.com/customer/portal/articles/1290470-install-certificate-
  page_start: 91
  audit_raw: '``Führen Sie diesen Befehl aus, um den Dateispeicherort Ihres Zertifikats zu finden:

    grep -ir ssl_certificate /etc/nginx/

    Die Ausgabe Ihres Befehls sollte der unten stehenden Ausgabe ähneln. Wenn keine

    Ausgabe erfolgt, haben Sie kein Zertifikat installiert.

    Webserver:

    /etc/nginx/nginx.conf:    ssl_certificate     /etc/nginx/cert.pem;

    /etc/nginx/nginx.conf:    ssl_certificate_key /etc/nginx/nginx.key;

    Öffnen Sie die Datei rechts neben der ssl_certificate-Direktive mit folgendem

    Befehl:

    cat /etc/nginx/cert.pem

    Die Ausgabe Ihres Befehls sollte in etwa so aussehen wie unten dargestellt. Sie sollte

    die vollständige Zertifikatskette enthalten.

    -----BEGIN CERTIFICATE-----

    Fügen Sie hier das Zertifikat Ihres Webservers ein

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Fügen Sie hier das Intermediate-Zertifikat Ihrer Zertifizierungsstelle ein

    -----END CERTIFICATE-----

    -----BEGIN CERTIFICATE-----

    Fügen Sie hier das Root-Zertifikat Ihrer Zertifizierungsstelle ein

    -----END CERTIFICATE-----'
  remediation: "Verwenden Sie das folgende Verfahren, um ein Zertifikat und dessen signierte\nZertifikatskette auf Ihrem Webserver,\
    \ Load Balancer oder Proxy zu installieren.\nSchritt 1: Erstellen Sie den privaten Schlüssel (Private Key) des Servers\
    \ und eine\nZertifikatsignierungsanfrage (Certificate Signing Request, CSR).\nDer folgende Befehl erstellt den privaten\
    \ Schlüssel Ihres Zertifikats mit einer\nSchlüssellänge von 4096 Bit. Er gibt zudem Ihre Zertifikatsignierungsanfrage\
    \ in der\nDatei nginx.csr in Ihrem aktuellen Arbeitsverzeichnis aus.\nopenssl req -new -newkey rsa:4096 -keyout nginx.key\
    \ -out nginx.csr\nGeben Sie die folgenden Informationen zu Ihrem privaten Schlüssel ein:\nCountry Name (2 letter code)\
    \ [XX]: Ihr Land\nState or Province Name (full name) []: Ihr Bundesland\nLocality Name (eg, city) [Default City]: Ihre\
    \ Stadt\nOrganization Name (eg, company) [Default Company Ltd]: Ihr Unternehmen\nOrganizational Unit Name (eg, section)\
    \ []: Ihre Abteilung\nCommon Name (eg, your name or your server's hostname) []: Der DNS-Name Ihres\nServers\nEmail Address\
    \ []: Ihre E-Mail-Adresse\nSchritt 2: Beziehen Sie ein signiertes Zertifikat von Ihrer Zertifizierungsstelle.\nStellen\
    \ Sie der Zertifizierungsstelle Ihrer Wahl Ihre Zertifikatsignierungsanfrage zur\nVerfügung. Befolgen Sie die Signierungsverfahren\
    \ Ihrer Zertifizierungsstelle, um ein\nZertifikat und die Vertrauenskette des Zertifikats zu erhalten. Eine vollständige\n\
    Vertrauenskette wird in der Regel im .pem-Format geliefert.\nSchritt 3: Installieren Sie das Zertifikat und die signierte\
    \ Zertifikatskette auf Ihrem\nWebserver.\nLegen Sie die von Ihrer Zertifizierungsstelle bereitgestellte .pem-Datei im\
    \ Verzeichnis\nIhrer Wahl ab. Suchen Sie die Schlüsseldatei, die beim Erstellen der\nZertifikatsignierungsanfrage erzeugt\
    \ wurde. Öffnen Sie die Konfigurationsdatei Ihrer\nWebsite und bearbeiten Sie den TLS-Listener so, dass die Direktiven\n\
    ssl_certificate und ssl_certificate_key wie unten gezeigt verwendet\nwerden. Prüfen Sie außerdem die Include-Dateien innerhalb\
    \ Ihrer nginx.conf. Dies\nsollte Teil des server-Blocks sein.\nserver {\n    listen              443 ssl http2;\n    listen\
    \              [::]:443 ssl http2;\n    ssl_certificate     /etc/nginx/cert.crt;\n    ssl_certificate_key /etc/nginx/nginx.key;\n\
    \    ...\n    }\nNachdem Sie diese Datei bearbeitet haben, müssen Sie den Systemd-Dienst nginx\nneu starten, damit diese\
    \ Änderungen wirksam werden. Dies kann mit dem folgenden\nBefehl erfolgen:\nsudo systemctl restart nginx"
  checks:
  - type: command
    command: grep -ir ssl_certificate /etc/nginx/ && cat /etc/nginx/cert.pem
    expected: ''
    severity: medium
    info: '``Führen Sie diesen Befehl aus, um den Dateispeicherort Ihres Zertifikats zu finden:

      grep -ir ssl_certificate /etc/nginx/

      Die Ausgabe Ihres Befehls sollte der unten stehenden Ausgabe ähneln. Wenn keine

      Ausgabe erfolgt, haben Sie kein Zertifikat installiert.

      Webserver:

      /etc/nginx/nginx.conf:    ssl_certificate     /etc/nginx/cert.pem;

      /etc/nginx/nginx.conf:    ssl_certificate_key /etc/nginx/nginx.k'
- id: 4.1.3
  title: Sicherstellen, dass die Berechtigungen privater Schlüssel eingeschränkt sind
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Die privaten Schlüssel des Servers und gegebenenfalls seiner vhosts sollten vor unautorisiertem Zugriff geschützt
    werden, indem der Zugriff basierend auf dem Prinzip der minimalen Rechtevergabe eingeschränkt wird.
  rationale: Die private Schlüsseldatei eines Servers sollte auf die Berechtigungen 400 eingeschränkt werden. Dadurch wird
    sichergestellt, dass nur der Eigentümer der privaten Schlüsseldatei darauf zugreifen kann. Dies sind die minimal erforderlichen
    Berechtigungen, damit der Server betrieben werden kann. Wenn die private Schlüsseldatei nicht geschützt ist, kann ein
    unautorisierter Benutzer mit Zugriff auf den Server die private Schlüsseldatei möglicherweise finden und verwenden, um
    an Ihren Server gesendeten Traffic zu entschlüsseln.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:IA-5 (2)
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 95
  audit_raw: 'Überprüfen Sie, ob die Berechtigungen der Schlüsseldatei auf 400 gesetzt sind. Dies

    kann durch Ausführen des folgenden Befehls festgestellt werden. Sie sollten

    /etc/nginx/ durch das tatsächliche Verzeichnis ersetzen, in dem sich Ihre

    Schlüsseldateien befinden.

    find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

    Die Ausgabe sollte die Berechtigung 400 anzeigen.

    Beispiel:

    /etc/nginx/nginx.key 400'
  remediation: 'Führen Sie den folgenden Befehl aus, um übermäßige Berechtigungen für

    Schlüsseldateien im Verzeichnis /etc/nginx/ zu entfernen.

    Hinweis: Das Verzeichnis /etc/nginx/ sollte durch das tatsächliche Verzeichnis

    ersetzt werden, in dem sich Ihre Schlüsseldateien befinden.

    find /etc/nginx/ -name ''*.key'' -exec chmod u-wx,go-rwx {} +'
  checks:
  - type: command
    command: find /etc/nginx/ -name '*.key' -exec stat -Lc "%n %a" {} +
    expected: ''
    severity: medium
    info: 'Überprüfen Sie, ob die Berechtigungen der Schlüsseldatei auf 400 gesetzt sind. Dies

      kann durch Ausführen des folgenden Befehls festgestellt werden. Sie sollten

      /etc/nginx/ durch das tatsächliche Verzeichnis ersetzen, in dem sich Ihre

      Schlüsseldateien befinden.

      find /etc/nginx/ -name ''*.key'' -exec stat -Lc "%n %a" {} +

      Die Ausgabe sollte die Berechtigung 400 anzeigen.

      Beispiel:

      /etc/nginx/nginx.key'
- id: 4.1.4
  title: Sicherstellen, dass nur moderne TLS-Protokolle verwendet werden
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: In NGINX sollten für alle Client- und Upstream-Verbindungen nur moderne TLSProtokolle aktiviert sein. Das Entfernen
    veralteter TLS- und SSL-Protokolle (SSL 3.0, TLS 1.0, 1.1 und 1.2) und das Aktivieren stabiler TLS-Protokolle (TLS 1.3)
    stellt sicher, dass Benutzer von starken Sicherheitsfunktionen profitieren können, und schützt sie vor unsicheren, veralteten
    Protokollen.
  rationale: 'Warum SSL 3.0 deaktivieren: Die POODLE-Schwachstelle ermöglichte es Angreifern im Jahr 2014, SSL 3.0 auszunutzen,
    um durch Schwächen im CBC-Verfahren Klartextinformationen zu erlangen. Zudem ist SSL 3.0 nicht mehr FIPS 140-2-konform.
    Warum TLS 1.0 deaktivieren: TLS 1.0 wurde für die Nutzung verworfen, als die PCI-DSS-Compliance im Juni 2018 vorschrieb,
    dass es für Anwendungen, die Kreditkartennummern verarbeiten, nicht mehr verwendet werden darf. TLS 1.0 nutzt keine modernen
    Schutzmechanismen, und fast alle User Agents, die TLS 1.2 oder höher nicht unterstützen, werden von ihren Herstellern
    nicht mehr gepflegt. Warum TLS 1.1 deaktivieren: Aufgrund der erhöhten Sicherheit, die mit höheren TLS-Versionen einhergeht,
    sollte TLS 1.1 deaktiviert werden. Moderne Browser haben bereits Anfang 2019 damit begonnen, TLS 1.1 als veraltet zu markieren.
    Warum TLS 1.2 deaktivieren: Obwohl TLS 1.2 für seine Zeit robust war, lässt seine Komplexität schwache Konfigurationen
    zu, einschließlich Cipher Suites, denen Perfect Forward Secrecy fehlt. TLS 1.3 beseitigt dieses Risiko, indem es Perfect
    Forward Secrecy vorschreibt und veraltete kryptografische Primitive entfernt. In Anbetracht dessen erlaubt NIST SP 80052
    Rev. 2 die Deaktivierung von TLS 1.2, sofern es nicht für die Interoperabilität erforderlich ist. Damit positioniert sich
    TLS 1.3 als einziges empfohlenes Protokoll für moderne, sichere Umgebungen. Warum TLS 1.3 aktivieren: TLS 1.3 verbessert
    die Sicherheit, indem es standardmäßig mehrere unsichere Cipher Suites entfernt und stattdessen sicherere Algorithmen
    hinzufügt. Alle Mechanismen zum asymmetrischen Schlüsselaustausch unterstützen in dieser TLS-Version Perfect Forward Secrecy.
    Darüber hinaus verbessert TLS 1.3 die Performance erheblich, indem beim TLS-Handshake ein vollständiger Roundtrip entfällt.'
  impact: Das Deaktivieren bestimmter TLS-Versionen kann dazu führen, dass Legacy-UserAgents keine Verbindung zu Ihrem Server
    herstellen können. Das Deaktivieren der Aushandlung bestimmter Protokolle mit Ihrem Backend-Server kann außerdem Ihre
    Fähigkeit einschränken, Verbindungen zu Legacy-Servern herzustellen. Sie sollten bei der Auswahl Ihrer TLS-Protokolle
    immer berücksichtigen, ob Sie Legacy-User-Agents oder Legacy-Server unterstützen müssen.
  references:
  - 1. https://webkit.org/blog/8462/deprecation-of-legacy-tls-1-0-and-1-1-versions/
  - 2. https://www.cloudflare.com/learning/ssl/why-use-tls-1.3/
  page_start: 97
  audit_raw: 'Sie können prüfen, welche SSL/TLS-Protokolle Ihr Server verwendet, indem Sie den

    folgenden Befehl ausführen, um die konfigurierten SSL/TLS-Protokolle auf dem Server

    anzuzeigen. Wenn etwas Älteres als TLS 1.3 implementiert ist oder keine Ausgabe

    erscheint, ist diese Empfehlung nicht umgesetzt.

    grep -ir ssl_protocol /etc/nginx

    Hinweis: Je nach Konfiguration können die Ergebnisse variieren. Die Direktive

    ssl_protocols sollte immer Teil Ihres Server-Blocks sein. Wenn Ihr NGINX-Server

    auch als Proxy oder Load Balancer fungiert, sollten Sie zudem prüfen, ob die Direktive

    proxy_ssl_protocols im location-Block Ihrer NGINX-Konfiguration vorhanden

    ist. Dies stellt sicher, dass Ihr Proxy beim Verschlüsseln des Datenverkehrs mit dem

    Upstream-Server bestimmten Aushandlungsregeln folgt.'
  remediation: "Führen Sie die folgenden Befehle aus, um Ihre ssl_protocols zu ändern, falls diese\nbereits konfiguriert sind.\
    \ Diese Remediation-Anweisung geht davon aus, dass Ihre\nNGINX-Konfigurationsdatei keine Serverkonfigurationen außerhalb\
    \ von\n/etc/nginx/nginx.conf enthält. Möglicherweise müssen Sie auch die includeDateien in Ihrer nginx.conf überprüfen,\
    \ um sicherzustellen, dass dies\nordnungsgemäß implementiert ist.\nWebserver:\nsed -i \"s/ssl_protocols[^;]*;/ssl_protocols\
    \ TLSv1.3;/\" /etc/nginx/nginx.conf\nProxy:\nsed -i \"s/proxy_ssl_protocols[^;]*;/proxy_ssl_protocols TLSv1.3;/\"\n/etc/nginx/nginx.conf\n\
    Wenn Ihre ssl_protocols noch nicht konfiguriert sind, können Sie dies manuell tun,\nindem Sie die Konfigurationsdatei\
    \ Ihres Webservers oder Proxyservers öffnen und die\nDirektiven hinzufügen.\nWebserver:\nserver {\n    ssl_protocols TLSv1.3;\n\
    }\nProxy:\nlocation / {\n      proxy_pass          cisecurity.org;\n      proxy_ssl_protocols TLSv1.3;\n    }"
  checks:
  - type: command
    command: grep -ir ssl_protocol /etc/nginx
    expected: ''
    severity: medium
    info: 'Sie können prüfen, welche SSL/TLS-Protokolle Ihr Server verwendet, indem Sie den

      folgenden Befehl ausführen, um die konfigurierten SSL/TLS-Protokolle auf dem Server

      anzuzeigen. Wenn etwas Älteres als TLS 1.3 implementiert ist oder keine Ausgabe

      erscheint, ist diese Empfehlung nicht umgesetzt.

      grep -ir ssl_protocol /etc/nginx

      Hinweis: Je nach Konfiguration können die Ergebnisse variieren. Die Direk'
- id: 4.1.5
  title: Schwache Cipher deaktivieren
  scoring: manual
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: Die ssl_protocols-Direktive muss verwendet werden, um schwache Protokolle zu deaktivieren und ausschließlich
    TLS 1.3 zu aktivieren. In einer reinen TLS-1.3Konfiguration ist die ssl_ciphers-Direktive nicht mehr erforderlich, da
    das Protokoll selbst einen kleinen, nicht verhandelbaren Satz hochsicherer AEAD-Cipher (Authenticated Encryption with
    Associated Data) vorschreibt. Dieser Ansatz vereinfacht die Konfiguration und eliminiert das Risiko, schwache oder unsichere
    Cipher Suites auszuwählen. Die ssl_prefer_server_ciphers-Direktive sollte für TLS 1.3 auf off gesetzt werden. Da alle
    verfügbaren Cipher sicher sind, bietet es einen Leistungsvorteil ohne Kompromisse bei der Sicherheit, wenn dem Client
    (User Agent) die Wahl des für seine Hardware performantesten Ciphers überlassen wird. In einem Reverse-Proxy-Setup ist
    es entscheidend sicherzustellen, dass alle UpstreamDienste ebenfalls TLS 1.3 unterstützen. Wenn ein Upstream-Server ein
    älteres Protokoll erfordert, müssen die Direktiven proxy_ssl_protocols und proxy_ssl_ciphers so konfiguriert werden, dass
    sie den Anforderungen des Upstreams entsprechen. Dies sollte jedoch als temporäre Ausnahme behandelt werden, die behoben
    werden muss.
  rationale: Schwache kryptografische Cipher können zur Kompromittierung sensibler Daten führen. In modernen TLS-Konfigurationen
    besteht der wirksamste Weg zur Deaktivierung aller schwachen Cipher darin, ausschließlich das Protokoll TLS 1.3 zu aktivieren.
    Die TLS1.3-Spezifikation entfernt alle zuvor bekannten schwachen und veralteten Cipher Suites und schreibt die Verwendung
    eines kleinen Satzes hochsicherer AuthenticatedEncryption-Cipher (AEAD) vor. Dieser Ansatz ist einfacher und weniger fehleranfällig
    als das Pflegen komplexer Denylists oder Allowlists von Ciphern für ältere Protokolle.
  impact: 'Auswirkungen der verpflichtenden Verwendung von TLS 1.3: Das Erzwingen einer reinen TLS-1.3-Konfiguration erhöht
    die Sicherheit, führt jedoch beabsichtigt zu Verbindungsfehlern bei Legacy-Clients. Dies betrifft hauptsächlich: Nicht
    unterstützte User Agents: Clients auf veralteten Betriebssystemen (z. B. Android < 10, iOS < 12.2, Windows < 10 ohne Updates)
    und sehr alte Browser (z. B. Internet Explorer), die TLS 1.3 nicht unterstützen, können keine Verbindung herstellen. Diese
    Clients befinden sich typischerweise außerhalb des Sicherheitslebenszyklus ihrer Hersteller und stellen ein eigenständiges
    Risiko dar. Legacy-Upstream-Dienste: Wenn NGINX in einem Reverse-Proxy-Szenario ausschließlich für TLS 1.3 konfiguriert
    ist, kann keine Verbindung zu einem Upstream-Server (Backend) hergestellt werden, der nur TLS 1.2 oder älter unterstützt.
    Dies führt zu Dienstunterbrechungen. Vor der Durchsetzung ist eine gründliche Bewertung der Backend-Kompatibilität erforderlich.'
  references:
  - 1. https://mozilla.github.io/server-side-tls/ssl-config-generator/
  - 2. https://nginx.org/en/docs/http/ngx_http_ssl_module.html
  page_start: 101
  audit_raw: "Verwenden Sie das folgende Verfahren, um zu verifizieren, dass ausschließlich\nssl_protocols TLSv1.3;  verwendet\
    \ wird.\nnginx -T 2>/dev/null | grep -E '^\\s*ssl_protocols'\nDie Ausgabe muss ssl_protocols TLSv1.3;  exklusiv für jeden\
    \ relevanten\nKonfigurationsblock (z. B. auf der http- oder server-Ebene) aufzeigen.\nBeispielausgabe:\nnginx: the configuration\
    \ file /etc/nginx/nginx.conf syntax is ok\nnginx: configuration file /etc/nginx/nginx.conf test is successful\n# configuration\
    \ file /etc/nginx/nginx.conf:\n        ssl_protocols TLSv1.3;\n# configuration file /etc/nginx/conf.d/default.conf:\n\
    \        ssl_protocols TLSv1.3;"
  remediation: 'Setzen Sie ssl_protocols TLSv1.3; . Die Direktive ssl_ciphers ist für eine reine

    TLS 1.3-Konfiguration nicht erforderlich, da die sicheren Standardwerte der zugrunde

    liegenden Kryptobibliothek (z. B. OpenSSL) verwendet werden.'
  checks:
  - type: command
    command: nginx -T 2>/dev/null | grep -E '^\s*ssl_protocols'
    expected: ''
