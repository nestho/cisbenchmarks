  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: The remote_listener setting determines whether or not a valid listener can be established on a system separate
    from the database instance. This setting should be empty unless the organization specifically needs a valid listener on
    a separate system or on nodes running Oracle RAC instances.
  rationale: Permitting a remote listener for connections to the database instance can allow for the potential spoofing of
    connections and that could compromise data confidentiality and integrity.
