controls:
- id: 6.2.18
  title: Ensure the 'SELECT ANY DICTIONARY' Privilege Audit Is Enabled
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - Linux Host OS using Traditional Auditing
  - Level 1 - Windows Server Host OS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  - Level 1 - Linux Host OS using Unified Auditing
  - Level 1 - Windows Server Host OS using Unified Auditing
  description: The Oracle installation version and patches should be the most recent that are compatible with the organization's
    operational needs.
  rationale: Using the most recent Oracle database software, along with all applicable patches can help limit the possibilities
    for vulnerabilities in the software, the installation version and/or patches applied during setup should be established
    according to the needs of the organization. Ensure you are using a release that is covered by a level of support that
    includes the generation of Critical Patch Updates.
  impact: ''
  references:
  - 1. http://www.oracle.com/us/support/assurance/fixing-policies/index.html
  - 2. http://www.oracle.com/technetwork/topics/security/alerts-086861.html
  page_start: 8
  audit_raw: 'To assess this recommendation, use the following example shell command as appropriate

    for your environment.

    For example, on Linux systems:

    opatch lsinventory | grep -e "^.*<latest_patch_version_numer>\s*.*$"

    15 | P a g e

    For example, on Windows systems:

    opatch lsinventory | find "<latest_patch_version_number>"'
  remediation: 'Perform the following step for remediation:

    Download and apply the latest quarterly Critical Patch Update patches.'
  checks:
  - type: command
    command: opatch lsinventory | grep -e "^.*<latest_patch_version_numer>\s*.*$"
    expected: ''
    severity: medium
    info: 'To assess this recommendation, use the following example shell command as appropriate

      for your environment.

      For example, on Linux systems:

      opatch lsinventory | grep -e "^.*<latest_patch_version_numer>\s*.*$"

      15 | P a g e

      For example, on Windows systems:

      opatch lsinventory | find "<latest_patch_version_number>"'
- id: 2.1.1
  title: Ensure 'SECURE_CONTROL_' Is Set In 'listener.ora'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS using Traditional Auditing
  - Level 1 - Windows Server Host OS using Traditional Auditing
  - Level 1 - Linux Host OS using Unified Auditing
  - Level 1 - Windows Server Host OS using Unified Auditing
  description: The SECURE_CONTROL_<listener_name> setting determines the type of control connection the Oracle server requires
    for remote configuration of the listener.
  rationale: Listener configuration changes via unencrypted remote connections can result in unauthorized users sniffing control
    configuration information from the network.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/NETRF/listener.htm#NETRF327
  page_start: 17
  audit_raw: "To audit this recommendation, follow these steps:\n1. Open the $ORACLE_HOME/network/admin/listener.ora file\
    \ (or\n%ORACLE_HOME%\\network\\admin\\listener.ora on Windows)\n2. Ensure that each defined listener as an associated\n\
    SECURE_CONTROL_<listener_name> directive.\nFor example:\nLISTENER1 =\n  (DESCRIPTION=\n    (ADDRESS=(PROTOCOL=TCP) (HOST=sales-server)(PORT=1521))\n\
    \    (ADDRESS=(PROTOCOL=IPC) (KEY=REGISTER))\n    (ADDRESS=(PROTOCOL=TCPS) (HOST=sales-server)(PORT=1522)))\n  SECURE_CONTROL_LISTENER1=TCPS\n\
    17 | P a g e"
  remediation: 'To remediate this recommendation:

    Set the SECURE_CONTROL_<listener_name> for each defined listener in the listener.ora

    file.'
  checks:
  - type: manual_review
    info: "To audit this recommendation, follow these steps:\n1. Open the $ORACLE_HOME/network/admin/listener.ora file (or\n\
      %ORACLE_HOME%\\network\\admin\\listener.ora on Windows)\n2. Ensure that each defined listener as an associated\nSECURE_CONTROL_<listener_name>\
      \ directive.\nFor example:\nLISTENER1 =\n  (DESCRIPTION=\n    (ADDRESS=(PROTOCOL=TCP) (HOST=sales-server)(PORT=1521))\n\
      \    (ADDRESS=(PROTOCOL=IPC) (KEY=REGISTER))\n    (ADDRESS=(PROTOCOL=TCPS) (HOST=sales-server)(PORT=1522)))\n  SECURE_CONTROL_LISTENER1=TCPS\n\
      1"
    severity: medium
- id: 2.1.2
  title: Ensure 'extproc' Is Not Present in 'listener.ora'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS using Traditional Auditing
  - Level 1 - Windows Server Host OS using Traditional Auditing
  - Level 1 - Linux Host OS using Unified Auditing
  - Level 1 - Windows Server Host OS using Unified Auditing
  description: extproc should be removed from the listener.ora to mitigate the risk that OS libraries can be invoked by the
    Oracle instance.
  rationale: extproc allows the database to run procedures from OS libraries. These library calls can, in turn, run any OS
    command.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/DBSEG/app_devs.htm#DBSEG656
  page_start: 19
  audit_raw: 'To audit this recommendation, execute the following shell commands as appropriate for

    your Linux/Windows environment.

    Linux environment:

    grep -i extproc $ORACLE_HOME/network/admin/listener.ora

    Windows environment:

    find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora

    Ensure extproc does not exist.'
  remediation: 'To remediate this recommendation:

    Remove extproc from the listener.ora file.'
  checks:
  - type: command
    command: grep -i extproc $ORACLE_HOME/network/admin/listener.ora && find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora
    expected: ''
    severity: medium
    info: 'To audit this recommendation, execute the following shell commands as appropriate for

      your Linux/Windows environment.

      Linux environment:

      grep -i extproc $ORACLE_HOME/network/admin/listener.ora

      Windows environment:

      find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora

      Ensure extproc does not exist.'
- id: 2.1.3
  title: Ensure 'ADMIN_RESTRICTIONS_' Is Set to 'ON'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS using Traditional Auditing
  - Level 1 - Windows Server Host OS using Traditional Auditing
  - Level 1 - Linux Host OS using Unified Auditing
  - Level 1 - Windows Server Host OS using Unified Auditing
  description: The admin_restrictions_<listener_name> setting in the listener.ora file can require that any attempted real-time
    alteration of the parameters in the listener via the set command file be refused unless the listener.ora file is manually
    altered, then restarted by a privileged user.
  rationale: Blocking unprivileged users from making alterations of the listener.ora file, where remote data/service settings
    are specified, will help protect data confidentiality.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/NETRF/listener.htm#NETRF310
  page_start: 21
  audit_raw: 'To audit this recommendation, execute the following shell commands as appropriate for

    your Linux/Windows environment.

    Linux environment:

    grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora

    Windows environment:

    find /I "admin_restrictions" %ORACLE_HOME%|\network\admin\listener.ora

    Ensure admin_restrictions_<listener_name> is set to ON for all listeners.'
  remediation: 'To remediate this recommendation:

    Use a text editor such as vi to set the admin_restrictions_<listener_name> to the value

    ON.

    21 | P a g e'
  checks:
  - type: command
    command: grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora && find /I "admin_restrictions" %ORACLE_HOME%|\network\admin\listener.ora
    expected: ''
    severity: medium
    info: 'To audit this recommendation, execute the following shell commands as appropriate for

      your Linux/Windows environment.

      Linux environment:

      grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora

      Windows environment:

      find /I "admin_restrictions" %ORACLE_HOME%|\network\admin\listener.ora

      Ensure admin_restrictions_<listener_name> is set to ON for all listeners.'
- id: 2.1.4
  title: Ensure 'SECURE_REGISTER_' Is Set to 'TCPS' or 'IPC'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS using Traditional Auditing
  - Level 1 - Windows Server Host OS using Traditional Auditing
  - Level 1 - Linux Host OS using Unified Auditing
  - Level 1 - Windows Server Host OS using Unified Auditing
  description: The SECURE_REGISTER_<listener_name> setting specifies the protocols used to connect to the TNS listener. Each
    setting should have a value of either TCPS or IPC based on the needs for its protocol.
  rationale: Listener configuration changes via unencrypted remote connections can result in unauthorized users sniffing control
    configuration information from the network.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/NETRF/listener.htm#NETRF328
  - 2. https://support.oracle.com/epmos/faces/ui/km/DocumentDisplay.jspx?id=145388
  - '1.1'
  page_start: 23
  audit_raw: 'To audit this recommendation, execute the following shell commands as appropriate for

    your Linux/Windows environment.

    Linux environment:

    grep -i SECURE_REGISTER $ORACLE_HOME/network/admin/listener.ora

    Windows environment:

    find /I "SECURE_REGISTER" %ORACLE_HOME%\network\admin\listener.ora

    Ensure SECURE_REGISTER_<listener_name> is set to TCPS or IPC.'
  remediation: 'To remediate this recommendation:

    Use a text editor such as vi to set the SECURE_REGISTER_<listener_name>=TCPS or

    SECURE_REGISTER_<listener_name>=IPC for each listener found in

    $ORACLE_HOME/network/admin/listener.ora.

    23 | P a g e'
  checks:
  - type: command
    command: grep -i SECURE_REGISTER $ORACLE_HOME/network/admin/listener.ora && find /I "SECURE_REGISTER" %ORACLE_HOME%\network\admin\listener.ora
    expected: ''
    severity: medium
    info: 'To audit this recommendation, execute the following shell commands as appropriate for

      your Linux/Windows environment.

      Linux environment:

      grep -i SECURE_REGISTER $ORACLE_HOME/network/admin/listener.ora

      Windows environment:

      find /I "SECURE_REGISTER" %ORACLE_HOME%\network\admin\listener.ora

      Ensure SECURE_REGISTER_<listener_name> is set to TCPS or IPC.'
- id: 2.2.1
  title: Ensure 'AUDIT_SYS_OPERATIONS' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  description: The AUDIT_SYS_OPERATIONS setting provides for the auditing of all user activities conducted under the SYSOPER
    and SYSDBA accounts. The setting should be set to TRUE to enable this auditing.
  rationale: If the parameter AUDIT_SYS_OPERATIONS is FALSE, all statements except for Startup/Shutdown and Logon by SYSDBA/SYSOPER
    users are not audited.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-58176267-238C-40B5-B1F2BB8BB9518950.htm#REFRN10005
  page_start: 25
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$SYSTEM_PARAMETER

    WHERE UPPER(NAME) = ''AUDIT_SYS_OPERATIONS'';

    Ensure VALUE is set to TRUE.

    25 | P a g e'
  remediation: 'To remediate this setting, execute the following SQL statement and restart the instance.

    ALTER SYSTEM SET AUDIT_SYS_OPERATIONS = TRUE SCOPE=SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$SYSTEM_PARAMETER

      WHERE UPPER(NAME) = ''AUDIT_SYS_OPERATIONS'';

      Ensure VALUE is set to TRUE.

      25 | P a g e'
- id: 2.2.2
  title: Ensure 'AUDIT_TRAIL' Is Set to 'DB', 'XML', 'OS', 'DB,EXTENDED', or 'XML,EXTENDED'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  description: The audit_trail setting determines whether or not Oracle's basic audit features are enabled. It can be set
    to "Operating System"(OS); DB; DB,EXTENDED; XML; or XML,EXTENDED. The value should be set according to the needs of the
    organization.
  rationale: Enabling the basic auditing features for the Oracle instance permits the collection of data to troubleshoot problems,
    as well as provides valuable forensic logs in the case of a system breach this value should be set according to the needs
    of the organization.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-BD86F593-B606-4367-9FB68DAB2E47E7FA.htm#REFRN10006
  - 2. http://www.oracle.com/technetwork/products/audit-vault/learnmore/twpsecurity-auditperformance-166655.pdf
  page_start: 27
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$SYSTEM_PARAMETER

    WHERE UPPER(NAME)=''AUDIT_TRAIL'';

    Ensure VALUE is set to DB or OS or XML or DB,EXTENDED or XML,EXTENDED.'
  remediation: 'To remediate this setting, execute one of the following SQL statements and restart the

    instance.

    ALTER SYSTEM SET AUDIT_TRAIL = DB, EXTENDED SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = OS SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = XML, EXTENDED SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = DB SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = XML SCOPE = SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$SYSTEM_PARAMETER

      WHERE UPPER(NAME)=''AUDIT_TRAIL'';

      Ensure VALUE is set to DB or OS or XML or DB,EXTENDED or XML,EXTENDED.'
- id: 2.2.3
  title: Ensure 'GLOBAL_NAMES' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: The global_names setting requires that the name of a database link matches that of the remote database it will
    connect to. This setting should have a value of TRUE.
  rationale: Not requiring database connections to match the domain that is being called remotely could allow unauthorized
    domain sources to potentially connect via brute-force tactics.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-221D0483-D814-4963-84E17D39A25048ED.htm#REFRN10065
  page_start: 29
  audit_raw: "Non multi-tenant or pluggable database only:\nTo assess this recommendation, execute the following SQL statement.\n\
    SELECT UPPER(VALUE)\nFROM V$SYSTEM_PARAMETER\nWHERE UPPER(NAME)='GLOBAL_NAMES';\nMulti-tenant in the container database:\n\
    This query will also give you the name of the CDB/PDB that has the issue. To assess this\nrecommendation, execute the\
    \ following SQL statement.\nSELECT DISTINCT UPPER(V.VALUE),\nDECODE (V.CON_ID,0,(SELECT NAME FROM V$DATABASE),\n     \
    \            1,(SELECT NAME FROM V$DATABASE),\n                   (SELECT NAME FROM V$PDBS B\n                      WHERE\
    \ V.CON_ID = B.CON_ID))\nFROM V$SYSTEM_PARAMETER V\nWHERE UPPER(NAME) = 'GLOBAL_NAMES';\nEnsure VALUE is set to TRUE."
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET GLOBAL_NAMES = TRUE SCOPE = SPFILE;

    29 | P a g e'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'Non multi-tenant or pluggable database only:

      To assess this recommendation, execute the following SQL statement.

      SELECT UPPER(VALUE)

