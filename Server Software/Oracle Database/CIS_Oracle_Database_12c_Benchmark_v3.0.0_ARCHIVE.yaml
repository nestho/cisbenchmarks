  remediation: "To remediate this setting, execute the following SQL statement.\nALTER SYSTEM SET RESOURCE_LIMIT = TRUE SCOPE\
    \ = SPFILE;\n59 | P a g e\nRemediate this setting by executing the following SQL statement for each PROFILE returned\n\
    by the audit procedure.\nALTER PROFILE <profile_name> LIMIT FAILED_LOGIN_ATTEMPTS 5;\nNotes:\nWarning: One great concern\
    \ with the above is the possibility of this setting being exploited\nto craft a DDoS attack by using the row-locking delay\
    \ between failed login attempts (see\nOracle Bug 7715339 – Logon failures causes “row cache lock” waits – Allow disable\
    \ of logon\ndelay [ID 7715339.8], so the configuration of this setting depends on using the bug\nworkaround). Also, while\
    \ the setting for the FAILED_LOGIN_ATTEMPTS value can also be set\nin sqlnet.ora, this only applies to listed users. The\
    \ similar setting used to block a DDoS,\nthe SEC_MAX_FAILED_LOGIN_ATTEMPTS initialization parameter, can be used to protect\n\
    unauthorized intruders from attacking the server processes for applications, but this\nsetting does not protect against\
    \ unauthorized attempts via valid usernames.\n62 | P a g e\nRemediate this setting by executing the following SQL statement\
    \ for each PROFILE returned\nby the audit procedure.\nALTER PROFILE <profile_name> LIMIT PASSWORD_LOCK_TIME 1;\nRemediate\
    \ this setting by executing the following SQL statement for each PROFILE\nreturned by the audit procedure.\nALTER PROFILE\
    \ <profile_name> LIMIT PASSWORD_LIFE_TIME 90;\nRemediate this setting by executing the following SQL statement for each\
    \ PROFILE returned\nby the audit procedure.\nALTER PROFILE <profile_name> LIMIT PASSWORD_REUSE_MAX 20;\nNotes:\nThe above\
    \ restriction should be applied along with the PASSWORD_REUSE_TIME setting.\nRemediate this setting by executing the following\
    \ SQL statement for each PROFILE returned\nby the audit procedure.\nALTER PROFILE <profile_name> LIMIT PASSWORD_REUSE_TIME\
    \ 365;\nNotes:\nThe above restriction should be applied along with the PASSWORD_REUSE_MAX setting.\nRemediate this setting\
    \ by executing the following SQL statement for each PROFILE returned\nby the audit procedure.\nALTER PROFILE <profile_name>\
    \ LIMIT PASSWORD_GRACE_TIME 5;\nCreate a custom password verification function which fulfills the password requirements\
    \ of\nthe organization.\nTo remediate this setting, execute the following SQL statement for each PROFILE returned\nby\
    \ the audit procedure.\nALTER PROFILE <profile_name> LIMIT SESSIONS_PER_USER 10;\nNotes:\nThe SESSIONS_PER_USER profile\
    \ management capability was created to prevent resource(s)\nexhaustion at a time when resource usage was very expensive.\
    \ As current database design\nmay require much higher limits on this parameter if one \"user\" handles all processing\
    \ for\nspecific types of batch/customer connections, this must be handled via a new user profile.\nTo remediate this setting,\
    \ execute the following SQL statement for each PROFILE returned\nby the audit procedure.\nALTER PROFILE <profile_name>\
    \ LIMIT INACTIVE_ACCOUNT_TIME 10;\nNotes:\nThe SESSIONS_PER_USER profile management capability was created to prevent\
    \ resource(s)\nexhaustion at a time when resource usage was very expensive. As current database design\nmay require much\
    \ higher limits on this parameter if one \"user\" handles all processing for\nspecific types of batch/customer connections,\
    \ this must be handled via a new user profile.\nTo remediate this setting, execute the following SQL statement, keeping\
    \ in mind if this is\ngranted in both container and pluggable database, you must connect to both places to\nrevoke.\n\
    • Manually issue the following SQL statement for each USERNAME returned in the\nAudit Procedure:\n• Execute the following\
    \ SQL script to assign a randomly generated password to each\naccount using a default password:\nbegin\n     for r_user\
    \ in (select username\n                    from dba_users_with_defpwd\n                    where username not like '%XS$NULL%')\n\
    \     loop\n         DBMS_OUTPUT.PUT_LINE('Password for user '||r_user.username||'\nwill be changed.');\n         execute\
    \ immediate 'alter user \"'||r_user.username||'\"\nidentified by \"'||\n           DBMS_RANDOM.string('a',16)||'\"account\
    \ lock password expire';\n       end loop;\nend;\n83 | P a g e\nTo remediate this setting, execute the following SQL statement,\
    \ keeping in mind if this is\ngranted in both container and pluggable database, you must connect to both places to run\n\
    the drop script.\n$ORACLE_HOME/demo/schema/drop_sch.sql\nThen, execute the following SQL statement.\nDROP USER SCOTT CASCADE;\n\
    Note: The recyclebin is not set to OFF within the default drop script, which means that the\ndata will still be present\
    \ in your environment until the recyclebin is emptied.\n85 | P a g e\nTo remediate this setting, execute the following\
    \ SQL statement, keeping in mind if this is\ngranted in both container and pluggable database, you must connect to both\
    \ places to\nrevoke.\nALTER USER <username> IDENTIFIED BY <password>;\nNotes:\nThe PASSWORD keyword (column) used in the\
    \ SQL for prior Oracle versions has been\ndeprecated from version 11.2 onward in favor of the new AUTHENTICATION_TYPE\
    \ keyword\n(column) for the DBA_USERS table. However, the PASSWORD column has still been retained for\nbackward compatibility.\n\
    To remediate this recommendation, execute the following SQL statement for each user\nreturned by the audit query using\
    \ a functional-appropriate profile, keeping in mind if this is\ngranted in both container and pluggable database, you\
    \ must connect to both places to\nrevoke.\nALTER USER <username> PROFILE <appropriate_profile>;\nTo remediate this setting,\
    \ execute the following SQL statement, keeping in mind if this is\ngranted in both container and pluggable database, you\
    \ must connect to both places to\nrevoke.\n89 | P a g e\nDROP TABLE SYS.USER$MIG;\nTo remediate this setting, execute\
    \ the following SQL statement, keeping in mind if this is\ngranted in both container and pluggable database, you must\
    \ connect to both places to\nrevoke.\nDROP PUBLIC DATABASE LINK <DB_LINK>;"
