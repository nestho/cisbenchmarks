- id: 2.2.7
  title: Ensure 'REMOTE_LOGIN_PASSWORDFILE' Is Set to 'NONE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: The remote_login_passwordfile setting specifies whether or not Oracle checks for a password file during login
    and how many databases can use the password file. The setting should have a value of NONE or in the event you are running
    DR/Data Guard, EXCLUSIVE is an allowable value.
  rationale: The use of this sort of password login file could permit unsecured, privileged connections to the database.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-6619299E-95E8-4821-B1233B5899F046C7.htm#REFRN10184
  page_start: 37
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$SYSTEM_PARAMETER

    WHERE UPPER(NAME)=''REMOTE_LOGIN_PASSWORDFILE'';

    Ensure VALUE is set to NONE or in the event you are running DR/Data Guard, EXCLUSIVE is an

    allowable VALUE.'
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET REMOTE_LOGIN_PASSWORDFILE = ''NONE'' SCOPE = SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$SYSTEM_PARAMETER

      WHERE UPPER(NAME)=''REMOTE_LOGIN_PASSWORDFILE'';

      Ensure VALUE is set to NONE or in the event you are running DR/Data Guard, EXCLUSIVE is an

      allowable VALUE.'
- id: 2.2.8
  title: Ensure 'REMOTE_OS_AUTHENT' Is Set to 'FALSE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: 'The remote_os_authent setting determines whether or not OS ''roles'' with the attendant privileges are allowed
    for remote client connections. This setting should have a value of FALSE. Note: This parameter has been deprecated in
    12.1 and higher versions.'
  rationale: Permitting OS roles for database connections can allow the spoofing of connections and permit granting the privileges
    of an OS role to unauthorized users to make connections, this value should be restricted according to the needs of the
    organization.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-AB66C849-FE5A-4E06-A6E1AEE775D55703.htm#REFRN10185
  page_start: 39
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$SYSTEM_PARAMETER

    WHERE UPPER(NAME)=''REMOTE_OS_AUTHENT'';

    Ensure VALUE is set to FALSE.'
