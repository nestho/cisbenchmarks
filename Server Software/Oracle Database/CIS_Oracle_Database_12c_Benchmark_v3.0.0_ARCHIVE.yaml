      recommendation, execute the following SQL statement.

      SELECT DISTINCT UPPER(V.VAL'
- id: 2.2.4
  title: Ensure 'O7_DICTIONARY_ACCESSIBILITY' Is Set to 'FALSE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: 'The O7_dictionary_accessibility setting is a database initialization parameter that allows/disallows access
    to objects with the ANY privileges (SELECT ANY TABLE, DELETE ANY TABLE, EXECUTE ANY PROCEDURE, etc.). This functionality
    was created for the ease of migration from Oracle 7 databases to later versions. The setting should have a value of FALSE.
    Note: The O7_dictionary_accessibility parameter has been deprecated in 12.2 and higher versions.'
  rationale: Leaving the SYS schema so open to connection could permit unauthorized access to critical data structures.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-1D1A88F1-B603-48FF-BD30E6099DB1A1ED.htm#REFRN10133
  page_start: 31
  audit_raw: "Non multi-tenant or pluggable database only:\nTo assess this recommendation, execute the following SQL statement.\n\
    SELECT UPPER(VALUE)\nFROM V$SYSTEM_PARAMETER\nWHERE UPPER(NAME)='O7_DICTIONARY_ACCESSIBILITY';\nMulti-tenant in the container\
    \ database:\nThis query will also give you the name of the CDB/PDB that has the issue. To assess this\nrecommendation,\
    \ execute the following SQL statement.\nSELECT DISTINCT UPPER(V.VALUE),\nDECODE (V.CON_ID,0,(SELECT NAME FROM V$DATABASE),\n\
    \                 1,(SELECT NAME FROM V$DATABASE),\n                   (SELECT NAME FROM V$PDBS B\n                  \
    \    WHERE V.CON_ID = B.CON_ID))\nFROM V$SYSTEM_PARAMETER V\nWHERE UPPER(NAME) = 'O7_DICTIONARY_ACCESSIBILITY';\nEnsure\
    \ VALUE is set to FALSE.\n31 | P a g e"
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET O7_DICTIONARY_ACCESSIBILITY=FALSE SCOPE = SPFILE;'
