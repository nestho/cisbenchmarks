- id: 5.1.1.1
  title: Ensure 'EXECUTE' is revoked from 'PUBLIC' on "Network" Packages
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: As described below, Oracle Database PL/SQL "Network" packages - DBMS_LDAP, UTL_INADDR, UTL_TCP, UTL_MAIL, UTL_SMTP,
    UTL_DBWS, UTL_ORAMTS, UTL_HTTP and type HTTPURITYPE – provide PL/SQL APIs to interact or access remote servers. The PUBLIC
    should not be able to execute these packages. • The Oracle database DBMS_LDAP package contains functions and procedures
    that enable programmers to access data from LDAP servers. • The Oracle database UTL_INADDR package provides an API to
    retrieve host names and IP addresses of local and remote hosts. • The Oracle database UTL_TCP package can be used to read/write
    file to TCP sockets on the server where the Oracle instance is installed. • The Oracle database UTL_MAIL package can be
    used to send email from the server where the Oracle instance is installed. • The Oracle database UTL_SMTP package can
    be used to send email from the server where the Oracle instance is installed. The user PUBLIC should not be able to execute
    UTL_SMTP. • The Oracle database UTL_DBWS package can be used to read/write file to web-based applications on the server
    where the Oracle instance is installed. This package is not automatically installed for security reasons. • The Oracle
    database UTL_ORAMTS package can be used to perform HTTP requests. This could be used to send information to the outside.
