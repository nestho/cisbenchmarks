- id: 2.2.18
  title: Ensure 'RESOURCE_LIMIT' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: RESOURCE_LIMIT determines whether resource limits are enforced in database profiles. This setting should have
    a value of TRUE. The FAILED_LOGIN_ATTEMPTS setting determines how many failed login attempts are permitted before the
    system locks the user's account. While different profiles can have different and more restrictive settings, such as USERS
    and APPS, the minimum(s) recommended here should be set on the DEFAULT profile. The PASSWORD_LOCK_TIME setting determines
    how many days must pass for the user's account to be unlocked after the set number of failed login attempts has occurred.
    The suggested value for this is one day or greater. The PASSWORD_LIFE_TIME setting determines how long a password may
    be used before the user is required to be change it. The suggested value for this is 90 days or less. The PASSWORD_REUSE_MAX
    setting determines how many different passwords must be used before the user is allowed to reuse a prior password. The
    suggested value for this is 20 passwords or greater. The PASSWORD_REUSE_TIME setting determines the amount of time in
    days that must pass before the same password may be reused. The suggested value for this is 365 days or greater. The PASSWORD_GRACE_TIME
    setting determines how many days can pass after the user's password expires before the user's login capability is automatically
    locked out. The suggested value for this is five days or less. The PASSWORD_VERIFY_FUNCTION determines password settings
    requirements when a user password is changed at the SQL command prompt. It should be set for all profiles. Note that this
    setting does not apply for users managed by the Oracle password file. The SESSIONS_PER_USER setting determines the maximum
    number of user sessions that are allowed to be open concurrently. The suggested value for this is 10 or less. The 'INACTIVE_ACCOUNT_TIME'
    setting determines the maximum number of days of inactivity (no logins at all) after which the account will be locked.
    The suggested value for this is 120 or less. Default passwords should not be used by Oracle database users. Oracle sample
    schemas can be used to create sample users (BI,HR,IX,OE,PM,SCOTT,SH), with well-known default passwords, particular views,
    and procedures/functions, in addition to tables and fictitious data. The sample schemas should be removed. The authentication_type='EXTERNAL'
    setting determines whether or not a user can be authenticated by a remote OS to allow access to the database with full
    authorization. This setting should not be used. Upon creation database users are assigned to the DEFAULT profile unless
    otherwise specified. No users should be assigned to that profile. The table sys.user$mig is created during migration and
    contains the Oracle password hashes before the migration starts. This table should be dropped. Public Database links are
    used to allow connections between databases.
  rationale: If RESOURCE_LIMIT is set to FALSE, none of the system resource limits that are set in any database profiles are
    enforced. If RESOURCE_LIMIT is set to TRUE, the limits set in database profiles are enforced. Repeated failed login attempts
    can indicate the initiation of a brute-force login attack, this value should be set according to the needs of the organization.
    (See the Notes for a warning on a known bug that can make this security measure backfire.) Locking the user account after
    repeated failed login attempts can block further brute-force login attacks, but can create administrative headaches as
    this account unlocking process always requires DBA intervention. Allowing passwords to remain unchanged for long periods
    makes the success of bruteforce login attacks more likely. Allowing reuse of a password within a short period of time
    after the password's initial use can make the success of both social-engineering and brute-force password-based attacks
    more likely. Reusing the same password after only a short period of time has passed makes the success of brute-force login
    attacks more likely. Locking the user account after the expiration of the password change requirement's grace period can
    help prevent password-based attacks against any forgotten or disused accounts, while still allowing the account and its
    information to be accessible by DBA intervention. Requiring users to apply the 12c security features in password creation,
    such as forcing mixed-case complexity, blocking of simple combinations, and enforcing change/history settings can potentially
    thwart logins by an unauthorized user. Limiting the number of the SESSIONS_PER_USER can help prevent memory resource exhaustion
    by poorly formed requests or intentional denial-of-service attacks. Setting 'INACTIVE_ACCOUNT_TIME' can help with deactivation
    of "inactive" or "unused" accounts. Default passwords should be considered "well known" to attackers. Consequently, if
    default passwords remain in place, any attacker with access to the database can authenticate as the user with that default
    password. The sample schemas are typically not required for production operations of the database. The default users,
    views, and/or procedures/functions created by sample schemas could be used to launch exploits against production environments.
    Allowing remote OS authentication of a user to the database can potentially allow supposed "privileged users" to connect
    as "authenticated," even when the remote system is compromised. Users should be created with function-appropriate profiles.
    The DEFAULT profile, being defined by Oracle, is subject to change at any time (e.g. by patch or version update). The
    DEFAULT profile has unlimited settings that are often required by the SYS user when patching; such unlimited settings
    should be tightly reserved and not applied to unnecessary users. The table sys.user$mig is not deleted after the migration.
    An attacker could access the table containing the Oracle password hashes. Using public database links in the database
    can allow anyone with a connection to the database to query, update, insert, delete data on a remote database depending
    on the userid that is part of the link.
  impact: The Oracle sample usernames may be in use on a production basis. It is important that you first verify that BI,
    HR, IX, OE, PM, SCOTT, and/or SH are not valid production usernames before executing the dropping SQL scripts. This may
    be particularly true with the HR and BI users. If any of these users are present, it is important to be cautious and confirm
    the schemas present are, in fact, Oracle sample schemas and not production schemas being relied upon by business operations.
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-BB0AB177-3867-4D0D-8700A1AC8BDFEFC3.htm#REFRN10188
  - 1. http://docs.oracle.com/database/121/TDPSG/GUID-3EC7A894-D620-4497-AFB164EB8C33D854.htm#TDPSG20021
  - 2. https://support.oracle.com/epmos/faces/DocumentDisplay?id=2173962.1
  - 1. http://docs.oracle.com/database/121/COMSC/toc.htm
  page_start: 59
  audit_raw: "Non multi-tenant or pluggable database only:\nTo assess this recommendation, execute the following SQL statement.\n\
    SELECT UPPER(VALUE)\nFROM V$SYSTEM_PARAMETER\nWHERE UPPER(NAME)='RESOURCE_LIMIT';\nMulti-tenant in the container database:\n\
    This query will also give you the name of the CDB/PDB that has the issue. To assess this\nrecommendation, execute the\
    \ following SQL statement.\nSELECT DISTINCT UPPER(V.VALUE),\nDECODE (V.CON_ID,0,(SELECT NAME FROM V$DATABASE),\n     \
    \            1,(SELECT NAME FROM V$DATABASE),\n                   (SELECT NAME FROM V$PDBS B\n                      WHERE\
    \ V.CON_ID = B.CON_ID))\nFROM V$SYSTEM_PARAMETER V\nWHERE UPPER(NAME) = 'RESOURCE_LIMIT';\nEnsure VALUE is set to TRUE.\n\
    Non multi-tenant or pluggable database only:\nTo assess this recommendation, execute the following SQL statement.\nSELECT\
    \ P.PROFILE, P.RESOURCE_NAME, P.LIMIT\nFROM DBA_PROFILES P\nWHERE TO_NUMBER(DECODE(P.LIMIT,\n                      'DEFAULT',(SELECT\
    \ DISTINCT\nDECODE(LIMIT,'UNLIMITED',9999,LIMIT)\n                                 FROM DBA_PROFILES\n61 | P a g e\n \
