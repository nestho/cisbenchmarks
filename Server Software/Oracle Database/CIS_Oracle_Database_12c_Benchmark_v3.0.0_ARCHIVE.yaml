    that can manipulate and read/write on BLOB's, CLOB's, NCLOB's, BFILE's, and temporary LOB's. The user PUBLIC should not
    be able to execute DBMS_LOB. • The Oracle database UTL_FILE package can be used to read/write files located on the server
