  profile:
  - Level 1 - RDBMS using Unified Auditing
  description: The SELECT ANY DICTIONARY system privilege allows the user to view the definition of all schema objects in
    the database. It grants SELECT privileges on the data dictionary objects to the grantees, including SELECTon DBA_ views,
    V$ views, X$ views and underlying SYS tables such as TAB$ and OBJ$. This privilege also allows grantees to create stored
    objects such as procedures, packages and views on the underlying data dictionary objects. Please note that this privilege
    does not grant SELECT on tables with password hashes such as USER$, DEFAULT_PWD$, LINK$, and USER_HISTORY$. Enabling this
