  remediation: "SQL> drop table sys.user$mig;\n4.6 Limiting basic user privileges to restrict the ANY keyword (Scored)\nSQL>\
    \ REVOKE ALL ON '<ANY Privilege>' FROM <grantee>;\nSQL> REVOKE <privilege> FROM <grantee>;\n4.8 Limit direct privileges\
    \ for proxy user (Scored)\nSQL> revoke privilege from <proxy_user>;\n4.9 Revoke execute any procedure from user OUTLN\
    \ (Scored)\nSQL> revoke EXECUTE ANY PROCEDURE from OUTLN;\n137 | P a g e\n4.10 Revoke execute any procedure from user\
    \ DBSNMP (Scored)\nSQL> revoke EXECUTE ANY PROCEDURE from DBSNMP;\n5 Audit/Logging Policies and Procedures\nThe ability\
    \ to audit system logs, to determine the result of user actions that have\npotentially resulted in the loss or violations\
    \ of availability, confidentiality, and/or integrity\nis among the most important of all database security features. \
    \ Decisions must be made\nregarding the breadth/depth of the logging activity, as greater detail produces larger log\n\
    files.  Measures must also be taken to protect the log files themselves, for these may be\ntargeted for alteration or\
    \ destruction to hide unauthorized activity.  There are numerous\ncommand sequences for AUDIT, some of which are applicable\
    \ to most database objects,\nsuch as CREATE, ALTER, DROP, while others are limited to a few database objects, such as\n\
    GRANT,TRUNCATE,SET,SYSTEM AUDIT, and SYSTEM GRANT.  The commands that apply to\nlarger numbers of objects will be addressed\
    \ object by object after the primary connection\ncommands are dealt with.\n5.1 Audit all CREATE SESSION (logon/logoff)\
    \ activities (Scored)\nSQL> AUDIT CREATE SESSION;\n5.2 Audit all CREATE USER object activities/requests (Scored)\nSQL>\
    \ AUDIT CREATE USER;\n5.3 Audit all ALTER USER object activities/requests (Scored)\nSQL> AUDIT ALTER USER;\n5.4 Audit\
    \ all DROP USER object activities/requests (Scored)\nSQL> AUDIT DROP USER;\n5.5 Audit all user ROLE activities/requests\
    \ (Scored)\n SQL> AUDIT ROLE;\n5.6 Audit all user GRANT ROLE activities/requests (Scored)\nSQL> AUDIT SYSTEM GRANT;\n\
    5.7 Audit all user CREATE PROFILE activities/requests (Scored)\nSQL> AUDIT CREATE PROFILE;\n5.8 Audit all user ALTER PROFILE\
    \ activities/requests (Scored)\nSQL> AUDIT ALTER PROFILE;\n5.9 Audit all user DROP PROFILE activities/requests (Scored)\n\
    SQL> AUDIT DROP PROFILE;\n5.10 Audit all DATABASE LINK activities/requests (Scored)\n144 | P a g e\nSQL> AUDIT DATABASE\
    \ LINK;\nSQL> audit public database link;\n5.12 Audit all  PUBLIC SYNONYM  activities/requests (Scored)\nSQL> AUDIT PUBLIC\
    \ SYNONYM;\n5.13 Audit all user SYNONYM activities/requests (Scored)\nSQL> AUDIT SYNONYM;\nSQL> AUDIT GRANT DIRECTORY;\n\
    SQL> AUDIT SELECT ANY DICTIONARY;\nSQL> AUDIT GRANT ANY OBJECT PRIVILEGE;\nSQL> AUDIT GRANT ANY PRIVILEGE;\nSQL> AUDIT\
    \ CREATE PROCEDURE;\n5.19 Audit all user CREATE ANY PROCEDURE activities/requests (Scored)\nSQL> AUDIT CREATE ANY PROCEDURE;\n\
    151 | P a g e\n5.20 Audit all user ALTER ANY PROCEDURE activities/requests (Scored)\nSQL> AUDIT ALTER ANY PROCEDURE;\n\
    5.21 Audit all user DROP ANY PROCEDURE activities/requests (Scored)\nSQL> AUDIT DROP ANY PROCEDURE;\n5.22 Audit all user\
    \ CREATE ANY LIBRARY activities/requests (Scored)\nSQL> AUDIT CREATE ANY LIBRARY;\n5.23 Audit all user DROP ANY LIBRARY\
    \ activities/requests (Scored)\nSQL> AUDIT DROP ANY LIBRARY;\n5.24 Audit all user CREATE ANY TRIGGER activities/requests\
    \ (Scored)\nSQL> AUDIT CREATE ANY TRIGGER;\n5.25 Audit all user ALTER ANY TRIGGER activities/requests (Scored)\nSQL> AUDIT\
