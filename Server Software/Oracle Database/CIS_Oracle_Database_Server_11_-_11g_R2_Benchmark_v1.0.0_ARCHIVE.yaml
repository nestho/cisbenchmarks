- id: 2.1.5
  title: Setting for parameter 'secure_register_listener_name' parameter
  scoring: scored
  profile:
  - Level 1 - 11.x on any platform
  - Level 1 - 11.2 on any platform
  description: The SECURE_REGISTER_<listener_name> setting specifies the protocols which are used to connect to the TNS listener.
    The AUDIT_SYS_OPERATIONS setting provides for the auditing of all user activities conducted under the SYSOPER and SYSDBA
    accounts. The audit_trail setting determines whether or not Oracle's basic audit features are enabled.  These can be set
    to "Operating System"(OS), "DB,",  "DB,EXTENDED", "XML" or "XML,EXTENDED". The global_names setting requires that the
    name of a database link matches that of the remote database it will connect to. 54 | P a g e The local_listener setting
    specifies a network name that resolves to an address of the Oracle TNS listener. 55 | P a g e The O7_dictionary_accessibility
    setting  is a database initializations parameter that allows/disallows with the EXECUTE ANY PROCEDURE and SELECT ANY DICTIONARY
    access to objects in the SYS schema; this functionality was created for the ease of migration from Oracle 7 databases
    to later versions. 56 | P a g e The os_roles setting permits externally created groups to be applied to database management.
    57 | P a g e The remote_listener setting determines whether or not a valid listener can be established on a system separate
    from the database instance. The remote_login_passwordfile setting specifies whether or not Oracle checks for a password
    file during login and how many databases can use the password file. The remote_os_authent setting determines whether or
    not OS 'roles' with the attendant privileges are allowed for remote client connections. The remote_os_roles setting permits
    remote users' OS roles to be applied to database management. The utl_file_dir setting allows packages like utl_file to
    access (read/write/modify/delete) files specified in utl_file_dir.  (This is deprecated but usable in 11g.) The SEC_CASE_SENSITIVE_LOGON
    information determines whether or not case-sensitivity is required for passwords during login. Due to the security bug
    CVE-2012-3137 it is recommended to set this parameter to TRUE if the October 2012 CPU/PSU or later was applied. If the
    patch was not applied it is recommended to set this parameter to FALSE to avoid that the vulnerability could be abused.
    The SEC_MAX_FAILED_LOGIN_ATTEMPTS parameter determines how many failed login attempts are allowed before Oracle closes
    the login connection. The SEC_PROTOCOL_ERROR_FURTHER_ACTION setting determines the Oracle's server's response to bad/malformed
    packets received from the client. The SEC_PROTOCOL_ERROR_TRACE_ACTION setting determines the Oracle's server's logging
    response level to bad/malformed packets received from the client, by generating ALERT, LOG, or TRACE levels of detail
    in the log files. 69 | P a g e The information about patch/update release number provides information about the exact
    patch/update release that is currently running on the database. The sql92_security parameter setting FALSE allows to grant
    only  UPDATE or DELETE privileges without the need to grant SELECT privileges. The _trace_files_public setting determines
    whether or not the system's trace file is world readable. The failed_login_attempts setting determines how many failed
    login attempts are permitted before the system locks the user's account.  While different profiles can have different
    and more restrictive settings, such as USERS and APPS, the minimum(s) recommended here should be set on the DEFAULT profile.
    The PASSWORD_LOCK_TIME setting determines how many days must pass for the user's account to be unlocked after the set
    number of failed login attempts has occurred. The password_life_time setting determines how long a password may be used
    before the user is required to be change it. 76 | P a g e The password_reuse_max setting determines how many different
    passwords must be used before the user is allowed to reuse a prior password. The password_reuse_time setting determines
    the amount of time in days that must pass before the same password may be reused. The password_grace_time setting determines
    how many days can pass after the user's password expires before the user's login capability is automatically locked out.
    The password='EXTERNAL' setting determines whether or not a user can be authenticated by a remote OS to allow access to
    the database with full authorization. The password_verify_function determines password settings requirements when a user
    password is changed at the SQL command prompt.  This setting does not apply for users managed by the Oracle password file.
    79 | P a g e The SESSIONS_PER_USER (Number of sessions allowed) determines the maximum number of user sessions that are
    allowed to be open concurrently.
  rationale: As listener configuration changes via unencrypted remote connections can result in unauthorized users sniffing
    the control configuration information from the network,  these control values should be set according to the needs  of
    the organization. If the parameter AUDIT_SYS_OPERATIONS is FALSE all statements except of Startup/Shutdown and Logon by
    SYSDBA/SYSOPER users are not audited. As enabling the basic auditing features for the Oracle instance permits the collection
    of data to troubleshoot problems, as well as providing value forensic logs in the case of a system breach, this value
    should be set according to the needs of the organization. As not requiring database connections to match the domain that
    is being called remotely could allow unauthorized domain sources to potentially connect via brute-force tactics, this
    value should be set according to the needs of the organization. The TNS poisoning attack allows to redirect TNS network
    traffic to another system by registering a listener to the TNS listener. This attack can be performed by unauthorized
    users with network access. By specifying the IPC protocol it is no longer possible to register listeners via TCP/IP. As
    leaving the SYS schema so open to connection could permit unauthorized access to critical data structures, this value
    should be set according to the needs of the organization. As allowing the OS use external groups for database management
    could cause privilege overlaps and generally weaken security, this value should be set according to the needs of the organization.
    As permitting a remote listener for connections to the database instance can allow for the potential spoofing of connections
    and that could compromise data confidentiality and integrity, this value should be disabled/restricted according to the
    needs of the organization. As the use of this sort of password login file could permit unsecured, privileged connections
    to the database, this value should be set according to the needs of the organization. As permitting OS roles for database
    connections to can allow the spoofing of connections and permit granting the privileges of an OS role to unauthorized
    users to make connections, this value should be restricted according to the needs of the organization. As allowing remote
    clients OS roles to have permissions for database management could cause privilege overlaps and generally weaken security,
    this value should be set according to the needs of the organization. As using the utl_file_dir  to create directories
    allows the manipulation of files in these  directories. 63 | P a g e Oracle 11g databases without CPU October 2012 patch
    or later are vulnerable to CVE2012-3137 if case-sensisitve SHA-1 password hashes are used. To avoid this kind of attack
    the old DES-hashes have to be used. As allowing an unlimited number of login attempts for a user connection can facilitate
    both brute-force login attacks and the occurrence of Denial-of-Service , this value (10) should be set according to the
    needs  of the organization. 66 | P a g e As bad packets received from the client can potentially indicate packet-based
    attacks on the system, such as "TCP SYN Flood" or "Smurf" attacks, which could result in a Denial-ofService condition,  this
    value should be set according to the needs  of the organization. As bad packets received from the client can potentially
    indicate packet-based attacks on the system, such as "TCP SYN Flood" or "Smurf" attacks, which could result in a Denial-ofService
    condition, this diagnostic/logging value for ALERT, LOG, or TRACE conditions should be set according to the needs of the
    organization. As allowing the database to return information about the patch/update release number could facilitate unauthorized
    users' attempts  to gain access based upon known patch weaknesses , this value should be set according to the needs  of
    the organization. The default value FALSE of the parameter sql92_security is secure out-of-the-box. Several security guides
    recommend the unsecure setting TRUE. This unsecure setting TRUE allows users which need only UPDATE/DELETE privileges
    to select data directly instead of guessing it. As permitting the unix read permission to other anyone can read the instance's
    trace files file which could contain sensitive information about instance operations, this value should be restricted
    according to the needs of the organization. As repeated failed login attempts can indicate the initiation of a brute-force
    login attack, this value should be set according to the needs of the organization (see warning below on a known bug that
    can make this security measure backfire). As locking the user account after repeated failed login attempts can block further
    bruteforce login attacks, but can create administrative headaches as this account unlocking 75 | P a g e process always
    requires DBA intervention, this value should be set according to the needs  of the organization. As allowing passwords
    to remain unchanged for long periods makes the success of bruteforce login attacks more likely, this value should be set
    according to the needs of the organization. As allowing reuse of a password within a short period of time after the password's
    initial use can make the success of both social-engineering and brute-force password-based attacks more likely, this value
    should be set according to the needs of the organization. As reusing the same password after only a short period of time
    has passed makes the success of brute-force login attacks more likely, this value should be set according to the needs
    of the organization. As locking the user account after the expiration of the password change requirement's grace period
    can help prevent password-based attack against a forgotten or disused accounts, while still allowing the account and its
    information to be accessible by DBA intervention,  this value should be set according to the needs  of the organization.
    As allowing remote OS authentication of a user to the database can potentially allow supposed "privileged users" to connect
    as "authenticated," even when the remote system is compromised, these logins should be disabled/restricted according to
    the needs of the organization. 78 | P a g e As requiring users to apply the 11gr2 security features in password creation,
    such as forcing mixed-case complexity, the blocking of simple combinations, and change/history settings can potentially
    thwart logins by unauthorized users, this function should be applied/enabled according to the needs of the organization.
    As limiting the number of the SESSIONS_PER_USER can help prevent memory resource exhaustion by poorly formed requests
    or intentional Denial-of-Service attacks, this value should be set according to the needs  of the organization. To enable
    this setting it is necessary to enable the RESOURCE_LIMIT ( ALTER SYSTEM SET RESOURCE_LIMIT = TRUE; ).
  impact: If SEC_CASE_SENSITIVE_LOGON is FALSE, all user with SHA-1 hashes only ("select name,password,spare4 from sys.user$
