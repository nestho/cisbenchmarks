- id: 4.1.1
  title: Limit public access to the DBMS_ADVISOR package
  scoring: scored
  profile:
  - Level 1 - 11.x on any platform
  description: 80 | P a g e The Oracle database DBMS_ADVISOR package can be used to write files located on the server where
    the Oracle instance is installed.
  rationale: As use of the DBMS_ADVISOR package could allow an unauthorized user to corrupt operating system files on the
    instance's host, use of this package should be restricted according to the needs of the organization.
