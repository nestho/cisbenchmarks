- id: 1.1.1
  title: Change the default password for 'APEX_040000'
  scoring: scored
  profile:
  - Level 1 - 11.x on any platform
  description: The APEX_040000 account owns the greatest part of the objects created by the database during the installation
    of Oracle Database Application Express (ODAE).
  rationale: Some pre-installed versions of APEX 4.0 come with a default password and can provide a point for database access/control
    by unauthorized users, opening up the tables, views, etc..
  impact: ''
  references: []
  page_start: 16
  audit_raw: "select 'defaultpwd' as defaultpassword\nfrom sys.user$\nwhere name='APEX_040000'\n      and\nsubstr(spare4,3,40)=rawtohex(utl_raw.cast_to_varchar2(sys.dbms_crypto.hash(utl_raw.cas\n\
    t_to_raw('oracle')||hextoraw(substr(spare4,43,20)), 3)))\nunion\nselect 'defaultpwd' from sys.user$ where name='APEX_040000'\
    \ and\npassword='EE7785338B8FFE3D';"
  remediation: 'Execute the following command to change the password

    SQL> password apex_040000

    Enter the new password twice:

    Changing password for apex_040000

    New password:

    Retype new password:

    Password changed'
  checks:
  - type: sql
    command: select 'defaultpwd' as defaultpassword
    severity: medium
    info: "select 'defaultpwd' as defaultpassword\nfrom sys.user$\nwhere name='APEX_040000'\n      and\nsubstr(spare4,3,40)=rawtohex(utl_raw.cast_to_varchar2(sys.dbms_crypto.hash(utl_raw.cas\n\
      t_to_raw('oracle')||hextoraw(substr(spare4,43,20)), 3)))\nunion\nselect 'defaultpwd' from sys.user$ where name='APEX_040000'\
      \ and\npassword='EE7785338B8FFE3D';"
