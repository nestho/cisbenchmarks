    version, along with the patch level, should be the most recent that is compatible with the organizations' operational
    needs. There are two ways to detect the patch level. Opatch is (only) checking if the files at the operating system level
    are patched properly. The view DBA_REGISTRY_HISTORY shows if the database related part was applied. If the result from
    DBA_REGISTRY_HISTORY is empty no (security) patch was applied To be on the safe side, the view DBA_REGISTRY history should
    be queried.
