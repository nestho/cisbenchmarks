- id: 4.5.1
  title: Limiting authorizations for the SYS.AUD$ table
  scoring: scored
  profile:
  - Level 1 - 11.x on any platform
  description: The  Oracle database SYS.AUD$ table contains all the audit records for the database of the non-Data Manipulation
    Language  (DML) events, such as ALTER, DROP, CREATE, and so forth.  (DML changes need trigger-based audit events to record
    data alterations.)
  rationale: As permitting non-privileged users the authorization to manipulate the SYS_AUD$ table can allow distortion of
    the audit records, hiding unauthorized activities, this capability should be restricted according to the needs of the
    organization.
