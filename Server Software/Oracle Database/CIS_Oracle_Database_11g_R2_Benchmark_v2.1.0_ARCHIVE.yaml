- id: 2.2.12
  title: Ensure 'SEC_CASE_SENSITIVE_LOGON' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The SEC_CASE_SENSITIVE_LOGON information determines whether or not case-sensitivity is required for passwords
    during login. Due to the security bug CVE-2012-3137 it is recommended to set this parameter to TRUE if the October 2012
    CPU/PSU or later was applied. If the patch was not applied it is recommended to set this parameter to FALSE to avoid that
    the vulnerability could be abused.
  rationale: Oracle 11g databases without CPU October 2012 patch or later are vulnerable to CVE2012-3137 if case-sensitive
    SHA-1 password hashes are used. To avoid this kind of attack the old DES-hashes have to be used.
  impact: If SEC_CASE_SENSITIVE_LOGON is FALSE, all user with SHA-1 hashes only ("select name,password,spare4 from sys.user$
    where password is null and spare4 is not 33 | P a g e null") are no longer able to connect to the database. In this case
    the password for all users without DES hash have to set again.
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams222.htm#R
  - 2. https://support.oracle.com/epmos/faces/DocumentDisplay?id=1492721.1
  page_start: 33
  audit_raw: 'To assess this recommendation execute the following SQL statement.

