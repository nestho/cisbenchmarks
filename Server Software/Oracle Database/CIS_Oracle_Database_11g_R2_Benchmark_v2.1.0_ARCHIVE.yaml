- id: 2.2.1
  title: Ensure 'AUDIT_SYS_OPERATIONS' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The AUDIT_SYS_OPERATIONS setting provides for the auditing of all user activities conducted under the SYSOPER
    and SYSDBA accounts. 23 | P a g e
  rationale: If the parameter AUDIT_SYS_OPERATIONS is FALSE all statements except of Startup/Shutdown and Logon by SYSDBA/SYSOPER
    users are not audited.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams015.htm#R
  page_start: 23
  audit_raw: 'To assess this recommendation execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$PARAMETER

    WHERE UPPER(NAME) = ''AUDIT_SYS_OPERATIONS'';

    Ensure VALUE is set to TRUE.'
  remediation: 'To remediate this setting execute the following SQL statement.

    ALTER SYSTEM SET AUDIT_SYS_OPERATIONS = TRUE SCOPE=SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$PARAMETER

      WHERE UPPER(NAME) = ''AUDIT_SYS_OPERATIONS'';

      Ensure VALUE is set to TRUE.'
- id: 2.2.2
  title: Ensure 'AUDIT_TRAIL' Is Set to 'OS', 'DB,EXTENDED', or 'XML,EXTENDED'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The audit_trail setting determines whether or not Oracle's basic audit features are enabled.  These can be
    set to "Operating System"(OS), "DB,",  "DB,EXTENDED", "XML" or "XML,EXTENDED".
  rationale: As enabling the basic auditing features for the Oracle instance permits the collection of data to troubleshoot
    problems, as well as providing value forensic logs in the case of a system breach, this value should be set according
    to the needs of the organization. 24 | P a g e
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams017.htm#R
  - 2. http://www.oracle.com/technetwork/database/audit-vault/learnmore/twpsecurity-auditperformance-166655.pdf
  page_start: 24
  audit_raw: 'To assess this recommendation execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$PARAMETER

    WHERE UPPER(NAME)=''AUDIT_TRAIL'';

    Ensure VALUE is set to OS or DB,EXTENDED or XML,EXTENDED.'
  remediation: 'To remediate this setting execute one of the following SQL statements.

    ALTER SYSTEM SET AUDIT_TRAIL = DB, EXTENDED SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = OS SCOPE = SPFILE;

    ALTER SYSTEM SET AUDIT_TRAIL = XML, EXTENDED SCOPE = SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$PARAMETER

      WHERE UPPER(NAME)=''AUDIT_TRAIL'';

      Ensure VALUE is set to OS or DB,EXTENDED or XML,EXTENDED.'
- id: 2.2.3
  title: Ensure 'GLOBAL_NAMES' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The global_names setting requires that the name of a database link matches that of the remote database it will
    connect to.
  rationale: As not requiring database connections to match the domain that is being called remotely could allow unauthorized
    domain sources to potentially connect via brute-force tactics, this value should be set according to the needs of the
    organization.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams096.htm#R
  page_start: 25
  audit_raw: 'To assess this recommendation execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$PARAMETER

    WHERE UPPER(NAME)=''GLOBAL_NAMES'';

    25 | P a g e

    Ensure VALUE is set to TRUE.'
  remediation: 'To remediate this setting execute the following SQL statement.

    ALTER SYSTEM SET GLOBAL_NAMES = TRUE SCOPE = SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$PARAMETER

      WHERE UPPER(NAME)=''GLOBAL_NAMES'';

      25 | P a g e

      Ensure VALUE is set to TRUE.'
- id: 2.2.4
  title: Ensure 'LOCAL_LISTENER' Is Set Appropriately
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The local_listener setting specifies a network name that resolves to an address of the Oracle TNS listener.
  rationale: The TNS poisoning attack allows to redirect TNS network traffic to another system by registering a listener to
    the TNS listener. This attack can be performed by unauthorized users with network access. By specifying the IPC protocol
    it is no longer possible to register listeners via TCP/IP.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams118.htm#R
  - 2. https://support.oracle.com/epmos/faces/ui/km/DocumentDisplay.jspx?id=145388
  - '1.1'
  page_start: 26
  audit_raw: 'To assess this recommendation execute the following SQL statement.

    SELECT UPPER(VALUE)

    FROM V$PARAMETER

    WHERE UPPER(NAME)=''LOCAL_LISTENER'';

    Ensure VALUE is set to (DESCRIPTION=(ADDRESS= (PROTOCOL=IPC)(KEY=REGISTER))).'
  remediation: 'To remediate this setting execute the following SQL statement.

    ALTER SYSTEM SET LOCAL_LISTENER=''[description]'' SCOPE = BOTH;

    26 | P a g e

    Replace [description] with the appropriate description from your listener.ora file,

    where that description sets the PROTOCOL parameter to IPC.  For example:

    ALTER SYSTEM SET LOCAL_LISTENER=''(DESCRIPTION=(ADDRESS=(PROTOCOL=IPC)(KEY=REGISTER)))''

    SCOPE=BOTH;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$PARAMETER

      WHERE UPPER(NAME)=''LOCAL_LISTENER'';

      Ensure VALUE is set to (DESCRIPTION=(ADDRESS= (PROTOCOL=IPC)(KEY=REGISTER))).'
