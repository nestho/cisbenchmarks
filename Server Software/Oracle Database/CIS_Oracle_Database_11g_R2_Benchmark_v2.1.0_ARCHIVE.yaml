- id: 2.2.19
  title: Ensure 'RESOURCE_LIMIT' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: RESOURCE_LIMIT determines whether resource limits are enforced in database profiles The failed_login_attempts
    setting determines how many failed login attempts are permitted before the system locks the user's account.  While different
    profiles can have different and more restrictive settings, such as USERS and APPS, the minimum(s) recommended here should
    be set on the DEFAULT profile. The PASSWORD_LOCK_TIME setting determines how many days must pass for the user's account
    to be unlocked after the set number of failed login attempts has occurred. The password_life_time setting determines how
    long a password may be used before the user is required to be change it. The password_reuse_max setting determines how
    many different passwords must be used before the user is allowed to reuse a prior password. The password_reuse_time setting
    determines the amount of time in days that must pass before the same password may be reused. The password_grace_time setting
    determines how many days can pass after the user's password expires before the user's login capability is automatically
    locked out. The password='EXTERNAL' setting determines whether or not a user can be authenticated by a remote OS to allow
    access to the database with full authorization. The password_verify_function determines password settings requirements
    when a user password is changed at the SQL command prompt.  This setting does not apply for users managed by the Oracle
    password file. 47 | P a g e The SESSIONS_PER_USER (Number of sessions allowed) determines the maximum number of user sessions
    that are allowed to be open concurrently. Upon creation database users are assigned to the DEFAULT profile unless otherwise
    specified.
  rationale: If resource_limit is set to FALSE, none of the system resource limits that are set in any database profiles are
    enforced.  If resource_limit is set to TRUE, then the limits set in database profiles are enforced. As repeated failed
    login attempts can indicate the initiation of a brute-force login attack, this value should be set according to the needs
    of the organization (see warning below on a known bug that can make this security measure backfire). As locking the user
    account after repeated failed login attempts can block further bruteforce login attacks, but can create administrative
    headaches as this account unlocking process always requires DBA intervention, this value should be set according to the
    needs  of the organization. As allowing passwords to remain unchanged for long periods makes the success of bruteforce
    login attacks more likely, this value should be set according to the needs of the organization. As allowing reuse of a
    password within a short period of time after the password's initial use can make the success of both social-engineering
    and brute-force password-based attacks more likely, this value should be set according to the needs of the organization.
    As reusing the same password after only a short period of time has passed makes the success of brute-force login attacks
    more likely, this value should be set according to the needs of the organization. As locking the user account after the
    expiration of the password change requirement's grace period can help prevent password-based attack against a forgotten
    or disused accounts, while still allowing the account and its information to be accessible by DBA intervention,  this
    value should be set according to the needs  of the organization. As allowing remote OS authentication of a user to the
    database can potentially allow supposed "privileged users" to connect as "authenticated," even when the remote system
    is compromised, these logins should be disabled/restricted according to the needs of the organization. As requiring users
    to apply the 11gr2 security features in password creation, such as forcing mixed-case complexity, the blocking of simple
    combinations, and change/history settings can potentially thwart logins by unauthorized users, this function should be
    applied/enabled according to the needs of the organization. As limiting the number of the SESSIONS_PER_USER can help prevent
    memory resource exhaustion by poorly formed requests or intentional Denial-of-Service attacks, this value should be set
    according to the needs  of the organization. 48 | P a g e It is recommended that users be created with function-appropriate
    profiles.  The DEFAULT profile, being defined by Oracle, is subject to change at any time (e.g. by patch or version update).  The
    DEFAULT profile has unlimited settings that are often required by the SYS user when patching; such unlimited settings
    should be tightly reserved and not applied to unnecessary users.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e25513/initparams214.htm#R
  page_start: 40
