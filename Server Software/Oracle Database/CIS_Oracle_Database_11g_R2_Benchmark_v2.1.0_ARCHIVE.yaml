    AUDIT PUBLIC SYNONYM;\n5.12 Enable 'SYNONYM' Audit Option (Scored)\nExecute the following SQL statement to remediate this\
    \ setting.\nAUDIT SYNONYM;\nExecute the following SQL statement to remediate this setting.\nAUDIT GRANT DIRECTORY;\nExecute\
    \ the following SQL statement to remediate this setting.\nAUDIT SELECT ANY DICTIONARY;\nExecute the following SQL statement\
    \ to remediate this setting.\nAUDIT GRANT ANY OBJECT PRIVILEGE;\n124 | P a g e\nExecute the following SQL statement to\
