    AUDIT DROP ANY PROCEDURE;\n126 | P a g e\n5.18 Enable 'ALL' Audit Option on 'SYS.AUD$' (Scored)\nExecute the following\
    \ SQL statement to remediate this setting.\nAUDIT ALL ON SYS.AUD$ BY ACCESS;\n127 | P a g e\n5.19 Enable 'PROCEDURE' Audit\
    \ Option (Scored)\nExecute the following SQL statement to remediate this setting.\nAUDIT PROCEDURE;\n128 | P a g e\n5.20\
    \ Enable 'ALTER SYSTEM' Audit Option (Scored)\nExecute the following SQL statement to remediate this setting.\nAUDIT ALTER\
    \ SYSTEM;\n Execute the following SQL statement to remediate this setting.\nAUDIT TRIGGER;\nExecute the following SQL\
