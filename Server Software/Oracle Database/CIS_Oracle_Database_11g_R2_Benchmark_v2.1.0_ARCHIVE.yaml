    4.6 Ensure '%ANY%' Is Revoked from Unauthorized 'GRANTEE' (Scored)\nTo remediate this setting execute the following SQL\
    \ statement.\nREVOKE '<ANY Privilege>' FROM <grantee>;\nTo remediate this setting execute the following SQL statement.\n\
    REVOKE <privilege> FROM <grantee>;\n4.8 Ensure Proxy Users Have Only 'CONNECT' Privilege (Scored)\nTo remediate this setting\
    \ execute the following SQL statement.\nREVOKE [PRIVILEGE] FROM <proxy_user>;\n4.9 Ensure 'EXECUTE ANY PROCEDURE' Is Revoked\
    \ from 'OUTLN' (Scored)\nTo remediate this setting execute the following SQL statement.\nREVOKE EXECUTE ANY PROCEDURE\
    \ FROM OUTLN;\n4.10 Ensure 'EXECUTE ANY PROCEDURE' Is Revoked from 'DBSNMP'\n(Scored)\nTo remediate this setting execute\
    \ the following SQL statement.\nREVOKE EXECUTE ANY PROCEDURE FROM DBSNMP;\n110 | P a g e\n5 Audit/Logging Policies and\
    \ Procedures\nThe ability to audit database activities is among the most important of all database security\nfeatures.\
    \ Decisions must be made regarding the scope of auditing since auditing has costs -\nin storage for the audit trail and\
    \ in performance impact on audited operations - and\nperhaps even the database or system in general. There is also the\
    \ additional cost to manage\n(store, backup, secure) and review the data in audit trail.\nMeasures must be taken to protect\
    \ the audit trail itself, for it may be targeted for alteration\nor destruction to hide unauthorized activity. For an\
    \ audit destination outside the database,\nthe recommendations are elsewhere in this document. Auditing recommendations\
    \ for\npotential database audit destinations is below.\nAuditing \"by session\" typically creates fewer (until 11g) and\
    \ slightly smaller audit records,\nbut is discouraged in most situations since there is some loss of fidelity (e.g. object\
    \ privilege\nGRANTEE). More detailed auditing creates larger audit records. The AUDIT_TRAIL\ninitialization parameter\
    \ (for DB|XML, extended - or not) is the main determining factor for\nthe size of a given audit record - and a notable\
    \ factor in the performance cost, although the\nlargest of the latter is DB versus OS or XML.\nThis section deals with\
    \ standard Oracle auditing since auditing of privileged connections\n(as sysdba or sysoper) is configured via the AUDIT_SYS_OPERATIONS\
    \ initialization\nparameter and is otherwise not configurable. The basic types of standard auditing are\nobject auditing,\
    \ statement auditing and privilege auditing and each behaves differently.\nObject auditing applies to specific objects\
    \ for which it is invoked and always applies to all\nusers. This type of auditing is usually employed to audit application-specific\
    \ sensitive\nobjects, but can be used to protect the audit trail in the database.\nPrivilege auditing audits the use of\
    \ specific system privileges, but typically only if the user\nactually possesses the audited privilege. Attempts that\
    \ fail for lack of the audited privilege\nare typically not audited. This is the main weakness of privilege auditing and\
    \ why\nstatement auditing is usually preferred, if the option exists.\nStatement auditing audits the issuance of certain\
    \ types of statements, usually without\nregard to privilege or lack thereof. Both privilege and statement audits may be\
    \ specified for\nspecific users or all users (the default).\n111 | P a g e\n5.1 Enable 'USER' Audit Option (Scored)\n\
    Execute the following SQL statement to remediate this setting.\nAUDIT USER;\nExecute the following SQL statement to remediate\
    \ this setting.\nAUDIT ALTER USER;\n113 | P a g e\n5.3 Enable 'DROP USER' Audit Option (Scored)\nExecute the following\
    \ SQL statement to remediate this setting.\nAUDIT DROP USER;\n114 | P a g e\n5.4 Enable 'ROLE' Audit Option (Scored)\n\
