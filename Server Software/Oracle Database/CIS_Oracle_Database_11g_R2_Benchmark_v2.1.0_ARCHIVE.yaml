- id: 4.5.5
  title: Ensure 'ALL' Is Revoked from Unauthorized 'GRANTEE' on 'DBA_%'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  - Level 1 - Linux Host OS
  - Level 1 - Windows Server Host OS
  description: The Oracle installation version, along with the patch level, should be the most recent that is compatible with
    the organizations' operational needs. The Oracle installation has a view called DBA_USERS_WITH_DEFPWD, which keeps a list
    of all database users making use of default passwords. Oracle sample schemas are not needed for the operation of the database.  These
    include, among others, information pertaining to a sample schemas pertaining to Human Resources, Business Intelligence,
    Order Entry, and the like.  These samples create sample users (BI,HR,OE,PM,IX,SH, SCOTT), in addition to tables and fictitious
    data.
  rationale: As using the most recent Oracle database software, along with all applicable patches can help limit the possibilities
    for vulnerabilities in the software, the installation version and/or patches applied during setup should be established
    according to the needs of the organization.  Ensure you are using a release that is covered by a level of support that
    includes the generation of Critical Patch Updates. Default passwords should be considered "well known" to attackers.  Consequently,
    if default passwords remain in place any attacker with access to the database then has the ability to authenticate as
    the user with that default password.  When default passwords are altered, this circumstance is mitigated. The sample data
    is typically not required for production operations of the database and provides users with well-known default passwords,
    particular views, and procedures/functions.  Such users, views, and/or procedures/functions could be used to launch exploits
    against production environments.
  impact: The Oracle sample user names may be in use on a production basis.  It is important that you first verify that BI,
    HR, IX, OE, PM, SCOTT, and/or SH are not valid production user names before executing the dropping SQL scripts.  This
    may be particularly true with the HR and BI users. If any of these users are present, it is important to be cautious and
    confirm the schemas present are, in fact, Oracle sample schemas and not production schemas being relied upon by business
    operations.
  references:
  - 1. http://www.oracle.com/us/support/assurance/fixing-policies/index.html
  - 2. http://www.oracle.com/technetwork/topics/security/alerts-086861.html
  - 1.2 Ensure All Default Passwords Are Changed (Scored)
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e10575/tdpsg_user_accounts.ht
  - 1.3 Ensure All Sample Data And Users Have Been Removed (Scored)
  - 1. http://docs.oracle.com/cd/E11882_01/server.112/e10831/toc.htm
  - 2.1 Listener Settings
  page_start: 8
  audit_raw: "To assess this recommendation, use the following example shell command as appropriate\nfor your environment.\n\
    For example, on Unix/Linux systems:\n opatch lsinventory | grep -e \"^.*<latest_patch_version_numer>\\s*.*$\"\nFor example\
    \ on Windows systems:\n opatch lsinventory | find \"<latest_patch_version_number>\"\n15 | P a g e\nTo assess this recommendation,\
    \ execute the following SQL statement.\nSELECT USERNAME\nFROM DBA_USERS_WITH_DEFPWD\nWHERE USERNAME NOT LIKE '%XS$NULL%';\n\
    The assessment fails if results are returned.\nTo assess this recommendation, check for the presence of Oracle sample\
    \ users by executing\nthe following SQL statement.\n17 | P a g e\nSELECT USERNAME\nFROM ALL_USERS\nWHERE USERNAME IN ('BI','HR','IX','OE','PM','SCOTT','SH');"
  remediation: "Download and apply the latest quarterly Critical Patch Update patches.\nTo remediate this recommendation,\
    \ you may perform either of the following actions.\n• Manually issue the following SQL statement for each USERNAME returned\
    \ in the\nAudit Procedure:\n16 | P a g e\n PASSWORD <username>\n• Execute the following SQL script to randomly assign\
    \ passwords:\nbegin\n  for r_user in\n    (select username from dba_users_with_defpwd where username not like '%XS$NULL%')\n\
    \    loop\n      DBMS_OUTPUT.PUT_LINE('Password for user '||r_user.username||' will be\nchanged.');\n      execute immediate\
    \ 'alter user \"'||r_user.username||'\" identified by\n\"'||DBMS_RANDOM.string('a',16)||'\"account lock password expire';\n\
    \    end loop;\nend;\n/\nTo remediate this setting, it is recommended that you execute the following SQL script.\n$ORACLE_HOME/demo/schema/drop_sch.sql\n\
    NOTE: The recyclebin is not set to OFF within the default drop script, which means that\nthe data will still be present\
    \ in your environment until the recyclebin is emptied."
  checks:
  - type: command
    command: opatch lsinventory | grep -e "^.*<latest_patch_version_numer>\s*.*$"
    expected: ''
    severity: medium
    info: "To assess this recommendation, use the following example shell command as appropriate\nfor your environment.\n\
      For example, on Unix/Linux systems:\n opatch lsinventory | grep -e \"^.*<latest_patch_version_numer>\\s*.*$\"\nFor example\
      \ on Windows systems:\n opatch lsinventory | find \"<latest_patch_version_number>\"\n15 | P a g e\nTo assess this recommendation,\
      \ execute the following SQL statement.\nSELECT USERNAM"
- id: 2.1.1
  title: Ensure 'SECURE_CONTROL_<listener_name>' Is Set In 'listener.ora'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  - Level 1 - Windows Server Host OS
  description: The SECURE_CONTROL_<listener_name> setting determines the type of control connection the Oracle server requires
    for remote configuration of the listener.
  rationale: As listener configuration changes via unencrypted remote connections can result in unauthorized users sniffing
    the control configuration information from the network,  these control values should be set according to the needs  of
    the organization.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/network.112/e10835/listener.htm#NETRF
  page_start: 19
  audit_raw: "To audit this recommendation follow these steps:\n• Open the $ORACLE_HOME/network/admin/listener.ora file (or\n\
    %ORACLE_HOME%\\network\\admin\\listener.ora on Windows)\n• Ensure that each defined listener as an\nassociated SECURE_CONTROL_<listener_name>\
    \ directive.\nFor example:\nLISTENER1 =\n  (DESCRIPTION=\n    (ADDRESS=(PROTOCOL=TCP) (HOST=sales-server)(PORT=1521))\n\
    \    (ADDRESS=(PROTOCOL=IPC) (KEY=REGISTER))\n    (ADDRESS=(PROTOCOL=TCPS) (HOST=sales-server)(PORT=1522)))\n  SECURE_CONTROL_LISTENER1=TCPS\n\
    19 | P a g e"
  remediation: 'Set the SECURE_CONTROL_<listener_name> for each defined listener in the listener.ora

    file, according to the needs of the organization.'
  checks:
  - type: manual_review
    info: "To audit this recommendation follow these steps:\n• Open the $ORACLE_HOME/network/admin/listener.ora file (or\n\
      %ORACLE_HOME%\\network\\admin\\listener.ora on Windows)\n• Ensure that each defined listener as an\nassociated SECURE_CONTROL_<listener_name>\
      \ directive.\nFor example:\nLISTENER1 =\n  (DESCRIPTION=\n    (ADDRESS=(PROTOCOL=TCP) (HOST=sales-server)(PORT=1521))\n\
      \    (ADDRESS=(PROTOCOL=IPC) (KEY=REGISTER))\n    (ADDRESS=(PROTOCOL=TCPS) (HOST=sales-server)(PORT=1522)))\n  SECURE_CONTROL_LISTENER1=TCPS\n\
      19 |"
    severity: medium
- id: 2.1.2
  title: Ensure 'extproc' Is Not Present in 'listener.ora'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  - Level 1 - Windows Server Host OS
  description: Oracle extproc allows the database to run procedures from operating system libraries. These library calls can,
    in turn, run any operating system command.
  rationale: extproc should be removed from the listener.ora to mitigate the risk that OS libraries can be invoked by the
    Oracle instance.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/network.112/e10836/advcfg.htm#NETAG0
  page_start: 20
  audit_raw: "To audit this recommendation execute the following shell commands as appropriate for\nyour Unix/Windows environment.\n\
    Unix environment:\n grep -i extproc $ORACLE_HOME/network/admin/listener.ora\nWindows environment:\nfind /I extproc %ORACLE_HOME%\\\
    network\\admin\\listener.ora\nEnsure extproc does not exist."
  remediation: 'Remove extproc from the listener.ora file.

    20 | P a g e'
  checks:
  - type: command
    command: grep -i extproc $ORACLE_HOME/network/admin/listener.ora && find /I extproc %ORACLE_HOME%\network\admin\listener.ora
    expected: ''
    severity: medium
    info: "To audit this recommendation execute the following shell commands as appropriate for\nyour Unix/Windows environment.\n\
      Unix environment:\n grep -i extproc $ORACLE_HOME/network/admin/listener.ora\nWindows environment:\nfind /I extproc %ORACLE_HOME%\\\
      network\\admin\\listener.ora\nEnsure extproc does not exist."
- id: 2.1.3
  title: Ensure 'ADMIN_RESTRICTIONS_<listener_name>' Is Set to 'ON'
  scoring: scored
  profile:
  - Level 1 - Linux Host OS
  - Level 1 - Windows Server Host OS
  description: The admin_restrictions_<listener_name> setting in the listener.ora file can require that any attempted real-time
    alteration of the parameters in the listener via the set command file be refused unless the listener.ora file is manually
    altered then restarted by a privileged user.
  rationale: As blocking unprivileged users from making alterations of the listener.ora file, where remote data/services are
    specified, will help protect data confidentiality, this value should be set to the needs of the organization.
  impact: ''
  references:
  - 1. http://docs.oracle.com/cd/E11882_01/network.112/e10835/listener.htm#NETRF
  page_start: 21
  audit_raw: "To audit this recommendation execute the following shell commands as appropriate for\nyour Unix/Windows environment.\n\
    Unix environment:\n grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora\nWindows environment:\nfind /I\
    \ admin_restrictions %ORACLE_HOME%|\\network\\admin\\listener.ora\nEnsure ADMIN_RESTRICTIONS_<listener_name> is set to\
    \ ON for all listeners."
  remediation: 'Use a text editor such as vi to set the ADMIN_RESTRICTIONS_<listener_name> to the value

    ON.

    21 | P a g e'
  checks:
  - type: command
    command: grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora && find /I admin_restrictions %ORACLE_HOME%|\network\admin\listener.ora
    expected: ''
    severity: medium
    info: "To audit this recommendation execute the following shell commands as appropriate for\nyour Unix/Windows environment.\n\
      Unix environment:\n grep -i admin_restrictions $ORACLE_HOME/network/admin/listener.ora\nWindows environment:\nfind /I\
      \ admin_restrictions %ORACLE_HOME%|\\network\\admin\\listener.ora\nEnsure ADMIN_RESTRICTIONS_<listener_name> is set\
      \ to ON for all listeners."
