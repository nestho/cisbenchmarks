- id: 2.1.1
  title: Ensure 'extproc' Is Not Enabled
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: 'extproc is Oracle’s External Procedure Agent, used to call external C or C++ routines compiled as shared libraries
    (.so, .dll) from PL/SQL. There are two deployment models: • Listener-based configuration – The extproc agent is started
    and managed by the TNS Listener. Each external call is routed through the listener process. This approach exposes a TCP
    socket and therefore increases the attack surface. The configuration is defined in listener.ora. • Default (local) configuration
    – The extproc agent is spawned directly by the database process, using environment variables from $ORACLE_HOME/hs/admin/extproc.ora.
    This local configuration does not require the listener and does not expose a TCP port. Oracle explicitly recommends the
    local configuration (extproc.ora) unless one of the following exceptions applies: • Multi-threaded external procedure
    agents are required. • Oracle Database is running in MTS mode on Microsoft Windows. • The AGENT clause or AGENT IN clause
    is used to redirect external procedures to a remote extproc agent.'
  rationale: Leaving extproc configured through the listener unnecessarily exposes a network endpoint that could allow attackers
    to exploit unverified or malicious external libraries or to redirect extproc to arbitrary OS paths. Using the default
    local configuration (extproc.ora) minimizes the attack surface because the external procedure agent is spawned by the
    database itself, without any listener interaction or network exposure. This configuration aligns with Oracle’s recommended
    best practices and reduces the risk of arbitrary code execution on the database host.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/dfsig/externalprocedures.html#GUID-C61A9DAF-FE6B-4B0E-B6D7-BA61B0ECE0D6
  - 2. https://docs.oracle.com/en/database/oracle/oracledatabase/19/netag/configuring-and-administering-oracle-net-listener.html
  page_start: 21
  audit_raw: 'To audit this recommendation, execute the following shell commands as appropriate for

    your Linux/Windows environment.

    Linux environment:

    grep -i extproc $ORACLE_HOME/network/admin/listener.ora

    Windows environment:

    find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora

    Ensure no extproc entries are returned.

    If extproc entries exist in listener.ora, verify that one of the documented exception

    cases applies (multi-threaded agent, MTS/Windows, or AGENT clause redirection).

    Otherwise, the configuration is non-compliant.'
  remediation: 'To remediate this recommendation:

    1. Remove or comment out any extproc references from the listener.ora file.

    2. Ensure the local configuration file $ORACLE_HOME/hs/admin/extproc.ora exists

    and defines the required environment variables.

    3. Restart the listener if changes were made.

    Example:

    lsnrctl stop

    lsnrctl start'
  checks:
  - type: command
    command: grep -i extproc $ORACLE_HOME/network/admin/listener.ora && find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora
    expected: If extproc entries exist in listener.ora, verify that one of the documented exception
    severity: medium
    info: 'To audit this recommendation, execute the following shell commands as appropriate for

      your Linux/Windows environment.

      Linux environment:

      grep -i extproc $ORACLE_HOME/network/admin/listener.ora

      Windows environment:

      find /I "extproc" %ORACLE_HOME%\network\admin\listener.ora

      Ensure no extproc entries are returned.

      If extproc entries exist in listener.ora, verify that one of the documented exception

      c'
- id: 2.1.2
  title: Ensure 'ACCEPT_MD5_CERTS' Is Configured Correctly
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: 'The setting ACCEPT_MD5_CERTS specifies whether Oracle accepts certificates signed with the MD5 algorithm.
    Note: See Additional Information regarding the deprecation of this setting.'
  rationale: Weak algorithms such as MD5 and SHA1 have known vulnerabilities that make them susceptible to attacks. Allowing
    their use can compromise data integrity and authentication, potentially exposing systems to risks. Transitioning to stronger
    algorithms, such as SHA-2, is recommended.
  impact: Applications that use MD5-signed certificates must be updated to use certificates signed with a stronger, more secure
    algorithm such as SHA-2.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/netrf/parametersfor-the-sqlnet.ora.html#GUID-84DC4C50-A550-4770-9210-1EECB4B5DB27
  - 2. https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/using-theorapki-utility-to-manage-pki-elements.html#GUID-93CE62ED-97B1-43B3-890064107F8F274C
  page_start: 24
  audit_raw: 'On the Linux platform, execute the following shell command to audit this

    recommendation.

    grep -Ei "^[^#]*ACCEPT_MD5_CERTS\s*=\s*TRUE\s*$"

    "$ORACLE_HOME/network/admin/listener.ora"

    On the Windows platform, execute the following PowerShell command to audit this

    recommendation.

    Select-String -Path $Env:ORACLE_HOME\network\admin\listener.ora -Pattern

    "^\s*ACCEPT_MD5_CERTS\s*=\s*TRUE\s*$" -CaseSensitive:$false

    To be compliant with this recommendation, the output of this command should be NULL.

    The audit command above assumes that listener.ora is located in the default path

    $ORACLE_HOME/network/admin/listener.ora. If this is not the case, please specify

    the correct location. For example, you may be using the TNS_ADMIN environment

    variable to point to the location of SQLNET.ORA and TNSNAMES.ORA.'
  remediation: 'To remediate this recommendation, remove ACCEPT_MD5_CERTS from listener.ora or

    set ACCEPT_MD5_CERTS to the value FALSE.

    In addition to listener.ora, this parameter must also be set in sqlnet.ora.'
  checks:
  - type: command
    command: grep -Ei "^[^#]*ACCEPT_MD5_CERTS\s*=\s*TRUE\s*$"
    expected: ''
    severity: medium
    info: 'On the Linux platform, execute the following shell command to audit this

      recommendation.

      grep -Ei "^[^#]*ACCEPT_MD5_CERTS\s*=\s*TRUE\s*$"

      "$ORACLE_HOME/network/admin/listener.ora"

      On the Windows platform, execute the following PowerShell command to audit this

      recommendation.

      Select-String -Path $Env:ORACLE_HOME\network\admin\listener.ora -Pattern

      "^\s*ACCEPT_MD5_CERTS\s*=\s*TRUE\s*$" -CaseSensitiv'
