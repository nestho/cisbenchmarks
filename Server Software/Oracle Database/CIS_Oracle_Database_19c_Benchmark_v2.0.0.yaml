- id: 6.1.1
  title: Ensure '%ANY%' Is Revoked From Unauthorized 'GRANTEE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The Oracle database ANY keyword provides the user the capability to alter any item in the catalog of the database.
    Unauthorized grantees should not have that keyword assigned to them.
  rationale: Authorization to use the ANY expansion of a privilege can allow an unauthorized user to potentially change confidential
    data or damage the data catalog.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/dbseg/configuring-privilege-and-role-authorization.html
  page_start: 143
  audit_raw: "System privileges in Oracle can be granted directly to users or roles, and can also be\ninherited through role\
    \ hierarchies, either directly or recursively. To remediate and\nrevoke system privileges from unauthorized users or roles,\
    \ it is essential to trace the\nchain of privilege grants by examining the Granted Privilege and How Granted columns.\n\
    This query will also give you the name of the CDB/PDB that has the issue. To assess\nthis recommendation, execute the\
    \ following SQL statement.\nWITH GRANTEES_NOT_ORACLEMAINTAINED AS (\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID) AS\
    \ CONTAINERNAME, ROLE AS\nGRANTEE FROM CDB_ROLES WHERE ORACLE_MAINTAINED = 'N'\n    UNION\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID)\
    \ AS CONTAINERNAME, USERNAME AS\nGRANTEE FROM CDB_USERS WHERE ORACLE_MAINTAINED = 'N'\n),\nDIRECT_PRIVS AS (\n    SELECT\
    \ DISTINCT CON_ID_TO_CON_NAME(CON_ID) AS CONTAINERNAME, GRANTEE,\nPRIVILEGE AS GRANTED_PRIVILEGE, 'Direct Grant' AS HOW_GRANTED\n\
    \    FROM CDB_SYS_PRIVS\n    WHERE PRIVILEGE LIKE '%ANY%'\n),\nINDIRECT_PRIVS AS (\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID)\
    \ AS CONTAINERNAME, GRANTEE,\nGRANTED_ROLE AS GRANTED_PRIVILEGE, 'Privileges Through Role' AS HOW_GRANTED\n    FROM CDB_ROLE_PRIVS\n\
    \    START WITH GRANTED_ROLE IN ( SELECT DISTINCT P.GRANTEE FROM\nSYS.CDB_SYS_PRIVS P, SYS.CDB_ROLES R WHERE P.PRIVILEGE\
    \ LIKE '%ANY%' AND\nP.GRANTEE = R.ROLE) CONNECT BY PRIOR GRANTEE = GRANTED_ROLE\n)\nSELECT CONTAINERNAME, GRANTEE, GRANTED_PRIVILEGE,\
    \ HOW_GRANTED\nFROM (\n    SELECT * FROM DIRECT_PRIVS\n    UNION\n    SELECT * FROM INDIRECT_PRIVS\n) COMBINED_PRIVS\n\
    WHERE\n    GRANTEE IN (SELECT GRANTEE FROM GRANTEES_NOT_ORACLEMAINTAINED)\nORDER BY CONTAINERNAME, GRANTEE, GRANTED_PRIVILEGE;\n\
    Lack of results implies compliance."
  remediation: 'To remediate this setting, execute the following SQL statement, keeping in mind if this is

    granted in both container and pluggable database, you must connect to both places to

    revoke. Please ensure proper impact analysis is done before revoking the privilege from

    a role.

    REVOKE <ANY Privilege> FROM <grantee>;

    In the case of a grant via a role :

    REVOKE <rolename> FROM <grantee>;'
  checks:
