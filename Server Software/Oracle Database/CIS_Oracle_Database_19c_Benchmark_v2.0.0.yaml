  remediation: "To remediate this setting, execute the following SQL statement.\nALTER SYSTEM SET SEC_CASE_SENSITIVE_LOGON\
    \ = TRUE SCOPE = SPFILE;\nRemediate this setting by executing the following SQL statement for each PROFILE\nreturned by\
    \ the audit procedure.\nALTER PROFILE <profile_name> LIMIT FAILED_LOGIN_ATTEMPTS 5;\nRemediate this setting by executing\
    \ the following SQL statement for each PROFILE\nreturned by the audit procedure.\nALTER PROFILE <profile_name> LIMIT PASSWORD_LOCK_TIME\
    \ 1;\nRemediate this setting by executing the following SQL statement for each PROFILE\nreturned by the audit procedure.\n\
    ALTER PROFILE <profile_name> LIMIT PASSWORD_LIFE_TIME 365;\nOR\nALTER PROFILE <profile_name> LIMIT PASSWORD_GRACE_TIME\
    \ <NEW_VALUE>;\nRemediate this setting by executing the following SQL statement for each PROFILE\nreturned by the audit\
    \ procedure.\nALTER PROFILE <profile_name> LIMIT PASSWORD_REUSE_MAX 'UNLIMITED';\nUse the password verification function,\
    \ or create a custom password verification\nfunction which fulfills the password requirements of the organization.\nOracle\
    \ supplies two password verification functions with the database\nora12c_verify_function and ora12c_strong_verify_function.\
    \ You may also\ncreate your own function if your organization's standards are different from the functions\nOracle supplies.\
    \ For a sample of a password verification function that you can\ncustomize to meet your needs, see $ORACLE_HOME/rdbms/admin/catpvf.sql.\
    \ In most\ncases, we recommend that ora12c_strong_verify_function be used.\nIf you discover profiles using verification\
    \ functions that do not meet your organization's\nstandards, you may remediate this setting by executing the following\
    \ SQL statement for\neach PROFILE returned by the audit procedure. This will cause accounts assigned those\nprofiles to\
    \ use the ora12c_strong_verify_function. The next time that account's\npassword is changed, the new function will validate\
    \ that they meet standards.\nALTER PROFILE <profile_name> LIMIT\n PASSWORD_VERIFY_FUNCTION ORA12C_STRONG_VERIFY_FUNCTION;\n\
    Remediate this setting by executing the following SQL statement for each PROFILE\nreturned by the audit procedure.\nALTER\
    \ PROFILE DEFAULT LIMIT PASSWORD_ROLLOVER_TIME 0;\nRemediate this setting by executing the following SQL statement for\
    \ each PROFILE\nreturned by the audit procedure.\nALTER PROFILE DEFAULT LIMIT INACTIVE_ACCOUNT_TIME 120\nTo reset the\
    \ account with NO AUTHENTICATION, execute the following SQL statement in\nCDB:\nALTER USER <USERNAME> NO AUTHENTICATION;\n\
    Notes:\n• As per Oracle Support Document 2173962.1, newly created database may list\nSYS and SYSTEM in CBA_USERS_WITH_DEFPWD\
    \ even if they were set with nondefault passwords. Running ALTER USER with the same password will correctly\nrecognize\
    \ these accounts as non-default.\n• If remote_password_file is set to NONE, changing the SYS password via ALTER\nUSER\
    \ is not possible. In this case, update remote_password_file to EXCLUSIVE\nbefore modifying the SYS password.\nTo remediate\
    \ this setting, perform the following steps:\n<Export the User>\nDROP USER <USERNAME>;\n<Recreate the user as non-Oracle-maintained\
    \ user using import utilities>\nRemove RAS-Users that are not needed.\nBEGIN\n   SYS.XS_PRINCIPAL.DELETE_PRINCIPAL('<rasuser>');\n\
    END;\nFollow the process \"Finding and Resetting User Passwords That Use the 10G\nPassword Version\" as outlined in the\
    \ Oracle Database Upgrade Guide to reset affected\nuser passwords and enforce 12c password versioning.\n• Identify users\
    \ with old password versions.\n• Ensure that SQLNET.ALLOWED_LOGON_VERSION_SERVER is set to 12a.\n• Reset their passwords\
    \ using the ALTER USER command.\nTo update the password file to the latest format (12.2), follow these steps:\n• Ensure\
    \ that all users in the password file have passwords meeting 12.2\ncomplexity requirements.\n• Use the orapwd utility\
    \ to create a new password file in 12.2 format:\norapwd file=orapwd122 FORMAT=12.2\n• If the password file name or location\
    \ has recently changed and the changes are\nnot reflected, refresh the metadata cache:\nALTER SYSTEM FLUSH PASSWORDFILE_METADATA_CACHE;\n\
    • Validate the password file format using the audit query again.\nAfter changes to the password file, all nodes should\
    \ be synchronized.\nTo remove a public database link, execute the following SQL command:\nDROP PUBLIC DATABASE LINK <DB_LINK>;\n\
    Drop and recreate the database link to ensure that passwords are encrypted using the\nlatest method."
