  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The SEC_PROTOCOL_ERROR_TRACE_ACTION setting determines the Oracle's server's logging response level to bad/malformed
    packets received from the client by generating ALERT, LOG, or TRACE levels of detail in the log files. This setting should
    have a value of LOG unless the organization has a compelling reason to use a different value because LOG should cause
    the necessary information to be logged. Setting the value as TRACE can generate an enormous amount of log output and should
    be reserved for debugging only.
  rationale: Bad packets received from the client can potentially indicate packet-based attacks on the system, which could
    result in a denial-of-service condition.
