- id: 5.1.3
  title: Ensure Critical Packages Are Audited
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: 'Auditing critical packages in Oracle is essential to ensure database security, maintain accountability, and
    support compliance with regulatory requirements. These packages provide powerful functionality, such as scheduling jobs,
    performing cryptographic operations, or handling web-based utilities where, if misused or exploited, can compromise the
    integrity, confidentiality, and availability of the database. Auditing these critical packages is recommended; however,
    it should be enabled based on the specific needs and requirements of the organization: • SYS.DBMS_AW • SYS.DBMS_CRYPTO
    • SYS.DBMS_FGA • SYS.DBMS_JAVA_TEST • SYS.DBMS_JOB • SYS.DBMS_LOGMNR • SYS.DBMS_NETWORK_ACL_ADMIN • SYS.DBMS_REDACT •
    SYS.DBMS_REDEFINITION • SYS.DBMS_RLS • SYS.DBMS_SCHEDULER • SYS.DBMS_SQL_TRANSLATOR • SYS.DBMS_SYS_SQL • SYS.DBMS_TSDP_MANAGE
