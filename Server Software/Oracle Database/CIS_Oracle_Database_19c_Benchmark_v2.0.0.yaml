- id: 2.3.3
  title: Ensure 'ALLOW_GROUP_ACCESS_TO_SGA' Is Set To `FALSE`
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The ALLOW_GROUP_ACCESS_TO_SGA controls Linux group access to shared memory on Linux platforms. By default,
    database shared memory is created with owner access only.
  rationale: This is to minimize the attack surface, as setting ALLOW_GROUP_ACCESS_TO_SGA to true will allow linux accounts
    with the same group membership of the oracle software account owner to access the shared memory and thus the ability to
    dump data from memory.
  impact: No impact on database operations, but it may impact third party software that requires access to Oracle SGA memory
    such as security monitoring software.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/refrn/ALLOW_GROUP_ACCESS_TO_SGA.html#GUIDA6BABC97-7EF8-4E1A-89C9-CF81EDCFB4A2
