  profile:
  - Level 1 - RDBMS
  description: Some tables contain critical information such as password hashes, encrypted passwords, etc. No user other than
    SYS should have table privileges on these tables.
  rationale: Unauthorized users with access to these tables can perform actions at the operating system level that bypass
    normal security controls, potentially leading to data breaches, tampering, or destruction.
  impact: ''
  references: []
  page_start: 209
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT CON_ID_TO_CON_NAME(c.con_id) AS containername, c.*

    FROM CDB_TAB_PRIVS c

