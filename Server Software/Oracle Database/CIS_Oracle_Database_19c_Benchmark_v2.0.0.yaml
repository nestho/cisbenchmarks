- id: 6.6.1
  title: Ensure Proxy User Privileges Are Revoked From Unauthorized 'GRANTEE'
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: Oracle Database supports proxy user authentication, which allows a client user to connect to the database as
    a proxy user.
  rationale: 'An Oracle user with the right to connect to the database as a proxy user inherits the authorizations and roles
    of the client. For example, the user DUMMYUSER can log on as SYSTEM and then use its DBA role: ALTER USER SYSTEM GRANT
    CONNECT THROUGH DUMMYUSER;'
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/refrn/DBA_PROXIES.html#GUID-1F0BFB9F-8A91-41CD-953FB3EADB17E0AD
  page_start: 215
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT CON_ID_TO_CON_NAME(J.CON_ID) AS CONTAINERNAME,J.* FROM CDB_PROXIES J

    If any unauthorized users are granted proxy user privileges, this is a fail.'
  remediation: 'To remediate this recommendation, execute the following SQL statement.

    ALTER USER <CLIENT_USER> REVOKE CONNECT THROUGH <PROXY_USER>;'
  checks:
  - type: sql
    command: SELECT CON_ID_TO_CON_NAME(J.CON_ID) AS CONTAINERNAME,J.* FROM CDB_PROXIES J
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

