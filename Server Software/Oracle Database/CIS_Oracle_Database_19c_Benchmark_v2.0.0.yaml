- id: 5.1.5
  title: Ensure The Use Of SYS* Privileges Is Audited
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: 'The usage of the SYS* (SYS, SYSKM, SYSBACKUP, SYSRAC, SYSDG, PUBLICSYS, SYSKM, SYSBACKUP, SYSRAC, SYSDG, PUBLIC)
    privileges should always be audited. Under Oracle classic auditing, this was the case with the parameter AUDIT_SYS_OPERATIONS
    = TRUE. To achieve the same behavior with Unified Auditing, it is necessary to audit all users who use SYS* privileges.
    As the SYS* privileges have the special feature of being used first, it is necessary to audit them separately, as otherwise
    they will not be taken into account by the other audit policies. Example: A user with SYSDBA privileges accesses a table
    (e.g. HR.EMP). In this case, not the SELECT ANY TABLE privilege, but the SYSDBA privilege is used. As a result, audit
    rule 5.1 does not fire. With unified auditing, it must always be ensured that the privileges are used for object access
    in the following order (if available): 1. SYS* privileges (e.g. SYSDBA) 2. Direct access rights (e.g. direct object grant
    or public grant) 3. ANY rights'
  rationale: All users using the SYS*-Privilege should be audited to avoid that the highest privileged user is not audited.
  impact: SYS* performs critical system-level operations, and auditing every action can add considerable performance overhead.
    SYS operations generate a large volume of audit logs, especially in high-transaction environments. Too much logging can
    make it difficult to identify critical security events among routine activities especially in Oracle Dataguard environments.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/CREATEAUDIT-POLICY-Unified-Auditing.html
  page_start: 136
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nWITH\nCIS_AUDIT(CONTAINERNAME, CON_ID,\
    \ AUDIT_OPTION, ENTITY_NAME_EXPECTED) AS (\n  SELECT C.NAME, C.CON_ID, 'ALL' AS AUDIT_OPTION, LL.COLUMN_VALUE AS\nENTITY_NAME_EXPECTED\
    \ FROM V$CONTAINERS C,\nTABLE(DBMSOUTPUT_LINESARRAY('SYS','SYSBACKUP','SYSDG','SYSKM','SYSRAC','PUBLI\nC')) LL\n  WHERE\
    \ C.OPEN_MODE='READ WRITE'\n),\nAUDIT_ENABLED AS (\n  SELECT DISTINCT AUD.CON_ID, AUD.AUDIT_OPTION, ENABLED.ENTITY_NAME\n\
    \  FROM CONTAINERS(AUDIT_UNIFIED_POLICIES) AUD,\nCONTAINERS(AUDIT_UNIFIED_ENABLED_POLICIES) ENABLED\n  WHERE ENABLED.CON_ID\
    \ = AUD.CON_ID\n    AND ENABLED.POLICY_NAME = AUD.POLICY_NAME\n    AND AUD.AUDIT_OPTION IN ('ALL')\n    AND AUD.AUDIT_OPTION_TYPE\
    \ = 'STANDARD ACTION'\n    AND ENABLED.SUCCESS = 'YES'\n    AND ENABLED.FAILURE = 'YES'\n    AND ENABLED.ENABLED_OPTION\
    \ = 'BY USER'\n    AND ENABLED.ENTITY_NAME IN\n('SYS','SYSBACKUP','SYSDG','SYSKM','SYSRAC','PUBLIC')\n)\nSELECT C.CONTAINERNAME,\
    \ C.AUDIT_OPTION, C.ENTITY_NAME_EXPECTED\nFROM CIS_AUDIT C\nWHERE NOT EXISTS (\n  SELECT 1 FROM AUDIT_ENABLED E WHERE\
    \ E.AUDIT_OPTION = C.AUDIT_OPTION AND\nE.ENTITY_NAME = C.ENTITY_NAME_EXPECTED AND E.CON_ID = C.CON_ID\n) ORDER BY 1, 3;\n\
    Lack of results implies compliance."
  remediation: 'Execute the following SQL statement in the CDB and in each PDB to remediate this

    recommendation:

    CREATE AUDIT POLICY CIS_CDB_ALL_ACTIONS_BY_PRIVILEGED_USERS

    ACTIONS ALL

    WHEN q''! (SYS_CONTEXT(''USERENV'',''CLIENT_PROGRAM_NAME'') NOT IN (''emagent'') AND

    INSTR(UPPER(SYS_CONTEXT(''USERENV'',''CLIENT_PROGRAM_NAME'')),''PERL'') = 0  AND

    INSTR(UPPER(SYS_CONTEXT(''USERENV'',''CLIENT_PROGRAM_NAME'')),''RMAN'') = 0  AND

    INSTR(UPPER(SYS_CONTEXT(''USERENV'',''CLIENT_PROGRAM_NAME'')),''OMS'') = 0)!''

    EVALUATE PER SESSION

    ONLY TOPLEVEL;

    AUDIT POLICY CIS_CDB_ALL_ACTIONS_BY_PRIVILEGED_USERS BY SYS, SYSKM,

    SYSBACKUP, SYSRAC, SYSDG, PUBLIC;

    Note: If you do not have CIS_CDB_ALL_ACTIONS_BY_PRIVILEGED_USERS, please

    create one using the CREATE AUDIT POLICY statement. Refer to Section 8.5 where a

    PL/SQL block is provided to help create or modify the audit policy to remediate this item

    in both container and pluggable database.

    For legacy reasons the SYSOPER privilege is using the name PUBLIC. The used privilege

    in the unified audit log is SYSOPR. Emagent, OMS, RMAN and Perl have been excluded to

    prevent an excessive number of events and issues with spillover files.'
