- id: 2.2.10
  title: Ensure 'SQLNET.CRYPTO_CHECKSUM_CLIENT' Is Set To 'REQUIRED'
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: The SQLNET.CRYPTO_CHECKSUM_CLIENT parameter specifies the checksum behavior for the client when connecting
    to a server. This setting enables the client to enforce cryptographic checksums, which verify the integrity of data transmitted
    during clientserver interactions. Oracle networking already performs checksumming, so additional cryptographic checksumming
    is usually of limited value. A setting of REQUIRED at the server requires that incoming connections are encrypted with
    AES256. Oracle database network encryption configured through TLS/SSL is also an acceptable mechanism and may be implemented
    in lieu of this setting.
  rationale: Enabling cryptographic checksums for client connections ensures a higher degree of data integrity.
  impact: 'If SQLNET.CRYPTO_CHECKSUM_CLIENT is set to REQUIRED, the client will be unable to connect to servers that do not
    require cryptographic checksums, resulting in connection failures. This may cause errors such as ORA-12650: No common
    encryption or data integrity algorithm if the server does not meet the client’s checksum requirements.'
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/netrf/parametersfor-the-sqlnet.ora.html#GUID-D76832AE-FFFA-47D1-9EF6-46D95C78004C
