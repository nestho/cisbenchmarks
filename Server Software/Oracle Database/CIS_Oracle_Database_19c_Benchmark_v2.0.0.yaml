- id: 2.3.15
  title: Ensure 'SEC_CASE_SENSITIVE_LOGON' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: 'The SEC_CASE_SENSITIVE_LOGON information determines whether or not casesensitivity is required for passwords
    during login. Note: This parameter has been deprecated in 12.1 and higher versions. The FAILED_LOGIN_ATTEMPTS setting
    defines the number of consecutive failed login attempts allowed before a user''s account is locked. While different profiles
    can have customized settings based on organizational needs, a minimum recommended value of 5 should be enforced. Organizations
    may choose a higher value for specific use cases, such as application data source accounts, to prevent unnecessary lockouts
    while maintaining security. However, increasing this threshold should be carefully reviewed to ensure that the system''s
    security posture is maintained and accounts are protected against unauthorized or brute-force login attempts. The PASSWORD_LOCK_TIME
    setting determines how many days must pass for the user''s account to be unlocked after the set number of failed login
    attempts has occurred. The suggested value for this is one day or greater. The PASSWORD_LIFE_TIME setting determines how
    long a password may be used before the user is required to change it. The suggested value is 365 days or less. Note that
    recent NIST guidelines recommend using longer lifetimes for human actor passwords. The PASSWORD_REUSE_MAX setting determines
    how many different passwords must be used before the user is allowed to reuse a prior password. The suggested value for
    this is UNLIMITED. The PASSWORD_VERIFY_FUNCTION enforces password complexity checks when a database account''s password
    is changed. It should be set for all profiles. Note that this setting does not apply to administrative roles (like SYSDBA,
    SYSDG or SYSOPER) authenticated by the Oracle password file. From 12.2, Oracle provides password complexity rules for
    password file users (Doc 2294754.1) The setting PASSWORD_VERIFY_FUNCTION is used to enable password complexity verification.
    If using a custom verification function, it''s important to ensure that the complexity function meets your organization''s
    policy for password complexity. Review the code to ensure that the password verification function meets the password complexity
    rules that have been set for your organization. This setting PASSWORD_ROLLOVER_TIME enables the gradual database password
    rollover time allowing both the new and old password to be used for a set period of time after a password is changed.
    This capability is not normally appropriate for human actors, but is frequently valuable for application and batch processing
    service accounts. The INACTIVE_ACCOUNT_TIME parameter in Oracle specifies the number of days an account can remain inactive
    before it is automatically locked. This setting helps mitigate security risks by reducing the exposure of unused accounts,
    which could be exploited for unauthorized access. Default passwords should not be used by Oracle database users. Leaving
    default passwords unchanged can create significant security vulnerabilities by allowing unauthorized access to the database.
    Oracle-maintained accounts should not be created. The ORACLE_MAINTAINED flag is used to identify such accounts. Only users
    provided by Oracle should have this flag set to Y. Custom database users should not be assigned this designation. Oracle
    Real Application Security (RAS) introduces an alternative user model that allows users to log in directly (e.g., with
    SQL*Plus) when DIRECT_LOGON = YES. RAS users do not appear in the DBA_USERS or CDB_USERS views and are not created using
    the standard CREATE USER command, making them difficult to detect. To ensure proper security monitoring, the CDB_XS_USERS
    view should be reviewed regularly. No password versions (hashes) prior to 12c should be allowed for user authentication.
    The database password file is used to authenticate users with administrative privileges (SYSDBA, SYSOPER, etc.) from a
    remote machine. It enables secure remote database management and contains a list of privileged users with their corresponding
    encrypted passwords. Starting with Oracle 12.2, Oracle enforces stronger password hashing algorithms in password files
    to improve security. It is recommended to ensure that the password file format is updated to 12.2 to leverage enhanced
    security mechanisms. In Oracle Real Application Clusters (RAC) environments, each instance maintains its own password
    file for authenticating users with administrative privileges (SYSDBA, SYSOPER, SYSBACKUP, etc.). If password files are
    not synchronized across all RAC nodes, certain administrative users may exist on only one node, causing authentication
    failures when attempting to log in from other nodes. To ensure seamless remote administration and high availability, all
    RAC instances must have identical password files. Public database links provide a mechanism for establishing connections
    between databases, enabling data access across multiple environments. In Oracle databases, encrypted passwords for database
    links are stored in the PASSWORDX column, which can be decrypted.'
  rationale: 'Oracle database password case-sensitivity increases the pool of characters that can be chosen for the passwords,
    making brute-force password attacks quite difficult. Repeated failed login attempts may indicate the initiation of a brute-force
    attack. Therefore, this value should be configured based on the organization''s security requirements, balancing account
    protection with operational needs. Locking the user account after repeated failed login attempts can block further bruteforce
    login attacks but can create administrative headaches as this account unlocking process always requires DBA intervention.
    Allowing passwords to remain unchanged for long periods makes the success of attacks leveraging stolen passwords more
    likely. Allowing reuse of a password within a short period of time after the password''s initial use can make the success
    of both social-engineering and brute-force password-based attacks more likely. Through Oracle Database profiles, password
    complexity rules (mixed cases with digits and special characters), blocking of simple combinations, and enforcing change/history
    settings can potentially thwart unauthorized logins by an unauthorized user. Having strong password management for users
    will protect against attackers'' brute force techniques. This is important especially if external authentication is not
    possible to implement due to application requirements or restrictions. With the need to change passwords at some frequency
    and the goal to limit downtime for applications operating across multiple tiers it is necessary to have an overlap period
    where both the new and old passwords are accepted. This allows time for all tiers supporting the application to be updated
    to use the new password. Inactive user accounts pose security risks as they can be potentially targeted by the attackers
    for unauthorized access. Setting a reasonable threshold for inactivity helps enforce security best practices by ensuring
    that unused accounts are locked before they can be potentially targeted for unauthorized access. A value of 120 days or
    less strikes a balance between security and operational flexibility. Default passwords are widely known and documented.
    If left unchanged, any malicious user with database access can authenticate using these default credentials, potentially
    leading to unauthorized data access, privilege escalation, or database compromise. Oracle-maintained accounts are used
    by internal tools, database packages, procedures, and third-party software to make critical decisions. For example: •
    Data Pump often excludes objects marked as ORACLE_MAINTAINED. • Oracle upgrades and patches may modify or delete objects
    marked with this flag. • Custom schemas should not use this flag, as it can lead to unintended system behavior, including
    unauthorized modifications during maintenance activities. Some organizations attempt to create custom ORACLE_MAINTAINED
    users to bypass the C##-prefix requirement for common users. However, misusing this flag can introduce security risks
    and operational issues. It can impact proper functioning and integrity of Oracle databases. RAS users are not visible
    in traditional DBA_USERS or CDB_USERS views. Privileges for RAS users are stored and displayed separately from standard
    database users. Without regular monitoring, unauthorized or unintended RAS users may remain undetected. Security assessments
    must include RAS-related views, such as CDB_XS_USERS and DBA_XS_USERS, to analyze users and their authorizations. Oracle
    12c and later versions enforce stronger password hashing algorithms and complexity policies, enhancing security. Older
    password versions (pre-12c) are considered weak and do not meet modern security standards.Using outdated password versions
    increases the risk of password compromise. Ensuring that the password file format is 12.2 provides the following benefits:
    • Enhanced security: Passwords are stored using a stronger hashing algorithm. • Compliance with best practices: The latest
    format ensures compatibility with the recommended security settings. • Ability to grant administrative privileges (SYSOPER,
    SYSBACKUP, etc.) to global users securely. Maintaining identical password files across all RAC nodes ensures consistent
    authentication for administrative users across all nodes and remote management of the database without login failures.
    Public database links pose a security risk because they allow any database user to execute queries or modify data on a
    remote database, depending on the credentials stored in the link. This can lead to unauthorized access, data breaches,
    and compliance violations. Attackers who gain access to PASSWORDX can potentially decrypt and misuse stored credentials
    for unauthorized access.'
  impact: Configuring this setting could result in application account lockouts which may impact the service(s) provided by
    the application. To minimize the impact, you may set this setting to a sufficiently higher value for you to update applications
    and batch processes to use new passwords after a password change. If an account is locked due to inactivity, administrators
    may need to manually unlock it when required. Organizations should communicate this policy to users to avoid disruptions.
    Dropping a user may result in data loss or impact application availability, requiring thorough assessment before taking
    action. You may need to export all objects owned by common users in the CDB and all PDBs before making changes. DROP USER
    <USERNAME>; Dropping a RAS user may result in data loss or impact application availability, requiring thorough assessment
    before taking action. Some applications or scripts may rely on RAS users for specific tasks. Removing it may break these
    applications, requiring modifications or redesign. Resetting user passwords without proper migration planning may result
    in application downtime or loss of access. Users with passwords hashed in an older format will be required to reset their
    passwords. Limiting authentication to 12c password versions may impact connectivity from older clients that rely on deprecated
    authentication mechanisms. Applications using pre-12c authentication methods must be updated to support 12c or later password
    hashing mechanisms. This checks for all users except SYS because SYS either uses bequeath (no password) for local connections
    or the remote login password file for remote connections. Strength of the remote login password file is examined in recommendation
    4.5. Non SYS users have the option of either logging in normally (via SYS.USER$) or with administrative rights (with SYSDBA/SYSOPER/…).
    In environments using ASM, RAC, or RMAN, upgrading the password file format may require additional considerations. Existing
    users in the password file must already have passwords that comply with 12.2 format before upgrading. Any changes to the
    password file format should be thoroughly tested in a nonproduction environment before implementation. If password files
    are not synchronized, privileged users may be unable to authenticate on certain RAC nodes. Applications relying on public
    database links may fail after removal. Alternative connection methods (e.g., private database links) may need to be implemented.
    If a database link password is stored using an older encryption method, it could be decrypted and exploited, posing a
    security risk.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/refrn/SEC_CASE_SENSITIVE_LOGON.html
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/CREATEPROFILE.html#d387296e851
