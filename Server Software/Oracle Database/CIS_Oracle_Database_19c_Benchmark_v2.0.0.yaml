- id: 2.2.11
  title: Ensure 'SQLNET.CRYPTO_CHECKSUM_SERVER' Is Set To 'REQUIRED'
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: The SQLNET.CRYPTO_CHECKSUM_SERVER parameter specifies the checksum behavior for the server when connecting
    to a client. This setting enables the server to enforce cryptographic checksums, which verify the integrity of data transmitted
    during clientserver interactions. Oracle networking already performs checksumming, so additional cryptographic checksumming
    is usually of limited value. A setting of REQUIRED at the server requires that the outgoing connections are encrypted
    with AES256. Oracle database network encryption configured through TLS/SSL is also an acceptable mechanism and may be
    implemented in lieu of this setting.
  rationale: Enabling cryptographic checksums for server connections ensures a higher degree of data integrity.
  impact: 'If SQLNET.CRYPTO_CHECKSUM_SERVER is set to REQUIRED, the client will be unable to connect to servers that do not
    require cryptographic checksums, resulting in connection failures. This may cause errors such as ORA-12650: No common
    encryption or data integrity algorithm if the server does not meet the client’s checksum requirements.'
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/netrf/parametersfor-the-sqlnet.ora.html#GUID-FE083F54-FF01-4D2C-90E7-BEA527FF5696
  page_start: 56
