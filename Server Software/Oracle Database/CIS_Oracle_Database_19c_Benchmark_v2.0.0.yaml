- id: 2.3.1
  title: Ensure 'BACKGROUND_CORE_DUMP' Is Not Set To 'Full'
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: The BACKGROUND_CORE_DUMP parameter in Oracle's init.ora file specifies the level of detail captured in core
    dumps generated by background processes during an exception. Setting this parameter to FULL enables the creation of detailed
    SGA dumps, which may include sensitive information.
  rationale: Allowing BACKGROUND_CORE_DUMP to be set to FULL increases the risk of exposing sensitive data, such as encryption
    keys, passwords, or other confidential information, in the core dump files. These files could be accessed by unauthorized
    users, leading to data breaches. Limiting the detail in core dumps reduces this risk while still providing enough information
    for diagnostics. The use of TDE doesn’t prevent, or encrypt the dumps generated by the background processes.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/refrn/BACKGROUND_CORE_DUMP.html#GUID-A7118B00-4814453E-872E-B68E4CB192F6
  page_start: 60
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nSELECT DECODE(V.CON_ID,0,'ENTIRE-'||SYS_CONTEXT('USERENV','DB_NAME'),\n\
    \         1,'ROOTONLY-'||SYS_CONTEXT('USERENV','DB_NAME'),\n         CON_ID_TO_CON_NAME(V.CON_ID)) AS CONTAINERNAME, UPPER(V.VALUE)\n\
    FROM GV$SYSTEM_PARAMETER V\nWHERE UPPER(NAME) = 'BACKGROUND_CORE_DUMP'\nAND UPPER(VALUE) = 'FULL'\nORDER BY CON_ID;\n\
    To be compliant with this recommendation, the output of this command should be NULL.\nLack of results indicates compliance."
  remediation: 'To remediate this recommendation, execute the following SQL statement.

    ALTER SYSTEM SET BACKGROUND_CORE_DUMP=''partial'' SCOPE=BOTH;

    Note: This parameter is not modifiable at the PDB level. You must modify this

    parameter at the CDB level.'
  checks:
  - type: manual_review
    info: "To assess this recommendation, execute the following SQL statement.\nSELECT DECODE(V.CON_ID,0,'ENTIRE-'||SYS_CONTEXT('USERENV','DB_NAME'),\n\
