- id: 2.1.4
  title: Ensure 'ALLOWED_WEAK_CERT_ALGORITHMS’ Is NOT Set.
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: The ALLOWED_WEAK_CERT_ALGORITHMS setting determines whether Oracle accepts certificates signed with the SHA1
    or MD5 or both algorithms.
  rationale: Weak algorithms such as MD5 and SHA1 have known vulnerabilities that make them susceptible to attacks. Allowing
    their use can compromise data integrity and authentication, potentially exposing systems to risks. Transitioning to stronger
    algorithms, such as SHA-2, is recommended.
  impact: Applications that use MD5 or SHA-1-signed certificates must be updated to use certificates signed with a stronger,
    more secure algorithm such as SHA-2.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/netrf/parametersfor-the-sqlnet.ora.html#GUID-84DC4C50-A550-4770-9210-1EECB4B5DB27
  - 2. https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/databasesecurity-guide.pdf
  page_start: 28
  audit_raw: "To audit this recommendation:\nOn the Linux platform, execute the following shell command to audit this\nrecommendation.\n\
    filePath=\"$ORACLE_HOME/network/admin/listener.ora\"\nif grep -qi \"^\\s*ALLOWED_WEAK_CERT_ALGORITHMS\\s*=\\s*(NONE)\\\
    s*$\" \"$filePath\";\nthen\n  # This is compliant.\n  :\nelif grep -qi \"^#.*ALLOWED_WEAK_CERT_ALGORITHMS\" \"$filePath\"\
    ; then\n  echo \"The parameter is commented out.\"\nelif grep -qi \"^\\s*ALLOWED_WEAK_CERT_ALGORITHMS\" \"$filePath\"\
    ; then\n  grep -i \"^\\s*ALLOWED_WEAK_CERT_ALGORITHMS\" \"$filePath\"\nelse\n  echo \"The parameter is not found in the\
    \ file.\"\nfi\nOn the Windows platform, execute the following command to audit this\nrecommendation.\n$filePath = \"$Env:ORACLE_HOME\\\
    network\\admin\\listener.ora\"\n$content = Get-Content $filePath\n$lineFound = $false\nforeach ($line in $content) {\n\
    \  $line = $line.Trim()\n  if ($line -match \"(?i)^ALLOWED_WEAK_CERT_ALGORITHMS\") {\n    $lineFound = $true\n    if ($line\
    \ -match \"(?i)^ALLOWED_WEAK_CERT_ALGORITHMS\\s*=\\s*\\(NONE\\)\\s*$\")\n{\n      # This is compliant.\n    } else {\n\
    \      Write-Host $line\n    }\n  }\n}\nif (!$lineFound) {\n  Write-Host \"The setting is not found in the file.\"\n}\n\
    To be compliant with this recommendation, the output of this command should be NULL.\nLack of results indicates compliance.\n\
    The audit command above assumes that listener.ora is located in the default path\n$ORACLE_HOME/network/admin/listener.ora.\
    \ If this is not the case, please specify\nthe correct location. For example, you may be using the TNS_ADMIN environment\n\
    variable to point to the location of SQLNET.ORA and TNSNAMES.ORA."
  remediation: 'To remediate this recommendation, set the ALLOWED_WEAK_CERT_ALGORITHMS

    parameter to NONE.'
  checks:
  - type: command
    command: grep -i "^\s*ALLOWED_WEAK_CERT_ALGORITHMS" "$filePath"
    expected: ''
    severity: medium
    info: "To audit this recommendation:\nOn the Linux platform, execute the following shell command to audit this\nrecommendation.\n\
      filePath=\"$ORACLE_HOME/network/admin/listener.ora\"\nif grep -qi \"^\\s*ALLOWED_WEAK_CERT_ALGORITHMS\\s*=\\s*(NONE)\\\
      s*$\" \"$filePath\";\nthen\n  # This is compliant.\n  :\nelif grep -qi \"^#.*ALLOWED_WEAK_CERT_ALGORITHMS\" \"$filePath\"\
      ; then\n  echo \"The parameter is commented out.\"\nelif grep -qi"
