  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: The SQLNET.ENCRYPTION_TYPES_CLIENT parameter specifies the encryption algorithms that the client can use for
    database connections. This setting allows you to ensure that all data transmitted between the client and the database
    is encrypted using strong, secure algorithms.
  rationale: Limiting the client to use only strong encryption algorithms helps to protect data integrity and confidentiality
    during transit. Using stronger algorithms reduces the risk of interception or tampering by unauthorized parties.
