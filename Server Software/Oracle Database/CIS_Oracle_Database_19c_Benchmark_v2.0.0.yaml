- id: 2.2.6
  title: Ensure 'SQLNET.ENCRYPTION_CLIENT Is Set To 'REQUIRED'
  scoring: scored
  profile:
  - Level 1 - RDBMS On Host OS
  description: The SQLNET.ENCRYPTION_CLIENT parameter determines whether the client side of a database connection enforces
    network encryption. When set to REQUIRED, this parameter mandates that all data transmitted between the client and the
    database is encrypted, preventing the client from connecting if encryption cannot be established. This setting ensures
    that sensitive data remains protected during transmission. If you are using TLS, this is not a required check. Oracle
    database network encryption configured through TLS/SSL is also an acceptable mechanism and may be implemented in lieu
    of this setting.
  rationale: Network encryption is crucial for safeguarding data transmitted over networks. Without encryption, data, including
    sensitive information like credentials, financial data, and personal details, is vulnerable to interception and potential
    compromise. Setting SQLNET.ENCRYPTION_CLIENT to REQUIRED ensures that all client connections to the database use encryption,
    aligning with best practices for data protection and regulatory compliance requirements.
  impact: Clients or applications that do not support encryption will NOT be able to connect to the database, which may necessitate
    updates to older client configurations.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/netrf/parametersfor-the-sqlnet.ora.html#GUID-F4A86AFC-4600-405F-88E7-DC79213FEC19
