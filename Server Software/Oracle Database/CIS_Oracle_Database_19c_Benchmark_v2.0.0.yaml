    \ $filePath\n$lineFound = $false\nforeach ($line in $content) {\n  $line = $line.Trim()\n  if ($line -match \"(?i)^SQLNET\\\
    .CRYPTO_CHECKSUM_SERVER\") {\n    $lineFound = $true\n    if ($line -match \"(?i)^SQLNET\\.CRYPTO_CHECKSUM_SERVER\\s*=\\\
    s*REQUIRED$\") {\n      # This is compliant.\n    } else {\n      Write-Host $line\n    }\n  }\n}\nif (!$lineFound) {\n\
    \  Write-Host \"The setting is not found in the file.\"\n}\nIf the output shows FALSE or NONE, the control is not configured\
