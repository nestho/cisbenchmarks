  - 2. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/CREATEPROFILE.html#d387296e891
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/dbseg/configuring-authentication.html#GUID-00632C9C-5C014C8F-A4D0-5E575502A6AE
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/dbseg/configuring-authentication.html#GUID-00632C9C-5C014C8F-A4D0-5E575502A6AE
