  profile:
  - Level 1 - RDBMS
  description: A directory object specifies an alias for a directory on the server file system where external files and data
    are located.
  rationale: Unauthorized users with access to these directories can perform actions at the operating system level that bypass
    normal security controls, potentially leading to data breaches, tampering, or destruction.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/CREATEDIRECTORY.html
  page_start: 228
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nSELECT CON_ID_TO_CON_NAME(C.CON_ID) AS\
    \ CONTAINERNAME,O.ORACLE_MAINTAINED, C.*\nFROM CDB_EXTERNAL_TABLES C\nJOIN CDB_OBJECTS O\n     ON C.CON_ID = O.CON_ID\
    \ AND C.OWNER=O.OWNER\n     AND O.OBJECT_NAME=C.TABLE_NAME\n     AND O.OBJECT_TYPE='TABLE';\nThe flag oracle_maintained='N'\
    \ indicates whether the directory object was created\nby Oracle or someone else.\nThe non-Oracle objects should be checked\
    \ carefully for possible problems."
  remediation: 'Delete directories that are no longer required

    DROP DIRECTORY <DIRECTORY_NAME>;'
  checks:
  - type: sql
    command: SELECT CON_ID_TO_CON_NAME(C.CON_ID) AS CONTAINERNAME,O.ORACLE_MAINTAINED, C.*
    severity: medium
    info: "To assess this recommendation, execute the following SQL statement.\nSELECT CON_ID_TO_CON_NAME(C.CON_ID) AS CONTAINERNAME,O.ORACLE_MAINTAINED,\
      \ C.*\nFROM CDB_EXTERNAL_TABLES C\nJOIN CDB_OBJECTS O\n     ON C.CON_ID = O.CON_ID AND C.OWNER=O.OWNER\n     AND O.OBJECT_NAME=C.TABLE_NAME\n\
      \     AND O.OBJECT_TYPE='TABLE';\nThe flag oracle_maintained='N' indicates whether the directory object was created\n\
      by Oracle "
