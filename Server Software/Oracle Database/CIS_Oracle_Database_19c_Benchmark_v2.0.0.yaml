- id: 5.1.1
  title: Ensure All Auditable System Actions Commands Are Audited
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: 'Oracle defines (*) the various command categories such as DDL, DML, TCL, etc. partly deviating from the ANSI
    standard. However, these command categories are incomplete and only represent a part of the auditable commands. For this
    reason, the term “Auditable System Actions” is used in the following. This type of definition allows a flexible and future-oriented
    possibility to add new commands and commands that will be added to future patch sets. According to the Oracle definition*
    of Data Definition Language (DDL) statements, these tasks can be performed by definition: • Create, modify and delete
    schema obje • Granting and revoking privileges and roles • Analyze information about a table, index or cluster • Setting
    up auditing options • Adding comments to the data dictionary https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Types-ofSQL-Statements.html
    Enabling this unified action audit causes logging of all DDL commands, whether successful or unsuccessful, issued by the
    users regardless of the privileges held by the users to issue such statements.'
  rationale: Logging and monitoring of all attempts to perform these DDL commands, whether successful or unsuccessful, may
    provide clues and forensic evidence about potential suspicious/unauthorized activities. Any such activities may be a cause
    for further investigation. In addition, organization security policies and industry/government regulations may require
    logging of all activities involving these DDL commands.
  impact: Auditing all DDL can result in rapid growth of the audit trail, particularly in active or dynamic environments.
    This may lead to storage management challenges and require regular maintenance (e.g., purging or archiving old audit records).
    The audit trail may consume excessive space, leading to issues such as system slowdowns or errors when storage limits
    are reached if it is not carefully managed.
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/Types-ofSQL-Statements.html#GUID-FD9A8CB4-6B9A-44E5-B114-EFB8DA76FC88
  - 2. https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/AUDITUnified-Auditing.html
  page_start: 125
  audit_raw: "To assess this recommendation, execute the following SQL statement:\nWITH PRIVS(PRIVILEGE) AS (\nSELECT DISTINCT\
    \ A.PRIVILEGE AS NAME FROM DBA_SYS_PRIVS A\n    WHERE A.PRIVILEGE NOT IN (SELECT NAME FROM AUDITABLE_SYSTEM_ACTIONS WHERE\n\
    COMPONENT='Standard')\n    AND PRIVILEGE NOT IN ('INHERIT ANY PRIVILEGES')\n    UNION\n    SELECT A.NAME FROM AUDITABLE_SYSTEM_ACTIONS\
    \ A\n    WHERE COMPONENT='Standard'\n    AND A.NAME NOT IN\n('ALL','SELECT','DELETE','INSERT','UPDATE','EXECUTE','LOGON','LOGOFF')\n\
    ),\nCIS_AUDIT(CONTAINERNAME, CON_ID, AUDIT_OPTION) AS(\nSELECT C.NAME, C.CON_ID, LL.PRIVILEGE FROM V$CONTAINERS C, PRIVS\
    \ LL\nWHERE C.OPEN_MODE='READ WRITE'\n),\nAUDIT_ENABLED AS\n( SELECT DISTINCT AUD.CON_ID, AUDIT_OPTION\n  FROM CONTAINERS(AUDIT_UNIFIED_POLICIES)\
    \ AUD\n  WHERE AUD.AUDIT_OPTION IN (SELECT PRIVILEGE FROM PRIVS )\n       AND AUD.AUDIT_OPTION_TYPE IN ('SYSTEM PRIVILEGE','STANDARD\
    \ ACTION')\n       AND EXISTS (SELECT ENABLED.*\n                   FROM CONTAINERS(AUDIT_UNIFIED_ENABLED_POLICIES) ENABLED\n\
    \                   WHERE ENABLED.SUCCESS = 'YES'\n                       AND ENABLED.FAILURE = 'YES'\n              \
    \         AND ENABLED.ENABLED_OPTION = 'BY USER'\n                       AND ENABLED.ENTITY_NAME = 'ALL USERS'\n     \
    \                  AND ENABLED.POLICY_NAME = AUD.POLICY_NAME\n                       AND ENABLED.CON_ID = AUD.CON_ID)\n\
    )\nSELECT C.CONTAINERNAME, C.AUDIT_OPTION\nFROM CIS_AUDIT C\nWHERE NOT EXISTS (\n  SELECT 1 FROM AUDIT_ENABLED E WHERE\
    \ E.AUDIT_OPTION = C.AUDIT_OPTION AND\nE.CON_ID = C.CON_ID\n)\nORDER BY 1, 2;\nLack of results implies compliance."
  remediation: 'Execute the following SQL statement to remediate this recommendation:

    ALTER AUDIT POLICY CIS_LOCAL_SYSTEM_ACTIONS

    ADD

    ACTIONS

    <DDL>;

    or

    ALTER AUDIT POLICY CIS_LOCAL_SYSTEM_ACTIONS

    ADD

    PRIVILEGES

    <DDL>;

    Note: If you do not have CIS_CDB_DDL_ACTIONS or CIS_PDB_DDL_ACTIONS policy,

    please create one using the CREATE AUDIT POLICY statement. Refer to Section 8.1

    where a PL/SQL block is provided to help create or modify the audit policy to remediate

    this item in both container and pluggable database.'
  checks:
  - type: sql
    command: SELECT DISTINCT A.PRIVILEGE AS NAME FROM DBA_SYS_PRIVS A
    severity: medium
    info: "To assess this recommendation, execute the following SQL statement:\nWITH PRIVS(PRIVILEGE) AS (\nSELECT DISTINCT\
      \ A.PRIVILEGE AS NAME FROM DBA_SYS_PRIVS A\n    WHERE A.PRIVILEGE NOT IN (SELECT NAME FROM AUDITABLE_SYSTEM_ACTIONS\
      \ WHERE\nCOMPONENT='Standard')\n    AND PRIVILEGE NOT IN ('INHERIT ANY PRIVILEGES')\n    UNION\n    SELECT A.NAME FROM\
      \ AUDITABLE_SYSTEM_ACTIONS A\n    WHERE COMPONENT='Standard'\n    A"
- id: 5.1.2
  title: Ensure the 'LOGON' AND 'LOGOFF' Actions Audit Is Enabled
  scoring: scored
  profile:
  - Level 1 - RDBMS
  description: Oracle database users log on to the database to perform their work. Enabling this unified audit causes logging
    of all LOGON actions, whether successful or unsuccessful, issued by the users regardless of the privileges held by the
    users to log into the database. In addition, LOGOFF and LOGOFF BY CLEANUP action audit captures logoff activities. This
    audit action also captures logon/logoff to the open database by SYSDBA and SYSOPER.
  rationale: Logging and monitoring of all attempts to logon to the database, whether successful or unsuccessful, may provide
    forensic evidence about potential suspicious/unauthorized activities. Any such activities may be a cause for further investigation.
    In addition, organization security policies and industry/government regulations may require logging of all user activities
    involving LOGON, LOGOFF and LOGOFF BY CLEANUP.
  impact: ''
  references: []
  page_start: 128
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nWITH\nCIS_AUDIT(CONTAINERNAME, CON_ID,\
    \ AUDIT_OPTION) AS(\nSELECT C.NAME, C.CON_ID, LL.COLUMN_VALUE AS AUDIT_OPTION FROM V$CONTAINERS C,\nTABLE(DBMSOUTPUT_LINESARRAY('LOGON','LOGOFF'))\
    \ LL\nWHERE C.OPEN_MODE='READ WRITE'\n),\nAUDIT_ENABLED AS\n( SELECT DISTINCT AUD.CON_ID, AUDIT_OPTION\n  FROM CONTAINERS(AUDIT_UNIFIED_POLICIES)\
    \ AUD\n  WHERE AUD.AUDIT_OPTION IN ('LOGON','LOGOFF')\n       AND AUD.AUDIT_OPTION_TYPE = 'STANDARD ACTION'\n       AND\
    \ EXISTS (SELECT ENABLED.*\n                   FROM CONTAINERS(AUDIT_UNIFIED_ENABLED_POLICIES) ENABLED\n             \
    \      WHERE ENABLED.SUCCESS = 'YES'\n                       AND ENABLED.FAILURE = 'YES'\n                       AND ENABLED.ENABLED_OPTION\
    \ = 'BY USER'\n                       AND ENABLED.ENTITY_NAME = 'ALL USERS'\n                       AND ENABLED.POLICY_NAME\
    \ = AUD.POLICY_NAME\n                       AND ENABLED.CON_ID = AUD.CON_ID)\n)\nSELECT C.CONTAINERNAME, C.AUDIT_OPTION\n\
    FROM CIS_AUDIT C\nWHERE NOT EXISTS (\n  SELECT 1 FROM AUDIT_ENABLED E WHERE E.AUDIT_OPTION = C.AUDIT_OPTION AND\nE.CON_ID\
    \ = C.CON_ID\n)\nORDER BY 1, 2;\nLack of results implies compliance."
  remediation: 'Execute the following SQL statement to remediate this setting.

    Run the following query in the CDB and in each PDB:

    CREATE AUDIT POLICY CIS_CDB_LOGON_LOGOFF

    ACTIONS

    LOGON, LOGOFF

    ACTIONS

    COMPONENT=PROTOCOL HTTP, FTP, AUTHENTICATION;

    AUDIT POLICY CIS_CDB_LOGON_LOGOFF;

    Note: If you do not have CIS_CDB_LOGON_LOGOFF, please create one using the CREATE

    AUDIT POLICY statement. Refer to Section 8.2 where a PL/SQL block is provided to

    help create or modify the audit policy to remediate this item in both container and

    pluggable database.'
  checks:
  - type: sql
