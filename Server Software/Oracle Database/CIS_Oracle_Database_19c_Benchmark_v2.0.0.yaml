  - 1. https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/keepingyour-oracle-database-secure.html#GUID-1574C821-528C-4874-AD6B92762DBEB400
  page_start: 161
  audit_raw: "System privileges in Oracle can be granted directly to users or roles, and can also be\ninherited through role\
    \ hierarchies, either directly or recursively. To remediate and\nrevoke system privileges from unauthorized users or roles,\
    \ it is essential to trace the\nchain of privilege grants by examining the Granted Privilege and How Granted columns.\n\
    This query will also give you the name of the CDB/PDB that has the issue. To assess\nthis recommendation, execute the\
    \ following SQL statement.\nWITH GRANTEES_NOT_ORACLEMAINTAINED AS (\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID) AS\
    \ CONTAINERNAME, ROLE AS\nGRANTEE FROM CDB_ROLES WHERE ORACLE_MAINTAINED = 'N'\n    UNION\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID)\
    \ AS CONTAINERNAME, USERNAME AS\nGRANTEE FROM CDB_USERS WHERE ORACLE_MAINTAINED = 'N'\n),\nDIRECT_PRIVS AS (\n    SELECT\
    \ DISTINCT CON_ID_TO_CON_NAME(CON_ID) AS CONTAINERNAME, GRANTEE,\nPRIVILEGE AS GRANTED_PRIVILEGE, 'Direct Grant' AS HOW_GRANTED\n\
    \    FROM CDB_SYS_PRIVS\n    WHERE PRIVILEGE IN ('CREATE LIBRARY')\n),\nINDIRECT_PRIVS AS (\n    SELECT DISTINCT CON_ID_TO_CON_NAME(CON_ID)\
    \ AS CONTAINERNAME, GRANTEE,\nGRANTED_ROLE AS GRANTED_PRIVILEGE, 'Privileges Through Role' AS HOW_GRANTED\n    FROM CDB_ROLE_PRIVS\n\
    \    START WITH GRANTED_ROLE IN ( SELECT DISTINCT P.GRANTEE FROM\nSYS.CDB_SYS_PRIVS P, SYS.CDB_ROLES R WHERE P.PRIVILEGE\
    \ IN ('CREATE LIBRARY')\nAND P.GRANTEE = R.ROLE) CONNECT BY PRIOR GRANTEE = GRANTED_ROLE\n)\nSELECT CONTAINERNAME, GRANTEE,\
    \ GRANTED_PRIVILEGE, HOW_GRANTED\nFROM (\n    SELECT * FROM DIRECT_PRIVS\n    UNION\n    SELECT * FROM INDIRECT_PRIVS\n\
    ) COMBINED_PRIVS\nWHERE\n    GRANTEE IN (SELECT GRANTEE FROM GRANTEES_NOT_ORACLEMAINTAINED)\nORDER BY CONTAINERNAME, GRANTEE,\
    \ GRANTED_PRIVILEGE;\nLack of results implies compliance."
