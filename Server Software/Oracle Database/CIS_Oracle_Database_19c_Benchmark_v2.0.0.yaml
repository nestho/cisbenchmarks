    in the case of FILE datastore and an arbitrary URL in the case of URL datastore and is not recommended. If an unauthorized
    user creates a public database link, all users in the database can use it to connect to the remote database. This can
    lead to data exposure and unauthorized access to sensitive information. Likewise, if an unauthorized user modifies or
    drops a public database link, this can result in pointing an existing database link to a malicious remote database, queries
    could return manipulated or incorrect data, leading to data corruption.
