- id: 6.5.1
  title: Ensure ‘DBA_COL_PRIVS’ Is Revoked From Unauthorized 'GRANTEE'
  scoring: manual
  profile:
  - Level 1 - RDBMS
  description: The DBA_COL_PRIVS view provides DBAs a view to manage all column level privileges granted to users and roles.
  rationale: Granting DBA_COL_PRIVS privileges to unauthorized users increases the risk of data breaches, unauthorized modifications,
    and privilege escalation attacks. Access to this should be limited to authorized DBAs.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/database/oracle/oracledatabase/19/refrn/DBA_COL_PRIVS.html
  page_start: 212
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

    SELECT CON_ID_TO_CON_NAME(C.CON_ID) AS CONTAINERNAME,O.ORACLE_MAINTAINED, C.*

    FROM CDB_COL_PRIVS C

    JOIN CDB_OBJECTS O ON C.CON_ID = O.CON_ID AND C.OWNER=O.OWNER

    AND O.OBJECT_NAME=C.TABLE_NAME AND O.ORACLE_MAINTAINED=''N'';

    If any unauthorized users are granted DBA_COL_PRIVS, this is a fail.'
  remediation: 'To remediate this recommendation, execute the following SQL statement.

    REVOKE UPDATE ON <TABLE> FROM <grantee>;'
  checks:
  - type: sql
    command: SELECT CON_ID_TO_CON_NAME(C.CON_ID) AS CONTAINERNAME,O.ORACLE_MAINTAINED, C.*
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT CON_ID_TO_CON_NAME(C.CON_ID) AS CONTAINERNAME,O.ORACLE_MAINTAINED, C.*

      FROM CDB_COL_PRIVS C

      JOIN CDB_OBJECTS O ON C.CON_ID = O.CON_ID AND C.OWNER=O.OWNER

      AND O.OBJECT_NAME=C.TABLE_NAME AND O.ORACLE_MAINTAINED=''N'';

