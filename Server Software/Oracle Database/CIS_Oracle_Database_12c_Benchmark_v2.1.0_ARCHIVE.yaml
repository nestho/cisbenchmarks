- id: 2.2.18
  title: Ensure 'RESOURCE_LIMIT' Is Set to 'TRUE'
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: RESOURCE_LIMIT determines whether resource limits are enforced in database profiles. This setting should have
    a value of TRUE. The FAILED_LOGIN_ATTEMPTS setting determines how many failed login attempts are permitted before the
    system locks the user's account. While different profiles can have different and more restrictive settings, such as USERS
    and APPS, the minimum(s) recommended here should be set on the DEFAULT profile. The PASSWORD_LOCK_TIME setting determines
    how many days must pass for the user's account to be unlocked after the set number of failed login attempts has occurred.
    The suggested value for this is one day or greater. The PASSWORD_LIFE_TIME setting determines how long a password may
    be used before the user is required to be change it. The suggested value for this is 90 days or less. The PASSWORD_REUSE_MAX
    setting determines how many different passwords must be used before the user is allowed to reuse a prior password. The
    suggested value for this is 20 passwords or greater. The PASSWORD_REUSE_TIME setting determines the amount of time in
    days that must pass before the same password may be reused. The suggested value for this is 365 days or greater. The PASSWORD_GRACE_TIME
    setting determines how many days can pass after the user's password expires before the user's login capability is automatically
    locked out. The suggested value for this is five days or less. The password='EXTERNAL' setting determines whether or not
    a user can be authenticated by a remote OS to allow access to the database with full authorization. This setting should
    not be used. The PASSWORD_VERIFY_FUNCTION determines password settings requirements when a user password is changed at
    the SQL command prompt. It should be set for all profiles. Note that this setting does not apply for users managed by
    the Oracle password file. The SESSIONS_PER_USER setting determines the maximum number of user sessions that are allowed
    to be open concurrently. The suggested value for this is 10 or less. Upon creation database users are assigned to the
    DEFAULT profile unless otherwise specified. No users should be assigned to that profile.
  rationale: If RESOURCE_LIMIT is set to FALSE, none of the system resource limits that are set in any database profiles are
    enforced. If RESOURCE_LIMIT is set to TRUE, the limits set in database profiles are enforced. Repeated failed login attempts
    can indicate the initiation of a brute-force login attack, this value should be set according to the needs of the organization.
    (See the Notes for a warning on a known bug that can make this security measure backfire.) Locking the user account after
    repeated failed login attempts can block further brute-force login attacks, but can create administrative headaches as
    this account unlocking process always requires DBA intervention. Allowing passwords to remain unchanged for long periods
    makes the success of bruteforce login attacks more likely. Allowing reuse of a password within a short period of time
    after the password's initial use can make the success of both social-engineering and brute-force password-based attacks
    more likely. Reusing the same password after only a short period of time has passed makes the success of brute-force login
    attacks more likely. Locking the user account after the expiration of the password change requirement's grace period can
    help prevent password-based attacks against any forgotten or disused accounts, while still allowing the account and its
    information to be accessible by DBA intervention. Allowing remote OS authentication of a user to the database can potentially
    allow supposed "privileged users" to connect as "authenticated," even when the remote system is compromised. Requiring
    users to apply the 12c security features in password creation, such as forcing mixed-case complexity, blocking of simple
    combinations, and enforcing change/history settings can potentially thwart logins by an unauthorized user. Limiting the
    number of the SESSIONS_PER_USER can help prevent memory resource exhaustion by poorly formed requests or intentional denial-of-service
    attacks. Users should be created with function-appropriate profiles. The DEFAULT profile, being defined by Oracle, is
    subject to change at any time (e.g. by patch or version update). The DEFAULT profile has unlimited settings that are often
    required by the SYS user when patching; such unlimited settings should be tightly reserved and not applied to unnecessary
    users.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-BB0AB177-3867-4D0D-8700A1AC8BDFEFC3.htm#REFRN10188
  page_start: 57
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nSELECT UPPER(VALUE)\nFROM V$PARAMETER\n\
    WHERE UPPER(NAME)='RESOURCE_LIMIT';\nEnsure VALUE is set to TRUE.\nTo assess this recommendation, execute the following\
    \ SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\nWHERE RESOURCE_NAME='FAILED_LOGIN_ATTEMPTS'\n\
    AND\n (\n LIMIT = 'DEFAULT'\n OR LIMIT = 'UNLIMITED'\n59 | P a g e\n OR LIMIT > 5\n );\nLack of results implies compliance.\n\
    To assess this recommendation, execute the following SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\n\
    WHERE RESOURCE_NAME='PASSWORD_LOCK_TIME'\nAND\n (\n LIMIT = 'DEFAULT'\n OR LIMIT = 'UNLIMITED'\n OR LIMIT < 1\n );\nLack\
    \ of results implies compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT PROFILE,\
    \ RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\nWHERE RESOURCE_NAME='PASSWORD_LIFE_TIME'\nAND\n (\n LIMIT = 'DEFAULT'\n OR\
    \ LIMIT = 'UNLIMITED'\n OR LIMIT > 90\n );\nLack of results implies compliance.\nTo assess this recommendation, execute\
    \ the following SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\nWHERE RESOURCE_NAME='PASSWORD_REUSE_MAX'\n\
    AND\n (\n LIMIT = 'DEFAULT'\n OR LIMIT = 'UNLIMITED'\n OR LIMIT < 20\n );\nLack of results implies compliance.\nTo assess\
    \ this recommendation, execute the following SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\n\
    WHERE RESOURCE_NAME='PASSWORD_REUSE_TIME'\nAND\n (\n LIMIT = 'DEFAULT'\n OR LIMIT = 'UNLIMITED'\n OR LIMIT < 365\n );\n\
    Lack of results implies compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT PROFILE,\
    \ RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\nWHERE RESOURCE_NAME='PASSWORD_GRACE_TIME'\nAND\n (\n LIMIT = 'DEFAULT'\n OR\
    \ LIMIT = 'UNLIMITED'\n OR LIMIT > 5\n );\nLack of results implies compliance.\nTo assess this recommendation, execute\
    \ the following SQL statement.\nSELECT USERNAME\nFROM DBA_USERS\nWHERE PASSWORD='EXTERNAL';\nLack of results implies compliance.\n\
    To assess this recommendation, execute the following SQL statement.\nSELECT PROFILE, RESOURCE_NAME\nFROM DBA_PROFILES\n\
    WHERE RESOURCE_NAME='PASSWORD_VERIFY_FUNCTION'\nAND (LIMIT = 'DEFAULT' OR LIMIT = 'NULL');\nLack of results implies compliance.\n\
    To assess this recommendation, execute the following SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\n\
    WHERE RESOURCE_NAME='SESSIONS_PER_USER'\nAND\n  (\n    LIMIT = 'DEFAULT'\n    OR LIMIT = 'UNLIMITED'\n    OR LIMIT > 10\n\
    \  );\nLack of results implies compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT\
    \ USERNAME\nFROM DBA_USERS\nWHERE PROFILE='DEFAULT'\nAND ACCOUNT_STATUS='OPEN'\nAND USERNAME NOT IN\n  ('ANONYMOUS', 'CTXSYS',\
    \   'DBSNMP', 'EXFSYS', 'LBACSYS',\n   'MDSYS',     'MGMT_VIEW','OLAPSYS','OWBSYS', 'ORDPLUGINS',\n   'ORDSYS',    'OUTLN',\
    \    'SI_INFORMTN_SCHEMA','SYS',\n   'SYSMAN',    'SYSTEM',   'TSMSYS', 'WK_TEST', 'WKSYS',\n   'WKPROXY',   'WMSYS',\
    \    'XDB', 'CISSCAN');\nLack of results implies compliance."
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET RESOURCE_LIMIT = TRUE SCOPE = SPFILE;

    Remediate this setting by executing the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT FAILED_LOGIN_ATTEMPTS 5;

    Notes:

    Warning: One great concern with the above is the possibility of this setting being exploited

    to craft a DDoS attack by using the row-locking delay between failed login attempts (see

    _Oracle Bug 7715339 – Logon failures causes “row cache lock” waits – Allow disable of

    logon delay [ID 7715339.8], so the configuration of this setting depends on using the bug

    workaround). Also, while the setting for the FAILED_LOGIN_ATTEMPTS value can also be set

    in sqlnet.ora, this only applies to listed users. The similar setting used to block a DDoS,

    the SEC_MAX_FAILED_LOGIN_ATTEMPTS initialization parameter, can be used to protect

    unauthorized intruders from attacking the server processes for applications, but this

    setting does not protect against unauthorized attempts via valid usernames.

    Remediate this setting by executing the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT PASSWORD_LOCK_TIME 1;

    61 | P a g e

    Remediate this setting by executing the following SQL statement for each PROFILE

    returned by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT PASSWORD_LIFE_TIME 90;

    Remediate this setting by executing the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT PASSWORD_REUSE_MAX 20;

    Notes:

    The above restriction should be applied along with the PASSWORD_REUSE_TIME setting.

    64 | P a g e

    Remediate this setting by executing the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT PASSWORD_REUSE_TIME 365;

    Notes:

    The above restriction should be applied along with the PASSWORD_REUSE_MAX setting.

    66 | P a g e

    Remediate this setting by executing the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT PASSWORD_GRACE_TIME 5;

    68 | P a g e

    To remediate this setting execute the following SQL statement.

    ALTER USER <username> INDENTIFIED BY <password>;

    Notes:

    The PASSWORD keyword (column) used in the SQL for prior Oracle versions has been

    deprecated from version 11.2 onward in favor of the new AUTHENTICATION_TYPE keyword

    (column) for the DBA_USERS table. However, the PASSWORD column has still been retained for

    backward compatibility.

    70 | P a g e

    Create a custom password verification function which fulfills the password requirements of

    the organization.

    To remediate this setting, execute the following SQL statement for each PROFILE returned

    by the audit procedure.

    ALTER PROFILE <profile_name> LIMIT SESSIONS_PER_USER 10;

    Notes:

    The SESSIONS_PER_USER profile management capability was created to prevent resource(s)

    exhaustion at a time when resource usage was very expensive. As current database design

    may require much higher limits on this parameter if one "user" handles all processing for

    specific types of batch/customer connections, this must be handled via a new user profile.

    73 | P a g e

    To remediate this recommendation, execute the following SQL statement for each user

    returned by the audit query using a functional-appropriate profile.

    ALTER USER <username> PROFILE <appropriate_profile>;

    75 | P a g e'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: "To assess this recommendation, execute the following SQL statement.\nSELECT UPPER(VALUE)\nFROM V$PARAMETER\nWHERE\
      \ UPPER(NAME)='RESOURCE_LIMIT';\nEnsure VALUE is set to TRUE.\nTo assess this recommendation, execute the following\
      \ SQL statement.\nSELECT PROFILE, RESOURCE_NAME, LIMIT\nFROM DBA_PROFILES\nWHERE RESOURCE_NAME='FAILED_LOGIN_ATTEMPTS'\n\
      AND\n (\n LIMIT = 'DEFAULT'\n OR LIMIT = 'UNLIMITED'\n59 | P a g e\n"
