  - Level 1 - RDBMS using Unified Auditing
  description: The Oracle database SYS.AUD$ table contains all the audit records for the database of the non-Data Manipulation
    Language (DML) events, such as ALTER, DROP, and CREATE, and so forth. (DML changes need trigger-based audit events to
