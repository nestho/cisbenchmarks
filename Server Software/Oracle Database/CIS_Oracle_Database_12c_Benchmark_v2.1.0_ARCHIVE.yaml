    Ensure VALUE is set to FALSE.'
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET OS_ROLES = FALSE SCOPE = SPFILE;'
  checks:
  - type: sql
    command: SELECT UPPER(VALUE)
    severity: medium
    info: 'To assess this recommendation, execute the following SQL statement.

      SELECT UPPER(VALUE)

      FROM V$PARAMETER

      WHERE UPPER(NAME)=''OS_ROLES'';

      Ensure VALUE is set to FALSE.'
- id: 2.2.6
  title: Ensure 'REMOTE_LISTENER' Is Empty
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: The remote_listener setting determines whether or not a valid listener can be established on a system separate
    from the database instance. This setting should be empty unless the organization specifically needs a valid listener on
    a separate system.
  rationale: Permitting a remote listener for connections to the database instance can allow for the potential spoofing of
    connections and that could compromise data confidentiality and integrity.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/REFRN/GUID-FEE2E8B5-CE02-4158-A6B4030E59316756.htm#REFRN10183
  page_start: 38
  audit_raw: 'To assess this recommendation, execute the following SQL statement.

