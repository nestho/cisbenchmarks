    WHERE UPPER(NAME)=''REMOTE_LISTENER'';

    Ensure VALUE is empty.'
  remediation: 'To remediate this setting, execute the following SQL statement.

    ALTER SYSTEM SET REMOTE_LISTENER = '''' SCOPE = SPFILE;'
  checks:
