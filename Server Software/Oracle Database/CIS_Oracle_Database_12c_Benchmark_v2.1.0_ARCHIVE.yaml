- id: 4.5.7
  title: Ensure 'SYS.USER$MIG' Has Been Dropped
  scoring: scored
  profile:
  - Level 1 - RDBMS using Traditional Auditing
  - Level 1 - RDBMS using Unified Auditing
  description: The table sys.user$mig is created during migration and contains the Oracle password hashes before the migration
    starts. This table should be dropped. The Oracle database ANY keyword provides the user the capability to alter any item
    in the catalog of the database. Unauthorized grantees should not have that keyword assigned to them. The Oracle database
    WITH_ADMIN privilege allows the designated user to grant another user the same privileges. Unauthorized grantees should
    not have that privilege. Do not grant privileges other than CONNECT directly to proxy users. Remove unneeded EXECUTE ANY
    PROCEDURE privileges from OUTLN. Remove unneeded EXECUTE ANY PROCEDURE privileges from DBSNMP.
  rationale: The table sys.user$mig is not deleted after the migration. An attacker could access the table containing the
    Oracle password hashes. Authorization to use the ANY expansion of a privilege can allow an unauthorized user to potentially
    change confidential data or damage the data catalog. Assignment of the WITH_ADMIN privilege can allow the granting of
    a restricted privilege to an unauthorized user. A proxy user should only have the ability to connect to the database or
    based on the needs of the organization. Migrated OUTLN users have more privileges than required. Migrated DBSNMP users
    have more privileges than required.
  impact: ''
  references:
  - 1. http://docs.oracle.com/database/121/DBSEG/authorization.htm#DBSEG99877
  page_start: 188
  audit_raw: "To assess this recommendation, execute the following SQL statement.\nSELECT OWNER, TABLE_NAME\nFROM ALL_TABLES\n\
    WHERE OWNER='SYS'\nAND TABLE_NAME='USER$MIG';\nLack of results implies compliance.\nTo assess this recommendation, execute\
    \ the following SQL statement.\nSELECT GRANTEE, PRIVILEGE\nFROM DBA_SYS_PRIVS\nWHERE PRIVILEGE LIKE '%ANY%'\nAND GRANTEE\
    \ NOT IN ('AQ_ADMINISTRATOR_ROLE','DBA','DBSNMP','EXFSYS',\n          'EXP_FULL_DATABASE','IMP_FULL_DATABASE',\n     \
    \     'DATAPUMP_IMP_FULL_DATABASE','JAVADEBUGPRIV','MDSYS',\n          'OEM_MONITOR','OLAPSYS','OLAP_DBA','ORACLE_OCM','OWB$CLIENT',\n\
    \          'OWBSYS','SCHEDULER_ADMIN','SPATIAL_CSW_ADMIN_USR',\n          'SPATIAL_WFS_ADMIN_USR','SYS','SYSMAN','SYSTEM','WMSYS',\n\
    \          'APEX_030200','APEX_040000','APEX_040100','APEX_040200','LBACSYS',\n          'SYSBACKUP','CTXSYS','OUTLN','DVSYS','ORDPLUGINS','ORDSYS',\n\
    \          'RECOVERY_CATALOG_OWNER_VPD','GSMADMIN_INTERNAL','XDB','SYSDG',\n          'AUDIT_ADMIN','DV_OWNER','DV_REALM_OWNER','EM_EXPRESS_ALL',\n\
    \          'RECOVERY_CATALOG_OWNER','APEX_050000','SYSMAN_STB',\n          'SYSMAN_TYPES');\nLack of results implies compliance.\n\
    To assess this recommendation, execute the following SQL statement.\nSELECT GRANTEE, PRIVILEGE\nFROM DBA_SYS_PRIVS\nWHERE\
    \ ADMIN_OPTION='YES'\nAND GRANTEE not in ('AQ_ADMINISTRATOR_ROLE','DBA','OWBSYS',\n                    'SCHEDULER_ADMIN','SYS','SYSTEM','WMSYS',\n\
    \                    'DVSYS','SYSKM','DV_ACCTMGR')\nAND NOT REGEXP_LIKE(grantee,'^APEX_0[3-9][0-9][0-9][0-9][0-9]$');\n\
    Lack of results implies compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT GRANTEE,GRANTED_ROLE\
    \ FROM DBA_ROLE_PRIVS WHERE GRANTEE IN (SELECT PROXY FROM\nDBA_PROXIES) AND GRANTED_ROLE NOT IN ('CONNECT')\nUNION\nSELECT\
    \ GRANTEE,PRIVILEGE FROM DBA_SYS_PRIVS WHERE GRANTEE IN (SELECT PROXY\nFROM DBA_PROXIES) AND PRIVILEGE NOT IN ('CREATE\
    \ SESSION')\nUNION\nSELECT GRANTEE,PRIVILEGE FROM DBA_TAB_PRIVS WHERE GRANTEE IN (SELECT PROXY\nFROM DBA_PROXIES);\nLack\
    \ of results implies compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT GRANTEE,\
    \ PRIVILEGE\nFROM DBA_SYS_PRIVS\nWHERE PRIVILEGE='EXECUTE ANY PROCEDURE'\nAND GRANTEE='OUTLN';\nLack of results implies\
    \ compliance.\nTo assess this recommendation, execute the following SQL statement.\nSELECT GRANTEE, PRIVILEGE\nFROM DBA_SYS_PRIVS\n\
    WHERE PRIVILEGE='EXECUTE ANY PROCEDURE'\nAND GRANTEE='DBSNMP';\nLack of results implies compliance."
  remediation: 'To remediate this setting, execute the following SQL statement.

    DROP TABLE SYS.USER$MIG;

    To remediate this setting, execute the following SQL statement.

    REVOKE ‘<ANY Privilege>’ FROM <grantee>;

    189 | P a g e

    To remediate this setting, execute the following SQL statement.

    REVOKE <privilege> FROM <grantee>;

    To remediate this setting execute the following SQL statement for each [PRIVILEGE]

    returned (other than CONNECT) by running the audit procedure.

    REVOKE <privilege> FROM <proxy_user>;

    To remediate this setting, execute the following SQL statement.

    REVOKE EXECUTE ANY PROCEDURE FROM OUTLN;

    To remediate this setting, execute the following SQL statement.

    REVOKE EXECUTE ANY PROCEDURE FROM DBSNMP;'
  checks:
  - type: sql
    command: SELECT OWNER, TABLE_NAME
    severity: medium
