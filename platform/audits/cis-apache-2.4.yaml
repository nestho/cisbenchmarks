benchmark:
  id: cis-apache-2.4
  title: CIS Apache HTTP Server 2.4 Benchmark
  version: 1.3.1
  technology: Apache HTTP Server
  os: Linux

controls:
  - id: 2.2
    title: Enable the Log Config Module
    scoring: scored
    profile: [level1, level2]
    checks:
      - type: command
        command: "apachectl -M 2>/dev/null | grep -i log_config"
        expected: "log_config_module"
        regex: "log_config_module"
        severity: medium
  - id: 8.1
    title: Set ServerToken to 'Prod'
    scoring: scored
    profile: [level1, level2]
    checks:
      - type: file
        path: /etc/httpd/conf/httpd.conf
        contains: "ServerTokens Prod"
        severity: medium
    remediation: "Set ServerTokens Prod in httpd.conf and restart."
