version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oc
      POSTGRES_PASSWORD: oc
      POSTGRES_DB: oc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oc
      MINIO_ROOT_PASSWORD: ocsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
