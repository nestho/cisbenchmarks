- id: 2.3.1.5
  title: Ensure "Force Enable In Setup Assistant" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: When enabled, the system will prompt for FileVault enablement during initial device setup immediately after
    MDM enrollment, ensuring early-stage disk encryption implementation. This will only apply to devices that are MDM enrolled
    before the device has been set up (or after a factory reset).
  rationale: Forcing FileVault enablement during Setup Assistant ensures that devices are encrypted from their initial deployment,
    eliminating the scenario of sensitive data being written to an unencrypted disk before encryption activation. This also
    reduces the likelihood of user postponement or avoidance of encryption implementation.
  impact: Devices will require slightly more time during initial setup to configure FileVault encryption.
  references: []
