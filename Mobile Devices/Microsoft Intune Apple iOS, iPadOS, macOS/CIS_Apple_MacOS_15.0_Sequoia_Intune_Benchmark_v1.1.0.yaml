  title: Ensure "Allow AirDrop" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: When enabled, AirDrop allows users to share content with nearby Apple devices without requiring network infrastructure
    or internet connectivity. AirDrop uses Bluetooth for device discovery and establishes a direct, encrypted WiFi connection
    for the actual file transfers. The service can be configured to accept transfers from contacts only or from everyone within
    range.
  rationale: Disabling AirDrop prevents unauthorized file transfers between organizational and nonorganizational devices.
    This eliminates a potential vector for malware introduction and data exfiltration that could bypass network monitoring
    and other DLP controls. When AirDrop is active, users may receive unsolicited transfer requests which could contain malicious
    content.
  impact: Users will be unable to use AirDrop for file transfer.
