- id: 2.9.1.12
  title: Ensure "Min Length" is set to "15" or more
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: When configured to "15" or more, users must create passcodes that contain at least 15 characters when setting
    or changing their device passcode.
  rationale: Shorter passcodes are more susceptible to brute force attacks and dictionary-based password cracking attempts.
    Enforcing a minimum 15-character passcode requirement exponentially increases the number of possible passcodes, making
    automated cracking methods significantly more difficult.
  impact: Users may need to adapt to using longer passphrases. This presents an opportunity to encourage the use of non-common
    passphrases that are easier to remember but harder to guess. If this policy is applied to current users, they may need
    to create new passwords on next login if their existing passcode does not meet this requirement. When setting a new password,
    if the minimum length requirement is not met, users will see that the Contain at least 15 characters condition is not
    met when prompted to enter a new passcode.
