  title: Ensure "Allow Simple Passcode" is set to "False"
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: This setting prevents the use of simple device authentication passcodes on macOS devices by disallowing passcodes
    that contain two consecutive identical characters or three sequential characters.
  rationale: Disabling simple passcodes eliminates easily predictable patterns by preventing consecutive repeating characters
    (such as "11") and sequential patterns (such as "123" or "abc"). This significantly increases the complexity of passcodes
    and enhances the security of the device against password guessing and brute force attempts.
  impact: Users will be unable to use passcodes containing any two consecutive identical characters (such as "rr" in "corridor")
    or three sequential characters (such as "abc" or "123"). This restriction applies to all parts of the passcode, which
    means many common words and conventional password patterns will be disallowed. If this policy is applied to current users,
    they may need to create new passwords on next login if their existing passcode does not meet this requirement. When setting
    a new password, if the no simple passcode requirement is not met, users will see that the ``Not have two consecutive,
    or three sequential characters``` condition is not met when prompted to enter a new passcode.
  references: []
