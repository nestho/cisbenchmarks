  title: Ensure "Removal Password" is absent or is securely configured with restricted access
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The profile removal password setting in Intune device management controls whether a local user can remove the
    management profile from a macOS device. When this setting is not configured (absent) or is configured with restricted
    access, it prevents the unauthorized removal of management profiles that enforce organizational security policies.
  rationale: If a profile removal password is set and becomes widely known, users could remove management profiles and circumvent
    organizational security policies. Either maintaining no on-device profile removal password (relying on Intune's remote
    unenrollment controls) or implementing a securely configured password with restricted access ensures that only authorized
    administrators can remove profiles when necessary.
