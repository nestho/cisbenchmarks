  title: Ensure "Allow Password Auto Fill" is set to "False"
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: Password Auto Fill is a feature in macOS that allows automatic population of stored credentials from iCloud
    Keychain or third-party password managers into Safari and apps. When enabled, the system retrieves passwords from these
    sources and offers to automatically fill them into login forms. The feature also suggests generated passwords when creating
    accounts.
  rationale: Disabling Password Auto Fill reduces the risk of unauthorized access to accounts if a device is compromised or
    left unattended. While password managers can enhance security through the use of unique, complex passwords, the auto-fill
    functionality may allow credentials to be entered without additional authentication.
  impact: The system will no longer automatically fill stored passwords or suggest passwords when creating new accounts. This
    may result in users choosing weaker passwords or reusing the same password across multiple systems if not provided with
    an alternative organizational password management solution.
