  title: Ensure "Allow ARD Remote Management Modification" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Apple Remote Desktop (ARD) Remote Management allows administrators to remotely manage Mac systems through the
    Remote Management service. The Remote Management modification setting controls whether users can modify Remote Management
    sharing settings through System Settings. When Remote Management is enabled, it opens port 5900 and allows remote connections
    based on configured permissions.
  rationale: Users with the ability to modify Remote Management settings may enable unauthorized remote access to their systems.
    Remote Management should be controlled through organizational management tools rather than allowing end-user modification.
  impact: If ARD Remote Management was disabled before policy application (system default), it will remain disabled. If ARD
    Remote Management was enabled by the user before policy application, it will remain enabled and cannot be modified by
    the user. A separate script should be deployed to ensure Remote Management is actually disabled on all systems, as this
    policy only restricts user control of the setting.
