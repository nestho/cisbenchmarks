  title: Ensure "Allow Air Play Incoming Requests" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: AirPlay is an Apple technology that allows wireless streaming of audio, video, and screen sharing between devices.
    When enabled on macOS, it allows the Mac to receive AirPlay requests and function as an AirPlay receiver, permitting other
    Apple devices to stream content to the Mac's display.
  rationale: Disabling AirPlay incoming requests prevents unauthorized devices from establishing AirPlay connections to organizational
    Macs. The feature broadcasts device presence and processes incoming connection requests, which could be leveraged for
    network reconnaissance or denial-of-service attacks. Although AirPlay connections require user approval on the receiving
    Mac, persistent connection requests may disrupt workflow, while unauthorized screen sharing could lead to exposure of
    sensitive information.
  impact: Users will not be able to use their Mac as an AirPlay receiver for other Apple devices.
  references: []
