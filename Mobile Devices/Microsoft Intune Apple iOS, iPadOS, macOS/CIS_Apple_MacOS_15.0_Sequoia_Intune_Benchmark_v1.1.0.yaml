- id: 2.3.1.2
  title: Ensure "Enable" is set to "On"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: FileVault provides full disk encryption (XTS-AES-128 with 256-bit key) for the entire system volume on macOS
    devices. This policy setting ensures FileVault encryption is enabled and enforced.
  rationale: FileVault encryption protects data at rest from unauthorized access, particularly in cases of lost or stolen
    devices. Without full disk encryption, an attacker with physical access to the device could access data via alternative
    boot methods or by removing the drive. FileVault ensures that data remains protected behind strong encryption that requires
    valid credentials to decrypt.
  impact: Enabling FileVault requires an initial encryption process that generally takes seconds on newer devices, and can
    take hours on older hardware with large disk drives. Minor system performance impact may be observed, though modern processors
    with hardware encryption support minimize this effect.
  references: []
