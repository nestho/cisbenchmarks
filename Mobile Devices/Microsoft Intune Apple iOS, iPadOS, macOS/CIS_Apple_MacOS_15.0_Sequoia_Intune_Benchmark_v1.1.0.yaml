  title: Ensure "Allow Internet Sharing Modification" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Internet Sharing allows a macOS device to share its internet connection with other devices via WiFi, Ethernet,
    or Bluetooth. This setting controls whether users can modify the Internet Sharing configuration in System Settings.
  rationale: Internet Sharing creates a network access point from the macOS device, allowing other devices to connect to and
    route through it. This functionality can circumvent network security controls by creating unauthorized network paths and
    expose the organization's network to unmanaged devices.
  impact: If Internet Sharing was disabled before policy application (system default), it will remain disabled. If Internet
    Sharing was enabled by the user before policy application, it will remain enabled and cannot be modified by the user.
    A separate script should be deployed to ensure Internet Sharing is actually disabled on all systems, as this policy only
    restricts user control of the setting.
