- id: 2.3.3.1
  title: Ensure There is a Disk Encryption FileVault Policy
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: An Intune Endpoint Security Disk Encryption policy is essential for FileVault to be a device requirement.
  rationale: If this is not set, disk encryption will not be a requirement and other FileVault policies will be ignored.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Endpoint security

    2. Select Disk encryption

    3. Select the policy which applies to macOS devices (this should be a policy with

    the policy type of MacOS Filevault)

    4. Ensure that the policy is assigned to the appropriate group of users/devices.

    5. Under Configuration settings heading

    6. Expand the Full Disk Encryption section

    7. Under the FileVault heading

    8. Verify that Defer Dont Ask At User Logout is present and set to Disabled

    9. Verify that Defer Force At User Login Max Bypass Attempts is present

    and set to 0

    10. Verify that Enable is present and set to On

    11. Verify that Recovery Key Rotation In Months is present and set to Not

    configured

    12. Verify that Defer is not present

    13. Verify that Use Recovery Key is not present'
  remediation: 'From the Microsoft Intune admin center:

    1. Select Endpoint security

    2. Select Disk encryption

    3. Select Create Policy

    4. Select MacOS for the Platform, and MacOS Filevault for the Profile, click Create

    5. Give the policy an appropriate name and description.

    6. Expand the File Disk Encryption section

    7. Under the FileVault heading

    8. Set Defer to Not Configured

    9. Set Defer Dont Ask At User Logout to Disabled

    10. Toggle Defer Force At User Login Max Bypass Attempts to Configured

    then give it a value of 0

    11. Set Enable to On

    12. Set Recovery Key Rotation In Months to Not Configured or as per

    organizational policy

    13. Set Use Recovery Key to Not Configured

    14. A Location is required before proceeding, this is a piece of information

    displayed to users in the case of a different FileVault configuration.

    15. Click Next

    16. Ensure that the policy is assigned to the appropriate group of users/devices.'
  checks:
