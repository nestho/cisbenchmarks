  title: Ensure "Allow Printer Sharing Modification" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Printer Sharing allows users to share connected printers with other devices on the network. The printer sharing
    modification setting controls whether users can enable or disable printer sharing through System Settings. When printer
    sharing is enabled, other devices can discover and connect to printers attached to the Mac.
  rationale: When printer sharing is enabled, it increases the attack surface of the device by opening network ports and services
    that could be exploited by malicious actors. Additionally, unauthorized printer sharing could potentially expose sensitive
    documents or information to others on the network.
  impact: If printer sharing was disabled before policy application (system default), it will remain disabled. If printer
    sharing was enabled by the user before policy application, it will remain enabled and cannot be modified by the user.
    A separate script should be deployed to ensure printer sharing is actually disabled on all systems, as this policy only
    restricts user control of the setting.
