- id: 2.8.23
  title: Ensure "Allow Find My Friends" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Find My Friends is a built-in macOS feature that enables device location sharing and tracking through Apple's
    Find My app. When enabled, users can share their device's real-time location with other Apple ID users and allow continuous
    location monitoring.
  rationale: Unauthorized location tracking presents significant privacy and security risks for users. If the feature is enabled,
    a malicious actor could social engineer or gain physical access, establishing location sharing to track the device's movements
    without the legitimate user's knowledge. As this feature is considered normal system behavior, detecting such surveillance
    would be difficult. Disabling this feature prevents potential covert location tracking of company devices and their users.
  impact: Disabling Find My Friends prevents users from sharing their location with contacts through the Find My app. This
    restriction does not affect other device location features such as Find My Mac that can be used for device recovery.
  references: []
