    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Under Configuration settings heading

    5. Expand the Login heading

    6. Under the Login Window Behavior subheading

    7. Verify that Show Full Name is present and set to True

    Or, from the device:

    1. Open System Settings

    2. Click General

    3. Click Device Management

    4. Double-click com.apple.loginwindow Profile

    5. Under the Details section

    6. Confirm Show Full Name is set to True'
