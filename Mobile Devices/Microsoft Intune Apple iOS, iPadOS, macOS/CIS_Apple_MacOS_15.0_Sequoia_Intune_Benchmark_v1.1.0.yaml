  title: Ensure "Allow File Sharing Modification" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: File sharing allows users to share folders and files from their Mac with other users over a network using SMB
    and other file sharing protocols. The "Allow File Sharing Modification" setting controls whether users can modify the
    file sharing configuration through System Settings. When this setting is disabled, users cannot enable or disable file
    sharing services or modify shared folder permissions.
  rationale: Preventing users from modifying file sharing settings helps organizations maintain control over network resource
    sharing. Unrestricted file sharing can lead to unauthorized data exposure, creates additional network entry points, and
    may allow sensitive data to be transferred outside organizational boundaries.
  impact: If file sharing was disabled before policy application (system default), it will remain disabled. If file sharing
    was enabled by the user before policy application, it will remain enabled and cannot be modified by the user. A separate
    script should be deployed to ensure file sharing is actually disabled on all systems, as this policy only restricts user
    control of the setting.
