- id: 2.5.1.1
  title: Ensure "Activation Lock Allowed While Supervised" is set appropriately
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: When Activation Lock is enabled, a device cannot be erased or reactivated without the associated Apple ID credentials,
    including after a factory reset. This setting does not enable Activation Lock directly, but instead controls if users
    are permitted to enable this feature through Find My.
  rationale: 'When set to Allowed: Activation Lock provides an additional security layer beyond device passcodes and FileVault
    by preventing device reactivation after factory reset. While passcodes and FileVault protect data, Activation Lock specifically
    deters device theft by making the hardware itself unusable to thieves. When set to Blocked: Ensures devices can be easily
    repurposed when users leave the organization. When passcode and FileVault are already providing data protection, Activation
    Lock may create unnecessary administrative overhead without significant additional security benefits for organization-managed
    devices.'
  impact: 'When set to Allowed: May complicate device management if users leave without removing their Apple ID. Requires
    appropriate offboarding procedures or Apple Business Manager. When set to Blocked: Removes a theft deterrent from devices.
    Organizations should implement alternative security measures to compensate.'
  references: []
