      6. Confirm Disable Guest Account is se'
    severity: medium
- id: 2.2.1
  title: Ensure "Restrict Store Software Update Only" is set to "True"
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: This setting prevents users from accessing the App Store application on managed macOS devices, while still
    allowing system software updates to be installed through the Software Update mechanism.
  rationale: Restricting access to the App Store while maintaining software update capabilities helps organizations maintain
    control over their software environment. The setting supports a controlled application deployment strategy where software
    distribution is managed through organizational channels rather than individual user installations.
  impact: Users will be unable to launch the App Store and install applications through it. Organizations must ensure they
    have alternative methods for software deployment, such as through MDM or approved software distribution channels.
  references: []
