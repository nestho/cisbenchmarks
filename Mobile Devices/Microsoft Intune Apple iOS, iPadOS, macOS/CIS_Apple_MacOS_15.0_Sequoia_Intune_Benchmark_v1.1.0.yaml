  title: Ensure "Automatic Check Enabled" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The "Automatic Check Enabled" setting controls whether macOS automatically checks for software updates. When
    set to "True", the system regularly queries Apple's update servers to identify available updates for the operating system
    and installed applications.
  rationale: Without automatic checking, systems may remain vulnerable to known exploits for extended periods as checks for
    updates would only be triggered by the user. Additionally, if 'Automatically check for updates' is not enabled, background
    updates for Apple's XProtect and Gatekeeper malware definition files will not occur. These security mechanisms are critical
    for protecting macOS against malware and require regular definition updates to remain effective against threats.
  impact: ''
  references: []
