- id: 2.9.1.7
  title: Ensure "Password Content Regex" is defined
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The "Password Content Regex" setting enforces password complexity requirements by defining a regular expression
    pattern with which passwords must comply. When configured, the system evaluates new passwords against this pattern, rejecting
    those that fail to match. This setting utilizes ICU syntax for pattern matching and can be used to prevent passwords from
    containing specific words or patterns. The provided regex pattern (?i)^(?!.*(password|cis|example)).* blocks passwords
    containing defined terms regardless of case sensitivity.
  rationale: Passwords that contain terms like company names, product names, or common industry words are significantly easier
    to guess through dictionary attacks and social engineering tactics. Implementing a content regex pattern prevents users
    from selecting passwords that include defined terms, thereby strengthening the organization's overall password security
    posture.
  impact: If this policy is applied to current users, they may need to create new passwords on next login if their existing
    passwords contain blocked terms. When setting a new password, if the regex requirement is not met, users will see that
    ProfilePayload:<ID>:customRegex condition is not met when prompted to enter a new passcode. This may cause some users
    to wonder why their password does not meet password requirements, therefore help desk staff may need to provide guidance
    to users on acceptable password patterns.
  references: []
  page_start: 183
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Under Configuration settings heading

    5. Expand the Security heading

    6. Under the Passcode subheading

    7. Verify that Password Content Regex is present and set to

    (?i)^(?!.*(password|cis|example)).* (with appropriate words being

    contained within this regex)

