- id: 2.6.1
  title: Content Caching 2.6.1.1 Ensure "Auto Activation" is set to "False"
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: Content caching stores and serves various types of content from Apple, including software updates, app store
    purchases, iCloud data, and other downloadable content to reduce internet bandwidth usage. When "Auto Activation" is enabled,
    content caching automatically activates when possible and prevents manual deactivation. This capability requires macOS
    clients to function as P2P nodes for Apple content distribution.
  rationale: P2P sharing services should not be enabled on endpoints using untrusted networks. Disabling content caching's
    auto activation reduces the attack surface by preventing automatic network service initiation. Content caching creates
    additional network connections and locally stored content, which may introduce security risks in managed environments.
  impact: Disabling auto activation will increase bandwidth usage between local subnets and the Internet as devices download
    updates, apps, and iCloud content directly from Apple's servers rather than local caches. Organizations should ensure
    adequate bandwidth is available for all Apple content and services.
  references: []
