- id: 2.9.1.10
  title: Ensure "Minutes Until Failed Login Reset" is set to "15" or more
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting determines the number of minutes that must elapse before the failed login counter is reset after
    reaching the maximum number of unsuccessful login attempts. This policy requires that the "Max Failed Attempts" policy
    is also configured, and it starts a time-based delay before additional login attempts can be processed.
  rationale: Implementing a lockout duration provides an essential control against automated and manual password guessing
    attempts.
  impact: Users who exceed the maximum failed login attempts must wait for the specified duration before attempting to authenticate
    again, even with valid credentials. During this waiting period, users may see the message Your account has been disabled.
    Contact your system administrator for more information. After the time period this message can be ignored and another
    attempt it allowed.
