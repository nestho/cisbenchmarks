- id: 2.11.3
  title: System Extensions 2.11.3.1 Ensure "Allow User Overrides" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting controls whether users can approve system extensions that aren't explicitly allowed by configuration
    profiles. System extensions are software components that extend the functionality of macOS by integrating with the kernel
    or other system services without requiring kernel extensions (kexts).
  rationale: System extensions can access sensitive system resources and function. Examples include network content filters
    that can intercept traffic, endpoint security tools that can monitor system events, and DNS proxies that can redirect
    queries. When users can approve such extensions, they may authorize potentially malicious components that compromise security
    or violate organizational policies. This restriction ensures only administrator-vetted system extensions run on managed
    devices.
  impact: Users will be unable to approve system extensions. Legitimate system extensions that are needed but not pre-approved
    via configuration profiles will be blocked until administrators explicitly allow them. Some previously approved third-party
    system extensions may cease to function after this policy is applied. To allow specific system extensions to operate,
    administrators must add entries to the "Allowed Team Identifiers" list within the "System Extensions" configuration. Team
    IDs can be discovered on devices using the Terminal command systemextensionsctl list, or found within the application's
    Info.plist file. The Team ID remains consistent across all devices and through software updates, enabling efficient management
    of approved extensions. Once added to the allowed list, the application will function normally, requesting necessary extension
    permissions that can be granted.
  references: []
