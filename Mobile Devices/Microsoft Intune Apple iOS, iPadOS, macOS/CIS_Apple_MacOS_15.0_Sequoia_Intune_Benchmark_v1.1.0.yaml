- id: 2.8.9
  title: Ensure "Enforced Software Update Delay" is absent or less than or equal to 30 days
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The Enforced Software Update Delay setting controls the number of days before users are notified of available
    software updates on managed macOS devices. When configured, this setting prevents pending updates from appearing to users
    until the specified delay period has elapsed from the update's release date. The setting affects both system and app software
    update notifications. The optimal configuration is to leave this setting not configured (absent), allowing users to be
    notified of updates as soon as they become available.
  rationale: Apple software updates almost always include security updates. By delaying update notifications, organizations
    increase the time systems remain vulnerable to security issues that have been patched in the available updates.
  impact: Organizations may use a short delay period to verify compatibility with specialized software before notifications
    reach end users, but should minimize this delay to maintain security. Organizations should balance their testing needs
    against security risks associated with delayed notifications.
