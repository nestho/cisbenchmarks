- id: 2.8.19
  title: Ensure "Allow UI Configuration Profile Installation" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This restriction prevents a user from intentionally or unintentionally installing additional configuration
    profiles through the user interface in macOS. When set to False, users are prevented from installing configuration profiles
    manually through System Settings or by opening profile files.
  rationale: This adds an additional security control, so third-party and potentially malicious configuration profiles are
    blocked from installation. Configuration profiles can contain settings that override system security, privacy, and functionality.
    By restricting profile installation to managed deployment methods only, organizations maintain control over what profiles
    are installed on managed devices and prevent users from compromising the security posture of their devices.
  impact: When this setting is enforced, users will be unable to install configuration profiles through the user interface
    and will receive a message stating "Installing profiles is restricted by a profile" when attempting to do so. Some services,
    such as WiFi access points that have been configured requiring a user to install a configuration profile, may be prevented
    from working by blocking their configuration profiles.
