  title: Ensure "Allow Startup Disk Modification" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The Startup Disk settings in System Settings allow users to select which disk is used to start up the computer.
    When enabled, users can change their startup disk to any compatible bootable volume connected to their device.
  rationale: Restricting modification of the startup disk prevents users from booting from unauthorized volumes, which could
    be used to bypass security controls implemented on the primary operating system. An attacker or malicious user could use
    an alternative startup disk to gain unauthorized access to data or to install malicious software.
  impact: This may impact users who legitimately need to boot from alternative volumes for troubleshooting or recovery purposes.
    In such cases, administrator intervention will be required to change the startup disk settings.
