- id: 2.8.31
  title: Ensure "Allow Fingerprint For Unlock" is set appropriately
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: Touch ID on macOS devices enables users to unlock their devices using fingerprint authentication instead of
    a password. When enabled, this biometric authentication method can be used for device unlock, system preferences access,
    password autofill, and at other authentication points. Touch ID stores enrolled fingerprint data in the Secure Enclave,
    a hardware-based security component isolated from the main processor. All Touch ID operations still require the existence
    of a password, which must be used after device reboots or when the device has not been unlocked for more than 48 hours.
  rationale: Organizations should evaluate their specific security requirements, threat models, and compliance needs when
    configuring Touch ID settings. In high-security environments or those with strict compliance requirements, disabling Touch
    ID may be appropriate to ensure password-based authentication. However, in many enterprise environments, enabling Touch
    ID can encourage users to set stronger passwords while maintaining a balance between security and usability.
  impact: Disabling Touch ID requires users to enter their password each time they unlock their device, potentially increasing
    authentication friction. This may lead to behaviors such as choosing simpler passwords.
  references: []
