- id: 2.4.1
  title: Login Window Behavior 2.4.1.1 Ensure "Show Full Name" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This policy setting controls whether the macOS login window displays a name and password dialog instead of
    a list of users. When enabled, users must enter both their username and password to authenticate.
  rationale: Displaying a list of users in the login window provides potential attackers with partial authentication credentials,
    as it reveals valid usernames on the system. By requiring users to enter both their username and password, the organization
    reduces the risk of unauthorized access and makes passcode cracking more difficult since attackers must guess both components
    of the login credentials.
  impact: Users will need to type both their username and password when logging in, rather than selecting their account from
    a list. This may slightly increase the time needed to log in but provides enhanced security. Users will need to remember
    their exact username in addition to their password.
  references: []
