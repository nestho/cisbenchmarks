  title: Siri Settings 2.14.3.1 Ensure "Enabled" is set to "Disabled"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Siri is Apple's virtual assistant that allows users to control their macOS device and access various functions
    through voice commands or typing. When enabled, Siri can perform tasks such as searching the web, opening applications,
    sending messages, setting reminders, and accessing system features. The assistant can be activated through keyboard shortcuts,
    menu bar, or voice commands.
  rationale: Disabling Siri prevents users from utilizing the assistant functionality. Siri collects and processes voice &
    text data, which may include sensitive organizational information, and transmits this data to Apple's servers for analysis.
    This creates potential data leakage risks, especially in environments that handle confidential or regulated information.
  impact: This setting specifically disables Siri functionality but does not affect the system dictation feature, which remains
    available for text input.
  references: []
  page_start: 280
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Under Configuration settings heading

    5. Expand the Declarative Device Management (DDM) heading

    6. Under the Siri Settings subheading

    7. Verify that Enabled is present and set to Disabled

    Or, from the device:

    1. Open System Settings

    2. Click General

    3. Click Device Management

    4. Double-click Management Profile

    5. Under the Device Declarations section

    6. Click Siri Settings

    7. Confirm Enabled is set to No'
  remediation: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Click edit, next to Configuration settings

    5. Click Add settings

    6. Select Declarative Device Management (DDM) then Siri Settings

    7. Check Enabled

    8. On the left side of the page set Enabled to Disabled

    9. Click Review + save

    10. Verify that Enabled is present and set to Disabled

    11. Click Save'
