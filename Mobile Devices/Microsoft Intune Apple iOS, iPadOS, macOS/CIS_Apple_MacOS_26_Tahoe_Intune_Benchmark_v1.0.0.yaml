- id: 2.6.2
  title: Firewall 2.6.2.1 Ensure "Enable Stealth Mode" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Stealth Mode prevents the system from responding to probing requests such as ICMP ping, effectively making
    the system appear invisible to network scanning.
  rationale: Enabling stealth mode helps prevent malicious actors from discovering the system through network scanning techniques.
    By not responding to probing attempts, the system becomes more difficult to detect and target, reducing the attack surface
    and reconnaissance activities.
  impact: When stealth mode is enabled, legitimate network diagnostic tools that rely on ICMP ping responses may fail to detect
    or communicate with the system. Other network tools that measure activity and approved applications will work as expected.
