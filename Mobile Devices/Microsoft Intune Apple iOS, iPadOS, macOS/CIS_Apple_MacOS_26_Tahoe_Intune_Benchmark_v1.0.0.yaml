- id: 2.10.1.1
  title: Ensure "Enforce Latest Software Update Version" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The "Enforce Latest Software Update Version" setting, mandates that device install the latest available software
    update. When set to "True", the update is enforced by the system rather than remaining optional for the user. Administrators
    may also configure an "Install Time" (e.g., 02:00) and a "Delay In Days" (0-30) to manage the rollout. Intune allows a
    delay of up to 30 days, this may exceed the recommended remediation window for critical vulnerabilities, organizations
    should set this delay as short as operationally feasible (typically 7 days) to maintain a strong security posture. For
    organizations requiring more sophisticated deployment rings or the support of older major macOS releases, utilizing the
    standard "Software Update" settings to configure specific target OS versions and specific install date & time is a recommended
    alternative.
  rationale: Software updates remediate known security vulnerabilities, correct stability defects, and ensure platform supportability.
    Enforcing the latest software update version prevents users from indefinitely deferring critical patches, ensuring that
    devices are protected against known threats in a timely manner.
  impact: There is always a risk that new updates may conflict with niche business-critical applications, therefore, updates
    should be validated before broad enforcement. Enforcing software updates may result an interpretation active user sessions
    and impact productivity. To mitigate user disruption, this setting should be used in conjunction with "Software Update
    Settings" > "Notifications" to provide users with advance warning.
  references: []
