- id: 2.3.1.4
  title: Ensure "Show Recovery Key" is set to "Disabled"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: Users will not be able to view their recovery key through the System Settings interface or during FileVault
    initialization.
  rationale: Displaying FileVault recovery keys to users increases the risk of keys being compromised through unauthorized
    documentation, sharing, or capture. By preventing the display of recovery keys, organizations maintain better control
    over recovery procedures and ensure that recovery disk decryption can only be performed through approved organizational
    channels.
  impact: All recovery operations will need to be handled through organizational IT support channels. Organizations must ensure
    they have proper key escrow systems in place and documented procedures for handling disk recovery scenarios before implementing
    this policy.
  references: []
