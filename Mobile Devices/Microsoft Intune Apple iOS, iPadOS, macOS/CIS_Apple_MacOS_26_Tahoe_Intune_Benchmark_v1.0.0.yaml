- id: 2.12.1.2
  title: Ensure Gatekeeper is configured for application installs from Identified Developers only
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This recommendation configures Gatekeeper to allow application installations only from the Mac App Store and
    identified developers with valid code signatures. It requires both the "Enable Assessment" setting to be set to "True"
    (enabling Gatekeeper) and the "Allow Identified Developers" setting to be set to "True".
  rationale: Gatekeeper helps protect systems from malicious applications by verifying that applications are from trusted
    sources before allowing them to run. By enabling "Allow Identified Developers," the system permits applications from both
    the Mac App Store and developers who have registered with Apple and digitally signed their applications.
  impact: Users will be unable to install or run applications that are not from the Mac App Store or from identified developers
    with valid code signatures. Some legitimate but unsigned applications may not launch until the developer obtains proper
    signing credentials from Apple. If this policy is applied to machines with software already installed from unidentified
    developers, those applications will not launch.
