- id: 2.13.1
  title: Ensure Configuration Profile Can Not be Removed by an End User
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This recommendation focuses on preventing end users from removing management profiles from organizational macOS
    devices. When properly implemented, the option to remove a management profile in System Settings should be grayed out
    (disabled), which indicates the device is enrolled via Apple Business Manager (ABM). If the removal button is clickable
    but requires authentication, this represents an alternative implementation. The ABM enrollment method is preferred and
    the most effective method to ensure management profiles remain locked to devices and cannot be removed, even by users
    with administrative privileges.
  rationale: If users can remove configuration profiles, they may intentionally or unintentionally circumvent security controls,
    potentially exposing the organization to security risks. Using Apple Business Manager enrollment creates a stronger binding
    between the management system (Intune MDM) and the device that persist when administrative users attempt to remove management
    profiles, ensuring continuous enforcement of policies.
  impact: Organizations must establish an ABM account and register devices before deployment.
  references: []
  page_start: 246
