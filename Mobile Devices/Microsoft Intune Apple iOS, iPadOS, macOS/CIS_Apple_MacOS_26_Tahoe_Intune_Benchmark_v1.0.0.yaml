- id: 2.3.1.3
  title: Ensure "Defer Force At User Login Max Bypass Attempts" is set to "0"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This policy setting determines the maximum number of times a user can bypass the FileVault login prompt at
    startup before encryption is forcefully enabled. Setting this value to "0" ensures users cannot defer or bypass the FileVault
    encryption requirement.
  rationale: Allowing users to bypass FileVault encryption leaves organizational data vulnerable to unauthorized access in
    case of device theft or loss. Setting the maximum bypass attempts to "0" enforces immediate FileVault encryption, ensuring
    that all system data is protected with strong encryption from the moment the policy is applied, at the user's next login.
  impact: Users will be required to enable FileVault encryption immediately without the option to defer. This may cause a
    brief delay during the initial encryption process, and users will need to remember their device password. If users forget
    their credentials, they will need to use the organizational recovery key to regain access to their data.
  references: []
