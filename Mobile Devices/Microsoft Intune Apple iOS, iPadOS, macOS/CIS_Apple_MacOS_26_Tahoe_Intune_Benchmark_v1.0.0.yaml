  description: Bluetooth Sharing allows users to exchange files with other Bluetooth-enabled devices. Setting "Allow Bluetooth
    Sharing Modification" to "False" prevents users from changing the Bluetooth sharing settings in System Settings.
  rationale: Controlling Bluetooth Sharing capability at an organizational level prevents unauthorized data transfers between
    organization-managed devices and external Bluetooth-enabled devices.
  impact: If Bluetooth Sharing was disabled before policy application (system default), it will remain disabled. If Bluetooth
    Sharing was enabled by the user before policy application, it will remain enabled and cannot be modified by the user.
