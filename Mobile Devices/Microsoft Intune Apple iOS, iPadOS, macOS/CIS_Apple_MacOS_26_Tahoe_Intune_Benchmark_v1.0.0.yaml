  - Level 1 - Supervised Devices
  description: This setting defines the maximum period of inactivity (in minutes) before screen saver is automatically initiated.
    When combined with the "Ask For Password" policy defined in the system configuration section of the benchmark, this will
    enforce a device lock after 15 minutes of inactivity.
  rationale: Extended periods of inactivity on an unlocked device present security risks. An unattended device may permit
    unauthorized users to access sensitive data or perform malicious actions. Limiting inactivity to 15 minutes or less reduces
    the window of opportunity for unauthorized access. This control requires the "Ask For Password" policy to ensure screen
    saver activation triggers device locking. While automatic locking provides a security fail-safe, users should be trained
    to manually lock devices when leaving them unattended and should be familiar with keyboard shortcuts for device locking.
