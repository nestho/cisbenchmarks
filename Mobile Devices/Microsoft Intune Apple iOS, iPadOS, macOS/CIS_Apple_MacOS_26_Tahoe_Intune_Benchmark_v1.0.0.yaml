- id: 2.3.1.1
  title: Ensure "User Enters Missing Info" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This policy setting ensures that users are prompted to enter any missing user account information during FileVault
    encryption setup. When enabled, the system will require users to confirm their login credentials if they haven't been
    properly configured for FileVault access.
  rationale: Enforcing complete user account configuration ensures that FileVault encryption is properly linked to authorized
    user credentials. This maintains secure access to encrypted data through the user's standard login password.
  impact: Users may be prompted to verify their login credentials during initial FileVault setup if the system detects missing
    or incomplete account information.
  references: []
