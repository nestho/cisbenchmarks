- id: 2.12.1.3
  title: Ensure Gatekeeper is configured to block all user application installs
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: This setting, when implemented in conjunction with the "Restrict Store Software Update Only" policy, will block
    all user software installation methods. It requires "Enable Assessment" to be set to "True" (enabling Gatekeeper) and
    "Allow Identified Developers" to be set to "False", restricting installations to Mac App Store applications only. Setting
    "Restrict Store Software Update Only" to "True" prevents the Mac App Store from launching and installing applications,
    effectively preventing all user-initiated application installations.
  rationale: Restricting application installation to approved deployment methods ensures maximum control over software running
    on organizational devices, eliminating the risk of unauthorized installations. All software deployments will occur through
    managed distribution channels.
  impact: Users will be unable to install any applications directly. All applications must be deployed through organizational
    software distribution methods such as MDM or approved deployment tools.
