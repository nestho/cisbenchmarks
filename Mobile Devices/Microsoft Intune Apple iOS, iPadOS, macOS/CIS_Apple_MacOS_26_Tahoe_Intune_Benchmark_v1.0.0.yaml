controls:
- id: 2.1.1
  title: Accounts 2.1.1.1 Ensure "Disable Guest Account" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The Guest account allows users to log in to the computer without requiring user authentication. When enabled,
    the Guest account provides access to the system with a restricted set of privileges but does not require a password. The
    account is recreated every time a guest logs out.
  rationale: 'Disabling the Guest account prevents unauthorized access to the system and its resources. A Guest account, even
    with limited privileges, could be exploited to: • Access shared network resources • View non-protected files and folders
    • Launch attacks against the system or network • Gather information about the organization''s computing environment •
    Create a persistent presence on the device'
  impact: Disabling the Guest account will prevent users from logging in without authentication credentials. Users who previously
    relied on Guest access will need valid credentials to access the system. This may affect shared workstations where Guest
    access was intentionally enabled for temporary use.
  references: []
  page_start: 20
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Under Configuration settings heading

    5. Expand the Accounts heading

    6. Under the Accounts subheading

    7. Verify that Disable Guest Account is present and set to True

    Or, from the device:

    1. Open System Settings

    2. Click General

    3. Click Device Management

    4. Double-click com.apple.MCX Profile

    5. Under the Details section

    6. Confirm Disable Guest Account is set to True'
  remediation: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Click edit, next to Configuration settings

    5. Click Add settings

    6. Select Accounts then Accounts

    7. Check Disable Guest Account

    8. On the left side of the page set Disable Guest Account to True

    9. Click Review + save

    10. Verify that Disable Guest Account is present and set to True

    11. Click Save'
  checks:
  - type: manual_review
    info: 'From the Microsoft Intune admin center:

      1. Select Devices

      2. Select Configuration

      3. Select the profile which applies to the macOS device

      4. Under Configuration settings heading

      5. Expand the Accounts heading

