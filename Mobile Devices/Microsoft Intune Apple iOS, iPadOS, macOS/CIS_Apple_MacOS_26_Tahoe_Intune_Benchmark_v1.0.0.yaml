  - Level 1 - Supervised Devices
  description: The "Change At Next Auth" setting enforces a mandatory password change at the user's next login or screen unlock.
    This is a one-time trigger, once the user has complied, they will not be prompted again unless a their password expires
    (if set) or change is subsequently made to the DDM Passcode policy configuration in Intune.
  rationale: Enforcing a password change at next authentication ensures all active credentials meet compliance at a known
    point in time.
  impact: Users will receive a mandatory password change prompt at their next authentication event. Administrators should
    note that any subsequent modification to the DDM Passcode policy in Intune is likely to re-trigger this prompt, even if
    the user's current password is compliant. All passcode policy changes should be consolidated before applying.
  references: []
