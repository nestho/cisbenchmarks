  title: Ensure "Enable Rollback" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The "Enable Rollback" setting determines whether users are permitted to revert background security improvements.
    Setting this value to "False" prevents users from removing previously applied security patches from the device.
  rationale: Restricting the rollback capability prevents the re-introduction of remediated vulnerabilities, including zero-day
    patches, into the environment. This ensures a consistent security baseline is maintained across all managed devices and
    prevents them from being returned to a less secure state.
  impact: Users will be unable to locally remove security improvements for troubleshooting purposes.
