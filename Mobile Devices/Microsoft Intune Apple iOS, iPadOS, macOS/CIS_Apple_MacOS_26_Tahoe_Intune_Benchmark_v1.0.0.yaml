- id: 2.10.2.2
  title: Ensure "Install OS Updates" is set to "Always On"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This recommendation controls whether macOS automatically installs operating system updates. When configured
    to "Always On", the system will automatically install applicable macOS updates without requiring user initiation. To ensure
    devices are forcibly updated to an approved OS level, this configuration must be used in combination with recommendation
    2.10.1.1 Ensure "Enforce Latest Software Update Version", or an acceptable substitute highlighted in the 2.10.1.1 description
    section.
  rationale: Operating system updates patch security vulnerabilities, resolve software bugs, and provide underlying system
    enhancements. Configuring the system to automatically install these updates ensure that devices are consistently protected
    against newly discovered security threats in a timely manner. Permitting users to initiate updates allows them to complete
    the update process at a convenient time, reducing the likelihood of productivity disruptions caused by mandatory, enforced
    system restarts.
  impact: Additionally, forcing the automatic installation of macOS updates may introduce temporary compatibility issues with
    niche enterprise applications if the newer OS version has not yet been thoroughly tested within the environment.
  references: []
