- id: 2.14.1.2
  title: Ensure "Enabled" is set to "Disabled"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting controls whether Apple Intelligence is permitted to interface with third-party generative AI tools.
    While Apple relies on Private Cloud Compute (PCC) for its native cloud processing, third-party integrations require the
    transmission of data to external services. Relying on external integrations places trust in a third party's security posture
    and privacy agreements, introducing additional risk to corporate data. Apple Intelligence's Mail Smart Replies feature
    uses AI to analyze the content and context of emails and email threads to generate contextually relevant, suggested responses.
    These options appear when a user initiates a reply in the Mail app, allowing them to select a pre-written draft to respond
    quickly without manually typing a message. Apple Intelligence's Mail summarization feature uses AI to quickly condense
    long emails or entire email threads into a few key sentences or bullet points. These summaries automatically appear beneath
    emails in the inbox, or can be generated manually via a "Summarize" button within an open email to provide an overview
    of complex conversations. Leveraging Apple Intelligence, the Notes app can record audio, such as meetings, lectures, or
    internal discussions, then convert them into written text transcripts. Leveraging Apple Intelligence, the Notes app can
    analyze written text transcripts generated from audio recordings, such as meetings, lectures, or internal discussions—
    to automatically produce condensed, AI-driven summaries of the content.
  rationale: External AI integrations introduce significant risks regarding data exposure, data residency, and regulatory
    compliance. Organizations with data sovereignty or confidentiality requirements must prevent unverified external AI providers
    from processing sensitive enterprise information. If there is any concern that sensitive organizational email content
    might be routed to third-party generative AI services (even with consent prompts), or to avoid any possibility of Apple's
    servers processing data from confidential communications (even within Apple's Private Cloud Compute (PCC) safeguards),
    disabling this feature ensures mail content is processed solely via approved organizational services and on managed devices.
    This configuration prioritizes absolute data control, minimizes external processing risks, and supports organizational
    privacy, compliance, and data handling requirements for sensitive information. If there is any concern that sensitive
    organizational email content might be routed to third-party generative AI services (even with consent prompts), or to
    avoid any possibility of Apple's servers processing data from confidential communications (even within Apple's Private
    Cloud Compute (PCC) safeguards), disabling this feature ensures mail content is processed solely via approved organizational
    services and on managed devices. This configuration prioritizes absolute data control, minimizes external processing risks,
    and supports organizational privacy, compliance, and data handling requirements for sensitive information. If there is
    any concern that sensitive organizational audio recordings might be routed to third-party generative AI services (even
    with consent prompts), or to avoid any possibility of Apple's servers processing data from confidential spoken communications
    (even within Apple's Private Cloud Compute (PCC) safeguards), disabling this feature ensures audio content is processed
    solely via approved organizational services and on managed devices. This configuration prioritizes absolute data control,
    minimizes external processing risks, and supports organizational privacy, compliance, and data handling requirements for
    sensitive information. If there is any concern that sensitive organizational audio transcripts might be routed to third-party
    generative AI services (even with consent prompts), or to avoid any possibility of Apple's servers processing data from
    confidential transcribed communications (even within Apple's Private Cloud Compute (PCC) safeguards), disabling this feature
    ensures transcript content is processed solely via approved organizational services and on managed devices. This configuration
    prioritizes absolute data control, minimizes external processing risks, and supports organizational privacy, compliance,
    and data handling requirements for sensitive information.
  impact: Users will be unable to utilize external AI services through native macOS features. Users will no longer see AI-generated
    suggested replies in the Apple Mail app and must compose all email responses manually. This removes the convenience of
    using quickresponse suggestions for routine messages. Users will no longer see automatic short summaries beneath emails,
    nor will they have the option to manually generate AI summaries on demand within the Apple Mail app. Users will no longer
    be able to automatically generate written text transcripts from audio recorded within the Apple Notes app. The ability
    to record audio in Notes remains functional. Users will no longer be able to automatically generate AI-driven summaries
    of audio transcripts within the Apple Notes app.
