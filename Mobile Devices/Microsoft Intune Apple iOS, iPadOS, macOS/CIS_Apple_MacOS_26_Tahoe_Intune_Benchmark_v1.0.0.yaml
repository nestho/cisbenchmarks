- id: 2.14.1
  title: External Intelligence Settings 2.14.1.1 Ensure "Allow Sign In" is set to "Blocked"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting determines whether users are permitted to authenticate to third-party generative AI services through
    native macOS intelligence features.
  rationale: External AI integrations introduce significant risks regarding data exposure, data residency, and regulatory
    compliance. Organizations with data sovereignty or confidentiality requirements must prevent unverified external AI providers
    from processing sensitive enterprise information. While organizations may already disable external intelligence integrations
    globally via the 2.14.1.2 recommendation, explicitly blocking the sign-in mechanism provides a defense-in-depth control.
    This ensures that even if external integrations are inadvertently enabled or overridden by a conflicting profile, the
    device remains restricted from linking authenticated accounts to third-party platforms.
  impact: Users will be unable to sign in or link accounts to supported external AI services through native macOS functionality.
  references: []
  page_start: 250
  audit_raw: 'From the Microsoft Intune admin center:

    1. Select Devices

    2. Select Configuration

    3. Select the profile which applies to the macOS device

    4. Under Configuration settings heading

