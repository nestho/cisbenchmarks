- id: 2.11.1.5
  title: Ensure "Destroy FV Key On Standby" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: When enabled, the FileVault keys are completely destroyed from the SMC or RAM when the system enters sleep,
    requiring the user to re-enter their password upon wakeup to decrypt the disk.
  rationale: FileVault keys temporarily stored in SMC or RAM during standby could be vulnerable to extraction through cold
    boot attacks or memory analysis. By destroying these keys during standby, an additional layer of protection is provided
    for encrypted data, even if an attacker gains physical access to the device while in standby mode.
  impact: This may slightly increase the time required for a system to wake from standby, as the user must re-authenticate
    to decrypt the FileVault volume.
