- id: 2.10.2.3
  title: Ensure "Install Security Update" is set to "AlwaysOn"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This recommendation controls whether macOS automatically installs security updates. When configured to "AlwaysOn",
    the system will automatically install updates specifically designated as security patches without requiring user initiation.
    This setting applies solely to OS-level security updates and is distinct from full operating system updates and background
    security improvement settings, such as Rapid Security Responses (RSR) and XProtect.
  rationale: Security updates remediate known vulnerabilities and patch critical flaws within the operating system.
  impact: Applying patches immediately upon release limits the time administrators have to validate changes within their environment,
    which could introduce isolated compatibility issues with niche enterprise software. However, the operational impact and
    risk associated with security patches are generally lower than those associated with full operating system upgrades.
