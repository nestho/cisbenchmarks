    is required for reliable System Sleep Timer functionality. Display sleep only turns off the screen and does not trigger
    system re-authentication.
  rationale: Setting an appropriate display sleep timer ensures the System Sleep Timer functions reliably, which is critical
    for FileVault security.
  impact: Users will need to reactivate displays after inactivity periods. Additional screen saver passcode controls defined
    in this benchmark will enforce passcode re-entry when implemented.
