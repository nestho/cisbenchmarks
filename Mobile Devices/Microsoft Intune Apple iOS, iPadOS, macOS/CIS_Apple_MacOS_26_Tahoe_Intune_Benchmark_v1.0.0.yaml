- id: 2.4.2.1
  title: Ensure "Disable Login Items Suppression" is set to "True"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting prevents users from disabling the automatic launch of login items by holding down the Shift key
    during login. When set to True, all designated login items will launch regardless of user intervention.
  rationale: Organizations often deploy critical security software that must run at system startup to maintain security posture.
    Allowing users to suppress these login items could create security gaps by preventing security applications from launching,
    potentially leaving the system insecure.
  impact: ''
  references: []
