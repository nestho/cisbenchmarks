- id: 2.3.1.6
  title: Ensure "Defer" is set to "Enabled"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This policy setting enables deferred FileVault encryption enforcement, triggering setup at the next user authentication
    event such as a logout, reboot, or shutdown.
  rationale: This minimizes the period of time that a device is unencrypted. This setting is a requirement for FileVault enforcement,
    without it, FileVault policy will not be applied to the device.
  impact: Users will be prompted to enter their macOS account password at their next logout, reboot, or shutdown to initiate
    FileVault encryption. If users forget their credentials, they will need to use the organizational recovery key to regain
    access to their data.
  references: []
