- id: 2.10.2
  title: Automatic Actions 2.10.2.1 Ensure "Download" is set to "AlwaysOn"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The "Download" setting controls whether a managed macOS device retrieves software updates in the background.
    When set to "AlwaysOn", the system automatically downloads available update packages without requiring user initiation.
  rationale: Pre-downloading update payloads ensures that critical security patches and system fixes are locally staged and
    ready for installation. This reduces the overall patching window and accelerates the remediation of system vulnerabilities
    once the installation phase is triggered by policy or the user.
  impact: Automatic downloads consume network bandwidth and local disk space in the background.
