- id: 2.14.2.4
  title: Ensure "Allow Apple Intelligence Report" is set to "Blocked"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: The Apple Intelligence Report is a feature that allows users to generate a detailed log of requests sent from
    the Mac to Apple's Private Cloud Compute. This report provides a history of the data, payloads, and prompts that were
    offloaded by the operating system for processing by cloud-based AI infrastructure.
  rationale: The primary security concern regarding the Apple Intelligence Report is the risk of unintended data leakage and
    unauthorized exfiltration. These reports consolidate a history of user prompts and may contain corporate data, intellectual
    property, or personally identifiable information. Allowing users to generate and export a localized file of this consolidated
    data may bypass data loss prevention controls (if applicable), creating a new vector for data exposure.
  impact: Users will be unable to generate, view, or export local reports detailing their Apple Intelligence requests sent
    to Private Cloud Compute. This restriction does not disable the underlying functionality of Apple Intelligence features.
    Organizations that require this information for troubleshooting or auditing purposes must rely on approved corporate support
    and diagnostic processes.
  references: []
