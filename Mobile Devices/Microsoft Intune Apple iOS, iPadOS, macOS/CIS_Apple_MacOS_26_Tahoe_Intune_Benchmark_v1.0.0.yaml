- id: 2.11.1.3
  title: Ensure "Wake on LAN" is set to "False"
  scoring: manual
  profile:
  - Level 1 - Supervised Devices
  description: This setting controls whether a Mac can be awakened from sleep through network access. When enabled, the system
    can be remotely activated by wake packets sent over the network, allowing the computer to be accessed when it would otherwise
    be in sleep mode.
  rationale: Disabling Wake on LAN prevents unauthorized users from remotely waking the system, which could be used in an
    attempt to gain access to an secured or unattended device.
  impact: In modern computing environments, disabling Wake on LAN has minimal operational impact. Modern MDM solutions like
    Intune do not rely on Wake on LAN functionality for management operations, instead communicating with devices when they
    are online and applying policies when devices check in.
  references: []
