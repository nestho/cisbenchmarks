  description: Auto Unlock allows users to automatically unlock their Mac using an Apple Watch. When enabled, this feature
    permits users to bypass the login screen password requirement when their authenticated Apple Watch is in close proximity
    to the Mac.
  rationale: Disabling Auto Unlock prevents unauthorized access to a Mac when an authenticated Apple Watch is in proximity.
    If a user's Apple Watch is stolen or compromised while remaining in Bluetooth range of their Mac, an attacker could potentially
    gain access to the device without knowledge of the user's credentials. Additionally, signal interception or replay attacks
    targeting the Bluetooth communication between devices could be used to bypass authentication.
  impact: Users will be required to manually enter their password (or Touch ID if enabled) each time they need to unlock their
    Mac.
