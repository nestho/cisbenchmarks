- id: 2.8.20
  title: Ensure "Allow Content Caching" is set to "False"
  scoring: manual
  profile:
  - Level 2 - Supervised Devices
  description: Content caching stores and serves various types of content from Apple, including software updates, app store
    purchases, iCloud data, and other downloadable content to reduce internet bandwidth usage. When allowed, content caching
    enables the device to serve as a local cache server for Apple content. This capability requires macOS clients to function
    as P2P nodes for Apple content distribution.
  rationale: P2P sharing services should not be enabled on endpoints using untrusted networks. Disabling content caching reduces
    the attack surface by preventing network service initiation. Content caching creates additional network connections and
    locally stored content, which may introduce security risks in managed environments.
  impact: Disabling content caching will increase bandwidth usage between local subnets and the Internet as devices download
    updates, apps, and iCloud content directly from Apple's servers rather than local caches. Organizations should ensure
    adequate bandwidth is available for all Apple content and services.
