    recommended state for this setting is: Disabled.'
  rationale: Wi-Fi assistant connects to any open Wi-Fi and tunnels the connection through Google VPN servers. It is considered
    best practice to only connect to trusted networks manually and leave this setting disabled.
  impact: 'Disabling Wi-Fi assistant can improve the security and privacy of devices by preventing automatic connections to
    potentially untrusted Wi-Fi networks. However, it may also result in increased data usage and decreased convenience for
    users who frequently connect to open Wi-Fi networks. Note: This setting is only available on Pixel and Nexus devices running
    Android 5.1 or later. Also, even on these devices this feature is dependent on the carrier and country so it may not be
    available or configurable in all cases.'
