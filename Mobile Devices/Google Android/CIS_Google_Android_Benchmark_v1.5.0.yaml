    automatically turns off. The recommended state for this setting is: 1 Minute or less.'
  rationale: Setting an inactivity timeout is a recommended security measure to prevent unauthorized access to the device
    when it's unattended. The inactivity timeout automatically turns off the screen after a specified period of inactivity
    and also activates other security features like a screen lock to safeguard the device. This helps protect sensitive information
    from unauthorized access and enhances the overall security of the device.
  impact: Users will need to unlock their device after the inactivity period is reached.
