  scoring: manual
  profile:
  - Level 1
  description: 'Review device app''s permissions periodically. App permissions allow control over which capabilities or information
    apps could access on the device. Permissions can extend from using device hardware to accessing data. The recommended
    state for this setting is: Review app permissions regularly.'
  rationale: Periodically reviewing all apps permissions ensures that those apps have legitimate permissions and only have
    access to data they actually need. Uninstall apps that may seek overbroad permissions.
  impact: Some apps request more than their required permissions. Such apps might not work if the additional unnecessary permissions
    are disabled. In some cases, the app will not function as expected and permissions may have to be restored or the app
    may require reinstallation.
  references:
  - 1. https://support.google.com/googleplay/answer/6270602?hl=en-IN
  page_start: 60
  audit_raw: 'Follow the below steps to review app permissions:

    1. Open phone''s Settings app.

