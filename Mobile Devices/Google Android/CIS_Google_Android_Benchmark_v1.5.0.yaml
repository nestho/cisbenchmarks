    for this setting is: Disabled.'
  rationale: Exposure to an app like this is dangerous since a malicious link might be used to trick a user. Additionally,
    it can bypass enterprise security policies and safeguards that rely on controlling app installation. Therefore, it is
    recommended to disable instant apps.
  impact: Instant apps will not be available. Instead, the app links would open in the browser just as other regular links.
  references:
