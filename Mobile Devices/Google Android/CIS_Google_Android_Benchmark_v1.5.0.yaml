benchmark:
  id: cis-google-android-benchmark
  title: CIS Google Android Benchmark
  version: 1.5.0
  technology: Google Android
  category: Mobile Devices
  os: Google Android
  source_pdf: CIS_Google_Android_Benchmark_v1.5.0.pdf
  total_pages: 109
  controls_count: 45
controls:
- id: '1.1'
  title: Ensure device firmware is up to date
  scoring: manual
  profile:
  - Level 1
  description: 'Ensure that the device is kept up to date with security patch levels. The recommended state for this setting
    is: Apply updates.'
  rationale: Firmware updates often include critical security fixes that reduce the probability of an attacker remotely exploiting
    the device. The device should be on the latest security patch level as applicable.
  impact: None
  references:
  - 1. https://source.android.com/security/bulletin/index.html
  page_start: 13
  audit_raw: 'To verify that your device is updated to the most recent firmware version:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Advanced.

    4. Tap System update.

    5. Verify that the Android Security patch level is current and that no new

    updates exist.'
  remediation: 'Follow the below steps to check and update the device security patch level:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Advanced.

    4. Tap System Updates.

    5. Tap Check for update.

    6. Apply the update if available.'
  checks:
  - type: manual_review
    info: 'To verify that your device is updated to the most recent firmware version:

      1. Open phone''s Settings app.

      2. Tap System.

      3. Tap Advanced.

      4. Tap System update.

      5. Verify that the Android Security patch level is current and that no new

      updates exist.'
    severity: medium
- id: '1.2'
  title: Ensure 'Screen Lock' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: 'Enabling the Screen lock setting helps secure Android devices. This setting helps prevent unauthorized access
    to your device and protects data from being compromised. The recommended state for this setting is: Enabled.'
  rationale: Enabling Screen Lock requires user authentication before interacting with the device. As a result, Screen Lock
    strengthens application and data protection and improves device security.
  impact: A user will be prompted to unlock the device on every use.
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&ref_topic=7029556&
  page_start: 15
  audit_raw: 'Verify that a Pattern, PIN or Password has been set for the device:

    1. Tap Settings.

    2. Tap Security.

    3. Verify that Screen lock has Pattern, PIN or Password underneath the text.'
  remediation: 'To configure a Pattern, PIN or Password for the device:

    1. Tap Settings.

    2. Tap Security.

    3. Tap Screen Lock.

    4. Tap Pattern, PIN or Password.

    5. Enter a complex Pattern, PIN or Password.

    6. Tap Continue.

    7. Enter in the same complex Pattern, PIN or Password again.

    8. Tap OK.'
  checks:
  - type: manual_review
    info: 'Verify that a Pattern, PIN or Password has been set for the device:

      1. Tap Settings.

      2. Tap Security.

      3. Verify that Screen lock has Pattern, PIN or Password underneath the text.'
    severity: medium
- id: '1.3'
  title: Ensure 'Make pattern visible' is set to 'Disabled' (if using a pattern as device lock mechanism)
  scoring: manual
  profile:
  - Level 1
  description: 'Disable pattern visibility if using a pattern as device lock mechanism. The recommended state for this setting
    is: Disabled.'
  rationale: Keeping device unlock patterns visible during device unlock can reveal the pattern and is vulnerable to shoulder
    surfing attacks. Therefore, is it not a best practice to make the device pattern visible.
  impact: The user would have to be careful while entering the device unlock pattern since visual feedback would not provide
    clues for tracing pattern input.
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&visit_id=6369585489
  page_start: 17
  audit_raw: 'Follow the below steps and verify that device unlock pattern is not visible:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. If Screen lock has Pattern underneath the text, follow further steps. If not, then

    this recommendation is not applicable.

    4. Tap the Gear Icon next to Screen lock.

    5. Verify that the Make pattern visible switch is Disabled.'
  remediation: 'To disable device unlock pattern visibility, follow the below steps:

    1. Tap Settings Gear Icon.

    2. Tap Security.

    3. If Screen lock has Pattern underneath the text, follow further steps. If not, then

    this recommendation is not applicable.

    4. Tap the Gear Icon next to Screen lock.

    5. Toggle Make pattern visible to OFF position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that device unlock pattern is not visible:

      1. Tap Settings Gear Icon.

      2. Tap Security.

      3. If Screen lock has Pattern underneath the text, follow further steps. If not, then

      this recommendation is not applicable.

      4. Tap the Gear Icon next to Screen lock.

      5. Verify that the Make pattern visible switch is Disabled.'
    severity: medium
- id: '1.4'
  title: Ensure 'Automatically Lock' is set to 'Immediately'
  scoring: manual
  profile:
  - Level 1
  description: 'Immediately lock the phone as soon as the device goes to sleep. The recommended state for this setting is:
    Immediately.'
  rationale: Automatically and immediately locking the device as soon as it goes to sleep ensures there is no delay between
    the device entering the sleep state and the device being locked. This is an important security measure as it helps prevent
    unauthorized access to the device and protects sensitive data stored on it.
  impact: Setting the "Automatically Lock" feature to a short interval, such as immediately, can be inconvenient for some
    users who may have to enter a passcode or unlock pattern frequently.
  references: []
  page_start: 19
  audit_raw: 'Follow the below steps and verify that Automatically Look is set to Immediately:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap the Gear icon next to Screen lock.

    4. Verify that Automatically lock has a text Immediately after sleep underneath

    it.'
  remediation: 'Follow the below steps and set Automatically Lock to Immediately:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap the Gear icon next to Screen lock.

    4. Tap Automatically lock.

    5. Tap Immediately.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Automatically Look is set to Immediately:

      1. Open phone''s Settings app.

      2. Tap Security.

      3. Tap the Gear icon next to Screen lock.

      4. Verify that Automatically lock has a text Immediately after sleep underneath

      it.'
    severity: medium
- id: '1.5'
  title: Ensure 'Power button instantly locks' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: 'Pressing the power button should lock the device instantly. The recommended state for this setting is: Enabled.'
  rationale: Enabling Power button instantly locks setting ensures that the device is instantly locked as well. This avoid
    a possible situation where a device is asleep but not locked and would be vulnerable to unauthorized use.
  impact: None - this is default behavior.
  references:
  - 1. https://support.google.com/android/answer/9079129?hl=en&visit_id=6369585489
  page_start: 21
  audit_raw: 'Follow the below steps and verify that Power button instantly locks is Enabled:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap the Gear icon next to Screen lock.

    4. Verify that Power button instantly locks is Enabled.'
  remediation: 'Follow the below steps to enable the Power button instantly locks setting:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap the Gear icon next to Screen lock.

    4. Toggle Power button instantly locks setting to ON position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Power button instantly locks is Enabled:

      1. Open phone''s Settings app.

      2. Tap Security.

      3. Tap the Gear icon next to Screen lock.

      4. Verify that Power button instantly locks is Enabled.'
    severity: medium
- id: '1.6'
  title: Ensure 'Lock Screen Message' is configured
  scoring: manual
  profile:
  - Level 1
  description: 'Set a message to be displayed on the locked screen. The recommended state for this setting is: Configure Lock
    Screen Message.'
  rationale: When device screen is locked, a lock screen message helps to provide • Deterrent warnings, • Device recognition
    without needing to unlock the device • Emergency contact information Such information could be valuable to both your device
    security and personnel security. It is thus recommended to have a suitable lock screen message.
  impact: Anyone who picks up the device can see the messages and emergency information without unlocking the phone.
  references: []
  page_start: 23
  audit_raw: 'Follow the below steps and verify that Lock screen message is set:

    1. Open phone''s Settings app.

    2. Tap Display.

    3. Tap Advanced.

    4. Tap Lock screen display.

    5. Tap Lock screen message.

    6. Verify that a suitable Lock screen message is set.'
  remediation: 'Follow the below steps to set up a Lock screen message:

    1. Open phone''s Settings app.

    2. Tap Display.

    3. Tap Advanced.

    4. Tap Lock screen display.

    5. Tap Lock screen message.

    6. Write your message and tap Save.'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Lock screen message is set:

      1. Open phone''s Settings app.

      2. Tap Display.

      3. Tap Advanced.

      4. Tap Lock screen display.

      5. Tap Lock screen message.

      6. Verify that a suitable Lock screen message is set.'
    severity: medium
- id: '1.7'
  title: Do not connect to untrusted Wi-Fi networks
  scoring: manual
  profile:
  - Level 2
  description: 'The Do not connect to untrusted Wi-Fi networks setting protects users from potential security threats when
    connecting to Wi-Fi networks. When this setting is enabled, the device will automatically avoid connecting to any Wi-Fi
    networks that it deems untrusted, based on a set of predefined criteria. The recommended state for this setting is: Only
    connect to trusted networks.'
  rationale: Connecting a device to an open untrusted network through unsecured channels can increase the remote attack surface
    of the device. The cellular data network is a more difficult medium to inspect compared to Wi-Fi. If a user is going to
    be using public Wi-Fi, using a secure VPN is recommended. In most cases, you should avoid using a public, untrusted or
    free Wi-Fi.
  impact: A user might have to use cellular data and would not be able to take advantage of public Wi-Fi networks.
  references:
  - 1. https://support.google.com/android/answer/9075847?hl=en
  page_start: 25
  audit_raw: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

    untrusted network:

    1. Open phone''s Settings app.

    2. Tap Network & internet.

    3. Verify that the Wi-Fi switch is in the Off position or is connected to a trusted

    network only.'
  remediation: 'Follow the below steps to disable Wi-Fi or connect to a trusted network:

    1. Open phone''s Settings app.

    2. Tap Network & internet.

    3. Toggle Wi-Fi setting to the Off position or connect to a trusted network.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Wi-Fi is either disabled or not connected to an

      untrusted network:

      1. Open phone''s Settings app.

      2. Tap Network & internet.

      3. Verify that the Wi-Fi switch is in the Off position or is connected to a trusted

      network only.'
    severity: medium
- id: '1.8'
  title: Ensure 'Show passwords' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 2
  description: 'This setting controls whether passwords typed into a user''s Android device are visible on screen or hidden.
    When this setting is disabled, the password is concealed, and only the most recent character is visible for a short time
    after it has been pressed. The recommended state for this setting is: Disabled.'
  rationale: Disabling this setting prevents potential shoulder surfing attacks.
  impact: Disabling the show passwords feature on Android may make it harder for users to enter passwords accurately on the
    small on-screen keyboard. Without visual feedback, users may have to rely solely on memory, potentially leading to increased
    frustration, errors, and login attempts.
  references: []
  page_start: 26
  audit_raw: 'Follow the below steps to verify Show passwords is set to Disabled:

    1. Open phone''s Settings app.

    2. Tap Privacy.

    3. Verify that Show passwords slider is OFF.'
  remediation: 'Follow the below steps to disable Show passwords:

    1. Open phone''s Settings app.

    2. Tap Privacy.

    3. Toggle Show passwords to OFF position.'
  checks:
  - type: sql
    command: 'Show passwords is set to Disabled:'
    severity: medium
    info: 'Follow the below steps to verify Show passwords is set to Disabled:

      1. Open phone''s Settings app.

      2. Tap Privacy.

      3. Verify that Show passwords slider is OFF.'
- id: '1.9'
  title: Ensure 'Developer Options' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The Developer Options is a hidden settings menu on Android devices that provides advanced tools and options
    for developers and advanced users. The recommended state for this setting is: Disabled.'
  rationale: Enabling Developer Options allows a user to alter specific, very advanced settings on the device. This can severely
    affect how the device functions and expose additional developmental features to the user. This also exposes the device
    to respond to features such as USB debugging (when enabled) and other features that could be exploited to gain malicious
    access to the device sub-systems.
  impact: None - by default, this option is hidden to prevent accidental changes to the device settings.
  references:
  - 1. https://developer.android.com/studio/debug/dev-options
  page_start: 27
  audit_raw: 'Follow the below steps to verify that Developer Options is Disabled:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Advanced.

    4. Tap Developer options.

    5. Verify that it is OFF.'
  remediation: 'Follow the below steps to disable Developer Options:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Advanced.

    4. Tap Developer options.

    5. Toggle it to OFF position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Developer Options is Disabled:

      1. Open phone''s Settings app.

      2. Tap System.

      3. Tap Advanced.

      4. Tap Developer options.

      5. Verify that it is OFF.'
    severity: medium
- id: '1.10'
  title: Ensure 'Install unknown apps' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The Install unknown apps setting in Android allows users to install apps from sources other than the Google
    Play Store. The recommended state for this setting is: Disabled.'
  rationale: Disabling installation from untrusted distribution channels protects against the inadvertent installation of
    untrusted or malicious applications. Google Play Apps are vetted by the Google Security Team and are generally considered
    safe. Installing apps from other sources can increase the risk of downloading malware or apps that may compromise user
    privacy and security. Therefore, it is recommended that users avoid installing apps from untrusted distribution channels.
  impact: None - this is default behavior.
  references:
  - 1. https://support.google.com/pixelphone/answer/7391672?hl=en
  page_start: 29
  audit_raw: 'Follow the below steps to verify that Install unknown apps is Disabled:

    1. Open phone''s Settings app.

    2. Tap Apps & notifications.

    3. Tap Advanced.

    4. Tap Special app access.

    5. Tap Install unknown apps.

    6. Verify that all of the apps in the list show Not allowed.'
  remediation: 'Follow the below steps to disable Install unknown apps:

    1. Open phone''s Settings app.

    2. Tap Apps & notifications.

    3. Tap Advanced.

    4. Tap Special app access.

    5. Tap Install unknown apps.

    6. Tap any app showing Allowed.

    7. Toggle Allow from this source to OFF position.'
  checks:
  - type: sql
    command: show Not allowed.
    severity: medium
    info: 'Follow the below steps to verify that Install unknown apps is Disabled:

      1. Open phone''s Settings app.

      2. Tap Apps & notifications.

      3. Tap Advanced.

      4. Tap Special app access.

      5. Tap Install unknown apps.

      6. Verify that all of the apps in the list show Not allowed.'
- id: '1.11'
  title: Do not root a user device
  scoring: manual
  profile:
  - Level 1
  description: 'Rooting an Android device means gaining administrative access to the device''s system files and settings.
    This allows users to install custom firmware, modify system files, and perform other advanced operations that are not
    possible with a standard, unrooted device. The recommended state for this setting is: Do not Root.'
  rationale: Rooting an Android device breaks the user-level restrictions set by Google. In addition, rooting enables any
    form of alteration to the device, which could allow privileged actions. As a result, rooting puts the device at greater
    risk because rooting can modify the device without restrictions. Rooting also voids the warranty and could make installing
    future security updates is problematic.
  impact: While there is no direct impact to not rooting a device, returning to a non-rooted state often requires a full factory
    reset which likely results in complete data loss.
  references:
  - 1. http://www.wikihow.com/Check-if-Your-Android-Cellphone-Is-Rooted-or-Not
  - 2. http://www.wikihow.com/Unroot-Android
  page_start: 31
  audit_raw: 'Identifying a rooted device is not straightforward. You may need to install a terminal or

    root checker app to detect rooted devices. Alternatively, the device manufacturer may

    provide documentation describing how to detect rooting.'
  remediation: Follow your device manufacturer documentation to completely un-root a user device.
  checks:
  - type: manual_review
    info: 'Identifying a rooted device is not straightforward. You may need to install a terminal or

      root checker app to detect rooted devices. Alternatively, the device manufacturer may

      provide documentation describing how to detect rooting.'
    severity: medium
- id: '1.12'
  title: Ensure 'Smart Lock' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 2
  description: 'Smart Lock detects the device''s presence and automatically keeps it unlocked even if it has a screen password,
    pin or pattern enabled. Using Smart Lock allows the device to be unlocked if preconditions are met. The recommended state
    for this setting is: Disabled.'
  rationale: Smart Lock detects the device's presence and automatically keeps it unlocked even if it has a screen password,
    pin or pattern enabled. Using Smart Lock allows the device to be unlocked if preconditions are met. As a best practice,
    do not set the device to unlock automatically. For example, if the device is stolen and taken to a location pre-defined
    in Smart Lock, it would automatically unlock. Similarly, if someone could replay the voice, the device would automatically
    unlock.
  impact: The device would need to be manually unlocked every time.
  references:
  - 1. https://support.google.com/android/answer/9075927?hl=en&visit_id=6369594200
  page_start: 33
  audit_raw: 'Follow the below steps to verify that Smart Lock is Disabled:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap Advanced.

    4. Tap Trust agents.

    5. Verify that Smart Lock (Google) is OFF.'
  remediation: 'Follow the below steps to disable Smart Lock:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap Advanced.

    4. Tap Trust agents.

    5. Toggle Smart Lock (Google) to OFF position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Smart Lock is Disabled:

      1. Open phone''s Settings app.

      2. Tap Security.

      3. Tap Advanced.

      4. Tap Trust agents.

      5. Verify that Smart Lock (Google) is OFF.'
    severity: medium
- id: '1.13'
  title: Ensure 'Lock SIM card' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 2
  description: 'The Lock SIM card setting for Android devices allows users to protect their SIM card with a PIN code, which
    must be entered each time the device is turned on. The recommended state for this setting is: Enabled.'
  rationale: 'Enabling the SIM card lock prevents unauthorized use of the SIM card by requiring a PIN to access it. If a SIM
    card is removed from the device, the PIN is required to use it on another device. Additionally, some users may choose
    to store personal data such as contacts and messages on the SIM card, making it crucial to safeguard this data by setting
    a custom PIN. By setting a SIM card PIN, users can ensure that their personal data is protected even if the device is
    lost or stolen. Note: Only phones that are not locked by the service provider can lock the SIM card.'
  impact: The user will need to remember their SIM card PIN. If a user forgets the SIM card PIN, the user would need to contact
    the provider for support.
  references:
  - 1. https://support.google.com/android/answer/6088895?hl=enGB&visit_id=636959420073607202-2748220419&rd=1
  page_start: 35
  audit_raw: 'Follow the below steps to verify that Lock SIM card is Enabled:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap SIM card lock.

    4. Verify that Lock SIM card is Enabled.

    5. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

    Lock SIM card is Enabled there as well.'
  remediation: 'Follow the below steps to enable Lock SIM card:

    1. Contact the SIM card provider and get the default SIM PIN.

    2. Open phone''s Settings app.

    3. Tap Security.

    4. Tap SIM card lock.

    5. Toggle Lock SIM card to the on position.

    6. Enter the default PIN provided by your SIM provider.

    7. Press OK.

    8. The Lock SIM card option will then be enabled.

    9. Tap on Change SIM PIN.

    10. Again, provide the default PIN provided (Old PIN) by your SIM card provider.

    11. Type your new custom PIN.

    12. Re-type your new custom PIN.

    13. Press OK.

    14. A custom SIM PIN is then set.

    15. Repeat the process for the 2nd SIM, if applicable.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Lock SIM card is Enabled:

      1. Open phone''s Settings app.

      2. Tap Security.

      3. Tap SIM card lock.

      4. Verify that Lock SIM card is Enabled.

      5. If you have more than one SIM card, click on the 2nd SIM card tab and verify that

      Lock SIM card is Enabled there as well.'
    severity: medium
- id: '1.14'
  title: Ensure 'Find My Device' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 2
  description: 'Find My Device allows users to remotely locate, lock, or erase their device in case it is lost or stolen.
    The recommended state for this setting is: Enabled.'
  rationale: By enabling Find My Device, a user can remotely locate the device, ring the device, lock, or erase the device
    data. This helps to protect any sensitive data or personal information that may be stored on the device. It also increases
    the chances of recovering the device or having it returned to the owner, as it can provide location information to law
    enforcement or other authorities.
  impact: Google may track device location anytime.
  references:
  - 1. https://support.google.com/android/answer/6160491?hl=en
  page_start: 37
  audit_raw: 'Follow the below steps to verify that Find My Device is Enabled:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Verify that the Find My Device is ON.'
  remediation: 'Follow the below steps to enable Find My Device:

    1. Open phone''s Settings app.

    2. Tap Security.

    3. Tap Find My Device.

    4. Toggle slider to the ON position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Find My Device is Enabled:

      1. Open phone''s Settings app.

      2. Tap Security.

      3. Verify that the Find My Device is ON.'
    severity: medium
- id: '1.15'
  title: Ensure 'Use network-provided time' and 'Use networkprovided time zone' are set to 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The Use network-provided time and Use network-provided time zone settings allow the device to automatically
    update its time and time zone based on the network it is connected to. When these settings are enabled, the device will
    periodically check with the network to ensure that its time and time zone are accurate. The recommended state for this
    setting is: Enabled.'
  rationale: Using the network-provided time setting fetches the date and time information from the cellular provider and
    is generally more reliable. In addition, precise date and time could help forensics device recovery through Android Device
    Manager and maintain application and logs in a time-sync manner.
  impact: None - this is default behavior.
  references:
  - 1. https://support.google.com/nexus/answer/2841106?hl=en
  page_start: 38
  audit_raw: 'Follow the below steps to verify that Use network-provided time and Use networkprovided time zone setting is
    Enabled:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Date & time.

    4. Verify that Use network-provided time setting is Enabled.

    5. Verify that Use network-provided time zone setting is Enabled.'
  remediation: 'Follow the below steps to enable Use network-provided time and Use networkprovided time zone settings:

    1. Open phone''s Settings app.

    2. Tap System.

    3. Tap Date & time.

    4. Toggle Use network-provided time setting to ON position.

    5. Toggle Use network-provided time zone setting to ON position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Use network-provided time and Use networkprovided time zone setting is Enabled:

      1. Open phone''s Settings app.

      2. Tap System.

      3. Tap Date & time.

      4. Verify that Use network-provided time setting is Enabled.

      5. Verify that Use network-provided time zone setting is Enabled.'
    severity: medium
- id: '1.16'
  title: Ensure 'Remotely locate this device' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The Remotely locate this device setting allows users to locate their lost or stolen device remotely, as long
    as it is connected to the internet. By enabling this feature, users can easily track the location of their device on a
    map, lock it remotely with a custom message and phone number, and even erase all data on the device to protect sensitive
    information. The recommended state for this setting is: Enabled.'
  rationale: By enabling the Remotely locate this device setting users can quickly and easily locate their lost or stolen
    device, and take action to protect their data and privacy.
  impact: Enabling the Remotely locate this device setting on Android devices requires users to keep their location services
    enabled at all times, which could be considered a privacy issue by some users.
  references:
  - 1. https://support.google.com/accounts/answer/3265955#location
  page_start: 40
  audit_raw: 'Follow the below steps to verify that Remotely locate this device setting is Enabled:

    1. Open phone''s Settings app.

    2. Tap Google.

    3. Tap Security.

    4. Tap Find My Device.

    5. Verify that Remotely locate this device setting is Enabled.'
  remediation: 'Follow the below steps to enable Remotely locate this device:

    1. Open phone''s Settings app.

    2. Tap Google.

    3. Tap Security.

    4. Tap Find My Device.

    5. Toggle Remotely locate this device setting to ON position.'
  checks:
  - type: manual_review
    info: 'Follow the below steps to verify that Remotely locate this device setting is Enabled:

      1. Open phone''s Settings app.

      2. Tap Google.

      3. Tap Security.

      4. Tap Find My Device.

      5. Verify that Remotely locate this device setting is Enabled.'
    severity: medium
- id: '1.17'
  title: Ensure 'Allow remote lock and erase' is set to 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: 'The allow remote lock and erase setting allows users to remotely lock their device with a new passcode or
