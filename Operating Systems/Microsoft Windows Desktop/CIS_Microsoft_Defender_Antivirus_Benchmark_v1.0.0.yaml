controls:
- id: 1.4.1
  title: Ensure 'Enable EDR in block mode' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This policy setting controls whether Microsoft Defender Antivirus Endpoint Detection and Response (EDR) is
    enabled in block mode (passive remediation). The recommended state for this setting is: Enabled. Note: This setting is
    available with Microsoft Defender Antivirus platform release v4.18.2202.X and newer.'
  rationale: When Microsoft Defender Antivirus is not the primary antivirus product and is running in passive mode, EDR in
    block mode provides added protection against malicious artifacts.
  impact: If Microsoft Defender Antivirus is running EDR will be enabled in block mode. If the system does not have Microsoft
    Defender Antivirus installed and running, then this setting will have no effect.
  references:
  - '1. GRID: MS-00000598'
  - 2. https://learn.microsoft.com/en-us/defender-endpoint/edr-in-block-mode
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Features:PassiveRemediation'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Policies\Administrative Templates\Windows

    Components\Microsoft Defender Antivirus\Features\Enable EDR in block mode

    Note: This Group Policy path is provided by the Group Policy template

    WindowsDefender.admx/adml that is included with the Microsoft Windows 11 Release

    24H2 Administrative Templates (or newer).'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 1.

      HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Features:PassiveRemediation'
    severity: medium
- id: 1.5.1
  title: Ensure 'Configure local setting override for reporting to Microsoft MAPS' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'This policy setting configures a local override for the configuration to join Microsoft Active Protection
    Service (MAPS), which Microsoft renamed to Windows Defender Antivirus Cloud Protection Service and then Microsoft Defender
    Antivirus Cloud Protection Service. The recommended state for this setting is: Disabled.'
  rationale: The decision on whether to participate in Microsoft MAPS / Microsoft Defender Antivirus Cloud Protection Service
    for malicious software reporting should be made centrally in an enterprise managed environment, so that all computers
    within it behave consistently in that regard. Configuring this setting to Disabled ensures that the decision remains centrally
    managed.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-cloud-protection-microsoft-defender-antivirus?view=o365worldwide
  - '2. GRID: MS-00000464'
  page_start: 23
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender\Spynet:LocalSettingOverrideSpynetReporting'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Windows

    Components\Microsoft Defender Antivirus\MAPS\Configure local setting override

    for reporting to Microsoft MAPS

    Note: This Group Policy path is provided by the Group Policy template

    WindowsDefender.admx/adml that is included with the Microsoft Windows 8.1 & Server

    2012 R2 Administrative Templates (or newer).'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender\Spynet:LocalSettingOverrideSpynetReporting'
    severity: medium
- id: 1.5.2
  title: Ensure 'Configure the 'Block at First Sight' feature' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'This policy setting configures whether the device checks (in real time) with the Microsoft Active Protection
    Service (MAPS) before allowing certain content to be run or accessed. The block at first sight feature works when Microsoft
    Defender Antivirus encounters a suspicious but undetected file. It then queries the Microsoft cloud protection backend
    and applies heuristics, machine learning, and automated analysis of the file to determine whether the files are malicious.
    The recommended state for this setting is: Enabled. Warning: This setting requires at least Microsoft Defender for Endpoint
    Plan 1 (Foundational enterprise endpoint protection) to function. If Plan 1 is not in use, an exception to this recommendation
    is required.'
  rationale: Enabling the Block at First Sight feature enhances threat protection by using next-generation protection to detect
    new malware and block it within seconds.
  impact: 'The block at first sight can block nonportable executable files (such as JS, VBS, or macros) and executable files,
    running the latest Defender antimalware platform on Windows or Windows Server. Note: The block at first sight feature
    requires the following Group Policy settings to be configured to function. • Join Microsoft MAPS must be enabled. • Send
    file samples when further analysis is required should be set to 1 (Send safe samples) or 3 (Send all samples) • Scan all
    downloaded files and attachments must be enabled. • Turn off real-time protection must NOT be enabled.'
  references:
  - 1. https://learn.microsoft.com/en-us/defender-endpoint/configure-block-at-first-sightmicrosoft-defender-antivirus
  - '2. GRID: MS-00000639'
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender\Spynet:DisableBlockAtFirstSeen'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Policies\Administrative Templates\Windows

    Components\Microsoft Defender Antivirus\MAPS\Configure the ''Block at First

    Sight'' feature

    Note: This Group Policy path is provided by the Group Policy template

    WindowsDefender.admx/adml that is included with the Microsoft Windows 8.1 & Server

    2012 R2 Administrative Templates (or newer).'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender\Spynet:DisableBlockAtFirstSeen'
    severity: medium
- id: 1.5.3
  title: 'Ensure ''Join Microsoft MAPS'' is set to ''Enabled: Advanced'''
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This policy setting configures Microsoft Active Protection Service (MAPS). Microsoft MAPS is designed to help
    Microsoft continually update and improve definitions of malware, spyware and other potentially unwanted software and to
    help Microsoft improve Windows Defender and related technologies. The recommended state for this setting is: Enabled:
    Advanced. Note: In Windows 10 and above, Basic membership is no longer available, so setting the value to 1 Basic, or
    2 Advanced, enrolls the device into Advanced membership. For more information, please visit: Turn on cloud protection
    in Microsoft Defender Antivirus - Microsoft Defender for Endpoint | Microsoft Learn. This policy setting configures the
    behavior of samples sent to Microsoft for submission when opt-in for MAPS telemetry is set. The recommended state for
    this setting is: Enabled: Send safe samples or Enabled: Send all samples.'
  rationale: Cloud protection works with Microsoft Defender Antivirus to provide intelligent, real-time threat detection.
    Microsoft strongly recommends enabling cloud protection, as several advanced security features in Microsoft Defender for
    Endpoint rely on it to function properly. To fully take advantage of these protections, including several ASR rules, this
    setting must be enabled to allow for MAPS reporting. For the Block at First Sight feature to function properly, the Send
    file samples when further analysis is required setting must be configured as prescribed.
  impact: MAPS will send detailed information about malware and potentially unwanted software, including the full path to
    the software, and detailed information about how the software has affected the device. Submitting samples carries a small
    risk that sensitive information may be inadvertently included.
  references:
  - 1. https://learn.microsoft.com/en-us/defender-endpoint/enable-cloud-protectionmicrosoft-defender-antivirus#use-group-policy-to-turn-on-cloud-protection
  - '2. GRID: MS-00000465'
  - '1. GRID: MS-00000640'
  page_start: 27
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 2.

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SpynetReporting

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 1 or 3.

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SubmitSamplesConsent'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: Advanced:

    Computer Configuration\Policies\Administrative Templates\Windows

    Components\Microsoft Defender Antivirus\MAPS\Join Microsoft MAPS

    Note: This Group Policy path is provided by the Group Policy template

    WindowsDefender.admx/adml that is included with the Microsoft Windows 8.1 & Server

    2012 R2 Administrative Templates (or newer).

    To establish the recommended configuration via GP, set the following UI path to

    Enabled: Send safe samples or Enabled: Send all samples:

    Computer Configuration\Policies\Administrative Templates\Windows

    Components\Microsoft Defender Antivirus\MAPS\Send file samples when further

    analysis is required

    Note: This Group Policy path is provided by the Group Policy template

    WindowsDefender.admx/adml that is included with the Microsoft Windows 8.1 & Server

    2012 R2 Administrative Templates (or newer).'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 2.

      HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SpynetReporting

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 1 or 3.

      HKLM\SOFTWARE\Policies'
    severity: medium
