- id: 1.6.1.2
  title: 'Ensure ''Configure Attack Surface Reduction rules: Set the state for each ASR rule'' is set to ''56a863a9-875e-4185-98a7b882c64b5ce5:1'''
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This rule prevents an application from writing a vulnerable signed driver to disk. Rule ID and name: • 56a863a9-875e-4185-98a7-b882c64b5ce5
    (Block abuse of exploited vulnerable signed drivers) The recommended state for this setting is: 56a863a9-875e-4185-98a7b882c64b5ce5:1
    (Block). Note: More information on ASR rules can be found at the following link: Use Attack surface reduction rules to
    prevent malware infection | Microsoft Docs Note #2: The Block abuse of exploited vulnerable signed drivers setting does
    not block a driver that already exists on the system from being loaded.'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect systems. Vulnerable signed drivers can be exploited by local applications that have sufficient privileges to gain
    access to the kernel. This enables threat actors to disable or circumvent security solutions, eventually leading to system
    compromise.
  impact: When a rule is triggered, a notification will be displayed from the Action Center.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-attack-surface-reduction?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/attack-surface-reduction?view=o365-worldwide
