- id: 1.6.1.5
  title: 'Ensure ''Configure Attack Surface Reduction rules: Set the state for each ASR rule'' is set to ''9e6c4e1f-7d60-472f-ba1aa39ef669e4b2:1'''
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This rule helps prevent credential stealing by locking down Local Security Authority Subsystem Service (LSASS).
    Rule ID and name: • 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 (Block credential stealing from the Windows local security authority
    subsystem (lsass.exe)) The recommended state for this setting is: 9e6c4e1f-7d60-472f-ba1aa39ef669e4b2:1 (Block). Note:
    More information on ASR rules can be found at the following link: Use Attack surface reduction rules to prevent malware
    infection | Microsoft Docs'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. LSASS authenticates users who sign in on a Windows computer. Microsoft Defender Credential Guard in Windows
    normally prevents attempts to extract credentials from LSASS. Some organizations can't enable Credential Guard on all
    of their computers because of compatibility issues with custom smartcard drivers or other programs that load into the
    Local Security Authority (LSA). In these cases, attackers can use tools like Mimikatz to scrape cleartext passwords and
    NTLM hashes from LSASS.
  impact: 'When a rule is triggered, a notification will be displayed from the Action Center. Note: Enabling this rule doesn''t
    provide additional protection if LSA protection is enabled since the ASR rule and LSA protection work similarly. However,
    when LSA protection cannot be enabled, this rule can be configured to provide equivalent protection against malware that
    target lsass.exe.'
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-attack-surface-reduction?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/attack-surface-reduction?view=o365-worldwide
