  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This rule blocks Adobe Reader from creating processes. Rule ID and name: • 7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c
    (Block Adobe Reader from creating child processes) The recommended state for this setting is: 7674ba52-37eb-4a4f-a9a1f0f9a1619a2c:1
    (Block). Note: More information on ASR rules can be found at the following link: Use Attack surface reduction rules to
    prevent malware infection | Microsoft Docs'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. Malware can download and launch payloads and break out of Adobe Reader through social engineering or
    exploits. By blocking child processes from being generated by Adobe Reader, malware attempting to use Adobe Reader as
    an attack vector are prevented from spreading.
  impact: When a rule is triggered, a notification will be displayed from the Action Center.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-attack-surface-reduction?view=o365-worldwide
