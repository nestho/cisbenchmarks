- id: 1.6.1.4
  title: 'Ensure ''Configure Attack Surface Reduction rules: Set the state for each ASR rule'' is set to ''d4f940ab-401b-4efc-aadcad5f3c50688a:2''
    or higher'
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This rule blocks Office apps from creating child processes. Office apps include Word, Excel, PowerPoint, OneNote,
    and Access. Rule ID and name: • d4f940ab-401b-4efc-aadc-ad5f3c50688a (Block all Office applications from creating child
    processes) The recommended state for this setting is: d4f940ab-401b-4efc-aadcad5f3c50688a:2 (Audit) or higher. Configuring
    this setting to d4f940ab-401b-4efcaadc-ad5f3c50688a:1 (Block) also conforms to the benchmark. Note: More information on
    ASR rules can be found at the following link: Use Attack surface reduction rules to prevent malware infection | Microsoft
    Docs'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. Creating malicious child processes is a common malware strategy. Malware that abuses Office as a vector
    often runs VBA macros and exploit code to download and attempt to run more payloads. However, some legitimate line-of-business
    applications might also generate child processes for benign purposes, such as spawning a command prompt or using PowerShell
    to configure registry settings.
  impact: 'When a rule is triggered, a notification will be displayed from the Action Center. Warning: Prior to configuring
    this rule in Block mode, it should be enabled in Audit mode to verify that it does not introduce issues, especially for
    Microsoft Outlook.'
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-attack-surface-reduction?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/attack-surface-reduction?view=o365-worldwide
  page_start: 40
