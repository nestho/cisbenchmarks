- id: 1.12.2
  title: Ensure 'Configure whether to report Dynamic Signature dropped events' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  - Level 1 - Server
  description: 'This policy setting configures whether to report Dynamic Signature dropped events. Dynamic Signature events
    are Microsoft Defender Antivirus log events that relate to cloud-delivered, on-demand threat signatures that Microsoft
    pushes to endpoints outside of the normal scheduled signature update cycle. The recommended state for this setting is:
    Enabled. This policy setting controls whether to check for new virus and spyware security intelligence before running
    a scan. The recommended state for this setting is: Enabled. Note: This setting applies to scheduled scans and has no effect
    on scans that are initiated manually from the user interface or to the ones that have been started from the command line
    using mpcmdrun -Scan.'
  rationale: Microsoft Defender Antivirus logs Dynamic Signature dropped events when it blocks or removes a file using a dynamically
    delivered signature, but the signature is not fully processed or applied and is subsequently discarded. This may indicate
    an issue with signature updates or with the system’s ability to properly receive or handle dynamic signatures. A malware
    scan is only as effective as the threat definitions it uses. Running a scan with outdated intelligence significantly reduces
    detection accuracy and can create a false sense of security.
  impact: Enabling dynamic signature dropped events will generate additional events when this feature is enabled. Checking
    for updated security intelligence can add a small amount of overhead before a scan begins.
  references:
  - 1. https://learn.microsoft.com/en-us/defender-endpoint/configure-notificationsmicrosoft-defender-antivirus
