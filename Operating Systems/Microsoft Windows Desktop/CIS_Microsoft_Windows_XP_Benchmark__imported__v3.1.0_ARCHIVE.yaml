  title: Configure 'DNS Client'
  scoring: manual
  profile:
  - Level 1
  description: 'The DNS Client service (dnscache) caches Domain Name System (DNS) names and registers the full computer name
    for this computer. If the service is stopped, DNS names will continue to be resolved. However, the results of DNS name
    queries will not be cached and the computer''s name will not be registered. If the service is disabled, any services that
    explicitly depend on it will fail to start. This policy setting checks all new passwords to ensure that they meet basic
    requirements for strong passwords. When this policy is enabled, passwords must meet the following minimum requirements:
    . Not contain the user''s account name or parts of the user''s full name that exceed two consecutive characters . Be at
    least six characters in length . Contain characters from three of the following four categories: . English uppercase characters
    (A through Z) . English lowercase characters (a through z) . Base 10 digits (0 through 9) . Non-alphabetic characters
    (for example, !, $, #, %) . A catch-all category of any Unicode character that does not fall under the previous four categories.
    This fifth category can be regionally specific. Each additional character in a password increases its complexity exponentially.
    For instance, a seven-character, all lower-case alphabetic password would have 267 (approximately 8 x 109 or 8 billion)
    possible combinations. At 1,000,000 attempts per second (a capability of many passwordcracking utilities), it would only
    take 133 minutes to crack. A seven-character alphabetic password with case sensitivity has 527 combinations. A seven-character
    case-sensitive alphanumeric password without punctuation has 627 combinations. An eight-character password has 268 (or
    2 x 1011) possible combinations. Although this might seem to be a large number, at 1,000,000 attempts per second it would
    take only 59 hours to try all possible passwords. Remember, these times will significantly increase for passwords that
    use ALT characters and other special keyboard characters such as ! or @. Proper use of the password settings can help
    make it difficult to mount a brute force attack. This policy setting determines the least number of characters that make
    up a password for a user account. There are many different theories about how to determine the best password length for
    an organization, but perhaps pass phrase is a better term than password. In Microsoft Windows 2000 or later, pass phrases
    can be quite long and can include spaces. Therefore, a phrase such as I want to drink a $5 milkshake is a valid pass phrase;
    it is a considerably stronger password than an 8 or 10 character string of random numbers and letters, and yet is easier
    to remember. Users must be educated about the proper selection and maintenance of passwords, especially with regard to
    password length. In enterprise environments, ensure that the value for the Minimum password length setting is configured
    to 8 characters. This policy setting is long enough to provide adequate security. In high security environments, configure
    the value to 12 characters. This policy setting determines the number of renewed, unique passwords that have to be associated
    with a user account before you can reuse an old password. The value for this policy setting must be between 0 and 24 passwords.
    The default value for Windows Vista is 0 passwords, but the default setting in a domain is 24 passwords. To maintain the
    effectiveness of this policy setting, use the Minimum password age setting to prevent users from repeatedly changing their
    password. This policy setting defines how long a user can use their password before it expires. Values for this policy
    setting range from 0 to 999 days. If you set the value to 0, the password will never expire. The default value for this
    policy setting is 42 days. Because attackers can crack passwords, the more frequently you change the password the less
    opportunity an attacker has to use a cracked password. However, the lower this value is set, the higher the potential
    for an increase in calls to help desk support due to users having to change their password or forgetting which password
    is current. This policy setting determines whether the operating system stores passwords in a way that uses reversible
    encryption, which provides support for application protocols that require knowledge of the user''s password for authentication
    purposes. Passwords that are stored with reversible encryption are essentially the same as plaintext versions of the passwords.
    This policy setting determines the number of days that you must use a password before you can change it. The range of
    values for this policy setting is between 1 and 999 days. (You may also set the value to 0 to allow immediate password
    changes.) The default value for this setting is 0 days. This policy setting determines the number of failed logon attempts
    before a lock occurs. Authorized users can lock themselves out of an account by mistyping their password or by remembering
    it incorrectly, or by changing their password on one computer while logged on to another computer. The computer with the
    incorrect password will continuously try to authenticate the user, and because the password it uses to authenticate is
    incorrect, a lock occurs. To avoid accidental lockout of authorized users, set the account lockout threshold to a high
    number. The default value for this policy setting is 0 invalid logon attempts, which disables the account lockout feature.
    Because it is possible for an attacker to use this lockout state as a denial of service (DoS) by triggering a lockout
    on a large number of accounts, your organization should determine whether to use this policy setting based on identified
    threats and the risks you want to mitigate. There are two options to consider for this policy setting. . Configure the
    value for Account lockout threshold to 0 to ensure that accounts will not be locked out. This setting value will prevent
    a DoS attack thattempts to lock out accounts in your organization. It will also reduce help desk calls, because users
    will not be able to lock themselves out of their accounts accidentally. However, this setting value will not prevent a
    brute force attack. The following defenses should also be considered: . A password policy that forces all users to have
    complex passwords made up of 8 or more characters. . A robust auditing mechanism, which will alert administrators when
    a series of account lockouts occurs in the environment. For example, the auditing solution should monitor for security
    event 539, which is a logon failure. This event identifies that there was a lock on the account at the time of the logon
    attempt. The second option is: . Configure the value for Account lockout threshold to a value that provides users with
    the ability to mistype their password several times, but locks out the account if a brute force password attack occurs.
    This configuration will prevent accidental account lockouts and reduce help desk calls, but will not prevent a DoS attack.
    This policy setting determines the length of time before the Account lockout threshold resets to zero. The default value
    for this policy setting is Not Defined. If the Account lockout threshold is defined, this reset time must be less than
    or equal to the value for the Account lockout duration setting. If you leave this policy setting at its default value
    or configure the value to an interval that is too long, your environment could be vulnerable to a DoS attack. An attacker
    could maliciously perform a number of failed logon attempts on all users in the organization, which will lock out their
    accounts. If no policy were determined to reset the account lockout, it would be a manual task for administrators. Conversely,
    if a reasonable time value is configured for this policy setting, users would be locked out for a set period until all
    of the accounts are unlocked automatically. This policy setting determines the length of time that must pass before a
    locked account is unlocked and a user can try to log on again. The setting does this by specifying the number of minutes
    a locked out account will remain unavailable. If the value for this policy setting is configured to 0, locked out accounts
    will remain locked out until an administrator manually unlocks them. Although it might seem like a good idea to configure
    the value for this policy setting to a high value, such a configuration will likely increase the number of calls that
    the help desk receives to unlock accounts locked by mistake. Users should be aware of the length of time a lock remains
    in place, so that they realize they only need to call the help desk if they have an extremely urgent need to regain access
    to their computer. This policy setting defines the set of Internet Control Message Protocol (ICMP) message types that
    Windows Firewall allows. Utilities can use ICMP messages to determine the status of other computers. For example, Ping
    uses the echo request message. Many organizations use Remote Desktop connections in their normal troubleshooting procedures
    or operations. To provide flexibility for remote administration, the Windows Firewall: Allow inbound Remote Desktop exceptions
    setting is available. Windows Firewall can display notifications to users when a program requests that Windows Firewall
    add the program to the program exceptions list. This situation occurs when programs attempt to open a port and are not
    allowed to do so because of current Windows Firewall rules. The Windows Firewall: Prohibit notifications setting determines
    whether these settings are shown to the users. If you configure this policy setting to Enabled, Windows Firewall prevents
    the display of these notifications. If you configure it to Disabled, Windows Firewall allows the display of these notifications.
    This policy setting helps prevent a computer from receiving unicast responses to its outgoing multicast or broadcast messages.
    Many organizations take advantage of remote computer administration in their daily operations. To provide flexibility
    for remote administration, the Windows Firewall: Allow inbound remote administration exception setting is available. If
    you enable this setting, computers in your environment should accept remote administration requests from as few computers
    as possible. To maximize the protection provided by Windows Firewall, make sure to specify only the necessary IP addresses
    and subnets of computers that are used for remote administration. This policy setting caused Windows Firewall to block
    all unsolicited incoming messages. It overrides all other Windows Firewall settings that allow such messages. If you enable
    this policy setting in the Windows Firewall item in Control Panel, the Don''t allow exceptions check box is selected and
    administrators cannot clear it. This policy setting creates an exception that allows file and printer sharing. It configures
    Windows Firewall to open UDP ports 137 and 138 and TCP ports 139 and 445. The Windows Firewall port exceptions list should
    be defined by Group Policy, which allows you to centrally manage and deploy your port exceptions and ensure that local
    administrators do not create less secure settings. Microsoft recommends that you avoid the use of this setting, unless
    required by your environment and your organization''s business requirements. The Windows Firewall port exceptions list
    should be defined by Group Policy, which allows you to centrally manage and deploy your port exceptions and ensure that
    local administrators do not create less secure settings. Microsoft recommends that you use this setting, if appropriate
    to your environment and your organization''s business requirements, to help protect end user computers. Some applications
    may need to open and use network ports that are not typically allowed by Windows Firewall. The Windows Firewall: Define
    inbound program exceptions setting allows you to view and change the program exceptions list that is defined by Group
    Policy. This policy setting allows a computer to receive unsolicited Plug and Play messages that are sent by network devices,
    such as routers with built-in firewalls. To receive these messages, Windows Firewall opens TCP port 2869 and UDP port
    1900. This policy setting enables Windows Firewall, which replaces Internet Connection Firewall on all computers that
    run Windows Vista. Microsoft recommends that you avoid the use of this setting, unless required by your environment and
    your organization''s business requirements. This policy setting controls whether administrators can use the Windows Firewall
    component in Control Panel to define a local program exceptions list. This policy setting defines the set of Internet
    Control Message Protocol (ICMP) message types that Windows Firewall allows. Utilities can use ICMP messages to determine
    the status of other computers. For example, Ping uses the echo request message. If you configure the Windows Firewall:
    Allow ICMP exceptions setting to Enabled, you must specify which ICMP message types Windows Firewall allows the computer
    to send or receive. When you configure this policy setting to Disabled, Windows Firewall blocks all unsolicited inbound
    ICMP message types and the listed outbound ICMP message types. As a result, utilities that rely on ICMP may fail. Many
    attacker tools take advantage of computers that accept ICMP message types and use these messages to mount a variety of
    attacks. However, some applications require some ICMP messages in order to function properly. Also, ICMP messages are
    used to estimate network performance when Group Policy is downloaded and processed; if ICMP messages are blocked, Group
    Policy may not be applied to affected systems. For that reason, it is recommended that you configure the Windows Firewall:
    Allow ICMP exceptions setting to Disabled whenever possible. If your environment requires some ICMP messages to get through
    Windows Firewall, configure this policy setting with the appropriate message types. Whenever the computer is on an untrusted
    network, the Windows Firewall: Allow ICMP exceptions setting should be configured to Disabled. Note If any policy setting
    opens TCP port 445, Windows Firewall allows inbound ICMP echo request messages (such as those sent by the Ping utility),
    even if the Windows Firewall: Allow ICMP exceptions policy setting would block them. Policy settings that can open TCP
    port 445 include Windows Firewall: Allow inbound file and printer sharing exception, Windows Firewall: Allow inbound remote
    administration exception, and Windows Firewall: Define inbound port exceptions. This policy setting controls whether administrators
    can use the Windows Firewall component in Control Panel to define a local program exceptions list. Microsoft recommends
    that you avoid the use of this setting, unless required by your environment and your organization''s business requirements.
    This policy setting allows a computer to receive unsolicited Plug and Play messages that are sent by network devices,
