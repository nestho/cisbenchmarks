    inbound program exceptions setting allows you to view and change the program exceptions list that is defined by Group
    Policy. Unless required by your environment and your organization''s business requirements you may wish to avoid using
    this setting because the notifications can help users to understand why certain applications aren''t working as expected.
    Windows Firewall can display notifications to users when a program requests that Windows Firewall add the program to the
