- id: 1.2.2.1.2
  title: Set 'RPC Endpoint Mapper Client Authentication' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: If you enable this policy setting, client computers that communicate with this computer are forced to provide
    authentication before RPC communication can be established. By default, RPC clients do not use authentication to communicate
    with the RPC Server Endpoint Mapper Service when they request the endpoint of a server.
  rationale: Anonymous access to RPC services could result in accidental disclosure of information to unauthenticated users.
  impact: RPC clients will be forced to authenticate before they can begin communicating with the desired RPC service, this
    means that anonymous access will not be available and RPC clients that do not support authentication will fail.
  references:
  - 1. CCE-2956-1
