- id: 1.2.2.3.2
  title: Set 'Offer Remote Assistance' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether a support person or an IT expert administrator can offer remote assistance
    to computers in your environment if a user does not explicitly request assistance first through a channel, such as e-mail,
    or Instant Messenger. Note The expert cannot connect to the computer unannounced or control it without permission from
    the user. When the expert tries to connect, the user can still choose to deny the connection or give the expert view-only
    privileges. The user must explicitly click the Yes button to allow the expert to remotely control the workstation after
    the Offer Remote Assistance setting is configured to Enabled. If this policy setting is enabled the following options
    are available: . Allow helpers to only view the computer . Allow helpers to remotely control the computer When you configure
    this policy setting, you can also specify a list of users or user groups known as helpers who may offer remote assistance.
    To configure the list of helpers 1. In the Offer Remote Assistance setting configuration window, click Show. A new window
    will open in which you can enter helper names. 2. Add each user or group to the Helper list in one of the following formats:
    . <Domain Name>\<User Name> . <Domain Name>\<Group Name> If this policy setting is disabled or not configured, users and
    or groups will not be able to offer unsolicited remote assistance to computer users in your environment. This policy setting
    controls whether the computer can download print driver packages over HTTP. To set up HTTP printing, printer drivers that
    are not available in the standard operating system installation might need to be downloaded over HTTP. This policy setting
    specifies whether Windows will search Windows Update for device drivers when no local drivers for a device are present.
    Note See also Turn off Windows Update device driver search prompt in Administrative Templates/System, which governs whether
    an administrator is prompted before Windows Update is searched for device drivers if a driver is not found locally. This
    policy setting specifies whether the tasks Publish this file to the Web, Publish this folder to the Web, and Publish the
    selected items to the Web are available from File and Folder Tasks in Windows folders. This policy setting controls whether
    Windows will download a list of providers for the Web publishing and online ordering wizards. This policy setting allows
    you to disable the client computer''s ability to print over HTTP, which allows the computer to print to printers on the
    intranet as well as the Internet. This policy setting specifies whether Windows Messenger can collect anonymous information
    about how the Windows Messenger software and service is used. This policy setting specifies whether Search Companion should
    automatically download content updates during local and Internet searches.'
  rationale: A user might be tricked and accept an unsolicited Remote Assistance offer from a malicious user. Users might
    download drivers that include malicious code. If users are able to download and install device drivers there is a small
    chance that they will install a driver that reduces system stability. There is an even smaller possibility that they will
    install a driver that includes malicious code. These risks are very low because Microsoft requires vendors to test drivers
    extensively before they can be published on Windows Update. Users may publish confidential or sensitive information to
    a public service outside of the control of the organization. Although the risk is minimal, enabling this setting will
    reduce the possibility of a user unknowingly downloading malicious content through this feature. Information that is transmitted
    over HTTP through this capability is not protected and can be intercepted by malicious users. For this reason, it is not
    often used in enterprise environments. Large enterprise environments may not want to have information collected from managed
    client computers. There is a small risk that users will unknowingly reveal sensitive information because of the topics
    they are searching for. This risk is very low because even if this setting is enabled users still must submit search queries
    to the desired search engine in order to perform searches.
  impact: Help desk and support personnel will not be able to proactively offer assistance, although they can still respond
    to user assistance requests. This policy setting does not prevent the client computer from printing to printers on the
    intranet or the Internet over HTTP. It only prohibits drivers that are not already installed locally from downloading.
    Users will not be able to download new or updated device drivers from Windows Update. The Web Publishing wizard is used
    to download a list of providers and allow users to publish content to the Web. If this policy setting is enabled, Windows
    is prevented from downloading providers; only the service providers cached in the local registry will display. If you
    enable this policy setting, the client computer will not be able to print to Internet printers over HTTP. This policy
    setting affects the client side of Internet printing only. Regardless of how it is configured, a computer could act as
    an Internet Printing server and make its shared printers available through HTTP. Microsoft uses information collected
    through the Customer Experience Improvement Program to detect software flaws so that they can be corrected more quickly,
    enabling this setting will reduce the amount of data Microsoft is able to gather for this purpose. Internet searches will
    still send the search text and information about the search to Microsoft and the chosen search provider. If you select
    Classic Search, the Search Companion feature will be unavailable. You can select Classic Search by clicking Start, Search,
    Change Preferences, and then Change Internet Search Behavior.
