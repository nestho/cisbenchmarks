    disabled. If this setting is enabled a screen saver will run if the following two conditions are met: first, that a valid
    screen saver is specified on the client via the Screen Saver Executable Name group policy setting or Control Panel on
    the client. Second, the screensaver timeout is set to a value greater than zero via the Screen Saver Timeout group policy
    setting or Control Panel on the client.'
  rationale: If a user forgets to lock their computer when they walk away its possible that a passerby will hijack it.
  impact: The screen saver will automatically activate when the computer has been unattended for the amount of time specified
    by the Screen Saver timeout setting.
