  rationale: 'Any service or application is a potential point of attack. Therefore, you should disable or remove any unneeded
    services or executable files in your environment. There are additional optional services available in Windows that are
    not installed during a default installation of the operating system. Depending on the version of Windows you can add these
    optional services to an existing computer through Add/Remove Programs in Control Panel, Programs and Features in Control
    Panel, Server Manager, or the Configure Your Server Wizard. Important: If you enable additional services, they may depend
    on other services. Add all of the services that are needed for a specific server role to the policy for the server role
    that it performs in your organization. Passwords that contain only alphanumeric characters are extremely easy to discover
    with several publicly available tools. Types of password attacks include dictionary attacks (which attempt to use common
    words and phrases) and brute force attacks (which try every possible combination of characters). Also, attackers sometimes
    try to obtain the account database so they can use tools to discover the accounts and passwords. The longer a user uses
    the same password, the greater the chance that an attacker can determine the password through brute force attacks. Also,
    any accounts that may have been compromised will remain exploitable for as long as the password is left unchanged. If
    password changes are required but password reuse is not prevented, or if users continually reuse a small number of passwords,
    the effectiveness of a good password policy is greatly reduced. If you specify a low number for this policy setting, users
    will be able to use the same small number of passwords repeatedly. If you do not also configure the Minimum password age
    setting, users might repeatedly change their passwords until they can reuse their original password. The longer a password
    exists the higher the likelihood that it will be compromised by a brute force attack, by an attacker gaining general knowledge
    about the user, or by the user sharing the password. Configuring the Maximum password age setting to 0 so that users are
    never required to change their passwords is a major security risk because that allows a compromised password to be used
    by the malicious user for as long as the valid user is authorized access. Enabling this policy setting allows the operating
    system to store passwords in a weaker format that is much more susceptible to compromise and weakens your system security.
    Users may have favorite passwords that they like to use because they are easy to remember and they believe that their
    password choice is secure from compromise. Unfortunately, passwords are compromised and if an attacker is targeting a
    specific individual user account, with foreknowledge of data about that user, reuse of old passwords can cause a security
    breach. To address password reuse a combination of security settings is required. Using this policy setting with the Enforce
    password history setting prevents the easy reuse of old passwords. For example, if you configure the Enforce password
    history setting to ensure that users cannot reuse any of their last 12 passwords, they could change their password 13
    times in a few minutes and reuse the password they started with, unless you also configure the Minimum password age setting
    to a number that is greater than 0. You must configure this policy setting to a number that is greater than 0 for the
    Enforce password history setting to be effective. Password attacks can use automated methods to try millions of password
    combinations for any user account. The effectiveness of such attacks can be almost eliminated if you limit the number
    of failed logons that can be performed. However, a denial of service (DoS) attack could be performed on a domain that
    has an account lockout threshold configured. An attacker could programmatically attempt a series of password attacks against
    all users in the organization. If the number of attempts is greater than the account lockout threshold, the attacker might
    be able to lock out every account. Users can accidentally lock themselves out of their accounts if they mistype their
    password multiple times. To reduce the chance of such accidental lockouts, the Reset account lockout counter after setting
    determines the number of minutes that must elapse before the counter that tracks failed logon attempts and triggers lockouts
    is reset to 0. A denial of service (DoS) condition can be created if an attacker abuses the Account lockout threshold
    and repeatedly attempts to log on with a specific account. Once you configure the Account lockout threshold setting, the
    account will be locked out after the specified number of failed attempts. If you configure the Account lockout duration
    setting to 0, then the account will remain locked out until an administrator unlocks it manually. Many attacker tools
    take advantage of computers that accept ICMP message types and use these messages to mount a variety of attacks. Some
    attacks have exploited the ports that are typically used by Remote Desktop. Some organizations may prefer to avoid alarming
    users when firewall rules block certain types of network activity. Typically, you would not want to receive unicast responses
    to multicast or broadcast messages. Such responses can indicate a denial of service (DoS) attack or an attempt to probe
    a known computer. Some attacks have exploited the ports that are typically used by remote administration programs; Windows
    Firewall can help block these ports. This policy setting provides a strong defense against external attackers and should
    be set to Enabled in situations in which you require complete protection from external attacks, such as the outbreak of
    a new network worm. If you set this policy setting to Disabled, Windows Firewall will be able to apply other policy settings
    that allow unsolicited incoming messages. Enabling access to file and printer sharing could cause a user to unknowingly
    expose sensitive data. Additionally, there have been vulnerabilities in the resource sharing features that have been remotely
    exploitable. Granting port exeptions could expose the computer to network-based attacks, however not allowing any exceptions
    is likely to break some applications such as computer management tools Granting port exeptions could expose the computer
    to network-based attacks, however not allowing any exceptions is likely to break some applications such as computer management
    tools There is risk that inbound exceptions will be made to programs that have software vulnerabilities, however, if exceptions
    are not allowed then management programs and other useful applications will fail. Blocking UPnP network traffic effectively
    reduces the attack surface of computers in your environment. If Windows Firewall: Protect all network connections is configured
    to Disabled, Windows Firewall is turned off and all other settings for Windows Firewall are ignored. This exposes the
    computer to potential network-based attacks. Granting program exeptions could expose the computer to network-based attacks,
    however not allowing any exceptions is likely to break some applications such as computer management tools Many attacker
    tools take advantage of computers that accept ICMP message types and use these messages to mount a variety of attacks.
    Granting program exeptions could expose the computer to network-based attacks, however not allowing any exceptions is
    likely to break some applications such as computer management tools Blocking UPnP network traffic effectively reduces
    the attack surface of computers in your environment. Granting port exeptions could expose the computer to network-based
    attacks, however not allowing any exceptions is likely to break some applications such as computer management tools There
    is risk that inbound exceptions will be made to programs that have software vulnerabilities, however, if exceptions are
    not allowed then management programs and other useful applications will fail. Some organizations may prefer to avoid alarming
    users when firewall rules block certain types of network activity. Typically, you would not want to receive unicast responses
    to multicast or broadcast messages. Such responses can indicate a denial of service (DoS) attack or an attempt to probe
    a known computer. Some attacks have exploited the ports that are typically used by remote administration programs; Windows
    Firewall can help block these ports. This policy setting provides a strong defense against external attackers and should
    be set to Enabled in situations in which you require complete protection from external attacks, such as the outbreak of
    a new network worm. If you set this policy setting to Disabled, Windows Firewall will be able to apply other policy settings
    that allow unsolicited incoming messages. If Windows Firewall: Protect all network connections is configured to Disabled,
    Windows Firewall is turned off and all other settings for Windows Firewall are ignored. This exposes the computer to potential
    network-based attacks. Some attacks have exploited the ports that are typically used by Remote Desktop. Enabling access
    to file and printer sharing could cause a user to unknowingly expose sensitive data. Additionally, there have been vulnerabilities
    in the resource sharing features that have been remotely exploitable. Granting port exeptions could expose the computer
    to network-based attacks, however not allowing any exceptions is likely to break some applications such as computer management
    tools'
  impact: 'If some services (such as the Security Accounts Manager) are disabled, you will not be able to restart the computer.
    If other critical services are disabled, the computer may not be able to authenticate with domain controllers. If you
    wish to disable some system services, you should test the changed settings on non-production computers before you change
    them in a production environment. It is also possible to alter the access control list (ACL) for a service, however do
    so with caution because unexpected results may arise. For example, changing the default permissions may cause enterprise
    management software to lose the ability to query the state of that service. If the default password complexity configuration
    is retained, additional help desk calls for locked-out accounts could occur because users might not be accustomed to passwords
    that contain non-alphabetic characters. However, all users should be able to comply with the complexity requirement with
    minimal difficulty. If your organization has more stringent security requirements, you can create a custom version of
    the Passfilt.dll file that allows the use of arbitrarily complex password strength rules. For example, a custom password
    filter might require the use of non-upper row characters. (Upper row characters are those that require you to hold down
    the SHIFT key and press any of the digits between 1 and 0.) A custom password filter might also perform a dictionary check
    to verify that the proposed password does not contain common dictionary words or fragments. Also, the use of ALT key character
    combinations can greatly enhance the complexity of a password. However, such stringent password requirements can result
    in unhappy users and an extremely busy help desk. Alternatively, your organization could consider a requirement for all
    administrator passwords to use ALT characters in the 01280159 range. (ALT characters outside of this range can represent
    standard alphanumeric characters that would not add additional complexity to the password.) Requirements for extremely
    long passwords can actually decrease the security of an organization, because users might leave the information in an
    insecure location or lose it. If very long passwords are required, mistyped passwords could cause account lockouts and
    increase the volume of help desk calls. If your organization has issues with forgotten passwords due to password length
    requirements, consider teaching your users about pass phrases, which are often easier to remember and, due to the larger
    number of character combinations, much harder to discover. Note: Older versions of Windows such as Windows 98 and Windows
    NT® 4.0 do not support passwords that are longer than 14 characters. Computers that run these older operating systems
    are unable to authenticate with computers or domains that use accounts that require long passwords. The major impact of
    this configuration is that users must create a new password every time they are required to change their old one. If users
    are required to change their passwords to new unique values, there is an increased risk of users who write their passwords
    somewhere so that they do not forget them. Another risk is that users may create passwords that change incrementally (for
    example, password01, password02, and so on) to facilitate memorization but make them easier to guess. Also, an excessively
    low value for the Minimum password age setting will likely increase administrative overhead, because users who forget
    their passwords might ask the help desk to reset them frequently. If the Maximum password age setting is too low, users
    are required to change their passwords very often. Such a configuration can reduce security in the organization, because
    users might write their passwords in an insecure location or lose them. If the value for this policy setting is too high,
    the level of security within an organization is reduced because it allows potential attackers more time in which to discover
    user passwords or to use compromised accounts. If your organization uses either the CHAP authentication protocol through
    remote access or IAS services or Digest Authentication in IIS, you must configure this policy setting to Enabled. This
    setting is extremely dangerous to apply through Group Policy on a user-by-user basis, because it requires the appropriate
    user account object to be opened in Active Directory Users and Computers. If an administrator sets a password for a user
    but wants that user to change the password when the user first logs on, the administrator must select the User must change
    password at next logon check box, or the user will not be able to change the password until the next day. If this policy
    setting is enabled, a locked-out account will not be usable until it is reset by an administrator or until the account
    lockout duration expires. This setting will likely generate a number of additional help desk calls. In fact, locked accounts
    cause the greatest number of calls to the help desk in many organizations. If you enforce this setting an attacker could
    cause a denial of service condition by deliberately generating failed logons for multiple user, therefore you should also
    configure the Account Lockout Duration to a relatively low value such as 15 minutes. If you configure the Account Lockout
    Threshold to 0, there is a possibility that an attacker''s attempt to discover passwords with a brute force password attack
    might go undetected if a robust audit mechanism is not in place. If you do not configure this policy setting or if the
    value is configured to an interval that is too long, a denial of service (DoS) attack could occur. An attacker could maliciously
    attempt to log on to each user''s account numerous times and lock out their accounts as described in the preceding paragraphs.
    If you do not configure the Reset account lockout counter after setting, administrators would have to manually unlock
    all accounts. If you configure this policy setting to a reasonable value the users would be locked out for some period,
    after which their accounts would unlock automatically. Be sure that you notify users of the values used for this policy
    setting so that they will wait for the lockout timer to expire before they call the help desk about their inability to
    log on. Although it may seem like a good idea to configure this policy setting to never automatically unlock an account,
    such a configuration can increase the number of requests that your organization''s help desk receives to unlock accounts
    that were locked by mistake. If you configure the Windows Firewall: Allow ICMP exceptions setting to Enabled, you must
    specify which ICMP message types Windows Firewall allows the computer to send or receive. When you configure this policy
    setting to Disabled, Windows Firewall blocks all unsolicited inbound ICMP message types and the listed outbound ICMP message
    types. As a result, utilities that rely on ICMP may fail. Some applications require some ICMP messages in order to function
    properly. Also, ICMP messages are used to estimate network performance when Group Policy is downloaded and processed;
    if ICMP messages are blocked, Group Policy may not be applied to affected systems. Note If any policy setting opens TCP
    port 445, Windows Firewall allows inbound ICMP echo request messages (such as those sent by the Ping utility), even if
    the Windows Firewall: Allow ICMP exceptions policy setting would block them. Policy settings that can open TCP port 445
    include Windows Firewall: Allow inbound file and printer sharing exception, Windows Firewall: Allow inbound remote administration
    exception, and Windows Firewall: Define inbound port exceptions. If you enable this policy setting, Windows Firewall opens
    TCP port 3389 for inbound connections. You must also specify the IP addresses or subnets from which these inbound messages
    are allowed. If you disable this policy setting, Windows Firewall blocks this port and prevents the computer from receiving
    Remote Desktop requests. If an administrator adds this port to a local port exceptions list in an attempt to open it,
    Windows Firewall does not open the port. Computers in your environment should accept Remote Desktop requests from as few
    computers as possible. If you configure this policy setting to Enabled, Windows Firewall prevents the display of these
    notifications. If you configure it to Disabled, Windows Firewall allows the display of these notifications. Note This
    policy setting has no effect if the unicast message is a response to a DHCP broadcast message that is sent by the computer.
    Windows Firewall always permits those DHCP responses. However, this policy setting can interfere with the NetBIOS messages
    that detect name conflicts. If this policy setting is enabled, the computer can receive the unsolicited incoming messages
    that are associated with remote administration on TCP ports 135 and 445. This policy setting also allows Svchost.exe and
    Lsass.exe to receive unsolicited incoming messages and allows hosted services to open additional dynamicallyassigned ports,
    typically in the range of 1024 to 1034 but potentially anywhere from 1024 to 65535. If you enable this policy setting,
    you need to specify the IP addresses or subnets from which these incoming messages are allowed. If you configure the Windows
    Firewall: Allow inbound remote administration exception setting to Disabled, Windows Firewall makes none of the described
    exceptions. The impact of configuring this policy setting to Disabled may be unacceptable to many organizations because
    many remote administration tools and tools that scan for vulnerabilities will fail. Many environments contain applications
