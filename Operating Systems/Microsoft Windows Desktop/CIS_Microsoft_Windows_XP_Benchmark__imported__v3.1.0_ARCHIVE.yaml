    This policy setting caused Windows Firewall to block all unsolicited incoming messages. It overrides all other Windows
    Firewall settings that allow such messages. If you enable this policy setting in the Windows Firewall item in Control
    Panel, the Don''t allow exceptions check box is selected and administrators cannot clear it. This policy setting enables
    Windows Firewall, which replaces Internet Connection Firewall on all computers that run Windows Vista. Many organizations
    use Remote Desktop connections in their normal troubleshooting procedures or operations. To provide flexibility for remote
    administration, the Windows Firewall: Allow inbound Remote Desktop exceptions setting is available. This policy setting
    creates an exception that allows file and printer sharing. It configures Windows Firewall to open UDP ports 137 and 138
    and TCP ports 139 and 445. The Windows Firewall port exceptions list should be defined by Group Policy, which allows you
