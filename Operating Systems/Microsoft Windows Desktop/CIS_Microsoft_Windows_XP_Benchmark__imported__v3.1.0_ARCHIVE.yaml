- id: 1.1.1.2.9
  title: Set 'Maximum security log size' to '81920'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting specifies the maximum size of the System event log. In Windows Vista and Windows Server
    2008 this setting has been replaced by another called System, located at Computer Configuration\Administrative Templates\Windows
    Components\Event Log Service. If both this setting and the new one are configured the setting at Computer Configuration\Administrative
    Templates\Windows Components\Event Log Service will take precedence.
  rationale: 'If you significantly increase the number of objects to audit in your organization, there is a risk that the
    Security log will reach its capacity and force the computer to shut down if you enabled the Audit: Shut down system immediately
    if unable to log security audits setting. If such a shutdown occurs, the computer will be unusable until an administrator
    clears the Security log. To prevent such a shutdown, you can disable the Audit: Shut down system immediately if unable
    to log security audits setting that is described in Chapter 5, "Security Options," and increase the Security log size.
    Alternatively, you can configure automatic log rotation as described in the Microsoft Knowledge Base article "The event
    log stops logging events before reaching the maximum log size" at http://support.microsoft.com/default.aspx?kbid=312571.'
  impact: When event logs fill to capacity, they will stop recording information unless the retention method for each is set
