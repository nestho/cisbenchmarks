  description: This setting determines how applications become enrolled in structured exception handler overwrite protection
    (SEHOP).
  rationale: When a software component suffers from a memory corruption vulnerability, an exploit may be able to overwrite
    memory that contains data structures that control how the software handles exceptions. By corrupting these structures
    in a controlled manner, an exploit may be able to execute arbitrary code. SEHOP verifies the integrity of those structures
