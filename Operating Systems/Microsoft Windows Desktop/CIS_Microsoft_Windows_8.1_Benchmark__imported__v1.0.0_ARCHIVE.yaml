- id: 17.1.1
  title: 'Set ''Audit Policy: Account Logon: Credential Validation'' to ''Success and Failure'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This subcategory reports the results of validation tests on credentials submitted for a user account logon
    request. These events occur on the computer that is authoritative for the credentials. For domain accounts, the domain
    controller is authoritative, whereas for local accounts, the local computer is authoritative. In domain environments,
    most of the Account Logon events occur in the Security log of the domain controllers that are authoritative for the domain
    accounts. However, these events can occur on other computers in the organization when local accounts are used to log on.
    Events for this subcategory include: 4774: An account was mapped for logon. 4775: An account could not be mapped for logon.
    4776: The domain controller attempted to validate the credentials for an account. 4777: The domain controller failed to
    validate the credentials for an account. Refer to the Microsoft Knowledgebase article Description of security events in
    Windows Vista and in Windows Server 2008 for the most recent information about this setting: http://support.microsoft.com/default.aspx/kb/947226.
    The recommended state for this setting is: Success and Failure.'
  rationale: 'If audit settings are not configured, it can be difficult or impossible to determine what occurred during a
    security incident. However, if audit settings are configured so that events are generated for all activities the Security
    log will be filled with data and hard to use. Also, you can use a large amount of data storage as well as adversely affect
    overall computer performance if you configure audit settings for a large number of objects. If failure auditing is used
    and the Audit: Shut down system immediately if unable to log security audits setting in the Security Options section of
    Group Policy is enabled, an attacker could generate millions of failure events such as logon failures in order to fill
    the Security log and force the computer to shut down, creating a Denial of Service. If security logs are allowed to be
    overwritten, an attacker can overwrite part or all of their activity by generating large numbers of events so that the
    evidence of their intrusion is overwritten.'
  impact: If no audit settings are configured, or if audit settings are too lax on the computers in your organization, security
    incidents might not be detected or not enough evidence will be available for network forensic analysis after security
    incidents occur. However, if audit settings are too severe, critically important entries in the Security log may be obscured
    by all of the meaningless entries and computer performance and the available amount of data storage may be seriously affected.
    Companies that operate in certain regulated industries may have legal obligations to log certain events or activities.
  references:
  - 1. CCE-35494-4
  page_start: 310
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Success and Failure.

    Computer Configuration\Windows Settings\Security Settings\Advanced Audit

    Policy Configuration\Audit Policies\Account Logon\Audit Policy: Account

    Logon: Credential Validation'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
