    negotiated. - Require NTLMv2 session security. The connection will fail if the NTLMv2 protocol is not negotiated. - Not
    Defined. The recommended state for this setting is: Require NTLMv2 session security,Require 128-bit encryption.'
  rationale: Unsigned network traffic is susceptible to man-in-the-middle attacks in which an intruder captures the packets
    between the client and server, modifies them, and then forwards them to the server. For an LDAP server, this susceptibility
    means that an attacker could cause a server to make decisions that are based on false or altered data from the LDAP queries.
    To lower this risk in your network, you can implement strong physical security measures to protect the network infrastructure.
    Also, you can make all types of man-inthe-middle attacks extremely difficult if you require digital signatures on all
    network packets by means of IPsec authentication headers. You can enable all of the options for this policy setting to
    help protect network traffic that uses the NTLM Security Support Provider (NTLM SSP) from being exposed or tampered with
    by an attacker who has gained access to the same network. In other words, these options help protect against man-in-the-middle
    attacks. You can enable all of the options for this policy setting to help protect network traffic that uses the NTLM
    Security Support Provider (NTLM SSP) from being exposed or tampered with by an attacker who has gained access to the same
    network. That is, these options help protect against man-in-the-middle attacks.
  impact: If you configure the server to require LDAP signatures you must also configure the client. If you do not configure
    the client it will not be able to communicate with the server, which could cause many features to fail, including user
    authentication, Group Policy, and logon scripts. Client applications that are enforcing these settings will be unable
    to communicate with older servers that do not support them. This setting could impact Windows Clustering when applied
    to servers running Windows Server 2003, see "How to apply more restrictive security settings on a Windows Server 2003-based
    cluster server" at http://support.microsoft.com/default.aspx?scid=kb;en-us;891597 and "You receive an "Error 0x8007042b"
    error message when you add or join a node to a cluster if you use NTLM version 2 in Windows Server 2003" at http://support.microsoft.com/kb/890761/
    for more information on possible issues and how to resolve them. Server applications that are enforcing these settings
    will be unable to communicate with older servers that do not support them. This setting could impact Windows Clustering
