- id: 2.3.12.2
  title: 'Set ''Network security: Allow LocalSystem NULL session fallback'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'Allow NTLM to fall back to NULL session when used with LocalSystem. The default is TRUE up to Windows Vista
    and FALSE in Windows 7. The recommended state for this setting is: Disabled. Windows 7 and Windows Server 2008 R2 introduce
    an extension to the Negotiate authentication package, Spnego.dll. In previous versions of Windows, Negotiate decides whether
    to use Kerberos or NTLM for authentication. The extension SSP for Negotiate, Negoexts, which is treated as an authentication
    protocol by Windows, supports Microsoft SSPs including PKU2U. You can also develop or add other SSPs. When computers are
    configured to accept authentication requests by using online IDs, Negoexts.dll calls the PKU2U SSP on the computer that
    is used to log on. The PKU2U SSP obtains a local certificate and exchanges the policy between the peer computers. When
    validated on the peer computer, the certificate within the metadata is sent to the logon peer for validation and associates
    the user''s certificate to a security token and the logon process completes. This policy will be turned off by default
    on domain joined machines. This would disallow the online identities to be able to authenticate to the domain joined machine
    in Windows 7. The recommended state for this setting is: Disabled. This policy setting allows you to set the encryption
    types that Kerberos is allowed to use. This policy is supported on at least Windows 7 or Windows Server 2008 R2. The recommended
    state for this setting is: RC4\\AES128\\AES256\\Future types.'
  rationale: NULL sessions are less secure because by definition they are unauthenticated. The PKU2U protocol is a peer-to-peer
    authentication protocol, in most managed networks authentication should be managed centrally. The strength of each encryption
    algorithm varies from one to the next, choosing stronger algorithms will reduce the risk of compromise however doing so
    may cause issues when the computer attempts to authenticate with systems that do not support them.
  impact: Any applications that require NULL sessions for LocalSystem will not work as designed. Disabling this setting will
    disallow the online identities to be able to authenticate to the domain joined machine in Windows 7. If not selected,
    the encryption type will not be allowed. This setting may affect compatibility with client computers or services and applications.
    Multiple selections are permitted.
