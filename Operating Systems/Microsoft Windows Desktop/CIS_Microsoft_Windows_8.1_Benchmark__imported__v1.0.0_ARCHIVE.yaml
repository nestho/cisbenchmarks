      prescribed.'
    severity: medium
- id: 2.3.1.2
  title: 'Set ''Accounts: Block Microsoft accounts'' to ''Users can''t add or log on with Microsoft accounts'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting prevents users from adding new Microsoft accounts on this computer. If you select the
    "Users can''t add Microsoft accounts" option, users will not be able to create new Microsoft accounts on this computer,
    switch a local account to a Microsoft account, or connect a domain account to a Microsoft account. This is the preferred
    option if you need to limit the use of Microsoft accounts in your enterprise. If you select the "Users can''t add or log
    on with Microsoft accounts" option, existing Microsoft account users will not be able to log on to Windows. Selecting
    this option might make it impossible for an existing administrator on this computer to log on and manage the system. If
    you disable or do not configure this policy (recommended), users will be able to use Microsoft accounts with Windows.
    The recommended state for this setting is: Users can''t add or log on with Microsoft accounts.'
  rationale: Organizations that want to effectively implement identity management policies and maintain firm control of what
    accounts are used to log onto their computers will probably want to block Microsoft accounts. Organizations may also need
