  description: This policy setting allows encrypted items to be indexed. If you enable this policy setting, indexing will
    attempt to decrypt and index the content (access restrictions will still apply). If you disable this policy setting, the
    search service components (including non-Microsoft components) are expected not to index encrypted items or encrypted
    stores. This policy setting is not configured by default. If you do not configure this policy setting, the local setting,
