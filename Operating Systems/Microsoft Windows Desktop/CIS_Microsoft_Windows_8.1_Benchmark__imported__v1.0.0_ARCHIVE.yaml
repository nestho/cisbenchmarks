- id: 2.3.14.2
  title: 'Set ''Shutdown: Clear virtual memory pagefile'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting determines whether the virtual memory pagefile is cleared when the system is shut down.
    When this policy setting is enabled, the system pagefile is cleared each time that the system shuts down properly. If
    you enable this security setting, the hibernation file (Hiberfil.sys) is zeroed out when hibernation is disabled on a
    portable computer system. It will take longer to shut down and restart the computer, and will be especially noticeable
    on computers with large paging files. The recommended state for this setting is: Disabled.'
  rationale: Important information that is kept in real memory may be written periodically to the page file to help Windows
    Server 2003 handle multitasking functions. An attacker who has physical access to a server that has been shut down could
    view the contents of the paging file. The attacker could move the system volume into a different computer and then analyze
    the contents of the paging file. Although this process is time consuming, it could expose data that is cached from random
    access memory (RAM) to the paging file. Caution An attacker who has physical access to the server could bypass this countermeasure
    by simply unplugging the server from its power source.
  impact: It will take longer to shut down and restart the server, especially on servers with large paging files. For a server
    with 2 gigabytes (GB) of RAM and a 2-GB paging file, this policy setting could increase the shutdown process by 20 to
    30 minutes, or more. For some organizations, this downtime violates their internal service level agreements. Therefore,
    use caution before you implement this countermeasure in your environment.
  references:
