- id: 2.3.12.8
  title: 'Set ''Network security: LDAP client signing requirements'' to ''Negotiate signing'' or higher'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting determines the level of data signing that is requested on behalf of clients that issue
    LDAP BIND requests, as follows: - None. The LDAP BIND request is issued with the caller-specified options. - Negotiate
    signing. If Transport Layer Security/Secure Sockets Layer (TLS/SSL) has not been started, the LDAP BIND request is initiated
    with the LDAP data signing option set in addition to the callerspecified options. If TLS/SSL has been started, the LDAP
    BIND request is initiated with the caller-specified options. - Require signature. This level is the same as Negotiate
    signing. However, if the LDAP server''s intermediate saslBindInProgress response does not indicate that LDAP traffic signing
    is required, the caller is told that the LDAP BIND command request failed. Note: This policy setting does not have any
    impact on ldap_simple_bind or ldap_simple_bind_s. No Microsoft LDAP clients that are included with Windows XP Professional
    use ldap_simple_bind or ldap_simple_bind_s to communicate with a domain controller. The possible values for the Network
    security: LDAP client signing requirements setting are: - None - Negotiate signing - Require signature - Not Defined The
    recommended state for this setting is: Negotiate signing. This policy setting determines which behaviors are allowed for
    applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI) is used by applications that need
    authentication services. The setting does not modify how the authentication sequence works but instead require certain
    behaviors in applications that use the SSPI. The possible values for the Network security: Minimum session security for
    NTLM SSP based (including secure RPC) clients setting are: - Require message confidentiality. This option is only available
    in Windows XP and Windows Server 2003, the connection will fail if encryption is not negotiated. Encryption converts data
    into a form that is not readable until decrypted. - Require message integrity. This option is only available in Windows
    XP and Windows Server 2003, the connection will fail if message integrity is not negotiated. The integrity of a message
    can be assessed through message signing. Message signing proves that the message has not been tampered with; it attaches
    a cryptographic signature that identifies the sender and is a numeric representation of the contents of the message. -
    Require 128-bit encryption. The connection will fail if strong encryption (128-bit) is not negotiated. - Require NTLMv2
    session security. The connection will fail if the NTLMv2 protocol is not negotiated. - Not Defined. The recommended state
    for this setting is: Require NTLMv2 session security,Require 128-bit encryption. This policy setting determines which
    behaviors are allowed for applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI) is used
    by applications that need authentication services. The setting does not modify how the authentication sequence works but
    instead require certain behaviors in applications that use the SSPI. The possible values for the Network security: Minimum
