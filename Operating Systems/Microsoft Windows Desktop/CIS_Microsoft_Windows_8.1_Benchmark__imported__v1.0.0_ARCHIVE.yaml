- id: 18.8.10.4
  title: Set 'Choose drive encryption method and cipher strength' to 'Enabled:AES 256-bit'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  description: 'This policy setting allows you to configure the algorithm and cipher strength used by BitLocker Drive Encryption.
    This policy setting is applied when you turn on BitLocker. Changing the encryption method has no effect if the drive is
    already encrypted or if encryption is in progress. Consult the BitLocker Drive Encryption Deployment Guide on Microsoft
    TechNet for more information about the encryption methods available. This policy is only applicable to computers running
    Windows 8 Consumer Preview and later. If you enable this policy setting you will be able to choose an encryption algorithm
    and key cipher strength for BitLocker to use to encrypt drives. If you disable or do not configure this policy setting,
    BitLocker will use AES with the same bit strength (128-bit or 256-bit) as the "Choose drive encryption method and cipher
    strength (Windows Vista, Windows Server 2008, Windows 7)" policy setting, if it is set. If neither policy is set, BitLocker
    will use the default encryption method of AES 128-bit or the encryption method specified by the setup script. The recommended
    state for this setting is: Enabled: AES 256-bit.'
  rationale: The use of AES 128 bit key is likely to be strong enough for the majority of applications, but those requiring
    the highest level of security may find this setting suboptimal.
  impact: Using AES 256 will in most cases not significantly impact initial encryption speed and overall computer performance
    when used.
  references:
  - 1. CCE-32952-4
