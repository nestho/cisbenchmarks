  description: 'The recovery console is a command-line environment that is used to recover from system problems. If you enable
    this policy setting, the administrator account is automatically logged on to the recovery console when it is invoked during
    startup. The recommended state for this setting is: Disabled.'
  rationale: The Recovery Console can be very useful when you need to troubleshoot and repair computers that do not start.
    However, it is dangerous to allow automatic logon to the console. Anyone could walk up to the server, disconnect the power
