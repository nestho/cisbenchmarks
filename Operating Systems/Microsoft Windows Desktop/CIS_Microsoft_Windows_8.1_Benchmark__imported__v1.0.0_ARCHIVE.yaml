    it will be checked for valid identification field and allowed identification fields. These fields are defined by the "Provide
    the unique identifiers for your organization" policy setting. If you disable or do not configure this policy setting,
    all removable data drives on the computer will be mounted with read and write access. The recommended state for this setting
