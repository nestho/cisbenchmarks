- id: 2.3.18.6
  title: 'Set ''User Account Control: Only elevate executables that are signed and validated'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting enforces public key infrastructure (PKI) signature checks for any interactive applications
    that request elevation of privilege. Enterprise administrators can control which applications are allowed to run by adding
    certificates to the Trusted Publishers certificate store on local computers. The options are: - Enabled: Enforces the
    PKI certification path validation for a given executable file before it is permitted to run. - Disabled: (Default) Does
    not enforce PKI certification path validation before a given executable file is permitted to run. The recommended state
    for this setting is: Disabled. This policy setting controls whether applications that request to run with a User Interface
    Accessibility (UIAccess) integrity level must reside in a secure location in the file system. Secure locations are limited
    to the following: - …\Program Files\, including subfolders - …\Windows\system32\ - …\Program Files (x86)\, including subfolders
    for 64-bit versions of Windows Note: Windows enforces a public key infrastructure (PKI) signature check on any interactive
    application that requests to run with a UIAccess integrity level regardless of the state of this security setting. The
    options are: - Enabled: (Default) If an application resides in a secure location in the file system, it runs only with
    UIAccess integrity. - Disabled: An application runs with UIAccess integrity even if it does not reside in a secure location
    in the file system. The recommended state for this setting is: Enabled.'
  rationale: 'Intellectual property, personally identifiable information, and other confidential data are normally manipulated
    by applications on the computer and require elevated credentials to get access to the information. Users and administrators
    inherently trust applications used with these information sources and provide their credentials. If one of these applications
    is replaced by a rogue application that appears identical to the trusted application the confidential data could be compromised
    and the user''s administrative credentials would also be compromised. UIAccess Integrity allows an application to bypass
    User Interface Privilege Isolation (UIPI) restrictions when an application is elevated in privilege from a standard user
    to an administrator. This is required to support accessibility features such as screen readers that are transmitting user
    interfaces to alternative forms. A process that is started with UIAccess rights has the following abilities: - To set
    the foreground window. - To drive any application window using SendInput function. - To use read input for all integrity
    levels using low-level hooks, raw input, GetKeyState, GetAsyncKeyState, and GetKeyboardInput. - To set journal hooks.
    - To uses AttachThreadInput to attach a thread to a higher integrity input queue.'
  impact: Enabling this setting requires that you have a PKI infrastructure and that your Enterprise administrators have populated
    the Trusted Root Store with the certificates for the allowed applications. Some older applications are not signed and
    will not be able to be used in an environment that is hardened with this setting. You should carefully test your applications
    in a pre-production environment before implementing this setting. For information about the steps required to test application
    compatibility, make application compatibility fixes, and sign installer packages to prepare your organization for deployment
    of Windows Vista User Account Control, see Understanding and Configuring User Account Control in Windows Vista (http://go.microsoft.com/fwlink/?LinkID=79026).
    Control over the applications that are installed on the desktops and the hardware that is able to join your domain should
    provide similar protection from the vulnerability addressed by this setting. Additionally, the level of protection provided
    by this setting is not an assurance that all rogue applications will be found If the application that requests UIAccess
    meets the UIAccess setting requirements, Windows Vista starts the application with the ability to bypass most of the UIPI
    restrictions. If the application does not meet the security restrictions, the application will be started without UIAccess
    rights and can interact only with applications at the same or lower privilege level.
  references:
  - 1. CCE-33786-5
  - '2.3.18.7 Set ''User Account Control: Only elevate UIAccess'
  - 1. CCE-35401-9
  page_start: 250
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

