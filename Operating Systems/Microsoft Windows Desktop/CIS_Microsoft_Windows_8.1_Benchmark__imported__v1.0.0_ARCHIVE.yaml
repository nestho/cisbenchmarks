  description: 'This policy setting allows you to turn on or turn off Offer (Unsolicited) Remote Assistance on this computer.
    If you enable this policy setting, users on this computer can get help from their corporate technical support staff using
    Offer (Unsolicited) Remote Assistance. If you disable this policy setting, users on this computer cannot get help from
    their corporate technical support staff using Offer (Unsolicited) Remote Assistance. If you do not configure this policy
    setting, users on this computer cannot get help from their corporate technical support staff using Offer (Unsolicited)
    Remote Assistance. If you enable this policy setting, you have two ways to allow helpers to provide Remote Assistance:
    "Allow helpers to only view the computer" or "Allow helpers to remotely control the computer." When you configure this
    policy setting, you also specify the list of users or user groups that are allowed to offer remote assistance. To configure
    the list of helpers, click "Show." In the window that opens, you can enter the names of the helpers. Add each user or
    group one by one. When you enter the name of the helper user or user groups, use the following format: <Domain Name>\<User
    Name> or <Domain Name>\<Group Name> If you enable this policy setting, you should also enable firewall exceptions to allow
    Remote Assistance communications. The firewall exceptions required for Offer (Unsolicited) Remote Assistance depend on
    the version of Windows you are running. Windows Vista and later Enable the Remote Assistance exception for the domain
    profile. The exception must contain: Port 135:TCP %WINDIR%\System32\msra.exe %WINDIR%\System32\raserver.exe Windows XP
