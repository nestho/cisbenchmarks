  description: 'This policy setting specifies whether computers in your environment will receive security updates from Windows
    Update or WSUS. If you configure this policy setting to Enabled, the operating system will recognize when a network connection
    is available and then use the network connection to search Windows Update or your designated intranet site for updates
    that apply to them. After you configure this policy setting to Enabled, select one of the following three options in the
    Configure Automatic Updates Properties dialog box to specify how the service will work: - Notify before downloading any
    updates and notify again before installing them. - Download the updates automatically and notify when they are ready to
    be installed. (Default setting) - Automatically download updates and install them on the schedule specified below. If
    you disable this policy setting, you will need to download and manually install any available updates from Windows Update.
    The recommended state for this setting is: Enabled.'
  rationale: Although each version of Windows is thoroughly tested before release, it is possible that problems will be discovered
    after the products are shipped. The Configure Automatic Updates setting can help you ensure that the computers in your
    environment will always have the most recent critical operating system updates and service packs installed.
  impact: Critical operating system updates and service packs will automatically download and install at 3:00 A.M. daily.
