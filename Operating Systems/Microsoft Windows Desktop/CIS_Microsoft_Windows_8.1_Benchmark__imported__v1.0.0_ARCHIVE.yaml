- id: 18.8.10.2.1
  title: Set 'Allow enhanced PINs for startup' to 'Enabled'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  description: 'This policy setting allows you to configure whether or not enhanced startup PINs are used with BitLocker.
    Enhanced startup PINs permit the use of characters including uppercase and lowercase letters, symbols, numbers, and spaces.
    This policy setting is applied when you turn on BitLocker. If you enable this policy setting, all new BitLocker startup
    PINs set will be enhanced PINs. Note: Not all computers may support enhanced PINs in the pre-boot environment. It is strongly
    recommended that users perform a system check during BitLocker setup. If you disable or do not configure this policy setting,
    enhanced PINs will not be used. The recommended state for this setting is: Enabled.'
  rationale: A numeric-only PIN provide less entropy than a PIN that is alpha-numeric. When not using enhanced PIN for startup,
    BitLocker requires the use of the function keys [F1-F10] for PIN entry since the PIN is entered in the pre-OS environment
    before locationalization support is available. This limits each PIN digit to one of ten possibilities. The TPM has an
    anti-hammering feature that includes a mechanism to exponentially increase the delay for PIN retry attempts; however,
    an attacker is able to more effectively mount a brute force attack using a domain of 10 digits of the function keys.
  impact: Not all computers enable full keyboard support in the PreOS environment. Some keys may not be available. It is recommended
    this functionality be tested using the computers in your environment prior to it being deployed.
  references:
  - 1. CCE-33100-9
