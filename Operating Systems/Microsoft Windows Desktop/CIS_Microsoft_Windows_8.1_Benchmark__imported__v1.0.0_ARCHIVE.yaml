- id: 19.7.4.1
  title: Set 'Do not preserve zone information in file attachments' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting allows you to manage whether Windows marks file attachments from Internet Explorer or
    Microsoft Outlook'' Express with information about their zone of origin (such as restricted, Internet, intranet, or local).
    This policy setting requires that files be downloaded to NTFS disk partitions to function correctly. If zone information
    is not preserved, Windows cannot make proper risk assessments based on the zone where the attachment came from. If the
    Do not preserve zone information in file attachments setting is enabled, file attachments are not marked with their zone
    information. If this policy setting is disabled, Windows is forced to store file attachments with their zone information.
    The recommended state for this setting is: Disabled.'
  rationale: A file that is downloaded from a computer in the Internet or Restricted Sites zone may be moved to a location
    that makes it appear safe, like an intranet file share, and executed by an unsuspecting user.
  impact: None, this is the default configuration.
  references:
  - 1. CCE-34810-2
