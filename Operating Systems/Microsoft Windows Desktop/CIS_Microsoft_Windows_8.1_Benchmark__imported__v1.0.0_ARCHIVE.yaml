- id: 18.8.10.2.11
  title: 'Set ''Configure minimum PIN length for startup'' to ''Enabled: 7 or more characters'''
  scoring: scored
  profile:
  - Level 1 + BitLocker
  description: 'This policy setting allows you to configure a minimum length for a Trusted Platform Module (TPM) startup PIN.
    This policy setting is applied when you turn on BitLocker. The startup PIN must have a minimum length of 4 digits and
    can have a maximum length of 20 digits. If you enable this policy setting, you can require a minimum number of digits
    to be used when setting the startup PIN. If you disable or do not configure this policy setting, users can configure a
    startup PIN of any length between 4 and 20 digits. The recommended state for this setting is: Enabled: 7 or more characters.'
  rationale: BitLocker requires the use of the function keys [F1-F10] for PIN entry since the PIN is entered in the pre-OS
    environment before locationalization support is available. This limits each PIN digit to one of ten possibilities. The
    TPM has an anti-hammering feature that includes a mechanism to exponentially increase the delay for PIN retry attempts;
    however, using a PIN that is short in length improves an attacker's chances of guessing the correct PIN.
  impact: ''
  references:
