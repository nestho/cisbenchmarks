      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\FVE\UseEnhancedPin'
    severity: medium
- id: 18.8.10.2.2
  title: (BL) Set 'Allow Secure Boot for integrity validation' to 'Enabled'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  - Level 2 + BitLocker
  description: 'This policy setting allows you to configure whether Secure Boot will be allowed as the platform integrity
    provider for BitLocker operating system drives. Secure Boot ensures that the PC''s pre-boot environment only loads firmware
    that is digitally signed by authorized software publishers. Secure Boot also provides more flexibility for managing pre-boot
    configuration than legacy BitLocker integrity checks. If you enable or do not configure this policy setting, BitLocker
    will use Secure Boot for platform integrity if the platform is capable of Secure Boot-based integrity validation. If you
    disable this policy setting, BitLocker will use legacy platform integrity validation, even on systems capable of Secure
    Boot-based integrity validation. When this policy is enabled and the hardware is capable of using Secure Boot for BitLocker
    scenarios, the "Use enhanced Boot Configuration Data validation profile" group policy setting is ignored and Secure Boot
    verifies BCD settings according to the Secure Boot policy setting, which is configured separately from BitLocker. Note:
    If the group policy setting "Configure TPM platform validation profile for native UEFI firmware configurations" is enabled
    and has PCR 7 omitted, Bitlocker will be prevented from using Secure Boot for platform or Boot Configuration Data (BCD)
    integrity validation. The recommended state for this setting is: Enabled.'
  rationale: Secure Boot ensures that only firmware digitally signed by authorized software publishers is loaded during computer
    startup, which reduces the risk of rootkits and other types of malware from gaining control of the system. It also helps
    provide protection against malicious users booting from an alternate operating system.
  impact: Secure Boot requires a system that meets the UEFI 2.3.1 Specifications for Class 2 and Class 3 computers.
  references:
  - 1. CCE-35393-8
  page_start: 518
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\FVE\OSAllowSecureBootForIntegr

    ity'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Administrative Templates\Windows Components\BitLocker

    Drive Encryption\Operating System Drives\Allow Secure Boot for integrity

    validation'
