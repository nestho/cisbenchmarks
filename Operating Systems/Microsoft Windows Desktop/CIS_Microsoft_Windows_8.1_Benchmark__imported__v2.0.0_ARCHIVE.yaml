- id: 18.8.7.2
  title: (L1) Set 'Turn off Autoplay' to 'Enabled:All drives'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  - Level 2 + BitLocker
  description: 'Autoplay starts to read from a drive as soon as you insert media in the drive, which causes the setup file
    for programs or audio media to start immediately. An attacker could use this feature to launch a program to damage the
    computer or data on the computer. You can enable the Turn off Autoplay setting to disable the Autoplay feature. Autoplay
    is disabled by default on some removable drive types, such as floppy disk and network drives, but not on CD-ROM drives.
    Note You cannot use this policy setting to enable Autoplay on computer drives in which it is disabled by default, such
    as floppy disk and network drives. The recommended state for this setting is: Enabled:All drives. This policy setting
    configures whether or not fixed data drives formatted with the FAT file system can be unlocked and viewed on computers
    running Windows Server 2008, Windows Vista, Windows XP with Service Pack 3 (SP3), or Windows XP with Service Pack 2 (SP2)
    operating systems. If this policy setting is enabled or not configured, fixed data drives formatted with the FAT file
    system can be unlocked on computers running Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with
    SP2, and their content can be viewed. These operating systems have read-only access to BitLocker-protected drives. When
    this policy setting is enabled, select the "Do not install BitLocker To Go Reader on FAT formatted fixed drives" check
    box to help prevent users from running BitLocker To Go Reader from their fixed drives. If BitLocker To Go Reader (bitlockertogo.exe)
    is present on a drive that does not have an identification field specified, or if the drive has the same identification
    field as specified in the "Provide unique identifiers for your organization" policy setting, the user will be prompted
    to update BitLocker and BitLocker To Go Reader will be deleted from the drive. In this situation, for the fixed drive
    to be unlocked on computers running Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with SP2, BitLocker
    To Go Reader must be installed on the computer. If this check box is not selected, BitLocker To Go Reader will be installed
    on the fixed drive to enable users to unlock the drive on computers running Windows Server 2008, Windows Vista, Windows
    XP with SP3, or Windows XP with SP2 that do not have BitLocker To Go Reader installed. If this policy setting is disabled,
    fixed data drives formatted with the FAT file system that are BitLocker-protected cannot be unlocked on computers running
    Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with SP2. Bitlockertogo.exe will not be installed.
    Note: This policy setting does not apply to drives that are formatted with the NTFS file system. The recommended state
    for this setting is: Disabled.'
  rationale: An attacker could use this feature to launch a program to damage a client computer or data on the computer. By
    default BitLocker virtualizes FAT formatted drives to permit access via the BitLocker To Go Reader on previous versions
    of Windows. Additionally the BitLocker To Go Reader application is applied to the unencrypted portion of the drive. The
    BitLocker To Go Reader application, like any other application, is subject to spoofing and could be a mechanism to propagate
    malware.
  impact: Users will have to manually launch setup or installation programs that are provided on removable media. Users will
    not be able to access BitLocker protected fixed drives on previous versions on Windows.
  references:
  - 1. CCE-33791-5
  - 1. CCE-34253-5
