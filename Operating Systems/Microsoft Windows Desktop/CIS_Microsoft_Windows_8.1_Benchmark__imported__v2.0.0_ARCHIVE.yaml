- id: 18.8.5.1
  title: (L1) Set 'Allow Microsoft accounts to be optional' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting lets you control whether Microsoft accounts are optional for Windows Store apps that require
    an account to sign in. This policy only affects Windows Store apps that support it. If you enable this policy setting,
    Windows Store apps that typically require a Microsoft account to sign in will allow users to sign in with an enterprise
    account instead. If you disable or do not configure this policy setting, users will need to sign in with a Microsoft account.
    The recommended state for this setting is: Enabled.'
  rationale: Enabling this setting allows an organization to their enterprise user accounts vice Microsoft accounts when accessing
    Windows store apps. This provides the organization with greater control over relevant credentials. Microsoft accounts
    cannot be centrally managed and as such enterprise credential security policies cannot be applied to them, which could
    put any information accessed by using Microsoft accounts at risk.
  impact: Windows Store apps that typically require a Microsoft account to sign in will allow users to sign in with an enterprise
    account instead.
  references:
  - 1. CCE-35803-6
