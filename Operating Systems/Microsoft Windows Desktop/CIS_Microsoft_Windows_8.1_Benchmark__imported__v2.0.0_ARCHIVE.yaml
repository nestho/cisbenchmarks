- id: 18.8.20.7
  title: (L1) Set 'System SEHOP' to 'Enabled:Application OptOut'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: "This setting determines how applications become enrolled in structured exception handler overwrite protection\
    \ (SEHOP). The recommended state for this setting is: Enabled:Application Opt-Out. This policy setting controls Event\
    \ Log behavior when the log file reaches its maximum size. If you enable this policy setting and a log file reaches its\
    \ maximum size, new events are not written to the log and are lost. If you disable or do not configure this policy setting\
    \ and a log file reaches its maximum size, new events overwrite old events. Note: Old events may or may not be retained\
    \ according to the \"Backup log automatically when full\"\x9D policy setting. The recommended state for this setting is:\
    \ Disabled."
  rationale: When a software component suffers from a memory corruption vulnerability, an exploit may be able to overwrite
    memory that contains data structures that control how the software handles exceptions. By corrupting these structures
    in a controlled manner, an exploit may be able to execute arbitrary code. SEHOP verifies the integrity of those structures
    before they are use to handle exceptions, which reduces the reliability of exploits that leverage structured exception
    handler overwrites. If new events are not recorded it may be difficult or impossible to determine the root cause of system
    problems or the unauthorized activities of malicious users
  impact: If you enable this policy setting and a log file reaches its maximum size, new events are not written to the log
    and are lost. If you disable or do not configure this policy setting and a log file reaches its maximum size, new events
    overwrite old events.
  references:
  - 1. CCE-34169-3
