    must meet complexity requirements" located in Computer Configuration\Windows Settings\Security Settings\Account Policies\Password
    Policy\ must be also enabled. Note: These settings are enforced when turning on BitLocker, not when unlocking a volume.
    BitLocker will allow unlocking a drive with any of the protectors available on the drive. If you enable this policy setting,
    users can configure a password that meets the requirements that you define. To require the use of a password, select "Require
    password for removable data drive". To enforce complexity requirements on the password, select "Require complexity". When
    set to "Require complexity" a connection to a domain controller is necessary when BitLocker is enabled to validate the
    complexity the password. When set to "Allow complexity" a connection to a domain controller will be attempted to validate
    the complexity adheres to the rules set by the policy, but if no domain controllers are found the password will still
    be accepted regardless of actual password complexity and the drive will be encrypted using that password as a protector.
    When set to "Do not allow complexity", no password complexity validation will be done. Passwords must be at least 8 characters.
