  - Level 2 + BitLocker
  description: 'When you dial a phonebook or VPN entry in Dial-Up Networking, you can use the "Save Password" option so that
    your Dial-Up Networking password is cached and you will not need to enter it on successive dial attempts. For security,
    administrators may want to prevent users from caching passwords. The recommended state for this setting is: Enabled. This
    value controls how often TCP attempts to verify that an idle connection is still intact by sending a keep-alive packet.
    If the remote computer is still reachable, it acknowledges the keep-alive packet. The recommended state for this setting
    is: 300,000 or 5 minutes (recommended). NetBIOS over TCP/IP is a network protocol that among other things provides a way
    to easily resolve NetBIOS names that are registered on Windows-based systems to the IP addresses that are configured on
    those systems. This setting determines whether the computer releases its NetBIOS name when it receives a name-release
    request. The recommended state for this setting is: Enabled. This setting is used to enable or disable the Internet Router
    Discovery Protocol (IRDP), which allows the system to detect and configure default gateway addresses automatically as
    described in RFC 1256 on a per-interface basis. The recommended state for this setting is: Disabled.'
  rationale: An attacker who steals a mobile user's computer could automatically connect to the organization's network if
    the Save This Password check box is selected for the dial-up networking entry used to connect to your organization's network.
    An attacker who is able to connect to network applications could establish numerous connections to cause a DoS condition.
    The NetBT protocol is designed not to use authentication, and is therefore vulnerable to spoofing. Spoofing makes a transmission
    appear to come from a user other than the user who performed the action. A malicious user could exploit the unauthenticated
    nature of the protocol to send a name-conflict datagram to a target computer, which would cause the computer to relinquish
    its name and not respond to queries. The result of such an attack could be to cause intermittent connectivity issues on
    the target computer, or even to prevent the use of Network Neighborhood, domain logons, the NET SEND command, or additional
    NetBIOS name resolution. An attacker who has gained control of a computer on the same network segment could configure
    a computer on the network to impersonate a router. Other computers with IRDP enabled would then attempt to route their
    traffic through the already compromised computer.
  impact: Users will not be able to automatically store their logon credentials for dial-up and VPN connections. Keep-alive
    packets are not sent by default by Windows. However, some applications may configure the TCP stack flag that requests
    keep-alive packets. For such configurations, you can lower this value from the default setting of two hours to five minutes
    to disconnect inactive sessions more quickly. An attacker could send a request over the network and query a computer to
    release its NetBIOS name. As with any change that could affect applications, it is recommended that you test this change
    in a non-production environment before you change the production environment. If you disable this entry, Windows Server
    2003 (which supports the IRDP) cannot automatically detect and configure default gateway addresses on the computer.
