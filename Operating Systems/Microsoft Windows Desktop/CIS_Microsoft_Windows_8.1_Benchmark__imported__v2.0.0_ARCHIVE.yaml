- id: 18.8.10.1.14
  title: (BL) Set 'Configure use of passwords for fixed data drives' to 'Disabled'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  - Level 2 + BitLocker
  description: 'This policy setting specifies whether a password is required to unlock BitLockerprotected fixed data drives.
    If you choose to permit the use of a password, you can require that a password be used, enforce complexity requirements
    on the password, and configure a minimum length for the password. For the complexity requirement setting to be effective
    the Group Policy setting "Password must meet complexity requirements" located in Computer Configuration\Windows Settings\Security
    Settings\Account Policies\Password Policy\ must be also enabled. Note: These settings are enforced when turning on BitLocker,
    not when unlocking a volume. BitLocker will allow unlocking a drive with any of the protectors available on the drive.
    If you enable this policy setting, users can configure a password that meets the requirements you define. To require the
    use of a password, select "Require password for fixed data drive". To enforce complexity requirements on the password,
    select "Require complexity". When set to "Require complexity" a connection to a domain controller is necessary when BitLocker
    is enabled to validate the complexity the password. When set to "Allow complexity" a connection to a domain controller
    will be attempted to validate the complexity adheres to the rules set by the policy, but if no domain controllers are
    found the password will still be accepted regardless of actual password complexity and the drive will be encrypted using
    that password as a protector. When set to "Do not allow complexity", no password complexity validation will be done. Passwords
    must be at least 8 characters. To configure a greater minimum length for the password, enter the desired number of characters
    in the "Minimum password length" box. If you disable this policy setting, the user is not allowed to use a password. If
    you do not configure this policy setting, passwords will be supported with the default settings, which do not include
    password complexity requirements and require only 8 characters. Note: Passwords cannot be used if FIPS-compliance is enabled.
    The "System cryptography: Use FIPS-compliant algorithms for encryption, hashing, and signing" policy setting in Computer
    Configuration\Windows Settings\Security Settings\Local Policies\Security Options specifies whether FIPS-compliance is
    enabled. The recommended state for this setting is: Disabled.'
  rationale: Using a dictionary-style attack, passwords can be guessed or discovered by repeatedly attempting to unlock a
    drive. Since this type of BitLocker password does include antidictionary attack protections provided by a TPM, for example,
    there is no mechanism to slow down rapid brute-force attacks against them.
  impact: The password option will not be available when configuring BitLocker.
  references:
  - 1. CCE-33165-2
