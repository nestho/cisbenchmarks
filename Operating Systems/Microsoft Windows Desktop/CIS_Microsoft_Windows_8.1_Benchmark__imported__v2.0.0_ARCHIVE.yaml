  - Level 2 + BitLocker
  description: 'This policy setting specifies whether the Windows NTP Client is enabled. Enabling the Windows NTP Client allows
    your computer to synchronize its computer clock with other NTP servers. You might want to disable this service if you
    decide to use a third-party time provider. The recommended state for this setting is: Enabled.'
  rationale: A reliable and accurate account of time is important for a number of services and security requirements, including
    but not limited to distributed applications, authentication services, multi-user databases and logging services. The use
    of an NTP client (with secure operation) establishes functional accuracy and is a focal point when reviewing security
    relevant events.
  impact: If you enable this policy setting, you can set the local computer clock to synchronize time with NTP servers.
