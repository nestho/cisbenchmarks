- id: 2.3.18.5
  title: '(L1) Set ''User Account Control: Detect application installations and prompt for elevation'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting controls the behavior of application installation detection for the computer. The options
    are: - Enabled: (Default for home) When an application installation package is detected that requires elevation of privilege,
    the user is prompted to enter an administrative user name and password. If the user enters valid credentials, the operation
    continues with the applicable privilege. - Disabled: (Default for enterprise) Application installation packages are not
    detected and prompted for elevation. Enterprises that are running standard user desktops and use delegated installation
    technologies such as Group Policy Software Installation or Systems Management Server (SMS) should disable this policy
    setting. In this case, installer detection is unnecessary. The recommended state for this setting is: Enabled. This policy
    setting controls whether applications that request to run with a User Interface Accessibility (UIAccess) integrity level
    must reside in a secure location in the file system. Secure locations are limited to the following: - …\Program Files\,
    including subfolders - …\Windows\system32\ - …\Program Files (x86)\, including subfolders for 64-bit versions of Windows
    Note: Windows enforces a public key infrastructure (PKI) signature check on any interactive application that requests
    to run with a UIAccess integrity level regardless of the state of this security setting. The options are: - Enabled: (Default)
    If an application resides in a secure location in the file system, it runs only with UIAccess integrity. - Disabled: An
    application runs with UIAccess integrity even if it does not reside in a secure location in the file system. The recommended
    state for this setting is: Enabled.'
  rationale: 'Some malicious software will attempt to install itself after being given permission to run. For example, malicious
    software with a trusted application shell. The user may have given permission for the program to run because the program
    is trusted, but if they are then prompted for installation of an unknown component this provides another way of trapping
    the software before it can do damage UIAccess Integrity allows an application to bypass User Interface Privilege Isolation
    (UIPI) restrictions when an application is elevated in privilege from a standard user to an administrator. This is required
    to support accessibility features such as screen readers that are transmitting user interfaces to alternative forms. A
    process that is started with UIAccess rights has the following abilities: - To set the foreground window. - To drive any
    application window using SendInput function. - To use read input for all integrity levels using low-level hooks, raw input,
    GetKeyState, GetAsyncKeyState, and GetKeyboardInput. - To set journal hooks. - To uses AttachThreadInput to attach a thread
    to a higher integrity input queue.'
  impact: Users will need to provide administrative passwords to be able to install programs. If the application that requests
    UIAccess meets the UIAccess setting requirements, Windows Vista starts the application with the ability to bypass most
    of the UIPI restrictions. If the application does not meet the security restrictions, the application will be started
    without UIAccess rights and can interact only with applications at the same or lower privilege level.
  references:
  - 1. CCE-35429-0
