    Console or the Local Group Policy Editor. Consult the BitLocker Drive Encryption Deployment Guide on Microsoft TechNet
    for more information about adding data recovery agents. In "Configure user storage of BitLocker recovery information"
    select whether users are allowed, required, or not allowed to generate a 48-digit recovery password or a 256-bit recovery
    key. Select "Omit recovery options from the BitLocker setup wizard" to prevent users from specifying recovery options
    when they enable BitLocker on a drive. This means that you will not be able to specify which recovery option to use when
    you enable BitLocker, instead BitLocker recovery options for the drive are determined by the policy setting. In "Save
    BitLocker recovery information to Active Directory Doman Services" choose which BitLocker recovery information to store
    in AD DS for fixed data drives. If you select "Backup recovery password and key package", both the BitLocker recovery
    password and key package are stored in AD DS. Storing the key package supports recovering data from a drive that has been
