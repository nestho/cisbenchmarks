- id: 2.3.16.1
  title: '(L1) Set ''System objects: Require case insensitivity for non-Windows subsystems'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting determines whether case insensitivity is enforced for all subsystems. The Microsoft Win32''
    subsystem is case insensitive. However, the kernel supports case sensitivity for other subsystems, such as the Portable
    Operating System Interface for UNIX (POSIX). Because Windows is case insensitive (but the POSIX subsystem will support
    case sensitivity), failure to enforce this policy setting makes it possible for a user of the POSIX subsystem to create
    a file with the same name as another file by using mixed case to label it. Such a situation can block access to these
    files by another user who uses typical Win32 tools, because only one of the files will be available. The recommended state
    for this setting is: Enabled. This policy setting determines the strength of the default discretionary access control
    list (DACL) for objects. The setting helps secure objects that can be located and shared among processes and its default
    configuration strengthens the DACL, because it allows users who are not administrators to read shared objects but does
    not allow them to modify any that they did not create. The recommended state for this setting is: Enabled.'
  rationale: Because Windows is case-insensitive but the POSIX subsystem will support case sensitivity, failure to enable
    this policy setting would make it possible for a user of that subsystem to create a file with the same name as another
    file but with a different mix of upper and lower case letters. Such a situation could potentially confuse users when they
    try to access such files from normal Win32 tools because only one of the files will be available. This setting determines
    the strength of the default DACL for objects. Windows Server 2003 maintains a global list of shared computer resources
    so that objects can be located and shared among processes. Each type of object is created with a default DACL that specifies
    who can access the objects and with what permissions. If you enable this setting, the default DACL is strengthened because
    non-administrator users are allowed to read shared objects but not modify shared objects that they did not create.
  impact: All subsystems will be forced to observe case insensitivity. This configuration may confuse users who are familiar
    with any UNIX-based operating systems that is casesensitive. None. This is the default configuration.
  references:
