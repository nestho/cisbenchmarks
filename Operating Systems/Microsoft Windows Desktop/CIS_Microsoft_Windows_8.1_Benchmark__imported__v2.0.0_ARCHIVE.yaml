    boot time integrity checks, the system will go into recovery mode. If the recovery key has not been backed up to Active
    Directory, the user would need to have saved the recovery key to another location such as a USB flash drive, or have printed
    the recovery password, and now have access to one of those in order to recovery the system. If the user is unable to produce
    the recovery key, then the user will be denied access to the encrypted volume and subsequently any data that is stored
    there. Should a user lose their primary means for accessing an encrypted OS volume, or should the system not pass its
