- id: 2.3.7.2
  title: '(L1) Set ''Interactive logon: Do not require CTRL+ALT+DEL'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  - Level 2 + BitLocker
  description: 'This policy setting determines whether users must press CTRL+ALT+DEL before they log on. If you enable this
    policy setting, users can log on without this key combination. If you disable this policy setting, users must press CTRL+ALT+DEL
    before they log on to Windows unless they use a smart card for Windows logon. A smart card is a tamperproof device that
    stores security information. The recommended state for this setting is: Disabled. The machine lockout policy is enforced
    only on those machines that have Bitlocker enabled for protecting OS volumes. Please ensure that appropriate recovery
    password backup policies are enabled. This security setting determines the number of failed logon attempts that causes
    the machine to be locked out. A locked out machine can only be recovered by providing recovery key at console. You can
    set the value between 1 and 999 failed logon attempts. If you set the value to 0, the machine will never be locked out.
    Values from 1 to 3 will be interpreted as 4. Failed password attempts against workstations or member servers that have
    been locked using either CTRL+ALT+DELETE or password protected screen savers counts as failed logon attempts. The machine
    lockout policy is enforced only on those machines that have Bitlocker enabled for protecting OS volumes. Please ensure
    that the appropriate recovery password backup policies are enabled. The recommended state for this setting is 10 or fewer
    invalid logon attempts, but not 0. Note: A value of 0 does not conform to the benchmark as it disables the machine account
    lockout threshold.'
  rationale: 'Microsoft developed this feature to make it easier for users with certain types of physical impairments to log
    on to computers that run Windows. If users are not required to press CTRL+ALT+DEL, they are susceptible to attacks thattempt
    to intercept their passwords. If CTRL+ALT+DEL is required before logon, user passwords are communicated by means of a
    trusted path. An attacker could install a Trojan horse program that looks like the standard Windows logon dialog box and
    capture the user''s password. The attacker would then be able to log on to the compromised account with whatever level
    of privilege that user has. This policy setting determines the number of failed logon attempts before a lock occurs. Authorized
    users can lock themselves out of the computer by mistyping their password or by remembering it incorrectly, or by changing
    their password on one computer while logged on to another computer. The computer with the incorrect password will continuously
    try to authenticate the user, and because the password it uses to authenticate is incorrect, a lock occurs. To avoid accidental
    lockout of authorized users, set the account lockout threshold to a high number. The default value for this policy setting
    is 0 invalid logon attempts, which disables the machine lockout feature. There are two options to consider for this policy
    setting. • Configure the value for Machine lockout threshold to 0 to ensure that accounts will not be locked out. This
    setting value will reduce help desk calls, because users will not be able to lock themselves out of their accounts accidentally.
    However, this setting value will not prevent a brute force attack. The following defenses should also be considered: •
    A password policy that forces all users to have complex passwords made up of 8 or more characters. • A robust auditing
    mechanism, which will alert administrators when a series of account lockouts occurs in the environment. For example, the
    auditing solution should monitor for security event 539, which is a logon failure. This event identifies that there was
    a lock on the account at the time of the logon attempt. • The second option is: • Configure the value for Machine lockout
    threshold to a value that provides users with the ability to mistype their password several times, but locks out the account
    if a brute force password attack occurs. This configuration will prevent accidental account lockouts and reduce help desk
    calls.'
  impact: 'Unless they use a smart card to log on, users will have to simultaneously press three keys before the logon dialog
    box will display. Because vulnerabilities can exist when this value is configured as well as when it is not configured,
    two distinct countermeasures are defined. Any organization should weigh the choice between the two based on their identified
    threats and the risks that they want to mitigate. The two countermeasure options are: • Configure the Machine Lockout
    Threshold setting to 0. This configuration ensures that accounts will not be locked out, and also helps reduce help desk
    calls because users cannot accidentally lock themselves out of their accounts. Because it will not prevent a brute force
    attack, this configuration should only be chosen if both of the following criteria are explicitly met: • The password
    policy requires all users to have complex passwords of 8 or more characters. • A robust audit mechanism is in place to
    alert administrators when a series of failed logons occur in the environment. • Configure the Machine Lockout Threshold
    setting to a sufficiently high value to provide users with the ability to accidentally mistype their password several
    times before the machine is locked, but ensure that a brute force password attack will still lock the account. A good
    recommendation for such a configuration is 50 invalid logon attempts, which will prevent accidental account lockouts and
    reduce the number of help desk calls. This option is recommended if your organization does not have complex password requirements
    and an audit policy that alerts administrators to a series of failed logon attempts.'
  references:
