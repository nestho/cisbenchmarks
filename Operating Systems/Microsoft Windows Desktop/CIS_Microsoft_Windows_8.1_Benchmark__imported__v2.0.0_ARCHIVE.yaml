  title: '(L1) Set ''Network access: Do not allow anonymous enumeration of SAM accounts'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  - Level 2
  - Level 2 + BitLocker
  description: 'This policy setting controls the ability of anonymous users to enumerate the accounts in the Security Accounts
    Manager (SAM). If you enable this policy setting, users with anonymous connections cannot enumerate domain account user
    names on the workstations in your environment. This policy setting also allows additional restrictions on anonymous connections.
    The recommended state for this setting is: Enabled. This policy setting controls the ability of anonymous users to enumerate
    SAM accounts as well as shares. If you enable this policy setting, anonymous users will not be able to enumerate domain
    account user names and network share names on the workstations in your environment. The Network access: Do not allow anonymous
    enumeration of SAM accounts and shares setting is configured to Enabled for the two environments that are discussed in
    this guide. The recommended state for this setting is: Enabled. This policy setting determines whether the Stored User
    Names and Passwords feature may save passwords or credentials for later use when it gains domain authentication. If you
    enable this policy setting, the Stored User Names and Passwords feature of Windows does not store passwords and credentials.
    The recommended state for this setting is: Enabled.'
  rationale: An unauthorized user could anonymously list account names and use the information to perform social engineering
    attacks or attempt to guess passwords. (Social engineering attacks try to deceive users in some way to obtain passwords
    or some form of security information.) An unauthorized user could anonymously list account names and shared resources
    and use the information to attempt to guess passwords or perform social engineering attacks. Passwords that are cached
    can be accessed by the user when logged on to the computer. Although this information may sound obvious, a problem can
    arise if the user unknowingly executes hostile code that reads the passwords and forwards them to another, unauthorized
    user.
  impact: It will be impossible to establish trusts with Windows NT 4.0-based domains. Also, client computers that run older
    versions of the Windows operating system such as Windows NT 3.51 and Windows 95 will experience problems when they try
    to use resources on the server. It will be impossible to grant access to users of another domain across a one-way trust
    because administrators in the trusting domain will be unable to enumerate lists of accounts in the other domain. Users
    who access file and print servers anonymously will be unable to list the shared network resources on those servers; the
    users will have to authenticate before they can view the lists of shared folders and printers. Users will be forced to
    enter passwords whenever they log on to their Passport account or other network resources that aren't accessible to their
    domain account. Testing has shown that clients running Windows Vista or Windows Server 2008 will be unable to connect
    to Distributed File System (DFS) shares in untrusted domains. Enabling this setting also makes it impossible to specify
    alternate credentials for scheduled tasks, this can cause a variety of problems. For example, some third party backup
    products will no longer work. This policy setting should have no impact on users who access network resources that are
    configured to allow access with their Active Directory-based domain account.
