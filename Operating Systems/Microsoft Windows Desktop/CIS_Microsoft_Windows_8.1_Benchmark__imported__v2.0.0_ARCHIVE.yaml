  description: 'This policy setting allows you to join Microsoft MAPS. Microsoft MAPS is the online community that helps you
    choose how to respond to potential threats. The community also helps stop the spread of new malicious software infections.
    You can choose to send basic or additional information about detected software. Additional information helps Microsoft
    create new definitions and help it to protect your computer. Possible options are:(0x0) Disabled (default)(0x1) Basic
    membership(0x2) Advanced membership Basic membership will send basic information to Microsoft about software that has
    been detected including where the software came from the actions that you apply or that are applied automatically and
    whether the actions were successful. Advanced membership in addition to basic information will send more information to
    Microsoft about malicious software spyware and potentially unwanted software including the location of the software file
    names how the software operates and how it has impacted your computer. The recommended state for this setting is: Disabled.'
  rationale: This information can include things like location of detected items on your computer if harmful software was
    removed. The information will be automatically collected and sent. In some instances personal information might unintentionally
    be sent to Microsoft. However Microsoft will not use this information to identify you or contact you.
