  title: (BL) Set 'Configure use of passwords for removable data drives' to 'Disabled'
  scoring: scored
  profile:
  - Level 1 + BitLocker
  - Level 2 + BitLocker
  description: 'This policy setting allows you to specify whether smart cards can be used to authenticate user access to BitLocker-protected
    removable data drives on a computer. If you enable this policy setting smart cards can be used to authenticate user access
    to the drive. You can require a smart card authentication by selecting the "Require use of smart cards on removable data
    drives" check box. Note: These settings are enforced when turning on BitLocker, not when unlocking a drive. BitLocker
    will allow unlocking a drive with any of the protectors available on the drive. If you disable this policy setting, users
    are not allowed to use smart cards to authenticate their access to BitLockerprotected removable data drives. If you do
    not configure this policy setting, smart cards are available to authenticate user access to a BitLocker-protected removable
    data drive. The recommended state for this setting is: Disabled.'
  rationale: Using a dictionary-style attack, passwords can be guessed or discovered by repeatedly attempting to unlock a
    drive. Since this type of BitLocker password does not include anti-dictionary attack protections provided by a TPM, for
    example, there is no mechanism to slow down rapid brute-force attacks against themUsing
  impact: Users will not be able to use a password with BitLocker. This will prevent users from accessing their drives on
    previous versions of Windows.
