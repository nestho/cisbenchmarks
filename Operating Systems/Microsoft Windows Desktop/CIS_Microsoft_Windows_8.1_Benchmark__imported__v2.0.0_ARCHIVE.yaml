- id: 2.2.15
  title: (L1) Set 'Debug programs' to 'Administrators'
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting determines which user accounts will have the right to attach a debugger to any process
    or to the kernel, which provides complete access to sensitive and critical operating system components. Developers who
    are debugging their own applications do not need to be assigned this user right; however, developers who are debugging
    new system components will need it. The recommended state for this setting is: Administrators.'
  rationale: The Debug programs user right can be exploited to capture sensitive computer information from system memory,
    or to access and modify kernel or application structures. Some attack tools exploit this user right to extract hashed
    passwords and other private security information, or to insert rootkit code. By default, the Debug programs user right
    is assigned only to administrators, which helps to mitigate the risk from this vulnerability.
  impact: If you revoke this user right, no one will be able to debug programs. However, typical circumstances rarely require
    this capability on production computers. If a problem arises that requires an application to be debugged on a production
    server, you can move the server to a different OU temporarily and assign the Debug programs user right to a separate Group
    Policy for that OU. The service account that is used for the cluster service needs the Debug programs privilege; if it
    does not have it, Windows Clustering will fail. For additional information about how to configure Windows Clustering in
    conjunction with computer hardening, see article 891597, How to apply more restrictive security settings on a Windows
    Server 2003based cluster server, in the Microsoft Knowledge Base (http://go.microsoft.com/fwlink/?LinkId=100746). Tools
    that are used to manage processes will be unable to affect processes that are not owned by the person who runs the tools.
    For example, the Windows Server 2003 Resource Kit tool Kill.exe requires this user right for administrators to terminate
    processes that they did not start. Also, some older versions of Update.exe (which is used to install Windows product updates)
    require the account that applies the update to have this user right. If you install one of the patches that uses this
    version of Update.exe, the computer could become unresponsive. For more information, see article 830846, Windows Product
    Updates may stop responding or may use most or all the CPU resources, in the Microsoft Knowledge Base (http://go.microsoft.com/fwlink/?LinkId=100747).
