  description: 'The registry value entry SafeDllSearchMode was added to the template file in the HKEY\_LOCAL\_MACHINE\\ SYSTEM\\CurrentControlSet\\Control\\Session
    Manager\\ registry key. The entry appears as MSS: (SafeDllSearchMode) Enable Safe DLL search mode (recommended) in the
    SCE. The DLL search order can be configured to search for DLLs that are requested by running processes in one of two ways:
    • Search folders specified in the system path first, and then search the current working folder. • Search current working
    folder first, and then search the folders specified in the system path. When enabled, the registry value is set to 1.
    With a setting of 1, the system first searches the folders that are specified in the system path and then searches the
    current working folder. When disabled the registry value is set to 0 and the system first searches the current working
    folder and then searches the folders that are specified in the system path. The recommended state for this setting is:
    Enabled. Windows includes a grace period between when the screen saver is launched and when the console is actually locked
    automatically when screen saver locking is enabled. The recommended state for this setting is: 5 or fewer seconds. This
    setting controls the number of times that TCP retransmits an individual data segment (non-connect segment) before the
    connection is aborted. The retransmission time-out is doubled with each successive retransmission on a connection. It
    is reset when responses resume. The base time-out value is dynamically determined by the measured round-trip time on the
    connection. The recommended state for this setting is: 3.'
  rationale: If a user unknowingly executes hostile code that was packaged with additional files that include modified versions
    of system DLLs, the hostile code could load its own versions of those DLLs and potentially increase the type and degree
    of damage the code can render. The default grace period that is allowed for user movement before the screen saver lock
    takes effect is five seconds. If you leave the default grace period configuration, your computer is vulnerable to a potential
    attack from someone who could approach the console and attempt to log on to the computer before the lock takes effect.
    An entry to the registry can be made to adjust the length of the grace period. A malicious user could exhaust a target
    computer's resources if it never sent any acknowledgment messages for data that was transmitted by the target computer.
  impact: Applications will be forced to search for DLLs in the system path first. For applications that require unique versions
    of these DLLs that are included with the application, this entry could cause performance or stability problems. Users
    will have to enter their passwords to resume their console sessions as soon as the screen saver activates. TCP starts
    a retransmission timer when each outbound segment is passed to the IP. If no acknowledgment is received for the data in
    a given segment before the timer expires, then the segment is retransmitted up to three times.
