- id: 2.3.7.6
  title: '(L1) Configure ''Interactive logon: Message title for users attempting to log on'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  description: 'This policy setting specifies the text displayed in the title bar of the window that users see when they log
    on to the system. Configure this setting in a manner that is consistent with the security and operational requirements
    of your organization. This policy setting determines whether a user can log on to a Windows domain using cached account
    information. Logon information for domain accounts can be cached locally to allow users to log on even if a domain controller
    cannot be contacted. This policy setting determines the number of unique users for whom logon information is cached locally.
    If this value is set to 0, the logon cache feature is disabled. An attacker who is able to access the file system of the
    server could locate this cached information and use a brute force attack to determine user passwords. The recommended
    state for this setting is: 4 or fewer logon(s). This policy setting determines how far in advance users are warned that
    their password will expire. It is recommended that you configure this policy setting to at least 5 days but no more than
    14 days to sufficiently warn users when their passwords will expire. The recommended state for this setting is between
    5 and 14 days``.'
  rationale: Displaying a warning message before logon may help prevent an attack by warning the attacker about the consequences
    of their misconduct before it happens. It may also help to reinforce corporate policy by notifying employees of the appropriate
    policy during the logon process. The number that is assigned to this policy setting indicates the number of users whose
    logon information the servers will cache locally. If the number is set to 10, then the server caches logon information
    for 10 users. When an eleventh user logs on to the computer, the server overwrites the oldest cached logon session. Users
    who access the server console will have their logon credentials cached on that server. An attacker who is able to access
    the file system of the server could locate this cached information and use a brute force attack to attempt to determine
    user passwords. To mitigate this type of attack, Windows encrypts the information and obscures its physical location.
    Users will need to be warned that their passwords are going to expire, or they may inadvertently be locked out of the
    computer when their passwords expire. This condition could lead to confusion for users who access the network locally,
    or make it impossible for users to access your organization's network through dial-up or virtual private network (VPN)
    connections.
  impact: 'Users will see a message in a dialog box before they can log on to the server console. Note Windows Vista and Windows
    XP Professional support logon banners that can exceed 512 characters in length and that can also contain carriage-return
    line-feed sequences. However, Windows 2000-based clients cannot interpret and display these messages. You must use a Windows
    2000-based computer to create a logon message policy that applies to Windows 2000-based computers. If you inadvertently
    create a logon message policy on a Windows Vista-based or Windows XP Professional-based computer and you discover that
    it does not display properly on Windows 2000-based computers, do the following: Change the setting to Not Defined, and
    then change the setting to the desired value by using a Windows 2000-based computer. Important If you do not reconfigure
    this setting to Not Defined before reconfiguring the setting using a Windows 2000-based computer, the changes will not
    take effect properly. Users will be unable to log on to any computers if there is no domain controller available to authenticate
    them. Organizations may want to configure this value to 2 for end-user computers, especially for mobile users. A configuration
    value of 2 means that the user''s logon information will still be in the cache, even if a member of the IT department
    has recently logged on to their computer to perform system maintenance. This method allows users to log on to their computers
    when they are not connected to the organization''s network. Users will see a dialog box prompt to change their password
    each time that they log on to the domain when their password is configured to expire between 5 and 14 days.'
