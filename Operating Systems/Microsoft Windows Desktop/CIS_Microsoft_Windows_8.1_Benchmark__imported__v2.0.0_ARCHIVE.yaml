  description: 'Internet Protocol version 6 (IPv6) is a set of protocols that computers use to exchange information over the
    Internet and over home and business networks. IPv6 allows for many more IP addresses to be assigned than IPv4 did. Older
    networking, hosts and operating systems may not support IPv6 natively. The recommended state for this setting is: DisabledComponents
    - 0xff (255)'
  rationale: Since the vast majority of private corporate networks have no need to utilize IPv6 (because they have access
    to private IPv4 addressing), disabling IPv6 components reduces a possible attack surface that is also harder to monitor
    the traffic on. We recommend configuring this to a Disabled state as per the recommendation.
  impact: 'Connectivity to other systems using IPv6 will no longer operate, and software that depends on IPv6 will cease to
    function. Examples of Microsoft applications that may use IPv6 include: Remote Assistance, HomeGroup, DirectAccess, Windows
    Mail. This registry change is documented in MS KB 929852. Note: This registry change does not take effect until the next
    reboot.'
