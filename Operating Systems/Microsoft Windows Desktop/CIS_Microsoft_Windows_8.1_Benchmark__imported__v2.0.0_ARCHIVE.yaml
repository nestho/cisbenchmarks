  - Level 1 + BitLocker
  description: 'This policy setting configures secure access to UNC paths. The recommended state for this setting is: Enabled,
    with "Mutual Authentication" and "Integrity" UNC hardening set for all NETLOGON and SYSVOL shares .'
  rationale: 'In February 2015, Microsoft released a new control mechanism to mitigate a security risk in Group Policy as
    part of MS15-011 / MSKB 3000483. This mechanism requires both the installation of the new security update and also the
    deployment of specific group policy settings to all computers on the domain from Vista/Server 2008 or higher (the associated
    security patch to enable this feature was not released for Server 2003). A new group policy template (NetworkProvider.admx/.adml)
    was also provided with the security update. Once the new GPO template is in place, the following are the minimum requirements
    to remediate the Group Policy security risk: \\\\\*\\NETLOGON RequireMutualAuthentication=1, RequireIntegrity=1 \\\\\*\\SYSVOL
    RequireMutualAuthentication=1, RequireIntegrity=1 Note: A reboot may be required after the setting is applied to a client
    machine to access the above paths. Additional guidance on the deployment of this security setting is available from the
    Microsoft Premier Field Engineering (PFE) TechNet Blog here: http://blogs.technet.com/b/askpfeplat/archive/2015/02/23/guidance-on-deployment-ofms15-011-and-ms15-014.aspx'
  impact: If you enable this policy, Windows only allows access to the specified UNC paths after fulfilling additional security
    requirements.
