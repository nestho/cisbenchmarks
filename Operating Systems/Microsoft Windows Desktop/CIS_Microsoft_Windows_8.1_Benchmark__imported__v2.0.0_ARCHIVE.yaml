    error occurs. If you want to use BitLocker on a computer without a TPM, select the "Allow BitLocker without a compatible
    TPM" check box. In this mode a USB drive is required for start-up and the key information used to encrypt the drive is
    stored on the USB drive, creating a USB key. When the USB key is inserted the access to the drive is authenticated and
    the drive is accessible. If the USB key is lost or unavailable you will need to use one of the BitLocker recovery options
    to access the drive. On a computer with a compatible TPM, four types of authentication methods can be used at startup
    to provide added protection for encrypted data. When the computer starts, it can use only the TPM for authentication,
    or it can also require insertion of a USB flash drive containing a startup key, the entry of a 4-digit to 20-digit personal
    identification number (PIN), or both. If you enable this policy setting, users can configure advanced startup options
    in the BitLocker setup wizard. If you disable or do not configure this policy setting, users can configure only basic
    options on computers with a TPM. Note: If you want to require the use of a startup PIN and a USB flash drive, you must
    configure BitLocker settings using the command-line tool manage-bde instead of the BitLocker Drive Encryption setup wizard.
    The recommended state for this setting is: Do not allow startup key and PIN with TPM. This policy setting configures whether
    or not removable data drives formatted with the FAT file system can be unlocked and viewed on computers running Windows
    Server 2008, Windows Vista, Windows XP with Service Pack 3 (SP3), or Windows XP with Service Pack 2 (SP2) operating systems.
    If this policy setting is enabled or not configured, removable data drives formatted with the FAT file system can be unlocked
    on computers running Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with SP2, and their content
    can be viewed. These operating systems have read-only access to BitLocker-protected drives. When this policy setting is
    enabled, select the "Do not install BitLocker To Go Reader on FAT formatted removable drives" check box to help prevent
    users from running BitLocker To Go Reader from their removable drives. If BitLocker To Go Reader (bitlockertogo.exe) is
    present on a drive that does not have an identification field specified, or if the drive has the same identification field
    as specified in the "Provide unique identifiers for your organization" policy setting, the user will be prompted to update
    BitLocker and BitLocker To Go Reader will be deleted from the drive. In this situation, for the removable drive to be
    unlocked on computers running Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with SP2, BitLocker
    To Go Reader must be installed on the computer. If this check box is not selected, BitLocker To Go Reader will be installed
    on the removable drive to enable users to unlock the drive on computers running Windows Server 2008, Windows Vista, Windows
    XP with SP3, or Windows XP with SP2 that do not have BitLocker To Go Reader installed. If this policy setting is disabled,
    removable data drives formatted with the FAT file system that are BitLocker-protected cannot be unlocked on computers
    running Windows Server 2008, Windows Vista, Windows XP with SP3, or Windows XP with SP2. Bitlockertogo.exe will not be
    installed. Note: This policy setting does not apply to drives that are formatted with the NTFS file system. The recommended
    state for this setting is: Disabled.'
