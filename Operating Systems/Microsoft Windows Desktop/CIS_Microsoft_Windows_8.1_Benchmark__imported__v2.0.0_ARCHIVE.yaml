  description: 'This policy setting determines whether local accounts that are not password protected can be used to log on
    from locations other than the physical computer console. If you enable this policy setting, local accounts that have blank
    passwords will not be able to log on to the network from remote client computers. Such accounts will only be able to log
    on at the keyboard of the computer. The recommended state for this setting is: Enabled.'
  rationale: Blank passwords are a serious threat to computer security and should be forbidden through both organizational
    policy and suitable technical measures. In fact, the default settings for Active Directory domains require complex passwords
