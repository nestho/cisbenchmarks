  - Level 2 + BitLocker
  description: 'Dictates whether or not Windows is allowed to use standby states when sleeping the computer. When this policy
    is enabled, Windows may use standby states to sleep the computer. If this policy is disabled, the only sleep state a computer
    may enter is hibernate. The recommended state for this setting is: Disabled.'
  rationale: System sleep states (S1-S3) keep power to the RAM which may contain secrets, such as the BitLocker volume encryption
    key. An attacker finding a computer in sleep states (S1-S3) could directly attack the memory of the computer and gain
    access to the secrets through techniques such as RAM reminisce and direct memory access (DMA).
  impact: Users will not be able to use Sleep (S3) which resumes faster than Hibernation (S4).
