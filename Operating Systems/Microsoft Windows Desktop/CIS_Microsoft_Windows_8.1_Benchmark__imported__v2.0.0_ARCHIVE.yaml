- id: 2.3.13.2
  title: '(L1) Set ''Recovery console: Allow floppy copy and access to all drives and all folders'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1 + BitLocker
  - Level 2
  - Level 2 + BitLocker
  description: 'This policy setting makes the Recovery Console SET command available, which allows you to set the following
    recovery console environment variables: • AllowWildCards. Enables wildcard support for some commands (such as the DEL
    command). • AllowAllPaths. Allows access to all files and folders on the computer. • AllowRemovableMedia. Allows files
    to be copied to removable media, such as a floppy disk. • NoCopyPrompt. Does not prompt when overwriting an existing file.
    The recommended state for this setting is: Disabled. This policy setting determines whether users'' private keys (such
    as their S-MIME keys) require a password to be used. If you configure this policy setting so that users must provide a
    password—distinct from their domain password—every time that they use a key, then it will be more difficult for an attacker
    to access locally stored keys, even an attacker who discovers logon passwords. The recommended state for this setting
    is: User is prompted when the key is first used or higher.'
  rationale: An attacker who can cause the system to restart into the Recovery Console could steal sensitive data and leave
    no audit or access trail. If a users account is compromised or their computer is inadvertently left unsecured the malicious
    user can use the keys stored for the user to access protected resources. You can configure this policy setting so that
    users must provide a password that is distinct from their domain password every time they use a key. This configuration
    makes it more difficult for an attacker to access locally stored user keys, even if the attacker takes control of the
    user's computer and determines their logon password.
  impact: 'Users who have started a server through the Recovery Console and logged in with the built-in Administrator account
    will not be able to copy files and folders to a floppy disk. Users will have to enter their password every time they access
    a key that is stored on their computer. For example, if users use an S-MIME certificate to digitally sign their email
    they will be forced to enter the password for that certificate every time they send a signed e-mail message. For some
    organizations the overhead that is involved using this configuration may be too high. For end user computers that are
    used to access sensitive data this setting could be set to "User is prompted when the key is first used," but Microsoft
    does not recommend enforcing this setting on servers due to the significant impact on manageability. For example, if this
    setting is configured to "User is prompted when the key is first used" you may not be able to configure Remote Desktop
    Services to use SSL certificates. More information is available in the Windows PKI blog: http://blogs.technet.com/b/pki/archive/2009/06/17/what-is-a-strong-key-protection-inwindows.aspx.'
  references:
