  title: (L2) Set 'Turn off Microsoft Peer-to-Peer Networking Services' to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  - Level 2 + BitLocker
  - Level 1
  - Level 1 + BitLocker
  description: 'The Peer Name Resolution Protocol (PNRP) allows for distributed resolution of a name to an IPV6 address and
    port number. The protocol operates in the context of clouds. A cloud is a set of peer computers that can communicate with
    each other by using the same IPv6 scope. Peer-to-Peer protocols allow for applications in the areas of RTC, collaboration,
    content distribution and distributed processing. The recommended state for this setting is: Enabled. You can use this
    procedure to enable or disable the user''s ability to install and configure a network bridge. The recommended state for
    this setting is: Enabled.'
  rationale: This setting enhances the security of the environment and reduces the overall risk exposure related to peer-to-peer
    networking. Allowing users to create a network bridge increases the risk and attack surface from the bridged network.
  impact: If you enable this setting, peer-to-peer protocols will be turned off. If you disable this setting or do not configure
    it, the peer-to-peer protocols will be turned on. This setting turns off Microsoft Peer-to-Peer Networking Services in
    its entirety, and will cause all dependent applications to stop working. The Network Bridge setting, if enabled, allows
    users to create a Layer 2 Media Access Control (MAC) bridge, enabling them to connect two or more physical network segments
    together. A network bridge thus allows a computer that has connections to two different networks to share data between
    those networks. In an enterprise environment, where there is a need to control network traffic to only authorized paths,
    you can disable the Network Bridge setting on a computer. If you disable Network Bridge on a computer, users cannot create
    or configure a network bridge. Membership in the local Administrators group, or equivalent, is the minimum required to
    complete this procedure.
  references: []
