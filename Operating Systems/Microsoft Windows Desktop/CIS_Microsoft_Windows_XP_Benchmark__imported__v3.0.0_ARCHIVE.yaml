- id: 1.2.2.1.1
  title: Set 'Restrictions for Unauthenticated RPC clients' to 'Enabled:Authenticated'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting configures the RPC Runtime on an RPC server to restrict unauthenticated RPC clients from
    connecting to the RPC server. A client will be considered an authenticated client if it uses a named pipe to communicate
    with the server or if it uses RPC Security. RPC interfaces that have specifically asked to be accessible by unauthenticated
    clients may be exempt from this restriction, depending on the selected value for this policy.
  rationale: Unauthenticated RPC communication can create a security vulnerability.
  impact: RPC applications that do not authenticate unsolicited inbound connection requests may not work properly when this
    configuration is applied. Ensure you test applications before you deploy this policy setting throughout your environment.
    Although the Authenticated value for this policy setting is not completely secure, it can be useful for providing application
    compatibility in your environment.
  references: []
  page_start: 495
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows

    NT\Rpc:RestrictRemoteClients'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled. Then set the available option to Authenticated.

    Computer Configuration\Administrative Templates\System\Remote Procedure

    Call\Restrictions for Unauthenticated RPC clients'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows

      NT\Rpc:RestrictRemoteClients'
    severity: medium
- id: 1.2.2.1.2
  title: Set 'RPC Endpoint Mapper Client Authentication' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: If you enable this policy setting, client computers that communicate with this computer are forced to provide
    authentication before RPC communication can be established. By default, RPC clients do not use authentication to communicate
    with the RPC Server Endpoint Mapper Service when they request the endpoint of a server.
  rationale: Anonymous access to RPC services could result in accidental disclosure of information to unauthenticated users.
  impact: RPC clients will be forced to authenticate before they can begin communicating with the desired RPC service, this
    means that anonymous access will not be available and RPC clients that do not support authentication will fail.
  references: []
  page_start: 496
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

