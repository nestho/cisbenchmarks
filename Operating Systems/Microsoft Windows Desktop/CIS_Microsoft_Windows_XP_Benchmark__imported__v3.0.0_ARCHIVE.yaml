- id: 1.1.1.2.6
  title: Set 'Prevent local guests group from accessing security log' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether guests are denied access to the Security event log. A user must be
    assigned the Manage auditing and security log user right (not defined in this guidance) to access the Security log. Therefore,
    this policy setting has no real effect on computers with default configurations. Note: This setting does not appear in
    the Local Computer Policy object.'
  rationale: An attacker who has successfully logged onto a computer with guest privileges could learn important information
    about the computer if they were able to view the event logs. The attacker could then use this information to implement
    additional exploits.
  impact: None. This is the default configuration.
  references: []
  page_start: 320
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to True.

    Computer Configuration\Windows Settings\Security Settings\Event Log\Prevent

    local guests group from accessing security log'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.1.2.7
  title: Set 'Retention method for security log' to 'Overwrites events as needed'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting determines the wrapping method for the Security log. It is imperative that the Security
    log is archived regularly if historical events are desirable for either forensics or troubleshooting purposes. Overwriting
    events as needed ensures that the log always stores the most recent events, although this configuration could result in
    a loss of historical data.
  rationale: 'If you significantly increase the number of objects to audit in your organization, there is a risk that the
    Security log will reach its capacity and force the computer to shut down. If such a shutdown occurs, the computer will
    be unusable until an administrator clears the Security log. To prevent such a shutdown, you can disable the Audit: Shut
    down system immediately if unable to log security audits setting that is described in Security Options and then increase
    the Security log size. If you set the Event log retention method to Manual or Overwrite events by days, it is possible
    for important recent events to not be recorded or for a DoS attack to occur.'
  impact: When event logs fill to capacity, they will stop recording information unless the retention method is set so that
    the computer can overwrite the oldest entries with the most recent ones.
  references: []
  page_start: 321
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to WhenNeeded.

    Computer Configuration\Windows Settings\Security Settings\Event Log\Retention

    method for security log'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
