  title: Set 'Reschedule Automatic Updates scheduled installations' to 'Enabled:10'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines the amount of time before previously scheduled Automatic Update installations
    will proceed after system startup. If you configure this policy setting to Enabled, a previously scheduled installation
    will begin after a specified number of minutes when you next start the computer. If you configure this policy setting
    to Disabled or Not configured, previously scheduled installations will occur during the next regularly scheduled installation
    time. Note: This policy setting only works when Automatic Updates is configured to perform scheduled update installations.
    If the Configure Automatic Updates setting is Disabled, the Reschedule Automatic Updates scheduled installations setting
    has no effect. You can enable the latter two settings to ensure that previously missed installations will be scheduled
    to install each time the computer restarts.'
  rationale: If Automatic Updates is not forced to wait a few minutes after a restart, computers in your environment might
    not have enough time to completely start all of their applications and services. If you specify enough time after a restart,
    new update installations should not conflict with the computer's startup procedures.
  impact: Automatic Updates will not start until 10 minutes after the computer restarts.
