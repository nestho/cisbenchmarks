- id: 1.2.3.3.1
  title: Configure 'Require trusted path for credential entry.'
  scoring: manual
  profile:
  - Level 1
  description: 'If you enable this policy setting, users are required to enter Windows credentials on the Secure Desktop by
    means of the trusted path mechanism. This means that before entering account and password information to authorize an
    elevation request, a user first need to press CTRL+ALT+DEL. This policy setting helps prevent Terminal Services clients
    from saving passwords on a computer. Note If this policy setting was previously configured as Disabled or Not configured,
    any previously saved passwords will be deleted the first time a Terminal Services client disconnects from any server.
    This policy setting helps prevent Terminal Services clients from saving passwords on a computer. Note If this policy setting
    was previously configured as Disabled or Not configured, any previously saved passwords will be deleted the first time
    a Terminal Services client disconnects from any server. This policy setting allows you to control if users can connect
    to a computer using Terminal Services or Remote Desktop. This policy setting prevents users from sharing the local drives
    on their client computers to Terminal Servers that they access. Mapped drives appear in the session folder tree in Windows
    Explorer in the following format: \\TSClient\$ If local drives are shared they are left vulnerable to intruders who want
    to exploit the data that is stored on them. This policy setting specifies whether Terminal Services always prompts the
    client computer for a password upon connection. You can use this policy setting to enforce a password prompt for users
    who log on to Terminal Services, even if they already provided the password in the Remote Desktop Connection client. By
    default, Terminal Services allows users to automatically log on if they enter a password in the Remote Desktop Connection
    client. The Always prompt client for password upon connection setting is configured to Enabled for both of the environments
    that are discussed in this guide. Note If you do not configure this policy setting, the local computer administrator can
    use the Terminal Services Configuration tool to either allow or prevent passwords from being automatically sent. This
    policy setting specifies whether the computer that is about to host the remote connection will enforce an encryption level
    for all data sent between it and the client computer for the remote session.'
  rationale: Requiring the use of a trusted path helps prevent a Trojan horse or other types of malicious code from stealing
    the user's Windows credentials. An attacker with physical access to the computer may be able to break the protection guarding
    saved passwords. An attacker who compromises a user's account and connects to their computer could use saved passwords
    to gain access to additional hosts. An attacker with physical access to the computer may be able to break the protection
    guarding saved passwords. An attacker who compromises a user's account and connects to their computer could use saved
    passwords to gain access to additional hosts. Any account with the Allow log on through Terminal Services user right can
    log on to the remote console of the computer. If you do not restrict access to legitimate users who need to log on to
    the console of the computer, unauthorized users could download and execute malicious code to elevate their privileges.
    Data could be forwarded from the user's Terminal Server session to the user's local computer without any direct user interaction.
    Users have the option to store both their username and password when they create a new Remote Desktop connection shortcut.
    If the server that runs Terminal Services allows users who have used this feature to log on to the server but not enter
    their password, then it is possible that an attacker who has gained physical access to the user's computer could connect
    to a Terminal Server through the Remote Desktop connection shortcut, even though they may not know the user's password.
    If Terminal Server client connections are allowed that use low level encryption, it is more likely that an attacker will
    be able to decrypt any captured Terminal Services network traffic.
  impact: If you disable or do not configure this policy setting, users can enter Windows credentials within the user's desktop
    session, potentially allowing malicious code access to the user's Windows credentials. If you enable this policy setting,
    the password saving checkbox is disabled for Terminal Services clients and users will not be able to save passwords. If
    you enable this policy setting, the password saving checkbox is disabled for Terminal Services clients and users will
    not be able to save passwords. If this setting is enabled legitimate users will be unable to use Terminal Services or
    Remote Desktop, this could make it more difficult for help desk technicians to troubleshoot and resove problems remotely.
    It would also make it impossible to use Terminal Services for hosting shared applications. Drive redirection will not
    be possible. Users will always have to enter their password when they establish new Terminal Server sessions. Clients
    that do not support 128-bit encryption will be unable to establish Terminal Server sessions.
  references: []
