  rationale: 'Password attacks can use automated methods to try millions of password combinations for any user account. The
    effectiveness of such attacks can be almost eliminated if you limit the number of failed logons that can be performed.
    However, a denial of service (DoS) attack could be performed on a domain that has an account lockout threshold configured.
    An attacker could programmatically attempt a series of password attacks against all users in the organization. If the
    number of attempts is greater than the account lockout threshold, the attacker might be able to lock out every account.
    Users can accidentally lock themselves out of their accounts if they mistype their password multiple times. To reduce
    the chance of such accidental lockouts, the Reset account lockout counter after setting determines the number of minutes
    that must elapse before the counter that tracks failed logon attempts and triggers lockouts is reset to 0. A denial of
    service (DoS) condition can be created if an attacker abuses the Account lockout threshold and repeatedly attempts to
    log on with a specific account. Once you configure the Account lockout threshold setting, the account will be locked out
    after the specified number of failed attempts. If you configure the Account lockout duration setting to 0, then the account
    will remain locked out until an administrator unlocks it manually. See parent information. See parent information. See
    parent information. Many attacker tools take advantage of computers that accept ICMP message types and use these messages
    to mount a variety of attacks. See parent information. Some attacks have exploited the ports that are typically used by
