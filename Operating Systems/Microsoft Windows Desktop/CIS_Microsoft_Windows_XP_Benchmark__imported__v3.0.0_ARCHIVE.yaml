  title: Configure 'Remove CD Burning features'
  scoring: manual
  profile:
  - Level 1
  description: This policy setting removes the built-in Windows Vista features that allow users to burn CDs through Windows
    Explorer. Windows Vista allows you to create and modify rewritable CDs if you have a read/write CD drive connected to
    your computer. This feature can be used to copy large amounts of data from a hard drive to a CD, which may then be removed
    from the computer. Note This policy setting does not prevent CDs from being modified or created by third-party applications
    that use a CD writer. Microsoft recommends the use of AppLocker or software restriction policies to block the creation
    or modification of CDs by third-party applications. Another way to prevent users from burning CDs is to remove the CD
    writers from the client computers in your environment or replace them with read-only CD drives.
  rationale: The built-in CD burning feature can be used to surreptitiously copy information that resides on the computer
    or on the network.
  impact: When the Remove CD Burning features setting is Enabled, no CDs can be written without the use of third-party applications.
  references: []
