- id: 1.1.1.3.43
  title: Configure 'DNS Client'
  scoring: manual
  profile:
  - Level 1
  description: 'The DNS Client service (dnscache) caches Domain Name System (DNS) names and registers the full computer name
    for this computer. If the service is stopped, DNS names will continue to be resolved. However, the results of DNS name
    queries will not be cached and the computer''s name will not be registered. If the service is disabled, any services that
    explicitly depend on it will fail to start. This policy setting checks all new passwords to ensure that they meet basic
    requirements for strong passwords. When this policy is enabled, passwords must meet the following minimum requirements:
    . Not contain the user''s account name or parts of the user''s full name that exceed two consecutive characters . Be at
    least six characters in length . Contain characters from three of the following four categories: . English uppercase characters
    (A through Z) . English lowercase characters (a through z) . Base 10 digits (0 through 9) . Non-alphabetic characters
    (for example, !, $, #, %) . A catch-all category of any Unicode character that does not fall under the previous four categories.
    This fifth category can be regionally specific. Each additional character in a password increases its complexity exponentially.
    For instance, a seven-character, all lower-case alphabetic password would have 267 (approximately 8 x 109 or 8 billion)
    possible combinations. At 1,000,000 attempts per second (a capability of many passwordcracking utilities), it would only
    take 133 minutes to crack. A seven-character alphabetic password with case sensitivity has 527 combinations. A seven-character
    case-sensitive alphanumeric password without punctuation has 627 combinations. An eight-character password has 268 (or
    2 x 1011) possible combinations. Although this might seem to be a large number, at 1,000,000 attempts per second it would
    take only 59 hours to try all possible passwords. Remember, these times will significantly increase for passwords that
    use ALT characters and other special keyboard characters such as ! or @. Proper use of the password settings can help
    make it difficult to mount a brute force attack. This policy setting determines the least number of characters that make
    up a password for a user account. There are many different theories about how to determine the best password length for
    an organization, but perhaps pass phrase is a better term than password. In Microsoft Windows 2000 or later, pass phrases
    can be quite long and can include spaces. Therefore, a phrase such as I want to drink a $5 milkshake is a valid pass phrase;
    it is a considerably stronger password than an 8 or 10 character string of random numbers and letters, and yet is easier
    to remember. Users must be educated about the proper selection and maintenance of passwords, especially with regard to
    password length. In enterprise environments, ensure that the value for the Minimum password length setting is configured
    to 8 characters. This policy setting is long enough to provide adequate security. In high security environments, configure
    the value to 12 characters. This policy setting determines the number of renewed, unique passwords that have to be associated
    with a user account before you can reuse an old password. The value for this policy setting must be between 0 and 24 passwords.
    The default value for Windows Vista is 0 passwords, but the default setting in a domain is 24 passwords. To maintain the
    effectiveness of this policy setting, use the Minimum password age setting to prevent users from repeatedly changing their
    password. This policy setting defines how long a user can use their password before it expires. Values for this policy
    setting range from 0 to 999 days. If you set the value to 0, the password will never expire. The default value for this
    policy setting is 42 days. Because attackers can crack passwords, the more frequently you change the password the less
    opportunity an attacker has to use a cracked password. However, the lower this value is set, the higher the potential
    for an increase in calls to help desk support due to users having to change their password or forgetting which password
    is current. This policy setting determines whether the operating system stores passwords in a way that uses reversible
    encryption, which provides support for application protocols that require knowledge of the user''s password for authentication
    purposes. Passwords that are stored with reversible encryption are essentially the same as plaintext versions of the passwords.
    This policy setting determines the number of days that you must use a password before you can change it. The range of
    values for this policy setting is between 1 and 999 days. (You may also set the value to 0 to allow immediate password
    changes.) The default value for this setting is 0 days.'
  rationale: 'Any service or application is a potential point of attack. Therefore, you should disable or remove any unneeded
    services or executable files in your environment. There are additional optional services available in Windows that are
    not installed during a default installation of the operating system. Depending on the version of Windows you can add these
    optional services to an existing computer through Add/Remove Programs in Control Panel, Programs and Features in Control
    Panel, Server Manager, or the Configure Your Server Wizard. Important: If you enable additional services, they may depend
    on other services. Add all of the services that are needed for a specific server role to the policy for the server role
    that it performs in your organization. Passwords that contain only alphanumeric characters are extremely easy to discover
    with several publicly available tools. Types of password attacks include dictionary attacks (which attempt to use common
    words and phrases) and brute force attacks (which try every possible combination of characters). Also, attackers sometimes
    try to obtain the account database so they can use tools to discover the accounts and passwords. The longer a user uses
    the same password, the greater the chance that an attacker can determine the password through brute force attacks. Also,
    any accounts that may have been compromised will remain exploitable for as long as the password is left unchanged. If
    password changes are required but password reuse is not prevented, or if users continually reuse a small number of passwords,
    the effectiveness of a good password policy is greatly reduced. If you specify a low number for this policy setting, users
    will be able to use the same small number of passwords repeatedly. If you do not also configure the Minimum password age
    setting, users might repeatedly change their passwords until they can reuse their original password. The longer a password
    exists the higher the likelihood that it will be compromised by a brute force attack, by an attacker gaining general knowledge
    about the user, or by the user sharing the password. Configuring the Maximum password age setting to 0 so that users are
    never required to change their passwords is a major security risk because that allows a compromised password to be used
    by the malicious user for as long as the valid user is authorized access. Enabling this policy setting allows the operating
    system to store passwords in a weaker format that is much more susceptible to compromise and weakens your system security.
    Users may have favorite passwords that they like to use because they are easy to remember and they believe that their
    password choice is secure from compromise. Unfortunately, passwords are compromised and if an attacker is targeting a
    specific individual user account, with foreknowledge of data about that user, reuse of old passwords can cause a security
    breach. To address password reuse a combination of security settings is required. Using this policy setting with the Enforce
    password history setting prevents the easy reuse of old passwords. For example, if you configure the Enforce password
    history setting to ensure that users cannot reuse any of their last 12 passwords, they could change their password 13
    times in a few minutes and reuse the password they started with, unless you also configure the Minimum password age setting
    to a number that is greater than 0. You must configure this policy setting to a number that is greater than 0 for the
    Enforce password history setting to be effective.'
  impact: 'If some services (such as the Security Accounts Manager) are disabled, you will not be able to restart the computer.
    If other critical services are disabled, the computer may not be able to authenticate with domain controllers. If you
    wish to disable some system services, you should test the changed settings on non-production computers before you change
    them in a production environment. It is also possible to alter the access control list (ACL) for a service, however do
    so with caution because unexpected results may arise. For example, changing the default permissions may cause enterprise
    management software to lose the ability to query the state of that service. If the default password complexity configuration
    is retained, additional help desk calls for locked-out accounts could occur because users might not be accustomed to passwords
    that contain non-alphabetic characters. However, all users should be able to comply with the complexity requirement with
    minimal difficulty. If your organization has more stringent security requirements, you can create a custom version of
    the Passfilt.dll file that allows the use of arbitrarily complex password strength rules. For example, a custom password
    filter might require the use of non-upper row characters. (Upper row characters are those that require you to hold down
    the SHIFT key and press any of the digits between 1 and 0.) A custom password filter might also perform a dictionary check
    to verify that the proposed password does not contain common dictionary words or fragments. Also, the use of ALT key character
    combinations can greatly enhance the complexity of a password. However, such stringent password requirements can result
    in unhappy users and an extremely busy help desk. Alternatively, your organization could consider a requirement for all
    administrator passwords to use ALT characters in the 01280159 range. (ALT characters outside of this range can represent
    standard alphanumeric characters that would not add additional complexity to the password.) Requirements for extremely
    long passwords can actually decrease the security of an organization, because users might leave the information in an
    insecure location or lose it. If very long passwords are required, mistyped passwords could cause account lockouts and
    increase the volume of help desk calls. If your organization has issues with forgotten passwords due to password length
    requirements, consider teaching your users about pass phrases, which are often easier to remember and, due to the larger
    number of character combinations, much harder to discover. Note: Older versions of Windows such as Windows 98 and Windows
    NT® 4.0 do not support passwords that are longer than 14 characters. Computers that run these older operating systems
    are unable to authenticate with computers or domains that use accounts that require long passwords. The major impact of
    this configuration is that users must create a new password every time they are required to change their old one. If users
    are required to change their passwords to new unique values, there is an increased risk of users who write their passwords
    somewhere so that they do not forget them. Another risk is that users may create passwords that change incrementally (for
    example, password01, password02, and so on) to facilitate memorization but make them easier to guess. Also, an excessively
    low value for the Minimum password age setting will likely increase administrative overhead, because users who forget
    their passwords might ask the help desk to reset them frequently. If the Maximum password age setting is too low, users
    are required to change their passwords very often. Such a configuration can reduce security in the organization, because
    users might write their passwords in an insecure location or lose them. If the value for this policy setting is too high,
    the level of security within an organization is reduced because it allows potential attackers more time in which to discover
    user passwords or to use compromised accounts. If your organization uses either the CHAP authentication protocol through
    remote access or IAS services or Digest Authentication in IIS, you must configure this policy setting to Enabled. This
    setting is extremely dangerous to apply through Group Policy on a user-by-user basis, because it requires the appropriate
    user account object to be opened in Active Directory Users and Computers. If an administrator sets a password for a user
    but wants that user to change the password when the user first logs on, the administrator must select the User must change
    password at next logon check box, or the user will not be able to change the password until the next day.'
