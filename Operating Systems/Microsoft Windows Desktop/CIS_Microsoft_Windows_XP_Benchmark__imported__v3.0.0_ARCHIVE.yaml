  title: Set 'Hide mechanisms to remove zone information' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting allows you to manage whether users can manually remove the zone information from saved
    file attachments. Typically, users can either click the Unblock button in the file's Property sheet or select a check
    box in the Security Warning dialog. If the zone information is removed, users can open potentially dangerous file attachments
    that Windows has prevented users from opening. When the Hide mechanisms to remove zone information setting is enabled,
    Windows hides the check box and Unblock button. When this policy setting is disabled, Windows displays the check box and
    the Unblock button. Because dangerous attachments are often downloaded from untrusted Internet Explorer zones such as
    the Internet zone, it is recommended that you configure this policy setting to Enabled to help ensure that as much security
    information as possible is retained with each file. Note To configure whether files are saved with zone information, see
    the Do not preserve zone information in file attachments setting.
  rationale: A user might remove information that indicates a file came from an untrustworthy location.
  impact: Users who have a legitimate need to remove zone information from files will not be able to do so.
  references: []
