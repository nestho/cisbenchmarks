- id: 1.2.2.5.2
  title: Configure 'Do not process the run once list'
  scoring: manual
  profile:
  - Level 1
  description: This policy setting causes the run once list, which is the list of programs that Windows Vista runs automatically
    when it starts, to be ignored. This policy setting differs from the Do not process the legacy run list setting in that
    programs on this list will run once the next time the client computer restarts and an administrator logs on. Setup and
    installation programs are sometimes added to this list to complete installations after a client computer restarts. If
    you enable this policy setting, attackers generally cannot use the run once list to launch rogue applications, which was
    a common method of attack in the past. A malicious user can exploit the run once list to install a program that may compromise
    the security of Windows Vistabased client computers, however since editing this list requires administrator privileges
    the importance of configuring this setting is not high.
  rationale: A malicious user can exploit the run once list to install a program that may compromise the security of Windows
    clients.
  impact: If you enable the Do not process the run once list setting you should experience minimal functionality loss for
    users in your environment, especially if the clients have been configured with all of your organization's standard software
    before you apply this setting through Group Policy. However, this configuration may prevent some setup and installation
    programs, such as Internet Explorer, from working properly.
  references: []
