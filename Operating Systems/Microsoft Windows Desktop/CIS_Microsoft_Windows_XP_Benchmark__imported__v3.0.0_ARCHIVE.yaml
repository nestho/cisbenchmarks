  title: Configure 'Prevent access to registry editing tools'
  scoring: manual
  profile:
  - Level 1
  description: This policy setting disables the Windows registry editors Regedit.exe and Regedt32.exe.
  rationale: Due to default permissions unprivileged users have little ability to modify sensitive data in the registry, nevertheless,
    preventing them from using registry editing tools will ensure that they are unable to view or modify any data stored there
    except through the normal graphical tools. Note that the value of this countermeasure is diminished by the fact that the
    user may find a third party tool that allows him to do the same thing.
  impact: If you enable this policy setting, a message will display when users try to use a registry editor that informs them
    that they cannot use either of these editors. This policy setting removes the ability of users and intruders to access
    the registry with these tools, but does not prevent access to the registry itself.
