- id: 2.3.1.4.24
  title: (L2) Ensure Advanced Protection Program is configured
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Enable Google's Advanced Protection Platform for all users and prevent the use of security codes where applicable.
  rationale: 'Sophisticated phishing tactics can trick the most savvy users into giving their sign-in credentials to attackers.
    Advanced Protection requires you to use a security key, which is a hardware device or special software on your phone used
    to verify your identity, to sign in to your Google Account. Unauthorized users won’t be able to sign in without your security
    key, even if they have your username and password. The Advanced Protection Program includes a curated group of high-security
    policies that are applied to enrolled accounts. Additional policies may be added to the Advanced Protection Program to
    ensure the protections are current. Advanced Protection allows you to apply all of these protections at once, and override
    similar settings you may have configured manually. These policies include: • Strong authentication with security keys
    • Use of security codes with security keys (as needed) • Restrictions on third-party access to account data • Deep Gmail
    scans • Google Safe Browsing protections in Chrome (when users are signed into Chrome using the same identity as their
    Advanced Protection Program identity) • Account recovery through admin'
  impact: 'User Impact • You need your security key when you sign in for the first time on a computer, browser, or device.
    If you stay signed in, you may not be asked to use your security key the next time you log in. • Limits third-party app
    access to your data, puts stronger checks on suspicious downloads, and tightens account recovery security to help prevent
    unauthorized access. Security Keys - 2 Required • Android: With an Android 7.0+ phone, you can enroll in a few taps by
    registering your phone’s built-in security key. • iPhone: If you have an iPhone running iOS 10.0+, install the Google
    Smart Lock app to register your security key first, then enroll. • Two security keys are required for added assurance.
    If one key is lost or damaged, users can use the second key to regain account access. Third-Party iDP • You can use the
    Advanced Protection Program with accounts that federate from an IdP using SAML. When users with these accounts enroll
    in the Advanced Protection Program, we’ll require security key use after the user signs in on the IdP. Note that SAML
    users can select Remember the device to avoid challenges on a browser or device. Security Codes • Before allowing users
    to generate security codes, carefully evaluate if your organization needs them. Using security keys with security codes
    increases the risk of phishing. However, if your organization has important workflows where security keys can’t be used
    directly, enabling security codes for those situations may help improve your security posture overall. Using ''Sign in
    with Google'' with other apps and services • You can still sign into apps and services with Google. If they request access
    to your Gmail or Drive data, access is denied.'
  references: []
  page_start: 100
