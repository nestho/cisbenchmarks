- id: 2.3.2.3.2
  title: (L1) Ensure 'Variations' Is Set to 'Enable Chrome variations'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Configuring this setting allows specifying which variations are allowed to be applied in Google Chrome. Variations
    provide a means for Google to offer modifications to Google Chrome without shipping a new version of the browser by selectively
    enabling or disabling already existing features. • Enable all variations: Allows all variations to be applied to the browser
    (Default value). • Enable variations concerning critical fixes only: Allows only variations considered critical security
    or stability fixes to be applied to Google Chrome. • Disable all variations: Prevent all variations from being applied
    to the browser. Please note that this mode can potentially prevent the Google Chrome developers from providing critical
    security fixes in a timely manner and is thus not recommended. The recommended state for this setting is: Enable all variations
    NOTE: Google strongly believes there is no added security benefit for turning this to critical fixes, as leaving it on
    increases the stability of the browser. Disabling variations can also prevent getting critical security updates in a timely
    manner.'
  rationale: Google strongly recommends leaving this setting at the default (0 = Enable all variations), so fixes are gradually
    enabled (or if necessary, rapidly disabled) via the Chrome Variations framework.
  impact: None - This is the default behavior.
  references:
  - 1. https://chromeenterprise.google/policies/#ChromeVariations
  - 2. https://support.google.com/chrome/a/answer/9805991?p=Manage_the_Chrome_
