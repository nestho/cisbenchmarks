- id: 2.3.1.4.5
  title: (L1) Ensure 'Post-quantum TLS' Is Set to 'Allow postquantum key agreement in TLS connections'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: This configures whether Google Chrome will offer a post-quantum key agreement algorithm in TLS, using the ML-KEM
    NIST standard, and will protect user traffic from quantum computers when communicating with compatible servers. Enabling
    a postquantum key agreement is backwards compatible, so there will be no issue with existing TLS servers. The Lock screen
    PIN is a secure and convenient alternative for day-to-day use. Its security relies on the underlying hardware and software
    design of ChromeOS to protect against brute-force attacks and ensure that it cannot be used to compromise the user's broader
    Google Account.
  rationale: This will protect user traffic from quantum computer decrypting. The Lock screen PIN is a security feature designed
    to encourage frequent use of the lock screen by offering a simple, convenient way to unlock the device. Its security rationale
    is based on the idea that user convenience leads to better security habits. While the PIN has lower entropy than a full
    password, its security is reinforced by hardware-based protections that prevent brute-force attacks. It acts as a local
    credential to unlock encrypted user data, protecting against opportunistic theft and snooping, without compromising the
    user's main Google Account. The system is a secure and user-friendly compromise that balances convenience with robust
    protection.
  impact: There should be no impact on the user Allowing no weak PINs and a minimum length of 6 creates a minor, one-time
    inconvenience for the user in the name of significantly enhanced device security. The user must adapt to a more complex
    PIN, but the benefit is a much stronger defense against both opportunistic and targeted attacks on their local device
    data.
