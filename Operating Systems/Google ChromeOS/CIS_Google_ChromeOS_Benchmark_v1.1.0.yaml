  title: (L2) Ensure 'Audio input (microphone)' is set to 'Disable audio input'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting allows administrators to set whether the end-user is prompted for access to audio capture devices.
    • Disable audio input - turns off prompts • Prompt user to allow each time - users get prompted for audio capture access.
    NOTE: The setting affects all audio input (not just the built-in microphone). The recommended state for this setting is:
    Disable audio input'
  rationale: The end-user having the ability to allow or deny audio capture for websites in Google Chrome could open an organization
    up to a malicious site that may capture proprietary information through the browser. By limiting or disallowing audio
    capture, it removes the end-user's discretion, leaving it up to the organization which sites are allowed to use this ability.
  impact: If you disable this setting, users will not be prompted for audio devices when using websites which may need this
    access, such as a web-based conferencing system. If there are sites to which access will be allowed, configuration of
    the AudioCaptureAllowedUrls setting will be necessary.
