  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: This policy allows Google ChromeOS to report data back to Google. That data is made up of diagnostic data,
    crash reports, and usage metrics. It does not include web page URLs or any personal information except in crash reports.
    Depending on what was happening at the time of the crash, the crash report contains system information at the time of
    the crash and might contain webpage URLs or personal information.
  rationale: Sending any data to an organization outside of your own, even aggregated, could lead to data leakage and should
    be avoided.
