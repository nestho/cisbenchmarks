  title: (L1) Ensure 'Local file access to file:// URLs on these sites in the PDF Viewer' Is Not Set
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting will allow specified URLs to access file:// URLs in the PDF Viewer. By default all domains are
    blocked from accessing file:// URLs in the PDF Viewer This setting will block any site from accessing the storage session
    from any other site. This will block third party trackers that are embedded on multiple sites from tracking a user across
    the sites they visit. Blocking third party access to the user agent will not allow sites to infer data about the user
    from the data from another site. It can be configured to either: • Enabled (1): Allow third-party storage partitioning
    to be enabled. • Disabled (2): Block third-party storage partitioning from being enabled.'
  rationale: Blocking all domains, or a restricted list of domains, from opening a downloaded PDF file blocks the possibility
    of a malicious file being masked as a PDF. It could also block unknown or malicious code contained within the PDF that
    would run on the immediate opening within a browser tab. Setting this requires that user agent state needs to be keyed
    by more than a single origin or site. It can also defend against timing attacks on web privacy.
  impact: Users will be required to open PDF files manually in the PDF Viewer or in the organization's PDF viewing application.
    Enforcing this may cause users to experience issues with sites they regularly visit that already grant access to third-parties.
  references:
  - 1. https://chromeenterprise.google/policies/#PdfLocalFileAccessAllowedForDomain
  - 1. https://chromeenterprise.google/policies/#DefaultThirdPartyStoragePartitioningS
  - 2. https://privacycg.github.io/storage-partitioning/
