  title: (L1) Ensure 'TLS encrypted ClientHello' Is 'Enable the TLS Encrypted ClientHello experiment'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls the defaults for using Encrypted ClientHello (ECH). ECH is an extension to TLS and encrypts
    the initial handshake with a website that can only be decrypted by that website. Google Chrome may, or may not, use ECH
    based on 3 factors: server support, HTTPS DNS record availability, or rollout status. It can be configured to either:
    • Disabled (0): Disable the TLS Encrypted ClientHello experiment • Enabled (1): Enable the TLS Encrypted ClientHello experiment
    If the value for EncryptedClientHelloEnabled is not changed from the default, it will behave as if it is enabled. This
    setting controls the ability for Google Chrome to upgrade to HTTPS from HTTP while navigating to certain sites. It can
    be configured to either: • Disabled (0): Scripts for workers (Web Workers, Service Workers, etc.) use lax MIME type checking.
    Worker scripts with legacy MIME types, like text/ascii, will work. • Enabled (1): Scripts for workers (Web Workers, Service
    Workers, etc.) require a JavaScript MIME type, like text/javascript. Worker scripts with legacy MIME types, like text/ascii,
    will be rejected. If the value for StrictMimetypeCheckForWorkerScriptsEnabled is not changed from the default, it will
    behave as if it is enabled.'
  rationale: Previously all handshakes were in the open and could expose sensitive information, like the name of the website
    to which you are connecting. Setting this policy will allow Google Chrome to use an encrypted hello, or handshake, with
    a website where it is supported, thus not exposing sensitive information. Setting this policy will require worker scripts
    to use more secure and strict JavaScript MIME types and ones with legacy MIME Types will be rejected.
  impact: There should be no impact on the user. This should have no impact on users.
  references:
  - 1. https://chromeenterprise.google/policies/#EncryptedClientHelloEnabled
  - 1. https://chromeenterprise.google/policies/#StrictMimetypeCheckForWorkerScripts
