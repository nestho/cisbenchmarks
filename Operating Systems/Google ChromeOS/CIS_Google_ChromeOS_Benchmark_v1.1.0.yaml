  title: (L2) Ensure 'Ignore proxy on captive portals' Is Set to 'Keep policies for captive portal pages'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: This policy configures the ability for Google ChromeOS to bypass any proxy for captive portal authentication.
    If enabled, this causes authentication webpages – starting from the captive portal signin page until Chrome detects a
    successful internet connection – to open in a separate window and ignore all policy settings and restrictions for the
    current user. If disabled, this means any captive portal authentication pages are shown in a new browser tab that uses
    the current user's proxy settings. This policy only takes effect if a proxy is set up (by policy, extension, or the user
    in chrome://settings).
  rationale: Enabling captive portal sites to bypass proxy settings could grant access to the system from a malicious (or
    misconfigured) captive portal site. Setting the policy to disabled forces all sites, including captive portal sites, to
    use the configured proxy settings.
  impact: This may impact a user's access to certain captive portal sites that do not work with the configured proxy server.
  references:
  - 1. https://chromeenterprise.google/policies/#CaptivePortalAuthenticationIgnoresPro
  page_start: 130
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

