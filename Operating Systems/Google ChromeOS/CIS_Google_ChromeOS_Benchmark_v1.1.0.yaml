  description: This policy configures the ability for Google ChromeOS to bypass any proxy for captive portal authentication.
    If enabled, these authentication webpages, starting from the captive portal sign-in page until Chrome detects a successful
    internet connection, will open in a separate window and ignore all policy settings and restrictions for the current user.
    If disabled, any captive portal authentication pages are shown in a new browser tab that uses the current user's proxy
    settings. This policy only takes effect if a proxy is set up (by policy, extension, or the user in chrome://settings).
  rationale: Enabling captive portal sites to bypass proxy settings could grant access to the system from a malicious (or
