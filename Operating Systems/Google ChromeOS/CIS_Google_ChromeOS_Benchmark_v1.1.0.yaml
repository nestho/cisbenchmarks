  title: (L1) Ensure 'Download restrictions' is set to 'Block malicious downloads'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Google Chrome can block certain types of downloads, and won''t let users bypass the security warnings, depending
    on the classification of Safe Browsing. • No special restrictions (Default) • Block malicious downloads • Block malicious
    downloads and dangerous file types • Block malicious downloads, uncommon or unwanted downloads and dangerous file types
    • Block all downloads The recommended state for this setting is Block malicious downloads. NOTE: These restrictions apply
    to downloads triggered from webpage content, as well as the "Download link..." menu option. They don''t apply to the download
    of the currently displayed page or to saving as PDF from the printing options. Google provides the Safe Browsing service.
    It shows a warning page when users navigate to sites that are flagged as potentially malicious. The settings for the policy
    are: • Allow user to bypass Safe Browsing warning (Default) • Do not allow user to bypass Safe Browsing warning The recommended
    state for this setting is Do not allow user to bypass Safe Browsing warning. Google Chrome can use the Google Safe Search
    API to classify URLs as pornographic or not. The recommended state for this setting is: Filter top level sites (but not
    embedded iframes) for adult content'
  rationale: Users shall be prevented from downloading malicious file types and shall not be able to bypass security warnings.
    Malicious web pages are widely spread on the internet and pose the most significant threat to the user today. Users shall
    be prevented from navigating to potentially malicious web content. Allowing search results to present sites that may have
    malicious content should be prohibited to help ensure users do not accidentally visit sites that are more prone to malicious
    content including spyware, adware, and viruses.
  impact: 'If this setting is enabled, all downloads are allowed, except for those that carry Safe Browsing warnings. These
    are downloads that have been identified as risky or from a risky source by the Google Safe Browsing Global intelligence
    engine. Enabling this setting prevents users from proceeding anyway from the warning page to the malicious site. In some
    cases legitimate sites could be blocked and users would be prevented from accessing. Users'' search results will be filtered
    and content such as adult text, videos, and images will not be shown. NOTE: Using Googles Safe Search API may leak information
    which is typed/pasted by mistake into the omnibox, e.g. passwords, internal webservices, folder structures, etc.'
  references:
  - 1. https://chromeenterprise.google/policies/#DownloadRestrictions
  - 2. https://developers.google.com/safe-browsing
