    of their screen. NOTE: This setting is not considered (and a site will be allowed to use screen-share APIs) if the site
    matches an origin pattern in any of the following other settings: ScreenCaptureAllowedByOrigins, WindowCaptureAllowedByOrigins,
    TabCaptureAllowedByOrigins, SameOriginTabCaptureAllowedByOrigins.'
  rationale: Enabling this setting will upgrade the connection to a site from HTTP to HTTPS where available, verifying the
    identity of the site visited. Allowing search results to present sites that may have malicious content should be prohibited
    to help ensure users do not accidentally visit sites that are more prone to malicious content, including spyware, adware,
    and viruses. Allowing screen-share APIs within Google Chrome could potentially allow for sensitive data to be shared via
    screen captures.
