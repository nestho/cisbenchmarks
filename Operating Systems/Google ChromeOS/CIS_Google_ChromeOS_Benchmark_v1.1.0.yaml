  description: 'This setting allows administrators to set whether the end-user is prompted for access to video capture devices.
    • Disable camera input for websites and apps - turns off prompts • Enable camera input for website and apps - users get
    prompted for video capture access NOTE: The setting affects all video input (not just the built-in camera). The recommended
    state for this setting is Disable camera input for websites and apps. This setting controls website access and use of
    the system serial port. • Allow the user to decide (default) — Lets websites ask for access, but users can change this
    setting. • Allow sites to ask the user to grant access to serial ports via the Web Serial API — Lets websites ask the
    user for access to serial ports. • Do not allow any site to request access to serial ports via the Web Serial API The
    recommended state for this setting is: Do not allow any site to request access to serial ports via the Serial API NOTE:
    If more granular control is needed (per website) then this setting can be used in combination with the SerialAllowAllPortsForUrls,
    SerialAskForUrls and SerialBlockedForUrls settings. For example, SerialAllowAllPortsForUrls can be used to allow serial
    port access to specific sites. Please see the references below for more information.'
