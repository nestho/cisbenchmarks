  title: (L1) Ensure 'Device system log upload' Is Set to 'Enable device system log upload'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: This policy controls whether system logs are uploaded to the management server. The default is unset or no
    system logs are reported. This policy controls whether system traffic can go through an internet proxy server with authentication.
    This policy controls whether the AES Keylocker implementation is enabled for local user storage. This policy only applies
    to user homes which use dm-crypt for encryption. Legacy home users, those that do not use dm-crypt, are not supported
    and will default to AESNI (or disabled).
  rationale: System logs should be uploaded to allow your organization's admins to monitor system logs. The default to block
    system traffic from going through a proxy with authentication keeps users from providing credentials to a possibly malicious
    proxy server. User home folders should be encrypted using AES Keylocker where applicable.
  impact: There should be no impact on the user. This might block a device from access the internet from known good proxy
    servers. There should be no impact on the user.
  references:
