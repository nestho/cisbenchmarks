  description: 'This policy can force your organization''s ChromeOS devices to re-enroll to your account after a device wipe.
    By default, a user is not required to enter a username and password for re-enrollment to occur. Re-enrollment ensures
    that your organization''s ChromeOS devices remain managed, and that the policies you set are enforced on the device. The
    three settings for this policy are: • Force device to automatically re-enroll after wiping — ChromeOS devices automatically
    re-enroll into your organization''s account after a wipe without user credentials being required. • Force device to re-enroll
    with user credentials after wiping — A User must manually re-enroll ChromeOS devices into your account by logging in with
    their credentials. • Device is not forced to re-enroll after wiping — The ChromeOS device is not reenrolled into yout
    organization''s account and can be used without restrictions. Note: When a ChromeOS device is being removed from service,
    or is no longer being managed through your organization, then the device should be [deprovisioned].(https://support.google.com/chrome/a/answer/3523633?.sjid=10825622
    187269789335-NC)'
  rationale: 'Requiring all devices to automatically re-enroll after a device wipe will keep your organization''s ChromeOS
    devices managed. It is recommended to require user credentials to re-enroll the device. This requires a user within your
    organization to manually enter their credentials. Note: ChromeOS devices that are being used in developer mode should
    not be forced to re-enroll. Creating an organization in the Google admin console for just those users will allow you to
    turn off forced re-enrollment.'
