- id: 2.3.1.7.1
  title: (L1) Ensure 'Proxy mode' is Not Set to 'Always auto detect the proxy'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome offers the functionality to configure the proxy settings by automatic discovery using WPAD (Web
    Proxy Auto-Discovery Protocol). Setting this configures the proxy settings for Chrome and ARC-apps, which ignore all proxy-related
    options specified from the command line. Disabled (0): Lets users choose their proxy settings. The recommended state for
    this setting is: Enabled and the value of ProxyMode is not set to auto_detect'
  rationale: Attackers may abuse the WPAD auto-config functionality to supply computers with a PAC file that specifies a rogue
    web proxy under their control.
  impact: If the policy is enabled, the proxy configuration will no longer be discovered using WPAD.
  references:
  - 1. https://chromeenterprise.google/policies/#ProxySettings
  - 2. http://www.ptsecurity.com/download/wpad_weakness_en.pdf
  page_start: 128
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Proxy mode

    6. Ensure Configuration is not set to Always auto detect the proxy'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Proxy mode

    6. Set Configuration to a setting other than Always auto detect the proxy

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

