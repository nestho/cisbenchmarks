  title: (L1) Ensure 'Component updates' is set to 'Enable updates for all components'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome''s Component Updater updates several components of Google Chrome on a regular basis (applies
    only to Chrome browser components). The recommended state for this setting is: Enabled (1) NOTE: Updates to any component
    that does not contain executable code, does not significantly alter the behavior of the browser, or is critical for its
    security will not be disabled (E.g. certificate revocation lists and Safe Browsing data is updated regardless of this
    setting). FYI chrome://components lists all components, but not if they are affected by this setting. NOTE: Google provided
    the following list of some of the components controlled by this setting: • Recovery component • Pnacl • Floc • Optimization
    hints • SSL error assistant • CRL set • Origin trials • SW reporter • PKI metadata Google Chrome allows administrators
    to set the time period, in milliseconds, over which users are notified that it must be relaunched to apply a pending update.
    If not set, or Disabled, the default period of 604800000 milliseconds (7 days) is used. The recommended state for this
    setting is: Enabled with value 86400000 (1 day)'
  rationale: Google Chrome Updater shall be used to keep the components bundled to Chrome up to date. This setting is a notification
    for the end-user informing them that an update has been applied and that the browser must be restarted in order for the
    update to be completed. Once updates have been pushed by the organization, it is pertinent that said update takes effect
    as soon as possible. Enabling this notification will ensure users restart the browser in a timely fashion.
  impact: None - This is the default behavior. After this time period, the user will be repeatedly informed of the need for
    an update until a Browser restart is completed.
