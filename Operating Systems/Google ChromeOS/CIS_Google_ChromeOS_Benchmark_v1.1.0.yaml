  title: (L1) Ensure 'Cast' is set to 'Do not allow users to cast'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether Google Cast is able to connect to all IP Addresses or only private IP Addresses
    as defined in RFC1918 (IPv4) and RFC4193 (IPv6). Note that if the EnabledMediaRouter setting is set to Disabled there
    is no positive or negative effect for this setting. The recommended state for this setting is: Disabled (0) Setting controls
    whether users can add exceptions to allow mixed content for specific sites. • Do not allow any site to load mixed content
    (2) • Allow users to add exceptions to allow mixed content (3) The recommended state for this setting is: Enabled with
    the value of Do not allow any site to load mixed content (2) NOTE: This policy can be overridden for specific URL patterns
    using the InsecureContentAllowedForUrls and InsecureContentBlockedForUrls policies.'
  rationale: 'Allowing Google Cast to connect to public IP addresses could allow media and other potentially sensitive data
    to be exposed to the public. Disabling this setting will ensure that Google Cast is only able to connect to private (ie:
    internal) IP addresses. Allowing mixed (secure / insecure) content from a site can lead to malicious content being loaded.
    Mixed content occurs if the initial request is secure over HTTPS, but HTTPS and HTTP content is subsequently loaded to
    display the web page. HTTPS content is secure. HTTP content is insecure.'
  impact: None - This is the default behavior. Users will not be able to mix content.
  references:
