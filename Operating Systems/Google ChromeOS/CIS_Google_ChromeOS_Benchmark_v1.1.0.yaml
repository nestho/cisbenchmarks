- id: 2.3.1.4.3
  title: (L1) Ensure 'Online revocation checks' is set to 'Do not perform online OCSP/CRL checks'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome can reactivate soft-fail, online revocation checks, although they may provide some benefit in
    most cases. If this setting is disabled, unsecure online OCSP/CRL checks are no longer performed. The recommended state
    for this setting is: Disabled (0)'
  rationale: CRLSets are primarily a means by which Chrome can quickly block certificates in emergency situations. As a secondary
    function they can also contain some number of non-emergency revocations. These latter revocations are obtained by crawling
    CRLs published by CAs. Online (i.e. OCSP and CRL) checks are not, by default, performed by Chrome. The underlying system
    certificate library always performs these checks no matter what Chrome does, so enabling it here is redundant. An attacker
    may block OCSP traffic and cause revocation checks to pass in order to cause usage of soft-fail behavior. Furthermore,
    the browser may leak what website is being accessed and who accesses it to CA servers.
  impact: None - This is the default behavior.
  references:
  - 1. https://chromeenterprise.google/policies/#EnableOnlineRevocationChecks
  - 2. https://medium.com/@alexeysamoshkin/how-ssl-certificate-revocation-is-brokenin-practice-af3b63b9cb3
  page_start: 58
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Online revocation checks

    6. Ensure Configuration is set to Do not perform online OCSP/CRL checks'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Online revocation checks

    6. Set Configuration to Do not perform online OCSP/CRL checks

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under User & browser settings, select Online revocation checks

      6. Ensure Configuration is set to Do not perform online OCSP/CRL checks'
    severity: medium
- id: 2.3.1.4.4
  title: (L1) Ensure 'Insecure hashes in TLS handshakes' Is Set to 'Do not allow insecure hashes in TLS handshakes'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls the ability for Google Chrome to allow legacy or insecure hashes during the TLS handshake.
    It can be configured to either: • Disabled (0): Do Not Allow Insecure Hashes in TLS Handshakes • Enabled (1): Allow Insecure
    Hashes in TLS Handshakes If the value for InsecureHashesInTLSHandshakesEnabled is not changed from the default, it will
    behave as if it is enabled.'
  rationale: Setting this policy to disabled will block Google Chrome from using insecure hashes. Using insecure, or legacy,
    hashes could allow sensitive data to be exposed.
  impact: Users would be blocked from visiting sites that do not support more secure hashes.
  references:
  - 1. https://chromeenterprise.google/policies/#InsecureHashesInTLSHandshakesEna
  page_start: 60
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Insecure hashes in TLS

    handshakes

    6. Ensure Configuration is set to Do not allow insecure hashes in TLS

    handshakes'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Insecure hashes in TLS

