- id: 2.3.3.2.1
  title: (L1) Ensure 'Task Manager' Is Set to 'Block users from ending processes with the Chrome task manager'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'The Task Manager in ChromeOS allows the user to kill any current processes running. This policy setting controls
    extension management settings for Google Chrome, specifically v2 extensions. This policy setting is being sunsetted as
    Google develops the Manifest v3, but that rollout is currently postponed. The policy can be configured to: • Default browser
    behavior • Manifest v2 is disabled • Manifest v2 is enabled • Manifest v2 is enabled for forced extensions only This policy
    setting controls the WebAuthn API and its interaction with sites that have a broken TLS certificate. It can be configured
    to either: • Do not allow WebAuthn API requests on sites with broken TLS certificates. • Allow WebAuthn API requests on
    sites with broken TLS certificates.'
  rationale: If the Task Manager is enabled, a user can kill any running task, including those that your organization uses
    to manage the user of the device. Disabling that functionality removes this possibility. Setting this to Forced Only will
    not allow users to install any additional v2 extensions, and all existing, non-forced, v2 extensions will be disabled.
    Setting this policy will block the ability to authenticate to any website that does not have a valid TLS certificate since
    the identity of the site cannot be verified.
  impact: If a task is no longer responding, the user would have to turn the device off and back on to kill that task. Users
    that use extensions regularly will have a set of them blocked, which will change their user experience. There should be
    no user impact.
  references:
  - 1. https://chromeenterprise.google/policies/#TaskManagerEndProcessEnabled
  - 1. https://chromeenterprise.google/policies/#ExtensionManifestV2Availability
  - 1. https://chromeenterprise.google/policies/#AllowWebAuthnWithBrokenTlsCerts
