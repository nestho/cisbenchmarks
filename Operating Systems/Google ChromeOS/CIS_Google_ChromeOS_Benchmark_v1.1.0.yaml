  title: (L2) Ensure 'Verified Mode' Is Set to 'Require verified mode boot for Verified Access'
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Verified Access ensures that a device connecting to your network has been unmodified and is policy- compliant.
    Verified Access serves as an access point for a network service (such as a VPN gateway, a sensitive server, an enterprise
    Certificate Authority [CA], or an enterprise Wi-Fi access point) to get a hardware-backed cryptographic guarantee of the
    identity of the device and user that’s trying to access it. Verified Access uses the Trusted Platform Module (TPM) - present
    in every Chrome OS device - to enable enterprise network services to cryptographically confirm the identity and status
    of secure mode and enterprise policy using a Google server-side Application Programming Interface (API).
  rationale: The Chrome Verified Access API allows network services, such as VPNs, intranet pages, and so on to cryptographically
    verify that their clients are genuine and conform to corporate policy. Most large enterprises have the requirement to
    allow only enterprise-managed devices onto their WPA2 EAP-TLS networks, higher-tier access in VPNs, and mutual-TLS intranet
    pages.
  impact: This would impact a user that is required to use a development branch of ChromeOS.
  references:
  - 1. https://support.google.com/chrome/a/answer/7156268
