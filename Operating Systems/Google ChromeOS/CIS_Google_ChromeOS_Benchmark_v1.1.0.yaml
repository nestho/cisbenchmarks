controls:
- id: 1.1.1
  title: (L1) Ensure more than one Super Admin account exists
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Having more than one Super Admin account is needed primarily so that a single point of failure can be avoided.
    Also, for larger organizations, having multiple Super Admins can be useful for workload balancing purposes.
  rationale: From a security point of view, having only a single Super Admin Account can be problematic if this user were
    unavailable for an extended period of time. Also, Super Admin accounts should never be shared amongst multiple users.
  impact: There should be no user impact, but Administrators should have a normal (low privilege) and an Administrative (high
    privilege) account.
  references: []
  page_start: 25
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Go to Directory and click on Users, this will show a list of all users

    3. Click on + Add a filter, select Admin role, check the Super admin box, and

    then select Apply

    4. The list of Users displayed will only be those with the Super Admin role

    5. Make sure more than one (1) user is listed'
  remediation: 'Create at least one additional account with a Super Admin role.

    NOTE: A new account should be created vs adding this role to an existing account

    since Administration tasks should be done through separate Admin accounts.'
  checks:
  - type: sql
    command: show a list of all users
    severity: medium
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Go to Directory and click on Users, this will show a list of all users

      3. Click on + Add a filter, select Admin role, check the Super admin box, and

      then select Apply

      4. The list of Users displayed will only be those with the Super Admin role

      5. Make sure more than one (1) us'
- id: 1.1.2
  title: (L1) Ensure no more than 4 Super Admin accounts exist
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Having more than one Super Admin account is needed primarily so that a single point of failure can be avoided,
    but having too many should be avoided.
  rationale: From a security point of view, having a large number of Super Admin accounts is a bad practice. In general, all
    users should be assigned the least privileges needed to do their job. This includes Administrators since not everyone
    that needs to perform certain administrative functions needs to be a Super Admin. Google Workspaces provides many predefined
    Administration roles and also allows the creation of Custom Roles with very granular permission selection.
  impact: There should be no user impact, but Administrators should have a normal (low privilege) and an Administrative (high
    privilege) account.
  references: []
  page_start: 27
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Go to Directory and click on Users, this will show a list of all users

    3. Click on + Add a filter, select Admin role, check the Super admin box, and

    then select Apply

    4. The list of Users displayed will only be those with the Super Admin role

    5. Make sure no more than four (4) users are listed'
  remediation: Reduce the number of accounts with a "Super Admin" role.
  checks:
  - type: sql
    command: show a list of all users
    severity: medium
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Go to Directory and click on Users, this will show a list of all users

      3. Click on + Add a filter, select Admin role, check the Super admin box, and

      then select Apply

      4. The list of Users displayed will only be those with the Super Admin role

      5. Make sure no more than four (4'
- id: 1.1.3
  title: (L1) Ensure Super Admin accounts are used only for Super Admin activities
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Super Admin accounts have access to all features in the Google Admin console and Admin API and can manage
    every aspect of your organization''s account. Super Admins also have full access to all users'' calendars and event details.
    It is recommended to give each super administrator two accounts: one for their Super Admin account, and a second account
    for daily activities. Users should only sign in to a Super Admin account to perform Super Admin tasks, such as setting
    up 2-Step Verification (2SV), managing billing and user licenses, or helping another admin recover their account. Super
    administrators should use a separate, non-admin account for dayto-day activities. Super Admins should sign in as needed
    to do specific tasks and then sign out. Leaving Super Admin accounts signed in can increase exposure to phishing attacks.'
  rationale: Use the Super Admin account only when needed. Delegate administrator tasks to user accounts with limited admin
    roles. Use the least privilege approach, where each user has access to only the resources and tools needed for their typical
    tasks. For example, you could grant an admin permissions to create user accounts and reset passwords, but not let them
    delete user accounts.
  impact: Super Admin users will have to switch accounts as well as utilize login/logout functionality when performing administrative
    tasks.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/addusers?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/enterprise/protect-your-globaladministrator-accounts?view=o365-worldwide
  page_start: 29
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Go to Directory and click on Users, this will show a list of all users

    3. Click on + Add a filter, select Admin role, check the Super Admin box, and

    then select Apply

    4. The list of Users displayed will only be those with the Super Admin role

    5. Click on + Add a filter, select Admin role, check the Delegated admin

    box, and then select Apply

    6. Verify that there are no users in both the Super Admin and Delegated admin

    roles'
  remediation: 'For every Super Admin that is also a Delegated admin account, either create a

    Delegated admin account for the user or elevate their existing non-admin account to a

    Delegated admin account.'
  checks:
  - type: sql
    command: show a list of all users
    severity: medium
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Go to Directory and click on Users, this will show a list of all users

      3. Click on + Add a filter, select Admin role, check the Super Admin box, and

      then select Apply

      4. The list of Users displayed will only be those with the Super Admin role

      5. Click on + Add a filter, selec'
- id: 2.1.1
  title: (L1) Review Devices Periodically
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: All ChromeOS devices that are managed by your organization are listed in the Devices section of Google Workspace.
    It is a best practice to periodically audit the list for any unknown devices as well as remove any devices that are no
    longer in service. If any unknown devices are found, they should be investigated.
  rationale: Performing a periodic review of connected devices ensures only permitted and required devices can access organizational
    data or resources.
  impact: This should have no impact on the user or admin.
  references: []
  page_start: 33
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Devices

    5. Ensure all listed devices have been properly vetted and authorized by the

    appropriate personnel'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Devices

    5. Ensure all listed devices have been properly vetted and authorized by the

    appropriate personnel

    6. Now remove any unknown devices'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Devices

      5. Ensure all listed devices have been properly vetted and authorized by the

      appropriate personnel'
    severity: medium
- id: 2.2.1
  title: (L1) Ensure Any Unused Enrollment Tokens Are Revoked
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: An organization should not have any unused enrollment tokens.
  rationale: Revoking unused enrollment tokens keeps them from being used on unknown devices.
  impact: There should be no impact on the user of admin.
  references:
  - 1. https://support.google.com/chrome/a/answer/1360534?sjid=17213857381939141
  page_start: 36
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Enrollment tokens

    5. Ensure all listed enrollment tokens are in use'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Enrollment tokens

    5. Remove any unused enrollment tokens'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Enrollment tokens

      5. Ensure all listed enrollment tokens are in use'
    severity: medium
- id: 2.3.1.1.1
  title: (L1) Ensure 'Maximum user session length' Is Configured
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: This control sets the length of time that a session can run before the user is logged out and the session is
    terminated. The user is shown in the system tray how much time is remaining before they will be automatically logged out.
    The values are between 1 minute to 1440 minutes. If no value is set, then the system observes an unlimited session time.
    While 60 minutes is a good operating baseline for the session, depending on your organization this may vary. For example,
    in K-12 a 24 hour (1440 minutes) session might be the best setting. Use the best setting for your organization's needs.
  rationale: Setting a session length allows Chrome OS to not have a user session continuously signed in, thus preventing
    unauthorized access by someone other than the user.
  impact: There could be impacts to the user if they are unaware of, or are not actively checking, the session timer. They
    might be logged out unexpectedly.
  references:
  - 1. https://chromeenterprise.google/policies/#SessionLengthLimit
  page_start: 41
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under General, select Maximum user session length

    6. Ensure Maximum session length is set to your organization''s parameters'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under General, select Maximum user session length

    6. Set Maximum session length to your organization''s parameters

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under General, select Maximum user session length

      6. Ensure Maximum session length is set to your organization''s parameters'
    severity: medium
- id: 2.3.1.1.2
  title: (L1) Ensure 'Custom terms of service' Is Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: An access warning informs the user that the system is reserved for authorized use only, and that the use of
    the system may be monitored.
  rationale: An access warning may reduce a casual attacker's tendency to target the system. Access warnings may also aid
    in the prosecution of an attacker by evincing the attacker's knowledge of the system's private status, acceptable use
    policy, and authorization requirements.
  impact: If users are not informed of their responsibilities, unapproved activities may occur. Users that are not approved
    for access may take the lack of a warning banner as implied consent to access.
  references:
  - 1. https://chromeenterprise.google/policies/#TermsOfServiceURL
  page_start: 43
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under General, select Custom terms of service

    6. Ensure a .txt or .text file has been uploaded that contains your organization''s

    custom terms of service'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under General, select Custom terms of service

    6. Select Upload

    7. Select a .txt or .text file from your local device that contains your

    organization''s custom terms of service

    8. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under General, select Custom terms of service

      6. Ensure a .txt or .text file has been uploaded that contains your organization''s

      custom terms of service'
    severity: medium
- id: 2.3.1.2.1
  title: (L1) Ensure 'Task Manager' Is Set to 'Block users from ending processes with the Chrome task manager'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'The Task Manager in ChromeOS allows the user to kill any current processes running. This policy setting controls
    extension management settings for Google Chrome, specifically v2 extensions. This policy setting is being sunsetted as
    Google develops the Manifest v3, but that rollout is currently postponed. The policy can be configured to: • Default (0):
    Default browser behavior • Disabled (1): Manifest v2 is disabled • Enabled (2): Manifest v2 is enabled • Forced Only (3):
    Manifest v2 is enabled for forced extensions only This setting controls if every website will load into its own process.
    Disabled (0): Doesn''t turn off site isolation, but it lets users opt out. The recommended state for this setting is:
    Enabled (1)'
  rationale: If the Task Manager is enabled, a user can kill any running task including those that your organization uses
    to manage the user of the device. Disabling that functionality removes that possibility. Setting this to Forced Only will
    not allow users to install any additional v2 extensions, and all existing, non-forced, v2 extensions will be disabled.
    Chrome will load each website in its own process. Even if a site bypasses the sameorigin policy, the extra security will
    help stop the site from stealing your data from another website.
  impact: If a task is no longer responding, the user would have to turn the device off and back on to kill that task. Users
    that use extensions regularly will have a set of them blocked, which will change their user experience. If the policy
    is enabled, each site will run in its own process which will cause the system to use more memory. You might want to look
    at the Enable Site Isolation for specified origins policy setting to get the best of both worlds – isolation and limited
    impact for users – by using Enable Site Isolation for specified origins with a list of the sites you want to isolate.
  references:
  - 1. https://chromeenterprise.google/policies/#TaskManagerEndProcessEnabled
  - 1. https://chromeenterprise.google/policies/#ExtensionManifestV2Availability
  - 1. https://chromeenterprise.google/policies/#SitePerProcess
  - 2. https://www.chromium.org/Home/chromium-security/site-isolation
  page_start: 46
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under Apps and extensions select Users & browsers

    6. Select Task manager

    7. Ensure the configuration is set to Block users from ending processes with

    the Chrome task manager

    To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Manifest v2 extension

    availability

    6. Ensure Configuration is set to Enable force-installed manifest v2

    extensions on the sign-in screen

    To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Site isolation

    6. Ensure Configuration is set to Require Site Isolation for all

    websites, as well as any origins below'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under Apps and extensions select Users & browsers

    6. Select Task manager

    7. Set to Block users from ending processes with the Chrome task

    manager

    8. Select Save

    To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Manifest v2 extension

    availability

    6. Set Configuration to Enable force-installed manifest v2 extensions

    on the sign-in screen

    7. Select Save

    To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Site isolation

    6. Set Configuration to Require Site Isolation for all websites, as

    well as any origins below

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under Apps and extensions select Users & browsers

      6. Select Task manager

      7. Ensure the configuration is set to Block users from ending processes with

      the Chrome task manager

      To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select'
    severity: medium
- id: 2.3.1.4.1
  title: (L1) Ensure 'Password manager' is Explicitly Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome has a built-in password manager to store passwords for users. Chrome will use local authentication
    to allow users to gain access to these passwords. The recommended state for this setting is: Explicitly set to Enabled
    (1) or Disabled (0) based on the organization''s needs. NOTE: If you choose to Enable this setting, please review Disable
    synchronization of data with Google and ensure this setting is configured to meet organizational requirements. This policy
    setting controls the WebAuthn API and its interaction with sites that have a broken TLS certificate. It can be configured
    to either: • Disabled (0): Do not allow WebAuthn API requests on sites with broken TLS certificates. • Enabled (1): Allow
    WebAuthn API requests on sites with broken TLS certificates. If the value for AllowWebAuthnWithBrokenTlsCerts is not changed
    from the default, it will behave as it is disabled.xempt.'
  rationale: The Google Chrome password manager is Enabled by default and each organization should review and determine if
    they want to allow users to store passwords in the Browser. If another solution is used instead of the built-in Chrome
    option then an organization should configure the setting to Disabled. Setting this policy will block the ability to authenticate
    to any website that does not have a valid TLS certificate since the identity of the site cannot be verified.
  impact: Organizationally dependent. There should be no user impact.
  references:
  - 1. https://chromeenterprise.google/policies/#PasswordManagerEnabled
  - 2. https://www.ncsc.gov.uk/blog-post/what-does-ncsc-think-password-managers
  - 1. https://chromeenterprise.google/policies/#AllowWebAuthnWithBrokenTlsCerts
