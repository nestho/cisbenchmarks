- id: 2.3.3.6.4
  title: (L2) Ensure 'DNS over HTTPS' is set to 'Enable DNSover-HTTPS without insecure fallback'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This controls the mode of the DNS-over-HTTPS resolver. Please note that this setting will only set the default
    mode for each query. The mode may be overridden for special types of queries, such as requests to resolve a DNS-over-HTTPS
    server hostname. • Disable DNS-over-HTTPS (off) • Enable DNS-over-HTTPS with insecure fallback (automatic) - Enable DNS-over-HTTPS
    queries first if a DNS-over-HTTPS server is available and may fallback to sending insecure queries on error. • Enable
    DNS-over-HTTPS without insecure fallback (secure) - Only send DNS-over-HTTPS queries and will fail to resolve on error.
    The recommended state for this setting is: Enabled with a value of Enable DNS-overHTTPS without insecure fallback (secure)
    Note: When enabling this policy, it is recommended to also configure the DnsOverHttpsTemplates policy so that the URI
    templates are set. You can find out more information on the DnsOverHttpsTemplates enterprise policy site. This policy
    controls whether SharedArrayBuffers can be used in a non cross-originisolated context. This setting controls whether HTTP
    auth credentials may be automatically used in the context of another web site visited in Google Chrome. The recommended
    state for this setting is: HTTP authentication credentials are scoped to top-level sites NOTE: This setting is intended
    to give enterprises depending on the legacy behavior a chance to update their login procedures and will be removed in
    the future.'
  rationale: 'DNS over HTTPS (DOH) has a couple primary benefits: 1. Encrypting DNS name resolution traffic helps to hide
    your online activities, since DoH hides the name resolution requests from the ISP and from anyone listening on intermediary
    networks. 2. DoH also helps to prevent DNS spoofing and man-in-the-middle (MitM) attacks. Sites that are not cross-origin
    isolated need to be prevented from using the SharedArrayBuffers. Allowing HTTP auth credentials to be shared without the
    user''s consent could lead to a user sharing sensitive information without their knowledge. Enabling this setting could
    also lead to some types of cross-site attacks that would allow users to be tracked across sites without the use of cookies.'
  impact: Not all DNS providers support DOH, so choice is limited. Also, Enterprises sometimes monitor DNS requests to block
    access to malicious or inappropriate sites. DNS monitoring can also sometimes be used to detect malware attempting to
    "phone home." Because DoH encrypts name resolution requests, it can create a security monitoring blind spot. There should
    be no impact. None - This is the default behavior.
  references:
  - 1. https://chromeenterprise.google/policies/#DnsOverHttpsMode
  - 1. https://chromeenterprise.google/policies/#SharedArrayBufferUnrestrictedAccess
  - 1. https://chromeenterprise.google/policies/#GloballyScopeHTTPAuthCacheEnable
