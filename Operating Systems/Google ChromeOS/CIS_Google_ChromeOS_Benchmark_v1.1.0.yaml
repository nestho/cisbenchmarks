  description: 'This setting controls the Google Search Side Panel. It can be configured to either: • Disabled (0): Disable
    Google Search Side Panel on all web pages • Enabled (1): Enable Google Search Side Panel on all web pages Google Chrome
    has an API which allows access to connected USB devices from the browser • Do not allow any site to request access to
    USB devices via the WebUSB API (2) • Allow sites to ask the user to grant access to a connected USB device (3) The recommended
    state for this setting is: Enabled with a value of Do not allow any site to request access to USB devices via the WebUSB
    API (2)'
  rationale: Setting this policy will not allow the Google Search Side Panel on any webpages. WebUSB is opening the doors
    for sophisticated phishing attacks that could bypass hardware-based two-factor authentication devices (e.g. Yubikey devices).
  impact: This should have no user impact. If this setting is configured, websites can no longer access connected USB devices
    via the API (this includes web cameras, headphones, and other USB devices) which could also prevent some two factor authentication
    (2FA) USB devices from working properly.
