    are untrusted. The recommended state for this setting is: Disabled (0) This policy allows a user to import or remove CA
    certificates in Certificate Manager. The settings for User management of installed CA certificates are: • Allow users
    to manage all certificates — This is the default. Users can edit trust settings for all CA certificates, remove user-imported
    certificates, and import certificates. • Allow users to manage user certificates — Users can manage only user-imported
    certificates, but they can’t change trust settings for built-in certificates. • Disallow users from managing certificates
    — Users can view CA certificates, but they can’t manage them. This policy allows a user to import or remove certificates
    in Certificate Manager. The settings for User management of installed certificates are: • Allow users to manage all certificates
    — This is the default. Users can edit trust settings for all certificates, remove user-imported certificates, and import
    certificates. • Allow users to manage user certificates — Users can manage only user-imported certificates, but they can’t
    change trust settings for built-in certificates. • Disallow users from managing certificates — Users can view certificates,
    but they can’t manage them. This policy controls the ability for Google Chrome to verify if any entered credentials were
    part of a leak. If a user''s credentials are compromised, the user will be alerted. The password is not stored on Google''s
    servers, unless Password Sync is enabled, and is encrypted with a secret key known only to your device. To find out more
    on how Google protects your password, see their support article How Chrome protects your passwords. Note: This setting
    has no effect if Safe Browsing is not enabled. Google Chrome will show a warning that appears when Google Chrome is running
    on a computer or operating system that is no longer supported. The recommended state for this setting is: Disabled (0)'
