  - Level 1 - Workstation
  description: 'The system includes the capability of rotating log files regularly to avoid filling up the system with logs
    or making the log''s size unmanageable. The file /etc/logrotate.d/syslog is the configuration file used to rotate log
    files created by syslog or rsyslog. Note: If no maxage setting is set for logrotate a situation can occur where logrotate
