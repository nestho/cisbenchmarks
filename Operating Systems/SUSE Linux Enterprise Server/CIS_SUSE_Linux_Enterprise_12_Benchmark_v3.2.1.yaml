- id: 2.2.1.2
  title: Ensure systemd-timesyncd is configured
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'systemd-timesyncd is a daemon that has been added for synchronizing the system clock across the network. The
    systemd-timesyncd daemon: • Implements an SNTP client. • Only implements a client side o Does not bother with the full
    NTP complexity o Only on querys time from one remote server, synchronizing the local clock to it • runs with minimal privileges
    • saves the current clock to disk every time a new NTP sync has been acquired o Uses this to correct the system clock
    early at bootup o to make sure that time monotonically progresses on these systems, even if it is not always correct •
    Requires a new system user and group "systemd-timesync" to be created on installation of systemd • Hooked up with networkd
    to only operate when network connectivity is available Notes: • The systemd-timesyncd service specifically implements
    only SNTP. This minimalistic service will set the system clock for large offsets or slowly adjust it for smaller deltas.
    More complex use cases are not covered by systemdtimesyncd. • - IF - chrony or ntp are used, systemd-timesyncd should
    be removed and this section skipped. • This recommendation only applies if timesyncd is in use on the system. • Only one
    time synchronization method should be in use on the system.'
  rationale: Proper configuration is vital to ensuring time synchronization is working properly.
  impact: ''
  references: []
  page_start: 138
  audit_raw: "Ensure that timesyncd is enabled and started\nRun the following command to verify that systemd-timesyncd is\
    \ enabled:\n# systemctl is-enabled systemd-timesyncd.service\nenabled\nReview /etc/systemd/timesyncd.conf and ensure that\
    \ the NTP servers, NTP\nFallbackNTP servers, and RootDistanceMaxSec listed are in accordance with local\npolicy\nRun the\
    \ following command:\n# timedatectl status\nThis should return something similar to:\n Local time: Tue 2019-06-04 15:40:45\
    \ EDT\n Universal time: Tue 2019-06-04 19:40:45 UTC\n RTC time: Tue 2019-06-04 19:40:45\n Time zone: America/New_York\
    \ (EDT, -0400)\n NTP enabled: yes\nNTP synchronized: yes\n RTC in local TZ: no\n DST active: yes\n Last DST change: DST\
    \ began at\n Sun 2019-03-10 01:59:59 EST\n Sun 2019-03-10 03:00:00 EDT\n Next DST change: DST ends (the clock jumps one\
    \ hour backwards) at\n Sun 2019-11-03 01:59:59 EDT\n Sun 2019-11-03 01:00:00 EST"
  remediation: 'Edit the file /etc/systemd/timesyncd.conf and add/modify the following lines:

    NTP=0.suse.pool.ntp.org 1.suse.pool.ntp.org #Servers listed should be In

    Accordance With Local Policy

    FallbackNTP=2.suse.pool.ntp.org 3.suse.pool.ntp.org #Servers listed should be

    In Accordance With Local Policy

    RootDistanceMax=1 #should be In Accordance With Local Policy

    Run the following commands to enable and start systemd-timesyncd:

    # systemctl --now enable systemd-timesyncd.service

    # timedatectl set-ntp true'
  checks:
  - type: manual_review
    info: "Ensure that timesyncd is enabled and started\nRun the following command to verify that systemd-timesyncd is enabled:\n\
      # systemctl is-enabled systemd-timesyncd.service\nenabled\nReview /etc/systemd/timesyncd.conf and ensure that the NTP\
      \ servers, NTP\nFallbackNTP servers, and RootDistanceMaxSec listed are in accordance with local\npolicy\nRun the following\
      \ command:\n# timedatectl status\nThis should return something similar to:\n Local time: Tue 2019-06-04 15:40:45 EDT\n\
      \ Universal time: Tue 2019-06-04 19:40:"
    severity: medium
