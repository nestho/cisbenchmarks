  description: 'autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives. Note: • Additional
    methods of disabling a service exist. Consult your distribution documentation for appropriate methods. • This control
    should align with the tolerance of the use of portable drives and optical media in the organization. • On a server requiring
    an admin to manually mount media can be part of defensein-depth to reduce the risk of unapproved software or information
    being introduced or proprietary software or information being exfiltrated. • If admins commonly use flash drives and Server
    access has sufficient physical controls, requiring manual mounting may not increase security.'
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
