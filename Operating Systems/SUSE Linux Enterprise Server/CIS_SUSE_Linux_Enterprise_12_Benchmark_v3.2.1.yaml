- id: 4.2.1.3
  title: Ensure rsyslog default file permissions configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'rsyslog will create logfiles that do not already exist on the system. This setting controls what permissions
    will be applied to these newly created files. The $FileCreateMode parameter specifies the file creation mode with which
    rsyslogd creates new files. If not specified, the value 0644 is used. Note: • The value given must always be a 4-digit
    octal number, with the initial digit being zero. • This setting can be overridden by a less restrictive setting in any
    file ending in .conf in the /etc/rsyslog.d/ directory.'
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: ''
