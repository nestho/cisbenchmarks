- id: 1.6.4
  title: Ensure prelink is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: prelink is a program that modifies ELF shared libraries and ELF dynamically linked binaries in such a way that
    the time needed for the dynamic linker to perform relocations at startup significantly decreases.
  rationale: The prelinking feature can interfere with the operation of AIDE, because it changes binaries. Prelinking can
    also increase the vulnerability of the system if a malicious user is able to compromise a common library such as libc.
  impact: on a system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to
    implement correctly preventing legitimate access from occurring. 1.7.1 Configure AppArmor AppArmor provides a Mandatory
    Access Control (MAC) system that greatly augments the default Discretionary Access Control (DAC) model. Under AppArmor
    MAC rules are applied by file paths instead of by security contexts as in other MAC systems. As such it does not require
    support in the filesystem and can be applied to network mounted filesystems for example. AppArmor security policies define
    what system resources applications can access and what privileges they can do so with. This automatically limits the damage
    that the software can do to files accessible by the calling user. The user does not need to take any action to gain this
    benefit. For an action to occur, both the traditional DAC permissions must be satisfied as well as the AppArmor MAC rules.
    The action will not be allowed if either one of these models does not permit the action. In this way, AppArmor rules can
    only make a system's permissions more restrictive and secure.
  references:
  - '1. AppArmor Documentation: https://gitlab.com/apparmor/apparmor/-'
  - '2. SUSE AppArmor Documentation: https://documentation.suse.com/sles/15SP1/html/SLES-all/cha-apparmor-start.html'
  page_start: 99
  audit_raw: 'Run the following command to verify that 1prelink` is not installed:

    # rpm -q prelink

    package prelink is not installed'
  remediation: 'Run the following command to restore binaries to normal:

    # prelink -ua

    Run the following command to uninstall prelink:

    # zypper remove prelink'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that 1prelink` is not installed:

      # rpm -q prelink

      package prelink is not installed'
    severity: medium
