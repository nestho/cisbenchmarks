- id: 6.2.16
  title: Ensure no duplicate user names exist
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Although the useradd program will not let you create a duplicate user name, it is possible for an administrator
    to manually edit the /etc/passwd file and change the user name.
  rationale: 'If a user is assigned a duplicate user name, it will create and have access to files with the first UID for
    that username in /etc/passwd . Example: If "test4" has a UID of 1000 and a subsequent "test4" entry has a UID of 2000,
    logging in as "test4" will use UID 1000. Effectively, the UID is shared, which is a security problem'
  impact: ''
  references: []
  page_start: 479
  audit_raw: 'Run the following script and verify no results are returned:

    #!/bin/bash

    cut -d: -f1 /etc/passwd | sort | uniq -d | while read x

    do echo "Duplicate login name ${x} in /etc/passwd"

    done'
  remediation: 'Based on the results of the audit script, establish unique user names for the users. File

    ownerships will automatically reflect the change as long as the users have unique UIDs.'
  checks:
  - type: manual_review
    info: 'Run the following script and verify no results are returned:

      #!/bin/bash

      cut -d: -f1 /etc/passwd | sort | uniq -d | while read x

      do echo "Duplicate login name ${x} in /etc/passwd"

      done'
    severity: medium
