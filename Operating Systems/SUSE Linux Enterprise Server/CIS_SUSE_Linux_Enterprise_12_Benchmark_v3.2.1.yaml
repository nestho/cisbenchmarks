- id: '1.6'
  title: Additional Process Hardening 1.6.1 Ensure core dumps are restricted
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file. The system provides the ability to set a soft
    limit for core dumps, but this can be overridden by the user.
  rationale: Setting a hard limit on core dumps prevents users from overriding the soft variable. If core dumps are required,
    consider setting limits for user groups (see limits.conf(5) ). In addition, setting the fs.suid_dumpable variable to 0
    will prevent setuid programs from dumping core.
  impact: ''
  references: []
