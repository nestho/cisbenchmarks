    auid>=1000 -F auid!=4294967295 -k mounts

    /etc/audit/rules.d/mounts.rules:-a always,exit -F arch=b32 -S mount -F

    auid>=1000 -F auid!=4294967295 -k mounts

    Run the following command and verify the rules are in the running auditd config:

