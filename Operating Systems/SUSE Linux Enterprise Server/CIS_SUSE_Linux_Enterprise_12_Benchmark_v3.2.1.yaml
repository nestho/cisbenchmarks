- id: 2.2.1.1
  title: Ensure time synchronization is in use
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'System time should be synchronized between all systems in an environment. This is typically done by establishing
    an authoritative time server or set of servers and having all systems synchronize their clocks to them. Note: • On systems
    where host-based time synchronization is not available, verify that chrony is installed or systemd-timesyncd is enabled.
    • On systems where host-based time synchronization is available consult your documentation and verify that host-based
    synchronization is in use. • - IF - another method for time synchronization is being used, this section may be skipped.'
  rationale: Time synchronization is important to support time sensitive security mechanisms like Kerberos and also ensures
    log files have consistent time records across the enterprise, which aids in forensic investigations.
  impact: ''
  references: []
  page_start: 136
  audit_raw: 'On systems where host based time synchronization is not available, verify chrony is

    installed OR systemd-timesyncd is enabled:

    Note: Only one time synchronization package should be installed and/or enabled.

    Run the following command to verify that chrony is installed:

    # rpm -q chrony

    chrony-<version>

    - OR -

    Run the following command to verify that systemd-timesyncd is enabled:

    # systemctl is-enabled systemd-timesyncd'
  remediation: 'On systems where host based time synchronization is not available, install chrony - OR

    - enable systemd-timesyncd:

