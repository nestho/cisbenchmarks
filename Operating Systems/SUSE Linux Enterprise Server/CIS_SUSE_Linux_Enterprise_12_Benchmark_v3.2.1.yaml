- id: 1.3.2
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'sudo can be configured to run only from a pseudo-pty Note: visudo edits the sudoers file in a safe fashion,
    analogous to vipw(8). visudo locks the sudoers file against multiple simultaneous edits, provides basic sanity checks,
    and checks for parse errors. If the sudoers file is currently being edited you will receive a message to try again later.
    The -f option allows you to tell visudo which file to edit.'
  rationale: Attackers can run a malicious program using sudo, which would again fork a background process that remains even
    when the main program has finished executing. This can be mitigated by configuring sudo to run other commands only from
    a pseudopty, whether I/O logging is turned on or not.
