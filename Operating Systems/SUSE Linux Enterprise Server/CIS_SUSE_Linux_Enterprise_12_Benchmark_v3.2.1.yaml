      denygroups <grouplist>'
- id: 5.2.5
  title: Ensure SSH LogLevel is appropriate
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: INFO level is the basic level that only records login activity of SSH users. In many situations, such as Incident
    Response, it is important to determine when a particular user was active on a system. The logout record can eliminate
    those users who disconnected, which helps narrow the field. VERBOSE level specifies that login and logout activity as
    well as the key fingerprint for any SSH key used for login will be logged. This information is important for SSH key management,
    especially in legacy environments.
  rationale: SSH provides several logging levels with varying amounts of verbosity. DEBUG is specifically not recommended
    other than strictly for debugging SSH communications since it provides so much data that it is difficult to identify important
    security information.
  impact: ''
  references:
  - 1. https://www.ssh.com/ssh/sshd_config/
  page_start: 358
  audit_raw: 'Run the following command and verify that output matches:

    # sshd -T | grep loglevel

    loglevel VERBOSE

    OR

    loglevel INFO'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameter as follows:

    LogLevel VERBOSE

    OR

    LogLevel INFO'
  checks:
  - type: command
    command: '# sshd -T | grep loglevel'
    expected: 'Run the following command and verify that output matches:'
    severity: medium
    info: 'Run the following command and verify that output matches:

