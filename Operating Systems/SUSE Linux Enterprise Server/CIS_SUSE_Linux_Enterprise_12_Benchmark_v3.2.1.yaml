- id: 4.1.13
  title: Ensure file deletion events by users are collected
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: 'Monitor the use of system calls associated with the deletion or renaming of files and file attributes. This
    configuration statement sets up monitoring for following system calls and tags them with the identifier "delete": • unlink
    - remove a file • unlinkat - remove a file attribute • rename - rename a file • renameat - rename a file attribute Note:
    • Systems may have been customized to change the default UID_MIN. To confirm the UID_MIN for your system, run the following
    command: # awk ''/^\s*UID_MIN/{print $2}'' /etc/login.defs • - IF - your systems'' UID_MIN is not 1000, replace audit>=1000
    with audit>=<UID_MIN for your system> in the Audit and Remediation procedures. • At a minimum, configure the audit system
    to collect file deletion events for all users and root. • Reloading the auditd config to set active settings may require
    a system reboot. Monitor scope changes for system administrators. If the system has been properly configured to force
    system administrators to log in as themselves first and then use the sudo command to execute privileged commands, it is
    possible to monitor changes in scope. The file /etc/sudoers or a file in the /etc/sudoers.d directory will be written
    to when the file or its attributes have changed. Note: Reloading the auditd config to set active settings may require
    a system reboot.'
  rationale: Monitoring these calls from non-privileged users could provide a system administrator with evidence that inappropriate
    removal of files and file attributes associated with protected files is occurring. While this audit option will look at
    all events, system administrators will want to look for specific privileged files that are being deleted or altered. Changes
    in the /etc/sudoers file, or a file in the /etc/sudoers.d/ directory can indicate that an unauthorized change has been
    made to scope of system administrator activity.
