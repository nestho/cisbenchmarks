- id: 5.4.1.2
  title: Ensure password expiration is 365 days or less
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'The PASS_MAX_DAYS parameter in /etc/login.defs allows an administrator to force passwords to expire once they
    reach a defined age. It is recommended that the PASS_MAX_DAYS parameter be set to less than or equal to 365 days. Note:
    • A value of -1 will disable password expiration. • The password expiration must be greater than the minimum days between
    password changes or users will be unable to change their password.'
  rationale: 'The window of opportunity for an attacker to leverage compromised credentials via a brute force attack, using
    already compromised credentials, or gaining the credentials by other means, can be limited by the age of the password.
    Therefore, reducing the maximum age of a password can also reduce an attacker''s window of opportunity. Requiring passwords
    to be changed helps to mitigate the risk posed by the poor security practice of passwords being used for multiple accounts,
    and poorly implemented off-boarding and change of responsibility policies. This should not be considered a replacement
    for proper implementation of these policies and practices. Note: If it is believed that a user''s password may have been
    compromised, the user''s account should be locked immediately. Local policy should be followed to ensure the secure update
    of their password.'
