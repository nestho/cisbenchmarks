- id: 4.1.1.1
  title: Ensure journald is configured to write logs to persistent disk
  scoring: scored
  profile:
  - Level 1 - Server
  description: Data from the journal may be stored in volatile memory or persisted locally on the server. Logs in memory will
    be lost upon a system reboot. By persisting logs to local disk on the server they are protected from loss.
  rationale: Writing log data to disk will provide the ability to forensically reconstruct events which may have impacted
    the operations or security of a system even after a system crash or reboot.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Review /usr/lib/systemd/journald.conf.d/journald.conf and verify that logs are

    persisted to disk:

