    used to provide an interactive shell. By default Aliyun Linux 2 sets the password field for these accounts to an invalid
    string, but it is also recommended that the shell field in the password file be set to /sbin/nologin . This prevents the
    account from potentially being used to run any commands. Some built-in accounts use /bin/false which is also acceptable.
    This prevents the account from potentially being used to run any commands.
