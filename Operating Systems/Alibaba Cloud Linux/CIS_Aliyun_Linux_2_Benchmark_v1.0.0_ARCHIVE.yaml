- id: 6.1.13
  title: Audit SUID executables
  scoring: scored
  profile:
  - Level 1
  description: The owner of a file can set the file's permissions to run with the owner's or group's permissions, even if
    the user running the program is not the owner or a member of the group. The most common reason for a SUID program is to
    enable users to perform functions (such as changing their password) that require root privileges.
  rationale: There are valid reasons for SUID programs, but it is important to identify and review such programs to ensure
    they are legitimate.
  impact: ''
  references: []
  page_start: 321
  audit_raw: 'Run the following command to list SUID files:

    # df --local -P | awk {''if (NR!=1) print $6''} | xargs -I ''{}'' find ''{}'' -xdev

    -type f -perm -4000

    The command above only searches local filesystems, there may still be compromised items

    on network mounted partitions. The following command can be run manually for

    individual partitions if needed:

    # find <partition> -xdev -type f -perm -4000'
  remediation: 'Ensure that no rogue SUID programs have been introduced into the system. Review the

    files returned by the action in the Audit section and confirm the integrity of these binaries.'
