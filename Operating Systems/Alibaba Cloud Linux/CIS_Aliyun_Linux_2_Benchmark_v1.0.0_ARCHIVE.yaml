- id: 1.1.11
  title: Ensure separate partition exists for /var/log
  scoring: scored
  profile:
  - Level 2
  description: The /var/log directory is used by system services to store log data .
  rationale: 'There are two important reasons to ensure that system logs are stored on a separate partition: protection against
    resource exhaustion (since logs can grow quite large) and protection of audit data.'
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
    resizing, or may require the installation of additional tools solely for the purpose of resizing operations. The use of
    these additional tools may introduce their own security considerations.
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
