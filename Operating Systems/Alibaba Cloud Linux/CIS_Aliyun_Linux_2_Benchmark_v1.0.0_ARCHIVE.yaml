    # rpm -q prelink

    package prelink is not installed'
  remediation: 'Run the following commands to restore binaries to normal and uninstall prelink :

    # prelink -ua

    # yum remove prelink'
  checks:
  - type: manual_review
    info: 'Run the following command and verify prelink is not installed:

      # rpm -q prelink

      package prelink is not installed'
    severity: medium
