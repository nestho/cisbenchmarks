    call exit. The other parameters monitor the /etc/issue and /etc/issue.net files (messages displayed prelogin), /etc/hosts
    (file containing host names and associated IP addresses), /etc/sysconfig/network file and /etc/sysconfig/network-scripts/
    directory (containing network interface scripts and configurations).
