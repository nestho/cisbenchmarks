    \ ) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n awk '/^ *-w/ \\\n &&/\\/etc\\/localtime/\
    \ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n}\nVerify output of matches:\n\
    -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k timechange\n-a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime\
    \ -k timechange\n-w /etc/localtime -p wa -k time-change\nRunning configuration\nRun the following command to check loaded\
    \ rules:\n# {\n auditctl -l | awk '/^ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&/ -S/ \\\n &&(/adjtimex/\
    \ \\\n ||/settimeofday/ \\\n ||/clock_settime/ ) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\n auditctl -l | awk '/^\
    \ *-w/ \\\n &&/\\/etc\\/localtime/ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\n}\nVerify the output\
    \ includes:\n-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -F\nkey=time-change\n-a always,exit -F\
    \ arch=b32 -S adjtimex,settimeofday,clock_settime -F\nkey=time-change\n-w /etc/localtime -p wa -k time-change\n32 Bit\
    \ systems\nFollow the same procedures as for 64 bit systems and ignore any entries with b64.\nIn addition, also audit\
    \ for the stime system call rule. For example:\n-a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime,stime\
