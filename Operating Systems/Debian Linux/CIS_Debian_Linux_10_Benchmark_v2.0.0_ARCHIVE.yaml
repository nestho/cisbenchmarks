      active

      Run the following command to verify ufw is active

      # ufw status

      Status: active'
    severity: medium
- id: 3.4.1.4
  title: Ensure ufw loopback traffic is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Configure the loopback interface to accept traffic. Configure all other interfaces to deny traffic to the loopback
    network (127.0.0.0/8 for IPv4 and ::1/128 for IPv6).
  rationale: Loopback traffic is generated between processes on machine and is typically critical to operation of the system.
    The loopback interface is the only place that loopback network (127.0.0.0/8 for IPv4 and ::1/128 for IPv6) traffic should
    be seen, all other interfaces should ignore traffic on this network as an anti-spoofing measure.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SC-7'
  page_start: 405
  audit_raw: 'Run the following commands and verify output includes the listed rules in order:

    # ufw status verbose

    To Action From

    -- ------ ----

    Anywhere on lo ALLOW IN Anywhere

    Anywhere DENY IN 127.0.0.0/8

    Anywhere (v6) on lo ALLOW IN Anywhere (v6)

    Anywhere (v6) DENY IN ::1

    Anywhere ALLOW OUT Anywhere on lo

    Anywhere (v6) ALLOW OUT Anywhere (v6) on lo'
  remediation: 'Run the following commands to implement the loopback rules:

    # ufw allow in on lo

    # ufw allow out on lo

    # ufw deny in from 127.0.0.0/8

    # ufw deny in from ::1'
