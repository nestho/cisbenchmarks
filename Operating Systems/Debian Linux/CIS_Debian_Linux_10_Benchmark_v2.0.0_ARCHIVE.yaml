    \ (If applicable)\n if [ -n \"$l_pkgoutput\" ]; then\n l_output=\"\" l_output2=\"\"\n # Look for idle-delay to determine\
    \ profile in use, needed for remaining tests\n l_kfd=\"/etc/dconf/db/$(grep -Psril '^\\h*idle-delay\\h*=\\h*uint32\\h+\\\
    d+\\b' /etc/dconf/db/*/ |\nawk -F'/' '{split($(NF-1),a,\".\");print a[1]}').d\" #set directory of key file to be locked\n\
    \ l_kfd2=\"/etc/dconf/db/$(grep -Psril '^\\h*lock-delay\\h*=\\h*uint32\\h+\\d+\\b' /etc/dconf/db/*/\n| awk -F'/' '{split($(NF-1),a,\"\
