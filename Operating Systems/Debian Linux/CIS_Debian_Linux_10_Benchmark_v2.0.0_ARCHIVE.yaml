- id: 4.2.13
  title: Ensure only strong Ciphers are used
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'This variable limits the ciphers that SSH can use during communication. Note: • Some organizations may have
    stricter requirements for approved ciphers. • Ensure that ciphers used are in compliance with site policy. • The only
    "strong" ciphers currently FIPS 140-2 compliant are: o aes256-ctr o aes192-ctr o aes128-ctr'
  rationale: Weak ciphers that are used for authentication to the cryptographic module cannot be relied upon to provide confidentiality
    or integrity, and system data may be compromised. • The Triple DES ciphers, as used in SSH, have a birthday bound of approximately
    four billion blocks, which makes it easier for remote attackers to obtain clear text data via a birthday attack against
    a long-duration encrypted session, aka a "Sweet32" attack. • Error handling in the SSH protocol; Client and Server, when
    using a block cipher algorithm in Cipher Block Chaining (CBC) mode, makes it easier for remote attackers to recover certain
    plain text data from an arbitrary block of cipher text in an SSH session via unknown vectors.
  impact: ''
  references:
  - 1. https://nvd.nist.gov/vuln/detail/CVE-2016-2183
  - 2. https://www.openssh.com/txt/cbc.adv
  page_start: 526
  audit_raw: 'Run the following command:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep ciphers

    Verify that output does not contain any of the following weak ciphers:

    3des-cbc

    aes128-cbc

    aes192-cbc

    aes256-cbc

    rijndael-cbc@lysator.liu.se'
  remediation: 'Edit the /etc/ssh/sshd_config file add/modify the Ciphers line to contain a comma

    separated list of the site approved ciphers:

    Example:

    Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

    Note: First occurrence of a option takes precedence.'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep ciphers
    expected: 'Verify that output does not contain any of the following weak ciphers:'
    severity: medium
    info: 'Run the following command:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

      /etc/hosts | awk ''{print $1}'')" | grep ciphers

      Verify that output does not contain any of the following weak ciphers:

      3des-cbc

      aes128-cbc

      aes192-cbc

      aes256-cbc

      rijndael-cbc@lysator.liu.se'
