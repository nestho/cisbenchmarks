      \n unset a_uarr && a_uarr=() # Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users\
      \ and user home\nlocation\n a_uarr+=(\"$l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat\
      \ { print $1 \" \"\n$(NF-1) }' /etc/passwd)\"\n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users\n\
      before proceeding\n [ \"$l_asize \" -gt \"10000\" ] && echo -e \"\\n ** INFO **\\n - \\\"$l_asize\\\"\nLocal interactive\
      \ users found on the system\\n - This may be a long running\ncheck\\n\"\n while read -r l_user l_home; do\n if [ -d\
      \ \"$l_home\" ]; then\n l_mask='0027'\n l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read -r l_own l_mode;\
      \ do\n [ \"$l_user\" != \"$l_own\" ] && l_hoout2=\"$l_hoout2\\n - User:\n\\\"$l_user\\\" Home \\\"$l_home\\\" is owned\
      \ by: \\\"$l_own\\\"\"\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_haout2=\"$l_haout2\\n - User: \\\"$l_user\\\
      \" Home \\\"$l_home\\\" is\nmode: \\\"$l_mode\\\" should be mode: \\\"$l_max\\\" or more restrictive\"\n fi\n done <<<\
