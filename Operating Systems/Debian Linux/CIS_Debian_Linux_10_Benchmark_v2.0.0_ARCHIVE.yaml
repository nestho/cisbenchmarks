- id: 4.5.1.6
  title: Ensure the number of changed characters in a new password is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The pwquality difok option sets the number of characters in a password that must not be present in the old
    password.
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
