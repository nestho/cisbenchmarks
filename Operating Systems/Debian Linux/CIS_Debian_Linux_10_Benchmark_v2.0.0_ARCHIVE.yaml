      Compress=yes'
    severity: medium
- id: 5.1.1.4
  title: Ensure journald is configured to write logfiles to persistent disk
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Data from journald may be stored in volatile memory or persisted locally on the server. Logs in memory will
    be lost upon a system reboot. By persisting logs to local disk on the server they are protected from loss due to a reboot.
  rationale: Writing log data to disk will provide the ability to forensically reconstruct events which may have impacted
    the operations or security of a system even after a system crash or reboot.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3, AU-12'
  page_start: 631
  audit_raw: 'Run the following command to verify that logs are persisted to disk:

    # grep -Psi ''^\h*Storage\h*=\h*persistent\b'' /etc/systemd/journald.conf

    /etc/systemd/journald.conf.d/*

    Verify the output matches:

    Storage=persistent'
  remediation: 'Edit the /etc/systemd/journald.conf file or a file ending in .conf in

    /etc/systemd/journald.conf.d/ and add the following line:

    Storage=persistent

    Restart the service:

    # systemctl restart systemd-journald'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that logs are persisted to disk:

      # grep -Psi ''^\h*Storage\h*=\h*persistent\b'' /etc/systemd/journald.conf

      /etc/systemd/journald.conf.d/*

      Verify the output matches:

      Storage=persistent'
    severity: medium
