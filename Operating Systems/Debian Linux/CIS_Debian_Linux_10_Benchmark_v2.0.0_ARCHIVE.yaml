- id: 5.1.1.1.4
  title: Ensure journald is not configured to receive logs from a remote client
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Journald supports the ability to receive messages from remote hosts, thus acting as a log server. Clients
    should not receive data from other hosts. Note: • The same package, systemd-journal-remote, is used for both sending logs
    to remote hosts and receiving incoming logs. • With regards to receiving logs, there are two services; systemd-journalremote.socket
    and systemd-journal-remote.service.'
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    it's operational boundary.
