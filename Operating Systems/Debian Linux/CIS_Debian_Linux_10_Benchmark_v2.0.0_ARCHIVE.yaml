- id: 4.2.3
  title: Ensure permissions on SSH public host key files are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: An SSH public key is one of two files used in SSH public key authentication. In this authentication method,
    a public key is a key that can be used for verifying digital signatures generated using a corresponding private key. Only
    a public key that corresponds to a private key will be able to authenticate successfully.
  rationale: If a public host key file is modified by an unauthorized user, the SSH service may be compromised.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 503
  audit_raw: "Run the following command and verify Access does not grant write or execute\npermissions to group or other for\
    \ all returned files:\nRun the following script to verify SSH public host key files are mode 0644 or more\nrestrictive,\
    \ owned be the root user, and owned be the root group:\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n l_pmask=\"\
    0133\"\n awk '{print}' <<< \"$(find -L /etc/ssh -xdev -type f -exec stat -Lc \"%n %#a\n%U %G\" {} +)\" | (while read -r\
