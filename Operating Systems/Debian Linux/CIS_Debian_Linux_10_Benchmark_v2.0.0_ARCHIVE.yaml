- id: 4.4.4
  title: Ensure strong password hashing algorithm is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Hash functions behave as one-way functions by using mathematical operations that are extremely difficult and
    cumbersome to revert When a user is created, the password is run through a one-way hashing algorithm before being stored.
    When the user logs in, the password sent is run through the same one-way hashing algorithm and compared to the hash connected
    with the provided username. If the hashed password and the stored hash match, the login is valid.
  rationale: The SHA512 hashing algorithm provides stronger hashing than previous available algorithms like MD5, thus providing
    additional protection to the system by increasing the level of effort for an attacker to successfully determine passwords.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5, SC-28'
