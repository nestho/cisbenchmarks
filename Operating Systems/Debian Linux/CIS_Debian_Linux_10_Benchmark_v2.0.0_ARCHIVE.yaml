  description: 'The /etc/crontab file is used by cron to control its own jobs. The commands in this item make sure that root
    is the user and group owner of the file and that only the owner can access the file. Note: Other methods, such as systemd
    timers, exist for scheduling jobs. If another method is used, cron should be removed, and the alternate method should
