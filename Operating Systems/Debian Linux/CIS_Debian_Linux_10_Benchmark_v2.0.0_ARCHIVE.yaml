- id: 6.2.11
  title: Ensure local interactive user home directories are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The user home directory is space defined for the particular user to set local environment variables and to
    store personal files. While the system administrator can establish secure permissions for users' home directories, the
    users can easily override these. Users can be defined in /etc/passwd without a home directory or with a home directory
    that does not actually exist.
  rationale: Since the user is accountable for files stored in the user home directory, the user must be the owner of the
    directory. Group or world-writable user home directories may enable malicious users to steal or modify other users' data
    or to gain another user's system privileges. If the user's home directory does not exist or is unassigned, the user will
    be placed in "/" and will not be able to write any files or have local environment variables set.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 836
  audit_raw: "Run the following script to Ensure:\n• local interactive user home directories exist\n• Ensure local interactive\
    \ users own their home directories\n• Ensure local interactive user home directories are mode 750 or more restrictive\n\
    #!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_heout2=\"\" l_hoout2=\"\" l_haout2=\"\"\n l_valid_shells=\"^($(\
    \ awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed\n-rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n\
    \ unset a_uarr && a_uarr=() # Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users and\
    \ user home\nlocation\n a_uarr+=(\"$l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print\
    \ $1 \" \"\n$(NF-1) }' /etc/passwd)\"\n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users\nbefore\
    \ proceeding\n [ \"$l_asize \" -gt \"10000\" ] && echo -e \"\\n ** INFO **\\n - \\\"$l_asize\\\"\nLocal interactive users\
    \ found on the system\\n - This may be a long running\ncheck\\n\"\n while read -r l_user l_home; do\n if [ -d \"$l_home\"\
    \ ]; then\n l_mask='0027'\n l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read -r l_own l_mode; do\n [ \"$l_user\"\
    \ != \"$l_own\" ] && l_hoout2=\"$l_hoout2\\n - User:\n\\\"$l_user\\\" Home \\\"$l_home\\\" is owned by: \\\"$l_own\\\"\
    \"\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_haout2=\"$l_haout2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\"\
    \ is\nmode: \\\"$l_mode\\\" should be mode: \\\"$l_max\\\" or more restrictive\"\n fi\n done <<< \"$(stat -Lc '%U %#a'\
    \ \"$l_home\")\"\n else\n l_heout2=\"$l_heout2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\" Doesn't\nexist\"\n fi\n\
    \ done <<< \"$(printf '%s\\n' \"${a_uarr[@]}\")\"\n [ -z \"$l_heout2\" ] && l_output=\"$l_output\\n - home directories\
    \ exist\" ||\nl_output2=\"$l_output2$l_heout2\"\n [ -z \"$l_hoout2\" ] && l_output=\"$l_output\\n - own their home directory\"\
    \n|| l_output2=\"$l_output2$l_hoout2\"\n [ -z \"$l_haout2\" ] && l_output=\"$l_output\\n - home directories are mode:\n\
    \\\"$l_max\\\" or more restrictive\" || l_output2=\"$l_output2$l_haout2\"\n [ -n \"$l_output\" ] && l_output=\" - All\
    \ local interactive users:$l_output\"\n if [ -z \"$l_output2\" ]; then # If l_output2 is empty, we pass\n echo -e \"\\\
    n- Audit Result:\\n ** PASS **\\n - * Correctly configured *\n:\\n$l_output\"\n else\n echo -e \"\\n- Audit Result:\\\
    n ** FAIL **\\n - * Reasons for audit\nfailure * :\\n$l_output2\"\n [ -n \"$l_output\" ] && echo -e \"\\n- * Correctly\
    \ configured *\n:\\n$l_output\"\n fi\n}"
  remediation: "If a local interactive users' home directory is undefined and/or doesn't exist, follow local\nsite policy\
    \ and perform one of the following:\n• Lock the user account\n• Remove the user from the system\n• create a directory\
    \ for the user. If undefined, edit /etc/passwd and add the\nabsolute path to the directory to the last field of the user.\n\
    Run the following script to:\n• Remove excessive permissions from local interactive users home directories\n• Update the\
    \ home directory's owner\n#!/usr/bin/env bash\n{\n l_output2=\"\"\n l_valid_shells=\"^($( awk -F\\/ '$NF != \"nologin\"\
    \ {print}' /etc/shells | sed\n-rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n unset a_uarr && a_uarr=() #\
    \ Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users and user home\nlocation\n a_uarr+=(\"\
    $l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print $1 \" \"\n$(NF-1) }' /etc/passwd)\"\
    \n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users\nbefore proceeding\n [ \"$l_asize \" -gt \"\
    10000\" ] && echo -e \"\\n ** INFO **\\n - \\\"$l_asize\\\"\nLocal interactive users found on the system\\n - This may\
    \ be a long running\nprocess\\n\"\n while read -r l_user l_home; do\n if [ -d \"$l_home\" ]; then\n l_mask='0027'\n l_max=\"\
    $( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read -r l_own l_mode; do\n if [ \"$l_user\" != \"$l_own\" ]; then\n l_output2=\"\
    $l_output2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\"\nis owned by: \\\"$l_own\\\"\\n - changing ownership to: \\\
    \"$l_user\\\"\\n\"\n chown \"$l_user\" \"$l_home\"\n fi\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_output2=\"$l_output2\\\
    n - User: \\\"$l_user\\\" Home \\\"$l_home\\\"\nis mode: \\\"$l_mode\\\" should be mode: \\\"$l_max\\\" or more restrictive\\\
    n -\nremoving excess permissions\\n\"\n chmod g-w,o-rwx \"$l_home\"\n fi\n done <<< \"$(stat -Lc '%U %#a' \"$l_home\"\
    )\"\n else\n l_output2=\"$l_output2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\"\nDoesn't exist\\n - Please create\
    \ a home in accordance with local site\npolicy\"\n fi\n done <<< \"$(printf '%s\\n' \"${a_uarr[@]}\")\"\n if [ -z \"$l_output2\"\
    \ ]; then # If l_output2 is empty, we pass\n echo -e \" - No modification needed to local interactive users home\ndirectories\"\
    \n else\n echo -e \"\\n$l_output2\"\n fi\n}"
