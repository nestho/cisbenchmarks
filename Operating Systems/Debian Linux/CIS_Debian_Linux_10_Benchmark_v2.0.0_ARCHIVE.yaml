    b' \"$l_kfd\")\\\"\"\n else\n l_output2=\"$l_output2\\n - \\\"idle-delay\\\" is not locked\"\n fi\n else\n l_output2=\"\
    $l_output2\\n - \\\"idle-delay\\\" is not set so it can not be locked\"\n fi\n if [ -d \"$l_kfd2\" ]; then # If key file\
    \ directory doesn't exist, options can't be locked\n if grep -Prilq '\\/org\\/gnome\\/desktop\\/screensaver\\/lock-delay\\\
