    \ *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n# awk '/^ *-w/ \\\n&&(/\\/etc\\/issue/ \\\n ||/\\/etc\\/issue.net/\
    \ \\\n ||/\\/etc\\/hosts/ \\\n ||/\\/etc\\/network/) \\\n&&/ +-p *wa/ \\\n&&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n\
    Verify the output matches:\n-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale\n-a always,exit -F\
    \ arch=b32 -S sethostname,setdomainname -k system-locale\n-w /etc/issue -p wa -k system-locale\n-w /etc/issue.net -p wa\
    \ -k system-locale\n-w /etc/hosts -p wa -k system-locale\n-w /etc/networks -p wa -k system-locale\n-w /etc/network/ -p\
    \ wa -k system-locale\nRunning configuration\nRun the following command to check loaded rules:\n# auditctl -l | awk '/^\
    \ *-a *always,exit/ \\\n&&/ -F *arch=b(32|64)/ \\\n&&/ -S/ \\\n&&(/sethostname/ \\\n ||/setdomainname/) \\\n&&(/ key=\
    \ *[!-~]* *$/||/ -k *[!-~]* *$/)'\n# auditctl -l | awk '/^ *-w/ \\\n&&(/\\/etc\\/issue/ \\\n ||/\\/etc\\/issue.net/ \\\
    \n ||/\\/etc\\/hosts/ \\\n ||/\\/etc\\/network/) \\\n&&/ +-p *wa/ \\\n&&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\nVerify\
    \ the output includes:\n-a always,exit -F arch=b64 -S sethostname,setdomainname -F key=system-locale\n-a always,exit -F\
    \ arch=b32 -S sethostname,setdomainname -F key=system-locale\n-w /etc/issue -p wa -k system-locale\n-w /etc/issue.net\
    \ -p wa -k system-locale\n-w /etc/hosts -p wa -k system-locale\n-w /etc/networks -p wa -k system-locale\n-w /etc/network/\
