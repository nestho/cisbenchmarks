- id: 4.2.7
  title: Ensure SSH root login is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The PermitRootLogin parameter specifies if the root user can log in using SSH. The default is prohibit-password.
  rationale: Disallowing root logins over SSH requires system admins to authenticate using their own individual account, then
    escalating to root. This limits opportunity for nonrepudiation and provides a clear audit trail in the event of a security
    incident.
