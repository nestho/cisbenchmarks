- id: 1.8.5
  title: Ensure GDM screen locks cannot be overridden
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'GNOME Desktop Manager can make the screen lock automatically whenever the user is idle for some amount of
    time. By using the lockdown mode in dconf, you can prevent users from changing specific settings. To lock down a dconf
    key or subpath, create a locks subdirectory in the keyfile directory. The files inside this directory contain a list of
    keys or subpaths to lock. Just as with the keyfiles, you may add any number of files to this directory. Example Lock File:
    # Lock desktop screensaver settings /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-delay'
  rationale: Setting a lock-out value reduces the window of opportunity for unauthorized user access to another user's session
    that has been left unattended. Without locking down the system settings, user settings take precedence over the system
    settings.
  impact: ''
  references:
  - 1. https://help.gnome.org/admin/system-admin-guide/stable/desktoplockscreen.html.en
  - 2. https://help.gnome.org/admin/system-admin-guide/stable/dconf-lockdown.html.en
  page_start: 206
  audit_raw: "Run the following script to verify that the screen lock can not be overridden:\n#!/usr/bin/env bash\n{\n # Check\
    \ if GNOME Desktop Manager is installed. If package isn't installed, recommendation is\nNot Applicable\\n\n # determine\
    \ system's package manager\n l_pkgoutput=\"\"\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"dpkg-query -W\"\
    \n elif command -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n # Check if GDM is installed\n l_pcl=\"gdm gdm3\"\
