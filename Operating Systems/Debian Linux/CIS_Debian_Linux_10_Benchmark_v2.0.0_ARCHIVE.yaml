    \ is set to 0\nNote:\n• kernel parameters are loaded by file and parameter order precedence. The\nfollowing script observes\
    \ this precedence as part of the auditing procedure. The\nparameters being checked may be set correctly in a file. If\
    \ that file is superseded,\nthe parameter is overridden by an incorrect setting later in that file, or in a\nconically\
    \ later file, that \"correct\" setting will be ignored both by the script and by\nthe system during a normal kernel parameter\
    \ load sequence.\n• IPv6 kernel parameters only apply to systems where IPv6 is enabled\n#!/usr/bin/env bash\n{\n l_output=\"\
