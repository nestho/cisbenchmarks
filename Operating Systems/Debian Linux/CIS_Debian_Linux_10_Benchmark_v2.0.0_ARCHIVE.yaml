  audit_raw: "Run the following script to verify disable automatic mounting is locked:\n#!/usr/bin/env bash\n{\n # Check if\
    \ GNOME Desktop Manager is installed. If package isn't installed, recommendation is\nNot Applicable\\n\n # determine system's\
    \ package manager\n l_pkgoutput=\"\"\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"dpkg-query -W\"\n elif\
    \ command -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n # Check if GDM is installed\n l_pcl=\"gdm gdm3\" # Space\
    \ seporated list of packages to check\n for l_pn in $l_pcl; do\n $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"$l_pkgoutput\\\
    n - Package: \\\"$l_pn\\\" exists\non the system\\n - checking configuration\"\n done\n # Check configuration (If applicable)\n\
    \ if [ -n \"$l_pkgoutput\" ]; then\n l_output=\"\" l_output2=\"\"\n # Look for idle-delay to determine profile in use,\
    \ needed for remaining tests\n l_kfd=\"/etc/dconf/db/$(grep -Psril '^\\h*automount\\b' /etc/dconf/db/*/ | awk -F'/'\n\
    '{split($(NF-1),a,\".\");print a[1]}').d\" #set directory of key file to be locked\n l_kfd2=\"/etc/dconf/db/$(grep -Psril\
