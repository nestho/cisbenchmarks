    /etc/hosts | awk ''{print $1}'')" | grep loglevel

    loglevel VERBOSE or loglevel INFO

    Run the following command and verify the output matches:

    # grep -Pis ''^\h*loglevel\h+'' /etc/ssh/sshd_config | grep -Pvi

    ''(VERBOSE|INFO)''

    Nothing should be returned

    Note: If Match set statements are used in your environment, they should be checked for

    the correct configuration as well.'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameter as follows:

    LogLevel VERBOSE

    OR

    LogLevel INFO

    Note: First occurrence of a option takes precedence, Match set statements

    withstanding.'
