- id: 3.4.2.8
  title: Ensure nftables default deny firewall policy
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Base chain policy is the default verdict that will be applied to packets reaching the end of the chain.
  rationale: 'There are two policies: accept (Default) and drop. If the policy is set to accept, the firewall will accept
    any packet that is not configured to be denied and the packet will continue transversing the network stack. It is easier
    to white list acceptable usage than to black list unacceptable usage. Note: Changing firewall settings while connected
    over network can result in being locked out of the system.'
  impact: If configuring nftables over ssh, creating a base chain with a policy of drop will cause loss of connectivity. Ensure
    that a rule allowing ssh has been added to the base chain prior to setting the base chain's policy to drop
  references:
  - 1. Manual Page nft
  - '2. NIST SP 800-53 Rev. 5: CA-9, SC-7'
  page_start: 432
  audit_raw: 'Run the following commands and verify that base chains contain a policy of DROP.

    # nft list ruleset | grep ''hook input''

    type filter hook input priority 0; policy drop;

    # nft list ruleset | grep ''hook forward''

    type filter hook forward priority 0; policy drop;

    # nft list ruleset | grep ''hook output''

    type filter hook output priority 0; policy drop;'
  remediation: 'Run the following command for the base chains with the input, forward, and output

    hooks to implement a default DROP policy:

    # nft chain <table family> <table name> <chain name> { policy drop \; }

    Example:

    # nft chain inet filter input { policy drop \; }

    # nft chain inet filter forward { policy drop \; }

    # nft chain inet filter output { policy drop \; }'
