  - Level 2 - Workstation
  description: Monitor changes to file permissions, attributes, ownership and group. The parameters in this section track
    changes for system calls that affect file permissions and attributes. The following commands and system calls effect the
    permissions, ownership and various attributes of files. • chmod • fchmod • fchmodat • chown • fchown • fchownat • lchown
