- id: 5.1.1.3
  title: Ensure journald is configured to compress large log files
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The journald system includes the capability of compressing overly large files to avoid filling up the system
    with logs or making the logs unmanageably large.
  rationale: Uncompressed large files may unexpectedly fill a filesystem leading to resource unavailability. Compressing logs
    prior to write can prevent sudden, unexpected filesystem impacts.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-4'
  page_start: 629
  audit_raw: 'Run the following command to verify that large files will be compressed:

    # grep -Psi ''^\h*Compress\h*=\h*yes\b'' /etc/systemd/journald.conf

    /etc/systemd/journald.conf.d/*

    Verify the output matches:

    Compress=yes'
  remediation: 'Edit the /etc/systemd/journald.conf file or a file ending in .conf in

    /etc/systemd/journald.conf.d/ and add the following line:

    Compress=yes

    Restart the service:

    # systemctl restart systemd-journald'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that large files will be compressed:

      # grep -Psi ''^\h*Compress\h*=\h*yes\b'' /etc/systemd/journald.conf

