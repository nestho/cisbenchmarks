- id: 3.2.1
  title: Ensure packet redirect sending is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: ICMP Redirects are used to send routing information to other hosts. As a host itself does not act as a router
    (in a host only configuration), there is no need to send redirects.
  rationale: An attacker could use a compromised host to send invalid ICMP redirects to other router devices in an attempt
    to corrupt routing and have users access a system set up by the attacker as opposed to a valid system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 350
  audit_raw: "Run the following script to verify the following kernel parameters are set in the running\nconfiguration and\
    \ correctly loaded from a kernel parameter configuration file:\n• net.ipv4.conf.all.send_redirects is set to 0\n• net.ipv4.conf.default.send_redirects\
    \ is set to 0\nNote: kernel parameters are loaded by file and parameter order precedence. The\nfollowing script observes\
    \ this precedence as part of the auditing procedure. The\nparameters being checked may be set correctly in a file. If\
    \ that file is superseded, the\nparameter is overridden by an incorrect setting later in that file, or in a conically\
    \ later file,\nthat \"correct\" setting will be ignored both by the script and by the system during a\nnormal kernel parameter\
    \ load sequence.\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n a_parlist=(\"net.ipv4.conf.all.send_redirects=0\"\
    \ \"net.ipv4.conf.default.send_redirects=0\")\n l_ufwscf=\"$([ -f /etc/default/ufw ] && awk -F= '/^\\s*IPT_SYSCTL=/ {print\
    \ $2}'\n/etc/default/ufw)\"\n kernel_parameter_chk()\n {\n l_krp=\"$(sysctl \"$l_kpname\" | awk -F= '{print $2}' | xargs)\"\
    \ # Check running configuration\n if [ \"$l_krp\" = \"$l_kpvalue\" ]; then\n l_output=\"$l_output\\n - \\\"$l_kpname\\\
    \" is correctly set to \\\"$l_krp\\\" in the running\nconfiguration\"\n else\n l_output2=\"$l_output2\\n - \\\"$l_kpname\\\
    \" is incorrectly set to \\\"$l_krp\\\" in the running\nconfiguration and should have a value of: \\\"$l_kpvalue\\\"\"\
    \n fi\n unset A_out; declare -A A_out # Check durable setting (files)\n while read -r l_out; do\n if [ -n \"$l_out\" ];\
    \ then\n if [[ $l_out =~ ^\\s*# ]]; then\n l_file=\"${l_out//# /}\"\n else\n l_kpar=\"$(awk -F= '{print $1}' <<< \"$l_out\"\
    \ | xargs)\"\n [ \"$l_kpar\" = \"$l_kpname\" ] && A_out+=([\"$l_kpar\"]=\"$l_file\")\n fi\n fi\n done < <(/usr/lib/systemd/systemd-sysctl\
    \ --cat-config | grep -Po\n'^\\h*([^#\\n\\r]+|#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b)')\n if [ -n \"$l_ufwscf\" ]; then # Account\
    \ for systems with UFW (Not covered by systemd-sysctl -\n-cat-config)\n l_kpar=\"$(grep -Po \"^\\h*$l_kpname\\b\" \"$l_ufwscf\"\
    \ | xargs)\"\n l_kpar=\"${l_kpar//\\//.}\"\n [ \"$l_kpar\" = \"$l_kpname\" ] && A_out+=([\"$l_kpar\"]=\"$l_ufwscf\")\n\
    \ fi\n if (( ${#A_out[@]} > 0 )); then # Assess output from files and generate output\n while IFS=\"=\" read -r l_fkpname\
    \ l_fkpvalue; do\n l_fkpname=\"${l_fkpname// /}\"; l_fkpvalue=\"${l_fkpvalue// /}\"\n if [ \"$l_fkpvalue\" = \"$l_kpvalue\"\
    \ ]; then\n l_output=\"$l_output\\n - \\\"$l_kpname\\\" is correctly set to \\\"$l_fkpvalue\\\" in\n\\\"$(printf '%s'\
    \ \"${A_out[@]}\")\\\"\\n\"\n else\n l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is incorrectly set to \\\"$l_fkpvalue\\\
    \" in\n\\\"$(printf '%s' \"${A_out[@]}\")\\\" and should have a value of: \\\"$l_kpvalue\\\"\\n\"\n fi\n done < <(grep\
    \ -Po -- \"^\\h*$l_kpname\\h*=\\h*\\H+\" \"${A_out[@]}\")\n else\n l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is not\
    \ set in an included file\\n ** Note:\n\\\"$l_kpname\\\" May be set in a file that's ignored by load procedure **\\n\"\
    \n fi\n }\n while IFS=\"=\" read -r l_kpname l_kpvalue; do # Assess and check parameters\n l_kpname=\"${l_kpname// /}\"\
    ; l_kpvalue=\"${l_kpvalue// /}\"\n if ! grep -Pqs '^\\h*0\\b' /sys/module/ipv6/parameters/disable && grep -q '^net.ipv6.'\
    \ <<<\n\"$l_kpname\"; then\n l_output=\"$l_output\\n - IPv6 is disabled on the system, \\\"$l_kpname\\\" is not applicable\"\
    \n else\n kernel_parameter_chk\n fi\n done < <(printf '%s\\n' \"${a_parlist[@]}\")\n if [ -z \"$l_output2\" ]; then #\
    \ Provide output from checks\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit\
    \ Result:\\n ** FAIL **\\n - Reason(s) for audit failure:\\n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \"\\n- Correctly\
    \ set:\\n$l_output\\n\"\n fi\n}"
  remediation: "Set the following parameters in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending in\n.conf:\n• net.ipv4.conf.all.send_redirects\
    \ = 0\n• net.ipv4.conf.default.send_redirects = 0\nExample:\n# printf \"\nnet.ipv4.conf.all.send_redirects = 0\nnet.ipv4.conf.default.send_redirects\
    \ = 0\n\" >> /etc/sysctl.d/60-netipv4_sysctl.conf\nRun the following command to set the active kernel parameters:\n# {\n\
    \ sysctl -w net.ipv4.conf.all.send_redirects=0\n sysctl -w net.ipv4.conf.default.send_redirects=0\n sysctl -w net.ipv4.route.flush=1\n\
    }\nNote: If these settings appear in a conically later file, or later in the same file, these\nsettings will be overwritten"
