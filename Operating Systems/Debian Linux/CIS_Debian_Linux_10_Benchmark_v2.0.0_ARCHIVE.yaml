- id: 4.5.4
  title: Ensure default user umask is 027 or more restrictive
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'The user file-creation mode mask (umask) is use to determine the file permission for newly created directories
    and files. In Linux, the default permissions for any newly created directory is 0777 (rwxrwxrwx), and for any newly created
    file it is 0666 (rw-rwrw-). The umask modifies the default Linux permissions by restricting (masking) these permissions.
    The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file
    mode. umask can be set with either octal or Symbolic values • Octal (Numeric) Value - Represented by either three or four
    digits. ie umask 0027 or umask 027. If a four digit umask is used, the first digit is ignored. The remaining three digits
    effect the resulting permissions for user, group, and world/other respectively. • Symbolic Value - Represented by a comma
    separated list for User u, group g, and world/other o. The permissions listed are not masked by umask. ie a umask set
    by umask u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created directory
    with file mode drwxr-x--- and a newly created file with file mode rw-r-----. Setting the default umask: • pam_umask module:
    o will set the umask according to the system default in /etc/login.defs and user settings, solving the problem of different
    umask settings with different shells, display managers, remote sessions etc. o umask=<mask> value in the /etc/login.defs
    file is interpreted as Octal o Setting USERGROUPS_ENAB to yes in /etc/login.defs (default): ▪ will enable setting of the
    umask group bits to be the same as owner bits. (examples: 022 -> 002, 077 -> 007) for non-root users, if the uid is the
    same as gid, and username is the same as the primary group name ▪ userdel will remove the user''s group if it contains
    no more members, and useradd will create by default a group with the name of the user • System Wide Shell Configuration
    File: o /etc/profile - used to set system wide environmental variables on users shells. The variables are sometimes the
    same ones that are in the .profile, however this file is used to set an initial PATH or PS1 for all shell users of the
    system. is only executed for interactive login shells, or shells executed with the --login parameter o /etc/profile.d
    - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration in a
    shell script within /etc/profile.d to set your own system wide environmental variables. o /etc/bash.bashrc - System wide
    version of .bashrc. etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell, but redirects output to /dev/null
    if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bash.bashrc User Shell Configuration
    Files: • ~/.profile - Is executed to configure your shell before the initial command prompt. Is only read by login shells.
    • ~/.bashrc - Is executed for interactive shells. only read by a shell that''s both interactive and non-login'
  rationale: Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system.
  impact: Setting USERGROUPS_ENAB no in /etc/login.defs may change the expected behavior of useradd and userdel. Setting USERGROUPS_ENAB
    yes in /etc/login.defs • userdel will remove the user's group if it contains no more members • useradd will create by
    default a group with the name of the user.
  references:
  - 1. pam_umask(8)
  - '2. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 602
  audit_raw: 'Run the following to verify:

    • A default user umask is set to enforce a newly created directories''s permissions

    to be 750 (drwxr-x---), and a newly created file''s permissions be 640 (rw-r-----), or

    more restrictive

    • No less restrictive System Wide umask is set

    Run the following script to verify that a default user umask is set enforcing a newly

    created directories''s permissions to be 750 (drwxr-x---), and a newly created file''s

    permissions be 640 (rw-r-----), or more restrictive:

    #!/bin/bash

    passing=""

    grep -Eiq ''^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b'' /etc/login.defs && grep

    -Eqi ''^\s*USERGROUPS_ENAB\s*"?no"?\b'' /etc/login.defs && grep -Eq

    ''^\s*session\s+(optional|requisite|required)\s+pam_umask\.so\b''

    /etc/pam.d/common-session && passing=true

    grep -REiq ''^\s*UMASK\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\b'' /etc/profile*

    /etc/bash.bashrc* && passing=true

    [ "$passing" = true ] && echo "Default user umask is set"

    Verify output is: "Default user umask is set"

    Run the following to verify that no less restrictive system wide umask is set:

    # grep -RPi ''(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][06]\b|[0-7][01][0-7]\b|[0-7][0-7][06]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(

    ,o=[rwx]{0,3})?\b)'' /etc/login.defs /etc/profile* /etc/bash.bashrc*

    No file should be returned'
  remediation: 'Run the following command and remove or modify the umask of any returned files:

    # grep -RPi ''(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][06]\b|[0-7][01][0-7]\b|[0-7][0-7][06]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(

    ,o=[rwx]{0,3})?\b)'' /etc/login.defs /etc/profile* /etc/bash.bashrc*

    Follow one of the following methods to set the default user umask:

    Edit /etc/login.defs and edit the UMASK and USERGROUPS_ENAB lines as follows:

    UMASK 027

    USERGROUPS_ENAB no

    Edit /etc/pam.d/common-session and add or edit the following:

    session optional pam_umask.so

    OR

    Configure umask in one of the following files:

    • A file in the /etc/profile.d/ directory ending in .sh

    • /etc/profile

    • /etc/bash.bashrc

    Example: /etc/profile.d/set_umask.sh

    umask 027

    Note: this method only applies to bash and shell. If other shells are supported on the

    system, it is recommended that their configuration files also are checked.'
  checks:
  - type: command
    command: grep -Eiq '^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b' /etc/login.defs && grep && grep -REiq '^\s*UMASK\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\b'
      /etc/profile*
    expected: Run the following script to verify that a default user umask is set enforcing a newly
    severity: medium
    info: 'Run the following to verify:

      • A default user umask is set to enforce a newly created directories''s permissions

      to be 750 (drwxr-x---), and a newly created file''s permissions be 640 (rw-r-----), or

      more restrictive

      • No less restrictive System Wide umask is set

      Run the following script to verify that a default user umask is set enforcing a newly

      created directories''s permissions to be 750 (drwxr-x'
- id: 4.5.5
  title: Ensure default user shell timeout is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'TMOUT is an environmental setting that determines the timeout of a shell in seconds. • TMOUT=n - Sets the
    shell timeout to n seconds. A setting of TMOUT=0 disables timeout. • readonly TMOUT- Sets the TMOUT environmental variable
    as readonly, preventing unwanted modification during run-time. • export TMOUT - exports the TMOUT variable System Wide
    Shell Configuration Files: • /etc/profile - used to set system wide environmental variables on users shells. The variables
    are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for
    all shell users of the system. Is only executed for interactive login shells, or shells executed with the --login parameter.
    • /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration
    in a shell script within /etc/profile.d to set your own system wide environmental variables. • /etc/bash.bashrc - System
    wide version of bash.bashrc. etc/bash.bashrc also invokes /etc/profile.d/*.sh if non-login shell, but redirects output
    to /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bash.bashrc.'
  rationale: Setting a timeout value reduces the window of opportunity for unauthorized user access to another user's shell
    session that has been left unattended. It also ends the inactive session and releases the resources associated with that
    session.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-11'
  page_start: 607
  audit_raw: "Run the following script to verify TMOUT is configured:\n• as multiple lines, or a single line\n• once, and\
    \ only once\n• in one and only one of the following locations:\no A file in the /etc/profile.d/ directory ending in .sh\n\
    o /etc/profile\no /etc/bash.bashrc\n• Follows local site policy:\no Not to exceed 900\no Not equal to 0\n• to be readonly\n\
    • to be exported\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n l_tmv_max=\"900\"\n l_searchloc=\"/etc/bashrc\
    \ /etc/bash.bashrc /etc/profile /etc/profile.d/*.sh\"\n a_tmofile=()\n while read -r l_file; do\n [ -e \"$l_file\" ] &&\
    \ a_tmofile+=(\"$(readlink -f $l_file)\")\n done < <(grep -PRils '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\d+\\b' $l_searchloc)\n\
    \ if ! (( ${#a_tmofile[@]} > 0 )); then\n l_output2=\"$l_output2\\n - TMOUT is not set\"\n elif (( ${#a_tmofile[@]} >\
    \ 1 )); then\n l_output2=\"$l_output2\\n - TMOUT is set in multiple locations.\\n - List of files where\nTMOUT is set:\\\
    n$(printf '%s\\n' \"${a_tmofile[@]}\")\\n - end of list\\n\"\n else\n for l_file in ${a_tmofile[@]}; do\n if (( \"$(grep\
    \ -Pci '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\d+' \"$l_file\")\" > 1 )); then\n l_output2=\"$l_output2\\n - TMOUT is set multiple\
    \ times in \\\"$l_file\\\"\"\n else\n l_tmv=\"$(grep -Pi '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\d+' \"$l_file\" | grep -Po '\\\
    d+')\"\n if (( \"$l_tmv\" > \"$l_tmv_max\" )); then\n l_output2=\"$l_output\\n - TMOUT is \\\"$l_tmv\\\" in \\\"$l_file\\\
    \"\\n - Should be\n\\\"$l_tmv_max\\\" or less and not \\\"0\\\"\"\n else\n l_output=\"$l_output\\n- TMOUT is correctly\
    \ set to \\\"$l_tmv\\\" in \\\"$l_file\\\"\"\n if grep -Piq '^\\h*([^#\\n\\r]+\\h+)?readonly\\h+TMOUT\\b' \"$l_file\"\
    ; then\n l_output=\"$l_output\\n- TMOUT is correctly set to \\\"readonly\\\" in \\\"$l_file\\\"\"\n else\n l_output2=\"\
    $l_output2\\n- TMOUT is not set to \\\"readonly\\\"\"\n fi\n if grep -Piq '^(\\h*|\\h*[^#\\n\\r]+\\h*;\\h*)export\\h+TMOUT\\\
    b' \"$l_file\"; then\n l_output=\"$l_output\\n- TMOUT is correctly set to \\\"export\\\" in \\\"$l_file\\\"\"\n else\n\
    \ l_output2=\"$l_output2\\n- TMOUT is not set to \\\"export\\\"\"\n fi\n fi\n fi\n done\n fi\n unset a_tmofile # Remove\
    \ array\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n - * Correctly configured * :\\\
    n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for audit failure * :\\n$l_output2\"\
    \n [ -n \"$l_output\" ] && echo -e \"- * Correctly configured * :\\n$l_output\\n\"\n fi\n}"
  remediation: 'Review /etc/bash.bashrc, /etc/profile, and all files ending in *.sh in the

    /etc/profile.d/ directory and remove or edit all TMOUT=_n_ entries to follow local site

    policy.

    TMOUT should:

    • Be configured once, as multiple lines, or a single line, in one and only one of the

    following locations:

    o A file in the /etc/profile.d/ directory ending in .sh

    o /etc/profile

    o /etc/bash.bashrc

    • Not exceed 900

    • Not be equal to 0

    Multiple line example:

    TMOUT=900

    readonly TMOUT

    export TMOUT

    Single line example:

    readonly TMOUT=900 ; export TMOUT'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n l_tmv_max=\"900\"\n l_searchloc=\"/etc/bashrc /etc/bash.bashrc\
      \ /etc/profile /etc/profile.d/*.sh\"\n a_tmofile=()\n while read -r l_file; do\n [ -e \"$l_file\" ] && a_tmofile+=(\"\
      $(readlink -f $l_file)\")\n done < <(grep -PRils '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\d+\\b' $l_searchloc)\n if ! (( ${#a_tmofile[@]}\
      \ > 0 )); then\n l_output2=\"$l_output2\\n - TMOUT is not set\"\n elif (( ${#a_tmofile[@]} > 1 )); then\n l_output2=\"\
      $l_output2\\n - TMOUT is set in multiple locations.\\n - List of files where\nTMOUT is set:\\n$(printf '%s\\n' \"${a_tmofile[@]}\"\
      )\\n - end of list\\n\"\n else\n for l_file in ${a_tmofile[@]}; do\n if (( \"$(grep -Pci '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\\
      d+' \"$l_file\")\" > 1 )); then\n l_output2=\"$l_output2\\n - TMOUT is set multiple times in \\\"$l_file\\\"\"\n else\n\
      \ l_tmv=\"$(grep -Pi '^\\h*([^#\\n\\r]+\\h+)?TMOUT=\\d+' \"$l_file\" | grep -Po '\\d+')\"\n if (( \"$l_tmv\" > \"$l_tmv_max\"\
      \ )); then\n l_output2=\"$l_output\\n - TMOUT is \\\"$l_tmv\\\" in \\\"$l_file\\\"\\n - Should be\n\\\"$l_tmv_max\\\"\
      \ or less and not \\\"0\\\"\"\n else\n l_output=\"$l_output\\n- TMOUT is correctly set to \\\"$l_tmv\\\" in \\\"$l_file\\\
      \"\"\n if grep -Piq '^\\h*([^#\\n\\r]+\\h+)?readonly\\h+TMOUT\\b' \"$l_file\"; then\n l_output=\"$l_output\\n- TMOUT\
      \ is correctly set to \\\"readonly\\\" in \\\"$l_file\\\"\"\n else\n l_output2=\"$l_output2\\n- TMOUT is not set to\
      \ \\\"readonly\\\"\"\n fi\n if grep -Piq '^(\\h*|\\h*[^#\\n\\r]+\\h*;\\h*)export\\h+TMOUT\\b' \"$l_file\"; then\n l_output=\"\
      $l_output\\n- TMOUT is correctly set to \\\"export\\\" in \\\"$l_file\\\"\"\n else\n l_output2=\"$l_output2\\n- TMOUT\
      \ is not set to \\\"export\\\"\"\n fi\n fi\n fi\n done\n fi\n unset a_tmofile # Remove array\n if [ -z \"$l_output2\"\
      \ ]; then\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n - * Correctly configured * :\\n$l_output\\n\"\n else\n echo\
      \ -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for audit failure * :\\n$l_output2\"\n [ -n \"$l_output\" ] &&\
      \ echo -e \"- * Correctly configured * :\\n$l_output\\n\"\n fi\n}"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: 4.5.6
  title: Ensure nologin is not listed in /etc/shells
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: /etc/shells is a text file which contains the full pathnames of valid login shells. This file is consulted
    by chsh and available to be queried by other programs. Be aware that there are programs which consult this file to find
    out if a user is a normal user; for example, FTP daemons traditionally disallow access to users with shells not included
    in this file.
  rationale: A user can use chsh to change their configured shell. If a user has a shell configured that isn't in in /etc/shells,
    then the system assumes that they're somehow restricted. In the case of chsh it means that the user cannot change that
    value. Other programs might query that list and apply similar restrictions. By putting nologin in /etc/shells, any user
    that has nologin as its shell is considered a full, unrestricted user. This is not the expected behavior for nologin.
  impact: ''
  references:
  - 1. shells(5)
  - '2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 612
  audit_raw: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

    # grep ''/nologin\b'' /etc/shells

    Nothing should be returned'
  remediation: Edit /etc/shells and remove any lines that include nologin
  checks:
  - type: manual_review
    info: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

      # grep ''/nologin\b'' /etc/shells

      Nothing should be returned'
    severity: medium
- id: 4.5.7
  title: Ensure maximum number of same consecutive characters in a password is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The pwquality maxrepeat option sets the maximum number of allowed same consecutive characters in a new password.
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 613
  audit_raw: 'Run the following command to verify that the maxrepeat option in

    /etc/security/pwquality.conf is set to 3 or less, and not 0:

    # grep -Pi ''^\h*maxrepeat\h*=\h*[1-3]\b'' /etc/security/pwquality.conf

    maxrepeat = 3

    Note: The check is disabled if the value is 0'
  remediation: 'Edit or add the following line in /etc/security/pwquality.conf to a value of 3 or less

    and not 0:

    maxrepeat = 3'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that the maxrepeat option in

      /etc/security/pwquality.conf is set to 3 or less, and not 0:

      # grep -Pi ''^\h*maxrepeat\h*=\h*[1-3]\b'' /etc/security/pwquality.conf

      maxrepeat = 3

      Note: The check is disabled if the value is 0'
    severity: medium
- id: 5.1.1.1.1
  title: Ensure systemd-journal-remote is installed
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Journald (via systemd-journal-remote) supports the ability to send log events it gathers to a remote log host
    or to receive messages from remote hosts, thus enabling centralised log management.
  rationale: Storing log data on a remote host protects log integrity from local attacks. If an attacker gains root access
    on the local system, they could tamper with or remove log data that is stored on the local system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5'
  page_start: 619
  audit_raw: 'Run the following command to verify systemd-journal-remote is installed.

    Run the following command:

    # dpkg-query -W -f=''${binary:Package}\t${Status}\t${db:Status-Status}\n''

    systemd-journal-remote

    systemd-journal-remote install ok installed installed'
  remediation: 'Run the following command to install systemd-journal-remote:

    # apt install systemd-journal-remote'
  checks:
  - type: manual_review
    info: 'Run the following command to verify systemd-journal-remote is installed.

      Run the following command:

      # dpkg-query -W -f=''${binary:Package}\t${Status}\t${db:Status-Status}\n''

      systemd-journal-remote

      systemd-journal-remote install ok installed installed'
    severity: medium
