    is not a dictionary word, it is a certain length, contains a mix of characters (e.g. alphabet, numeric, other) and more.
    The following options are set in the /etc/security/pwquality.conf file: • Password Length: o minlen = 14 - password must
    be 14 characters or more • Password complexity: o minclass = 4 - The minimum number of required classes of characters
    for the new password (digits, uppercase, lowercase, others) OR o dcredit = -1 - provide at least one digit o ucredit =
    -1 - provide at least one uppercase character o ocredit = -1 - provide at least one special character o lcredit = -1 -
    provide at least one lowercase character'
  rationale: Strong passwords protect systems from being hacked through brute force methods.
