      \ -r logfile /etc/sudoers* | sed -e\n's/.*logfile=//;s/,? .*//' -e 's/\"//g' -e 's|/|\\\\/|g')\n [ -n \"${SUDO_LOG_FILE_ESCAPED}\"\
      \ ] && awk \"/^ *-w/ \\\n &&/\"${SUDO_LOG_FILE_ESCAPED}\"/ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]*\
