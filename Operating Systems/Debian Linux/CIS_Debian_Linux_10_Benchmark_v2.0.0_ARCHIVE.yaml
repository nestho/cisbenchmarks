    \ -r logfile /etc/sudoers* | sed -e\n's/.*logfile=//;s/,? .*//' -e 's/\"//g' -e 's|/|\\\\/|g')\n [ -n \"${SUDO_LOG_FILE_ESCAPED}\"\
    \ ] && awk \"/^ *-w/ \\\n &&/\"${SUDO_LOG_FILE_ESCAPED}\"/ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]*\
    \ *$/)\" /etc/audit/rules.d/*.rules \\\n || printf \"ERROR: Variable 'SUDO_LOG_FILE_ESCAPED' is unset.\\n\"\n}\nVerify\
    \ output of matches:\n-w /var/log/sudo.log -p wa -k sudo_log_file\nRunning configuration\nRun the following command to\
    \ check loaded rules:\n# {\n SUDO_LOG_FILE_ESCAPED=$(grep -r logfile /etc/sudoers* | sed -e\n's/.*logfile=//;s/,? .*//'\
    \ -e 's/\"//g' -e 's|/|\\\\/|g')\n [ -n \"${SUDO_LOG_FILE_ESCAPED}\" ] && auditctl -l | awk \"/^ *-w/ \\\n &&/\"${SUDO_LOG_FILE_ESCAPED}\"\
    / \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" \\\n || printf \"ERROR: Variable 'SUDO_LOG_FILE_ESCAPED'\
    \ is unset.\\n\"\n}\nVerify output matches:\n-w /var/log/sudo.log -p wa -k sudo_log_file"
  remediation: 'Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

