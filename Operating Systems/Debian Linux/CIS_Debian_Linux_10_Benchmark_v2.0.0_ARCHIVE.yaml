  remediation: 'If any accounts in the /etc/shadow file do not have a password, run the following

    command to lock the account until it can be determined why it does not have a

    password:

    # passwd -l <username>

    Also, check to see if the account is logged in and investigate what it is being used for to

    determine if it needs to be forced off.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that no output is returned:

      # awk -F: ''($2 == "" ) { print $1 " does not have a password "}'' /etc/shadow'
    severity: medium
