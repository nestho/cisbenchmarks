- id: 2.1.1.1
  title: Ensure a single time synchronization daemon is in use
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'System time should be synchronized between all systems in an environment. This is typically done by establishing
    an authoritative time server or set of servers and having all systems synchronize their clocks to them. Note: • On virtual
    systems where host based time synchronization is available consult your virtualization software documentation and verify
    that host based synchronization is in use and follows local site policy. In this scenario, this section should be skipped
    • Only one time synchronization method should be in use on the system. Configuring multiple time synchronization methods
    could lead to unexpected or unreliable results'
  rationale: Time synchronization is important to support time sensitive security mechanisms and ensures log files have consistent
    time records across the enterprise, which aids in forensic investigations.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3, AU-12'
  page_start: 236
  audit_raw: "On physical systems, and virtual systems where host based time synchronization is not\navailable.\nOne of the\
    \ three time synchronization daemons should be available; chrony, systemdtimesyncd, or ntp\nRun the following script to\
    \ verify that a single time synchronization daemon is available\non the system:\n#!/usr/bin/env bash\n{\n output=\"\"\
    \ l_tsd=\"\" l_sdtd=\"\" chrony=\"\" l_ntp=\"\"\n dpkg-query -W chrony > /dev/null 2>&1 && l_chrony=\"y\"\n dpkg-query\
    \ -W ntp > /dev/null 2>&1 && l_ntp=\"y\" || l_ntp=\"\"\n systemctl list-units --all --type=service | grep -q 'systemdtimesyncd.service'\
    \ && systemctl is-enabled systemd-timesyncd.service | grep -\nq 'enabled' && l_sdtd=\"y\"\n if [[ \"$l_chrony\" = \"y\"\
    \ && \"$l_ntp\" != \"y\" && \"$l_sdtd\" != \"y\" ]]; then\n l_tsd=\"chrony\"\n output=\"$output\\n- chrony is in use on\
    \ the system\"\n elif [[ \"$l_chrony\" != \"y\" && \"$l_ntp\" = \"y\" && \"$l_sdtd\" != \"y\" ]]; then\n l_tsd=\"ntp\"\
    \n output=\"$output\\n- ntp is in use on the system\"\n elif [[ \"$l_chrony\" != \"y\" && \"$l_ntp\" != \"y\" ]]; then\n\
    \ if systemctl list-units --all --type=service | grep -q 'systemdtimesyncd.service' && systemctl is-enabled systemd-timesyncd.service\
    \ | grep -\nEq '(enabled|disabled|masked)'; then\n l_tsd=\"sdtd\"\n output=\"$output\\n- systemd-timesyncd is in use on\
    \ the system\"\n fi\n else\n [[ \"$l_chrony\" = \"y\" && \"$l_ntp\" = \"y\" ]] && output=\"$output\\n- both\nchrony and\
    \ ntp are in use on the system\"\n [[ \"$l_chrony\" = \"y\" && \"$l_sdtd\" = \"y\" ]] && output=\"$output\\n- both\nchrony\
    \ and systemd-timesyncd are in use on the system\"\n [[ \"$l_ntp\" = \"y\" && \"$l_sdtd\" = \"y\" ]] && output=\"$output\\\
    n- both ntp\nand systemd-timesyncd are in use on the system\"\n fi\n if [ -n \"$l_tsd\" ]; then\n echo -e \"\\n- PASS:\\\
    n$output\\n\"\n else\n echo -e \"\\n- FAIL:\\n$output\\n\"\n fi\n}\nNOTE: Follow the guidance in the subsection for the\
    \ time synchronization daemon\navailable on the system and skip the other two time synchronization daemon\nsubsections."
  remediation: 'On physical systems, and virtual systems where host based time synchronization is not

    available.

    Select one of the three time synchronization daemons; chrony (1), systemd-timesyncd

    (2), or ntp (3), and following the remediation procedure for the selected daemon.

    Note: enabling more than one synchronization daemon could lead to unexpected or

    unreliable results:

    1.

    chrony

    Run the following command to install chrony:

    # apt install chrony

    Run the following commands to stop and mask the systemd-timesyncd daemon:

    # systemctl stop systemd-timesyncd.service

    # systemctl --now mask systemd-timesyncd.service

    Run the following command to remove the ntp package:

    # apt purge ntp

    NOTE:

    • Subsection: Configure chrony should be followed

    • Subsections: Configure systemd-timesyncd and Configure ntp should be

    skipped

    2. systemd-timesyncd

    Run the following command to remove the chrony package:

    # apt purge chrony

    Run the following command to remove the ntp package:

    # apt purge ntp

    NOTE:

    • Subsection: Configure systemd-timesyncd should be followed

    • Subsections: Configure chrony and Configure ntp should be skipped

    3. ntp

    Run the following command to install ntp:

    # apt install ntp

    Run the following commands to stop and mask the systemd-timesyncd daemon:

    # systemctl stop systemd-timesyncd.service

    # systemctl --now mask systemd-timesyncd.service

    Run the following command to remove the chrony package:

    # apt purge chrony

    NOTE:

    • Subsection: Configure ntp should be followed

    • Subsections: Configure chrony and Configure systemd-timesyncd should be

    skipped'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n output=\"\" l_tsd=\"\" l_sdtd=\"\" chrony=\"\" l_ntp=\"\"\n dpkg-query -W chrony > /dev/null\
      \ 2>&1 && l_chrony=\"y\"\n dpkg-query -W ntp > /dev/null 2>&1 && l_ntp=\"y\" || l_ntp=\"\"\n systemctl list-units --all\
      \ --type=service | grep -q 'systemdtimesyncd.service' && systemctl is-enabled systemd-timesyncd.service | grep -\nq\
      \ 'enabled' && l_sdtd=\"y\"\n if [[ \"$l_chrony\" = \"y\" && \"$l_ntp\" != \"y\" && \"$l_sdtd\" != \"y\" ]]; then\n\
      \ l_tsd=\"chrony\"\n output=\"$output\\n- chrony is in use on the system\"\n elif [[ \"$l_chrony\" != \"y\" && \"$l_ntp\"\
      \ = \"y\" && \"$l_sdtd\" != \"y\" ]]; then\n l_tsd=\"ntp\"\n output=\"$output\\n- ntp is in use on the system\"\n elif\
      \ [[ \"$l_chrony\" != \"y\" && \"$l_ntp\" != \"y\" ]]; then\n if systemctl list-units --all --type=service | grep -q\
      \ 'systemdtimesyncd.service' && systemctl is-enabled systemd-timesyncd.service | grep -\nEq '(enabled|disabled|masked)';\
      \ then\n l_tsd=\"sdtd\"\n output=\"$output\\n- systemd-timesyncd is in use on the system\"\n fi\n else\n [[ \"$l_chrony\"\
      \ = \"y\" && \"$l_ntp\" = \"y\" ]] && output=\"$output\\n- both\nchrony and ntp are in use on the system\"\n [[ \"$l_chrony\"\
      \ = \"y\" && \"$l_sdtd\" = \"y\" ]] && output=\"$output\\n- both\nchrony and systemd-timesyncd are in use on the system\"\
      \n [[ \"$l_ntp\" = \"y\" && \"$l_sdtd\" = \"y\" ]] && output=\"$output\\n- both ntp\nand systemd-timesyncd are in use\
      \ on the system\"\n fi\n if [ -n \"$l_tsd\" ]; then\n echo -e \"\\n- PASS:\\n$output\\n\"\n else\n echo -e \"\\n- FAIL:\\\
      n$output\\n\"\n fi\n}\nNOTE: Follow the guidance in the subsection for the time synchronization daemon\navailable on\
      \ the system and skip the other two time synchronization daemon\nsubsections."
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: 2.1.2.1
  title: Ensure chrony is configured with authorized timeserver
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: '• server o The server directive specifies an NTP server which can be used as a time source. The client-server
    relationship is strictly hierarchical: a client might synchronize its system time to that of the server, but the server’s
    system time will never be influenced by that of a client. o This directive can be used multiple times to specify multiple
    servers. o The directive is immediately followed by either the name of the server, or its IP address. • pool o The syntax
    of this directive is similar to that for the server directive, except that it is used to specify a pool of NTP servers
    rather than a single NTP server. The pool name is expected to resolve to multiple addresses which might change over time.
    o This directive can be used multiple times to specify multiple pools. o All options valid in the server directive can
    be used in this directive too.'
  rationale: Time synchronization is important to support time sensitive security mechanisms and to ensure log files have
    consistent time records across the enterprise to aid in forensic investigations
  impact: ''
  references:
  - 1. chrony.conf(5) Manual Page
  - 2. https://tf.nist.gov/tf-cgi/servers.cgi
  page_start: 241
  audit_raw: 'IF chrony is in use on the system, run the following command to display the server

    and/or pool directive:

    # grep -Pr --include=*.{sources,conf} ''^\h*(server|pool)\h+\H+'' /etc/chrony/

    Verify that at least one pool line and/or at least three server lines are returned, and the

    timeserver on the returned lines follows local site policy

    Output examples:

    pool directive:

    pool time.nist.gov iburst maxsources 4 #The maxsources option is unique to

    the pool directive

    server directive:

    server time-a-g.nist.gov iburst

    server 132.163.97.3 iburst

    server time-d-b.nist.gov iburst'
  remediation: 'Edit /etc/chrony/chrony.conf or a file ending in .sources in /etc/chrony/sources.d/

    and add or edit server or pool lines as appropriate according to local site policy:

    <[server|pool]> <[remote-server|remote-pool]>

    Examples:

    pool directive:

    pool time.nist.gov iburst maxsources 4 #The maxsources option is unique to

    the pool directive

    server directive:

    server time-a-g.nist.gov iburst

    server 132.163.97.3 iburst

    server time-d-b.nist.gov iburst

    Run one of the following commands to load the updated time sources into chronyd

    running config:

    # systemctl restart chronyd

    - OR if sources are in a .sources file -

    # chronyc reload sources

    OR

    If another time synchronization service is in use on the system, run the following

    command to remove chrony from the system:

    # apt purge chrony'
  checks:
  - type: manual_review
    info: 'IF chrony is in use on the system, run the following command to display the server

      and/or pool directive:

      # grep -Pr --include=*.{sources,conf} ''^\h*(server|pool)\h+\H+'' /etc/chrony/

      Verify that at least one pool line and/or at least three server lines are returned, and the

      timeserver on the returned lines follows local site policy

      Output examples:

      pool directive:

      pool time.nist.gov iburst maxsources 4 #The maxsources option is unique to

      the pool directive

      server directive:

      server time-a-g.nist.'
    severity: medium
