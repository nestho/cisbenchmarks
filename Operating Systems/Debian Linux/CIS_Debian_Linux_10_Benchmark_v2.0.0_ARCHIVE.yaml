    \ '^\\h*\\[Time\\]' \"$l_conf_file\" && echo \"[Time]\" >>\n\"$l_conf_file\"\n echo \"FallbackNTP=$l_ntp_fb\" >> \"$l_conf_file\"\
    \n fi\n}\nRun the following command to reload the systemd-timesyncd configuration:\n# systemctl try-reload-or-restart\
