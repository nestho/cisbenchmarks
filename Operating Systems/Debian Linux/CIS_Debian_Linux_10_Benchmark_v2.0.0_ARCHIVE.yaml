- id: 1.1.8.1
  title: Ensure nodev option set on /dev/shm partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /dev/shm filesystem is not intended to support devices, set this option to ensure that users cannot
    attempt to create special devices in /dev/shm partitions.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 116
  audit_raw: 'Verify that the nodev option is set for the /dev/shm mount.

