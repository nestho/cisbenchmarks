- id: 4.2.22
  title: Ensure SSH Idle Timeout Interval is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Note: To clarify, the two settings described below are only meant for idle connections from a protocol perspective
    and are not meant to check if the user is active or not. An idle user does not mean an idle connection. SSH does not and
    never had, intentionally, the capability to drop idle users. In SSH versions before 8.2p1 there was a bug that caused
    these values to behave in such a manner that they were abused to disconnect idle users. This bug has been resolved in
    8.2p1 and thus it can no longer be abused disconnect idle users. The two options ClientAliveInterval and ClientAliveCountMax
    control the timeout of SSH sessions. Taken directly from man 5 sshd_config: • ClientAliveInterval Sets a timeout interval
    in seconds after which if no data has been received from the client, sshd(8) will send a message through the encrypted
    channel to request a response from the client. The default is 0, indicating that these messages will not be sent to the
    client. • ClientAliveCountMax Sets the number of client alive messages which may be sent without sshd(8) receiving any
    messages back from the client. If this threshold is reached while client alive messages are being sent, sshd will disconnect
    the client, terminating the session. It is important to note that the use of client alive messages is very different from
    TCPKeepAlive. The client alive messages are sent through the encrypted channel and therefore will not be spoofable. The
    TCP keepalive option en‐abled by TCPKeepAlive is spoofable. The client alive mechanism is valuable when the client or
    server depend on knowing when a connection has become unresponsive. The default value is 3. If ClientAliveInterval is
    set to 15, and ClientAliveCountMax is left at the default, unresponsive SSH clients will be disconnected after approximately
    45 seconds. Setting a zero ClientAliveCountMax disables connection termination.'
  rationale: In order to prevent resource exhaustion, appropriate values should be set for both ClientAliveInterval and ClientAliveCountMax.
    Specifically, looking at the source code, ClientAliveCountMax must be greater than zero in order to utilize the ability
    of SSH to drop idle connections. If connections are allowed to stay open indefinately, this can potentially be used as
    a DDOS attack or simple resource exhaustion could occur over unreliable networks. The example set here is a 45 second
    timeout. Consult your site policy for network timeouts and apply as appropriate.
  impact: ''
  references:
  - 1. https://man.openbsd.org/sshd_config
  - '2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 546
  audit_raw: 'Run the following commands and verify ClientAliveInterval is greater than zero:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep clientaliveinterval

    Example output:

    clientaliveinterval 15

    Run the following command and verify ClientAliveCountMax is greater than zero:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep clientalivecountmax

    Example output:

    clientalivecountmax 3

    Run the following command:

    # grep -Pis ''^\h*ClientAliveCountMax\h+"?0\b'' /etc/ssh/sshd_config

    /etc/ssh/sshd_config.d/*.conf

    Nothing should be returned

    Note: If Include locations besides, or in addition to /etc/ssh/sshd_config.d/*.conf and/or

    Match set statements are used in your environment, those locations should be checked

    for the correct configuration as well.'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameters above any Include entries

    according to site policy.

    Example:

    ClientAliveInterval 15

    ClientAliveCountMax 3

    Note: First occurrence of a option takes precedence, Match set statements

    withstanding. If Include locations are enabled, used, and order of precedence is

    understood in your environment, the entry may be created in a file in Include location.'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep clientaliveinterval && /etc/hosts | awk '{print $1}')" | grep clientalivecountmax
    expected: ''
    severity: medium
    info: 'Run the following commands and verify ClientAliveInterval is greater than zero:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

      /etc/hosts | awk ''{print $1}'')" | grep clientaliveinterval

      Example output:

      clientaliveinterval 15

      Run the following command and verify ClientAliveCountMax is greater than zero:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostnam'
- id: 4.3.1
  title: Ensure sudo is installed
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: sudo allows a permitted user to execute a command as the superuser or another user, as specified by the security
    policy. The invoking user's real (not effective) user ID is used to determine the user name with which to query the security
    policy.
  rationale: sudo supports a plug-in architecture for security policies and input/output logging. Third parties can develop
    and distribute their own policy and I/O logging plug-ins to work seamlessly with the sudo front end. The default security
    policy is sudoers, which is configured via the file /etc/sudoers and any entries in /etc/sudoers.d. The security policy
    determines what privileges, if any, a user has to run sudo. The policy may require that users authenticate themselves
    with a password or another authentication mechanism. If authentication is required, sudo will exit if the user's password
    is not entered within a configurable time limit. This limit is policy-specific.
  impact: ''
  references:
  - 1. SUDO(8)
  - '2. NIST SP 800-53 Rev. 5: AC-2, AC-6'
  page_start: 550
  audit_raw: 'Run the following command to verify that either sudo or sudo-ldap is installed:

    # dpkg-query -W sudo sudo-ldap > /dev/null 2>&1 && dpkg-query -W -

    f=''${binary:Package}\t${Status}\t${db:Status-Status}\n'' sudo sudo-ldap | awk

    ''($4=="installed" && $NF=="installed") {print "\n""PASS:""\n""Package

    ""\""$1"\""" is installed""\n"}'' || echo -e "\nFAIL:\nneither \"sudo\" or

    \"sudo-ldap\" package is installed\n"'
  remediation: 'First determine is LDAP functionality is required. If so, then install sudo-ldap, else install

    sudo.

    Example:

    # apt install sudo'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that either sudo or sudo-ldap is installed:

      # dpkg-query -W sudo sudo-ldap > /dev/null 2>&1 && dpkg-query -W -

      f=''${binary:Package}\t${Status}\t${db:Status-Status}\n'' sudo sudo-ldap | awk

      ''($4=="installed" && $NF=="installed") {print "\n""PASS:""\n""Package

      ""\""$1"\""" is installed""\n"}'' || echo -e "\nFAIL:\nneither \"sudo\" or

      \"sudo-ldap\" package is installed\n"'
    severity: medium
- id: 4.3.2
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: sudo can be configured to run only from a pseudo terminal (pseudo-pty).
  rationale: Attackers can run a malicious program using sudo which would fork a background process that remains even when
    the main program has finished executing.
  impact: 'WARNING: Editing the sudo configuration incorrectly can cause sudo to stop functioning. Always use visudo to modify
    sudo configuration files.'
  references:
  - 1. SUDO(8)
  - 2. VISUDO(8)
  page_start: 552
  audit_raw: 'Verify that sudo can only run other commands from a pseudo terminal.

    Run the following command:

    # grep -rPi ''^\h*Defaults\h+([^#\n\r]+,)?use_pty(,\h*\h+\h*)*\h*(#.*)?$''

    /etc/sudoers*

    Verify the output matches:

    /etc/sudoers:Defaults use_pty'
  remediation: 'Edit the file /etc/sudoers with visudo or a file in /etc/sudoers.d/ with visudo -f <PATH

    TO FILE> and add the following line:

    Defaults use_pty

    Note:

    • sudo will read each file in /etc/sudoers.d, skipping file names that end in ~ or

    contain a . character to avoid causing problems with package manager or editor

    temporary/backup files.

    • Files are parsed in sorted lexical order. That is, /etc/sudoers.d/01_first will be

    parsed before /etc/sudoers.d/10_second.

    • Be aware that because the sorting is lexical, not numeric,

    /etc/sudoers.d/1_whoops would be loaded after /etc/sudoers.d/10_second.

    • Using a consistent number of leading zeroes in the file names can be used to

    avoid such problems.'
  checks:
  - type: manual_review
    info: 'Verify that sudo can only run other commands from a pseudo terminal.

      Run the following command:

      # grep -rPi ''^\h*Defaults\h+([^#\n\r]+,)?use_pty(,\h*\h+\h*)*\h*(#.*)?$''

      /etc/sudoers*

      Verify the output matches:

      /etc/sudoers:Defaults use_pty'
    severity: medium
