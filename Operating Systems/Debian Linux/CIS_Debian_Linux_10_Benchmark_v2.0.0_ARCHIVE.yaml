- id: 4.4.5
  title: Ensure all current passwords uses the configured hashing algorithm
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Currently used passwords with out of date hashing algorithms may pose a security risk to the system.
  rationale: In use passwords should always match the configured hashing algorithm for the system.
  impact: If the administrator forces a password change, this could cause a large spike in CPU usage if a large number of
    users change their password during the same time.
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5, SC-28'
  page_start: 578
  audit_raw: "Run the following script to get a list of users that are not using the currently configured\nhashing algorithm:\n\
    #!/usr/bin/env bash\n{\n declare -A HASH_MAP=( [\"y\"]=\"yescrypt\" [\"1\"]=\"md5\" [\"2\"]=\"blowfish\"\n[\"5\"]=\"SHA256\"\
    \ [\"6\"]=\"SHA512\" [\"g\"]=\"gost-yescrypt\" )\n CONFIGURED_HASH=$(sed -n \"s/^\\s*ENCRYPT_METHOD\\s*\\(.*\\)\\s*$/\\\
    1/p\"\n/etc/login.defs)\n for MY_USER in $(sed -n \"s/^\\(.*\\):\\\\$.*/\\1/p\" /etc/shadow)\n do\n CURRENT_HASH=$(sed\
    \ -n \"s/${MY_USER}:\\\\$\\(.\\).*/\\1/p\" /etc/shadow)\n if [[ \"${HASH_MAP[\"${CURRENT_HASH}\"]^^}\" != \"${CONFIGURED_HASH^^}\"\
    \ ]];\nthen\n echo \"The password for '${MY_USER}' is using\n'${HASH_MAP[\"${CURRENT_HASH}\"]}' instead of the configured\n\
    '${CONFIGURED_HASH}'.\"\n fi\n done\n}\nNothing should be returned\nAny system accounts that need to be expired should\
    \ be carefully done separately by the\nsystem administrator to prevent any potential problems."
  remediation: "If the administrator wish to force an immediate change on all users as per the output of\nthe audit, execute:\n\
    #!/usr/bin/env bash\n{\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n awk -F: -v UID_MIN=\"${UID_MIN}\"\
    \ '( $3 >= UID_MIN && $1 != \"nfsnobody\" ) {\nprint $1 }' /etc/passwd | xargs -n 1 chage -d 0\n}\nNOTE: This could cause\
    \ significant temporary CPU load on the system if a large\nnumber of users reset their passwords at the same time."
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n declare -A HASH_MAP=( [\"y\"]=\"yescrypt\" [\"1\"]=\"md5\" [\"2\"]=\"blowfish\"\n[\"\
      5\"]=\"SHA256\" [\"6\"]=\"SHA512\" [\"g\"]=\"gost-yescrypt\" )\n CONFIGURED_HASH=$(sed -n \"s/^\\s*ENCRYPT_METHOD\\\
      s*\\(.*\\)\\s*$/\\1/p\"\n/etc/login.defs)\n for MY_USER in $(sed -n \"s/^\\(.*\\):\\\\$.*/\\1/p\" /etc/shadow)\n do\n\
      \ CURRENT_HASH=$(sed -n \"s/${MY_USER}:\\\\$\\(.\\).*/\\1/p\" /etc/shadow)\n if [[ \"${HASH_MAP[\"${CURRENT_HASH}\"\
      ]^^}\" != \"${CONFIGURED_HASH^^}\" ]];\nthen\n echo \"The password for '${MY_USER}' is using\n'${HASH_MAP[\"${CURRENT_HASH}\"\
      ]}' instead of the configured\n'${CONFIGURED_HASH}'.\"\n fi\n done\n}\nNothing should be returned\nAny system accounts\
      \ that need to be expired should be carefully done separately by the\nsystem administrator to prevent any potential\
      \ problems."
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
