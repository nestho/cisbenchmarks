- id: 3.4.1.6
  title: Ensure ufw firewall rules exist for all open ports
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Services and ports can be accepted or explicitly rejected. Note: • Changing firewall settings while connected
    over network can result in being locked out of the system • The remediation command opens up the port to traffic from
    all sources. Consult ufw documentation and set any restrictions in compliance with site policy'
  rationale: To reduce the attack surface of a system, all services and ports should be blocked unless required. • Any ports
    that have been opened on non-loopback addresses need firewall rules to govern traffic. • Without a firewall rule configured
    for open ports, the default firewall policy will drop all packets to these ports. • Required ports should have a firewall
    rule created to allow approved connections in accordance with local site policy. • Unapproved ports should have an explicit
    deny rule created.
