- id: 4.1.8
  title: Ensure cron is restricted to authorized users
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Configure /etc/cron.allow to allow specific users to use this service. If /etc/cron.allow does not exist,
    then /etc/cron.deny is checked. Any user not specifically defined in this file is allowed to use cron. By removing the
    file, only users in /etc/cron.allow are allowed to use cron. Note: • Other methods, such as systemd timers, exist for
    scheduling jobs. If another method is used, cron should be removed, and the alternate method should be secured in accordance
    with local site policy • Even though a given user is not listed in cron.allow, cron jobs can still be run as that user
    • The cron.allow file only controls administrative access to the crontab command for scheduling and modifying cron jobs'
  rationale: On many systems, only the system administrator is authorized to schedule cron jobs. Using the cron.allow file
    to control who can run cron jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny
    list, you could potentially add a user ID to the system and forget to add it to the deny files.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 487
  audit_raw: "Run the following script to verify:\n• /etc/cron.deny does not exist\n• /etc/cron.allow does exist\n• /etc/cron.allow\
    \ is mode 0640 or more restrictive\n• /etc/cron.allow is owned by the user root\n• /etc/cron.allow is group owned by the\
    \ group crontab\n-OR-\n• cron is not installed on the system\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n\
    \ if dpkg-query -W cron > /dev/null 2>&1; then\n l_file=\"/etc/cron.allow\"\n [ -e /etc/cron.deny ] && l_output2=\"$l_output2\\\
    n - cron.deny exists\"\n if [ ! -e /etc/cron.allow ]; then\n l_output2=\"$l_output2\\n - cron.allow doesn't exist\"\n\
    \ else\n l_mask='0137'\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read l_mode l_fown l_fgroup; do\n\
    \ if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_output2=\"$l_output2\\n - \\\"$l_file\\\" is mode: \\\"$l_mode\\\"\n\
    (should be mode: \\\"$l_maxperm\\\" or more restrictive)\"\n else\n l_output=\"$l_output\\n - \\\"$l_file\\\" is correctly\
    \ set to mode:\n\\\"$l_mode\\\"\"\n fi\n if [ \"$l_fown\" != \"root\" ]; then\n l_output2=\"$l_output2\\n - \\\"$l_file\\\
    \" is owned by user\n\\\"$l_fown\\\" (should be owned by \\\"root\\\")\"\n else\n l_output=\"$l_output\\n - \\\"$l_file\\\
    \" is correctly owned by\nuser: \\\"$l_fown\\\"\"\n fi\n if [ \"$l_fgroup\" != \"crontab\" ]; then\n l_output2=\"$l_output2\\\
    n - \\\"$l_file\\\" is owned by group:\n\\\"$l_fgroup\\\" (should be owned by group: \\\"crontab\\\")\"\n else\n l_output=\"\
    $l_output\\n - \\\"$l_file\\\" is correctly owned by\ngroup: \\\"$l_fgroup\\\"\"\n fi\n done < <(stat -Lc '%#a %U %G'\
    \ \"$l_file\")\n fi\n else\n l_output=\"$l_output\\n - cron is not installed on the system\"\n fi\n if [ -z \"$l_output2\"\
    \ ]; then\n echo -e \"\\n- Audit Result:\\n ** PASS **$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL\
    \ **\\n - Reason(s) for audit\nfailure:$l_output2\\n\"\n fi\n}"
  remediation: "Run the following script to:\n• Remove /etc/cron.deny if it exists\n• Create /etc/cron.allow if it doesn't\
    \ exist\n• Change ownership of /etc/cron.allow to the root user\n• Change group ownership of /etc/cron.allow to the group\
    \ crontab\n#!/usr/bin/env bash\n{\n if dpkg-query -W cron > /dev/null 2>&1; then\n l_file=\"/etc/cron.allow\"\n l_mask='0137'\n\
    \ l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n if [ -e /etc/cron.deny ]; then\n echo -e \" - Removing \\\"/etc/cron.deny\\\
    \"\"\n rm -f /etc/cron.deny\n fi\n if [ ! -e /etc/cron.allow ]; then\n echo -e \" - creating \\\"$l_file\\\"\"\n touch\
    \ \"$l_file\"\n fi\n while read l_mode l_fown l_fgroup; do\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n echo -e \"\
    \ - Removing excessive permissions from \\\"$l_file\\\"\"\n chmod u-x,g-wx,o-rwx \"$l_file\"\n fi\n if [ \"$l_fown\" !=\
    \ \"root\" ]; then\n echo -e \" - Changing owner on \\\"$l_file\\\" from: \\\"$l_fown\\\" to:\n\\\"root\\\"\"\n chown\
    \ root \"$l_file\"\n fi\n if [ \"$l_fgroup\" != \"crontab\" ]; then\n echo -e \" - Changing group owner on \\\"$l_file\\\
    \" from:\n\\\"$l_fgroup\\\" to: \\\"crontab\\\"\"\n chgrp crontab \"$l_file\"\n fi\n done < <(stat -Lc '%#a %U %G' \"\
    $l_file\")\n else\n echo -e \"- cron is not installed on the system, no remediation\nrequired\\n\"\n fi\n}"
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n if dpkg-query -W cron > /dev/null 2>&1; then\n l_file=\"\
      /etc/cron.allow\"\n [ -e /etc/cron.deny ] && l_output2=\"$l_output2\\n - cron.deny exists\"\n if [ ! -e /etc/cron.allow\
      \ ]; then\n l_output2=\"$l_output2\\n - cron.allow doesn't exist\"\n else\n l_mask='0137'\n l_maxperm=\"$( printf '%o'\
      \ $(( 0777 & ~$l_mask)) )\"\n while read l_mode l_fown l_fgroup; do\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n\
      \ l_output2=\"$l_output2\\n - \\\"$l_file\\\" is mode: \\\"$l_mode\\\"\n(should be mode: \\\"$l_maxperm\\\" or more\
      \ restrictive)\"\n else\n l_output=\"$l_output\\n - \\\"$l_file\\\" is correctly set to mode:\n\\\"$l_mode\\\"\"\n fi\n\
      \ if [ \"$l_fown\" != \"root\" ]; then\n l_output2=\"$l_output2\\n - \\\"$l_file\\\" is owned by user\n\\\"$l_fown\\\
      \" (should be owned by \\\"root\\\")\"\n else\n l_output=\"$l_output\\n - \\\"$l_file\\\" is correctly owned by\nuser:\
      \ \\\"$l_fown\\\"\"\n fi\n if [ \"$l_fgroup\" != \"crontab\" ]; then\n l_output2=\"$l_output2\\n - \\\"$l_file\\\" is\
      \ owned by group:\n\\\"$l_fgroup\\\" (should be owned by group: \\\"crontab\\\")\"\n else\n l_output=\"$l_output\\n\
      \ - \\\"$l_file\\\" is correctly owned by\ngroup: \\\"$l_fgroup\\\"\"\n fi\n done < <(stat -Lc '%#a %U %G' \"$l_file\"\
      )\n fi\n else\n l_output=\"$l_output\\n - cron is not installed on the system\"\n fi\n if [ -z \"$l_output2\" ]; then\n\
      \ echo -e \"\\n- Audit Result:\\n ** PASS **$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n -\
      \ Reason(s) for audit\nfailure:$l_output2\\n\"\n fi\n}"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
