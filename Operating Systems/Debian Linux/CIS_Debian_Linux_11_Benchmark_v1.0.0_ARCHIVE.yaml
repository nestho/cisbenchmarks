    \ \"$l_kfd\"/locks\n {\n echo -e '\\n# Lock desktop media-handling automount setting'\n echo '/org/gnome/desktop/media-handling/automount'\n\
    \ } >> \"$l_kfd\"/locks/00-media-automount\n fi\n else\n echo -e \" - \\\"automount\\\" is not set so it can not be locked\\\
