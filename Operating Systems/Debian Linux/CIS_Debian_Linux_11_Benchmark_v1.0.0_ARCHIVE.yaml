  audit_raw: "Run the following script to verify that the text banner on the login screen is enabled and\nset:\n#!/usr/bin/env\
    \ bash\n{\n l_pkgoutput=\"\"\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"dpkg-query -W\"\n elif command\
    \ -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n l_pcl=\"gdm gdm3\" # Space seporated list of packages to check\n\
    \ for l_pn in $l_pcl; do\n $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"$l_pkgoutput\\n -\nPackage: \\\"$l_pn\\\"\
    \ exists on the system\\n - checking configuration\"\n done\n if [ -n \"$l_pkgoutput\" ]; then\n l_output=\"\" l_output2=\"\
    \"\n echo -e \"$l_pkgoutput\"\n # Look for existing settings and set variables if they exist\n l_gdmfile=\"$(grep -Prils\
    \ '^\\h*banner-message-enable\\b'\n/etc/dconf/db/*.d)\"\n if [ -n \"$l_gdmfile\" ]; then\n # Set profile name based on\
