- id: 1.5.4
  title: Ensure core dumps are restricted
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file. The system provides the ability to set a soft
    limit for core dumps, but this can be overridden by the user.
  rationale: Setting a hard limit on core dumps prevents users from overriding the soft variable. If core dumps are required,
    consider setting limits for user groups (see limits.conf(5) ). In addition, setting the fs.suid_dumpable variable to 0
    will prevent setuid programs from dumping core.
  impact: 'on a system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to
    implement correctly preventing legitimate access from occurring. Notes: • Apparmor is the default MAC provided with Debian
    systems. • Additional Mandatory Access Control systems to include SELinux exist. If a different Mandatory Access Control
    systems is used, please follow it''s vendors guidance for proper implementation in place of the guidance provided in this
    section 1.6.1 Configure AppArmor AppArmor provides a Mandatory Access Control (MAC) system that greatly augments the default
    Discretionary Access Control (DAC) model. Under AppArmor MAC rules are applied by file paths instead of by security contexts
    as in other MAC systems. As such it does not require support in the filesystem and can be applied to network mounted filesystems
    for example. AppArmor security policies define what system resources applications can access and what privileges they
    can do so with. This automatically limits the damage that the software can do to files accessible by the calling user.
    The user does not need to take any action to gain this benefit. For an action to occur, both the traditional DAC permissions
    must be satisfied as well as the AppArmor MAC rules. The action will not be allowed if either one of these models does
    not permit the action. In this way, AppArmor rules can only make a system''s permissions more restrictive and secure.'
  references:
  - '1. AppArmor Documentation: http://wiki.apparmor.net/index.php/Documentation'
  - '2. Ubuntu AppArmor Documentation: https://help.ubuntu.com/community/AppArmor'
  - https://www.suse.com/documentation/apparmor/
  page_start: 131
  audit_raw: 'Run the following commands and verify output matches:

    # grep -Es ''^(\*|\s).*hard.*core.*(\s+#.*)?$'' /etc/security/limits.conf

    /etc/security/limits.d/*

    * hard core 0

    # sysctl fs.suid_dumpable

    fs.suid_dumpable = 0

    # grep "fs.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*

    fs.suid_dumpable = 0

    Run the following command to check if systemd-coredump is installed:

    # systemctl is-enabled coredump.service

    If enabled, masked, or disabled is returned systemd-coredump is installed'
  remediation: 'Add the following line to /etc/security/limits.conf or a /etc/security/limits.d/*

    file:

    * hard core 0

    Set the following parameter in /etc/sysctl.conf or a /etc/sysctl.d/* file:

    fs.suid_dumpable = 0

    Run the following command to set the active kernel parameter:

    # sysctl -w fs.suid_dumpable=0

    IF systemd-coredump is installed:

    edit /etc/systemd/coredump.conf and add/modify the following lines:

    Storage=none

    ProcessSizeMax=0

    Run the command:

    systemctl daemon-reload

    MITRE ATT&CK Mappings:

    Techniques / Subtechniques Tactics Mitigations

    T1005, T1005.000 TA0007

    1.6 Mandatory Access Control

    Mandatory Access Control (MAC) provides an additional layer of access restrictions to

    processes on top of the base Discretionary Access Controls. By restricting how

    processes can access files and resources on a system the potential impact from

    vulnerabilities in the processes can be reduced.'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # grep -Es ''^(\*|\s).*hard.*core.*(\s+#.*)?$'' /etc/security/limits.conf

      /etc/security/limits.d/*

      * hard core 0

      # sysctl fs.suid_dumpable

      fs.suid_dumpable = 0

      # grep "fs.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*

      fs.suid_dumpable = 0

      Run the following command to check if systemd-coredump is installed:

      # systemctl is-enabled coredump.service

      If enabled, masked, or disabled is returned systemd-coredump is installed'
    severity: medium
