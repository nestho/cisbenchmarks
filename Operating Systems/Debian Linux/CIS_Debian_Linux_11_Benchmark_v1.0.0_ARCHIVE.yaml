- id: 2.1.3.1
  title: Ensure systemd-timesyncd configured with authorized timeserver
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: NTP= • A space-separated list of NTP server host names or IP addresses. During runtime this list is combined
    with any per-interface NTP servers acquired from systemd-networkd.service(8). systemd-timesyncd will contact all configured
    system or per-interface servers in turn, until one responds. When the empty string is assigned, the list of NTP servers
    is reset, and all prior assignments will have no effect. This setting defaults to an empty list. FallbackNTP= • A space-separated
    list of NTP server host names or IP addresses to be used as the fallback NTP servers. Any per-interface NTP servers obtained
    from systemdnetworkd.service(8) take precedence over this setting, as do any servers set via NTP= above. This setting
    is hence only relevant if no other NTP server information is known. When the empty string is assigned, the list of NTP
    servers is reset, and all prior assignments will have no effect. If this option is not given, a compiled-in list of NTP
    servers is used.
  rationale: Time synchronization is important to support time sensitive security mechanisms and to ensure log files have
    consistent time records across the enterprise to aid in forensic investigations
  impact: ''
  references:
  - 1. https://www.freedesktop.org/software/systemd/man/timesyncd.conf.html
  - 2. https://tf.nist.gov/tf-cgi/servers.cgi
  page_start: 220
  audit_raw: 'IF systemd-timesyncd is in use on the system, run the following command:

    # find /etc/systemd -type f -name ''*.conf'' -exec grep -Ph

    ''^\h*(NTP|FallbackNTP)=\H+'' {} +

    Verify that NPT=<space_seporated_list_of_servers> and/or

    FallbackNTP=<space_seporated_list_of_servers> is returned and that the time

    server(s) shown follows local site policy

    Example Output:

    /etc/systemd/timesyncd.conf.d/50-timesyncd.conf:NTP=time.nist.gov

    /etc/systemd/timesyncd.conf.d/50-timesyncd.conf:FallbackNTP=time-a-g.nist.gov

    time-b-g.nist.gov time-c-g.nist.gov'
  remediation: "Edit or create a file in /etc/systemd/timesyncd.conf.d ending in .conf and add the\nNTP= and/or FallbackNTP=\
    \ lines to the [Time] section:\nExample:\n[Time]\nNTP=time.nist.gov # Uses the generic name for NIST's time servers\n\
    -AND/ORFallbackNTP=time-a-g.nist.gov time-b-g.nist.gov time-c-g.nist.gov # Space\nseparated list of NIST time servers\n\
    Note: Servers added to these line(s) should follow local site policy. NIST servers are for\nexample. The timesyncd.conf.d\
    \ directory may need to be created\nExample script: The following example script will create the systemd-timesyncd drop-in\n\
    configuration snippet:\n#!/usr/bin/env bash\nntp_ts=\"time.nist.gov\"\nntp_fb=\"time-a-g.nist.gov time-b-g.nist.gov time-c-g.nist.gov\"\
    \ndisfile=\"/etc/systemd/timesyncd.conf.d/50-timesyncd.conf\"\nif ! find /etc/systemd -type f -name '*.conf' -exec grep\
    \ -Ph '^\\h*NTP=\\H+' {}\n+; then\n [ ! -d /etc/systemd/timesyncd.conf.d ] && mkdir\n/etc/systemd/timesyncd.conf.d\n !\
    \ grep -Pqs '^\\h*\\[Time\\]' \"$disfile\" && echo \"[Time]\" >> \"$disfile\"\n echo \"NTP=$ntp_ts\" >> \"$disfile\"\n\
    fi\nif ! find /etc/systemd -type f -name '*.conf' -exec grep -Ph\n'^\\h*FallbackNTP=\\H+' {} +; then\n [ ! -d /etc/systemd/timesyncd.conf.d\
    \ ] && mkdir\n/etc/systemd/timesyncd.conf.d\n ! grep -Pqs '^\\h*\\[Time\\]' \"$disfile\" && echo \"[Time]\" >> \"$disfile\"\
    \n echo \"FallbackNTP=$ntp_fb\" >> \"$disfile\"\nfi\nRun the following command to reload the systemd-timesyncd configuration:\n\
    # systemctl try-reload-or-restart systemd-timesyncd\nOR\nIf another time synchronization service is in use on the system,\
    \ run the following\ncommand to stop and mask systemd-timesyncd:\n# systemctl --now mask systemd-timesyncd"
  checks:
  - type: manual_review
    info: 'IF systemd-timesyncd is in use on the system, run the following command:

      # find /etc/systemd -type f -name ''*.conf'' -exec grep -Ph

      ''^\h*(NTP|FallbackNTP)=\H+'' {} +

      Verify that NPT=<space_seporated_list_of_servers> and/or

      FallbackNTP=<space_seporated_list_of_servers> is returned and that the time

      server(s) shown follows local site policy

      Example Output:

      /etc/systemd/timesyncd.conf.d/50-timesyncd.conf:NTP=time.nist.gov

      /etc/systemd/timesyncd.conf.d/50-timesyncd.conf:FallbackNTP=time-a-g.nist.gov

      t'
    severity: medium
