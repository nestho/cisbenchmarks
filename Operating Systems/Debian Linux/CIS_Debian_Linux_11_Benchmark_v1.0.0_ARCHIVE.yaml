  - Level 1 - Workstation
  description: 'The cron daemon is used to execute batch jobs on the system. Note: Other methods, such as systemd timers,
    exist for scheduling jobs. If another method is used, cron should be removed, and the alternate method should be secured
    in accordance with local site policy'
  rationale: While there may not be user jobs that need to be run on the system, the system does have maintenance jobs that
