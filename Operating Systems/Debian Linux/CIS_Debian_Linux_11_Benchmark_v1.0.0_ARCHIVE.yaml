    \ system's package manager\n l_pkgoutput=\"\"\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"dpkg-query -W\"\
    \n elif command -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n # Check if GDM is installed\n l_pcl=\"gdm gdm3\"\
    \ # Space separated list of packages to check\n for l_pn in $l_pcl; do\n $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"\
    $l_pkgoutput\\n -\nPackage: \\\"$l_pn\\\" exists on the system\\n - checking configuration\"\n done\n # Check configuration\
    \ (If applicable)\n if [ -n \"$l_pkgoutput\" ]; then\n l_output=\"\" l_output2=\"\"\n # Look for idle-delay to determine\
    \ profile in use, needed for remaining\ntests\n l_kfd=\"/etc/dconf/db/$(grep -Psril '^\\h*autorun-never\\b'\n/etc/dconf/db/*/\
