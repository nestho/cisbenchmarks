      $(grep -Psl -- \"^\\h*$kpname\\h*=\\h*$kpvalue\\b\\h*(#.*)?$\"\n$searchloc)\"\n fafile=\"$(grep -s -- \"^\\s*$kpname\"\
      \ $searchloc | grep -Pv --\n\"\\h*=\\h*$kpvalue\\b\\h*\" | awk -F: '{print $1}')\"\n if [ \"$krp\" = \"$kpvalue\" ]\
      \ && [ -n \"$pafile\" ] && [ -z \"$fafile\" ]; then\n echo -e \"\\nPASS:\\n\\\"$kpname\\\" is set to \\\"$kpvalue\\\"\
      \ in the running\nconfiguration and in \\\"$pafile\\\"\"\n else\n echo -e \"\\nFAIL: \"\n [ \"$krp\" != \"$kpvalue\"\
      \ ] && echo -e \"\\\"$kpname\\\" is set to \\\"$krp\\\" in\nthe running configuration\\n\"\n [ -n \"$fafile\" ] && echo\
