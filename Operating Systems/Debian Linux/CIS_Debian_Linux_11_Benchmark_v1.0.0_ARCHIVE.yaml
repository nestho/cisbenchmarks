    mount options such as noexec/nosuid/nodev. These options limits an attackers ability to create exploits on the system.
    In the case of /home options such as usrquota/grpquota may be considered to limit the impact that users can have on each
    other with regards to disk resource exhaustion. Other options allow for specific behavior. See man mount for exact details
    regarding filesystem-independent and filesystem-specific options. Protection of user data As /home contains user data,
    care should be taken to ensure the security and integrity of the data and mount point.
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
    resizing, or may require the installation of additional tools solely for the purpose of resizing operations. The use of
