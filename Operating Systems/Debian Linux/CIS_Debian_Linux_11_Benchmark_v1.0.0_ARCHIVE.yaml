    expected: 'Run the following script to verify that TMOUT is configured to: include a timeout of no'
    severity: medium
    info: "Run the following script to verify that TMOUT is configured to: include a timeout of no\nmore than 900 seconds,\
      \ to be readonly, to be exported, and is not being changed to a\nlonger timeout.\n#!/bin/bash\noutput1=\"\" output2=\"\
      \"\n[ -f /etc/bash.bashrc ] && BRC=\"/etc/bash.bashrc\"\nfor f in \"$BRC\" /etc/profile /etc/profile.d/*.sh ; do\n grep\
      \ -Pq '^\\s*([^#]+\\s+)?TMOUT=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9])\\b'"
- id: 6.1.1
  title: Ensure permissions on /etc/passwd are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The /etc/passwd file contains user account information that is used by many system utilities and therefore
    must be readable for these utilities to operate.
  rationale: It is critical to ensure that the /etc/passwd file is protected from unauthorized write access. Although it is
    protected by default, the file permissions could be changed either inadvertently or through malicious actions.
  impact: ''
  references: []
  page_start: 739
  audit_raw: 'Run the following command to verify /etc/passwd is mode 644 or more restrictive, Uid is

    0/root and Gid is 0/root:

    # stat -Lc "%n %a %u/%U %g/%G" /etc/passwd

    /etc/passwd 644 0/root 0/root'
  remediation: 'Run the following commands to remove excess permissions, set owner, and set group

    on /etc/passwd:

    # chmod u-x,go-wx /etc/passwd

    # chown root:root /etc/passwd'
  checks:
  - type: manual_review
    info: 'Run the following command to verify /etc/passwd is mode 644 or more restrictive, Uid is

      0/root and Gid is 0/root:

      # stat -Lc "%n %a %u/%U %g/%G" /etc/passwd

      /etc/passwd 644 0/root 0/root'
    severity: medium
