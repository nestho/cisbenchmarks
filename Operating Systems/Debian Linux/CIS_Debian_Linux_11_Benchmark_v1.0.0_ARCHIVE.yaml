    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
  rationale: Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity
    of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to successfully audit information system activity. Attackers may replace the audit tools or inject code into the
    existing tools with the purpose of providing the capability to hide or erase system activity from the audit logs. Audit
    tools should be cryptographically signed in order to provide the capability to identify when the audit tools have been
