  audit_raw: "Run the following script and verify no verify interactive user home directories are mode\n750 or more restrictive:\n\
    #!/usr/bin/env bash\n{\n output=\"\"\n perm_mask='0027'\n maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask)) )\"\n valid_shells=\"\
    ^($( sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' /etc/shells | paste -s -\nd '|' - ))$\"\n awk -v pat=\"$valid_shells\" -F: '$(NF)\
    \ ~ pat { print $1 \" \" $(NF-1) }'\n/etc/passwd | (while read -r user home; do\n if [ -d \"$home\" ]; then\n mode=$(\
    \ stat -L -c '%#a' \"$home\" )\n [ $(( $mode & $perm_mask )) -gt 0 ] && output=\"$output\\n- User $user\nhome directory:\
    \ \\\"$home\\\" is too permissive: \\\"$mode\\\" (should be:\n\\\"$maxperm\\\" or more restrictive)\"\n fi\n done\n if\
    \ [ -n \"$output\" ]; then\n echo -e \"\\n- Failed:$output\"\n else\n echo -e \"\\n- Passed:\\n- All user home directories\
    \ are mode:\n\\\"$maxperm\\\" or more restrictive\"\n fi\n )\n}"
