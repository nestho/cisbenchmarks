- id: 3.5.1.3
  title: Ensure ufw service is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'UncomplicatedFirewall (ufw) is a frontend for iptables. ufw provides a framework for managing netfilter, as
    well as a command-line and available graphical user interface for manipulating the firewall. Notes: • When running ufw
    enable or starting ufw via its initscript, ufw will flush its chains. This is required so ufw can maintain a consistent
    state, but it may drop existing connections (eg ssh). ufw does support adding rules before enabling the firewall. • Run
    the following command before running ufw enable. # ufw allow proto tcp from any to any port 22 • The rules will still
    be flushed, but the ssh port will be open after enabling the firewall. Please note that once ufw is ''enabled'', ufw will
    not flush the chains when adding or removing rules (but will when modifying a rule or changing the default policy) • By
    default, ufw will prompt when enabling the firewall while running under ssh. This can be disabled by using ufw --force
    enable'
  rationale: The ufw service must be enabled and running in order for ufw to protect the system
  impact: Changing firewall settings while connected over network can result in being locked out of the system.
  references:
  - 1. http://manpages.ubuntu.com/manpages/precise/en/man8/ufw.8.html
  page_start: 370
  audit_raw: 'Run the following command to verify that the ufw daemon is enabled:

