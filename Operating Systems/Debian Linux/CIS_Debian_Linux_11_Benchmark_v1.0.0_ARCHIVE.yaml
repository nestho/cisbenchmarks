    )\"\n # Check if banner message is enabled\n if grep -Pisq '^\\h*banner-message-enable=true\\b' \"$l_gdmfile\"; then\n\
    \ l_output=\"$l_output\\n - The \\\"banner-message-enable\\\" option is\nenabled in \\\"$l_gdmfile\\\"\"\n else\n l_output2=\"\
    $l_output2\\n - The \\\"banner-message-enable\\\" option is\nnot enabled\"\n fi\n l_lsbt=\"$(grep -Pios '^\\h*banner-message-text=.*$'\
    \ \"$l_gdmfile\")\"\n if [ -n \"$l_lsbt\" ]; then\n l_output=\"$l_output\\n - The \\\"banner-message-text\\\" option is\
    \ set\nin \\\"$l_gdmfile\\\"\\n - banner-message-text is set to:\\n - \\\"$l_lsbt\\\"\"\n else\n l_output2=\"$l_output2\\\
