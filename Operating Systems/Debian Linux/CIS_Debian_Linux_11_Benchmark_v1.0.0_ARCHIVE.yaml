    \ to remove permissions is excess of 750 from\ninteractive user home directories:\n#!/usr/bin/env bash\n{\n perm_mask='0027'\n\
    \ maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask)) )\"\n valid_shells=\"^($( sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' /etc/shells\
