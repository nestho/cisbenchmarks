- id: 1.8.7
  title: Ensure GDM disabling automatic mounting of removable media is not overridden
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 2 - Workstation
  description: 'By default GNOME automatically mounts removable media when inserted as a convenience to the user By using
    the lockdown mode in dconf, you can prevent users from changing specific settings. To lock down a dconf key or subpath,
    create a locks subdirectory in the keyfile directory. The files inside this directory contain a list of keys or subpaths
    to lock. Just as with the keyfiles, you may add any number of files to this directory. Example Lock File: # Lock desktop
    screensaver settings /org/gnome/desktop/media-handling/automount /org/gnome/desktop/media-handling/automount-open'
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users
  references:
  - 1. https://help.gnome.org/admin/system-admin-guide/stable/dconf-lockdown.html.en
  page_start: 184
  audit_raw: "Run the following script to verify disable automatic mounting is locked:\n#!/usr/bin/env bash\n{\n # Check if\
    \ GNOME Desktop Manager is installed. If package isn't\ninstalled, recommendation is Not Applicable\\n\n # determine system's\
    \ package manager\n l_pkgoutput=\"\"\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"dpkg-query -W\"\n elif\
    \ command -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n # Check if GDM is installed\n l_pcl=\"gdm gdm3\" # Space\
    \ seporated list of packages to check\n for l_pn in $l_pcl; do\n $l_pq \"$l_pn\" > /dev/null 2>&1 && l_pkgoutput=\"$l_pkgoutput\\\
    n -\nPackage: \\\"$l_pn\\\" exists on the system\\n - checking configuration\"\n done\n # Check configuration (If applicable)\n\
    \ if [ -n \"$l_pkgoutput\" ]; then\n l_output=\"\" l_output2=\"\"\n # Look for idle-delay to determine profile in use,\
    \ needed for remaining\ntests\n l_kfd=\"/etc/dconf/db/$(grep -Psril '^\\h*automount\\b' /etc/dconf/db/*/ |\nawk -F'/'\
    \ '{split($(NF-1),a,\".\");print a[1]}').d\" #set directory of key file\nto be locked\n l_kfd2=\"/etc/dconf/db/$(grep\
    \ -Psril '^\\h*automount-open\\b'\n/etc/dconf/db/*/ | awk -F'/' '{split($(NF-1),a,\".\");print a[1]}').d\" #set\ndirectory\
    \ of key file to be locked\n if [ -d \"$l_kfd\" ]; then # If key file directory doesn't exist, options\ncan't be locked\n\
    \ if grep -Piq '^\\h*\\/org/gnome\\/desktop\\/media-handling\\/automount\\b'\n\"$l_kfd\"; then\n l_output=\"$l_output\\\
    n - \\\"automount\\\" is locked in \\\"$(grep -Pil\n'^\\h*\\/org/gnome\\/desktop\\/media-handling\\/automount\\b' \"$l_kfd\"\
    )\\\"\"\n else\n l_output2=\"$l_output2\\n - \\\"automount\\\" is not locked\"\n fi\n else\n l_output2=\"$l_output2\\\
    n - \\\"automount\\\" is not set so it can not be\nlocked\"\n fi\n if [ -d \"$l_kfd2\" ]; then # If key file directory\
    \ doesn't exist,\noptions can't be locked\n if grep -Piq '^\\h*\\/org/gnome\\/desktop\\/media-handling\\/automountopen\\\
    b' \"$l_kfd2\"; then\n l_output=\"$l_output\\n - \\\"lautomount-open\\\" is locked in \\\"$(grep\n-Pril '^\\h*\\/org/gnome\\\
    /desktop\\/media-handling\\/automount-open\\b'\n\"$l_kfd2\")\\\"\"\n else\n l_output2=\"$l_output2\\n - \\\"automount-open\\\
    \" is not locked\"\n fi\n else\n l_output2=\"$l_output2\\n - \\\"automount-open\\\" is not set so it can\nnot be locked\"\
    \n fi\n else\n l_output=\"$l_output\\n - GNOME Desktop Manager package is not installed\non the system\\n - Recommendation\
    \ is not applicable\"\n fi\n # Report results. If no failures output in l_output2, we pass\n [ -n \"$l_pkgoutput\" ] &&\
    \ echo -e \"\\n$l_pkgoutput\"\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n$l_output\\\
    n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - Reason(s) for audit\nfailure:\\n$l_output2\\n\"\n [ -n \"\
    $l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n fi\n}"
