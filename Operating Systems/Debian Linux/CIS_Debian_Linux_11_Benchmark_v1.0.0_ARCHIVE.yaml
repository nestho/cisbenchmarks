  - Level 2 - Workstation
  description: The /home directory is used to support disk storage needs of local users.
  rationale: The reasoning for mounting /home on a separate partition is as follows. Protection from resource exhaustion The
    default installation only creates a single / partition. Since the /home directory contains user generated data, there
    is a risk of resource exhaustion. It will essentially have the whole disk available to fill up and impact the system as
    a whole. In addition, other operations on the system could fill up the disk unrelated to /home and impact all local users.
