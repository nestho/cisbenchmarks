- id: 1.1.2.1
  title: Ensure /tmp is a separate partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set additional mount options such as the noexec option
    on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker from establishing
    a hard link to a system setuid program and wait for it to be updated. Once the program was updated, the hard link would
    be broken and the attacker would have his own copy of the program. If the program happened to have a security vulnerability,
    the attacker could continue to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating
    a separate partition for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a configuration where /tmp is not a separate file system it will essentially have the whole disk available, as the
    default installation only creates a single / partition. On the other hand, a RAM-based /tmp (as with tmpfs) will almost
    certainly be much smaller, which can lead to applications filling up the filesystem much more easily. Another alternative
    is to create a dedicated partition for /tmp from a separate volume or disk. One of the downsides of a disk-based dedicated
