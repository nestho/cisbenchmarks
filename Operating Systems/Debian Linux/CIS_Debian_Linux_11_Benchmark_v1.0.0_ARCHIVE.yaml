- id: 1.8.6
  title: Ensure GDM automatic mounting of removable media is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 2 - Workstation
  description: By default GNOME automatically mounts removable media when inserted as a convenience to the user.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting.
  references:
  - 1. https://access.redhat.com/solutions/20107
  page_start: 178
  audit_raw: "Run the following script to verify automatic mounting is disabled:\n#!/usr/bin/env bash\n{\n l_pkgoutput=\"\"\
    \ l_output=\"\" l_output2=\"\"\n # Check if GNOME Desktop Manager is installed. If package isn't\ninstalled, recommendation\
    \ is Not Applicable\\n\n # determine system's package manager\n if command -v dpkg-query > /dev/null 2>&1; then\n l_pq=\"\
    dpkg-query -W\"\n elif command -v rpm > /dev/null 2>&1; then\n l_pq=\"rpm -q\"\n fi\n # Check if GDM is installed\n l_pcl=\"\
    gdm gdm3\" # Space seporated list of packages to check\n for l_pn in $l_pcl; do\n $l_pq \"$l_pn\" > /dev/null 2>&1 &&\
    \ l_pkgoutput=\"$l_pkgoutput\\n -\nPackage: \\\"$l_pn\\\" exists on the system\\n - checking configuration\"\n done\n\
    \ # Check configuration (If applicable)\n if [ -n \"$l_pkgoutput\" ]; then\n echo -e \"$l_pkgoutput\"\n # Look for existing\
    \ settings and set variables if they exist\n l_kfile=\"$(grep -Prils -- '^\\h*automount\\b' /etc/dconf/db/*.d)\"\n l_kfile2=\"\
    $(grep -Prils -- '^\\h*automount-open\\b' /etc/dconf/db/*.d)\"\n # Set profile name based on dconf db directory ({PROFILE_NAME}.d)\n\
    \ if [ -f \"$l_kfile\" ]; then\n l_gpname=\"$(awk -F\\/ '{split($(NF-1),a,\".\");print a[1]}' <<<\n\"$l_kfile\")\"\n elif\
    \ [ -f \"$l_kfile2\" ]; then\n l_gpname=\"$(awk -F\\/ '{split($(NF-1),a,\".\");print a[1]}' <<<\n\"$l_kfile2\")\"\n fi\n\
    \ # If the profile name exist, continue checks\n if [ -n \"$l_gpname\" ]; then\n l_gpdir=\"/etc/dconf/db/$l_gpname.d\"\
    \n # Check if profile file exists\n if grep -Pq -- \"^\\h*system-db:$l_gpname\\b\" /etc/dconf/profile/*;\nthen\n l_output=\"\
    $l_output\\n - dconf database profile file \\\"$(grep -Pl\n-- \"^\\h*system-db:$l_gpname\\b\" /etc/dconf/profile/*)\\\"\
    \ exists\"\n else\n l_output2=\"$l_output2\\n - dconf database profile isn't set\"\n fi\n # Check if the dconf database\
    \ file exists\n if [ -f \"/etc/dconf/db/$l_gpname\" ]; then\n l_output=\"$l_output\\n - The dconf database \\\"$l_gpname\\\
    \" exists\"\n else\n l_output2=\"$l_output2\\n - The dconf database \\\"$l_gpname\\\"\ndoesn't exist\"\n fi\n # check\
    \ if the dconf database directory exists\n if [ -d \"$l_gpdir\" ]; then\n l_output=\"$l_output\\n - The dconf directory\
    \ \\\"$l_gpdir\\\" exitst\"\n else\n l_output2=\"$l_output2\\n - The dconf directory \\\"$l_gpdir\\\"\ndoesn't exist\"\
    \n fi\n # check automount setting\n if grep -Pqrs -- '^\\h*automount\\h*=\\h*false\\b' \"$l_kfile\"; then\n l_output=\"\
    $l_output\\n - \\\"automount\\\" is set to false in:\n\\\"$l_kfile\\\"\"\n else\n l_output2=\"$l_output2\\n - \\\"automount\\\
    \" is not set correctly\"\n fi\n # check automount-open setting\n if grep -Pqs -- '^\\h*automount-open\\h*=\\h*false\\\
    b' \"$l_kfile2\"; then\n l_output=\"$l_output\\n - \\\"automount-open\\\" is set to false in:\n\\\"$l_kfile2\\\"\"\n else\n\
    \ l_output2=\"$l_output2\\n - \\\"automount-open\\\" is not set\ncorrectly\"\n fi\n else\n # Setings don't exist. Nothing\
    \ further to check\n l_output2=\"$l_output2\\n - neither \\\"automount\\\" or \\\"automountopen\\\" is set\"\n fi\n else\n\
    \ l_output=\"$l_output\\n - GNOME Desktop Manager package is not installed\non the system\\n - Recommendation is not applicable\"\
    \n fi\n # Report results. If no failures output in l_output2, we pass\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\\
    n- Audit Result:\\n ** PASS **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - Reason(s) for\
    \ audit\nfailure:\\n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n fi\n}"
