  title: (L1) Configuring SSH – restrict Cipher list
  scoring: scored
  profile:
  - Level 1
  description: This variable limits the types of ciphers that SSH can use during communication.
  rationale: Based on research conducted at various institutions, it was determined that the symmetric portion of the SSH
    Transport Protocol (as described in RFC 4253) has security weaknesses that allowed recovery of up to 32 bits of plaintext
    from a block of ciphertext that was encrypted with the Cipher Block Chaining (CBD) method. From that research, new Counter
    mode algorithms (as described in RFC4344) were designed that are not vulnerable to these types of attacks and these algorithms
    are now recommended for standard use.
