- id: 4.2.1
  title: (L1) Network Attribute JOBACN (Network Job Action)
  scoring: scored
  profile:
  - Level 1
  description: Specifies the action taken for input streams received through the SNA network by the system. The JOBACN value
    should be set to *REJECT to secure your system from job streams received through the network.
  rationale: The Job Action setting controls remote request to run local jobs. The default setting is *FILE which files remote
    input streams on the queue for the receiving user who can then display, cancel, or receive the input allowing potentially
    unwanted remote commands to run on the local system. The recommended value is *REJECT which will send both the sender
    and receiver a message stating that the input stream was rejected.
  impact: Changing Network Attribute JOBACN to *REJECT may disable SNA network job streams from entering your system without
    proper credentialed authentication. 124 | P a g e
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rzarl/rzarljob
  page_start: 124
  audit_raw: '•DSPNETA

    •Page Down and verify that the value for Job action is set to *REJECT.'
