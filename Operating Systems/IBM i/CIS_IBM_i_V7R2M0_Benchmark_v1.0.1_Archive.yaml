- id: 4.3.4
  title: (L1) IBM i SMBv2 Server
  scoring: scored
  profile:
  - Level 1
  description: This setting configures the server-side processing of the Server Message Block version 2 (SMBv2) protocol.
  rationale: Since September 2016, vendors have strongly encouraged that SMBv1 be disabled and no longer used on modern networks,
    as it is a 30 year old design that is much more vulnerable to attacks then much newer designs such as SMBv2 and SMBv3.
    138 | P a g e
  impact: 'Some legacy OSes (e.g. Windows XP, Server 2003 or older), applications and appliances may no longer be able to
    communicate with the system once SMBv1 is disabled. We recommend careful testing be performed to determine the impact
    prior to configuring this as a widespread control, and where possible, remediate any incompatibilities found with the
    vendor of the incompatible system. Microsoft is also maintaining a thorough (although not comprehensive) list of known
    SMBv1 incompatibilities at this link: SMB1 Product Clearinghouse | Storage at Microsoft'
  references:
  - 1. https://www.ibm.com/support/pages/smb2-support-ibm-i-72
  page_start: 138
  audit_raw: 'You can control which version(s) of SMB the NetServer will support by calling the

    NetServer maintenance utility to set the SMB flags and then restart the NetServer.

    A good starting point is to see what those flags are presently set to.

    In order to view the SMB flags do the following:

    • CALL QZLSMAINT PARM(''40'' ''0'')

    • Type WRKSPLF and locate your spool file with the name QPCSMPRT. Verify that the

    data in the flags is as follows which indicates that the server supports only SMBv2:

    OLD FLAGS

    0000000000000500

    NEW FLAGS

    0000000000000500

    • If the data for OLD FLAGS and NEW FLAGS is all 0s as shown below, this indicates

    that NetServer is using the default SMB version for your operating system version.

    At V7R2, that means that SMB version 1 (SMBv1 is being used exclusively with no

    support for SMBv2.

    OLD FLAGS

    0000000000000000

    NEW FLAGS

    0000000000000000

    To recap, the SMB version support and the corresponding flag values for IBM i 7.2:

    SMB1 only: 000

    SMB1 & SMB2: 400

    SMB2 only: 500

    Setting the flags to any other value may have unpredictable results'
  remediation: 'To allow SMB2 only, set the flags to a value of 500.

    • CALL QZLSMAINT PARM(''40'' ''1'' ''0X500'')

    Note that the flag values for 7.3 and beyond are different and the upgrade from 7.2 will not

    convert the SMB flags to the equivalent value for the new release so you will need to revisit

    these flags after an upgrade. This document explains how the flags are set for 7.3 SMB and

    SMB2 Support for IBM i 7.3

    139 | P a g e'
  checks:
