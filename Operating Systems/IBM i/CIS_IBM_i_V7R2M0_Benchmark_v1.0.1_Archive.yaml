- id: '4.5'
  title: IBM i Patch Management 4.5.1 (L1) IBM i Patch Management
  scoring: scored
  profile:
  - Level 1
  description: This settings describes the IBM i patch management process. This setting describes changing the System Service
    Tools Password Expiration Interval from the default setting, 180 days.
  rationale: Important IBM i updates are obtained through PTF (Program Temporary Fix) levels. Updates can contain important
    bug fixes and/or security patches, and should be installed as soon as possible. Because attackers can crack passwords,
    the more frequently you change the password the less opportunity an attacker has to use a cracked password. However, the
    lower this value is set, the higher the potential for an increase in calls to help desk support due to users having to
    change their password or forgetting which password is current. The recommended state for this setting is 90 or fewer days
    but not 0.
  impact: None, this is the required process. 161 | P a g e
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rzajq/rzajqvie
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rzamh/rzamh
  page_start: 161
