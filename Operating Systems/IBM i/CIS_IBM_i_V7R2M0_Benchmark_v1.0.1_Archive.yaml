  scoring: scored
  profile:
  - Level 1
  description: All DDM Remote Configuration List entries shall specify *VFYENCPWD for the Secure Location (SECURELOC) parameter.
    *VFYENCPWD requires the same user ID and password on each source and target system. To avoid having to use shared default
    user profiles, create a user profile on each system where the user needs access to the distributed relational database.
  rationale: Setting the Secure Loc Parameter of all remote locations ensures that encrypted password are required for SNA
    DDM/DRDA communications.
  impact: Shared (non-unique) accounts in an APPN network may be impacted. 126 | P a g e
  references:
