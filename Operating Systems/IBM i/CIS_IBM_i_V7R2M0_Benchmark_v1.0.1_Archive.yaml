      IBM supplied user profiles with the exception of QSECOFR should be excluded from the

      audit. A list of IBM supplied user profi'
    severity: medium
- id: '3.6'
  title: (L1) Default Passwords
  scoring: scored
  profile:
  - Level 1
  description: When you create a new user profile, the default is to make the password the same as the user profile name.
    When you create new user profiles, consider assigning a unique, nontrivial password instead of using the default password.
  rationale: Default passwords provide an opportunity for someone to enter your system, if someone knows your policy for assigning
    profile names and knows that a new person is joining your organization. Additionally, accounts with default passwords
    are often used for shared (nonunique) accounts. Tell the new user the password confidentially, such as in a “Welcome to
    the System” letter that outlines your security policies. Require the user to change the password the first time that the
    user signs on by setting the user profile to PWDEXP(*YES).
  impact: Shared passwords may be impacted.
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/cl/anzdftpwd.
  page_start: 28
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT ALL

    USER_NAME, STATUS, DFTPWD, PWDEXP

    FROM QSYS2/USER_INFO T01

    WHERE DFTPWD = ''YES'''
  remediation: 'To establish the recommended configuration, change the password of all user profiles with

    default passwords to a non-trivial password and set the password to expire.

    CHGUSRPRF USRPRF(<xxxxxx>) PASSWORD(<xxxxxx>) PWDEXP(*YES)

    Additionally, the command ANZDFTPWD ACTION (*DISABLE) should be added to a job

    schedule entry to periodically scan for and *DISABLE any profiles with *DEFAULT

    passwords, and system value QPWDRULES should contain the parameters *ALLCRTCHG

    and *LMTPRFNAME to prevent the creation of profiles with *DEFAULT passwords.

    28 | P a g e'
  checks:
  - type: manual_review
    info: '• On a command line, type STRSQL and press Enter

      • Enter the following SQL statement and press Enter.

      SELECT ALL

      USER_NAME, STATUS, DFTPWD, PWDEXP

      FROM QSYS2/USER_INFO T01

      WHERE DFTPWD = ''YES'''
    severity: medium
- id: '3.7'
  title: (L1) Inactive Profiles
  scoring: scored
  profile:
  - Level 1
  description: Remove/disable inactive user profiles within 90 days.
  rationale: Accounts that are not used regularly are often targets of attack since it is less likely that any changes (such
    as a changed password) will be noticed. As such, these accounts may be more easily exploited and used to access sensitive
    data.
  impact: ''
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rzarl/rzarlibm
  page_start: 30
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT ALL

    USER_NAME, STATUS, LASTUSED

    FROM QSYS2/USER_INFO T01

    WHERE STATUS = ''*ENABLED''

    AND LASTUSED <= ‘’

    OR STATUS = ''*ENABLED''

    AND LASTUSED IS NULL

    Note: In the above SQL, enter the calendar date equal to 90 days prior to the audit or that of

    your inactive profile policy. The date needs to be entered in ‘yyyy-mm-dd’ format enclosed

    in single ‘ marks as in the following example:

    LASTUSED <= ‘2020-01-01’

    IBM supplied user profiles will appear in the report and should be excluded from the audit.

    A list of IBM supplied user profiles can be obtained from the references below.

    30 | P a g e'
  remediation: 'To establish the recommended configuration, remove/disable all inactive profiles

    displayed.

    CHGUSRPRF USRPRF(<xxxxxx>) STATUS(*DISABLED)

    Optional (recommended) on a regular basis such as 30-90 days after inactive profiles have

    been *DISABLED, they should be archived and removed.

    DLTUSRPRF USRPRF(<xxxxxx>)

    Note that when removing user profiles, there needs to be consideration of changing

    ownership of the objects they own.'
