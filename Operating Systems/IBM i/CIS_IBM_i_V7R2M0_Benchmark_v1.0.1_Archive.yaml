- id: 4.1.2.2
  title: (L2) Allow User Domain Objects in These Libraries
  scoring: scored
  profile:
  - Level 2
  description: This specifies the names of the libraries that can contain the *USRSPC (user space), *USRIDX (user index),
    and *USRQ (user queue) type objects. In our environment many vendor applications are making use of USRxx objects in numerous
    and changing libraries. This increases the complexity of restricting this system value to specific libraries without creating
    a threat to legitimate operations. In addition, the value of *ALL is generally acceptable for any system that does not
    need to comply with DoD C2 level security specifications. In addition, the probability of damaging events is low if object
    authority and application behavior is controlled appropriately. This is the shipped value.
  rationale: Some systems have application software that relies on object types *USRSPC, *USRIDX, or *USRQ. For those systems,
    the list of libraries for the QALWUSRDMN system value should include the libraries that are used by the application software.
  impact: Systems with high security requirements require the restriction of user *USRSPC, *USRIDX, *USRQ objects. The system
    cannot audit the movement of information to and from user domain objects. The restriction does not apply to user domain
    objects of type program (*PGM), server program (*SRVPGM), and SQL packages (*SQLPKG). 91 | P a g e
