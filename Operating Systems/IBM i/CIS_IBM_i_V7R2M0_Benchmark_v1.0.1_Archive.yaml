- id: '3.11'
  title: (L1) Group Profiles With Passwords
  scoring: scored
  profile:
  - Level 1
  description: Group profiles should not have a password as they are usually not associated with a unique account.
  rationale: Unique accounts provide accountability to the actions they perform. Group members should all be unique, but allowing
    the group profile to which they belong to sign on with a password provides no unique accountability to the actions that
    shared profiles with a password present.
  impact: ''
