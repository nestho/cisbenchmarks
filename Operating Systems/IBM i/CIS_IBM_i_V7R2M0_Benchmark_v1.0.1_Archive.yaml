- id: '3.9'
  title: (L1) User Profiles With Command Line Access
  scoring: scored
  profile:
  - Level 1
  description: User Profiles with command line access can run commands they are authorized to from a command line.
  rationale: Application user profiles should be limited to menus and restricted from directly running system commands from
    a command line. Only administrators with Special Authorities limited to the Principle of Least Privilege may be allowed
    to run commands from a command line.
  impact: Users will be prevented from running command from a command line.
  references: []
  page_start: 34
  audit_raw: '• On a command line, type STRSQL and press Enter

