- id: 4.1.1.38
  title: (L1) System Library List
  scoring: scored
  profile:
  - Level 1
  description: The system library list (QSYSLIBL) system value is used as the first part of the library list associated with
    a job. The libraries in the system part of the library list of a job are searched before any other libraries in the library
    list of a job. The list can contain as many as 15 names. You cannot delete or rename a library specified as part of the
    system library list, because libraries in this library list are locked. You can change the system library list (QSYSLIBL).
    If you change QSYSLIBL, the change takes place immediately for new jobs entering the system. The change does not affect
    running jobs, unless the application in the job accesses the system library list directly.
  rationale: The security of the System Library List is a vital part of your overall system security. All libraries in the
    System Library List should provide *PUBLIC *USE authority. Any authority greater than *USE to any library in the System
    Library List can allow the introduction of trojans and malicious code into your system that will be searched before any
    other libraries in the library list of a job.
  impact: ''
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/nls/rbagsqsys
  - 2. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rbam6/jlibl.ht
  page_start: 84
  audit_raw: 'DSPSYSVAL SYSVAL(QSYSLIBL)

    • Make note of all Libraries in the System part of the library list

    • DSPOBJAUT OBJ(<xxxxxx>) OBJTYPE(*LIB) For each library in the list

    • Ensure that each library in the list grants *PUBLIC *USE Object Authority and that

    any additional Users with an authority greater than *USE are properly authorized by

    the business to introduce changes into the library.

    84 | P a g e'
  remediation: 'To establish the recommended configuration, set the *PUBLIC authority to *USE to all

    libraries in the System part of the library list QSYSLIBL that grant an authority greater than

    *USE:

    GRTOBJAUT OBJ(<xxxxxx>) OBJTYPE(*LIB) USER(*PUBLIC) AUT(*USE) REPLACE(*YES)'
  checks:
  - type: manual_review
    info: 'DSPSYSVAL SYSVAL(QSYSLIBL)

      • Make note of all Libraries in the System part of the library list

