    FROM SYSTOOLS/GRPPTFCUR T01

    WHERE GRP_ID IN (''SF99718'', ''SF99716'', ''SF99713'', ''SF99223'', ''SF99719'')

    • The following 5 PTF Groups should show that the INSTALLED LEVEL IS CURRENT.

    SF99718 720 Group Security

    SF99716 720 Java

