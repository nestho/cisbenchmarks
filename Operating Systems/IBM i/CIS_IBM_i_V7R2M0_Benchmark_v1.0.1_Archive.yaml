  title: (L1) IBM i NetServer LANMAN Password Hash
  scoring: scored
  profile:
  - Level 1
  description: This policy specifies how clients will authenticate and prevents the use of insecure LANMAN password authentication.
    Because attackers can crack weak passwords, the stronger the password hash is, the more difficult the password is to crack.
  rationale: The original LAN Manager password was developed in 1987. The LM hash is not a true oneway function as the passwords
    can be determined from the hash because of several weaknesses in its design. The original LM hash was replaced by the
    NTLMv1 protocol in 1993 and later updated in NTLMv2. Due to the multiple weaknesses in the LANMAN password, it has been
    deprecated and should no longer be used.
  impact: Setting the IBM i NetServer LANMAN option to a value of *NO may impact legacy authentication protocols in Windows
    95/98. Additionally, changing the IBM i NetServer LANMAN option requires you to end IBM i NetServer access (ENDNSV) and
