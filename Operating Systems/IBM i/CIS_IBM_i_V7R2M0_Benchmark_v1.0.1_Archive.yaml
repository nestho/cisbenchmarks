- id: '3.3'
  title: (L1) User Profile (*USRPRF) Object Ownership
  scoring: scored
  profile:
  - Level 1
  description: 'Your most important protection is resource security on your server. Resource security on the system allows
    you to define who can use objects and how those objects can be used. Every user profile exists as a *USRPRF object in
    library QSYS. Granting authorities to *USRPRF objects allows those who have been granted authority to hijack those users
    without proper authentication (no password). Jobs submitted or swapped as other *USRPRF objects will inherit their privileges
    and authorities. The default *PUBLIC authority (AUT) to all user profile objects (*USRPRF) is *EXCLUDE and should never
    be changed to prevent anyone other than the owner and the user profile itself from using it to gain unauthorized access
    to *USRPRF objects including all authorizations and privileges without knowing the password. All IBM Supplied Profiles
    shall be owned by QSYS with the following exceptions: • QFAXMSF shall be owned by QAUTPROF • QRDARS400xx shall be owned
    by QRDARS400 • QTIVOLI, QTIVROOT and QTIVUSER shall be owned by QTIVOLI Non-IBM (user created) profiles shall be owned
    by QSECOFR or QSYS.'
  rationale: Granting ownership authority to any *USRPRF object allows an attacker to swap with or submit jobs as these profiles
    and use their privileges and authorizations without knowing their passwords or credentials. Granting ownership authority
    to any *USRPRF object is a security risk. 21 | P a g e
  impact: Functions involving profile swaps and changes may be impacted.
  references:
  - 1. https://www.ibm.com/support/knowledgecenter/en/ssw_ibm_i_72/rzarl/rzarlibm
  page_start: 21
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT ALL SYS_ONAME, OBJTYPE, OWNER FROM QSYS2/OBJ_PRIV

    WHERE OBJTYPE = ''*USRPRF'' AND USER_NAME = ''*PUBLIC''

    AND OWNER NOT IN (''QSECOFR'', ''QSYS'')

    • Verify that the display returns no ownership anomalies with the following valid

    exceptions.

    • QFAXMSF shall be owned by QAUTPROF

    • QRDARS400<x> shall be owned by QRDARS400

    • QTIVOLI, QTIVROOT and QTIVUSER shall be owned by QTIVOLI'
  remediation: 'To establish the recommended configuration, change the owner of all non-IBM supplied

    *USRPRF objects to QSECOFR:

    CHGOBJOWN OBJ() OBJTYPE(*USRPRF) NEWOWN(QSECOFR) CUROWNAUT(*REVOKE)'
