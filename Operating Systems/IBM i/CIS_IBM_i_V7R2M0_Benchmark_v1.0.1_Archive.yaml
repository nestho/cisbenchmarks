- id: 4.1.1.1
  title: (L1) Allow Restoration of Security-Sensitive Objects
  scoring: scored
  profile:
  - Level 1
  description: Determines if the system will allow authorized users to restore system-state objects or programs that adopt
    authority to the system. System administrators must use this privileged access to restore objects frequently as a part
    of their routine IBM-supplied PTF O/S maintenance as well as related to back-up and recover processes for applications.
    The restore privileges will be limited to System administrator and security personnel based on special authorities.
  rationale: Because some programs may cause serious problems, this system value provides a method to protect your system.
  impact: 'It is important to set the QALWOBJRST value to *ALL before performing some system activities, such as: • Installing
    a new release of the IBM® i licensed program • Installing new licensed programs • Recovering your system These activities
    may fail if the QALWOBJRST value is not *ALL. To ensure system security, return the QALWOBJRST value to your normal setting
    after completing the system activity. If you regularly restore programs and applications to your system and accept the
    risk, you might need to set the QALWOBJRST system value to *ALWPGMADP. Restoration of programs that adopt authority may
    pose a security risk to your system and must be evaluated carefully prior to restoring to your system.'
