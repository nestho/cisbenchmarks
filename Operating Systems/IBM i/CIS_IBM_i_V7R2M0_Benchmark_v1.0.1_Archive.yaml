      LASTUSED <= '
    severity: medium
- id: '3.8'
  title: (L1) User Profile With Non-Expiring Passwords
  scoring: scored
  profile:
  - Level 1
  description: User Profiles with non-expiring passwords are never required to change their password.
  rationale: Non-expiring passwords are security risks because if no automated solution is in place, users are never prompted
    to change their passwords. Non-expiring passwords present a security risk as they may either be shared (non-unique) accounts
    or their passwords may be easy to obtain through observation of login keystrokes over an indefinite period of time.
  impact: Shared accounts may be impacted.
  references: []
  page_start: 32
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT ALL

    USER_NAME, STATUS, PWDEXPITV, LASTUSED

    FROM QSYS2/USER_INFO T01

    WHERE PWDEXPITV = -1

    Service accounts may be excluded from the audit and remediation. A service account is a

    user account that is created explicitly to provide a security context for automated system

    and application services running on the system. Service accounts should be configured with

    a non-trivial, complex password that is used in an automated service process and never

    used interactively. Service accounts should be documented and their Password expiration

    interval should be set to *NOMAX. A process should then be documented and executed to

    periodically change their passwords manually.'
  remediation: 'To establish the recommended configuration, change all interactive user profile password

    expiration intervals to *SYSVAL and ensure that your system value for QPWDEXPITV is set

    to 90 days or less or a value commensurate with your policy:

    CHGUSRPRF USRPRF(<xxxxxx>) PWDEXPITV(*SYSVAL)

    32 | P a g e'
