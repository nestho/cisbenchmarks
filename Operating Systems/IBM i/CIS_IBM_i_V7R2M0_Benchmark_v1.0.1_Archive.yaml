- id: 4.1.1.40
  title: (L1) Verify Object On Restore (Scored)
  scoring: scored
  profile:
  - Level 1
  description: Determines when signatures will be verified and if the object will be restored without a valid signature. (See
    also QALWOBJRST & QFRCCVNRST, 2.1.1.1 and 2.1.1.16) Use this value for normal operations, when you expect some of the
    objects you restore to be unsigned, but you want to ensure that all signed objects have signatures that are valid. Commands
    and programs you have created or purchased before digital signatures were available will be unsigned. This value allows
    those commands and programs to be restored. This is the default value.
  rationale: You can prevent anyone from restoring an object, unless that object has a correct digital signature from a trusted
    software provider.
  impact: When your system is shipped, the QVFYOBJRST system value is set to 3. If you change the value of QVFYOBJRST, it
    is important to set the QVFYOBJRST value to 3 or lower before installing a new release of the IBM i operating system.
