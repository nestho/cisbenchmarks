- id: '4.10'
  title: (L1) IBM Supplied User Profiles
  scoring: scored
  profile:
  - Level 1
  description: This section contains information about the IBM-supplied user profiles that are shipped with the system and
    Licensed Program Products. These profiles are used as object owners for various system functions. Some system functions
    also run under specific IBM-supplied user profiles.
  rationale: You must change the password for the QSECOFR profile after you install your system. This password is the same
    for every IBM i system and poses a security exposure until it is changed. However, do not change any other values for
    IBM-supplied user profiles. Changing these profiles can cause system functions to fail. Additionally, IBM Supplied Profiles
    should not be used as group profiles with few exceptions. It is better to create your own group profiles with the proper
    authorities and special authorities using the Principle of Least Privilege (PoLP) as defined by the NIST and regulatory
    compliance requirements. All IBM-supplied user profiles except for QSECOFR are shipped with a password of *NONE and are
    not intended for sign-on. These profiles are used by the IBM i operating system. Therefore, signing on with these profiles
    or using the profiles to own user (nonIBM supplied ) objects is not recommended.
  impact: Functions using the authorities and parameters of any profile you change may fail. You may want to contact IBM or
    your business partner for guidance prior to making any changes.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=reference-supplied-user-profiles
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=profiles-default-values-user
  page_start: 51
  audit_raw: 'Changes to IBM Supplied Profiles

    • On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT AUTHORIZATION_NAME, NO_PASSWORD_INDICATOR, STATUS,

    USER_CLASS_NAME, INITIAL_PROGRAM_NAME,

    LIMIT_CAPABILITIES, SPECIAL_AUTHORITIES

    FROM QSYS2/USER_INFO WHERE AUTHORIZATION_NAME LIKE ''Q%'' AND

    NO_PASSWORD_INDICATOR = ''NO'' OR AUTHORIZATION_NAME LIKE ''Q%'' AND

    STATUS = ''*DISABLED'' OR AUTHORIZATION_NAME LIKE ''Q%'' AND

    USER_CLASS_NAME <> ''*USER'' OR AUTHORIZATION_NAME LIKE ''Q%'' AND

    INITIAL_PROGRAM_NAME <> ''*NONE'' OR AUTHORIZATION_NAME LIKE ''Q%'' AND

    LIMIT_CAPABILITIES <> ''*NO'' OR AUTHORIZATION_NAME LIKE ''Q%'' AND

    SPECIAL_AUTHORITIES <> ''*NONE''

    • Review the results of the screen output. This indicates that one or more of the

    following parameters of the profiles in the list does not match the default values

    that are used for all IBM-supplied user profiles.

    • NO_PASSWORD_INDICATOR (PASSWORD) = YES (Default)

    • STATUS (STATUS) = *ENABLED (Default)

    • USER_CLASS_NAME (USRCLS) = *USER (Default)

    • INITIAL_PROGRAM_NAME (INLPGM) = *NONE (Default)

    • LIMIT_CAPABILITIES (LMTCPB) = *NO (Default)

    • SPECIAL_AUTHORITIES (SPCAUT) = *NONE (Default)

    • Compare the results of the screen output to information about IBM-supplied

    profiles, their purpose, and values for any IBM-supplied profiles that are different

    from the defaults from the shipped defaults from the following link.

    https://www.ibm.com/docs/en/i/7.5?topic=reference-supplied-user-profiles

    IBM Supplied Group Profiles

    • To check if IBM Supplied Profiles are being used as Group Profiles

    • On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT T01.GROUPNAME, T01.USERNAME FROM QSYS2/GROUPLIST T01

    INNER JOIN

    QSYS2/USER_INFO T02 ON T01.GROUPNAME = T02.USER_NAME WHERE

    T02.USER_NAME LIKE ''Q%''

    AND T02.USER_NAME NOT IN (''QBRMS'', ''QMQMADM'', ''QONDADM'',

    ''QRDARS400'', ''QRDARSADM'', ''QWQADMIN'')

    • Review the results of the screen output. The following are valid exclusions from

    the audit.

    • QBRMS

    • QMQMADM

    • QONDADM

    • QRDARS400

    • QRDARSADM

    • QWQADMIN'
  remediation: '• Change any IBM-Supplied user profile found in the audit that are different from

    the defaults or values different from the list in the referenced table

    https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles

    CHGUSRPRF USRPRF(<xxxxxx>) <parameter>(<xxxxxx>)

    • Change any User Profile that is a group member of an IBM-Supplied user profile

    found in the audit to remove the IBM-Supplied user profile from its Group

    (GRPPRF) and/or Supplemental Group (SUPGRPPRF) parameters.

    CHGUSRPRF USRPRF(<xxxxxx>) GRPPRF(<xxxxxx>) SUPGRPPRF(<xxxxxx>)

    Note: Many of the IBM-supplied user profiles cannot be specified on CHGUSRPRF. If

    there are IBM supplied user profiles that don''t match the documented default values,

    they can be reset using the Reset Profile Attributes (QSYRESPA) API.'
  checks:
  - type: sql
    command: SELECT AUTHORIZATION_NAME, NO_PASSWORD_INDICATOR, STATUS,
