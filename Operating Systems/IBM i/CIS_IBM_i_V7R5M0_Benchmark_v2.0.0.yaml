- id: 5.6.8
  title: (L1) System Service Tools Password Rules
  scoring: scored
  profile:
  - Level 1
  description: Specifies the rules used to check whether a password is formed correctly.
  rationale: This provides additional security by having a system in place to verify if a password meets the specified rules
    set.
  impact: ''
  references: []
  page_start: 217
  audit_raw: '• From a command line type DSPSSTSECA and press Enter

    • Verify the following Password Rules are set:

    1. Limit profile name is *YES

    2. Hours to block password change is 24

    3. Minimum password length is 14

    4. Maximum password length is 128

    5. Use characters from three groups is *YES

    6. Minimum digits is 1

    7. Limit adjacent digits is *NO

    8. Limit digit first position is *NO

    9. Limit digit last position is *NO

    10. Limit adjacent special characters is *NO

    11. Limit special character first position is *NO

    12. Limit special character last position is *NO'
  remediation: 'To establish the recommended configuration, set SST Password Rules with the

    following command:

    CHGSSTSECA PWDRULES(*YES 24 14 128 *YES *NO *NO *NO 1 *NOMAX *NO *NO

    *NO *NONE *NOMAX *NO *NO *NO *NONE *NONE *NOMAX *NO *NO *NO)'
  checks:
  - type: manual_review
    info: '• From a command line type DSPSSTSECA and press Enter

      • Verify the following Password Rules are set:

      1. Limit profile name is *YES

      2. Hours to block password change is 24

      3. Minimum password length is 14

      4. Maximum password length is 128

      5. Use characters from three groups is *YES

      6. Minimum digits is 1

      7. Limit adjacent digits is *NO

      8. Limit digit first position is *NO

      9. Limit digit last position is *NO

      10. Limit adjacent special characters is *NO

      11. Limit special character first position is'
    severity: medium
