  title: (L1) Configuring SSH – server protocol 2
  scoring: scored
  profile:
  - Level 1
  description: The recommendation is to edit the /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config file and allow the SSH2
    protocol only. This is the SSH server configuration file.
  rationale: There are publicly known vulnerabilities in SSH1 protocol, because of which the SSH1 protocol was deprecated
    in early 2001. SSH2 is a complete re-write of SSH1 with additional security features. All SSH connections should communicate
    over the SSH2 protocol. There are numerous benefits of utilizing SSH2 over SSH1, including an enhanced and stronger crypto
    integrity check and support for RSA and DSA keys, rather than just RSA key support in SSH1. The recommendation is to edit
    the /QOpenSys/QIBM/UserData/SC1/OpenSSH/etc/sshd_config file and allow the SSH2 protocol only.
