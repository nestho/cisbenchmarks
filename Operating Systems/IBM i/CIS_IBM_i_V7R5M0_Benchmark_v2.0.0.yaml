- id: 5.2.5
  title: (L1) NFS Shares
  scoring: scored
  profile:
  - Level 1
  description: The Network File System (NFS) provides the user with access to data and objects that are stored on a remote
    NFS server. In addition, any file system mounted locally through the Network File System will have the features, characteristics,
    limitations, and dependencies of the directory or file system it was mounted from on the remote server. Operations on
    mounted file systems are not performed locally. Requests flow through the connection to the server and must obey the requirements
    and restrictions of the type of file system on the server.
  rationale: NFS anonymous shares present an unauthenticated access vulnerability. Unauthenticated access of a system can
    be carried out by malicious attackers to gain access to sensitive information anonymously with no accountability for actions
    performed. This may include privilege escalation that can increase the scope of the attack and scale of access to impact
    the Confidentiality, Integrity, and Availability of the entire system and/or critical components, which may result in
    serious consequences.
