- id: 5.1.2.19
  title: (L2) Set Password Level
  scoring: scored
  profile:
  - Level 2
  description: Determines the length of password that is supported as well as removing weak and deprecated NTLM passwords
    for Windows 95/98/ME clients from the system. User passwords with a length of 1-128 characters are supported and exclude
    the use of decryptable password hashes (NTLM) for older 16 bit clients. For systems running at QPWDLVL 3, the OS uses
    a Password-based Key Derivation Function 2 (PBKDF2) with HMAC SHA512 (SHA-2 512 bit) encryption for the scheme. Note that
    NTLM or Lan Manager authentication uses a method of hashing a user's password into 14 (7+7) characters and the hash is
    calculated into the two halves separately, making it easily decryptable. NTLM was replaced by NTLMv2 in the late 1990s
    and has since been deprecated.
  rationale: This provides additional security by having options to only support passwords that meets specified length and
    security requirements.
  impact: All encrypted passwords that are used at QPWDLVL 0, 1, and 2 are removed from the system when QPWDLVL is changed
    to 3. Changing from QPWDLVL 3 back to QPWDLVL 0 or 1 requires a change to QPWDLVL 2 before going to 0 or 1. QPWDLVL 2
    allows for the creation of the one-way encrypted password that can be used at QPWDLVL 0 or 1 as long as the length and
    syntax requirements for the password meet the QPWDLVL 0 or 1 rules.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=passwords-password-level-qpwdlvl
