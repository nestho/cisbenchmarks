controls:
- id: '4.1'
  title: (L1) User Profile (*USRPRF) Access Controls (*PUBLIC authority)
  scoring: scored
  profile:
  - Level 1
  description: 'Resource security is an important aspect of your system security and defines which users are allowed to use
    objects on the system and what operations they are allowed to perform on those objects. User profiles are a specific type
    of resource that exists as a *USRPRF object type in the system library QSYS and in many ways is similar to the UNIX/Linux
    etc/passwd or Active Directory SAM files. *USRPRF resource objects should be secured and should grant only the *USRPRF
    resource authority to itself, the owner should be QSECOFR and the *PUBLIC should have an authority of *EXCLUDE. Granting
    resource authorities to *USRPRF objects in system library QSYS creates a vulnerability that allows an ad-hoc swap with
    the *USRPRF resource without requiring a password or credentials by those authorized and will inherit privileges and authorities
    that may elevate the scope of the original user''s access resulting in an exploitable vulnerability. *PUBLIC authority
    to all user profiles should be *EXCLUDE, and where necessary, application profile swaps should be programmatically performed
    securely using the IBM i swap APIs similar to how UNIX setUID and setGID bits function. By design as shipped, the IBM
    i provides only the following three *USRPRF objects with a *PUBLIC authority greater than *EXCLUDE to allow printing and
    database functions: QDBSHR QDBSHRDO QTMPLPD'
  rationale: Granting *PUBLIC authority of *USE or greater to any *USRPRF object allows an attacker to swap with these profiles
    and use their privileges and authorizations without their passwords or credentials outside of designed application access
    requirements from a system command line and from remote facilities like remote command, ODBC, etc. *PUBLIC refers to all
    authenticated users. A user defined authority (USER DEF) including a minimum of Read authority allows others to display
    *ALL attributes of a profile including object ownership and authorities. Granting the *PUBLIC authority to any profile
    other than QDBSHR, QDBSHRDO and QTMPLPD is a security risk and may lead to privilege escalation whereby a user may increase
    the scope and scale of their access permissions that impacts the Confidentiality, Integrity, and Availability the entire
    system and/or critical components with serious consequences. Note that the three IBM profiles that grant the public and
    authority that is not exclude (QDBSHR QDBSHRDO QTMPLPD) have less than *USE so cannot be swapped to. Also, QDBSHR and
    QDBSHRDO are prevented from being swapped to by internal checks (can’t do a Get Profile Handle). Authorities to these
    three profiles should never be changed.
  impact: Functions involving profile swaps may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=ssw_ibm_i_75/cl/crtusrprf.htm
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  page_start: 28
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT ALL

    SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH

    FROM QSYS2/OBJ_PRIV T01

    WHERE OBJTYPE = ''*USRPRF''

    AND SYS_ONAME NOT IN (''QDBSHR'', ''QDBSHRDO'', ''QTMPLPD'')

    AND USER_NAME = ''*PUBLIC''

    AND OBJ_AUTH <> ''*EXCLUDE''

    • Verify that the display returns no *PUBLIC authorized objects.'
  remediation: 'To establish the recommended configuration, change any *USRPRF objects identified

    in the audit to the default shipped and creation value *EXCLUDE to secure all user

    profiles from malicious use.

    GRTOBJAUT OBJ(<xxxxxx>) OBJTYPE(*USRPRF) USER(*PUBLIC) AUT(*EXCLUDE)

    REPLACE(*YES)'
  checks:
  - type: manual_review
    info: '• On a command line, type STRSQL and press Enter

      • Copy or type the following SQL statement to the terminal and press Enter.

      SELECT ALL

      SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH

      FROM QSYS2/OBJ_PRIV T01

      WHERE OBJTYPE = ''*USRPRF''

      AND SYS_ONAME NOT IN (''QDBSHR'', ''QDBSHRDO'', ''QTMPLPD'')

      AND USER_NAME = ''*PUBLIC''

      AND OBJ_AUTH <> ''*EXCLUDE''

      • Verify that the display returns no *PUBLIC authorized objects.'
    severity: medium
- id: '4.2'
  title: (L1) User Profile (*USRPRF) Access Controls (Private authority)
  scoring: scored
  profile:
  - Level 1
  description: Resource security is an important aspect of your system security and defines which users are allowed to use
    objects on the system and what operations they are allowed to perform on those objects. User profiles are a specific type
    of resource that exists as a *USRPRF object type in the system library QSYS and in many ways is similar to the UNIX/Linux
    etc/passwd or Active Directory SAM files. *USRPRF resource objects should be secured and should grant only the *USRPRF
    resource authority to itself, the owner should be QSECOFR, the *PUBLIC should have an authority of *EXCLUDE and no other
    private should exist. The one exception is that group profiles shall grant a User Defined (USER DEF) authority to all
    group members and no other private authorities shall exist other than the group members. Granting resource authorities
    to *USRPRF objects in system library QSYS creates a vulnerability that allows an ad-hoc swap with the *USRPRF resource
    without requiring a password or credentials by those authorized and will inherit privileges and authorities that may elevate
    the scope of the original user's access resulting in an exploitable vulnerability. No private authorities should exist,
    and where necessary, application profile swaps should be programmatically performed securely using the IBM i swap APIs
    similar to how UNIX setUID and setGID bits function. All Private authorities to all user profiles other than the owner’s
    and the profile itself should be removed.
  rationale: Granting a private authority of *USE or greater to any *USRPRF object allows an attacker to swap with these profiles
    and use their privileges and authorizations without their passwords or credentials outside of designed application access
    requirements from a system command line and from remote facilities like remote command, ODBC, etc. A user defined authority
    (USER DEF) including a minimum of Read authority allows others to display *ALL attributes of a profile including object
    ownership and authorities. Granting a private authority to any profile is a security risk and may lead to privilege escalation
    whereby a user may increase the scope and scale of their access permissions that impacts the Confidentiality, Integrity,
    and Availability the entire system and/or critical components with serious consequences.
  impact: Functions involving profile swaps may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=ssw_ibm_i_75/cl/crtusrprf.htm
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  page_start: 31
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH

    FROM QSYS2/OBJ_PRIV LEFT OUTER JOIN QSYS2/GROUPLIST

    ON SYS_ONAME = GROUPNAME

    WHERE OBJTYPE = ''*USRPRF''

    AND SYS_ONAME <> USER_NAME

    AND USER_NAME <> OWNER

    AND USER_NAME <> ''*PUBLIC''

    AND USERNAME IS NULL

    AND SYS_ONAME CONCAT USER_NAME NOT IN

    (''QGATEQSNADS'', ''QMQMQMQMADM'', ''QMSFQTCP'',

    ''QSPLJOBQSPL'', ''QTCPQMSF'', ''QTMHHTTPQCLUSTER'')

    • Verify that the display returns no privately authorized objects.

    • SYSTEM_OBJECT_NAME is the *USRPRF object that is privately authorized to the

    USER_NAME profile.

    The one exception is that group profiles shall grant a User Defined (USER DEF)

    authority to all group members and no other private authorities shall exist other than the

    group members.

    Ensure that the group members do not have more authority than was given by the

    system – USER DEF = *OBJOPR, *OBJMGT, *READ, *ADD, *UPD, and *DLT. Do not

    give the members of the group *EXECUTE so the members of the group do not have

    *USE authority to the group profile which would allow all members to swap to the group

    profile. The following SQL should be run to ensure that no group members have more

    authority than was given by the system.

    • On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT

    SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH,

    OBJEXIST, OBJALTER, OBJREF

    FROM QSYS2/OBJ_PRIV LEFT OUTER JOIN

    QSYS2/GROUPLIST

    ON SYS_ONAME = GROUPNAME

    WHERE OBJTYPE = ''*USRPRF''

    AND SYS_ONAME <> USER_NAME

    AND USER_NAME <> OWNER

    AND USER_NAME <> ''*PUBLIC''

    AND USER_NAME = USERNAME

    AND OBJEXIST CONCAT OBJALTER CONCAT OBJREF <> ''NONONO'''
  remediation: 'To establish the recommended configuration, change any *USRPRF

    (SYSTEM_OBJECT NAME) objects identified in the audit to the default shipped and

    creation value *EXCLUDE to secure all user profiles from malicious use.

    RVKOBJAUT OBJ(<xxxxxx>) OBJTYPE(*USRPRF) USER(<xxxxxx>) AUT(*ALL)

    • Note: Replace xxxxxx for OBJ(<xxxxxx>) with the SYSTEM_OBJECT_NAME from the

    audit

    • Replace xxxxxx for USER(<xxxxxx>) with the USER_NAME from the audit'
  checks:
  - type: sql
    command: SELECT SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH
    severity: medium
    info: '• On a command line, type STRSQL and press Enter

      • Copy or type the following SQL statement to the terminal and press Enter.

      SELECT SYS_ONAME, OBJTYPE, USER_NAME, OBJ_AUTH

      FROM QSYS2/OBJ_PRIV LEFT OUTER JOIN QSYS2/GROUPLIST

      ON SYS_ONAME = GROUPNAME

      WHERE OBJTYPE = ''*USRPRF''

      AND SYS_ONAME <> USER_NAME

      AND USER_NAME <> OWNER

      AND USER_NAME <> ''*PUBLIC''

      AND USERNAME IS NULL

      AND SYS_ONAME CONCAT USER_N'
- id: '4.3'
  title: (L1) User Profile (*USRPRF) Object Ownership
  scoring: scored
  profile:
  - Level 1
  description: 'Resource security is an important aspect of your system security and defines which users are allowed to use
    objects on the system and what operations they are allowed to perform on those objects. User profiles are a specific type
    of resource that exists as a *USRPRF object type in the system library QSYS and in many ways is similar to the UNIX/Linux
    etc/passwd or Active Directory SAM files. *USRPRF resource objects should be secured and should grant only the *USRPRF
    resource authority to itself, the owner should be QSECOFR and the *PUBLIC should have an authority of *EXCLUDE. Granting
    resource authorities to *USRPRF objects in system library QSYS creates a vulnerability that allows an ad-hoc swap with
    the *USRPRF resource without requiring a password or credentials by those authorized and will inherit privileges and authorities
    that may elevate the scope of the original user''s access resulting in an exploitable vulnerability. QSECOFR should be
    the owner of all profiles and new profile ownership can be automated through an exit program registered to the QIBM_QSY_CRT_PROFILE
    exit point. This follows the same security design of UNIX/Linux where the etc/passwd file is owned by root and the Active
    Directory SAM file is owned by the system profile. All IBM Supplied Profiles shall be owned by QSYS with the following
    exceptions: • QFAXMSF shall be owned by QAUTPROF • QRDARS400xx shall be owned by QRDARS400 • QTIVOLI, QTIVROOT and QTIVUSER
    shall be owned by QTIVOLI Non-IBM (user created) profiles shall be owned by QSECOFR.'
  rationale: Granting group or private ownership to any *USRPRF object allows an attacker to swap with these profiles and
    use their privileges and authorizations without their passwords or credentials outside of designed application access
    requirements from a system command line and from remote facilities like remote command, ODBC, etc. Group or private ownership
    of any *USRPRF resource in library QSYS is a security risk and may lead to privilege escalation whereby a user may increase
    the scope and scale of their access permissions that impacts the Confidentiality, Integrity, and Availability the entire
    system and/or critical components with serious consequences. A secure password reset/change program can swap securely
    with the owner QSECOFR to provide and validate all password/parameter settings and limit access [in accordance with /
    under] the Principle of Least Privilege (PoLP).
  impact: Functions involving profile swaps may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=reference-resource-security
  page_start: 35
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT ALL SYS_ONAME, OBJTYPE, OWNER FROM QSYS2/OBJ_PRIV

    WHERE OBJTYPE = ''*USRPRF'' AND USER_NAME = ''*PUBLIC''

    AND OWNER NOT IN (''QSECOFR'', ''QSYS'')

    • Verify that the display returns no ownership anomalies with the following valid

    exceptions.

    • QFAXMSF shall be owned by QAUTPROF

    • QRDARS400<x> shall be owned by QRDARS400

    • QTIVOLI, QTIVROOT and QTIVUSER shall be owned by QTIVOLI'
  remediation: 'To establish the recommended configuration, change the owner of all non-IBM supplied

    *USRPRF objects to QSECOFR:

    CHGOBJOWN OBJ(<xxxxxx>) OBJTYPE(*USRPRF) NEWOWN(QSECOFR)

    CUROWNAUT(*REVOKE)'
  checks:
  - type: sql
    command: SELECT ALL SYS_ONAME, OBJTYPE, OWNER FROM QSYS2/OBJ_PRIV
    severity: medium
    info: '• On a command line, type STRSQL and press Enter

      • Copy or type the following SQL statement to the terminal and press Enter.

      SELECT ALL SYS_ONAME, OBJTYPE, OWNER FROM QSYS2/OBJ_PRIV

      WHERE OBJTYPE = ''*USRPRF'' AND USER_NAME = ''*PUBLIC''

      AND OWNER NOT IN (''QSECOFR'', ''QSYS'')

      • Verify that the display returns no ownership anomalies with the following valid

      exceptions.

      • QFAXMSF shall be owned by QAUTPRO'
- id: '4.4'
  title: (L1) Administrative Special Authorities
  scoring: scored
  profile:
  - Level 1
  description: Special authority is used to specify the types of actions a user can perform on system resources. A system
    administrator can be given one or more special authorities directly or through a group. System administrators should be
    granted administrative special authorities commensurate with their job roles. Separation of duties addresses the potential
    for abuse of authorized privileges and helps to reduce the risk of malevolent activity without collusion. Separation of
    duties includes dividing mission or business functions and support functions among different individuals or roles, conducting
    system support functions with different individuals, and ensuring that security personnel who administer access control
    functions do not also administer audit functions. Because separation of duty violations can span systems and application
    domains, organizations consider the entirety of systems and system components when developing policy on separation of
    duties. Employ the principle of least privilege, allowing only authorized accesses for users (or processes acting on behalf
    of users) that are necessary to accomplish assigned organizational tasks.
  rationale: Special authorities should be granted to administrators based on the Special authority (SPCAUT) parameter in
    the user profile. Based on the Principle of Least Privilege (PoLP), administrative privileges (special authorities) should
    be controlled, limited and monitored and non-administrative users should have no administrative special authority (SPCAUT
    = *NONE). Granting any of the eight administrative special authorities must be done in consideration with the Principle
    of Least Privilege (PoLP) as defined by the NIST and regulatory compliance requirements. Granting special authorities
    greater than the Principle of Least Privilege (PoLP) can allow privilege escalation, which is the process by which a user
    with limited access to IT systems can increase the scope and scale of their access permissions to impact the Confidentiality,
    Integrity, and Availability the entire system and/or critical components with serious consequences.
  impact: Administrator functions performed with administrator special authorities may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=fields-special-authority
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  page_start: 38
  audit_raw: 'PRTUSRPRF SELECT(*SPCAUT) SPCAUT(*ALL)

    Type WRKSPLF and locate your spool file with the name QPSECUSR and User Data

    PRTUSRPRF. View the spool file output to ensure that all administrators listed with

    Special Authorities have the least privileges commensurate with their administrative job

    roles. Note that administrative Special Authorities are cumulative from User Profile and

    Group Profiles.

    IBM supplied user profiles will appear in the report and should be excluded from the

    audit. A list of IBM supplied user profiles can be obtained from the references below.'
  remediation: 'Special authority is a type of authority a user can have to perform system functions,

    including all object authority, save system authority, job control authority, security

    administrator authority, spool control authority, service authority, and system

    configuration authority.

    To establish the recommended configuration, lower all administrators to the special

    authorities commensurate with their job roles.

    CHGUSRPRF USRPRF(<xxxxxx>) SPCAUT(<xxxxxx>)

    Change all non-administrative *USER class users and groups to SPCAUT = *NONE:

    CHGUSRPRF USRPRF(<xxxxxx>) SPCAUT(*NONE)'
  checks:
  - type: manual_review
    info: 'PRTUSRPRF SELECT(*SPCAUT) SPCAUT(*ALL)

      Type WRKSPLF and locate your spool file with the name QPSECUSR and User Data

      PRTUSRPRF. View the spool file output to ensure that all administrators listed with

      Special Authorities have the least privileges commensurate with their administrative job

      roles. Note that administrative Special Authorities are cumulative from User Profile and

      Group Profiles.

      IBM supplied user profiles will appear in the report and should be excluded from the

      audit. A list of IBM '
    severity: medium
- id: '4.5'
  title: (L1) User Profile Action Auditing
  scoring: scored
  profile:
  - Level 1
  description: 'This subcategory reports when a user account or service uses a sensitive privilege. A sensitive privilege
    includes the following user rights: • Act as part of the operating system or access system and other sensitive objects
    • Back up objects, files and directories • Restore objects, files and directories • Take ownership of files or other objects
    • Create, change and delete user profiles • Change priority or end and control system and other user’s jobs and spooled
    files. • Start System Service Tools, debug programs and perform or alter service functions • Trace communications and
    jobs • Change, view and control system and resource auditing • Change how the system and communications are configured
    Actions of administrative special authorities allow auditors to monitor actions taken by administrators.'
  rationale: Auditing these events may be useful when investigating a security incident. The CHGUSRAUD (Change User Audit)
    command allows a user with audit (*AUDIT) special authority to set up or change auditing for a user. The system value
    QAUDCTL controls turning auditing on and off. The auditing attributes of a user profile can be displayed with the Display
    User Profile (DSPUSRPRF) command.
  impact: If no audit settings are configured, or if audit settings are too lax in your organization, security incidents might
    not be detected or not enough evidence will be available for network forensic analysis after security incidents occur.
    However, if audit settings are too severe, critically important entries in the Security log may be obscured by all of
    the entries and computer performance and the available amount of data storage may be seriously affected. Companies that
    operate in certain regulated industries may have legal obligations to log certain events or activities.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=fields-special-authority
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  page_start: 41
  audit_raw: 'PRTUSRPRF SELECT(*SPCAUT) SPCAUT(*ALL)

    Type WRKSPLF to locate your spool file with the name QPSECUSR and User Data

    PRTUSRPRF. View spool file output and use the DSPUSRPRF command to ensure

    that all administrators with special authorities have an action auditing value of *CMD.

    Note that administrative Special Authorities are cumulative from User Profile and Group

    Profiles.

    IBM supplied user profiles with the exception of QSECOFR should be excluded from the

    audit. A list of IBM supplied user profiles can be obtained from the references below.

    1. Type DSPUSRPRF For each of the users in the report and examine the action

    auditing value to ensure that *CMD action auditing is specified.

    2. DSPUSRPRF USRPRF(<xxxxxx>) TYPE(*BASIC)'
  remediation: 'To establish the recommended configuration, change the action auditing value of all

    administrative special authority users to include *CMD action auditing:

    CHGUSRAUD USRPRF(<xxxxxx>) AUDLVL(*CMD)'
  checks:
  - type: manual_review
    info: 'PRTUSRPRF SELECT(*SPCAUT) SPCAUT(*ALL)

      Type WRKSPLF to locate your spool file with the name QPSECUSR and User Data

      PRTUSRPRF. View spool file output and use the DSPUSRPRF command to ensure

      that all administrators with special authorities have an action auditing value of *CMD.

      Note that administrative Special Authorities are cumulative from User Profile and Group

      Profiles.

      IBM supplied user profiles with the exception of QSECOFR should be excluded from the

      audit. A list of IBM supplied user profi'
    severity: medium
- id: '4.6'
  title: (L1) Default Passwords
  scoring: scored
  profile:
  - Level 1
  description: A profile has a default password when the profile's password matches the user profile name. A change was made
    in 7.5 so that the default for the password on CRTUSRPRF is *NONE. When you create new user profiles, consider assigning
    a unique, non-trivial password instead of using a default password. Additionally, shared accounts or a common account
    shared by many different individuals provides an attack vector because actions taken by these shared profiles cannot be
    attributed to a unique account as described in NIST Special Publication 800-53.
  rationale: Default passwords provide an opportunity for someone to enter your system anonymously. Default passwords are
    easy to guess. Additionally, accounts with default passwords are often used for shared (non-unique) accounts. Tell the
    new user the password confidentially, such as in a “Welcome to the System” letter that outlines your security policies.
    Require the user to change the password the first time that the user signs on by setting the user profile to PWDEXP(*YES).
  impact: Shared passwords may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=ssw_ibm_i_75/cl/anzdftpwd.htm
  page_start: 43
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT ALL

    USER_NAME, STATUS, DFTPWD, PWDEXP

    FROM QSYS2/USER_INFO T01

    WHERE DFTPWD = ''YES'''
  remediation: 'To establish the recommended configuration, change the password of all user profiles

    with default passwords to a non-trivial password and set the password to expire.

    CHGUSRPRF USRPRF(<xxxxxx>) PASSWORD(<xxxxxx>) PWDEXP(*YES)

    Additionally, the command ANZDFTPWD ACTION (*DISABLE) should be added to a

    job schedule entry to periodically scan for and *DISABLE any profiles with *DEFAULT

    passwords, and system value QPWDRULES should contain the parameters

    *ALLCRTCHG and *LMTPRFNAME to prevent the creation of profiles with *DEFAULT

    passwords.'
  checks:
  - type: manual_review
    info: '• On a command line, type STRSQL and press Enter

      • Enter the following SQL statement and press Enter.

      SELECT ALL

      USER_NAME, STATUS, DFTPWD, PWDEXP

      FROM QSYS2/USER_INFO T01

      WHERE DFTPWD = ''YES'''
    severity: medium
- id: '4.7'
  title: (L1) Inactive Profiles
  scoring: scored
  profile:
  - Level 1
  description: Remove/disable inactive user profiles within 90 days.
  rationale: Accounts that are not used regularly are often targets of attack since it is less likely that any changes (such
    as a changed password) will be noticed. As such, these accounts may be more easily exploited and used to access sensitive
    data.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=sup-supplied-user-profiles
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=ssw_ibm_i_75/cl/anzprfact.htm
  page_start: 45
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT

    USER_NAME, STATUS, LASTUSED, TIMESTAMP

    FROM QSYS2/USER_INFO T01

    WHERE STATUS = ''*ENABLED''

    AND LASTUSED <= ''yyyy-mm-dd''

    AND TIMESTAMP <= ''yyyy-mm-dd''

    OR STATUS = ''*ENABLED''

    AND TIMESTAMP <= ''yyyy-mm-dd''

    AND LASTUSED IS NULL

    Note: In the above SQL, enter the calendar date equal to 90 days prior to the audit or

    that of your inactive profile policy as the LASTUED date in the format yyyy-mm-dd. The

    date needs to be entered in ''yyyy-mm-dd'' format enclosed in single '' marks as in the

    following example:

    LASTUSED <= ''2020-01-01''

    TIMESTAMP < = ''2020-01-01''

    Note: Also enter the calendar date equal to a creation date equal to 90 days prior to the

    audit as the TIMESTAMP date in the format yyyy-mm-dd to ensure that recently created

    but not used profiles are not included in the analysis.

    IBM supplied user profiles will appear in the report and should be excluded from the

    audit. A list of IBM supplied user profiles can be obtained from the references below.'
  remediation: 'To establish the recommended configuration, remove/disable all inactive profiles

    displayed.

    CHGUSRPRF USRPRF(<xxxxxx>) STATUS(*DISABLED)

    Optional (recommended) on a regular basis such as 30-90 days after inactive profiles

    have been *DISABLED, they should be archived and removed.

    DLTUSRPRF USRPRF(<xxxxxx>)

    Note that when removing user profiles, there needs to be consideration of changing

    ownership of the objects they own.'
  checks:
  - type: sql
    command: 'SELECT

      USER_NAME, STATUS, LASTUSED, TIMESTAMP'
    severity: medium
    info: '• On a command line, type STRSQL and press Enter

      • Enter the following SQL statement and press Enter.

      SELECT

      USER_NAME, STATUS, LASTUSED, TIMESTAMP

      FROM QSYS2/USER_INFO T01

      WHERE STATUS = ''*ENABLED''

      AND LASTUSED <= ''yyyy-mm-dd''

      AND TIMESTAMP <= ''yyyy-mm-dd''

      OR STATUS = ''*ENABLED''

      AND TIMESTAMP <= ''yyyy-mm-dd''

      AND LASTUSED IS NULL

      Note: In the above SQL, enter the calendar date equal to 90 days pri'
- id: '4.8'
  title: (L1) User Profile With Non-Expiring Passwords
  scoring: scored
  profile:
  - Level 1
  description: User Profiles with non-expiring passwords are never required to change their password.
  rationale: Non-expiring passwords are security risks because if no automated solution is in place, users are never prompted
    to change their passwords. Non-expiring passwords present a security risk as they may either be shared (non-unique) accounts
    or their passwords may be easy to obtain through observation of login keystrokes over an indefinite period of time.
  impact: Shared accounts may be impacted.
  references:
  - 1. https://www.cisecurity.org/insights/white-papers/cis-password-policy-guide
  page_start: 47
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Enter the following SQL statement and press Enter.

    SELECT ALL

    USER_NAME, STATUS, PWDEXPITV, LASTUSED

    FROM QSYS2/USER_INFO T01

