- id: 5.6.6
  title: (L1) System Service Tools IDs and Privileges
  scoring: scored
  profile:
  - Level 1
  description: This policy setting determines the functional privileges of System Service Tool Users.
  rationale: 'All System Service Tools Users are powerful administrators. Service Tools Users should follow the same policy
    as Operating System Users. • Each Service Tool User should be unique (no shared passwords) • Each Service Tool User should
    follow the Principle of Least Privilege to perform their job role • Inactive Service Tool Users should be disabled/removed.
    • IBM provides the following service tools User IDs: o QSECOFR o QSRV'
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=ids-recommendations-managingservice-tools-user
  page_start: 214
  audit_raw: '1. Type DSPSSTUSR and press Enter.

    2. Review the screen output information with your system administrator and ensure

    that all SST users have unique profiles. Do not use the shipped IBM User IDs.

    3. Ensure that all Service Tools IDs have the proper functional privileges for their

    job roles.'
  remediation: 'Disable/Remove default and inactive IDs and ensure that each ID has the required

    privileges.

    Ensure that each unique SST ID has privileges commensurate with the Principle of

    Least Privilege for each unique job role.'
  checks:
  - type: manual_review
    info: '1. Type DSPSSTUSR and press Enter.

      2. Review the screen output information with your system administrator and ensure

      that all SST users have unique profiles. Do not use the shipped IBM User IDs.

      3. Ensure that all Service Tools IDs have the proper functional privileges for their

      job roles.'
    severity: medium
