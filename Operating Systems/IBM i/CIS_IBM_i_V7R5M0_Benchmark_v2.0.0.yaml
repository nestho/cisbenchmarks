- id: 5.2.7
  title: (L1) Exit Points
  scoring: scored
  profile:
  - Level 1
  description: The IBM i provides several host servers and related objects that are common for the IBM® i Access family. For
    each Host server, IBM provides one or more exit points to control the activity of the host server. The registration facility
    (WRKREGINF) shows information about IBM® i exit points and their associated exit programs. Exit points provide an additional
    layer of network defense but are not a replacement for object and resource security covered in Chapter 5 of the IBM i
    Security Reference and IBM i online documentation. Some shipped services such as SSH, SFTP and others, user defined and
    3rd party ports and services do not have protocol specific host server exit points. Network security for these ports and
    services can be controlled with Socket Server Exit Points and/or IP Packet Filtering.
  rationale: Lack of registered exit point security may leave your system open to remote network attacks through ODBC, remote
    command, FTP etc. Exit points are an added layer of monitoring and security but are not a replacement for IBM i resource
    and access controls.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=security-securing-your-workstations
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=security-using-exit-programs
