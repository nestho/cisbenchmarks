  scoring: scored
  profile:
  - Level 1
  description: Determines the length of password that is supported as well as removing weak and deprecated NTLM passwords
    for Windows 95/98/ME clients from the system. User passwords with a length of 1-10 characters are supported and excludes
    the use of decryptable password hashes (NTLM) for older 16 bit clients. Note that NTLM or Lan Manager authentication uses
    a method of hashing a user's password into 14 (7+7) characters and the hash is calculated into the two halves separately,
    making it easily decryptable. NTLM was replaced by NTLMv2 in the late 1990s and has since been deprecated.
  rationale: This provides additional security by having options to only support passwords that meet specified length and
    security requirements.
  impact: ''
  references:
