    Verify that the Service tools Allow add of digital certificates is set to *NO'
  remediation: 'To change the service tools Allow add of digital certificates value.

    CHGSSTSECA REQUSRID(<xxxxxx>) REQPWD(<xxxxxx>) ADDDIGCERT(*NO)'
  checks:
  - type: manual_review
    info: 'On a command line type DSPSSTSECA and press ENTER

