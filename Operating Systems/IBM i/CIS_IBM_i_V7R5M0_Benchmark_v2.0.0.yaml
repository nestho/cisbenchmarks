- id: 5.6.1
  title: (L1) System Service Tools Password Expiration Interval
  scoring: scored
  profile:
  - Level 1
  description: 'Numerous studies had found that excessive password expiration requirements do more harm than good, because
    these requirements make users select predictable passwords, composed of sequential words and numbers that are closely
    related to each other. Instead, longer passphrases that do not expire frequently promote better composition, strength,
    and create better secrets that are harder to crack. Immediate password changes should be based on key events including,
    but not limited to: • Indication of compromise • Change of user roles • When a user leaves the organization NOTE: Longer
    password expiry intervals should only be implemented in conjunction with a longer password/passphrase minimum length of
    14 characters.'
  rationale: This helps to prevent access to unauthorized persons by promoting longer passphrases that are more difficult
    to crack.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=policies-changing-service-tools-systempassword-expiration-interval
  - 2. https://www.cisecurity.org/insights/white-papers/cis-password-policy-guide
  page_start: 208
  audit_raw: 'On a command line type DSPSSTSECA and press ENTER

