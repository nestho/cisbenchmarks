- id: 5.1.2.26
  title: (L2) Set Verify Object On Restore
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: 'Determines when signatures will be verified and if the object will be restored without a valid signature.
    (See also QALWOBJRST & QFRCCVNRST, 2.1.2.1 and 2.1.2.10) The JOBACN network attribute determines how the system processes
    incoming requests to run jobs. The values for JOBACN are: • *FILE: The input stream is filed in the queue of network files
    for the recipient. An authorized user may then view, delete, receive, or submit the job stream. • *SEARCH: The table of
    network job entries is searched to determine the action to take for the input job stream. • *REJECT: The input job stream
    is rejected by the system. This allows the target to secure itself from input streams received through the network. The
    JOBACN value should be set to *REJECT to secure your system from job streams received through the network.'
  rationale: You can prevent anyone from restoring an object, unless that object has a correct digital signature from a trusted
    software provider. Incoming job streams from remote systems do not authenticate remote credentials (passwords) and thus
    present an unauthenticated access vulnerability. A value of *FILE files the remote job on a local users queue of network
    files where they may or may not choose to submit the job without viewing the contents of the job stream. A value of *SEARCH
    searches the table of network job entries to determine the action to take which may file, reject or automatically submit
    the job where the target system's network job entries will specify a user profile under which the job will run. For example,
    distribution directory update jobs could run under a user with administration rights. System operations, such as shutdown
    or network activation/deactivation, could run under a powerful system profile. Setting the value of the JOBACN to any
    value other than *REJECT makes the local system's security dependent on remote systems where security may be less certain,
    making the local system vulnerable to an unauthenticated network attack. Unauthenticated access of a system can be carried
    out by malicious attackers to gain access to sensitive information anonymously with no accountability for actions performed.
    This may include privilege escalation that can increase the scope of the attack and scale of access to impact the Confidentiality,
    Integrity, and Availability of the entire system and/or critical components, which may result in serious consequences.
  impact: When your system is shipped, the QVFYOBJRST system value is set to 3. If you change the value of QVFYOBJRST, it
    is important to set the QVFYOBJRST value to 3 or lower before installing a new release of the IBM i operating system.
    Changing Network Attribute JOBACN to *REJECT may disable SNA network job streams from entering your system without proper
    credentialed authentication.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=values-verify-object-restore-qvfyobjrst
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=40-preventing-use-unsupportedinterfaces
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=attributes-job-action-jobacn-networkattribute
  page_start: 144
  audit_raw: 'DSPSYSVAL SYSVAL(QVFYOBJRST)

    • On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT JOB_ACTION FROM QSYS2/NET_ATTR

    Verify that the value for Job action is set to *REJECT.'
  remediation: 'To establish the recommended configuration, set the following system value to "5":

    QVFYOBJRST

    CHGSYSVAL SYSVAL(QVFYOBJRST) VALUE(''5'')

    To establish the recommended configuration, change the Network Attribute JOBACN to

    *REJECT:

    CHGNETA JOBACN(*REJECT)'
  checks:
  - type: sql
    command: SELECT JOB_ACTION FROM QSYS2/NET_ATTR
    severity: medium
    info: 'DSPSYSVAL SYSVAL(QVFYOBJRST)

      • On a command line, type STRSQL and press Enter

      • Copy or type the following SQL statement to the terminal and press Enter.

      SELECT JOB_ACTION FROM QSYS2/NET_ATTR

      Verify that the value for Job action is set to *REJECT.'
