- id: 5.2.8
  title: (L1) Function Usage
  scoring: scored
  profile:
  - Level 1
  description: You need to set up security for every person who will be authorized to use your system. User security setup
    involves installing application libraries and setting up user groups and profiles. Several tasks are necessary to set
    up user security on your system by using the command line interface. Setting up Function Usage security is one of the
    steps involved in setting up user security. The Work with Function Usage (WRKFCNUSG) command shows a list of function
    identifiers and allows you to change or display specified functions that determine whether a user can use the function
    if they or one of their groups do not have a specific usage setting. The system administrator specifies who is allowed
    or denied access to a function. You should allow only authorized users access to network and required functions and limit
    administrators in accordance with the Principle of Least Privilege (PoLP).
  rationale: Limiting users access to security related functions provides an additional layer of defense. Access to powerful
    administrative functions should be limited in accordance with the Principle of Least Privilege (PoLP).
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=strategy-setting-up-user-security
