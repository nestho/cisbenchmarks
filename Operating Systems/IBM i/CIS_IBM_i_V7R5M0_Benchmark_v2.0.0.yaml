- id: '4.12'
  title: (L1) Implement Multi-factor authentication (MFA)
  scoring: manual
  profile:
  - Level 1
  description: 'Multi-factor authentication (MFA) is a layered approach to securing physical and logical access where a system
    requires a user to present a combination of two or more different authenticators to verify a user’s identity for login.
    MFA increases security because even if one authenticator becomes compromised, unauthorized users will be unable to meet
    the second authentication requirement and will not be able to access the targeted physical space or computer system. MFA
    requires users to present two or more authentication factors at login to verify their identity before they are granted
    access using some combination of the following: • Something you know: like a password or Personal Identification Number
    (PIN) • Something you have: like a smart card, mobile token, or hardware token • Some form of biometric factor (e.g.,
    fingerprint, palm print, or voice recognition)'
  rationale: Adversaries are increasingly capable of guessing or harvesting passwords to gain illicit access. Password cracking
    techniques are becoming more sophisticated and highpowered computing is increasingly affordable. In addition, adversaries
    harvest credentials through phishing emails or by identifying passwords reused from other systems. MFA adds a strong protection
    against account takeover by greatly increasing the level of difficulty for adversaries. An effective MFA solution requires
    a unique account/password combination and should not include shared accounts or default passwords.
  impact: ''
  references:
  - 1. https://www.linkedin.com/pulse/microsoft-phishing-bypassed-mfa-attacksagainst-10000-moriah-hara
  - 2. https://duo.com/blog/mfa-fatigue-what-is-it-how-to-respond
  page_start: 57
  audit_raw: 'IBM and third-party vendors provide MFA solutions for IBM i, and organizations often

    choose to buy and implement one of these solutions or develop an in-house MFA

    solution. The business should provide implementation details from the vendor or inhouse solution to provide an adequate
    audit procedure.'
  remediation: Evaluate 3rd party MFA solutions available from various vendors or develop an inhouse MFA solution.
  checks:
  - type: manual_review
    info: 'IBM and third-party vendors provide MFA solutions for IBM i, and organizations often

      choose to buy and implement one of these solutions or develop an in-house MFA

      solution. The business should provide implementation details from the vendor or inhouse solution to provide an adequate
      audit procedure.'
    severity: medium
