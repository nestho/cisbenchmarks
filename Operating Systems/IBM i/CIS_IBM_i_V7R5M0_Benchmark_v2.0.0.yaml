- id: 5.2.3
  title: (L1) DDM TCP/IP Attributes
  scoring: scored
  profile:
  - Level 1
  description: 'The default setting for the DDM server has a default security of *USRIDPWD which allows clear-text password.
    Allowing the use of clear-text passwords permits credentials to be intercepted over the network by sniffers, packet monitoring
    and communication trace tools which could easily lead to unauthorized access to system resources. A setting lower than
    *USRIDPWD including values of *YES, *VLDONLY or *USRID does not require a password on a DDM Connection request allowing
    un-authenticated access to system resources possibly with elevated privileges. Additionally, to encrypt sensitive data
    in transit, ensure that all *IP Type Relational Data Base Directory Entries specify Secure Connection (SECCNN) *SSL. See
    the following link for additional information: https://www.ibm.com/support/pages/ddm-drda-ssl-connectivity'
  rationale: Not requiring a password for DDM/DRDA conversations presents an unauthenticated access vulnerability. Unauthenticated
    access of a system can be carried out by malicious attackers to gain access to sensitive information anonymously with
    no accountability for actions performed. This may include privilege escalation that can increase the scope of the attack
    and scale of access to impact the Confidentiality, Integrity, and Availability of the entire system and/or critical components,
    which may result in serious consequences.
  impact: DDM/DRDA communications not using encrypted passwords may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=security-elements-in-tcpip-network
  - 2. https://www.ibm.com/support/pages/ddm-drda-ssl-connectivity
  page_start: 150
  audit_raw: '• On a command line, type STRSQL and press Enter

    • Copy or type the following SQL statement to the terminal and press Enter.

    SELECT

    CASE

    WHEN LAND(DBXRSEC,X''E0'') = X''00'' THEN ''*USRID''

    WHEN LAND(DBXRSEC,X''E0'') = X''20'' THEN ''*VLDONLY''

    WHEN LAND(DBXRSEC,X''E0'') = X''40'' THEN ''*USRIDPWD''

    WHEN LAND(DBXRSEC,X''E0'') = X''C0'' THEN ''*USRENCPWD''

    WHEN LAND(DBXRSEC,X''E0'') = X''80'' THEN ''*ENCUSRPWD''

    WHEN LAND(DBXRSEC,X''E0'') = X''A0'' THEN ''*KERBEROS''

    ELSE ''*UNKNOWN''

    END AS LOWAUT,

    CASE WHEN LAND(DBTFLGS,X''01'') = X''01'' THEN ''*AES''

    ELSE ''*DES'' END AS LOWENC

    FROM QSYS/QADBXRDBD WHERE DBXRMTN = ''*LOCAL''

    • The screen will display the DDM TCP/IP Attributes. Ensure that the Lowest

    authentication method equals *USRENCPWD and the Lowest encryption

    algorithm is equal to *AES.'
  remediation: CHGDDMTCPA AUTOSTART(*YES) PWDRQD(*USRENCPWD) ENCALG(*AES)
  checks:
  - type: manual_review
    info: '• On a command line, type STRSQL and press Enter

      • Copy or type the following SQL statement to the terminal and press Enter.

      SELECT

      CASE

      WHEN LAND(DBXRSEC,X''E0'') = X''00'' THEN ''*USRID''

      WHEN LAND(DBXRSEC,X''E0'') = X''20'' THEN ''*VLDONLY''

      WHEN LAND(DBXRSEC,X''E0'') = X''40'' THEN ''*USRIDPWD''

      WHEN LAND(DBXRSEC,X''E0'') = X''C0'' THEN ''*USRENCPWD''

      WHEN LAND(DBXRSEC,X''E0'') = X''80'' THEN ''*ENCUSRPWD''

      WHEN LAND(DBXRSEC,X''E0'') = X''A0'' THEN ''*KERBEROS''

      ELSE ''*UNKNOWN''

      END AS LOWAUT,

      CASE WHEN LAND(DBTFLGS,X''01'') = X'''
    severity: medium
