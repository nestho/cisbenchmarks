- id: 5.3.1
  title: (L1) IBM i NetServer Guest Profile
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether a Guest account is configured. The Guest account allows unauthenticated
    network users to gain access to the system. The recommended state for this setting is: *NONE.'
  rationale: The default Guest account allows unauthenticated network users to log on as Guest with no password. These unauthorized
    users could access any resources that are accessible to the Guest account over the network. This capability means that
    any network shares with permissions that allow access to the Guest account, the Guests group, or the Everyone group will
    be accessible over the network, which could lead to the exposure or corruption of data.
  impact: Setting the IBM i NetServer Guest profile to a value of *NONE may impact users access NetServer resources with a
    shared Guest profile. Additionally, changing the IBM i NetServer Guest profile requires you to end IBM i NetServer access
    (ENDNSV) and restart IBM i NetServer access (STRNSV RESET(*YES) which may impact active sessions.
