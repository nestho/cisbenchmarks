- id: 5.3.5
  title: (L1) IBM i NetServer Shares
  scoring: scored
  profile:
  - Level 1
  description: This policy setting defines the network file shares available to authenticated users.
  rationale: Allowing an IBM i NetServer File Shares allows authenticated users to access Server Message Block (SMB) file
    shares on the system. Allowing users access to IBM i NetServer File shares grants authenticated users access to Integrated
    File System (IFS) directories. Use this link to learn more about the IFS. A file share to the root (‘/’) of the IBM i
    file system is never recommended to be configured as this would effectively give an attacker access to the root and all
    directories including qsys.lib (the operating system). Pay careful attention to your existing share permissions. It is
    highly recommended to limit shares to Read only to prevent alteration of contents and protect from increasingly harmful
    crypto/ransomware attacks which detect network shares and may indiscriminately encrypt ubiquitous file systems of all
    types including qsys.lib. Use Read/Write permissions with diligence according to business requirements. Additionally,
    the QPWFSERVER is an authorization list (object type *AUTL) that provides additional access requirements for all objects
    in the QSYS.LIB file system being accessed through remote clients. The default authority to this object is PUBLIC *USE
    authority. The administrator can use the EDTAUTL (Edit Authorization List) or WRKAUTL (Work With Authorization List) commands
    to change the value of this authority. The administrator can assign PUBLIC *EXCLUDE authority to the authorization list
    so that the *PUBLIC cannot access QSYS.LIB objects from remote clients.
  impact: Removing the root (/) file share will limit users to specific shares configured and prevent access to the root (/).
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=qsyslib-qpwfserver-authorization-list-infile-system
