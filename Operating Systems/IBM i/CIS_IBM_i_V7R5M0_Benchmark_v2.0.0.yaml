- id: 5.3.3
  title: (L1) IBM i SMB Signing
  scoring: scored
  profile:
  - Level 1
  description: SMB signing (also known as security signatures) is a security mechanism in the SMB protocol. This setting requires
    clients connecting to the IBM i NetServer to sign requests for more secure communications.
  rationale: Session hijacking uses tools that allow attackers who have access to the same network as the client or server
    to interrupt, end, or steal a session in progress. Attackers can potentially intercept and modify unsigned SMB packets
    and then modify the traffic and forward it so that the server might perform undesirable actions. Alternatively, the attacker
    could pose as the server or client after legitimate authentication and gain unauthorized access to data. SMB is the resource
    sharing protocol that is supported by many operating systems. It is the basis of NetBIOS and many other protocols. SMB
    signatures authenticate both users and the servers that host the data. If either side fails the authentication process,
    data transmission will not take place.
  impact: The network client will not communicate with a network server unless that server agrees to perform SMB packet signing.
    Implementation of SMB signing may negatively affect performance, because each packet needs to be signed and verified.
    Additionally, if you configure computers to ignore all unsigned SMB communications, older applications and operating systems
    will not be able to connect. However, if you completely disable all SMB signing, computers will be vulnerable to session
    hijacking attacks.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=netserver-i-security
  - 2. https://docs.microsoft.com/en-us/troubleshoot/windowsserver/networking/overview-server-message-block-signing
  page_start: 179
  audit_raw: '• Type ADDLIBLE NETSRVCMD

    • Type GO NETS

    • Select option 10. Display Attributes

    • Ensure that Message authentication *REQUIRED is displayed

    • Ensure that *SAME is displayed for the Message authentication Pending value to

    ensure no changes are pending.'
  remediation: 'To establish the recommended configuration, do the following:

    • Type ADDLIBLE NETSRVCMD

    • Type CHGNSVA MSGAUT(*REQUIRED)

    • Type ENDNSV

    • Type STRNSV RESET(*YES)'
  checks:
