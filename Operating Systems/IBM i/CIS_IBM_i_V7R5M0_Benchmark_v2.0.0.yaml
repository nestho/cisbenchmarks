- id: 5.2.12
  title: (L1) SMTP Mail Relay
  scoring: manual
  profile:
  - Level 1
  description: Simple Mail Transfer Protocol (SMTP) is the protocol that allows the operating system to send and receive e-mail.
    SMTP on the IBM i operating system supports the distribution of notes, messages, and ASCII text documents. An SMTP relay
    is a process of transferring an email from one server to another which if improperly configured can allow unauthenticated
    relay of email commonly used in Spam and Malware delivery.
  rationale: Spammers can connect to the server and forge sender information to send spam to legitimate users. The business
    may suffer financial as well as reputational loss through the use of a mail relay used to send spam.
  impact: All SMTP mail relay communications may be impacted.
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=concepts-smtp-i
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=ssw_ibm_i_75/cl/chgsmtpa.htm
  page_start: 171
  audit_raw: '• Type command CHGSMTPA and press F4 and then press F9 to display all

    parameters.

    • Page down one time and ensure that Allowed relayed mail is set to a value of

    *NONE.

    • Page down again and ensure that Allow authentication is not set to a value of

    *RELAY or *LCLRLY.'
  remediation: 'To establish the recommended configuration, disable mail relay for SMTP:

    CHGSMTPA ALWRLY(*NONE) ALWAUTH(*NONE)'
