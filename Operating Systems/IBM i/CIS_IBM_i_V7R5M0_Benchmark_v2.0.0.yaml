    certificate store and also allows passwords for digital certificate stores to be reset by any user with *ALLOBJ and *SECADM.
    The recommended state for this setting is: 0'
  rationale: Under normal operations, new certificates should rarely be added to the local system's *SIGNATUREVERIFICATION
    certificate store. More importantly, passwords for digital certificate stores should be secured from being reset by any
    user with *ALLOBJ and *SECADM.
  impact: ''
  references: []
