- id: '6.1'
  title: (L1) QSECOFR Profile Shall Be *DISABLED
  scoring: scored
  profile:
  - Level 1
  description: The QSECOFR profile shall be *DISABLED to prevent interactive use. You can always sign on with the QSECOFR
    profile at the console, even if the status of QSECOFR is *DISABLED.
  rationale: QSECOFR is the most powerful profile on the IBM i and is equivalent to the UNIX Root Profile. Additionally, you
    should prevent QSECOFR from interactively signing on by *DISABLING it and create unique security officer profiles as required
    by the business.
  impact: '*DISABLEing QSECOFR will prevent anonymous and un-accountable use of QSECOFR for normal operations.'
  references: []
  page_start: 220
  audit_raw: '• DSPUSRPRF USRPRF(QSECOFR)

    • Observe the Status to ensure that it is *DISABLED'
  remediation: CHGUSRPRF USRPRF(QSECOFR) STATUS(*DISABLED)
  checks:
  - type: manual_review
    info: '• DSPUSRPRF USRPRF(QSECOFR)

      • Observe the Status to ensure that it is *DISABLED'
    severity: medium
- id: '6.2'
  title: (L1) QSECOFR Shall Not be Configured as a Group Profile
  scoring: scored
  profile:
  - Level 1
  description: QSECOFR shall not be a group profile as this would allow group members to inherit root privileges from the
    shipped IBM QSECOFR profile.
  rationale: Do not use IBM profiles as groups. Instead, create your own group profiles with appropriate privileges (special
    authorities) commensurate with your job roles and the Principle of Least Privilege (PoLP).
  impact: ''
  references: []
  page_start: 221
  audit_raw: 'DSPUSRPRF USRPRF(QSECOFR) TYPE(*GRPMBR)

    Ensure that message states that "User profile QSECOFR not a group profile".'
  remediation: 'Change any QSECOFR group members to another user created group with appropriate

    privileges (special authorities) commensurate with your job roles and the Principle of

    Least Privilege (PoLP).

    • CHGUSRPRF USRPRF(<XXXXXX>) GRPPRF(<XXXXXX>)'
  checks:
  - type: manual_review
    info: 'DSPUSRPRF USRPRF(QSECOFR) TYPE(*GRPMBR)

      Ensure that message states that "User profile QSECOFR not a group profile".'
    severity: medium
