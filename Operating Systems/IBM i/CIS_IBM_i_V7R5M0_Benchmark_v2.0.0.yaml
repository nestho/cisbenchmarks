- id: 5.2.9
  title: (L1) Intrusion Detection
  scoring: manual
  profile:
  - Level 1
  description: The intrusion detection and prevention system (IDS) notifies you of attempts to hack into, disrupt, or deny
    service to the system. IDS also monitors for potential extrusions, where your system might be used as the source of the
    attack. These potential intrusions and extrusions are logged as intrusion monitor audit records in the security audit
    journal and displayed as intrusion events in the Intrusion Detection System graphical user interface (GUI). You can configure
    IDS to prevent intrusions and extrusions from occurring.
  rationale: Most intrusions follow a pattern of information gathering, attempted access, and then destructive attacks. Some
    attacks can be detected and neutralized by the target system. Other attacks cannot be effectively neutralized by the target
    system. Most of the attacks also make use of spoofed packets, which are not easily traceable to their true origin. Many
    attacks make use of unwitting accomplices, which are machines or networks that are used without authorization to hide
    the identity of the attacker. For these reasons, a vital part of intrusion detection is gathering information, and detecting
    and preventing system attacks.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=security-intrusion-detection
  page_start: 166
  audit_raw: 'Review IBM i Intrusion Detection Policies with your network security team and ensure

    that Intrusion Detection Policies are configured per your specific requirements.'
  remediation: 'To establish the recommended configuration, review Intrusion Detection in the IBM i

    Knowledge Center and Configure Intrusion Detection per your specific requirements.'
  checks:
  - type: manual_review
    info: 'Review IBM i Intrusion Detection Policies with your network security team and ensure

      that Intrusion Detection Policies are configured per your specific requirements.'
    severity: medium
