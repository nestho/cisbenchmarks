- id: 5.3.7
  title: (L1) Malware Defenses
  scoring: manual
  profile:
  - Level 1
  description: The Integrated File System (IFS) is a part of the IBM i operating system. It supports stream input/output and
    storage management similar to personal computer and UNIX operating systems. An infected file that is copied, moved, or
    saved from a PC to the IFS and then redistributed to another PC can transmit a virus to the new PC. Likewise, if a network
    drive is mapped to the IFS, a virus running on a PC (and which is capable of damaging files on a network drive) can damage
    any file stored on the IFS.
  rationale: IBM i Scanning Support and 3rd party anti-virus products may provide some protection for the IFS. To ensure objects
    on the IFS are not infected, all clients susceptible to viruses, malware, spyware, ransomware, etc, should run advanced
    Machine Learning security suite program that monitor for unauthorized activity and behavior, and quarantines infected
    objects on the PC, thus preventing the spread of infected objects to IBM i server. While even the best Machine Learning
    Endpoint Detection and Response system may not provide 100% protection against Advanced Persistent Threats including Polymorphic
    and Metamorphic malware and Ransomware as a Service, signature based anti-virus are far less capable of protecting against
    advanced malware and ransomware threats.
  impact: ''
  references:
  - 1. https://www.ibm.com/support/pages/viruses-malware-spyware-ransomware-ibmi-operating-system-and-integrated-file-system
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=concepts-scanning-support
  page_start: 188
  audit_raw: 'Evaluate your system requirements and ensure that any installed anti-virus product is

    updated and meets your organization''s requirements.'
  remediation: 'Evaluate Scanning Options and 3rd party anti-virus products to adequately protect your

    system. See information on NetServer Shares for more information. Additionally, review

    information on system values QSCANFS and QSCANFSCTL'
  checks:
  - type: manual_review
    info: 'Evaluate your system requirements and ensure that any installed anti-virus product is

      updated and meets your organization''s requirements.'
    severity: medium
