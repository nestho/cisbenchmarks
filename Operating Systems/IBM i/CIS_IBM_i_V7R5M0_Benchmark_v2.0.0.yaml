- id: 5.1.1.37
  title: (L1) Set Secure Socket Layer Security Protocols
  scoring: scored
  profile:
  - Level 1
  description: Specifies the SSL protocol versions supported by System SSL.
  rationale: Configuring your IBM i server to allow the use of weak protocols and weak cipher suites will result in your IBM
    i server potentially being at risk of a network security breach. Adding an older protocol to the default list results
    in opening up all applications that use the default list to known security vulnerabilities. The IBM i System Secure Sockets
    Layer (SSL)/Transport Layer Security (TLS) protocols and ciphers suites are managed through the interconnect of the QSSLPCL,
    QSSLCSLCTL, and QSSLCSL system values, Digital Certificate Manager application definitions, and the SSLCONFIG/TLSCONFIG
    IBM i System Service Tools (SST) Advanced Analysis (AA) Command. When configuring your IBM i System SSL/TLS protocols
    and cipher suites, it is not always required to change your existing configuration. In some cases, only your SSL/TLS protocol
    configuration needs to be changed. In reverse, some cases will only require you to change your SSL/TLS cipher suite configuration.
    IBM recommends you carefully consider your SSL/TLS protocol and cipher suite requirements before making any changes.
  impact: ''
