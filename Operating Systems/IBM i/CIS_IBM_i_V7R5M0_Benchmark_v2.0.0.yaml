- id: 5.2.6
  title: (L2) NFS Shares
  scoring: scored
  profile:
  - Level 2
  description: Disable NFS completely or force NFSv4 with Kerberos. NFS in general with AUTH_SYS security is not considered
    a secure protocol. If NFS is used in a L2 environment, NFSv4 should be the only protocol version allowed and RPCSEC_GSS
    authentication with Kerberos should be required.
  rationale: With the RPCSEC_GSS Kerberos mechanism, the server no longer depends on the client to correctly represent which
    user is accessing the file, as is the case with AUTH_SYS. Instead, it uses cryptography to authenticate users to the server,
    preventing a malicious client from impersonating a user without having that user's Kerberos credentials.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/i/7.5?topic=security-network-file-system-nfs
  - 2. https://www.ibm.com/docs/en/i/7.5?topic=nfs-setting-up-network-rpcsec-gss
  page_start: 158
