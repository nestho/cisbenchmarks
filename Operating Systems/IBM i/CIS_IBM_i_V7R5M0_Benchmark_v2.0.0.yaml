- id: 5.1.2.18
  title: (L2) Set Password Expiration Interval
  scoring: scored
  profile:
  - Level 2
  description: 'Determines the maximum number of days a password is valid from 1 to 366 or *NOMAX. Note that service accounts
    may have their PWDEXPITV set to *NOMAX on the user profile whereas standard user profiles should be set to *SYSVAL. Numerous
    studies had found that excessive password expiration requirements do more harm than good, because these requirements make
    users select predictable passwords, composed of sequential words and numbers that are closely related to each other. Instead,
    longer passphrases that do not expire frequently promote better composition, strength, and create better secrets that
    are harder to crack. Immediate password changes should be based on key events including, but not limited to: • Indication
    of compromise • Change of user roles • When a user leaves the organization NOTE: Longer password expiry intervals should
    only be implemented in conjunction with a longer password/passphrase minimum length of 14 characters. See (L2) Set Password
    Level (QPWDLVL) and (L2) Set Password Rules (QPWDRULES) for additional information.'
  rationale: This helps to prevent access to unauthorized persons by promoting longer passphrases that are more difficult
    to crack.
