      Packager: CentOS-7 Key (CentOS 7 Official Signing Key) <security@centos.org>\nSummary: gpg(CentOS-7 Key (CentOS 7 Official\
      \ Signing Key) <security@centos.org>)\nCreation date: 2014-06-23\nKey ID: f4a80eb5\nThe format of the package (gpg-pubkey-f4a80eb5-53a7ff4b\
