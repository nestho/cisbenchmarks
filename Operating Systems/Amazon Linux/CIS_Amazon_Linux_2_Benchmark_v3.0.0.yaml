- id: 5.2.2.3
  title: Ensure system is disabled when audit logs are full
  scoring: scored
  profile:
  - Level 2
  description: The auditd daemon can be configured to halt the system or put the system in single user mode, if no free space
    is available or an error is detected on the partition that holds the audit log files. The disk_full_action parameter tells
    the system what action to take when no free space is available on the partition that holds the audit log files. Valid
    values are ignore, syslog, rotate, exec, suspend, single, and halt. • ignore, the audit daemon will issue a syslog message
    but no other action is taken • syslog, the audit daemon will issue a warning to syslog • rotate, the audit daemon will
    rotate logs, losing the oldest to free up space • exec, /path-to-script will execute the script. You cannot pass parameters
    to the script. The script is also responsible for telling the auditd daemon to resume logging once its completed its action
    • suspend, the audit daemon will stop writing records to the disk • single, the audit daemon will put the computer system
    in single user mode • halt, the audit daemon will shut down the system The disk_error_action parameter tells the system
    what action to take when an error is detected on the partition that holds the audit log files. Valid values are ignore,
    syslog, exec, suspend, single, and halt. • ignore, the audit daemon will not take any action • syslog, the audit daemon
    will issue no more than 5 consecutive warnings to syslog • exec, /path-to-script will execute the script. You cannot pass
    parameters to the script • suspend, the audit daemon will stop writing records to the disk • single, the audit daemon
    will put the computer system in single user mode • halt, the audit daemon will shut down the system
  rationale: In high security contexts, the risk of detecting unauthorized access or nonrepudiation exceeds the benefit of
    the system's availability.
  impact: -IF- • The disk_full_action parameter is set to halt the auditd daemon will shutdown the system when the disk partition
    containing the audit logs becomes full. • The disk_full_action parameter is set to single the auditd daemon will put the
    computer system in single user mode when the disk partition containing the audit logs becomes full. -IF- • The disk_error_action
    parameter is set to halt the auditd daemon will shutdown the system when an error is detected on the partition that holds
    the audit log files. • The disk_error_action parameter is set to single the auditd daemon will put the computer system
    in single user mode when an error is detected on the partition that holds the audit log files. • The disk_error_action
    parameter is set to syslog the auditd daemon will issue no more than 5 consecutive warnings to syslog when an error is
    detected on the partition that holds the audit log files.
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5'
  - 2. AUDITD.CONF(5)
  page_start: 672
  audit_raw: 'Run the following command and verify the disk_full_action is set to either halt or

    single:

    # grep -P -- ''^\h*disk_full_action\h*=\h*(halt|single)\b'' /etc/audit/auditd.conf

    disk_full_action = <halt|single>

    Run the following command and verify the disk_error_action is set to syslog, single,

    or halt:

    # grep -P -- ''^\h*disk_error_action\h*=\h*(syslog|single|halt)\b'' /etc/audit/auditd.conf

    disk_error_action = <syslog|single|halt>'
  remediation: 'Set one of the following parameters in /etc/audit/auditd.conf depending on your local

    security policies.

    disk_full_action = <halt|single>

    disk_error_action = <syslog|single|halt>

    Example:

    disk_full_action = halt

    disk_error_action = halt'
  checks:
  - type: manual_review
    info: 'Run the following command and verify the disk_full_action is set to either halt or

      single:

      # grep -P -- ''^\h*disk_full_action\h*=\h*(halt|single)\b'' /etc/audit/auditd.conf

      disk_full_action = <halt|single>

      Run the following command and verify the disk_error_action is set to syslog, single,

      or halt:

      # grep -P -- ''^\h*disk_error_action\h*=\h*(syslog|single|halt)\b'' /etc/audit/auditd.conf

      disk_error_action = <syslog|single|halt>'
    severity: medium
- id: 5.2.2.4
  title: Ensure system warns when audit logs are low on space
  scoring: scored
  profile:
  - Level 2
  description: The auditd daemon can be configured to halt the system, put the system in single user mode or send a warning
    message, if the partition that holds the audit log files is low on space. The space_left_action parameter tells the system
    what action to take when the system has detected that it is starting to get low on disk space. Valid values are ignore,
    syslog, rotate, email, exec, suspend, single, and halt. • ignore, the audit daemon does nothing • syslog, the audit daemon
    will issue a warning to syslog • rotate, the audit daemon will rotate logs, losing the oldest to free up space • email,
    the audit daemon will send a warning to the email account specified in action_mail_acct as well as sending the message
    to syslog • exec, /path-to-script will execute the script. You cannot pass parameters to the script. The script is also
    responsible for telling the auditd daemon to resume logging once its completed its action • suspend, the audit daemon
    will stop writing records to the disk • single, the audit daemon will put the computer system in single user mode • halt,
    the audit daemon will shut down the system The admin_space_left_action parameter tells the system what action to take
    when the system has detected that it is low on disk space. Valid values are ignore, syslog, rotate, email, exec, suspend,
    single, and halt. • ignore, the audit daemon does nothing • syslog, the audit daemon will issue a warning to syslog •
    rotate, the audit daemon will rotate logs, losing the oldest to free up space • email, the audit daemon will send a warning
    to the email account specified in action_mail_acct as well as sending the message to syslog • exec, /path-to-script will
    execute the script. You cannot pass parameters to the script. The script is also responsible for telling the auditd daemon
    to resume logging once its completed its action • suspend, the audit daemon will stop writing records to the disk • single,
    the audit daemon will put the computer system in single user mode • halt, the audit daemon will shut down the system Monitor
    scope changes for system administrators. If the system has been properly configured to force system administrators to
    log in as themselves first and then use the sudo command to execute privileged commands, it is possible to monitor changes
    in scope. The file /etc/sudoers, or files in /etc/sudoers.d, will be written to when the file(s) or related attributes
    have changed. The audit records will be tagged with the identifier "scope".
  rationale: In high security contexts, the risk of detecting unauthorized access or nonrepudiation exceeds the benefit of
    the system's availability. Changes in the /etc/sudoers and /etc/sudoers.d files can indicate that an unauthorized change
    has been made to the scope of system administrator activity.
  impact: If the admin_space_left_action is set to single the audit daemon will put the computer system in single user mode.
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-8, AU-12, SI-5'
  - 2. AUDITD.CONF(5)
  page_start: 675
  audit_raw: 'Run the following command and verify the space_left_action is set to email, exec,

    single, or halt:

    grep -P -- ''^\h*space_left_action\h*=\h*(email|exec|single|halt)\b'' /etc/audit/auditd.conf

    Verify the output is email, exec, single, or halt

    Example output

