- id: 4.5.3
  title: Configure user default environment 4.5.3.1 Ensure nologin is not listed in /etc/shells
  scoring: scored
  profile:
  - Level 2
  description: /etc/shells is a text file which contains the full pathnames of valid login shells. This file is consulted
    by chsh and available to be queried by other programs. Be aware that there are programs which consult this file to find
    out if a user is a normal user; for example, FTP daemons traditionally disallow access to users with shells not included
    in this file.
  rationale: A user can use chsh to change their configured shell. If a user has a shell configured that isn't in in /etc/shells,
    then the system assumes that they're somehow restricted. In the case of chsh it means that the user cannot change that
    value. Other programs might query that list and apply similar restrictions. By putting nologin in /etc/shells, any user
    that has nologin as its shell is considered a full, unrestricted user. This is not the expected behavior for nologin.
  impact: ''
  references:
  - 1. shells(5)
  - '2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 595
  audit_raw: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

    # grep ''/nologin\b'' /etc/shells

    Nothing should be returned'
  remediation: Edit /etc/shells and remove any lines that include nologin
  checks:
  - type: manual_review
    info: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

      # grep ''/nologin\b'' /etc/shells

      Nothing should be returned'
    severity: medium
- id: 4.5.3.2
  title: Ensure default user shell timeout is configured
  scoring: scored
  profile:
  - Level 1
  description: 'TMOUT is an environmental setting that determines the timeout of a shell in seconds. • TMOUT=n - Sets the
    shell timeout to n seconds. A setting of TMOUT=0 disables timeout. • readonly TMOUT- Sets the TMOUT environmental variable
    as readonly, preventing unwanted modification during run-time. • export TMOUT - exports the TMOUT variable System Wide
    Shell Configuration Files: • /etc/profile - used to set system wide environmental variables on users shells. The variables
    are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for
    all shell users of the system. is only executed for interactive login shells, or shells executed with the --login parameter.
    • /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration
    in a shell script within /etc/profile.d to set your own system wide environmental variables. • /etc/bashrc - System wide
    version of .bashrc. In Fedora derived distributions, /etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell,
    but redirects output to /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to
    /etc/bashrc.'
  rationale: Setting a timeout value reduces the window of opportunity for unauthorized user access to another user's shell
    session that has been left unattended. It also ends the inactive session and releases the resources associated with that
    session.
  impact: ''
  references: []
  page_start: 597
