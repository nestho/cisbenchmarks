    The loopback interface is the only place that loopback network (127.0.0.0/8) traffic should be seen, all other interfaces
    should ignore traffic on this network as an anti-spoofing measure. Note: Changing firewall settings while connected over
    network can result in being locked out of the system.'
  impact: ''
  references:
