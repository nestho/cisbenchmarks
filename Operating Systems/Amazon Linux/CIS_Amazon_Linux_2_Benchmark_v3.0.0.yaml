- id: 5.2.1.3
  title: Ensure audit_backlog_limit is sufficient
  scoring: scored
  profile:
  - Level 2
  description: The audit_backlog_limit parameter determines how auditd records can be held in the auditd backlog. The default
    setting of 64 may be insufficient to store all audit events during boot.
  rationale: During boot if audit=1, then the backlog will hold 64 records. If more than 64 records are created during boot,
    auditd records will be lost and potential malicious activity could go undetected.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5'
