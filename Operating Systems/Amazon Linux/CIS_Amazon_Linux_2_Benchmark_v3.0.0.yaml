- id: 5.1.1.3
  title: Ensure journald is configured to send logs to rsyslog
  scoring: manual
  profile:
  - Level 1
  description: Data from systemd-journald may be stored in volatile memory or persisted locally on the server. Utilities exist
    to accept remote export of systemd-journald logs, however, use of the rsyslog service provides a consistent means of log
    collection and export.
  rationale: '-IF- rsyslog is the preferred method for capturing logs, all logs of the system should be sent to it for further
    processing. Note: This recommendation only applies if rsyslog is the chosen method for client side logging. Do not apply
    this recommendation if systemd-journald is used.'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2, SI-5'
  - 2. SYSTEMD-JOURNALD.SERVICE(8)
  page_start: 614
  audit_raw: '-IF- rsyslog is the preferred method for capturing logs

    Run the following command to verify that logs are forwarded to rsyslog by setting

    ForwardToSyslog to yes in the systemd-journald configuration:

    grep -Pi -- ''^\h*ForwardToSyslog'' /etc/systemd/journald.conf

    ForwardToSyslog=yes

    Run the following command to verify systemd-journald.service and rsyslog.service

    are loaded and active:

    # systemctl list-units --type service | grep -P -- ''(journald|rsyslog)''

    Output should be similar to:

    rsyslog.service loaded active running System Logging

    Service

    systemd-journald.service loaded active running Journal Service'
  remediation: 'Create or edit the file /etc/systemd/journald.conf and add or edit the following line:

    ForwardToSyslog=yes

    Reload the systemd-journald service:

    # systemctl systemctl reload-or-try-restart systemd-journald.service'
  checks:
  - type: command
    command: 'grep -Pi -- ''^\h*ForwardToSyslog'' /etc/systemd/journald.conf && # systemctl list-units --type service | grep
      -P -- ''(journald|rsyslog)'''
    expected: Run the following command to verify that logs are forwarded to rsyslog by setting
    severity: medium
    info: '-IF- rsyslog is the preferred method for capturing logs

