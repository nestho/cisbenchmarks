- id: 6.2.10
  title: Ensure local interactive user home directories are configured
  scoring: scored
  profile:
  - Level 1
  description: The user home directory is space defined for the particular user to set local environment variables and to
    store personal files. While the system administrator can establish secure permissions for users' home directories, the
    users can easily override these. Users can be defined in /etc/passwd without a home directory or with a home directory
    that does not actually exist.
  rationale: Since the user is accountable for files stored in the user home directory, the user must be the owner of the
    directory. Group or world-writable user home directories may enable malicious users to steal or modify other users' data
    or to gain another user's system privileges. If the user's home directory does not exist or is unassigned, the user will
    be placed in "/" and will not be able to write any files or have local environment variables set.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 832
  audit_raw: "Run the following script to:\n• Ensure local interactive user home directories exist\n• Ensure local interactive\
    \ users own their home directories\n• Ensure local interactive user home directories are mode 750 or more restrictive\n\
    #!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_heout2=\"\" l_hoout2=\"\" l_haout2=\"\"\n l_valid_shells=\"^($(\
    \ awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn\n'/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n\
    \ unset a_uarr && a_uarr=() # Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users and\
    \ user home location\n a_uarr+=(\"$l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print\
    \ $1 \" \" $(NF-1) }'\n/etc/passwd)\"\n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users before\
    \ proceeding\n [ \"$l_asize \" -gt \"10000\" ] && echo -e \"\\n ** INFO **\\n - \\\"$l_asize\\\" Local interactive\nusers\
    \ found on the system\\n - This may be a long running check\\n\"\n while read -r l_user l_home; do\n if [ -d \"$l_home\"\
    \ ]; then\n l_mask='0027'\n l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read -r l_own l_mode; do\n [ \"$l_user\"\
    \ != \"$l_own\" ] && l_hoout2=\"$l_hoout2\\n - User: \\\"$l_user\\\" Home\n\\\"$l_home\\\" is owned by: \\\"$l_own\\\"\
    \"\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_haout2=\"$l_haout2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\"\
    \ is mode: \\\"$l_mode\\\"\nshould be mode: \\\"$l_max\\\" or more restrictive\"\n fi\n done <<< \"$(stat -Lc '%U %#a'\
