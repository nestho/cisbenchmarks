- id: 3.2.4
  title: Ensure sctp kernel module is not available
  scoring: scored
  profile:
  - Level 2
  description: The Stream Control Transmission Protocol (SCTP) is a transport layer protocol used to support message oriented
    communication, with several streams of messages in one connection. It serves a similar function as TCP and UDP, incorporating
    features of both. It is message-oriented like UDP, and ensures reliable in-sequence transport of messages with congestion
    control like TCP.
  rationale: -IF- the protocol is not being used, it is recommended that kernel module not be loaded, disabling the service
    to reduce the potential attack surface.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-4, CM-7'
  page_start: 290
  audit_raw: "Run the following script to verify the sctp module is disabled:\n-IF- the module is available in the running\
    \ kernel:\n• An entry including /bin/true or /bin/false exists in a file within the\n/etc/modprobe.d/ directory\n• The\
    \ module is deny listed in a file within the /etc/modprobe.d/ directory\n• The module is not loaded in the kernel\n-IF-\
    \ available in ANY installed kernel:\n• The module is deny listed in a file within the /etc/modprobe.d/ directory\n-IF-\
    \ the kernel module is not available on the system, or pre-compiled into the kernel:\n• No additional configuration is\
    \ necessary\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_output3=\"\" l_dl=\"\" # Unset output variables\n\
    \ l_mname=\"sctp\" # set module name\n l_mtype=\"net\" # set module type\n l_searchloc=\"/lib/modprobe.d/*.conf /usr/local/lib/modprobe.d/*.conf\
    \ /run/modprobe.d/*.conf\n/etc/modprobe.d/*.conf\"\n l_mpath=\"/lib/modules/**/kernel/$l_mtype\"\n l_mpname=\"$(tr '-'\
    \ '_' <<< \"$l_mname\")\"\n l_mndir=\"$(tr '-' '/' <<< \"$l_mname\")\"\n module_loadable_chk()\n {\n # Check if the module\
    \ is currently loadable\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"$l_loadable\")\" -gt \"1\"\
    \ ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n if grep -Pq -- '^\\h*install\
