- id: 4.2.7
  title: Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  scoring: scored
  profile:
  - Level 1
  description: 'Note: To clarify, the two settings described below are only meant for idle connections from a protocol perspective
    and are not meant to check if the user is active or not. An idle user does not mean an idle connection. SSH does not and
    never had, intentionally, the capability to drop idle users. In SSH versions before 8.2p1 there was a bug that caused
    these values to behave in such a manner that they were abused to disconnect idle users. This bug has been resolved in
    8.2p1 and thus it can no longer be abused disconnect idle users. The two options ClientAliveInterval and ClientAliveCountMax
    control the timeout of SSH sessions. Taken directly from man 5 sshd_config: • ClientAliveInterval Sets a timeout interval
    in seconds after which if no data has been received from the client, sshd(8) will send a message through the encrypted
    channel to request a response from the client. The default is 0, indicating that these messages will not be sent to the
    client. • ClientAliveCountMax Sets the number of client alive messages which may be sent without sshd(8) receiving any
    messages back from the client. If this threshold is reached while client alive messages are being sent, sshd will disconnect
    the client, terminating the session. It is important to note that the use of client alive messages is very different from
    TCPKeepAlive. The client alive messages are sent through the encrypted channel and therefore will not be spoofable. The
    TCP keepalive option en‐abled by TCPKeepAlive is spoofable. The client alive mechanism is valuable when the client or
    server depend on knowing when a connection has become unresponsive. The default value is 3. If ClientAliveInterval is
    set to 15, and ClientAliveCountMax is left at the default, unresponsive SSH clients will be disconnected after approximately
    45 seconds. Setting a zero ClientAliveCountMax disables connection termination.'
  rationale: In order to prevent resource exhaustion, appropriate values should be set for both ClientAliveInterval and ClientAliveCountMax.
    Specifically, looking at the source code, ClientAliveCountMax must be greater than zero in order to utilize the ability
    of SSH to drop idle connections. If connections are allowed to stay open indefinitely, this can potentially be used as
    a DDOS attack or simple resource exhaustion could occur over unreliable networks. The example set here is a 45 second
    timeout. Consult your site policy for network timeouts and apply as appropriate.
  impact: ''
  references:
  - 1. https://man.openbsd.org/sshd_config
  - '2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 462
  audit_raw: 'Run the following commands and verify ClientAliveInterval is greater than zero:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep

    clientaliveinterval

    Example Output:

    clientaliveinterval 15

    Run the following command and verify ClientAliveInterval is not set to zero:

    # grep -Psi ''^\h*ClientAliveInterval\h+"?0\b'' /etc/ssh/sshd_config

    Nothing should be returned

    Run the following command and verify ClientAliveCountMax is greater than zero:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep

    clientalivecountmax

    Example Output:

    clientalivecountmax 3

    Run the following command and verify ClientAliveCountMax is not set to zero:

    # grep -Psi ''^\h*ClientAliveCountMax\h+"?0\b'' /etc/ssh/sshd_config

    Nothing should be returned

    Note: If Match statements are used in your environment, those locations should be

    checked for the correct configuration as well.'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameters above any Match entries

    according to site policy.

    Example:

    ClientAliveInterval 15

    ClientAliveCountMax 3

    Note: First occurrence of a option takes precedence, Match set statements

    withstanding.'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify ClientAliveInterval is greater than zero:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep

      clientaliveinterval

      Example Output:

      clientaliveinterval 15

      Run the following command and verify ClientAliveInterval is not set to zero:

      # grep -Psi ''^\h*ClientAliveInterval\h+"?0\b'' /etc/ssh/sshd_config

      Nothing should be returned

      Run the following command and verify ClientAliveCountMax is greater than zero:

      # sshd -T -C user'
    severity: medium
- id: 4.2.8
  title: Ensure sshd DisableForwarding is enabled
  scoring: scored
  profile:
  - Level 2
  description: The DisableForwarding parameter disables all forwarding features, including X11, sshagent(1), TCP and StreamLocal.
    This option overrides all other forwarding-related options and may simplify restricted configurations. • X11Forwarding
    provides the ability to tunnel X11 traffic through the connection to enable remote graphic connections. • ssh-agent is
    a program to hold private keys used for public key authentication. Through use of environment variables the agent can
    be located and automatically used for authentication when logging in to other machines using ssh. • SSH port forwarding
    is a mechanism in SSH for tunneling application ports from the client to the server, or servers to clients. It can be
    used for adding encryption to legacy applications, going through firewalls, and some system administrators and IT professionals
    use it for opening backdoors into the internal network from their home machines.
  rationale: Disable X11 forwarding unless there is an operational requirement to use X11 applications directly. There is
    a small risk that the remote X11 servers of users who are logged in via SSH with X11 forwarding could be compromised by
    other users on the X11 server. Note that even if X11 forwarding is disabled, users can always install their own forwarders.
    anyone with root privilege on the the intermediate server can make free use of sshagent to authenticate them to other
    servers Leaving port forwarding enabled can expose the organization to security risks and backdoors. SSH connections are
    protected with strong encryption. This makes their contents invisible to most deployed network monitoring and traffic
    filtering solutions. This invisibility carries considerable risk potential if it is used for malicious purposes such as
    data exfiltration. Cybercriminals or malware could exploit SSH to hide their unauthorized communications, or to exfiltrate
    stolen data from the target network.
  impact: SSH tunnels are widely used in many corporate environments. In some environments the applications themselves may
    have very limited native support for security. By utilizing tunneling, compliance with SOX, HIPAA, PCI-DSS, and other
    standards can be achieved without having to modify the applications.
  references:
  - 1. sshd_config(5)
  - '2. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 465
  audit_raw: 'Run the following command to verify DisableForwarding is set to yes:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep -i

    disableforwarding

    disableforwarding yes'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the DisableForwarding parameter to yes:

    DisableForwarding yes

    Note: First occurrence of a option takes precedence.'
  checks:
  - type: command
    command: '# sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep -i'
    expected: ''
    severity: medium
    info: 'Run the following command to verify DisableForwarding is set to yes:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | cut -d '' '' -f1)" | grep -i

      disableforwarding

      disableforwarding yes'
