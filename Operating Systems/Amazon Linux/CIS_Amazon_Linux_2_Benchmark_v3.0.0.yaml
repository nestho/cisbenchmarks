    # awk -F: ''/nologin/ {print $1}'' /etc/passwd | xargs -I ''{}'' passwd -S ''{}'' | awk ''($2!="L" &&

    $2!="LK") {print $1}''

    Verify no results are returned.'
  remediation: 'System accounts

    Set the shell for any accounts returned by the audit to nologin:

    # usermod -s $(command -v nologin) <user>

    Disabled accounts

    Lock any non root accounts returned by the audit:

    # usermod -L <user>

    Large scale changes

    The following command will set all system accounts to nologin:

    # awk -F: ''($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<''"$(awk ''/^\s*UID_MIN/{print $2}''

    /etc/login.defs)"'' || $3 == 65534)) { print $1 }'' /etc/passwd | while read user; do usermod -s

    $(command -v nologin) $user >/dev/null; done

    The following command will automatically lock all accounts that have their shell set to

    nologin:

    # awk -F: ''/nologin/ {print $1}'' /etc/passwd | while read user; do usermod -L $user; done'
  checks:
