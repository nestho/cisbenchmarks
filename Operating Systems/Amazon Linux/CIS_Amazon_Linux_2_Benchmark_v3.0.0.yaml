      n - * Reasons for audit failure * :\\n$l_output2\"\n [ -n \"$l_output\" ] && echo -e \"- * Correctly configured * :\\\
      n$l_output\\n\"\n fi\n}\nNote: On systems with a large number of files and/or directories, this audit may be a\nlong\
      \ running process"
