- id: 3.4.1.2
  title: Ensure a single firewall configuration utility is in use
  scoring: scored
  profile:
  - Level 1
  description: 'FirewallD - Is a firewall service daemon that provides a dynamic customizable hostbased firewall with a D-Bus
    interface. Being dynamic, it enables creating, changing, and deleting the rules without the necessity to restart the firewall
    daemon each time the rules are changed NFTables - Includes the nft utility for configuration of the nftables subsystem
    of the Linux kernel IPTables Services - Contains the iptables service and the ip6tables service which store their configurations
    in /etc/sysconfig/iptables and /etc/sysconfig/ip6tables Note: firewalld with nftables backend does not support passing
    custom nftables rules to firewalld, using the --direct option.'
  rationale: In order to configure firewall rules, a firewall utility needs to be installed and active of the system. The
    use of more than one firewall utility may produce unexpected results.
  impact: ''
  references: []
