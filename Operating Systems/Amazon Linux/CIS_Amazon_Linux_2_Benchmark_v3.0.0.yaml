- id: 2.2.1
  title: Ensure autofs services are not in use
  scoring: scored
  profile:
  - Level 1
  description: autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: 'The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting. There may be packages that are dependent on the autofs package. If the autofs package
    is removed, these dependent packages will be removed as well. Before removing the autofs package, review any dependent
    packages to determine if they are required on the system. -IF- a dependent package is required: stop and mask the autofs.service
    leaving the autofs package installed.'
