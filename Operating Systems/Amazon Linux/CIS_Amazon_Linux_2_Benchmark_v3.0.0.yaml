- id: 3.4.2.3
  title: Ensure firewalld drops unnecessary services and ports
  scoring: manual
  profile:
  - Level 1
  description: Services and ports can be accepted or explicitly rejected or dropped by a zone. For every zone, you can set
    a default behavior that handles incoming traffic that is not further specified. Such behavior is defined by setting the
    target of the zone. There are three options - default, ACCEPT, REJECT, and DROP. • ACCEPT - you accept all incoming packets
    except those disabled by a specific rule. • REJECT - you disable all incoming packets except those that you have allowed
    in specific rules and the source machine is informed about the rejection. • DROP - you disable all incoming packets except
    those that you have allowed in specific rules and no information sent to the source machine.
  rationale: To reduce the attack surface of a system, all services and ports should be blocked unless required
  impact: ''
  references:
  - 1. firewalld.service(5)
  - 2. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/8/html/securing_networks/using-and-configuringfirewalls_securing-networks
  page_start: 358
  audit_raw: 'Run the following command and review output to ensure that listed services and ports

    follow site policy.

    # systemctl is-enabled firewalld.service | grep -q ''enabled'' && firewall-cmd --list-all --

    zone="$(firewall-cmd --list-all | awk ''/\(active\)/ { print $1 }'')" | grep -P --

    ''^\h*(services:|ports:)'''
  remediation: 'If Firewalld is in use on the system:

    Run the following command to remove an unnecessary service:

    # firewall-cmd --remove-service=<service>

    Example:

    # firewall-cmd --remove-service=cockpit

    Run the following command to remove an unnecessary port:

    # firewall-cmd --remove-port=<port-number>/<port-type>

    Example:

    # firewall-cmd --remove-port=25/tcp

    Run the following command to make new settings persistent:

    # firewall-cmd --runtime-to-permanent'
  checks:
  - type: command
    command: '# systemctl is-enabled firewalld.service | grep -q ''enabled'' && firewall-cmd --list-all -- && zone="$(firewall-cmd
      --list-all | awk ''/\(active\)/ { print $1 }'')" | grep -P --'
    expected: ''
    severity: medium
    info: 'Run the following command and review output to ensure that listed services and ports

      follow site policy.

      # systemctl is-enabled firewalld.service | grep -q ''enabled'' && firewall-cmd --list-all --

      zone="$(firewall-cmd --list-all | awk ''/\(active\)/ { print $1 }'')" | grep -P --

      ''^\h*(services:|ports:)'''
