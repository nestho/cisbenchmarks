    severity: medium
- id: 4.2.14
  title: Ensure sshd LogLevel is configured
  scoring: scored
  profile:
  - Level 1
  description: 'LogLevel gives the verbosity level that is used when logging messages from sshd. The possible values are:
    QUIET, FATAL, ERROR, INFO, VERBOSE, DEBUG, DEBUG1, DEBUG2, and DEBUG3. The default is INFO. DEBUG and DEBUG1 are equivalent.
    DEBUG2 and DEBUG3 each specify higher levels of debugging output. Note: Logging with a DEBUG level violates the privacy
    of users and is not recommended.'
  rationale: SSH provides several logging levels with varying amounts of verbosity. The DEBUG options are specifically not
    recommended other than strictly for debugging SSH communications. These levels provide so much data that it is difficult
    to identify important security information, and may violate the privacy of users. The INFO level is the basic level that
    only records login activity of SSH users. In many situations, such as Incident Response, it is important to determine
    when a particular user was active on a system. The logout record can eliminate those users who disconnected, which helps
    narrow the field. The VERBOSE level specifies that login and logout activity as well as the key fingerprint for any SSH
    key used for login will be logged. This information is important for SSH key management, especially in legacy environments.
  impact: ''
  references:
  - 1. https://www.ssh.com/ssh/sshd_config/
  - '2. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5'
  page_start: 478
  audit_raw: "Run the following command and verify that output matches loglevel VERBOSE or\nloglevel INFO:\n# sshd -T -C user=root\
    \ -C host=\"$(hostname)\" -C addr=\"$(hostname -I | cut -d ' ' -f1)\" | grep\nloglevel\nloglevel VERBOSE\n - OR -\nloglevel\
    \ INFO"
  remediation: "Edit the /etc/ssh/sshd_config file to set the LogLevel parameter as follows:\nLogLevel VERBOSE\n - OR -\n\
    LogLevel INFO\nNote: First occurrence of a option takes precedence."
  checks:
  - type: manual_review
    info: "Run the following command and verify that output matches loglevel VERBOSE or\nloglevel INFO:\n# sshd -T -C user=root\
      \ -C host=\"$(hostname)\" -C addr=\"$(hostname -I | cut -d ' ' -f1)\" | grep\nloglevel\nloglevel VERBOSE\n - OR -\n\
      loglevel INFO"
    severity: medium
- id: 4.2.15
  title: Ensure sshd MACs are configured
  scoring: scored
  profile:
  - Level 1
  description: 'This variable limits the types of MAC algorithms that SSH can use during communication. Notes: • Some organizations
    may have stricter requirements for approved MACs. • Ensure that MACs used are in compliance with site policy. • The only
    "strong" MACs currently FIPS 140-2 approved are: o HMAC-SHA1 o HMAC-SHA2-256 o HMAC-SHA2-384 o HMAC-SHA2-512'
  rationale: MD5 and 96-bit MAC algorithms are considered weak and have been shown to increase exploitability in SSH downgrade
    attacks. Weak algorithms continue to have a great deal of attention as a weak spot that can be exploited with expanded
    computing power. An attacker that breaks the algorithm could take advantage of a MiTM position to decrypt the SSH tunnel
    and capture credentials and information.
