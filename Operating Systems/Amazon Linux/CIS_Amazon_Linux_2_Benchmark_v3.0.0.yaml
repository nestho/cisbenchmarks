- id: 4.4.2.2.4
  title: Ensure password complexity is configured
  scoring: manual
  profile:
  - Level 1
  description: 'Password complexity can be set through: • minclass - The minimum number of classes of characters required
    in a new password. (digits, uppercase, lowercase, others). e.g. minclass = 4 requires digits, uppercase, lower case, and
    special characters. • dcredit - The maximum credit for having digits in the new password. If less than 0 it is the minimum
    number of digits in the new password. e.g. dcredit = -1 requires at least one digit • ucredit - The maximum credit for
    having uppercase characters in the new password. If less than 0 it is the minimum number of uppercase characters in the
    new password. e.g. ucredit = -1 requires at least one uppercase character • ocredit - The maximum credit for having other
    characters in the new password. If less than 0 it is the minimum number of other characters in the new password. e.g.
    ocredit = -1 requires at least one special character • lcredit - The maximum credit for having lowercase characters in
    the new password. If less than 0 it is the minimum number of lowercase characters in the new password. e.g. lcredit =
    -1 requires at least one lowercase character'
  rationale: Strong passwords protect systems from being hacked through brute force methods.
  impact: ''
  references:
  - 1. pam_pwquality(8)
  - 2. PWQUALITY.CONF(5)
  page_start: 539
  audit_raw: "Run the following command to verify that complexity conforms to local site policy:\n# grep -Psi -- '^\\h*(minclass|[dulo]credit)\\\
    b' /etc/security/pwquality.conf\nExample output:\nminclass = 4\n -- AND/OR --\ndcredit = -1\nucredit = -1\nocredit = -1\n\
    lcredit = -1\nRun the following command to verify that:\n• minclass is not set to less than 4\n• dcredit, ucredit, lcredit,\
    \ and ocredit are not set to 0 or greater\ngrep -Psi --\n'^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\\
    .so\\h+([^#\\n\\r]+\\h+)?(minclass=[0\n-3]|[dulo]credit=[^-]\\d*)\\b' /etc/pam.d/{password,system}-auth\nNothing should\
    \ be returned\nNote:\n• settings should be configured in only one location for clarity\n• Module arguments override the\
    \ settings in the /etc/security/pwquality.conf\nconfiguration file\n• It is recommended that settings be configured in\
    \ /etc/security/pwquality.conf"
  remediation: "Edit /etc/security/pwquality.conf and add or modify the following line to set:\nminclass = 4\n--AND/OR--\n\
    dcredit = -_N>\nucredit = <N>\nocredit = <N>\nlcredit = <N>\nExample:\n# printf '\\n%s' \"minclass = 4\" >> /etc/security/pwquality.conf\n\
    --AND/OR--\n# printf '%s\\n' \"dcredit = -1\" \"ucredit = -1\" \"ocredit = -1\" \"lcredit = -1\" >>\n/etc/security/pwquality.conf\n\
    Run the following script to remove setting minclass, dcredit, ucredit, lcredit, and\nocredit on the pam_pwquality.so module\
