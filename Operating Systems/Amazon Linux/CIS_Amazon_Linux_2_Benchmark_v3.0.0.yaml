  title: Ensure auditing for processes that start prior to auditd is enabled
  scoring: scored
  profile:
  - Level 2
  description: Configure grub2 so that processes that are capable of being audited can be audited even if they start up prior
    to auditd startup.
  rationale: Audit events need to be captured on processes that start up prior to auditd , so that potential malicious activity
    cannot go undetected.
  impact: ''
  references: []
  page_start: 659
  audit_raw: 'Note: /etc/default/grub should be checked because the grub2-mkconfig -o

    command will overwrite grub.cfg with parameters listed in /etc/default/grub.

    Run the following command to verify that the audit=1 parameter has been set:

    # grubby --info=ALL | grep -Po ''\baudit=1\b''

    audit=1

    Note: audit=1 may be returned multiple times

    Run the following command to verify that the audit=1 parameter has been set in

    /etc/default/grub:

    # grep -Psoi -- ''^\h*GRUB_CMDLINE_LINUX=\"([^#\n\r]+\h+)?audit=1\b'' /etc/default/grub

    Example output:

    GRUB_CMDLINE_LINUX="quiet audit=1"

    Note: Other parameters may also be listed'
  remediation: 'Run the following command to update the grub2 configuration with audit=1:

    # grubby --update-kernel ALL --args ''audit=1''

    Edit /etc/default/grub and add audit=1 to the GRUB_CMDLINE_LINUX= line between the

    opening and closing double quotes:

    Example:

    GRUB_CMDLINE_LINUX="quiet audit=1"

    Note: Other parameters may also be listed'
