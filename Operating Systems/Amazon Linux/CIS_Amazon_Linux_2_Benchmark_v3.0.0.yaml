      configuration of the tim'
- id: 4.3.7
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo, which allows for more granular control over privileged access. Normally, the su command can be executed by any user.
    By uncommenting the pam_wheel.so statement in /etc/pam.d/su, the su command will only allow users in a specific groups
    to execute su. This group should be empty to reinforce the use of sudo for privileged access.
  rationale: Restricting the use of su , and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo , whereas su can only record that a user executed the su program.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 510
  audit_raw: 'Run the following command:

    # grep -Pi

    ''^\h*auth\h+[^#\n\r]+\h+pam_wheel\.so\h+([^#\n\r]+\h+)?(use_uid|group=\H+)\h+([^#\n\r]+\h+)?(use_

    uid|group=\H+)\b'' /etc/pam.d/su

    auth required pam_wheel.so use_uid group=<group_name>

    Example output:

    auth required pam_wheel.so use_uid group=sugroup

    Run the following command and verify that the group specified in <group_name> contains

    no users:

    # grep <group_name> /etc/group

    <group_name>:x:<GID>:

    There should be no users listed after the Group ID field.'
  remediation: 'Create an empty group that will be specified for use of the su command. The group

    should be named according to site policy.

    Example:

    # groupadd sugroup

    Add the following line to the /etc/pam.d/su file, specifying the empty group:

    auth required pam_wheel.so use_uid group=sugroup'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep -Pi

      ''^\h*auth\h+[^#\n\r]+\h+pam_wheel\.so\h+([^#\n\r]+\h+)?(use_uid|group=\H+)\h+([^#\n\r]+\h+)?(use_

      uid|group=\H+)\b'' /etc/pam.d/su

      auth required pam_wheel.so use_uid group=<group_name>

      Example output:

      auth required pam_wheel.so use_uid group=sugroup

      Run the following command and verify that the group specified in <group_name> contains

      no users:

      # grep <group_name> /etc/group

      <group_name>:x:<GID>:

      There should be no users listed after the Group ID field.'
    severity: medium
