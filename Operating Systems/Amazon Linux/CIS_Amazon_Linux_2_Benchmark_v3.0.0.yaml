    \"\n fi\n }\n module_loaded_chk()\n {\n # Check if the module is currently loaded\n if ! lsmod | grep \"$l_mname\" > /dev/null\
    \ 2>&1; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loaded\"\n else\n l_output2=\"$l_output2\\n -\
    \ module: \\\"$l_mname\\\" is loaded\"\n fi\n }\n module_deny_chk()\n {\n # Check if the module is deny listed\n l_dl=\"\
    y\"\n if modprobe --showconfig | grep -Pq -- '^\\h*blacklist\\h+'\"$l_mpname\"'\\b'; then\n l_output=\"$l_output\\n -\
    \ module: \\\"$l_mname\\\" is deny listed in: \\\"$(grep -Pls --\n\"^\\h*blacklist\\h+$l_mname\\b\" $l_searchloc)\\\"\"\
    \n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is not deny listed\"\n fi\n }\n # Check if the module exists\
    \ on the system\n for l_mdir in $l_mpath; do\n if [ -d \"$l_mdir/$l_mndir\" ] && [ -n \"$(ls -A $l_mdir/$l_mndir)\" ];\
    \ then\n l_output3=\"$l_output3\\n - \\\"$l_mdir\\\"\"\n [ \"$l_dl\" != \"y\" ] && module_deny_chk\n if [ \"$l_mdir\"\
