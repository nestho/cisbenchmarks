  title: Ensure actions as another user are always logged
  scoring: scored
  profile:
  - Level 2
  description: sudo provides users with temporary elevated privileges to perform operations, either as the superuser or another
    user.
  rationale: Creating an audit log of users with temporary elevated privileges and the operation(s) they performed is essential
    to reporting. Administrators will want to correlate the events written to the audit trail with the records written to
    sudo's logfile to verify if unauthorized commands have been executed.
  impact: ''
  references: []
  page_start: 682
  audit_raw: '64 Bit systems

    On disk configuration

    Run the following command to check the on disk rules:

    # awk ''/^ *-a *always,exit/ \

    &&/ -F *arch=b(32|64)/ \

    &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \

    &&(/ -C *euid!=uid/||/ -C *uid!=euid/) \

    &&/ -S *execve/ \

    &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'' /etc/audit/rules.d/*.rules

    Verify the output matches:

    -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation

    -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation

    Running configuration

    Run the following command to check loaded rules:

    # auditctl -l | awk ''/^ *-a *always,exit/ \

    &&/ -F *arch=b(32|64)/ \

    &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \

    &&(/ -C *euid!=uid/||/ -C *uid!=euid/) \

    &&/ -S *execve/ \

    &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)''

    Verify the output matches:

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation

    32 Bit systems

    Follow the same procedures as for 64 bit systems and ignore any entries with b64.'
  remediation: 'Create audit rules

    Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

    with the relevant rules to monitor elevated privileges.

    64 Bit systems

