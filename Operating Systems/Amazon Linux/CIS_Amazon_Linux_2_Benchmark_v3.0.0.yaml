- id: 4.4.2.1.3
  title: Ensure password unlock time is configured
  scoring: scored
  profile:
  - Level 1
  description: 'unlock_time=<n> - The access will be re-enabled after seconds after the lock out. The value 0 has the same
    meaning as value never - the access will not be re-enabled without resetting the faillock entries by the faillock(8) command.
    Note: • The default directory that pam_faillock uses is usually cleared on system boot so the access will be also re-enabled
    after system reboot. If that is undesirable a different tally directory must be set with the dir option. • It is usually
    undesirable to permanently lock out users as they can become easily a target of denial of service attack unless the usernames
    are random and kept secret to potential attackers. • The maximum configurable value for unlock_time is 604800'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: Use of unlock_time=0 may allow an attacker to cause denial of service to legitimate users. This will also require
    a systems administrator with elevated privileges to unlock the account.
  references: []
  page_start: 524
  audit_raw: 'Run the following command to verify that the time in seconds before the account is

    unlocked is either 0 (never) or 900 (15 minutes) or more and meets local site policy:

    # grep -Pi --

    ''^\h*auth\h+([^#\n\r]+)\h+pam_faillock\.so\h+(preauth|authfail)\h+([^#\n\r]+\h+)?unlock_time=(0|9

    [0-9][0-9]|[1-9][0-9]{3,})\b'' /etc/pam.d/{system,password}-auth

    Output should be similar to:

    /etc/pam.d/password-auth:auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900 even_deny_root

    /etc/pam.d/password-auth:auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900 even_deny_root

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900 even_deny_root

    /etc/pam.d/system-auth:auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900 even_deny_root

    Verify the lines include the unlock_time= option, the the value is 0 or greater than 900,

    and follows local site policy.'
  remediation: 'Edit the files /etc/pam.d/system-auth and /etc/pam.d/password-auth:

    Edit the files /etc/pam.d/system-auth and /etc/pam.d/password-auth:

    Add the following lines to the auth section:

    auth required pam_faillock.so preauth silent audit deny=5 unlock_time=900

