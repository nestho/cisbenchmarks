    \ l_op2=\"$l_op2\\n - Group owned by: \\\"$l_group\\\" and should be group owned by\n\\\"${l_agroup//|/ or }\\\"\"\n fi\n\
    \ [ -n \"$l_op2\" ] && l_output2=\"$l_output2\\n - File: \\\"$l_fname\\\" is:$l_op2\\n\"\n }\n unset a_file && a_file=()\
