    by a comma separated list for User u, group g, and world/other o. The permissions listed are not masked by umask. ie a
    umask set by umask u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created
    directory with file mode drwxr-x--- and a newly created file with file mode rw-r-----. The default umask can be set to
    use the pam_umask module or in a System Wide Shell Configuration File. The user creating the directories or files has
    the discretion of changing the permissions via the chmod command, or choosing a different default umask by adding the
    umask command into a User Shell Configuration File, ( .bash_profile or .bashrc), in their home directory. Setting the
    default umask: • pam_umask module: o will set the umask according to the system default in /etc/login.defs and user settings,
    solving the problem of different umask settings with different shells, display managers, remote sessions etc. o umask=<mask>
    value in the /etc/login.defs file is interpreted as Octal o Setting USERGROUPS_ENAB to yes in /etc/login.defs (default):
    ▪ will enable setting of the umask group bits to be the same as owner bits. (examples: 022 -> 002, 077 -> 007) for non-root
    users, if the uid is the same as gid, and username is the same as the <primary group name> ▪ userdel will remove the user''s
    group if it contains no more members, and useradd will create by default a group with the name of the user • System Wide
    Shell Configuration File: o /etc/profile - used to set system wide environmental variables on users shells. The variables
    are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for
    all shell users of the system. is only executed for interactive login shells, or shells executed with the --login parameter.
    o /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration
    in a shell script within /etc/profile.d to set your own system wide environmental variables. o /etc/bashrc - System wide
    version of .bashrc. In Fedora derived distributions, etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell, but
    redirects output to /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bashrc.
    User Shell Configuration Files: • ~/.bash_profile - Is executed to configure your shell before the initial command prompt.
    Is only read by login shells. • ~/.bashrc - Is executed for interactive shells. only read by a shell that''s both interactive
    and non-login umask is set by order of precedence. If umask is set in multiple locations, this order of precedence will
    determine the system''s default umask. Order of precedence: 1. A file in /etc/profile.d/ ending in .sh - This will override
    any other system-wide umask setting 2. In the file /etc/profile 3. On the pam_umask.so module in /etc/pam.d/postlogin
    4. In the file /etc/login.defs 5. In the file /etc/default/login'
  rationale: Setting a secure default value for umask ensures that users make a conscious choice about their file permissions.
    A permissive umask value could result in directories or files with excessive permissions that can be read and/or written
    to by unauthorized users.
