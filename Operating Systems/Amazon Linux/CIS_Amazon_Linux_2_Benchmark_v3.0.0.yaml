- id: 4.2.13
  title: Ensure sshd LoginGraceTime is configured
  scoring: scored
  profile:
  - Level 1
  description: The LoginGraceTime parameter specifies the time allowed for successful authentication to the SSH server. The
    longer the Grace period is the more open unauthenticated connections can exist. Like other session controls in this session
    the Grace Period should be limited to appropriate organizational limits to ensure the service is available for needed
    access.
  rationale: Setting the LoginGraceTime parameter to a low number will minimize the risk of successful brute force attacks
    to the SSH server. It will also limit the number of concurrent unauthenticated connections While the recommended setting
    is 60 seconds (1 Minute), set the number based on site policy.
  impact: ''
  references:
  - 1. SSHD_CONFIG(5)
  - '2. NIST SP 800-53 Rev. 5: CM-6'
