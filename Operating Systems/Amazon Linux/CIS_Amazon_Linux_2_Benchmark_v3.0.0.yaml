- id: 4.4.2.4.2
  title: Ensure pam_unix does not include remember
  scoring: scored
  profile:
  - Level 1
  description: The remember=n argument saves the last n passwords for each user in /etc/security/opasswd in order to force
    password change history and keep the user from alternating between the same password too frequently. The MD5 password
    hash algorithm is used for storing the old passwords. Instead of this option the pam_pwhistory module should be used.
    The pam_pwhistory module saves the last n passwords for each user in /etc/security/opasswd using the password hash algorithm
    set on the pam_unix module. This allows for the sha512 hash algorithm to be used.
  rationale: The remember=n argument should be removed to ensure a strong password hashing algorithm is being used. A stronger
    hash provides additional protection to the system by increasing the level of effort needed for an attacker to successfully
    determine local user's old passwords stored in /etc/security/opasswd.
