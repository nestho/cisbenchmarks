- id: 1.4.3
  title: Ensure core dump backtraces are disabled
  scoring: scored
  profile:
  - Level 1
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file.
  rationale: A core dump includes a memory image taken at the time the operating system terminates an application. The memory
    image could contain sensitive data and is generally useful only for developers trying to debug problems, increasing the
    risk to the system.
