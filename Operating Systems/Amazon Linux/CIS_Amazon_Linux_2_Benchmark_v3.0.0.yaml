- id: 1.2.3
  title: Ensure repo_gpgcheck is globally activated
  scoring: manual
  profile:
  - Level 2
  description: The repo_gpgcheck option, found in the main section of the /etc/yum.conf and individual /etc/yum.repos.d/*
    files, will perform a GPG signature check on the repodata.
  rationale: It is important to ensure that the repository data signature is always checked prior to installation to ensure
    that the software is not tampered with in any way.
  impact: Not all repositories, notably RedHat, support repo_gpgcheck. Take care to set this value to false (default) for
    particular repositories that do not support it. If enabled on repositories that do not support repo_gpgcheck installation
    of packages will fail. Research is required by the user to determine which repositories is configured on the local system
    and, from that list, which support repo_gpgcheck.
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-2'
  page_start: 130
  audit_raw: "Global configuration\nRun the following command:\ngrep ^repo_gpgcheck /etc/yum.conf\nVerify that repo_gpgcheck\
    \ is set to 1\nPer repository configuration\nConfiguration in /etc/yum.repos.d/ takes precedence over the global configuration.\n\
    As an example, to list all the configured repositories, excluding \"fedoraproject.org\", that\nspecifically disables repo_gpgcheck,\
    \ run the following script:\n#!/usr/bin/env bash\n{\n REPO_URL=\"fedoraproject.org\"\n for repo in $(grep -l \"repo_gpgcheck=0\"\
    \ /etc/yum.repos.d/* ); do\n if ! grep \"${REPO_URL}\" \"${repo}\" &>/dev/null; then\n echo \"${repo}\"\n fi\n done\n\
    }\nPer the research that was done on which repositories does not support repo_gpgcheck,\nchange the REPO_URL variable\
    \ and run the test."
  remediation: 'Global configuration

    Edit /etc/yum.conf and set repo_gpgcheck=1 in the [main] section.

