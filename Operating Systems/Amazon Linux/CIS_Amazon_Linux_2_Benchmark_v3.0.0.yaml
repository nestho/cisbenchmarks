- id: 1.4.2
  title: Ensure ptrace_scope is restricted
  scoring: scored
  profile:
  - Level 1
  description: The ptrace() system call provides a means by which one process (the "tracer") may observe and control the execution
    of another process (the "tracee"), and examine and change the tracee's memory and registers.
  rationale: If one application is compromised, it would be possible for an attacker to attach to other running processes
    (e.g. Bash, Firefox, SSH sessions, GPG agent, etc) to extract additional credentials and continue to expand the scope
    of their attack. Enabling restricted mode will limit the ability of a compromised process to PTRACE_ATTACH on other processes
    running under the same user. With restricted mode, ptrace will continue to work with root user.
  impact: ''
  references:
