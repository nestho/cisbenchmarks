- id: 1.1.2.6.1
  title: Ensure separate partition exists for /var/log
  scoring: scored
  profile:
  - Level 2
  description: The /var/log directory is used by system services to store log data.
  rationale: The reasoning for mounting /var/log on a separate partition is as follows. Protection from resource exhaustion
    The default installation only creates a single / partition. Since the /var/log directory contains log files which can
    grow quite large, there is a risk of resource exhaustion. It will essentially have the whole disk available to fill up
    and impact the system as a whole. Fine grained control over the mount Configuring /var/log as its own file system allows
    an administrator to set additional mount options such as noexec/nosuid/nodev. These options limit an attackers ability
    to create exploits on the system. Other options allow for specific behavior. See man mount for exact details regarding
    filesystem-independent and filesystem-specific options. Protection of log data As /var/log contains log files, care should
    be taken to ensure the security and integrity of the data and mount point.
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
    resizing, or may require the installation of additional tools solely for the purpose of resizing operations. The use of
    these additional tools may introduce their own security considerations.
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - '2. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 107
