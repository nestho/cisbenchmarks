    daemon or root'
  remediation: "-IF- at is installed on the system:\nRun the following script to:\n• /etc/at.allow:\no Create the file if\
    \ it doesn't exist\no Change owner or user root\no If group daemon exists, change to group daemon, else change group to\
    \ root\no Change mode to 640 or more restrictive\n• -IF- /etc/at.deny exists:\no Change owner or user root\no If group\
    \ daemon exists, change to group daemon, else change group to root\no Change mode to 640 or more restrictive\n#!/usr/bin/env\
    \ bash\n{\n grep -Pq -- '^daemon\\b' /etc/group && l_group=\"daemon\" || l_group=\"root\"\n [ ! -e \"/etc/at.allow\" ]\
