- id: 5.2.3.13
  title: Ensure file deletion events by users are collected
  scoring: scored
  profile:
  - Level 2
  description: 'Monitor the use of system calls associated with the deletion or renaming of files and file attributes. This
    configuration statement sets up monitoring for: • unlink - remove a file • unlinkat - remove a file attribute • rename
    - rename a file • renameat rename a file attribute system calls and tags them with the identifier "delete".'
  rationale: Monitoring these calls from non-privileged users could provide a system administrator with evidence that inappropriate
    removal of files and file attributes associated with protected files is occurring. While this audit option will look at
    all events, system administrators will want to look for specific privileged files that are being deleted or altered.
  impact: ''
  references: []
  page_start: 723
  audit_raw: "64 Bit systems\nOn disk configuration\nRun the following command to check the on disk rules:\n# {\n UID_MIN=$(awk\
    \ '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n [ -n \"${UID_MIN}\" ] && awk \"/^ *-a *always,exit/ \\\n &&/ -F *arch=b(32|64)/\
    \ \\\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&/ -S/ \\\
    \n &&(/unlink/||/rename/||/unlinkat/||/renameat/) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules\
    \ \\\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\n}\nVerify the output matches:\n-a always,exit -F arch=b64\
    \ -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k\ndelete\n-a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat\
    \ -F auid>=1000 -F auid!=unset -k\ndelete\nRunning configuration\nRun the following command to check loaded rules:\n#\
    \ {\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a\
    \ *always,exit/ \\\n &&/ -F *arch=b(32|64)/ \\\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\n\
    \ &&/ -F *auid>=${UID_MIN}/ \\\n &&/ -S/ \\\n &&(/unlink/||/rename/||/unlinkat/||/renameat/) \\\n &&(/ key= *[!-~]* *$/||/\
    \ -k *[!-~]* *$/)\" \\\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\n}\nVerify the output matches:\n-a always,exit\
    \ -F arch=b64 -S rename,unlink,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F\nkey=delete\n-a always,exit -F arch=b32\
    \ -S unlink,rename,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F\nkey=delete\n32 Bit systems\nFollow the same procedures\
    \ as for 64 bit systems and ignore any entries with b64."
