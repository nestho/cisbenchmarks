- id: 1.6.1
  title: Ensure message of the day is configured properly
  scoring: manual
  profile:
  - Level 1
  description: 'The contents of the /etc/motd file are displayed to users after login and function as a message of the day
    for authenticated users. Unix-based systems have typically displayed information about the OS release and patch level
    upon logging in to the system. This information can be useful to developers who are developing software for a particular
    OS platform. If mingetty(8) supports the following options, they display operating system information: \m - machine architecture
    \r - operating system release \s - operating system name \v - operating system version'
  rationale: Warning messages inform users who are attempting to login to the system of their legal status regarding the system
    and must include the name of the organization that owns the system and any monitoring policies that are in place. Displaying
    OS and patch level information in login banners also has the side effect of providing detailed system information to attackers
    attempting to target specific exploits of a system. Authorized users can easily get this information by running the "
    uname -a " command once they have logged in.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-6, CM-1, CM-3'
  page_start: 173
  audit_raw: 'Run the following command and verify that the contents match site policy:

    # cat /etc/motd

    Verify the output does not include information about the system name or operating

    system'
  remediation: 'Edit the files in /etc/update-motd.d/ and remove any instances of \m , \r , \s , \v or

    references to the OS platform

    - IF - required by local site policy, add the site specific "Message Of The Day" to a file in

    /etc/update-motd.d/:

    Example:

    # printf ''%s\n'' "Authorized users only. All activity may be monitored and reported." >

    /etc/update-motd.d/30-banner'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that the contents match site policy:

      # cat /etc/motd

      Verify the output does not include information about the system name or operating

      system'
    severity: medium
