- id: 5.3.1
  title: Ensure AIDE is installed
  scoring: scored
  profile:
  - Level 1
  description: Advanced Intrusion Detection Environment (AIDE) is a intrusion detection tool that uses predefined rules to
    check the integrity of files and directories in the Linux operating system. AIDE has its own database to check the integrity
    of files and directories. aide takes a snapshot of files and directories including modification times, permissions, and
    file hashes which can then be used to compare against the current state of the filesystem to detect modifications to the
    system.
  rationale: By monitoring the filesystem state compromised files can be detected to prevent or limit the exposure of accidental
    or malicious misconfigurations or modified binaries.
  impact: ''
  references:
  - '1. AIDE stable manual: http://aide.sourceforge.net/stable/manual.html'
  - '2. NIST SP 800-53 Rev. 5: AU-2'
  page_start: 776
  audit_raw: 'Run the following command and verify aide is installed:

    # rpm -q aide

    aide-<version>'
  remediation: 'Run the following command to install aide:

    # yum install aide

    Configure aide as appropriate for your environment. Consult the aide documentation for

    options.

    Initialize aide:

    Run the following commands:

    # aide --init

    # mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'
  checks:
  - type: manual_review
    info: 'Run the following command and verify aide is installed:

      # rpm -q aide

      aide-<version>'
    severity: medium
- id: 5.3.2
  title: Ensure filesystem integrity is regularly checked
  scoring: scored
  profile:
  - Level 1
  description: Periodic checking of the filesystem integrity is needed to detect changes to the filesystem.
  rationale: Periodic file checking allows the system administrator to determine on a regular basis if critical files have
    been changed in an unauthorized fashion.
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/config/aidecheck.service
  - 2. https://github.com/konstruktoid/hardening/blob/master/config/aidecheck.timer
  page_start: 778
  audit_raw: 'Run the following commands to verify a cron job scheduled to run the aide check.

    # grep -Ers ''^([^#]+\s+)?(\/usr\/s?bin\/|^\s*)aide(\.wrapper)?\s(--?\S+\s)*(--

    (check|update)|\$AIDEARGS)\b'' /etc/cron.* /etc/crontab /var/spool/cron/

    Ensure a cron job in compliance with site policy is returned.

    - OR -

    Run the following commands to verify that aidecheck.service and aidecheck.timer are

    enabled and aidcheck.timer is running

    # systemctl is-enabled aidecheck.service

    # systemctl is-enabled aidecheck.timer

    # systemctl status aidecheck.timer'
  remediation: '- IF - cron will be used to schedule and run aide check

    Run the following command:

    # crontab -u root -e

    Add the following line to the crontab:

    0 5 * * * /usr/sbin/aide --check

    - OR -

    - IF - aidecheck.service and aidecheck.timer will be used to schedule and run aide

    check:

    Create or edit the file /etc/systemd/system/aidecheck.service and add the following

    lines:

    [Unit]

    Description=Aide Check

    [Service]

    Type=simple

    ExecStart=/usr/sbin/aide --check

    [Install]

    WantedBy=multi-user.target

    Create or edit the file /etc/systemd/system/aidecheck.timer and add the following

    lines:

    [Unit]

    Description=Aide check every day at 5AM

    [Timer]

    OnCalendar=*-*-* 05:00:00

    Unit=aidecheck.service

    [Install]

    WantedBy=multi-user.target

    Run the following commands:

    # chown root:root /etc/systemd/system/aidecheck.*

    # chmod 0644 /etc/systemd/system/aidecheck.*

    # systemctl daemon-reload

    # systemctl enable aidecheck.service

    # systemctl --now enable aidecheck.timer'
  checks:
  - type: manual_review
    info: 'Run the following commands to verify a cron job scheduled to run the aide check.

      # grep -Ers ''^([^#]+\s+)?(\/usr\/s?bin\/|^\s*)aide(\.wrapper)?\s(--?\S+\s)*(--

      (check|update)|\$AIDEARGS)\b'' /etc/cron.* /etc/crontab /var/spool/cron/

      Ensure a cron job in compliance with site policy is returned.

      - OR -

      Run the following commands to verify that aidecheck.service and aidecheck.timer are

      enabled and aidcheck.timer is running

      # systemctl is-enabled aidecheck.service

      # systemctl is-enabled aidecheck.tim'
    severity: medium
