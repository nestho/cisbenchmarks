    Edit any failing files in /etc/yum.repos.d/* and set all instances starting with

    repo_gpgcheck to 1.'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n REPO_URL=\"fedoraproject.org\"\n for repo in $(grep -l \"repo_gpgcheck=0\" /etc/yum.repos.d/*\
      \ ); do\n if ! grep \"${REPO_URL}\" \"${repo}\" &>/dev/null; then\n echo \"${repo}\"\n fi\n done\n}\nPer the research\
      \ that was done on which repositories does not support repo_gpgcheck,\nchange the REPO_URL variable and run the test."
