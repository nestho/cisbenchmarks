  title: Ensure no unconfined services exist
  scoring: scored
  profile:
  - Level 1
  description: Unconfined processes run in unconfined domains
  rationale: For unconfined processes, SELinux policy rules are applied, but policy rules exist that allow processes running
    in unconfined domains almost all access. Processes running in unconfined domains fall back to using DAC rules exclusively.
    If an unconfined process is compromised, SELinux does not prevent an attacker from gaining access to system resources
