- id: 2.2.12
  title: Ensure rpcbind services are not in use
  scoring: scored
  profile:
  - Level 1
  description: The rpcbind utility maps RPC services to the ports on which they listen. RPC processes notify rpcbind when
    they start, registering the ports they are listening on and the RPC program numbers they expect to serve. The client system
    then contacts rpcbind on the server with a particular RPC program number. The rpcbind.service redirects the client to
    the proper port number so it can communicate with the requested service. Portmapper is an RPC service, which always listens
    on tcp and udp 111, and is used to map other RPC services (such as nfs, nlockmgr, quotad, mountd, etc.) to their corresponding
    port number on the server. When a remote host makes an RPC call to that server, it first consults with portmap to determine
    where the RPC server is listening.
  rationale: A small request (~82 bytes via UDP) sent to the Portmapper generates a large response (7x to 28x amplification),
    which makes it a suitable tool for DDoS attacks. If rpcbind is not required, it is recommended to remove rpcbind package
    to reduce the potential attack surface.
  impact: 'Many of the libvirt packages used by Enterprise Linux virtualization, and the nfs-utils package used for The Network
    File System (NFS), are dependent on the rpcbind package. If the rpcbind package is removed, these dependent packages will
    be removed as well. Before removing the rpcbind package, review any dependent packages to determine if they are required
    on the system. -IF- a dependent package is required: stop and mask the rpcbind.socket and rpcbind.service leaving the
