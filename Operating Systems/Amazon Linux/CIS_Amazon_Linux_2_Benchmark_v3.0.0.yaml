- id: 3.3.7
  title: Ensure reverse path filtering is enabled
  scoring: scored
  profile:
  - Level 1
  description: Setting net.ipv4.conf.all.rp_filter and net.ipv4.conf.default.rp_filter to 1 forces the Linux kernel to utilize
    reverse path filtering on a received packet to determine if the packet was valid. Essentially, with reverse path filtering,
    if the return packet does not go out the same interface that the corresponding source packet came from, the packet is
    dropped (and logged if log_martians is set).
  rationale: Setting net.ipv4.conf.all.rp_filter and net.ipv4.conf.default.rp_filter to 1 is a good way to deter attackers
    from sending your system bogus packets that cannot be responded to. One instance where this feature breaks down is if
    asymmetrical routing is employed. This would occur when using dynamic routing protocols (bgp, ospf, etc) on your system.
