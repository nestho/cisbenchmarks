  remediation: "If a local interactive users' home directory is undefined and/or doesn't exist, follow local\nsite policy\
    \ and perform one of the following:\n• Lock the user account\n• Remove the user from the system\n• Create a directory\
    \ for the user. If undefined, edit /etc/passwd and add the\nabsolute path to the directory to the last field of the user.\n\
    Run the following script to:\n• Remove excessive permissions from local interactive users home directories\n• Update the\
    \ home directory's owner\n#!/usr/bin/env bash\n{\n l_output2=\"\"\n l_valid_shells=\"^($( awk -F\\/ '$NF != \"nologin\"\
    \ {print}' /etc/shells | sed -rn\n'/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n unset a_uarr && a_uarr=() #\
    \ Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users and user home location\n a_uarr+=(\"\
    $l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print $1 \" \" $(NF-1) }'\n/etc/passwd)\"\
    \n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users before proceeding\n [ \"$l_asize \" -gt \"10000\"\
    \ ] && echo -e \"\\n ** INFO **\\n - \\\"$l_asize\\\" Local interactive\nusers found on the system\\n - This may be a\
    \ long running process\\n\"\n while read -r l_user l_home; do\n if [ -d \"$l_home\" ]; then\n l_mask='0027'\n l_max=\"\
    $( printf '%o' $(( 0777 & ~$l_mask)) )\"\n while read -r l_own l_mode; do\n if [ \"$l_user\" != \"$l_own\" ]; then\n l_output2=\"\
    $l_output2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\" is owned by:\n\\\"$l_own\\\"\\n - changing ownership to: \\\
    \"$l_user\\\"\\n\"\n chown \"$l_user\" \"$l_home\"\n fi\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_output2=\"$l_output2\\\
    n - User: \\\"$l_user\\\" Home \\\"$l_home\\\" is mode: \\\"$l_mode\\\"\nshould be mode: \\\"$l_max\\\" or more restrictive\\\
    n - removing excess permissions\\n\"\n chmod g-w,o-rwx \"$l_home\"\n fi\n done <<< \"$(stat -Lc '%U %#a' \"$l_home\")\"\
    \n else\n l_output2=\"$l_output2\\n - User: \\\"$l_user\\\" Home \\\"$l_home\\\" Doesn't exist\\n - Please\ncreate a home\
    \ in accordance with local site policy\"\n fi\n done <<< \"$(printf '%s\\n' \"${a_uarr[@]}\")\"\n if [ -z \"$l_output2\"\
