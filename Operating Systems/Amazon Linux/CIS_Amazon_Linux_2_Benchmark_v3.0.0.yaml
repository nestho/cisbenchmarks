- id: 6.1.13
  title: Ensure SUID and SGID files are reviewed
  scoring: manual
  profile:
  - Level 1
  description: The owner of a file can set the file's permissions to run with the owner's or group's permissions, even if
    the user running the program is not the owner or a member of the group. The most common reason for a SUID or SGID program
    is to enable users to perform functions (such as changing their password) that require root privileges.
  rationale: There are valid reasons for SUID and SGID programs, but it is important to identify and review such programs
    to ensure they are legitimate. Review the files returned by the action in the audit section and check to see if system
    binaries have a different checksum than what from the package. This is an indication that the binary may have been replaced.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5, AC-3, MP-2'
  page_start: 810
  audit_raw: "Run the following script to generate a list of SUID and SGID files:\n#!/usr/bin/env bash\n{\n l_output=\"\"\
    \ l_output2=\"\"\n a_arr=(); a_suid=(); a_sgid=() # initialize arrays\n # Populate array with files that will possibly\
    \ fail one of the audits\n while read -r l_mpname; do\n while IFS= read -r -d $'\\0' l_file; do\n [ -e \"$l_file\" ] &&\
    \ a_arr+=(\"$(stat -Lc '%n^%#a' \"$l_file\")\")\n done < <(find \"$l_mpname\" -xdev -not -path \"/run/user/*\" -type f\
    \ \\( -perm -2000 -o -perm -\n4000 \\) -print0)\n done <<< \"$(findmnt -Derno target)\"\n # Test files in the array\n\
    \ while IFS=\"^\" read -r l_fname l_mode; do\n if [ -f \"$l_fname\" ]; then\n l_suid_mask=\"04000\"; l_sgid_mask=\"02000\"\
    \n [ $(( $l_mode & $l_suid_mask )) -gt 0 ] && a_suid+=(\"$l_fname\")\n [ $(( $l_mode & $l_sgid_mask )) -gt 0 ] && a_sgid+=(\"\
    $l_fname\")\n fi\n done <<< \"$(printf '%s\\n' \"${a_arr[@]}\")\"\n if ! (( ${#a_suid[@]} > 0 )); then\n l_output=\"$l_output\\\
    n - There are no SUID files exist on the system\"\n else\n l_output2=\"$l_output2\\n - List of \\\"$(printf '%s' \"${#a_suid[@]}\"\
    )\\\" SUID executable\nfiles:\\n$(printf '%s\\n' \"${a_suid[@]}\")\\n - end of list -\\n\"\n fi\n if ! (( ${#a_sgid[@]}\
    \ > 0 )); then\n l_output=\"$l_output\\n - There are no SGID files exist on the system\"\n else\n l_output2=\"$l_output2\\\
    n - List of \\\"$(printf '%s' \"${#a_sgid[@]}\")\\\" SGID executable\nfiles:\\n$(printf '%s\\n' \"${a_sgid[@]}\")\\n -\
    \ end of list -\\n\"\n fi\n [ -n \"$l_output2\" ] && l_output2=\"$l_output2\\n- Review the preceding list(s) of SUID and/or\n\
