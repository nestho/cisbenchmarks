    \ output2=\"\"\n [ -f /etc/bashrc ] && BRC=\"/etc/bashrc\"\n for f in \"$BRC\" /etc/profile /etc/profile.d/*.sh ; do\n\
    \ grep -Pq '^\\s*([^#]+\\s+)?TMOUT=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9])\\b' \"$f\" && grep -Pq\n'^\\s*([^#]+;\\s*)?readonly\\\
    s+TMOUT(\\s+|\\s*;|\\s*$|=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9]))\\b' \"$f\"\n&& grep -Pq '^\\s*([^#]+;\\s*)?export\\\
    s+TMOUT(\\s+|\\s*;|\\s*$|=(900|[1-8][0-9][0-9]|[1-9][0-9]|[19]))\\b' \"$f\" &&\n output1=\"$f\"\n done\n grep -Pq '^\\\
    s*([^#]+\\s+)?TMOUT=(9[0-9][1-9]|9[1-9][0-9]|0+|[1-9]\\d{3,})\\b' /etc/profile\n/etc/profile.d/*.sh \"$BRC\" && output2=$(grep\
    \ -Ps '^\\s*([^#]+\\s+)?TMOUT=(9[0-9][1-9]|9[1-9][09]|0+|[1-9]\\d{3,})\\b' /etc/profile /etc/profile.d/*.sh $BRC)\n if\
    \ [ -n \"$output1\" ] && [ -z \"$output2\" ]; then\n echo -e \"\\nPASSED\\n\\nTMOUT is configured in: \\\"$output1\\\"\
    \\n\"\n else\n [ -z \"$output1\" ] && echo -e \"\\nFAILED\\n\\nTMOUT is not configured\\n\"\n [ -n \"$output2\" ] && echo\
    \ -e \"\\nFAILED\\n\\nTMOUT is incorrectly configured in:\n\\\"$output2\\\"\\n\"\n fi\n}"
  remediation: 'Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/

    directory and remove or edit all TMOUT=_n_ entries to follow local site policy. TMOUT

    should not exceed 900 or be equal to 0.

