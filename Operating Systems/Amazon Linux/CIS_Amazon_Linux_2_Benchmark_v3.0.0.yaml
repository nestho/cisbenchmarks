- id: 4.1.2.1
  title: Ensure at is restricted to authorized users
  scoring: scored
  profile:
  - Level 1
  description: at allows fairly complex time specifications, extending the POSIX.2 standard. It accepts times of the form
    HH:MM to run a job at a specific time of day. (If that time is already past, the next day is assumed.) You may also specify
    midnight, noon, or teatime (4pm) and you can have a time-of-day suffixed with AM or PM for running in the morning or the
    evening. You can also say what day the job will be run, by giving a date in the form month-name day with an optional year,
    or giving a date of the form MMDD[CC]YY, MM/DD/[CC]YY, DD.MM.[CC]YY or [CC]YY-MM-DD. The specification of a date must
    follow the specification of the time of day. You can also give times like now + count time-units, where the time-units
    can be minutes, hours, days, or weeks and you can tell at to run the job today by suffixing the time with today and to
    run the job tomorrow by suffixing the time with tomorrow. The /etc/at.allow and /etc/at.deny files determine which user
    can submit commands for later execution via at or batch. The format of the files is a list of usernames, one on each line.
    Whitespace is not permitted. If the file /etc/at.allow exists, only usernames mentioned in it are allowed to use at. If
    /etc/at.allow does not exist, /etc/at.deny is checked, every username not mentioned in it is then allowed to use at. An
    empty /etc/at.deny means that every user may use at. If neither file exists, only the superuser is allowed to use at.
  rationale: On many systems, only the system administrator is authorized to schedule at jobs. Using the at.allow file to
    control who can run at jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny list,
    you could potentially add a user ID to the system and forget to add it to the deny files.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 437
  audit_raw: '-IF- at is installed on the system:

