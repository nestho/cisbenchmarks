- id: 5.1.1.1
  title: Ensure rsyslog is installed
  scoring: scored
  profile:
  - Level 1
  description: The rsyslog software is recommended in environments where journald does not meet operation requirements.
  rationale: The security enhancements of rsyslog such as connection-oriented (i.e. TCP) transmission of logs, the option
    to log to database formats, and the encryption of log data en route to a central logging server) justify installing and
    configuring the package.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-12, SI-5'
  page_start: 610
  audit_raw: 'Verify rsyslog is installed.

    Run the following command:

    # rpm -q rsyslog

    Verify the output matches:

    rsyslog-<version>'
  remediation: 'Run the following command to install rsyslog:

    # yum install rsyslog'
  checks:
  - type: manual_review
    info: 'Verify rsyslog is installed.

      Run the following command:

      # rpm -q rsyslog

      Verify the output matches:

      rsyslog-<version>'
    severity: medium
- id: 5.1.1.2
