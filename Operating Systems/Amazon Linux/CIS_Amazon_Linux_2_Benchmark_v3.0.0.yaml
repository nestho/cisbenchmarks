    \ is active\"\n else\n l_output=\"$l_output\\n - iptables.service is not active\"\n fi\n if grep -Pqs '^\\h*0\\b' /sys/module/ipv6/parameters/disable;\
    \ then\n if systemctl is-enabled ip6tables.service | grep -q '^enabled'; then\n l_output=\"$l_output\\n - ip6tables.service\
    \ is enabled\"\n else\n l_output=\"$l_output\\n - ip6tables.service is not enabled\"\n fi\n if systemctl is-active ip6tables.service\
    \ | grep -q '^active'; then\n l_output=\"$l_output\\n - ip6tables.service is active\"\n else\n l_output=\"$l_output\\\
    n - ip6tables.service is not active\"\n fi\n fi\n else\n l_output=\"$l_output\\n - iptables-services is not installed\"\
    \n fi\n echo -e \"$l_output\"\n}\nReview the output and verify that one, and only one utilities' service(s) are enabled\
