    \ l_uid; do\n if [ \"$l_count\" -gt 1 ]; then\n echo -e \"Duplicate UID: \\\"$l_uid\\\" Users: \\\"$(awk -F: '($3 == n)\
    \ { print $1 }' n=$l_uid\n/etc/passwd | xargs)\\\"\"\n fi\n done < <(cut -f3 -d\":\" /etc/passwd | sort -n | uniq -c)\n\
    }"
