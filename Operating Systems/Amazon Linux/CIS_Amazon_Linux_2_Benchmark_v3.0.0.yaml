  audit_raw: "Run the following script to verify SSH private host key files are owned by the root user\nand either:\n• owned\
    \ by the group root and mode 0600 or more restrictive\n- OR -\n• owned by the group designated to own openSSH private\
    \ keys and mode 0640 or\nmore restrictive\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n if command -v ssh-keygen\
    \ &>/dev/null; then\n l_skgn=\"$(grep -Po -- '^(ssh_keys|_?ssh)\\b' /etc/group)\" # Group designated to own openSSH\n\
    keys\n l_skgid=\"$(awk -F: '($1 == \"'\"$l_skgn\"'\"){print $3}' /etc/group)\" # Get gid of group\n [ -n \"$l_skgid\"\
    \ ] && l_agroup=\"(root|$l_skgn)\" || l_agroup=\"root\"\n if [ -d /etc/ssh ]; then\n unset a_skarr && a_skarr=() # Clear\
    \ and initialize array\n while IFS= read -r -d $'\\0' l_file; do # Loop to populate array\n l_var=\"$(ssh-keygen -l -f\
    \ 2>/dev/null \"$l_file\")\"\n if [ -n \"$l_var\" ] && ! grep -Pq -- '\\h+no\\h+comment\\b' <<< \"$l_var\"; then\n a_skarr+=(\"\
    $(stat -Lc '%n^%#a^%U^%G^%g' \"$l_file\")\")\n fi\n done < <(find -L /etc/ssh -xdev -type f -print0)\n if (( ${#a_skarr[@]}\
    \ > 0 )); then\n while IFS=\"^\" read -r l_file l_mode l_owner l_group l_gid; do\n l_out2=\"\"\n [ \"$l_gid\" = \"$l_skgid\"\
    \ ] && l_pmask=\"0137\" || l_pmask=\"0177\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n if [ $(( $l_mode\
