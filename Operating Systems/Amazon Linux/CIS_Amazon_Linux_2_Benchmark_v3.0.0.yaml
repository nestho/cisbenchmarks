- id: 1.2.1
  title: Ensure GPG keys are configured
  scoring: manual
  profile:
  - Level 1
  description: The RPM Package Manager implements GPG key signing to verify package integrity during and after installation.
  rationale: It is important to ensure that updates are obtained from a valid source to protect against spoofing that could
    lead to the inadvertent installation of malware on the system. To this end, verify that GPG keys are configured correctly
    for your system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-2'
  page_start: 125
  audit_raw: "List all GPG key URLs\nEach repository should have a gpgkey with a URL pointing to the location of the GPG\n\
    key, either local or remote.\n# grep -r gpgkey /etc/yum.repos.d/*\nList installed GPG keys\nRun the following command\
    \ to list the currently installed keys. These are the active keys\nused for verification and installation of RPMs. The\
    \ packages are fake, they are\ngenerated on the fly by yum or rpm during the import of keys from the URL specified in\n\
    the repository configuration.\n#!/usr/bin/env bash\n{\n for RPM_PACKAGE in $(rpm -q gpg-pubkey); do\n echo \"RPM: ${RPM_PACKAGE}\"\
    \n RPM_SUMMARY=$(rpm -q --queryformat \"%{SUMMARY}\" \"${RPM_PACKAGE}\")\n RPM_PACKAGER=$(rpm -q --queryformat \"%{PACKAGER}\"\
    \ \"${RPM_PACKAGE}\")\n RPM_DATE=$(date +%Y-%m-%d -d \"1970-1-1+$((0x$(rpm -q --queryformat \"%{RELEASE}\"\n\"${RPM_PACKAGE}\"\
    ) ))sec\")\n RPM_KEY_ID=$(rpm -q --queryformat \"%{VERSION}\" \"${RPM_PACKAGE}\")\n echo -e \"Packager: ${RPM_PACKAGER}\\\
    nSummary: ${RPM_SUMMARY}\\nCreation date:\n${RPM_DATE}\\nKey ID: ${RPM_KEY_ID}\"\n done\n}\nExample Output:\nRPM: gpg-pubkey-f4a80eb5-53a7ff4b\n\
    Packager: CentOS-7 Key (CentOS 7 Official Signing Key) <security@centos.org>\nSummary: gpg(CentOS-7 Key (CentOS 7 Official\
    \ Signing Key) <security@centos.org>)\nCreation date: 2014-06-23\nKey ID: f4a80eb5\nThe format of the package (gpg-pubkey-f4a80eb5-53a7ff4b\
    \ ) is important to understand\nfor verification. Using the above example, it consists of three parts:\n1. The general\
    \ prefix name for all imported GPG keys: gpg-pubkey2. The version, which is the GPG key ID: f4a80eb5\n3. The release is\
    \ the date of the key in UNIX timestamp in hexadecimal: 53a7ff4b\nWith both the date and the GPG key ID, check the relevant\
    \ repositories public key page\nto confirm that the keys are indeed correct.\nQuery locally available GPG keys\nRepositories\
    \ that store their respective GPG keys on disk should do so in\n/etc/pki/rpm-gpg/. These keys are available for immediate\
