- id: 1.4.1
  title: Ensure address space layout randomization (ASLR) is enabled
  scoring: scored
  profile:
  - Level 1
  description: Address space layout randomization (ASLR) is an exploit mitigation technique which randomly arranges the address
    space of key data areas of a process.
  rationale: Randomly placing virtual memory regions will make it difficult to write memory page exploits as the memory placement
    will be consistently shifting.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 Rev. 5: CM-6'
  page_start: 140
  audit_raw: "Run the following script to verify the following kernel parameter is set in the running\nconfiguration and correctly\
    \ loaded from a kernel parameter configuration file:\n• kernel.randomize_va_space is set to 2\nNote: kernel parameters\
    \ are loaded by file and parameter order precedence. The\nfollowing script observes this precedence as part of the auditing\
    \ procedure. The\nparameters being checked may be set correctly in a file. If that file is superseded, the\nparameter\
    \ is overridden by an incorrect setting later in that file, or in a canonically later\nfile, that \"correct\" setting\
    \ will be ignored both by the script and by the system during a\nnormal kernel parameter load sequence.\n#!/usr/bin/env\
    \ bash\n{\n l_output=\"\" l_output2=\"\"\n a_parlist=(\"kernel.randomize_va_space=2\")\n l_ufwscf=\"$([ -f /etc/default/ufw\
    \ ] && awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\n/etc/default/ufw)\"\n a_searchpath=(\"/run/sysctl.d/\" \"/etc/sysctl.d/\"\
    \ \"/usr/local/lib/sysctl.d/\"\n\"/usr/lib/sysctl.d/\" \"/lib/sysctl.d/\")\n unset A_files\n declare -A A_files # Array\
    \ of \"valid\" files\n A_files+=([\"sysctl.conf\"]=\"/etc/sysctl.conf\")\n for l_searchpath in \"${a_searchpath[@]}\"\
    ; do\n if [ -d \"$l_searchpath\" ]; then\n while IFS= read -r -d $'\\0' l_filename; do\n if [ -f \"$l_filename\" ]; then\n\
    \ l_basename=\"$(basename \"$l_filename\")\"\n if [ -z \"${A_files[\"$l_basename\"]}\" ]; then\n A_files+=([\"$l_basename\"\
    ]=\"$l_filename\")\n fi\n fi\n done < <(find \"$l_searchpath\" -type f -name '*.conf' -print0)\n fi\n done\n a_sorted=()\n\
    \ while IFS= read -rd '' l_key; do\n a_sorted+=( \"$l_key\" )\n done < <(printf '%s\\0' \"${!A_files[@]}\" | sort -rz)\n\
    \ kernel_parameter_chk()\n {\n l_var=\"\" l_var2=\"\"\n l_krp=\"$(sysctl \"$l_kpname\" | awk -F= '{print $2}' | xargs)\"\
    \ # Check running configuration\n if [ \"$l_krp\" = \"$l_kpvalue\" ]; then\n l_output=\"$l_output\\n - \\\"$l_kpname\\\
    \" is correctly set to \\\"$l_krp\\\" in the running\nconfiguration\"\n else\n l_output2=\"$l_output2\\n - \\\"$l_kpname\\\
    \" is incorrectly set to \\\"$l_krp\\\" in the running\nconfiguration and should have a value of: \\\"$l_kpvalue\\\"\"\
    \n fi\n if [ -n \"$l_ufwscf\" ]; then # Check UFW kernel parameter file first\n if grep -Pqs -- \"^\\h*$l_kpname\\b\"\
    \ \"$l_$l_ufwscf\"; then\n l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" \"$l_$l_ufwscf\" | tail -n 1)\"\n\
    \ fi\n fi\n if grep -Pqs -- \"^\\h*$l_kpname\\b\" /etc/sysctl.conf; then # Check /etc/sysctl.conf parameter\nfile next\n\
    \ l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" /etc/sysctl.conf | tail -n 1)\"\n fi\n if [ -z \"$l_var\"\
    \ ]; then # If non found yet, now we loop find actual conf file parameter\nsetting based on presence\n for l_keyname in\
    \ \"${a_sorted[@]}\";do\n if grep -Pqs -- \"^\\h*$l_kpname\\b\" \"${A_files[\"$l_keyname\"]}\"; then\n l_var=\"$(grep\
    \ -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" \"${A_files[\"$l_keyname\"]}\" |\ntail -n 1)\"\n break\n fi\n done\n fi\n\
    \ if [ -n \"$l_var\" ]; then\n while IFS=\":\" read -r l_conf_file l_var2; do\n while IFS=\"=\" read -r l_fkpname l_fkpvalue;\
    \ do\n l_fkpname=\"${l_fkpname// /}\"; l_fkpvalue=\"${l_fkpvalue// /}\"\n if [ \"$l_fkpvalue\" = \"$l_kpvalue\" ]; then\n\
    \ l_output=\"$l_output\\n - \\\"$l_kpname\\\" is correctly set to \\\"$l_fkpvalue\\\" in\n\\\"$l_conf_file\\\"\\n\"\n\
    \ else\n l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is incorrectly set to \\\"$l_fkpvalue\\\"\nin \\\"$l_conf_file\\\
    \" and should have a value of: \\\"$l_kpvalue\\\"\\n\"\n fi\n done <<< \"$l_var2\"\n done <<< \"$l_var\"\n else\n l_output2=\"\
    $l_output2\\n - \\\"$l_kpname\\\" is not set in an included file\\n ** Note:\n\\\"$l_kpname\\\" May be set in a file that's\
    \ ignored by load procedure **\\n\"\n fi\n }\n while IFS=\"=\" read -r l_kpname l_kpvalue; do # Assess and check parameters\n\
    \ l_kpname=\"${l_kpname// /}\"; l_kpvalue=\"${l_kpvalue// /}\"\n if ! grep -Pqs '^\\h*0\\b' /sys/module/ipv6/parameters/disable\
    \ && grep -q '^net.ipv6.' <<<\n\"$l_kpname\"; then\n l_output=\"$l_output\\n - IPv6 is disabled on the system, \\\"$l_kpname\\\
    \" is not applicable\"\n else\n kernel_parameter_chk\n fi\n done < <(printf '%s\\n' \"${a_parlist[@]}\")\n unset A_files;\
    \ unset a_sorted # Remove arrays\n if [ -z \"$l_output2\" ]; then # Provide output from checks\n echo -e \"\\n- Audit\
    \ Result:\\n ** PASS **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - Reason(s) for audit\
    \ failure:\\n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n fi\n}"
  remediation: 'Set the following parameter in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending in

    .conf:

    • kernel.randomize_va_space = 2

    Example:

    # printf ''%s\n'' "kernel.randomize_va_space = 2" >> /etc/sysctl.d/60-kernel_sysctl.conf

    Run the following command to set the active kernel parameter:

    # sysctl -w kernel.randomize_va_space=2

    Note: If these settings appear in a canonically later file, or later in the same file, these

    settings will be overwritten'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n a_parlist=(\"kernel.randomize_va_space=2\")\n l_ufwscf=\"\
      $([ -f /etc/default/ufw ] && awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\n/etc/default/ufw)\"\n a_searchpath=(\"/run/sysctl.d/\"\
      \ \"/etc/sysctl.d/\" \"/usr/local/lib/sysctl.d/\"\n\"/usr/lib/sysctl.d/\" \"/lib/sysctl.d/\")\n unset A_files\n declare\
      \ -A A_files # Array of \"valid\" files\n A_files+=([\"sysctl.conf\"]=\"/etc/sysctl.conf\")\n for l_searchpath in \"\
      ${a_searchpath[@]}\"; do\n if [ -d \"$l_searchpath\" ]; then\n while IFS= read -r -d $'\\0' l_filename; do\n if [ -f\
      \ \"$l_filename\" ]; then\n l_basename=\"$(basename \"$l_filename\")\"\n if [ -z \"${A_files[\"$l_basename\"]}\" ];\
      \ then\n A_files+=([\"$l_basename\"]=\"$l_filename\")\n fi\n fi\n done < <(find \"$l_searchpath\" -type f -name '*.conf'\
      \ -print0)\n fi\n done\n a_sorted=()\n while IFS= read -rd '' l_key; do\n a_sorted+=( \"$l_key\" )\n done < <(printf\
      \ '%s\\0' \"${!A_files[@]}\" | sort -rz)\n kernel_parameter_chk()\n {\n l_var=\"\" l_var2=\"\"\n l_krp=\"$(sysctl \"\
      $l_kpname\" | awk -F= '{print $2}' | xargs)\" # Check running configuration\n if [ \"$l_krp\" = \"$l_kpvalue\" ]; then\n\
      \ l_output=\"$l_output\\n - \\\"$l_kpname\\\" is correctly set to \\\"$l_krp\\\" in the running\nconfiguration\"\n else\n\
      \ l_output2=\"$l_output2\\n - \\\"$l_kpname\\\" is incorrectly set to \\\"$l_krp\\\" in the running\nconfiguration and\
      \ should have a value of: \\\"$l_kpvalue\\\"\"\n fi\n if [ -n \"$l_ufwscf\" ]; then # Check UFW kernel parameter file\
      \ first\n if grep -Pqs -- \"^\\h*$l_kpname\\b\" \"$l_$l_ufwscf\"; then\n l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\\
      h*\\H+\\b\" \"$l_$l_ufwscf\" | tail -n 1)\"\n fi\n fi\n if grep -Pqs -- \"^\\h*$l_kpname\\b\" /etc/sysctl.conf; then\
      \ # Check /etc/sysctl.conf parameter\nfile next\n l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" /etc/sysctl.conf\
      \ | tail -n 1)\"\n fi\n if [ -z \"$l_var\" ]; then # If non found yet, now we loop find actual conf file parameter\n\
      setting based on presence\n for l_keyname in \"${a_sorted[@]}\";do\n if grep -Pqs -- \"^\\h*$l_kpname\\b\" \"${A_files[\"\
      $l_keyname\"]}\"; then\n l_var=\"$(grep -PHo -- \"^\\h*$l_kpname\\h*=\\h*\\H+\\b\" \"${A_files[\"$l_keyname\"]}\" |\n\
