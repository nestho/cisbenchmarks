- id: 6.2.8
  title: Ensure root path integrity
  scoring: scored
  profile:
  - Level 1
  description: The root user can execute any command on the system and could be fooled into executing programs unintentionally
    if the PATH is not set correctly.
  rationale: Including the current working directory (.) or other writable directory in root's executable path makes it likely
    that an attacker can gain superuser access by forcing an administrator operating as root to execute a Trojan horse program.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 828
  audit_raw: "Run the following script to verify root's path does not include:\n• Locations that are not directories\n• An\
    \ empty directory (::)\n• A trailing (:)\n• Current working directory (.)\n• Non root owned directories\n• Directories\
    \ that less restrictive than mode 0755\n#!/usr/bin/env bash\n{\n l_output2=\"\"\n l_pmask=\"0022\"\n l_maxperm=\"$( printf\
    \ '%o' $(( 0777 & ~$l_pmask )) )\"\n l_root_path=\"$(sudo -Hiu root env | grep '^PATH' | cut -d= -f2)\"\n unset a_path_loc\
    \ && IFS=\":\" read -ra a_path_loc <<< \"$l_root_path\"\n grep -q \"::\" <<< \"$l_root_path\" && l_output2=\"$l_output2\\\
    n - root's path contains a empty\ndirectory (::)\"\n grep -Pq \":\\h*$\" <<< \"$l_root_path\" && l_output2=\"$l_output2\\\
    n - root's path contains a\ntrailing (:)\"\n grep -Pq '(\\h+|:)\\.(:|\\h*$)' <<< \"$l_root_path\" && l_output2=\"$l_output2\\\
    n - root's path\ncontains current working directory (.)\"\n while read -r l_path; do\n if [ -d \"$l_path\" ]; then\n while\
    \ read -r l_fmode l_fown; do\n [ \"$l_fown\" != \"root\" ] && l_output2=\"$l_output2\\n - Directory: \\\"$l_path\\\" is\
    \ owned\nby: \\\"$l_fown\\\" should be owned by \\\"root\\\"\"\n [ $(( $l_fmode & $l_pmask )) -gt 0 ] && l_output2=\"\
    $l_output2\\n - Directory:\n\\\"$l_path\\\" is mode: \\\"$l_fmode\\\" and should be mode: \\\"$l_maxperm\\\" or more restrictive\"\
    \n done <<< \"$(stat -Lc '%#a %U' \"$l_path\")\"\n else\n l_output2=\"$l_output2\\n - \\\"$l_path\\\" is not a directory\"\
    \n fi\n done <<< \"$(printf \"%s\\n\" \"${a_path_loc[@]}\")\"\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit\
    \ Result:\\n *** PASS ***\\n - Root's path is correctly configured\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL\
    \ **\\n - * Reasons for audit failure * :\\n$l_output2\\n\"\n fi\n}"
  remediation: 'Correct or justify any:

    • Locations that are not directories

    • Empty directories (::)

    • Trailing (:)

    • Current working directory (.)

    • Non root owned directories

    • Directories that less restrictive than mode 0755'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output2=\"\"\n l_pmask=\"0022\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask\
      \ )) )\"\n l_root_path=\"$(sudo -Hiu root env | grep '^PATH' | cut -d= -f2)\"\n unset a_path_loc && IFS=\":\" read -ra\
      \ a_path_loc <<< \"$l_root_path\"\n grep -q \"::\" <<< \"$l_root_path\" && l_output2=\"$l_output2\\n - root's path contains\
      \ a empty\ndirectory (::)\"\n grep -Pq \":\\h*$\" <<< \"$l_root_path\" && l_output2=\"$l_output2\\n - root's path contains\
      \ a\ntrailing (:)\"\n grep -Pq '(\\h+|:)\\.(:|\\h*$)' <<< \"$l_root_path\" && l_output2=\"$l_output2\\n - root's path\n\
      contains current working directory (.)\"\n while read -r l_path; do\n if [ -d \"$l_path\" ]; then\n while read -r l_fmode\
      \ l_fown; do\n [ \"$l_fown\" != \"root\" ] && l_output2=\"$l_output2\\n - Directory: \\\"$l_path\\\" is owned\nby: \\\
      \"$l_fown\\\" should be owned by \\\"root\\\"\"\n [ $(( $l_fmode & $l_pmask )) -gt 0 ] && l_output2=\"$l_output2\\n\
      \ - Directory:\n\\\"$l_path\\\" is mode: \\\"$l_fmode\\\" and should be mode: \\\"$l_maxperm\\\" or more restrictive\"\
      \n done <<< \"$(stat -Lc '%#a %U' \"$l_path\")\"\n else\n l_output2=\"$l_output2\\n - \\\"$l_path\\\" is not a directory\"\
      \n fi\n done <<< \"$(printf \"%s\\n\" \"${a_path_loc[@]}\")\"\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit\
      \ Result:\\n *** PASS ***\\n - Root's path is correctly configured\\n\"\n else\n echo -e \"\\n- Audit Result:\\n **\
      \ FAIL **\\n - * Reasons for audit failure * :\\n$l_output2\\n\"\n fi\n}"
