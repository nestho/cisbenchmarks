- id: 4.3.1
  title: Ensure sudo is installed
  scoring: scored
  profile:
  - Level 1
  description: sudo allows a permitted user to execute a command as the superuser or another user, as specified by the security
    policy. The invoking user's real (not effective) user ID is used to determine the user name with which to query the security
    policy.
  rationale: sudo supports a plug-in architecture for security policies and input/output logging. Third parties can develop
    and distribute their own policy and I/O logging plug-ins to work seamlessly with the sudo front end. The default security
    policy is sudoers, which is configured via the file /etc/sudoers and any entries in /etc/sudoers.d. The security policy
    determines what privileges, if any, a user has to run sudo. The policy may require that users authenticate themselves
    with a password or another authentication mechanism. If authentication is required, sudo will exit if the user's password
    is not entered within a configurable time limit. This limit is policy-specific.
  impact: ''
  references:
  - 1. SUDO(8)
  - '2. NIST SP 800-53 Rev. 5: AC-6(2), AC-6(5)'
  page_start: 497
  audit_raw: 'Verify that sudo is installed.

    Run the following command:

    # rpm -q sudo

    sudo-<version>'
  remediation: 'Run the following command to install sudo

    # yum install sudo'
  checks:
  - type: manual_review
    info: 'Verify that sudo is installed.

      Run the following command:

      # rpm -q sudo

      sudo-<version>'
    severity: medium
- id: 4.3.2
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 1
  description: sudo can be configured to run only from a pseudo terminal (pseudo-pty).
  rationale: Attackers can run a malicious program using sudo which would fork a background process that remains even when
    the main program has finished executing.
  impact: 'WARNING: Editing the sudo configuration incorrectly can cause sudo to stop functioning. Always use visudo to modify
    sudo configuration files.'
  references:
  - 1. SUDO(8)
  - 2. VISUDO(8)
  page_start: 499
  audit_raw: 'Verify that sudo can only run other commands from a pseudo terminal.

    Run the following command:

    # grep -rPi ''^\h*Defaults\h+([^#\n\r]+,)?use_pty(,\h*\h+\h*)*\h*(#.*)?$'' /etc/sudoers*

    /etc/sudoers:Defaults use_pty'
  remediation: 'Edit the file /etc/sudoers with visudo or a file in /etc/sudoers.d/ with visudo -f

    <PATH_TO_FILE> and add the following line:

    Defaults use_pty

    Note:

    • sudo will read each file in /etc/sudoers.d, skipping file names that end in ~ or

    contain a . character to avoid causing problems with package manager or editor

    temporary/backup files.

    • Files are parsed in sorted lexical order. That is, /etc/sudoers.d/01_first will be

    parsed before /etc/sudoers.d/10_second.

    • Be aware that because the sorting is lexical, not numeric,

    /etc/sudoers.d/1_whoops would be loaded after /etc/sudoers.d/10_second.

    • Using a consistent number of leading zeroes in the file names can be used to

    avoid such problems.'
  checks:
  - type: manual_review
    info: 'Verify that sudo can only run other commands from a pseudo terminal.

      Run the following command:

      # grep -rPi ''^\h*Defaults\h+([^#\n\r]+,)?use_pty(,\h*\h+\h*)*\h*(#.*)?$'' /etc/sudoers*

      /etc/sudoers:Defaults use_pty'
    severity: medium
- id: 4.3.3
  title: Ensure sudo log file exists
  scoring: scored
  profile:
  - Level 1
  description: The Defaults logfile entry sets the path to the sudo log file. Setting a path turns on logging to a file; negating
    this option turns it off. By default, sudo logs via syslog.
  rationale: Defining a dedicated log file for sudo simplifies auditing of sudo commands and creation of auditd rules for
    sudo.
  impact: 'WARNING: Editing the sudo configuration incorrectly can cause sudo to stop functioning. Always use visudo to modify
    sudo configuration files. Creation of additional log files can cause disk space exhaustion if not correctly managed. You
    should configure logrotate to manage the sudo log in accordance with your local policy.'
  references:
  - 1. SUDO(8)
  - 2. VISUDO(8)
  page_start: 501
  audit_raw: 'Run the following command to verify that sudo has a custom log file configured

    # grep -rPsi

    "^\h*Defaults\h+([^#]+,\h*)?logfile\h*=\h*(\"|\'')?\H+(\"|\'')?(,\h*\H+\h*)*\h*(#.*)?$"

    /etc/sudoers*

    Example output:

    Defaults logfile="/var/log/sudo.log"'
  remediation: 'Edit the file /etc/sudoers or a file in /etc/sudoers.d/ with visudo or visudo -f <PATH

    TO FILE> and add the following line:

    Defaults logfile="<PATH TO CUSTOM LOG FILE>"

    Example

    Defaults logfile="/var/log/sudo.log"

    Note:

    • sudo will read each file in /etc/sudoers.d, skipping file names that end in ~ or

    contain a . character to avoid causing problems with package manager or editor

    temporary/backup files.

    • Files are parsed in sorted lexical order. That is, /etc/sudoers.d/01_first will be

    parsed before /etc/sudoers.d/10_second.

    • Be aware that because the sorting is lexical, not numeric,

    /etc/sudoers.d/1_whoops would be loaded after /etc/sudoers.d/10_second.

    • Using a consistent number of leading zeroes in the file names can be used to

    avoid such problems.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that sudo has a custom log file configured

      # grep -rPsi

      "^\h*Defaults\h+([^#]+,\h*)?logfile\h*=\h*(\"|\'')?\H+(\"|\'')?(,\h*\H+\h*)*\h*(#.*)?$"

      /etc/sudoers*

      Example output:

      Defaults logfile="/var/log/sudo.log"'
    severity: medium
