- id: 1.5.9
  title: Ensure NIST FIPS-validated cryptography is configured
  scoring: scored
  profile:
  - STIG
  description: 'The operating system must implement NIST FIPS-validated cryptography for the following: • provision digital
    signatures • generate cryptographic hashes • protect data requiring data-at-rest protections in accordance with applicable
    federal laws, Executive Orders, directives, policies, regulations, and standards.'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The
    operating system must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated.
  impact: 'system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to implement
    correctly preventing legitimate access from occurring. 159 | P a g e 1.6.1 Configure SELinux SELinux provides a Mandatory
    Access Control (MAC) system that greatly augments the default Discretionary Access Control (DAC) model. Under SELinux,
    every process and every object (files, sockets, pipes) on the system is assigned a security context, a label that includes
    detailed type information about the object. The kernel allows processes to access objects only if that access is explicitly
    allowed by the policy in effect. The policy defines transitions, so that a user can be allowed to run software, but the
    software can run under a different context than the user''s default. This automatically limits the damage that the software
    can do to files accessible by the calling user. The user does not need to take any action to gain this benefit. For an
    action to occur, both the traditional DAC permissions must be satisfied as well as the SELinux MAC rules. The action will
    not be allowed if either one of these models does not permit the action. In this way, SELinux rules can only make a system''s
    permissions more restrictive and secure. SELinux requires a complex policy to allow all the actions required of a system
    under normal operation. Three such policies have been designed for use with RHEL7 and are included with the system: targeted,
    strict, and mls. These are described as follows: • targeted: consists mostly of Type Enforcement (TE) rules, and a small
    number of Role-Based Access Control (RBAC) rules. Targeted restricts the actions of many types of programs, but leaves
    interactive users largely unaffected. • strict: also uses TE and RBAC rules, but on more programs and more aggressively.
    • mls: implements Multi-Level Security (MLS), which introduces even more kinds of labels (sensitivity and category) and
    rules that govern access based on these. Notes: • This section provides guidance for the configuration of the targeted
    policy. • This section only applies if SELinux is in use on the system. • Additional Mandatory Access Control systems
    exist. If a different MAC is used, such as AppArmor, configure the MAC according to its security guidance.'
  references:
  - '1. CCI: CCI-000068: The information system implements cryptographic mechanisms to'
  - '2. NIST SP 800-53 :: AC-17 (2)'
  page_start: 154
  audit_raw: 'Verify the operating system implements DoD-approved encryption to protect the

    confidentiality of remote access sessions.

    Check to see if the dracut-fips package is installed with the following command:

    # yum list installed dracut-fips

    dracut-fips-033-360.el7_2.x86_64.rpm

    If a dracut-fips package is installed, check to see if the kernel command line is configured

    to use FIPS mode with the following command:

    Note: GRUB 2 reads its configuration from the /boot/grub2/grub.cfg file on traditional

    BIOS-based machines and from the /boot/efi/EFI/redhat/grub.cfg file on UEFI

    machines.

    # grep fips /boot/grub2/grub.cfg

    /vmlinuz-3.8.0-0.40.el7.x86_64 root=/dev/mapper/rhel-root ro rd.md=0 rd.dm=0

    rd.lvm.lv=rhel/swap crashkernel=auto rd.luks=0 vconsole.keymap=us

    rd.lvm.lv=rhel/root rhgb fips=1 quiet

    154 | P a g e

    If the kernel command line is configured to use FIPS mode, check to see if the system is in

    FIPS mode with the following command:

    # cat /proc/sys/crypto/fips_enabled

    1

    If a dracut-fips package is not installed, the kernel command line does not have a FIPS

    entry, or the system has a value of 0 for fips_enabled in /proc/sys/crypto, refer to the

    remediation procedure below.'
  remediation: 'Configure the operating system to implement DoD-approved encryption by installing the

    dracut-fips package.

    To enable strict FIPS compliance, the fips=1 kernel option needs to be added to the kernel

    command line during system installation so key generation is done with FIPS- approved

    algorithms and continuous monitoring tests in place.

    Configure the operating system to implement DoD-approved encryption by following the

    steps below:

    The fips=1 kernel option needs to be added to the kernel command line during system

    installation so that key generation is done with FIPS-approved algorithms and continuous

    monitoring tests in place. Users should also ensure that the system has plenty of entropy

    during the installation process by moving the mouse around, or if no mouse is available,

    ensuring that many keystrokes are typed. The recommended amount of keystrokes is 256

    and more. Less than 256 keystrokes may generate a non-unique key.

    Install the dracut-fips package with the following command:

    # yum install dracut-fips

    Recreate the initramfs file with the following command:

    Note: This command will overwrite the existing initramfs file.

    # dracut -f

    Modify the kernel command line of the current kernel in the grub.cfg file by adding the

    following option to the GRUB_CMDLINE_LINUX key in the /etc/default/grub file and then

    rebuild the grub.cfg file:

    fips=1

    Changes to /etc/default/grub require rebuilding the grub.cfg file as follows:

    On BIOS-based machines, use the following command:

    155 | P a g e

    # grub2-mkconfig -o /boot/grub2/grub.cfg

    On UEFI-based machines, use the following command:

    # grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg

    If /boot or /boot/efi reside on separate partitions, the kernel parameter boot=<partition

    of /boot or /boot/efi> must be added to the kernel command line. You can identify a

    partition by running the df /boot or df /boot/efi command:

    # df /boot

    Filesystem 1K-blocks Used Available Use% Mounted on

    /dev/sda1 495844 53780 416464 12% /boot

    To ensure the boot= configuration option will work even if device naming changes occur

    between boots, identify the universally unique identifier (UUID) of the partition with the

    following command:

    # blkid /dev/sda1

    /dev/sda1: UUID="05c000f1-a213-759e-c7a2-f11b7424c797" TYPE="ext4"

    For the example above, append the following string to the kernel command line:

    boot=UUID=05c000f1-a213-759e-c7a2-f11b7424c797

    Reboot the system for the changes to take effect.

    156 | P a g e'
