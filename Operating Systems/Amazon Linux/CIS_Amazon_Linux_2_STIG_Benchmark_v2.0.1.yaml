    # grep services /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf

    services = nss, pam

    If the pam service is not present on all services lines, refer to the remediation procedure

    below.'
  remediation: 'Configure the operating system to implement multifactor authentication for remote access

    to privileged accounts via PAM.

    Modify all of the services lines in /etc/sssd/sssd.conf or in configuration files found

    under /etc/sssd/conf.d to include pam.

    Example: vim /etc/sssd/sssd.conf

    Add pam to the service line as shown here:

    services = nss, pam'
