- id: 3.3.3
  title: Ensure network interfaces are not in promiscuous mode
  scoring: manual
  profile:
  - STIG
  description: Network interfaces configured on the operating system must not be in promiscuous mode.
  rationale: Network interfaces in promiscuous mode allow for the capture of all network traffic visible to the system. If
    unauthorized individuals can access these applications, it may allow then to collect information such as logon IDs, passwords,
    and key exchanges between systems. If the system is being used to perform a network troubleshooting function, the use
    of these tools must be documented with the Information System Security Officer (ISSO) and restricted to only authorized
    personnel.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 362
  audit_raw: 'Verify network interfaces are not in promiscuous mode unless approved and documented.

    Check for the status with the following command:

    # ip link | grep -i promisc

    If network interfaces are found on the system in promiscuous mode and their use has not

    been approved and documented, refer to the remediation procedure below.'
  remediation: 'Configure network interfaces to turn off promiscuous mode unless approved and

    documented.

    Set the promiscuous mode of an interface to off with the following command:

    # ip link set dev <devicename> multicast off promisc off'
