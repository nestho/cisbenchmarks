- id: 1.8.10
  title: Ensure GNOME Idle activation is set
  scoring: scored
  profile:
  - STIG
  description: The operating system must initiate a session lock for the screensaver after a period of inactivity for graphical
    user interfaces. As part of this configuration idle activation has to be configured.
  rationale: A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems
    need to be able to identify when a user's session has idled and take action to initiate the session lock.
  impact: Users must log out and back in again before the system-wide settings take effect.
  references: []
  page_start: 230
  audit_raw: 'Verify the idle activation setting is configured correctly for GNOME so that when the

    operating system initiates a session lock after a 15-minute period of inactivity the

    screensaver is invoked. The screen program must be installed to lock sessions on the

    console.

    If it is installed, GNOME must be configured to enforce a session lock after a 15-minute

    delay. Check for the session lock settings with the following commands:

    # grep -i idle-activation-enabled /etc/dconf/db/local.d/*

    idle-activation-enabled=true

    If idle-activation-enabled is not set to true, refer to the remediation procedure below.

    230 | P a g e'
  remediation: 'Configure the operating system to initiate a session lock after a 15-minute period of

    inactivity for graphical user interfaces.

    Create a database to contain the system-wide screensaver settings (if it does not already

    exist) with the following command:

    # touch /etc/dconf/db/local.d/00-screensaver

    Add the setting to enable screensaver locking after 15 minutes of inactivity:

    [org/gnome/desktop/screensaver]

    idle-activation-enabled=true

    Update the system databases:

    # dconf update'
  checks:
  - type: manual_review
    info: 'Verify the idle activation setting is configured correctly for GNOME so that when the

      operating system initiates a session lock after a 15-minute period of inactivity the

      screensaver is invoked. The screen program must be installed to lock sessions on the

      console.

