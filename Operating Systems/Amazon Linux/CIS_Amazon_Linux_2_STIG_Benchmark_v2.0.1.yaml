- id: 6.2.24
  title: Ensure local interactive users' dot files are group-owned by the users group or root.
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that all local initialization (dot) files for local interactive
    users are group-owned by the users primary group or root.
  rationale: Local initialization (dot) files for interactive users are used to configure the user's shell environment upon
    logon. Malicious modification of these files could compromise accounts upon logon.
  impact: ''
  references:
  - '1. CCI: CCI-000366: The organization implements the security configuration settings.'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 970
  audit_raw: 'Verify the local initialization files of all local interactive users are group-owned by that

    user''s primary Group Identifier (GID).

    Check the home directory assignment for all non-privileged users on the system with the

    following command:

    Note: The example will be for the smithj user, who has a home directory of /home/smithj

    and a primary group of users.

    # cut -d: -f 1,4,6 /etc/passwd | egrep ":[1-4][0-9]{3}"

    smithj:1000:/home/smithj

    # grep 1000 /etc/group

    users:x:1000:smithj,jonesj,jacksons

    Note: This may miss interactive users that have been assigned a privileged User Identifier

    (UID). Evidence of interactive use may be obtained from a number of log files containing

    system logon information.

    Check the group owner of all local interactive user''s initialization files with the following

    command:

    970 | P a g e

    # ls -al /home/smithj/.*

    -rwxr-xr-x 1 smithj users 896 Mar 10 2011 .profile

    -rwxr-xr-x 1 smithj users 497 Jan 6 2007 .login

    -rwxr-xr-x 1 smithj users 886 Jan 6 2007 .something

    If all local interactive user''s initialization files are not group-owned by that user''s primary

    GID, refer to the remediation procedure below.'
  remediation: 'Change the group owner of a local interactive user''s files to the group found in

    /etc/passwd for the user. To change the group owner of a local interactive user''s home

    directory, use the following command:

    Note: The example will be for the user smithj, who has a home directory of /home/smithj,

    and has a primary group of users.

    # chgrp users /home/smithj/<file>'
  checks:
  - type: manual_review
    info: 'Verify the local initialization files of all local interactive users are group-owned by that

      user''s primary Group Identifier (GID).

      Check the home directory assignment for all non-privileged users on the system with the

      following command:

      Note: The example will be for the smithj user, who has a home directory of /home/smithj

      and a primary group of users.

      # cut -d: -f 1,4,6 /etc/passwd | egrep ":[1-4][0-9]{3}"

      smithj:1000:/home/smithj

      # grep 1000 /etc/group

      users:x:1000:smithj,jonesj,jacksons

      Not'
    severity: medium
- id: 6.2.25
  title: Ensure users' dot files have 0740 or less set.
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that all local initialization (dot) files have mode 0740 or less
    permissive.
  rationale: Local initialization (dot) files are used to configure the user's shell environment upon logon. Malicious modification
    of these files could compromise accounts upon logon.
  impact: ''
  references:
  - '1. CCI: CCI-000366: The organization implements the security configuration settings.'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 973
  audit_raw: 'Verify that all local initialization files have a mode of 0740 or less permissive.

    Check the mode on all local initialization files with the following command:

    Note: The example will be for the smithj user, who has a home directory of /home/smithj.

    # ls -al /home/smithj/.* | more

    -rwxr----- 1 smithj users 896 Mar 10 2011 .profile

    -rwxr----- 1 smithj users 497 Jan 6 2007 .login

    -rwxr----- 1 smithj users 886 Jan 6 2007 .something

    If any local initialization files have a mode more permissive than 0740, refer to the

    remediation procedure below.'
  remediation: 'Set the mode of the local initialization files to 0740 with the following command:

    Note: The example will be for the smithj user, who has a home directory of /home/smithj.

    # chmod 0740 /home/smithj/.<INIT_FILE>'
  checks:
  - type: manual_review
    info: 'Verify that all local initialization files have a mode of 0740 or less permissive.

      Check the mode on all local initialization files with the following command:

      Note: The example will be for the smithj user, who has a home directory of /home/smithj.

      # ls -al /home/smithj/.* | more

      -rwxr----- 1 smithj users 896 Mar 10 2011 .profile

      -rwxr----- 1 smithj users 497 Jan 6 2007 .login

      -rwxr----- 1 smithj users 886 Jan 6 2007 .something

      If any local initialization files have a mode more permissive than 0'
    severity: medium
