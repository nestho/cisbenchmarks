- id: 5.2.1
  title: Ensure sudo is installed
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: sudo allows a permitted user to execute a command as the superuser or another user, as specified by the security
    policy. The invoking user's real (not effective) user ID is used to determine the user name with which to query the security
    policy.
  rationale: sudo supports a plugin architecture for security policies and input/output logging. Third parties can develop
    and distribute their own policy and I/O logging plugins to work seamlessly with the sudo front end. The default security
    policy is sudoers, which is configured via the file /etc/sudoers. The security policy determines what privileges, if any,
    a user has to run sudo. The policy may require that users authenticate themselves with a password or another authentication
    mechanism. If authentication is required, sudo will exit if the user's password is not entered within a configurable time
    limit. This limit is policy-specific.
  impact: ''
  references:
  - 1. SUDO(8)
  page_start: 690
  audit_raw: 'Verify that sudo in installed.

    Run the following command:

    # rpm -q sudo

    sudo-<VERSION>'
  remediation: 'Run the following command to install sudo.

    # yum install sudo'
  checks:
  - type: manual_review
    info: 'Verify that sudo in installed.

      Run the following command:

      # rpm -q sudo

      sudo-<VERSION>'
    severity: medium
- id: 5.2.2
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'sudo can be configured to run only from a pseudo-pty Note: visudo edits the sudoers file in a safe fashion,
    analogous to vipw(8). visudo locks the sudoers file against multiple simultaneous edits, provides basic sanity checks,
    and checks for parse errors. If the sudoers file is currently being edited you will receive a message to try again later.
    The -f option allows you to tell visudo which file to edit.'
  rationale: Attackers can run a malicious program using sudo, which would again fork a background process that remains even
    when the main program has finished executing. This can be mitigated by configuring sudo to run other commands only from
    a pseudo-pty, whether I/O logging is turned on or not.
  impact: ''
  references:
  - 1. SUDO(8)
  page_start: 692
  audit_raw: 'Verify that sudo can only run other commands from a pseudo-pty

    Run the following command:

    # grep -Ei ''^\s*Defaults\s+([^#]\S+,\s*)?use_pty\b'' /etc/sudoers

    /etc/sudoers.d/*

    Defaults use_pty'
  remediation: 'Edit the file /etc/sudoers or a file in /etc/sudoers.d/ with visudo or visudo -f <PATH

    TO FILE> and add the following line:

    Defaults use_pty'
  checks:
  - type: manual_review
    info: 'Verify that sudo can only run other commands from a pseudo-pty

      Run the following command:

      # grep -Ei ''^\s*Defaults\s+([^#]\S+,\s*)?use_pty\b'' /etc/sudoers

      /etc/sudoers.d/*

      Defaults use_pty'
    severity: medium
