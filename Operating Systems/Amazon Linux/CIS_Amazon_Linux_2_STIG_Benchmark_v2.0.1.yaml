- id: '1.10'
  title: Ensure required packages for multifactor authentication are installed
  scoring: scored
  profile:
  - STIG
  description: The operating system must have the required packages for multifactor authentication installed.
  rationale: Using an authentication device, such as a CAC or token that is separate from the information system, ensures
    that even if the information system is compromised, that compromise will not affect credentials stored on the authentication
    device. Multifactor solutions that require devices separate from information systems gaining access include, for example,
    hardware tokens providing time-based or challenge-response authenticators and smart cards such as the U.S. Government
    Personal Identity Verification card and the DoD Common Access Card. A privileged account is defined as an information
    system account with authorizations of a privileged user. Remote access is access to DoD nonpublic information systems
    by an authorized user (or an information system) communicating through an external, non-organization-controlled network.
    Remote access methods include, for example, dial-up, broadband, and wireless. This requirement only applies to components
    where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability).
    This does not apply to authentication for the purpose of configuring the device itself (management). 247 | P a g e
  impact: ''
  references:
  - '1. CCI-001948: The information system implements multifactor authentication for'
  - '2. NIST SP 800-53 Revision 4 :: IA-2 (11)'
  page_start: 247
  audit_raw: 'Verify the operating system has the packages required for multifactor authentication

    installed.

    Check for the presence of the packages required to support multifactor authentication with

    the following commands:

    # yum list installed esc

    esc-1.1.0-26.el7.noarch.rpm

    # yum list installed pam_pkcs11

    pam_pkcs11-0.6.2-14.el7.noarch.rpm

    If the esc and pam_pkcs11 packages are not installed, refer to the remediation procedure

    below.'
  remediation: 'To configure the operating system to implement multifactor authentication by installing

    the required packages.

    Install the esc and pam_pkcs11 packages on the system with the following command:

    # yum install esc pam_pkcs11'
  checks:
  - type: manual_review
    info: 'Verify the operating system has the packages required for multifactor authentication

      installed.

      Check for the presence of the packages required to support multifactor authentication with

      the following commands:

      # yum list installed esc

      esc-1.1.0-26.el7.noarch.rpm

      # yum list installed pam_pkcs11

      pam_pkcs11-0.6.2-14.el7.noarch.rpm

      If the esc and pam_pkcs11 packages are not installed, refer to the remediation procedure

      below.'
    severity: medium
- id: '1.11'
  title: Ensure anti-virus is installed and running
  scoring: manual
  profile:
  - STIG
  description: The operating system must have virus scanning software installed.
  rationale: Virus scanning software can be used to protect a system from penetration from computer viruses and to limit their
    spread through intermediate systems. The virus scanning software should be configured to perform scans dynamically on
    accessed files. If this capability is not available, the system must be configured to scan, at a minimum, all altered
    files on the system on a daily basis. If the system processes inbound SMTP mail, the virus scanner must be configured
    to scan all received mail.
  impact: ''
  references:
  - '1. CCI-001668: The organization employs malicious code protection mechanisms at'
  - '2. NIST SP 800-53 :: SI-3 a'
  page_start: 250
  audit_raw: 'Verify an anti-virus solution is installed on the system. The anti-virus solution may be

    bundled with an approved host-based security solution.

    If virus scanning software is not installed, refer to the remediation procedure below.'
  remediation: 'Install an antivirus solution on the system.

    Document which solution is installed on the system with the ISSO.'
  checks:
  - type: manual_review
    info: 'Verify an anti-virus solution is installed on the system. The anti-virus solution may be

      bundled with an approved host-based security solution.

      If virus scanning software is not installed, refer to the remediation procedure below.'
    severity: medium
