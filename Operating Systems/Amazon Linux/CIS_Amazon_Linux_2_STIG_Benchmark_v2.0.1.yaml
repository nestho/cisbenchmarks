- id: 4.1.3.13
  title: Ensure login and logout events are collected
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  - STIG
  description: 'Monitor login and logout events. The parameters below track changes to files associated with login/logout
    events. • The file /var/log/lastlog maintain records of the last time a user successfully logged in. • The /var/run/faillock/
    directory maintains records of login failures via the pam_faillock module. Note: Reloading the auditd config to set active
    settings requires the auditd service to be restarted, and may require a system reboot.'
  rationale: Monitoring login/logout events could provide a system administrator with information associated with brute force
    attacks against user logins.
  impact: ''
  references:
  - '1. CCI: CCI-000126: The organization determines that the organization-defined subset'
  - '2. NIST SP 800-53 :: AU-2 d'
  page_start: 553
  audit_raw: 'Run the following commands:

    # grep logins /etc/audit/rules.d/*.rules

    # auditctl -l | grep logins

    Verify output of both includes:

    -w /var/log/lastlog -p wa -k logins

    -w /var/run/faillock/ -p wa -k logins

    553 | P a g e'
  remediation: 'Edit or create a file in the /etc/audit/rules.d/ directory ending in .rules

    Example: vi /etc/audit/rules.d/50-logins.rules

    Add the following lines:

    -w /var/log/lastlog -p wa -k logins

    -w /var/run/faillock/ -p wa -k logins'
