  title: Ensure shadow file is configured to use only encrypted representations of passwords
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured to use the shadow file to store only encrypted representations of passwords.
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords encrypted
    with a weak algorithm are no more protected than if they are kept in plain text.
  impact: ''
  references: []
  page_start: 846
