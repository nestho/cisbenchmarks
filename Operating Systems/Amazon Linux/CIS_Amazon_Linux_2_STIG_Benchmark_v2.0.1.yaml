- id: 1.1.2
  title: Ensure /tmp is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - STIG
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set the noexec option on the mount, making /tmp useless
    for an attacker to install executable code. It would also prevent an attacker from establishing a hardlink to a system
    setuid program and wait for it to be updated. Once the program was updated, the hardlink would be broken and the attacker
    would have his own copy of the program. If the program happened to have a security vulnerability, the attacker could continue
    to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating a separate partition
    for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a default installation a disk-based /tmp will essentially have the whole disk available, as it only creates a single
    / partition. On the other hand, a RAM-based /tmp as with tmpfs will almost certainly be much smaller, which can lead to
    applications filling up the filesystem much more easily. 34 | P a g e
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  page_start: 34
  audit_raw: 'Run the following command and verify output shows /tmp to tmpfs or a system partition:

    # findmnt -n /tmp

    /tmp tmpfs tmpfs rw,nosuid,nodev,noexec

    If /etc/fstab is used: run the following command and verify that tmpfs has been mounted

    to tmpfs, or a system partition has been created for /tmp

    # grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#''

    tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 0

    OR If systemd tmp.mount file is used: run the following command and verify that tmp.mount

    is enabled:

    # systemctl show "tmp.mount" | grep -i unitfilestate

    UnitFileState=enabled

    35 | P a g e'
  remediation: 'Create or update an entry for /tmp in either /etc/fstab OR in a systemd tmp.mount file:

    If /etc/fstab is used: configure /etc/fstab as appropriate.

    _ Example:_

    tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0

    Run the following command to remount /tmp

    # mount -o remount,noexec,nodev,nosuid /tmp

    OR if systemd tmp.mount file is used: run the following command to create the file

    /etc/systemd/system/tmp.mount if it doesn''t exist:

    # [ ! -f /etc/systemd/system/tmp.mount ] && cp -v

    /usr/lib/systemd/system/tmp.mount /etc/systemd/system/

    Edit the file /etc/systemd/system/tmp.mount:

    [Mount]

    What=tmpfs

    Where=/tmp

    Type=tmpfs

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Run the following command to reload the systemd daemon:

    # systemctl daemon-reload

    Run the following command to unmask and start tmp.mount:

    # systemctl --now unmask tmp.mount'
  checks:
  - type: command
    command: '# grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#'' && # systemctl show "tmp.mount" | grep -i unitfilestate'
    expected: 'If /etc/fstab is used: run the following command and verify that tmpfs has been mounted'
    severity: medium
    info: 'Run the following command and verify output shows /tmp to tmpfs or a system partition:

