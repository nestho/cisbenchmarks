- id: 1.8.12
  title: Ensure GNOME Lock Delay is configured
  scoring: scored
  profile:
  - STIG
  description: The operating system must initiate a session lock for graphical user interfaces when the screensaver is activated.
    Please ensure the screensaver contains the lock delay system wide setting.
  rationale: A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems
    need to be able to identify when a user's session has idled and take action to initiate the session lock.
  impact: Users must log out and back in again before the system-wide settings take effect.
  references: []
  page_start: 235
  audit_raw: 'Verify the lock delay setting is included in the system wide screensaver setting for the

    operating system.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable. The

    screen program must be installed to lock sessions on the console.

    If GNOME is installed, check to see a session lock occurs when the screensaver is activated

    with the following command:

    # grep -i lock-delay /etc/dconf/db/local.d/*

    lock-delay=uint32 5

    If the lock-delay setting is missing, or is not set to 5 or less, and uint32 is not included

    along with the integer key values as shown. Refer to the remediation procedure below.

    235 | P a g e'
  remediation: 'Configure the operating system to initiate a session lock for graphical user interfaces when

    a screensaver is activated.

    Create a database to contain the system-wide screensaver settings (if it does not already

    exist) with the following command:

    # touch /etc/dconf/db/local.d/00-screensaver

    Add the setting to enable session locking when a screensaver is activated:

    The uint32 must be included along with the integer key values as shown.

    [org/gnome/desktop/screensaver]

    lock-delay=uint32 5

    Update the system databases:

    # dconf update'
  checks:
  - type: manual_review
    info: 'Verify the lock delay setting is included in the system wide screensaver setting for the

      operating system.

      Note: If the system does not have GNOME installed, this requirement is Not Applicable. The

      screen program must be installed to lock sessions on the console.

