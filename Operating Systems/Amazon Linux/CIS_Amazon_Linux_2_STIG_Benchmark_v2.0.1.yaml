- id: 1.4.2
  title: Ensure permissions on bootloader config are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The grub configuration file contains information on boot settings and passwords for unlocking boot options.
    The grub2 configuration is usually grub.cfg. On newer grub2 systems the encrypted bootloader password is contained in
    user.cfg. If the system uses UEFI, /boot/efi is a vfat filesystem. The vfat filesystem itself doesn't have the concept
    of permissions but can be mounted under Linux with whatever permissions desired.
  rationale: Setting the permissions to read and write for root only prevents non-root users from seeing the boot parameters
