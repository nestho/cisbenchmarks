- id: 5.5.5
  title: Ensure default user umask is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - STIG
  description: 'The user file-creation mode mask (umask) is use to determine the file permission for newly created directories
    and files. In Linux, the default permissions for any newly created directory is 0777 (rwxrwxrwx), and for any newly created
    file it is 0666 (rw-rw-rw-). The umask modifies the default Linux permissions by restricting (masking) these permissions.
    The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting file
    mode. umask can be set with either octal or Symbolic values: • Octal (Numeric) Value - Represented by either three or
    four digits. ie umask 0027 or umask 027. If a four digit umask is used, the first digit is ignored. The remaining three
    digits effect the resulting permissions for user, group, and world/other respectively. • Symbolic Value - Represented
    by a comma separated list for User u, group g, and world/other o. The permissions listed are not masked by umask. ie a
    umask set by umask u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created
    directory with file mode drwxr-x--- and a newly created file with file mode rw-r-----. The default umask can be set to
    use the pam_umask module or in a System Wide Shell Configuration File. The user creating the directories or files has
    the discretion of changing the permissions via the chmod command, or choosing a different default umask by adding the
    umask command into a User Shell Configuration File, ( .bash_profile or .bashrc), in their home directory. 863 | P a g
    e Setting the default umask: • pam_umask module: o will set the umask according to the system default in /etc/login.defs
    and user settings, solving the problem of different umask settings with different shells, display managers, remote sessions
    etc. o umask=<mask> value in the /etc/login.defs file is interpreted as Octal o Setting USERGROUPS_ENAB to yes in /etc/login.defs
    (default): ▪ will enable setting of the umask group bits to be the same as owner bits. (examples: 022 -> 002, 077 -> 007)
    for non-root users, if the uid is the same as gid, and username is the same as the <primary group name> ▪ userdel will
    remove the user''s group if it contains no more members, and useradd will create by default a group with the name of the
    user • System Wide Shell Configuration File: o /etc/profile - used to set system wide environmental variables on users
    shells. The variables are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial
    PATH or PS1 for all shell users of the system. is only executed for interactive login shells, or shells executed with
    the --login parameter. o /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended
    to place your configuration in a shell script within /etc/profile.d to set your own system wide environmental variables.
    o /etc/bashrc - System wide version of .bashrc. In Fedora derived distributions, etc/bashrc also invokes /etc/profile.d/*.sh
    if non-login shell, but redirects output to /dev/null if non-interactive. Is only executed for interactive shells or if
    BASH_ENV is set to /etc/bashrc. User Shell Configuration Files: • ~/.bash_profile - Is executed to configure your shell
    before the initial command prompt. Is only read by login shells. • ~/.bashrc - Is executed for interactive shells. only
    read by a shell that''s both interactive and non-login The operating system must be configured so that user and group
    account administration utilities are configured to store only encrypted representations of passwords.'
  rationale: Setting a secure default value for umask ensures that users make a conscious choice about their file permissions.
    A permissive umask value could result in directories or files with excessive permissions that can be read and/or written
    to by unauthorized users. 864 | P a g e Passwords need to be protected at all times, and encryption is the standard method
    for protecting passwords. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
    Passwords encrypted with a weak algorithm are no more protected than if they are kept in plain text.
  impact: ''
  references: []
  page_start: 863
  audit_raw: 'Run the following to verify:

    • A default user umask is set to enforce a newly created directories'' permissions to be

    750 (drwxr-x---), and a newly created file''s permissions be 640 (rw-r-----), or

    more restrictive

    • No less restrictive System Wide umask is set

    Run the following script to verify that a default user umask is set enforcing a newly created

    directories''s permissions to be 750 (drwxr-x---), and a newly created file''s permissions be

    640 (rw-r-----), or more restrictive:

    #!/bin/bash

    passing=""

    grep -Eiq ''^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b'' /etc/login.defs && grep

    -Eqi ''^\s*USERGROUPS_ENAB\s*"?no"?\b'' /etc/login.defs && grep -Eq

    ''^\s*session\s+(optional|requisite|required)\s+pam_umask\.so\b''

    /etc/pam.d/common-session && passing=true

    grep -REiq ''^\s*UMASK\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\b'' /etc/profile*

    /etc/bashrc* && passing=true

    [ "$passing" = true ] && echo "Default user umask is set"

    Verify output is: "Default user umask is set"

    Run the following to verify that no less restrictive system wide umask is set:

    # grep -RPi ''(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][06]\b|[0-7][01][0-7]\b|[0-7][0-7][06]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(

    ,o=[rwx]{0,3})?\b)'' /etc/login.defs /etc/profile* /etc/bashrc*

    No file should be returned

    865 | P a g e

    Verify the user and group account administration utilities are configured to store only

    encrypted representations of passwords. The strength of encryption that must be used to

    hash passwords for all accounts is "SHA512".

    Check that the system is configured to create "SHA512" hashed passwords with the

    following command:

    # grep -i sha512 /etc/libuser.conf

    crypt_style = sha512

    If the "crypt_style" variable is not set to "sha512", is not in the defaults section, is

    commented out, or does not exist, this is a finding.'
  remediation: 'Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/ directory

    and remove or edit all umask entries to follow local site policy. Any remaining entries

    should be: umask 027, umask u=rwx,g=rx,o= or more restrictive.

    Configure umask in one of the following files:

    • A file in the /etc/profile.d/ directory ending in .sh

    • /etc/profile

    • /etc/bashrc

    Example:

    # vi /etc/profile.d/set_umask.sh

    umask 027

    Run the following command and remove or modify the umask of any returned files:

    # grep -RPi ''(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][06]\b|[0-7][01][0-7]\b|[0-7][0-7][06]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}(

    ,o=[rwx]{0,3})?\b)'' /etc/login.defs /etc/profile* /etc/bashrc*

    Follow one of the following methods to set the default user umask:

    Edit /etc/login.defs and edit the UMASK and USERGROUPS_ENAB lines as follows:

    UMASK 027

    USERGROUPS_ENAB no

    Edit the files /etc/pam.d/password-auth and /etc/pam.d/system-auth and add or edit the

    following:

    session optional pam_umask.so

    OR Configure umask in one of the following files:

    • A file in the /etc/profile.d/ directory ending in .sh

    • /etc/profile

    • /etc/bashrc

    Example: /etc/profile.d/set_umask.sh

    umask 027

    Note: this method only applies to bash and shell. If other shells are supported on the

    system, it is recommended that their configuration files also are checked.

    866 | P a g e

    Configure the operating system to store only SHA512 encrypted representations of

    passwords.

    Add or update the following line in "/etc/libuser.conf" in the [defaults] section:

    crypt_style = sha512

    868 | P a g e'
  checks:
  - type: command
    command: grep -Eiq '^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b' /etc/login.defs && grep && grep -REiq '^\s*UMASK\s+\s*(0[0-7][2-7]7|[0-7][27]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\b'
      /etc/profile*
    expected: Run the following script to verify that a default user umask is set enforcing a newly created
    severity: medium
    info: 'Run the following to verify:

      • A default user umask is set to enforce a newly created directories'' permissions to be

      750 (drwxr-x---), and a newly created file''s permissions be 640 (rw-r-----), or

      more restrictive

      • No less restrictive System Wide umask is set

      Run the following script to verify that a default user umask is set enforcing a newly created

      directories''s permissions to be 750 (drwxr-x-'
- id: 5.5.7
  title: Ensure multi-factor authentication is enable for users
  scoring: scored
  profile:
  - STIG
  description: The operating system must uniquely identify and must authenticate organizational users (or processes acting
    on behalf of organizational users) using multi-factor authentication.
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity. 870 | P a g
    e'
  impact: ''
  references:
  - '1. CCI: CCI-000766: The information system implements multifactor authentication for'
  - '2. NIST SP 800-53 :: IA-2 (2)'
  page_start: 870
  audit_raw: 'Verify the operating system requires organizational users to use multifactor authentication.

    Check to see if smartcard authentication is enforced on the system:

    # authconfig --test | grep "pam_pkcs11 is enabled"

    If no results are returned, refer to the remediation procedure below.

    Check to see if smartcard removal action is set:

    # authconfig --test | grep "smartcard removal action"

    If smartcard removal action is blank, refer to the remediation procedure below.

    Check to see if smartcard module is set:

    # authconfig --test | grep "smartcard module"

    If smartcard module is blank, refer to the remediation procedure below.'
  remediation: 'Configure the operating system to require individuals to be authenticated with a

    multifactor authenticator.

    Enable smartcard logons with the following commands:

    # authconfig --enablesmartcard --smartcardaction=0 --update

    # authconfig --enablerequiresmartcard -update

    Modify the /etc/pam_pkcs11/pkcs11_eventmgr.conf file to uncomment the following line:

    Example: vim /etc/pam_pkcs11/pkcs11_eventmgr.conf

    Uncomment the following line:

    /usr/X11R6/bin/xscreensaver-command -lock

    Note: Modify the /etc/pam_pkcs11/pam_pkcs11.conf file to use the cackey module if

    required.'
  checks:
  - type: command
    command: '# authconfig --test | grep "pam_pkcs11 is enabled" && # authconfig --test | grep "smartcard removal action"
