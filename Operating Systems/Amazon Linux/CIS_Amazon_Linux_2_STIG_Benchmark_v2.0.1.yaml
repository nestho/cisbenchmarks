    active = yes

    direction = out

    path = /sbin/audisp-remote

    type = always

    format = string

    If the direction setting is not set to out, or the line is commented out, refer to the

    remediation procedure below.

    If the path setting is not set to /sbin/audisp-remote, or the line is commented out, refer to

    the remediation procedure below.

    If the type setting is not set to always, or the line is commented out, refer to the

    remediation procedure below.

