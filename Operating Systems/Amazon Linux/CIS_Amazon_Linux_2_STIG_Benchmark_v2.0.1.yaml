  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - STIG
  description: 'Single user mode (rescue mode) is used for recovery when the system detects an issue during boot or by manual
    selection from the bootloader. Note: The systemctl option --fail is synonymous with --job-mode=fail. Using either is acceptable.'
  rationale: Requiring authentication in single user mode (rescue mode) prevents an unauthorized user from rebooting the system
    into single user to gain root privileges without credentials.
  impact: ''
  references:
