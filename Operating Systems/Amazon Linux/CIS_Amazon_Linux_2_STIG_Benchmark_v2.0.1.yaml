    specific system call). All audit records will be tagged with the identifier "access." Note: Systems may have been customized
    to change the default UID_MIN. To confirm the UID_MIN for your system, run the following command: # awk ''/^\s*UID_MIN/{print
    $2}'' /etc/login.defs If your systems'' UID_MIN is not 1000, replace audit>=1000 with audit>=<UID_MIN for your system>
    in the Audit and Remediation procedures. Reloading the auditd config to set active settings may require a system reboot.'
  rationale: Failed attempts to open, create or truncate files could be an indication that an individual or process is trying
    to gain unauthorized access to the system. 544 | P a g e
