- id: 5.5.4
  title: Ensure default user shell timeout is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - STIG
  description: 'TMOUT is an environmental setting that determines the timeout of a shell in seconds. • TMOUT=n - Sets the
    shell timeout to n seconds. A setting of TMOUT=0 disables timeout. • readonly TMOUT- Sets the TMOUT environmental variable
    as readonly, preventing unwanted modification during run-time. • export TMOUT - exports the TMOUT variable System Wide
    Shell Configuration Files: • /etc/profile - used to set system wide environmental variables on users shells. The variables
    are sometimes the same ones that are in the .bash_profile, however this file is used to set an initial PATH or PS1 for
    all shell users of the system. is only executed for interactive login shells, or shells executed with the --login parameter.
    • /etc/profile.d - /etc/profile will execute the scripts within /etc/profile.d/*.sh. It is recommended to place your configuration
    in a shell script within /etc/profile.d to set your own system wide environmental variables. • /etc/bashrc - System wide
    version of .bashrc. In Fedora derived distributions, etc/bashrc also invokes /etc/profile.d/*.sh if non-login shell, but
    redirects output to /dev/null if non-interactive. Is only executed for interactive shells or if BASH_ENV is set to /etc/bashrc.'
  rationale: Setting a timeout value reduces the window of opportunity for unauthorized user access to another user's shell
    session that has been left unattended. It also ends the inactive session and releases the resources associated with that
    session. 860 | P a g e
  impact: ''
  references:
  - '1. CCI-001133: The information system terminates the network connection associated'
  - '2. NIST SP 800-53 :: SC-10'
  page_start: 860
  audit_raw: "Run the following script to verify that TMOUT is configured to: include a timeout of no more\nthan 900 seconds,\
    \ to be readonly, to be exported, and is not being changed to a longer\ntimeout.\n#!/bin/bash\noutput1=\"\" output2=\"\
    \"\n[ -f /etc/bashrc ] && BRC=\"/etc/bashrc\"\nfor f in \"$BRC\" /etc/profile /etc/profile.d/*.sh ; do\n grep -Pq '^\\\
    s*([^#]+\\s+)?TMOUT=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9])\\b'\n\"$f\" && grep -Pq '^\\s*([^#]+;\\s*)?readonly\\s+TMOUT(\\\
    s+|\\s*;|\\s*$|=(900|[18][0-9][0-9]|[1-9][0-9]|[1-9]))\\b' \"$f\" && grep -Pq\n'^\\s*([^#]+;\\s*)?export\\s+TMOUT(\\s+|\\\
    s*;|\\s*$|=(900|[1-8][0-9][0-9]|[1-9][09]|[1-9]))\\b' \"$f\" && output1=\"$f\"\ndone\ngrep -Pq '^\\s*([^#]+\\s+)?TMOUT=(9[0-9][1-9]|9[1-9][0-9]|0+|[1-9]\\\
    d{3,})\\b'\n/etc/profile /etc/profile.d/*.sh \"$BRC\" && output2=$(grep -Ps\n'^\\s*([^#]+\\s+)?TMOUT=(9[0-9][1-9]|9[1-9][0-9]|0+|[1-9]\\\
    d{3,})\\b'\n/etc/profile /etc/profile.d/*.sh $BRC)\nif [ -n \"$output1\" ] && [ -z \"$output2\" ]; then\n echo -e \"\\\
    nPASSED\\n\\nTMOUT is configured in: \\\"$output1\\\"\\n\"\nelse\n [ -z \"$output1\" ] && echo -e \"\\nFAILED\\n\\nTMOUT\
    \ is not configured\\n\"\n [ -n \"$output2\" ] && echo -e \"\\nFAILED\\n\\nTMOUT is incorrectly configured\nin: \\\"$output2\\\
    \"\\n\"\nfi"
  remediation: 'Review /etc/bashrc, /etc/profile, and all files ending in *.sh in the /etc/profile.d/

    directory and remove or edit all TMOUT=_n_ entries to follow local site policy. TMOUT should

    not exceed 900 or be equal to 0.

    Configure TMOUT in one of the following files:

