- id: 1.8.6
  title: Ensure GNOME Screensaver period of inactivity is configured
  scoring: scored
  profile:
  - STIG
  description: The operating system must initiate a screensaver after a 15-minute period of inactivity for graphical user
    interfaces.
  rationale: A session time-out lock with the screensaver is a temporary action taken when a user stops work and moves away
    from the immediate physical vicinity of the information system but does not log out because of the temporary nature of
    the absence. Rather than relying on the user to manually lock their operating system session prior to vacating the vicinity,
    operating systems need to be able to identify when a user's session has idled and take action to initiate the session
    lock. The screensaver is implemented at the point where session activity can be determined and/or controlled.
  impact: Users must log out and back in again before the system-wide settings take effect.
  references: []
  page_start: 220
  audit_raw: 'Verify the operating system initiates a screensaver after a 15-minute period of inactivity

    for graphical user interfaces.

    The screen program must be installed to lock sessions on the console.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Check to see if GNOME is configured to display a screensaver after a 15 minute delay with

    the following command:

    # grep -i idle-delay /etc/dconf/db/local.d/*

    idle-delay=uint32 900

    If the idle-delay setting is missing or is not set to 900 or less, refer to the remediation

    procedure below.

    220 | P a g e'
  remediation: 'Configure the operating system to initiate a screensaver after a 15-minute period of

    inactivity for graphical user interfaces.

    Create a database to contain the system-wide screensaver settings (if it does not already

    exist) with the following command:

    # touch /etc/dconf/db/local.d/00-screensaver

    Edit /etc/dconf/db/local.d/00-screensaver and add or update the following lines:

    Set the lock time out to 900 seconds before the session is considered idle

    You must include the uint32 along with the integer key values as shown.

    [org/gnome/desktop/session]

    idle-delay=uint32 900

    Update the system databases:

    # dconf update'
  checks:
  - type: manual_review
    info: 'Verify the operating system initiates a screensaver after a 15-minute period of inactivity

      for graphical user interfaces.

      The screen program must be installed to lock sessions on the console.

      Note: If the system does not have GNOME installed, this requirement is Not Applicable.

      Check to see if GNOME is configured to display a screensaver after a 15 minute delay with

      the following command:

      # grep -i idle-delay /etc/dconf/db/local.d/*

      idle-delay=uint32 900

      If the idle-delay setting is missing or i'
    severity: medium
- id: 1.8.7
  title: Ensure screensaver lock-enabled is set
  scoring: scored
  profile:
  - STIG
  description: The operating system must prevent a user from overriding the screensaver lock-enabled setting for the graphical
    user interface.
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. The ability to enable/disable a session lock
    is given to the user by default. Disabling the user’s ability to disengage the graphical user interface session lock provides
    the assurance that all sessions will lock after the specified period of time.
  impact: ''
  references:
  - '1. CCI-000057: The information system initiates a session lock after the organizationdefined time period of inactivity'
  - '2. NIST SP 800-53 :: AC-11 a'
  page_start: 222
