      /etc/audisp/audisp-remote.conf 0100640 root root

      /usr/bin/passwd 010'
    severity: medium
- id: 6.1.16
  title: Ensure all world-writable directorys are owned by root, sys, bin, or an application User Identifier
  scoring: manual
  profile:
  - STIG
  description: The Linux operating system must be configured so that all world-writable directories are owned by root, sys,
    bin, or an application user.
  rationale: If a world-writable directory is not owned by root, sys, bin, or an application User Identifier (UID), unauthorized
    users may be able to modify files created by others. The only authorized public directories are those temporary directories
    supplied with the system or those designed to be temporary file repositories. The setting is normally reserved for directories
    used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write
    access.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 917
  audit_raw: 'The following command will discover and print world-writable directories that are not

    owned by a system account, assuming only system accounts have a UID lower than 1000.

    Run it once for each local partition [PART]:

    # find [PART] -xdev -type d -perm -0002 -uid +999 -print

    If there is output, this is a finding.'
  remediation: 'All directories in local partitions which are world-writable should be owned by root or

    another system account. If any world-writable directories are not owned by a system

    account, this should be investigated. Following this, the files should be deleted or assigned

    to an appropriate group.

    917 | P a g e'
