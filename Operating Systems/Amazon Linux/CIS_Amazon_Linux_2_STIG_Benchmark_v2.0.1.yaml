- id: 1.8.3
  title: Ensure GDM session lock is enabled
  scoring: scored
  profile:
  - STIG
  description: The Red Hat Enterprise Linux operating system must enable a user session lock until that user re-establishes
    access using established identification and authentication procedures.
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, the session lock must remain in place until the user re-authenticates. No other activity
    aside from re-authentication must unlock the system.
  impact: ''
  references: []
  page_start: 214
  audit_raw: 'Run the following command to verify lock-enabled=true

    # grep -i ''lock-enabled'' /etc/dconf/db/*.d/*

    lock-enabled=true

    214 | P a g e'
  remediation: 'Edit or create the file /etc/dconf/profile/gdm and add the following:

    user-db:user

    system-db:gdm

    file-db:/usr/share/gdm/greeter-dconf-defaults

    Edit or create a file in /etc/dconf/db/gdm.d/ and add the following: _(This is typically

    /etc/dconf/db/gdm.d/00-screensaver)

    [org/gnome/desktop/screensaver]

    # Set this to true to lock the screen when the screensaver activates

    lock-enabled=true

    Run the following command to update the system databases:

    # dconf update

    Note: Users must log out and back in again before the system-wide settings take effect.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify lock-enabled=true

      # grep -i ''lock-enabled'' /etc/dconf/db/*.d/*

      lock-enabled=true

      214 | P a g e'
    severity: medium
- id: 1.8.4
  title: Ensure the graphical user Ctrl-Alt-Delete key sequence is disabled
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled in the Graphical
    User Interface.
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete
    sequence is reduced because the user will be prompted before any action is taken.
  impact: ''
  references:
  - '1. CCI: CCI-000366: The organization implements the security configuration settings.'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 216
  audit_raw: 'Note: If the operating system does not have a graphical user interface installed, this

    requirement is Not Applicable.

    Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete is

    pressed.

    Check that the ctrl-alt-del.target is masked and not active in the graphical user interface

    with the following command:

    # grep logout /etc/dconf/db/local.d/*

    logout=''''

    If "logout" is not set to use two single quotations, or is missing, this is a finding.

    216 | P a g e'
  remediation: 'Configure the system to disable the Ctrl-Alt-Delete sequence for the graphical user

    interface with the following command:

    # touch /etc/dconf/db/local.d/00-disable-CAD

    Add the setting to disable the Ctrl-Alt-Delete sequence for the graphical user interface:

    [org/gnome/settings-daemon/plugins/media-keys]

    logout='''''
  checks:
  - type: manual_review
    info: 'Note: If the operating system does not have a graphical user interface installed, this

