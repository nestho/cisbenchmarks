- id: 6.1.15
  title: Ensure the file permissions ownership and group membership of system files and commands match the vendor values
  scoring: manual
  profile:
  - STIG
  description: The operating system must be configured so that the file permissions, ownership, and group membership of system
    files and commands match the vendor values
  rationale: 'Discretionary access control is weakened if a user or group has access permissions to system files and directories
    greater than the default. Satisfies: SRG-OS-000257-GPOS-00098, SRG-OS-000278-GPOS-00108'
  impact: ''
  references:
  - '1. NIST SP 800-53 :: AU-9'
  - '2. NIST SP 800-53A :: AU-9.1'
  page_start: 915
  audit_raw: 'Verify the file permissions, ownership, and group membership of system files and

    commands match the vendor values.

    Check the default file permissions, ownership, and group membership of system files and

    commands with the following command:

    # for i in `rpm -Va | egrep ''^.{1}M|^.{5}U|^.{6}G'' | cut -d " " -f 4,5`;do

    for j in `rpm -qf $i`;do rpm -ql $j --dump | cut -d " " -f 1,5,6,7 | grep

    $i;done;done

    /var/log/gdm 040755 root root

    /etc/audisp/audisp-remote.conf 0100640 root root

    /usr/bin/passwd 0104755 root root

    For each file returned, verify the current permissions, ownership, and group membership:

    # ls -la <filename>

    -rw-------. 1 root root 133 Jan 11 13:25 /etc/audisp/audisp-remote.conf

    If the file is more permissive than the default permissions, this is a finding.

    If the file is not owned by the default owner and is not documented with the Information

    System Security Officer (ISSO), this is a finding.

    If the file is not a member of the default group and is not documented with the Information

    System Security Officer (ISSO), this is a finding.

    915 | P a g e'
  remediation: 'Run the following command to determine which package owns the file:

    # rpm -qf <filename>

    Reset the user and group ownership of files within a package with the following command:

    # rpm --setugids <packagename>

    Reset the permissions of files within a package with the following command:

    # rpm --setperms <packagename>'
  checks:
  - type: manual_review
    info: 'Verify the file permissions, ownership, and group membership of system files and

      commands match the vendor values.

      Check the default file permissions, ownership, and group membership of system files and

