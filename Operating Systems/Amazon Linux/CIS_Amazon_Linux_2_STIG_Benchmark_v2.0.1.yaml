- id: 5.4.7
  title: Ensure minimum and maximum requirements are set for password changes
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that when passwords are changed a minimum of 8 of the total number
    of characters must be changed and a minimum of 4 character classes must be changed. The operating system must also be
    configured so that when passwords are changed the number of repeating consecutive characters must not be more than 3 characters
    and the number of repeating characters of the same character class must not be more than 4 characters. The operating system
    must be configured so that passwords are a minimum of 15 characters in length.
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
  impact: Consult your documentation for the appropriate PAM file and module. Additional module options may be set, recommendation
    requirements only cover including try_first_pass and minlen set to 14 or more. Settings in /etc/security/pwquality.conf
    must use spaces around the = symbol. 814 | P a g e
  references: []
  page_start: 814
  audit_raw: 'The difok option sets the number of characters in a password that must not be present in

    the old password. The minclass option sets the minimum number of required classes of

    characters for the new password (digits, upper-case, lower-case, others). The

    maxrepeat option sets the maximum number of allowed same consecutive characters in a

    new password. The maxclassrepeat option sets the maximum number of allowed same

    consecutive characters in the same class in the new password. The minlen option sets the

    minimum number of characters in a new password.

    Check for the value of the difok option in /etc/security/pwquality.conf with the

    following command:

    # grep difok /etc/security/pwquality.conf

    difok = 8

    Check for the value of the minclass option in /etc/security/pwquality.conf with the

    following command:

    # grep minclass /etc/security/pwquality.conf

    minclass = 4

    Check for the value of the maxrepeat option in /etc/security/pwquality.conf with the

    following command:

    # grep maxrepeat /etc/security/pwquality.conf

    maxrepeat = 3

    Check for the value of the maxclassrepeat option in /etc/security/pwquality.conf with

    the following command:

    # grep maxclassrepeat /etc/security/pwquality.conf

    maxclassrepeat = 4

    Check for the value of the minlen option in /etc/security/pwquality.conf with the

    following command:

    # grep minlen /etc/security/pwquality.conf

    minlen = 15

    If the value of difok is set to less than 8 and/or minclass is set to less than 4, and/or the

    value of maxrepeat is set to more than 3, and/or the value of maxclassrepeat is set to more

    815 | P a g e

    than 4, and/or it does not return a minlen value of 15 or greater, please refer to the

    remediation procedure below.'
  remediation: 'Configure the operating system to require the change of at least 8 of the total number of

    characters when passwords are changed by setting the difok option and the minclass

    option and the maxrepeat option and the maxclassrepeat and the minlen option as defined

    below.

    Add the following lines to /etc/security/pwquality.conf (or modify the line to have the

    required value):

