- id: 4.1.2.12
  title: Ensure action is taken when audisp-remote buffer is full
  scoring: scored
  profile:
  - STIG
  description: The operating system must take appropriate action when the audisp-remote buffer is full.
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. When the remote buffer is full, audit
    logs will not be collected and sent to the central log server.
  impact: ''
  references:
  - '1. CCI: CCI-001851: The information system off-loads audit records per organizationdefined frequency onto a different
    system or media than the system being audited.'
  - '2. NIST SP 800-53 Revision 4 :: AU-4 (1)'
  page_start: 508
  audit_raw: 'Verify the audisp daemon is configured to take an appropriate action when the internal

    queue (audisp-remote buffer) is full:

