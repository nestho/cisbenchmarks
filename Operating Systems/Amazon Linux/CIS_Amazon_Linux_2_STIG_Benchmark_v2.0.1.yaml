- id: 5.2.4
  title: Ensure users must provide password for escalation
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that users must provide a password for privilege escalation.
  rationale: Without re-authentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the user re-authenticate.
  impact: ''
  references:
  - '1. CCI-002038: The organization requires users to reauthenticate when organizationdefined circumstances or situations
    requiring reauthentication.'
  - '2. NIST SP 800-53 Revision 4 :: IA-11'
  page_start: 696
  audit_raw: '***If passwords are not being used for authentication, this is Not Applicable.

    Verify the operating system requires users to supply a password for privilege escalation.

    Check the configuration of the /etc/sudoers and /etc/sudoers.d/* files with the

    following command:

    # grep -i nopasswd /etc/sudoers /etc/sudoers.d/*

    If any uncommented line is found with a NOPASSWD tag, refer to the remediation procedure

    below.

    696 | P a g e'
  remediation: 'Configure the operating system to require users to supply a password for privilege

    escalation.

    Check the configuration of the /etc/sudoers file with the following command:

    # vim /etc/sudoers

    Remove any occurrences of NOPASSWD tags in the file.

    Check the configuration of the /etc/sudoers.d/* files with the following command to get

    the list:

    # grep -i nopasswd /etc/sudoers.d/*

    Edit the list of files using this command:

    # vim /etc/sudoers.d/path_of_file

    Remove any occurrences of NOPASSWD tags in the file.'
  checks:
  - type: manual_review
    info: '***If passwords are not being used for authentication, this is Not Applicable.

