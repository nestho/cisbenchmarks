      tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 0

      OR If '
- id: 1.1.3
  title: Ensure noexec option set on /tmp partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The noexec mount option specifies that the filesystem cannot contain executable binaries.
  rationale: Since the /tmp filesystem is only intended for temporary file storage, set this option to ensure that users cannot
    run executable binaries from /tmp.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Run the following command to verify the noexec option is set:

    # findmnt -n /tmp | grep -Ev ''\bnodev\b''

    Nothing should be returned

    38 | P a g e'
  remediation: 'Edit the /etc/fstab file OR the /etc/systemd/system/localfs.target.wants/tmp.mount file:

    IF /etc/fstab is used to mount /tmp

    Edit the /etc/fstab file and add noexec to the fourth field (mounting options) for the /tmp

    partition. See the fstab(5) manual page for more information.

    Run the following command to remount /tmp:

    # mount -o remount,noexec /tmp

    OR if systemd is used to mount /tmp:_

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to add noexec to the /tmp

    mount options:

    [Mount]

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Run the following command to restart the systemd daemon:

    # systemctl daemon-reload

    Run the following command to restart tmp.mount

    # systemctl restart tmp.mount'
  checks:
  - type: command
    command: '# findmnt -n /tmp | grep -Ev ''\bnodev\b'''
    expected: ''
    severity: medium
    info: 'Run the following command to verify the noexec option is set:

      # findmnt -n /tmp | grep -Ev ''\bnodev\b''

      Nothing should be returned

      38 | P a g e'
