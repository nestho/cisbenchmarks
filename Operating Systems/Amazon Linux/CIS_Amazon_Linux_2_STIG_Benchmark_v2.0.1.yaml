    If there is no process to validate the signatures of local packages that is approved by the

    organization, refer to the remediation procedure below.'
  remediation: 'Configure the operating system to verify the signature of local packages prior to install by

    setting the following option in the /etc/yum.conf file:

    Example: vim /etc/yum.conf

    and add the following line:

    localpkg_gpgcheck=1'
