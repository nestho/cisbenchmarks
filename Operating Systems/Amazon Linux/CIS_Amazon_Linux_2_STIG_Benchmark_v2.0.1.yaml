- id: 4.1.2.10
  title: Ensure the auditing processing failures are handled.
  scoring: scored
  profile:
  - STIG
  description: The operating system must shut down upon audit processing failure, unless availability is an overriding concern.
    If availability is a concern, the system must alert the designated staff in the event of an audit processing failure.
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability,
    and system operation may be adversely affected. Audit processing failures include software/hardware errors, failures in
    the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement applies to each
    audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized
    audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
  impact: Kernel log monitoring must also be configured to properly alert designated staff. 502 | P a g e
  references:
  - '1. CCI: CCI-000139: The information system alerts designated organization-defined'
  - '2. NIST SP 800-53 :: AU-5 a'
  page_start: 502
  audit_raw: 'Confirm the audit configuration regarding how auditing processing failures are handled.

    Check to see what level auditctl is set to with following command:

    # auditctl -s | grep -i "fail"

    failure 2

    If the value of failure is set to 2, the system is configured to panic (shut down) in the event

    of an auditing failure.

    If the value of failure is set to 1, the system is configured to only send information to the

    kernel log regarding the failure.

    If the failure setting is not set, this is a CAT I finding, refer to the remediation procedure

    below.

    If the failure setting is set to any value other than 1 or 2, this is a CAT II finding, refer to

    the remediation procedure below.

    If the failure setting is set to 1 but the availability concern is not documented or there is

    no monitoring of the kernel log, this is a CAT III finding, refer to the remediation procedure

    below.

    503 | P a g e'
  remediation: 'Configure the operating system to shut down or notify staff in the event of an audit

    processing failure.

    To add or correct the option to shut down the operating system use the following

    command:

    # auditctl -f 2

    Edit the /etc/audit/rules.d/audit.rules file and add the following line:

    Example: vim /etc/audit/rules.d/audit.rules

    Add this line:

    -f 2

    If availability has been determined to be more important, and this decision is documented

    with the Authorizing Official, configure the operating system to notify the

    appropriate staff in the event of an audit processing failure with the following command:

    # auditctl -f 1

    Edit the /etc/audit/rules.d/audit.rules file and add the following line:

    Example: vim /etc/audit/rules.d/audit.rules

    Add this line:

    -f 1

    The audit daemon must be restarted for changes to take effect:

    # service auditd restart'
  checks:
