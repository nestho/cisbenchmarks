- id: 5.2.6
  title: Ensure the sudoers file restricts sudo access to authorized personnel
  scoring: scored
  profile:
  - STIG
  description: The Linux operating system must restrict privilege elevation to authorized personnel.
  rationale: The sudo command allows a user to execute programs with elevated (administrator) privileges. It prompts the user
    for their password and confirms your request to execute a command by checking a file, called sudoers. If the "sudoers"
    file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 :: CM-6 b'
  page_start: 702
  audit_raw: 'Verify the "sudoers" file restricts sudo access to authorized personnel.

    # grep -iw ''ALL'' /etc/sudoers /etc/sudoers.d/*

    If the either of the following entries are returned, this is a finding:

    ALL ALL=(ALL) ALL

    ALL ALL=(ALL:ALL) ALL'
  remediation: 'Remove the following entries from the sudoers file:

    ALL ALL=(ALL) ALL

    ALL ALL=(ALL:ALL) ALL'
  checks:
  - type: manual_review
    info: 'Verify the "sudoers" file restricts sudo access to authorized personnel.

      # grep -iw ''ALL'' /etc/sudoers /etc/sudoers.d/*

      If the either of the following entries are returned, this is a finding:

      ALL ALL=(ALL) ALL

      ALL ALL=(ALL:ALL) ALL'
    severity: medium
- id: 5.2.7
  title: Ensure sudo authentication timeout is configured
  scoring: scored
  profile:
  - STIG
  description: The Linux operating system must require re-authentication when using the "sudo" command.
  rationale: Without re-authentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the organization requires
    the user to re-authenticate when using the "sudo" command. If the value is set to an integer less than 0, the user's time
    stamp will not expire and the user will not have to re-authenticate for privileged actions until the user's session is
    terminated.
  impact: ''
  references:
  - 1. https://www.sudo.ws/man/1.9.0/sudoers.man.html
  - '2. CCI-002038: The organization requires users to reauthenticate when organizationdefined circumstances or situations
    requiring reauthentication'
  page_start: 704
  audit_raw: 'Verify the operating system requires re-authentication when using the "sudo" command to

    elevate privileges.

    # grep -i ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d/*

