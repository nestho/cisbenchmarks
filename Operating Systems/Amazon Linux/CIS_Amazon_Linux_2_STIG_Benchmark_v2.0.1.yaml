  page_start: 975
  audit_raw: 'Verify that all local interactive user initialization files'' (dot) executable search path

    statements do not contain statements that will reference a working directory other than

    the users'' home directory.

    Check the executable search path statement for all local interactive user initialization files

    in the users'' home directory with the following commands:

    Note: The example will be for the smithj user, which has a home directory of

    /home/smithj.

    # grep -i path /home/smithj/.*

    /home/smithj/.bash_profile:PATH=$PATH:$HOME/.local/bin:$HOME/bin

    /home/smithj/.bash_profile:export PATH

    If any local interactive user initialization files have executable search path statements that

    include directories outside of their home directory, refer to the remediation procedure

    below.

    975 | P a g e'
  remediation: 'Edit the local interactive user initialization files to change any PATH variable statements

    that reference directories other than their home directory.

    Note: The example will be for the smithj user, which has a home directory of

    /home/smithj.

    Utilizing the files listed in the Audit run this command to edit them and change the PATH

    variable statement.

    Example: vim /home/smithj/.bash_profile

    Update the PATH accordingly:

    :PATH=$PATH:$HOME/.local/bin:$HOME/bin

    If a local interactive user requires path variables to reference a directory owned by the

    application, it must be documented with the ISSO.'
