- id: 4.1.3.32
  title: Ensure auditing of all privileged functions
  scoring: scored
  profile:
  - STIG
  description: The operating system must audit all executions of privileged functions.
  rationale: Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify
    the risk from insider threats and the advanced persistent threat.
  impact: ''
  references:
  - '1. CCI: CCI-002234: The information system audits the execution of privileged'
  - '2. NIST SP 800-53 Revision 4 :: AC-6 (9)'
  page_start: 608
  audit_raw: 'Verify the operating system audits the execution of privileged functions using the following

    command:

    Note: The output lines of the command are duplicated to cover both 32-bit and 64-bit

    architectures.

    Only the lines appropriate for the system architecture must be present.

    # grep -iw execve /etc/audit/audit.rules

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

    If the audit rule for SUID files is not defined, refer to the remediation procedure below.

    If the audit rule for SGID files is not defined, refer to the remediation procedure below.

    608 | P a g e'
  remediation: 'Configure the operating system to audit the execution of privileged functions.

    Add or update the following rule in /etc/audit/rules.d/audit.rules:

    Example: vim /etc/audit/rules.d/audit.rules

    Note: The rules are duplicated to cover both 32-bit and 64-bit architectures. Only the lines

    appropriate for the system architecture must be configured.

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

    The audit daemon must be restarted for the changes to take effect.

    # service auditd restart'
  checks:
  - type: manual_review
    info: 'Verify the operating system audits the execution of privileged functions using the following

