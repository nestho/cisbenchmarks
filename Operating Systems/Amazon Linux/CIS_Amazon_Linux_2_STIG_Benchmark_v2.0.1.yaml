  title: Ensure off-load of audit logs.
  scoring: scored
  profile:
  - STIG
  description: The operating system must configure the au-remote plugin to off-load audit logs using the audisp-remote daemon.
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. Without the configuration of the "au-remote"
    plugin, the audisp-remote daemon will not off load the logs from the system being audited.
  impact: ''
  references:
  - '1. CCI: CCI-001851: The information system off-loads audit records per organizationdefined frequency onto a different
    system or media than the system being audited.'
