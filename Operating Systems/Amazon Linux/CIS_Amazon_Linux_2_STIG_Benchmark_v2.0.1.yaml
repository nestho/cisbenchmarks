- id: 4.1.3.15
  title: Ensure all uses of the passwd command are audited.
  scoring: scored
  profile:
  - STIG
  description: The operating system must audit all uses of the passwd command.
  rationale: Reconstruction of harmful events or forensic analysis is not possible if audit records do not contain enough
    information. At a minimum, the organization must audit the full-text recording of privileged password commands. The organization
    must maintain audit trails in sufficient detail to reconstruct events to determine the cause and impact of compromise.
  impact: ''
  references:
  - '1. CCI: CCI-000135: The information system generates audit records containing the'
  - '2. NIST SP 800-53 :: AU-3 (1)'
  page_start: 559
  audit_raw: 'Verify the operating system generates audit records when successful/unsuccessful

    attempts to use the passwd command occur.

    Check the file system rule in /etc/audit/audit.rules with the following command:

    # grep -i /usr/bin/passwd /etc/audit/audit.rules

    -a always,exit -F path=/usr/bin/passwd -F auid>=1000 -F auid!=4294967295 -k

    privileged-passwd

    If the command does not return any output, refer to the remediation procedure below.

    559 | P a g e'
  remediation: 'Configure the operating system to generate audit records when successful/unsuccessful

    attempts to use the passwd command occur.

    Add or update the following rule in /etc/audit/rules.d/audit.rules:

    Example: vim /etc/audit/rules.d/audit.rules

    Add, update or uncomment this line below

    -a always,exit -F path=/usr/bin/passwd -F auid>=1000 -F auid!=4294967295 -k

    privileged-passwd

    The audit daemon must be restarted for the changes to take effect.

    # service auditd restart'
  checks:
  - type: manual_review
    info: 'Verify the operating system generates audit records when successful/unsuccessful

      attempts to use the passwd command occur.

      Check the file system rule in /etc/audit/audit.rules with the following command:

      # grep -i /usr/bin/passwd /etc/audit/audit.rules

      -a always,exit -F path=/usr/bin/passwd -F auid>=1000 -F auid!=4294967295 -k

      privileged-passwd

      If the command does not return any output, refer to the remediation procedure below.

      559 | P a g e'
    severity: medium
