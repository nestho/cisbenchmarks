  - Level 2 - Workstation
  - STIG
  description: 'Record events affecting the group , passwd (user IDs), shadow and gshadow (passwords) or /etc/security/opasswd
    (old passwords, based on remember parameter in the PAM configuration) files. The parameters in this section will watch
    the files to see if they have been opened for write or have had attribute changes (e.g. permissions) and tag them with
    the identifier "identity" in the audit log file. Note: Reloading the auditd config to set active settings may require
    a system reboot.'
  rationale: Unexpected changes to these files could be an indication that the system has been compromised and that an unauthorized
    user is attempting to hide their activities or compromise additional accounts.
