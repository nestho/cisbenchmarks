- id: 5.4.11
  title: Ensure password prohibited reuse is at a minimum 5
  scoring: scored
  profile:
  - STIG
  description: The operating system must be configured so that passwords are prohibited from reuse for a minimum of 5 generations.
    The operating system must be configured to lock accounts for a minimum of 15 minutes after three unsuccessful logon attempts
    within a 15-minute timeframe.
  rationale: 'Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. If the information system or application allows the user to consecutively reuse their password
    when that password has exceeded its defined lifetime, the end result is a password that is not changed per policy requirements.
    By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise
    known as brute-forcing, is reduced. Limits are imposed by locking the account. Satisfies: SRG-OS-000329-GPOS-00128, SRG-OS-000021-GPOS-00005'
  impact: ''
  references:
  - '1. CCI: CCI-000044: The information system enforces the organization-defined limit of'
  - '2. NIST SP 800-53 :: AC-7 a'
  page_start: 826
  audit_raw: 'Verify the operating system prohibits password reuse for a minimum of 5 generations.

    Check for the value of the remember argument in /etc/pam.d/system-auth and

    /etc/pam.d/password-auth with the following command:

    # grep -i remember /etc/pam.d/system-auth /etc/pam.d/password-auth

    password requisite pam_pwhistory.so use_authtok remember=5 retry=3

    If the line containing the pam_pwhistory.so line does not have the remember module

    argument set, is commented out, or the value of the remember module argument is set to

    less than 5, refer to the remediation procedure below.

    826 | P a g e

    Check that the system locks an account for a minimum of 15 minutes after three

    unsuccessful logon attempts within a period of 15 minutes with the following command:

    # grep pam_faillock.so /etc/pam.d/password-auth

    auth required pam_faillock.so preauth silent audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    auth [default=die] pam_faillock.so authfail audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    account required pam_faillock.so

    If the "deny" parameter is set to "0" or a value greater than "3" on both "auth" lines with

    the "pam_faillock.so" module, or is missing from these lines, this is a finding.

    If the "even_deny_root" parameter is not set on both "auth" lines with the "pam_faillock.so"

    module, or is missing from these lines, this is a finding.

    If the "fail_interval" parameter is set to "0" or is set to a value less than "900" on both

    "auth" lines with the "pam_faillock.so" module, or is missing from these lines, this is a

    finding.

    If the "unlock_time" parameter is not set to "0", "never", or is set to a value less than "900"

    on both "auth" lines with the "pam_faillock.so" module, or is missing from these lines, this

    is a finding.

    828 | P a g e

    Note: The maximum configurable value for "unlock_time" is "604800".

