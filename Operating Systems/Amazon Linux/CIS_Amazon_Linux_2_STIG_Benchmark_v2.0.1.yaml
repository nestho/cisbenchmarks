    If the banner-message-text is missing, commented out, or does not match the Standard

    Mandatory DoD Notice and Consent Banner exactly, this is a finding.

    211 | P a g e'
  remediation: 'Configure the operating system to display the approved Standard Mandatory DoD Notice

    and Consent Banner before granting access to the system.

