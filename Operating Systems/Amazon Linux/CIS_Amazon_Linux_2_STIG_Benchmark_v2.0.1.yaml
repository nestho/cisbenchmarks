- id: 5.4.2
  title: Ensure lockout for failed password attempts is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Lock out users after n unsuccessful consecutive login attempts. These settings are commonly configured with
    the pam_faillock.so module. Some environments may continue using the pam_tally2.so module, where this older method may
    simplify automation in mixed environments. Set the lockout number in deny= to the policy in effect at your site. unlock_time=_n_
    is the number of seconds the account remains locked after the number of attempts configured in deny=_n_ has been met.
    Notes: • Additional module options may be set, recommendation only covers those listed here. • When modifying authentication
    configuration using the authconfig utility, the systemauth and password-auth files are overwritten with the settings from
    the authconfig utility. This can be avoided by creating symbolic links in place of the configuration files, which authconfig
    recognizes and does not overwrite. These symbolic links are the default for Fedora 19 derived distributions. • Use of
    the "audit" keyword may log credentials in the case of user error during authentication. This risk should be evaluated
    in the context of the site policies of your organization. • If a user has been locked out because they have reached the
    maximum consecutive failure count defined by deny= in the pam_faillock.so or the pam_tally2.so module, the user can be
    unlocked by issuing following commands. This command sets the failed count to 0, effectively unlocking the user. o If
    pam_faillock.so is used: o # faillock --user <username> --reset o If pam_tally2.so is used: o # pam_tally2 -u <username>
    --reset 801 | P a g e'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/security_guide
  page_start: 801
  audit_raw: 'Verify password lockouts are configured. Ensure that the deny=_n_ follows local site policy.

    This should not exceed deny=5.

    If pam_failock.so is used:

    Run the following commands:

    # grep -E ''^\s*auth\s+\S+\s+pam_(faillock|unix)\.so'' /etc/pam.d/system-auth

    /etc/pam.d/password-auth

    Verify the output includes the following lines:

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth

    silent audit deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth sufficient pam_unix.so nullok

    try_first_pass

    /etc/pam.d/system-auth:auth [default=die] pam_faillock.so authfail

    audit deny=5 unlock_time=900

    /etc/pam.d/password-auth:auth required pam_faillock.so preauth

    silent audit deny=5 unlock_time=900

    /etc/pam.d/password-auth:auth sufficient pam_unix.so nullok

    try_first_pass

    /etc/pam.d/password-auth:auth [default=die] pam_faillock.so authfail

    audit deny=5 unlock_time=900

    # grep -E ''^\s*account\s+required\s+pam_faillock.so\s*'' /etc/pam.d/systemauth /etc/pam.d/password-auth

    Verify the output includes the following lines:

    /etc/pam.d/system-auth:account required pam_faillock.so

    /etc/pam.d/password-auth:account required pam_faillock.so

    OR

    If pam_tally2.so is used:

    Run the following commands:

    # grep -E ''^\s*auth\s+\S+\s+pam_(tally2|unix)\.so'' /etc/pam.d/system-auth

    /etc/pam.d/password-auth

    Verify the output includes the following lines:

    802 | P a g e

    /etc/pam.d/system-auth:auth required pam_tally2.so deny=5

    onerr=fail unlock_time=900

    /etc/pam.d/system-auth:auth sufficient pam_unix.so nullok

    try_first_pass

    /etc/pam.d/password-auth:auth required pam_tally2.so deny=5

    onerr=fail unlock_time=900

    /etc/pam.d/password-auth:auth sufficient pam_unix.so nullok

    try_first_pass

    # grep -E ''^\s*account\s+required\s+pam_tally2.so\s*'' /etc/pam.d/system-auth

    /etc/pam.d/password-auth

    Verify the output includes the following lines:

    /etc/pam.d/system-auth:account required pam_tally2.so

    /etc/pam.d/password-auth:account required pam_tally2.so'
  remediation: 'Edit the files /etc/pam.d/system-auth and /etc/pam.d/password-auth and add the

    following lines:

    Modify the deny= and unlock_time= parameters to conform to local site policy, Not to be

    greater than deny=5

    To use pam_faillock.so module, add the following lines to the auth section:

    auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900

    auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900

    The auth sections should look similar to the following example:

    Note: The ordering on the lines in the auth section is important. The preauth line needs to

    below the line auth required pam_env.so and above all password validation lines. The

    authfail line needs to be after all password validation lines such as pam_sss.so. Incorrect

    order can cause you to be locked out of the system

    Example:

    auth required pam_env.so

    auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900 # <- Under "auth required pam_env.so"

    auth sufficient pam_unix.so nullok try_first_pass

    auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900 # <- Last auth line before "auth requisite

    pam_succeed_if.so"

    auth requisite pam_succeed_if.so uid >= 1000 quiet_success

    auth required pam_deny.so

    Add the following line to the account section:

    803 | P a g e

    account required pam_faillock.so

    Example:

    account required pam_faillock.so

    account required pam_unix.so

    account sufficient pam_localuser.so

    account sufficient pam_pam_succeed_if.so uid < 1000 quiet

    account required pam_permit.so

    OR

    To use the pam_tally2.so module, add the following line to the auth section:

    auth required pam_tally2.so deny=5 onerr=fail unlock_time=900

    The auth sections should look similar to the following example:

    Note: The ordering on the lines in the auth section is important. the additional line needs to

    below the line auth required pam_env.so and above all password validation lines.

    Example:

    auth required pam_env.so

    auth required pam_tally2.so deny=5 onerr=fail unlock_time=900 #

    <- Under "auth required pam_env.so"

    auth sufficient pam_unix.so nullok try_first_pass

    auth requisite pam_succeed_if.so uid >= 1000 quiet_success

    auth required pam_deny.so

    Add the following line to the account section:

    account required pam_tally2.so

    Example:

    account required pam_tally2.so

    account required pam_unix.so

    account sufficient pam_localuser.so

    account sufficient pam_pam_succeed_if.so uid < 1000 quiet

    account required pam_permit.so'
  checks:
  - type: manual_review
    info: 'Verify password lockouts are configured. Ensure that the deny=_n_ follows local site policy.

      This should not exceed deny=5.

      If pam_failock.so is used:

      Run the following commands:

      # grep -E ''^\s*auth\s+\S+\s+pam_(faillock|unix)\.so'' /etc/pam.d/system-auth

      /etc/pam.d/password-auth

      Verify the output includes the following lines:

      /etc/pam.d/system-auth:auth required pam_faillock.so preauth

      silent audit deny=5 unlock_time=900

      /etc/pam.d/system-auth:auth sufficient pam_unix.so nullok

      try_first_pass

      /e'
    severity: medium
- id: 5.4.3
  title: Ensure password hashing algorithm is SHA-512
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - STIG
  description: 'The commands below change password encryption from md5 to sha512 (a much stronger hashing algorithm). All
    existing accounts will need to perform a password change to upgrade the stored hashes to the new algorithm. Note: • These
    changes only apply to accounts configured on the local system. • Additional module options may be set, recommendation
    only covers those listed here.'
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords.
  impact: ''
  references: []
  page_start: 806
  audit_raw: 'Run the following command to verify the sha512 option is included:

    # grep -P

    ''^\h*password\h+(sufficient|requisite|required)\h+pam_unix\.so\h+([^#\n\r]+)?

    sha512(\h+.*)?$'' /etc/pam.d/system-auth /etc/pam.d/password-auth

    /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

    nullok try_first_pass use_authtok

    /etc/pam.d/password-auth:password sufficient pam_unix.so sha512 shadow

    nullok try_first_pass use_authtok'
  remediation: 'Edit the /etc/pam.d/password-auth and /etc/pam.d/system-auth files to include sha512

    option and remove the md5 option for pam_unix.so:

    password sufficient pam_unix.so sha512

    806 | P a g e

    Note:

    • Any system accounts that need to be expired should be carefully done separately by the

    system administrator to prevent any potential problems.

    • If it is determined that the password algorithm being used is not SHA-512, once it is

    changed, it is recommended that all user ID''s be immediately expired and forced to

    change their passwords on next login, In accordance with local site policies.

    • To accomplish this, the following command can be used.

    o This command intentionally does not effect the root account. The root

    account''s password will also need to be changed.

    # awk -F: ''( $3<''"$(awk ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)"'' && $1 !~

    /^(nfs)?nobody$/ && $1 != "root" ) { print $1 }'' /etc/passwd | xargs -n 1

    chage -d 0'
  checks:
  - type: manual_review
    info: 'Run the following command to verify the sha512 option is included:

      # grep -P

      ''^\h*password\h+(sufficient|requisite|required)\h+pam_unix\.so\h+([^#\n\r]+)?

      sha512(\h+.*)?$'' /etc/pam.d/system-auth /etc/pam.d/password-auth

      /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

      nullok try_first_pass use_authtok

      /etc/pam.d/password-auth:password sufficient pam_unix.so sha512 shadow

      nullok try_first_pass use_authtok'
    severity: medium
- id: 5.4.4
  title: Ensure password reuse is limited
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'The /etc/security/opasswd file stores the users'' old passwords and can be checked to ensure that users are
    not recycling recent passwords. Note: Additional module options may be set, recommendation only covers those listed here.'
  rationale: Forcing users not to reuse their past 5 passwords make it less likely that an attacker will be able to guess
    the password.
  impact: ''
  references: []
  page_start: 808
  audit_raw: 'Verify remembered password history follows local site policy, not to be less than 5.

    If pam_pwhistory.so is used:

    Run the following command:

    # grep -P

    ''^\s*password\s+(requisite|required)\s+pam_pwhistory\.so\s+([^#]+\s+)*remembe

    r=([5-9]|[1-9][0-9]+)\b'' /etc/pam.d/system-auth /etc/pam.d/password-auth

    /etc/pam.d/system-auth:password required pam_pwhistory.so remember=5

    /etc/pam.d/password-auth:password required pam_pwhistory.so

    remember=5

    OR If pam_unix.so is used:

    Run the following command:

    # grep -P

    ''^\s*password\s+(sufficient|requisite|required)\s+pam_unix\.so\s+([^#]+\s+)*r

    emember=([5-9]|[1-9][0-9]+)\b'' /etc/pam.d/system-auth /etc/pam.d/passwordauth

    /etc/pam.d/system-auth:password sufficient pam_unix.so remember=5

    /etc/pam.d/password-auth:password sufficient pam_unix.so remember=5

    808 | P a g e'
  remediation: 'Edit both the /etc/pam.d/password-auth and /etc/pam.d/system-auth files to include the

    remember option and conform to site policy as shown:

    Note: Add or modify the line containing the pam_pwhistory.so after the first occurrence of

    password requisite:

    password required pam_pwhistory.so remember=5

    Example: (Second line is modified)

    password requisite pam_pwquality.so try_first_pass local_users_only

    authtok_type=

    password required pam_pwhistory.so use_authtok remember=5 retry=3

    password sufficient pam_unix.so sha512 shadow nullok try_first_pass

    use_authtok

