  audit_raw: 'Verify the operating system does not allow an unattended or automatic logon to the system

    via a graphical user interface.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Check for the value of the AutomaticLoginEnable in the /etc/gdm/custom.conf file with

    the following command:

    # grep -i automaticloginenable /etc/gdm/custom.conf

    AutomaticLoginEnable=false

    If the value of AutomaticLoginEnable is not set to false, refer to the remediation

    procedure below.'
  remediation: 'Configure the operating system to not allow an unattended or automatic logon to the

    system via a graphical user interface.

    Add or edit the line for the AutomaticLoginEnable parameter in the [daemon] section of

    the /etc/gdm/custom.conf file to false:

    Example: vim /etc/gdm/custom.conf

    [daemon]

    AutomaticLoginEnable=false

    237 | P a g e'
