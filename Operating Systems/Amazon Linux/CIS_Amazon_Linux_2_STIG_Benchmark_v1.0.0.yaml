- id: 1.5.7
  title: Ensure DNS is servers are configured
  scoring: scored
  profile: []
  description: The operating systems that are using DNS resolution, must have at least two name servers configured.
  rationale: To provide availability for name resolution services, multiple redundant name servers are mandated. A failure
    in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization,
    centralized authentication, and remote system logging.
  impact: 'system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to implement
    correctly preventing legitimate access from occurring. 119 | P a g e 1.6.1 Configure SELinux SELinux provides a Mandatory
    Access Control (MAC) system that greatly augments the default Discretionary Access Control (DAC) model. Under SELinux,
    every process and every object (files, sockets, pipes) on the system is assigned a security context, a label that includes
    detailed type information about the object. The kernel allows processes to access objects only if that access is explicitly
    allowed by the policy in effect. The policy defines transitions, so that a user can be allowed to run software, but the
    software can run under a different context than the user''s default. This automatically limits the damage that the software
    can do to files accessible by the calling user. The user does not need to take any action to gain this benefit. For an
    action to occur, both the traditional DAC permissions must be satisfied as well as the SELinux MAC rules. The action will
    not be allowed if either one of these models does not permit the action. In this way, SELinux rules can only make a system''s
    permissions more restrictive and secure. SELinux requires a complex policy to allow all the actions required of a system
    under normal operation. Three such policies have been designed for use with RHEL7 and are included with the system: targeted,
    strict, and mls. These are described as follows:  targeted: consists mostly of Type Enforcement (TE) rules, and a small
    number of Role-Based Access Control (RBAC) rules. Targeted restricts the actions of many types of programs, but leaves
    interactive users largely unaffected.  strict: also uses TE and RBAC rules, but on more programs and more aggressively.
     mls: implements Multi-Level Security (MLS), which introduces even more kinds of labels (sensitivity and category) and
    rules that govern access based on these. This section provides guidance for the configuration of the targetedpolicy. 120
    | P a g e Note: This section only applies if SELinux is in use on the system. Recommendations for AppArmor are also included,
    and additional Mandatory Access Control systems exist beyond these two.'
  references:
  - '1. NSA SELinux resources:'
  - 1. http://www.nsa.gov/research/selinux
  - 2. http://www.nsa.gov/research/selinux/list.shtml
  - '2. Fedora SELinux resources:'
  - '1. FAQ: http://docs.fedoraproject.org/selinux-faq'
  - '2. User Guide: http://docs.fedoraproject.org/selinux-user-guide'
  - 1. http://www.selinuxproject.org
  page_start: 117
  audit_raw: 'Determine whether the system is using local or DNS name resolution with the following

    command:

    # grep hosts /etc/nsswitch.conf

    hosts: files dns

    If the DNS entry is missing from the host''s line in the /etc/nsswitch.conf file, the

    /etc/resolv.conf file must be empty.

    Verify the /etc/resolv.conf file is empty with the following command:

    # ls -al /etc/resolv.conf

    -rw-r--r-- 1 root root 0 Aug 19 08:31 resolv.conf

    If local host authentication is being used and the /etc/resolv.conf file is not empty, refer

    to the remediation procedure below.

    If the DNS entry is found on the host''s line of the /etc/nsswitch.conf file, verify the

    operating system is configured to use two or more name servers for DNS resolution.

    Determine the name servers used by the system with the following command:

    # grep nameserver /etc/resolv.conf

    nameserver 192.168.1.2

    nameserver 192.168.1.3

    If less than two lines are returned that are not commented out, refer to the remediation

    procedure below.

    117 | P a g e'
  remediation: 'Configure the operating system to use two or more name servers for DNS resolution.

    Edit the /etc/resolv.conf file to uncomment or add the two or more nameserver option

    lines with the IP address of local authoritative name servers. If local host resolution is

    being performed, the /etc/resolv.conf file must be empty. An empty /etc/resolv.conf

    file can be created as follows:

    # echo -n > /etc/resolv.conf

    And then make the file immutable with the following command:

    # chattr +i /etc/resolv.conf

    If the /etc/resolv.conf file must be mutable, the required configuration must be

    documented with the Authorizing Official and the file must be verified by the system file

