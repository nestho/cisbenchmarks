- id: 6.1.1
  title: Audit system file permissions
  scoring: scored
  profile:
  - Level 2
  description: 'The RPM and Debian package managers have a number of useful options. One of these, the --verify (or -V for
    RPM) option, can be used to verify that system packages are correctly installed. The --verify option can be used to verify
    a particular package or to verify all system packages. If no output is returned, the package is installed correctly. The
    following table describes the meaning of output from the verify option: Code Meaning S File size differs. M File mode
    differs (includes permissions and file type). 5 The MD5 checksum differs. D The major and minor version numbers differ
    on a device file. L A mismatch occurs in a link. U The file ownership differs. G The file group owner differs. T The file
    time (mtime) differs. The rpm -qf or dpkg -S command can be used to determine which package a particular file belongs
    to. For example the following commands determines which package the /bin/bash file belongs to: # rpm -qf /bin/bash bash-4.1.2-29.el6.x86_64
    # dpkg -S /bin/bash bash: /bin/bash 667 | P a g e To verify the settings for the package that controls the /bin/bash file,
    run the following: # rpm -V bash-4.1.2-29.el6.x86_64 # dpkg --verify bash ??5?????? c /etc/bash.bashrc Note that you can
    feed the output of the rpm -qf command to the rpm -V command: # rpm -V `rpm -qf /etc/passwd`'
  rationale: It is important to confirm that packaged system files and directories are maintained with the permissions they
    were intended to have from the OS vendor.
  impact: ''
  references:
  - 1. http://docs.fedoraproject.org/enUS/Fedora_Draft_Documentation/0.1/html/RPM_Guide/index.html
  page_start: 667
  audit_raw: 'Run one of the following commands to review all installed packages. Note that this may be

    very time consuming and may be best scheduled via the cron utility. It is recommended

    that the output of this command be redirected to a file that can be reviewed later.

    # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename>

    # dpkg --verify > <filename>'
  remediation: 'Correct any discrepancies found and rerun the audit until output is clean or risk is

    mitigated or accepted.'
  checks:
  - type: manual_review
    info: 'Run one of the following commands to review all installed packages. Note that this may be

      very time consuming and may be best scheduled via the cron utility. It is recommended

      that the output of this command be redirected to a file that can be reviewed later.

      # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename>

      # dpkg --verify > <filename>'
    severity: medium
- id: 6.1.2
  title: Ensure permissions on /etc/passwd are configured
  scoring: scored
  profile:
  - Level 1
  description: The /etc/passwd file contains user account information that is used by many system utilities and therefore
    must be readable for these utilities to operate.
  rationale: It is critical to ensure that the /etc/passwd file is protected from unauthorized write access. Although it is
    protected by default, the file permissions could be changed either inadvertently or through malicious actions.
  impact: ''
  references: []
  page_start: 670
  audit_raw: 'Run the following command and verify Uid and Gid are both 0/root and Access is 644 :

    # stat /etc/passwd

    Access: (0644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)'
  remediation: 'Run the following command to set permissions on /etc/passwd :

    # chown root:root /etc/passwd

    # chmod 644 /etc/passwd'
  checks:
  - type: manual_review
    info: 'Run the following command and verify Uid and Gid are both 0/root and Access is 644 :

