- id: 3.1.2
  title: Ensure packet redirect sending is disabled
  scoring: scored
  profile:
  - Level 1
  description: ICMP Redirects are used to send routing information to other hosts. As a host itself does not act as a router
    (in a host only configuration), there is no need to send redirects. Network interfaces configured on the operating system
    must not be in promiscuous mode.
  rationale: An attacker could use a compromised host to send invalid ICMP redirects to other router devices in an attempt
    to corrupt routing and have users access a system set up by the attacker as opposed to a valid system. Network interfaces
    in promiscuous mode allow for the capture of all network traffic visible to the system. If unauthorized individuals can
    access these applications, it may allow then to collect information such as logon IDs, passwords, and key exchanges between
    systems. If the system is being used to perform a network troubleshooting function, the use of these tools must be documented
    with the Information System Security Officer (ISSO) and restricted to only authorized personnel.
  impact: ''
  references: []
  page_start: 264
  audit_raw: 'Run the following commands and verify output matches:

    # sysctl net.ipv4.conf.all.send_redirects

    net.ipv4.conf.all.send_redirects = 0

    # sysctl net.ipv4.conf.default.send_redirects

