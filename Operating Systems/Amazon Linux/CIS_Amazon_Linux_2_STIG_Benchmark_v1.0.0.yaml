- id: 1.7.1.7
  title: Ensure the Standard Mandatory DoD Notice and Consent Banner are configured
  scoring: scored
  profile: []
  description: The operating system must display the Standard Mandatory DoD Notice and Consent Banner immediately prior to,
    or as part of, remote access logon prompts.
  rationale: 'Display of a standardized and approved use notification before granting access to the publicly accessible operating
    system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners
    of 1300 characters: 143 | P a g e "You are accessing a U.S. Government (USG) Information System (IS) that is provided
    for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following
    conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited
    to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement
    (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS.
    -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and
    search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication
    and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using
    this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged
    communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy,
    and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
    144 | P a g e'
  impact: ''
  references: []
  page_start: 143
  audit_raw: 'Verify any publicly accessible connection to the operating system displays the Standard

    Mandatory DoD Notice and Consent Banner before granting access to the system.

    Check for the location of the banner file being used with the following command:

    # grep -i banner /etc/ssh/sshd_config

    banner /etc/issue

    This command will return the banner keyword and the name of the file that contains the

    ssh banner (in this case /etc/issue).

    If the line is commented out, refer to the remediation procedure below.

    View the file specified by the banner keyword to check that it matches the text of the

    Standard Mandatory DoD Notice and Consent Banner:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the system does not display a graphical logon banner or the banner does not match the

    Standard Mandatory DoD Notice and Consent Banner, refer to the remediation procedure

    below.

    If the text in the file does not match the Standard Mandatory DoD Notice and Consent

    Banner, refer to the remediation procedure below.

    145 | P a g e'
  remediation: 'Configure the operating system to display the Standard Mandatory DoD Notice and Consent

    Banner before granting access to the system via the ssh.

    Edit the /etc/ssh/sshd_config file to uncomment the banner keyword and configure it to

    point to a file that will contain the logon banner (this file may be named differently or be in

    a different location if using a version of SSH that is provided by a third-party vendor).

    Example: vim /etc/sshd_config

    An example configuration line is:

    banner /etc/issue

    Either create the file containing the banner or replace the text in the file with the Standard

    Mandatory DoD Notice and Consent Banner.

    Example: vim /etc/issue

    The DoD required text is:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    146 | P a g e

    The SSH service must be restarted for changes to take effect.

    Examples:

    Type the following command:

    # /etc/init.d/sshd restart

    or use the service command:

    # service sshd restart

    or with systemd enter:

    $ sudo systemctl restart sshd

    Notes:

    This Benchmark recommendation maps to:

    Red Hat Enterprise Linux 7 Security Technical Implementation Guide:

    Version 2, Release: 3 Benchmark Date: 26 Apr 2019

    Vul ID: V-72225

    Rule ID: SV-86849r4_rule

    STIG ID: RHEL-07-040170

    Severity: CAT II

    147 | P a g e'
  checks:
  - type: manual_review
    info: 'Verify any publicly accessible connection to the operating system displays the Standard

      Mandatory DoD Notice and Consent Banner before granting access to the system.

      Check for the location of the banner file being used with the following command:

      # grep -i banner /etc/ssh/sshd_config

      banner /etc/issue

      This command will return the banner keyword and the name of the file that contains the

      ssh banner (in this case /etc/issue).

      If the line is commented out, refer to the remediation procedure below.

      '
    severity: medium
- id: '1.8'
  title: Ensure updates, patches, and additional security software are installed
  scoring: scored
  profile:
  - Level 1
  description: Periodically patches are released for included software either due to security flaws or to include additional
    functionality.
  rationale: Newer patches may contain security enhancements that would not be available through the latest full update. As
    a result, it is recommended that the latest software patches be used to take advantage of the latest functionality. As
    with any software installation, organizations need to determine if a given update meets their requirements and verify
    the compatibility and supportability of any additional software against the update revision that is selected.
