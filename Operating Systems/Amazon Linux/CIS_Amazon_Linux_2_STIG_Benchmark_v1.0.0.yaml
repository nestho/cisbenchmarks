    Red Hat Enterprise Linux 7 Security Technical Implementation Guide:

    Version 2, Release: 3 Benchmark Date: 26 Apr 2019

    Vul ID: V-72223

    Rule ID: SV-86847r4_rule

    STIG ID: RHEL-07-040160

    Severity: CAT II

    651 | P a g e'
