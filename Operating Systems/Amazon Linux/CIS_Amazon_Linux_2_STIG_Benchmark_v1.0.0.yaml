- id: 6.2.26
  title: Ensure local interactive users' `dot` files executable paths resolve to the users home directory.
  scoring: scored
  profile: []
  description: The operating system must be configured so that all local interactive user initialization (dot) files executable
    search paths contain only paths that resolve to the users home directory.
  rationale: The executable search path (typically the PATH environment variable) contains a list of directories for the shell
    to search to find executables. If this path includes the current working directory (other than the user's home directory),
    executables in these directories may be executed instead of system commands. This variable is formatted as a colon-separated
    list of directories. If there is an empty entry, such as a leading or trailing colon or two consecutive colons, this is
    interpreted as the current working directory. If deviations from the default system search path for the local interactive
    user are required, they must be documented with the Information System Security Officer (ISSO).
  impact: ''
  references: []
  page_start: 733
  audit_raw: 'Verify that all local interactive user initialization files'' (dot) executable search path

    statements do not contain statements that will reference a working directory other than

    the users'' home directory.

    Check the executable search path statement for all local interactive user initialization files

    in the users'' home directory with the following commands:

    Note: The example will be for the smithj user, which has a home directory of

    /home/smithj.

    # grep -i path /home/smithj/.*

    /home/smithj/.bash_profile:PATH=$PATH:$HOME/.local/bin:$HOME/bin

    /home/smithj/.bash_profile:export PATH

    If any local interactive user initialization files have executable search path statements that

    include directories outside of their home directory, refer to the remediation procedure

    below.

    733 | P a g e'
  remediation: 'Edit the local interactive user initialization files to change any PATH variable statements

    that reference directories other than their home directory.

    Note: The example will be for the smithj user, which has a home directory of

    /home/smithj.

    Utilizing the files listed in the Audit run this command to edit them and change the PATH

    variable statement.

    Example: vim /home/smithj/.bash_profile

    Update the PATH accordingly:

    :PATH=$PATH:$HOME/.local/bin:$HOME/bin

    If a local interactive user requires path variables to reference a directory owned by the

    application, it must be documented with the ISSO.

    Notes:

    This Benchmark recommendation maps to:

    Red Hat Enterprise Linux 7 Security Technical Implementation Guide:

    Version 2, Release: 3 Benchmark Date: 26 Apr 2019

