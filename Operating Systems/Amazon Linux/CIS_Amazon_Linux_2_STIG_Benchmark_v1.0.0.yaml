- id: 5.3.4
  title: Ensure password hashing algorithm is SHA-512
  scoring: scored
  profile:
  - Level 1
  description: The commands below change password encryption from md5 to sha512 (a much stronger hashing algorithm). All existing
    accounts will need to perform a password change to upgrade the stored hashes to the new algorithm.
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords. Note that these change only apply
    to accounts configured on the local system.
  impact: ''
  references: []
  page_start: 590
  audit_raw: 'Verify password hashing algorithm is sha512. This setting is commonly configured with the

