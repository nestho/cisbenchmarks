- id: '1.11'
  title: Ensure host-based intrusion detection tool is used
  scoring: scored
  profile: []
  description: The operating system must have a host-based intrusion detection tool installed.
  rationale: Adding host-based intrusion detection tools can provide the capability to automatically take actions in response
    to malicious behavior, which can provide additional agility in reacting to network threats. These tools also often include
    a reporting capability to provide network awareness of the system, which may not otherwise exist in an organization's
    systems management regime. 154 | P a g e
  impact: ''
  references: []
  page_start: 154
  audit_raw: 'Ask if a host-based intrusion detection application is loaded on the system. Per OPORD 160080, the preferred
    intrusion detection system is McAfee HBSS available through the U.S.

    Cyber Command (USCYBERCOM).

    If another host-based intrusion detection application is in use, such as SELinux, this must

    be documented and approved.

    Procedure:

    Examine the system to determine if the Host Intrusion Prevention System (HIPS) is

    installed:

    # rpm -qa | grep MFEhiplsm

    Verify that the McAfee HIPS module is active on the system:

    # ps -ef | grep -i “hipclient”

    If the MFEhiplsm package is not installed, check for another intrusion detection system:

    # find / -name <daemon name>

    Where <daemon name> is the name of the primary application daemon to determine if the

    application is loaded on the system.

    Determine if the application is active on the system:

    # ps -ef | grep -i <daemon name>

    If the MFEhiplsm package is not installed and an alternate host-based intrusion detection

    application has not been documented for use, refer to the remediation procedure below.

    If no host-based intrusion detection system is installed and running on the system, refer to

    the remediation procedure below.

    155 | P a g e'
  remediation: 'Install and enable the latest McAfee HIPS package, available from USCYBERCOM.

    Note: If the system does not support the McAfee HIPS package, install and enable a

    supported intrusion detection system application and document its use with the

    Authorizing Official.

    Notes:

    This Benchmark recommendation maps to:

    Red Hat Enterprise Linux 7 Security Technical Implementation Guide:

    Version 2, Release: 3 Benchmark Date: 26 Apr 2019

    Vul ID: V-92255

    Rule ID: SV-102357r1_rule

    STIG ID: RHEL-07-020019

    Severity: CAT II

    156 | P a g e

    2 Services

    While applying system updates and patches helps correct known vulnerabilities, one of the

    best ways to protect the system against as yet unreported vulnerabilities is to disable all

    services that are not required for normal system operation. This prevents the exploitation

    of vulnerabilities discovered at a later date. If a service is not enabled, it cannot be

    exploited. The actions in this section of the document provide guidance on some services

    which can be safely disabled and under which circumstances, greatly reducing the number

    of possible threats to the resulting system. Additionally some services which should remain

    enabled but with secure configuration are covered as well as insecure service clients.

