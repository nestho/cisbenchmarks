- id: '5.9'
  title: Ensure number of concurrent sessions is limited
  scoring: scored
  profile: []
  description: The operating system must limit the number of concurrent sessions to 10 for all accounts and/or account types.
  rationale: Operating system management includes the ability to control the number of users and user sessions that utilize
    an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related
    to DoS attacks. This requirement addresses concurrent sessions for information system accounts and does not address concurrent
    sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based
    on mission needs and the operational environment for each system.
  impact: ''
  references: []
  page_start: 661
  audit_raw: 'Verify the operating system limits the number of concurrent sessions to 10 for all accounts

    and/or account types by issuing the following command:

    # grep "maxlogins" /etc/security/limits.conf

    * hard maxlogins 10

    This can be set as a global domain (with the * wildcard) but may be set differently for

    multiple domains.

    If the maxlogins item is missing, commented out, or the value is not set to 10 or less for all

    domains that have the maxlogins item assigned, refer to the remediation procedure below.

    661 | P a g e'
  remediation: 'Configure the operating system to limit the number of concurrent sessions to 10 for all

    accounts and/or account types.

    Example: vim /etc/security/limits.conf

    Add the following line to the top of the /etc/security/limits.conf:

    * hard maxlogins 10

    Notes:

    This Benchmark recommendation maps to:

    Red Hat Enterprise Linux 7 Security Technical Implementation Guide:

    Version 2, Release: 3 Benchmark Date: 26 Apr 2019

    Vul ID: V-72217

    Rule ID: SV-86841r2_rule

    STIG ID: RHEL-07-040000

    Severity: CAT III

    662 | P a g e'
