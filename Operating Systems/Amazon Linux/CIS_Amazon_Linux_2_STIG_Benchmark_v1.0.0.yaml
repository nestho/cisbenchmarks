      the old password. The minclass option sets the minimum number of required classes of

      characters for the new password (digits, upper-case, lower-case, others). The

      maxrepeat option sets the maximum number of allowed same consecutive characters in a

      new password. The maxclassrepeat option sets the maximum number of allowed same

      consecutive characters in the same class in the new password. The minlen option set'
    severity: medium
- id: 5.3.6
  title: Ensure no accounts are configured with blank or null passwords
  scoring: scored
  profile: []
  description: The operating system must not have accounts configured with blank or null passwords.
  rationale: If an account has an blank password, anyone could log on and run commands with the privileges of that account.
    Accounts with 'blank' passwords should never be used in operational environments.
  impact: 'Note: Manual changes to the listed files may be overwritten by the authconfig program. The authconfig program should
    not be used to update the configurations listed in this requirement. Notes: This Benchmark recommendation maps to: Red
    Hat Enterprise Linux 7 Security Technical Implementation Guide: Version 2, Release: 3 Benchmark Date: 26 Apr 2019 Vul
    ID: V-71937 Rule ID: SV-86561r3_rule STIG ID: RHEL-07-010290 Severity: CAT I 597 | P a g e'
