- id: 1.6.1.7
  title: Ensure no unconfined daemons exist
  scoring: scored
  profile:
  - Level 2
  description: Daemons that are not defined in SELinux policy will inherit the security context of their parent process.
  rationale: Since daemons are launched and descend from the init process, they will inherit the security context label initrc_t
    . This could cause the unintended consequence of giving the process more permission than it requires.
  impact: ''
  references: []
  page_start: 131
  audit_raw: 'Run the following command and verify no output is produced:

    # ps -eZ | grep -E "initrc" | grep -E -v -w "tr|ps|grep|bash|awk" | tr '':'' ''

    '' | awk ''{ print $NF }'''
  remediation: 'Investigate any unconfined daemons found during the audit action. They may need to have

    an existing security context assigned to them or a policy built for them.

    Notes:

    Occasionally certain daemons such as backup or centralized management software may

    require running unconfined. Any such software should be carefully analyzed and

    documented before such an exception is made.'
