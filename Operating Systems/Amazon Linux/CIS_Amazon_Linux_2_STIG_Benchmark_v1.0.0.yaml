  scoring: scored
  profile: []
  description: The operating system must be configured so that the user will be prompted when Ctrl-AltDelete key sequence
    is entered.
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the GNOME graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete
