- id: 1.4.4
  title: Ensure UEFI requires authentication for single-user and maintenance modes.
  scoring: scored
  profile: []
  description: If the operating system is using Unified Extensible Firmware Interface (UEFI) it must require authentication
    upon booting into single-user and maintenance modes.
  rationale: If the system does not require valid root authentication before it boots into single-user or maintenance mode,
    anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is
    the default boot loader and is designed to require a password to boot into single-user mode or make modifications to the
    boot menu.
  impact: 'This recommendation is only valid for Amazon Linux 2 when it is used on-premise. Notes: This Benchmark recommendation
    maps to: Red Hat Enterprise Linux 7 Security Technical Implementation Guide: Version 2, Release: 3 Benchmark Date: 26
