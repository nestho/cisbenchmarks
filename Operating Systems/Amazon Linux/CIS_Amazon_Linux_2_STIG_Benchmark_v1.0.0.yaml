- id: 5.1.2
  title: Ensure permissions on /etc/crontab are configured
  scoring: scored
  profile:
  - Level 1
  description: The /etc/crontab file is used by cron to control its own jobs. The commands in this item make sure that root
    is the user and group owner of the file and that only the owner can access the file.
  rationale: This file contains information on what system jobs are run by cron. Write access to these files could provide
    unprivileged users with the ability to elevate their privileges. Read access to these files could provide users with the
    ability to gain insight on system jobs that run on the system and could provide them a way to gain unauthorized privileged
    access.
  impact: ''
  references: []
  page_start: 500
  audit_raw: 'Run the following command and verify Uid and Gid are both 0/root and Access does not

    grant permissions to group or other :

    # stat /etc/crontab

    Access: (0600/-rw-------) Uid: ( 0/ root) Gid: ( 0/ root)'
  remediation: 'Run the following commands to set ownership and permissions on /etc/crontab :

    # chown root:root /etc/crontab

    # chmod og-rwx /etc/crontab'
  checks:
  - type: manual_review
    info: 'Run the following command and verify Uid and Gid are both 0/root and Access does not

      grant permissions to group or other :

      # stat /etc/crontab

      Access: (0600/-rw-------) Uid: ( 0/ root) Gid: ( 0/ root)'
    severity: medium
