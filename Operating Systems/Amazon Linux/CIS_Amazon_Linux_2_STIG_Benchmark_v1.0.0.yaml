- id: 1.3.3
  title: Ensure AIDE is configured to verify ACLs
  scoring: scored
  profile: []
  description: The operating system must be configured so that the file integrity tool is configured to verify Access Control
    Lists (ACLs).
  rationale: ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity
    tools.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Verify the file integrity tool is configured to verify ACLs.

    Note: AIDE is highly configurable at install time. These commands assume the aide.conf

    file is under the /etc directory.

    Use the following command to determine if the file is in another location:

    # find / -name aide.conf

    Check the aide.conf file to determine if the acl rule has been added to the rule list being

    applied to the files and directories selection lists.

    An example rule that includes the acl rule is below:

    All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux

    /bin All # apply the custom rule to the files in bin

    /sbin All # apply the same custom rule to the files in sbin

    If the acl rule is not being used on all uncommented selection lines in the /etc/aide.conf

    file, or ACLs are not being checked by another file integrity tool, refer to the remediation

    procedure below.

    87 | P a g e'
  remediation: 'Configure the file integrity tool to check file and directory ACLs.

    If AIDE is installed, ensure the acl rule is present on all uncommented file and directory

    selection lists.

    Example: vim /etc/aide.conf

    add a rule that includes the acl example:

    All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux

    /bin All # apply the custom rule to the files in bin

    /sbin All # apply the same custom rule to the files in sbin

    Notes:

    This checks for aide.conf in the default location. If aide.conf is in a different location,

    manually confirm that the setting(s) are correct.

