- id: 2.2.16
  title: Ensure mail transfer agent is configured for local-only mode
  scoring: scored
  profile:
  - Level 1
  description: Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming mail and transfer
    the messages to the appropriate user or mail server. If the system is not intended to be a mail server, it is recommended
    that the MTA be configured to only process local mail.
  rationale: The software for all Mail Transfer Agents is complex and most have a long history of security issues. While it
    is important to ensure that the system can process local mail messages, it is not necessary to have the MTA's daemon listening
    on a port unless the server is intended to be a mail server that receives and processes mail from other systems.
  impact: ''
  references: []
  page_start: 221
  audit_raw: 'Run the following command to verify that the MTA is not listening on any non-loopback

    address ( 127.0.0.1 or ::1 )

    Nothing should be returned

    # ss -lntu | grep -E '':25\s'' | grep -E -v ''\s(127.0.0.1|::1):25\s''

    If anything is return this will be an indication that the MTA is listening on a non-loopback

    address ( 127.0.0.1 or ::1 ), refer to the remediation procedure below.

    221 | P a g e'
  remediation: 'Edit /etc/postfix/main.cf and add the following line to the RECEIVING MAIL section. If

    the line already exists, change it to look like the line below:

    inet_interfaces = loopback-only

    Restart postfix with one of the following commands:

    # systemctl restart postfix

    Notes:

    This recommendation is designed around the postfix mail server, depending on your

    environment you may have an alternative MTA installed such as sendmail. If this is the case

    consult the documentation for your installed MTA to configure the recommended state.'
  checks:
