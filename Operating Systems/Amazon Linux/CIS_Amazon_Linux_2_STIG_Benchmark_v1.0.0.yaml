- id: 5.4.10
  title: Ensure default user umask is 077
  scoring: scored
  profile: []
  description: The operating system must set the umask value to 077 for all local interactive user accounts.
  rationale: The umask controls the default access mode assigned to newly created files. A umask of 077 limits new files to
    mode 700 or less permissive. Although umask can be represented as a four-digit number, the first digit representing special
    access modes is typically ignored or required to be "0". This requirement applies to the globally configured system defaults
    and the local interactive user defaults for each account on the system.
  impact: ''
  references: []
  page_start: 648
  audit_raw: 'Verify that the default umask for all local interactive users is 077.

    Identify the locations of all local interactive user home directories by looking at the

    /etc/passwd file.

    Check all local interactive user initialization files for interactive users with the following

    command:

    Note: The example is for a system that is configured to create users home directories in the

    /home directory.

    # grep -i umask /home/*/.*

    If any local interactive user initialization (dot) files are found to have a umask statement

    that has a value less restrictive than 077, refer to the remediation procedure below.

    648 | P a g e'
  remediation: 'Remove the umask statement from all local interactive user''s initialization files.

    Using the list collected in the audit run the following command on all the files located with

    a less restrictive umask:

    user@server# ~]$ echo ''umask 077'' [] /home/user/path_to_file

    If the account is for an application, the requirement for a umask less restrictive than 077

    can be documented, but the user agreement for access to the account must specify that the

    local interactive user must log on to their account first and then switch the user to the

    application account with the correct option to gain the account''s environment variables.

