    /etc/pam.d/system-auth and /etc/pam.d/password-auth .

    Run the following commands and ensure the sha512 option is included in all results:

    # egrep ''^password\s+sufficient\s+pam_unix.so'' /etc/pam.d/password-auth

    password sufficient pam_unix.so sha512

    # egrep ''^password\s+sufficient\s+pam_unix.so'' /etc/pam.d/system-auth

    password sufficient pam_unix.so sha512'
  remediation: 'Set password hashing algorithm to sha512. Many distributions provide tools for updating

    PAM configuration, consult your documentation for details. If no tooling is provided edit

    the appropriate /etc/pam.d/ configuration file and add or modify the pam_unix.so lines to

    include the sha512 option:

