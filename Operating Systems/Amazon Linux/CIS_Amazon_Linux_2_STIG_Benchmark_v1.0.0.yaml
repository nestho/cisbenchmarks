- id: 5.3.7
  title: Ensure lockout for unsuccessful root logon attempts
  scoring: scored
  profile: []
  description: The operating system must lock the associated account after 3 unsuccessful root logon attempts are made within
    a 15-minute period.
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute forcing, is reduced. Limits are imposed by locking the account.
  impact: 'Note: Manual changes to the listed files may be overwritten by the "authconfig" program. The "authconfig" program
    should not be used to update the configurations listed in this requirement. Notes: This Benchmark recommendation maps
    to: Red Hat Enterprise Linux 7 Security Technical Implementation Guide: Version 2, Release: 3 Benchmark Date: 26 Apr 2019
    Vul ID: V-71945 Rule ID: SV-86569r4_rule STIG ID: RHEL-07-010330 Severity: CAT II 599 | P a g e'
  references: []
  page_start: 598
  audit_raw: 'Verify the operating system automatically locks the root account until it is released by an

    administrator when 3 unsuccessful logon attempts in 15 minutes are made.

    # grep pam_faillock.so /etc/pam.d/password-auth

    auth required pam_faillock.so preauth silent audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    auth [default=die] pam_faillock.so authfail audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    account required pam_faillock.so

    If the even_deny_root setting is not defined on both lines with the pam_faillock.so

    module, is commented out, or is missing from a line, refer to the remediation procedure

    below.

    # grep pam_faillock.so /etc/pam.d/system-auth

    auth required pam_faillock.so preauth silent audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    auth [default=die] pam_faillock.so authfail audit deny=3 even_deny_root

    fail_interval=900 unlock_time=900

    account required pam_faillock.so

    If the even_deny_root setting is not defined on both lines with the pam_faillock.so

    module, is commented out, or is missing from a line, refer to the remediation procedure

    below.

    598 | P a g e'
  remediation: 'To configure the operating system to lock automatically the root account until the locked

    account is released by an administrator when 3 unsuccessful logon attempts in 15 minutes

    are made.

