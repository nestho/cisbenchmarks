- id: 2.2.1.1
  title: Ensure time synchronization is in use
  scoring: scored
  profile:
  - Level 1
  description: System time should be synchronized between all systems in an environment. This is typically done by establishing
    an authoritative time server or set of servers and having all systems synchronize their clocks to them.
  rationale: Time synchronization is important to support time sensitive security mechanisms like Kerberos and also ensures
    log files have consistent time records across the enterprise, which aids in forensic investigations.
  impact: ''
  references: []
  page_start: 169
  audit_raw: 'On physical systems or virtual systems where host based time synchronization is not

    available verify that NTP, chrony, or timesyncd is installed. Depending on the package

    management in use one of the following command groups may provide the needed

    information:

    # rpm -q chrony

    OR

    # rpm -q ntp

    On virtual systems where host based time synchronization is available consult your

    virtualization software documentation and verify that host based synchronization is in use.

    169 | P a g e'
  remediation: 'On physical systems or virtual systems where host based time synchronization is not

    available install NTP or chrony using the appropriate package manager or manual

    installation:

    To install chrony:

    Run one of the folloing commands:

    # yum install chrony

    OR

    To install ntp:

    Run one of the following commands:

    # yum install ntp

    On virtual systems where host based time synchronization is available consult your

    virtualization software documentation and setup host based synchronization.

    Notes:

    systemd-timesyncd is part of systemd. Some versions of systemd have been compiled

    without systemd-timesycnd. On these distributions, chrony or NTP should be used instead

    of systemd-timesycnd.

