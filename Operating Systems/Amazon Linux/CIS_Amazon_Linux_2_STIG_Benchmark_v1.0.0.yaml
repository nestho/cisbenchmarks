    severity: medium
- id: 6.1.3
  title: Ensure permissions on /etc/shadow are configured
  scoring: scored
  profile:
  - Level 1
  description: The /etc/shadow file is used to store the information about user accounts that is critical to the security
    of those accounts, such as the hashed password and other security information.
  rationale: If attackers can gain read access to the /etc/shadow file, they can easily run a password cracking program against
    the hashed password to break it. Other security information that is stored in the /etc/shadow file (such as expiration)
    could also be useful to subvert the user accounts.
  impact: ''
  references: []
  page_start: 671
  audit_raw: 'Run the following command and verify verify Uid is 0/root, Gid is 0/root or

    <gid>/shadow, and Access is 640 or more restrictive:

    # stat /etc/shadow

    Access: (0640/-rw-r-----) Uid: ( 0/ root) Gid: ( 0/ root)'
  remediation: 'Run the following chown command and the chmod to set permissions on /etc/shadow :

    # chown root:root /etc/shadow

    # chmod o-rwx,g-wx /etc/shadow'
  checks:
  - type: manual_review
    info: 'Run the following command and verify verify Uid is 0/root, Gid is 0/root or

