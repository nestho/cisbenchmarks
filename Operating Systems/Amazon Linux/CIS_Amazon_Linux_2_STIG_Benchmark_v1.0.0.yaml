- id: 1.1.20
  title: Disable Automounting
  scoring: scored
  profile:
  - Level 1
  description: autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives. The operating system
    must be configured so that all world-writable directories are groupowned by root, sys, bin, or an application group.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves. If a world-writable directory has the sticky
    bit set and is not group-owned by a privileged Group Identifier (GID), unauthorized users may be able to modify files
    created by others. The only authorized public directories are those temporary directories supplied with the system or
    those designed to be temporary file repositories. The setting is normally reserved for directories used by the system
    and by users for temporary file storage, (e.g., /tmp), and for directories requiring global read/write access.
  impact: 'The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting. 69 | P a g e Notes: Additional methods of disabling a service exist. Consult your distribution
    documentation for appropriate methods. This control should align with the tolerance of the use of portable drives and
    optical media in the organization. On a server requiring an admin to manually mount media can be part of defense-in-depth
    to reduce the risk of unapproved software or information being introduced or proprietary software or information being
    exfiltrated. If admins commonly use flash drives and Server access has sufficient physical controls, requiring manual
    mounting may not increase security. This Benchmark recommendation maps to: Red Hat Enterprise Linux 7 Security Technical
    Implementation Guide: Version 2, Release: 3 Benchmark Date: 26 Apr 2019 Vul ID: V-71985 Rule ID: SV-86609r2_rule STIG
    ID: RHEL-07-020110 Severity: CAT II'
  references: []
  page_start: 69
  audit_raw: 'Run one of the following commands to verify autofs is not enabled:

    Verify all runlevels are listed as "off" or autofs is not available.

    # systemctl is-enabled autofs

    disabled

    Verify result is not "enabled".

    # ls /etc/rc*.d | grep autofs

    Verify no S* lines are returned.

    Verify all world-writable directories are group-owned by root, sys, bin, or an application

    group.

    Check the system for world-writable directories with the following command:

    Note: The value after -fstype must be replaced with the filesystem type. XFS is used as an

    example.

    # find / -xdev -perm -002 -type d -fstype xfs -exec ls -lLd {} \;

    drwxrwxrwt 2 root root 40 Aug 26 13:07 /dev/mqueue

    drwxrwxrwt 2 root root 220 Aug 26 13:23 /dev/shm

    drwxrwxrwt 14 root root 4096 Aug 26 13:29 /tmp

