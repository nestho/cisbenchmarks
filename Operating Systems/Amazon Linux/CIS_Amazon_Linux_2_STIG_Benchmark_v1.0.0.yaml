- id: 4.1.10
  title: Ensure session initiation information is collected
  scoring: scored
  profile:
  - Level 2
  description: Monitor session initiation events. The parameters in this section track changes to the files associated with
    session events. The file /var/run/utmp tracks all currently logged in users. All audit records will be tagged with the
    identifier "session." The /var/log/wtmp file tracks logins, logouts, shutdown, and reboot events. The file /var/log/btmp
    keeps track of failed login attempts and can be read by entering the command /usr/bin/last -f /var/log/btmp . All audit
    records will be tagged with the identifier "logins."
  rationale: Monitoring these files for changes could alert a system administrator to logins occurring at unusual hours, which
