- id: 2.2.2.2
  title: Ensure GNOME Screen Lock is Enabled.
  scoring: scored
  profile: []
  description: The operating system should enable a user session lock until that user re-establishes access using established
    identification and authentication procedures. A session lock is a temporary action taken that locks the screen when a
    user stops work and moves away from the immediate physical vicinity of the information system but does not want to log
    out because of the temporary nature of the absence.
  rationale: The screen lock should be implemented at the point where session activity can be determined. Regardless of where
    the screen lock is determined and implemented, once invoked, the screen lock must remain in place until the user re-authenticates.
    No other activity aside from re-authentication must unlock the system.
  impact: 'Users must log out and back in again before the system-wide settings take effect. Notes: This Benchmark recommendation
    maps to: Red Hat Enterprise Linux 7 Security Technical Implementation Guide: Version 2, Release: 3 Benchmark Date: 26
