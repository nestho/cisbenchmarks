  page_start: 596
  audit_raw: 'To verify that null or blank passwords cannot be used, run the following command:

    # grep nullok /etc/pam.d/system-auth /etc/pam.d/password-auth

    password sufficient pam_unix.so sha=512 shadow

    nullok try_first_pass use_authtok

    If this produces any output, it may be possible to log on with accounts with ''blank''

    passwords.

    If null or `blank'' passwords can be used, please refer to the remediation procedure below.

    596 | P a g e'
  remediation: 'If an account is configured for password authentication but does not have an assigned

    password, it may be possible to log on to the account without authenticating.

    Remove any instances of the nullok option in /etc/pam.d/system-auth and

    /etc/pam.d/password-auth to prevent logons with empty or blank passwords.

    Example: vim /etc/pam.d/system-auth

