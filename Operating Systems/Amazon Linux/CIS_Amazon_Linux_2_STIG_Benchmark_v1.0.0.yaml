  description: The default TMOUT determines the shell timeout for users. The TMOUT value is measured in seconds.
  rationale: Having no timeout value associated with a shell could allow an unauthorized user access to another user's shell
    session (e.g. user walks away from their computer and doesn't lock the screen). Setting a timeout value at least reduces
