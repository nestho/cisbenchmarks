  title: Ensure nosuid option is set for NFS
  scoring: scored
  profile: []
  description: The operating system must prevent files with the setuid and setgid bit set from being executed on file systems
    that are being imported via Network File System (NFS).
  rationale: The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges.
    This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing
    files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative
    access.
  impact: ''
  references: []
  page_start: 243
  audit_raw: 'Verify file systems that are being NFS imported are configured with the nosuid option.

