- id: 5.2.22
  title: Ensure only FIPS 140-2 ciphers are used for SSH
  scoring: scored
  profile: []
  description: The operating system must use a FIPS 140-2 approved cryptographic algorithm for SSH communications.
  rationale: Unapproved mechanisms that are used for authentication to the cryptographic module are not verified and therefore
    cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised. Operating systems utilizing
    encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the
    current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets
    DoD requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general purpose computing system.
  impact: 'The only "strong" ciphers currently FIPS 140-2 compliant are: aes256-ctr,aes192ctr,aes128-ctr Notes: This Benchmark
    recommendation maps to: Red Hat Enterprise Linux 7 Security Technical Implementation Guide: Version 2, Release: 3 Benchmark
    Date: 26 Apr 2019 Vul ID: V-72221 Rule ID: SV-86845r3_rule STIG ID: RHEL-07-040110 Severity: CAT II 556 | P a g e'
  references: []
  page_start: 555
  audit_raw: 'Verify the operating system uses mechanisms meeting the requirements of applicable

    federal laws, Executive orders, directives, policies, regulations, standards, and guidance for

    authentication to a cryptographic module.

    Note: If Benchmark recommendation 1.5.7 fails, this is automatically a finding as the

    system cannot implement FIPS 140-2-approved cryptographic algorithms and hashes.

    The location of the sshd_config file may vary if a different daemon is in use. The command

    below utilizes this path /etc/ssh/sshd_config.

    Inspect the Ciphers configuration with the following command:

    # grep -i ciphers /etc/ssh/sshd_config

    Ciphers aes128-ctr,aes192-ctr,aes256-ctr

    If any ciphers other than aes128-ctr, aes192-ctr, or aes256-ctr are listed, the Ciphers

    keyword is missing, or the returned line is commented out, refer to the remediation

    procedure below.

    555 | P a g e'
  remediation: 'Configure SSH to use FIPS 140-2 approved cryptographic algorithms.

    Add the following line (or modify the line to have the required value) to the

    /etc/ssh/sshd_config file (this file may be named differently or be in a different location

    if using a version of SSH that is provided by a third-party vendor).

    Example: vim /etc/ssh/sshd_config

    Add, uncomment or update the following line:

    Ciphers aes128-ctr,aes192-ctr,aes256-ctr

    The SSH service must be restarted for changes to take effect.

    # systemctl restart sshd.service'
  checks:
