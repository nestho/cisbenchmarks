  audit_raw: "Run the following script to verify no unowned or ungrouped files or directories exist:\n#!/usr/bin/env bash\n\
    {\n l_output=\"\" l_output2=\"\"\n a_path=(); a_arr=(); a_nouser=(); a_nogroup=() # Initialize arrays\n a_path=(! -path\
    \ \"/run/user/*\" -a ! -path \"/proc/*\" -a ! -path\n\"*/containerd/*\" -a ! -path \"*/kubelet/pods/*\")\n while read\
    \ -r l_bfs; do\n a_path+=( -a ! -path \"\"$l_bfs\"/*\")\n done < <(findmnt -Dkerno fstype,target | awk '$1 ~ /^\\s*(nfs|proc|smb)/\n\
    {print $2}')\n while IFS= read -r -d $'\\0' l_file; do\n [ -e \"$l_file\" ] && a_arr+=(\"$(stat -Lc '%n^%U^%G' \"$l_file\"\
    )\") && echo\n\"Adding: $l_file\"\n done < <(find / \\( \"${a_path[@]}\" \\) \\( -type f -o -type d \\) \\( -nouser -\n\
    o -nogroup \\) -print0 2> /dev/null)\n while IFS=\"^\" read -r l_fname l_user l_group; do # Test files in the array\n\
    \ [ \"$l_user\" = \"UNKNOWN\" ] && a_nouser+=(\"$l_fname\")\n [ \"$l_group\" = \"UNKNOWN\" ] && a_nogroup+=(\"$l_fname\"\
    )\n done <<< \"$(printf '%s\\n' \"${a_arr[@]}\")\"\n if ! (( ${#a_nouser[@]} > 0 )); then\n l_output=\"$l_output\\n -\
    \ No unowned files or directories exist on the\nlocal filesystem.\"\n else\n l_output2=\"$l_output2\\n - There are \\\"\
    $(printf '%s'\n\"${#a_nouser[@]}\")\\\" unowned files or directories on the system.\\n - The\nfollowing is a list of unowned\
    \ files and/or directories:\\n$(printf '%s\\n'\n\"${a_nouser[@]}\")\\n - end of list\"\n fi\n if ! (( ${#a_nogroup[@]}\
    \ > 0 )); then\n l_output=\"$l_output\\n - No ungrouped files or directories exist on the\nlocal filesystem.\"\n else\n\
