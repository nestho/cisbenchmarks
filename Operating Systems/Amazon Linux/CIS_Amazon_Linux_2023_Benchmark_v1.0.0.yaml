- id: 2.2.15
  title: Ensure mail transfer agent is configured for local-only mode
  scoring: scored
  profile:
  - Level 1 - Server
  description: Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming mail and transfer
    the messages to the appropriate user or mail server. If the system is not intended to be a mail server, it is recommended
    that the MTA be configured to only process local mail.
  rationale: 'The software for all Mail Transfer Agents is complex and most have a long history of security issues. While
    it is important to ensure that the system can process local mail messages, it is not necessary to have the MTA''s daemon
    listening on a port unless the server is intended to be a mail server that receives and processes mail from other systems.
    Note: • This recommendation is designed around the postfix mail server. • Depending on your environment you may have an
    alternative MTA installed such as sendmail. If this is the case consult the documentation for your installed MTA to configure
    the recommended state.'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 233
  audit_raw: 'Run the following command to verify that the MTA is not listening on any non-loopback

    address ( 127.0.0.1 or ::1 )

    Nothing should be returned

    # ss -lntu | grep -P '':25\b'' | grep -Pv ''\h+(127\.0\.0\.1|\[?::1\]?):25\b'''
  remediation: 'Edit /etc/postfix/main.cf and add the following line to the RECEIVING MAIL section.

    If the line already exists, change it to look like the line below:

    inet_interfaces = loopback-only

    Run the following command to restart postfix:

    # systemctl restart postfix'
