      \ from loopback address\ncorrectly set to drop\"\n else\n l_output2=\"$l_output2\\n - IPv4 network traffic from loopback\
      \ address\nnot set to drop\"\n fi\n if grep -Pq -- '^\\h*0\\h*$' /sys/module/ipv6/parameters/disable; then\n l_ip6saddr=\"\
