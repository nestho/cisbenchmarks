      ${l_out//# /}\"\n else\n l_kpar=\"$(awk -F= '{print $1}' <<< \"$l_out\" | xargs)\"\n [ \"$l_kpar\" = \"$l_kpname\" ]\
      \ && A_out+=([\"$l_kpar\"]=\"$l_file\")\n fi\n fi\n done < <(/usr/lib/systemd/systemd-sysctl --cat-config | grep -Po\n\
