- id: 4.1.9
  title: Ensure at is restricted to authorized users
  scoring: scored
  profile:
  - Level 1 - Server
  description: '-- IF -- at is installed in the system: Configure /etc/at.allow to allow specific users to use these services.
    If /etc/at.allow does not exist, then /etc/at.deny is checked. Any user not specifically defined in those files is allowed
    to use at. By removing the file, only users in /etc/at.allow are allowed to use at. Note: Even though a given user is
    not listed in at.allow, at jobs can still be run as that user. The at.allow file only controls administrative access to
    the at command for scheduling and modifying at jobs.'
  rationale: On many systems, only the system administrator is authorized to schedule at jobs. Using the at.allow file to
    control who can run at jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny list,
    you could potentially add a user ID to the system and forget to add it to the deny files.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 371
  audit_raw: "Run the following script:\n#!/usr/bin/env bash\n{\n if rpm -q at >/dev/null; then\n [ -e /etc/at.deny ] && echo\
    \ \"Fail: at.deny exists\"\n if [ ! -e /etc/at.allow ]; then\n echo \"Fail: at.allow doesn't exist\"\n else\n ! stat -Lc\
    \ \"%a\" /etc/at.allow | grep -Eq \"[0,2,4,6]00\" && echo\n\"Fail: at.allow mode too permissive\"\n ! stat -Lc \"%u:%g\"\
    \ /etc/at.allow | grep -Eq \"^0:0$\" && echo \"Fail:\nat.allow owner and/or group not root\"\n fi\n if [ ! -e /etc/at.deny\
    \ ] && [ -e /etc/at.allow ] && stat -Lc \"%a\"\n/etc/at.allow | grep -Eq \"[0,2,4,6]00\" \\\n && stat -Lc \"%u:%g\" /etc/at.allow\
    \ | grep -Eq \"^0:0$\"; then\n echo \"Pass\"\n fi\n else\n echo \"Pass: at is not installed on the system\"\n fi\n}\n\
    Verify the output of the script includes Pass"
  remediation: "Run the following script to remove /etc/at.deny, create /etc/at.allow, and set the file\nmode for /etc/at.allow:\n\
    #!/usr/bin/env bash\n{\n if rpm -q at >/dev/null; then\n [ -e /etc/at.deny ] && rm -f /etc/at.deny\n [ ! -e /etc/at.allow\
    \ ] && touch /etc/at.allow\n chown root:root /etc/at.allow\n chmod u-x,go-rwx /etc/at.allow\n else\n echo \"at is not\
    \ installed on the system\"\n fi\n}\nOR Run the following command to remove at:\n# dnf remove at"
