    # [ -f /boot/grub2/grubenv ] && chown root:root /boot/grub2/grubenv

    # [ -f /boot/grub2/grubenv ] && chmod u-x,go-rwx /boot/grub2/grubenv

    # [ -f /boot/grub2/user.cfg ] && chown root:root /boot/grub2/user.cfg

    # [ -f /boot/grub2/user.cfg ] && chmod u-x,go-rwx /boot/grub2/user.cfg'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n file_mug_chk()\n {\n l_out=\"\" l_out2=\"\"\n [[ \"$(dirname\
      \ \"$l_file\")\" =~ ^\\/boot\\/efi\\/EFI ]] && l_pmask=\"0077\" ||\nl_pmask=\"0177\"\n l_maxperm=\"$( printf '%o' $((\
      \ 0777 & ~$l_pmask )) )\"\n if [ $(( $l_mode & $l_pmask )) -gt 0 ]; then\n l_out2=\"$l_out2\\n - Is mode \\\"$l_mode\\\
      \" and should be mode:\n\\\"$l_maxperm\\\" or more restrictive\"\n else\n l_out=\"$l_out\\n - Is correctly mode: \\\"\
      $l_mode\\\" which is mode:\n\\\"$l_maxperm\\\" or more restrictive\"\n fi\n if [ \"$l_user\" = \"root\" ]; then\n l_out=\"\
      $l_out\\n - Is correctly owned by user: \\\"$l_user\\\"\"\n else\n l_out2=\"$l_out2\\n - Is owned by user: \\\"$l_user\\\
      \" and should be\nowned by user: \\\"root\\\"\"\n fi\n if [ \"$l_group\" = \"root\" ]; then\n l_out=\"$l_out\\n - Is\
      \ correctly group-owned by group: \\\"$l_user\\\"\"\n else\n l_out2=\"$l_out2\\n - Is group-owned by group: \\\"$l_user\\\
      \" and\nshould be group-owned by group: \\\"root\\\"\"\n fi\n [ -n \"$l_out\" ] && l_output=\"$l_output\\n - File: \\\
      \"$l_file\\\"$l_out\\n\"\n [ -n \"$l_out2\" ] && l_output2=\"$l_output2\\n - File:\n\\\"$l_file\\\"$l_out2\\n\"\n }\n\
      \ while IFS= read -r -d $'\\0' l_gfile; do\n while read -r l_file l_mode l_user l_group; do\n file_mug_chk\n done <<<\
      \ \"$(stat -Lc '%n %#a %U %G' \"$l_gfile\")\"\n done < <(find /boot -type f \\( -name 'grub*' -o -name 'user.cfg' \\\
      ) -\nprint0)\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n *** PASS ***\\n- * Correctly set *\n\
      :\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for audit\nfailure * :\\n$l_output2\\\
      n\"\n [ -n \"$l_output\" ] && echo -e \" - * Correctly set * :\\n$l_output\\n\"\n fi\n}"
