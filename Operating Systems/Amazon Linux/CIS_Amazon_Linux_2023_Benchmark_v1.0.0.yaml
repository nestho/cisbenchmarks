  description: Tables hold chains. Each table only has one address family and only applies to packets of this family. Tables
    can have one of five families.
  rationale: Without a table, nftables will not filter network traffic.
  impact: Adding or modifying firewall rules can cause loss of connectivity to the system
  references:
