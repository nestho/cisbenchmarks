    \ -v \"$l_mname\" 2>&1 | grep -Pi --\n\"\\h*modprobe:\\h+FATAL:\\h+Module\\h+$l_mname\\h+not\\h+found\\h+in\\h+directory\"\
    )\"\n]; then\n # Check how module will be loaded\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"\
    $l_loadable\")\" -gt \"1\" ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n\
    \ if grep -Pq -- '^\\h*install \\/bin\\/(true|false)' <<< \"$l_loadable\";\nthen\n l_output=\"$l_output\\n - module: \\\
    \"$l_mname\\\" is not loadable:\n\\\"$l_loadable\\\"\"\n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is\
    \ loadable:\n\\\"$l_loadable\\\"\"\n fi\n # Check is the module currently loaded\n if ! lsmod | grep \"$l_mname\" > /dev/null\
    \ 2>&1; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loaded\"\n else\n l_output2=\"$l_output2\\n -\
    \ module: \\\"$l_mname\\\" is loaded\"\n fi\n # Check if the module is deny listed\n if modprobe --showconfig | grep -Pq\
    \ -- \"^\\h*blacklist\\h+$(tr '-' '_'\n<<< \"$l_mname\")\\b\"; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\
    \" is deny listed in:\n\\\"$(grep -Pl -- \"^\\h*blacklist\\h+$l_mname\\b\" /etc/modprobe.d/*)\\\"\"\n else\n l_output2=\"\
    $l_output2\\n - module: \\\"$l_mname\\\" is not deny listed\"\n fi\n else\n l_output=\"$l_output\\n - Module \\\"$l_mname\\\
