- id: 4.2.4
  title: Ensure SSH access is limited
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended
    that at least one of the following options be leveraged: • AllowUsers: o The AllowUsers variable gives the system administrator
    the option of allowing specific users to ssh into the system. The list consists of space separated user names. Numeric
    user IDs are not recognized with this variable. If a system administrator wants to restrict user access further by only
    allowing the allowed users to log in from a particular host, the entry can be specified in the form of user@host. • AllowGroups:
    o The AllowGroups variable gives the system administrator the option of allowing specific groups of users to ssh into
    the system. The list consists of space separated group names. Numeric group IDs are not recognized with this variable.
    • DenyUsers: o The DenyUsers variable gives the system administrator the option of denying specific users to ssh into
    the system. The list consists of space separated user names. Numeric user IDs are not recognized with this variable. If
    a system administrator wants to restrict user access further by specifically denying a user''s access from a particular
    host, the entry can be specified in the form of user@host. • DenyGroups: o The DenyGroups variable gives the system administrator
    the option of denying specific groups of users to ssh into the system. The list consists of space separated group names.
    Numeric group IDs are not recognized with this variable.'
  rationale: Restricting which users can remotely access the system via SSH will help ensure that only authorized users access
    the system.
  impact: ''
  references:
  - 1. SSHD_CONFIG(5)
  - '2. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 385
  audit_raw: 'Run the following commands and verify the output:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep -Pi

    ''^\h*(allow|deny)(users|groups)\h+\H+(\h+.*)?$''

    # grep -Pi ''^\h*(allow|deny)(users|groups)\h+\H+(\h+.*)?$''

    /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf

    Verify that the output of both commands matches at least one of the following lines:

    allowusers <userlist>

    allowgroups <grouplist>

    denyusers <userlist>

    denygroups <grouplist>'
