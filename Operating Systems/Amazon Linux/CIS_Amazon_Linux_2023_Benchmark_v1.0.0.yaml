    \ files passed, then we pass\n if [ -z \"$output\" ]; then\n echo -e \"\\n- Audit Results:\\n ** Pass **\\n- All files\
    \ in \\\"/var/log/\\\"\nhave appropriate permissions and ownership\\n\"\n else\n # print the reason why we are failing\n\
