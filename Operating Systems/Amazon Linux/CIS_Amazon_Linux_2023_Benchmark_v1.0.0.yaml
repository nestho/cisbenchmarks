- id: 5.2.3.4
  title: Ensure events that modify date and time information are collected
  scoring: scored
  profile:
  - Level 2 - Server
  description: Capture events where the system date and/or time has been modified. The parameters in this section are set
    to determine if the; • adjtimex - tune kernel clock • settimeofday - set time using timeval and timezone structures •
    stime - using seconds since 1/1/1970 • clock_settime - allows for the setting of several internal clocks and timers system
    calls have been executed. Further, ensure to write an audit record to the configured audit log file upon exit, tagging
    the records with a unique identifier such as "time-change".
  rationale: Unexpected changes in system date and/or time could be a sign of malicious activity on the system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3, CM-6'
  page_start: 563
  audit_raw: "64 Bit systems\nOn disk configuration\nRun the following command to check the on disk rules:\n# {\n awk '/^\
    \ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&/ -S/ \\\n &&(/adjtimex/ \\\n ||/settimeofday/ \\\n ||/clock_settime/\
    \ ) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n awk '/^ *-w/ \\\n &&/\\/etc\\/localtime/\
    \ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n}\nVerify output of matches:\n\
    -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k timechange\n-a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime\
    \ -k timechange\n-w /etc/localtime -p wa -k time-change\nRunning configuration\nRun the following command to check loaded\
    \ rules:\n# {\n auditctl -l | awk '/^ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&/ -S/ \\\n &&(/adjtimex/\
    \ \\\n ||/settimeofday/ \\\n ||/clock_settime/ ) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\n auditctl -l | awk '/^\
    \ *-w/ \\\n &&/\\/etc\\/localtime/ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\n}\nVerify the output\
    \ includes:\n-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -F\nkey=time-change\n-a always,exit -F\
    \ arch=b32 -S adjtimex,settimeofday,clock_settime -F\nkey=time-change\n-w /etc/localtime -p wa -k time-change\n32 Bit\
    \ systems\nFollow the same procedures as for 64 bit systems and ignore any entries with b64.\nIn addition, also audit\
    \ for the stime system call rule. For example:\n-a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime,stime\
    \ -k\ntime-change"
  remediation: 'Create audit rules

    Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

    with the relevant rules to monitor events that modify date and time information.

    64 Bit systems

    Example:

    # printf "

    -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k timechange

    -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k timechange

    -w /etc/localtime -p wa -k time-change

    " >> /etc/audit/rules.d/50-time-change.rules

    Load audit rules

    Merge and load the rules into active configuration:

    # augenrules --load

    Check if reboot is required.

    # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot

    required to load rules\n"; fi

    32 Bit systems

    Follow the same procedures as for 64 bit systems and ignore any entries with b64. In

    addition, add stime to the system call audit. Example:

    -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime,stime -k

    time-change'
  checks:
  - type: command
    command: auditctl -l | awk '/^ *-a *always,exit/ \ && auditctl -l | awk '/^ *-w/ \
    expected: ''
    severity: medium
    info: "64 Bit systems\nOn disk configuration\nRun the following command to check the on disk rules:\n# {\n awk '/^ *-a\
      \ *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&/ -S/ \\\n &&(/adjtimex/ \\\n ||/settimeofday/ \\\n ||/clock_settime/\
      \ ) \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n awk '/^ *-w/ \\\n &&/\\/etc\\/localtime/\
      \ \\\n &&/ +-p *wa/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/aud"
- id: 5.2.3.5
  title: Ensure events that modify the system's network environment are collected
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'Record changes to network environment files or system calls. The below parameters monitors the following system
    calls, and write an audit event on system call exit: • sethostname - set the systems host name • setdomainname - set the
    systems domain name The files being monitored are: • /etc/issue and /etc/issue.net - messages displayed pre-login • /etc/hosts
    - file containing host names and associated IP addresses • /etc/sysconfig/network - additional information that is valid
    to all network interfaces • /etc/sysconfig/network-scripts/ - directory containing network interface scripts and configurations
    files'
  rationale: Monitoring sethostname and setdomainname will identify potential unauthorized changes to host and domain name
    of a system. The changing of these names could potentially break security parameters that are set based on those names.
    The /etc/hosts file is monitored for changes that can indicate an unauthorized intruder is trying to change machine associations
    with IP addresses and trick users and processes into connecting to unintended machines. Monitoring /etc/issue and /etc/issue.net
    is important, as intruders could put disinformation into those files and trick users into providing information to the
    intruder. Monitoring /etc/sysconfig/network is important as it can show if network interfaces or scripts are being modified
    in a way that can lead to the machine becoming unavailable or compromised. All audit records should have a relevant tag
    associated with them.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3, CM-6'
