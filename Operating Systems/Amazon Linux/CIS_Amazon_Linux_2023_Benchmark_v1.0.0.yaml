- id: 4.2.13
  title: Ensure SSH AllowTcpForwarding is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: SSH port forwarding is a mechanism in SSH for tunneling application ports from the client to the server, or
    servers to clients. It can be used for adding encryption to legacy applications, going through firewalls, and some system
    administrators and IT professionals use it for opening backdoors into the internal network from their home machines
  rationale: Leaving port forwarding enabled can expose the organization to security risks and backdoors. SSH connections
    are protected with strong encryption. This makes their contents invisible to most deployed network monitoring and traffic
    filtering solutions. This invisibility carries considerable risk potential if it is used for malicious purposes such as
    data exfiltration. Cybercriminals or malware could exploit SSH to hide their unauthorized communications, or to exfiltrate
    stolen data from the target network
  impact: SSH tunnels are widely used in many corporate environments that employ mainframe systems as their application backends.
    In those environments the applications themselves may have very limited native support for security. By utilizing tunneling,
    compliance with SOX, HIPAA, PCI-DSS, and other standards can be achieved without having to modify the applications.
  references:
  - 1. https://www.ssh.com/ssh/tunneling/example
