      \ address is\ncorrectly set to accept\"\n else\n l_output2=\"$l_output2\\n - Network traffic to the loopback address\
      \ is\nnot set to accept\"\n fi\n l_ipsaddr=\"$(nft list ruleset | awk\n'/filter_IN_public_deny|hook\\s+input\\s+/,/\\\
      }\\s*(#.*)?$/' | grep -P --\n'ip\\h+saddr')\"\n if grep -Pq --\n'ip\\h+saddr\\h+127\\.0\\.0\\.0\\/8\\h+(counter\\h+packets\\\
