    \ *\n:\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for audit\nfailure * :\\n$l_output2\"\
    \n [ -n \"$l_output\" ] && echo -e \"\\n- * Correctly configured *\n:\\n$l_output\\n\"\n fi\n}\nNote: On systems with\
    \ a large number of files and/or directories, this audit may be a\nlong running process"
