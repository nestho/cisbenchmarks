- id: 4.5.1
  title: Ensure password creation requirements are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The pam_pwquality.so module checks the strength of passwords. It performs checks such as making sure a password
    is not a dictionary word, it is a certain length, contains a mix of characters (e.g. alphabet, numeric, other) and more.
    The following are definitions of the pam_pwquality.so options. • try_first_pass - retrieve the password from a previous
    stacked PAM module. If not available, then prompt the user for a password. • retry=3 - Allow 3 tries before sending back
    a failure. • minlen=14 - password must be 14 characters or more Either of the following can be used to enforce complex
    passwords: • minclass=4 - provide at least four classes of characters for the new password OR • dcredit=-1 - provide at
    least one digit • ucredit=-1 - provide at least one uppercase character • ocredit=-1 - provide at least one special character
    • lcredit=-1 - provide at least one lowercase character The settings shown above are one possible policy. Alter these
    values to conform to your own organization''s password policies'
  rationale: Strong passwords protect systems from being hacked through brute force methods.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 442
  audit_raw: 'Verify password creation requirements conform to organization policy:

    Run the following command and verify that retry conforms to organization policy.

    # grep pam_pwquality.so /etc/pam.d/system-auth /etc/pam.d/password-auth

    Output should be similar to:

    /etc/pam.d/system-auth:password requisite pam_pwquality.so try_first_pass

    local_users_only enforce_for_root retry=3

    /etc/pam.d/password-auth:password requisite pam_pwquality.so try_first_pass

    local_users_only enforce_for_root retry=3

    Run the following commands and verify password length requirements conform to

    organization policy.

    # grep ^minlen /etc/security/pwquality.conf

    Verify minlen is 14 or more

    Run one of the following commands and verify that password complexity conforms to

    organization policy.

    # grep ^minclass /etc/security/pwquality.conf

    OR

    # grep -E "^\s*\Scredit\s*=" /etc/security/pwquality.conf'
  remediation: "Edit the file /etc/security/pwquality.conf and add or modify the following line for\npassword length to conform\
    \ to site policy\nminlen = 14\nEdit the file /etc/security/pwquality.conf and add or modify the following line for\npassword\
    \ complexity to conform to site policy\nminclass = 4\nOR\ndcredit = -1\nucredit = -1\nocredit = -1\nlcredit = -1\nRun\
    \ the following script to update the system-auth and password-auth files\n{\n #!/usr/bin/env bash\n for fn in system-auth\
    \ password-auth; do\n file=\"/etc/authselect/$(head -1 /etc/authselect/authselect.conf | grep\n'custom/')/$fn\"\n if !\
    \ grep -Pq --\n'^\\h*password\\h+requisite\\h+pam_pwquality.so(\\h+[^#\\n\\r]+)?\\h+.*enforce_for_r\noot\\b.*$' \"$file\"\
    ; then\n sed -ri 's/^\\s*(password\\s+requisite\\s+pam_pwquality.so\\s+)(.*)$/\\1\\2\nenforce_for_root/' \"$file\"\n fi\n\
    \ if grep -Pq --\n'^\\h*password\\h+requisite\\h+pam_pwquality.so(\\h+[^#\\n\\r]+)?\\h+retry=([49]|[1-9][0-9]+)\\b.*$'\
    \ \"$file\"; then\n sed -ri '/pwquality/s/retry=\\S+/retry=3/' \"$file\"\n elif ! grep -Pq --\n'^\\h*password\\h+requisite\\\
    h+pam_pwquality.so(\\h+[^#\\n\\r]+)?\\h+retry=\\d+\\b.*$'\n\"$file\"; then\n sed -ri 's/^\\s*(password\\s+requisite\\\
    s+pam_pwquality.so\\s+)(.*)$/\\1\\2\nretry=3/' \"$file\"\n fi\n done\n authselect apply-changes\n}"
  checks:
  - type: manual_review
    info: 'Verify password creation requirements conform to organization policy:

      Run the following command and verify that retry conforms to organization policy.

      # grep pam_pwquality.so /etc/pam.d/system-auth /etc/pam.d/password-auth

