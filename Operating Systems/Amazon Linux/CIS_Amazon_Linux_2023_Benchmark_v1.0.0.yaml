  rationale: 'The SHA-512 algorithm provides stronger hashing than other hashing algorithms used for password hashing with
    Linux, providing additional protection to the system by increasing the level of effort for an attacker to successfully
    determine passwords. Note: These changes only apply to accounts configured on the local system.'
