- id: 6.2.6
  title: Ensure no duplicate user names exist
  scoring: scored
  profile:
  - Level 1 - Server
  description: Although the useradd program will not let you create a duplicate user name, it is possible for an administrator
    to manually edit the /etc/passwd file and change the username.
  rationale: If a user is assigned a duplicate user name, it will create and have access to files with the first UID for that
    username in /etc/passwd . For example, if "test4" has a UID of 1000 and a subsequent "test4" entry has a UID of 2000,
    logging in as "test4" will use UID 1000. Effectively, the UID is shared, which is a security problem.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 697
  audit_raw: "Run the following script and verify no results are returned:\n#!/bin/bash\ncut -d: -f1 /etc/passwd | sort |\
    \ uniq -d | while read -r x; do\n echo \"Duplicate login name $x in /etc/passwd\"\ndone"
  remediation: 'Based on the results of the audit script, establish unique user names for the users. File

    ownerships will automatically reflect the change as long as the users have unique UIDs.'
  checks:
  - type: manual_review
    info: "Run the following script and verify no results are returned:\n#!/bin/bash\ncut -d: -f1 /etc/passwd | sort | uniq\
      \ -d | while read -r x; do\n echo \"Duplicate login name $x in /etc/passwd\"\ndone"
    severity: medium
