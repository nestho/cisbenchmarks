- id: 1.5.4
  title: Ensure core dump backtraces are disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file.
  rationale: A core dump includes a memory image taken at the time the operating system terminates an application. The memory
    image could contain sensitive data and is generally useful only for developers trying to debug problems, increasing the
    risk to the system.
  impact: 'on a system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to
    implement correctly preventing legitimate access from occurring. 1.6.1 Configure SELinux SELinux implements Mandatory
    Access Control (MAC). Every process and system resource has a special security label called an SELinux context. A SELinux
    context, sometimes referred to as an SELinux label, is an identifier which abstracts away the system-level details and
    focuses on the security properties of the entity. Not only does this provide a consistent way of referencing objects in
    the SELinux policy, but it also removes any ambiguity that can be found in other identification methods. For example,
    a file can have multiple valid path names on a system that makes use of bind mounts. The SELinux policy uses these contexts
    in a series of rules which define how processes can interact with each other and the various system resources. By default,
    the policy does not allow any interaction unless a rule explicitly grants access. In Fedora 34 Family Linux distributions,
    system services are controlled by the systemd daemon; systemd starts and stops all services, and users and processes communicate
    with systemd using the systemctl utility. The systemd daemon can consult the SELinux policy and check the label of the
    calling process and the label of the unit file that the caller tries to manage, and then ask SELinux whether or not the
    caller is allowed the access. This approach strengthens access control to critical system capabilities, which include
    starting and stopping system services. This automatically limits the damage that the software can do to files accessible
    by the calling user. The user does not need to take any action to gain this benefit. For an action to occur, both the
    traditional DAC permissions must be satisfied as well as the SELinux MAC rules. The action will not be allowed if either
    one of these models does not permit the action. In this way, SELinux rules can only make a system''s permissions more
    restrictive and secure. SELinux requires a complex policy to allow all the actions required of a system under normal operation.
    Two such policies have been designed for use with Fedora 34 Family Linux distributions and are included with the system:
    targeted and mls. These are described as follows: • targeted: targeted processes run in their own domain, called a confined
    domain. In a confined domain, the files that a targeted process has access to are limited. If a confined process is compromised
    by an attacker, the attacker’s access to resources and the possible damage they can do is also limited. SELinux denies
    access to these resources and logs the denial. • mls: implements Multi-Level Security (MLS), which introduces even more
    kinds of labels (sensitivity and category) and rules that govern access based on these. This section provides guidance
    for the configuration of the targeted policy. Notes: • Remember that SELinux policy rules are checked after DAC rules.
    SELinux policy rules are not used if DAC rules deny access first, which means that no SELinux denial is logged if the
    traditional DAC rules prevent the access. • This section only applies if SELinux is in use on the system. Additional Mandatory
    Access Control systems exist. • To avoid incorrect SELinux labeling and subsequent problems, ensure that you start services
    using a systemctl start command.'
  references:
  - 1. https://www.freedesktop.org/software/systemd/man/coredump.conf.html
  - '2. NIST SP 800-53 Rev. 5: CM-6'
