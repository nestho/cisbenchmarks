- id: 5.2.1.3
  title: Ensure audit_backlog_limit is sufficient
  scoring: scored
  profile:
  - Level 2 - Server
  description: The backlog limit has a default setting of 64
  rationale: During boot if audit=1, then the backlog will hold 64 records. If more that 64 records are created during boot,
    auditd records will be lost and potential malicious activity could go undetected.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12'
  page_start: 539
  audit_raw: 'Run the following command and verify the audit_backlog_limit= parameter is set to an

    appropriate size for your organization

    # grubby --info=ALL | grep -Po "\baudit_backlog_limit=\d+\b"

    audit_backlog_limit=<BACKLOG SIZE>

    Validate that the line(s) returned contain a value for audit_backlog_limit= that is

