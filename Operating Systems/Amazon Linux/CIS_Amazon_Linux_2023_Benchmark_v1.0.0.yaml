  title: Ensure separate partition exists for /var/log/audit
  scoring: scored
  profile:
  - Level 2 - Server
  description: The auditing daemon, auditd, stores log data in the /var/log/audit directory.
  rationale: The reasoning for mounting /var/log/audit on a separate partition is as follows. Protection from resource exhaustion
    The default installation only creates a single / partition. Since the /var/log/audit directory contains the audit.log
    file which can grow quite large, there is a risk of resource exhaustion. It will essentially have the whole disk available
    to fill up and impact the system as a whole. In addition, other operations on the system could fill up the disk unrelated
    to /var/log/audit and cause auditd to trigger it's space_left_action as the disk is full. See man auditd.conf for details.
