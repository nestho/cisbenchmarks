- id: 3.2.1
  title: Ensure IP forwarding is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: The net.ipv4.ip_forward and net.ipv6.conf.all.forwarding flags are used to tell the system whether it can forward
    packets or not.
  rationale: Setting net.ipv4.ip_forward and net.ipv6.conf.all.forwarding to 0 ensures that a system with multiple interfaces
    (for example, a hard proxy), will never be able to forward packets, and therefore, never serve as a router.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 277
  audit_raw: "Run the following script to verify the following kernel parameters are set in the running\nconfiguration and\
    \ correctly loaded from a kernel parameter configuration file:\n• net.ipv4.ip_forward is set to 0\n• net.ipv6.conf.all.forwarding\
    \ is set to 0\nNote:\n• kernel parameters are loaded by file and parameter order precedence. The\nfollowing script observes\
    \ this precedence as part of the auditing procedure. The\nparameters being checked may be set correctly in a file. If\
    \ that file is superseded,\nthe parameter is overridden by an incorrect setting later in that file, or in a\nconically\
    \ later file, that \"correct\" setting will be ignored both by the script and by\nthe system during a normal kernel parameter\
    \ load sequence.\n• IPv6 kernel parameters only apply to systems where IPv6 is enabled\n#!/usr/bin/env bash\n{\n l_output=\"\
    \" l_output2=\"\"\n a_parlist=(\"net.ipv4.ip_forward=0\" \"net.ipv6.conf.all.forwarding=0\")\n l_ufwscf=\"$([ -f /etc/default/ufw\
