- id: 5.2.3.19
  title: Ensure kernel module loading unloading and modification is collected
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'Monitor the loading and unloading of kernel modules. All the loading / listing / dependency checking of modules
    is done by kmod via symbolic links. The following system calls control loading and unloading of modules: • init_module
    - load a module • finit_module - load a module (used when the overhead of using cryptographically signed modules to determine
    the authenticity of a module can be avoided) • delete_module - delete a module • create_module - create a loadable module
    entry • query_module - query the kernel for various bits pertaining to modules Any execution of the loading and unloading
    module programs and system calls will trigger an audit record with an identifier of modules.'
  rationale: Monitoring the use of all the various ways to manipulate kernel modules could provide system administrators with
    evidence that an unauthorized change was made to a kernel module, possibly compromising the security of the system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3, CM-6'
  page_start: 623
  audit_raw: "64 Bit systems\nOn disk configuration\nRun the following commands to check the on disk rules:\n# {\nawk '/^\
    \ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&(/ -F auid!=unset/||/ -F auid!=-1/||/ -F auid!=4294967295/) \\\
    \n &&/ -S/ \\\n &&(/init_module/ \\\n ||/finit_module/ \\\n ||/delete_module/ \\\n ||/create_module/ \\\n ||/query_module/)\
    \ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}'\
    \ /etc/login.defs)\n [ -n \"${UID_MIN}\" ] && awk \"/^ *-a *always,exit/ \\\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/\
    \ -F *auid!=4294967295/) \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&/ -F *perm=x/ \\\n &&/ -F *path=\\/usr\\/bin\\/kmod/ \\\
    \n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\n || printf \"ERROR: Variable 'UID_MIN' is\
    \ unset.\\n\"\n}\nVerify the output matches:\n-a always,exit -F arch=b64 -S\ninit_module,finit_module,delete_module,create_module,query_module\
    \ -F\nauid>=1000 -F auid!=unset -k kernel_modules\n-a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset\
    \ -\nk kernel_modules\nRunning configuration\nRun the following command to check loaded rules:\n# {\n auditctl -l | awk\
    \ '/^ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&(/ -F auid!=unset/||/ -F auid!=-1/||/ -F auid!=4294967295/)\
    \ \\\n &&/ -S/ \\\n &&(/init_module/ \\\n ||/finit_module/ \\\n ||/delete_module/ \\\n ||/create_module/ \\\n ||/query_module/)\
    \ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n [ -n \"\
    ${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
    \ \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&/ -F *perm=x/ \\\n &&/ -F *path=\\/usr\\/bin\\/kmod/ \\\n &&(/ key= *[!-~]* *$/||/\
    \ -k *[!-~]* *$/)\" \\\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\n}\nVerify the output includes:\n-a always,exit\
    \ -F arch=b64 -S\ncreate_module,init_module,delete_module,query_module,finit_module -F\nauid>=1000 -F auid!=-1 -F key=kernel_modules\n\
    -a always,exit -S all -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F\nauid!=-1 -F key=kernel_modules\nSymlink audit\n\
    Audit if the symlinks that kmod accepts is indeed pointing at it:\n# S_LINKS=$(ls -l /usr/sbin/lsmod /usr/sbin/rmmod /usr/sbin/insmod\n\
    /usr/sbin/modinfo /usr/sbin/modprobe /usr/sbin/depmod | grep -v \" ->\n../bin/kmod\" || true) \\\n&& if [[ \"${S_LINKS}\"\
    \ != \"\" ]]; then printf \"Issue with symlinks:\n${S_LINKS}\\n\"; else printf \"OK\\n\"; fi\nVerify the output states\
    \ OK. If there is a symlink pointing to a different location it should\nbe investigated."
  remediation: 'Create audit rules

    Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

    with the relevant rules to monitor kernel module modification.

    64 Bit systems

    Example:

    # {

    UID_MIN=$(awk ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)

    [ -n "${UID_MIN}" ] && printf "

    -a always,exit -F arch=b64 -S

    init_module,finit_module,delete_module,create_module,query_module -F

    auid>=${UID_MIN} -F auid!=unset -k kernel_modules

    -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=${UID_MIN} -F

    auid!=unset -k kernel_modules

    " >> /etc/audit/rules.d/50-kernel_modules.rules || printf "ERROR: Variable

    ''UID_MIN'' is unset.\n"

    }

    Load audit rules

    Merge and load the rules into active configuration:

    # augenrules --load

    Check if reboot is required.

    # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot

    required to load rules\n"; fi'
  checks:
  - type: command
    command: auditctl -l | awk '/^ *-a *always,exit/ \ && /usr/sbin/modinfo /usr/sbin/modprobe /usr/sbin/depmod | grep -v
      " ->
    expected: ''
    severity: medium
    info: "64 Bit systems\nOn disk configuration\nRun the following commands to check the on disk rules:\n# {\nawk '/^ *-a\
      \ *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\n &&(/ -F auid!=unset/||/ -F auid!=-1/||/ -F auid!=4294967295/) \\\n\
      \ &&/ -S/ \\\n &&(/init_module/ \\\n ||/finit_module/ \\\n ||/delete_module/ \\\n ||/create_module/ \\\n ||/query_module/)\
      \ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules"
- id: 5.2.3.20
  title: Ensure the audit configuration is immutable
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'Set system audit so that audit rules cannot be modified with auditctl . Setting the flag "-e 2" forces audit
    to be put in immutable mode. Audit changes can only be made on system reboot. Note: This setting will require the system
    to be rebooted to update the active auditd configuration settings.'
  rationale: In immutable mode, unauthorized users cannot execute changes to the audit system to potentially hide malicious
    activity and then put the audit rules back. Users would most likely notice a system reboot and that could alert administrators
    of an attempt to make unauthorized audit changes.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, AU-3, AU-12, MP-2'
  page_start: 628
  audit_raw: 'Run the following command and verify output matches:

    # grep -Ph -- ''^\h*-e\h+2\b'' /etc/audit/rules.d/*.rules | tail -1

    -e 2'
  remediation: 'Edit or create the file /etc/audit/rules.d/99-finalize.rules and add the line -e 2 at

    the end of the file:

    Example:

    # printf -- "-e 2" >> /etc/audit/rules.d/99-finalize.rules

    Load audit rules

    Merge and load the rules into active configuration:

    # augenrules --load

    Check if reboot is required.

    # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot

    required to load rules\n"; fi'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output matches:

      # grep -Ph -- ''^\h*-e\h+2\b'' /etc/audit/rules.d/*.rules | tail -1

      -e 2'
    severity: medium
- id: 5.2.3.21
  title: Ensure the running and on disk configuration is the same
  scoring: manual
  profile:
  - Level 2 - Server
  description: 'The Audit system have both on disk and running configuration. It is possible for these configuration settings
    to differ. Note: Due to the limitations of augenrules and auditctl, it is not absolutely guaranteed that loading the rule
    sets via augenrules --load will result in all rules being loaded or even that the user will be informed if there was a
    problem loading the rules.'
  rationale: Configuration differences between what is currently running and what is on disk could cause unexpected problems
    or may give a false impression of compliance requirements.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3'
  page_start: 630
  audit_raw: 'Merged rule sets

    Ensure that all rules in /etc/audit/rules.d have been merged into

    /etc/audit/audit.rules:

    # augenrules --check

    /usr/sbin/augenrules: No change

    Should there be any drift, run augenrules --load to merge and load all rules.'
  remediation: 'If the rules are not aligned across all three () areas, run the following command to

    merge and load all rules:

    # augenrules --load

    Check if reboot is required.

    if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then echo "Reboot required

    to load rules"; fi'
  checks:
  - type: manual_review
    info: 'Merged rule sets

      Ensure that all rules in /etc/audit/rules.d have been merged into

      /etc/audit/audit.rules:

      # augenrules --check

      /usr/sbin/augenrules: No change

      Should there be any drift, run augenrules --load to merge and load all rules.'
    severity: medium
- id: 5.2.4.1
  title: Ensure audit log files are mode 0640 or less permissive
  scoring: scored
  profile:
  - Level 2 - Server
  description: Audit log files contain information about the system and system activity.
  rationale: Access to audit records can reveal system and configuration data to attackers, potentially compromising its confidentiality.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3'
  page_start: 633
  audit_raw: 'Run the following command to verify audit log files have mode 0640 or less permissive:

    # [ -f /etc/audit/auditd.conf ] && find "$(dirname $(awk -F "="

    ''/^\s*log_file/ {print $2}'' /etc/audit/auditd.conf | xargs))" -type f \( ! -

    perm 600 -a ! -perm 0400 -a ! -perm 0200 -a ! -perm 0000 -a ! -perm 0640 -a !

    -perm 0440 -a ! -perm 0040 \) -exec stat -Lc "%n %#a" {} +

    Nothing should be returned'
  remediation: 'Run the following command to remove more permissive mode than 0640 from audit log

    files:

    # [ -f /etc/audit/auditd.conf ] && find "$(dirname $(awk -F "="

    ''/^\s*log_file/ {print $2}'' /etc/audit/auditd.conf | xargs))" -type f \( ! -

    perm 600 -a ! -perm 0400 -a ! -perm 0200 -a ! -perm 0000 -a ! -perm 0640 -a !

    -perm 0440 -a ! -perm 0040 \) -exec chmod u-x,g-wx,o-rwx {} +'
  checks:
  - type: manual_review
    info: 'Run the following command to verify audit log files have mode 0640 or less permissive:

      # [ -f /etc/audit/auditd.conf ] && find "$(dirname $(awk -F "="

      ''/^\s*log_file/ {print $2}'' /etc/audit/auditd.conf | xargs))" -type f \( ! -

      perm 600 -a ! -perm 0400 -a ! -perm 0200 -a ! -perm 0000 -a ! -perm 0640 -a !

      -perm 0440 -a ! -perm 0040 \) -exec stat -Lc "%n %#a" {} +

      Nothing should be returned'
    severity: medium
- id: 5.2.4.2
  title: Ensure only authorized users own audit log files
  scoring: scored
  profile:
  - Level 2 - Server
  description: Audit log files contain information about the system and system activity.
  rationale: Access to audit records can reveal system and configuration data to attackers, potentially compromising its confidentiality.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-3'
  page_start: 635
  audit_raw: 'Run the following command to verify audit log files are owned by the root user:

    # [ -f /etc/audit/auditd.conf ] && find "$(dirname $(awk -F "="

    ''/^\s*log_file/ {print $2}'' /etc/audit/auditd.conf | xargs))" -type f ! -user

    root -exec stat -Lc "%n %U" {} +

    Nothing should be returned'
  remediation: 'Run the following command to configure the audit log files to be owned by the root

    user:

    # [ -f /etc/audit/auditd.conf ] && find "$(dirname $(awk -F "="

    ''/^\s*log_file/ {print $2}'' /etc/audit/auditd.conf | xargs))" -type f ! -user

    root -exec chown root {} +'
  checks:
