- id: 4.6.6
  title: Ensure root password is set
  scoring: manual
  profile:
  - Level 1 - Server
  description: There are a number of methods to access the root account directly. Without a password set any user would be
    able to gain access and thus control over the entire system.
  rationale: Access to root should be secured at all times.
  impact: If there are any automated processes that relies on access to the root account without authentication, they will
    fail after remediation.
