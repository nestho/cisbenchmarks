  rationale: 'IF journald is the method for capturing logs, all logs of the system should be handled by journald and not forwarded
    to other logging mechanisms. Note: This recommendation only applies if journald is the chosen method for client side logging.
    Do not apply this recommendation if rsyslog is used.'
