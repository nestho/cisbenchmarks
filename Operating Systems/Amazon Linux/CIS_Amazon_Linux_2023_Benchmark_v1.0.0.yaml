- id: 6.2.11
  title: Ensure local interactive user dot files access is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: While the system administrator can establish secure permissions for users' "dot" files, the users can easily
    override these. • .forward file specifies an email address to forward the user's mail to. • .rhost file provides the "remote
    authentication" database for the rcp, rlogin, and rsh commands and the rcmd() function. These files bypass the standard
    password-based user authentication mechanism. They specify remote hosts and users that are considered trusted (i.e. are
    allowed to access the local system without supplying a password) • .netrc file contains data for logging into a remote
    host or passing authentication to an API. • .bash_history file keeps track of the user’s last 500 commands.
  rationale: User configuration files with excessive or incorrect access may enable malicious users to steal or modify other
    users' data or to gain another user's system privileges.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 707
  audit_raw: "Run the following script to verify local interactive user dot files:\n• Don't include .forward, .rhost, or .netrc\
    \ files\n• Are mode 0644 or more restrictive\n• Are owned by the local interactive user\n• Are group owned by the user's\
    \ primary group\n•\n.bash_history is mode 0600 or more restrictive\nNote: If a .netrc file is required, and follows local\
    \ site policy, it should have permissions\nof 600 or more restrictive.\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\
    \" l_output3=\"\" l_output4=\"\"\n l_bf=\"\" l_df=\"\" l_nf=\"\" l_hf=\"\"\n l_valid_shells=\"^($( awk -F\\/ '$NF != \"\
    nologin\" {print}' /etc/shells | sed\n-rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n unset a_uarr && a_uarr=()\
    \ # Clear and initialize array\n while read -r l_epu l_eph; do # Populate array with users and user home\nlocation\n [[\
    \ -n \"$l_epu\" && -n \"$l_eph\" ]] && a_uarr+=(\"$l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF)\
    \ ~ pat { print $1 \" \"\n$(NF-1) }' /etc/passwd)\"\n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of\
    \ users\nbefore proceeding\n l_maxsize=\"1000\" # Maximun number of local interactive users before\nwarning (Default 1,000)\n\
    \ [ \"$l_asize \" -gt \"$l_maxsize\" ] && echo -e \"\\n ** INFO **\\n -\n\\\"$l_asize\\\" Local interactive users found\
    \ on the system\\n - This may be a\nlong running check\\n\"\n file_access_chk()\n {\n l_facout2=\"\"\n l_max=\"$( printf\
    \ '%o' $(( 0777 & ~$l_mask)) )\"\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n l_facout2=\"$l_facout2\\n - File: \\\"\
    $l_hdfile\\\" is mode: \\\"$l_mode\\\"\nand should be mode: \\\"$l_max\\\" or more restrictive\"\n fi\n if [[ ! \"$l_owner\"\
    \ =~ ($l_user) ]]; then\n l_facout2=\"$l_facout2\\n - File: \\\"$l_hdfile\\\" owned by:\n\\\"$l_owner\\\" and should be\
    \ owned by \\\"${l_user//|/ or }\\\"\"\n fi\n if [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\n l_facout2=\"$l_facout2\\\
    n - File: \\\"$l_hdfile\\\" group owned by:\n\\\"$l_gowner\\\" and should be group owned by \\\"${l_group//|/ or }\\\"\
    \"\n fi\n }\n while read -r l_user l_home; do\n l_fe=\"\" l_nout2=\"\" l_nout3=\"\" l_dfout2=\"\" l_hdout2=\"\" l_bhout2=\"\
    \"\n if [ -d \"$l_home\" ]; then\n l_group=\"$(id -gn \"$l_user\" | xargs)\"\n l_group=\"${l_group// /|}\"\n while IFS=\
    \ read -r -d $'\\0' l_hdfile; do\n while read -r l_mode l_owner l_gowner; do\n case \"$(basename \"$l_hdfile\")\" in\n\
    \ .forward | .rhost )\n l_fe=\"Y\" && l_bf=\"Y\"\n l_dfout2=\"$l_dfout2\\n - File: \\\"$l_hdfile\\\" exists\" ;;\n .netrc\
    \ )\n l_mask='0177'\n file_access_chk\n if [ -n \"$l_facout2\" ]; then\n l_fe=\"Y\" && l_nf=\"Y\"\n l_nout2=\"$l_facout2\"\
    \n else\n l_nout3=\" - File: \\\"$l_hdfile\\\" exists\"\n fi ;;\n .bash_history )\n l_mask='0177'\n file_access_chk\n\
    \ if [ -n \"$l_facout2\" ]; then\n l_fe=\"Y\" && l_hf=\"Y\"\n l_bhout2=\"$l_facout2\"\n fi ;;\n * )\n l_mask='0133'\n\
    \ file_access_chk\n if [ -n \"$l_facout2\" ]; then\n l_fe=\"Y\" && l_df=\"Y\"\n l_hdout2=\"$l_facout2\"\n fi ;;\n esac\n\
    \ done <<< \"$(stat -Lc '%#a %U %G' \"$l_hdfile\")\"\n done < <(find \"$l_home\" -xdev -type f -name '.*' -print0)\n fi\n\
    \ if [ \"$l_fe\" = \"Y\" ]; then\n l_output2=\"$l_output2\\n - User: \\\"$l_user\\\" Home Directory:\n\\\"$l_home\\\"\"\
    \n [ -n \"$l_dfout2\" ] && l_output2=\"$l_output2$l_dfout2\"\n [ -n \"$l_nout2\" ] && l_output2=\"$l_output2$l_nout2\"\
    \n [ -n \"$l_bhout2\" ] && l_output2=\"$l_output2$l_bhout2\"\n [ -n \"$l_hdout2\" ] && l_output2=\"$l_output2$l_hdout2\"\
    \n fi\n [ -n \"$l_nout3\" ] && l_output3=\"$l_output3\\n - User: \\\"$l_user\\\" Home\nDirectory: \\\"$l_home\\\"\\n$l_nout3\"\
    \n done <<< \"$(printf '%s\\n' \"${a_uarr[@]}\")\"\n unset a_uarr # Remove array\n [ -n \"$l_output3\" ] && l_output3=\"\
    \ - ** Warning **\\n - \\\".netrc\\\" files\nshould be removed unless deemed necessary\\n and in accordance with local\n\
    site policy:$l_output3\"\n [ -z \"$l_bf\" ] && l_output=\"$l_output\\n - \\\".forward\\\" or \\\".rhost\\\"\nfiles\"\n\
    \ [ -z \"$l_nf\" ] && l_output=\"$l_output\\n - \\\".netrc\\\" files with\nincorrect access configured\"\n [ -z \"$l_hf\"\
    \ ] && l_output=\"$l_output\\n - \\\".bash_history\\\" files with\nincorrect access configured\"\n [ -z \"$l_df\" ] &&\
    \ l_output=\"$l_output\\n - \\\"dot\\\" files with incorrect\naccess configured\"\n [ -n \"$l_output\" ] && l_output=\"\
    \ - No local interactive users home\ndirectories contain:$l_output\"\n echo -e \"$l_output4\"\n if [ -z \"$l_output2\"\
    \ ]; then # If l_output2 is empty, we pass\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n - * Correctly configured *\n\
    :\\n$l_output\\n\"\n echo -e \"$l_output3\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for\
    \ audit\nfailure * :\\n$l_output2\\n\"\n echo -e \"$l_output3\\n\"\n [ -n \"$l_output\" ] && echo -e \"- * Correctly configured\
    \ *\n:\\n$l_output\\n\"\n fi\n}"
  remediation: "Making global modifications to users' files without alerting the user community can result\nin unexpected\
    \ outages and unhappy users. Therefore, it is recommended that a\nmonitoring policy be established to report user dot\
    \ file permissions and determine the\naction to be taken in accordance with site policy.\nThe following script will:\n\
    • remove excessive permissions on dot files within interactive users' home\ndirectories\n• change ownership of dot files\
    \ within interactive users' home directories to the\nuser\n• change group ownership of dot files within interactive users'\
    \ home directories to\nthe user's primary group\n• list .forward and .rhost files to be investigated and manually deleted\n\
    #!/usr/bin/env bash\n{\n l_valid_shells=\"^($( awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed\n-rn '/^\\//{s,/,\\\
    \\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n unset a_uarr && a_uarr=() # Clear and initialize array\n while read -r l_epu\
    \ l_eph; do # Populate array with users and user home\nlocation\n [[ -n \"$l_epu\" && -n \"$l_eph\" ]] && a_uarr+=(\"\
    $l_epu $l_eph\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print $1 \" \"\n$(NF-1) }' /etc/passwd)\"\
    \n l_asize=\"${#a_uarr[@]}\" # Here if we want to look at number of users\nbefore proceeding\n l_maxsize=\"1000\" # Maximum\
    \ number of local interactive users before\nwarning (Default 1,000)\n [ \"$l_asize \" -gt \"$l_maxsize\" ] && echo -e\
    \ \"\\n ** INFO **\\n -\n\\\"$l_asize\\\" Local interactive users found on the system\\n - This may be a\nlong running\
    \ check\\n\"\n file_access_fix()\n {\n l_facout2=\"\"\n l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n if [ $(( $l_mode\
    \ & $l_mask )) -gt 0 ]; then\n echo -e \" - File: \\\"$l_hdfile\\\" is mode: \\\"$l_mode\\\" and should be\nmode: \\\"\
    $l_max\\\" or more restrictive\\n - Changing to mode \\\"$l_max\\\"\"\n chmod \"$l_chp\" \"$l_hdfile\"\n fi\n if [[ !\
    \ \"$l_owner\" =~ ($l_user) ]]; then\n echo -e \" - File: \\\"$l_hdfile\\\" owned by: \\\"$l_owner\\\" and should\nbe\
    \ owned by \\\"${l_user//|/ or }\\\"\\n - Changing ownership to \\\"$l_user\\\"\"\n chown \"$l_user\" \"$l_hdfile\"\n\
    \ fi\n if [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\n echo -e \" - File: \\\"$l_hdfile\\\" group owned by: \\\"$l_gowner\\\
    \" and\nshould be group owned by \\\"${l_group//|/ or }\\\"\\n - Changing group\nownership to \\\"$l_group\\\"\"\n chgrp\
    \ \"$l_group\" \"$l_hdfile\"\n fi\n }\n while read -r l_user l_home; do\n if [ -d \"$l_home\" ]; then\n echo -e \"\\n\
    \ - Checking user: \\\"$l_user\\\" home directory:\n\\\"$l_home\\\"\"\n l_group=\"$(id -gn \"$l_user\" | xargs)\"\n l_group=\"\
    ${l_group// /|}\"\n while IFS= read -r -d $'\\0' l_hdfile; do\n while read -r l_mode l_owner l_gowner; do\n case \"$(basename\
    \ \"$l_hdfile\")\" in\n .forward | .rhost )\n echo -e \" - File: \\\"$l_hdfile\\\" exists\\n - Please\ninvestigate and\
    \ manually delete \\\"$l_hdfile\\\"\"\n ;;\n .netrc )\n l_mask='0177'\n l_chp=\"u-x,go-rwx\"\n file_access_fix ;;\n .bash_history\
    \ )\n l_mask='0177'\n l_chp=\"u-x,go-rwx\"\n file_access_fix ;;\n * )\n l_mask='0133'\n l_chp=\"u-x,go-wx\"\n file_access_fix\
    \ ;;\n esac\n done <<< \"$(stat -Lc '%#a %U %G' \"$l_hdfile\")\"\n done < <(find \"$l_home\" -xdev -type f -name '.*'\
    \ -print0)\n fi\n done <<< \"$(printf '%s\\n' \"${a_uarr[@]}\")\"\n unset a_uarr # Remove array\n}"
