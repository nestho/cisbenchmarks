  rationale: Restricting USB access on the system will decrease the physical attack surface for a device and diminish the
    possible vectors to introduce malware.
  impact: Disabling the usb-storage module will disable any usage of USB storage devices. If requirements and local site policy
    allow the use of such devices, other solutions should be configured accordingly instead. One example of a commonly used
    solution is USBGuard.
