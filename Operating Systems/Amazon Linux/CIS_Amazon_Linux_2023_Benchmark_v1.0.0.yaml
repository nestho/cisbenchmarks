- id: 5.1.1.3
  title: Ensure journald is configured to send logs to rsyslog
  scoring: manual
  profile:
  - Level 1 - Server
  description: Data from journald may be stored in volatile memory or persisted locally on the server. Utilities exist to
    accept remote export of journald logs, however, use of the RSyslog service provides a consistent means of log collection
    and export.
  rationale: 'IF RSyslog is the preferred method for capturing logs, all logs of the system should be sent to it for further
    processing. Note: This recommendation only applies if rsyslog is the chosen method for client side logging. Do not apply
    this recommendation if journald is used.'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-4, AU-12, MP-2, SI-5'
  page_start: 491
  audit_raw: 'IF RSyslog is the preferred method for capturing logs

    Review /etc/systemd/journald.conf and verify that logs are forwarded to rsyslog.

    # grep ^\s*ForwardToSyslog /etc/systemd/journald.conf

    Verify the output matches:

    ForwardToSyslog=yes'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    ForwardToSyslog=yes

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'IF RSyslog is the preferred method for capturing logs

      Review /etc/systemd/journald.conf and verify that logs are forwarded to rsyslog.

      # grep ^\s*ForwardToSyslog /etc/systemd/journald.conf

      Verify the output matches:

      ForwardToSyslog=yes'
    severity: medium
- id: 5.1.1.4
  title: Ensure rsyslog default file permissions are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: RSyslog will create logfiles that do not already exist on the system. This setting controls what permissions
    will be applied to these newly created files.
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: The systems global umask could override, but only making the file permissions stricter, what is configured in RSyslog
    with the FileCreateMode directive. RSyslog also has its own $umask directive that can alter the intended file creation
    mode. In addition, consideration should be given to how FileCreateMode is used. Thus it is critical to ensure that the
    intended file creation mode is not overridden with less restrictive settings in /etc/rsyslog.conf, /etc/rsyslog.d/*conf
    files and that FileCreateMode is set before any file is created.
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  - '2. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2'
  page_start: 494
  audit_raw: 'Run the following command:

    # grep -Ps ''^\h*\$FileCreateMode\h+0[0,2,4,6][0,2,4]0\b'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    Verify the output is includes 0640 or more restrictive:

    $FileCreateMode 0640'
  remediation: 'Edit either /etc/rsyslog.conf or a dedicated .conf file in /etc/rsyslog.d/ and set

    $FileCreateMode to 0640 or more restrictive:

    $FileCreateMode 0640

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep -Ps ''^\h*\$FileCreateMode\h+0[0,2,4,6][0,2,4]0\b'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      Verify the output is includes 0640 or more restrictive:

      $FileCreateMode 0640'
    severity: medium
- id: 5.1.1.5
  title: Ensure logging is configured
  scoring: manual
  profile:
  - Level 1 - Server
  description: The /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files specifies rules for logging and which files are to be
    used to log certain classes of messages.
  rationale: A great deal of important security-related information is sent via rsyslog (e.g., successful and failed su attempts,
    failed login attempts, root login attempts, etc.).
  impact: ''
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  - '2. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12'
  page_start: 497
  audit_raw: 'Review the contents of /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files to ensure

    appropriate logging is set. In addition, run the following command and verify that the log

    files are logging information as expected:

    # ls -l /var/log/'
  remediation: 'Edit the following lines in the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files as

    appropriate for your environment.

    NOTE: The below configuration is shown for example purposes only. Due care should

    be given to how the organization wish to store log data.

    *.emerg :omusrmsg:*

    auth,authpriv.* /var/log/secure

    mail.* -/var/log/mail

    mail.info -/var/log/mail.info

    mail.warning -/var/log/mail.warn

    mail.err /var/log/mail.err

    cron.* /var/log/cron

    *.=warning;*.=err -/var/log/warn

    *.crit /var/log/warn

    *.*;mail.none;news.none -/var/log/messages

    local0,local1.* -/var/log/localmessages

    local2,local3.* -/var/log/localmessages

    local4,local5.* -/var/log/localmessages

    local6,local7.* -/var/log/localmessages

    Run the following command to reload the rsyslogd configuration:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Review the contents of /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files to ensure

      appropriate logging is set. In addition, run the following command and verify that the log

      files are logging information as expected:

      # ls -l /var/log/'
    severity: medium
- id: 5.1.1.6
  title: Ensure rsyslog is configured to send logs to a remote log host
  scoring: manual
  profile:
  - Level 1 - Server
  description: RSyslog supports the ability to send log events it gathers to a remote log host or to receive messages from
    remote hosts, thus enabling centralized log management.
  rationale: Storing log data on a remote host protects log integrity from local attacks. If an attacker gains root access
    on the local system, they could tamper with or remove log data that is stored on the local system.
  impact: ''
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  - '2. NIST SP 800-53 Rev. 5: AU-6'
  page_start: 499
  audit_raw: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that logs are

    sent to a central host (where loghost.example.com is the name of your central log host):

    Old format

    # grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    Output should include @@<FQDN or IP of remote loghost>, for example

    *.* @@loghost.example.com

    New format

    # grep -E ''^\s*([^#]+\s+)?action\(([^#]+\s+)?\btarget=\"?[^#"]+\"?\b''

    /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    Output should include target=<FQDN or IP of remote loghost>, for example:

    *.* action(type="omfwd" target="loghost.example.com" port="514"

    protocol="tcp"'
  remediation: "Edit the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and add the following line\n(where loghost.example.com\
    \ is the name of your central log host). The target directive\nmay either be a fully qualified domain name or an IP address.\n\
    *.* action(type=\"omfwd\" target=\"192.168.2.100\" port=\"514\" protocol=\"tcp\"\n action.resumeRetryCount=\"100\"\n queue.type=\"\
    LinkedList\" queue.size=\"1000\")\nRun the following command to reload the rsyslogd configuration:\n# systemctl restart\
    \ rsyslog"
  checks:
  - type: manual_review
    info: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that logs are

      sent to a central host (where loghost.example.com is the name of your central log host):

      Old format

      # grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      Output should include @@<FQDN or IP of remote loghost>, for example

      *.* @@loghost.example.com

      New format

      # grep -E ''^\s*([^#]+\s+)?action\(([^#]+\s+)?\btarget=\"?[^#"]+\"?\b''

      /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      Output should include target=<FQDN '
    severity: medium
- id: 5.1.1.7
  title: Ensure rsyslog is not configured to receive logs from a remote client
  scoring: scored
  profile:
  - Level 1 - Server
  description: RSyslog supports the ability to receive messages from remote hosts, thus acting as a log server. Clients should
    not receive data from other hosts.
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    its operational boundary.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6'
  page_start: 501
  audit_raw: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

    system is not configured to accept incoming logs.

    New format

    # grep -Ps -- ''^\h*module\(load="imtcp"\)'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    # grep -Ps -- ''^\h*input\(type="imtcp" port="514"\)'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    No output expected.

    -OROld format

    # grep -s ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    # grep -s ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    No output expected.'
  remediation: 'Should there be any active log server configuration found in the auditing section, modify

    those files and remove the specific lines highlighted by the audit. Ensure none of the

    following entries are present in any of /etc/rsyslog.conf or /etc/rsyslog.d/*.conf.

    New format

    module(load="imtcp")

    input(type="imtcp" port="514")

    -OROld format

    $ModLoad imtcp

    $InputTCPServerRun

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

      system is not configured to accept incoming logs.

      New format

      # grep -Ps -- ''^\h*module\(load="imtcp"\)'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      # grep -Ps -- ''^\h*input\(type="imtcp" port="514"\)'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      No output expected.

      -OROld format

      # grep -s ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      # grep -s ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      No output '
