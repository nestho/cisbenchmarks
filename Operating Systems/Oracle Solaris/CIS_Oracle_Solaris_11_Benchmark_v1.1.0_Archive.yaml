controls:
- id: '1.1'
  title: Use the Latest Package Updates
  scoring: scored
  profile:
  - Level 1
  description: The Solaris 11 OS should be periodically updated to install or upgrade software packages that will enhance
    the security, reliability, and performance of the system.
  rationale: For the Solaris 11 OS, there will be no more software patches issued, but rather security and other improvements
    will be installed by updating one or more software packages.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'To verify that the system is operating with the latest software updates, perform the

    following and verify that the result is as shown:

    # pkg update -n

    No updates available for this image.

    In addition, you can manually verify the update associated with the running system using

    the following command. The output of this command will indicate the operation system

    version and update number as well as the Software Repository Update (SRU) number.

    # pkg info entire | grep FMRI: | awk ''{ print $2 }''

    pkg://solaris/entire@0.5.11,5.11-0.175.0.5.0.5.0:20120320T213737Z

    From this string, it is possible to determine:

     the Oracle Solaris release: 5.11 (0.5.11,5.11-0.175.0.5.0.5.0:20120320T213737Z)

     the Oracle Solaris Update: 0 (0.5.11,5.11-0.175.0.5.0.5.0:20120320T213737Z)

     the Oracle Solaris SRU: 5 (0.5.11,5.11-0.175.0.5.0.5.0:20120320T213737Z)

    13 | P a g e

    For more information, see the Oracle white paper titled "Packaging and Delivering

    Software with the Image Packaging System" available from:

    http://hub.opensolaris.org/bin/download/Project+pkg/files/ipsdevguide.pdf.'
  remediation: 'Run the following command to refresh the package catalog, download and apply any

    available updates:

    # pkg update

    2 Disable Unnecessary Services

    While using the most up to date software packages will help to correct any known

    vulnerabilities, one of the best ways to protect the system against as yet unreported

    vulnerabilities is to disable services that are not required for that particular system''s

    intended operation or management. This helps to prevent the exploitation of

    vulnerabilities that may be discovered at a later date. The actions in this section of the

    document provide guidance on what services can be safely disabled and under which

    circumstances.

    The Solaris 11 OS has implemented a "Secure by Default" (SBD) posture whereby many

    services that were once automatically enabled are now either disabled or configured to

    listen only for connections originating from the system itself. This default software

    configuration greatly simplifies many of the security hardening steps typically undertaken

    in previous versions of the operating system. As a result, this section will build upon this

    default configuration and focus specifically on those services that are enabled (local-only or

    otherwise) that organizations may want to disable.

    As noted above, several services are not disabled, but rather are placed into a "local only" mode

    where they will accept connections originating only from the local system itself. This was done

    to strike a balance between security and out-of-the-box usability. If these services are not

    required, it is recommended that they be disabled to guard against potential future vulnerabilities

    that can be exploited by users and/or services that are operating locally on the system.'
  checks:
  - type: command
    command: '# pkg info entire | grep FMRI: | awk ''{ print $2 }'''
    expected: To verify that the system is operating with the latest software updates, perform the
    severity: medium
    info: 'To verify that the system is operating with the latest software updates, perform the

      following and verify that the result is as shown:

      # pkg update -n

      No updates available for this image.

      In addition, you can manually verify the update associated with the running system using

      the following command. The output of this command will indicate the operation system

      version and update number as well as t'
- id: '2.1'
  title: Disable Local-only Graphical Login Environment
  scoring: scored
  profile:
  - Level 1
  description: 14 | P a g e The graphical login service provides the capability of logging into the system using an Xwindows
    type interface from the console. If graphical login access for the console is required, leave the service in local-only
    mode.
  rationale: This service should be disabled if it is not required.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Perform the following and verify that the result is as shown:

    # svcs -Ho state svc:/application/graphical-login/gdm:default

    disabled

    If gdm is not installed, this will return an error, or no output. This is also considered a

    passing state.'
  remediation: 'To disable this service, run the following command:

    # svcadm disable svc:/application/graphical-login/gdm:default'
  checks:
  - type: manual_review
    info: 'Perform the following and verify that the result is as shown:

      # svcs -Ho state svc:/application/graphical-login/gdm:default

      disabled

      If gdm is not installed, this will return an error, or no output. This is also considered a

      passing state.'
    severity: medium
- id: '2.2'
  title: Configure sendmail Service for Local-Only Mode
  scoring: scored
  profile:
  - Level 1
  description: In Solaris 11, the sendmail service is set to local only mode by default. This means that users on remote systems
    cannot connect to the sendmail service, eliminating the possibility of a remote exploit attack against some future sendmail
    vulnerability. Leaving sendmail in local-only mode permits mail to be sent out from the local system. If the local system
    will not be processing or sending any mail, this service can be disabled. However, if sendmail is disabled completely,
    email messages sent to the root account (such as cron job output or audit service warnings) will fail to be delivered.
    An alternative approach is to disable the sendmail service and create a cron job to process all mail that is queued on
    the local system, sending it to a relay host defined in the sendmail.cf file. It is recommended that sendmail be left
    in local-only mode unless there is a specific requirement to completely disable it. 15 | P a g e
  rationale: The software for all Mail Transfer Agents is complex and most have a long history of security issues. While it
    is important to ensure that the system can process local mail messages, it is not necessary to have the MTA's daemon listening
    on a port unless the server is intended to be a mail server that receives and processes mail from other systems.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Perform the following command and make sure that the MTA is listening on the loopback

    address (127.0.0.1):

    # netstat -an | grep LIST | grep ":25[[:space:]]"

    tcp 0 0 127.0.0.1:25 0.0.0.0:* LISTEN'
  remediation: 'Run the following to set sendmail to listen only local interfaces:

    # svccfg -v -s svc:/network/smtp:sendmail setprop config/local_only=false

    # svcadm refresh sendmail

    # svcadm restart sendmail'
  checks:
  - type: command
    command: '# netstat -an | grep LIST | grep ":25[[:space:]]"'
    expected: ''
    severity: medium
    info: 'Perform the following command and make sure that the MTA is listening on the loopback

      address (127.0.0.1):

      # netstat -an | grep LIST | grep ":25[[:space:]]"

      tcp 0 0 127.0.0.1:25 0.0.0.0:* LISTEN'
- id: '2.3'
  title: Disable RPC Encryption Key
  scoring: scored
  profile:
  - Level 1
  description: The keyserv service is only required for sites that are using the Secure RPC mechanism. The most common use
    for Secure RPC on Solaris machines is "secure NFS", which uses the Secure RPC mechanism to provide higher levels of security
    than the standard NFS protocols. ("Secure NFS" is unrelated to Kerberos authentication as a mechanism for providing higher
    levels of NFS security. "Kerberized" NFS does not require the keyserv service to be running.)
  rationale: This service should be disabled if it is not required.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Perform the following and verify that the result is as shown:

    16 | P a g e

    # svcs -Ho state svc:/network/rpc/keyserv

    disabled'
  remediation: 'To disable this service, run the following command:

    # svcadm disable svc:/network/rpc/keyserv'
  checks:
  - type: manual_review
    info: 'Perform the following and verify that the result is as shown:

      16 | P a g e

      # svcs -Ho state svc:/network/rpc/keyserv

      disabled'
    severity: medium
- id: '2.4'
  title: Disable NIS Server Services
  scoring: scored
  profile:
  - Level 1
  description: The NIS server software is not installed by default and is only required on systems that are acting as an NIS
    server for the local site. Typically there are only a small number of NIS servers on any given network. These services
    are disabled by default unless the system has been previously configured to act as a NIS server.
  rationale: As RPC-based services such as NIS may use non-secure authentication and share sensitive network object information
    with systems and applications using RPC-based services, this service should be disabled. Users are encouraged to use LDAP
    as a name service in place of NIS.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Perform the following and verify that the result is as shown:

    # svcs -Ho state svc:/network/nis/server

    disabled

    # svcs -Ho state svc:/network/nis/domain

    disabled'
  remediation: 'To disable this service, run the following commands:

    # svcadm disable svc:/network/nis/server

    # svcadm disable svc:/network/nis/domain

    17 | P a g e'
  checks:
  - type: manual_review
    info: 'Perform the following and verify that the result is as shown:

      # svcs -Ho state svc:/network/nis/server

      disabled

      # svcs -Ho state svc:/network/nis/domain

      disabled'
    severity: medium
