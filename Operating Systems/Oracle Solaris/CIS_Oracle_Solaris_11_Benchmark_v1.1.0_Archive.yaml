    this service may be disabled. This service is disabled by default unless the NIS service has been installed and configured
    on the system.
  rationale: As RPC-based services such as NIS may use non-secure authentication and share sensitive network object information
    with systems and applications using RPC-based service, NIS client daemons should be disabled. Users are encouraged to
    use LDAP as a name service in place of NIS.
  impact: ''
