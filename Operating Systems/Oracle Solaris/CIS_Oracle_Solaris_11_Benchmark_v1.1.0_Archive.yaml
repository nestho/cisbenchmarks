- id: '5.1'
  title: Default Service File Creation Mask
  scoring: scored
  profile:
  - Level 1
  description: The default system file creation mask applies to processes that are started by init - including most system
    services. To ensure that files are not created with write access to anyone other than their owner, the default file creation
    mask should be set to 022. Some sites with more stringent security requirements may prefer to set this value to 077 to
    eliminate all permissions for group and world. Note that changing this value from the Solaris default of 022 may negatively
    impact services that may not be able to operate with a stricter setting.
  rationale: The default file creation mask should be set to 022 to avoid unnecessarily giving files write access to group
    or world.
