  title: Limit Consecutive Login Attempts for SSH
  scoring: scored
  profile:
  - Level 1
  description: The 'MaxAuthTries' parameter in the /etc/ssh/sshd_config file specifies the maximum number of authentication
    attempts permitted per connection. By restricting the number of failed authentication attempts before the server terminates
    the connection, malicious users are blocked from gaining access to the host by using repetitive brute-force login exploits.
  rationale: By setting the authentication login limit to a low value this will disconnect the attacker and force a reconnect,
    which severely limits the speed of such brute force attacks.
