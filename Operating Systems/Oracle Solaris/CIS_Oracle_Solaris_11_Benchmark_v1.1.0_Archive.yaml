      \ global core file content: default\n init core file pattern: core\n init core file content: default\n global core dumps:\
      \ enabled\n per-process core dumps: disabled\n global setid core dumps: enabled\n per-process setid core dumps: disabled\n\
      \ global core dump logging: enabled\n# ls -ld /var/cores\ndrwx------ 2 root sys 2 Oct 20 16:35 /var/cores"
    severity: medium
- id: '3.2'
  title: Enable Stack Protection
  scoring: scored
  profile:
  - Level 1
  description: Buffer overflow exploits have been the basis for many highly publicized compromises and defacements of large
    numbers of Internet connected systems. Many of the automated tools in use by system attackers exploit well-known buffer
    overflow problems in vendorsupplied and third party software. 26 | P a g e
  rationale: Enabling stack protection prevents certain classes of buffer overflow attacks and is a significant security enhancement.
    However, this does not protect against buffer overflow attacks that do not execute code on the stack (such as return-to-libc
    exploits). While most of the Solaris OS is already configured to employ a non-executable stack, this setting is still
    recommended to provide a more comprehensive solution for both Solaris and other software that may be installed.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Perform the following and verify that the result is as shown:

    # grep "^set noexec_user_stack.*=1" /etc/system

    set_noexec_user_stack=1

    set_noexec_user_stack_log=1

    To verify that this setting is in effect on the running system, use the command:

    # echo "noexec_user_stack/D" | mdb -k

    noexec_user_stack: 1'
  remediation: "To enable stack protection and block stack-smashing attacks, run the following to edit the\n/etc/system file:\n\
    # if [ ! \"`grep noexec_user_stack= /etc/system`\" ]; then\n cat <<END_CFG >>/etc/system\nset noexec_user_stack=1\nset\
