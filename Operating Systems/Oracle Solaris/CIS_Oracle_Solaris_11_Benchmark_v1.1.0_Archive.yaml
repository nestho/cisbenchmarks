    appropriate boot images are protected.'
  remediation: '61 | P a g e

    Perform the following to implement the recommended state:

    # /boot/grub/bin/grub

    grub> md5crypt

    Password: [enter desired boot loader password]

    Encrypted: [enter md5 password string]

    grub> [enter control-C (^C)]

    The actual menu.lst file for Solaris 11 x64 is the /rpool/boot/grub/menu.lst. First, ensure

    the menu.lst file can only be read by the root user:

    # chmod 600 /rpool/boot/grub/menu.lst

    Next, add the following line to the menu.lst file above the entries added by bootadm:

    password --md5 [enter md5 password string generated above]

    Finally, add the keyword lock to the Solaris failsafe boot entry as in the following example

    (as well as to any other entries that you want to protect):

    title Solaris failsafe

    lock

