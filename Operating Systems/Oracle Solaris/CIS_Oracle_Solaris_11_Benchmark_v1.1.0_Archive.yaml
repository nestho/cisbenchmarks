  remediation: "Run the following commands to set the TCP_STRONG_ISS parameter to use RFC 1948\nsequence number generation\
    \ in the /etc/default/inetinit file:\n# cd /etc/default\n# awk '/TCP_STRONG_ISS=/ { $1 = \"TCP_STRONG_ISS=2\" }; \\\n\
    \ { print }' inetinit > inetinit.CIS\n# mv inetinit.CIS inetinit\nTo set the TCP_STRONG_ISS parameter on a running system,\
    \ use the command:\n# ipadm set-prop -p _strong_iss=2 tcp"
