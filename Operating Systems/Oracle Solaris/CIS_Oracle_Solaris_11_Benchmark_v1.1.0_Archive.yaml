  title: Disable Host-based Authentication for Login-based Services
  scoring: scored
  profile:
  - Level 1
  description: The .rhosts files are used for automatic login to remote hosts and contain username and hostname combinations.
    The .rhosts files are unencrypted (usually group- or worldreadable) and present a serious risk in that a malicious user
    could use the information within to gain access to a remote host with the privileges of the original application or user.
  rationale: The use of .rhosts authentication is an old and insecure protocol and can be replaced with public-key authentication
    using Secure Shell. As automatic authentication settings in the .rhosts files can provide a malicious user with sensitive
    system credentials, the use of .rhosts files should be disabled. It should be noted that by default the Solaris services
    that use this file, including rsh and rlogin, are disabled by default.
