- id: '6.15'
  title: Set Retry Limit for Account Lockout
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: '58 | P a g e The RETRIES parameter is the number of failed login attempts a user is allowed before being disconnected
    from the system and forced to reconnect. When LOCK_AFTER_RETRIES is set in /etc/security/policy.conf, then the user''s
    account is locked after this many failed retries (the account can only be unlocked by the administrator using the command:
    passwd -u <username>). The account lockout threshold (RETRIES parameter) restricts the number of failed login attempts
    allowed before requiring the offending account be locked. The lockout requirement will help block malicious users from
    gaining access to the host via automated, repetitive brute-force login exploits--trying different passwords until one
    fits a user name. Oracle SPARC systems support the use of a EEPROM password for the console.'
  rationale: Setting the failed login limit to an appropriate value locks the user account, which will severely limit the
    speed of such attacks, making it much more likely that the attacker's pattern will be noticed and the offending source
    address and/or port blocked, so this should be set according to the needs of the user. Setting the EEPROM password helps
    prevent attackers who gain physical access to the system console from booting from an external device (such as a CD-ROM
    or floppy).
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # grep "^RETRIES=" /etc/default/login

    RETRIES=3

    # grep "^LOCK_AFTER_RETRIES=" /etc/security/policy.conf

    LOCK_AFTER_RETRIES=YES

    # userattr lock_after_retries [username]

    (Output should be "no" for any accounts that are exempt from this policy including

    "root".)

    Perform the following to verify that the result is as recommended:

    # eeprom security-mode | awk -F= ''{ print $2 }''

    [command|full|none]

    # eeprom security-#badlogins | awk -F= ''{ print $2 }''

    0

    If a password has been set, the command will return command or full. If a password has

    not been set, the command will return none.'
  remediation: "Perform the following to implement the recommended state:\n# cd /etc/default\n# awk '/RETRIES=/ { $1 = \"\
    RETRIES=3\" }\n { print }' login >login.CIS\n# mv login.CIS login\n# cd /etc/security\n# awk '/LOCK_AFTER_RETRIES=/ \\\
    \n { $1 = \"LOCK_AFTER_RETRIES=YES\" }\n { print }' policy.conf > policy.conf.CIS\n# mv policy.conf.CIS policy.conf\n\
    # svcadm restart svc:/system/name-service/cache\nBe careful when enabling these settings as they can create a denial-of-service\
    \ situation for\nlegitimate users and applications. Account lockout can be disabled for specific users via the\nusermod\
    \ command. For example, the following command disables account lock specifically\nfor the oracle account:\n59 | P a g\
    \ e\n# usermod -K lock_after_retries=no oracle\nNote: The root role is configured in this manner by default to prevent\
    \ accidental lock out.\n6.16 Set EEPROM Security Mode and Log Failed Access (SPARC) (Not\nScored)\nPerform the following\
    \ to implement the recommended state:\n# eeprom security-mode=command\n# eeprom security-#badlogins=0\nAfter entering\
    \ the last command above, the administrator will be prompted for a password.\nThis password will be required to authorize\
    \ any future command issued at boot-level on\nthe system (the ok or > prompt) except for the normal multi-user boot command\
    \ (i.e., the\nsystem will be able to reboot unattended).\n60 | P a g e\nWrite down the password and store it in a sealed\
    \ envelope in a secure location (note that\nlocked desk drawers are typically not secure). If the password is lost or\
    \ forgotten, simply\nlog into the system and run the command:\n# eeprom security-mode=none\nThis will erase the forgotten\
    \ password. If the password is lost or forgotten and this action\ncannot be completed, then the EEPROM must be replaced\
    \ to gain access to the system. To\nset a new password, run the command:\n# eeprom security-mode=command"
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # grep "^RETRIES=" /etc/default/login

      RETRIES=3

      # grep "^LOCK_AFTER_RETRIES=" /etc/security/policy.conf

      LOCK_AFTER_RETRIES=YES

      # userattr lock_after_retries [username]

      (Output should be "no" for any accounts that are exempt from this policy including

      "root".)

      Perform the following to verify that the result is as recommended:

      # eeprom security-mode | awk -F= ''{ print $2 }''

      [command|full|none]

      # eeprom security-#badlogins | awk -F='
    severity: medium
- id: '6.17'
  title: Secure the GRUB Menu (Intel)
  scoring: scored
  profile:
  - Level 1
  description: GRUB is a boot loader for x64 based systems that permits loading an OS image from any location. Oracle x64
    systems support the use of a GRUB Menu password for the console.
  rationale: The flexibility that GRUB provides creates a security risk if its configuration is modified by an unauthorized
    user. The failsafe menu entry needs to be secured in the same environments that require securing the systems firmware
    to avoid unauthorized removable media boots. Setting the GRUB Menu password helps prevent attackers with physical access
    to the system console from booting off some external device (such as a CDROM or floppy) and subverting the security of
    the system. The actions described in this section will ensure you cannot get to failsafe or any of the GRUB command line
    options without first entering the password.
