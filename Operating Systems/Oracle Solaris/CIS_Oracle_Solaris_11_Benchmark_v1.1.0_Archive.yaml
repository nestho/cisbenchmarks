- id: '5.2'
  title: Set Sticky Bit on World Writable Directories
  scoring: scored
  profile:
  - Level 1
  description: When the so-called sticky bit (set with chmod +t) is set on a directory, then only the owner of a file may
    remove that file from the directory (as opposed to the usual behavior where anybody with write access to that directory
    may remove the file).
  rationale: 46 | P a g e Files in directories that have had the 'sticky bit' set, can only be deleted by users that have
    both write permissions for the directory in which the file resides, as well as ownership of the file or directory, or
    has sufficient privilege. As this prevents users from overwriting each other's files, whether it be accidental or malicious,
    it is generally appropriate for most world-writable directories (e.g., /tmp). However, consult appropriate vendor documentation
    before blindly applying the sticky bit to any world writable directories found, in order to avoid breaking any application
    dependencies on a given directory.
  impact: ''
  references: []
  page_start: 46
  audit_raw: "Perform the following to verify that the result is as recommended:\n# find / \\( -fstype nfs -o -fstype cachefs\
    \ -o -fstype autofs \\\n -o -fstype ctfs -o -fstype mntfs -o -fstype objfs \\\n -o -fstype proc \\) -prune -o -type d\
    \ \\( -perm -0002 \\\n -a ! -perm -1000 \\) -ls"
  remediation: 'To set the sticky bit on a directory, run the following command:

    # chmod +t [directory name]

