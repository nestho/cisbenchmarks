    severity: medium
- id: '7.1'
  title: Set Password Expiration Parameters on Active Accounts
  scoring: scored
  profile:
  - Level 1
  description: The characteristics of an operating system that make 'user identification' via password a secure and workable
    solution is the combination of settings chosen. By requiring that a series of password-choices be security-centric, it
    reduces the risk of a malicious user breaking the password through dictionary/brute force attacks or fortuitous guessing
    based upon 'social engineering.' A basic password security strategy is requiring a new password to be chosen every 45-90
    days, so that repeated attempts to gain entry by brute-force tactics will fail when a new password is chosen, which requires
    starting over again to break the new password. 62 | P a g e
  rationale: The commands for this item set all active accounts (except the root account) to force password changes every
    91 days (13 weeks), and then prevent password changes for seven days (one week), thereafter. Users will begin receiving
    warnings 28 days (4 weeks) before their password expires. Sites also have the option of expiring idle accounts after a
    certain number of days (see the on-line manual page for the usermod command, particularly the -f option).
  impact: ''
  references: []
  page_start: 62
  audit_raw: "Perform the following to verify that the result is as recommended:\n# logins -ox |\\\n awk -F: '( $1 != \"root\"\
    \ && $8 != \"LK\" && $8 != \"NL\" && \\\n ( $10 != \"7\" || $11 != \"91\" || $12 != \"28\" )) { print }'\n(No output should\
    \ be returned.)\n# grep \"WEEKS=\" /etc/default/passwd | sort -u\nMAXWEEKS=13\nMINWEEKS=1\nWARNWEEKS=4"
  remediation: "Perform the following to implement the recommended state:\n# logins -ox |\\\n awk -F: '($1 == \"root\" ||\
    \ $8 == \"LK\" || $8 == \"NL\") \\\n { next } ; \\\n { $cmd = \"passwd\" } ;\\\n ($11 91) { $cmd = $cmd \" -x 91\" } \\\
    \n ($10 < 7) { $cmd = $cmd \" -n 7\" } \\\n ($12 < 28) { $cmd = $cmd \" -w 28\" } \\\n ($cmd != \"passwd\") { print $cmd\
    \ \" \" $1 }' \\\n > /etc/CISupd_accounts\n# /sbin/sh /etc/CISupd_accounts\n# rm -f /etc/CISupd_accounts\n# cd /etc/default\n\
    # grep -v WEEKS passwd > passwd.CIS\n# cat <<EODefaults >> passwd.CIS\nMAXWEEKS=13\nMINWEEKS=1\nWARNWEEKS=4\nEODefaults\n\
    # mv passwd.CIS passwd\n63 | P a g e"
