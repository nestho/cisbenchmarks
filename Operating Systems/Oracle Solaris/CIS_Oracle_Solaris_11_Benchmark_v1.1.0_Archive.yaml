- id: '4.5'
  title: Configure Solaris Auditing
  scoring: scored
  profile:
  - Level 1
  description: Solaris auditing service keeps a record of how a system is being used. Solaris auditing can be configured to
    record different classes of events based upon site policy. This recommendation will set and verify a consensus-developed
    auditing policy. That said, all organizations are encouraged to tailor this policy based upon their specific needs. For
    more information on the Solaris auditing service including how to filter and view events, see the Oracle Solaris product
    documentation. The "cis" class is a "custom class" that CIS recommends creating that includes specifically those events
    that are of interest (defined in the sections above). In addition to those events, this recommendation also includes auditing
    of login and logout (lo) events, administrative (ad) events, file transfer (ft) events, and command execution (ex) events.
    This recommendation also configures the Solaris auditing service to capture and report command line arguments (for command
    execution events) and the zone name in which a command was executed (for global and non-global zones). Further, this recommendation
    sets a disk utilization threshold of 1%. If this threshold is crossed (for the volume that includes /var/audit), then
    a warning e-mail will be sent to advise the system administrators that audit events may be lost if the disk becomes full.
    Finally, this recommendation will also ensure that new audit trails are created at the start of each new day (to help
    keep the size of the files small to facilitate analysis).
  rationale: The consensus settings described in this section are an effort to log interesting system events without consuming
    excessive amounts of resources logging significant but usually uninteresting system calls.
  impact: ''
  references: []
  page_start: 44
  audit_raw: "Perform the following to determine if the system is configured as recommended:\n44 | P a g e\n# auditconfig\
    \ -getcond\naudit condition = auditing\n# auditconfig -getpolicy\nconfigured audit policies = argv,cnt,zonename\nactive\
    \ audit policies = argv,cnt,zonename\n# auditconfig -getflags\nactive user default audit flags =\ncis,ex,aa,ua,as,ss,lo,ft(0x1000000800f1080,0x1000000800f1080)\n\
    configured user default audit flags =\ncis,ex,aa,ua,as,ss,lo,ft(0x1000000800f1080,0x1000000800f1080)\n# auditconfig -getnaflags\n\
    active non-attributable audit flags = lo(0x1000,0x1000)\nconfigured non-attributable audit flags = lo(0x1000,0x1000)\n\
    # auditconfig -getplugin audit_binfile\nPlugin: audit_binfile (active)\n Attributes: p_dir=/var/audit;p_fsize=0;p_minfree=1;\n\
    # userattr audit_flags root\nlo,ad,ft,ex,cis:no\n# ls -l /var/audit/*.not_terminated.*\n[verify that the file size is\
    \ not zero and is growing as events are audited]"
  remediation: 'To enforce this setting, use the command:

