- id: '2.11'
  title: Disable Local-only RPC Port Mapping Service
  scoring: scored
  profile:
  - Level 1
  description: Remote Procedure Call (RPC) is used by many services within the Solaris 11 operating system. Some of these
    services allow external connections to use the service (e.g. NFS, NIS). By default, the Solaris 11 OS configures this
    service to be local only.
  rationale: RPC-based services typically have weak or non-existent authentication and yet may share very sensitive information,
    which is vulnerable to network traffic sniffers. Unless one of these services is required on this host, RPC-based tools
    should be fully disabled.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Perform the following and verify that the result is as shown:

    # svcs -Ho state svc:/network/rpc/bind

    disabled'
  remediation: 'To disable this service, run the following command:

    # svcadm disable svc:/network/rpc/bind

    If the goal is to restrict access to this service, but not disable it completely, consider using a

    host-based firewall such as ipfilter(5) to control what hosts are allowed to access this

    22 | P a g e

    service. Alternatively, TCP Wrappers support, which controls host access and connection

    auditing, can be enabled. TCP Wrappers is discussed in the next section.'
  checks:
  - type: manual_review
    info: 'Perform the following and verify that the result is as shown:

      # svcs -Ho state svc:/network/rpc/bind

      disabled'
    severity: medium
- id: '2.12'
  title: Configure TCP Wrappers
  scoring: scored
  profile:
  - Level 1
  description: TCP Wrappers is a host-based access control system that allows administrators to control who has access to
    various network services based on the IP address of the remote end of the connection. TCP Wrappers also provide logging
    information via syslog about both successful and unsuccessful connections.
  rationale: TCP Wrappers provides granular control over what services can be accessed over the network. Its logs show attempted
    access to services from non-authorized systems, which can help identify unauthorized access attempts.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Perform the following and verify that the result is as shown:\n# inetadm -p | grep tcp_wrappers\ntcp_wrappers=TRUE\n\
    # ls /etc/hosts.deny\n/etc/hosts.deny\n# ls /etc/hosts.allow\n/etc/hosts.allow\nThe above command will check whether TCP\
    \ Wrappers is enabled for all TCP-based\nservices started by inetd. TCP Wrappers are enabled by default for sendmail and\n\
    SSH. Individual inetd services may still be configured to use TCP Wrappers even if the\nglobal parameter (above) is set\
    \ to FALSE. To check the status of individual inetd services,\nuse the command:\n# for svc in `inetadm | awk '/svc:\\\
    // { print $NF }'`; do\n val=`inetadm -l ${svc} | grep -c tcp_wrappers=TRUE`\n if [ ${val} -eq 1 ]; then\n echo \"TCP\
    \ Wrappers enabled for ${svc}\"\n fi\ndone\nLastly, TCP Wrappers can be enabled for the RPC port mapping service. To determine\
    \ if\nthis is the case, use the command:\n23 | P a g e\n# svcprop -p config/enable_tcpwrappers rpc/bind\nfalse"
  remediation: 'To enable TCP Wrappers, run the following commands:

    1. Create and customize your policy in /etc/hosts.allow:

    # echo "ALL: <net>/<mask>, <net/<mask>, …" > /etc/hosts.allow

    where each <net>/<mask> combination (for example, the Class C address block

    "192.168.1.0/255.255.255.0") can represent one network block in use by your

    organization that requires access to this system.

    2. Create a default deny policy in /etc/hosts.deny:

    # echo "ALL: ALL" >/etc/hosts.deny

    3. Enable TCP Wrappers for all services started by inetd:

    # inetadm -M tcp_wrappers=TRUE

    To protect only specific inetd services, use the command:

    # inetadm -m [FMRI] tcp_wrappers=TRUE

    To enable TCP Wrappers for the RPC port mapping service, use the commands:

    # svccfg -s rpc/bind setprop config/enable_tcpwrappers=true

    # svcadm refresh rpc/bind

    The versions of SSH and sendmail that ship with Solaris 11 will automatically use

    TCP Wrappers to filter access if a hosts.allow or hosts.deny file exists. To protect

    UDP and RPC-based services that are spawned from inetd, consider implementing a

    host-based firewall such as Solaris IP Filter. See ipfilter(5) for more information.

    24 | P a g e'
  checks:
  - type: command
    command: '# inetadm -p | grep tcp_wrappers && val=`inetadm -l ${svc} | grep -c tcp_wrappers=TRUE`'
    expected: 'Perform the following and verify that the result is as shown:'
    severity: medium
    info: 'Perform the following and verify that the result is as shown:

      # inetadm -p | grep tcp_wrappers

      tcp_wrappers=TRUE

      # ls /etc/hosts.deny

      /etc/hosts.deny

      # ls /etc/hosts.allow

      /etc/hosts.allow

      The above command will check whether TCP Wrappers is enabled for all TCP-based

      services started by inetd. TCP Wrappers are enabled by default for sendmail and

      SSH. Individual inetd services may still be configur'
- id: '2.13'
  title: Disable Telnet Service
  scoring: scored
  profile:
  - Level 1
  description: The telnet daemon, which accepts connections from users from other systems via the telnet protocol and can
    be used for remote shell access.
  rationale: The telnet protocol is insecure and unencrypted. The use of an unencrypted transmission medium could allow a
    user with access to sniff network traffic the ability to steal credentials. The ssh protocol provides an encrypted session
    and stronger security.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Ensure telnet server is not enabled:

    # svcs -Ho state svc:/network/telnet

    disabled'
  remediation: 'Disable telnet server if enabled:

    # svcadm disable svc:/network/telnet

    3 Kernel Tuning

    This section describes additional measures that may be taken to provide protection on the kernel

    level.'
  checks:
  - type: manual_review
    info: 'Ensure telnet server is not enabled:

      # svcs -Ho state svc:/network/telnet

      disabled'
    severity: medium
