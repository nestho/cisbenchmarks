  title: Restrict Core Dumps to Protected Directory
  scoring: scored
  profile:
  - Level 1
  description: The action described in this section creates a protected directory to store core dumps and also causes the
    system to create a log entry whenever a regular process dumps core. 25 | P a g e
  rationale: Core dumps, particularly those from set-UID and set-GID processes, may contain sensitive data.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Perform the following and verify that the result is as shown:\n# coreadm\n global core file pattern: /var/cores/core_%n_%f_%u_%g_%t_%p\n\
    \ global core file content: default\n init core file pattern: core\n init core file content: default\n global core dumps:\
    \ enabled\n per-process core dumps: disabled\n global setid core dumps: enabled\n per-process setid core dumps: disabled\n\
    \ global core dump logging: enabled\n# ls -ld /var/cores\ndrwx------ 2 root sys 2 Oct 20 16:35 /var/cores"
  remediation: "To implement the recommendation, run the commands:\n# chmod 700 /var/cores\n# coreadm -g /var/cores/core_%n_%f_%u_%g_%t_%p\
    \ \\\n -e log -e global -e global-setid \\\n -d process -d proc-setid\nIf the local site chooses, dumping of core files\
