    intended to provide an interactive shell. These accounts are delivered either in a locked or non-login state. Oracle does
    not support nor recommend changing the passwords associated with these accounts.
  rationale: System accounts, such as bin, lpd, and sys have special purposes and privileges. By default, these accounts are
    configured as either locked or non-login. This status should be verified to ensure that these accounts have not accidentally
    or intentionally been enabled.
