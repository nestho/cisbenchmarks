- id: '10.1'
  title: SN.1 Restrict access to suspend feature
  scoring: manual
  profile:
  - Level 2
  description: Solaris 11 does not enable the suspend capability by default and now uses the poweradm command to suspend the
    system.
  rationale: Bear in mind that users with physical access to a system can simply remove power from the machine if they are
    truly motivated to take the system off-line, and granting the capability to use poweradm may be a more graceful way of
    allowing desktop users to shut down their own machines.
  impact: ''
  references: []
  page_start: 177
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # poweradm list | grep suspend

    suspend/suspend-enable current=false, smf=false'
  remediation: 'Perform the following to implement the recommended state:

    # poweradm set suspend-enable=false

    # poweradm update'
