  description: The variables in the /etc/default/passwd file indicate various strategies for creating differences required
    between an old and a new password. As requiring users to select a specific numbers of differences between the characters
    in the existing password and the new one can strengthen the password by increasing the symbol-set space, to further increase
    the difficulty of breaking any password by brute-force attacks, these values should be set as appropriate to the needs
    of the user.
  rationale: 'Administrators may wish to add site-specific dictionaries to the DICTIONLIST parameter. Warning: Sites often
    have differing opinions on the optimal value of the HISTORY parameter (how many previous passwords to remember per user
    in order to prevent reuse). The values specified here are in compliance with NSA/DISA requirements. If this is too restrictive
    for your site, you may wish to set a HISTORY value of 4 and a MAXREPEATS of 2. Consult your local security rules for guidance.'
