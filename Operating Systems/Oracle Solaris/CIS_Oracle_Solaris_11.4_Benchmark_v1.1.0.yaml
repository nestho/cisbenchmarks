- id: '6.17'
  title: Set Retry Limit for Account Lockout
  scoring: scored
  profile:
  - Level 1
  description: 'The RETRIES parameter is the number of failed login attempts a user is allowed before being disconnected from
    the system and forced to reconnect. When LOCK_AFTER_RETRIES is set in /etc/security/policy.conf, then the user''s account
    is locked after this many failed retries (the account can only be unlocked by the administrator using the command: passwd
    -u <username>. The account lockout threshold (RETRIES parameter) restricts the number of failed login attempts allowed
    before requiring the offending account be locked. The lockout requirement will help block malicious users from gaining
    access to the host via automated, repetitive bruteforce login exploits--trying different passwords until one fits a user
    name.'
  rationale: Setting the failed login limit to an appropriate value locks the user account, which will severely limit the
    speed of such attacks, making it much more likely that the attacker's pattern will be noticed and the offending source
    address and/or port blocked, so this should be set according to the needs of the user.
  impact: ''
  references: []
  page_start: 118
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # grep "^RETRIES=" /etc/default/login

    RETRIES=3

    # grep "^LOCK_AFTER_RETRIES=" /etc/security/policy.conf

    LOCK_AFTER_RETRIES=YES

    # userattr lock_after_retries <username>

    (Output should be "no" for any accounts that are exempt from this policy including

    "root".)'
  remediation: 'Perform the following to implement the recommended state:

    # cd /etc/default

    # awk ''/RETRIES=/ { $1 = "RETRIES=3" } { print }'' login >login.CIS

    # mv login.CIS login

    # cd /etc/security

    # awk ''/LOCK_AFTER_RETRIES=/ { $1 = "LOCK_AFTER_RETRIES=YES" } { print }''

    policy.conf > policy.conf.CIS

    # mv policy.conf.CIS policy.conf

    # svcadm restart svc:/system/name-service/cache

    Be careful when enabling these settings as they can create a denial-of-service situation

    for legitimate users and applications. Account lockout can be disabled for specific users

    via the usermod command. For example, the following command disables account lock

    specifically for the oracle account:

    # usermod -K lock_after_retries=no oracle

    Note: The root role is configured in this manner by default to prevent accidental lock

    out.'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # grep "^RETRIES=" /etc/default/login

      RETRIES=3

      # grep "^LOCK_AFTER_RETRIES=" /etc/security/policy.conf

      LOCK_AFTER_RETRIES=YES

      # userattr lock_after_retries <username>

      (Output should be "no" for any accounts that are exempt from this policy including

      "root".)'
    severity: medium
- id: '7.1'
  title: Set Password Expiration Parameters on Active Accounts
  scoring: scored
  profile:
  - Level 1
  description: The characteristics of an operating system that make 'user identification' via password a secure and workable
    solution is the combination of settings chosen. By requiring that a series of password-choices be security-centric, it
    reduces the risk of a malicious user breaking the password through dictionary/brute force attacks or fortuitous guessing
    based upon 'social engineering.' A basic password security strategy is requiring a new password to be chosen every 45-90
    days, so that repeated attempts to gain entry by brute-force tactics will fail when a new password is chosen, which requires
    starting over again to break the new password.
  rationale: The commands for this item set all active accounts (except the root account) to force password changes every
    91 days (13 weeks), and then prevent password changes for seven days (one week), thereafter. Users will begin receiving
    warnings 7 days (1 week) before their password expires. Sites also have the option of expiring idle accounts after a certain
    number of days (see the on-line manual page for the usermod command, particularly the -f option).
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # logins -ox | awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ( $10 <

    7 || $11 > 91 || $12 < 7 )) { print }''

    (No output should be returned.)

    # grep "WEEKS=" /etc/default/passwd | sort -u

    MAXWEEKS=13

    MINWEEKS=1

    WARNWEEKS=4'
  remediation: 'Perform the following to implement the recommended state:

    # logins -ox | awk -F: ''($1 == "root" || $8 == "LK" || $8 == "NL") { next } ;

    { cmd = "passwd" } ; ($11 < 91) { cmd = cmd " -x 91" } ($10 < 7) { cmd = cmd

    " -n 7" } ($12 < 28) { cmd = cmd " -w 28" } (cmd != "passwd") { print cmd " "

    $1 }'' > /etc/CISupd_accounts

    # /sbin/sh /etc/CISupd_accounts

    # rm -f /etc/CISupd_accounts

    # cd /etc/default

    # cp passwd passwd.orig

    # grep -v WEEKS passwd > passwd.CIS

    # cat <<EODefaults >> passwd.CIS

    MAXWEEKS=13

    MINWEEKS=1

    WARNWEEKS=1

    EODefaults

    # mv passwd.CIS passwd'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # logins -ox | awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ( $10 <

      7 || $11 > 91 || $12 < 7 )) { print }''

      (No output should be returned.)

      # grep "WEEKS=" /etc/default/passwd | sort -u

