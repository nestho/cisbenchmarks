- id: '1.1'
  title: Use the Latest Package Updates
  scoring: manual
  profile:
  - Level 1
  description: 'The Solaris 11 OS should be periodically updated to install or upgrade software packages that will enhance
    the security, reliability, and performance of the system. WARNING: Proper system update and correct package selection
    depend on the presence of this incorporation. Removing this package will result in an unsupported system. For more information
    see: https://support.oracle.com/rs?type=doc&id=2433412.1 Category: Meta Packages/Incorporations State: Installed Publisher:
    solaris Version: 11.4 (Oracle Solaris 11.4.12.5.0) Branch: 11.4.12.0.1.5.0 Packaging Date: August 9, 2019 at 10:06:39
    PM Last Install Time: August 29, 2019 at 8:47:28 PM Size: 2.52 kB FMRI: pkg://solaris/entire@11.4-11.4.12.0.1.5.0:20190809T220639Z
    For more information, see the Oracle white paper titled "Packaging and Delivering Software with the Image Packaging System
    in Oracle Solaris 11.4" available from: https://docs.oracle.com/cd/E37838_01/html/E61051/index.html.'
  rationale: For the Solaris 11 OS, there will be no more software patches issued, but rather security and other improvements
    will be installed by updating one or more software packages.
  impact: ''
  references: []
  page_start: 14
  audit_raw: "To verify that the system is operating with the latest software updates, perform the\nfollowing and verify that\
    \ the result is as shown:\n# pkg update -n\nNo updates available for this image.\nIn addition, you can manually verify\
    \ the update associated with the running system\nusing the following command. The output of this command will indicate\
    \ the operation\nsystem version and update number as well as the Software Repository Update (SRU)\nnumber.\npkg info entire\n\
    \ Name: entire\n Summary: entire incorporation including Support Repository Update\n (Oracle Solaris 11.4.12.5.0)."
  remediation: 'Run the following command to refresh the package catalog, download and apply any

    available updates:

    # pkg update'
  checks:
  - type: manual_review
    info: "To verify that the system is operating with the latest software updates, perform the\nfollowing and verify that\
      \ the result is as shown:\n# pkg update -n\nNo updates available for this image.\nIn addition, you can manually verify\
      \ the update associated with the running system\nusing the following command. The output of this command will indicate\
      \ the operation\nsystem version and update number as well as the Software Repository Update (SRU)\nnumber.\npkg info\
      \ entire\n Name: entire\n Summary: entire incorpora"
    severity: medium
- id: '2.1'
  title: Configure TCP Wrappers
  scoring: manual
  profile:
  - Level 1
  description: TCP Wrappers is a host-based access control system that allows administrators to control who has access to
    various network services based on the IP address of the remote end of the connection. TCP Wrappers also provide logging
    information via syslog about both successful and unsuccessful connections.
  rationale: TCP Wrappers provides granular control over what services can be accessed over the network. Its logs show attempted
    access to services from non-authorized systems, which can help identify unauthorized access attempts.
  impact: ''
  references: []
  page_start: 17
  audit_raw: "Perform the following and verify that the result is as shown:\n# inetadm -p | grep tcp_wrappers\ntcp_wrappers=TRUE\n\
    # ls /etc/hosts.deny\n/etc/hosts.deny\n# ls /etc/hosts.allow\n/etc/hosts.allow\nThe following script will check whether\
    \ TCP Wrappers is enabled for all TCP-based\nservices started by inetd. Individual inetd services may still be configured\
    \ to use TCP\nWrappers even if the global parameter (above) is set to FALSE. To check the status of\nindividual inetd\
    \ services, use the command:\n# for svc in `inetadm | awk '/svc:\\// { print $NF }'`; do\n val=`inetadm -l ${svc} 2>/dev/null\
    \ | grep -c tcp_wrappers=TRUE`\n if [ ${val} -eq 1 ]; then\n echo \"TCP Wrappers enabled for ${svc}\"\n else\n echo \"\
    *** TCP Wrappers is not enabled for ${svc}\"\n fi\ndone\nLastly, TCP Wrappers can be enabled for the RPC port mapping\
    \ service. To determine\nif this is the case, use the command:\n# svcprop -p config/enable_tcpwrappers rpc/bind\nfalse"
  remediation: 'To enable TCP Wrappers, run the following commands:

    1. Create and customize your policy in /etc/hosts.allow:

    # echo "ALL: <net>/<mask>, <net/<mask>, …" > /etc/hosts.allow

    where each / combination (for example, the Class C address block

    "192.168.1.0/255.255.255.0") can represent one network block in use by your

    organization that requires access to this system.

    2. Create a default deny policy in /etc/hosts.deny:

    # echo "ALL: ALL" >/etc/hosts.deny

    3. Enable TCP Wrappers for all services started by inetd:

    # inetadm -M tcp_wrappers=TRUE

    To protect only specific inetd services, use the command:

    # inetadm -m [FMRI] tcp_wrappers=TRUE

    where [FMRI] is the service to protect.

    To enable TCP Wrappers for the RPC port mapping service, use the commands:

    # svccfg -s rpc/bind setprop config/enable_tcpwrappers=true

    # svcadm refresh rpc/bind

    To protect UDP and RPC-based services that are spawned from inetd, consider

    implementing a host-based firewall. Oracle Solaris PF firewall (a.k.a. PF) has replaced

    Solaris IP Filter (IPF) in Solaris 11.4. See firewall(5) for more information.'
  checks:
  - type: command
    command: '# inetadm -p | grep tcp_wrappers && val=`inetadm -l ${svc} 2>/dev/null | grep -c tcp_wrappers=TRUE`'
    expected: 'Perform the following and verify that the result is as shown:'
    severity: medium
    info: 'Perform the following and verify that the result is as shown:

      # inetadm -p | grep tcp_wrappers

      tcp_wrappers=TRUE

      # ls /etc/hosts.deny

      /etc/hosts.deny

      # ls /etc/hosts.allow

      /etc/hosts.allow

      The following script will check whether TCP Wrappers is enabled for all TCP-based

      services started by inetd. Individual inetd services may still be configured to use TCP

      Wrappers even if the global parameter (ab'
