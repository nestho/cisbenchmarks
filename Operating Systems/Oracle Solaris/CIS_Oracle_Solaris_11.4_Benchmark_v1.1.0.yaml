- id: '7.3'
  title: Set Default umask for users
  scoring: scored
  profile:
  - Level 1
  description: The default umask(1) determines the permissions of files created by users. The user creating the file has the
    discretion of making their files and directories readable by others via the chmod(1) command. Users who wish to allow
    their files and directories to be readable by others by default may choose a different default umask by inserting the
    umask command into the standard shell configuration files (.profile, .cshrc, etc.) in their home directories.
  rationale: Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would allow files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'Perform the following to verify that the result is as recommended:

