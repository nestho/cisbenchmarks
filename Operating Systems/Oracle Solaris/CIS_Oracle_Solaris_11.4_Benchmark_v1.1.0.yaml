- id: '6.15'
  title: Secure the GRUB Menu (Intel)
  scoring: scored
  profile:
  - Level 1
  description: GRUB is a boot loader for x64 based systems that permits loading an OS image from any location. Oracle x64
    systems support the use of a GRUB Menu password for the console.
  rationale: The flexibility that GRUB provides creates a security risk if its configuration is modified by an unauthorized
    user. The failsafe menu entry needs to be secured in the same environments that require securing the systems firmware
    to avoid unauthorized removable media boots. Setting the GRUB Menu password helps prevent attackers with physical access
    to the system console from booting off some external device (such as a CD-ROM or floppy) and subverting the security of
    the system. The actions described in this section will ensure you cannot get to failsafe or any of the GRUB command line
    options without first entering the password.
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # psrinfo -pv | awk ''/GenuineIntel/ {print substr($2, 2)}''

    GenuineIntel

    # /usr/bin/grep "password.cfg" /rpool/boot/grub/grub.cfg

    source /@/boot/grub/password.cfg'
  remediation: 'Run the following command to generate your password hash:

    # /usr/lib/grub2/bios/bin/grub-mkpasswd-pbkdf2

    Enter password:

    Reenter password:

    PBKDF2 hash of your password is <em><password_hash></em>

    Create the file /usr/lib/grub2/bios/etc/grub.d/01\_password:

    #!/bin/sh

    /usr/bin/cat > /rpool/boot/grub/password.cfg<<EOF

    #

    # GRUB password

    #

    set superusers="root"

    password_pbkdf2 root <em><password_hash></em>

    EOF

    /usr/bin/chmod 600 /rpool/boot/grub/password.cfg

    /usr/bin/echo ''source /@/boot/grub/password.cfg''

    Run the following to finalize the password configuration and set menu timeout:

    # /usr/bin/chmod 700 /usr/lib/grub2/bios/etc/grub.d/01_password

    # /usr/sbin/bootadm set-menu timeout=30

    Changes will take effect on the next reboot.'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # psrinfo -pv | awk ''/GenuineIntel/ {print substr($2, 2)}''

      GenuineIntel

      # /usr/bin/grep "password.cfg" /rpool/boot/grub/grub.cfg

      source /@/boot/grub/password.cfg'
    severity: medium
