    # cd /etc/default

    # awk ''/#UMASK=/ { $1 = "UMASK=027" } { print }'' login > login.CIS

    # mv login.CIS login'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # grep "^UMASK=" /etc/default/login

      UMASK=027'
    severity: medium
