    #rlogin auth sufficient pam_rhosts_auth.so.1

    #rsh auth sufficient pam_rhosts_auth.so.1

    # grep "pam_rhosts_auth" /etc/pam.d/*'
  remediation: 'Edit /etc/pam.conf and any /etc/pam.d/* results from audit procedure and comment

    out or remove any pam_rhosts_auth lines:

    #rlogin auth sufficient pam_rhosts_auth.so.1

    #rsh auth sufficient pam_rhosts_auth.so.1'
