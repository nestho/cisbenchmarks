- id: '3.3'
  title: Enable Strong TCP Sequence Number Generation
  scoring: scored
  profile:
  - Level 1
  description: The variable TCP_STRONG_ISS defines the mechanism used for TCP initial sequence number generation. If an attacker
    can predict the next sequence number, it is possible to inject fraudulent packets into the data stream to hijack the session.
  rationale: The RFC 1948 method is widely accepted as the strongest mechanism for TCP packet generation. This makes remote
    session hijacking attacks more difficult, as well as any other network-based attack that relies on predicting TCP sequence
    number information. It is theoretically possible that there may be a small performance hit in connection setup time when
    this setting is used, but there are no publicly available benchmarks that establish this.
  impact: ''
  references: []
  page_start: 47
  audit_raw: 'To verify the setting is in effect in the /etc/default/inetinit file, run the following

    command:

    # grep "^TCP_STRONG_ISS=" /etc/default/inetinit

    TCP_STRONG_ISS=2

    To verify this setting is in effect on the running system, run the following command:

