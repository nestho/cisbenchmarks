- id: '6.13'
  title: Disable X11 Forwarding for SSH
  scoring: scored
  profile:
  - Level 1
  description: 'The X11 Forwarding parameter defined within the /etc/ssh/sshd_config file specifies whether or not X11 Forwarding
    via SSH is enabled on the server: The Secure Shell service provides an encrypted ''tunnel'' for the data traffic passing
    through it. While commonly used to substitute for clear-text, CLI-based remote connections such as telnet, Secure Shell
    can be used to forward an ''X Window'' session through the encrypted tunnel, allowing the remote user to have a GUI interface.'
  rationale: As enabling X11Forwarding on the host can permit a malicious user to secretly open another X11 connection to
    another remote client during the session and perform unobtrusive activities such as keystroke monitoring, if the X11 services
    are not required for the system's intended function, it should be disabled or restricted as appropriate to the user's
    needs.
  impact: ''
