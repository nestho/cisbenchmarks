  title: Lock Inactive User Accounts
  scoring: scored
  profile:
  - Level 1
  description: Guidelines published by the U.S. Department of Defense specify that user accounts must be locked out after
    35 days of inactivity. This number may vary based on the particular site's policy.
  rationale: Inactive accounts pose a threat to system security since the users are not logging in to notice failed login
    attempts or other anomalies.
  impact: ''
  references: []
  page_start: 132
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # useradd -D | xargs -n 1 | grep inactive | awk -F= ''{ print $2 }''

    35

    # logins -axo -l "[name]" | awk -F: ''{ print $13 }''

    35'
  remediation: 'Perform the following to implement the recommended state:

