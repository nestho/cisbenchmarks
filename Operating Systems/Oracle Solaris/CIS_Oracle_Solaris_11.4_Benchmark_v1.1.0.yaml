- id: '4.5'
  title: Configure Solaris Auditing
  scoring: scored
  profile:
  - Level 1
  description: Solaris auditing service keeps a record of how a system is being used. Solaris auditing can be configured to
    record different classes of events based upon site policy. This recommendation will set and verify a consensus-developed
    auditing policy. That said, all organizations are encouraged to tailor this policy based upon their specific needs. For
    more information on the Solaris auditing service including how to filter and view events, see the Oracle Solaris product
    documentation. The "cis" class is a "custom class" that CIS recommends creating that includes specifically those events
    that are of interest (defined in the sections above). In addition to those events, this recommendation also includes auditing
    of login and logout (lo) events, administrative (ad) events, file transfer (ft) events, and command execution (ex) events.
    This recommendation also configures the Solaris auditing service to capture and report command line arguments (for command
    execution events) and the zone name in which a command was executed (for global and non-global zones). Further, this recommendation
    sets a disk utilization threshold of 1%. If this threshold is crossed (for the volume that includes /var/shares/audit),
    then a warning e-mail will be sent to advise the system administrators that audit events may be lost if the disk becomes
    full. Finally, this recommendation will also ensure that new audit trails are created at the start of each new day (to
    help keep the size of the files small to facilitate analysis).
  rationale: The consensus settings described in this section are an effort to log interesting system events without consuming
    excessive amounts of resources logging significant but usually uninteresting system calls.
  impact: ''
  references: []
  page_start: 83
  audit_raw: "Perform the following to determine if the system is configured as recommended:\n# auditconfig -getcond\naudit\
    \ condition = auditing\n# auditconfig -getpolicy\nconfigured audit policies = argv,cnt,zonename\nactive audit policies\
    \ = argv,cnt,zonename\n# auditconfig -getflags\nconfigured user default audit flags =\nad,ft,lo,ex,cis(0x1000000800f1080,0x1000000800f1080)\n\
    active user default audit flags =\nad,ft,lo,ex,cis(0x1000000800f1080,0x1000000800f1080)\n# auditconfig -getnaflags\nconfigured\
    \ non-attributable audit flags = lo(0x1000,0x1000)\nactive non-attributable audit flags = lo(0x1000,0x1000)\n# auditconfig\
    \ -getplugin audit_binfile\nPlugin: audit_binfile (active)\n Attributes:\np_age=0h;p_dir=/var/audit;p_flags=all;p_fsize=0;p_minfree=1\n\
    # userattr audit_flags root\nlo,ad,ft,ex,cis:no\n# ls -l /var/share/audit/*.not_terminated.*\n[verify that the file size\
    \ is not zero and is growing as events are audited]"
  remediation: 'To enforce this setting, run the following commands:

    # auditconfig -conf

    # auditconfig -setflags lo,ad,ft,ex,cis

    # auditconfig -setnaflags lo

    # auditconfig -setpolicy cnt,argv,zonename

    # auditconfig -setplugin audit_binfile active p_minfree=1

    # audit -s

    # rolemod -K audit_flags=lo,ad,ft,ex,cis:no root

    # EDITOR=ed crontab -e root << END_CRON

    $

    a

    0 0 * * * /usr/sbin/audit -n

    .

    w

    q

    END_CRON

    # chown root:root /var/share/audit

    # chmod 750 /var/share/audit'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the system is configured as recommended:

      # auditconfig -getcond

      audit condition = auditing

      # auditconfig -getpolicy

      configured audit policies = argv,cnt,zonename

      active audit policies = argv,cnt,zonename

      # auditconfig -getflags

      configured user default audit flags =

      ad,ft,lo,ex,cis(0x1000000800f1080,0x1000000800f1080)

      active user default audit flags =

      ad,ft,lo,ex,cis(0x1000000800f1080,0x1000000800f1080)

      # auditconfig -getnaflags

      configured non-attributable au'
    severity: medium
- id: '5.1'
  title: Set Sticky Bit on World Writable Directories
  scoring: manual
  profile:
  - Level 1
  description: When the so-called sticky bit (set with chmod +t) is set on a directory, then only the owner of a file may
    remove that file from the directory (as opposed to the usual behavior where anybody with write access to that directory
    may remove the file).
  rationale: Files in directories that have had the 'sticky bit' set, can only be deleted by users that have both write permissions
    for the directory in which the file resides, as well as ownership of the file or directory, or has sufficient privilege.
    As this prevents users from overwriting each other's files, whether it be accidental or malicious, it is generally appropriate
    for most world-writable directories (e.g., /tmp). However, consult appropriate vendor documentation before blindly applying
    the sticky bit to any world writable directories found, in order to avoid breaking any application dependencies on a given
    directory.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs -o -fstype ctfs

    -o -fstype mntfs -o -fstype objfs -o -fstype proc \) -prune -o -type d \( -

    perm -0002 -a ! -perm -1000 \) -ls

    No output should be returned.'
  remediation: 'To set the sticky bit on a directory, run the following command:

    # chmod +t [directory name]'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs -o -fstype ctfs

      -o -fstype mntfs -o -fstype objfs -o -fstype proc \) -prune -o -type d \( -

      perm -0002 -a ! -perm -1000 \) -ls

      No output should be returned.'
    severity: medium
- id: '6.1'
  title: 'Disable login: Services on Serial Ports'
  scoring: scored
  profile:
  - Level 1
  description: The svccfg command provides service administration for the lower level of the Service Access Facility hierarchy
    and can be used to disable the ability to login on a particular port. Oracle SPARC systems support the use of an EEPROM
    password for the console.
  rationale: Login services should not be enabled on any serial ports that are not strictly required to support the mission
    of the system. This action can be safely performed even when console access is provided using a serial port. Setting the
    EEPROM password helps prevent attackers who gain physical access to the system console from booting from an external device
    (such as a CD-ROM or floppy).
  impact: 'If the EEPROM password is lost or forgotten and # eeprom security-mode=none cannot be completed, then the EEPROM
    must be replaced to gain access to the system'
  references: []
  page_start: 90
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # svcs -Ho state svc:/system/console-login:terma

    disabled

    # svcs -Ho state svc:/system/console-login:termb

    disabled

    Perform the following to verify that the result is as recommended:

    # eeprom security-mode | awk -F= ''{ print $2 }''

    [command|full|none]

    # eeprom security-#badlogins | awk -F= ''{ print $2 }''

    0

    If a password has been set, the command will return command or full. If a password has

    not been set, the command will return none.'
  remediation: 'Perform the following to implement the recommended state:

    # svcadm disable svc:/system/console-login:terma

    # svcadm disable svc:/system/console-login:termb

    Perform the following to implement the recommended state:

    # eeprom security-mode=command

    # eeprom security-#badlogins=0

    After entering the last command above, the administrator will be prompted for a

    password. This password will be required to authorize any future command issued at

    boot-level on the system (the ok or > prompt) except for the normal multi-user boot

    command (i.e., the system will be able to reboot unattended).

    Write down the password and store it in a sealed envelope in a secure location (note

    that locked desk drawers are typically not secure). If the password is lost or forgotten,

    simply log into the system and run the following command:

    # eeprom security-mode=none

    This will erase the forgotten password. If the password is lost or forgotten and this

    action cannot be completed, then the EEPROM must be replaced to gain access to the

    system.

    To set a new password, run the following command:

    # eeprom security-mode=command'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # svcs -Ho state svc:/system/console-login:terma

      disabled

      # svcs -Ho state svc:/system/console-login:termb

      disabled

      Perform the following to verify that the result is as recommended:

      # eeprom security-mode | awk -F= ''{ print $2 }''

      [command|full|none]

      # eeprom security-#badlogins | awk -F= ''{ print $2 }''

      0

      If a password has been set, the command will return command or full. If a password has

      not been set, the command will return n'
    severity: medium
- id: '6.3'
  title: Restrict at/cron to Authorized Users
  scoring: scored
  profile:
  - Level 1
  description: The cron.allow and at.allow files contain a list of users who are allowed to run the crontab and at commands
    to submit jobs to be run at scheduled intervals.
  rationale: On many systems, only the system administrator needs the ability to schedule jobs. Even though a given user is
    not listed in cron.allow, cron jobs can still be run as that user. The cron.allow file only controls administrative access
    to the crontab command for scheduling and modifying cron jobs. Much more effective access controls for the cron system
    can be obtained by using Role-Based Access Controls (RBAC).
  impact: ''
  references: []
  page_start: 94
  audit_raw: "Perform the following to verify that the result is as recommended:\n# ls /etc/cron.d/cron.deny\n/etc/cron.d/cron.deny:\
    \ No such file or directory\n# ls /etc/cron.d/at.deny\n/etc/cron.d/at.deny: No such file or directory\n# cat /etc/cron.d/cron.allow\n\
    root\n# wc -l /etc/cron.d/at.allow | awk '{ print $1 }'\n 0"
  remediation: 'Perform the following to implement the recommended state:

    # mv /etc/cron.deny /etc/cron.deny.cis

    # mv /etc/at.deny /etc/at.deny.cis

    # echo root > /etc/cron.allow

    # cp /dev/null at.allow

    # chown root:root cron.allow at.allow

    # chmod 400 cron.allow at.allow

    Note that the root/superuser is always allowed to use the at command and is not

    required to be specifically listed in at.allow.'
  checks:
  - type: manual_review
    info: "Perform the following to verify that the result is as recommended:\n# ls /etc/cron.d/cron.deny\n/etc/cron.d/cron.deny:\
      \ No such file or directory\n# ls /etc/cron.d/at.deny\n/etc/cron.d/at.deny: No such file or directory\n# cat /etc/cron.d/cron.allow\n\
      root\n# wc -l /etc/cron.d/at.allow | awk '{ print $1 }'\n 0"
    severity: medium
- id: '6.4'
  title: Set Default Screen Lock for GNOME Users
  scoring: scored
  profile:
  - Level 1
  description: The timeout parameter dictates the invocation of a password-protected screen saver after a specified time of
    keyboard and mouse inactivity, specific to the xscreensaver application used in the GNOME windowing environment.
  rationale: As a screensaver timeout provides protection for a desktop that has not been locked by the user upon his/her
    departure, to help prevent session hijacking, this value should be set as appropriate to the needs of the user.
  impact: ''
  references: []
  page_start: 96
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # cd /usr/share/X11/app-defaults

    # grep "^\*timeout:" XScreenSaver

    *timeout: 0:10:00

    # grep "^\*lockTimeout:" XScreenSaver

    *lockTimeout: 0:00:00

    # grep "^\*lock:" XScreenSaver

    *lock: True'
  remediation: 'Perform the following to implement the recommended state:

    # cd /usr/share/X11/app-defaults

    # cp XScreenSaver XScreenSaver.orig

    # awk ''/^\*timeout:/ { $2 = "0:10:00" } /^\*lockTimeout:/ { $2 = "0:00:00" }

    /^\*lock:/ { $2 = "True" } { print }'' xScreenSaver > xScreenSaver.CIS

    # mv xScreenSaver.CIS xScreenSaver'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # cd /usr/share/X11/app-defaults

      # grep "^\*timeout:" XScreenSaver

      *timeout: 0:10:00

      # grep "^\*lockTimeout:" XScreenSaver

      *lockTimeout: 0:00:00

      # grep "^\*lock:" XScreenSaver

      *lock: True'
    severity: medium
- id: '6.5'
  title: Remove Autologin Capabilities from the GNOME desktop
  scoring: scored
  profile:
  - Level 1
  description: The GNOME Display Manager is used for login session management. See the manual page gdm(1) for more information.
    By default, GNOME automatic login is defined in /etc/pam.d/gdm-autologin to allow users to access the system without a
    password.
  rationale: As automatic logins are a known security risk for other than "kiosk" types of systems, GNOME automatic login
    should be disabled in /etc/pam.d/gdm-autologin.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'Ensure there are no uncommented gdm-autologin lines in /etc/pam.d/gdm-autologin:

    # egrep "auth|account" /etc/pam.d/gdm-autologin | grep -vc ^#

    0

    If the command returns other than "0", this is a finding.'
  remediation: 'Comment out or remove all lines from /etc/pam.d/gdm-autologin:

    # cp /etc/pam.d/gdm-autologin /etc/pam.d/gdm-autologin.orig

    # awk ''{ if ( $1 ~ /auth/ || $1 ~ /account/) $1 = "#"$1 } { print };''

    /etc/pam.d/gdm-autologin > /etc/pam.d/gdm-autologin.CIS

    # cp /etc/pam.d/gdm-autologin.CIS /etc/pam.d/gdm-autologin'
  checks:
  - type: command
    command: '# egrep "auth|account" /etc/pam.d/gdm-autologin | grep -vc ^#'
    expected: ''
    severity: medium
    info: 'Ensure there are no uncommented gdm-autologin lines in /etc/pam.d/gdm-autologin:

      # egrep "auth|account" /etc/pam.d/gdm-autologin | grep -vc ^#

      0

      If the command returns other than "0", this is a finding.'
- id: '6.6'
  title: Set Delay between Failed Login Attempts to 4
  scoring: scored
  profile:
  - Level 1
  description: The SLEEPTIME variable in the /etc/default/login file controls the number of seconds to wait before printing
    the "login incorrect" message when a bad password is provided. The default value for SLEEPTIME is 4 seconds.
  rationale: As an immediate return of an error message, coupled with the capability to try again may facilitate automatic
    and rapid-fire brute-force password attacks by a malicious user, this delay time should be set as appropriate to the needs
    of the user.
  impact: ''
  references: []
  page_start: 99
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # grep "^SLEEPTIME=" /etc/default/login

    SLEEPTIME=4

    If SLEEPTIME entry is commented out, this is also considered a passing state as the

    default value for SLEEPTIME is 4 seconds.'
  remediation: 'Perform the following to implement the recommended state:

    # cd /etc/default

    # cp login login.orig

    # awk ''/SLEEPTIME=/ { $1 = "SLEEPTIME=4" } { print }'' login > login.CIS

    # mv login.CIS login'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # grep "^SLEEPTIME=" /etc/default/login

      SLEEPTIME=4

      If SLEEPTIME entry is commented out, this is also considered a passing state as the

      default value for SLEEPTIME is 4 seconds.'
    severity: medium
- id: '6.7'
  title: Disable Rhost-based Authentication for SSH
  scoring: scored
  profile:
  - Level 1
  description: The IgnoreRhosts parameter specifies that existing .rhosts and .shosts files, which may apply to application
    rather than user logins, will not be used in RhostsRSAAuthentication or HostbasedAuthentication.
  rationale: Setting this parameter forces users to enter a password when authenticating with SSH.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # grep "^IgnoreRhosts" /etc/ssh/sshd_config

    IgnoreRhosts yes

    If the IgnoreRhosts line does not exist in the file, the default setting of Yes is

    automatically applied.'
  remediation: 'Perform the following to implement the recommended state:

    # awk ''/^IgnoreRhosts/ { $2 = "yes" } { print }'' /etc/ssh/sshd_config >

    /etc/ssh/sshd_config.CIS

    # mv /etc/ssh/sshd_config.CIS /etc/ssh/sshd_config

    # svcadm restart svc:/network/ssh

    This action will only set the IgnoreRhosts line if it already exists in the file to ensure that

    it is set to the proper value. If the IgnoreRhosts line does not exist in the file, the default

    setting of Yes is automatically used, so no additional changes are needed.'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

      # grep "^IgnoreRhosts" /etc/ssh/sshd_config

      IgnoreRhosts yes

      If the IgnoreRhosts line does not exist in the file, the default setting of Yes is

      automatically applied.'
    severity: medium
- id: '6.8'
  title: Restrict FTP Use
  scoring: scored
  profile:
  - Level 1
  description: If FTP is permitted to be used on the system, the file /etc/ftpd/ftpusers is used to specify a list of users
    who are not allowed to access the system via FTP.
  rationale: FTP is an old and insecure protocol that transfers files and credentials in clear text and can be replaced by
    using sftp. However, if FTP is permitted for use in your environment, it is important to ensure that the default "system"
    accounts are not permitted to transfer files via FTP, especially the root role. Consider also adding the names of other
    privileged or shared accounts that may exist on your system such as user oracle and the account which your Web server
    process runs under. It should be reminded that the Solaris FTP service is disabled by default.
  impact: ''
  references: []
  page_start: 103
  audit_raw: "Perform the following to verify that the result is as recommended:\n# for user in `logins -s | awk '{ print\
    \ $1 }'` aiuser noaccess nobody\nnobody4; do\n grep -w \"${user}\" /etc/ftpd/ftpusers >/dev/null 2>&1\n if [ $? != 0 ];\
    \ then\n echo \"User '${user}' not in /etc/ftpd/ftpusers.\"\n fi\ndone\n(No output should be returned.)"
  remediation: 'Perform the following to implement the recommended state:

    # cd /etc/ftpd

    # cp ftpusers ftpusers.orig

    # for user in `logins -s | awk ''{ print $1 }''` aiuser noaccess nobody

    nobody4; do

    $(echo $user >> ftpusers)

    done

    # sort -u ftpusers > ftpusers.CIS

    # mv ftpusers.CIS ftpusers

    If your site policy states that users have to be authorized to use FTP, consider placing

    all users in the /etc/ftpd/ftpusers file and then explicitly removing those who are

    permitted to use the service. To accomplish this, use the command:

    # getent passwd | cut -f1 -d":" > /etc/ftpd/ftpusers

    This prohibits any user on the system from using ftp unless they are explicitly removed

    from the file. Note that this file will need to be updated as users are added to or

    removed from the system.'
  checks:
  - type: command
    command: grep -w "${user}" /etc/ftpd/ftpusers >/dev/null 2>&1
    expected: 'Perform the following to verify that the result is as recommended:'
    severity: medium
    info: "Perform the following to verify that the result is as recommended:\n# for user in `logins -s | awk '{ print $1\
      \ }'` aiuser noaccess nobody\nnobody4; do\n grep -w \"${user}\" /etc/ftpd/ftpusers >/dev/null 2>&1\n if [ $? != 0 ];\
      \ then\n echo \"User '${user}' not in /etc/ftpd/ftpusers.\"\n fi\ndone\n(No output should be returned.)"
- id: '6.9'
  title: Disable root login for SSH
  scoring: scored
  profile:
  - Level 1
  description: The PermitRootLogin value (in /etc/ssh/sshd_config) allows for direct root login by a remote user/application
    to resources on the local host.
  rationale: By default, it is not possible for the root account to log directly into the system console because the account
    is configured as a role. This setting therefore does not significantly alter the security posture of the system unless
    the root account is changed from this default and configured to be a normal user.
  impact: ''
