- id: '2.8'
  title: Disable NIS Client Services
  scoring: scored
  profile:
  - Level 1
  description: If the local site is not using the NIS naming service to distribute system and user configuration information,
    this service may be disabled. This service is disabled by default unless the NIS service has been installed and configured
    on the system.
  rationale: As RPC-based services such as NIS may use non-secure authentication and share sensitive network object information
    with systems and applications using RPC-based service, NIS client daemons should be disabled. Users are encouraged to
    use LDAP as a name service in place of NIS.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Perform the following and verify that the result is as shown:

    # svcs -Ho state svc:/network/nis/client

    disabled

    If LDAP is not in use check that nis/domain is also disabled:

    # svcs -Ho state svc:/network/nis/domain

    disabled

    If the service is not installed, this will return an error, or no output. This is also

    considered a passing state.'
  remediation: 'To disable this service, run the following commands:

    # svcadm disable svc:/network/nis/client

    Check to see if LDAP Client is in use:

    # svcs -a | grep ldap | awk -F" " ''{if ($1 ~ /disabled/ && $3 ~ /client/)

    print "LDAP Client is disabled - svc:/network/nfs/domain can be disabled.";}''

    If LDAP is not in use also disable nis/domain:

    # svcadm disable svc:/network/nis/domain'
  checks:
  - type: manual_review
    info: 'Perform the following and verify that the result is as shown:

      # svcs -Ho state svc:/network/nis/client

      disabled

      If LDAP is not in use check that nis/domain is also disabled:

