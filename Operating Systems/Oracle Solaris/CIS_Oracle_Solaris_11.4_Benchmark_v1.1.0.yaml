    /etc/ssh/sshd_config.CIS

    # mv /etc/ssh/sshd_config.CIS /etc/ssh/sshd_config

    # svcadm restart svc:/network/ssh'
  checks:
  - type: manual_review
    info: 'Perform the following to verify that the result is as recommended:

