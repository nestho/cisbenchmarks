    severity: medium
- id: '9.23'
  title: Find Un-owned Files and Directories
  scoring: scored
  profile:
  - Level 1
  description: Sometimes when administrators delete users from the password file they neglect to remove all files owned by
    those users from the system.
  rationale: A new user who is assigned the deleted user's user ID or group ID may then end up "owning" these files, and thus
    have more access on the system than was intended.
  impact: ''
  references: []
  page_start: 174
  audit_raw: 'Perform the following to verify that the result is as recommended:

    # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs -o -fstype ctfs

    -o -fstype mntfs -o -fstype objfs -o -fstype proc \) -prune -o \( -nouser -o

    -nogroup \) -ls

    No output should be returned.

    Note: The script above does a transversal of all files under the "/" directory, including

    NFS attached file systems, so running this search command may take quite some time.

    Additionally false positives may be returned in /zones/ when run in the global zone.'
  remediation: 'Correct or justify any items discovered in the Audit step. Determine the existence of any

    files that are not attributed to current users or groups on the system, and determine the

    best course of action in accordance with site policy. Note that the Solaris OS is shipped

