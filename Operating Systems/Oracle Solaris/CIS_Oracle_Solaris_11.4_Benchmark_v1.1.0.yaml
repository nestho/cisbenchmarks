- id: '9.2'
  title: Check for Duplicate User Names
  scoring: scored
  profile:
  - Level 1
  description: Although the useradd program will not let you create a duplicate user name, it is possible for an administrator
    to manually modify passwd(4) and change the user name.
  rationale: If a user is assigned a duplicate user name, it will create and have access to files with the first UID for that
    username in passwd(4). For example, if "test4" has a UID of 1000 and a subsequent "test4" entry has a UID of 2000, logging
    in as "test4" will use UID 1000. Effectively, the UID is shared, which is a potential security problem.
  impact: ''
  references: []
  page_start: 144
  audit_raw: "Perform the following to verify that the result is as recommended:\n# getent passwd | cut -f1 -d\":\" | sort\
    \ -n | uniq -c | while read x ; do\n [ -z \"${x}\" ] && break\n set - $x\n if [ $1 -gt 1 ]; then\n gids=`getent passwd\
    \ | nawk -F: '($1 == n) { print $3 }' n=$2 |\nxargs`\n echo \"Duplicate User Name ($2): ${gids}\"\n fi\n done\n(No output\
    \ should be returned.)"
  remediation: 'Correct or justify any items discovered in the Audit step. Determine if there are any

    duplicate user names, and work with their respective owners to determine the best

    course of action in accordance with site policy.'
  checks:
  - type: manual_review
    info: "Perform the following to verify that the result is as recommended:\n# getent passwd | cut -f1 -d\":\" | sort -n\
      \ | uniq -c | while read x ; do\n [ -z \"${x}\" ] && break\n set - $x\n if [ $1 -gt 1 ]; then\n gids=`getent passwd\
