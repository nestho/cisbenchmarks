- id: '9.17'
  title: Check for Duplicate GIDs
  scoring: scored
  profile:
  - Level 1
  description: Although the groupadd program will not let you create a duplicate Group ID (GID), it is possible for an administrator
    to manually modify group and change the GID field.
  rationale: User groups must be assigned unique GIDs for accountability and to ensure appropriate access protections.
  impact: ''
  references: []
