- id: 2.6.1
  title: Secure row access using row permission
  scoring: manual
  profile:
  - Level 1
  description: A row permission defines a row access control rule that specifies the conditions under which a user, group,
    or role can access rows of data in a table. It is recommended to enable row permission for tables that contain sensitive
    data and allow access to users according to your organization’s security and database access policies. Also, review the
    access control rule regularly for gaps.
  rationale: Lack of row permission controls can allow all authorized users access to all the rows in the table. This lack
    of control can increase the risk of privacy concerns with your organization’s protected data.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=masks-row-permission
  page_start: 157
  audit_raw: 'Issue the following SQL statement and review the output to verify that the row

    permissions are enabled and that they comply with your organization’s existing security

    policy:

    SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''R'';'
  remediation: 'Issue the SQL CREATE PERMISSION statement to create a row permission for row access

    control according to your organization''s policy. Issue the SQL ALTER TABLE statement

    with the ACTIVATE ROW ACCESS CONTROL option to activate the row permissions.'
  checks:
  - type: sql
    command: SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = 'R';
    severity: medium
    info: 'Issue the following SQL statement and review the output to verify that the row

      permissions are enabled and that they comply with your organization’s existing security

      policy:

      SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''R'';'
- id: 2.6.2
  title: Secure column values using column mask
  scoring: manual
  profile:
  - Level 1
  description: A column mask defines a column access control rule that specifies the conditions under which a user, group,
    or role can receive the masked values that are returned for a column. Enabling column masking is recommended for tables
    that contain sensitive data to mask out column values that are returned, according to your organization’s security and
    database access policies. Also, review the access control rule regularly for gaps.
  rationale: Lack of masking the column values can allow all authorized users access to all the column values in the table.
    This lack of control can increase the risk of privacy violations with your organization’s protected data.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=masks-column-mask
  page_start: 158
  audit_raw: 'Issue the following SQL statement and review the output to verify that column masks

    are enabled and that they comply with your organization’s existing security policy:

    SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''M'';'
  remediation: 'Issue the SQL CREATE MASK statement to create a column mask for column access

    control according to your organization''s policy. Issue the SQL ALTER TABLE statement

    with the ACTIVATE COLUMN ACCESS CONTROL option to activate the column masks.'
  checks:
  - type: sql
    command: SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = 'M';
    severity: medium
    info: 'Issue the following SQL statement and review the output to verify that column masks

      are enabled and that they comply with your organization’s existing security policy:

      SELECT * FROM SYSIBM.SYSCONTROLS WHERE CONTROL_TYPE = ''M'';'
- id: 3.1.1
  title: Ensure that audit tracing is enabled during Db2 start up
  scoring: manual
  profile:
  - Level 1
  description: 'It is recommended that audit traces that are critical for protecting the security of the system and data should
    be specified to start during Db2 start up. You can specify that audit traces are started during Db2 start up by using
    either of the following options:  Specifying the audit classes by using the AUDIT TRACE subsystem parameter  Defining
    audit policies by specifying a SYSAUDITPOLICIES – DB2START column value of ‘Y’, ‘S’, or ‘T’'
  rationale: Enabling audit traces to audit critical information is crucial for securing and discovering issues within your
    databases. Lack of critical audit data can cause issues to go undiscovered. Lack of audit tracing might prevent you from
    providing proof of compliance with security laws, regulations, and other requirements.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-sysauditpolicies
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=policy-creating-activatingaudit-policies
  page_start: 161
  audit_raw: '1. Run the DSNTEJ6Z job to obtain the current value of the AUDITST subsystem

    parameter. Verify that the value is set to the list of classes that are required to be

    started during Db2 start up.

    2. Issue the following SQL statement to verify whether the required audit policies

    are defined to be started during Db2 start up:

    SELECT * FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN (''Y'',''S'',''T'');'
  remediation: '1. Edit the DSNTIJUZ job and set the DSN6SYSP.AUDITST subsystem parameter to

    the required list of classes. Submit DSNTIJUZ to assemble the subsystem

    parameter. The specified list of classes will be automatically started during Db2

    restart.

    2. Define new audit policies or update existing audit policies to start automatically

    during Db2 start up by specifying the DB2START column value of ‘Y’, ‘S’, or ‘T’.'
  checks:
  - type: sql
    command: SELECT * FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN ('Y','S','T');
    severity: medium
    info: '1. Run the DSNTEJ6Z job to obtain the current value of the AUDITST subsystem

      parameter. Verify that the value is set to the list of classes that are required to be

      started during Db2 start up.

      2. Issue the following SQL statement to verify whether the required audit policies

      are defined to be started during Db2 start up:

      SELECT * FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN (''Y'',''S'',''T'');'
- id: 3.1.2
  title: Ensure that critical audit traces are always enabled
  scoring: manual
  profile:
  - Level 1
  description: Audit traces that are critical for protecting the security of the system and data should not be stopped without
    special permission from an external security product such as RACF or without using security administrator authority. Tamper-proof
    audit policies, which require special authorization from an external security product such as RACF to modify or stop,
    are provided for this purpose. They are identified as having the DB2START column as 'T' in the SYSAUDITPOLICIES table.
    Secure audit policies are another type of audit policy that can be stopped only by the SECADM authority. They are identified
    as having the DB2START column as 'S' in the SYSAUDITPOLICIES table. Both the tamper-proof and secure policies are started
    automatically during Db2 start up.
  rationale: If critical audit policies are stopped, important audit data could be lost. It’s crucial that these policies
    can be stopped or modified only by a user with the required permission to the audit policy profile in an external security
    product, such as RACF or the SECADM authority. Loss of critical audit data can put the processing environment and organizational
    data at risk.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=db2-audit-policy
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-sysauditpolicies
  page_start: 163
  audit_raw: 'Issue the following SQL statement to verify that tamper-proof or secure audit policies

    are defined to audit critical data:

    SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN

    (''T'',''S'');'
  remediation: 'According to your organization''s policies, define new audit policies or update existing

    audit policies to be defined as secure or tamper-proof by specifying the DB2START

    column value of ‘S’, or ‘T’. For tamper-proof audit policies, perform additional steps in

    RACF, as required.'
  checks:
  - type: sql
    command: SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN
    severity: medium
    info: 'Issue the following SQL statement to verify that tamper-proof or secure audit policies

      are defined to audit critical data:

      SELECT AUDITPOLICYNAME FROM SYSIBM.SYSAUDITPOLICIES WHERE DB2START IN

      (''T'',''S'');'
- id: 3.1.3
  title: Ensure that authorization failures are audited
  scoring: manual
  profile:
  - Level 1
  description: Audit trace CLASS 1 (IFCID140) audits access attempts that were denied due to inadequate authorization. If
    this audit traces is not enabled, issues can go undiscovered, and compromises and other incidents can occur without being
    quickly detected.
  rationale: Auditing authorization failures can help detect unauthorized activities quickly to avoid system or data being
    compromised. Undetected failed authorization attempts can increase risk to the system and data.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=commands-display-trace-db2
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=trace-audit-classes
  page_start: 165
  audit_raw: 'Display the IFCID140 trace:

    -DISPLAY TRACE (AUDIT)

    Review the output to make sure IFCID140 trace is enabled.'
  remediation: 'Enable IFCID140 trace either by issuing the START TRACE command or through the audit

    policy CHECKING category.'
  checks:
  - type: manual_review
    info: 'Display the IFCID140 trace:

      -DISPLAY TRACE (AUDIT)

      Review the output to make sure IFCID140 trace is enabled.'
    severity: medium
- id: 3.1.4
  title: Enable audit policies to audit installation system administrator and system operator access
  scoring: manual
  profile:
  - Level 1
  description: Installation system administrators and installation system operators perform Db2 installation and migration.
    The installation system administrator role also includes most of the administrative authority, which can perform important
    tasks such as starting and stopping Db2, controlling traces, accessing all data, and granting and revoking privileges
    from other users.
  rationale: Auditing tasks performed by an installation system administrator and installation system operator can help detect
    unauthorized or malicious activities intended to do harm to Db2 data or the processing environment. Tasks performed by
    the installation system administrator or installation system operator could impact the Db2 system and organization data.
    Such activities must be closely monitored.
