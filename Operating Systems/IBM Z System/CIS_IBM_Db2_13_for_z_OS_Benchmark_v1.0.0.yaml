- id: 2.2.2
  title: Ensure that access to SYSIBM.SYSAUDITPOLICIES is restricted
  scoring: manual
  profile:
  - Level 1
  description: The SYSIBM.SYSAUDITPOLICIES table contains all audit policies. PUBLIC should be restricted from accessing this
    table.
  rationale: Exposing sensitive information about the auditing security on Db2 servers can compromise security. Access to
    the audit policies can enable attackers to avoid detection.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-sysauditpolicies
  page_start: 50
  audit_raw: 'For Db2 internal security users:

    Issue the following SQL statement to check if PUBLIC has access:

    SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND

    TTNAME = ''SYSAUDITPOLICIES'' AND GRANTEE = ''PUBLIC'';

    Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC

    has SELECT privilege and the remediation steps should be followed.

    For external security users:

    Issue the RACF RLIST command to list the profile that controls access to the

    SYSIBM.SYSAUDITPOLICIES table in the MDSNTB class. Examine the universal

    access (UACC) and user (USER) settings for the profile that controls access to the

    SYSIBM.SYSAUDITPOLICIES table. If the UACC setting is READ or the USER setting is

    *, consult with your security administrator for the proper value and follow the

    remediation steps.'
  remediation: 'For Db2 internal security users:

    Issue the following SQL statement to revoke access from PUBLIC:

    REVOKE ALL ON SYSIBM.SYSAUDITPOLICIES FROM PUBLIC;

    For external security users:

     Issue the RACF RALTER command to update the profile and change the UACC

    setting to NONE.

     Issue the RACF PERMIT command to remove the ID(*) and specify users or

    groups.'
  checks:
  - type: sql
    command: SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = 'SYSIBM' AND
    severity: medium
    info: 'For Db2 internal security users:

