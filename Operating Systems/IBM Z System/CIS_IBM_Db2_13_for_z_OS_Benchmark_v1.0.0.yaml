  rationale: PUBLIC should not have access to a table holding the LOB data. Exposing LOB data can enable attackers to gain
    access to your organization's data.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-sysroutinestext
  page_start: 90
  audit_raw: 'For Db2 internal security users:

    Issue the following SQL statement to check if PUBLIC has access:

    SELECT GRANTEE FROM SYSIBM.SYSTABAUTH WHERE TCREATOR = ''SYSIBM'' AND

    TTNAME = ''SYSROUTINESTEXT'' AND GRANTEE = ''PUBLIC'';

    Output that contains zero rows is considered a successful finding. Otherwise, PUBLIC

    has SELECT privilege and the remediation steps should be followed.

    For external security users:

    Issue the RACF RLIST command to list the profile that controls access to the

    SYSIBM.SYSROUTINESTEXT table in the MDSNTB class. Examine the universal

    access (UACC) and user (USER) settings for the profile that controls access to the

    SYSIBM.SYSROUTINESTEXT table. If the UACC setting is READ or the USER setting is

    *, consult with your security administrator for the proper value and follow the

    remediation steps.'
  remediation: 'For Db2 internal security users:

    Issue the following SQL statement to revoke access from PUBLIC:

    REVOKE ALL ON SYSIBM.SYSROUTINESTEXT FROM PUBLIC;

    For external security users:

     Issue the RACF RALTER command to update the profile and change the UACC

    setting to NONE.

     Issue the RACF PERMIT command to remove the ID(*) and specify users or

    groups.'
