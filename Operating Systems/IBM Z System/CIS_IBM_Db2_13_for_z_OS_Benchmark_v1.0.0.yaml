- id: 2.2.1
  title: Ensure that access to the catalog tables in the communications database (CDB) is restricted
  scoring: manual
  profile:
  - Level 1
  description: 'The communications database (CDB) is a set of Db2 catalog tables that can be configured to control aspects
    of outbound and inbound connection requests. The SYSIBM.LOCATIONS table and SYSIBM.USERNAMES table are configured for
    using TCP/IP or SNA protocol. The following tables are configured specifically to use TCP/IP protocol:  SYSIBM.IPLIST
     SYSIBM.IPNAMES The following tables are configured specifically to use SNA protocol:  SYSIBM.LULIST  SYSIBM.LUMODES
     SYSIBM.LUNAMES  SYSIBM.MODESELECT PUBLIC should be restricted from inserting, updating, deleting, or accessing these
    tables. Note: VTAM (SNA connection) is deprecated. You can disable SNA connections by setting IPNAMES in the bootstrap
    data set (BSDS).'
  rationale: PUBLIC access to these tables exposes connection information for remote Db2 access, which can compromise the
    security of the server.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-locations
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=tables-usernames
  page_start: 47
  audit_raw: "For Db2 internal security users:\nIssue the following SQL statement to check if PUBLIC has access:\nSELECT GRANTEE,\
    \ TCREATOR, TTNAME FROM SYSIBM.SYSTABAUTH\nWHERE TCREATOR = 'SYSIBM' AND\nTTNAME IN ('LOCATIONS', 'IPNAMES', 'IPLIST',\
    \ 'LUNAMES', 'LULIST',\n 'LUMODES', 'MODESELECT', 'USERNAMES')\nAND GRANTEE = 'PUBLIC';\nOutput that contains zero rows\
    \ is considered a successful finding. Otherwise, PUBLIC\nhas SELECT, INSERT, UPDATE, or DELETE privilege and the remediation\
    \ steps\nshould be followed.\nFor external security users:\nIssue the RACF RLIST command to list the profiles that control\
    \ access to the tables in\nthe communications database in the MDSNTB class. Examine the universal access\n(UACC) and user\
    \ (USER) settings for the profiles that control access to the\ncommunications database tables. If the UACC setting is\
    \ READ or the USER setting is *,\nconsult with your security administrator for the proper value and follow the remediation\n\
    steps."
  remediation: 'For Db2 internal security users:

    Issue the SQL REVOKE statement to revoke access from PUBLIC.

    For external security users:

     Issue the RACF RALTER command to update the profiles and change the UACC

    setting to NONE.

     Issue the RACF PERMIT command to remove the ID(*) and specify users or

    groups.'
