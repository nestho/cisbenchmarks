controls:
- id: 1.1.1
  title: Ensure that Db2 system data sets are protected
  scoring: manual
  profile:
  - Level 1
  description: 'The Db2 data sets that contain system and configuration information, and log data must be protected from unauthorized
    modifications or deletions. These data sets can be accessed outside of Db2. It is recommended that the following Db2 data
    sets are protected in RACF: - HLQ.SDSNLOAD - HLQ.SDSNLOD2 - HLQ.SDSNEXIT - HLQ.DSNDBC.* - HLQ.DSNDBD.* - HLQ.BSDS* - HLQ.LOGCOPY*
    - HLQ.ARCHLOG* - SYS1.PROCLIB Note: HLQ is the high-level qualifier. The RACF protection profile must have the following
    characteristics: - UACC(NONE) - No ID(*) on the access list - Not in WARNING mode - READ access permitted only to users
    who are required to have access'
  rationale: Failure to properly restrict access to the Db2 system and log data sets can result in a loss of system integrity
    or data.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'For each data set on the protection list, issue the following RACF commands to

    determine the protection profiles in place and evaluate access control to those

    resources.

    LISTDSD DATASET(‘<dataset name>’)'
  remediation: '1. Create a protection profile for each of the data set in the list above.

    2. Specify UACC(NONE) or no ID(*) to prevent universal access.

    3. Permit READ, ALTER, CONTROL access based on roles and responsibilities

    and conform to least access needed.

    For example, issue the following RACF commands to create generic profiles for active

    log data sets and assign access control to Db2 started tasks.

    ADDSD ''DSNC000.LOGCOPY*'' UACC(NONE)

    PERMIT ''DSNC000.LOGCOPY*'' ID(SYSDSP) ACCESS(ALTER)'
  checks:
  - type: manual_review
    info: 'For each data set on the protection list, issue the following RACF commands to

      determine the protection profiles in place and evaluate access control to those

      resources.

      LISTDSD DATASET(‘<dataset name>’)'
    severity: medium
- id: 1.1.2
  title: Ensure that Db2 USS file system is protected
  scoring: manual
  profile:
  - Level 1
  description: The USS file system that contains Db2 product code, such as the IBM Data Server Driver for JDBC and SQLJ, Db2
    supplied Java classes, Db2 Java stored procedures support code, and native DLL libraries must be protected from unauthorized
    modifications or deletions. The Db2 product code files are installed and stored under the default pathname, /usr/lpp/db2x10,
    where ‘x’ is the release indicator.
  rationale: The USS file systems that contain system and product code must be restricted to authorized personnel and audited.
    Failure to protect can result in a loss of system services.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Starting with the directory with pathname /usr/lpp/db2x10 (where ‘x’ represents the

    release indicator) and for each of the sub-directories, issue the following command to

    review the directory and file permissions.

    ls -l [pathname]'
  remediation: Issue the chmod command to change the access permission as needed.
  checks:
  - type: command
    command: ls -l [pathname]
    expected: ''
    severity: medium
    info: 'Starting with the directory with pathname /usr/lpp/db2x10 (where ‘x’ represents the

      release indicator) and for each of the sub-directories, issue the following command to

      review the directory and file permissions.

      ls -l [pathname]'
- id: 1.1.3
  title: Secure installation process
  scoring: manual
  profile:
  - Level 1
  description: The installation SYSOPR authority can be used for the installation and migration of a Db2 subsystem. The installation
    SYSOPR authority is not allowed access to nonsystem objects or user data in the subsystem.
  rationale: Using the installation SYSOPR authority instead of the installation SYSADM authority prevents unauthorized access
    to user objects during installation or migration.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=13-required-authorizationinstallation-migration
  page_start: 18
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current values of the SYSTEM OPERATOR 1, SYSTEM

    OPERATOR 2 subsystem parameters. Verify that one of the authorization IDs that is used

    for installation or migration has the installation SYSOPR authority.'
  remediation: '1. Edit the DSNTIJUZ job and modify the values for the SYSTEM OPERATOR 1 or

    SYSTEM OPERATOR 2 subsystem parameter as needed.

    2. Submit DSNTIJUZ to assemble the subsystem parameter.

    3. Issue the -SET SYSPARM command or stop and restart Db2 for the change to take

    effect.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current values of the SYSTEM OPERATOR 1, SYSTEM

      OPERATOR 2 subsystem parameters. Verify that one of the authorization IDs that is used

      for installation or migration has the installation SYSOPR authority.'
    severity: medium
- id: 1.2.1
  title: Ensure that RACF changes are accepted immediately
  scoring: manual
  profile:
  - Level 1
  description: The AUTHEXIT_CACHEREFRESH subsystem parameter refreshes the global authentication cache entries for user profile
    changes in RACF and authorization cache entries for external security users for resource and user profile changes. It
    is recommended that this security subsystem parameter is set to ALL.
  rationale: Removing the cache entries prevents users whose profiles are changed in RACF from accessing Db2 resources.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=dpp-auth-exit-cache-refrauthexit-cacherefresh-subsystem-parameter
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=samples-job-dsntej6z
  page_start: 20
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current value of the AUTHEXIT_CACHEREFRESH

    subsystem parameter. Verify that the value is set to ALL.'
  remediation: '1. Edit the DSNTIJUZ job and set the DSN6SPRM.AUTHEXIT_CACHEREFRESH parameter

    to ALL.

    2. Submit DSNTIJUZ to assemble the subsystem parameter.

    3. Stop and restart Db2 for the change to take effect.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current value of the AUTHEXIT_CACHEREFRESH

      subsystem parameter. Verify that the value is set to ALL.'
    severity: medium
- id: 1.2.2
  title: Ensure that authorization is enabled
  scoring: manual
  profile:
  - Level 1
  description: The AUTH subsystem parameter controls authorization checking in Db2. It is recommended that this parameter
    is set to YES.
  rationale: Disabling all authorization checking opens all Db2 access to PUBLIC.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=panel-use-protection-fieldauth-subsystem-parameter
  page_start: 22
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current value of the AUTH subsystem parameter.

    Verify that the value is set to YES.'
  remediation: '1. Edit the DSNTIJUZ job and set the DSN6SPRM.AUTH parameter to YES.

    2. Submit DSNTIJUZ to assemble the subsystem parameter.

    3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the change.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current value of the AUTH subsystem parameter.

      Verify that the value is set to YES.'
    severity: medium
- id: 1.2.3
  title: Ensure that the default authorization IDs are changed from the installation defined
  scoring: manual
  profile:
  - Level 1
  description: The following subsystem parameters specify default authorization IDs. It Is recommended to change the installation-specified
    default values and ensure the authorization IDs are defined in RACF.  SYSTEM ADMIN 1 – Specifies the first of two authorization
    IDs to which installation SYSADM authority is assigned.  SYSTEM ADMIN 2 - Specifies the second of two authorization IDs
    to which installation SYSADM authority is assigned.  SYSTEM OPERATOR 1 - Specifies the first of two authorization IDs
    to which installation SYSOPR authority is assigned.  SYSTEM OPERATOR 2 - Specifies the second of two authorization IDs
    to which installation SYSOPR authority is assigned.  SECURITY ADMIN 1 - Specifies the first of two authorization IDs
    or roles to which security administrator authority is assigned.  SECURITY ADMIN 2 - Specifies the second of two authorization
    IDs or roles to which security administrator authority is assigned.  UNKNOWN AUTHID – Specifies the authorization ID
    that is to be used if RACF is not available for batch access and USER= is not specified in the JOB statement.
  rationale: The installation default settings are often well known and can make the system vulnerable to attacks.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=session-dsntipp1-protectionpanel-2
  page_start: 23
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current values of the SYSTEM ADMIN 1, SYSTEM

    ADMIN 2, SYSTEM OPERATOR 1, SYSTEM OPERATOR 2, SECURITY ADMIN 1, SECURITY ADMIN

    2, and UNKNOWN AUTHID subsystem parameters. Verify that the default values are

    changed.'
  remediation: '1. Edit the DSNTIJUZ job and set the default values for SYSTEM ADMIN 1, SYSTEM

    ADMIN 2, SYSTEM OPERATOR 1, SYSTEM OPERATOR 2, SECURITY ADMIN 1, SECURITY

    ADMIN 2, and UNKNOWN AUTHID subsystem parameters.

    2. Submit DSNTIJUZ to assemble the subsystem parameters.

    3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the

    changes.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current values of the SYSTEM ADMIN 1, SYSTEM

      ADMIN 2, SYSTEM OPERATOR 1, SYSTEM OPERATOR 2, SECURITY ADMIN 1, SECURITY ADMIN

      2, and UNKNOWN AUTHID subsystem parameters. Verify that the default values are

      changed.'
    severity: medium
- id: 1.2.4
  title: Ensure that generic error codes are returned for remote security errors
  scoring: manual
  profile:
  - Level 1
  description: The EXTSEC subsystem parameter specifies whether detailed reason codes are returned to a DRDA client when a
    DDF connection request fails due to security errors. It is recommended to set the value to NO to return generic error
    codes to the clients.
  rationale: The detailed error codes can expose the reason for a potential fraudulent logon attempt.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=2-extended-security-fieldextsec-subsystem-parameter
  page_start: 25
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current value of the EXTSEC subsystem parameter.

    Verify that the value is set to NO.'
  remediation: '1. Edit the DSNTIJUZ job and set the DSN6SYSP.EXTSEC parameter to NO.

    2. Submit DSNTIJUZ to assemble the subsystem parameter.

    3. Issue the -SET SYSPARM command or stop and restart Db2 to activate the change.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current value of the EXTSEC subsystem parameter.

      Verify that the value is set to NO.'
    severity: medium
- id: 1.2.5
  title: Separate security administration from system administration
  scoring: manual
  profile:
  - Level 1
  description: The SEPARATE_SECURITY subsystem parameter allows you to separate security administrator duties from the Db2
    system administrator duties when using native Db2 authorization. It is recommended to set SEPARATE_SECURITY=YES. When
    SEPARATE_SECURITY is set to YES, SECADM authority is required for security administration. Db2 authorization that uses
    an external security mechanism for access control separates security administration from Db2 system administration.
  rationale: Separating security administration from system administration enforces separation of duties. It can help simplify
    system administration and strengthen security administration.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=2-separate-security-fieldseparate-security-subsystem-parameter
  page_start: 26
  audit_raw: 'Run the DSNTEJ6Z job to obtain the current value of the SEPARATE_SECURITY subsystem

    parameter. Verify that the value is set to YES.'
  remediation: '1. Ensure that the current SQLID is one of the authorization IDs of the process for

    applications that use SYSADM authority to set current SQLID.

    2. Ensure that the binder has BINDAGENT privilege from the owner for the bind

    and rebind processes that use SYSADM, SYSCTRL, or system DBADM authority

    to specify the OWNER keyword.

    3. Edit the DSNTIJUZ job and set the DSN6SPRM.SEPARATE_SECURITY parameter to

    YES.

    4. Submit DSNTIJUZ to assemble the subsystem parameter.

    5. Either issue the -SET SYSPARM command or stop and restart Db2 to activate the

    changes.'
  checks:
  - type: manual_review
    info: 'Run the DSNTEJ6Z job to obtain the current value of the SEPARATE_SECURITY subsystem

      parameter. Verify that the value is set to YES.'
    severity: medium
- id: 2.1.1
  title: Ensure subsystem access is protected
  scoring: manual
  profile:
  - Level 1
  description: The profiles specified in the DSNR RACF resource class control access to a Db2 for z/OS subsystem from another
    environment. It is recommended that you activate the DSNR class and define a profile with a name in the form of subsystem.environment
    for each subsystem and environment combination that you want to use. Permit profile access only to the users who are allowed
    to access Db2 from a specific environment.
  rationale: Subsystem access control prevents users from connecting to Db2 from an unauthorized environment for malicious
    purposes.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=racf-naming-protectedaccess-profiles
  page_start: 30
  audit_raw: 'The RACF RLIST command displays the list of users or groups who have access to the

    corresponding profile for subsystem access in the DSNR class.

    RLIST DSNR subsystem.environment ALL

    Review the output to make sure that access is permitted according to the rules of your

    organization.

    Ensure that you specify UACC(NONE) and no ID(*) to prevent universal access.'
  remediation: 'Permit users access to the corresponding profile for subsystem access based on the

    rules of your organization.'
  checks:
  - type: manual_review
    info: 'The RACF RLIST command displays the list of users or groups who have access to the

      corresponding profile for subsystem access in the DSNR class.

      RLIST DSNR subsystem.environment ALL

      Review the output to make sure that access is permitted according to the rules of your

      organization.

      Ensure that you specify UACC(NONE) and no ID(*) to prevent universal access.'
    severity: medium
- id: 2.1.2
  title: Ensure secure authentication is enabled for remote access
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: The TCPALVER subsystem parameter specifies the type of security credentials to accept for TCP/IP connection
    requests. It is recommended that you set the parameter to SERVER_ENCRYPT and require encrypted security credentials. With
    the required permissions to use the RACF passticket service, you can use RACF passticket to connect to Db2. A multi-factor
    authentication system requires that multiple authentication factors be presented during logon to verify a user's identity.
    Each authentication factor must be from a separate category of credential types. Requiring multiple authentication factors
    improves the security of the user account. You can set AUTHEXIT_CACHEREFRESH, MFA_AUTHCACHE_UNUSED_TIME system parameters
    to enable MFA for distributed clients that require multiple connections to perform a task in Db2. It is recommended that
    you configure MFA for administrator access.
  rationale: Non-encrypted user ID and password can expose their security credentials on the network. By requiring multiple
    authentication factors, the security of a user's account cannot be compromised if one of the factors is exposed.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=2-tcpip-already-verified-fieldtcpalver-subsystem-parameter
  - 1. https://www.ibm.com/docs/en/zos/2.5.0?topic=users-multi-factor-authenticationzos
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=mitbcr-enabling-caching-mfabased-authentication-credentials-clients-sysplex-workload-balancing
  page_start: 31
  audit_raw: '1. Run the DSNTEJ6Z job to obtain the current value of the TCPALVER subsystem

    parameter.

    2. Verify that the parameter is set to SERVER_ENCRYPT.

    1. Determine if a MFA product is installed and user profiles are provisioned with

    MFA in compliance with the security policies of your organization.

    2. If you use the IBM Z Multi-Factor Authentication product, verify that the RACF

    MFADEF class is active, and the user profile includes an active MFA factor type

    for user IDs that are provisioned for MFA.'
  remediation: '1. Configure your remote systems and clients to use secure credentials.

    2. Turn on IFCID 365 trace to audit authentication information for remote

    connections.

    3. Edit the DSNTIJUZ job and set DSN6FAC.TCPALVER=SERVER_ENCRYPT.

    4. Submit DSNTIJUZ to assemble the zparm.

    5. Issue the -SET SYSPARM command or stop and restart Db2 for the change to take

    effect.

    1. Follow the instructions in IBM Z Multi-Factor Authentication Installation and

    Customization to install and customize MFA.

    2. For user IDs that are provisioned for MFA, provide MFA login instructions.'
  checks:
  - type: manual_review
    info: '1. Run the DSNTEJ6Z job to obtain the current value of the TCPALVER subsystem

      parameter.

      2. Verify that the parameter is set to SERVER_ENCRYPT.

      1. Determine if a MFA product is installed and user profiles are provisioned with

      MFA in compliance with the security policies of your organization.

      2. If you use the IBM Z Multi-Factor Authentication product, verify that the RACF

      MFADEF class is active, and the user profile includes an active MFA factor type

      for user IDs that are provisioned for MFA.'
    severity: medium
- id: 2.1.4
  title: Secure all remote connections by using SSL
  scoring: manual
  profile:
  - Level 1
  description: The z/OS communications server for TCP/IP supports the Application Transport Transparent Layer Security (AT-TLS)
    function. AT-TLS performs TLS on behalf of Db2. It invokes the z/OS system SSL in the TCP layer of the TCP/IP stack and
    protects the transmission of data. It is recommended to configure AT-TLS to use SSL connections to secure all Db2 remote
    access. To ensure that all access to Db2 uses SSL communications, set the TCP/IP PORT field to the same value as the SECURE
    PORT field. Also, set the static and dynamic subsetting location aliases to the same value as the PORT and SECPORT fields.
  rationale: SSL secures your network connections and encrypts the data on the network. Failure to properly secure the network
    can result in data loss.
  impact: ''
  references:
  - 1. https://www.redbooks.ibm.com/abstracts/redp4799.html?Open
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=pdter-encrypting-your-datasecure-socket-layer-ssl-support
  page_start: 35
  audit_raw: '1. See "Encrypting your data with Secure Socket Layer (SSL) support" and "IBM

    Db2 for z/OS: Configuring TLS/SSL for Secure Client/Server Communications"

    for more information.

    2. To allow only SSL connections to Db2, verify that the TCP/IP PORT field is set to

    the same value as the SECURE PORT field and that both static and dynamic

    subsetting location aliases are defined with the same value as PORT and SECPORT.'
  remediation: 'Update the port values by using either the DSNJ003 utility (DDF statement) or the MODIFY

    DDF command.'
  checks:
  - type: manual_review
    info: '1. See "Encrypting your data with Secure Socket Layer (SSL) support" and "IBM

      Db2 for z/OS: Configuring TLS/SSL for Secure Client/Server Communications"

      for more information.

      2. To allow only SSL connections to Db2, verify that the TCP/IP PORT field is set to

      the same value as the SECURE PORT field and that both static and dynamic

      subsetting location aliases are defined with the same value as PORT and SECPORT.'
    severity: medium
- id: 2.1.5
  title: Secure remote connections by using TCP/IP Network Access control with the RACF SERVAUTH class
  scoring: manual
  profile:
  - Level 1
  description: The z/OS communications server TCP/IP network access control provides the ability to control access to Db2
    from a range of IP addresses that are defined as a security zone. When these controls are enabled, Db2 requires that the
    z/OS user ID of each Db2 client be permitted access to the RACF SERVAUTH class resource that represents the network security
    zone from which the client is connecting. If the user ID does not have the permission, then its login to Db2 will fail.
    It is recommended that you configure TCP/IP network access control with RACF SERVAUTH class to protect Db2 from unauthorized
    access.
  rationale: The TCP/IP network access control with RACF SERVAUTH class protects access to Db2 by allowing users to connect
    only from approved part of the network.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=access-permitting-fromremote-requesters
  - 2. https://www.ibm.com/docs/en/zos/2.5.0?topic=protection-network-access-control
  page_start: 37
  audit_raw: "1.Review your TCP/IP profile data set for the NETACCESS statement definition and\ndetermine if the security\
    \ zones are defined correctly. You can use the NETSTAT CONFIG\n(TSO) or netstat -x f (USS) command to display the current\
    \ TCP/IP configuration,\nincluding the NETACCESS rules. Both of the commands in the example below display the\ncurrent\
    \ configuration for the TCP/IP stack named TCPIP2:\n (TSO) NETSTAT CONFIG TCP TCPIP2\n (USS) netstat -f -p tcpip2\n2.Issue\
    \ the RACF RLIST command to display the list of users or groups that have\naccess to the corresponding profile for the\
    \ TCP network zone access in the RACF\nSERVAUTH class.\nRLIST SERVAUTH EZB.NETACCESS.sysname.tcpname.zonename ALL\nReview\
    \ the output to make sure the Db2 DIST address space user ID is permitted\naccess and the user IDs for each authorized\
    \ client are permitted access according to\nthe organization rules.\nVerify that UACC(NONE) is specified to prevent universal\
    \ access to the RACF SERVAUTH\nclass resource."
  remediation: '1. Configure the TCP/IP network access control by using the NETACCESS statement

    in your TCP/IP profile.

    2. Permit users access to the corresponding profile for the TCP network security

    zone access in the RACF SERVAUTH class based on the rules of your

    organization.'
  checks:
  - type: manual_review
    info: "1.Review your TCP/IP profile data set for the NETACCESS statement definition and\ndetermine if the security zones\
      \ are defined correctly. You can use the NETSTAT CONFIG\n(TSO) or netstat -x f (USS) command to display the current\
      \ TCP/IP configuration,\nincluding the NETACCESS rules. Both of the commands in the example below display the\ncurrent\
      \ configuration for the TCP/IP stack named TCPIP2:\n (TSO) NETSTAT CONFIG TCP TCPIP2\n (USS) netstat -f -p tcpip2\n\
      2.Issue the RACF RLIST command to display the lis"
    severity: medium
- id: 2.1.6
  title: Secure connections by using trusted contexts
  scoring: manual
  profile:
  - Level 1
  description: Trusted context provides the capability to enforce the security attributes for a connection, switch users in
    the connection with optional authentication, and acquire one or more privileges that are not available outside of the
    trusted context. It is recommended that you enable trusted context for connections that use shared IDs.
  rationale: Creating trusted contexts to enforce connection attributes such as encryption and assigning privileges to roles
    limit the scope of user access to a specific connection. Additionally, it ensures user accountability.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=facilities-managing-accessthrough-trusted-contexts
  page_start: 39
  audit_raw: '1. Issue the following SQL statement to verify that a trusted context is enabled.

    SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE,

    ENABLED, ALLOWPUBLIC, AUTHENTICATEPUBLIC FROM SYSIBM.SYSCONTEXT;

    SELECT CONTEXTID, NAME, VALUE FROM SYSIBM.SYSCTXTTRUSTATTRS;

    SELECT CONTEXTID, AUTHID, AUTHENTICATE, ROLE FROM SYSIBM.SYSCONTEXTAUTHIDS;

    2. Review the trusted context definition.'
  remediation: Create and enable trusted contexts based on the rules of your organization.
  checks:
  - type: sql
    command: SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE,
    severity: medium
    info: '1. Issue the following SQL statement to verify that a trusted context is enabled.

      SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE,

      ENABLED, ALLOWPUBLIC, AUTHENTICATEPUBLIC FROM SYSIBM.SYSCONTEXT;

      SELECT CONTEXTID, NAME, VALUE FROM SYSIBM.SYSCTXTTRUSTATTRS;

      SELECT CONTEXTID, AUTHID, AUTHENTICATE, ROLE FROM SYSIBM.SYSCONTEXTAUTHIDS;

      2. Review the trusted context definition.'
- id: 2.1.7
  title: Secure object ownership by using Db2 roles
  scoring: manual
  profile:
  - Level 1
  description: Db2 roles can be used to control access to enterprise objects in a way that parallels the structure of the
    enterprise. It is recommended that you use roles to separate object ownership from individual users and manage context-specific
    access outside of user privileges.
  rationale: Assigning object ownership to a role prevents authorization IDs from obtaining implicit ownership privileges.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/db2-for-zos/13?topic=statements-create-role
  - 2. https://www.ibm.com/docs/en/db2-for-zos/13?topic=statements-transferownership
  page_start: 41
  audit_raw: '1. Issue the following SQL statement to verify that roles are defined and associated

    with trusted contexts.

    SELECT NAME FROM SYSIBM.SYSROLES;

    SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE,

    ENABLED, ALLOWPUBLIC, AUTHENTICATEPUBLIC FROM SYSIBM.SYSCONTEXT;

    SELECT CONTEXTID, AUTHID, AUTHENTICATE, ROLE FROM SYSIBM.SYSCONTEXTAUTHIDS;

    2. Review the roles and trusted contexts definition.'
  remediation: '1. Create roles and trusted contexts and assign roles as object owners based on

    the rules of your organization.

    2. Issue the SQL TRANSFER OWNERSHIP statement to transfer the ownership of

    existing database and system objects to roles.'
  checks:
  - type: sql
    command: SELECT NAME FROM SYSIBM.SYSROLES;
    severity: medium
    info: '1. Issue the following SQL statement to verify that roles are defined and associated

      with trusted contexts.

      SELECT NAME FROM SYSIBM.SYSROLES;

      SELECT NAME, CONTEXTID, SYSTEMAUTHID, DEFAULTROLE, OBJECTOWNERTYPE,

      ENABLED, ALLOWPUBLIC, AUTHENTICATEPUBLIC FROM SYSIBM.SYSCONTEXT;

      SELECT CONTEXTID, AUTHID, AUTHENTICATE, ROLE FROM SYSIBM.SYSCONTEXTAUTHIDS;

      2. Review the roles and trusted contexts definiti'
- id: 2.1.8
  title: Secure application access by using package controls
  scoring: manual
  profile:
  - Level 1
