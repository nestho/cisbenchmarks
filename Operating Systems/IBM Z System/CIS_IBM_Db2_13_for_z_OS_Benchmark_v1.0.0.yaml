- id: 2.1.9
  title: Ensure that grant authorization IDs are defined in RACF
  scoring: manual
  profile:
  - Level 1
  description: When Db2 native security is used for access control, you can grant privileges to users or groups using the
    SQL GRANT statement. If privileges are granted to an authorizationname, it is recommended that you also define the grantee
    users or groups in RACF.
  rationale: Defining an authorization ID in RACF provides user accountability and prevents unauthorized access through orphan
    grantees.
  impact: ''
  references:
  - 1. https://www.ibm.com/docs/en/zos/2.5.0?topic=reference-racf-command-syntax
  page_start: 45
  audit_raw: 'Issue the RACF LISTGRP and LISTUSER commands to determine if the authorization IDs

    are defined in RACF and review the output.'
