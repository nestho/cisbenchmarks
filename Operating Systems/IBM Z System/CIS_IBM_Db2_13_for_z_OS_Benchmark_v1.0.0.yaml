- id: 2.5.1
  title: Ensure that data is encrypted at rest and in-flight
  scoring: manual
  profile:
  - Level 1
  description: Db2 for z/OS uses z/OS DFSMS data set encryption to transparently encrypt Db2 data sets. DFSMS data set encryption
    can be used to encrypt various types of Db2 data sets including Db2-managed table space and index space data sets, log
    data sets, and data sets that are used by Db2 utilities. DFSMS data set encryption uses a key label to encrypt and decrypt
    the data. A key label identifies a protected data key in the Integrated Cryptographic Service Facility (ICSF) key repository.
    Encrypting the data sets can help with certain compliance regulations and can also protect against insider threats from
    within the operating system.
  rationale: Encrypting the Db2 for z/OS data sets prevents malicious users from accessing the data.
  impact: ''
  references: []
  page_start: 153
  audit_raw: 'Check whether the Db2 data sets are encrypted by using the following options:

     The REPORT TABLESPACESET utility

     The ADMIN_DS_LIST Db2-supplied stored procedure

     For current active log data sets, the DISPLAY LOG command

     For current archive log data sets, the DISPLAY ARCHIVE command

     DFSMS interfaces such as IDCAMS LISTCAT and SMF records'
  remediation: 'Use the instructions in Encrypting data with z/OS data set encryption to encrypt the

    various types of data sets.'
  checks:
  - type: manual_review
    info: 'Check whether the Db2 data sets are encrypted by using the following options:

       The REPORT TABLESPACESET utility

       The ADMIN_DS_LIST Db2-supplied stored procedure

       For current active log data sets, the DISPLAY LOG command

       For current archive log data sets, the DISPLAY ARCHIVE command

       DFSMS interfaces such as IDCAMS LISTCAT and SMF records'
    severity: medium
