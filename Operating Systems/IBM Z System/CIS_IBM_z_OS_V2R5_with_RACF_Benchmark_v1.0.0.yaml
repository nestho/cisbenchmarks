- id: 6.4.1
  title: Ensure Syslog daemon is started at z/OS initialization
  scoring: manual
  profile:
  - Level 1
  description: The Syslog daemon, known as SYSLOGD, is a z/OS UNIX daemon that provides a central processing point for log
    messages issued by other z/OS UNIX processes. The messages may be of varying importance levels including general process
    information, diagnostic information, critical error notification, and audit-class information. It is important that SYSLOGD
    be started during the initialization phase of the z/OS system to ensure that significant messages are not lost. Finally,
    syslogd should run in nonswappable mode and under a sufficiently high WLM service class to allow it to keep up with heavy
    logging loads. If syslogd falls behind, it can cause system instability.
  rationale: Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit
    activities.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 Vuln ID: V-3242'
  page_start: 249
  audit_raw: 'Check that the Syslog daemon SYSLOGD is started automatically during the initialization

    of the z/OS system.

    NOTE: SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

    BPXBATCH program. Additionally, other mechanisms (e.g., CONTROL-O) may be used to

    automatically start the Syslog daemon. To thoroughly analyze this PDI you may need to

    view the OS SYSLOG using SDSF, find the last IPL, and look for the initialization of

    SYSLOGD.

    Check that the user ID under which syslogd executes is permitted to SAF resource

    BPX.STOR.SWAP in the FACILITY class.

    Check that the WLM service class under which syslogd is classified is a high enough to

    ensure syslogd will not starve for dispatching priority.'
  remediation: 'Review the files used to initialize tasks during system IPL (e.g., /etc/rc, SYS1.PARMLIB,

    CONTROL-O definitions) to ensure the Syslog daemon is automatically started during z/OS

    system initialization.

    It is important that syslogd be started during the initialization phase of the z/OS system

    to ensure that significant messages are not lost. As with other z/OS UNIX daemons,

    there is more than one way to start SYSLOGD. It can be started as a process in the

    /etc/rc file or as a z/OS started task.

    Permit the user ID under which syslogd executes to the BPX.STOR.SWAP profile in the

    FACILITY class.

    Add syslogd to the same WLM service class or one that is close in dispatching priority.'
  checks:
  - type: manual_review
    info: 'Check that the Syslog daemon SYSLOGD is started automatically during the initialization

      of the z/OS system.

      NOTE: SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

