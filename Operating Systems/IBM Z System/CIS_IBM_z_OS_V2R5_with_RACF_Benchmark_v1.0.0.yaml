    ALTDSD ‘ZFS.DATASET’ UACC(NONE)'
  checks:
  - type: manual_review
    info: 'Verify that the zFS dataset protecting profile prevent any universal access greater than

      read (NON preferred).

      LD DATASET(‘ZFS.DATASET’)'
    severity: medium
- id: '9.23'
  title: Ensure USS Telnet server is not active
  scoring: scored
  profile:
  - Level 1
  description: Running the USS Telnet server is a security concern as telnet data flow is not encrypted. SSH is recommended.
  rationale: Using an unencrypted network protocol results in clear text passwords being sent across the network connection.
  impact: ''
  references: []
  page_start: 463
  audit_raw: 'The otelned server should not be activated through the inet deamon (through

    /etc/inetd.conf) or permitted in the list of TCPIP services (/etc/services or

    hlq.ETC.SERVICES)'
  remediation: 'Remove the otelnet entry from /etc/inetd.conf and the otelnetd entry from

