- id: 6.6.3
  title: Ensure Warning banner for the TN3270 Telnet Server is configured
  scoring: manual
  profile:
  - Level 1
  description: A logon banner can be used to inform users about the environment during the initial logon. For example, the
    logon banners can be used to warn users against unauthorized entry and the possibility of legal action for unauthorized
    users and advise all users that system use constitutes consent to monitoring.
  rationale: Failure to display a logon warning banner without this type of information could adversely impact the ability
    to prosecute unauthorized users and users who abuse the system.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223833 Rule ID: SV-223833r803642_rule STIG ID: RACF-TN-000040'
  page_start: 294
  audit_raw: 'a) Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TN3270E Telnet Server started task JCL.

    b) Ensure that all USS tables referenced in BEGINVTAM USSTCP statements include

    MSG10 text that specifies a logon banner.'
  remediation: 'Review all USS tables referenced in BEGINVTAM USSTCP statements in the Telnet profile.

    Ensure the MSG10 text specifies a logon banner.

    Within the TN3270 Telnet Server, the banner can be implemented through the USS

    table that is specified on a BEGINVTAM USSTCP statement. The text associated with

    message ID 10 (i.e., MSG10) in the USS table is sent to clients that are subject to

    USSTCP processing.'
  checks:
  - type: manual_review
    info: 'a) Refer to the Profile configuration file specified on the PROFILE DD statement in the

      TN3270E Telnet Server started task JCL.

      b) Ensure that all USS tables referenced in BEGINVTAM USSTCP statements include

      MSG10 text that specifies a logon banner.'
    severity: medium
- id: 6.6.4
  title: Ensure AT-TLS protection is enabled for the TN3270 Telnet Server
  scoring: manual
  profile:
  - Level 1
  description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the
    server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that
    subsequently flows between the two. To apply TLS protection of adequate strength, the TN3270 Telnet server must be configured
    to use AT-TLS protection. Though the TN3270 Telnet server was initially implemented to use System SSL directly, that level
    of support no longer meets acceptable protection standards and is therefore not adequate. In z/OS V2R5, the native support
    for System SSL was removed from the TN3270 Telnet server.
  rationale: Failure to properly enforce adequate encryption strength could result in the loss of data privacy.
  impact: The cryptographic operations involved in TLS do come with a CPU cost. Most of the recommended algorithms are optimized
    using hardware acceleration. Depending on the number and frequency of TLS handshakes, the CPU impact could be noticeable.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223831 Rule ID: SV-223831r604139_rule STIG ID: RACF-TN-000020'
  page_start: 295
  audit_raw: 'Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TN3270E Telnet server started task JCL. This file is often called the "Telnet profile."

    Check the following items are in effect for the configuration specified in the Telnet

    profile:

    NOTE: If an INCLUDE statement is coded in the Telnet profile, the data set specified on

    this statement must be checked for the following items as well.

    NOTE: FIPS 140-2 minimum encryption is the accepted level of encryption and will

    override this requirement if greater.

     Each TELNETPARMS block specifies the TTLSPORT statement, and the PORT

    statement is not used.

     The TELNETPARMS CONNTYPE statement is coded within each TELNETPARMS block

    with either the SECURE, NEGTSECURE or NONE value.

    NOTE: The CONNTYPE statement can appear in both TELNETPARMS and PARMSGROUP

    statement blocks.

    Use the pasearch -t command to check the AT-TLS policy rule(s) that are configured

    for each of the TN3270 server ports. While the specific requirements of each rule must

    accommodate the capabilities of the communication partners (the 3270 terminal

    emulators) that connect to the TN3270E server, you should strive for the use of strong

    protection. If possible, use settings that require the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange (ECDHE (preferred) or DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
  remediation: 'The system programmer will review the TTLSPORT and TELNETPARMS CONNTYPE

    statements and/or the TELNETGLOBALS statement in the Telnet profile. Ensuring that they

    conform to the requirements specified below.

    Each TELNETPARMS block specifies the TTLSEPORT statement, and the PORT statement is

    not used.

    The TELNETPARMS CONNTYPE statement is coded within each TELNETPARMS block with

    either the SECURE, NEGTSECURE or NONE value.

    NOTE: The CONNTYPE statement can appear in both TELNETPARMS and PARMSGROUP

    statement blocks.

    Use local procedures to configured AT-TLS policy rules for each of the TN3270E server

    ports. While the specific requirements of each rule must accommodate the capabilities

    of the communication partners (the 3270 terminal emulators) that connect to the server,

    you should strive for the use of strong protection. If possible, use settings that require

    the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange exchange (ECDHE (preferred) or

    DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
  checks:
  - type: manual_review
    info: 'Refer to the Profile configuration file specified on the PROFILE DD statement in the

      TN3270E Telnet server started task JCL. This file is often called the "Telnet profile."

      Check the following items are in effect for the configuration specified in the Telnet

      profile:

