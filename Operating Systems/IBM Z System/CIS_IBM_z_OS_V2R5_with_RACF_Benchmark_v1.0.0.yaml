- id: 7.2.9
  title: Ensure CCA Operational Keys Are Created with WRAPENH3 Key Wrapping
  scoring: manual
  profile:
  - Level 1
  description: When the Crypto Express Coprocessor is configured to run in CCA mode, keys generated by the coprocessor are
    enciphered using the coprocessor’s master key (e.g. DES keys are enciphered by the DES master key). The way the keys are
    enciphered by the master key is referred to as the wrapping method. The most recent wrapping method, WRAPENH3, provides
    the first proprietary TDES key token (also known as a key block) to be independently reviewed and confirmed to be compliant
    with Payment Card Industry (PCI) Security Standard Council (SSC) PIN Security key block requirements as updated Sep 30,
    2020.
  rationale: Creating DES keys using WRAPENH3 will ensure those key blocks are PCI compliant as noted above.
  impact: ''
  references: []
  page_start: 334
  audit_raw: 'The wrapping method used by default for creating CCA keys is specified in the

    installation options dataset using the DEFAULTWRAP keyword. To determine the current

    value, use the ICSF panel utilities:

    From the ICSF Primary Menu panel, select option 3 OPSTAT.

    From the ICSF Installation Options panel, select option 1 OPTIONS

    The DEFAULTWRAP setting is shown as for example:

    DEFAULTWRAP Default symmetric key wrapping - internal ORIGINAL

    DEFAULTWRAP Default symmetric key wrapping - external ORIGINAL'
  remediation: 'Add the following keywords to the ICSF Installation Options Dataset and stop/restart

    ICSF:

    DEFAULTWRAP(WRAPENH3,WRAPENH3)'
  checks:
  - type: sql
    command: select option 3 OPSTAT.
    severity: medium
    info: 'The wrapping method used by default for creating CCA keys is specified in the

      installation options dataset using the DEFAULTWRAP keyword. To determine the current

      value, use the ICSF panel utilities:

      From the ICSF Primary Menu panel, select option 3 OPSTAT.

      From the ICSF Installation Options panel, select option 1 OPTIONS

      The DEFAULTWRAP setting is shown as for example:

      DEFAULTWRAP Default symmetr'
- id: 7.3.1
  title: Ensure CSFSERV class is active
  scoring: manual
  profile:
  - Level 1
  description: The CSFSERV SAF class is used to protect access to ICSF callable services and utilities.
  rationale: Users can be permitted or restricted from using ICSF callable services and utilities by enabling profiles within
    the CSFSERV class.
  impact: ''
  references: []
  page_start: 337
  audit_raw: 'The SETROPTS LIST command is used to identify which classes are active on the

    system. Execute a SETROPTS LIST command from a TSO session and search for the

    CSFSERV class.

    If the class is active, check the universal access to the resources within that class by

    executing the following commands from a TSO session:

    SEARCH CLASS(CSFSERV)

    And for each profile returned

    RLIST CSFSERV <profile name>

    And examine the Universal Access setting. If the Universal Access setting is other

    than NONE, consult with your security administrator for the proper value.'
  remediation: 'Activate the CSFSERV class by issuing the following command from a TSO session:

    SETR CLASSACT(CSFSERV) RACLIST(CSFSERV)

    For resources that require an update to UACC(NONE), execute the following command

    from a TSO session:

    RALTER CSFSERV <profile name> UACC(NONE)'
  checks:
  - type: manual_review
    info: 'The SETROPTS LIST command is used to identify which classes are active on the

