- id: '3.1'
  title: Ensure that the command violations are being logged
  scoring: scored
  profile:
  - Level 1
  description: 'SETROPTS CMDVIOL specifies whether RACF is to log violations detected by RACF commands. You must have the
    AUDITOR attribute to specify these options. CMDVIOL Specifies that RACF is to log violations detected by RACF commands
    (except LISTDSD, LISTGRP, LISTUSER, RLIST, and SEARCH) during RACF command processing. A violation might occur because
    a user is not authorized to modify a particular profile or is not authorized to enter a particular operand on a command.
    These values become effective immediately as: When RACF is using a newly initialized database OR when the command SETROPTS
    CMDVIOL is issued. Ensure that no RACF-protected resources will be created or accessed.'
  rationale: The improper setting of any of these fields, individually or in combination with another, can compromise the
    security of the processing environment. In addition, failure to establish standardized settings for RACF control options
    introduces the possibility of exposure during migration process or contingency plan activation.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 V-257'
  page_start: 163
  audit_raw: 'Issue the SETROPTS LIST command and look for CMDVIOL in ATTRIBUTES.

    E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC) SAUDIT CMDVIOL OPERAUDIT

    Issue command:

    SETROPTS LIST

    Verify that CMDVIOL is listed as one of the ATTRIBUTES.'
  remediation: 'To activate RACF command violation logging issue the command:

    SETROPTS CMDVIOL'
  checks:
  - type: manual_review
    info: 'Issue the SETROPTS LIST command and look for CMDVIOL in ATTRIBUTES.

      E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC) SAUDIT CMDVIOL OPERAUDIT

      Issue command:

      SETROPTS LIST

      Verify that CMDVIOL is listed as one of the ATTRIBUTES.'
    severity: medium
- id: '3.2'
  title: Ensure that activity of SPECIAL users are being logged
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS SAUDIT specifies whether RACF is to log RACF commands issued by users with the SPECIAL or group SPECIAL
    attribute. You must have the AUDITOR attribute to specify these operands. SAUDIT Specifies that RACF is to log RACF commands
    (except LISTDSD, LISTGRP, LISTUSER, RLIST, and SEARCH) issued by users who either had the SPECIAL attribute or who gained
    authority to issue the command through the group-SPECIAL attribute. These values become effective immediately when RACF
    uses a newly initialized database OR the command SETROPTS SAUDIT is issued. SAUDIT specifies whether RACF is to log all
    RACF commands issued by users with the SPECIAL or group SPECIAL attribute. The system-wide options control the default
    settings for determining how RACF will function when handling requests for access to the operating system environment,
    RACF, and customer data. RACF provides the ability to set a number of these fields at the subsystem level. If no setting
    is found, the systemwide defaults will be used. The improper setting of any of these fields, individually or in combination
    with another, can compromise the security of the processing environment. In addition, failure to establish standardized
    settings for RACF control options introduces the possibility of exposure during migration process or contingency plan
    activation. Ensure that RACF is to log commands issued by a user with SPECIAL attribute.
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. In addition, failure
    to establish standardized settings for the RACF options introduces the possibility of exposure during migration process
    or contingency plan activation.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223699 Rule ID: SV-223699r604139_rule STIG ID: RACF-ES-000520'
  page_start: 165
  audit_raw: 'Issue the command:

    SETROPTS LIST

    Look for SAUDIT in ATTRIBUTE = session:

    E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC) SAUDIT CMDVIOL OPERAUDIT'
  remediation: 'Issue the command:

    SETROPTS SAUDIT'
  checks:
  - type: manual_review
    info: 'Issue the command:

      SETROPTS LIST

      Look for SAUDIT in ATTRIBUTE = session:

      E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC) SAUDIT CMDVIOL OPERAUDIT'
    severity: medium
- id: '3.3'
  title: Ensure that the AUDIT SETROPTS value is set for all classes
  scoring: scored
  profile:
  - Level 1
  description: 'SETROPTS AUDIT(xx) specifies the names of the classes for which you want RACF to perform auditing. For the
    classes you specify, RACF logs all uses of the RACROUTE REQUEST=DEFINE SVC and all changes made to profiles by RACF commands.
    When the class specified is USER, RACF logs all password and password phrase changes made by RACROUTE REQUEST=VERIFY.
    (RACF adds the classes you specify to those already specified for auditing.) The valid class names are USER, GROUP, DATASET,
    and those defined in the class descriptor table. If you specify an asterisk (*), logging occurs for all classes. You must
    have the AUDITOR attribute to enter the AUDIT operand. All of the following classes must be audited: AUDIT(DATASET) AUDIT(GROUP)
    AUDIT(USER) AUDIT(OPERCMDS) AUDIT(TSOAUTH) AUDIT(SDSF) AUDIT(FACILITY) AUDIT(UNIXPRIV) AUDIT(xxx) for all classes which
    contain an OSR AUDIT(PROCESS) These values become effective immediately as: The command SETROPTS AUDIT(xx) is issued Ensure
    that RACF audits the classes and log their activities.'
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. In addition, failure
    to establish standardized settings for the RACF options introduces the possibility of exposure during migration process
    or contingency plan activation.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 V-255'
  page_start: 167
  audit_raw: "Issue the command:\n SETROPTS LIST\nLook for the previous mentioned classes in the AUDIT CLASSES = sessions."
  remediation: 'Issue the command:

    SETROPTS AUDIT(xx)

    Where xx is the class that needs to be audited.

    To activate logging for all RACF Classes issue the command:

    SETR AUDIT(*)'
  checks:
  - type: manual_review
    info: "Issue the command:\n SETROPTS LIST\nLook for the previous mentioned classes in the AUDIT CLASSES = sessions."
    severity: medium
- id: '3.4'
  title: Ensure that activities of users with the OPERATIONS attribute are logged
  scoring: scored
  profile:
