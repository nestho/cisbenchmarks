- id: '3.13'
  title: Ensure all software on your system is supported
  scoring: manual
  profile:
  - Level 1
  description: Vendors' code may contain vulnerabilities that may be exploited to cause denial of service or to violate the
    integrity of the system or data on the System. Most vendors do not develop patches to correct these vulnerabilities on
    unsupported releases of their software.
  rationale: With unsupported software on the system, it is impossible to verify that the system does not contain code which
    could violate the integrity of the operating system environment.
  impact: ''
