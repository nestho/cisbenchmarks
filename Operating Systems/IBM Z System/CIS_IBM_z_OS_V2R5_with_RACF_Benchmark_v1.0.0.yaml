    function of the job information SSI 71. The SPOOL I/O function is intended for application to access data on the JES2
    spool for debugging purposes.
  rationale: Failure to properly control access to spool I/O could result in unauthorized personnel accessing sensitive or
    confidential customer data. Most access to SPOOL control blocks is managed by the JESSPOOL resource class. However, that
    use requires that the data can be associated with a specific existing job. In the case where the data being accessed is
    not associated with a job or the job no longer exists, this JESJOBS resource class check is used. Ensure that access authorization
    for SPOOLIO resources is restricted to Systems personnel responsible for diagnosing JES2 and z/OS problems.
  impact: ''
  references: []
  page_start: 389
  audit_raw: 'Ensure the following items are in effect:

    1. The SPOOLIO.nodename.jobname.jobid.cbname resource is defined to the JESJOBS

    resource class with a default access of NONE and all access is logged.

    2. Access authorization to the SPOOLIO.nodename.jobname.jobid.cbname resource

    in the JESJOBS class restricts READ access to the appropriate personnel (i.e.,

    Systems personnel responsible for diagnosing JES2 and z/OS problems) and all

    access is logged.'
  remediation: 'Ensure the following items are in effect:

    1. The SPOOLIO.nodename.jobname.jobid.cbname resource is defined to the JESJOBS

    resource class with a default access of NONE and all access is logged.

    2. Access authorization to the SPOOLIO.nodename.jobname.jobid.cbname resource

    in the JESJOBS class restricts READ access to the appropriate personnel (i.e.,

    Systems personnel responsible for diagnosing JES2 and z/OS problems) and all

    access is logged.

    Examples of setting up protection are shown here:

    RDEF JESJOBS SPOOLIO .* UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''Restrict SPOOL read '')

    PERMIT SPOOLIO.nodename.jobname.jobid.cbname CLASS(JESJOBS) ID() ACCESS(READ)'
  checks:
  - type: manual_review
    info: 'Ensure the following items are in effect:

      1. The SPOOLIO.nodename.jobname.jobid.cbname resource is defined to the JESJOBS

      resource class with a default access of NONE and all access is logged.

      2. Access authorization to the SPOOLIO.nodename.jobname.jobid.cbname resource

      in the JESJOBS class restricts READ access to the appropriate personnel (i.e.,

      Systems personnel responsible for diagnosing JES2 and z/OS problems) and all

      access is logged.'
    severity: medium
- id: 8.3.14
  title: Ensure START JESJOBS profiles are protected
  scoring: manual
  profile:
  - Level 1
  description: Resources with a START high-level qualifier in the JESJOBS resource class control the use of the start function
    of the job modify SSI 85. Starting a job causes a job to begin processing immediately (starting an initiator if required).
    This could cause a job to begin processing prematurely.
  rationale: Failure to properly control access to starting jobs could result in unauthorized personnel starting jobs prematurely
    or starting more jobs than the system has capacity to process.
  impact: ''
  references: []
  page_start: 391
  audit_raw: 'Ensure the following items are in effect:

    1. The START.nodename.userid.jobname resource is defined to the JESJOBS resource

    class with a default access of NONE and all access is logged.

    2. Access authorization to the START.nodename.userid.jobname resource in the

    JESJOBS class restricts CONTROL access to the appropriate personnel (i.e., users

    allowed to start the specified jobname) and all access is logged.'
  remediation: 'Ensure the following items are in effect:

    1. The START.nodename.userid.jobname resource is defined to the JESJOBS resource

    class with a default access of NONE and all access is logged.

    2. Access authorization to the START.nodename.userid.jobname resource in the

    JESJOBS class restricts CONTROL access to the appropriate personnel (i.e., users

    allowed to start the specified jobname) and all access is logged.

    Examples of setting up protection are shown here:

    RDEF JESJOBS START .* UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ)) DATA(''Restrict

    START '')

    PERMIT START.nodename.userid.jobname CLASS(JESJOBS) ID() ACCESS(CONTROL)'
  checks:
  - type: manual_review
    info: 'Ensure the following items are in effect:

      1. The START.nodename.userid.jobname resource is defined to the JESJOBS resource

      class with a default access of NONE and all access is logged.

      2. Access authorization to the START.nodename.userid.jobname resource in the

      JESJOBS class restricts CONTROL access to the appropriate personnel (i.e., users

      allowed to start the specified jobname) and all access is logged.'
    severity: medium
- id: 8.3.15
  title: Ensure SUBMIT JESJOBS profiles are protected
  scoring: manual
  profile:
  - Level 1
  description: Resources with a SUBMIT high-level qualifier in the JESJOBS resource class control the submitting of batch
    jobs from all sources. By using these resources, you can control the combination of job names, owning user IDs, and submitting
    user IDs that can be used.
  rationale: 'Typically, resources of this type are used when the use of job names must be restricted to certain owning user
    IDs or submitting user IDs. This would be the case if job names are used to control other concepts such as encryption.
    They can also be used to limit what jobs a user can submit or what user IDs can be used with batch jobs. NOTE: Creating
    a SUBMIT.* profile with a UACC of NONE blocks all batch job submission. Generally, the SUBMIT.* profile is created with
    a UACC of READ and then more specific profiles are created with a UACC of NONE to restrict unauthorized job submissions.'
  impact: ''
  references: []
  page_start: 393
  audit_raw: 'Ensure the following items are in effect:

    1. The SUBMIT.nodename.jobname.userid resource is defined to the JESJOBS

    resource class with a default access of READ and all access is logged.

    2. Access authorization to the SUBMIT.nodename.jobname.userid resource in the

    JESJOBS class restricts NONE access to for the combinations that require restricted

    usage with all access is logged.

    NOTE: Creating a SUBMIT.* profile with a UACC of NONE blocks all batch job submission.'
  remediation: 'Ensure the following items are in effect:

    1. The SUBMIT.nodename.jobname.userid resource is defined to the JESJOBS

    resource class with a default access of READ and all access is logged.

    2. Access authorization to the SUBMIT.nodename.jobname.userid resource in the

    JESJOBS class restricts NONE access to for the combinations that require restricted

    usage with all access is logged.

    Examples of setting up proper protection are shown here:

    RDEF JESJOBS START .* UACC(READ) OWNER(ADMIN) AUDIT(ALL(READ)) DATA(''Allow

    general SUBMIT '')

    Control users that can submit jobs that start with PROD*

    RDEF JESJOBS START .*.PROD*.* UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''Contol PROD* jobnames '')

    PERMIT START .*.PROD*.* CLASS(JESJOBS) ID() ACCESS(READ)

    Jobs that start with PROD* can only be run by the PRODUSER user ID

    RDEF JESJOBS START .*.PROD*.* UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''Contol PROD* jobnames '')

    RDEF JESJOBS START .*.PROD*.PRODUSER UACC(READ) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''PROD* jobnames must have PRODUSER id'')'
  checks:
  - type: manual_review
    info: 'Ensure the following items are in effect:

      1. The SUBMIT.nodename.jobname.userid resource is defined to the JESJOBS

      resource class with a default access of READ and all access is logged.

      2. Access authorization to the SUBMIT.nodename.jobname.userid resource in the

      JESJOBS class restricts NONE access to for the combinations that require restricted

      usage with all access is logged.

      NOTE: Creating a SUBMIT.* profile with a UACC of NONE blocks all batch job submission.'
    severity: medium
- id: 8.4.1
  title: Ensure that data sets on SPOOL are encrypted as required
  scoring: manual
  profile:
  - Level 1
  description: Job data sets (instream and SYSOUT data sets) can be encrypted using profiles in the JESJOBS class with a high-level
    qualifier of ENCRYPT. The KeyLabel for encryption is set in the JES segment of the profile.
  rationale: Encrypting data sets on SPOOL provides an extra level of security for the data. Access to the data requires both
    access via the JESSPOOL class and access to the key label used to encrypt the data. It also limits the exposure to inadvertent
    access to SPOOL buffers.
  impact: ''
  references: []
  page_start: 396
  audit_raw: 'There are two ways to request encryption of data on spool:

     Specify key labels in the JESJOBS resource class profiles. This is done using the

    KEYLABEL keyword in the JES segment of the JESJOBS resource class profile

    ENCRYPT.nodename.userid.jobname.dsname

     Specify the DSKEYLBL= keyword on the DD statement for instream data (DD * or

    DD DATA) or SYSOUT (DD SYSOUT=). In order to specify DSKEYLBL the user

    must have READ access to one of the two FACILITY class profiles.

    JES.ENCRYPT.OWNER for SYSOUT and instream data in PROCs and INCLUDEs.

    JES.ENCRYPT.SUBMITTER for all other instream data sets (processed during input

    phase).'
  remediation: 'There are two ways to request encryption of data on spool:

     Specify key labels in the JESJOBS resource class profiles. This is done using the

    KEYLABEL keyword in the JES segment of the JESJOBS resource class profile

    ENCRYPT.nodename.userid.jobname.dsname

     Specify the DSKEYLBL= keyword on the DD statement for instream data (DD * or

    DD DATA) or SYSOUT (DD SYSOUT=). In order to specify DSKEYLBL the user

    must have READ access to one of the two FACILITY class profiles.

    JES.ENCRYPT.OWNER for SYSOUT and instream data in PROCs and INCLUDEs.

    JES.ENCRYPT.SUBMITTER for all other instream data sets (processed during input

    phase).

    Examples of setting up proper protection are shown here:

    RDEF JESJOBS ENCRYPT.* UACC(READ) OWNER(ADMIN) JES(KEYLABEL(DEFAULTKEY)

    DATA(''Encrypt everything'')

    RDEF JESJOBS ENCRYPT.nodename.PRODUSER.* UACC(READ) OWNER(ADMIN)

    JES(KEYLABEL(PRODKEY)) DATA(''Encrypt production stuff'')

    RDEF FACILITY JES.ENCRYPT.OWNER UACC(READ) OWNER(ADMIN) DATA(''Allow

    DSKEYLBL='')'
  checks:
  - type: manual_review
    info: 'There are two ways to request encryption of data on spool:

       Specify key labels in the JESJOBS resource class profiles. This is done using the

      KEYLABEL keyword in the JES segment of the JESJOBS resource class profile

      ENCRYPT.nodename.userid.jobname.dsname

       Specify the DSKEYLBL= keyword on the DD statement for instream data (DD * or

      DD DATA) or SYSOUT (DD SYSOUT=). In order to specify DSKEYLBL the user

      must have READ access to one of the two FACILITY class profiles.

      JES.ENCRYPT.OWNER for SYSOUT '
    severity: medium
- id: 8.4.2
  title: Require user identification
  scoring: manual
  profile:
  - Level 1
  description: SETROPTS BATCHALLRACF specifies that JES is to test for the presence of a user ID and password on the job statement
    or for propagated RACF identification information for all batch JOBS. The system-wide option controls the default settings
    for determining how RACF will function when handling requests for access to the operating system environment, RACF, and
    customer data.
  rationale: For proper logging and verification of batch job, all jobs must have a validated user ID. Failure to set this
    option will allow jobs to run on the system without being identified and verified by RACF.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223692 Rule ID: SV-223692r604139_rule STIG ID: RACF-ES-000440'
  page_start: 398
  audit_raw: 'Issue the following command from TSO

    SETROPTS LIST

    Ensure JES-BATCHALLRACF is active.'
  remediation: 'Issue the following command from TSO

    SETROPTS LIST

    Ensure JES-BATCHALLRACF is active.'
  checks:
  - type: manual_review
    info: 'Issue the following command from TSO

      SETROPTS LIST

      Ensure JES-BATCHALLRACF is active.'
    severity: medium
