  audit_raw: 'The following data set controls must be in effect for the FTP Server:

    1.

    WRITE and ALLOCATE access to the data set containing the FTP Data configuration

    file is restricted to systems programming personnel.

    NOTE: READ access to all authenticated users is permitted.

    2. WRITE and ALLOCATE access to the data set containing the FTP Data configuration

    file is logged.

    3. WRITE and ALLOCATE access to the data set containing the FTP banner file is

    restricted to systems programming personnel.

    4. READ access to the data set containing the FTP banner file is permitted to all

    authenticated users.

    NOTE: The MVS data sets mentioned above may not be used in every configuration.

    The data set containing the FTP Data configuration file is determined by checking the

    SYSFTPD DD statement in the FTP started task JCL.

    The data set containing the FTP banner file is determined by checking the BANNER

    statement in the FTP Data configuration file.'
  remediation: 'Review the data set access authorizations defined to the ACP for the FTP.DATA and

    FTP.BANNER files. Ensure these data sets are protected as follows:

    The data set containing the FTP.DATA configuration file allows read access to all

    authenticated users and all other access is restricted to systems programming

    personnel.

    All write and allocate access to the data set containing the FTP.DATA configuration file is

    logged.

    The data set containing the FTP banner file allows read access to all authenticated

    users and all other access is restricted to systems programming personnel.'
  checks:
