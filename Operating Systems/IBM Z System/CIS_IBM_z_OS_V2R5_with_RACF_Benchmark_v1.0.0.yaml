- id: 6.6.6
  title: Ensure Startup user account for the z/OS UNIX Telnet Server is defined
  scoring: manual
  profile:
  - Level 1
  description: The z/OS Unix Telnet Server (i.e., otelnetd) provides remote access to the z/OS Unix command prompt. otelnetd
    does not provide any cryptographic protection of user connections. Due to this lack of security, the otelnetd server will
    not be used. Instead, use SSH for remote z/OS Unix command prompt access.
  rationale: The inability to cryptographically protect otelnetd connections exposes all communications between telnet clients
    and the otelnetd server, including sensitive values like passwords, to network-based observers, resulting in a complete
    lack of data privacy.
  impact: otelnetd users (if any) will no longer have access to otelnetd and must switch to a secure remote access mechanism
    such as SSH.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223864 Rule ID: SV-223864r604139_rule STIG ID: RACF-UT-000010'
  page_start: 300
  audit_raw: 'Ensure the following program controls are in effect for the otelnetd server:

    1. Program resources otelnetd and EZATNTLE are defined to the PROGRAM resource

    class with a UACC(NONE). The library name where these programs are located is

    SYS1.TCPIP.SEZALOAD.

    2. No access to the program resources otelnetd or EZATNTLE is permitted.'
  remediation: 'Ensure that the EZATNTLE program and its alias otelnetd are defined to RACF, no access

    is granted, and WARN mode is not enabled. The following commands provide a sample of

    how this can be accomplished.

    rdef program otelnetd addmem(''sys1.tcpip.sezaload''//nopadchk) -

    data(''Reference SRR PDI # IFTP0090'') -

    audit(all(read)) uacc(none) owner(admin)

    rdef program ezatntle -

    addmem(''sys1.tcpip.sezaload''//nopadchk) -

    data(''Reference SRR PDI # IFTP0090'') -

    audit(all(read)) uacc(none) owner(admin)

    A PROGRAM class refresh will be necessary and can be accomplished with the command:

    setr when(program) refresh'
  checks:
  - type: manual_review
    info: 'Ensure the following program controls are in effect for the otelnetd server:

      1. Program resources otelnetd and EZATNTLE are defined to the PROGRAM resource

      class with a UACC(NONE). The library name where these programs are located is

      SYS1.TCPIP.SEZALOAD.

      2. No access to the program resources otelnetd or EZATNTLE is permitted.'
    severity: medium
- id: 6.7.1
  title: Ensure VTAM USSTAB definitions are being used for secured terminals
  scoring: manual
  profile:
  - Level 1
  description: VTAM options and definitions are used to define VTAM operational capabilities. They must be strictly controlled.
    Unauthorized users could override or change start options or network definitions.
  rationale: Failure to properly control VTAM resources could potentially compromise the network operations.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223870 Rule ID: SV-223870r604139_rule STIG ID: RACF-VT-000020'
  page_start: 303
  audit_raw: 'VTAM Systems Programmer supplies the following information:

     Documentation regarding terminal naming standards.

     Documentation of all procedures controlling terminal logons to the system.

     A complete list of all USS commands used by terminal users to log on to the

    system.

     Members and data set names containing USSTAB and LOGAPPL definitions of all

    terminals that can log on to the system (e.g., SYS1.VTAMLST).

     Members and data set names containing logon mode parameters.

    Check that the USSTAB definitions are only used for secure terminals (e.g., terminals that

    are locally attached to the host or connected to the host via secure leased lines).'
  remediation: 'The Systems programmer will verify that USSTAB definitions are only used for secure

    terminals.

    Only terminals that are locally attached to the host or connected to the host via secure

    leased lines located in a secured area. Only authorized personnel may enter the area

    where secure terminals are located.

    USSTAB or LOGAPPL definitions are used to control logon from secure terminals. These

    terminals can log on directly to any VTAM application (e.g., TSO, CICS, etc.) of their

    choice and bypass Session Manager services. Secure terminals are usually locally

    attached to the host or connected to the host via a private LAN without access to an

    external network. Only authorized personnel may enter the area where secure terminals

    are located.'
  checks:
  - type: manual_review
    info: 'VTAM Systems Programmer supplies the following information:

       Documentation regarding terminal naming standards.

       Documentation of all procedures controlling terminal logons to the system.

       A complete list of all USS commands used by terminal users to log on to the

      system.

       Members and data set names containing USSTAB and LOGAPPL definitions of all

      terminals that can log on to the system (e.g., SYS1.VTAMLST).

       Members and data set names containing logon mode parameters.

      Check that the USSTAB'
    severity: medium
- id: 6.7.2
  title: Ensure System datasets used to support the VTAM network are secured
  scoring: manual
  profile:
  - Level 1
  description: Ensure that RACF data set rules for all VTAM system data sets restrict access to only network systems programming
    staff. These data sets include libraries containing VTAM load modules and exit routines, and VTAM start options and definition
    statements.
  rationale: Failure to properly control VTAM datasets could potentially compromise the network operations.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223869 Rule ID: SV-223869r604139_rule STIG ID: RACF-VT-000010'
