- id: 7.1.3
  title: Ensure CSFINPV2 requires signature verification
  scoring: manual
  profile:
  - Level 1
  description: Certain z/OS load modules can have an associated signature generated by IBM that is verified by the system
    when the module is loaded into system storage for execution. The way to ensure the signature verification occurs is by
    defining a profile in the PROGRAM class with the SIGVER segment.
  rationale: By verifying the IBM generated signature when a module is loaded into storage, the integrity and authenticity
    of the module are guaranteed.
  impact: ''
  references: []
  page_start: 314
  audit_raw: 'The ICSF module CSFINPV2 must have a profile in the PROGRAM class with the SIGVER

    segments setup to require signature verification.

    To determine that a protection profile for CSFINPV2 exists, and that it has the correct

    information in the SIGVER segment for module signing, enter the following command:

    RLIST PROGRAM CSFINPV2 SIGVER'
  remediation: 'Create a protection profile in the STARTED class for the ICSF started task.

    To create a protection profile in the PROGRAM class for module CSFINPV2, enter the

    following command.

    RDEFINE PROGRAM CSFINPV2 ADDMEM(''SYS1.SIEALNKE''//NOPADCHK) UACC(READ)

    SIGVER(SIGREQUIRED(YES) FAILLOAD(ANYBAD) SIGAUDIT(ANYBAD))

    And then refresh the PROGRAM class with the command:

    SETROPTS WHEN(PROGRAM) REFRESH

    Refer to the ICSF System Program’s Guide for additional information.'
  checks:
  - type: manual_review
    info: 'The ICSF module CSFINPV2 must have a profile in the PROGRAM class with the SIGVER

      segments setup to require signature verification.

      To determine that a protection profile for CSFINPV2 exists, and that it has the correct

      information in the SIGVER segment for module signing, enter the following command:

      RLIST PROGRAM CSFINPV2 SIGVER'
    severity: medium
- id: 7.1.4
  title: Ensure ICSF is configured to start during IPL
  scoring: manual
  profile:
  - Level 1
  description: ICSF can be started in different ways, including manual via a “START” operator command. To ensure maximum availability
    of ICSF and crypto services, it is best to configure ICSF to be started during the z/OS IPL procedures. This can be done
    by configuring ICSF to start early as described in Chapter 4. "Operating ICSF", Section "Starting ICSF during IPL-time"
    in the ICSF System Programmer's Guide. The ICSF=xx parameter should be specified in IEASYSxx.
  rationale: By configuring ICSF to start during IPL, there is less operator manual intervention required, and more availability
    of crypto services and resources.
  impact: ''
  references: []
  page_start: 316
  audit_raw: 'Ensure the IEASYSxx parmlib member has ICSFPROC and ICSF system parameters, e.g.:

    ICSFPROC=CSF2

    ICSF=00

    Ensure the ICSF started procedure has been modified to accept the PRM procedure

    variable, e.g.:

    //CSF PROC PRM=00

    //CSF EXEC PGM=CSFINIT,REGION=0M,TIME=1440,MEMLIMIT=NOLIMIT

    //CSFPARM DD DSN=USER.PARMLIB(CSFPRM&PRM),DISP=SHR'
  remediation: 'Create the ICSFPROC and ICSF parameters in the IEASYSxx parmlib member and modify

    the ICSF started procedure to accept the PRM procedure variable.'
  checks:
  - type: manual_review
    info: 'Ensure the IEASYSxx parmlib member has ICSFPROC and ICSF system parameters, e.g.:

      ICSFPROC=CSF2

      ICSF=00

