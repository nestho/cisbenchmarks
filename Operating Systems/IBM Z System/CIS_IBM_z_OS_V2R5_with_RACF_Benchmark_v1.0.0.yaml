  audit_raw: 'Software products currently running on the reviewed system are at a version less than

    the products listed in the vendor’s Support Lifecycle information.'
  remediation: 'Upgrade the software found at a version less than the current supported version.

    Replace any product out of support.'
  checks:
  - type: manual_review
    info: 'Software products currently running on the reviewed system are at a version less than

      the products listed in the vendor’s Support Lifecycle information.'
