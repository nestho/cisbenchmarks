- id: 6.3.1
  title: Ensure SSH daemon is configured to only use the SSHv2 protocol
  scoring: manual
  profile:
  - Level 1
  description: 'SSHv1 has many well-known vulnerability exploits and SSH daemon should only use the SSHv2 protocol. Note:
    Support for SSHv1 was removed from IBM z/OS OpenSSH in z/OS V2R4. This benchmark only applies to z/OS OpenSSH on releases
    prior to V2R4, or for installations that use a third party SSH implementation on z/OS.'
  rationale: Exploits of the SSH daemon using the SSHv1 protocol could provide immediate root access to the system.
  impact: Any clients using SSHv1 (if any) will need to upgrade to SSHv2
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223810 Rule ID: SV-223810r604139_rule STIG ID: RACF-SH-000050'
  page_start: 238
  audit_raw: 'Locate the SSH daemon configuration file which may be found in /etc/ssh/ directory.

    Alternately:

    From UNIX System Services ISPF Shell navigate to ribbon select tools.

    Select option 1 - Work with Processes.

    Check if SSH Daemon is active.

    Examine SSH daemon configuration file. The variables ''Protocol 2,1’ or ‘Protocol 1’

    should not be defined on a line without a leading comment.'
  remediation: 'Edit the sshd_config file and set the "Protocol" setting to "2". If any communication

    partners were using SSHv1, you may need to work with them to coordinate their

    upgrade to the SSHv2 protocol for accessing your z/OS SSH server.'
