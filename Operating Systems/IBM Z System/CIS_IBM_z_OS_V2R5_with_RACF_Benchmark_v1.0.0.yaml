- id: 6.2.2
  title: Ensure startup parameters for the FTP daemon do not allow ANONYMOUS or INACTIVE keywords
  scoring: manual
  profile:
  - Level 1
  description: During initialization, the FTP daemon reads JCL keywords and configuration files to determine values for critical
    operational parameters. Because system security is impacted by some of these parameter settings, controlling these options
    through the configuration file only and explicitly specifying the file locations reduces ambiguity, enhances security
    auditing, and ensures proper operations.
  rationale: Inappropriate values could result in undesirable operations and degraded security. This exposure may result in
    unauthorized access impacting data integrity or the availability of some system services.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223744 Rule ID: SV-223744r604139_rule STIG ID: RACF-FT-000120'
  page_start: 212
  audit_raw: 'a) Display the active started tasks executing on the domain using SDSF, or equivalent

    JES display product, and locate the FTP daemon.

    If FTP is inactive, review the procedure libraries defined to JES2 and locate the FTP

    JCL member.

    NOTE: The JCL member is typically named FTPD.

    Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TCPIP started task JCL.

    b) Ensure the following items are in effect for the FTP daemon’s started task JCL:

    1. The SYSTCPD and SYSFTPD DD statements specify the TCP/IP Data and FTP Data

    configuration files respectively.

    2. The ANONYMOUS keyword is not coded on the PARM parameter on the EXEC

    statement.

    3. The ANONYMOUS=logonid combination is not coded on the PARM parameter on the

    EXEC statement.

    4. The INACTIVE keyword is not coded on the PARM parameter on the EXEC

    statement.

    c) The AUTOLOG statement block can be configured to have TCP/IP start the FTP Server.

    The FTP entry (e.g., FTPD) can include the PARMSTRING parameter to pass parameters

    to the FTP procedure when started.

    NOTE: Parameters passed on the PARMSTRING parameter override parameters specified

    in the FTP procedure.

    If an FTP entry is configured in the AUTOLOG statement block in the TCP/IP Profile

    configuration file, ensure the following items are in effect:

    1. The ANONYMOUS keyword is not coded on the PARMSTRING parameter.

    2. The ANONYMOUS=logonid combination is not coded on the PARMSTRING parameter.

    3. The INACTIVE keyword is not coded on PARMSTRING parameter.'
  remediation: 'Review the FTP daemon’s started task JCL. Ensure that the ANONYMOUS and INACTIVE

    startup parameters are not specified, and configuration file names are specified on the

    appropriate DD statements.

    The FTP daemon program can accept parameters in the JCL procedure that is used to

    start the daemon. The ANONYMOUS and ANONYMOUS= keywords are designed to allow

    anonymous FTP connections. The INACTIVE keyword is designed to set the timeout

    value for inactive connections. Control of these options is recommended through the

    configuration file statements rather than the startup parameters.

    The systems programmer will ensure that the startup parameters for the FTP daemon

    does not include the ANONYMOUS, ANONYMOUS=, or INACTIVE keywords.

    During initialization the FTP daemon searches multiple locations for the TCPIP.DATA and

    FTP.DATA files according to fixed sequences. In the daemon’s started task JCL, Data

    Definition (DD) statements will be used to specify the locations of the files. The SYSTCPD

    DD statement identifies the TCPIP.DATA file and the SYSFTPD DD statement identifies the

    FTP.DATA file.

    The systems programmer will ensure that the FTP daemon’s started task JCL specifies

    the SYSTCPD and SYSFTPD DD statements for configuration files.

    It is recommended TCP/IP configuration files reside in TCPPARMS datasets or HFS files

    with restricted access.'
  checks:
  - type: manual_review
    info: 'a) Display the active started tasks executing on the domain using SDSF, or equivalent

      JES display product, and locate the FTP daemon.

      If FTP is inactive, review the procedure libraries defined to JES2 and locate the FTP

      JCL member.

      NOTE: The JCL member is typically named FTPD.

      Refer to the Profile configuration file specified on the PROFILE DD statement in the

      TCPIP started task JCL.

      b) Ensure the following items are in effect for the FTP daemon’s started task JCL:

      1. The SYSTCPD and SYSFTPD DD '
    severity: medium
- id: 6.2.3
  title: Ensure FTP.DATA configuration statements enforce secure configuration
  scoring: manual
  profile:
  - Level 1
  description: The statements in the FTP.DATA configuration file specify the parameters and values that control the operation
    of the FTP Server components including the use of anonymous FTP. Several of the parameters must have specific settings
    to provide a secure configuration.
  rationale: Inappropriate values could result in undesirable operations and degraded security. This exposure may result in
    unauthorized access impacting data integrity or the availability of some system services.
  impact: Clients that were previously able to connect to the FTP server without TLS protection will no longer be able to
    do so. In addition, limiting the amount of server information will reduce the amount of server identification information
    that FTP clients may have previously had access to.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223739 Rule ID: SV-223739r604139_rule STIG ID: RACF-FT-000070'
  page_start: 215
  audit_raw: 'a) Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTP

    started task JCL.

    b) Ensure the following items are in effect for the configuration statements specified in

    the FTP Data configuration file:

    1. The ANONYMOUS statement is not coded (does not exist) or, if it does exist, it is

    commented out.

    NOTE: Other statements prefixed with ANONYMOUS may be present. These statements

    indicate the level of anonymous support and applicable restrictions if anonymous

    support is enabled using the ANONYMOUS statement. These other ANONYMOUS-prefixed

    statements may be ignored.

    2. The INACTIVE statement is coded with a value between 1 and 900 (seconds).

    NOTE: 900 indicates a session timeout value of 15 minutes.

    0 disables the inactivity timer check. The default is 300 seconds.

    3. The UMASK statement is coded with a value of 077.

    4. The BANNER statement is coded.

    5. The ACCESSERRORMSGS statement is either not coded, is commented out, or is

    coded with a value of FALSE

    6. The REPLYSECURITYLEVEL statement is coded with a value of 1

    7. The PASSIVEDATACONN statement is coded with a value of NOREDIRECT'
  remediation: 'Review the configuration statements in the FTP.DATA file and ensure they conform to the

    specifications in the FTP.DATA CONFIGURATION STATEMENTS below:

    STATEMENT NOT CODED,

    CODED WITHOUT VALUE,

    OR PARAMETER VALUE

    ANONYMOUS [Not Coded]

    BANNER [An HFS file, e.g., /etc/ftp.banner]

    INACTIVE [A value between 1 and 900]

    UMASK 077 [See Note 1]

    ACCESSERRORMSGS [not coded or coded with a value of FALSE]

    The REPLYSECURITYLEVEL [coded with a value of 1]

    PASSIVEDATACONN [coded with a value of NOREDIRECT]

    NOTE: If the FTP Server requires a UMASK value less restrictive than 077,

    requirements should be justified and documented.'
  checks:
  - type: manual_review
    info: 'a) Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTP

      started task JCL.

      b) Ensure the following items are in effect for the configuration statements specified in

      the FTP Data configuration file:

      1. The ANONYMOUS statement is not coded (does not exist) or, if it does exist, it is

      commented out.

      NOTE: Other statements prefixed with ANONYMOUS may be present. These statements

      indicate the level of anonymous support and applicable restrictions if anonymous

      support i'
    severity: medium
- id: 6.2.4
  title: Ensure AT-TLS protection is enabled for the FTP daemon
  scoring: manual
  profile:
  - Level 1
  description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the
    server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that
    subsequently flows between the two. To apply TLS protection of adequate strength, the FTP daemon must be configured to
    use AT-TLS protection. Though the FTP daemon was initially implemented to use System SSL directly, that level of support
    no longer meets acceptable protection standards and is therefore not adequate. In z/OS V2R5, the native support for System
    SSL was removed from the FTP daemon.
  rationale: Failure to properly enforce adequate encryption strength could result in the loss of data privacy.
  impact: The cryptographic operations involved in TLS do come with a CPU cost. Most of the recommended algorithms are optimized
    through the use of hardware acceleration. Depending on the number and frequency of TLS handshakes, the CPU impact could
    be noticeable.
  references: []
  page_start: 219
  audit_raw: 'Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTPD

    started task JCL. This is the FTP Data configuration file.

    Check the following items are in effect for the configuration specified in the FTP Data

    configuration file.

    NOTE: FIPS 140-2 minimum encryption is the accepted level of encryption and will

    override this requirement if greater.

     The EXTENSIONS statement is coded with the AUTH_TLS value

     The SECURE_FTP statement is coded with the REQUIRED value

     The SECURE_CTRLCONN statement is coded with the PRIVATE value

     The SECURE_DATACONN statement is coded with the PRIVATE or SAFE value

     The TLSCERTCROSSCHECK statement is either not coded, is commented out, or is

    coded with the TRUE value

     The TLSRFCLEVEL statement is coded with the RFC4217 value

     The TLSMECHANISM statement is coded with the ATTLS value or, if the z/OS version

    is V2R5 or higher, the TLSMECHANISM statement may also be omitted or

    commented out.

    Use the pasearch -t command to check the AT-TLS policy rule(s) that are configured for

    each of the FTP server ports. While the specific requirements of each rule must

    accommodate the capabilities of the communication partners (the FTP clients) that

    connect to the server, you should strive for the use of strong protection. If possible, use

    settings that require the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange exchange (ECDHE (preferred) or

    DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
  remediation: 'Review the configuration statements in the FTP.DATA file and ensure they conform to the

    specifications in the FTP.DATA CONFIGURATION STATEMENTS below:

    EXTENSIONS [coded with a value of AUTH_TLS]

    SECURE_FTP statement is coded with the REQUIRED value

    SECURE_CTRLCONN statement is coded with the PRIVATE value

    SECURE_DATACONN statement is coded with the PRIVATE or SAFE value

    TLSCERTCROSSCHECK [ not coded or coded with a value of TRUE]

    TLSRFCLEVEL [coded with a value of RFC4217]

    TLSMECHANISM

     If the z/OS version is V2R4 or earlier [coded with a value of ATTLS]

     If the z/OS version is V2R5 or higher [not coded or coded with a value of ATTLS].

    Use local procedures to configured AT-TLS policy rules for each of the FTP server

    ports. While the specific requirements of each rule must accommodate the capabilities

    of the communication partners (the FTP clients) that connect to the server, you should

    strive for the use of strong protection. If possible, use settings that require the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange exchange (ECDHE (preferred) or

    DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
