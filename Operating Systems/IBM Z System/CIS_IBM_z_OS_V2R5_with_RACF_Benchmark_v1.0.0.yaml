      NOTE: For systems running the TSS ACP replace the WRITE and ALLOCATE with WRITE,

      UPDATE, CREATE, CONTROL, SCRATCH, and ALL.'
    severity: medium
- id: 6.5.1
  title: Ensure configuration files for the TCP/IP stack are explicitly specified
  scoring: manual
  profile:
  - Level 1
  description: The TCP/IP stack reads two configuration files to determine values for critical operational parameters. These
    file names are specified in multiple locations and, depending on the process, are referenced differently. Because system
    security is impacted by some of the parameter settings, specifying the file names explicitly in each location reduces
    ambiguity and ensures proper operations.
  rationale: Inappropriate values could result in undesirable operations and degraded security. This exposure may result in
    unauthorized access impacting data integrity or the availability of some system services.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223827 Rule ID: SV-223827r768725_rule STIG ID: RACF-TC-000080'
  page_start: 260
  audit_raw: 'a) Display the active started tasks executing on the domain using SDSF, or equivalent

    JES display product, and locate the TCPIP started task.

    If TCPIP is inactive, review the procedure libraries defined to JES2 and locate the

    TCPIP JCL member.

    b) Ensure the following items are in effect for the TCPIP started task JCL:

    1. The PROFILE and SYSTCPD DD statements specify the TCP/IP Profile and Data

    configuration files respectively.

    2. The RESOLVER_CONFIG variable on the EXEC statement is set to the same file

    name specified on the SYSTCPD DD statement.'
  remediation: 'Review the TCP/IP started task JCL to ensure the configuration file names are specified

    on the appropriate DD statements and parameter option.

    During initialization the TCP/IP stack uses fixed search sequences to locate the

    PROFILE.TCPIP and TCPIP.DATA files. However, uncertainty is reduced, and security

    auditing is enhanced by explicitly specifying the locations of the files. In the TCP/IP

    started task’s JCL, Data Definition (DD) statements can be used to specify the locations

    of the files. The PROFILE DD statement identifies the PROFILE.TCPIP file and the SYSTCPD

    DD statement identifies the TCPIP.DATA file.

    The location of the TCPIP.DATA file can also be specified by coding the

    RESOLVER_CONFIG environment variable as a parameter of the ENVAR option in the

    TCP/IP started task’s JCL. In fact, the value of this variable is checked before the

    SYSTCPD DD statement by some processes. However, not all processes (e.g., TN3270

    Telnet Server) will access the variable to get the file location; therefore, specifying the

    file location explicitly, both on a DD statement and through the RESOLVER_CONFIG

    environment variable, reduces ambiguity.

    The systems programmer will ensure that the TCP/IP started task’s JCL specifies the

    PROFILE and SYSTCPD DD statements for the PROFILE.TCPIP and TCPIP.DATA

    configuration files and TCP/IP started task’s JCL includes the RESOLVER_CONFIG variable,

    set to the name of the file specified on the SYSTCPD DD statement.'
  checks:
  - type: manual_review
    info: 'a) Display the active started tasks executing on the domain using SDSF, or equivalent

      JES display product, and locate the TCPIP started task.

      If TCPIP is inactive, review the procedure libraries defined to JES2 and locate the

      TCPIP JCL member.

      b) Ensure the following items are in effect for the TCPIP started task JCL:

      1. The PROFILE and SYSTCPD DD statements specify the TCP/IP Profile and Data

      configuration files respectively.

      2. The RESOLVER_CONFIG variable on the EXEC statement is set to the s'
    severity: medium
- id: 6.5.2
  title: Ensure TCP/IP stack configuration defined in TCPIP.DATA
  scoring: manual
  profile:
  - Level 1
  description: During the initialization of TCP/IP servers and clients, the TCPIP.DATA configuration file provides information
    that is essential for proper operations of TCP/IP applications. The TCPIP.DATA file acts as the anchor configuration data
    set for the TCP/IP stack and all TCP/IP servers and clients running in z/OS. During the initialization of TCP/IP servers
    and clients, the TCPIP.DATA file provides basic information that is essential for proper operation.
  rationale: Inappropriate values could result in undesirable operations and degraded security. This exposure may result in
    unauthorized access impacting data integrity or the availability of some system services.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-245536 Rule ID: SV-245536r768737_rule STIG ID: RACF-TC-000100'
  page_start: 262
  audit_raw: 'Refer to the Data configuration file specified on the SYSTCPD DD statement in the TCPIP

    started task JCL.

    Verify that the following configuration statements are specified in the TCP/IP Data

    configuration file.

    TCPIPJOBNAME

    HOSTNAME

    DOMAINORIGIN

    DATASETPREFIX'
  remediation: 'The system programmer will review the configuration statements in the TCPIP.DATA file

    and ensure they conform to the specifications below:

     TCPIPJOBNAME - Specifies the job name of the TCP/IP address space. This

    name is also used as part of the name of some network security resources.

     HOSTNAME - Specifies the TCP/IP host portion of the DNS name of the system.

     DOMAINORIGIN - Specifies the default domain name used for DNS searches.

     DATASETPREFIX - Specifies the high-level qualifier to be used to dynamically

    allocate other configuration data sets.

    The above TCPIP.DATA configuration parameters provide crucial information to TCP/IP

    applications.'
  checks:
  - type: manual_review
    info: 'Refer to the Data configuration file specified on the SYSTCPD DD statement in the TCPIP

      started task JCL.

      Verify that the following configuration statements are specified in the TCP/IP Data

      configuration file.

      TCPIPJOBNAME

      HOSTNAME

      DOMAINORIGIN

      DATASETPREFIX'
    severity: medium
- id: 6.5.3
  title: Ensure Hosts identified by the NSINTERADDR statement are protected
  scoring: manual
  profile:
  - Level 1
  description: If the hosts identified by NSINTERADDR statement are not properly protected they can be stolen, damaged, or
    disturbed. Without adequate physical security, unauthorized users can access the host and the hosts' components. Therefore,
    they can interfere with the normal operations of the host.
  rationale: Improper control of hosts and the hosts' components could compromise network operations.
  impact: ''
  references: []
  page_start: 264
  audit_raw: 'Refer to the Data configuration file specified on the SYSTCPD DD statement in the TCPIP

    started task JCL.

    Gather the following information for any NSINTERADDR statement coded in the TCP/IP

    Data configuration file:

    Identify the physical location of the host running a DNS server (i.e., on-site or off-site at

    organization, city, state).

    Obtain the description of the physical security controls used to limit access to the area

    where the host is located.'
  remediation: 'Verify that if the NSINTERADDR statements are not specified in the TCP/IP Data

    configuration file, this is not applicable.

    Verify that the NSITERADDR statements specified in the TCP/IP Data configuration file.

     The NSINTERADDR statements refer to hosts connected directly to networks within

    the physical premises of the host site.

     The NSINTERADDR statements refer to hosts that are located in areas with physical

    access limited to authorized personnel.

    Ensure that the hosts and the hosts components identified in the NSINTERADDR statement

    are protected.

    Ensure that any NSINTERADDR statements coded in the TCPIP.DATA file refer to hosts

    connected directly to networks within the physical premises of the host site and located

    in areas with physical access limited to authorized personnel.'
  checks:
  - type: manual_review
    info: 'Refer to the Data configuration file specified on the SYSTCPD DD statement in the TCPIP

      started task JCL.

      Gather the following information for any NSINTERADDR statement coded in the TCP/IP

      Data configuration file:

      Identify the physical location of the host running a DNS server (i.e., on-site or off-site at

      organization, city, state).

      Obtain the description of the physical security controls used to limit access to the area

      where the host is located.'
    severity: medium
- id: 6.5.4
  title: Ensure PROFILE.TCPIP configuration statements for the TCP/IP stack are defined
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: The PROFILE.TCPIP configuration file provides system operation and configuration parameters for the TCP/IP
    stack. Inappropriate values could result in undesirable operations and degraded security. z/OS Unix directories and files
    of the Base TCP/IP component provide the configuration, operational, and executable properties of IBMs TCP/IP system product
  rationale: This exposure may result in unauthorized access impacting data integrity or the availability of some system services.
    Failure to properly secure these objects may lead to unauthorized access resulting in the compromise of the integrity
    and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223820 Rule ID: SV-223820r811018_rule STIG ID: RACF-TC-000010'
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223822 Rule ID: SV-223822r604139_rule STIG ID: RACF-TC-000030'
  page_start: 265
  audit_raw: '1. Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TCPIP started task JCL.

    2. Check that the following items are in effect for the configuration statements

    specified in the TCP/IP Profile configuration file:

    NOTE: If the INCLUDE statement is coded in the TCP/IP Profile configuration file, the

    data set specified on this statement must be checked for the following items as well.

    1. The SMFPARMS statement is not coded or commented out.

    2. The DELETE statement is not coded or commented out for production systems.

    3. The SMFCONFIG statement is coded with (at least) the FTPCLIENT and

    TN3270CLIENT operands. In addition:

    a. One or more of the ZERTDETAIL, ZERTSUMMARY and (for z/OS V2R5 and later)

    ZERTDETAILBYPOLICY are coded. Alternatively, one or more of the ZERTSERVICE,

    ZERTSUMMARY, and (for z/OS V2R5 and later) ZERTSERVICEBYPOLICY operands may

    be coded on the NETMONITOR statement if a network monitoring product is in use.

    b. The TCPSTACK operand is also recommended.

    c. The PROFILE and DVIPA operands are also recommended. Alternatively,

    PROFILE and SMFSERVICE DVIPA may be coded on the NETMONITOR statement if a

    network monitoring product is in use.

    d. If the IPsec protocol is used to protect any z/OS traffic, then IPSECURITY is also

    recommended. Alternatively, SMFSERVICE IPSECURITY may be coded on the

    NETMONITOR statement if a network monitoring product is in use.

    e. If SMC-D is in use, SMCDLINKEVENT is also recommended

    f. If SMC-R is in use, SMCRLINKEVENT is also recommended

    g. If CSSMTP is in use, the NETMONITOR statement may be coded with the

    SMFSERVICE CSMAIL CSSMTP operands.

    4. The TCPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS and TTLS

    operands. Additionally, the FINWAIT2TIME operand is coded with a value of 60 or

    less.

    5. The UDPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS operand.

    In addition, the NOUDPCHKSUM and NOUDPQUEUELIMIT operands are not coded.

    6. The IPCONFIG statement is coded with (at least) the NODATAGRAMFWD and

    IGNOREREDIRECT operands. In some cases, there will be a legitimate reason for

    having DATAGRAMFWD coded, but those scenarios should be well understood and

    documented.

    7. The GLOBALCONFIG statement is coded with (at least) the ZERT operand.

    8. The SACONFIG statement is coded with (at least) a community name other than

    "public". In addition, the SETENABLED operand must not be specified.

    Check that the z/OS Unix file system permission bits and user audit bits for each

    directory and file match or are more restrictive than the specified settings listed in the

    table.

    BASE TCP/IP HFS Object Security Settings

    File Permission Bits User Audit Bits

    /etc/hosts 0744 faf

    /etc/protocol 0744 faf

    /etc/resolv.conf 0744 faf

    /etc/services 0740 faf

    /usr/lpp/tcpip/sbin 0755 faf

    /usr/lpp/tcpip/bin 0755 faf

    NOTE: Some of the files listed above are not used in every configuration.

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

    f log for failed access attempts

    a log for failed and successful access

    - no auditing'
  remediation: 'Review the configuration statements in the PROFILE.TCPIP file and ensure they conform

    to the specifications below:

    Ensure the following items are in effect for the configuration statements specified in the

    TCP/IP Profile configuration file:

    NOTE: If the INCLUDE statement is coded in the TCP/IP Profile configuration file, the

    data set specified on this statement must be checked for the following items as well.

    1. The SMFPARMS statement is not coded or commented out.

    2. The DELETE``` statement is not coded or commented out for production

    systems.

    3. The SMFCONFIG statement is coded with (at least) the FTPCLIENT and

    TN3270CLIENT operands, as well as the following:

    a. One or more of the ZERTDETAIL, ZERTSUMMARY and (for z/OS V2R5 and later)

    ZERTDETAILBYPOLICY are coded. Alternatively, one or more of the ZERTSERVICE,

    ZERTSUMMARY, and (for z/OS V2R5 and later) ZERTSERVICEBYPOLICY operands may

    be coded on the NETMONITOR statement if a network monitoring product is in use.

    b. The TCPSTACK operand is also recommended.

    c. The PROFILE and DVIPA operands are also recommended. Alternatively,

    PROFILE and SMFSERVICE DVIPA may be coded on the NETMONITOR statement if a

    network monitoring product is in use.

    d. If the IPsec protocol is used to protect any z/OS traffic, then IPSECURITY is also

    recommended. Alternatively, SMFSERVICE IPSECURITY may be coded on the

    NETMONITOR statement if a network monitoring product is in use.

    e. If SMC-D is in use, SMCDLINKEVENT is also recommended

    f. If SMC-R is in use, SMCRLINKEVENT is also recommended

    g. If CSSMTP is in use, the NETMONITOR statement may be coded with the

    SMFSERVICE CSMAIL CSSMTP operands.

    4. The TCPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS and TTLS

    operands. Additionally, the FINWAIT2TIME operand is coded with a value of 60 or

    less.

    5. The UDPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS operand.

    and the NOUDPCHKSUM and NOUDPQUEUELIMIT operands are not coded.

    6. The IPCONFIG statement is coded with (at least) the NODATAGRAMFWD and

    IGNOREREDIRECT operands. In some cases, there will be a legitimate reason for

    having DATAGRAMFWD coded, but those scenarios should be well understood and

    documented.

    7. The GLOBALCONFIG statement is coded with (at least) the ZERT operand.

    8. The SACONFIG statement is coded with (at least) a community name other than

    "public" In addition, the SETENABLED operand must not be specified.

    BASE TCP/IP PROFILE.TCPIP CONFIGURATION STATEMENTS

    FUNCTIONS

    INCLUDE- Specifies the name of an MVS data set that contains additional PROFILE.TCPIP

    statements to be used

     It Alters the configuration specified by previous statements

    SMFPARMS- Specifies SMF logging options for some TCP applications; replaced by

    SMFCONFIG

     Controls collection of audit data

    DELETE- Specifies some previous statements, including PORT and PORTRANGE, that are to

    be deleted

     Alters the configuration specified by previous statements

    SMFCONFIG- - Specifies SMF logging options for Telnet, FTP, TCP, API, and stack

    activity

     Controls collection of audit data

    TCPCONFIG- Specifies various settings for the TCP protocol layer of TCP/IP

     Controls port access

    The systems programmer with UID(0) and/or SUPERUSER access will review the UNIX

    permission bits and user audit bits on the HFS directories and files for the Base TCP/IP

    component. Ensure they conform to the specifications in the BASE TCP/IP z/OS Unix

    File System Object Security Settings below:

    BASE TCP/IP z/OS Unix File System Object Security Settings

    File Permission Bits User Audit Bits

    /etc/hosts 0744 faf

    /etc/protocol 0744 faf

    /etc/resolv.conf 0744 faf

    /etc/services 0740 faf

    /usr/lpp/tcpip/sbin 0755 faf

    /usr/lpp/tcpip/bin 0755 faf

    Some of the files listed above (e.g., /etc/resolv.conf) are not used in every

    configuration. While the absence of a file is generally not a security issue, the existence

    of a file that has not been properly secured can often be an issue. Therefore, all

    directories and files that do exist will have the specified permission and audit bit

    settings.

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

    f log for failed access attempts

    a log for failed and successful access

    - no auditing

    The following commands can be used (from a user account with an effective UID(0)) to

    update the permission bits and audit bits:

    chmod 0744 /etc/hosts

    chaudit w=sf,rx+f /etc/hosts

    chmod 0744 /etc/protocol

    chaudit w=sf,rx+f /etc/protocol

    chmod 0744 /etc/resolv.conf

    chaudit w=sf,rx+f /etc/resolv.conf

    chmod 0740 /etc/services

    chaudit w=sf,rx+f /etc/services

    chmod 0755 /usr/lpp/tcpip/bin

    chaudit w=sf,rx+f /usr/lpp/tcpip/bin

    chmod 0755 /usr/lpp/tcpip/sbin

    chaudit w=sf,rx+f /usr/lpp/tcpip/sbin'
