    Information below). Because the RACF subsystem always holds serialization on these

    files, there is an additional step to perform after the data set encryption setup is

    complete. The NEWWORKSPACE keyword of the TARGET command can be used to change

    the files being used to new ones that are set up for encryption. The same command can

