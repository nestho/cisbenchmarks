- id: 8.1.1
  title: Ensure that JES2 system commands are protected
  scoring: manual
  profile:
  - Level 1
  description: JES2 system commands are used to control JES2 resources and the operating system environment. Failure to properly
    control access to JES2 system commands could result in unauthorized personnel issuing sensitive JES2 commands.
  rationale: If commands are not protected, this may threaten the integrity and availability of the operating system environment
    and compromise the confidentiality of customer data. While JES2 operator commands cannot directly access sensitive data,
    it could change the routing of data such that it is available in an inappropriate environment.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223754 Rule ID: SV-223754r604139_rule STIG ID: RACF-JS-000100'
  page_start: 354
  audit_raw: 'The JES2.** resource must be defined to the OPERCMDS class with a default access

    of NONE and with resource defined so that the security product logs all access.

    Access to JES2 system commands must be restricted to the appropriate personnel

    (e.g., operations staff, systems programming personnel, general users).'
  remediation: 'Extended MCS support allows the installation to control the use of JES2 system

    commands through RACF. These commands are subject to various types of potential

    abuse. For this reason, it is necessary to place restrictions on the JES2 system

    commands that can be entered by particular operators.

    Some commands are particularly dangerous and should only be used when less drastic

    options have been exhausted. Misuse of these commands can create a situation in

    which the only recovery is an IPL.

    To control access to JES2 system commands, apply the following recommendations

    when implementing security:

    1. Define the JES2.** resource in the OPERCMDS class with a default access of

    NONE and defined so that the security product logs all access.

    2. Define specific JES2 system commands to RACF and restrict access to the

    appropriate personnel (e.g., operations staff, systems programming personnel,

    general users).

    RDEFINE OPERCMDS JES2.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ)) `

    PERMIT JES2.** CL(OPERCMDS) ID(SYSOPER) ACC(UPDATE)

    SETROPTS RACL(OPERCMDS) REF'
  checks:
  - type: manual_review
    info: 'The JES2.** resource must be defined to the OPERCMDS class with a default access

      of NONE and with resource defined so that the security product logs all access.

      Access to JES2 system commands must be restricted to the appropriate personnel

      (e.g., operations staff, systems programming personnel, general users).'
    severity: medium
- id: 8.2.1
  title: Ensure that JESSPOOL CLASS is active
  scoring: manual
  profile:
  - Level 1
  description: JESSPOOL resources controls access to data stored on the JES SPOOL data sets. This includes all SYSOUT and
    instream data set, JCL, SYSLOG, JESTRACE, and JESNEWS data sets stored on spool and the control blocks that represent
    those data set. Failure to properly control JES2 spool resources could result in unauthorized personnel accessing job
    output, system activity logs, and trace data containing user ID and password information.
  rationale: If the JESSPOOL class is not active, the integrity and availability of the operating system environment is compromised,
    and potentially sensitive customer data is exposed. Failure to set the JESSPOOL class active and properly protect the
    resources covered by the JESSPOOL class could allow access to any data stored on the JES spool.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223750 Rule ID: SV-223750r604139_rule STIG ID: RACF-JS-000060'
  page_start: 357
  audit_raw: Ensure that the JESSPOOL resource class is active
  remediation: 'Ensure that the JESSPOOL resource class is active:

    Use RACF Command:

    SETROPTS CLASSACT(JESSPOOL).

    Note that you should also enable GENERICS and optionally RACLIST this class in

    memory.

    SETROPTS GENERIC(JESSPOOL) GENCMD(JESSPOOL)

    SETROPTS RACLIST(JESSPOOL)

    Resources in the JESSPOOL class are not required for a user to access data that they

    own or a SYSOUT data set that is destined to the user (via the WRITER= or DEST=).'
  checks:
  - type: manual_review
    info: Ensure that the JESSPOOL resource class is active
    severity: medium
- id: 8.2.2
  title: Ensure that JES2 spool resources are protected
  scoring: manual
  profile:
  - Level 1
  description: JESSPOOL resources controls access to data stored on the JES SPOOL data sets. This includes all SYSOUT and
    instream data set, JCL, SYSLOG, JESTRACE, and JESNEWS data sets stored on spool and the control blocks that represent
    those data set. Failure to properly control JES2 spool resources could result in unauthorized personnel accessing job
    output, system activity logs, and trace data containing user ID and password information. This exposure may threaten the
    integrity and availability of the operating system environment and compromise the confidentiality of customer data.
  rationale: Failure to manager access to resources in the JESSPOOL class may threaten the integrity and availability of the
    operating system environment and compromise the confidentiality of customer data. Failure to set the JESSPOOL class active
    and properly protect the resources covered by the JESSPOOL class could allow access to any data stored on the JES spool.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223753 Rule ID: SV-223753r604139_rule STIG ID: RACF-JS-000090'
  page_start: 358
  audit_raw: 'Verify that the accesses to the JESSPOOL resources are properly restricted.

    Resources in the JESSPOOL class are not required for a user to access data that they

    own or a SYSOUT data set that is destined to the user (via the WRITER= or DEST=).

    Review the JESSPOOL report for resource permissions with the following naming

    convention. These profiles may be fully qualified, be specified as generic, or be

    specified with masking as indicated below:

    localnodeid.userid.jobname.jobid.dsnumber.name

    localnodeid The name of the NJE node on which the SYSIN or SYSOUT data set

    currently resides.

    userid The user ID associated with the job (or data set). This is the user ID RACF uses

    for validation purposes when the job runs (or the SYSOUT is created).

    jobname The name that appears in the name field of the JOB statement.

    jobid The job number JES2 assigned to the job.

    dsnumber The unique data set number JES2 assigned to the spool data set. A “D” is

    the first character of this qualifier.

    name The name of the data set specified in the DSN= parameter of the DD statement. If

    the JCL did not specify DSN= on the DD statement that creates the spool data set, JES2

    uses a question mark (?).

    Additional special purpose JESSPOOL resources:

     Localnodeid.userid.SYSLOG.SYSTEM.sysname is used to protect the logical

    SYSLOG data set associated with the system sysname. The user ID is generally

    set to “+MASTER+”.

     Localnodeid.userid.jobname.jobid.jes_dsname is used to protect certain specific

    JES data sets associated with a job. jes_dsname_ is one of EVENTLOG, JCL,

    JESJCL, JESMSGLG, or JESYSMSG.

    All users have access to their own JESSPOOL resources without the need for profiles in

    the JESSPOOL class.

    The localnodeid. resource will be restricted to only system programmers, operators, and

    automated operations personnel with access of ALTER. All access will be logged.

    (localnodeid. resource includes all generic and/or masked permissions, example:

    localnodeid.**, localnodeid.*, etc).

    The JESSPOOL localnodeid.userid.jobname.jobid.dsnumber.name, whether generic

    and/or masked, can be made available to users, when approved by the IAO. Access will

    be identified at the minimum access for the user to accomplish the users function.

    UPDATE, CONTROL, and ALTER access will be logged. An example is team members

    within a team, providing the capability to view, help, and/or debug other team member

    jobs/processes.'
  remediation: 'The JESSPOOL resources may be fully qualified, be specified as generic, or be

    specified with masking as indicated above.

    By default, a user has access only to that user’s own JESSPOOL resources. However,

    situations exist where a user legitimately requires access to jobs that run under another

    user’s user ID. In particular, if a user routes SYSOUT to an external writer, the external

    writer should have access to that user’s SYSOUT.

    The localnodeid. resource will be restricted to only system programmers, operators,

    and automated operations personnel with access of ALTER. All access will be logged.

    (localnodeid. resource includes all generic and/or masked permissions, example:

    localnodeid.**, localnodeid.*, etc)

    RDEF JESSPOOL localnodeid.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''PROTECT JESSPOOL AT HIGH LEVEL'')

    PE localnodeid.** CL(JESSPOOL) ID(syspaudt) ACC(A)

    The JESSPOOL localnodeid.userid.jobname.jobid.dsnumber.name, whether generic

    and/or masked, can be made available to users, when approved by the IAO. Access will

    be identified at the minimum access for the user to accomplish the users function,

    SERVICE(READ, UPDATE, DELETE, ADD). All access will be logged. An example is

    team members within a team, providing the capability to view, help, and/or debug other

    team member jobs/processes. If frequent situations occur where users working on a

    common project require selective access to each other''s jobs, then the installation may

    delegate to the individual users the authority to grant access, but only with the approval

    of the IAO.

    RDEF JESSPOOL localnode.userid.jobname.jobid.dsnumber.name –

    UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ)) –

    DATA(''PROTECT JESSPOOL'')

    PE _localnode.userid.jobname.jobid.dsnumber.name_ CL(JESSPOOL) ID() ACC(R)

    If IBM’s SDSF product is installed on the system, resources defined to the JESSPOOL

    resource class control functions related to jobs, output groups, and SYSIN/SYSOUT

    data sets on various SDSF panels.'
  checks:
  - type: manual_review
    info: 'Verify that the accesses to the JESSPOOL resources are properly restricted.

      Resources in the JESSPOOL class are not required for a user to access data that they

      own or a SYSOUT data set that is destined to the user (via the WRITER= or DEST=).

      Review the JESSPOOL report for resource permissions with the following naming

      convention. These profiles may be fully qualified, be specified as generic, or be

      specified with masking as indicated below:

      localnodeid.userid.jobname.jobid.dsnumber.name

      localno'
    severity: medium
- id: 8.2.3
  title: Ensure that JES2 trace resources are protected
  scoring: manual
  profile:
  - Level 1
  description: 'The JES2 tracing facility can be used to diagnose various problems that can occur in JES2. The data being
    logged may contain sensitive data and could include:  Data from instream data set  Data from SYSOUT data sets with PI
    data  JCL statements including JOB cards potentially with passwords  NJE headers including JOB headers potentially with
    passwords SYSOUT containing this trace data is associated with the $TRCLOG job and is protected by resources in the JESSPOOL
    class. Failure to protect this resource may compromise the confidentiality of customer data.'
  rationale: Since all trace data is intended to diagnose problems with how the system manages data, there are cases where
    that data may contain sensitive information. All trace diagnostic data should be treated as if it contains sensitive data
    and protected from unauthorized access.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223752 Rule ID: SV-223752r767089_rule STIG ID: RACF-JS-000080'
  page_start: 362
  audit_raw: 'Review the following resources defined to the JESSPOOL resource class:

    localnodeid.jesid.$TRCLOG.jobid.dsnumber.JESTRACE

    NOTE: These resource profiles may be more generic as long as they pertain directly to

    the JESTRACE data sets. For example:

    localnodeid.jesid.$TRCLOG.*.*.JESTRACE

    NOTE: Review the JES2 parameters to determine the localnodeid by searching for

    OWNNODE in the NJEDEF statement, and then searching for NODE(nnnn) (where nnnn is the

    value specified by OWNNODE). The NAME parameter value specified on this NODE

    statement is the localnodeid.

    Another method is to issue the JES2 command $D NODE,NAME,OWNNODE=YES to obtain the

    NAME of the OWNNODE.

    Ensure that access authorization for the resources mentioned above is restricted to

    Systems personnel and security administrators responsible for diagnosing JES2 and

    z/OS problems.'
  remediation: 'Ensure the following resources are defined to the JESSPOOL resource class with a

    UACC(NONE):

    localnodeid.jesid.$TRCLOG.jobid.*.JESTRACE

    Where localnodeid is the local NJE node, jesid is the user ID assigned to the JES2

    address space, and jobid is the jobid of the $TRCLOG job.'
  checks:
  - type: manual_review
    info: 'Review the following resources defined to the JESSPOOL resource class:

      localnodeid.jesid.$TRCLOG.jobid.dsnumber.JESTRACE

      NOTE: These resource profiles may be more generic as long as they pertain directly to

      the JESTRACE data sets. For example:

      localnodeid.jesid.$TRCLOG.*.*.JESTRACE

      NOTE: Review the JES2 parameters to determine the localnodeid by searching for

      OWNNODE in the NJEDEF statement, and then searching for NODE(nnnn) (where nnnn is the

      value specified by OWNNODE). The NAME parameter valu'
    severity: medium
- id: 8.2.4
  title: Ensure that JESNEWS resources are protected
  scoring: manual
  profile:
  - Level 1
  description: JESNEWS is a spool data set that is added after the job separator when SYSOUT is printed. Installation use
    this facility to communicate information to their user community. Ensure that access authorization for updating JESNEWS
    is restricted to appropriate personnel (i.e., users responsible for maintaining the JES News data set). Printing the JESNEWS
    spool data set requires that the owner of the SPOOL data set being printed have access to the JESSPOOL profile protected
    the JESSPOOL data set.
  rationale: JESNEWS is intended to print information to a wide group of users of the system. The ability to create or delete
    a JESNEWS data set should be limited to system personnel.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223751 Rule ID: SV-223751r604139_rule STIG ID: RACF-JS-000070'
  page_start: 364
  audit_raw: 'Audit Procedure:

    Ensure the following items are in effect:

     The jesname.UPDATE.JESNEWS resource is defined to the OPERCMDS resource

    class with a default access of NONE and all access is logged.

    NOTE: jesname is typically the name of the JES2 subsystem. Refer to the SUBSYS

    report and locate the entry with the description of PRIMARY JOB ENTRY

    SUBSYSTEM. The SUBSYSTEM NAME of this entry is the name of the JES2

    subsystem.

     Access authorization to the jesname.UPDATE.JESNEWS resource in the OPERCMDS

    class restricts CONTROL access to the appropriate personnel (i.e., users

    responsible for maintaining the JES News data set) and all access is logged.

    Printing the JESNEWS spool data set requires that the owner of the SPOOL data

    set being printed have READ access to the JESSPOOL profile

    localnodeid.jesid.$JESNEWS.jobid.dsnumber.JESNEWS

    NOTE: These resource profiles may be more generic as long as they pertain directly to

    the JESNEWS data sets. For example:

    localnodeid.jesid.$JESNEWS.*.*.JESNEWS

    If JESNEWS is being used, a UACC of READ is used for the JESSPOOL resource

    controlling access to the JESNEWS data set.'
  remediation: 'Ensure the following items are in effect:

    1. The jesname.UPDATE.JESNEWS resource is defined to the OPERCMDS resource

    class with a default access of NONE and all access is logged.

    NOTE: jesname is typically the name of the JES2 subsystem. Refer to the

    SUBSYS report and locate the entry with the description of PRIMARY JOB

    ENTRY SUBSYSTEM. The SUBSYSTEM NAME of this entry is the name of the

    JES2 subsystem.

    2. Access authorization to the jesname.UPDATE.JESNEWS resource in the

    OPERCMDS class restricts CONTROL access to the appropriate personnel (i.e.,

    users responsible for maintaining the JES News data set) and all access is

    logged.

    Examples of setting up proper protection are shown here:

    RDEF OPERCMDS JES2.UPDATE.JESNEWS UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    DATA(''MANAGE JESNEWS FUNCTION'')

    PERMIT JES2.UPDATE.JESNEWS CLASS(OPERCMDS) ID() ACCESS(CONTROL)'
  checks:
  - type: manual_review
    info: 'Audit Procedure:

      Ensure the following items are in effect:

       The jesname.UPDATE.JESNEWS resource is defined to the OPERCMDS resource

      class with a default access of NONE and all access is logged.

      NOTE: jesname is typically the name of the JES2 subsystem. Refer to the SUBSYS

      report and locate the entry with the description of PRIMARY JOB ENTRY

      SUBSYSTEM. The SUBSYSTEM NAME of this entry is the name of the JES2

      subsystem.

       Access authorization to the jesname.UPDATE.JESNEWS resource in the OPERCMDS'
    severity: medium
- id: 8.3.1
  title: Ensure that JESJOBS CLASS is set up
  scoring: manual
  profile:
  - Level 1
  description: The JESJOBS class controls access to job level resources. The high-level qualifier for entities in this class
    are used to specify which functions are being controlled. When defining resources in the JESJOBS class, avoid generic
    high-level qualifiers such as ‘*’ as these could have impacts beyond the original intended purpose (especially as new
    resources are added to the class).
  rationale: The JESJOBS class is used to control actions against jobs and the ability to access job related data. These types
