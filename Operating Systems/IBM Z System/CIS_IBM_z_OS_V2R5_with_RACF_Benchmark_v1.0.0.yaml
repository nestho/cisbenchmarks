- id: 7.1.2
  title: Ensure that the ICSF Started Task is protected
  scoring: manual
  profile:
  - Level 1
  description: ICSF can be started via a started task. On z/OS, a started task should have a protection profile in the STARTED
    class that has neither the PRIVILEGED nor TRUSTED attribute, and the user ID identified in the STDATA field is neither
    UID(0) nor SPECIAL.
  rationale: As a started task on a z/OS system, the ICSF started task must have a protection profile in the STARTED class
    to limit its abilities to impact other tasks running on the system. By ensuring the started task is neither TRUSTED nor
    PRIVILEGED, and ensuring the user ID associated with the started task is neither UID(0) nor SPECIAL, it ensures the ICSF
    address space is isolated from the rest.
  impact: ''
  references:
  - '1. z/OS ICSF for RACF Security Technical Implementation Guide :: Version 6,'
  - '2. Vul ID: V-224516, Rule ID: SV-224516r520411_rule, , STIG ID: ZICSR032,'
  page_start: 312
  audit_raw: 'The ICSF started task must have a protection profile in the STARTED class that is neither

    TRUSTED nor PRIVILEGED.

    The USER in the STDATA field for the protection profile should be neither UID(0) nor

    SPECIAL.

    To find the name of the ICSF started task, use the command:

    SEARCH CLASS(STARTED)

    To identify the USER, TRUSTED, and PRIVILEGED attributes of the ICSF started task, use

    the command:

    RLIST STARTED <ICSF started task name> STDATA

    To determine if the user id UID(0) or SPECIAL, use the command:

    LISTUSER <userid> OMVS'
  remediation: 'Create a protection profile in the STARTED class for the ICSF started task.

    To create a protection profile in the DATASET class for a specific dataset and ensure the

    default permission is NONE, use the following command:

    RDEFINE STARTED <ICSF started task name> UACC(NONE) STDATA(PRIVILEGED(NO)

    TRUSTED(NO) USER(<userid>)

    To change the attributes of the user ID specified in the STDATA(USER(userid)) field,

    please see the RACF ALTUSER command.'
  checks:
  - type: manual_review
    info: 'The ICSF started task must have a protection profile in the STARTED class that is neither

