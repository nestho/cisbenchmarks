- id: 7.2.4
  title: Ensure ICSF Key Data Sets have a system backup
  scoring: manual
  profile:
  - Level 1
  description: ICSF stores key material in data sets known as “Key Data Sets”, KDS. Symmetric keys (AES, DES, HMAC) are stored
    in the CKDS, asymmetric keys (RSA, ECC, QSA) are stored in the PKDS, and PKCS#11 tokens and objects are stored in the
    TKDS. These datasets need to be included in an installation's backup procedure.
  rationale: To prevent the permanent loss of key material, and thus the loss of encrypted data, ICSF’s key data sets must
    be backed up according to installation procedures.
  impact: ''
  references: []
  page_start: 325
  audit_raw: 'Ensure all ICSF Key Data Sets are included in the system’s backup procedure. The

    names of the Key Data Sets can be found by executing the following operator

    command:

    DISPLAY ICSF,KDS'
  remediation: Add the ICSF Key Data Sets to the system’s backup procedure.
  checks:
  - type: manual_review
    info: 'Ensure all ICSF Key Data Sets are included in the system’s backup procedure. The

      names of the Key Data Sets can be found by executing the following operator

      command:

      DISPLAY ICSF,KDS'
    severity: medium
- id: 7.2.5
  title: Ensure ICSF Master Keys have a backup procedure
  scoring: manual
  profile:
  - Level 1
  description: In the context of ICSF, a “master key” is a key that is loaded and stored on a Crypto Express Coprocessor,
    whether configured in CCA mode or EP11 mode. This master key is used to encipher key material when it exists outside the
    boundary of the CEX coprocessor, and thus is required to make the key material usable. It is critical that the master
    key values can be recovered if needed.
  rationale: ICSF’s operational keys are enciphered using the Crypto Express master key, thus if the master key is lost or
    damaged, the key material stored in ICSF Key Data Sets are not usable. It is critical that the master key values be backed
    up such that if needed, the master key registered on the Crypto Express Coprocessor can be restored to their correct values
    so operational keys in ICSF can continue to be used.
  impact: ''
  references: []
  page_start: 326
  audit_raw: "Ensure there is a procedure in place to backup the values of the master keys installed\non the Crypto Express\
    \ Coprocessors active on the system. To see what master keys\nare active, enter the following operator command:\nDISPLAY\
    \ ICSF,MKS\nEg:\nFEATURE SERIAL# STATUS AES DES ECC RSA P11\n 7C00 99EA6055 Active A A A A\nIn the above case, the AES,\
    \ DES, ECC, and RSA master keys are active and must be part of\nbackup procedure. The Enterprise PKCS#11 master key is\
    \ not active."
  remediation: Create a procedure for backing up and restoring the Crypto Express master keys.
  checks:
  - type: manual_review
    info: "Ensure there is a procedure in place to backup the values of the master keys installed\non the Crypto Express Coprocessors\
      \ active on the system. To see what master keys\nare active, enter the following operator command:\nDISPLAY ICSF,MKS\n\
      Eg:\nFEATURE SERIAL# STATUS AES DES ECC RSA P11\n 7C00 99EA6055 Active A A A A\nIn the above case, the AES, DES, ECC,\
      \ and RSA master keys are active and must be part of\nbackup procedure. The Enterprise PKCS#11 master key is not active."
    severity: medium
- id: 7.2.6
  title: Ensure all ICSF Key Data Sets are in Common Record Format
  scoring: manual
  profile:
  - Level 1
  description: The format of ICSF Key Data Sets have evolved over time. The most recent format, referred to as “Common Record
    Format” or KDSR, is recommended as it enables features such as key reference date tracking.
  rationale: The ICSF Key Data Sets must be in KDSR format in order to enable advanced security features such as key reference
    date tracking.
  impact: ''
  references: []
  page_start: 328
  audit_raw: "To discover the format of each ICSF KDS, enter the following operator command:\nDISPLAY ICSF,KDS\nEg:\nCKDS\
    \ ISFTEST.BPETTI.CKDS.KDSRL\n FORMAT=KDSRL SYSPLEX=N MKVPs=DES AES\n DES MKVP date=Unknown\n AES MKVP date=Unknown\nPKDS\
    \ ISFTEST.BPETTI.PKDS.KDSRL\n FORMAT=KDSRL SYSPLEX=N MKVPs=RSA ECC\n RSA MKVP date=Unknown\n ECC MKVP date=Unknown\nTKDS\
    \ ISFTEST.BPETTI.TKDS.KDSR2\n FORMAT=KDSRL SYSPLEX=N MKVPs=P11 RCS\n P11 MKVP date=Unknown\nIn the above example, all\
    \ KDS are in KDSRL (KDSR “long”) format, which allows the\nenabling of features like key reference date tracking."
  remediation: 'To convert a key data set to common record format using the ICSF panels, do the

    following:

    1. On the ICSF Primary Menu panel, select option 2, KDS MANAGEMENT and press

    ENTER.

    2. When the ICSF Key Data Set Management panel appears, select the type of key

    data set you want to

    convert and press ENTER.

    3. On the next panel, select the COORDINATED xKDS CONVERSION option and press

    ENTER.

    4. When the ICSF Coordinated KDS conversion panel appears, fill in the required

    fields and press ENTER.'
  checks:
  - type: manual_review
    info: "To discover the format of each ICSF KDS, enter the following operator command:\nDISPLAY ICSF,KDS\nEg:\nCKDS ISFTEST.BPETTI.CKDS.KDSRL\n\
      \ FORMAT=KDSRL SYSPLEX=N MKVPs=DES AES\n DES MKVP date=Unknown\n AES MKVP date=Unknown\nPKDS ISFTEST.BPETTI.PKDS.KDSRL\n\
      \ FORMAT=KDSRL SYSPLEX=N MKVPs=RSA ECC\n RSA MKVP date=Unknown\n ECC MKVP date=Unknown\nTKDS ISFTEST.BPETTI.TKDS.KDSR2\n\
      \ FORMAT=KDSRL SYSPLEX=N MKVPs=P11 RCS\n P11 MKVP date=Unknown\nIn the above example, all KDS are in KDSRL (KDSR “long”)\
      \ format, which allows "
    severity: medium
- id: 7.2.7
  title: Ensure all ICSF Key Data Sets are enabled for sysplex sharing
  scoring: manual
  profile:
  - Level 1
  description: For ICSF to share key material across a sysplex, the ICSF Installation Options Dataset must contain the following
    keywords. SYSPLEXCKDS SYSPLEXPKDS SYSPLEXTKDS
  rationale: When the ICSF Key Datasets are shared among members of a sysplex, it is critical that updates to the data sets
    are communicated across all members of the sysplex group. To enable the sysplex communication, the ICSF Installation Options
    Dataset must contain the appropriate sysplex enablement keywords.
  impact: ''
  references: []
  page_start: 330
  audit_raw: 'To determine the sysplex settings for each ICSF Key Data Set, use the Installation

    Option Display ISPF utility.

    From the ICSF Primary Menu panel, select option 3 OPSTAT.

    From the ICSF Installation Options panel, select option 1 OPTIONS

    The sysplex settings for the ICSF Key Datasets are shown as for example:

    SYSPLEXCKDS Sysplex consistency for CKDS updates NO,FAIL(NO)

    SYSPLEXPKDS Sysplex consistency for PKDS updates NO,FAIL(NO)

    SYSPLEXTKDS Sysplex consistency for TKDS updates NO,FAIL(NO)'
  remediation: 'There is no dynamic activation for the KDS sysplex keywords in the installation options

    dataset. To enable sysplex communication, add the following keywords to the ICSF

    Installation Options Dataset and stop/restart ICSF.

    SYSPLEXCKDS(YES,FAIL(YES))

    SYSPLEXPKDS(YES,FAIL(YES))

    SYSPLEXTKDS(YES,FAIL(YES))'
  checks:
  - type: sql
    command: select option 3 OPSTAT.
    severity: medium
    info: 'To determine the sysplex settings for each ICSF Key Data Set, use the Installation

      Option Display ISPF utility.

      From the ICSF Primary Menu panel, select option 3 OPSTAT.

      From the ICSF Installation Options panel, select option 1 OPTIONS

