      batch job that sends mail through CSSMTP should use the `STARTTLS` command to

      specifically request TLS protection of its outbound mail to th'
    severity: medium
- id: 6.1.4
  title: Ensure CSSMTP STC data sets are protected.
  scoring: manual
  profile:
  - Level 1
  description: The IBM Communications Server Simple Mail Transfer Protocol (CSSMTP) STC uses privileged functions and accesses
    to sensitive data. The data sets CSSMTP relies upon for its configuration, runtime environment and operation must be properly
    protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data.
  rationale: Failure to properly restrict access to their data sets could result in violating the integrity of the base product
    which could result in compromising the operating system or sensitive data.
  impact: ''
  references:
  - '1. z/OS CSSMTP for RACF STIG :: Version 6, Release: 5 Benchmark Date: 27 Oct'
  - '2. Vul ID: V-17067 Rule ID: SV-89725r2_rule STIG ID: ZSMTR001 Severity: CAT II'
  page_start: 207
  audit_raw: 'Verify that access to the IBM Communications Server Simple Mail Transfer Protocol

    (CSSMTP) STC data sets are properly restricted. The data sets to be protected are

    identified in the data set referenced in the DD statements of the CSSMTP started

    task(s) and/or batch job(s).

    Check that the following guidance is true.

     The RACF data set access authorizations restrict READ access to auditors.

     The RACF data set access authorizations restrict WRITE and/or greater access to

    systems programming personnel.

     The RACF data set access authorizations restrict WRITE and/or greater access to

    the product STC(s) and/or batch job(s).

     The RACF data set access authorizations specify UACC(NONE) and NOWARNING.'
  remediation: 'Ensure that WRITE and/or greater access to the IBM Communications Server Simple

    Mail Transfer Protocol (CSSMTP) STC data sets are limited to system programmers

    and CSSMTP STC and/or batch jobs only. READ access can be given to auditors at the

    ISSOs discretion.

    The installing Systems Programmer will identify and document the product data sets

    and categorize them according to who will have what type of access and if required

    which type of access is logged. The installing systems programmer will identify any

    additional groups requiring access to specific data sets, and once documented the

    installing systems programmer will work with the ISSO to see that they are properly

    restricted to the ACP (Access Control Program) active on the system.

    Note: The data sets and/or data set prefixes identified below are examples of a possible

    installation. The actual data sets and/or prefixes are determined when the product is

    actually installed on a system through the product’s installation guide and can be site

    specific.

    The following commands are provided as an example for implementing data set

    controls:

    ad ''sys3.cssmtp.**'' uacc(none) owner(sys3) -

    audit(failures(read)) -

    data(''CSSMTP Output Data'')

    pe ''sys3.cssmtp.**'' id(syspaudt) acc(a)

    pe ''sys3.cssmtp.**'' id(tstcaudt) acc(a)

    pe ''sys3.cssmtp.**'' id(smptstc) acc(a)

    pe ''sys3.cssmtp.**'' id(audtaudt) acc(r)'
  checks:
