- id: 6.6.2
  title: Ensure VTAM session setup controls for the TN3270E Telnet Server are configured
  scoring: manual
  profile:
  - Level 1
  description: After a connection from a Telnet client to the TN3270E Telnet Server has been established, the process of session
    setup with a VTAM application occurs. A number of BEGINVTAM statements must be coded in a specific configuration to ensure
    adequate control to VTAM applications is maintained. The appropriate statements must be coded to ensure adequate security
    of the established SNA sessions.
  rationale: Failure to code the appropriate statements could result in unauthorized access to the host and application resources.
    This exposure may impact data integrity or the availability of some system services.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223834 Rule ID: SV-223834r604139_rule STIG ID: RACF-TN-000050'
  page_start: 290
  audit_raw: 'a) Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TN3270E Telnet Server started task JCL. The TN3270E Telnet Server profile is often

    called the "Telnet profile."

    b) Ensure the following items are in effect for the configuration statements specified in

    the Telnet profile file:

    NOTE: If the INCLUDE statement is coded in the Telnet profile, the data set specified on

    this statement must be checked for the following items as well.

    1. Within each BEGINVTAM statement block, one BEGINVTAM USSTCP statement is

    coded that specifies only the table name operand. No client identifier, such as

    host name or IP address, is specified so the statement applies to all connections

    not otherwise controlled.

    2. The USS table specified on each “backstop” USSTCP statement mentioned in Item

