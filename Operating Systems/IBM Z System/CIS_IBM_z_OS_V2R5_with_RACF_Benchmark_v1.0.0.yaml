  title: Ensure that Logon statistics are recorded
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS INITSTATS specifies that statistics available during RACF user verification are to be recorded. These
    statistics include the date and time the user was verified by RACF, the number of user verifications that specified a
    particular group, and the date and time of the user last requested verification with a particular group. If you specify
    INACTIVE, REVOKE, or WARNING, INITSTATS must be in effect. For applications that specify the APPL operand on the RACROUTE
    REQUEST=VERIFY macro, you can define a profile in the APPL class to specify that the application needs only daily statistics
    recorded for its users. To do this, specify the RACF-INITSTATS(DAILY) string in the APPLDATA field. Ensure strong security
    controls by recording statistics of RACF user verification.
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. In addition, failure
    to establish standardized settings for the RACF options introduces the possibility of exposure during migration process
    or contingency plan activation.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 V-266'
  page_start: 171
  audit_raw: 'Issue the command:

    SETROPTS LIST

    Look for INITSTATS in ATTRIBUTES = session:

    E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC)

    INITSTATS is not listed as one of the ATTRIBUTES under SETR LIST.'
  remediation: 'Active INITSTATS by issuing the command:

    SETR INITSTATS'
  checks:
  - type: manual_review
    info: 'Issue the command:

      SETROPTS LIST

      Look for INITSTATS in ATTRIBUTES = session:

      E.g. ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC)

      INITSTATS is not listed as one of the ATTRIBUTES under SETR LIST.'
    severity: medium
- id: '3.6'
  title: Ensure RACF AUDITOR or ROAUDIT privilege is assigned only to users with auditing mission.
  scoring: scored
  profile:
  - Level 1
  description: A user having the AUDITOR attribute has the authority to specify logging options, gives control of logging
    SMF data and list auditing information.
  rationale: With the AUDITOR attribute, a user could alter SMF logging data so no trace of the activity could be found. This
    could destroy audit trace information for RACF system. This attribute should be limited to a minimum number of people.
    This also applies to the use of Group-Auditor in cases where users are connected to sensitive system dataset HLQ or general
    resource owning groups with Group-Auditor. Alternatively, the ROAUDIT attribute can be assigned to users who are responsible
    for auditing RACF but who are not responsible for setting up or changing the auditing options/controls.
  impact: ''
  references: []
  page_start: 173
  audit_raw: 'Assure that only audit team personnel have the AUDITOR or ROAUDIT attribute. Only audit

    personnel who are responsible for setting up or changing the auditing options/controls

    should have the AUDITOR attribute.'
  remediation: 'Remove the AUDIT or ROAUDIT attribute to users who are not responsible for auditing

    RACF. Replace the AUDIT attribute by the ROAUDIT attribute for users who are

    responsible for auditing RACF but who are not responsible for setting up or changing

    the auditing options/controls.'
  checks:
  - type: manual_review
    info: 'Assure that only audit team personnel have the AUDITOR or ROAUDIT attribute. Only audit

      personnel who are responsible for setting up or changing the auditing options/controls

      should have the AUDITOR attribute.'
    severity: medium
- id: '3.7'
  title: Ensure that effective SMF records collection options are set
  scoring: scored
  profile:
  - Level 1
  description: SMF data collection provides a standardized method for recording all system activity to a recording media (file
    or logstream). including the audit trails from RACF. Some recording options are mandatory to ensure an effective recording
    of the activity and therefore complete audit trails.
  rationale: If the control options for the recording is not set correctly, system audit could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223769 Rule ID: SV-223769r604139_rule STIG ID: RACF-OS-000130'
  page_start: 174
  audit_raw: 'Using the D SMF,.O z/OS command, verify that the following parameters are set:

    ACTIVE – Ensure SMF recording is to be active.

    JWT(nn) - Where nn < 15. Specifies the maximum amount of time (hhmm) that a job or

    TSO/E user address space is allowed to wait continuously.

    MAXDORM(0500) - It specifies the amount of real time (hhmm) that SMF allows data to

    remain in an SMF buffer before it is written to a recording data set or a log stream

    SYS(DETAIL) - Specifies the level of SMF data collection for TSO and STC'
  remediation: Modify the SMFPRMxx parmlib member to include the recommended options.
  checks:
  - type: manual_review
    info: 'Using the D SMF,.O z/OS command, verify that the following parameters are set:

      ACTIVE – Ensure SMF recording is to be active.

      JWT(nn) - Where nn < 15. Specifies the maximum amount of time (hhmm) that a job or

      TSO/E user address space is allowed to wait continuously.

      MAXDORM(0500) - It specifies the amount of real time (hhmm) that SMF allows data to

      remain in an SMF buffer before it is written to a recording data set or a log stream

      SYS(DETAIL) - Specifies the level of SMF data collection for TSO'
    severity: medium
- id: '3.8'
  title: Ensure that an automated process is in place to collect and retain SMF data
  scoring: manual
  profile:
  - Level 1
  description: SMF data collection provides a standardized method for recording all system activity to a recording media (file
    or logstream). including the audit trails from RACF.
  rationale: Failure to collect and manage adequate retention of SMF records can result in the loss of critical system data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223771 Rule ID: SV-223771r604139_rule STIG ID: RACF-OS-000150'
  page_start: 176
  audit_raw: 'Review SMF data collection and retention processes. Ensure that the processes utilized

    include a process which is automatically started to dump SMF collection files

    immediately upon their becoming full.

    To ensure that all SMF data is collected in a timely manner, and to reduce the risk of

    data loss.'
  remediation: 'Ensure that automated mechanisms are in place to collect and retain all SMF data

    produced on the system. Dump the SMF files (MANx) in systems based on the following

    guidelines:

    1. Dump each SMF file as it fills up during the normal course of daily processing.

    2. Dump all remaining SMF data at the end of each processing day.

    The same procedure applies if you use LOGSTREAMS.'
  checks:
  - type: manual_review
    info: 'Review SMF data collection and retention processes. Ensure that the processes utilized

      include a process which is automatically started to dump SMF collection files

      immediately upon their becoming full.

      To ensure that all SMF data is collected in a timely manner, and to reduce the risk of

      data loss.'
    severity: medium
- id: '3.9'
  title: Ensure that Required SMF data record types is collected
  scoring: scored
  profile:
  - Level 1
  description: SMF data collection provides a standardized method for recording all system activity to a recording media (file
    or logstream). including the audit trails from RACF. All SMF records are uniquely identified by a type and an optional
    subtype value. The type and subtype values reside in the header portion of the SMF record. A record type can reside in
    the Standard SMF record header or in the Extended SMF record header. Subtype values always reside in the Standard SMF
    record header. From a Security perspective, the following record types are mandatory to be collected30 - Common address
    space work. 80 - Security Product Processing 81 - RACF Initialization 100/102- Db2 Statistics Db2 Performance 119 - TCP/IP
    Statistics
  rationale: If the required SMF data record types are not being collected, then accountability cannot be monitored, and its
    use in the execution of a contingency plan could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223767 Rule ID: SV-223767r767092_rule STIG ID: RACF-OS-000110'
