    severity: medium
- id: 6.2.1
  title: Ensure FTP Server daemon is configured with proper security parameters
  scoring: manual
  profile:
  - Level 1
  description: The FTP Server daemon requires special privileges and access to sensitive resources to provide its system services.
    As such, the data sets the FTP Server daemon relies upon for its configuration, runtime environment and operation must
    be properly protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive
    data.
  rationale: Failure to properly define and control the FTP Server daemon could lead to unauthorized access. This exposure
    may result in the compromise of the integrity and availability of the operating system environment, ACP, and customer
    data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223742 Rule ID: SV-223742r604139_rule STIG ID: RACF-FT-000100'
  page_start: 210
  audit_raw: 'Ensure all of the following items are in effect for the FTP daemon:

    1. The FTP daemon is started from a JCL procedure library defined to JES2.

    NOTE: The JCL member is typically named FTPD

    2. The FTP daemon user ID is FTPD.

    3. The FTPD user ID is defined as a PROTECTED user ID.

    4. The FTPD user ID has the following z/OS UNIX attributes: UID(0), HOME

    directory ‘/’, shell program /bin/sh.

    5. A matching entry in the STARTED resource class exists enabling the use of the

    standard user ID and appropriate group.

    Ensure the following items are in effect for all MVS consoles:

    1. The FTP daemon user ID must be FTPD and a matching entry in the STARTED

    resource class exists enabling the use of the standard user ID and an

    appropriate group.

    2. The FTPD user ID is defined as a PROTECTED user ID.

    3. The FTPD user ID has the following z/OS UNIX attributes: UID(0), HOME

    directory ‘/’, shell program /bin/sh.'
  remediation: 'Sample commands to accomplish these requirements are shown here:

    Add the FTPD user ID:

    AU FTPD NAME(''STC, FTP Daemon'') NOPASSWORD NOOIDCARD DFLTGRP(STCTCPX)

    OWNER(STCTCPX) OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))

    RDEF STARTED FTPD.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    STDATA(USER(=MEMBER) GROUP(STCTCPX) TRACE(YES))

    Additional permissions may be required. See SYS1.TCPIP.SEZAINST(EZARACF) or IBM

    Communications Server: IP Config Guide.'
  checks:
  - type: manual_review
    info: 'Ensure all of the following items are in effect for the FTP daemon:

