- id: 2.1.11
  title: Ensure that RACF remote sharing connections use the TCP/IP protocol
  scoring: scored
  profile:
  - Level 1
  description: Each individual RACF remote sharing (RRSF) connection to a remote node can use either the original APPC protocol
    or the newer TCP/IP protocol. TCP/IP allows for much stronger protection of the communications using AT-TLS technology,
    complimented by technology such as z/OS Encryption Readiness Technology (zERT) that can monitor and enforce the sets of
    cryptographic algorithms used to protect communications.
  rationale: APPC can only use DES-based encryption, which is far weaker than the encryption offered by TCP/IP.
  impact: ''
  references: []
  page_start: 88
  audit_raw: "The TARGET command with the LISTPROTCOL keyword provides a summary of the\ncommunication mechanism used for\
    \ all remote connections.\nFrom the console, specify the TARGET LIST command using the prefix you have\nestablished for\
    \ the RACF subsystem. For example, if your prefix is \"@\". Issue\ncommand:\n@TARGET LISTPROTOCOL\nIRRM009I (@) LOCAL\
    \ RRSF NODE NODE1 SYSNAME SYS1 (MAIN) IS IN THE\n OPERATIVE ACTIVE STATE.\nIRRM091I (@) LOCAL NODE TCP LISTENER IS ACTIVE.\n\
    IRRM009I (@) LOCAL RRSF NODE NODE1 SYSNAME SYS2 IS IN THE DEFINED\n STATE.\nIRRM009I (@) REMOTE RRSF NODE NODE2 SYSNAME\
    \ SYS3 (MAIN) PROTOCOL TCP\n IS IN THE OPERATIVE ACTIVE STATE.\nIRRM009I (@) REMOTE RRSF NODE NODE2 SYSNAME SYS4 PROTOCOL\
    \ TCP IS IN\n THE OPERATIVE ACTIVE STATE."
  remediation: 'Establish a plan by which to configure AT-TLS protection for RRSF connections and

    convert your APPC connections to TCP/IP. RACF provides a mechanism by which to

    seamlessly convert protocols while RRSF is in use.'
  checks:
  - type: manual_review
    info: "The TARGET command with the LISTPROTCOL keyword provides a summary of the\ncommunication mechanism used for all\
      \ remote connections.\nFrom the console, specify the TARGET LIST command using the prefix you have\nestablished for\
      \ the RACF subsystem. For example, if your prefix is \"@\". Issue\ncommand:\n@TARGET LISTPROTOCOL\nIRRM009I (@) LOCAL\
      \ RRSF NODE NODE1 SYSNAME SYS1 (MAIN) IS IN THE\n OPERATIVE ACTIVE STATE.\nIRRM091I (@) LOCAL NODE TCP LISTENER IS ACTIVE.\n\
      IRRM009I (@) LOCAL RRSF NODE NODE1 SYSNAME SYS2"
    severity: medium
- id: 2.1.12
  title: Ensure that memory and privileged program dumps are protected
  scoring: scored
  profile:
  - Level 1
  description: Access to memory and privileged program dumps running Trusted Control Block (TCB) key 0-7 may hold passwords,
    encryption keys, or other sensitive data that must not be made available.
  rationale: Failure to control access to these facilities could result in unauthorized personnel modifying sensitive z/OS
    lists. This exposure may threaten the integrity and availability of the operating system environment and compromise the
    confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223654 Rule ID: SV-223654r604139_rule STIG ID: RACF-ES-000060'
  page_start: 90
  audit_raw: 'Ensure that the Memory and privileged program dumps resources are protected as

    stated below. Follow these guidelines:

     Ensure that IEAABD.DMPAUTH resource and/or generic equivalent is defined and

    READ access is limited to authorized users.

     Ensure that IEAABD.DMPAUTH resource and/or generic equivalent UPDATE or greater

    access is restricted to only systems personnel and all access is logged.

     Ensure that IEAABD.DMPAKEY resources and/or generic equivalent is defined, and

    all access is restricted to systems personnel and that all access is logged.

    Ensure that resource rules for the above resources and/or generic equivalent specify

    UACC(NONE) and NOWARNING.'
  remediation: 'Define or alter the RACF resource rules for the resources to specify UACC(NONE) and

    NOWARNING.

    Example:

    RDEF FACILITY IEAABD.DMPAUTH UACC(NONE) OWNER(owner group) AUDIT(ALL(READ))

    IEAABD.DMPAUTH.READ access is limited to authorized users that have a valid job duties

    requirement for access. UPDATE access will be restricted to system programming

    personnel and access will be logged.

    Example:

    RDEF FACILITY IEAABD.DMPAUTH UACC(NONE) OWNER(owner group) AUDIT(ALL(UPDATE))

    PERMIT IEAABD.DMPAUTH CLASS(FACILITY) ID(authusers) ACCESS(READ)

    PERMIT IEAABD.DMPAUTH CLASS(FACILITY) ID(syspaudt) ACCESS(UPDATE)

    IEAABD.DMPAKEY. access will be restricted to system programming personnel and

    access will be logged.

    Example:

    RDEF FACILITY IEAABD.DMPAKEY.** UACC(NONE) OWNER(owner group)

    AUDIT(ALL(READ))

    PERMIT IEAABD.DMPAKEY.** CLASS(FACILITY) ID(syspaudt) ACCESS(READ)'
  checks:
  - type: manual_review
    info: 'Ensure that the Memory and privileged program dumps resources are protected as

      stated below. Follow these guidelines:

       Ensure that IEAABD.DMPAUTH resource and/or generic equivalent is defined and

      READ access is limited to authorized users.

