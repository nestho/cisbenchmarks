- id: 1.2.11
  title: Ensure that the CONSOLxx members are configured
  scoring: manual
  profile:
  - Level 1
  description: MCS consoles can be used to issue operator commands. This exposure may threaten the integrity and availability
    of the operating system environment and compromise the confidentiality of customer data.
  rationale: Failure to control access to MCS consoles could result in unauthorized personnel issuing sensitive operator commands.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223715 Rule ID: SV-223715r604139_rule STIG ID: RACF-ES-000680'
  page_start: 52
  audit_raw: 'Check each CONSOLxx parmlib member for the following.

    The DEFAULT statement for each CONSOLxx member specifies LOGON(REQUIRED) or

    LOGON(AUTO).

     The CONSOLE statement for each console assigns a unique name using the NAME

    parameter.

     The CONSOLE statement for each console specifies AUTH(INFO). Exceptions are

    the AUTH parameter is not valid for consoles defined with UNIT(PRT) and

    specifying AUTH(MASTER) is permissible for the system console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the DEFAULT statement requirement.'
  remediation: 'Ensure that the DEFAULT statement specifies LOGON(REQUIRED) so that all operators are

    required to log on prior to entering z/OS system commands. At the discretion of the

    ISSO, LOGON(AUTO) may be used. If LOGON(AUTO) is used assure that the console user

    IDs are defined with minimal access.

    Ensure that each CONSOLE statement specifies an explicit console NAME and that

    AUTH(INFO) is specified, this also including extended MCS consoles. AUTH(MASTER) may

    be specified for systems console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the DEFAULT statement requirement.'
  checks:
  - type: manual_review
    info: 'Check each CONSOLxx parmlib member for the following.

      The DEFAULT statement for each CONSOLxx member specifies LOGON(REQUIRED) or

      LOGON(AUTO).

       The CONSOLE statement for each console assigns a unique name using the NAME

      parameter.

       The CONSOLE statement for each console specifies AUTH(INFO). Exceptions are

      the AUTH parameter is not valid for consoles defined with UNIT(PRT) and

      specifying AUTH(MASTER) is permissible for the system console.

      Note: The site should be able to determine the system c'
