- id: 6.5.6
  title: Ensure access to TCP/IP SAF resources
  scoring: manual
  profile:
  - Level 1
  description: The Communication Server access authorization is used to protect TCP/IP resources such as stack, network, port,
    and other SERVAUTH resources. These resources provide additional security checks for TCP/IP users.
  rationale: Failure to properly secure these TCP/IP resources could lead to unauthorized user access resulting in the compromise
    of some system services and possible compromise of data.
  impact: Initial deployment of these measures may cause some applications or users that have legitimate reasons to access
    a given resource, but were initially unrecognized as such, to be denied access. Once your access control lists are fully
    developed and verified, this impact will no longer be a factor.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223823 Rule ID: SV-223823r811021_rule STIG ID: RACF-TC-000040'
  page_start: 274
  audit_raw: 'Ensure that all TCP/IP resources and/or generic equivalent are properly protected

    according to the requirements specified.

     The EZA, EZB, and IST resources and/or generic equivalent are defined to the

    SERVAUTH resource class with a UACC(NONE).

     No access is given to the EZA, EZB, and IST high level resources of the

    SERVAUTH resource class.

     If the product CSSMTP is on the system, no access is given to EZB.CSSMTP of the

    SERVAUTH resource class.

     If the product CSSMTP is on the system,

    EZB.CSSMTP.sysname.writername.JESnode will be specified and made available to

    the CSSMTP started task and authenticated users that require access to use

    CSSMTP for e-mail services.

     Authenticated users that require access will be permitted access to the second

    level of the resources in the SERVAUTH resource class. Examples are the network

    (NETACCESS), port (PORTACCESS), stack (STACKACCESS), and FTP resources in the

    SERVAUTH resource class.

     The EZB.STACKACCESS resource access authorizations restrict access to those

    z/OS user IDs with valid requirements for using the specified TCP/IP stack. This

    control is most useful when multiple TCP/IP stacks are defined on the z/OS

    system.

     The EZB.FTP.*.*.ACCESS.HFS resource access authorizations restrict access to

    FTP users with specific written documentation showing a valid requirement exists

    to access OMVS files and Directories.

     The EZB.FTP.*.*.ACCESS.JES resource access authorizations restrict access to

    FTP users with a specific written documentation showing a valid requirement

    exists to access FTP JES mode.'
  remediation: 'Ensure the following items are in effect for TCP/IP resources.

    (Note: The resource class, resources, and/or resource prefixes identified below are

    examples of a possible installation. The actual resource class, resources, and/or

    resource prefixes are determined when the product is actually installed on a system

    through the product’s installation guide and can be site specific.)

    Ensure that the EZA, EZB and IST resources and/or generic equivalent are defined to

    the SERVAUTH resource class with a UACC(NONE)

    No access is given to the EZA, EZB, and IST resources of the SERVAUTH resource class.

    If the product CSSMTP is on the system, no access is given to EZB.CSSMTP of the

    SERVAUTH resource class. EZB.CSSMTP.sysname.writername.JESnode will be specified

    and made available to the CSSMTP started task and authenticated users that require

    access to use CSSMTP for e-mail services.

    Only authenticated users that require access are permitted access to the second level

    of the resources in the SERVAUTH resource class. Examples are the network (NETACCESS),

    port (PORTACCESS), stack (STACKACCESS), and FTP resources in the SERVAUTH resource

    class.

    The EZB.STACKACCESS. resource access authorizations restrict access to those z/OS

    user IDs with valid requirements for using the specified TCP/IP stack. This control is

    most useful when multiple TCP/IP stacks are defined on the z/OS system.

    The EZB.FTP.*.*.ACCESS.HFS resource access authorizations restrict access to FTP

    users with specific written documentation showing a valid requirement exists to access

    z/OS Unix files and directories.

    The EZB.FTP.*.*.ACCESS.JES resource access authorizations restrict access to FTP

    users with specific written documentation showing a valid requirement exists to access

    FTP JES mode.

    The following commands are provided as a sample for implementing resource controls:

    RDEF SERVAUTH EZB.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.CSSMTP.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.CSSMTP.sysname.writername.JESnode UACC(NONE) OWNER(ADMIN)

    AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.FTP.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.NETACCESS.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.PORTACCESS.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    RDEF SERVAUTH EZB.STACKACCESS.** UACC(NONE) OWNER(ADMIN) AUDIT(FAILURE(READ))

    PE EZB.CSSMTP.sysname.writername.JESnode CL(SERVAUTH) ID(authusers) ACC(READ)

    PE EZB.FTP.** CL(SERVAUTH) ID(authusers) ACC(READ)

    PE EZB.FTP.sysname.ftpstc.ACCESS.HFS CL(SERVAUTH) ID(ftpprofile) ACC(READ)

    PE EZB.FTP.sysname.ftpstc.ACCESS.JES CL(SERVAUTH) ID(ftpprofile) ACC(READ)

    PE EZB.NETACCESS.** CL(SERVAUTH) ID(authusers) ACC(READ)

    PE EZB.PORTACCESS.** CL(SERVAUTH) ID(authusers) ACC(READ)

    PE EZB.STACKACCESS.** CL(SERVAUTH) ID(authusers) ACC(READ)

    The following notes apply to these controls:

     To be effective in restricting access, the network (EZB.NETACCESS) resource

    control requires configuration of the NETACCESS statement in the PROFILE.TCPIP

    file.

     To be effective in restricting access, the port (EZB.PORTACCESS) resource control

    requires configuration of a PORT or PORTRANGE statement in the PROFILE.TCPIP

    file. These port definitions within PROFILE.TCPIP shall be defined to include SAF

    keyword and a valid name.

    A list of possible SERVAUTH resources defined to the first two nodes is shown here: (Note

    that additional resources may be developed with each new release of TCPIP.)

    ZA.DCAS.

    EZB.BINDDVIPARANGE.

    EZB.CIMPROV.

    EZB.CSSMTP.

    EZB.FRCAACCESS.

    EZB.FTP.

    EZB.INITSTACK.

    EZB.IOCTL.

    EZB.IPSECCMD.

    EZB.LBA.

    EZB.MODDVIPA.

    EZB.NETACCESS.

    EZB.NETMGMT.

    EZB.NETSTAT.

    EZB.NSS.

    EZB.NSSCERT.

    EZB.OSM.

    EZB.PAGENT.

    EZB.PORTACCESS.

    EZB.RPCBIND.

    EZB.SNMPAGENT.

    EZB.SOCKOPT.

    EZB.STACKACCESS.

    EZB.TN3270.

    EZB.TRCCTL.

    EZB.TRCSEC.

    IST.NETMGMT.'
