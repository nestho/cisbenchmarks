- id: 7.3.4
  title: Ensure the XCSFKEY class is active
  scoring: manual
  profile:
  - Level 1
  description: While the CSFKEYS class controls who has access to key material, the XCSFKEY class provides additional controls
    regarding how the keys can be used. For example, it is possible to setup profiles in the XCSFKEY class to restrict a key’s
    ability to be used as an exporter or importer key.
  rationale: The XCSFKEY class provides usage control in addition to access permission provided by the CSFKEYS class.
  impact: ''
  references: []
  page_start: 343
  audit_raw: 'The SETROPTS LIST command is used to identify which classes are active on the

