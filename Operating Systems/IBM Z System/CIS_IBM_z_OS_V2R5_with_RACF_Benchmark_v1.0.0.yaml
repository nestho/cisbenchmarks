      SYSPLEXPKDS Sysplex consistenc'
- id: 7.2.8
  title: Ensure ICSF is running with FIPSMODE enabled
  scoring: manual
  profile:
  - Level 1
  description: If FIPSMODE(YES) is specified in the ICSF Installation Options Dataset, the PKCS#11 services that ICSF provides
    will operate in compliance with Federal Information Processing Standard Security Requirements for Cryptographic Modules,
    referred to as FIPS 140-2.
  rationale: By operating in compliance with FIPS 140-2, ICSF’s PKCS#11 services will ensure the use of strong keys and FIPS
    140-2 approved encryption algorithms.
  impact: ''
  references: []
  page_start: 332
  audit_raw: 'To determine the sysplex settings for each ICSF Key Data Set, use the Installation

    Option Display ISPF utility.

    From the ICSF Primary Menu panel, select option 3 OPSTAT.

    From the ICSF Installation Options panel, select option 1 OPTIONS

    The FIPSMODE setting is shown as for example:

    FIPSMODE Operate PKCS #11 in FIPS 140-2 mode NO,FAIL(NO)'
  remediation: 'Add the following keywords to the ICSF Installation Options Dataset and stop/restart

    ICSF:

    FIPSMODE(YES,FAIL(YES))'
  checks:
  - type: sql
    command: select option 3 OPSTAT.
