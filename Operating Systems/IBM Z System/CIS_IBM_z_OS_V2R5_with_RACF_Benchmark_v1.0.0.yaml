- id: 2.1.17
  title: ENSURE that Temporary Data Sets are protected
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS CLASSACT(TEMPDSN) specifies that the class TEMPDSN will be active. When the TEMPDSN class is active,
    access to system-generated temporary data sets is prevented if a temporary data set is allowed to persist after the job
    which created it has ended. These values become effective immediately after the command SETROPTS CLASSACT(TEMPDSN) is
    issued.
  rationale: 'You can protect temporary data sets. Normally, these data sets are considered protected from any accesses except
    by the job or session that created them, and therefore do not need to be protected by RACF®. However, the following situations
    could leave a temporary data set unprotected:  A system failure.  An initiator failure or initiator termination by the
    FORCE command.  An automatic restart - between the failure and the restart. In these cases, if the TEMPDSN class is active,
    only users with the OPERATIONS attribute or users authorized to specific DFSMSdss functions can scratch any residual DFP
    managed temporary data sets remaining on a volume.'
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223660 Rule ID: SV-223660r604139_rule STIG ID: RACF-ES-000120'
  page_start: 100
  audit_raw: 'Issue the TSO command:

    SETROPTS LIST

    Look for the TEMPDSN class in ''ACTIVE CLASSES ='' session.'
  remediation: 'Issue the TSO command:

    SETROPTS CLASSACT(TEMPDSN)'
  checks:
  - type: manual_review
    info: 'Issue the TSO command:

