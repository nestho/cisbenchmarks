- id: '4.1'
  title: Ensure that RACF database is backed up on a scheduled basis
  scoring: manual
  profile:
  - Level 1
  description: If backups of the operating environment are not processed, implementation of a contingency plan would not include
    the data necessary to fully recover from any outage. RACF database backups reduce system recovery time.
  rationale: If regularly scheduled backups of this database are not processed, system recovery time could be unacceptably
    long.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223711 Rule ID: SV-223711r604139_rule STIG ID: RACF-ES-000640'
  page_start: 187
  audit_raw: Check with the operation personal that the RACF database is, at least, backed up daily.
  remediation: Implement a daily backup
  checks:
  - type: manual_review
    info: Check with the operation personal that the RACF database is, at least, backed up daily.
    severity: medium
- id: '4.2'
  title: Ensure that RACF primary and backup databases are isolated
  scoring: manual
  profile:
  - Level 1
  description: RACF backup and recovery data files provide the only means of recovering RACF database in the event of its
    damage.
  rationale: In the case where this damage is to the physical volume on which it resides, and any of these recovery data files
    exist on this volume as well, then complete recovery of the RACF database would be extremely difficult, if even possible.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223710 Rule ID: SV-223710r604139_rule STIG ID: RACF-ES-000630'
  page_start: 188
  audit_raw: 'To determine the volume of RACF databases issue the command:

    RVARY LIST'
  remediation: 'If the alternate database is on the same volume as the primary, it should be re-allocated

    on another volume.

    Copy the active RACF database using IRRUT200 or IRRUT400. The new dataset must be

    created on a separate volume than the current active database.

    Depending upon your configuration, modify the ICHRDSNT load module table or the

    IRRPRMxx parmlib member and plan an IPL of the system (or the entire sysplex if in

    DATASHARING mode).'
  checks:
  - type: manual_review
    info: 'To determine the volume of RACF databases issue the command:

      RVARY LIST'
    severity: medium
- id: '4.3'
  title: Ensure sensitive data is encrypted
  scoring: manual
  profile:
  - Level 1
  description: In a z/OS environment, the most effective and compliant way to ensure sensitive data is protected is to implement
    encryption.
  rationale: Implementing z/OS dataset encryption would ensure that even privileged users, like storage administrators, if
    they are not permitted to access the encryption keys, can’t access sensitive data
  impact: On modern machines like z14 or z15, we expect a very limited overhead.
