- id: 6.2.8
  title: Ensure permission and user audit bits for FTP Server are configured.
  scoring: manual
  profile:
  - Level 1
  description: The FTP Server daemon uses privileged functions and accesses sensitive data. The files and directories the
    FTP daemon relies upon for its configuration, runtime environment and operation must be properly protected from unauthorized
    modifications or retrieval to ensure system integrity and privacy of sensitive data.
  rationale: Failure to properly secure these objects may lead to unauthorized access resulting in the compromise of the integrity
    and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223734 Rule ID: SV-223734r604139_rule STIG ID: RACF-FT-000020'
  page_start: 229
  audit_raw: 'The permission bits and user audit bits for each directory and file match or are more

    restrictive than the specified settings listed in the table.

    FTP Server HFS Object Security Settings

    File Permission Bits User Audit Bits

    /usr/sbin/ftpd 1740 fff

    /usr/sbin/ftpdns 1755 fff

    /etc/ftp.data 0744 faf

    /etc/ftp.banner 0744 faf

    NOTE: Some of the files listed above may not be used in every configuration.

    The /usr/sbin/ftpd and /usr/sbin/ftpdns objects are symbolic links to

    /usr/lpp/tcpip/sbin/ftpd and /usr/lpp/tcpip/sbin/ftpdns respectively. The

    permission and user audit bits on the targets of the symbolic links must have the

    required settings.

    The /etc/ftp.data file may not be the configuration file the server uses. It is necessary

    to check the SYSFTPD DD statement in the FTP started task JCL to determine the actual

    file.

    The /etc/ftp.banner file may not be the banner file the server uses. It is necessary to

    check the BANNER statement in the FTP Data configuration file to determine the actual

    file. Also, the permission bit setting for this file must be set as indicated in the table

    above. A more restrictive set of permissions is not permitted.

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r—

    1 –x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

     "f log" for failed access attempts

     "a log" for failed and successful access

     no auditing'
  remediation: 'A systems programmer with UID(0) and/or SUPERUSER access, will review the UNIX

    permission bits and user audit bits on the directories and files for the FTP Server.

    Ensure they conform to the specifications below:

    FTP Server HFS Object Security Settings

    File Permission Bits User Audit Bits

    /usr/sbin/ftpd 1740 fff

    /usr/sbin/ftpdns 1755 fff

    /etc/ftp.data 0744 faf

    /etc/ftp.banner 0744 faf

    The /usr/sbin/ftpd and /usr/sbin/ftpdns objects are symbolic links to

    /usr/lpp/tcpip/sbin/ftpd and /usr/lpp/tcpip/sbin/ftpdns respectively. The

    permission and user audit bits on the targets of the symbolic links must have the

    required settings.

    The /etc/ftp.data file may not be the configuration file the server uses. It is necessary

    to check the SYSFTPD DD statement in the FTP started task JCL to determine the actual

    file.

    The /etc/ftp.banner file may not be the banner file the server uses. It is necessary to

    check the BANNER statement in the FTP Data configuration file to determine the actual

    file.

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r—

    1 –x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

     "f log" for failed access attempts

     "a log" for failed and successful access

     no auditing

    Some of the files listed above (e.g., /etc/ftp.data) are not used in every configuration.

    While the absence of a file is generally not a security issue, the existence of a file that

    has not been properly secured can often be an issue. Therefore, all files that do exist

    should have the specified permission and audit bit settings.

    The following commands can be used (from a user account with an effective UID(0)) to

    update the permission bits and audit bits:

    chmod 1740 /usr/lpp/tcpip/sbin/ftpd

    chaudit rwx=f /usr/lpp/tcpip/sbin/ftpd

    chmod 1755 /usr/lpp/tcpip/sbin/ftpdns

    chaudit rwx=f /usr/lpp/tcpip/sbin/ftpdns

    chmod 0744 /etc/ftp.data

    chaudit w=sf,rx+f /etc/ftp.data

    chmod 0744 /etc/ftp.banner

    chaudit w=sf,rx+f /etc/ftp.banner'
  checks:
  - type: manual_review
    info: 'The permission bits and user audit bits for each directory and file match or are more

      restrictive than the specified settings listed in the table.

      FTP Server HFS Object Security Settings

      File Permission Bits User Audit Bits

      /usr/sbin/ftpd 1740 fff

      /usr/sbin/ftpdns 1755 fff

      /etc/ftp.data 0744 faf

      /etc/ftp.banner 0744 faf

      NOTE: Some of the files listed above may not be used in every configuration.

      The /usr/sbin/ftpd and /usr/sbin/ftpdns objects are symbolic links to

      /usr/lpp/tcpip/sbin/ftpd and /u'
    severity: medium
