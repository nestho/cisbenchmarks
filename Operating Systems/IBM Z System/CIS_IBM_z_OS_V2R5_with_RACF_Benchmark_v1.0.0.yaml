- id: 8.4.4
  title: Ensure that the JES(XBMALLRACF) SETROPTS value is set to JES(XBMALLRACF)
  scoring: manual
  profile:
  - Level 1
  description: XBM (execution batch monitor) is a function that allows jobs to be submitted that only provide instream data
    to a pre-defined JCL PROC. The classic use of this is to perform student compiles in an educational environment. Even
    though the JCL PROC is predefined, proper auditing of what the JCL is accessing requires that a RACF identify exists for
    all jobs. XBM is configured by specifying a value for XBM= on a JOBCLASS statement. Use the command $DJOBCLASS(*),XBM!=,XBM
    to determine if XBM is in use. XBMALLRACF ensures that (assuming you have JES configured to support XBM jobs) any XBM
    job submitted by a user must have a RACF identity or the job will fail. This is used only in JES2.
  rationale: Failure to set XBMALLRACF will allow XBM jobs run on a system without a proper RACF identity.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223693 Rule ID: SV-223693r604139_rule STIG ID: RACF-ES-000460'
  page_start: 400
  audit_raw: 'If JES(XBMALLRACF) is enabled the message "JES-XBMALLRACF OPTION IS

    ACTIVE" will be displayed.'
  remediation: 'Ensure that JES(XBMALLRACF) SETROPTS value is set to JES(XBMALLRACF). This

    specifies that JES is set to test for a user ID and password on the job statement or for

    propagated RACF identification information for all jobs run under the execution batch

    monitor.

    Evaluate the impact associated with implementation of the control option. Develop a

    plan of action to implement the control option as specified in the example below:

    RACF Command SETR LIST will show the status of RACF Controls including a status of

    JES-XBMALLRACF.

    XBMALLRACF is activated with the command:

    SETR XBMALLRACF'
  checks:
  - type: manual_review
    info: 'If JES(XBMALLRACF) is enabled the message "JES-XBMALLRACF OPTION IS

      ACTIVE" will be displayed.'
    severity: medium
- id: 8.5.1
  title: Ensure that access (read, update and allocate) to the data sets used by JES2 is controlled
  scoring: manual
  profile:
  - Level 1
  description: 'The JES2 System data sets are a common repository for all jobs submitted to the system and the associated
    printout and configuration of the JES2 environment. Initialization data sets can contain NJE and RJE signon passwords
    and need to be protected unintended access. These include:  JES2 initialization parameters  JES2 checkpoint data sets
     JES2 SPOOL data sets'
  rationale: Allowing READ access to the SPOOL data set would allow an unauthorized user to access any data that resides on
    spool compromising the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223690 Rule ID: SV-223690r604139_rule STIG ID: RACF-ES-000420'
  page_start: 403
  audit_raw: 'Ensure only JES2 needs access to the data sets that it uses. Access to checkpoint and

    spool data sets should be set to NONE.

    Access to the initialization parameter data sets should be restricted to appropriate

    personnel responsible for maintaining JES2. In particular any data set that may contain

    Line or node passwords.'
  remediation: 'Confirm that trace files are covered by a RACF DATASET profile with the following

    attributes:

     UACC(NONE)

     No ID(*) on the access list

     Not in WARNING mode

     Access is restricted to system programmers and started tasks that perform GTF

    processing

     All accesses are being logged'
  checks:
  - type: manual_review
    info: 'Ensure only JES2 needs access to the data sets that it uses. Access to checkpoint and

      spool data sets should be set to NONE.

      Access to the initialization parameter data sets should be restricted to appropriate

      personnel responsible for maintaining JES2. In particular any data set that may contain

      Line or node passwords.'
    severity: medium
- id: 8.5.2
  title: Ensure that access to any PROCLIB data sets used by JES2 is protected from unintended updates
  scoring: manual
  profile:
  - Level 1
  description: PROCLIB data sets contain the steps (programs) that a job (or started task) will run. They can also contain
    instream data that control those programs. Altering the steps in a PROC could allow an unintended program to get control
    under the user authority of the job (or started task) using the PROC. Data sets in a PROCLIB concatenation (specified
    in the JES2 PROC or using PROCLIB statements) are access using the authority of JES2. Jobs do not require any access to
    these data sets to use a JCL PROC contained within them. Data sets accessed via a JCLLIB JCL statement, however, are accessed
    using the owning user ID associated with the job and require READ access to data sets in JCLLIB.
  rationale: Unauthorized users altering PROCs in a PROCLIB data set can cause unintended program to run under the authority
    of the user ID that owns the job using the PROC.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223687 Rule ID: SV-223687r604139_rule STIG ID: RACF-ES-000390'
  page_start: 405
  audit_raw: 'Refer to the following for the PROCLIB data sets that contain the STCs and TSO logons

    from the following sources:

     MSTJCLxx member used during an IPL. The PROCLIB data sets are obtained

    from the IEFPDSI and IEFJOBS DD statements.

     PROCxx DD statements in the JES2 PROC. Where ‘xx’ is the PROCLIB entries for

    the STC and TSU JOBCLASS configuration definitions.

     PROCLIB(nnnnnnnn) JES2 initialization statements or commands. Use the

    following command to determine the full list of JES2 PROCLIBs.

    $D PROCLIB(*)

    Verify that the accesses to the above PROCLIB data sets are properly restricted.

    Check that the ESM data set access authorizations restrict WRITE and/or greater

    access to systems programming personnel.'
  remediation: "Use the $D PROCLIB(*) command to get a complete list of data sets used for PROBLIB:\nPROCLIB(PROC00) STATIC\
    \ LIBRARY,\n DD(1)=(DSNAME=SYS1.PROCLIB, <== Data set name\n VOLSER=J2SHR2,UNIT=SYSALLDA),\n DD(2)=(DSNAME=SYS1.PROCLIB,\n\
    \ VOLSER=J2SHR2,UNIT=SYSALLDA),\n DD(3)=(DSNAME=SYS1.PROCLIB,\n VOLSER=J2SHR2,UNIT=SYSALLDA)\n$HASP319 PROCLIB(PROC01)\n\
    PROCLIB(PROC01) STATIC LIBRARY,\n DD(1)=(DSNAME=SYS1.PROCLIB,\n VOLSER=J2SHR2,UNIT=SYSALLDA)\n$HASP319 PROCLIB(PROC02)\n\
    PROCLIB(PROC02) DD(1)=(DSNAME=SYS1.PROCLIB,\n VOLSER=J2SHR2),\n DD(2)=(DSNAME=SYS1.PROCLIB.POK,\n VOLSER=ZDR31),\n DD(3)=(DSNAME=SYS1.PROCLIB.INSTALL,\n\
    \ VOLSER=ZDR31)\nUse the ESM data set authorization to restrict write and/or greater access to appropriate\nsystem programming\
    \ personnel."
  checks:
  - type: manual_review
    info: 'Refer to the following for the PROCLIB data sets that contain the STCs and TSO logons

      from the following sources:

       MSTJCLxx member used during an IPL. The PROCLIB data sets are obtained

      from the IEFPDSI and IEFJOBS DD statements.

       PROCxx DD statements in the JES2 PROC. Where ‘xx’ is the PROCLIB entries for

      the STC and TSU JOBCLASS configuration definitions.

       PROCLIB(nnnnnnnn) JES2 initialization statements or commands. Use the

      following command to determine the full list of JES2 PROCLIBs.

      $D '
    severity: medium
- id: 8.5.3
  title: Ensure that RACF is called for data sets opened by JES2
  scoring: manual
  profile:
  - Level 1
  description: The program property table provides an option to bypass password checking for data sets (NOPASS). This causes
    OPEN processing to bypass the call to RACF data set access authorization for the specified address space. JES2 is defined
    with the attribute PASS which requires that RACF be called for all data set access.
  rationale: Specifying PASS for the PPT entry for JES2 (HASJES20) is required to ensure that access to JCLLIB data sets is
    properly authorized. Specifying NOPASS for HASJES20 (the JES2 PPT entry) would allow a JCLLIB JCL statement to access
    any data set. If the data set were a PDS with a record format of F and a record length of 80, during JCL conversion the
    data set would be read and its contents displayed as error message in the JCL listing. This could compromise the confidentiality
    of customer data.
  impact: ''
  references: []
  page_start: 407
  audit_raw: 'Use the command:

    D PPT

    to get a list of the current PPT attributes on the system and ensure that the entry for

    JES2 does not specify NOPASS. The “NP” column should indicate “.’.

    Sample output:

    PgmName NC NS PR ST ND BP Key 2P 1P NP NH CP DA PA

    HASJES20 Y Y . Y Y . 1 . . . Y . . .'
  remediation: 'Update the SHEDxx PARMLIB member listed in the output of the D PPT command to

    remove the NOPASS specification for HASJES20

    8.6 Device Management

    This section describes the Enable Encryption of Device Management

    recommendations.'
  checks:
  - type: manual_review
    info: 'Use the command:

      D PPT

      to get a list of the current PPT attributes on the system and ensure that the entry for

      JES2 does not specify NOPASS. The “NP” column should indicate “.’.

      Sample output:

      PgmName NC NS PR ST ND BP Key 2P 1P NP NH CP DA PA

      HASJES20 Y Y . Y Y . 1 . . . Y . . .'
    severity: medium
- id: 8.6.1
  title: Ensure that JES2 output devices are controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 output devices provide a variety of channels to which output can be processed. Failure to properly control
    these output devices could result in unauthorized personnel accessing output.
  rationale: Profiles in the WRITER resource class can control what devices and destination a job can access. Most WRITER
    checks are made when the SYSOUT is selected to be printed. If the owner does not have access to the device (as defined
    by the WRITER resource class profile) then the output is not processed (and remains on SPOOL). NJE destination checks
    (JES2.NJE.nodename) are performed at the time the SYSOUT is being allocated. If the owning user ID does not have access
    to the NJE node, the SYSOUT allocation is failed. Failure to control output devices could result is SYSOUT being printed
    on an inappropriate device.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223748 Rule ID: SV-223748r604139_rule STIG ID: RACF-JS-000040'
  page_start: 409
  audit_raw: 'Refer the JES2PARM member of SYS1.PARMLIB.

    Review the following resources in the RACF WRITER resource class:

    JES2.** (backstop profile)

    JES2.LOCAL.OFFn.* (spool offload transmitter)

    JES2.LOCAL.OFFn.ST (spool offload SYSOUT transmitter)

    JES2.LOCAL.OFFn.JT (spool offload job transmitter)

    JES2.LOCAL.PRTn (local printer)

    JES2.LOCAL.PUNn (local punch)

    JES2.NJE.nodename (NJE node)

    JES2.RJE.Rnnnn.PRm (remote printer)

    JES2.RJE.Rnnnn.PUm (remote punch)

    JES2 is typically the name of the JES2 subsystem. Refer to the SUBSYS report and

    locate the entry with the description of PRIMARY JOB ENTRY SUBSYSTEM. The

    SUBSYSTEM NAME of this entry is the name of the JES2 subsystem.

     OFFn, where n is the number of the offload transmitter. Determine the numbers

    by searching for OFF( in the JES2 parameters.

     PRTn, where n is the number of the local printer. Determine the numbers by

    searching for PRT( in the JES2 parameters.

    PUNn, where n is the number of the local card punch. Determine the numbers by

    searching for PUN( in the JES2 parameters

     Nodename is the NAME parameter value specified on the NODE statement.

    Review the JES2 parameters for NJE node definitions by searching for NODE( in

    the report.

     Rnnnn.PRm, where nnnn is the number of the remote workstation and m is the

    number of the printer. Determine the numbers by searching for .PR in the JES2

    parameters.

     Rnnnn.PUm, where nnnn is the number of the remote workstation and m is the

    number of the punch. Determine the numbers by searching for .PU in the JES2

    parameters.

    Check that the WRITER resource class is active.

    Check that the other resources detailed above are protected by generic and/or fully

    qualified profiles defined to the WRITER resource class with UACC(NONE).'
  remediation: 'Review the following resources in the WRITER resource class:

    JES2.** (backstop profile)

    JES2.LOCAL.OFFn.* (spool offload transmitter)

    JES2.LOCAL.OFFn.ST (spool offload SYSOUT transmitter)

    JES2.LOCAL.OFFn.JT (spool offload job transmitter)

    JES2.LOCAL.PRTn (local printer)

    JES2.LOCAL.PUNn (local punch)

    JES2.NJE.nodename (NJE node)

    JES2.RJE.Rnnnn.PRm (remote printer)

    JES2.RJE.Rnnnn.PUm (remote punch)

    JES2 is typically the name of the JES2 subsystem. Refer to the SUBSYS report and

    locate the entry with the description of PRIMARY JOB ENTRY SUBSYSTEM. The

    SUBSYSTEM NAME of this entry is the name of the JES2 subsystem.

     OFFn, where n is the number of the offload transmitter. Determine the numbers

    by searching for OFF( in the JES2 parameters.

     PRTn, where n is the number of the local printer. Determine the numbers by

    searching for PRT( in the JES2 parameters.

     PUNn, where n is the number of the local card punch. Determine the numbers by

    searching for PUN( in the JES2 parameters.

     Nodename is the NAME parameter value specified on the NODE statement.

    Review the JES2 parameters for NJE node definitions by searching for NODE( in

    the report.

     Rnnnn.PRm, where nnnn is the number of the remote workstation and m is the

    number of the printer. Determine the numbers by searching for .PR in the JES2

    parameters.

     Rnnnn.PUm, where nnnn is the number of the remote workstation and m is the

    number of the punch. Determine the numbers by searching for .PU in the JES2

    parameters.

    Define the WRITER resource class to the ACTIVE CLASSES in RACF SETROPTS.

    Configure the profile JES2.** to have no access in the WRITER resource class.

    Configure the resources detailed above to be protected by generic and/or fully qualified

    profiles defined to the WRITER resource class.

    Examples:

    setr classact(writer)

    setr gencmd(writer) generic(writer)

    setr raclist(writer)

    RDEF WRITER JES2.** owner(admin) AUDIT(ALL) UACC(NONE) -

