- id: '5.2'
  title: Ensure that a very limited number of users can use the Tape Bypass Label Processing (BLP)
  scoring: manual
  profile:
  - Level 1
  - Level 1
  description: BLP is extremely sensitive, as it allows the circumvention of security access checking for the data. When BLP
    is used in z/OS, the only verification that is done is for the data set name in the JCL. Any data set name can be used.
    A user could specify a data set name that he has access to, the job would pass the validation check, and the job would
    be processed, giving access to the data. BLP is typically used for tapes that are external to the tape management system
    used on the processor. BLP should be granted to only a limited number of people, preferably the tape librarian and a few
    key people from the operations staff. If an unauthorized user possesses BLP authority, they could potentially read any
    restricted tape and modify any information once it has been copied. ADSP indicates that RACF automatically creates discrete
    data set profiles to protect datasets created by users having this attribute. ADSP specifies that data sets created by
    users who have the ADSP attribute will be RACF protected automatically. NOADSP cancels automatic RACF protection for users
    who have ADSP.
  rationale: If an unauthorized user possesses BLP authority, they could potentially read any restricted tape and modify any
    information once it has been copied.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223662 Rule ID: SV-223662r604139_rule STIG ID: RACF-ES-000140'
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223721 Rule ID: SV-223721r604139_rule STIG ID: RACF-ES-000740'
  page_start: 193
  audit_raw: 'List the users with access to the ICHBLP resource in the FACILITY class by issuing the

    command:

    SETROPTS LIST

    Issue the command:

    SETROPTS LIST

    Look for AUTOMATIC DATASET PROTECTION IS IN EFFECT

    Note: NOADSP is the required setting. In the SETROPTS LIST output this will display as

    AUTOMATIC DATASET PROTECTION IS NOT IN EFFECT.'
  remediation: 'Remove any unwanted user.

    BLP is controlled thru the FACILITY class profile ICHBLP

    Access is removed with the following command:

    PE ICHBLP CL(FACILITY) id(<userid>) DELETE

    Issue the command:

    SETROPTS NOADSP'
  checks:
  - type: manual_review
    info: 'List the users with access to the ICHBLP resource in the FACILITY class by issuing the

      command:

      SETROPTS LIST

      Issue the command:

      SETROPTS LIST

      Look for AUTOMATIC DATASET PROTECTION IS IN EFFECT

      Note: NOADSP is the required setting. In the SETROPTS LIST output this will display as

      AUTOMATIC DATASET PROTECTION IS NOT IN EFFECT.'
    severity: medium
