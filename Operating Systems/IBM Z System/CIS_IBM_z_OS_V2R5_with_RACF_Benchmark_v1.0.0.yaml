  description: MCS consoles can be used to issue operator commands. When MCS consoles are configured to force a logon in order
    to be used, the CONSOLE class protect the logon access.
  rationale: Failure to control access to MCS consoles could result in unauthorized personnel issuing sensitive operator commands.
