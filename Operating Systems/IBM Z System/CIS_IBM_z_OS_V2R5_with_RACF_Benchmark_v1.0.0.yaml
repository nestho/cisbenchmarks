- id: '9.25'
  title: Ensure changes to UNIX file security are logged
  scoring: manual
  profile:
  - Level 1
  description: By default, UNIX security attribute (e.g. owner, permission bits) changes are not logged in SMF Type 80 records.
    These changes should be logged, just as changes to RACF profiles should be logged.
  rationale: In the absence of SMF Type 80 records for UNIX file security attribute changes, it is more difficult to debug
    authorization problems and investigate potential attacks. Enabling logging for security changes provides a historical
    record of security changes and allows for ICH408I violation messages to be sent to the security console when an unauthorized
    person attempts to change security attributes.
  impact: ''
  references: []
  page_start: 465
  audit_raw: 'Verify that all attempts to change UNIX file security attributes are logged.

    From the TSO command line, enter the following command from a user ID with the

    AUDITOR or ROAUDIT attribute:

    SETROPTS LIST

    Locate the line starting with:

    LOGOPTIONS "ALWAYS" CLASSES =

    Inspect the alphabetized list for the presence of the FSSEC class.'
  remediation: 'Enable logging for all attempts to change UNIX file security attributes.

    From the TSO command line, enter the following command from a user ID with the

    AUDITOR attribute:

    SETROPTS LOGOPTIONS(ALWAYS(FSSEC))'
  checks:
  - type: manual_review
    info: 'Verify that all attempts to change UNIX file security attributes are logged.

      From the TSO command line, enter the following command from a user ID with the

      AUDITOR or ROAUDIT attribute:

      SETROPTS LIST

      Locate the line starting with:

      LOGOPTIONS "ALWAYS" CLASSES =

      Inspect the alphabetized list for the presence of the FSSEC class.'
    severity: medium
- id: '9.26'
  title: Ensure that programs cannot execute from the /tmp directory
  scoring: scored
  profile:
  - Level 1
  description: By default, programs and scripts can be run from within any file system in the hierarchy. This ability should
    be restricted from within the /tmp directory. The FSEXEC class can be used to prevent file execution from an individual
    file system regardless of permission bits, file ownership, or even superuser privilege.
  rationale: When an attacker gains access to UNIX, their first action is often to run a script to detect system vulnerabilities.
    The /tmp directory is often used for this purpose because all users, by necessity, can typically create files in this
    directory.
  impact: An additional access check is performed whenever a file is opened for execute access.
  references: []
  page_start: 467
  audit_raw: 'Verify that file execution is not allowed in the /tmp directory. The /tmp directory must be

    protected by a profile in the FSEXEC class, and the FSEXEC class must be active and

    RACLISTed.

    From the TSO command line, enter the following command from a user ID with the

    SPECIAL, AUDITOR or ROAUDIT attribute:

    SETROPTS LIST

    Locate the line starting with:

    ACTIVE CLASSES =

    Inspect the alphabetized list for the presence of the FSEXEC class.

    Locate the line starting with:

    SETR RACLIST CLASSES =

    Inspect the alphabetized list for the presence of the FSEXEC class.

    Identity the file system that contains the /tmp directory. From the shell, issue the

    command:

    df /tmp

    You will see output such as:

    # df /tmp

    Mounted on Filesystem Avail/Total Files Status

    /SYSTEM/tmp (/tmp) 81688/81920 10211 Available

    In the Filesystem column, the name of the file system is identified. For most file

    systems, the value is a data set name. However, the /tmp directory often uses the tfs

    file system, which is not backed by a data set. To see if the resource is defined to the

    FSEXEC class, issue the following command:

    RLIST FSEXEC /tmp

    In the command output, make sure the value under the UNIVERSAL ACCESS column is

    NONE'
  remediation: 'Protect /tmp in the FSEXEC class and activate and RACLIST the class.

    From the TSO command line, enter the following command from a user ID with the

    SPECIAL attribute:

    RDEFINE FSEXEC /tmp UACC(NONE)

    SETROPTS CLASSACT(FSEXEC) RACLIST(FSEXEC)'
  checks:
  - type: manual_review
    info: 'Verify that file execution is not allowed in the /tmp directory. The /tmp directory must be

      protected by a profile in the FSEXEC class, and the FSEXEC class must be active and

      RACLISTed.

      From the TSO command line, enter the following command from a user ID with the

      SPECIAL, AUDITOR or ROAUDIT attribute:

      SETROPTS LIST

      Locate the line starting with:

      ACTIVE CLASSES =

      Inspect the alphabetized list for the presence of the FSEXEC class.

      Locate the line starting with:

      SETR RACLIST CLASSES =

      Inspect the'
    severity: medium
- id: '9.27'
  title: Ensure that data sets containing user file systems do not have the user ID as the high-level qualifier
  scoring: manual
  profile:
  - Level 1
  description: A naming convention is generally established when allocating new zFS user file systems for a UNIX user to have
    as their home directory. If the high-level qualifier for this data set is the user’s RACF user ID, then the user has read
    and write access to it outside of the UNIX environment where UNIX authorization checks are not made.
  rationale: A user can set sensitive file attributes from the traditional MVS environment, and they will be honored within
    the UNIX environment. This can lead to full compromise of your system.
  impact: ''
  references: []
  page_start: 470
  audit_raw: 'Check the names of the zFS aggregates used for user file systems. The shell df

    command displays all file systems by path name and by zFS data set name.

    df

    In the Filesystem column, the names of all mounted file systems are identified.'
  remediation: 'Establish a plan by which to replace these file systems. Modify your provisioning steps

    (for example, your automount policy) to discontinue the user ID-based naming

    convention in the high-level qualifier.'
  checks:
  - type: manual_review
    info: 'Check the names of the zFS aggregates used for user file systems. The shell df

      command displays all file systems by path name and by zFS data set name.

      df

      In the Filesystem column, the names of all mounted file systems are identified.'
    severity: medium
- id: '9.28'
  title: Ensure that daemons are running with z/OS UNIX level security
  scoring: scored
  profile:
  - Level 1
  description: Running with z/OS UNIX level security ensures that system programmers with UID(0) cannot switch identity to
    any other z/OS UNIX user without authentication. This capability is restricted to daemon user IDs with READ access to
    BPX.DAEMON in the FACILITY class.
  rationale: In contrast, with UNIX level security, anyone with UID(0) or access to BPX.SUPERUSER in the FACILITY class can
    switch identity to any other z/OS UNIX user without authentication. This violates separation of duties and least privilege.
  impact: Implementing z/OS UNIX level security requires daemons to be running in a clean address space. This requires additional
    setup and maintenance to identify programs that are allowed to execute in the daemon address space and define them to
    RACF program control.
  references: []
  page_start: 471
  audit_raw: 'Verify that the BPX.DAEMON profile is defined in the FACILITY class and that only daemon

    user IDs are permitted with READ access.

    RLIST FACILITY BPX.DAEMON AUTHUSER'
  remediation: 'Establish a plan by which to identify programs that are executed by the daemon

    application, define them to program control, and then define BPX.DAEMON in the FACILITY

    class.'
  checks:
  - type: manual_review
    info: 'Verify that the BPX.DAEMON profile is defined in the FACILITY class and that only daemon

      user IDs are permitted with READ access.

      RLIST FACILITY BPX.DAEMON AUTHUSER'
    severity: medium
- id: '9.29'
  title: Ensure that servers are running with z/OS UNIX level security
  scoring: scored
  profile:
  - Level 1
  description: Running with z/OS UNIX level security ensures that system programmers with UID(0) cannot establish thread-level
    security under any other z/OS UNIX user without authentication. This capability is restricted to server user IDs with
    READ or UPDATE access to BPX.SERVER in the FACILITY class.
  rationale: In contrast, with UNIX level security, anyone with UID(0) or access to BPX.SUPERUSER in the FACILITY class can
    establish thread-level security under any other z/OS UNIX user without authentication. This violates separation of duties
    and least privilege.
  impact: Implementing z/OS UNIX level security requires servers to be running in a clean address space. This requires additional
    setup and maintenance to identify programs that are allowed to execute in the server address space and define them to
    RACF program control.
  references: []
  page_start: 473
  audit_raw: 'Verify that the BPX.SERVER profile is defined in the FACILITY class and that only server

    user IDs are permitted with READ or UPDATE access.

    RLIST FACILITY BPX.SERVER AUTHUSER'
  remediation: 'Establish a plan by which to identify programs that are executed by the server

    application, define them to program control, and then define BPX.SERVER in the FACILITY

    class.'
  checks:
  - type: manual_review
    info: 'Verify that the BPX.SERVER profile is defined in the FACILITY class and that only server

      user IDs are permitted with READ or UPDATE access.

      RLIST FACILITY BPX.SERVER AUTHUSER'
    severity: medium
- id: '9.30'
  title: Ensure that file systems containing critical data are protected from access using profiles in the FSACCESS class
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Critical data can be stored within zFS file systems. Access to files and directories is controlled by z/OS
    UNIX mechanisms such as UID(0), file ownership, file permission and access control lists. Using profiles in the FSACCESS
    class, you can restrict the ability to cross a mount point into a zFS file system to only those explicitly permitted in
    the profile. This overrides even UID0) authority. Once you have crossed the mount point, UNIX rules apply when accessing
    files and directories within that file system. File systems containing critical data should be protected with an FSACCESS
    profile.
  rationale: Access at the mount point level is controlled only by RACF security administrators. This provides a clear separation
    of duties in the event that you have UID(0) users. It also provides protection against overly permissive access rules
    in z/OS UNIX made outside the scope of control of the security administrator.
  impact: Use of the FSACCES class can cause increased CPU usage in some environments.
  references: []
  page_start: 475
  audit_raw: 'Make sure that the FSACCESS class is active and RACLISTed, as reported by the

    SETROPTS LIST command.

    The UNIX shell command named df will display a list of the currently mounted file

    systems, by mount point (UNIX directory path) and data set name.

    For each of these, identify the ones that contain critical data.

    Using the data set name as a RACF profile name, see if it is covered by an FSACCESS

    profile:

    RLIST FSACCESS <data-set-name> ALL'
  remediation: 'For each data set containing critical data, define an FSACCESS profile (discrete or generic

    as the nature of the data requires) with the following attributes:

    • UACC(NONE)

    • No ID(*) on the access list

    • Not in WARNING mode

    • READ access is restricted to only those who need to access the critical data and to

    those managing the security of the files and directories within the file system

    • All accesses are being logged'
  checks:
  - type: manual_review
    info: 'Make sure that the FSACCESS class is active and RACLISTed, as reported by the

      SETROPTS LIST command.

      The UNIX shell command named df will display a list of the currently mounted file

      systems, by mount point (UNIX directory path) and data set name.

      For each of these, identify the ones that contain critical data.

      Using the data set name as a RACF profile name, see if it is covered by an FSACCESS

      profile:

      RLIST FSACCESS <data-set-name> ALL'
    severity: medium
- id: '9.31'
  title: Ensure that file systems are mounted read-only wherever possible
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Some zFS file systems contain data that is not expected to change. For example, a file system may be dedicated
    to containing the binary executables of a specific application. You generally do not expect this data to change until
    the next time you apply service.
  rationale: Mounting a file system in read-only mode protects against accidental or malicious changes to the data within.
  impact: None.
  references: []
  page_start: 477
  audit_raw: 'The UNIX shell command named df displays a list of the currently mounted file

    systems, by mount point (UNIX directory path) and data set name. Using the verbose

    option, yields additional information, including the mount mode.

    df -v

    The mount mode will be displayed as Read Only or Read/Write'
  remediation: 'For each Read/Write-mounted file system in which you don’t expect data to change,

    plan to remount it in read-only mode as application availability allows, and update the

    BPXPRMxx member of SYS1.PARMLIB to make the change effective at the next IPL'
  checks:
  - type: manual_review
    info: 'The UNIX shell command named df displays a list of the currently mounted file

      systems, by mount point (UNIX directory path) and data set name. Using the verbose

      option, yields additional information, including the mount mode.

      df -v

      The mount mode will be displayed as Read Only or Read/Write'
    severity: medium
- id: '9.32'
  title: Ensure that file systems are mounted with set-id files disabled wherever possible
  scoring: manual
  profile:
  - Level 1
  description: Set-user-ID and set-group-ID files are those containing executables that run under the identity of the file
    owner rather than the person running the executable. These are often the target of attackers. On the other hand, some
    applications rely on these types of files to operate as expected. Any file system that is not expected to contain set-id
    files should be mounted in NOSETUID mode. In this mode, the set-user-ID and set-group-ID bits in the file mode are ignored.
  rationale: Mounting a file system in NOSETUID mode reduces the attack surface of your zFS file systems.
  impact: None
  references: []
  page_start: 479
  audit_raw: 'The UNIX shell command named df displays a list of the currently mounted file

    systems, by mount point (UNIX directory path) and data set name. Using the verbose

    option, yields additional information, including mount options.

    df -v

    The presence of the string No SUID indicates the file system is mounted with the

    NOSETUID option. If it is mounted with the default of SETUID, no option is displayed.

    The shell find command can be used to search for occurrences of set-user-ID and

    set-group-ID files starting at the path name specified. For example, to see if any set-id

    files exist in the file system mounted on the /usr/lpp/appx directory:

    find /usr/lpp/appx -type f \( -perm -4000 -o -perm -2000 \)

    Note: The spaces within the parentheses are significant.'
  remediation: 'For each file system in which you don’t expect set-id files to exist, plan to remount it

    with the NOSETUID option as application availability allows, and update the BPXPRMxx

    member of SYS1.PARMLIB to make the change effective at the next IPL'
  checks:
  - type: command
    command: find /usr/lpp/appx -type f \( -perm -4000 -o -perm -2000 \)
    expected: ''
    severity: medium
    info: 'The UNIX shell command named df displays a list of the currently mounted file

      systems, by mount point (UNIX directory path) and data set name. Using the verbose

      option, yields additional information, including mount options.

      df -v

      The presence of the string No SUID indicates the file system is mounted with the

      NOSETUID option. If it is mounted with the default of SETUID, no option is displayed.

      Th'
- id: '9.33'
  title: Ensure that no file systems are mounted with security disabled
  scoring: scored
  profile:
  - Level 1
  description: If a file system is mounted with the NOSECURITY option, everyone has all access to every object in the file
    system. In a production environment, no file system should be mounted with this option.
  rationale: Mounting a file system in NOSECURITY mode completely nullifies any access control established within it, opening
    the data for reading and writing to everyone.
  impact: None
  references: []
  page_start: 481
  audit_raw: 'The UNIX shell command named df displays a list of the currently mounted file

    systems, by mount point (UNIX directory path) and data set name. Using the verbose

    option, yields additional information, including mount options.

    df -v

    The presence of the string No Security indicates the file system is mounted with the

    NOSECURITY option. If it is mounted with the default of SECURITY, no option is displayed.'
  remediation: 'For each file system mounted with the NOSECURITY option, plan to remount it without the

    NOSECURITY option as application availability allows and update the BPXPRMxx member of

    SYS1.PARMLIB to make the change effective at the next IPL'
  checks:
  - type: manual_review
    info: 'The UNIX shell command named df displays a list of the currently mounted file

      systems, by mount point (UNIX directory path) and data set name. Using the verbose

      option, yields additional information, including mount options.

      df -v

      The presence of the string No Security indicates the file system is mounted with the

      NOSECURITY option. If it is mounted with the default of SECURITY, no option is displayed.'
    severity: medium
