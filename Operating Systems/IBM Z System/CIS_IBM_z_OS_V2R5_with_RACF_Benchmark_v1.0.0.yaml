- id: 2.3.3
  title: Ensure that the PROTECTALL SETROPTS value is set to FAIL
  scoring: scored
  profile:
  - Level 1
  description: When PROTECTALL processing is active and set to FAIL, the system automatically rejects any request to create
    or access a data set that is not RACF-protected. This includes DASD data sets, tape data sets, catalogs, and GDG base
    names. Temporary data sets that comply with standard MVS temporary data set naming conventions are excluded from PROTECTALL
    processing. SETROPTS PROTECTALL(FAILURES) activates PROTECTALL processing. FAILURES Specifies that RACF is to reject any
    request to create or access a data set that is not RACF protected. WARNING Specifies that when a user requests creation
    of, or access to, a data set that is not RACF protected, RACF allows the request and issues warning messages to the user
    and the security administrator. NOPROTECTALL Specifies that a user can create or access a data set that is not protected
    by a profile. NOPROTECTALL is in effect when RACF is using a newly initialized database. These values become effective
    immediately as after the command SETROPTS PROTECTALL(FAILURES) is issued. For PROTECTALL to work effectively, you must
    specify GENERIC to activate generic profile checking. Otherwise, RACF would allow users to create or access only data
    sets protected by discrete profiles. Ensure that no RACF-protected resources will be created or accessed.
  rationale: If PROTECTALL processing is not active, the system grants the ability to create or access a data set that is
    not RACF-protected. The improper setting of any subsystem fields, individually or in combination with another, can compromise
    the security of the processing environment. In addition, failure to establish standardized settings for the ACP control
    options introduces the possibility of exposure during migration process or contingency plan activation.
  impact: The performance impact of PROTECTALL(FAIL) is negligible.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223704 Rule ID: SV-223704r604139_rule STIG ID: RACF-ES-000570'
  page_start: 137
  audit_raw: 'Issue the SETROPTS LIST command and look for the following message:

    PROTECT-ALL IS ACTIVE, CURRENT OPTIONS:

    PROTECT-ALL FAIL OPTION IS IN EFFECT'
  remediation: 'Issue the command:

    SETROPTS PROTECTALL(FAILURES)'
  checks:
  - type: manual_review
