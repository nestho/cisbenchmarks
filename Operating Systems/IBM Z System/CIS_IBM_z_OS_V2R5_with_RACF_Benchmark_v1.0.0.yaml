  title: Ensure FTP Control cards are stored in a secure PDS file
  scoring: manual
  profile:
  - Level 1
  description: FTP control cards carry unencrypted information such as user IDs, passwords and remote IP Addresses. This sensitive
    credential information should be stored separate from the JCL in a secured PDS.
  rationale: Without a requirement to store this information separate from the JCL and in-stream JCL, it allows a security
    exposure by allowing read exposure to this information from anyone having access to the JCL libraries.
  impact: ''
  references: []
  page_start: 235
  audit_raw: 'Provide a list(s) of the locations for all FTP Control cards within a given application,

    ensuring no FTP control cards are within in-stream JCL, JCL libraries or any open

    access datasets. List shall indicate which application uses the PDS, and access

    requirements for those PDS’s (who and what level of access). Lists/spreadsheet used

    for documenting the meeting of this requirement shall be maintained by the responsible

    Application Security Team, available upon request.

    Access to FTP scripts and/or data files located on host system(s) that contain FTP user

    ID and or password will be restricted to those individuals responsible for the application

    connectivity and who have a legitimate requirement to know the user ID and password

    on a remote system.

    FTP Control Cards should not be within In-stream JCL, within JCL libraries or open

    access libraries/datasets.

    Anyone having access of read or greater to the FTP control cards must be listed within

    the spreadsheet by user ID.'
  remediation: 'Create a list or spreadsheet of the locations where FTP control cards are stored, who

    should have access to those libraries and which applications the FTP control cards are

    for.

    Add Columns for all people permitted access to the secured PDS.

    Make sure that the FTP control Cards for each FTP are stored in a secure PDS and that

    they are not placed in the JCL libraries or in the in-stream JCL for each FTP.'
