- id: '3.10'
  title: Ensure that RACF audit logs is reviewed on a regular basis
  scoring: manual
  profile:
  - Level 1
  description: Logging, the recording of data about specific events, is the key to auditing the use of RACF at your installation.
    But you also need to ensure the logs are reviewed at least daily.
  rationale: It is very important for any organization to have security logs and actively using them to monitor security-related
    activities. Security logs must be monitored and analyzed, even real-time if possible (feeding RACF logs to a SIEM) so
    attacks can be detected quickly, and appropriate response triggered.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 Vuln ID: V-3331'
  page_start: 181
  audit_raw: 'Ensure that your auditors are reviewing the RACF events logs at least daily and analyze

    any security related events (including but not limited to: invalid access attempts, new

    accounts creation, elevation of privileges, change of identity, access to sensitive

    resources, …)'
  remediation: ''
  checks:
  - type: manual_review
    info: 'Ensure that your auditors are reviewing the RACF events logs at least daily and analyze

      any security related events (including but not limited to: invalid access attempts, new

      accounts creation, elevation of privileges, change of identity, access to sensitive

      resources, …)'
    severity: medium
- id: '3.11'
  title: Ensure regular audit of AC=1 modules in APF authorized libraries are conducted
  scoring: manual
  profile:
  - Level 1
  description: The AC=1 modules that reside in APF authorized libraries should be reviewed annually. It is important maintain
    documentation identifying the integrity and justification of vendor APF authorized libraries. For non-vendor APF authorized
    libraries, the source and documentation identifying the integrity and justification that describes the AC=1 module process
    should be maintained.
  rationale: Undocumented and/or unauthorized AC=1 modules have a possible risk to the confidentiality, integrity, and availability
    of the system and present a clear risk to the operating system, RACF, and customer data.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 Vuln ID: V-86'
