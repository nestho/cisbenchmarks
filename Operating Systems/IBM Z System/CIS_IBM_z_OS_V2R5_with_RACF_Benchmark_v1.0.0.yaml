- id: 2.4.3
  title: Ensure that access for Surrogate users is controlled
  scoring: scored
  profile:
  - Level 1
  description: Surrogate users have the ability to submit jobs on behalf of another user (the execution user) without specifying
    the execution user's password. Jobs submitted by surrogate users run with the identity of the execution user.
  rationale: Failure to control surrogate users could result in unauthorized personnel accessing sensitive resources. This
    exposure may threaten the integrity and availability of the operating system environment and compromise the confidentiality
    of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223755 Rule ID: SV-223755r604139_rule STIG ID: RACF-JS-000110'
