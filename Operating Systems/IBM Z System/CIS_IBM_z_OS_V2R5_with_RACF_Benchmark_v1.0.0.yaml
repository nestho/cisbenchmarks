       "a log" for failed and successful access

       no auditing

      The permissions bits and audit bits for a unix file or all the files from'
- id: '9.15'
  title: Ensure that BPX resources are protected
  scoring: scored
  profile:
  - Level 1
  description: The RACF FACILITY class profiles starting with BPX are protecting sensitive Unix System Services capabilities
    and must be protected.
  rationale: z/OS UNIX RACF-defined resources, starting with BPX. in the FACILITY class consist of sensitive capabilities
    including SUPERUSER, daemon, and numerous file manipulation privileges.
  impact: Missing or inaccurate protection of these resources could allow a user to access sensitive data, modify or delete
    data and operating system controls, or issue commands that could negatively impact system availability.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223839 Rule ID: SV-223839r767099_rule STIG ID: RACF-US-000020'
  page_start: 450
  audit_raw: 'Review the following items for the FACILITY resource class:

    1. RACF rules for the BPX.** resource specify a default access of NONE.

    2. There are no RACF user access to the BPX.** resource.

    3. There is no RACF rule for BPX.SAFFASTPATH defined.

    4. RACF rules for each of the BPX resources specify a default access of NONE.

    5. RACF rules for each of the BPX resources restrict access to appropriate system

    tasks or systems programming personnel.'
  remediation: 'Assure the following are true:

    1. RACF rules for the BPX.** resource specify a default access of NONE.

    2. There are no RACF user access to the BPX.** resource.

    3. There is no RACF rule for BPX.SAFFASTPATH defined.

    4. RACF rules for each of the BPX resources specify a default access of NONE.

    5. RACF rules for each of the BPX resources restrict access to appropriate system

    tasks or systems programming personnel.'
  checks:
  - type: manual_review
    info: 'Review the following items for the FACILITY resource class:

      1. RACF rules for the BPX.** resource specify a default access of NONE.

      2. There are no RACF user access to the BPX.** resource.

      3. There is no RACF rule for BPX.SAFFASTPATH defined.

      4. RACF rules for each of the BPX resources specify a default access of NONE.

      5. RACF rules for each of the BPX resources restrict access to appropriate system

      tasks or systems programming personnel.'
    severity: medium
