    The file names will be displayed under the FILE USAGE heading. For example:\nFILE USAGE\n \"RSFJ.WORK.SYS1.SYS4.INMSG\"\
    \n - CONTAINS 0 RECORD(S)\n - OCCUPIES 1 EXTENT(S)\n \"RSFJ.WORK.SYS1.SYS4.OUTMSG\"\n - CONTAINS 0 RECORD(S)\n - OCCUPIES\
    \ 1 EXTENT(S)\nVerify that these data sets are protected with a RACF DATASET profile using the LISTDSD\ncommand. Generally,\
