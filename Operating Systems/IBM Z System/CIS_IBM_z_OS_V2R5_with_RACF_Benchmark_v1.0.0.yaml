- id: 2.4.5
  title: Ensure that started tasks requiring exceptional access rights use the TRUSTED attribute and
  scoring: scored
  profile:
  - Level 1
  description: Some started tasks require access to a broad set of resources, making it impractical to permit the started
    task to each of these resources individually. In these cases, the security administrator can choose between assigning
    the TRUSTED attribute and the PRIVILEGED attribute. While both attributes result in all security checks succeeding, the
    TRUSTED attribute allows for logging those accesses, while PRIVILEGED does not. For this reason, TRUSTED should be chosen
    over PRIVILEGED except for specialized cases which must be justified.
  rationale: A lack of logging can result in loss of visibility as to what protected resources a started task is accessing.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223661 Rule ID: SV-223661r604139_rule STIG ID: RACF-ES-000130'
  page_start: 148
  audit_raw: 'Display the STDATA segment of all profiles in the STARTED class, and identify ones

    running with the PRIVILEGED attribute. RLIST STARTED * STDATA NORACF'
  remediation: 'If the use of PRIVILEGED cannot be justified, change it to TRUSTED:

    RALTER STARTED <profile-name> STDATA(TRUSTED(YES) PRIVILEGED(NO))

    (The change is activated the next time the task is started.)'
  checks:
  - type: manual_review
    info: 'Display the STDATA segment of all profiles in the STARTED class, and identify ones

      running with the PRIVILEGED attribute. RLIST STARTED * STDATA NORACF'
    severity: medium
- id: 2.4.6
  title: Ensure that access to Libraries containing EXIT modules is controlled
  scoring: scored
  profile:
  - Level 1
  description: System exits have a wide range of uses and capabilities within any system. Exits may introduce security exposures
    within the system, modify audit trails, and alter individual user capabilities.
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data,
    and the potential of a hacker adding a routine to a library and possibly creating an exposure. S.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223679 Rule ID: SV-223679r604139_rule STIG ID: RACF-ES-000310'
  page_start: 150
  audit_raw: 'Confirm that data sets containing exit modules are covered by a RACF DATASET profile

    with the following attributes:

