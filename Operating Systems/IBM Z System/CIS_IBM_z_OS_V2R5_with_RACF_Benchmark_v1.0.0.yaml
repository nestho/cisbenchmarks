    other than "public"

    TELNETPARMS block (one defined for each port the server is listening to, typically

    ports 23 and 992)

    The TELNETPARMS INACTIVE and KEEPINACTIVE statements are coded within each

    TELNETPARMS statement block and specifies a value between 1 and 900.

    INACTIVE and KEEPINACTIVE statements should not be coded with a value greater than

    900 or 0. 0 disables the inactivity timer check.

    NOTE: The INACTIVE and KEEPINACTIVE statement can appear in both TELNETGLOBAL

    and TELNETPARM statement blocks.

    The TELNETPARMS TKOSPECLURECON statement should not be coded or it should be

    commented out.

    BEGINVTAM block (one or more defined)

    The BEGINVTAM RESTRICTAPPL statement is not coded or it should be commented out.'
