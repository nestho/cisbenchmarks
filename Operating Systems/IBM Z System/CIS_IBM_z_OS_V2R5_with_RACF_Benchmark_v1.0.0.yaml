- id: 1.2.13
  title: Ensure that RACF RVARYPW are set to non-default values
  scoring: scored
  profile:
  - Level 1
  description: The SETROPTS RVARYPW([SWITCH(switch-pw)][STATUS(status-pw)]) command specifies the passwords that the operator
    is to use to respond to requests to approve RVARY command processing, where switch-pw is the response to a request to
    switch RACF databases or change the operating mode of RACF, and status-pw is the response to a request to change RACF
    or database status from ACTIVE to INACTIVE or from INACTIVE to ACTIVE. Different passwords can be specified for each response.
    Note that NO is not a valid password for either SWITCH or STATUS. These values become effective immediately when RACF
    is activated for the first time.
  rationale: Failure to change the documented default values will allow any general user to change the status of the RACF
    database.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223702 Rule ID: SV-223702r604139_rule STIG ID: RACF-ES-000550'
  page_start: 55
  audit_raw: 'Issue the command:

