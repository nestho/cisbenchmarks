      STATUS FUNCTION.'
    severity: medium
- id: 1.3.1
  title: Ensure that the use of RACF SPECIAL Attribute is justified
  scoring: manual
  profile:
  - Level 1
  description: The SPECIAL user attribute allows full authorization to modify all profiles in RACF database and allows the
    user to perform all RACF functions, except those requiring AUDITOR or ROAUDIT attributes. The Group-Special attribute
    allows decentralized RACF control of datasets and resources. In cases where the scope of authority granted to a Group-Special
    Administrator has an impact on system security, the installation needs to be fully aware and approve its use. This privilege
    should be limited to the security group and administrators because of the extreme control that these users have.
  rationale: Users with SPECIAL privilege can alter any profile and give themselves permissions to alter data, including logging
    and audit data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223713 Rule ID: SV-223713r604139_rule STIG ID: RACF-ES-000660'
  page_start: 58
  audit_raw: 'Find all the user IDs who have the SPECIAL attribute and validate the need for the user

    to have the privilege.

    Execute the RACF Data Security Monitor Utility (ICHDSM00).

    Examine the Selected User Attribute Report:

    //ICHDSM00 JOB CLASS=A,NOTIFY=&SYSUID,MSGCLASS=H //*------------------------

    --------------------------

    //ICHDSM00 EXEC PGM=ICHDSM00

    //SYSPRINT DD SYSOUT=*

    //SYSUT2 DD SYSOUT=*

    //SYSIN DD DUMMY'
  remediation: 'Use the ALTUSER command or the CONNECT command to remove the attribute from the

    user.'
  checks:
  - type: manual_review
    info: 'Find all the user IDs who have the SPECIAL attribute and validate the need for the user

      to have the privilege.

      Execute the RACF Data Security Monitor Utility (ICHDSM00).

      Examine the Selected User Attribute Report:

      //ICHDSM00 JOB CLASS=A,NOTIFY=&SYSUID,MSGCLASS=H //*------------------------

      --------------------------

      //ICHDSM00 EXEC PGM=ICHDSM00

      //SYSPRINT DD SYSOUT=*

      //SYSUT2 DD SYSOUT=*

      //SYSIN DD DUMMY'
    severity: medium
- id: 1.3.2
  title: Ensure that SYS1.UADS contains only emergency use user IDs
  scoring: manual
  profile:
  - Level 1
  description: SYS1.UADS is a dataset where LOGONIDs will be maintained with applicable password information when RACF is
    not functional.
  rationale: If an unauthorized user has access to SYS1.UADS they could enter their LOGONID and password into the SYS1.UADS
    dataset and could give themselves access to the system.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223837 Rule ID: SV-223837r604139_rule STIG ID: RACF-TS-000020'
  page_start: 60
  audit_raw: 'SYS1.UADS is defined but only contains firecall user iDs. Firecall IDs are those that

    are SPECIAL level users but are only to be activated during emergencies when RACF

    database is unavailable.'
  remediation: 'Move all non-emergency user IDs into RACF. Delete all non-emergency user IDs from

    SYS1.UADS.'
  checks:
  - type: manual_review
    info: 'SYS1.UADS is defined but only contains firecall user iDs. Firecall IDs are those that

      are SPECIAL level users but are only to be activated during emergencies when RACF

      database is unavailable.'
    severity: medium
- id: 1.3.3
  title: Ensure that MCS console user ID(s) is protected
  scoring: manual
  profile:
  - Level 1
  description: MCS consoles can be used to issue operator commands. When using the LOGON(AUTO) control, a user with the name
    of the MCS console will be used for access checking.
  rationale: Failure to control access to MCS consoles could result in unauthorized personnel issuing sensitive operator commands.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223716 Rule ID: SV-223716r604139_rule STIG ID: RACF-ES-000690'
  page_start: 62
  audit_raw: 'For each of the console names found in CONSOLxx, verify that:

     The user has been defined in RACF

     The user as no RACF privileges (SPECIAL, OPERATIONS, …)

     The user can’t use online facilities (TSO, CICS ,..)

     The user is only permitted to the resources in MVS.MCSOPER.consolename

    in the OPERCMDS class and defined in the CONSOLE class.

    The IRRUT100 utility can be used to check all the authorizations of the user(s).

    Issue the command:

    IRRUT100 EXEC PGM=IRRUT100

    //IRRUT100 EXEC PGM=IRRUT100

    //SYSUT1 DD UNIT=SYSDA,SPACE=(TRK,(5,1))

    //SYSPRINT DD SYSOUT=*

    //SYSIN DD *

    consolename

    /END'
  remediation: 'If any resource or dataset is permitted to the console user (or group) they must be

    removed.'
  checks:
  - type: manual_review
    info: 'For each of the console names found in CONSOLxx, verify that:

       The user has been defined in RACF

       The user as no RACF privileges (SPECIAL, OPERATIONS, …)

       The user can’t use online facilities (TSO, CICS ,..)

       The user is only permitted to the resources in MVS.MCSOPER.consolename

      in the OPERCMDS class and defined in the CONSOLE class.

      The IRRUT100 utility can be used to check all the authorizations of the user(s).

      Issue the command:

      IRRUT100 EXEC PGM=IRRUT100

      //IRRUT100 EXEC PGM=IRRUT100

      //SY'
    severity: medium
- id: 1.3.4
  title: Ensure that all STARTED class profiles specify PROTECTED user IDs
  scoring: scored
  profile:
  - Level 1
  description: Started procedures have system generated job statements that do not contain the user, group, or password statements.
  rationale: If a user ID is not associated with the started procedure, the started procedure will not have access to the
    resources. If a started procedure is associated with an incorrect user or a user with higher than necessary authority,
    then a potential vulnerability exists.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223719 Rule ID: SV-223719r604139_rule STIG ID: RACF-ES-000720'
  page_start: 64
  audit_raw: 'Verify that the users associated with started tasks have the PROTECTED attribute. List

    each started profile to obtain its user ID then list that user by issuing the commands:

    SEARCH CLASS(STARTED)

    RLIST STARTED <profile-name> STDATA NORACF

    STDATA INFORMATION

    ------------------

    USER= <userid>

    GROUP=

    TRUSTED= YES

    PRIVILEGED= NO

    TRACE= NO

    LISTUSER <userid>

    ATTRIBUTES=PROTECTED

    Look for ATTRIBUTES=PROTECTED.'
  remediation: 'If the user is not PROTECTED, remove the password/passphrase attributes to make it

    PROTECTED with this command:

    CALTUSER userid NOPASSWORD NOPHRASE'
  checks:
  - type: manual_review
    info: 'Verify that the users associated with started tasks have the PROTECTED attribute. List

      each started profile to obtain its user ID then list that user by issuing the commands:

      SEARCH CLASS(STARTED)

      RLIST STARTED <profile-name> STDATA NORACF

      STDATA INFORMATION

      ------------------

      USER= <userid>

      GROUP=

      TRUSTED= YES

      PRIVILEGED= NO

      TRACE= NO

      LISTUSER <userid>

      ATTRIBUTES=PROTECTED

      Look for ATTRIBUTES=PROTECTED.'
    severity: medium
- id: '2.1'
  title: Data Protection 2.1.1 Ensure that Maintenance user IDs are protected
  scoring: manual
  profile:
  - Level 1
  description: DASD management user ID require access to backup and restore all files and present a high degree of risk to
    the environment. Users are given access to perform necessary functions thru use of the DASDVOL class (for non-SMS volumes)
    and/or thru STGADMIN profiles in the FACILITY class for SMS managed volumes. Access to individual profiles in the DATASET
    class should be disallowed.
  rationale: Failure to maintain user id access reduces the integrity and availability of the operating system environment
    and reduces compromises of confidential customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223732 Rule ID: SV-223732r604139_rule STIG ID: RACF-ES-000850'
  page_start: 67
  audit_raw: DASDVOL and STGADMIN profiles are restricted to storage management personnel only.
  remediation: 'Ensure that DASDVOL and STGADMIN profiles reflect the needs of storage management

    personnel. Non-storage management personnel should not have this access.'
  checks:
  - type: manual_review
    info: DASDVOL and STGADMIN profiles are restricted to storage management personnel only.
    severity: medium
- id: 2.1.2
  title: Ensure that access to active SMF collection files is controlled
  scoring: scored
  profile:
  - Level 1
  description: SMF data collection is the system activity journaling facility of the z/OS system. With the proper parameter
    designations, it serves as the basis to ensure individual user accountability. SYS1.MANxx datasets should be created once
    and reused when cleared. Update and allocate access to SMF collection files (i.e., SYS1.MANx, logger) are limited to system
    programmers and/or batch jobs that perform SMF dump processing. Control access based on type - separate collection as
    much as possible.
  rationale: Users may have UPDATE access to the datasets, but ALTER allows for dataset deletion and should be avoided. ALTER
    access reduces the integrity and availability of the operating system environment and reduces compromises of confidential
    customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223701 Rule ID: SV-223701r604139_rule STIG ID: RACF-ES-000540'
  page_start: 70
  audit_raw: All entities on the ACL for SYS1.MANxx datasets are no higher than UPDATE.
  remediation: Change dataset access from ALTER to UPDATE for users and groups on the ACL.
  checks:
  - type: manual_review
    info: All entities on the ACL for SYS1.MANxx datasets are no higher than UPDATE.
    severity: medium
- id: 2.1.3
  title: Ensure that the WHEN(PROGRAM) SETROPTS value is active
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS WHEN(PROGRAM) activates RACF program control, which includes both access control to load modules and
    program access to data sets. To set up access control to load modules, you must identify your controlled programs by creating
    a profile for each in the PROGRAM class. To set up program access to data sets, you must add a conditional access list
    to the profile of each program-accessed data set. Then, when program control is active, RACF ensures that each controlled
    load module is executed only by callers with the defined authority. RACF also ensures that each program-accessed data
    set is opened only by users who are listed in the conditional access list with the proper authority and who are executing
    the program specified in the conditional access list entry. Ensure that RACF will perform program control.
  rationale: Not protecting critical programs and not ensuring a clean address space can compromise the security of the processing
    environment. In addition, failure to establish standardized settings for RACF control options introduces the possibility
    of exposure during migration process or contingency plan activation.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223708 Rule ID: SV-223708r604139_rule STIG ID: RACF-ES-000610'
  page_start: 71
  audit_raw: 'Issue the command:

    SETROPTS LIST

    Then look for WHEN(PROGRAM) in the ATTRIBUTES = section.

    Example:

    ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC)'
  remediation: 'Issue the command:

    SETROPTS WHEN(PROGRAM)'
  checks:
  - type: manual_review
    info: 'Issue the command:

      SETROPTS LIST

      Then look for WHEN(PROGRAM) in the ATTRIBUTES = section.

      Example:

      ATTRIBUTES = INITSTATS WHEN(PROGRAM -- BASIC)'
    severity: medium
- id: 2.1.4
  title: Ensure that the ICHDSM00 program is protected
  scoring: scored
  profile:
  - Level 1
  description: ICHDSM00 is the data security monitor utility. READ authority to this program in the PROGRAM class is one way
    a user can have authority to run the utility. RACF ships the utility in SYS1.LINKLIB. Further, SYS1.LINKLIB is generally
    one of the code libraries identified in the PROGRAM * or ** profile and is always treated as UACC(READ) , even if the
    profile itself has a more restrictive UACC. Therefore, a more specific PROGRAM profile should be defined to protect ICHDSM00.
  rationale: ICHDSM00 provides information on the security posture of the system. Such information should not be available
    to general users.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'To see if ICHDSM00 is explicitly protected issue the command:

    RLIST PROGRAM ICHDSM00 ALL'
  remediation: 'Define a PROGRAM profile named ICHDSM00 with the following attributes:

     UACC(NONE)

     No ID(*) on the access list

     READ access is restricted to system programmers and/or security personnel with

    a need to know, who do not already have the AUDITOR or ROAUDIT attributes

     All accesses are being logged'
  checks:
  - type: manual_review
    info: 'To see if ICHDSM00 is explicitly protected issue the command:

      RLIST PROGRAM ICHDSM00 ALL'
    severity: medium
- id: 2.1.5
  title: Ensure that the IRRDPI00 program is protected
  scoring: scored
  profile:
  - Level 1
  description: ICHDPI00 is the program that is used to update the dynamic parse function in RACF, and to refresh in-storage
    custom field data after making updates in the CFIELD class. READ authority to this program in the PROGRAM class is one
    way a user can have authority to run the program. RACF ships the program in SYS1.LINKLIB. Further, SYS1.LINKLIB is generally
    one of the code libraries identified in the PROGRAM * or ** profile, and is always treated as UACC(READ). even if the
    profile itself has a more restrictive UACC. Therefore, a more specific PROGRAM profile should be defined to protectIRRDPI00.
  rationale: IRRDPI00 updates the RACF configuration, and thus access should not be allowed for general users.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'To see if IRRDPI00 is explicitly protected issue the command:

    RLIST PROGRAM IRRDPI00 ALL'
  remediation: '1. Define a PROGRAM profile named IRRDPI00 with the following attributes:

    o UACC(NONE)

    o No ID(*) on the access list

    2. If you have non-SPECIAL users with a need to issue the IRRDPI00 command, use

    the IRRDPI00 profile in the FACILITY class to grant access. This profile should

    have the following attributes:

    o UACC(NONE)

    o No ID(*)on the access list

    o Not in WARNING mode

    o READ access is restricted to system programmers and security personnel

    with a need to use the IRRDPI00 command

    o All accesses are being logged'
  checks:
  - type: manual_review
    info: 'To see if IRRDPI00 is explicitly protected issue the command:

      RLIST PROGRAM IRRDPI00 ALL'
    severity: medium
- id: 2.1.6
  title: Ensure that the SETROPTS ERASE value is set to ERASE(ALL) on all systems
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS ERASE(ALL) specifies that data management is to erase all scratched data sets including temporary
    data sets. NOERASE specifies that no DASD data sets are erased when deleted. The system-wide options control the default
    settings for determining how RACF will function when handling requests for access to the operating system environment,
    RACF, and customer data. RACF provides the ability to set a number of these fields at the subsystem level. If no setting
    is found, the system-wide defaults will be used.
  rationale: Not maintaining these fields, individually or in combination with another, can compromise the security of the
    processing environment. In addition, failure to establish standardized settings for RACF control options introduces the
    possibility of exposure during migration process or contingency plan activation.
  impact: The impact of SETROPTS ERASE(ALL) is directly proportional to the amount of DASD space which is being deleted. While
    recent releases of z/OS have substantially improved the performance of data set erasure, there may be system impacts if
    a large amount of DASD space is being erase.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223731 Rule ID: SV-223731r604139_rule STIG ID: RACF-ES-000840'
  page_start: 77
  audit_raw: 'Issue command:

    SETROPTS LIST

    Set ERASE values as follows:

    ERASE-ON-SCRATCH IS ACTIVE, CURRENT OPTIONS:

    ERASE-ON-SCRATCH FOR ALL DATA SETS IS IN EFFECT'
  remediation: 'To show the status of RACF Controls including the status of the ERASE options issue

    Command:

    SETR LIST

    To enable Erase On Scratch for all datasets issue the command:

    SETR ERASE(ALL)'
  checks:
  - type: manual_review
    info: 'Issue command:

      SETROPTS LIST

      Set ERASE values as follows:

      ERASE-ON-SCRATCH IS ACTIVE, CURRENT OPTIONS:

      ERASE-ON-SCRATCH FOR ALL DATA SETS IS IN EFFECT'
    severity: medium
- id: 2.1.7
  title: Ensure that the TEMPDSN class is active
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS CLASSACT(TEMPDSN) provides protection for DFP-managed temporary data sets if these data sets are not
    deleted by the job or session which created them.
  rationale: 'You can protect DFP-managed temporary data sets. Normally, these data sets are considered protected from any
    accesses except by the job or session that created them, and therefore do not need to be protected by RACF®. However,
    the following situations could leave a temporary data set unprotected:  A system failure  An initiator failure or initiator
    termination by the FORCE command  An automatic restart - between the failure and the restart In these cases, if the TEMPDSN
    class is active, only users with the OPERATIONS attribute can scratch any residual DFP-managed temporary data sets remaining
    on a volume.'
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223660 Rule ID: SV-223660r604139_rule STIG ID: RACF-ES-000120'
  page_start: 79
  audit_raw: 'Look for the TEMPDSN class in ACTIVE CLASSES = section after issuing the command:

    SETROPTS LIST'
  remediation: 'Issue the command:

    SETROPTS CLASSACT(TEMPDSN)'
  checks:
  - type: manual_review
    info: 'Look for the TEMPDSN class in ACTIVE CLASSES = section after issuing the command:

      SETROPTS LIST'
    severity: medium
- id: 2.1.8
  title: Ensure the RACF security data sets and all copies are protected
  scoring: scored
  profile:
  - Level 1
  description: 'RACF database files contain all access control information for the operating system environment and system
    resources as well as user registry, user permissions and user authentication data. RACF data set rules for RACF security
    data sets and/or databases restrict READ access to auditors and processes which perform RACF database backup operations.
    RACF data set rules for RACF security data sets and/or databases restrict READ and/or greater access to z/OS systems programming
    personnel, security personnel, and/or batch jobs that perform RACF maintenance. All (i.e., failures and successes) data
    set access authorities (i.e. READ, UPDATE, ALTER, and CONTROL for RACF security data sets and/or databases are logged."
    Note: Active and backup datasets, that may be split across multiple datasets, or any offloaded copy must be protected.'
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223685 Rule ID: SV-223685r604139_rule STIG ID: RACF-ES-000370'
  page_start: 81
  audit_raw: ' RACF data set rules for RACF security data sets and/or databases restrict READ

    access to auditors and processes which perform RACF database backup

    operations.

     RACF data set rules for RACF security data sets and/or databases restrict READ

