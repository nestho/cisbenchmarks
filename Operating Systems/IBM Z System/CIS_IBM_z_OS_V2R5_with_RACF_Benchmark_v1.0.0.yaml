- id: 8.6.2
  title: Ensure that bypass label processing (BLP=) is not set on any JOBCLASS
  scoring: manual
  profile:
  - Level 1
  description: BLP=YES on a JOBCLASS statement allows certain security checks to be skipped when accessing certain tape data
    set. There are other ways to manage this setting than the JOBCLASS statement. See https://www.ibm.com/docs/en/zos/2.5.0?topic=tape-racfauthorization-bypass-label-processing-blp
    for details on how to properly set this.
  rationale: Using BLP=YES on a JOBCLASS statement could expose data on tapes. It is possible to limit what user IDs could
    use a JOBCLASS with BLP=YES, but a better way would be use RACF to manage the processing.
  impact: ''
  references: []
  page_start: 413
  audit_raw: 'Use the JES2 command to display the current setting of the BLP parameter.

    $D JOBCLASS(*),BLP

    e.g.

    $D JOBCLASS(A),BLP

    $HASP837 JOBCLASS(A) BLP=NO'
  remediation: "Use the command to alter the current BLP processing for any job class that specified\nBLP=YES.\n$T JOBCLASS(x),BLP=NO\n\
    e.g.\n$T JOBCLASS(A),BLP=NO\nAlso examine the JES2 initialization parameters to determine if the BLP=YES specification\n\
    is specified.\nNote that the JOBCLASS specifications in the initialization parameters only apply when a\nJES2 system is\
    \ COLD started (the saved settings are used on all warm starts). Examining\nthe setting in the initialization parameters\
    \ is not sufficient to determine what the system\nis actually using.\nTo determine the initialization data sets being\
    \ used by this JES2 instance, use the\ncommand:\n$D INITINFO\n $HASP825 INITINFO\n$HASP825 INITINFO --- Command used to\
    \ start JES2\n$HASP825 S JES2,N=ZOS203,M=SPOOLZ23,PARM=(COLD,NOREQ)\n$HASP825 --- HASPPARM data sets read\n$HASP825 DSN=SYS1.PARMLIB(SPOOLZ23),VOLSER=J2SHR2,\n\
    $HASP825 CARDS=462,\n$HASP825 DSN=SYS1.PARMLIB(DYEXIT21),CARDS=124,\n$HASP825 DSN=SYS1.PARMLIB(NULL),VOLSER=J2SHR2,CARDS=1"
  checks:
  - type: manual_review
    info: 'Use the JES2 command to display the current setting of the BLP parameter.

      $D JOBCLASS(*),BLP

      e.g.

      $D JOBCLASS(A),BLP

      $HASP837 JOBCLASS(A) BLP=NO'
    severity: medium
- id: 8.6.3
  title: Ensure that use of JES2 input sources are controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 input sources provide a variety of channels for job submission. Failure to properly control the use of
    these input sources could result in unauthorized submission of work into the operating system.
  rationale: This exposure may threaten the integrity and availability of the operating system environment and compromise
    the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223747 Rule ID: SV-223747r604139_rule STIG ID: RACF-JS-000030'
  page_start: 415
  audit_raw: 'Review the following resources in the JESINPUT resource class:

    `INTRDR` (internal reader for batch jobs)

    `nodename` (NJE node)

    `OFFn.*` (spool offload receiver)

    `Rnnnn` (RJE workstation)

    `RDRnn` (local card reader)

    `STCINRDR` (internal reader for started tasks)

    `TSUINRDR` (internal reader for TSO logons)

    NOTE: If any of the following are not defined within the JES2 parameters, the resource

    in the JESINPUT resource class does not have to be defined.

    NOTE 1: Nodename is the NAME parameter in the NODE statement.

    NOTE 2: OFFn, where n is the number of the offload receiver.

    NOTE 3: Rnnnn, where nnnn is the number of the remote workstation.

    NOTE 4: RDRnn, where nn is the number of the reader.

    Ensure the following items are in effect:

    1. The JESINPUT resource class is active.

    2. The resources mentioned above are protected by generic and/or fully qualified

    profiles defined to the JESINPUT resource class.

    3. UACC(NONE) is specified for all resources.

    NOTE: UACC(READ) is allowed for input sources that are permitted to submit

    jobs for all users. No guidance on which input sources are appropriate for

    UACC(READ). However, common sense should prevail during the analysis. For

    example, UACC(READ) would typically be inappropriate for RJE, NJE, offload,

    and STC input sources.'
  remediation: 'Ensure the following items are in effect:

    1. The JESINPUT resource class is active.

    2. The resources below are protected by generic and/or fully qualified profiles

    defined to the JESINPUT resource class.

    INTRDR (internal reader for batch jobs)

    nodename (NJE node)

    OFFn.* (spool offload receiver)

    Rnnnn (RJE workstation)

    RDRnn (local card reader)

    STCINRDR (internal reader for started tasks)

    TSUINRDR (internal reader for TSO logons)

    3. UACC(NONE) is specified for all resources.

    NOTE: UACC(READ) is allowed for input sources that are permitted to submit

    jobs for all users. Currently, there is no guidance on which input sources are

    appropriate for UACC(READ). However, common sense should prevail during

    the analysis. For example, UACC(READ) would typically be inappropriate for

    RJE, NJE, offload, and STC input sources.'
  checks:
  - type: manual_review
    info: 'Review the following resources in the JESINPUT resource class:

      `INTRDR` (internal reader for batch jobs)

      `nodename` (NJE node)

      `OFFn.*` (spool offload receiver)

      `Rnnnn` (RJE workstation)

      `RDRnn` (local card reader)

      `STCINRDR` (internal reader for started tasks)

      `TSUINRDR` (internal reader for TSO logons)

      NOTE: If any of the following are not defined within the JES2 parameters, the resource

      in the JESINPUT resource class does not have to be defined.

      NOTE 1: Nodename is the NAME parameter in the N'
    severity: medium
- id: 8.7.1
  title: Ensure that RJE workstations and NJE nodes are controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 RJE workstations and NJE nodes provide a method of sending and receiving data (e.g., jobs, job output,
    and commands) from remote locations. Failure to properly identify and control these remote facilities could result in
    unauthorized sources transmitting data to and from the operating system. This exposure may threaten the integrity and
    availability of the operating system environment and compromise the confidentiality of customer data.
  rationale: ''
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223745 Rule ID: SV-223745r604139_rule STIG ID: RACF-JS-000010'
  page_start: 418
  audit_raw: "Refer to\n SYS1.PARMLIB (JES2PARM)\nFor each node entry check that all JES2 defined NJE nodes and RJE workstations\
    \ have\na profile defined in the FACILITY resource class.\nNOTE: NJE.* and RJE.* profiles will force user ID and password\
    \ protection of all NJE\nand RJE connections respectively. This method is acceptable in lieu of using discrete\nprofiles."
  remediation: 'Configure associated PROFILEs TO exist for all RJE/NJE sources and review the

    authorizations for these remote facilities.'
  checks:
  - type: manual_review
    info: "Refer to\n SYS1.PARMLIB (JES2PARM)\nFor each node entry check that all JES2 defined NJE nodes and RJE workstations\
      \ have\na profile defined in the FACILITY resource class.\nNOTE: NJE.* and RJE.* profiles will force user ID and password\
      \ protection of all NJE\nand RJE connections respectively. This method is acceptable in lieu of using discrete\nprofiles."
    severity: medium
- id: 8.7.2
  title: Ensure that RJE workstations and NJE nodes are controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 RJE workstations and NJE nodes provide a method of sending and receiving data (e.g., jobs, job output,
    and commands) from remote locations. Failure to properly identify and control these remote facilities could result in
    unauthorized sources transmitting data to and from the operating system.
  rationale: This exposure may threaten the integrity and availability of the operating system environment and compromise
    the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223756 Rule ID: SV-223756r604139_rule STIG ID: RACF-JS-000120'
  page_start: 420
  audit_raw: 'Review the JES2 parameters for RJE workstation definitions by searching for RMT( in

    the report.

    Ensure the RJE workstation user IDs are defined as follows:

    1. A user ID of RMTnnnn is defined to RACF for each RJE workstation, where nnnn

    is the number on the RMT statement.

    2. No user ID segments (e.g., TSO, CICS, etc.) are defined.

    3. Restricted from accessing all data sets and resources with exception of the

    corresponding JESINPUT class profile for that remote.'
  remediation: 'RJE user IDs

    Note that this guidance addresses RJE Workstations that are "Dedicated". If an RJE

    workstation is dedicated, the assumption is that the RJE to host connection is hardwired between the RJE and host. In
    this case the RMT definition statement will contain

    the keyword LINE= which specifies that this RJE is only connected via that one LINE

    statement.

    a) Review the JES2 parameters for RJE workstation definitions

    b) Ensure the RJE workstation user IDs are defined as follows:

     A user ID of RMTnnnn is defined to RACF for each RJE workstation, where nnnn

    is the number on the RMT statement.

     No user ID segments (e.g., TSO, CICS, etc.) are defined.

     Restricted from accessing all data sets and resources with exception of the

    corresponding JESINPUT-class profile for that remote.

    Review Chapter 17 of RACF Security Admin Guide. The following is an example that

    show proper implementation:

    AG RMTGRP OWNER(ADMIN) SUPGROUP(ADMIN)

    AU RMT777 NAME(''RMT RJE 777'') DFLTGRP(RMTGRP) OWNER(RMTGRP) DATA(''COMPLY WITH

    ZJES0011'') NOPASS RESTRICTED

    PE RMT777 CL(JESINPUT) ID(RMT777)

    c) Ensure that a FACILITY-Class profile exists in the format RJE.RMTnnnn where nnn

    identifies the remote number.

    A command example is shown here:

    RDEF FACILITY RJE.RMT777 UACC(NONE) OWNER(ADMIN) DATA(''COMPLY WITH ZJES0011

    FOR RJE 777'')'
  checks:
  - type: manual_review
    info: 'Review the JES2 parameters for RJE workstation definitions by searching for RMT( in

      the report.

      Ensure the RJE workstation user IDs are defined as follows:

      1. A user ID of RMTnnnn is defined to RACF for each RJE workstation, where nnnn

      is the number on the RMT statement.

      2. No user ID segments (e.g., TSO, CICS, etc.) are defined.

      3. Restricted from accessing all data sets and resources with exception of the

      corresponding JESINPUT class profile for that remote.'
    severity: medium
- id: '9.1'
  title: Ensure that z/OS UNIX SURROGAT resources are protected
  scoring: scored
  profile:
  - Level 1
  description: Resources in the SURROGAT class that start with "BPX." protect the ability to switch to another identity without
    providing an authenticator. Servers do this programmatically to run under the identity of their clients, and users can
    issue the shell ‘su’ command to switch to another identity. These are sensitive functions that must be protected and logged,
    and must be used only by servers, not humans.
  rationale: Improper protection of BPX SURROGAT resources can result in unintended privilege escalation and loss of accountability.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 423
  audit_raw: 'All BPX SURROGAT profiles should specify a default (universal) access of NONE.

    There are several ways this can be checked, including manually, or by using tooling

    such as reports and queries against RACF Database Unload output, or by inspecting

    the results of the RACF_SENSITIVE_RESOURCES Health Check.

    To check manually, issue the SEARCH command to locate all relevant profiles:

    SEARCH CLASS(SURROGAT) MASK(BPX)

    For each profile, check the universal access and logging options:

    RLIST SURROGAT BPX.SRV.userID

    In the command output, make sure the value under the UNIVERSAL ACCESS heading is

    NONE.

    Verifying that only server user IDs have permission to BPX SURROGAT profiles is a

    procedural effort.'
  remediation: 'RACF rules for all BPX.SRV.userid SURROGAT resources must specify a default

    access of NONE

    A sample is provided here:

    RALTER SURROGAT BPX.SRV.userID UACC(NONE)

    RACF access lists for all BPX.SRV.userid SURROGAT resources must restrict access

    to system software processes (e.g., web servers) that act as servers under z/OS UNIX.'
  checks:
  - type: manual_review
    info: 'All BPX SURROGAT profiles should specify a default (universal) access of NONE.

      There are several ways this can be checked, including manually, or by using tooling

      such as reports and queries against RACF Database Unload output, or by inspecting

      the results of the RACF_SENSITIVE_RESOURCES Health Check.

      To check manually, issue the SEARCH command to locate all relevant profiles:

      SEARCH CLASS(SURROGAT) MASK(BPX)

      For each profile, check the universal access and logging options:

      RLIST SURROGAT BPX.SR'
    severity: medium
- id: '9.2'
  title: Ensure that resources protecting superuser capabilities in the UNIXPRIV class are protected
  scoring: scored
  profile:
  - Level 1
  description: Resources in the UNIXPRIV class that start with "SUPERUSER." protect the various capabilities granted to a
    user with UID(0). By defining profiles in the UNIXPRIV class, you can avoid assigning UID(0) to users by specifically
    granting certain superuser privileges with a high degree of granularity. This allows you to minimize the number of assignments
    of superuser authority at your installation and reduces your security risk.
  rationale: UID(0) generally provides too much authority and presents a separation of duties issue, especially for human
    users. UNIXPRIV can be used to implement Least Privilege for UNIX superuser authorities.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 425
  audit_raw: 'All SUPERUSER UNIXPRIV profiles should specify a default (universal) access of

    NONE.

    There are several ways this can be checked, including manually, or by using tooling

    such as reports and queries against RACF Database Unload output, or by inspecting

    the results of the RACF_SENSITIVE_RESOURCES Health Check.

    To check manually, issue the SEARCH command to locate all relevant profiles:

    SEARCH CLASS(UNIXPRIV) MASK(SUPERUSER)

    For each profile, check the universal access and logging options:

    RLIST UNIXPRIV SUPERUSER.FILESYS

    In the command output, make sure the value under the UNIVERSAL ACCESS heading is

    NONE.'
  remediation: 'Specify a default access of NONE and refresh the UNIXPRIV class:

    RALTER UNIXPRIV SUPERUSER.FILESYS UACC(NONE)

    SETROPTS RACLIST(UNIXPRIV) REFRESH'
  checks:
  - type: manual_review
    info: 'All SUPERUSER UNIXPRIV profiles should specify a default (universal) access of

      NONE.

      There are several ways this can be checked, including manually, or by using tooling

      such as reports and queries against RACF Database Unload output, or by inspecting

      the results of the RACF_SENSITIVE_RESOURCES Health Check.

      To check manually, issue the SEARCH command to locate all relevant profiles:

      SEARCH CLASS(UNIXPRIV) MASK(SUPERUSER)

      For each profile, check the universal access and logging options:

      RLIST UNI'
    severity: medium
- id: '9.3'
  title: Ensure that general users are not allowed to change their file ownership
  scoring: scored
  profile:
  - Level 1
  description: By default, only superusers can change the ownership of any file to any UID or GID on the system, and general
    users can only change the group ownership of files that they own, and only to one of their own associated GIDs. However,
    by defining a profile called CHOWN.UNRESTRICTED in the UNIXPRIV class, selected users can be permitted to transfer ownership
    of files they own to any UID or GID on the system. This is a less secure configuration.
  rationale: Only highly trusted users should be allowed to change UNIX file ownership.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 427
  audit_raw: 'Look for the existence of the CHOWN.UNRESTRICTED profile in the UNIXPRIV class.

    It must be a discrete profile.

    RLIST UNIXPRIV CHOWN.UNRESTRICTED ALL'
  remediation: 'Delete the profile and refresh the UNIXPRIV class.

    RDELETE UNIXPRIV CHOWN.UNRESTRICTED

    SETROPTS RACLIST(UNIPRIV) REFRESH'
  checks:
  - type: manual_review
    info: 'Look for the existence of the CHOWN.UNRESTRICTED profile in the UNIXPRIV class.

      It must be a discrete profile.

      RLIST UNIXPRIV CHOWN.UNRESTRICTED ALL'
    severity: medium
- id: '9.4'
  title: Ensure that RESTRICTED users cannot access UNIX files to which they are not explicitly permitted
  scoring: scored
  profile:
  - Level 1
  description: 'A user with the RESTRICTED attribute cannot access RACF-protected resources by default mechanisms: the universal
    access of a profile, ID(*) in an access list, or the global access table. However, this restriction does not automatically
    apply to UNIX files.'
  rationale: RESTRICTED users may be able to access information they are not intended to have, by virtue of a file’s ‘other’
    permission bits.
  impact: ''
  references: []
  page_start: 429
  audit_raw: 'Look for the existence of the RESTRICTED.FILESYS.ACCESS profile in the UNIXPRIV

    class.

    RLIST UNIXPRIV CHOWN.UNRESTRICTED ALL'
  remediation: 'Define the profile and refresh the UNIXPRIV class.

    RDEFINE UNIXPRIV RESTRICTED.FILESYS.ACCESS UACC(NONE)

    SETROPTS RACLIST(UNIPRIV) REFRESH'
  checks:
  - type: manual_review
    info: 'Look for the existence of the RESTRICTED.FILESYS.ACCESS profile in the UNIXPRIV

      class.

      RLIST UNIXPRIV CHOWN.UNRESTRICTED ALL'
    severity: medium
- id: '9.5'
  title: Ensure that newly assigned UIDs and GIDs are unique values
  scoring: scored
  profile:
  - Level 1
  description: When users and groups share UIDs and GIDs, respectively, they are essentially the same entity to the UNIX kernel.
  rationale: Sharing ids can result in unintended file access and a loss of accountability. Reverse mapping to a user ID or
    group name does not yield a consistent or predictable result (with the exception of UID 0) which can lead to confusion
    in displays such as the output of an ‘ls’ command. The only value that should ever be shared is a UID of 0, which is often
    required by different daemons and servers.
  impact: Administrators will need to know that the SHARED keyword must be specified when assigning a value, such as UID(0),
    that is already in use. They will require READ access to SHARED.IDS in order to do so.
  references: []
  page_start: 430
  audit_raw: 'Look for the existence of the SHARED.IDS profile in the UNIXPRIV class.

    RLIST UNIXPRIV SHARED.IDS ALL'
  remediation: 'Define the profile and refresh the UNIXPRIV class.

    RDEFINE UNIXPRIV SHARED.IDS UACC(NONE)

    SETROPTS RACLIST(UNIPRIV) REFRESH'
  checks:
  - type: manual_review
    info: 'Look for the existence of the SHARED.IDS profile in the UNIXPRIV class.

      RLIST UNIXPRIV SHARED.IDS ALL'
    severity: medium
- id: '9.6'
  title: Ensure that z/OS UNIX user accounts are defined
  scoring: scored
  profile:
  - Level 1
  description: User IDs, groups, and started tasks that use z/OS UNIX facilities are defined to RACF with an OMVS segment
    containing attributes such as UID and GID.
  rationale: If these attributes are not correctly defined, data access or command privilege controls could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 432
  audit_raw: 'Verify that each z/OS UNIX user’s OMVS segment in their USER profile adheres to the

    following:

    1. A unique UID number (except for UID(0) users)

    2. A unique HOME directory (except for UID(0) and other system task accounts)

    3. Shell program specified as “/bin/sh”, “/bin/tcsh”, “/bin/echo”, or “/bin/false”

    NOTE: The shell program must have one of the specified values. The HOME directory

    must have a value (i.e., not be allowed to default).

    NOTE: RACF ships a set of sample reports based on the output of IRRDBU00 (the

    RACF data base unload utility) in the SYS1.SAMPLIB member named IRRICE. The

    report named "UIDS" searches for shared UID values.'
  remediation: 'The systems programmer will verify that each user account is defined as specified

    below:

    NOTE: This check only applies to users of z/OS UNIX (i.e., users with an OMVS profile

    defined).

    1. A unique UID number (except for UID(0) users)

    2. A unique HOME directory (except for UID(0) and other system task accounts)

    3. Shell program specified as “/bin/sh”, “/bin/tcsh”, “/bin/echo”, or “/bin/false”

    NOTE: The shell program must have one of the specified values. The HOME directory

    must have a value (i.e., not be allowed to default).'
  checks:
  - type: manual_review
    info: 'Verify that each z/OS UNIX user’s OMVS segment in their USER profile adheres to the

      following:

      1. A unique UID number (except for UID(0) users)

      2. A unique HOME directory (except for UID(0) and other system task accounts)

      3. Shell program specified as “/bin/sh”, “/bin/tcsh”, “/bin/echo”, or “/bin/false”

      NOTE: The shell program must have one of the specified values. The HOME directory

      must have a value (i.e., not be allowed to default).

      NOTE: RACF ships a set of sample reports based on the output'
    severity: medium
- id: '9.7'
  title: Ensure that RACF Classes required to secure the z/OS UNIX environment are active
  scoring: scored
  profile:
  - Level 1
  description: The FACILITY, SURROGAT, and UNIXPRIV class support profiles used to secure the z/OS UNIX (OMVS) environment.
    UNIXPRIV class profiles are used to manage certain system privileges that are typically associated with z/OS UNIX superuser
    authority. By defining UNIXPRIV class profiles, certain individual superuser privileges can be granted to users who do
    not have superuser authority. This reduces the security risks associated with assigning full superuser authority to users.
    SURROGAT class profiles are only needed if there are servers (e.g., a web server) running in the z/OS UNIX environment
    that must be able to act with the security context of a client and that client does not supply a password or other authenticator
    for RACF. FACILITY class profiles are used by a variety of IBM components including UNIX System Services (OMVS). BPX prefixed
    profiles in this class are critical to the proper security of the z/OS UNIX environment.
  rationale: Without these classes being in active, system integrity can be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 434
  audit_raw: 'The RACF command

    SETROPTS LIST

    will show the status of RACF controls including the list of active classes.

    To verify that these classes are active, look for the output line ACTIVE CLASSES = and

    inspect the alphabetized list for SURROGAT, UNIXPRIV, and FACILITY.'
  remediation: 'Ensure that the required classes are active:

    SETROPTS CLASSACT(FACILITY SURROGAT UNIXPRIV)'
  checks:
  - type: sql
    command: show the status of RACF controls including the list of active classes.
    severity: medium
    info: 'The RACF command

