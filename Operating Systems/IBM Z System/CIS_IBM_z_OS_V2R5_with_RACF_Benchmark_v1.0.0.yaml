- id: 6.1.3
  title: Ensure AT-TLS protection is enabled for CSSMTP
  scoring: manual
  profile:
  - Level 1
  description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the
    server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that
    subsequently flows between the two. To apply TLS protection of adequate strength, either the CSSMTP application must be
    configured to use AT-TLS protection, or the JES batch jobs that send mail through CSSMTP must use the STARTTLS command.
  rationale: Failure to properly enforce adequate encryption strength could result in the loss of data privacy.
  impact: The cryptographic operations involved in TLS do come with a CPU cost. Most of the recommended algorithms are optimized
    through the use of hardware acceleration. Depending on the number and frequency of TLS handshakes, the CPU impact could
    be noticeable.
  references: []
  page_start: 204
  audit_raw: 'Refer to the CSSMTP configuration file specified on the CONFIG DD statement in the

    CSSMTP started task JCL.

    Check the following items are in effect for the configuration specified in the FTP Data

    configuration file.

    - Each `TargetServer` statement specifies the `SECURE YES` parameter

    - For any `TargetServer` that does not specify `SECURE YES`, then each JES

    batch job that sends mail through CSSMTP should use the `STARTTLS` command to

    specifically request TLS protection of its outbound mail to the target

    Message Transfer Agent (MTA).

    Use the pasearch -t command to check the AT-TLS policy rule(s) that are configured

    for each of the endpoints to which CSSMTP connects. While the specific requirements

    of each rule must accommodate the capabilities of the communication partners (the Mail

    Transfer Agents) to which CSSMTP connects, you should strive for the use of strong

    protection. If possible, use settings that require the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange exchange (ECDHE (preferred) or

    DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
  remediation: 'Review the configuration statements in the CSSMTP configuration file and ensure they

    conform to the specifications below:

    TargetServer statement is coded with the SECURE YES parameter

    For any TargetServer statement that is not coded with the SECURE YES parameter, check

    each JES batch job that sends mail through CSSMTP to ensure it uses the STARTTLS

    command before sending its outbound mail to the target Message Transfer Agent

    (MTA).

    NOTE: To identify CSSMTP traffic that is not protected by TLS, you can use the z/OS

    Communications Server z/OS Encryption Readiness Technology (zERT) function.

    Use local procedures to configured AT-TLS policy rules for each of the endpoints to

    which CSSMTP connects. While the specific requirements of each rule must

    accommodate the capabilities of the communication partners (the Mail Transfer Agents)

    to which CSSMTP connects, you should strive for the use of strong protection. If

    possible, use settings that require the following:

     TLSv1.2 or a later version of the TLS protocol

     Cipher suites that use:

    o Ephemeral Diffie-Hellman key exchange (ECDHE (preferred) or DHE)

    o AES encryption (AES-GCM preferred)

    o SHA256 or stronger hashes'
  checks:
  - type: manual_review
    info: 'Refer to the CSSMTP configuration file specified on the CONFIG DD statement in the

      CSSMTP started task JCL.

