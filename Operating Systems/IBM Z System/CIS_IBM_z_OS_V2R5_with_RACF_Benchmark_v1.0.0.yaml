- id: 2.4.12
  title: Ensure that access to system user catalogs is controlled
  scoring: scored
  profile:
  - Level 1
  description: System catalogs are the basis for locating all files on the system. Software products should be located through
    specific user catalogs and the user catalogs access should be protected.
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
