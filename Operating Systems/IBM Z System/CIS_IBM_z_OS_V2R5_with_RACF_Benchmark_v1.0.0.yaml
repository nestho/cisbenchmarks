- id: '9.18'
  title: Ensure that the BPXROOT user account is configured
  scoring: manual
  profile:
  - Level 1
  description: The z/OS Unix System Services function “"setuid” can be used to change the UID of the process. When the UID
    requested is UID=0, the user set as SUPERUSER in BPXPRMxx is used. The default user is BPXROOT.
  rationale: The BPXROOT user must be defined with the correct attributes to the setuid function can be securely used. If
    these attributes are not correctly defined, data access or command privilege controls could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223860 Rule ID: SV-223860r604139_rule STIG ID: RACF-US-000230'
  page_start: 455
  audit_raw: 'The BPXROOT user OMVS segment must be defined with:

    UID(0)

    HOME(‘/’)

    PROGRAM(‘/bin/sh’)

    Additionally, the BPXROOT user should not have access to the BPX.DAEMON profile in the

    FACILITY class.

    LU BPXROOT OMVS

    RL FACILITY BPX.DAEMON ALL'
  remediation: 'ALU BPXROOT OMVS(OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))

    PE BPX.DAEMON CLASS(FACILITY) ID(BPXROOT) DELETE'
  checks:
  - type: manual_review
    info: 'The BPXROOT user OMVS segment must be defined with:

      UID(0)

      HOME(‘/’)

      PROGRAM(‘/bin/sh’)

      Additionally, the BPXROOT user should not have access to the BPX.DAEMON profile in the

      FACILITY class.

      LU BPXROOT OMVS

      RL FACILITY BPX.DAEMON ALL'
    severity: medium
- id: '9.19'
  title: Ensure that each RACF group for UNIX is defined with a unique GID
  scoring: scored
  profile:
  - Level 1
  description: When groups share GIDs, they are essentially the same entity to the UNIX kernel.
  rationale: Sharing GIDs can result in unintended file access and a loss of accountability. Reverse mapping to a group name
    does not yield a consistent or predictable result, which can lead to confusion in displays such as the output of an ‘ls’
    command.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223857 Rule ID: SV-223857r767121_rule STIG ID: RACF-US-000200'
  page_start: 457
  audit_raw: 'Search for instances of shared GIDs across the OMVS segments of group profiles.

    Note that RACF ships a set of sample reports based on the output of IRRDBU00 (the

    RACF data base unload utility) in the SYS1.SAMPLIB member named IRRICE. The

    report named "GIDS" searches for shared UID values.'
  remediation: 'Assign a unique value. Be sure to change group ownership of existing UNIX files

    accordingly. The following command can locate files owned by a GID (88, in this

    example):

    Find / -group 88'
  checks:
  - type: manual_review
    info: 'Search for instances of shared GIDs across the OMVS segments of group profiles.

      Note that RACF ships a set of sample reports based on the output of IRRDBU00 (the

      RACF data base unload utility) in the SYS1.SAMPLIB member named IRRICE. The

      report named "GIDS" searches for shared UID values.'
    severity: medium
- id: '9.20'
  title: Ensure that data sets used as step libraries in /etc/steplib are configured
  scoring: scored
  profile:
  - Level 1
  description: The STEPLIBLIST parameter specifies the pathname of the HFS file that contains the list of MVS data sets that
    are used as step libraries for programs that have the set-userid or set group id permission bit set. The use of STEPLIBLIST
    is at the site’s discretion, but if used the value of STEPLIBLIST should be /etc/steplib. All update and alter access
    to the MVS data sets in the list will be logged and only systems programming personnel should be authorized to update
    the data sets.
  rationale: Insufficient protection of these data sets can cause the environment to become compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223849 Rule ID: SV-223849r604139_rule STIG ID: RACF-US-000120'
  page_start: 459
  audit_raw: 'UPDATE access to the DATASET profile protecting each data set name in /etc/steplib

    must be restricted to systems programming personnel. All accesses of UPDATE or higher

    must be logged.'
  remediation: 'Modify the profile(s) to restrict access to system programmers, and to log accesses:

    ALTDSD <dataset-profile-name> UACC(NONE) AUDIT(ALL(UPDATE))'
  checks:
  - type: manual_review
    info: 'UPDATE access to the DATASET profile protecting each data set name in /etc/steplib

      must be restricted to systems programming personnel. All accesses of UPDATE or higher

      must be logged.'
    severity: medium
- id: '9.21'
  title: Ensure that ability to switch into superuser mode is restricted
  scoring: scored
  profile:
  - Level 1
  description: When a user switches into superuser mode (for example, by issuing the ‘su’ command in the shell) they operate
    with an effective UID of 0. That is, they are as privileged as if they were assigned UID(0) in their OMVS segment.
  rationale: Granting access to BPX.SUPERUSER should be viewed to be as sensitive as explicitly assigning UID(0). Erroneous
    access to BPX.SUPERUSER can result in complete compromise of the system.
  impact: ''
  references: []
  page_start: 461
  audit_raw: 'Use the RLIST command to display the BPX.SUPERUSER profile.

    RLIST FACILITY BPX.SUPERUSER ALL

    In the command output, make sure the value under the UNIVERSAL ACCESS heading is

    NONE'
  remediation: 'Set the universal access to NONE and refresh the FACILITY class:

    RALTER FACILITY BPX.SUPERUSER UACC(NONE)

    SETROPTS RACLIST(FACILITY) REFRESH'
  checks:
  - type: manual_review
    info: 'Use the RLIST command to display the BPX.SUPERUSER profile.

      RLIST FACILITY BPX.SUPERUSER ALL

      In the command output, make sure the value under the UNIVERSAL ACCESS heading is

      NONE'
    severity: medium
- id: '9.22'
  title: Ensure file permission for universal write is restricted
  scoring: scored
  profile:
  - Level 1
  description: z/OS zFS datasets contains z/OS Unix file systems data. If not protected these datasets can be modified, hindering
    system security.
  rationale: Z/OS zFS datasets contains the files from the z/OS Unix file systems along with the unix attributes controlling
    security.
  impact: ''
  references: []
  page_start: 462
  audit_raw: 'Verify that the zFS dataset protecting profile prevent any universal access greater than

    read (NON preferred).

