  title: Ensure SMF recording options for the FTP Server are configured
  scoring: manual
  profile:
  - Level 1
  description: The FTP Server can provide audit data in the form of SMF records. The SMF data produced by the FTP Server provides
    transaction information for both successful and unsuccessful FTP commands.
  rationale: Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit
    activities.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223733 Rule ID: SV-223733r604139_rule STIG ID: RACF-FT-000010'
  page_start: 226
  audit_raw: 'The system programmer will review the configuration statements in the FTP.DATA data

    set and ensure the SMF options conform to the specifications in the FTP.DATA

    Configuration Statements below or that they are commented out.

    SMF TYPE119

    SMFJES TYPE119

    SMFSQL TYPE119

    SMFAPPE [Not coded or commented out]

    SMFDEL [Not coded or commented out]

    SMFEXIT [Not coded or commented out]

    SMFLOGN [Not coded or commented out]

    SMFREN [Not coded or commented out]

    SMFRETR [Not coded or commented out]

    SMFSTOR [Not coded or commented out]

    The FTP Server can provide audit data in the form of SMF records. SMF record type

    119, the TCP/IP Statistics record, can be written with the following subtypes:

    70 – Append

    70 – Delete and Multiple Delete

    72 – Invalid Logon Attempt

    70 – Rename

    70 – Get (Retrieve) and Multiple Get

    70 – Put (Store and Store Unique) and Multiple Put

    SMF data produced by the FTP Server provides transaction information for both

    successful and unsuccessful FTP commands. This data may provide valuable

    information for security audit activities. Type 119 records use a more standard format

    and provide more information.'
  remediation: 'Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTP

    started task JCL.

    Ensure the following configuration statement settings are in effect in the FTP Data

    configuration data set.

