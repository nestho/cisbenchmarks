- id: 7.3.5
  title: Ensure ICSF Key Store Policy controls are enabled
  scoring: manual
  profile:
  - Level 1
  description: ICSF Key Store Policy governs the use of key tokens in callable services. A key token is just a control block
    of key material that can be passed directly as an input parameter to an ICSF callable service – as opposed to specifying
    the label of a key stored in an ICSF Key Data Set. The Key Store Policy settings control how permission to use a key token
    is performed.
  rationale: The ICSF Key Store Policy controls make it possible to provide protection profiles to key tokens in addition
    to key labels.
  impact: ''
  references: []
  page_start: 344
  audit_raw: 'First, the XFACILITY class has to be active. Execute a SETROPTS LIST command from a

    TSO session and search for the XCSFKEY class.

    Second, ensure the following resources are defined in the XFACILIT class

    CSF.CKDS.TOKEN.CHECK.LABEL.FAIL

    CSF.PKDS.TOKEN.CHECK.LABEL.FAIL

    Issue the following command to determine what profiles exist in the XFACILIT class:

    SEARCH CLASS(XFACILIT)'
  remediation: 'Activate the XFACILIT class by issuing the following command from a TSO session:

    SETR CLASSACT(XFACILIT) RACLIST(CRYPTOZ)

    Define the Key Store Policy controls within the XFACILIT class

    RDEF XFACILIT CSF.CKDS.TOKEN.CHECK.LABEL.FAIL

    RDEF XFACILIT CSF.PKDS.TOKEN.CHECK.LABEL.FAIL'
  checks:
  - type: manual_review
    info: 'First, the XFACILITY class has to be active. Execute a SETROPTS LIST command from a

      TSO session and search for the XCSFKEY class.

      Second, ensure the following resources are defined in the XFACILIT class

      CSF.CKDS.TOKEN.CHECK.LABEL.FAIL

      CSF.PKDS.TOKEN.CHECK.LABEL.FAIL

      Issue the following command to determine what profiles exist in the XFACILIT class:

      SEARCH CLASS(XFACILIT)'
    severity: medium
- id: 7.3.6
  title: Ensure ICSF Key Datasets are protected
  scoring: manual
  profile:
  - Level 1
  description: ICSF has three key data sets (KDS) which are used to store cryptographic keys for application use. The three
    are the CKDS for CCA symmetric keys (AES, DES, HMAC), the PKDS for CCA asymmetric keys (RSA, ECC, QSA), and the TKDS for
    PKCS#11 tokens and key objects. These key data sets need to be protected to avoid damage or destruction to critical key
    material.
  rationale: The ICSF key data sets are critical to the system and a RACF profile in the DATASET class is required to ensure
    no malicious or inadvertent damage can occur.
  impact: ''
  references: []
  page_start: 346
  audit_raw: "It should be noted that multiple key data sets of each type can exist on the system, but\nonly one of each can\
    \ be active at any point in time. All key data sets need protection,\nbut ICSF only knows the name of the active KDS.\n\
    To find the name of the active KDS, enter the following operator command:\nDISPLAY ICSF,KDS\nThe names of the active KDS\
    \ will be shown in the resulting output messages.\nCKDS ISFTEST.BPETTI.CKDS.KDSRL\n FORMAT=KDSRL SYSPLEX=N MKVPs=DES AES\n\
    \ DES MKVP date=Unknown\n AES MKVP date=Unknown\nPKDS ISFTEST.BPETTI.PKDS.KDSRL\n FORMAT=KDSRL SYSPLEX=N MKVPs=RSA ECC\n\
    \ RSA MKVP date=Unknown\n ECC MKVP date=Unknown\nTKDS ISFTEST.BPETTI.TKDS.KDSR2\n FORMAT=KDSRL SYSPLEX=N MKVPs=P11 RCS\n\
    \ P11 MKVP date=Unknown\nOnce the names of the KDS have been determined, the existence of a profile in the\nDATASET class\
    \ can be demonstrated by issuing the following command from a TSO\nsession:\nLA DA(‘<insert key data set name here>’)"
  remediation: 'To create a profile in the DATASET class for each KDS, enter the following command:

    RDEFINE DATASET <insert KDS name here> UACC(NONE)'
  checks:
  - type: manual_review
    info: "It should be noted that multiple key data sets of each type can exist on the system, but\nonly one of each can\
      \ be active at any point in time. All key data sets need protection,\nbut ICSF only knows the name of the active KDS.\n\
      To find the name of the active KDS, enter the following operator command:\nDISPLAY ICSF,KDS\nThe names of the active\
      \ KDS will be shown in the resulting output messages.\nCKDS ISFTEST.BPETTI.CKDS.KDSRL\n FORMAT=KDSRL SYSPLEX=N MKVPs=DES\
      \ AES\n DES MKVP date=Unknown\n AES MKVP date=U"
    severity: medium
- id: 7.3.7
  title: Ensure ICSF administrative services are protected
  scoring: manual
  profile:
  - Level 1
  description: ICSF has an extensive ISPF panel architecture which can be used to administer ICSF and its resources. The use
    of these panels should be restricted from unauthorized use.
  rationale: Since the ICSF ISPF panels can control ICSF resources and ICSF operating characteristics, it is critical that
    only authorized users have access to these panels to avoid outages or resource corruption.
  impact: ''
  references: []
  page_start: 348
  audit_raw: 'Access to ICSF ISPF panels are governed by profiles in the CSFSERV class. To determine

    which profiles exist, enter the following command at a TSO session:

    SEARCH CLASS(CSFSERV)

    The following administrative services should be included in the search output:

    CSFBRCK CKDS Key Utility

    CSFBRPK PKDS Key Utility

    CSFBRTK TKDS Browser

    CSFCMK Change Master Key Utility

    CSFCONF PCF CKDS to ICSF CKDS converstion utility

    CSFCRC Coordinated KDS Administration

    CSFDKCS Master Key Entry Utility

    CSFGKF Generate Fingerprint Utility

    CSFKGUP Key Generator Utility Program

    CSFOPKL Operational Key Load

    CSFPCAD Cryptographic Processor Management (active/deactivate)

    CSFPKDR PKDS Reencipher and Refresh

    CSFPMCI Pass Phrase Initialization

    CSFREFR CKDS or PKDS Refresh

    CSFRSWS Administrator Control Functions Utility (enable)

    CSFRWP CKDS Conversion2 Utility – Rewrap

    CSFSMK Set Master Key

    CSFSSWS Administrative Control Functions Utility (disable)

    CSFUDM User Defined Extensions (UDX) management functions'
  remediation: 'If any of the profiles listed above are missing in the SEARCH CLASS(CSFSERV) output, the

    following command can be used to define a profile.

    RDEFINE CSFSERV <CSFxxxx Service Name> UACC(NONE)'
  checks:
  - type: manual_review
    info: 'Access to ICSF ISPF panels are governed by profiles in the CSFSERV class. To determine

      which profiles exist, enter the following command at a TSO session:

      SEARCH CLASS(CSFSERV)

