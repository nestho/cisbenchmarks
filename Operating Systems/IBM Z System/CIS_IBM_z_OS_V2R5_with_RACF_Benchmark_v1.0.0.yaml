      variable, e.g.:

      //CSF PROC PRM=00

      //CSF EXEC PGM=CSFINIT,REGION=0M,TIME=1440,MEMLIMIT=NOLIMIT

      //CSFPARM DD DSN=USER.PARMLIB(CSFPRM&PRM),DISP=SHR'
    severity: medium
- id: 7.2.1
  title: Ensure Crypto Usage Statistics are enabled
  scoring: manual
  profile:
  - Level 1
  description: ICSF can be configured to capture statistics related to the use of cryptographic resources, for example key
    material, cryptographic hardware engines, or even specific cryptographic algorithms.
  rationale: By employing ICSF Crypto Usage Statistics, it is possible to detect the use of crypto resources that are not
    recommended, such as weak algorithms.
  impact: ''
  references: []
  page_start: 319
  audit_raw: "ICSF Crypto Usage Statistics are enabled via the STATS keyword in the ICSF Installation\nOptions Dataset.\n\
    To determine the setting of the STATS keyword, issue the following command from an\noperation console and observe the\
    \ value of the STATS keyword:\nDISPLAY ICSF,OPTIONS\nEg:\nSTATS:\n SY1 ENG, SRV, ALG"
  remediation: 'Add the STATS keyword to the ICSF Installation Options Dataset and enter the following

    command at an operator console:

    SETICSF OPTIONS,REFRESH

    Optionally, the STATS parameter can be dynamically enabled by the following command:

    SETICSF OPTIONS,STATS=(ENG,SRV,ALG)

    Please note that if ICSF is restarted, the dynamic settings for the options will be reset to

    their definition in the ICSF Installation Options Dataset.'
  checks:
  - type: manual_review
    info: "ICSF Crypto Usage Statistics are enabled via the STATS keyword in the ICSF Installation\nOptions Dataset.\nTo determine\
      \ the setting of the STATS keyword, issue the following command from an\noperation console and observe the value of\
      \ the STATS keyword:\nDISPLAY ICSF,OPTIONS\nEg:\nSTATS:\n SY1 ENG, SRV, ALG"
    severity: medium
- id: 7.2.2
  title: Ensure Crypto Key Lifecycle Auditing is enabled
  scoring: manual
  profile:
  - Level 1
  description: ICSF can be configured to audit the lifecycle of key material, for example, key creation, key activation, key
    deletion, etc. The lifecycle events are recording using SMF Type 82 records.
  rationale: By configuring ICSF to audit key lifecycle events, it is possible to preserve a record of all major events in
    a key’s lifecycle.
  impact: ''
  references: []
  page_start: 321
  audit_raw: "ICSF Crypto Lifecycle Auditing is enabled using the following keywords in the ICSF\nInstallation Options Dataset.\n\
    AUDITKEYLIFECKDS\nAUDITKEYLIFEPKDS\nAUDITKEYLIFETKDS\nTo determine the setting of the key lifecycle auditing, issue the\
    \ following command from\nan operation console and observe the value of the AUDITKEYLIFE*KDS keyword:\nDISPLAY ICSF,OPTIONS\n\
    Eg:\nAUDITKEYLIFECKDS: Audit CCA symmetric key lifecycle events\n SYSNAME LABEL TOKEN\n SY1 Yes Yes\nAUDITKEYLIFEPKDS:\
    \ Audit CCA asymmetric key lifecycle events\n SYSNAME LABEL TOKEN\n SY1 Yes Yes\nAUDITKEYLIFETKDS: Audit PKCS #11 key\
    \ lifecycle events\n SYSNAME TOKOBJ SESSOBJ\n SY1 No No"
  remediation: 'Add the AUDITKEYLIFECKDS, AUDITKEYLIFEPKDS, or AUDITKEYLIFETKDS keywords to the

    ICSF Installation Options Dataset and enter the following command at an operator

    console:

    SETICSF OPTIONS,REFRESH

    Optionally, the key lifecycle auditing parameters can be dynamically enabled by the

    following commands:

    SETICSF OPTIONS,AUDITKEYLIFECKDS,TOKEN=YES,LABEL=YES

    SETICSF OPTIONS,AUDITKEYLIFEPKDS,TOKEN=YES,LABEL=YES

    SETICSF OPTIONS,AUDITKEYLIFETKDS,TOKENOBJ=YES,SESSIONOBJ=YES

    Please note that if ICSF is restarted, the dynamic settings for the options will be reset to

    their definition in the ICSF Installation Options Dataset.'
  checks:
  - type: manual_review
    info: "ICSF Crypto Lifecycle Auditing is enabled using the following keywords in the ICSF\nInstallation Options Dataset.\n\
      AUDITKEYLIFECKDS\nAUDITKEYLIFEPKDS\nAUDITKEYLIFETKDS\nTo determine the setting of the key lifecycle auditing, issue\
      \ the following command from\nan operation console and observe the value of the AUDITKEYLIFE*KDS keyword:\nDISPLAY ICSF,OPTIONS\n\
      Eg:\nAUDITKEYLIFECKDS: Audit CCA symmetric key lifecycle events\n SYSNAME LABEL TOKEN\n SY1 Yes Yes\nAUDITKEYLIFEPKDS:\
      \ Audit CCA asymmetric key lifecycle "
    severity: medium
