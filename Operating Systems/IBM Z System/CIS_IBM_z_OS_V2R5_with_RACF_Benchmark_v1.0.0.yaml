  description: RACF provides the ability to load certain classes of profiles into memory for better performance with the SETROPTS
    RACLIST command. For some classes, RACLISTing is required, but it does not happen automatically. UNIXPRIV class profiles
    are used to manage certain system privileges that are typically associated with z/OS UNIX superuser authority. By defining
    UNIXPRIV class profiles, certain individual superuser privileges can be granted to users who do not have superuser authority.
    This reduces the security risks associated with assigning full superuser authority to users. SURROGAT class profiles are
    only needed if there are servers (e.g., a web server) running in the z/OS UNIX environment that must be able to act with
    the security context of a client and that client does not supply a password or other authenticator for RACF. FACILITY
    class profiles are used by a variety of IBM components including UNIX System Services (OMVS). BPX prefixed profiles in
    this class are critical to the proper security of the z/OS UNIX environment.
  rationale: Without these classes being RACLISTeds, system integrity can be compromised.
  impact: ''
