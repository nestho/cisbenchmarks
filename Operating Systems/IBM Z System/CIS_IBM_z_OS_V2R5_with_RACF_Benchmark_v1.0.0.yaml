  title: (Optional) Ensure SSH daemon is configured to use FIPS 140-2 compliant cryptographic provider where required
  scoring: manual
  profile:
  - Level 1
  description: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    Cryptographic modules must adhere to the higher standards approved by the federal government since this provides assurance
    they have been tested and validated.
  rationale: The FIPS-140 standard requires strict adherence to the use of strong cryptographic algorithms and keys and built-in
    integrity checks by compliant cryptographic modules.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223807 Rule ID: SV-223807r803639_rule STIG ID: RACF-SH-000020'
  page_start: 240
  audit_raw: 'Locate the SSH daemon configuration file which may be found in /etc/ssh/ directory.

    Alternately:

    From UNIX System Services ISPF Shell navigate to ribbon select tools.

    Select option 1 - Work with Processes.

    If SSH Daemon is active, examine SSH daemon configuration file.

    sshd_config

    There should be Ciphers lines and the ciphers list must contain ciphers starting with aes

    and without the openssh.com suffix.

    The MACs line must be configured to "hmac-sha-256" or greater.

    The host keys must be stored in a SAF keyring.

    Examine the z/OS-specific sshd server system-wide configuration

    zos_sshd_config

    Check that the following is true:

    FIPSMODE YES

    CiphersSource ICSF

    MACsSource ICSF'
  remediation: 'Edit the SSH daemon configuration and remove any ciphers not starting with aes and

    any with the openssh.com suffix. If necessary, add a Ciphers line using FIPS 140-2

    compliant algorithms.

    Configure for message authentication to MACs hmac-sha-256 or greater.

    Store the host keys in a SAF keyring.

    Edit the z/OS-specific sshd server system-wide configuration file configuration as

    follows:

    FIPSMODE YES

    CiphersSource ICSF

    MACsSource ICSF'
