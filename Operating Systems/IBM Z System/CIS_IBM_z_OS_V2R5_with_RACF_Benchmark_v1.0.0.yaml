- id: '9.9'
  title: Ensure that the user account for the z/OS UNIX kernel (OMVS) is defined to the security database
  scoring: scored
  profile:
  - Level 1
  description: User identifiers (RACF user IDs), groups, and started tasks that use z/OS UNIX facilities are defined to a
    RACF with attributes including UID and GID. If these… attributes are not correctly defined, data access or command privilege
    controls could be compromised.
  rationale: The OMVS (Unix System Services) Kernel must be define with only the required Unix system services attributes,
    and prevented to access online z/OS facilities (TSO, CICS, …)
  impact: If compromised, without the proper attributes, the OMVS Kernel address space user might be used to access z/OS resources.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223859 Rule ID: SV-223859r604139_rule STIG ID: RACF-US-000220'
  page_start: 438
  audit_raw: 'The recommended attributes can be verified using the following command:

    LU OMVSKERN TSO

    LU OMVSKERN CICS

    LU OMVSKERN OMVS

    The output of the LU OMVSKERN TSO command should include:

    NO TSO INFORMATION

    The output of the LU OMVSKERN CICS command should include:

    NO CICS INFORMATION

    The output of the LU OMVSKERN OMVS command should include:

    UID= 0000000000

    HOME= /

    PROGRAM= /bin/sh'
  remediation: 'If the output of the LU OMVSKERN TSO command has a TSO segment:

    ALU OMVSKERN NOTSO

    If the output of the LU OMVSKERN CICS command has a CICS segment:

    ALU OMVSKERN NOCICS

    If the output of the LU OMVSKERN OMVS command are not consistent with the

    recommendation:

    ALU OMVSKERN OMVS(OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))'
  checks:
  - type: manual_review
    info: 'The recommended attributes can be verified using the following command:

