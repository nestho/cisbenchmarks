  title: Ensure that the GENERIC SETROPTS value is enabled for ACTIVE classes
  scoring: scored
  profile:
  - Level 1
  description: 'GENERIC controls what classes may have generic profiles. Generic profiles are profiles which cover zero or
    more resources. They substantially simplify security administration. Note: It is possible to have characters that would
    be considered "wildcards", such as ''*'', ''%'', ''$'', and ''&'' in non-generic profiles. If the class is not in the
    GENERIC list, then profiles created with wildcards are not generic profiles.'
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. In addition, failure
    to establish standardized settings for the RACF options introduces the possibility of exposure during migration process
    or contingency plan activation.
  impact: Not enabling RACF generic profile processing for a class increases the number of profiles in the RACF data set and
    makes it less likely that the profile covering a data set is in a RACF cache so I/O to the RACF data base can be avoided.
