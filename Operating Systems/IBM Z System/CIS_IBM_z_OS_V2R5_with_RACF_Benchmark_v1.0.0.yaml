  description: SETROPTS OPERAUDIT specifies whether RACF is to log all actions allowed only because a user has the OPERATIONS
    (or group-OPERATIONS) attribute. To perform these actions the AUDITOR attribute must be set. OPERAUDIT Specifies that
    RACF is to log all actions, such as accesses to resources and commands, allowed only because a user has the OPERATIONS
