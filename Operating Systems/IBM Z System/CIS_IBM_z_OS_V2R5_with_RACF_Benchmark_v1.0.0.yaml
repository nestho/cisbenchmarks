- id: 2.4.4
  title: Ensure that UID 0 is only assigned to PROTECTED STC IDs
  scoring: scored
  profile:
  - Level 1
  description: RACF user IDs, groups, and started tasks that use z/OS UNIX facilities are defined to RACF with attributes
    including UID and GID.
  rationale: If these attributes are not correctly defined, data access or command privilege controls could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223756 Rule ID: SV-223756r604139_rule STIG ID: RACF-JS-000120'
