    FTP Data configuration file:

    The SMF statement is coded with a value of TYPE119.

    The SMFJES and SMFSQL statements are coded without any additional values.

    The SMFAPPE, SMFDEL, SMFEXIT, SMFLOGN, SMFREN, SMFRETR, and SMFSTOR

    statements are not coded or commented out.

    FTP.DATA Configuration Statements

    SMF TYPE119

    SMFJES TYPE119

    SMFSQL TYPE119

