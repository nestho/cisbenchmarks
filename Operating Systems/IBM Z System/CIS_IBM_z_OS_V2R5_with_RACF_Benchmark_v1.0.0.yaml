- id: 6.1.1
  title: Ensure CSSMTP Started Task name is configured
  scoring: manual
  profile:
  - Level 1
  description: IBM CSSMTP requires a started task that will be restricted to certain resources, datasets and other system
    functions. By defining the started task as a user ID to the system, it allows the SAF to control the access and authorized
    users that require these capabilities.
  rationale: Failure to properly control these capabilities could compromise the operating system environment and customer
    data.
  impact: ''
  references:
  - '1. z/OS CSSMTP for RACF STIG :: Version 6, Release: 5 Benchmark Date: 27 Oct'
