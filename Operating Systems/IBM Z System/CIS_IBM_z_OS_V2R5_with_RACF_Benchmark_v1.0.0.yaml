    commands.
  rationale: Failure to control access to any console could result in unauthorized personnel issuing sensitive operator commands.
    This exposure may threaten the integrity and availability of the operating system environment and compromise the confidentiality
    of customer data.
  impact: The CONSOLE command in TSO should be restricted to authorized personnel.
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223656 Rule ID: SV-223656r604139_rule STIG ID: RACF-ES-000080'
