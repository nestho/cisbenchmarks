      view the OS SYSLOG using SDSF, find the last IPL, and look for the initialization of

      SYSLOGD.

      Check that the user ID under which syslogd execut'
    severity: medium
- id: 6.4.2
  title: Ensure Syslog daemon is secured
  scoring: manual
  profile:
  - Level 1
  description: Syslog daemon, known as syslogd, is a zOS UNIX daemon that provides a central processing point for log messages
    issued by other zOS UNIX processes. It is also possible to receive log messages from other network-connected hosts. Some
    of the IBM Communications Server components that may send messages to syslog are the FTP and zOS UNIX Telnet servers,
    AT-TLS and the IKED, NSSD and DMD daemons. The messages may be of varying importance levels including general process
    information, diagnostic information, critical error notification, and audit-class information. Primarily because of the
    potential to use this information in an audit process, there is a security interest in protecting the syslogd process
    and its associated data. The Syslog daemon requires special privileges and access to sensitive resources to provide its
    system services.
  rationale: Failure to properly define and control the Syslog daemon could lead to unauthorized access. This exposure may
    result in the compromise of the integrity and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223814 Rule ID: SV-223814r604139_rule STIG ID: RACF-SL-000030'
  page_start: 251
  audit_raw: 'Check that the Syslog daemon is properly defined and protected as stated below:

     The Syslog daemon user ID is SYSLOGD.

     The SYSLOGD user ID is defined as a PROTECTED user ID.

     The SYSLOGD user ID has UID(0), HOME(‘/’), and PROGRAM(‘/bin/sh’) specified

    in the OMVS segment.

     A matching entry mapping the SYSLOGD started proc to the SYSLOGD user ID is in

    the STARTED resource class.

     If Syslog daemon is started from /etc/rc then ensure that the _BPX_JOBNAME and

    _BPX_USERID environment variables are assigned a value of SYSLOGD.'
  remediation: 'The systems programmer responsible for supporting IBM Communications Server will

    ensure that Syslog daemon runs under its own user account. Specifically, it does not

    share the account defined for the z/OS UNIX kernel.

     The Syslog daemon user ID is SYSLOGD.

     The SYSLOGD user ID is defined as a PROTECTED user ID.

     The SYSLOGD user ID has UID(0), HOME(‘/’), and PROGRAM(‘/bin/sh’) specified

    in the OMVS segment.

    To set up and use as an MVS Started Proc, the following sample commands are

    provided:

    AU SYSLOGD NAME(''stc, tcpip'') NOPASSWORD NOOIDCARD DFLTGRP(STC) –

    OWNER(STC) DATA(''Reference ISLG0020 for proper setup '')

    ALU SYSLOGD DFLTGRP(stctcpx)

    ALU SYSLOGD OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))

    CO SYSLOGD GROUP(stctcpx) OWNER(stctcpx)

    A matching entry mapping the SYSLOGD started proc to the SYSLOGD user ID is in the

    STARTED resource class.

    RDEF STARTED SYSLOGD.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    STDATA(USER(SYSLOGD) GROUP(STC))

    If /etc/rc is used to start the Syslog daemon ensure that the _BPX_JOBNAME and _BPX_

    USERID environment variables are assigned a value of SYSLOGD.'
  checks:
  - type: manual_review
    info: 'Check that the Syslog daemon is properly defined and protected as stated below:

       The Syslog daemon user ID is SYSLOGD.

       The SYSLOGD user ID is defined as a PROTECTED user ID.

       The SYSLOGD user ID has UID(0), HOME(‘/’), and PROGRAM(‘/bin/sh’) specified

      in the OMVS segment.

       A matching entry mapping the SYSLOGD started proc to the SYSLOGD user ID is in

      the STARTED resource class.

       If Syslog daemon is started from /etc/rc then ensure that the _BPX_JOBNAME and

      _BPX_USERID environment variables '
    severity: medium
- id: 6.4.3
  title: Ensure permission and user audit bits for Syslog daemon component are configured.
  scoring: manual
  profile:
  - Level 1
  description: Directories and files of the Syslog daemon provide the configuration and executable properties of this product.
    These directories and files must be properly protected from unauthorized modifications or retrieval to ensure system integrity
    and privacy of sensitive data.
  rationale: Failure to properly secure these objects could lead to unauthorized access. This exposure may result in the compromise
    of the integrity and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223812 Rule ID: SV-223812r604139_rule STIG ID: RACF-SL-000010'
  page_start: 253
  audit_raw: 'The HFS permission bits and user audit bits for each directory and file match or are

    more restrictive than the specified settings listed in the table.

    File Permission Bits User Audit Bits

    SYSLOG Daemon HFS Object 1740 fff

    Security Settings

    /usr/sbin/syslogd

    [Configuration File]

    /etc/syslog.conf 0744 faf

    [Output log file defined in the configuration file]

    0744 fff

    NOTE: The /usr/sbin/syslogd object is a symbolic link to

    /usr/lpp/tcpip/sbin/syslogd. The permission and user audit bits on the target of the

    symbolic link must have the required settings.

    The /etc/syslog.conf file may not be the configuration file the daemon uses. It is

    necessary to check the script or JCL used to start the daemon to determine the actual

    configuration file. For example, in /etc/rc:

    _BPX_JOBNAME=''SYSLOGD'' /usr/sbin/syslogd -f /etc/syslog.conf

    For example, in the SYSLOGD started task JCL:

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON)/ -f /etc/syslogd.conf''

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON) /-f //''''SYS1.TCPPARMS(SYSLOG)''''''

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

     "f log" for failed access attempts

     "a log" for failed and successful access

     no auditing'
  remediation: 'The systems programmer with UID(0) and/or SUPERUSER access, will review the UNIX

    permission bits and user audit bits on the HFS directories and files for the Syslog

    daemon. Ensure they conform to the specifications in the SYSLOG Daemon HFS

    Object Security Settings table below.

    Log files should have security that prevents anyone except the syslogd process and

    authorized maintenance jobs from writing to or deleting them.

    A maintenance process to periodically clear the log files is essential. Logging stops if

    the target file system becomes full.

    SYSLOG Daemon HFS Object Security Settings

    File Permission Bits User Audit Bits

    /usr/sbin/syslogd 1740 fff

    [Configuration File]

    /etc/syslog.conf 0744 faf

    [Output log file defined in the configuration file]

    0744 fff

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

     "f log" for failed access attempts

     "a log" for failed and successful access

     no auditing

    NOTE: The /usr/sbin/syslogd object is a symbolic link to

    /usr/lpp/tcpip/sbin/syslogd. The permission and user audit bits on the target of the

    symbolic link must have the required settings.

    The /etc/syslog.conf file may not be the configuration file the daemon uses. It is

    necessary to check the script or JCL used to start the daemon to determine the actual

    configuration file. For example, in /etc/rc:

    _BPX_JOBNAME=''SYSLOGD'' /usr/sbin/syslogd -f /etc/syslog.conf

    For example, in the SYSLOGD started task JCL:

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON)/ -f /etc/syslogd.conf''

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON) /-f //''''SYS1.TCPPARMS(SYSLOG)''''''

    The following commands can be used (from a user account with an effective UID(0)) to

    update the permission bits and audit bits:

    chmod 1740 /usr/lpp/tcpip/sbin/syslogd

    chaudit rwx=f /usr/lpp/tcpip/sbin/syslogd

    chmod 0744 /etc/syslog.conf

    chaudit w=sf,rx+f /etc/syslog.conf

    chmod 0744 /log_dir/log_file

    chaudit rwx=f /log_dir/log_file'
