      this statement must be checked for the following items as well.

      NOTE: FIPS 140-2 minimum encryption is the accepted level of encryption and will'
    severity: medium
- id: 6.6.5
  title: Ensure SMF recording options for the TN3270 Telnet Server are configured
  scoring: manual
  profile:
  - Level 1
  description: The TN3270 Telnet Server can provide audit data in the form of SMF records. The SMF data produced provides
    information about individual sessions. This data includes the VTAM application, the remote and local IP addresses, and
    the remote and local IP port numbers.
  rationale: Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit
    activities.
  impact: ''
  references:
