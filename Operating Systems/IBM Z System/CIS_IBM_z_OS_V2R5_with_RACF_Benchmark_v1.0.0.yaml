controls:
- id: 1.1.1
  title: Ensure that the PASSWORD(INTERVAL) SETROPTS value is set to no longer than 90 days
  scoring: scored
  profile:
  - Level 1
  description: When a user logs on to the system, RACF compares the system password interval value to the value specified
    in the user profile. RACF uses the lower of the two values to determine if the user’s password has expired. PASSWORD(INTERVAL(n))
    command sets the maximum age of a password. The INTERVAL suboperand specifies the system default for the maximum number
    “n” of days that each user's password and password phrase remain valid. If you have the SPECIAL attribute, you can specify
    the INTERVAL of the SETROPTS PASSWORD command. The INTERVAL suboperand specifies the system default for the maximum number
    of days that each user's password and password phrase remain valid.
  rationale: The improper setting of any of these fields, individually or in combination with another, can compromise the
    security of the processing environment. In addition, failure to establish standardized settings for RACF control options
    introduces the possibility of exposure during migration process or contingency plan activation.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223727 Rule ID: SV-223727r604139_rule STIG ID: RACF-ES-000800'
  page_start: 19
  audit_raw: 'To verify a password will expire within 90 days issue the TSO command:

    SETROPTS LIST

    and look for the interval value. The PASSWORD(INTERVAL) value is found in the return

    message "PASSWORD CHANGE INTERVAL IS xxx DAYS." xxx will be a value from 1

    to 90.'
  remediation: 'Setting the password interval to 90 days is activated by issuing the TSO command:

    SETROPTS PASSWORD(INTERVAL(90))'
  checks:
  - type: manual_review
    info: 'To verify a password will expire within 90 days issue the TSO command:

      SETROPTS LIST

      and look for the interval value. The PASSWORD(INTERVAL) value is found in the return

      message "PASSWORD CHANGE INTERVAL IS xxx DAYS." xxx will be a value from 1

      to 90.'
    severity: medium
- id: 1.1.2
  title: Ensure that the PASSWORD(HISTORY) SETROPTS value is set to at least 4
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'HISTORY specifies the number of previous passwords that RACF saves for each user ID and compares with an intended
    new password. If there is a match with one of the previous passwords, or with the current password, RACF rejects the intended
    new password. Set the PASSWORD(HISTORY(n)) RACF option “n” value to 4 or more. PASSWORD(HISTORY(n)) command enables you
    to specify the number of previous passwords and password phrases (1 - 32) that RACF saves for each user and compares it
    with an intended new value. For passwords, RACF stores only previous passwords in each user''s history. For password phrases,
    RACF saves the user''s current password phrase in addition to the user''s previous password phrases. Therefore, for password
    phrases, RACF saves one fewer previous value than the number you specify for history. Example: If you specify 12 for your
    HISTORY number using the command SETROPTS PASSWORD(HISTORY(12)) RACF saves up to 12 previous passwords and up to 11 previous
    password phrases for each user. Effective immediately, the values when executing that command are the default values for
    new users whom you define to RACF® through the ADDUSER command. SETROPTS PASSWORD(RULEn(LENGTH(m1:m2) content-keyword(position)))
    specifies an individual syntax rule for new passwords that users create at logon, on JCL jobcards, or on the PASSWORD
    command and for passwords specified on ALTUSER commands that have the NOEXPIRED operand. Eight syntax rules are allowed.
    Therefore, for the RULEn suboperand, the value of n is 1 - 8. At a minimum require at least 8 characters with a mix of
    character types. SETROPTS PASSWORD(MINCHANGE(nnn) specifies the number of days that must pass between a user’s password
    and password phrase changes. Users can not change their own passwords and password phrases within the minimum change interval.
    Permitting users to change their password more than once in a day allows users to quickly cycle through their password
    history and maintain the same password indefinitely. The SETROPTS PASSWORD(MINCHANGE(nnn) value, either specified or defaulted,
    is in effect for all users. A security administrator may set a password within the MINCHANGE window.'
  rationale: Not setting of any of these fields, individually or in combination with another, can compromise the security
    of the processing environment. In addition, failure to establish standardized settings for RACF control options introduces
    the possibility of exposure during migration process or contingency plan activation. The rule value(s) specify the rules
    that RACF will apply when a user selects a new password. Improper setting of any of these fields, individually or in combination
    with another, can result in weakened passwords and compromise the security of the processing environment. The improper
    setting of any of these fields, individually or in combination with another, can compromise the security of the processing
    environment.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223728 Rule ID: SV-223728r604139_rule STIG ID: RACF-ES-000810'
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223724 Rule ID: SV-223724r604139_rule STIG ID: RACF-ES-000770'
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223726 Rule ID: SV-223726r604139_rule STIG ID: RACF-ES-000790'
  page_start: 21
  audit_raw: 'To verify a password history will have 4 or more generations issue the TSO command:

    SETROPTS LIST

    and look for the history value “x” in the PASSWORD(HISTORY) return message “x

    GENERATIONS OF PREVIOUS PASSWORDS BEING MAINTAINED.” x will be greater

    than or equal to 4.

    To verify password syntax rules issue the TSO command:

    SETROPT LIST

    Rules in effect are found under the “INSTALLATION PASSWORD SYNTAX RULES:”

    message. Verify at least one password rule under "INSTALLATION PASSWORD

    SYNTAX RULES" is defined with the values shown below:

    LENGTH(8) xxxxxxxx

    Verify the MINCHANGE value by issuing the TSO command:

    SETROPTS LIST

    Look for the following message “PASSWORD MINIMUM CHANGE INTERVAL IS x

    DAYS.” x will be a value from 1 to 254.'
  remediation: 'Setting the password history to 4 generations is activated by issuing the TSO command:

    SETROPTS PASSWORD(HISTORY(4))

    Setting the password syntax to require a length of 8 and a mix of character types is

    activated by issuing the TSO command:

    SETROPTS PASSWORD(RULE1(LENGTH(8) MIXEDALL(1:8))

    Issue the TSO command:

    SETROPTS PASSWORD(MINCHANGE(1))'
  checks:
  - type: manual_review
    info: 'To verify a password history will have 4 or more generations issue the TSO command:

      SETROPTS LIST

      and look for the history value “x” in the PASSWORD(HISTORY) return message “x

      GENERATIONS OF PREVIOUS PASSWORDS BEING MAINTAINED.” x will be greater

      than or equal to 4.

      To verify password syntax rules issue the TSO command:

      SETROPT LIST

      Rules in effect are found under the “INSTALLATION PASSWORD SYNTAX RULES:”

      message. Verify at least one password rule under "INSTALLATION PASSWORD

      SYNTAX RULES" is de'
    severity: medium
- id: 1.1.5
  title: Ensure that the PASSWORD(REVOKE) SETROPTS value is specified
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS PASSWORKD(REVOKE(nnn)) enables you to specify how many consecutive incorrect password and password
    phrase attempts RACF permits before it revokes the user ID on the next attempt. If you specify a REVOKE SETROPTS value,
    ensure INITSTATS are in effect. If SETROPTS NOREVOKE is in effect, consecutive incorrect passwords and password phrases
    are ignored.
  rationale: The improper setting of any of these fields, individually or in combination with another, can compromise the
    security of the processing environment.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  page_start: 27
  audit_raw: 'Issue TSO command:

    SETROPTS LIST

    Look for the following message: "AFTER x CONSECUTIVE UNSUCCESSFUL

    PASSWORD ATTEMPTS, A USERID WILL BE REVOKED"'
  remediation: 'Issue TSO command:

    SETROPTS PASSWORD(REVOKE(6))'
  checks:
  - type: manual_review
    info: 'Issue TSO command:

      SETROPTS LIST

      Look for the following message: "AFTER x CONSECUTIVE UNSUCCESSFUL

      PASSWORD ATTEMPTS, A USERID WILL BE REVOKED"'
    severity: medium
- id: 1.1.6
  title: Ensure that the KDFAES algorithm is used to protect passwords in the security database
  scoring: scored
  profile:
  - Level 2
  description: By default passwords stored in RACF are protected using a weak DES based algorithm. Using off the shelf applications
    and hardware, it is a relatively simple operation to reverse engineer the encryption key – RACF user ID’s password – or
    perform a bruteforce offline attack. Any user with access to RACF database may obtain the passwords for all user IDs in
    the system.
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. In addition, failure
    to establish standardized settings for the RACF options introduces the possibility of exposure during migration process
    or contingency plan activation.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223729 Rule ID: SV-223729r604139_rule STIG ID: RACF-ES-000820'
  page_start: 29
  audit_raw: 'Check SETROPTS LIST output for the current password processing options. Look for the

    use of a LEGACY password encryption algorithm.

    The TSO command that is to be issued by an RACF authorized user is:

    SETROPTS LIST

    Look for the following message "PASSWORD PROCESSING OPTIONS: THE ACTIVE

    PASSWORD ENCRYPTION ALGORITHM IS KDFAES"'
  remediation: 'KDFAES is enabled using the SETROPTS command exit:

    SETROPTS PASSWORD(ALGORITHM(KDFAES))

    When KDFAES is enabled, existing DES passwords will continue to be evaluated by

    RACF. User passwords do not need to be changed. When the user next changes his

    password, it will be encrypted using the KDFAES algorithm. The PWCONVERT operand of the

    ALTUSER command can be used to transform a DES password (but not a password

    phrase) into a KDFAES password without requiring the password to be changed.

    ALTUSER <user-id> PWCONVERT

    The installation can create a command list (CLIST) which converts the passwords of all

    users with the RACF SEARCH by issuing the TSO command:

    SEARCH CLASS(USER) CLIST(''ALTUSER '' '' PWCONVERT'')

    The command list that is created is placed in the data set <user-id>.EXEC.RACF.CLIST.

    It will contain ALTUSER commands for user IDs which don’t have passwords, such as

    PROTECTED users and anchor user IDs like irrcerta, irrmulti, and irrcertc.'
  checks:
  - type: manual_review
    info: 'Check SETROPTS LIST output for the current password processing options. Look for the

      use of a LEGACY password encryption algorithm.

      The TSO command that is to be issued by an RACF authorized user is:

      SETROPTS LIST

      Look for the following message "PASSWORD PROCESSING OPTIONS: THE ACTIVE

      PASSWORD ENCRYPTION ALGORITHM IS KDFAES"'
    severity: medium
- id: 1.1.7
  title: Ensure that the PASSWORD(WARNING) SETROPTS value is set
  scoring: scored
  profile:
  - Level 1
  description: WARNING specifies the number of days before a password expires when RACF is to issue a warning message to the
    user.
  rationale: System users should be warned about impending password expiration to allow secure passwords to be chosen and
    to allow the changing of a password at a convenient time to help minimize password change impact.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 Vuln ID: V-275'
  - 1.2 System Settings
  page_start: 31
  audit_raw: 'Issue TSO command:

    SETROPTS LIST

    Look for the following message: PASSWORD(WARNING) value shows "PASSWORD

    EXPIRATION WARNING LEVEL IS xxx DAYS."'
  remediation: 'It is a common industry practice to notify users that a password change will be required

    in no less than 5 days. This time interval may be increased but should not be less than

    5 days. WARNING is activated with the command:

    SETR PASSWORD(WARNING(5))'
  checks:
  - type: manual_review
    info: 'Issue TSO command:

      SETROPTS LIST

      Look for the following message: PASSWORD(WARNING) value shows "PASSWORD

      EXPIRATION WARNING LEVEL IS xxx DAYS."'
    severity: medium
- id: 1.2.1
  title: Ensure that Inactive users are revoked
  scoring: scored
  profile:
  - Level 1
  description: PASSWORD(INACTIVE(nnn)) command specifies the number of days (1 - 255) that a user ID can remain unused and
    still be considered valid. RACF user verification checks the number of days since the last successful time the user accessed
    the system against the INACTIVE value and, if the former is larger, revokes the user's right to use the system. INACTIVE
    does not apply to Protected user IDs. Protected user IDs are protected from being revoked through inactivity. If you specify
    INACTIVE, INITSTATS must be in effect. If the backup database is needed but does not contain current information, some
    user IDs can be revoked because they appear to have been unused beyond the number of days specified on the INACTIVE operand.
    NOINACTIVE specifies that RACF user verification is not to check user IDs against an unused-userid-interval. Inactive
    user IDs are to be revoked after a period of inactivity not to exceed 90 days.
  rationale: Inactive user IDs are vulnerable to attack because no one is watching these IDs. A password change request might
    go unnoticed for a user that has not accessed the system for several months. Actively resuming an expired user ID brings
    attention to that ID.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223723 Rule ID: SV-223723r604139_rule STIG ID: RACF-ES-000760'
  page_start: 33
  audit_raw: 'Issue TSO command:

    SETROPTS LIST

    Look for the following message:

    "INACTIVE USERIDS ARE BEING AUTOMATICALLY REVOKED AFTER xxx DAYS"

    or

    "INACTIVE USERIDS ARE NOT BEING AUTOMATICALLY REVOKED."'
  remediation: 'Issue TSO command:

    SETROPTS PASSWORD(INACTIVE(90))'
  checks:
  - type: manual_review
    info: 'Issue TSO command:

      SETROPTS LIST

      Look for the following message:

      "INACTIVE USERIDS ARE BEING AUTOMATICALLY REVOKED AFTER xxx DAYS"

      or

      "INACTIVE USERIDS ARE NOT BEING AUTOMATICALLY REVOKED."'
    severity: medium
- id: 1.2.2
  title: Ensure that STARTED class is used to assign users to Started Tasks
  scoring: scored
  profile:
  - Level 1
  description: Started procedures have system generated job statements that do not contain the user, group, or password statements.
    To enable the started procedure to access the same protected resources that users and groups access, started procedures
    must have an associated user ID. If a user ID is not associated with the started procedure, the started procedure will
    not have access to the resources. User ID can be assigned through the STARTED class or through the ICHRIN03 table. As
    it is easily auditable, does not require assembler knowledge or system IPL we would recommend the usage of the STARTED
    class.
  rationale: If a user ID is not associated with the started procedure, the started procedure will not have access to the
    resources.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223719 Rule ID: SV-223719r604139_rule STIG ID: RACF-ES-000720'
  page_start: 35
  audit_raw: 'To verify if a started procedure is associated with a user ID the STARTED class profile and

    its STDATA segment can be listed, the USER= parameter in the STDATA segment will be the

    associated user.

    RLIST STARTED procedure.* STDATA'
  remediation: 'Default user should not be usable.

    RDEFINE STARTED procedure.*

    RALTER STARTED procedure.* STDATA(USER(userid))'
  checks:
  - type: manual_review
    info: 'To verify if a started procedure is associated with a user ID the STARTED class profile and

      its STDATA segment can be listed, the USER= parameter in the STDATA segment will be the

      associated user.

      RLIST STARTED procedure.* STDATA'
    severity: medium
- id: 1.2.3
  title: Ensure user propagation is protected with the PROPCNTL class
  scoring: scored
  profile:
  - Level 1
  description: Batch jobs that are user-submitted to the operating system should inherit the user ID of the submitter. This
    will identify the batch job with the user for the purpose of accessing resources. In some environments, such as CICS jobs
    submitted without the USER operand specified on the JOB statement run under a user ID other than the user submitting the
    job, in this case, the CICS user ID. This situation presents a security violation in that the issuer of the job will inherit
    the authority of the CICS user ID. The PROPCNTL Class was designed to prevent this from occurring. Utilize propagation
    control (PROPCNTL) for system-level address spaces that submit jobs on behalf of users.
  rationale: Jobs submitted without the USER operand specified on the JOB statement run under a user ID other than the user
    submitting the job presents a security violation in that the issuer of the job will inherit the authority of the user
    ID.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223673 Rule ID: SV-223673r604139_rule STIG ID: RACF-ES-000250'
  page_start: 37
  audit_raw: 'Verify that the PROPCNTL class is active and the user ID that should not be propagated

    SETROPTS LIST

    RLIST PROPCNTL userid'
  remediation: 'Activate the PROPCNTL class and define the users that should not be propagated

    SETROPTS CLASSACT(PROPCNTL)

    SETROPTS RACLIST(PROPCNTL)

    RDEFINE PROPCNTL userid'
  checks:
  - type: manual_review
    info: 'Verify that the PROPCNTL class is active and the user ID that should not be propagated

      SETROPTS LIST

      RLIST PROPCNTL userid'
    severity: medium
- id: 1.2.4
  title: Ensure that Job wait time option is set
  scoring: scored
  profile:
  - Level 1
  description: In SMFPRMxx the JWT(n) parameter specifies the maximum amount of consecutive time that an executing job may
    spend as ineligible to use any CPU resources before being canceled for inactivity.
  rationale: Address spaces of inactive users must be terminated after a short period of time to limit risk of session stealing.
    JWT(0015) is suggested so users inactive for 15 minutes are terminated.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'The z/OS console command DISPLAY SMF can be used to check for the current active

    options.

    D SMF,O'
  remediation: The parameter JWT(0015) must be coded in the SMFPRMxx member of parmlib.
  checks:
  - type: manual_review
    info: 'The z/OS console command DISPLAY SMF can be used to check for the current active

      options.

      D SMF,O'
    severity: medium
- id: 1.2.5
  title: Ensure that started tasks defined with the trusted attribute are justified
  scoring: manual
  profile:
  - Level 1
  description: Trusted Started tasks bypass RACF checking. It is vital that this attribute is NOT granted to unauthorized
    Started Tasks which could then obtain unauthorized access to the system.
  rationale: Unauthorized Started Tasks obtaining unauthorized access to the system could result in the compromise of the
    confidentiality, integrity, and availability of the operating system, RACF, or customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223661 Rule ID: SV-223661r604139_rule STIG ID: RACF-ES-000130'
  page_start: 40
  audit_raw: 'To verify the TRUSTED attribute, issue the command:

    RLIST STARTED startedtask.** STDATA'
  remediation: 'The trusted attribute can be removed with the following command:

    ralter STARTED startedtask.** STDATA(NOTRUSTED)'
  checks:
  - type: manual_review
    info: 'To verify the TRUSTED attribute, issue the command:

      RLIST STARTED startedtask.** STDATA'
    severity: medium
- id: 1.2.6
  title: Ensure that the OPERCMDS resource class is ACTIVE and RACLISTed
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS CLASSACT(OPERCMDS) specifies that the class OPERCMDS will have RACF protection is to be in effect
    for it. These values become effective immediately after the command SETROPTS CLASSACT(OPERCMDS) is issued.
  rationale: If no setting is found, the system-wide defaults will be used. The improper setting of any subsystem fields,
    individually or in combination with another, can compromise the security of the processing environment. Failure to define
    access to z/OS system commands could result in unauthorized personnel issuing sensitive system commands. This exposure
    may threaten the integrity and availability of the operating system environment and compromise the confidentiality of
    customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223658 Rule ID: SV-223658r604139_rule STIG ID: RACF-ES-000100'
  page_start: 42
  audit_raw: 'Issue the SETROPTS LIST command and look for the OPERCMDS class in ''ACTIVE CLASSES

    ='' section and that the class is also listed as RACLISTed.

    SETROPTS LIST

    Verify the list of commands protected by the OPERCMDS class

    SR CLASS(OPERCMDS)

    For each profile, verify that the definitions are as expected.

    RLIST OPERCMDS profile.from.opercmds'
  remediation: 'Activate and RACLIST the OPERCMDS class.

    Issue the command:

    SETROPTS CLASSACT(OPERCMDS)RACLIST(OPERCMDS)'
  checks:
  - type: manual_review
    info: 'Issue the SETROPTS LIST command and look for the OPERCMDS class in ''ACTIVE CLASSES

      ='' section and that the class is also listed as RACLISTed.

      SETROPTS LIST

      Verify the list of commands protected by the OPERCMDS class

      SR CLASS(OPERCMDS)

      For each profile, verify that the definitions are as expected.

      RLIST OPERCMDS profile.from.opercmds'
    severity: medium
