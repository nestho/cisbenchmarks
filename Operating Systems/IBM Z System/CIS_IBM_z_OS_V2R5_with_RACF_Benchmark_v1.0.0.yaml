- id: 2.4.1
  title: Ensure that the assignment of the RACF OPERATIONS attribute is tightly controlled
  scoring: scored
  profile:
  - Level 1
  description: A user possessing the OPERATIONS attribute has authorization to do maintenance operations on all RACF-protected
    data sets, tape volumes, and DASD volumes except those where the access list specifically limits the OPERATIONS user to
    a lower access authority than the operation requires. Because the OPERATIONS and GROUP-OPERATIONS privileges allow widespread
    access they should be limited to users documented with a valid requirement. Delegation of GROUP-OPERATIONS processing
    to other personnel by site-defined Group Administrators is forbidden. Granting individual authorities using STGADMIN profiles
    in the FACILITY class is the preferred method, where applicable. However, there may be cases where OPERATIONS is required.
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223714 Rule ID: SV-223714r604139_rule STIG ID: RACF-ES-000670'
  page_start: 140
  audit_raw: 'Identify (for example, by using the sample IRRICE report named OPER, or the Selected

    User Attribute Report of the data security monitor program) all users with the

    OPERATIONS attribute in their USER profile and verify that their need for OPERATIONS is

    justified.'
  remediation: 'If OPERATIONS is not justified, remove it, and grant permissions to only those resources

    the user requires in order to perform his/her job duties.'
  checks:
  - type: manual_review
    info: 'Identify (for example, by using the sample IRRICE report named OPER, or the Selected

      User Attribute Report of the data security monitor program) all users with the

      OPERATIONS attribute in their USER profile and verify that their need for OPERATIONS is

      justified.'
    severity: medium
