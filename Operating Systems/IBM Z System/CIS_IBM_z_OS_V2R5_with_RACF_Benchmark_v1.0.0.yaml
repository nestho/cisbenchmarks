- id: 6.4.4
  title: Ensure syslogd archive data sets are protected
  scoring: manual
  profile:
  - Level 1
  description: Syslogd can be configured to automatically archive log files to sequential or Generation Data Group (GDG) data
    sets. These archive data sets contain log information from multiple z/OS system components and must be properly protected
    from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data.
  rationale: Failure to properly secure these data sets may lead to unauthorized access resulting in the compromise of sensitive
    log information from different z/OS system components.
  impact: ''
  references: []
  page_start: 257
  audit_raw: 'Check the following data set controls are in effect for the syslogd archive data sets:

    1. WRITE and ALLOCATE access to archive data sets is restricted to the user ID under

    which syslogd runs

    2. READ access is limited to only those user IDs with legitimate need to access the

    archived log data.

    NOTE: For systems running the TSS ACP replace the WRITE and ALLOCATE with WRITE,

    UPDATE, CREATE, CONTROL, SCRATCH, and ALL.'
  remediation: 'Review the data set access authorizations defined to the ACP for syslogd archive data

    sets. Ensure these data sets are protected in accordance with the following rules:

    WRITE and ALLOCATE access to archive data sets is restricted to the user ID under which

    syslogd runs

    READ access is limited to only those user IDs with legitimate need to access the archived

    log data.

    NOTE: For systems running the TSS ACP replace the WRITE and ALLOCATE with WRITE,

    UPDATE, CREATE, CONTROL, SCRATCH, and ALL.'
  checks:
  - type: manual_review
    info: 'Check the following data set controls are in effect for the syslogd archive data sets:

      1. WRITE and ALLOCATE access to archive data sets is restricted to the user ID under

      which syslogd runs

      2. READ access is limited to only those user IDs with legitimate need to access the

