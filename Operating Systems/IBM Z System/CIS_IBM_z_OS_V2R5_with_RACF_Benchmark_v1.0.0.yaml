      NO TSO INFORMATION

      The output of the LU OMVSKERN CICS command should include:

      NO CICS INFORMATION

      The output of the LU OMVSKERN OMVS command should include:

      UID= 0000000000

      HOME= /

      PROGRAM= /bin/sh'
    severity: medium
- id: '9.10'
  title: Ensure that z/OS UNIX automount configuration files are protected
  scoring: scored
  profile:
  - Level 1
  description: Parameter settings in PARMLIB and /etc specify values for z/OS UNIX security controls, in particular, the automount
    facility. . The automount facility can automatically mount file systems at the time they are accessed, and also unmount
    them later. Undesirable values can allow users to gain inappropriate privileges that could impact data integrity or the
    availability of some system services.
  rationale: The parameters of the autmount facility should be set so they are securely mounted by the automount facility,
    and the users prevented to execute any file from a file-system using the user of the unix user or group owner other that
    file. If not set, these parameters would allow a user to elevate their rights.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223854 Rule ID: SV-223854r604139_rule STIG ID: RACF-US-000170'
  page_start: 440
  audit_raw: 'Review the logical parmlib data sets, example: SYS1.PARMLIB(BPXPRMxx), for the

    following FILESYSTYPE entry:

    FILESYSTYPE TYPE(AUTOMNT) ENTRYPOINT(BPXTAMD)

    If the above entry is not found or is commented out in the BPXPRMxx member(s), this is

    NOT APPLICABLE.'
  remediation: 'Review the settings in /etc/auto.master and /etc/mapname for z/OS UNIX security

    parameters and ensure that the values conform to the specifications below.

    The /etc/auto.master HFS file (and the use of Automount) is optional.

    The setuid parameter and the security parameter have a significant security impact. For

    this reason, these parameters must be explicitly specified and not be allowed to default.

    Each MapName file will specify the setuid NO and security YES statements for each

    automounted directory.

    If there is a deviation from the required values, documentation must exist for the

    deviation.

    Security NO disables security checking for file access. Security NO is only allowed on

    test and development domains.

    Setuid YES allows a user to run under a different UID/GID identity. Justification

    documentation is required to validate the use of setuid YES.'
  checks:
  - type: manual_review
    info: 'Review the logical parmlib data sets, example: SYS1.PARMLIB(BPXPRMxx), for the

      following FILESYSTYPE entry:

      FILESYSTYPE TYPE(AUTOMNT) ENTRYPOINT(BPXTAMD)

      If the above entry is not found or is commented out in the BPXPRMxx member(s), this is

      NOT APPLICABLE.'
    severity: medium
- id: '9.11'
  title: Ensure that z/OS UNIX security parameters in /etc/inetd.conf are configured
  scoring: scored
  profile:
  - Level 1
  description: Parameter settings in PARMLIB and /etc specify values for z/OS UNIX security controls. The Unix services are
    controlled in /etc/inetd.conf and non-essential and potentially non-secure services must be disabled. The parameters impact
    HFS data access and operating system services. Undesirable values can allow users to gain inappropriate privileges that
    could impact data integrity or the availability of some system services.
  rationale: The /etc/inetd.conf file determine if every entry in the file represents a service that is actually in use. Services
    that are not in use must be disabled to reduce potential security exposures. Some non-essential services can potentially
    give remote access to attackers (like remote code execution, …) and must be disabled.
