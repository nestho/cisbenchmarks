  title: Ensure Started tasks for the base TCP/IP component are defined securely in RACF
  scoring: manual
  profile:
  - Level 1
  description: The TCP/IP started tasks require special privileges and access to sensitive resources to provide its system
    services. Failure to properly define and control these TCP/IP started tasks could lead to unauthorized access.
  rationale: This exposure may result in the compromise of the integrity and availability of the operating system environment,
    ACP, and customer data.
  impact: ''
  references: []
  page_start: 281
  audit_raw: '1. Ensure the following items are in effect for the user ID(s) assigned to the TCP/IP

    address space(s):

    a. Named TCPIP or, in the case of multiple instances, prefixed with TCPIP

    b. Defined as a PROTECTED user ID

    c. z/OS UNIX attributes: UID(0), HOME directory ‘/’, shell program /bin/sh

    d. A matching entry in the STARTED resource class exists enabling the use of the

    standard user ID(s) and appropriate group

    2. Ensure the following items are in effect for the user ID assigned to the EZAZSSI

    started task:

    a. Named EZAZSSI

    b. Defined as a PROTECTED user ID

    c. A matching entry in the STARTED resource class exists enabling the use of the

    standard userid and appropriate group.'
  remediation: '1. Define a user ID for the TCPIP Address space. A sample command is shown

    here:

    ADDUSER TCPIP NAME(''STC, TCPIP'') NOPASS DFLTGRP(STCTCPX) OWNER(STCTCPX)

    OMVS(UID(0) HOME(''/'') PROGRAM(''/bin/sh''))

    2. Define a matching entry in the STARTED Class. A sample command is shown here:

    RDEFINE STARTED TCPIP.** UACC(NONE) OWNER(ADMN) AUDIT(ALL(READ))

    STDATA(USER(TCPIP) GROUP(STCTCPX) TRACE(YES))

    3. Set up the RACF user ID for the EZAZSSI Proc. A sample command to

    accomplish this is shown here:

    AU EZAZSSI NAME(''STC, EZAZSSI'') NOPASS OWNER(STCTCPX) DFLTGRP(STCTCPX)

    4. Define a matching entry in the STARTED class for the EZAZSSI proc. A sample

    command to accomplish this is shown here:

    RDEF STARTED EZAZSSI.** UACC(NONE) OWNER(ADMIN) AUDIT(ALL(READ))

    STDATA(USER(EZAZSSI) GROUP(STCTCPX) TRACE(YES))'
