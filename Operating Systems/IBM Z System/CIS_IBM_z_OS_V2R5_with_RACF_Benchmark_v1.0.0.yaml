- id: '3.12'
  title: Ensure that only supported (vendor) system software is installed and active on the system
  scoring: manual
  profile:
  - Level 1
  description: When a vendor drops support of System Software, they no longer maintain security vulnerability patches to the
    software.
  rationale: Without vulnerability patches, it is impossible to verify that the system does not contain code which could violate
    the integrity of the operating system environment.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
