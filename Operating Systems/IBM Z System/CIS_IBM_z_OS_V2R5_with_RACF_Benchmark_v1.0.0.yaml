      CSFDKCS Master Key Entry Utility

      CSFGKF Generate Fin'
    severity: medium
- id: 7.3.8
  title: Ensure ICSF operator commands are protected
  scoring: manual
  profile:
  - Level 1
  description: 'ICSF has two commands that can be issued at an operator console to display information about ICSF and ICSF
    resources or make changes to how ICSF is operating: DISPLAY ICSF SETICSF'
  rationale: Use of the ICSF operator commands must be restricted to authorized users.
  impact: ''
  references: []
  page_start: 350
  audit_raw: 'ICSF uses the following resource names to control access to the ICSF operator

    commands:

    MVS.DISPLAY.ICSF

    MVS.SETICSF.ICSF

    To see if there are protection profiles for these resources, execute the following

    command:

    SEARCH CLASS(OPERCMDS)

    And scan the output for the above ICSF resource names.

    For each of the resources, the following command can be used to determine the default

    access (UACC).

    RLIST OPERCMDS <profile name>

    _NOTE: Many installations will have a generic profile in place for display commands

    with more broad access allowed. _'
  remediation: 'For each of the ICSF operator command resource names, create a profile in the

    OPERCMDS class with permissions as defined by your security administrator

    RDEFINE OPERCMDS <ICSF Operator Command Resource Name> UACC(NONE)'
  checks:
