    b) Ensure that RACF data set rules for all VTAM system data sets restrict access to

    only network systems programming staff. These data sets include libraries containing

    VTAM load modules and exit routines, and VTAM start options and definition

    statements.'
  remediation: 'Ensure that RACF data set rules for all VTAM system data sets restrict access to only

    network systems programming staff. These data sets include libraries containing VTAM

    load modules and exit routines, and VTAM start options and definition statements.

    The following sample RACF commands show proper definitions/permissions for VTAM

    datasets:

    AD ''SYS1.VTAM*.**'' UACC(NONE) OWNER(SYS1) -

    AUDIT(SUCCESS(UPDATE) FAILURES(READ)) -

    DATA(''IBM VTAM DS PROFILE: REF SRR PDI ZVTM0018'')

    PE ''SYS1.VTAM.**'' ID() ACC(A)

    AD ''SYS1.VTAMLIB.**'' UACC(NONE) OWNER(SYS1) -

    AUDIT(SUCCESS(UPDATE) FAILURES(READ)) -

    DATA(''IBM VTAM APF DS PROFILE: REF SRR PDI ZVTM0018'')

