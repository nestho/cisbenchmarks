    PERMIT CONSOLE CLASS(TSOAUTH) ID(user1...usern) ACCESS(READ)

    Or remove the non authorized users by issuing the command:

    PERMIT CONSOLE CLASS(TSOAUTH) ID(user) DELETE'
  checks:
