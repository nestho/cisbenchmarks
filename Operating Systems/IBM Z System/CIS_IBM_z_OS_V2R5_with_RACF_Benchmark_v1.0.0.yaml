    \ access is not required. In rare\noccasions, a system programmer may require READ access in order to run the\nIRRBRW00\
    \ utility.\nLISTDSD DA('RSFJ.WORK.SYS1.SYS4.INMSG') AUTHUSER GENERIC\nAlso verify that the files are encrypted. Display\
    \ the encryption status by issuing the\ncommand:\nLISTCAT\nFor example:\nLISTCAT ENTRY('RSFJ.WORK.SYS1.SYS4.INMSG') ALL\n\
    … ENCRYPTIONDATA\n DATA SET ENCRYPTION-----(NO)\n…"
  remediation: 'Update the DATASET profile as necessary to restrict UPDATE access to the RACF

    subsystem identity (if not running TRUSTED) and READ access to system programmers

