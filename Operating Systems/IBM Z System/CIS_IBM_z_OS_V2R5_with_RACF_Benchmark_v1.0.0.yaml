- id: '9.14'
  title: Ensure that z/OS UNIX permission bits and audit bits are configured to audit sensitive file access
  scoring: scored
  profile:
  - Level 1
  description: 'With z/OS UNIX a file owner or a security auditor can specify if auditing is turned on or off, and when audit
    records should be written for a directory or a file: for successful accesses, failed accesses, or for all accesses. Sensitive
    files or directories access should be audited. The permissions bits also set access permissions for three classes: owner,
    group, and other. Sensitive files access must be restricted.'
  rationale: Sensitive configuration files or logs must be restricted to authorized personnel and audited for system integrity.
    If not audited, uncontrolled modifications to sensitive configuration files or logs would not be detected.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223845 Rule ID: SV-223845r604139_rule STIG ID: RACF-US-000080'
  page_start: 448
  audit_raw: 'The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

     "f log" for failed access attempts

     "a log" for failed and successful access

     no auditing

    The permissions bits and audit bits for a unix file or all the files from a directory

    can be listed by the command:

    ls –W [pathname]'
  remediation: 'The permissions bits for a unix file can be modified by the command:

    chmod mode pathname

    The audit bits for a unix file can be modified by the command:

    chaudit attr pathname

    File Recommended permission bits Recommended

    audit attributes

    /usr/lpp/tcpip/sbin/syslogd 1740 rwx=f

    /etc/syslog.conf 0744 w=sf,rx+f

    /etc/hosts 0744 w=sf,rx+f

    /etc/protocol 0744 w=sf,rx+f

    /etc/resolv.conf 0744 w=sf,rx+f

    /etc/services 0744 w=sf,rx+f

    /usr/lpp/tcpip/bin 0755 w=sf,rx+f

    /usr/lpp/tcpip/sbin 0755 w=sf,rx+f'
  checks:
  - type: command
    command: ls –W [pathname]
    expected: ''
    severity: medium
    info: 'The following represents a hierarchy for permission bits from least restrictive to most

      restrictive:

      7 rwx (least restrictive)

      6 rw3 -wx

      2 -w5 r-x

      4 r--

      1 --x

