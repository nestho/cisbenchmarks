    The state of the RVARY SWITCH and STATUS passwords are displayed:

     INSTALLATION DEFINED RVARY PASSWORD IS IN EFFECT FOR THE

    SWITCH FUNCTION.

     INSTALLATION DEFINED RVARY PASSWORD IS IN EFFECT FOR THE

    STATUS FUNCTION.'
  remediation: 'Issue the command:

    RVARYPW([SWITCH(switch-pw)][STATUS(status-pw)])'
  checks:
  - type: manual_review
    info: 'Issue the command:

      SETROPTS LIST

