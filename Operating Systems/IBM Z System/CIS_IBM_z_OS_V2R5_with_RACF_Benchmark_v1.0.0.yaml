  title: Ensure MVS data sets for the Base TCP/IP component are protected
  scoring: manual
  profile:
  - Level 1
  description: MVS data sets of the Base TCP/IP component provide the configuration, operational, and executable properties
    of IBM's TCP/IP system product. The data sets TCP/IP relies upon for its configuration, runtime environment and operation
    must be properly protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive
    data.
  rationale: Failure to properly secure these data sets may lead to unauthorized access resulting in the compromise of the
    integrity and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF Security Technical Implementation Guide :: Version 8, Release:'
  - '2. Vul ID: V-223826 Rule ID: SV-223826r604139_rule STIG ID: RACF-TC-000070'
  page_start: 283
  audit_raw: 'Check the following data set controls are in effect for the Base TCP/IP component:

    1. WRITE and ALLOCATE access to product data sets is restricted to systems

    programming personnel (i.e., SMP/E distribution data sets with the prefix

    SYS1.TCPIP.AEZA and target data sets with the prefix SYS1.TCPIP.SEZA).

    2. WRITE and ALLOCATE access to the data set(s) containing the Data and Profile

    configuration files is restricted to systems programming personnel.

    NOTE: If any INCLUDE statements are specified in the Profile configuration file, the

    named MVS data sets have the same access authorization requirements.

    3. WRITE and ALLOCATE access to the data set(s) containing the Data and Profile

    configuration files is logged.

    NOTE: If any INCLUDE statements are specified in the Profile configuration file, the

    named MVS data sets have the same logging requirements.

    4. WRITE and ALLOCATE access to the data set(s) containing the configuration files

    shared by TCP/IP applications is restricted to systems programming personnel.

    NOTE: For systems running the TSS ACP replace the WRITE and ALLOCATE with WRITE,

    UPDATE, CREATE, CONTROL, SCRATCH, and ALL.'
