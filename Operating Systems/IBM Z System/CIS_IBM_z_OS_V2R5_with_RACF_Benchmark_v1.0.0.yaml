  title: Implement sensitive z/OS datasets monitoring
  scoring: manual
  profile:
  - Level 1
  description: It is important to monitor changes, additions or removal from APF and LPA libraries, as well as changes to
    SYS1.PARMLIB PDS members. A monitoring tool should be implemented to monitor the modification to the sensitive z/OS datasets
    modification.
  rationale: ''
  impact: Failure to monitor and review these reports on a regular basis and validating any changes could threaten the integrity
