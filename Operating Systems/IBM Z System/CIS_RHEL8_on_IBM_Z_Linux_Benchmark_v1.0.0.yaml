- id: '5.7'
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo , which allows for more granular control over privileged access. Normally, the su command can be executed by any
    user. By uncommenting the pam_wheel.so statement in /etc/pam.d/su , the su command will only allow users in the wheel
    group to execute su .
  rationale: Restricting the use of su , and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo , whereas su can only record that a user executed the su program.
  impact: ''
  references: []
  page_start: 444
  audit_raw: 'Run the following command and verify output includes matching line:

    # grep pam_wheel.so /etc/pam.d/su

    auth required pam_wheel.so use_uid

    Run the following command and verify users in wheel group match site policy. If no

    users are listed, only root will have access to su.

    # grep wheel /etc/group

    wheel:x:10:root,<user list>'
  remediation: 'Add the following line to the /etc/pam.d/su file:

    auth required pam_wheel.so use_uid

    Create a comma separated list of users in the wheel statement in the /etc/group file:

    wheel:x:<GID>:root,<user list>

    Example:

    wheel:x:10:root,user1,user2,user3'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output includes matching line:

      # grep pam_wheel.so /etc/pam.d/su

      auth required pam_wheel.so use_uid

      Run the following command and verify users in wheel group match site policy. If no

      users are listed, only root will have access to su.

      # grep wheel /etc/group

      wheel:x:10:root,<user list>'
    severity: medium
- id: 6.1.1
  title: Audit system file permissions
  scoring: manual
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: 'The RPM package manager has a number of useful options. One of these, the -V for RPM option, can be used to
    verify that system packages are correctly installed. The -V option can be used to verify a particular package or to verify
    all system packages. If no output is returned, the package is installed correctly. The following table describes the meaning
    of output from the verify option: Code Meaning S File size differs. M File mode differs (includes permissions and file
    type). 5 The MD5 checksum differs. D The major and minor version numbers differ on a device file. L A mismatch occurs
    in a link. U The file ownership differs. G The file group owner differs. T The file time (mtime) differs. The rpm -qf
    command can be used to determine which package a particular file belongs to. For example the following commands determines
    which package the /bin/bash file belongs to: # rpm -qf /bin/bash bash-4.1.2-29.el6.x86_64 # dpkg -S /bin/bash bash: /bin/bash
    To verify the settings for the package that controls the /bin/bash file, run the following: # rpm -V bash-4.1.2-29.el6.x86_64
    # dpkg --verify bash ??5?????? c /etc/bash.bashrc Note that you can feed the output of the rpm -qf command to the rpm
    -V command: # rpm -V `rpm -qf /etc/passwd`'
  rationale: It is important to confirm that packaged system files and directories are maintained with the permissions they
    were intended to have from the OS vendor.
  impact: ''
  references:
  - 1. http://docs.fedoraproject.org/enUS/Fedora_Draft_Documentation/0.1/html/RPM_Guide/index.html
  page_start: 448
  audit_raw: 'Run the following command to review all installed packages. Note that this may be very

    time consuming and may be best scheduled via the cron utility. It is recommended that

    the output of this command be redirected to a file that can be reviewed later.

    # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename>'
  remediation: 'Correct any discrepancies found and rerun the audit until output is clean or risk is

    mitigated or accepted.'
  checks:
  - type: manual_review
    info: 'Run the following command to review all installed packages. Note that this may be very

      time consuming and may be best scheduled via the cron utility. It is recommended that

      the output of this command be redirected to a file that can be reviewed later.

      # rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename>'
    severity: medium
