- id: 7.2.3
  title: Configure dm-crypt to use XTS-PAES with 256 bit keys
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: When using full disk encryption via dm-crypt, it is recommended to use the XTS-PAES cipher mode with 256 bit
    keys.
  rationale: A key length of 256 bits is required to ensure future-proof quantum-safe encryption. Using the XTS-PAES cipher
    mode results in a much smaller passphrase making key management easier for the user.
  impact: ''
  references: []
  page_start: 517
  audit_raw: 'Enter the following command to verify the cipher mode:

    $ cryptsetup luksDump <device> | grep -E "^Cipher mode|^MK bits"

    Cipher mode: xts-paes

    MK bits: 256'
  remediation: 'Reformat the device using

    cryptsetup luksFormat

    and specify

    --cipher xts-paes

    and --key-size 256.

    See also:

    Pervasive Encryption'
  checks:
  - type: command
    command: $ cryptsetup luksDump <device> | grep -E "^Cipher mode|^MK bits"
    expected: ''
    severity: medium
    info: 'Enter the following command to verify the cipher mode:

      $ cryptsetup luksDump <device> | grep -E "^Cipher mode|^MK bits"

      Cipher mode: xts-paes

      MK bits: 256'
- id: 7.3.1
  title: Ensure UID uniqueness checking is active
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Activate UID uniqueness checking to ensure stable addressing for Peripheral Component Interconnect (PCI) devices.
  rationale: Deactivating or activating a PCI device can change its corresponding PCI domain, resulting in a change of the
    NIC (network interface cardname) device in the operating system. This can compromise security for mechanisms that rely
    on the NIC, like for example, iptables.
  impact: ''
  references: []
  page_start: 519
  audit_raw: 'Read the uid_is_unique attribute for any PCIe device that is

    available to your Linux instance to find out which naming scheme applies.

    Example:

    # cat /sys/bus/pci/devices/0000:00:00.0/uid_is_unique

    1

    If the value is 1, UID uniqueness checking is enabled,

    and the network interface names are based on UIDs.

    For any other value, UID uniqueness checking is not enabled,

    and the network interface names are based on FIDs.'
  remediation: UID uniqueness checking can be enabled in the IOCDS.
  checks:
  - type: manual_review
    info: 'Read the uid_is_unique attribute for any PCIe device that is

      available to your Linux instance to find out which naming scheme applies.

      Example:

      # cat /sys/bus/pci/devices/0000:00:00.0/uid_is_unique

      1

      If the value is 1, UID uniqueness checking is enabled,

      and the network interface names are based on UIDs.

      For any other value, UID uniqueness checking is not enabled,

      and the network interface names are based on FIDs.'
    severity: medium
- id: 7.3.2
  title: NVMe setting for data resilience
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: When using NVMe (Non-Volatile Memory express) devices for disk storage, it is recommended to implement redundancy
    over multiple devices via software RAID for data resilience.
  rationale: NVMe devices do not have built-in hardware capabilities for redundancy similar to classic IO devices (DASD, zfcp).
    Therefore, redundancy needs to be implemented at the software level. Without redundancy, disk failure of a single disk
    can lead to data loss.
  impact: ''
  references: []
  page_start: 520
  audit_raw: "To check software RAID at block device level, enter the following command:\nlsblk\nIn the output, verify that\
