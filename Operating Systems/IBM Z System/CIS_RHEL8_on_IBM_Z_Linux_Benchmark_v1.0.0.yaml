    and force all administrators to have to log in first and then use sudo to execute privileged commands, then all administrator
    commands will be logged to /var/log/sudo.log . Any time a command is executed, an audit event will be triggered as the
    /var/log/sudo.log file will be opened for write and the executed administration command will be written to the log.
  rationale: Changes in /var/log/sudo.log indicate that an administrator has executed a command or the log file itself has
