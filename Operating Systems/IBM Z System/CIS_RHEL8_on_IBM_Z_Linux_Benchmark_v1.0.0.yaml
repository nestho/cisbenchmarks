    expected: This procedure should return nothing.
    severity: medium
    info: "Run the following procedure:\nfile=/etc/passwd\nShells='/bin/csh|/bin/tcsh|/bin/sh|/bin/ksh|/bin/bash|/bin/sh|/bin/false|\n\
