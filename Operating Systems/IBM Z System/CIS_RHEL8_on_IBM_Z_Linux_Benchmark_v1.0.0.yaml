- id: 3.4.3.8
  title: Ensure nftables rules are permanent
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: nftables is a subsystem of the Linux kernel providing filtering and classification of network packets/datagrams/frames.
    The nftables service reads the /etc/sysconfig/nftables.conf file for a nftables file or files to include in the nftables
    ruleset. A nftables ruleset containing the input, forward, and output base chains allow network traffic to be filtered.
  rationale: Changes made to nftables ruleset only affect the live system, you will also need to configure the nftables ruleset
    to apply on boot.
  impact: ''
  references: []
  page_start: 254
  audit_raw: "Run the following commands to verify that input, forward, and output base chains are\nconfigured to be applied\
    \ to a nftables ruleset on boot:\nRun the following command to verify the input base chain:\n# [[ -n $(grep -E \"^\\s*include\"\
    \ /etc/sysconfig/nftables.conf) ]] && awk\n'/hook input/,/}/' $(awk '$1 ~ /^\\s*include/ { gsub(\"\\\"\",\"\",$2);print\
    \ $2 }'\n/etc/sysconfig/nftables.conf)\nOutput should be similar to:\n type filter hook input priority 0; policy drop;\n\
    \ # Ensure loopback traffic is configured\n iif \"lo\" accept\n ip saddr 127.0.0.0/8 counter packets 0 bytes 0 drop\n\
    \ ip6 saddr ::1 counter packets 0 bytes 0 drop\n # Ensure established connections are configured\n ip protocol tcp ct\
    \ state established accept\n ip protocol udp ct state established accept\n ip protocol icmp ct state established accept\n\
    \ # Accept port 22(SSH) traffic from anywhere\n tcp dport ssh accept\n # Accept ICMP and IGMP from anywhere\n icmpv6 type\
    \ { destination-unreachable, packet-too-big, timeexceeded, parameter-problem, mld-listener-query, mld-listener-report,\
    \ mldlistener-done, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, ndneighbor-advert, ind-neighbor-solicit,\
    \ ind-neighbor-advert, mld2-listenerreport } accept\nNote: Review the input base chain to ensure that it follows local\
    \ site policy\nRun the following command to verify the forward base chain:\n# [[ -n $(grep -E \"^\\s*include\" /etc/sysconfig/nftables.conf)\
    \ ]] && awk\n'/hook forward/,/}/' $(awk '$1 ~ /^\\s*include/ { gsub(\"\\\"\",\"\",$2);print $2 }'\n/etc/sysconfig/nftables.conf)\n\
    Output should be similar to:\n # Base chain for hook forward named forward (Filters forwarded\nnetwork packets)\n chain\
    \ forward {\n type filter hook forward priority 0; policy drop;\n }\nNote: Review the forward base chain to ensure that\
    \ it follows local site policy.\nRun the following command to verify the output base chain:\n# [[ -n $(grep -E \"^\\s*include\"\
    \ /etc/sysconfig/nftables.conf) ]] && awk\n'/hook output/,/}/' $(awk '$1 ~ /^\\s*include/ { gsub(\"\\\"\",\"\",$2);print\
    \ $2 }'\n/etc/sysconfig/nftables.conf)\nOutput should be similar to:\n # Base chain for hook output named output (Filters\
    \ outbound network\npackets)\n chain output {\n type filter hook output priority 0; policy drop;\n # Ensure outbound and\
    \ established connections are configured\n ip protocol tcp ct state established,related,new accept\n ip protocol tcp ct\
    \ state established,related,new accept\n ip protocol udp ct state established,related,new accept\n ip protocol icmp ct\
    \ state established,related,new accept\n }\nNote: Review the output base chain to ensure that it follows local site policy."
  remediation: 'Edit the /etc/sysconfig/nftables.conf file and un-comment or add a line with include

    <Absolute path to nftables rules file> for each nftables file you want included in

    the nftables ruleset on boot

    example:

    # vi /etc/sysconfig/nftables.conf

    Add the line:

    include "/etc/nftables/nftables.rules"'
  checks:
  - type: manual_review
    info: "Run the following commands to verify that input, forward, and output base chains are\nconfigured to be applied\
      \ to a nftables ruleset on boot:\nRun the following command to verify the input base chain:\n# [[ -n $(grep -E \"^\\\
      s*include\" /etc/sysconfig/nftables.conf) ]] && awk\n'/hook input/,/}/' $(awk '$1 ~ /^\\s*include/ { gsub(\"\\\"\",\"\
      \",$2);print $2 }'\n/etc/sysconfig/nftables.conf)\nOutput should be similar to:\n type filter hook input priority 0;\
      \ policy drop;\n # Ensure loopback traffic is configured\n iif"
    severity: medium
