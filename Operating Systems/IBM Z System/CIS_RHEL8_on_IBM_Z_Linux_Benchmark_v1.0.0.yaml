- id: 3.4.2.6
  title: Ensure unnecessary services and ports are not accepted
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Services and ports can be accepted or explicitly rejected or dropped by a zone. For every zone, you can set
    a default behavior that handles incoming traffic that is not further specified. Such behavior is defined by setting the
    target of the zone. There are three options - default, ACCEPT, REJECT, and DROP. By setting the target to ACCEPT, you
    accept all incoming packets except those disabled by a specific rule. If you set the target to REJECT or DROP, you disable
    all incoming packets except those that you have allowed in specific rules. When packets are rejected, the source machine
    is informed about the rejection, while there is no information sent when the packets are dropped.
  rationale: To reduce the attack surface of a system, all services and ports should be blocked unless required
  impact: ''
  references:
  - 1. firewalld.service(5)
  - 2. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/8/html/securing_networks/using-and-configuringfirewalls_securing-networks
