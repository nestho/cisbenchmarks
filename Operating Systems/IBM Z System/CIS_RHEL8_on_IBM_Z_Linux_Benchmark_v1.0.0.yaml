- id: 4.1.1.3
  title: Enable auditing for processes that start prior to auditd
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: zIPL is the default Red Hat Enterprise Linux 8 boot loader for IBM Z systems. Ensure that all processes can
    be audited, even those which start prior to the audit daemon (auditd). Make sure /etc/zipl.conf doesn't contain image
    = setting, as Red Hat Enterprise Linux 8 adheres to Boot Loader Specification (BLS). Run the zipl command so that /boot/bootmap
    is updated.
  rationale: Audit events need to be captured on processes that start up prior to auditd , so that potential malicious activity
    cannot go undetected.
  impact: Each process on the system carries an auditable flag which indicates whether its activities can be audited. Although
    the Linux Auditing System auditd takes care of enabling this flag for all processes which launch after auditd launches,
    adding the kernel argument (adding audit=1 to /etc/kernel/cmdline) ensures that the flag is set for every process during
    boot.
  references: []
  page_start: 292
  audit_raw: 'Check that all boot entries in the zIPL boot loader

    /boot/loader/entries/*.conf

    have audit=1 included in their options.'
  remediation: 'To ensure that new kernels and boot entries continue to enable audit, add the entry

    audit=1 to file

    /etc/kernel/cmdline'
  checks:
  - type: manual_review
    info: 'Check that all boot entries in the zIPL boot loader

      /boot/loader/entries/*.conf

      have audit=1 included in their options.'
    severity: medium
- id: 4.1.1.4
  title: Extend the audit backlog limit for the audit daemon
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: To improve the kernel capacity to queue all log events, even those which start prior to the audit daemon, check
    that all boot entries in file /boot/loader/entries/*.conf have the entry audit_backlog_limit=8192 included in their options.
    Make sure that file /etc/zipl.conf does not contain the entry image = setting, because Red Hat Enterprise Linux 8 adheres
    to the Boot Loader Specification (BLS). Additionally, run the zipl command so that /boot/bootmap is updated.
  rationale: If during boot, audit=1, the backlog holds 64 records. If more than 64 records are created during boot, auditd
    records are lost and potential malicious activity may remain undetected.
  impact: The audit_backlog_limit sets the queue length for audit events awaiting transfer to the audit daemon. Until the
    audit daemon is up and running, all log messages are stored in this queue. If the queue overruns during boot process,
    the action defined by the audit failure flag is taken.
  references: []
  page_start: 294
  audit_raw: 'All boot entries in file

    /boot/loader/entries/*.conf

    have the queue length set to: audit_backlog_limit=8192'
  remediation: 'Check that all boot entries in file

    /boot/loader/entries/*.conf

    have the entry audit_backlog_limit=8192

    included in their options.

    Make sure that file

    /etc/zipl.conf

    does not contain the entry image = setting,

    because Red Hat Enterprise Linux 8 adheres to the

    Boot Loader Specification (BLS).

    Additionally, run the zipl command so that

    /boot/bootmap

    is updated.

    To ensure that new kernels and boot entries

    continue to extend the audit log events queue,

    add the audit_backlog_limit=8192 option to file

    /etc/kernel/cmdline'
  checks:
  - type: manual_review
    info: 'All boot entries in file

      /boot/loader/entries/*.conf

      have the queue length set to: audit_backlog_limit=8192'
    severity: medium
