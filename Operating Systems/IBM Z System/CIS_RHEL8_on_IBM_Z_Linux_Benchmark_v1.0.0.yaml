- id: 6.1.15
  title: Ensure udev rules have proper ownership
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Udev rules are triggered by kernel events and are executed in root context. It is critical that existing rules
    can only be updated by a root user.
