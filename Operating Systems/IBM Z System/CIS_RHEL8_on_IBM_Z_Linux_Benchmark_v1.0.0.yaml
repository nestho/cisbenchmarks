- id: 2.2.6
  title: Disable the pcnfsd service
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The pcnfsd service is an authentication and printing program, which uses NFS to provide file transfer services.
    If this service is not required to support certain applications, it must be denied by the system settings for service
    prevention, or this pcnfsd service must be completely removed from the system.
  rationale: The pcnfsd service is vulnerable and exploitable and permits attackers to compromise the machine both locally
    and remotely. If PC NFS clients are nonetheless required within the environment, Samba is recommended as an alternative
    software solution. The pcnfsd daemon predates Microsoft's release of SMB (Samba) specifications. Standard Linux distributions
    do not provide this package, but it is readily available under third party sites.
