- id: 1.7.1.4
  title: Ensure the SELinux state is set to 'enforcing'
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The SELinux state should be set to enforcing at system boot time by the boot loader. During the boot process,
    the boot loader is responsible for starting the execution of the kernel and passing options to it. The default Red Hat
    Enterprise Linux 8 boot loader for IBM Z systems is called zIPL.
  rationale: SELinux must be enabled at boot time to ensure that the controls it provides are always in effect.
  impact: Setting the SELinux state to enforcing ensures that SELinux can confine potentially compromised processes that might
    perform actions opposite to the security policy. The enforcing option is designed to prevent compromised processes from
    causing damage to the system, or to prevent that their privileges are even further elevated.
  references: []
