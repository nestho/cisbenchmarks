- id: 1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the server. If this filesystem
    type is not needed, disable it.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v cramfs

    install /bin/true

    # lsmod | grep cramfs

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vim /etc/modprobe.d/cramfs.conf

    and add the following line:

    install cramfs /bin/true

    Run the following command to unload the cramfs module:

    # rmmod cramfs'
  checks:
  - type: command
    command: '# lsmod | grep cramfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # modprobe -n -v cramfs

      install /bin/true

      # lsmod | grep cramfs

      <No output>'
- id: 1.1.1.2
  title: Ensure mounting of vFAT filesystems is limited
  scoring: manual
  profile:
  - Level 2 - Workstation
  - Level 2 - Server
  description: The vFAT filesystem format is primarily used on older windows systems and portable USB drives or flash modules.
    It comes in three types FAT12 , FAT16 , and FAT32 all of which are supported by the vfat kernel module.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: The FAT filesystem format is used by UEFI systems for the EFI boot partition. Disabling the vfat module can prevent
    boot on UEFI systems. FAT filesystems are often used on portable USB sticks and other flash media which are commonly used
    to transfer files between workstations, removing VFAT support may prevent the ability to transfer files in this way.
  references: []
  page_start: 23
  audit_raw: 'If utilizing UEFI the vFAT filesystem format is required. If this case, ensure that the vFAT

    filesystem is only used where appropriate

    Run the following command

    grep -E -i ''\svfat\s'' /etc/fstab

    And review that any output is appropriate for your environment

    If not utilizing UEFI

    Run the following commands and verify the output is as indicated:

    # modprobe -n -v vfat

    install /bin/true

    # lsmod | grep vfat

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vim /etc/modprobe.d/vfat.conf

    install vfat /bin/true

    Run the following command to unload the vfat module:

    # rmmod vfat'
  checks:
  - type: command
    command: 'grep -E -i ''\svfat\s'' /etc/fstab && # lsmod | grep vfat'
    expected: ''
    severity: medium
    info: 'If utilizing UEFI the vFAT filesystem format is required. If this case, ensure that the vFAT

      filesystem is only used where appropriate

      Run the following command

      grep -E -i ''\svfat\s'' /etc/fstab

      And review that any output is appropriate for your environment

      If not utilizing UEFI

      Run the following commands and verify the output is as indicated:

      # modprobe -n -v vfat

      install /bin/true

      # lsmod | grep '
