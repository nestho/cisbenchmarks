- id: '6.3'
  title: Enable timeout support for login shells
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: 'When establishing an individual to a system ID, a login shell which supports time out must be used. The guidance
    from other sections in this benchmark is only sufficient for login shells: /bin/csh, /bin/tcsh, /bin/sh, /bin/ksh, /bin/ksh93,
    and /bin/bash. This guidance is also sufficient for /bin/sh when the concerned link is a symbolic or hard link to one
    of the previously listed shells. If other login shells are permitted, similar controls must be established. Where this
    is done, add it to the ''agreed to Value'' column. Neither the bourne shell nor the dash shell support this control, and
    neither shell may be used as a login shell. Shells from /bin/false, /sbin/nologin, and other no-login shells are exempt
    from this requirement and are permitted. Additional no-login shells defined by the account can be added to the ''agreed
    to Value'' column. The special-purpose shells from /bin/sync, /sbin/shutdown, and /sbin/halt are also exempt from this
    requirement, but must not be set as the login shell for an individual to a system ID. An individual logging in to system
    IDs must have one of the following shells set as login shell: /bin/csh, /bin/tcsh, /bin/sh, /bin/ksh, /bin/bash, /bin/sh,
    /bin/false, /sbin/nologin, /usr/bin/sh, /usr/bin/bash, /usr/sbin, /nologin, /bin/ksh93, or /usr/bin/ksh93.'
  rationale: Having no timeout value associated with a shell could allow an unauthorized user access to another user's shell
    session (for example, the user walks away from their computer and does not lock the screen). Setting a timeout value at
    least reduces this risk.
  impact: ''
  references: []
  page_start: 503
  audit_raw: "Run the following procedure:\nfile=/etc/passwd\nShells='/bin/csh|/bin/tcsh|/bin/sh|/bin/ksh|/bin/bash|/bin/sh|/bin/false|\n\
    \ /sbin/nologin|/usr/bin/sh|/usr/bin/bash|/usr/sbin/nologin|/bin\n /ksh93|/usr/bin/ksh|/usr/bin/rksh|/usr/bin/ksh93|'\n\
    cat $file | egrep -v '^sync:.:/bin/sync\\s$|^halt:.:/sbin/halt\\s$|^shutdown:.\n :/sbin/shutdown\\s$' |\nwhile read ENTRY\n\
    do\nSHELL=$(echo $ENTRY | awk -F: '{printf $7\"\\n\"}')\nUid=$(echo $ENTRY | awk -F: '{printf $1\"\\n\"}')\n[[ \"$SHELL\"\
    \ != @($Shells) ]] && printf \"\nWARNING: Verify shell supports autologout/TMOUT function - id:\n$Uid - shell: $SHELL\\\
    n\"\ndone\nThis procedure should return nothing.\nNote: This procedure also passes without\nhaving defined shells, as\
    \ Linux assigns an\neffective default shell /bin/sh to the ID."
  remediation: 'Check if the indicated shell supports time out.

    If it does and the customer requires it''s usage,

    update the technical specification ''agreed to values''

    to reflect this requirement. Be sure to update the ''default''

    requirements for setting timeout for the shell. That is, set

    systems to terminate a session after a period of inactivity

    as follows:

    PCI Servers = 15 minutes, or 900 seconds.

    GDPR Servers = 30 minutes, or 1800 seconds.

    HIPAA Servers = 30 minutes, or 1800 seconds.

    All other servers = 6 hours, or 21600 seconds.

    If the shell is to be permitted to the general

    population, add it to the shells in file

    /etc/shells.

    usermod --shell /bin/bash $Uid'
