- id: 7.3.3
  title: Ensure that unused PCI Devices are disabled
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: In general it is recommended to keep unused PCI (Peripheral Component Interconnect) devices disabled so that
    for example, NICs (Network Interface Card) are not used inadvertently.
  rationale: Inadvertent usage of devices can lead to data corruption or leakage.
  impact: ''
  references: []
  page_start: 522
  audit_raw: 'Enter the following command:

    lspci

    Make sure that only devices are listed in the resulting output,

    that are required for the current workload.'
  remediation: 'Enter the following command to detach the devices in the IOCDS:

    echo 0 >/sys/bus/pci/slots/<slot>/power

    This ensures that any events are no longer processed by

    the effected hardware.'
  checks:
  - type: manual_review
    info: 'Enter the following command:

      lspci

      Make sure that only devices are listed in the resulting output,

      that are required for the current workload.'
    severity: medium
- id: 7.4.1
  title: Configure SMC-D for network traffic isolation
  scoring: manual
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: When using Shared Memory Communication - Direct Memory Access (SMC-D) networking, it is recommended that each
    SMC-D device belongs to a different virtual channel ID (VCHID).
  rationale: All SMC-D devices belonging to the same VCHID might be able to eavesdrop traffic.
  impact: ''
  references: []
  page_start: 524
  audit_raw: 'Use the smc_rnics tool to list, enable and disable (R)NICs as used by SMC-R and

    SMC-D.

    Make sure that each SMC-D device has a unique physical channel identifier (PCHID)

    value.'
  remediation: Configure individual SMC-D devices to have different VCHIDs.
  checks:
  - type: manual_review
    info: 'Use the smc_rnics tool to list, enable and disable (R)NICs as used by SMC-R and

      SMC-D.

      Make sure that each SMC-D device has a unique physical channel identifier (PCHID)

      value.'
    severity: medium
- id: 7.4.2
  title: Ensure RoCE card redundancy settings are configured properly
  scoring: manual
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: When using channel-bonding over multiple RoCE NICs, it is recommended that each PCI function ID (FID) belongs
    to a different support partition on the CEC.
  rationale: If the support partition is shared between PCI FIDs in the same bond, and that support partition becomes unavailable
    (for example, by an upgrade procedure), the whole channel bond becomes unavailable.
  impact: ''
  references: []
  page_start: 525
  audit_raw: 'Enter the following command:

    cat /sys/bus/pci/devices/<addr>/pfip/segment0

    Make sure that the value for the PCI support partition

    is different for all RoCE devices.'
  remediation: 'Support partitions for PCI FIDs can only be configured via changes in the IOCDS data

    set.'
  checks:
  - type: command
    command: cat /sys/bus/pci/devices/<addr>/pfip/segment0
    expected: ''
    severity: medium
    info: 'Enter the following command:

      cat /sys/bus/pci/devices/<addr>/pfip/segment0

      Make sure that the value for the PCI support partition

      is different for all RoCE devices.'
