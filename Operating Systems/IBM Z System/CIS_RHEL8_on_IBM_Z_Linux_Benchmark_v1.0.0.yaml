- id: 3.1.1
  title: Ensure IP forwarding is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The net.ipv4.ip_forward and net.ipv6.conf.all.forwarding flags are used to tell the system whether it can forward
    packets or not. Setting these flags to 0 ensures that a system is not allowed to forward packets. You can specify this
    TCP/IP stack setting either in the file /etc/sysctl.conf, or in some other control file in directory /etc/sysctl.d. Or
    you can just use the default (ip_forward = 0) to not allow forwading of packets.
  rationale: Setting the flags to 0 ensures that a system with multiple interfaces (for example, a hard proxy), will never
    be able to forward packets, and therefore, never serve as a router.
  impact: ''
  references: []
  page_start: 191
  audit_raw: 'Run the following command and verify output matches:

    # sysctl net.ipv4.ip_forward

    net.ipv4.ip_forward = 0

    # grep -E -s "^\s*net\.ipv4\.ip_forward\s*=\s*1" /etc/sysctl.conf

    /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf

    No value should be returned

    # sysctl net.ipv6.conf.all.forwarding

    net.ipv6.conf.all.forwarding = 0

    # grep -E -s "^\s*net\.ipv6\.conf\.all\.forwarding\s*=\s*1" /etc/sysctl.conf

    /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf

    No value should be returned'
  remediation: 'Run the following commands to restore the default parameters and set the active kernel

    parameters:

    # grep -Els "^\s*net\.ipv4\.ip_forward\s*=\s*1" /etc/sysctl.conf

    /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf | while

    read filename; do sed -ri "s/^\s*(net\.ipv4\.ip_forward\s*)(=)(\s*\S+\b).*$/#

    *REMOVED* \1/" $filename; done; sysctl -w net.ipv4.ip_forward=0; sysctl -w

    net.ipv4.route.flush=1

    # grep -Els "^\s*net\.ipv6\.conf\.all\.forwarding\s*=\s*1" /etc/sysctl.conf

    /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf | while

    read filename; do sed -ri

    "s/^\s*(net\.ipv6\.conf\.all\.forwarding\s*)(=)(\s*\S+\b).*$/# *REMOVED* \1/"

    $filename; done; sysctl -w net.ipv6.conf.all.forwarding=0; sysctl -w

    net.ipv6.route.flush=1'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output matches:

      # sysctl net.ipv4.ip_forward

      net.ipv4.ip_forward = 0

      # grep -E -s "^\s*net\.ipv4\.ip_forward\s*=\s*1" /etc/sysctl.conf

      /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf

      No value should be returned

      # sysctl net.ipv6.conf.all.forwarding

      net.ipv6.conf.all.forwarding = 0

      # grep -E -s "^\s*net\.ipv6\.conf\.all\.forwarding\s*=\s*1" /etc/sysctl.conf

      /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf

      No value should be'
    severity: medium
