- id: '1.10'
  title: Ensure system-wide crypto policy is not legacy
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The system-wide crypto-policies followed by the crypto core components allow consistently deprecating and disabling
    algorithms system-wide. The individual policy levels (DEFAULT, LEGACY, FUTURE, and FIPS) are included in the crypto-policies(7)
    package.
  rationale: If the Legacy system-wide crypto policy is selected, it includes support for TLS 1.0, TLS 1.1, and SSH2 protocols
    or later. The algorithms DSA, 3DES, and RC4 are allowed, while RSA and Diffie-Hellman parameters are accepted if larger
    than 1023-bits. These legacy protocols and algorithms can make the system vulnerable to attacks, including those listed
    in RFC 7457
  impact: The default system-wide cryptographic policy in Oracle Linux 8 does not allow communication using older, insecure
    protocols. For environments that require to be compatible with Oracle Linux 5 and in some cases also with earlier releases,
    the less secure LEGACY policy level is available.
  references:
  - 1. CRYPTO-POLICIES(7)
  - 2. https://access.redhat.com/articles/3642912#what-polices-are-provided-1
  page_start: 129
  audit_raw: 'Run the following command to verify that the system-wide crypto policy is not LEGACY

    # grep -E -i ''^\s*LEGACY\s*(\s+#.*)?$'' /etc/crypto-policies/config

    Verify that no lines are returned'
  remediation: 'Run the following command to change the system-wide crypto policy

    # update-crypto-policies --set <CRYPTO POLICY>

    Example:

    # update-crypto-policies --set DEFAULT

    Run the following to make the updated system-wide crypto policy active

    # update-crypto-policies'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that the system-wide crypto policy is not LEGACY

      # grep -E -i ''^\s*LEGACY\s*(\s+#.*)?$'' /etc/crypto-policies/config

      Verify that no lines are returned'
    severity: medium
- id: '1.11'
  title: Ensure system-wide crypto policy is FUTURE or FIPS
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The system-wide crypto-policies followed by the crypto core components allow consistently deprecating and disabling
    algorithms system-wide. The individual policy levels (DEFAULT, LEGACY, FUTURE, and FIPS) are included in the crypto-policies(7)
    package.
  rationale: 'If the Legacy system-wide crypto policy is selected, it includes support for TLS 1.0, TLS 1.1, and SSH2 protocols
    or later. The algorithms DSA, 3DES, and RC4 are allowed, while RSA and Diffie-Hellman parameters are accepted if larger
    than 1023-bits. These legacy protocols and algorithms can make the system vulnerable to attacks, including those listed
    in RFC 7457 FUTURE: Is a conservative security level that is believed to withstand any near-term future attacks. This
    level does not allow the use of SHA-1 in signature algorithms. The RSA and Diffie-Hellman parameters are accepted if larger
    than 3071 bits. The level provides at least 128-bit security FIPS: Conforms to the FIPS 140-2 requirements. This policy
    is used internally by the fips-mode-setup(8) tool which can switch the system into the FIPS 140-2 compliance mode. The
    level provides at least 112-bit security'
  impact: The system-wide cryptographic policy in Red Hat Enterprise Linux 8 does not allow communication using older, insecure
    protocols. For environments that require to be compatible with Oracle Linux 5 and in some cases also with earlier releases,
    the less secure LEGACY policy level is available.
  references:
  - 1. CRYPTO-POLICIES(7)
  - 2. https://access.redhat.com/articles/3642912#what-polices-are-provided-1
  page_start: 131
  audit_raw: 'Run the following command to verify that the system-wide crypto policy is Future or

    FIPS

    # grep -E -i ''^\s*(FUTURE|FIPS)\s*(\s+#.*)?$'' /etc/crypto-policies/config

    Verify that either FUTURE or FIPS is returned'
  remediation: 'Run the following command to change the system-wide crypto policy

    # update-crypto-policies --set FUTURE

    OR

    To switch the system to FIPS mode, run the following command:

    # fips-mode-setup --enable'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that the system-wide crypto policy is Future or

      FIPS

      # grep -E -i ''^\s*(FUTURE|FIPS)\s*(\s+#.*)?$'' /etc/crypto-policies/config

      Verify that either FUTURE or FIPS is returned'
    severity: medium
