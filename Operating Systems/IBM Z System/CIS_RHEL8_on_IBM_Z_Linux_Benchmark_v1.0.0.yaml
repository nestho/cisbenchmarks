      cat $file | egrep -v '^sync:.:/bin/sync\\s$|^halt:.:/sbin/halt\\s$|^shutdown:.\n :/sbin/shutdown\\s$' |\nwhile read\
      \ ENTRY\ndo\nSHELL=$(echo $ENTRY | awk -F: '{printf $7\"\\n"
