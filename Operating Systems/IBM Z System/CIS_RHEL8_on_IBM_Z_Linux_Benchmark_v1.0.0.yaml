    read filename; do sed -ri

    "s/^\s*(net\.ipv4\.tcp_syncookies\s*)(=)(\s*\S+\b).*$/# *REMOVED* \1/"

    $filename; done; sysctl -w net.ipv4.tcp_syncookies=1; sysctl -w

    net.ipv4.route.flush=1'
