- id: 8.3.1
  title: Ensure that the JESJOBS resource class is configured
  scoring: manual
  profile:
  - Level 1
  description: 'The JESJOBS class controls access to job level resources. The high-level qualifier for entities in this class
    are used to specify which functions are being controlled. When defining resources in the JESJOBS class, avoid generic
    high-level qualifiers such as ''*'' as these could have impacts beyond the original intended purpose (especially as new
    resources are added to the class). Note: If you created such profiles (ex. ''*'') on a system earlier than z/OS V2R1,
    the profiles only affected the ability of users to CANCEL or SUBMIT jobs. But on a z/OS V2R1 system, those profiles might
    have the unintended effect of allowing users to use the Job Modify SSI functions to modify the attributes of a job.'
  rationale: The JESJOBS class is used to control actions against jobs and the ability to access job related data. These types
    of actions and access should be restricted to appropriate personnel. Actions could be performed by unauthorized personnel
    that would disrupt normal processing.
