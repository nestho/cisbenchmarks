- id: 2.1.7
  title: Ensure that the TEMPDSN class is active
  scoring: scored
  profile:
  - Level 1
  description: The TEMPDSN class provides protection for temporary data sets if these data sets are not deleted by the job
    or session which created them. These values become effective immediately after the command SETROPTS CLASSACT(TEMPDSN)
    is issued.
  rationale: 'You can protect temporary data sets. Normally, these data sets are considered protected from any accesses except
    by the job or session that created them, and therefore do not need to be protected by RACF. However, the following situations
    could leave a temporary data set unprotected: • A system failure • An initiator failure or initiator termination by the
    FORCE command • An automatic restart - between the failure and the restart In these cases, if the TEMPDSN class is active,
    only users with the OPERATIONS attribute or users authorized to specific DFSMSdss functions can scratch any residual temporary
    data sets remaining on a volume.'
  impact: ''
