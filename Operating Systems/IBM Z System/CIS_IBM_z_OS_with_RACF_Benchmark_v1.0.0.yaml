- id: 2.1.8
  title: Ensure that access to RACF database data sets is controlled
  scoring: scored
  profile:
  - Level 1
  description: 'RACF database files contain all access control information for the operating system environment and system
    resources as well as user registry, user permissions and user authentication data (including encrypted passwords and passphrases),
    private X.509 certificate keys, and more. It is important that the data sets containing the primary and backup databases
    are properly protected. You should also ensure that data sets containing RACF database information, such as backup copies
    and unloaded versions of the RACF database, are also protected. In protecting these data sets, you should ensure that
    only those users who have a definite job-related need to read or update the data have access. Any other users should not
    have access to the data sets containing your RACF databases. Note: The RACF IRRUT200 and IRRUT400 utilities create exact
    copies of the RACF database, and are often used to create point-in-time copies as part of a backup strategy. It is critical
    to ensure these copies are secured and logged in the same manner as the active RACF databases.'
  rationale: An unsecured RACF database poses significant risks, including unauthorized access to sensitive data, system compromise,
    and potential operational disruption, due to the comprehensive access control information it stores. Consequences of unauthorized
    access can include but are not limited to data theft, manipulation, system outages, and reputational damage.
  impact: It is critical to ensure that direct access to RACF database files is restricted to the minimum number of users
    and all access is logged. Failure to do so can undermine the IBM z/OS System Integrity Statement for all systems secured
    by the affected RACF database.
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000370'
