- id: 1.3.1
  title: Ensure that the use of RACF SPECIAL attribute is justified
  scoring: manual
  profile:
  - Level 1
  description: The SPECIAL user attribute allows full authorization to modify all profiles in RACF database and allows the
    user to perform all RACF functions, except those requiring AUDITOR or ROAUDIT attributes. The group-SPECIAL attribute
    allows decentralized RACF control of datasets and resources. In cases where the scope of authority granted to a group-SPECIAL
    Administrator has an impact on system security, the installation needs to be fully aware and approve its use. This privilege
    should be limited to the security group and administrators because of the extreme control that these users have.
  rationale: Users with SPECIAL privilege can alter any profile and give themselves permissions to alter data, including logging
    and audit data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000720'
