- id: 8.4.1
  title: Ensure that data sets on SPOOL are encrypted
  scoring: manual
  profile:
  - Level 1
  description: 'One way to encrypt data sets on SPOOL is to associate a KeyLabel with a JESJOBS resource with a high-level
    qualifier of ENCRYPT. This profile is not used to protect or audit use of KeyLabels, just to specify what KeyLabel is
    associated with a SYSOUT or instream data set. Note: ENCRYPT resources are used to specify a KeyLabel to use to encrypt
    data and are not used to control or audit access.'
  rationale: Encrypting data sets on SPOOL provides an extra level of security for the data. Access to the data requires both
    access via the JESSPOOL class and access to the key label used to encrypt the data. It also limits the exposure to inadvertent
    access to SPOOL buffers.
  impact: ''
  references: []
