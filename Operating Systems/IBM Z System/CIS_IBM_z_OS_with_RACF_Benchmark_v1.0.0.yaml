- id: '5.1'
  title: Ensure that DFSMS is configured
  scoring: manual
  profile:
  - Level 1
  description: Configuration properties of DFSMS are specified in various members of the system parmlib concatenation (e.g.,
    SYS1.PARMLIB). Statements within these PDS members provide the execution, operational, and configuration characteristics
    of the systemmanaged storage environment. In the IGDSMSxx member, SMS parameter settings are specified.
  rationale: Missing or inappropriate configuration values may result in undesirable operations and degraded security. This
    exposure could potentially compromise the availability and integrity of some system services and customer data.
  impact: ''
