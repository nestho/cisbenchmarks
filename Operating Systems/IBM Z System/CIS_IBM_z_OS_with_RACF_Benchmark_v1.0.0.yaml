  remediation: "To activate RACF classes use the RACF SETROPTS command:\nSETROPTS CLASSACT(FACILITY)\nSETROPTS CLASSACT(OPERCMDS)\n\
    To enable generic profile checking for a RACF class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(FACILITY)\nSETROPTS\
    \ GENERIC(OPERCMDS)\nTo RACLIST a RACF class use the RACF SETROPTS command:\nSETROPTS RACLIST(FACILITY)\nSETROPTS RACLIST(OPERCMDS)\n\
    To create a DATASET profile use the RACF ADDSD and PERMIT commands:\nADDSD '<profile>' GENERIC +\n UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ))\
    \ +\n DATA('APF LIBRARY')\nPERMIT '<profile>' GENERIC +\n ACCESS(READ) ID(*)\nPERMIT '<profile>' GENERIC +\n ACCESS(ALTER)\
    \ ID(SYSPROG)\nSETROPTS REFRESH GENERIC(DATASET)\nTo create a FACILITY or OPERCMDS profile use the RACF RDEFINE, PERMIT,\
    \ and\nSETROPTS commands:\nRDEFINE FACILITY BPX.FILEATTR.APF +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('ACCESS TO SET\
    \ APF AUTHORIZATION ON UNIX FILE')\nPERMIT BPX.FILEATTR.APF CLASS(FACILITY) +\n ACCESS(READ) ID(SYSPROG)\nSETROPTS REFRESH\
    \ RACLIST(FACILITY)\nRDEFINE OPERCMDS MVS.SETPROG +\n UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n DATA('SETPROG\
    \ COMMAND')\nPERMIT MVS.SETPROG CLASS(OPERCMDS) +\n ACCESS(UPDATE) ID(SYSPROG)\nRDEFINE OPERCMDS MVS.SET.PROG +\n UACC(NONE)\
    \ +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n DATA('SET PROG=(XX) COMMAND')\nPERMIT MVS.SET.PROG CLASS(OPERCMDS) +\n\
    \ ACCESS(UPDATE) ID(SYSPROG)\nSETROPTS REFRESH RACLIST(OPERCMDS)\nTo modify the UACC, WARN, or AUDIT settings for a DATASET\
    \ profile use the RACF\nALTDSD command:\nALTDSD '<profile>' GENERIC +\n UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ))\
    \ +\n NOWARNING\nSETROPTS REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN, or AUDIT settings for a general resource\
    \ profile use the\nRACF RALTER and SETROPTS commands:\nRALTER FACILITY BPX.FILEATTR.APF +\n UACC(NONE) +\n AUDIT(ALL(READ))\
