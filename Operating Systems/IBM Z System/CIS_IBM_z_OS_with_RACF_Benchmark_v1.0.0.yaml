- id: '9.18'
  title: Ensure that the BPXROOT user account is configured with compliant values
  scoring: manual
  profile:
  - Level 1
  description: The z/OS UNIX System Services function setuid can be used to change the UID of the process. When the UID requested
    is UID=0, the user set as SUPERUSER in BPXPRMxx is used. The default user is BPXROOT.
  rationale: The BPXROOT user must be defined with the correct attributes so the setuid function can be securely used. If
    these attributes are not correctly defined, data access or command privilege controls could be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000230'
  page_start: 663
  audit_raw: 'Request a list of BPXROOT user ID values for the SUPERUSER statement in BPXPRMxx

    members.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that the RACF user ID defined as BPXROOT in a SUPERUSER statement:

    • Has the PROTECTED attribute

    • Does not appear on any RACF data set or general resource access list

    • Does not have any segments beyond base and OMVS

    • Does not have any extra system or group privileges (ex. ROAUDIT, CLAUTH,

    group-JOIN, etc.)

    • Has the following OMVS segment values:

    o UID value of 0

    o HOME value of /

    o PROGRAM value of /bin/sh

    • Does not have access to the BPX.DAEMON resource secured by the FACILITY

    class.'
  remediation: "To create a compliant BPXROOT user ID use the RACF ADDGROUP, ADDUSER, and\nCONNECT commands:\nADDUSER BPXROOT\
    \ +\n OWNER(OMVSGRP) +\n DFLTGRP(OMVSGRP) +\n NOPASSWORD +\n DATA('USER IS DEFINED AS SUPERUSER IN BPXPRMXX') +\n OMVS(\
    \ +\n UID(0) SHARED +\n HOME('/') +\n PROGRAM('/bin/sh') +\n )\nCONNECT OMVSKERN +\n GROUP(OMVSGRP) +\n OWNER(OMVSGRP)\n\
    Note: The HOME and PROGRAM values are case sensitive.\nTo remove a non-compliant access list entries use the RACF PERMIT\
    \ command:\nPERMIT BPX.DAEMON CLASS(FACILITY) +\n DELETE ID(BPXROOT)\nSETROPTS RACFLIST GENERIC(FACILITY)"
  checks:
  - type: manual_review
    info: 'Request a list of BPXROOT user ID values for the SUPERUSER statement in BPXPRMxx

