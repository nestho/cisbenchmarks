    \ command:\nALTDSD '<jes-dataset>' GENERIC +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nSETROPTS REFRESH GENERIC(DATASET)\n\
    To remove a non-compliant access list entries use the RACF PERMIT command:\nPERMIT '<jes-dataset>' GENERIC +\n DELETE\
    \ ID(<non-compliant>)\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant GAC entry you need to use both RACF\
