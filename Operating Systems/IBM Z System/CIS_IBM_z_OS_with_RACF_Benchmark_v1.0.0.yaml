- id: '9.5'
  title: Ensure that newly assigned UID and GID are unique values
  scoring: scored
  profile:
  - Level 1
  description: When users and groups share UID and GID respectively, they are essentially the same entity to the UNIX kernel.
  rationale: Sharing IDs can result in unintended file access and a loss of accountability. Reverse mapping to a user ID or
    group name does not yield a consistent or predictable result (with the exception of UID(0)) which can lead to confusion
    in displays such as the output of an ls command. The only value that should ever be shared is UID(0), which is often required
    by different daemons and servers.
  impact: Administrators will need to know that the SHARED keyword must be specified when assigning a value, such as UID(0),
    that is already in use. They will require READ access to SHARED.IDS in order to do so.
  references: []
