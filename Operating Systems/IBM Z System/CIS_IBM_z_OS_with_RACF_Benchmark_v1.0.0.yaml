- id: 8.3.11
  title: Ensure that access to JESJOBS SPIN resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a SPIN high-level qualifier in the JESJOBS resource class control the use of the spin function
    of the job modify SSI 85. Spinning a job caused all SPIN output of a job to be made available for immediate processing
    (rather than waiting for the job to end). SPIN output could include logs associated with the running job. Processing could
    include purging of the data sets that were spun.
  rationale: Failure to properly control access to spinning jobs could result in unauthorized personnel making data available
    for processing (or purging) before the job completes.
  impact: ''
  references: []
  page_start: 564
  audit_raw: 'Issue the following TSO command:

