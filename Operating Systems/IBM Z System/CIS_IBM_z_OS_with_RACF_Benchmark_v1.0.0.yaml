- id: 8.7.2
  title: Ensure that RJE workstations have paired user IDs
  scoring: manual
  profile:
  - Level 1
  description: JES2 RJE workstations and NJE nodes provide a method of sending and receiving data (e.g. jobs, job output,
    and commands) from remote locations. Failure to properly identify and control these remote facilities could result in
    unauthorized sources transmitting data to and from the operating system.
  rationale: This exposure may threaten the integrity and availability of the operating system environment and compromise
    the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000120'
  page_start: 609
  audit_raw: 'This guidance addresses RJE Workstations that are "Dedicated". If an RJE workstation

    is dedicated, the assumption is that the RJE to host connection is hard-wired between

    the RJE and host. In this case the RMT definition statement will contain the keyword

    LINE= which specifies that this RJE is only connected via that one LINE statement.

    Request a list of RMT<nnnn> entries that are "dedicated".

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that any "dedicated" RMT<nnnn> entry has matching RACF USER ID that:

    • Has the RESTRICTED attribute

    • Has the UAUDIT attribute

    • Does not have any segments beyond base (ex. no OMVS segment)

    • Does not have any extra system or group privileges (ex. ROAUDIT, CLAUTH,

    group-JOIN, etc.)

    • Has READ access to a fully qualified RMT<nnnn> profile in the JESINPUT class'
  remediation: "To create user IDs for \"dedicated\" RMT<nnnn> entries use the RACF ADDGROUP,\nADDUSER, and CONNECT commands:\n\
    ADDGROUP RMTGRP +\n OWNER(<group>) +\n SUPGROUP(<group>) +\n DATA('DEFAULT DEDICATED RJE WORKSTATION ID OWNING GROUP')\n\
    ADDUSER RMT<nnnn> +\n OWNER(RMTGRP) +\n DFLTGRP(RMTGRP) +\n RESTRICTED +\n UAUDIT +\n DATA('DEDICATED RJE WORKSTATION\
    \ ID')\nCONNECT RMT<nnnn> +\n GROUP(RMTGRP) +\n OWNER(RMTGRP)\nTo create a paired profiles in the JESINPUT class use the\
    \ RACF RDEFINE and PERMIT\ncommands:\nRDEFINE JESINPUT RMT<nnnn> +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('DEDICATED\
    \ RJE WORKSTATION')\nPERMIT JESINPUT RMT<nnnn> +\n ACCESS(READ) ID(RMT<nnnn>)"
  checks:
  - type: manual_review
    info: 'This guidance addresses RJE Workstations that are "Dedicated". If an RJE workstation

      is dedicated, the assumption is that the RJE to host connection is hard-wired between

      the RJE and host. In this case the RMT definition statement will contain the keyword

      LINE= which specifies that this RJE is only connected via that one LINE statement.

      Request a list of RMT<nnnn> entries that are "dedicated".

      Request reports generated using IRRDBU00 output that will allow you to:

      Verify that any "dedicated" RMT'
    severity: medium
- id: 8.8.1
  title: Ensure that the SETROPTS JES(BATCHALLRACF) is enabled
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS BATCHALLRACF specifies that JES is to test for the presence of a user ID and password on the job statement
    or for propagated RACF identification information for all batch jobs. The system-wide option controls the default settings
    for determining how RACF will function when handling requests for access to the operating system environment, RACF, and
    customer data.
  rationale: For proper logging and verification of batch job, all jobs must have a validated user ID. Failure to set this
    option will allow jobs to run on the system without being identified and verified by RACF.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000440'
  page_start: 613
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the following message appears:

    JES-BATCHALLRACF OPTION IS ACTIVE

    Alternatively, if IBM Health Checker for z/OS is installed and active, you can request

    the HZSPRINT output for:

    CHECK(IBMRACF,RACF_BATCHALLRACF)

    Verify that the message returned is:

    IRRH331E SETROPTS JES(BATCHALLRACF) is in effect.'
  remediation: 'To modify the JES parameter use the RACF SETROPTS command:

    SETROPTS JES(BATCHALLRACF)'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Verify the following message appears:

      JES-BATCHALLRACF OPTION IS ACTIVE

      Alternatively, if IBM Health Checker for z/OS is installed and active, you can request

      the HZSPRINT output for:

      CHECK(IBMRACF,RACF_BATCHALLRACF)

      Verify that the message returned is:

      IRRH331E SETROPTS JES(BATCHALLRACF) is in effect.'
    severity: medium
- id: 8.8.2
  title: Ensure that the SETROPTS JES(XBMALLRACF) is enabled
  scoring: scored
  profile:
  - Level 1
  description: 'XBM (Execution Batch Monitor) is a function that allows jobs to be submitted that only provide instream data
    to a pre-defined JCL PROC. The classic use of this is to perform student compiles in an educational environment. Even
    though the JCL PROC is predefined, proper auditing of what the JCL is accessing requires that a RACF identify exists for
    all jobs. XBM is configured by specifying a value for XBM= on a JOBCLASS statement. Use the command $DJOBCLASS(*),XBM!=,XBM
    to determine if XBM is in use. SETROPTS XBMALLRACF ensures that (assuming you have JES configured to support XBM jobs)
    any XBM job submitted by a user must have a RACF identity or the job will fail. Note: This is used only in JES2.'
  rationale: Failure to set XBMALLRACF will allow XBM jobs run on a system without a proper RACF identity.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000440'
  page_start: 615
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the following message appears:

    JES-XBMALLRACF OPTION IS ACTIVE'
  remediation: 'To modify the JES parameter use the RACF SETROPTS command:

    SETROPTS JES(XBMALLRACF)'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Verify the following message appears:

      JES-XBMALLRACF OPTION IS ACTIVE'
    severity: medium
- id: '9.1'
  title: Ensure that access to z/OS UNIX SURROGAT resources is controlled
  scoring: scored
  profile:
  - Level 1
  description: Resources in the SURROGAT class that start with BPX.SRV protect the ability to switch to another identity without
    providing an authenticator. Servers do this programmatically to run under the identity of their clients, and users can
    issue the shell su command to switch to another identity. These are sensitive functions that must be protected and logged,
    and must be used only by servers, not humans.
  rationale: Improper protection of BPX.SRV SURROGAT resources can result in unintended privilege escalation and loss of accountability.
  impact: ''
