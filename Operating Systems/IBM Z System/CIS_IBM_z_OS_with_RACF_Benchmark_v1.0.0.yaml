  title: Ensure UNIX permission and user audit bits for FTP server are configured
  scoring: manual
  profile:
  - Level 1
  description: The FTP Server daemon uses privileged functions and accesses sensitive data. The files and directories the
    FTP daemon relies upon for its configuration, runtime environment and operation must be properly protected from unauthorized
    modifications or retrieval to ensure system integrity and privacy of sensitive data.
  rationale: Failure to properly secure these objects may lead to unauthorized access resulting in the compromise of the integrity
    and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-FT-000020'
  page_start: 368
  audit_raw: 'Verify that the permission bits and user audit bits for FTP server UNIX files match or

    are more restrictive than the specified settings listed in the table:

    File Permission Bits User Audit Bits

    /usr/sbin/ftpd 740 fff

    /usr/sbin/ftpdns 755 fff

    /etc/ftp.data 744 faf

    Notes:

    • Some of the files listed above may not be used in every

    configuration. While the absence of a file is generally not a security

    issue, the existence of a file that has not been properly secured can

    often be an issue. Therefore, all files that do exist should have the

    specified permission and audit bit settings

    • The /usr/sbin/ftpd and /usr/sbin/ftpdns objects are

    symbolic links to /usr/lpp/tcpip/sbin/ftpd and

    /usr/lpp/tcpip/sbin/ftpdns respectively. The permission and

    user audit bits on the targets of the symbolic links must have the

    required settings.'
  remediation: 'To modify the audit flags for a UNIX file use the chaudit command:

    chaudit rwx=f /usr/lpp/tcpip/sbin/ftpd

    chaudit rwx=f /usr/lpp/tcpip/sbin/ftpdns

    chaudit w=sf,rx+f /etc/ftp.data

    To modify the access permissions for a UNIX file use the chmod command:

    chmod 740 /usr/lpp/tcpip/sbin/ftpd

    chmod 755 /usr/lpp/tcpip/sbin/ftpdns

    chmod 744 /etc/ftp.data'
  checks:
