- id: 6.6.2
  title: Ensure VTAM session setup controls for the TN3270E telnet server are configured
  scoring: manual
  profile:
  - Level 1
  description: After a connection from a Telnet client to the TN3270E Telnet Server has been established, the process of session
    setup with a VTAM application occurs. A number of BEGINVTAM statements must be coded in a specific configuration to ensure
    adequate control to VTAM applications is maintained. The appropriate statements must be coded to ensure adequate security
    of the established SNA sessions.
  rationale: Failure to code the appropriate statements could result in unauthorized access to the host and application resources.
    This exposure may impact data integrity or the availability of some system services.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-TN-000050'
  page_start: 429
  audit_raw: 'Request a copy of all JESJCL of all active site TN3270E started tasks.

    Note: If a TN3270E started task is inactive, review the procedure libraries

    defined to JES2 and locate the TN3270E JCL member.

    Verify that the following parameters are coded in TN3270E configuration files specified

    by PROFILE DD statements:

    1. Within each BEGINVTAM statement block, one BEGINVTAM USSTCP statement is

    coded that specifies only the table name operand. No client identifier, such as

    host name or IP address, is specified so the statement applies to all connections

    not otherwise controlled.

    2. The Unformatted System Services (USS) table specified on each "backstop"

    USSTCP statement mentioned in Item (1) above is coded to allow access only to

    session manager applications and NC-PASS applications.

    3. Within each BEGINVTAM statement block, additional BEGINVTAM USSTCP

    statements that specify an Unformatted System Services (USS) table that allows

    access to other applications may be coded only if the statements include a client

    identifier operand that references only secure terminals.

    4. Any BEGINVTAM DEFAULTAPPL statement that does not specify a client identifier

    or specifies any type of client identifier that would apply to unsecured terminals,

    specifies a session manager application or an NC-PASS application as the

    application name.

    5. Any BEGINVTAM LUMAP statement, if used with the DEFAPPL operand and applied

    to unsecured terminals, specifies only a session manager application or an NCPASS application.

    Notes:

    • If the INCLUDE statement is coded in the Telnet profile, the data set

    specified on this statement must be checked for the following items

    as well.

