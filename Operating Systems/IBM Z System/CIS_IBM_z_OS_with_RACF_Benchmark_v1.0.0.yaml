- id: 7.3.5
  title: Ensure ICSF key store policy controls are enabled
  scoring: manual
  profile:
  - Level 1
  description: ICSF Key Store Policy governs the use of key tokens in callable services. A key token is just a control block
    of key material that can be passed directly as an input parameter to an ICSF callable service - as opposed to specifying
    the label of a key stored in an ICSF Key Data Set. The Key Store Policy settings control how permission to use a key token
    is performed.
  rationale: The ICSF Key Store Policy controls make it possible to provide protection profiles to key tokens in addition
    to key labels.
  impact: ''
  references: []
  page_start: 488
  audit_raw: 'Request reports generated using IRRDBU00 output that will allow you to:

    Verify the following fully qualified profiles are defined in the XFACILIT class:

    • CSF.CKDS.TOKEN.CHECK.LABEL.FAIL

    • CSF.PKDS.TOKEN.CHECK.LABEL.FAIL'
  remediation: "To create general resource profiles use the RACF RDEFINE command:\nRDEFINE XFACILIT CSF.CKDS.TOKEN.CHECK.LABEL.FAIL\
    \ +\n DATA('ACTIVATES ICSF KEY STORE POLICY FOR CKDS IN FAIL MODE')\nRDEFINE XFACILIT CSF.PKDS.TOKEN.CHECK.LABEL.FAIL\
    \ +\n DATA('ACTIVATES ICSF KEY STORE POLICY FOR PKDS IN FAIL MODE')\nNote: Depending on the RACF class settings you may\
    \ be required to\nissue a RACF SETROPTS REFRESH command for updates to be effective."
