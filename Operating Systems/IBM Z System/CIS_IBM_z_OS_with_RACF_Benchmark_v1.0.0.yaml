  title: Ensure that access to all APF-authorized objects is controlled
  scoring: manual
  profile:
  - Level 1
  description: The Authorized Program List (APF) designates those libraries that can contain program modules which possess
    a significant level of security bypass capability. The extattr command can grant the same capability in the UNIX file
    system, and is secured by the BPX.FILEATTR.APF resource in the FACILITY class.
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
  impact: ''
