- id: 6.1.2
  title: Ensure that the STARTED resource class is used to assign user IDs to CSSMTP started tasks
  scoring: scored
  profile:
  - Level 1
  description: Started procedures have system generated job statements that do not contain the user, group, or password statements.
    To enable the started procedure to access the same protected resources that users and groups access, started procedures
    must have an associated user ID. If a user ID is not associated with the started procedure, the started procedure will
    not have access to the resources. User ID can be assigned through the RACF STARTED class or through the ICHRIN03 table.
    As it is easily auditable, does not require assembler knowledge or a system IPL for changes, we require the usage of the
    RACF STARTED class.
  rationale: If a user ID is not associated with the started procedure, the started procedure will not have access to the
    resources. By default started procedures should be assigned a user ID with limited privileges to prevent otherwise undefined
    tasks from getting unintentional access to resources secured by RACF.
  impact: ''
