- id: 6.5.4
  title: Ensure TCP/IP stack configuration defined in PROFILE.TCPIP meets minimum requirements
  scoring: manual
  profile:
  - Level 1
  description: The PROFILE.TCPIP configuration file provides system operation and configuration parameters for the TCP/IP
    stack. Inappropriate values could result in undesirable operations and degraded security. z/OS UNIX directories and files
    of the Base TCP/IP component provide the configuration, operational, and executable properties of IBM's TCP/IP system
    product.
  rationale: This exposure may result in unauthorized access impacting data integrity or the availability of some system services.
    Failure to properly secure these objects may lead to unauthorized access resulting in the compromise of the integrity
    and availability of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-TC-000010'
  - '1. IBM z/OS RACF STIG: RACF-TC-000030'
  page_start: 406
  audit_raw: 'This exposure may result in unauthorized access impacting data integrity or the

    availability of some system services.

    Audit Procedure

    Request a copy of all JESJCL of all active site TCP/IP stack started tasks.

    Note: If an TCP/IP stack is inactive, review the procedure libraries defined

    to JES2 and locate the FTP JCL member.

    Verify that the following parameters in PROFILE.TCPIP files specified by PROFILE DD

    statements:

    • The SMFPARMS statement is omitted or commented out.

    • The DELETE statement is omitted or commented out.

    • The SMFCONFIG statement is coded with (at least) the FTPCLIENT and

    TN3270CLIENT operands. In addition:

    o One or more of the ZERTDETAIL, ZERTSUMMARY and (for z/OS V2R5 and

    later) ZERTDETAILBYPOLICY operands are coded.

    ▪ Alternatively, one or more of the ZERTSERVICE, ZERTSUMMARY, and

    (for z/OS V2R5 and later) ZERTSERVICEBYPOLICY operands may

    be coded on the NETMONITOR statement if a network monitoring

    product is in use.

    o The TCPSTACK operand is coded.

    o The PROFILE and DVIPA operands are coded.

    ▪ Alternatively PROFILE and SMFSERVICE DVIPA may be coded on the

    NETMONITOR statement if a network monitoring product is in use.

    o If the IPsec protocol is used to protect any z/OS traffic, then IPSECURITY

    must be coded.

    ▪ Alternatively, SMFSERVICE IPSECURITY may be coded on the

    NETMONITOR statement if a network monitoring product is in use.

    o e. If SMC-D is in use the SMCDLINKEVENT operand must be coded.

    o If SMC-R is in use the SMCRLINKEVENT operand must be coded.

    o If CSSMTP is in use the NETMONITOR statement must be coded with the

    SMFSERVICE CSMAIL CSSMTP operands.

    • The TCPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS and

    TTLS operands.

    o If the FINWAIT2TIME operand is coded, it must have a value of 60 or less.

    • The UDPCONFIG statement is coded with (at least) the RESTRICTLOWPORTS

    operand. In addition, the NOUDPCHKSUM and NOUDPQUEUELIMIT operands must be

    omitted or commented out.

    • The IPCONFIG statement is coded with (at least) the NODATAGRAMFWD and

    IGNOREREDIRECT operands.

    o In some cases, there will be a legitimate reason for having DATAGRAMFWD

    coded, and the site must be able to provide proof of approval as well as

    any documented justification.

    • The GLOBALCONFIG statement is coded with (at least) the ZERT operand.

    • The SACONFIG statement is coded with (at least) a community name other than

    public.

    o In addition, the SETENABLED operand must be omitted or commented out.

    Note: If the INCLUDE statement is coded in the TCP/IP Profile

    configuration file, the data set specified on this statement must be

    checked as well.

    Verify that the permission bits and user audit bits for base TCP/IP components files

    match or are more restrictive than the specified settings listed in the table:

    File Permission Bits User Audit Bits

    /etc/hosts 744 faf

    /etc/protocol 744 faf

    /etc/resolv.conf 744 faf

    /etc/services 740 faf

    /usr/lpp/tcpip/bin 755 faf

    /usr/lpp/tcpip/sbin 755 faf

    Note: Some of the files listed above may not be used in every

    configuration.'
  remediation: 'The site will need to follow their standard change management process for updating

    PROFILE.TCPIP configuration files.

    To modify the audit flags for a UNIX file use the chaudit command:

    chaudit w=sf,rx+f /etc/hosts

    chaudit w=sf,rx+f /etc/protocol

    chaudit w=sf,rx+f /etc/resolv.conf

    chaudit w=sf,rx+f /etc/services

    chaudit w=sf,rx+f /usr/lpp/tcpip/bin

    chaudit w=sf,rx+f /usr/lpp/tcpip/sbin

    To modify the access permissions for a UNIX file use the chmod command:

    chmod 744 /etc/hosts

    chmod 744 /etc/protocol

    chmod 744 /etc/resolv.conf

    chmod 740 /etc/services

    chmod 755 /usr/lpp/tcpip/bin

    chmod 755 /usr/lpp/tcpip/sbin'
