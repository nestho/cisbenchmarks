    site FTP server started tasks.

    Verify that:.

    • The EXTENSIONS statement is coded with the AUTH_TLS value

    • The SECURE_CTRLCONN statement is coded with the PRIVATE value

    • The SECURE_DATACONN statement is coded with the PRIVATE or SAFE value

    • The SECURE_FTP statement is coded with the REQUIRED value

    • The TLSCERTCROSSCHECK statement is omitted or is commented out or is coded

    with the TRUE value

    • The TLSMECHANISM statement is coded with the ATTLS value

    • The TLSRFCLEVEL statement is coded with the RFC4217 value

    Note: if the z/OS version is V2R5 or higher the TLSMECHANISM statement

    may also be omitted or commented out.'
  remediation: 'The site will need to follow their standard change management process for updating

    FTP server configuration statements in FTP.DATA with compliant values.'
