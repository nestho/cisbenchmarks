    Verify that a CSFINPV2 profile in the PROGRAM class is defined and:

    • Is not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • Has a SIGVER segment with the following values:

    o FAILLOAD is ANYBAD

    o SIGAUDIT is ANYBAD

    o SIGREQUIRED is YES'
  remediation: "To create a PROGRAM profile use the RACF RDEFINE and PERMIT commands:\nRDEFINE PROGRAM CSFINPV2 +\n AUDIT(FAILURES(READ))\
    \ +\n ADDMEM('SYS1.SIEALNKE'//NOPADCHK) +\n SIGVER( +\n FAILLOAD(ANYBAD) +\n SIGAUDIT(ANYBAD) +\n SIGREQUIRED(YES) +\n\
    \ )\nSETROPTS REFRESH WHEN(PROGRAM)\nTo modify the AUDIT, WARN, or SIGVER segment settings for a general resource profile\n\
    use the RACF RALTER command:\nRALTER PROGRAM ICHDSM00 +\n AUDIT(FAILURES(READ)) +\n NOWARNING +\n SIGVER( +\n FAILLOAD(ANYBAD)\
    \ +\n SIGAUDIT(ANYBAD) +\n SIGREQUIRED(YES) +\n )\nSETROPTS REFRESH WHEN(PROGRAM)"
