- id: '9.15'
  title: Ensure that access to BPX resources in the FACILITY class is controlled
  scoring: scored
  profile:
  - Level 1
  description: The RACF FACILITY class profiles prefixed with BPX are protecting sensitive UNIX System Services capabilities
    and must be protected.
  rationale: z/OS UNIX RACF-defined resources, prefixed with BPX in the FACILITY class consist of sensitive capabilities including
    SUPERUSER, daemon, and numerous file manipulation privileges.
  impact: Missing or inaccurate protection of these resources could allow a user to access sensitive data, modify or delete
    data and operating system controls, or issue commands that could negatively impact system availability.
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000020'
  page_start: 654
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that FACILITY appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that FACILITY appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that FACILITY appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the FACILITY entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering

    BPX prefixed resources

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that a fully-qualified profile named BPX.SAFFASTPATH is not defined in the

    FACILITY class.

    Verify that a catch-all profile named BPX.** or BPX.* or BPX.*.** is defined in the

    FACILITY class that:

    • Has a UACC of NONE

    • Is not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    Verify that BPX prefixed profiles in the FACILITY class:

    • Have a UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher access is restricted to:

    o IDs authorized to access these resources at this level'
  remediation: "To activate the FACILITY class use the RACF SETROPTS command:\nSETROPTS CLASSACT(FACILITY)\nTo enable generic\
    \ profile checking for the FACILITY class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(FACILITY)\nTo RACLIST the\
    \ FACILITY class use the RACF SETROPTS command:\nSETROPTS RACLIST(FACILITY)\nTo remove a BPX.SAFFASTPATH profile use the\
    \ RACF RDELETE command:\nRDELETE FACILITY BPX.SAFFASTPATH\nTo create catch-all profiles use the RACF RDEFINE command:\n\
    RDEFINE FACILITY BPX.** +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('UNIX SYSTEM SERVICES CATCH-ALL PROFILE')\nSETROPTS\
    \ REFRESH RACLIST(FACILITY)\nTo modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER\ncommand:\n\
    RALTER FACILITY BPX.<qualifiers> +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nSETROPTS REFRESH RACLIST(FACILITY)\n\
    To remove a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\n\
    SETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access checking is not logged, so caution\nmust be used\
    \ when making changes to GAC entries.\nTo disable GAC for a class you will need to use both RACF RDELETE to remove the\n\
    associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH\
    \ GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that FACILITY appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that FACILITY appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that FACILITY appears.

      Request the following DSMON report:

      FUNCTION SYSTEM RACGAC

      Verify that the FACILITY entry has:

      • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering

      '
    severity: medium
- id: '9.16'
  title: Ensure that security parameters in /etc/profile are configured
  scoring: scored
  profile:
  - Level 1
  description: The /etc/profile file is the system-wide profile for the z/OS UNIX System Services shell users. It contains
    environment variables and commands used by most shell users. Some variables and commands in a secure system.
  rationale: When users are using UNIX System Services through a shell, we must ensure that specific variables are set and
    specific commands are issued.
  impact: If the variables are not set or the commands not executed, the system security can be compromised.
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000050'
