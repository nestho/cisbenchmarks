- id: 1.2.1
  title: Ensure that the SETROPTS INACTIVE value is set to a maximum of 45
  scoring: scored
  profile:
  - Level 1
  description: PASSWORD(INACTIVE(<nnn>)) command specifies the number of days (1 - 255) that a user ID can remain unused and
    still be considered valid. RACF user verification checks the number of days since the last successful time the user accessed
    the system against the INACTIVE value and, if the former is larger, revokes the user's right to use the system. INACTIVE
    does not apply to Protected user IDs. Protected user IDs are protected from being revoked through inactivity. If you specify
    INACTIVE, INITSTATS must be in effect. If the backup database is needed but does not contain current information, some
    user IDs can be revoked because they appear to have been unused beyond the number of days specified on the INACTIVE operand.
    NOINACTIVE specifies that RACF user verification is not to check user IDs against an unused-userid-interval. Inactive
    user IDs are to be revoked after a period of inactivity not to exceed 45 days.
  rationale: Inactive user IDs are vulnerable to attack because no one is watching these IDs. Revoking inactive user IDs reduces
    a potential compromise vector. We have chosen 45 days as our recommend threshold to align with CIS Critical Security Controls
    Version 8.
  impact: This setting could potentially disable accounts for personnel that are on leave. This should be taken into account
    and potentially a longer period configured if this impacts local site personnel.
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000760'
  page_start: 49
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ATTRIBUTES = section.

    Verify that INITSTATS appears.

    Look for the following message:

    INACTIVE USERIDS ARE BEING AUTOMATICALLY REVOKED AFTER <nnn> DAYS.

    Verify the value is equal to or less than 45 days.'
  remediation: 'To modify the INACTIVE parameter use the RACF SETROPTS command:

    SETROPTS INACTIVE(45)

    Notes:

    1. INACTIVE does not apply to Protected user IDs. Protected user IDs

    are protected from being revoked through inactivity.

    2. If the backup database is needed but does not contain current

    information, some user IDs can be revoked because they appear to

    have been unused beyond the number of days specified on the

    INACTIVE operand. For more information, see z/OS Security Server

    RACF System Programmer''s Guide.

    If you specify INACTIVE, INITSTATS must be in effect. To enable INITSTATS use the

    RACF SETROPTS command:

    SETROPTS INITSTATS'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ATTRIBUTES = section.

      Verify that INITSTATS appears.

      Look for the following message:

      INACTIVE USERIDS ARE BEING AUTOMATICALLY REVOKED AFTER <nnn> DAYS.

      Verify the value is equal to or less than 45 days.'
    severity: medium
- id: 1.2.2
  title: Ensure that the STARTED resource class is used to assign user IDs to started tasks
  scoring: scored
  profile:
  - Level 1
  description: Started procedures have system generated job statements that do not contain the user, group, or password statements.
    To enable the started procedure to access the same protected resources that users and groups access, started procedures
    must have an associated user ID. If a user ID is not associated with the started procedure, the started procedure will
    not have access to the resources. User ID can be assigned through the RACF STARTED class or through the ICHRIN03 table.
    As it is easily auditable, does not require assembler knowledge or a system IPL for changes, we require the usage of the
    RACF STARTED class.
  rationale: If a user ID is not associated with the started procedure, the started procedure will not have access to the
    resources. By default started procedures should be assigned a user ID with limited privileges to prevent otherwise undefined
    tasks from getting unintentional access to resources secured by RACF.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000720'
  page_start: 52
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that STARTED appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACSPT

    Review the FROM PROFILES IN THE STARTED CLASS: section.

    Verify that no entries contain:

    -USER NOT SPECIFIED, ICHRIN03 WILL BE USEDRequest IRRUT100 cross reference output and reports generated using IRRDBU00

    output that will allow you to:

    Verify the following catch-all profile is defined:

    • A single GENERIC profile in the STARTED class named: ** or *.*

    Verify that this catch-all profile in the STARTED class has a STDATA segment with:

    • A GROUP value that is a valid RACF group ID

    • A USER value that is a valid RACF user ID

    Verify that the RACF group specified in the STDATA segment GROUP value of the catchall profile in the STARTED class:

    • Does not appear on any RACF data set or general resource access list

    • Does not have any segments beyond base (ex. no OMVS segment)

    Verify that the RACF user ID specified in the STDATA segment USER value of the catchall profile in the STARTED class:

    • Has the PROTECTED attribute

    • Has the RESTRICTED attribute

    • Has the UAUDIT attribute

    • Does not appear on any RACF data set or general resource access list

    • Does not have any segments beyond base (ex. no OMVS segment)

    • Does not have any extra system or group privileges (ex. ROAUDIT, CLAUTH,

    group-JOIN, etc.)'
  remediation: "Notes:\n1. RACF cannot be initialized if ICHRIN03 is not present so even when\na catch-all ** profile in the\
    \ STARTED class is used to assign user\nIDs, a dummy ICHRIN03 is shipped with and installed by RACF.\n2. For installations\
    \ that have an existing ICHRIN03 in place and want\nto migrate to using the STARTED class, a sample REXX exec is\nprovided\
    \ in member ICHSPTCV in SYS1.SAMPLIB to process the\noutput of the RACF DSMON program and build RACF RDEFINE\ncommands\
    \ to replicate current ICHRIN03 entries.\n3. It is recommended that a minimal set of STC definitions be\nmaintained in\
    \ the ICHRIN03, such that an IPL can be completed\nand the system can be brought up in cases of RACF failure.\nTo activate\
    \ the STARTED class use the RACF SETROPTS command:\nSETROPTS CLASSACT(STARTED)\nTo enable generic profile checking for\
    \ the STARTED class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(STARTED)\nTo RACLIST the STARTED class use the RACF\
    \ SETROPTS command:\nSETROPTS RACLIST(STARTED)\nTo create dedicated IDs for the STDATA segment use the RACF ADDGROUP,\
    \ ADDUSER,\nand CONNECT commands:\nADDGROUP STCGRP +\n OWNER(<group>) +\n SUPGROUP(<group>) +\n DATA('CATCH-ALL STC PROFILE\
    \ GROUP')\nADDUSER STCUSER +\n OWNER(STCGRP) +\n DFLTGRP(STCGRP) +\n NOPASSWORD +\n RESTRICTED +\n UAUDIT +\n DATA('CATCH-ALL\
    \ STC PROFILE USER')\nCONNECT STCUSER +\n GROUP(STCGRP) +\n OWNER(STCGRP)\nTo create a catch-all STARTED profile use the\
    \ RACF RDEFINE and SETROPTS commands:\nRDEFINE STARTED ** +\n UACC(NONE) +\n DATA('CATCH-ALL TO PREVENT ICHRIN03 FALLBACK')\
    \ +\n STDATA( +\n USER(STCUSER) +\n GROUP(STCGRP) +\n )\nSETROPTS REFRESH RACLIST(STARTED)\nTo remove a non-compliant\
    \ access list entries use the RACF PERMIT command:\nPERMIT <profile> CLASS(<class>) +\n DELETE ID(<non-compliant>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that STARTED appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that STARTED appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that STARTED appears.

      Request the following DSMON report:

      FUNCTION SYSTEM RACSPT

      Review the FROM PROFILES IN THE STARTED CLASS: section.

      Verify that no entries contain:

      -USER NOT SPECIFIED, ICHRIN'
    severity: medium
- id: 1.2.3
  title: Ensure user propagation is controlled
  scoring: scored
  profile:
  - Level 1
  description: Batch jobs that are user-submitted to the operating system should inherit the user ID of the submitter. This
    will identify the batch job with the user for the purpose of accessing resources. In some environments, such as CICS jobs
    submitted without the USER operand specified on the JOB statement, that job runs under a user ID other than the user submitting
    the job, in this case, the CICS user ID. This situation presents a security violation in that the issuer of the job will
    inherit the authority of the CICS user ID. The PROPCNTL Class was designed to prevent this from occurring. Utilize propagation
    control (PROPCNTL) for system-level address spaces that submit jobs on behalf of users.
  rationale: Jobs submitted without the USER operand specified on the JOB statement which run under a user ID other than the
    user submitting the job present a security violation in that the issuer of the job will inherit the authority of the user
    ID and may allow access to resources they would not ordinarily have access to.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000250'
  page_start: 57
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that PROPCNTL appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that PROPCNTL appears.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that all user IDs that require propagation control have a dedicated profile in the

    PROPCNTL class.'
  remediation: 'To activate the PROPCNTL class use the RACF SETROPTS command:

    SETROPTS CLASSACT(PROPCNTL)

    To RACLIST the PROPCNTL class use the RACF SETROPTS command:

    SETROPTS RACLIST(PROPCNTL)

    To create a PROPCNTL profile use the RACF RDEFINE and SETROPTS commands:

    RDEFINE PROPCNTL <user-id>

    SETROPTS REFRESH RACLIST(PROPCNTL)

    Note:

    1. For a profile in the PROPCNTL class, RACF checks only for the

    presence or absence of a profile in this class. If a profile exists for a

    particular user ID, user ID propagation does not occur for that user

    ID.

    2. RACF performs no logging and issues no messages for profiles in

    the PROPCNTL class.

    3. PROPCNTL profiles only control propagation for local jobs. If the

    installation uses &RACLNDE for its remote nodes, only the PROPCNTL

    profiles are necessary. For more information on the use of

    &RACLNDE, see Defining nodes as local input sources. If the

    installation uses NODES profiles, it must also use them to control

    propagation (see Controlling user ID propagation in an NJE

    environment).

    4. If you have controlled a user ID using the PROPCNTL class, and that

    user wants to submit a batch job to run from that user ID, the JOB

    statement must contain both the user ID and proper password. For

    example, if user A submits a job with USER=A, PASSWORD=password

    must also be specified. However, if a different user wants to submit

    a job using the controlled user ID, that user can either specify the

    user ID and password as above, or use the facilities provided by

    the SURROGAT class and just specify the user ID. For example, if

    you controlled user A using the PROPCNTL class, user B could

    submit a job, specifying only USER=A with the appropriate SURROGAT

    authorization.'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that PROPCNTL appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that PROPCNTL appears.

      Request reports generated using IRRDBU00 output that will allow you to:

      Verify that all user IDs that require propagation control have a dedicated profile in the

      PROPCNTL class.'
    severity: medium
- id: 1.2.4
  title: Ensure that started tasks defined with the TRUSTED attribute are justified
  scoring: manual
  profile:
  - Level 1
  description: The TRUSTED attribute allows a started task to bypass RACF checking. It is vital that this attribute is not
    granted to unauthorized started tasks which could then obtain unauthorized access to the system.
  rationale: Unauthorized started tasks obtaining unauthorized access to the system could result in the compromise of the
    confidentiality, integrity, and availability of the operating system, RACF, or customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000130'
  page_start: 60
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM RACSPT

    Review the report and for any profiles that have YES in the TRUSTED column:

    Verify that the TRUSTED attribute assignment is justified.

    Note: Examples of TRUSTED assignment justification includes, but is not

    limited to:

    • The started task or address space creates or accesses a wide

    variety of unpredictably named data sets.

    • Insufficient authority to an accessed resource might risk an

    unsuccessful IPL or other critical system functionality error.

    • It is listed as a requirement by the product documentation or

    vendor.'
  remediation: "To remove the TRUSTED from a STARTED profile use the RACF RALTER and SETROPTS\ncommands:\nRALTER STARTED <profile>\
    \ +\n STDATA(NOTRUSTED)\nSETROPTS REFRESH RACLIST(STARTED)\nIBM provides guidance on z/OS started tasks and address spaces\
    \ that require TRUSTED\nin the MVS Initialization and Tuning Reference, linked in the additional information\nsection."
