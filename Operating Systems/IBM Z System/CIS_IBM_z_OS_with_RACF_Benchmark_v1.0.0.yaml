- id: 8.7.1
  title: Ensure that RJE workstations and NJE nodes enforce password protection
  scoring: manual
  profile:
  - Level 1
  description: JES2 RJE workstations and NJE nodes provide a method of sending and receiving data (e.g. jobs, job output,
    and commands) from remote locations.
  rationale: Failure to properly identify and control these remote facilities could result in unauthorized sources transmitting
    data to and from the operating system. This exposure may threaten the integrity and availability of the operating system
    environment and compromise the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000010'
  page_start: 607
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that FACILITY appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that FACILITY appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that FACILITY appears.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify That the following profiles have been defined in the FACILITY class:

    • NJE.* or NJE.**

    • RJE.* or RJE.**

    Note: Defining these profiles will force user ID and password protection of

    all NJE and RJE connections respectively. A site may choose to use fully

    qualified profiles but this introduces the possibility of stale or missing

    definitions.'
  remediation: "To activate the FACILITY class use the RACF SETROPTS command:\nSETROPTS CLASSACT(FACILITY)\nTo enable generic\
    \ profile checking for the FACILITY class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(FACILITY)\nTo RACLIST the\
    \ FACILITY class use the RACF SETROPTS command:\nSETROPTS RACLIST(FACILITY)\nTo create a the profiles use the RACF RDEFINE\
    \ and SETROPTS commands:\nRDEFINE FACILITY NJE.** +\n DATA('ENFORCE USER ID AND PASSWORD PROTECTION FOR NJE NODES')\n\
    RDEFINE FACILITY RJE.** +\n DATA('ENFORCE USER ID AND PASSWORD PROTECTION FOR RJE WORKSTATIONS')\nSETROPTS REFRESH FACLIST(FACILITY)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that FACILITY appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that FACILITY appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that FACILITY appears.

