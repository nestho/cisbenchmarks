- id: 6.4.1
  title: Ensure syslog daemon is started at z/OS initialization
  scoring: manual
  profile:
  - Level 1
  description: The Syslog daemon, known as syslogd, is a z/OS UNIX daemon that provides a central processing point for log
    messages issued by other z/OS UNIX processes. The messages may be of varying importance levels including general process
    information, diagnostic information, critical error notification, and audit-class information. It is important that syslogd
    be started during the initialization phase of the z/OS system to ensure that significant messages are not lost. Finally,
    syslogd should run in nonswappable mode and under a sufficiently high WLM service class to allow it to keep up with heavy
    logging loads. If syslogd falls behind, it can cause system instability. Syslog daemon, known as syslogd, is a zOS UNIX
    daemon that provides a central processing point for log messages issued by other zOS UNIX processes. It is also possible
    to receive log messages from other network-connected hosts. Some of the IBM Communications Server components that may
    send messages to syslog are the FTP and zOS UNIX Telnet servers, AT-TLS and the IKED, NSSD and DMD daemons. The messages
    may be of varying importance levels including general process information, diagnostic information, critical error notification,
    and audit-class information. Primarily because of the potential to use this information in an audit process, there is
    a security interest in protecting the syslogd process and its associated data. The Syslog daemon requires special privileges
    and access to sensitive resources to provide its system services.
  rationale: Failure to collect and retain audit data may contribute to the loss of accountability and hamper security audit
    activities. Failure to properly define and control the Syslog daemon could lead to unauthorized access. This exposure
    may result in the compromise of the integrity and availability of the operating system environment, ACP, and customer
    data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-SL-000020'
  - '1. IBM z/OS RACF STIG: RACF-SL-000030'
  page_start: 388
  audit_raw: 'Verify with the site that the syslog daemon (syslogd) is started automatically during the

    initialization for every z/OS system.

    Note: syslogd may be started from the UNIX shell, a cataloged

    procedure (STC), or the BPXBATCH program. Additionally, other

    mechanisms (e.g., CONTROL-O) may be used to automatically start

    syslogd.

    Verify that the WLM service class under which syslogd is classified, is of a high

    enough to ensure syslogd will not starve for dispatching priority.

    Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that STARTED appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACSPT

    Verify that the syslogd started task(s) appear in the FROM PROFILES IN THE STARTED

    CLASS: section and not the FROM THE STARTED PROCEDURES TABLE (ICHRIN03):

    section.

    Use the ASSOCIATED USER column to determine the user ID associated with the

    syslogd task.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that the syslogd started task RACF user ID:

    • Has the PROTECTED attribute

    • Has the following OMVS segment attributes:

    o UID is 0

    o HOME is /

    o PROGRAM is /bin/sh

    • Is permitted a minimum of READ to the BPX.STOR.SWAP resource in the FACILITY

    class.'
  remediation: "Consult the z/OS Communications Server - IP Configuration Guide for guidance on\nstarting and stopping syslogd.\n\
    To activate the STARTED class use the RACF SETROPTS command:\nSETROPTS CLASSACT(STARTED)\nTo enable generic profile checking\
    \ for the STARTED class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(STARTED)\nTo RACLIST the STARTED class use the\
    \ RACF SETROPTS command:\nSETROPTS RACLIST(STARTED)\nTo create a STARTED profile use the RACF RDEFINE and SETROPTS commands:\n\
    RDEFINE STARTED SYSLOGD.* +\n UACC(NONE) +\n DATA('UNIX SYSLOG DAEMON') +\n STDATA( +\n USER(<syslogd-user>) +\n GROUP(<syslogd-group>)\
    \ +\n )\nSETROPTS REFRESH RACLIST(STARTED)\nTo make a user ID PROTECTED use the RACF ALTUSER command:\nALTUSER <syslogd-user>\
    \ +\n NOPASSWORD +\n NOPHRASE +\n NOOIDCARD\nTo modify the OMVS segment for a user ID use the RACF ALTUSER command:\n\
    ALTUSER <syslogd-user> +\n OMVS( +\n UID(0) +\n HOME('/') +\n PROGRAM('/bin/sh') +\n )\nNotes:\n1. If the security administrator\
    \ has defined the SHARED.IDS profile in\nthe UNIXPRIV class, the UID value must be unique. Use the SHARED\nkeyword in\
    \ addition to UID to assign a value that is already in use.\n2. OMVS DIRECTORY and PROGRAM values are case sensitive,\
    \ so be\nsure they are entered as-is and not translated to upper case.\nTo add an access list entries use the RACF PERMIT\
    \ command:\nPERMIT BPX.STOR.SWAP CLASS(FACILITY) +\n ACCESS(READ) ID(<syslogd-user>)\nSETROPTS REFRESH RACLIST(FACILITY)"
  checks:
  - type: manual_review
    info: 'Verify with the site that the syslog daemon (syslogd) is started automatically during the

      initialization for every z/OS system.

      Note: syslogd may be started from the UNIX shell, a cataloged

      procedure (STC), or the BPXBATCH program. Additionally, other

      mechanisms (e.g., CONTROL-O) may be used to automatically start

      syslogd.

      Verify that the WLM service class under which syslogd is classified, is of a high

      enough to ensure syslogd will not starve for dispatching priority.

      Issue the following TSO co'
