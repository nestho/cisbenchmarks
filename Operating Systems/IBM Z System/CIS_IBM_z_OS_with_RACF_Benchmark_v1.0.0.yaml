- id: 8.3.10
  title: Ensure that access to JESJOBS REROUTE resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a REROUTE high-level qualifier in the JESJOBS resource class control the use of the reroute
    function of the job modify SSI 85. Rerouting a job sends a job (with any instream data) to another NJE note for execution
    (or could cause an NJE bound job to execute locally).
  rationale: Failure to properly control access to rerouting jobs could result in unauthorized personnel disrupting normal
    system operations and potentially sending a job with sensitive instream data to a different NJE node. Unauthorized users
    rerouting a job could expose the contents of the job (and any instream data) to an unintended NJE node.
  impact: ''
  references: []
