    these TCP/IP started tasks could lead to unauthorized access.
  rationale: This exposure may threaten the integrity of the operating system environment and compromise the confidentiality
    of customer data. This exposure may result in the compromise of the integrity and availability of the operating system
    environment, ACP, and customer data.
  impact: Evaluate the impact associated with implementation of the control option. Develop a plan of action to implement
    the control option as specified below.
