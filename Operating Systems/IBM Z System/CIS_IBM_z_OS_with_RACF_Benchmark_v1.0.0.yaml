- id: '5.2'
  title: Ensure that access to the Tape Bypass Label Processing (BLP) resource is controlled
  scoring: scored
  profile:
  - Level 1
  description: Tape Bypass Label Processing (BLP) is extremely sensitive, as it allows the circumvention of security access
    checking for the data. When BLP is used in z/OS, the only verification that is done is for the data set name in the JCL.
    Any data set name can be used. A user could specify a data set name that he has access to, the job would pass the validation
    check, and the job would be processed, giving access to the data. BLP is typically used for tapes that are external to
    the tape management system used on the processor. BLP should be granted to only a limited number of people, preferably
    the tape librarian and a few key people from the operations staff. If an unauthorized user possesses BLP authority, they
    could potentially read any restricted tape and modify any information once it has been copied.
  rationale: If an unauthorized user possesses BLP authority, they could potentially read any restricted tape and modify any
    information once it has been copied.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000140'
