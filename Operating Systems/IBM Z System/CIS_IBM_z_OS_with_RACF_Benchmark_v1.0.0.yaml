- id: '9.2'
  title: Ensure that access to superuser resources in the UNIXPRIV class is controlled
  scoring: scored
  profile:
  - Level 1
  description: Resources in the UNIXPRIV class that start with SUPERUSER protect the various capabilities granted to a user
    with UID(0). By defining profiles in the UNIXPRIV class, you can avoid assigning UID(0) to users by specifically granting
    certain superuser privileges with a high degree of granularity. This allows you to minimize the number of assignments
    of superuser authority at your installation and reduces your security risk.
  rationale: UID(0) generally provides too much authority and presents a separation of duties issue, especially for human
    users. UNIXPRIV can be used to implement Least Privilege for UNIX superuser authorities.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000010'
  page_start: 622
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that UNIXPRIV appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that UNIXPRIV appears.

