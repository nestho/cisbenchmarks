    \ a STARTED profile use the RACF RDEFINE and SETROPTS commands:\nRDEFINE STARTED TCPIP.* +\n UACC(NONE) +\n DATA('TCP/IP\
    \ STACK') +\n STDATA( +\n USER(<tcpip-user>) +\n GROUP(<tcpip-group>) +\n TRUSTED +\n )\nRDEFINE STARTED EZAZSSI.* +\n\
    \ UACC(NONE) +\n DATA('START VMCF AND TNF AS RESTARTABLE SUBSYSTEMS') +\n STDATA( +\n USER(<ezazssi-user>) +\n GROUP(<ezazssi-group>)\
    \ +\n )\nSETROPTS REFRESH RACLIST(STARTED)\nTo make a user ID PROTECTED use the RACF ALTUSER command:\nALTUSER <user-id>\
    \ +\n NOPASSWORD +\n NOPHRASE +\n NOOIDCARD\nTo modify the OMVS segment for a user ID use the RACF ALTUSER command:\n\
    ALTUSER <tcpip-id> +\n OMVS( +\n UID(0) +\n HOME('/') +\n PROGRAM('/bin/sh') +\n )\nNotes:\n1. If the security administrator\
    \ has defined the SHARED.IDS profile in\nthe UNIXPRIV class, the UID value must be unique. Use the SHARED\nkeyword in\
    \ addition to UID to assign a value that is already in use.\n2. OMVS DIRECTORY and PROGRAM values are case sensitive,\
    \ so be\nsure they are entered as-is and not translated to upper case."
