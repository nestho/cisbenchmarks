- id: 8.5.2
  title: Ensure that RACF is called for data sets opened by JES2
  scoring: manual
  profile:
  - Level 1
  description: The Program Property Table (PPT) provides an option to bypass password checking for data sets (NOPASS). This
    causes OPEN processing to bypass the call to RACF data set access authorization for the specified address space. JES2
    is defined with the attribute PASS which requires that RACF be called for all data set access.
  rationale: Specifying PASS for the PPT entry for JES2 (HASJES20) is required to ensure that access to JCLLIB data sets is
    properly authorized. Specifying NOPASS for HASJES20 would allow a JCLLIB JCL statement to access any data set. If the
    data set were a PDS with a record format of F and a record length of 80, during JCL conversion the data set would be read
    and its contents displayed as error message in the JCL listing. This could compromise the confidentiality of customer
    data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-OS-000290'
  page_start: 593
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM SYSPPT

    Verify that the BYPASS PASSWORD PROTECTION column value for HASJES20 is NO.'
  remediation: Update the SHEDxx PARMLIB member to remove the NOPASS specification for HASJES20.
  checks:
  - type: manual_review
    info: 'Request the following DSMON report:

      FUNCTION SYSTEM SYSPPT

      Verify that the BYPASS PASSWORD PROTECTION column value for HASJES20 is NO.'
    severity: medium
- id: 8.6.1
  title: Ensure that access to JES2 output devices is controlled
  scoring: manual
  profile:
  - Level 1
  description: Profiles in the WRITER resource class can control what devices and destination a job can access. Most WRITER
    checks are made when the SYSOUT is selected to be printed. If the owner does not have access to the device (as defined
    by the WRITER resource class profile) then the output is not processed (and remains on SPOOL). NJE destination checks
    (JES2.NJE.nodename) are performed at the time the SYSOUT is being allocated. If the owning user ID does not have access
    to the NJE node, the SYSOUT allocation is failed.
  rationale: JES2 output devices provide a variety of channels to which output can be processed. Failure to properly control
    these output devices could result in unauthorized personnel accessing output.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000040'
  page_start: 596
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

