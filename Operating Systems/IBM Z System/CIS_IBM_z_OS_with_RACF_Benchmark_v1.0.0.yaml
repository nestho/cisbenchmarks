  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM RACUSR

    Review the SPECIAL column under the ATTRIBUTE TYPE grouping.

    Verify when SYSTEM or GROUP appears if the assignment is justified for the user.'
  remediation: "To remove the SPECIAL attribute use the RACF ALTUSER command:\nALTUSER <user-id> NOSPECIAL\nTo remove group-SPECIAL\
    \ authority use the RACF CONNECT command:\nCONNECT <user-id> +\n GROUP(<group>) +\n NOSPECIAL"
  checks:
