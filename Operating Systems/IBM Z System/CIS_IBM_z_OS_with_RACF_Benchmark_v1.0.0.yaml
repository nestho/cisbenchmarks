- id: '9.11'
  title: Ensure that entries in /etc/inetd.conf are active and secure
  scoring: scored
  profile:
  - Level 1
  description: Parameter settings in PARMLIB and /etc specify values for z/OS UNIX security controls. The UNIX services are
    controlled in /etc/inetd.conf and non-essential and potentially non-secure services must be disabled. The parameters impact
    HFS data access and operating system services. Undesirable values can allow users to gain inappropriate privileges that
    could impact data integrity or the availability of some system services.
  rationale: The /etc/inetd.conf file determines if every entry in the file represents a service that is actually in use.
    Services that are not in use must be disabled to reduce potential security exposures. Some non-essential services can
    potentially give remote access to attackers and must be disabled.
