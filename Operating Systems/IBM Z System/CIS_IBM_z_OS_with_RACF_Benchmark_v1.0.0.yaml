- id: 8.3.12
  title: Ensure that access to JESJOBS SPOOLIO resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a SPOOLIO high-level qualifier in the JESJOBS resource class control the use of the SPOOL I/O
    function of the job information SSI 71. The SPOOL I/O function is intended for application to access data on the JES2
    spool for debugging purposes. Most access to SPOOL control blocks is managed by the JESSPOOL resource class. However,
    that use requires that the data can be associated with a specific existing job. In the case where the data being accessed
    is not associated with a job or the job no longer exists, this JESJOBS resource class check is used.
