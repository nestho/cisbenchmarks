- id: 8.2.1
  title: Ensure that the JESSPOOL resource class is enabled
  scoring: manual
  profile:
  - Level 1
  description: JESSPOOL resources control access to data stored on the JES spool data sets. This includes all SYSOUT and instream
    data set, JCL, SYSLOG, JESTRACE, and JESNEWS data sets stored on spool and the control blocks that represent those data
    set. Failure to properly control JES2 spool resources could result in unauthorized personnel accessing job output, system
    activity logs, and trace data containing user ID and password information.
  rationale: If the JESSPOOL class is not active, the integrity and availability of the operating system environment is compromised,
    and potentially sensitive customer data is exposed. Failure to set the JESSPOOL class active and properly protect the
    resources covered by the JESSPOOL class could allow access to any data stored on the JES spool.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000060'
  page_start: 509
