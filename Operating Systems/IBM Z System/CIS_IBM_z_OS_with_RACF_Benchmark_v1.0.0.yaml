    Verify that the RACF groups with OMVS segment values have unique GID values.'
  remediation: 'To modify the GID value of a RACF group use the ALTGROUP command:

    ALTGROUP <group-id> OMVS(AUTOGID)

    Note: AUTOGID is only available if the site has enabled automatic

    assignment of unique UNIX identities.'
  checks:
