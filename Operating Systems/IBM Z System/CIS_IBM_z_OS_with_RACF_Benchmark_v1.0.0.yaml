- id: 6.1.3
  title: Ensure AT-TLS protection is enabled for CSSMTP
  scoring: manual
  profile:
  - Level 1
  description: During the TLS handshake process, mutually acceptable suite of cryptographic algorithms is selected by the
    server and client. The algorithms specified in the selected suite are used to cryptographically protect the data that
    subsequently flows between the two. To apply TLS protection of adequate strength, either the CSSMTP application must be
    configured to use AT-TLS protection, or the JES batch jobs that send mail through CSSMTP must use the STARTTLS command.
  rationale: Failure to properly enforce adequate encryption strength could result in the loss of data privacy.
  impact: The cryptographic operations involved in TLS do come with a CPU cost. Most of the recommended algorithms are optimized
    through the use of hardware acceleration. Depending on the number and frequency of TLS handshakes, the CPU impact could
    be noticeable.
  references: []
  page_start: 343
  audit_raw: 'Refer to the CSSMTP configuration file specified on the CONFIG DD statement in the

    CSSMTP started task JCL.

    Verify that each TargetServer statement specifies the SECURE YES parameter.

    Note: For any TargetServer that does not specify SECURE YES, then

    verify that each JES batch job that sends mail through CSSMTP uses the

    STARTTLS command to specifically request TLS protection of its outbound

    mail to the target Message Transfer Agent (MTA).'
  remediation: 'The site will need to follow their standard change management process for updating

    CSSMTP configuration file statements with compliant values.'
  checks:
  - type: manual_review
    info: 'Refer to the CSSMTP configuration file specified on the CONFIG DD statement in the

      CSSMTP started task JCL.

      Verify that each TargetServer statement specifies the SECURE YES parameter.

      Note: For any TargetServer that does not specify SECURE YES, then

