  title: Ensure regular audits of AC=1 modules in APF authorized libraries are conducted
  scoring: manual
  profile:
  - Level 1
  description: The AC=1 modules that reside in APF authorized libraries should be reviewed annually. It is important maintain
    documentation identifying the integrity and justification of vendor APF authorized libraries. For non-vendor APF authorized
    libraries, the source and documentation identifying the integrity and justification that describes the AC=1 module process
    should be maintained.
  rationale: Undocumented and/or unauthorized AC=1 modules have a possible risk to the confidentiality, integrity, and availability
    of the system and present a clear risk to the operating system, RACF, and customer data.
  impact: ''
  references:
  - '1. z/OS RACF STIG :: Release: 36 Benchmark Date: 27 Apr 2018 Vuln ID: V-86'
  page_start: 297
  audit_raw: 'Verify the AC=1 documentation and compare it to the actual content of the APF

    authorized libraries.'
  remediation: 'Any discrepancy must be fixed: documentation updated and/or libraries/modules

    removed.'
  checks:
