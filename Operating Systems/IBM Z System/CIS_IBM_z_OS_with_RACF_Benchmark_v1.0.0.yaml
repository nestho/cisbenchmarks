- id: '4.1'
  title: Ensure that RACF database is backed up on a scheduled basis
  scoring: manual
  profile:
  - Level 1
  description: If backups of the operating environment are not processed, implementation of a contingency plan would not include
    the data necessary to fully recover from any outage. RACF database backups reduce system recovery time.
  rationale: If regularly scheduled backups of this database are not processed, system recovery time could be unacceptably
    long.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000640'
  page_start: 304
  audit_raw: Verify that site RACF databases are backed up at least daily.
  remediation: Implement a daily backup.
  checks:
  - type: manual_review
    info: Verify that site RACF databases are backed up at least daily.
    severity: medium
- id: '4.2'
  title: Ensure that the RACF PRIM and BACK databases are isolated
  scoring: manual
  profile:
  - Level 1
  description: RACF backup and recovery data files provide the only means of recovering RACF database in the event of its
    damage.
  rationale: In the case where this damage is to the physical volume on which it resides, and any of these recovery data files
    exist on this volume as well, then complete recovery of the RACF database would be extremely difficult, if even possible.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000630'
  page_start: 305
  audit_raw: 'Issue the following TSO command:

    RVARY LIST

    Verify that the VOLUME values for the PRIM and BACK are different for RACF databases

    that have YES in the ACTIVE column.'
  remediation: 'Issue the following TSO command:

    RVARY LIST

    Verify that the VOLUME values for the PRIM and BACK are different for RACF databases

    that have YES in the ACTIVE column.

    Remediation Procedure

    Consult the z/OS Security Server RACF Security System Programmer''s Guide for

    guidance on moving the RACF database data sets.

    Note: Depending upon your configuration, modify the ICHRDSNT load

    module table or the IRRPRMxx PARMLIB member and plan an IPL of the

    system (or the entire sysplex if in DATASHARING mode).'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      RVARY LIST

      Verify that the VOLUME values for the PRIM and BACK are different for RACF databases

      that have YES in the ACTIVE column.'
    severity: medium
- id: '4.3'
  title: Ensure sensitive data sets are encrypted with z/OS data set encryption
  scoring: manual
  profile:
  - Level 1
  description: With z/OS data set encryption, you are able to protect data residing on disk from being viewed by unauthorized
    users in the clear. Authorization is based on access to the key label that is associated with the data set and used by
    the access methods to encrypt and decrypt the data.
  rationale: Implementing z/OS dataset encryption ensures that even privileged users, like storage administrators, can manage
    sensitive data sets without being able to view the contents.
  impact: 'It is recommended that clients using host-based encryption also use host-based compression before the encryption
    of the data. If the data is not compressed prior to the encryption there can be consequences other parts of the client
    infrastructure. For example, replicated data that is being compressed in the SAN infrastructure by DWDM technology will
    no longer be effective trying to compress encrypted data. Without compressing beforeto the encryption of the data, additional
    bandwidth might be required. Another example might be that tape systems can require additional capacity in terms of disk
    space, in the case of virtual tape, or tape cartridges. If deduplication of data is supported, host encryption can prevent
    deduplication from working. Therefore, where possible, use compressed format data sets. With encrypted compressed format
    data sets, the access methods perform compression before encryption. See z/OS DFSMS Using Data Sets: Considerations when
    planning for data set encryption for more information.'
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000630'
  page_start: 307
  audit_raw: 'Request a list of data sets containing sensitive data.

    Issue the following TSO command for each data set:

    LISTCAT ALL ENTRIES(''<dataset-name>'')

    Review the command output in the ENCRYPTIONDATA section.

    Verify that the following message appears:

    DATA SET ENCRYPTION-----(YES)

    Note: Example acceptable exclusions includes, but is not limited to:

    • The data set is not managed by the Storage Management

    Subsystem (SMS).

    • The data set type is not supported by data set encryption.

    • Vendor documentation states the data set must not be encrypted

    (i.e. restrictions documented in z/OS DFSMS Using Data Sets:

    Data set encryption).

    • There is evidence proving that encryption is managed by the

    application (i.e. Integrated Cryptographic services Facility (ICSF)

    xKDS data sets).'
  remediation: 'Consult the z/OS DFSMS Using Data Sets: Data set encryption manual section for

    guidance on establishing z/OS data set encryption.'
  checks:
  - type: manual_review
    info: 'Request a list of data sets containing sensitive data.

      Issue the following TSO command for each data set:

      LISTCAT ALL ENTRIES(''<dataset-name>'')

      Review the command output in the ENCRYPTIONDATA section.

      Verify that the following message appears:

      DATA SET ENCRYPTION-----(YES)

      Note: Example acceptable exclusions includes, but is not limited to:

      • The data set is not managed by the Storage Management

      Subsystem (SMS).

      • The data set type is not supported by data set encryption.

      • Vendor documentation '
    severity: medium
- id: '4.4'
  title: Ensure that RACF application identity mapping (AIM) is at stage 3
  scoring: manual
  profile:
  - Level 1
  description: Application identity mapping in its final stage, stage 3, is an alternative to the use of mapping profiles
    to associate RACF user and group names with z/OS UNIX, Lotus Notes, and Novell Directory Services identifiers. For these
    associations, IRRIRA00 converts the database mapping profile information into an alias index, which uses less space.
  rationale: RACF database application identity mapping (AIM) stage 3 allows RACF to more efficiently handle authentication
    and authorization requests from applications such as z/OS UNIX and is required to use some RACF function.
  impact: If RACF is enabled for sysplex communication, whenever you need to run IRRIRA00 against a database that is active
    on a system that is a member of the RACF data sharing group, always run the utility from a system in the group. If you
    do not, you might damage your RACF database, or receive unpredictable results from the utility.
  references: []
  page_start: 310
  audit_raw: 'Request the SYSPRINT from IRRIRA00 run without parameters, similar to this example

    job:

    //DBSTAGE JOB

    //STEP EXEC PGM=IRRIRA00

    //SYSPRINT DD SYSOUT=A

    Verify that the message returned is: IRR66017I The system is currently

    operating in stage 3.

    Alternatively, if IBM Health Checker for z/OS is installed and active, you can request

    the HZSPRINT output for:

    CHECK(IBMRACF,RACF_AIM_STAGE)

    Verify that the message returned is:

    IRRH500I The RACF database is at the suggested stage of application

    identity mapping (AIM). The database is at AIM stage 03.'
  remediation: 'Refer to the Security Server RACF System Programmer''s Guide for considerations and

    instructions on using the IRRIRA00 utility to advances the application identity mapping

    stage for RACF databases.'
  checks:
  - type: manual_review
    info: 'Request the SYSPRINT from IRRIRA00 run without parameters, similar to this example

      job:

      //DBSTAGE JOB

      //STEP EXEC PGM=IRRIRA00

      //SYSPRINT DD SYSOUT=A

      Verify that the message returned is: IRR66017I The system is currently

      operating in stage 3.

      Alternatively, if IBM Health Checker for z/OS is installed and active, you can request

      the HZSPRINT output for:

      CHECK(IBMRACF,RACF_AIM_STAGE)

      Verify that the message returned is:

      IRRH500I The RACF database is at the suggested stage of application

      identity m'
    severity: medium
- id: '4.5'
  title: Ensure that RACF ENQ names are not in the Global Resource Serialization (GRS) Resource Name List
  scoring: manual
  profile:
  - Level 1
  description: During its normal course of processing, RACF performs numerous serialization requests using the Global Resource
    Serialization (GRS) RESERVE, ENQ, and DEQ services. These serialization requests allow RACF to ensure that changes to
    the RACF database and RACF control blocks are done in a consistent manner, maintaining the integrity of RACF data. Depending
    on the type of the serialization that RACF requires, RACF serializes at either the address space (SCOPE=STEP), single
    MVS image (SCOPE=SYSTEM) or multiple MVS image/Sysplex level (SCOPE=SYSTEMS). GRS identifies a serialization request by
    an eight character QNAME (or major name) and RNAME (or minor name) of up to 255 characters. GRS allows installations to
    tailor the processing of RESERVE, ENQ, and DEQ requests through the use of Resource Name Lists (RNLs).
  rationale: Installations that use GRS to convert RACF SYSTEMS ENQ to SYSTEM ENQ can corrupt the RACF data base and experience
    outages.
  impact: ''
  references: []
  page_start: 312
  audit_raw: 'Request the HZSPRINT output for:

    CHECK(IBMRACF,RACF_GRS_RNL)

    Verify that the message returned is:

    IRRH203I No RACF ENQ names were found in the GRS Resource Name List.

    OR

    THE CHECK IS NOT APPLICABLE IN THE CURRENT SYSTEM ENVIRONMENT.'
  remediation: 'RACF resource names are removed from the specified resource name list (RNL)

    returned by the RACF_GRS_RNL health check.'
  checks:
  - type: manual_review
    info: 'Request the HZSPRINT output for:

      CHECK(IBMRACF,RACF_GRS_RNL)

      Verify that the message returned is:

      IRRH203I No RACF ENQ names were found in the GRS Resource Name List.

      OR

      THE CHECK IS NOT APPLICABLE IN THE CURRENT SYSTEM ENVIRONMENT.'
    severity: medium
- id: '4.6'
  title: Ensure that SETROPTS GRPLIST is in effect
  scoring: scored
  profile:
  - Level 1
  description: List-of-groups (GRPLIST) authority checking supplements the normal RACF access authority checking by allowing
    all groups of which a user ID is a member to enter into the access list checking process. This process replaces the checking
    that compares the current connect group with the resource's access list, and can expand a user's ability to access resources.
    If GRPLIST is active, then regardless of which group the user is logged on to, RACF recognizes the user's group-related
    authorities in other connect groups. If a user is in more than one group and tries to access a resource, RACF uses the
    highest authority allowed by the user's list of groups and the resource's access list.
  rationale: Enabling GRPLIST is recommended because it eases administration and minimizes the number of times a user might
    have to log off and log back on to access resources.
  impact: ''
