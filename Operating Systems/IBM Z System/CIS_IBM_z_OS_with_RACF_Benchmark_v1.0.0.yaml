- id: 2.4.1
  title: Ensure that the assignment of the RACF OPERATIONS attribute is justified
  scoring: scored
  profile:
  - Level 1
  description: A user possessing the OPERATIONS attribute has authorization to do maintenance operations on all RACF-protected
    data sets, tape volumes, and DASD volumes except those where the access list specifically limits the OPERATIONS user to
    a lower access authority than the operation requires. Because the OPERATIONS and group-OPERATIONS privileges allow widespread
    access they should be limited to users documented with a valid requirement. Delegation of group-OPERATIONS processing
    to other personnel by site-defined Group Administrators is forbidden. Granting individual authorities using STGADMIN prefixed
    profiles in the FACILITY class is the preferred method, where applicable. However, there may be cases where OPERATIONS
    is required.
  rationale: Unauthorized access could result in the compromise of the operating system environment, RACF, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000720'
  page_start: 233
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM RACUSR

    Review the OPERATIONS column under the ATTRIBUTE TYPE grouping.

    Verify when SYSTEM or GROUP appears if the assignment is justified for the user.'
  remediation: "To remove the OPERATIONS attribute use the RACF ALTUSER command:\nALTUSER <user-id> NOOPERATIONS\nTo remove\
    \ group-OPERATIONS authority use the RACF CONNECT command:\nCONNECT <user-id> +\n GROUP(group) +\n NOOPERATIONS"
  checks:
