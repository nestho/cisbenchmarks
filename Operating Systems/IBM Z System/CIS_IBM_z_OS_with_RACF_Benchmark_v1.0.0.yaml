    \ GENERIC(DATASET)\nTo remove a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER\
    \ GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access checking is\
    \ not logged, so caution\nmust be used when making changes to GAC entries.\nTo disable GAC for a class you will need to\
    \ use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\n\
