  audit_raw: 'VTAM Systems Programmer supplies the following information:

    • Documentation regarding terminal naming standards.

    • Documentation of all procedures controlling terminal logons to the system.

    • A complete list of all USS commands used by terminal users to log on to the

    system.

    • Members and data set names containing USSTAB and LOGAPPL definitions of all

    terminals that can log on to the system (e.g. SYS1.VTAMLST).

    • Members and data set names containing logon mode parameters.

    Check that the USSTAB definitions are only used for secure terminals (e.g., terminals that

    are locally attached to the host or connected to the host via secure leased lines).'
  remediation: 'The Systems programmer will verify that USSTAB definitions are only used for secure

    terminals.

    Only terminals that are locally attached to the host or connected to the host via secure

    leased lines located in a secured area. Only authorized personnel may enter the area

    where secure terminals are located.

    USSTAB or LOGAPPL definitions are used to control logon from secure terminals. These

    terminals can log on directly to any VTAM application (e.g., TSO, CICS, etc.) of their

    choice and bypass Session Manager services. Secure terminals are usually locally

    attached to the host or connected to the host via a private LAN without access to an

    external network. Only authorized personnel may enter the area where secure terminals

    are located.'
