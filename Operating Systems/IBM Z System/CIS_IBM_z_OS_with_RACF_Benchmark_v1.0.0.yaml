    info: '1. From the ICSF Primary Menu panel, select option 3 OPSTAT.

      2. From the ICSF Installation Options panel, select option 1 OPTIONS.

      Verify that the FIPSMODE value is YES,FAIL(YES).'
    severity: medium
- id: 7.2.9
  title: Ensure CCA operational keys are created with WRAPENH3 key wrapping
  scoring: manual
  profile:
  - Level 1
  description: When the Crypto Express Coprocessor is configured to run in CCA mode, keys generated by the coprocessor are
    enciphered using the coprocessor's master key (e.g. DES keys are enciphered by the DES master key). The way the keys are
    enciphered by the master key is referred to as the wrapping method. The most recent wrapping method, WRAPENH3, provides
    the first proprietary TDES key token (also known as a key block) to be independently reviewed and confirmed to be compliant
    with Payment Card Industry (PCI) Security Standard Council (SSC) PIN Security key block requirements as updated Sep 30,
    2020.
  rationale: Creating DES keys using WRAPENH3 will ensure those key blocks are PCI compliant as noted above.
  impact: ''
  references: []
  page_start: 477
  audit_raw: '1. From the ICSF Primary Menu panel, select option 3 OPSTAT.

    2. From the ICSF Installation Options panel, select option 1 OPTIONS.

    Verify that all DEFAULTWRAP values are WRAPENH3.'
  remediation: 'The site will need to follow their standard change management process for updating

    parameters in the ICSF installation options data set to update non-compliant

    parameters.'
  checks:
  - type: manual_review
    info: '1. From the ICSF Primary Menu panel, select option 3 OPSTAT.

      2. From the ICSF Installation Options panel, select option 1 OPTIONS.

      Verify that all DEFAULTWRAP values are WRAPENH3.'
    severity: medium
