  description: The started procedure in SYS1.PROCLIB that starts the RACF subsystem address space contains an optional RACFPARM
    DD statement that identifies a file containing commands to run during subsystem initialization. This file must be protected
    with a DATASET profile.
  rationale: When these commands execute, they do so under the identity associated with the RACF subsystem, and OPERCMDS checking
    is not performed. Anyone with UPDATE access can insert commands.
