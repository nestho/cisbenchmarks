controls:
- id: 1.1.1
  title: Ensure that the SETROPTS PASSWORD(INTERVAL and PHRASEINT) values are set to a maximum of 365
  scoring: scored
  profile:
  - Level 1
  description: The SETROPTS INTERVAL parameter specifies the system default for the maximum number of days that each user's
    password and password phrase remain valid. The PHRASEINT parameter specifies the system default for the number of days
    that each user’s password phrase remains valid and overrides the INTERVAL setting for password phrases.
  rationale: 'Excessive password expiration requirements do more harm than good, because these requirements make users select
    predictable passwords, composed of sequential words and numbers that are closely related to each other. In these cases,
    the next password can be predicted based on the previous one (incrementing a number used in the password for example).
    Also, password expiration requirements offer no containment benefits because attackers will often use credentials as soon
    as they compromise them. Instead of recommending a mandatory password change interval, immediate password changes should
    be based on key events including, but not limited to: • Indication of compromise • Change of user roles • When a user
    leaves the organization.'
  impact: We recommend a yearly password change primarily because for all their good intentions users will share credentials
    across accounts. Therefore, even if a breach is publicly identified, the user may not see this notification, or forget
    they have an account on that site. This could leave a shared credential vulnerable indefinitely. Having an organizational
    policy of a 1-year (annual) password expiration is a reasonable compromise to mitigate this with minimal user burden.
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000800'
  page_start: 25
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the PASSWORD PROCESSING OPTIONS: section.

    Look for the following message:

    PASSWORD CHANGE INTERVAL IS <nnn> DAYS.

    Verify the value is equal to or less than 254 days.

    Note: 254 is the maximum value allowed for INTERVAL.

    Look for the following message:

    PASSWORD PHRASE CHANGE INTERVAL IS <nnn> DAYS.

    Verify the value is equal to or less than 365 days.

    Note: The massage PASSWORD CHANGE INTERVAL IS IN EFFECT FOR

    PASSWORD PHRASES. may appear instead, indicating that the INTERVAL

    keyword value is also is used to control the password phrase interval. Use

    that value for verification.'
  remediation: 'To modify the INTERVAL and PHRASEINT parameters use the RACF SETROPTS

    command:

    SETROPTS PASSWORD(INTERVAL(254) PHRASEINT(365))'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the PASSWORD PROCESSING OPTIONS: section.

      Look for the following message:

      PASSWORD CHANGE INTERVAL IS <nnn> DAYS.

      Verify the value is equal to or less than 254 days.

      Note: 254 is the maximum value allowed for INTERVAL.

      Look for the following message:

      PASSWORD PHRASE CHANGE INTERVAL IS <nnn> DAYS.

      Verify the value is equal to or less than 365 days.

      Note: The massage PASSWORD CHANGE INTERVAL IS IN EFFECT FOR

      PASSWORD PHRAS'
    severity: medium
- id: 1.1.2
  title: Ensure that the SETROPTS PASSWORD(HISTORY) value is set to a minimum of 5
  scoring: scored
  profile:
  - Level 1
  description: 'HISTORY specifies the number of previous passwords that RACF saves for each user ID and compares with an intended
    new password. If there is a match with one of the previous passwords, or with the current password, RACF rejects the intended
    new password. PASSWORD(HISTORY(nn)) command enables you to specify the number of previous passwords and password phrases
    (1 - 32) that RACF saves for each user and compares it with an intended new value. For passwords, RACF stores only previous
    passwords in each user''s history. For password phrases, RACF saves the user''s current password phrase in addition to
    the user''s previous password phrases. Therefore, for password phrases, RACF saves one fewer previous value than the number
    you specify for history. Example: If you specify 12 for your HISTORY number using the command SETROPTS PASSWORD(HISTORY(12))
    RACF saves up to 12 previous passwords and up to 11 previous password phrases for each user. Effective immediately, the
    values when executing that command are the default values for new users whom you define to RACF through the ADDUSER command.'
  rationale: A password history policy prevents users from immediately reusing an old password by enforcing a minimum number
    of new, unique passwords that must be used before a previous one can be reused. This is a crucial security measure against
    password recycling and brute force attacks. We recommend a HISTORY value of 5 to avoid user frustration while balancing
    security and usability.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000810'
  page_start: 28
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the PASSWORD PROCESSING OPTIONS: section.

    Look for the following message:

    <nn> GENERATIONS OF PREVIOUS PASSWORDS BEING MAINTAINED.

    Verify the value is equal to or greater than 5 generations.'
  remediation: 'To modify the HISTORY parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(HISTORY(5))'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the PASSWORD PROCESSING OPTIONS: section.

      Look for the following message:

      <nn> GENERATIONS OF PREVIOUS PASSWORDS BEING MAINTAINED.

      Verify the value is equal to or greater than 5 generations.'
    severity: medium
- id: 1.1.3
  title: Ensure that at least one SETROPTS PASSWORD(RULE) is defined with (LENGTH(8) MIXEDALL(1:8))
  scoring: scored
  profile:
  - Level 1
  description: 'SETROPTS PASSWORD(RULE<n>) specifies up to eight password syntax rules to verify that new passwords meet the
    installation standards. These rules allow you to control: • The minimum and maximum length of passwords • The character
    content of installation-selected positions in the passwords SETROPTS PASSWORD(MINCHANGE(<nnn>) specifies the number of
    days that must pass between a user’s password and password phrase changes. Users can not change their own passwords and
    password phrases within the minimum change interval. Permitting users to change their password more than once in a day
    allows users to quickly cycle through their password history and maintain the same password indefinitely. The SETROPTS
    PASSWORD(MINCHANGE(<nnn>) value, either specified or defaulted, is in effect for all users. A security administrator may
    set a password within the MINCHANGE window.'
  rationale: 'Password composition or complexity requirements are used to increase the strength of a user-created password
    of a given length. For example, a complex password would need some amount of characters from all three of the following
    categories: • Uppercase characters • Lowercase characters • Non-alphabetic characters such as numbers or special characters
    By implementing this recommendation a user will be required to create a complex password of the maximum allowable length
    (8). How frequently a password can be changed should be limited to prevent a user from immediately changing the password
    multiple times to get back to the original one.'
  impact: 'MIXEDALL includes all allowable password characters separated into the following categories. There are either three
    or four "active" categories, depending on whether SETROPTS PASSWORD(MIXEDCASE) is in effect: 1. The national characters.
    o And special characters if SETROPTS PASSWORD(SPECIALCHARS) is in effect. 2. Numeric characters. 3. Uppercase alphabetic
    characters (not including the national characters). 4. Lowercase alphabetic characters, if SETROPTS PASSWORD(MIXEDCASE)
    is in effect. Note: When four or more MIXEDALL positions are specified and SETROPTS PASSWORD(MIXEDCASE) is enabled, then
    at least one of every category must be specified anywhere across the designated positions. If SETROPTS PASSWORD(MIXEDCASE)
    is not enabled, then there is no change in behavior from having three MIXEDALL positions, other than in the number of
    positions over which the three active categories may be spread.'
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000770'
  - '1. IBM z/OS RACF STIG: RACF-ES-000790'
  page_start: 30
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the PASSWORD PROCESSING OPTIONS: section.

    Verify that at least 1 rule in the INSTALLATION PASSWORD SYNTAX RULES: section

    matches the following value:

    RULE <n> LENGTH(8) xxxxxxxx

    Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the PASSWORD PROCESSING OPTIONS: section.

    Look for the following message:

    PASSWORD MINIMUM CHANGE INTERVAL IS <nnn> DAYS.

    Verify the value is equal to or greater than 1 days.'
  remediation: 'To modify or add a password RULE<n> parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(RULE1(LENGTH(8) MIXEDALL(1:8)))

    To modify the MINCHANGE parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(MINCHANGE(1))'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the PASSWORD PROCESSING OPTIONS: section.

      Verify that at least 1 rule in the INSTALLATION PASSWORD SYNTAX RULES: section

      matches the following value:

      RULE <n> LENGTH(8) xxxxxxxx

      Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the PASSWORD PROCESSING OPTIONS: section.

      Look for the following message:

      PASSWORD MINIMUM CHANGE INTERVAL IS <nnn> DAYS.

      Verify the value is equal to or greater than 1 d'
    severity: medium
- id: 1.1.5
  title: Ensure that the SETROPTS PASSWORD(REVOKE) value is set to a maximum of 6
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'SETROPTS PASSWORD(REVOKE(<nnn>)) enables you to specify how many consecutive incorrect password and password
    phrase attempts RACF permits before it revokes the user ID on the next attempt. Note: If you specify REVOKE, INITSTATS
    must be in effect. The SETROPTS PASSWORD(ALGORITHM) algorithm is used to encrypt passwords and password phrases, but not
    OIDCARD data. The RACF KDFAES algorithm is designed to be resistant to offline attacks by incorporating the following
    properties: • Each instance of a RACF password injects randomly generated text into the encryption process. This prevents
    the use of pre-computed password hashes. That is, an offline attack must perform the full encryption process for every
    password guess, as opposed to simply comparing the password hash against a list of pre-computed values. This slows down
    the attack, making it take much longer to guess passwords. • Thousands of hash operations are performed against the password
    and random text in order to generate a key which is then used to encrypt the user ID. This also serves to slow down an
    offline attack, which must perform the same number of operations for each password guess. However, the authorized user
    logging on to the system using his clear text password will not notice the increased overhead.'
  rationale: The overall goal is it to make it difficult for an attacker to guess a password by trying it against an account,
    while allowing a user the ability to correct a mistakenly entered password in a reasonable way. By default passwords stored
    in RACF are protected using a weak DES based algorithm. Using off the shelf applications and hardware, it is a relatively
    simple operation to reverse engineer the encryption key – RACF user ID's password – or perform a bruteforce offline attack.
    Any user with access to RACF database may obtain the passwords for all user IDs in the system.
  impact: 'Limiting failed login attempts does not prevent testing a password guess via password spraying techniques (i.e.
    using the same password against many different user accounts). Instead, it tends to encourage attackers into using this
    technique to avoid lockouts, which results as an obvious anomaly and likely detectable via SMF monitoring. KDFAES passwords
    require more space in the RACF database than the legacy methods require. This changed format requires updates from some
    other software applications for them to keep functioning under the new algorithm. Be sure that you have all the available
    updates before you enable KDFAES. Refer to z/OS Security Server RACF System Programmer''s Guide: Planning Considerations
    for enabling KDFAES for more information.'
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000480'
  - '2. IBM z/OS RACF STIG: RACF-ES-000490'
  - '1. IBM z/OS RACF STIG: RACF-ES-000820'
  page_start: 35
  audit_raw: "Issue the following TSO command:\nSETROPTS LIST\nReview the command output in the ATTRIBUTES = section.\nVerify\
    \ that INITSTATS appears.\nReview the command output in the PASSWORD PROCESSING OPTIONS: section.\nLook for the following\
    \ message:\nAFTER <nnn> CONSECUTIVE UNSUCCESSFUL PASSWORD ATTEMPTS,\n A USERID WILL BE REVOKED.\nVerify the value is equal\
    \ to or less than 6 attempts.\nIssue the following TSO command:\nSETROPTS LIST\nReview the command output in the PASSWORD\
    \ PROCESSING OPTIONS: section.\nVerify the following message is present:\nTHE ACTIVE PASSWORD ENCRYPTION ALGORITHM IS\
    \ KDFAES"
  remediation: 'To modify the REVOKE parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(REVOKE(6))

    If you specify REVOKE, INITSTATS must be in effect. To enable INITSTATS use the

    RACF SETROPTS command:

    SETROPTS INITSTATS

    To modify the ALGORITHM parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(ALGORITHM(KDFAES))

    Note: After ALGORITHM(KDFAES) enablement, the existing algorithm

    continues to be used to evaluate a user''s password or password phrase

    until the user''s password or password phrase is changed. The first time a

    user''s password or password phrase is changed, the new algorithm is

    used from that point forward.

    After KDFAES is enabled, you might want to strengthen passwords immediately, rather

    than wait for users to change them on their normal schedule. The PWCONVERT operand

    of the ALTUSER command can be used. PWCONVERT converts a DES password and DES

    password history entries to KDFAES format without requiring the password to be

    changed.

    ALTUSER <user-id> PWCONVERT

    Notes:

    1. Conversion assumes that the existing password and password

    history are in DES format. Do not perform the conversion if you

    have passwords that are masked or installation-encoded.

    2. Conversion does not affect password phrases or phrase history.

    3. If an older copy of your RACF database containing DES passwords

    is compromised and an attacker is able to decrypt a password

    value, a conversion to KDFAES will not protect against the attacker

    using that password to gain access to your system.'
  checks:
  - type: manual_review
    info: "Issue the following TSO command:\nSETROPTS LIST\nReview the command output in the ATTRIBUTES = section.\nVerify\
      \ that INITSTATS appears.\nReview the command output in the PASSWORD PROCESSING OPTIONS: section.\nLook for the following\
      \ message:\nAFTER <nnn> CONSECUTIVE UNSUCCESSFUL PASSWORD ATTEMPTS,\n A USERID WILL BE REVOKED.\nVerify the value is\
      \ equal to or less than 6 attempts.\nIssue the following TSO command:\nSETROPTS LIST\nReview the command output in the\
      \ PASSWORD PROCESSING OPTIONS: section.\nVerify th"
    severity: medium
- id: 1.1.7
  title: Ensure that the SETROPTS PASSWORD(WARNING) value is set to a minimum of 5
  scoring: scored
  profile:
  - Level 1
  description: 'WARNING specifies the number of days before a password expires when RACF is to issue a warning message to
    the user. Note: If you specify WARNING, INITSTATS must be in effect.'
  rationale: System users should be warned about impending password expiration to allow secure passwords to be chosen and
    to allow the changing of a password at a convenient time to help minimize password change impact.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000810'
  page_start: 40
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ATTRIBUTES = section.

    Verify that INITSTATS appears.

    Review the command output in the PASSWORD PROCESSING OPTIONS: section.

    Look for the following message:

    PASSWORD EXPIRATION WARNING LEVEL IS <nnn> DAYS.

    Verify the value is equal to or greater than 5 days.'
  remediation: 'To modify the WARNING parameter use the RACF SETROPTS command:

    SETROPTS PASSWORD(WARNING(5))

    Note: If you specify a WARNING value that exceeds the INTERVAL value, a

    warning message is issued at each logon. If you do not want the warning

    with each logon, specify a value for WARNING that is less than the value

    you specify for INTERVAL.

    If you specify WARNING, INITSTATS must be in effect. To enable INITSTATS use the

    RACF SETROPTS command:

    SETROPTS INITSTATS'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ATTRIBUTES = section.

      Verify that INITSTATS appears.

      Review the command output in the PASSWORD PROCESSING OPTIONS: section.

      Look for the following message:

      PASSWORD EXPIRATION WARNING LEVEL IS <nnn> DAYS.

      Verify the value is equal to or greater than 5 days.'
    severity: medium
- id: 1.1.8
  title: Ensure that the SETROPTS RVARYPW values are secured with KDFAES
  scoring: scored
  profile:
  - Level 1
  description: RVARY passwords are used to respond to requests to approve RVARY command processing, where SWITCH is the response
    to a request to switch RACF databases or change the operating mode of RACF, and STATUS is the response to a request to
    change RACF or database status from ACTIVE to INACTIVE or from INACTIVE to ACTIVE.
  rationale: Strengthens security of RVARY passwords by protecting them with the KDFAES password hashing algorithm.
  impact: 'The action should not be performed until all system sharing the RACF database are IPLed with the PTF for OA65905.
    Notes: • In a sharing environment, the action need only be performed once, from any one ofthe sharing systems • The action
    can be performed immediately on a non-sharing system'
  references: []
  page_start: 42
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the following messages are present:

    INSTALLATION DEFINED RVARY SWITCH KDFAES PASSWORD IS IN EFFECT.

    INSTALLATION DEFINED RVARY STATUS KDFAES PASSWORD IS IN EFFECT.'
  remediation: 'To modify modify the RVARYPW parameter use the RACF SETROPTS command:

    SETROPTS RVARYPW(SWITCH(xxxxx) STATUS(yyyyy) KDFAES)

    Note: You may use your existing passwords. SETROPTS does not keep a

    history for RVARY passwords.'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Verify the following messages are present:

      INSTALLATION DEFINED RVARY SWITCH KDFAES PASSWORD IS IN EFFECT.

      INSTALLATION DEFINED RVARY STATUS KDFAES PASSWORD IS IN EFFECT.'
    severity: medium
