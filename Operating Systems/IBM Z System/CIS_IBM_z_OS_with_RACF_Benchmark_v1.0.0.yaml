    Verify That all profiles in the WRITER class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access'
  remediation: "To activate the WRITER class use the RACF SETROPTS command:\nSETROPTS CLASSACT(WRITER)\nTo enable generic\
    \ profile checking for the WRITER class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(WRITER)\nTo modify the UACC,\
    \ WARN, or AUDIT settings for a general resource profile use the\nRACF RALTER and SETROPTS commands:\nRALTER WRITER <profile>\
    \ +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nTo remove a non-compliant GAC entry you need to use both RACF\
    \ RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\nNote: Access\
    \ gained via global access checking is not logged, so caution\nmust be used when making changes to GAC entries.\nTo disable\
    \ GAC for a class you will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS to\
    \ fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that WRITER appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that WRITER appears.

