  profile:
  - Level 1
  description: The statements in the FTP.DATA configuration file specify the parameters and values that control the operation
    of the FTP Server components including the use of anonymous FTP. Several of the parameters must have specific settings
    to provide a secure configuration.
  rationale: Inappropriate values could result in undesirable operations and degraded security. This exposure may result in
    unauthorized access impacting data integrity or the availability of some system services.
  impact: Clients that were previously able to connect to the FTP server without TLS protection will no longer be able to
    do so. In addition, limiting the amount of server information will reduce the amount of server identification information
    that FTP clients may have previously had access to.
