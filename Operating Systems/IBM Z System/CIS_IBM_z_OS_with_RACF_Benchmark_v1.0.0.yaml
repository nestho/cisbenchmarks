- id: 2.1.3
  title: Ensure that the SETROPTS WHEN(PROGRAM) value is active
  scoring: scored
  profile:
  - Level 1
  description: SETROPTS WHEN(PROGRAM) activates RACF program control, which includes both access control to load modules and
    program access to data sets. To set up access control to load modules, you must identify your controlled programs by creating
    a profile for each in the PROGRAM class. To set up program access to data sets, you must add a conditional access list
    to the profile of each program-accessed data set. Then, when program control is active, RACF ensures that each controlled
    load module is executed only by callers with the defined authority. RACF also ensures that each program-accessed data
    set is opened only by users who are listed in the conditional access list with the proper authority and who are executing
    the program specified in the conditional access list entry. Ensure that RACF will perform program control.
  rationale: Not protecting critical programs and not ensuring a clean address space can compromise the security of the processing
    environment. In addition, failure to establish standardized settings for RACF control options introduces the possibility
    of exposure during migration process or contingency plan activation.
  impact: ''
