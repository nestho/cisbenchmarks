    • Any class defined as "generics not recommended" in the Security Server RACF

    Command Language Reference, including but not limited to:

    o CDT

    o CFIELD

    o DIGTCERT

    o DIGTRING

    o IDIDMAP

    o KERBLINK

    o REALM

    o SECLABEL

    o SECLMBR

    • Any installation-defined classes in the dynamic CDT with the

    GENERIC(DISALLOWED) attribute'
  remediation: 'To enable GENERIC for a class use the RACF SETROPTS command:

    SETROPTS GENERIC(<class>)

    Guidelines:

    • If you have GENERIC turned on for the DIGTCERT class when the

    certificate is created or added and its Issuer''s Distinguished Name

    contains any generic characters (*, & and %), a generic certificate

    profile will be created. This generic feature will cause unexpected

    behavior when the certificate is being used by other programs. You

    need to remove it add it back after turning off GENERIC in the

    DIGTCERT class.

    • If a general resource class already has discrete profiles with names

    that contain generic characters (*, &, and %), enabling generic

    profile checking for the class prevents RACF from using those

    discrete profiles for authorization checking.

    • In general, once you activate generic profile checking for a class

    and define generic profiles, avoid deactivating it with the

    NOGENERIC operand. RACF will not use your previously defined

    generic profiles for authorization checking while NOGENERIC is in

    effect.'
