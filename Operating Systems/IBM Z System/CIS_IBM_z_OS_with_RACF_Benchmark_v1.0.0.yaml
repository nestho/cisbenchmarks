- id: '9.30'
  title: Ensure that access to file systems containing critical data is controlled
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Critical data can be stored within zFS file systems. Access to files and directories is controlled by z/OS
    UNIX mechanisms such as UID(0), file ownership, file permission and access control lists. Using profiles in the FSACCESS
    class, you can restrict the ability to cross a mount point into a zFS file system to only those explicitly permitted in
    the profile. This overrides even UID(0) authority. Once you have crossed the mount point, UNIX rules apply when accessing
    files and directories within that file system. File systems containing critical data should be protected with an FSACCESS
    profile.
  rationale: Access at the mount point level is controlled only by RACF security administrators. This provides a clear separation
    of duties in the event that you have UID(0) users. It also provides protection against overly permissive access rules
    in z/OS UNIX made outside the scope of control of the security administrator.
  impact: Use of the FSACCES class can cause increased CPU usage in some environments.
  references: []
  page_start: 695
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that FSACCES appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that FSACCES appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that FSACCES appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the FSACCES entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries covering

    file systems containing critical data

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that profiles covering file systems containing critical data are defined in the

    FSACCES class:

    • Have a UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o IDs authorized to access these resources at this level'
  remediation: "To activate the FSACCES class use the RACF SETROPTS command:\nSETROPTS CLASSACT(FSACCES)\nTo enable generic\
    \ profile checking for the FSACCES class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(FSACCES)\nTo RACLIST the FSACCES\
    \ class use the RACF SETROPTS command:\nSETROPTS RACLIST(FSACCES)\nTo create an FSACCES profile use the RACF RDEFINE and\
    \ PERMIT commands:\nRDEFINE FSACCES <dataset-mask> +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('CROSS A MOUNT POINT INTO\
    \ ZFS FILE SYSTEM')\nPERMIT <dataset-mask> CLASS(FSACCES) +\n ACCESS(READ) ID(<compliant>)\nTo modify the UACC, WARN,\
