    the execution user's password. Jobs submitted by surrogate users run with the identity of the execution user.
  rationale: Failure to control surrogate users could result in unauthorized personnel accessing sensitive resources. This
    exposure may threaten the integrity and availability of the operating system environment and compromise the confidentiality
    of customer data.
