- id: 7.1.3
  title: Ensure CSFINPV2 requires signature verification
  scoring: manual
  profile:
  - Level 1
  description: Certain z/OS load modules can have an associated signature generated by IBM that is verified by the system
    when the module is loaded into system storage for execution. The way to ensure the signature verification occurs is by
    defining a profile in the PROGRAM class with the SIGVER segment.
  rationale: By verifying the IBM generated signature when a module is loaded into storage, the integrity and authenticity
    of the module are guaranteed.
  impact: ''
  references: []
  page_start: 458
