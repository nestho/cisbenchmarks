- id: 1.2.8
  title: Ensure that inapplicable PPT entries have been invalidated
  scoring: manual
  profile:
  - Level 1
  description: The program properties table (PPT) contains entries for special attributes of programs. One of these entries
    indicates whether or not the program is allowed to bypass datasets password protection (PPTNOPAS), or access key protected
    storage. Specifying LINKAUTH=APFTAB in the IEASYSxx member(s) currently active PARMLIB data set(s) allows libraries other
    than those designated as APF to contain authorized modules by adding to this list all libraries in the LNKLST concatenation
    when accessed as part of the linklist concatenation.
  rationale: If invalid or inapplicable PPT entries exist, a venue is provided for the introduction of Trojan Horse modules
    with security bypass capabilities. Failure to specify LINKAUTH=APFTAB allows libraries other than those designated as
    APF to contain authorized modules which could bypass security and violate the integrity of the operating system environment.
    This expanded authorization list inhibits the ability to control exclusion of unauthorized modules.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-OS-000290'
  - '1. IBM z/OS RACF STIG: RACF-OS-000300'
  page_start: 68
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM SYSPPT

    Verify that each privileged PROGRAM NAME entry is valid.

    Note: To determine if a program entry is valid issue the following TSO

    command:

    ISRDDN LOAD <privileged-module>

    If the return message is Load Failed the entry can be considered invalid.

    Issue the following z/OS console command:

    D IPLINFO

    Use the following message to determine the xx suffix values for active PARMLIB

    IEASYSxx members:

    IEASYS LIST=(xx,..)

    Check the current PARMLIB IEASYSxx parameters and look for the LNKAUTH parameter.

    Verify that LNKAUTH=APFTAB.'
  remediation: 'Although you cannot remove entries from the PPT, you can create the effect of

    removing an entry from the PPT by defining the program name in the PARMLIB member

    SCHEDxx without special attributes. This statement overrides the existing entry in the

    PPT, and causes any APF-authorized program with a matching name to run with the

    same attributes as a problem program.

    Update the SCHEDxx member:

    PPT PGMNAME(<privileged-module>)

    Notes:

    • If you specify more than one PPT statement with the same program

    name, the systems accept only the first occurrence of the name

    and issues error message IEF732I for all subsequent occurrences

    of that name.

    • When referring to a DD statement, the system does not honor

    requests for special properties as defined in the PPT.

    Update non-compliant entries in PARMLIB IEASYSxx members and re-IPL the system.'
  checks:
  - type: manual_review
    info: 'Request the following DSMON report:

