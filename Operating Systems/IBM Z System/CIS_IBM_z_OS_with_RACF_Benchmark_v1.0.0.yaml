- id: 7.1.4
  title: Ensure ICSF is configured to start during IPL
  scoring: manual
  profile:
  - Level 1
  description: ICSF can be started in different ways, including manual via a START operator command. To ensure maximum availability
    of ICSF and crypto services, it is best to configure ICSF to be started during the z/OS IPL procedures. This can be done
    by configuring ICSF to start early as described in Chapter 4. "Operating ICSF", Section "Starting ICSF during IPL-time"
    in the ICSF System Programmer's Guide. The ICSF=xx parameter should be specified in IEASYSxx.
  rationale: By configuring ICSF to start during IPL, there is less operator manual intervention required, and more availability
    of crypto services and resources.
  impact: ''
  references: []
  page_start: 460
  audit_raw: 'Ensure the IEASYSxx parmlib member has ICSFPROC and ICSF system parameters,

    e.g.:

    ICSFPROC=CSF2

