- id: 6.5.6
  title: Ensure access to TCP/IP SAF resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: The Communication Server access authorization is used to protect TCP/IP resources such as stack, network, port,
    and other SERVAUTH resources. These resources provide additional security checks for TCP/IP users.
  rationale: Failure to properly secure these TCP/IP resources could lead to unauthorized user access resulting in the compromise
    of some system services and possible compromise of data.
  impact: Initial deployment of these measures may cause some applications or users that have legitimate reasons to access
    a given resource, but were initially unrecognized as such, to be denied access. Once your access control lists are fully
    developed and verified, this impact will no longer be a factor.
  references:
  - '1. IBM z/OS RACF STIG: RACF-TC-000040'
  page_start: 411
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that SERVAUTH appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that SERVAUTH appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that SERVAUTH appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that:

    • The SERVAUTH entry has:

    o -- GLOBAL INACTIVE -- or -- NO ENTRIES --

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify the following GENERIC catch-all profiles are defined in the SERVAUTH class:

    • EZA.** or EZA.* or EZA.*.**

    • EZB.** or EZB.* or EZB.*.**

    • IST.** or IST.* or IST.*.**

    Verify that those GENERIC catch-all profiles defined in the SERVAUTH class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Systems Programmers

    Verify that any EZB.INITSTACK prefixed profiles defined in the SERVAUTH class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o IDs authorized to access these resources at this level

    Note: Access to EZB.INITSTACK prefixed profiles allows access to a

    TCP/IP stack during the period of time after the stack is active but before

    Application Transparent Transport Layer Security (AT-TLS) policies are

    loaded and enforced. This means an ID could potentially open a socket

    connection without an encryption policy being applied. It should strictly be

    limited to IDs associated with the TCP/IP stack bootstrap process.

    Verify that any EZB.FTP.*.*.ACCESS.HFS profiles defined in the SERVAUTH class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Systems Programmers

    o IDs authorized to access these resources at this level

    Note: Access should be limited to FTP users with specific written

    documentation showing a valid requirement exists to access z/OS UNIX

    files and directories via FTP.

    Verify that any EZB.FTP.*.*.ACCESS.JES profiles defined in the SERVAUTH class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o System programmers

    o Systems Programmers

    o IDs authorized to access these resources at this level

    Note: Access should be limited to FTP users with specific written

    documentation showing a valid requirement exists to access FTP JES

    mode.'
  remediation: "To activate RACF classes use the RACF SETROPTS command:\nSETROPTS CLASSACT(SERVAUTH)\nTo enable generic profile\
    \ checking for a RACF class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(SERVAUTH)\nTo RACLIST a RACF class use the\
    \ RACF SETROPTS command:\nSETROPTS RACLIST(SERVAUTH)\nTo create catch-all profiles use the RACF RDEFINE command:\nRDEFINE\
    \ SERVAUTH EZA.** +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('CATCH-ALL PROFILE')\nRDEFINE SERVAUTH EZB.** +\n\
    \ UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('CATCH-ALL PROFILE')\nRDEFINE SERVAUTH EZB.INITSTACK.** +\n UACC(NONE)\
    \ +\n AUDIT(ALL(READ)) +\n DATA('ACCESS TCP/IP STACK BEFORE AT-TLS POLICIES HAVE BEEN\nINSTALLED')\nRDEFINE SERVAUTH EZB.FTP.*.*.ACCESS.HFS\
    \ +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('ACCESS UNIX ENVIRONMENT VIA FTP')\nRDEFINE SERVAUTH EZB.FTP.*.*.ACCESS.JES\
    \ +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('ACCESS FTP JES MODE')\nRDEFINE SERVAUTH IST.** +\n UACC(NONE) +\n\
    \ AUDIT(FAILURES(READ)) +\n DATA('CATCH-ALL PROFILE')\nSETROPTS REFRESH RACLIST(SERVAUTH)\nTo modify the UACC, WARN, or\
    \ AUDIT settings for a profile use the RACF RALTER\ncommand:\nRALTER SERVAUTH <profile> +\n UACC(NONE) +\n AUDIT(FAILURES(READ))\
    \ +\n NOWARNING\nSETROPTS REFRESH RACLIST(SERVAUTH)\nTo remove a non-compliant access list entries use the RACF PERMIT\
    \ command:\nPERMIT <profile> CLASS(SERVAUTH) +\n DELETE ID(<non-compliant>)\nSETROPTS REFRESH RACLIST(SERVAUTH)\nTo remove\
    \ a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\n\
    SETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access checking is not logged, so caution\nmust be used\
    \ when making changes to GAC entries.\nTo disable GAC for a class you will need to use both RACF RDELETE to remove the\n\
    associated GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH\
    \ GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that SERVAUTH appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that SERVAUTH appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that SERVAUTH appears.

      Request the following DSMON report:

      FUNCTION SYSTEM RACGAC

      Verify that:

      • The SERVAUTH entry has:

      o -- GLOBAL INACTIVE -- or -- NO ENTRIES --

      Request reports generated usi'
