- id: 2.2.17
  title: Ensure that access to VTAMAPPL resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: 'You can use resources in the VTAMAPPL class to control which users can open the application control block
    (ACB) indicated by a VTAM application program when the user is not running an APF-authorized program or command processor.
    Note: APF-authorized applications, such as APPC and TSO/E, do not need authorization in the VTAMAPPL class to open an
    ACB.'
