- id: 2.1.11
  title: Ensure that RACF remote sharing connections use the TCP/IP protocol
  scoring: scored
  profile:
  - Level 1
  description: Each individual RACF remote sharing (RRSF) connection to a remote node can use either the original APPC protocol
    or the newer TCP/IP protocol. TCP/IP allows for much stronger protection of the communications using AT-TLS (Application
    Transparent TLS) technology, complimented by technology such as z/OS Encryption Readiness Technology (zERT) that can monitor
    the sets of cryptographic algorithms used to protect communications.
  rationale: APPC can only use DES-based encryption, which is far weaker than the encryption offered by TCP/IP.
  impact: ''
  references: []
