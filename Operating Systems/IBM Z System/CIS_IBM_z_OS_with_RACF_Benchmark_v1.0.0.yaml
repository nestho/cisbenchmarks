    \ SERVER ALIAS\")\nSETROPTS REFRESH WHEN(PROGRAM)\nTo modify the UACC, WARN, or AUDIT settings for a general resource\
    \ profile use the\nRACF RALTER command:\nRALTER PROGRAM <profile> +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n NOWARNING\n\
