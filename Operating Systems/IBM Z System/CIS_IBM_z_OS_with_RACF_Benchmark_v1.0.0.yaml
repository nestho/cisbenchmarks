    PERMIT ICHBLP CLASS(FACILITY) +\n ACCESS(UPDATE) ID(STGADMIN OPERATOR SYSPROG)\nSETROPTS REFRESH RACLIST(FACILITY)\nTo\
    \ modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER and\nSETROPTS commands:\nRALTER FACILITY\
    \ ICHBLP +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nSETROPTS REFRESH RACLIST(FACILITY)\nTo remove a non-compliant\
    \ access list entry use the RACF PERMIT and SETROPTS\ncommands:\nPERMIT ICHBLP CLASS(FACILITY) +\n DELETE ID(<non-compliant>)\n\
    SETROPTS REFRESH RACLIST(FACILITY)\nTo remove a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS\
    \ commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access\
    \ checking is not logged, so caution\nmust be used when making changes to GAC entries.\nTo disable GAC for a class you\
    \ will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS to fully disable GAC for\
    \ the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
  checks:
