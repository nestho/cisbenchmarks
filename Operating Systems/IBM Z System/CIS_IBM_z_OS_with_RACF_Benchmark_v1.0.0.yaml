  remediation: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the AUDIT CLASSES = section.

    Verify that all ACTIVE classes appear.

    Remediation Procedure

    To enable AUDIT for all classes use the RACF SETROPTS command:

    SETROPTS AUDIT(*)

    Notes:

    • It is generally recommended to activate auditing for all classes via

    (*) to ease administrative overhead. INACTIVE classes will not

    generate audit records so there is no disadvantage to enabling the

    option.

    • If you activate auditing for a class using SETROPTS AUDIT, RACF

    activates auditing for all classes in the class descriptor table that

    have the same POSIT value as the class you specify. For example,

    the classes TIMS, GIMS, and AIMS all have a POSIT value of 4 in

    their respective class descriptor table entries. If you activate

    auditing for any one of these classes, you activate auditing for all of

    them.'
