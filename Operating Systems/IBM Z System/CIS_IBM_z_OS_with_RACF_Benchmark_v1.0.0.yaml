    2 (used by the CANCEL TSO command) and the cancel function of the job modify SSI 85. Canceling jobs can cause the job
    to terminate the current phase of processing and optionally purge the job from the system.
  rationale: Failure to properly control access to canceling jobs could result in unauthorized personnel disrupting normal
    system operations or unauthorized users terminate required jobs.
