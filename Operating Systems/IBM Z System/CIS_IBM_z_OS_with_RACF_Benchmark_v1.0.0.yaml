- id: 8.3.13
  title: Ensure that access to JESJOBS START resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a START high-level qualifier in the JESJOBS resource class control the use of the start function
    of the job modify SSI 85. Starting a job causes a job to begin processing immediately (starting an initiator if required).
    This could cause a job to begin processing prematurely.
