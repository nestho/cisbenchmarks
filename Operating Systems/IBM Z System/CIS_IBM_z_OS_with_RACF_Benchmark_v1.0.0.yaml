    \ PROFILE')\nTo modify the WARN, or AUDIT settings for a general resource profile use the RACF\nRALTER and SETROPTS commands:\n\
    RALTER JESINPUT <profile> +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nTo remove a non-compliant GAC entry you need to use\
