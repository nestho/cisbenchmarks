- id: '3.15'
  title: Ensure that SETROPTS REALDSN is in effect
  scoring: scored
  profile:
  - Level 1
  description: 'If your installation is using the naming conventions table or installation exits to convert data set names,
    you can specify that RACF put the actual data set names used by RACROUTE REQUEST=AUTH and REQUEST=DEFINE into any SMF
    log record and operator messages by enabling the SETROPTS REALDSN option. Note: This option has no effect on single-qualifier
    data set names (unless they have been modified by the naming conventions table or an exit routine), whose real data set
    names continue to be the prefixed ones.'
  rationale: Enabling the REALDSN option ensures that log printouts and operator messages identify data sets by their real
    names rather than by the data set names that are created by installation exit routines to conform to RACF naming conventions.
  impact: ''
  references: []
  page_start: 301
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the following message is present:

    REAL DATA SET NAMES OPTION IS ACTIVE'
  remediation: 'To enable REALDSN use the RACF SETROPTS command:

    SETROPTS REALDSN'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

