- id: '9.20'
  title: Ensure that access to data sets used as step libraries in /etc/steplib is controlled
  scoring: scored
  profile:
  - Level 1
  description: The STEPLIBLIST parameter specifies the pathname of the HFS file that contains the list of MVS data sets that
    are used as step libraries for programs that have the set user id or set group id permission bit set. The use of STEPLIBLIST
    is at the site’s discretion, but if used the value of STEPLIBLIST should be /etc/steplib. All update and alter access
    to the MVS data sets in the list will be logged and only systems programming personnel should be authorized to update
    the data sets.
  rationale: Insufficient protection of these data sets can cause the environment to become compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000120'
  page_start: 668
  audit_raw: 'Request a list of data sets defined in active /etc/steplib.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the DATASET entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering

    data sets defined in /etc/steplib

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that data sets defined in /etc/steplib are secured by RACF profiles in the

    DATASET class that:

    • Have UACC of NONE or READ

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(UPDATE) and FAILURES(READ)

    • ID(*) is not used to grant access higher than READ

    • UPDATE and higher permits are restricted to:

    o Systems Programmers'
  remediation: "To create a DATASET profile use the RACF ADDSD and PERMIT commands:\nADDSD '<steplib-dataset>' GENERIC +\n\
    \ UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n DATA('CAN BE USED AS STEPLIB LIBRARY FOR SETUID PROGRAMS')\n\
    PERMIT '<steplib-dataset>' GENERIC +\n ACCESS(READ) ID(*)\nPERMIT '<steplib-dataset>' GENERIC +\n ACCESS(ALTER) ID(SYSPROG)\n\
    SETROPTS REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF\nALTDSD\
    \ command:\nALTDSD '<steplib-dataset>' GENERIC +\n UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n NOWARNING\n\
    SETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant access list entries use the RACF PERMIT command:\nPERMIT\
    \ '<steplib-dataset>' GENERIC +\n DELETE ID(<non-compliant>)\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant\
    \ GAC entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS\
    \ REFRESH GLOBAL(<class>)\nNote: Access gained via global access checking is not logged, so caution\nmust be used when\
    \ making changes to GAC entries.\nTo disable GAC for a class you will need to use both RACF RDELETE to remove the\nassociated\
    \ GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\n\
    SETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Request a list of data sets defined in active /etc/steplib.

      Request the following DSMON report:

      FUNCTION SYSTEM RACGAC

