- id: '9.10'
  title: Ensure that z/OS UNIX automount configuration files are configured with compliant values
  scoring: scored
  profile:
  - Level 1
  description: Parameter settings in PARMLIB and /etc specify values for z/OS UNIX security controls, in particular, the automount
    facility. The automount facility can automatically mount file systems at the time they are accessed, and also unmount
    them later. Undesirable values can allow users to gain inappropriate privileges that could impact data integrity or the
    availability of some system services.
  rationale: The parameters of the automount facility should be set so they are securely mounted by the automount facility,
    and the users prevented to execute any file from a file-system using the user of the UNIX user or group owner other that
    file. If not set, these parameters would allow a user to elevate their rights.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000170'
  page_start: 643
  audit_raw: 'Review the logical PARMLIB data sets (ex. SYS1.PARMLIB(BPXPRMxx)) for the following

    type of FILESYSTYPE entry:

    FILESYSTYPE TYPE(AUTOMNT) ENTRYPOINT(BPXTAMD)

    Verify that for any TYPE(AUTOMNT) entries:

    • Each MapName file specifies setuid NO and security YES'
