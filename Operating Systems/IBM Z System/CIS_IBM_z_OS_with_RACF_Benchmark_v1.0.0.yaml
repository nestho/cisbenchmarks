- id: 2.3.5
  title: Ensure that the ACEECHK resource class is enabled
  scoring: scored
  profile:
  - Level 2
  description: The ACEE (Accessor Environment Element) is a control block that contains a description of a user's security
    environment, including user ID, current connect group, user attributes, and group authorities. An ACEE is constructed
    during user identification and verification, using information in the user's RACF profile, and is anchored in the user's
    address space. It is referenced by RACF during command and resource authorization processing to determine if the user
    is allowed to perform a given action or access a given resource. An application running in an authorized state can make
    modifications directly to the ACEE in storage after its creation. Such a modification would be outside the involvement
    of the security product, and the application must take caution to ensure that such updates do not interfere with normal
    system processing. This is not necessarily malicious, but the behavior should be visible to make sure that any modification
    in the user's ACEE complies with the organization's security policy.
  rationale: When the ACEECHK class is active and RACLISTed, RACF command and authorization processing will detect certain
    changes made to the ACEE that affect authorization. When a modification is detected, RACF issues message IRR421I to the
    security console that contains information to help determine whether the modification is expected.
  impact: Careful thought and planning should precede any decision to enable the failure option by defining a fully qualified
    IRR.ABEND.ON.FAILURE profile in the ACEECHK class. The results of an abend on an application can be unpredictable and
    largely depend on the recovery mechanisms in place for the programs running in the environment.
  references: []
  page_start: 226
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that ACEECHK appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that ACEECHK appears.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that any IRR.EXCLUDE prefixed profile in the ACEECHK class has a documented

    justification.

    Note: When RACF detects an ACEE modification it will check the

    ACEECHK class for the existence of a best fit IRR.EXCLUDE prefixed profile,

    which enables IRR421I message suppression when the behavior is

    expected by the site.'
  remediation: 'To activate the ACEECHK class use the RACF SETROPTS command:

    SETROPTS CLASSACT(ACEECHK)

    To RACLIST the ACEECHK class use the RACF SETROPTS command:

    SETROPTS RACLIST(ACEECHK)'
