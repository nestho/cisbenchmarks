  description: SMF data collection provides a standardized method for recording all system activity to a recording media (file
    or logstream). including the audit trails from RACF. All SMF records are uniquely identified by a type and an optional
    subtype value. The type and subtype values reside in the header portion of the SMF record. A record type can reside in
    the Standard SMF record header or in the Extended SMF record header. Subtype values always reside in the Standard SMF
    record header.
  rationale: If the required SMF data record types are not being collected, then accountability cannot be monitored, and its
    use in the execution of a contingency plan could be compromised.
