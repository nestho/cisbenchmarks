- id: 7.3.6
  title: Ensure access to ICSF key data sets is controlled
  scoring: manual
  profile:
  - Level 1
  description: ICSF has three key data sets (KDS) which are used to store cryptographic keys for application use. The three
    are the CKDS for CCA symmetric keys (AES, DES, HMAC), the PKDS for CCA asymmetric keys (RSA, ECC, QSA), and the TKDS for
    PKCS#11 tokens and key objects. These key data sets need to be protected to avoid damage or destruction to critical key
    material.
  rationale: The ICSF key data sets are critical to the system and a RACF profile in the DATASET class is required to ensure
    no malicious or inadvertent damage can occur.
  impact: ''
  references: []
  page_start: 490
  audit_raw: 'Issue the following z/OS console command:

    DISPLAY ICSF,KDS

    Note the names of active ICSF Key Data Sets.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the DATASET entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering

    ICSF key data sets

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that ICSF key data sets are secured by RACF profiles in the DATASET class that:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o The ICSF started task

    o The user ID used by any back up batch jobs

    Note: Temporary ALTER access my be needed by administrators

    responsible for performing a coordinated master key change, converting

    KDS record formats, or other such maintenance tasks.'
  remediation: "To create a DATASET profile use the RACF ADDSD and PERMIT commands:\nADDSD 'CSF.KDS.**' GENERIC +\n UACC(NONE)\
    \ +\n AUDIT(ALL(READ)) +\n DATA('ICSF KEY DATA SETS')\nPERMIT 'CSF.KDS.**' GENERIC +\n ACCESS(ALTER) ID(<icsf-id>)\nSETROPTS\
    \ REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF\nALTDSD command:\n\
    ALTDSD 'CSF.KDS.**' GENERIC +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n NOWARNING\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove\
    \ a non-compliant access list entries use the RACF PERMIT command:\nPERMIT 'CSF.KDS.**' GENERIC +\n DELETE ID(<non-compliant>)\n\
    SETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS\
    \ commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access\
    \ checking is not logged, so caution\nmust be used when making changes to GAC entries.\nTo disable GAC for a class you\
    \ will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS to fully disable GAC for\
    \ the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
