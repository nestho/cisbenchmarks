    \ +\n DFLTGRP(OMVSGRP) +\n NOPASSWORD +\n DATA('OMVS KERNEL') +\n OMVS( +\n UID(0) SHARED +\n HOME('/') +\n PROGRAM('/bin/sh')\
    \ +\n )\nCONNECT OMVSKERN +\n GROUP(OMVSGRP) +\n OWNER(OMVSGRP)\nNotes:\n1. AUTOGID is only available if the site has\
    \ enabled automatic\nassignment of unique UNIX identities.\n2. The HOME and PROGRAM values are case sensitive."
  checks:
