  title: Ensure that RESTRICTED users cannot access UNIX files to which they are not explicitly permitted
  scoring: scored
  profile:
  - Level 1
  description: 'A user with the RESTRICTED attribute cannot access RACF protected resources by default mechanisms: the universal
    access of a profile (UACC), ID(*) in an access list, or the global access table. However, this restriction does not automatically
    apply to UNIX files.'
  rationale: RESTRICTED users may be able to access information they are not intended to have, by virtue of a file's other
    permission bits.
