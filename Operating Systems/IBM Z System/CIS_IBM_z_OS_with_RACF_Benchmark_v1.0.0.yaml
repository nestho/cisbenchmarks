- id: '9.24'
  title: Ensure rlogin is not active
  scoring: manual
  profile:
  - Level 1
  description: The rlogin command enables log in to a remote system and navigate through the remote file system and manipulate
    its contents, copy files, or execute remote commands.
  rationale: rlogin server processing operates in clear text and therefore should be disabled.
  impact: ''
  references: []
