- id: 8.1.1
  title: Ensure that access to JES2 system commands is controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 system commands are used to control JES2 resources and the operating system environment. Failure to properly
    control access to JES2 system commands could result in unauthorized personnel issuing sensitive JES2 commands.
  rationale: If commands are not protected, this may threaten the integrity and availability of the operating system environment
    and compromise the confidentiality of customer data. While JES2 operator commands cannot directly access sensitive data,
    it could change the routing of data such that it is available in an inappropriate environment.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000070'
