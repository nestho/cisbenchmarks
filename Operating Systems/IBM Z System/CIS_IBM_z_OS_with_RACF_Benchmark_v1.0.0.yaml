  - Level 1
  description: SETROPTS AUDIT specifies the names of the classes for which you want RACF to perform auditing. For the classes
    you specify, RACF logs all uses of the RACROUTE REQUEST=DEFINE SVC and all changes made to profiles by RACF commands.
    When the class specified is USER, RACF logs all password and password phrase changes made by RACROUTE REQUEST=VERIFY.
  rationale: The improper setting of this field can compromise the security of the z/OS environment. In addition, failure
    to establish standardized settings for RACF SETROPTS options introduces the possibility of exposure during migration process
    or contingency plan activation.
