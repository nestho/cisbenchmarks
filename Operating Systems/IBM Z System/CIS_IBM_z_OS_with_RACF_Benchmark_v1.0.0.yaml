- id: '9.3'
  title: Ensure that general users are not allowed to change their file ownership
  scoring: scored
  profile:
  - Level 1
  description: By default, only superusers can change the ownership of any file to any UID or GID on the system, and general
    users can only change the group ownership of files that they own, and only to one of their own associated GID. However,
    by defining a profile called CHOWN.UNRESTRICTED in the UNIXPRIV class, selected users can be permitted to transfer ownership
    of files they own to any UID or GID on the system. This is a less secure configuration.
  rationale: Only highly trusted users should be allowed to change UNIX file ownership.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000010'
  page_start: 626
  audit_raw: 'Request reports generated using IRRDBU00 output that will allow you to:

    Verify that a fully qualified profile named CHOWN.UNRESTRICTED is absent in the

    UNIXPRIV class.'
  remediation: 'To remove a UNIXPRIV profile use the RACF RDELETE command:

    RDELETE UNIXPRIV CHOWN.UNRESTRICTED'
  checks:
  - type: manual_review
    info: 'Request reports generated using IRRDBU00 output that will allow you to:

      Verify that a fully qualified profile named CHOWN.UNRESTRICTED is absent in the

      UNIXPRIV class.'
    severity: medium
