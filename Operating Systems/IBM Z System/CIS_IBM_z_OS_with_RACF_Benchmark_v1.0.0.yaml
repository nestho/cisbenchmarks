- id: 8.5.1
  title: Ensure that access to the data sets used by JES2 is controlled
  scoring: scored
  profile:
  - Level 1
  description: The JES2 System data sets are a common repository for all jobs submitted to the system and the associated printout
    and configuration of the JES2 environment. Initialization data sets can contain NJE and RJE signon passwords and need
    to be protected unintended access.
  rationale: Allowing READ access to the SPOOL data set would allow an unauthorized user to access any data that resides on
    spool compromising the confidentiality of customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000420'
  page_start: 590
  audit_raw: 'JES2 system data sets include:

    • JES2 initialization parameters

