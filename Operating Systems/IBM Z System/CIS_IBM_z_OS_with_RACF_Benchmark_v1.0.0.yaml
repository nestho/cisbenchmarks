- id: 6.2.5
  title: Ensure user exits for the FTP server are not used without approval
  scoring: manual
  profile:
  - Level 1
  description: Several user exit points in the FTP Server component are available to permit customization of its operating
    behavior. These exits can be used to modify functions such as FTP command usage, client connection controls, post processing
    tasks, and SMF record modifications. Proper review and documentation of these exit programs will avoid unintentional compromise
    of FTP and system security, integrity and availability.
  rationale: Without proper review and adequate documentation of these exit programs, undesirable operations and degraded
    security may result. This exposure could lead to unauthorized access impacting data integrity or the availability of some
    system services or contribute to the loss of accountability and hamper security audit activities.
  impact: If exits were previously in use, and the reviews find them to be insufficient from a security, integrity or availability
    point of view, the functions provided by those exits may become unavailable until the exit can be brought up to local
    standards.
  references:
  - '1. IBM z/OS RACF STIG: RACF-FT-000090'
  page_start: 360
  audit_raw: '1. Refer to the Data configuration file specified on the SYSFTPD DD statement in the

    FTP started task JCL.

    o Refer to the file(s) allocated by the STEPLIB DD statement in the FTP

    started task JCL.

    o Refer to the libraries specified in the system LINKLIST and LPA. If any

    FTP Server exits are in use, identify them and validate that they were

    reviewed for integrity and approved by the site.

    2. Ensure the following items are in effect for FTP Server user exits:

    o The FTCHKCMD, FTCHKIP, FTCHKJES, FTCHKPWD, FTPSMFEX and FTPOSTPR

    modules are not located in the FTP daemon''s STEPLIB, LINKLIST, or LPA.

    ▪ Note: The ISPF ISRFIND utility can be used to search

    the system LINKLIST and LPA for specific modules.

    o If any FTP Server user exits are implemented, the site must have written

    approval from site ISSM to install and use the exits.

    o If any FTP Server user exits are implemented, the site must have the site

    systems programmer verify the exit was securely written and installed.'
  remediation: 'Review the configuration statements in the FTP.DATA file. Review the FTP daemon

    STEPLIB, system LINKLIST, and Link Pack Area libraries. If FTP Server exits are

    enabled or present and have not been approved by the site IAM and not securely

    written and implemented by the site systems programmer, they should not be installed.

    Verify that none of the following exits are installed unless they have met the

    requirements listed above:

    • FTCHKCMD

    • FTCHKIP

    • FTCHKJES

    • FTCHKPWD

    • FTPOSTPR

    • FTPSMFEX'
