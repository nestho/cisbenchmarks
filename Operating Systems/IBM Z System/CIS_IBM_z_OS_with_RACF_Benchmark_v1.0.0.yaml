- id: 2.3.6
  title: Ensure that SETROPTS ENHANCEDGENERICOWNER is in effect
  scoring: scored
  profile:
  - Level 1
  description: 'SETROPTS GENERICOWNER restricts the creation of profiles in all general resource classes except the PROGRAM
    class. To create a profile that is more specific than any existing profile protecting the same resource a user must: •
    Have the SPECIAL attribute • Be the OWNER of the existing profile • Have the group-SPECIAL attribute if a GROUP owns the
    profile • Have the group-SPECIAL attribute if the OWNER of the profile is in the scope of the GROUP. SETROPTS ENHANCEDGENERICOWNER
    enables the same functionality as, but also prevents the creation of a more specific profile if the more specific profile
    is created in the grouping class and is specified on the ADDMEM operand. Note: Both the GENERICOWNER and ENHANCEDGENERICOWNER
    options only affect the ability to create new profiles, or add new members to a grouping profile. These options have no
    effect on permission to resources, or on the ability to alter the definitions of resource profiles.'
  rationale: This offers enhanced restrictions on the creation of profiles for general resources.
  impact: Issuing SETROPTS GENERICOWNER or ENHANCEDGENERICOWNER can prevent users with the CLAUTH attribute in general resource
    classes from creating profiles as they are accustomed to. Therefore, make these users OWNER of appropriate top generic
    profiles in the class.
  references: []
  page_start: 228
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the following message is present:

    ENHANCED GENERIC OWNER ONLY IS IN EFFECT'
  remediation: 'To enable ENHANCEDGENERICOWNER use the RACF SETROPTS command:

    SETROPTS ENHANCEDGENERICOWNER'
