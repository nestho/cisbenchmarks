- id: 1.3.2
  title: Ensure that SYS1.UADS contains only recovery user IDs
  scoring: manual
  profile:
  - Level 1
  description: SYS1.UADS is a dataset where user IDs are be maintained with applicable password information for whenever RACF
    is not functional.
  rationale: If an unauthorized user has access to SYS1.UADS they could enter their user ID and password into the SYS1.UADS
    dataset and could give themselves access to the system.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000040'
  page_start: 85
  audit_raw: 'Issue the following TSO command:

    ACCOUNT

    Issue the following ACCOUNT sub-command to list all entries in SYS1.UADS:

    LIST (*)

    Verify that only recovery IDs are defined in SYS1.UADS.

    If there are recovery IDs defined in SYS1.UADS, request IRRUT100 cross reference

    output and reports generated using IRRDBU00 output that will allow you to:

    Verify that the recovery user IDs defined in SYS1.UADS have a paired RACF user ID

    with limited privileges:

    • User ID has the PROTECTED attribute

    • User ID has the RESTRICTED attribute

    • User ID has the UAUDIT attribute

    • User ID has been revoked

    • User ID does not appear on any RACF data set or general resource access list

    • User ID does not have any segments beyond base (ex. no OMVS segment)

    • User ID does not have any extra system or group privileges (ex. ROAUDIT,

    CLAUTH, group-JOIN, etc.)'
  remediation: "To remove a user ID from SYS1.UADS use the TSO ACCOUNT-DELETE subcommand:\nACCOUNT\nDELETE (<user-id>)\nEND\n\
    Use the RACONVRT command if needed as an aid in converting users from SYS1.UADS to\nthe RACF database:\nRACONVRT INCLUDE\
    \ USERID(userid)\nNotes:\n• If RACF is installed and active, you require RACF SPECIAL\nauthority to issue the command.\n\
    • RACONVRT generates the RACF commands needed to update or\ncreate RACF user profiles, and places these commands into\n\
    members of a partitioned data set. This data set,\n<prefix>.IKJ.RACONVRT.CLIST, contains the commands\nnecessary to convert\
    \ to the RACF data base. RACONVRT creates,\nbut does not execute the RACF commands; therefore, you can edit\nand change\
    \ the data set's members to customize the conversion\nprocess before issuing the RACF commands.\nTo modify RACF entries\
    \ for recovery user IDs use the RACF ALTUSER or CONNECT\ncommands:\nALTUSER <user-id> +\n NOPASSWORD +\n RESTRICTED +\n\
    \ UAUDIT +\n REVOKE +\n NOSPECIAL +\n NOAUDIT +\n NOPERATIONS +\n NOROAUDIT +\n NOTSO +\n NOOMVS +\n NOCICS\nCONNECT <user-id>\
    \ +\n GROUP(<group>) +\n AUTHORITY(USE) +\n NOAUDITOR +\n NOOPERATIONS +\n NOSPECIAL\nTo remove a non-compliant access\
    \ list entries use the RACF PERMIT command:\nPERMIT <profile> CLASS(<class>) +\n DELETE ID(<non-compliant>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      ACCOUNT

      Issue the following ACCOUNT sub-command to list all entries in SYS1.UADS:

      LIST (*)

      Verify that only recovery IDs are defined in SYS1.UADS.

      If there are recovery IDs defined in SYS1.UADS, request IRRUT100 cross reference

      output and reports generated using IRRDBU00 output that will allow you to:

      Verify that the recovery user IDs defined in SYS1.UADS have a paired RACF user ID

      with limited privileges:

      • User ID has the PROTECTED attribute

      • User ID has the R'
    severity: medium
- id: 1.3.3
  title: Ensure that MCS console user IDs are protected
  scoring: manual
  profile:
  - Level 1
  description: MCS consoles can be used to issue operator commands. When using the LOGON(AUTO) control, a user with the name
    of the MCS console will be used for access checking.
  rationale: Failure to control access to MCS consoles could result in unauthorized personnel issuing sensitive operator commands.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000690'
  page_start: 88
  audit_raw: 'Review the current PARMLIB CONSOLxx members.

    For each console name found request IRRUT100 cross reference output and reports

    generated using IRRDBU00 output that will allow you to:

    Verify that the <console-name> has been defined in RACF as a user ID with limited

    privileges:

    • Have the PROTECTED attribute

    • Have the RESTRICTED attribute

    • Does not have any segments beyond base (ex. no OMVS segment)

    • Does not have any extra system or group privileges (ex. ROAUDIT, CLAUTH,

    group-JOIN, etc.)

    • Does not appear on any RACF data set or general resource access lists.

    Exceptions are:

    o A paired MVS.MCSOPER.<console-name> profile in the OPERCMDS class

    o A paired <console-name> profile in the CONSOLE class

    Note: If LOGON(AUTO) is specified in the currently active CONSOLxx parmlib

    member additional access may be required. Permissions for the console

    userids or console group may be given to the following resources at the

    discretion of the site:

    Class Resource Access

    OPERCMDS MVS.CONTROL READ

    OPERCMDS MVS.DISPLAY READ

    OPERCMDS MVS.MONITOR READ

    OPERCMDS MVS.STOPMN READ'
  remediation: "To create dedicated IDs for consoles named in CONSOLxx use the RACF ADDGROUP,\nADDUSER, and CONNECT commands:\n\
    ADDGROUP CONGRP +\n OWNER(<group>) +\n SUPGROUP(<group>) +\n DATA('DEFAULT CONSOLE OWNING GROUP')\nADDUSER <console-name>\
    \ +\n OWNER(CONGRP) +\n DFLTGRP(CONGRP) +\n NOPASSWORD +\n RESTRICTED +\n DATA('MCS CONSOLE ID')\nCONNECT <console-name>\
    \ +\n GROUP(CONGRP) +\n OWNER(CONGRP)\nTo create a paired profiles in the OPERCMDS and CONSOLE classes use the RACF\n\
    RDEFINE and PERMIT commands:\nRDEFINE OPERCMDS MVS.MCSOPER.<console-name> +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n\
    \ DATA('EXTENDED MCS CONSOLE ACCESS') +\n NOWARNING\nPERMIT OPERCMDS MVS.MCSOPER.<console-name> +\n ACCESS(READ) ID(<console-name>)\n\
    RDEFINE CONSOLE <console-name> +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nPERMIT CONSOLE <console-name> +\n\
    \ ACCESS(READ) ID(<console-name>)\nNotes:\n1. Depending on the RACF class settings you may be required to\nissue a RACF\
    \ SETROPTS REFRESH command for updates to be\neffective.\n2. You cannot specify the WHEN operand on the RDEFINE and RALTER\n\
    commands for profiles in the CONSOLE class.\n3. After you define a console in the CONSOLE class and protect it with a\n\
    UACC of NONE, no one can log on to the console until you grant\nusers access authority to the console profile."
  checks:
  - type: manual_review
    info: 'Review the current PARMLIB CONSOLxx members.

      For each console name found request IRRUT100 cross reference output and reports

      generated using IRRDBU00 output that will allow you to:

      Verify that the <console-name> has been defined in RACF as a user ID with limited

      privileges:

      • Have the PROTECTED attribute

      • Have the RESTRICTED attribute

      • Does not have any segments beyond base (ex. no OMVS segment)

      • Does not have any extra system or group privileges (ex. ROAUDIT, CLAUTH,

      group-JOIN, etc.)

      • Does'
    severity: medium
- id: 1.3.4
  title: Ensure that STARTED resource class profiles assign PROTECTED user IDs
  scoring: scored
  profile:
  - Level 1
  description: PROTECTED user IDs are protected from being used to logon to the system and from being revoked through inactivity
    or unsuccessful attempts to access the system using incorrect passwords and password phrases. However, they can be revoked
    using the ALTUSER REVOKE command.
  rationale: We recommend assigning PROTECTED user IDs to z/OS UNIX, and to the UNIX daemons, started procedures, applications,
    servers or subsystems associated with z/OS UNIX, to minimize their exposure to inadvertent or malicious misuse or revocation.
  impact: A PROTECTED user ID cannot be used to enter the system by any method that uses, a supplied password, such as TSO
    logon, CICS signon, PassTicket authentication, z/OS UNIX rlogin, batch job submission when a password is specified using
    the PASSWORD parameter of the JOB statement, or by supplying a password phrase. Before assigning the PROTECTED attribute
    to a user ID, you should ensure that the user ID will not be used in any situation where specification of a password,
    PassTicket, or password phrase is required.
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000720'
  page_start: 92
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM RACSPT

    Use the ASSOCIATED USER column to generate the list of user IDs to review.

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that the started task RACF user ID:

    • Has the PROTECTED attribute'
  remediation: "To make a user ID PROTECTED use the RACF ALTUSER command:\nALTUSER <user-id> +\n NOPASSWORD +\n NOPHRASE +\n\
    \ NOOIDCARD"
  checks:
  - type: manual_review
    info: 'Request the following DSMON report:

      FUNCTION SYSTEM RACSPT

      Use the ASSOCIATED USER column to generate the list of user IDs to review.

      Request reports generated using IRRDBU00 output that will allow you to:

      Verify that the started task RACF user ID:

      • Has the PROTECTED attribute'
    severity: medium
- id: 1.3.5
  title: Ensure that the assignment of RACF CLAUTH authority is justified
  scoring: scored
  profile:
  - Level 1
  description: Users receive the CLAUTH attribute on a class-by-class basis. If a user has the CLAUTH attribute in a class,
    or in a class that shares the same POSIT value in the class descriptor table (CDT), RACF allows the user to utilize a
    subset of commands for delegated administration of profiles in that class.
  rationale: Users with CLAUTH privilege have a delegated control over profiles in the specified class.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'Request reports generated using IRRDBU00 output that will allow you to identify user IDs

    with CLAUTH authority.

    Verify if the assignment is justified for the user.'
  remediation: 'To remove CLAUTH authority the RACF ALTUSER command:

    ALTUSER <user-id> NOCLAUTH(<class-name>)'
  checks:
  - type: manual_review
    info: 'Request reports generated using IRRDBU00 output that will allow you to identify user IDs

      with CLAUTH authority.

      Verify if the assignment is justified for the user.'
    severity: medium
- id: 2.1.1
  title: Ensure that access to DASDVOL and STGADMIN resources are controlled
  scoring: scored
  profile:
  - Level 1
  description: Users responsible for direct access storage device (DASD) administration must be given access to perform necessary
    functions though profiles in the DASDVOL class (for non-SMS volumes) as well as STGADMIN prefixed profiles in the FACILITY
    and XFACILIT classes for SMS managed volumes.
  rationale: Failure to properly control and log access to DASD administration resources reduces the integrity and availability
    of the operating system environment, as well as increases the risk for compromise of confidential data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000150'
  - '2. IBM z/OS RACF STIG: RACF-SM-000040'
  page_start: 97
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that DASDVOL and FACILITY and XFACILIT appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that DASDVOL and FACILITY and XFACILIT appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that DASDVOL and FACILITY and XFACILIT appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that:

    • The DASDVOL entry has:

    o -- GLOBAL INACTIVE -- or -- NO ENTRIES --

    • The FACILITY entry has:

    o -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries

    covering IGG, IHJ, and STGADMIN prefixed resources

    • The XFACILIT entry has:

    o -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entries

    covering STGADMIN prefixed resources

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify the following catch-all profiles are defined:

    • A GENERIC profile in the DASDVOL class named: **

    • A GENERIC profile in the FACILITY class named: STGADMIN.** or STGADMIN.* or

    STGADMIN.*.**

    • A GENERIC profile in the FACILITY class named: STGADMIN.ADR.STGADMIN.**

    or STGADMIN.ADR.STGADMIN.* or STGADMIN.ADR.STGADMIN.*.**

    • A GENERIC profile in the FACILITY class named: STGADMIN.ARC.ENDUSER.** or

    STGADMIN.ARC.ENDUSER.* or STGADMIN.ARC.ENDUSER.*.**

    • A GENERIC profile in the XFACILIT class named: STGADMIN.** or STGADMIN.* or

    STGADMIN.*.**

    • A GENERIC profile in the XFACILIT class named: STGADMIN.IGG.DELAUDIT.**

    or STGADMIN.IGG.DELAUDIT.* or STGADMIN.IGG.DELAUDIT.*.**

    Verify that a fully qualified IGG.CATLOCK profile is defined in the FACILITY class that:

    • Has UACC of NONE

    • Is not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Storage Administrators

    o Systems Programmers

    o IDs authorized to access these resources at this level

    Verify that any IHJ.CHKPT prefixed profiles defined in the FACILITY class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Storage Administrators

    o Systems Programmers

    o IDs authorized to access these resources at this level

    Note: IHJ.CHKPT prefixed profiles are optional profiles a site may define

    for control of checkpoint data sets on shared DASD volumes. This

    reccomendation does not require these profiles be defined, but does

    provide reccomendations if they are defined.

    Verify that the STGADMIN.ADR.STGADMIN catch-all profile in the FACILITY class:

    • Has UACC of NONE

    • Is not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Storage Administrators

    o IDs authorized to access these resources at this level

    Verify that all STGADMIN.ARC.ENDUSER prefixed profiles in the FACILITY class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access greater than READ

    • UPDATE and higher permits are restricted to:

    o Storage Administrators

    o IDs authorized to access these resources at this level

    Verify that the STGADMIN.IGG.DELAUDIT.** profile in the XFACILIT class:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Storage Administrators

    o IDs authorized to access these resources at this level

    Verify that any fully qualified STGADMIN.IGG.DEFDEL.UALIAS profile in the FACILITY

    class:

    • Has UACC of NONE

    • Is not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Security Administrators

    o Storage Administrators

    o Systems Programmers

    o IDs authorized to access these resources at this level

    Note: STGADMIN.IGG.DEFDEL.UALIAS is an optional profiles a site may

    define to grant delegated access to define or delete an alias related to a

    usercatalog, for example to allow security personnel to add a catalog alias

    when provisioning a new ID. This reccomendation does not require this

    profile to be defined, but does provide reccomendations if it is defined.

    Verify that all profiles in the DASDVOL class, as well as all remaining STGADMIN prefixed

    profiles in the FACILITY and XFACILIT classes:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Storage Administrators

    o IDs authorized to access these resources at this level

    Note: If the site is using DFSMSrmm for tape management, they may

    choose to permit access to DFSMSrmm resources aligned with

    DFSMSrmm Implementation and Customization Guide guidance. In that

    case refer to the correct version of the Guide for the system''s level of

    support when evaluating permits to STGADMIN.EDG prefixed profiles in the

    FACILITY class.'
  remediation: "To activate RACF classes use the RACF SETROPTS command:\nSETROPTS CLASSACT(DASDVOL)\nSETROPTS CLASSACT(FACILITY)\n\
    SETROPTS CLASSACT(XFACILIT)\nTo enable generic profile checking for a RACF class use the RACF SETROPTS\ncommand:\nSETROPTS\
    \ GENERIC(DASDVOL)\nSETROPTS GENERIC(FACILITY)\nSETROPTS GENERIC(XFACILIT)\nTo RACLIST a RACF class use the RACF SETROPTS\
    \ command:\nSETROPTS RACLIST(DASDVOL)\nSETROPTS RACLIST(FACILITY)\nSETROPTS RACLIST(XFACILIT)\nTo create catch-all profiles\
    \ use the RACF RDEFINE command:\nRDEFINE DASDVOL ** +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('CATCH-ALL PROFILE')\n\
    PERMIT ** CLASS(DASDVOL) +\n ACCESS(ALTER) ID(STGADMIN)\nSETROPTS REFRESH RACLIST(DASDVOL)\nRDEFINE FACILITY IGG.CATLOCK\
    \ +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('CONTROLS WHO CAN LOCK/UNLOCK CATALOGS AND WHO CAN ACCESS LOCKED\n\
    CATALOGS')\nPERMIT IGG.CATLOCK CLASS(FACILITY) +\n ACCESS(ALTER) ID(STGADMIN SYSPROG)\nRDEFINE FACILITY STGADMIN.** +\n\
    \ UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('STORAGE ADMINISTRATION CATCH-ALL PROFILE')\nPERMIT STGADMIN.** CLASS(FACILITY)\
    \ +\n ACCESS(ALTER) ID(STGADMIN)\nRDEFINE FACILITY STGADMIN.ADR.STGADMIN.** +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('DFSMSDSS\
    \ ADMINISTRATOR KEYWORD CATCH-ALL PROFILE')\nPERMIT STGADMIN.ADR.STGADMIN.** CLASS(FACILITY) +\n ACCESS(ALTER) ID(STGADMIN)\n\
    RDEFINE FACILITY STGADMIN.ARC.ENDUSER.** +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('DFSMSHSM USER COMMANDS')\n\
    PERMIT STGADMIN.ARC.ENDUSER.** CLASS(FACILITY) +\n ACCESS(READ) ID(*)\nRDEFINE FACILITY STGADMIN.IGG.DEFDEL.UALIAS +\n\
    \ UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('DEFINE OR DELETE AN ALIAS RELATED TO A USERCATALOG WITHOUT\nFURTHER AUTHORIZATION\
    \ CHECKING')\nPERMIT STGADMIN.IGG.DEFDEL.UALIAS CLASS(FACILITY) +\n ACCESS(ALTER) ID(SECADMIN STGADMIN SYSPROG)\nSETROPTS\
    \ REFRESH RACLIST(FACILITY)\nRDEFINE XFACILIT STGADMIN.** +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n DATA('STORAGE ADMINISTRATION\
    \ CATCH-ALL PROFILE')\nPERMIT STGADMIN.** CLASS(XFACILIT) +\n ACCESS(ALTER) ID(STGADMIN)\nRDEFINE XFACILIT STGADMIN.IGG.DELAUDIT.**\
    \ +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n DATA('ACCESS TO DELETE DATA SET CATALOGED IN SPECIFIED CATALOG\nWITHOUT ALTER\
    \ ACCESS TO DATA SET')\nPERMIT STGADMIN.IGG.DELAUDIT.** CLASS(XFACILIT) +\n ACCESS(ALTER) ID(STGADMIN)\nSETROPTS REFRESH\
    \ RACLIST(XFACILIT)\nTo modify the UACC, WARN, or AUDIT settings for a profile use the RACF RALTER\ncommand:\nRALTER <class>\
    \ <profile> +\n UACC(NONE) +\n AUDIT(FAILURES(READ)) +\n NOWARNING\nTo remove a non-compliant access list entries use\
    \ the RACF PERMIT command:\nPERMIT <profile> CLASS(<class>) +\n DELETE ID(<non-compliant>)\nTo remove a non-compliant\
    \ GAC entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS\
    \ REFRESH GLOBAL(<class>)\nNote: Access gained via global access checking is not logged, so caution\nmust be used when\
    \ making changes to GAC entries.\nTo disable GAC for a class you will need to use both RACF RDELETE to remove the\nassociated\
    \ GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\n\
    SETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that DASDVOL and FACILITY and XFACILIT appears.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that DASDVOL and FACILITY and XFACILIT appears.

      Review the command output in the SETR RACLIST CLASSES = section.

      Verify that DASDVOL and FACILITY and XFACILIT appears.

      Request the following DSMON report:

      FUNCTION SYSTEM RACGAC

      Verify that:

      • The DASDVOL entry has:'
    severity: medium
- id: 2.1.2
  title: Ensure that access to active SMF collection files is controlled
  scoring: scored
  profile:
  - Level 1
  description: SMF data collection is the system activity journaling facility of the z/OS system. With the proper parameter
    designations, it serves as the basis to ensure individual user accountability. SYS1.MANxx datasets should be created once
    and reused when cleared. Update and allocate access to SMF collection files (i.e., SYS1.MANx, logger) are limited to system
    programmers and/or batch jobs that perform SMF dump processing. Control access based on type - separate collection as
    much as possible.
  rationale: Users may have UPDATE access to the datasets, but ALTER allows for dataset deletion and should be avoided. ALTER
    access reduces the integrity and availability of the operating system environment and reduces compromises of confidential
    customer data.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-ES-000540'
  page_start: 104
  audit_raw: 'Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the DATASET entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering

    SYS1.MANxx datasets

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that SYS1.MANxx data sets are secured by RACF profiles in the DATASET class

    that:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(UPDATE) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Systems Programmers

    o IDs authorized to access these resources at this level'
  remediation: "To create a DATASET profile use the RACF ADDSD and PERMIT commands:\nADDSD 'SYS1.MAN*' GENERIC +\n UACC(NONE)\
    \ +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n DATA('SMF COLLECTION FILES')\nPERMIT 'SYS1.MAN*' GENERIC +\n ACCESS(ALTER)\
    \ ID(SYSPROG)\nSETROPTS REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN, or AUDIT settings for a DATASET profile use\
    \ the RACF\nALTDSD command:\nALTDSD 'SYS1.MAN*' GENERIC +\n UACC(NONE) +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n NOWARNING\n\
    SETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant access list entries use the RACF PERMIT command:\nPERMIT\
    \ 'SYS1.MAN*' GENERIC +\n DELETE ID(<non-compliant>)\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant GAC\
    \ entry you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH\
    \ GLOBAL(<class>)\nNote: Access gained via global access checking is not logged, so caution\nmust be used when making\
    \ changes to GAC entries.\nTo disable GAC for a class you will need to use both RACF RDELETE to remove the\nassociated\
    \ GLOBAL profile and RACF SETROPTS to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\n\
    SETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Request the following DSMON report:

      FUNCTION SYSTEM RACGAC

      Verify that the DATASET entry has:

      • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering

      SYS1.MANxx datasets

      Request reports generated using IRRDBU00 output that will allow you to:

      Verify that SYS1.MANxx data sets are secured by RACF profiles in the DATASET class

