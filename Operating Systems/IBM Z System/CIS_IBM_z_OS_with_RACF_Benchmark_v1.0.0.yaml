  title: Ensure that only supported software is installed and active on the system
  scoring: manual
  profile:
  - Level 1
  description: When a vendor drops support of software, they no longer maintain security vulnerability patches to the software.
  rationale: Without vulnerability patches, it is impossible to verify that the system does not contain code which could violate
    the integrity of the operating system environment.
  impact: ''
