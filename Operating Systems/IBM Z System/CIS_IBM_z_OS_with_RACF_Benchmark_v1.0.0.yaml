- id: 8.2.4
  title: Ensure that access to JESNEWS resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: JESNEWS is a spool data set that is added after the job separator when SYSOUT is printed. Installation use
    this facility to communicate information to their user community. Ensure that access authorization for updating JESNEWS
    is restricted to appropriate personnel (i.e. users responsible for maintaining the JES News data set). Viewing the JESNEWS
    spool data set requires that the owner of the SPOOL data set being printed have access to the JESNEWS profile protected
    the JESSPOOL data set.
  rationale: JESNEWS is intended to print information to a wide group of users of the system. The ability to create or delete
    a JESNEWS data set should be limited to system personnel.
