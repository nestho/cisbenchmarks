      mail to the target Message Transfer Agent (MTA).'
    severity: medium
- id: 6.1.4
  title: Ensure that access to CSSMTP started task data sets is controlled
  scoring: scored
  profile:
  - Level 1
  description: The IBM Communications Server Simple Mail Transfer Protocol (CSSMTP) STC uses privileged functions and accesses
    to sensitive data. The data sets CSSMTP relies upon for its configuration, runtime environment and operation must be properly
    protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data. The FTP
    Server daemon requires special privileges and access to sensitive resources to provide its system services. As such, the
    data sets the FTP Server daemon relies upon for its configuration, runtime environment and operation must be properly
    protected from unauthorized modifications or retrieval to ensure system integrity and privacy of sensitive data.
  rationale: Failure to properly restrict access to their data sets could result in violating the integrity of the base product
    which could result in compromising the operating system or sensitive data. Failure to properly define and control the
    FTP Server daemon could lead to unauthorized access. This exposure may result in the compromise of the integrity and availability
    of the operating system environment, ACP, and customer data.
  impact: ''
  references:
  - '1. IBM z/OS CSSMTP for RACF STIG: ZSMTR001'
  - '1. IBM z/OS RACF STIG: RACF-FT-000100'
