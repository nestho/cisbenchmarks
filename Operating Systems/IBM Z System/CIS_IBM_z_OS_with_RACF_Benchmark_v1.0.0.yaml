    \ +\n AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n DATA('EXIT LIBRARY')\nPERMIT '<profile>' GENERIC +\n ACCESS(READ) ID(*)\n\
    PERMIT '<profile>' GENERIC +\n ACCESS(ALTER) ID(SYSPROG)\nSETROPTS REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN,\
    \ or AUDIT settings for a DATASET profile use the RACF\nALTDSD command:\nALTDSD '<profile>' GENERIC +\n UACC(NONE) +\n\
    \ AUDIT(SUCCESS(UPDATE),FAILURES(READ)) +\n NOWARNING\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant access\
