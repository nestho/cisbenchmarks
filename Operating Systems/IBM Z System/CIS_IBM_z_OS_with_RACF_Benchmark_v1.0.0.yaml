    /etc/syslog.conf 744 faf

    Notes:

    • The /usr/sbin/syslogd object is a symbolic link to

    /usr/lpp/tcpip/sbin/syslogd. The permission and user audit

    bits on the target of the symbolic link must have the required

    settings.

    • The /etc/syslog.conf file may not be the configuration file the

    daemon uses. It is necessary to check the script or JCL used to

    start the daemon to determine the actual configuration file.'
