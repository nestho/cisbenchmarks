- id: '4.7'
  title: Ensure that SETROPTS NOSTATISTICS(*) is in effect
  scoring: scored
  profile:
  - Level 1
  description: 'SETROPTS NOSTATISTICS(*) bypasses the recording of statistical information in profiles. We are recommending
    to bypass resource statistics collection because: • Access counts kept only on DISCRETE profiles • Counts are not incremented
    for GAT permitted access or RACLISTed profiles • Counts are not accurate in a shared database environment'
  rationale: The statistical information collected is inaccurate and/or misleading, making it an unreliable at best metric
    that is stored as part of a RACF profile.
  impact: Failure to bypass resource statistics collection can needlessly increase CPU processing to calculate and I/O to
    update a profile.
  references: []
  page_start: 316
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Verify the STATISTICS = section is empty.'
  remediation: 'To bypass resource statistics collection use the RACF SETROPTS command:

    SETROPTS NOSTATISTICS(*)'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Verify the STATISTICS = section is empty.'
    severity: medium
- id: '4.8'
  title: Ensure that RACF is enabled for Sysplex communication
  scoring: scored
  profile:
  - Level 1
  description: This recommendation is not applicable for systems that are not part of a Sysplex. When RACF is enabled for
    sysplex communication, it uses Cross-system Coupling Facility (XCF) to join the RACF data sharing group, IRRXCF00. The
    data sharing group facilitates communication between systems in the sysplex enabled for sysplex communication.
  rationale: Because work can be distributed around the sysplex, all systems in the sysplex must have the same security information.
    Therefore, all systems in a sysplex should use the same RACF database. Additionally, when used definitions for security
    categories (members of the CATEGORY profile in the SECDATA general resource class) are likely to cause problems if all
    systems do not use the same RACF database.
  impact: When RACF is enabled for sysplex communication, it allocates in-storage buffers for the backup database (20% of
    the number allocated for the primary database), to reduce I/O to the backup device. Additionally, a minimum of 50 buffers
    are used for the primary database. As a consequence, you might notice an increased ECSA usage for the instorage buffers.
  references: []
  page_start: 318
  audit_raw: 'Request the HZSPRINT output from each system in a sysplex for:

    CHECK(IBMRACF,RACF_SYSPLEX_COMMUNICATION)

    Verify that the message returned is:

    IRRH343I Sysplex Communication is enabled.'
  remediation: 'Refer to the Security Server RACF System Programmer''s Guide for considerations and

    instructions on enabling sysplex communication.'
  checks:
  - type: manual_review
    info: 'Request the HZSPRINT output from each system in a sysplex for:

      CHECK(IBMRACF,RACF_SYSPLEX_COMMUNICATION)

      Verify that the message returned is:

      IRRH343I Sysplex Communication is enabled.'
    severity: medium
- id: '4.9'
  title: Ensure that Validated Boot for z/OS is in effect
  scoring: manual
  profile:
  - Level 2
  description: Validated Boot for z/OS is a solution that uses digital signatures to provide an initial program load (IPL)-time
    check that validates that IPL data is intact, not tampered with, and originated from a trusted source. It also enables
    detection of unauthorized changes to software executables.
  rationale: By using Validated Boot for z/OS, you have the ability to meet regulatory compliance standards, including National
    Information Assurance Partnership (NIAP) certification, that are required for certain secure software deployment scenarios.
    Additionally, you can detect both accidental and malicious IPL data changes earlier, thus reducing the impact of outages
    and stopping certain kinds of attacks.
  impact: ''
  references: []
  page_start: 320
  audit_raw: 'Issue the following console command on each production z/OS system:

    D IPLINFO

    Verify the following message is not present:

    VALIDATED BOOT: NO'
  remediation: Consult the dedicated Validated Boot for z/OS support page.
  checks:
  - type: manual_review
    info: 'Issue the following console command on each production z/OS system:

      D IPLINFO

      Verify the following message is not present:

      VALIDATED BOOT: NO'
    severity: medium
- id: '4.10'
  title: Ensure that the site is registered to the IBM Z and IBM LinuxONE Security Portal
  scoring: manual
  profile:
  - Level 1
  description: The IBM Z and IBM LinuxONE Security Portal currently has Security/Integrity (Sec/Int) APAR information for
    the z/OS and z/VM operating systems and associated IBM products that ship fixes via PTF, along with critical Security
    Notices that address hardware, firmware, and software issues. IBM does not make Sec/Int data publicly available for IBM
    Z. The Security Portal provides a controlled notification and distribution mechanism to help ensure this critical information
    is available to IBM Z clients that have completed the required vetting process, including agreement to the terms and conditions.
  rationale: For z/OS the Security Portal provides enhanced HOLDDATA for Sec/Int APARs, as well as a CVSS data file. Together,
    these files can be used by the site's IBM Z patch management team to help identify what APARs are applicable, as well
    as determine their urgency and the CVSS Vector.
  impact: ''
  references: []
