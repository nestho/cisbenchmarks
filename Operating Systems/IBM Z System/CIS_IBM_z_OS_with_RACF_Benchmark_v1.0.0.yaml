- id: 8.3.7
  title: Ensure that access to JESJOBS MODIFY resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a MODIFY high-level qualifier in the JESJOBS resource class control the use of the modify job
    function of the job modify SSI 85. Modifying a job can change the attributes of a job such as the job class, service class,
    system affinity, and priority.
