  title: Ensure that access to JESJOBS JOBCLASS resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: Resources with a JOBCLASS high-level qualifier in the JESJOBS resource class control the use of the job classes.
    Attributes of a job class such as bypass label processing (BLP) need to be restricted to appropriate users. Additionally,
    job classes can be associated with batch initiators that are reserved for appropriate applications.
  rationale: Failure to properly control job class usage could result in unauthorized personnel disrupting normal system operations
    and using a job class reserved for a specific purpose.
  impact: ''
  references: []
  page_start: 540
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that FACILITY and JESJOBS appear.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that FACILITY and JESJOBS appear.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that FACILITY appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the JESJOBS entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no JOBCLASS

    prefixed entries

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify That one or both of the following fully qualified profiles have been defined in the

    FACILITY class:

    • JES.JOBCLASS.OWNER

    • JES.JOBCLASS.SUBMITTER

    Verify That a catch-all profile named JOBCLASS.* or JOBCLASS.** or JOBCLASS.*.**

    has been defined in the JESJOBS class that:

    • Has a UACC of READ

    • Is not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access higher than READ

    Verify That any other JOBCLASS prefixed profiles have been defined in the JESJOBS

    class:

    • Have a UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o IDs authorized to access these resources at this level'
  remediation: "To activate a class use the RACF SETROPTS command:\nSETROPTS CLASSACT(FACILITY)\nSETROPTS CLASSACT(JESJOBS)\n\
    To enable generic profile checking for the a class use the RACF SETROPTS command:\nSETROPTS GENERIC(FACILITY)\nSETROPTS\
    \ GENERIC(JESJOBS)\nTo RACLIST the a class use the RACF SETROPTS command:\nSETROPTS RACLIST(FACILITY)\nTo enable enforcement\
    \ of JOBCLASS security use the RACF RDEFINE and SETROPTS\ncommands:\nRDEFINE FACILITY JES.JOBCLASS.OWNER +\n DATA('ENFORCE\
    \ JESJOBS JOBCLASS PROFILES FOR JOB OWNERS')\nRDEFINE FACILITY JES.JOBCLASS.SUBMITTER +\n DATA('ENFORCE JESJOBS JOBCLASS\
    \ PROFILES FOR JOB SUBMITTERS')\nSETROPTS REFRESH RACLIST(FACILITY)\nTo create a JESJOBS profile use the RACF RDEFINE\
    \ command:\nRDEFINE JESJOBS JOBCLASS.** +\n UACC(READ) +\n AUDIT(ALL(READ)) +\n DATA('CATCH-ALL PROFILE')\nTo modify the\
    \ UACC, WARN, or AUDIT settings for a general resource profile use the\nRACF RALTER command:\nRALTER JESJOBS JOBCLASS.**\
    \ +\n UACC(READ) +\n AUDIT(ALL(READ)) +\n NOWARNING\nTo remove a non-compliant access list entries use the RACF PERMIT\
    \ command:\nPERMIT <profile> CLASS(JESJOBS) +\n DELETE ID(<non-compliant>)\nTo remove a non-compliant GAC entry you need\
    \ to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\n\
    Note: Access gained via global access checking is not logged, so caution\nmust be used when making changes to GAC entries.\n\
    To disable GAC for a class you will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS\
    \ to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that FACILITY and JESJOBS appear.

      Review the command output in the GENERIC PROFILE CLASSES = section.

      Verify that FACILITY and JESJOBS appear.

