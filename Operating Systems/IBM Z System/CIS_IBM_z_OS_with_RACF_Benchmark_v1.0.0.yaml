  title: Ensure that access to TSOAUTH resources is controlled
  scoring: scored
  profile:
  - Level 1
  description: The TSOAUTH resource class controls sensitive privileges. Several of these privileges offer the ability, or
    provide a facility, to modify sensitive operating system resources.
  rationale: Failure to control and restrict access to these privileges may result in the compromise of the operating system
    environment, RACF, and customer data.
