  audit_raw: 'Request reports generated using IRRDBU00 output that will allow you to:

    Verify that a USER profile with an OMVS segment has the following attributes:

    • If specified, the UID value must be unique (excluding user IDs assigned UID(0))

    • If specified, the HOME value must be unique (excluding user IDs assigned

    UID(0))

    • The PROGRAM value must be /bin/sh or /bin/tcsh or /bin/echo or

    /bin/false or other approved value'
