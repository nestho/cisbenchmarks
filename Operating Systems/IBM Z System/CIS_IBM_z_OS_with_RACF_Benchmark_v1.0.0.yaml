- id: 1.2.11
  title: Ensure that no expired digital certificates are used
  scoring: scored
  profile:
  - Level 1
  description: When an X.509 certificate stored in RACF has the TRUST or HIGHTRUST status, it can be used by RACF for its
    intended purpose (map to a user ID, or treat as a trusted certificate authority or trusted site).
  rationale: X.509 certificates expire to prevent prolonged use of potentially compromised private keys and outdated cryptographic
    algorithms, ensuring that security infrastructure remains up-to-date against evolving threats and that the information
    within the certificate remains trustworthy over time.
  impact: 'The overall impact depends on the X.509 certificate type: • For a personal certificate, a trusted certificate can
    be used to authenticate a user ID. • For a certificate-authority certificate, a trusted certificate is one that can be
    used to authenticate a user''s certificate by indicating that the entity identified in the certificate (for example, the
    certificate authority) can issue certificates that this system honors. This implies that a user can gain access to the
    system based on the information contained in the certificate if the user''s certificate was signed by a trusted certificate
    authority. • For site certificates, a trusted certificate is one indicating that the entity identified in the certificate
    (for example, the site) can gain access to the system based on information contained within the certificate. Because the
    authority that issued the certificate might not be defined to the system as a certificate authority, this certificate
    information might not be able to be authenticated.'
  references:
  - '1. IBM z/OS RACF STIG: RACF-CE-000020'
  page_start: 75
  audit_raw: 'Note: Certificates used for password enveloping can continue to be used

    after expiring and should not be removed if password enveloping is still

    active.

    Request reports generated using IRRDBU00 output that will allow you to:

    • Verify that each certificate with a TRUST or HIGHTRUST status is not expired.

    Alternatively, if IBM Health Checker for z/OS is installed and active, you can request

    the HZSPRINT output for:

    CHECK(IBMRACF,RACF_CERTIFICATE_EXPIRATION)

    Verify that the health check returns this message:

    IRRH277I No exceptions are detected. Expired certificates that are not

    trusted or are associated with only a virtual key ring are not exceptions'
  remediation: 'Note: Certificates used for password enveloping can continue to be used

    after expiring and should not be removed if password enveloping is still

    active.

    Follow site procedures for certificate life cycle management.'
  checks:
