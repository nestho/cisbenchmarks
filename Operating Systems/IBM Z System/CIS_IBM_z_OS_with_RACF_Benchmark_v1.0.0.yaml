- id: 7.1.1
  title: Ensure that access to ICSF installation data sets is controlled
  scoring: manual
  profile:
  - Level 1
  description: The data sets installed by Integrated Crypto Service Facility (ICSF) need to be protected from unauthorized
    modifications or deletions. ICSF can be started via a started task. On z/OS, a started task should have a protection profile
    in the STARTED class that has neither the PRIVILEGED nor TRUSTED attribute, and the user ID identified in the STDATA field
    is neither UID(0) nor SPECIAL.
  rationale: ICSF can use privileged functions and/or have access to sensitive data. Failure to properly restrict access to
    their installed data sets could result in a loss of system integrity or customer data. As a started task on a z/OS system,
    the ICSF started task must have a protection profile in the STARTED class to limit its abilities to impact other tasks
    running on the system. By ensuring the started task is neither TRUSTED nor PRIVILEGED, and ensuring the user ID associated
    with the started task is neither UID(0) nor SPECIAL, it ensures the ICSF address space is isolated from the rest.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-IC-000020'
  - '1. IBM z/OS RACF STIG: RACF-IC-000050'
  page_start: 450
  audit_raw: 'Integrated Crypto Service Facility (ICSF) system data sets include, but are not limited

    to:

    • CSF.SCSFCLI0

    • CSF.SCSFHDRS

    • CSF.SCSFMOD0

    • CSF.SCSFMOD1

    • CSF.SCSFMSG0

    • CSF.SCSFOBJ

    • CSF.SCSFPNL0

    • CSF.SCSFSKL0

    • CSF.SCSFTLIB

    Request the following DSMON report:

    FUNCTION SYSTEM RACGAC

    Verify that the DATASET entry has:

    • -- GLOBAL INACTIVE -- or -- NO ENTRIES -- or contains no entry covering

    ICSF system data sets

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that ICSF system data sets are secured by RACF profiles in the DATASET class

    that:

    • Have UACC of NONE

    • Are not in WARNING mode

    • AUDIT a minimum of SUCCESS(READ) and FAILURES(READ)

    • ID(*) is not used to grant access

    • READ and higher permits are restricted to:

    o Systems Programmers

    Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the GENERIC PROFILE CLASSES = section.

    Verify that STARTED appears.

    Review the command output in the SETR RACLIST CLASSES = section.

    Verify that STARTED appears.

    Request the following DSMON report:

    FUNCTION SYSTEM RACSPT

    Verify that:

    • The ICSF started task(s) appear in the FROM PROFILES IN THE STARTED

    CLASS: section and not the FROM THE STARTED PROCEDURES TABLE

    (ICHRIN03): section.

    • The TRUSTED and PRIVILEGED column values are NO for ICSF started task(s).

    Use the ASSOCIATED USER column to determine the user ID associated with the ICSF

    started task(s).

    Request reports generated using IRRDBU00 output that will allow you to:

    Verify that the FTP Server daemon started task RACF user ID:

    • Has the PROTECTED attribute

    • Does not have the SPECIAL attribute

    • Has the following OMVS segment attributes:

    o UID that is not 0'
  remediation: "To create a DATASET profile use the RACF ADDSD and PERMIT commands:\nADDSD 'CSF.**' GENERIC +\n UACC(NONE)\
    \ +\n AUDIT(ALL(READ)) +\n DATA('ICSF SYSTEM DATA SETS')\nPERMIT 'CSF.**' GENERIC +\n ACCESS(ALTER) ID(SYSPROG)\nSETROPTS\
    \ REFRESH GENERIC(DATASET)\nTo modify the UACC, WARN, or AUDIT settings for a DATASET profile use the RACF\nALTDSD command:\n\
    ALTDSD 'CSF.**' GENERIC +\n UACC(NONE) +\n AUDIT(ALL(READ)) +\n NOWARNING\nSETROPTS REFRESH GENERIC(DATASET)\nTo remove\
    \ a non-compliant access list entries use the RACF PERMIT command:\nPERMIT 'CSF.**' GENERIC +\n DELETE ID(<non-compliant>)\n\
    SETROPTS REFRESH GENERIC(DATASET)\nTo remove a non-compliant GAC entry you need to use both RACF RALTER and\nSETROPTS\
    \ commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\nNote: Access gained via global access\
    \ checking is not logged, so caution\nmust be used when making changes to GAC entries.\nTo disable GAC for a class you\
    \ will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS to fully disable GAC for\
    \ the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)\nTo activate the STARTED\
    \ class use the RACF SETROPTS command:\nSETROPTS CLASSACT(STARTED)\nTo enable generic profile checking for the STARTED\
    \ class use the RACF SETROPTS\ncommand:\nSETROPTS GENERIC(STARTED)\nTo RACLIST the STARTED class use the RACF SETROPTS\
    \ command:\nSETROPTS RACLIST(STARTED)\nTo create a STARTED profile use the RACF RDEFINE and SETROPTS commands:\nRDEFINE\
    \ STARTED CSF.* +\n UACC(NONE) +\n DATA('INTEGRATED CRYPTO SERVICE FACILITY') +\n STDATA( +\n USER(<icsf-user>) +\n )\n\
    SETROPTS REFRESH RACLIST(STARTED)\nTo modify a STARTED profile use the RACF RALTER and SETROPTS commands:\nRALTER STARTED\
    \ CSF.* +\n STDATA( +\n NOPRIVILEGED +\n NOTRUSTED +\n )\nSETROPTS REFRESH RACLIST(STARTED)\nTo make a user ID PROTECTED\
    \ use the RACF ALTUSER command:\nALTUSER <icsf-id> +\n NOPASSWORD +\n NOPHRASE +\n NOOIDCARD\nTo remove the SPECIAL attribute\
    \ use the RACF ALTUSER command:\nALTUSER <icsf-id> NOSPECIAL\nTo modify the OMVS segment for a user ID use the RACF ALTUSER\
    \ command:\nALTUSER <icsf-id> +\n OMVS( +\n UID(1) +\n )\nNotes:\n1. If the security administrator has defined the SHARED.IDS\
    \ profile in\nthe UNIXPRIV class, the UID value must be unique. Use the SHARED\nkeyword in addition to UID to assign a\
    \ value that is already in use.\n2. OMVS DIRECTORY and PROGRAM values are case sensitive, so be\nsure they are entered\
    \ as-is and not translated to upper case."
