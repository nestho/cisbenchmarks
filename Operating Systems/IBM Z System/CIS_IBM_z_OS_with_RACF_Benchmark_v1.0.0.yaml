    SETROPTS REFRESH RACLIST(TSOAUTH)\nTo remove a non-compliant access list entry use the RACF PERMIT command:\nPERMIT <profile>\
    \ CLASS(TSOAUTH) +\n DELETE ID(<non-compliant>)\nSETROPTS REFRESH RACLIST(TSOAUTH)\nTo remove a non-compliant GAC entry\
    \ you need to use both RACF RALTER and\nSETROPTS commands:\nRALTER GLOBAL <class> DELMEM(<entry>)\nSETROPTS REFRESH GLOBAL(<class>)\n\
    Note: Access gained via global access checking is not logged, so caution\nmust be used when making changes to GAC entries.\n\
    To disable GAC for a class you will need to use both RACF RDELETE to remove the\nassociated GLOBAL profile and RACF SETROPTS\
    \ to fully disable GAC for the class:\nRDELETE GLOBAL <class>\nSETROPTS REFRESH GLOBAL(<class>)\nSETROPTS NOGLOBAL(<class>)"
