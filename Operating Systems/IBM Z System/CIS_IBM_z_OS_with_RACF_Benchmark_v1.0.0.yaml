      Verify That all profiles in the WRITER class:

      • Have UACC of '
    severity: medium
- id: 8.6.2
  title: Ensure that bypass label processing is not set on any JOBCLASS
  scoring: manual
  profile:
  - Level 1
  description: BLP=YES on a JOBCLASS statement allows certain security checks to be skipped when accessing certain tape data
    set. There are other ways to manage this setting than the JOBCLASS statement that allow for more granular authorization
    such as access via the RACF TAPEVOL resource class.
  rationale: Using BLP=YES on a JOBCLASS statement could inadvertently expose data on tapes to unauthorized personnel.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-JS-000040'
  page_start: 600
  audit_raw: 'Issue the following JES command for each JES2 subsystem:

    $D JOBCLASS(*),BLP

    Verify that every JOBCLASS is defined with BLP=NO.'
  remediation: The site will need to follow their standard change management process to correct noncompliant JES2 initialization
    statement JOBCLASS entries.
  checks:
  - type: manual_review
    info: 'Issue the following JES command for each JES2 subsystem:

      $D JOBCLASS(*),BLP

      Verify that every JOBCLASS is defined with BLP=NO.'
    severity: medium
- id: 8.6.3
  title: Ensure that access to JES2 input sources is controlled
  scoring: manual
  profile:
  - Level 1
  description: JES2 input sources provide a variety of channels for job submission. Failure to properly control the use of
    these input sources could result in unauthorized submission of work into the operating system.
  rationale: This exposure may threaten the integrity and availability of the operating system environment and compromise
    the confidentiality of customer data.
  impact: ''
  references:
