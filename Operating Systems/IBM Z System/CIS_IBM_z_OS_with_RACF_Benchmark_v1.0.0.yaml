      Verify that for any KDS data sets listed the FORMAT value is KDSRL.'
    severity: medium
- id: 7.2.7
  title: Ensure all ICSF key data sets are enabled for sysplex sharing
  scoring: manual
  profile:
  - Level 1
  description: When the ICSF Key Datasets are shared among members of a sysplex, it is critical that updates to the data sets
    are communicated across all members of the sysplex group. To enable the sysplex communication, the ICSF Installation Options
    Dataset must contain the appropriate sysplex enablement keywords.
  rationale: Failure to specify SYSPLEXCKDS(YES), SYSPLEXPKDS(YES), or SYSPLEXTKDS(YES) when you are sharing a key data set
    can result in damage to the key data set.
  impact: ''
  references: []
  page_start: 473
  audit_raw: '1. From the ICSF Primary Menu panel, select option 3 OPSTAT.

    2. From the ICSF Installation Options panel, select option 1 OPTIONS.

    Verify that:

    • The SYSPLEXCKDS value is YES,FAIL(YES)

    • The SYSPLEXPKDS value is YES,FAIL(YES)

    • The SYSPLEXTKDS value is YES,FAIL(YES)'
  remediation: 'The site will need to follow their standard change management process for updating

    parameters in the ICSF installation options data set to update non-compliant

    parameters.'
  checks:
