- id: '9.7'
  title: Ensure that RACF Classes required to secure the z/OS UNIX environment are active
  scoring: scored
  profile:
  - Level 1
  description: The FACILITY, SURROGAT, and UNIXPRIV resource classes support profiles used to secure the z/OS UNIX (OMVS)
    environment. • UNIXPRIV class profiles are used to manage certain system privileges that are typically associated with
    z/OS UNIX superuser authority. By defining UNIXPRIV class profiles, certain individual superuser privileges can be granted
    to users who do not have superuser authority. This reduces the security risks associated with assigning full superuser
    authority to users. • SURROGAT class profiles are only needed if there are servers (e.g., a web server) running in the
    z/OS UNIX environment that must be able to act with the security context of a client and that client does not supply a
    password or other authenticator for RACF. • FACILITY class profiles are used by a variety of IBM components including
    UNIX System Services (OMVS). BPX prefixed profiles in this class are critical to the proper security of the z/OS UNIX
    environment.
  rationale: Without these classes being in active, system integrity can be compromised.
  impact: ''
  references:
  - '1. IBM z/OS RACF STIG: RACF-US-000130'
  page_start: 636
  audit_raw: 'Issue the following TSO command:

    SETROPTS LIST

    Review the command output in the ACTIVE CLASSES = section.

    Verify that:

    • FACILITY appears

    • SURROGAT appears

    • UNIXPRIV appears'
  remediation: 'To activate the classes use the RACF SETROPTS command:

    SETROPTS CLASSACT(FACILITY SURROGAT UNIXPRIV)'
  checks:
  - type: manual_review
    info: 'Issue the following TSO command:

      SETROPTS LIST

      Review the command output in the ACTIVE CLASSES = section.

      Verify that:

      • FACILITY appears

