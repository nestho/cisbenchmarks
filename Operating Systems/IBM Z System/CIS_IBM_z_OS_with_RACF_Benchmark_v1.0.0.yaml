- id: 8.3.3
  title: Ensure that access to JESJOBS GROUPREG resources is controlled
  scoring: manual
  profile:
  - Level 1
  description: JCL writers can define dependencies between job using a structure called a JOBGROUP. A JOBGROUP is a set of
    JCL that defines the dependencies between jobs and a set of JCL jobs streams that are part of the JOBGROUP. JESJOBS resources
    with a high-level qualifier of GROUPREG control what jobs can be added to a JOBGROUP when the owner of the JOBGROUP is
    not the same as the owner of the JOB. Failure to protect this resource may allow unauthorized users to add jobs to a JOBGROUP
    that they do not own.
  rationale: It is expected that all jobs in a job group run under the same user authority. Though this is not required. This
    resource prevents an unauthorized user from adding their job to an existing JOBGROUP.
