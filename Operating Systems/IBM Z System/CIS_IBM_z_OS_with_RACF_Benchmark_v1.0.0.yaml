- id: '3.10'
  title: Ensure that RACF audit logs is reviewed on a regular basis
  scoring: manual
  profile:
  - Level 1
  description: Logging, the recording of data about specific events, is the key to auditing the use of RACF at your installation.
    But you also need to ensure the logs are reviewed at least daily.
  rationale: It is very important for any organization to have security logs and actively using them to monitor security-related
    activities. Security logs must be monitored and analyzed, even real-time if possible (feeding RACF logs to a SIEM) so
    attacks can be detected quickly, and appropriate response triggered.
  impact: ''
  references: []
  page_start: 295
  audit_raw: 'Verify that site auditors are reviewing RACF event logs (SMF type 80) at least daily,

    and analyze any security related events.

    Including but not limited to:

    • invalid access attempts

    • new accounts creation

    • elevation of privileges

    • change of identity

    • access to sensitive resources'
  remediation: 'Ensure that site auditors are reviewing RACF event logs (SMF type 80) at least daily,

    and analyze any security related events.

    Including but not limited to:

    • invalid access attempts

    • new accounts creation

    • elevation of privileges

    • change of identity

    • access to sensitive resources'
  checks:
  - type: manual_review
    info: 'Verify that site auditors are reviewing RACF event logs (SMF type 80) at least daily,

      and analyze any security related events.

      Including but not limited to:

      • invalid access attempts

      • new accounts creation

      • elevation of privileges

      • change of identity

      • access to sensitive resources'
    severity: medium
