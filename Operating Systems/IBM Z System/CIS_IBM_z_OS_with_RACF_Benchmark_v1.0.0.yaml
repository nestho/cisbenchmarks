- id: 2.3.4
  title: Ensure that ALTER access authority in DISCRETE profiles is limited
  scoring: scored
  profile:
  - Level 2
  description: When a RACF profile is a DISCRETE profile the ALTER level of access not only grants access to the resources
    protected by the profile, but also allows changes to most fields in the base segment of the profile itself, including
    the default access and the access lists.
  rationale: Failure to control ALTER access authority with IRR.ALTER prefixed profiles in the FACILITY class can mean that
    users that require ALTER access to a resource are also able to make RACF changes, resulting in separation of duties concerns.
  impact: This modifies long standing default behavior of RACF, and a site with an existing RACF environment must investigate
    whether ALTER access is being used for profile management before implementing this recommendation.
  references: []
