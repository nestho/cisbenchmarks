- id: 6.6.6
  title: Ensure that access to the otelnetd and EZATNTLE programs is controlled
  scoring: manual
  profile:
  - Level 1
  description: 'The z/OS Unix Telnet Server (otelnetd) provides remote access to the z/OS Unix command prompt. otelnetd does
    not provide any cryptographic protection of user connections. Due to this lack of security, the otelnetd server should
    not be used. Instead, use SSH for remote z/OS Unix command prompt access. Note: otelnetd is an alias for the EZATNTLE
    program.'
  rationale: The inability to cryptographically protect otelnetd connections exposes all communications between telnet clients
    and the otelnetd server, including sensitive values like passwords, to network-based observers, resulting in a complete
    lack of data privacy.
  impact: otelnetd users (if any) will no longer have access to otelnetd and must switch to a secure remote access mechanism
    such as SSH.
  references: []
