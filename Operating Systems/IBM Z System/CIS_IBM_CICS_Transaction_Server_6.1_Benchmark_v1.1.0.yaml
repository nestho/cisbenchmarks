      3. Open the spreadsheet and review the settings of the CONFDATA column. They

      should all be set to HIDE.'
    severity: medium
- id: 3.1.1
  title: Ensure that no unencrypted IP connections use BASICAUTH
  scoring: manual
  profile:
  - Level 1
  description: Passwords should not appear in unencrypted connections. Therefore, if basic authentication is specified as
    the authentication mechanism for a connection, the connection must be secure by TLS. This can be done using configuration
    options in CICS TS or AT-TLS. TCPIPSERVICE definitions with a PROTOCOL(HTTP) or PROTOCOL(USER) and AUTHENTICATE(BASIC)
    must be secured either by setting SSL(YES) or by using an AT-TLS policy.
  rationale: Passwords should not appear in unencrypted connections.
  impact: None.
  references: []
  page_start: 46
  audit_raw: 'Issue the z/OSMF Compliance data collection REST API to drive collection of

    compliance evidence in the SMF 1154 record.

    https://{host}:{port}/zosmf/compliance/rest/v1/facts

    1. Wait for the data to be collected; this may take up to a minute in some regions.

    2. Customize and run the DFH$54P sample JCL to create a summary of all of the

    CICS TS regions.

    3. Look at the ABBREV section of the output. Search for all entries with

    SMF1154_80_S4_NAME.

    4. SMF1154_80_S4_NAME is the name of a TCPIPSERVICE definition. To find the

    region page back to look at the 1154 Common Header which will give the

    Jobname and LPAR SystemName.'
  remediation: 'Either

    Configure all TCPIPSERVICE definitions with AUTHENTICATE(BASIC) to have

    SSL(YES)

    Or

    Create policy definitions in AT-TLS so that all TCPIPSERVICE definitions with

    AUTHENTICATE(BASIC) use TLS

    Restart CICS'
  checks:
  - type: manual_review
    info: 'Issue the z/OSMF Compliance data collection REST API to drive collection of

      compliance evidence in the SMF 1154 record.

      https://{host}:{port}/zosmf/compliance/rest/v1/facts

      1. Wait for the data to be collected; this may take up to a minute in some regions.

      2. Customize and run the DFH$54P sample JCL to create a summary of all of the

      CICS TS regions.

      3. Look at the ABBREV section of the output. Search for all entries with

      SMF1154_80_S4_NAME.

      4. SMF1154_80_S4_NAME is the name of a TCPIPSERVICE def'
    severity: medium
