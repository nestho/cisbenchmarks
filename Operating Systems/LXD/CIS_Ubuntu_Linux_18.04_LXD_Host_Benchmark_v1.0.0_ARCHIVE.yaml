    .rules

    Example: vi /etc/audit/rules.d/mounts.rules

    and add the following lines:

    -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k

    mounts

    -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k

    mounts

    322 | P a g e'
