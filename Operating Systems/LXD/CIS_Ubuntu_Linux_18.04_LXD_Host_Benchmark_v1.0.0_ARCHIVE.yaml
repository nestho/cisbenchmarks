- id: 2.2.1.2
  title: Ensure systemd-timesyncd is configured
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'systemd-timesyncd is a daemon that has been added for synchronizing the system clock across the network. It
    implements an SNTP client. In contrast to NTP implementations such as chrony or the NTP reference server this only implements
    a client side, and does not bother with the full NTP complexity, focusing only on querying time from one remote server
    and synchronizing the local clock to it. The daemon runs with minimal privileges, and has been hooked up with networkd
    to only operate when network connectivity is available. The daemon saves the current clock to disk every time a new NTP
    sync has been acquired, and uses this to possibly correct the system clock early at bootup, in order to accommodate for
    systems that lack an RTC such as the Raspberry Pi and embedded devices, and make sure that time monotonically progresses
    on these systems, even if it is not always correct. To make use of this daemon a new system user and group "systemdtimesync"
    needs to be created on installation of systemd. Note: The systemd-timesyncd service specifically implements only SNTP.
    This minimalistic service will set the system clock for large offsets or slowly adjust it for smaller deltas. More complex
    use cases are not covered by systemd-timesyncd. This recommendation only applies if timesyncd is in use on the system.'
  rationale: Proper configuration is vital to ensuring time synchronization is working properly.
  impact: ''
  references: []
  page_start: 142
  audit_raw: "Ensure that timesyncd is enabled and started\nRun the following commands:\n# systemctl is-enabled systemd-timesyncd.service\n\
    This should return:\nenabled\n142 | P a g e\nReview /etc/systemd/timesyncd.conf and ensure that the NTP servers, NTP FallbackNTP\n\
    servers, and RootDistanceMaxSec listed are in accordance with local policy\nRun the following command\n# timedatectl status\n\
    This should return something similar to:\n Local time: Tue 2019-06-04 15:40:45 EDT\n Universal time: Tue 2019-06-04 19:40:45\
    \ UTC\n RTC time: Tue 2019-06-04 19:40:45\n Time zone: America/New_York (EDT, -0400)\n NTP enabled: yes\nNTP synchronized:\
    \ yes\n RTC in local TZ: no\n DST active: yes\n Last DST change: DST began at\n Sun 2019-03-10 01:59:59 EST\n Sun 2019-03-10\
    \ 03:00:00 EDT\n Next DST change: DST ends (the clock jumps one hour backwards) at\n Sun 2019-11-03 01:59:59 EDT\n Sun\
    \ 2019-11-03 01:00:00 EST"
  remediation: 'Run the following command to enable systemd-timesyncd

    # systemctl enable systemd-timesyncd.service

    edit the file /etc/systemd/timesyncd.conf and add/modify the following lines in

    accordance with local site policy

    NTP=0.ubuntu.pool.ntp.org 1.ubuntu.pool.ntp.org 2.ubuntu.pool.ntp.org

    FallbackNTP=ntp.ubuntu.com 3.ubuntu.pool.ntp.org

    RootDistanceMaxSec=1

    Run the following commands to start systemd-timesyncd.service

    # systemctl start systemd-timesyncd.service

    # timedatectl set-ntp true'
  checks:
  - type: manual_review
    info: "Ensure that timesyncd is enabled and started\nRun the following commands:\n# systemctl is-enabled systemd-timesyncd.service\n\
      This should return:\nenabled\n142 | P a g e\nReview /etc/systemd/timesyncd.conf and ensure that the NTP servers, NTP\
      \ FallbackNTP\nservers, and RootDistanceMaxSec listed are in accordance with local policy\nRun the following command\n\
      # timedatectl status\nThis should return something similar to:\n Local time: Tue 2019-06-04 15:40:45 EDT\n Universal\
      \ time: Tue 2019-06-04 19:40:45 UTC\n RT"
    severity: medium
