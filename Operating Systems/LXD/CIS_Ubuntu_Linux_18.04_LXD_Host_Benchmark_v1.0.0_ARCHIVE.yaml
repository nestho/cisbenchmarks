- id: 1.1.1.8
  title: Ensure mounting of FAT filesystems is limited
  scoring: manual
  profile:
  - Level 2 - Workstation
  - Level 2 - Server
  - Level 2 - LXD Server
  description: The FAT filesystem format is primarily used on older windows systems and portable USB drives or flash modules.
    It comes in three types FAT12 , FAT16 , and FAT32 all of which are supported by the vfat kernel module.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: The FAT filesystem format is used by UEFI systems for the EFI boot partition. Disabling the vfat module can prevent
    boot on UEFI systems. FAT filesystems are often used on portable USB sticks and other flash media which are commonly used
    to transfer files between workstations, removing VFAT support may prevent the ability to transfer files in this way.
  references: []
  page_start: 38
  audit_raw: 'If utilizing UEFI the FAT filesystem format is required. If this case, ensure that the FAT

    filesystem is only used where appropriate

    Run the following command

    grep -E -i ''\svfat\s'' /etc/fstab

    And review that any output is appropriate for your environment

    If not utilizing UEFI

    Run the following commands and verify the output is as indicated:

    # modprobe --showconfig | grep vfat

    install vfat /bin/true

    38 | P a g e

    # lsmod | grep vfat

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vi /etc/modprobe.d/vfat.conf

    install vfat /bin/true

    Run the following command to unload the vfat module:

    # rmmod vfat'
  checks:
  - type: command
    command: 'grep -E -i ''\svfat\s'' /etc/fstab && # modprobe --showconfig | grep vfat && # lsmod | grep vfat'
    expected: ''
    severity: medium
    info: 'If utilizing UEFI the FAT filesystem format is required. If this case, ensure that the FAT

      filesystem is only used where appropriate

      Run the following command

      grep -E -i ''\svfat\s'' /etc/fstab

      And review that any output is appropriate for your environment

      If not utilizing UEFI

      Run the following commands and verify the output is as indicated:

      # modprobe --showconfig | grep vfat

      install vfat /bin/tru'
- id: 1.1.2
  title: Ensure /tmp is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - Level 1 - LXD Server
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set the noexec option on the mount, making /tmp useless
    for an attacker to install executable code. It would also prevent an attacker from establishing a hardlink to a system
    setuid program and wait for it to be updated. Once the program was updated, the hardlink would be broken and the attacker
    would have his own copy of the program. If the program happened to have a security vulnerability, the attacker could continue
    to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating a separate partition
    for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a default installation a disk-based /tmp will essentially have the whole disk available, as it only creates a single
    / partition. On the other hand, a RAM-based /tmp as with tmpfs will almost certainly be much smaller, which can lead to
    applications filling up the filesystem much more easily. /tmp utalizing tmpfs can be resized using the size={size} parameter
    on the Options line on the tmp.mount file
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  page_start: 40
  audit_raw: 'Run the following command and verify output shows /tmp is mounted:

    40 | P a g e

    # mount | grep -E ''\s/tmp\s''

    tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

    Run the following command and verify that tmpfs has been mounted to, or a system

    partition has been created for /tmp

    # grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#''

    tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 0

    OR

    # systemctl is-enabled tmp.mount

    enabled'
  remediation: 'Configure /etc/fstab as appropriate.

    Example:

    tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime 0 0

    OR

    Run the following commands to enable systemd /tmp mounting:

    systemctl unmask tmp.mount

    systemctl enable tmp.mount

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to configure the /tmp

    mount:

    [Mount]

    What=tmpfs

    Where=/tmp

    Type=tmpfs

    Options=mode=1777,strictatime,noexec,nodev,nosuid'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'' && # grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#'''
    expected: Run the following command and verify that tmpfs has been mounted to, or a system
    severity: medium
    info: 'Run the following command and verify output shows /tmp is mounted:

      40 | P a g e

      # mount | grep -E ''\s/tmp\s''

      tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

      Run the following command and verify that tmpfs has been mounted to, or a system

      partition has been created for /tmp

      # grep -E ''\s/tmp\s'' /etc/fstab | grep -E -v ''^\s*#''

      tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev 0 0

      OR

      # systemc'
- id: 1.1.3
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - Level 1 - LXD Server
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices in /tmp .
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Verify that the nodev option is set if a /tmp partition exists

    Run the following command and verify that nothing is returned:

    # mount | grep -E ''\s/tmp\s'' | grep -v nodev'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options) for the /tmp

    partition. See the fstab(5) manual page for more information.

    Run the following command to remount /tmp :

    # mount -o remount,nodev /tmp

    OR If systemd tmp.mount is configured:

    Edit /etc/systemd/system/local-fs.target.wants/tmp.mount to add nodev to the /tmp

    mount options:

    [Mount]

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Run the following command to remount /tmp :

    # mount -o remount,nodev /tmp

    43 | P a g e'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'' | grep -v nodev'
    expected: Verify that the nodev option is set if a /tmp partition exists
    severity: medium
    info: 'Verify that the nodev option is set if a /tmp partition exists

      Run the following command and verify that nothing is returned:

      # mount | grep -E ''\s/tmp\s'' | grep -v nodev'
