  - Level 1 - Workstation
  description: Lock out users after n unsuccessful consecutive login attempts. The first sets of changes are made to the PAM
    configuration files. The second set of changes are applied to the program specific PAM configuration file. The second
    set of changes must be applied to each program that will lock out users. Check the documentation for each secondary program
    for instructions on how to configure them to work with PAM. • deny=n - n represents the number of failed attempts before
    the account is locked • unlock_time=n - n represents the number of seconds before the account is unlocked • audit - Will
    log the user name into the system log if the user is not found. • silent - Don't print informative messages. Set the lockout
    number and unlock time in accordance with local site policy.
