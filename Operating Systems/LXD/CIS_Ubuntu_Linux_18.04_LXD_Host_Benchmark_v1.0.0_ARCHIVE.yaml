- id: 1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  - Level 1 - LXD Server
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the server. If this filesystem
    type is not needed, disable it.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v cramfs | grep -v mtd

    install /bin/true

    # lsmod | grep cramfs

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vi /etc/modprobe.d/cramfs.conf

    and add the following line:

    install cramfs /bin/true

    Run the following command to unload the cramfs module:

    # rmmod cramfs

    24 | P a g e'
  checks:
  - type: command
    command: '# modprobe -n -v cramfs | grep -v mtd && # lsmod | grep cramfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # modprobe -n -v cramfs | grep -v mtd

      install /bin/true

      # lsmod | grep cramfs

      <No output>'
