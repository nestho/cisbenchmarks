    Access: (0640/-rw-r-----) Uid: ( 0/ root) Gid: ( 0/ root)'
  remediation: 'Run the following commands to remove /etc/cron.deny and /etc/at.deny and create and

    set permissions and ownership for /etc/cron.allow and /etc/at.allow :

    # rm /etc/cron.deny

    # rm /etc/at.deny

    # touch /etc/cron.allow

    # touch /etc/at.allow

    # chmod o-rwx /etc/cron.allow

    # chmod g-wx /etc/cron.allow

    # chmod o-rwx /etc/at.allow

    # chmod g-wx /etc/at.allow

    # chown root:root /etc/cron.allow

    # chown root:root /etc/at.allow'
