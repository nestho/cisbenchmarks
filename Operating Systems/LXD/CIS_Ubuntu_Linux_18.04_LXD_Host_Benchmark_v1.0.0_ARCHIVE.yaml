    -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=-1 -F key=mounts'
  remediation: 'For 32 bit systems Edit or create a file in the /etc/audit/rules.d/ directory ending in

    .rules

    Example: vi /etc/audit/rules.d/audit.rules

    and add the following lines:

    -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k

    mounts

