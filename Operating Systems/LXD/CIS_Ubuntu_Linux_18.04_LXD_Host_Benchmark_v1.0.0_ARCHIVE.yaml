- id: 6.2.16
  title: Ensure no duplicate UIDs exist
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Although the useradd program will not let you create a duplicate User ID (UID), it is possible for an administrator
    to manually edit the /etc/passwd file and change the UID field.
  rationale: Users must be assigned unique UIDs for accountability and to ensure appropriate access protections.
  impact: ''
  references: []
  page_start: 495
  audit_raw: "Run the following script and verify no results are returned:\n#!/bin/bash\nawk -F: '{print $3}' /etc/passwd\
    \ | sort -n | uniq -c | while read -r uid; do\n [ -z \"$uid\" ] && break\n set - $uid\n if [ $1 -gt 1 ]; then\n users=$(awk\
    \ -F: '($3 == n) { print $1 }' n=\"$2\" /etc/passwd |\nxargs)\n echo \"Duplicate UID \\\"$2\\\": \\\"$users\\\"\"\n fi\n\
