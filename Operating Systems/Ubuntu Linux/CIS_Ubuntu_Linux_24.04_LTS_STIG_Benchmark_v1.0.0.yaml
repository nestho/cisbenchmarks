- id: '1.105'
  title: UBTU-24-600130
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must ensure only users who need access to security functions are part of sudo group.
    GROUP ID: V-270748 RULE ID: SV-270748r1066733'
  rationale: An isolation boundary provides access control and protects the integrity of the hardware, software, and firmware
    that perform security functions. Security functions are the hardware, software, and/or firmware of the information system
    responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection
    is based. Operating systems implement code separation (i.e., separation of security functions from nonsecurity functions)
    in a number of ways, including through the provision of security kernels via processor rings or processor modes. For nonkernel
    code, security function isolation is often achieved through file system protections that serve to protect the code on
    disk and address space protections that protect executing code. Developers and implementers can increase the assurance
    in security functions by employing well-defined security policy models; structured, disciplined, and rigorous hardware
    and software development techniques; and sound system/security engineering principles. Implementation may include isolation
    of memory space and libraries. The operating system restricts access to security functions through the use of access control
    mechanisms and by implementing least privilege capabilities.
  impact: ''
  references: []
  page_start: 258
  audit_raw: 'Verify the sudo group has only members who require access to security functions by

    using the following command:

    $ grep sudo /etc/group

    sudo:x:27:<username>

    If the sudo group contains users not needing access to security functions, this is a

    finding.'
  remediation: 'Configure the sudo group with only members requiring access to security functions.

    To remove a user from the sudo group, run:

    $ sudo gpasswd -d <username> sudo'
  checks:
  - type: manual_review
    info: 'Verify the sudo group has only members who require access to security functions by

      using the following command:

      $ grep sudo /etc/group

      sudo:x:27:<username>

      If the sudo group contains users not needing access to security functions, this is a

      finding.'
    severity: medium
- id: '1.106'
  title: UBTU-24-600140
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must restrict access to the kernel message buffer. GROUP ID: V-270749 RULE ID: SV-270749r1067179'
  rationale: Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining
    additional system information as a nonprivileged user.
  impact: ''
  references: []
  page_start: 260
  audit_raw: 'Verify the operating system is configured to restrict access to the kernel message buffer

    by using the following command:

    $ sysctl kernel.dmesg_restrict

    kernel.dmesg_restrict = 1

    If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.

    Verify that there are no configurations that enable the kernel dmesg function:

    $ sudo grep -ir kernel.dmesg_restrict /run/sysctl.d/* /etc/sysctl.d/*

    /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

    /etc/sysctl.conf 2> /dev/null

    /etc/sysctl.d/10-kernel-hardening.conf:kernel.dmesg_restrict = 1

    If "kernel.dmesg_restrict" is not set to "1", is commented out, is missing, or conflicting

    results are returned, this is a finding.'
  remediation: 'Configure the operating system to restrict access to the kernel message buffer.

    Add or modify the following line in the "/etc/sysctl.conf" file:

    kernel.dmesg_restrict = 1

    Remove any configurations that conflict with the above from the following locations:

    /run/sysctl.d/

    /etc/sysctl.d/

    /usr/local/lib/sysctl.d/

    /usr/lib/sysctl.d/

    /lib/sysctl.d/

    /etc/sysctl.conf

    Reload settings from all system configuration files by using the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to restrict access to the kernel message buffer

      by using the following command:

      $ sysctl kernel.dmesg_restrict

      kernel.dmesg_restrict = 1

      If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.

      Verify that there are no configurations that enable the kernel dmesg function:

      $ sudo grep -ir kernel.dmesg_restrict /run/sysctl.d/* /etc/sysctl.d/*

      /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

      /etc/sysctl.conf 2> /dev/null

      /'
    severity: medium
- id: '1.107'
  title: UBTU-24-600150
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must set a sticky bit on all public directories to prevent unauthorized and unintended
    information transferred via shared system resources. GROUP ID: V-270750 RULE ID: SV-270750r1066739'
  rationale: Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations
    of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles)
    from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g.,
    registers, main memory, hard disks) after those resources have been released back to information systems. The control
    of information in shared resources is also commonly referred to as object reuse and residual information protection. This
    requirement generally applies to the design of an information technology product, but it can also apply to the configuration
    of particular information system components that are, or use, such products. This can be verified by acceptance/validation
    processes in DOD or other government agencies. There may be shared resources with configurable protections (e.g., files
    in storage) that may be assessed on specific information system components.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure world writable files and directories are secured"
  page_start: 262
  audit_raw: 'Verify that all public directories have the public sticky bit set by using the following

    command:

    $ sudo find / -type d -perm -002 ! -perm -1000

    If any public directories are found missing the sticky bit, this is a finding.'
  remediation: 'Configure all public directories to have the sticky bit set to prevent unauthorized and

    unintended information transferred via shared system resources.

    Set the sticky bit on all public directories using the following command, replacing

    "<public_directory_name>" with any directory path missing the sticky bit:

    $ sudo chmod +t <public_directory_name>'
  checks:
  - type: manual_review
    info: 'Verify that all public directories have the public sticky bit set by using the following

      command:

      $ sudo find / -type d -perm -002 ! -perm -1000

      If any public directories are found missing the sticky bit, this is a finding.'
    severity: medium
