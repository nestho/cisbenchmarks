      If "Time zone" is not set to UTC or GMT, this is a finding.'
- id: '1.178'
  title: UBTU-24-901230
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure audit tools with a mode of "755" or less permissive. GROUP ID: V-270821
    RULE ID: SV-270821r1068391'
  rationale: 'Protecting audit information also includes identifying and protecting the tools used to view and manipulate
    log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information. Operating
    systems providing tools to interface with audit information will leverage user permissions and roles identifying the user
    accessing the tools and the corresponding rights the user enjoys in order to make access decisions regarding the access
    to audit tools. Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    Satisfies: SRG-OS-000256-GPOS-00097, SRG-OS-000257-GPOS-00098'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure audit tools mode is configured"
  page_start: 407
  audit_raw: 'Verify the operating system configures the audit tools to have a file permission of "755"

    or less to prevent unauthorized access by using the following command:

    $ stat -c "%n %a" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace

    /sbin/auditd /sbin/audispd* /sbin/augenrules

    /sbin/auditctl 755

    /sbin/aureport 755

    /sbin/ausearch 755

    /sbin/autrace 755

    /sbin/auditd 755

    /sbin/audispd-zos-remote 755

    /sbin/augenrules 755

    If any of the audit tools have a mode more permissive than "0755", this is a finding.'
  remediation: 'Configure the audit tools on the operating system to be protected from unauthorized

    access by setting the correct permissive mode using the following command:

    $ sudo chmod 755 <audit_tool_name>

    Replace "<audit_tool_name>" with the audit tool that does not have the correct

    permissions.'
  checks:
  - type: manual_review
    info: 'Verify the operating system configures the audit tools to have a file permission of "755"

      or less to prevent unauthorized access by using the following command:

      $ stat -c "%n %a" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace

      /sbin/auditd /sbin/audispd* /sbin/augenrules

      /sbin/auditctl 755

      /sbin/aureport 755

      /sbin/ausearch 755

      /sbin/autrace 755

      /sbin/auditd 755

      /sbin/audispd-zos-remote 755

      /sbin/augenrules 755

      If any of the audit tools have a mode more permissive than "0755", this is '
    severity: medium
