- id: '1.34'
  title: UBTU-24-200000
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must limit the number of concurrent sessions to ten for all accounts and/or account types.
    GROUP ID: V-270677 RULE ID: SV-270677r1066520'
  rationale: The operating system management includes the ability to control the number of users and user sessions that utilize
    an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related
    to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information system accounts and
    does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions
    should be defined based upon mission needs and the operational environment for each system.
  impact: ''
  references: []
  page_start: 99
  audit_raw: 'Verify the operating system limits the number of concurrent sessions to 10 for all

    accounts and/or account types by using the following command:

    $ grep maxlogins /etc/security/limits.conf | grep -v ''^* hard maxlogins''

    * hard maxlogins 10

    If "maxlogins" does not have a value of "10" or less, is commented out, or is missing,

    this is a finding.'
  remediation: 'Configure the operating system to limit the number of concurrent sessions to 10 for all

    accounts and/or account types.

    Add or modify the following line at the top of the "/etc/security/limits.conf" file or in a

    ".conf" file defined in /etc/security/limits.d/:

    * hard maxlogins 10'
  checks:
  - type: command
    command: $ grep maxlogins /etc/security/limits.conf | grep -v '^* hard maxlogins'
    expected: ''
    severity: medium
    info: 'Verify the operating system limits the number of concurrent sessions to 10 for all

      accounts and/or account types by using the following command:

      $ grep maxlogins /etc/security/limits.conf | grep -v ''^* hard maxlogins''

      * hard maxlogins 10

      If "maxlogins" does not have a value of "10" or less, is commented out, or is missing,

      this is a finding.'
- id: '1.35'
  title: UBTU-24-200020
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must initiate a graphical session lock after 15 minutes of inactivity. GROUP ID: V-270678
    RULE ID: SV-270678r1066523'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, a session lock of the operating system must remain in place until the user reauthenticates.
    No other activity aside from reauthentication must unlock the system.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure GDM screen locks when the user is idle"
  page_start: 101
  audit_raw: 'Verify the operating system has a graphical user interface session lock configured to

    activate after 15 minutes of inactivity by using the following commands:

    Note: If no graphical user interface is installed, this requirement is not applicable.

    Get the following settings to verify the graphical user interface session is configured to

    lock the graphical user session after 15 minutes of inactivity:

    $ gsettings get org.gnome.desktop.screensaver lock-enabled

    true

    $ gsettings get org.gnome.desktop.screensaver lock-delay

    uint32 0

    $ gsettings get org.gnome.desktop.session idle-delay

    int32 600

    If "lock-enabled" is not set to "true", is commented out, or is missing, this is a finding.

    If "lock-delay" is set to a value greater than "0", or if "idle-delay" is set to a value greater

    than "600", is commented out, or is missing, this is a finding.'
  remediation: 'Configure the operating system to lock the current graphical user interface session after

    10 minutes of inactivity.

    Set the following settings to allow graphical user interface session lock to initiate after

    10 minutes of inactivity:

    $ gsettings set org.gnome.desktop.screensaver lock-enabled true

    $ gsettings set org.gnome.desktop.screensaver lock-delay 0

    $ gsettings set org.gnome.desktop.session idle-delay 600'
  checks:
  - type: manual_review
    info: 'Verify the operating system has a graphical user interface session lock configured to

      activate after 15 minutes of inactivity by using the following commands:

      Note: If no graphical user interface is installed, this requirement is not applicable.

      Get the following settings to verify the graphical user interface session is configured to

      lock the graphical user session after 15 minutes of inactivity:

      $ gsettings get org.gnome.desktop.screensaver lock-enabled

      true

      $ gsettings get org.gnome.desktop.s'
    severity: medium
