- id: '1.4'
  title: UBTU-24-100030
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must not have the "telnet" package installed. GROUP ID: V-270647 RULE ID: SV-270647r1066430'
  rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities are often overlooked and therefore, may remain unsecure. They increase
    the risk to the platform by providing additional attack vectors. Telnet is a client/server application protocol that provides
    an unencrypted remote access service, which does not provide for the confidentiality and integrity of user passwords or
    the remote session. If users were allowed to login to a system using Telnet, the privileged user passwords and communications
    could be compromised. Removing the "telnetd" package decreases the risk of accidental or intentional activation of the
    Telnet service.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure telnetd is not installed"
  page_start: 25
  audit_raw: 'Verify that the "telnetd" package is not installed on the operating system by using the

    following command:

    $ dpkg -l | grep telnetd

    If the "telnetd" package is installed, this is a finding.'
  remediation: 'Remove the "telnetd" package by using the following command:

    $ sudo apt-get remove telnetd'
  checks:
  - type: command
    command: $ dpkg -l | grep telnetd
    expected: Verify that the "telnetd" package is not installed on the operating system by using the
    severity: medium
    info: 'Verify that the "telnetd" package is not installed on the operating system by using the

      following command:

      $ dpkg -l | grep telnetd

      If the "telnetd" package is installed, this is a finding.'
