    If a value of "1" is not returned, this is a finding.'
  remediation: 'Configure the operating system to run in FIPS mode. Add "fips=1" to the kernel

    parameter during the operating system install.

    Enabling a FIPS mode on a pre-existing system involves a number of modifications to

    the operating system. Refer to the Ubuntu Pro security certification documentation for

    instructions.

    A subscription to the "Ubuntu Pro" plan is required to obtain the FIPS Kernel

    cryptographic modules and enable FIPS.

    Note: Ubuntu Pro security certification instructions can be found at:

    https://ubuntu.com/security/certifications/docs/fips-enablement

    The basic steps use the following commands:

    $ sudo pro attach <token>

    $ sudo pro enable fips-updates'
  checks:
  - type: manual_review
    info: 'Verify the system is configured to run in FIPS mode by using the following command:

      $ grep -i 1 /proc/sys/crypto/fips_enabled

      1

      If a value of "1" is not returned, this is a finding.'
    severity: medium
- id: '1.102'
  title: UBTU-24-600060
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use DOD PKI-established certificate authorities for verification of the establishment
    of protected sessions. GROUP ID: V-270745 RULE ID: SV-270745r1066724'
  rationale: Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DOD-approved CA, trust of this CA has not been established. The DOD will only accept PKI-certificates
    obtained from a DOD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure
    sessions includes, for example, the use of SSL/TLS certificates.
  impact: ''
  references: []
  page_start: 251
  audit_raw: 'Verify the directory containing the root certificates for the operating system contains

    certificate files for DOD PKI-established certificate authorities by iterating over all files in

    the "/etc/ssl/certs" directory and checking if, at least one, has the subject matching

    "DOD ROOT CA".

    $ grep -ir DOD /etc/ssl/certs

    DOD_PKE_CA_chain.pem

    If no DOD root certificate is found, this is a finding.'
  remediation: 'Configure the operating system to use of DOD PKI-established certificate authorities for

    verification of the establishment of protected sessions.

    Edit the "/etc/ca-certificates.conf" file, adding the character "!" to the beginning of all

    uncommented lines that do not start with the "!" character with the following command:

    $ sudo sed -i -E ''s/^([^!#]+)/!\1/'' /etc/ca-certificates.conf

    Add at least one CA to the "/usr/local/share/ca-certificates" directory in the PEM format.

    Update the "/etc/ssl/certs" directory with the following command:

    $ sudo update-ca-certificates'
  checks:
  - type: manual_review
    info: 'Verify the directory containing the root certificates for the operating system contains

      certificate files for DOD PKI-established certificate authorities by iterating over all files in

      the "/etc/ssl/certs" directory and checking if, at least one, has the subject matching

      "DOD ROOT CA".

      $ grep -ir DOD /etc/ssl/certs

      DOD_PKE_CA_chain.pem

      If no DOD root certificate is found, this is a finding.'
    severity: medium
