      If the service is active and is not documented, this is a finding.'
    severity: medium
- id: '1.104'
  title: UBTU-24-600090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must implement cryptographic mechanisms to prevent unauthorized disclosure and modification
    of all information that requires protection at rest. GROUP ID: V-270747 RULE ID: SV-270747r1066730'
  rationale: 'Operating systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to
    prevent unauthorized disclosure and modification of the information at rest. Selection of a cryptographic mechanism is
    based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate
    with the security category and/or classification of the information. Organizations have the flexibility to either encrypt
    all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records,
    or fields). Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS000405-GPOS-00184'
  impact: ''
  references: []
  page_start: 255
  audit_raw: 'Verify the operating system prevents unauthorized disclosure or modification of all

    information requiring at-rest protection by using disk encryption.

    Note: If there is a documented and approved reason for not having data-at-rest

    encryption, this requirement is not applicable.

    Determine the partition layout for the system by using the following command:

    $ sudo fdisk -l

    ...

    Device Start End Sectors Size Type

    /dev/sda1 2048 2203647 2201600 1G EFI System

    /dev/sda2 2203648 6397951 4194304 2G Linux filesystem

    /dev/sda3 6397952 536868863 530470912 252.9G Linux filesystem

    ...

    Verify the system partitions are all encrypted by using the following command:

    # more /etc/crypttab

    Every persistent disk partition present must have an entry in the file.

    If any partitions other than the boot partition or pseudo file systems (such as /proc or

    /sys) are not listed, this is a finding.'
  remediation: 'To encrypt an entire partition, dedicate a partition for encryption in the partition layout.

    Note: Encrypting a partition in an already-installed system is more difficult because it will

    need to be resized and existing partitions changed.'
  checks:
  - type: manual_review
    info: 'Verify the operating system prevents unauthorized disclosure or modification of all

