  title: UBTU-24-300025
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must disable the x86 Ctrl-Alt-Delete key sequence if a graphical user interface is installed.
    GROUP ID: V-270711 RULE ID: SV-270711r1066622'
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete
    sequence is reduced because the user will be prompted before any action is taken.
  impact: ''
  references: []
  page_start: 179
  audit_raw: 'Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete

    is pressed when using a graphical user interface by using the following command:

    Note: If no graphical user interface is installed, this requirement is not applicable.

    $ gsettings get org.gnome.settings-daemon.plugins.media-keys logout

    @as []

    If the "logout" key is bound to an action, is commented out, or is missing, this is a

    finding.'
  remediation: 'Configure the operating system to disable the Ctrl-Alt-Delete sequence when using a

    graphical user interface:

    $ gsettings set org.gnome.settings-daemon.plugins.media-keys logout []

    Update the dconf settings:

    $ sudo dconf update'
  checks:
  - type: manual_review
    info: 'Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete

      is pressed when using a graphical user interface by using the following command:

      Note: If no graphical user interface is installed, this requirement is not applicable.

      $ gsettings get org.gnome.settings-daemon.plugins.media-keys logout

      @as []

      If the "logout" key is bound to an action, is commented out, or is missing, this is a

      finding.'
    severity: medium
