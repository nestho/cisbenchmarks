- id: '1.32'
  title: UBTU-24-102000
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system, when booted, must require authentication upon booting into single-user and maintenance
    modes. GROUP ID: V-270675 RULE ID: SV-270675r1066514'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement. Access control policies include identity-based
    policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include access control lists,
    access control matrices, and cryptography. These policies and mechanisms must be employed by the application to control
    access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs,
    and domains) in the information system.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure bootloader password is set"
  page_start: 94
  audit_raw: 'Verify the operating system requires a password for authentication upon booting into

    single-user and maintenance modes by using the following command:

    $ sudo grep -i password /boot/grub/grub.cfg

    password_pbkdf2 root

    grub.pbkdf2.sha512.10000.03255F190F0E2F7B4F0D1C3216012309162F022A7A636771

    If the root password entry does not begin with "password_pbkdf2", this is a finding.'
  remediation: 'Configure the operating system to require a password for authentication upon booting

    into single-user and maintenance modes.

    Generate an encrypted (grub) password for root by using the following command:

    $ grub-mkpasswd-pbkdf2

    Enter Password:

    Reenter Password:

    PBKDF2 hash of your password is

    grub.pbkdf2.sha512.10000.03255F190F0E2F7B4F0D1C3216012309162F022A7A636771

    Using the hash from the output, modify the "/etc/grub.d/40_custom" file by using the

    following command to add a boot password:

    $ sudo sed -i ''$i set superusers=\"root\"\npassword_pbkdf2 root <hash>''

    /etc/grub.d/40_custom

    where is the hash generated by grub-mkpasswd-pbkdf2 command.

    Generate an updated "grub.conf" file with the new password by using the following

    command:

    $ sudo update-grub'
