- id: '1.37'
  title: UBTU-24-200060
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must automatically terminate a user session after inactivity timeouts have expired. GROUP
    ID: V-270680 RULE ID: SV-270680r1066529'
  rationale: Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the
    termination of network connections associated with communications sessions (i.e., network disconnect). A logical session
    (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses
    an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating
    network sessions. Session termination terminates all processes associated with a user's logical session except those processes
    specifically created by the user (i.e., session owner) to continue after the session is terminated. Conditions or trigger
    events requiring automatic session termination can include, for example, organization-defined periods of user inactivity,
    targeted responses to certain types of incidents, and time-of-day restrictions on information system use. This capability
    is typically reserved for specific operating system functionality where the system owner, data owner, or organization
    requires additional assurance.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure default user shell timeout is configured"
  page_start: 105
  audit_raw: 'Verify the operating system is configured to automatically terminates a user session

    after inactivity timeouts have expired with the following command:

    $ sudo grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*

    /etc/profile.d/99-terminal_tmout.sh:TMOUT=600

    If "TMOUT" is not set, or if the value is "0" or is commented out, this is a finding.'
  remediation: 'Configure the operating system to automatically terminate a user session after inactivity

    timeouts have expired or at shutdown.

    Create the file "/etc/profile.d/99-terminal_tmout.sh" file if it does not exist.

    Modify or append the following line in the "/etc/profile.d/99-terminal_tmout.sh " file:

    TMOUT=600

    This will set a timeout value of 10 minutes for all future sessions.

    To set the timeout for the current sessions, execute the following command over the

    terminal session:

    $ export TMOUT=600'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to automatically terminates a user session

      after inactivity timeouts have expired with the following command:

      $ sudo grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*

      /etc/profile.d/99-terminal_tmout.sh:TMOUT=600

      If "TMOUT" is not set, or if the value is "0" or is commented out, this is a finding.'
    severity: medium
- id: '1.38'
  title: UBTU-24-200090
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must monitor remote access methods. GROUP ID: V-270681 RULE ID: SV-270681r1066532'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    Automated monitoring of remote access sessions allows organizations to detect cyberattacks and also ensure ongoing compliance
    with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol
    (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and
    tablets).
  impact: ''
  references: []
  page_start: 107
  audit_raw: 'Verify that the operating system monitors all remote access methods by using the

    following command:

    $ grep -Er ''^(auth\.\*,authpriv\.\*|daemon\.\*)'' /etc/rsyslog.*

    /etc/rsyslog.d/50-default.conf:auth.*,authpriv.* /var/log/secure

    /etc/rsyslog.d/50-default.conf:daemon.* /var/log/messages

    If "auth.", "authpriv.", or "daemon.*" are not configured to be logged in at least one of the

    config files, this is a finding.'
  remediation: 'Configure the operating system to monitor all remote access methods.

    Add or modify the following line in the "/etc/rsyslog.d/50-default.conf" file:

    auth.*,authpriv.* /var/log/secure

    daemon.* /var/log/messages

    Restart "rsyslog.service" for the changes to take effect by using the following command:

    $ sudo systemctl restart rsyslog.service'
  checks:
  - type: manual_review
    info: 'Verify that the operating system monitors all remote access methods by using the

      following command:

      $ grep -Er ''^(auth\.\*,authpriv\.\*|daemon\.\*)'' /etc/rsyslog.*

      /etc/rsyslog.d/50-default.conf:auth.*,authpriv.* /var/log/secure

      /etc/rsyslog.d/50-default.conf:daemon.* /var/log/messages

      If "auth.", "authpriv.", or "daemon.*" are not configured to be logged in at least one of the

      config files, this is a finding.'
    severity: medium
- id: '1.39'
  title: UBTU-24-200250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must automatically expire temporary accounts within 72 hours. GROUP ID: V-270682 RULE
    ID: SV-270682r1066535'
  rationale: 'Temporary accounts are privileged or nonprivileged accounts established during pressing circumstances, such
    as new software or hardware configuration or an incident response, where the need for prompt account activation requires
    bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled on the system and
    are not either manually removed or automatically expired within 72 hours, the security posture of the system will be degraded
    and exposed to exploitation by unauthorized users or insider threat actors. Temporary accounts are different from emergency
    accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are local logon accounts enabled
    on the system for emergency use by authorized system administrators to manage a system when standard logon methods are
    failing or not available. Emergency accounts are not subject to manual removal or scheduled expiration requirements. The
    automatic expiration of temporary accounts may be extended as needed by the circumstances, but it must not be extended
    indefinitely. A documented permanent account should be established for privileged users who need long-term maintenance
    accounts. Satisfies: SRG-OS-000002-GPOS-00002, SRG-OS-000123-GPOS-00064'
  impact: ''
  references: []
  page_start: 109
  audit_raw: 'Verify temporary accounts have been provisioned with an expiration date of 72 hours by

    using the following command:

    $ sudo chage -l <temporary_account_name> | grep -E ''(Password|Account)

    expires''

    Password expires : Apr 1, 2024

    Account expires : Apr 1, 2024

    Verify each of these accounts has an expiration date set within 72 hours.

    If any temporary accounts have no expiration date set or do not expire within 72 hours,

    this is a finding.'
  remediation: 'Configure the operating system to expire temporary accounts after 72 hours by using

    the following command:

    $ sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>'
  checks:
  - type: command
    command: $ sudo chage -l <temporary_account_name> | grep -E '(Password|Account)
    expected: ''
    severity: medium
    info: 'Verify temporary accounts have been provisioned with an expiration date of 72 hours by

