      Account expires : Apr 1, 2024

      Verify each of these accounts has an expiration date set within 72 hours.

      If any temporary accounts have no expiration date set or do not expir'
- id: '1.40'
  title: UBTU-24-200260
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable account identifiers (individuals, groups, roles, and devices) after 35 days
    of inactivity. GROUP ID: V-270683 RULE ID: SV-270683r1066538'
  rationale: Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier
    and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access
    to their user account has been obtained. Operating systems need to track periods of inactivity and disable application
    identifiers after 35 days of inactivity.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure inactive password lock is configured"
  page_start: 111
  audit_raw: 'Verify the account identifiers (individuals, groups, roles, and devices) are disabled after

    35 days of inactivity by using the following command:

    Check the account inactivity value by performing the following command:

    $ grep INACTIVE /etc/default/useradd

    INACTIVE=35

    If "INACTIVE" is set to "-1" or is not set to "35", is commented out, or is missing, this is a

    finding.'
  remediation: 'Configure the operating system to disable account identifiers after 35 days of inactivity

    after the password expiration.

    Run the following command to change the configuration for adduser:

    $ sudo useradd -D -f 35

    Note: DOD recommendation is 35 days, but a lower value is acceptable. The value "0"

    will disable the account immediately after the password expires.'
  checks:
  - type: manual_review
    info: 'Verify the account identifiers (individuals, groups, roles, and devices) are disabled after

      35 days of inactivity by using the following command:

      Check the account inactivity value by performing the following command:

      $ grep INACTIVE /etc/default/useradd

      INACTIVE=35

      If "INACTIVE" is set to "-1" or is not set to "35", is commented out, or is missing, this is a

      finding.'
    severity: medium
- id: '1.41'
  title: UBTU-24-200280
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must generate audit records for all account creations, modifications, disabling, and
    termination events that affect /etc/passwd. GROUP ID: V-270684 RULE ID: SV-270684r1066541'
  rationale: 'Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create an account. Auditing account creation
    actions provides logging that can be used for forensic purposes. To address access requirements, many operating systems
    may be integrated with enterprise level authentication/access/auditing mechanisms that meet or exceed access control policy
    requirements. Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000239-GPOS-00089, SRG-OS000240-GPOS-00090, SRG-OS-000241-GPOS-00091,
    SRG-OS-000303-GPOS-00120, SRG-OS-000458-GPOS-00203, SRG-OS-000463-GPOS-00207, SRG-OS-000476GPOS-00221'
  impact: ''
  references: []
  page_start: 113
  audit_raw: 'Verify the audit system generates audit records for all account creations, modifications,

    disabling, and termination events that affect "/etc/passwd" by using the following

    command:

    $ sudo auditctl -l | grep passwd

    -w /etc/passwd -p wa -k usergroup_modification

    If the command does not return a line that matches the example or the line is

    commented out, this is a finding.

    Note: The "-k" value is arbitrary and can be different from the example output above.'
  remediation: 'Configure the audit system to generate audit records for all account creations,

    modifications, disabling, and termination events that affect "/etc/passwd".

    Add or modify the following line to "/etc/audit/rules.d/stig.rules":

    -w /etc/passwd -p wa -k usergroup_modification

    To reload the rules file, issue the following command:

    $ sudo augenrules --load

    Note: The "-k " at the end of the line gives the rule a unique meaning to help during an

    audit investigation. The does not need to match the example above.'
  checks:
  - type: command
    command: $ sudo auditctl -l | grep passwd
    expected: ''
    severity: medium
    info: 'Verify the audit system generates audit records for all account creations, modifications,

      disabling, and termination events that affect "/etc/passwd" by using the following

      command:

      $ sudo auditctl -l | grep passwd

      -w /etc/passwd -p wa -k usergroup_modification

      If the command does not return a line that matches the example or the line is

      commented out, this is a finding.

      Note: The "-k" value is ar'
