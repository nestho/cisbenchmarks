  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable kernel core dumps so that it can fail to a secure state if system initialization
    fails, shutdown fails or aborts fail. GROUP ID: V-270746 RULE ID: SV-270746r1066727'
  rationale: Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps
    may consume a considerable amount of disk space and may result in denial of service by exhausting the available space
    on the target file system partition.
  impact: ''
  references: []
  page_start: 253
  audit_raw: 'Verify that kernel core dumps are disabled unless needed by using the following

