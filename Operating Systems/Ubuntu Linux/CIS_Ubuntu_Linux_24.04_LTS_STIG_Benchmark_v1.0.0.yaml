- id: '1.7'
  title: UBTU-24-100110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure AIDE to perform file integrity checking on the file system. GROUP ID:
    V-270650 RULE ID: SV-270650r1066439'
  rationale: Without verification of the security functions, security functions may not operate correctly and the failure
    may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible
    for enforcing the system security policy and supporting the isolation of code and data on which the protection is based.
    Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations
    (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters. This requirement
    applies to the operating system performing security function verification/testing and/or systems and environments that
    require this functionality.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure AIDE is installed"
  page_start: 31
  audit_raw: 'Verify that Advanced Intrusion Detection Environment (AIDE) is configured and

    operating correctly by using the following command (this will take a few minutes):

    Note: If AIDE is not installed, this requirement is not applicable.

    $ sudo aide -c /etc/aide/aide.conf --check

    Example output:

    Start timestamp: 2024-04-01 04:20:00 +1300 (AIDE 0.17.4)

    AIDE found differences between database and filesystem!!

    Ignored e2fs attributes: EIh

    ...

    If AIDE is being used to perform file integrity checks but the command fails, this is a

    finding.'
  remediation: 'Initialize AIDE (this will take a few minutes):

    $ sudo aideinit

    Running aide --init..

    The new database will need to be renamed to be read by AIDE:

    $ sudo cp -p /var/lib/aide/aide.db.new /var/lib/aide/aide.db

    Perform a manual check:

    $ sudo aide -c /etc/aide/aide.conf --check

    Example output:

    ...

    Start timestamp: 2024-10-30 14:22:38 -0400 (AIDE 0.18.6)

    AIDE found differences between database and filesystem!!

    ...

    Done.'
  checks:
  - type: manual_review
    info: 'Verify that Advanced Intrusion Detection Environment (AIDE) is configured and

      operating correctly by using the following command (this will take a few minutes):

      Note: If AIDE is not installed, this requirement is not applicable.

      $ sudo aide -c /etc/aide/aide.conf --check

      Example output:

      Start timestamp: 2024-04-01 04:20:00 +1300 (AIDE 0.17.4)

      AIDE found differences between database and filesystem!!

      Ignored e2fs attributes: EIh

      ...

      If AIDE is being used to perform file integrity checks but the co'
    severity: medium
- id: '1.8'
  title: UBTU-24-100120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must be configured so that the script that runs each 30 days or less to check file integrity
    is the default. GROUP ID: V-270651 RULE ID: SV-270651r1068395'
  rationale: Without verification of the security functions, security functions may not operate correctly and the failure
    may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible
    for enforcing the system security policy and supporting the isolation of code and data on which the protection is based.
    Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations
    (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters. Notifications
    provided by information systems include, for example, electronic alerts to system administrators, messages to local computer
    consoles, and/or hardware indications, such as lights. This requirement applies to the operating system performing security
    function verification/testing and/or systems and environments that require this functionality.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Note: If AIDE is not installed, this finding is not applicable.

    Check the AIDE configuration file integrity installed on the system (the default

    configuration file is located at /etc/aide/aide.conf or in /etc/aide/aide.conf.d/) with the

    following command:

    $ sudo sha256sum /etc/aide/aide.conf

    f3bbea2552f2c5b475627850d8a5fba1659df6466986d5a18948d9821ecbe491

    /etc/aide/aide.conf

    Download the original aide-common package in the /tmp directory:

    $ cd /tmp; apt download aide-common

    Generate the checksum from the aide.conf file in the downloaded .deb package:

    $ sudo dpkg-deb --fsys-tarfile /tmp/aide-common_0.18.6-2build2_all.deb | tar

    -xO ./usr/share/aide/config/aide/aide.conf | sha256sum

    f3bbea2552f2c5b475627850d8a5fba1659df6466986d5a18948d9821ecbe491 -

    If the checksums of the system file (/etc/aide/aide.conf) and the extracted file do not

    match, this is a finding.

    To verify the frequency of the file integrity checks, inspect the contents of the scheduled

    jobs as follows:

    Checking scheduled cron jobs:

    $ grep -r aide /etc/cron* /etc/crontab

    /etc/cron.daily/dailyaidecheck:SCRIPT="/usr/share/aide/bin/dailyaidecheck"

    Checking the systemd timer (this will show when the next scheduled run occurs and the

    last time the AIDE check was triggered):

    $ sudo systemctl list-timers | grep aide

    Thu 2024-10-31 02:01:58 EDT 10h Wed 2024-10-30 13:47:41 EDT

    - dailyaidecheck.timer dailyaidecheck.service

    The contents of these files can be inspected with the following commands:

    $ sudo systemctl cat dailyaidecheck.timer

    $ sudo systemctl cat dailyaidecheck.service

    If there is no AIDE script file in the cron directories or in the systemd timer, this is a

    finding.'
  remediation: 'The cron file for AIDE is fairly complex as it creates the report. This file is installed with

    the "aide-common" package, and the default can be restored by copying it from the

    package:

    Download the original package to the /tmp dir:

    $ cd /tmp; apt download aide-common

    Extract the aide script to its original place:

    $ dpkg-deb --fsys-tarfile /tmp/aide-common_*.deb | sudo tar -x --wildcards

    ./usr/share/aide/config/cron.daily/dailyaidecheck* -C /

    Copy it to the cron.daily directory:

    $ sudo cp -f /usr/share/aide/config/cron.daily/aide

    /etc/cron.daily/dailyaidecheck*'
  checks:
  - type: command
    command: $ sudo systemctl list-timers | grep aide
    expected: ''
    severity: medium
    info: 'Note: If AIDE is not installed, this finding is not applicable.

      Check the AIDE configuration file integrity installed on the system (the default

      configuration file is located at /etc/aide/aide.conf or in /etc/aide/aide.conf.d/) with the

      following command:

      $ sudo sha256sum /etc/aide/aide.conf

      f3bbea2552f2c5b475627850d8a5fba1659df6466986d5a18948d9821ecbe491

      /etc/aide/aide.conf

      Download the original '
- id: '1.9'
  title: UBTU-24-100130
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must notify designated personnel if baseline configurations are changed in an unauthorized
    manner. The file integrity tool must notify the system administrator when changes to the baseline configuration or anomalies
    in the operation of any security functions are discovered. GROUP ID: V-270652 RULE ID: SV-270652r1067138'
  rationale: 'Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow
    unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects,
    some of which may be relevant to security. Detecting such changes and providing an automated response can help avoid unintended,
    negative consequences that could ultimately affect the security state of the operating system. The operating system''s
    IMO/ISSO and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of
    a configuration item. Satisfies: SRG-OS-000363-GPOS-00150, SRG-OS-000447-GPOS-00201'
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify that Advanced Intrusion Detection Environment (AIDE) notifies the system

    administrator when anomalies in the operation of any security functions are discovered

    by using the following command:

    $ grep SILENTREPORTS /etc/default/aide

    SILENTREPORTS=no

    If "SILENTREPORTS" is set to "yes", is commented out, or is missing, this is a finding.'
  remediation: 'Configure AIDE to notify designated personnel if baseline configurations are changed in

    an unauthorized manner.

    Add or modify the following line in the "/etc/default/aide" file:

    SILENTREPORTS=no'
  checks:
  - type: manual_review
    info: 'Verify that Advanced Intrusion Detection Environment (AIDE) notifies the system

      administrator when anomalies in the operation of any security functions are discovered

      by using the following command:

      $ grep SILENTREPORTS /etc/default/aide

      SILENTREPORTS=no

      If "SILENTREPORTS" is set to "yes", is commented out, or is missing, this is a finding.'
    severity: medium
- id: '1.10'
  title: UBTU-24-100200
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must be configured to preserve log records from failure events. GROUP ID: V-270653 RULE
    ID: SV-270653r1067141'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. Preserving operating system state information
    helps to facilitate operating system restart and return to the operational mode of the organization with least disruption
    to mission/business processes.
  impact: ''
  references:
  - 1. CIS Recommendations "Ensure rsyslog is installed" & "Ensure rsyslog service is
  page_start: 38
  audit_raw: 'Verify the log service is installed properly by using the following command:

    $ dpkg -l | grep rsyslog

    ii rsyslog 8.2312.0-3ubuntu9 amd64 reliable system and kernel

    logging daemon

    If the "rsyslog" package is not installed, this is a finding.

    Check that the log service is enabled and active by using the following commands:

    $ systemctl is-enabled rsyslog.service

    enabled

    $ systemctl is-active rsyslog.service

    active

    If "rsyslog.service" is not enabled and active, this is a finding.'
  remediation: 'Install the log service by using the following command:

    $ sudo apt-get install rsyslog

    Enable and activate the log service by using the following command:

    $ sudo systemctl enable rsyslog.service --now'
  checks:
  - type: command
    command: $ dpkg -l | grep rsyslog
    expected: ''
    severity: medium
    info: 'Verify the log service is installed properly by using the following command:

      $ dpkg -l | grep rsyslog

      ii rsyslog 8.2312.0-3ubuntu9 amd64 reliable system and kernel

      logging daemon

      If the "rsyslog" package is not installed, this is a finding.

      Check that the log service is enabled and active by using the following commands:

      $ systemctl is-enabled rsyslog.service

      enabled

      $ systemctl is-active rsyslog.'
- id: '1.11'
  title: UBTU-24-100300
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must have an application firewall installed in order to control remote access methods.
    GROUP ID: V-270654 RULE ID: SV-270654r1067143'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated control capabilities, increase risk and make remote user access management difficult at best. Remote access
    is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    The operating system functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized
    activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access
    policies by enforcing connection rules of remote access applications on a variety of information system components (e.g.,
    servers, workstations, notebook computers, smartphones, and tablets).
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure ufw is installed"
  page_start: 40
  audit_raw: 'Verify that the Uncomplicated Firewall is installed by using the following command:

    $ dpkg -l | grep ufw

    ii ufw 0.36.2-6 all program for managing a Netfilter firewall

    If the "ufw" package is not installed, ask the system administrator if another application

    firewall is installed.

    If no application firewall is installed, this is a finding.'
  remediation: 'Install the Uncomplicated Firewall by using the following command:

    $ sudo apt install -y ufw'
  checks:
  - type: command
    command: $ dpkg -l | grep ufw
    expected: 'Verify that the Uncomplicated Firewall is installed by using the following command:'
    severity: medium
    info: 'Verify that the Uncomplicated Firewall is installed by using the following command:

      $ dpkg -l | grep ufw

      ii ufw 0.36.2-6 all program for managing a Netfilter firewall

      If the "ufw" package is not installed, ask the system administrator if another application

      firewall is installed.

      If no application firewall is installed, this is a finding.'
