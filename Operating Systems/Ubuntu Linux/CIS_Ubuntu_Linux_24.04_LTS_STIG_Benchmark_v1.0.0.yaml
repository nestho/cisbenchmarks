- id: '1.1'
  title: UBTU-24-90890
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use cryptographic mechanisms to protect the integrity of audit tools. GROUP ID:
    V-270831 RULE ID: SV-270831r1066982'
  rationale: Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity
    of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to successfully audit information system activity. Audit tools include, but are not limited to, vendor-provided
    and open source audit tools needed to successfully view and manipulate audit information system activity and records.
    Audit tools include custom queries and report generators. It is not uncommon for attackers to replace the audit tools
    or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from
    the audit logs. To address this risk, audit tools must be cryptographically signed in order to provide the capability
    to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file
    or files.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure cryptographic mechanisms are used to protect
  page_start: 19
  audit_raw: 'Verify that Advanced Intrusion Detection Environment (AIDE) is properly configured to

    use cryptographic mechanisms to protect the integrity of audit tools by using the

    following command:

    $ egrep ''(\/sbin\/(audit|au))'' /etc/aide/aide.conf

    /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512

    If any of the lines do not appear as shown, are commented out, or are missing, this is a

    finding.'
  remediation: 'Configure AIDE to protect the integrity of audit tools:

    Add or modify the following lines in the "/etc/aide/aide.conf" file:

    # Audit Tools

    /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512

    /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512'
  checks:
  - type: manual_review
    info: 'Verify that Advanced Intrusion Detection Environment (AIDE) is properly configured to

      use cryptographic mechanisms to protect the integrity of audit tools by using the

      following command:

      $ egrep ''(\/sbin\/(audit|au))'' /etc/aide/aide.conf

      /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512

      /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512

      /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512

      /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512

      /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512

      /sbin/augenrules p+i+n+u+g+s+b'
    severity: medium
- id: '1.2'
  title: UBTU-24-100010
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must not have the "systemd-timesyncd" package installed. GROUP ID: V-270645 RULE ID:
    SV-270645r1068357'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Organizations must consider
    endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify that the "systemd-timesyncd" package is not installed by using the following

    command:

    $ dpkg -l | grep systemd-timesyncd

    If the "systemd-timesyncd" package is installed, this is a finding.'
  remediation: 'The "systemd-timesyncd" package will be uninstalled as part of the "chrony" package

    install. The remaining configuration files for "systemd-timesyncd" must be purged from

    the operating system:

    $ sudo apt-get purge systemd-timesyncd'
  checks:
  - type: command
    command: $ dpkg -l | grep systemd-timesyncd
    expected: Verify that the "systemd-timesyncd" package is not installed by using the following
    severity: medium
    info: 'Verify that the "systemd-timesyncd" package is not installed by using the following

      command:

      $ dpkg -l | grep systemd-timesyncd

      If the "systemd-timesyncd" package is installed, this is a finding.'
