- id: '1.188'
  title: UBTU-24-909000
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: The operating system's audit system must protect auditing rules from unauthorized change.
  rationale: Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising
    its confidentiality. Audit information includes all information (e.g., audit records, audit settings, audit reports) needed
    to successfully audit Ubuntu 24.04 LTS system activity. In immutable mode, unauthorized users cannot execute changes to
    the audit system to potentially hide malicious activity and then put the audit rules back. A system reboot would be noticeable,
    and a system administrator could then investigate the unauthorized changes.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure the audit configuration is immutable"
  page_start: 428
  audit_raw: 'Verify the audit system prevents unauthorized changes to the rules with the following

    command:

    $ grep -E ''^-e 2'' /etc/audit/audit.rules

    -e 2

    If the audit system is not set to be immutable by adding the "-e 2" option to the end of

    "/etc/audit/audit.rules", this is a finding.'
  remediation: 'Configure the audit system to set the audit rules to be immutable by adding the

    following line to the end of "/etc/audit/rules.d/audit.rules":

    -e 2'
  checks:
  - type: manual_review
    info: 'Verify the audit system prevents unauthorized changes to the rules with the following

      command:

      $ grep -E ''^-e 2'' /etc/audit/audit.rules

      -e 2

      If the audit system is not set to be immutable by adding the "-e 2" option to the end of

      "/etc/audit/audit.rules", this is a finding.'
    severity: medium
