- id: '1.97'
  title: UBTU-24-500010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must generate audit records for privileged activities, nonlocal maintenance, diagnostic
    sessions and other system-level access. GROUP ID: V-270740 RULE ID: SV-270740r1066709'
  rationale: 'If events associated with nonlocal administrative access or diagnostic sessions are not logged, a major tool
    for assessing and investigating attacks would not be available. This requirement addresses auditing-related issues associated
    with maintenance tools used specifically for diagnostic and repair actions on organizational information systems. Nonlocal
    maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either
    an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those
    activities carried out by individuals physically present at the information system or information system component and
    not communicating across a network connection. This requirement applies to hardware/software diagnostic test equipment
    or tools. This requirement does not cover hardware/software components that may support information system maintenance,
    yet are a part of the system, for example, the software implementing "ping," "ls," "ipconfig," or the hardware and software
    implementing the monitoring port of an Ethernet switch. Satisfies: SRG-OS-000392-GPOS-00172, SRG-OS-000471-GPOS-00215'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure events that modify the sudo log file are collected"
  page_start: 240
  audit_raw: 'Verify the audit system audits activities performed during nonlocal maintenance and

    diagnostic sessions by using the following command:

    $ sudo auditctl -l | grep sudo.log

    -w /var/log/sudo.log -p wa -k maintenance

    If the command does not return lines that match the example or the lines are

    commented out, this is a finding.

    Note: The "-k" value is arbitrary and can be different from the example output above.'
  remediation: 'Configure the audit system to audit activities performed during nonlocal maintenance

    and diagnostic sessions.

    Add or modify the following line in the "/etc/audit/rules.d/stig.rules" file:

    -w /var/log/sudo.log -p wa -k maintenance

    To reload the rules file, issue the following command:

    $ sudo augenrules --load

    Note: The "-k " at the end of the line gives the rule a unique meaning to help during an

    audit investigation. The does not need to match the example above.'
  checks:
  - type: command
    command: $ sudo auditctl -l | grep sudo.log
    expected: ''
    severity: medium
    info: 'Verify the audit system audits activities performed during nonlocal maintenance and

      diagnostic sessions by using the following command:

      $ sudo auditctl -l | grep sudo.log

      -w /var/log/sudo.log -p wa -k maintenance

      If the command does not return lines that match the example or the lines are

      commented out, this is a finding.

      Note: The "-k" value is arbitrary and can be different from the example outp'
- id: '1.98'
  title: UBTU-24-500050
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use strong authenticators in establishing nonlocal maintenance and diagnostic sessions.
    GROUP ID: V-270741 RULE ID: SV-270741r1066712'
  rationale: Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through
    a network, either an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities
    are those activities carried out by individuals physically present at the information system or information system component
    and not communicating across a network connection. Typically, strong authentication requires authenticators that are resistant
    to replay attacks and employ multifactor authentication. Strong authenticators include, for example, PKI where certificates
    are stored on a token protected by a password, passphrase, or biometric.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd UsePAM is enabled"
  page_start: 243
  audit_raw: 'Verify the operating system is configured to use strong authenticators in the

    establishment of nonlocal maintenance and diagnostic maintenance by using the

    following command:

    $ sudo grep -r ^UsePAM /etc/ssh/sshd_config*

    /etc/ssh/sshd_config:UsePAM yes

    If "UsePAM" is not set to "yes", is commented out, is missing, or conflicting results are

    returned, this is a finding.'
  remediation: 'Configure the operating system to use strong authentication when establishing nonlocal

    maintenance and diagnostic sessions.

    Add or modify the following line to /etc/ssh/sshd_config:

    UsePAM yes

    Restart the SSH server for changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to use strong authenticators in the

      establishment of nonlocal maintenance and diagnostic maintenance by using the

      following command:

      $ sudo grep -r ^UsePAM /etc/ssh/sshd_config*

      /etc/ssh/sshd_config:UsePAM yes

      If "UsePAM" is not set to "yes", is commented out, is missing, or conflicting results are

      returned, this is a finding.'
    severity: medium
- id: '1.99'
  title: UBTU-24-600000
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must immediately terminate all network connections associated with SSH traffic after
    a period of inactivity. GROUP ID: V-270742 RULE ID: SV-270742r1066715'
  rationale: Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the
    termination of network connections that are associated with communications sessions (i.e., network disconnect). A logical
    session (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses
    an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating
    network sessions. Session termination terminates all processes associated with a user's logical session except those processes
    that are specifically created by the user (i.e., session owner) to continue after the session is terminated. Conditions
    or trigger events requiring automatic session termination can include, for example, organization-defined periods of user
    inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information system use.
    This capability is typically reserved for specific Ubuntu 24.04 LTS functionality where the system owner, data owner,
    or organization requires additional assurance.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd ClientAliveInterval and ClientAliveCountMax
  page_start: 245
  audit_raw: 'Verify that all network connections associated with SSH traffic automatically terminate

    after a period of inactivity with the following command:

    $ sudo grep -ir ClientAliveCountMax /etc/ssh/sshd_config*

    /etc/ssh/sshd_config:ClientAliveCountMax 1

    If "ClientAliveCountMax" is not to "1", if conflicting results are returned, is commented

    out, or is missing, this is a finding.'
  remediation: 'Configure the SSH server to terminate a user session automatically after the SSH client

    has become unresponsive.

    Note: This setting must be applied in conjunction with UBTU-22-255040 to function

    correctly.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    ClientAliveCountMax 1

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify that all network connections associated with SSH traffic automatically terminate

      after a period of inactivity with the following command:

      $ sudo grep -ir ClientAliveCountMax /etc/ssh/sshd_config*

      /etc/ssh/sshd_config:ClientAliveCountMax 1

      If "ClientAliveCountMax" is not to "1", if conflicting results are returned, is commented

      out, or is missing, this is a finding.'
    severity: medium
- id: '1.100'
  title: UBTU-24-600010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must immediately terminate all network connections associated with SSH traffic at the
    end of the session or after 10 minutes of inactivity. GROUP ID: V-270743 RULE ID: SV-270743r1066718'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at Ubuntu 24.04 LTS level, and de-allocating networking assignments at the application level if multiple application
    sessions are using a single operating system-level network connection. This does not mean that Ubuntu 24.04 LTS terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd ClientAliveInterval and ClientAliveCountMax
  page_start: 247
  audit_raw: 'Verify that all network connections associated with SSH traffic are automatically

    terminated at the end of the session or after 10 minutes of inactivity with the following

    command:

    $ grep -ir ClientAliveInterval /etc/ssh/sshd_config*

    /etc/ssh/sshd_config:ClientAliveInterval 600

    If "ClientAliveInterval" does not exist, is not set to a value of "600" or less, if conflicting

    results are returned, is commented out, or is missing, this is a finding.'
  remediation: 'Configure the SSH server to terminate a user session automatically after the SSH client

    has been unresponsive for 10 minutes.

    Note: This setting must be applied in conjunction with UBTU-22-255040 to function

    correctly.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    ClientAliveInterval 600

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify that all network connections associated with SSH traffic are automatically

      terminated at the end of the session or after 10 minutes of inactivity with the following

      command:

      $ grep -ir ClientAliveInterval /etc/ssh/sshd_config*

      /etc/ssh/sshd_config:ClientAliveInterval 600

      If "ClientAliveInterval" does not exist, is not set to a value of "600" or less, if conflicting

      results are returned, is commented out, or is missing, this is a finding.'
    severity: medium
- id: '1.101'
  title: UBTU-24-600030
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must implement NIST FIPS-validated cryptography to protect classified information and
    for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified information
    requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives,
    policies, regulations, and standards. GROUP ID: V-270744 RULE ID: SV-270744r1066721'
  rationale: 'Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. Satisfies: SRG-OS-000396-GPOS-00176, SRG-OS-000478-GPOS-00223'
  impact: ''
  references: []
  page_start: 249
  audit_raw: 'Verify the system is configured to run in FIPS mode by using the following command:

    $ grep -i 1 /proc/sys/crypto/fips_enabled

