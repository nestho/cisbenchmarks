  title: UBTU-24-900070
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must generate audit records for successful/unsuccessful uses of the su command. GROUP
    ID: V-270778 RULE ID: SV-270778r1066823'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the information system (e.g., module or policy
    filter).
  impact: ''
  references: []
  page_start: 319
  audit_raw: 'Verify the audit system generates audit records upon successful/unsuccessful attempts

    to use the "su" command by using the following command:

    $ sudo auditctl -l | grep /bin/su

    -a always,exit -F path=/bin/su -F perm=x -F auid>=1000 -F auid!=-1 -k

    privileged-priv_change

    If the command does not return lines that match the example or the lines are

    commented out, this is a finding.

    Note: The "key=" value is arbitrary and can be different from the example output above.'
  remediation: 'Configure the audit system to generate audit records when successful/unsuccessful

    attempts to use the "su" command occur.

    Add or modify the following line in the "/etc/audit/rules.d/stig.rules" file:

    -a always,exit -F path=/bin/su -F perm=x -F auid>=1000 -F auid!=-1 -k

    privileged-priv_change

    To reload the rules file, issue the following command:

    $ sudo augenrules --load

    Note: The "-k " at the end of the line gives the rule a unique meaning to help during an

    audit investigation. The does not need to match the example above.'
