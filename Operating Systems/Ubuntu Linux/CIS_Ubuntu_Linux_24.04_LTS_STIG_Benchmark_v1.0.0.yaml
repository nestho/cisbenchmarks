  description: 'The operating system must compare internal information system clocks at least every 24 hours with an authoritative
    time server. GROUP ID: V-270751 RULE ID: SV-270751r1066742'
  rationale: 'Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing internal information
    system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected
    over a network. Organizations should consider endpoints that may not have regular access to the authoritative time server
    (e.g., mobile, teleworking, and tactical endpoints). Satisfies: SRG-OS-000785-GPOS-00250, SRG-OS-000355-GPOS-00143'
  impact: ''
  references: []
  page_start: 264
  audit_raw: 'Verify the operating system is configured to compare the system clock at least every 24

    hours to the authoritative time source by using the following command:

    Note: If the system is not networked, this requirement is not applicable.

    $ sudo grep maxpoll -ir /etc/chrony*

    server [source] iburst maxpoll 16

    If the parameter "server" is not set, is not set to an authoritative DOD time source, or is

    commented out, this is a finding.

    If the "maxpoll" option is set to a number greater than 16, the line is commented out, or

    is missing, this is a finding.'
  remediation: 'Configure the operating system to compare the system clock at least every 24 hours to

    the authoritative time source.

    Add or modify the following line in the "/etc/chrony/chrony.conf" file:

    server [source] iburst maxpoll = 16

    Restart "chrony.service" for the changes to take effect by using the following command:

    $ sudo systemctl restart chrony.service'
  checks:
