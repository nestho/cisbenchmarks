- id: '1.65'
  title: UBTU-24-300022
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must be configured so that remote X connections are disabled, unless to fulfill documented
    and validated mission requirements. GROUP ID: V-270708 RULE ID: SV-270708r1066613'
  rationale: The security risk of using X11 forwarding is that the client's X11 display server may be exposed to attack when
    the SSH client requests forwarding. A system administrator may have a stance in which they want to protect clients that
    may expose themselves to attack by unwittingly requesting X11 forwarding, which can warrant a ''no'' setting. X11 forwarding
    should be enabled with caution. Users with the ability to bypass file permissions on the remote host (for the user's X11
    authorization database) can access the local X11 display through the forwarded connection. An attacker may then be able
    to perform activities such as keystroke monitoring if the ForwardX11Trusted option is also enabled. If X11 services are
    not required for the system's intended function, they should be disabled or restricted as appropriate to the system's
    needs.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd DisableForwarding is enabled"
  page_start: 174
  audit_raw: 'Verify that X11 forwarding is disabled by using the following command:

    $ sudo grep -ir x11forwarding /etc/ssh/sshd_config* | grep -v "^#"

    X11Forwarding no

    If "X11Forwarding" is set to "yes" and is not documented with the information system

    security officer (ISSO) as an operational requirement, is commented out, is missing, or

    conflicting results are returned, this is a finding.'
  remediation: 'Configure the SSH server to disable X11 forwarding.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    X11Forwarding no

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: command
