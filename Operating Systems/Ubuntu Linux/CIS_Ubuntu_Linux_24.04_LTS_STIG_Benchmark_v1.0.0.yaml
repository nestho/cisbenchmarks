  description: 'The operating system audit event multiplexor must be configured to offload audit logs onto a different system
    from the system being audited. GROUP ID: V-270658 RULE ID: SV-270658r1067151'
  rationale: 'Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Offloading
    is a common process in information systems with limited audit storage capacity. The auditd service does not include the
    ability to send audit records to a centralized server for management directly. However, it can use a plug-in for audit
