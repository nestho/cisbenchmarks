- id: '1.111'
  title: UBTU-24-600200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
    GROUP ID: V-270754 RULE ID: SV-270754r1066751'
  rationale: Denial of service (DoS) is a condition when a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses
    the configuration of the operating system to mitigate the impact of DoS attacks that have occurred or are ongoing on system
    availability. For each system, known and potential DoS attacks must be identified and solutions for each type implemented.
    A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes
    or establishing memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may
    reduce the susceptibility to some DoS attacks.
  impact: ''
  references: []
  page_start: 270
  audit_raw: "Verify an application firewall is configured to rate limit any connection to the system.\nCheck all the services\
    \ listening to the ports by using the following command:\n$ ss -l46ut\nNetid State Recv-Q Send-Q\nLocal Address:Port Peer\
    \ Address:Port Process\n tcp LISTEN 0 511\n*:http *:*\n tcp LISTEN 0 128\n[::]:ssh [::]:*\n tcp LISTEN 0 128\n[::]:ipp\
    \ [::]:*\n tcp LISTEN 0 128\n[::]:smtp [::]:*\nFor each entry, verify that the ufw is configured to rate limit the service\
    \ ports by using\nthe following command:\n$ sudo ufw status\nStatus: active\n To Action From\n -- ------ ----\n 80/tcp\
    \ LIMIT Anywhere\n 25/tcp LIMIT Anywhere\n Anywhere DENY 240.9.19.81\n 443 LIMIT Anywhere\n 22/tcp LIMIT Anywhere\n 80/tcp\
    \ (v6) LIMIT Anywhere\n 25/tcp (v6) LIMIT Anywhere\n 22/tcp (v6) LIMIT Anywhere (v6)\n 25 DENY OUT Anywhere\n 25 (v6)\
    \ DENY OUT Anywhere (v6)\nIf any port with a state of \"LISTEN\" that does not have an action of \"DENY\", is not\nmarked\
    \ with the \"LIMIT\" action, this is a finding. If the Status is set to anything other\nthan \"active\" this is a finding."
  remediation: 'Configure the application firewall to protect against or limit the effects of DoS attacks by

    ensuring the operating system is implementing rate-limiting measures on impacted

    network interfaces.

    For each service with a port listening to connections, run the following command,

    replacing "<service_name>" with the service that needs to be rate limited.

    To change the Status of ufw to "active" use the following command:

    $ sudo ufw enable

    Check all the services listening to the ports with the following command:

    $ sudo ss -l46ut

    Netid State Recv-Q Send-Q

    Local Address:Port Peer Address:Port

    Process

    tcp LISTEN 0 128

    [::]:ssh [::]:*

    For each service with a port listening to connections, run the following command,

    replacing "[service]" with the service that needs to be rate limited.

    $ sudo ufw limit <service_name>

    Rate-limiting can also be done on an interface. An example of adding a rate limit on the

    "ens160" interface follows:

    $ sudo ufw limit in on ens160'
  checks:
  - type: manual_review
    info: "Verify an application firewall is configured to rate limit any connection to the system.\nCheck all the services\
      \ listening to the ports by using the following command:\n$ ss -l46ut\nNetid State Recv-Q Send-Q\nLocal Address:Port\
      \ Peer Address:Port Process\n tcp LISTEN 0 511\n*:http *:*\n tcp LISTEN 0 128\n[::]:ssh [::]:*\n tcp LISTEN 0 128\n\
      [::]:ipp [::]:*\n tcp LISTEN 0 128\n[::]:smtp [::]:*\nFor each entry, verify that the ufw is configured to rate limit\
      \ the service ports by using\nthe following command:\n$ su"
    severity: medium
- id: '1.112'
  title: UBTU-24-600230
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable all wireless network adapters. GROUP ID: V-270755 RULE ID: SV-270755r1066754'
  rationale: Without protection of communications with wireless peripherals, confidentiality and integrity may be compromised
    because unprotected communications can be intercepted and either read, altered, or used to compromise the operating system.
    This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with
    an operating system. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR Keyboards, Mice, and Pointing Devices and Near Field
    Communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals
    must meet DOD requirements for wireless data transmission and be approved for use by the AO. Even though some wireless
    peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification
    of communications with these wireless peripherals may be used to compromise the operating system. Communication paths
    outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.
    Protecting the confidentiality and integrity of communications with wireless peripherals can be accomplished by physical
    means (e.g., employing physical barriers to wireless radio frequencies) or by logical means (e.g., employing cryptographic
    techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed,
    and vice versa. If the wireless peripheral is only passing telemetry data, encryption of the data may not be required.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure wireless interfaces are disabled"
  page_start: 273
  audit_raw: 'Verify that there are no wireless interfaces configured on the system by using the

    following command:

    Note: If the system does not have any physical wireless network radios, this

    requirement is not applicable.

    $ ls -L -d /sys/class/net/*/wireless | xargs dirname | xargs basename

    If any wireless interface names are listed under "Interface" and have not been

    documented and approved by the information system security officer (ISSO), this is a

    finding.'
  remediation: 'List all the wireless interfaces with the following command:

    $ ls -L -d /sys/class/net/*/wireless | xargs dirname | xargs basename

    For each interface, configure the system to disable wireless network interfaces with the

    following command:

    $ sudo ifdown <interface name>

    For each interface listed, find their respective module with the following command:

    $ basename $(readlink -f /sys/class/net/<interface name>/device/driver)

    where must be substituted by the actual interface name.

    Create a file in the "/etc/modprobe.d" directory and for each module, add the following

    line:

    install <module name> /bin/true

    For each module from the system, execute the following command to remove it:

    $ sudo modprobe -r <module name>'
  checks:
  - type: manual_review
    info: 'Verify that there are no wireless interfaces configured on the system by using the

      following command:

      Note: If the system does not have any physical wireless network radios, this

      requirement is not applicable.

      $ ls -L -d /sys/class/net/*/wireless | xargs dirname | xargs basename

      If any wireless interface names are listed under "Interface" and have not been

      documented and approved by the information system security officer (ISSO), this is a

      finding.'
    severity: medium
- id: '1.113'
  title: UBTU-24-700010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must generate error messages that provide information necessary for corrective actions
    without revealing information that could be exploited by adversaries. GROUP ID: V-270756 RULE ID: SV-270756r1066757'
  rationale: Any operating system providing too much information in error messages risks compromising the data and security
    of the structure, and content of error messages needs to be carefully considered by the organization. Organizations carefully
    consider the structure/content of error messages. The extent to which information systems are able to identify and handle
    error conditions is guided by organizational policy and operational requirements. Information that could be exploited
    by adversaries includes, for example, erroneous logon attempts with passwords entered by mistake as the username, mission/business
    information that can be derived from (if not stated explicitly by) information recorded, and personal information, such
    as account numbers, social security numbers, and credit card numbers. The /var/log/btmp, /var/log/wtmp, and /var/log/lastlog
    files have group write and global read permissions to allow for the lastlog function to perform. Limiting the permissions
    beyond this configuration will result in the failure of functions that rely on the lastlog database.
  impact: ''
  references: []
  page_start: 276
  audit_raw: 'Verify the operating system has all system log files under the "/var/log" directory with a

    permission set to "640" or less permissive by using the following command:

    Note: The btmp, wtmp, and lastlog files are excluded. Refer to the Discussion for

    details.

    $ sudo find /var/log -perm /137 ! -name ''*[bw]tmp'' ! -name ''*lastlog'' -type f

    -exec stat -c "%n %a" {} \;

    If the command displays any output, this is a finding.'
  remediation: 'Configure the operating system to set permissions of all log files under the "/var/log"

    directory to "640" or more restricted by using the following command:

    Note: The btmp, wtmp, and lastlog files are excluded. Refer to the Discussion for

    details.

    $ sudo find /var/log -perm /137 ! -name ''*[bw]tmp'' ! -name ''*lastlog'' -type f

    -exec chmod 640 ''{}'' \;'
  checks:
  - type: manual_review
    info: 'Verify the operating system has all system log files under the "/var/log" directory with a

      permission set to "640" or less permissive by using the following command:

      Note: The btmp, wtmp, and lastlog files are excluded. Refer to the Discussion for

      details.

      $ sudo find /var/log -perm /137 ! -name ''*[bw]tmp'' ! -name ''*lastlog'' -type f

      -exec stat -c "%n %a" {} \;

      If the command displays any output, this is a finding.'
    severity: medium
