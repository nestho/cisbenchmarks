  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must allow users to directly initiate a session lock for all connection types. GROUP
    ID: V-270674 RULE ID: SV-270674r1067167'
  rationale: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Rather than be forced to wait for a period
    of time to expire before the user session can be locked, the operating system need to provide users with the ability to
    manually invoke a session lock so users may secure their session if they need to temporarily vacate the immediate physical
    vicinity. Satisfies: SRG-OS-000030-GPOS-00011, SRG-OS-000031-GPOS-00012'
