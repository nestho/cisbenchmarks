      If the script file does not exist or does not offload audit logs, this is a finding.'
    severity: medium
- id: '1.175'
  title: UBTU-24-900960
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must immediately notify the system administrator (SA) and information system security
    officer (ISSO) (at a minimum) when allocated audit record storage volume reaches 75 percent of the repository maximum
    audit record storage capacity. GROUP ID: V-270818 RULE ID: SV-270818r1066943'
  rationale: If security personnel are not notified immediately when storage volume reaches 75 percent utilization, they are
    unable to plan for audit record storage capacity expansion.
  impact: ''
  references: []
  page_start: 401
  audit_raw: 'Verify the operating system is configured to notify the SA and ISSO when the audit

    record storage volume reaches 75 percent remaining of the repository maximum audit

    record storage capacity with the following command:

    Note: If the space_left_action is set to "email", an email package must be available.

    $ sudo grep ^space_left_action /etc/audit/auditd.conf

    space_left_action email

    $ sudo grep ^space_left /etc/audit/auditd.conf

    space_left 250000

    If the "space_left" parameter is set to "syslog", is missing, set to blanks, or set to a value

    less than 25 percent of the space free in the allocated audit record storage, this is a

    finding.

    If the "space_left_action" parameter is missing or set to blanks, this is a finding.

    If the "space_left_action" is set to "email", check the value of the "action_mail_acct"

    parameter with the following command:

    $ sudo grep ^action_mail_acct /etc/audit/auditd.conf

    action_mail_acct root@localhost

    The "action_mail_acct" parameter, if missing, defaults to "root". If the "action_mail_acct

    parameter" is not set to the email address of the SA(s) and/or ISSO, this is a finding.

    If the "space_left_action" is set to "exec", the system executes a designated script. If

    this script informs the SA of the event, this is not a finding.'
  remediation: 'Edit "/etc/audit/auditd.conf" and set the "space_left_action" parameter to "exec" or

    "email".

    If the "space_left_action" parameter is set to "email", set the "action_mail_acct"

    parameter to an email address for the SA and ISSO.

    If the "space_left_action" parameter is set to "exec", ensure the command being

    executed notifies the SA and ISSO.

    Edit "/etc/audit/auditd.conf" and set the "space_left" parameter to be at least 25 percent

    of the repository maximum audit record storage capacity.'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to notify the SA and ISSO when the audit

      record storage volume reaches 75 percent remaining of the repository maximum audit

      record storage capacity with the following command:

      Note: If the space_left_action is set to "email", an email package must be available.

      $ sudo grep ^space_left_action /etc/audit/auditd.conf

      space_left_action email

      $ sudo grep ^space_left /etc/audit/auditd.conf

      space_left 250000

      If the "space_left" parameter is set to "syslog", is '
    severity: medium
- id: '1.176'
  title: UBTU-24-900980
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must alert the information system security officer (ISSO) and system administrator (SA)
    in the event of an audit processing failure. GROUP ID: V-270819 RULE ID: SV-270819r1068390'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability,
    and system operation may be adversely affected. Audit processing failures include software/hardware errors, failures in
    the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement applies to each
    audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized
    audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure system is disabled when audit logs are full"
  page_start: 403
  audit_raw: 'Verify that the SA and ISSO are notified in the event of an audit processing failure by

    using the following command:

    Note: An email package must be installed on the system for email notifications to be

    sent.

    $ sudo grep ''^action_mail_acct'' /etc/audit/auditd.conf

    action_mail_acct = <administrator_email_account>

    If "action_mail_acct" is not set to the email address of the SA and/or ISSO, is

    commented out, or is missing, this is a finding.'
  remediation: 'Configure "auditd" service to notify the SA and ISSO in the event of an audit processing

    failure.

    Edit the following line in "/etc/audit/auditd.conf" to ensure administrators are notified via

    email for those situations:

    action_mail_acct = <administrator_email_account>

    Note: Change "administrator_email_account" to the email address of the SA and/or

    ISSO.

    Restart the "auditd" service for the changes take effect:

    $ sudo systemctl restart auditd.service'
  checks:
  - type: manual_review
    info: 'Verify that the SA and ISSO are notified in the event of an audit processing failure by

      using the following command:

      Note: An email package must be installed on the system for email notifications to be

      sent.

      $ sudo grep ''^action_mail_acct'' /etc/audit/auditd.conf

      action_mail_acct = <administrator_email_account>

      If "action_mail_acct" is not set to the email address of the SA and/or ISSO, is

      commented out, or is missing, this is a finding.'
    severity: medium
- id: '1.177'
  title: UBTU-24-901220
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must record time stamps for audit records that can be mapped to Coordinated Universal
    Time (UTC). GROUP ID: V-270820 RULE ID: SV-270820r1066949'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by the operating system include date and time. Time is commonly expressed in
    UTC or local time with an offset from UTC.
  impact: ''
  references: []
  page_start: 405
  audit_raw: 'Verify the time zone is configured to use UTC by using the following command:

    $ timedatectl status | grep -i "time zone"

    Time zone: Etc/UTC (UTC, +0000)

    If "Time zone" is not set to UTC or GMT, this is a finding.'
  remediation: 'To Configure the operating system time zone to use UTC or GMT, run the following

    command, replacing [ZONE] with UTC or GMT:

    $ sudo timedatectl set-timezone [ZONE]'
  checks:
  - type: command
    command: $ timedatectl status | grep -i "time zone"
    expected: ''
    severity: medium
    info: 'Verify the time zone is configured to use UTC by using the following command:

      $ timedatectl status | grep -i "time zone"

