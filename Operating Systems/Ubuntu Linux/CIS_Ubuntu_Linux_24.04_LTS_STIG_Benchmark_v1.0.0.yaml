- id: '1.6'
  title: UBTU-24-100100
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use a file integrity tool to verify correct operation of all security functions.
    GROUP ID: V-270649 RULE ID: SV-270649r1067136'
  rationale: Without verification of the security functions, security functions may not operate correctly and the failure
    may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible
    for enforcing the system security policy and supporting the isolation of code and data on which the protection is based.
    Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations
    (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters. This requirement
    applies to the operating system performing security function verification/testing and/or systems and environments that
    require this functionality.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure AIDE is installed"
  page_start: 29
  audit_raw: 'Verify that Advanced Intrusion Detection Environment (AIDE) is installed by using the

    following command:

    $ dpkg -l | grep aide

    ii aide 0.18.6-2build2 amd64 Advanced Intrusion Detection

    Environment - dynamic binary

    If AIDE is not installed, ask the system administrator how file integrity checks are

    performed on the system.

    If there is no application installed to perform integrity checks, this is a finding.'
  remediation: 'Install the "aide" package:

    $ sudo apt install aide'
  checks:
  - type: command
    command: $ dpkg -l | grep aide
    expected: Verify that Advanced Intrusion Detection Environment (AIDE) is installed by using the
