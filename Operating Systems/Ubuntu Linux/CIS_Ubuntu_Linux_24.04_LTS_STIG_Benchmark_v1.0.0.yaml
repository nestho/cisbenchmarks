- id: '1.52'
  title: UBTU-24-300001
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must be configured so that the Advance Package Tool (APT) prevents the installation of
    patches, service packs, device drivers, or operating system components without verification they have been digitally signed
    using a certificate that is recognized and approved by the organization. GROUP ID: V-270695 RULE ID: SV-270695r1066574'
  rationale: Changes to any software components can have significant effects on the overall security of the operating system.
    This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor. Accordingly,
    patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and
    approved by the organization. Verifying the authenticity of the software prior to installation validates the integrity
    of the patch or upgrade received from a vendor. This ensures the software has not been tampered with and that it has been
    provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should
    not have to verify the software again. This requirement does not mandate DOD certificates for this purpose; however, the
    certificate used to verify the software must be from an approved certificate authority (CA).
  impact: ''
  references: []
  page_start: 148
  audit_raw: 'Verify that APT is configured to prevent the installation of patches, service packs,

    device drivers, or Ubuntu operating system components without verification they have

    been digitally signed using a certificate that is recognized and approved by the

    organization by using the following command:

    $ grep AllowUnauthenticated /etc/apt/apt.conf.d/*

    If any files are returned from the command with "AllowUnauthenticated" are set to "true",

    this is a finding.'
  remediation: 'Configure APT to prevent the installation of patches, service packs, device drivers, or

    Ubuntu 24.04 LTS components without verification they have been digitally signed using

    a certificate recognized and approved by the organization.

    Remove/update any APT configuration files that contain the variable

    "AllowUnauthenticated" to "false" or remove "AllowUnauthenticated" entirely from each

    file. Below is an example of setting the "AllowUnauthenticated" variable to "false":

    APT::Get::AllowUnauthenticated "false";'
  checks:
  - type: manual_review
    info: 'Verify that APT is configured to prevent the installation of patches, service packs,

      device drivers, or Ubuntu operating system components without verification they have

      been digitally signed using a certificate that is recognized and approved by the

      organization by using the following command:

      $ grep AllowUnauthenticated /etc/apt/apt.conf.d/*

      If any files are returned from the command with "AllowUnauthenticated" are set to "true",

      this is a finding.'
    severity: medium
- id: '1.53'
  title: UBTU-24-300006
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system library files must have mode "755" or less permissive. GROUP ID: V-270696 RULE ID: SV-270696r1066577'
  rationale: If the operating system were to allow any user to make changes to software libraries, then those changes might
    be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.
    This requirement applies to operating systems with software libraries that are accessible and configurable, as in the
    case of interpreted languages. Software libraries also include privileged programs that execute with escalated privileges.
    Only qualified and authorized individuals must be allowed to obtain access to information system components for purposes
    of initiating changes, including upgrades and modifications.
  impact: ''
  references: []
  page_start: 150
  audit_raw: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", and

    "/usr/lib" have mode "755" or less permissive by using the following command:

    $ sudo find /lib /lib64 /usr/lib -perm /022 -type f -exec stat -c "%n %a"

    ''{}'' \;

    If any files are found to be group-writable or world-writable, this is a finding.'
  remediation: 'Configure the library files to be protected from unauthorized access. Run the following

    command:

    $ sudo find /lib /lib64 /usr/lib -perm /022 -type f -exec chmod 755 ''{}'' \;'
  checks:
  - type: manual_review
    info: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", and

      "/usr/lib" have mode "755" or less permissive by using the following command:

      $ sudo find /lib /lib64 /usr/lib -perm /022 -type f -exec stat -c "%n %a"

      ''{}'' \;

      If any files are found to be group-writable or world-writable, this is a finding.'
    severity: medium
