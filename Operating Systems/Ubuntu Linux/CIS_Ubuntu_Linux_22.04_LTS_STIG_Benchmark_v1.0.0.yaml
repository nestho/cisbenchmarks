    ID: SV-260595r958752'
  rationale: To ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating systems
    must be able to allocate audit record storage capacity. The task of allocating audit record storage capacity is usually
    performed during initial installation of the operating system.
