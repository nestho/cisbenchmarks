  title: UBTU-22-671010
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must implement NIST FIPS-validated cryptography to protect classified information and
    for the following: To provision digital signatures, to generate cryptographic hashes, and to protect unclassified information
    requiring confidentiality and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives,
    policies, regulations, and standards. GROUP ID: V-260650 RULE ID: SV-260650r987791'
  rationale: 'Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. Satisfies: SRG-OS-000396-GPOS-00176, SRG-OS-000478-GPOS-00223'
  impact: ''
  references: []
  page_start: 406
  audit_raw: 'Verify the system is configured to run in FIPS mode by using the following command:

    $ grep -i 1 /proc/sys/crypto/fips_enabled

    1

    If a value of "1" is not returned, this is a finding.'
  remediation: 'Configure the operating system to run in FIPS mode. Add "fips=1" to the kernel

    parameter during the operating system install.

    Enabling a FIPS mode on a pre-existing system involves a number of modifications to

    the operating system. Refer to the Ubuntu Pro security certification documentation for

    instructions.

    A subscription to the "Ubuntu Pro" plan is required to obtain the FIPS Kernel

    cryptographic modules and enable FIPS.

    Note: Ubuntu Pro security certification instructions can be found at:

    https://ubuntu.com/security/certifications/docs/fips-enablement'
  checks:
  - type: manual_review
    info: 'Verify the system is configured to run in FIPS mode by using the following command:

      $ grep -i 1 /proc/sys/crypto/fips_enabled

      1

      If a value of "1" is not returned, this is a finding.'
    severity: medium
