  description: 'The operating system must be configured such that Pluggable Authentication Module (PAM) prohibits the use
    of cached authentications after one day. GROUP ID: V-260581 RULE ID: SV-260581r958828'
  rationale: If cached authentication information is out-of-date, the validity of the authentication information may be questionable.
  impact: ''
  references: []
  page_start: 250
  audit_raw: 'Verify that PAM prohibits the use of cached authentications after one day by using the

    following command:

    Note: If smart card authentication is not being used on the system, this requirement is

    not applicable.

    $ sudo grep -i ''^\s*offline_credentials_expiration'' /etc/sssd/sssd.conf

    /etc/sssd/conf.d/*.conf

    /etc/sssd/sssd.conf:offline_credentials_expiration = 1

    If "offline_credentials_expiration" is not set to "1", is commented out, is missing, or

    conflicting results are returned, this is a finding.'
