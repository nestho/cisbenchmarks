- id: '1.49'
  title: UBTU-22-251025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure the Uncomplicated Firewall (ufw) to rate-limit impacted network interfaces.
    GROUP ID: V-260517 RULE ID: SV-260517r958902'
  rationale: Denial of service (DoS) is a condition when a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses
    the configuration of the operating system to mitigate the impact of DoS attacks that have occurred or are ongoing on system
    availability. For each system, known and potential DoS attacks must be identified and solutions for each type implemented.
    A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes
    or establishing memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may
    reduce the susceptibility to some DoS attacks.
  impact: ''
  references: []
  page_start: 113
  audit_raw: "Verify an application firewall is configured to rate limit any connection to the system.\nCheck all the services\
    \ listening to the ports by using the following command:\n$ ss -l46ut\nNetid State Recv-Q Send-Q\nLocal Address:Port Peer\
    \ Address:Port Process\n tcp LISTEN 0 511\n*:http *:*\n tcp LISTEN 0 128\n[::]:ssh [::]:*\n tcp LISTEN 0 128\n[::]:ipp\
    \ [::]:*\n tcp LISTEN 0 128\n[::]:smtp [::]:*\nFor each entry, verify that the ufw is configured to rate limit the service\
    \ ports by using\nthe following command:\n$ sudo ufw status\nStatus: active\n To Action From\n -- ------ ----\n 80/tcp\
    \ LIMIT Anywhere\n 25/tcp LIMIT Anywhere\n Anywhere DENY 240.9.19.81\n 443 LIMIT Anywhere\n 22/tcp LIMIT Anywhere\n 80/tcp\
    \ (v6) LIMIT Anywhere\n 25/tcp (v6) LIMIT Anywhere\n 22/tcp (v6) LIMIT Anywhere (v6)\n 25 DENY OUT Anywhere\n 25 (v6)\
    \ DENY OUT Anywhere (v6)\nIf any port with a state of \"LISTEN\" that does not have an action of \"DENY\", is not\nmarked\
    \ with the \"LIMIT\" action, this is a finding."
  remediation: 'Configure the application firewall to protect against or limit the effects of DoS attacks by

    ensuring the operating system is implementing rate-limiting measures on impacted

    network interfaces.

    For each service with a port listening to connections, run the following command,

    replacing "<service_name>" with the service that needs to be rate limited.

    $ sudo ufw limit <service_name>

    Rate-limiting can also be done on an interface. An example of adding a rate limit on the

    "ens160" interface follows:

    $ sudo ufw limit in on ens160'
  checks:
  - type: manual_review
    info: "Verify an application firewall is configured to rate limit any connection to the system.\nCheck all the services\
      \ listening to the ports by using the following command:\n$ ss -l46ut\nNetid State Recv-Q Send-Q\nLocal Address:Port\
      \ Peer Address:Port Process\n tcp LISTEN 0 511\n*:http *:*\n tcp LISTEN 0 128\n[::]:ssh [::]:*\n tcp LISTEN 0 128\n\
      [::]:ipp [::]:*\n tcp LISTEN 0 128\n[::]:smtp [::]:*\nFor each entry, verify that the ufw is configured to rate limit\
      \ the service ports by using\nthe following command:\n$ su"
    severity: medium
- id: '1.50'
  title: UBTU-22-251030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must be configured to prohibit or restrict the use of functions, ports, protocols, and/or
    services, as defined in the PPSM CAL and vulnerability assessments. GROUP ID: V-260518 RULE ID: SV-260518r958480'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports/protocols on information systems. Operating systems are capable of providing a wide variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., VPN and
    IPS); however, doing so increases risk over limiting the services provided by any one component. To support the requirements
    and principles of least functionality, the operating system must support the organizational requirements, providing only
    essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and
    approved to conduct official business or to address authorized quality of life issues.
  impact: ''
  references: []
  page_start: 116
  audit_raw: 'Check the firewall configuration for any unnecessary or prohibited functions, ports,

    protocols, and/or services by using the following command:

    $ sudo ufw show raw

    Chain INPUT (policy ACCEPT 0 packets, 0 bytes)

    pkts bytes target prot opt in out source

    destination

    Chain FORWARD (policy ACCEPT 0 packets, 0 bytes)

    pkts bytes target prot opt in out source

    destination

    Chain OUTPUT (policy ACCEPT 0 packets, 0 bytes)

    pkts bytes target prot opt in out source

    destination

    Ask the system administrator for the site or program PPSM CLSA. Verify the services

    allowed by the firewall match the PPSM CLSA.

    If there are any additional ports, protocols, or services that are not included in the PPSM

    CLSA, this is a finding.

    If there are any ports, protocols, or services that are prohibited by the PPSM CAL, this

    is a finding.'
  remediation: 'Add all ports, protocols, or services allowed by the PPSM CLSA by using the following

    command:

    $ sudo ufw allow <direction> <port/protocol/service>

    Where the direction is "in" or "out" and the port is the one corresponding to the protocol

    or service allowed.

    To deny access to ports, protocols, or services, use:

    $ sudo ufw deny <direction> <port/protocol/service>'
  checks:
  - type: sql
    command: show raw
    severity: medium
    info: 'Check the firewall configuration for any unnecessary or prohibited functions, ports,

      protocols, and/or services by using the following command:

      $ sudo ufw show raw

      Chain INPUT (policy ACCEPT 0 packets, 0 bytes)

      pkts bytes target prot opt in out source

      destination

      Chain FORWARD (policy ACCEPT 0 packets, 0 bytes)

      pkts bytes target prot opt in out source

      destination

      Chain OUTPUT (policy ACCEPT 0 pack'
