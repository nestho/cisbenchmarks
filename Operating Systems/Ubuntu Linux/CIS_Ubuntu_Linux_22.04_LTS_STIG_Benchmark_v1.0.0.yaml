  description: 'The operating system must have an application firewall installed in order to control remote access methods.
    GROUP ID: V-260514 RULE ID: SV-260514r958672'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated control capabilities, increase risk and make remote user access management difficult at best. Remote access
    is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    The operating system functionality (e.g., RDP) must be capable of taking enforcement action if the audit reveals unauthorized
    activity. Automated control of remote access sessions allows organizations to ensure ongoing compliance with remote access
    policies by enforcing connection rules of remote access applications on a variety of information system components (e.g.,
    servers, workstations, notebook computers, smartphones, and tablets).
