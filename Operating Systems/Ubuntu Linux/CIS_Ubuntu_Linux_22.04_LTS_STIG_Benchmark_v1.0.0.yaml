- id: '1.123'
  title: UBTU-22-653030
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must shut down by default upon audit failure. GROUP ID: V-260594 RULE ID: SV-260594r1038966'
  rationale: 'It is critical that when the operating system is at risk of failing to process audit logs as required, it takes
    action to mitigate the failure. Audit processing failures include: software/hardware errors; failures in the audit capturing
    mechanisms; and audit storage capacity being reached or exceeded. Responses to audit failure depend upon the nature of
    the failure mode. When availability is an overriding concern, other approved actions in response to an audit failure are
    as follows: 1. If the failure was caused by the lack of audit record storage capacity, the operating system must continue
    generating audit records if possible (automatically restarting the audit service if necessary), overwriting the oldest
    audit records in a first-in-first-out manner. 2. If audit records are sent to a centralized collection server and communication
    with this server is lost or the server fails, the operating system must queue audit records locally until communication
    is restored or until the audit records are retrieved manually. Upon restoration of the connection to the centralized collection
    server, action should be taken to synchronize the local audit data with the collection server.'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure system is disabled when audit logs are full"
  page_start: 286
  audit_raw: 'Verify that the operating system takes the appropriate action when the audit storage

    volume is full by using the following command:

    $ sudo grep -i disk_full_action /etc/audit/auditd.conf

    disk_full_action = HALT

    If "disk_full_action" is not set to "HALT", "SYSLOG", or "SINGLE", is commented out, or

    is missing, this is a finding.'
  remediation: 'Configure the operating system to shut down by default upon audit failure.

    Add or modify the following line in the "/etc/audit/auditd.conf " file:

    disk_full_action = HALT

    Restart the "auditd" service for the changes to take effect:

    $ sudo systemctl restart auditd.service

    Note: If system availability has been determined to be more important, and this decision

    is documented with the ISSO, configure Ubuntu 22.04 LTS to notify system

    administration staff and ISSO staff in the event of an audit processing failure by setting

    the "disk_full_action" to "SYSLOG" or "SINGLE".'
  checks:
  - type: manual_review
    info: 'Verify that the operating system takes the appropriate action when the audit storage

      volume is full by using the following command:

      $ sudo grep -i disk_full_action /etc/audit/auditd.conf

      disk_full_action = HALT

      If "disk_full_action" is not set to "HALT", "SYSLOG", or "SINGLE", is commented out, or

      is missing, this is a finding.'
    severity: medium
