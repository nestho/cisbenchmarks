    info: 'Verify the SSH server automatically terminates a user session after the SSH client has

      been unresponsive for 10 minutes by using the following command:

      $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

      tr ''\n'' '' '' | xargs sudo grep -iH ''clientaliveinterval''

      /etc/ssh/sshd_config:ClientAliveInterval 600

      If "ClientAliveInterval" does not exist, is not set to a value of "600" or less, if conflicting

      results are returned, is commented out, or is missing, this is a finding.'
    severity: medium
- id: '1.61'
  title: UBTU-22-255040
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must be configured so that remote X connections are disabled, unless to fulfill documented
    and validated mission requirements. GROUP ID: V-260529 RULE ID: SV-260529r991589'
  rationale: The security risk of using X11 forwarding is that the client's X11 display server may be exposed to attack when
    the SSH client requests forwarding. A system administrator may have a stance in which they want to protect clients that
    may expose themselves to attack by unwittingly requesting X11 forwarding, which can warrant a ''no'' setting. X11 forwarding
    should be enabled with caution. Users with the ability to bypass file permissions on the remote host (for the user's X11
    authorization database) can access the local X11 display through the forwarded connection. An attacker may then be able
    to perform activities such as keystroke monitoring if the ForwardX11Trusted option is also enabled. If X11 services are
    not required for the system's intended function, they should be disabled or restricted as appropriate to the system's
    needs.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd DisableForwarding is enabled"
  page_start: 143
  audit_raw: 'Verify that X11 forwarding is disabled by using the following command:

    $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

    tr ''\n'' '' '' | xargs sudo grep -iH ''x11forwarding''

    /etc/ssh/sshd_config:X11Forwarding no

    If "X11Forwarding" is set to "yes" and is not documented with the information system

    security officer (ISSO) as an operational requirement, is commented out, is missing, or

    conflicting results are returned, this is a finding.'
  remediation: 'Configure the SSH server to disable X11 forwarding.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    X11Forwarding no

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify that X11 forwarding is disabled by using the following command:

      $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

      tr ''\n'' '' '' | xargs sudo grep -iH ''x11forwarding''

      /etc/ssh/sshd_config:X11Forwarding no

      If "X11Forwarding" is set to "yes" and is not documented with the information system

      security officer (ISSO) as an operational requirement, is commented out, is missing, or

      conflicting results are returned, this is a finding.'
    severity: medium
- id: '1.62'
  title: UBTU-22-255045
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system SSH daemon must prevent remote hosts from connecting to the proxy display. GROUP ID:
    V-260530 RULE ID: SV-260530r991589'
  rationale: When X11 forwarding is enabled, there may be additional exposure to the server and client displays if the sshd
    proxy display is configured to listen on the wildcard address. By default, sshd binds the forwarding server to the loopback
    address and sets the hostname part of the DISPLAY environment variable to localhost. This prevents remote hosts from connecting
    to the proxy display.
  impact: ''
  references: []
  page_start: 145
  audit_raw: 'Verify the SSH server prevents remote hosts from connecting to the proxy display by

    using the following command:

    $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

    tr ''\n'' '' '' | xargs sudo grep -iH ''x11uselocalhost''

    /etc/ssh/sshd_config:X11UseLocalhost yes

    If "X11UseLocalhost" is set to "no", is commented out, is missing, or conflicting results

    are returned, this is a finding.'
  remediation: 'Configure the SSH server to prevent remote hosts from connecting to the proxy display.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    X11UseLocalhost yes

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify the SSH server prevents remote hosts from connecting to the proxy display by

      using the following command:

      $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

      tr ''\n'' '' '' | xargs sudo grep -iH ''x11uselocalhost''

      /etc/ssh/sshd_config:X11UseLocalhost yes

      If "X11UseLocalhost" is set to "no", is commented out, is missing, or conflicting results

      are returned, this is a finding.'
    severity: medium
- id: '1.63'
  title: UBTU-22-255050
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure the SSH daemon to use FIPS 140-3-approved ciphers to prevent the unauthorized
    disclosure of information and/or detect changes to information during transmission. GROUP ID: V-260531 RULE ID: SV-260531r958408'
  rationale: 'Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
    Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or an information system)
    communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dialup,
    broadband, and wireless. Nonlocal maintenance and diagnostic activities are those activities conducted by individuals
    communicating through a network, either an external network (e.g., the internet) or an internal network. Local maintenance
    and diagnostic activities are those activities carried out by individuals physically present at the information system
    or information system component and not communicating across a network connection. Encrypting information for transmission
    protects information from unauthorized disclosure and modification. Cryptographic mechanisms implemented to protect information
    integrity include, for example, cryptographic hash functions which have common application in digital signatures, checksums,
    and message authentication codes. By specifying a cipher list with the order of ciphers being in a "strongest to weakest"
    orientation, the system will automatically attempt to use the strongest cipher for securing SSH connections. Satisfies:
    SRG-OS-000033-GPOS-00014, SRG-OS-000394-GPOS-00174, SRG-OS000424-GPOS-00188'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd Ciphers are configured"
  page_start: 147
  audit_raw: 'Verify the SSH server is configured to only implement FIPS-approved ciphers with the

    following command:

    $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

    tr ''\n'' '' '' | xargs sudo grep -iH ''ciphers''

