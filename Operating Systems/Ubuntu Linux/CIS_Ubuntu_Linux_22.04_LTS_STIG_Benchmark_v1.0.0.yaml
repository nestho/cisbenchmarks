- id: '1.59'
  title: UBTU-22-255030
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must be configured so that all network connections associated with SSH traffic terminate
    after becoming unresponsive. GROUP ID: V-260527 RULE ID: SV-260527r986275'
  rationale: Terminating an unresponsive SSH session within a short time period reduces the window of opportunity for unauthorized
    personnel to take control of a management session enabled on the console or console port that has been left unattended.
    In addition, quickly terminating an idle SSH session will also free up resources committed by the managed network element.
    Terminating network connections associated with communications sessions includes, for example, deallocating associated
    TCP/IP address/port pairs at the operating system level and deallocating networking assignments at the application level
    if multiple application sessions are using a single operating system-level network connection. This does not mean the
    operating system terminates all sessions or network access; it only ends the unresponsive session and releases the resources
    associated with that session.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure sshd ClientAliveInterval and ClientAliveCountMax
  page_start: 139
  audit_raw: 'Verify the SSH server automatically terminates a user session after the SSH client has

    become unresponsive by using the following command:

    $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

    tr ''\n'' '' '' | xargs sudo grep -iH ''clientalivecountmax''

    /etc/ssh/sshd_config:ClientAliveCountMax 1

    If "ClientAliveCountMax" is not to "1", if conflicting results are returned, is commented

    out, or is missing, this is a finding.'
  remediation: 'Configure the SSH server to terminate a user session automatically after the SSH client

    has become unresponsive.

    Note: This setting must be applied in conjunction with UBTU-22-255040 to function

    correctly.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    ClientAliveCountMax 1

    Restart the SSH daemon for the changes to take effect:

    $ sudo systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'Verify the SSH server automatically terminates a user session after the SSH client has

      become unresponsive by using the following command:

      $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' |

      tr ''\n'' '' '' | xargs sudo grep -iH ''clientalivecountmax''

      /etc/ssh/sshd_config:ClientAliveCountMax 1

      If "ClientAliveCountMax" is not to "1", if conflicting results are returned, is commented

      out, or is missing, this is a finding.'
    severity: medium
