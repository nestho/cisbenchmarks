    "/var/log/audit/") by using the following command:

    $ sudo df -h /var/log/audit/

    /dev/sda2 24G 10.4G 13.6G 43% /var/log/audit

    If the audit records are not written to a partition made specifically for audit records

    ("/var/log/audit" as a separate partition), determine the amount of space being used by

    other files in the partition by using the following command:

    $ sudo du -sh <audit_partition>

    1.8G /var/log/audit

    Note: The partition size needed to capture a week''s worth of audit records is based on

    the activity level of the system and the total storage capacity available.

    If the audit record partition is not allocated for sufficient storage capacity, this is a

    finding.'
  remediation: "Allocate enough storage capacity for at least one week's worth of audit records when\naudit records are not\
    \ immediately sent to a central audit record storage facility.\nIf audit records are stored on a partition made specifically\
    \ for audit records, use the\n\"parted\" program to resize the partition with sufficient space to contain one week's worth\n\
    of audit records.\nIf audit records are not stored on a partition made specifically for audit records, a new\npartition\
    \ with sufficient amount of space will need be to be created.\nSet the auditd server to point to the mount point where\
    \ the audit records must be\nlocated:\n $ sudo sed -i -E 's@^(log_file\\s*=\\s*).*@\\1\n<audit_partition_mountpoint>/audit.log@'\
    \ /etc/audit/auditd.conf\nwhere <audit_partition_mountpoint> is the aforementioned mount point."
