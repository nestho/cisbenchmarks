- id: '1.177'
  title: UBTU-22-654230
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must prevent all software from executing at higher privilege levels than users executing
    the software and the audit system must be configured to audit the execution of privileged functions. GROUP ID: V-260648
    RULE ID: SV-260648r958730'
  rationale: 'In certain situations, software applications/programs need to execute with elevated privileges to perform required
    functions. However, if the privileges required for execution are at a higher level than the privileges assigned to organizational
    users invoking such applications/programs, those users are indirectly provided with greater privileges than assigned by
    the organizations. Some programs and processes are required to operate at a higher privilege level and therefore should
    be excluded from the organization-defined software list after review. Satisfies: SRG-OS-000326-GPOS-00126, SRG-OS-000327-GPOS-00127'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure actions as another user are always logged"
  page_start: 401
  audit_raw: 'Verify the audit system audits the execution of privilege functions by auditing the

    "execve" system call by using the following command:

    $ sudo auditctl -l | grep execve

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    If the command does not return lines that match the example or the lines are

    commented out, this is a finding.

    Note: The "key=" value is arbitrary and can be different from the example output above.'
  remediation: 'Configure the audit system to audit the execution of all privileged functions.

    Add or modify the following lines in the "/etc/audit/rules.d/stig.rules" file:

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv

    To reload the rules file, issue the following command:

    $ sudo augenrules --load

    Note: The "-k " at the end of the line gives the rule a unique meaning to help during an

    audit investigation. The does not need to match the example above.'
  checks:
  - type: command
    command: $ sudo auditctl -l | grep execve
    expected: ''
    severity: medium
    info: 'Verify the audit system audits the execution of privilege functions by auditing the

      "execve" system call by using the following command:

      $ sudo auditctl -l | grep execve

      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv

      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv

      -a'
- id: '1.178'
  title: UBTU-22-654235
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must generate audit records for privileged activities, nonlocal maintenance, diagnostic
    sessions and other system-level access. GROUP ID: V-260649 RULE ID: SV-260649r986298'
  rationale: 'If events associated with nonlocal administrative access or diagnostic sessions are not logged, a major tool
    for assessing and investigating attacks would not be available. This requirement addresses auditing-related issues associated
    with maintenance tools used specifically for diagnostic and repair actions on organizational information systems. Nonlocal
    maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either
    an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those
    activities carried out by individuals physically present at the information system or information system component and
    not communicating across a network connection. This requirement applies to hardware/software diagnostic test equipment
    or tools. This requirement does not cover hardware/software components that may support information system maintenance,
    yet are a part of the system, for example, the software implementing "ping," "ls," "ipconfig," or the hardware and software
    implementing the monitoring port of an Ethernet switch. Satisfies: SRG-OS-000392-GPOS-00172, SRG-OS-000471-GPOS-00215'
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure events that modify the sudo log file are collected"
  page_start: 403
