- id: '1.89'
  title: UBTU-22-432015
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must ensure only users who need access to security functions are part of sudo group.
    GROUP ID: V-260559 RULE ID: SV-260559r958518'
  rationale: An isolation boundary provides access control and protects the integrity of the hardware, software, and firmware
    that perform security functions. Security functions are the hardware, software, and/or firmware of the information system
    responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection
    is based. Operating systems implement code separation (i.e., separation of security functions from nonsecurity functions)
    in a number of ways, including through the provision of security kernels via processor rings or processor modes. For nonkernel
    code, security function isolation is often achieved through file system protections that serve to protect the code on
    disk and address space protections that protect executing code. Developers and implementers can increase the assurance
    in security functions by employing well-defined security policy models; structured, disciplined, and rigorous hardware
    and software development techniques; and sound system/security engineering principles. Implementation may include isolation
    of memory space and libraries. The operating system restricts access to security functions through the use of access control
    mechanisms and by implementing least privilege capabilities.
  impact: ''
  references: []
  page_start: 206
  audit_raw: 'Verify the sudo group has only members who require access to security functions by

    using the following command:

    $ grep sudo /etc/group

    sudo:x:27:<username>

    If the sudo group contains users not needing access to security functions, this is a

    finding.'
  remediation: 'Configure the sudo group with only members requiring access to security functions.

    To remove a user from the sudo group, run:

    $ sudo gpasswd -d <username> sudo'
  checks:
  - type: manual_review
    info: 'Verify the sudo group has only members who require access to security functions by

      using the following command:

      $ grep sudo /etc/group

      sudo:x:27:<username>

      If the sudo group contains users not needing access to security functions, this is a

      finding.'
    severity: medium
