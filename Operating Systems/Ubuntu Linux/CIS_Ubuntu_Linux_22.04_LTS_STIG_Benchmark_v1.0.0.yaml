  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must not have the "rsh-server" package installed. GROUP ID: V-260482 RULE ID: SV-260482r958478'
  rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Remote Shell (RSH) is a client/server application
    protocol that provides an unencrypted remote access service, which does not provide for the confidentiality and integrity
    of user passwords or the remote session. If users were allowed to login to a system using RSH, the privileged user passwords
    and communications could be compromised. Removing the "rsh-server" package decreases the risk of accidental or intentional
    activation of the RSH service.
