- id: '1.73'
  title: UBTU-22-291015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable all wireless network adapters. GROUP ID: V-260541 RULE ID: SV-260541r958358'
  rationale: Without protection of communications with wireless peripherals, confidentiality and integrity may be compromised
    because unprotected communications can be intercepted and either read, altered, or used to compromise the operating system.
    This requirement applies to wireless peripheral technologies (e.g., wireless mice, keyboards, displays, etc.) used with
    an operating system. Wireless peripherals (e.g., Wi-Fi/Bluetooth/IR Keyboards, Mice, and Pointing Devices and Near Field
    Communications [NFC]) present a unique challenge by creating an open, unsecured port on a computer. Wireless peripherals
    must meet DOD requirements for wireless data transmission and be approved for use by the AO. Even though some wireless
    peripherals, such as mice and pointing devices, do not ordinarily carry information that need to be protected, modification
    of communications with these wireless peripherals may be used to compromise the operating system. Communication paths
    outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification.
    Protecting the confidentiality and integrity of communications with wireless peripherals can be accomplished by physical
    means (e.g., employing physical barriers to wireless radio frequencies) or by logical means (e.g., employing cryptographic
    techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed,
    and vice versa. If the wireless peripheral is only passing telemetry data, encryption of the data may not be required.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure wireless interfaces are disabled"
  page_start: 172
  audit_raw: 'Verify that there are no wireless interfaces configured on the system by using the

    following command:

    Note: If the system does not have any physical wireless network radios, this

    requirement is not applicable.

    $ cat /proc/net/wireless

    If any wireless interface names are listed under "Interface" and have not been

    documented and approved by the information system security officer (ISSO), this is a

    finding.'
  remediation: 'Disable all wireless network interfaces by using the following command:

    $ sudo ifdown <wireless_interface_name>

    For each interface listed, find their respective module by using the following command:

    $ basename $(readlink -f

    /sys/class/net/<wireless_interface_name>/device/driver

    where <wireless_interface_name> must be substituted by the actual interface name.

    Create and/or append a custom file under "/etc/modprobe.d/" by using the following

    command:

    $ sudo su -c "echo install <module_name> /bin/false >>

    /etc/modprobe.d/stig.conf"

    where <module_name> must be substituted by the actual module name.

    For each module from the system, execute the following command to remove it:

    $ sudo modprobe -r <module_name>'
  checks:
  - type: manual_review
    info: 'Verify that there are no wireless interfaces configured on the system by using the

      following command:

      Note: If the system does not have any physical wireless network radios, this

      requirement is not applicable.

      $ cat /proc/net/wireless

      If any wireless interface names are listed under "Interface" and have not been

      documented and approved by the information system security officer (ISSO), this is a

      finding.'
    severity: medium
- id: '1.74'
  title: UBTU-22-411010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must prevent direct login into the root account. GROUP ID: V-260542 RULE ID: SV-260542r1015006'
  rationale: To ensure individual accountability and prevent unauthorized access, organizational users must be individually
    identified and authenticated. A group authenticator is a generic account used by multiple individuals. Use of a group
    authenticator alone does not uniquely identify individual users. Examples of the group authenticator is the Unix OS "root"
    user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account. For example, the Unix and
    Windows operating systems offer a "switch user" capability allowing users to authenticate with their individual credentials
    and, when needed, "switch" to the administrator role. This method provides for unique individual authentication prior
    to using a group authenticator. Users (and any processes acting on behalf of users) must be uniquely identified and authenticated
    for all accesses other than those accesses explicitly identified and documented by the organization, which outlines specific
    user actions that can be performed on the operating system without identification or authentication. Requiring individuals
    to be authenticated with an individual authenticator prior to using a group authenticator allows for traceability of actions,
    as well as adding an additional level of protection of the actions that can be taken with group account knowledge.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure root account is locked"
  page_start: 174
  audit_raw: 'Verify the operating system prevents direct logins to the root account by using the

    following command:

    $ sudo passwd -S root

    root L 08/09/2022 0 99999 7 -1

    If the output does not contain "L" in the second field to indicate the account is locked,

    this is a finding.'
  remediation: 'Configure the operating system to prevent direct logins to the root account by using the

    following command:

    $ sudo passwd -l root'
  checks:
  - type: manual_review
    info: 'Verify the operating system prevents direct logins to the root account by using the

      following command:

      $ sudo passwd -S root

      root L 08/09/2022 0 99999 7 -1

      If the output does not contain "L" in the second field to indicate the account is locked,

      this is a finding.'
    severity: medium
