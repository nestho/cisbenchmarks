- id: '1.17'
  title: UBTU-22-232010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must have directories that contain system commands set to a mode of "755" or less permissive.
    GROUP ID: V-260485 RULE ID: SV-260485r991559'
  rationale: Protecting audit information also includes identifying and protecting the tools used to view and manipulate log
    data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information. Operating
    systems providing tools to interface with audit information will leverage user permissions and roles identifying the user
    accessing the tools and the corresponding rights the user has in order to make access decisions regarding the deletion
    of audit tools. Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'Verify the system commands directories have mode "755" or less permissive by using

    the following command:

    $ find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm

    /022 -type d -exec stat -c "%n %a" ''{}'' \;

    If any directories are found to be group-writable or world-writable, this is a finding.'
  remediation: 'Configure the operating system commands directories to be protected from

    unauthorized access. Run the following command:

    $ sudo find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -

    perm /022 -type d -exec chmod -R 755 ''{}'' \;'
  checks:
  - type: manual_review
    info: 'Verify the system commands directories have mode "755" or less permissive by using

      the following command:

      $ find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm

      /022 -type d -exec stat -c "%n %a" ''{}'' \;

      If any directories are found to be group-writable or world-writable, this is a finding.'
    severity: medium
