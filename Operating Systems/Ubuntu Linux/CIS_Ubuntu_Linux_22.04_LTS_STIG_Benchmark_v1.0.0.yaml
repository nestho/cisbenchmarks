- id: '1.84'
  title: UBTU-22-412030
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
    GROUP ID: V-260554 RULE ID: SV-260554r958636'
  rationale: Terminating an idle interactive command shell user session within a short time period reduces the window of opportunity
    for unauthorized personnel to take control of it when left unattended in a virtual terminal or physical console.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure default user shell timeout is configured"
  page_start: 195
  audit_raw: 'Verify the operating system is configured to automatically exit interactive command shell

    user sessions after 15 minutes of inactivity or less by using the following command:

    $ sudo grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*

    /etc/profile.d/99-terminal_tmout.sh:TMOUT=900

    If "TMOUT" is not set to "900" or less, is set to "0", is commented out, or missing, this is

    a finding.'
  remediation: 'Configure the operating system to exit interactive command shell user sessions after 15

    minutes of inactivity.

    Create and/or append a custom file under "/etc/profile.d/" by using the following

    command:

    $ sudo su -c "echo TMOUT=900 >> /etc/profile.d/99-terminal_tmout.sh"

    This will set a timeout value of 15 minutes for all future sessions.

    To set the timeout for the current sessions, execute the following command over the

    terminal session:

    $ export TMOUT=900'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to automatically exit interactive command shell

      user sessions after 15 minutes of inactivity or less by using the following command:

      $ sudo grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*

      /etc/profile.d/99-terminal_tmout.sh:TMOUT=900

      If "TMOUT" is not set to "900" or less, is set to "0", is commented out, or missing, this is

      a finding.'
    severity: medium
