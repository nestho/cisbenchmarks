  description: 'The operating system must generate audit records for successful/unsuccessful uses of the chmod, fchmod, and
    fchmodat system calls. GROUP ID: V-260633 RULE ID: SV-260633r958446'
  rationale: 'Without generating audit records specific to the security and mission needs of the organization, it would be
    difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for
    one. Audit records can be generated from various components within the information system (e.g., module or policy filter).
    The system call rules are loaded into a matching engine that intercepts each syscall that all programs on the system makes.
    Therefore, it is very important to only use syscall rules when absolutely necessary since these affect performance. The
    more rules, the bigger the performance hit. The performance is helped, though, by combining syscalls into one rule whenever
    possible. Satisfies: SRG-OS-000064-GPOS-00033, SRG-OS-000462-GPOS-00206'
