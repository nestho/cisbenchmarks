      [ 0.000000] NX (Execute Disable) protection: active

      If "dmesg" does not show "NX (Execute Disable) protection: active", check the hardware

      capabilities of the installed CPU by using the following command:

      $ grep flags /proc/cpuinfo | grep -o nx | sort -u

      nx

      If no outp'
- id: '1.8'
  title: UBTU-22-214010
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must be configured so that the Advance Package Tool (APT) prevents the installation of
    patches, service packs, device drivers, or operating system components without verification they have been digitally signed
    using a certificate that is recognized and approved by the organization. GROUP ID: V-260476 RULE ID: SV-260476r1015003'
  rationale: Changes to any software components can have significant effects on the overall security of the operating system.
    This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor. Accordingly,
    patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and
    approved by the organization. Verifying the authenticity of the software prior to installation validates the integrity
    of the patch or upgrade received from a vendor. This ensures the software has not been tampered with and that it has been
    provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should
    not have to verify the software again. This requirement does not mandate DOD certificates for this purpose; however, the
    certificate used to verify the software must be from an approved certificate authority (CA).
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Verify that APT is configured to prevent the installation of patches, service packs,

    device drivers, or Ubuntu operating system components without verification they have

    been digitally signed using a certificate that is recognized and approved by the

    organization by using the following command:

    $ grep -i allowunauthenticated /etc/apt/apt.conf.d/*

    /etc/apt/apt.conf.d/01-vendor-ubuntu:APT::Get::AllowUnauthenticated "false";

    If "APT::Get::AllowUnauthenticated" is not set to "false", is commented out, or is

    missing, this is a finding.'
  remediation: 'Configure APT to prevent the installation of patches, service packs, device drivers, or

    Ubuntu operating system components without verification they have been digitally

    signed using a certificate that is recognized and approved by the organization.

    Add or modify the following line in any file under the "/etc/apt/apt.conf.d/" directory:

    APT::Get::AllowUnauthenticated "false";'
  checks:
  - type: manual_review
    info: 'Verify that APT is configured to prevent the installation of patches, service packs,

      device drivers, or Ubuntu operating system components without verification they have

      been digitally signed using a certificate that is recognized and approved by the

      organization by using the following command:

      $ grep -i allowunauthenticated /etc/apt/apt.conf.d/*

      /etc/apt/apt.conf.d/01-vendor-ubuntu:APT::Get::AllowUnauthenticated "false";

      If "APT::Get::AllowUnauthenticated" is not set to "false", is commented ou'
    severity: medium
- id: '1.9'
  title: UBTU-22-214015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must be configured so that the Advance Package Tool (APT) removes all software components
    after updated versions have been installed. GROUP ID: V-260477 RULE ID: SV-260477r1044773'
  rationale: Previous versions of software components that are not removed from the information system after updates have
    been installed may be exploited by adversaries. Some information technology products may remove older versions of software
    automatically from the information system.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify APT is configured to remove all software components after updated versions

    have been installed by using the following command:

    $ grep -i remove-unused /etc/apt/apt.conf.d/50unattended-upgrades

    Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

    Unattended-Upgrade::Remove-Unused-Dependencies "true";

    If "Unattended-Upgrade::Remove-Unused-Kernel-Packages" and "UnattendedUpgrade::Remove-Unused-Dependencies" are not set
    to "true", are commented out, or

    are missing, this is a finding.'
  remediation: 'Configure APT to remove all software components after updated versions have been

    installed.

    Add or modify the following lines in the "/etc/apt/apt.conf.d/50unattended-upgrades" file:

    Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

    Unattended-Upgrade::Remove-Unused-Dependencies "true";'
  checks:
  - type: manual_review
    info: 'Verify APT is configured to remove all software components after updated versions

      have been installed by using the following command:

      $ grep -i remove-unused /etc/apt/apt.conf.d/50unattended-upgrades

      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

      Unattended-Upgrade::Remove-Unused-Dependencies "true";

      If "Unattended-Upgrade::Remove-Unused-Kernel-Packages" and "UnattendedUpgrade::Remove-Unused-Dependencies" are not set
      to "true", are commented out, or

      are missing, this is a finding.'
    severity: medium
- id: '1.10'
  title: UBTU-22-215010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must have the "libpam-pwquality" package installed. GROUP ID: V-260478 RULE ID: SV-260478r991587'
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. "pwquality" enforces complex password construction configuration and has the ability to limit brute-force attacks
    on the system.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure libpam-pwquality is installed"
  page_start: 34
  audit_raw: 'Verify the operating system has the "libpam-pwquality" package installed with the

    following command:

    $ dpkg -l | grep libpam-pwquality

    ii libpam-pwquality:amd64 1.4.4-1build2 amd64 PAM module to

    check password strength

    If "libpam-pwquality" is not installed, this is a finding.'
  remediation: 'Install the "pam_pwquality" package by using the following command:

    $ sudo apt-get install libpam-pwquality'
  checks:
  - type: command
    command: $ dpkg -l | grep libpam-pwquality
    expected: ''
    severity: medium
    info: 'Verify the operating system has the "libpam-pwquality" package installed with the

      following command:

      $ dpkg -l | grep libpam-pwquality

      ii libpam-pwquality:amd64 1.4.4-1build2 amd64 PAM module to

      check password strength

      If "libpam-pwquality" is not installed, this is a finding.'
- id: '1.11'
  title: UBTU-22-215015
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must have the "chrony" package installed. GROUP ID: V-260479 RULE ID: SV-260479r991589'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Organizations must consider
    endpoints that may not have regular access to the authoritative time server (e.g., mobile, teleworking, and tactical endpoints).
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Verify the "chrony" package is installed using the following command:

    $ dpkg -l | grep chrony

    ii chrony 4.2-2ubuntu2 amd64 Versatile implementation of the

    Network Time Protocol

    If the "chrony" package is not installed, this is a finding.'
  remediation: 'Install the "chrony" network time protocol package using the following command:

    $ sudo apt-get install chrony'
  checks:
  - type: command
    command: $ dpkg -l | grep chrony
    expected: ''
    severity: medium
    info: 'Verify the "chrony" package is installed using the following command:

      $ dpkg -l | grep chrony

      ii chrony 4.2-2ubuntu2 amd64 Versatile implementation of the

      Network Time Protocol

      If the "chrony" package is not installed, this is a finding.'
