- id: '1.20'
  title: UBTU-22-232025
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must configure the "/var/log" directory to have mode "755" or less permissive. ROUP ID:
    V-260488 RULE ID: SV-260488r958566'
  rationale: Only authorized personnel should be aware of errors and the details of the errors. Error messages are an indicator
    of an organization's operational state or can identify the operating system or platform. Additionally, personally identifiable
    information (PII) and operational information must not be revealed through error messages to unauthorized personnel or
    their designated representatives. The structure and content of error messages must be carefully considered by the organization
    and development team. The extent to which the information system is able to identify and handle error conditions is guided
    by organizational policy and operational requirements.
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'Verify the "/var/log" directory has mode of "755" or less permissive by using the

    following command:

    Note: If rsyslog is active and enabled on the operating system, this requirement is not

    applicable.

    $ stat -c "%n %a" /var/log

    /var/log 755

    If a value of "755" or less permissive is not returned, this is a finding.'
  remediation: 'Configure the "/var/log" directory to have permissions of "0755" by using the following

    command:

    $ sudo chmod 0755 /var/log'
  checks:
  - type: manual_review
    info: 'Verify the "/var/log" directory has mode of "755" or less permissive by using the

