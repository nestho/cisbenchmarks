- id: '1.45'
  title: UBTU-22-232145
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must set a sticky bit on all public directories to prevent unauthorized and unintended
    information transferred via shared system resources. GROUP ID: V-260513 RULE ID: SV-260513r958524'
  rationale: Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations
    of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles)
    from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g.,
    registers, main memory, hard disks) after those resources have been released back to information systems. The control
    of information in shared resources is also commonly referred to as object reuse and residual information protection. This
    requirement generally applies to the design of an information technology product, but it can also apply to the configuration
    of particular information system components that are, or use, such products. This can be verified by acceptance/validation
    processes in DOD or other government agencies. There may be shared resources with configurable protections (e.g., files
    in storage) that may be assessed on specific information system components.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure world writable files and directories are secured"
  page_start: 105
  audit_raw: 'Verify that all public directories have the public sticky bit set by using the following

    command:

    $ sudo find / -type d -perm -002 ! -perm -1000

    If any public directories are found missing the sticky bit, this is a finding.'
  remediation: 'Configure all public directories to have the sticky bit set to prevent unauthorized and

    unintended information transferred via shared system resources.

    Set the sticky bit on all public directories using the following command, replacing

    "<public_directory_name>" with any directory path missing the sticky bit:

    $ sudo chmod +t <public_directory_name>'
  checks:
  - type: manual_review
    info: 'Verify that all public directories have the public sticky bit set by using the following

      command:

      $ sudo find / -type d -perm -002 ! -perm -1000

      If any public directories are found missing the sticky bit, this is a finding.'
    severity: medium
