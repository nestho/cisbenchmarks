- id: '1.118'
  title: UBTU-22-652015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must monitor remote access methods. GROUP ID: V-260589 RULE ID: SV-260589r958406'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    Automated monitoring of remote access sessions allows organizations to detect cyberattacks and also ensure ongoing compliance
    with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol
    (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and
    tablets).
  impact: ''
  references: []
  page_start: 267
  audit_raw: 'Verify that the operating system monitors all remote access methods by using the

    following command:

    $ grep -Er ''^(auth\.\*,authpriv\.\*|daemon\.\*)'' /etc/rsyslog.*

    /etc/rsyslog.d/50-default.conf:auth.*,authpriv.* /var/log/secure

    /etc/rsyslog.d/50-default.conf:daemon.* /var/log/messages

    If "auth.", "authpriv.", or "daemon.*" are not configured to be logged in at least one of the

    config files, this is a finding.'
  remediation: 'Configure the operating system to monitor all remote access methods.

    Add or modify the following line in the "/etc/rsyslog.d/50-default.conf" file:

    auth.*,authpriv.* /var/log/secure

    daemon.* /var/log/messages

    Restart "rsyslog.service" for the changes to take effect by using the following command:

    $ sudo systemctl restart rsyslog.service'
  checks:
  - type: manual_review
    info: 'Verify that the operating system monitors all remote access methods by using the

      following command:

      $ grep -Er ''^(auth\.\*,authpriv\.\*|daemon\.\*)'' /etc/rsyslog.*

      /etc/rsyslog.d/50-default.conf:auth.*,authpriv.* /var/log/secure

      /etc/rsyslog.d/50-default.conf:daemon.* /var/log/messages

      If "auth.", "authpriv.", or "daemon.*" are not configured to be logged in at least one of the

      config files, this is a finding.'
    severity: medium
- id: '1.119'
  title: UBTU-22-653010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must have the "auditd" package installed. GROUP ID: V-260590 RULE ID: SV-260590r1015022'
  rationale: 'Without establishing the when, where, type, source, and outcome of events that occurred, it would be difficult
    to establish, correlate, and investigate the events leading up to an outage or attack. Without the capability to generate
    audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify
    those responsible for one. Audit record content that may be necessary to satisfy this requirement includes, for example,
    time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications,
    filenames involved, and access control or flow control rules invoked. Reconstruction of harmful events or forensic analysis
    is not possible if audit records do not contain enough information. Successful incident response and auditing relies on
    timely, accurate system information and analysis in order to allow the organization to identify and respond to potential
    incidents in a proficient manner. If the operating system does not provide the ability to centrally review the operating
    system logs, forensic analysis is negatively impacted. Associating event types with detected events in the operating system
    audit logs provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying
    an improperly configured operating system. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016, SRG-OS000039-GPOS-00017,
