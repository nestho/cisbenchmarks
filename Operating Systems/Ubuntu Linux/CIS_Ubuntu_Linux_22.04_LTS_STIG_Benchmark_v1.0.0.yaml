- id: '1.1'
  title: UBTU-22-211015
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system must disable the x86 Ctrl-Alt-Delete key sequence. GROUP ID: V-260469 RULE ID: SV-260469r991589'
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot.
  impact: ''
  references: []
  page_start: 16
  audit_raw: "Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete\nis pressed by using\
    \ the following command:\n$ systemctl status ctrl-alt-del.target\n ctrl-alt-del.target\n Loaded: masked (Reason: Unit\
    \ ctrl-alt-del.target is masked.)\n Active: inactive (dead)\nIf the \"ctrl-alt-del.target\" is not masked, this is a finding."
  remediation: 'Configure the operating system to disable the Ctrl-Alt-Delete sequence for the

    command line by using the following commands:

    $ sudo systemctl disable ctrl-alt-del.target

    $ sudo systemctl mask ctrl-alt-del.target

    Reload the daemon to take effect:

    $ sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: "Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete\nis pressed by using the\
      \ following command:\n$ systemctl status ctrl-alt-del.target\n ctrl-alt-del.target\n Loaded: masked (Reason: Unit ctrl-alt-del.target\
      \ is masked.)\n Active: inactive (dead)\nIf the \"ctrl-alt-del.target\" is not masked, this is a finding."
    severity: medium
- id: '1.2'
  title: UBTU-22-212010
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The operating system, when booted, must require authentication upon booting into single-user and maintenance
    modes. GROUP ID: V-260470 RULE ID: SV-260470r958472'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DOD-approved PKIs, all DOD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement. Access control policies include identity-based
    policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include access control lists,
    access control matrices, and cryptography. These policies and mechanisms must be employed by the application to control
    access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs,
    and domains) in the information system.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure bootloader password is set"
  page_start: 18
  audit_raw: 'Verify the operating system requires a password for authentication upon booting into

    single-user and maintenance modes by using the following command:

    $ sudo grep -i password /boot/grub/grub.cfg

    password_pbkdf2 root

    grub.pbkdf2.sha512.10000.03255F190F0E2F7B4F0D1C3216012309162F022A7A636771

    If the root password entry does not begin with "password_pbkdf2", this is a finding.'
  remediation: 'Configure the operating system to require a password for authentication upon booting

    into single-user and maintenance modes.

    Generate an encrypted (grub) password for root by using the following command:

    $ grub-mkpasswd-pbkdf2

    Enter Password:

    Reenter Password:

    PBKDF2 hash of your password is

    grub.pbkdf2.sha512.10000.03255F190F0E2F7B4F0D1C3216012309162F022A7A636771

    Using the hash from the output, modify the "/etc/grub.d/40_custom" file by using the

    following command to add a boot password:

    $ sudo sed -i ''$i set superusers=\"root\"\npassword_pbkdf2 root <hash>''

    /etc/grub.d/40_custom

    where is the hash generated by grub-mkpasswd-pbkdf2 command.

    Generate an updated "grub.conf" file with the new password by using the following

    command:

    $ sudo update-grub'
  checks:
  - type: manual_review
    info: 'Verify the operating system requires a password for authentication upon booting into

      single-user and maintenance modes by using the following command:

      $ sudo grep -i password /boot/grub/grub.cfg

      password_pbkdf2 root

      grub.pbkdf2.sha512.10000.03255F190F0E2F7B4F0D1C3216012309162F022A7A636771

      If the root password entry does not begin with "password_pbkdf2", this is a finding.'
    severity: medium
- id: '1.3'
  title: UBTU-22-212015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must initiate session audits at system startup. GROUP ID: V-260471 RULE ID: SV-260471r1069117'
  rationale: If auditing is enabled late in the startup process, the actions of some startup processes may not be audited.
    Some audit systems also maintain state information only available if auditing is enabled before a given process is created.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure auditing for processes that start prior to auditd is
  page_start: 21
  audit_raw: 'Verify that the operating system enables auditing at system startup in grub by using the

    following command:

    $ grep "^\s*linux" /boot/grub/grub.cfg

    linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

    audit=1

    linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

    audit=1

    linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

    single nomodeset dis_ucode_ldr audit=1

    linux /vmlinuz-5.15.0-83-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

    audit=1

    linux /vmlinuz-5.15.0-83-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

    single nomodeset dis_ucode_ldr audit=1

    If any linux lines do not contain "audit=1", this is a finding.

    Note: Output may vary by system.'
  remediation: 'Configure the operating system to produce audit records at system startup.

    Edit the "/etc/default/grub" file and add "audit=1" to the "GRUB_CMDLINE_LINUX"

    option and to the "GRUB_CMDLINE_LINUX_DEFAULT" option.

    GRUB_CMDLINE_LINUX_DEFAULT="audit=1"

    GRUB_CMDLINE_LINUX="audit=1"

    To update the grub config file, run:

    $ sudo update-grub'
  checks:
  - type: manual_review
    info: 'Verify that the operating system enables auditing at system startup in grub by using the

      following command:

      $ grep "^\s*linux" /boot/grub/grub.cfg

      linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

      audit=1

      linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

      audit=1

      linux /vmlinuz-5.15.0-89-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv ro

      single nomodeset dis_ucode_ldr audit=1

      linux /vmlinuz-5.15.0-83-generic root=/dev/mapper/ubuntu--vg-ubuntu--lv r'
    severity: medium
- id: '1.4'
  title: UBTU-22-213010
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must restrict access to the kernel message buffer. GROUP ID: V-260472 RULE ID: SV-260472r958524'
  rationale: Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining
    additional system information as a nonprivileged user.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify the operating system is configured to restrict access to the kernel message buffer

    by using the following command:

    $ sysctl kernel.dmesg_restrict

    kernel.dmesg_restrict = 1

    If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.

    Verify that there are no configurations that enable the kernel dmesg function:

    $ sudo grep -ir kernel.dmesg_restrict /run/sysctl.d/* /etc/sysctl.d/*

    /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

    /etc/sysctl.conf 2> /dev/null

    /etc/sysctl.d/10-kernel-hardening.conf:kernel.dmesg_restrict = 1

    If "kernel.dmesg_restrict" is not set to "1", is commented out, is missing, or conflicting

    results are returned, this is a finding.'
  remediation: 'Configure the operating system to restrict access to the kernel message buffer.

    Add or modify the following line in the "/etc/sysctl.conf" file:

    kernel.dmesg_restrict = 1

    Remove any configurations that conflict with the above from the following locations:

    /run/sysctl.d/

    /etc/sysctl.d/

    /usr/local/lib/sysctl.d/

    /usr/lib/sysctl.d/

    /lib/sysctl.d/

    /etc/sysctl.conf

    Reload settings from all system configuration files by using the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify the operating system is configured to restrict access to the kernel message buffer

      by using the following command:

      $ sysctl kernel.dmesg_restrict

      kernel.dmesg_restrict = 1

      If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.

      Verify that there are no configurations that enable the kernel dmesg function:

      $ sudo grep -ir kernel.dmesg_restrict /run/sysctl.d/* /etc/sysctl.d/*

      /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

      /etc/sysctl.conf 2> /dev/null

      /'
    severity: medium
- id: '1.5'
  title: UBTU-22-213015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable kernel core dumps so that it can fail to a secure state if system initialization
    fails, shutdown fails or aborts fail. GROUP ID: V-260473 RULE ID: SV-260473r1044782'
  rationale: Kernel core dumps may contain the full contents of system memory at the time of the crash. Kernel core dumps
    may consume a considerable amount of disk space and may result in denial of service by exhausting the available space
    on the target file system partition.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Verify that kernel core dumps are disabled unless needed by using the following\ncommand:\n$ systemctl status\
    \ kdump-tools.service\n kdump-tools.service\n Loaded: masked (Reason: Unit kdump-tools.service is masked.)\n Active: inactive\
    \ (dead)\nIf \"kdump-tools.service\" is not masked and inactive, ask the system administrator (SA) if\nthe use of the\
    \ service is required and documented with the information system security\nofficer (ISSO).\nIf the service is active and\
    \ is not documented, this is a finding."
  remediation: 'If kernel core dumps are not required, disable and mask "kdump-tools.service" by using

    the following command:

    $ sudo systemctl mask kdump-tools --now

    If kernel core dumps are required, document the need with the ISSO.'
  checks:
  - type: manual_review
    info: "Verify that kernel core dumps are disabled unless needed by using the following\ncommand:\n$ systemctl status kdump-tools.service\n\
      \ kdump-tools.service\n Loaded: masked (Reason: Unit kdump-tools.service is masked.)\n Active: inactive (dead)\nIf \"\
      kdump-tools.service\" is not masked and inactive, ask the system administrator (SA) if\nthe use of the service is required\
      \ and documented with the information system security\nofficer (ISSO).\nIf the service is active and is not documented,\
      \ this is a finding."
    severity: medium
- id: '1.6'
  title: UBTU-22-213020
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must implement address space layout randomization to protect its memory from unauthorized
    code execution. GROUP ID: V-260474 RULE ID: SV-260474r958928'
  rationale: Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in prohibited
    memory locations. Security safeguards employed to protect memory include, for example, data execution prevention and address
    space layout randomization. Data execution prevention safeguards can either be hardwareenforced or software-enforced with
    hardware providing the greater strength of mechanism. Examples of attacks are buffer overflow attacks.
  impact: ''
  references:
  - 1. CIS Recommendation "Ensure address space layout randomization is enabled"
  page_start: 27
  audit_raw: 'Verify the operating system implements address space layout randomization (ASLR) by

    using the following command:

    $ sysctl kernel.randomize_va_space

    kernel.randomize_va_space = 2

    If no output is returned, verify the kernel parameter "randomize_va_space" is set to "2"

    by using the following command:

    $ cat /proc/sys/kernel/randomize_va_space

    2

    If "kernel.randomize_va_space" is not set to "2", this is a finding.

    Verify that a saved value of the "kernel.randomize_va_space" variable is not defined:

    $ sudo grep -ER "^kernel.randomize_va_space=[^2]" /etc/sysctl.conf

    /etc/sysctl.d

    If this returns a result, this is a finding.'
  remediation: 'Remove the "kernel.randomize_va_space" entry found in the "/etc/sysctl.conf" file or

    any file located in the "/etc/sysctl.d/" directory.

    Reload the system configuration files for the changes to take effect by using the

    following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify the operating system implements address space layout randomization (ASLR) by

      using the following command:

      $ sysctl kernel.randomize_va_space

      kernel.randomize_va_space = 2

      If no output is returned, verify the kernel parameter "randomize_va_space" is set to "2"

      by using the following command:

      $ cat /proc/sys/kernel/randomize_va_space

      2

      If "kernel.randomize_va_space" is not set to "2", this is a finding.

      Verify that a saved value of the "kernel.randomize_va_space" variable is not defined:

      $ '
    severity: medium
- id: '1.7'
  title: UBTU-22-213025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must implement nonexecutable data to protect its memory from unauthorized code execution.
    GROUP ID: V-260475 RULE ID: SV-260475r958928'
  rationale: Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in memory
    locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention
    and address space layout randomization. Data execution prevention safeguards can either be hardware-enforced or software-enforced
    with hardware providing the greater strength of mechanism. Examples of attacks are buffer overflow attacks.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Verify the NX (no-execution) bit flag is set on the system by using the following

    command:

    $ sudo dmesg | grep -i "execute disable"

    [ 0.000000] NX (Execute Disable) protection: active

    If "dmesg" does not show "NX (Execute Disable) protection: active", check the hardware

    capabilities of the installed CPU by using the following command:

    $ grep flags /proc/cpuinfo | grep -o nx | sort -u

    nx

    If no output is returned, this is a finding.'
  remediation: 'Configure the operating system to enable NX.

    If the installed CPU is hardware capable of NX protection, check if the system''s

    BIOS/UEFI setup configuration permits toggling the "NX bit" or "no execution bit", and

    set it to "enabled".'
  checks:
  - type: command
    command: $ sudo dmesg | grep -i "execute disable" && $ grep flags /proc/cpuinfo | grep -o nx | sort -u
    expected: ''
    severity: medium
    info: 'Verify the NX (no-execution) bit flag is set on the system by using the following

