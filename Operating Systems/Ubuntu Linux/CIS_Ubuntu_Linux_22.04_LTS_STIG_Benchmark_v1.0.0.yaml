- id: '1.120'
  title: UBTU-22-653015
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must produce audit records and reports containing information to establish when, where,
    what type, the source, and the outcome for all DOD-defined auditable events and actions in near real time. GROUP ID: V-260591
    RULE ID: SV-260591r1015023'
  rationale: 'Without establishing the when, where, type, source, and outcome of events that occurred, it would be difficult
    to establish, correlate, and investigate the events leading up to an outage or attack. Without the capability to generate
    audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify
    those responsible for one. Audit record content that may be necessary to satisfy this requirement includes, for example,
    time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications,
    filenames involved, and access control or flow control rules invoked. Reconstruction of harmful events or forensic analysis
    is not possible if audit records do not contain enough information. Successful incident response and auditing relies on
    timely, accurate system information and analysis to allow the organization to identify and respond to potential incidents
    in a proficient manner. If the operating system does not provide the ability to centrally review the operating system
    logs, forensic analysis is negatively impacted. Associating event types with detected events in the operating system audit
    logs provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying
    an improperly configured operating system. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016, SRG-OS000039-GPOS-00017,
    SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00020, SRG-OS-000042-GPOS-00021, SRG-OS-000051GPOS-00024,
    SRG-OS-000054-GPOS-00025, SRG-OS-000062-GPOS-00031, SRGOS-000122-GPOS-00063, SRG-OS-000337-GPOS-00129, SRG-OS-000348-GPOS00136,
