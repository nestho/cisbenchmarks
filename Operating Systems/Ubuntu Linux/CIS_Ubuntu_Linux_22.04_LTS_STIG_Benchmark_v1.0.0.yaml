    in exact order,

    is commented out, is missing, or conflicting results are returned, this is a finding.'
  remediation: 'Configure the SSH server to only implement FIPS-approved ciphers.

    Add or modify the following line in the "/etc/ssh/sshd_config" file:

    Ciphers aes256-ctr,aes256-gcm@openssh.com,aes192-ctr,aes128-ctr,aes128gcm@openssh.com

    Restart the SSH server for the changes to take effect:

    $ sudo systemctl restart sshd.service'
