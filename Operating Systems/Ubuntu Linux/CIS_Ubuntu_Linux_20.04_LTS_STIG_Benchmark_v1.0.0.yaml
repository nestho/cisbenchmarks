      403 | P a g e'
    severity: medium
- id: 4.1.2.5
  title: Ensure sufficient storage capacity to store at least one week worth of audit records
  scoring: manual
  profile: []
  description: The operating system must allocate audit record storage capacity to store at least one weeks' worth of audit
    records, when audit records are not immediately sent to a central audit record storage facility. The operating system
    audit event multiplexor must be configured to off-load audit logs onto a different system or storage media from the system
    being audited.
  rationale: 'In order to ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating
    systems need to be able to allocate audit record storage capacity. 405 | P a g e Information stored in one location is
    vulnerable to accidental or incidental deletion or alteration. Off-loading is a common process in information systems
    with limited audit storage capacity. Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224 408 | P a g e'
  impact: ''
  references: []
  page_start: 405
  audit_raw: 'Verify the Ubuntu operating system allocates audit record storage capacity to store at least

    one week''s worth of audit records when audit records are not immediately sent to a central

    audit record storage facility.

    Determine which partition the audit records are being written to with the following

    command:

    # grep ^log_file /etc/audit/auditd.conf

    log_file = /var/log/audit/audit.log

    Check the size of the partition that audit records are written to (with the example being

    "/var/log/audit/") with the following command:

    # df –h /var/log/audit/

    /dev/sda2 24G 10.4G 13.6G 43% /var/log/audit

    If the audit records are not written to a partition made specifically for audit records

    ("/var/log/audit" is a separate partition), determine the amount of space being used by

    other files in the partition with the following command:

    # du –sh [audit_partition]

    1.8G /var/log/audit

    Note: The partition size needed to capture a week''s worth of audit records is based on the

    activity level of the system and the total storage capacity available. In normal

    circumstances, 10.0 GB of storage space for audit records will be sufficient.

    If the audit record partition is not allocated for sufficient storage capacity, this is a finding.

    406 | P a g e

    Verify the audit event multiplexor is configured to offload audit records to a different

    system or storage media from the system being audited.

    Check that audisp-remote plugin is installed:

    # dpkg -s audispd-plugins

