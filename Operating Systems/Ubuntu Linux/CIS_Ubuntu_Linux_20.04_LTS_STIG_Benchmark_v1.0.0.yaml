    -e 2

    at the end of the file

    535 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output matches:

      # grep "^\s*[^#]" /etc/audit/rules.d/*.rules | tail -1

      -e 2'
    severity: medium
