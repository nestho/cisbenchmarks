  scoring: scored
  profile: []
  description: The operating system must generate audit records for successful/unsuccessful uses of the chcon command.
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the information system (e.g., module or policy
    filter).
  impact: ''
  references: []
  page_start: 500
  audit_raw: 'Verify the Ubuntu operating system generates an audit record upon

    successful/unsuccessful attempts to use the "chcon" command.

    Check the currently configured audit rules with the following command:

    # auditctl -l | grep chcon

    -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F

    auid!=4294967295 -k perm_chng

    If the command does not return a line that matches the example or the line is commented

    out, this is a finding.

    Note: The "-k" allows for specifying an arbitrary identifier, and the string after it does not

    need to match the example output above.

    500 | P a g e'
  remediation: 'Configure the audit system to generate an audit event for any successful/unsuccessful use

    of the "chcon" command.

    Add or update the following rules in the "/etc/audit/rules.d/stig.rules" file:

    -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F

    auid!=4294967295 -k perm_chng

    To reload the rules file, issue the following command:

    # augenrules --load'
  checks:
  - type: command
    command: '# auditctl -l | grep chcon'
    expected: ''
    severity: medium
    info: 'Verify the Ubuntu operating system generates an audit record upon

      successful/unsuccessful attempts to use the "chcon" command.

      Check the currently configured audit rules with the following command:

      # auditctl -l | grep chcon

      -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F

      auid!=4294967295 -k perm_chng

      If the command does not return a line that matches the example or the line is co'
