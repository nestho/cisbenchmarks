- id: 2.1.1.1
  title: Ensure time synchronization is in use
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'System time should be synchronized between all systems in an environment. This is typically done by establishing
    an authoritative time server or set of servers and having all systems synchronize their clocks to them. Notes:  If access
    to a physical host''s clock is available and configured according to site policy, this section can be skipped  Only one
    time synchronization method should be in use on the system  If access to a physical host''s clock is available and configured
    according to site policy, systemd-timesyncd should be stopped and masked'
  rationale: Time synchronization is important to support time sensitive security mechanisms like Kerberos and also ensures
    log files have consistent time records across the enterprise, which aids in forensic investigations.
  impact: ''
  references: []
  page_start: 193
  audit_raw: 'On physical systems or virtual systems where host based time synchronization is not

    available verify that timesyncd, chrony, or NTP is installed. Use one of the following

    commands to determine the needed information:

    If systemd-timesyncd is used:

    # systemctl is-enabled systemd-timesyncd

    If chrony is used:

    # dpkg -s chrony

    If ntp is used:

    # dpkg -s ntp

    On virtual systems where host based time synchronization is available consult your

    virtualization software documentation and verify that host based synchronization is in use

    193 | P a g e'
  remediation: 'On systems where host based time synchronization is not available, configure systemdtimesyncd. If "full featured"
    and/or encrypted time synchronization is required, install

    chrony or NTP.

    To install chrony:

    # apt install chrony

    To install ntp:

    # apt install ntp

    On virtual systems where host based time synchronization is available consult your

    virtualization software documentation and setup host based synchronization'
  checks:
  - type: manual_review
    info: 'On physical systems or virtual systems where host based time synchronization is not

      available verify that timesyncd, chrony, or NTP is installed. Use one of the following

      commands to determine the needed information:

      If systemd-timesyncd is used:

      # systemctl is-enabled systemd-timesyncd

      If chrony is used:

      # dpkg -s chrony

      If ntp is used:

      # dpkg -s ntp

      On virtual systems where host based time synchronization is available consult your

      virtualization software documentation and verify that host base'
    severity: medium
- id: 2.1.1.2
  title: Ensure systemd-timesyncd is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'systemd-timesyncd is a daemon that has been added for synchronizing the system clock across the network. It
    implements an SNTP client. In contrast to NTP implementations such as chrony or the NTP reference server this only implements
    a client side, and does not bother with the full NTP complexity, focusing only on querying time from one remote server
    and synchronizing the local clock to it. The daemon runs with minimal privileges, and has been hooked up with networkd
    to only operate when network connectivity is available. The daemon saves the current clock to disk every time a new NTP
    sync has been acquired, and uses this to possibly correct the system clock early at bootup, in order to accommodate for
    systems that lack an RTC such as the Raspberry Pi and embedded devices, and make sure that time monotonically progresses
