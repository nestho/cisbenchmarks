- id: 5.3.15
  title: Ensure only FIPS 140-2 approved Ciphers are used
  scoring: scored
  profile: []
  description: The operating system must configure the SSH daemon to use FIPS 140-2 approved ciphers to prevent the unauthorized
    disclosure of information and/or detect changes to information during transmission.
  rationale: 'Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
    Remote access (e.g., RDP) is access to DoD nonpublic information systems by an authorized user (or an information system)
    communicating through an external, non-organizationcontrolled network. Remote access methods include, for example, dial-up,
