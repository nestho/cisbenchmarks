- id: 5.2.1
  title: Ensure sudo is installed
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'sudo allows a permitted user to execute a command as the superuser or another user, as specified by the security
    policy. The invoking user''s real (not effective) user ID is used to determine the user name with which to query the security
    policy. Note: Use the sudo-ldap package if you need LDAP support for sudoers'
  rationale: sudo supports a plugin architecture for security policies and input/output logging. Third parties can develop
    and distribute their own policy and I/O logging plugins to work seamlessly with the sudo front end. The default security
    policy is sudoers, which is configured via the file /etc/sudoers. The security policy determines what privileges, if any,
    a user has to run sudo. The policy may require that users authenticate themselves with a password or another authentication
    mechanism. If authentication is required, sudo will exit if the user's password is not entered within a configurable time
    limit. This limit is policy-specific.
  impact: ''
  references:
  - 1. SUDO(8)
  - 2. http://www.sudo.ws/
  page_start: 625
  audit_raw: 'Verify that sudo in installed.

    Run the following command and inspect the output to confirm that sudo is installed:

    # dpkg -s sudo

    OR

    # dpkg -s sudo-ldap

    625 | P a g e'
  remediation: 'Install sudo using the following command.

    # apt install sudo

    OR

    # apt install sudo-ldap'
