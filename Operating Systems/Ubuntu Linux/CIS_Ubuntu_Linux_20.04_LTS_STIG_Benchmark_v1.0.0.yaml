- id: 1.5.8
  title: Ensure the Ctrl-Alt-Delete key sequence is disabled
  scoring: scored
  profile: []
  description: The operating system must disable the x86 Ctrl-Alt-Delete key sequence.
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot.
  impact: 'system, while this can prevent unauthorized access the configuration of MAC can be complex and difficult to implement
    correctly preventing legitimate access from occurring. Notes:  Apparmor is the default MAC provided with Debian systems.
     Additional Mandatory Access Control systems to include SELinux exist. If a different Mandatory Access Control systems
    is used, please follow it''s vendors guidance for proper implementation in place of the guidance provided in this section
    146 | P a g e 1.6.1 Configure AppArmor AppArmor provides a Mandatory Access Control (MAC) system that greatly augments
    the default Discretionary Access Control (DAC) model. Under AppArmor MAC rules are applied by file paths instead of by
    security contexts as in other MAC systems. As such it does not require support in the filesystem and can be applied to
    network mounted filesystems for example. AppArmor security policies define what system resources applications can access
    and what privileges they can do so with. This automatically limits the damage that the software can do to files accessible
    by the calling user. The user does not need to take any action to gain this benefit. For an action to occur, both the
    traditional DAC permissions must be satisfied as well as the AppArmor MAC rules. The action will not be allowed if either
    one of these models does not permit the action. In this way, AppArmor rules can only make a system''s permissions more
    restrictive and secure.'
  references:
  - '1. AppArmor Documentation: http://wiki.apparmor.net/index.php/Documentation'
  - '2. Ubuntu AppArmor Documentation:'
  - https://help.ubuntu.com/community/AppArmor
  - https://www.suse.com/documentation/apparmor/
  page_start: 144
  audit_raw: 'Verify the Ubuntu operating system is not configured to reboot the system when Ctrl-AltDelete is pressed.

    Check that the "ctrl-alt-del.target" (otherwise also known as reboot.target) is not active

