- id: 2.1.1.6
  title: Ensure system clocks are synchronized with a time server designated for the appropriate DoD network
  scoring: scored
  profile: []
  description: The operating system must, for networked systems, compare internal information system clocks at least every
    24 hours with a server which is synchronized to one of the redundant United States Naval Observatory (USNO) time servers,
    or a time server designated for the appropriate DoD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).
    The operating system must synchronize internal information system clocks to the authoritative time source when the time
    difference is greater than one second.
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing internal information
    system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected
    over a network. Organizations should consider endpoints that may not have regular access to the authoritative time server
    (e.g., mobile, teleworking, and tactical endpoints). 207 | P a g e Inaccurate time stamps make it more difficult to correlate
    events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is
    critical when conducting forensic analysis and investigating system events. Synchronizing internal information system
    clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected over
    a network. Organizations should consider setting time periods for different types of systems (e.g., financial, legal,
    or mission-critical systems). Organizations should also consider endpoints that may not have regular access to the authoritative
    time server (e.g., mobile, teleworking, and tactical endpoints). This requirement is related to the comparison done every
    24 hours in SRG-OS-000355 because a comparison must be done in order to determine the time difference.
  impact: ''
  references: []
