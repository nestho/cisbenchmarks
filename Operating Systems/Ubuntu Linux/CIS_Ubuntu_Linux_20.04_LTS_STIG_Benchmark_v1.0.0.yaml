    to automatic termination dates. Emergency accounts are accounts created in response to crisis situations, usually for
    use by maintenance personnel. The automatic expiration or disabling time period may be extended as needed until the crisis
    is resolved; however, it must not be extended indefinitely. A permanent account should be established for privileged users
    who need long-term maintenance accounts.
