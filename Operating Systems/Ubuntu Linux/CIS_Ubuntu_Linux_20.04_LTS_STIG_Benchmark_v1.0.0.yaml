- id: '5.7'
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo, which allows for more granular control over privileged access. Normally, the su command can be executed by any user.
    By adding, or uncommenting, the pam_wheel.so statement in /etc/pam.d/su , the su command will only allow users in a specific
    group to execute su. This group should be empty to reinforce the use of sudo for privileged access. The operating system
    must only allow the use of DoD PKI-established certificate authorities for verification of the establishment of protected
    sessions.
  rationale: Restricting the use of su, and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo, whereas su can only record that a user executed the su program.
    Untrusted Certificate Authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DoD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DoDapproved CA, trust of this CA has not been established. The DoD will only accept PKI-certificates
    obtained from a DoD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure
    sessions includes, for example, the use of SSL/TLS certificates.
  impact: ''
  references: []
  page_start: 806
  audit_raw: 'Run the following command and verify the output matches the line:

    # grep pam_wheel.so /etc/pam.d/su

    auth required pam_wheel.so use_uid group=<group_name>

    Run the following command and verify that the group specified in <group_name> contains

    no users:

    # grep <group_name> /etc/group

    <group_name>:x:<GID>:

    There should be no users listed after the Group ID field.

    806 | P a g e

    Verify the directory containing the root certificates for the Ubuntu operating system

    (/etc/ssl/certs) only contains certificate files for DoD PKI-established certificate

    authorities.

    Determine if "/etc/ssl/certs" only contains certificate files whose sha256 fingerprint match

    the fingerprint of DoD PKI-established certificate authorities with the following command:

    # for f in $(ls /etc/ssl/certs); do openssl x509 -sha256 -in $f -noout -

    fingerprint | cut -d= -f2 | tr -d '':'' | egrep -vw

    ''(9676F287356C89A12683D65234098CB77C4F1C18F23C0E541DE0E196725B7EBE|B107B33F45

    3E5510F68E513110C6F6944BACC263DF0137F821C1B3C2F8F863D2|559A5189452B13F8233F00

    22363C06F26E3C517C1D4B77445035959DF3244F74|1F4EDE9DC2A241F6521BF518424ACD49EB

    E84420E69DAF5BAC57AF1F8EE294A9)''; done

    If any entry is found, this is a finding.

    808 | P a g e'
  remediation: 'Create an empty group that will be specified for use of the su command. The group should

    be named according to site policy.

    Example:

    # groupadd sugroup

    Add the following line to the /etc/pam.d/su file, specifying the empty group:

    Example:

    auth required pam_wheel.so use_uid group=sugroup

    Configure the Ubuntu operating system to only allow the use of DoD PKI-established

    certificate authorities for verification of the establishment of protected sessions.

    Edit the "/etc/ca-certificates.conf" file, adding the character "!" to the beginning of all

    uncommented lines that do not start with the "!" character with the following command:

    # sed -iE ''s/^([^!#]+)/!\1/'' /etc/ca-certificates.conf

    Add at least one DoD certificate authority to the "/usr/local/share/ca-certificates"

    directory in the PEM format.

    Update the "/etc/ssl/certs" directory with the following command:

    # update-ca-certificates'
  checks:
