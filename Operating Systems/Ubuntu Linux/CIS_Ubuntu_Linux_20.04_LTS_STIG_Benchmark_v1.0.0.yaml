  title: Ensure data-at-rest encryption is enabled
  scoring: manual
  profile: []
  description: The operating systems handling data requiring "data at rest" protections must employ cryptographic mechanisms
    to prevent unauthorized disclosure and modification of the information at rest.
  rationale: Information at rest refers to the state of information when it is located on a secondary storage device (e.g.,
    disk drive and tape drive, when used for backups) within an operating system. This requirement addresses protection of
    user-generated data, as well as operating systemspecific configuration data. Organizations may choose to employ different
    mechanisms to achieve confidentiality and integrity protections, as appropriate, in accordance with the security category
    and/or classification of the information. 87 | P a g e
  impact: ''
  references: []
