- id: 5.3.26
  title: Ensure network connections associated with SSH traffic are terminated after a period of inactivity
  scoring: scored
  profile: []
  description: The operating system must immediately terminate all network connections associated with SSH traffic after a
    period of inactivity. The Ubuntu operating system must immediately terminate all network connections associated with SSH
    traffic at the end of the session or after 10 minutes of inactivity. The operating system must display the Standard Mandatory
    DoD Notice and Consent Banner before granting any local or remote connection to the system.
  rationale: 'Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the
    termination of network connections that are associated with communications sessions (i.e., network disconnect). A logical
    session (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses
    an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating
    network sessions. Session termination terminates all processes associated with a user''s logical session except those
    processes that are specifically created by the user (i.e., session owner) to continue after the session is terminated.
    Conditions or trigger events requiring automatic session termination can include, for example, organization-defined periods
    of user inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information system
    use. This capability is typically reserved for specific Ubuntu operating system functionality where the system owner,
    data owner, or organization requires additional assurance. 698 | P a g e Terminating an idle session within a short time
    period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on
    the console or console port that has been left unattended. In addition, quickly terminating an idle session will also
    free up resources committed by the managed network element. Terminating network connections associated with communications
    sessions includes, for example, de-allocating associated TCP/IP address/port pairs at the operating system level, and
    de-allocating networking assignments at the application level if multiple application sessions are using a single operating
    system-level network connection. This does not mean that the operating system terminates all sessions or network access;
    it only ends the inactive session and releases the resources associated with that session. Display of a standardized and
    approved use notification before granting access to the publicly accessible operating system ensures privacy and security
    notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations,
    standards, and guidance. System use notifications are required only for access via logon interfaces with human users and
    are not required when such human interfaces do not exist. The banner must be formatted in accordance with applicable DoD
    policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters: 703 | P a g
    e "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By
    using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely
    intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC
    monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI)
    investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored
    on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used
    for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls) to protect
    USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute
    consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product,
    related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications
    and work product are private and confidential. See User Agreement for details." Use the following verbiage for operating
    systems that have severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent
    to terms in IS user agreem''t." Satisfies: SRG-OS-000228-GPOS-00088, SRG-OS-000023-GPOS-00006 704 | P a g e'
  impact: ''
  references: []
  page_start: 698
  audit_raw: 'Verify that all network connections associated with SSH traffic automatically terminate

    after a period of inactivity.

    Verify the "ClientAliveCountMax" variable is set in the "/etc/ssh/sshd_config" file by

    performing the following command:

    # grep -i clientalivecountmax /etc/ssh/sshd_config

    ClientAliveCountMax 1

    If "ClientAliveCountMax" is not set, is not set to "1", or is commented out, this is a finding.

    Verify that all network connections associated with SSH traffic are automatically

    terminated at the end of the session or after 10 minutes of inactivity.

    Verify the "ClientAliveInterval" variable is set to a value of "600" or less by performing the

    following command:

    # grep -i clientalive /etc/ssh/sshd_config

    ClientAliveInterval 600

    If "ClientAliveInterval" does not exist, is not set to a value of "600" or less in

    "/etc/ssh/sshd_config", or is commented out, this is a finding.

    701 | P a g e

    Verify the Ubuntu operating system displays the Standard Mandatory DoD Notice and

    Consent Banner before granting access to the Ubuntu operating system via an SSH logon

    with the following command:

    # grep -i banner /etc/ssh/sshd_config

    Banner /etc/issue.net

    The command will return the banner option along with the name of the file that contains

    the SSH banner. If the line is commented out, this is a finding.

    Verify the specified banner file matches the Standard Mandatory DoD Notice and Consent

    Banner exactly:

    # cat /etc/issue.net

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the banner text does not match the Standard Mandatory DoD Notice and Consent Banner

    exactly, this is a finding.

    705 | P a g e'
  remediation: 'Configure the Ubuntu operating system to automatically terminate inactive SSH sessions

    after a period of inactivity.

    Modify or append the following line in the "/etc/ssh/sshd_config" file, replacing "[Count]"

    with a value of 1:

    ClientAliveCountMax 1

    Restart the SSH daemon for the changes to take effect:

    # systemctl restart sshd.service

    Configure the Ubuntu operating system to automatically terminate all network connections

    associated with SSH traffic at the end of a session or after a 10-minute period of inactivity.

    Modify or append the following line in the "/etc/ssh/sshd_config" file replacing "[Interval]"

    with a value of "600" or less:

    ClientAliveInterval 600

    Restart the SSH daemon for the changes to take effect:

    # systemctl restart sshd.service

    Set the parameter Banner in "/etc/ssh/sshd_config" to point to the "/etc/issue.net" file:

    # sed -i ''/^Banner/d'' /etc/ssh/sshd_config

    # sed -i ''$aBanner /etc/issue.net'' /etc/ssh/sshd_config

    Either create the file containing the banner or replace the text in the file with the Standard

    Mandatory DoD Notice and Consent Banner. The DoD required text is:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    Restart the SSH daemon for the changes to take effect and then signal the SSH server to

    reload the configuration file:

    # systemctl -s SIGHUP kill sshd'
  checks:
  - type: manual_review
    info: 'Verify that all network connections associated with SSH traffic automatically terminate

      after a period of inactivity.

      Verify the "ClientAliveCountMax" variable is set in the "/etc/ssh/sshd_config" file by

      performing the following command:

      # grep -i clientalivecountmax /etc/ssh/sshd_config

      ClientAliveCountMax 1

      If "ClientAliveCountMax" is not set, is not set to "1", or is commented out, this is a finding.

      Verify that all network connections associated with SSH traffic are automatically

      terminated'
    severity: medium
