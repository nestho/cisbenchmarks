- id: 6.2.17
  title: Ensure shadow group is empty
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The shadow group allows system programs which require access the ability to read the /etc/shadow file. No users
    should be assigned to the shadow group.
  rationale: Any users assigned to the shadow group would be granted read access to the /etc/shadow file. If attackers can
    gain read access to the /etc/shadow file, they can easily run a password cracking program against the hashed passwords
    to break them. Other security information that is stored in the /etc/shadow file (such as expiration) could also be useful
    to subvert additional user accounts.
  impact: ''
  references: []
  page_start: 895
  audit_raw: 'Run the following commands and verify no results are returned:

    # awk -F: ''($1=="shadow") {print $NF}'' /etc/group

    # awk -F: -v GID="$(awk -F: ''($1=="shadow") {print $3}'' /etc/group)"

    ''($4==GID) {print $1}'' /etc/passwd'
  remediation: 'Run the following command to remove all users from the shadow group

    # sed -ri ''s/(^shadow:[^:]*:[^:]*:)([^:]+$)/\1/'' /etc/group

    Change the primary group of any users with shadow as their primary group.

    # usermod -g <primary group> <user>

    895 | P a g e'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify no results are returned:

      # awk -F: ''($1=="shadow") {print $NF}'' /etc/group

      # awk -F: -v GID="$(awk -F: ''($1=="shadow") {print $3}'' /etc/group)"

      ''($4==GID) {print $1}'' /etc/passwd'
    severity: medium
