- id: 1.1.1.6
  title: Ensure mounting of squashfs filesystems is disabled
  scoring: manual
  profile:
  - Level 2
  - Level 2
  description: The squashfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems
    (similar to cramfs ). A squashfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: Disabling squashfs will prevent the use of snap. Snap is a package manager for Linux for installing Snap packages.
    "Snap" application packages of software are self-contained and work across a range of Linux distributions. This is unlike
    traditional Linux package management approaches, like APT or RPM, which require specifically adapted packages per Linux
    distribution on an application update and delay therefore application deployment from developers to their software's end-user.
    Snaps themselves have no dependency on any external store ("App store"), can be obtained from any source and can be therefore
    used for upstream software deployment. When snaps are deployed on versions of Linux, the Ubuntu app store is used as default
    back-end, but other stores can be enabled as well.
  references: []
  page_start: 39
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v squashfs | grep -E ''(squashfs|install)''

    install /bin/true

    # lsmod | grep squashfs

    <No output>

    39 | P a g e'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vi /etc/modprobe.d/squashfs.conf

    Add the following line:

    install squashfs /bin/true

    Run the following command to unload the squashfs module:

    # rmmod squashfs'
  checks:
  - type: command
    command: '# modprobe -n -v squashfs | grep -E ''(squashfs|install)'' && # lsmod | grep squashfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # modprobe -n -v squashfs | grep -E ''(squashfs|install)''

      install /bin/true

      # lsmod | grep squashfs

      <No output>

      39 | P a g e'
