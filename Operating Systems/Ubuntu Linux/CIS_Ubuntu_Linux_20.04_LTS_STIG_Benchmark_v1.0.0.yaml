- id: 5.3.19
  title: Ensure SSH Idle Timeout Interval is configured
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The two options ClientAliveInterval and ClientAliveCountMax control the timeout of ssh sessions.  ClientAliveInterval
    sets a timeout interval in seconds after which if no data has been received from the client, sshd will send a message
    through the encrypted channel to request a response from the client. The default is 0, indicating that these messages
    will not be sent to the client.  ClientAliveCountMax sets the number of client alive messages which may be sent without
    sshd receiving any messages back from the client. If this threshold is reached while client alive messages are being sent,
    sshd will disconnect the client, terminating the session. The default value is 3. o The client alive messages are sent
    through the encrypted channel o Setting ClientAliveCountMax to 0 disables connection termination Example: If the ClientAliveInterval
    is set to 15 seconds and the ClientAliveCountMax is set to 3, the client ssh session will be terminated after 45 seconds
    of idle time.'
  rationale: Having no timeout value associated with a connection could allow an ssh session to remain active after the connection
    with the client has been interrupted. Setting a timeout value reduces this risk.  The recommended ClientAliveInterval
    setting is 300 seconds (5 minutes)  The recommended ClientAliveCountMax setting is 3  The ssh session would send three
    keep alive messages at 5 minute intervals. If no response is received after the third keep alive message, the ssh session
    would be terminated after 15 minutes. 682 | P a g e
  impact: ''
  references:
  - 1. https://man.openbsd.org/sshd_config
  page_start: 682
  audit_raw: 'Run the following commands and verify ClientAliveInterval is between 1 and 300:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep clientaliveinterval

    clientaliveinterval 300

    Run the following command and verify ClientAliveCountMax is between 1 and 3:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep clientalivecountmax

    clientalivecountmax 3

    Run the following commands and verify the output:

    # grep -Eis ''^\s*clientaliveinterval\s+(0|3[0-9][1-9]|[4-9][0-9][0-9]|[19][0-9][0-9][0-9]+|[6-9]m|[1-9][0-9]+m)\b'' /etc/ssh/sshd_config

    /etc/ssh/sshd_config.d/*.conf

    Nothing should be returned

    # grep -Eis ''^\s*ClientAliveCountMax\s+(0|[4-9]|[1-9][0-9]+)\b''

    /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf

    Nothing should be returned'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameters according to site policy. This

    should include ClientAliveInterval between 1 and 300 and ClientAliveCountMax

    between 1 and 3:

    ClientAliveInterval 300

    ClientAliveCountMax 3'
  checks:
