- id: 1.8.7
  title: Ensure the graphical user Ctrl-Alt-Delete key sequence is disabled
  scoring: scored
  profile: []
  description: The operating system must disable the x86 Ctrl-Alt-Delete key sequence if a graphical user interface is installed.
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete, when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete
    sequence is reduced because the user will be prompted before any action is taken.
  impact: ''
  references: []
  page_start: 186
  audit_raw: 'Verify the Ubuntu operating system is not configured to reboot the system when Ctrl-AltDelete is pressed when
    using a graphical user interface.

    Check that the "logout" target is not bound to an action with the following command:

    # grep logout /etc/dconf/db/local.d/*

    logout=''''

    If the "logout" key is bound to an action, is commented out, or is missing, this is a finding.

    186 | P a g e'
  remediation: 'Configure the system to disable the Ctrl-Alt-Delete sequence when using a graphical user

    interface by creating or editing the /etc/dconf/db/local.d/00-disable-CAD file.

    Add the setting to disable the Ctrl-Alt-Delete sequence for the graphical user interface:

    [org/gnome/settings-daemon/plugins/media-keys]

    logout=''''

    Update the dconf settings:

    # dconf update'
  checks:
  - type: manual_review
    info: 'Verify the Ubuntu operating system is not configured to reboot the system when Ctrl-AltDelete is pressed when using
