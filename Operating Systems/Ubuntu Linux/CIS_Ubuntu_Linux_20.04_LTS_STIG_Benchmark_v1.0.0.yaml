    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DoD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, non-organization-controlled network. Remote access methods include, for example, dial-up, broadband, and
    wireless. Automated monitoring of remote access sessions allows organizations to detect cyber attacks and also ensure
    ongoing compliance with remote access policies by auditing connection activities of remote access capabilities, such as
    Remote Desktop Protocol (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers,
    smartphones, and tablets).
  impact: ''
  references: []
  page_start: 579
  audit_raw: 'Verify that the Ubuntu operating system monitors all remote access methods.

    Check that remote access methods are being logged by running the following command:

    # grep -E -r ''^(auth,authpriv\.\*|daemon\.\*)'' /etc/rsyslog.*

    /etc/rsyslog.d/50-default.conf:auth,authpriv.* /var/log/auth.log

    /etc/rsyslog.d/50-default.conf:daemon.notice /var/log/messages

    If "auth.", "authpriv.", or "daemon.*" are not configured to be logged in at least one of the

    config files, this is a finding.

    579 | P a g e'
  remediation: 'Configure the Ubuntu operating system to monitor all remote access methods by adding

