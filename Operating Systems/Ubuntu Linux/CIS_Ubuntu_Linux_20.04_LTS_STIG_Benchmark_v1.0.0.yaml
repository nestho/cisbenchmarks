- id: 6.1.15
  title: Ensure system command files are 0755 or more restrictive
  scoring: scored
  profile: []
  description: The operating system must have system commands set to a mode of 0755 or less permissive.
  rationale: If the Ubuntu operating system were to allow any user to make changes to software libraries, then those changes
    might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management
    process. This requirement applies to Ubuntu operating systems with software libraries that are accessible and configurable,
    as in the case of interpreted languages. Software libraries also include privileged programs which execute with escalated
    privileges. Only qualified and authorized individuals must be allowed to obtain access to information system components
    for purposes of initiating changes, including upgrades and modifications.
  impact: ''
  references: []
  page_start: 838
  audit_raw: 'Verify the system commands contained in the following directories have mode 0755 or less

    permissive:

    /bin

    /sbin

    /usr/bin

    /usr/sbin

    /usr/local/bin

    /usr/local/sbin

    Check that the system command files have mode 0755 or less permissive with the

    following command:

    # find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm

    /022 -type f -exec stat -c "%n %a" ''{}'' \;

    If any files are found to be group-writable or world-writable, this is a finding.

    838 | P a g e'
  remediation: 'Configure the system commands to be protected from unauthorized access. Run the

    following command:

    # find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm

    /022 -type f -exec chmod 755 ''{}'' \;'
