    severity: medium
- id: 1.1.24
  title: Disable USB Storage
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'USB storage provides a means to transfer and store files insuring persistence and availability of the files
    independent of network connection status. Its popularity and utility has led to USB-based malware being a simple and common
    means for network infiltration and a first step to establishing a persistent threat within a networked environment. Note:
    An alternative solution to disabling the usb-storage module may be found in USBGuard. Use of USBGuard and construction
    of USB device policies should be done in alignment with site policy.'
  rationale: Restricting USB access on the system will decrease the physical attack surface for a device and diminish the
    possible vectors to introduce malware.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v usb-storage

    install /bin/true

    # lsmod | grep usb-storage

    <No output>

    85 | P a g e'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vi /etc/modprobe.d/usb_storage.conf

    and add the following line:

    install usb-storage /bin/true

    Run the following command to unload the usb-storage module:

    rmmod usb-storage'
  checks:
