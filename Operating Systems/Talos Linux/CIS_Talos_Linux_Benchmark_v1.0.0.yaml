- id: 5.4.1
  title: Enable KubeSpan where network level encryption is required
  scoring: manual
  profile:
  - Level 1 - Server
  description: KubeSpan securely and transparently establishes full encryption between all members of a cluster – even if
    they are running on completely different networks and behind firewalls. All cluster members will find each other, and
    automatically update reachability information. KubeSpan operates outside of Kubernetes. It works with any CNI, and even
    if Kubernetes is not ready or broken. KubeSpan provides full Wireguard based encryption for all traffic with the Kubernetes
    cluster, automatically. KubeSpan uses UDP port 51820 to carry all KubeSpan encrypted traffic. Thus best practice is to
    ensure that one end of all possible node-node communication paths allows UDP port 51820, inbound. KubeSpan adds no value
    in a single node cluster.
  rationale: Encryption of network traffic provides defense against untrusted networks or bad actors with access to the physical
    network infrastructure. Ensuring traffic is encrypted prevents such actors obtaining confidential information such as
    security tokens, certificates, or passwords.
  impact: Enabling Wireguard encryption adds overhead and reduces network throughput.
  references:
  - 1. https://www.talos.dev/latest/talos-guides/network/kubespan/
  page_start: 64
  audit_raw: 'Ensure each node reports a KubeSpan identity:

    talosctl get kubespanidentities

