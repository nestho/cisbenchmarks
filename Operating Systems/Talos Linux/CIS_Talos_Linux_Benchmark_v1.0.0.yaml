    nVHu7l13uZyk0AaI1WuzL2/48iG8af4WRv+LWmAax1M= 60 talos-defaultworker-2

    172.20.0.6:51820 up 130072 46888'
  remediation: "To enable KubeSpan for a new cluster, we can use the --with-kubespan flag in\ntalosctl gen config to generate\
    \ the appropriate configurations.\nTo enable KubeSpan on each node in an existing cluster:\nCreate a patch file with the\
    \ machine configuration to enable KubeSpan:\ncat <<EOF > kubespanPatch.yaml\nmachine:\n network:\n kubespan:\n enabled:\
    \ true\ncluster:\n discovery:\n enabled: true\nEOF\nApply the patch to the nodes:\ntalosctl patch mc --patch @kubespanPatch.yaml"
  checks:
