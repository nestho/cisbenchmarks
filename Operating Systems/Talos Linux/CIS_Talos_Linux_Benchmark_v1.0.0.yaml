  id: cis-talos-linux-benchmark
  title: CIS Talos Linux Benchmark
  version: 1.0.0
  technology: Talos Linux
  category: Operating Systems
  os: Talos Linux
  source_pdf: CIS_Talos_Linux_Benchmark_v1.0.0.pdf
  total_pages: 82
  controls_count: 21
controls:
- id: 1.1.1
  title: Install Talos with SecureBoot enabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'Secure Boot is a standard that ensures systems boot only to a trusted operating system. Talos supports booting
    UEFI systems in SecureBoot mode. When combined with TPMbased disk encryption, this provides Trusted Boot experience. Note:
    SecureBoot is not supported on x86 platforms in BIOS mode. The implementation uses systemd-boot as a boot menu implementation,
    while the Talos kernel, initramfs and cmdline arguments are combined into the Unified Kernel Image (UKI) format. UEFI
    firmware loads the systemd-boot bootloader, which then loads the UKI image. Both systemd-boot and Talos UKI image are
    signed with the key, which is enrolled into the UEFI firmware. As Talos Linux is fully contained in the UKI image, the
    full operating system is verified and booted by the UEFI firmware.'
  rationale: Enabling SecureBoot ensures that only signed and validated Talos images are able to be loaded and, in conjunction
    with a TPM2 module, decrypt the disk.
  impact: ''
  references: []
  page_start: 14
  audit_raw: "$ talosctl -n <IP> get securitystate\nNODE NAMESPACE TYPE ID VERSION SECUREBOOT\n runtime SecurityState securitystate\
    \ 1 true\nConfirm that SECUREBOOT shows as true.\nNote that the --insecure flag will be necessary if the system is not\
    \ yet part of a\nKubernetes cluster."
  remediation: 'Ensure Talos Linux is installed and booted from images that support SecureBoot, as per

    the documentation:

    https://www.talos.dev/latest/talos-guides/install/bare-metal-platforms/secureboot

    Note that secureboot images signed by SideroLabs are available for all platforms, or

    enterprises may sign their own images. Additional steps are usually required with cloud

    provider platforms to register the Sidero signing keys.'
  checks:
  - type: manual_review
    info: "$ talosctl -n <IP> get securitystate\nNODE NAMESPACE TYPE ID VERSION SECUREBOOT\n runtime SecurityState securitystate\
      \ 1 true\nConfirm that SECUREBOOT shows as true.\nNote that the --insecure flag will be necessary if the system is not\
      \ yet part of a\nKubernetes cluster."
    severity: medium
- id: 1.2.1
  title: Encrypt System Disks with KMS or TPM methods
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'It is possible to enable encryption for the STATE and EPHEMERAL partitions of the system disks at the OS level.
    The STATE partition contains the most sensitive node data: secrets and cluster certificates. The EPHEMERAL partition may
    contain sensitive workload data. Data is encrypted using LUKS2, which is provided by the Linux kernel modules and cryptsetup
    utility. Talos Linux supports four encryption methods, which can be combined together for a single partition: • static
    - encrypt with the static passphrase (weakest protection, for STATE partition encryption it means that the passphrase
    will be stored in the META partition, which is not encrypted, and thus can be trivially bypassed). • nodeID - encrypt
    with the key derived from the node UUID (this protects against data being leaked or recovered from a drive that has been
    physically removed from a Talos Linux node, but does not protect the data from access in the same system.). • kms - encrypt
    using a key sealed with a network KMS (strong, but requires network access to decrypt the data.) • tpm - encrypt with
    the key derived from the hardware TPM (strong, when used with SecureBoot). It is recommended to use KMS or TPM methods
    if available.'
  rationale: Encrypting the partitions can prevent an attacker with physical access to the machine, or the ability to boot
    an alternate operating system remotely, from being able to retrieve data such as cluster certificates and other information
    that can be used to compromise a cluster.
  impact: 'If using a network KMS, then a node will be unable to boot if the KMS system is unreachable at the time of boot.
    If a system is configured to use TPM encryption without suitable TPM2.0 supporting hardware, it will fail during the install
    process with the message "failed to call key handler at slot 0: stat /dev/tpm0: no such file or directory", and then revert
    back to maintenance mode.'
  references: []
  page_start: 17
  audit_raw: "talosctl read /system/state/config.yaml | yq '.machine.systemDiskEncryption'\nThe keys entries should have values\
    \ of tpm or kms in order to pass.\nFor example:\nsystemDiskEncryption:\n ephemeral:\n provider: luks2\n keys:\n - slot:\
    \ 0\n tpm: {}\n state:\n provider: luks2\n keys:\n - slot: 0\n tpm: {}"
  remediation: "Because there is no in-place encryption of the STATE partition, it is recommended to\nset up encryption during\
    \ the initial install of a Talos Linux machine.\nUsing Omni\nThe simplest way to enable disk encryption is if Omni is\
    \ in use to manage the Talos\nLinux machines. In this case, simply specify the check-box \"Encrypt Disks\", under\nCluster\
    \ Features, when creating the cluster in the Omni UI. All nodes that join the\ncluster will have encryption enabled, using\
    \ Omni as the KMS. This can also be achieved\nusing cluster templates, by setting:\nfeatures:\n diskencryption: true\n\
    via Machine Configurations\nIf using SecureBoot, apply the following patch to enable TPM based disk encryption:\n# tpm-disk-encryption.yaml\n\
    machine:\n systemDiskEncryption:\n ephemeral:\n provider: luks2\n keys:\n - slot: 0\n tpm: {}\n state:\n provider: luks2\n\
    \ keys:\n - slot: 0\n tpm: {}\nApply the following to enable a network KMS:\nsystemDiskEncryption:\n state:\n provider:\
    \ luks2\n keys:\n - kms:\n endpoint: https://192.168.88.21:4443\n slot: 0\n ephemeral:\n provider: luks2\n keys:\n - kms:\n\
    \ endpoint: https://192.168.88.21:4443\n slot: 0"
  checks:
  - type: manual_review
    info: "talosctl read /system/state/config.yaml | yq '.machine.systemDiskEncryption'\nThe keys entries should have values\
      \ of tpm or kms in order to pass.\nFor example:\nsystemDiskEncryption:\n ephemeral:\n provider: luks2\n keys:\n - slot:\
      \ 0\n tpm: {}\n state:\n provider: luks2\n keys:\n - slot: 0\n tpm: {}"
    severity: medium
- id: '1.3'
  title: Ensure updated software is installed
  scoring: manual
  profile:
  - Level 1 - Server
  description: Periodically, software updates are released for included software either due to security flaws or to include
    additional functionality or bug fixes.
  rationale: Talos Linux is regularly updated to incorporate the latest Linux Kernel, Kubernetes versions, Talos bug fixes
    and other improvements. It is recommended to always run and upgrade to the latest stable release of Talos Linux. Users
    can be notified of the availability of new Talos Linux releases by subscribing to release-notifications on the Talos Linux
    GitHub repository. Similarly, it is recommended to run and upgrade to the latest stable Kubernetes release on all clusters.
    As with any software installation, organizations need to determine if a given update meets their requirements and verify
    the compatibility and supportability of any additional software against the update revision that is selected.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify there are no updates to install by comparing the output of:

    talosctl version

    With the most recent available stable release in the Talos Linux github repository.'
  remediation: Update Talos Linux as per https://www.talos.dev/latest/talos-guides/upgrading-talos/
  checks:
  - type: manual_review
    info: 'Verify there are no updates to install by comparing the output of:

      talosctl version

      With the most recent available stable release in the Talos Linux github repository.'
    severity: medium
- id: '2.1'
  title: Ensure NTP is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: The Talos Linux daemon machined implements the Network Time Protocol (NTP). NTP is designed to synchronize
    system clocks across a variety of systems and use a source that is highly accurate.
  rationale: Proper configuration of NTP is vital to ensuring time synchronization is working properly. By default, Talos
    Linux installs with a single time server referenced, which is currently time.cloudflare.com.
  impact: ''
  references: []
  page_start: 24
  audit_raw: "Run the following command and verify that at least two time servers are configured:\n# talosctl get TimeServer\
    \ -o yaml\nnode: 192.168.64.118\nmetadata:\n namespace: network\n type: TimeServerStatuses.net.talos.dev\n id: timeservers\n\
    \ version: 3\n owner: network.TimeServerSpecController\n phase: running\n created: 2024-06-04T04:05:47Z\n updated: 2024-06-05T17:50:14Z\n\
    spec:\n timeServers:\n - 2.pool.ntp.org\n - time.cloudflare.com\nThe synchronization status of the system can be checked\
    \ with:\n#talosctl get timestatus -o yaml\nnode: 192.168.64.118\nmetadata:\n namespace: runtime\n type: TimeStatuses.v1alpha1.talos.dev\n\
    \ id: node\n version: 20\n owner: time.SyncController\n phase: running\n created: 2024-06-04T04:05:47Z\n updated: 2024-06-05T14:45:14Z\n\
    spec:\n synced: true\n epoch: 18\n syncDisabled: false"
  remediation: "Configure additional time servers as needed.\nThe following commands would add \"2.pool.ntp.org\" to the list\
    \ of time servers.\nNote that if the system is using the default time server, then defining a time server in the\nmachine\
    \ configuration will replace the default. (i.e. the operation below would replace\nthe default time server, not append\
    \ it to the list of time servers, if there is currently no\ntime server specified in the machine configuration.)\nExecute\
    \ the following command to create a patch to update the time servers:\n# cat <<EOF > time-servers.yaml\nmachine:\n time:\n\
    \ servers:\n - 2.pool.ntp.org\nEOF\nThen apply the patch to the machine to activate the new configuration:\ntalosctl patch\
    \ mc --patch @time-servers.yaml"
  checks:
  - type: manual_review
    info: "Run the following command and verify that at least two time servers are configured:\n# talosctl get TimeServer\
      \ -o yaml\nnode: 192.168.64.118\nmetadata:\n namespace: network\n type: TimeServerStatuses.net.talos.dev\n id: timeservers\n\
      \ version: 3\n owner: network.TimeServerSpecController\n phase: running\n created: 2024-06-04T04:05:47Z\n updated: 2024-06-05T17:50:14Z\n\
      spec:\n timeServers:\n - 2.pool.ntp.org\n - time.cloudflare.com\nThe synchronization status of the system can be checked\
      \ with:\n#talosctl get timest"
    severity: medium
- id: '3.1'
  title: Ensure control plane scheduling is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: Control plane scheduling allows workloads to run on control plane nodes.
  rationale: Restricting access to control plane nodes is vital to ensuring that sensitive data (e.g. encryption secrets,
    PKI, etc.) is not exposed. Allowing workload scheduling on control plane nodes may enable workloads to access sensitive
    data present on control plane nodes, and may also adversely impact control plane node stability (if workloads consume
    excess CPU or Memory resources.)
  impact: Preventing workloads from running on control plane nodes excludes control plane compute resources from the set available
    for workloads.
  references:
  - 1. null
  page_start: 29
  audit_raw: 'Run the following command against a control plane node and verify that control plane

    scheduling is disabled:

    # talosctl read /system/state/config.yaml | yq

    ''.cluster.allowSchedulingOnControlPlanes | select(. != null)''

    false'
  remediation: "The following commands would disable control plane scheduling.\nCreate a patch to disallow scheduling on control\
    \ planes:\ncat <<EOF > disallowSchedulingPatch.yaml\ncluster:\n allowSchedulingOnControlPlanes: false\nEOF\nThen apply\
    \ the patch to the machine:\ntalosctl patch mc --patch @disallowSchedulingPatch.yaml"
  checks:
  - type: manual_review
    info: 'Run the following command against a control plane node and verify that control plane

      scheduling is disabled:

      # talosctl read /system/state/config.yaml | yq

      ''.cluster.allowSchedulingOnControlPlanes | select(. != null)''

      false'
    severity: medium
- id: '3.2'
  title: Ensure Pod Security Standards policy is restricted
  scoring: scored
  profile:
  - Level 1 - Server
  description: Kubernetes Pod Security Standards define different isolation levels for Pods. These standards let you define
    how you want to restrict the behavior of pods in a clear, consistent fashion.
  rationale: Restricting workloads is vital to ensure that workloads adhere to the principle of least privilege. The Restricted
    policy is aimed at enforcing current Pod hardening best practices, at the expense of some compatibility. It is targeted
    at operators and developers of security-critical applications, as well as lower-trust users.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Run the following command and verify that workloads are restricted:

    # talosctl get admissioncontrolconfigs.kubernetes.talos.dev admission-control

    -o yaml | yq ''.spec.config[0].configuration.defaults.enforce''

    restricted'
  remediation: "The following commands would enable the restricted policy for workloads:\nCreate a patch that defines the\
    \ policy:\ncat <<EOF > admissionPatch.yaml\ncluster:\n apiServer:\n admissionControl:\n - name: PodSecurity\n configuration:\n\
    \ defaults:\n enforce: restricted\nEOF\nThen apply the patch to the machines:\ntalosctl patch mc --patch @admissionPatch.yaml"
  checks:
  - type: manual_review
    info: 'Run the following command and verify that workloads are restricted:

      # talosctl get admissioncontrolconfigs.kubernetes.talos.dev admission-control

      -o yaml | yq ''.spec.config[0].configuration.defaults.enforce''

      restricted'
    severity: medium
- id: '4.1'
  title: Ensure RBAC is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: RBAC allows granular control over permissions for users.
  rationale: RBAC is vital to ensure that the principle of least privilege is adhered to.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Run the following command and verify that RBAC is enabled:

    # talosctl read /system/state/config.yaml | yq ''.machine.features.rbac |

    select(. != null) ''

    true'
  remediation: "Generate a new client configuration access file with the role of os:admin.\n(Additional configurations and\
    \ certificates for different roles can be generated by\npassing --roles flag.)\ntalosctl config new --roles=os:admin admin\n\
    The above command will create a new client configuration file admin with a new\ncertificate with os:admin role.\nThe following\
    \ commands would then enable RBAC:\nCreate a patch:\ncat <<EOF > rbacPatch.yaml\nmachine:\n features:\n rbac: true\nEOF\n\
    Then apply the patch to the machines:\ntalosctl patch mc --patch @rbacPatch.yaml\nEnabling RBAC will reboot the node"
  checks:
  - type: manual_review
    info: 'Run the following command and verify that RBAC is enabled:

      # talosctl read /system/state/config.yaml | yq ''.machine.features.rbac |

      select(. != null) ''

      true'
    severity: medium
- id: 5.1.1
  title: Ensure packet redirect sending is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: ICMP Redirects are used to send routing information to other hosts. As a host itself does not act as a router
    (in a host only configuration), there is no need to send redirects.
  rationale: An attacker could use a compromised host to send invalid ICMP redirects to other router devices in an attempt
    to corrupt routing and have users access a system set up by the attacker as opposed to a valid system.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Run the following commands and verify output matches:

    # talosctl read /proc/sys/net/ipv4/conf/all/send_redirects

    0

    # talosctl read /proc/sys/net/ipv4/conf/default/send_redirects

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ to disable sending redirects:\n# cat <<EOF > send-redirects.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.send_redirects:\
    \ \"0\"\n net.ipv4.conf.default.send_redirects: \"0\"\nEOF\nApply the patch to the machines:\ntalosctl patch mc --patch\
    \ @send-redirects.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # talosctl read /proc/sys/net/ipv4/conf/all/send_redirects

      0

      # talosctl read /proc/sys/net/ipv4/conf/default/send_redirects

      0'
    severity: medium
- id: 5.2.1
  title: Ensure source routed packets are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  description: In networking, source routing allows a sender to partially or fully specify the route packets take through
    a network. In contrast, non-source routed packets travel a path determined by routers in the network. In some cases, systems
    may not be routable or reachable from some locations (e.g. private addresses vs. Internet routable), and so source routed
    packets would need to be used.
  rationale: Setting net.ipv4.conf.all.accept_source_route, net.ipv4.conf.default.accept_source_route, net.ipv6.conf.all.accept_source_route
    and net.ipv6.conf.default.accept_source_route to 0 disables the system from accepting source routed packets. Assume this
    system was capable of routing packets to Internet routable addresses on one interface and private addresses on another
    interface. Assume that the private addresses were not routable to the Internet routable addresses and vice versa. Under
    normal routing circumstances, an attacker from the Internet routable addresses could not use the system as a way to reach
    the private address systems. If, however, source routed packets were allowed, they could be used to gain access to the
    private address systems as the route could be specified, rather than rely on routing protocols that did not allow this
    routing.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Run the following commands and verify output matches:

    talosctl read /proc/sys/net/ipv4/conf/all/accept_source_route

    0

    talosctl read /proc/sys/net/ipv4/conf/default/accept_source_route

    0

    talosctl read /proc/sys/net/ipv6/conf/default/accept_source_route

    0

    talosctl read /proc/sys/net/ipv6/conf/all/accept_source_route

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ file:\n# cat <<EOF > reject-sourceroutes.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.accept_source_route: \"0\"\n\
    \ net.ipv4.conf.default.accept_source_route: \"0\"\n net.ipv6.conf.all.accept_source_route: \"0\"\n net.ipv6.conf.default.accept_source_route:\
    \ \"0\"\nEOF\nApply the patch file to the machines:\ntalosctl patch mc --patch @reject-sourceroutes.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      talosctl read /proc/sys/net/ipv4/conf/all/accept_source_route

      0

      talosctl read /proc/sys/net/ipv4/conf/default/accept_source_route

      0

      talosctl read /proc/sys/net/ipv6/conf/default/accept_source_route

      0

      talosctl read /proc/sys/net/ipv6/conf/all/accept_source_route

      0'
    severity: medium
- id: 5.2.2
  title: Ensure ICMP redirects are not accepted
  scoring: scored
  profile:
  - Level 2 - Server
  description: ICMP redirect messages are packets that convey routing information and tell your host (acting as a router)
    to send packets via an alternate path. It is a way of allowing an outside routing device to update your system routing
    tables. By setting accept_redirects to 0, the system will not accept any ICMP redirect messages, and therefore, won't
    allow outsiders to update the system's routing tables.
  rationale: Attackers could use bogus ICMP redirect messages to maliciously alter the system routing tables and get them
    to send packets to incorrect networks and allow your system packets to be captured.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Run the following commands and verify output matches:

    # talosctl read /proc/sys/net/ipv4/conf/all/accept_redirects

    0

    # talosctl read /proc/sys/net/ipv4/conf/default/accept_redirects

    0

    # talosctl read /proc/sys/net/ipv6/conf/all/accept_redirects

    0

    # talosctl read /proc/sys/net/ipv6/conf/default/accept_redirects

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ with the sysctls to disable accepting redirects on both ipv4 and ipv6,\nfor new and existing interfaces:\n# cat <<EOF\
    \ > accept-redirects.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.accept_redirects: \"0\"\n net.ipv4.conf.default.accept_redirects:\
    \ \"0\"\n net.ipv6.conf.all.accept_redirects: \"0\"\n net.ipv6.conf.default.accept_redirects: \"0\"\nEOF\nThen apply the\
    \ patch to the machines:\ntalosctl patch mc --patch @accept-redirects.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # talosctl read /proc/sys/net/ipv4/conf/all/accept_redirects

      0

      # talosctl read /proc/sys/net/ipv4/conf/default/accept_redirects

      0

      # talosctl read /proc/sys/net/ipv6/conf/all/accept_redirects

      0

      # talosctl read /proc/sys/net/ipv6/conf/default/accept_redirects

      0'
    severity: medium
- id: 5.2.3
  title: Ensure secure ICMP redirects are not accepted
  scoring: scored
  profile:
  - Level 2 - Server
  description: Secure ICMP redirects are the same as ICMP redirects, except they come from gateways listed on the default
    gateway list. It is assumed that these gateways are known to your system, and that they are likely to be secure.
  rationale: It is still possible for even known gateways to be compromised. Setting net.ipv4.conf.all.secure_redirects to
    0 protects the system from routing table updates by possibly compromised known gateways.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Run the following commands and verify output matches:

    # talosctl read /proc/sys/net/ipv4/conf/all/secure_redirects

    0

    # talosctl read /proc/sys/net/ipv4/conf/default/secure_redirects

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ file to disable redirects, for both new and existing interfaces:\n# cat <<EOF > secure-redirects.yaml\nmachine:\n sysctls:\n\
    \ net.ipv4.conf.all.secure_redirects: \"0\"\n net.ipv4.conf.default.secure_redirects: \"0\"\nEOF\nThen apply the patch\
    \ to the machine, to effect both changes:\ntalosctl patch mc --patch @secure-redirects.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # talosctl read /proc/sys/net/ipv4/conf/all/secure_redirects

      0

      # talosctl read /proc/sys/net/ipv4/conf/default/secure_redirects

      0'
    severity: medium
- id: 5.2.4
  title: Ensure suspicious (martian) packets are logged
  scoring: scored
  profile:
  - Level 2 - Server
  description: When enabled, this feature logs packets with un-routable source addresses (so called "martian packets") to
    the kernel log.
  rationale: Enabling this feature and logging these packets allows an administrator to investigate the possibility that an
    attacker is sending spoofed packets to their system.
  impact: Note that extra message logging can cause log buffers to fill and rotate more quickly, possibly making it harder
    to track events locally.
  references: []
  page_start: 46
  audit_raw: 'Run the following commands and verify output matches:

    # talosctl read /proc/sys/net/ipv4/conf/all/log_martians

    1

    # talosctl read /proc/sys/net/ipv4/conf/default/log_martians

    1'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ to define the changes in the machine config to log martian packets:\ncat <<EOF > log-martians.yaml\nmachine:\n sysctls:\n\
    \ net.ipv4.conf.all.log_martians: \"1\"\n net.ipv4.conf.default.log_martians: \"1\"\nEOF\nApply the patch to the machines:\n\
    talosctl patch mc --patch @log-martians.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # talosctl read /proc/sys/net/ipv4/conf/all/log_martians

      1

      # talosctl read /proc/sys/net/ipv4/conf/default/log_martians

      1'
    severity: medium
- id: 5.2.5
  title: Ensure broadcast ICMP requests are ignored
  scoring: scored
  profile:
  - Level 1 - Server
  description: Setting net.ipv4.icmp_echo_ignore_broadcasts to 1 will cause the system to ignore all ICMP echo and timestamp
    requests to broadcast and multicast addresses.
  rationale: Accepting ICMP echo and timestamp requests with broadcast or multicast destinations for your network could be
    used to trick your host into starting (or participating) in a Smurf attack. A Smurf attack relies on an attacker sending
    large amounts of ICMP broadcast messages with a spoofed source address. All hosts receiving this message and responding
    would send echo-reply messages back to the spoofed address, which is probably not routable. If many hosts respond to the
    packets, the amount of traffic on the network could be significantly multiplied.
  impact: Disabling icmp responses to the broadcast address will make network mapping harder, and may impact some network
    management tools.
  references: []
  page_start: 48
  audit_raw: 'Run the following command and verify output matches:

    # talosctl read /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    1'
  remediation: "Run the following commands to set the active kernel parameter and persist the setting:\nCreate the patch file\
    \ that will amend the machine configuration to ignore icmp packets\nto broadcast addresses:\n# cat <<EOF > icmp-echo-ignore-broadcasts.yaml\n\
    machine:\n sysctls:\n net.ipv4.icmp_echo_ignore_broadcasts: \"1\"\nEOF\nApply the patch to machines:\ntalosctl patch mc\
    \ --patch @icmp-echo-ignore-broadcasts.yaml"
  checks:
  - type: manual_review
    info: 'Run the following command and verify output matches:

      # talosctl read /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

      1'
    severity: medium
- id: 5.2.6
  title: Ensure bogus ICMP responses are ignored
  scoring: scored
  profile:
  - Level 1 - Server
