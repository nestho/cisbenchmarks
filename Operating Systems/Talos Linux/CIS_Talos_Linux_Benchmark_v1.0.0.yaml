    \ sysctls:\n# cat <<EOF > reversepath-filter.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.rp_filter: \"1\"\n net.ipv4.conf.default.rp_filter:\
    \ \"1\"\nEOF\nThen apply the patch to machines:\ntalosctl patch mc --patch @reversepath-filter.yaml"
  checks:
