- id: 5.2.7
  title: Ensure TCP SYN Cookies is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: When tcp_syncookies is set, the kernel will handle TCP SYN packets normally until the half-open connection
    queue is full, at which time, the SYN cookie functionality kicks in. SYN cookies work by not using the SYN queue at all.
    Instead, the kernel simply replies to the SYN with a SYN|ACK, but will include a specially crafted TCP sequence number
    that encodes the source and destination IP address and port number and the time the packet was sent. A legitimate connection
    would send the ACK packet of the three way handshake with the specially crafted sequence number. This allows the system
    to verify that it has received a valid response to a SYN cookie and allow the connection, even though there is no corresponding
    SYN in the queue.
  rationale: Attackers use SYN flood attacks to perform a denial of service attacked on a system by sending many SYN packets
    without completing the three way handshake. This will quickly use up slots in the kernel's half-open connection queue
    and prevent legitimate connections from succeeding. SYN cookies allow the system to keep accepting valid connections,
    even if under a denial of service attack.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'Run the following command and verify output matches:

    # talosctl read /proc/sys/net/ipv4/tcp_syncookies

    1'
  remediation: "Run the following commands to set the active kernel parameter and persist the setting:\nCreate the patch to\
    \ enable syncookies:\n# cat <<EOF > enable_syncookies.yaml\nmachine:\n sysctls:\n net.ipv4.tcp_syncookies: \"1\"\nEOF\n\
    Then apply the patch to the machines:\ntalosctl patch mc --patch @enable_syncookies.yaml"
  checks:
  - type: manual_review
    info: 'Run the following command and verify output matches:

      # talosctl read /proc/sys/net/ipv4/tcp_syncookies

      1'
    severity: medium
- id: 5.2.8
  title: Enable Reverse Path Filtering if there are only symmetrical routes
  scoring: scored
  profile:
  - Level 2 - Server
  description: Setting net.ipv4.conf.all.rp_filter and net.ipv4.conf.default.rp_filter to 1 forces the Linux kernel to utilize
    reverse path filtering on a received packet to determine if the packet was valid. Essentially, with reverse path filtering,
    if the return packet does not go out the same interface that the corresponding source packet came from, the packet is
    dropped (and logged if log_martians is set).
  rationale: Setting these flags is a good way to deter attackers from sending your system bogus packets that cannot be responded
    to.
  impact: One instance where this feature breaks down is if asymmetrical routing is employed. This would occur when using
    dynamic routing protocols (bgp, ospf, etc) on your system. If you are using asymmetrical routing on your system, you will
    not be able to enable this feature without breaking the routing.
  references: []
